    .toggle-switch::after {

<body>
  <!-- Decorative floating dots -->
  <div class="deco-dots">
    <div class="deco-dot" style="width:120px;height:120px;background:var(--accent2);top:5%;left:-5%;"></div>
    <div class="deco-dot" style="width:80px;height:80px;background:var(--accent4);top:40%;right:-3%;"></div>
    <div class="deco-dot" style="width:60px;height:60px;background:var(--accent3);bottom:10%;left:5%;"></div>
  </div>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1><i class="fa-solid fa-dice header-icon"></i> 选择困难症救星</h1>
      <p>让命运帮你做决定，从此告别纠结 <i class="fa-solid fa-wand-magic-sparkles sparkle-icon"></i></p>
    </header>

    <!-- Input Card -->
    <div class="card">
      <div class="card-title"><span class="title-icon icon-edit"><i class="fa-solid fa-pen-to-square"></i></span> 输入你的选项</div>
      <textarea id="optionsInput" placeholder="每行输入一个选项，例如：&#10;火锅&#10;烧烤&#10;日料&#10;西餐&#10;&#10;也支持逗号分隔：火锅, 烧烤, 日料"></textarea>
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
        <span class="input-hint">支持换行或逗号分隔</span>
        <span class="option-count" id="optionCount" style="display:none;"><span class="dot"></span> 已输入 <span id="countNum">0</span> 个选项</span>
      </div>
      <div class="presets">
        <button class="preset-btn" onclick="fillPreset('today')"><i class="fa-solid fa-utensils"></i> 今天吃什么</button>
        <button class="preset-btn" onclick="fillPreset('movie')"><i class="fa-solid fa-film"></i> 看什么电影</button>
        <button class="preset-btn" onclick="fillPreset('drink')"><i class="fa-solid fa-mug-hot"></i> 喝什么饮料</button>
        <button class="preset-btn" onclick="fillPreset('activity')"><i class="fa-solid fa-person-running"></i> 做什么运动</button>
      </div>
    </div>

    <!-- Weight Card -->
    <div class="card">
      <div class="weight-toggle" id="weightToggle" onclick="toggleWeight()">
        <span class="weight-toggle-label"><i class="fa-solid fa-scale-balanced label-icon"></i> 权重设置（可选）</span>
        <div class="toggle-switch" id="toggleSwitch"></div>
      </div>
      <div class="weight-panel" id="weightPanel">
        <div class="weight-list" id="weightList">
          <p class="history-empty">请先输入选项，再设置权重</p>
        </div>
      </div>
    </div>

    <!-- Pick Button -->
    <button class="btn-pick" id="pickBtn" onclick="startPick()">
      <span class="shine"></span>
      <i class="fa-solid fa-crosshairs btn-icon"></i> 帮我选！
    </button>

    <!-- Result Card -->
    <div class="card" style="margin-top: 1.25rem;">
      <div class="card-title"><span class="title-icon icon-target"><i class="fa-solid fa-bullseye"></i></span> 命运的选择</div>
      <div class="result-area" id="resultArea">
        <p class="result-placeholder" id="resultPlaceholder">
          <span class="placeholder-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
          点击上方按钮，让命运来决定~
        </p>
        <div class="result-display" id="resultDisplay">
          <div class="slot-container" id="slotContainer">
            <div class="slot-track" id="slotTrack"></div>
          </div>
          <div id="finalResult" style="display:none;">
            <div class="result-icon-area" id="resultIconArea">
              <i class="fa-solid fa-trophy" id="resultIcon"></i>
            </div>
            <div class="result-text" id="resultText"></div>
            <div class="result-sub" id="resultSub"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- History Card -->
    <div class="card" style="margin-top: 1.25rem;">
      <div class="history-header">
        <div class="card-title" style="margin-bottom:0;"><span class="title-icon icon-clock"><i class="fa-solid fa-clock-rotate-left"></i></span> 历史记录</div>
        <button class="btn-clear-history" onclick="clearHistory()"><i class="fa-solid fa-trash-can"></i> 清空</button>
      </div>
      <ul class="history-list" id="historyList">
        <li class="history-empty">
          <span class="empty-icon"><i class="fa-regular fa-face-smile-wink"></i></span>
          还没有记录，快来试试吧~
        </li>
      </ul>
    </div>
  </div>

  <script>
    // === State ===
    var pickHistory = [];
    var isPicking = false;
    var weightEnabled = false;
    var weights = {};

    // === Preset data ===
    var presets = {
      today: '火锅\n烧烤\n日料\n西餐\n川菜\n粤菜\n韩餐\n泰餐\n麻辣烫\n汉堡',
      movie: '科幻片\n喜剧片\n动作片\n爱情片\n悬疑片\n动画片\n恐怖片\n纪录片',
      drink: '奶茶\n咖啡\n果汁\n可乐\n柠檬水\n椰子水\n气泡水\n酸奶',
      activity: '跑步\n游泳\n骑车\n瑜伽\n跳绳\n篮球\n羽毛球\n散步'
    };

    // === Result icons (Font Awesome class names) ===
    var resultIcons = [
      'fa-trophy', 'fa-star', 'fa-crown', 'fa-heart', 'fa-fire',
      'fa-bolt', 'fa-gem', 'fa-medal', 'fa-rocket', 'fa-champagne-glasses'
    ];

    function fillPreset(key) {
      var input = document.getElementById('optionsInput');
      input.value = presets[key];
      input.dispatchEvent(new Event('input'));
    }

    // === Input parsing ===
    var optionsInput = document.getElementById('optionsInput');
    optionsInput.addEventListener('input', function() {
      parseOptions();
      if (weightEnabled) updateWeightUI();
    });

    function parseOptions() {
      var raw = optionsInput.value.trim();
      if (!raw) return [];
      var items = raw.split(/[\n,，]+/).map(function(s) {
        return s.trim().replace(/^[-·•、]\s*/, '');
      }).filter(function(s) { return s.length > 0; });
      var countEl = document.getElementById('optionCount');
      var numEl = document.getElementById('countNum');
      if (items.length > 0) {
        countEl.style.display = 'inline-flex';
        numEl.textContent = items.length;
      } else {
        countEl.style.display = 'none';
      }
      return items;
    }

    // === Weight ===
    function toggleWeight() {
      weightEnabled = !weightEnabled;
      var sw = document.getElementById('toggleSwitch');
      var panel = document.getElementById('weightPanel');
      if (weightEnabled) {
        sw.classList.add('active');
        panel.classList.add('open');
        updateWeightUI();
      } else {
        sw.classList.remove('active');
        panel.classList.remove('open');
      }
    }

    function updateWeightUI() {
      var items = parseOptions();
      var listEl = document.getElementById('weightList');
      if (items.length === 0) {
        listEl.innerHTML = '<p class="history-empty">请先输入选项，再设置权重</p>';
        return;
      }
      var html = '';
      items.forEach(function(item) {
        var w = weights[item] || 1;
        html += '<div class="weight-item">' +
          '<span class="weight-item-name">' + escapeHtml(item) + '</span>' +
          '<input type="range" class="weight-slider" min="1" max="10" value="' + w + '" ' +
            'oninput="setWeight(\'' + escapeAttr(item) + '\', this.value)">' +
          '<span class="weight-value" id="wv_' + hashStr(item) + '">' + w + '</span>' +
          '</div>';
      });
      listEl.innerHTML = html;
    }

    function setWeight(name, val) {
      weights[name] = parseInt(val);
      document.getElementById('wv_' + hashStr(name)).textContent = val;
    }

    function hashStr(s) {
      var h = 0;
      for (var i = 0; i < s.length; i++) {
        h = ((h << 5) - h) + s.charCodeAt(i);
        h |= 0;
      }
      return Math.abs(h);
    }

    // === Main pick ===
    function startPick() {
      if (isPicking) return;

      var items = parseOptions();
      if (items.length < 2) {
        shakeElement(document.getElementById('pickBtn'));
        return;
      }

      isPicking = true;
      var btn = document.getElementById('pickBtn');
      btn.disabled = true;

      var placeholder = document.getElementById('resultPlaceholder');
      var display = document.getElementById('resultDisplay');
      var finalResult = document.getElementById('finalResult');
      var slotContainer = document.getElementById('slotContainer');

      placeholder.style.display = 'none';
      display.classList.remove('show');
      finalResult.style.display = 'none';
      display.style.display = 'block';

      // weighted random
      var chosenIndex;
      if (weightEnabled) {
        var totalWeight = 0;
        var wList = [];
        items.forEach(function(item, i) {
          var w = weights[item] || 1;
          totalWeight += w;
          wList.push({ item: item, weight: w, index: i });
        });
        var rand = Math.random() * totalWeight;
        var cumulative = 0;
        for (var i = 0; i < wList.length; i++) {
          cumulative += wList[i].weight;
          if (rand <= cumulative) {
            chosenIndex = wList[i].index;
            break;
          }
        }
        if (chosenIndex === undefined) chosenIndex = items.length - 1;
      } else {
        chosenIndex = Math.floor(Math.random() * items.length);
      }

      var chosen = items[chosenIndex];

      // slot animation
      var slotTrack = document.getElementById('slotTrack');
      var itemH = 2.2;
      var rounds = 4;
      var sequence = [];
      for (var r = 0; r < rounds; r++) {
        items.forEach(function(item) { sequence.push(item); });
      }
      for (var i = 0; i <= chosenIndex; i++) {
        sequence.push(items[i]);
      }

      var slotHTML = '';
      sequence.forEach(function(item) {
        slotHTML += '<div class="slot-item">' + escapeHtml(item) + '</div>';
      });
      slotTrack.innerHTML = slotHTML;
      slotContainer.style.height = itemH + 'rem';

      var step = 0;
      var interval = 60;
      var currentInterval = 60;
      var totalSeq = sequence.length;

      function animateSlot() {
        slotTrack.style.transform = 'translateY(-' + (step * itemH) + 'rem)';
        step++;
        if (step < totalSeq) {
          var remaining = totalSeq - step;
          if (remaining < 5) {
            currentInterval += 80;
          } else if (remaining < 10) {
            currentInterval += 30;
          } else if (remaining < 15) {
            currentInterval += 10;
          }
          setTimeout(animateSlot, currentInterval);
        } else {
          setTimeout(function() {
            showFinalResult(chosen, items);
          }, 200);
        }
      }

      slotContainer.style.display = 'inline-block';
      animateSlot();
    }

    function showFinalResult(chosen, allItems) {
      var slotContainer = document.getElementById('slotContainer');
      var finalResult = document.getElementById('finalResult');
      var resultIcon = document.getElementById('resultIcon');
      var resultText = document.getElementById('resultText');
      var resultSub = document.getElementById('resultSub');
      var display = document.getElementById('resultDisplay');

      slotContainer.style.display = 'none';
      finalResult.style.display = 'block';

      // pick a random icon
      var iconClass = resultIcons[Math.floor(Math.random() * resultIcons.length)];
      resultIcon.className = 'fa-solid ' + iconClass;
      resultText.textContent = chosen;
      resultSub.textContent = '从 ' + allItems.length + ' 个选项中脱颖而出';

      display.classList.add('show');

      launchConfetti();
      addHistory(chosen);

      isPicking = false;
      document.getElementById('pickBtn').disabled = false;
    }

    // === History ===
    function addHistory(chosen) {
      var now = new Date();
      var timeStr = padZ(now.getHours()) + ':' + padZ(now.getMinutes()) + ':' + padZ(now.getSeconds());
      pickHistory.unshift({ text: chosen, time: timeStr });
      if (pickHistory.length > 10) pickHistory.pop();
      renderHistory();
    }

    function renderHistory() {
      var listEl = document.getElementById('historyList');
      if (pickHistory.length === 0) {
        listEl.innerHTML = '<li class="history-empty"><span class="empty-icon"><i class="fa-regular fa-face-smile-wink"></i></span>还没有记录，快来试试吧~</li>';
        return;
      }
      var html = '';
      pickHistory.forEach(function(item, i) {
        html += '<li class="history-item' + (i === 0 ? ' newest' : '') + '">' +
          '<span class="history-num">' + (i + 1) + '</span>' +
          '<span class="history-text">' + escapeHtml(item.text) + '</span>' +
          '<span class="history-time">' + item.time + '</span>' +
          '</li>';
      });
      listEl.innerHTML = html;
    }

    function clearHistory() {
      pickHistory = [];
      renderHistory();
    }

    // === Effects ===
    function launchConfetti() {
      var colors = ['#FF6B6B', '#FFA94D', '#51CF66', '#748FFC', '#FF69B4', '#FFD700', '#FF4500'];
      var count = 40;
      for (var i = 0; i < count; i++) {
        (function(index) {
          setTimeout(function() {
            createConfettiPiece(colors[index % colors.length]);
          }, index * 30);
        })(i);
      }
    }

    function createConfettiPiece(color) {
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.background = color;
      piece.style.left = (Math.random() * 100) + 'vw';
      piece.style.top = '-10px';
      piece.style.width = (6 + Math.random() * 8) + 'px';
      piece.style.height = (6 + Math.random() * 8) + 'px';
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      document.body.appendChild(piece);

      var duration = 1500 + Math.random() * 1500;
      var xDrift = (Math.random() - 0.5) * 200;
      var rotation = Math.random() * 720 - 360;

      piece.animate([
        { transform: 'translateY(0) translateX(0) rotate(0deg)', opacity: 1 },
        { transform: 'translateY(' + (window.innerHeight + 20) + 'px) translateX(' + xDrift + 'px) rotate(' + rotation + 'deg)', opacity: 0 }
      ], { duration: duration, easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)' })
      .onfinish = function() { piece.remove(); };
    }

    function shakeElement(el) {
      el.animate([
        { transform: 'translateX(0)' },
        { transform: 'translateX(-8px)' },
        { transform: 'translateX(8px)' },
        { transform: 'translateX(-4px)' },
        { transform: 'translateX(4px)' },
        { transform: 'translateX(0)' }
      ], { duration: 400, easing: 'ease-in-out' });
    }

    // === Utility ===
    function escapeHtml(s) {
      var div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    function escapeAttr(s) {
      return s.replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    function padZ(n) {
      return n < 10 ? '0' + n : '' + n;
    }

    // === Init ===
    parseOptions();
  </script>
</body>
</html>
