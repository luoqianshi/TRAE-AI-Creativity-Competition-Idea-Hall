<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>「周末盲盒」- AI周末出行决策助手</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(145deg, #f7f0fc 0%, #e8def0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* ===== 主卡片 ===== */
        .card {
            max-width: 560px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 40px 32px 44px;
            box-shadow: 0 30px 60px rgba(120, 80, 160, 0.20),
                        0 8px 24px rgba(120, 80, 160, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header .emoji-box {
            font-size: 56px;
            display: block;
            margin-bottom: 8px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #2d1b3d;
            letter-spacing: 1px;
        }

        .header h1 span {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .sub {
            font-size: 15px;
            color: #7a6a8a;
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* ===== 标签行 ===== */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 28px;
        }

        .tags .tag {
            background: rgba(168, 85, 247, 0.12);
            color: #7c3aed;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(168, 85, 247, 0.18);
            letter-spacing: 0.3px;
        }

        /* ===== 状态卡片 ===== */
        .status-box {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 20px 24px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .status-box .label {
            font-size: 13px;
            font-weight: 500;
            color: #9a8aaa;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .status-box .value {
            font-size: 20px;
            font-weight: 600;
            color: #2d1b3d;
        }

        .status-box .value small {
            font-weight: 400;
            font-size: 15px;
            color: #7a6a8a;
            margin-left: 8px;
        }

        /* ===== 选项网格 ===== */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.6);
            border: 1.5px solid rgba(200, 180, 215, 0.3);
            border-radius: 18px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: #2d1b3d;
        }

        .option-btn:hover {
            background: rgba(168, 85, 247, 0.08);
            border-color: #a855f7;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(168, 85, 247, 0.12);
        }

        .option-btn:active {
            transform: scale(0.96);
        }

        .option-btn .icon {
            display: block;
            font-size: 28px;
            margin-bottom: 4px;
        }

        .option-btn .lbl {
            font-size: 13px;
        }

        .option-btn.selected {
            background: rgba(168, 85, 247, 0.14);
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
        }

        /* ===== 主按钮 ===== */
        .primary-btn {
            width: 100%;
            padding: 18px 0;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border: none;
            border-radius: 40px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.30);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(124, 58, 237, 0.35);
        }

        .primary-btn:active {
            transform: scale(0.97);
        }

        .primary-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* ===== 结果区域 ===== */
        .result-box {
            margin-top: 24px;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.55);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }

        .result-box .placeholder {
            color: #b0a0c0;
            font-size: 15px;
            font-weight: 400;
        }

        .result-box .result-content {
            width: 100%;
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .result-box .result-content .dest {
            font-size: 22px;
            font-weight: 700;
            color: #2d1b3d;
        }

        .result-box .result-content .dest .emoji {
            margin-right: 8px;
        }

        .result-box .result-content .detail {
            font-size: 14px;
            color: #5a4a6a;
            margin-top: 4px;
            line-height: 1.6;
        }

        .result-box .result-content .detail .highlight {
            color: #7c3aed;
            font-weight: 600;
        }

        /* ===== 底部 ===== */
        .footer {
            margin-top: 28px;
            text-align: center;
            font-size: 13px;
            color: #b0a0c0;
            letter-spacing: 0.3px;
        }

        .footer a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: 500;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .card { padding: 28px 20px 32px; border-radius: 32px; }
            .header h1 { font-size: 24px; }
            .options-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .option-btn { padding: 14px 10px; font-size: 13px; }
            .primary-btn { font-size: 16px; padding: 16px 0; }
            .result-box { padding: 16px 18px; min-height: 60px; }
        }
    </style>
</head>
<body>

<div class="card">

    <!-- ====== 头部 ====== -->
    <div class="header">
        <span class="emoji-box">🎁</span>
        <h1>「周末<span>盲盒</span>」</h1>
        <p class="sub">让AI帮你决定周末去哪玩 · 给生活一点小惊喜</p>
    </div>

    <!-- ====== 标签 ====== -->
    <div class="tags">
        <span class="tag">🏷️ 生活娱乐</span>
        <span class="tag">🧠 AI决策</span>
        <span class="tag">📍 出行推荐</span>
        <span class="tag">🎉 惊喜体验</span>
    </div>

    <!-- ====== 状态 ====== -->
    <div class="status-box">
        <div class="label">📍 当前位置</div>
        <div class="value">北京市 · 朝阳区 <small>（可更改）</small></div>
    </div>

    <!-- ====== 选项 ====== -->
    <div class="options-grid">
        <button class="option-btn selected" data-type="outdoor">
            <span class="icon">🌿</span>
            <span class="lbl">户外自然</span>
        </button>
        <button class="option-btn" data-type="indoor">
            <span class="icon">🎨</span>
            <span class="lbl">室内文艺</span>
        </button>
        <button class="option-btn" data-type="food">
            <span class="icon">🍜</span>
            <span class="lbl">美食探店</span>
        </button>
        <button class="option-btn" data-type="family">
            <span class="icon">👨‍👩‍👦</span>
            <span class="lbl">亲子时光</span>
        </button>
    </div>

    <!-- ====== 主按钮 ====== -->
    <button class="primary-btn" id="openBtn">
        🎲 拆盲盒 · 决定周末去哪
    </button>

    <!-- ====== 结果 ====== -->
    <div class="result-box" id="resultBox">
        <span class="placeholder">👆 点击按钮，让AI帮你选</span>
    </div>

    <!-- ====== 底部 ====== -->
    <div class="footer">
        ✨ TRAE AI 创造力大赛 · 生活娱乐赛道<br />
        用 AI 让每个周末都值得期待
    </div>

</div>

<script>
    (function() {
        // ----- 出行方案库 -----
        const destinations = {
            outdoor: [
                { dest: '🌳 奥林匹克森林公园', detail: '推荐理由：周末天气晴好，公园里花开正盛。适合散步、野餐、骑行，放松身心。' },
                { dest: '🏔️ 香山公园', detail: '推荐理由：登山望远，感受自然气息。建议上午出发，中午在山脚吃一顿农家菜。' },
                { dest: '🌊 后海', detail: '推荐理由：沿湖散步，租一条小船划水，傍晚看落日余晖，无比惬意。' },
                { dest: '🌸 玉渊潭公园', detail: '推荐理由：本周樱花进入最佳观赏期，园内还有周末市集，适合拍照打卡。' },
            ],
            indoor: [
                { dest: '🎭 国家大剧院', detail: '推荐理由：本周六晚有室内乐演出，票价亲民。演出前可在附近吃一顿精致西餐。' },
                { dest: '🖼️ 798艺术区', detail: '推荐理由：多个新展开幕，包括一个沉浸式光影展。逛完可以在园区里喝杯咖啡。' },
                { dest: '📚 单向空间书店', detail: '推荐理由：本周六下午有作家签售会。书店二楼有安静阅读区，适合呆一整个下午。' },
                { dest: '🎬 中国电影资料馆', detail: '推荐理由：周末放映经典老片《城南旧事》，大银幕重温，别有一番滋味。' },
            ],
            food: [
                { dest: '🍲 胡同里的私房菜', detail: '推荐理由：藏在南锣鼓巷深处的一家私房菜，需提前预约。人均150，氛围极佳。' },
                { dest: '🥩 亮马河畔的牛排馆', detail: '推荐理由：景观位可以看到河景，周末有爵士乐现场演奏。适合约会或朋友小聚。' },
                { dest: '🍜 望京的韩式料理', detail: '推荐理由：一家开了十年的老店，部队锅和炸鸡是招牌。周末晚上排队约30分钟。' },
                { dest: '☕ 胡同里的屋顶咖啡', detail: '推荐理由：藏在胡同里的屋顶咖啡店，可以看到老城区的屋顶风景。适合发呆一下午。' },
            ],
            family: [
                { dest: '🐼 北京野生动物园', detail: '推荐理由：周末有亲子喂养体验活动，小朋友可以近距离接触小动物。建议早去。' },
                { dest: '🔬 中国科技馆', detail: '推荐理由：儿童科学乐园周末有特别互动项目，寓教于乐，适合6-12岁孩子。' },
                { dest: '🎠 朝阳公园游乐场', detail: '推荐理由：新开放的亲子游乐区，有旋转木马和小型过山车。公园里还可以划船。' },
                { dest: '🧪 自然博物馆', detail: '推荐理由：恐龙化石展是小朋友的最爱。周末有免费讲解服务，上午10点和下午2点各一场。' },
            ]
        };

        // ----- 状态 -----
        let currentType = 'outdoor';
        const optionBtns = document.querySelectorAll('.option-btn');
        const resultBox = document.getElementById('resultBox');
        const openBtn = document.getElementById('openBtn');

        // ----- 选项切换 -----
        optionBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                optionBtns.forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                currentType = this.dataset.type;
                // 清空之前的结果
                resultBox.innerHTML = `<span class="placeholder">👆 已切换到「${this.querySelector('.lbl').textContent}」，点击按钮拆盲盒</span>`;
            });
        });

        // ----- 拆盲盒逻辑 -----
        function openBlindBox() {
            const pool = destinations[currentType] || destinations.outdoor;
            const picked = pool[Math.floor(Math.random() * pool.length)];

            // 构造结果 HTML
            resultBox.innerHTML = `
                <div class="result-content">
                    <div class="dest"><span class="emoji">🎉</span> ${picked.dest}</div>
                    <div class="detail">${picked.detail}</div>
                    <div style="margin-top:12px; font-size:13px; color:#9a8aaa; border-top:1px solid rgba(200,180,215,0.25); padding-top:12px;">
                        💡 预算参考：¥80–200 · 建议时长：3–5小时
                    </div>
                </div>
            `;
        }

        // ----- 按钮点击 + 涟漪效果 -----
        openBtn.addEventListener('click', function(e) {
            // 涟漪
            const rect = this.getBoundingClientRect();
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);

            // 拆盲盒
            openBlindBox();
        });

        // ----- 回车键支持 -----
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                const active = document.activeElement;
                if (active && active.tagName === 'BUTTON' && active.id === 'openBtn') {
                    e.preventDefault();
                    openBtn.click();
                }
            }
        });

        // ----- 初始加载自动开一次（展示效果） -----
        setTimeout(() => {
            openBlindBox();
        }, 400);
    })();
</script>

</body>
</html>
