<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>高中数学立体几何：正方体截面交互演示</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Microsoft YaHei', 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Roboto, sans-serif;
        }
        /* 信息面板 - 清新简约风格 */
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 12px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #3b82f6;
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
            color: #1e293b;
            font-weight: 500;
        }
        .info-panel h3 {
            margin: 0 0 6px 0;
            font-size: 18px;
            color: #0f172a;
        }
        .info-panel p {
            margin: 4px 0;
            font-size: 13px;
            color: #334155;
        }
        .point-count {
            margin-top: 8px;
            font-weight: 600;
            color: #3b82f6;
            background: #eff6ff;
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 13px;
        }
        .controls-guide {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            color: #f1f5f9;
            padding: 8px 15px;
            border-radius: 28px;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
            letter-spacing: 0.5px;
        }
        button {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: #3b82f6;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
            transition: all 0.2s ease;
            z-index: 20;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
            font-family: inherit;
        }
        button:hover {
            background: #2563eb;
            transform: scale(1.02);
            box-shadow: 0 6px 16px rgba(59,130,246,0.4);
        }
        .message {
            position: absolute;
            bottom: 90px;
            right: 20px;
            background: #fef9c3;
            color: #854d0e;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            pointer-events: none;
            transition: opacity 0.3s;
            opacity: 0;
            z-index: 20;
        }
        @media (max-width: 600px) {
            .info-panel { font-size: 10px; padding: 8px 12px; top: 10px; left: 10px; }
            button { padding: 6px 12px; font-size: 12px; bottom: 12px; right: 12px; }
            .controls-guide { font-size: 9px; bottom: 12px; left: 12px; }
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <h3>📐 正方体截面实验</h3>
        <p>在正方体表面上点击 <span style="color:#3b82f6; font-weight:bold;">左键</span> 选择三个点</p>
        <p>自动生成过三点的平面与正方体的截面多边形</p>
        <div class="point-count" id="pointCounter">已选点: 0 / 3</div>
    </div>
    <div class="controls-guide">
        🖱️ 右键拖拽旋转视角 | 滚动缩放 | 左键选点 (表面)
    </div>
    <button id="resetBtn">⟳ 重置 / 重新选点</button>
    <div id="msgToast" class="message">✨ 截面已更新</div>

    <!-- 引入Three.js核心库及扩展 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf8fafc); // 清新冷灰白背景
        scene.fog = new THREE.FogExp2(0xf8fafc, 0.008); // 轻微雾效增强深度感

        // 透视相机 (视角, 宽高比, 近平面, 远平面)
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3.5, 2.8, 4.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // 开启阴影映射增加立体感
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // CSS2渲染文字标签
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // --- 光照系统 (清新明亮) ---
        // 环境光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);
        // 主光源方向光
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(2, 5, 3);
        dirLight.castShadow = true;
        dirLight.receiveShadow = false;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);
        // 辅助背光暖色
        const backLight = new THREE.PointLight(0xffaa66, 0.4);
        backLight.position.set(-2, 1, -3);
        scene.add(backLight);
        // 冷色填充光
        const fillLight = new THREE.PointLight(0x88aaff, 0.3);
        fillLight.position.set(1, 2, 2);
        scene.add(fillLight);
        
        // 辅助网格地板 (半透明，增强空间感)
        const gridHelper = new THREE.GridHelper(8, 20, 0x94a3b8, 0xcbd5e1);
        gridHelper.position.y = -1.2;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.35;
        scene.add(gridHelper);
        
        // 简易轴线 (轻量化)
        const axesHelper = new THREE.AxesHelper(2.2);
        axesHelper.material.transparent = true;
        axesHelper.material.opacity = 0.12;
        scene.add(axesHelper);

        // --- 核心数据: 正方体参数 (边长2, 中心原点)---
        const boxSize = 2;
        const halfSize = 1;
        // 正方体的8个顶点 (局部坐标)
        const vertices = [
            new THREE.Vector3(-1, -1, -1), // 0
            new THREE.Vector3( 1, -1, -1), // 1
            new THREE.Vector3( 1, -1,  1), // 2
            new THREE.Vector3(-1, -1,  1), // 3
            new THREE.Vector3(-1,  1, -1), // 4
            new THREE.Vector3( 1,  1, -1), // 5
            new THREE.Vector3( 1,  1,  1), // 6
            new THREE.Vector3(-1,  1,  1)  // 7
        ];
        // 12条棱 (顶点索引对)
        const edgesIndices = [
            [0,1], [1,2], [2,3], [3,0], // 底面
            [4,5], [5,6], [6,7], [7,4], // 顶面
            [0,4], [1,5], [2,6], [3,7]  // 垂直棱
        ];
        
        // 创建正方体Mesh (半透明材质，便于观察内部截面)
        const boxMaterial = new THREE.MeshStandardMaterial({
            color: 0x7ab2ff,
            roughness: 0.28,
            metalness: 0.05,
            transparent: true,
            opacity: 0.28,
            side: THREE.DoubleSide  // 双面渲染让截面更清晰可见
        });
        const cube = new THREE.Mesh(new THREE.BoxGeometry(boxSize, boxSize, boxSize), boxMaterial);
        cube.castShadow = true;
        cube.receiveShadow = false;
        cube.userData = { isSelectable: true };
        scene.add(cube);
        
        // 添加正方体边框 (EdgesGeometry + LineSegments, 清晰显示棱)
        const edgesGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(boxSize, boxSize, boxSize));
        const edgesMat = new THREE.LineBasicMaterial({ color: 0x2c3e66, linewidth: 1 });
        const wireframe = new THREE.LineSegments(edgesGeo, edgesMat);
        cube.add(wireframe); // 边框随cube变换，但cube在原点无变换
        
        // 为了更美观，在顶点添加小的装饰球体 (增加视觉参考)
        const vertexSphereMat = new THREE.MeshStandardMaterial({ color: 0xffaa55, emissive: 0x442200, emissiveIntensity: 0.2 });
        const vertexGroup = new THREE.Group();
        vertices.forEach(v => {
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 12), vertexSphereMat);
            sphere.position.copy(v);
            vertexGroup.add(sphere);
        });
        scene.add(vertexGroup);
        
        // --- 存储交互数据 ---
        let selectedPoints = [];       // 存储选中的点 (Vector3, 世界坐标且位于表面)
        let pointMarkers = [];         // 存储小球体标记物
        let currentSectionMesh = null; // 当前截面填充Mesh
        let currentSectionLoop = null;  // 当前截面边框高亮LineLoop
        
        // 辅助显示点序文字(CSS2D)
        let pointLabels = [];
        
        // 工具函数: 显示短暂提示
        function showMessage(text, isError = false) {
            const toast = document.getElementById('msgToast');
            toast.textContent = text;
            toast.style.backgroundColor = isError ? '#fee2e2' : '#dcfce7';
            toast.style.color = isError ? '#b91c1c' : '#166534';
            toast.style.opacity = '1';
            toast.style.borderLeft = isError ? '3px solid #ef4444' : '3px solid #22c55e';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }
        
        // 更新UI计数器
        function updateCounterUI() {
            const counterDiv = document.getElementById('pointCounter');
            counterDiv.innerHTML = `已选点: ${selectedPoints.length} / 3`;
            if (selectedPoints.length === 3) {
                counterDiv.style.background = '#dcfce7';
                counterDiv.style.color = '#166534';
            } else {
                counterDiv.style.background = '#eff6ff';
                counterDiv.style.color = '#3b82f6';
            }
        }
        
        // 清除所有选点和截面
        function resetSelection() {
            // 移除小球体标记
            pointMarkers.forEach(marker => {
                scene.remove(marker);
                if (marker.geometry) marker.geometry.dispose();
                if (marker.material) marker.material.dispose();
            });
            // 移除文字标签
            pointLabels.forEach(label => {
                scene.remove(label);
            });
            pointMarkers = [];
            pointLabels = [];
            selectedPoints = [];
            
            // 移除截面相关物体
            if (currentSectionMesh) scene.remove(currentSectionMesh);
            if (currentSectionLoop) scene.remove(currentSectionLoop);
            currentSectionMesh = null;
            currentSectionLoop = null;
            
            updateCounterUI();
            showMessage('已重置，可以重新选择三个点', false);
        }
        
        // 判断两点是否近似相等 (用于去重)
        const EPS = 1e-5;
        function isEqualVec3(v1, v2) {
            return v1.distanceTo(v2) < EPS;
        }
        
        // 核心: 根据三个点生成截面多边形 (计算平面与正方体棱的交点，排序并显示)
        function generateSectionFromPoints(p1, p2, p3) {
            // 计算平面方程: 法向量 n, 常数 d (满足 n·P + d = 0)
            const vecA = new THREE.Vector3().subVectors(p2, p1);
            const vecB = new THREE.Vector3().subVectors(p3, p1);
            let normal = new THREE.Vector3().crossVectors(vecA, vecB).normalize();
            if (normal.length() < 1e-6) {
                showMessage('错误：三点共线或过于接近，无法确定平面，请重新选择', true);
                return false;
            }
            const d = -normal.dot(p1);
            
            // 存储交点 (去重用)
            const intersectionPoints = [];
            
            // 遍历所有棱，计算交点
            edgesIndices.forEach(edge => {
                const A = vertices[edge[0]];
                const B = vertices[edge[1]];
                const dir = new THREE.Vector3().subVectors(B, A);
                const denom = normal.dot(dir);
                if (Math.abs(denom) < 1e-7) return; // 平行或共面
                const t = -(normal.dot(A) + d) / denom;
                if (t >= 0 && t <= 1) {
                    const point = new THREE.Vector3().lerpVectors(A, B, t);
                    // 去重 (检查是否已存在相近点)
                    let duplicate = false;
                    for (let existing of intersectionPoints) {
                        if (existing.distanceTo(point) < 1e-5) {
                            duplicate = true;
                            break;
                        }
                    }
                    if (!duplicate) intersectionPoints.push(point);
                }
            });
            
            if (intersectionPoints.length < 3) {
                showMessage(`截面与棱的交点不足3个 (共${intersectionPoints.length}个)，无法构成多边形，请重新选点`, true);
                return false;
            }
            
            // 排序: 这些交点都在同一平面上，需要按顺时针/逆时针排序构成凸多边形
            // 计算这些点的中心
            const center = new THREE.Vector3();
            intersectionPoints.forEach(p => center.add(p));
            center.divideScalar(intersectionPoints.length);
            
            // 构造局部平面基向量: 以法线为Z轴，选一个参考方向 (第一个点相对中心的方向)
            const refDir = new THREE.Vector3().subVectors(intersectionPoints[0], center).normalize();
            // 构造垂直向量 up = 法线 cross refDir
            const up = new THREE.Vector3().crossVectors(normal, refDir).normalize();
            // 排序函数: 计算角度
            intersectionPoints.sort((a, b) => {
                const da = new THREE.Vector3().subVectors(a, center);
                const db = new THREE.Vector3().subVectors(b, center);
                const angleA = Math.atan2(da.dot(up), da.dot(refDir));
                const angleB = Math.atan2(db.dot(up), db.dot(refDir));
                return angleA - angleB;
            });
            
            // 构建多边形Mesh (透明填充) 和 高亮边框
            // 移除旧的
            if (currentSectionMesh) scene.remove(currentSectionMesh);
            if (currentSectionLoop) scene.remove(currentSectionLoop);
            
            // 生成Geometry: 凸多边形三角剖分 (简单三角扇)
            const verticesPoly = [];
            intersectionPoints.forEach(p => {
                verticesPoly.push(p.x, p.y, p.z);
            });
            // 生成索引 (凸多边形三角剖分: 0,1,2; 0,2,3; 0,3,4...)
            const indicesPoly = [];
            for (let i = 1; i < intersectionPoints.length - 1; i++) {
                indicesPoly.push(0, i, i+1);
            }
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verticesPoly), 3));
            geom.setIndex(indicesPoly);
            geom.computeVertexNormals(); // 改善光照效果
            
            // 半透明材质 (鲜艳的珊瑚橙，清新醒目)
            const fillMaterial = new THREE.MeshPhongMaterial({
                color: 0xff7b6e,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.65,
                emissive: 0x441100,
                emissiveIntensity: 0.1
            });
            const sectionMeshObj = new THREE.Mesh(geom, fillMaterial);
            scene.add(sectionMeshObj);
            currentSectionMesh = sectionMeshObj;
            
            // 高亮边缘 (LineLoop)
            const linePoints = intersectionPoints.concat([intersectionPoints[0]]); // 闭合
            const lineGeom = new THREE.BufferGeometry().setFromPoints(linePoints);
            const lineMat = new THREE.LineBasicMaterial({ color: 0xff3366, linewidth: 2, linecap: 'round', linejoin: 'round' });
            // 由于WebGL渲染器linewidth限制，但颜色亮红已经足够明显
            const wireLoop = new THREE.LineLoop(lineGeom, lineMat);
            scene.add(wireLoop);
            currentSectionLoop = wireLoop;
            
            // 额外增加边缘发光感: 在边缘添加一组更粗的线条效果 (可选，但简单lineLoop足够)
            showMessage(`✅ 截面生成成功 (${intersectionPoints.length}边形)`, false);
            return true;
        }
        
        // 尝试从当前点集生成截面 (恰好3点时)
        function tryGenerateSection() {
            if (selectedPoints.length === 3) {
                const success = generateSectionFromPoints(selectedPoints[0], selectedPoints[1], selectedPoints[2]);
                if (!success) {
                    // 若生成失败, 清空当前选择让用户重新选
                    resetSelection();
                }
            } else {
                // 移除已有截面 (未满三个点时)
                if (currentSectionMesh) scene.remove(currentSectionMesh);
                if (currentSectionLoop) scene.remove(currentSectionLoop);
                currentSectionMesh = null;
                currentSectionLoop = null;
            }
        }
        
        // 添加选中点标记 (小球体 + CSS2D序号)
        function addPointMarker(point, order) {
            // 球体标记
            const sphereMat = new THREE.MeshStandardMaterial({ color: 0xff4d4d, emissive: 0x441111, emissiveIntensity: 0.25 });
            const marker = new THREE.Mesh(new THREE.SphereGeometry(0.07, 20, 20), sphereMat);
            marker.position.copy(point);
            scene.add(marker);
            pointMarkers.push(marker);
            
            // CSS2D文字序号
            const div = document.createElement('div');
            div.textContent = `${order}`;
            div.style.backgroundColor = '#ff4d4d';
            div.style.color = 'white';
            div.style.fontSize = '14px';
            div.style.fontWeight = 'bold';
            div.style.width = '22px';
            div.style.height = '22px';
            div.style.borderRadius = '50%';
            div.style.display = 'flex';
            div.style.alignItems = 'center';
            div.style.justifyContent = 'center';
            div.style.boxShadow = '0 2px 6px rgba(0,0,0,0.2)';
            div.style.border = '1px solid white';
            div.style.fontFamily = 'monospace';
            const label = new CSS2DObject(div);
            label.position.copy(point.clone().add(new THREE.Vector3(0.08, 0.08, 0.08)));
            scene.add(label);
            pointLabels.push(label);
        }
        
        // 处理正方体表面点击 (左键)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        function onMouseClick(event) {
            // 只处理左键 (button === 0)
            if (event.button !== 0) return;
            
            // 计算鼠标位置归一化坐标
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            // 检测正方体 (cube)
            const intersects = raycaster.intersectObject(cube);
            if (intersects.length > 0) {
                const hitPoint = intersects[0].point;
                // 确保交点在正方体表面上 (由于射线交点已经在表面，并且由于浮点误差轻微位移，可直接使用)
                // 夹紧到表面容差 (避免内部微小偏移)
                const clamped = hitPoint.clone();
                // 由于正方体范围[-1,1]，确保坐标在边界上容差修正
                for (let i = 0; i < 3; i++) {
                    let val = clamped.getComponent(i);
                    if (Math.abs(val - 1) < 1e-4) clamped.setComponent(i, 1);
                    if (Math.abs(val + 1) < 1e-4) clamped.setComponent(i, -1);
                    if (val > 1) clamped.setComponent(i, 1);
                    if (val < -1) clamped.setComponent(i, -1);
                }
                
                // 检查是否已经选择了三个点，如果是且没有重置，提示用户需要重置，禁止添加(按照设计防止误加)
                if (selectedPoints.length >= 3) {
                    showMessage('已有三个点，请点击"重置"按钮开始新的截面', false);
                    return;
                }
                
                // 防止重复选择同一个点或过于接近的点 (距离阈值0.05)
                let tooClose = false;
                for (let p of selectedPoints) {
                    if (p.distanceTo(clamped) < 0.08) {
                        tooClose = true;
                        showMessage('该点与已有选点距离过近，请选择其他位置', true);
                        break;
                    }
                }
                if (tooClose) return;
                
                // 记录新点
                selectedPoints.push(clamped.clone());
                const orderNum = selectedPoints.length;
                addPointMarker(clamped, orderNum);
                updateCounterUI();
                
                // 如果已有三个点, 生成截面
                if (selectedPoints.length === 3) {
                    tryGenerateSection();
                } else {
                    // 未满3点时，若有旧截面则清除
                    if (currentSectionMesh) scene.remove(currentSectionMesh);
                    if (currentSectionLoop) scene.remove(currentSectionLoop);
                    currentSectionMesh = null;
                    currentSectionLoop = null;
                }
            }
        }
        
        // --- 配置OrbitControls: 左键无旋转(用于选择), 右键旋转, 滚轮缩放 ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = true;
        controls.zoomSpeed = 1.2;
        controls.enablePan = true;
        controls.panSpeed = 0.8;
        controls.rotateSpeed = 1.0;
        // 设置鼠标按键: 左键无动作, 中键默认缩放(滚轮), 右键旋转
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.NONE,   // 左键禁用旋转/平移，交给自定义点击
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.ROTATE
        };
        // 让右键拖拽时更平滑
        controls.target.set(0, 0, 0);
        
        // 注册点击监听 (注意需要阻止事件冒泡避免冲突)
        renderer.domElement.addEventListener('click', onMouseClick);
        // 为了阻止右键弹出默认菜单，保证右键拖拽不干扰
        renderer.domElement.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            return false;
        });
        
        // 重置按钮逻辑
        document.getElementById('resetBtn').addEventListener('click', () => {
            resetSelection();
        });
        
        // 窗口适配
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // 简单动画: 柔和的环境光微调 / 背景轻微扫光 (可不做，直接渲染)
        let time = 0;
        
        // --- 辅助显示正方体顶点字母可选，但不需要太繁杂，已经有了小球装饰---
        
        // 渲染循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // 更新相机控制
            // 动态微调辅助光的颜色，增加一点生动性 (极细微变化)
            time += 0.008;
            const hue = 0.55 + Math.sin(time) * 0.02;
            // 无需大幅改动，保持清新
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();
        
        // 控制台输出就绪提示
        console.log('初始化完成，请在正方体表面点击左键选择三个点');
        
        // 添加一个小提示指引浮动 (初始提示)
        setTimeout(() => {
            showMessage('✨ 点击正方体表面选择第一个点', false);
        }, 800);
    </script>
</body>
</html>
