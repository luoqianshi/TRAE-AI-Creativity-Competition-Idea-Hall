<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC Test Paper</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #333; padding: 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  .header { background: #1a73e8; color: #fff; padding: 20px 30px; border-radius: 12px 12px 0 0; }
  .header h1 { font-size: 22px; }
  .header .meta { margin-top: 8px; font-size: 14px; opacity: 0.9; }
  .header .meta span { margin-right: 20px; }
  .section { background: #fff; border: 1px solid #e0e0e0; border-top: none; margin-bottom: 20px; border-radius: 0 0 12px 12px; }
  .section-header { background: #f8f9fa; padding: 15px 30px; border-bottom: 1px solid #e0e0e0; font-size: 18px; font-weight: 600; }
  .section-header .badge { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 12px; margin-left: 10px; font-weight: 400; }
  .badge-grammar { background: #e3f2fd; color: #1565c0; }
  .badge-reading { background: #e8f5e9; color: #2e7d32; }
  .badge-listening { background: #fff3e0; color: #e65100; }
  .section-instructions { padding: 12px 30px; background: #fafafa; border-bottom: 1px solid #eee; font-size: 14px; color: #666; font-style: italic; }
  .question-block { padding: 20px 30px; border-bottom: 1px solid #eee; }
  .question-block:last-child { border-bottom: none; }
  .q-stem { font-size: 15px; margin-bottom: 12px; line-height: 1.6; }
  .q-stem .q-number { font-weight: 700; color: #1a73e8; }
  .options { list-style: none; }
  .options li { margin-bottom: 8px; }
  .options label { display: flex; align-items: center; padding: 8px 14px; border: 1px solid #e0e0e0; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 14px; }
  .options label:hover { background: #f5f8ff; border-color: #1a73e8; }
  .options input[type="radio"] { margin-right: 10px; accent-color: #1a73e8; }
  .options label.selected { background: #e8f0fe; border-color: #1a73e8; }
  .passage { background: #fafafa; padding: 20px 30px; border-bottom: 1px solid #e0e0e0; }
  .passage-title { font-weight: 700; font-size: 15px; margin-bottom: 10px; color: #1a73e8; }
  .passage-content { font-size: 14px; line-height: 1.8; color: #444; white-space: pre-wrap; font-family: 'Georgia', serif; }
  .passage-questions { padding: 0; }
  .passage-questions .question-block { padding-left: 30px; padding-right: 30px; }
  .audio-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; background: #1a73e8; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 12px; }
  .audio-btn:hover { background: #1557b0; }
  .audio-btn.playing { background: #e65100; }
  .audio-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .submit-area { text-align: center; padding: 30px; }
  .submit-btn { padding: 14px 60px; font-size: 18px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
  .submit-btn:hover { background: #1557b0; }
  .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
  .submit-status { margin-top: 12px; font-size: 14px; color: #666; }
  .progress-bar { height: 4px; background: #e0e0e0; border-radius: 2px; margin: 10px 0; }
  .progress-fill { height: 100%; background: #1a73e8; border-radius: 2px; transition: width 0.3s; }
  .q-category { font-size: 11px; color: #999; margin-left: 8px; }
  .reading-layout { display: flex; flex-direction: column; }
  @media (min-width: 768px) {
    .reading-layout.passage-left { flex-direction: row; }
    .reading-layout.passage-left .passage { flex: 1; border-right: 1px solid #e0e0e0; border-bottom: none; max-height: 500px; overflow-y: auto; }
    .reading-layout.passage-left .passage-questions { flex: 1; }
  }
</style>
</head>

// Decode base64 to JSON string, then parse
function decodeBase64(str) {
  try {
    const bytes = Uint8Array.from(atob(str), c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  } catch(e) {
    try { return decodeURIComponent(escape(atob(str))); } catch(e2) { return atob(str); }
  }
}
const raw = typeof PAPER_DATA === 'string' ? decodeBase64(PAPER_DATA) : PAPER_DATA;
const paper = JSON.parse(raw);
if (!paper) throw new Error('No paper data');

let answers = {};
let totalQuestions = 0;
let answeredCount = 0;

function countQuestions(sections) {
  let count = 0;
  for (const sec of sections) {
    if (sec.type === 'passage-based' && sec.passages) {
      for (const p of sec.passages) count += p.questions.length;
    } else if (sec.questions) {
      count += sec.questions.length;
    }
  }
  return count;
}

function updateProgress() {
  const pct = totalQuestions > 0 ? Math.round((answeredCount / totalQuestions) * 100) : 0;
  const bar = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  if (bar) bar.style.width = pct + '%';
  if (label) label.textContent = answeredCount + '/' + totalQuestions + ' answered (' + pct + '%)';
}

function saveToStorage() {
  try { localStorage.setItem('paper_answers_' + paper.paperId, JSON.stringify(answers)); } catch(e) {}
}

function loadFromStorage() {
  try {
    const saved = localStorage.getItem('paper_answers_' + paper.paperId);
    if (saved) {
      const parsed = JSON.parse(saved);
      answers = parsed;
      answeredCount = Object.keys(answers).length;
    }
  } catch(e) {}
}

function handleAnswer(qId) {
  const selected = document.querySelector('input[name="' + qId + '"]:checked');
  if (selected) {
    if (!answers[qId]) answeredCount++;
    answers[qId] = selected.value;
  } else {
    if (answers[qId]) answeredCount--;
    delete answers[qId];
  }
  updateProgress();
  saveToStorage();
}

function renderGrammar(section) {
  let html = '<div class="section">';
  html += '<div class="section-header">' + section.title + ' <span class="badge badge-grammar">' + section.questions.length + ' questions</span></div>';
  html += '<div class="section-instructions">' + (section.instructions || 'Select the best answer.') + '</div>';
  for (const q of section.questions) {
    html += renderQuestion(q);
  }
  html += '</div>';
  return html;
}

function renderReading(section) {
  let html = '<div class="section">';
  html += '<div class="section-header">' + section.title + ' <span class="badge badge-reading">' + countPassageQuestions(section) + ' questions</span></div>';
  html += '<div class="section-instructions">' + (section.instructions || 'Read the passages and answer the questions.') + '</div>';
  for (const passage of (section.passages || [])) {
    html += '<div class="passage">';
    html += '<div class="passage-title">📄 ' + passage.title + '</div>';
    html += '<div class="passage-content">' + passage.content + '</div>';
    html += '</div>';
    html += '<div class="passage-questions">';
    for (const q of (passage.questions || [])) {
      html += renderQuestion(q);
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function countPassageQuestions(section) {
  let c = 0;
  for (const p of (section.passages || [])) c += p.questions.length;
  return c;
}

function renderListening(section) {
  let html = '<div class="section">';
  html += '<div class="section-header">' + section.title + ' <span class="badge badge-listening">' + section.questions.length + ' questions</span></div>';
  html += '<div class="section-instructions">' + (section.instructions || 'Listen to each audio and choose the best answer.') + '</div>';
  for (const q of section.questions) {
    html += '<div class="question-block">';
    if (q.audioText) {
      const encoded = encodeURIComponent(q.audioText).replace(/'/g, '%27');
      html += '<button class="audio-btn" onclick="playAudio(this, \'' + encoded + '\', ' + (paper.audioRate || 0.85) + ')">🎧 Play</button>';
    }
    html += renderOptions(q);
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderQuestion(q) {
  let html = '<div class="question-block">';
  html += '<div class="q-stem"><span class="q-number">' + q.id + '.</span> ' + escapeHtml(q.stem) + '<span class="q-category">[' + (q.category || 'general') + ']</span></div>';
  html += renderOptions(q);
  html += '</div>';
  return html;
}

function renderOptions(q) {
  let html = '<ul class="options">';
  for (const opt of (q.options || [])) {
    const checked = answers[q.id] === opt.key ? 'checked' : '';
    html += '<li><label class="' + (checked ? 'selected' : '') + '">';
    html += '<input type="radio" name="' + q.id + '" value="' + opt.key + '" ' + checked + ' onchange="onOptionChange(this, \'' + q.id + '\', \'' + opt.key + '\')">';
    html += '<span><strong>' + opt.key + '</strong> ' + escapeHtml(opt.text) + '</span>';
    html += '</label></li>';
  }
  html += '</ul>';
  return html;
}

function onOptionChange(el, qId, key) {
  handleAnswer(qId);
  document.querySelectorAll('input[name="' + qId + '"]').forEach(r => {
    r.closest('label').classList.remove('selected');
  });
  el.closest('label').classList.add('selected');
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function playAudio(btn, encodedText, rate) {
  const text = decodeURIComponent(encodedText);
  if (window.speechSynthesis.speaking) {
    window.speechSynthesis.cancel();
    btn.classList.remove('playing');
    btn.innerHTML = '🎧 Play';
    return;
  }
  btn.classList.add('playing');
  btn.innerHTML = '⏹ Stop';
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  utterance.rate = rate || 0.85;
  utterance.onend = function() {
    btn.classList.remove('playing');
    btn.innerHTML = '🎧 Play';
  };
  utterance.onerror = function() {
    btn.classList.remove('playing');
    btn.innerHTML = '🎧 Play';
  };
  window.speechSynthesis.speak(utterance);
}

function submitPaper() {
  const unanswered = [];
  for (const sec of paper.sections) {
    if (sec.type === 'passage-based' && sec.passages) {
      for (const p of sec.passages) {
        for (const q of p.questions) {
          if (!answers[q.id]) unanswered.push(q.id);
        }
      }
    } else if (sec.questions) {
      for (const q of sec.questions) {
        if (!answers[q.id]) unanswered.push(q.id);
      }
    }
  }

  if (unanswered.length > 0) {
    if (!confirm('You have ' + unanswered.length + ' unanswered questions (' + unanswered.join(', ') + '). Submit anyway?')) {
      return;
    }
  }

  const result = { paperId: paper.paperId, answers: answers, submittedAt: new Date().toISOString() };

  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = 'Submitting...';
  document.getElementById('submitStatus').textContent = 'Saving your answers...';

  // Store answers in window object for Playwright to retrieve
  window.__lastAnswers = result;
  document.getElementById('submitStatus').textContent = '✅ Answers submitted successfully! You can close this window.';
  document.getElementById('submitBtn').textContent = '✔ Submitted';
}

// Render the full paper
totalQuestions = countQuestions(paper.sections);
let appHtml = '<div class="header">';
appHtml += '<h1>' + escapeHtml(paper.title || 'TOEIC Test') + '</h1>';
appHtml += '<div class="meta"><span>📝 ' + totalQuestions + ' questions</span></div>';
appHtml += '<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>';
appHtml += '<div style="font-size:13px;opacity:0.9" id="progressLabel">0/' + totalQuestions + ' answered (0%)</div>';
appHtml += '</div>';

for (const sec of paper.sections) {
  if (sec.type === 'passage-based') {
    appHtml += renderReading(sec);
  } else if (sec.type === 'listening') {
    appHtml += renderListening(sec);
  } else {
    appHtml += renderGrammar(sec);
  }
}

appHtml += '<div class="submit-area">';
appHtml += '<button class="submit-btn" id="submitBtn" onclick="submitPaper()">Submit Answers</button>';
appHtml += '<div class="submit-status" id="submitStatus"></div>';
appHtml += '</div>';

document.getElementById('app').innerHTML = appHtml;

// Restore saved answers
loadFromStorage();

// Re-apply selected states for restored answers
for (const qId of Object.keys(answers)) {
  const radio = document.querySelector('input[name="' + qId + '"][value="' + answers[qId] + '"]');
  if (radio) {
    radio.checked = true;
    radio.closest('label').classList.add('selected');
  }
}
updateProgress();

// Auto-detect submission for Playwright
let detectInterval = setInterval(function() {
  if (window.__lastAnswers) {
    clearInterval(detectInterval);
  }
}, 500);

// Scroll to top
window.scrollTo(0, 0);
</script>
</body>
