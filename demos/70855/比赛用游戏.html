 = 18厘米"},{"id":"m39","category":"数学","difficulty":"medium","question":"120秒 = ?分钟","options":["1分钟","2分钟","3分钟","4分钟"],"correctIndex":1,"explanation":"120秒 = 2分钟（1分钟 = 60秒）"},{"id":"m40","category":"数学","difficulty":"hard","question":"一个等腰三角形的顶角是40°，底角是多少度？","options":["50°","60°","70°","80°"],"correctIndex":2,"explanation":"三角形内角和180°，两个底角和 = 180° - 40° = 140°，每个底角 = 70°"},{"id":"m41","category":"数学","difficulty":"hard","question":"一个数的25%是40，这个数是多少？","options":["100","120","160","200"],"correctIndex":2,"explanation":"40 ÷ 25% = 40 ÷ 0.25 = 160"},{"id":"m42","category":"数学","difficulty":"hard","question":"一个正方体的棱长是4厘米，它的体积是多少？","options":["16立方厘米","48立方厘米","64立方厘米","96立方厘米"],"correctIndex":2,"explanation":"正方体体积 = 棱长³ = 4³ = 64立方厘米"},{"id":"m43","category":"数学","difficulty":"hard","question":"18、24和36的最大公约数是？","options":["4","6","8","12"],"correctIndex":1,"explanation":"18=2×3², 24=2³×3, 36=2²×3²，最大公约数是2×3=6"},{"id":"m44","category":"数学","difficulty":"hard","question":"一件商品原价200元，打8折后是多少元？","options":["140元","150元","160元","170元"],"correctIndex":2,"explanation":"200 × 0.8 = 160元"},{"id":"m45","category":"数学","difficulty":"hard","question":"圆的直径是10厘米，半径是多少？","options":["2.5厘米","5厘米","10厘米","20厘米"],"correctIndex":1,"explanation":"半径 = 直径 ÷ 2 = 10 ÷ 2 = 5厘米"},{"id":"m46","category":"数学","difficulty":"hard","question":"一个扇形的圆心角是90°，半径是4厘米，面积是多少？","options":["π平方厘米","2π平方厘米","4π平方厘米","8π平方厘米"],"correctIndex":2,"explanation":"扇形面积 = πr² × (圆心角/360°) = 16π × (90/360) = 4π平方厘米"},{"id":"m47","category":"数学","difficulty":"hard","question":"如果2x + 3y = 12，且x = 3，那么y = ?","options":["1","2","3","4"],"correctIndex":1,"explanation":"2×3 + 3y = 12，6 + 3y = 12，3y = 6，y = 2"},{"id":"m48","category":"数学","difficulty":"hard","question":"1到100中，所有质数的和是多少？","options":["1060","1143","1160","1220"],"correctIndex":1,"explanation":"1到100的质数有25个，它们的和是1143。"},{"id":"m49","category":"数学","difficulty":"hard","question":"一个圆柱的侧面积公式是？（r为底面半径，h为高）","options":["πrh","2πrh","πr²h","2πr²h"],"correct
