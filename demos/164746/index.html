<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>私人酒吧</title>
<link rel="stylesheet" href="css/common.css">
<style>
.landing {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  text-align: center;
}
.landing-logo { font-size: 64px; margin-bottom: 16px; }
.landing h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
.landing p { color: var(--muted); margin-bottom: 40px; font-size: 15px; }
.mode-cards { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 14px; }
.mode-card {
  background: var(--bg2);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 24px 20px;
  text-align: left;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 16px;
}
.mode-card:active { border-color: var(--accent); transform: scale(0.98); }
.mode-card-icon { font-size: 36px; flex-shrink: 0; }
.mode-card h3 { font-size: 18px; margin-bottom: 2px; }
.mode-card p { font-size: 13px; color: var(--muted); margin: 0; }
.mode-card .arrow { margin-left: auto; color: var(--muted); font-size: 18px; }
.customer-entries { width: 100%; max-width: 320px; margin-top: 32px; }
.customer-entries .divider {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 14px;
  position: relative;
}
.customer-entries .divider::before,
.customer-entries .divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 30%;
  height: 1px;
  background: var(--rule);
}
.customer-entries .divider::before { left: 0; }
.customer-entries .divider::after { right: 0; }
.small-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg2);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 14px 16px;
  text-decoration: none;
  color: var(--ink);
  margin-bottom: 10px;
  cursor: pointer;
}
.small-card:active { border-color: var(--accent); }
.small-card-icon { font-size: 24px; }
.small-card h4 { font-size: 15px; }
.small-card p { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
</style>
</head>
<body>
<div class="app-container">
  <div class="landing">
    <div class="landing-logo">🍸</div>
    <h1>私人酒吧</h1>
    <p>你的专属调酒空间</p>

    <div class="mode-cards">
      <a href="admin/bar-home.html" class="mode-card">
        <div class="mode-card-icon">🥃</div>
        <div style="flex:1">
          <h3>我的酒吧</h3>
          <p>管理酒单、库存和订单，查看销售数据</p>
        </div>
        <span class="arrow">›</span>
      </a>
      <a href="admin/party-home.html" class="mode-card">
        <div class="mode-card-icon">🎉</div>
        <div style="flex:1">
          <h3>我的酒局</h3>
          <p>创建酒局、邀请朋友、管理聚会</p>
        </div>
        <span class="arrow">›</span>
      </a>
    </div>

    <div class="customer-entries">
      <div class="divider">我是顾客</div>
      <a href="customer/party-join.html" class="small-card">
        <div class="small-card-icon">🎉</div>
        <div>
          <h4>加入酒局</h4>
          <p>输入邀请码加入朋友酒局</p>
        </div>
      </a>
      <a href="customer/bar-home.html" class="small-card">
        <div class="small-card-icon">🥃</div>
        <div>
          <h4>浏览酒吧</h4>
          <p>扫码或链接进入酒吧</p>
        </div>
      </a>
    </div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script>
if (!Storage.isInitialized()) Data.init();
</script>
</body>
</html>
