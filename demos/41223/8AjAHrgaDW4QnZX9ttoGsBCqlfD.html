<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowledge City Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="hud">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true">KC</span>
          <div>
            <h1>知识城市</h1>
            <p>Garbage In, Treasure Out</p>
          </div>
        </div>

        <div class="hud-controls">
          <label class="search-field">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="搜索建筑、道路、标签" />
          </label>
          <div class="metric-strip" id="metricStrip"></div>
          <button id="resetButton" class="icon-button" type="button" title="重置演示数据" aria-label="重置演示数据">↺</button>
          <button id="exportButton" class="icon-button primary" type="button" title="导出本地数据" aria-label="导出本地数据">⇩</button>
        </div>
      </header>

      <section class="city-stage" aria-label="知识城市游戏地图">
        <div class="skyline-backdrop" aria-hidden="true">
          <span class="skyline-tower tower-a"></span>
          <span class="skyline-tower tower-b"></span>
          <span class="skyline-tower tower-c"></span>
          <span class="skyline-tower tower-d"></span>
          <span class="skyline-tower tower-e"></span>
        </div>

        <div class="city-map" id="cityMap">
          <div class="district-zone zone-medical"><span>医学区</span></div>
          <div class="district-zone zone-video"><span>短视频区</span></div>
          <div class="district-zone zone-social"><span>社交区</span></div>
          <div class="district-zone zone-mirror"><span>镜像区</span></div>

          <div class="road road-horizontal road-north"><span>知识大道</span></div>
          <div class="road road-horizontal road-center"><span>中央环路</span></div>
          <div class="road road-horizontal road-coast"><span>滨海路</span></div>
          <div class="road road-vertical road-west"><span>骨科路</span></div>
          <div class="road road-vertical road-mid"><span>搭子路</span></div>
          <div class="road road-vertical road-east"><span>爆款路</span></div>
          <div class="road road-vertical road-far-east"><span>自省路</span></div>
          <div class="intersection i-1" aria-hidden="true"></div>
          <div class="intersection i-2" aria-hidden="true"></div>
          <div class="intersection i-3" aria-hidden="true"></div>
          <div class="intersection i-4" aria-hidden="true"></div>

          <div class="plots" id="plots"></div>

          <section class="harbor" aria-label="输入码头">
            <div class="sea">
              <span class="wave wave-1"></span>
              <span class="wave wave-2"></span>
              <span class="wave wave-3"></span>
            </div>
            <div class="dock-card">
              <div class="dock-heading">
                <div>
                  <h2>输入码头</h2>
                  <p>本地文件、截图、文章和一段话从海边入城。</p>
                </div>
                <span class="storage-badge" id="storageBadge">LocalStorage</span>
              </div>

              <form class="dock-form" id="knowledgeForm">
                <label>
                  上传区域
                  <select id="areaSelect" required>
                    <option value="auto">自动识别区域</option>
                    <option value="medical">医学区 - 骨科路</option>
                    <option value="video">短视频区 - 爆款路</option>
                    <option value="social">社交区 - 搭子路</option>
                    <option value="mirror">镜像区 - 自省路</option>
                  </select>
                </label>
                <label>
                  入库方式
                  <select id="routeSelect" required>
                    <option value="auto">自动归类</option>
                    <option value="merge">合并到所选建筑</option>
                    <option value="new">新建上传建筑</option>
                  </select>
                </label>
                <label>
                  参考建筑
                  <select id="buildingSelect" required></select>
                </label>
                <label>
                  类型
                  <select id="typeSelect" required>
                    <option value="文件">文件</option>
                    <option value="截图">截图</option>
                    <option value="文章">文章</option>
                    <option value="一段话">一段话</option>
                  </select>
                </label>
                <label class="wide file-upload">
                  本地文件
                  <input id="fileInput" type="file" multiple />
                </label>
                <label>
                  标题
                  <input id="titleInput" maxlength="60" placeholder="留空则使用文件名" />
                </label>
                <label>
                  来源
                  <input id="sourceInput" maxlength="180" placeholder="URL、备注或文件名" />
                </label>
                <label class="wide">
                  摘要
                  <textarea id="summaryInput" rows="2" maxlength="220" placeholder="提炼成一条可搜索、可复用的知识。"></textarea>
                </label>
                <label>
                  标签
                  <input id="tagsInput" maxlength="80" placeholder="逗号分隔" />
                </label>
                <button class="submit-button" type="submit">卸货入城</button>
              </form>
            </div>
          </section>
        </div>
      </section>
    </main>

    <div class="modal-backdrop" id="buildingModal" aria-hidden="true">
      <article class="building-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button id="closeModalButton" class="modal-close" type="button" aria-label="关闭">×</button>
        <div id="modalContent"></div>
      </article>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
