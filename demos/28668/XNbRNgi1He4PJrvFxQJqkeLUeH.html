<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>长辈就医助手 · 简单好用</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #FFF8E7 0%, #FFE4C4 100%);
    color: #333;
    font-size: 22px;
    line-height: 1.8;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
  }

  /* 顶部标题 */
  .header {
    text-align: center;
    padding: 25px 20px 35px;
    background: linear-gradient(135deg, #FF7043 0%, #FF9800 100%);
    border-radius: 20px;
    color: white;
    margin-bottom: 30px;
    box-shadow: 0 6px 20px rgba(255, 112, 67, 0.25);
  }

  .header h1 {
    font-size: 42px;
    font-weight: bold;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }

  .header p {
    font-size: 24px;
    opacity: 0.95;
  }

  /* 导航标签 */
  .tabs {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .tab-btn {
    flex: 1;
    min-width: 200px;
    padding: 20px 15px;
    font-size: 26px;
    font-weight: bold;
    background: white;
    border: 3px solid #FFB74D;
    border-radius: 15px;
    cursor: pointer;
    color: #E65100;
    transition: all 0.3s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  }

  .tab-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 15px rgba(255, 112, 67, 0.3);
  }

  .tab-btn.active {
    background: linear-gradient(135deg, #FF7043 0%, #FF9800 100%);
    color: white;
    border-color: #FF7043;
  }

  .tab-icon {
    display: block;
    font-size: 36px;
    margin-bottom: 8px;
  }

  /* 模块卡片 */
  .module {
    background: white;
    border-radius: 20px;
    padding: 35px;
    margin-bottom: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    display: none;
  }

  .module.active {
    display: block;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .module-title {
    font-size: 32px;
    font-weight: bold;
    color: #E65100;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .module-desc {
    font-size: 22px;
    color: #666;
    margin-bottom: 25px;
    padding-left: 55px;
  }

  .module-title::before {
    content: "";
    display: inline-block;
    width: 12px;
    height: 40px;
    background: linear-gradient(180deg, #FF7043, #FF9800);
    border-radius: 6px;
  }

  /* 输入区域 */
  textarea, input[type="text"], input[type="date"], select {
    width: 100%;
    padding: 18px 20px;
    font-size: 24px;
    border: 3px solid #FFCC80;
    border-radius: 12px;
    background: #FFFBF5;
    color: #333;
    font-family: inherit;
    outline: none;
    transition: border-color 0.3s;
    line-height: 1.6;
  }

  textarea {
    min-height: 180px;
    resize: vertical;
  }

  textarea:focus, input:focus, select:focus {
    border-color: #FF7043;
    background: white;
  }

  label {
    display: block;
    font-size: 24px;
    font-weight: bold;
    color: #555;
    margin-bottom: 10px;
    margin-top: 15px;
  }

  label:first-child {
    margin-top: 0;
  }

  /* 按钮 */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px 35px;
    font-size: 26px;
    font-weight: bold;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }

  .btn-primary {
    background: linear-gradient(135deg, #FF7043 0%, #FF9800 100%);
    color: white;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(255, 112, 67, 0.4);
  }

  .btn-primary:active {
    transform: translateY(0);
  }

  .btn-secondary {
    background: #FFF3E0;
    color: #E65100;
    border: 3px solid #FFB74D;
  }

  .btn-secondary:hover {
    background: #FFE0B2;
  }

  .btn-success {
    background: linear-gradient(135deg, #66BB6A 0%, #43A047 100%);
    color: white;
  }

  .btn-success:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(76, 175, 80, 0.4);
  }

  .btn-group {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-top: 25px;
  }

  /* 结果展示区 */
  .result-box {
    background: linear-gradient(135deg, #FFF3E0 0%, #FFE8CC 100%);
    border: 3px dashed #FF9800;
    border-radius: 15px;
    padding: 25px;
    margin-top: 25px;
    min-height: 80px;
  }

  .result-title {
    font-size: 26px;
    font-weight: bold;
    color: #E65100;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 2px solid #FFCC80;
  }

  .result-content {
    font-size: 22px;
    color: #444;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 异常指标标签 */
  .tag {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 20px;
    font-weight: bold;
    margin-right: 8px;
  }

  .tag-danger {
    background: #FFEBEE;
    color: #C62828;
    border: 2px solid #EF5350;
  }

  .tag-warning {
    background: #FFF8E1;
    color: #EF6C00;
    border: 2px solid #FFB74D;
  }

  .tag-normal {
    background: #E8F5E9;
    color: #2E7D32;
    border: 2px solid #66BB6A;
  }

  .tag-info {
    background: #E3F2FD;
    color: #1565C0;
    border: 2px solid #64B5F6;
  }

  /* 项目卡片 */
  .item-card {
    background: white;
    border: 2px solid #FFCC80;
    border-radius: 12px;
    padding: 18px 22px;
    margin: 12px 0;
    display: flex;
    align-items: center;
    gap: 15px;
    transition: all 0.2s;
  }

  .item-card:hover {
    background: #FFF8E7;
    border-color: #FF9800;
  }

  .item-card.checked {
    background: #E8F5E9;
    border-color: #66BB6A;
  }

  .item-checkbox {
    width: 30px;
    height: 30px;
    cursor: pointer;
    accent-color: #FF7043;
    flex-shrink: 0;
  }

  .item-text {
    font-size: 24px;
    flex: 1;
  }

  .item-card.checked .item-text {
    text-decoration: line-through;
    color: #888;
  }

  /* 指标行 */
  .indicator-row {
    background: white;
    border: 2px solid #FFE0B2;
    border-radius: 10px;
    padding: 15px 20px;
    margin: 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .indicator-name {
    font-size: 23px;
    font-weight: bold;
    color: #444;
    flex: 1;
    min-width: 180px;
  }

  .indicator-value {
    font-size: 22px;
    color: #333;
  }

  .indicator-explain {
    width: 100%;
    font-size: 21px;
    color: #666;
    padding-top: 8px;
    border-top: 1px dashed #FFCC80;
    margin-top: 5px;
  }

  .section-subtitle {
    font-size: 26px;
    font-weight: bold;
    color: #E65100;
    margin: 25px 0 12px;
    padding-left: 15px;
    border-left: 6px solid #FF9800;
  }

  /* 提示文字 */
  .tip {
    background: #FFF3E0;
    color: #E65100;
    padding: 15px 20px;
    border-radius: 10px;
    font-size: 22px;
    margin: 15px 0;
    border-left: 6px solid #FF9800;
  }

  /* 加载动画 */
  .loading {
    text-align: center;
    padding: 30px;
    font-size: 24px;
    color: #E65100;
  }

  .spinner {
    display: inline-block;
    width: 40px;
    height: 40px;
    border: 5px solid #FFCC80;
    border-top-color: #FF7043;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 15px;
    vertical-align: middle;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* 底部 */
  .footer {
    text-align: center;
    padding: 30px 20px;
    color: #888;
    font-size: 20px;
    margin-top: 20px;
  }

  .footer strong {
    color: #E65100;
  }

  /* 复制成功提示 */
  .copy-toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #43A047;
    color: white;
    padding: 20px 40px;
    border-radius: 15px;
    font-size: 26px;
    font-weight: bold;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    z-index: 1000;
    display: none;
  }

  .copy-toast.show {
    display: block;
    animation: popIn 0.3s ease;
  }

  @keyframes popIn {
    from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }

  /* 日期选择样式增强 */
  input[type="date"] {
    cursor: pointer;
  }

  /* 示例按钮 */
  .example-btn {
    display: inline-block;
    background: #E3F2FD;
    color: #1565C0;
    border: 2px solid #64B5F6;
    padding: 10px 18px;
    font-size: 20px;
    border-radius: 10px;
    cursor: pointer;
    margin-left: 10px;
    font-family: inherit;
  }

  .example-btn:hover {
    background: #BBDEFB;
  }

  @media (max-width: 768px) {
    body { font-size: 20px; padding: 12px; }
    .header h1 { font-size: 32px; }
    .header p { font-size: 20px; }
    .tab-btn { font-size: 22px; min-width: 150px; padding: 15px 10px; }
    .tab-icon { font-size: 28px; }
    .module { padding: 20px; }
    .module-title { font-size: 26px; }
    .module-title::before { height: 32px; }
    textarea, input, select { font-size: 20px; padding: 14px; }
    .btn { font-size: 22px; padding: 16px 25px; }
    label { font-size: 22px; }
    .item-text { font-size: 21px; }
    .section-subtitle { font-size: 23px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>👴👵 长辈就医助手</h1>
    <p>字大 · 简单 · 好用 · 一看就懂</p>
  </div>

  <!-- 导航标签 -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(0, this)">
      <span class="tab-icon">📋</span>体检报告解读
    </button>
    <button class="tab-btn" onclick="switchTab(1, this)">
      <span class="tab-icon">📅</span>复诊提醒
    </button>
    <button class="tab-btn" onclick="switchTab(2, this)">
      <span class="tab-icon">🎒</span>就医材料清单
    </button>
    <button class="tab-btn" onclick="switchTab(3, this)">
      <span class="tab-icon">📦</span>我的结果
    </button>
  </div>

  <!-- 模块1：体检报告解读 -->
  <div class="module active" id="module-0">
    <div class="module-title">体检报告解读</div>
    <div class="module-desc">把化验单或体检报告的文字粘贴到下方，我来帮您翻译成大白话，并告诉您哪里需要注意。</div>

    <label for="report-text">📝 请粘贴体检报告文字</label>
    <textarea id="report-text" placeholder="例如：&#10;血糖 6.8 mmol/L （参考值：3.9-6.1）&#10;血压 145/90 mmHg&#10;总胆固醇 6.2 mmol/L （参考值：<5.2）&#10;尿酸 480 μmol/L （参考值：208-428）"></textarea>

    <div style="margin-top: 15px;">
      <button class="example-btn" onclick="loadExampleReport()">👉 点我试试示例报告</button>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="interpretReport()">🔍 开始解读</button>
      <button class="btn btn-secondary" onclick="clearReport()">🗑️ 清空内容</button>
    </div>

    <div class="result-box" id="report-result" style="display:none;">
      <div class="result-title">📄 解读结果</div>
      <div class="result-content" id="report-result-content"></div>
      <div class="btn-group">
        <button class="btn btn-success" onclick="copyResult('report-result-content')">📋 复制结果</button>
        <button class="btn btn-secondary" onclick="saveToCollection('report')">⭐ 保存到"我的结果"</button>
      </div>
    </div>
  </div>

  <!-- 模块2：复诊提醒 -->
  <div class="module" id="module-1">
    <div class="module-title">复诊提醒</div>
    <div class="module-desc">填写复诊信息，自动生成备忘清单，方便查看和保存。</div>

    <label for="followup-date">📅 复诊日期</label>
    <input type="date" id="followup-date">

    <label for="followup-department">🏥 复诊科室</label>
    <input type="text" id="followup-department" placeholder="例如：心内科 / 内分泌科 / 骨科">

    <label for="followup-doctor">👨‍⚕️ 主治医生（选填）</label>
    <input type="text" id="followup-doctor" placeholder="例如：张医生">

    <label for="followup-advice">💊 用药医嘱 / 注意事项</label>
    <textarea id="followup-advice" placeholder="例如：&#10;1. 每天早上吃降压药1片&#10;2. 少吃盐，多走路&#10;3. 每周测一次血压"></textarea>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="generateFollowup()">✅ 生成复诊备忘</button>
      <button class="btn btn-secondary" onclick="clearFollowup()">🗑️ 清空</button>
    </div>

    <div class="result-box" id="followup-result" style="display:none;">
      <div class="result-title">📅 我的复诊备忘</div>
      <div class="result-content" id="followup-result-content"></div>
      <div class="btn-group">
        <button class="btn btn-success" onclick="copyResult('followup-result-content')">📋 复制备忘</button>
        <button class="btn btn-secondary" onclick="saveToCollection('followup')">⭐ 保存到"我的结果"</button>
      </div>
    </div>
  </div>

  <!-- 模块3：就医材料清单 -->
  <div class="module" id="module-2">
    <div class="module-title">就医材料清单</div>
    <div class="module-desc">选择您要去做的事，系统会列出需要带的物品，避免遗漏。</div>

    <label for="visit-type">📌 选择就医类型</label>
    <select id="visit-type" onchange="generateMaterials()">
      <option value="">-- 请选择 --</option>
      <option value="checkup">🏥 普通体检</option>
      <option value="followup">🔄 门诊复诊</option>
      <option value="inpatient">🛏️ 住院治疗</option>
    </select>

    <div class="result-box" id="materials-result" style="display:none;">
      <div class="result-title">🎒 必备材料清单（可勾选已准备好的）</div>
      <div id="materials-list"></div>
      <div class="btn-group">
        <button class="btn btn-success" onclick="copyMaterials()">📋 复制清单文字</button>
        <button class="btn btn-secondary" onclick="saveToCollection('materials')">⭐ 保存到"我的结果"</button>
      </div>
    </div>
  </div>

  <!-- 模块4：结果展示 -->
  <div class="module" id="module-3">
    <div class="module-title">我的结果</div>
    <div class="module-desc">所有保存的内容都在这里，随时可以查看和复制。</div>

    <div id="collection-empty" style="text-align:center; padding: 40px; color: #888; font-size: 24px;">
      <div style="font-size: 80px; margin-bottom: 20px;">📭</div>
      这里还没有保存的内容<br>
      请在上方模块中点击"⭐ 保存到我的结果"
    </div>

    <div id="collection-content"></div>

    <div id="collection-actions" style="display:none; margin-top: 25px;">
      <div class="btn-group">
        <button class="btn btn-success" onclick="copyAllCollection()">📋 复制全部内容</button>
        <button class="btn btn-secondary" onclick="clearCollection()">🗑️ 清空我的结果</button>
      </div>
    </div>
  </div>

  <div class="footer">
    本工具仅供参考，不能替代医生诊断。<br>
    如身体不适，请及时就医。<strong>关爱长辈 · 健康相伴 ❤️</strong>
  </div>
</div>

<div class="copy-toast" id="copy-toast">✓ 已复制到剪贴板</div>

<script>
  // ============== 状态管理 ==============
  const state = {
    report: null,
    followup: null,
    materials: null,
    materialsType: '',
    collection: {
      report: null,
      followup: null,
      materials: null
    }
  };

  // ============== 切换标签 ==============
  function switchTab(index, btn) {
    document.querySelectorAll('.module').forEach((m, i) => {
      m.classList.toggle('active', i === index);
    });
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ============== 模块1：体检报告解读 ==============
  const EXAMPLE_REPORT = `体检报告摘要

血常规：
白细胞计数 7.2 ×10^9/L （参考值：4.0-10.0）
红细胞计数 4.8 ×10^12/L （参考值：4.3-5.8）
血红蛋白 145 g/L （参考值：130-175）
血小板 220 ×10^9/L （参考值：125-350）

生化指标：
空腹血糖 7.2 mmol/L （参考值：3.9-6.1）
总胆固醇 6.5 mmol/L （参考值：<5.2）
甘油三酯 2.8 mmol/L （参考值：<1.7）
高密度脂蛋白 1.0 mmol/L （参考值：>1.0）
低密度脂蛋白 4.2 mmol/L （参考值：<3.4）
尿酸 485 μmol/L （参考值：208-428）
谷丙转氨酶 42 U/L （参考值：<40）

血压：148/92 mmHg （参考值：<140/90）

超声提示：轻度脂肪肝`;

  function loadExampleReport() {
    document.getElementById('report-text').value = EXAMPLE_REPORT;
  }

  function clearReport() {
    document.getElementById('report-text').value = '';
    document.getElementById('report-result').style.display = 'none';
    state.report = null;
  }

  // 简易关键词解析（本地AI模拟）
  function parseNumber(str) {
    const match = str.match(/(-?\d+\.?\d*)/);
    return match ? parseFloat(match[1]) : null;
  }

  function extractRange(text) {
    const match = text.match(/[（(]?参考值[：:]?\s*([^）)\n]+)/);
    if (match) {
      const rangeText = match[1];
      const nums = rangeText.match(/(\d+\.?\d*)/g);
      if (nums && nums.length >= 2) {
        return { min: parseFloat(nums[0]), max: parseFloat(nums[1]) };
      }
      if (rangeText.match(/[<＞]/)) {
        const n = parseNumber(rangeText);
        if (rangeText.includes('<')) return { min: -Infinity, max: n };
        return { min: n, max: Infinity };
      }
      if (rangeText.match(/[>＞]/)) {
        const n = parseNumber(rangeText);
        return { min: n, max: Infinity };
      }
    }
    // 尝试简单范围 "数字-数字"
    const simple = text.match(/[（(]\s*(\d+\.?\d*)\s*[-~至]\s*(\d+\.?\d*)/);
    if (simple) return { min: parseFloat(simple[1]), max: parseFloat(simple[2]) };
    return null;
  }

  // 常见指标知识库
  const INDICATOR_KNOWLEDGE = {
    '血糖': { unit: 'mmol/L', normal: [3.9, 6.1], lowAdvice: '血糖偏低，可能会头晕心慌。建议随身带糖果，按时吃饭。', highAdvice: '血糖偏高，可能是糖尿病前期。建议少吃甜食、白米饭，多吃蔬菜，饭后散步30分钟。1-3个月复查。', plain: '就是血液里的糖分，太高易得糖尿病' },
    '空腹血糖': { unit: 'mmol/L', normal: [3.9, 6.1], lowAdvice: '血糖偏低，可能会头晕心慌。建议随身带糖果，按时吃饭。', highAdvice: '血糖偏高，可能是糖尿病前期。建议少吃甜食、白米饭，多吃蔬菜，饭后散步30分钟。1-3个月复查。', plain: '空腹时血液里的糖分' },

  function matchIndicator(line) {
    for (const key in INDICATOR_KNOWLEDGE) {
      if (line.includes(key)) return INDICATOR_KNOWLEDGE[key];
    }
    return null;
  }

  function interpretReport() {
    const text = document.getElementById('report-text').value.trim();
    if (!text) {
      showToast('请先粘贴报告内容哦', '#EF5350');
      return;
    }

    const resultBox = document.getElementById('report-result');
    const resultContent = document.getElementById('report-result-content');

    // 显示加载
    resultBox.style.display = 'block';
    resultContent.innerHTML = '<div class="loading"><span class="spinner"></span>正在解读，请稍候...</div>';

    setTimeout(() => {
      const lines = text.split('\n').filter(l => l.trim());
      const indicators = [];
      const unknownLines = [];

      // 尝试解析每一行
      for (const line of lines) {
        const indicator = matchIndicator(line);
        if (indicator) {
          const value = parseNumber(line);
          const range = extractRange(line) || { min: indicator.normal[0], max: indicator.normal[1] };
          let status = 'normal';
          let advice = '';

          if (value !== null) {
            if (value < range.min) {
              status = 'low';
              advice = indicator.lowAdvice || '指标偏低，建议咨询医生。';
            } else if (value > range.max) {
              status = 'high';
              advice = indicator.highAdvice || '指标偏高，建议咨询医生。';
            }
          } else {
            // 从文本中尝试判断
            if (line.includes('高') || line.includes('↑')) {
              status = 'high';
              advice = indicator.highAdvice || '指标偏高，建议咨询医生。';
            } else if (line.includes('低') || line.includes('↓')) {
              status = 'low';
              advice = indicator.lowAdvice || '指标偏低，建议咨询医生。';
            }
          }

          // 提取指标名称
          let name = line;
          for (const key in INDICATOR_KNOWLEDGE) {
            if (line.includes(key)) { name = key; break; }
          }

          indicators.push({ name: name, raw: line, value: value, range: range, status: status, advice: advice, plain: indicator.plain });
        } else if (line.match(/(偏高|偏低|↑|↓|异常)/)) {
          unknownLines.push({ raw: line, status: 'warning' });
        }
      }

      // 血压特殊处理
      const bloodPressure = text.match(/血压[:：]?\s*(\d+)[\/／](\d+)/);
      if (bloodPressure) {
        const systolic = parseInt(bloodPressure[1]);
        const diastolic = parseInt(bloodPressure[2]);
        let status = 'normal', advice = '';
        if (systolic >= 140 || diastolic >= 90) {
          status = 'high';
          advice = '血压偏高！请少吃盐（每天＜5克），少吃肥肉，按时吃药。建议每周测2-3次血压。';
        } else if (systolic < 90 || diastolic < 60) {
          status = 'low';
          advice = '血压偏低，起身要慢，避免头晕摔倒。';
        } else {
          advice = '血压正常，继续保持良好生活习惯。';
        }
        indicators.unshift({
          name: '血压',
          raw: `血压 ${systolic}/${diastolic} mmHg`,
          value: `${systolic}/${diastolic}`,
          range: { min: 90, max: 140 },
          status: status,
          advice: advice,
          plain: '血管里的压力，高了会头晕头痛'
        });
      }

      // 脂肪肝等提示
      if (text.includes('脂肪肝')) {
        indicators.push({ name: '脂肪肝', raw: '超声提示脂肪肝', value: '有', range: null, status: 'warning', advice: '建议控制饮食，减少油腻甜食，每天运动30分钟（快走/慢跑），3-6个月复查B超。', plain: '肝脏里堆积了脂肪' });
      }
      if (text.includes('结节') || text.includes('囊肿')) {
        indicators.push({ name: '结节/囊肿', raw: '发现结节或囊肿', value: '有', range: null, status: 'warning', advice: '结节/囊肿多数为良性，但建议定期复查追踪大小变化，如有增大请及时就医。', plain: '身体里长的小包块' });
      }

      // 生成HTML
      let html = '';

      // 总体评价
      const abnormalCount = indicators.filter(i => i.status !== 'normal').length;
      if (indicators.length === 0) {
        html += '<div class="tip">🤔 未能识别出明确的医学指标。<br>请检查是否粘贴了完整的报告内容，或报告中使用了特殊格式。</div>';
      } else {
        if (abnormalCount === 0) {
          html += '<div class="tip">🎉 好消息！目前解读的指标都在正常范围内，请继续保持健康的生活方式，定期体检。</div>';
        } else {
          html += `<div class="tip">⚠️ 共发现 <strong>${abnormalCount}</strong> 项需要注意的指标。<br>以下是详细解读和建议（仅供参考，具体请咨询医生）：</div>`;
        }
      }

      // 异常指标优先展示
      const abnormal = indicators.filter(i => i.status !== 'normal');
      const normal = indicators.filter(i => i.status === 'normal');

      if (abnormal.length > 0) {
        html += '<div class="section-subtitle">🔴 需要注意的指标</div>';
        for (const ind of abnormal) {
          const tagText = ind.status === 'high' ? '<span class="tag tag-danger">偏高 ⬆️</span>' : '<span class="tag tag-warning">偏低 ⬇️</span>';
          const valText = ind.value !== null ? ind.value : '(需查看原文)';
          const rangeText = ind.range && isFinite(ind.range.min) && isFinite(ind.range.max)
            ? `正常范围: ${ind.range.min}~${ind.range.max}`
            : (ind.range && isFinite(ind.range.max) ? `正常范围: ＜${ind.range.max}` : '');
          html += `
            <div class="indicator-row" style="border-color:#EF5350; background:#FFF5F5;">
              <div class="indicator-name">${ind.name} ${tagText}</div>
              <div class="indicator-value"><strong>${valText}</strong></div>
              <div class="indicator-explain">
                <strong>📖 大白话：</strong>${ind.plain}<br>
                <strong>💡 建议：</strong>${ind.advice}
                ${rangeText ? `<br><strong style="color:#888;">${rangeText}</strong>` : ''}
              </div>
            </div>`;
        }
      }

      if (normal.length > 0) {
        html += '<div class="section-subtitle">✅ 正常的指标（共' + normal.length + '项）</div>';
        for (const ind of normal) {
          const valText = ind.value !== null ? ind.value : '(查看原文)';
          html += `
            <div class="indicator-row" style="border-color:#66BB6A; background:#F1F8E9;">
              <div class="indicator-name">${ind.name} <span class="tag tag-normal">正常 ✓</span></div>
              <div class="indicator-value"><strong>${valText}</strong></div>
              <div class="indicator-explain">
                <strong>📖 大白话：</strong>${ind.plain}
              </div>
            </div>`;
        }
      }

      // 饮食总建议
      html += '<div class="section-subtitle">🍎 整体生活建议</div>';
      const generalAdvice = [];
      generalAdvice.push('🥗 <strong>饮食：</strong>少油少盐少糖，多吃蔬菜水果。每天蔬菜≥500克，水果200-350克。');
      generalAdvice.push('🚶 <strong>运动：</strong>每天走路30分钟（约6000步），每周5天。天气不好可在家原地踏步。');
      generalAdvice.push('😴 <strong>睡眠：</strong>每晚保证7-8小时睡眠，中午可小憩20-30分钟。');
      generalAdvice.push('💧 <strong>喝水：</strong>每天喝1500-2000毫升温水（约7-8杯），不憋尿。');
      generalAdvice.push('💊 <strong>用药：</strong>按医嘱吃药，不要自行加减或停药。吃药前可喝水润喉。');
      generalAdvice.push('📅 <strong>复查：</strong>异常指标建议1-3个月后复查，如有不舒服立即就医。');
      generalAdvice.push('👨‍👩‍👧 <strong>陪伴：</strong>就医时最好有家人陪同，避免独自外出。');
      html += generalAdvice.map(a => `<div class="indicator-row">${a}</div>`).join('');

      html += '<div class="tip" style="margin-top:25px;">👨‍⚕️ 温馨提示：以上解读基于通用医学知识，仅供参考。具体诊断和治疗方案请以医生意见为准。</div>';

      resultContent.innerHTML = html;
      state.report = { html: html, time: new Date().toLocaleString('zh-CN') };
    }, 1500);
  }

  function generateFollowup() {
    const date = document.getElementById('followup-date').value;
    const dept = document.getElementById('followup-department').value.trim();
    const doctor = document.getElementById('followup-doctor').value.trim();
    const advice = document.getElementById('followup-advice').value.trim();

    if (!date) { showToast('请选择复诊日期', '#EF5350'); return; }
    if (!dept) { showToast('请填写科室', '#EF5350'); return; }

    const resultBox = document.getElementById('followup-result');
    const resultContent = document.getElementById('followup-result-content');

    // 计算天数差
    const today = new Date();
    today.setHours(0,0,0,0);
    const target = new Date(date);
    const diffDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));

    let dayText = '';
    if (diffDays > 0) dayText = `<span class="tag tag-info">还有 ${diffDays} 天</span>`;
    else if (diffDays === 0) dayText = `<span class="tag tag-warning">就是今天！</span>`;
    else dayText = `<span class="tag tag-danger">已过 ${-diffDays} 天</span>`;

    const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    const weekday = weekdays[target.getDay()];

    let html = `
      <div class="indicator-row" style="background:#FFF3E0;">
        <div class="indicator-name">📅 复诊日期</div>
        <div class="indicator-value"><strong>${date}（${weekday}）</strong> ${dayText}</div>
      </div>
      <div class="indicator-row" style="background:#FFF3E0;">
        <div class="indicator-name">🏥 就诊科室</div>
        <div class="indicator-value"><strong>${dept}</strong></div>
      </div>`;

    if (doctor) {
      html += `
      <div class="indicator-row" style="background:#FFF3E0;">
        <div class="indicator-name">👨‍⚕️ 主治医生</div>
        <div class="indicator-value"><strong>${doctor}</strong></div>
      </div>`;
    }

    if (advice) {
      html += '<div class="section-subtitle">💊 用药医嘱与注意事项</div>';
      const advices = advice.split('\n').filter(a => a.trim());
      for (let i = 0; i < advices.length; i++) {
        html += `<div class="item-card">
                  <input type="checkbox" class="item-checkbox" onchange="this.parentElement.classList.toggle('checked')">
                  <span class="item-text">${advices[i]}</span>
                </div>`;
      }
    }

    // 自动生成的温馨备忘
    html += '<div class="section-subtitle">🎯 复诊前备忘清单</div>';
    const memos = [
      '带齐：身份证、医保卡、门诊卡',
      '带齐：既往病历、检查报告、近期用药清单',
      '准备好：想问医生的问题（建议写下来）',
      '如需要抽血：前一天晚上8点后禁食禁水',
      '穿宽松易脱的衣服（避免穿连衣裙、紧身衣）',
      '预约时间提前15-30分钟到达医院',
      '最好有家人陪同，避免独自外出',
      '带上手机、充电器、少量现金备用',
      '记得按时吃早餐（除非医生要求空腹检查）'
    ];
    for (const m of memos) {
      html += `<div class="item-card">
                <input type="checkbox" class="item-checkbox" onchange="this.parentElement.classList.toggle('checked')">
                <span class="item-text">${m}</span>
              </div>`;
    }

    resultBox.style.display = 'block';
    resultContent.innerHTML = html;

    // 生成纯文本版本用于保存
    let plainText = `【复诊备忘】\n日期：${date}（${weekday}）\n科室：${dept}\n`;
    if (doctor) plainText += `医生：${doctor}\n`;
    if (advice) plainText += `\n用药医嘱：\n${advice}\n`;

    state.followup = { html: html, plain: plainText, time: new Date().toLocaleString('zh-CN') };
  }

        { name: '📋 医疗类', items: ['既往所有病历', '所有检查报告和影像片', '近期用药清单', '过敏药物告知单', '长期慢性病：近期监测记录'] },
        { name: '👕 衣物类（5-7天用量）', items: ['宽松舒适睡衣 2-3套', '内衣内裤若干', '防滑拖鞋（必带！防跌倒）', '保暖外套（早晚温差）', '袜子多双', '帽子（外出检查用）'] },
        { name: '🧴 洗漱用品', items: ['牙刷牙膏', '毛巾2条（洗脸+擦身）', '洗漱杯', '香皂/沐浴露', '梳子', '剃须刀（男士）', '水杯（带盖）', '纸巾/湿纸巾多包'] },
        { name: '🎒 生活用品', items: ['手机 + 充电器 + 充电宝', '老花镜/近视镜', '助听器（如有）', '家人联系清单（写在纸上）', '少量现金', '家人身份证复印件（代办签字用）'] },
        { name: '🍎 饮食类', items: ['按医嘱饮食（流质/半流质/普食）', '水杯保温款', '如允许：少量水果（苹果、香蕉）', '家属送饭请先咨询护士'] },
        { name: '📌 特别提醒', items: ['入院前洗澡洗头（住院后不方便）', '取下贵重首饰放家中', '带少量书籍/收音机（打发时间）', '告知家人每天探视时间', '出院前确认：药品、复查时间、报销单据'] }
      ]
    }
  };

  function generateMaterials() {
    const type = document.getElementById('visit-type').value;
    if (!type) return;

    const data = MATERIALS_DATA[type];
    const listBox = document.getElementById('materials-list');
    const resultBox = document.getElementById('materials-result');

    let html = `<div class="section-subtitle">${data.title}</div>`;
    let plainText = `【${data.title}】\n\n`;

    for (const group of data.groups) {
      html += `<div class="section-subtitle" style="font-size:24px; margin-top:20px;">${group.name}</div>`;
      plainText += `${group.name}\n`;
      for (const item of group.items) {
        html += `<div class="item-card">
                  <input type="checkbox" class="item-checkbox" onchange="this.parentElement.classList.toggle('checked')">
                  <span class="item-text">${item}</span>
                </div>`;
        plainText += `  □ ${item}\n`;
      }
      plainText += '\n';
    }

    listBox.innerHTML = html;
    resultBox.style.display = 'block';
    state.materials = { html: html, plain: plainText, title: data.title, time: new Date().toLocaleString('zh-CN') };
    state.materialsType = type;
  }

  function copyMaterials() {
    if (!state.materials) { showToast('请先生成清单', '#EF5350'); return; }
    copyToClipboard(state.materials.plain);
  }

  // ============== 模块4：结果汇总 ==============
  function saveToCollection(type) {
    let content = null;
    if (type === 'report' && state.report) {
      content = { title: '体检报告解读', html: state.report.html, time: state.report.time };
    } else if (type === 'followup' && state.followup) {
      content = { title: '复诊备忘', html: state.followup.html, time: state.followup.time };
    } else if (type === 'materials' && state.materials) {
      content = { title: state.materials.title, html: state.materials.html, time: state.materials.time };
    } else {
      showToast('请先生成内容再保存', '#EF5350');
      return;
    }

    state.collection[type] = content;
    showToast('✓ 已保存到"我的结果"');
    renderCollection();
  }

  function renderCollection() {
    const emptyBox = document.getElementById('collection-empty');
    const contentBox = document.getElementById('collection-content');
    const actionsBox = document.getElementById('collection-actions');

    const items = [];
    if (state.collection.report) items.push(state.collection.report);
    if (state.collection.followup) items.push(state.collection.followup);
    if (state.collection.materials) items.push(state.collection.materials);

    if (items.length === 0) {
      emptyBox.style.display = 'block';
      contentBox.innerHTML = '';
      actionsBox.style.display = 'none';
      return;
    }

    emptyBox.style.display = 'none';
    actionsBox.style.display = 'block';

    let html = '';
    for (const item of items) {
      html += `
        <div class="result-box" style="margin-bottom:20px; background:white; border-color:#FFB74D;">
          <div class="result-title">📌 ${item.title} <span style="font-size:18px; color:#888; font-weight:normal;">（${item.time}）</span></div>
          <div class="result-content">${item.html}</div>
        </div>`;
    }

    contentBox.innerHTML = html;
  }

  function copyAllCollection() {
    const items = [];
    for (const key in state.collection) {
      if (state.collection[key]) {
        // 简化纯文本
        let text = `【${state.collection[key].title}】\n`;
        // 提取文本（去除HTML标签）
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = state.collection[key].html;
        text += tempDiv.textContent.replace(/\n\s*\n/g, '\n').trim();
        items.push(text);
      }
    }
    if (items.length === 0) { showToast('没有内容可复制', '#EF5350'); return; }
    copyToClipboard(items.join('\n\n=========================================\n\n'));
  }

  function clearCollection() {
    if (!confirm('确定要清空"我的结果"吗？')) return;
    state.collection = { report: null, followup: null, materials: null };
    renderCollection();
    showToast('✓ 已清空');
  }

  // ============== 辅助函数 ==============
  function copyResult(elementId) {
    const el = document.getElementById(elementId);
    let text = '';
    // 提取纯文本
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = el.innerHTML;
    text = tempDiv.textContent.replace(/\n\s*\n\s*\n/g, '\n\n').trim();
    copyToClipboard(text);
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('✓ 已复制到剪贴板');
      }).catch(() => {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand('copy');
      showToast('✓ 已复制到剪贴板');
    } catch (e) {
      showToast('复制失败，请手动选择', '#EF5350');
    }
    document.body.removeChild(textarea);
  }

  function showToast(msg, color) {
    const toast = document.getElementById('copy-toast');
    toast.textContent = msg;
    if (color) toast.style.background = color;
    else toast.style.background = '#43A047';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  // 初始设置：默认日期为一周后
  window.onload = function() {
    const nextWeek = new Date();
    nextWeek.setDate(nextWeek.getDate() + 7);
    document.getElementById('followup-date').value = nextWeek.toISOString().split('T')[0];
    renderCollection();
  };
</script>
