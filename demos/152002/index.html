<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>邻里帮 · 演示原型</title>
  <style>
/* 邻里帮 NeighborAid —— 演示原型样式 */
:root {
  --bg: #f4f6fa;
  --card: #ffffff;
  --primary: #3a7afe;
  --primary-d: #2c63d6;
  --text: #1c2330;
  --sub: #6b7480;
  --line: #e6eaf0;
  --warn: #d97706;
  --danger: #e5484d;
  --good: #16a34a;
  --radius: 14px;
  --fs-base: 15px;
  --fs-title: 20px;
  --pad: 14px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: var(--fs-base);
  line-height: 1.5;
  padding-bottom: 76px; /* 给底部导航留位 */
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
}

/* —— 页头 —— */
.app-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px var(--pad);
  background: var(--card);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 10;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; }
.logo { font-size: 22px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.demo-banner {
  font-size: 11px; color: var(--warn); background: #fff7ed;
  padding: 3px 8px; border-radius: 999px; border: 1px solid #fde4c8;
}
.elder-toggle {
  border: 1px solid var(--primary); color: var(--primary);
  background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer;
}

/* —— 视图容器 —— */
.view { padding: var(--pad); }
.page-h { font-size: var(--fs-title); margin: 6px 0 14px; }
.back { display: inline-block; margin-bottom: 10px; color: var(--primary); text-decoration: none; font-size: 14px; }

/* —— 安全提示 —— */
.safety-tip {
  background: #eef6ff; color: #1d4ed8; font-size: 13px;
  padding: 8px var(--pad); border-top: 1px solid #d8e6ff; border-bottom: 1px solid #d8e6ff;
}

/* —— 底部导航 —— */
.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 520px;
  display: flex; justify-content: space-around; align-items: center;
  background: var(--card); border-top: 1px solid var(--line);
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); z-index: 10;
}
.tab { text-decoration: none; color: var(--sub); font-size: 13px; padding: 4px 16px; border-radius: 10px; }
.tab.active { color: var(--primary); }
.tab-publish {
  background: var(--primary); color: #fff !important; font-weight: 600;
  border-radius: 999px; padding: 8px 18px;
}

/* —— 通用按钮 —— */
.btn-primary, .btn-secondary, .btn-ghost {
  display: inline-block; border: none; border-radius: 12px; padding: 11px 18px;
  font-size: 15px; cursor: pointer; text-decoration: none; text-align: center;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:active { background: var(--primary-d); }
.btn-primary:disabled { background: #b9c6dc; cursor: not-allowed; }
.btn-secondary { background: #eaf0ff; color: var(--primary); }
.btn-ghost { background: #f1f3f7; color: var(--sub); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
.actions .btn-primary, .actions .btn-secondary, .actions .btn-ghost { flex: 1 1 auto; min-width: 130px; }

/* —— 首页 —— */
.page-title { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
.page-title h2 { margin: 0; font-size: var(--fs-title); }
.sub { color: var(--sub); font-size: 12px; }
.view-switch { display: flex; gap: 6px; background: #e9edf4; padding: 4px; border-radius: 12px; margin-bottom: 14px; }
.seg { flex: 1; border: none; background: transparent; padding: 8px; border-radius: 9px; cursor: pointer; color: var(--sub); font-size: 14px; }
.seg.active { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

.req-list { display: flex; flex-direction: column; gap: 12px; }
.req-card {
  background: var(--card); border-radius: var(--radius); padding: var(--pad);
  text-decoration: none; color: var(--text); box-shadow: 0 1px 3px rgba(20,30,60,.05);
  display: flex; flex-direction: column; gap: 8px;
}
.req-cat { font-size: 12px; color: var(--primary); font-weight: 600; background: #eaf0ff; align-self: flex-start; padding: 3px 10px; border-radius: 999px; }
.req-desc { font-size: 15px; }
.req-meta { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--sub); }
.req-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); border-top: 1px dashed var(--line); padding-top: 8px; }

/* —— 状态药丸 —— */
.status-pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; font-weight: 600; }
.status-pill.lg { font-size: 13px; padding: 4px 12px; }
.st-open { background: #eaf0ff; color: var(--primary); }
.st-accepted { background: #fef3c7; color: #b45309; }
.st-progress { background: #ede9fe; color: #6d28d9; }
.st-done { background: #dcfce7; color: var(--good); }
.st-cancel { background: #f1f3f7; color: var(--sub); }

/* —— 地图 —— */
.mock-map { position: relative; }
.map-note { font-size: 12px; color: var(--sub); margin-bottom: 8px; }
.map-grid {
  position: relative; height: 320px; background:
    linear-gradient(#eef2f8 1px, transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg, #eef2f8 1px, transparent 1px) 0 0/40px 40px,
    #f8fafc;
  border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden;
}
.map-pin { position: absolute; transform: translate(-50%, -50%); cursor: pointer; font-size: 18px; }
.pin-req { background: var(--primary); color: #fff; width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: translate(-50%, -100%) rotate(45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.pin-req .pin-label { transform: rotate(-45deg); font-size: 12px; font-weight: 700; }
.pin-helper { font-size: 20px; }

/* —— 表单 —— */
.form { background: var(--card); border-radius: var(--radius); padding: var(--pad); display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 3px rgba(20,30,60,.05); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 13px; color: var(--sub); font-weight: 600; }
.field input, .field textarea, .field select {
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 15px; font-family: inherit; background: #fff;
}
.field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid #cdddff; border-color: var(--primary); }
.warn { background: #fff7ed; color: var(--warn); padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; border: 1px solid #fde4c8; }
.privacy-note { font-size: 12px; color: var(--sub); background: #f8fafc; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); }

/* —— 详情 —— */
.detail-block { background: var(--card); border-radius: var(--radius); padding: var(--pad); margin: 12px 0; box-shadow: 0 1px 3px rgba(20,30,60,.05); }
.detail-desc { font-size: 16px; margin: 0 0 10px; }
.detail-meta { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.li-label { color: var(--sub); }
.block-h { font-size: 16px; margin: 18px 0 10px; }

/* —— 帮助者 —— */
.helpers { margin-top: 8px; }
.helper-card { background: var(--card); border-radius: 12px; padding: 12px var(--pad); margin-bottom: 8px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 3px rgba(20,30,60,.04); }
.rank { width: 26px; height: 26px; border-radius: 50%; background: #eaf0ff; color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
.helper-avatar { font-size: 22px; }
.helper-name { font-weight: 600; }
.helper-sub { font-size: 12px; color: var(--sub); }

/* —— 会话 —— */
.page-chat { padding-bottom: 8px; }
.chat-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
.archive-tip { background: #f1f3f7; color: var(--sub); padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 10px; }
.msg-list { background: var(--card); border-radius: var(--radius); padding: var(--pad); height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); }
.msg { display: flex; flex-direction: column; max-width: 78%; }
.msg.mine { align-self: flex-end; align-items: flex-end; }
.msg.theirs { align-self: flex-start; }
.msg-bubble { padding: 9px 13px; border-radius: 14px; font-size: 15px; }
.msg.mine .msg-bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
.msg.theirs .msg-bubble { background: #eef1f6; border-bottom-left-radius: 4px; }
.msg-time { font-size: 10px; color: var(--sub); margin-top: 3px; }
.chat-input { display: flex; gap: 8px; margin-top: 10px; }
.chat-input input { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 15px; }

/* —— 评价 —— */
.stars { font-size: 34px; margin: 10px 0; display: flex; gap: 8px; }
.star { color: #d6dae3; cursor: pointer; }
.star.on { color: #f5a623; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chip { border: 1px solid var(--line); background: #fff; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; color: var(--sub); }
.chip.on { border-color: var(--primary); color: var(--primary); background: #eaf0ff; }

/* —— 个人中心 —— */
.profile-head { display: flex; align-items: center; gap: 14px; background: var(--card); padding: var(--pad); border-radius: var(--radius); box-shadow: 0 1px 3px rgba(20,30,60,.05); }
.profile-avatar { font-size: 40px; }
.profile-name { font-size: 18px; font-weight: 700; }
.profile-sub { font-size: 13px; color: var(--sub); }
.credit-card { margin-top: 12px; background: linear-gradient(135deg, #3a7afe, #6aa1ff); color: #fff; border-radius: var(--radius); padding: 18px; text-align: center; }
.credit-num { font-size: 36px; font-weight: 800; }
.credit-label { font-size: 13px; opacity: .9; }
.history, .safety-box, .compliance-box { margin-top: 16px; }
.hist-row { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px var(--pad); border-radius: 10px; margin-bottom: 8px; text-decoration: none; color: var(--text); font-size: 14px; }
.list-btn { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px var(--pad); margin-bottom: 8px; font-size: 15px; color: var(--text); text-decoration: none; cursor: pointer; }
.list-btn.danger { color: var(--danger); }

.empty { text-align: center; color: var(--sub); padding: 30px 0; }

/* —— 抢单浮层 —— */
.overlay { position: fixed; inset: 0; background: rgba(20,30,60,.5); display: flex; align-items: center; justify-content: center; z-index: 50; }
.overlay[hidden] { display: none; }
.overlay-card { background: #fff; padding: 24px 32px; border-radius: 16px; text-align: center; }
.spinner { width: 34px; height: 34px; border: 4px solid #e6eaf0; border-top-color: var(--primary); border-radius: 50%; margin: 0 auto 12px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* =========================================================================
   长辈模式：大字、高对比、宽松间距、简化
   ========================================================================= */
.elder-mode {
  --fs-base: 19px;
  --fs-title: 26px;
  --pad: 18px;
  --text: #111827;
  --sub: #374151;
}
.elder-mode body { line-height: 1.7; }
.elder-mode .req-desc, .elder-mode .detail-desc { font-size: 20px; }
.elder-mode .req-meta, .elder-mode .req-foot { font-size: 15px; }
.elder-mode .btn-primary, .elder-mode .btn-secondary, .elder-mode .btn-ghost,
.elder-mode .list-btn { font-size: 19px; padding: 15px 18px; }
.elder-mode .tab { font-size: 16px; }
.elder-mode .tab-publish { font-size: 17px; padding: 12px 22px; }
.elder-mode .elder-toggle { font-size: 16px; padding: 8px 16px; }
.elder-mode .msg-bubble { font-size: 19px; }
.elder-mode .star { font-size: 44px; }
.elder-mode .credit-num { font-size: 48px; }
.elder-mode .elder-only { display: block !important; }
/* 长辈模式隐藏次要入口（演示：隐藏地图切换、标签评价简化提示由 JS 处理） */
.elder-mode .view-switch .seg { padding: 12px; }
  </style>
</head>
<body>
  <!-- 页头：演示原型标注 + 长辈模式开关 -->
  <header class="app-header">
    <div class="brand">
      <span class="logo">🏠</span>
      <span class="brand-name">邻里帮</span>
    </div>
    <div class="header-right">
      <span class="demo-banner" title="本页为演示原型，所有数据均为模拟">演示原型 · 数据均为模拟</span>
      <button id="elderToggle" class="elder-toggle" type="button" aria-pressed="false">长辈模式</button>
    </div>
  </header>

  <!-- 主视图容器：由 hash 路由驱动渲染 -->
  <main id="view" class="view" aria-live="polite"></main>

  <!-- 首页安全提示（公共场所见面引导） -->
  <div id="safetyTip" class="safety-tip" hidden>
    🛡️ 首次互助建议在社区公共场所见面，老人互助建议子女代发或在场。
  </div>

  <!-- 底部导航 -->
  <nav class="tabbar">
    <a href="#/home" class="tab" data-tab="home">📍 首页</a>
    <a href="#/publish" class="tab tab-publish" data-tab="publish">＋ 发布</a>
    <a href="#/profile" class="tab" data-tab="profile">👤 我的</a>
  </nav>

  <!-- 抢单并发模拟的进度浮层 -->
  <div id="overlay" class="overlay" hidden></div>

  <script>
/* =========================================================================
   邻里帮 NeighborAid —— 无后端单页演示原型 (内联脚本)
   所有数据均为前端内存模拟，刷新即重置。
   架构：mockStore（假后端） + hash 路由 + 显式重渲染
   ========================================================================= */

'use strict';

/* -------------------------------------------------------------------------
   1. mockStore —— 全局内存数据层（假后端）
   ------------------------------------------------------------------------- */
const mockStore = (() => {
  // 见下方 seed() 与 api；此 IIFE 仅作命名空间占位（保留以备扩展）
  return null;
})();

function seed() {
  return {
    currentUserId: 'u_me',
    // —— 用户 ——
    users: [
      { id: 'u_me', name: '我（演示账号）', avatar: '🧑', communityId: 'c_sunset', verified: true, credit: 88, deleted: false },
      { id: 'u_li', name: '李阿姨', avatar: '👩', communityId: 'c_sunset', verified: true, credit: 96 },
      { id: 'u_wang', name: '王叔', avatar: '👨', communityId: 'c_sunset', verified: true, credit: 91 },
      { id: 'u_zhou', name: '小周', avatar: '🧑‍💼', communityId: 'c_sunset', verified: true, credit: 84 },
      { id: 'u_shop', name: '便利店张老板', avatar: '🏪', communityId: 'c_sunset', verified: true, credit: 79, isShop: true },
      { id: 'u_other', name: '邻区住户', avatar: '👤', communityId: 'c_moon', verified: true, credit: 70 },
    ],
    // —— 社区 ——
    communities: [
      { id: 'c_sunset', name: '夕阳小区', center: { x: 50, y: 50 } },
      { id: 'c_moon', name: '月光花园', center: { x: 80, y: 20 } },
    ],
    // —— 帮助者（可接单，含示意坐标与距离/信用）——
    helpers: [
      { userId: 'u_li', communityId: 'c_sunset', x: 52, y: 48, distance: 80, online: true },
      { userId: 'u_wang', communityId: 'c_sunset', x: 47, y: 53, distance: 120, online: true },
      { userId: 'u_zhou', communityId: 'c_sunset', x: 55, y: 46, distance: 200, online: true },
      { userId: 'u_shop', communityId: 'c_sunset', x: 49, y: 52, distance: 90, online: true },
      { userId: 'u_other', communityId: 'c_moon', x: 80, y: 20, distance: 9999, online: true },
    ],
    // —— 需求 ——
    requests: [
      {
        id: 'r1', category: '代买药品', desc: '老人急需降压药，能否顺路从社区药店带一盒？',
        communityId: 'c_sunset', x: 50, y: 50, distance: 0,
        timeWindow: '今天 18:00 前', status: 'open',
        requesterId: 'u_me', acceptorId: null, createdAt: '刚刚',
      },
      {
        id: 'r2', category: '借工具', desc: '想借一把梯子换灯泡，半小时内还。',
        communityId: 'c_sunset', x: 48, y: 51, distance: 60,
        timeWindow: '今晚 20:00 前', status: 'open',
        requesterId: 'u_li', acceptorId: null, createdAt: '5 分钟前',
      },
      {
        id: 'r3', category: '代取快递', desc: '下班顺路帮我取个快递，丰巢柜 12 号。',
        communityId: 'c_sunset', x: 53, y: 49, distance: 150,
        timeWindow: '今天 19:00 前', status: 'open',
        requesterId: 'u_wang', acceptorId: null, createdAt: '8 分钟前',
      },
      {
        id: 'r4', category: '家电协助', desc: '老人不会用智能电视调台，求邻居帮忙。',
        communityId: 'c_sunset', x: 51, y: 52, distance: 110,
        timeWindow: '随时', status: 'accepted',
        requesterId: 'u_zhou', acceptorId: 'u_li', createdAt: '12 分钟前',
      },
      // 跨社区需求：演示可见性控制（当前用户不应看到）
      {
        id: 'rX', category: '代买药品', desc: '【跨社区，不应可见】月光花园的需求。',
        communityId: 'c_moon', x: 80, y: 20, distance: 5000,
        timeWindow: '今天内', status: 'open',
        requesterId: 'u_other', acceptorId: null, createdAt: '刚刚',
      },
    ],
    // —— 会话（关联需求）——
    conversations: [
      {
        id: 'conv_r4', requestId: 'r4',
        userA: 'u_zhou', userB: 'u_li',
        archived: false,
        messages: [
          { from: 'u_li', text: '您好，我已经接单啦，马上过去～', time: '12:01' },
          { from: 'u_zhou', text: '太感谢了！在 3 栋 502。', time: '12:02' },
        ],
      },
    ],
    // —— 评价 ——
    reviews: [
      { requestId: 'r_demo1', reviewerId: 'u_li', revieweeId: 'u_me', stars: 5, tags: ['热心', '准时'], createdAt: '上周' },
      { requestId: 'r_demo2', reviewerId: 'u_me', revieweeId: 'u_li', stars: 5, tags: ['靠谱'], createdAt: '上周' },
    ],
    // 已提交评价的记录（防止重复评价）
    submittedReviews: {}, // `${requestId}:${reviewerId}` -> true
  };
}

let store = seed();

// 从 localStorage 恢复（保留演示连续性，可选增强）
function loadPersisted() {
  try {
    const raw = localStorage.getItem('neighboraid_store');
    if (raw) store = JSON.parse(raw);
  } catch (_) { /* 忽略，使用种子数据 */ }
}
function persist() {
  try { localStorage.setItem('neighboraid_store', JSON.stringify(store)); } catch (_) {}
}
function resetDemo() {
  store = seed();
  persist();
  location.hash = '#/home';
  render();
}

// —— store 方法 ——
const api = {
  currentUser() { return store.users.find(u => u.id === store.currentUserId) || null; },
  community(id) { return store.communities.find(c => c.id === id) || null; },
  user(id) { return store.users.find(u => u.id === id) || null; },

  // 仅同社区、未删除的需求，按距离升序
  visibleRequests() {
    const me = this.currentUser();
    return store.requests
      .filter(r => r.communityId === me.communityId)
      .sort((a, b) => a.distance - b.distance);
  },

  request(id) { return store.requests.find(r => r.id === id) || null; },

  // 同社区在线可接单帮助者，按距离升序（距离相近时高信用优先）
  nearbyHelpers(communityId) {
    return store.helpers
      .filter(h => h.communityId === communityId && h.online)
      .map(h => ({ ...h, user: this.user(h.userId) }))
      .filter(h => h.user)
      .sort((a, b) => {
        const dDiff = a.distance - b.distance;
        // 距离相近（差值 ≤ 50m）时高信用优先
        if (Math.abs(dDiff) <= 50) return (b.user.credit - a.user.credit);
        return dDiff;
      });
  },

  // 状态机：定义合法迁移
  transitions: {
    open: ['accepted', 'cancelled'],
    accepted: ['in_progress', 'cancelled'],
    in_progress: ['completed', 'cancelled'],
    completed: [],
    cancelled: [],
  },
  canTransition(from, to) {
    return (this.transitions[from] || []).includes(to);
  },
  transition(requestId, to) {
    const r = this.request(requestId);
    if (!r) return { ok: false, msg: '需求不存在' };
    if (!this.canTransition(r.status, to)) {
      return { ok: false, msg: `非法状态迁移：${statusLabel(r.status)} → ${statusLabel(to)}` };
    }
    r.status = to;
    persist();
    return { ok: true };
  },

  // 抢单：首个接单锁定
  accept(requestId, userId) {
    const r = this.request(requestId);
    if (!r) return { ok: false, msg: '需求不存在' };
    if (r.status !== 'open') {
      return { ok: false, msg: '来晚了，该需求已被他人接走' };
    }
    r.status = 'accepted';
    r.acceptorId = userId;
    // 自动创建会话
    this.ensureConversation(requestId);
    persist();
    return { ok: true };
  },

  ensureConversation(requestId) {
    const r = this.request(requestId);
    if (!r || !r.acceptorId) return null;
    let conv = store.conversations.find(c => c.requestId === requestId);
    if (!conv) {
      conv = {
        id: 'conv_' + requestId, requestId,
        userA: r.requesterId, userB: r.acceptorId,
        archived: false, messages: [
          { from: r.acceptorId, text: '您好，我已接单，马上联系您～', time: nowTime() },
        ],
      };
      store.conversations.push(conv);
    }
    return conv;
  },

  conversation(id) { return store.conversations.find(c => c.id === id || c.requestId === id) || null; },

  sendMessage(convId, from, text) {
    const c = this.conversation(convId);
    if (!c) return { ok: false, msg: '会话不存在' };
    if (c.archived) return { ok: false, msg: '会话已归档，无法发送' };
    c.messages.push({ from, text, time: nowTime() });
    persist();
    return { ok: true };
  },

  archiveByRequest(requestId) {
    const c = store.conversations.find(c => c.requestId === requestId);
    if (c) { c.archived = true; persist(); }
  },

  // 评价：加权更新信用分
  submitReview(requestId, reviewerId, revieweeId, stars, tags) {
    const key = `${requestId}:${reviewerId}`;
    if (store.submittedReviews[key]) return { ok: false, msg: '您已评价过，请勿重复提交' };
    store.submittedReviews[key] = true;
    store.reviews.push({ requestId, reviewerId, revieweeId, stars, tags, createdAt: '刚刚' });

    // 加权：新评价权重 0.3，历史 0.7
    const reviewee = this.user(revieweeId);
    if (reviewee) {
      const old = reviewee.credit;
      const starScore = (stars / 5) * 100; // 1星=20, 5星=100
      reviewee.credit = Math.round(old * 0.7 + starScore * 0.3);
    }
    persist();
    return { ok: true };
  },

  // 账号注销演示：脱敏/删除非必要数据
  deleteAccount() {
    const me = this.currentUser();
    if (!me) return;
    me.deleted = true;
    me.name = '已注销用户';
    me.avatar = '🚫';
    me.credit = 0;
    me.verified = false;
    // 脱敏：清除该用户位置相关精确字段（需求中的坐标示意化）
    store.requests.forEach(r => {
      if (r.requesterId === me.id) { r.x = null; r.y = null; }
    });
    persist();
  },
};

/* -------------------------------------------------------------------------
   2. 工具函数
   ------------------------------------------------------------------------- */
function $(sel, root) { return (root || document).querySelector(sel); }
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') node.className = attrs[k];
    else if (k === 'html') node.innerHTML = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') node.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] != null) node.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c => {
    if (c == null || c === false) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}
function nowTime() {
  // 避免使用 Date.now()（部分受限环境）；用可读占位
  const t = new Date(); // 演示页可用真实时间
  const p = n => String(n).padStart(2, '0');
  return `${p(t.getHours())}:${p(t.getMinutes())}`;
}
function statusLabel(s) {
  return { open: '待接单', accepted: '已接单', in_progress: '进行中', completed: '已完成', cancelled: '已取消' }[s] || s;
}
function statusClass(s) {
  return { open: 'st-open', accepted: 'st-accepted', in_progress: 'st-progress', completed: 'st-done', cancelled: 'st-cancel' }[s] || '';
}
function distanceText(d) {
  if (d == null) return '距离未知';
  if (d >= 1000) return `约 ${(d / 1000).toFixed(1)} 公里`;
  return `约 ${d} 米`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* -------------------------------------------------------------------------
   3. hash 路由
   ------------------------------------------------------------------------- */
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '') || 'home';
  const [path, ...rest] = raw.split('/');
  return { path, params: rest };
}

function route() {
  const { path, params } = parseHash();
  const view = $('#view');
  view.innerHTML = '';

  let renderer;
  switch (path) {
    case 'home': renderer = renderHome; break;
    case 'publish': renderer = renderPublish; break;
    case 'request': renderer = () => renderRequest(params[0]); break;
    case 'chat': renderer = () => renderChat(params[0]); break;
    case 'profile': renderer = renderProfile; break;
    case 'review': renderer = () => renderReview(params[0], params[1]); break;
    default: renderer = renderHome;
  }
  view.appendChild(renderer());

  // 高亮底部导航
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === path ||
    (path === 'request' && t.dataset.tab === 'home')));

  // 首页/长辈模式显示安全提示
  $('#safetyTip').hidden = !(path === 'home' || document.documentElement.classList.contains('elder-mode'));
  window.scrollTo(0, 0);
}

function navigate(hash) { location.hash = hash; }

// —— 首页：列表 / 地图切换 ——
let homeViewMode = 'list';

function renderHome() {

  const comm = api.community(me.communityId);

  wrap.appendChild(el('div', { class: 'page-title' },

  ));

  // 视图切换

    el('button', { class: homeViewMode === 'list' ? 'seg active' : 'seg', onclick: () => { homeViewMode = 'list'; render(); } }, '列表'),
    el('button', { class: homeViewMode === 'map' ? 'seg active' : 'seg', onclick: () => { homeViewMode = 'map'; render(); } }, '地图'),

// —— 简化示意地图（纯 CSS）——
function renderMap(reqs) {

// —— 发布表单 ——
function renderPublish() {
  const me = api.currentUser();
  const wrap = el('section', { class: 'page' });
  wrap.appendChild(el('h2', { class: 'page-h' }, '发布需求'));

  // 社区认证校验文案
  if (!me.verified) {
    wrap.appendChild(el('div', { class: 'warn' }, '⚠️ 需先完成社区认证后才能发布需求。'));
  }

  const form = el('form', { class: 'form', id: 'publishForm' },
    field('分类', el('select', { name: 'category', required: true },
      ...['代买药品', '代取快递', '借工具', '家电协助', '其他'].map(c => el('option', { value: c }, c)),
    )),
    field('描述', el('textarea', { name: 'desc', rows: 3, required: true, placeholder: '简单描述你需要什么帮助～' })),
    field('位置（示意）', el('input', { name: 'loc', value: '社区内 · 3栋附近', placeholder: '不必填写精确门牌' })),
    field('时间窗', el('input', { name: 'timeWindow', value: '今天 18:00 前', required: true })),
    el('div', { class: 'privacy-note' }, '🔒 我们只采集必要信息：位置仅用于就近撮合，不对外展示精确坐标，你可随时删除。'),
    el('button', { class: 'btn-primary', type: 'submit' }, '发布需求'),
  );

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!me.verified) { alert('需先完成社区认证'); return; }
    const fd = new FormData(form);
    const desc = (fd.get('desc') || '').toString().trim();
    if (!desc) return;
    const newReq = {
      id: 'r' + Math.random().toString(36).slice(2, 7),
      category: fd.get('category'),
      desc,
      communityId: me.communityId,
      x: 50, y: 50, distance: 0,
      timeWindow: fd.get('timeWindow'),
      status: 'open',
      requesterId: me.id, acceptorId: null, createdAt: '刚刚',
    };
    store.requests.push(newReq);
    persist();
    alert('✅ 已发布！状态：待接单');
    navigate(`#/request/${newReq.id}`);
  });

  wrap.appendChild(form);
  return wrap;
}

function field(label, control) {
  return el('label', { class: 'field' }, el('span', { class: 'field-label' }, label), control);
}

// —— 需求详情 + 状态机 + 抢单 + 评价入口 ——
function renderRequest(id) {
  const r = api.request(id);
  const wrap = el('section', { class: 'page' });
  if (!r) {
    wrap.appendChild(el('div', { class: 'empty' }, '需求不存在或不可见。'));
    return wrap;
  }

  const me = api.currentUser();
  const author = api.user(r.requesterId);
  const acceptor = r.acceptorId ? api.user(r.acceptorId) : null;
  const isRequester = r.requesterId === me.id;
  const isAcceptor = r.acceptorId === me.id;

  wrap.appendChild(el('a', { class: 'back', href: '#/home' }, '← 返回'));

  wrap.appendChild(el('h2', { class: 'page-h' }, r.category));
  wrap.appendChild(el('div', { class: 'status-pill lg ' + statusClass(r.status) }, statusLabel(r.status)));

  wrap.appendChild(el('div', { class: 'detail-block' },
    el('p', { class: 'detail-desc' }, r.desc),
    el('ul', { class: 'detail-meta' },
      li('📍 距离', distanceText(r.distance) + `（${api.community(r.communityId).name}）`),
      li('⏰ 时间窗', r.timeWindow),
      li('🙋 发布者', `${author ? author.avatar + ' ' + author.name : '匿名'}${isRequester ? '（我）' : ''}`),
      acceptor ? li('🤝 接单者', `${acceptor.avatar} ${acceptor.name}${isAcceptor ? '（我）' : ''}`) : null,
    ),
  ));

  // 隐私提示
  wrap.appendChild(el('div', { class: 'privacy-note' }, '🔒 对外仅展示距离与社区，不暴露精确坐标。'));

  // —— 状态机操作 ——
  const actions = el('div', { class: 'actions' });

  // 抢单（仅 open 且非发布者）
  if (r.status === 'open' && !isRequester) {
    actions.appendChild(el('button', { class: 'btn-primary', onclick: () => doAccept(r.id) }, '⚡ 立即抢单'));
  }
  // 发布者：取消（任一前序状态）
  if (isRequester && api.canTransition(r.status, 'cancelled')) {
    actions.appendChild(el('button', { class: 'btn-ghost', onclick: () => doTransition(r.id, 'cancelled', '已取消') }, '取消需求'));
  }
  // 接单者：开始进行 / 完成
  if (isAcceptor && api.canTransition(r.status, 'in_progress')) {
    actions.appendChild(el('button', { class: 'btn-primary', onclick: () => doTransition(r.id, 'in_progress', '已开始') }, '开始互助'));
  }
  if (isAcceptor && api.canTransition(r.status, 'completed')) {
    actions.appendChild(el('button', { class: 'btn-primary', onclick: () => doTransition(r.id, 'completed', '已完成') }, '标记完成'));
  }
  // 进入会话（已接单及之后）
  if (r.acceptorId) {
    actions.appendChild(el('a', { class: 'btn-secondary', href: `#/chat/${r.id}` }, '💬 进入会话'));
  }
  // 评价入口（已完成且未评价）
  if (r.status === 'completed') {
    if (isRequester && r.acceptorId) {
      actions.appendChild(el('a', { class: 'btn-secondary', href: `#/review/${r.id}/${r.acceptorId}` }, '⭐ 评价接单者'));
    }
    if (isAcceptor) {
      actions.appendChild(el('a', { class: 'btn-secondary', href: `#/review/${r.id}/${r.requesterId}` }, '⭐ 评价发布者'));
    }
  }
  wrap.appendChild(actions);

  // —— 就近匹配帮助者（open 状态展示）——
  if (r.status === 'open') {
    wrap.appendChild(renderHelpers(r));
  }

  return wrap;
}

function li(label, value) {
  return el('li', null, el('span', { class: 'li-label' }, label + '：'), value);
}

function renderHelpers(r) {
  const helpers = api.nearbyHelpers(r.communityId);
  const box = el('div', { class: 'helpers' },
    el('h3', { class: 'block-h' }, '🧭 就近可接单帮助者（按距离排序，相近时高信用优先）'),
  );
  if (helpers.length === 0) { box.appendChild(el('div', { class: 'empty' }, '暂无在线帮助者')); return box; }
  helpers.forEach((h, i) => {
    box.appendChild(el('div', { class: 'helper-card' },
      el('span', { class: 'rank' }, `#${i + 1}`),
      el('span', { class: 'helper-avatar' }, h.user.avatar),
      el('div', { class: 'helper-info' },
        el('div', { class: 'helper-name' }, h.user.name + (h.user.isShop ? ' · 店主' : '')),
        el('div', { class: 'helper-sub' }, `📍 ${distanceText(h.distance)} · ⭐ 信用 ${h.user.credit}`),
      ),
    ));
  });
  return box;
}

// —— 抢单并发演示 ——
function doAccept(requestId) {
  const overlay = $('#overlay');
  overlay.hidden = false;
  overlay.innerHTML = '';
  overlay.appendChild(el('div', { class: 'overlay-card' },
    el('div', { class: 'spinner' }),
    el('div', null, '⚡ 正在抢单…模拟多人竞争'),
  ));

  // 模拟并发：~1.2s 后揭晓
  setTimeout(() => {
    overlay.hidden = true;
    const res = api.accept(requestId, api.currentUser().id);
    if (res.ok) {
      alert('🎉 抢单成功！你是第一个接单的，需求已锁定。会话已自动创建。');
    } else {
      alert('😢 ' + res.msg);
    }
    navigate(`#/request/${requestId}`);
  }, 1200);
}

function doTransition(requestId, to, label) {
  const res = api.transition(requestId, to);
  if (!res.ok) { alert('⚠️ ' + res.msg); return; }
  // 完成/取消后会话归档
  if (to === 'completed' || to === 'cancelled') api.archiveByRequest(requestId);
  alert(`✅ ${label}`);
  navigate(`#/request/${requestId}`);
}

// —— IM 会话页 ——
function renderChat(requestId) {
  const r = api.request(requestId);
  const conv = api.conversation(requestId);
  const wrap = el('section', { class: 'page page-chat' });
  if (!conv) {
    wrap.appendChild(el('div', { class: 'empty' }, '会话不存在（接单后会自动创建）。'));
    return wrap;
  }

  const me = api.currentUser();
  const other = api.user(conv.userA === me.id ? conv.userB : conv.userA);

  wrap.appendChild(el('a', { class: 'back', href: `#/request/${requestId}` }, '← 返回需求'));
  wrap.appendChild(el('div', { class: 'chat-head' },
    el('span', null, `💬 与 ${other.avatar} ${other.name} 的会话`),
    el('span', { class: 'sub' }, `关联需求：${r ? r.category : ''}`),
  ));

  if (conv.archived) {
    wrap.appendChild(el('div', { class: 'archive-tip' }, '📦 该会话已归档（需求已完成/取消），仅可查看，不可再发送消息。'));
  }

  const msgs = el('div', { class: 'msg-list', id: 'msgList' });
  conv.messages.forEach(m => {
    const mine = m.from === me.id;
    msgs.appendChild(el('div', { class: 'msg ' + (mine ? 'mine' : 'theirs') },
      el('div', { class: 'msg-bubble' }, m.text),
      el('div', { class: 'msg-time' }, m.time),
    ));
  });
  wrap.appendChild(msgs);

  // 输入区（归档后禁用）
  const inputRow = el('div', { class: 'chat-input' },
    el('input', { id: 'chatText', placeholder: conv.archived ? '会话已归档' : '输入消息…', disabled: conv.archived }),
    el('button', { class: 'btn-primary', disabled: conv.archived, onclick: sendChat }, '发送'),
  );
  wrap.appendChild(inputRow);

  function sendChat() {
    const input = $('#chatText');
    const text = (input.value || '').trim();
    if (!text) return;
    api.sendMessage(conv.id, me.id, text);
    input.value = '';
    // 模拟对方回复
    setTimeout(() => {
      const reply = mockReply(text, other);
      api.sendMessage(conv.id, other.id, reply);
      navigate(`#/chat/${requestId}`); // 重渲染
    }, 900);
    navigate(`#/chat/${requestId}`);
  }

  // 滚到底
  setTimeout(() => { const ml = $('#msgList'); if (ml) ml.scrollTop = ml.scrollHeight; }, 0);
  return wrap;
}

function mockReply(text, other) {
  if (/谢|感谢|thx/i.test(text)) return '不客气，邻里互相帮忙应该的～';
  if (/到|在哪|地址/.test(text)) return '我在楼下，马上到您门口。';
  if (other && other.isShop) return '小店常在，有需要随时叫我，给你留好啦～';
  const canned = ['好的，收到～', '没问题！', '我这就过去。', '稍等一下哦～'];
  return canned[Math.floor(Math.random() * canned.length)];
}

// —— 评价页 ——
function renderReview(requestId, revieweeId) {
  const reviewee = api.user(revieweeId);
  const wrap = el('section', { class: 'page' });
  wrap.appendChild(el('a', { class: 'back', href: `#/request/${requestId}` }, '← 返回'));
  wrap.appendChild(el('h2', { class: 'page-h' }, `评价 ${reviewee ? reviewee.avatar + ' ' + reviewee.name : ''}`));

  let stars = 5;
  const tagPool = ['热心', '准时', '靠谱', '耐心', '礼貌', '响应快'];
  const chosen = new Set();

  const starRow = el('div', { class: 'stars', id: 'starRow' });
  function paint() {
    starRow.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      starRow.appendChild(el('span', {
        class: 'star' + (i <= stars ? ' on' : ''),
        onclick: () => { stars = i; paint(); },
      }, '★'));
    }
  }
  paint();
  wrap.appendChild(starRow);

  const tagRow = el('div', { class: 'tags' });
  tagPool.forEach(t => {
    const chip = el('button', { class: 'chip', onclick: () => {
      if (chosen.has(t)) { chosen.delete(t); chip.classList.remove('on'); }
      else { chosen.add(t); chip.classList.add('on'); }
    } }, t);
    tagRow.appendChild(chip);
  });
  wrap.appendChild(tagRow);

  wrap.appendChild(el('button', { class: 'btn-primary', onclick: () => {
    const res = api.submitReview(requestId, api.currentUser().id, revieweeId, stars, [...chosen]);
    if (!res.ok) { alert(res.msg); return; }
    alert(`✅ 评价已提交，${reviewee.name} 的邻里信用分已更新。`);
    navigate(`#/request/${requestId}`);
  } }, '提交评价'));

  return wrap;
}

// —— 个人中心 ——
function renderProfile() {
  const me = api.currentUser();
  const comm = api.community(me.communityId);
  const wrap = el('section', { class: 'page' });

  wrap.appendChild(el('div', { class: 'profile-head' },
    el('div', { class: 'profile-avatar' }, me.avatar),
    el('div', null,
      el('div', { class: 'profile-name' }, me.name),
      el('div', { class: 'profile-sub' }, `${comm.name} · ${me.verified ? '✅ 已社区认证' : '❌ 未认证'}`),
    ),
  ));

  // 信用分卡片
  wrap.appendChild(el('div', { class: 'credit-card' },
    el('div', { class: 'credit-num' }, me.deleted ? '—' : me.credit),
    el('div', { class: 'credit-label' }, '邻里信用分（随评价加权更新）'),
  ));

  // 历史互助
  const asRequester = store.requests.filter(r => r.requesterId === me.id);
  const asAcceptor = store.requests.filter(r => r.acceptorId === me.id);
  wrap.appendChild(el('div', { class: 'history' },
    el('h3', { class: 'block-h' }, '我的互助'),
    ...asRequester.map(r => el('a', { class: 'hist-row', href: `#/request/${r.id}` },
      el('span', null, `🙋 我发布的 · ${r.category}`),
      el('span', { class: 'status-pill ' + statusClass(r.status) }, statusLabel(r.status)))),
    ...asAcceptor.map(r => el('a', { class: 'hist-row', href: `#/request/${r.id}` },
      el('span', null, `🤝 我接单的 · ${r.category}`),
      el('span', { class: 'status-pill ' + statusClass(r.status) }, statusLabel(r.status)))),
    (asRequester.length + asAcceptor.length === 0) ? el('div', { class: 'empty' }, '暂无互助记录') : null,
  ));

  // 适老化安全入口
  wrap.appendChild(el('div', { class: 'safety-box' },
    el('h3', { class: 'block-h' }, '🛡️ 安全'),
    el('a', { class: 'list-btn danger', href: 'tel:110' }, '🚨 一键报警（110）'),
    el('button', { class: 'list-btn', onclick: () => alert('已呼叫紧急联系人（演示）') }, '📞 联系紧急联系人'),
    el('div', { class: 'privacy-note' }, '💡 首次互助建议在公共场所见面；老人互助建议子女代发或在场。'),
  ));

  // 合规与账号
  wrap.appendChild(el('div', { class: 'compliance-box' },
    el('h3', { class: 'block-h' }, '🔐 隐私与账号'),
    el('div', { class: 'privacy-note' }, '我们最小化采集位置/住址/半实名信息，仅用于撮合；你可随时删除，删除后将脱敏处理。'),
    el('button', { class: 'list-btn danger', onclick: doDelete }, '注销账号（演示）'),
    el('button', { class: 'list-btn', onclick: () => { if (confirm('重置所有演示数据？')) resetDemo(); } }, '↺ 重置演示数据'),
  ));

  return wrap;
}

function doDelete() {
  if (!confirm('确认注销账号？将脱敏/删除您的非必要留存数据（演示）。')) return;
  api.deleteAccount();
  alert('✅ 已注销，您的数据已脱敏处理。');
  render();
}

/* -------------------------------------------------------------------------
   5. 长辈模式
   ------------------------------------------------------------------------- */
function initElderMode() {
  const html = document.documentElement;
  let on = false;
  try { on = localStorage.getItem('neighboraid_elder') === '1'; } catch (_) {}
  if (on) html.classList.add('elder-mode');
  const btn = $('#elderToggle');
  function sync() {
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.textContent = on ? '退出长辈模式' : '长辈模式';
    html.classList.toggle('elder-mode', on);
    $('#safetyTip').hidden = !(parseHash().path === 'home' || on);
  }
  btn.addEventListener('click', () => {
    on = !on;
    try { localStorage.setItem('neighboraid_elder', on ? '1' : '0'); } catch (_) {}
    sync();
  });
  sync();
}

/* -------------------------------------------------------------------------
   6. 启动
   ------------------------------------------------------------------------- */
function render() { route(); }

document.addEventListener('DOMContentLoaded', () => {
  loadPersisted();
  initElderMode();
  window.addEventListener('hashchange', render);
  render();
});
  </script>
</body>
