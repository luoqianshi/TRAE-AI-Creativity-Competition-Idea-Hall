<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下一站，未知 — AI 旅行文字冒险</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 680px;
            width: 100%;
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.25);
            overflow: hidden;
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; font-weight: 700; }
        .header p { font-size: 15px; opacity: 0.9; }
        .content { padding: 35px 30px; }
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.4s ease-out; }

        /* 目的地选择 */
        .destinations { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-top: 24px; }
        .dest-card {
            border: 2px solid #e8e8f0;
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafaff;
        }
        .dest-card:hover, .dest-card.selected {
            border-color: #667eea;
            background: #f0eeff;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(102,126,234,0.2);
        }
        .dest-card .emoji { font-size: 40px; margin-bottom: 10px; display: block; }
        .dest-card h3 { font-size: 16px; color: #444; margin-bottom: 4px; }
        .dest-card span { font-size: 12px; color: #888; }

        /* 场景展示 */
        .scene-image {
            width: 100%;
            height: 180px;
            border-radius: 16px;
            object-fit: cover;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ddd, #eee);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        .scene-text {
            font-size: 17px;
            line-height: 1.8;
            color: #444;
            margin-bottom: 28px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 14px;
            border-left: 4px solid #667eea;
        }
        .choices { display: flex; flex-direction: column; gap: 12px; }
        .choice-btn {
            padding: 16px 20px;
            border: 2px solid #e0e0f0;
            border-radius: 14px;
            background: white;
            cursor: pointer;
            font-size: 15px;
            color: #555;
            text-align: left;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .choice-btn:hover {
            border-color: #667eea;
            background: #f5f3ff;
            color: #667eea;
            transform: translateX(6px);
        }
        .choice-btn .arrow { margin-left: auto; opacity: 0; transition: opacity 0.2s; }
        .choice-btn:hover .arrow { opacity: 1; }

        /* 进度条 */
        .progress-bar { height: 4px; background: #eee; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 2px; transition: width 0.5s ease; }

        /* 结局页 */
        .diary {
            background: linear-gradient(135deg, #fff9f0 0%, #fff5f5 100%);
            border: 1px solid #ffe4cc;
            border-radius: 16px;
            padding: 28px;
            margin: 20px 0;
            line-height: 2;
            font-size: 16px;
            color: #553;
            white-space: pre-wrap;
        }
        .stats { display: flex; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
        .stat-tag {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .stat-explore { background: #e3f2fd; color: #1565c0; }
        .stat-culture { background: #fce4ec; color: #c62828; }
        .stat-relax { background: #e8f5e9; color: #2e7d32; }

        .btn-primary {
            display: inline-block;
            padding: 14px 36px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 16px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(102,126,234,0.35); }
        .btn-secondary {
            display: inline-block;
            padding: 12px 28px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            margin-left: 10px;
            transition: all 0.2s;
        }
        .btn-secondary:hover { background: #f5f3ff; }

        .hidden { display: none !important; }
        .typing::after { content: '|'; animation: blink 1s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 下一站，未知</h1>
            <p>AI 旅行文字冒险 —— 你的选择，定义旅途</p>
        </div>
        <div class="content">
            <!-- 首页 -->
            <div id="screen-home" class="screen active">
                <p style="font-size:15px;color:#666;margin-bottom:8px;">选择一个目的地，开始你的冒险：</p>
                <div class="destinations">
                    <div class="dest-card" data-dest="kyoto" onclick="selectDest(this)">
                        <span class="emoji">⛩️</span>
                        <h3>京都</h3>
                        <span>古寺与茶道</span>
                    </div>
                    <div class="dest-card" data-dest="iceland" onclick="selectDest(this)">
                        <span class="emoji">🌌</span>
                        <h3>雷克雅未克</h3>
                        <span>极光与冰川</span>
                    </div>
                    <div class="dest-card" data-dest="paris" onclick="selectDest(this)">
                        <span class="emoji">🗼</span>
                        <h3>巴黎</h3>
                        <span>浪漫与艺术</span>
                    </div>
                </div>
                <div style="text-align:center;margin-top:28px;">
                    <button class="btn-primary" onclick="startGame()" id="startBtn" disabled style="opacity:0.5;">开始旅程</button>
                </div>
            </div>

            <!-- 游戏场景 -->
            <div id="screen-game" class="screen">
                <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
                <div class="scene-image" id="sceneEmoji">🏯</div>
                <div class="scene-text" id="sceneText">场景加载中...</div>
                <div class="choices" id="choicesBox"></div>
            </div>

            <!-- 结局 -->
            <div id="screen-end" class="screen">
                <h2 style="text-align:center;color:#667eea;margin-bottom:8px;">🎉 旅途结束</h2>
                <p style="text-align:center;color:#888;font-size:14px;margin-bottom:20px;">AI 根据你的选择，生成了这段专属游记</p>
                <div class="stats" id="statsBox"></div>
                <div class="diary" id="diaryText"></div>
                <div style="text-align:center;">
                    <button class="btn-primary" onclick="restart()">再玩一次</button>
                    <button class="btn-secondary" onclick="share()">分享游记</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== 游戏数据 ==========
        const destinations = {
            kyoto: {
                name: '京都',
                emoji: '⛩️',
                scenes: [
                    {
                        text: '清晨的京都，薄雾笼罩着古老的街道。你站在鸭川边，远处传来隐隐的钟声。空气中飘着淡淡的抹茶香，仿佛时间在这里放慢了脚步。',
                        emoji: '🌸',
                        choices: [
                            { text: 'A. 沿着石板路走向清水寺', explore: 2, culture: 1, relax: 0 },
                            { text: 'B. 在河边的老咖啡馆坐下', explore: 0, culture: 1, relax: 2 }
                        ]
                    },
                    {
                        text: '你来到一条静谧的小巷，两侧是百年历史的町屋。一位白发老人正坐在门口编织竹篮，抬头对你微笑。阳光透过屋檐，在石板路上画出斑驳的光影。',
                        emoji: '🏮',
                        choices: [
                            { text: 'A. 上前与老人攀谈', explore: 1, culture: 2, relax: 1 },
                            { text: 'B. 静静走过，用心感受这份宁静', explore: 0, culture: 1, relax: 3 }
                        ]
                    },
                    {
                        text: '黄昏时分，你误入一座非公开的小庭院。枫树如火，池塘倒映着晚霞。一位身着和服的女子正在亭中沏茶，见你到来，微微颔首示意。',
                        emoji: '🍵',
                        choices: [
                            { text: 'A. 接受邀请，品尝这杯未知之茶', explore: 2, culture: 3, relax: 1 },
                            { text: 'B. 婉拒并悄悄离开，让美景留在记忆里', explore: 1, culture: 1, relax: 3 }
                        ]
                    }
                ]
            },
            iceland: {
                name: '雷克雅未克',
                emoji: '🌌',
                scenes: [
                    {
                        text: '冰岛的风带着海水的咸涩扑面而来。你站在黑沙滩上，巨大的玄武岩柱像古老的琴键排列在海边。天空低垂，仿佛伸手就能触碰到云层。',
                        emoji: '🌊',
                        choices: [
                            { text: 'A. 顶着狂风走向海浪边缘', explore: 3, culture: 0, relax: 0 },
                            { text: 'B. 躲进岸边的橙色灯塔小屋取暖', explore: 1, culture: 1, relax: 2 }
                        ]
                    },
                    {
                        text: '夜幕降临，你驱车来到郊外。四周一片漆黑，只有头顶的星空在闪烁。忽然，一抹淡绿色的光带在天边缓缓舒展，像一条舞动的丝带。',
                        emoji: '✨',
                        choices: [
                            { text: 'A. 架起相机，试图捕捉这转瞬即逝的极光', explore: 2, culture: 0, relax: 1 },
                            { text: 'B. 放下设备，只是躺在车顶仰望', explore: 1, culture: 1, relax: 3 }
                        ]
                    },
                    {
                        text: '次日，你来到一座巨大的冰川前。向导指着冰层中的黑色纹理说，那是几百年前火山爆发留下的记忆。蓝色的冰洞在阳光下晶莹剔透。',
                        emoji: '🧊',
                        choices: [
                            { text: 'A. 跟随向导深入冰洞探险', explore: 3, culture: 1, relax: 0 },
                            { text: 'B. 在冰川边缘冥想，聆听自然的呼吸', explore: 1, culture: 2, relax: 2 }
                        ]
                    }
                ]
            },
            paris: {
                name: '巴黎',
                emoji: '🗼',
                scenes: [
                    {
                        text: '塞纳河畔的晨雾尚未散去，你走过一座小桥，远处埃菲尔铁塔的轮廓若隐若现。岸边的旧书摊刚刚开张，摊主正用一块丝绒布擦拭一本泛黄的画册。',
                        emoji: '📚',
                        choices: [
                            { text: 'A. 驻足翻阅那本画册', explore: 1, culture: 3, relax: 1 },
                            { text: 'B. 买一杯热咖啡，坐在桥边看游船经过', explore: 0, culture: 1, relax: 3 }
                        ]
                    },
                    {
                        text: '午后的蒙马特高地，街头画家们支起画架。一位年轻画家邀请你当他的模特，说你的侧脸让他想起了某部电影。画室里弥漫着松节油和咖啡的混合气味。',
                        emoji: '🎨',
                        choices: [
                            { text: 'A. 欣然坐下，让他画一幅肖像', explore: 2, culture: 2, relax: 1 },
                            { text: 'B. 拒绝当模特，但买下了他旁边的一幅街景画', explore: 1, culture: 2, relax: 2 }
                        ]
                    },
                    {
                        text: '傍晚，你误入一家没有招牌的小酒馆。一位老人在角落里弹着钢琴，旋律是你从未听过的。酒保端来一杯琥珀色的酒，说这叫"巴黎的秘密"。',
                        emoji: '🍷',
                        choices: [
                            { text: 'A. 品尝这杯酒，并请老人讲讲它的故事', explore: 1, culture: 3, relax: 1 },
                            { text: 'B. 只静静聆听琴声，不打扰这夜晚', explore: 0, culture: 2, relax: 3 }
                        ]
                    }
                ]
            }
        };

        // ========== 游记生成器 ==========
        function generateDiary(dest, stats) {
            const maxStat = Object.keys(stats).reduce((a,b) => stats[a] > stats[b] ? a : b);
            const templates = {
                explore: {
                    title: '冒险者手记',
                    intro: `在${dest.name}的这段日子，我的脚步从未停歇。`,
                    body: `从清晨到黄昏，我选择了一条少有人走的路。那些隐秘的小径、突如其来的际遇、未曾计划的转折，构成了这次旅行最真实的底色。${dest.name}对我而言，不再只是地图上的一个名字，而是一段充满未知的探险。`
                },
                culture: {
                    title: '寻味者的笔记',
                    intro: `${dest.name}是一本书，而我选择细细品读。`,
                    body: `与陌生人的对话、偶然发现的手艺、那些需要耐心才能体会的细节——这些才是${dest.name}真正的灵魂。我带着好奇而来，带着故事离开。每一座城市都有它的语言，而我，终于听懂了一些。`
                },
                relax: {
                    title: '慢旅日记',
                    intro: `在${dest.name}，我学会了等待。`,
                    body: `没有匆忙的行程，没有必须打卡的清单。我只是存在着，让时间像溪水一样自然流过。${dest.name}教会我的，是旅途中最重要的功课——有时候，最好的风景发生在什么都不做的时候。`
                }
            };
            const t = templates[maxStat];
            const dateStr = new Date().toLocaleDateString('zh-CN');
            return `【${t.title}】\n${dest.name} · ${dateStr}\n\n${t.intro}\n\n${t.body}\n\n—— 这段旅途由我的选择书写，由 AI 为我记录。`;
        }

        // ========== 游戏状态 ==========
        let gameState = {
            destKey: null,
            sceneIndex: 0,
            stats: { explore: 0, culture: 0, relax: 0 }
        };

        function selectDest(el) {
            document.querySelectorAll('.dest-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            gameState.destKey = el.dataset.dest;
            const btn = document.getElementById('startBtn');
            btn.disabled = false;
            btn.style.opacity = '1';
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startGame() {
            gameState.sceneIndex = 0;
            gameState.stats = { explore: 0, culture: 0, relax: 0 };
            switchScreen('screen-game');
            renderScene();
        }

        function renderScene() {
            const dest = destinations[gameState.destKey];
            const scene = dest.scenes[gameState.sceneIndex];
            const progress = ((gameState.sceneIndex) / dest.scenes.length) * 100;

            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('sceneEmoji').textContent = scene.emoji;
            document.getElementById('sceneText').textContent = scene.text;

            const box = document.getElementById('choicesBox');
            box.innerHTML = '';
            scene.choices.forEach((choice, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = `<span>${choice.text}</span><span class="arrow">→</span>`;
                btn.onclick = () => makeChoice(choice);
                box.appendChild(btn);
            });
        }

        function makeChoice(choice) {
            gameState.stats.explore += choice.explore;
            gameState.stats.culture += choice.culture;
            gameState.stats.relax += choice.relax;
            gameState.sceneIndex++;

            const dest = destinations[gameState.destKey];
            if (gameState.sceneIndex >= dest.scenes.length) {
                showEnding();
            } else {
                renderScene();
            }
        }

        function showEnding() {
            const dest = destinations[gameState.destKey];
            const diary = generateDiary(dest, gameState.stats);
            switchScreen('screen-end');

            document.getElementById('statsBox').innerHTML = `
                <span class="stat-tag stat-explore">🧭 探索 ${gameState.stats.explore}</span>
                <span class="stat-tag stat-culture">📖 文化 ${gameState.stats.culture}</span>
                <span class="stat-tag stat-relax">☕ 闲适 ${gameState.stats.relax}</span>
            `;

            // 打字机效果
            const el = document.getElementById('diaryText');
            el.textContent = '';
            let i = 0;
            const timer = setInterval(() => {
                el.textContent += diary.charAt(i);
                i++;
                if (i >= diary.length) clearInterval(timer);
            }, 30);
        }

        function restart() {
            switchScreen('screen-home');
            document.querySelectorAll('.dest-card').forEach(c => c.classList.remove('selected'));
            gameState.destKey = null;
            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.style.opacity = '0.5';
        }

        function share() {
            const diary = document.getElementById('diaryText').textContent;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(diary).then(() => alert('游记已复制到剪贴板！'));
            } else {
                alert('请手动复制游记内容分享~');
            }
        }
    </script>
</body>
</html>
