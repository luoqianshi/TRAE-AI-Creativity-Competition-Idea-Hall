<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<title>数字员工办公区 · Digital Employees</title>
<!--
  运行方式：因使用 ES Module + importmap，需通过本地服务器打开。
  在本目录执行：  python3 -m http.server 8765
  然后浏览器访问： http://localhost:8765/digital-employees.html
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#cfeaff; --panel:rgba(255,255,255,.78); --panel-solid:#ffffff;
    --text:#283244; --muted:#6b7a90; --accent:#5aa9f0; --border:rgba(60,80,110,.16);
  }
  html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}
  #app{position:relative;width:100vw;height:100vh;}
  #scene-container{position:absolute;inset:0;}
  #scene-container canvas{display:block;}

  /* ===== 工具栏 ===== */
  #toolbar{
    position:absolute;top:14px;left:314px;right:14px;z-index:20;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:10px 16px;border-radius:16px;
    background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border);box-shadow:0 10px 30px rgba(80,110,160,.18);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:.3px;}
  .brand .logo{font-size:22px;}
  .view-switch{display:flex;gap:4px;background:rgba(90,120,160,.12);padding:4px;border-radius:11px;}
  .view-switch button{
    border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:8px;
    font-size:13px;cursor:pointer;transition:.18s;font-weight:700;
  }
  .view-switch button.active{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(90,169,240,.45);}
  .view-switch button:hover:not(.active){color:var(--text);}
  .toolbar-actions{display:flex;align-items:center;gap:10px;}
  .btn{
    border:1px solid var(--border);background:rgba(255,255,255,.6);color:var(--text);
    padding:7px 13px;border-radius:10px;font-size:13px;cursor:pointer;transition:.18s;font-weight:700;
  }
  .btn:hover{background:#fff;border-color:var(--accent);transform:translateY(-1px);}
  .btn-primary{background:linear-gradient(135deg,#7ed957,#43c46e);border:0;color:#fff;}
  .btn-primary:hover{filter:brightness(1.06);}
  .stat-pill{background:rgba(126,217,87,.2);color:#3a9d3a;padding:3px 11px;border-radius:20px;font-weight:800;font-size:12px;}

  /* ===== 图例 / 提示 ===== */
  #legend{
    position:absolute;left:14px;bottom:14px;z-index:15;
    background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border);border-radius:13px;padding:10px 14px;font-size:12px;
    box-shadow:0 8px 24px rgba(80,110,160,.15);
  }
  #legend h4{font-size:11px;color:var(--muted);margin-bottom:6px;letter-spacing:1px;text-transform:uppercase;}
  .legend-row{display:flex;align-items:center;gap:8px;margin:4px 0;}
  .legend-dot{width:10px;height:10px;border-radius:50%;}
  #hint{
    position:absolute;right:14px;bottom:14px;z-index:15;max-width:230px;
    background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border);border-radius:13px;padding:10px 14px;font-size:12px;color:var(--muted);line-height:1.6;
  }

  /* ===== 员工头顶标签（CSS2D） ===== */
  .agent-label{
    pointer-events:none;transform:translate(-50%,-100%);
    background:rgba(40,52,72,.9);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:7px 11px;
    min-width:132px;max-width:196px;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:.2s;color:#fff;
  }
  .agent-label.hover{transform:translate(-50%,-100%) scale(1.07);}
  .al-name{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;}
  .al-dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px currentColor;}
  .al-status{font-size:11px;color:#c7d2e0;margin-top:2px;}
  .al-thought{font-size:11px;color:#e2e8f2;margin-top:4px;font-style:italic;line-height:1.4;}

  /* ===== 卡片视图 ===== */
  #cards-view{
    position:absolute;inset:0;z-index:10;
    background:linear-gradient(160deg,#dff1ff 0%,#fff6df 100%);
    padding:84px 40px 40px;overflow:auto;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;align-content:start;
  }
  #cards-view.hidden{display:none;}

  /* ===== 左侧工作台侧栏 ===== */
  #sidebar{
    position:absolute;left:0;top:0;bottom:0;z-index:18;
    width:300px;display:flex;flex-direction:column;
    background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-right:1px solid var(--border);box-shadow:6px 0 24px rgba(80,110,160,.12);
    transition:transform .28s ease;
  }
  #sidebar.collapsed{transform:translateX(-300px);}
  .sb-head{padding:16px 16px 10px;border-bottom:1px solid var(--border);}
  .sb-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .sb-title b{font-size:15px;font-weight:800;}
  .sb-search{width:100%;background:#f1f5fb;border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:13px;color:var(--text);outline:none;}
  .sb-search:focus{border-color:var(--accent);}
  .sb-list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;}
  .sb-item{
    display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer;
    border:1px solid transparent;transition:.16s;background:rgba(0,0,0,0);
  }
  .sb-item:hover{background:#eef4fb;border-color:var(--border);}
  .sb-item.active{background:#e3f0ff;border-color:var(--accent);}
  .sb-av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .sb-mid{flex:1;min-width:0;}
  .sb-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;}
  .sb-sub{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor;}
  .sb-actions{display:flex;gap:6px;}
  .sb-btn{
    border:1px solid var(--border);background:#fff;color:var(--muted);
    width:30px;height:30px;border-radius:9px;font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .sb-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  .sb-btn.chat:hover{background:#4c9be8;border-color:#4c9be8;}
  .sb-foot{padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:8px;}
  .sb-foot .btn{flex:1;padding:9px;font-size:12px;}
  /* 侧栏折叠按钮 */
  #sidebar-toggle{
    position:absolute;left:300px;top:50%;transform:translateY(-50%);z-index:19;
    width:24px;height:56px;border-radius:0 10px 10px 0;
    background:rgba(255,255,255,.92);border:1px solid var(--border);border-left:0;
    color:var(--muted);cursor:pointer;font-size:14px;transition:left .28s ease, background .15s;
    box-shadow:4px 0 12px rgba(80,110,160,.1);display:flex;align-items:center;justify-content:center;
  }
  #sidebar-toggle:hover{background:#fff;color:var(--accent);}
  #sidebar.collapsed ~ #sidebar-toggle{left:0;}
  /* 3D 场景给侧栏让出空间 */
  body:not(.no-sidebar) #scene-container{left:300px;}
  body:not(.no-sidebar) #legend, body:not(.no-sidebar) #hint{left:314px;}

  .agent-card{
    background:#fff;border:1px solid var(--border);border-radius:20px;padding:20px;
    cursor:pointer;transition:.22s;position:relative;overflow:hidden;
    box-shadow:0 6px 20px rgba(80,110,160,.1);
  }
  .agent-card:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(80,110,160,.22);}
  .ac-head{display:flex;align-items:center;gap:14px;}
  .ac-avatar{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;}
  .ac-name{font-weight:800;font-size:17px;}
  .ac-role{font-size:12px;color:var(--muted);margin-top:2px;}
  .ac-status{margin-top:14px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;}
  .ac-thought{margin-top:10px;font-size:13px;color:#566;font-style:italic;line-height:1.5;min-height:40px;}
  .ac-task{margin-top:12px;font-size:12px;color:var(--muted);background:#f3f6fb;padding:8px 12px;border-radius:10px;}
  .ac-task b{color:var(--text);}
  .ac-skills{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;}
  .skill-tag{font-size:11px;background:#eef3fa;padding:3px 9px;border-radius:20px;color:#566;}
  .ac-cta{margin-top:16px;text-align:center;background:var(--accent);color:#fff;padding:9px;border-radius:11px;font-weight:800;font-size:13px;}

  /* ===== 对话窗口 ===== */
  #chat-modal{position:fixed;inset:0;z-index:50;background:rgba(40,52,72,.32);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:flex-end;padding:24px;}
  #chat-modal.hidden{display:none;}
  .chat-box{
    width:400px;max-width:100%;height:min(620px,85vh);
    background:var(--panel-solid);border-radius:20px;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(40,52,72,.35);
    animation:slideUp .25s ease;
  }
  @keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .chat-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:#f7faff;}
  .chat-head .av{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;}
  .chat-head .info{flex:1;min-width:0;}
  .chat-head .info b{font-size:15px;}
  .chat-head .info .s{font-size:12px;color:var(--muted);margin-top:1px;}
  .chat-close{background:transparent;border:0;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;padding:0 4px;}
  .chat-close:hover{color:var(--text);}
  .chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#fbfdff;}
  .msg{max-width:82%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.55;word-break:break-word;}
  .msg.them{align-self:flex-start;background:#eef3fa;border-bottom-left-radius:4px;}
  .msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
  .msg.sys{align-self:center;background:#eef3fa;color:var(--muted);font-size:11px;border-radius:8px;padding:5px 10px;}
  .chat-task{padding:8px 14px;font-size:12px;color:var(--muted);background:#f3f6fb;border-top:1px solid var(--border);}
  .chat-task b{color:var(--text);}
  .chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:#fff;}
  .chat-input input{flex:1;background:#f3f6fb;border:1px solid var(--border);border-radius:11px;color:var(--text);padding:10px 12px;font-size:13px;outline:none;}
  .chat-input input:focus{border-color:var(--accent);}
  .chat-input button{background:var(--accent);color:#fff;border:0;border-radius:11px;padding:0 16px;font-weight:800;cursor:pointer;}

  /* ===== toast ===== */
  #toast{
    position:fixed;top:74px;left:50%;transform:translateX(-50%) translateY(-20px);
    background:#fff;border:1px solid var(--border);border-left:3px solid var(--accent);
    padding:10px 18px;border-radius:11px;font-size:13px;z-index:60;color:var(--text);
    opacity:0;transition:.3s;pointer-events:none;box-shadow:0 10px 30px rgba(80,110,160,.22);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

  }
}
</script>

<body>
<div id="app">
  <div id="toolbar">
    <div class="brand">
      <span class="logo">🏢</span> 数字员工办公区
      <span class="stat-pill"><span id="workingCount">0</span> 在岗</span>
    </div>
    <div class="view-switch">
      <button data-view="3d" class="active">🌐 3D 办公区</button>
      <button data-view="cards">🗂️ 会话列表</button>
    </div>
    <div class="toolbar-actions">
      <button class="btn" id="randomStatusBtn">🎲 随机状态</button>
      <button class="btn btn-primary" id="assignBtn">📋 派个活</button>
    </div>
  </div>

  <!-- 左侧工作台侧栏：直接管理/派活，3D 仅作装饰 -->
  <aside id="sidebar">
    <div class="sb-head">
      <div class="sb-title">
        <b>🗂️ 工作台 · 员工列表</b>
        <span class="stat-pill"><span id="sbWorkingCount">0</span> 在岗</span>
      </div>
      <input class="sb-search" id="sbSearch" placeholder="🔍 搜索员工 / 任务..." />
    </div>
    <div class="sb-list" id="sbList"></div>
    <div class="sb-foot">
      <button class="btn btn-primary" id="sbAssignBtn">📋 一键派活</button>
      <button class="btn" id="sbStatusBtn">🎲 全员状态</button>
    </div>
  </aside>
  <button id="sidebar-toggle" title="收起/展开侧栏">‹</button>

  <div id="scene-container"></div>
  <div id="cards-view" class="hidden"></div>

  <div id="legend">
    <h4>状态图例</h4>
    <div class="legend-row"><span class="legend-dot" style="background:#43c46e"></span>工作中 🛠️</div>
    <div class="legend-row"><span class="legend-dot" style="background:#f5b400"></span>思考中 💭</div>
    <div class="legend-row"><span class="legend-dot" style="background:#ff8a3d"></span>摸鱼中 🐟</div>
    <div class="legend-row"><span class="legend-dot" style="background:#94a3b8"></span>休息中 ☕</div>
  </div>

  <!-- <div id="hint">💡 拖动旋转视角 · 滚轮缩放 · 点击员工即可对话</div> -->

  <div id="chat-modal" class="hidden">
    <div class="chat-box">
      <div class="chat-head">
        <div class="av" id="chatAv"></div>
        <div class="info"><b id="chatName"></b><div class="s" id="chatStatus"></div></div>
        <button class="chat-close" id="chatCloseBtn">×</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-task" id="chatTask"></div>
      <div class="chat-input">
        <input id="chatInput" placeholder="对员工说点什么..." autocomplete="off" />
        <button id="sendBtn">发送</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>

const PASTEL = {
  mint:0x86e3c7, pink:0xffb6cc, yellow:0xffe27a, sky:0x9ed4ff,
  lavender:0xc8b3ff, coral:0xffa37a, cream:0xfff2cf, wood:0xe9cf9f,
  white:0xf7f8fc, dark:0x46566e, green:0x6fcf97, orange:0xff9f5a,
  red:0xff7a7a, teal:0x5fd0d0,
};
function mat(color, o={}){ return new THREE.MeshStandardMaterial({ color, roughness:o.r??0.75, metalness:o.m??0.05, flatShading:o.flat??true, transparent:!!o.t, opacity:o.o??1, emissive:o.e??0x000000, emissiveIntensity:o.ei??0 }); }
function mesh(geo, material, cast=true){ const m=new THREE.Mesh(geo,material); m.castShadow=cast; m.receiveShadow=true; return m; }
function box(w,h,d,m,cast=true){ return mesh(new THREE.BoxGeometry(w,h,d), m, cast); }
function cyl(rt,rb,h,m,seg=18,cast=true){ return mesh(new THREE.CylinderGeometry(rt,rb,h,seg), m, cast); }
function sph(r,m,cast=true){ return mesh(new THREE.SphereGeometry(r,20,20), m, cast); }

function textSprite(text, color='#283244', size=88, bg=null){
  const c=document.createElement('canvas'); c.width=1024; c.height=256;
  const ctx=c.getContext('2d');
  if(bg){ ctx.fillStyle=bg; roundRect(ctx,8,8,1008,240,40); ctx.fill(); }
  ctx.font=`bold ${size}px -apple-system,"PingFang SC",sans-serif`;
  ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text, 512, 128);
  const t=new THREE.CanvasTexture(c);
  return new THREE.Sprite(new THREE.SpriteMaterial({ map:t, transparent:true }));
}
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// 多行白板贴图
function boardTexture(lines, bg='#ffffff', ink='#3b4a63'){
  const c=document.createElement('canvas'); c.width=1024; c.height=640;
  const ctx=c.getContext('2d');
  ctx.fillStyle=bg; ctx.fillRect(0,0,1024,640);
  ctx.strokeStyle='#d8e3f0'; ctx.lineWidth=2;
  for(let i=0;i<640;i+=40){ ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(1024,i); ctx.stroke(); }
  ctx.fillStyle=ink; ctx.textAlign='left'; ctx.textBaseline='top';
  lines.forEach((ln,i)=>{ ctx.font=`bold ${i===0?64:46}px "PingFang SC",sans-serif`; ctx.fillStyle=i===0?'#e25555':ink; ctx.fillText(ln, 40, 30+i*78); });
  return new THREE.CanvasTexture(c);
}

/* ---------- 落地窗 + 云朵 ---------- */
function addWindow(){
  const wx=0, wy=2.9, wz=-7.82;
  // 天空背景板（亮蓝，自发光感）
  const sky = mesh(new THREE.PlaneGeometry(13,4.4), new THREE.MeshBasicMaterial({ color:0x8fd0ff }), false);
  sky.position.set(wx,wy,wz+0.01); scene.add(sky);
  // 远山（几个三角形小山）
  for(let i=0;i<5;i++){
    const m = mesh(new THREE.ConeGeometry(1.6+Math.random(), 1.4+Math.random()*0.6, 4),
      new THREE.MeshBasicMaterial({ color: i%2?0x7fc0a0:0x9bd0b0 }), false);
    m.position.set(-5+i*2.4, 1.4, wz+0.02); scene.add(m);
  }
  // 云朵（飘动）
  for(let i=0;i<5;i++){
    const cl = new THREE.Group();
    const cm = new THREE.MeshBasicMaterial({ color:0xffffff });
    [[0,0,1.1],[0.8,0.1,0.8],[-0.8,0.05,0.7],[0.3,-0.3,0.6]].forEach(([x,y,r])=>{
      const s=new THREE.Mesh(new THREE.SphereGeometry(r,12,12), cm); s.position.set(x,y,0); cl.add(s);
    });
    cl.position.set(-5+i*2.5, 3.4+Math.random()*0.6, wz+0.05);
    cl.userData = { speed:0.12+Math.random()*0.1, baseX:cl.position.x };
    scene.add(cl); dyn.clouds.push(cl);
  }
  // 窗框（白色十字）
  const fm = mat(PASTEL.white,{r:0.6});
  const fTop = box(13.4,0.25,0.3,fm,false); fTop.position.set(wx,wy+2.25,wz); scene.add(fTop);
  const fBot = box(13.4,0.25,0.3,fm,false); fBot.position.set(wx,wy-2.25,wz); scene.add(fBot);
  const fL = box(0.25,4.7,0.3,fm,false); fL.position.set(wx-6.6,wy,wz); scene.add(fL);
  const fR = box(0.25,4.7,0.3,fm,false); fR.position.set(wx+6.6,wy,wz); scene.add(fR);
  const fMidV = box(0.18,4.7,0.3,fm,false); fMidV.position.set(wx,wy,wz); scene.add(fMidV);
  const fMidH = box(13.4,0.18,0.3,fm,false); fMidH.position.set(wx,wy,wz); scene.add(fMidH);
  // 窗台
  const sill = box(14,0.25,0.7, mat(PASTEL.white,{r:0.6}), false);
  sill.position.set(wx,0.75,wz+0.3); scene.add(sill);
  // 窗台小盆栽
  addPlant(-4, 0, 'tiny', wx+4.5, 0.9, wz+0.4);
  addPlant(-4, 0, 'tiny', wx-4.5, 0.9, wz+0.4);
}

  // 刻度
  for(let i=0;i<12;i++){
    const a=i/12*Math.PI*2;
    const dot=mesh(new THREE.BoxGeometry(0.03,0.08,0.02), mat(PASTEL.dark,{flat:false}));
    dot.position.set(Math.sin(a)*0.36, Math.cos(a)*0.36, 0.08); dot.rotation.z=-a; g.add(dot);

  const minHand=box(0.035,0.32,0.02, mat(PASTEL.dark)); minHand.geometry.translate(0,0.15,0); minHand.position.z=0.11; g.add(minHand);

  dyn.clock={ hour:hourHand, min:minHand, sec:secHand };

    const cheek=mesh(new THREE.CircleGeometry(0.06,12),

    const band=mesh(new THREE.TorusGeometry(0.28,0.025,8,20,Math.PI*0.6), mat(PASTEL.dark,{r:0.4}));
    band.position.y=1.6; band.rotation.z=s>0?0:Math.PI; g.add(band);
    const ear=cyl(0.07,0.07,0.06,12, mat(PASTEL.dark)); ear.position.set(s*0.27,1.5,0); ear.rotation.z=s*Math.PI/2; g.add(ear);
  });
  // 手（小球）
  [-1,1].forEach(s=>{ const hand=sph(0.1, bodyMat); hand.position.set(s*0.34,0.75,0.1); hand.userData.agentId=agent.id; g.add(hand); });
  // 椅子
  const chairMat=mat(PASTEL.dark,{r:0.7});
  const seat=box(0.6,0.08,0.6,chairMat); seat.position.set(0,0.5,-0.38); g.add(seat);
  const back=box(0.6,0.7,0.08, mat(0x5a6b85)); back.position.set(0,0.85,-0.65); g.add(back);
  const pole=cyl(0.04,0.04,0.5,chairMat); pole.position.set(0,0.25,-0.38); g.add(pole);
  [[-0.22,-0.55],[0.22,-0.55],[-0.22,-0.21],[0.22,-0.21]].forEach(p=>{ const w=cyl(0.05,0.05,0.12,chairMat); w.position.set(p[0],0.08,p[1]); g.add(w); });
  // 头顶标签
  const div=document.createElement('div'); div.className='agent-label'; div.innerHTML=labelHTML(agent);
  const label=new CSS2DObject(div); label.position.set(0,2.35,0); g.add(label);

  scene.add(g);
  const desk=createDesk(station,color,agent.id); scene.add(desk);
  employeeObjects[agent.id]={ group:g, body, head, ring, labelDiv:div, screen:desk.userData.screen, phase:Math.random()*Math.PI*2, baseRotY:station.face,
    // 活动状态机
    activity:'atDesk',          // atDesk | walking | chatting | drinking | restroom
    homePos: new THREE.Vector3(station.emp.x, 0, station.emp.z), // 工位
    homeRotY: station.face,
    path: null,                 // 当前路径 [{x,z}, ...]
    pathIdx: 0,
    pathSpeed: 2.2,
    onArrive: null,             // 到达终点回调
    activityUntil: 0,           // 离开工位活动的结束时间(ms 时间戳)
    chatBubble: null,           // 聊天气泡 div（DOM）
    chatPartner: null,          // 聊天对象 id
  };
}

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let pointerDown=null;
function pickAgentFromEvent(e){
  pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(scene.children,true);
  for(const h of hits){ if(h.object.userData && h.object.userData.agentId) return h.object.userData.agentId; }
  return null;
}
renderer.domElement.addEventListener('pointerdown', e=>{ pointerDown={x:e.clientX,y:e.clientY}; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!pointerDown) return;
  const dx=Math.abs(e.clientX-pointerDown.x), dy=Math.abs(e.clientY-pointerDown.y);
  pointerDown=null; if(dx>5||dy>5) return;
  const id=pickAgentFromEvent(e); if(id) openChat(id);
});
renderer.domElement.addEventListener('pointermove', e=>{
  const id=pickAgentFromEvent(e);
  document.body.style.cursor=id?'pointer':'default';
  Object.entries(employeeObjects).forEach(([k,o])=> o.labelDiv.classList.toggle('hover', k===id));
});

// 创建/更新聊天气泡（DOM 叠在 3D 上）
function makeBubble(text){
  const d=document.createElement('div');
  d.style.cssText='position:absolute;background:#fff;color:#283244;padding:7px 11px;border-radius:12px;'
    +'font-size:12px;font-weight:600;max-width:180px;box-shadow:0 6px 18px rgba(80,110,160,.25);'
    +'border:1px solid rgba(60,80,110,.16);pointer-events:none;z-index:16;opacity:0;transition:opacity .25s;'
    +'transform:translate(-50%,-100%);white-space:normal;line-height:1.4;';
  d.innerHTML=`💬 ${text}`;
  sceneEl.appendChild(d);
  requestAnimationFrame(()=> d.style.opacity='1');
  return d;
}

// 计算从当前位置到目标的直线路径（中间加一两个拐点，绕开工位中心）
function buildPath(from, to){
  const pts=[{x:from.x,z:from.z}];
  // 若距离较远，加一个中间拐点
  const dx=to.x-from.x, dz=to.z-from.z;
  const dist=Math.hypot(dx,dz);
  if(dist>3.5){
    const mx=from.x+dx*0.5 + (Math.random()-0.5)*1.5;
    const mz=from.z+dz*0.5 + (Math.random()-0.5)*1.5;
    pts.push({x:mx,z:mz});
  }
  pts.push({x:to.x,z:to.z});
  return pts;
}

// 派遣一个员工去某点，到达后执行回调
function sendTo(id, target, face, onArrive){
  const o=employeeObjects[id];
  o.path = buildPath(o.group.position, target);
  o.pathIdx = 0;
  o.targetFace = face;
  o.onArrive = onArrive;
  o.activity = 'walking';
  // 坐下状态相关的暂时关闭
}

// 走回工位坐下
function goHome(id, after){
  const o=employeeObjects[id];
  sendTo(id, o.homePos, o.homeRotY, ()=>{
    o.activity='atDesk';
    o.group.rotation.y=o.homeRotY;
    if(after) after();
  });
}

// 触发单人活动：接水/上厕所/看鱼/沙发/咖啡
function triggerSoloActivity(id){
  const a=AGENTS.find(x=>x.id===id); if(!a) return;
  const o=employeeObjects[id];
  if(o.activity!=='atDesk') return; // 正忙就不打扰
  const choices=[
    {k:'water',   dur:5000,  thought:'接杯水，歇会儿'},
    {k:'coffee',  dur:6000,  thought:'来杯咖啡续命'},
    {k:'restroom',dur:8000,  thought:'尿急！冲向厕所'},
    {k:'fish',    dur:7000,  thought:'去看看我的鱼'},
    {k:'sofa',    dur:9000,  thought:'沙发瘫五分钟'},
  ];
  const c=pick(choices);
  const p=POI[c.k];
  // 离开工位时，工作/思考中的有概率被打断
  a.thought=c.thought;
  sendTo(id, {x:p.x,z:p.z}, p.face, ()=>{
    o.activity=c.k;
    o.activityUntil=Date.now()+c.dur;
    refreshAgent(a);
    toast(`${a.avatar} ${a.name}：${p.label}`);
    // 聊天气泡（单人也有自言自语）
    if(Math.random()<0.5){
      o.chatBubble=makeBubble(pickTopic());
    }
  });
  refreshAgent(a);
}

// 触发两人聊八卦
function triggerChatActivity(idA, idB){
  const a=AGENTS.find(x=>x.id===idA), b=AGENTS.find(x=>x.id===idB);
  const oA=employeeObjects[idA], oB=employeeObjects[idB];
  if(!a||!b) return;
  if(oA.activity!=='atDesk'||oB.activity!=='atDesk') return;
  const spot=pick(POI.chat);
  const dur=8000+Math.random()*5000;
  // 两人走到聊天点两侧
  sendTo(idA, {x:spot.x-0.6, z:spot.z}, spot.faceA, ()=>{
    oA.activity='chatting'; oA.activityUntil=Date.now()+dur; oA.chatPartner=idB;
    oA.chatBubble=makeBubble(pickTopic());
    a.thought='在跟'+b.name+'聊几句'; refreshAgent(a);
  });
  sendTo(idB, {x:spot.x+0.6, z:spot.z}, spot.faceB, ()=>{
    oB.activity='chatting'; oB.activityUntil=Date.now()+dur; oB.chatPartner=idA;
    setTimeout(()=>{ oB.chatBubble=makeBubble(pickTopic()); }, 1200);
    b.thought='在跟'+a.name+'聊几句'; refreshAgent(b);
  });
}

// 每帧推进路径移动 + 活动超时回收
function updateActivities(dt){
  const now=Date.now();
  AGENTS.forEach(a=>{
    const o=employeeObjects[a.id];
    // 路径行走
    if(o.activity==='walking' && o.path){
      const target=o.path[o.pathIdx+1];
      if(target){
        const cur=o.group.position;
        const dx=target.x-cur.x, dz=target.z-cur.z;
        const d=Math.hypot(dx,dz);
        const step=o.pathSpeed*dt;
        if(d<=step){
          cur.x=target.x; cur.z=target.z; o.pathIdx++;
        } else {
          cur.x+=dx/d*step; cur.z+=dz/d*step;
          // 朝向行走方向
          o.group.rotation.y=Math.atan2(dx,dz);
        }
        // 走路身体上下晃
        o.body.position.y=0.85+Math.abs(Math.sin(now*0.012))*0.06;
        o.body.rotation.z=0; o.head.rotation.x=0.1;
      } else {
        // 到达终点
        o.path=null; o.pathIdx=0;
        o.group.rotation.y=o.targetFace;
        o.body.position.y=0.85;
        if(o.onArrive){ const cb=o.onArrive; o.onArrive=null; cb(); }
      }
    }
    // 活动结束 → 回工位
    else if(['water','coffee','restroom','fish','sofa','chatting'].includes(o.activity)){
      if(o.activityUntil && now>o.activityUntil){
        if(o.chatBubble){ o.chatBubble.remove(); o.chatBubble=null; }
        o.chatPartner=null;
        a.thought=pick(THOUGHTS[a.status]||THOUGHTS.idle); refreshAgent(a);
        goHome(a.id);
      }
    }
    // 聊天气泡跟随
    if(o.chatBubble){
      const p=o.group.position.clone(); p.y+=2.4;
      p.project(camera);
      const sx=(p.x*0.5+0.5)*innerWidth, sy=(-p.y*0.5+0.5)*innerHeight;
      o.chatBubble.style.left=sx+'px'; o.chatBubble.style.top=sy+'px';
      // 摄像机背后则隐藏
      o.chatBubble.style.visibility = p.z<1 ? 'visible':'hidden';
    }
  });
}

// 行为调度器：周期触发
function scheduleBehavior(){
  setTimeout(()=>{
    const r=Math.random();
    const idle=AGENTS.filter(a=> ['idle','break'].includes(a.status));
    const anyone=AGENTS.slice();
    if(r<0.45 && anyone.length>=2){
      // 两人聊八卦（优先 idle 的）
      const pool = idle.length>=2 ? idle : anyone;
      const i=Math.floor(Math.random()*pool.length), j=(i+1+Math.floor(Math.random()*(pool.length-1)))%pool.length;
      triggerChatActivity(pool[i].id, pool[j].id);
    } else {
      // 单人活动
      const pool = idle.length ? idle : anyone;
      triggerSoloActivity(pick(pool).id);
    }
    scheduleBehavior();
  }, 9000+Math.random()*7000);
}
scheduleBehavior();

/* ============================================================
   12. 动画循环（员工动作 + 鱼游 + 时钟 + 云飘）
   ============================================================ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  const dt=Math.min(clock.getDelta(),0.05); // 限幅，避免切后台后大跳

  // 推进自由行为（行走/活动回收/气泡跟随）
  updateActivities(dt);

  // 员工动作（离座期间由活动系统驱动位置，这里只做坐姿/在岗小动作）
  AGENTS.forEach(a=>{
    const o=employeeObjects[a.id]; const tt=t+o.phase;
    if(o.activity!=='atDesk'){
      // 非工位状态的附加小动作
      if(o.activity==='chatting'){
        o.head.rotation.x=Math.sin(tt*4)*0.18;      // 聊天点头
        o.body.rotation.z=0; o.body.position.y=0.85+Math.sin(tt*2)*0.02;
      } else if(o.activity==='drinking'||o.activity==='water'||o.activity==='coffee'){
        o.head.rotation.x=0.3+Math.sin(tt*2)*0.08;   // 低头接水/喝咖啡
        o.body.rotation.z=0;
      } else if(o.activity==='sofa'){
        o.body.position.y=0.6; o.body.rotation.z=0.3; o.head.rotation.x=0.4; // 瘫着
      } else if(o.activity==='restroom'){
        // 已离开画面（厕所门口外），保持站立微动
        o.body.position.y=0.85+Math.sin(tt*3)*0.02; o.body.rotation.z=0; o.head.rotation.x=0;
      }
      // walking 时位置/姿态已在 updateActivities 处理，这里不再覆盖 body.y
      o.ring.visible=false;
      return;
    }
    // ===== 以下为在工位（atDesk）的动作 =====
    if(a.status==='working'){
      o.body.position.y=0.85+Math.abs(Math.sin(tt*8))*0.035;
      o.head.rotation.x=Math.sin(tt*3)*0.12; o.body.rotation.z=0; o.group.rotation.y=o.baseRotY;
      o.ring.visible=true; o.ring.rotation.z=tt*1.6;
    } else if(a.status==='thinking'){
      o.body.position.y=0.85; o.head.rotation.x=Math.sin(tt*1.5)*0.22;
      o.group.rotation.y=o.baseRotY+Math.sin(tt*0.6)*0.15; o.body.rotation.z=0;
      o.ring.visible=true; o.ring.rotation.z=tt*0.8;
    } else if(a.status==='idle'){
      o.body.position.y=0.85; o.body.rotation.z=0.12+Math.sin(tt*0.8)*0.08;
      o.head.rotation.x=0.35+Math.sin(tt*1.1)*0.06; o.group.rotation.y=o.baseRotY;
      o.ring.visible=false;
    } else {
      o.body.position.y=0.7; o.body.rotation.z=0.25; o.head.rotation.x=0.75; o.group.rotation.y=o.baseRotY;
      o.ring.visible=false;
    }
  });

  // 鱼游动
  dyn.fish.forEach(f=>{
    const u=f.userData; u.angle += u.speed*0.016;
    f.position.x = u.cx + Math.cos(u.angle)*u.rr;
    f.position.z = u.cz + Math.sin(u.angle)*u.rr*0.7;
    f.position.y = u.ry + Math.sin(u.angle*2)*0.06;
    f.rotation.y = -u.angle + Math.PI/2;
  });

  // 云朵飘动（循环）
  dyn.clouds.forEach(c=>{
    c.position.x += c.userData.speed*0.016;
    if(c.position.x > 7) c.position.x = -7;
  });

  // 时钟（真实时间）
  if(dyn.clock){
    const now=new Date();
    const s=now.getSeconds()+now.getMilliseconds()/1000;
    const mn=now.getMinutes()+s/60;
    const h=(now.getHours()%12)+mn/60;
    dyn.clock.sec.rotation.z  = -s/60*Math.PI*2;
    dyn.clock.min.rotation.z  = -mn/60*Math.PI*2;
    dyn.clock.hour.rotation.z = -h/12*Math.PI*2;
  }

  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}

/* ============================================================
   13. 启动
   ============================================================ */
createOffice();
AGENTS.forEach((a,i)=> createEmployee(a, STATIONS[i]));
buildCards();
AGENTS.forEach(refreshAgent);
renderSidebar();
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});
animate();
toast('🏢 阳光办公区已上线，5 位数字员工报到！');
</script>
