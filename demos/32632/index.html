<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠配 AI —— 智能宠物选型匹配工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF8C42;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --bg: #FFF8F0;
            --text: #2D3436;
            --text-light: #636E72;
            --white: #FFFFFF;
            --shadow: rgba(255, 140, 66, 0.15);
            --radius: 20px;
            --radius-sm: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ========== HOME PAGE ========== */
        .page {
            display: none;
            min-height: 100vh;
        }

        .page.active {
            display: block;
        }

        .hero {
            position: relative;
            padding: 80px 0 60px;
            text-align: center;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -20%;
            width: 140%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(78, 205, 196, 0.1) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(255, 140, 66, 0.15) 0%, transparent 40%),
                        radial-gradient(ellipse at 20% 80%, rgba(255, 230, 109, 0.1) 0%, transparent 40%);
            z-index: -1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary), #FF6B35);
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
            animation: fadeInDown 0.6s ease-out;
        }

        .hero-badge svg {
            width: 16px;
            height: 16px;
        }

        .hero h1 {
            font-size: clamp(36px, 8vw, 64px);
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, #FF6B35 50%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }

        .hero-subtitle {
            font-size: clamp(16px, 3vw, 20px);
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto 40px;
            line-height: 1.8;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, var(--primary), #FF6B35);
            color: white;
            padding: 18px 48px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px var(--shadow);
            animation: fadeInUp 0.6s ease-out 0.3s both;
        }

        .hero-cta:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px rgba(255, 140, 66, 0.3);
        }

        .hero-cta svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .hero-cta:hover svg {
            transform: translateX(4px);
        }

        /* Floating decorations */
        .floats {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .float-item {
            position: absolute;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
        }

        .float-item:nth-child(1) {
            top: 15%;
            left: 10%;
            animation-delay: 0s;
        }

        .float-item:nth-child(2) {
            top: 25%;
            right: 12%;
            animation-delay: 1s;
        }

        .float-item:nth-child(3) {
            bottom: 20%;
            left: 8%;
            animation-delay: 2s;
        }

        .float-item:nth-child(4) {
            bottom: 30%;
            right: 10%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* Features section */
        .features {
            padding: 60px 0 100px;
        }

        .features h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 48px;
            color: var(--text);
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .feature-card {
            background: var(--white);
            padding: 32px;
            border-radius: var(--radius);
            box-shadow: 0 4px 20px var(--shadow);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(255, 140, 66, 0.2);
        }

        .feature-card:hover::before {
            transform: scaleX(1);
        }

        .feature-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .feature-icon.orange {
            background: linear-gradient(135deg, rgba(255, 140, 66, 0.2), rgba(255, 107, 53, 0.1));
        }

        .feature-icon.teal {
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.2), rgba(78, 205, 196, 0.1));
        }

        .feature-icon.yellow {
            background: linear-gradient(135deg, rgba(255, 230, 109, 0.3), rgba(255, 230, 109, 0.1));
        }

        .feature-icon svg {
            width: 32px;
            height: 32px;
        }

        .feature-card h3 {
            font-size: 20px;
            margin-bottom: 12px;
            color: var(--text);
        }

        .feature-card p {
            font-size: 15px;
            color: var(--text-light);
            line-height: 1.7;
        }

        /* ========== QUIZ PAGE ========== */
        .quiz-page {
            padding: 40px 0 60px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-light);
            font-size: 15px;
            cursor: pointer;
            background: none;
            border: none;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: var(--primary);
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
        }

        .progress-container {
            flex: 1;
            max-width: 400px;
            margin: 0 24px;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255, 140, 66, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .progress-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
        }

        .quiz-content {
            max-width: 700px;
            margin: 0 auto;
        }

        .question-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: 0 8px 40px var(--shadow);
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .question-number {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .question-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 32px;
            color: var(--text);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 24px;
            background: var(--bg);
            border: 2px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
        }

        .option:hover {
            border-color: rgba(255, 140, 66, 0.5);
            background: rgba(255, 140, 66, 0.05);
            transform: translateX(4px);
        }

        .option.selected {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(255, 140, 66, 0.12), rgba(78, 205, 196, 0.08));
            box-shadow: 0 4px 16px rgba(255, 140, 66, 0.2);
        }

        .option.selected .option-text {
            color: var(--primary);
            font-weight: 600;
        }

        .option-radio {
            width: 24px;
            height: 24px;
            border: 2px solid #ddd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .option.selected .option-radio {
            border-color: var(--primary);
            background: var(--primary);
        }

        .option.selected .option-radio::after {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }

        .option-text {
            font-size: 16px;
            color: var(--text);
        }

        .option-sub {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 4px;
        }

        .quiz-footer {
            display: flex;
            justify-content: center;
            margin-top: 32px;
        }

        .next-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--primary), #FF6B35);
            color: white;
            padding: 16px 48px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.5;
            pointer-events: none;
        }

        .next-btn.active {
            opacity: 1;
            pointer-events: auto;
        }

        .next-btn.active:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 140, 66, 0.4);
        }

        .next-btn svg {
            width: 18px;
            height: 18px;
        }

        /* ========== RESULT PAGE ========== */
        .result-page {
            padding: 60px 0;
        }

        .result-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .result-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--secondary), #3DB9B1);
            color: white;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .result-header h2 {
            font-size: 32px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-header p {
            color: var(--text-light);
            font-size: 16px;
        }

        .results-grid {
            display: grid;
            gap: 24px;
            max-width: 800px;
            margin: 0 auto;
        }

        .result-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 8px 40px var(--shadow);
            transition: all 0.3s ease;
        }

        .result-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 60px rgba(255, 140, 66, 0.2);
        }

        .result-card.top {
            border: 3px solid var(--primary);
        }

        .result-card-inner {
            display: flex;
            padding: 28px;
            gap: 24px;
        }

        .result-rank {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .result-card.top .result-rank {
            background: linear-gradient(135deg, var(--primary), #FF6B35);
            color: white;
        }

        .result-card:not(.top) .result-rank {
            background: var(--bg);
            color: var(--text-light);
        }

        .result-info {
            flex: 1;
        }

        .result-pet-name {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .match-badge {
            font-size: 13px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--secondary), #3DB9B1);
            color: white;
        }

        .result-types {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .type-tag {
            padding: 6px 14px;
            background: var(--bg);
            border-radius: 50px;
            font-size: 13px;
            color: var(--text-light);
        }

        .result-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .result-analysis {
            padding: 0 28px 28px;
        }

        .analysis-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text);
        }

        .analysis-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .analysis-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 14px;
            color: var(--text-light);
        }

        .analysis-item svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .analysis-item.positive svg {
            color: var(--secondary);
        }

        .analysis-item.warning svg {
            color: var(--primary);
        }

        .result-actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 48px;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, var(--primary), #FF6B35);
            color: white;
        }

        .action-btn.secondary {
            background: var(--white);
            color: var(--text);
            border: 2px solid #eee;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .action-btn svg {
            width: 18px;
            height: 18px;
        }

        /* ========== ANIMATIONS ========== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .hero {
                padding: 60px 0 40px;
            }

            .quiz-header {
                flex-direction: column;
                gap: 20px;
            }

            .progress-container {
                width: 100%;
                margin: 0;
                order: -1;
            }

            .question-card {
                padding: 28px;
            }

            .result-card-inner {
                flex-direction: column;
                text-align: center;
            }

            .result-rank {
                margin: 0 auto;
            }

            .result-details {
                grid-template-columns: repeat(3, 1fr);
            }

            .result-actions {
                flex-direction: column;
                padding: 0 20px;
            }

            .action-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- ========== HOME PAGE ========== -->
    <div id="home" class="page active">
        <div class="floats">
            <div class="float-item">
                <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
                    <circle cx="30" cy="30" r="28" stroke="#FF8C42" stroke-width="2" stroke-dasharray="4 4"/>
                    <path d="M20 35c0-5.5 4.5-10 10-10s10 4.5 10 10" stroke="#FF8C42" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="24" cy="26" r="3" fill="#FF8C42"/>
                    <circle cx="36" cy="26" r="3" fill="#FF8C42"/>
                </svg>
            </div>
            <div class="float-item">
                <svg width="50" height="50" viewBox="0 0 50 50" fill="none">
                    <path d="M25 10c-8 0-15 7-15 15s15 20 15 20 15-13 15-20-7-15-15-15z" stroke="#4ECDC4" stroke-width="2"/>
                    <circle cx="20" cy="22" r="2" fill="#4ECDC4"/>
                    <circle cx="30" cy="22" r="2" fill="#4ECDC4"/>
                </svg>
            </div>
            <div class="float-item">
                <svg width="55" height="55" viewBox="0 0 55 55" fill="none">
                    <rect x="10" y="15" width="35" height="25" rx="8" stroke="#FFE66D" stroke-width="2"/>
                    <path d="M18 27h4v8h-4zM28 27h4v8h-4z" stroke="#FFE66D" stroke-width="2"/>
                </svg>
            </div>
            <div class="float-item">
                <svg width="45" height="45" viewBox="0 0 45 45" fill="none">
                    <ellipse cx="22" cy="30" rx="15" ry="10" stroke="#4ECDC4" stroke-width="2"/>
                    <ellipse cx="22" cy="30" rx="8" ry="5" stroke="#4ECDC4" stroke-width="2"/>
                </svg>
            </div>
        </div>

        <div class="container">
            <section class="hero">
                <div class="hero-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                    </svg>
                    AI 智能匹配
                </div>
                <h1>宠配 AI</h1>
                <p class="hero-subtitle">
                    通过多维度条件测试，为您智能匹配最合适的宠物品类。<br>
                    让每一次选择，都成为爱的开始。
                </p>
                <button class="hero-cta" onclick="startQuiz()">
                    开始智能匹配
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </section>

            <section class="features">
                <h2>为什么选择宠配 AI</h2>
                <div class="features-grid">
                    <div class="feature-card">
                        <div class="feature-icon orange">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#FF8C42" stroke-width="2">
                                <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
                                <rect x="9" y="3" width="6" height="4" rx="1"/>
                                <path d="M9 12h6M9 16h6"/>
                            </svg>
                        </div>
                        <h3>科学评估体系</h3>
                        <p>基于居住环境、时间精力、经济预算等多维度条件，告别冲动选择，科学匹配适合您的宠物。</p>
                    </div>
                    <div class="feature-card">
                        <div class="feature-icon teal">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#4ECDC4" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M12 6v6l4 2"/>
                            </svg>
                        </div>
                        <h3>节省决策时间</h3>
                        <p>3分钟完成评估，即时获取个性化推荐。无需在海量信息中迷失，快速找到命中注定的伙伴。</p>
                    </div>
                    <div class="feature-card">
                        <div class="feature-icon yellow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#E6B800" stroke-width="2">
                                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                                <path d="M12 8v4M12 16h.01"/>
                            </svg>
                        </div>
                        <h3>减少弃养风险</h3>
                        <p>通过科学匹配，让宠物与您的生活环境完美契合，从源头降低因条件不匹配导致的弃养问题。</p>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- ========== QUIZ PAGE ========== -->
    <div id="quiz" class="page">
        <div class="container">
            <div class="quiz-page">
                <div class="quiz-header">
                    <button class="back-btn" onclick="goHome()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                        返回首页
                    </button>
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-text" id="progressText">第 1 题 / 共 8 题</div>
                    </div>
                    <div style="width: 80px;"></div>
                </div>

                <div class="quiz-content">
                    <div class="question-card" id="questionCard"></div>
                    <div class="quiz-footer">
                        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
                            下一题
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== RESULT PAGE ========== -->
    <div id="result" class="page">
        <div class="container">
            <div class="result-page">
                <div class="result-header">
                    <div class="result-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                        </svg>
                        AI 分析完成
                    </div>
                    <h2>您的最佳宠物匹配</h2>
                    <p>基于您的条件评估，为您推荐以下宠物品类</p>
                </div>

                <div class="results-grid" id="resultsGrid"></div>

                <div class="result-actions">
                    <button class="action-btn secondary" onclick="shareResult()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="18" cy="5" r="3"/>
                            <circle cx="6" cy="12" r="3"/>
                            <circle cx="18" cy="19" r="3"/>
                            <path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/>
                        </svg>
                        分享结果
                    </button>
                    <button class="action-btn primary" onclick="restartQuiz()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 4v6h6M23 20v-6h-6"/>
                            <path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/>
                        </svg>
                        重新测评
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== QUIZ DATA ==========
        const questions = [
            {
                id: 'Q1',
                title: '您的居住面积是多少？',
                type: 'single',
                options: [
                    { value: 1, label: '小于 30㎡', sub: '单间或小公寓' },
                    { value: 2, label: '30-50㎡', sub: '一室一厅' },
                    { value: 3, label: '50-90㎡', sub: '两室户型' },
                    { value: 4, label: '90-150㎡', sub: '三室户型' },
                    { value: 5, label: '150㎡以上', sub: '大户型或别墅' }
                ]
            },
            {
                id: 'Q2',
                title: '您的房屋类型是？',
                type: 'single',
                options: [
                    { value: 'rent', label: '租房', sub: '需考虑房东规定' },
                    { value: 'own', label: '自有住房', sub: '自由度更高' }
                ]
            },
            {
                id: 'Q3',
                title: '您每天能投入多少时间照顾宠物？',
                type: 'single',
                options: [
                    { value: 1, label: '少于 1 小时', sub: '时间比较紧张' },
                    { value: 2, label: '1-2 小时', sub: '日常互动+基础照顾' },
                    { value: 3, label: '2-4 小时', sub: '有充足陪伴时间' },
                    { value: 4, label: '4 小时以上', sub: '时间充裕，可高频互动' }
                ]
            },
            {
                id: 'Q4',
                title: '您的月均宠物预算大约是？',
                type: 'single',
                options: [
                    { value: 1, label: '500 元以下', sub: '基础饲养' },
                    { value: 2, label: '500-1000 元', sub: '普通消费' },
                    { value: 3, label: '1000-2000 元', sub: '中等消费' },
                    { value: 4, label: '2000-3000 元', sub: '品质生活' },
                    { value: 5, label: '3000 元以上', sub: '高端饲养' }
                ]
            },
            {
                id: 'Q5',
                title: '您的家庭结构是？',
                type: 'multiple',
                options: [
                    { value: 'alone', label: '独居' },
                    { value: 'couple', label: '情侣/夫妻' },
                    { value: 'kid', label: '有小孩' },
                    { value: 'elder', label: '有老人' },
                    { value: 'roommate', label: '合租' }
                ]
            },
            {
                id: 'Q6',
                title: '您或家人是否有宠物毛发过敏？',
                type: 'single',
                options: [
                    { value: true, label: '有过敏', sub: '需选择低过敏性宠物' },
                    { value: false, label: '无过敏', sub: '可选择所有宠物品类' }
                ]
            },
            {
                id: 'Q7',
                title: '您期望的宠物活跃度是？',
                type: 'single',
                options: [
                    { value: 1, label: '安静乖巧', sub: '大部分时间休息陪伴' },
                    { value: 2, label: '适度活跃', sub: '偶尔互动玩耍' },
                    { value: 3, label: '活泼好动', sub: '需要频繁互动' },
                    { value: 4, label: '精力旺盛', sub: '需要大量运动和关注' }
                ]
            },
            {
                id: 'Q8',
                title: '您偏好哪种体型宠物？',
                type: 'multiple',
                options: [
                    { value: 'small', label: '小型宠物', sub: '如仓鼠、兔子、龙猫' },
                    { value: 'medium', label: '中型宠物', sub: '如猫、部分犬种' },
                    { value: 'large', label: '大型宠物', sub: '如金毛、阿拉斯加' },
                    { value: 'any', label: '不限制体型', sub: '都可以接受' }
                ]
            }
        ];

        // ========== PET DATA ==========
        const petProfiles = {
            cat: {
                name: '猫咪',
                emoji: '🐱',
                types: ['英短', '美短', '布偶', '狸花', '橘猫'],
                traits: { activity: 3, space: 2, cost: 3, time: 2, noise: 1, maintenance: 2 },
                suitable: ['独居', '上班族', '小户型', '时间有限'],
                unsuitable: ['有大面积庭院需求', '需要狗狗陪伴']
            },
            dog: {
                name: '狗狗',
                emoji: '🐶',
                types: ['柴犬', '柯基', '泰迪', '金毛', '拉布拉多', '边牧'],
                traits: { activity: 5, space: 3, cost: 4, time: 4, noise: 3, maintenance: 4 },
                suitable: ['有时间陪伴', '有庭院或大面积', '喜欢户外'],
                unsuitable: ['工作繁忙', '居住空间小']
            },
            hamster: {
                name: '仓鼠',
                emoji: '🐹',
                types: ['金丝熊', '侏儒仓鼠', '公婆鼠'],
                traits: { activity: 2, space: 1, cost: 1, time: 1, noise: 1, maintenance: 1 },
                suitable: ['空间有限', '预算有限', '新手入门', '学生'],
                unsuitable: ['需要互动性', '希望放养']
            },
            rabbit: {
                name: '兔子',
                emoji: '🐰',
                types: ['垂耳兔', '侏儒兔', '安哥拉兔'],
                traits: { activity: 2, space: 2, cost: 2, time: 2, noise: 1, maintenance: 2 },
                suitable: ['安静环境', '室内饲养', '有时间互动'],
                unsuitable: ['需要大量运动', '希望带出门']
            },
            fish: {
                name: '水族宠物',
                emoji: '🐠',
                types: ['金鱼', '热带鱼', '龟类', '斗鱼'],
                traits: { activity: 1, space: 1, cost: 2, time: 1, noise: 0, maintenance: 2 },
                suitable: ['极其安静需求', '空间最小化', '观察爱好者'],
                unsuitable: ['需要互动', '希望有肢体接触']
            },
            bird: {
                name: '鸟类',
                emoji: '🦜',
                types: ['虎皮鹦鹉', '玄凤', '文鸟', '牡丹鹦鹉'],
                traits: { activity: 3, space: 2, cost: 2, time: 2, noise: 3, maintenance: 3 },
                suitable: ['喜欢鸟类', '有一定时间互动', '相对安静'],
                unsuitable: ['对噪音敏感', '希望安静陪伴']
            }
        };

        // ========== STATE ==========
        let currentStep = 0;
        let answers = {};

        // ========== FUNCTIONS ==========
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function startQuiz() {
            currentStep = 0;
            answers = {};
            // Reset render flag so animation plays for first question of new session
            const card = document.getElementById('questionCard');
            if (card) delete card.dataset.rendered;
            showPage('quiz');
            renderQuestion();
        }

        function goHome() {
            showPage('home');
        }

        function renderQuestion() {
            const q = questions[currentStep];
            const progress = ((currentStep + 1) / questions.length) * 100;

            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = `第 ${currentStep + 1} 题 / 共 ${questions.length} 题`;

            const card = document.getElementById('questionCard');
            const selectedValues = answers[q.id] !== undefined
                ? answers[q.id]
                : (q.type === 'multiple' ? [] : null);

            // First time render → apply animation; subsequent updates → no animation
            const isFirstRender = !card.dataset.rendered;

            let optionsHtml = q.options.map(opt => {
                const isSelected = q.type === 'multiple'
                    ? Array.isArray(selectedValues) && selectedValues.map(String).includes(String(opt.value))
                    : selectedValues === opt.value || String(selectedValues) === String(opt.value);

                return `
                    <div class="option ${isSelected ? 'selected' : ''}" data-value="${opt.value}" data-type="${q.type}">
                        <div class="option-radio"></div>
                        <div>
                            <div class="option-text">${opt.label}</div>
                            ${opt.sub ? `<div class="option-sub">${opt.sub}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            card.innerHTML = `
                <span class="question-number">问题 ${currentStep + 1}</span>
                <h3 class="question-title">${q.title}</h3>
                <div class="options">${optionsHtml}</div>
            `;

            // Bind click events via delegation (avoid inline handlers losing data type)
            card.querySelectorAll('.option').forEach(el => {
                el.addEventListener('click', () => {
                    const value = el.dataset.value;
                    // Convert to proper type matching question definition
                    const typedValue = (typeof q.options[0].value === 'number')
                        ? Number(value)
                        : (value === 'true' ? true : (value === 'false' ? false : value));
                    selectOption(typedValue, q.type);
                });
            });

            // Update next button state
            const nextBtn = document.getElementById('nextBtn');
            const hasAnswer = q.type === 'multiple'
                ? Array.isArray(selectedValues) && selectedValues.length > 0
                : selectedValues !== null && selectedValues !== undefined;
            nextBtn.classList.toggle('active', hasAnswer);

            // Apply animation only on first render (not when re-rendering for selection)
            if (isFirstRender) {
                card.style.animation = 'slideIn 0.4s ease-out';
                card.dataset.rendered = '1';
            } else {
                card.style.animation = 'none';
            }
        }

        function selectOption(value, type) {
            const q = questions[currentStep];
            
            if (type === 'multiple') {
                if (!answers[q.id]) answers[q.id] = [];
                const idx = answers[q.id].indexOf(value);
                if (idx > -1) {
                    answers[q.id].splice(idx, 1);
                } else {
                    answers[q.id].push(value);
                }
            } else {
                answers[q.id] = value;
            }
            
            renderQuestion();
        }

        function nextQuestion() {
            if (currentStep < questions.length - 1) {
                currentStep++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function calculateMatch(userProfile, pet) {
            let score = 100;
            const traits = pet.traits;

            // Space match
            if (userProfile.space < traits.space) {
                score -= (traits.space - userProfile.space) * 12;
            }

            // Budget match
            if (userProfile.budget < traits.cost) {
                score -= (traits.cost - userProfile.budget) * 10;
            }

            // Time match
            if (userProfile.time < traits.time) {
                score -= (traits.time - userProfile.time) * 12;
            }

            // Allergy filter
            if (userProfile.allergy && (pet.name === '猫咪' || pet.name === '狗狗')) {
                score -= 30;
            }

            // Activity preference match
            const activityDiff = Math.abs(userProfile.activity - traits.activity);
            score -= activityDiff * 5;

            // Size preference
            if (userProfile.sizes && userProfile.sizes.length > 0 && !userProfile.sizes.includes('any')) {
                const petSize = pet.name === '水族宠物' || pet.name === '仓鼠' ? 'small' :
                               pet.name === '兔子' || pet.name === '鸟类' ? 'medium' : 'any';
                if (petSize !== 'any' && !userProfile.sizes.includes(petSize)) {
                    score -= 15;
                }
            }

            // Noise penalty for noisy pets in shared living
            if (userProfile.family && userProfile.family.includes('roommate') && traits.noise >= 3) {
                score -= 15;
            }

            return Math.max(0, Math.min(100, Math.round(score)));
        }

        function showResults() {
            // Build user profile from answers
            const userProfile = {
                space: answers.Q1 || 3,
                homeType: answers.Q2 || 'own',
                time: answers.Q3 || 2,
                budget: answers.Q4 || 2,
                family: answers.Q5 || [],
                allergy: answers.Q6 || false,
                activity: answers.Q7 || 2,
                sizes: answers.Q8 || ['any']
            };

            // Calculate matches
            const matches = Object.entries(petProfiles).map(([key, pet]) => ({
                key,
                ...pet,
                score: calculateMatch(userProfile, pet)
            })).sort((a, b) => b.score - a.score);

            const top3 = matches.slice(0, 3);

            // Render results
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = top3.map((pet, idx) => {
                const isTop = idx === 0;
                const matchLabel = pet.score >= 85 ? '完美匹配' : 
                                   pet.score >= 70 ? '高度匹配' : 
                                   pet.score >= 55 ? '适合' : '可考虑';
                
                return `
                <div class="result-card ${isTop ? 'top' : ''}">
                    <div class="result-card-inner">
                        <div class="result-rank">${pet.emoji}</div>
                        <div class="result-info">
                            <div class="result-pet-name">
                                ${pet.name}
                                <span class="match-badge">${pet.score}% 匹配 · ${matchLabel}</span>
                            </div>
                            <div class="result-types">
                                ${pet.types.slice(0, 3).map(t => `<span class="type-tag">${t}</span>`).join('')}
                            </div>
                            <div class="result-details">
                                <div class="detail-item">
                                    <div class="detail-label">空间需求</div>
                                    <div class="detail-value">${'★'.repeat(pet.traits.space)}${'☆'.repeat(5-pet.traits.space)}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">月均花费</div>
                                    <div class="detail-value">${'💰'.repeat(pet.traits.cost)}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">互动需求</div>
                                    <div class="detail-value">${'❤️'.repeat(pet.traits.time)}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="result-analysis">
                        <div class="analysis-title">匹配分析</div>
                        <div class="analysis-list">
                            ${pet.suitable.map(s => `
                                <div class="analysis-item positive">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
                                        <polyline points="22 4 12 14.01 9 11.01"/>
                                    </svg>
                                    <span>适合：${s}</span>
                                </div>
                            `).join('')}
                            ${pet.unsuitable.slice(0, 2).map(u => `
                                <div class="analysis-item warning">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10"/>
                                        <line x1="12" y1="8" x2="12" y2="12"/>
                                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                                    </svg>
                                    <span>注意：${u}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `}).join('');

            showPage('result');
        }

        function shareResult() {
            const text = '我刚用宠配AI测试了我的宠物匹配度，结果是：' + 
                document.querySelector('.result-card.top .result-pet-name').textContent.split(' ')[0] + 
                '！你也来试试吧～';
            
            if (navigator.share) {
                navigator.share({ text });
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    alert('结果已复制到剪贴板！');
                });
            }
        }

        function restartQuiz() {
            startQuiz();
        }

        // Handle hash routing
        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.slice(1);
            if (['home', 'quiz', 'result'].includes(hash)) {
                showPage(hash);
            }
        });

        // Initialize
        showPage('home');
    </script>
</body>
</html>
