<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 图片提示词画廊</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px 40px;
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .page-title {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    padding: 8px 0 4px;
    color: #1d1d1f;
  }

  .page-sub {
    font-size: 13px;
    text-align: center;
    color: #86868b;
    margin-top: -8px;
    padding-bottom: 4px;
  }

  .style-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    color: #007aff;
    background: #e8f0fe;
    border-radius: 6px;
    padding: 2px 10px;
    margin-bottom: 8px;
  }

  .card {
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .card-image {
    width: 100%;
    display: block;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    background: #e8e8ed;
  }

  .card-body {
    padding: 0;
  }

  .card-header {
    padding: 14px 16px 0;
    font-size: 17px;
    font-weight: 600;
    color: #1d1d1f;
  }

  .prompt-area {
    background: #f0f0f5;
    padding: 14px 16px;
    margin: 10px 16px 0;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.7;
    color: #3a3a3c;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .btn-row {
    padding: 10px 16px 14px;
    background: #ffffff;
  }

  .copy-btn {
    width: 100%;
    padding: 10px 0;
    font-size: 15px;
    font-weight: 500;
    color: #007aff;
    background: #f0f0f5;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .copy-btn:active {
    background: #dcdce5;
  }

  .copy-btn.copied {
    background: #34c759;
    color: #ffffff;
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.92);
    z-index: 999;
    justify-content: center;
    align-items: center;
    cursor: zoom-out;
    -webkit-tap-highlight-color: transparent;
  }

  .lightbox.active {
    display: flex;
  }

  .lightbox img {
    max-width: 94%;
    max-height: 94%;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }

  .card-image {
    cursor: zoom-in;
  }
</style>
</head>
<body>

<div class="container">
  <h1 class="page-title">AI 图片提示词画廊</h1>
  <p class="page-sub">点击按钮一键复制提示词 · 点击图片查看大图</p>
</div>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="" alt="大图预览">
</div>

<script>
const galleryData = [
  {
    img: "IMG_3226.jpeg",
    style: "游戏 CG 风格 01",
    prompt: "游戏CG风格，极具艺术感，震撼人心，色彩丰富，暗部叠加，特写镜头，超高清。落叶飞溅，前景落叶虚化，背景动态虚化，阳光灿烂，蓝天白云，光影交错，仰拍特写镜头，突出速度感和视觉冲击力，强透视。"
  },
  {
    img: "IMG_3225.jpeg",
    style: "数字 CG 风格",
    prompt: "数字CG风格，UES渲染，超广角构图，充满神秘感且细节繁复的云雾缭绕，前景柳叶飞溅点缀，动态模糊，天空透过一束光，狂风肆虐，张力十足，恢宏浩荡，极具压迫感的景象，低饱和，强透视，极具视觉冲击力，光影交错，真实光线反射，墨绿灰白色调，白处冷亮锐利，灰处沉郁如墨，东方古风玄幻修仙氛围，8K摄影画质，原比例"
  },
  {
    img: "8065803D-79E7-4E2B-8EB0-27F155537973.jpg",
    style: "飘雪丁达尔效应",
    prompt: "人物美化：保持动作表情不变，提亮肤色衣物，模拟相机闪光灯效果，营造暖柔通透氛围。\n场景转换：将背景变为下雪天，有飘落雪花和积雪，人物面部打光，保留原主体。\n氛围调整：添加丁达尔效应，使用清新胶片滤镜，增加颗粒感与RicohGR3色调，打造森系清透感"
  },
  {
    img: "IMG_3330.jpeg",
    style: "冬天阳光下雪",
    prompt: "模拟冬天真实下雪中的状态，空中飘着雪花。人物衣服，头发，地上沾点小雪(雪不要挡住脸)模拟佳能ccd拍摄质感，p成闪光灯的效果。大疆pocket3风格，照片色彩饱和度高。人物提亮，脸部皮肤白皙。阴天变为天气晴朗，阳光照射，真实光影，曝光准确。强调人物动作姿势，主体大小，人物表情，五官神态，眼睛眼神不变!超高清质感，皮肤质感4K高清。"
  },
  {
    img: "IMG_5602.jpg",
    style: "小红书旅游封面",
    prompt: "参考图1的人物五官特征和体型风格，保持人物一致性，真人半身出镜。表情自信，食指指向画面左上方大字块，人物位于画面中央，占画面约38%，人物边缘有白色描边，形成清晰抠图感。将中文标题\"这条路线绝了\"拆分成3个巨大词块：这条、路线、绝了。词块使用漫画爆款标题字，柔和浅黄色 #FDFFA7 与纯白交替填充，全部加粗黑描边。词块分别放在画面上方（\"这条\"）、左侧（\"路线\"）和右下角（\"绝了\"），围绕人物排布，部分文字被人物身体轻微遮挡，形成前后层次；词块背后的黄色底板统一使用 #FDFFA7。背景是高饱和撞色背景（如黄蓝/蓝紫/黄紫强对比），以参考素材图（图2）作为氛围背景延展，轻微虚化压暗，降低细节，让 #FDFFA7/白色大字成为视觉第一优先级。加入少量手绘箭头、感叹号或旅行相关emoji（🗺️✈️📍），数量控制在3个以内，增加街头感和节奏感。3:4竖版小红书封面，强对比，超大字视觉锤，人物与文字紧密组合但不遮挡眼睛和嘴巴，高点击感，不超出安全区。"
  },
  {
    img: "这个提示词可以把.jpeg",
    style: "涂鸦插画",
    prompt: "把这张照片转成一幅ugly doodle丑萌涂鸦插画。风格要求：像随手乱涂的画作，整体充满滑稽、荒谬与幽默感，网感拉满。画面呈现蜡笔手绘质感，线条歪歪扭扭，抖动不断，刻意夸张扭曲地表现面部特征，但保留原图中人物的样貌轮廓和姿态。笔触要凌乱、粗糙，稚拙，像是儿童视角下的透视关系和非正常比例。在原本场景的基础上，随意添加一些乱画线条以及跟画面相关的手写装饰英文，整体用色不均匀，明显看得出笔触痕迹。禁止：原图直转（必须经过上述处理）"
  },
  {
    img: "fridge-magnet.jpeg.png",
    style: "冰箱贴风封面",
    prompt: "基于我上传的照片，生成竖版3:4极简旅行封面。上方40%纯色标题区：从照片提取主色做背景，中央放一个扁平插画风贴纸图标（白色粗描边、轻微投影），下方一行英文标题［Place Namel一［Season/Year］。下方60%为原照片区，保持真实摄影质感，只做裁切和轻微调色。风格: minimal travel postcard, clean layout, single sticker icon, elegant typography, realistic photo。禁止：手账拼贴、虚线椎、纸张纹理、多个图标、中文大字、水印、logo、乱码。"
  }
];

const container = document.querySelector('.container');

galleryData.forEach((item, index) => {
  const card = document.createElement('div');
  card.className = 'card';

  const img = document.createElement('img');
  img.className = 'card-image';
  if (item.img) {
    img.src = item.img;
    img.alt = item.style;
  } else {
    img.style.display = 'flex';
    img.style.alignItems = 'center';
    img.style.justifyContent = 'center';
    img.style.fontSize = '40px';
    img.style.color = '#c7c7cc';
    img.style.background = '#e8e8ed';
    img.alt = '暂无参考图';
  }
  img.loading = 'lazy';

  const header = document.createElement('div');
  header.className = 'card-header';
  header.textContent = (index + 1) + '. ' + item.style;

  const promptArea = document.createElement('div');
  promptArea.className = 'prompt-area';
  promptArea.textContent = item.prompt;

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';

  const btn = document.createElement('button');
  btn.className = 'copy-btn';
  btn.textContent = '复制提示词';

  btn.addEventListener('click', () => {
    navigator.clipboard.writeText(item.prompt).then(() => {
      btn.textContent = '已复制';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '复制提示词';
        btn.classList.remove('copied');
      }, 1500);
    }).catch(() => {
      const textarea = document.createElement('textarea');
      textarea.value = item.prompt;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      btn.textContent = '已复制';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '复制提示词';
        btn.classList.remove('copied');
      }, 1500);
    });
  });

  btnRow.appendChild(btn);
  card.appendChild(img);
  card.appendChild(header);
  card.appendChild(promptArea);
  card.appendChild(btnRow);
  container.appendChild(card);

  // 点击图片查看大图
  img.addEventListener('click', () => {
    if (item.img) {
      document.getElementById('lightbox-img').src = item.img;
      document.getElementById('lightbox').classList.add('active');
    }
  });
});

// 点击遮罩关闭大图
document.getElementById('lightbox').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('active');
});

// ESC 键关闭大图
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('lightbox').classList.remove('active');
  }
});
</script>

</body>
</html>
