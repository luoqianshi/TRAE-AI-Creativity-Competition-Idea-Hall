<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI健康管家 - 关爱您的每一天</title>
<style>
:root {
  --bg: #f5f0e8;
  --card: #ffffff;
  --primary: #4a90d9;
  --warm: #e8826b;
  --green: #5ba87b;
  --text: #333333;
  --muted: #777777;
  --border: #e0dcd5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  background: var(--bg);
  min-height: 100vh;
  padding: 20px 16px 40px;
  color: var(--text);
}

/* 头部 */
.header {
  text-align: center;
  padding: 28px 0 16px;
}
.avatar { font-size: 60px; margin-bottom: 6px; }
.header h1 { font-size: 28px; font-weight: 700; }
.header p { font-size: 16px; color: var(--muted); margin-top: 4px; }

/* 问候卡片 */
.greet-card {
  background: linear-gradient(135deg, #4a90d9, #3b7dc4);
  color: #fff;
  border-radius: 20px;
  padding: 24px 20px;
  text-align: center;
  font-size: 20px;
  line-height: 1.7;
  margin-bottom: 22px;
  max-width: 520px;
  margin-left: auto; margin-right: auto;
}

/* 功能区块 */
.section { max-width: 520px; margin: 0 auto 18px; }
.section-title {
  font-size: 20px; font-weight: 700;
  margin-bottom: 12px; padding-left: 6px;
}

/* 卡片通用 */
.card {
  background: var(--card);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}

/* 健康小贴士 */
.tip-box { text-align: center; }
.tip-icon { font-size: 44px; margin-bottom: 8px; }
.tip-text { font-size: 18px; line-height: 1.6; font-weight: 500; }
.tip-btn {
  margin-top: 14px;
  background: var(--green);
  color: #fff; border: none;
  padding: 12px 36px; border-radius: 30px;
  font-size: 18px; cursor: pointer;
  display: inline-block;
}
.tip-btn:active { opacity: 0.85; }

/* 用药提醒 */
.med-list { display: flex; flex-direction: column; gap: 12px; }
.med-item {
  display: flex; align-items: center;
  justify-content: space-between;
  background: #f8f6f2; border-radius: 12px; padding: 16px 14px;
}
.med-info { font-size: 18px; }
.med-info .name { font-weight: 700; }
.med-info .time { color: var(--muted); font-size: 15px; display: block; margin-top: 2px; }
.med-status {
  padding: 8px 18px; border-radius: 22px;
  font-size: 16px; border: none; cursor: pointer;
  font-weight: 600; min-width: 64px; text-align: center;
}
.med-status.done { background: #e0f0e4; color: var(--green); }
.med-status.todo { background: #fff3e0; color: var(--warm); }
.med-status:active { transform: scale(0.96); }

/* 症状问答区 */
.chat-area { max-height: 260px; overflow-y: auto; margin-bottom: 14px; padding-right: 4px; }
.msg { margin-bottom: 12px; display: flex; flex-direction: column; }
.msg.user { align-items: flex-end; }
.msg.ai   { align-items: flex-start; }
.msg-bubble {
  max-width: 85%; padding: 12px 16px; border-radius: 16px;
  font-size: 17px; line-height: 1.5;
}
.msg.user .msg-bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
.msg.ai   .msg-bubble { background: #f0ede6; color: var(--text); border-bottom-left-radius: 4px; }

.input-row { display: flex; gap: 10px; }
.input-row input {
  flex: 1; font-size: 18px; padding: 12px 16px;
  border: 2px solid var(--border); border-radius: 30px;
  outline: none; transition: border .2s;
}
.input-row input:focus { border-color: var(--primary); }
.input-row button {
  white-space: nowrap; padding: 12px 22px;
  background: var(--warm); color: #fff; border: none;
  border-radius: 30px; font-size: 18px; cursor: pointer; font-weight: 600;
}
.input-row button:active { opacity: 0.85; }

/* 大按钮 */
.big-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.big-btn {
  background: var(--card); border: 2px solid var(--border);
  border-radius: 16px; padding: 18px 12px;
  text-align: center; cursor: pointer; font-size: 18px;
  transition: border .2s;
}
.big-btn:active { border-color: var(--primary); transform: scale(0.97); }
.big-btn .icon { font-size: 36px; display: block; margin-bottom: 6px; }

@media (max-width: 400px) {
  .header h1 { font-size: 24px; }
  .greet-card { font-size: 18px; padding: 20px 16px; }
}
</style>
</head>
<body>

<!-- 头部 -->
<div class="header">
  <div class="avatar">🧑‍⚕️</div>
  <h1>AI 健康管家</h1>
  <p>关爱您的每一天</p>
</div>

<!-- 问候 -->
<div class="greet-card" id="greeting">早上好！今天感觉怎么样？</div>

<!-- 健康小贴士 -->
<div class="section">
  <div class="section-title">🌿 今日健康小贴士</div>
  <div class="card tip-box">
    <div class="tip-icon" id="tipIcon">💧</div>
    <div class="tip-text" id="tipText">每天喝够 6-8 杯水，少量多次，对身体更好哦！</div>
    <button class="tip-btn" onclick="nextTip()">换一条建议</button>
  </div>
</div>

<!-- 用药提醒 -->
<div class="section">
  <div class="section-title">💊 用药提醒</div>
  <div class="card">
    <div class="med-list" id="medList"></div>
  </div>
</div>

<!-- 症状问答 -->
<div class="section">
  <div class="section-title">🩺 症状小助手</div>
  <div class="card">
    <div class="chat-area" id="chatArea">
      <div class="msg ai">
        <div class="msg-bubble">您好！我是健康小助手。您可以告诉我哪里不舒服，我帮您分析一下。⚠ 紧急情况请及时就医。</div>
      </div>
    </div>
    <div class="input-row">
      <input type="text" id="userInput" placeholder="比如：最近总是头晕怎么办？" onkeydown="if(event.key==='Enter')askAI()">
      <button onclick="askAI()">发送</button>
    </div>
  </div>
</div>

<!-- 快捷功能 -->
<div class="section">
  <div class="section-title">📋 常用功能</div>
  <div class="big-btns">
    <div class="big-btn" onclick="quickCheck('血压偏高')">
      <span class="icon">🩸</span>血压自测
    </div>
    <div class="big-btn" onclick="quickCheck('血糖偏高')">
      <span class="icon">🍬</span>血糖自测
    </div>
    <div class="big-btn" onclick="quickCheck('失眠多梦')">
      <span class="icon">😴</span>睡眠评估
    </div>
    <div class="big-btn" onclick="quickCheck('关节疼痛')">
      <span class="icon">🦴</span>关节养护
    </div>
  </div>
</div>

<script>
// ===== 问候语 =====
const greetings = {
  early: '早上好！🌅 新的一天，记得先喝杯温水哦。',
  morning: '上午好！☀️ 天气不错，可以出去散散步。',
  noon: '中午好！🍚 按时吃午饭，营养均衡很重要。',
  afternoon: '下午好！🍵 休息一下，喝杯茶放松放松。',
  evening: '晚上好！🌙 泡泡脚，看看喜欢的节目吧。',
};
function setGreeting() {
  const h = new Date().getHours();
  let key;
  if (h < 8) key = 'early';
  else if (h < 11) key = 'morning';
  else if (h < 13) key = 'noon';
  else if (h < 17) key = 'afternoon';
  else key = 'evening';
  document.getElementById('greeting').textContent = greetings[key];
}
setGreeting();

// ===== 健康小贴士 =====
const tips = [
  { icon: '💧', text: '每天喝够 6-8 杯水，少量多次，对身体更好哦！' },
  { icon: '🚶', text: '每天散步 30 分钟，有助于控制血压和血糖。' },
  { icon: '🥬', text: '多吃蔬菜水果，少吃油腻和过咸的食物。' },
  { icon: '😴', text: '保持规律作息，每天睡足 7-8 小时。' },
  { icon: '🧘', text: '可以试试太极拳或八段锦，动作柔和又能锻炼身体。' },
  { icon: '💊', text: '慢性病药物要按时服用，不要自行停药或调整剂量。' },
  { icon: '📋', text: '每年至少做一次体检，早发现早预防。' },
  { icon: '👫', text: '多和家人朋友聊聊天，保持心情愉快很重要！' },
  { icon: '🧂', text: '每天吃盐不超过 5 克，相当于一个啤酒瓶盖的量。' },
  { icon: '🌞', text: '上午 10 点前晒晒太阳，有助于补钙和改善睡眠。' },
];
let tipIdx = 0;
function nextTip() {
  tipIdx = (tipIdx + 1) % tips.length;
  const t = tips[tipIdx];
  document.getElementById('tipIcon').textContent = t.icon;
  document.getElementById('tipText').textContent = t.text;
}

// ===== 用药提醒 =====
const meds = [
  { name: '降压药（硝苯地平）', time: '每天早上 8:00 · 1片', done: false },
  { name: '钙片 + 维生素D', time: '每天中午饭后 · 1片', done: false },
  { name: '降糖药（二甲双胍）', time: '每天晚饭后 · 1片', done: false },
];
function renderMeds() {
  const el = document.getElementById('medList');
  el.innerHTML = meds.map((m, i) => `
    <div class="med-item">
      <div class="med-info">
        <span class="name">${m.name}</span>
        <span class="time">${m.time}</span>
      </div>
      <button class="med-status ${m.done ? 'done' : 'todo'}" onclick="toggleMed(${i})">
        ${m.done ? '✓ 已服' : '⏰ 待服'}
      </button>
    </div>
  `).join('');
}
function toggleMed(i) {
  meds[i].done = !meds[i].done;
  renderMeds();
}
renderMeds();

// ===== 症状问答 =====
const symptomDB = {
  '头晕': '头晕可能由血压波动、贫血、颈椎问题或休息不足引起。建议先测量血压，注意休息。如果持续头晕或伴有呕吐、视物模糊，请及时就医。',
  '头痛': '头痛常见原因包括紧张、血压升高、睡眠不足。建议在安静环境休息，避免强光刺激。如果是剧烈头痛或反复发作，建议去医院检查。',
  '失眠': '可以尝试睡前泡脚、听轻音乐、避免看手机。每天固定时间睡觉和起床很有效。如果长期失眠，建议咨询医生，不要自行服用安眠药。',
  '关节痛': '天冷注意保暖，适当活动关节但不要过度。热敷可以缓解疼痛。如果红肿热痛明显，可能是关节炎，建议去骨科或风湿科看看。',
  '血压': '血压偏高要注意：1. 低盐饮食（每天 < 5g）；2. 规律服药，不可停药；3. 每天定时测量并记录；4. 保持情绪平稳。血压 > 180/110 请立即就医！',
  '血糖': '血糖控制要点：1. 定时定量吃饭；2. 少吃米面，多吃粗粮蔬菜；3. 饭后散步 20 分钟；4. 按医嘱用药，定期测血糖。出现心慌、出冷汗可能是低血糖，立即吃点糖！',
  '胸闷': '胸闷需要高度重视！可能是心脏问题，也可能是胃食管反流或焦虑。建议：立即休息，如果伴有出汗、左臂放射痛，请马上拨打 120！不要自行忍耐。',
  '腰疼': '腰疼常见于腰肌劳损、腰椎间盘突出。注意不要久坐久站，床垫不要太软。可以热敷缓解。如果伴有腿麻，建议拍片检查。',
  '胃疼': '胃疼注意饮食规律，少吃辛辣生冷。饿的时候疼可能是十二指肠溃疡，饭后疼可能是胃溃疡。如果黑便或呕吐咖啡色物，需立即就医。',
  '便秘': '多吃粗纤维食物（芹菜、红薯、燕麦），多喝水，养成定时排便习惯。每天顺时针按摩肚子 10 分钟也有帮助。不要长期靠泻药。',
  '咳嗽': '咳嗽超过 2 周建议就医。多喝温水，避免冷空气刺激。夜间咳嗽加重可能是哮喘或胃食管反流。如有发热、黄痰，可能合并感染。',
  '视力': '视力模糊可能和糖尿病、白内障、黄斑病变有关。建议定期做眼科检查，不要在昏暗光线下看书看手机。多吃胡萝卜、蓝莓等护眼食物。',
};

function askAI(query) {
  const input = document.getElementById('userInput');
  const q = (query || input.value).trim();
  if (!q) return;
  addMsg('user', q);
  input.value = '';

  // 模拟 AI 延迟
  setTimeout(() => {
    let answer = '';
    let matched = false;
    for (const [key, val] of Object.entries(symptomDB)) {
      if (q.includes(key)) {
        answer = val;
        matched = true;
        break;
      }
    }
    if (!matched) {
      answer = '感谢您的描述。虽然我不能替代医生诊断，但建议您：1. 注意休息，观察症状变化；2. 清淡饮食，多喝温水；3. 如果症状持续或加重，请去医院就诊。您也可以点击下方快捷按钮选择常见问题。';
    }
    addMsg('ai', answer);
  }, 800);
}

function quickCheck(symptom) {
  askAI(symptom);
}

function addMsg(role, text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="msg-bubble">${text}</div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}
</script>

</body>
</html>
