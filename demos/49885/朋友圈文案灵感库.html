<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>朋友圈文案灵感库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    background: linear-gradient(180deg, #fff0f5 0%, #ffffff 30%);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    color: #1a1a2e;
  }
  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    padding-bottom: 80px;
  }

  /* Header */
  .header {
    padding: 18px 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-back {
    width: 38px; height: 38px;
    background: rgba(0,0,0,0.04);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    cursor: pointer;
  }
  .header-title {
    font-size: 20px;
    font-weight: 800;
  }
  .header-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #ff6b9c, #ff8fab);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    color: #fff;
  }

  /* Input Section */
  .input-section {
    padding: 16px 20px;
  }
  .input-card {
    background: #fff;
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.04);
  }
  .input-label {
    font-size: 14px;
    font-weight: 600;
    color: #6b7280;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .input-box {
    width: 100%;
    background: #f9fafb;
    border: 1.5px solid rgba(0,0,0,0.06);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 15px;
    color: #1a1a2e;
    outline: none;
    resize: none;
    font-family: inherit;
    margin-bottom: 14px;
  }
  .input-box:focus { border-color: #ff6b9c; }
  .input-box::placeholder { color: #9ca3af; }

  /* Style Tags */
  .style-label {
    font-size: 13px;
    font-weight: 600;
    color: #6b7280;
    margin-bottom: 10px;
  }
  .style-tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .style-tag {
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all 0.2s;
    background: #f3f4f6;
    color: #6b7280;
  }
  .style-tag.active {
    border-color: currentColor;
    background: rgba(255,255,255,0.8);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .style-tag.literary { color: #10b981; }
  .style-tag.funny { color: #f59e0b; }
  .style-tag.cool { color: #3b82f6; }
  .style-tag.emo { color: #8b5cf6; }
  .style-tag.inspire { color: #f97316; }
  .style-tag.sarcastic { color: #ef4444; }

  .generate-btn {
    width: 100%;
    background: linear-gradient(90deg, #ff6b9c, #ff8fab);
    color: #fff;
    border: none;
    padding: 15px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 16px rgba(255,107,156,0.3);
  }
  .generate-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* Results */
  .results-section {
    padding: 0 20px;
    display: none;
  }
  .results-section.active { display: block; animation: fade-in 0.5s ease; }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .results-title {
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .results-count {
    font-size: 12px;
    color: #6b7280;
    background: #f3f4f6;
    padding: 4px 10px;
    border-radius: 12px;
  }

  .copy-card {
    background: #fff;
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    position: relative;
    animation: slide-up 0.4s ease;
    cursor: pointer;
    transition: all 0.2s;
  }
  .copy-card:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    transform: translateY(-2px);
  }
  @keyframes slide-up {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .copy-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .copy-style-tag {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 10px;
    font-weight: 600;
  }
  .copy-style-tag.literary { background: rgba(16,185,129,0.1); color: #059669; }
  .copy-style-tag.funny { background: rgba(245,158,11,0.1); color: #d97706; }
  .copy-style-tag.cool { background: rgba(59,130,246,0.1); color: #2563eb; }
  .copy-style-tag.emo { background: rgba(139,92,246,0.1); color: #7c3aed; }
  .copy-style-tag.inspire { background: rgba(249,115,22,0.1); color: #ea580c; }
  .copy-style-tag.sarcastic { background: rgba(239,68,68,0.1); color: #dc2626; }

  .copy-actions {
    display: flex;
    gap: 8px;
  }
  .copy-action {
    width: 28px; height: 28px;
    background: rgba(0,0,0,0.04);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    cursor: pointer;
    border: none;
    color: #6b7280;
    transition: all 0.2s;
  }
  .copy-action:hover { background: rgba(255,107,156,0.1); color: #ff6b9c; }
  .copy-action.liked { color: #ff6b9c; background: rgba(255,107,156,0.1); }

  .copy-text {
    font-size: 14px;
    line-height: 1.7;
    color: #374151;
  }
  .copy-hint {
    position: absolute;
    top: 8px;
    right: 12px;
    font-size: 11px;
    color: #ff6b9c;
    background: rgba(255,107,156,0.1);
    padding: 3px 10px;
    border-radius: 10px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .copy-card.copied .copy-hint { opacity: 1; }

  /* Loading */
  .loading-section {
    padding: 40px 20px;
    text-align: center;
    display: none;
  }
  .loading-section.active { display: block; }
  .loading-icon {
    font-size: 40px;
    margin-bottom: 16px;
    animation: sparkle 1.5s ease-in-out infinite;
  }
  @keyframes sparkle {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.2) rotate(10deg); }
  }
  .loading-text {
    font-size: 15px;
    font-weight: 600;
    color: #6b7280;
    margin-bottom: 8px;
  }
  .loading-sub {
    font-size: 13px;
    color: #9ca3af;
  }

  /* Quick Scenes */
  .quick-section {
    padding: 0 20px 16px;
  }
  .quick-title {
    font-size: 14px;
    font-weight: 600;
    color: #6b7280;
    margin-bottom: 10px;
  }
  .quick-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .quick-chip {
    padding: 8px 14px;
    background: #fff;
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 20px;
    font-size: 13px;
    color: #4b5563;
    cursor: pointer;
    transition: all 0.2s;
  }
  .quick-chip:hover {
    border-color: #ff6b9c;
    color: #ff6b9c;
    box-shadow: 0 2px 8px rgba(255,107,156,0.1);
  }

  /* Bottom Nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(0,0,0,0.06);
    padding: 10px 0 20px;
    display: flex;
    justify-content: space-around;
    z-index: 100;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 4px 12px;
  }
  .nav-icon {
    font-size: 22px;
    opacity: 0.5;
    transition: opacity 0.2s;
  }
  .nav-item.active .nav-icon { opacity: 1; }
  .nav-label {
    font-size: 11px;
    color: #9ca3af;
    font-weight: 500;
  }
  .nav-item.active .nav-label { color: #ff6b9c; font-weight: 700; }

  /* Toast */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    z-index: 200;
    transition: transform 0.3s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-left">
      <div class="header-back">←</div>
      <div class="header-title">文案灵感库</div>
    </div>
    <div class="header-icon">✨</div>
  </div>

  <div class="input-section">
    <div class="input-card">
      <div class="input-label">📝 描述你的心情或场景</div>
      <textarea class="input-box" rows="3" placeholder="比如：今天加班到很晚、去了海边、和闺蜜下午茶..." id="sceneInput"></textarea>

      <div class="style-label">🎨 选择文案风格（可多选）</div>
      <div class="style-tags">
        <div class="style-tag literary active" data-style="literary">🌿 文艺清新</div>
        <div class="style-tag funny active" data-style="funny">😂 沙雕搞笑</div>
        <div class="style-tag cool active" data-style="cool">🧊 高冷极简</div>
        <div class="style-tag emo" data-style="emo">🌧️ emo伤感</div>
        <div class="style-tag inspire" data-style="inspire">🔥 励志正能量</div>
        <div class="style-tag sarcastic" data-style="sarcastic">🌶️ 毒舌吐槽</div>
      </div>

      <button class="generate-btn" id="generateBtn">✨ AI 生成文案</button>
    </div>
  </div>

  <div class="quick-section">
    <div class="quick-title">⚡ 快捷场景</div>
    <div class="quick-chips">
      <div class="quick-chip" data-text="今天加班到很晚">今天加班到很晚</div>
      <div class="quick-chip" data-text="去了海边">去了海边</div>
      <div class="quick-chip" data-text="和闺蜜下午茶">和闺蜜下午茶</div>
      <div class="quick-chip" data-text="周末宅家">周末宅家</div>
      <div class="quick-chip" data-text="下雨了">下雨了</div>
      <div class="quick-chip" data-text="吃到了好吃的">吃到了好吃的</div>
    </div>
  </div>

  <div class="loading-section" id="loadingSection">
    <div class="loading-icon">✨</div>
    <div class="loading-text">AI 正在灵感爆发中...</div>
    <div class="loading-sub">已为你匹配 6 种风格 × 3 条文案</div>
  </div>

  <div class="results-section" id="resultsSection">
    <div class="results-header">
      <div class="results-title">
        💡 灵感文案
      </div>
      <div class="results-count">共 18 条</div>
    </div>

    <div id="resultsList">
      <!-- Generated by JS -->
    </div>
  </div>

  <div style="height: 80px;"></div>

  <div class="bottom-nav">
    <div class="nav-item active">
      <span class="nav-icon">✨</span>
      <span class="nav-label">生成</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">📚</span>
      <span class="nav-label">收藏</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">🔥</span>
      <span class="nav-label">热门</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">👤</span>
      <span class="nav-label">我的</span>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
  const sceneInput = document.getElementById('sceneInput');
  const generateBtn = document.getElementById('generateBtn');
  const loadingSection = document.getElementById('loadingSection');
  const resultsSection = document.getElementById('resultsSection');
  const resultsList = document.getElementById('resultsList');

  const templates = {
    '今天加班到很晚': {
      literary: ['城市的灯火为我留了一盏，而我为它留了一个背影。', '深夜的写字楼里，我和月光一起下班。', '当最后一班地铁驶过，才想起今天忘了看夕阳。'],
      funny: ['我和公司的灯，总有一个要先灭。', '加班到很晚，发现老板早已回家。', '今天的工作效率：白天摸鱼，晚上加班。'],
      cool: ['时间到了，该走了。', '下班。', '又一天。'],
      emo: ['又是一个人的深夜，连月亮都睡了。', '凌晨的街道很空，像我的心。', '加班到深夜，才发现自己连个说晚安的人都没有。'],
      inspire: ['每一盏深夜的灯，都在为明天铺路。', '努力的意义，就是将来不后悔现在的自己。', '凌晨的汗水，会变成未来的光芒。'],
      sarcastic: ['公司的电费有我一份功劳。', '加班到凌晨，发现老板早已回家。', '工资没涨，加班时长倒是翻倍了。']
    },
    '去了海边': {
      literary: ['海风吹走了所有烦恼，只留下满心的辽阔。', '面朝大海，春暖花开，原来是真的。', '海浪一次次拍打着岸边，像在重复说着永远。'],
      funny: ['大海啊，全是水；沙滩啊，全是腿。', '来海边了，防晒涂了三层还是黑了。', '海边拍照两小时，P图三小时。'],
      cool: ['海。', '风很大。', '浪不错。'],
      emo: ['海的那边是什么，已经不重要了。', '一个人看海，海也一个人看我。', '海浪带走了一切，却带不走心事。'],
      inspire: ['像海一样辽阔，像浪一样勇敢。', '每一次潮起潮落，都是新的开始。', '站在海边，才发现烦恼有多渺小。'],
      sarcastic: ['来海边了，人比沙子还多。', '海边的太阳：我让你黑你就得黑。', '看完海回来，钱包和肤色一起空了。']
    },
    '和闺蜜下午茶': {
      literary: ['时光在变，但有人陪你喝茶的日子永远温柔。', '最好的关系，是久处不厌，是下午茶里的细水长流。', '一杯茶的温度，刚好是友谊的温度。'],
      funny: ['和闺蜜的下午茶：聊别人的八卦，吃自己的蛋糕。', '两个女人的下午茶，能聊完半个娱乐圈。', '闺蜜见面三件套：拍照、吐槽、吃。'],
      cool: ['茶不错。', '人到了。', '还行。'],
      emo: ['曾经天天见的人，现在约一次要提前一个月。', '下午茶很甜，但想到分开就很难过。', '时间带走了青春，幸好没带走你。'],
      inspire: ['有朋友在的地方，就是最好的风景。', '友情和茶一样，越久越香。', '生活需要这样的下午，不慌不忙，有朋友在旁。'],
      sarcastic: ['和闺蜜下午茶，主要活动是互相P图。', '聊了一下午，谁也没提自己的烦心事。', '两个人的下午茶，四个人的八卦。']
    }
  };

  const defaultTemplates = {
    literary: ['生活明朗，万物可爱，人间值得，未来可期。', '把今天过成诗，不为取悦谁，只为不辜负自己。', '微风轻拂，阳光正好，一切都是最好的安排。'],
    funny: ['今天的心情：不想说话，只想搞笑。', '人生苦短，再来一碗。', '我的日常：间歇性奋发图强，持续性混吃等死。'],
    cool: ['随便。', '就这样。', '没什么好说的。'],
    emo: ['有时候， silence 比 words 更有力量。', '月亮不睡我不睡，我是人间小宝贝。', '窗外的雨，像极了此刻的心情。'],
    inspire: ['每一天都是新的开始，别辜负晨光。', '努力不是为了感动谁，而是让自己有选择的权利。', '星光不问赶路人，时光不负有心人。'],
    sarcastic: ['生活不易，全靠演技。', '成年人的世界：白天笑嘻嘻，晚上emo。', '这个世界很公平，你想得到什么，就要失去什么——比如头发。']
  };

  const styleLabels = {
    literary: '🌿 文艺清新',
    funny: '😂 沙雕搞笑',
    cool: '🧊 高冷极简',
    emo: '🌧️ emo伤感',
    inspire: '🔥 励志正能量',
    sarcastic: '🌶️ 毒舌吐槽'
  };

  document.querySelectorAll('.style-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      tag.classList.toggle('active');
    });
  });

  document.querySelectorAll('.quick-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      sceneInput.value = chip.dataset.text;
    });
  });

  generateBtn.addEventListener('click', () => {
    const scene = sceneInput.value.trim();
    if (!scene) {
      showToast('✏️ 请先描述你的场景');
      return;
    }

    const activeStyles = Array.from(document.querySelectorAll('.style-tag.active')).map(t => t.dataset.style);
    if (activeStyles.length === 0) {
      showToast('🎨 请至少选择一种风格');
      return;
    }

    loadingSection.classList.add('active');
    resultsSection.classList.remove('active');
    generateBtn.disabled = true;

    setTimeout(() => {
      loadingSection.classList.remove('active');
      resultsSection.classList.add('active');
      generateBtn.disabled = false;

      const data = templates[scene] || defaultTemplates;
      resultsList.innerHTML = '';
      let count = 0;

      activeStyles.forEach(style => {
        const texts = data[style] || defaultTemplates[style];
        texts.forEach((text, i) => {
          count++;
          const card = document.createElement('div');
          card.className = 'copy-card';
          card.style.animationDelay = (count * 0.05) + 's';
          card.innerHTML = `
            <div class="copy-card-header">
              <span class="copy-style-tag ${style}">${styleLabels[style]}</span>
              <div class="copy-actions">
                <button class="copy-action like-btn">♥</button>
                <button class="copy-action">📋</button>
              </div>
            </div>
            <div class="copy-text">${text}</div>
            <div class="copy-hint">✓ 已复制</div>
          `;

          card.addEventListener('click', () => {
            card.classList.add('copied');
            showToast('✓ 文案已复制');
            setTimeout(() => card.classList.remove('copied'), 1500);
          });

          card.querySelector('.like-btn').addEventListener('click', e => {
            e.stopPropagation();
            e.target.classList.toggle('liked');
          });

          resultsList.appendChild(card);
        });
      });

      document.querySelector('.results-count').textContent = `共 ${count} 条`;
    }, 1500);
  });

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
