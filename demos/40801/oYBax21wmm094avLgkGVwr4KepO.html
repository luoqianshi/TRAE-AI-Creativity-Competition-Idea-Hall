<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI心灵对话舱 - 创意提案</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030014;
            --surface: #0f0a1e;
            --surface2: #1a1230;
            --primary: #818cf8;
            --primary-glow: #6366f1;
            --secondary: #22d3ee;
            --accent: #f472b6;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 50%, var(--accent) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 3D Canvas Background */
        #canvas3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Main Container */
        .main {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header - Minimal */
        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 600;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .badge {
            font-size: 0.75rem;
            padding: 0.4rem 1rem;
            border: 1px solid rgba(129, 140, 248, 0.3);
            border-radius: 9999px;
            color: var(--primary);
            backdrop-filter: blur(10px);
        }

        /* Hero - Ultra Minimal */
        .hero {
            text-align: center;
            padding: 4rem 2rem 2rem;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
        }

        .hero h1 span {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            color: var(--text-dim);
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* Chat Interface - The Star */
        .chat-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 580px;
            background: rgba(15, 10, 30, 0.6);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(129, 140, 248, 0.15);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Neon Glow Effect */
        .chat-container::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: var(--gradient);
            border-radius: 26px;
            z-index: -1;
            opacity: 0.15;
            filter: blur(20px);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 0.25; transform: scale(1.02); }
        }

        /* Chat Header */
        .chat-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(129, 140, 248, 0.1);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .ai-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.5);
        }

        .ai-info h3 {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .ai-info p {
            font-size: 0.75rem;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--secondary);
            border-radius: 50%;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: rgba(129, 140, 248, 0.3);
            border-radius: 2px;
        }

        .message {
            max-width: 85%;
            padding: 1rem 1.25rem;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.6;
            animation: messageIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.ai {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(34, 211, 238, 0.15) 100%);
            border: 1px solid rgba(129, 140, 248, 0.2);
            border-bottom-left-radius: 6px;
            align-self: flex-start;
        }

        .message.user {
            background: rgba(244, 114, 182, 0.15);
            border: 1px solid rgba(244, 114, 182, 0.2);
            border-bottom-right-radius: 6px;
            align-self: flex-end;
        }

        .sender {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-bottom: 0.3rem;
            opacity: 0.7;
        }

        /* Emotion Indicator */
        .emotion-bar {
            display: flex;
            gap: 3px;
            margin-top: 0.75rem;
        }

        .emotion-pip {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .emotion-pip.active {
            background: var(--secondary);
            box-shadow: 0 0 8px var(--secondary);
        }

        /* Quick Actions */
        .quick-actions {
            padding: 1rem 1.5rem;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            border-top: 1px solid rgba(129, 140, 248, 0.1);
        }

        .quick-btn {
            padding: 0.6rem 1.2rem;
            background: rgba(129, 140, 248, 0.1);
            border: 1px solid rgba(129, 140, 248, 0.2);
            border-radius: 9999px;
            color: var(--text);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .quick-btn:hover {
            background: rgba(129, 140, 248, 0.25);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }

        .quick-btn:active {
            transform: scale(0.97);
        }

        /* Typing Indicator */
        .typing {
            display: flex;
            gap: 4px;
            padding: 1rem 1.25rem;
            align-items: center;
        }

        .typing span {
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            animation: typing 1.4s ease-in-out infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* Feature Pills - Minimal */
        .features {
            padding: 2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .feature-pill {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            color: var(--text-dim);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .feature-pill:hover {
            color: var(--text);
            border-color: rgba(129, 140, 248, 0.3);
        }

        .feature-pill span {
            font-size: 1rem;
        }

        /* Responsive */
        @media (max-width: 640px) {
            header { padding: 1rem; }
            .hero { padding: 2rem 1rem 1rem; }
            .chat-wrapper { padding: 1rem; }
            .chat-container { height: 500px; }
            .quick-actions { gap: 0.5rem; }
            .quick-btn { padding: 0.5rem 1rem; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <canvas id="canvas3d"></canvas>

    <div class="main">
        <header>
            <div class="logo">AI心灵对话舱</div>
            <div class="badge">✨ TRAE大赛参赛作品</div>
        </header>

        <section class="hero">
            <h1>你的<span>专属</span>情绪伙伴</h1>
            <p>基于大语言模型的情感陪伴系统</p>
        </section>

        <div class="chat-wrapper">
            <div class="chat-container">
                <div class="chat-header">
                    <div class="ai-avatar">🧠</div>
                    <div class="ai-info">
                        <h3>AI心灵对话舱</h3>
                        <p><span class="status-dot"></span> 在线 · 随时倾诉</p>
                    </div>
                </div>

                <div class="messages" id="messages">
                    <div class="message ai">
                        <div class="sender">AI心灵对话舱</div>
                        你好呀 🌟 欢迎来到心灵对话舱。今天过得怎么样？有什么想聊聊的吗？
                        <div class="emotion-bar">
                            <span class="emotion-pip active"></span>
                            <span class="emotion-pip active"></span>
                            <span class="emotion-pip"></span>
                            <span class="emotion-pip"></span>
                            <span class="emotion-pip"></span>
                        </div>
                    </div>
                </div>

                <div class="quick-actions">
                    <button class="quick-btn" onclick="sendMsg('今天工作压力好大...')">💼 工作压力</button>
                    <button class="quick-btn" onclick="sendMsg('和家人吵架了，心情很低落')">💔 家庭矛盾</button>
                    <button class="quick-btn" onclick="sendMsg('最近总觉得很迷茫')">🌫️ 感到迷茫</button>
                    <button class="quick-btn" onclick="sendMsg('睡不好，焦虑')">😴 睡眠问题</button>
                </div>
            </div>
        </div>

        <div class="features">
            <div class="feature-pill"><span>🧠</span> 智能共情</div>
            <div class="feature-pill"><span>🔒</span> 隐私保护</div>
            <div class="feature-pill"><span>⏱️</span> 24/7在线</div>
            <div class="feature-pill"><span>💚</span> 零门槛关怀</div>
        </div>
    </div>

    <script>
        // ============ 3D Particle System ============
        const canvas = document.getElementById('canvas3d');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        const particleCount = 80;
        let mouseX = 0, mouseY = 0;
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width - width / 2;
                this.y = Math.random() * height - height / 2;
                this.z = Math.random() * 1000;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.speedZ = (Math.random() - 0.5) * 0.5;
                
                // Color variation
                const colors = [
                    '129, 140, 248',   // Indigo
                    '34, 211, 238',    // Cyan
                    '244, 114, 182',   // Pink
                    '167, 139, 250',   // Violet
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = Math.random() * 0.5 + 0.2;
            }

            update() {
                // Mouse influence
                const dx = mouseX - width / 2 - this.x;
                const dy = mouseY - height / 2 - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 200) {
                    const force = (200 - dist) / 200 * 0.02;
                    this.x -= dx * force;
                    this.y -= dy * force;
                }

                // Rotation effect
                const angle = time * 0.0003;
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                const x = this.x * cos - this.y * sin;
                const y = this.y * cos + this.x * sin;
                
                this.x = x + this.speedX;
                this.y = y + this.speedY;
                this.z += this.speedZ;

                if (this.z > 1000 || this.z < 1) {
                    this.speedZ *= -1;
                }

                // Boundary wrap
                if (this.x > width) this.x = -width;
                if (this.x < -width) this.x = width;
                if (this.y > height) this.y = -height;
                if (this.y < -height) this.y = height;
            }

            draw() {
                const scale = 500 / (this.z + 500);
                const x2d = this.x * scale + width / 2;
                const y2d = this.y * scale + height / 2;
                const size = this.size * scale;

                ctx.beginPath();
                ctx.arc(x2d, y2d, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha * scale})`;
                ctx.fill();

                // Glow effect
                if (scale > 0.3) {
                    ctx.beginPath();
                    ctx.arc(x2d, y2d, size * 3, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${this.color}, ${this.alpha * scale * 0.2})`;
                    ctx.fill();
                }
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                const p1 = particles[i];
                const scale1 = 500 / (p1.z + 500);
                const x1 = p1.x * scale1 + width / 2;
                const y1 = p1.y * scale1 + height / 2;

                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const scale2 = 500 / (p2.z + 500);
                    const x2 = p2.x * scale2 + width / 2;
                    const y2 = p2.y * scale2 + height / 2;

                    const dist = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);

                    if (dist < 150) {
                        const opacity = (1 - dist / 150) * 0.15;
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.strokeStyle = `rgba(129, 140, 248, ${opacity})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(3, 0, 20, 0.1)';
            ctx.fillRect(0, 0, width, height);

            drawConnections();

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            time++;
            requestAnimationFrame(animate);
        }

        // Mouse tracking
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('resize', resize);

        // Initialize
        resize();
        initParticles();
        animate();

        // ============ Chat Functionality ============
        const messagesContainer = document.getElementById('messages');

        const responses = {
            '工作': `我能理解你现在的感受 😔 职场压力确实很常见。

你愿意说说是什么让你感到压力最大吗？是工作量、人际关系，还是对未来的不确定感？

记住，能够意识到自己的压力并寻求支持，这本身就是一个很棒的开始 💪`,

            '吵架': `听起来这次冲突让你很难受 💔 家人的事情往往最让我们牵肠挂肚...

你现在感觉怎么样？有没有机会等双方都冷静下来后，好好沟通一下？

有时候表达感受比争论对错更重要 🤗`,

            '迷茫': `感到迷茫说明你在认真思考自己的未来 🌱 这本身就很勇敢。

也许可以试着问自己几个问题：
• 你最近做什么事情时会感到快乐或充实？
• 有什么是你一直想做但还没尝试的？

迷茫不是终点，而是探索的起点 ✨`,

            '睡不好': `睡眠问题真的很让人困扰 😴 

最近是不是有什么心事让你辗转难眠？还是作息不太规律？

我可以分享一些放松技巧，或者我们聊聊是什么让你感到焦虑？有时候把心里的事说出来会好很多 🌙`
        };

        const defaultResponses = [
            "这是一个很好的问题，让我和你一起想想...",
            "我理解你的感受，继续说吧，我在听...",
            "谢谢你愿意分享这些 💚 你的感受很重要。",
            "这些都是很真实的困扰，我们一起面对。"
        ];

        function addMessage(text, isUser = false) {
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'user' : 'ai'}`;
            msg.innerHTML = `
                <div class="sender">${isUser ? '你' : 'AI心灵对话舱'}</div>
                ${text.replace(/\n/g, '<br>')}
                ${!isUser ? `
                <div class="emotion-bar">
                    <span class="emotion-pip active"></span>
                    <span class="emotion-pip active"></span>
                    <span class="emotion-pip"></span>
                    <span class="emotion-pip"></span>
                    <span class="emotion-pip"></span>
                </div>
                ` : ''}
            `;
            messagesContainer.appendChild(msg);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTyping() {
            const typing = document.createElement('div');
            typing.className = 'typing';
            typing.id = 'typing';
            typing.innerHTML = '<span></span><span></span><span></span>';
            messagesContainer.appendChild(typing);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        function sendMsg(text) {
            addMessage(text, true);

            showTyping();

            setTimeout(() => {
                hideTyping();

                let response = '';
                for (const key in responses) {
                    if (text.includes(key)) {
                        response = responses[key];
                        break;
                    }
                }
                if (!response) {
                    response = defaultResponses[Math.floor(Math.random() * defaultResponses.length)];
                }

                addMessage(response);
            }, 1200);
        }
    </script>
</body>
</html>
