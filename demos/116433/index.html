<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>进化模拟器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary-color: #0d9488;
      --secondary-color: #0891b2;
      --accent-color: #39ff14;
      --bg-dark: #0c1821;
      --bg-card: #112240;
      --bg-card-hover: #1a365d;
      --border-color: #1e40af;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-accent: #39ff14;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #header {
      background: linear-gradient(135deg, var(--bg-card) 0%, transparent 100%);
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 900;
      background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #header .status { display: flex; gap: 16px; align-items: center; }
    .status-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background-color: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-color);
      animation: pulse 2s infinite;
    }
    .status-dot.paused { background-color: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
    .status-dot.stopped { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    #main-container { flex: 1; display: flex; overflow: hidden; }

    #canvas-container {
      flex: 1; position: relative;
      background: radial-gradient(circle at center, #0f273d 0%, var(--bg-dark) 70%);
    }

    #canvas { display: block; width: 100%; height: 100%; }

    #canvas-overlay {
      position: absolute; top: 16px; left: 16px;
      background: rgba(17, 34, 64, 0.9);
      border: 1px solid var(--border-color);
      border-radius: 8px; padding: 12px 16px; font-size: 12px;
    }

    .panel {
      width: 320px;
      background: linear-gradient(180deg, var(--bg-card) 0%, transparent 100%);
      border-left: 1px solid var(--border-color);
      display: flex; flex-direction: column; overflow-y: auto;
    }

    .panel-header {
      padding: 16px; border-bottom: 1px solid var(--border-color);
      font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700;
      color: var(--primary-color); display: flex; align-items: center; gap: 8px;
    }
    .panel-header::before {
      content: ''; width: 4px; height: 20px;
      background: var(--accent-color); border-radius: 2px;
    }

    .panel-content { padding: 16px; }
    .control-group { margin-bottom: 20px; }

    .control-label {
      display: flex; justify-content: space-between; margin-bottom: 8px;
      font-size: 12px; color: var(--text-secondary);
    }
    .control-label span:last-child { color: var(--text-accent); font-weight: 700; }

    input[type="range"] {
      width: 100%; height: 6px;
      background: var(--bg-dark); border: 1px solid var(--border-color);
      border-radius: 3px; outline: none; cursor: pointer; -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      background: var(--accent-color); border-radius: 50%; cursor: pointer;
      box-shadow: 0 0 10px var(--accent-color);
    }

    .btn-group { display: flex; gap: 8px; margin-top: 20px; }

    .btn {
      flex: 1; padding: 12px; border: 1px solid var(--border-color);
      border-radius: 8px; background: var(--bg-dark); color: var(--text-primary);
      font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;
    }
    .btn:hover { background: var(--bg-card-hover); border-color: var(--primary-color); box-shadow: 0 0 15px rgba(13, 148, 136, 0.3); }
    .btn-primary { background: var(--primary-color); border-color: var(--primary-color); color: var(--bg-dark); }

    .btn-sound { background: linear-gradient(135deg, #6366f1, #4f46e5); border-color: #6366f1; color: white; }
    .btn-sound:hover { background: linear-gradient(135deg, #4f46e5, #4338ca); border-color: #4f46e5; box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
    .btn-sound.muted { background: #475569; border-color: #64748b; }

    .btn-music { background: linear-gradient(135deg, #a855f7, #9333ea); border-color: #a855f7; color: white; }
    .btn-music:hover { background: linear-gradient(135deg, #9333ea, #7c3aed); border-color: #9333ea; box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); }
    .btn-music.muted { background: #475569; border-color: #64748b; }

    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

    .stat-card {
      background: var(--bg-dark); border: 1px solid var(--border-color);
      border-radius: 8px; padding: 12px; text-align: center;
    }
    .stat-value { font-size: 24px; font-weight: 700; color: var(--accent-color); font-family: 'Orbitron', sans-serif; }
    .stat-label { font-size: 10px; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

    .chart-container {
      background: var(--bg-dark); border: 1px solid var(--border-color);
      border-radius: 8px; padding: 12px; margin-top: 16px; height: 200px; position: relative;
    }
    .chart-title { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .chart-canvas { width: 100%; height: calc(100% - 24px); }

    .gene-viewer {
      background: var(--bg-dark); border: 1px solid var(--border-color);
      border-radius: 8px; padding: 16px; margin-top: 16px;
    }
    .gene-header { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .gene-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: rgba(13, 148, 136, 0.1); border-radius: 4px; margin-bottom: 8px;
    }
    .gene-name { font-size: 12px; color: var(--text-primary); text-transform: capitalize; }
    .gene-value { font-size: 14px; font-weight: 700; color: var(--accent-color); }
    .gene-bar { width: 100%; height: 4px; background: var(--bg-card); border-radius: 2px; margin-top: 4px; overflow: hidden; }
    .gene-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary-color), var(--accent-color)); border-radius: 2px; }
  </style>
</head>
<body>
  <div id="header">
    <h1>进化模拟器</h1>
    <div class="status">
      <div class="status-item">
        <div class="status-dot stopped" id="status-dot"></div>
        <span id="status-text">已停止</span>
      </div>
      <div class="status-item"><span>时间:</span><span id="time-display">00:00</span></div>
      <div class="status-item"><span>世代:</span><span id="gen-display">0</span></div>
    </div>
  </div>

  <div id="main-container">
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
      <div id="canvas-overlay">
        <div>点击生物查看其基因组</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">控制面板</div>
      <div class="panel-content">
        <div class="control-group">
          <div class="control-label"><span>初始生物数量</span><span id="val-population">50</span></div>
          <input type="range" id="input-population" min="10" max="200" value="50">
        </div>
        <div class="control-group">
          <div class="control-label"><span>植物生成率</span><span id="val-food-rate">10</span></div>
          <input type="range" id="input-food-rate" min="1" max="50" value="10">
        </div>
        <div class="control-group">
          <div class="control-label"><span>基因突变率</span><span id="val-mutation">0.15</span></div>
          <input type="range" id="input-mutation" min="0" max="0.5" step="0.01" value="0.15">
        </div>
        <div class="control-group">
          <div class="control-label"><span>能量衰减率</span><span id="val-decay">0.1</span></div>
          <input type="range" id="input-decay" min="0.01" max="0.5" step="0.01" value="0.1">
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="btn-start">开始</button>
          <button class="btn" id="btn-pause">暂停</button>
          <button class="btn" id="btn-reset">重置</button>
        </div>
        <div class="btn-group" style="margin-top: 12px;">
          <button class="btn btn-sound" id="btn-sound">🔊 音效</button>
          <button class="btn btn-music" id="btn-music">🎵 音乐</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">统计数据</div>
      <div class="panel-content">
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-value" id="stat-population">0</div><div class="stat-label">总生物数</div></div>
          <div class="stat-card"><div class="stat-value" id="stat-food">0</div><div class="stat-label">植物数量</div></div>
          <div class="stat-card"><div class="stat-value" id="stat-herbivores" style="color: #eab308;">0</div><div class="stat-label">草食动物</div></div>
          <div class="stat-card"><div class="stat-value" id="stat-carnivores" style="color: #ef4444;">0</div><div class="stat-label">肉食动物</div></div>
        </div>
        <div class="chart-container">
          <div class="chart-title">食物链趋势</div>
          <canvas class="chart-canvas" id="chart-population"></canvas>
        </div>
        <div class="gene-viewer">
          <div class="gene-header">选择一个生物</div>
          <div style="color: #94a3b8; font-size: 12px;">点击画布上的生物查看其基因组</div>
        </div>
      </div>
    </div>
  </div>

  <script src="simulation.js"></script>
</body>
</html>
