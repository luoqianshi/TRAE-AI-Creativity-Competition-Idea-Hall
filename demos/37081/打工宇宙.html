<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>打工宇宙 🚀</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans SC',sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63);color:#fff;min-height:100vh;overflow-x:hidden;user-select:none}
.page{display:none;min-height:100vh;padding:20px;padding-bottom:80px;flex-direction:column;align-items:center}
.page.active{display:flex}
h1{font-size:clamp(2rem,8vw,3.5rem);font-weight:900;text-align:center;margin:10px 0;text-shadow:0 0 20px rgba(57,255,20,.5)}
h2{font-size:clamp(1.2rem,5vw,2rem);font-weight:700;text-align:center;margin:10px 0}
h3{font-size:1.1rem;font-weight:700;margin:8px 0}
.subtitle{text-align:center;color:#aaa;font-size:clamp(.9rem,3vw,1.2rem);margin-bottom:20px}
.gold-display{font-size:1.5rem;text-align:center;margin:15px 0;color:#FFD700;cursor:pointer;transition:transform .2s}
.gold-display:hover{transform:scale(1.1)}
.gold-display.bounce{animation:goldBounce .4s ease}
@keyframes goldBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.btn{padding:14px 36px;border:none;border-radius:12px;font-size:1.1rem;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit;position:relative;overflow:hidden}
.btn:active{transform:scale(.92)}
.btn-primary{background:linear-gradient(135deg,#39ff14,#00e676);color:#0f0c29;box-shadow:0 0 20px rgba(57,255,20,.4)}
.btn-primary:hover{box-shadow:0 0 30px rgba(57,255,20,.6)}
.btn-secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(57,255,20,.3)}
.btn-secondary:hover{background:rgba(57,255,20,.15);border-color:#39ff14}
.btn-danger{background:linear-gradient(135deg,#ff4444,#ff6b6b);color:#fff}
.btn-small{padding:8px 20px;font-size:.9rem;border-radius:8px}
.btn-disabled{opacity:.4;pointer-events:none}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;margin:10px 0;width:100%;max-width:400px;transition:all .3s;position:relative}
.card:hover{border-color:#39ff14;box-shadow:0 0 15px rgba(57,255,20,.2)}
.card.completed{border-color:#FFD700}
.card.locked{opacity:.4;pointer-events:none}
.card-title{font-size:1.1rem;font-weight:700;margin-bottom:5px}
.card-desc{font-size:.85rem;color:#aaa;margin-bottom:8px}
.card-reward{font-size:.9rem;color:#FFD700}
.card-badge{display:inline-block;background:rgba(57,255,20,.2);color:#39ff14;padding:4px 12px;border-radius:20px;font-size:.8rem;margin-top:8px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(15,12,41,.95);border-top:1px solid rgba(255,255,255,.1);z-index:100;backdrop-filter:blur(10px)}
.nav-tab{flex:1;text-align:center;padding:12px 0;font-size:.85rem;cursor:pointer;transition:all .2s;border:none;background:none;color:#888;font-family:inherit}
.nav-tab.active{color:#39ff14}
.nav-tab:active{background:rgba(57,255,20,.1)}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;justify-content:center;align-items:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:linear-gradient(135deg,#1a1a3e,#302b63);border:1px solid rgba(57,255,20,.3);border-radius:20px;padding:30px;max-width:400px;width:100%;text-align:center;animation:modalIn .3s ease}
@keyframes modalIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{margin-bottom:15px}
.modal p{margin:8px 0;color:#ccc;font-size:.95rem;line-height:1.6}
.modal .btn{margin-top:15px}
.game-area{position:relative;width:100%;max-width:500px;height:60vh;min-height:350px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:16px;overflow:hidden;margin:10px 0}
.game-hud{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 0;gap:10px;flex-wrap:wrap}
.hud-item{background:rgba(0,0,0,.4);padding:6px 14px;border-radius:8px;font-size:.9rem;border:1px solid rgba(255,255,255,.1)}
.hud-item.hp{color:#ff6b6b}
.hud-item.score{color:#39ff14}
.hud-item.timer{color:#FFD700}
.hp-bar{width:100%;max-width:500px;height:8px;background:rgba(255,255,255,.1);border-radius:4px;margin:5px 0;overflow:hidden}
.hp-bar-fill{height:100%;background:linear-gradient(90deg,#ff4444,#ff6b6b);border-radius:4px;transition:width .3s}
.energy-bar-fill{height:100%;background:linear-gradient(90deg,#39ff14,#00e676);border-radius:4px;transition:width .3s}
.bubble{position:absolute;padding:10px 16px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:20px;font-size:.85rem;cursor:pointer;transition:transform .1s;white-space:nowrap;animation:bubbleFloat 3s linear forwards;pointer-events:auto;z-index:10}
.bubble:active{transform:scale(.9)}
.bubble.red{background:rgba(255,50,50,.2);border-color:rgba(255,50,50,.4);color:#ff6b6b}
@keyframes bubbleFloat{0%{opacity:1}100%{opacity:.3}}
.bubble-pop{animation:bubblePop .3s ease forwards!important}
@keyframes bubblePop{0%{transform:scale(1);opacity:1}100%{transform:scale(1.5);opacity:0}}
.combo-text{position:absolute;font-size:1.5rem;font-weight:900;color:#FFD700;pointer-events:none;animation:comboAnim .8s ease forwards;z-index:20}
@keyframes comboAnim{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-60px) scale(1.5);opacity:0}}
.runner-game{position:relative;width:100%;height:200px;overflow:hidden}
.runner-bg{position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(0deg,#1a1a3e,transparent)}
.runner-ground{position:absolute;bottom:0;left:0;right:0;height:4px;background:#39ff14}
.runner-char{position:absolute;bottom:4px;left:60px;font-size:2rem;transition:none}
  .runner-char.jumping{animation:runnerJump 600ms ease-in-out}
  @keyframes runnerJump{0%{bottom:4px}50%{bottom:80px}100%{bottom:4px}}
.runner-obstacle{position:absolute;bottom:4px;font-size:1.8rem;animation:obstacleMove 2s linear forwards}
@keyframes obstacleMove{0%{right:-40px}100%{right:110%}}
.runner-exit{position:absolute;bottom:4px;right:20px;font-size:2rem}
.runner-progress{width:100%;height:6px;background:rgba(255,255,255,.1);border-radius:3px;margin-top:10px;overflow:hidden}
.runner-progress-fill{height:100%;background:linear-gradient(90deg,#39ff14,#FFD700);border-radius:3px;transition:width .3s}
.shop-section{width:100%;max-width:400px;margin:15px 0;padding:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px}
.shop-section h3{color:#39ff14;margin-bottom:10px}
.collection{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.identity-card{background:linear-gradient(135deg,#1a1a3e,#2a2a5e);border:1px solid rgba(255,215,0,.3);border-radius:12px;padding:12px;width:calc(50% - 4px);font-size:.75rem;line-height:1.4}
.identity-card .ic-name{font-weight:700;color:#FFD700;margin-bottom:4px}
.identity-card .ic-emoji{font-size:1.5rem;display:block;margin:4px 0}
.quote-item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;margin:8px 0;font-size:.85rem;line-height:1.5;position:relative}
.quote-item .copy-btn{position:absolute;top:8px;right:8px;background:rgba(57,255,20,.2);border:none;color:#39ff14;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:.75rem;font-family:inherit}
.progress-bar{width:100%;height:12px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;margin:10px 0}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,#39ff14,#FFD700);border-radius:6px;transition:width .5s}
.achievement-list{width:100%;max-width:400px}
.achievement-item{display:flex;align-items:center;gap:12px;padding:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;margin:8px 0}
.achievement-item.unlocked{border-color:#FFD700;background:rgba(255,215,0,.05)}
.achievement-item .ach-icon{font-size:1.5rem;width:40px;text-align:center}
.achievement-item .ach-info{flex:1}
.achievement-item .ach-name{font-weight:700;font-size:.95rem}
.achievement-item .ach-desc{font-size:.8rem;color:#aaa}
.achievement-item.locked{opacity:.5}
.achievement-item.locked .ach-icon{filter:grayscale(1)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(57,255,20,.9);color:#0f0c29;padding:10px 24px;border-radius:10px;font-weight:700;font-size:.9rem;z-index:300;animation:toastIn .3s ease,toastOut .3s ease 1.7s forwards}
.skeleton{background:linear-gradient(90deg,#2a2a5e,#3a3a7e,#2a2a5e);background-size:200% 100%;animation:skeletonShine 1.5s infinite;border-radius:8px;height:16px;margin:8px 0}
@keyframes skeletonShine{0%{background-position:200% 0}100%{background-position:-200% 0}}
.typewriter-text{overflow:hidden;white-space:pre-wrap}
.share-card{background:linear-gradient(135deg,#0f0c29,#302b63);border:2px solid #39ff14;border-radius:16px;padding:24px;text-align:center;max-width:340px;margin:15px auto;box-shadow:0 0 20px rgba(57,255,20,.3)}
.share-card .share-logo{font-size:1.4rem;font-weight:900;color:#fff;margin-bottom:12px}
.share-card .share-level{font-size:1.1rem;color:#FFD700;margin-bottom:8px}
.share-card .share-rank{font-size:1.5rem;font-weight:900;color:#39ff14;margin:8px 0}
.share-card .share-stats{color:#ccc;font-size:.95rem;margin:8px 0;line-height:1.6}
.share-card .share-quote{color:#aaa;font-style:italic;font-size:.85rem;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
.worker-count{font-size:.9rem;color:#aaa;text-align:center;margin:8px 0}
@keyframes toastIn{from{transform:translateX(-50%) translateY(-20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
@keyframes toastOut{to{transform:translateX(-50%) translateY(-20px);opacity:0}}
.achievement-toast{position:fixed;bottom:80px;right:20px;background:linear-gradient(135deg,#1a1a3e,#302b63);border:1px solid #FFD700;border-radius:12px;padding:15px;z-index:300;animation:achToastIn .5s ease,achToastOut .5s ease 2.5s forwards;max-width:250px}
@keyframes achToastIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes achToastOut{to{transform:translateX(100px);opacity:0}}
.screen-shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.confetti{position:fixed;top:-10px;width:10px;height:10px;z-index:250;pointer-events:none;animation:confettiFall 3s linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.game-back-btn{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;z-index:50;font-family:inherit}
.game-back-btn:active{background:rgba(255,255,255,.1)}
.level-intro{text-align:center;padding:20px}
.level-intro .emoji{font-size:3rem;margin:10px 0}
.level-intro h2{margin:10px 0}
.level-intro p{color:#aaa;margin:10px 0}
.stars{font-size:1.5rem;margin:10px 0}
.mic-area{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:center}
.mic-icon{font-size:3rem;z-index:5;filter:drop-shadow(0 0 10px rgba(57,255,20,.5))}
.colleague{position:absolute;font-size:2rem;cursor:pointer;transition:transform .1s;z-index:10}
.colleague:active{transform:scale(1.3)}
.colleague-bounce{animation:colleagueBounce .4s ease forwards}
@keyframes colleagueBounce{0%{transform:scale(1)}30%{transform:scale(1.5) rotate(20deg)}60%{transform:scale(.5) rotate(-20deg)}100%{transform:scale(0) rotate(40deg)}}
.receive-bar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:80%;height:40px;background:rgba(57,255,20,.15);border:2px solid rgba(57,255,20,.4);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#39ff14;font-size:.9rem}
.kpi-fall{position:absolute;padding:8px 14px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:12px;font-size:.8rem;cursor:pointer;white-space:nowrap;animation:kpiFall 3s linear forwards;z-index:10}
.kpi-fall.urgent{background:rgba(255,50,50,.2);border-color:rgba(255,50,50,.4);color:#ff6b6b}
@keyframes kpiFall{0%{top:-40px}100%{top:110%}}
.kpi-caught{animation:kpiCatch .3s ease forwards!important}
@keyframes kpiCatch{0%{transform:scale(1);opacity:1}100%{transform:scale(1.3);opacity:0}}
.boss-icon{position:absolute;font-size:2rem;animation:bossAppear 1s ease}
@keyframes bossAppear{0%{transform:translateY(-30px);opacity:0}100%{transform:translateY(0);opacity:1}}
.hidden-level{display:none}
.hidden-level.unlocked{display:block}
.section-title{font-size:1.3rem;font-weight:700;color:#39ff14;margin:20px 0 10px;text-align:center}
</style>
</head>
<body>

<!-- ========== 开始页 ========== -->
<div id="page-start" class="page active">
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center">
    <h1>打工宇宙 🚀</h1>
    <p class="subtitle">现实里赢不了，游戏里赢给你看</p>
    <div class="gold-display" id="start-gold">💰 0</div>
    <div class="worker-count" id="worker-count"></div>
    <button class="btn btn-primary" onclick="showPage('page-levels')">开始打工</button>
  </div>
</div>

<!-- ========== 关卡选择页 ========== -->
<div id="page-levels" class="page">
  <h2>选择关卡</h2>
  <div class="gold-display" id="levels-gold">💰 0</div>
  <div id="level-cards"></div>
  <div id="hidden-level-card" class="card hidden-level" style="border-color:#FFD700">
    <div class="card-title">🌟 隐藏关卡：终极摸鱼</div>
    <div class="card-desc">传说中的隐藏关卡，只有真正的摸鱼之神才能挑战</div>
    <div class="card-reward">奖励：200金币 + 称号「摸鱼之神」</div>
    <button class="btn btn-primary btn-small" onclick="startGame(6)" style="margin-top:10px">挑战</button>
  </div>
</div>

<!-- ========== 商店页 ========== -->
<div id="page-shop" class="page">
  <h2>🛒 金币商店</h2>
  <div class="gold-display" id="shop-gold">💰 0</div>

  <div class="shop-section">
    <h3>🎴 抽「打工人身份卡」</h3>
    <p style="font-size:.85rem;color:#aaa;margin-bottom:10px">每次50金币，收集全部10张</p>
    <button class="btn btn-primary btn-small" onclick="drawIdentityCard()">抽卡 (50💰)</button>
    <div id="card-preview" style="margin-top:10px"></div>
    <div class="collection" id="card-collection"></div>
  </div>

  <div class="shop-section">
    <h3>💬 兑换「嘴替语录」</h3>
    <p style="font-size:.85rem;color:#aaa;margin-bottom:10px">每次100金币，收集全部8条</p>
    <button class="btn btn-primary btn-small" onclick="exchangeQuote()">兑换 (100💰)</button>
    <div id="quote-result"></div>
    <div id="quote-collection"></div>
  </div>

  <div class="shop-section">
    <h3>🔓 隐藏关卡解锁</h3>
    <p style="font-size:.85rem;color:#aaa;margin-bottom:10px">累计获得300金币自动解锁隐藏关卡</p>
    <div class="progress-bar"><div class="progress-bar-fill" id="hidden-progress" style="width:0%"></div></div>
    <p id="hidden-progress-text" style="font-size:.85rem;color:#aaa">0/300 金币</p>
  </div>
</div>

<!-- ========== 成就页 ========== -->
<div id="page-achievements" class="page">
  <h2>🏆 成就</h2>
  <div class="achievement-list" id="achievement-list"></div>
</div>

<!-- ========== 游戏页 ========== -->
<div id="page-game" class="page" style="padding-bottom:20px">
  <button class="game-back-btn" onclick="exitGame()">← 退出</button>
  <div id="game-intro" class="level-intro"></div>
  <div id="game-hud" class="game-hud" style="display:none"></div>
  <div id="game-hp-bar" class="hp-bar" style="display:none"><div class="hp-bar-fill" id="hp-fill" style="width:100%"></div></div>
  <div id="game-energy-bar" class="hp-bar" style="display:none"><div class="energy-bar-fill" id="energy-fill" style="width:100%"></div></div>
  <div id="game-area" class="game-area" style="display:none"></div>
  <div id="game-runner" class="runner-game" style="display:none"></div>
  <div id="game-runner-progress" class="runner-progress" style="display:none"><div class="runner-progress-fill" id="runner-progress-fill" style="width:0%"></div></div>
</div>

<!-- ========== 底部导航 ========== -->
<div class="bottom-nav" id="bottom-nav" style="display:none">
  <button class="nav-tab active" data-tab="page-levels" onclick="switchTab(this)">🎮 游戏</button>
  <button class="nav-tab" data-tab="page-achievements" onclick="switchTab(this)">🏆 成就</button>
  <button class="nav-tab" data-tab="page-shop" onclick="switchTab(this)">🛒 商店</button>
</div>

<!-- ========== 弹窗 ========== -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ==================== 数据定义 ====================
const LEVELS = [
  {id:1,name:'清空老板消息',desc:'下班前5分钟，老板消息炸了',emoji:'💬',reward:50,title:'消息终结者',
   winText:'所有消息已消灭，今晚可以安心摸鱼了',loseText:'老板消息已读未回，明天等着开会吧'},
  {id:2,name:'抢会议室发言权',desc:'说话永远被打断？今天轮到你了',emoji:'🎤',reward:80,title:'会议之王',
   winText:'今天的会议，你是主角',loseText:'又没抢到发言，下次早点举手'},
  {id:3,name:'撑过周五最后一小时',desc:'就差这一小时，但任务还在飞来',emoji:'⏰',reward:100,title:'下班战士',
   winText:'恭喜！你成功撑过了周五！周末是你的了',loseText:'在周五最后一小时倒下了，明天继续'},
  {id:4,name:'对抗绩效考核',desc:'KPI又加了？接住就是你的',emoji:'📊',reward:120,title:'KPI粉碎机',
   winText:'所有KPI全部接住！年终奖稳了！',loseText:'KPI没完成，年终奖再见'},
  {id:5,name:'逃离无效加班',desc:'到点了，能不能跑出去',emoji:'🏃',reward:150,title:'准时下班传说',
   winText:'冲出去了！今晚的夜晚属于你！',loseText:'被拦住了，今晚又要加班'}
];

const BOSS_MESSAGES = ['这个今晚能做完吗？','帮我改一下PPT','明天要用！','在吗？','这个需求加一下','周末来一下','有空看一下','这个优先处理','紧急！','能加个班吗？'];

const TASKS_LV3 = ['帮我写个方案','这个bug修一下','填一下周报','开个会','做个数据','整理一下文档','改一下需求','回个邮件','出个报告','对接一下'];

const KPI_LIST = ['转化率+20%','用户增长50%','bug清零','日活翻倍','响应时间减半','覆盖率95%','满意度98%','效率提升30%','成本降低20%','零故障运行'];

const IDENTITY_CARDS = [
  {name:'永远背锅的那个人',emoji:'🎒',desc:'项目成功是团队的，项目失败是你的。你不是一个人，你是一个传说。'},
  {name:'会议记录专业户',emoji:'📝',desc:'你参加会议不是为了发言，是为了帮别人记住他们说过什么。'},
  {name:'PPT美化大师',emoji:'🎨',desc:'内容不重要，好看就行。你的人生使命是让领导的PPT看起来值钱。'},
  {name:'永远在线的人',emoji:'📱',desc:'你的手机从不静音，你的大脑从不关机。你不是员工，你是一项公共服务。'},

// 全局事件监听器引用，用于精确移除
const GLOBAL_LISTENERS = {
  keydown: null,
  runnerClick: null,
  runnerTouch: null,
  areaClick: null
};

function cleanupCurrentGame() {
  if (!currentGame) return;

  // 1. 清理所有 setTimeout / setInterval / requestAnimationFrame
  if (currentGame.timers) {
    currentGame.timers.forEach(t => {
      clearInterval(t);
      clearTimeout(t);
    });
    currentGame.timers = [];
  }

  // 2. 标记游戏已结束，阻止所有异步回调继续执行
  currentGame.ended = true;
  if (currentGame.running !== undefined) currentGame.running = false;

  // 3. 清理全局事件监听器
  if (GLOBAL_LISTENERS.keydown) {
    document.removeEventListener('keydown', GLOBAL_LISTENERS.keydown);
    GLOBAL_LISTENERS.keydown = null;
  }
  if (GLOBAL_LISTENERS.runnerClick) {
    const runner = document.getElementById('game-runner');
    if (runner) runner.removeEventListener('click', GLOBAL_LISTENERS.runnerClick);
    GLOBAL_LISTENERS.runnerClick = null;
  }
  if (GLOBAL_LISTENERS.runnerTouch) {
    const runner = document.getElementById('game-runner');
    if (runner) runner.removeEventListener('touchstart', GLOBAL_LISTENERS.runnerTouch);
    GLOBAL_LISTENERS.runnerTouch = null;
  }
  if (GLOBAL_LISTENERS.areaClick) {
    const area = document.getElementById('game-area');
    if (area) area.removeEventListener('click', GLOBAL_LISTENERS.areaClick);
    GLOBAL_LISTENERS.areaClick = null;
  }

  // 4. 清空游戏区域 DOM，彻底消除幽灵元素
  const area = document.getElementById('game-area');
  const runner = document.getElementById('game-runner');
  if (area) area.innerHTML = '';
  if (runner) runner.innerHTML = '';

  // 5. 清理 HUD 和状态条
  const hud = document.getElementById('game-hud');
  const hpBar = document.getElementById('game-hp-bar');
  const energyBar = document.getElementById('game-energy-bar');
  const runnerProg = document.getElementById('game-runner-progress');
  if (hud) { hud.style.display = 'none'; hud.innerHTML = ''; }
  if (hpBar) hpBar.style.display = 'none';
  if (energyBar) energyBar.style.display = 'none';
  if (runnerProg) runnerProg.style.display = 'none';

  // 6. 重置全局引用
  currentGame = null;
}

// ==================== 存储管理 ====================
function loadState() {
  try {
    const saved = localStorage.getItem('dagong_universe');
    if (saved) gameState = JSON.parse(saved);
  } catch(e) {}
  // 确保字段存在
  if (!gameState.cards) gameState.cards = [];
  if (!gameState.quotes) gameState.quotes = [];
  if (!gameState.achievements) gameState.achievements = [];
  if (!gameState.levels) gameState.levels = {};
  if (!gameState.totalGold) gameState.totalGold = 0;
  if (!gameState.consecutiveWins) gameState.consecutiveWins = 0;
  if (!gameState.totalClears) gameState.totalClears = 0;
}

function saveState() {
  localStorage.setItem('dagong_universe', JSON.stringify(gameState));
}

// ==================== 金币管理 ====================
function addGold(amount) {
  gameState.gold += amount;
  gameState.totalGold += amount;
  saveState();
  animateGold();
  updateGoldDisplays();
  checkAchievement('rich_worker', gameState.totalGold >= 500);
}

function spendGold(amount) {
  if (gameState.gold < amount) {
    showToast('金币不足！');
    return false;
  }
  gameState.gold -= amount;
  saveState();
  animateGold();
  updateGoldDisplays();
  return true;
}

  if (gameState.achievements.includes(id)) return;

function drawIdentityCard() {
  if (!spendGold(50)) return;
  // 找出未抽到的
  const available = [];
  for (let i = 0; i < IDENTITY_CARDS.length; i++) {
    if (!gameState.cards.includes(i)) available.push(i);
  }
  if (available.length === 0) {
    showToast('已收集全部身份卡！');
    addGold(50);
    return;
  }
  const idx = available[Math.floor(Math.random() * available.length)];
  gameState.cards.push(idx);
  saveState();
  const c = IDENTITY_CARDS[idx];
  const preview = document.getElementById('card-preview');
  preview.innerHTML = `<div class="identity-card" style="animation:modalIn .3s ease"><div class="ic-name">${c.name}</div><div class="ic-emoji">${c.emoji}</div><div>${c.desc}</div></div>`;
  renderShop();
  showToast('获得新身份卡！');
}

function exchangeQuote() {
  if (!spendGold(100)) return;
  const available = [];
  for (let i = 0; i < QUOTES.length; i++) {
    if (!gameState.quotes.includes(i)) available.push(i);
  }
  if (available.length === 0) {
    showToast('已收集全部语录！');
    addGold(100);
    return;
  }
  const idx = available[Math.floor(Math.random() * available.length)];
  gameState.quotes.push(idx);
  saveState();
  const result = document.getElementById('quote-result');
  result.innerHTML = `<div class="quote-item" style="animation:modalIn .3s ease">"${QUOTES[idx]}"<button class="copy-btn" onclick="copyQuote(${idx})">复制</button></div>`;
  renderShop();
  showToast('获得新语录！');
}

function copyQuote(idx) {
  const text = QUOTES[idx];
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('已复制，去怼他！'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    showToast('已复制，去怼他！');
  }
}

function getRank(levelId, score) {
  const cfg = RANK_CONFIG[levelId];
  if (!cfg) return '打工传说';
  let rank = cfg.ranks[0].label;
  for (let i = cfg.ranks.length - 1; i >= 0; i--) {
    if (score >= cfg.ranks[i].min) {
      rank = cfg.ranks[i].label;
      break;
    }
  }
  return rank;
}

function typewriterEffect(element, text, speed, callback) {
  let i = 0;
  element.textContent = '';
  element.classList.add('typewriter-text');
  function type() {
    if (i < text.length) {
      element.textContent += text.charAt(i);
      i++;
      setTimeout(type, speed);
    } else if (callback) {
      callback();
    }
  }
  type();
}

  gameState.levels[levelId] = {cleared: true, title: lv.title};
  gameState.consecutiveWins = (gameState.consecutiveWins || 0) + 1;
  gameState.totalClears = (gameState.totalClears || 0) + 1;
  addGold(lv.reward);

function gameLose(levelId) {
  // 防止重复结算
  if (!currentGame || currentGame.ended) return;
  cleanupCurrentGame();
  gameState.consecutiveWins = 0;
  saveState();
  screenShake();

  const lv = LEVELS[levelId - 1];
  // 隐藏关卡(levelId=6)兜底文案
  const loseTitle = lv ? '💀 失败' : '💀 摸鱼失败';
  const loseText = lv ? lv.loseText : '摸鱼被发现了！下次小心点。';
  showModal(`
    <h2 style="color:#ff6b6b">${loseTitle}</h2>
    <p style="font-size:1.1rem">${loseText}</p>

}

// ==================== 第一关：清空老板消息 ====================
function launchLevel1() {
  const area = document.getElementById('game-area');
  area.style.display = 'block';
  createHUD('得分：0', '❤️ 7', '⏱️ 20s');
  showHPBar(100);

  const g = {
    score: 0, hp: 7, maxHp: 7, time: 20, combo: 0, comboTimer: null,
    popped: 0, bubbleInterval: null, timerInterval: null, timers: [],
    ended: false, spawnRate: 400
  };
  currentGame = g;

  function spawnBubble() {
    if (g.ended || g.time <= 0) return;
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = BOSS_MESSAGES[Math.floor(Math.random() * BOSS_MESSAGES.length)];
    const side = Math.floor(Math.random() * 4);
    const areaRect = area.getBoundingClientRect();
    const w = areaRect.width || 300;
    const h = areaRect.height || 400;
    let x, y, dx, dy;
    switch(side) {
      case 0: x = Math.random() * (w - 150); y = -40; dx = (Math.random()-.5)*2; dy = Math.random()*1.5+.5; break;
      case 1: x = Math.random() * (w - 150); y = h; dx = (Math.random()-.5)*2; dy = -(Math.random()*1.5+.5); break;
      case 2: x = -150; y = Math.random() * (h - 40); dx = Math.random()*1.5+.5; dy = (Math.random()-.5)*2; break;
      case 3: x = w; y = Math.random() * (h - 40); dx = -(Math.random()*1.5+.5); dy = (Math.random()-.5)*2; break;
    }
    b.style.left = x + 'px';
    b.style.top = y + 'px';
    b.dataset.dx = dx;
    b.dataset.dy = dy;
    b.dataset.life = '0';

    b.addEventListener('click', function(e) {
      e.stopPropagation();
      if (g.ended || b.dataset.done) return;
      b.dataset.done = '1';
      b.classList.add('bubble-pop');
      g.combo++;
      g.popped++;
      clearTimeout(g.comboTimer);
      g.comboTimer = setTimeout(() => { if (!g.ended) g.combo = 0; }, 1500);

      let pts = 1;
      if (g.combo >= 3) {
        pts = 2;
        const ct = document.createElement('div');
        ct.className = 'combo-text';
        ct.textContent = '连击！+2';
        ct.style.left = b.style.left;
        ct.style.top = b.style.top;
        area.appendChild(ct);
        setTimeout(() => ct.remove(), 800);
      }
      g.score += pts;
      updateHUD('score', '得分：' + g.score);
      setTimeout(() => b.remove(), 300);
    });

    area.appendChild(b);

    let life = 0;
    const moveTimer = setInterval(() => {
      if (g.ended) { clearInterval(moveTimer); return; }
      life += 50;
      b.dataset.life = life;
      const cx = parseFloat(b.style.left) + parseFloat(b.dataset.dx) * 1.5;
      const cy = parseFloat(b.style.top) + parseFloat(b.dataset.dy) * 1.5;
      b.style.left = cx + 'px';
      b.style.top = cy + 'px';
      if (cx < -160 || cx > w + 10 || cy < -50 || cy > h + 10) {
        clearInterval(moveTimer);
        if (!b.dataset.done && !g.ended) {
          b.dataset.done = '1';
          g.hp--;
          g.combo = 0;
          updateHUD('hp', '❤️ ' + g.hp);
          updateHPBar((g.hp / g.maxHp) * 100);
          b.remove();
          if (g.hp <= 0 && !g.ended) gameLose(1);
        }
      }
    }, 50);
    g.timers.push(moveTimer);
  }

  // 初始气泡速度
  function scheduleBubble() {
    g.bubbleInterval = setTimeout(() => {
      if (!g.ended) {
        spawnBubble();
        scheduleBubble();
      }
    }, g.spawnRate);
    g.timers.push(g.bubbleInterval);
  }
  scheduleBubble();

  g.timerInterval = setInterval(() => {
    if (g.ended) { clearInterval(g.timerInterval); return; }
    g.time--;
    updateHUD('timer', '⏱️ ' + g.time + 's');
    // 加速：每5秒加快一次，最低200ms
    if (g.time % 5 === 0 && g.time > 0) {
      g.spawnRate = Math.max(200, g.spawnRate - 60);
    }
    if (g.time <= 0) {
      clearInterval(g.timerInterval);
      if (!g.ended) {
        if (g.popped >= 25 && g.hp > 0) {
          gameWin(1, {score: g.score});
        } else {
          gameLose(1);
        }
      }
    }
  }, 1000);
  g.timers.push(g.timerInterval);
}

// ==================== 第二关：抢会议室发言权 ====================
function launchLevel2() {
  const area = document.getElementById('game-area');
  area.style.display = 'block';
  area.style.position = 'relative';
  createHUD('弹走：0', '❤️ 5', '目标：30');
  showHPBar(100);

  area.innerHTML = '<div class="mic-area"><div class="mic-icon">🎤</div></div>';

  const g = {score: 0, hp: 5, maxHp: 5, spawnInterval: null, timers: [], speed: 1.5, ended: false, spawnRate: 1500};
  currentGame = g;

  const emojis = ['👨‍💼','👩‍💼','🧑‍💼','👨‍💻','👩‍💻'];

  function spawnColleague() {
    if (g.ended) return;
    const c = document.createElement('div');
    c.className = 'colleague';
    c.textContent = emojis[Math.floor(Math.random() * emojis.length)];

    const areaRect = area.getBoundingClientRect();
    const w = areaRect.width || 300;
    const h = areaRect.height || 400;
    const cx = w / 2;
    const cy = h / 2;

    // 从边缘随机位置出现
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.max(w, h) * 0.6;
    const startX = cx + Math.cos(angle) * dist;
    const startY = cy + Math.sin(angle) * dist;

    c.style.left = startX + 'px';
    c.style.top = startY + 'px';

    const dx = (cx - startX);
    const dy = (cy - startY);
    const len = Math.sqrt(dx*dx + dy*dy);
    const speed = g.speed;
    c.dataset.dx = (dx / len) * speed;
    c.dataset.dy = (dy / len) * speed;
    c.dataset.done = '0';
    c.dataset.clicked = '0';

    // 每个同事独立的 moveTimer 引用，用于点击时精确停止
    let moveTimer = null;

    c.addEventListener('click', function(e) {
      e.stopPropagation();
      if (g.ended || c.dataset.clicked === '1') return;
      c.dataset.clicked = '1';
      c.dataset.done = '1';
      // 立即禁用 pointer-events，防止任何后续交互
      c.style.pointerEvents = 'none';
      // 立即停止移动计时器
      if (moveTimer) { clearInterval(moveTimer); moveTimer = null; }
      c.classList.add('colleague-bounce');
      g.score++;
      updateHUD('score', '弹走：' + g.score);
      // 检查通关条件：弹走30个同事
      if (g.score >= 30 && !g.ended) {
        gameWin(2, {score: g.score});
        return;
      }
      // 加速
      g.speed = Math.min(4, 1.5 + g.score * 0.05);
      // 播放动画后删除元素
      setTimeout(() => { if (c.parentNode) c.remove(); }, 400);
    });

    area.appendChild(c);

    moveTimer = setInterval(() => {
      if (g.ended || c.dataset.done === '1') { clearInterval(moveTimer); moveTimer = null; return; }
      const nx = parseFloat(c.style.left) + parseFloat(c.dataset.dx);
      const ny = parseFloat(c.style.top) + parseFloat(c.dataset.dy);
      c.style.left = nx + 'px';
      c.style.top = ny + 'px';

      // 精确碰撞检测：使用 getBoundingClientRect 计算话筒中心点半径40px
      const micEl = area.querySelector('.mic-icon');
      if (micEl && c.dataset.done === '0' && c.dataset.clicked === '0') {
        const micRect = micEl.getBoundingClientRect();
        const cRect = c.getBoundingClientRect();
        const micCenterX = micRect.left + micRect.width / 2;
        const micCenterY = micRect.top + micRect.height / 2;
        const cCenterX = cRect.left + cRect.width / 2;
        const cCenterY = cRect.top + cRect.height / 2;
        const distToMic = Math.sqrt((cCenterX - micCenterX)**2 + (cCenterY - micCenterY)**2);
        if (distToMic < 40) {
          clearInterval(moveTimer);
          moveTimer = null;
          c.dataset.done = '1';
          c.style.pointerEvents = 'none';
          g.hp--;
          updateHUD('hp', '❤️ ' + g.hp);
          updateHPBar((g.hp / g.maxHp) * 100);
          c.remove();
          if (g.hp <= 0 && !g.ended) gameLose(2);
        }
      }
    }, 50);
    g.timers.push(moveTimer);
  }

  function scheduleSpawn() {
    g.spawnInterval = setTimeout(() => {
      if (!g.ended) {
        spawnColleague();
        scheduleSpawn();
      }
    }, g.spawnRate);
    g.timers.push(g.spawnInterval);
  }
  scheduleSpawn();

  // 加速生成
  const accelTimer = setInterval(() => {
    if (!g.ended) g.spawnRate = Math.max(500, g.spawnRate - 100);
  }, 5000);
  g.timers.push(accelTimer);
}

// ==================== 第三关：撑过周五最后一小时 ====================
function launchLevel3() {
  const LEVEL3_DURATION = 30;
  const area = document.getElementById('game-area');
  area.style.display = 'block';
  createHUD('精力：100%', '❤️ 撑住', '⏱️ ' + LEVEL3_DURATION + 's');
  showEnergyBar(100);

  const g = {energy: 100, time: LEVEL3_DURATION, tasks: [], timers: [], spawnInterval: null, timerInterval: null, energyInterval: null, ended: false, spawnRate: 2000};
  currentGame = g;

  // 顶部倒计时条
  const timerBar = document.createElement('div');
  timerBar.style.cssText = 'position:absolute;top:0;left:0;right:0;height:20px;background:rgba(255,215,0,.2);border-radius:0 0 8px 8px;overflow:hidden;z-index:5';
  const timerFill = document.createElement('div');
  timerFill.style.cssText = 'height:100%;background:linear-gradient(90deg,#FFD700,#ff8c00);transition:width 1s linear;width:100%';
  timerBar.appendChild(timerFill);
  area.appendChild(timerBar);

  // 拒绝按钮
  const rejectBtn = document.createElement('button');
  rejectBtn.className = 'btn btn-danger btn-small';
  rejectBtn.textContent = '❌ 拒绝';
  rejectBtn.style.cssText = 'position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:20;font-size:1rem;padding:12px 30px';
  area.appendChild(rejectBtn);

  function spawnTask() {
    if (g.ended || g.time <= 0) return;
    const t = document.createElement('div');
    t.className = 'bubble';
    t.textContent = TASKS_LV3[Math.floor(Math.random() * TASKS_LV3.length)];
    t.style.top = '-40px';
    t.style.left = (20 + Math.random() * 60) + '%';
    t.style.animation = 'none';
    t.dataset.done = '0';

    const areaH = area.getBoundingClientRect().height || 400;
    let yPos = -40;
    const fallSpeed = 0.8 + (LEVEL3_DURATION - g.time) * 0.02;

    const fallTimer = setInterval(() => {
      if (g.ended || t.dataset.done === '1') { clearInterval(fallTimer); return; }
      yPos += fallSpeed;
      t.style.top = yPos + 'px';
      if (yPos > areaH - 60) {
        clearInterval(fallTimer);
        if (!g.ended && t.dataset.done === '0') {
          t.dataset.done = '1';
          g.energy -= 15;
          updateEnergyBar(g.energy);
          t.style.opacity = '0.3';
          setTimeout(() => t.remove(), 500);
          if (g.energy <= 0 && !g.ended) gameLose(3);
        }
      }
    }, 50);
    g.timers.push(fallTimer);

    area.appendChild(t);
  }

  rejectBtn.addEventListener('click', () => {
    if (g.ended) return;
    // 消除最靠近底部的任务
    let closest = null;
    let closestY = -1;
    area.querySelectorAll('.bubble').forEach(b => {
      if (b.dataset.done === '0') {
        const y = parseFloat(b.style.top) || 0;
        if (y > closestY) { closestY = y; closest = b; }
      }
    });
    if (closest && !g.ended) {
      closest.dataset.done = '1';
      closest.classList.add('bubble-pop');
      g.energy = Math.min(100, g.energy + 5);
      updateEnergyBar(g.energy);
      setTimeout(() => closest.remove(), 300);
    }
  });

  // 也支持直接点击气泡消除
  const onAreaClick = (e) => {
    if (g.ended) return;
    const b = e.target.closest('.bubble');
    if (b && b.dataset.done === '0' && !g.ended) {
      b.dataset.done = '1';
      b.classList.add('bubble-pop');
      g.energy = Math.min(100, g.energy + 5);
      updateEnergyBar(g.energy);
      setTimeout(() => b.remove(), 300);
    }
  };
  area.addEventListener('click', onAreaClick);
  // 登记以便 cleanupCurrentGame 清理
  GLOBAL_LISTENERS.areaClick = onAreaClick;

  function scheduleSpawn() {
    g.spawnInterval = setTimeout(() => {
      if (!g.ended) {
        spawnTask();
        scheduleSpawn();
      }
    }, g.spawnRate);
    g.timers.push(g.spawnInterval);
  }
  scheduleSpawn();

  g.timerInterval = setInterval(() => {
    if (g.ended) { clearInterval(g.timerInterval); return; }
    g.time--;
    timerFill.style.width = (g.time / LEVEL3_DURATION * 100) + '%';
    updateHUD('timer', '⏱️ ' + g.time + 's');
    updateHUD('score', '精力：' + Math.floor(g.energy) + '%');
    if (g.time % 5 === 0 && g.time > 0) g.spawnRate = Math.max(800, g.spawnRate - 200);
    if (g.time <= 0) {
      clearInterval(g.timerInterval);
      if (!g.ended) {
        if (g.energy > 0) {
          gameWin(3, {score: Math.floor(g.energy)});
        } else {
          gameLose(3);
        }
      }
    }
  }, 1000);
  g.timers.push(g.timerInterval);

  g.energyInterval = setInterval(() => {
    if (g.ended) { clearInterval(g.energyInterval); return; }
    g.energy -= 0.8;
    updateEnergyBar(g.energy);
    updateHUD('score', '精力：' + Math.floor(g.energy) + '%');
    if (g.energy <= 0 && !g.ended) gameLose(3);
  }, 1000);
  g.timers.push(g.energyInterval);
}

// ==================== 第四关：对抗绩效考核 ====================
function launchLevel4() {
  const area = document.getElementById('game-area');
  area.style.display = 'block';
  createHUD('接住：0', '❤️ 5', '⏱️ 45s');
  showHPBar(100);

  const g = {score: 0, hp: 5, maxHp: 5, time: 45, timers: [], spawnInterval: null, bossTimer: null, timerInterval: null, ended: false, spawnRate: 1500};
  currentGame = g;

  // 接收栏
  const bar = document.createElement('div');
  bar.className = 'receive-bar';
  bar.textContent = '📥 点击掉落的KPI接住它们！';
  area.appendChild(bar);

  function spawnKPI(urgent) {
    if (g.ended) return;
    const k = document.createElement('div');
    k.className = 'kpi-fall' + (urgent ? ' urgent' : '');
    k.textContent = urgent ? '🔥加急KPI' : KPI_LIST[Math.floor(Math.random() * KPI_LIST.length)];
    k.style.left = (10 + Math.random() * 70) + '%';
    k.dataset.done = '0';
    k.dataset.urgent = urgent ? '1' : '0';

    // 使用JS控制掉落，不用CSS动画，确保碰撞检测准确
    const areaH = area.getBoundingClientRect().height || 400;
    let yPos = -40;
    const fallSpeed = urgent ? 1.8 : 1.2;

    k.addEventListener('click', function(e) {
      e.stopPropagation();
      if (g.ended || k.dataset.done === '1') return;
      k.dataset.done = '1';
      k.classList.add('kpi-caught');
      const pts = urgent ? 10 : 3;
      g.score += pts;
      updateHUD('score', '接住：' + g.score);
      setTimeout(() => k.remove(), 300);
    });

    area.appendChild(k);

    // JS控制掉落
    const fallTimer = setInterval(() => {
      if (g.ended || k.dataset.done === '1') { clearInterval(fallTimer); return; }
      yPos += fallSpeed;
      k.style.top = yPos + 'px';
      if (yPos > areaH - 40) {
        clearInterval(fallTimer);
        if (!g.ended && k.dataset.done === '0') {
          k.dataset.done = '1';
          const dmg = urgent ? 2 : 1;
          g.hp -= dmg;
          updateHUD('hp', '❤️ ' + Math.max(0, g.hp));
          updateHPBar((g.hp / g.maxHp) * 100);
          k.remove();
          if (g.hp <= 0 && !g.ended) gameLose(4);
        }
      }
    }, 20);
    g.timers.push(fallTimer);
  }

  // 老板出现
  function bossAppear() {
    if (g.ended) return;
    const boss = document.createElement('div');
    boss.className = 'boss-icon';
    boss.textContent = '👨‍💼';
    boss.style.top = '10px';
    boss.style.left = (20 + Math.random() * 60) + '%';
    area.appendChild(boss);
    setTimeout(() => {
      if (!g.ended) spawnKPI(true);
      setTimeout(() => { if (boss.parentNode) boss.remove(); }, 500);
    }, 800);
  }

  function scheduleSpawn() {
    g.spawnInterval = setTimeout(() => {
      if (!g.ended) {
        spawnKPI(false);
        scheduleSpawn();
      }
    }, g.spawnRate);
    g.timers.push(g.spawnInterval);
  }
  scheduleSpawn();

  g.bossTimer = setInterval(() => {
    if (!g.ended) bossAppear();
  }, 8000);
  g.timers.push(g.bossTimer);

  // 倒计时与通关判定
  g.timerInterval = setInterval(() => {
    if (g.ended) { clearInterval(g.timerInterval); return; }
    g.time--;
    updateHUD('timer', '⏱️ ' + g.time + 's');
    if (g.time <= 0) {
      clearInterval(g.timerInterval);
      if (!g.ended) {
        if (g.score >= 30) {
          gameWin(4, {score: g.score});
        } else {
          gameLose(4);
        }
      }
    }
  }, 1000);
  g.timers.push(g.timerInterval);

  // 加速
  const accelTimer = setInterval(() => {
    if (!g.ended) g.spawnRate = Math.max(600, g.spawnRate - 100);
  }, 5000);
  g.timers.push(accelTimer);
}

// ==================== 第五关：逃离无效加班 ====================
function launchLevel5() {
  const runner = document.getElementById('game-runner');
  const runnerProg = document.getElementById('game-runner-progress');
  runner.style.display = 'block';
  runnerProg.style.display = 'block';
  createHUD('距离：0m', '❤️ 3', null);
  showHPBar(100);

  const g = {
    distance: 0, targetDistance: 100, hp: 3, maxHp: 3,
    jumping: false, jumpCooldown: false, obstacleTimer: null, gameTimer: null,
    running: true, timers: [], speed: 3, ended: false, spawnRate: 1500
  };
  currentGame = g;

  runner.innerHTML = `
    <div class="runner-bg"></div>
    <div class="runner-ground"></div>
    <div class="runner-char" id="runner-char">🏃</div>
    <div class="runner-exit" id="runner-exit">🚪出口</div>
  `;

  const charEl = document.getElementById('runner-char');

  // 跳跃：总时长600ms（上升300ms+下落300ms），落地后100ms缓冲防止连跳失灵
  function jump() {
    if (g.ended || g.jumping || g.jumpCooldown || !g.running) return;
    g.jumping = true;
    g.jumpCooldown = true;
    charEl.classList.add('jumping');
    // 600ms后移除跳跃状态，再过100ms解除冷却
    setTimeout(() => {
      charEl.classList.remove('jumping');
      g.jumping = false;
      setTimeout(() => { g.jumpCooldown = false; }, 100);
    }, 600);
  }

  // 点击/触摸跳跃 - 使用命名函数以便精确移除
  const onRunnerClick = () => jump();
  const onRunnerTouch = (e) => { e.preventDefault(); jump(); };
  const onKeyDown = (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
  };

  runner.addEventListener('click', onRunnerClick);
  runner.addEventListener('touchstart', onRunnerTouch);
  document.addEventListener('keydown', onKeyDown);

  // 登记到全局监听器，cleanupCurrentGame 会清理
  GLOBAL_LISTENERS.runnerClick = onRunnerClick;
  GLOBAL_LISTENERS.runnerTouch = onRunnerTouch;
  GLOBAL_LISTENERS.keydown = onKeyDown;

  const obstacles = ['👨‍💼','📞','📋','👥'];
  const obstacleTexts = ['再等等！','突然来电','临时需求','帮我一下'];

  function spawnObstacle() {
    if (g.ended || !g.running) return;
    const o = document.createElement('div');
    o.className = 'runner-obstacle';
    o.textContent = obstacles[Math.floor(Math.random() * obstacles.length)];
    o.title = obstacleTexts[Math.floor(Math.random() * obstacleTexts.length)];
    o.dataset.done = '0';
    const dur = Math.max(1, 3 - g.distance * 0.01);
    o.style.animationDuration = dur + 's';
    runner.appendChild(o);

    const checkTimer = setInterval(() => {
      if (g.ended || o.dataset.done === '1') { clearInterval(checkTimer); return; }
      const rect = o.getBoundingClientRect();
      const charRect = charEl.getBoundingClientRect();

      // AABB碰撞检测（向内缩6px减少视觉误判）
      // 碰撞区域 = 两个矩形重叠，各自内缩6px
      const charLeft = charRect.left + 6;
      const charRight = charRect.right - 6;
      const charTop = charRect.top + 6;
      const charBottom = charRect.bottom - 6;
      const obsLeft = rect.left + 6;
      const obsRight = rect.right - 6;
      const obsTop = rect.top + 6;
      const obsBottom = rect.bottom - 6;

      const overlapX = charLeft < obsRight && charRight > obsLeft;
      const overlapY = charTop < obsBottom && charBottom > obsTop;

      // 碰撞判定：AABB重叠 且 角色实际位置未跳跃（通过bottom值判断）
      // 跳跃时角色bottom约80px（CSS动画），地面是4px
      const charBottomPx = parseFloat(getComputedStyle(charEl).bottom) || 4;
      const isOnGround = charBottomPx < 20; // 地面附近才算在地面上

      if (overlapX && overlapY && isOnGround) {
        o.dataset.done = '1';
        g.hp--;
        updateHUD('hp', '❤️ ' + g.hp);
        updateHPBar((g.hp / g.maxHp) * 100);
        o.remove();
        if (g.hp <= 0 && !g.ended) {
          g.running = false;
          gameLose(5);
        }
      }
      // 障碍物跑过：基于实际矩形位置判断离场
      const runnerRect = runner.getBoundingClientRect();
      const obsRect = o.getBoundingClientRect();
      if (obsRect.right < runnerRect.left) {
        if (o.dataset.done === '0') {
          o.dataset.done = '1';
          g.distance += 10;
          g.score = g.distance;
          updateHUD('score', '距离：' + g.distance + 'm');
          const prog = Math.min(100, (g.distance / g.targetDistance) * 100);
          document.getElementById('runner-progress-fill').style.width = prog + '%';
          if (g.distance >= g.targetDistance && !g.ended) {
            g.running = false;
            gameWin(5, {score: g.distance});
          }
          // 增加目标距离
          if (g.distance % 50 === 0 && g.distance < g.targetDistance) {
            g.targetDistance += 20;
          }
        }
        clearInterval(checkTimer);
        o.remove();
      }
    }, 50);
    g.timers.push(checkTimer);
  }

  function scheduleObstacle() {
    g.obstacleTimer = setTimeout(() => {
      if (!g.ended && g.running) {
        spawnObstacle();
        scheduleObstacle();
      }
    }, g.spawnRate);
    g.timers.push(g.obstacleTimer);
  }
  scheduleObstacle();

  // 加速
  const accelTimer = setInterval(() => {
    if (g.ended || !g.running) return;
    g.spawnRate = Math.max(600, g.spawnRate - 80);
    g.speed = Math.min(8, g.speed + 0.2);
  }, 5000);
  g.timers.push(accelTimer);
}

// ==================== 隐藏关卡：终极摸鱼 ====================
function startHiddenGame() {
  const area = document.getElementById('game-area');
  area.style.display = 'block';
  createHUD('摸鱼指数：0', '精力：100', '⏱️ 30s');
  showEnergyBar(100);

  const g = {score: 0, energy: 100, time: 30, timers: [], spawnInterval: null, timerInterval: null, ended: false, spawnRate: 1000};
  currentGame = g;

  // 摸鱼小游戏：点击出现的摸鱼机会
  const fishItems = ['🐟','🎮','☕','😴','📱','🛋️','📺','🎵'];

  function spawnFish() {
    if (g.ended || g.time <= 0) return;
    const f = document.createElement('div');
    f.className = 'bubble';
    f.textContent = fishItems[Math.floor(Math.random() * fishItems.length)];
    f.style.left = (10 + Math.random() * 70) + '%';
    f.style.top = (10 + Math.random() * 60) + '%';
    f.style.animation = 'none';
    f.style.fontSize = '2rem';
    f.style.padding = '15px';
    f.dataset.done = '0';

    // 自动消失
    const vanishTimer = setTimeout(() => {
      if (!g.ended && f.dataset.done === '0') {
        f.dataset.done = '1';
        f.style.opacity = '0';
        setTimeout(() => { if (f.parentNode) f.remove(); }, 300);
      }
    }, 2000);
    g.timers.push(vanishTimer);

    f.addEventListener('click', function(e) {
      e.stopPropagation();
      if (g.ended || f.dataset.done === '1') return;
      f.dataset.done = '1';
      f.classList.add('bubble-pop');
      g.score += 5;
      g.energy = Math.min(100, g.energy + 3);
      updateHUD('score', '摸鱼指数：' + g.score);
      updateEnergyBar(g.energy);
      setTimeout(() => { if (f.parentNode) f.remove(); }, 300);
    });

    area.appendChild(f);
  }

  function scheduleSpawn() {
    g.spawnInterval = setTimeout(() => {
      if (!g.ended) {
        spawnFish();
        scheduleSpawn();
      }
    }, g.spawnRate);
    g.timers.push(g.spawnInterval);
  }
  scheduleSpawn();

  g.timerInterval = setInterval(() => {
    if (g.ended) { clearInterval(g.timerInterval); return; }
    g.time--;
    g.energy -= 1;
    updateHUD('timer', '⏱️ ' + g.time + 's');
    updateEnergyBar(g.energy);
    if (g.time <= 0 || g.energy <= 0) {
      clearInterval(g.timerInterval);
      if (!g.ended) {
        if (g.score >= 100) {
          g.ended = true;
          gameState.levels[6] = {cleared: true, title: '摸鱼之神'};
          gameState.totalClears++;
          addGold(200);
          saveState();
          spawnConfetti();
          showModal(`
            <h2 style="color:#39ff14">🎉 隐藏关卡通关！</h2>
            <p>摸鱼指数：${g.score}</p>
            <p style="color:#FFD700">获得 200💰 + 称号「摸鱼之神」</p>
            <p>你已经是摸鱼界的传说。</p>
            <button class="btn btn-primary btn-small" onclick="hideModal();showPage('page-levels')">返回</button>
          `);
        } else {
          gameLose(6);
        }
      }
    }
  }, 1000);
  g.timers.push(g.timerInterval);
}

// ==================== 今日打工人数 ====================
let workerCountTimer = null;

function getBaseWorkerCount() {
  const now = new Date();
  const day = now.getDate();
  const hour = now.getHours();
  return 12847 + day + hour * 37;
}

function formatNumber(n) {
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function updateWorkerCount() {
  const el = document.getElementById('worker-count');
  if (!el) return;
  const base = getBaseWorkerCount();
  // 加上一个基于当前分钟数的微小偏移，让数字看起来在实时变化
  const offset = Math.floor(Date.now() / 60000) % 60;
  const count = base + offset * 3 + Math.floor(Math.random() * 6);
  el.textContent = `今日已有 ${formatNumber(count)} 位打工人在此发泄`;
}

function startWorkerCount() {
  updateWorkerCount();
  if (workerCountTimer) clearInterval(workerCountTimer);
  workerCountTimer = setInterval(() => {
    const el = document.getElementById('worker-count');
    if (!el) return;
    // 每60秒小幅增加
    const currentText = el.textContent;
    const match = currentText.match(/([\d,]+)/);
    if (match) {
      const current = parseInt(match[1].replace(/,/g, ''), 10);
      const add = Math.floor(Math.random() * 6) + 3; // +3到+8
      el.textContent = `今日已有 ${formatNumber(current + add)} 位打工人在此发泄`;
    }
  }, 60000);
}

// ==================== 初始化 ====================
loadState();
updateGoldDisplays();
startWorkerCount();
