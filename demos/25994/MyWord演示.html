<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyWord 汉字笔画</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ef4444'/%3E%3Ctext x='50' y='68' font-size='55' font-weight='bold' text-anchor='middle' fill='white'%3EW%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #fafbfc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 40px;
        }

        /* Header */
        .header {
            width: 100%;
            background: white;
            border-bottom: 1px solid #f0f0f5;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 3px rgba(0, 110, 255, 0.06);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #3b82f6;
        }

        .header h1 span {
            color: #ef4444;
        }

        /* Search */
        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-input {
            width: 220px;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }

        .search-btn {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-btn:hover {
            background: #2563eb;
        }

        /* View Toggle */
        .view-toggle {
            display: flex;
            margin-top: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }

        .view-btn {
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            background: white;
            color: #64748b;
            cursor: pointer;
            transition: all 0.15s;
        }

        .view-btn:hover:not(.active) {
            background: #f8fafc;
        }

        .view-btn.active {
            background: #3b82f6;
            color: white;
        }

        /* Character Display */
        .char-display {
            text-align: center;
            padding: 16px;
        }

        .char-text {
            font-size: 56px;
            font-weight: 900;
            color: #1a1a2e;
            line-height: 1;
        }

        .char-info {
            font-size: 15px;
            color: #9999b0;
            margin-top: 4px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #9999b0;
        }

        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #f0f0f5;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Tianzige */
        .tianzige {
            position: relative;
            background: #fefefe;
            border: 3px solid #22c55e;
            border-radius: 4px;
            overflow: hidden;
        }

        .tianzige-line-h {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 0;
            border-top: 1.5px dashed rgba(34, 197, 94, 0.4);
            pointer-events: none;
            z-index: 0;
        }

        .tianzige-line-v {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 0;
            border-left: 1.5px dashed rgba(34, 197, 94, 0.4);
            pointer-events: none;
            z-index: 0;
        }

        .tianzige-content {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
        }

        /* Animation View */
        .anim-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 16px;
        }

        .anim-status {
            text-align: center;
            font-size: 16px;
            color: #4b5563;
            font-weight: 500;
            min-height: 24px;
        }

        .anim-status .red {
            color: #ef4444;
        }

        /* Anim Controls */
        .anim-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .anim-btn {
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #e2e8f0;
            background: white;
            color: #374151;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .anim-btn:hover {
            background: #f8fafc;
        }

        .anim-btn.primary {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .anim-btn.primary:hover {
            background: #2563eb;
        }

        .anim-btn.playing {
            background: white;
            color: #374151;
            border-color: #e2e8f0;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #64748b;
        }

        .speed-slider {
            width: 80px;
            cursor: pointer;
        }

        /* Decomp View */
        .decomp-view {
            margin-top: 16px;
        }

        .decomp-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            max-width: 600px;
        }

        .decomp-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: opacity 0.3s;
        }

        .decomp-cell-label {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .decomp-cell-badge {
            display: inline-block;
            width: 22px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            background: #3b82f6;
            color: white;
            border-radius: 50%;
            font-size: 12px;
        }

        .decomp-cell-badge.active {
            background: #ef4444;
        }

        /* Decomp Controls */
        .decomp-controls {
            width: 100%;
            max-width: 900px;
            margin-top: 20px;
            padding: 14px 24px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .decomp-btn {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #e2e8f0;
            background: white;
            color: #374151;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .decomp-btn:hover {
            background: #f8fafc;
        }

        .decomp-btn.primary {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .decomp-btn.primary:hover {
            background: #2563eb;
        }

        .decomp-btn.playing {
            background: white;
            color: #374151;
            border-color: #e2e8f0;
        }

        .decomp-status {
            font-size: 14px;
            color: #64748b;
            margin-left: 12px;
            white-space: nowrap;
        }

        /* Info Section */
        .info-section {
            margin-top: 20px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border-radius: 12px;
            border: 1px solid #bfdbfe;
            max-width: 900px;
            width: 100%;
        }

        .info-section h3 {
            font-size: 14px;
            color: #3b82f6;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .info-section p {
            font-size: 13px;
            color: #1e40af;
            line-height: 1.6;
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header {
                padding: 12px 16px;
                flex-wrap: wrap;
                gap: 12px;
            }

            .header h1 {
                font-size: 18px;
            }

            .search-input {
                width: 160px;
            }

            .anim-controls {
                flex-wrap: wrap;
                justify-content: center;
            }

            .decomp-controls {
                flex-wrap: wrap;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>My<span>Word</span> 笔画顺序</h1>
        <div class="search-box">
            <input type="text" class="search-input" id="charInput" maxlength="1" placeholder="输入汉字/字母/数字" value="周">
            <button class="search-btn" onclick="loadCharacter()">🔍 搜索</button>
        </div>
    </header>

    <!-- View Toggle -->
    <div class="view-toggle">
        <button class="view-btn active" onclick="switchView('anim')" id="animBtn">🎬 动画视图</button>
        <button class="view-btn" onclick="switchView('decomp')" id="decompBtn">📝 分解视图</button>
    </div>

    <!-- Character Display -->
    <div class="char-display">
        <div class="char-text" id="charText">周</div>
        <div class="char-info" id="charInfo">总笔画: 8 画</div>
    </div>

    <!-- Loading -->
    <div class="loading hidden" id="loading">
        <div class="loading-spinner"></div>
        <div>正在加载笔画数据...</div>
    </div>

    <!-- Animation View -->
    <div id="animView" class="anim-view">
        <div class="tianzige" style="width: 280px; height: 280px;">
            <div class="tianzige-line-h"></div>
            <div class="tianzige-line-v"></div>
            <div class="tianzige-content" id="animWriter"></div>
        </div>

        <div class="anim-status" id="animStatus">准备书写</div>

        <div class="anim-controls">
            <button class="anim-btn" onclick="resetAnimation()">🔄 重置</button>
            <button class="anim-btn primary" onclick="toggleAnimation()" id="animPlayBtn">▶ 播放</button>
            <button class="anim-btn" onclick="stepAnimation()">⏭ 下一笔</button>
            <div class="speed-control">
                速度:
                <input type="range" class="speed-slider" min="1" max="5" value="3" onchange="setSpeed(this.value)">
                <span id="speedLabel">中</span>
            </div>
        </div>
    </div>

    <!-- Decomposition View -->
    <div id="decompView" class="decomp-view hidden">
        <div class="decomp-grid" id="decompGrid"></div>

        <div class="decomp-controls">
            <button class="decomp-btn" onclick="decompPrev()">⏮ 上一步</button>
            <button class="decomp-btn primary" onclick="decompTogglePlay()" id="decompPlayBtn">▶ 自动播放</button>
            <button class="decomp-btn" onclick="decompNext()">下一步 ⏭</button>
            <button class="decomp-btn" onclick="decompReset()">🔄 重置</button>
            <span class="decomp-status">当前: 第 <span id="decompCurrent">1</span> / <span id="decompTotal">8</span> 笔</span>
        </div>
    </div>

    <!-- Info Section -->
    <div class="info-section">
        <h3>📌 说明</h3>
        <p>动画视图：灰色预览 → 逐笔写黑 → 循环播放。</p>
        <p>分解视图：每个田字格展示到当前笔画为止的累计效果。</p>
        <p>支持汉字（7000+，数据来源于 HanziWriter 开源库）、英文字母（A-Z / a-z）和数字（0-9）的笔画顺序展示。</p>
    </div>

    <script>
        // 全局状态
        let writer = null;
        let charData = null;
        let currentChar = '周';
        let currentView = 'anim';
        let currentSpeed = 3;
        let animStrokeIndex = 0;
        let animIsPlaying = false;
        let decompStrokeIndex = 0;
        let decompIsPlaying = false;
        let decompPlayTimer = null;
        let decompBbox = null;
        let decompViewBox = null;

        // 速度配置
        const speedConfig = {
            1: { strokeSpeed: 0.4, delay: 600, label: '慢' },
            2: { strokeSpeed: 0.7, delay: 400, label: '较慢' },
            3: { strokeSpeed: 1.0, delay: 250, label: '中' },
            4: { strokeSpeed: 1.6, delay: 120, label: '较快' },
            5: { strokeSpeed: 2.8, delay: 50, label: '快' }
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadCharacter();

            document.getElementById('charInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loadCharacter();
            });
        });

        // 加载汉字
        async function loadCharacter() {
            const input = document.getElementById('charInput').value.trim();
            if (!input) return;

            currentChar = input.charAt(0);
            document.getElementById('charInput').value = currentChar;
            document.getElementById('charText').textContent = currentChar;

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('animView').classList.add('hidden');
            document.getElementById('decompView').classList.add('hidden');

            try {
                charData = await HanziWriter.loadCharacterData(currentChar);
                const strokeCount = charData.strokes.length;
                document.getElementById('charInfo').textContent = `总笔画: ${strokeCount} 画`;
                document.getElementById('decompTotal').textContent = strokeCount;

                document.getElementById('loading').classList.add('hidden');

                if (currentView === 'anim') {
                    document.getElementById('animView').classList.remove('hidden');
                    initAnimView();
                } else {
                    document.getElementById('decompView').classList.remove('hidden');
                    initDecompView();
                }
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('loading').innerHTML = '<div style="color: #ef4444;">❌ 加载失败，请检查输入</div>';
            }
        }

        // 初始化动画视图
        function initAnimView() {
            const target = document.getElementById('animWriter');
            target.innerHTML = '';

            const speed = speedConfig[currentSpeed];

            writer = HanziWriter.create('animWriter', currentChar, {
                width: 280,
                height: 280,
                padding: 12,
                showOutline: true,
                strokeAnimationSpeed: speed.strokeSpeed,
                delayBetweenStrokes: speed.delay,
                strokeColor: '#1a1a1a',
                radicalColor: '#1a1a1a',
                drawingColor: '#1a1a1a',
                outlineColor: '#d4d8dd',
                highlightColor: '#1a1a1a',
                showHintAfterMisses: 0,
                highlightOnComplete: false,
                charDataLoader: (_char, onLoad) => onLoad(charData)
            });

            animStrokeIndex = 0;
            animIsPlaying = false;
            updateAnimStatus();
            writer.showOutline();

            setTimeout(() => {
                const svgEl = document.querySelector('#animWriter svg');
                if (svgEl) {
                    const bbox = extractBBoxFromSVG(svgEl);
                    if (bbox) {
                        decompBbox = bbox;
                        decompViewBox = calcViewBox(bbox);
                    }
                }
            }, 200);
        }

        // 更新动画状态
        function updateAnimStatus() {
            const total = charData?.strokes.length ?? 0;
            const status = document.getElementById('animStatus');

            if (animStrokeIndex === 0) {
                status.textContent = '准备书写';
            } else if (animStrokeIndex > 0 && animStrokeIndex <= total) {
                status.innerHTML = `正在写第 <span class="red">${animStrokeIndex}</span> / ${total} 笔`;
            } else if (animStrokeIndex > total && total > 0) {
                status.textContent = `✅ ${total} 笔完成`;
            }
        }

        // 播放/暂停动画
        function toggleAnimation() {
            if (animIsPlaying) {
                animIsPlaying = false;
                document.getElementById('animPlayBtn').textContent = '▶ 播放';
                document.getElementById('animPlayBtn').classList.remove('playing');
                document.getElementById('animPlayBtn').classList.add('primary');
            } else {
                animIsPlaying = true;
                document.getElementById('animPlayBtn').textContent = '⏸ 暂停';
                document.getElementById('animPlayBtn').classList.add('playing');
                document.getElementById('animPlayBtn').classList.remove('primary');
                playAnimation();
            }
        }

        // 播放动画
        function playAnimation() {
            if (!animIsPlaying || !writer) return;

            const total = charData.strokes.length;

            if (animStrokeIndex < total) {
                writer.animateStroke(animStrokeIndex, {
                    onComplete: () => {
                        animStrokeIndex++;
                        updateAnimStatus();
                        setTimeout(() => playAnimation(), 100);
                    }
                });
            } else {
                // 循环播放
                setTimeout(() => {
                    animStrokeIndex = 0;
                    writer.hideCharacter();
                    writer.showOutline();
                    updateAnimStatus();
                    if (animIsPlaying) playAnimation();
                }, 1800);
            }
        }

        // 重置动画
        function resetAnimation() {
            animIsPlaying = false;
            animStrokeIndex = 0;
            document.getElementById('animPlayBtn').textContent = '▶ 播放';
            document.getElementById('animPlayBtn').classList.remove('playing');
            document.getElementById('animPlayBtn').classList.add('primary');
            if (writer) {
                writer.hideCharacter();
                writer.showOutline();
            }
            updateAnimStatus();
        }

        // 单步动画
        function stepAnimation() {
            if (!writer) return;
            const total = charData.strokes.length;
            if (animStrokeIndex >= total) return;

            writer.animateStroke(animStrokeIndex, {
                onComplete: () => {
                    animStrokeIndex++;
                    updateAnimStatus();
                }
            });
        }

        // 设置速度
        function setSpeed(level) {
            currentSpeed = parseInt(level);
            document.getElementById('speedLabel').textContent = speedConfig[currentSpeed].label;
            if (currentView === 'anim' && charData) initAnimView();
        }

        // 从SVG中提取bbox
        function extractBBoxFromSVG(svgEl) {
            const paths = svgEl.querySelectorAll('path');
            if (paths.length === 0) return null;

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

            paths.forEach(p => {
                const d = p.getAttribute('d') || '';
                const nums = d.match(/-?\d+\.?\d*/g);
                if (!nums || nums.length < 2) return;
                for (let i = 0; i < nums.length; i += 2) {
                    const x = parseFloat(nums[i]);
                    const y = parseFloat(nums[i + 1]);
                    if (!isNaN(x)) {
                        minX = Math.min(minX, x);
                        maxX = Math.max(maxX, x);
                    }
                    if (!isNaN(y)) {
                        minY = Math.min(minY, y);
                        maxY = Math.max(maxY, y);
                    }
                }
            });

            if (!isFinite(minX)) return null;
            return { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY };
        }

        // 计算viewBox
        function calcViewBox(bbox, pad = 0.2) {
            const vbX = bbox.minX - bbox.w * pad;
            const vbY = bbox.minY - bbox.h * pad;
            const vbW = bbox.w * (1 + 2 * pad);
            const vbH = bbox.h * (1 + 2 * pad);
            return `${vbX} ${vbY} ${vbW} ${vbH}`;
        }

        // 构建分解视图SVG
        function buildDecompSvg(strokes, strokeCount, viewBox, bbox) {
            let paths = '';
            for (let i = 0; i < strokeCount && i < strokes.length; i++) {
                const isLatest = i === strokeCount - 1;
                const color = isLatest ? '#ef4444' : '#1a1a1a';
                paths += `<path d="${strokes[i]}" fill="${color}" stroke="none"/>`;
            }

            const flipY = bbox.minY + bbox.maxY;
            return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${viewBox}" width="100%" height="100%" style="display:block"><g transform="translate(0,${flipY}) scale(1,-1)">${paths}</g></svg>`;
        }

        // 初始化分解视图
        function initDecompView() {
            const grid = document.getElementById('decompGrid');
            grid.innerHTML = '';

            const strokes = charData.strokes;
            const total = strokes.length;

            if (decompBbox && decompViewBox) {
                renderDecompGrid(grid, strokes, total);
                return;
            }

            setTimeout(() => {
                const animSvgEl = document.querySelector('#animWriter svg');
                if (animSvgEl) {
                    const bbox = extractBBoxFromSVG(animSvgEl);
                    if (bbox) {
                        decompBbox = bbox;
                        decompViewBox = calcViewBox(bbox);
                        renderDecompGrid(grid, strokes, total);
                    }
                }
            }, 300);
        }

        // 渲染分解视图网格
        function renderDecompGrid(grid, strokes, total) {
            grid.innerHTML = '';

            for (let i = 0; i < total; i++) {
                const isActive = i <= decompStrokeIndex;
                const opacity = isActive ? 1 : 0.4;
                const badgeBg = i === decompStrokeIndex ? '#ef4444' : '#3b82f6';

                const svgString = buildDecompSvg(strokes, i + 1, decompViewBox, decompBbox);

                const cell = document.createElement('div');
                cell.className = 'decomp-cell';
                cell.style.opacity = opacity;

                cell.innerHTML = `
                    <div class="tianzige" style="width: 160px; height: 160px;">
                        <div class="tianzige-line-h"></div>
                        <div class="tianzige-line-v"></div>
                        <div class="tianzige-content">${svgString}</div>
                    </div>
                    <div class="decomp-cell-label">
                        <span class="decomp-cell-badge${i === decompStrokeIndex ? ' active' : ''}" style="background: ${badgeBg}">${i + 1}</span>
                        第${i + 1}笔
                    </div>
                `;

                grid.appendChild(cell);
            }

            document.getElementById('decompCurrent').textContent = decompStrokeIndex + 1;
        }

        // 分解视图 - 上一步
        function decompPrev() {
            if (decompStrokeIndex > 0) {
                decompStrokeIndex--;
                updateDecompView();
            }
        }

        // 分解视图 - 下一步
        function decompNext() {
            if (decompStrokeIndex < charData.strokes.length - 1) {
                decompStrokeIndex++;
                updateDecompView();
            }
        }

        // 分解视图 - 播放/暂停
        function decompTogglePlay() {
            if (decompIsPlaying) {
                decompIsPlaying = false;
                if (decompPlayTimer) {
                    clearInterval(decompPlayTimer);
                    decompPlayTimer = null;
                }
                document.getElementById('decompPlayBtn').textContent = '▶ 自动播放';
                document.getElementById('decompPlayBtn').classList.remove('playing');
                document.getElementById('decompPlayBtn').classList.add('primary');
            } else {
                decompIsPlaying = true;
                document.getElementById('decompPlayBtn').textContent = '⏸ 暂停';
                document.getElementById('decompPlayBtn').classList.add('playing');
                document.getElementById('decompPlayBtn').classList.remove('primary');
                decompPlay();
            }
        }

        // 分解视图 - 自动播放
        function decompPlay() {
            if (!decompIsPlaying) return;

            decompPlayTimer = setInterval(() => {
                if (decompStrokeIndex < charData.strokes.length - 1) {
                    decompStrokeIndex++;
                    updateDecompView();
                } else {
                    decompIsPlaying = false;
                    clearInterval(decompPlayTimer);
                    decompPlayTimer = null;
                    document.getElementById('decompPlayBtn').textContent = '▶ 自动播放';
                    document.getElementById('decompPlayBtn').classList.remove('playing');
                    document.getElementById('decompPlayBtn').classList.add('primary');
                }
            }, 500);
        }

        // 分解视图 - 重置
        function decompReset() {
            decompIsPlaying = false;
            if (decompPlayTimer) {
                clearInterval(decompPlayTimer);
                decompPlayTimer = null;
            }
            decompStrokeIndex = 0;
            document.getElementById('decompPlayBtn').textContent = '▶ 自动播放';
            document.getElementById('decompPlayBtn').classList.remove('playing');
            document.getElementById('decompPlayBtn').classList.add('primary');
            updateDecompView();
        }

        // 更新分解视图
        function updateDecompView() {
            if (!decompBbox || !decompViewBox) return;
            const grid = document.getElementById('decompGrid');
            const strokes = charData.strokes;
            const total = strokes.length;
            renderDecompGrid(grid, strokes, total);
        }

        // 切换视图
        function switchView(view) {
            currentView = view;

            document.getElementById('animBtn').classList.toggle('active', view === 'anim');
            document.getElementById('decompBtn').classList.toggle('active', view === 'decomp');

            if (view === 'anim') {
                document.getElementById('animView').classList.remove('hidden');
                document.getElementById('decompView').classList.add('hidden');
                if (charData) initAnimView();
            } else {
                document.getElementById('animView').classList.add('hidden');
                document.getElementById('decompView').classList.remove('hidden');
                if (charData) initDecompView();
            }
        }
    </script>
</body>
</html>
