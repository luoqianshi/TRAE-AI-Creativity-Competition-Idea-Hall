<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0E27">
<title>Particle Memories · 让每一张照片再次活过来</title>
<style>
/* ============== 基础重置 ============== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", "Source Han Sans CN", "Segoe UI", sans-serif;
  color: #fff;
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100vh;
  /* 整体氛围：深邃夜空蓝 + 霓虹紫光晕 */
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124, 58, 237, 0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(245, 197, 24, 0.06) 0%, transparent 60%),
    linear-gradient(180deg, #0A0E27 0%, #0d1230 50%, #0A0E27 100%);
  background-attachment: fixed;
  display: flex;
  flex-direction: column;
}

/* ============== 顶栏 ============== */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 24px;
  position: relative;
  z-index: 10;
}
.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.9);
}
.logo-mark {
  display: inline-block;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: conic-gradient(from 90deg, #7C3AED 0deg, #F5C518 180deg, #7C3AED 360deg);
  position: relative;
  box-shadow: 0 0 12px rgba(124, 58, 237, 0.6);
}
.logo-mark::after {
  content: "";
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  background: #0A0E27;
}

.perf-switch {
  display: inline-flex;
  padding: 3px;
  border-radius: 100px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.perf-switch button {
  background: transparent;
  border: 0;
  color: rgba(255, 255, 255, 0.55);
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 500;
  border-radius: 100px;
  cursor: pointer;
  transition: all 0.25s ease;
  font-family: inherit;
  letter-spacing: 0.5px;
}
.perf-switch button:hover { color: rgba(255, 255, 255, 0.85); }
.perf-switch button.active {
  background: linear-gradient(135deg, #7C3AED 0%, #5B21B6 100%);
  color: #fff;
  box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
}

/* ============== Hero ============== */
.hero {
  text-align: center;
  padding: 24px 24px 8px;
  position: relative;
  z-index: 5;
}
.hero-title {
  font-size: clamp(30px, 5.2vw, 56px);
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -0.025em;
  background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.72) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 14px;
}
.hero-title .accent {
  background: linear-gradient(180deg, #F5C518 0%, #7C3AED 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero-sub {
  font-size: clamp(14px, 1.8vw, 18px);
  color: rgba(255, 255, 255, 0.55);
  font-weight: 400;
  letter-spacing: 0.02em;
}

/* ============== 舞台 ============== */
.stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px 16px 12px;
  gap: 18px;
  position: relative;
  z-index: 1;
}
.canvas-wrap {
  position: relative;
  width: 100%;
  max-width: 540px;
  aspect-ratio: 4 / 5;
  border-radius: 28px;
  overflow: hidden;
  background: #050818;
  box-shadow:
    0 30px 80px -20px rgba(0, 0, 0, 0.7),
    0 0 0 1px rgba(255, 255, 255, 0.06),
    inset 0 0 0 1px rgba(124, 58, 237, 0.08);
  touch-action: none;
}
#canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: crosshair;
}

/* 进度遮罩 */
.progress {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: rgba(10, 14, 39, 0.78);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 10;
  opacity: 1;
  transition: opacity 0.4s ease;
  pointer-events: none;
}
.progress.hidden { opacity: 0; pointer-events: none; }
.progress-spinner {
  width: 36px;
  height: 36px;
  border: 2.5px solid rgba(255, 255, 255, 0.1);
  border-top-color: #7C3AED;
  border-right-color: #F5C518;
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.progress-text {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.7);
  letter-spacing: 0.05em;
}
.progress-percent {
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(135deg, #F5C518 0%, #7C3AED 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-variant-numeric: tabular-nums;
}

/* 阶段指示器 */
.stage-indicator {
  position: absolute;
  top: 16px;
  left: 16px;
  display: flex;
  gap: 6px;
  z-index: 5;
  opacity: 0.7;
}
.stage-indicator .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.25);
  transition: all 0.3s ease;
}
.stage-indicator .dot.active {
  background: #F5C518;
  box-shadow: 0 0 8px rgba(245, 197, 24, 0.6);
  transform: scale(1.4);
}

/* 拖放提示 */
.drop-hint {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(124, 58, 237, 0.18);
  border: 2px dashed rgba(124, 58, 237, 0.6);
  border-radius: 28px;
  z-index: 20;
  font-size: 16px;
  color: #fff;
  letter-spacing: 0.05em;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s ease;
}
.drop-hint.visible { opacity: 1; }

/* ============== 控件 ============== */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  max-width: 540px;
  width: 100%;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #fff;
  padding: 10px 18px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
  letter-spacing: 0.02em;
  user-select: none;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.btn:hover {
  background: rgba(255, 255, 255, 0.08);
  transform: translateY(-1px);
}
.btn:active { transform: translateY(0); }
.btn svg { display: block; }
.btn-primary {
  background: linear-gradient(135deg, #7C3AED 0%, #5B21B6 100%);
  border-color: rgba(124, 58, 237, 0.5);
  box-shadow: 0 6px 20px -4px rgba(124, 58, 237, 0.5);
}
.btn-primary:hover {
  background: linear-gradient(135deg, #8B45F5 0%, #6D28D9 100%);
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}
.btn input { display: none; }

.hint {
  text-align: center;
  font-size: 12px;
  color: rgba(255, 255, 255, 0.35);
  letter-spacing: 0.05em;
  margin-top: -2px;
}

/* ============== 底部 ============== */
footer {
  text-align: center;
  padding: 14px 20px 18px;
  color: rgba(255, 255, 255, 0.28);
  font-size: 11px;
  letter-spacing: 0.1em;
}

/* ============== 移动端适配 ============== */
@media (max-width: 640px) {
  .top-bar { padding: 14px 16px; }
  .hero { padding: 12px 16px 4px; }
  .hero-title { font-size: 32px; }
  .stage { padding: 10px 12px 8px; gap: 12px; }
  .canvas-wrap { max-width: 100%; border-radius: 22px; }
  .controls { gap: 8px; }
  .btn { padding: 9px 14px; font-size: 12px; }
  .perf-switch button { padding: 5px 10px; font-size: 11px; }
  .logo { font-size: 12px; letter-spacing: 1px; }
}

@media (max-width: 380px) {
  .controls .btn-label { display: none; }
}

/* ============== 进场动画 ============== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.top-bar { animation: fadeUp 0.8s ease 0.1s both; }
.hero { animation: fadeUp 0.8s ease 0.25s both; }
.stage { animation: fadeUp 0.8s ease 0.4s both; }
footer { animation: fadeUp 0.8s ease 0.6s both; }
</style>
</head>
<body>

<!-- 顶栏：Logo + 性能档位切换 -->
<header class="top-bar">
  <div class="logo">
    <span class="logo-mark"></span>
    <span class="logo-text">Particle Memories</span>
  </div>
  <div class="perf-switch" role="tablist" aria-label="性能档位切换">
    <button data-perf="low" type="button">低</button>
    <button data-perf="mid" type="button" class="active">中</button>
    <button data-perf="high" type="button">高</button>
  </div>
</header>

<!-- Hero 标题区 -->
<section class="hero">
  <h1 class="hero-title">让每一张照片，<br><span class="accent">再次活过来</span></h1>
  <p class="hero-sub">上传一张照片，看见它的第二次呼吸</p>
</section>

<!-- 舞台：画布 + 进度 + 控件 -->
<main class="stage">
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="canvas"></canvas>
    <div class="stage-indicator" id="stageIndicator">
      <span class="dot" data-stage="SCATTER"></span>
      <span class="dot" data-stage="VORTEX"></span>
      <span class="dot" data-stage="REFORM"></span>
      <span class="dot" data-stage="HOLD"></span>
    </div>
    <div class="progress hidden" id="progress">
      <div class="progress-spinner"></div>
      <div class="progress-text" id="progressText">正在打散像素...</div>
      <div class="progress-percent" id="progressPercent">0%</div>
    </div>
    <div class="drop-hint" id="dropHint">松开鼠标加载图片</div>
  </div>

  <div class="controls">
    <label class="btn btn-primary" for="fileInput">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <span class="btn-label">上传照片</span>
      <input type="file" id="fileInput" accept="image/*">
    </label>
    <button class="btn" id="replayBtn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
      </svg>
      <span class="btn-label">重新播放</span>
    </button>
    <button class="btn" id="pauseBtn" type="button">
      <svg id="pauseIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="4" width="4" height="16" rx="1"/>
        <rect x="14" y="4" width="4" height="16" rx="1"/>
      </svg>
      <span class="btn-label" id="pauseText">暂停</span>
    </button>
    <button class="btn" id="downloadBtn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span class="btn-label">保存当前帧</span>
    </button>
  </div>

  <p class="hint">点击画面任意位置可重播 · 移动鼠标与粒子互动</p>
</main>

<footer>Made with TRAE · 灵感来自生活</footer>

<script>
'use strict';

/* ============================================================
 * Particle Memories · 让照片再次活过来
 * 单文件实现：纯 Canvas 2D + 原生 JS
 * 4 段动画：散开 → 漩涡 → 重组 → 定格+淡出 → 循环
 * ============================================================ */

/* ============ 1. 性能档位配置 ============ */
// 三档预设：粒子总数、采样图像短边、内部渲染分辨率
const PERFORMANCE_PRESETS = {
  low:  { count: 12000, shortSide: 520,  renderW: 640,  renderH: 800  },
  mid:  { count: 28000, shortSide: 720,  renderW: 800,  renderH: 1000 },
  high: { count: 48000, shortSide: 960,  renderW: 1000, renderH: 1250 }
};

// 当前档位（默认 mid）
let currentPerf = 'mid';

/* ============ 2. 全局状态 ============ */
const state = {
  particles: [],         // 粒子对象数组
  stage: 'IDLE',         // 当前阶段
  stageStart: 0,         // 当前阶段起始时间
  lastTime: 0,           // 上一帧时间
  isPaused: false,       // 是否暂停
  rafId: null,           // requestAnimationFrame id
  mouseX: -9999,         // 鼠标 x（画布内部坐标）
  mouseY: -9999,         // 鼠标 y
  mouseActive: false,    // 鼠标是否在画布上
  imgRect: null,         // 图像在画布中的绘制矩形 {x,y,w,h}
  sourceImage: null,     // 当前展示的图像（HTMLImageElement / HTMLCanvasElement）
  sourceLabel: '演示图'   // 当前图像的描述
};

/* ============ 3. 动画阶段定义 ============ */
// 4 段动画 + 1 段淡出，next 指向循环到的下一阶段
// HOLD 阶段后接 FADE，结束 FADE 后回到 SCATTER 并重置粒子位置
const STAGES = {
  SCATTER: { duration: 1800, label: '散开' },
  VORTEX:  { duration: 1700, label: '漩涡' },
  REFORM:  { duration: 2500, label: '重组' },
  HOLD:    { duration: 1500, label: '定格' },
  FADE:    { duration: 700,  label: '淡出' }
};
const STAGE_ORDER = ['SCATTER', 'VORTEX', 'REFORM', 'HOLD', 'FADE'];

/* ============ 4. DOM 引用 ============ */
const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const ctx = canvas.getContext('2d', { alpha: false });
const wrap = $('canvasWrap');
const fileInput = $('fileInput');
const replayBtn = $('replayBtn');
const pauseBtn = $('pauseBtn');
const pauseText = $('pauseText');
const pauseIcon = $('pauseIcon');
const downloadBtn = $('downloadBtn');
const progressEl = $('progress');
const progressText = $('progressText');
const progressPercent = $('progressPercent');
const dropHint = $('dropHint');
const stageDots = document.querySelectorAll('.stage-indicator .dot');
const perfButtons = document.querySelectorAll('.perf-switch button');

/* ============ 5. 工具函数 ============ */
function lerp(a, b, t) { return a + (b - a) * t; }
// 三次缓入缓出：动画最常用的 S 曲线
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
function clamp(v, min, max) { return v < min ? min : v > max ? max : v; }
function rand(min, max) { return min + Math.random() * (max - min); }

/* ============ 6. 演示图：程序化生成（夜空下的人物剪影） ============ */
// 在离屏 canvas 上绘制一张有「夜空 + 月亮 + 城市 + 人物」的画面
// 这样不依赖任何外部资源，离线也能看到效果
function generateDemoImage() {
  const W = canvas.width;
  const H = canvas.height;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');

  // 6.1 天空渐变：夜空蓝 → 紫 → 地平线暖橙
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0,    '#070b22');
  sky.addColorStop(0.35, '#1a1f4a');
  sky.addColorStop(0.65, '#5b2466');
  sky.addColorStop(0.82, '#a04858');
  sky.addColorStop(1,    '#3d1a4a');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);

  // 6.2 星星（仅在上半部分）
  for (let i = 0; i < 360; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H * 0.5;
    const r = Math.random() * 1.3 + 0.3;
    g.fillStyle = `rgba(255, 250, 230, ${Math.random() * 0.85 + 0.15})`;
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }
  // 6.3 几颗带光晕的亮星
  for (let i = 0; i < 7; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H * 0.4;
    const glow = g.createRadialGradient(x, y, 0, x, y, 14);
    glow.addColorStop(0,   'rgba(255, 240, 200, 0.7)');
    glow.addColorStop(0.4, 'rgba(255, 220, 150, 0.15)');
    glow.addColorStop(1,   'rgba(255, 200, 100, 0)');
    g.fillStyle = glow;
    g.beginPath();
    g.arc(x, y, 14, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = '#fff5d8';
    g.beginPath();
    g.arc(x, y, 1.8, 0, Math.PI * 2);
    g.fill();
  }

  // 6.4 月亮 + 大范围光晕
  const mx = W * 0.72, my = H * 0.22;
  const halo = g.createRadialGradient(mx, my, 10, mx, my, 120);
  halo.addColorStop(0,   'rgba(255, 240, 200, 0.5)');
  halo.addColorStop(0.25, 'rgba(255, 220, 150, 0.18)');
  halo.addColorStop(1,   'rgba(255, 200, 100, 0)');
  g.fillStyle = halo;
  g.beginPath();
  g.arc(mx, my, 120, 0, Math.PI * 2);
  g.fill();
  g.fillStyle = '#f8e8b8';
  g.beginPath();
  g.arc(mx, my, 30, 0, Math.PI * 2);
  g.fill();
  // 月亮阴影细节
  g.fillStyle = 'rgba(216, 184, 136, 0.55)';
  g.beginPath();
  g.arc(mx - 11, my - 6, 26, 0, Math.PI * 2);
  g.fill();

  // 6.5 远山轮廓
  g.fillStyle = '#1a0f3a';
  g.beginPath();
  g.moveTo(0, H * 0.65);
  for (let x = 0; x <= W; x += 16) {
    const h = Math.sin(x * 0.014) * 28 + Math.cos(x * 0.008) * 18 + Math.sin(x * 0.03) * 8;
    g.lineTo(x, H * 0.65 - h);
  }
  g.lineTo(W, H);
  g.lineTo(0, H);
  g.closePath();
  g.fill();

  // 6.6 城市天际线（高低错落的建筑群）
  g.fillStyle = '#0a0e27';
  g.beginPath();
  g.moveTo(0, H * 0.78);
  let cx = 0;
  while (cx < W) {
    const bw = Math.random() * 28 + 14;
    const bh = Math.random() * 60 + 25;
    g.lineTo(cx, H * 0.78);
    g.lineTo(cx, H * 0.78 - bh);
    g.lineTo(cx + bw, H * 0.78 - bh);
    g.lineTo(cx + bw, H * 0.78);
    cx += bw;
  }
  g.lineTo(W, H);
  g.lineTo(0, H);
  g.closePath();
  g.fill();

  // 6.7 城市窗户的暖色灯光
  for (let i = 0; i < 220; i++) {
    const x = Math.random() * W;
    const y = H * 0.52 + Math.random() * H * 0.24;
    const alpha = Math.random() * 0.9 + 0.1;
    const warm = Math.random() > 0.3;
    g.fillStyle = warm
      ? `rgba(255, 200, 100, ${alpha})`
      : `rgba(180, 210, 255, ${alpha})`;
    g.fillRect(x, y, 1.6, 2);
  }

  // 6.8 前景人物剪影（望向月亮）
  const fx = W * 0.3, fy = H * 0.88;
  g.fillStyle = '#000';
  // 头
  g.beginPath();
  g.arc(fx, fy - 145, 26, 0, Math.PI * 2);
  g.fill();
  // 躯干
  g.beginPath();
  g.moveTo(fx - 38, fy - 100);
  g.lineTo(fx + 38, fy - 100);
  g.lineTo(fx + 55, fy - 35);
  g.lineTo(fx - 55, fy - 35);
  g.closePath();
  g.fill();
  // 腿
  g.beginPath();
  g.moveTo(fx - 55, fy - 35);
  g.lineTo(fx - 48, fy);
  g.lineTo(fx - 22, fy);
  g.lineTo(fx - 28, fy - 35);
  g.moveTo(fx + 28, fy - 35);
  g.lineTo(fx + 22, fy);
  g.lineTo(fx + 48, fy);
  g.lineTo(fx + 55, fy - 35);
  g.fill();
  // 一只抬起指向月亮的手臂
  g.beginPath();
  g.moveTo(fx + 30, fy - 95);
  g.lineTo(fx + 90, fy - 150);
  g.lineTo(fx + 95, fy - 142);
  g.lineTo(fx + 35, fy - 88);
  g.closePath();
  g.fill();

  // 6.9 地面反光
  const refl = g.createLinearGradient(0, H * 0.85, 0, H);
  refl.addColorStop(0, 'rgba(255, 200, 100, 0.12)');
  refl.addColorStop(1, 'rgba(0, 0, 0, 0)');
  g.fillStyle = refl;
  g.fillRect(0, H * 0.85, W, H * 0.15);

  return c;
}

/* ============ 7. 粒子类 ============ */
class Particle {
  constructor(x, y, r, g, b) {
    this.x = x;       // 当前位置 x
    this.y = y;       // 当前位置 y
    this.tx = x;      // 目标位置 x（图片原始位置）
    this.ty = y;      // 目标位置 y
    this.vx = 0;      // 当前速度 x
    this.vy = 0;      // 当前速度 y
    this.r = r;       // 颜色 R
    this.g = g;       // 颜色 G
    this.b = b;       // 颜色 B
    this.size = 1.4;  // 粒子半径（渲染时为正方形）
    this.alpha = 1;   // 透明度 0~1
    // 散开阶段预生成的随机参数
    this.scatterAngle = Math.random() * Math.PI * 2;
    this.scatterPower = rand(4, 14);
    this.scatterSpin = rand(-0.06, 0.06);
    // 漩涡阶段使用的极坐标
    this.vortexR = 0;
    this.vortexA = 0;
  }
}

/* ============ 8. 图像处理：等距网格采样为粒子 ============ */
// 将任意图像绘制到与画布同尺寸的临时 canvas，然后按等距网格采样像素
// 透明 / 极暗的像素会被跳过，避免产生无意义粒子
function sampleImageToParticles(source, totalCount) {
  const W = canvas.width;
  const H = canvas.height;

  // 8.1 创建临时 canvas 并绘制图像（按 contain 方式缩放）
  const tmp = document.createElement('canvas');
  tmp.width = W;
  tmp.height = H;
  const tctx = tmp.getContext('2d');
  tctx.fillStyle = '#000';
  tctx.fillRect(0, 0, W, H);

  // 计算适合绘制区域（保持纵横比，居中）
  const sw = source.width || source.naturalWidth;
  const sh = source.height || source.naturalHeight;
  const scale = Math.min(W / sw, H / sh);
  const dw = sw * scale;
  const dh = sh * scale;
  const dx = (W - dw) / 2;
  const dy = (H - dh) / 2;
  tctx.drawImage(source, dx, dy, dw, dh);
  state.imgRect = { x: dx, y: dy, w: dw, h: dh };

  // 8.2 读取像素
  const imgData = tctx.getImageData(0, 0, W, H);
  const data = imgData.data;

  // 8.3 按等距网格采样：估算列数 × 行数
  const aspect = W / H;
  const cols = Math.round(Math.sqrt(totalCount * aspect));
  const rows = Math.max(1, Math.round(totalCount / cols));
  const cellW = W / cols;
  const cellH = H / rows;

  const particles = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      // 网格中心采样 + 微随机偏移（避免过于规整）
      const px = Math.floor(c * cellW + cellW / 2 + rand(-cellW * 0.3, cellW * 0.3));
      const py = Math.floor(r * cellH + cellH / 2 + rand(-cellH * 0.3, cellH * 0.3));
      if (px < 0 || px >= W || py < 0 || py >= H) continue;
      const i = (py * W + px) * 4;
      const a = data[i + 3];
      // 跳过完全透明的像素
      if (a < 30) continue;
      // 跳过近乎全黑像素（背景）
      const lum = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
      if (lum < 8) continue;
      particles.push(new Particle(px, py, data[i], data[i + 1], data[i + 2]));
    }
  }

  // 8.4 暗图暖色滤镜：若整图亮度偏低，叠加暖色（满足"主色过暗"约束）
  applyWarmFilterIfDark(particles);

  return particles;
}

function applyWarmFilterIfDark(particles) {
  if (particles.length === 0) return;
  let total = 0;
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    total += (p.r * 0.299 + p.g * 0.587 + p.b * 0.114);
  }
  const avg = total / particles.length;
  if (avg < 70) {
    // 整图偏暗：每颗粒子叠加 0.3 透明度的暖金色，并轻微提亮
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.r = Math.min(255, p.r * 1.15 + 245 * 0.18);
      p.g = Math.min(255, p.g * 1.05 + 197 * 0.18);
      p.b = Math.min(255, p.b * 0.95 + 24  * 0.10);
    }
    console.log('[粒子] 检测到暗图，已自动叠加暖色滤镜，平均亮度=', avg.toFixed(1));
  }
}

/* ============ 9. 进度显示 ============ */
function showProgress(text) {
  progressEl.classList.remove('hidden');
  progressText.textContent = text || '正在生成粒子...';
  progressPercent.textContent = '0%';
}
function setProgress(p, text) {
  progressPercent.textContent = Math.round(p * 100) + '%';
  if (text) progressText.textContent = text;
}
function hideProgress() {
  setTimeout(() => progressEl.classList.add('hidden'), 200);
}

/* ============ 10. 加载并初始化（演示图 / 上传图通用） ============ */
function loadSource(source, label) {
  state.sourceImage = source;
  state.sourceLabel = label || '用户图片';
  showProgress('正在打散像素...');
  // 让浏览器有机会绘制进度 UI
  requestAnimationFrame(() => {
    setTimeout(() => {
      const preset = PERFORMANCE_PRESETS[currentPerf];
      const count = preset.count;
      // 简单分步：先采样 50%，再采样 50%
      // 为了避免重复采样，直接一次性完成（30000 像素采样 < 300ms）
      setProgress(0.4, '采样像素中...');
      const tempParticles = sampleImageToParticles(source, count);
      setProgress(0.85, '校准粒子位置...');
      state.particles = tempParticles;
      setProgress(1, '完成，共 ' + tempParticles.length + ' 颗粒子');
      console.log('[粒子] 已生成', tempParticles.length, '颗粒子，档位=', currentPerf);
      hideProgress();
      // 启动动画
      startAnimation();
    }, 50);
  });
}

/* ============ 11. 画布尺寸 ============ */
function resizeCanvas() {
  const preset = PERFORMANCE_PRESETS[currentPerf];
  canvas.width = preset.renderW;
  canvas.height = preset.renderH;
}

/* ============ 12. 阶段切换 ============ */
function setStage(name) {
  state.stage = name;
  state.stageStart = performance.now();
  console.log('[Stage] → ' + name + ' (' + STAGES[name].label + ')');
  // 更新左上角阶段指示点
  stageDots.forEach(dot => {
    dot.classList.toggle('active', dot.dataset.stage === name);
  });
}

// 重置粒子到原图位置，准备新一轮循环
function resetParticles() {
  for (let i = 0; i < state.particles.length; i++) {
    const p = state.particles[i];
    p.x = p.tx;
    p.y = p.ty;
    p.vx = 0;
    p.vy = 0;
    p.alpha = 1;
    p.vortexR = 0;
    p.vortexA = 0;
  }
}

/* ============ 13. 阶段更新逻辑 ============ */
function updateScatter(p, dt) {
  // 散开：从原图位置向外飞散，初始冲量 + 重力 + 摩擦
  const ps = state.particles;
  for (let i = 0; i < ps.length; i++) {
    const part = ps[i];
    // 起始帧施加冲量
    if (p < 0.04) {
      part.vx = Math.cos(part.scatterAngle) * part.scatterPower;
      part.vy = Math.sin(part.scatterAngle) * part.scatterPower - 3; // 略微向上
    }
    part.vy += 0.18;           // 重力
    part.vx *= 0.985;          // 空气阻力
    part.vy *= 0.985;
    part.x += part.vx;
    part.y += part.vy;
    // 透明度：开场为 1，渐淡至 0.7
    part.alpha = lerp(1, 0.75, p);
  }
}

function updateVortex(p, dt) {
  // 漩涡：所有粒子绕画面中心旋转，形成能量漩涡
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const ps = state.particles;
  for (let i = 0; i < ps.length; i++) {
    const part = ps[i];
    if (part.vortexR === 0) {
      // 进入漩涡第一帧：记录当前极坐标
      const dx = part.x - cx;
      const dy = part.y - cy;
      part.vortexR = Math.hypot(dx, dy);
      part.vortexA = Math.atan2(dy, dx);
    }
    // 角速度：靠近中心转得快，远处转得慢（差异化产生螺旋感）
    const angVel = 0.06 + (1 - clamp(part.vortexR / (canvas.width * 0.6), 0, 1)) * 0.05;
    part.vortexA += angVel;
    // 半径随时间缓慢收缩再外扩：先内收后外推
    let r = part.vortexR;
    if (p < 0.5) {
      r *= (1 - p * 0.1 * 0.02);
    } else {
      r *= (1 + (p - 0.5) * 0.15 * 0.02);
    }
    part.x = cx + Math.cos(part.vortexA) * r;
    part.y = cy + Math.sin(part.vortexA) * r;
    part.alpha = lerp(0.7, 0.95, Math.sin(p * Math.PI));
  }
}

function updateReform(p, dt) {
  // 重组：粒子从当前位置飞回原始图片位置，先轮廓后细节
  const eased = easeInOutCubic(p);
  // 用 progress 决定追随强度：开始慢、中间快、结尾稳
  const k = 0.05 + eased * 0.12;
  const ps = state.particles;
  for (let i = 0; i < ps.length; i++) {
    const part = ps[i];
    part.x += (part.tx - part.x) * k;
    part.y += (part.ty - part.y) * k;
    // 透明度从 0.6 升到 1，颜色保持
    part.alpha = lerp(0.6, 1, eased);
  }
}

function updateHold(p, dt) {
  // 定格：完整画面稳定停留
  const ps = state.particles;
  for (let i = 0; i < ps.length; i++) {
    const part = ps[i];
    // 极小的"呼吸"位移（用极低强度的正弦扰动让画面有"活着"的感觉）
    const breath = Math.sin(performance.now() * 0.001 + part.tx * 0.01) * 0.3;
    part.x = part.tx + breath;
    part.y = part.ty;
    part.alpha = 1;
  }
}

function updateFade(p, dt) {
  // 淡出：透明度线性降至 0
  const ps = state.particles;
  for (let i = 0; i < ps.length; i++) {
    const part = ps[i];
    part.alpha = 1 - p;
  }
}

function updateMouseRepulsion() {
  if (!state.mouseActive) return;
  const radius = 90;
  const force = 14;
  const r2 = radius * radius;
  const mx = state.mouseX;
  const my = state.mouseY;
  const ps = state.particles;
  for (let i = 0; i < ps.length; i++) {
    const part = ps[i];
    const dx = part.x - mx;
    const dy = part.y - my;
    const d2 = dx * dx + dy * dy;
    if (d2 < r2 && d2 > 0.01) {
      const d = Math.sqrt(d2);
      const f = (1 - d / radius) * force;
      part.x += (dx / d) * f;
      part.y += (dy / d) * f;
    }
  }
}

/* ============ 14. 渲染 ============ */
function render() {
  // 14.1 清屏：用深色覆盖（不透明）
  ctx.fillStyle = '#050818';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 14.2 漩涡和散开阶段使用 additive blending，让粒子重叠产生辉光
  if (state.stage === 'SCATTER' || state.stage === 'VORTEX') {
    ctx.globalCompositeOperation = 'lighter';
  } else {
    ctx.globalCompositeOperation = 'source-over';
  }

  // 14.3 逐个绘制粒子（fillRect 比 arc 快，且在低分辨率下肉眼无差别）
  const ps = state.particles;
  for (let i = 0; i < ps.length; i++) {
    const part = ps[i];
    if (part.alpha <= 0.01) continue;
    const a = part.alpha;
    // 预乘到 0~255
    const ai = (a * 255) | 0;
    ctx.fillStyle = 'rgba(' + part.r + ',' + part.g + ',' + part.b + ',' + a.toFixed(3) + ')';
    const s = part.size;
    ctx.fillRect(part.x - s * 0.5, part.y - s * 0.5, s, s);
  }

  ctx.globalCompositeOperation = 'source-over';

  // 14.4 在画面四周做一次极淡的暗角（增加氛围）
  const W = canvas.width, H = canvas.height;
  const vg = ctx.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.4, W * 0.5, H * 0.5, Math.max(W, H) * 0.7);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* ============ 15. 主循环 ============ */
function animate(now) {
  if (!state.lastTime) state.lastTime = now;
  const dt = now - state.lastTime;
  state.lastTime = now;

  if (!state.isPaused) {
    const elapsed = now - state.stageStart;
    const stageCfg = STAGES[state.stage];
    const progress = stageCfg ? Math.min(elapsed / stageCfg.duration, 1) : 0;

    switch (state.stage) {
      case 'SCATTER': updateScatter(progress, dt); break;
      case 'VORTEX':  updateVortex(progress, dt);  break;
      case 'REFORM':  updateReform(progress, dt);  break;
      case 'HOLD':    updateHold(progress, dt);    break;
      case 'FADE':    updateFade(progress, dt);    break;
    }

    // 鼠标排斥：与阶段叠加，让互动持续有反馈
    updateMouseRepulsion();

    // 阶段结束 → 推进
    if (progress >= 1) {
      const idx = STAGE_ORDER.indexOf(state.stage);
      const next = STAGE_ORDER[(idx + 1) % STAGE_ORDER.length];
      // 循环回到 SCATTER 前需要重置粒子到原图
      if (next === 'SCATTER') {
        resetParticles();
      }
      setStage(next);
    }
  }

  render();
  state.rafId = requestAnimationFrame(animate);
}

function startAnimation() {
  // 取消旧循环
  if (state.rafId) cancelAnimationFrame(state.rafId);
  state.lastTime = 0;
  resetParticles();
  setStage('SCATTER');
  state.rafId = requestAnimationFrame(animate);
}

/* ============ 16. 鼠标 / 触摸交互 ============ */
function setupPointerEvents() {
  // 坐标转换：客户端坐标 → 画布内部坐标
  function toCanvasCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  // 鼠标移动
  wrap.addEventListener('mousemove', (e) => {
    const p = toCanvasCoords(e.clientX, e.clientY);
    state.mouseX = p.x;
    state.mouseY = p.y;
    state.mouseActive = true;
  });
  wrap.addEventListener('mouseleave', () => {
    state.mouseActive = false;
  });

  // 触摸移动
  wrap.addEventListener('touchmove', (e) => {
    if (e.touches.length === 0) return;
    const t = e.touches[0];
    const p = toCanvasCoords(t.clientX, t.clientY);
    state.mouseX = p.x;
    state.mouseY = p.y;
    state.mouseActive = true;
  }, { passive: true });
  wrap.addEventListener('touchend', () => {
    state.mouseActive = false;
  });

  // 点击画面任意位置 → 重新播放
  wrap.addEventListener('click', (e) => {
    // 排除掉点击在文件输入框上的情况
    if (e.target.tagName === 'INPUT') return;
    startAnimation();
  });
}

/* ============ 17. 拖放上传 ============ */
function setupDragAndDrop() {
  let dragCounter = 0;
  wrap.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragCounter++;
    dropHint.classList.add('visible');
  });
  wrap.addEventListener('dragover', (e) => {
    e.preventDefault();
  });
  wrap.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) {
      dragCounter = 0;
      dropHint.classList.remove('visible');
    }
  });
  wrap.addEventListener('drop', (e) => {
    e.preventDefault();
    dragCounter = 0;
    dropHint.classList.remove('visible');
    const files = e.dataTransfer && e.dataTransfer.files;
    if (files && files[0] && files[0].type.startsWith('image/')) {
      handleFile(files[0]);
    }
  });
}

function handleFile(file) {
  if (!file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => loadSource(img, file.name);
    img.onerror = () => {
      console.error('[上传] 图片解析失败');
      alert('图片加载失败，请尝试另一张图片');
    };
    img.src = e.target.result;
  };
  reader.onerror = () => {
    console.error('[上传] 文件读取失败');
    alert('文件读取失败');
  };
  reader.readAsDataURL(file);
}

/* ============ 18. 按钮事件 ============ */
function setupButtons() {
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) handleFile(file);
    // 允许重复选择同一文件
    e.target.value = '';
  });

  replayBtn.addEventListener('click', () => {
    if (!state.particles.length) return;
    startAnimation();
  });

  pauseBtn.addEventListener('click', () => {
    state.isPaused = !state.isPaused;
    pauseText.textContent = state.isPaused ? '继续' : '暂停';
    // 切换图标
    pauseIcon.innerHTML = state.isPaused
      ? '<path d="M8 5v14l11-7z"/>'
      : '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
  });

  downloadBtn.addEventListener('click', () => {
    if (!state.particles.length) return;
    // 在 HOLD 阶段或 REFORM 后期导出最有意义
    canvas.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'particle-memories-' + Date.now() + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  });

  // 性能档位切换
  perfButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const perf = btn.dataset.perf;
      if (perf === currentPerf) return;
      currentPerf = perf;
      perfButtons.forEach(b => b.classList.toggle('active', b === btn));
      // 重新生成粒子
      resizeCanvas();
      if (state.sourceImage) {
        loadSource(state.sourceImage, state.sourceLabel);
      } else {
        loadSource(generateDemoImage(), '演示图');
      }
    });
  });
}

/* ============ 19. 初始化 ============ */
function init() {
  resizeCanvas();
  setupPointerEvents();
  setupDragAndDrop();
  setupButtons();

  // 默认加载演示图
  console.log('[Init] 启动 Particle Memories，默认档位=', currentPerf);
  loadSource(generateDemoImage(), '演示图 · 夜空与剪影');
}

// DOM 就绪后启动（脚本放在 body 末尾，已自然就绪）
init();
</script>
