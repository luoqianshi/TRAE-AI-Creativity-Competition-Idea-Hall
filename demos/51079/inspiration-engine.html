<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感引擎 - AI智能写作助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(99, 102, 241, 0.3);
            border-radius: 50%;
            animation: float 8s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            50% { transform: translateY(-20px) translateX(10px); opacity: 0.6; }
        }

        .glow-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            z-index: 0;
            animation: pulse 4s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            letter-spacing: 2px;
        }

        .tagline {
            font-size: 18px;
            color: #94a3b8;
            letter-spacing: 4px;
        }

        .main-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            padding: 40px;
            box-shadow: 0 0 60px rgba(99, 102, 241, 0.1);
            transition: all 0.3s ease;
        }

        .main-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 80px rgba(99, 102, 241, 0.2);
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-label {
            display: block;
            font-size: 16px;
            color: #cbd5e1;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .topic-input {
            width: 100%;
            padding: 20px 24px;
            font-size: 18px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        .topic-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
        }

        .topic-input::placeholder {
            color: #64748b;
        }

        .action-buttons {
            display: flex;
            gap: 16px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(99, 102, 241, 0.6);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(99, 102, 241, 0.1);
            color: #94a3b8;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(99, 102, 241, 0.2);
            color: #cbd5e1;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-content {
            text-align: center;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            color: #94a3b8;
        }

        .loading-dots {
            display: inline-block;
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }

        .result-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .result-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, #6366f1, #8b5cf6);
            border-radius: 2px;
        }

        .outline-card {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid rgba(99, 102, 241, 0.15);
        }

        .outline-list {
            list-style: none;
        }

        .outline-item {
            padding: 16px 20px;
            background: rgba(99, 102, 241, 0.08);
            border-radius: 12px;
            margin-bottom: 12px;
            border-left: 4px solid #6366f1;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .outline-item:hover {
            background: rgba(99, 102, 241, 0.15);
            transform: translateX(8px);
        }

        .outline-item:last-child {
            margin-bottom: 0;
        }

        .outline-number {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 6px;
            text-align: center;
            line-height: 24px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 12px;
            color: #ffffff;
        }

        .content-area {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid rgba(99, 102, 241, 0.15);
            min-height: 300px;
            position: relative;
        }

        .content-text {
            font-size: 16px;
            line-height: 1.8;
            color: #e2e8f0;
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 18px;
            background: #6366f1;
            animation: blink 1s infinite;
            margin-left: 2px;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .polish-section {
            display: none;
        }

        .polish-section.active {
            display: block;
        }

        .compare-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .compare-container {
                grid-template-columns: 1fr;
            }
        }

        .compare-card {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(99, 102, 241, 0.15);
        }

        .compare-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            padding: 8px 16px;
            border-radius: 8px;
            display: inline-block;
        }

        .compare-title.original {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .compare-title.polished {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }

        .compare-text {
            font-size: 15px;
            line-height: 1.7;
            color: #e2e8f0;
            min-height: 150px;
        }

        .inspiration-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .inspiration-card {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(99, 102, 241, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .inspiration-card:hover {
            transform: translateY(-8px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 10px 40px rgba(99, 102, 241, 0.2);
        }

        .inspiration-icon {
            font-size: 32px;
            margin-bottom: 16px;
        }

        .inspiration-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .inspiration-desc {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 24px;
            margin-top: 40px;
            border: 1px solid rgba(99, 102, 241, 0.15);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: #94a3b8;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .feature-card {
            text-align: center;
            padding: 24px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 16px;
            border: 1px solid rgba(99, 102, 241, 0.1);
        }

        .feature-icon {
            font-size: 40px;
            margin-bottom: 16px;
        }

        .feature-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .feature-desc {
            font-size: 14px;
            color: #94a3b8;
        }

        .footer {
            text-align: center;
            margin-top: 60px;
            padding: 20px;
            color: #64748b;
            font-size: 14px;
        }

        .highlight {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.3), rgba(139, 92, 246, 0.3));
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="glow-bg"></div>

    <div class="container">
        <header>
            <h1 class="logo">灵感引擎</h1>
            <p class="tagline">AI智能写作助手</p>
        </header>

        <div class="main-card">
            <div class="input-section">
                <label class="input-label">输入你的写作主题</label>
                <input type="text" class="topic-input" id="topicInput" placeholder="例如：如何提升职场沟通能力、写一篇产品发布会演讲稿...">
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" id="generateBtn">
                    <span>✨</span> 生成灵感大纲
                </button>
                <button class="btn btn-secondary" id="polishBtn" disabled>
                    <span>🔧</span> 一键润色优化
                </button>
            </div>

            <div class="result-section" id="resultSection">
                <div class="section-title">
                    📋 智能大纲
                </div>
                <div class="outline-card">
                    <ul class="outline-list" id="outlineList"></ul>
                </div>

                <div class="section-title">
                    📝 AI生成内容
                </div>
                <div class="content-area">
                    <div class="content-text" id="contentText"></div>
                </div>

                <div class="polish-section" id="polishSection">
                    <div class="section-title">
                        ✨ 润色对比
                    </div>
                    <div class="compare-container">
                        <div class="compare-card">
                            <div class="compare-title original">原始版本</div>
                            <div class="compare-text" id="originalText"></div>
                        </div>
                        <div class="compare-card">
                            <div class="compare-title polished">润色版本</div>
                            <div class="compare-text" id="polishedText"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="section-title" style="margin-top: 60px;">
            💡 灵感推荐
        </div>
        <div class="inspiration-cards" id="inspirationCards"></div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="wordCount">0</div>
                <div class="stat-label">生成字数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="timeSaved">0</div>
                <div class="stat-label">节省时间(分钟)</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="qualityScore">0</div>
                <div class="stat-label">质量评分</div>
            </div>
        </div>

        <div class="feature-grid">
            <div class="feature-card">
                <div class="feature-icon">🎯</div>
                <div class="feature-title">智能大纲</div>
                <div class="feature-desc">自动生成结构化内容框架</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">✍️</div>
                <div class="feature-title">内容生成</div>
                <div class="feature-desc">基于主题快速产出初稿</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">✨</div>
                <div class="feature-title">一键润色</div>
                <div class="feature-desc">提升文采与表达质量</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">💡</div>
                <div class="feature-title">灵感激发</div>
                <div class="feature-desc">智能推荐相关创意</div>
            </div>
        </div>

        <div class="footer">
            <p>灵感引擎 - 让写作更简单 | TRAE AI创造力大赛参赛作品</p>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">AI正在思考中<span class="loading-dots">.</span></div>
        </div>
    </div>

    <script>
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.width = Math.random() * 6 + 2 + 'px';
            particle.style.height = particle.style.width;
            particle.style.animationDelay = Math.random() * 8 + 's';
            particlesContainer.appendChild(particle);
        }

        const topicInput = document.getElementById('topicInput');
        const generateBtn = document.getElementById('generateBtn');
        const polishBtn = document.getElementById('polishBtn');
        const resultSection = document.getElementById('resultSection');
        const outlineList = document.getElementById('outlineList');
        const contentText = document.getElementById('contentText');
        const polishSection = document.getElementById('polishSection');
        const originalText = document.getElementById('originalText');
        const polishedText = document.getElementById('polishedText');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const inspirationCards = document.getElementById('inspirationCards');
        const wordCount = document.getElementById('wordCount');
        const timeSaved = document.getElementById('timeSaved');
        const qualityScore = document.getElementById('qualityScore');

        const inspirationData = [
            { icon: '📚', title: '相关书籍推荐', desc: '基于主题智能推荐经典读物，丰富内容素材' },
            { icon: '💬', title: '观点收集', desc: '汇聚各方观点，拓宽写作视野' },
            { icon: '📊', title: '数据支撑', desc: '提供权威数据，增强文章说服力' },
            { icon: '🎨', title: '配图建议', desc: '智能推荐配图方案，提升内容视觉效果' },
            { icon: '🔗', title: '参考链接', desc: '推荐高质量参考资料和文献' },
            { icon: '📝', title: '写作技巧', desc: '针对主题提供专业写作建议' }
        ];

        inspirationData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'inspiration-card';
            card.innerHTML = `
                <div class="inspiration-icon">${item.icon}</div>
                <div class="inspiration-title">${item.title}</div>
                <div class="inspiration-desc">${item.desc}</div>
            `;
            card.addEventListener('click', () => {
                showToast(`已为您推荐：${item.title}`);
            });
            inspirationCards.appendChild(card);
        });

        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 40px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(99, 102, 241, 0.9);
                color: white;
                padding: 12px 24px;
                border-radius: 8px;
                z-index: 1000;
                animation: fadeInUp 0.3s ease;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'fadeOutDown 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateX(-50%) translateY(20px); }
                to { opacity: 1; transform: translateX(-50%) translateY(0); }
            }
            @keyframes fadeOutDown {
                from { opacity: 1; transform: translateX(-50%) translateY(0); }
                to { opacity: 0; transform: translateX(-50%) translateY(20px); }
            }
        `;
        document.head.appendChild(style);

        const templates = {
            outline: [
                '引言：引出主题背景和重要性',
                '现状分析：当前存在的问题和挑战',
                '核心观点：提出创新性解决方案',
                '实践案例：列举成功案例和数据',
                '总结展望：总结要点并展望未来'
            ],
            content: {
                '如何提升职场沟通能力': `在职场中，良好的沟通能力是成功的关键因素之一。有效的沟通不仅能够帮助我们更好地理解他人的需求，还能提高工作效率，减少误解和冲突。

首先，要学会倾听。倾听是沟通的基础，只有真正听懂对方的意图，才能做出恰当的回应。其次，要注重表达的清晰性和逻辑性，避免使用模糊不清的语言。

另外，非语言沟通也同样重要，肢体语言、面部表情都能传达丰富的信息。通过不断练习和反思，每个人都可以逐步提升自己的沟通能力，在职场中更加游刃有余。`,
                '产品发布会演讲稿': `尊敬的各位来宾、媒体朋友们：

大家好！今天，我们非常荣幸地在这里发布我们的全新产品——灵感引擎。这是一款基于先进AI技术的智能写作助手，旨在帮助每一位用户释放创造力，让写作变得更加简单高效。

灵感引擎融合了深度学习、自然语言处理等前沿技术，能够根据用户输入的主题，快速生成结构化的内容大纲，并自动产出高质量的初稿。同时，它还具备智能润色功能，能够优化文章的表达方式，提升整体质量。

我们相信，灵感引擎将成为您写作路上最得力的伙伴。感谢大家的关注与支持！`,
                'default': `写作是一门艺术，也是一种技能。无论是在工作中撰写报告，还是在学习中完成论文，良好的写作能力都至关重要。

要写出优秀的作品，首先需要明确写作目标。你想通过这篇文章表达什么观点？想达到什么样的效果？明确目标后，才能有针对性地组织内容。

其次，要注重内容的逻辑性和连贯性。一个好的结构能够让读者更容易理解你的思路。可以采用总分总、问题解决等常见的文章结构。

最后，不断修改和润色是提升文章质量的关键。优秀的作品往往需要经过反复打磨才能呈现出最佳状态。`,
                '人工智能的未来发展': `人工智能正在深刻改变我们的生活和工作方式。从自动驾驶汽车到智能助手，AI技术已经渗透到各个领域。

未来，人工智能将朝着更加智能化、人性化的方向发展。我们可以期待更加自然的人机交互方式，以及AI在医疗、教育、环保等领域的广泛应用。

同时，我们也需要关注AI发展带来的伦理和社会问题，确保AI技术能够为人类带来更多福祉。`,
                '旅行攻略写作技巧': `写一篇好的旅行攻略需要注意以下几点：

首先，要提供实用的信息。交通、住宿、美食等信息是读者最关心的内容，要尽量详细准确。

其次，加入个人体验和感受。真实的体验分享能够让攻略更加生动有趣，也更具参考价值。

最后，注意结构清晰。可以按照行程安排、景点推荐、美食攻略等模块来组织内容，让读者一目了然。`
            }
        };

        function getOutline(topic) {
            return templates.outline;
        }

        function getContent(topic) {
            const lowerTopic = topic.toLowerCase();
            for (const key in templates.content) {
                if (lowerTopic.includes(key.toLowerCase())) {
                    return templates.content[key];
                }
            }
            return templates.content.default;
        }

        function typeWriter(element, text, callback) {
            element.innerHTML = '';
            let i = 0;
            const speed = 30;
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else {
                    element.innerHTML += '<span class="cursor-blink"></span>';
                    setTimeout(() => {
                        const blink = element.querySelector('.cursor-blink');
                        if (blink) blink.remove();
                        if (callback) callback();
                    }, 500);
                }
            }
            type();
        }

        generateBtn.addEventListener('click', async () => {
            const topic = topicInput.value.trim();
            if (!topic) {
                showToast('请输入写作主题');
                return;
            }

            loadingOverlay.classList.add('active');
            generateBtn.disabled = true;

            await new Promise(resolve => setTimeout(resolve, 2000));

            loadingOverlay.classList.remove('active');
            resultSection.classList.add('active');
            polishBtn.disabled = false;
            polishSection.classList.remove('active');

            const outline = getOutline(topic);
            outlineList.innerHTML = outline.map((item, index) => `
                <li class="outline-item">
                    <span class="outline-number">${index + 1}</span>
                    ${item}
                </li>
            `).join('');

            const content = getContent(topic);
            typeWriter(contentText, content, () => {
                const count = content.replace(/\s/g, '').length;
                wordCount.textContent = count;
                timeSaved.textContent = Math.round(count / 50);
                qualityScore.textContent = '92';
            });
        });

        polishBtn.addEventListener('click', async () => {
            loadingOverlay.classList.add('active');
            polishBtn.disabled = true;

            await new Promise(resolve => setTimeout(resolve, 1500));

            loadingOverlay.classList.remove('active');
            polishSection.classList.add('active');

            const original = contentText.textContent;
            originalText.textContent = original;

            const polished = original
                .replace(/首先/g, '首先，')
                .replace(/其次/g, '其次，')
                .replace(/另外/g, '此外，')
                .replace(/最后/g, '最后，')
                .replace(/重要/g, '至关重要')
                .replace(/好的/g, '优秀的')
                .replace(/可以/g, '能够')
                .replace(/很多/g, '众多')
                .replace(/非常/g, '格外')
                .replace(/说/g, '阐述')
                .replace(/想/g, '希望')
                .replace(/做/g, '践行')
                .replace(/写/g, '撰写')
                .replace(/看/g, '审视')
                .replace(/用/g, '运用');

            typeWriter(polishedText, polished, () => {
                showToast('润色完成！');
                qualityScore.textContent = '98';
            });
        });

        topicInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                generateBtn.click();
            }
        });
    </script>
</body>
