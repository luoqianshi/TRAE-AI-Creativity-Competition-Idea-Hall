<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鲜管家 - 创意原型展示</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .phone-container {
            width: 375px;
            height: 700px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }
        .content { flex: 1; padding: 15px; overflow-y: auto; }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
            border-left: 4px solid #4CAF50;
            padding-left: 10px;
        }
        .warning-box {
            background: #FFF3E0;
            border: 1px solid #FFE0B2;
            color: #E65100;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .item-info { display: flex; align-items: center; }
        .item-emoji { font-size: 24px; margin-right: 10px; }
        .item-name { font-weight: 600; font-size: 15px; }
        .item-date { font-size: 12px; color: #999; }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .badge-red { background: #FFEBEE; color: #D32F2F; }
        .badge-yellow { background: #FFF8E1; color: #FBC02D; }
        .badge-green { background: #E8F5E9; color: #388E3C; }
        .recipe-btn {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .tab-bar {
            display: flex;
            background: white;
            border-top: 1px solid #eee;
        }
        .tab-item {
            flex: 1;
            text-align: center;
            padding: 10px;
            color: #999;
            font-size: 12px;
        }
        .tab-item.active { color: #4CAF50; font-weight: bold; }
        .tab-icon { font-size: 20px; display: block; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <h1>🥦 鲜管家</h1>
        <p>告别过期，吃得更鲜</p>
    </div>

    <div class="content">
        <div class="section-title">🚨 临期预警</div>
        <div class="warning-box">
            您有 <b>2</b> 样食材即将过期！建议尽快食用：<br>
            🍅 西红柿 (剩2天) | 🥬 菠菜 (剩1天)
        </div>

        <div class="section-title">📦 冰箱库存</div>
        
        <div class="item-card">
            <div class="item-info">
                <span class="item-emoji">🥬</span>
                <div>
                    <div class="item-name">菠菜</div>
                    <div class="item-date">购入：10月20日</div>
                </div>
            </div>
            <span class="badge badge-red">明天过期</span>
        </div>

        <div class="item-card">
            <div class="item-info">
                <span class="item-emoji">🍅</span>
                <div>
                    <div class="item-name">西红柿</div>
                    <div class="item-date">购入：10月19日</div>
                </div>
            </div>
            <span class="badge badge-yellow">剩2天</span>
        </div>

        <div class="item-card">
            <div class="item-info">
                <span class="item-emoji">🥛</span>
                <div>
                    <div class="item-name">全脂牛奶</div>
                    <div class="item-date">购入：10月22日</div>
                </div>
            </div>
            <span class="badge badge-green">很新鲜</span>
        </div>

        <div class="section-title">🍳 智能菜谱推荐</div>
        <p style="font-size:13px;color:#666;margin:0 0 10px;">根据临期的【西红柿】和【菠菜】为您推荐：</p>
        <div style="background:#f9f9f9;border-radius:10px;padding:15px;margin-bottom:15px;">
            <div style="font-weight:bold;margin-bottom:5px;">🍅 菠菜番茄炒蛋</div>
            <div style="font-size:12px;color:#999;">利用您冰箱中的临期食材，只需额外准备鸡蛋和调料，5分钟搞定营养晚餐！</div>
        </div>

        <button class="recipe-btn">📸 拍照一键录入新食材</button>
    </div>

    <div class="tab-bar">
        <div class="tab-item active">
            <span class="tab-icon">🏠</span>首页
        </div>
        <div class="tab-item">
            <span class="tab-icon">🍳</span>菜谱
        </div>
        <div class="tab-item">
            <span class="tab-icon">🛒</span>清单
        </div>
        <div class="tab-item">
            <span class="tab-icon">👤</span>我的
        </div>
    </div>
</div>

</body>
</html>
