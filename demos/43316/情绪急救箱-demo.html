<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情绪急救箱 · AI 情绪干预助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f5f2;
    color: #1a1a18;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: #fff;
    border-bottom: 0.5px solid rgba(0,0,0,0.1);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-icon {
    width: 40px; height: 40px;
    background: #FCEBEB;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .header h1 { font-size: 18px; font-weight: 500; color: #1a1a18; }
  .header p { font-size: 12px; color: #888780; margin-top: 2px; }

  /* ── Layout ── */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px;
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 20px;
  }
  @media (max-width: 700px) {
    .container { grid-template-columns: 1fr; }
  }

  /* ── Card ── */
  .card {
    background: #fff;
    border-radius: 16px;
    border: 0.5px solid rgba(0,0,0,0.08);
    padding: 20px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 500;
    color: #5F5E5A;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #E24B4A;
    display: inline-block;
  }
  .dot.green { background: #639922; }
  .dot.amber { background: #BA7517; }
  .dot.blue  { background: #185FA5; }

  /* ── Emotion Picker ── */
  .emotion-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .emotion-btn {
    border: 0.5px solid rgba(0,0,0,0.1);
    border-radius: 12px;
    padding: 12px 6px;
    cursor: pointer;
    text-align: center;
    background: #fafaf8;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .emotion-btn:hover { background: #F1EFE8; border-color: rgba(0,0,0,0.2); }
  .emotion-btn.selected {
    background: #FCEBEB;
    border-color: #E24B4A;
  }
  .emotion-btn.selected.calm { background: #EAF3DE; border-color: #639922; }
  .emotion-btn.selected.anxious { background: #FAEEDA; border-color: #BA7517; }
  .emotion-btn.selected.sad { background: #E6F1FB; border-color: #185FA5; }
  .emotion-icon { font-size: 24px; }
  .emotion-label { font-size: 11px; color: #5F5E5A; margin-top: 4px; }

  /* ── Intensity Slider ── */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .slider-row label { font-size: 12px; color: #888780; white-space: nowrap; }
  .slider-row input[type=range] { flex: 1; }
  .slider-val {
    font-size: 13px;
    font-weight: 500;
    color: #1a1a18;
    width: 28px;
    text-align: right;
  }

  /* ── Text Input ── */
  .input-area {
    width: 100%;
    border: 0.5px solid rgba(0,0,0,0.12);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-family: inherit;
    color: #1a1a18;
    background: #fafaf8;
    resize: none;
    line-height: 1.6;
    outline: none;
    transition: border-color 0.15s;
  }
  .input-area:focus { border-color: rgba(0,0,0,0.25); background: #fff; }
  .input-area::placeholder { color: #B4B2A9; }

  /* ── Analyze Button ── */
  .analyze-btn {
    width: 100%;
    margin-top: 12px;
    padding: 11px;
    background: #E24B4A;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .analyze-btn:hover { background: #A32D2D; }
  .analyze-btn:disabled { background: #D3D1C7; cursor: not-allowed; }

  /* ── AI Result Panel ── */
  .result-panel { display: none; }
  .result-panel.visible { display: block; }

  .emotion-score-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .bar-label { font-size: 12px; color: #5F5E5A; width: 48px; }
  .bar-track {
    flex: 1;
    height: 6px;
    background: #F1EFE8;
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.8s ease;
  }
  .bar-pct { font-size: 11px; color: #888780; width: 30px; text-align: right; }

  /* ── Prescription Cards ── */
  .rx-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 12px;
  }
  .rx-card {
    border-radius: 12px;
    padding: 14px;
    border: 0.5px solid rgba(0,0,0,0.08);
    cursor: pointer;
    transition: transform 0.1s;
  }
  .rx-card:hover { transform: translateY(-1px); }
  .rx-card.music  { background: #FBEAF0; }
  .rx-card.breath { background: #EAF3DE; }
  .rx-card.talk   { background: #E6F1FB; }
  .rx-card.move   { background: #FAEEDA; }
  .rx-card-icon { font-size: 22px; margin-bottom: 6px; }
  .rx-card-title { font-size: 13px; font-weight: 500; color: #1a1a18; }
  .rx-card-desc { font-size: 11px; color: #5F5E5A; margin-top: 3px; line-height: 1.5; }

  /* ── Breathing Exercise ── */
  .breath-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 999;
    align-items: center;
    justify-content: center;
  }
  .breath-modal.show { display: flex; }
  .breath-box {
    background: #fff;
    border-radius: 20px;
    padding: 32px;
    text-align: center;
    width: 320px;
  }
  .breath-circle {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: #EAF3DE;
    margin: 20px auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 500;
    color: #3B6D11;
    transition: transform 0.1s linear;
  }
  .breath-box h3 { font-size: 16px; font-weight: 500; }
  .breath-box p { font-size: 12px; color: #888780; margin-top: 4px; }
  .phase-label { font-size: 13px; color: #3B6D11; margin-top: 12px; font-weight: 500; }
  .close-btn {
    margin-top: 20px;
    padding: 8px 20px;
    border: 0.5px solid rgba(0,0,0,0.15);
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
  }

  /* ── Sidebar ── */
  .history-list { list-style: none; }
  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 0.5px solid rgba(0,0,0,0.06);
  }
  .history-item:last-child { border-bottom: none; }
  .h-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .h-text { font-size: 12px; }
  .h-name { font-weight: 500; color: #1a1a18; }
  .h-time { color: #B4B2A9; margin-top: 1px; }

  /* ── Metric ── */
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .metric {
    background: #f7f5f2;
    border-radius: 10px;
    padding: 12px;
  }
  .metric-label { font-size: 11px; color: #888780; }
  .metric-val { font-size: 22px; font-weight: 500; color: #1a1a18; margin-top: 2px; }

  /* ── AI Tag ── */
  .ai-tag {
    display: inline-block;
    background: #EEEDFE;
    color: #534AB7;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 6px;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🩺</div>
  <div>
    <h1>情绪急救箱</h1>
    <p>AI 实时情绪识别 · 个性化干预方案 · 随时随地使用</p>
  </div>
  <div style="margin-left:auto; display:flex; align-items:center; gap:8px;">
    <span class="ai-tag">AI 驱动</span>
    <div style="width:8px;height:8px;background:#639922;border-radius:50%;"></div>
    <span style="font-size:12px;color:#888780;">实时分析中</span>
  </div>
</div>

<div class="container">
  <!-- 主区 -->
  <div>
    <!-- Step 1: 选择情绪 -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-title"><span class="dot"></span> 第一步：现在感受到哪种情绪？</div>
      <div class="emotion-grid" id="emotionGrid">
        <button class="emotion-btn" data-emotion="焦虑" data-type="anxious" onclick="selectEmotion(this)">
          <div class="emotion-icon">😰</div><div class="emotion-label">焦虑</div>
        </button>
        <button class="emotion-btn" data-emotion="悲伤" data-type="sad" onclick="selectEmotion(this)">
          <div class="emotion-icon">😢</div><div class="emotion-label">悲伤</div>
        </button>
        <button class="emotion-btn" data-emotion="愤怒" data-type="angry" onclick="selectEmotion(this)">
          <div class="emotion-icon">😤</div><div class="emotion-label">愤怒</div>
        </button>
        <button class="emotion-btn" data-emotion="疲惫" data-type="tired" onclick="selectEmotion(this)">
          <div class="emotion-icon">😩</div><div class="emotion-label">疲惫</div>
        </button>
        <button class="emotion-btn" data-emotion="孤独" data-type="lonely" onclick="selectEmotion(this)">
          <div class="emotion-icon">🥺</div><div class="emotion-label">孤独</div>
        </button>
        <button class="emotion-btn" data-emotion="迷茫" data-type="confused" onclick="selectEmotion(this)">
          <div class="emotion-icon">😵‍💫</div><div class="emotion-label">迷茫</div>
        </button>
        <button class="emotion-btn calm" data-emotion="平静" data-type="calm" onclick="selectEmotion(this)">
          <div class="emotion-icon">😌</div><div class="emotion-label">平静</div>
        </button>
        <button class="emotion-btn calm" data-emotion="开心" data-type="happy" onclick="selectEmotion(this)">
          <div class="emotion-icon">😊</div><div class="emotion-label">开心</div>
        </button>
      </div>

      <div class="slider-row">
        <label>情绪强度</label>
        <input type="range" min="1" max="10" value="5" id="intensitySlider"
          oninput="document.getElementById('intensityVal').textContent=this.value">
        <span class="slider-val" id="intensityVal">5</span>
      </div>
    </div>

    <!-- Step 2: 描述 -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-title"><span class="dot amber"></span> 第二步：简单描述一下发生了什么（可选）</div>
      <textarea class="input-area" id="descInput" rows="3"
        placeholder="例如：今天被老板批评了，感觉很委屈……或者只是莫名其妙心情不好。"></textarea>
      <button class="analyze-btn" id="analyzeBtn" onclick="analyze()" disabled>
        🩺 生成我的情绪急救方案
      </button>
    </div>

    <!-- Step 3: AI 结果 -->
    <div class="card result-panel" id="resultPanel">
      <div class="card-title"><span class="dot blue"></span> AI 分析结果 <span id="resultTag" class="ai-tag" style="margin-left:auto;font-size:11px;"></span></div>

      <div style="margin-bottom:16px;">
        <div style="font-size:13px;font-weight:500;margin-bottom:10px;color:#1a1a18;">情绪成分分析</div>
        <div id="barsContainer"></div>
      </div>

      <div style="font-size:12px;color:#5F5E5A;background:#f7f5f2;border-radius:10px;padding:12px;margin-bottom:16px;line-height:1.7;" id="aiInsight">
      </div>

      <div class="card-title" style="margin-bottom:8px;"><span class="dot green"></span> 为你定制的急救方案</div>
      <div class="rx-grid" id="rxGrid"></div>
    </div>
  </div>

  <!-- 侧边栏 -->
  <div>
    <!-- 今日统计 -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-title"><span class="dot amber"></span> 今日情绪概览</div>
      <div class="metrics">
        <div class="metric">
          <div class="metric-label">记录次数</div>
          <div class="metric-val" id="countVal">0</div>
        </div>
        <div class="metric">
          <div class="metric-label">情绪均分</div>
          <div class="metric-val" id="scoreVal">—</div>
        </div>
      </div>
      <div style="font-size:12px;color:#888780;">
        💡 情绪分越高代表状态越好（10分满分）
      </div>
    </div>

    <!-- 历史记录 -->
    <div class="card">
      <div class="card-title"><span class="dot blue"></span> 最近记录</div>
      <ul class="history-list" id="historyList">
        <li style="font-size:12px;color:#B4B2A9;padding:8px 0;">还没有记录，完成第一次分析后出现~</li>
      </ul>
    </div>
  </div>
</div>

<!-- 呼吸练习弹窗 -->
<div class="breath-modal" id="breathModal">
  <div class="breath-box">
    <h3>4-7-8 呼吸法</h3>
    <p>一种快速激活副交感神经的放松技术</p>
    <div class="breath-circle" id="breathCircle">准备好</div>
    <div class="phase-label" id="phaseLabel">点击开始</div>
    <div style="margin-top:16px;">
      <button class="analyze-btn" id="breathStartBtn" onclick="startBreath()" style="width:auto;padding:9px 24px;">开始练习</button>
    </div>
    <button class="close-btn" onclick="closeBreath()">关闭</button>
  </div>
</div>

<script>
const PRESCRIPTIONS = {
  焦虑: [
    { type:'breath', icon:'🌬️', title:'4-7-8 呼吸法', desc:'激活副交感神经，5分钟内快速平复焦虑', action:'breath' },

  ],
  开心: [
    { type:'move', icon:'🎉', title:'分享快乐', desc:'快乐分享会翻倍，告诉一个朋友！', action:'walk' },
    { type:'music', icon:'🎵', title:'欢快歌单', desc:'用音乐放大这份开心', action:'music' },
    { type:'talk', icon:'📒', title:'记录开心时刻', desc:'存入情绪银行，低谷时可以回看', action:'write' },
    { type:'breath', icon:'⚡', title:'能量呼吸法', desc:'用呼吸把好能量锁住', action:'breath' },
  ],
};

const BARS_DATA = {
  焦虑: [{label:'焦虑', pct:72, color:'#BA7517'},{label:'紧绷', pct:60, color:'#E24B4A'},{label:'期待', pct:25, color:'#185FA5'}],
  悲伤: [{label:'悲伤', pct:78, color:'#185FA5'},{label:'失落', pct:55, color:'#534AB7'},{label:'疲惫', pct:40, color:'#888780'}],

  疲惫: [{label:'疲惫', pct:85, color:'#888780'},{label:'压力', pct:60, color:'#BA7517'},{label:'焦虑', pct:35, color:'#BA7517'}],
  孤独: [{label:'孤独', pct:70, color:'#534AB7'},{label:'渴望', pct:55, color:'#185FA5'},{label:'悲伤', pct:40, color:'#888780'}],
  迷茫: [{label:'迷茫', pct:68, color:'#888780'},{label:'焦虑', pct:50, color:'#BA7517'},{label:'好奇', pct:35, color:'#185FA5'}],
  平静: [{label:'平静', pct:80, color:'#639922'},{label:'满足', pct:60, color:'#0F6E56'},{label:'专注', pct:55, color:'#185FA5'}],
  开心: [{label:'喜悦', pct:85, color:'#639922'},{label:'活力', pct:70, color:'#BA7517'},{label:'期待', pct:60, color:'#185FA5'}],
};

const INSIGHTS = {
  焦虑: '根据你的描述，AI 检测到明显的预期性焦虑信号。这是大脑对未来不确定性的防御反应——你的神经系统正在过度工作。好消息是：焦虑是可以被调节的。以下方案经过临床验证，可帮助你在20分钟内恢复平衡。',
  悲伤: 'AI 识别到你正经历情感失落。悲伤是一种需要被允许的情绪，压抑它反而会让它变得更强。先给自己空间感受，再慢慢找回力量——这是你现在最需要做的事。',
  愤怒: '高强度的愤怒信号被识别到。愤怒的背后往往是受伤或不被尊重的感受。建议先通过身体活动快速释放情绪能量，再在平静后进行理性复盘。',
  疲惫: 'AI 检测到你处于高耗能低恢复状态。身体疲惫和情绪疲惫会相互放大。现在最重要的不是"再努力一下"，而是允许自己休息和恢复。',
  孤独: '孤独感是人类最普遍的情绪之一，也是最容易被误解的。AI 感受到了你对连接的渴望。你不是一个人在面对这些——即使此刻没有人在你身边。',
  迷茫: '你的迷茫可能来自信息过载或价值冲突。AI 建议先不急着"找到答案"，而是先把脑子里的所有想法清空到外部，再一起梳理。',
  平静: '你现在处于理想的"平静-专注"状态。这是心流的入口！AI 建议你利用这段时间做最需要深度思考的事，同时用冥想或音乐锁住这份状态。',
  开心: '检测到高积极情绪！开心不只是一种感受，更是一种资源——可以被记录、分享和放大。AI 建议你趁现在把这份能量存入"情绪银行"。',
};

let selectedEmotion = null;
let sessionCount = 0;
let totalScore = 0;
let history = [];

function selectEmotion(btn) {
  document.querySelectorAll('.emotion-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedEmotion = btn.dataset.emotion;
  document.getElementById('analyzeBtn').disabled = false;
}

function analyze() {
  if (!selectedEmotion) return;
  const intensity = parseInt(document.getElementById('intensitySlider').value);

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.textContent = '⏳ AI 正在分析…';

  setTimeout(() => {
    showResult(selectedEmotion, intensity);
    btn.disabled = false;
    btn.textContent = '🩺 重新生成方案';
    updateStats(selectedEmotion, intensity);
  }, 1200);
}

function showResult(emotion, intensity) {
  const panel = document.getElementById('resultPanel');
  panel.classList.add('visible');

  document.getElementById('resultTag').textContent = emotion + ' · 强度 ' + intensity;

  const bars = BARS_DATA[emotion] || BARS_DATA['焦虑'];
  const barsHtml = bars.map(b => `
    <div class="emotion-score-bar">
      <span class="bar-label">${b.label}</span>
      <div class="bar-track"><div class="bar-fill" style="width:0%;background:${b.color}" data-pct="${b.pct}"></div></div>
      <span class="bar-pct">${b.pct}%</span>
    </div>`).join('');
  document.getElementById('barsContainer').innerHTML = barsHtml;

  setTimeout(() => {
    document.querySelectorAll('.bar-fill').forEach(el => {
      el.style.width = el.dataset.pct + '%';
    });
  }, 100);

  document.getElementById('aiInsight').textContent = INSIGHTS[emotion] || '';

  const rxs = PRESCRIPTIONS[emotion] || PRESCRIPTIONS['焦虑'];
  document.getElementById('rxGrid').innerHTML = rxs.map(rx => `
    <div class="rx-card ${rx.type}" onclick="doAction('${rx.action}')">
      <div class="rx-card-icon">${rx.icon}</div>
      <div class="rx-card-title">${rx.title}</div>
      <div class="rx-card-desc">${rx.desc}</div>
    </div>`).join('');

  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function updateStats(emotion, intensity) {
  sessionCount++;
  const emotionScore = {
    开心:9, 平静:8, 疲惫:4, 孤独:3, 迷茫:4, 焦虑:3, 悲伤:2, 愤怒:2
  };
  const score = emotionScore[emotion] || 5;
  totalScore += score;

  document.getElementById('countVal').textContent = sessionCount;
  document.getElementById('scoreVal').textContent = (totalScore / sessionCount).toFixed(1);

  const now = new Date();
  const timeStr = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
  const colors = { 开心:'#EAF3DE', 平静:'#EAF3DE', 焦虑:'#FAEEDA', 悲伤:'#E6F1FB', 愤怒:'#FCEBEB', 疲惫:'#F1EFE8', 孤独:'#EEEDFE', 迷茫:'#F1EFE8' };
  const icons = { 开心:'😊', 平静:'😌', 焦虑:'😰', 悲伤:'😢', 愤怒:'😤', 疲惫:'😩', 孤独:'🥺', 迷茫:'😵‍💫' };

  history.unshift({ emotion, intensity, time: timeStr, color: colors[emotion]||'#F1EFE8', icon: icons[emotion]||'😶' });
  if (history.length > 5) history.pop();

  const listEl = document.getElementById('historyList');
  listEl.innerHTML = history.map(h => `
    <li class="history-item">
      <div class="h-icon" style="background:${h.color}">${h.icon}</div>
      <div class="h-text">
        <div class="h-name">${h.emotion}（强度 ${h.intensity}）</div>
        <div class="h-time">今天 ${h.time}</div>
      </div>
    </li>`).join('');
}

function doAction(action) {
  if (action === 'breath') {
    document.getElementById('breathModal').classList.add('show');
  } else if (action === 'music') {
    alert('🎵 音乐功能\n\n实际产品中将接入网易云 / Spotify API，根据情绪智能推荐歌单。此为 Demo 演示。');
  } else if (action === 'talk') {
    alert('💬 AI 陪伴对话\n\n实际产品中将启动专属情感陪伴对话，AI 会根据情绪状态调整对话策略。此为 Demo 演示。');
  } else if (action === 'write') {
    alert('📝 情绪写作\n\n引导式情绪日记功能，AI 会用苏格拉底提问法帮你梳理思绪。此为 Demo 演示。');
  } else if (action === 'walk') {
    alert('🚶 运动/外出建议\n\n结合当前位置推荐附近公园或步行路线，并设置5分钟计时提醒。此为 Demo 演示。');
  } else if (action === 'nap') {
    alert('😴 微睡眠引导\n\n10分钟倒计时 + 渐进式放松引导音频，配合智能手环可在浅睡时叫醒。此为 Demo 演示。');
  }
}

/* ── 呼吸练习 ── */
let breathTimer = null;
let breathPhase = 0;
let breathCount = 0;

function startBreath() {
  document.getElementById('breathStartBtn').style.display = 'none';
  breathPhase = 0;
  breathCount = 0;
  runBreath();
}

const PHASES = [
  { label:'用鼻子吸气', scale:1.4, dur:4000, text:'吸气…' },
  { label:'屏住呼吸', scale:1.4, dur:7000, text:'屏住…' },
  { label:'用嘴缓慢呼气', scale:1.0, dur:8000, text:'呼气…' },
];

function runBreath() {
  const p = PHASES[breathPhase];
  const circle = document.getElementById('breathCircle');
  const label = document.getElementById('phaseLabel');
  circle.textContent = p.text;
  circle.style.transform = 'scale(' + p.scale + ')';
  label.textContent = p.label + '（' + (p.dur/1000) + ' 秒）';

  breathTimer = setTimeout(() => {
    breathPhase = (breathPhase + 1) % 3;
    if (breathPhase === 0) breathCount++;
    if (breathCount >= 4) {
      circle.textContent = '完成!';
      label.textContent = '很棒！做了 4 个完整循环 ✓';
      circle.style.transform = 'scale(1)';
      document.getElementById('breathStartBtn').textContent = '再做一次';
      document.getElementById('breathStartBtn').style.display = 'inline-block';
      return;
    }
    runBreath();
  }, p.dur);
}

function closeBreath() {
  if (breathTimer) clearTimeout(breathTimer);
  document.getElementById('breathModal').classList.remove('show');
  const circle = document.getElementById('breathCircle');
  circle.textContent = '准备好';
  circle.style.transform = 'scale(1)';
  document.getElementById('phaseLabel').textContent = '点击开始';
  document.getElementById('breathStartBtn').textContent = '开始练习';
  document.getElementById('breathStartBtn').style.display = 'inline-block';
}
