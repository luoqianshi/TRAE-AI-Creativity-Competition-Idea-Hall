<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨境寻踪 - 语文学习文字冒险</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Serif SC', serif;
  background: #F5F0E8;
  color: #2C2416;
  min-height: 100vh;
  overflow-x: hidden;
}
#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
}
.page {
  max-width: 720px;
  width: 100%;
  display: none;
  animation: fadeIn 0.6s ease;
}
.page.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.particles {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.particle {
  position: absolute;
  width: 4px; height: 4px;
  background: rgba(139, 115, 85, 0.3);
  border-radius: 50%;
  animation: float 15s infinite ease-in-out;
}
@keyframes float {
  0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
  50% { transform: translateY(-100px) translateX(50px); opacity: 0.6; }
}
.content-wrapper { position: relative; z-index: 1; }
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div id="app">

<!-- 开始页面 -->
<div class="page active" id="start-page">
  <div class="content-wrapper" style="text-align:center;">
    <div style="font-size:64px; margin-bottom:20px;">📜</div>
    <h1 style="font-size:48px; font-weight:700; color:#5C4033; margin-bottom:16px; letter-spacing:8px;">墨境寻踪</h1>
    <p style="font-size:18px; color:#8B7355; margin-bottom:8px;">穿越文字世界的语文冒险</p>
    <p style="font-size:14px; color:#A08060; margin-bottom:48px;">—— 在故事中学习，在冒险中成长 ——</p>
    <button onclick="goToDifficulty()" style="padding:16px 48px; font-size:20px; background:#5C4033; color:#F5F0E8; border:none; border-radius:8px; cursor:pointer; font-family:inherit; letter-spacing:4px; transition:all 0.3s;">开始冒险</button>
    <div style="margin-top:32px; font-size:13px; color:#A08060;">
      <p>✨ 与李白对饮论诗</p>
      <p>📖 探索成语幻境</p>
      <p>🏛️ 挑战古文密室</p>
    </div>
  </div>
</div>

<!-- 难度选择页面 -->
<div class="page" id="difficulty-page">
  <div class="content-wrapper">
    <h2 style="text-align:center; font-size:32px; color:#5C4033; margin-bottom:8px;">选择难度</h2>
    <p style="text-align:center; color:#8B7355; margin-bottom:40px;">请选择适合你的挑战级别</p>
    <div id="difficulty-list" style="display:flex; flex-direction:column; gap:16px;"></div>
    <div style="text-align:center; margin-top:32px;">
      <button onclick="startGame()" id="start-btn" style="padding:14px 40px; font-size:18px; background:#5C4033; color:#F5F0E8; border:none; border-radius:8px; cursor:pointer; font-family:inherit; letter-spacing:2px; transition:all 0.3s;">开始游戏</button>
    </div>
  </div>
</div>

<!-- 游戏页面 -->
<div class="page" id="game-page">
  <div class="content-wrapper">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; padding:12px 16px; background:rgba(255,255,255,0.5); border-radius:8px;">
      <div style="font-size:14px; color:#8B7355;">
        <span id="chapter-name">序章</span>
      </div>
      <div style="font-size:14px; color:#5C4033; font-weight:600;">
        分数：<span id="score">0</span>
      </div>
    </div>
    <div id="scene-container" style="background:rgba(255,255,255,0.7); border-radius:16px; padding:32px; min-height:400px; backdrop-filter:blur(10px);"></div>
  </div>
</div>

<!-- 回顾页面 -->
<div class="page" id="review-page">
  <div class="content-wrapper">
    <h2 style="text-align:center; font-size:28px; color:#5C4033; margin-bottom:32px;">知识回顾</h2>
    <div id="review-list" style="display:flex; flex-direction:column; gap:16px; margin-bottom:32px;"></div>
    <div style="text-align:center;">
      <button onclick="goToEnding()" style="padding:12px 32px; font-size:16px; background:#5C4033; color:#F5F0E8; border:none; border-radius:8px; cursor:pointer; font-family:inherit;">查看结局</button>
    </div>
  </div>
</div>

<!-- 结局页面 -->
<div class="page" id="ending-page">
  <div class="content-wrapper" style="text-align:center;">
    <div id="ending-emoji" style="font-size:80px; margin-bottom:24px;">🏆</div>
    <h2 id="ending-title" style="font-size:36px; color:#5C4033; margin-bottom:16px;">学神归来</h2>
    <p id="ending-desc" style="font-size:18px; color:#8B7355; margin-bottom:32px;">你对语文知识的掌握令人惊叹！</p>
    <div style="display:flex; justify-content:center; gap:48px; margin-bottom:40px;">
      <div>
        <div style="font-size:36px; font-weight:700; color:#C9372C;" id="final-score">0</div>
        <div style="font-size:14px; color:#8B7355;">总分数</div>
      </div>
      <div>
        <div style="font-size:36px; font-weight:700; color:#5B8A5E;" id="final-accuracy">0%</div>
        <div style="font-size:14px; color:#8B7355;">正确率</div>
      </div>
      <div>
        <div style="font-size:36px; font-weight:700; color:#4A6FA5;" id="final-count">0</div>
        <div style="font-size:14px; color:#8B7355;">答对题数</div>
      </div>
    </div>
    <div style="display:flex; gap:16px; justify-content:center;">
      <button onclick="goToReview()" style="padding:12px 28px; font-size:16px; background:#F5F0E8; color:#5C4033; border:2px solid #8B7355; border-radius:8px; cursor:pointer; font-family:inherit;">回顾知识</button>
      <button onclick="restartGame()" style="padding:12px 28px; font-size:16px; background:#5C4033; color:#F5F0E8; border:none; border-radius:8px; cursor:pointer; font-family:inherit;">再玩一次</button>
    </div>
  </div>
</div>

</div>

<script>
// ========== 游戏数据 ==========
var gameData = {
  difficulty: 'normal',
  score: 0,
  totalQuestions: 0,

var difficultyMultiplier = { easy: 0.5, normal: 1, hard: 1.5 };

var difficulties = [
  { id: 'easy', name: '初学入门', subtitle: '简单模式', desc: '题目较简单，适合刚接触语文知识的同学。每题10分', icon: '📗', color: '#5B8A5E' },
  { id: 'normal', name: '饱读诗书', subtitle: '普通模式', desc: '标准难度，适合有一定基础的同学。每题20分', icon: '📘', color: '#4A6FA5' },
  { id: 'hard', name: '学富五车', subtitle: '困难模式', desc: '题目有深度，适合语文学霸挑战。每题30分', icon: '📕', color: '#C9372C' }
];

var scenes = [
  { id:'prologue-1', chapter:0, type:'narration', text:'你是一名热爱语文的中学生。某天深夜，你在图书馆翻阅一本古籍时，突然一道耀眼的光芒从书页中射出...', nextScene:'prologue-2' },
  { id:'prologue-2', chapter:0, type:'narration', text:'当你再次睁开眼睛，发现自己身处一座古色古香的书院之中。四周竹影婆娑，墨香四溢。一位白发老者微笑着向你走来。', nextScene:'prologue-3' },
  { id:'prologue-3', chapter:0, type:'dialogue', character:'墨先生', characterEmoji:'👴', text:'欢迎你，来自远方的学子。这里是"墨境"，一个由文字构筑的世界。若想找到回家的路，你须通过三道文试，证明你对中华文字的领悟。', nextScene:'prologue-4' },
  { id:'prologue-4', chapter:0, type:'dialogue', character:'墨先生', characterEmoji:'👴', text:'第一道试炼在"诗林"，第二道在"成语幻境"，第三道在"古文密室"。每通过一关，你就能获得一块"文心碎片"。收集齐三块，回家之门便会开启。', nextScene:'chapter1-start' },
  { id:'chapter1-start', chapter:1, type:'narration', text:'你来到一片竹林深处，竹叶沙沙作响，仿佛在吟诵着什么。一位白衣飘飘的男子正举杯对月，口中念念有词。', nextScene:'chapter1-1' },
  { id:'chapter1-1', chapter:1, type:'quiz', character:'李白', characterEmoji:'🍶', text:'哈哈哈哈！小友也是来饮酒作诗的？我且考考你——"床前明月光"的下一句是什么？这可是我的得意之作！',
    choices:[
      { text:'疑是地上霜', isCorrect:true, score:20, feedback:'李白大笑："好！好！小友果然懂我！"' },
      { text:'低头思故乡', isCorrect:false, score:0, feedback:'李白摇头："那是第四句。不过无妨，再想想！"' },
      { text:'举头望明月', isCorrect:false, score:0, feedback:'李白摇头："那是第三句。不过无妨，再想想！"' }
    ], knowledgeId:'poetry-1', difficulty:'easy', nextScene:'chapter1-2', wrongNext:'chapter1-1-wrong' },
  { id:'chapter1-1-wrong', chapter:1, type:'dialogue', character:'李白', characterEmoji:'🍶', text:'这《静夜思》可是我最著名的诗之一。"床前明月光，疑是地上霜。举头望明月，低头思故乡。"你记住了吗？', nextScene:'chapter1-2' },
  { id:'chapter1-2', chapter:1, type:'quiz', character:'李白', characterEmoji:'🍶', text:'再来一题！"春眠不觉晓，处处闻啼鸟。"这首诗的题目是什么？',
    choices:[
      { text:'《春晓》', isCorrect:true, score:20, feedback:'李白点头："正是孟浩然的《春晓》！"' },
      { text:'《春夜喜雨》', isCorrect:false, score:0, feedback:'李白笑道："那是杜甫的诗。这是孟浩然的作品。"' },
      { text:'《咏柳》', isCorrect:false, score:0, feedback:'李白笑道："那是贺知章的诗。这是孟浩然的作品。"' }
    ], knowledgeId:'poetry-2', difficulty:'easy', nextScene:'chapter1-3', wrongNext:'chapter1-2-wrong' },
  { id:'chapter1-2-wrong', chapter:1, type:'dialogue', character:'李白', characterEmoji:'🍶', text:'这首诗是孟浩然的《春晓》。全诗为："春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。"描绘了春天早晨的美好景象。', nextScene:'chapter1-3' },
  { id:'chapter1-3', chapter:1, type:'quiz', character:'李白', characterEmoji:'🍶', text:'我在《将进酒》中写道："天生我材必有用"，下一句是什么？',
    choices:[
      { text:'千金散尽还复来', isCorrect:true, score:20, feedback:'李白仰天大笑："知我者，小友也！千金散尽还复来，何等豪情！"' },
      { text:'莫使金樽空对月', isCorrect:false, score:0, feedback:'李白摇头："那是上一句。人生得意须尽欢，莫使金樽空对月。"' },
      { text:'奔流到海不复回', isCorrect:false, score:0, feedback:'李白摇头："那是开头的诗句。君不见黄河之水天上来，奔流到海不复回。"' }
    ], knowledgeId:'poetry-3', difficulty:'normal', nextScene:'chapter1-4', wrongNext:'chapter1-3-wrong' },
  { id:'chapter1-3-wrong', chapter:1, type:'dialogue', character:'李白', characterEmoji:'🍶', text:'这是我《将进酒》中的名句："天生我材必有用，千金散尽还复来。"表达了怀才不遇又渴望用世的积极人生态度。', nextScene:'chapter1-4' },
  { id:'chapter1-4', chapter:1, type:'quiz', character:'李白', characterEmoji:'🍶', text:'"两个黄鹂鸣翠柳，一行白鹭上青天。"这首诗的作者是谁？',
    choices:[
      { text:'杜甫', isCorrect:true, score:20, feedback:'李白抚掌："正是子美佳作！我与杜甫是好友，他的诗沉郁顿挫，堪称诗圣。"' },
      { text:'王维', isCorrect:false, score:0, feedback:'李白摇头："王维擅长山水田园诗。这首是杜甫的《绝句》。"' },
      { text:'白居易', isCorrect:false, score:0, feedback:'李白摇头："白居易的诗通俗易懂。这首是杜甫的《绝句》。"' }

  { id:'chapter1-5', chapter:1, type:'quiz', character:'李白', characterEmoji:'🍶', text:'"独在异乡为异客，每逢佳节倍思亲。"这是谁的诗？',
    choices:[
      { text:'王维', isCorrect:true, score:20, feedback:'李白赞叹："没错！王维的《九月九日忆山东兄弟》，情深意切！"' },
      { text:'孟浩然', isCorrect:false, score:0, feedback:'李白摇头："孟浩然也写过很多好诗，但这首是王维所作。"' },
      { text:'王昌龄', isCorrect:false, score:0, feedback:'李白摇头："王昌龄是边塞诗人。这首是王维的作品。"' }
    ], knowledgeId:'poetry-5', difficulty:'normal', nextScene:'chapter1-6', wrongNext:'chapter1-5-wrong' },
  { id:'chapter1-5-wrong', chapter:1, type:'dialogue', character:'李白', characterEmoji:'🍶', text:'这是王维的《九月九日忆山东兄弟》："独在异乡为异客，每逢佳节倍思亲。遥知兄弟登高处，遍插茱萸少一人。"写的是重阳节思念亲人的感情。', nextScene:'chapter1-6' },
  { id:'chapter1-6', chapter:1, type:'quiz', character:'李白', characterEmoji:'🍶', text:'最后一题！"大漠孤烟直，长河落日圆。"这句诗描绘的是哪里的景色？',
    choices:[

      { text:'江南水乡', isCorrect:false, score:0, feedback:'李白摇头："江南是小桥流水人家。这句写的是塞外风光。"' },
      { text:'高山之巅', isCorrect:false, score:0, feedback:'李白摇头："高山之上不会有大漠。这句写的是塞外风光。"' }

  { id:'chapter1-end', chapter:1, type:'narration', text:'李白将一块散发着微光的碎片交到你手中——第一块"文心碎片"。你感受到一股温暖的力量流入体内。', nextScene:'chapter2-start' },
  { id:'chapter2-start', chapter:2, type:'narration', text:'穿过诗林，你来到一个奇异的空间。四周漂浮着无数汉字，它们不断组合、分解，变幻莫测。一位身着青衫的女子正在拼凑文字。', nextScene:'chapter2-1' },
  { id:'chapter2-1', chapter:2, type:'quiz', character:'文姬', characterEmoji:'📜', text:'欢迎来到成语幻境。我是文姬。请看这个成语——"画蛇添____"，空缺处应填什么字？',

var chapterNames = ['序章', '第一章 · 诗林迷踪', '第二章 · 成语幻境', '第三章 · 古文密室'];
var selectedDifficulty = 'normal';

// ========== 工具函数 ==========
function getSceneById(id) {
  for (var i = 0; i < scenes.length; i++) {
    if (scenes[i].id === id) return scenes[i];
  }
  return null;
}
function getKnowledgeById(id) {
  for (var i = 0; i < knowledgePoints.length; i++) {
    if (knowledgePoints[i].id === id) return knowledgePoints[i];
  }
  return null;
}
function showPage(id) {
  var pages = document.querySelectorAll('.page');
  for (var i = 0; i < pages.length; i++) {
    pages[i].classList.remove('active');
  }
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ========== 粒子背景 ==========
function initParticles() {
  var container = document.getElementById('particles');
  for (var i = 0; i < 30; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 15 + 's';
    p.style.animationDuration = (10 + Math.random() * 10) + 's';
    container.appendChild(p);
  }
}

// ========== 难度选择 ==========
function goToDifficulty() {
  renderDifficultyList();
  showPage('difficulty-page');
}
function renderDifficultyList() {
  var list = document.getElementById('difficulty-list');
  list.innerHTML = '';
  for (var i = 0; i < difficulties.length; i++) {
    var d = difficulties[i];
    var card = document.createElement('div');
    card.style.cssText = 'padding:20px 24px; background:rgba(255,255,255,0.8); border-radius:12px; cursor:pointer; transition:all 0.3s; border:2px solid ' + (selectedDifficulty === d.id ? d.color : 'transparent') + ';';
    card.onclick = (function(id) {
      return function() {
        selectedDifficulty = id;
        renderDifficultyList();
      };
    })(d.id);
    card.innerHTML = '<div style="display:flex; align-items:center; gap:16px;">' +
      '<div style="font-size:36px;">' + d.icon + '</div>' +
      '<div style="flex:1;">' +
        '<div style="font-size:20px; font-weight:600; color:' + d.color + ';">' + d.name + ' <span style="font-size:14px; font-weight:normal; color:#8B7355;">' + d.subtitle + '</span></div>' +
        '<div style="font-size:14px; color:#8B7355; margin-top:4px;">' + d.desc + '</div>' +
      '</div>' +
      '<div style="width:20px; height:20px; border-radius:50%; border:2px solid ' + d.color + '; display:flex; align-items:center; justify-content:center;">' +
        (selectedDifficulty === d.id ? '<div style="width:10px; height:10px; border-radius:50%; background:' + d.color + ';"></div>' : '') +
      '</div>' +
    '</div>';
    list.appendChild(card);
  }
}

// ========== 游戏逻辑 ==========
function startGame() {
  gameData.difficulty = selectedDifficulty;
  gameData.score = 0;
  gameData.totalQuestions = 0;
  gameData.correctAnswers = 0;
  gameData.currentSceneId = 'prologue-1';
  gameData.collectedKnowledge = [];
  gameData.isShowingFeedback = false;
  showPage('game-page');
  renderScene();
}

function renderScene() {
  var scene = getSceneById(gameData.currentSceneId);
  if (!scene) return;
  if (scene.id === 'ending') {
    goToEnding();
    return;
  }

  document.getElementById('chapter-name').textContent = chapterNames[scene.chapter];
  document.getElementById('score').textContent = gameData.score;

  var container = document.getElementById('scene-container');
  var html = '';

  if (scene.type === 'narration') {
    html = '<div style="text-align:center; padding:40px 20px;">' +
      '<div style="font-size:48px; margin-bottom:24px; opacity:0.6;">📖</div>' +
      '<p style="font-size:18px; line-height:2; color:#2C2416;">' + scene.text + '</p>' +
      '<button onclick="nextScene()" style="margin-top:40px; padding:12px 32px; font-size:16px; background:#5C4033; color:#F5F0E8; border:none; border-radius:8px; cursor:pointer; font-family:inherit;">继续</button>' +
    '</div>';
  } else {
    var charColor = scene.characterId === 'libai' ? '#C9372C' : scene.characterId === 'wenji' ? '#5B8A5E' : scene.characterId === 'hanxiansheng' ? '#8B7355' : '#4A6FA5';
    html = '<div style="display:flex; gap:20px; margin-bottom:24px;">' +
      '<div style="width:80px; height:80px; border-radius:50%; background:' + charColor + '20; display:flex; align-items:center; justify-content:center; font-size:40px; flex-shrink:0;">' + (scene.characterEmoji || '👤') + '</div>' +
      '<div style="flex:1;">' +
        '<div style="font-size:16px; font-weight:600; color:' + charColor + '; margin-bottom:8px;">' + scene.character + '</div>' +
        '<div style="background:' + charColor + '10; padding:16px 20px; border-radius:12px; font-size:17px; line-height:1.8; color:#2C2416; position:relative;">' +
          scene.text +
        '</div>' +
      '</div>' +
    '</div>';

    if (scene.type === 'quiz' && !gameData.isShowingFeedback) {
      html += '<div style="margin-top:24px; display:flex; flex-direction:column; gap:12px;">';
      for (var i = 0; i < scene.choices.length; i++) {
        var idx = i;
        html += '<button onclick="chooseAnswer(' + idx + ')" style="padding:14px 20px; background:#F5F0E8; border:2px solid #D4C5B0; border-radius:8px; text-align:left; font-size:16px; cursor:pointer; font-family:inherit; color:#2C2416; transition:all 0.2s;" onmouseover="this.style.borderColor=\'' + charColor + '\'" onmouseout="this.style.borderColor=\'#D4C5B0\'">' +
          String.fromCharCode(65 + i) + '. ' + scene.choices[i].text +
        '</button>';
      }
      html += '</div>';
    } else if (scene.type === 'dialogue' || gameData.isShowingFeedback) {
      html += '<div style="text-align:center; margin-top:32px;">' +
        '<button onclick="nextScene()" style="padding:12px 32px; font-size:16px; background:#5C4033; color:#F5F0E8; border:none; border-radius:8px; cursor:pointer; font-family:inherit;">继续</button>' +
      '</div>';
    }
  }

  container.innerHTML = html;
}

function chooseAnswer(idx) {
  var scene = getSceneById(gameData.currentSceneId);
  if (!scene || scene.type !== 'quiz') return;
  var choice = scene.choices[idx];
  var multiplier = difficultyMultiplier[gameData.difficulty];
  var actualScore = Math.round(choice.score * multiplier);

  gameData.totalQuestions++;
  if (choice.isCorrect) {
    gameData.correctAnswers++;
    gameData.score += actualScore;
  }

  if (scene.knowledgeId && gameData.collectedKnowledge.indexOf(scene.knowledgeId) === -1) {
    gameData.collectedKnowledge.push(scene.knowledgeId);
  }

  gameData.isShowingFeedback = true;
  gameData.lastFeedback = choice.feedback;
  gameData.lastCorrect = choice.isCorrect;
  gameData.lastNextScene = choice.isCorrect ? scene.nextScene : (scene.wrongNext || scene.nextScene);

  var container = document.getElementById('scene-container');
  var charColor = scene.characterId === 'libai' ? '#C9372C' : scene.characterId === 'wenji' ? '#5B8A5E' : scene.characterId === 'hanxiansheng' ? '#8B7355' : '#4A6FA5';

  var html = '<div style="display:flex; gap:20px; margin-bottom:24px;">' +
    '<div style="width:80px; height:80px; border-radius:50%; background:' + charColor + '20; display:flex; align-items:center; justify-content:center; font-size:40px; flex-shrink:0;">' + (scene.characterEmoji || '👤') + '</div>' +
    '<div style="flex:1;">' +
      '<div style="font-size:16px; font-weight:600; color:' + charColor + '; margin-bottom:8px;">' + scene.character + '</div>' +
      '<div style="background:' + charColor + '10; padding:16px 20px; border-radius:12px; font-size:17px; line-height:1.8; color:#2C2416;">' +
        choice.feedback +
      '</div>' +
    '</div>' +
  '</div>';

  html += '<div style="margin-top:16px; padding:12px 16px; border-radius:8px; background:' + (choice.isCorrect ? '#E8F5E9' : '#FFEBEE') + '; color:' + (choice.isCorrect ? '#2E7D32' : '#C62828') + '; text-align:center; font-weight:600;">' +
    (choice.isCorrect ? '✓ 回答正确！+' + actualScore + '分' : '✗ 回答错误') +
  '</div>';

  html += '<div style="text-align:center; margin-top:24px;">' +
    '<button onclick="afterFeedback()" style="padding:12px 32px; font-size:16px; background:#5C4033; color:#F5F0E8; border:none; border-radius:8px; cursor:pointer; font-family:inherit;">继续</button>' +
  '</div>';

  container.innerHTML = html;
  document.getElementById('score').textContent = gameData.score;
}

function afterFeedback() {
  gameData.isShowingFeedback = false;
  gameData.currentSceneId = gameData.lastNextScene;
  renderScene();
}

function nextScene() {
  var scene = getSceneById(gameData.currentSceneId);
  if (!scene) return;
  if (scene.type === 'quiz') {
    gameData.currentSceneId = scene.nextScene;
  } else if (scene.nextScene) {
    gameData.currentSceneId = scene.nextScene;
  }
  renderScene();
}

// ========== 结局 ==========
function goToEnding() {
  var accuracy = gameData.totalQuestions > 0 ? Math.round(gameData.correctAnswers / gameData.totalQuestions * 100) : 0;
  var title, desc, emoji;
  if (accuracy >= 80) {
    title = '学神归来'; desc = '你对语文知识的掌握令人惊叹！'; emoji = '🏆';
  } else if (accuracy >= 60) {
    title = '书生归来'; desc = '你展现出了扎实的语文功底。'; emoji = '📚';
  } else {
    title = '继续修行'; desc = '这次穿越之旅让你发现了自己在语文学习上的不足。'; emoji = '💪';
  }
  document.getElementById('ending-emoji').textContent = emoji;
  document.getElementById('ending-title').textContent = title;
  document.getElementById('ending-desc').textContent = desc;
  document.getElementById('final-score').textContent = gameData.score;
  document.getElementById('final-accuracy').textContent = accuracy + '%';
  document.getElementById('final-count').textContent = gameData.correctAnswers + '/' + gameData.totalQuestions;
  showPage('ending-page');
}

function goToReview() {
  var list = document.getElementById('review-list');
  list.innerHTML = '';
  var catNames = { poetry: '古诗词', idiom: '成语', classical: '文言文', novel: '古典名著' };
  var catColors = { poetry: '#C9372C', idiom: '#5B8A5E', classical: '#8B7355', novel: '#4A6FA5' };

  for (var i = 0; i < gameData.collectedKnowledge.length; i++) {
    var kp = getKnowledgeById(gameData.collectedKnowledge[i]);
    if (!kp) continue;
    var card = document.createElement('div');
    card.style.cssText = 'padding:20px; background:rgba(255,255,255,0.8); border-radius:12px; border-left:4px solid ' + catColors[kp.category] + ';';
    card.innerHTML =
      '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">' +
        '<div style="font-size:18px; font-weight:600; color:#2C2416;">' + kp.title + '</div>' +
        '<div style="font-size:12px; padding:4px 10px; background:' + catColors[kp.category] + '20; color:' + catColors[kp.category] + '; border-radius:4px;">' + catNames[kp.category] + '</div>' +
      '</div>' +
      '<div style="font-size:15px; color:#5C4033; margin-bottom:8px; font-style:italic;">"' + kp.content + '"</div>' +
      '<div style="font-size:14px; color:#8B7355; line-height:1.7;">' + kp.explanation + '</div>' +
      (kp.source ? '<div style="font-size:13px; color:#A08060; margin-top:8px; text-align:right;">—— ' + kp.source + '</div>' : '');
    list.appendChild(card);
  }
  showPage('review-page');
}

function restartGame() {
  gameData.score = 0;
  gameData.totalQuestions = 0;
  gameData.correctAnswers = 0;
  gameData.currentSceneId = 'prologue-1';
  gameData.collectedKnowledge = [];
  gameData.isShowingFeedback = false;
  showPage('start-page');
}

// ========== 初始化 ==========
initParticles();
</script>
</body>
</html>
