<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>夜光柔控 · 小夜灯配置</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent: #fbbf24;
      --accent-hover: #fcd34d;
      --border: #475569;
      --transition: all 0.25s ease;
      --radius: 16px;
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
      --pulse: #fbbf2420;
    }

    .light-mode {
      --bg-primary: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #f1f5f9;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --accent: #eab308;
      --accent-hover: #d97706;
      --border: #cbd5e1;
      --pulse: #eab30820;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      min-height: 100vh;
      transition: var(--transition);
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
      padding: 16px 0;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--accent), #fcd34d);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-md);
      transition: var(--transition);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
    }

    .slider-group {
      margin-bottom: 24px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .slider-wrap {
      position: relative;
      height: 40px;
      margin: 16px 0;
    }

    input[type="range"] {
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      outline: none;
      width: 100%;
      cursor: pointer;
      transition: var(--transition);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
      transition: var(--transition);
    }

    input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
    }

    .value-display {
      text-align: center;
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--accent);
      margin-top: 4px;
      min-height: 24px;
    }

    .preview-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin-top: 12px;
    }

    .led-preview {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #1e293b;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.7), 0 0 40px rgba(251, 191, 36, 0.3);
      transition: var(--transition);
    }

    .led-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at center, var(--accent) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }

    .led-active .led-glow {
      opacity: 0.7;
    }

    .led-active {
      box-shadow: 
        inset 0 0 30px rgba(0,0,0,0.7),
        0 0 60px rgba(251, 191, 36, 0.6),
        0 0 100px rgba(251, 191, 36, 0.4);
      background: #0f172a;
    }

    .led-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-align: center;
      max-width: 300px;
    }

    .mode-toggle {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: var(--radius);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
      margin-top: 8px;
    }

    .mode-toggle:hover:not(:disabled) {
      background: var(--accent);
      color: var(--bg-primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .mode-toggle:active:not(:disabled) {
      transform: translateY(0);
    }

    .mode-toggle[disabled] {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
    }

    footer {
      text-align: center;
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Responsive */
    @media (max-width: 640px) {
      h1 { font-size: 1.5rem; }
      .card { padding: 20px; }
      .led-preview { width: 100px; height: 100px; }
      .mode-toggle { padding: 12px 24px; font-size: 1rem; }
    }

    /* Animation for smooth LED glow */
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 var(--pulse); }
      70% { box-shadow: 0 0 0 12px var(--pulse); }
      100% { box-shadow: 0 0 0 0 var(--pulse); }
    }

    .led-pulse {
      animation: pulse 2s infinite;
    }

    /* Theme toggle button in header */
    .theme-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      transition: var(--transition);
    }

    .theme-toggle:hover {
      background: var(--accent);
      color: var(--bg-primary);
    }

    @media (max-width: 640px) {
      .theme-toggle {
        top: 12px;
        right: 12px;
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="切换明暗主题">🌙</button>

  <div class="container">
    <header>
      <h1>夜光柔控</h1>
      <p class="subtitle">USB小夜灯 · 手机扫码即配 · 渐亮渐灭不刺眼</p>
    </header>

    <main>
      <section class="card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H9.75a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h2.25zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H5.25a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h2.25zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-2.25a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h2.25zM21 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-2.25a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h2.25zM-1.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H-3.75a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h2.25z"/></svg>
          调光参数设置
        </h2>
        <div class="slider-group">
          <div class="slider-label">
            <span>起始亮度</span>
            <span id="brightnessValue">35%</span>
          </div>
          <div class="slider-wrap">
            <input type="range" id="brightness" min="10" max="60" value="35" step="5">
          </div>
        </div>

        <div class="slider-group">
          <div class="slider-label">
            <span>延时关闭</span>
            <span id="delayValue">15秒</span>
          </div>
          <div class="slider-wrap">
            <input type="range" id="delay" min="5" max="30" value="15" step="5">
          </div>
        </div>

        <div class="slider-group">
          <div class="slider-label">
            <span>感应灵敏度</span>
            <span id="sensitivityValue">中</span>
          </div>
          <div class="slider-wrap">
            <input type="range" id="sensitivity" min="1" max="3" value="2" step="1">
          </div>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H9.75a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h2.25zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H5.25a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h2.25zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-2.25a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h2.25zM21 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-2.25a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h2.25zM-1.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H-3.75a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h2.25z"/></svg>
          实时预览
        </h2>
        <div class="preview-section">
          <div class="led-preview" id="ledPreview">
            <div class="led-glow"></div>
          </div>
          <p class="led-label">人靠近时渐亮｜离开后缓灭｜当前参数已生效</p>
          <button class="mode-toggle" id="ledToggle">
            🌙 柔光待机
          </button>
          <div class="status-indicator">
            <span class="status-dot"></span>
            <span>设备已连接 · 配置即时同步</span>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>USB供电 · 红外+光敏双感应 · 即扫即配 · 无需APP</p>
    </footer>
  </div>

  <script>
    // DOM Elements
    const themeToggle = document.getElementById('themeToggle');
    const ledToggle = document.getElementById('ledToggle');
    const ledPreview = document.getElementById('ledPreview');
    const brightnessSlider = document.getElementById('brightness');
    const delaySlider = document.getElementById('delay');
    const sensitivitySlider = document.getElementById('sensitivity');
    const brightnessValue = document.getElementById('brightnessValue');
    const delayValue = document.getElementById('delayValue');
    const sensitivityValue = document.getElementById('sensitivityValue');

    // Initial state
    let isLedOn = false;

    // Theme toggle
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      themeToggle.textContent = isLight ? '☀️' : '🌙';
    });

    // LED toggle with animation
    ledToggle.addEventListener('click', () => {
      if (isLedOn) {
        ledPreview.classList.remove('led-active');
        ledPreview.classList.remove('led-pulse');
        ledToggle.textContent = '🌙 柔光待机';
        isLedOn = false;
      } else {
        ledPreview.classList.add('led-active');
        ledPreview.classList.add('led-pulse');
        ledToggle.textContent = '💡 柔光开启';
        isLedOn = true;
      }
    });

    // Slider updates
    function updateSliderValue(slider, valueEl, formatFn) {
      slider.addEventListener('input', () => {
        const value = parseInt(slider.value);
        valueEl.textContent = formatFn(value);
      });
    }

    updateSliderValue(brightnessSlider, brightnessValue, v => `${v}%`);
    updateSliderValue(delaySlider, delayValue, v => `${v}秒`);
    updateSliderValue(sensitivitySlider, sensitivityValue, v => {
      const labels = ['低', '中', '高'];
      return labels[v - 1] || '中';
    });

    // Initialize values on load
    brightnessValue.textContent = `${brightnessSlider.value}%`;
    delayValue.textContent = `${delaySlider.value}秒`;
    sensitivityValue.textContent = ['低', '中', '高'][sensitivitySlider.value - 1];

    // Prevent accidental long press on mobile
    document.querySelectorAll('input[type="range"]').forEach(slider => {
      slider.addEventListener('touchstart', e => e.stopPropagation());
      slider.addEventListener('mousedown', e => e.stopPropagation());
    });
  </script>
</body>
</html>
