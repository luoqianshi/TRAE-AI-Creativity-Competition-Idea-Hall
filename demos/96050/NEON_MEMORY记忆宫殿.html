<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON MEMORY · 赛博记忆宫殿</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Courier New", "Consolas", monospace;
    background: #0a0a1a;
    color: #00f0ff;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
    background-size: 30px 30px;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(255, 0, 200, 0.15), transparent 60%);
    pointer-events: none;
  }
  .container { max-width: 920px; margin: 0 auto; padding: 50px 24px; position: relative; }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ff00c8;
    padding-bottom: 14px;
    margin-bottom: 36px;
    text-shadow: 0 0 8px #ff00c8;
  }
  .topbar .logo {
    font-size: 1.2rem;
    font-weight: bold;
    letter-spacing: 4px;
    color: #ff00c8;
  }
  .topbar .status { font-size: 0.8rem; color: #00f0ff; }
  .topbar .dot { color: #00ff88; }
  .title-block { margin-bottom: 32px; }
  .title-block h1 {
    font-size: 3rem;
    background: linear-gradient(90deg, #00f0ff, #ff00c8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 6px;
  }
  .title-block .sub { color: #888; font-size: 0.9rem; margin-top: 8px; letter-spacing: 2px; }
  .hud {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: #00f0ff;
    margin-bottom: 20px;
    padding: 8px 14px;
    border: 1px solid #00f0ff33;
    background: #00f0ff08;
  }
  .flash {
    perspective: 1000px;
    margin-bottom: 28px;
  }
  .card {
    min-height: 280px;
    border: 2px solid #00f0ff;
    background: linear-gradient(135deg, #0d0d2b, #1a0d2e);
    box-shadow:
      0 0 30px rgba(0, 240, 255, 0.4),
      inset 0 0 40px rgba(255, 0, 200, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    cursor: pointer;
    position: relative;
    transition: transform 0.4s, box-shadow 0.4s;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 50px rgba(255, 0, 200, 0.6), inset 0 0 60px rgba(0, 240, 255, 0.2);
  }
  .card::before, .card::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    border: 2px solid #ff00c8;
  }
  .card::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
  .card::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
  .card .q-text { font-size: 1.6rem; line-height: 1.6; letter-spacing: 2px; }
  .card .answer-mode { color: #ff00c8; text-shadow: 0 0 12px #ff00c8; }
  .card .scanline {
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, #00f0ff, transparent);
    animation: scan 3s linear infinite;
  }
  @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
  .card .hint { position: absolute; bottom: 14px; right: 18px; font-size: 0.7rem; color: #00f0ff88; letter-spacing: 2px; }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 30px;
  }
  .btn-cy {
    padding: 16px;
    background: transparent;
    border: 1px solid;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    letter-spacing: 3px;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .btn-fail { border-color: #ff0055; color: #ff0055; }
  .btn-fail:hover { background: #ff005522; box-shadow: 0 0 20px #ff005566; }
  .btn-pass { border-color: #ffcc00; color: #ffcc00; }
  .btn-pass:hover { background: #ffcc0022; box-shadow: 0 0 20px #ffcc0066; }
  .btn-mast { border-color: #00ff88; color: #00ff88; }
  .btn-mast:hover { background: #00ff8822; box-shadow: 0 0 20px #00ff8866; }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 20px;
    border: 1px solid #00f0ff33;
    padding: 20px;
    background: #00f0ff08;
  }
  .stat-cell { text-align: center; }
  .stat-cell .label { font-size: 0.7rem; color: #888; letter-spacing: 2px; }
  .stat-cell .value { font-size: 2rem; color: #00f0ff; text-shadow: 0 0 8px #00f0ff; margin: 6px 0; }
  .stat-cell.alt .value { color: #ff00c8; text-shadow: 0 0 8px #ff00c8; }
  .progress-bar {
    height: 8px;
    background: #0a0a1a;
    border: 1px solid #00f0ff;
    margin-top: 12px;
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #00f0ff, #ff00c8);
    width: 0%;
    transition: width 0.4s;
    box-shadow: 0 0 12px #ff00c8;
  }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="logo">⚡ NEON_MEMORY.exe</div>
    <div class="status"><span class="dot">●</span> SYS_ONLINE · v2.6</div>
  </div>

  <div class="title-block">
    <h1>记忆宫殿 v2.6</h1>
    <p class="sub">&gt; 点击卡片翻转 · 神经网络正在同步...</p>
  </div>

  <div class="hud">
    <span>SESSION: 2026-07-09</span>
    <span>LV: SCHOLAR · LV.12</span>
    <span id="timer">UPTIME: 00:00</span>
  </div>

  <div class="flash">
    <div class="card" id="card" onclick="flip()">
      <div class="scanline"></div>
      <div class="q-text" id="qText">AI 是什么的缩写？</div>
      <div class="hint">[ CLICK TO FLIP ]</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-cy btn-fail" onclick="answer('fail')">✗ 失忆</button>
    <button class="btn-cy btn-pass" onclick="answer('pass')">~ 模糊</button>
    <button class="btn-cy btn-mast" onclick="answer('mast')">✓ 掌握</button>
  </div>

  <div class="stats-grid">
    <div class="stat-cell">
      <div class="label">PROGRESS</div>
      <div class="value" id="prog">0%</div>
      <div class="progress-bar"><div class="progress-fill" id="progBar"></div></div>
    </div>
    <div class="stat-cell alt">
      <div class="label">MASTERED NODES</div>
      <div class="value" id="mastered">0 / 5</div>
    </div>
  </div>
</div>

<script>
  const deck = [
    { q: 'AI 是什么的缩写？', a: 'Artificial Intelligence / 人工智能' },
    { q: 'HTTP 默认端口？', a: '80' },
    { q: 'CSS 全称？', a: 'Cascading Style Sheets / 层叠样式表' },
    { q: 'TRAE 是什么？', a: '字节跳动推出的 AI IDE / 智能编程工具' },
    { q: 'JS 中创建常量的关键字？', a: 'const' }
  ];
  let idx = 0, mast = 0, flipped = false, start = Date.now();
  function tick() {
    const sec = Math.floor((Date.now() - start) / 1000);
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    document.getElementById('timer').textContent = `UPTIME: ${m}:${s}`;
  }
  setInterval(tick, 1000);
  function render() {
    flipped = false;
    document.getElementById('qText').textContent = deck[idx].q;
    document.getElementById('qText').className = 'q-text';
    document.getElementById('prog').textContent = Math.round(((idx + 1) / deck.length) * 100) + '%';
    document.getElementById('progBar').style.width = ((idx + 1) / deck.length * 100) + '%';
    document.getElementById('mastered').textContent = `${mast} / ${deck.length}`;
  }
  function flip() {
    const el = document.getElementById('qText');
    if (!flipped) {
      el.textContent = '>> ' + deck[idx].a;
      el.className = 'q-text answer-mode';
      flipped = true;
    } else {
      el.textContent = deck[idx].q;
      el.className = 'q-text';
      flipped = false;
    }
  }
  function answer(type) {
    if (type === 'mast') mast++;
    idx = (idx + 1) % deck.length;
    render();
  }
  render();
</script>
</body>
</html>
