<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>清明云祭 - 环保烧纸，心意不减</title>
<style>
/* ========== 基础重置与全局样式 ========== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
  background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 100%);
  color: #f0e6d3;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

/* ========== 应用容器 ========== */
#app {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* ========== 金币显示栏 ========== */
.coin-bar {
  position: fixed;
  top: 45px;
  right: 16px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: rgba(0,0,0,0.5);
  border-radius: 20px;
  border: 1px solid rgba(255,215,0,0.3);
  z-index: 1001;
  font-size: 15px;
  font-weight: 700;
}

.coin-bar .coin-icon {
  font-size: 18px;
}

.coin-bar .coin-amount {
  color: #ffd700;
  min-width: 60px;
  text-align: right;
}

/* ========== 屏幕基础样式 ========== */
.screen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  padding-top: 80px;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
  will-change: transform, opacity;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.screen.hidden {
  transform: translateX(100%);
  opacity: 0;
  pointer-events: none;
}

.screen.hidden-left {
  transform: translateX(-100%);
  opacity: 0;
  pointer-events: none;
}

.screen.active {
  transform: translateX(0);
  opacity: 1;
  pointer-events: auto;
}

/* ========== 进度指示器 ========== */
.progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 12px 20px;
  z-index: 1000;
  background: linear-gradient(180deg, rgba(10,10,26,0.95) 0%, transparent 100%);
}

.progress-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  transition: all 0.3s ease;
}

.progress-dot.active {
  background: #ffd700;
  box-shadow: 0 0 10px rgba(255,215,0,0.6);
  transform: scale(1.2);
}

.progress-dot.completed {
  background: #ff6b35;
}

/* ========== 开始画面 ========== */
#screen-start {
  background: radial-gradient(ellipse at center bottom, rgba(255,107,53,0.15) 0%, transparent 60%),
              linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 100%);
}

#screen-start::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(255,107,53,0.1) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  animation: heroGlow 4s ease-in-out infinite;
}

@keyframes heroGlow {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
  50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
}

.start-title {
  font-size: 48px;
  font-weight: 900;
  background: linear-gradient(135deg, #ffd700, #ff6b35);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  margin-bottom: 12px;
  letter-spacing: 8px;
  animation: titleGlow 3s ease-in-out infinite;
}

@keyframes titleGlow {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.3); }
}

.start-subtitle {
  font-size: 16px;
  color: rgba(240,230,211,0.7);
  margin-bottom: 50px;
  letter-spacing: 4px;
}

/* ========== 通用按钮 ========== */
.btn {
  padding: 14px 40px;
  border: none;
  border-radius: 50px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
  letter-spacing: 2px;
  font-family: inherit;
}

.btn-primary {
  background: linear-gradient(135deg, #ff6b35, #ff8c42);
  color: #fff;
  box-shadow: 0 4px 20px rgba(255,107,53,0.4);
}

.btn-primary:active {
  transform: scale(0.95);
  box-shadow: 0 2px 10px rgba(255,107,53,0.3);
}

.btn-primary:disabled {
  opacity: 0.5;
  pointer-events: none;
}

.btn-primary::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  background: rgba(255,255,255,0.2);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.4s, height 0.4s;
}

.btn-primary:active::after {
  width: 200px;
  height: 200px;
}

.btn-secondary {
  background: rgba(255,255,255,0.1);
  color: #f0e6d3;
  border: 1px solid rgba(255,255,255,0.2);
}

.btn-secondary:active {
  transform: scale(0.95);
  background: rgba(255,255,255,0.15);
}

.btn-small {
  padding: 10px 24px;
  font-size: 14px;
}

/* ========== 纸钱飘落粒子 ========== */
.falling-particle {
  position: fixed;
  width: 20px;
  height: 28px;
  background: linear-gradient(180deg, #f0e6d3, #d4c4a8);
  border-radius: 2px;
  opacity: 0.6;
  animation: paperFall linear infinite;
  pointer-events: none;
  z-index: 0;
}

.falling-particle::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 12px;
  height: 16px;
  border: 1px solid rgba(180,150,100,0.5);
  border-radius: 1px;
}

@keyframes paperFall {
  0% {
    transform: translateY(-50px) rotate(0deg) translateX(0);
    opacity: 0;
  }
  10% {
    opacity: 0.6;
  }
  90% {
    opacity: 0.4;
  }
  100% {
    transform: translateY(calc(100vh + 50px)) rotate(720deg) translateX(80px);
    opacity: 0;
  }
}

/* ========== 地点选择画面 ========== */
#screen-location .screen-title,
#screen-npc .screen-title,
#screen-items .screen-title,
#screen-burn .screen-title {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
  color: #ffd700;
}

#screen-location .screen-desc,
#screen-npc .screen-desc,
#screen-items .screen-desc {
  font-size: 14px;
  color: rgba(240,230,211,0.6);
  margin-bottom: 24px;
}

.location-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  width: 100%;
  max-width: 420px;
  padding-bottom: 80px;
}

.location-card {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 16px 8px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.location-card:active {
  transform: scale(0.95);
}

.location-card.selected {
  border-color: #ffd700;
  background: rgba(255,215,0,0.1);
  box-shadow: 0 0 20px rgba(255,215,0,0.2);
}

.location-card .icon {
  font-size: 30px;
  margin-bottom: 8px;
  display: block;
}

.location-card .name {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
}

.location-card .desc {
  font-size: 11px;
  color: rgba(240,230,211,0.5);
  line-height: 1.4;
}

.location-fengshui {
  display: flex;
  gap: 2px;
  justify-content: center;
  margin-top: 6px;
}
.location-fengshui .star {
  font-size: 10px;
  color: #ffd700;
}
.location-fengshui .star.empty {
  color: rgba(255,215,0,0.2);
}

/* ========== NPC遭遇画面 ========== */
.npc-container {
  background: rgba(255,255,255,0.06);
  border-radius: 20px;
  padding: 30px 24px;
  text-align: center;
  max-width: 360px;
  width: 100%;
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.npc-avatar {
  font-size: 64px;
  margin-bottom: 12px;
  animation: npcBounce 2s ease-in-out infinite;
}

@keyframes npcBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.npc-name {
  font-size: 22px;
  font-weight: 700;
  color: #ff6b35;
  margin-bottom: 4px;
}

.npc-personality {
  font-size: 13px;
  color: rgba(240,230,211,0.5);
  margin-bottom: 16px;
}

.npc-dialogue {
  font-size: 16px;
  line-height: 1.6;
  color: #f0e6d3;
  margin-bottom: 24px;
  padding: 16px;
  background: rgba(255,107,53,0.1);
  border-radius: 12px;
  border-left: 3px solid #ff6b35;
  text-align: left;
}

.npc-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

/* ========== 抽鬼牌画面 ========== */
#screen-card {
  padding-top: 90px;
  justify-content: flex-start;
  padding-bottom: 20px;
}

.card-game-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 400px;
}

.card-score {
  display: flex;
  justify-content: space-between;
  width: 100%;
  padding: 10px 16px;
  background: rgba(255,255,255,0.06);
  border-radius: 12px;
  font-size: 15px;
}

.card-score .player-score { color: #ffd700; }
.card-score .npc-score { color: #ff6b35; }
.card-round-info { font-size: 13px; color: rgba(240,230,211,0.6); }

/* 手牌区域 */
.hand-area {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  min-height: 100px;
  padding: 0 10px;
  position: relative;
}

.player-hand {
  min-height: 120px;
}

.npc-hand {
  min-height: 90px;
}

/* 手牌（扇形排列） */
.hand-card {
  width: 52px;
  height: 74px;
  border-radius: 8px;
  background: linear-gradient(135deg, #2a1a3e, #1a0a2e);
  border: 2px solid rgba(255,215,0,0.3);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.hand-card .hand-card-emoji {
  font-size: 22px;
  line-height: 1;
}

.hand-card .hand-card-name {
  font-size: 8px;
  color: rgba(255,215,0,0.7);
  margin-top: 2px;
  font-weight: 700;
}

/* 玩家手牌可点击 */
.player-hand .hand-card {
  border-color: rgba(255,215,0,0.4);
}

.player-hand .hand-card:hover,
.player-hand .hand-card:active {
  transform: translateY(-12px) scale(1.1);
  border-color: #ffd700;
  box-shadow: 0 4px 20px rgba(255,215,0,0.4);
  z-index: 10;
}

.player-hand .hand-card.disabled {
  opacity: 0.4;
  pointer-events: none;
}

/* NPC手牌（背面） */
.npc-hand .hand-card {
  cursor: default;
  border-color: rgba(255,107,53,0.3);
}

.npc-hand .hand-card .hand-card-emoji {
  font-size: 18px;
  color: rgba(255,107,53,0.5);
}

.npc-hand .hand-card .hand-card-name {
  color: rgba(255,107,53,0.4);
}

/* 出牌区 */
.play-area {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 24px;
  width: 100%;
  min-height: 110px;
}

.play-slot {
  width: 70px;
  height: 100px;
  border: 2px dashed rgba(255,255,255,0.15);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: all 0.4s ease;
}

.play-slot.has-card {
  border: 2px solid #ffd700;
  background: linear-gradient(135deg, #1a0a2e, #2a1a3e);
  box-shadow: 0 0 20px rgba(255,215,0,0.2);
}

.play-slot .play-emoji {
  font-size: 36px;
}

.play-slot .play-name {
  font-size: 12px;
  color: #ffd700;
  font-weight: 700;
  margin-top: 4px;
}

.card-vs {
  font-size: 24px;
  font-weight: 900;
  color: #ff6b35;
  text-shadow: 0 0 15px rgba(255,107,53,0.5);
}

.card-result-text {
  font-size: 16px;
  font-weight: 700;
  min-height: 24px;
  text-align: center;
}

.card-result-text.win { color: #ffd700; }
.card-result-text.lose { color: #ff4444; }
.card-result-text.draw { color: #aaa; }

.card-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

/* ========== 物品选择画面 ========== */
.items-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  width: 100%;
  max-width: 420px;
  padding-bottom: 110px;
}

.item-card {
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 12px 6px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.item-card:active {
  transform: scale(0.92);
}

.item-card.selected {
  border-color: #ff6b35;
  background: rgba(255,107,53,0.15);
  box-shadow: 0 0 20px rgba(255,107,53,0.3);
  animation: itemBounce 0.4s ease;
}

.item-card.disabled {
  opacity: 0.4;
  pointer-events: none;
}

@keyframes itemBounce {
  0% { transform: scale(0.9); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

.item-card .item-emoji {
  font-size: 28px;
  display: block;
  margin-bottom: 4px;
}

.item-card .item-name {
  font-size: 11px;
  color: rgba(240,230,211,0.8);
  font-weight: 500;
  margin-bottom: 4px;
}

.item-card .item-price {
  font-size: 10px;
  color: #ffd700;
  font-weight: 700;
}

/* 稀有度边框 */
.item-card.rarity-common {
  border-color: rgba(255,255,255,0.15);
}
.item-card.rarity-rare {
  border-color: #4fc3f7;
  box-shadow: 0 0 12px rgba(79,195,247,0.2);
}
.item-card.rarity-rare.selected {
  border-color: #4fc3f7;
  background: rgba(79,195,247,0.15);
  box-shadow: 0 0 20px rgba(79,195,247,0.4);
}
.item-card.rarity-epic {
  border-color: #ce93d8;
  box-shadow: 0 0 12px rgba(206,147,216,0.2);
}
.item-card.rarity-epic.selected {
  border-color: #ce93d8;
  background: rgba(206,147,216,0.15);
  box-shadow: 0 0 20px rgba(206,147,216,0.4);
}
.item-card.rarity-legendary {
  border-color: #ffd700;
  box-shadow: 0 0 15px rgba(255,215,0,0.3);
  animation: legendaryPulse 2s ease-in-out infinite;
}
.item-card.rarity-legendary.selected {
  border-color: #ffd700;
  background: rgba(255,215,0,0.15);
  box-shadow: 0 0 25px rgba(255,215,0,0.5);
}

@keyframes legendaryPulse {
  0%, 100% { box-shadow: 0 0 12px rgba(255,215,0,0.2); }
  50% { box-shadow: 0 0 20px rgba(255,215,0,0.4); }
}

/* 稀有度标签 */
.item-rarity-tag {
  display: inline-block;
  font-size: 9px;
  padding: 1px 6px;
  border-radius: 8px;
  font-weight: 700;
  margin-bottom: 2px;
}
.item-rarity-tag.common { background: rgba(255,255,255,0.15); color: #ccc; }
.item-rarity-tag.rare { background: rgba(79,195,247,0.2); color: #4fc3f7; }
.item-rarity-tag.epic { background: rgba(206,147,216,0.2); color: #ce93d8; }
.item-rarity-tag.legendary { background: rgba(255,215,0,0.2); color: #ffd700; }

.fixed-bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 16px 20px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(0deg, rgba(10,10,26,0.98) 0%, rgba(10,10,26,0.9) 70%, transparent 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  z-index: 100;
}

.selected-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 400px;
  font-size: 13px;
}

.selected-count {
  color: rgba(240,230,211,0.6);
}

.total-cost {
  color: #ffd700;
  font-weight: 700;
}

/* ========== 焚烧画面 ========== */
#screen-burn {
  padding: 0;
  padding-top: 60px;
  justify-content: flex-start;
}

.burn-canvas-container {
  position: relative;
  width: 100%;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

#fireCanvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.burn-items-display {
  position: absolute;
  bottom: 20%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 300px;
  z-index: 10;
}

.burn-item-emoji {
  font-size: 28px;
  animation: burnItemFloat 2s ease-in-out infinite;
  opacity: 0.9;
}

@keyframes burnItemFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.burn-item-emoji.burning {
  animation: burnAway 1.5s ease-in forwards;
}

@keyframes burnAway {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3) translateY(-30px); opacity: 0.6; }
  100% { transform: scale(0) translateY(-80px); opacity: 0; }
}

/* ========== 祝福语弹窗 ========== */
.blessing-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

.blessing-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.blessing-card {
  background: linear-gradient(135deg, #1a0a2e, #2a1a3e);
  border: 2px solid #ffd700;
  border-radius: 24px;
  padding: 40px 30px;
  text-align: center;
  max-width: 340px;
  width: 90%;
  transform: scale(0.8);
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 40px rgba(255,215,0,0.2);
}

.blessing-overlay.show .blessing-card {
  transform: scale(1);
}

.blessing-emoji {
  font-size: 48px;
  margin-bottom: 16px;
}

.blessing-text {
  font-size: 18px;
  line-height: 1.8;
  color: #f0e6d3;
  margin-bottom: 24px;
  white-space: pre-line;
}

.blessing-from {
  font-size: 13px;
  color: rgba(240,230,211,0.5);
  margin-bottom: 24px;
}

/* ========== Toast提示 ========== */
.toast-container {
  position: fixed;
  top: 100px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}

.toast {
  padding: 10px 24px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 500;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2s forwards;
  white-space: nowrap;
  max-width: 90vw;
  overflow: hidden;
  text-overflow: ellipsis;
}

.toast.info {
  background: rgba(255,215,0,0.9);
  color: #1a0a2e;
}

.toast.success {
  background: rgba(76,175,80,0.9);
  color: #fff;
}

.toast.error {
  background: rgba(244,67,54,0.9);
  color: #fff;
}

@keyframes toastIn {
  from { transform: translateY(-20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }

// ========== 音效系统（Web Audio API）==========
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new AudioCtx();
  }
  return audioCtx;
}

function playFireSound() {
  try {
    const ctx = getAudioCtx();
    const bufferSize = ctx.sampleRate * 2;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.15 * (1 - i / bufferSize);
    }
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 400;
    const gain = ctx.createGain();
    gain.gain.value = 0.3;
    source.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    source.start();
  } catch (e) {}
}

function playFlipSound() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.15);
  } catch (e) {}
}

function playWinSound() {
  try {
    const ctx = getAudioCtx();
    const notes = [523, 659, 784, 1047];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.12 + 0.3);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.12);
      osc.stop(ctx.currentTime + i * 0.12 + 0.3);
    });
  } catch (e) {}
}

function playLoseSound() {
  try {
    const ctx = getAudioCtx();
    const notes = [400, 350, 300, 200];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.15 + 0.3);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.15);
      osc.stop(ctx.currentTime + i * 0.15 + 0.3);
    });
  } catch (e) {}
}

function playClickSound() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 600;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.08);
  } catch (e) {}
}

// ========== Toast提示系统 ==========
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => {
    if (toast.parentNode) toast.parentNode.removeChild(toast);
  }, 2500);
}

// ========== 金币更新 ==========
function updateCoinDisplay() {
  document.getElementById('coinAmount').textContent = state.coins;
}

function addCoins(amount) {
  state.coins += amount;
  updateCoinDisplay();
}

function spendCoins(amount) {
  if (state.coins >= amount) {
    state.coins -= amount;
    updateCoinDisplay();
    return true;
  }
  return false;
}

// ========== 屏幕切换 ==========
const screenOrder = [
  'screen-start', 'screen-location', 'screen-npc',
  'screen-card', 'screen-items', 'screen-burn'
];

function goToScreen(screenId) {
  playClickSound();
  const prevScreen = document.getElementById(state.currentScreen);
  const nextScreen = document.getElementById(screenId);
  const prevIdx = screenOrder.indexOf(state.currentScreen);
  const nextIdx = screenOrder.indexOf(screenId);

  updateProgress(nextIdx);

  if (prevIdx < nextIdx) {
    prevScreen.className = 'screen hidden-left';
  } else {
    prevScreen.className = 'screen hidden';
  }
  nextScreen.className = 'screen active';

  state.currentScreen = screenId;

  // 显示/隐藏金币栏
  const coinBar = document.getElementById('coinBar');
  if (screenId === 'screen-start') {
    coinBar.style.display = 'none';
  } else {
    coinBar.style.display = 'flex';
    updateCoinDisplay();
  }

  // 屏幕初始化
  if (screenId === 'screen-location') initLocationScreen();
  if (screenId === 'screen-items') initItemsScreen();
  if (screenId === 'screen-burn') initBurnScreen();
}

function updateProgress(activeStep) {
  const dots = document.querySelectorAll('.progress-dot');
  dots.forEach((dot, i) => {
    dot.classList.remove('active', 'completed');
    if (i < activeStep) dot.classList.add('completed');
    if (i === activeStep) dot.classList.add('active');
  });
}

// ========== 地点选择画面 ==========
function initLocationScreen() {
  const grid = document.getElementById('locationGrid');
  grid.innerHTML = '';
  locations.forEach(loc => {
    const card = document.createElement('div');
    card.className = 'location-card';
    if (state.selectedLocation && state.selectedLocation.id === loc.id) {
      card.classList.add('selected');
    }
    let stars = '';
    for (let i = 0; i < 5; i++) {
      stars += `<span class="star ${i < loc.fengshui ? '' : 'empty'}">★</span>`;
    }
    card.innerHTML = `
      <span class="icon">${loc.icon}</span>
      <div class="name">${loc.name}</div>
      <div class="desc">${loc.desc}</div>
      <div class="location-fengshui">${stars}</div>
    `;
    card.addEventListener('click', () => selectLocation(loc));
    grid.appendChild(card);
  });
}

function selectLocation(loc) {
  playClickSound();
  state.selectedLocation = loc;

  if (Math.random() < 0.5) {
    const npc = npcs[Math.floor(Math.random() * npcs.length)];
    state.currentNpc = npc;
    showNpcScreen(npc);
  } else {
    state.hasFengshui = false;
    const starText = '★'.repeat(loc.fengshui) + '☆'.repeat(5 - loc.fengshui);
    showToast(`已选择「${loc.name}」风水${starText}`, 'success');
    goToScreen('screen-items');
  }
}

// ========== 抽鬼牌系统（手牌制）==========
function challengeNpc() {
  playClickSound();

  // 一方4士兵+皇帝，另一方必须4士兵+乞丐（互斥）
  const playerHasEmperor = Math.random() < 0.5;
  const playerSpecial = playerHasEmperor ? 'emperor' : 'beggar';
  const npcSpecial = playerHasEmperor ? 'beggar' : 'emperor';

  state.cardGame = {
    playerScore: 0,
    npcScore: 0,
    round: 1,
    playerHand: [],
    npcHand: [],
    isPlayerTurn: true,
    isAnimating: false,
    finished: false,
    turnPhase: 'player-pick'
  };

  // 构建手牌
  for (let i = 0; i < 4; i++) {
    state.cardGame.playerHand.push({ ...cardTypes.find(c => c.id === 'soldier') });
    state.cardGame.npcHand.push({ ...cardTypes.find(c => c.id === 'soldier') });
  }
  state.cardGame.playerHand.push({ ...cardTypes.find(c => c.id === playerSpecial) });
  state.cardGame.npcHand.push({ ...cardTypes.find(c => c.id === npcSpecial) });

  // 打乱手牌顺序
  shuffleArray(state.cardGame.playerHand);
  shuffleArray(state.cardGame.npcHand);

  document.getElementById('playerScore').textContent = '0';
  document.getElementById('npcScore').textContent = '0';
  document.getElementById('roundInfo').textContent = '第 1 局';
  document.getElementById('npcNameScore').innerHTML = `${state.currentNpc.name}: <span class="npc-score" id="npcScore">0</span>`;
  document.getElementById('cardResult').textContent = '';
  document.getElementById('cardResult').className = 'card-result-text';
  document.getElementById('cardDesc').textContent = '选择一张牌出战！3局2胜';
  document.getElementById('playerPlaySlot').innerHTML = '';
  document.getElementById('playerPlaySlot').className = 'play-slot';
  document.getElementById('npcPlaySlot').innerHTML = '';
  document.getElementById('npcPlaySlot').className = 'play-slot';

  renderHands();
  updateCardActions('pick');
  goToScreen('screen-card');
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function renderHands() {
  const playerHandEl = document.getElementById('playerHand');
  const npcHandEl = document.getElementById('npcHand');

  // 渲染玩家手牌（扇形）
  playerHandEl.innerHTML = '';
  const pCards = state.cardGame.playerHand;
  const pTotal = pCards.length;
  pCards.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'hand-card';
    if (state.cardGame.turnPhase !== 'player-pick') el.classList.add('disabled');

    const midIndex = (pTotal - 1) / 2;
    const offset = i - midIndex;
    const angle = offset * 8;
    const translateY = Math.abs(offset) * 4;

    el.style.transform = `rotate(${angle}deg) translateY(${translateY}px)`;
    el.style.transformOrigin = 'bottom center';
    el.style.zIndex = i;

    el.innerHTML = `
      <span class="hand-card-emoji">${card.emoji}</span>
      <span class="hand-card-name">${card.name}</span>
    `;
    el.addEventListener('click', () => playerPickCard(i));
    playerHandEl.appendChild(el);
  });

  // 渲染NPC手牌（扇形，背面）
  npcHandEl.innerHTML = '';
  const nCards = state.cardGame.npcHand;
  const nTotal = nCards.length;
  nCards.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'hand-card';

    const midIndex = (nTotal - 1) / 2;
    const offset = i - midIndex;
    const angle = offset * 8;
    const translateY = Math.abs(offset) * 4;

    el.style.transform = `rotate(${angle}deg) translateY(${translateY}px)`;
    el.style.transformOrigin = 'bottom center';
    el.style.zIndex = i;

    el.innerHTML = `
      <span class="hand-card-emoji">🂠</span>
      <span class="hand-card-name">???</span>
    `;
    npcHandEl.appendChild(el);
  });
}

function playerPickCard(index) {
  if (state.cardGame.turnPhase !== 'player-pick' || state.cardGame.isAnimating) return;
  playClickSound();
  state.cardGame.isAnimating = true;

  const playerCard = state.cardGame.playerHand.splice(index, 1)[0];

  // 显示玩家出牌
  const playerSlot = document.getElementById('playerPlaySlot');
  playerSlot.innerHTML = `<span class="play-emoji">${playerCard.emoji}</span><span class="play-name">${playerCard.name}</span>`;
  playerSlot.className = 'play-slot has-card';
  playFlipSound();

  state.cardGame.turnPhase = 'npc-pick';
  renderHands();

  // NPC延迟出牌
  setTimeout(() => {
    npcPickCard(playerCard);
  }, 1000);
}

function npcPickCard(playerCard) {
  // NPC简单AI：如果能赢就出赢的牌，否则出第一张
  const hand = state.cardGame.npcHand;
  let bestIdx = 0;

  for (let i = 0; i < hand.length; i++) {
    if (hand[i].beats === playerCard.id) {
      bestIdx = i;
      break;
    }
  }

  const npcCard = state.cardGame.npcHand.splice(bestIdx, 1)[0];

  // 显示NPC出牌
  const npcSlot = document.getElementById('npcPlaySlot');
  npcSlot.innerHTML = `<span class="play-emoji">${npcCard.emoji}</span><span class="play-name">${npcCard.name}</span>`;
  npcSlot.className = 'play-slot has-card';
  playFlipSound();

  renderHands();

  // 比较结果
  setTimeout(() => {
    resolveRound(playerCard, npcCard);
  }, 600);
}

function resolveRound(playerCard, npcCard) {
  let result;

  if (playerCard.beats === npcCard.id) {
    result = 'win';
    state.cardGame.playerScore++;
    document.getElementById('playerScore').textContent = state.cardGame.playerScore;
    playWinSound();
  } else if (npcCard.beats === playerCard.id) {
    result = 'lose';
    state.cardGame.npcScore++;
    document.getElementById('npcScore').textContent = state.cardGame.npcScore;
    playLoseSound();
  } else {
    result = 'draw';
  }

  const resultEl = document.getElementById('cardResult');
  const messages = {
    win: `${playerCard.emoji}${playerCard.name} 克制 ${npcCard.emoji}${npcCard.name}，你赢了这局！`,
    lose: `${npcCard.emoji}${npcCard.name} 克制 ${playerCard.emoji}${playerCard.name}，你输了这局！`,
    draw: `都出了${playerCard.name}，平局！`
  };
  resultEl.textContent = messages[result];
  resultEl.className = `card-result-text ${result}`;

  state.cardGame.isAnimating = false;

  const { playerScore, npcScore } = state.cardGame;
  if (playerScore >= 2 || npcScore >= 2 || (playerScore + npcScore) >= 3) {
    state.cardGame.finished = true;
    state.cardGame.turnPhase = 'game-end';
    setTimeout(() => endCardGame(), 1500);
  } else {
    state.cardGame.round++;
    document.getElementById('roundInfo').textContent = `第 ${state.cardGame.round} 局`;
    state.cardGame.turnPhase = 'player-pick';
    updateCardActions('pick');

    setTimeout(() => {
      document.getElementById('playerPlaySlot').innerHTML = '';
      document.getElementById('playerPlaySlot').className = 'play-slot';
      document.getElementById('npcPlaySlot').innerHTML = '';
      document.getElementById('npcPlaySlot').className = 'play-slot';
      document.getElementById('cardResult').textContent = '';
      renderHands();
    }, 1200);
  }
}

function endCardGame() {
  const { playerScore, npcScore } = state.cardGame;
  if (playerScore > npcScore) {
    state.hasFengshui = true;
    showToast('你赢了！获得风水加成！', 'success');
    updateCardActions('win');
  } else if (playerScore < npcScore) {
    state.hasFengshui = false;
    showToast('你输了...', 'error');
    updateCardActions('lose-chaobility');
  } else {
    state.hasFengshui = false;
    showToast('平局算你输...', 'error');
    updateCardActions('lose-chaobility');
  }
}

function updateCardActions(mode) {
  const actionsEl = document.getElementById('cardActions');
  switch (mode) {
    case 'pick':
      actionsEl.innerHTML = '<span style="color:rgba(240,230,211,0.5);font-size:13px;">👆 点击手牌出牌</span>';
      break;
    case 'win':
      actionsEl.innerHTML = '<button class="btn btn-primary btn-small" onclick="goToScreen(\'screen-items\')">进入焚烧</button>';
      break;
    case 'lose-chaobility':
      actionsEl.innerHTML = `
        <button class="btn btn-secondary btn-small" onclick="goToScreen('screen-location')">重新选地</button>
        <button class="btn btn-primary btn-small" onclick="useChaoAbility()">💰 钞能力 (🪙3000)</button>
      `;
      break;
    case 'chaobility-success':
      actionsEl.innerHTML = '<button class="btn btn-primary btn-small" onclick="goToScreen(\'screen-items\')">进入焚烧</button>';
      break;
    case 'chaobility-fail':
      actionsEl.innerHTML = '<button class="btn btn-secondary btn-small" onclick="goToScreen(\'screen-location\')">重新选地</button>';
      break;
    default:
      actionsEl.innerHTML = '';
  }
}

// ========== 钞能力系统 ==========
const CHAO_ABILITY_COST = 3000;

function useChaoAbility() {
  playClickSound();
  if (state.coins < CHAO_ABILITY_COST) {
    showToast('金币不足！需要3000金币', 'error');
    updateCardActions('chaobility-fail');
    return;
  }

  spendCoins(CHAO_ABILITY_COST);

  // 钞能力动画效果
  const resultEl = document.getElementById('cardResult');
  resultEl.className = 'card-result-text win';

  // 撒钱特效文字
  let dotCount = 0;
  const moneyRain = setInterval(() => {
    dotCount++;
    resultEl.textContent = `💰 钞能力发动中${'💰'.repeat(Math.min(dotCount, 5))}`;
    if (dotCount >= 5) {
      clearInterval(moneyRain);
      // 70%成功率
      if (Math.random() < 0.7) {
        state.hasFengshui = true;
        resultEl.textContent = `💰 钞能力成功！${state.currentNpc.name}被你的财力震慑住了！`;
        showToast(`花费${CHAO_ABILITY_COST}金币，钞能力成功！`, 'success');
        playWinSound();
        updateCardActions('chaobility-success');
      } else {
        state.hasFengshui = false;
        resultEl.textContent = `💸 钞能力失败！${state.currentNpc.name}不为所动...`;
        showToast(`花费${CHAO_ABILITY_COST}金币，钞能力失败了！`, 'error');
        playLoseSound();
        updateCardActions('chaobility-fail');
      }
    }
  }, 300);
}

// ========== 物品选择画面 ==========
function initItemsScreen() {
  const grid = document.getElementById('itemsGrid');
  grid.innerHTML = '';
  state.selectedItems = [];

  const badge = document.getElementById('fengshuiBadge');
  if (state.hasFengshui) {
    badge.innerHTML = '<span class="fengshui-badge">🔥 风水加成已激活 - 祖先收到的诚意翻倍！</span>';
  } else {
    badge.innerHTML = '';
  }

  burnItems.forEach(item => {
    const card = document.createElement('div');
    card.className = `item-card rarity-${item.rarity}`;
    card.dataset.id = item.id;

    const rarityNames = { common: '普通', rare: '稀有', epic: '史诗', legendary: '传说' };
    card.innerHTML = `
      <span class="item-rarity-tag ${item.rarity}">${rarityNames[item.rarity]}</span>
      <span class="item-emoji">${item.emoji}</span>
      <div class="item-name">${item.name}</div>
      <div class="item-price">🪙 ${item.price}</div>
    `;
    card.addEventListener('click', () => toggleItem(item, card));
    grid.appendChild(card);
  });

  updateSelectedCount();
}

function toggleItem(item, cardEl) {
  playClickSound();
  const idx = state.selectedItems.findIndex(i => i.id === item.id);

  if (idx >= 0) {
    state.selectedItems.splice(idx, 1);
    cardEl.classList.remove('selected');
  } else {
    // 检查金币是否足够
    const totalCost = state.selectedItems.reduce((sum, i) => sum + i.price, 0) + item.price;
    if (totalCost > state.coins) {
      showToast('金币不足！', 'error');
      return;
    }
    state.selectedItems.push(item);
    cardEl.classList.add('selected');
  }

  updateSelectedCount();
}

function updateSelectedCount() {
  const countEl = document.getElementById('selectedCount');
  const costEl = document.getElementById('totalCost');
  const burnBtn = document.getElementById('burnBtn');

  const totalCost = state.selectedItems.reduce((sum, i) => sum + i.price, 0);

  countEl.textContent = `已选择 ${state.selectedItems.length} 件物品`;
  costEl.textContent = `花费: 🪙 ${totalCost}`;

  if (state.selectedItems.length > 0) {
    burnBtn.disabled = false;
    burnBtn.style.opacity = '1';
  } else {
    burnBtn.disabled = true;
    burnBtn.style.opacity = '0.5';
  }

  // 更新卡片状态（金币不足时变灰）
  const cards = document.querySelectorAll('.item-card');
  cards.forEach(card => {
    const itemId = card.dataset.id;
    const item = burnItems.find(i => i.id === itemId);
    const currentCost = state.selectedItems.reduce((sum, i) => sum + i.price, 0);
    const isSelected = state.selectedItems.some(i => i.id === itemId);

    if (!isSelected && currentCost + item.price > state.coins) {
      card.classList.add('disabled');
    } else {
      card.classList.remove('disabled');
    }
  });
}

// ========== 开始焚烧 ==========
function startBurning() {
  if (state.selectedItems.length === 0) {
    showToast('请先选择要焚烧的物品！', 'error');
    return;
  }

  const totalCost = state.selectedItems.reduce((sum, i) => sum + i.price, 0);
  if (!spendCoins(totalCost)) {
    showToast('金币不足！', 'error');
    return;
  }

  playClickSound();
  showToast(`花费 ${totalCost} 金币开始焚烧！`, 'success');
  goToScreen('screen-burn');
}

// ========== 焚烧画面 - Canvas火焰粒子系统 ==========
let fireCanvas, fireCtx;
let fireParticles = [];
let smokeParticles = [];
let fireAnimId = null;
let burnInterval = null;

function initBurnScreen() {
  fireCanvas = document.getElementById('fireCanvas');
  fireCtx = fireCanvas.getContext('2d');
  resizeCanvas();

  const display = document.getElementById('burnItemsDisplay');
  display.innerHTML = '';
  state.selectedItems.forEach(item => {
    const span = document.createElement('span');
    span.className = 'burn-item-emoji';
    span.textContent = item.emoji;
    span.dataset.id = item.id;
    span.style.animationDelay = (Math.random() * 2) + 's';
    display.appendChild(span);
  });

  fireParticles = [];
  smokeParticles = [];
  startFireAnimation();

  const items = display.querySelectorAll('.burn-item-emoji');
  let burnIndex = 0;
  playFireSound();

  burnInterval = setInterval(() => {
    if (burnIndex < items.length) {
      items[burnIndex].classList.add('burning');
      playFireSound();
      for (let i = 0; i < 20; i++) {
        addFireParticle(true);
      }
      burnIndex++;
    } else {
      clearInterval(burnInterval);
      setTimeout(() => {
        showBlessing();
      }, 2000);
    }
  }, 1500);
}

function resizeCanvas() {
  if (!fireCanvas) return;
  fireCanvas.width = fireCanvas.offsetWidth * window.devicePixelRatio;
  fireCanvas.height = fireCanvas.offsetHeight * window.devicePixelRatio;
  fireCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
}

function addFireParticle(strong = false) {
  const w = fireCanvas.offsetWidth;
  const h = fireCanvas.offsetHeight;
  const count = strong ? 3 : 1;
  for (let i = 0; i < count; i++) {
    fireParticles.push({
      x: w / 2 + (Math.random() - 0.5) * 80,
      y: h * 0.75 + Math.random() * 20,
      vx: (Math.random() - 0.5) * 2,
      vy: -(2 + Math.random() * 4),
      life: 1.0,
      decay: 0.01 + Math.random() * 0.02,
      size: 4 + Math.random() * 8,
      flicker: Math.random() * Math.PI * 2
    });
  }
}

function addSmokeParticle() {
  const w = fireCanvas.offsetWidth;
  const h = fireCanvas.offsetHeight;
  smokeParticles.push({
    x: w / 2 + (Math.random() - 0.5) * 40,
    y: h * 0.6,
    vx: (Math.random() - 0.5) * 0.8,
    vy: -(0.5 + Math.random() * 1.5),
    life: 1.0,
    decay: 0.005 + Math.random() * 0.008,
    size: 6 + Math.random() * 10,
    growRate: 0.1 + Math.random() * 0.15
  });
}

function startFireAnimation() {
  if (fireAnimId) cancelAnimationFrame(fireAnimId);

  function animate() {
    const w = fireCanvas.offsetWidth;
    const h = fireCanvas.offsetHeight;

    fireCtx.globalCompositeOperation = 'source-over';
    fireCtx.fillStyle = 'rgba(10, 10, 26, 0.15)';
    fireCtx.fillRect(0, 0, w, h);

    addFireParticle();

    if (Math.random() < 0.3) addSmokeParticle();

    fireCtx.globalCompositeOperation = 'lighter';
    for (let i = fireParticles.length - 1; i >= 0; i--) {
      const p = fireParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      p.flicker += 0.2;
      p.size *= 0.99;

      if (p.life <= 0) {
        fireParticles.splice(i, 1);
        continue;
      }

      let r, g, b, a;
      if (p.life > 0.7) {
        r = 255; g = 220 + Math.sin(p.flicker) * 35; b = 50;
      } else if (p.life > 0.4) {
        const t = (p.life - 0.4) / 0.3;
        r = 255; g = 100 + t * 120; b = 20;
      } else if (p.life > 0.15) {
        const t = (p.life - 0.15) / 0.25;
        r = 200 + t * 55; g = 30 + t * 70; b = 10;
      } else {
        const t = p.life / 0.15;
        r = 100 + t * 100; g = 80 + t * 50; b = 60 + t * 20;
      }
      a = p.life * 0.8;

      fireCtx.beginPath();
      const radius = Math.max(0.5, p.size * p.life);
      fireCtx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      fireCtx.fillStyle = `rgba(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)},${a})`;
      fireCtx.fill();
    }

    fireCtx.globalCompositeOperation = 'source-over';
    for (let i = smokeParticles.length - 1; i >= 0; i--) {
      const p = smokeParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      p.size += p.growRate;

      if (p.life <= 0) {
        smokeParticles.splice(i, 1);
        continue;
      }

      fireCtx.beginPath();
      const radius = Math.max(0.5, p.size);
      fireCtx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      fireCtx.fillStyle = `rgba(120,110,100,${p.life * 0.15})`;
      fireCtx.fill();
    }

    const glowGrad = fireCtx.createRadialGradient(
      w / 2, h * 0.78, 10,
      w / 2, h * 0.78, 120
    );
    glowGrad.addColorStop(0, 'rgba(255,150,50,0.15)');
    glowGrad.addColorStop(0.5, 'rgba(255,100,30,0.05)');
    glowGrad.addColorStop(1, 'rgba(255,50,10,0)');
    fireCtx.globalCompositeOperation = 'lighter';
    fireCtx.fillStyle = glowGrad;
    fireCtx.fillRect(0, h * 0.5, w, h * 0.5);

    const flickerIntensity = 0.05 + Math.sin(Date.now() * 0.01) * 0.03;
    const flickerGrad = fireCtx.createRadialGradient(
      w / 2 + Math.sin(Date.now() * 0.005) * 20,
      h * 0.75,
      5,
      w / 2, h * 0.75, 200
    );
    flickerGrad.addColorStop(0, `rgba(255,200,100,${flickerIntensity})`);
    flickerGrad.addColorStop(1, 'rgba(255,100,50,0)');
    fireCtx.fillStyle = flickerGrad;
    fireCtx.fillRect(0, 0, w, h);

    fireAnimId = requestAnimationFrame(animate);
  }

  animate();
}

function stopFireAnimation() {
  if (fireAnimId) {
    cancelAnimationFrame(fireAnimId);
    fireAnimId = null;
  }
  if (burnInterval) {
    clearInterval(burnInterval);
    burnInterval = null;
  }
}

// ========== 祖先反馈系统（感恩/讥讽 + 组合检测）==========
function showBlessing() {
  stopFireAnimation();

  const selectedIds = state.selectedItems.map(i => i.id);
  const totalValue = state.selectedItems.reduce((sum, item) => sum + item.price, 0);

  let blessing = null;

  // 1. 检查组合台词（优先级最高）
  for (const combo of comboBlessings) {
    if (combo.ids.every(id => selectedIds.includes(id))) {
      blessing = combo;
      break;
    }
  }

  // 2. 如果没有组合台词，随机选一个物品的回复
  if (!blessing) {
    const randomItem = state.selectedItems[Math.floor(Math.random() * state.selectedItems.length)];
    const isRoast = Math.random() < 0.5;

    if (isRoast && randomItem.roasts && randomItem.roasts.length > 0) {
      blessing = randomItem.roasts[Math.floor(Math.random() * randomItem.roasts.length)];
    } else if (randomItem.thanks && randomItem.thanks.length > 0) {
      blessing = randomItem.thanks[Math.floor(Math.random() * randomItem.thanks.length)];
    }
  }

  if (!blessing) {
    blessing = { text: '祖先收到你的心意，保佑你今年发大财！', from: '—— 你的太爷爷' };
  }

  // 根据总价值调整emoji
  if (totalValue >= 10000) {
    document.getElementById('blessingEmoji').textContent = '🎊';
  } else if (totalValue >= 5000) {
    document.getElementById('blessingEmoji').textContent = '🎉';
  } else {
    document.getElementById('blessingEmoji').textContent = '🙏';
  }

  // 风水加成效果
  if (state.hasFengshui) {
    blessing.text += '\n（🔥风水加成：诚意翻倍！）';
  }

  document.getElementById('blessingText').textContent = blessing.text;
  document.getElementById('blessingFrom').textContent = blessing.from;
  document.getElementById('blessingOverlay').classList.add('show');
  playWinSound();
}

// ========== 重新开始 ==========
function restartGame() {
  playClickSound();
  document.getElementById('blessingOverlay').classList.remove('show');
  stopFireAnimation();

  state.selectedLocation = null;
  state.hasFengshui = false;
  state.currentNpc = null;
  state.selectedItems = [];
  state.burning = false;

  state.cardGame = {
    playerScore: 0, npcScore: 0, round: 1,
    playerCard: null, npcCard: null,
    playerFlipped: false, npcFlipped: false,
    isAnimating: false, finished: false
  };

  if (fireCtx && fireCanvas) {
    fireCtx.clearRect(0, 0, fireCanvas.offsetWidth, fireCanvas.offsetHeight);
  }

  goToScreen('screen-start');
}

// ========== 窗口大小变化处理 ==========
window.addEventListener('resize', () => {
  if (state.currentScreen === 'screen-burn') {
    resizeCanvas();
  }
});

document.addEventListener('DOMContentLoaded', () => {
  createFallingParticles();
  updateProgress(0);

  document.addEventListener('touchstart', function initAudio() {
    getAudioCtx();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    document.removeEventListener('touchstart', initAudio);
  }, { once: true });

  document.addEventListener('click', function initAudio() {
    getAudioCtx();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    document.removeEventListener('click', initAudio);
  }, { once: true });
});
