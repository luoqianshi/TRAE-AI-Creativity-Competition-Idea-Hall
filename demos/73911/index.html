<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D模拟器大全</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 2em;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .header p {
            color: #a0a0a0;
            font-size: 0.9em;
        }

        .simulator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 100px 20px 20px;
            max-width: 1400px;
            margin: 0 auto;
            height: 100vh;
            overflow-y: auto;
        }

        .simulator-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .simulator-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 1.3em;
            margin-bottom: 8px;
            color: #fff;
        }

        .card-desc {
            color: #a0a0a0;
            font-size: 0.85em;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75em;
            color: #ddd;
        }

        /* 3D游戏容器 */
        .game-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
        }

        .game-container.active {
            display: block;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
        }

        /* 游戏UI */
        .game-ui {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            z-index: 300;
            display: none;
        }

        .game-ui.active {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-stats {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stat {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .stat-label {
            font-size: 0.75em;
            color: #a0a0a0;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 1.1em;
            font-weight: bold;
        }

        .game-controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .back-btn {
            background: rgba(255, 107, 107, 0.3);
            border-color: rgba(255, 107, 107, 0.5);
        }

        .back-btn:hover {
            background: rgba(255, 107, 107, 0.5);
        }

        /* 游戏选择面板 */
        .game-selector {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 400;
            max-width: 600px;
            width: 90%;
        }

        .game-selector.active {
            display: block;
        }

        .selector-title {
            font-size: 1.8em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .selector-title span {
            font-size: 1.3em;
        }

        .selector-desc {
            color: #a0a0a0;
            margin-bottom: 20px;
        }

        .selector-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .selector-option {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .selector-option:hover {
            border-color: #48dbfb;
            background: rgba(72, 219, 251, 0.1);
            transform: scale(1.05);
        }

        .selector-option .emoji {
            font-size: 2.5em;
            margin-bottom: 8px;
        }

        .selector-option .name {
            font-size: 1.1em;
            margin-bottom: 3px;
        }

        .selector-option .desc {
            color: #a0a0a0;
            font-size: 0.8em;
        }

        .close-selector {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5em;
            cursor: pointer;
            color: #fff;
            transition: color 0.3s;
        }

        .close-selector:hover {
            color: #ff6b6b;
        }

        /* 操作提示 */
        .controls-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9em;
            color: #a0a0a0;
            z-index: 300;
            display: none;
        }

        .controls-hint.active {
            display: block;
        }

        .controls-hint span {
            color: #48dbfb;
            font-weight: bold;
        }

        /* 加载遮罩 */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 500;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #48dbfb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #fff;
            font-size: 1.1em;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }

            .simulator-grid {
                grid-template-columns: 1fr;
                padding: 80px 15px 15px;
            }

            .game-stats {
                gap: 8px;
            }

            .stat {
                padding: 5px 10px;
            }

            .stat-value {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 3D模拟器大全</h1>
        <p>鼠标点击地面移动，体验3D世界</p>
    </div>

    <div class="simulator-grid" id="main-menu">
        <!-- 丧尸模拟器 -->
        <div class="simulator-card" onclick="showGameSelector('zombie')">
            <div class="card-icon">🧟</div>
            <div class="card-title">丧尸模拟器</div>
            <div class="card-desc">在3D末日世界中化身为丧尸，追捕人类，体验恐怖的末日氛围。</div>
            <div class="card-tags">
                <span class="tag">恐怖</span>
                <span class="tag">生存</span>
                <span class="tag">末日</span>
            </div>
        </div>

        <!-- 生存模拟器 -->
        <div class="simulator-card" onclick="showGameSelector('survival')">
            <div class="card-icon">🔥</div>
            <div class="card-title">生存模拟器</div>
            <div class="card-desc">在3D荒野中求生，收集资源、建造庇护所，挑战极限生存技能。</div>
            <div class="card-tags">
                <span class="tag">冒险</span>
                <span class="tag">建造</span>
                <span class="tag">挑战</span>
            </div>
        </div>

        <!-- 野外建造模拟器 -->
        <div class="simulator-card" onclick="showGameSelector('building')">
            <div class="card-icon">🏕️</div>
            <div class="card-title">野外建造模拟器</div>
            <div class="card-desc">在3D野外环境中建造你的王国，从简陋帐篷到坚固堡垒。</div>
            <div class="card-tags">
                <span class="tag">建造</span>
                <span class="tag">策略</span>
                <span class="tag">创造</span>
            </div>
        </div>

        <!-- 动物模拟器 -->
        <div class="simulator-card" onclick="showGameSelector('animal')">
            <div class="card-icon">🦁</div>
            <div class="card-title">动物模拟器</div>
            <div class="card-desc">化身各种动物，在3D自然环境中体验动物的日常生活。</div>
            <div class="card-tags">
                <span class="tag">自然</span>
                <span class="tag">探索</span>
                <span class="tag">野生</span>
            </div>
        </div>
    </div>

    <!-- 3D游戏容器 -->
    <div class="game-container" id="game-container">
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- 游戏UI -->
    <div class="game-ui" id="game-ui">
        <div class="game-stats" id="game-stats">
            <!-- 动态生成 -->
        </div>
        <div class="game-controls">
            <button class="control-btn" onclick="resetCurrentGame()">重新开始</button>
            <button class="control-btn back-btn" onclick="backToMenu()">返回菜单</button>
        </div>
    </div>

    <!-- 游戏选择面板 -->
    <div class="game-selector" id="game-selector">
        <span class="close-selector" onclick="closeGameSelector()">&times;</span>
        <div class="selector-title" id="selector-title"></div>
        <p class="selector-desc" id="selector-desc"></p>
        <div class="selector-options" id="selector-options"></div>
    </div>

    <!-- 操作提示 -->
    <div class="controls-hint" id="controls-hint">
        <span>鼠标左键</span> 点击地面移动 | <span>鼠标右键</span> 旋转视角 | <span>滚轮</span> 缩放
    </div>

    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在加载3D世界...</div>
    </div>

    <script>
        // 游戏状态
        const gameState = {
            currentType: null,
            currentVariant: null,
            isPlaying: false,
            stats: {},
            scene: null,
            camera: null,
            renderer: null,
            player: null,
            targetPosition: null,
            objects: [],
            clock: new THREE.Clock(),
            gameLoop: null
        };

        // 模拟器配置
        const simulatorConfig = {
            zombie: {
                title: '丧尸模拟器',
                desc: '选择你想要体验的丧尸类型',
                options: [
                    { id: 'classic', emoji: '🧟', name: '经典丧尸', desc: '普通丧尸，寻找人类攻击' },
                    { id: 'runner', emoji: '💨', name: '疾跑丧尸', desc: '速度快，攻击力强' },
                    { id: 'tank', emoji: '💪', name: '巨型丧尸', desc: '体型巨大，生命力强' }
                ],
                stats: ['体力', '感染', '分数']
            },
            survival: {
                title: '生存模拟器',
                desc: '选择你的生存环境',
                options: [
                    { id: 'forest', emoji: '🌲', name: '森林生存', desc: '在密林中求生' },
                    { id: 'desert', emoji: '🏜️', name: '沙漠生存', desc: '在干旱沙漠求生' },
                    { id: 'arctic', emoji: '❄️', name: '极地生存', desc: '在冰天雪地求生' }
                ],
                stats: ['生命', '饥饿', '口渴', '天数']
            },
            building: {
                title: '野外建造模拟器',
                desc: '选择建造风格',
                options: [
                    { id: 'cabin', emoji: '🏠', name: '森林小屋', desc: '建造温馨的木屋' },
                    { id: 'fort', emoji: '🏰', name: '荒野堡垒', desc: '建造坚固的堡垒' },
                    { id: 'treehouse', emoji: '🌳', name: '树屋王国', desc: '在树上建造家园' }
                ],
                stats: ['木材', '石头', '建筑等级']
            },
            animal: {
                title: '动物模拟器',
                desc: '选择你想要扮演的动物',
                options: [
                    { id: 'lion', emoji: '🦁', name: '狮子', desc: '草原之王' },
                    { id: 'elephant', emoji: '🐘', name: '大象', desc: '丛林巨兽' },
                    { id: 'giraffe', emoji: '🦒', name: '长颈鹿', desc: '高眺之者' },
                    { id: 'wolf', emoji: '🐺', name: '狼', desc: '团队狩猎者' },
                    { id: 'eagle', emoji: '🦅', name: '老鹰', desc: '天空霸主' },
                    { id: 'shark', emoji: '🦈', name: '鲨鱼', desc: '海洋杀手' },
                    { id: 'panda', emoji: '🐼', name: '熊猫', desc: '竹林隐士' },
                    { id: 'tiger', emoji: '🐯', name: '老虎', desc: '丛林猛虎' }
                ],
                stats: ['体力', '饥饿', '经验']
            }
        };

        // 动物模型配置
        const animalModels = {
            lion: { color: 0xd4a017, size: 1.2 },
            elephant: { color: 0x808080, size: 2.0 },
            giraffe: { color: 0xd4a017, size: 2.5 },
            wolf: { color: 0x8b4513, size: 0.8 },
            eagle: { color: 0x4a4a4a, size: 1.0 },
            shark: { color: 0x1a5276, size: 1.5 },
            panda: { color: 0x000000, size: 1.0 },
            tiger: { color: 0xd4a017, size: 1.3 }
        };

        // 显示游戏选择面板
        function showGameSelector(type) {
            const config = simulatorConfig[type];
            document.getElementById('selector-title').innerHTML = `<span>${config.options[0].emoji}</span> ${config.title}`;
            document.getElementById('selector-desc').textContent = config.desc;
            
            const optionsContainer = document.getElementById('selector-options');
            optionsContainer.innerHTML = '';
            
            config.options.forEach(option => {
                const optionEl = document.createElement('div');
                optionEl.className = 'selector-option';
                optionEl.innerHTML = `
                    <div class="emoji">${option.emoji}</div>
                    <div class="name">${option.name}</div>
                    <div class="desc">${option.desc}</div>
                `;
                optionEl.onclick = () => startGame(type, option.id);
                optionsContainer.appendChild(optionEl);
            });
            
            document.getElementById('game-selector').classList.add('active');
        }

        // 关闭游戏选择面板
        function closeGameSelector() {
            document.getElementById('game-selector').classList.remove('active');
        }

        // 开始游戏
        function startGame(type, variant) {
            closeGameSelector();
            gameState.currentType = type;
            gameState.currentVariant = variant;
            
            // 显示加载遮罩
            document.getElementById('loading-overlay').classList.add('active');
            
            // 初始化游戏状态
            initGameState(type, variant);
            
            // 初始化3D场景
            setTimeout(() => {
                init3DScene(type, variant);
                document.getElementById('loading-overlay').classList.remove('active');
                gameState.isPlaying = true;
                startGameLoop();
            }, 1000);
        }

        // 初始化游戏状态
        function initGameState(type, variant) {
            switch(type) {
                case 'zombie':
                    gameState.stats = {
                        energy: 100,
                        infection: 0,
                        score: 0
                    };
                    break;
                case 'survival':
                    gameState.stats = {
                        health: 100,
                        hunger: 100,
                        thirst: 100,
                        days: 1
                    };
                    break;
                case 'building':
                    gameState.stats = {
                        wood: 0,
                        stone: 0,
                        level: 1
                    };
                    break;
                case 'animal':
                    gameState.stats = {
                        energy: 100,
                        hunger: 100,
                        exp: 0
                    };
                    break;
            }
        }

        // 初始化3D场景
        function init3DScene(type, variant) {
            const canvas = document.getElementById('game-canvas');
            const container = document.getElementById('game-container');
            
            // 创建场景
            gameState.scene = new THREE.Scene();
            
            // 根据游戏类型设置背景
            switch(type) {
                case 'zombie':
                    gameState.scene.background = new THREE.Color(0x1a1a1a);
                    gameState.scene.fog = new THREE.Fog(0x1a1a1a, 10, 50);
                    break;
                case 'survival':
                    if (variant === 'forest') {
                        gameState.scene.background = new THREE.Color(0x228b22);
                        gameState.scene.fog = new THREE.Fog(0x228b22, 20, 60);
                    } else if (variant === 'desert') {
                        gameState.scene.background = new THREE.Color(0xf4a460);
                        gameState.scene.fog = new THREE.Fog(0xf4a460, 30, 80);
                    } else {
                        gameState.scene.background = new THREE.Color(0xe0ffff);
                        gameState.scene.fog = new THREE.Fog(0xe0ffff, 15, 50);
                    }
                    break;
                case 'building':
                    gameState.scene.background = new THREE.Color(0x87ceeb);
                    gameState.scene.fog = new THREE.Fog(0x87ceeb, 30, 100);
                    break;
                case 'animal':
                    gameState.scene.background = new THREE.Color(0x90ee90);
                    gameState.scene.fog = new THREE.Fog(0x90ee90, 25, 70);
                    break;
            }
            
            // 创建相机
            gameState.camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            gameState.camera.position.set(0, 15, 20);
            gameState.camera.lookAt(0, 0, 0);
            
            // 创建渲染器
            gameState.renderer = new THREE.WebGLRenderer({ 
                canvas: canvas,
                antialias: true 
            });
            gameState.renderer.setSize(window.innerWidth, window.innerHeight);
            gameState.renderer.shadowMap.enabled = true;
            gameState.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            // 添加光源
            addLighting(type, variant);
            
            // 创建地面
            createGround(type, variant);
            
            // 创建玩家
            createPlayer(type, variant);
            
            // 创建游戏对象
            createGameObjects(type, variant);
            
            // 添加鼠标控制
            setupMouseControls();
            
            // 显示游戏UI
            showGameUI(type);
            
            // 显示操作提示
            document.getElementById('controls-hint').classList.add('active');
        }

        // 添加光源
        function addLighting(type, variant) {
            // 环境光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            gameState.scene.add(ambientLight);
            
            // 定向光
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 100;
            directionalLight.shadow.camera.left = -50;
            directionalLight.shadow.camera.right = 50;
            directionalLight.shadow.camera.top = 50;
            directionalLight.shadow.camera.bottom = -50;
            gameState.scene.add(directionalLight);
            
            // 根据游戏类型添加特殊光照
            if (type === 'zombie') {
                // 添加恐怖红光
                const redLight = new THREE.PointLight(0xff0000, 0.5, 30);
                redLight.position.set(-10, 5, -10);
                gameState.scene.add(redLight);
            } else if (type === 'survival' && variant === 'arctic') {
                // 添加冷光
                const coldLight = new THREE.PointLight(0xadd8e6, 0.3, 40);
                coldLight.position.set(0, 10, 0);
                gameState.scene.add(coldLight);
            }
        }

        // 创建地面
        function createGround(type, variant) {
            let groundColor, groundSize;
            
            switch(type) {
                case 'zombie':
                    groundColor = 0x2d2d2d;
                    groundSize = 100;
                    break;
                case 'survival':
                    if (variant === 'forest') {
                        groundColor = 0x228b22;
                    } else if (variant === 'desert') {
                        groundColor = 0xf4a460;
                    } else {
                        groundColor = 0xffffff;
                    }
                    groundSize = 150;
                    break;
                case 'building':
                    groundColor = 0x8b4513;
                    groundSize = 200;
                    break;
                case 'animal':
                    groundColor = 0x90ee90;
                    groundSize = 180;
                    break;
            }
            
            const groundGeometry = new THREE.PlaneGeometry(groundSize, groundSize);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: groundColor,
                roughness: 0.8
            });

        // 设置鼠标控制
        function setupMouseControls() {
            const canvas = document.getElementById('game-canvas');
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let cameraAngle = 0;
            let cameraHeight = 15;
            let cameraDistance = 20;
            
            // 鼠标点击移动
            canvas.addEventListener('click', (event) => {
                if (!gameState.isPlaying) return;
                
                const rect = canvas.getBoundingClientRect();
                const mouse = new THREE.Vector2(
                    ((event.clientX - rect.left) / rect.width) * 2 - 1,
                    -((event.clientY - rect.top) / rect.height) * 2 + 1
                );
                
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(mouse, gameState.camera);
                
                const ground = gameState.scene.children.find(child => 
                    child.geometry && child.geometry.type === 'PlaneGeometry'
                );
                
                if (ground) {
                    const intersects = raycaster.intersectObject(ground);
                    if (intersects.length > 0) {
                        gameState.targetPosition = intersects[0].point;
                    }
                }
            });
            
            // 鼠标拖拽旋转视角
            canvas.addEventListener('mousedown', (event) => {
                if (event.button === 2) { // 右键
                    isDragging = true;
                    previousMousePosition = { x: event.clientX, y: event.clientY };
                }
            });
            
            canvas.addEventListener('mousemove', (event) => {
                if (!isDragging) return;
                
                const deltaX = event.clientX - previousMousePosition.x;
                const deltaY = event.clientY - previousMousePosition.y;
                
                cameraAngle += deltaX * 0.01;
                cameraHeight = Math.max(5, Math.min(30, cameraHeight - deltaY * 0.1));
                
                previousMousePosition = { x: event.clientX, y: event.clientY };
                
                updateCameraPosition();
            });
            
            canvas.addEventListener('mouseup', () => {
                isDragging = false;
            });
            
            canvas.addEventListener('mouseleave', () => {
                isDragging = false;
            });
            
            // 滚轮缩放
            canvas.addEventListener('wheel', (event) => {
                event.preventDefault();
                cameraDistance = Math.max(10, Math.min(40, cameraDistance + event.deltaY * 0.05));
                updateCameraPosition();
            });
            
            // 禁用右键菜单
            canvas.addEventListener('contextmenu', (event) => {
                event.preventDefault();
            });
            
            // 更新相机位置
            function updateCameraPosition() {
                if (gameState.player) {
                    const playerPos = gameState.player.position;
                    gameState.camera.position.x = playerPos.x + Math.sin(cameraAngle) * cameraDistance;
                    gameState.camera.position.z = playerPos.z + Math.cos(cameraAngle) * cameraDistance;
                    gameState.camera.position.y = cameraHeight;
                    gameState.camera.lookAt(playerPos);
                }
            }
            
            // 保存更新函数供游戏循环使用
            gameState.updateCamera = updateCameraPosition;
        }

        // 显示游戏UI
        function showGameUI(type) {
            const config = simulatorConfig[type];
            const statsContainer = document.getElementById('game-stats');
            statsContainer.innerHTML = '';
            
            config.stats.forEach(stat => {
                const statEl = document.createElement('div');
                statEl.className = 'stat';
                statEl.innerHTML = `
                    <div class="stat-label">${stat}</div>
                    <div class="stat-value" id="stat-${stat}">${gameState.stats[getStatKey(stat)] || 0}</div>
                `;
                statsContainer.appendChild(statEl);
            });
            
            document.getElementById('game-ui').classList.add('active');
            document.getElementById('game-container').classList.add('active');
            document.getElementById('main-menu').style.display = 'none';
        }

        // 获取状态键名
        function getStatKey(statName) {
            const keyMap = {
                '体力': 'energy',
                '感染': 'infection',
                '分数': 'score',
                '生命': 'health',
                '饥饿': 'hunger',
                '口渴': 'thirst',
                '天数': 'days',
                '木材': 'wood',
                '石头': 'stone',
                '建筑等级': 'level',
                '经验': 'exp'
            };
            return keyMap[statName] || statName;
        }

        // 开始游戏循环
        function startGameLoop() {
            function animate() {
                if (!gameState.isPlaying) return;
                
                requestAnimationFrame(animate);
                
                const delta = gameState.clock.getDelta();
                
                // 更新玩家移动
                updatePlayerMovement(delta);
                
                // 更新游戏逻辑
                updateGameLogic(delta);
                
                // 更新相机
                if (gameState.updateCamera) {
                    gameState.updateCamera();
                }
                
                // 更新UI
                updateGameUI();
                
                // 渲染场景
                gameState.renderer.render(gameState.scene, gameState.camera);
            }
            
            animate();
        }

        // 更新玩家移动
        function updatePlayerMovement(delta) {
            if (!gameState.player || !gameState.targetPosition) return;
            
            const playerPos = gameState.player.position;
            const targetPos = gameState.targetPosition;
            
            // 计算移动方向
            const direction = new THREE.Vector3()
                .subVectors(targetPos, playerPos)
                .normalize();
            
            // 移动速度
            const speed = 5 * delta;
            
            // 更新位置
            playerPos.x += direction.x * speed;
            playerPos.z += direction.z * speed;
            
            // 旋转玩家朝向目标
            gameState.player.lookAt(targetPos.x, playerPos.y, targetPos.z);
            
            // 检查是否到达目标
            const distance = playerPos.distanceTo(targetPos);
            if (distance < 0.5) {
                gameState.targetPosition = null;
            }
        }

        // 更新游戏逻辑
        function updateGameLogic(delta) {
            const type = gameState.currentType;
            
            switch(type) {
                case 'zombie':
                    updateZombieLogic(delta);
                    break;
                case 'survival':
                    updateSurvivalLogic(delta);
                    break;
                case 'building':
                    updateBuildingLogic(delta);
                    break;
                case 'animal':
                    updateAnimalLogic(delta);
                    break;
            }
        }

        // 更新丧尸逻辑
        function updateZombieLogic(delta) {
            // 检测碰撞
            gameState.objects.forEach(obj => {
                if (obj.userData.type === 'human') {
                    const distance = gameState.player.position.distanceTo(obj.position);
                    if (distance < 1.5) {
                        // 感染人类
                        gameState.stats.score += 10;
                        gameState.stats.energy -= 5;
                        gameState.stats.infection = Math.min(100, gameState.stats.infection + 5);
                        
                        // 重置人类位置
                        obj.position.set(
                            (Math.random() - 0.5) * 40,
                            0,
                            (Math.random() - 0.5) * 40
                        );
                    }
                }
            });
            
            // 体力衰减
            gameState.stats.energy = Math.max(0, gameState.stats.energy - delta * 2);
        }

        // 更新生存逻辑
        function updateSurvivalLogic(delta) {
            // 检测碰撞
            gameState.objects.forEach(obj => {
                const distance = gameState.player.position.distanceTo(obj.position);
                if (distance < 1.5) {
                    if (obj.userData.type === 'food') {
                        gameState.stats.hunger = Math.min(100, gameState.stats.hunger + 20);
                        obj.position.set(
                            (Math.random() - 0.5) * 30,
                            0.5,
                            (Math.random() - 0.5) * 30
                        );
                    } else if (obj.userData.type === 'water') {
                        gameState.stats.thirst = Math.min(100, gameState.stats.thirst + 20);
                        obj.position.set(
                            (Math.random() - 0.5) * 35,
                            0.3,
                            (Math.random() - 0.5) * 35
                        );
                    }
                }
            });
            
            // 状态衰减
            gameState.stats.hunger = Math.max(0, gameState.stats.hunger - delta * 3);
            gameState.stats.thirst = Math.max(0, gameState.stats.thirst - delta * 4);
            
            // 生命值衰减
            if (gameState.stats.hunger < 20 || gameState.stats.thirst < 20) {
                gameState.stats.health = Math.max(0, gameState.stats.health - delta * 5);
            }
            
            // 天数增加
            if (Math.random() < 0.0001) {
                gameState.stats.days++;
            }
        }

        // 更新建造逻辑
        function updateBuildingLogic(delta) {
            // 检测碰撞
            gameState.objects.forEach(obj => {
                const distance = gameState.player.position.distanceTo(obj.position);
                if (distance < 1.5) {
                    if (obj.userData.type === 'wood') {
                        gameState.stats.wood++;
                        obj.position.set(
                            (Math.random() - 0.5) * 40,
                            0.5,
                            (Math.random() - 0.5) * 40
                        );
                    } else if (obj.userData.type === 'stone') {
                        gameState.stats.stone++;
                        obj.position.set(
                            (Math.random() - 0.5) * 45,
                            0.5,
                            (Math.random() - 0.5) * 45
                        );
                    }
                }
            });
            
            // 自动建造
            if (gameState.stats.wood >= 5) {
                gameState.stats.wood -= 5;
                gameState.stats.level += 0.5;
            }
            if (gameState.stats.stone >= 5) {
                gameState.stats.stone -= 5;
                gameState.stats.level += 1;
            }
        }

        // 更新动物逻辑
        function updateAnimalLogic(delta) {
            // 检测碰撞
            gameState.objects.forEach(obj => {
                const distance = gameState.player.position.distanceTo(obj.position);
                if (distance < 1.5) {
                    if (obj.userData.type === 'prey') {
                        gameState.stats.hunger = Math.min(100, gameState.stats.hunger + 30);
                        gameState.stats.exp += 10;
                        obj.position.set(
                            (Math.random() - 0.5) * 35,
                            0,
                            (Math.random() - 0.5) * 35
                        );
                    } else if (obj.userData.type === 'other_animal') {
                        gameState.stats.exp += 5;
                    }
                }
            });
            
            // 状态变化
            gameState.stats.hunger = Math.max(0, gameState.stats.hunger - delta * 2);
            gameState.stats.energy = Math.min(100, gameState.stats.energy + delta * 0.5);
        }

        // 更新游戏UI
        function updateGameUI() {
            const config = simulatorConfig[gameState.currentType];
            config.stats.forEach(stat => {
                const key = getStatKey(stat);
                const value = gameState.stats[key];
                const element = document.getElementById(`stat-${stat}`);
                if (element) {
                    element.textContent = typeof value === 'number' ? Math.round(value) : value;
                }
            });
        }

        // 重置当前游戏
        function resetCurrentGame() {
            if (!gameState.currentType) return;
            
            // 清理场景
            if (gameState.scene) {
                while(gameState.scene.children.length > 0) { 
                    gameState.scene.remove(gameState.scene.children[0]); 
                }
            }
            
            // 重新初始化
            initGameState(gameState.currentType, gameState.currentVariant);
            init3DScene(gameState.currentType, gameState.currentVariant);
            gameState.isPlaying = true;
            startGameLoop();
        }

        // 返回主菜单
        function backToMenu() {
            gameState.isPlaying = false;
            gameState.currentType = null;
            gameState.currentVariant = null;
            
            // 清理场景
            if (gameState.scene) {
                while(gameState.scene.children.length > 0) { 
                    gameState.scene.remove(gameState.scene.children[0]); 
                }
            }
            
            // 隐藏游戏UI
            document.getElementById('game-ui').classList.remove('active');
            document.getElementById('game-container').classList.remove('active');
            document.getElementById('controls-hint').classList.remove('active');
            document.getElementById('main-menu').style.display = 'grid';
        }

        // 窗口大小调整
        window.addEventListener('resize', () => {
            if (gameState.camera && gameState.renderer) {
                gameState.camera.aspect = window.innerWidth / window.innerHeight;
                gameState.camera.updateProjectionMatrix();
                gameState.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
