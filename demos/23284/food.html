<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="寻味中华是一个互动式中华美食推荐体验，随机探索菜系、风味、食材和烹饪步骤。">
    <meta name="theme-color" content="#F5F2E9">
    <title>寻味中华 | iouetn</title>

    <style>
        :root {
            --c-ink-dark: #1a1a1a;
            --c-ink-medium: #2c2c2c;
            --c-ink-light: #4a4a4a;
            --c-gold-primary: #D4AF37;
            --c-gold-light: #F9E79F;
            --c-gold-shadow: #8E7326;
            --c-gold-metallic: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --c-red-primary: #B72626;
            --c-red-dim: #7c1a1a;
            --c-paper-bg: #F5F2E9;
            --c-glass-surface: rgba(255, 255, 255, 0.92);
            --c-glass-border: rgba(255, 255, 255, 0.6);
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.05);
            --shadow-hard: 0 20px 50px rgba(212, 175, 55, 0.15);
            --shadow-inner: inset 0 2px 4px rgba(0, 0, 0, 0.06);
            --font-serif: "Songti SC", "SimSun", "STSong", "Times New Roman", serif;
            --font-sans: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            --font-script: "KaiTi", "STKaiti", "Brush Script MT", serif;
            --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
            --ease-in-out-circ: cubic-bezier(0.785, 0.135, 0.15, 0.86);
            --ease-elastic: cubic-bezier(0.68, -0.55, 0.265, 1.55);
            --container-max-width: 900px;
            --header-offset: 80px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #F5F2E9 0%, #EDE8DC 50%, #F8F5EE 100%);
            color: var(--c-ink-medium);
            font-family: var(--font-sans);
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            position: relative;
        }

        /* 动态背景光效 */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(183, 38, 38, 0.05) 0%, transparent 50%);
            animation: ambient-drift 20s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes ambient-drift {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-5%, -5%) rotate(3deg); }
        }

        .layer-noise {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .layer-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .float-item {
            position: absolute;
            user-select: none;
            pointer-events: none;
            will-change: transform, opacity;
            filter: grayscale(0.2) sepia(0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .burst-particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            background: var(--c-gold-primary);
            box-shadow: 0 0 10px var(--c-gold-light);
            z-index: 2;
        }

        .app-shell {
            width: 92%;
            max-width: var(--container-max-width);
            height: 85vh;
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            align-items: center;
            justify-items: center;
        }

        .view-section {
            grid-area: 1 / 1 / 2 / 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.9) translateY(30px);
            pointer-events: none;
            transition: all 0.8s var(--ease-out-expo);
            will-change: transform, opacity;
        }

        .view-section.is-active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
            z-index: 20;
        }

        .view-section.is-exiting {
            opacity: 0;
            transform: scale(1.05) translateY(-50px);
            filter: blur(8px);
        }

        /* Hero 区域增强 */
        .hero-content {
            text-align: center;
            margin-bottom: 80px;
            position: relative;
        }

        .title-display {
            font-family: var(--font-serif);
            font-size: clamp(3.5rem, 8vw, 6rem);
            font-weight: 900;
            color: var(--c-ink-dark);
            margin: 0;
            line-height: 1.1;
            letter-spacing: 0.2em;
            text-indent: 0.2em;
            text-shadow:
                2px 2px 0px #d4af37,
                4px 4px 0px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 2;
            animation: title-glow 3s ease-in-out infinite alternate;
        }

        @keyframes title-glow {
            0% { text-shadow: 2px 2px 0px #d4af37, 4px 4px 0px rgba(0, 0, 0, 0.1); }
            100% { text-shadow: 2px 2px 0px #d4af37, 4px 4px 20px rgba(212, 175, 55, 0.3), 6px 6px 0px rgba(0, 0, 0, 0.05); }
        }

        .title-seal {
            position: absolute;
            top: -20px;
            right: -30px;
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, var(--c-red-primary) 0%, #8B1A1A 100%);
            color: #fff;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-family: var(--font-serif);
            box-shadow: 3px 3px 15px rgba(0, 0, 0, 0.25);
            transform: rotate(12deg);
            z-index: 3;
            animation: float-seal 6s ease-in-out infinite;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .title-seal::before {
            content: '';
            position: absolute;
            inset: 3px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
        }

        @keyframes float-seal {
            0%, 100% { transform: rotate(12deg) translateY(0); }
            50% { transform: rotate(8deg) translateY(-8px); }
        }

        .subtitle-display {
            font-family: var(--font-script);
            font-size: 1.3rem;
            color: var(--c-gold-shadow);
            margin-top: 60px;
            letter-spacing: 0.4em;
            font-weight: bold;
            text-transform: uppercase;
            opacity: 0;
            animation: fade-in-up 1s ease 0.5s forwards;
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 按钮增强 */
        .btn-container {
            position: relative;
            padding: 8px;
            border-radius: 100px;
        }

        .btn-gold {
            position: relative;
            appearance: none;
            border: none;
            outline: none;
            background: linear-gradient(145deg, #fff8e1 0%, #f4e8c1 30%, #e8d9a8 70%, #f4e8c1 100%);
            padding: 28px 88px;
            font-size: 1.6rem;
            border-radius: 100px;
            color: var(--c-ink-dark);
            font-family: var(--font-serif);
            font-weight: 900;
            letter-spacing: 0.25em;
            cursor: pointer;
            overflow: hidden;
            box-shadow:
                0 20px 40px -10px rgba(212, 175, 55, 0.4),
                0 5px 15px rgba(0, 0, 0, 0.08),
                inset 0 2px 0 rgba(255, 255, 255, 0.8),
                inset 0 -2px 0 rgba(0, 0, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
            border: 2px solid rgba(212, 175, 55, 0.3);
        }

        .btn-gold:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow:
                0 30px 60px -12px rgba(212, 175, 55, 0.6),
                0 10px 25px rgba(0, 0, 0, 0.12),
                inset 0 2px 0 rgba(255, 255, 255, 0.9),
                inset 0 -2px 0 rgba(0, 0, 0, 0.1);
            border-color: var(--c-gold-primary);
        }

        .btn-gold:active {
            transform: scale(0.96) translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(212, 175, 55, 0.4);
        }

        .btn-gold::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle 160px at var(--x, 50%) var(--y, 50%),
                    rgba(255, 235, 150, 0.95) 0%,
                    rgba(212, 175, 55, 0.4) 40%,
                    transparent 70%);
            opacity: 0;
            mix-blend-mode: overlay;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: -1;
        }

        .btn-gold:hover::before { opacity: 1; }

        .btn-shimmer-fx {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(110deg,
                    transparent 30%,
                    rgba(255, 255, 255, 0.8) 50%,
                    transparent 70%);
            transform: skewX(-20deg) translateX(-150%);
            animation: shimmer-swipe 3s infinite cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        @keyframes shimmer-swipe {
            0%, 80% { transform: skewX(-20deg) translateX(-150%); }
            100% { transform: skewX(-20deg) translateX(150%); }
        }

        /* Loading 区域增强 */
        .loading-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
        }

        .fire-container {
            width: 110px;
            height: 110px;
            position: relative;
            margin-bottom: 40px;
        }

        .fire-spinner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid rgba(212, 175, 55, 0.15);
            border-top: 4px solid var(--c-gold-primary);
            border-right: 4px solid var(--c-gold-light);
            animation: spin-gold 1.2s infinite linear;
            box-shadow: 
                0 0 30px rgba(212, 175, 55, 0.3),
                inset 0 0 20px rgba(212, 175, 55, 0.1);
        }

        .fire-emoji {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.2rem;
            animation: pulse-fire 1.5s infinite ease-in-out;
            filter: drop-shadow(0 0 20px var(--c-gold-primary));
        }

        @keyframes spin-gold { 100% { transform: rotate(360deg); } }

        @keyframes pulse-fire {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
        }

        .rotator-box {
            margin-top: 15px;
            height: 80px;
            width: 100%;
            min-width: 320px;
            position: relative;
            overflow: hidden;
            text-align: center;
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
        }

        .rotator-text {
            position: absolute;
            width: 100%;
            left: 0;
            font-family: var(--font-script);
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--c-ink-light);
            will-change: transform, opacity, filter;
            padding: 0 20px;
        }

        .anim-enter { animation: txt-in 0.7s var(--ease-out-expo) forwards; }
        .anim-exit { animation: txt-out 0.7s var(--ease-out-expo) forwards; }

        @keyframes txt-in {
            from { opacity: 0; transform: translateY(40px) scale(0.9); filter: blur(12px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        @keyframes txt-out {
            from { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
            to { opacity: 0; transform: translateY(-40px) scale(0.9); filter: blur(12px); }
        }

        /* 结果卡片增强 */
        .card-panel {
            width: 100%;
            max-width: 820px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 252, 248, 0.9) 100%);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 30px;
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            box-shadow: 
                0 25px 60px rgba(212, 175, 55, 0.15),
                0 10px 30px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            padding: 50px 60px;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
            scrollbar-width: none;
            margin: auto;
            -webkit-overflow-scrolling: touch;
            animation: card-entry 0.8s var(--ease-out-expo);
        }

        @keyframes card-entry {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-panel::-webkit-scrollbar { display: none; }

        .card-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--c-gold-primary), transparent);
            border-radius: 0 0 4px 4px;
        }

        .stamp-seal {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 100px;
            height: 100px;
            border: 4px double var(--c-red-primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-serif);
            font-weight: 900;
            font-size: 2.2rem;
            color: var(--c-red-primary);
            transform: rotate(15deg);
            opacity: 0.25;
            mix-blend-mode: multiply;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle, rgba(183, 38, 38, 0.05) 0%, transparent 70%);
            box-shadow: inset 0 0 20px rgba(183, 38, 38, 0.1);
            animation: stamp-pulse 4s ease-in-out infinite;
        }

        @keyframes stamp-pulse {
            0%, 100% { opacity: 0.25; transform: rotate(15deg) scale(1); }
            50% { opacity: 0.35; transform: rotate(12deg) scale(1.02); }
        }

        .dish-header-group {
            border-bottom: 2px dashed rgba(212, 175, 55, 0.4);
            padding-bottom: 25px;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .dish-tag-line {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            font-size: 1rem;
            color: var(--c-gold-shadow);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .dish-tag-line::before {
            content: '';
            display: block;
            width: 30px;
            height: 3px;
            background: var(--c-gold-primary);
            flex-shrink: 0;
        }

        .dish-title-text {
            font-family: var(--font-serif);
            font-size: clamp(2.5rem, 5vw, 4rem);
            color: var(--c-ink-dark);
            margin: 0;
            line-height: 1.1;
            text-shadow: 1px 1px 0px #fff;
            transition: all 0.3s ease;
        }

        .dish-title-text:hover {
            text-shadow: 2px 2px 0px #d4af37, 4px 4px 10px rgba(0,0,0,0.1);
        }

        .quote-box {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 252, 245, 0.85) 100%);
            padding: 28px 40px;
            border-radius: 20px;
            border-left: 5px solid var(--c-gold-primary);
            font-family: var(--font-script);
            font-size: 1.35rem;
            line-height: 1.9;
            color: #444;
            margin-bottom: 45px;
            font-style: italic;
            box-shadow: 
                0 8px 25px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            position: relative;
            transition: all 0.4s ease;
        }

        .quote-box:hover {
            transform: translateX(5px);
            box-shadow: 
                0 12px 35px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .quote-box::before {
            content: '"';
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 3rem;
            color: var(--c-gold-primary);
            opacity: 0.3;
            font-family: Georgia, serif;
            line-height: 1;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-bottom: 45px;
        }

        .detail-label {
            font-size: 0.9rem;
            color: var(--c-gold-shadow);
            margin-bottom: 12px;
            letter-spacing: 1.5px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .detail-label::before {
            content: '◈';
            margin-right: 10px;
            color: var(--c-gold-primary);
            font-size: 0.8em;
        }

        .detail-content {
            font-size: 1.15rem;
            color: var(--c-ink-medium);
            line-height: 1.7;
            font-weight: 500;
        }

        .star-rating {
            color: var(--c-gold-primary);
            font-size: 1.4rem;
            letter-spacing: 4px;
            margin-top: 8px;
            display: inline-block;
            text-shadow: 0 2px 5px rgba(212, 175, 55, 0.3);
        }

        .method-box {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 252, 245, 0.4) 100%);
            padding: 40px;
            border-radius: 24px;
            counter-reset: chef-step;
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .method-step {
            position: relative;
            padding-left: 55px;
            margin-bottom: 28px;
            font-size: 1.1rem;
            line-height: 1.9;
            color: #444;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .method-step:hover {
            transform: translateX(8px);
            color: #222;
            background: rgba(255,255,255,0.5);
            border-radius: 8px;
            padding: 10px 10px 10px 65px;
            margin-left: -10px;
        }

        .method-step:last-child { margin-bottom: 0; }

        .method-step::before {
            counter-increment: chef-step;
            content: counter(chef-step);
            position: absolute;
            left: 0;
            top: 2px;
            width: 36px;
            height: 36px;
            background: linear-gradient(145deg, #bf953f 0%, #fcf6ba 30%, #b38728 70%, #aa771c 100%);
            color: #fff;
            border-radius: 50%;
            text-align: center;
            line-height: 36px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 
                0 4px 12px rgba(212, 175, 55, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .method-step:hover::before {
            transform: scale(1.1);
            box-shadow: 
                0 6px 18px rgba(212, 175, 55, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .action-area {
            margin-top: 50px;
            text-align: center;
        }

        .btn-restart {
            background: transparent;
            border: 2px solid var(--c-gold-primary);
            color: var(--c-gold-shadow);
            padding: 16px 50px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn-restart::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-restart:hover::before {
            left: 100%;
        }

        .btn-restart:hover {
            background: var(--c-gold-primary);
            color: #fff;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.35);
            transform: translateY(-3px);
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .app-shell {
                height: 95vh;
                width: 95%;
            }

            .card-panel {
                padding: 30px 20px;
                border-radius: 20px;
            }

            .stamp-seal {
                width: 70px;
                height: 70px;
                top: 15px;
                right: 15px;
                font-size: 1.4rem;
                border-width: 2px;
                opacity: 0.15;
            }

            .title-display {
                font-size: 2.8rem;
            }

            .subtitle-display {
                font-size: 1rem;
                margin-top: 40px;
            }

            .btn-gold {
                padding: 22px 0;
                width: 100%;
                font-size: 1.3rem;
            }

            .details-grid {
                grid-template-columns: 1fr;
                gap: 30px;
                margin-bottom: 30px;
            }

            .dish-title-text {
                font-size: 2.2rem;
            }

            .quote-box {
                padding: 20px;
                font-size: 1.1rem;
                margin-bottom: 30px;
            }

            .method-box {
                padding: 20px;
            }

            .method-step {
                padding-left: 40px;
                font-size: 1rem;
            }

            .method-step::before {
                width: 28px;
                height: 28px;
                line-height: 28px;
