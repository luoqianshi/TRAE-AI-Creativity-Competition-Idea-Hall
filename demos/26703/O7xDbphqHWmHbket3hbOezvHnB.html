                const budget = parseInt(budgetRange.value);
                
                // 根据预算筛选
                const filtered = sceneActivities.filter(act => {
                    const costRange = act.cost.split('-');
                    const maxCost = parseInt(costRange[1] || costRange[0]);
                    return maxCost <= budget + 100;
                });
                
                // 随机选择2-3个活动
                const selected = filtered.sort(() => 0.5 - Math.random()).slice(0, 3);
                
                // 生成HTML
                activityList.innerHTML = selected.map((act, index) => `
                    <div class="activity-card" style="animation: fadeIn 0.5s ease ${index * 0.1}s both;">
                        <div class="activity-header">
                            <div class="activity-title">${act.title}</div>
                            <span class="activity-tag">${act.tag}</span>
                        </div>
                        <div class="activity-desc">${act.desc}</div>
                        <div class="activity-meta">
                            <span class="meta-item">
                                <span class="icon">⏱️</span>
                                ${act.time}
                            </span>
                            <span class="meta-item">
                                <span class="icon">💰</span>
                                ${act.cost}元
                            </span>
                            <span class="meta-item">
                                <span class="icon">📍</span>
                                ${act.location}
                            </span>
                        </div>
                        <ul class="reason-list">
                            ${act.reasons.map(r => `<li>${r}</li>`).join('')}
                        </ul>
                    </div>
                `).join('');
                
                recommendation.classList.add('show');
                
                // 滚动到结果
                recommendation.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 1500);
        });
    </script>
</body>
</html>
