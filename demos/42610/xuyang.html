<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轻体记 - 减肥健康管理助手</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg2: #1e293b;
      --bg3: #334155;
      --ink: #f1f5f9;
      --muted: #94a3b8;
      --rule: #475569;
      --accent: #10b981;
      --accent2: #34d399;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      font-size: 14px;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.15);
      color: white;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .btn:hover { background: rgba(255,255,255,0.25); }

    .btn-primary {
      background: white;
      color: var(--accent);
      border-color: white;
      font-weight: 600;
    }

    .btn-primary:hover { background: #f0fdf4; }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: var(--bg2);
      border-right: 1px solid var(--rule);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .nav-item {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
      border-left: 3px solid transparent;
    }

    .nav-item:hover { background: rgba(16, 185, 129, 0.1); }

    .nav-item.active {
      background: rgba(16, 185, 129, 0.15);
      border-left-color: var(--accent);
      color: var(--accent);
    }

    .nav-icon { font-size: 18px; }

    /* Content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .page { display: none; }
    .page.active { display: block; }

    /* Dashboard Cards */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .stat-card .stat-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .stat-card .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-card .stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .stat-card .stat-change {
      font-size: 11px;
      margin-top: 4px;
    }

    .stat-change.up { color: var(--danger); }
    .stat-change.down { color: var(--accent); }

    /* Chart */
    .chart-container {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .chart-container h3 {
      font-size: 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chart-canvas {
      width: 100%;
      height: 240px;
    }

    /* Section */
    .section {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section h3 {
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Form */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-label {
      font-size: 12px;
      color: var(--muted);
    }

    .form-input, .form-select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--rule);
      background: var(--bg3);
      color: var(--ink);
      font-size: 13px;
      outline: none;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--accent);
    }

    .form-input::placeholder { color: var(--muted); }

    /* Meal Tags */
    .meal-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .meal-tag {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid var(--rule);
      background: var(--bg3);
      transition: all 0.2s;
    }

    .meal-tag:hover, .meal-tag.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* Table */
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th, .data-table td {
      padding: 10px 12px;
      text-align: left;
      font-size: 13px;
      border-bottom: 1px solid var(--rule);
    }

    .data-table th {
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
    }

    .data-table tr:hover { background: rgba(16, 185, 129, 0.05); }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }

    .tag-breakfast { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .tag-lunch { background: rgba(59, 130, 246, 0.2); color: var(--info); }
    .tag-dinner { background: rgba(139, 92, 246, 0.2); color: #a78bfa; }
    .tag-snack { background: rgba(16, 185, 129, 0.2); color: var(--accent); }

    .delete-btn {
      color: var(--danger);
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .delete-btn:hover { background: rgba(239, 68, 68, 0.1); }

    /* Goal Progress */
    .goal-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--rule);
    }

    .goal-item:last-child { border-bottom: none; }

    .goal-info { flex: 1; }

    .goal-name { font-size: 13px; }

    .goal-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .progress-bar {
      width: 120px;
      height: 8px;
      background: var(--bg3);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 4px;
      transition: width 0.5s;
    }

    .progress-text { font-size: 12px; color: var(--muted); min-width: 50px; text-align: right; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .modal-overlay.active { opacity: 1; visibility: visible; }

    .modal {
      background: var(--bg2);
      border-radius: 12px;
      border: 1px solid var(--rule);
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--rule);
      font-weight: 600;
      font-size: 15px;
    }

    .modal-body { padding: 20px; overflow-y: auto; }

    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--rule);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
      .form-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>&#127793; 轻体记 - 减肥健康管理助手</h1>
      <div class="header-actions">
        <button class="btn" onclick="exportData()">&#128229; 导出数据</button>
        <button class="btn btn-primary" onclick="showAddModal()">&#10133; 今日记录</button>
      </div>
    </div>

    <div class="main">
      <div class="sidebar">
        <div class="nav-item active" onclick="switchPage('dashboard', this)">
          <span class="nav-icon">&#128202;</span>
          <span>数据概览</span>
        </div>
        <div class="nav-item" onclick="switchPage('weight', this)">
          <span class="nav-icon">&#9878;</span>
          <span>体重记录</span>
        </div>
        <div class="nav-item" onclick="switchPage('diet', this)">
          <span class="nav-icon">&#127860;</span>
          <span>饮食记录</span>
        </div>
        <div class="nav-item" onclick="switchPage('exercise', this)">
          <span class="nav-icon">&#127939;</span>
          <span>运动记录</span>
        </div>
        <div class="nav-item" onclick="switchPage('goals', this)">
          <span class="nav-icon">&#127942;</span>
          <span>目标管理</span>
        </div>
      </div>

      <div class="content">
        <!-- Dashboard -->
        <div class="page active" id="page-dashboard">
          <div class="dashboard-grid">
            <div class="stat-card">
              <div class="stat-icon">&#9878;</div>
              <div class="stat-value" id="currentWeight">--</div>
              <div class="stat-label">当前体重 (kg)</div>
              <div class="stat-change" id="weightChange"></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon">&#127860;</div>
              <div class="stat-value" id="todayCalories">--</div>
              <div class="stat-label">今日摄入 (kcal)</div>
              <div class="stat-change" id="calorieChange"></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon">&#127939;</div>
              <div class="stat-value" id="todayExercise">--</div>
              <div class="stat-label">今日运动 (分钟)</div>
              <div class="stat-change" id="exerciseChange"></div>
            </div>
            <div class="stat-card">
              <div class="stat-icon">&#128293;</div>
              <div class="stat-value" id="totalDays">--</div>
              <div class="stat-label">坚持天数</div>
              <div class="stat-change">加油！</div>
            </div>
          </div>

          <div class="chart-container">
            <h3>&#128200; 体重变化趋势</h3>
            <canvas class="chart-canvas" id="weightChart"></canvas>
          </div>

          <div class="chart-container">
            <h3>&#127860; 近7天热量摄入</h3>
            <canvas class="chart-canvas" id="calorieChart"></canvas>
          </div>
        </div>

        <!-- Weight -->
        <div class="page" id="page-weight">
          <div class="section">
            <div class="section-header">
              <h3>&#9878; 体重记录</h3>
              <button class="btn btn-primary" onclick="showAddWeightModal()">&#10133; 添加记录</button>
            </div>
            <table class="data-table" id="weightTable">
              <thead>
                <tr><th>日期</th><th>体重 (kg)</th><th>BMI</th><th>备注</th><th>操作</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- Diet -->
        <div class="page" id="page-diet">
          <div class="section">
            <div class="section-header">
              <h3>&#127860; 饮食记录</h3>
              <button class="btn btn-primary" onclick="showAddDietModal()">&#10133; 添加饮食</button>
            </div>
            <table class="data-table" id="dietTable">
              <thead>
                <tr><th>时间</th><th>餐别</th><th>食物</th><th>热量 (kcal)</th><th>操作</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- Exercise -->
        <div class="page" id="page-exercise">
          <div class="section">
            <div class="section-header">
              <h3>&#127939; 运动记录</h3>
              <button class="btn btn-primary" onclick="showAddExerciseModal()">&#10133; 添加运动</button>
            </div>
            <table class="data-table" id="exerciseTable">
              <thead>
                <tr><th>日期</th><th>运动项目</th><th>时长 (分钟)</th><th>消耗 (kcal)</th><th>操作</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- Goals -->
        <div class="page" id="page-goals">
          <div class="section">
            <div class="section-header">
              <h3>&#127942; 目标管理</h3>
              <button class="btn btn-primary" onclick="showAddGoalModal()">&#10133; 添加目标</button>
            </div>
            <div id="goalsList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Record Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <div class="modal-header">&#10133; 添加今日记录</div>
      <div class="modal-body">
        <div class="form-group" style="margin-bottom:12px;">
          <label class="form-label">日期</label>
          <input type="date" class="form-input" id="recordDate">
        </div>
        <div class="form-group" style="margin-bottom:12px;">
          <label class="form-label">体重 (kg)</label>
          <input type="number" class="form-input" id="recordWeight" step="0.1" placeholder="如: 65.5">
        </div>
        <div class="form-group" style="margin-bottom:12px;">
          <label class="form-label">今日饮食</label>
          <input type="text" class="form-input" id="recordDiet" placeholder="如: 早餐燕麦、午餐沙拉">
        </div>
        <div class="form-group" style="margin-bottom:12px;">
          <label class="form-label">摄入热量 (kcal)</label>
          <input type="number" class="form-input" id="recordCalories" placeholder="如: 1500">
        </div>
        <div class="form-group" style="margin-bottom:12px;">
          <label class="form-label">运动项目及时长</label>
          <input type="text" class="form-input" id="recordExercise" placeholder="如: 跑步30分钟">
        </div>
        <div class="form-group">
          <label class="form-label">备注</label>
          <input type="text" class="form-input" id="recordNote" placeholder="可选">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal('addModal')" style="color:var(--ink);border-color:var(--rule);">取消</button>
        <button class="btn btn-primary" onclick="saveRecord()">保存</button>
      </div>
    </div>
  </div>

  <script>
    // Demo data
    let weightRecords = [
      { id: 1, date: '2026-06-01', weight: 72.5, note: '开始减肥' },
      { id: 2, date: '2026-06-05', weight: 71.8, note: '' },
      { id: 3, date: '2026-06-10', weight: 71.2, note: '控制了晚餐' },
      { id: 4, date: '2026-06-15', weight: 70.5, note: '' },
      { id: 5, date: '2026-06-20', weight: 69.8, note: '坚持运动' },
      { id: 6, date: '2026-06-24', weight: 69.2, note: '' }
    ];

    let dietRecords = [
      { id: 1, date: '2026-06-24', time: '08:00', meal: 'breakfast', food: '燕麦粥 + 鸡蛋', calories: 350 },
      { id: 2, date: '2026-06-24', time: '12:00', meal: 'lunch', food: '鸡胸肉沙拉', calories: 450 },
      { id: 3, date: '2026-06-24', time: '18:30', meal: 'dinner', food: '清蒸鱼 + 蔬菜', calories: 400 },
      { id: 4, date: '2026-06-24', time: '15:00', meal: 'snack', food: '苹果', calories: 80 }
    ];

    let exerciseRecords = [
      { id: 1, date: '2026-06-24', type: '跑步', duration: 30, burn: 280 },
      { id: 2, date: '2026-06-23', type: '游泳', duration: 45, burn: 350 },
      { id: 3, date: '2026-06-22', type: '瑜伽', duration: 60, burn: 180 },
      { id: 4, date: '2026-06-21', type: '跳绳', duration: 20, burn: 220 }
    ];

    let goals = [
      { id: 1, name: '减重至65kg', current: 69.2, target: 65, unit: 'kg', type: 'down' },
      { id: 2, name: '每日运动30分钟', current: 30, target: 30, unit: '分钟', type: 'up' },
      { id: 3, name: '每日热量控制在1500kcal', current: 1280, target: 1500, unit: 'kcal', type: 'down' }
    ];

    const mealLabels = { breakfast: '早餐', lunch: '午餐', dinner: '晚餐', snack: '加餐' };

    function switchPage(page, el) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      el.classList.add('active');
      if (page === 'dashboard') renderCharts();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function showAddModal() {
      document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('addModal').classList.add('active');
    }

    function saveRecord() {
      const date = document.getElementById('recordDate').value;
      const weight = parseFloat(document.getElementById('recordWeight').value);
      const calories = parseInt(document.getElementById('recordCalories').value);
      const note = document.getElementById('recordNote').value;

      if (weight) {
        weightRecords.push({ id: Date.now(), date, weight, note });
        weightRecords.sort((a, b) => new Date(a.date) - new Date(b.date));
      }

      if (calories) {
        const diet = document.getElementById('recordDiet').value || '未记录';
        dietRecords.push({ id: Date.now(), date, time: new Date().toTimeString().slice(0,5), meal: 'snack', food: diet, calories });
      }

      const exercise = document.getElementById('recordExercise').value;
      if (exercise) {
        const match = exercise.match(/(\D+)(\d+)/);
        if (match) {
          exerciseRecords.push({ id: Date.now(), date, type: match[1].trim(), duration: parseInt(match[2]), burn: parseInt(match[2]) * 8 });
        }
      }

      closeModal('addModal');
      updateDashboard();
      renderWeightTable();
      renderDietTable();
      renderExerciseTable();
      renderCharts();
    }

    function updateDashboard() {
      const latest = weightRecords[weightRecords.length - 1];
      const prev = weightRecords[weightRecords.length - 2];
      document.getElementById('currentWeight').textContent = latest ? latest.weight : '--';
      if (latest && prev) {
        const diff = (latest.weight - prev.weight).toFixed(1);
        document.getElementById('weightChange').innerHTML = diff < 0 ? `<span class="down">&#9660; ${Math.abs(diff)} kg</span>` : `<span class="up">&#9650; ${diff} kg</span>`;
      }

      const today = new Date().toISOString().split('T')[0];
      const todayDiet = dietRecords.filter(d => d.date === today);
      const totalCal = todayDiet.reduce((s, d) => s + d.calories, 0);
      document.getElementById('todayCalories').textContent = totalCal || 0;

      const todayEx = exerciseRecords.filter(e => e.date === today);
      const totalEx = todayEx.reduce((s, e) => s + e.duration, 0);
      document.getElementById('todayExercise').textContent = totalEx || 0;

      const days = weightRecords.length;
      document.getElementById('totalDays').textContent = days;
    }

    function renderWeightTable() {
      const tbody = document.querySelector('#weightTable tbody');
      tbody.innerHTML = weightRecords.slice().reverse().map(r => {
        const bmi = (r.weight / 1.75 / 1.75).toFixed(1);
        return `<tr>
          <td>${r.date}</td>
          <td><strong>${r.weight}</strong></td>
          <td>${bmi}</td>
          <td>${r.note || '-'}</td>
          <td><span class="delete-btn" onclick="deleteWeight(${r.id})">&#128465;</span></td>
        </tr>`;
      }).join('');
    }

    function renderDietTable() {
      const tbody = document.querySelector('#dietTable tbody');
      tbody.innerHTML = dietRecords.slice().reverse().map(r => {
        return `<tr>
          <td>${r.date} ${r.time}</td>
          <td><span class="tag tag-${r.meal}">${mealLabels[r.meal]}</span></td>
          <td>${r.food}</td>
          <td>${r.calories}</td>
          <td><span class="delete-btn" onclick="deleteDiet(${r.id})">&#128465;</span></td>
        </tr>`;
      }).join('');
    }

    function renderExerciseTable() {
      const tbody = document.querySelector('#exerciseTable tbody');
      tbody.innerHTML = exerciseRecords.slice().reverse().map(r => {
        return `<tr>
          <td>${r.date}</td>
          <td>${r.type}</td>
          <td>${r.duration}</td>
          <td>${r.burn}</td>
          <td><span class="delete-btn" onclick="deleteExercise(${r.id})">&#128465;</span></td>
        </tr>`;
      }).join('');
    }

    function renderGoals() {
      const container = document.getElementById('goalsList');
      container.innerHTML = goals.map(g => {
        let pct;
        if (g.type === 'down') {
          pct = Math.min(100, Math.max(0, ((g.current - g.target) / (g.current * 1.2 - g.target)) * 100));
        } else {
          pct = Math.min(100, (g.current / g.target) * 100);
        }
        return `<div class="goal-item">
          <div class="goal-info">
            <div class="goal-name">${g.name}</div>
            <div class="goal-meta">当前: ${g.current}${g.unit} / 目标: ${g.target}${g.unit}</div>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-text">${Math.round(pct)}%</div>
        </div>`;
      }).join('');
    }

    function renderCharts() {
      drawLineChart('weightChart', weightRecords.map(r => r.date.slice(5)), weightRecords.map(r => r.weight), '#10b981');

      const last7 = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(); d.setDate(d.getDate() - i);
        const ds = d.toISOString().split('T')[0];
        const cal = dietRecords.filter(x => x.date === ds).reduce((s, x) => s + x.calories, 0);
        last7.push({ date: ds.slice(5), cal });
      }
      drawBarChart('calorieChart', last7.map(x => x.date), last7.map(x => x.cal));
    }

    function drawLineChart(canvasId, labels, data, color) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const w = rect.width, h = rect.height;
      const pad = { top: 20, right: 20, bottom: 40, left: 50 };
      const cw = w - pad.left - pad.right;
      const ch = h - pad.top - pad.bottom;

      ctx.clearRect(0, 0, w, h);

      const min = Math.min(...data) - 1;
      const max = Math.max(...data) + 1;
      const range = max - min || 1;

      // Grid
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = pad.top + (ch / 4) * i;
        ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
      }

      // Line
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      data.forEach((v, i) => {
        const x = pad.left + (cw / (data.length - 1 || 1)) * i;
        const y = pad.top + ch - ((v - min) / range) * ch;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Points
      ctx.fillStyle = color;
      data.forEach((v, i) => {
        const x = pad.left + (cw / (data.length - 1 || 1)) * i;
        const y = pad.top + ch - ((v - min) / range) * ch;
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
      });

      // Labels
      ctx.fillStyle = '#94a3b8';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      labels.forEach((l, i) => {
        const x = pad.left + (cw / (labels.length - 1 || 1)) * i;
        ctx.fillText(l, x, h - 10);
      });

      ctx.textAlign = 'right';
      for (let i = 0; i <= 4; i++) {
        const v = max - (range / 4) * i;
        const y = pad.top + (ch / 4) * i;
        ctx.fillText(v.toFixed(1), pad.left - 8, y + 4);
      }
    }

    function drawBarChart(canvasId, labels, data) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const w = rect.width, h = rect.height;
      const pad = { top: 20, right: 20, bottom: 40, left: 50 };
      const cw = w - pad.left - pad.right;
      const ch = h - pad.top - pad.bottom;

      ctx.clearRect(0, 0, w, h);

      const max = Math.max(...data, 2000) * 1.1;

      // Grid
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = pad.top + (ch / 4) * i;
        ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
      }

      // Bars
      const barW = (cw / data.length) * 0.6;
      const gap = (cw / data.length) * 0.4;
      data.forEach((v, i) => {
        const x = pad.left + (cw / data.length) * i + gap / 2;
        const bh = (v / max) * ch;
        const y = pad.top + ch - bh;

        const grad = ctx.createLinearGradient(0, y, 0, y + bh);
        grad.addColorStop(0, '#10b981');
        grad.addColorStop(1, '#34d399');
        ctx.fillStyle = grad;
        ctx.fillRect(x, y, barW, bh);

        ctx.fillStyle = '#f1f5f9';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(v, x + barW / 2, y - 6);
      });

      // Labels
      ctx.fillStyle = '#94a3b8';
      labels.forEach((l, i) => {
        const x = pad.left + (cw / data.length) * i + (cw / data.length) / 2;
        ctx.fillText(l, x, h - 10);
      });

      ctx.textAlign = 'right';
      for (let i = 0; i <= 4; i++) {
        const v = Math.round((max / 4) * (4 - i));
        const y = pad.top + (ch / 4) * i;
        ctx.fillText(v, pad.left - 8, y + 4);
      }
    }

    function deleteWeight(id) {
      weightRecords = weightRecords.filter(r => r.id !== id);
      updateDashboard();
      renderWeightTable();
      renderCharts();
    }

    function deleteDiet(id) {
      dietRecords = dietRecords.filter(r => r.id !== id);
      updateDashboard();
      renderDietTable();
    }

    function deleteExercise(id) {
      exerciseRecords = exerciseRecords.filter(r => r.id !== id);
      updateDashboard();
      renderExerciseTable();
    }

    function exportData() {
      const data = {
        weight: weightRecords,
        diet: dietRecords,
        exercise: exerciseRecords,
        goals: goals,
        exportDate: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'health-data.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    // Init
    updateDashboard();
    renderWeightTable();
    renderDietTable();
    renderExerciseTable();
    renderGoals();
    setTimeout(renderCharts, 100);

    window.addEventListener('resize', () => {
      if (document.getElementById('page-dashboard').classList.contains('active')) {
        renderCharts();
      }
    });
  </script>
</body>
