<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>同学帮 - 校园互助代取平台</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
/* ==================== CSS Variables & Reset ==================== */
:root {
  --yellow: #FFC107;
  --yellow-light: #FFF8E1;
  --yellow-dark: #F9A825;
  --bg: #FFF9E6;
  --card: rgba(255,255,255,.72);
  --bubble: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.04);
  --glass-border: rgba(255,255,255,.3);
  --separator: rgba(60,60,67,.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  color: #333;
  background: #FFF9E6;
  background: radial-gradient(ellipse at 20% 50%, rgba(255,193,7,.08) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 20%, rgba(255,152,0,.06) 0%, transparent 50%);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ==================== Page Container ==================== */
.page {
  display: none;
  min-height: 100vh;
  position: relative;
  padding-bottom: 20px;
}
.page.active { display: block; }

/* ==================== Home Page ==================== */
#page-home.active {
  background: linear-gradient(180deg, #FFF9E6 0%, #FFFDE7 40%, #fff 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 40px 20px;
}

.home-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  width: 100%;
  max-width: 400px;
}

.home-icon {
  width: 5rem;
  height: 5rem;
  border-radius: 50%;
  background: linear-gradient(135deg, #FFC107, #FFB300);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(255,193,7,.35);
  margin-bottom: 8px;
}

.home-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.home-title {
  font-size: 2rem;
  font-weight: 700;
  color: #333;
  letter-spacing: 2px;
}

.home-subtitle {
  font-size: 1rem;
  color: #666;
  text-align: center;
  line-height: 1.6;
  margin-bottom: 12px;
}

.home-btn {
  display: block;
  width: 100%;
  max-width: 280px;
  padding: 14px 0;
  border: none;
  border-radius: 16px;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  letter-spacing: 1px;
  text-align: center;
}

.home-btn:active { transform: scale(.97); }

.home-btn.orderer {
  background: linear-gradient(135deg, #FFC107, #FFB300);
  color: #fff;
  box-shadow: 0 4px 16px rgba(255,193,7,.45);
}

.home-btn.runner {
  background: var(--card);
  color: #333;
  box-shadow: var(--bubble);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255,255,255,.25);
}

.home-footer {
  margin-top: 32px;
  font-size: .8rem;
  color: #999;
}

/* ==================== App Header ==================== */
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: rgba(255,255,255,.75);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--separator);
  gap: 10px;
}

.app-header .back-btn {
  width: 36px;
  height: 36px;
  border: none;
  background: rgba(255,255,255,.65);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: 50%;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
  border: 1px solid rgba(255,255,255,.3);
  flex-shrink: 0;
}

.app-header .header-title {
  font-size: 1.1rem;
  font-weight: 600;
  flex: 1;
  text-align: center;
}

/* ==================== Card Styles ==================== */
.card {
  background: var(--card);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: 16px;
  padding: 16px;
  margin: 12px 16px;
  box-shadow: var(--bubble);
  border: 1px solid rgba(255,255,255,.25);
}

/* ==================== Stats Row ==================== */
.stats-row {
  display: flex;
  gap: 10px;
  padding: 12px 16px;
  overflow-x: auto;
}

.stat-item {
  flex: 1;
  min-width: 80px;
  text-align: center;
  background: var(--card);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: 14px;
  padding: 14px 8px;
  box-shadow: var(--bubble);
  border: 1px solid rgba(255,255,255,.25);
  cursor: pointer;
  transition: all .2s;
}

.stat-item:active { transform: scale(.96); }

.stat-item .stat-num {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--yellow-dark);
}

.stat-item .stat-label {
  font-size: .75rem;
  color: #888;
  margin-top: 4px;
}

/* ==================== Tabs ==================== */
.tabs {
  display: flex;
  gap: 10px;
  padding: 12px 16px;
  overflow-x: auto;
}

.tab {
  padding: 8px 18px;
  border-radius: 20px;
  font-size: .9rem;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,.25);
  background: rgba(255,255,255,.55);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  color: #666;
  transition: all .2s;
  white-space: nowrap;
  position: relative;
}

.tab.active {
  background: linear-gradient(135deg, #FFC107, #FFB300);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 2px 10px rgba(255,193,7,.35);
}

.tab .badge {
  display: inline-block;
  background: var(--yellow-light);
  color: var(--yellow-dark);
  font-size: .7rem;
  padding: 1px 7px;
  border-radius: 10px;
  margin-left: 6px;
  font-weight: 600;
}

.tab.active .badge {
  background: rgba(255,255,255,.3);
  color: #fff;
}

/* ==================== Order Cards ==================== */
.order-card {
  background: var(--card);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: 16px;
  padding: 16px;
  margin: 10px 16px;
  box-shadow: var(--bubble);
  border: 1px solid rgba(255,255,255,.25);
  cursor: pointer;
  transition: all .2s;
}

.order-card:active { transform: scale(.98); }

.order-card .order-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.order-card .order-id {
  font-size: .8rem;
  color: #999;
}

.order-card .status-badge {
  font-size: .75rem;
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 500;
}

.status-badge.pending {
  background: rgba(255,152,0,.12);
  color: orange;
}

.status-badge.accepted {
  background: rgba(249,168,37,.12);
  color: #F9A825;
}

.status-badge.delivering {
  background: rgba(249,168,37,.12);
  color: #F9A825;
}

.status-badge.completed {
  background: rgba(76,175,80,.12);
  color: green;
}

.order-card .order-shop {
  font-size: .95rem;
  font-weight: 600;
  margin-bottom: 4px;
}

.order-card .order-item {
  font-size: .85rem;
  color: #555;
  margin-bottom: 6px;
}

.order-card .order-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: .8rem;
  color: #888;
  margin-top: 8px;
}

.order-card .order-tip {
  color: var(--yellow-dark);
  font-weight: 600;
  font-size: .9rem;
}

.order-card .runner-info {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: .85rem;
  color: #555;
}

.order-card .runner-avatar {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: linear-gradient(135deg, #FFC107, #FFB300);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: .7rem;
  font-weight: 600;
}

/* ==================== Progress Steps ==================== */
.progress-steps {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  padding: 0 8px;
}

.progress-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  position: relative;
  flex: 1;
}

.progress-step .dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ddd;
  transition: all .3s;
}

.progress-step.active .dot {
  background: var(--yellow);
  box-shadow: 0 0 8px rgba(255,193,7,.5);
}

.progress-step .step-label {
  font-size: .65rem;
  color: #bbb;
  transition: color .3s;
}

.progress-step.active .step-label {
  color: var(--yellow-dark);
  font-weight: 600;
}

.progress-step .line {
  position: absolute;
  top: 6px;
  left: 50%;
  width: 100%;
  height: 2px;
  background: #ddd;
  z-index: -1;
}

.progress-step:first-child .line { display: none; }

.progress-step.active .line {
  background: var(--yellow);
}

/* ==================== Tracker Card ==================== */
.tracker-card {
  background: var(--card);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: 16px;
  padding: 16px;
  margin: 12px 16px;
  box-shadow: var(--bubble);
  border: 1px solid rgba(255,255,255,.25);
}

.tracker-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.tracker-header .tracker-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--yellow);
  animation: dotPulse 1.5s infinite;
}

@keyframes dotPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .4; transform: scale(1.3); }
}

.tracker-header .tracker-title {
  font-size: .9rem;
  font-weight: 600;
  flex: 1;
  margin-left: 8px;
}

.tracker-header .refresh-btn {
  width: 30px;
  height: 30px;
  border: none;
  background: rgba(255,255,255,.65);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.3);
  cursor: pointer;
  font-size: .9rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}

.tracker-body {
  font-size: .85rem;
  color: #555;
  line-height: 1.6;
}

/* ==================== Empty State ==================== */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  color: #bbb;
}

.empty-state .empty-icon {
  font-size: 3rem;
  margin-bottom: 12px;
  opacity: .5;
}

.empty-state .empty-text {
  font-size: .9rem;
}

/* ==================== FAB Button ==================== */
.fab-wrap {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  z-index: 90;
}

.fab {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, #FFC107, #FFB300);
  color: #fff;
  font-size: 1.6rem;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(255,193,7,.45);
  transition: all .2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.fab:active { transform: scale(.92); }

.fab-label {
  font-size: .75rem;
  color: #888;
}

/* ==================== Overlay Panel ==================== */
.overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 200;
  background: rgba(0,0,0,.3);
  flex-direction: column;
  justify-content: flex-end;
  touch-action: none;
}

.overlay.active {
  display: flex;
}

.overlay-panel {
  background: rgba(255,255,255,.75);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: 24px 24px 0 0;
  padding: 20px 16px 30px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 -4px 30px rgba(0,0,0,.1);
  touch-action: pan-y;
}

.overlay-panel .panel-title {
  font-size: 1.1rem;
  font-weight: 600;
  text-align: center;
  margin-bottom: 16px;
  color: #333;
}

/* ==================== Form Styles ==================== */
.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-size: .85rem;
  font-weight: 500;
  color: #555;
  margin-bottom: 6px;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 12px;
  font-size: .9rem;
  background: var(--card);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  outline: none;
  transition: border-color .2s;
  color: #333;
}

.form-group input:focus,
.form-group select:focus {
  border-color: var(--yellow);
  box-shadow: 0 0 0 3px rgba(255,193,7,.1);
}

.form-group .hint {
  font-size: .75rem;
  color: #999;
  margin-top: 4px;
}

.tip-options {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.tip-option {
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,.3);
  background: var(--card);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  cursor: pointer;
  font-size: .85rem;
  color: #666;
  transition: all .2s;
}

.tip-option.selected {
  background: linear-gradient(135deg, #FFC107, #FFB300);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 2px 8px rgba(255,193,7,.3);
}

.form-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.btn {
  padding: 12px 24px;
  border-radius: 14px;
  font-size: .95rem;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all .2s;
  flex: 1;
  text-align: center;
}

.btn:active { transform: scale(.97); }

.btn-primary {
  background: linear-gradient(135deg, #FFC107, #FFB300);
  color: #fff;
  box-shadow: 0 4px 14px rgba(255,193,7,.35);
}

.btn-secondary {
  background: var(--card);
  color: #666;
  border: 1px solid rgba(0,0,0,.08);
  box-shadow: 0 2px 8px rgba(0,0,0,.04);
}

.btn-sm {
  padding: 8px 16px;
  font-size: .8rem;
  border-radius: 10px;
  flex: none;
}

/* ==================== Rating Overlay ==================== */
.rating-overlay .stars {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 16px 0;
}

.rating-overlay .star {
  font-size: 2rem;
  cursor: pointer;
  color: #ddd;
  transition: color .2s;
}

.rating-overlay .star.active {
  color: var(--yellow);
}

.rating-overlay .rating-text {
  text-align: center;
  font-size: .9rem;
  color: #666;
  margin-bottom: 16px;
}

/* ==================== AI Review Overlay ==================== */
.ai-review-overlay .robot-icon {
  font-size: 3rem;
  text-align: center;
  margin-bottom: 10px;
}

.ai-review-result {
  text-align: center;
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 10px;
  padding: 10px;
  border-radius: 12px;
}

.ai-review-result.safe {
  background: rgba(76,175,80,.1);
  color: green;
}

.ai-review-result.flagged {
  background: rgba(244,67,54,.1);
  color: #d32f2f;
}

.ai-review-detail {
  font-size: .85rem;
  color: #666;
  line-height: 1.6;
  text-align: center;
  padding: 0 10px;
}

/* ==================== Map Overlay ==================== */
.map-overlay {
  background: rgba(0,0,0,.5);
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 300;
  display: none;
  flex-direction: column;
}

.map-overlay.active { display: flex; }

.map-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: rgba(255,255,255,.75);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  z-index: 10;
}

.map-header .map-title {
  font-size: 1rem;
  font-weight: 600;
}

.map-header .map-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: var(--card);
  cursor: pointer;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.map-container {
  flex: 1;
  position: relative;
}

.map-view {
  width: 100%;
  height: 100%;
}

.map-legend {
  position: absolute;
  top: 10px;
  right: 10px;
  background: var(--card);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: .75rem;
  box-shadow: var(--bubble);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.map-legend .legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.map-legend .legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.map-legend .legend-dot.pickup { background: #4CAF50; }
.map-legend .legend-dot.dropoff { background: #F44336; }
.map-legend .legend-dot.rider { background: #FFC107; }

.map-info-card {
  position: absolute;
  bottom: 16px;
  left: 16px;
  right: 16px;
  background: var(--card);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: 16px;
  padding: 14px 16px;
  box-shadow: 0 -2px 20px rgba(0,0,0,.1);
  z-index: 1000;
}

.map-info-card .eta-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: .9rem;
  font-weight: 600;
}

.map-info-card .route-steps {
  font-size: .8rem;
  color: #666;
  margin-bottom: 12px;
  line-height: 1.5;
}

.map-info-card .action-btns {
  display: flex;
  gap: 10px;
}

/* ==================== Toast ==================== */
#toast-container {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
}

.toast {
  background: rgba(50,50,50,.9);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  color: #fff;
  padding: 10px 22px;
  border-radius: 20px;
  font-size: .85rem;
  animation: toastIn .3s ease;
  pointer-events: auto;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ==================== Misc ==================== */
.orderer-content, .runner-content {
  padding-bottom: 100px;
}

.hidden { display: none !important; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,.1); border-radius: 4px; }
</style>
</head>
<body>

<!-- ==================== PAGE: HOME ==================== -->
<div id="page-home" class="page active">

<!-- ==================== PAGE: ORDERER ==================== -->
<div id="page-orderer" class="page">
  <div class="app-header">
    <button class="back-btn" onclick="goHome()">&#8592;</button>
    <span class="header-title">我要下单</span>
    <div style="width:36px;"></div>
  </div>
  <div class="tracker-card" id="tracker-card" style="display:none;">
    <div class="tracker-header">
      <div class="tracker-dot"></div>
      <span class="tracker-title" id="tracker-title">订单追踪</span>
      <button class="refresh-btn" onclick="updateTrackerCard()">&#8635;</button>
    </div>
    <div class="tracker-body" id="tracker-body"></div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="all" onclick="switchTab('all')">全部<span class="badge" id="badge-all">0</span></div>
    <div class="tab" data-tab="my" onclick="switchTab('my')">我的<span class="badge" id="badge-my">0</span></div>
  </div>
  <div class="orderer-content" id="orderer-content"></div>
  <div class="empty-state orderer-empty" id="orderer-empty">
    <div class="empty-icon">&#128230;</div>
    <div class="empty-text">暂无订单</div>
  </div>
  <div class="fab-wrap">
    <button class="fab" onclick="openForm()">+</button>
    <span class="fab-label">发布订单</span>
  </div>
</div>

<!-- ==================== PAGE: RUNNER ==================== -->
<div id="page-runner" class="page">
  <div class="app-header">
    <button class="back-btn" onclick="goHome()">&#8592;</button>
    <span class="header-title">我要接单</span>
  </div>
  <div class="stats-row">
    <div class="stat-item" onclick="switchTab('pending')">
      <div class="stat-num" id="stat-pending">0</div>
      <div class="stat-label">待接单</div>
    </div>
    <div class="stat-item" onclick="switchTab('delivering')">
      <div class="stat-num" id="stat-delivering">0</div>
      <div class="stat-label">配送中</div>
    </div>
    <div class="stat-item" onclick="openStatsDetail()">
      <div class="stat-num" id="stat-completed">0</div>
      <div class="stat-label">已完成</div>
    </div>
    <div class="stat-item" onclick="openMap()">
      <div class="stat-num">&#128506;</div>
      <div class="stat-label">地图</div>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="pending" onclick="switchTab('pending')">可接单<span class="badge" id="badge-pending">0</span></div>
    <div class="tab" data-tab="delivering" onclick="switchTab('delivering')">配送中<span class="badge" id="badge-delivering">0</span></div>
  </div>
  <div class="runner-content" id="runner-content"></div>
  <div class="empty-state runner-empty" id="runner-empty">
    <div class="empty-icon">&#127939;</div>
    <div class="empty-text">暂无订单</div>
  </div>
</div>

<!-- ==================== OVERLAY: FORM ==================== -->
<div class="overlay" id="form-overlay">
  <div class="overlay-panel">
    <div class="panel-title">发布订单</div>
    <div class="form-group">
      <label>店铺名称</label>
      <input type="text" id="form-shop" placeholder="例如：瑞幸咖啡、食堂三楼" />
    </div>
    <div class="form-group">
      <label>需要带什么</label>
      <input type="text" id="form-item" placeholder="例如：冰美式x1、鸡腿饭x1" />
    </div>
    <div class="form-group">
      <label>联系方式</label>
      <input type="text" id="form-contact" placeholder="手机号 / 微信号" />
      <div class="hint">请输入有效的手机号码（11位）</div>
    </div>
    <div class="form-group">
      <label>跑腿酬劳（元）</label>
      <div class="tip-options" id="tip-options">
        <div class="tip-option selected" data-tip="5" onclick="selectTip(5)">5元</div>
        <div class="tip-option" data-tip="8" onclick="selectTip(8)">8元</div>
        <div class="tip-option" data-tip="12" onclick="selectTip(12)">12元</div>
        <div class="tip-option" data-tip="15" onclick="selectTip(15)">15元</div>
        <div class="tip-option" data-tip="custom" id="tip-custom">自定义</div>
      </div>
      <input type="number" id="form-tip-custom" placeholder="输入金额" style="display:none;margin-top:8px;" min="1" max="100" />
    </div>
    <div class="form-group">
      <label>送达地点</label>
      <input type="text" id="form-location" placeholder="例如：东区宿舍3号楼" />
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeForm()">取消</button>
      <button class="btn btn-primary" onclick="submitOrder()">提交订单</button>
    </div>
  </div>
</div>

<!-- ==================== OVERLAY: DETAIL ==================== -->
<div class="overlay" id="detail-overlay">
  <div class="overlay-panel">
    <div class="panel-title">订单详情</div>
    <div class="detail-content" id="detail-content"></div>
    <div class="form-actions" style="margin-top:16px;">
      <button class="btn btn-secondary" onclick="closeDetail()">关闭</button>
    </div>
  </div>
</div>

<!-- ==================== OVERLAY: STATS ==================== -->
<div class="overlay" id="stats-overlay">
  <div class="overlay-panel">
    <div class="panel-title">统计详情</div>
    <div class="stats-content" id="stats-content"></div>
    <div class="form-actions" style="margin-top:16px;">
      <button class="btn btn-secondary" onclick="closeStatsDetail()">关闭</button>
    </div>
  </div>
</div>

<!-- ==================== OVERLAY: RATING ==================== -->
<div class="overlay rating-overlay" id="rating-overlay">
  <div class="overlay-panel">
    <div class="panel-title">评价跑腿同学</div>
    <div class="stars" id="rating-stars">
      <span class="star" data-star="1" onclick="setRating(1)">&#9733;</span>
      <span class="star" data-star="2" onclick="setRating(2)">&#9733;</span>
      <span class="star" data-star="3" onclick="setRating(3)">&#9733;</span>
      <span class="star" data-star="4" onclick="setRating(4)">&#9733;</span>
      <span class="star" data-star="5" onclick="setRating(5)">&#9733;</span>
    </div>
    <div class="rating-text" id="rating-text">请选择评分</div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="skipRating()">跳过</button>
      <button class="btn btn-primary" id="submit-rating-btn" onclick="submitRating()" disabled>提交</button>
    </div>
  </div>
</div>

<!-- ==================== OVERLAY: AI REVIEW ==================== -->
<div class="overlay ai-review-overlay" id="ai-review-overlay">
  <div class="overlay-panel">
    <div class="robot-icon">&#129302;</div>

    <div class="ai-review-detail" id="ai-review-detail"></div>

  </div>
</div>

<!-- ==================== OVERLAY: ORDERER RATING ==================== -->
<div class="overlay rating-overlay" id="orderer-rating-overlay">

      <span class="star" data-star="1" onclick="setOrdererRating(1)">&#9733;</span>
      <span class="star" data-star="2" onclick="setOrdererRating(2)">&#9733;</span>
      <span class="star" data-star="3" onclick="setOrdererRating(3)">&#9733;</span>
      <span class="star" data-star="4" onclick="setOrdererRating(4)">&#9733;</span>

        <span id="map-eta-time">--</span>
      </div>
      <div class="route-steps" id="map-route-steps">正在规划路线...</div>
      <div class="action-btns" id="map-action-btns">
        <button class="btn btn-primary btn-sm" id="map-btn-start" onclick="startDeliveryFromMap()">开始配送</button>
        <button class="btn btn-primary btn-sm" id="map-btn-complete" onclick="completeDeliveryFromMap()" style="display:none;">确认送达</button>
      </div>
    </div>
  </div>
</div>

<!-- ==================== TOAST ==================== -->
<div id="toast-container"></div>

<!-- ==================== SCRIPTS ==================== -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ==================== FIRST IIFE: MAIN LOGIC ==================== */
(function() {
  'use strict';

  /* ---------- State ---------- */
  var currentPage = 'home';
  var currentTab = 'all';
  var selectedTip = 5;
  var selectedRating = 0;
  var selectedOrdererRating = 0;
  var currentRatingOrderId = null;
  var currentRatingRunnerName = null;
  var currentRatingOrdererContact = null;
  var currentOrdererRatingOrderId = null;
  var currentOrdererRatingContact = null;
  var _formFromHome = false;
  var myContact = '';

  /* ---------- Sample Data ---------- */
  var orders = [
    { id: 'ORD001', shop: '瑞幸咖啡', item: '冰美式 x1', contact: '13800001111', tip: 5, location: '东区宿舍3号楼', status: 'pending', createdAt: Date.now() - 600000 },
    { id: 'ORD002', shop: '食堂三楼', item: '鸡腿饭 x1 + 可乐', contact: '13800002222', tip: 8, location: '西区宿舍5号楼', status: 'pending', createdAt: Date.now() - 300000 },
    { id: 'ORD003', shop: '校门口水果店', item: '西瓜半个', contact: '13800003333', tip: 12, location: '北区宿舍2号楼', status: 'accepted', runnerName: '小王', createdAt: Date.now() - 900000 },
    { id: 'ORD004', shop: '图书馆咖啡吧', item: '拿铁 x2', contact: '13800004444', tip: 8, location: '图书馆', status: 'accepted', runnerName: '小李', createdAt: Date.now() - 1200000 },
    { id: 'ORD005', shop: '校医院药房', item: '创可贴 + 感冒药', contact: '13800005555', tip: 5, location: '南区宿舍1号楼', status: 'delivering', runnerName: '小张', createdAt: Date.now() - 1800000 },
    { id: 'ORD006', shop: '快递驿站', item: '快递包裹 x1', contact: '13800006666', tip: 8, location: '东区宿舍6号楼', status: 'delivering', runnerName: '小陈', createdAt: Date.now() - 2400000 },
    { id: 'ORD007', shop: '文具店', item: '笔记本 x2 + 笔', contact: '13800007777', tip: 5, location: '西区宿舍3号楼', status: 'completed', runnerName: '小王', createdAt: Date.now() - 3600000 },
    { id: 'ORD008', shop: '奶茶店', item: '珍珠奶茶 x3', contact: '13800008888', tip: 12, location: '北区宿舍7号楼', status: 'completed', runnerName: '小李', createdAt: Date.now() - 4200000 },
    { id: 'ORD009', shop: '打印店', item: '打印资料 x10页', contact: '13800009999', tip: 5, location: '图书馆', status: 'completed', runnerName: '小刘', createdAt: Date.now() - 5400000 },
    { id: 'ORD010', shop: '超市', item: '零食大礼包', contact: '13800001111', tip: 15, location: '东区宿舍3号楼', status: 'pending', createdAt: Date.now() - 60000 },
    { id: 'ORD011', shop: '水果捞', item: '水果捞大份', contact: '13800002222', tip: 8, location: '西区宿舍5号楼', status: 'pending', createdAt: Date.now() - 120000 }
  ];

  /* ---------- Runner Ratings ---------- */
  var runnerRatings = {
    '小王': { completed: 28, rating: 4.9 },
    '小李': { completed: 21, rating: 4.7 },
    '小张': { completed: 16, rating: 4.8 },
    '小陈': { completed: 12, rating: 4.6 },
    '小刘': { completed: 9, rating: 4.5 }
  };

  /* ---------- Orderer Ratings ---------- */
  var ordererRatings = {};

  /* ---------- Toast ---------- */
  function showToast(msg) {
    var container = document.getElementById('toast-container');
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(function() {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity .3s';
      setTimeout(function() {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 300);
    }, 2000);
  }

  /* ---------- Navigation ---------- */
  function goHome() {
    currentPage = 'home';
    document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
    document.getElementById('page-home').classList.add('active');
    _formFromHome = false;
  }

  function goOrderer() {
    currentPage = 'orderer';
    document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
    document.getElementById('page-orderer').classList.add('active');
    currentTab = 'all';
    updateTabs();
    render();
    updateTrackerCard();
    if (_formFromHome) {
      _formFromHome = false;
      setTimeout(function() { openForm(); }, 300);
    }
  }

  function goRunner() {
    currentPage = 'runner';
    document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
    document.getElementById('page-runner').classList.add('active');
    currentTab = 'pending';
    updateTabs();
    render();
  }

  /* ---------- Form ---------- */
  function openForm() {
    selectedTip = 5;
    document.querySelectorAll('#tip-options .tip-option').forEach(function(el) {
      el.classList.toggle('selected', el.getAttribute('data-tip') === '5');
    });
    document.getElementById('form-tip-custom').style.display = 'none';
    document.getElementById('form-tip-custom').value = '';
    document.getElementById('form-overlay').classList.add('active');
    lockScroll();
  }

  function closeForm() {
    document.getElementById('form-overlay').classList.remove('active');
    unlockScroll();
  }

  function selectTip(tip) {
    if (tip === 'custom') {
      selectedTip = 0;
      document.querySelectorAll('#tip-options .tip-option').forEach(function(el) {
        el.classList.toggle('selected', el.getAttribute('data-tip') === 'custom');
      });
      document.getElementById('form-tip-custom').style.display = 'block';
    } else {
      selectedTip = tip;
      document.querySelectorAll('#tip-options .tip-option').forEach(function(el) {
        el.classList.toggle('selected', parseInt(el.getAttribute('data-tip')) === tip);
      });
      document.getElementById('form-tip-custom').style.display = 'none';
    }
  }

  function validatePhone(phone) {
    return /^1[3-9]\d{9}$/.test(phone);
  }

  function submitOrder() {
    var shop = document.getElementById('form-shop').value.trim();
    var item = document.getElementById('form-item').value.trim();
    var contact = document.getElementById('form-contact').value.trim();
    var location = document.getElementById('form-location').value.trim();
    var tip = selectedTip;
    if (tip === 0) {
      tip = parseInt(document.getElementById('form-tip-custom').value) || 0;
    }
    if (!shop) { showToast('请输入店铺名称'); return; }
    if (!item) { showToast('请输入需要带什么'); return; }
    if (!validatePhone(contact)) { showToast('请输入有效的手机号码（11位）'); return; }
    if (!tip || tip <= 0) { showToast('请选择或输入酬劳金额'); return; }
    if (!location) { showToast('请输入送达地点'); return; }

    var order = {
      id: 'ORD' + String(orders.length + 1).padStart(3, '0'),
      shop: shop,
      item: item,
      contact: contact,
      tip: tip,
      location: location,
      status: 'pending',
      createdAt: Date.now()
    };
    orders.unshift(order);
    myContact = contact;
    currentTab = 'my';
    updateTabs();
    render();
    updateTrackerCard();
    closeForm();
    document.getElementById('form-shop').value = '';
    document.getElementById('form-item').value = '';
    document.getElementById('form-contact').value = '';
    document.getElementById('form-location').value = '';
    showToast('订单发布成功！');
  }

  /* ---------- Tabs ---------- */
  function switchTab(tab) {
    currentTab = tab;
    updateTabs();
    render();
  }

  function updateTabs() {
    document.querySelectorAll('#page-orderer .tab').forEach(function(t) {
      t.classList.toggle('active', t.getAttribute('data-tab') === currentTab);
    });
    document.querySelectorAll('#page-runner .tab').forEach(function(t) {
      t.classList.toggle('active', t.getAttribute('data-tab') === currentTab);
    });
  }

  /* ---------- Order Actions ---------- */
  function acceptOrder(orderId) {
    var order = orders.find(function(o) { return o.id === orderId; });
    if (!order || order.status !== 'pending') return;
    order.status = 'accepted';
    order.runnerName = '我';
    showToast('接单成功！');
    render();
    updateTrackerCard();
  }

  function startDelivery(orderId) {
    var order = orders.find(function(o) { return o.id === orderId; });
    if (!order || order.status !== 'accepted') return;
    order.status = 'delivering';
    showToast('已开始配送');
    render();
    updateTrackerCard();
  }

  function completeDelivery(orderId) {
    var order = orders.find(function(o) { return o.id === orderId; });
    if (!order || order.status !== 'delivering') return;
    order.status = 'completed';
    currentRatingOrderId = orderId;
    currentRatingRunnerName = order.runnerName;
    currentRatingOrdererContact = order.contact;
    showToast('配送完成！');
    render();
    updateTrackerCard();
    showRatingPopup(orderId, order.runnerName, order.contact);
  }

  function cancelOrder(orderId) {
    var order = orders.find(function(o) { return o.id === orderId; });
    if (!order || order.status !== 'pending') return;
    orders = orders.filter(function(o) { return o.id !== orderId; });
    showToast('订单已取消');
    render();
    updateTrackerCard();
  }

  /* ---------- Rating ---------- */
  function setRating(star) {
    selectedRating = star;
    document.querySelectorAll('#rating-stars .star').forEach(function(s, i) {
      s.classList.toggle('active', i < star);
    });
    document.getElementById('rating-text').textContent = star + '星评价';
    document.getElementById('submit-rating-btn').disabled = false;
  }

  function showRatingPopup(orderId, runnerName, ordererContact) {
    selectedRating = 0;
    document.querySelectorAll('#rating-stars .star').forEach(function(s) { s.classList.remove('active'); });
    document.getElementById('rating-text').textContent = '请选择评分';
    document.getElementById('submit-rating-btn').disabled = true;
    document.getElementById('rating-overlay').classList.add('active');
    lockScroll();
  }

  function submitRating() {
    if (selectedRating === 0) { showToast('请选择评分'); return; }
    document.getElementById('rating-overlay').classList.remove('active');
    unlockScroll();

    if (currentRatingRunnerName && runnerRatings[currentRatingRunnerName]) {
      var rr = runnerRatings[currentRatingRunnerName];
      rr.rating = ((rr.rating * rr.completed) + selectedRating) / (rr.completed + 1);
      rr.rating = Math.round(rr.rating * 10) / 10;
      rr.completed += 1;
    }

    showToast('评价成功！');

    // AI Review
    aiReviewRating(currentRatingRunnerName, currentRatingOrdererContact, selectedRating);

    // Show orderer rating popup
    currentOrdererRatingOrderId = currentRatingOrderId;
    currentOrdererRatingContact = currentRatingOrdererContact;
    setTimeout(function() {
      showOrdererRatingPopup();
    }, 1500);
  }

  function skipRating() {
    document.getElementById('rating-overlay').classList.remove('active');
    unlockScroll();
    currentOrdererRatingContact = currentRatingOrdererContact;
    setTimeout(function() {
      showOrdererRatingPopup();
    }, 500);
  }

  /* ---------- Orderer Rating ---------- */
  function setOrdererRating(star) {
    selectedOrdererRating = star;
    document.querySelectorAll('#orderer-rating-stars .star').forEach(function(s, i) {
      s.classList.toggle('active', i < star);
    });
    document.getElementById('orderer-rating-text').textContent = star + '星评价';
    document.getElementById('submit-orderer-rating-btn').disabled = false;
  }

  function showOrdererRatingPopup() {
    selectedOrdererRating = 0;
    document.querySelectorAll('#orderer-rating-stars .star').forEach(function(s) { s.classList.remove('active'); });
    document.getElementById('orderer-rating-text').textContent = '请选择评分';
    document.getElementById('submit-orderer-rating-btn').disabled = true;
    document.getElementById('orderer-rating-overlay').classList.add('active');
    lockScroll();
  }

  function submitOrdererRating() {
    if (selectedOrdererRating === 0) { showToast('请选择评分'); return; }
    document.getElementById('orderer-rating-overlay').classList.remove('active');
    unlockScroll();

    if (currentOrdererRatingContact) {
      var key = currentOrdererRatingContact;
      if (!ordererRatings[key]) {
        ordererRatings[key] = { completed: 0, rating: 4.0, ratings: [] };
      }
      var or = ordererRatings[key];
      or.ratings.push(selectedOrdererRating);
      or.completed += 1;
      var sum = or.ratings.reduce(function(a,b) { return a + b; }, 0);
      or.rating = Math.round((sum / or.ratings.length) * 10) / 10;
    }

    showToast('评价已提交');
  }

  function skipOrdererRating() {
    document.getElementById('orderer-rating-overlay').classList.remove('active');
    unlockScroll();
  }

  /* ---------- AI Review ---------- */
  function aiReviewRating(runnerName, ordererContact, rating) {
    var resultDiv = document.getElementById('ai-review-result');
    var detailDiv = document.getElementById('ai-review-detail');
    resultDiv.className = 'ai-review-result';
    resultDiv.textContent = '';
    detailDiv.textContent = '';

    var isFlagged = false;
    var detail = '';

    // Check if rating <= 2 and runner has history avg >= 4
    if (rating <= 2 && runnerRatings[runnerName] && runnerRatings[runnerName].rating >= 4) {
      isFlagged = true;
      detail += '检测到低分评价与跑腿同学历史表现不符，已标记为潜在恶意评价。\n';
    }

    // Check if orderer has submitted multiple low ratings to different runners
    if (ordererContact && ordererRatings[ordererContact]) {
      var or = ordererRatings[ordererContact];
      var lowRatings = or.ratings.filter(function(r) { return r <= 2; });
      if (lowRatings.length >= 2) {
        isFlagged = true;
        detail += '该下单者曾多次给出低分评价，已记录。\n';
      }
    }

    if (isFlagged) {
      resultDiv.className = 'ai-review-result flagged';
      resultDiv.textContent = '已标记为异常评价';
      detailDiv.textContent = detail || '系统已记录此评价，将进行人工复核。';
    } else {
      resultDiv.className = 'ai-review-result safe';
      resultDiv.textContent = '评价正常';
      detailDiv.textContent = '未发现异常评价行为，评价已正常记录。';
    }

    setTimeout(function() {
      document.getElementById('ai-review-overlay').classList.add('active');
      lockScroll();
    }, 500);
  }

  function closeAiReview() {
    document.getElementById('ai-review-overlay').classList.remove('active');
    unlockScroll();
  }

  /* ---------- Detail Overlay ---------- */
  function openDetail(orderId) {
    var order = orders.find(function(o) { return o.id === orderId; });
    if (!order) return;
    var statusMap = { pending: '待接单', accepted: '已接单', delivering: '配送中', completed: '已完成' };
    var html = '<div class="card" style="margin:0;">';
    html += '<div class="order-header"><span class="order-id">' + order.id + '</span><span class="status-badge ' + order.status + '">' + (statusMap[order.status] || order.status) + '</span></div>';
    html += '<div class="order-shop">' + order.shop + '</div>';
    html += '<div class="order-item">' + order.item + '</div>';
    html += '<div class="order-meta"><span>联系方式: ' + order.contact + '</span></div>';
    html += '<div class="order-meta"><span>送达地点: ' + order.location + '</span><span class="order-tip">' + order.tip + '元</span></div>';
    if (order.runnerName) {
      html += '<div class="runner-info" style="margin-top:8px;"><div class="runner-avatar">' + order.runnerName.charAt(0) + '</div><span>' + order.runnerName + '</span></div>';
    }
    html += '<div class="progress-steps">';
    html += '<div class="progress-step active"><div class="dot"></div><div class="line"></div><span class="step-label">待接单</span></div>';
    html += '<div class="progress-step' + (order.status !== 'pending' ? ' active' : '') + '"><div class="dot"></div><div class="line"></div><span class="step-label">已接单</span></div>';
    html += '<div class="progress-step' + (order.status === 'delivering' || order.status === 'completed' ? ' active' : '') + '"><div class="dot"></div><div class="line"></div><span class="step-label">配送中</span></div>';
    html += '<div class="progress-step' + (order.status === 'completed' ? ' active' : '') + '"><div class="dot"></div><span class="step-label">已完成</span></div>';
    html += '</div>';

    if (currentPage === 'runner' && order.status === 'accepted' && order.runnerName === '我') {
      html += '<div class="form-actions" style="margin-top:12px;"><button class="btn btn-primary btn-sm" onclick="startDelivery(\'' + order.id + '\');closeDetail();">开始配送</button></div>';
    }
    if (currentPage === 'runner' && order.status === 'delivering' && order.runnerName === '我') {
      html += '<div class="form-actions" style="margin-top:12px;"><button class="btn btn-primary btn-sm" onclick="completeDelivery(\'' + order.id + '\');closeDetail();">确认送达</button></div>';
    }
    if (currentPage === 'orderer' && order.status === 'pending') {
      html += '<div class="form-actions" style="margin-top:12px;"><button class="btn btn-secondary btn-sm" onclick="cancelOrder(\'' + order.id + '\');closeDetail();">取消订单</button></div>';
    }

    html += '</div>';
    document.getElementById('detail-content').innerHTML = html;
    document.getElementById('detail-overlay').classList.add('active');
    lockScroll();
  }

  function closeDetail() {
    document.getElementById('detail-overlay').classList.remove('active');
    unlockScroll();
  }

  /* ---------- Stats Detail ---------- */
  function openStatsDetail() {
    renderStatsDetail();
    document.getElementById('stats-overlay').classList.add('active');
    lockScroll();
  }

  function closeStatsDetail() {
    document.getElementById('stats-overlay').classList.remove('active');
    unlockScroll();
  }

  function renderStatsDetail() {
    var runnerName = '我';
    var myCompleted = orders.filter(function(o) {
      return o.status === 'completed' && o.runnerName === runnerName;
    });
    var myAccepted = orders.filter(function(o) {
      return o.status === 'accepted' && o.runnerName === runnerName;
    });
    var myDelivering = orders.filter(function(o) {
      return o.status === 'delivering' && o.runnerName === runnerName;
    });

    var html = '<div class="card" style="margin:0;">';
    html += '<div style="text-align:center;margin-bottom:12px;font-weight:600;">' + (runnerName || '我') + ' 的配送数据</div>';
    html += '<div style="display:flex;gap:10px;margin-bottom:12px;">';
    html += '<div class="stat-item"><div class="stat-num">' + myCompleted.length + '</div><div class="stat-label">已完成</div></div>';
    html += '<div class="stat-item"><div class="stat-num">' + myDelivering.length + '</div><div class="stat-label">配送中</div></div>';
    html += '<div class="stat-item"><div class="stat-num">' + myAccepted.length + '</div><div class="stat-label">已接单</div></div>';
    html += '</div>';
    if (runnerName && runnerRatings[runnerName]) {
      html += '<div style="text-align:center;font-size:.9rem;color:#666;">综合评分: <span style="color:#F9A825;font-weight:700;">' + runnerRatings[runnerName].rating + '</span> / 5.0 (' + runnerRatings[runnerName].completed + ' 单)</div>';
    }
    html += '</div>';
    document.getElementById('stats-content').innerHTML = html;
  }

  /* ---------- Tracker Card ---------- */
  function updateTrackerCard() {
    var trackerCard = document.getElementById('tracker-card');
    var body = document.getElementById('tracker-body');
    var title = document.getElementById('tracker-title');

    var myOrders = orders.filter(function(o) {
      return o.status !== 'completed' && o.status !== 'pending';
    });
    var latest = myOrders.sort(function(a,b) { return b.createdAt - a.createdAt; })[0];

    if (!latest) {
      trackerCard.style.display = 'none';
      return;
    }

    trackerCard.style.display = 'block';
    var statusMap = { accepted: '已接单', delivering: '配送中' };
    title.textContent = '订单追踪 - ' + (statusMap[latest.status] || latest.status);

    var html = '<div style="margin-bottom:8px;"><strong>' + latest.shop + '</strong> - ' + latest.item + '</div>';
    if (latest.runnerName) {
      html += '<div>跑腿同学: ' + latest.runnerName + '</div>';
    }
    html += '<div style="color:#888;font-size:.8rem;">送达: ' + latest.location + '</div>';

    html += '<div class="progress-steps">';
    html += '<div class="progress-step active"><div class="dot"></div><div class="line"></div><span class="step-label">待接单</span></div>';
    html += '<div class="progress-step' + (latest.status !== 'pending' ? ' active' : '') + '"><div class="dot"></div><div class="line"></div><span class="step-label">已接单</span></div>';
    html += '<div class="progress-step' + (latest.status === 'delivering' || latest.status === 'completed' ? ' active' : '') + '"><div class="dot"></div><div class="line"></div><span class="step-label">配送中</span></div>';
    html += '<div class="progress-step' + (latest.status === 'completed' ? ' active' : '') + '"><div class="dot"></div><span class="step-label">已完成</span></div>';
    html += '</div>';

    body.innerHTML = html;
  }

  /* ---------- Render ---------- */
  function render() {
    if (currentPage === 'orderer') {
      renderOrderer();
    } else if (currentPage === 'runner') {
      renderRunner();
    }
    updateStats();
  }

  function renderOrderer() {
    var container = document.getElementById('orderer-content');
    var empty = document.getElementById('orderer-empty');
    var filtered;

    if (currentTab === 'my') {
      var phone = myContact;
      filtered = orders.filter(function(o) { return o.contact === phone; });
    } else {
      filtered = orders.slice();
    }

    var badgeAll = document.getElementById('badge-all');
    var badgeMy = document.getElementById('badge-my');
    badgeAll.textContent = orders.length;
    var myCount = orders.filter(function(o) { return o.contact === myContact; }).length;
    badgeMy.textContent = myCount;

    if (filtered.length === 0) {
      container.innerHTML = '';
      empty.style.display = 'flex';
    } else {
      empty.style.display = 'none';
      var html = '';
      filtered.forEach(function(o) {
        html += renderOrderCard(o);
      });
      container.innerHTML = html;
    }
  }

  function renderRunner() {
    var container = document.getElementById('runner-content');
    var empty = document.getElementById('runner-empty');
    var filtered;

    if (currentTab === 'pending') {
      filtered = orders.filter(function(o) { return o.status === 'pending'; });
    } else if (currentTab === 'delivering') {
      filtered = orders.filter(function(o) {
        return (o.status === 'accepted' || o.status === 'delivering') && o.runnerName === '我';
      });
    } else {
      filtered = orders.slice();
    }

    var badgePending = document.getElementById('badge-pending');
    var badgeDelivering = document.getElementById('badge-delivering');
    badgePending.textContent = orders.filter(function(o) { return o.status === 'pending'; }).length;
    badgeDelivering.textContent = orders.filter(function(o) {
      return (o.status === 'accepted' || o.status === 'delivering') && o.runnerName === '我';
    }).length;

    if (filtered.length === 0) {
      container.innerHTML = '';
      empty.style.display = 'flex';
    } else {
      empty.style.display = 'none';
      var html = '';
      filtered.forEach(function(o) {
        html += renderOrderCard(o);
      });
      container.innerHTML = html;
    }
  }

  function renderOrderCard(o) {
    var statusMap = { pending: '待接单', accepted: '已接单', delivering: '配送中', completed: '已完成' };
    var html = '<div class="order-card" onclick="openDetail(\'' + o.id + '\')">';
    html += '<div class="order-header"><span class="order-id">' + o.id + '</span><span class="status-badge ' + o.status + '">' + (statusMap[o.status] || o.status) + '</span></div>';
    html += '<div class="order-shop">' + o.shop + '</div>';
    html += '<div class="order-item">' + o.item + '</div>';
    html += '<div class="order-meta"><span>' + o.location + '</span><span class="order-tip">' + o.tip + '元</span></div>';

    if (o.runnerName) {
      html += '<div class="runner-info" style="margin-top:6px;"><div class="runner-avatar">' + o.runnerName.charAt(0) + '</div><span>' + o.runnerName + '</span></div>';
    }

    if (currentPage === 'runner' && o.status === 'pending') {
      html += '<div style="margin-top:10px;text-align:right;"><button class="btn btn-primary btn-sm" onclick="event.stopPropagation();acceptOrder(\'' + o.id + '\')">接单</button></div>';
    }

    html += '</div>';
    return html;
  }

  function updateStats() {
    var pendingCount = orders.filter(function(o) { return o.status === 'pending'; }).length;
    var deliveringCount = orders.filter(function(o) { return o.status === 'delivering'; }).length;
    var completedCount = orders.filter(function(o) { return o.status === 'completed'; }).length;
    var myDelivering = orders.filter(function(o) {
      return (o.status === 'accepted' || o.status === 'delivering') && o.runnerName === '我';
    }).length;

    var statPending = document.getElementById('stat-pending');
    var statDelivering = document.getElementById('stat-delivering');
    var statCompleted = document.getElementById('stat-completed');
    if (statPending) statPending.textContent = pendingCount;
    if (statDelivering) statDelivering.textContent = myDelivering;
    if (statCompleted) statCompleted.textContent = completedCount;
  }

  /* ---------- Scroll Lock ---------- */
  function lockScroll() {
    document.body.style.overflow = 'hidden';
  }

  function unlockScroll() {
    document.body.style.overflow = '';
  }

  /* ---------- Polling Timer ---------- */
  setInterval(function() {
    var changed = false;
    orders.forEach(function(o) {
      if (o.status === 'pending' && Math.random() < 0.05) {
        var runners = ['小王', '小李', '小张', '小陈', '小刘'];
        o.status = 'accepted';
        o.runnerName = runners[Math.floor(Math.random() * runners.length)];
        changed = true;
      } else if (o.status === 'accepted' && Math.random() < 0.05) {
        o.status = 'delivering';
        changed = true;
      } else if (o.status === 'delivering' && Math.random() < 0.05) {
        o.status = 'completed';
        changed = true;
      }
    });
    if (changed) {
      render();
      updateTrackerCard();
    }
  }, 3000);

  /* ---------- Touch Event Prevention ---------- */
  document.querySelectorAll('.overlay').forEach(function(overlay) {
    overlay.addEventListener('touchmove', function(e) {
      e.stopPropagation();
    }, { passive: false });
  });

  /* ---------- Overlay Click-outside Close ---------- */
  document.querySelectorAll('.overlay').forEach(function(overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) {
        overlay.classList.remove('active');
        unlockScroll();
      }
    });
  });

  /* ---------- Global Exposure ---------- */
  window.$ = function(sel) { return document.querySelector(sel); };
  window.showToast = showToast;
  window.orders = orders;
  window.render = render;
  window.lockScroll = lockScroll;
  window.unlockScroll = unlockScroll;
  window.runnerRatings = runnerRatings;
  window.goHome = goHome;
  window.goOrderer = goOrderer;
  window.goRunner = goRunner;
  window.openForm = openForm;
  window.closeForm = closeForm;
  window.selectTip = selectTip;
  window.submitOrder = submitOrder;
  window.switchTab = switchTab;
  window.acceptOrder = acceptOrder;
  window.startDelivery = startDelivery;
  window.completeDelivery = completeDelivery;
  window.cancelOrder = cancelOrder;
  window.openDetail = openDetail;
  window.closeDetail = closeDetail;
  window.openStatsDetail = openStatsDetail;
  window.closeStatsDetail = closeStatsDetail;
  window.setRating = setRating;
  window.submitRating = submitRating;
  window.skipRating = skipRating;
  window.setOrdererRating = setOrdererRating;
  window.submitOrdererRating = submitOrdererRating;
  window.skipOrdererRating = skipOrdererRating;
  window.closeAiReview = closeAiReview;
  window.updateTrackerCard = updateTrackerCard;

})(); /* END IIFE 1 */

/* ==================== SECOND IIFE: MAP ==================== */
(function() {
  'use strict';

  // === Leaflet CDN fallback guard ===
  if (!window.L) {
    window.openMap = function() { window.showToast && window.showToast('地图服务暂不可用，请检查网络'); };
    window.closeMap = function() {};
    window.initMap = function() {};
    window.startDeliveryFromMap = function() {};
    window.completeDeliveryFromMap = function() {};
    return;
  }

  var map = null;
  var currentMapOrderId = null;
  var currentMapPhase = null;
  var riderMarker = null;
  var pickupMarker = null;
  var dropoffMarker = null;
  var animationTimer = null;

  var campusCenter = [39.9042, 116.4074];
  var pickupPoint = [39.9065, 116.4050];
  var dormPoints = {
    '东区宿舍': [39.9080, 116.4090],
    '西区宿舍': [39.9030, 116.4040],
    '南区宿舍': [39.9010, 116.4070],
    '北区宿舍': [39.9070, 116.4060],
    '图书馆': [39.9050, 116.4080]
  };

  function initMap(cb) {
    if (typeof L === 'undefined') {
      setTimeout(function() { initMap(cb); }, 200);
      return;
    }
    doLeaflet(cb);
  }

  function doLeaflet(cb) {
    if (map) {
      map.invalidateSize();
      if (cb) cb();
      return;
    }
    var mapView = document.getElementById('map-view');
    if (!mapView) return;
    map = L.map('map-view', {
      center: campusCenter,
      zoom: 15,
      zoomControl: false,
      attributionControl: false
    });
    loadTileLayer();
    setTimeout(function() {
      map.invalidateSize();
      if (cb) cb();
    }, 300);
  }

  function loadTileLayer() {
    if (!map) return;
    try {
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
      }).addTo(map);
    } catch(e) {
      try {
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19
        }).addTo(map);
      } catch(e2) {
        try {
          L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
            maxZoom: 19
          }).addTo(map);
        } catch(e3) {}
      }
    }
  }

  function openMap(orderId, phase) {
    currentMapOrderId = orderId;
    currentMapPhase = phase || 'view';
    document.getElementById('map-overlay').classList.add('active');
    lockScroll();

    var order = window.orders.find(function(o) { return o.id === orderId; });
    document.getElementById('map-title').textContent = order ? '配送: ' + order.shop : '配送地图';

    initMap(function() {
      updateMapInfoCard(order);
      addMarkers(order ? order.location : null);
      if (phase === 'delivering' && order && order.status === 'delivering') {
        var loc = dormPoints[order.location] || pickupPoint;
        startRiderAnimation(loc, 800, 3);
      }
    });
  }

  function updateMapInfoCard(order) {
    if (!order) return;
    var etaRow = document.getElementById('map-eta-row');
    var etaTime = document.getElementById('map-eta-time');
    var routeSteps = document.getElementById('map-route-steps');
    var actionBtns = document.getElementById('map-action-btns');
    var btnStart = document.getElementById('map-btn-start');
    var btnComplete = document.getElementById('map-btn-complete');

    etaTime.textContent = '约 5 分钟';
    routeSteps.textContent = '取货点: 校园中心 → 送达: ' + (order.location || '--');

    if (order.status === 'accepted' && order.runnerName === '我') {
      btnStart.style.display = '';
      btnComplete.style.display = 'none';
    } else if (order.status === 'delivering' && order.runnerName === runnerName) {
      btnStart.style.display = 'none';
      btnComplete.style.display = '';
    } else {
      btnStart.style.display = 'none';
      btnComplete.style.display = 'none';
    }
  }

  function addMarkers(orderLocation) {
    if (!map) return;
    if (pickupMarker) map.removeLayer(pickupMarker);
    if (dropoffMarker) map.removeLayer(dropoffMarker);
    if (riderMarker) map.removeLayer(riderMarker);

    var pickupIcon = L.divIcon({
      className: 'custom-marker',
      html: '<div style="background:#4CAF50;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.3);"></div>',
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });

    var dropoffIcon = L.divIcon({
      className: 'custom-marker',
      html: '<div style="background:#F44336;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.3);"></div>',
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });

    pickupMarker = L.marker(pickupPoint, { icon: pickupIcon }).addTo(map);
    pickupMarker.bindPopup('取货点').openPopup();

    var dropLoc = dormPoints[orderLocation] || pickupPoint;
    dropoffMarker = L.marker(dropLoc, { icon: dropoffIcon }).addTo(map);
    dropoffMarker.bindPopup(orderLocation || '送达点').openPopup();

    var bounds = L.latLngBounds([pickupPoint, dropLoc]);
    map.fitBounds(bounds, { padding: [50, 50] });
  }

  function startRiderAnimation(target, dist, durationMin) {
    if (!map) return;
    if (animationTimer) clearInterval(animationTimer);

    var riderIcon = L.divIcon({
      className: 'custom-marker',
      html: '<div style="background:#FFC107;width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 10px rgba(255,193,7,.6);animation:dotPulse 1.5s infinite;"></div>',
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });

    if (riderMarker) map.removeLayer(riderMarker);
    riderMarker = L.marker(pickupPoint, { icon: riderIcon }).addTo(map);

    var start = pickupPoint;
    var end = target;
    var steps = 60;
    var step = 0;
    var stepDuration = (durationMin * 60 * 1000) / steps;

    animationTimer = setInterval(function() {
      step++;
      if (step > steps) {
        clearInterval(animationTimer);
        animationTimer = null;
        return;
      }
      var frac = step / steps;
      var lat = start[0] + (end[0] - start[0]) * frac;
      var lng = start[1] + (end[1] - start[1]) * frac;
      if (riderMarker) {
        riderMarker.setLatLng([lat, lng]);
      }
    }, stepDuration);
  }

  function startDeliveryFromMap() {
    if (currentMapOrderId) {
      window.startDelivery(currentMapOrderId);
      var order = window.orders.find(function(o) { return o.id === currentMapOrderId; });
      if (order) {
        updateMapInfoCard(order);
        var loc = dormPoints[order.location] || pickupPoint;
        startRiderAnimation(loc, 800, 3);
      }
    }
  }

  function completeDeliveryFromMap() {
    if (currentMapOrderId) {
      window.completeDelivery(currentMapOrderId);
      closeMap();
    }
  }

  function closeMap() {
    if (animationTimer) {
      clearInterval(animationTimer);
      animationTimer = null;
    }
    document.getElementById('map-overlay').classList.remove('active');
    unlockScroll();
  }

  /* ---------- Global Exposure ---------- */
  window.openMap = openMap;
  window.closeMap = closeMap;
  window.startDeliveryFromMap = startDeliveryFromMap;
  window.completeDeliveryFromMap = completeDeliveryFromMap;
  window.initMap = initMap;

})(); /* END IIFE 2 */
</script>
</body>
</html>
