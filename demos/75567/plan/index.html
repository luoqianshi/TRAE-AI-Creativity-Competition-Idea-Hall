<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃点啥</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i data-lucide="chef-hat" class="logo-icon"></i>
                    <h1 class="title">今天吃点啥</h1>
                </div>
                <div class="search-box">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" id="searchInput" placeholder="搜索食材，如：土豆、鸡蛋..." class="search-input">
                </div>
            </div>
        </header>

        <section class="random-section">
            <div class="random-card">
                <div class="random-header">
                    <h2>今天吃什么？</h2>
                    <p class="subtitle">选择食材，点击按钮随机搭配午餐</p>
                </div>
                <div class="ingredients-tags">
                    <span class="tags-label">想吃什么食材？</span>
                    <div id="ingredientsTags" class="tags-container">
                    </div>
                </div>
                <button id="randomBtn" class="random-btn">
                    <i data-lucide="shuffle"></i>
                    随机抽取
                </button>
                <div id="randomResult" class="random-result">
                    <div class="result-label">推荐午餐</div>
                    <div class="result-items">
                        <div id="meatResult" class="result-item meat">
                            <span class="category-badge">荤</span>
                            <span class="dish-name">--</span>
                            <div class="dish-ingredients">食材：--</div>
                            <div class="dish-description">做法：--</div>
                        </div>
                        <div class="plus-sign">+</div>
                        <div id="vegResult" class="result-item veg">
                            <span class="category-badge">素</span>
                            <span class="dish-name">--</span>
                            <div class="dish-ingredients">食材：--</div>
                            <div class="dish-description">做法：--</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="recipes-section">
            <div class="section-header">
                <h2>我的菜谱库</h2>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="meat">荤菜</button>
                    <button class="filter-btn" data-filter="vegetable">素菜</button>
                </div>
                <button id="addBtn" class="add-btn">
                    <i data-lucide="plus"></i>
                    添加菜谱
                </button>
                <button id="randomFromFilterBtn" class="random-filter-btn">
                    <i data-lucide="shuffle"></i>
                    从筛选中抽取
                </button>
                <button id="resetBtn" class="reset-btn" title="重置为预置数据">
                    <i data-lucide="refresh-cw"></i>
                    重置数据
                </button>
            </div>
            <div id="recipesGrid" class="recipes-grid">
            </div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <i data-lucide="utensils"></i>
                <p>还没有菜谱，快去添加吧！</p>
            </div>
        </section>

        <footer class="footer">
            <p>今天吃点啥 - 记录美好生活</p>
        </footer>
    </div>

    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加菜谱</h3>
                <button id="closeModal" class="close-btn">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <form id="recipeForm">
                <input type="hidden" id="recipeId">
                <div class="form-group">
                    <label>菜名</label>
                    <input type="text" id="recipeName" required placeholder="请输入菜名">
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="category" value="meat" checked>
                            <span>荤菜</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="category" value="vegetable">
                            <span>素菜</span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>食材</label>
                    <input type="text" id="recipeIngredients" required placeholder="请输入食材，用逗号分隔">
                </div>
                <div class="form-group">
                    <label>做法</label>
                    <textarea id="recipeDescription" required placeholder="请输入做法描述" rows="4"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" id="cancelBtn" class="cancel-btn">取消</button>
                    <button type="submit" class="submit-btn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="detailTitle">菜谱详情</h3>
                <button id="closeDetail" class="close-btn">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div id="detailContent" class="detail-content">
                <div class="detail-category">
                    <span id="detailCategoryBadge" class="category-badge">荤</span>
                </div>
                <h2 id="detailName" class="detail-name"></h2>
                <div class="detail-section">
                    <h4><i data-lucide="shopping-basket"></i> 食材</h4>
                    <p id="detailIngredients"></p>
                </div>
                <div class="detail-section">
                    <h4><i data-lucide="book-open"></i> 做法</h4>
                    <p id="detailDescription"></p>
                </div>
                <div class="detail-actions">
                    <button id="editDetailBtn" class="edit-btn">
                        <i data-lucide="edit"></i>
                        编辑
                    </button>
                    <button id="deleteDetailBtn" class="delete-btn">
                        <i data-lucide="trash-2"></i>
                        删除
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
