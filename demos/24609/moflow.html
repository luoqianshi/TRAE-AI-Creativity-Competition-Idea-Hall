<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨画心流 (MoFlow) —— 创意提案展示页</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f0ea;
            font-family: "Microsoft YaHei", "SimSun", sans-serif;
            color: #2c2c2c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 900px;
            background: #fbf9f5;
            border: 1px solid #dcd3c1;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            border-radius: 8px;
            padding: 30px;
            box-sizing: border-box;
        }
        header {
            text-align: center;
            border-bottom: 1px double #dcd3c1;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            font-size: 26px;
            color: #3e3223;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 14px;
            color: #7e7361;
            margin-top: 8px;
        }
        .intro-box {
            background-color: #f7f3eb;
            border-left: 4px solid #8c7e6b;
            padding: 12px 20px;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .workspace {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .canvas-container {
            position: relative;
            background: #faf8f5;
            border: 1px solid #e5dfd5;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
            border-radius: 4px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 350px;
            cursor: crosshair;
        }
        .canvas-tip {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 13px;
            color: #9e9381;
            pointer-events: none;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            background-color: #8c7e6b;
            color: #fff;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #736654;
        }
        .btn-secondary {
            background-color: transparent;
            color: #8c7e6b;
            border: 1px solid #8c7e6b;
        }
        .btn-secondary:hover {
            background-color: #f4f0ea;
        }
        .speed-monitor {
            font-size: 12px;
            color: #9e9381;
        }
        /* 结果展示弹窗 */
        .result-modal {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f0ebe1;
            border: 1px solid #dcd3c1;
            border-radius: 4px;
            animation: fadeIn 0.5s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-title {
            font-size: 18px;
            color: #3e3223;
            margin-bottom: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .result-left {
            font-size: 14px;
            line-height: 1.8;
            color: #4a4031;
        }
        .result-right {
            border: 1px solid #dcd3c1;
            background: #faf8f5;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            height: 180px;
        }
        .art-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
        }
        .art-tag {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(255,255,255,0.8);
            padding: 4px 8px;
            font-size: 11px;
            color: #8c7e6b;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>墨画心流 (MoFlow)</h1>
        <div class="subtitle">—— 基于笔迹动力学与生成式人工智能的青少年正念情绪宣泄空间</div>
    </header>

    <div class="intro-box">
        <strong>💡 大赛提案原型演示：</strong>
        这是一个专门为 TRAE AI 创造力大赛制作的交互演示页面。请在下方的“宣纸画布”上用鼠标或手指随意书写或涂鸦。系统后台会分析您的笔尖动力学特征（如书写速度与突变），在您点击“我写完了”后，为您生成结合古代经典古籍名言的专属心流反馈与水墨意境。
    </div>

    <div class="workspace">
        <div class="canvas-container">
            <div class="canvas-tip" id="canvasTip">请在此处肆意书写或涂鸦，宣泄内心的波澜...</div>
            <canvas id="paintCanvas"></canvas>
        </div>

        <div class="controls">
            <div class="speed-monitor" id="speedMonitor">实时书写状态: 静止</div>
            <div>
                <button class="btn btn-secondary" id="clearBtn">清除重写</button>
                <button class="btn" id="submitBtn">我写完了</button>
            </div>
        </div>
    </div>

    <!-- 结果疗愈展示区 -->
    <div class="result-modal" id="resultModal">
        <div class="result-title">🏮 心流重构完成</div>
        <div class="result-content">
            <div class="result-left">
                <p id="evaluationText">正在分析笔画特征中...</p>
            </div>
            <div class="result-right">
                <!-- 模拟由大模型及图像生成模型重构的水墨山水意境 -->
                <svg width="100%" height="100%" viewBox="0 0 400 180" style="background:#f4ece1;">
                    <path d="M 0 140 Q 100 80 200 130 T 400 110 L 400 180 L 0 180 Z" fill="#8a8377" opacity="0.3"/>
                    <path d="M 0 160 Q 150 110 300 150 T 400 140 L 400 180 L 0 180 Z" fill="#5c564c" opacity="0.5"/>
                    <circle cx="300" cy="60" r="18" fill="#d9c5b2" opacity="0.7"/>
                    <text x="30" y="50" font-family="KaiTi, SimSun" font-size="14" fill="#3a342c" letter-spacing="2">回首向来萧瑟处</text>
                    <text x="50" y="75" font-family="KaiTi, SimSun" font-size="14" fill="#3a342c" letter-spacing="2">归去也无风雨也无晴</text>
                </svg>
                <div class="art-tag">AI 意境重构</div>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const tip = document.getElementById('canvasTip');
    const speedMonitor = document.getElementById('speedMonitor');
    const resultModal = document.getElementById('resultModal');
    const evaluationText = document.getElementById('evaluationText');

    // 动态适配画布大小
    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = 350;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#2c2c2c';
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let drawing = false;
    let lastX = 0;
    let lastY = 0;
    let lastTime = 0;
    let speeds = []; // 存储书写速度，用以计算情绪特征

    // 绘制与动力学捕获
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        startDrawing({ clientX: touch.clientX, clientY: touch.clientY });
    });
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        draw({ clientX: touch.clientX, clientY: touch.clientY });
    });
    canvas.addEventListener('touchend', stopDrawing);

    function startDrawing(e) {
        drawing = true;
        tip.style.display = 'none';
        const rect = canvas.getBoundingClientRect();
        lastX = e.clientX - rect.left;
        lastY = e.clientY - rect.top;
        lastTime = Date.now();
    }

    function draw(e) {
        if (!drawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const currentTime = Date.now();

        const distance = Math.sqrt(Math.pow(x - lastX, 2) + Math.pow(y - lastY, 2));
        const timeDiff = currentTime - lastTime;

        let currentSpeed = 0;
        if (timeDiff > 0) {
            currentSpeed = distance / (timeDiff / 1000); // 像素每秒
            speeds.push(currentSpeed);
        }

        // 模拟笔触粗细变化（墨迹效果）：书写越慢，墨迹越粗（浸润效果）
        const brushWidth = Math.max(2, Math.min(12, 150 / (currentSpeed + 5)));
        ctx.lineWidth = brushWidth;

        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();

        // 更新状态监测
        if (currentSpeed > 300) {
            speedMonitor.innerText = `实时书写状态: 急促而用力 (速度: ${Math.round(currentSpeed)}px/s)`;
            speedMonitor.style.color = '#a94442';
        } else {
            speedMonitor.innerText = `实时书写状态: 缓和而连贯 (速度: ${Math.round(currentSpeed)}px/s)`;
            speedMonitor.style.color = '#3c763d';
        }

        lastX = x;
        lastY = y;
        lastTime = currentTime;
    }

    function stopDrawing() {
        drawing = false;
    }

    // 清除画布
    document.getElementById('clearBtn').addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        tip.style.display = 'block';
        speedMonitor.innerText = '实时书写状态: 静止';
        speedMonitor.style.color = '#9e9381';
        resultModal.style.display = 'none';
        speeds = [];
    });

    // 我写完了（模拟评估及大模型反馈）
    document.getElementById('submitBtn').addEventListener('click', () => {
        if (speeds.length === 0) {
            alert('请先在画布上随意写字或画画哦！');
            return;
        }

        const avgSpeed = speeds.reduce((a, b) => a + b, 0) / speeds.length;
        let emotion = '平静';
        let diagnosis = '';

        if (avgSpeed > 250) {
            emotion = '急躁';
            diagnosis = '从您刚才快速、连贯且富有冲击力的笔迹中，系统捕捉到了一丝急躁、甚至想要极力倾诉和突破重围的情绪。这很正常，当压力积攒到一定程度，我们的身体本能就会想要通过大开大合的动作去宣泄。';
        } else if (avgSpeed < 70) {
            emotion = '迟滞';
            diagnosis = '您的笔触柔缓、沉重，时而有所停滞。系统感受到了您心底的一丝疲惫与落寞。此时的你，或许只想找一个安静的港湾停靠，不再理会外界的纷扰。';
        } else {
            emotion = '宁静';
            diagnosis = '您的笔画流畅、徐疾有度，速度十分均匀。这表明您的内心在书写中逐渐找到了平静的节奏，情绪状态正如雨后初晴般舒展和舒缓。';
        }

        let dynamicText = `
            <strong>笔迹动力学分析结果：【${emotion}心境】</strong><br/><br/>
            ${diagnosis}<br/><br/>
            <strong>先贤古籍寄语：</strong><br/>
            面对逆境与困顿，先贤苏轼在《定风波》中写道：<em>“回首向来萧瑟处，归去，也无风雨也无晴”</em>。
            无论是倾盆风雨，还是艳阳高照，在宏大的生命旅程中，都只是风景的一部分。
            深吸一口气，让笔尖的水墨融入这温润的画卷，你所经历的波折，终将化为你生命深处的旷达与坚韧。
        `;

        evaluationText.innerHTML = dynamicText;
        resultModal.style.display = 'block';
        resultModal.scrollIntoView({ behavior: 'smooth' });
    });
</script>

</body>
</html>
