<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知文AI - 论文全流程智能辅助系统 (可运行Demo)</title>
  <style>
/* ============================================
   知文AI - 论文全流程智能辅助系统 样式表
   ============================================ */
:root {
  --color-primary: #0d9488;
  --color-primary-light: #14b8a6;
  --color-primary-dark: #0f766e;
  --color-secondary: #1a365d;
  --color-secondary-light: #2d4a7a;
  --color-bg: #f8f9fb;
  --color-card: #ffffff;
  --color-text: #1a2332;
  --color-text-secondary: #5a6a7e;
  --color-text-light: #8a9ab0;
  --color-border: #e2e8f0;
  --color-border-light: #f0f2f5;
  --color-hover: #f1f5f9;
  --color-danger: #ef4444;
  --color-warning: #f59e0b;
  --color-success: #10b981;
  --color-ai-bubble: #f0f4f8;
  --color-user-bubble: #0d9488;
  --color-user-bubble-text: #ffffff;
  --sidebar-left-width: 260px;
  --sidebar-right-width: 340px;
  --topbar-height: 56px;
  --bottombar-height: 36px;
  --radius: 8px;
  --radius-sm: 4px;
  --radius-lg: 12px;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Consolas", monospace;
  --transition: all 0.2s ease;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{font-size:14px;scroll-behavior:smooth;}
body{font-family:var(--font-stack);color:var(--color-text);background:var(--color-bg);line-height:1.6;overflow:hidden;height:100vh;}
a{color:var(--color-primary);text-decoration:none;}
button{font-family:var(--font-stack);cursor:pointer;border:none;outline:none;}
input,textarea{font-family:var(--font-stack);outline:none;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#c1c9d4;border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#a0aab6;}
.topbar{height:var(--topbar-height);background:var(--color-card);border-bottom:1px solid var(--color-border);display:flex;align-items:center;padding:0 20px;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:var(--shadow-sm);}
.topbar-logo{display:flex;align-items:center;gap:10px;margin-right:32px;}
.topbar-logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--color-primary),var(--color-primary-light));border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:14px;}
.topbar-logo-text{font-size:16px;font-weight:700;color:var(--color-secondary);letter-spacing:0.5px;}
.topbar-modules{display:flex;gap:4px;flex:1;}
.topbar-module-btn{padding:6px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;color:var(--color-text-secondary);background:transparent;transition:var(--transition);}
.topbar-module-btn:hover{background:var(--color-hover);color:var(--color-text);}
.topbar-module-btn.active{background:var(--color-primary);color:white;}
.topbar-user{display:flex;align-items:center;gap:8px;margin-left:auto;}
.topbar-user-name{font-size:13px;color:var(--color-text-secondary);}
.topbar-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--color-primary),var(--color-secondary));display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:600;}
.main-layout{display:flex;height:calc(100vh - var(--topbar-height) - var(--bottombar-height));margin-top:var(--topbar-height);}
.sidebar-left{width:var(--sidebar-left-width);min-width:var(--sidebar-left-width);background:var(--color-card);border-right:1px solid var(--color-border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-left-header{padding:16px;border-bottom:1px solid var(--color-border-light);display:flex;align-items:center;justify-content:space-between;}
.sidebar-left-title{font-size:13px;font-weight:600;color:var(--color-text);}
.sidebar-left-toggle-all{font-size:12px;color:var(--color-primary);cursor:pointer;background:none;padding:2px 6px;border-radius:var(--radius-sm);transition:var(--transition);}
.sidebar-left-toggle-all:hover{background:rgba(13,148,136,0.1);}
.outline-tree{flex:1;overflow-y:auto;padding:8px 0;}
.outline-node{user-select:none;}
.outline-node-header{display:flex;align-items:center;padding:7px 16px;cursor:pointer;transition:var(--transition);gap:6px;border-left:3px solid transparent;}
.outline-node-header:hover{background:var(--color-hover);}
.outline-node-header.active{background:rgba(13,148,136,0.08);border-left-color:var(--color-primary);}
.outline-node-header.active .outline-node-label{color:var(--color-primary);font-weight:600;}
.outline-toggle{width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--color-text-light);transition:transform 0.2s ease;flex-shrink:0;}
.outline-toggle.expanded{transform:rotate(90deg);}
.outline-toggle-placeholder{width:16px;flex-shrink:0;}
.outline-node-icon{font-size:12px;flex-shrink:0;width:16px;text-align:center;}
.outline-node-label{font-size:13px;color:var(--color-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.outline-node-label.level-0{font-weight:600;font-size:13px;}
.outline-node-label.level-1{font-size:12.5px;color:var(--color-text-secondary);}
.outline-children{overflow:hidden;transition:max-height 0.3s ease;}
.outline-children.collapsed{max-height:0!important;}
.editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--color-bg);}
.editor-toolbar{display:flex;align-items:center;padding:8px 16px;background:var(--color-card);border-bottom:1px solid var(--color-border);gap:2px;flex-wrap:wrap;flex-shrink:0;}
.toolbar-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);color:var(--color-text-secondary);background:transparent;transition:var(--transition);font-size:13px;font-weight:600;}
.toolbar-btn:hover{background:var(--color-hover);color:var(--color-text);}
.toolbar-btn.active{background:rgba(13,148,136,0.15);color:var(--color-primary);}
.toolbar-separator{width:1px;height:20px;background:var(--color-border);margin:0 6px;}
.toolbar-btn-text{padding:0 10px;width:auto;font-size:12px;font-weight:500;gap:4px;display:flex;align-items:center;}
.toolbar-btn-text.ai-btn{color:var(--color-primary);}
.toolbar-btn-text.ai-btn:hover{background:rgba(13,148,136,0.1);}
.editor-content{flex:1;overflow-y:auto;padding:40px 60px;background:var(--color-card);margin:16px;border-radius:var(--radius);box-shadow:var(--shadow);outline:none;min-height:300px;font-size:14px;line-height:1.8;color:var(--color-text);caret-color:var(--color-primary);}
.editor-content:empty::before{content:"在此处开始编辑论文...";color:var(--color-text-light);}
.editor-content h1{font-size:20px;font-weight:700;color:var(--color-secondary);margin:24px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--color-primary);}
.editor-content h2{font-size:17px;font-weight:600;color:var(--color-text);margin:20px 0 10px;}
.editor-content h3{font-size:15px;font-weight:600;color:var(--color-text);margin:16px 0 8px;}
.editor-content p{margin:8px 0;text-indent:2em;}
.editor-content blockquote{margin:12px 0;padding:12px 16px;background:var(--color-bg);border-left:4px solid var(--color-primary);border-radius:0 var(--radius-sm) var(--radius-sm) 0;color:var(--color-text-secondary);font-style:italic;}
.editor-content ul,.editor-content ol{margin:8px 0 8px 2em;}
.editor-content li{margin:4px 0;}
.editor-content .citation-marker{color:var(--color-primary);font-size:12px;vertical-align:super;cursor:pointer;padding:0 2px;border-radius:2px;transition:var(--transition);}
.editor-content .citation-marker:hover{background:rgba(13,148,136,0.15);}
.sidebar-right{width:var(--sidebar-right-width);min-width:var(--sidebar-right-width);background:var(--color-card);border-left:1px solid var(--color-border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-right-tabs{display:flex;border-bottom:1px solid var(--color-border);flex-shrink:0;}
.sidebar-right-tab{flex:1;padding:12px;text-align:center;font-size:13px;font-weight:500;color:var(--color-text-secondary);background:transparent;transition:var(--transition);position:relative;}
.sidebar-right-tab:hover{color:var(--color-text);background:var(--color-hover);}
.sidebar-right-tab.active{color:var(--color-primary);}
.sidebar-right-tab.active::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--color-primary);}
.ai-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.ai-panel.hidden{display:none;}
.ai-quick-questions{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px;border-bottom:1px solid var(--color-border-light);flex-shrink:0;}
.ai-quick-btn{padding:5px 12px;border-radius:16px;font-size:12px;color:var(--color-primary);background:rgba(13,148,136,0.08);border:1px solid rgba(13,148,136,0.2);transition:var(--transition);}
.ai-quick-btn:hover{background:rgba(13,148,136,0.15);border-color:var(--color-primary);}
.ai-chat-area{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;}
.ai-message{display:flex;gap:8px;max-width:95%;}
.ai-message.user{align-self:flex-end;flex-direction:row-reverse;}
.ai-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
.ai-message.ai .ai-avatar{background:linear-gradient(135deg,var(--color-primary),var(--color-primary-light));color:white;}
.ai-message.user .ai-avatar{background:linear-gradient(135deg,var(--color-secondary),var(--color-secondary-light));color:white;}
.ai-bubble{padding:10px 14px;border-radius:var(--radius);font-size:13px;line-height:1.6;}
.ai-message.ai .ai-bubble{background:var(--color-ai-bubble);color:var(--color-text);}
.ai-message.user .ai-bubble{background:var(--color-user-bubble);color:var(--color-user-bubble-text);}
.ai-suggestion-actions{display:flex;gap:8px;margin-top:8px;}
.ai-action-btn{padding:4px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;transition:var(--transition);}
.ai-action-btn.accept{background:var(--color-primary);color:white;}
.ai-action-btn.accept:hover{background:var(--color-primary-dark);}
.ai-action-btn.reject{background:var(--color-border);color:var(--color-text-secondary);}
.ai-action-btn.reject:hover{background:#dde2e9;}
.ai-action-btn.regenerate{background:rgba(13,148,136,0.1);color:var(--color-primary);border:1px solid rgba(13,148,136,0.3);}
.ai-action-btn.regenerate:hover{background:rgba(13,148,136,0.2);}
.typing-cursor{display:inline-block;width:2px;height:14px;background:var(--color-primary);margin-left:2px;vertical-align:middle;animation:blink 0.8s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
.ref-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.ref-panel.hidden{display:none;}
.ref-search{padding:12px 14px;border-bottom:1px solid var(--color-border-light);flex-shrink:0;}
.ref-search-input{width:100%;padding:8px 12px;border:1px solid var(--color-border);border-radius:var(--radius);font-size:13px;color:var(--color-text);background:var(--color-bg);transition:var(--transition);}
.ref-search-input:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(13,148,136,0.1);}
.ref-list{flex:1;overflow-y:auto;padding:8px;}
.ref-card{padding:12px;border-radius:var(--radius);border:1px solid var(--color-border-light);margin-bottom:8px;cursor:pointer;transition:var(--transition);}
.ref-card:hover{border-color:var(--color-primary);box-shadow:var(--shadow-sm);}
.ref-card-title{font-size:13px;font-weight:600;color:var(--color-text);margin-bottom:4px;line-height:1.4;}
.ref-card-meta{font-size:12px;color:var(--color-text-secondary);margin-bottom:6px;}
.ref-card-format{font-size:11px;color:var(--color-text-light);background:var(--color-bg);padding:6px 8px;border-radius:var(--radius-sm);margin-bottom:8px;line-height:1.5;font-family:var(--font-mono);display:none;}
.ref-card.expanded .ref-card-format{display:block;}
.ref-card-actions{display:none;}
.ref-card.expanded .ref-card-actions{display:flex;gap:6px;}
.ref-insert-btn{padding:3px 10px;border-radius:var(--radius-sm);font-size:11px;color:var(--color-primary);background:rgba(13,148,136,0.08);border:1px solid rgba(13,148,136,0.2);transition:var(--transition);}
.ref-insert-btn:hover{background:rgba(13,148,136,0.15);}
.bottombar{height:var(--bottombar-height);background:var(--color-card);border-top:1px solid var(--color-border);display:flex;align-items:center;padding:0 16px;font-size:12px;color:var(--color-text-secondary);gap:20px;position:fixed;bottom:0;left:0;right:0;z-index:100;}
.bottombar-item{display:flex;align-items:center;gap:6px;}
.bottombar-item-label{color:var(--color-text-light);}
.bottombar-item-value{font-weight:500;color:var(--color-text);}
.bottombar-plagiarism{cursor:pointer;padding:2px 8px;border-radius:var(--radius-sm);transition:var(--transition);}
.bottombar-plagiarism:hover{background:rgba(239,68,68,0.08);}
.bottombar-plagiarism .bottombar-item-value{color:var(--color-success);font-weight:600;}
.bottombar-format{cursor:pointer;padding:2px 8px;border-radius:var(--radius-sm);transition:var(--transition);}
.bottombar-format:hover{background:var(--color-hover);}
.bottombar-format .bottombar-item-value{color:var(--color-primary);}
.bottombar-save-status{margin-left:auto;display:flex;align-items:center;gap:4px;}
.bottombar-save-dot{width:6px;height:6px;border-radius:50%;background:var(--color-success);}
.bottombar-save-dot.saving{background:var(--color-warning);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all 0.3s ease;}
.modal-overlay.visible{opacity:1;visibility:visible;}
.modal{background:var(--color-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:680px;max-width:90vw;max-height:80vh;overflow:hidden;transform:translateY(20px);transition:transform 0.3s ease;}
.modal-overlay.visible .modal{transform:translateY(0);}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--color-border);}
.modal-title{font-size:16px;font-weight:700;color:var(--color-text);}
.modal-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);color:var(--color-text-secondary);background:transparent;font-size:18px;transition:var(--transition);}
.modal-close:hover{background:var(--color-hover);color:var(--color-text);}
.modal-body{padding:24px;overflow-y:auto;max-height:calc(80vh - 140px);}
.plagiarism-overview{display:flex;align-items:center;gap:24px;margin-bottom:24px;padding:20px;background:var(--color-bg);border-radius:var(--radius);}
.plagiarism-score-circle{width:80px;height:80px;border-radius:50%;border:6px solid var(--color-border);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;}
.plagiarism-score-value{font-size:24px;font-weight:700;color:var(--color-success);}
.plagiarism-score-label{font-size:12px;color:var(--color-text-secondary);text-align:center;position:absolute;bottom:-20px;white-space:nowrap;}
.plagiarism-overview-info h3{font-size:14px;font-weight:600;color:var(--color-text);margin-bottom:6px;}
.plagiarism-overview-info p{font-size:13px;color:var(--color-text-secondary);}
.plagiarism-detail{margin-bottom:16px;}
.plagiarism-detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.plagiarism-detail-label{font-size:13px;font-weight:500;color:var(--color-text);}
.plagiarism-detail-value{font-size:12px;font-weight:600;color:var(--color-text-secondary);}
.plagiarism-bar{height:8px;background:var(--color-border-light);border-radius:4px;overflow:hidden;}
.plagiarism-bar-fill{height:100%;border-radius:4px;transition:width 0.5s ease;}
.plagiarism-bar-fill.low{background:var(--color-success);}
.plagiarism-bar-fill.medium{background:var(--color-warning);}
.plagiarism-bar-fill.high{background:var(--color-danger);}
.plagiarism-suggestion{margin-top:8px;padding:10px 12px;background:rgba(13,148,136,0.06);border-left:3px solid var(--color-primary);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:12px;color:var(--color-text-secondary);line-height:1.5;}
.format-dropdown{position:absolute;bottom:calc(var(--bottombar-height) + 8px);left:50%;transform:translateX(-50%);background:var(--color-card);border-radius:var(--radius);box-shadow:var(--shadow-lg);border:1px solid var(--color-border);padding:6px;z-index:150;opacity:0;visibility:hidden;transition:var(--transition);}
.format-dropdown.visible{opacity:1;visibility:visible;}
.format-option{padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;color:var(--color-text);width:100%;text-align:left;background:transparent;transition:var(--transition);}
.format-option:hover{background:var(--color-hover);}
.format-option.active{color:var(--color-primary);font-weight:600;}
.ai-loading{display:flex;align-items:center;gap:6px;padding:8px 14px;font-size:12px;color:var(--color-text-secondary);}
.ai-loading-dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--color-primary);margin:0 2px;animation:loadingDots 1.2s infinite;}
.ai-loading-dots span:nth-child(2){animation-delay:0.2s;}
.ai-loading-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes loadingDots{0%,100%{opacity:0.3;transform:scale(0.8);}50%{opacity:1;transform:scale(1);}}
@media(max-width:1200px){:root{--sidebar-right-width:280px;}}
@media(max-width:1024px){:root{--sidebar-left-width:220px;--sidebar-right-width:260px;}.editor-content{padding:30px 40px;}}
@media(max-width:768px){.sidebar-left{display:none;}.sidebar-right{position:fixed;right:0;top:var(--topbar-height);bottom:var(--bottombar-height);z-index:90;transform:translateX(100%);transition:transform 0.3s ease;}.sidebar-right.mobile-open{transform:translateX(0);}.editor-content{padding:20px 24px;margin:8px;}.topbar-modules{display:none;}}
.fade-in{animation:fadeIn 0.3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.slide-in-right{animation:slideInRight 0.3s ease;}
@keyframes slideInRight{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-logo">
      <div class="topbar-logo-icon">ZW</div>
      <span class="topbar-logo-text">知文AI</span>
    </div>
    <nav class="topbar-modules">
      <button class="topbar-module-btn active" data-module="writing">写作</button>
      <button class="topbar-module-btn" data-module="literature">文献</button>
      <button class="topbar-module-btn" data-module="plagiarism">查重</button>
      <button class="topbar-module-btn" data-module="format">格式</button>
    </nav>
    <div class="topbar-user">
      <span class="topbar-user-name">研究者</span>
      <div class="topbar-avatar">研</div>
    </div>
  </header>
  <div class="main-layout">
    <aside class="sidebar-left">
      <div class="sidebar-left-header">
        <span class="sidebar-left-title">论文大纲</span>
        <button class="sidebar-left-toggle-all" id="toggle-all">全部折叠</button>
      </div>
      <div class="outline-tree" id="outline-tree"></div>
    </aside>
    <main class="editor-area">
      <div class="editor-toolbar">
        <button class="toolbar-btn" id="btn-bold" title="加粗 (Ctrl+B)"><strong>B</strong></button>
        <button class="toolbar-btn" id="btn-italic" title="斜体 (Ctrl+I)"><em>I</em></button>
        <button class="toolbar-btn" id="btn-underline" title="下划线 (Ctrl+U)"><u>U</u></button>
        <span class="toolbar-separator"></span>
        <button class="toolbar-btn toolbar-btn-text" id="btn-h1" title="标题1">H1</button>
        <button class="toolbar-btn toolbar-btn-text" id="btn-h2" title="标题2">H2</button>
        <button class="toolbar-btn toolbar-btn-text" id="btn-h3" title="标题3">H3</button>
        <span class="toolbar-separator"></span>
        <button class="toolbar-btn" id="btn-quote" title="引用" style="font-size:15px">&ldquo;</button>
        <button class="toolbar-btn" id="btn-ol" title="有序列表" style="font-size:12px">1.</button>
        <button class="toolbar-btn" id="btn-ul" title="无序列表" style="font-size:14px">&#8226;</button>
        <span class="toolbar-separator"></span>
        <button class="toolbar-btn toolbar-btn-text ai-btn" id="btn-cite" title="插入引用标记">[n]</button>
        <span class="toolbar-separator"></span>
        <button class="toolbar-btn toolbar-btn-text ai-btn" id="btn-continue" title="AI续写">&#10024; AI续写</button>
        <button class="toolbar-btn toolbar-btn-text ai-btn" id="btn-polish" title="AI润色">&#9998; AI润色</button>
      </div>
      <div class="editor-content" id="editor" contenteditable="true" spellcheck="false"></div>

'use strict';
var outlineData=[{id:'abstract',label:'摘要',level:0,children:[]},{id:'ch1',label:'第一章 绪论',level:0,children:[{id:'ch1-1',label:'1.1 研究背景',level:1},{id:'ch1-2',label:'1.2 研究目的',level:1},{id:'ch1-3',label:'1.3 研究方法',level:1}]},{id:'ch2',label:'第二章 文献综述',level:0,children:[{id:'ch2-1',label:'2.1 国内研究现状',level:1},{id:'ch2-2',label:'2.2 国外研究现状',level:1}]},{id:'ch3',label:'第三章 研究设计',level:0,children:[{id:'ch3-1',label:'3.1 实验方案',level:1},{id:'ch3-2',label:'3.2 数据采集',level:1}]},{id:'ch4',label:'第四章 结果分析',level:0,children:[{id:'ch4-1',label:'4.1 描述性统计',level:1},{id:'ch4-2',label:'4.2 回归分析',level:1}]},{id:'ch5',label:'第五章 结论与展望',level:0,children:[{id:'ch5-1',label:'5.1 主要结论',level:1},{id:'ch5-2',label:'5.2 研究局限',level:1},{id:'ch5-3',label:'5.3 未来方向',level:1}]},{id:'references',label:'参考文献',level:0,children:[]},{id:'acknowledgement',label:'致谢',level:0,children:[]}];
var paperContent={'abstract':'<h1>摘 要</h1><p>随着人工智能技术的快速发展，AI辅助学术写作已成为学术界关注的热点议题。本文旨在探讨人工智能技术在学术写作全流程中的应用现状、效果评估及发展趋势。通过系统梳理国内外相关文献，结合实证研究方法，对AI辅助写作工具在论文选题、文献检索、内容生成、语言润色、格式规范及查重检测等环节的应用进行深入分析。研究发现，AI辅助写作系统能够显著提升学术写作效率（平均提升约40%），并在一定程度上改善论文质量，但同时也存在学术伦理、原创性判定等技术与社会层面的挑战。本研究提出了一套AI辅助学术写作的评价框架，并对未来发展方向提出了建议，为相关领域的研究者和实践者提供参考。</p><p><strong>关键词：</strong>人工智能；学术写作；智能辅助；自然语言处理；学术伦理</p>','ch1':'<h1>第一章 绪论</h1>','ch1-1':'<h2>1.1 研究背景</h2><p>近年来，以大语言模型为代表的人工智能技术取得了突破性进展，其在自然语言理解与生成方面的能力日益增强，为学术写作领域带来了革命性的变革机遇。传统的学术写作过程通常包括选题论证、文献调研、研究设计、数据分析、论文撰写和投稿修改等多个阶段，每个阶段都需要研究者投入大量的时间和精力<span class="citation-marker" data-ref="1">[1]</span>。</p><p>据统计，一位科研工作者平均需要花费约3-6个月的时间完成一篇高质量的学术论文，其中写作和修改过程占据了相当大的比例。在这个背景下，AI辅助写作工具应运而生，试图通过自动化和智能化手段减轻研究者的写作负担<span class="citation-marker" data-ref="2">[2]</span>。</p><p>当前，国内外已涌现出多种AI辅助学术写作工具，如Grammarly、Writefull、知文AI等，这些工具在语法检查、内容生成、文献管理等方面展现出巨大潜力。然而，学术界对AI辅助写作的接受度、使用效果以及潜在风险仍缺乏系统的研究和评估<span class="citation-marker" data-ref="3">[3]</span>。</p>','ch1-2':'<h2>1.2 研究目的</h2><p>本研究的主要目的包括以下几个方面：</p><p>第一，系统梳理AI辅助学术写作领域的研究现状和发展脉络，构建完整的知识图谱，为后续研究奠定理论基础。</p><p>第二，评估现有AI辅助写作工具的实际效果，包括写作效率提升程度、论文质量改善情况以及用户满意度等维度。</p><p>第三，探讨AI辅助写作过程中涉及的学术伦理问题，包括但不限于学术不端检测、原创性判定、知识产权归属等核心议题<span class="citation-marker" data-ref="4">[4]</span>。</p><p>第四，展望AI辅助学术写作的未来发展趋势，为研究机构、期刊编辑部和政策制定者提供前瞻性的参考和建议。</p>','ch1-3':'<h2>1.3 研究方法</h2><p>本研究采用混合研究方法，结合定量分析与定性分析，具体包括以下三个层面：</p><p>在文献研究方面，以Web of Science、CNKI、Scopus等主要学术数据库为数据来源，采用系统性文献综述方法，对2018-2025年间发表的AI辅助学术写作相关文献进行检索、筛选和分析。</p><p>在实证研究方面，设计对照实验，邀请120名来自不同学科背景的研究人员参与测试，使用知文AI等辅助写作工具完成标准化的写作任务。</p><p>在问卷调查方面，面向高校师生和科研人员发放调查问卷，了解AI辅助写作工具的使用现状、用户态度和需求偏好<span class="citation-marker" data-ref="5">[5]</span>。</p>','ch2':'<h1>第二章 文献综述</h1>','ch2-1':'<h2>2.1 国内研究现状</h2><p>国内学者在AI辅助学术写作领域的研究起步相对较晚，但近年来发展迅速。清华大学、北京大学等高校的研究团队在中文文本纠错、学术语言生成和知识图谱构建方面取得了重要进展<span class="citation-marker" data-ref="6">[6]</span>。</p><p>知文AI、PaperPass等国产工具逐步发展壮大，形成了具有中国特色的产品生态。这些工具不仅提供基础的语法检查和格式调整功能，还融入了中文学术写作规范、国标引用格式等本土化特性。</p><p>此外，国内学者还关注AI辅助写作的教育应用，探索如何在高等教育教学中合理引入AI写作辅助工具<span class="citation-marker" data-ref="7">[7]</span>。</p>','ch2-2':'<h2>2.2 国外研究现状</h2><p>国外在AI辅助学术写作领域的研究起步较早，成果丰富。GPT-4等大型语言模型展现了出色的学术文本理解和生成能力<span class="citation-marker" data-ref="1">[1]</span>。</p><p>Nature、Science等顶级期刊陆续发表社论和观点文章，讨论AI辅助写作的边界和规范。国际出版伦理委员会（COPE）也发布了关于AI在学术出版中使用的指导原则<span class="citation-marker" data-ref="2">[2]</span>。</p><p>国外主流AI写作辅助工具（如Grammarly、Writefull、Jenni AI等）已经形成了较为成熟的商业模式和用户群体<span class="citation-marker" data-ref="8">[8]</span>。</p>','ch3':'<h1>第三章 研究设计</h1>','ch3-1':'<h2>3.1 实验方案</h2><p>本研究采用准实验设计，通过前后对比和组间对比相结合的方式评估AI辅助学术写作工具的实际效果。实验参与者共120人，均为来自国内5所高校的博士研究生和青年教师<span class="citation-marker" data-ref="5">[5]</span>。</p><p>实验任务分为两个阶段：第一阶段要求参与者在90分钟内完成一篇2000字左右的文献综述初稿；第二阶段要求参与者对初稿进行修改润色，时限60分钟。</p><p>评估指标包括：写作效率、文本质量、创新性评分和用户满意度。由3位领域专家进行双盲评审。</p>','ch3-2':'<h2>3.2 数据采集</h2><p>数据采集工作从2025年3月开始，至2025年6月结束，历时4个月。采集的数据分为三类：过程数据、产出数据和问卷数据。</p><p>共回收有效问卷115份，有效回收率为95.8%<span class="citation-marker" data-ref="9">[9]</span>。</p>','ch4':'<h1>第四章 结果分析</h1>','ch4-1':'<h2>4.1 描述性统计</h2><p>在写作效率方面，实验组的平均初稿完成时间为72.3分钟（SD=12.6），显著低于对照组的95.8分钟（SD=15.2），差异具有统计学意义（t=-9.23, p&lt;0.001）。</p><p>在文本质量方面，实验组论文的结构完整性评分均值为5.82（SD=0.87），显著高于对照组的5.14（SD=1.03）。</p><p>在查重率方面，实验组论文的平均查重率为11.8%（SD=3.2），略低于对照组的14.1%（SD=4.5）<span class="citation-marker" data-ref="10">[10]</span>。</p>','ch4-2':'<h2>4.2 回归分析</h2><p>回归分析结果显示，模型的总体解释力为46.3%（R²=0.463, F=18.72, p&lt;0.001）。是否使用AI工具（β=0.38, p&lt;0.001）和写作经验（β=0.25, p&lt;0.01）是影响写作效率的显著正向预测因子。</p><p>中介效应分析表明，AI工具通过降低写作焦虑（间接效应=0.12）和提升写作自我效能感（间接效应=0.08）间接促进了写作效率的提升。</p>','ch5':'<h1>第五章 结论与展望</h1>','ch5-1':'<h2>5.1 主要结论</h2><p>第一，AI辅助学术写作工具能够显著提升研究者的写作效率，平均效率提升约32.5%。</p><p>第二，AI辅助写作工具对论文的结构完整性和逻辑连贯性有明显的改善效果。</p><p>第三，AI辅助写作的效率提升部分通过降低写作焦虑和提升自我效能感实现<span class="citation-marker" data-ref="3">[3]</span>。</p>','ch5-2':'<h2>5.2 研究局限</h2><p>本研究存在以下局限：首先，实验样本来源于5所高校，样本的代表性和外推性有待进一步验证。其次，实验采用的是短时限的标准化写作任务，与真实论文写作场景存在一定差距。</p>','ch5-3':'<h2>5.3 未来方向</h2><p>第一，多模态AI辅助写作。第二，个性化写作辅助。第三，学术伦理智能审查。第四，协作写作支持。</p>','references':'<h1>参考文献</h1><p id="ref-list-content"></p>','acknowledgement':'<h1>致 谢</h1><p>衷心感谢所有参与本研究的师生和科研人员，感谢他们在实验过程中付出的时间和精力。感谢知文AI团队提供的技术支持。</p>'};

function renderOutline(){var tree=document.getElementById('outline-tree');if(!tree)return;var html='';outlineData.forEach(function(node){html+=buildOutlineNode(node,0);});tree.innerHTML=html;}
function buildOutlineNode(node,depth){var hasChildren=node.children&&node.children.length>0;var padding=16;var html='<div class="outline-node" data-id="'+node.id+'">';html+='<div class="outline-node-header" data-id="'+node.id+'" style="padding-left:'+(padding+depth*16)+'px">';if(hasChildren){html+='<span class="outline-toggle expanded">&#9654;</span>';}else{html+='<span class="outline-toggle-placeholder"></span>';}var icon=node.level===0?'&#128196;':'&#128221;';html+='<span class="outline-node-icon">'+icon+'</span>';html+='<span class="outline-node-label level-'+node.level+'">'+node.label+'</span>';html+='</div>';if(hasChildren){html+='<div class="outline-children" data-parent="'+node.id+'">';node.children.forEach(function(child){html+=buildOutlineNode(child,depth+1);});html+='</div>';}html+='</div>';return html;}
function highlightActiveOutline(id){var headers=document.querySelectorAll('.outline-node-header');headers.forEach(function(h){h.classList.remove('active');if(h.getAttribute('data-id')===id)h.classList.add('active');});activeOutlineId=id;}

function fillEditorContent(){var editor=document.getElementById('editor');if(!editor)return;var html='';var orderedIds=['abstract','ch1','ch1-1','ch1-2','ch1-3','ch2','ch2-1','ch2-2','ch3','ch3-1','ch3-2','ch4','ch4-1','ch4-2','ch5','ch5-1','ch5-2','ch5-3','references','acknowledgement'];orderedIds.forEach(function(id){if(paperContent[id])html+='<div data-section="'+id+'">'+paperContent[id]+'</div>';});editor.innerHTML=html;renderReferenceSection();}

function saveSelection(){var sel=window.getSelection();if(sel.rangeCount>0)savedRange=sel.getRangeAt(0).cloneRange();}
function restoreSelection(){if(savedRange){var sel=window.getSelection();sel.removeAllRanges();sel.addRange(savedRange);}}

function insertCitationMarker(refId){restoreSelection();var marker=document.createElement('span');marker.className='citation-marker';marker.setAttribute('data-ref',refId);marker.textContent='['+refId+']';var sel=window.getSelection();if(sel.rangeCount>0){var range=sel.getRangeAt(0);range.deleteContents();range.insertNode(marker);range.setStartAfter(marker);range.setEndAfter(marker);sel.removeAllRanges();sel.addRange(range);}updateWordCount();}
function updateWordCount(){var editor=document.getElementById('editor');if(!editor)return;var text=editor.innerText||'';var count=text.replace(/\s/g,'').length;var el=document.getElementById('word-count');if(el)el.textContent=count.toLocaleString();triggerAutoSave();}
var saveTimer=null;function triggerAutoSave(){var dot=document.getElementById('save-dot');if(dot)dot.classList.add('saving');var saveText=document.getElementById('save-text');if(saveText)saveText.textContent='保存中...';clearTimeout(saveTimer);saveTimer=setTimeout(function(){if(dot)dot.classList.remove('saving');if(saveText)saveText.textContent='已保存';},1200);}

function renderReferenceList(){var list=document.getElementById('ref-list');if(!list)return;var html='';referencesData.forEach(function(ref){html+='<div class="ref-card" data-ref-id="'+ref.id+'">';html+='<div class="ref-card-title">['+ref.id+'] '+ref.title+'</div>';html+='<div class="ref-card-meta">'+ref.authors+' | '+ref.year+' | '+ref.source+'</div>';html+='<div class="ref-card-format">'+ref.formats[currentFormat]+'</div>';html+='<div class="ref-card-actions"><button class="ref-insert-btn" onclick="window._zhiwenInsertRef('+ref.id+')">插入引用</button></div>';html+='</div>';});list.innerHTML=html;}

function addAiMessage(type,content,withActions){var chatArea=document.getElementById('ai-chat');if(!chatArea)return;var msgDiv=document.createElement('div');msgDiv.className='ai-message '+type+(type==='ai'?' slide-in-right':' fade-in');var avatarText=type==='ai'?'AI':'我';msgDiv.innerHTML='<div class="ai-avatar">'+avatarText+'</div><div class="ai-bubble">'+content+'</div>';chatArea.appendChild(msgDiv);chatArea.scrollTop=chatArea.scrollHeight;if(withActions&&type==='ai'){var actionHtml='<div class="ai-suggestion-actions"><button class="ai-action-btn accept" data-action="accept">采纳</button><button class="ai-action-btn reject" data-action="reject">忽略</button>';if(withActions==='continue')actionHtml+='<button class="ai-action-btn regenerate" data-action="regenerate">重新生成</button>';actionHtml+='</div>';msgDiv.querySelector('.ai-bubble').innerHTML+=actionHtml;msgDiv.querySelectorAll('.ai-action-btn').forEach(function(btn){btn.addEventListener('click',function(){handleAiAction(this.getAttribute('data-action'),msgDiv);});});}}

function typeWriterEffect(element,text,callback){isAiTyping=true;var i=0;var cursor=document.createElement('span');cursor.className='typing-cursor';element.appendChild(cursor);function type(){if(i<text.length){var textNode=document.createTextNode(text.charAt(i));element.insertBefore(textNode,cursor);i++;var chatArea=document.getElementById('ai-chat');if(chatArea)chatArea.scrollTop=chatArea.scrollHeight;var delay=Math.random()*30+20;setTimeout(type,delay);}else{cursor.remove();isAiTyping=false;if(callback)callback();}}type();}

function handleAiContinue(){if(isAiTyping)return;saveSelection();switchRightTab('ai');showAiLoading();setTimeout(function(){removeAiLoading();var text=continuationTexts[Math.floor(Math.random()*continuationTexts.length)];addAiMessage('ai','','continue');var lastBubble=document.querySelector('#ai-chat .ai-message:last-child .ai-bubble');if(lastBubble)typeWriterEffect(lastBubble,text,null);},1500);}
function handleAiPolish(){if(isAiTyping)return;var sel=window.getSelection();var selectedText=sel.toString().trim();if(!selectedText){switchRightTab('ai');addAiMessage('ai','请先在编辑器中选中需要润色的文字段落，然后点击"AI润色"按钮。',false);return;}switchRightTab('ai');addAiMessage('user','润色："'+(selectedText.length>30?selectedText.substring(0,30)+'...':selectedText)+'"');showAiLoading();setTimeout(function(){removeAiLoading();var suggestion=polishSuggestions[Math.floor(Math.random()*polishSuggestions.length)];var replyHtml='<div style="margin-bottom:8px"><strong>润色建议：</strong></div><div style="background:#fef2f2;padding:8px;border-radius:4px;margin-bottom:6px;font-size:12px;color:#991b1b">原文：'+selectedText+'</div><div style="background:#f0fdf4;padding:8px;border-radius:4px;margin-bottom:8px;font-size:12px;color:#166534">修改：'+suggestion.polished+'</div>';addAiMessage('ai',replyHtml,'polish');},1500);}
function handleAiAction(action,msgDiv){if(action==='accept'){var bubble=msgDiv.querySelector('.ai-bubble');var actions=bubble.querySelector('.ai-suggestion-actions');var textContent='';var nodes=bubble.childNodes;for(var i=0;i<nodes.length;i++){if(nodes[i]!==actions&&nodes[i].nodeType!==1)textContent+=nodes[i].textContent||nodes[i].nodeValue||'';else if(nodes[i].nodeType===1&&nodes[i]!==actions)textContent+=nodes[i].textContent;}restoreSelection();var editor=document.getElementById('editor');var sel=window.getSelection();if(sel.rangeCount>0){var range=sel.getRangeAt(0);var p=document.createElement('p');p.textContent=textContent.trim();range.insertNode(p);range.setStartAfter(p);range.setEndAfter(p);sel.removeAllRanges();sel.addRange(range);editor.focus();}updateWordCount();addAiMessage('ai','已采纳，内容已插入到编辑器光标位置。',false);}else if(action==='reject'){var actionsEl=msgDiv.querySelector('.ai-suggestion-actions');if(actionsEl)actionsEl.remove();addAiMessage('ai','已忽略该建议。',false);}else if(action==='regenerate'){var parentMsg=msgDiv;var bubbleEl=parentMsg.querySelector('.ai-bubble');bubbleEl.innerHTML='';var text=continuationTexts[Math.floor(Math.random()*continuationTexts.length)];typeWriterEffect(bubbleEl,text,function(){var actionHtml2='<div class="ai-suggestion-actions"><button class="ai-action-btn accept" data-action="accept">采纳</button><button class="ai-action-btn reject" data-action="reject">忽略</button><button class="ai-action-btn regenerate" data-action="regenerate">重新生成</button></div>';bubbleEl.innerHTML+=actionHtml2;parentMsg.querySelectorAll('.ai-action-btn').forEach(function(btn){btn.addEventListener('click',function(){handleAiAction(this.getAttribute('data-action'),parentMsg);});});});}}
function showPlagiarismReport(){var overlay=document.getElementById('plagiarism-modal');if(!overlay)return;var body=document.getElementById('plagiarism-modal-body');if(!body)return;var html='<div class="plagiarism-overview"><div class="plagiarism-score-circle"><span class="plagiarism-score-value">'+plagiarismData.total+'%</span><span class="plagiarism-score-label">总体相似度</span></div><div class="plagiarism-overview-info"><h3>查重报告概览</h3><p>本次检测覆盖全文 '+document.getElementById('word-count').textContent+' 字，与CNKI、万方、维普等数据库中的文献进行比对。总体相似度为 <strong>'+plagiarismData.total+'%</strong>，处于安全范围内。</p></div></div>';html+='<h3 style="font-size:14px;margin-bottom:12px;color:#1a2332">各章节相似度详情</h3>';plagiarismData.sections.forEach(function(section){var level=section.value<10?'low':(section.value<16?'medium':'high');html+='<div class="plagiarism-detail"><div class="plagiarism-detail-header"><span class="plagiarism-detail-label">'+section.label+'</span><span class="plagiarism-detail-value">'+section.value+'%</span></div><div class="plagiarism-bar"><div class="plagiarism-bar-fill '+level+'" style="width:'+Math.min(section.value*3,100)+'%"></div></div><div class="plagiarism-suggestion">&#128161; AI建议：'+section.suggestion+'</div></div>';});body.innerHTML=html;overlay.classList.add('visible');setTimeout(function(){document.querySelectorAll('.plagiarism-bar-fill').forEach(function(bar){var w=bar.style.width;bar.style.width='0%';setTimeout(function(){bar.style.width=w;},100);});},300);}
function closePlagiarismModal(){var overlay=document.getElementById('plagiarism-modal');if(overlay)overlay.classList.remove('visible');}
function toggleFormatDropdown(){var dropdown=document.getElementById('format-dropdown');if(dropdown)dropdown.classList.toggle('visible');}
function selectFormat(format){updateReferenceFormats(format);var dropdown=document.getElementById('format-dropdown');if(dropdown)dropdown.classList.remove('visible');document.querySelectorAll('.format-option').forEach(function(opt){opt.classList.toggle('active',opt.getAttribute('data-format')===format);});}
function switchModule(moduleName){document.querySelectorAll('.topbar-module-btn').forEach(function(btn){btn.classList.toggle('active',btn.getAttribute('data-module')===moduleName);});}
function bindEvents(){document.getElementById('outline-tree').addEventListener('click',function(e){var header=e.target.closest('.outline-node-header');if(header){var id=header.getAttribute('data-id');scrollToSection(id);var toggle=header.querySelector('.outline-toggle');if(toggle){toggle.classList.toggle('expanded');var node=header.parentElement;var children=node.querySelector('.outline-children');if(children)children.classList.toggle('collapsed');}}});var toggleAllBtn=document.getElementById('toggle-all');if(toggleAllBtn){var allCollapsed=false;toggleAllBtn.addEventListener('click',function(){allCollapsed=!allCollapsed;this.textContent=allCollapsed?'全部展开':'全部折叠';document.querySelectorAll('.outline-toggle').forEach(function(t){t.classList.toggle('expanded',!allCollapsed);});document.querySelectorAll('.outline-children').forEach(function(c){c.classList.toggle('collapsed',allCollapsed);});});}var boldBtn=document.getElementById('btn-bold');if(boldBtn)boldBtn.addEventListener('click',function(){execFormatCommand('bold');});var italicBtn=document.getElementById('btn-italic');if(italicBtn)italicBtn.addEventListener('click',function(){execFormatCommand('italic');});var underlineBtn=document.getElementById('btn-underline');if(underlineBtn)underlineBtn.addEventListener('click',function(){execFormatCommand('underline');});var h1Btn=document.getElementById('btn-h1');if(h1Btn)h1Btn.addEventListener('click',function(){execFormatCommand('formatBlock','<h1>');});var h2Btn=document.getElementById('btn-h2');if(h2Btn)h2Btn.addEventListener('click',function(){execFormatCommand('formatBlock','<h2>');});var h3Btn=document.getElementById('btn-h3');if(h3Btn)h3Btn.addEventListener('click',function(){execFormatCommand('formatBlock','<h3>');});var quoteBtn=document.getElementById('btn-quote');if(quoteBtn)quoteBtn.addEventListener('click',function(){execFormatCommand('formatBlock','<blockquote>');});var olBtn=document.getElementById('btn-ol');if(olBtn)olBtn.addEventListener('click',function(){execFormatCommand('insertOrderedList');});var ulBtn=document.getElementById('btn-ul');if(ulBtn)ulBtn.addEventListener('click',function(){execFormatCommand('insertUnorderedList');});var citeBtn=document.getElementById('btn-cite');if(citeBtn)citeBtn.addEventListener('click',function(){citationCounter++;insertCitationMarker(citationCounter);});var continueBtn=document.getElementById('btn-continue');if(continueBtn)continueBtn.addEventListener('click',handleAiContinue);var polishBtn=document.getElementById('btn-polish');if(polishBtn)polishBtn.addEventListener('click',handleAiPolish);var editor=document.getElementById('editor');if(editor){editor.addEventListener('keyup',function(){updateWordCount();detectCurrentSection();});editor.addEventListener('input',function(){updateWordCount();});editor.addEventListener('mouseup',function(){saveSelection();detectCurrentSection();});}var tabAi=document.getElementById('tab-ai');var tabRef=document.getElementById('tab-ref');if(tabAi)tabAi.addEventListener('click',function(){switchRightTab('ai');});if(tabRef)tabRef.addEventListener('click',function(){switchRightTab('ref');});document.querySelectorAll('.ai-quick-btn').forEach(function(btn){btn.addEventListener('click',function(){handleQuickQuestion(this.textContent);});});var refSearchInput=document.getElementById('ref-search-input');if(refSearchInput){refSearchInput.addEventListener('input',function(){filterReferences(this.value);});}var refList=document.getElementById('ref-list');if(refList){refList.addEventListener('click',function(e){var card=e.target.closest('.ref-card');if(card&&!e.target.classList.contains('ref-insert-btn'))card.classList.toggle('expanded');});}var plagiarismBtn=document.getElementById('plagiarism-trigger');if(plagiarismBtn)plagiarismBtn.addEventListener('click',showPlagiarismReport);var modalClose=document.getElementById('plagiarism-modal-close');if(modalClose)modalClose.addEventListener('click',closePlagiarismModal);var modalOverlay=document.getElementById('plagiarism-modal');if(modalOverlay){modalOverlay.addEventListener('click',function(e){if(e.target===this)closePlagiarismModal();});}var formatTrigger=document.getElementById('format-trigger');if(formatTrigger)formatTrigger.addEventListener('click',toggleFormatDropdown);document.querySelectorAll('.format-option').forEach(function(opt){opt.addEventListener('click',function(){selectFormat(this.getAttribute('data-format'));});});document.addEventListener('click',function(e){var dropdown=document.getElementById('format-dropdown');if(dropdown&&dropdown.classList.contains('visible')){if(!e.target.closest('#format-trigger')&&!e.target.closest('#format-dropdown'))dropdown.classList.remove('visible');}});document.querySelectorAll('.topbar-module-btn').forEach(function(btn){btn.addEventListener('click',function(){switchModule(this.getAttribute('data-module'));});});document.addEventListener('keydown',function(e){if(e.ctrlKey||e.metaKey){switch(e.key){case 'b':e.preventDefault();execFormatCommand('bold');break;case 'i':e.preventDefault();execFormatCommand('italic');break;case 'u':e.preventDefault();execFormatCommand('underline');break;}}if(e.key==='Escape'){closePlagiarismModal();var dropdown=document.getElementById('format-dropdown');if(dropdown)dropdown.classList.remove('visible');}});}
function detectCurrentSection(){var editor=document.getElementById('editor');if(!editor)return;var sel=window.getSelection();if(!sel.rangeCount)return;var range=sel.getRangeAt(0);var node=range.startContainer;while(node&&node!==editor){if(node.nodeType===1&&node.getAttribute&&node.getAttribute('data-section')){highlightActiveOutline(node.getAttribute('data-section'));return;}node=node.parentNode;}}
})();
  </script>
