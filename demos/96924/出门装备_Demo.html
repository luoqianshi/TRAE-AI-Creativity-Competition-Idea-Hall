<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>出门装备 - 你的出门清单助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 16px 40px;
            color: #333;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 24px;
            padding-top: 10px;
        }

        .header-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .scene-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .scene-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            border-radius: 16px;
            padding: 20px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .scene-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.25);
            border-color: #667eea;
        }

        .scene-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .scene-name {
            font-size: 15px;
            font-weight: 600;
            color: #444;
        }

        .scene-desc {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .progress-bar {
            height: 8px;
            background: #e8e8e8;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .progress-text {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 16px;
        }

        .progress-text span {
            color: #667eea;
            font-weight: 700;
            font-size: 18px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            padding: 14px 12px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .checklist-item:hover {
            background: #f0f1f3;
        }

        .checklist-item.checked {
            background: #e8f5e9;
            border-color: #81c784;
        }

        .checklist-item.checked .item-text {
            text-decoration: line-through;
            color: #888;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #ccc;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: white;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .checklist-item.checked .checkbox {
            background: #81c784;
            border-color: #81c784;
        }

        .item-icon {
            font-size: 22px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .item-text {
            flex: 1;
            font-size: 15px;
            font-weight: 500;
        }

        .add-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .add-item input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .add-item input:focus {
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-full {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #667eea;
            font-size: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px 0;
        }

        .complete-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .complete-icon {
            font-size: 80px;
            margin-bottom: 16px;
            animation: bounce 0.6s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .complete-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .complete-subtitle {
            font-size: 15px;
            color: #666;
            margin-bottom: 24px;
        }

        .weather-hint {
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 14px;
            color: #e65100;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">🎒</div>
            <h1>出门装备</h1>
            <p>选场景，出清单，打勾确认，安心出发</p>
        </div>

        <!-- 场景选择页 -->
        <div class="page active" id="scenePage">
            <div class="card">
                <div class="card-title">📍 选择你的出门场景</div>
                <div class="scene-grid">
                    <div class="scene-card" onclick="selectScene('exam')">
                        <div class="scene-icon">📝</div>
                        <div class="scene-name">考试</div>
                        <div class="scene-desc">准考证、文具...</div>
                    </div>
                    <div class="scene-card" onclick="selectScene('train')">
                        <div class="scene-icon">🚄</div>
                        <div class="scene-name">坐动车/飞机</div>
                        <div class="scene-desc">身份证、充电宝...</div>
                    </div>
                    <div class="scene-card" onclick="selectScene('travel')">
                        <div class="scene-icon">✈️</div>
                        <div class="scene-name">旅行</div>
                        <div class="scene-desc">洗漱、衣物、药品...</div>
                    </div>
                    <div class="scene-card" onclick="selectScene('interview')">
                        <div class="scene-icon">💼</div>
                        <div class="scene-name">面试</div>
                        <div class="scene-desc">简历、证件、正装...</div>
                    </div>
                    <div class="scene-card" onclick="selectScene('camping')">
                        <div class="scene-icon">⛺</div>
                        <div class="scene-name">露营</div>
                        <div class="scene-desc">帐篷、食物、防虫...</div>
                    </div>
                    <div class="scene-card" onclick="selectScene('beach')">
                        <div class="scene-icon">🏖️</div>
                        <div class="scene-name">海边</div>
                        <div class="scene-desc">泳衣、防晒、墨镜...</div>
                    </div>
                    <div class="scene-card" onclick="selectScene('gym')">
                        <div class="scene-icon">🏋️</div>
                        <div class="scene-name">健身</div>
                        <div class="scene-desc">运动服、水杯、毛巾...</div>
                    </div>
                    <div class="scene-card" onclick="selectScene('move')">
                        <div class="scene-icon">📦</div>
                        <div class="scene-name">搬家</div>
                        <div class="scene-desc">打包袋、工具、钥匙...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 清单页 -->
        <div class="page" id="checklistPage">
            <button class="back-btn" onclick="goBack()">← 返回选场景</button>
            <div class="card">
                <div class="card-title" id="checklistTitle">📋 清单</div>

                <div class="weather-hint" id="weatherHint">
                    🌤️ 今天天气不错，适合出门！
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="progress-text">已完成 <span id="progressNum">0/0</span></div>

                <div id="checklistItems"></div>

                <div class="add-item">
                    <input type="text" id="newItemInput" placeholder="添加自定义物品..." onkeypress="if(event.key==='Enter')addCustomItem()">
                    <button class="btn btn-primary" onclick="addCustomItem()">+</button>
                </div>
            </div>

            <button class="btn btn-primary btn-full hidden" id="completeBtn" onclick="showComplete()">
                ✨ 装备完毕，出发！
            </button>
        </div>

        <!-- 完成页 -->
        <div class="page" id="completePage">
            <div class="card">
                <div class="complete-screen">
                    <div class="complete-icon">🎉</div>
                    <div class="complete-title">装备完毕！</div>
                    <div class="complete-subtitle">所有物品已准备就绪，安心出发吧～</div>
                    <button class="btn btn-secondary" onclick="goBack()" style="margin-right: 10px;">
                        再检查一遍
                    </button>
                    <button class="btn btn-primary" onclick="goHome()">
                        返回首页
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scenes = {
            exam: {
                name: '考试',
                icon: '📝',
                items: [
                    { icon: '🆔', text: '身份证 / 准考证' },
                    { icon: '✏️', text: '2B 铅笔' },
                    { icon: '🖊️', text: '黑色签字笔' },
                    { icon: '📐', text: '尺子 / 橡皮' },
                    { icon: '🧻', text: '纸巾' },
                    { icon: '💧', text: '透明水杯' },
                    { icon: '⌚', text: '手表（非电子）' },
                    { icon: '🧥', text: '外套（考场空调冷）' }
                ]
            },
            train: {
                name: '坐动车/飞机',
                icon: '🚄',
                items: [
                    { icon: '🆔', text: '身份证' },
                    { icon: '📱', text: '手机 + 充电宝' },
                    { icon: '🎧', text: '耳机' },
                    { icon: '🧻', text: '纸巾 / 湿巾' },
                    { icon: '💊', text: '晕车药 / 零食' },
                    { icon: '🧥', text: '薄外套' },
                    { icon: '🕶️', text: '眼罩 / U型枕' },
                    { icon: '🌂', text: '雨伞' }
                ]
            },
            travel: {
                name: '旅行',
                icon: '✈️',
                items: [
                    { icon: '🆔', text: '身份证 / 护照' },
                    { icon: '📱', text: '手机 + 充电器' },
                    { icon: '🪥', text: '洗漱用品' },
                    { icon: '👕', text: '换洗衣物' },
                    { icon: '💊', text: '常用药品' },
                    { icon: '🌂', text: '雨伞 / 防晒' },
                    { icon: '📷', text: '相机 / 自拍杆' },
                    { icon: '💰', text: '少量现金' }
                ]
            },
            interview: {
                name: '面试',
                icon: '💼',
                items: [
                    { icon: '📄', text: '简历（纸质版）' },
                    { icon: '🆔', text: '身份证' },
                    { icon: '📓', text: '笔记本 + 笔' },
                    { icon: '💼', text: '公文包 / 文件夹' },
                    { icon: '👔', text: '正装 / 得体服装' },
                    { icon: '🪞', text: '整理仪容（镜子）' },
                    { icon: '⌚', text: '提前查好路线' },
                    { icon: '💧', text: '口香糖 / 口气清新' }
                ]
            },
            camping: {
                name: '露营',
                icon: '⛺',
                items: [
                    { icon: '⛺', text: '帐篷 / 天幕' },
                    { icon: '🪑', text: '折叠椅 / 桌子' },
                    { icon: '🍖', text: '食物 / 饮用水' },
                    { icon: '🔥', text: '炉具 / 打火机' },
                    { icon: '🦟', text: '驱蚊液' },
                    { icon: '🔦', text: '手电筒 / 营地灯' },
                    { icon: '🗑️', text: '垃圾袋' },
                    { icon: '🧥', text: '保暖衣物' }
                ]
            },
            beach: {
                name: '海边',
                icon: '🏖️',
                items: [
                    { icon: '🩱', text: '泳衣 / 泳裤' },
                    { icon: '🧴', text: '防晒霜' },
                    { icon: '🕶️', text: '墨镜' },
                    { icon: '🩴', text: '拖鞋 / 凉鞋' },
                    { icon: '🧺', text: '沙滩巾 / 换洗衣物' },
                    { icon: '📱', text: '手机防水袋' },
                    { icon: '💧', text: '饮用水' },
                    { icon: '🧢', text: '遮阳帽' }
                ]
            },
            gym: {
                name: '健身',
                icon: '🏋️',
                items: [
                    { icon: '👟', text: '运动鞋' },
                    { icon: '🎽', text: '运动服' },
                    { icon: '💧', text: '运动水杯' },
                    { icon: '🧴', text: '毛巾' },
                    { icon: '🎧', text: '耳机' },
                    { icon: '📱', text: '手机（扫码进门）' },
                    { icon: '💊', text: '蛋白棒 / 能量补剂' },
                    { icon: '🧴', text: '洗漱用品（沐浴后）' }
                ]
            },
            move: {
                name: '搬家',
                icon: '📦',
                items: [
                    { icon: '📦', text: '纸箱 / 打包袋' },
                    { icon: '✂️', text: '胶带 / 剪刀 / 马克笔' },
                    { icon: '🔑', text: '新旧住址钥匙' },
                    { icon: '💊', text: '常用药品 / 急救包' },
                    { icon: '🔌', text: '充电器 / 数据线' },
                    { icon: '🧹', text: '基础清洁用品' },
                    { icon: '💰', text: '押金条 / 合同' },
                    { icon: '🪥', text: '当晚必用品（单独装）' }
                ]
            }
        };

        let currentScene = null;
        let checkedItems = new Set();
        let customItems = [];

        function selectScene(sceneKey) {
            currentScene = sceneKey;
            checkedItems.clear();
            customItems = [];
            const scene = scenes[sceneKey];

            document.getElementById('checklistTitle').textContent = `${scene.icon} ${scene.name}清单`;
            renderChecklist();
            updateProgress();
            updateWeatherHint();

            showPage('checklistPage');
        }

        function renderChecklist() {
            const scene = scenes[currentScene];
            const container = document.getElementById('checklistItems');
            let html = '';

            scene.items.forEach((item, index) => {
                const isChecked = checkedItems.has('default_' + index);
                html += createItemHtml('default_' + index, item.icon, item.text, isChecked);
            });

            customItems.forEach((item, index) => {
                const isChecked = checkedItems.has('custom_' + index);
                html += createItemHtml('custom_' + index, '✨', item, isChecked, true);
            });

            container.innerHTML = html;
        }

        function createItemHtml(id, icon, text, isChecked, isCustom = false) {
            return `
                <div class="checklist-item ${isChecked ? 'checked' : ''}" onclick="toggleItem('${id}')">
                    <div class="checkbox">${isChecked ? '✓' : ''}</div>
                    <div class="item-icon">${icon}</div>
                    <div class="item-text">${text}</div>
                </div>
            `;
        }

        function toggleItem(id) {
            if (checkedItems.has(id)) {
                checkedItems.delete(id);
            } else {
                checkedItems.add(id);
            }
            renderChecklist();
            updateProgress();
        }

        function updateProgress() {
            const scene = scenes[currentScene];
            const total = scene.items.length + customItems.length;
            const checked = checkedItems.size;
            const percent = total > 0 ? (checked / total) * 100 : 0;

            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressNum').textContent = `${checked}/${total}`;

            const completeBtn = document.getElementById('completeBtn');
            if (checked === total && total > 0) {
                completeBtn.classList.remove('hidden');
            } else {
                completeBtn.classList.add('hidden');
            }
        }

        function updateWeatherHint() {
            const hints = [
                '☀️ 今天天气不错，记得做好防晒！',
                '🌤️ 多云天气，适合出门～',
                '🌧️ 今天有雨，别忘了带伞！',
                '❄️ 天气较冷，记得多穿点！',
                '💨 今天风大，注意保暖哦！'
            ];
            const randomHint = hints[Math.floor(Math.random() * hints.length)];
            document.getElementById('weatherHint').textContent = randomHint;
        }

        function addCustomItem() {
            const input = document.getElementById('newItemInput');
            const text = input.value.trim();
            if (!text) return;

            customItems.push(text);
            input.value = '';
            renderChecklist();
            updateProgress();
        }

        function showComplete() {
            showPage('completePage');
        }

        function goBack() {
            showPage('checklistPage');
        }

        function goHome() {
            currentScene = null;
            checkedItems.clear();
            customItems = [];
            showPage('scenePage');
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }
    </script>
</body>
</html>
