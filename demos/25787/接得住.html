<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接得住 — 家庭突发情况演练</title>
<style>
:root {
  --bg: #FAF8F5;
  --bg-warm: #F5F0EA;
  --card: #FFFFFF;
  --primary: #7A9E7E;
  --primary-dark: #5E8462;
  --primary-light: #B8D4BB;
  --secondary: #C4A882;
  --secondary-light: #E8DDD3;
  --accent: #D4A574;
  --text: #4A4A4A;
  --text-light: #8A8A8A;
  --text-lighter: #B0B0B0;
  --border: #E8E2DA;
  --shadow: rgba(0,0,0,0.06);
  --shadow-md: rgba(0,0,0,0.1);
  --status-green: #7A9E7E;
  --status-yellow: #D4A574;
  --status-orange: #C4825A;
  --status-red: #B87070;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== Page System ===== */
.page {
  display: none;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.5s ease, transform 0.5s ease;
  min-height: 100vh;
}
.page.active {
  display: block;
  opacity: 1;
  transform: translateY(0);
}
.page.fade-in {
  animation: fadeIn 0.5s ease forwards;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ===== Homepage ===== */
.home-header {
  text-align: center;
  padding-top: 60px;
  padding-bottom: 40px;
}
.home-illustration {
  width: 200px;
  height: 200px;
  margin: 0 auto 32px;
}
.hero-badge {
  display: inline-block;
  background: var(--primary-light);
  color: var(--primary-dark);
  padding: 6px 18px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 1px;
  margin-bottom: 24px;
}
.hero-title {
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 16px;
  line-height: 1.4;
}
.hero-subtitle {
  font-size: 16px;
  color: var(--text-light);
  max-width: 520px;
  margin: 0 auto 40px;
  line-height: 1.8;
}
.privacy-promises {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 400px;
  margin: 0 auto 48px;
}
.promise-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 20px;
  font-size: 14px;
  color: var(--text);
}
.promise-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--primary-light);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.promise-icon svg { width: 16px; height: 16px; }

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 28px;
  padding: 16px 48px;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 4px 16px rgba(122,158,126,0.3);
}
.btn-primary:hover {
  background: var(--primary-dark);
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(122,158,126,0.4);
}
.btn-primary:active { transform: translateY(0); }

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--card);
  color: var(--primary-dark);
  border: 1.5px solid var(--primary);
  border-radius: 28px;
  padding: 14px 36px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
}
.btn-secondary:hover {
  background: var(--primary-light);
  transform: translateY(-1px);
}

.home-footer {
  text-align: center;
  padding: 40px 24px;
  font-size: 12px;
  color: var(--text-lighter);
  line-height: 1.8;
  max-width: 600px;
  margin: 0 auto;
}

/* ===== Scenario Page ===== */
.scenario-header {
  padding-top: 32px;
  padding-bottom: 20px;
}
.progress-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}
.progress-bar-bg {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 3px;
  transition: width 0.5s ease;
  width: 0%;
}
.progress-text {
  font-size: 13px;
  color: var(--text-light);
  white-space: nowrap;
}

.scenario-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: 0 2px 12px var(--shadow);
  padding: 32px 28px;
  margin-bottom: 24px;
  border: 1px solid var(--border);
}
.scenario-time {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-warm);
  color: var(--secondary);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 16px;
}
.scenario-time svg { width: 14px; height: 14px; }
.scenario-title {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text);
}
.scenario-desc {
  font-size: 15px;
  color: var(--text-light);
  line-height: 1.8;
  margin-bottom: 28px;
}

.options-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.option-btn {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  cursor: pointer;
  transition: var(--transition);
  text-align: left;
  font-size: 15px;
  line-height: 1.6;
  color: var(--text);
  width: 100%;
}
.option-btn:hover {
  border-color: var(--primary);
  background: rgba(122,158,126,0.06);
}
.option-btn.selected {
  border-color: var(--primary);
  background: rgba(122,158,126,0.1);
}
.option-letter {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-light);
  flex-shrink: 0;
  transition: var(--transition);
}
.option-btn.selected .option-letter {
  background: var(--primary);
  color: #fff;
}
.option-text { flex: 1; }

.scenario-nav {
  display: flex;
  justify-content: flex-end;
  margin-top: 8px;
}
.btn-next {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 24px;
  padding: 12px 28px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  opacity: 0.4;
  pointer-events: none;
}
.btn-next.enabled {
  opacity: 1;
  pointer-events: auto;
}
.btn-next.enabled:hover {
  background: var(--primary-dark);
}

/* ===== Results Page ===== */
.results-header {
  text-align: center;
  padding-top: 48px;
  padding-bottom: 32px;
}
.results-header h2 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
}
.results-header p {
  font-size: 15px;
  color: var(--text-light);
}

.readiness-ring {
  width: 160px;
  height: 160px;
  margin: 24px auto;
  position: relative;
}
.readiness-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--border); stroke-width: 8; }
.ring-fill {
  fill: none;
  stroke: var(--primary);
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 1.5s ease;
}
.readiness-score {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.readiness-score .num {
  font-size: 36px;
  font-weight: 700;
  color: var(--primary-dark);
}
.readiness-score .label {
  font-size: 12px;
  color: var(--text-light);
}

.modules-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 48px;
}
.module-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 20px;
  cursor: pointer;
  transition: var(--transition);
}
.module-card:hover {
  box-shadow: 0 4px 16px var(--shadow-md);
  transform: translateY(-2px);
}
.module-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
}
.module-icon svg { width: 20px; height: 20px; }
.module-name {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 6px;
}
.module-status {
  font-size: 13px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 12px;
  display: inline-block;
}
.status-green { background: rgba(122,158,126,0.15); color: var(--status-green); }
.status-yellow { background: rgba(212,165,116,0.15); color: var(--status-yellow); }
.status-orange { background: rgba(196,130,90,0.15); color: var(--status-orange); }
.status-red { background: rgba(184,112,112,0.15); color: var(--status-red); }

/* ===== Action Items ===== */
.section-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-title svg { width: 22px; height: 22px; color: var(--primary); }

.action-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-bottom: 48px;
}
.action-item {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 20px 24px;
}
.action-num {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
}
.action-content h4 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 4px;
}
.action-content p {
  font-size: 13px;
  color: var(--text-light);
  line-height: 1.6;
}

/* ===== AI Script ===== */
.script-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 48px;
  position: relative;
}
.script-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  border-radius: var(--radius) var(--radius) 0 0;
}
.script-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-warm);
  color: var(--secondary);
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 16px;
}
.script-text {
  font-size: 15px;
  line-height: 2;
  color: var(--text);
  padding: 16px 20px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--primary);
}

/* ===== Restart ===== */
.restart-section {
  text-align: center;
  padding: 24px 0 48px;
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
}

/* ===== Modal ===== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-overlay.show { display: flex; }
.modal-content {
  background: var(--card);
  border-radius: var(--radius);
  max-width: 560px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 32px;
  position: relative;
  animation: modalIn 0.3s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 32px;
  height: 32px;
  border: none;
  background: var(--bg);
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-light);
  font-size: 18px;
  transition: var(--transition);
}
.modal-close:hover { background: var(--border); }
.modal-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 8px;
}
.modal-status {
  margin-bottom: 20px;
}
.modal-source {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin-bottom: 12px;
}
.modal-source-label {
  font-size: 12px;
  color: var(--text-lighter);
  margin-bottom: 6px;
}
.modal-source-q {
  font-size: 14px;
  color: var(--text);
  margin-bottom: 6px;
}
.modal-source-a {
  font-size: 13px;
  color: var(--primary-dark);
  padding: 8px 12px;
  background: rgba(122,158,126,0.08);
  border-radius: var(--radius-xs);
}

/* ===== Footer ===== */
.page-footer {
  text-align: center;
  padding: 32px 24px 48px;
  font-size: 12px;
  color: var(--text-lighter);
  line-height: 1.8;
  max-width: 600px;
  margin: 0 auto;
  border-top: 1px solid var(--border);
}

/* ===== Responsive ===== */
@media (max-width: 640px) {
  .hero-title { font-size: 22px; }
  .hero-subtitle { font-size: 14px; }
  .modules-grid { grid-template-columns: 1fr; }
  .scenario-card { padding: 24px 20px; }
  .container { padding: 0 16px; }
  .home-header { padding-top: 40px; }
  .btn-primary { padding: 14px 36px; font-size: 16px; }
  .restart-section { flex-direction: column; align-items: center; }
}

/* ===== Animations ===== */
.slide-up {
  opacity: 0;
  transform: translateY(20px);
  animation: slideUp 0.5s ease forwards;
}
@keyframes slideUp {
  to { opacity: 1; transform: translateY(0); }
}
.delay-1 { animation-delay: 0.1s; }
.delay-2 { animation-delay: 0.2s; }
.delay-3 { animation-delay: 0.3s; }
.delay-4 { animation-delay: 0.4s; }
.delay-5 { animation-delay: 0.5s; }
.delay-6 { animation-delay: 0.6s; }

/* ===== Decorative ===== */
.home-deco {
  position: absolute;
  border-radius: 50%;
  opacity: 0.15;
  pointer-events: none;
}
</style>
</head>
<body>

<!-- ===== PAGE: HOME ===== -->
<div id="page-home" class="page active">
  <div class="container">
    <div class="home-header">
      <div class="home-illustration">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Background circle -->
          <circle cx="100" cy="100" r="90" fill="#F0EDE6" opacity="0.6"/>
          <!-- Warm glow -->
          <circle cx="100" cy="100" r="70" fill="url(#homeGrad1)" opacity="0.4"/>
          <!-- Supportive arc (hands holding) -->
          <path d="M40 130 Q60 160 100 155 Q140 150 160 130" stroke="#7A9E7E" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
          <path d="M50 140 Q70 165 100 160 Q130 155 150 140" stroke="#C4A882" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
          <!-- Family circles -->
          <circle cx="72" cy="78" r="18" fill="#7A9E7E" opacity="0.25"/>
          <circle cx="100" cy="68" r="20" fill="#7A9E7E" opacity="0.35"/>
          <circle cx="128" cy="78" r="18" fill="#C4A882" opacity="0.3"/>
          <!-- Connection lines -->
          <line x1="88" y1="80" x2="112" y2="80" stroke="#7A9E7E" stroke-width="1.5" opacity="0.3"/>
          <line x1="80" y1="90" x2="100" y2="85" stroke="#C4A882" stroke-width="1.5" opacity="0.25"/>
          <line x1="120" y1="90" x2="100" y2="85" stroke="#C4A882" stroke-width="1.5" opacity="0.25"/>
          <!-- Small dots -->
          <circle cx="55" cy="95" r="3" fill="#C4A882" opacity="0.4"/>
          <circle cx="145" cy="95" r="3" fill="#7A9E7E" opacity="0.4"/>
          <circle cx="100" cy="110" r="4" fill="#D4A574" opacity="0.35"/>
          <circle cx="80" cy="115" r="2.5" fill="#7A9E7E" opacity="0.3"/>
          <circle cx="120" cy="115" r="2.5" fill="#C4A882" opacity="0.3"/>
          <!-- Top accent -->
          <circle cx="100" cy="45" r="6" fill="#7A9E7E" opacity="0.2"/>
          <defs>
            <radialGradient id="homeGrad1" cx="50%" cy="50%">
              <stop offset="0%" stop-color="#7A9E7E" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#C4A882" stop-opacity="0.1"/>
            </radialGradient>
          </defs>
        </svg>
      </div>
      <div class="hero-badge">家庭突发情况演练</div>
      <h1 class="hero-title">当父母突然需要你，<br>你接得住吗？</h1>
      <p class="hero-subtitle">用一次温和的情境演练，发现家庭准备中的关键缺口，把巨大的担忧变成三件现在就能完成的小事。</p>
    </div>

    <div class="privacy-promises">
      <div class="promise-item slide-up delay-1">
        <div class="promise-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5E8462" stroke-width="2" stroke-linecap="round"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M5 8H4a4 4 0 000 8h1"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
        </div>
        <span>不要求上传证件</span>
      </div>
      <div class="promise-item slide-up delay-2">
        <div class="promise-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5E8462" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        </div>
        <span>不记录银行卡密码</span>
      </div>
      <div class="promise-item slide-up delay-3">
        <div class="promise-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5E8462" stroke-width="2" stroke-linecap="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        </div>
        <span>不提供医疗诊断</span>
      </div>
    </div>

    <div style="text-align:center" class="slide-up delay-4">
      <button class="btn-primary" onclick="startDrill()">
        开始 5 分钟演练
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>
  <div class="home-footer">
    本产品仅提供家庭准备与公共服务信息辅助，<br>不替代医疗、法律或其他专业机构意见。
  </div>
</div>

<!-- ===== PAGE: SCENARIO ===== -->
<div id="page-scenario" class="page">
  <div class="container">
    <div class="scenario-header">
      <div class="progress-wrap">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <span class="progress-text" id="progressText">1 / 8</span>
      </div>
    </div>
    <div id="scenarioContent"></div>
  </div>
</div>

<!-- ===== PAGE: RESULTS ===== -->
<div id="page-results" class="page">
  <div class="container">
    <div class="results-header">
      <h2>你的家庭应急准备地图</h2>
      <p>基于你的演练回答，以下是各维度的评估结果</p>
      <div class="readiness-ring">
        <svg viewBox="0 0 160 160">
          <circle class="ring-bg" cx="80" cy="80" r="66"/>
          <circle class="ring-fill" id="ringFill" cx="80" cy="80" r="66"
            stroke-dasharray="414.69" stroke-dashoffset="414.69"/>
        </svg>
        <div class="readiness-score">
          <div class="num" id="scoreNum">0</div>
          <div class="label">准备度</div>
        </div>
      </div>

// ===== State =====
let currentQ = 0;

// ===== Navigation =====
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => {
    p.classList.remove('active', 'fade-in');
  });
  const page = document.getElementById('page-' + id);
  page.classList.add('active', 'fade-in');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goHome() {
  showPage('home');
}

function startDrill() {
  currentQ = 0;
  answers = new Array(questions.length).fill(-1);
  showPage('scenario');
  renderQuestion();
}

function restartDrill() {
  startDrill();
}

// ===== Scenario =====
function renderQuestion() {
  const q = questions[currentQ];
  const selected = answers[currentQ];
  const progress = ((currentQ) / questions.length * 100);

  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('progressText').textContent = (currentQ + 1) + ' / ' + questions.length;

  let timeLabel = q.day + ' · ' + q.time;
  if (!q.time) timeLabel = q.day;

  let html = `
    <div class="scenario-card slide-up">
      <div class="scenario-time">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
        ${timeLabel}
      </div>
      <h2 class="scenario-title">${q.title}</h2>
      <p class="scenario-desc">${q.scenario}</p>
      <div class="options-list">
  `;

  const letters = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    const sel = selected === i ? ' selected' : '';
    html += `
      <button class="option-btn${sel}" onclick="selectOption(${i})" id="opt-${i}">
        <span class="option-letter">${letters[i]}</span>
        <span class="option-text">${opt}</span>
      </button>
    `;
  });

  html += `</div>
    <div class="scenario-nav">
      <button class="btn-next${selected >= 0 ? ' enabled' : ''}" id="btnNext" onclick="nextQuestion()">
        ${currentQ < questions.length - 1 ? '下一题' : '查看结果'}
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>`;

  document.getElementById('scenarioContent').innerHTML = html;
}

function selectOption(idx) {
  answers[currentQ] = idx;
  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === idx);
  });
  document.getElementById('btnNext').classList.add('enabled');
}

function nextQuestion() {
  if (answers[currentQ] < 0) return;
  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    showResults();
  }
}

// ===== Results =====
function showResults() {
  showPage('results');

  // Calculate module scores
  const moduleScores = {};
  modules.forEach(m => {
    let total = 0;
    m.questions.forEach(qi => { total += answers[qi]; });
    const avg = total / m.questions.length;
    moduleScores[m.id] = Math.round(avg);
  });

  // Overall score (invert: 0 = best, 3 = worst)
  let totalGap = 0;
  let totalQ = 0;
  modules.forEach(m => {
    totalGap += moduleScores[m.id] * m.questions.length;
    totalQ += m.questions.length;
  });
  // Exclude priority question from overall score
  const overallGap = totalGap / totalQ;
  const readiness = Math.round((1 - overallGap / 3) * 100);

  // Animate ring
  setTimeout(() => {
    const circumference = 2 * Math.PI * 66;
    const offset = circumference * (1 - readiness / 100);
    document.getElementById('ringFill').style.strokeDashoffset = offset;

    // Animate number
    animateNumber('scoreNum', 0, readiness, 1200);
  }, 300);

  // Render modules
  let modulesHtml = '';
  modules.forEach((m, idx) => {
    const score = moduleScores[m.id];
    const statusIdx = Math.min(score, 3);
    modulesHtml += `
      <div class="module-card slide-up delay-${idx + 1}" onclick="showModuleDetail('${m.id}', ${score})">
        <div class="module-icon" style="background:${m.color}20">
          <span style="color:${m.color}">${moduleIcons[m.icon]}</span>
        </div>
        <div class="module-name">${m.name}</div>
        <span class="module-status ${statusClasses[statusIdx]}">${statusLabels[statusIdx]}</span>
      </div>
    `;
  });
  document.getElementById('modulesGrid').innerHTML = modulesHtml;

  // Generate top 3 actions
  const sorted = modules.map(m => ({ id: m.id, score: moduleScores[m.id] }))
    .sort((a, b) => b.score - a.score);
  const top3 = sorted.slice(0, 3);

  // But incorporate priority question
  const priorityAnswer = answers[7];
  const priorityModules = ["medical", "documents", "contact", "finance"];
  const userPriority = priorityModules[priorityAnswer];

  // Adjust: if user's priority is not in top 3, replace the lowest-priority item
  let actionModules = top3.map(t => t.id);
  if (!actionModules.includes(userPriority)) {
    // Replace the item with lowest score that's not the user's priority
    const replaceIdx = actionModules.length - 1;
    actionModules[replaceIdx] = userPriority;
  }

  let actionsHtml = '';
  actionModules.forEach((mid, idx) => {
    const action = actionMap[mid];
    actionsHtml += `
      <div class="action-item slide-up delay-${idx + 1}">
        <div class="action-num">${idx + 1}</div>
        <div class="action-content">
          <h4>${action.title}</h4>
          <p>${action.desc}</p>
        </div>
      </div>
    `;
  });
  document.getElementById('actionList').innerHTML = actionsHtml;

  // Generate AI script based on worst module
  const worstModule = sorted[0].id;
  const script = scriptMap[worstModule];
  document.getElementById('scriptCard').innerHTML = `
    <div class="script-label">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      沟通建议
    </div>
    <div class="script-text">${script}</div>
  `;
}

function animateNumber(elementId, start, end, duration) {
  const el = document.getElementById(elementId);
  const range = end - start;
  const startTime = performance.now();
  function update(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    // Ease out
    const eased = 1 - Math.pow(1 - progress, 3);
    const current = Math.round(start + range * eased);
    el.textContent = current;
    if (progress < 1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

// ===== Module Detail Modal =====
function showModuleDetail(moduleId, score) {
  const m = modules.find(x => x.id === moduleId);
  const statusIdx = Math.min(score, 3);

  let sourcesHtml = '';
  m.questions.forEach(qi => {
    const q = questions[qi];
    const userAnswer = answers[qi];
    sourcesHtml += `
      <div class="modal-source">
        <div class="modal-source-label">来自第 ${qi + 1} 题 · ${q.day}${q.time ? ' · ' + q.time : ''}</div>
        <div class="modal-source-q">${q.scenario}</div>
        <div class="modal-source-a">你的回答：${q.options[userAnswer]}</div>
      </div>
    `;
  });

  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" onclick="closeModal(event, true)">&times;</button>
    <div class="modal-title">${m.name}</div>
    <div class="modal-status">
      <span class="module-status ${statusClasses[statusIdx]}">${statusLabels[statusIdx]}</span>
    </div>
    <p style="font-size:14px;color:var(--text-light);margin-bottom:20px;line-height:1.7;">
      以下是你在此维度的回答，结论基于这些回答得出。
    </p>
    ${sourcesHtml}
  `;

  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal(event, force) {
  if (force || event.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('show');
    document.body.style.overflow = '';
  }
}

// ===== Keyboard support =====
document.addEventListener('keydown', function(e) {
  if (document.getElementById('page-scenario').classList.contains('active')) {
    const keyMap = { 'a': 0, 'b': 1, 'c': 2, 'd': 3, '1': 0, '2': 1, '3': 2, '4': 3 };
    const idx = keyMap[e.key.toLowerCase()];
    if (idx !== undefined) {
      selectOption(idx);
    }
    if (e.key === 'Enter' && answers[currentQ] >= 0) {
      nextQuestion();
    }
  }
  if (e.key === 'Escape') {
    closeModal(null, true);
  }
});

// ===== Init =====
document.addEventListener('DOMContentLoaded', function() {
  showPage('home');
});
</script>
