<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 个性化音乐推荐小工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        
        .card h2 {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card h2 i {
            color: #667eea;
        }
        
        .mood-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .mood-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .mood-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .mood-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: transparent;
        }
        
        .recommendation-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .song-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }
        
        .song-item:hover {
            background: #f5f5f5;
            transform: translateX(5px);
        }
        
        .song-item.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .song-item.active .song-info p {
            color: rgba(255,255,255,0.8);
        }
        
        .song-cover {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            margin-right: 15px;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .song-info h3 {
            font-size: 1rem;
            margin-bottom: 3px;
        }
        
        .song-info p {
            font-size: 0.85rem;
            color: #888;
        }
        
        .player-section {
            grid-column: 1 / -1;
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        
        .player-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .current-cover {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .current-info {
            flex: 1;
        }
        
        .current-info h2 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 5px;
        }
        
        .current-info p {
            color: #666;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            transition: width 0.1s linear;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 20px;
        }
        
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #f0f0f0;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .control-btn:hover {
            background: #e0e0e0;
        }
        
        .control-btn.play {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 24px;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .control-btn.play:hover {
            transform: scale(1.1);
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 20px;
        }
        
        .volume-control input {
            width: 100px;
        }
        
        .recommend-algo {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        
        .recommend-algo h3 {
            font-size: 1rem;
            color: #333;
            margin-bottom: 10px;
        }
        
        .recommend-algo p {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.6;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.8rem;
            }
            
            .player-header {
                flex-direction: column;
                text-align: center;
            }
            
            .controls {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 个性化音乐推荐小工具</h1>
            <p>根据你的心情，为你推荐最适合的音乐</p>
        </header>
        
        <div class="main-content">
            <div class="card">
                <h2><i>🎭</i> 选择你的心情</h2>
                <div class="mood-selector">
                    <button class="mood-btn active" data-mood="happy">😊 开心</button>
                    <button class="mood-btn" data-mood="relaxed">😌 放松</button>
                    <button class="mood-btn" data-mood="energetic">⚡ 活力</button>
                    <button class="mood-btn" data-mood="chill">🌙 安静</button>
                    <button class="mood-btn" data-mood="romantic">💕 浪漫</button>
                    <button class="mood-btn" data-mood="sad">😢 伤感</button>
                </div>
            </div>
            
            <div class="card">
                <h2><i>🎶</i> 为你推荐</h2>
                <div class="recommendation-list" id="recommendationList">
                </div>
            </div>
            
            <div class="player-section">
                <div class="player-header">
                    <div class="current-cover" id="currentCover">🎵</div>
                    <div class="current-info">
                        <h2 id="currentTitle">选择一首歌曲开始播放</h2>
                        <p id="currentArtist">点击上方心情按钮获取推荐</p>
                    </div>
                </div>
                
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
                
                <div class="progress-bar" id="progressBar">
                    <div class="progress" id="progress"></div>
                </div>
                
                <div class="controls">
                    <button class="control-btn" id="prevBtn">⏮</button>
                    <button class="control-btn play" id="playBtn">▶</button>
                    <button class="control-btn" id="nextBtn">⏭</button>
                    <button class="control-btn" id="shuffleBtn">🔀</button>
                    <button class="control-btn" id="repeatBtn">🔁</button>
                    
                    <div class="volume-control">
                        <span>🔊</span>
                        <input type="range" id="volumeSlider" min="0" max="100" value="70">
                    </div>
                </div>
                
                <div class="recommend-algo">
                    <h3>💡 推荐算法说明</h3>
                    <p>我们的智能推荐系统会根据您选择的心情标签，结合音乐的节奏、音调、能量值等特征进行匹配。系统还会学习您的播放历史，持续优化推荐结果，为您带来最贴心的音乐体验。</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const songsData = {
            happy: [
                { title: "快乐崇拜", artist: "潘玮柏 & 张韶涵", duration: "3:45", cover: "🌈" },
                { title: "阳光彩虹小白马", artist: "大张伟", duration: "3:12", cover: "☀️" },
                { title: "好运来", artist: "祖海", duration: "3:40", cover: "🍀" },
                { title: "庆祝", artist: "杨丞琳", duration: "3:28", cover: "🎉" },
                { title: "快乐出发", artist: "天娱群星", duration: "3:56", cover: "🚀" }
            ],
            relaxed: [
                { title: "卡农", artist: "钢琴曲", duration: "4:32", cover: "🎹" },
                { title: "River Flows in You", artist: "Yiruma", duration: "3:05", cover: "🌊" },
                { title: "天空之城", artist: "久石让", duration: "4:23", cover: "🏰" },
                { title: "秋日私语", artist: "理查德·克莱德曼", duration: "3:58", cover: "🍂" },
                { title: "月光", artist: "德彪西", duration: "5:12", cover: "🌙" }
            ],
            energetic: [
                { title: "夜曲", artist: "周杰伦", duration: "4:23", cover: "🎸" },
                { title: "逆战", artist: "张杰", duration: "3:51", cover: "⚔️" },
                { title: "阳光宅男", artist: "周杰伦", duration: "3:49", cover: "🏀" },
                { title: "Super Star", artist: "S.H.E", duration: "3:18", cover: "⭐" },
                { title: "火力全开", artist: "王力宏", duration: "3:45", cover: "🔥" }
            ],
            chill: [
                { title: "成都", artist: "赵雷", duration: "5:28", cover: "🌃" },
                { title: "南方姑娘", artist: "赵雷", duration: "5:34", cover: "🌸" },
                { title: "夜空中最亮的星", artist: "逃跑计划", duration: "4:12", cover: "⭐" },
                { title: "平凡之路", artist: "朴树", duration: "4:46", cover: "🛤️" },
                { title: "往后余生", artist: "马良", duration: "4:05", cover: "💑" }
            ],
            romantic: [
                { title: "告白气球", artist: "周杰伦", duration: "3:35", cover: "🎈" },
                { title: "小幸运", artist: "田馥甄", duration: "4:25", cover: "💫" },
                { title: "遇见", artist: "孙燕姿", duration: "3:31", cover: "🌸" },
                { title: "童话", artist: "光良", duration: "4:05", cover: "🧚" },
                { title: "爱你", artist: "王心凌", duration: "3:42", cover: "💗" }
            ],
            sad: [
                { title: "后来", artist: "刘若英", duration: "5:41", cover: "🌧️" },
                { title: "可惜不是你", artist: "梁静茹", duration: "4:47", cover: "💔" },
                { title: "洋葱", artist: "杨宗纬", duration: "4:38", cover: "🧅" },
                { title: "成全", artist: "林宥嘉", duration: "4:42", cover: "🍂" },
                { title: "说好不哭", artist: "周杰伦", duration: "4:03", cover: "😢" }
            ]
        };
        
        let currentMood = "happy";
        let currentSongIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let repeatMode = "off";
        let audioElement;
        
        const moodButtons = document.querySelectorAll('.mood-btn');
        const recommendationList = document.getElementById('recommendationList');
        const currentCover = document.getElementById('currentCover');
        const currentTitle = document.getElementById('currentTitle');
        const currentArtist = document.getElementById('currentArtist');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        const currentTime = document.getElementById('currentTime');
        const totalTime = document.getElementById('totalTime');
        
        function renderRecommendations() {
            recommendationList.innerHTML = '';
            const songs = songsData[currentMood];
            
            songs.forEach((song, index) => {
                const songItem = document.createElement('div');
                songItem.className = `song-item ${index === currentSongIndex && isPlaying ? 'active' : ''}`;
                songItem.innerHTML = `
                    <div class="song-cover">${song.cover}</div>
                    <div class="song-info">
                        <h3>${song.title}</h3>
                        <p>${song.artist} - ${song.duration}</p>
                    </div>
                `;
                
                songItem.addEventListener('click', () => {
                    playSong(index);
                });
                
                recommendationList.appendChild(songItem);
            });
        }
        
        function playSong(index) {
            currentSongIndex = index;
            const song = songsData[currentMood][index];
            
            currentTitle.textContent = song.title;
            currentArtist.textContent = song.artist;
            currentCover.textContent = song.cover;
            
            if (audioElement) {
                audioElement.pause();
            }
            
            audioElement = new Audio();
            audioElement.volume = volumeSlider.value / 100;
            
            audioElement.addEventListener('loadedmetadata', () => {
                totalTime.textContent = formatTime(audioElement.duration);
            });
            
            audioElement.addEventListener('timeupdate', () => {
                updateProgress();
            });
            
            audioElement.addEventListener('ended', () => {
                handleSongEnd();
            });
            
            audioElement.src = 'data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdH2Onpmchol2b2Z1bXNldJRiYmJjZGVlZmdoaWprbG1ub3BxcnN0dXZ3eHl6e3x9fn+AgYKDhIWGh4iJiouMjY6PkJGSk5SVlpeYmZqbnJ2en6ChoqOkpaanqKmqq6ytrq+wsbKztLW2t7i5uru8vb6/wMHCw8TFxsfIycrLzM3Oz9DR0tPU1dbX2Nna29zd3t/g4eLj5OXm5+jp6uvs7e7v8PHy8/T19vf4+fr7/P3+/w==';
            
            audioElement.play().then(() => {
                isPlaying = true;
                playBtn.textContent = '⏸';
                updateActiveSong();
            }).catch(() => {
                console.log('Auto-play blocked by browser');
            });
        }
        
        function updateProgress() {
            if (audioElement && audioElement.duration) {
                const percent = (audioElement.currentTime / audioElement.duration) * 100;
                progress.style.width = `${percent}%`;
                currentTime.textContent = formatTime(audioElement.currentTime);
            }
        }
        
        function formatTime(time) {
            const minutes = Math.floor(time / 60);
            const seconds = Math.floor(time % 60);
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }
        
        function handleSongEnd() {
            if (repeatMode === 'one') {
                audioElement.currentTime = 0;
                audioElement.play();
            } else if (repeatMode === 'all') {
                playNext();
            } else if (isShuffle) {
                const randomIndex = Math.floor(Math.random() * songsData[currentMood].length);
                playSong(randomIndex);
            } else {
                playNext();
            }
        }
        
        function playNext() {
            const songs = songsData[currentMood];
            if (currentSongIndex < songs.length - 1) {
                playSong(currentSongIndex + 1);
            } else {
                if (repeatMode === 'all') {
                    playSong(0);
                } else {
                    isPlaying = false;
                    playBtn.textContent = '▶';
                }
            }
        }
        
        function playPrev() {
            const songs = songsData[currentMood];
            if (currentSongIndex > 0) {
                playSong(currentSongIndex - 1);
            } else {
                playSong(songs.length - 1);
            }
        }
        
        function updateActiveSong() {
            const songItems = document.querySelectorAll('.song-item');
            songItems.forEach((item, index) => {
                item.classList.toggle('active', index === currentSongIndex && isPlaying);
            });
        }
        
        moodButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                moodButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMood = btn.dataset.mood;
                currentSongIndex = 0;
                renderRecommendations();
            });
        });
        
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                audioElement.pause();
                isPlaying = false;
                playBtn.textContent = '▶';
            } else {
                if (!audioElement) {
                    playSong(0);
                } else {
                    audioElement.play();
                    isPlaying = true;
                    playBtn.textContent = '⏸';
                }
            }
        });
        
        prevBtn.addEventListener('click', playPrev);
        nextBtn.addEventListener('click', playNext);
        
        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.style.background = isShuffle ? '#667eea' : '#f0f0f0';
            shuffleBtn.style.color = isShuffle ? 'white' : 'inherit';
        });
        
        repeatBtn.addEventListener('click', () => {
            const modes = ['off', 'all', 'one'];
            const currentIndex = modes.indexOf(repeatMode);
            repeatMode = modes[(currentIndex + 1) % modes.length];
            
            if (repeatMode === 'off') {
                repeatBtn.style.background = '#f0f0f0';
                repeatBtn.style.color = 'inherit';
            } else {
                repeatBtn.style.background = '#667eea';
                repeatBtn.style.color = 'white';
            }
        });
        
        volumeSlider.addEventListener('input', (e) => {
            if (audioElement) {
                audioElement.volume = e.target.value / 100;
            }
        });
        
        progressBar.addEventListener('click', (e) => {
            if (audioElement) {
                const percent = e.offsetX / progressBar.offsetWidth;
                audioElement.currentTime = percent * audioElement.duration;
            }
        });
        
        renderRecommendations();
    </script>
</body>
</html>
