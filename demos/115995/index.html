<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公司吐槽大会 - 职场口碑红黑榜</title>
<style>
:root {
  --accent: #FF6B35;
  --accent2: #f7931e;
  --red: #e74c3c;
  --red-light: #fdf2f2;
  --black: #2c3e50;
  --black-light: #f0f3f5;
  --bg: #f8f9fa;
  --bg2: #ffffff;
  --ink: #1a1a1a;
  --muted: #6c757d;
  --rule: #e9ecef;
  --green: #27ae60;
  --yellow: #f1c40f;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-hover: 0 8px 24px rgba(0,0,0,0.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  font-size: 15px;
}
a { text-decoration: none; color: inherit; }
ul { list-style: none; }

/* ===== Navigation ===== */
.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
  height: 60px;
}
.nav-container {
  max-width: 1200px; margin: 0 auto; padding: 0 20px;
  display: flex; align-items: center; height: 100%; gap: 24px;
}
.nav-logo {
  font-size: 1.3rem; font-weight: 800; color: var(--accent);
  white-space: nowrap; cursor: pointer;
}
.nav-logo span { color: var(--ink); }
.nav-tabs { display: flex; gap: 4px; }
.nav-tab {
  padding: 8px 16px; border-radius: 8px; cursor: pointer;
  font-size: 0.92rem; font-weight: 500; color: var(--muted);
  transition: all 0.2s; white-space: nowrap;
}
.nav-tab:hover { background: var(--bg); color: var(--ink); }
.nav-tab.active { background: var(--accent); color: #fff; }
.nav-search {
  flex: 1; max-width: 300px; position: relative; margin-left: auto;
}
.nav-search input {
  width: 100%; padding: 8px 12px 8px 36px;
  border: 1px solid var(--rule); border-radius: 20px;
  font-size: 0.88rem; outline: none; transition: border-color 0.2s;
  background: var(--bg);
}
.nav-search input:focus { border-color: var(--accent); }
.nav-search::before {
  content: '🔍'; position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%); font-size: 0.85rem;
}

/* ===== Main ===== */
.main { padding-top: 60px; min-height: 100vh; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }

/* ===== Stats Cards ===== */
.stats-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
  margin-bottom: 32px;
}
.stat-card {
  background: var(--bg2); border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); text-align: center;
}
.stat-card .stat-num {
  font-size: 2rem; font-weight: 800; color: var(--accent); line-height: 1.2;
}
.stat-card .stat-label { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
.stat-card.red .stat-num { color: var(--red); }
.stat-card.black .stat-num { color: var(--black); }

/* ===== Section Title ===== */
.section-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px;
}
.section-header h2 { font-size: 1.3rem; font-weight: 700; }
.section-header .more { font-size: 0.85rem; color: var(--accent); cursor: pointer; }

/* ===== Company Card ===== */
.company-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.company-card {
  background: var(--bg2); border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); cursor: pointer; transition: all 0.2s;
  border-left: 4px solid var(--rule); position: relative;
}
.company-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
.company-card.red { border-left-color: var(--red); }
.company-card.black { border-left-color: var(--black); }
.company-card .card-top {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 12px;
}
.company-card .company-name { font-size: 1.1rem; font-weight: 700; }
.company-card .industry-tag {
  font-size: 0.75rem; color: var(--muted); background: var(--bg);
  padding: 2px 10px; border-radius: 10px;
}
.company-card .card-stats {
  display: flex; gap: 16px; font-size: 0.82rem; color: var(--muted);
}
.company-card .badge {
  position: absolute; top: 16px; right: 16px;
  font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; font-weight: 600;
}
.badge.red { background: var(--red-light); color: var(--red); }
.badge.black { background: var(--black-light); color: var(--black); }

/* ===== Star Rating ===== */
.stars { display: inline-flex; gap: 2px; }
.stars .star { color: var(--rule); font-size: 1rem; }
.stars .star.filled { color: var(--yellow); }
.stars .star.half { color: var(--yellow); }

/* ===== Industry Filter ===== */
.industry-bar {
  display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap;
}
.industry-tag {
  padding: 6px 16px; border-radius: 20px; cursor: pointer;
  font-size: 0.85rem; background: var(--bg2); border: 1px solid var(--rule);
  transition: all 0.2s; color: var(--muted);
}
.industry-tag:hover { border-color: var(--accent); color: var(--accent); }
.industry-tag.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ===== Sort Bar ===== */
.sort-bar {
  display: flex; gap: 12px; margin-bottom: 20px; align-items: center;
}
.sort-bar .sort-label { font-size: 0.85rem; color: var(--muted); }
.sort-btn {
  padding: 4px 12px; border-radius: 6px; cursor: pointer;
  font-size: 0.82rem; background: var(--bg); border: 1px solid var(--rule);
  transition: all 0.2s;
}
.sort-btn:hover { border-color: var(--accent); }
.sort-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ===== Red/Black Ranking ===== */
.ranking-tabs {
  display: flex; gap: 0; margin-bottom: 24px;
  border-bottom: 2px solid var(--rule);
}
.ranking-tab {
  padding: 12px 32px; cursor: pointer; font-size: 1rem; font-weight: 600;
  color: var(--muted); border-bottom: 3px solid transparent; transition: all 0.2s;
  margin-bottom: -2px;
}
.ranking-tab.active.red { color: var(--red); border-bottom-color: var(--red); }
.ranking-tab.active.black { color: var(--black); border-bottom-color: var(--black); }

.ranking-list { display: flex; flex-direction: column; gap: 12px; }
.ranking-item {
  display: flex; align-items: center; gap: 16px;
  background: var(--bg2); border-radius: var(--radius); padding: 16px 20px;
  box-shadow: var(--shadow); cursor: pointer; transition: all 0.2s;
}
.ranking-item:hover { transform: translateX(4px); box-shadow: var(--shadow-hover); }
.ranking-item .rank-num {
  width: 36px; height: 36px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem;
  flex-shrink: 0;
}
.rank-num.top1 { background: #ffd700; color: #fff; }
.rank-num.top2 { background: #c0c0c0; color: #fff; }
.rank-num.top3 { background: #cd7f32; color: #fff; }
.rank-num.other { background: var(--bg); color: var(--muted); }
.ranking-item .rank-info { flex: 1; }
.ranking-item .rank-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 2px; }
.ranking-item .rank-meta { font-size: 0.8rem; color: var(--muted); }
.ranking-item .rank-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.ranking-item .rank-tag {
  font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; background: var(--bg);
}
.ranking-item .rank-score { text-align: right; flex-shrink: 0; }
.ranking-item .rank-score-num { font-size: 1.4rem; font-weight: 800; }
.ranking-item .rank-score-num.red { color: var(--red); }
.ranking-item .rank-score-num.black { color: var(--black); }
.ranking-item .rank-score-label { font-size: 0.72rem; color: var(--muted); }

/* ===== Review Feed ===== */
.review-feed { display: flex; flex-direction: column; gap: 12px; }
.review-item {
  background: var(--bg2); border-radius: var(--radius); padding: 16px 20px;
  box-shadow: var(--shadow); border-left: 4px solid var(--rule);
}
.review-item.red { border-left-color: var(--red); }
.review-item.black { border-left-color: var(--black); }
.review-item .review-top {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.review-item .review-company {
  font-weight: 700; cursor: pointer; color: var(--accent);
}
.review-item .review-time { font-size: 0.78rem; color: var(--muted); }
.review-item .review-tags { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.review-item .review-tag {
  font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; background: var(--bg);
}
.review-item .review-content { font-size: 0.9rem; color: var(--ink); margin-bottom: 8px; }
.review-item .review-bottom {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.8rem; color: var(--muted);
}
.review-item .like-btn {
  cursor: pointer; display: flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 12px; transition: all 0.2s;
}
.review-item .like-btn:hover { background: var(--red-light); color: var(--red); }
.review-item .like-btn.liked { color: var(--red); }

/* ===== Form ===== */
.post-form {
  background: var(--bg2); border-radius: var(--radius); padding: 32px;
  box-shadow: var(--shadow); max-width: 640px; margin: 0 auto;
}
.form-group { margin-bottom: 20px; }
.form-group label {
  display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem;
}
.form-group label .required { color: var(--red); }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 10px 14px; border: 1px solid var(--rule);
  border-radius: 8px; font-size: 0.92rem; outline: none; transition: border-color 0.2s;
  font-family: inherit;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { min-height: 120px; resize: vertical; }
.form-radios { display: flex; gap: 16px; }
.form-radio {
  display: flex; align-items: center; gap: 6px; cursor: pointer;
  padding: 8px 16px; border-radius: 8px; border: 1px solid var(--rule);
  transition: all 0.2s; font-size: 0.9rem;
}
.form-radio:hover { border-color: var(--accent); }
.form-radio.selected.red { background: var(--red-light); border-color: var(--red); color: var(--red); }
.form-radio.selected.black { background: var(--black-light); border-color: var(--black); color: var(--black); }
.tag-checkboxes { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-checkbox {
  padding: 6px 14px; border-radius: 16px; border: 1px solid var(--rule);
  cursor: pointer; font-size: 0.85rem; transition: all 0.2s; color: var(--muted);
}
.tag-checkbox:hover { border-color: var(--accent); }
.tag-checkbox.checked { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Star Input */
.star-input { display: flex; gap: 4px; }
.star-input .star {
  font-size: 1.8rem; cursor: pointer; color: var(--rule); transition: color 0.15s;
}
.star-input .star.active { color: var(--yellow); }

/* Submit Button */
.btn-submit {
  width: 100%; padding: 14px; background: var(--accent); color: #fff;
  border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
  cursor: pointer; transition: background 0.2s;
}
.btn-submit:hover { background: #e55a2b; }

/* ===== Company Detail ===== */
.detail-header {
  background: var(--bg2); border-radius: var(--radius); padding: 28px;
  box-shadow: var(--shadow); margin-bottom: 24px;
}
.detail-header .detail-top {
  display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px;
}
.detail-header .detail-name { font-size: 1.8rem; font-weight: 800; }
.detail-header .detail-badge {
  font-size: 0.82rem; padding: 4px 14px; border-radius: 12px; font-weight: 600;
}
.detail-badge.red { background: var(--red-light); color: var(--red); }
.detail-badge.black { background: var(--black-light); color: var(--black); }
.detail-badge.neutral { background: var(--bg); color: var(--muted); }
.detail-header .detail-meta {
  display: flex; gap: 24px; font-size: 0.88rem; color: var(--muted);
}

/* Rating Distribution */
.rating-dist { display: flex; flex-direction: column; gap: 6px; margin: 20px 0; }
.rating-row { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; }
.rating-row .rating-label { width: 40px; color: var(--muted); }
.rating-row .rating-bar {
  flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden;
}
.rating-row .rating-fill { height: 100%; background: var(--yellow); border-radius: 4px; transition: width 0.3s; }
.rating-row .rating-count { width: 30px; text-align: right; color: var(--muted); }

/* Tag Cloud */
.tag-cloud { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.tag-cloud-item {
  padding: 4px 12px; border-radius: 14px; background: var(--bg);
  font-size: 0.82rem; color: var(--muted);
}

/* Related Companies */
.related-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px;
}

/* ===== Search Results ===== */
.search-results { display: flex; flex-direction: column; gap: 12px; }
.search-result-item {
  background: var(--bg2); border-radius: var(--radius); padding: 16px 20px;
  box-shadow: var(--shadow); cursor: pointer; transition: all 0.2s;
}
.search-result-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.search-result-item .highlight { background: var(--yellow); padding: 0 2px; border-radius: 2px; }

/* ===== Empty State ===== */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--muted);
}
.empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
.empty-state .empty-text { font-size: 0.95rem; }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--black); color: #fff; padding: 12px 28px; border-radius: 24px;
  font-size: 0.9rem; z-index: 200; opacity: 0; transition: all 0.3s;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ===== Dashboard Sections ===== */
.dashboard-section { margin-bottom: 40px; }
.rb-preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.rb-preview-card {
  border-radius: var(--radius); padding: 20px; color: #fff;
}
.rb-preview-card.red { background: linear-gradient(135deg, var(--red), #c0392b); }
.rb-preview-card.black { background: linear-gradient(135deg, var(--black), #1a252f); }
.rb-preview-card h3 { font-size: 1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.rb-preview-card .rb-item {
  background: rgba(255,255,255,0.15); border-radius: 8px; padding: 8px 12px;
  margin-bottom: 6px; font-size: 0.85rem; display: flex; justify-content: space-between;
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .nav-container { gap: 12px; }
  .nav-tabs { display: none; }
  .nav-search { max-width: none; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .rb-preview-grid { grid-template-columns: 1fr; }
  .container { padding: 16px; }
  .post-form { padding: 20px; }
  .detail-header .detail-name { font-size: 1.4rem; }
}
@media (max-width: 480px) {
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .company-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<nav class="navbar">
  <div class="nav-container">
    <div class="nav-logo" onclick="router('home')">吐槽<span>大会</span></div>
    <div class="nav-tabs">
      <div class="nav-tab active" data-route="home" onclick="router('home')">首页</div>
      <div class="nav-tab" data-route="plaza" onclick="router('plaza')">公司广场</div>
      <div class="nav-tab" data-route="rankings" onclick="router('rankings')">红黑榜</div>
      <div class="nav-tab" data-route="post" onclick="router('post')">发布吐槽</div>
    </div>
    <div class="nav-search">
      <input type="text" id="searchInput" placeholder="搜索公司或吐槽内容..." oninput="handleSearch(this.value)">
    </div>
  </div>
</nav>

<div class="main">
  <div class="container" id="app"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 种子数据 =====
const SEED_COMPANIES = [
  { id: 'c1', name: '云图科技', industry: '互联网科技', createdAt: 1718000000000 },
  { id: 'c2', name: '星辰互娱', industry: '互联网科技', createdAt: 1718100000000 },
  { id: 'c3', name: '鼎盛金融', industry: '金融', createdAt: 1718200000000 },
  { id: 'c4', name: '恒信制造', industry: '制造业', createdAt: 1718300000000 },
  { id: 'c5', name: '启智教育', industry: '教育培训', createdAt: 1718400000000 },
  { id: 'c6', name: '仁和医疗', industry: '医疗健康', createdAt: 1718500000000 },
  { id: 'c7', name: '味佳餐饮', industry: '餐饮服务', createdAt: 1718600000000 },
  { id: 'c8', name: '安居地产', industry: '房地产', createdAt: 1718700000000 },
  { id: 'c9', name: '蓝海咨询', industry: '互联网科技', createdAt: 1718800000000 },
  { id: 'c10', name: '绿能科技', industry: '制造业', createdAt: 1718900000000 }
];

const SEED_REVIEWS = [
  { id: 'r1', companyId: 'c1', type: 'black', tags: ['加班文化', '薪酬福利'], content: '天天996，加班没有加班费，周末还要随叫随到。HR说的弹性工作制完全是画饼。', rating: 1, author: '匿名用户', likes: 42, createdAt: 1720000000000 },
  { id: 'r2', companyId: 'c1', type: 'black', tags: ['管理风格', '人际关系'], content: '管理层PUA严重，动不动就威胁裁员。同事之间内卷严重，毫无团队氛围。', rating: 2, author: '离职员工', likes: 35, createdAt: 1720100000000 },
  { id: 'r3', companyId: 'c1', type: 'black', tags: ['加班文化', '晋升发展'], content: '晋升全靠关系不靠能力，踏实干活的不如会拍马屁的。加班到半夜是常态。', rating: 1, author: '匿名用户', likes: 28, createdAt: 1720200000000 },
  { id: 'r4', companyId: 'c1', type: 'black', tags: ['薪酬福利', '工作环境'], content: '薪资低于行业平均水平，年终奖说有却没有。办公环境拥挤，工位小得转不了身。', rating: 2, author: '前员工', likes: 20, createdAt: 1720300000000 },
  { id: 'r5', companyId: 'c1', type: 'black', tags: ['管理风格'], content: '部门领导朝令夕改，今天定的方案明天就推翻。每天开会4小时以上，实际产出为零。', rating: 2, author: '匿名用户', likes: 15, createdAt: 1720400000000 },
  { id: 'r6', companyId: 'c2', type: 'red', tags: ['工作环境', '人际关系'], content: '团队氛围非常好，同事之间互帮互助。领导很有人情味，不会micro management。', rating: 5, author: '在职员工', likes: 38, createdAt: 1720500000000 },
  { id: 'r7', companyId: 'c2', type: 'red', tags: ['薪酬福利', '晋升发展'], content: '薪资有竞争力，每年调薪一次。晋升通道清晰，只要能力到了就能上，不卡人。', rating: 4, author: '匿名用户', likes: 25, createdAt: 1720600000000 },
  { id: 'r8', companyId: 'c2', type: 'red', tags: ['工作环境', '薪酬福利'], content: '办公环境一流，有免费健身房和下午茶。弹性打卡，不强制加班，work-life balance很好。', rating: 5, author: '满意员工', likes: 30, createdAt: 1720700000000 },
  { id: 'r9', companyId: 'c2', type: 'red', tags: ['晋升发展', '人际关系'], content: '入职三年晋升两次，领导愿意给机会和资源。团队年轻有活力，沟通成本低。', rating: 4, author: '匿名用户', likes: 18, createdAt: 1720800000000 },

const Storage = {
  init() {
    if (!localStorage.getItem('ct_initialized')) {
      localStorage.setItem('ct_companies', JSON.stringify(SEED_COMPANIES));
      localStorage.setItem('ct_reviews', JSON.stringify(SEED_REVIEWS));
      localStorage.setItem('ct_initialized', 'true');
    }
  },
  getCompanies() { return JSON.parse(localStorage.getItem('ct_companies') || '[]'); },
  getReviews() { return JSON.parse(localStorage.getItem('ct_reviews') || '[]'); },
  getCompanyById(id) { return this.getCompanies().find(c => c.id === id); },
  getReviewsByCompanyId(companyId) { return this.getReviews().filter(r => r.companyId === companyId); },
  addCompany(name, industry) {
    const companies = this.getCompanies();
    const existing = companies.find(c => c.name === name);
    if (existing) return existing;
    const company = { id: 'c' + Date.now(), name, industry, createdAt: Date.now() };
    companies.push(company);
    localStorage.setItem('ct_companies', JSON.stringify(companies));
    return company;
  },
  addReview(data) {
    const reviews = this.getReviews();
    const review = { id: 'r' + Date.now(), ...data, likes: 0, createdAt: Date.now() };
    reviews.push(review);
    localStorage.setItem('ct_reviews', JSON.stringify(reviews));
    return review;
  },
  getCompanyRating(companyId) {
    const reviews = this.getReviewsByCompanyId(companyId);
    if (reviews.length === 0) return { avg: 0, count: 0, redCount: 0, blackCount: 0 };
    const sum = reviews.reduce((s, r) => s + r.rating, 0);
    const avg = sum / reviews.length;
    return { avg, count: reviews.length, redCount: reviews.filter(r => r.type === 'red').length, blackCount: reviews.filter(r => r.type === 'black').length };
  },
  getRedList() {
    return this.getCompanies().map(c => ({ ...c, ...this.getCompanyRating(c.id) })).filter(c => c.avg >= 3.5 && c.count >= 3).sort((a, b) => b.avg - a.avg).slice(0, 10);
  },
  getBlackList() {
    return this.getCompanies().map(c => ({ ...c, ...this.getCompanyRating(c.id) })).filter(c => c.avg <= 2.5 && c.count >= 3).sort((a, b) => a.avg - b.avg).slice(0, 10);
  },
  search(keyword) {
    if (!keyword || !keyword.trim()) return { companies: [], reviews: [] };
    const kw = keyword.toLowerCase().trim();
    const companies = this.getCompanies().filter(c => c.name.toLowerCase().includes(kw) || c.industry.toLowerCase().includes(kw));
    const reviews = this.getReviews().filter(r => r.content.toLowerCase().includes(kw) || r.tags.some(t => t.toLowerCase().includes(kw)));
    return { companies, reviews };
  },
  likeReview(reviewId) {
    const reviews = this.getReviews();
    const review = reviews.find(r => r.id === reviewId);
    if (review) { review.likes++; localStorage.setItem('ct_reviews', JSON.stringify(reviews)); }
    return review ? review.likes : 0;
  },
  getRatingDistribution(companyId) {
    const reviews = this.getReviewsByCompanyId(companyId);
    const dist = [0, 0, 0, 0, 0];
    reviews.forEach(r => { dist[r.rating - 1]++; });
    return dist;
  },
  getTopTags(companyId) {
    const reviews = this.getReviewsByCompanyId(companyId);
    const tagCount = {};
    reviews.forEach(r => { r.tags.forEach(t => { tagCount[t] = (tagCount[t] || 0) + 1; }); });
    return Object.entries(tagCount).sort((a, b) => b[1] - a[1]).slice(0, 6);
  }
};

function starsHTML(rating, interactive) {
  let html = '<div class="stars' + (interactive ? ' star-input' : '') + '">';
  for (let i = 1; i <= 5; i++) {
    if (interactive) {
      html += '<span class="star' + (i <= rating ? ' active' : '') + '" data-val="' + i + '" onclick="selectStar(' + i + ')">★</span>';
    } else {
      html += '<span class="star' + (i <= Math.floor(rating) ? ' filled' : '') + '">' + (i <= Math.floor(rating) ? '★' : '☆') + '</span>';
    }
  }
  html += '</div>';
  return html;
}

function formatTime(timestamp) {
  const now = Date.now();
  const diff = now - timestamp;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
  if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
  const d = new Date(timestamp);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function escapeHTML(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlightKeyword(text, keyword) {
  if (!keyword) return escapeHTML(text);
  const escaped = escapeHTML(text);
  const reg = new RegExp('(' + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return escaped.replace(reg, '<span class="highlight">$1</span>');
}

  var html = '<div class="section-header"><h2>✍️ 发布吐槽</h2></div><div class="post-form">' +
    '<div class="form-group"><label>公司名称 <span class="required">*</span></label><input type="text" class="form-input" id="formCompany" placeholder="输入公司名称（如已存在将自动关联）" list="companyList"><datalist id="companyList">' + Storage.getCompanies().map(function(c) { return '<option value="' + c.name + '">'; }).join('') + '</datalist></div>' +
    '<div class="form-group"><label>行业分类 <span class="required">*</span></label><select class="form-select" id="formIndustry"><option value="">请选择行业</option>' + INDUSTRIES.map(function(ind) { return '<option value="' + ind + '">' + ind + '</option>'; }).join('') + '</select></div>' +
    '<div class="form-group"><label>榜单类型 <span class="required">*</span></label><div class="form-radios"><div class="form-radio" id="radioRed" onclick="selectType(\'red\')"><span>🏆 红榜（好评推荐）</span></div><div class="form-radio" id="radioBlack" onclick="selectType(\'black\')"><span>⚠️ 黑榜（吐槽避雷）</span></div></div></div>' +
    '<div class="form-group"><label>吐槽分类（可多选）</label><div class="tag-checkboxes">' + TAG_OPTIONS.map(function(tag) { return '<span class="tag-checkbox" onclick="toggleTag(\'' + tag + '\', this)" data-tag="' + tag + '">' + tag + '</span>'; }).join('') + '</div></div>' +
    '<div class="form-group"><label>评分 <span class="required">*</span></label><div class="star-input" id="starInput"><span class="star" data-val="1" onclick="selectStar(1)">★</span><span class="star" data-val="2" onclick="selectStar(2)">★</span><span class="star" data-val="3" onclick="selectStar(3)">★</span><span class="star" data-val="4" onclick="selectStar(4)">★</span><span class="star" data-val="5" onclick="selectStar(5)">★</span></div></div>' +
    '<div class="form-group"><label>详细内容 <span class="required">*</span>（至少20字）</label><textarea class="form-textarea" id="formContent" placeholder="分享你在该公司的真实经历，帮助更多人了解真实情况..."></textarea></div>' +
    '<div class="form-group"><label>昵称（选填）</label><input type="text" class="form-input" id="formAuthor" placeholder="默认为匿名用户"></div>' +
    '<button class="btn-submit" onclick="submitReview()">发布吐槽</button></div>';
  document.getElementById('app').innerHTML = html;
}

function renderCompanyDetail(companyId) {
  var company = Storage.getCompanyById(companyId);
  if (!company) { document.getElementById('app').innerHTML = '<div class="empty-state"><div class="empty-icon">😕</div><div class="empty-text">公司不存在</div></div>'; return; }
  var rating = Storage.getCompanyRating(companyId);
  var reviews = Storage.getReviewsByCompanyId(companyId).sort(function(a, b) { return b.createdAt - a.createdAt; });
  var dist = Storage.getRatingDistribution(companyId);
  var topTags = Storage.getTopTags(companyId);
  var isRed = rating.avg >= 3.5 && rating.count >= 3;
  var isBlack = rating.avg <= 2.5 && rating.count >= 3;
  var badgeClass = isRed ? 'red' : (isBlack ? 'black' : 'neutral');
  var badgeText = isRed ? '🏆 红榜' : (isBlack ? '⚠️ 黑榜' : '📊 待评价');
  var relatedCompanies = Storage.getCompanies().filter(function(c) { return c.industry === company.industry && c.id !== company.id; }).slice(0, 4);
  var maxDist = Math.max.apply(null, dist.concat([1]));
  var html = '<div style="margin-bottom:16px;"><span class="sort-btn" onclick="router(\'plaza\')">← 返回公司广场</span></div><div class="detail-header"><div class="detail-top"><div class="detail-name">' + company.name + '</div><span class="detail-badge ' + badgeClass + '">' + badgeText + '</span></div><div class="detail-meta"><span>行业：' + company.industry + '</span><span>' + starsHTML(rating.avg) + ' ' + rating.avg.toFixed(1) + '</span><span>评价数：' + rating.count + '</span><span style="color:var(--red);">👍 ' + rating.redCount + '</span><span style="color:var(--black);">👎 ' + rating.blackCount + '</span></div><div class="rating-dist">' +
    dist.map(function(count, i) { return '<div class="rating-row"><span class="rating-label">' + (i + 1) + '星</span><div class="rating-bar"><div class="rating-fill" style="width:' + (count / maxDist * 100) + '%"></div></div><span class="rating-count">' + count + '</span></div>'; }).join('') +
    '</div>' + (topTags.length > 0 ? '<div style="font-weight:600;margin-bottom:8px;">高频标签</div><div class="tag-cloud">' + topTags.map(function(t) { return '<span class="tag-cloud-item">' + t[0] + ' (' + t[1] + ')</span>'; }).join('') + '</div>' : '') + '</div>';
  html += '<div class="dashboard-section"><div class="section-header"><h2>💬 全部评价 (' + reviews.length + ')</h2><span class="more" onclick="router(\'post\')">我要吐槽 →</span></div>' + (reviews.length === 0 ? '<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-text">暂无评价，快来发表第一条吧！</div></div>' : '<div class="review-feed">' + reviews.map(function(r) { return '<div class="review-item ' + r.type + '"><div class="review-top"><span class="review-company">' + (r.type === 'red' ? '🏆 好评' : '⚠️ 吐槽') + '</span><span class="review-time">' + formatTime(r.createdAt) + '</span></div><div class="review-tags">' + r.tags.map(function(t) { return '<span class="review-tag">' + t + '</span>'; }).join('') + '</div><div class="review-content">' + escapeHTML(r.content) + '</div><div class="review-bottom"><span>' + starsHTML(r.rating) + ' · ' + r.author + '</span><span class="like-btn" onclick="likeReview(\'' + r.id + '\', this)">👍 ' + r.likes + '</span></div></div>'; }).join('') + '</div>') + '</div>';
  if (relatedCompanies.length > 0) {
    html += '<div class="dashboard-section"><div class="section-header"><h2>🏢 同行业公司</h2></div><div class="related-grid">' + relatedCompanies.map(function(c) { var r = Storage.getCompanyRating(c.id); return '<div class="company-card" onclick="router(\'company\',\'' + c.id + '\')"><div class="card-top"><div class="company-name">' + c.name + '</div></div><div style="margin-bottom:4px;">' + starsHTML(r.avg) + ' <span style="font-size:0.82rem;color:var(--muted);">' + r.avg.toFixed(1) + '</span></div><div class="card-stats"><span>💬 ' + r.count + '条</span></div></div>'; }).join('') + '</div></div>';
  }
  document.getElementById('app').innerHTML = html;
}

function renderSearch(keyword) {
  var results = Storage.search(keyword);
  var html = '<div class="section-header"><h2>🔍 搜索结果："' + escapeHTML(keyword) + '"</h2></div>';
  if (results.companies.length === 0 && results.reviews.length === 0) {
    html += '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">暂无匹配结果</div></div>';
  } else {
    if (results.companies.length > 0) {
      html += '<h3 style="margin-bottom:12px;">相关公司 (' + results.companies.length + ')</h3><div class="company-grid" style="margin-bottom:32px;">';
      results.companies.forEach(function(c) { var r = Storage.getCompanyRating(c.id); var isRed = r.avg >= 3.5 && r.count >= 3; var isBlack = r.avg <= 2.5 && r.count >= 3; var cardClass = isRed ? 'red' : (isBlack ? 'black' : ''); html += '<div class="company-card ' + cardClass + '" onclick="router(\'company\',\'' + c.id + '\')"><div class="card-top"><div class="company-name">' + highlightKeyword(c.name, keyword) + '</div></div><span class="industry-tag" style="display:inline-block;margin-bottom:8px;">' + highlightKeyword(c.industry, keyword) + '</span><div style="margin-bottom:8px;">' + starsHTML(r.avg) + ' <span style="font-size:0.82rem;color:var(--muted);">' + r.avg.toFixed(1) + '</span></div><div class="card-stats"><span>💬 ' + r.count + '条评价</span></div></div>'; });
      html += '</div>';
    }
    if (results.reviews.length > 0) {
      html += '<h3 style="margin-bottom:12px;">相关吐槽 (' + results.reviews.length + ')</h3><div class="search-results">';
      results.reviews.forEach(function(r) { var company = Storage.getCompanyById(r.companyId); html += '<div class="search-result-item" onclick="router(\'company\',\'' + r.companyId + '\')"><div class="review-top"><span class="review-company">' + (company ? company.name : '未知公司') + '</span><span class="review-time">' + formatTime(r.createdAt) + '</span></div><div class="review-tags">' + r.tags.map(function(t) { return '<span class="review-tag">' + t + '</span>'; }).join('') + '</div><div class="review-content">' + highlightKeyword(r.content.length > 100 ? r.content.slice(0, 100) + '...' : r.content, keyword) + '</div><div class="review-bottom"><span>' + starsHTML(r.rating) + ' · ' + r.author + '</span></div></div>'; });
      html += '</div>';
    }
  }
  document.getElementById('app').innerHTML = html;
}

function router(route, param) {
  window.scrollTo(0, 0);
  document.querySelectorAll('.nav-tab').forEach(function(tab) { tab.classList.toggle('active', tab.dataset.route === route); });
  var searchInput = document.getElementById('searchInput');
  if (searchInput) searchInput.value = '';
  switch (route) {
    case 'home': renderDashboard(); break;
    case 'plaza': currentIndustry = 'all'; currentSort = 'rating_desc'; renderPlaza(); break;
    case 'rankings': currentRankingTab = 'red'; renderRankings(); break;
    case 'post': renderPostForm(); break;
    case 'company': renderCompanyDetail(param); break;
    case 'search': renderSearch(param); break;
    default: renderDashboard();
  }
}

function handleSearch(value) {
  if (value && value.trim().length > 0) { router('search', value.trim()); } else { router('home'); }
}

function filterIndustry(industry) { currentIndustry = industry; renderPlaza(); }
function changeSort(sort) { currentSort = sort; renderPlaza(); }
function switchRankingTab(tab) { currentRankingTab = tab; renderRankings(); }

function selectType(type) {
  selectedType = type;
  document.getElementById('radioRed').classList.remove('selected', 'red');
  document.getElementById('radioBlack').classList.remove('selected', 'black');
  if (type === 'red') { document.getElementById('radioRed').classList.add('selected', 'red'); }
  else { document.getElementById('radioBlack').classList.add('selected', 'black'); }
}

function toggleTag(tag, el) {
  var idx = selectedTags.indexOf(tag);
  if (idx > -1) { selectedTags.splice(idx, 1); el.classList.remove('checked'); }
  else { selectedTags.push(tag); el.classList.add('checked'); }
}

function selectStar(val) {
  selectedRating = val;
  document.querySelectorAll('#starInput .star').forEach(function(s) { s.classList.toggle('active', parseInt(s.dataset.val) <= val); });
}

function submitReview() {
  var name = document.getElementById('formCompany').value.trim();
  var industry = document.getElementById('formIndustry').value;
  var content = document.getElementById('formContent').value.trim();
  var author = document.getElementById('formAuthor').value.trim() || '匿名用户';
  if (!name) { showToast('请输入公司名称'); return; }
  if (!industry) { showToast('请选择行业分类'); return; }
  if (!selectedType) { showToast('请选择榜单类型'); return; }
  if (!selectedRating) { showToast('请选择评分'); return; }
  if (content.length < 20) { showToast('内容至少需要20字'); return; }
  var company = Storage.addCompany(name, industry);
  Storage.addReview({ companyId: company.id, type: selectedType, tags: selectedTags.slice(), content: content, rating: selectedRating, author: author });
  showToast('发布成功！感谢你的分享');
  setTimeout(function() { router('company', company.id); }, 800);
}

function likeReview(reviewId, el) {
  var newLikes = Storage.likeReview(reviewId);
  el.classList.add('liked');
  el.innerHTML = '👍 ' + newLikes;
}

Storage.init();
router('home');
</script>
</body>
</html>
