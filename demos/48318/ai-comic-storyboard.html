// ====================== CORE ENGINE ======================
function generateStoryboard() {

// ===== Text Parser =====
function parseText(text) {
  const result = {
    scene: extractScene(text),
    characters: extractCharacters(text),
    actions: extractActions(text),
    audio: extractAudio(text),
    style: extractStyle(text),
    camera: extractCamera(text),
    resolution: extractResolution(text),
    fps: extractFPS(text),
    rawText: text
  };
  return result;
}

function extractScene(text) {
  const scenes = [];
  const scenePatterns = [
    /(?:暖黄漫射灯光下[的]?|昏暗[的]?|夕阳下[的]?|阳光透过.*?洒进|雨夜[的]?|崩裂[的]?).*?(?:客厅|厨房|卧室|天台|校园|图书馆|密室|花园|森林|战场|悬崖|火山|海底|太空|雪地|街道|走廊|房间|阳台|海边|咖啡馆)/g,
    /(?:客厅|厨房|卧室|天台|校园|图书馆|密室|花园|森林|战场|悬崖|火山|海底|太空|雪地|街道|走廊|房间|阳台|海边|咖啡馆).*?(?:，|。|；|（)/g,
    /(?:背景是|背景|场景是|场景为)[：:]?\s*.{2,20}/g
  ];
  
  let found = false;
  for (const pat of scenePatterns) {
    let m;
    while ((m = pat.exec(text)) !== null) {
      let s = m[0].replace(/[，。；:：]/g, '').trim();
      if (s.length > 3) {
        scenes.push(s);
        found = true;
      }
    }
    if (found) break;
  }

  if (scenes.length === 0) {
    const locs = text.match(/(?:客厅|厨房|卧室|天台|校园|图书馆|密室|花园|森林|战场|悬崖|火山|海底|太空|雪地|街道|走廊|房间|阳台|海边)/);
    if (locs) scenes.push(locs[0] + '场景');
  }

  const lighting = text.match(/(?:暖黄|暖调|冷蓝|清晨自然|暗红|粉色暖调|月光|星光|霓虹|柔焦|漫射)/g) || [];

  const objects = [];
  const objPatterns = [
    /(?:原木矮茶几|纸杯|曲奇|毛毯|沙发|桌子|椅子|床|窗户|门|书架|镜子|冰箱|炉灶)/g,
    /(?:（[^）]{2,}）)/g
  ];
  for (const pat of objPatterns) {
    let m;
    while ((m = pat.exec(text)) !== null) {
      let o = m[0].replace(/[（）]/g, '').trim();
      if (o.length > 1 && o.length < 30) objects.push(o);
    }
  }

  return { description: scenes.join('，') || '默认场景', lighting, objects };
}

function extractCharacters(text) {
  const chars = [];
  const charPatterns = [
    /穿.{1,10}[的]?圆滚滚|Q版|少女|少年|男孩|女孩|男主|女主|主角|侦探|魔兽/g,
    /(?:头身比[1-9]:[1-9]|头顶呆毛|脸颊.*?腮红|银发|长发|短发|黑发|金发)/g
  ];

  let desc = '';
  const mainChar = text.match(/穿.{2,30}?(?:少女|少年|男孩|女孩|男主|女主|主角|角色)/);
  if (mainChar) desc = mainChar[0];
  
  const traits = [];
  let m;
  const traitPat = /(?:头身比[1-9]:[1-9]|头顶呆毛|脸颊.*?腮红|企鹅服|校服裙|巨剑|黑伞|白发|银发|长发微卷|圆滚滚)/g;
  while ((m = traitPat.exec(text)) !== null) traits.push(m[0]);

  if (desc || traits.length > 0) {
    chars.push({
      description: desc || '主要角色',
      traits: traits,
      style: (text.match(/(?:Q版|二次元|萌系|少年|少女|精致|扁平|素描)/g) || []).slice(0, 3)
    });
  }

  const viewer = text.match(/第一视角|第一人称|POV/i);
  if (viewer) {
    chars.push({
      description: '观看者（第一视角）',
      traits: ['第一人称视角'],
      style: []
    });
  }

  return chars;
}

function extractActions(text) {
  const actions = [];
  const actionSentences = text.split(/[，。；！？]/);
  const actionVerbs = [
    '凑到', '掀开', '拿到', '啃咬', '伸手', '拿开', '露出', '瞥见',
    '炸起', '鼓腮', '揽过', '蹲到', '炫吃', '偷瞄', '跃下', '闪避',
    '斩裂', '蓄力', '释放', '走近', '跪下', '打开', '点头', '相拥',
    '揉着眼睛', '探出头', '下床', '翻阅', '回头', '推开', '走',
    '跑', '跳', '飞', '坐', '站', '躺', '转身', '抬头', '低头',
    '挥手', '握拳', '张嘴', '闭眼', '微笑', '哭泣', '大笑', '叹气',
    '翻看', '咀嚼', '吞咽', '抱住', '躲避', '攻击', '防御', '观察'
  ];

  for (const sent of actionSentences) {
    const trimmed = sent.trim();
    if (trimmed.length < 2) continue;
    let hasAction = false;
    for (const verb of actionVerbs) {
      if (trimmed.includes(verb)) { hasAction = true; break; }
    }
    if (hasAction) {
      let emotion = 'default';
      for (const [emo, icon] of Object.entries(emotionIcons)) {
        if (emo !== 'default' && trimmed.includes(emo)) { emotion = emo; break; }
      }
      // also detect emotion from context
      if (emotion === 'default') {
        const emoContext = [
          ['开心', '开心', '高兴', '快乐', '喜悦'],
          ['委屈', '委屈', '不甘', '不公', '被骗'],
          ['贪婪', '炫吃', '大口', '全部揽过', '贪吃'],
          ['警惕', '偷瞄', '观察', '四处看', '回头看'],
          ['紧张', '加快', '匆忙', '急促', '紧急'],
          ['惊讶', '惊讶', '猛', '忽然', '突然', '瞬间'],
          ['放松', '慵懒', '舒适', '悠闲', '惬意', '微笑'],
          ['坚定', '蓄力', '决心', '凝重', '鼓起勇气'],
          ['害羞', '害羞', '脸红', '不好意思', '捂嘴'],
          ['温柔', '温柔', '轻柔', '抚摸', '拥抱']
        ];
        for (const [key, ...hints] of emoContext) {
          for (const h of hints) {
            if (trimmed.includes(h)) { emotion = key; break; }
          }
          if (emotion !== 'default') break;
        }
      }
      actions.push({ text: trimmed, emotion: emotion, verbs: actionVerbs.filter(v => trimmed.includes(v)) });
    }
  }

  return actions.length > 0 ? actions : [{ text: text.substring(0, 50), emotion: 'default', verbs: [] }];
}

function extractAudio(text) {
  const audio = [];
  const audioPatterns = [
    /(?:纸杯轻响|曲奇酥脆咬声|爪手蹭桌垫|细微音效)/g,
    /(?:无对话|仅有|保留|配合).*?(?:声|音效|音)/g,
    /(?:雷声|脚步声|脚步回声|翻书声|开门声|吱呀声|风声|心跳声|鸟鸣|爆炸声|金属碰撞声)/g,
    /(?:钢琴|吉他|小提琴|背景音乐)/g,
    /(?:轻响|酥脆|轻微|咕噜|滋滋)/g
  ];
  for (const pat of audioPatterns) {
    let m;
    while ((m = pat.exec(text)) !== null) {
      let a = m[0].replace(/^(仅有|保留|配合|无对话)/, '').trim();
      if (a.length > 1) audio.push(a);
    }
  }
  
  const noDialogue = /无对话/.test(text) || /全程无/.test(text);
  return { effects: [...new Set(audio)], noDialogue, bgMusic: text.match(/(?:钢琴|吉他|小提琴|BGM|背景音乐).*?(?:声|音乐|曲)/)?.[0] || '' };
}

function extractStyle(text) {
  const styles = [];
  const stylePatterns = {
    artStyle: /(?:日系萌系圆润|日系少年热血|少女漫画精致|扁平插画|黑白素描|写实|水彩|赛博朋克|像素|油画|蜡笔)/g,
    colorTone: /(?:暖黄柔焦|暖色调|冷蓝阴暗调|粉色梦幻|暗红|高对比度|暖调)/g,
    cameraFeeling: /(?:沉浸式|第一视角|平缓|快速切换|大量特写|压迫感)/g
  };

  for (const [key, pat] of Object.entries(stylePatterns)) {
    let m;
    while ((m = pat.exec(text)) !== null) styles.push({ type: key, value: m[0] });
  }

  const mood = text.match(/(?:软萌反差感|热血|浪漫|治愈|诡异|恐怖|搞笑|温馨|紧张|悬疑)/g) || [];
  return { details: styles, mood };
}

function extractCamera(text) {
  const cameras = [];
  const camPatterns = [
    { type: 'perspective', pattern: /第一视角|第一人称|POV/g },
    { type: 'angle', pattern: /(?:侧面特写|俯拍|仰拍|平视|鸟瞰|荷兰角|低角度|高角度)/g },
    { type: 'movement', pattern: /(?:缓缓推进|快速切换|平缓推镜头|缓慢跟拍|快速拉近|环绕|旋转)/g }
  ];

  for (const { type, pattern } of camPatterns) {
    let m;
    while ((m = pattern.exec(text)) !== null) {
      cameras.push({ type, value: m[0] });
    }
  }

  return cameras;
}

function extractResolution(text) {
  const m = text.match(/(\d+)K/i);
  return m ? m[1] + 'K' : '4K';
}

function extractFPS(text) {
  const m = text.match(/(\d+)\s*帧/i);
  return m ? parseInt(m[1]) : 60;
}

// ===== Frame Builder =====
function buildFrames(parsed, rawText) {
  const { actions, camera, scene, characters, audio, style } = parsed;
  const frames = [];
  const defaultPerspective = camera.find(c => c.type === 'perspective')?.value || '第一视角';
  const defaultMovement = camera.find(c => c.type === 'movement')?.value || '缓慢推进';

  // Determine base shot sequence based on content
  const shotSequence = determineShotSequence(actions, camera);
  
  // Build frames from actions
  const totalActions = actions.length;
  const maxFrames = Math.min(Math.max(totalActions, 6), 14);
  
  // Ensure we have opening and closing
  let frameActions = [...actions];
  
  // If too few actions, split some
  if (frameActions.length < 4) {
    const expanded = [];
    for (const a of frameActions) {
      expanded.push(a);
      if (a.text.length > 15 && expanded.length < maxFrames) {
        const mid = Math.floor(a.text.length / 2);
        expanded.push({
          text: a.text.substring(mid),
          emotion: a.emotion,
          verbs: a.verbs.filter(v => a.text.substring(mid).includes(v))
        });
      }
    }
    frameActions = expanded;
  }

  // Trim if too many
  if (frameActions.length > maxFrames) {
    // Keep key frames (first, last, emotional peaks)
    const key = new Set([0, frameActions.length - 1]);
    frameActions.forEach((a, i) => {
      if (a.emotion !== 'default') key.add(i);
      if (a.verbs.length >= 2) key.add(i);
    });
    const keyArr = [...key].sort((a, b) => a - b);
    frameActions = keyArr.map(i => frameActions[i]);
  }

  // Add opening frame
  frames.push(createFrame(0, {
    type: 'establishing',
    shot: '全景',
    angle: '平视',
    movement: defaultMovement,
    duration: '2.5s',
    emotion: 'default',
    desc: `场景建立镜头 — ${scene.description}`,
    scene: scene,
    instruction: `CAM: ESTABLISHING SHOT, ${defaultPerspective}\nMOVE: ${defaultMovement}，展示完整场景\nLIGHT: ${scene.lighting.join('、') || '环境光'}\nFOCUS: 环境全貌，引导观众进入场景`,
    audio: audio.noDialogue ? '静默开场 → 渐入环境音' : ''
  }));

  // Build action frames
  frameActions.forEach((action, idx) => {
    const shotInfo = shotSequence[(idx) % shotSequence.length];
    const emo = action.emotion || 'default';
    
    // Determine shot type based on action intensity
    let shotType = shotInfo.shot;
    let angle = shotInfo.angle;
    let move = shotInfo.movement;
    
    // Emotional peaks get close-ups
    if (emo === '惊讶' || emo === '委屈' || emo === '愤怒' || emo === '坚定') {
      shotType = '特写';
      angle = emo === '愤怒' ? '仰拍' : '平视';
    } else if (emo === '贪婪' || emo === '警惕') {
      shotType = '中近景';
      angle = '俯拍';
    } else if (emo === '开心' || emo === '放松' || emo === '温柔') {
      shotType = '中景';
      angle = '平视';
    }

    // Movement based on action verbs
    if (action.verbs.some(v => ['跃下', '闪避', '转身', '回头', '跳', '跑'].includes(v))) {
      move = '快速跟随';
    } else if (action.verbs.some(v => ['蹲到', '蹲', '坐下', '躺'].includes(v))) {
      move = '缓慢下移';
    } else if (action.verbs.some(v => ['抬头', '站', '跃', '飞'].includes(v))) {
      move = '缓慢上移';
    }

    // Duration based on action complexity
    let duration = '2.0s';
    if (action.verbs.length >= 3 || action.text.length > 30) duration = '3.5s';
    else if (action.verbs.length >= 2 || action.text.length > 15) duration = '2.5s';
    else if (action.text.length < 8) duration = '1.5s';

    // Build instruction
    const instruction = buildInstruction(action, shotType, angle, move, scene, characters, parsed.fps);

    // Audio hint
    let audioHint = '';
    if (audio.effects.length > 0) {
      const relevantAudio = audio.effects.filter(e => {
        return action.text.includes(e.substring(0, 2)) || 
               (idx % Math.max(1, Math.floor(audio.effects.length / frameActions.length)) === 0);
      });
      if (relevantAudio.length > 0) audioHint = relevantAudio[Math.min(idx, relevantAudio.length - 1)];
    }

    frames.push(createFrame(idx + 1, {
      type: 'action',
      shot: shotType,
      angle: angle,
      movement: move,
      duration: duration,
      emotion: emo,
      desc: action.text,
      verbs: action.verbs,
      scene: scene,
      instruction: instruction,
      audio: audioHint,
      prompt: buildPrompt(action, shotType, angle, move, scene, characters, style, parsed.resolution, parsed.fps)
    }));
  });

  // Add closing frame
  frames.push(createFrame(frames.length, {
    type: 'closing',
    shot: '中远景',
    angle: '平视',
    movement: '缓慢后拉',
    duration: '3.0s',
    emotion: 'default',
    desc: '结尾定帧 — 收束情绪，留下余韵',
    scene: scene,
    instruction: `CAM: PULL BACK SLOWLY\nMOVE: 缓慢后拉，逐渐展露全景\nFADE: 画面渐暗至黑\nHOLD: 最终画面停留1秒`,
    audio: audio.noDialogue ? '环境音渐弱 → 静默' : ''
  }));

  return frames;
}

function determineShotSequence(actions, camera) {
  // Build a varied shot sequence
  const angles = camera.filter(c => c.type === 'angle').map(c => c.value);
  const movements = camera.filter(c => c.type === 'movement').map(c => c.value);
  
  const defaultSequence = [
    { shot: '中景', angle: angles[0] || '平视', movement: movements[0] || '缓慢推进' },
    { shot: '近景', angle: angles[1] || '微俯', movement: movements[1] || '固定' },
    { shot: '特写', angle: '平视', movement: '缓慢推进' },
    { shot: '中景', angle: angles[2] || '微仰', movement: movements[2] || '缓慢横移' },
    { shot: '中近景', angle: '平视', movement: '跟拍' },
    { shot: '特写', angle: '俯拍', movement: '固定' },
    { shot: '全景', angle: '平视', movement: '缓慢后拉' },
    { shot: '近景', angle: '平视', movement: '环绕' }
  ];

  return defaultSequence;
}

function createFrame(index, data) {
  return { index, ...data };
}

function buildInstruction(action, shotType, angle, movement, scene, characters, fps) {
  const lines = [];
  lines.push(`CAM: ${shotType.toUpperCase()}, ${angle}`);
  lines.push(`MOVE: ${movement}`);
  lines.push(`DURATION: ${action.duration || '2.0s'} @ ${fps}FPS`);
  lines.push(`SCENE: ${scene.description.substring(0, 40)}`);
  
  if (characters.length > 0) {
    lines.push(`CHAR: ${characters[0].description}`);
  }
  
  if (action.emotion && action.emotion !== 'default') {
    lines.push(`EMOTION: ${action.emotion}（${emotionIcons[action.emotion] || '🎭'}）`);
  }
  
  if (action.verbs.length > 0) {
    lines.push(`ACTION: ${action.verbs.slice(0, 3).join(' → ')}`);
  }

  return lines.join('\n');
}

function buildPrompt(action, shotType, angle, movement, scene, characters, style, resolution, fps) {
  let prompt = '';
  
  // Style prefix
  const artStyles = style.details.filter(d => d.type === 'artStyle').map(d => d.value);
  const colorTones = style.details.filter(d => d.type === 'colorTone').map(d => d.value);
  
  if (artStyles.length > 0) prompt += artStyles.join('，') + '画风。';
  if (colorTones.length > 0) prompt += colorTones.join('，') + '色调。';
  
  // Camera
  prompt += `${shotType}${angle}镜头，${movement}。`;
  
  // Scene
  prompt += scene.description + '。';
  
  // Characters
  if (characters.length > 0) {
    const c = characters[0];
    prompt += c.description;
    if (c.traits.length > 0) prompt += '（' + c.traits.join('、') + '）';
  }
  
  // Action
  prompt += '。' + action.text + '。';
  
  // Emotion
  if (action.emotion && action.emotion !== 'default') {
    prompt += '表情：' + action.emotion + '。';
  }
  
  // Technical
  prompt += `${resolution}分辨率，${fps}帧。`;
  
  return prompt;
}

// ====================== HELPERS ======================
function parseDuration(d) {
  if (typeof d === 'string') return parseFloat(d) || 2;
  return d || 2;
}

function calcTotalDuration(frames) {
  const total = frames.reduce((s, f) => s + parseDuration(f.duration), 0);
  return total.toFixed(1) + 's';
}

function getSceneIcon(desc) {
  for (const [key, icon] of Object.entries(sceneIcons)) {
    if (key !== 'default' && desc.includes(key)) return icon;
  }
  return sceneIcons['default'];
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ====================== MODAL ======================
function openFrameDetail(index) {
  const frames = window._lastFrames;
  if (!frames || !frames[index]) return;
  
  const frame = frames[index];
  const overlay = document.getElementById('modalOverlay');
  const titleText = document.getElementById('modalTitleText');
  const body = document.getElementById('modalBody');
  
  titleText.textContent = `分镜 #${String(frame.index + 1).padStart(2, '0')} — ${frame.shot}`;
  
  let html = '';
  
  // Meta
  html += '<div class="modal-section"><h4>镜头参数</h4><div style="display:flex;gap:0.5rem;flex-wrap:wrap">';
  html += `<span class="tag accent3">${frame.shot}</span>`;
  html += `<span class="tag accent2">${frame.angle}</span>`;
  html += `<span class="tag accent4">${frame.movement}</span>`;
  html += `<span class="tag">${frame.duration}</span>`;
  if (frame.emotion && frame.emotion !== 'default') html += `<span class="tag accent">${emotionIcons[frame.emotion] || ''} ${frame.emotion}</span>`;
  html += '</div></div>';
  
  // Description
  html += `<div class="modal-section"><h4>画面描述</h4><p>${frame.desc}</p></div>`;
  
  // Full instruction
  html += '<div class="modal-section"><h4>拍摄指令</h4>';
  html += '<div class="prompt-block">' + frame.instruction + '</div></div>';
  
  // AI Prompt
  if (frame.prompt) {
    html += '<div class="modal-section"><h4>AI生成提示词</h4>';
    html += '<div class="prompt-block" id="promptBlock-' + index + '">' + escapeHtml(frame.prompt) + '</div>';
    html += `<button class="btn btn-sm btn-accent2 copy-btn" onclick="copyPrompt(${index})">📋 复制提示词</button></div>`;
  }
  
  // Audio
  if (frame.audio) {
    html += `<div class="modal-section"><h4>音效提示</h4><p>${frame.audio}</p></div>`;
  }
  
  body.innerHTML = html;
  overlay.classList.add('open');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('open');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function copyPrompt(index) {
  const frames = window._lastFrames;
  if (!frames || !frames[index]?.prompt) return;
  
  navigator.clipboard.writeText(frames[index].prompt).then(() => {
    showToast('提示词已复制到剪贴板');
  }).catch(() => {
    // Fallback
    const block = document.getElementById('promptBlock-' + index);
    if (block) {
      const range = document.createRange();
      range.selectNodeContents(block);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      showToast('提示词已复制到剪贴板');
    }
  });
}

// ====================== EXPORT ======================
function exportJSON() {
  const data = {
    meta: {
      title: 'AI漫剧分镜脚本',
      generatedAt: new Date().toISOString(),
      totalFrames: window._lastFrames?.length || 0,
      totalDuration: calcTotalDuration(window._lastFrames || [])
    },
    parsedInfo: window._lastParsed,
    frames: window._lastFrames
  };
  
  downloadFile('storyboard.json', JSON.stringify(data, null, 2), 'application/json');
  showToast('JSON文件已下载');
}

  frames.forEach(f => {
    txt += `┌─── 帧 #${String(f.index + 1).padStart(2, '0')} ───────────────────────────\n`;
    txt += `│ 类型: ${f.shot} / ${f.angle} / ${f.movement}\n`;
    txt += `│ 时长: ${f.duration}\n`;
    if (f.emotion && f.emotion !== 'default') txt += `│ 情绪: ${f.emotion}\n`;
    txt += `│\n`;
    txt += `│ 画面: ${f.desc}\n`;
    txt += `│\n`;
    f.instruction.split('\n').forEach(line => {
      txt += `│ ${line}\n`;
    });
    if (f.prompt) {
      txt += `│\n`;
      txt += `│ [AI提示词]\n`;
      txt += `│ ${f.prompt}\n`;
    }
    if (f.audio) {
      txt += `│\n`;
      txt += `│ 🔊 ${f.audio}\n`;
    }
    txt += `└────────────────────────────────────\n\n`;
  });
  
  txt += `══════════════════════════════════════\n`;
  txt += `  总帧数: ${frames.length}  |  预估时长: ${calcTotalDuration(frames)}\n`;
  txt += `══════════════════════════════════════\n`;
  
  downloadFile('storyboard.txt', txt, 'text/plain');
  showToast('分镜文档已下载');
}

function exportPrompts() {
  const frames = window._lastFrames;
  if (!frames) return;
  
  let txt = '// AI漫剧分镜 - 批量提示词\n';
  txt += `// 生成时间: ${new Date().toLocaleString()}\n`;
  txt += `// 共 ${frames.length} 帧\n\n`;
  
  frames.forEach((f, i) => {
    if (f.prompt) {
      txt += `// ── 帧 #${String(i + 1).padStart(2, '0')} ──\n`;
      txt += f.prompt + '\n\n';
    }
  });
  
  downloadFile('ai-prompts.txt', txt, 'text/plain');
  showToast('AI提示词已下载');
}

function downloadFile(filename, content, type) {
  const blob = new Blob([content], { type: type + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// Keyboard shortcut
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') generateStoryboard();
});
</script>
