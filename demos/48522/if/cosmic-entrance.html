      function closeModal(){ detailModal.classList.remove('open'); document.body.style.overflow=''; }

      function init(){
        initStars(); requestAnimationFrame(animateStars);
        window.addEventListener('resize',function(){ initStars(); });
        video.addEventListener('ended',transitionToStillFrame);
        video.addEventListener('error',function(){ console.warn('Video error'); transitionToStillFrame(); });
        var pp=video.play(); if(pp!==undefined) pp.catch(function(e){ console.warn('Autoplay blocked',e); transitionToStillFrame(); });
        setTimeout(function(){ if(!transitioned){ console.warn('Timeout'); transitionToStillFrame(); } }, CFG.timeoutFb);

        // Background click triggers random modal (exclude input, button & modal)
        document.getElementById('cosmic-container').addEventListener('click', function(e){
          if(detailModal.classList.contains('open')) return;
          if(e.target.closest('#detail-modal')) return;
          openRandomModal();
        });
        cosmicInput.addEventListener('click', function(e){ e.stopPropagation(); });
        cosmicBtn.addEventListener('click', function(e){ e.stopPropagation(); alert('正在开发中，敬请期待'); });

        panelCloseBtn.addEventListener('click', function(e){ e.stopPropagation(); closeModal(); });
        modalBackBtn.addEventListener('click', function(e){ e.stopPropagation(); closeModal(); });
        modalOverlay.addEventListener('click', function(e){ e.stopPropagation(); closeModal(); });
        document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });
      }
      if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
    })();
  </script>
</body>
</html>
