<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏮 五人小分队 - 兰州旅游地图</title>

  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark:     #0b1622;
      --bg-panel:    #111e2e;
      --bg-card:     #162437;
      --bg-hover:    #1e3150;
      --border:      #1e3a5f;
      --border-light:#2a4d7a;
      --text-main:   #c8d8ea;
      --text-muted:  #6a8aaa;
      --text-bright: #e8f4ff;
      --accent:      #4e9bff;
      --accent2:     #f5a623;
      --success:     #52c41a;
      --danger:      #f5222d;
      --radius:      10px;
      --shadow:      0 4px 24px rgba(0,0,0,0.45);
    }

    html, body { height: 100%; font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif; background: var(--bg-dark); color: var(--text-main); overflow: hidden; }

    .app-shell {
      display: grid;
      grid-template-rows: 54px 1fr;
      grid-template-columns: 290px 1fr;
      height: 100vh;
    }

    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      background: linear-gradient(135deg, #0d1f35, #162540);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      z-index: 10;
    }
    .topbar-logo { font-size: 24px; }
    .topbar-title { font-size: 18px; font-weight: 700; color: var(--text-bright); letter-spacing: 1px; }
    .topbar-sub   { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .topbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .topbar-badge {
      font-size: 11px; padding: 3px 9px; border-radius: 20px;
      background: rgba(78,155,255,0.12); border: 1px solid rgba(78,155,255,0.25); color: var(--accent);
    }

    .sidebar {
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 5;
    }
    .sidebar-header { padding: 12px 14px 8px; border-bottom: 1px solid var(--border); }
    .tab-bar { display: flex; gap: 4px; margin-top: 8px; }
    .tab-btn {
      flex: 1; padding: 6px 0; border: 1px solid var(--border);
      border-radius: 6px; background: transparent; color: var(--text-muted);
      font-size: 12px; cursor: pointer; transition: all .2s;
    }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .tab-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

    .sidebar-body { flex: 1; overflow: hidden; }
    .tab-panel { display: none; height: 100%; overflow-y: auto; }
    .tab-panel.active { display: block; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

    #spot-list { padding: 6px; }
    .spot-item {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 11px; border-radius: 8px; cursor: pointer;
      transition: background .15s; margin-bottom: 3px;
      border: 1px solid transparent;
    }
    .spot-item:hover { background: var(--bg-hover); }
    .spot-item.active { background: var(--bg-hover); border-color: var(--accent); }
    .spot-item.user-spot { border-left: 3px solid #EB2F96; }
    .spot-item-icon { font-size: 20px; flex-shrink: 0; }
    .spot-item-info { flex: 1; min-width: 0; }
    .spot-item-name { font-size: 13px; font-weight: 600; color: var(--text-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .spot-item-type { font-size: 11px; margin-top: 2px; }
    .spot-item-badge { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    #tab-distance { padding: 6px; }
    .dist-hint { padding: 6px 8px; font-size: 11px; color: var(--text-muted); line-height: 1.5; margin-bottom: 4px; }
    table.dist-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    table.dist-table th { background: var(--bg-card); color: var(--text-muted); padding: 6px 5px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    table.dist-table td { padding: 6px 5px; border-bottom: 1px solid rgba(30,58,95,0.4); white-space: nowrap; }
    table.dist-table tr:hover td { background: var(--bg-hover); }
    .dist-km { color: var(--accent2); font-weight: 600; }
    .dist-est  { color: var(--text-muted); font-size: 10px; }
    .dist-real { color: var(--success);    font-size: 10px; }

    #dist-loading-hint {
      display: none; align-items: center; gap: 8px;
      padding: 6px 8px; margin-bottom: 4px;
      background: rgba(78,155,255,0.06); border-radius: 6px;
      border: 1px solid rgba(78,155,255,0.15);
    }
    .dist-prog-text { font-size: 11px; color: var(--accent); flex-shrink: 0; }
    .dist-prog-bar { flex: 1; height: 4px; background: rgba(78,155,255,0.15); border-radius: 2px; overflow: hidden; }
    .dist-prog-bar-inner { height: 100%; background: var(--accent); border-radius: 2px; width: 0; transition: width .3s; }

    .sidebar-footer { padding: 10px 12px; border-top: 1px solid var(--border); }
    .btn-add-mode {
      width: 100%; padding: 9px; border: 1.5px dashed var(--accent);
      border-radius: 8px; background: transparent; color: var(--accent);
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .btn-add-mode:hover, .btn-add-mode.active { background: rgba(78,155,255,0.12); }
    .btn-add-mode.active { border-style: solid; animation: pulse-border 1.5s infinite; }
    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 2px rgba(78,155,255,0.3); }
      50%        { box-shadow: 0 0 0 4px rgba(78,155,255,0.5); }
    }

    .spot-item-ops { display: flex; gap: 4px; flex-shrink: 0; }
    .si-btn {
      background: transparent; border: 1px solid var(--border);
      border-radius: 5px; padding: 3px 6px; cursor: pointer;
      font-size: 13px; transition: background .15s, border-color .15s;
      line-height: 1;
    }
    .si-btn:hover { background: var(--bg-hover); }
    .si-edit:hover { border-color: var(--accent); }
    .si-del:hover  { border-color: var(--danger); }

    #edit-relocate-hint {
      display: none; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 700; background: rgba(78,155,255,0.92); color: #fff;
      padding: 8px 20px; border-radius: 22px; font-size: 13px; font-weight: 600;
      box-shadow: 0 4px 16px rgba(78,155,255,0.4); pointer-events: none;
      white-space: nowrap; animation: hint-float 1.5s ease-in-out infinite;
    }
    #edit-relocate-hint.show { display: block; }
    @keyframes hint-float {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%       { transform: translateX(-50%) translateY(-4px); }
    }

    #edit-panel {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); width: 360px;
      background: var(--bg-panel); border: 1px solid var(--accent);
      border-radius: 14px; padding: 20px; z-index: 1000; box-shadow: var(--shadow);
    }
    #edit-panel.show { display: block; }
    .edit-panel-title { font-size: 15px; font-weight: 700; color: var(--text-bright); margin-bottom: 4px; }
    .edit-panel-sub { font-size: 11px; color: var(--text-muted); margin-bottom: 14px; }
    .edit-coord-display {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 10px; margin-bottom: 10px;
    }
    .edit-coord-display .coord-text {
      flex: 1; font-size: 12px; color: var(--text-muted); font-family: monospace;
    }
    .edit-coord-inputs input {
      width: 100%; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 9px; color: var(--text-bright); font-size: 13px;
      font-family: monospace;
    }
    .edit-coord-inputs input:focus { outline: none; border-color: var(--accent); }
    .btn-relocate {
      padding: 5px 10px; background: rgba(78,155,255,0.12);
      border: 1px solid rgba(78,155,255,0.35); border-radius: 6px;
      color: var(--accent); font-size: 12px; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: background .2s;
    }
    .btn-relocate:hover { background: rgba(78,155,255,0.25); }

    .map-area { position: relative; overflow: hidden; }
    #map-container { width: 100%; height: 100%; z-index: 1; }

    .map-legend {
      position: absolute; bottom: 30px; left: 14px; z-index: 500;
      background: rgba(11,22,34,0.88); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px; backdrop-filter: blur(8px);
      pointer-events: none;
    }
    .legend-title { font-size: 10px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; letter-spacing: 1px; }
    .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-main); margin-bottom: 3px; }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

    .map-hint {
      position: absolute; top: 12px; right: 14px; z-index: 500;
      background: rgba(11,22,34,0.8); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 12px; font-size: 11px; color: var(--text-muted);
      backdrop-filter: blur(6px); pointer-events: none;
    }

    #add-panel {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); width: 350px;
      background: var(--bg-panel); border: 1px solid var(--border-light);
      border-radius: 14px; padding: 20px; z-index: 1000; box-shadow: var(--shadow);
    }
    #add-panel.show { display: block; }
    .add-panel-title { font-size: 15px; font-weight: 700; color: var(--text-bright); margin-bottom: 14px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group textarea {
      width: 100%; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 9px; color: var(--text-bright); font-size: 13px;
      font-family: inherit; transition: border-color .2s; resize: none;
    }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
    .coord-row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .form-actions { display: flex; gap: 9px; margin-top: 12px; }
    .btn { flex: 1; padding: 8px; border-radius: 7px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .2s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border); }

    .custom-marker { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .marker-pin {
      width: 38px; height: 38px; border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg); display: flex; align-items: center; justify-content: center;
      background: var(--mc, #4e9bff);
      box-shadow: 0 3px 12px rgba(0,0,0,0.4), 0 0 0 3px rgba(255,255,255,0.15);
      transition: transform .2s, box-shadow .2s;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .custom-marker:hover .marker-pin {
      transform: rotate(-45deg) scale(1.15);
      box-shadow: 0 6px 20px rgba(0,0,0,0.5), 0 0 0 4px rgba(255,255,255,0.2);
    }
    .marker-emoji { transform: rotate(45deg); font-size: 18px; display: block; }
    .marker-label {
      margin-top: 4px; font-size: 11px; font-weight: 700; color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.7);
      white-space: nowrap; pointer-events: none;
      background: rgba(0,0,0,0.45); padding: 1px 6px; border-radius: 4px;
    }

    .leaflet-popup-content-wrapper {
      background: rgba(13,26,42,0.97) !important;
      border: 1px solid #2a4d7a !important;
      border-radius: 12px !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6) !important;
      padding: 0 !important;
      overflow: hidden;
    }
    .leaflet-popup-content { margin: 0 !important; width: auto !important; }
    .leaflet-popup-tip-container { margin-top: -1px; }
    .leaflet-popup-tip { background: rgba(13,26,42,0.97) !important; }
    .leaflet-popup-close-button {
      color: #6a8aaa !important; font-size: 18px !important;
      top: 8px !important; right: 10px !important; z-index: 10;
    }
    .leaflet-popup-close-button:hover { color: #e8f4ff !important; }

    .popup-inner { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; min-width: 300px; }
    .pi-head {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 14px 10px; background: rgba(22,36,55,0.9);
      border-bottom: 1px solid #1e3a5f;
    }
    .pi-icon { font-size: 26px; flex-shrink: 0; padding-top: 2px; }
    .pi-title-block { flex: 1; min-width: 0; }
    .pi-name { font-size: 15px; font-weight: 700; color: #e8f4ff; }
    .pi-type { font-size: 12px; margin-top: 2px; font-weight: 600; }
    .pi-actions {
      display: flex; flex-direction: column; gap: 4px;
      flex-shrink: 0; margin-left: auto; padding-left: 6px;
    }
    .pi-edit, .pi-del, .pi-coord {
      border-radius: 6px; padding: 4px 8px; cursor: pointer;
      font-size: 12px; transition: background .2s; white-space: nowrap;
      border-width: 1px; border-style: solid;
    }
    .pi-edit  { background: rgba(78,155,255,0.12);  border-color: rgba(78,155,255,0.3);  color: var(--accent); }
    .pi-edit:hover  { background: rgba(78,155,255,0.25); }
    .pi-del   { background: rgba(245,34,45,0.12);   border-color: rgba(245,34,45,0.3);   color: #ff7875; }
    .pi-del:hover   { background: rgba(245,34,45,0.25); }
    .pi-coord { background: rgba(245,166,35,0.12);  border-color: rgba(245,166,35,0.3);  color: var(--accent2); }
    .pi-coord:hover { background: rgba(245,166,35,0.25); }

    .pi-body { padding: 10px 14px 12px; }
    .pi-rating { font-size: 13px; margin-bottom: 6px; }
    .pi-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .pi-tag { font-size: 11px; padding: 2px 7px; background: rgba(78,155,255,0.1); border: 1px solid rgba(78,155,255,0.25); color: #4e9bff; border-radius: 20px; }
    .pi-row { font-size: 12px; color: #6a8aaa; margin-bottom: 4px; line-height: 1.5; }
    .pi-desc { font-size: 12.5px; color: #c8d8ea; line-height: 1.65; margin: 8px 0; padding: 8px; background: rgba(78,155,255,0.06); border-radius: 6px; }
    .pi-tips { font-size: 12px; color: #f5a623; line-height: 1.5; margin-bottom: 6px; }

    .pi-dist { border-top: 1px solid #1e3a5f; padding-top: 8px; margin-top: 8px; }
    .pd-title { font-size: 11px; color: #6a8aaa; margin-bottom: 6px; font-weight: 600; }
    .pd-row { display: flex; align-items: center; gap: 6px; font-size: 11.5px; margin-bottom: 5px; color: #c8d8ea; }
    .pd-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .pd-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pd-km { color: #f5a623; font-weight: 600; flex-shrink: 0; }
    .pd-time { color: #6a8aaa; font-size: 10.5px; flex-shrink: 0; }

    .district-tooltip {
      background: rgba(13,26,42,0.85) !important;
      border: 1px solid #2a4d7a !important;
      color: #c8d8ea !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      border-radius: 6px !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4) !important;
    }
    .district-tooltip::before { display: none !important; }

    .leaflet-container { background: #1a2535 !important; }

    .toast {
      position: fixed; top: 68px; left: 50%; transform: translateX(-50%) translateY(-16px);
      background: rgba(22,36,55,0.96); border: 1px solid var(--border-light);
      color: var(--text-bright); padding: 9px 22px; border-radius: 22px;
      font-size: 13px; z-index: 9999; box-shadow: var(--shadow);
      opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .sidebar-toggle {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 900;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(78,155,255,0.5);
      transition: transform .2s, background .2s;
      align-items: center;
      justify-content: center;
    }
    .sidebar-toggle:hover { transform: scale(1.1); background: #6aabff; }
    .sidebar-toggle:active { transform: scale(0.95); }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 6;
      backdrop-filter: blur(2px);
    }
    .sidebar-overlay.show { display: block; }

    @media (max-width: 768px) {
      .app-shell { grid-template-columns: 1fr !important; }
      .sidebar {
        position: fixed; left: 0; top: 54px; bottom: 0;
        width: 85%; max-width: 320px;
        transform: translateX(-100%);
        transition: transform .3s ease;
        box-shadow: 4px 0 20px rgba(0,0,0,0.4);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-toggle { display: flex; }
      .topbar-right { display: none; }
      .map-hint { top: auto; bottom: 80px; right: 14px; font-size: 10px; }
      .map-legend { bottom: 80px; left: 14px; padding: 8px 10px; }
      .map-legend .legend-item { font-size: 10px; margin-bottom: 2px; }
    }

    @media (max-width: 480px) {
      .sidebar { width: 100%; max-width: 100%; }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="topbar-logo">🏮</div>
    <div>
      <div class="topbar-title">五人小分队</div>
      <div class="topbar-sub">城关区 · 七里河区 · 高德路网底图</div>
    </div>
    <div class="topbar-right">
      <span class="topbar-badge">🌟 黄河之都</span>
      <span class="topbar-badge">🍜 拉面之乡</span>
      <span class="topbar-badge">🌉 丝路重镇</span>
    </div>
  </header>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">📌 景点 &amp; 关注点</div>
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="spots" onclick="switchTab('spots')">景点列表</button>
        <button class="tab-btn" data-tab="distance" onclick="switchTab('distance')">距离速查</button>
      </div>
    </div>

    <div class="sidebar-body">
      <div class="tab-panel active" id="tab-spots">
        <div id="spot-list"></div>
      </div>
      <div class="tab-panel" id="tab-distance">
        <div class="dist-hint">基于 OSRM 真实路网（驾车/步行路线）· ≈ 表示估算 · ✓ 表示真实路线</div>
        <div id="dist-loading-hint">
          <span class="dist-prog-text">正在获取真实路线…</span>
          <div class="dist-prog-bar"><div class="dist-prog-bar-inner"></div></div>
        </div>
        <table class="dist-table">
          <thead>
            <tr><th>#</th><th>出发</th><th>目的地</th><th>驾车距离</th><th>步行时间</th><th>驾车时间</th></tr>
          </thead>
          <tbody id="dist-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="sidebar-footer">
      <button class="btn-add-mode" id="btn-add-mode">➕ 添加关注点</button>
    </div>
  </aside>

  <main class="map-area">
    <div id="map-container"></div>
    <div class="map-hint">🖱️ 滚轮缩放 · 拖拽平移 · 悬停查看详情</div>
    <div class="map-legend">
      <div class="legend-title">图 例</div>
      <div class="legend-item"><div class="legend-dot" style="background:#4E9BFF"></div>交通枢纽</div>
      <div class="legend-item"><div class="legend-dot" style="background:#52C41A"></div>公园景区</div>
      <div class="legend-item"><div class="legend-dot" style="background:#FA8C16"></div>美食街区</div>
      <div class="legend-item"><div class="legend-dot" style="background:#722ED1"></div>文博场馆</div>
      <div class="legend-item"><div class="legend-dot" style="background:#F5222D"></div>历史地标</div>
      <div class="legend-item"><div class="legend-dot" style="background:#EB2F96"></div>自定义点</div>
    </div>

    <div id="add-panel">
      <div class="add-panel-title">📍 添加自定义关注点</div>
      <form id="add-spot-form">
        <div class="form-group">
          <label>名称 <span style="color:#f5222d">*</span></label>

/**
 * 数据配置 - 兰州旅游地图

function calcDistanceHaversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLon = ((lon2 - lon1) * Math.PI) / 180;
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos((lat1 * Math.PI) / 180) *
      Math.cos((lat2 * Math.PI) / 180) *
      Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function calcDistance(lat1, lon1, lat2, lon2) {
  return calcDistanceHaversine(lat1, lon1, lat2, lon2).toFixed(2);
}

function calcTime(distanceKm) {
  const walkSpeed = 5;
  const driveSpeed = 30;
  const walkMin  = Math.round((distanceKm / walkSpeed)  * 60);
  const driveMin = Math.round((distanceKm / driveSpeed) * 60);
  const fmt = (m) =>
    m < 60 ? `约${m}分钟` : `约${Math.floor(m / 60)}时${m % 60}分`;
  return {
    walk:  walkMin  < 1 ? '<1分钟' : fmt(walkMin),
    drive: driveMin < 1 ? '<1分钟' : fmt(driveMin),
  };
}

async function fetchOSRMRoute(from, to, profile = 'driving') {
  const base = 'https://router.project-osrm.org/route/v1';
  const coords = `${from[0]},${from[1]};${to[0]},${to[1]}`;
  const url = `${base}/${profile}/${coords}?overview=false&alternatives=false`;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5000);
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) return null;
    const data = await res.json();
    if (data.code !== 'Ok' || !data.routes?.length) return null;
    return {
      distance: data.routes[0].distance,
      duration: data.routes[0].duration,
    };
  } catch {
    return null;
  }
}

function fmtSeconds(sec) {
  const m = Math.round(sec / 60);
  if (m < 1)  return '<1分钟';
  if (m < 60) return `约${m}分钟`;
  const h = Math.floor(m / 60), rm = m % 60;
  return rm ? `约${h}时${rm}分` : `约${h}小时`;
}

async function getRouteInfo(fromCoord, toCoord) {
  const [driveResult, walkResult] = await Promise.all([
    fetchOSRMRoute(fromCoord, toCoord, 'driving'),
    fetchOSRMRoute(fromCoord, toCoord, 'foot'),
  ]);

  if (driveResult && walkResult) {
    return {
      driveKm:   (driveResult.distance / 1000).toFixed(1),
      driveTime: fmtSeconds(driveResult.duration),
      walkKm:    (walkResult.distance  / 1000).toFixed(1),
      walkTime:  fmtSeconds(walkResult.duration),
      isEstimate: false,
    };
  }

  const straightKm = calcDistanceHaversine(
    fromCoord[1], fromCoord[0], toCoord[1], toCoord[0]
  );
  const driveKm = (straightKm * 1.3).toFixed(1);
  const walkKm  = (straightKm * 1.2).toFixed(1);
  return {
    driveKm,
    driveTime: fmtSeconds((parseFloat(driveKm) / 30) * 3600),
    walkKm,
    walkTime:  fmtSeconds((parseFloat(walkKm)  /  5) * 3600),
    isEstimate: true,
  };
}

async function buildDistanceMatrixAsync(spots, onProgress) {
  const pairs = [];
  for (let i = 0; i < spots.length; i++)
    for (let j = i + 1; j < spots.length; j++)
      pairs.push([spots[i], spots[j]]);

  const matrix = [];
  let done = 0;
  const CONCURRENCY = 3;
  for (let i = 0; i < pairs.length; i += CONCURRENCY) {
    const batch = pairs.slice(i, i + CONCURRENCY);
    const results = await Promise.all(batch.map(([a, b]) =>
      getRouteInfo(a.coord, b.coord).then(info => ({
        from: a.name, fromId: a.id,
        to: b.name,   toId: b.id,
        driveKm: info.driveKm,
        driveTime: info.driveTime,
        walkKm: info.walkKm,
        walkTime: info.walkTime,
        isEstimate: info.isEstimate,
      }))
    ));
    matrix.push(...results);
    done += batch.length;
    if (onProgress) onProgress(done, pairs.length);
  }
  return matrix.sort((a, b) => parseFloat(a.driveKm) - parseFloat(b.driveKm));
}

function getDistancesFrom(spotId, spots) {
  const target = spots.find(s => s.id === spotId);
  if (!target) return [];
  return spots
    .filter(s => s.id !== spotId)
    .map(s => {
      const dist = calcDistanceHaversine(
        target.coord[1], target.coord[0], s.coord[1], s.coord[0]
      );
      const driveDist = dist * 1.3;
      const walkDist  = dist * 1.2;
      return {
        id: s.id, name: s.name, icon: s.icon, color: s.color,
        distance: driveDist.toFixed(1),
        walk:  fmtSeconds((walkDist  /  5) * 3600),
        drive: fmtSeconds((driveDist / 30) * 3600),
        isEstimate: true,
      };
    })
    .sort((a, b) => parseFloat(a.distance) - parseFloat(b.distance));
}

let USER_SPOTS = [];

function addUserSpot(spot) {
  const newSpot = {
    id: 'user_' + Date.now(),
    name: spot.name,
    coord: spot.coord,
    type: 'custom',
    icon: '📍',
    color: '#EB2F96',
    markerColor: '#EB2F96',
    tags: ['自定义'],
    address: spot.address || '未填写地址',
    openTime: spot.openTime || '未知',
    desc: spot.desc || '用户自定义标注点',
    tips: spot.tips || '',
    rating: 0,
    bestTime: '—',
    duration: '—',
    isUserSpot: true,
    createdAt: new Date().toLocaleString('zh-CN'),
  };
  USER_SPOTS.push(newSpot);
  return newSpot;
}

function removeUserSpot(id) {
  USER_SPOTS = USER_SPOTS.filter(s => s.id !== id);
}

function updateUserSpot(id, changes) {
  const spot = USER_SPOTS.find(s => s.id === id);
  if (!spot) return null;
  if (changes.name    !== undefined) spot.name    = changes.name;
  if (changes.coord   !== undefined) spot.coord   = changes.coord;
  if (changes.address !== undefined) spot.address = changes.address;
  if (changes.desc    !== undefined) spot.desc    = changes.desc;
  spot.updatedAt = new Date().toLocaleString('zh-CN');
  return spot;
}

function getAllSpots() {
  return [...PRESET_SPOTS, ...USER_SPOTS];
}

function buildDistanceMatrix(spots) {
  const matrix = [];
  for (let i = 0; i < spots.length; i++) {
    for (let j = i + 1; j < spots.length; j++) {
      const a = spots[i], b = spots[j];
      const dist = parseFloat(calcDistance(a.coord[1], a.coord[0], b.coord[1], b.coord[0]));
      const time = calcTime(dist);
      matrix.push({ from: a.name, fromId: a.id, to: b.name, toId: b.id, distance: dist, walk: time.walk, drive: time.drive });
    }
  }
  return matrix.sort((a, b) => a.distance - b.distance);
}

    }
    if (editMode && editingSpotId) {
      confirmEditLocation(e.latlng.lng, e.latlng.lat);
    }
  });
}

async function loadDistrictBoundaries() {
  const districts = [
    { code: '620102', name: '城关区', color: '#4e9bff' },
    { code: '620103', name: '七里河区', color: '#52c41a' },
  ];

  for (const d of districts) {
    try {
      const resp = await fetch(`https://geo.datav.aliyun.com/areas_v3/bound/${d.code}.json`);
      if (!resp.ok) continue;
      const geoJson = await resp.json();
      const layer = L.geoJSON(geoJson, {
        style: {
          color: d.color,
          weight: 2,
          opacity: 0.7,
          fillColor: d.color,
          fillOpacity: 0.06,
          dashArray: '5, 4',
        },
        onEachFeature: (feature, layer) => {
          layer.bindTooltip(d.name, {
            permanent: false,
            className: 'district-tooltip',
            direction: 'center',
          });
        },
      }).addTo(map);
      districtLayers[d.code] = layer;
    } catch (e) {
      console.warn('区划数据加载失败：', d.name, e);
    }
  }
}

function renderAllMarkers() {
  Object.values(markersMap).forEach(m => map.removeLayer(m));
  markersMap = {};

  getAllSpots().forEach(spot => {
    const marker = createSpotMarker(spot);
    marker.addTo(map);
    markersMap[spot.id] = marker;
  });
}

function createSpotMarker(spot) {
  const [lng, lat] = spot.coord;

  const iconHtml = `
    <div class="custom-marker" style="--mc: ${spot.markerColor}">
      <div class="marker-pin">
        <span class="marker-emoji">${spot.icon}</span>
      </div>
      <div class="marker-label">${spot.name}</div>
    </div>`;

  const icon = L.divIcon({
    html: iconHtml,
    className: '',
    iconSize: [60, 68],
    iconAnchor: [30, 60],
    popupAnchor: [0, -62],
  });

  const marker = L.marker([lat, lng], { icon });

  marker.bindPopup(() => buildPopupHtml(spot), {
    maxWidth: 340,
    minWidth: 300,
    className: 'spot-popup',
    autoPan: true,
    autoPanPaddingTopLeft: [60, 60],
  });

  marker.on('mouseover', () => marker.openPopup());
  marker.on('click', () => {
    marker.openPopup();
    highlightSidebarItem(spot.id);
  });

  return marker;
}

function buildPopupHtml(spot) {
  const allSpots = getAllSpots();
  const distances = getDistancesFrom(spot.id, allSpots).slice(0, 4);
  const typeInfo = SPOT_TYPES[spot.type] || { label: '自定义', color: '#aaa' };
  const starsHtml = spot.rating > 0
    ? '⭐'.repeat(Math.round(spot.rating)) + ` <small style="color:#ffd666">${spot.rating}</small>`
    : '<span style="color:#888">暂无评分</span>';

  const distRows = distances.map(d => `
    <div class="pd-row">
      <span class="pd-dot" style="background:${d.color}"></span>
      <span class="pd-name">${d.icon} ${d.name}</span>
      <span class="pd-km">${d.distance}km</span>
      <span class="pd-time">🚶${d.walk} / 🚗${d.drive}</span>
    </div>`).join('');

  return `
    <div class="popup-inner">
      <div class="pi-head" style="border-left:4px solid ${spot.color}">
        <span class="pi-icon">${spot.icon}</span>
        <div class="pi-title-block">
          <div class="pi-name">${spot.name}</div>
          <div class="pi-type" style="color:${typeInfo.color}">${typeInfo.label}</div>
        </div>
        <div class="pi-actions">
          ${spot.isUserSpot ? `
            <button class="pi-edit"  onclick="openEditPanel('${spot.id}')">✏️ 编辑</button>
            <button class="pi-del"   onclick="deleteUserSpot('${spot.id}')">🗑️ 删除</button>
          ` : `
            <button class="pi-coord" onclick="openCoordFixPanel('${spot.id}')">📍 修正位置</button>
          `}
        </div>
      </div>
      <div class="pi-body">
        <div class="pi-rating">${starsHtml}</div>
        <div class="pi-tags">${spot.tags.map(t => `<span class="pi-tag">${t}</span>`).join('')}</div>
        <div class="pi-row">📍 ${spot.address}</div>
        <div class="pi-row">🕐 ${spot.openTime}</div>
        <div class="pi-row">⏱ 游览：${spot.duration} &nbsp;|&nbsp; 最佳：${spot.bestTime}</div>
        <div class="pi-desc">${spot.desc}</div>
        <div class="pi-tips">💡 <b>贴士：</b>${spot.tips}</div>
        ${distances.length ? `
        <div class="pi-dist">
          <div class="pd-title">📏 周边距离</div>
          ${distRows}
        </div>` : ''}
      </div>
    </div>`;
}

function initSidebar() {
  renderSidebarList();
}

function renderSidebarList() {
  const container = document.getElementById('spot-list');
  if (!container) return;
  container.innerHTML = getAllSpots().map(s => `
    <div class="spot-item ${s.isUserSpot ? 'user-spot' : ''}" id="si-${s.id}"
         onclick="focusSpot('${s.id}')">
      <span class="spot-item-icon">${s.icon}</span>
      <div class="spot-item-info">
        <div class="spot-item-name">${s.name}</div>
        <div class="spot-item-type" style="color:${(SPOT_TYPES[s.type] || {}).color || '#aaa'}">
          ${(SPOT_TYPES[s.type] || { label: '自定义' }).label}
        </div>
      </div>
      ${s.isUserSpot ? `
        <div class="spot-item-ops" onclick="event.stopPropagation()">
          <button class="si-btn si-edit" title="编辑位置" onclick="openEditPanel('${s.id}')">✏️</button>
          <button class="si-btn si-del"  title="删除"     onclick="deleteUserSpot('${s.id}')">🗑️</button>
        </div>` : `<div class="spot-item-badge" style="background:${s.color}"></div>`}
    </div>`).join('');
}

function focusSpot(id) {
  const spot = getAllSpots().find(s => s.id === id);
  if (!spot || !map) return;
  const [lng, lat] = spot.coord;
  map.setView([lat, lng], 16, { animate: true });
  setTimeout(() => {
    const m = markersMap[id];
    if (m) m.openPopup();
  }, 400);
  highlightSidebarItem(id);
}

function highlightSidebarItem(id) {
  document.querySelectorAll('.spot-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('si-' + id);
  if (el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}

function renderDistanceTable() {
  const matrix = buildDistanceMatrix(getAllSpots());
  const tbody = document.getElementById('dist-tbody');
  if (!tbody) return;
  tbody.innerHTML = matrix.map((row, i) => `
    <tr id="drow-${row.fromId}-${row.toId}">
      <td>${i + 1}</td>
      <td>${row.from}</td>
      <td>${row.to}</td>
      <td><span class="dist-km">${row.driveKm} km</span> <span class="dist-est" title="路网估算">≈</span></td>
      <td>🚶 ${row.walkTime}</td>
      <td>🚗 ${row.driveTime}</td>
    </tr>`).join('');
  refreshDistanceTableAsync();
}

async function refreshDistanceTableAsync() {
  const spots = getAllSpots();
  const tbody = document.getElementById('dist-tbody');
  if (!tbody) return;
  const hint = document.getElementById('dist-loading-hint');
  if (hint) hint.style.display = 'flex';
  let completedCount = 0;
  const pairs = [];
  for (let i = 0; i < spots.length; i++)
    for (let j = i + 1; j < spots.length; j++)
      pairs.push([spots[i], spots[j]]);
  const CONCURRENCY = 3;
  for (let i = 0; i < pairs.length; i += CONCURRENCY) {
    const batch = pairs.slice(i, i + CONCURRENCY);
    await Promise.all(batch.map(async ([a, b]) => {
      const info = await getRouteInfo(a.coord, b.coord);
      completedCount++;
      const row = document.getElementById(`drow-${a.id}-${b.id}`);
      if (!row) return;
      const tds = row.querySelectorAll('td');
      if (tds.length < 6) return;
      const estLabel = info.isEstimate ? ' <span class="dist-est" title="路网估算">≈</span>' : ' <span class="dist-real" title="真实路线">✓</span>';
      tds[3].innerHTML = `<span class="dist-km">${info.driveKm} km</span>${estLabel}`;
      tds[4].textContent = `🚶 ${info.walkTime}`;
      tds[5].textContent = `🚗 ${info.driveTime}`;
    }));
    if (hint) {
      const pct = Math.round((completedCount / pairs.length) * 100);
      hint.querySelector('.dist-prog-text').textContent = `正在获取真实路线… ${pct}%`;
      hint.querySelector('.dist-prog-bar-inner').style.width = pct + '%';
    }
  }
  if (hint) hint.style.display = 'none';
}

function initAddSpotPanel() {
  document.getElementById('btn-add-mode')?.addEventListener('click', () => {
    addMode = !addMode;
    const btn = document.getElementById('btn-add-mode');
    btn.classList.toggle('active', addMode);
    btn.textContent = addMode ? '✅ 点击地图选点...' : '➕ 添加关注点';
    map.getContainer().style.cursor = addMode ? 'crosshair' : '';
    if (!addMode) closeAddPanel();
  });
  document.getElementById('btn-add-cancel')?.addEventListener('click', () => {
    closeAddPanel(); exitAddMode();
  });
  document.getElementById('add-spot-form')?.addEventListener('submit', (e) => {
    e.preventDefault(); submitNewSpot();
  });
}

function openAddPanel(lng, lat) {
  const panel = document.getElementById('add-panel');
  if (!panel) return;
  document.getElementById('new-spot-lng').value = lng.toFixed(5);
  document.getElementById('new-spot-lat').value = lat.toFixed(5);
  document.getElementById('new-spot-name').value = '';
  document.getElementById('new-spot-addr').value = '';
  document.getElementById('new-spot-desc').value = '';
  panel.classList.add('show');
  document.getElementById('new-spot-name').focus();
}

function closeAddPanel() {
  document.getElementById('add-panel')?.classList.remove('show');
}

function exitAddMode() {
  addMode = false;
  const btn = document.getElementById('btn-add-mode');
  if (btn) { btn.classList.remove('active'); btn.textContent = '➕ 添加关注点'; }
  if (map) map.getContainer().style.cursor = '';
}

function submitNewSpot() {
  const name = document.getElementById('new-spot-name').value.trim();
  const lng = parseFloat(document.getElementById('new-spot-lng').value);
  const lat = parseFloat(document.getElementById('new-spot-lat').value);
  const addr = document.getElementById('new-spot-addr').value.trim();
  const desc = document.getElementById('new-spot-desc').value.trim();
  if (!name) { alert('请填写关注点名称'); return; }
  const spot = addUserSpot({ name, coord: [lng, lat], address: addr, desc });
  closeAddPanel();
  exitAddMode();
  const marker = createSpotMarker(spot);
  marker.addTo(map);
  markersMap[spot.id] = marker;
  renderSidebarList();
  renderDistanceTable();
  showToast(`✅ 已添加「${name}」`);
}

function deleteUserSpot(id) {
  const spot = USER_SPOTS.find(s => s.id === id);
  if (!spot) return;
  if (!confirm(`确认删除「${spot.name}」？`)) return;
  removeUserSpot(id);
  if (markersMap[id]) {
    markersMap[id].closePopup();
    map.removeLayer(markersMap[id]);
    delete markersMap[id];
  }
  renderSidebarList();
  renderDistanceTable();
  showToast(`🗑️ 已删除「${spot.name}」`);
}

function showToast(msg, duration = 2500) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), duration);
}

function switchTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(btn =>
    btn.classList.toggle('active', btn.dataset.tab === tabName));
  document.querySelectorAll('.tab-panel').forEach(panel =>
    panel.classList.toggle('active', panel.id === 'tab-' + tabName));
}

function initEditSpotPanel() {
  document.getElementById('btn-edit-cancel')?.addEventListener('click', () => {
    closeEditPanel(); resetEditPanelFields(); exitEditMode();
  });
  document.getElementById('btn-edit-relocate')?.addEventListener('click', () => {
    const panel = document.getElementById('edit-panel');
    panel?.classList.add('relocating');
    document.getElementById('edit-relocate-hint')?.classList.add('show');
    editMode = true;
    map.getContainer().style.cursor = 'crosshair';
    showToast('📍 请在地图上点击新位置...', 4000);
    closeEditPanel();
  });
  document.getElementById('edit-spot-form')?.addEventListener('submit', (e) => {
    e.preventDefault();
    submitEditSpot();
  });
}

function openEditPanel(id) {
  const spot = USER_SPOTS.find(s => s.id === id);
  if (!spot) return;
  if (markersMap[id]) markersMap[id].closePopup();
  editingSpotId = id;
  document.getElementById('edit-spot-id').value   = id;
  document.getElementById('edit-spot-name').value  = spot.name;
  document.getElementById('edit-spot-addr').value  = spot.address !== '未填写地址' ? spot.address : '';
  document.getElementById('edit-spot-desc').value  = spot.desc    !== '用户自定义标注点' ? spot.desc : '';
  setEditCoord(spot.coord[0], spot.coord[1]);
  const panel = document.getElementById('edit-panel');
  panel?.classList.remove('relocating');
  panel?.classList.add('show');
  document.getElementById('edit-spot-name').focus();
}

function setEditCoord(lng, lat) {
  document.getElementById('edit-spot-lng').value          = lng.toFixed(5);
  document.getElementById('edit-spot-lat').value          = lat.toFixed(5);
  document.getElementById('edit-coord-lng-text').textContent = lng.toFixed(5);
  document.getElementById('edit-coord-lat-text').textContent = lat.toFixed(5);
}

function closeEditPanel() {
  document.getElementById('edit-panel')?.classList.remove('show');
}

function exitEditMode() {
  editMode = false;
  editingSpotId = null;
  if (map) map.getContainer().style.cursor = '';
  document.getElementById('edit-relocate-hint')?.classList.remove('show');
}

function confirmEditLocation(lng, lat) {
  if (!editingSpotId) return;
  exitEditMode();
  const spot = USER_SPOTS.find(s => s.id === editingSpotId);
  if (!spot) return;
  setEditCoord(lng, lat);
  const panel = document.getElementById('edit-panel');
  panel?.classList.remove('relocating');
  panel?.classList.add('show');
  showToast(`✅ 新坐标已选定，点击"保存"确认`);
}

function submitEditSpot() {
  const id   = document.getElementById('edit-spot-id').value;
  const name = document.getElementById('edit-spot-name').value.trim();
  const addr = document.getElementById('edit-spot-addr').value.trim();
  const desc = document.getElementById('edit-spot-desc').value.trim();
  const lng  = parseFloat(document.getElementById('edit-spot-lng').value);
  const lat  = parseFloat(document.getElementById('edit-spot-lat').value);
  if (!name) { alert('名称不能为空'); return; }
  if (isNaN(lng) || isNaN(lat)) { alert('坐标无效，请重新选点'); return; }
  const isCoordFixMode = document.getElementById('edit-panel')?.classList.contains('coord-fix-mode');
  if (isCoordFixMode) {
    const spot = PRESET_SPOTS.find(s => s.id === id);
    if (!spot) { closeEditPanel(); resetEditPanelFields(); exitEditMode(); return; }
    spot.coord = [lng, lat];
    if (markersMap[id]) { map.removeLayer(markersMap[id]); delete markersMap[id]; }
    const newMarker = createSpotMarker(spot);
    newMarker.addTo(map);
    markersMap[id] = newMarker;
    map.setView([lat, lng], map.getZoom(), { animate: true });
    closeEditPanel();
    resetEditPanelFields();
    exitEditMode();
    renderSidebarList();
    renderDistanceTable();
    showToast(`✅ 「${spot.name}」位置已修正`);
    return;
  }
  const updated = updateUserSpot(id, {
    name,
    coord:   [lng, lat],
    address: addr || '未填写地址',
    desc:    desc || '用户自定义标注点',
  });
  if (!updated) return;
  if (markersMap[id]) {
    map.removeLayer(markersMap[id]);
    delete markersMap[id];
  }
  const newMarker = createSpotMarker(updated);
  newMarker.addTo(map);
  markersMap[id] = newMarker;
  map.setView([lat, lng], map.getZoom(), { animate: true });
  closeEditPanel();
  resetEditPanelFields();
  exitEditMode();
  renderSidebarList();
  renderDistanceTable();
  showToast(`✅ 「${updated.name}」已更新`);
}

function openCoordFixPanel(id) {
  const spot = getAllSpots().find(s => s.id === id);
  if (!spot) return;
  if (markersMap[id]) markersMap[id].closePopup();
  editingSpotId = id;
  document.getElementById('edit-spot-id').value  = id;
  document.getElementById('edit-spot-name').value = spot.name;
  document.getElementById('edit-spot-addr').value = spot.address;
  document.getElementById('edit-spot-desc').value = spot.desc || '';
  setEditCoord(spot.coord[0], spot.coord[1]);
  const nameEl = document.getElementById('edit-spot-name');
  const addrEl = document.getElementById('edit-spot-addr');
  const descEl = document.getElementById('edit-spot-desc');
  nameEl.readOnly = true; nameEl.style.opacity = '.45';
  addrEl.readOnly = true; addrEl.style.opacity = '.45';
  descEl.readOnly = true; descEl.style.opacity = '.45';
  const titleEl = document.querySelector('.edit-panel-title');
  const subEl   = document.querySelector('.edit-panel-sub');
  if (titleEl) titleEl.textContent = '📍 修正景点位置';
  if (subEl)   subEl.textContent   = '直接输入经纬度或点击「重新选点」在地图上标记';
  document.getElementById('edit-coord-display').style.display = 'none';
  document.getElementById('edit-coord-inputs').style.display = 'block';
  document.getElementById('edit-spot-lng-input').value = spot.coord[0].toFixed(5);
  document.getElementById('edit-spot-lat-input').value = spot.coord[1].toFixed(5);
  document.getElementById('coord-label').innerHTML = '坐标 &nbsp;<small style="color:var(--text-muted)">直接输入经纬度后点击「应用坐标」</small>';
  const panel = document.getElementById('edit-panel');
  panel?.classList.remove('relocating');
  panel?.classList.add('show', 'coord-fix-mode');
}

function applyCoordInput() {
  const lng = parseFloat(document.getElementById('edit-spot-lng-input').value);
  const lat = parseFloat(document.getElementById('edit-spot-lat-input').value);
  if (isNaN(lng) || isNaN(lat)) {
    showToast('⚠️ 请输入有效的经纬度');
    return;
  }
  if (lng < 103 || lng > 104 || lat < 35.5 || lat > 36.5) {
    showToast('⚠️ 经纬度超出兰州范围，请确认');
    return;
  }
  setEditCoord(lng, lat);
  showToast(`✅ 新坐标已设定：${lng.toFixed(5)}, ${lat.toFixed(5)}`);
}

function resetEditPanelFields() {
  ['edit-spot-name', 'edit-spot-addr', 'edit-spot-desc'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.readOnly = false; el.style.opacity = ''; }
  });
  const titleEl = document.querySelector('.edit-panel-title');
  const subEl   = document.querySelector('.edit-panel-sub');
  if (titleEl) titleEl.textContent = '✏️ 编辑关注点';
  if (subEl)   subEl.textContent   = '修改信息或重新在地图上选取位置';
  document.getElementById('edit-panel')?.classList.remove('coord-fix-mode');
  document.getElementById('edit-coord-display').style.display = 'flex';
  document.getElementById('edit-coord-inputs').style.display = 'none';
  document.getElementById('coord-label').innerHTML = '当前坐标 &nbsp;<small style="color:var(--text-muted)">点击「重新选点」可在地图上移动位置</small>';
}

function toggleSidebar() {
  const sidebar = document.querySelector('.sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const toggle = document.getElementById('sidebar-toggle');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
  if (sidebar.classList.contains('open')) {
    toggle.textContent = '✕';
  } else {
    toggle.textContent = '📋';
  }
}

function closeSidebar() {
  const sidebar = document.querySelector('.sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const toggle = document.getElementById('sidebar-toggle');
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
  toggle.textContent = '📋';
}
</script>
