<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专注流 FocusFlow — 让音乐匹配你的工作</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f5f3ff;
    --surface: rgba(255,255,255,0.72);
    --surface-solid: #ffffff;
    --text: #1a1a2e;
    --text-muted: #6b6b7b;
    --accent: #4B3FE3;
    --accent-soft: #ede9fe;
    --shadow: 0 8px 32px rgba(75,63,227,0.12);
    --glow: 0 0 60px rgba(75,63,227,0.15);
    --radius: 16px;
    --transition: 0.6s cubic-bezier(0.22,1,0.36,1);
  }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background var(--transition);
    overflow-x: hidden;
  }
  .ambient-glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(600px circle at 50% 30%, var(--glow-color, rgba(75,63,227,0.12)), transparent 70%);
    transition: background var(--transition);
  }
  .app { position: relative; z-index: 1; width: 100%; max-width: 520px; padding: 40px 24px; display: flex; flex-direction: column; gap: 28px; }
  header { text-align: center; }
  header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  header p { font-size: 14px; color: var(--text-muted); margin-top: 6px; }

  .task-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .task-card {
    background: var(--surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: var(--radius);
    padding: 18px 14px;
    cursor: pointer;
    text-align: center;
    transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
    position: relative;
    overflow: hidden;
  }
  .task-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .task-card.active {
    background: var(--surface-solid);
    box-shadow: 0 0 0 2px var(--accent), var(--shadow);
  }
  .task-card .icon { font-size: 28px; margin-bottom: 8px; display: block; }
  .task-card .label { font-size: 14px; font-weight: 600; }
  .task-card .hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  .player {
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .now-playing {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .cover {
    width: 56px; height: 56px;
    border-radius: 12px;
    background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .meta .track-name { font-size: 15px; font-weight: 600; }
  .meta .track-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .visualizer {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 4px;
    height: 40px;
  }
  .bar {
    width: 4px;
    border-radius: 2px;
    background: var(--accent);
    opacity: 0.35;
    transition: height 0.15s ease, opacity 0.3s;
  }
  .bar.active { opacity: 0.9; }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .btn {
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s, color 0.2s;
  }
  .btn:active { transform: scale(0.92); }
  .btn-play {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 16px rgba(75,63,227,0.35);
    font-size: 20px;
  }
  .btn-play:hover { transform: scale(1.05); }
  .btn svg { width: 22px; height: 22px; }
  .btn-play svg { width: 24px; height: 24px; }

  .volume {
    display: flex; align-items: center; gap: 10px;
  }
  .volume input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--accent-soft);
    outline: none;
  }
  .volume input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .timer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-muted);
  }
  .timer-btn {
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--accent-soft);
    background: transparent;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.2s;
  }
  .timer-btn:hover { background: var(--accent-soft); }
  .timer-btn.on { background: var(--accent); color: #fff; }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* Themes */
  body.theme-code      { --bg: #f0f1ff; --accent: #4B3FE3; --accent-soft: #e8e6ff; --glow-color: rgba(75,63,227,0.15); }
  body.theme-read      { --bg: #f0f7f4; --accent: #2d8a6e; --accent-soft: #daf1ea; --glow-color: rgba(45,138,110,0.15); }
  body.theme-creative  { --bg: #fff8f0; --accent: #d98e2a; --accent-soft: #fcebd6; --glow-color: rgba(217,142,42,0.15); }
  body.theme-data      { --bg: #f0f5ff; --accent: #2563eb; --accent-soft: #dbe6fe; --glow-color: rgba(37,99,235,0.15); }
  body.theme-write     { --bg: #faf8f5; --accent: #8c7b6c; --accent-soft: #efeae4; --glow-color: rgba(140,123,108,0.12); }
  body.theme-rest      { --bg: #fff0f5; --accent: #c45b8a; --accent-soft: #fce0ec; --glow-color: rgba(196,91,138,0.12); }

  /* Stats Panel */
  .stats-panel {
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    display: none;
    flex-direction: column;
    gap: 20px;
  }
  .stats-panel.open { display: flex; }
  .stats-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stats-title { font-size: 15px; font-weight: 600; }
  .stats-toggle {
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    background: none;
    border: none;
    font-weight: 500;
  }
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .metric {
    background: var(--surface-muted, #EFEFF2);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .metric-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    font-family: var(--font-metric, "Inter", sans-serif);
  }
  .metric-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .chart-block { display: flex; flex-direction: column; gap: 10px; }
  .chart-title { font-size: 13px; font-weight: 600; }
  .bar-chart {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 6px;
    height: 100px;
    padding-bottom: 20px;
    position: relative;
  }
  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
  }
  .bar-fill {
    width: 100%;
    border-radius: 4px 4px 0 0;
    background: var(--accent);
    opacity: 0.7;
    transition: height 0.5s ease;
    min-height: 2px;
  }
  .bar-label {
    font-size: 10px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .dist-chart { display: flex; flex-direction: column; gap: 8px; }
  .dist-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dist-name { width: 60px; font-size: 11px; color: var(--text-muted); text-align: right; }
  .dist-track { flex: 1; height: 8px; border-radius: 4px; background: var(--accent-soft); overflow: hidden; }
  .dist-fill { height: 100%; border-radius: 4px; background: var(--accent); opacity: 0.7; transition: width 0.5s ease; }
  .dist-val { width: 36px; font-size: 11px; color: var(--text-muted); text-align: right; }
</style>
</head>
<body class="theme-code">
<div class="ambient-glow"></div>
<div class="app">
  <header>
    <h1>专注流</h1>
    <p>选择工作内容，让音乐帮你进入心流</p>
  </header>

  <div class="task-grid" id="taskGrid">
    <div class="task-card active" data-task="code" data-theme="theme-code">
      <span class="icon">💻</span>
      <div class="label">写代码</div>
      <div class="hint">Lo-fi 70BPM</div>
    </div>
    <div class="task-card" data-task="read" data-theme="theme-read">
      <span class="icon">📖</span>
      <div class="label">深度阅读</div>
      <div class="hint">白噪音</div>
    </div>
    <div class="task-card" data-task="creative" data-theme="theme-creative">
      <span class="icon">💡</span>
      <div class="label">头脑风暴</div>
      <div class="hint">轻快纯器乐</div>
    </div>
    <div class="task-card" data-task="data" data-theme="theme-data">
      <span class="icon">📊</span>
      <div class="label">数据整理</div>
      <div class="hint">节奏 120BPM</div>
    </div>
    <div class="task-card" data-task="write" data-theme="theme-write">
      <span class="icon">📝</span>
      <div class="label">写文档</div>
      <div class="hint">安静氛围</div>
    </div>
    <div class="task-card" data-task="rest" data-theme="theme-rest">
      <span class="icon">🌿</span>
      <div class="label">休息放松</div>
      <div class="hint">舒缓和弦</div>
    </div>
  </div>

  <div class="player">
    <div class="now-playing">
      <div class="cover" id="coverIcon">💻</div>
      <div class="meta">
        <div class="track-name" id="trackName">编程专注模式</div>
        <div class="track-desc" id="trackDesc">Lo-fi 低频节拍 · 释放认知资源</div>
      </div>
    </div>
    <div class="visualizer" id="visualizer"></div>
    <div class="controls">
      <button class="btn" id="btnPrev" title="上一首">⏮</button>
      <button class="btn btn-play" id="btnPlay">▶</button>
      <button class="btn" id="btnNext" title="下一首">⏭</button>
    </div>
    <div class="volume">
      <span>🔊</span>
      <input type="range" id="volume" min="0" max="100" value="50">
    </div>
    <div class="timer-row">
      <span id="timerDisplay">专注时长 00:00</span>
      <button class="timer-btn" id="btnPomodoro">🍅 番茄钟 25min</button>
    </div>
  </div>

  <button class="timer-btn" id="btnShowStats" style="align-self:center;margin-top:4px;">📊 查看专注数据</button>

  <div class="stats-panel open" id="statsPanel">
    <div class="stats-header">
      <span class="stats-title">📊 专注数据</span>
      <button class="stats-toggle" id="btnToggleStats">收起</button>
    </div>
    <div class="metrics">
      <div class="metric">
        <div class="metric-value" id="metricToday">0</div>
        <div class="metric-label">今日专注(分钟)</div>
      </div>
      <div class="metric">
        <div class="metric-value" id="metricWeek">0</div>
        <div class="metric-label">本周专注(分钟)</div>
      </div>
      <div class="metric">
        <div class="metric-value" id="metricTotal">0</div>
        <div class="metric-label">累计专注(分钟)</div>
      </div>
    </div>
    <div class="chart-block">
      <div class="chart-title">最近7天专注时长</div>
      <div class="bar-chart" id="weekChart"></div>
    </div>
    <div class="chart-block">
      <div class="chart-title">任务类型分布</div>
      <div class="dist-chart" id="taskDist"></div>
    </div>
  </div>

  <footer>专注流 FocusFlow · TRAE AI 创造力大赛作品</footer>
</div>

<script>
const tasks = {
  code:     { name: '编程专注模式', desc: 'Lo-fi 低频节拍 · 释放认知资源', icon: '💻', bpm: 70,  type: 'lofi' },
  read:     { name: '深度阅读模式', desc: '白噪音 · 减少分心刺激', icon: '📖', bpm: 0,   type: 'noise' },
  creative: { name: '创意发散模式', desc: '轻快纯器乐 · 唤醒创造力', icon: '💡', bpm: 95,  type: 'bright' },
  data:     { name: '数据整理模式', desc: '规律节奏 · 同步提升效率', icon: '📊', bpm: 125, type: 'beat' },
  write:    { name: '写作安静模式', desc: '极简氛围 · 保护语义处理', icon: '📝', bpm: 50,  type: 'quiet' },
  rest:     { name: '休息放松模式', desc: '舒缓和弦 · 降低皮质醇', icon: '🌿', bpm: 60,  type: 'calm' }
};

let currentTask = 'code';
let isPlaying = false;
let audioCtx = null;
let nodes = [];
let visualizerInterval = null;
let timerInterval = null;
let seconds = 0;
let pomodoroOn = false;
let pomodoroSeconds = 25 * 60;
let sessionStartTime = null;
const STORAGE_KEY = 'focusflow_sessions';

const trackName = document.getElementById('trackName');
const trackDesc = document.getElementById('trackDesc');
const coverIcon = document.getElementById('coverIcon');
const btnPlay = document.getElementById('btnPlay');
const visualizer = document.getElementById('visualizer');
const timerDisplay = document.getElementById('timerDisplay');
const btnPomodoro = document.getElementById('btnPomodoro');

// Build visualizer bars
for (let i = 0; i < 20; i++) {
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.style.height = '4px';
  visualizer.appendChild(bar);
}

function formatTime(s) {
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const sec = (s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function updateTimer() {
  if (pomodoroOn) {
    pomodoroSeconds--;
    if (pomodoroSeconds <= 0) {
      pomodoroOn = false;
      pomodoroSeconds = 25 * 60;
      btnPomodoro.textContent = '🍅 番茄钟 25min';
      btnPomodoro.classList.remove('on');
      if (isPlaying) togglePlay();
      alert('🎉 专注时间结束，休息一下吧！');
    } else {
      timerDisplay.textContent = `🍅 剩余 ${formatTime(pomodoroSeconds)}`;
    }
  } else {
    seconds++;
    timerDisplay.textContent = `专注时长 ${formatTime(seconds)}`;
  }
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function stopAudio() {
  nodes.forEach(n => { try { n.stop(); n.disconnect(); } catch(e){} });
  nodes = [];
  stopVisualizer();
}

function playAudio(taskKey) {
  stopAudio();
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const t = tasks[taskKey];
  const now = audioCtx.currentTime;

  if (t.type === 'noise') {
    // Brown noise for reading
    const bufferSize = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    let lastOut = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      data[i] = (lastOut + (0.02 * white)) / 1.02;
      lastOut = data[i];
      data[i] *= 3.5;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    noise.loop = true;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.15;
    noise.connect(gain).connect(audioCtx.destination);
    noise.start();
    nodes.push(noise, gain);
  } else if (t.type === 'lofi') {
    // Low beat + soft drone
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = 80;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.12;
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    // Subtle LFO beat
    const lfo = audioCtx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = t.bpm / 60;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.06;
    lfo.connect(lfoGain).connect(gain.gain);
    lfo.start();
    nodes.push(osc, gain, lfo, lfoGain);
  } else if (t.type === 'bright') {
    const osc = audioCtx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = 220;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.08;
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    const lfo = audioCtx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.3;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.04;
    lfo.connect(lfoGain).connect(osc.frequency);
    lfo.start();
    nodes.push(osc, gain, lfo, lfoGain);
  } else if (t.type === 'beat') {
    const osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.value = 150;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 400;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.06;
    osc.connect(filter).connect(gain).connect(audioCtx.destination);
    osc.start();
    const lfo = audioCtx.createOscillator();
    lfo.type = 'square';
    lfo.frequency.value = t.bpm / 60;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.04;
    lfo.connect(lfoGain).connect(gain.gain);
    lfo.start();
    nodes.push(osc, filter, gain, lfo, lfoGain);
  } else if (t.type === 'quiet') {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = 110;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.05;
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    nodes.push(osc, gain);
  } else if (t.type === 'calm') {
    const osc1 = audioCtx.createOscillator();
    osc1.type = 'sine';
    osc1.frequency.value = 130;
    const osc2 = audioCtx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = 164;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.06;
    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(audioCtx.destination);
    osc1.start(); osc2.start();
    nodes.push(osc1, osc2, gain);
  }
  startVisualizer();
}

function startVisualizer() {
  stopVisualizer();
  const bars = document.querySelectorAll('.bar');
  visualizerInterval = setInterval(() => {
    bars.forEach(bar => {
      const h = Math.max(4, Math.random() * 36);
      bar.style.height = h + 'px';
      bar.classList.toggle('active', Math.random() > 0.5);
    });
  }, 120);
}
function stopVisualizer() {
  if (visualizerInterval) { clearInterval(visualizerInterval); visualizerInterval = null; }
  document.querySelectorAll('.bar').forEach(b => { b.style.height = '4px'; b.classList.remove('active'); });
}

function togglePlay() {
  isPlaying = !isPlaying;
  btnPlay.textContent = isPlaying ? '⏸' : '▶';
  if (isPlaying) {
    sessionStartTime = Date.now();
    playAudio(currentTask);
    startTimer();
  } else {
    stopAudio();
    stopTimer();
    saveSession();
  }
}

function saveSession() {
  if (!sessionStartTime) return;
  const durationSec = Math.floor((Date.now() - sessionStartTime) / 1000);
  sessionStartTime = null;
  if (durationSec < 5) return; // ignore accidental clicks
  const sessions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  sessions.push({
    task: currentTask,
    duration: durationSec,
    date: new Date().toISOString()
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
  renderStats();
}

function getSessions() {
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
}

function renderStats() {
  const sessions = getSessions();
  const now = new Date();
  const todayStr = now.toISOString().slice(0, 10);
  const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

  // Metrics
  let todaySec = 0, weekSec = 0, totalSec = 0;
  sessions.forEach(s => {
    const d = new Date(s.date);
    totalSec += s.duration;
    if (s.date.startsWith(todayStr)) todaySec += s.duration;
    if (d >= weekAgo) weekSec += s.duration;
  });
  document.getElementById('metricToday').textContent = Math.round(todaySec / 60);
  document.getElementById('metricWeek').textContent = Math.round(weekSec / 60);
  document.getElementById('metricTotal').textContent = Math.round(totalSec / 60);

  // Week chart (last 7 days)
  const weekChart = document.getElementById('weekChart');
  weekChart.innerHTML = '';
  const dayLabels = [];
  const dayValues = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now.getTime() - i * 24 * 60 * 60 * 1000);
    const ds = d.toISOString().slice(0, 10);
    dayLabels.push(`${d.getMonth() + 1}/${d.getDate()}`);
    let sec = 0;
    sessions.forEach(s => { if (s.date.startsWith(ds)) sec += s.duration; });
    dayValues.push(sec);
  }
  const maxVal = Math.max(...dayValues, 1);
  dayLabels.forEach((label, i) => {
    const pct = (dayValues[i] / maxVal) * 100;
    const min = Math.round(dayValues[i] / 60);
    const col = document.createElement('div');
    col.className = 'bar-col';
    col.innerHTML = `<div class="bar-fill" style="height:${pct}%"></div><div class="bar-label">${label}</div>`;
    if (min > 0) col.querySelector('.bar-fill').setAttribute('title', `${min}分钟`);
    weekChart.appendChild(col);
  });

  // Task distribution
  const taskDist = document.getElementById('taskDist');
  taskDist.innerHTML = '';
  const taskTotals = {};
  let distMax = 0;
  Object.keys(tasks).forEach(k => taskTotals[k] = 0);
  sessions.forEach(s => { if (taskTotals[s.task] !== undefined) taskTotals[s.task] += s.duration; });
  Object.values(taskTotals).forEach(v => { if (v > distMax) distMax = v; });
  if (distMax === 0) distMax = 1;
  Object.keys(tasks).forEach(k => {
    const v = taskTotals[k];
    const pct = (v / distMax) * 100;
    const min = Math.round(v / 60);
    const row = document.createElement('div');
    row.className = 'dist-row';
    row.innerHTML = `<div class="dist-name">${tasks[k].icon}</div><div class="dist-track"><div class="dist-fill" style="width:${pct}%"></div></div><div class="dist-val">${min}m</div>`;
    taskDist.appendChild(row);
  });
}

function selectTask(key) {
  currentTask = key;
  document.querySelectorAll('.task-card').forEach(c => c.classList.toggle('active', c.dataset.task === key));
  const t = tasks[key];
  trackName.textContent = t.name;
  trackDesc.textContent = t.desc;
  coverIcon.textContent = t.icon;
  document.body.className = document.querySelector(`[data-task="${key}"]`).dataset.theme;
  if (isPlaying) playAudio(key);
}

document.querySelectorAll('.task-card').forEach(card => {
  card.addEventListener('click', () => selectTask(card.dataset.task));
});

btnPlay.addEventListener('click', togglePlay);

document.getElementById('btnPrev').addEventListener('click', () => {
  const keys = Object.keys(tasks);
  const idx = keys.indexOf(currentTask);
  selectTask(keys[(idx - 1 + keys.length) % keys.length]);
});
document.getElementById('btnNext').addEventListener('click', () => {
  const keys = Object.keys(tasks);
  const idx = keys.indexOf(currentTask);
  selectTask(keys[(idx + 1) % keys.length]);
});

document.getElementById('volume').addEventListener('input', (e) => {
  const vol = e.target.value / 100;
  if (audioCtx) {
    const gainNodes = nodes.filter(n => n instanceof GainNode);
    gainNodes.forEach(g => { g.gain.setTargetAtTime(vol * 0.2, audioCtx.currentTime, 0.1); });
  }
});

btnPomodoro.addEventListener('click', () => {
  pomodoroOn = !pomodoroOn;
  if (pomodoroOn) {
    pomodoroSeconds = 25 * 60;
    btnPomodoro.textContent = '🍅 停止番茄钟';
    btnPomodoro.classList.add('on');
    seconds = 0;
    if (!isPlaying) togglePlay();
  } else {
    pomodoroSeconds = 25 * 60;
    btnPomodoro.textContent = '🍅 番茄钟 25min';
    btnPomodoro.classList.remove('on');
    timerDisplay.textContent = `专注时长 ${formatTime(seconds)}`;
  }
});

const statsPanel = document.getElementById('statsPanel');
const btnShowStats = document.getElementById('btnShowStats');
const btnToggleStats = document.getElementById('btnToggleStats');

function toggleStatsPanel() {
  const isOpen = statsPanel.classList.toggle('open');
  btnShowStats.style.display = isOpen ? 'none' : 'inline-block';
}

btnShowStats.addEventListener('click', toggleStatsPanel);
btnToggleStats.addEventListener('click', toggleStatsPanel);

// Init
renderStats();
</script>
</body>
</html>
