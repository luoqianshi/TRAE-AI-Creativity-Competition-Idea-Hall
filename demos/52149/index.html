<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业门户 - 一站式工作平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f5f6fa;
      --surface: #ffffff;
      --text-primary: #1a1a2e;
      --text-secondary: #6b7280;
      --text-tertiary: #9ca3af;
      --border: #e5e7eb;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.08);
      --radius: 16px;
      --radius-sm: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --accent: #4f46e5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* 顶部区域 */
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 48px 24px 80px;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 70%);
      border-radius: 50%;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
      border-radius: 50%;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .datetime {
      text-align: right;
      color: rgba(255,255,255,0.85);
    }

    .time {
      font-size: 32px;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }

    .date {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .greeting {
      color: #fff;
      margin-bottom: 24px;
    }

    .greeting h1 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .greeting p {
      font-size: 16px;
      opacity: 0.85;
      font-weight: 400;
    }

    .search-box {
      position: relative;
      max-width: 600px;
    }

    .search-box input {
      width: 100%;
      padding: 16px 24px 16px 52px;
      border: none;
      border-radius: var(--radius);
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      font-size: 16px;
      color: var(--text-primary);
      outline: none;
      transition: var(--transition);
      box-shadow: var(--shadow-lg);
    }

    .search-box input::placeholder {
      color: var(--text-tertiary);
    }

    .search-box input:focus {
      box-shadow: 0 0 0 3px rgba(255,255,255,0.3), var(--shadow-lg);
    }

    .search-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      font-size: 18px;
    }

    /* 主体内容 */
    .main {
      max-width: 1200px;
      margin: -40px auto 0;
      padding: 0 24px 60px;
      position: relative;
      z-index: 2;
    }

    /* 最近访问 */
    .recent-section {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.6s ease forwards;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .clear-recent {
      font-size: 13px;
      color: var(--text-tertiary);
      cursor: pointer;
      transition: var(--transition);
      background: none;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .clear-recent:hover {
      color: var(--accent);
      background: rgba(79, 70, 229, 0.06);
    }

    .recent-apps {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .recent-app {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
    }

    .recent-app:hover {
      background: #fff;
      border-color: var(--border);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .recent-app-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .recent-app-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* 应用分类 */
    .category {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.6s ease forwards;
    }

    .category:nth-child(2) { animation-delay: 0.1s; }
    .category:nth-child(3) { animation-delay: 0.2s; }
    .category:nth-child(4) { animation-delay: 0.3s; }
    .category:nth-child(5) { animation-delay: 0.4s; }
    .category:nth-child(6) { animation-delay: 0.5s; }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .app-card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 20px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .app-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, var(--card-gradient-from, #f8fafc) 0%, var(--card-gradient-to, #f1f5f9) 100%);
      opacity: 0;
      transition: var(--transition);
      z-index: 0;
    }

    .app-card:hover::before {
      opacity: 1;
    }

    .app-card:hover {
      border-color: var(--border);
      box-shadow: var(--shadow-md);
      transform: translateY(-3px);
    }

    .app-card > * {
      position: relative;
      z-index: 1;
    }

    .app-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      transition: var(--transition);
    }

    .app-card:hover .app-icon {
      transform: scale(1.1) rotate(-3deg);
    }

    .app-info {
      flex: 1;
      min-width: 0;
    }

    .app-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .app-arrow {
      color: var(--text-tertiary);
      opacity: 0;
      transform: translateX(-4px);
      transition: var(--transition);
      font-size: 14px;
    }

    .app-card:hover .app-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .empty-recent {
      color: var(--text-tertiary);
      font-size: 14px;
      padding: 12px 0;
    }

    /* 无搜索结果 */
    .no-result {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-tertiary);
    }

    .no-result-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .no-result-text {
      font-size: 16px;
    }

    /* 页脚 */
    .footer {
      text-align: center;
      padding: 32px;
      color: var(--text-tertiary);
      font-size: 13px;
    }

    /* 动画 */
    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 分类配色 */
    .cat-office .section-icon { background: linear-gradient(135deg, #dbeafe, #bfdbfe); }
    .cat-office .app-icon { background: linear-gradient(135deg, #3b82f6, #2563eb); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25); }
    .cat-office .app-card { --card-gradient-from: #eff6ff; --card-gradient-to: #dbeafe; }

    .cat-dev .section-icon { background: linear-gradient(135deg, #d1fae5, #a7f3d0); }
    .cat-dev .app-icon { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); }
    .cat-dev .app-card { --card-gradient-from: #ecfdf5; --card-gradient-to: #d1fae5; }

    .cat-data .section-icon { background: linear-gradient(135deg, #fed7aa, #fdba74); }
    .cat-data .app-icon { background: linear-gradient(135deg, #f97316, #ea580c); box-shadow: 0 4px 12px rgba(249, 115, 22, 0.25); }
    .cat-data .app-card { --card-gradient-from: #fff7ed; --card-gradient-to: #fed7aa; }

    .cat-hr .section-icon { background: linear-gradient(135deg, #fbcfe8, #f9a8d4); }
    .cat-hr .app-icon { background: linear-gradient(135deg, #ec4899, #db2777); box-shadow: 0 4px 12px rgba(236, 72, 153, 0.25); }
    .cat-hr .app-card { --card-gradient-from: #fdf2f8; --card-gradient-to: #fbcfe8; }

    .cat-finance .section-icon { background: linear-gradient(135deg, #a5f3fc, #67e8f9); }
    .cat-finance .app-icon { background: linear-gradient(135deg, #06b6d4, #0891b2); box-shadow: 0 4px 12px rgba(6, 182, 212, 0.25); }
    .cat-finance .app-card { --card-gradient-from: #ecfeff; --card-gradient-to: #a5f3fc; }

    /* 响应式 */
    @media (max-width: 768px) {
      .header { padding: 32px 20px 60px; }
      .header-top { flex-direction: column; gap: 20px; align-items: flex-start; }
      .datetime { text-align: left; }
      .time { font-size: 28px; }
      .greeting h1 { font-size: 28px; }
      .app-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
      .app-card { padding: 16px; }
      .app-icon { width: 40px; height: 40px; font-size: 20px; }
      .main { padding: 0 16px 40px; }
    }

    @media (max-width: 480px) {
      .app-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-top">
        <div class="brand">
          <div class="brand-icon">🚀</div>
          <div class="brand-name">企业门户</div>
        </div>
        <div class="datetime">
          <div class="time" id="clock">00:00</div>
          <div class="date" id="date">--月--日 星期-</div>
        </div>
      </div>
      <div class="greeting">
        <h1 id="greeting">你好，欢迎回来</h1>
        <p>这里是你的工作台，快速访问你需要的所有应用</p>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索应用...">
      </div>
    </div>
  </header>

  <main class="main">
    <!-- 最近访问 -->
    <section class="recent-section" id="recentSection">
      <div class="section-header">
        <div class="section-title">
          <span class="section-icon" style="background: linear-gradient(135deg, #e0e7ff, #c7d2fe);">🕐</span>
          最近访问
        </div>
        <button class="clear-recent" id="clearRecent">清空记录</button>
      </div>
      <div class="recent-apps" id="recentApps">
        <div class="empty-recent">暂无最近访问记录，点击下方的应用开始使用吧</div>
      </div>
    </section>

    <!-- 应用分类 -->
    <div id="appCategories"></div>
  </main>

  <footer class="footer">
    <p>企业门户系统 · 让工作更高效</p>
  </footer>

  <script>
    // 应用数据
    const categories = [
      {
        id: 'office',
        name: '办公协作',
        icon: '💼',
        class: 'cat-office',
        apps: [
          { name: '企业邮箱', desc: '安全稳定的邮件收发服务', icon: '📧', url: 'https://mail.example.com' },
          { name: '在线文档', desc: '多人实时协作编辑文档', icon: '📝', url: 'https://docs.example.com' },
          { name: '日程管理', desc: '智能安排会议与日程', icon: '📅', url: 'https://calendar.example.com' },
          { name: '视频会议', desc: '高清流畅的远程会议', icon: '📹', url: 'https://meet.example.com' },
          { name: '即时通讯', desc: '团队沟通协作平台', icon: '💬', url: 'https://im.example.com' },
          { name: '网盘存储', desc: '企业级云存储服务', icon: '☁️', url: 'https://drive.example.com' }
        ]
      },
      {
        id: 'dev',
        name: '研发工具',
        icon: '💻',
        class: 'cat-dev',
        apps: [
          { name: '代码仓库', desc: 'Git代码管理与协作', icon: '🔀', url: 'https://git.example.com' },
          { name: 'CI/CD', desc: '自动化构建与部署流水线', icon: '🔄', url: 'https://ci.example.com' },
          { name: 'API文档', desc: '接口文档管理与调试', icon: '📋', url: 'https://api.example.com' },
          { name: '监控告警', desc: '系统性能实时监控', icon: '📊', url: 'https://monitor.example.com' },
          { name: '日志平台', desc: '分布式日志收集分析', icon: '📜', url: 'https://log.example.com' },
          { name: '测试平台', desc: '自动化测试与质量保障', icon: '🧪', url: 'https://test.example.com' }
        ]
      },
      {
        id: 'data',
        name: '数据平台',
        icon: '📈',
        class: 'cat-data',
        apps: [
          { name: 'BI分析', desc: '商业智能数据分析', icon: '📉', url: 'https://bi.example.com' },
          { name: '报表中心', desc: '多维度报表查看与导出', icon: '📑', url: 'https://report.example.com' },
          { name: '数据仓库', desc: '企业数据资产管理', icon: '🗄️', url: 'https://dw.example.com' },
          { name: '实时大屏', desc: '数据可视化展示大屏', icon: '🖥️', url: 'https://dashboard.example.com' },
          { name: '指标平台', desc: '统一指标定义与管理', icon: '📏', url: 'https://metrics.example.com' },
          { name: '数据地图', desc: '数据血缘与资产地图', icon: '🗺️', url: 'https://datamap.example.com' }
        ]
      },
      {
        id: 'hr',
        name: '人力资源',
        icon: '👥',
        class: 'cat-hr',
        apps: [
          { name: '考勤系统', desc: '智能考勤与请假管理', icon: '⏰', url: 'https://attendance.example.com' },
          { name: '绩效考核', desc: '目标管理与绩效评估', icon: '📋', url: 'https://perf.example.com' },
          { name: '招聘管理', desc: '人才招聘与面试流程', icon: '🤝', url: 'https://recruit.example.com' },
          { name: '员工培训', desc: '在线学习与发展平台', icon: '🎓', url: 'https://learn.example.com' },
          { name: '组织架构', desc: '组织管理与人员信息', icon: '🏢', url: 'https://org.example.com' },
          { name: '薪酬福利', desc: '薪酬计算与福利管理', icon: '💰', url: 'https://payroll.example.com' }
        ]
      },
      {
        id: 'finance',
        name: '财务行政',
        icon: '💳',
        class: 'cat-finance',
        apps: [
          { name: '费用报销', desc: '在线报销与审批流程', icon: '🧾', url: 'https://expense.example.com' },
          { name: '预算管理', desc: '预算编制与执行跟踪', icon: '📐', url: 'https://budget.example.com' },
          { name: '发票中心', desc: '发票开具与查验管理', icon: '🎫', url: 'https://invoice.example.com' },
          { name: '资产管理', desc: '固定资产全生命周期管理', icon: '📦', url: 'https://asset.example.com' },
          { name: '合同管理', desc: '合同签署与履约跟踪', icon: '📄', url: 'https://contract.example.com' },
          { name: '采购平台', desc: '供应商管理与采购流程', icon: '🛒', url: 'https://procure.example.com' }
        ]
      }
    ];

    // 时钟与日期
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}`;

      const months = now.getMonth() + 1;
      const days = now.getDate();
      const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      document.getElementById('date').textContent = `${months}月${days}日 ${weekdays[now.getDay()]}`;

      // 问候语
      const hour = now.getHours();
      let greeting = '你好';
      if (hour < 6) greeting = '夜深了，注意休息';
      else if (hour < 9) greeting = '早上好，开启美好一天';
      else if (hour < 12) greeting = '上午好，工作愉快';
      else if (hour < 14) greeting = '中午好，适当休息';
      else if (hour < 18) greeting = '下午好，继续加油';
      else greeting = '晚上好，辛苦了';
      document.getElementById('greeting').textContent = greeting;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // 最近访问管理
    const RECENT_KEY = 'portal_recent';
    const MAX_RECENT = 8;

    function getRecent() {
      try {
        return JSON.parse(localStorage.getItem(RECENT_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveRecent(recent) {
      localStorage.setItem(RECENT_KEY, JSON.stringify(recent.slice(0, MAX_RECENT)));
    }

    function addRecent(app) {
      let recent = getRecent().filter(r => r.name !== app.name);
      recent.unshift({ ...app, time: Date.now() });
      saveRecent(recent);
      renderRecent();
    }

    function renderRecent() {
      const container = document.getElementById('recentApps');
      const recent = getRecent();
      if (recent.length === 0) {
        container.innerHTML = '<div class="empty-recent">暂无最近访问记录，点击下方的应用开始使用吧</div>';
        return;
      }
      container.innerHTML = recent.map(app => `
        <div class="recent-app" data-url="${app.url}" data-name="${app.name}" data-desc="${app.desc}" data-icon="${app.icon}">
          <div class="recent-app-icon" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white;">${app.icon}</div>
          <span class="recent-app-name">${app.name}</span>
        </div>
      `).join('');

      container.querySelectorAll('.recent-app').forEach(el => {
        el.addEventListener('click', () => {
          const app = {
            name: el.dataset.name,
            desc: el.dataset.desc,
            icon: el.dataset.icon,
            url: el.dataset.url
          };
          addRecent(app);
          window.open(app.url, '_blank');
        });
      });
    }

    document.getElementById('clearRecent').addEventListener('click', () => {
      localStorage.removeItem(RECENT_KEY);
      renderRecent();
    });

    // 渲染应用分类
    function renderCategories(filter = '') {
      const container = document.getElementById('appCategories');
      const filterLower = filter.toLowerCase().trim();
      let hasResult = false;

      const html = categories.map(cat => {
        const filteredApps = cat.apps.filter(app =>
          app.name.toLowerCase().includes(filterLower) ||
          app.desc.toLowerCase().includes(filterLower)
        );
        if (filteredApps.length === 0) return '';
        hasResult = true;

        return `
          <section class="category ${cat.class}">
            <div class="section-header">
              <div class="section-title">
                <span class="section-icon">${cat.icon}</span>
                ${cat.name}
              </div>
            </div>
            <div class="app-grid">
              ${filteredApps.map(app => `
                <div class="app-card" data-url="${app.url}" data-name="${app.name}" data-desc="${app.desc}" data-icon="${app.icon}">
                  <div class="app-icon">${app.icon}</div>
                  <div class="app-info">
                    <div class="app-name">${app.name}</div>
                    <div class="app-desc">${app.desc}</div>
                  </div>
                  <span class="app-arrow">→</span>
                </div>
              `).join('')}
            </div>
          </section>
        `;
      }).join('');

      if (!hasResult) {
        container.innerHTML = `
          <div class="no-result">
            <div class="no-result-icon">🔍</div>
            <div class="no-result-text">未找到匹配的应用，试试其他关键词</div>
          </div>
        `;
      } else {
        container.innerHTML = html;
      }

      // 绑定点击事件
      container.querySelectorAll('.app-card').forEach(card => {
        card.addEventListener('click', () => {
          const app = {
            name: card.dataset.name,
            desc: card.dataset.desc,
            icon: card.dataset.icon,
            url: card.dataset.url
          };
          addRecent(app);
          window.open(app.url, '_blank');
        });
      });
    }

    // 搜索功能
    const searchInput = document.getElementById('searchInput');
    let searchTimeout;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        renderCategories(e.target.value);
      }, 200);
    });

    // 初始化
    renderRecent();
    renderCategories();
  </script>
</body>
</html>
