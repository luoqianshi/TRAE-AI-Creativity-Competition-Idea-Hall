<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI生活微光 - 记录生活美好</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap');

        :root {
            --primary: #8B5CF6;
            --primary-light: #A78BFA;
            --primary-dark: #7C3AED;
            --secondary: #F472B6;
            --accent: #34D399;
            --bg-gradient-start: #FDF2F8;
            --bg-gradient-end: #EEF2FF;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
            --shadow: 0 10px 40px rgba(139, 92, 246, 0.15);
            --shadow-hover: 0 20px 60px rgba(139, 92, 246, 0.25);
            --radius: 20px;
            --radius-sm: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0 30px;
            animation: fadeInDown 0.8s ease-out;
        }

        header h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 300;
        }

        .main-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .upload-section {
            text-align: center;
            padding: 40px 20px;
            border: 3px dashed var(--primary-light);
            border-radius: var(--radius);
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.05) 0%, rgba(244, 114, 182, 0.05) 100%);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .upload-section:hover {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.1) 0%, rgba(244, 114, 182, 0.1) 100%);
            transform: translateY(-2px);
        }

        .upload-section.dragover {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.1) 0%, rgba(167, 139, 250, 0.1) 100%);
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            transition: transform 0.3s ease;
        }

        .upload-section:hover .upload-icon {
            transform: scale(1.1);
        }

        .upload-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        #fileInput {
            display: none;
        }

        .preview-section {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .image-preview {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: var(--radius);
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .ai-processing {
            text-align: center;
            padding: 30px;
        }

        .ai-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--primary-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .ai-text {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .ai-result {
            display: none;
        }

        .result-card {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.05) 0%, rgba(244, 114, 182, 0.05) 100%);
            border-radius: var(--radius-sm);
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary);
        }

        .result-label {
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-content {
            font-size: 1.1rem;
            color: var(--text-primary);
            line-height: 1.6;
            font-family: 'Noto Serif SC', serif;
        }

        .filter-section {
            margin-bottom: 20px;
        }

        .filter-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 15px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .filter-item {
            aspect-ratio: 1;
            border-radius: var(--radius-sm);
            overflow: hidden;
            cursor: pointer;
            position: relative;
            border: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .filter-item:hover {
            border-color: var(--primary-light);
            transform: scale(1.05);
        }

        .filter-item.active {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .filter-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease;
        }

        .filter-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 0.75rem;
            padding: 5px;
            text-align: center;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px 30px;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
        }

        .btn-secondary {
            background: white;
            color: var(--text-primary);
            border: 2px solid var(--primary-light);
        }

        .btn-secondary:hover {
            background: rgba(139, 92, 246, 0.05);
            border-color: var(--primary);
        }

        .gallery-section {
            margin-top: 40px;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .gallery-title {
            font-size: 1.5rem;
            font-family: 'Noto Serif SC', serif;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .gallery-item {
            aspect-ratio: 1;
            border-radius: var(--radius-sm);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .gallery-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .gallery-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease-out;
        }

        .overlay-image {
            max-width: 100%;
            max-height: 80vh;
            border-radius: var(--radius);
        }

        .overlay-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .overlay-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: white;
            padding: 15px 30px;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: var(--accent);
        }

        .toast.error {
            background: #EF4444;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }

            .main-card {
                padding: 20px;
            }

            .filter-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI生活微光</h1>
            <p>捕捉生活中的小美好，让每一刻都值得分享</p>
        </header>

        <div class="main-card">
            <div class="upload-section" id="uploadSection">
                <div class="upload-icon">📸</div>
                <div class="upload-text">点击或拖拽上传照片</div>
                <div class="upload-hint">支持 JPG、PNG 格式，AI将自动生成美好文案</div>
                <input type="file" id="fileInput" accept="image/jpeg,image/png">
            </div>

            <div class="preview-section" id="previewSection">
                <img src="" alt="预览" class="image-preview" id="imagePreview">
                
                <div class="ai-processing" id="aiProcessing">
                    <div class="ai-spinner"></div>
                    <div class="ai-text">AI正在识别照片内容...</div>
                </div>

                <div class="ai-result" id="aiResult">
                    <div class="result-card">
                        <div class="result-label">📝 AI生成文案</div>
                        <div class="result-content" id="generatedCaption"></div>
                    </div>

                    <div class="result-card">
                        <div class="result-label">🏷️ 智能标签</div>
                        <div class="result-content" id="generatedTags"></div>
                    </div>

                    <div class="filter-section">
                        <div class="filter-title">✨ 选择滤镜</div>
                        <div class="filter-grid" id="filterGrid"></div>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-secondary" id="btnRetry">
                            🔄 重新上传
                        </button>
                        <button class="btn btn-primary" id="btnShare">
                            🚀 一键分享
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="gallery-section">
            <div class="gallery-title">✨ 时光画廊</div>
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>
    </div>

    <div class="gallery-overlay" id="galleryOverlay">
        <button class="overlay-close" id="closeOverlay">×</button>
        <img src="" alt="大图" class="overlay-image" id="overlayImage">
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const imagePreview = document.getElementById('imagePreview');
        const aiProcessing = document.getElementById('aiProcessing');
        const aiResult = document.getElementById('aiResult');
        const generatedCaption = document.getElementById('generatedCaption');
        const generatedTags = document.getElementById('generatedTags');
        const filterGrid = document.getElementById('filterGrid');
        const btnRetry = document.getElementById('btnRetry');
        const btnShare = document.getElementById('btnShare');
        const galleryGrid = document.getElementById('galleryGrid');
        const galleryOverlay = document.getElementById('galleryOverlay');
        const overlayImage = document.getElementById('overlayImage');
        const closeOverlay = document.getElementById('closeOverlay');
        const toast = document.getElementById('toast');

        let currentImage = null;
        let currentFilter = 'none';

        const captions = [
            "阳光洒落窗台，这一刻的宁静，是生活最美的馈赠。",
            "街角的咖啡店飘来阵阵香气，美好的一天从这里开始。",
            "晚霞染红了天空，又是一个值得记录的傍晚。",
            "餐桌上的美食散发着诱人的香气，生活的小确幸就在眼前。",
            "漫步在公园小径，微风拂面，感受大自然的美好。",
            "夜幕降临，城市的灯光亮起，温暖而迷人。",
            "一杯热茶，一本好书，享受独处的时光。",
            "花开四季，每一朵都在诉说着生命的美好。",
            "雨后的街道格外清新，空气中弥漫着泥土的芬芳。",
            "和朋友相聚的时光，总是那么快乐而短暂。"
        ];

        const tagsList = [
            ["#生活美好", "#日常", "#小确幸", "#记录生活"],
            ["#咖啡时光", "#下午茶", "#慢生活", "#治愈"],
            ["#晚霞", "#夕阳", "#天空", "#美景"],
            ["#美食", "#吃货", "#烹饪", "#味蕾"],
            ["#公园", "#自然", "#散步", "#户外"],
            ["#夜景", "#城市", "#灯光", "#夜晚"],
            ["#阅读", "#安静", "#独处", "#书香"],
            ["#花朵", "#春天", "#自然", "#美丽"],
            ["#雨后", "#清新", "#天气", "#治愈"],
            ["#友情", "#聚会", "#快乐", "#朋友"]
        ];

        const filters = [
            { name: '原图', filter: 'none' },
            { name: '温暖', filter: 'sepia(0.3) saturate(1.2)' },
            { name: '清新', filter: 'saturate(1.3) contrast(1.1) brightness(1.05)' },
            { name: '复古', filter: 'sepia(0.5) contrast(1.1) brightness(0.9)' },
            { name: '冷调', filter: 'hue-rotate(180deg) saturate(0.8) brightness(1.05)' },
            { name: '明亮', filter: 'brightness(1.15) contrast(1.05) saturate(1.1)' },
            { name: '黑白', filter: 'grayscale(1)' },
            { name: '梦幻', filter: 'sepia(0.2) saturate(1.4) brightness(1.1) contrast(0.9)' }
        ];

        const sampleImages = [
            "https://picsum.photos/seed/life1/400/400",
            "https://picsum.photos/seed/life2/400/400",
            "https://picsum.photos/seed/life3/400/400",
            "https://picsum.photos/seed/life4/400/400",
            "https://picsum.photos/seed/life5/400/400",
            "https://picsum.photos/seed/life6/400/400"
        ];

        uploadSection.addEventListener('click', () => fileInput.click());

        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showToast('请上传图片文件', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                currentImage = e.target.result;
                imagePreview.src = currentImage;
                imagePreview.style.filter = 'none';
                currentFilter = 'none';
                
                uploadSection.style.display = 'none';
                previewSection.style.display = 'block';
                aiProcessing.style.display = 'block';
                aiResult.style.display = 'none';

                setTimeout(() => {
                    processAI();
                }, 2000);
            };
            reader.readAsDataURL(file);
        }

        function processAI() {
            const randomIndex = Math.floor(Math.random() * captions.length);
            generatedCaption.textContent = captions[randomIndex];
            generatedTags.textContent = tagsList[randomIndex].join(' ');

            renderFilters();
            
            aiProcessing.style.display = 'none';
            aiResult.style.display = 'block';
        }

        function renderFilters() {
            filterGrid.innerHTML = '';
            filters.forEach((filter, index) => {
                const div = document.createElement('div');
                div.className = `filter-item ${index === 0 ? 'active' : ''}`;
                div.innerHTML = `
                    <img src="${currentImage}" class="filter-preview" style="filter: ${filter.filter}">
                    <div class="filter-name">${filter.name}</div>
                `;
                div.addEventListener('click', () => {
                    document.querySelectorAll('.filter-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    imagePreview.style.filter = filter.filter;
                    currentFilter = filter.filter;
                });
                filterGrid.appendChild(div);
            });
        }

        btnRetry.addEventListener('click', () => {
            fileInput.value = '';
            uploadSection.style.display = 'block';
            previewSection.style.display = 'none';
            aiResult.style.display = 'none';
        });

        btnShare.addEventListener('click', () => {
            showToast('分享成功！✨', 'success');
            
            setTimeout(() => {
                addToGallery();
                btnRetry.click();
            }, 1500);
        });

        function addToGallery() {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `<img src="${currentImage}" class="gallery-image" style="filter: ${currentFilter}">`;
            item.addEventListener('click', () => {
                overlayImage.src = currentImage;
                overlayImage.style.filter = currentFilter;
                galleryOverlay.classList.add('active');
            });
            galleryGrid.insertBefore(item, galleryGrid.firstChild);
        }

        closeOverlay.addEventListener('click', () => {
            galleryOverlay.classList.remove('active');
        });

        galleryOverlay.addEventListener('click', (e) => {
            if (e.target === galleryOverlay) {
                galleryOverlay.classList.remove('active');
            }
        });

        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function initGallery() {
            sampleImages.forEach((src, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                const randomFilter = filters[Math.floor(Math.random() * filters.length)].filter;
                item.innerHTML = `<img src="${src}" class="gallery-image" style="filter: ${randomFilter}">`;
                item.addEventListener('click', () => {
                    overlayImage.src = src;
                    overlayImage.style.filter = randomFilter;
                    galleryOverlay.classList.add('active');
                });
                galleryGrid.appendChild(item);
            });
        }

        initGallery();
    </script>
</body>
</html>
