      --surface: #FFFFFF;

    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
    }

    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 430px;
      margin: 0 auto;

    }
    .rec-btn:active { transform: scale(0.92); }
    .rec-btn.recording {

    }
    .rec-btn .inner {
      width: 34px; height: 34px;

    .rec-hint {

    .record-meta {

    }
    .record-meta span {

    /* AI Result Panel */

    .ai-panel .ai-title {

      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent2);
      animation: blink 1.5s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tag {

    }
    .btn-secondary {
      background: var(--bg2);

    .map-view {

    }
    .sound-card .card-play {

    .market-card .mc-btn {

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;

    /* ===== Animations ===== */

    /* Toast */
    .toast {
      position: fixed;
      top: 50%; left: 50%;

      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 0.85rem;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }

<div id="app">

  <!-- ===== PAGE: Record ===== -->
  <div class="page active" id="page-record">
    <div class="page-header">
      <div></div>
      <h1>录音</h1>
      <button class="icon-btn">&#9881;</button>
    </div>
    <div class="record-container">
      <div class="wave-canvas">
        <canvas id="waveCanvas"></canvas>
      </div>
      <div class="timer" id="timer">00:00</div>
      <div class="timer-label">点击按钮开始录音</div>
      <div class="rec-btn" id="recBtn" onclick="toggleRecord()">
        <div class="inner"></div>
      </div>
      <div class="rec-hint" id="recHint">最长可录 5 分钟</div>

      <div class="record-meta">
        <span>&#128205; 上海市徐汇区</span>
        <span>&#9925; 多云 28&#8451;</span>
      </div>

      <div class="ai-panel" id="aiPanel">
        <div class="ai-title"><span class="dot"></span>AI 识别结果</div>
        <div class="tag-row" id="aiTags"></div>
        <div class="ai-desc" id="aiDesc"></div>
        <div class="ai-actions">
          <button class="btn-secondary" onclick="editCard()">编辑卡片</button>
          <button class="btn-primary" onclick="publishCard()">发布</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== PAGE: Map ===== -->
  <div class="page" id="page-map">
    <div class="page-header">
      <div></div>
      <h1>声音地图</h1>
      <button class="icon-btn">&#128269;</button>
    </div>
    <div class="map-view">
      <div class="map-canvas" id="mapCanvas">
        <!-- Streets -->
        <div class="map-street" style="top:15%;left:10%;width:80%;height:6px;transform:rotate(8deg)"></div>
        <div class="map-street" style="top:35%;left:5%;width:90%;height:5px;transform:rotate(-3deg)"></div>
        <div class="map-street" style="top:55%;left:15%;width:70%;height:6px;transform:rotate(5deg)"></div>
        <div class="map-street" style="top:75%;left:8%;width:85%;height:5px;transform:rotate(-2deg)"></div>
        <div class="map-street" style="top:10%;left:40%;width:5px;height:80%;transform:rotate(2deg)"></div>
        <div class="map-street" style="top:5%;left:65%;width:4px;height:85%;transform:rotate(-4deg)"></div>
        <!-- Pins -->
        <div class="map-pin" style="top:22%;left:35%" onclick="selectPin(this, '清晨的武康路', '上海', '鸟鸣,自行车,风铃')" data-title="清晨的武康路"></div>
        <div class="map-pin green" style="top:42%;left:58%" onclick="selectPin(this, '夏日雷雨', '杭州', '雷雨,荷叶,远雷')" data-title="夏日雷雨"></div>
        <div class="map-pin" style="top:62%;left:25%" onclick="selectPin(this, '深夜便利店', '北京', '自动门,冷柜,脚步声')" data-title="深夜便利店"></div>
        <div class="map-pin green" style="top:48%;left:78%" onclick="selectPin(this, '老街风铃声', '苏州', '风铃,木屐,叫卖')" data-title="老街风铃声"></div>
        <div class="map-pin" style="top:72%;left:52%" onclick="selectPin(this, '地铁进站提示音', '广州', '地铁,广播,人群')" data-title="地铁进站提示音"></div>
      </div>
      <div class="map-filter">
        <span class="filter-chip active" onclick="setFilter(this)">全部</span>
        <span class="filter-chip" onclick="setFilter(this)">自然</span>
        <span class="filter-chip" onclick="setFilter(this)">城市</span>
        <span class="filter-chip" onclick="setFilter(this)">交通</span>
        <span class="filter-chip" onclick="setFilter(this)">人群</span>
      </div>
      <div class="map-bottom-sheet" id="mapSheet">
        <div class="sheet-handle"></div>
        <div id="mapCardContent"></div>
      </div>
    </div>
  </div>

  <!-- ===== PAGE: Explore ===== -->
  <div class="page" id="page-explore">
    <div class="page-header">
      <div></div>
      <h1>探索</h1>
      <button class="icon-btn">&#128269;</button>
    </div>
    <div class="feed-tabs">
      <button class="feed-tab active" onclick="setFeedTab(this)">推荐</button>
      <button class="feed-tab" onclick="setFeedTab(this)">最新</button>
      <button class="feed-tab" onclick="setFeedTab(this)">附近</button>
      <button class="feed-tab" onclick="setFeedTab(this)">关注</button>
    </div>
    <div class="feed-list" id="feedList"></div>
  </div>

  <!-- ===== PAGE: Market ===== -->
  <div class="page" id="page-market">
    <div class="page-header">
      <div></div>
      <h1>声音市场</h1>
      <button class="icon-btn">&#128270;</button>
    </div>
    <div style="padding:0 16px 12px;overflow-x:auto;display:flex;gap:8px;">
      <span class="filter-chip active" style="font-size:0.72rem;" onclick="setMarketFilter(this)">推荐</span>

// ===== Toast =====
function showToast(msg) {

// ===== Waveform Animation =====
const canvas = document.getElementById('waveCanvas');
const ctx = canvas.getContext('2d');
let recording = false;
let recordTime = 0;
let animId;

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function drawWave() {
  const w = canvas.width / window.devicePixelRatio;
  const h = canvas.height / window.devicePixelRatio;
  ctx.clearRect(0, 0, w, h);

  const bars = 60;
  const barW = (w - (bars - 1) * 2) / bars;
  const time = Date.now() / 1000;

  for (let i = 0; i < bars; i++) {
    let amp;
    if (recording) {
      amp = Math.sin(time * 3 + i * 0.3) * 0.4 + Math.sin(time * 5 + i * 0.7) * 0.3 + Math.random() * 0.3;
      amp = Math.max(0.05, Math.min(1, Math.abs(amp)));
    } else {
      amp = Math.sin(time * 1.5 + i * 0.2) * 0.1 + 0.12;
      amp = Math.max(0.08, Math.min(0.25, Math.abs(amp)));
    }
    const barH = amp * h * 0.8;
    const x = i * (barW + 2);
    const y = (h - barH) / 2;

    const grad = ctx.createLinearGradient(0, y, 0, y + barH);
    if (recording) {
      grad.addColorStop(0, '#C8553D');
      grad.addColorStop(1, 'rgba(200,85,61,0.3)');
    } else {
      grad.addColorStop(0, '#8A847A');
      grad.addColorStop(1, 'rgba(138,132,122,0.2)');
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(x, y, barW, barH, 2);
    ctx.fill();
  }
  animId = requestAnimationFrame(drawWave);
}
drawWave();

// ===== Recording =====
let recordInterval;
function toggleRecord() {
  const btn = document.getElementById('recBtn');
  const timer = document.getElementById('timer');
  const hint = document.getElementById('recHint');
  const aiPanel = document.getElementById('aiPanel');

  if (!recording) {
    recording = true;
    btn.classList.add('recording');
    hint.textContent = '再次点击停止录音';
    recordTime = 0;
    recordInterval = setInterval(() => {
      recordTime++;
      const m = String(Math.floor(recordTime / 60)).padStart(2, '0');
      const s = String(recordTime % 60).padStart(2, '0');
      timer.textContent = `${m}:${s}`;
    }, 1000);
  } else {
    recording = false;
    btn.classList.remove('recording');
    hint.textContent = '最长可录 5 分钟';
    clearInterval(recordInterval);
    showAIResult();
  }
}

  showToast('AI 识别完成');
}
