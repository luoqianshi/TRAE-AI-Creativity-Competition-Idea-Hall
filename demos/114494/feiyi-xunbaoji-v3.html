<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>非遗寻宝记 V3 — AI 互动科普与文创工坊</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@300;400;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root{
  --bg-parchment:#f5f0e3;--bg-paper:#ede4d3;--text-ink:#3d3226;--text-sub:#6b5e4e;
  --accent-green:#7a9a6e;--accent-green-dark:#5a7a4e;--accent-gold:#c4a96a;
  --accent-gold-dark:#a08040;--border-wood:#8b7355;--border-light:#d4c5a9;
  --water-teal:#a8c4c2;--red-seal:#c04040;--red-seal-dark:#8b2020;
  --shadow:0 4px 20px rgba(60,40,20,.12);--shadow-lg:0 8px 40px rgba(60,40,20,.18);
  --radius:8px;--radius-lg:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Serif SC',serif;background:var(--bg-parchment);color:var(--text-ink);min-height:100vh;
  background-image:radial-gradient(ellipse at 20% 80%,rgba(122,154,110,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(196,169,106,.08) 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(168,196,194,.04) 0%,transparent 60%);
}
.app-header{text-align:center;padding:32px 20px 20px;position:relative}
.app-header::before{content:'';position:absolute;top:16px;left:50%;transform:translateX(-50%);width:60px;height:3px;background:linear-gradient(90deg,transparent,var(--accent-gold),transparent);border-radius:2px}
.app-title{font-family:'ZCOOL XiaoWei','Ma Shan Zheng',serif;font-size:42px;color:var(--text-ink);letter-spacing:6px;margin-bottom:4px}
.app-subtitle{font-size:14px;color:var(--text-sub);letter-spacing:4px}
.mode-tabs{display:flex;justify-content:center;gap:0;margin:24px auto 0;max-width:480px}
.mode-tab{font-family:'ZCOOL XiaoWei',serif;font-size:18px;padding:10px 36px;background:transparent;border:1px solid var(--border-light);color:var(--text-sub);cursor:pointer;transition:all .3s;letter-spacing:3px}
.mode-tab:first-child{border-radius:var(--radius) 0 0 var(--radius)}
.mode-tab:last-child{border-radius:0 var(--radius) var(--radius) 0}
.mode-tab.active{background:var(--accent-green);color:#fff;border-color:var(--accent-green)}
.mode-tab:hover:not(.active){background:var(--bg-paper);color:var(--text-ink)}
.main-container{max-width:1100px;margin:0 auto;padding:20px}
.mode-panel{display:none;animation:fadeIn .4s ease}
.mode-panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.panel-card{background:var(--bg-paper);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:28px;margin-bottom:20px;box-shadow:var(--shadow);position:relative}
.panel-card::before{content:'';position:absolute;top:0;left:20px;right:20px;height:1px;background:linear-gradient(90deg,transparent,var(--accent-gold),transparent)}
.panel-title{font-family:'ZCOOL XiaoWei',serif;font-size:22px;letter-spacing:3px;margin-bottom:16px;color:var(--text-ink);position:relative;padding-left:14px}
.panel-title::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:20px;background:var(--accent-green);border-radius:2px}
.map-area{position:relative;width:100%;max-width:700px;margin:0 auto}
.map-svg{width:100%;height:auto;display:block}
.province-shape{fill:#d4c9b0;stroke:#b8a88a;stroke-width:1.5;cursor:default;transition:all .3s}
.province-shape.clickable{fill:#c8d8b8;stroke:var(--accent-green);stroke-width:2;cursor:pointer;filter:drop-shadow(0 2px 4px rgba(122,154,110,.3))}
.province-shape.clickable:hover{fill:#b8d0a0;stroke:var(--accent-green-dark);stroke-width:2.5;filter:drop-shadow(0 4px 8px rgba(122,154,110,.5))}
.province-shape.completed{fill:#8b8b7a;stroke:#6b6b5a;stroke-width:1.5;cursor:not-allowed;opacity:.6}
.province-label{font-family:'ZCOOL XiaoWei',serif;font-size:13px;fill:var(--text-ink);pointer-events:none;text-anchor:middle}
.province-label.clickable-label{fill:var(--accent-green-dark);font-weight:bold}
.btn{font-family:'ZCOOL XiaoWei',serif;font-size:16px;padding:10px 28px;border:none;border-radius:var(--radius);cursor:pointer;letter-spacing:2px;transition:all .3s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent-green);color:#fff}
.btn-primary:hover{background:var(--accent-green-dark);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-primary:disabled{background:#bbb;cursor:not-allowed;transform:none}
.btn-gold{background:var(--accent-gold);color:#fff}
.btn-gold:hover{background:var(--accent-gold-dark);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-outline{background:transparent;border:1px solid var(--border-wood);color:var(--text-ink)}
.btn-outline:hover{background:var(--bg-parchment);border-color:var(--accent-green);color:var(--accent-green-dark)}
.btn-sm{font-size:13px;padding:6px 16px;letter-spacing:1px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.progress-bar{display:flex;gap:4px;margin:10px 0}
.progress-dot{width:12px;height:12px;border-radius:50%;background:var(--border-light);transition:all .3s}
.progress-dot.filled{background:var(--accent-green)}
.guess-game{text-align:center;padding:20px 0}
.guess-image-area{width:220px;height:220px;margin:0 auto 20px;border:3px solid var(--border-light);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;background:var(--bg-parchment);overflow:hidden;position:relative}
.guess-options{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.guess-option{font-family:'Noto Serif SC',serif;font-size:15px;padding:10px 24px;background:var(--bg-parchment);border:2px solid var(--border-light);border-radius:var(--radius);cursor:pointer;transition:all .3s;letter-spacing:1px}
.guess-option:hover{border-color:var(--accent-green);background:#e8f0e0}
.guess-option.correct{border-color:var(--accent-green);background:#d0e8c0;animation:pulse .5s}
.guess-option.wrong{border-color:var(--red-seal);background:#f8e0e0}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.guess-result{font-family:'ZCOOL XiaoWei',serif;font-size:18px;margin-top:16px;letter-spacing:2px}
.color-workshop{text-align:center}
.canvas-container{display:inline-block;border:3px solid var(--border-light);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);position:relative}
.canvas-container canvas{display:block}
.color-palette{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.color-swatch{width:32px;height:32px;border-radius:50%;border:2px solid var(--border-light);cursor:pointer;transition:all .2s}
.color-swatch:hover,.color-swatch.active{border-color:var(--text-ink);transform:scale(1.15)}
.tool-row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.region-indicator{font-size:12px;color:var(--text-sub);margin-top:6px;min-height:18px}
.fancy-reveal{position:fixed;inset:0;background:rgba(40,30,20,.85);z-index:150;display:flex;align-items:center;justify-content:center;flex-direction:column}
.fancy-reveal canvas{border:6px solid var(--accent-gold);border-radius:var(--radius-lg);box-shadow:0 0 60px rgba(196,169,106,.4);max-width:90vw;max-height:70vh;clip-path:inset(0 100% 0 0);animation:revealRight 1.5s ease-out forwards}
@keyframes revealRight{to{clip-path:inset(0 0 0 0)}}
.fancy-label{color:var(--accent-gold);font-family:'ZCOOL XiaoWei',serif;font-size:20px;letter-spacing:4px;margin-top:16px;animation:fadeIn 1s ease 1.2s both}
.selection-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.selection-card{border:2px solid var(--border-light);border-radius:var(--radius-lg);padding:16px 10px;text-align:center;cursor:pointer;transition:all .3s;background:var(--bg-parchment);position:relative}
.selection-card:hover{border-color:var(--accent-green);box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.selection-card.selected{border-color:var(--accent-green);background:#e8f0e0;box-shadow:0 0 0 3px rgba(122,154,110,.2)}
.selection-card .card-emoji{font-size:36px;margin-bottom:4px}
.selection-card .card-name{font-family:'ZCOOL XiaoWei',serif;font-size:14px;letter-spacing:1px}
.selection-card .card-province{font-size:11px;color:var(--accent-green-dark);letter-spacing:1px}
.selection-card .card-badge{position:absolute;top:6px;right:8px;background:var(--accent-green);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;display:none}
.selection-card.selected .card-badge{display:block}
.carousel-container{position:relative;max-width:800px;margin:0 auto;overflow:hidden}
.carousel-track{display:flex;transition:transform .5s ease}
.carousel-slide{min-width:100%;display:flex;justify-content:center}
.calendar-card{background:var(--bg-parchment);border:3px solid var(--accent-gold);border-radius:var(--radius-lg);padding:20px;display:flex;gap:16px;width:620px;max-width:95vw;box-shadow:var(--shadow-lg);align-items:stretch}
.calendar-card .card-left{flex:0 0 180px;display:flex;flex-direction:column;align-items:center}
.calendar-card .card-left .art-img{width:160px;height:160px;border-radius:var(--radius);border:2px solid var(--border-light);background:var(--bg-paper);overflow:hidden;display:flex;align-items:center;justify-content:center}
.calendar-card .card-left .art-img img{width:100%;height:100%;object-fit:contain}
.calendar-card .card-left .art-placeholder{font-size:60px;opacity:.3}
.calendar-card .card-left .heritage-label{font-family:'ZCOOL XiaoWei',serif;font-size:14px;margin-top:8px;letter-spacing:1px;text-align:center}
.calendar-card .card-left .province-label{font-size:11px;color:var(--accent-green-dark);margin-top:2px}
.calendar-card .card-right{flex:1;display:flex;flex-direction:column}
.calendar-card .card-right .month-title{font-family:'ZCOOL XiaoWei',serif;font-size:22px;text-align:center;letter-spacing:3px;color:var(--accent-green-dark);margin-bottom:8px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calendar-grid .day-header{font-size:11px;color:var(--text-sub);padding:4px 0;font-weight:600}
.calendar-grid .day-header.weekend{color:var(--red-seal)}
.calendar-grid .day-cell{font-size:12px;padding:3px 0;border-radius:4px;color:var(--text-ink)}
.calendar-grid .day-cell.empty{background:transparent}
.calendar-grid .day-cell.weekend{color:var(--red-seal)}
.calendar-grid .day-cell.highlight{background:var(--accent-green);color:#fff;font-weight:bold}
.carousel-nav{display:flex;justify-content:center;gap:20px;margin-top:16px}
.carousel-nav button{font-family:'ZCOOL XiaoWei',serif;font-size:18px;padding:8px 20px;background:var(--bg-paper);border:1px solid var(--border-light);border-radius:var(--radius);cursor:pointer;letter-spacing:2px;transition:all .3s}
.carousel-nav button:hover{background:var(--accent-green);color:#fff;border-color:var(--accent-green)}
.carousel-dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.carousel-dot{width:8px;height:8px;border-radius:50%;background:var(--border-light);transition:all .3s;cursor:pointer}
.carousel-dot.active{background:var(--accent-green);width:24px;border-radius:4px}
.kg-container{position:relative;width:100%;min-height:550px;overflow-x:auto}
.kg-svg{width:100%;min-width:800px;height:550px}
.kg-node{cursor:pointer;transition:all .3s}
.kg-node:hover{filter:drop-shadow(0 4px 8px rgba(122,154,110,.5))}
.kg-node-province{fill:#c8d8b8;stroke:var(--accent-green);stroke-width:2}
.kg-node-heritage{fill:#e8d8b0;stroke:var(--accent-gold);stroke-width:1.5}
.kg-edge{stroke:#8b7355;stroke-width:1;stroke-dasharray:8 4;fill:none;opacity:.5}
.kg-edge.strong{stroke:var(--accent-green);stroke-width:1.5;stroke-dasharray:none;opacity:.7}
.kg-label{font-family:'ZCOOL XiaoWei',serif;font-size:11px;fill:var(--text-ink);text-anchor:middle;pointer-events:none}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(40,30,20,.6);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal-content{background:var(--bg-parchment);border:2px solid var(--border-light);border-radius:var(--radius-lg);padding:32px;max-width:560px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg);position:relative;animation:fadeIn .3s ease}
.modal-close{position:absolute;top:12px;right:16px;font-size:24px;background:none;border:none;cursor:pointer;color:var(--text-sub);font-family:'Noto Serif SC',serif}
.modal-close:hover{color:var(--text-ink)}
.modal-content h2{font-family:'ZCOOL XiaoWei',serif;font-size:24px;letter-spacing:3px;margin-bottom:4px}
.modal-content .modal-province{color:var(--accent-green-dark);font-size:14px;letter-spacing:2px;margin-bottom:12px}
.modal-content .modal-image{width:100%;height:200px;background:var(--bg-paper);border-radius:var(--radius);margin-bottom:16px;display:flex;align-items:center;justify-content:center;font-size:64px;border:1px solid var(--border-light)}
.modal-content .modal-desc{font-size:14px;line-height:2;color:var(--text-sub);margin-bottom:12px}
.modal-content .modal-connections{font-size:13px;color:var(--accent-green-dark);line-height:1.8}
.heritage-card{background:var(--bg-parchment);border:1px solid var(--border-light);border-radius:var(--radius);padding:20px;margin-top:16px;animation:fadeIn .3s ease;cursor:pointer}
.heritage-card h3{font-family:'ZCOOL XiaoWei',serif;font-size:20px;letter-spacing:2px;margin-bottom:8px}
.heritage-card .province-tag{display:inline-block;font-size:12px;background:var(--accent-green);color:#fff;padding:2px 10px;border-radius:12px;margin-bottom:10px;letter-spacing:1px}
.heritage-desc{font-size:14px;color:var(--text-sub);line-height:1.8;margin-bottom:12px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text-ink);color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;z-index:200;animation:fadeIn .3s ease;letter-spacing:1px}
@media print{body{background:#fff}.app-header,.mode-tabs,.btn-row,.modal-overlay,.carousel-nav,.carousel-dots{display:none!important}.calendar-card{border:2px solid #999;break-inside:avoid}}
@media(max-width:768px){.selection-grid{grid-template-columns:repeat(2,1fr)}.app-title{font-size:28px;letter-spacing:3px}.mode-tab{font-size:15px;padding:8px 20px}.calendar-card{flex-direction:column;width:auto}.calendar-card .card-left{flex:0 0 auto}.kg-svg{height:400px;min-width:600px}}
@media(max-width:480px){.selection-grid{grid-template-columns:repeat(2,1fr)}.guess-option{font-size:13px;padding:8px 16px}}
</style>
</head>
<body>

<header class="app-header">
  <h1 class="app-title">非遗寻宝记</h1>
  <p class="app-subtitle">走遍中国 · 收集非遗 · 定制你的文化日历</p>
</header>

<nav class="mode-tabs">
  <button class="mode-tab active" onclick="switchMode('game')" id="tab-game">🎮 游戏模式</button>
  <button class="mode-tab" onclick="switchMode('knowledge')" id="tab-knowledge">📜 知识图谱</button>
</nav>

<div class="main-container">
  <!-- ==================== GAME MODE ==================== -->
  <div class="mode-panel active" id="panel-game">
    <div class="panel-card" id="game-step-map">
      <h2 class="panel-title">壹 · 探索华夏</h2>
      <p style="color:var(--text-sub);margin-bottom:12px;font-size:13px;">点击亮色省份，探索当地非遗宝藏。完成 6 省后解锁更多选择。</p>
      <div class="progress-bar" id="progress-bar"></div>
      <div class="map-area" id="game-map-area"></div>
    </div>
    <div class="panel-card" id="game-step-guess" style="display:none;">
      <h2 class="panel-title">贰 · 非遗猜猜看</h2>
      <p style="color:var(--text-sub);margin-bottom:4px;font-size:13px;" id="guess-province-hint"></p>
      <p style="color:var(--text-sub);margin-bottom:12px;font-size:12px;" id="guess-attempt-hint">图片会逐渐变清晰，猜猜这是什么非遗？</p>
      <div class="guess-game" id="guess-game-area"></div>
    </div>
    <div class="panel-card" id="game-step-color" style="display:none;">
      <h2 class="panel-title">叁 · 丹青工坊</h2>
      <p style="color:var(--text-sub);margin-bottom:4px;font-size:13px;">点击色块选择颜色，再点击图案中的封闭区域填色</p>
      <p style="color:var(--text-sub);margin-bottom:12px;font-size:12px;">💡 提示：每个图案有 5-6 个独立填色区域，边界线自动分隔</p>
      <div class="color-workshop" id="color-workshop-area"></div>
    </div>
    <div class="panel-card" id="game-step-selection" style="display:none;">
      <h2 class="panel-title">肆 · 精选非遗</h2>
      <p style="color:var(--text-sub);margin-bottom:12px;font-size:13px;">地图 6 省已探索完毕！请从下方 <strong id="pool-count">16</strong> 个省份中选 6 个，补全你的 12 月日历。</p>
      <div class="selection-grid" id="selection-grid"></div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn btn-primary" id="btn-finish-selection" onclick="finishSelection()" disabled>✨ 生成日历（还需选 6 个）</button>
      </div>
    </div>
    <div class="panel-card" id="game-step-calendar" style="display:none;">
      <h2 class="panel-title">伍 · 非遗日历</h2>
      <p style="color:var(--text-sub);margin-bottom:12px;font-size:13px;text-align:center;" id="calendar-status"></p>
      <div class="carousel-container" id="carousel-container"></div>
      <div class="carousel-nav">
        <button onclick="carouselPrev()">◀ 上一月</button>
        <button onclick="carouselNext()">下一月 ▶</button>
      </div>
      <div class="carousel-dots" id="carousel-dots"></div>
      <div class="btn-row" style="margin-top:20px;">
        <button class="btn btn-primary" onclick="exportCalendar()">🖨️ 下载日历</button>
        <button class="btn btn-outline" onclick="resetGame()">🔄 重新探索</button>
      </div>
    </div>
  </div>
  <!-- ==================== KNOWLEDGE MODE ==================== -->
  <div class="mode-panel" id="panel-knowledge">
    <div class="panel-card">
      <h2 class="panel-title">非遗知识图谱</h2>
      <p style="color:var(--text-sub);margin-bottom:12px;font-size:13px;">点击节点探索非遗关联。省份为核心，非遗为枝叶，贝塞尔曲线为脉络。</p>
      <div class="kg-container" id="kg-container"></div>
    </div>
    <div class="panel-card" id="kg-detail-card" style="display:none;">
      <h2 class="panel-title">非遗详情</h2>
      <div id="kg-detail-content"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="heritage-modal">
  <div class="modal-content" id="heritage-modal-content"></div>
</div>
<div class="toast" id="toast" style="display:none;"></div>

<script>
// ==================== DATA: 22 PROVINCES ====================
// ==================== REGION DEFINITIONS ====================
// Each heritage defines 5-6 closed polygon regions (relative to center cx,cy)
// Region coordinates are polygon points relative to (cx, cy)
function makeCirclePts(cx, cy, r, n) { const pts = []; for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return pts; }
function makeEllipsePts(cx, cy, rx, ry, n) { const pts = []; for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return pts; }

// Region definitions for each lineArt type
const REGION_DEFS = {
  // 京剧脸谱 - 6 regions
  mask: (cx, cy, r) => [
    { id: 'face', name: '面部底色', pts: makeEllipsePts(cx, cy, r * 0.75, r * 0.9, 32) },
    { id: 'forehead', name: '额头纹样', pts: (() => { const h = cy - r * 0.5; const w = r * 0.4; return [[cx - w, h], [cx, h - r * 0.25], [cx + w, h], [cx + w * 0.5, h + r * 0.15], [cx - w * 0.5, h + r * 0.15]]; })() },
    { id: 'leftEye', name: '左眼区域', pts: makeCirclePts(cx - r * 0.22, cy - r * 0.08, r * 0.16, 16) },
    { id: 'rightEye', name: '右眼区域', pts: makeCirclePts(cx + r * 0.22, cy - r * 0.08, r * 0.16, 16) },
    { id: 'mouth', name: '嘴部区域', pts: makeEllipsePts(cx, cy + r * 0.25, r * 0.22, r * 0.12, 16) },
    { id: 'chin', name: '下巴纹样', pts: (() => { const b = cy + r * 0.55; const w = r * 0.2; return [[cx - w, b - r * 0.12], [cx + w, b - r * 0.12], [cx + w * 0.6, b + r * 0.12], [cx - w * 0.6, b + r * 0.12]]; })() }
  ],
  // 苏绣 / 苗族银饰 - 6 regions (5 petals + center)
  flower: (cx, cy, r) => {
    const regions = [];
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 - Math.PI / 2;

    sichuan: `M${cx-35},${cy-18} L${cx+35},${cy-22} L${cx+30},${cy+20} L${cx-30},${cy+22} Z`,
    yunnan: `M${cx-30},${cy-20} L${cx+30},${cy-18} L${cx+28},${cy+22} L${cx-32},${cy+20} Z`,

// ==================== GAME: GUESS ====================
function renderGuessGame() {
  const province = ALL_PROVINCES[gameState.currentProvinceId];
  const heritage = province.heritage;
  const area = document.getElementById('guess-game-area');
  const allHeritages = Object.values(ALL_PROVINCES).map(p => p.heritage);
  const wrongOptions = allHeritages.filter(h => h.id !== heritage.id).sort(() => Math.random() - .5).slice(0, 2);
  const options = [heritage, ...wrongOptions].sort(() => Math.random() - .5);
  const blurLevel = gameState.guessAttempts === 0 ? 20 : gameState.guessAttempts === 1 ? 10 : 0;

  let html = `<div class="guess-image-area">`;
  html += `<div style="font-size:${blurLevel === 20 ? 60 : 80}px;opacity:${blurLevel === 20 ? 0.2 : 0.5};filter:blur(${blurLevel}px);">${heritage.emoji}</div>`;
  html += `</div>`;
  html += `<div class="guess-options">`;
  options.forEach(h => {
    html += `<button class="guess-option" onclick="submitGuess('${h.id}', this)">${h.emoji} ${h.name}</button>`;
  });
  html += `</div>`;
  html += `<div class="guess-result" id="guess-result"></div>`;
  html += `<div class="btn-row" style="margin-top:12px;"><button class="btn btn-outline btn-sm" onclick="skipGuess()">跳过 → 直接涂色</button></div>`;
  area.innerHTML = html;
}

function submitGuess(heritageId, el) {
  const province = ALL_PROVINCES[gameState.currentProvinceId];
  const heritage = province.heritage;
  const resultEl = document.getElementById('guess-result');
  if (heritageId === heritage.id) {
    el.classList.add('correct');
    resultEl.innerHTML = `<span style="color:var(--accent-green-dark);">✓ 答对了！这是「${heritage.name}」</span>`;
    setTimeout(() => showColorWorkshop(), 800);
  } else {
    gameState.guessAttempts++;
    el.classList.add('wrong');
    if (gameState.guessAttempts >= 3) {
      resultEl.innerHTML = `<span style="color:var(--text-ink);">正确答案是「${heritage.name}」${heritage.emoji}</span>`;
      setTimeout(() => showColorWorkshop(), 1000);
    } else {
      resultEl.innerHTML = `<span style="color:var(--red-seal);">✗ 再试一次！图片会更清晰</span>`;
      document.getElementById('guess-attempt-hint').textContent = `第 ${gameState.guessAttempts + 1} 次尝试，图片更清晰了~`;
      setTimeout(() => { el.classList.remove('wrong'); renderGuessGame(); }, 600);
    }
  }
}
function skipGuess() { showColorWorkshop(); }

// ==================== GAME: REGION-BASED COLOR WORKSHOP ====================
let colorCanvas = null, regionMapCanvas = null;
let currentColor = '#c04040';
let regionColors = {}; // regionId -> color
let colorHistoryStack = [];

function getRegionDefs(lineArt, cx, cy, r) {
  if (typeof REGION_DEFS[lineArt] === 'function') {
    return REGION_DEFS[lineArt](cx, cy, r);
  }
  return REGION_DEFS[lineArt] || [];
}

function showColorWorkshop() {
  gameState.phase = 'color';
  document.getElementById('game-step-color').style.display = 'block';
  const province = ALL_PROVINCES[gameState.currentProvinceId];
  const heritage = province.heritage;
  const area = document.getElementById('color-workshop-area');

  let html = `
    <div style="margin-bottom:8px;color:var(--text-sub);font-size:13px;">正在创作：<strong>${heritage.name}</strong> ${heritage.emoji}</div>
    <div class="canvas-container">
      <canvas id="colorCanvas" width="360" height="360"></canvas>
    </div>
    <div class="region-indicator" id="region-indicator">点击封闭区域开始填色</div>
    <div class="color-palette" id="color-palette"></div>
    <div class="tool-row">
      <button class="btn btn-outline btn-sm" onclick="undoRegionFill()">↩ 撤销</button>
      <button class="btn btn-outline btn-sm" onclick="setEraser()">🧹 橡皮擦</button>
      <button class="btn btn-outline btn-sm" onclick="resetRegionCanvas()">🔄 重置</button>
      <button class="btn btn-primary btn-sm" onclick="finishColoring()">✨ 完成创作</button>
    </div>
  `;
  area.innerHTML = html;
  document.getElementById('game-step-color').scrollIntoView({ behavior: 'smooth' });
  colorHistoryStack = [];
  regionColors = {};
  setTimeout(() => initRegionCanvas(heritage), 100);
}

function initRegionCanvas(heritage) {
  colorCanvas = document.getElementById('colorCanvas');
  const ctx = colorCanvas.getContext('2d');
  const cx = 180, cy = 180, r = 100;

  // Create hidden region map canvas
  regionMapCanvas = document.createElement('canvas');
  regionMapCanvas.width = 360;
  regionMapCanvas.height = 360;
  const mctx = regionMapCanvas.getContext('2d');

  const regions = getRegionDefs(heritage.lineArt, cx, cy, r);

  // Draw background
  ctx.fillStyle = '#faf6ee';
  ctx.fillRect(0, 0, 360, 360);
  mctx.fillStyle = '#000000';
  mctx.fillRect(0, 0, 360, 360);

  // Draw double border
  ctx.strokeStyle = '#c8b898'; ctx.lineWidth = 2;
  ctx.strokeRect(10, 10, 340, 340);
  ctx.strokeStyle = '#d4c9b0'; ctx.lineWidth = 1;
  ctx.strokeRect(16, 16, 328, 328);

  // Draw each region
  regions.forEach((region, idx) => {
    const colorIdx = idx + 1; // 1-based color key
    const rVal = (colorIdx & 0xFF0000) >> 16;
    const gVal = (colorIdx & 0x00FF00) >> 8;
    const bVal = colorIdx & 0x0000FF;
    const keyColor = `rgb(${rVal},${gVal},${bVal})`;

    // Draw on region map
    mctx.fillStyle = keyColor;
    mctx.beginPath();
    region.pts.forEach((pt, i) => {
      if (i === 0) mctx.moveTo(pt[0], pt[1]);
      else mctx.lineTo(pt[0], pt[1]);
    });
    mctx.closePath();
    mctx.fill();

    // Draw on visible canvas
    ctx.fillStyle = '#faf6ee';
    ctx.strokeStyle = '#4a3a2a';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    region.pts.forEach((pt, i) => {
      if (i === 0) ctx.moveTo(pt[0], pt[1]);
      else ctx.lineTo(pt[0], pt[1]);
    });
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });

  // Heritage name and emoji
  ctx.fillStyle = '#3d3226';
  ctx.font = '18px "ZCOOL XiaoWei", "Ma Shan Zheng", serif';
  ctx.textAlign = 'center';
  ctx.fillText(heritage.name, cx, 340);
  ctx.font = '30px serif';
  ctx.fillText(heritage.emoji, cx, cy + 118);

  // Palette
  currentColor = heritage.palette[0];
  const palette = document.getElementById('color-palette');
  palette.innerHTML = heritage.palette.map((c, i) =>
    `<div class="color-swatch ${i === 0 ? 'active' : ''}" style="background:${c};" onclick="selectColor('${c}', this)"></div>`
  ).join('');

  colorCanvas.addEventListener('click', handleRegionClick);
}

function handleRegionClick(e) {
  const rect = colorCanvas.getBoundingClientRect();
  const scaleX = colorCanvas.width / rect.width;
  const scaleY = colorCanvas.height / rect.height;
  const x = Math.floor((e.clientX - rect.left) * scaleX);
  const y = Math.floor((e.clientY - rect.top) * scaleY);

  if (x < 0 || y < 0 || x >= 360 || y >= 360) return;

  // Get region ID from hidden map
  const mctx = regionMapCanvas.getContext('2d');
  const pixel = mctx.getImageData(x, y, 1, 1).data;
  const regionIdx = pixel[2] + (pixel[1] << 8) + (pixel[0] << 16) - 1;

  if (regionIdx < 0) {
    document.getElementById('region-indicator').textContent = '请点击图案中的封闭区域';
    return;
  }

  const province = ALL_PROVINCES[gameState.currentProvinceId];
  const heritage = province.heritage;
  const regions = getRegionDefs(heritage.lineArt, 180, 180, 100);
  const region = regions[regionIdx];

  // Save state for undo
  colorHistoryStack.push({ ...regionColors });
  if (colorHistoryStack.length > 30) colorHistoryStack.shift();

  // Apply color
  regionColors[region.id] = currentColor;
  redrawRegionCanvas(heritage);
  document.getElementById('region-indicator').textContent = `已填色：${region.name} → ${currentColor}`;
}

function redrawRegionCanvas(heritage) {
  const ctx = colorCanvas.getContext('2d');
  const cx = 180, cy = 180, r = 100;
  const regions = getRegionDefs(heritage.lineArt, cx, cy, r);

  ctx.fillStyle = '#faf6ee';
  ctx.fillRect(0, 0, 360, 360);

  ctx.strokeStyle = '#c8b898'; ctx.lineWidth = 2;
  ctx.strokeRect(10, 10, 340, 340);
  ctx.strokeStyle = '#d4c9b0'; ctx.lineWidth = 1;
  ctx.strokeRect(16, 16, 328, 328);

  regions.forEach(region => {
    ctx.fillStyle = regionColors[region.id] || '#faf6ee';
    ctx.strokeStyle = '#4a3a2a';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    region.pts.forEach((pt, i) => {
      if (i === 0) ctx.moveTo(pt[0], pt[1]);
      else ctx.lineTo(pt[0], pt[1]);
    });
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });

  ctx.fillStyle = '#3d3226';
  ctx.font = '18px "ZCOOL XiaoWei", "Ma Shan Zheng", serif';
  ctx.textAlign = 'center';
  ctx.fillText(heritage.name, cx, 340);
  ctx.font = '30px serif';
  ctx.fillText(heritage.emoji, cx, cy + 118);
}

function selectColor(color, el) {
  currentColor = color;
  document.querySelectorAll('#color-palette .color-swatch').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
}

function setEraser() {
  currentColor = '#faf6ee';
  document.querySelectorAll('#color-palette .color-swatch').forEach(s => s.classList.remove('active'));
}

function undoRegionFill() {
  if (colorHistoryStack.length === 0) return;
  regionColors = colorHistoryStack.pop();
  const province = ALL_PROVINCES[gameState.currentProvinceId];
  redrawRegionCanvas(province.heritage);
  document.getElementById('region-indicator').textContent = '已撤销';
}

function resetRegionCanvas() {
  const province = ALL_PROVINCES[gameState.currentProvinceId];
  colorHistoryStack = [];
  regionColors = {};
  redrawRegionCanvas(province.heritage);
  document.getElementById('region-indicator').textContent = '已重置';
}

function finishColoring() {
  const province = ALL_PROVINCES[gameState.currentProvinceId];
  const heritage = province.heritage;
  const artDataUrl = colorCanvas.toDataURL('image/png');
  generateFancyImage(artDataUrl, province, heritage);
}

// ==================== FANCY IMAGE GENERATION ====================
function generateFancyImage(originalDataUrl, province, heritage) {
  const fancyCanvas = document.createElement('canvas');
  fancyCanvas.width = 400; fancyCanvas.height = 520;
  const fctx = fancyCanvas.getContext('2d');

  fctx.fillStyle = '#f5f0e3';
  fctx.fillRect(0, 0, 400, 520);

  const img = new Image();
  img.onload = () => {
    fctx.drawImage(img, 20, 20, 360, 360);

    fctx.strokeStyle = '#c4a96a'; fctx.lineWidth = 4;
    fctx.strokeRect(10, 10, 380, 500);
    fctx.strokeStyle = '#8b7355'; fctx.lineWidth = 1;
    fctx.strokeRect(16, 16, 368, 488);

    [[20,20],[380,20],[20,380],[380,380]].forEach(([cx, cy]) => {
      fctx.strokeStyle = '#c4a96a'; fctx.lineWidth = 2;
      fctx.beginPath(); fctx.arc(cx, cy, 8, 0, Math.PI * 2); fctx.stroke();
      fctx.beginPath(); fctx.arc(cx, cy, 4, 0, Math.PI * 2); fctx.fillStyle = '#c4a96a'; fctx.fill();
    });

    fctx.fillStyle = '#3d3226';
    fctx.font = '28px "ZCOOL XiaoWei", "Ma Shan Zheng", serif';
    fctx.textAlign = 'center';
    fctx.fillText(heritage.name, 200, 420);
    fctx.fillStyle = '#7a9a6e';
    fctx.font = '16px "Noto Serif SC", serif';
    fctx.fillText(province.name, 200, 450);
    fctx.fillStyle = '#c4a96a';
    fctx.font = '14px "ZCOOL XiaoWei", serif';
    fctx.fillText(`· ${province.month}月 ·`, 200, 475);
    fctx.fillStyle = 'rgba(192,64,64,0.6)';
    fctx.font = '18px "ZCOOL XiaoWei", serif';
    fctx.fillText('非遗', 360, 470);

    showFancyReveal(fancyCanvas.toDataURL('image/png'), province, heritage);
  };
  img.src = originalDataUrl;
}

function showFancyReveal(fancyDataUrl, province, heritage) {
  const existing = document.querySelector('.fancy-reveal');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'fancy-reveal';
  overlay.innerHTML = `<canvas id="fancyRevealCanvas" width="400" height="520"></canvas><div class="fancy-label">「${heritage.name}」· ${province.name}</div>`;
  document.body.appendChild(overlay);

  const rCanvas = document.getElementById('fancyRevealCanvas');
  const rCtx = rCanvas.getContext('2d');
  const img = new Image();
  img.onload = () => { rCtx.drawImage(img, 0, 0); };
  img.src = fancyDataUrl;

  setTimeout(() => {
    overlay.remove();
    saveCalendarEntry(province, heritage, fancyDataUrl);
  }, 2000);
}

function saveCalendarEntry(province, heritage, artDataUrl) {
  gameState.calendar[province.month] = {
    provinceId: province.id, provinceName: province.name,
    heritageId: heritage.id, heritageName: heritage.name,
    heritageEmoji: heritage.emoji, artDataUrl
  };
  gameState.completedMapProvinces.add(province.id);
  showToast(`「${heritage.name}」已收入${province.month}月！`);
  document.getElementById('game-step-guess').style.display = 'none';
  document.getElementById('game-step-color').style.display = 'none';
  gameState.phase = 'map'; gameState.currentProvinceId = null;
  renderGameMap();
  document.getElementById('game-step-map').scrollIntoView({ behavior: 'smooth' });
  if (gameState.completedMapProvinces.size >= 6) {
    setTimeout(() => showSelectionPage(), 500);
  }
}

    html += `
      <div class="selection-card ${selected ? 'selected' : ''}" id="sel-card-${p.id}" onclick="toggleCardProvince('${p.id}')">
        <div class="card-badge">✓</div>
        <div class="card-emoji">${p.heritage.emoji}</div>
        <div class="card-name">${p.heritage.name}</div>
        <div class="card-province">${p.name}</div>
      </div>`;
  });
  grid.innerHTML = html;
  updateSelectionButton();
  document.getElementById('game-step-selection').scrollIntoView({ behavior: 'smooth' });
}

function toggleCardProvince(provinceId) {
  const card = document.getElementById('sel-card-' + provinceId);
  if (gameState.selectedCardProvinces.has(provinceId)) {
    gameState.selectedCardProvinces.delete(provinceId);
    card.classList.remove('selected');
  } else {
    if (gameState.selectedCardProvinces.size >= 6) { showToast('已选满 6 个省份！'); return; }
    gameState.selectedCardProvinces.add(provinceId);
    card.classList.add('selected');
  }
  updateSelectionButton();
}

function updateSelectionButton() {
  const btn = document.getElementById('btn-finish-selection');
  const count = gameState.selectedCardProvinces.size;
  btn.textContent = count >= 6 ? '✨ 生成日历' : `✨ 生成日历（还需选 ${6 - count} 个）`;
  btn.disabled = count < 6;
}

function finishSelection() {
  if (gameState.selectedCardProvinces.size < 6) return;
  const cardMonths = [2, 4, 6, 8, 10, 12];
  let monthIdx = 0;
  gameState.selectedCardProvinces.forEach(pid => {
    const province = ALL_PROVINCES[pid];
    const heritage = province.heritage;
    const artUrl = generateCardArt(heritage);
    const month = cardMonths[monthIdx++];
    gameState.calendar[month] = {
      provinceId: province.id, provinceName: province.name,
      heritageId: heritage.id, heritageName: heritage.name,
      heritageEmoji: heritage.emoji, artDataUrl: artUrl
    };
  });
  document.getElementById('game-step-selection').style.display = 'none';
  showCalendar();
}

function generateCardArt(heritage) {
  const canvas = document.createElement('canvas');
  canvas.width = 360; canvas.height = 360;
  const ctx = canvas.getContext('2d');
  const cx = 180, cy = 180, r = 100;
  const regions = getRegionDefs(heritage.lineArt, cx, cy, r);

  ctx.fillStyle = '#faf6ee';
  ctx.fillRect(0, 0, 360, 360);

  regions.forEach((region, idx) => {
    ctx.fillStyle = heritage.palette[idx % heritage.palette.length];
    ctx.strokeStyle = '#4a3a2a';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    region.pts.forEach((pt, i) => {
      if (i === 0) ctx.moveTo(pt[0], pt[1]);
      else ctx.lineTo(pt[0], pt[1]);
    });
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });

  ctx.fillStyle = '#3d3226';
  ctx.font = '18px "ZCOOL XiaoWei", "Ma Shan Zheng", serif';
  ctx.textAlign = 'center';
  ctx.fillText(heritage.name, cx, 340);
  ctx.font = '30px serif';
  ctx.fillText(heritage.emoji, cx, cy + 118);

  return canvas.toDataURL('image/png');
}

// ==================== CALENDAR WITH 2026 MONTHLY LAYOUT ====================
function get2026Calendar(month) {
  // month: 1-12
  const daysInMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  // 2026-01-01 = Thursday. Day-of-week: 0=Mon, 1=Tue, ... 6=Sun
  const firstDayOffsets = [3, 6, 6, 2, 4, 0, 2, 5, 1, 3, 6, 1]; // Mon-based offset for 1st of each month
  return {
    days: daysInMonth[month - 1],
    firstDay: firstDayOffsets[month - 1] // 0=Monday
  };
}

function renderCalendarGrid(month) {
  const cal = get2026Calendar(month);
  const entry = gameState.calendar[month];
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const headers = ['一','二','三','四','五','六','日'];

  let html = `<div class="calendar-card">`;

  // Left: art image
  html += `<div class="card-left">`;
  html += `<div class="art-img">`;
  if (entry) {
    html += `<img src="${entry.artDataUrl}" alt="${entry.heritageName}">`;
  } else {
    html += `<div class="art-placeholder">🏮</div>`;
  }
  html += `</div>`;
  html += `<div class="heritage-label">${entry ? entry.heritageName : '待探索'}</div>`;
  html += `<div class="province-label">${entry ? entry.provinceName : ''}</div>`;
  html += `</div>`;

  // Right: calendar
  html += `<div class="card-right">`;
  html += `<div class="month-title">2026 年 ${monthNames[month - 1]}</div>`;
  html += `<div class="calendar-grid">`;

  // Headers
  headers.forEach((h, i) => {
    html += `<div class="day-header ${i >= 5 ? 'weekend' : ''}">${h}</div>`;
  });

  // Empty cells before first day
  for (let i = 0; i < cal.firstDay; i++) {
    html += `<div class="day-cell empty"></div>`;
  }

  // Day cells
  for (let d = 1; d <= cal.days; d++) {
    const dow = (cal.firstDay + d - 1) % 7;
    const isWeekend = dow >= 5;
    const isHighlight = entry && d === month; // Highlight the month number = date
    html += `<div class="day-cell ${isWeekend ? 'weekend' : ''} ${isHighlight ? 'highlight' : ''}">${d}</div>`;
  }

  html += `</div></div></div>`;
  return html;
}

function showCalendar() {
  gameState.phase = 'calendar';
  document.getElementById('game-step-calendar').style.display = 'block';
  const filled = Object.keys(gameState.calendar).length;
  document.getElementById('calendar-status').textContent = `已收集 ${filled}/12 个月 · ${filled >= 12 ? '日历已完整！🎉' : '继续完善吧~'}`;
  currentCarousel = 0;
  renderCarousel();
  document.getElementById('game-step-calendar').scrollIntoView({ behavior: 'smooth' });
}

function renderCarousel() {
  const container = document.getElementById('carousel-container');
  let slides = '';
  let dots = '';
  for (let i = 1; i <= 12; i++) {
    slides += `<div class="carousel-slide">${renderCalendarGrid(i)}</div>`;
    dots += `<div class="carousel-dot ${i - 1 === currentCarousel ? 'active' : ''}" onclick="carouselGoTo(${i - 1})"></div>`;
  }
  container.innerHTML = `<div class="carousel-track" style="transform:translateX(-${currentCarousel * 100}%);">${slides}</div>`;
  document.getElementById('carousel-dots').innerHTML = dots;
}

function carouselPrev() { currentCarousel = (currentCarousel - 1 + 12) % 12; renderCarousel(); }
function carouselNext() { currentCarousel = (currentCarousel + 1) % 12; renderCarousel(); }
function carouselGoTo(idx) { currentCarousel = idx; renderCarousel(); }

function exportCalendar() {
  const filled = Object.keys(gameState.calendar).length;
  if (filled === 0) { showToast('请先探索至少一个省份的非遗~'); return; }
  window.print();
}

function resetGame() {
  gameState = {
    phase: 'map', currentProvinceId: null, guessAttempts: 0,
    completedMapProvinces: new Set(), selectedCardProvinces: new Set(),
    calendar: {}, regionColors: {}
  };
  currentCarousel = 0;
  ['game-step-guess','game-step-color','game-step-selection','game-step-calendar'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
  renderGameMap();
  document.getElementById('game-step-map').scrollIntoView({ behavior: 'smooth' });
  showToast('已重置，重新开始探索吧~');
}

// ==================== KNOWLEDGE GRAPH (bezier curves + all provinces) ====================
function renderKnowledgeGraph() {
  const container = document.getElementById('kg-container');
  const allProvinces = Object.values(ALL_PROVINCES);
  const mapProvinces = allProvinces.filter(p => p.isMap);
  const cardProvinces = allProvinces.filter(p => !p.isMap);

  const w = 1000, h = 600;

  // Position map provinces using their cx,cy
  // Position card provinces in a grid
  const cardPositions = {};
  const cols = 5;
  cardProvinces.forEach((p, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    cardPositions[p.id] = {
      cx: 100 + col * 180,
      cy: 420 + row * 70
    };
  });

  let svg = `<svg class="kg-svg" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;

  // Draw bezier connections between heritages
  const allHeritageNodes = [];
  allProvinces.forEach(p => {
    allHeritageNodes.push({ ...p.heritage, provinceId: p.id, provinceName: p.name, isMap: p.isMap, mapCx: p.cx, mapCy: p.cy });
  });

  allHeritageNodes.forEach(h1 => {
    h1.connections.forEach(connId => {
      const h2 = allHeritageNodes.find(h => h.id === connId);
      if (h2) {
        const x1 = h1.isMap ? h1.mapCx : (cardPositions[h1.provinceId] ? cardPositions[h1.provinceId].cx : 400);
        const y1 = h1.isMap ? h1.mapCy : (cardPositions[h1.provinceId] ? cardPositions[h1.provinceId].cy : 400);
        const x2 = h2.isMap ? h2.mapCx : (cardPositions[h2.provinceId] ? cardPositions[h2.provinceId].cx : 400);
        const y2 = h2.isMap ? h2.mapCy : (cardPositions[h2.provinceId] ? cardPositions[h2.provinceId].cy : 400);

        const midX = (x1 + x2) / 2;
        const midY = (y1 + y2) / 2 + (h1.provinceId !== h2.provinceId ? -40 : 0);
        svg += `<path d="M${x1},${y1} Q${midX},${midY} ${x2},${y2}" class="kg-edge ${h1.provinceId !== h2.provinceId ? 'strong' : ''}"/>`;
      }
    });
  });

  // Draw map province nodes
  mapProvinces.forEach(p => {
    svg += `<g class="kg-node" onclick="showProvinceKG('${p.id}')"><rect x="${p.cx - 32}" y="${p.cy - 16}" width="64" height="32" rx="16" class="kg-node-province"/><text x="${p.cx}" y="${p.cy + 5}" class="kg-label" style="font-size:13px;">${p.name}</text></g>`;
    svg += `<g class="kg-node" onclick="showHeritageDetail('${p.id}')"><rect x="${p.cx + 42}" y="${p.cy + 22}" width="80" height="24" rx="12" class="kg-node-heritage"/><text x="${p.cx + 82}" y="${p.cy + 38}" class="kg-label" style="font-size:11px;">${p.heritage.emoji} ${p.heritage.name}</text></g>`;
    // Bezier from province to heritage
    svg += `<path d="M${p.cx},${p.cy + 16} Q${p.cx + 20},${p.cy + 30} ${p.cx + 42},${p.cy + 34}" class="kg-edge"/>`;
  });

  // Draw card province nodes
  cardProvinces.forEach(p => {
    const pos = cardPositions[p.id];
    if (!pos) return;
    svg += `<g class="kg-node" onclick="showProvinceKG('${p.id}')"><rect x="${pos.cx - 28}" y="${pos.cy - 12}" width="56" height="24" rx="12" class="kg-node-province"/><text x="${pos.cx}" y="${pos.cy + 4}" class="kg-label" style="font-size:10px;">${p.name}</text></g>`;
    svg += `<g class="kg-node" onclick="showHeritageDetail('${p.id}')"><rect x="${pos.cx + 36}" y="${pos.cy - 12}" width="76" height="24" rx="12" class="kg-node-heritage"/><text x="${pos.cx + 74}" y="${pos.cy + 4}" class="kg-label" style="font-size:10px;">${p.heritage.emoji} ${p.heritage.name}</text></g>`;
    svg += `<path d="M${pos.cx},${pos.cy + 12} Q${pos.cx + 18},${pos.cy + 6} ${pos.cx + 36},${pos.cy}" class="kg-edge"/>`;
  });

  svg += `</svg>`;
  container.innerHTML = svg;
}

function showProvinceKG(provinceId) {
  const province = ALL_PROVINCES[provinceId];
  const card = document.getElementById('kg-detail-card');
  const content = document.getElementById('kg-detail-content');
  const h = province.heritage;
  let html = `<h3 style="font-family:'ZCOOL XiaoWei',serif;font-size:20px;margin-bottom:12px;">${province.name} · 非遗一览</h3>`;
  html += `<div class="heritage-card" onclick="showHeritageDetail('${provinceId}')"><span class="province-tag">${province.name}</span><h3>${h.emoji} ${h.name}</h3><p class="heritage-desc">${h.desc}</p><span style="font-size:12px;color:var(--accent-green-dark);">关联非遗：${h.connections.length > 0 ? h.connections.map(c => extraHeritageRef[c] ? extraHeritageRef[c].name : c).join('、') : '暂无'}</span></div>`;
  card.style.display = 'block';
  content.innerHTML = html;
  card.scrollIntoView({ behavior: 'smooth' });
}

function showHeritageDetail(provinceId) {
  const province = ALL_PROVINCES[provinceId];
  const heritage = province.heritage;
  const modal = document.getElementById('heritage-modal');
  const content = document.getElementById('heritage-modal-content');
  let connHtml = '';
  if (heritage.connections.length > 0) {
    connHtml = '<div class="modal-connections"><strong>关联非遗：</strong>';
    heritage.connections.forEach(connId => {
      const ref = extraHeritageRef[connId] || { name: connId, emoji: '' };
      let connProvince = ''; Object.values(ALL_PROVINCES).forEach(p => { if (p.heritage.id === connId) connProvince = p.name; });
      connHtml += `<span style="background:var(--bg-paper);padding:2px 8px;border-radius:10px;margin:0 3px;display:inline-block;">${ref.emoji} ${ref.name}${connProvince ? '（' + connProvince + '）' : ''}</span>`;
    });
    connHtml += '</div>';
  }
  content.innerHTML = `<button class="modal-close" onclick="closeModal()">✕</button><h2>${heritage.emoji} ${heritage.name}</h2><p class="modal-province">${province.name}</p><div class="modal-image"><span style="font-size:80px;">${heritage.emoji}</span></div><p class="modal-desc">${heritage.desc}</p><p style="font-size:12px;color:var(--text-sub);">图像描述：${heritage.imageDesc}</p>${connHtml}<div class="btn-row" style="margin-top:16px;"><button class="btn btn-outline btn-sm" onclick="closeModal()">关闭</button></div>`;
  modal.classList.add('show');
}
function closeModal() { document.getElementById('heritage-modal').classList.remove('show'); }
document.getElementById('heritage-modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

// ==================== UTILS ====================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg; toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 2000);
}

document.addEventListener('DOMContentLoaded', () => { renderGameMap(); });
