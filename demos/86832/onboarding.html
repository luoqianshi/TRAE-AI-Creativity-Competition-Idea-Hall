<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>裁判用表计算器 - 引导页</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes blob {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-blob {
      animation: blob 7s infinite;
    }
    
    .animation-delay-2000 {
      animation-delay: 2s;
    }
    
    .animation-delay-4000 {
      animation-delay: 4s;
    }
    
    .animate-fadeIn {
      animation: fadeIn 0.6s ease-out forwards;
    }
    
    .animate-slideInUp {
      animation: slideInUp 0.6s ease-out forwards;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen">
  <div class="fixed inset-0 bg-gradient-to-br from-blue-600 via-indigo-600 to-purple-700 flex items-center justify-center overflow-auto">
    <div class="absolute inset-0 overflow-hidden">
      <div class="absolute top-0 left-1/4 w-96 h-96 bg-white/10 rounded-full blur-3xl animate-blob"></div>
      <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-white/10 rounded-full blur-3xl animate-blob animation-delay-2000"></div>
      <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-white/5 rounded-full blur-3xl animate-blob animation-delay-4000"></div>
    </div>

    <div class="relative z-10 w-full max-w-2xl mx-4 my-8">
      <div class="bg-white/10 backdrop-blur-md rounded-3xl p-6 md:p-10 border border-white/20 shadow-2xl">
        <div class="text-center">
          <div class="inline-flex items-center justify-center w-20 h-20 bg-white/20 rounded-2xl mb-6 animate-fadeIn">
            <i class="fa fa-calculator text-5xl text-white"></i>
          </div>
          
          <h1 class="text-3xl md:text-4xl font-bold text-white mb-4 animate-slideInUp">
            欢迎使用裁判用表计算器
          </h1>
          
          <p class="text-white/80 text-lg mb-8 animate-slideInUp" style="animation-delay: 0.1s">
            为体育赛事组织者提供便捷的裁判用表计算工具
          </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <div class="bg-white/10 rounded-xl p-6 text-center animate-slideInUp" style="animation-delay: 0.2s">
            <div class="w-12 h-12 bg-blue-400/30 rounded-xl flex items-center justify-center mx-auto mb-3">
              <i class="fa fa-tachometer text-blue-300 text-2xl"></i>
            </div>
            <h3 class="text-white font-semibold mb-2">速度赛计算</h3>
            <p class="text-white/60 text-sm">快速计算速度赛项目所需裁判用表数量</p>
          </div>
          
          <div class="bg-white/10 rounded-xl p-6 text-center animate-slideInUp" style="animation-delay: 0.3s">
            <div class="w-12 h-12 bg-purple-400/30 rounded-xl flex items-center justify-center mx-auto mb-3">
              <i class="fa fa-star text-purple-300 text-2xl"></i>
            </div>
            <h3 class="text-white font-semibold mb-2">花样赛计算</h3>
            <p class="text-white/60 text-sm">支持国内花样赛多种类型的用表统计</p>
          </div>
          
          <div class="bg-white/10 rounded-xl p-6 text-center animate-slideInUp" style="animation-delay: 0.4s">
            <div class="w-12 h-12 bg-orange-400/30 rounded-xl flex items-center justify-center mx-auto mb-3">
              <i class="fa fa-list-alt text-orange-300 text-2xl"></i>
            </div>
            <h3 class="text-white font-semibold mb-2">规定赛计算</h3>
            <p class="text-white/60 text-sm">精准计算规定赛项目的裁判用表</p>
          </div>
        </div>

        <div class="bg-white/5 rounded-xl p-6 mb-8 animate-slideInUp" style="animation-delay: 0.5s">
          <h3 class="text-white font-semibold mb-4 flex items-center">
            <i class="fa fa-info-circle text-blue-300 mr-2"></i>使用说明
          </h3>
          <ul class="space-y-3">
            <li class="flex items-start text-white/70">
              <span class="w-6 h-6 bg-white/20 rounded-full flex items-center justify-center text-xs font-bold mr-3 flex-shrink-0">1</span>
              <span>在左侧面板添加赛事项目或导入Excel文件</span>
            </li>
            <li class="flex items-start text-white/70">
              <span class="w-6 h-6 bg-white/20 rounded-full flex items-center justify-center text-xs font-bold mr-3 flex-shrink-0">2</span>
              <span>点击"开始计算"按钮获取用表统计结果</span>
            </li>
            <li class="flex items-start text-white/70">
              <span class="w-6 h-6 bg-white/20 rounded-full flex items-center justify-center text-xs font-bold mr-3 flex-shrink-0">3</span>
              <span>查看汇总卡片和图表，导出完整报表</span>
            </li>
          </ul>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 animate-slideInUp" style="animation-delay: 0.6s">
          <button 
            onclick="skipOnboarding()"
            class="flex-1 px-6 py-3 bg-white/10 text-white rounded-xl font-medium hover:bg-white/20 transition-all flex items-center justify-center"
          >
            <i class="fa fa-arrow-right mr-2"></i>跳过引导
          </button>
          <button 
            onclick="startUsing()"
            class="flex-1 px-6 py-3 bg-white text-indigo-600 rounded-xl font-bold hover:bg-white/90 transition-all flex items-center justify-center"
          >
            <i class="fa fa-calculator mr-2"></i>开始使用
          </button>
        </div>

        <p class="text-center text-white/40 text-sm mt-6 animate-fadeIn" style="animation-delay: 0.7s">
          下次访问将自动跳过此引导页
        </p>
      </div>
    </div>
  </div>

  <script>
    function startUsing() {
      localStorage.setItem('referee-calculator-onboarded', 'true')
      window.location.href = 'index.html'
    }

    function skipOnboarding() {
      localStorage.setItem('referee-calculator-onboarded', 'true')
      window.location.href = 'index.html'
    }
  </script>
</body>
</html>
