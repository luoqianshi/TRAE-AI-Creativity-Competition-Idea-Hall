function getAttendanceAlert(attendance) {
  const absences = attendance.filter(a => a === "❌").length;
  if (absences >= 2) return "本周多次缺勤，建议家访";
  return null;
}

function getGoalProgress(student) {
  if (student.goals.length === 0) return { completed: 0, total: 0 };
  const completed = student.goals.reduce((sum, g) => sum + g.completed, 0);
  const total = student.goals.reduce((sum, g) => sum + g.total, 0);
  return { completed, total };
}

function getAbilityColor(value) {
  if (value >= 70) return "bg-primary";
  if (value >= 50) return "bg-accent";
  return "bg-danger";
}

function getAbilityTextColor(value) {
  if (value >= 70) return "text-primary";
  if (value >= 50) return "text-accent";
  return "text-danger";
}

        </div>
      </div>

      <div className="bg-white border border-card-border rounded-xl p-4">
        <h3 className="font-medium text-gray-900 mb-3 text-sm">📋 今日出勤</h3>
        <div className="flex justify-between">
          {students.map(student => (
            <div key={student.name} className="flex flex-col items-center gap-1">
              <span className="text-lg">{student.attendance[4]}</span>
              <span className="text-xs text-gray-500">{student.name.slice(0, 2)}</span>
            </div>
          ))}
        </div>
        <p className="text-xs text-danger mt-3 bg-red-50 rounded-lg px-3 py-2">⚠️ 马海阿牛 本周多次缺勤</p>
      </div>

      <div className="flex flex-col gap-3">
        {students.map(student => {
          const goalProgress = getGoalProgress(student);
          return (
            <button key={student.name} onClick={() => setSelectedStudent(student)}
              className="bg-white border border-card-border rounded-xl p-4 text-left hover:bg-gray-50 transition-colors">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <span className="text-2xl">{student.emoji}</span>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-medium text-gray-900">{student.name}</span>
                      {student.alert && (
                        <span className="text-xs bg-red-50 text-danger px-2 py-0.5 rounded-full">需关注</span>
                      )}
                    </div>
                    <div className="flex gap-3 mt-1 text-xs text-gray-500">
                      <span>数学 {student.math}分</span>
                      <span>语文 {student.chinese}分</span>
                      {goalProgress.total > 0 && <span className="text-primary">目标 {goalProgress.completed}/{goalProgress.total}</span>}
                    </div>
                  </div>
                </div>
                <span className="text-gray-300">›</span>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ====== 成长 ====== */
function Growth() {
  const [subTab, setSubTab] = useState("overview");
  const [showNewReflection, setShowNewReflection] = useState(false);
  const [showToast, setShowToast] = useState(false);

  const showExportToast = () => { setShowToast(true); setTimeout(() => setShowToast(false), 2000); };

  if (showNewReflection) {
    return (
      <div className="flex flex-col gap-4">
        {showToast && <Toast msg="功能开发中" />}
        <div className="flex items-center gap-3">
          <button onClick={() => setShowNewReflection(false)} className="text-primary text-sm font-medium">← 返回</button>
          <h2 className="text-lg font-bold text-gray-900">写反思</h2>
        </div>
        <textarea placeholder="记录今天的收获与思考..." rows={10}
          className="w-full bg-white border border-card-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 resize-none" />
        <button onClick={() => { showExportToast(); setTimeout(() => setShowNewReflection(false), 1500); }}
          className="bg-primary text-white rounded-xl py-3 text-sm font-medium hover:bg-emerald-800 transition-colors">
          保存反思
        </button>
      </div>
    );
  }

  return (
    <div className="flex flex-col gap-4">
      {showToast && <Toast msg="档案导出功能开发中" />}
      <h1 className="text-xl font-bold text-gray-900">我的成长</h1>

      <div className="flex border-b border-card-border overflow-x-auto scrollbar-hide">
        {[
          { key: "overview", label: "总览" },
          { key: "reflection", label: "反思" },
          { key: "ability", label: "能力" },
          { key: "training", label: "培训" },
          { key: "profile", label: "档案" },
        ].map(tab => (
          <button key={tab.key} onClick={() => setSubTab(tab.key)}
            className={`px-3 py-2 text-xs font-medium transition-colors relative whitespace-nowrap ${
              subTab === tab.key ? "text-primary" : "text-gray-400"
            }`}>
            {tab.label}
            {subTab === tab.key && <span className="absolute bottom-0 left-0 right-0 h-0.5 bg-primary" />}
          </button>
        ))}
      </div>

      {subTab === "overview" && (
        <>
          <div className="grid grid-cols-2 gap-3">
            {growthStats.map(stat => (
              <div key={stat.label} className="bg-white border border-card-border rounded-xl p-4 text-center">
                <span className="text-xl">{stat.icon}</span>
                <p className="text-lg font-bold text-gray-900 mt-1">{stat.value}</p>
                <p className="text-xs text-gray-400">{stat.label}</p>
              </div>
            ))}
          </div>
          <div className="flex gap-3">
            <button onClick={() => setShowNewReflection(true)}
              className="flex-1 bg-white border border-card-border rounded-xl py-3 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors flex items-center justify-center gap-2">
              ✍️ 写反思
            </button>
            <button onClick={showExportToast}
              className="flex-1 bg-white border border-card-border rounded-xl py-3 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors flex items-center justify-center gap-2">
              😊 记心情
            </button>
          </div>
        </>
      )}

      {subTab === "reflection" && (
        <>
          <div className="flex flex-col gap-3">
            {reflections.map(r => (
              <div key={r.date} className="bg-white border border-card-border rounded-xl p-4">
                <div className="flex items-center gap-2 mb-2">
                  <span className="text-lg">{r.emoji}</span>
                  <span className="text-xs text-gray-400">{r.date}</span>
                  <span className="bg-emerald-50 text-primary text-xs px-2 py-0.5 rounded-full">{r.tag}</span>
                </div>
                <p className="text-sm text-gray-700">{r.content}</p>
              </div>
            ))}
          </div>
          <button onClick={() => setShowNewReflection(true)}
            className="w-full bg-white border border-dashed border-card-border rounded-xl py-3 text-sm text-gray-500 hover:border-primary hover:text-primary transition-colors">
            + 写新反思
          </button>
        </>
      )}

      {subTab === "ability" && (
        <div className="bg-white border border-card-border rounded-xl p-4">
          <h3 className="font-medium text-gray-900 mb-4">能力评估</h3>
          <div className="relative w-40 h-40 mx-auto mb-6">
            <svg viewBox="0 0 100 100" className="w-full h-full">
              {[1, 0.75, 0.5, 0.25].map((scale, idx) => (
                <polygon key={idx}
                  points={[0,-50,43,-25,43,25,0,50,-43,25,-43,-25].map((val,i) => {
                    const angle = (i*60 - 90) * Math.PI / 180;
                    return `${50+val*scale*Math.cos(angle)} ${50+val*scale*Math.sin(angle)}`;
                  }).join(" ")}
                  fill="none" stroke="#E5E1DA" strokeWidth="1" />
              ))}
              {[0,1,2,3,4,5].map(i => {
                const angle = (i*60 - 90) * Math.PI / 180;
                return <line key={i} x1="50" y1="50" x2={50+50*Math.cos(angle)} y2={50+50*Math.sin(angle)} stroke="#E5E1DA" strokeWidth="1" />;
              })}
              <polygon
                points={abilities.map((a,i) => {
                  const angle = (i*60 - 90) * Math.PI / 180;
                  const v = a.value / 100;
                  return `${50+50*v*Math.cos(angle)} ${50+50*v*Math.sin(angle)}`;
                }).join(" ")}
                fill="rgba(43,110,90,0.2)" stroke="#2B6E5A" strokeWidth="2" />
            </svg>
          </div>
          <div className="flex flex-col gap-3">
            {abilities.map(a => (
              <div key={a.name}>
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-gray-600">{a.name}</span>
                  <span className={getAbilityTextColor(a.value)}>{a.value}分</span>
                </div>
                <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
                  <div className={`h-full rounded-full ${getAbilityColor(a.value)}`} style={{ width: `${a.value}%` }} />
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {subTab === "training" && (
        <div className="flex flex-col gap-4">
          <div>
            <h3 className="text-sm font-medium text-gray-900 mb-2">推荐学习</h3>
            <div className="flex flex-col gap-2">
              {trainings.recommended.map((t, idx) => (
                <div key={idx} className="bg-white border border-card-border rounded-xl p-4">
                  <div className="flex items-center justify-between">
                    <h4 className="text-sm font-medium text-gray-900">{t.title}</h4>
                    <span className="bg-primary text-white text-xs px-2 py-0.5 rounded-full">{t.tag}</span>
                  </div>
                  <p className="text-xs text-gray-400 mt-1">{t.duration}</p>
                </div>
              ))}
            </div>
          </div>
          <div>
            <h3 className="text-sm font-medium text-gray-900 mb-2">最近培训</h3>
            <div className="flex flex-col gap-2">
              {trainings.recent.map((t, idx) => (
                <div key={idx} className="bg-white border border-card-border rounded-xl p-4">
                  <div className="flex items-center justify-between">
                    <h4 className="text-sm font-medium text-gray-900">{t.title}</h4>
                    <span className={`text-xs px-2 py-0.5 rounded-full ${
                      t.status === "已学" ? "bg-emerald-50 text-primary" : "bg-gray-100 text-gray-500"
                    }`}>{t.status}</span>
                  </div>
                  <p className="text-xs text-gray-400 mt-1">{t.duration}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {subTab === "profile" && (
        <div className="flex flex-col gap-4">
          <div className="bg-white border border-card-border rounded-xl p-4 flex items-center gap-4">
            <div className="w-14 h-14 rounded-full bg-emerald-100 flex items-center justify-center text-2xl">👩‍🏫</div>
            <div>
              <p className="font-bold text-gray-900">张支教</p>
              <p className="text-xs text-gray-400">第五期 · 凉山彝族自治州</p>
              <p className="text-xs text-gray-400">三年级语文教师</p>
            </div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            {growthStats.map(stat => (
              <div key={stat.label} className="bg-white border border-card-border rounded-xl p-4 text-center">
                <span className="text-xl">{stat.icon}</span>
                <p className="text-lg font-bold text-gray-900 mt-1">{stat.value}</p>
                <p className="text-xs text-gray-400">{stat.label}</p>
              </div>
            ))}
          </div>
          <button onClick={showExportToast}
            className="w-full bg-white border border-card-border rounded-xl py-3 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
            📤 导出成长档案
          </button>
        </div>
      )}
    </div>
  );
}

/* ====== 主应用 ====== */
function App() {
  const [activeTab, setActiveTab] = useState("ai");

  return (
    <div className="min-h-screen bg-bg-base">
      <div className="max-w-[430px] mx-auto min-h-screen bg-bg-base relative shadow-xl">
        <div className="flex flex-col min-h-screen pb-16">
          <Header />
          <main className="flex-1 px-4 pt-4">
            {activeTab === "ai" && <AIAssistant />}
            {activeTab === "knowledge" && <KnowledgeBase />}
            {activeTab === "community" && <Community />}
            {activeTab === "student" && <StudentList />}
            {activeTab === "growth" && <Growth />}
          </main>
          <BottomTabs activeTab={activeTab} onTabChange={setActiveTab} />
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
