    <script>
        var VIRTUAL_WIDTH = 900;
        var VIRTUAL_HEIGHT = 550;
        var TOTAL_TIME = 168;
        var INTERVENTION_POINTS_MAX = 10;
        var RENDER_INTERVAL = 50;
        var GRID_SIZE = 100;

        function clone(obj) {
            if (obj === null || typeof obj !== 'object') return obj;
            if (obj instanceof Array) return obj.slice();
            var copy = {};
            for (var key in obj) {
                if (obj.hasOwnProperty(key)) {
                    copy[key] = obj[key];
                }
            }
            return copy;
        }

        function Grid(width, height, cellSize) {
            this.width = width;
            this.height = height;
            this.cellSize = cellSize;
            this.cols = Math.ceil(width / cellSize);
            this.rows = Math.ceil(height / cellSize);
            this.cells = [];
            this.clear();
        }

        Grid.prototype.clear = function() {
            this.cells = new Array(this.cols * this.rows);
            for (var i = 0; i < this.cells.length; i++) {
                this.cells[i] = [];
            }
        };

        Grid.prototype.getCell = function(x, y) {
            var col = Math.min(Math.max(0, Math.floor(x / this.cellSize)), this.cols - 1);
            var row = Math.min(Math.max(0, Math.floor(y / this.cellSize)), this.rows - 1);
            return this.cells[row * this.cols + col];
        };

        Grid.prototype.insert = function(item) {
            this.getCell(item.x, item.y).push(item);
        };

        Grid.prototype.query = function(x, y, radius) {
            var results = [];
            var startCol = Math.max(0, Math.floor((x - radius) / this.cellSize));
            var endCol = Math.min(this.cols - 1, Math.floor((x + radius) / this.cellSize));
            var startRow = Math.max(0, Math.floor((y - radius) / this.cellSize));
            var endRow = Math.min(this.rows - 1, Math.floor((y + radius) / this.cellSize));

            for (var row = startRow; row <= endRow; row++) {
                for (var col = startCol; col <= endCol; col++) {
                    var cell = this.cells[row * this.cols + col];
                    for (var i = 0; i < cell.length; i++) {
                        var dx = cell[i].x - x;
                        var dy = cell[i].y - y;
                        if (dx * dx + dy * dy <= radius * radius) {
                            results.push(cell[i]);
                        }
                    }
                }
            }
            return results;
        };

        var STATUS_COLORS = {
            normal: '#ffffff',
            alerted: '#ffd700',

        function Game() {
            this.worldTime = 0;
            this.currentPhase = 1;
            this.points = 5;
            this.selectedTarget = null;
            this.selectedOption = null;
            this.characters = [];
            this.charactersById = {};
            this.events = [];
            this.triggeredEvents = {};
            this.canvas = document.getElementById('sandboxCanvas');
            this.ctx = this.canvas.getContext('2d');
            this.scale = 1;
            this.offsetX = 0;
            this.offsetY = 0;
            this.tooltip = null;
            this.hoveredChar = null;
            this.effects = [];
            this.particles = [];
            this.animationFrameId = null;
            this.lastRenderTime = 0;
            this.charGrid = new Grid(VIRTUAL_WIDTH, VIRTUAL_HEIGHT, GRID_SIZE);
            this.offscreenCanvas = document.createElement('canvas');
            this.offscreenCanvas.width = VIRTUAL_WIDTH;
            this.offscreenCanvas.height = VIRTUAL_HEIGHT;
            this.offCtx = this.offscreenCanvas.getContext('2d');
            this.staticBgDirty = true;
            this.perfStats = { renderTime: 0, updateTime: 0, frames: 0 };
            this.lastPerfTime = performance.now();
            this.factionCounts = { wu: 0, yao: 0, zhongli: 0, ren: 0 };
        }

        Game.prototype.init = function() {
            this.resetGame();
            this.resizeCanvas();
            this.initParticles();
            window.addEventListener('resize', this.resizeCanvas.bind(this));
            this.canvas.addEventListener('mousemove', this.handleMouseMove.bind(this));
            this.canvas.addEventListener('click', this.handleClick.bind(this));
            setInterval(this.gameTick.bind(this), 30000);
            setInterval(this.pointsTick.bind(this), 60000);
            this.startRenderLoop();
        };

        Game.prototype.initParticles = function() {
            this.particles = [];
            for (var i = 0; i < 50; i++) {
                this.particles.push({
                    x: Math.random() * VIRTUAL_WIDTH,
                    y: Math.random() * VIRTUAL_HEIGHT,
                    size: Math.random() * 1.5 + 0.3,
                    speed: Math.random() * 0.15 + 0.03,
                    opacity: Math.random() * 0.6 + 0.2,
                });
            }
        };

        Game.prototype.startRenderLoop = function() {
            var self = this;
            function loop(timestamp) {
                if (timestamp - self.lastRenderTime >= RENDER_INTERVAL) {
                    self.updateAndRender();
                    self.lastRenderTime = timestamp;
                }
                self.animationFrameId = requestAnimationFrame(loop);
            }
            this.animationFrameId = requestAnimationFrame(loop);
        };

        Game.prototype.updateAndRender = function() {
            for (var i = 0; i < this.particles.length; i++) {
                var p = this.particles[i];
                p.y -= p.speed;
                if (p.y < 0) {
                    p.y = VIRTUAL_HEIGHT;
                    p.x = Math.random() * VIRTUAL_WIDTH;
                }
            }
            for (var i = this.effects.length - 1; i >= 0; i--) {
                var eff = this.effects[i];
                eff.progress += 0.02;
                if (eff.progress >= 1) {
                    this.effects.splice(i, 1);
                }
            }
            this.render();
        };

        Game.prototype.resetGame = function() {
            this.worldTime = 0;
            this.currentPhase = 1;
            this.points = 5;
            this.selectedTarget = null;
            this.selectedOption = null;
            this.characters = [];
            this.charactersById = {};
            for (var i = 0; i < CHARACTERS.length; i++) {
                var c = clone(CHARACTERS[i]);
                c.visible = c.phase <= this.currentPhase;
                this.characters.push(c);
                this.charactersById[c.id] = c;
            }
            this.events = [];
            this.triggeredEvents = {};
            this.effects = [];
            this.updateCharacterGrid();
            this.updateFactionCounts();
            this.staticBgDirty = true;
            this.addEvent('游戏开始', '洪荒天机沙盘启动，量劫的序幕缓缓拉开...', 'scripted');
            this.updateUI();
            this.render();
        };

        Game.prototype.updateCharacterGrid = function() {
            this.charGrid.clear();
            for (var i = 0; i < this.characters.length; i++) {
                if (this.characters[i].visible) {
                    this.charGrid.insert(this.characters[i]);
                }
            }
        };

        Game.prototype.resizeCanvas = function() {
            var rect = this.canvas.parentElement.getBoundingClientRect();
            this.canvas.width = rect.width;
            this.canvas.height = rect.height;
            var scaleX = rect.width / VIRTUAL_WIDTH;
            var scaleY = rect.height / VIRTUAL_HEIGHT;
            this.scale = Math.min(scaleX, scaleY);
            this.offsetX = (rect.width - VIRTUAL_WIDTH * this.scale) / 2;
            this.offsetY = (rect.height - VIRTUAL_HEIGHT * this.scale) / 2;
            this.render();
        };

        Game.prototype.gameTick = function() {
            this.worldTime++;
            if (this.worldTime >= TOTAL_TIME) {
                alert('量劫落幕！');
                return;
            }
            this.updatePhase();
            this.updateCharacterVisibility();
            this.checkScriptedEvents();
            this.updateUI();
        };

        Game.prototype.pointsTick = function() {
            if (this.points < INTERVENTION_POINTS_MAX) {
                this.points++;
                this.updateUI();
            }
        };

        Game.prototype.updatePhase = function() {
            var total = 0;
            for (var i = 0; i < PHASES.length; i++) {
                total += PHASES[i].time;
                if (this.worldTime < total) {
                    if (this.currentPhase !== i + 1) {
                        this.currentPhase = i + 1;
                        this.addEvent(PHASES[i].name, '进入新的阶段', 'phase');
                    }
                    return;
                }
            }
        };

        Game.prototype.updateCharacterVisibility = function() {
            var changed = false;
            for (var i = 0; i < this.characters.length; i++) {
                var prevVisible = this.characters[i].visible;
                this.characters[i].visible = this.characters[i].phase <= this.currentPhase;
                if (prevVisible !== this.characters[i].visible) changed = true;
            }
            if (changed) {
                this.updateCharacterGrid();
                this.updateFactionCounts();
            }
        };

        Game.prototype.updateFactionCounts = function() {
            this.factionCounts = { wu: 0, yao: 0, zhongli: 0, ren: 0 };
            for (var i = 0; i < this.characters.length; i++) {
                if (this.characters[i].visible) {
                    this.factionCounts[this.characters[i].faction]++;
                }
            }
        };

        Game.prototype.checkScriptedEvents = function() {
            var phaseStartTime = 0;
            for (var i = 0; i < this.currentPhase - 1; i++) {
                phaseStartTime += PHASES[i].time;
            }
            var phaseTime = this.worldTime - phaseStartTime;

            for (var key in SCRIPTED_EVENTS) {
                var evt = SCRIPTED_EVENTS[key];
                if (evt.phase === this.currentPhase && !this.triggeredEvents[key]) {
                    if (phaseTime >= evt.timeOffset) {
                        this.triggeredEvents[key] = true;
                        this.addEvent(evt.title, evt.desc, 'scripted');
                    }
                }
            }
        };

        Game.prototype.addEvent = function(title, desc, type) {
            this.events.unshift({ title: title, desc: desc, type: type, time: this.worldTime });
            if (this.events.length > 50) this.events.pop();
            this.renderEvents();
        };

        Game.prototype.updateUI = function() {
            var phaseData = PHASES[this.currentPhase - 1];
            document.getElementById('currentPhase').textContent = phaseData.name;
            document.getElementById('worldTime').textContent = this.worldTime;
            document.getElementById('interventionPoints').textContent = this.points;
            document.getElementById('mapPhase').textContent = phaseData.name;
            document.getElementById('panelPoints').textContent = this.points;
            document.getElementById('pointsFill').style.width = (this.points / INTERVENTION_POINTS_MAX * 100) + '%';

            document.getElementById('wuCount').textContent = this.factionCounts.wu;
            document.getElementById('yaoCount').textContent = this.factionCounts.yao;

            this.renderTargets();
            this.renderOptions();
        };

        Game.prototype.renderTargets = function() {
            var container = document.getElementById('targetSelect');
            container.innerHTML = '';
            var active = this.characters.filter(function(c) { return c.visible; });
            for (var i = 0; i < active.length; i++) {
                var char = active[i];
                var btn = document.createElement('button');
                btn.className = 'target-btn' + (this.selectedTarget === char.id ? ' selected' : '');
                btn.textContent = char.name;
                btn.onclick = this.selectTarget.bind(this, char.id);
                container.appendChild(btn);
            }
        };

        Game.prototype.selectTarget = function(id) {
            this.selectedTarget = id;
            this.selectedOption = null;
            this.updateUI();
        };

        Game.prototype.renderOptions = function() {
            var container = document.getElementById('interventionOptions');
            container.innerHTML = '';
            var btn = document.getElementById('executeBtn');
            if (!this.selectedTarget) {
                btn.disabled = true;
                btn.textContent = '选择目标';
                return;
            }
            var options = INTERVENTION_OPTIONS[this.selectedTarget] || INTERVENTION_OPTIONS.default;
            for (var i = 0; i < options.length; i++) {
                var opt = options[i];
                var card = document.createElement('div');
                card.className = 'option-card' + (this.selectedOption === opt.id ? ' selected' : '');
                var typeClass = 'type-' + opt.type;
                var typeText = opt.type === 'divination' ? '透露天机' : opt.type === 'coincidence' ? '制造机缘' : '触发灵感';
                card.innerHTML = '<div class="option-header"><span class="option-title"><span class="option-type ' + typeClass + '">' + typeText + '</span>' + opt.name + '</span><span class="option-cost">' + opt.cost + '点</span></div><div class="option-desc">' + opt.desc + '</div>';
                if (opt.risk) card.innerHTML += '<div class="option-risk">风险: ' + opt.risk + '</div>';
                if (opt.reward) card.innerHTML += '<div class="option-reward">效果: ' + opt.reward + '</div>';
                card.onclick = this.selectOption.bind(this, opt.id);
                container.appendChild(card);
            }
            btn.disabled = !this.selectedOption;
            btn.textContent = this.selectedOption ? '执行干预' : '选择干预选项';
        };

        Game.prototype.selectOption = function(id) {
            this.selectedOption = id;
            this.updateUI();
        };

        Game.prototype.doExecute = function() {
            if (!this.selectedTarget || !this.selectedOption) return;
            var options = INTERVENTION_OPTIONS[this.selectedTarget] || INTERVENTION_OPTIONS.default;
            var opt = options.find(function(o) { return o.id === this.selectedOption; }.bind(this));
            if (!opt) return;
            if (this.points < opt.cost) {
                alert('天机点不足！');
                return;
            }
            this.points -= opt.cost;
            
            var success = Math.random() < (opt.risk === '极高风险' ? 0.4 : opt.risk === '高风险' ? 0.6 : opt.risk === '中风险' ? 0.8 : 0.9);
            var targetChar = this.charactersById[this.selectedTarget];
            
            if (success) {
                this.addEvent('天机干预成功', targetChar.name + '接受了你的启示：' + opt.name, 'intervention');
                this.showFeedback(true, targetChar.avatar, '干预成功！', opt.desc);
            } else {
                this.addEvent('天机干预失败', targetChar.name + '未能领悟你的启示：' + opt.name, 'intervention');
                this.showFeedback(false, targetChar.avatar, '干预失败', '天道无常，你的启示被命运之轮扭曲...');
            }
            
            this.selectedOption = null;
            this.updateUI();
        };

        Game.prototype.render = function() {
            var ctx = this.ctx;
            var startTime = performance.now();
            
            ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            
            ctx.save();
            ctx.translate(this.offsetX, this.offsetY);
            ctx.scale(this.scale, this.scale);
            
            if (this.staticBgDirty) {
                this.drawStaticBackground();
                this.staticBgDirty = false;
            }
            ctx.drawImage(this.offscreenCanvas, 0, 0);
            
            this.drawParticles(ctx);
            this.drawCharacters(ctx);
            this.drawEffects(ctx);
            
            ctx.restore();
            
            this.perfStats.renderTime += performance.now() - startTime;
            this.perfStats.frames++;
            if (performance.now() - this.lastPerfTime >= 1000) {
                var avgRender = (this.perfStats.renderTime / this.perfStats.frames).toFixed(2);
                console.log('Avg render time: ' + avgRender + 'ms, FPS: ' + this.perfStats.frames);
                this.perfStats = { renderTime: 0, updateTime: 0, frames: 0 };
                this.lastPerfTime = performance.now();
            }
        };

        Game.prototype.drawStaticBackground = function() {
            var ctx = this.offCtx;
            ctx.clearRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
            
            var grad = ctx.createLinearGradient(0, 0, 0, VIRTUAL_HEIGHT);
            grad.addColorStop(0, '#050510');
            grad.addColorStop(0.5, '#0a0a20');
            grad.addColorStop(1, '#050515');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
            
            for (var key in FACTIONS) {
                var faction = FACTIONS[key];
                ctx.fillStyle = faction.color + '22';
                ctx.strokeStyle = faction.color + '44';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(faction.territory[0][0], faction.territory[0][1]);
                for (var i = 1; i < faction.territory.length; i++) {
                    ctx.lineTo(faction.territory[i][0], faction.territory[i][1]);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
            
            for (var i = 0; i < LOCATIONS.length; i++) {
                var loc = LOCATIONS[i];
                ctx.beginPath();
                ctx.arc(loc.x, loc.y, 12, 0, Math.PI * 2);
                ctx.fillStyle = loc.color + '33';
                ctx.fill();
                ctx.strokeStyle = loc.color;
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.fillStyle = loc.color;
                ctx.font = '12px STKaiti, KaiTi, serif';
                ctx.textAlign = 'center';
                ctx.fillText(loc.name, loc.x, loc.y - 20);
            }
            
            ctx.strokeStyle = '#555555';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            
            for (var i = 0; i < LOCATION_CONNECTIONS.length; i++) {
                var conn = LOCATION_CONNECTIONS[i];
                var from = LOCATIONS.find(function(l) { return l.name === conn.from; });
                var to = LOCATIONS.find(function(l) { return l.name === conn.to; });
                if (from && to) {
                    ctx.beginPath();
                    ctx.moveTo(from.x, from.y);
                    ctx.lineTo(to.x, to.y);
                    ctx.stroke();
                }
            }
            
            ctx.setLineDash([]);
        };

        Game.prototype.drawParticles = function(ctx) {
            for (var i = 0; i < this.particles.length; i++) {
                var p = this.particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, ' + p.opacity + ')';
                ctx.fill();
            }
        };

        Game.prototype.drawCharacters = function(ctx) {
            for (var i = 0; i < this.characters.length; i++) {
                var char = this.characters[i];
                if (!char.visible) continue;
                
                var isHovered = this.hoveredChar === char.id;
                var faction = FACTIONS[char.faction];
                
                ctx.beginPath();
                ctx.arc(char.x, char.y, isHovered ? 18 : 15, 0, Math.PI * 2);
                ctx.fillStyle = faction.color + '44';
                ctx.fill();
                ctx.strokeStyle = faction.color;
                ctx.lineWidth = isHovered ? 3 : 2;
                ctx.stroke();
                
                ctx.font = isHovered ? '28px sans-serif' : '24px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(char.avatar, char.x, char.y);
                
                ctx.font = '11px Microsoft YaHei, sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(char.name, char.x, char.y + (isHovered ? 28 : 25));
            }
        };

        Game.prototype.drawEffects = function(ctx) {
            for (var i = 0; i < this.effects.length; i++) {
                var eff = this.effects[i];
                var alpha = 1 - eff.progress;
                ctx.beginPath();
                ctx.arc(eff.x, eff.y, 20 + eff.progress * 30, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 215, 0, ' + alpha + ')';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        };

        Game.prototype.handleMouseMove = function(e) {
            var rect = this.canvas.getBoundingClientRect();
            var x = (e.clientX - rect.left - this.offsetX) / this.scale;
            var y = (e.clientY - rect.top - this.offsetY) / this.scale;
            
            this.hoveredChar = null;
            var candidates = this.charGrid.query(x, y, 15);
            for (var i = 0; i < candidates.length; i++) {
                var char = candidates[i];
                if (!char.visible) continue;
                var dx = x - char.x;
                var dy = y - char.y;
                if (dx * dx + dy * dy < 225) {
                    this.hoveredChar = char.id;
                    this.showTooltip(char, e.clientX, e.clientY);
                    return;
                }
            }
            this.hideTooltip();
        };

        Game.prototype.handleClick = function(e) {
            var rect = this.canvas.getBoundingClientRect();
            var x = (e.clientX - rect.left - this.offsetX) / this.scale;
            var y = (e.clientY - rect.top - this.offsetY) / this.scale;
            
            var candidates = this.charGrid.query(x, y, 15);
            for (var i = 0; i < candidates.length; i++) {
                var char = candidates[i];
                if (!char.visible) continue;
                var dx = x - char.x;
                var dy = y - char.y;
                if (dx * dx + dy * dy < 225) {
                    this.selectTarget(char.id);
                    return;
                }
            }
        };

        Game.prototype.renderEvents = function() {
            var container = document.getElementById('eventList');
            container.innerHTML = '';
            for (var i = 0; i < this.events.length; i++) {
                var evt = this.events[i];
                var item = document.createElement('div');
                item.className = 'event-item' + (evt.type === 'intervention' ? ' event-intervention' : evt.type === 'death' ? ' event-death' : evt.type === 'phase' ? ' event-phase' : '');
                item.innerHTML = '<div class="event-title">' + evt.title + '</div><div class="event-desc">' + evt.desc + '</div><div class="event-time">时辰 ' + evt.time + '</div>';
                container.appendChild(item);
            }
        };

        Game.prototype.showTooltip = function(char, x, y) {
            this.hideTooltip();
            this.tooltip = document.createElement('div');
            this.tooltip.className = 'tooltip';
            var factionName = FACTIONS[char.faction].name;
            this.tooltip.innerHTML = '<div class="tooltip-name">' + char.name + '</div><div class="tooltip-faction">' + factionName + ' · ' + char.role + '</div><div class="tooltip-stats"><div class="stat-item"><div class="stat-label">阶段</div><div class="stat-value">' + char.phase + '</div></div><div class="stat-item"><div class="stat-label">状态</div><div class="stat-value" style="color:' + STATUS_COLORS[char.status] + '">' + char.status + '</div></div></div><div class="tooltip-desc">' + char.desc + '</div>';
            this.tooltip.style.left = (x + 15) + 'px';
            this.tooltip.style.top = (y + 15) + 'px';
            document.body.appendChild(this.tooltip);
        };

        Game.prototype.hideTooltip = function() {
            if (this.tooltip) {
                this.tooltip.remove();
                this.tooltip = null;
            }
        };

        Game.prototype.showFeedback = function(success, char, title, desc) {
            var overlay = document.createElement('div');
            overlay.className = 'feedback-overlay';
            overlay.innerHTML = '<div class="feedback-char">' + char + '</div><div class="feedback-title ' + (success ? 'feedback-success' : 'feedback-failure') + '">' + title + '</div><div class="feedback-desc">' + desc + '</div><button class="feedback-btn" onclick="this.parentElement.remove()">确定</button>';
            document.body.appendChild(overlay);
        };

        window.onload = function() {
            var loadingScreen = document.getElementById('loadingScreen');
            var loadingFill = document.getElementById('loadingFill');
            
            var progress = 0;
            var interval = setInterval(function() {
                progress += Math.random() * 15 + 5;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    setTimeout(function() {
                        loadingScreen.style.opacity = '0';
                        setTimeout(function() {
                            loadingScreen.remove();
                            window.game = new Game();
                            game.init();
                        }, 300);
                    }, 500);
                }
                loadingFill.style.width = progress + '%';
            }, 100);
        };
    </script>
</body>
</html>
