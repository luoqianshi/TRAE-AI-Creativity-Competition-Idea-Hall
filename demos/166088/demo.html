<body class="min-h-screen bg-background" data-theme="light">

<script>
/* ============================ 数据（Mock，对应原版 demo 数据） ============================ */

const MOCK_STATS = { streak: 12, totalWords: 128, masteredWords: 86, reviewToday: 7 };
const WORDS = [
  { id: "w1", russian: "здра́вствуйте", accentPattern: "а", partOfSpeech: "感叹词", translation: "您好", options: ["您好", "再见", "谢谢", "请"], examples: [{ russian: "Здра́вствуйте, рад вас ви́деть!", translation: "您好，很高兴见到您！" }] },

  { id: "w4", russian: "молоко́", accentPattern: "о", partOfSpeech: "名词", translation: "牛奶", options: ["水", "茶", "牛奶", "咖啡"], examples: [{ russian: "Я пью молоко́ у́тром.", translation: "我早上喝牛奶。" }] },
  { id: "w5", russian: "говори́ть", accentPattern: "и", partOfSpeech: "动词", translation: "说话", options: ["听", "说", "读", "写"], examples: [{ russian: "Он у́чит говори́ть по-ру́сски.", translation: "他在学习说俄语。" }] },

const WRONG = [

  { id: "wk2", type: "TRUE_FALSE", difficulty: "MEDIUM", content: "«спасибо» означает «спасение».", options: [{ key: "A", text: "正确" }, { key: "B", text: "错误" }], correctAnswer: "B", userAnswer: "A", wrongCount: 1, resolved: false, examTitle: "A2 周测", analysis: "спаси́бо 是“谢谢”，与“拯救”无关。" },
  { id: "wk3", type: "FILL_BLANK", difficulty: "HARD", content: "补充重音：мол_ко́ (牛奶)", options: [], correctAnswer: "о", userAnswer: "а", wrongCount: 3, resolved: false, examTitle: "B1 月考", analysis: "молоко́ 重音在最后一个 о 上。" },

const EXAM_QUESTIONS = {

    { q: "下列哪个词的重音在最后一个音节？", options: ["папа", "молоко́", "ма́ма", "до́ма"], answer: 1 },
    { q: "«спасибо» 对应的中文是？", options: ["不客气", "谢谢", "你好", "对不起"], answer: 1 },
  ],
  e2: [
    { q: "在餐厅点餐时，“账单”用俄语怎么说？", options: ["вода́", "счёт", "хлеб", "чай"], answer: 1 },

    { q: "商务邮件中“附件”通常怎么说？", options: ["письмо́", "вложе́ние", "офис", "встре́ча"], answer: 1 },

const S = {

  learn: { idx: 0, show: false, answered: false, selected: null, correct: 0, incorrect: 0, done: false },
  review: { idx: 0, show: false, answered: false, selected: null, correct: 0, incorrect: 0, done: false },
  chat: [{ role: "assistant", content: "你好！我是“而与”的 AI 俄语学习助教。\n\n你可以问我任何与俄语学习相关的问题，比如：\n- “привет 是什么意思？”\n- “俄语重音规则是什么？”\n- “动词变位怎么记？”\n\n我会尽力帮你解答！" }],
  chatLoading: false,
  exam: { id: null, idx: 0, picks: {}, submitted: false, score: 0 },
};

/* ============================ 工具 ============================ */
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function renderRussian(text, accent) {
  if (!accent) return esc(text);
  return text.split("").map((ch) => {
    if (accent.includes(ch) && /[аеёиоуыэюяАЕЁИОУЫЭЮЯ]/.test(ch)) return '<span class="accent-mark">' + esc(ch) + "</span>";
    return esc(ch);
  }).join("");
}
function go(screen) {
  S.screen = screen;
  if (screen === "learn") S.learn = { idx: 0, show: false, answered: false, selected: null, correct: 0, incorrect: 0, done: false };
  if (screen === "review") S.review = { idx: 0, show: false, answered: false, selected: null, correct: 0, incorrect: 0, done: false };
  if (screen === "exams") S.exam = { id: null, idx: 0, picks: {}, submitted: false, score: 0 };
  render();
}
function toggleTheme() { S.theme = S.theme === "dark" ? "light" : "dark"; document.body.setAttribute("data-theme", S.theme); render(); }
function login(email) { const acc = DEMO_ACCOUNTS.find((a) => a.email === email); S.user = { username: acc ? acc.label : email.split("@")[0], email }; go("dashboard"); }
function logout() { S.user = null; S._um = false; go("landing"); }
function nowTime() { const d = new Date(); return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0"); }

/* ============================ Navbar ============================ */
function navbar() {

    { href: "learn", icon: "brain", label: "学习" },
    { href: "review", icon: "rotate-ccw", label: "复习" },

    { href: "online-courses", icon: "video", label: "网课" },

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="hidden md:flex items-center gap-1">

        </div>
        <div class="flex items-center gap-2">
          <button onclick="toggleTheme()" class="w-8 h-8 flex items-center justify-center hover:bg-accent/10 rounded-md transition-colors" aria-label="切换主题"><i data-lucide="${S.theme === "dark" ? "sun" : "moon"}" class="w-4 h-4"></i></button>

              <i data-lucide="chevron-down" class="w-3 h-3 text-muted-foreground"></i>

          </div>
        </div>

function flashcardBlock(word, st, kind) {
  const selected = st.selected, hasAnswered = st.answered, showAnswer = st.show;
  const choiceHtml = showAnswer && word.options ? `<div class="px-8 pb-4"><p class="text-sm text-muted-foreground mb-3 text-center">选择正确的翻译（可按 1-4 键）：</p><div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${word.options.map((opt, i) => {
    const isCorrect = opt === word.translation, isSel = selected === i;
    let bg = "bg-background border-border hover:border-primary/50";
    if (hasAnswered && isSel) bg = isCorrect ? "bg-success/10 border-success text-success" : "bg-destructive/10 border-destructive text-destructive";
    else if (hasAnswered && isCorrect) bg = "bg-success/10 border-success text-success";
    return `<button onclick="${kind}Pick(${i},'${esc(opt)}')" ${hasAnswered ? "disabled" : ""} class="p-4 rounded-md border-2 text-left transition-colors ${bg} ${hasAnswered ? "cursor-default" : "cursor-pointer"}"><div class="flex items-center justify-between"><span class="font-medium">${esc(opt)}</span>${hasAnswered && isSel ? (isCorrect ? '<i data-lucide="check" class="w-5 h-5 text-success"></i>' : '<i data-lucide="x" class="w-5 h-5 text-destructive"></i>') : ""}</div></button>`;
  }).join("")}</div></div>` : "";
  const answerHtml = showAnswer ? `<div class="px-8 pb-8"><div class="text-center mb-6"><p class="text-sm text-muted-foreground mb-1">翻译</p><p class="text-3xl font-bold text-primary">${esc(word.translation)}</p></div>${word.examples && word.examples.length ? `<div class="mb-6 p-4 bg-muted/30 rounded-md"><p class="text-xs text-muted-foreground mb-3 font-medium uppercase tracking-wider">例句</p>${word.examples.map((ex) => `<div class="mb-3 last:mb-0 p-3 bg-background rounded-md"><p class="text-foreground font-medium russian-text">${renderRussian(ex.russian, word.accentPattern)}</p><p class="text-sm text-muted-foreground mt-1">${esc(ex.translation)}</p></div>`).join("")}</div>` : ""}${!hasAnswered ? `<div class="space-y-3"><p class="text-sm text-muted-foreground text-center mb-2">你对这个单词的掌握程度？（可按 1-3 键）</p><div class="grid grid-cols-3 gap-3"><button onclick="${kind}Rate(0)" class="btn-destructive p-4 h-auto flex-col gap-1"><span class="russian-text font-bold text-base">Н</span><span class="text-sm font-semibold">不认识</span></button><button onclick="${kind}Rate(3)" class="p-4 h-auto flex-col gap-1 bg-warning text-warning-foreground hover:bg-warning/90 rounded-md"><span class="russian-text font-bold text-base">С</span><span class="text-sm font-semibold">模糊</span></button><button onclick="${kind}Rate(5)" class="p-4 h-auto flex-col gap-1 bg-success text-success-foreground hover:bg-success/90 rounded-md"><span class="russian-text font-bold text-base">З</span><span class="text-sm font-semibold">认识</span></button></div></div>` : ""}</div>` : "";
  return `<div class="max-w-2xl mx-auto"><div class="card overflow-hidden" style="padding:0">
    <div class="p-8 cursor-pointer select-none" onclick="if(!${showAnswer}&&!${hasAnswered})${kind}Show()">
      <div class="flex items-center justify-between mb-6"><span class="badge badge-primary">${esc(word.partOfSpeech)}</span><button onclick="event.stopPropagation();playAudio()" class="flex items-center space-x-2 px-4 py-2 rounded-md bg-muted hover:bg-primary/10 hover:text-primary transition-colors text-muted-foreground"><i data-lucide="volume-2" class="w-5 h-5"></i><span class="text-sm font-medium">发音</span></button></div>
      <div class="text-center mb-4"><h2 class="text-5xl sm:text-6xl font-bold text-foreground russian-text leading-tight">${renderRussian(word.russian, word.accentPattern)}</h2>${word.accentPattern ? `<p class="mt-2 text-sm text-muted-foreground">重音：${esc(word.accentPattern)}</p>` : ""}</div>
      ${!showAnswer && !hasAnswered ? `<p class="text-center text-muted-foreground text-sm flex items-center justify-center space-x-2"><i data-lucide="help-circle" class="w-4 h-4"></i><span>点击卡片或按空格键查看答案</span></p>` : ""}
    </div>${choiceHtml}${answerHtml}</div></div>`;
}

function learnNext(correct) { S.learn.correct += correct ? 1 : 0; S.learn.incorrect += correct ? 0 : 1; if (S.learn.idx < WORDS.length - 1) { S.learn.idx++; S.learn.show = false; S.learn.answered = false; S.learn.selected = null; render(); } else { S.learn.done = true; render(); } }

function reviewRate(q) { if (S.review.answered) return; S.review.answered = true; setTimeout(() => reviewNext(q >= 3), 500); render(); }
function reviewNext(correct) { S.review.correct += correct ? 1 : 0; S.review.incorrect += correct ? 0 : 1; if (S.review.idx < WORDS.length - 1) { S.review.idx++; S.review.show = false; S.review.answered = false; S.review.selected = null; render(); } else { S.review.done = true; render(); } }

function sendChat(e) {
  e.preventDefault(); const inp = document.getElementById("chatInput"); const text = inp.value.trim(); if (!text || S.chatLoading) return;
  S.chat.push({ role: "user", content: text }); inp.value = ""; S.chatLoading = true; render();
  setTimeout(() => { const reply = "这是 Demo 模式的模拟回答。在完整部署（前后端）版本中，这里会调用真实 AI 接口，结合本地俄语知识库为你解答「" + text + "」。\n\n例如：приве́т 是俄语中最常用的问候语，意思是“你好 / 嗨”，重音在 е 上。"; S.chat.push({ role: "assistant", content: reply }); S.chatLoading = false; render(); }, 700);
}

    <p class="text-sm text-muted-foreground mb-1 russian-text">${esc(c.titleRu)}</p><p class="text-sm text-muted-foreground/80 mb-4 line-clamp-2">${esc(c.description)}</p>
    <div class="flex items-center justify-between text-sm text-muted-foreground mb-5"><span class="flex items-center space-x-1"><i data-lucide="book-open" class="w-4 h-4"></i><span>${c.words} 词</span></span><span class="flex items-center space-x-1"><i data-lucide="users" class="w-4 h-4"></i><span>${c.students} 人在学</span></span></div>
    <div class="flex space-x-2"><button onclick="go('learn')" class="btn-primary flex-1"><span>开始学习</span><i data-lucide="arrow-right" class="w-4 h-4"></i></button><button onclick="alert('Demo：已报名「${esc(c.title)}」')" class="btn-outline">报名</button></div></div>
  </div>`).join("");
  return `<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12"><div class="mb-8"><h1 class="text-3xl font-bold text-foreground mb-2">选择词书</h1><p class="text-muted-foreground">选择适合你水平的词书，开始学习之旅</p></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${cards}</div></div>`;
}
/* ============================ 错题本 ============================ */
const TYPE_LABEL = { SINGLE_CHOICE: "单选", MULTIPLE_CHOICE: "多选", FILL_BLANK: "填空", TRUE_FALSE: "判断", SHORT_ANSWER: "简答" };
const DIFF_LABEL = { EASY: "简单", MEDIUM: "中等", HARD: "困难" };
function fmtAnswer(v, opts) { if (!v) return "（未作答）"; const o = opts && opts.find((x) => x.key === v); return o ? v + ". " + o.text : v; }
function diffStyle(d) { return d === "EASY" ? ["rgba(22,163,74,.1)", "#16A34A"] : d === "MEDIUM" ? ["rgba(234,88,12,.1)", "#EA580C"] : ["rgba(220,38,38,.1)", "#DC2626"]; }
function screenWrong() {
  const list = WRONG.map((q) => { const ds = diffStyle(q.difficulty); return `<div class="wb-card p-4"><div class="flex items-start gap-3"><div class="flex-1 min-w-0">
    <div class="flex items-center gap-2 flex-wrap mb-2">
      <span class="inline-flex px-2 py-0.5 rounded text-[11px] font-medium wb-chip">${TYPE_LABEL[q.type] || q.type}</span>
      ${q.difficulty ? `<span class="inline-flex px-2 py-0.5 rounded text-[11px] font-medium" style="background:${ds[0]};color:${ds[1]}">${DIFF_LABEL[q.difficulty]}</span>` : ""}
      ${q.resolved ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-medium" style="background:rgba(22,163,74,.1);color:#16A34A"><i data-lucide="check" class="w-3 h-3"></i>已掌握</span>` : `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-medium" style="background:rgba(234,88,12,.1);color:#EA580C"><i data-lucide="alert-triangle" class="w-3 h-3"></i>错 ${q.wrongCount} 次</span>`}
    </div>
    <p class="text-sm wb-ink leading-relaxed mb-2 whitespace-pre-wrap">${esc(q.content)}</p>
    ${q.examTitle ? `<p class="text-xs text-[#94A3B8] mb-2">来源：${esc(q.examTitle)}</p>` : ""}
    <div class="flex items-center gap-2">
      <button onclick="retryWrong('${q.id}')" class="inline-flex items-center space-x-1 px-3 py-1.5 rounded-lg text-xs font-medium wb-primary border" style="border-color:rgba(30,58,138,.3)"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i><span>重做</span></button>
      <button onclick="removeWrong('${q.id}')" class="inline-flex items-center space-x-1 px-3 py-1.5 rounded-lg text-xs font-medium text-[#DC2626] border" style="border-color:rgba(220,38,38,.3)"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i><span>移除</span></button>
    </div></div></div>`; }).join("");
  return `<div class="min-h-screen wb-bg"><div class="max-w-5xl mx-auto px-4 sm:px-6 py-8">
    <div class="mb-6"><h1 class="text-2xl font-bold wb-ink mb-1">错题本</h1><p class="text-sm wb-muted">共 ${WRONG.length} 题 · 未掌握 ${WRONG.filter((q)=>!q.resolved).length} · 已掌握 ${WRONG.filter((q)=>q.resolved).length}</p></div>
    <div class="space-y-3">${list}</div>
    <div class="mt-8 flex justify-center"><button onclick="go('courses')" class="inline-flex items-center space-x-1 text-xs wb-muted hover:wb-primary transition-colors"><i data-lucide="chevron-left" class="w-3.5 h-3.5"></i><span>返回词书</span></button></div>
  </div></div>`;
}
function retryWrong(id) { const q = WRONG.find((x) => x.id === id); alert("Demo 重做：「" + q.content + "」\n正确答案：" + fmtAnswer(q.correctAnswer, q.options) + "\n解析：" + (q.analysis || "—")); }
function removeWrong(id) { if (!confirm("确定要从错题本中移除该题吗？")) return; const i = WRONG.findIndex((x) => x.id === id); if (i >= 0) WRONG.splice(i, 1); render(); }
/* ============================ 个人中心 ============================ */
function screenProfile() {
  const s = MOCK_STATS, rate = Math.round((s.masteredWords / s.totalWords) * 100);
  const statCards = [["Д", s.streak + "天", "连续学习"], ["С", s.totalWords, "已学单词"], ["З", s.masteredWords, "已掌握"], ["П", s.reviewToday, "今日待复习"]].map((c) => `<div class="card card-hover"><div class="text-2xl mb-2"><span class="cyrillic-mark">${c[0]}</span></div><div class="text-2xl font-bold text-foreground">${c[1]}</div><div class="text-sm text-muted-foreground mt-1">${c[2]}</div></div>`).join("");
  const weekly = [12, 8, 15, 6, 20, 10, Math.max(0, s.totalWords - 30)], max = Math.max(...weekly);
  const bars = weekly.map((v, i) => `<div class="flex flex-col items-center gap-1 flex-1"><div class="w-full flex items-end justify-center" style="height:160px"><div class="w-7 rounded-t" style="height:${(v/max)*150}px;background:hsl(var(--primary) / ${0.5 + i*0.08})"></div></div><span class="text-[10px] text-muted-foreground">${["一","二","三","四","五","六","日"][i]}</span></div>`).join("");
  return `<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8"><div class="flex items-center justify-between mb-8">
    <div class="flex items-center space-x-4"><button onclick="go('courses')" class="p-2 rounded-md hover:bg-accent transition-colors"><i data-lucide="arrow-left" class="w-5 h-5"></i></button><div><h1 class="text-2xl font-bold">个人中心</h1><p class="text-sm text-muted-foreground">查看学习数据和进度</p></div></div>
    <button onclick="logout()" class="flex items-center space-x-2 px-4 py-2 text-sm text-destructive hover:bg-destructive/10 rounded-md transition-colors"><i data-lucide="log-out" class="w-4 h-4"></i><span>退出</span></button></div>
    <div class="card mb-8"><div class="flex items-center space-x-4"><div class="w-16 h-16 rounded-full bg-primary flex items-center justify-center text-primary-foreground text-2xl font-bold">${esc(S.user.username[0].toUpperCase())}</div>
      <div><h2 class="text-xl font-bold">${esc(S.user.username)}</h2><p class="text-muted-foreground text-sm">${esc(S.user.email)}</p><div class="flex items-center space-x-2 mt-2"><span class="badge badge-primary">活跃学习者</span><span class="text-xs text-muted-foreground">已坚持 ${s.streak} 天</span></div></div></div></div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">${statCards}</div>
    <div class="card mb-8"><div class="flex items-center justify-between mb-6"><div><h3 class="text-lg font-bold">本周学习</h3><p class="text-sm text-muted-foreground">每日学习单词数量</p></div><i data-lucide="bar-chart-3" class="w-5 h-5 text-muted-foreground"></i></div><div class="flex w-full">${bars}</div></div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <button onclick="go('learn')" class="flex items-center justify-center space-x-2 p-4 rounded-md border border-border hover:bg-accent hover:border-primary/30 transition-colors card-hover"><i data-lucide="book-open" class="w-5 h-5 text-primary"></i><span class="font-medium">继续学习</span></button>
      <button onclick="go('review')" class="flex items-center justify-center space-x-2 p-4 rounded-md border border-border hover:bg-accent hover:border-primary/30 transition-colors card-hover"><i data-lucide="flame" class="w-5 h-5 text-accent"></i><span class="font-medium">复习单词</span></button>
      <button onclick="go('courses')" class="flex items-center justify-center space-x-2 p-4 rounded-md border border-border hover:bg-accent hover:border-primary/30 transition-colors card-hover"><i data-lucide="target" class="w-5 h-5 text-success"></i><span class="font-medium">选择词书</span></button>
    </div></div>`;
}
/* ============================ 考试评测 ============================ */
function screenExams() {
  if (S.exam.id && !S.exam.submitted) return examQuiz();
  if (S.exam.id && S.exam.submitted) return examResult();
  const cards = EXAMS.map((e) => `<div class="card card-hover" style="padding:1.5rem">
    <div class="flex items-start justify-between mb-3"><div class="w-9 h-9 flex items-center justify-center bg-primary/10 text-primary rounded-md"><i data-lucide="file-text" class="w-5 h-5"></i></div><span class="badge badge-primary">${e.level}</span></div>
    <h3 class="text-base font-semibold mb-1">${esc(e.title)}</h3><p class="text-xs text-muted-foreground mb-4">${e.questionCount} 题 · 限时 ${e.duration} 分钟</p>
    <button onclick="startExam('${e.id}')" class="btn-primary w-full"><span>开始考试</span><i data-lucide="arrow-right" class="w-4 h-4"></i></button></div>`).join("");
  return `<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12"><div class="mb-8"><h1 class="text-3xl font-bold text-foreground mb-2">考试评测</h1><p class="text-muted-foreground">在线答题，提交后自动判分</p></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${cards}</div></div>`;
}
function startExam(id) { S.exam = { id, idx: 0, picks: {}, submitted: false, score: 0 }; render(); }
function examQuiz() {
  const ex = EXAMS.find((e) => e.id === S.exam.id), qs = EXAM_QUESTIONS[ex.id], i = S.exam.idx, q = qs[i], pick = S.exam.picks[i];
  const opts = q.options.map((o, oi) => `<button onclick="examPick(${oi})" class="w-full text-left px-4 py-3 rounded-md border transition-all flex items-center space-x-3 ${pick===oi?"border-primary bg-primary/5 ring-1 ring-primary/30":"border-border bg-card hover:border-primary/40"}"><span class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 ${pick===oi?"bg-primary text-white":"bg-muted text-muted-foreground"}">${oi+1}</span><span class="text-sm text-foreground">${esc(o)}</span></button>`).join("");
  const progress = (i / qs.length) * 100;
  return `<div class="min-h-screen bg-background"><div class="sticky top-0 z-40 bg-background/95 backdrop-blur border-b border-border"><div class="max-w-3xl mx-auto px-4 py-3">
    <div class="flex items-center justify-between mb-3"><button onclick="go('exams')" class="flex items-center space-x-2 text-muted-foreground hover:text-foreground transition-colors"><i data-lucide="arrow-left" class="w-5 h-5"></i><span class="text-sm">退出考试</span></button><span class="text-xs text-muted-foreground">第 ${i+1} / ${qs.length} 题</span></div>
    <div class="progress-track"><div class="progress-bar" style="width:${progress}%"></div></div></div></div>
    <div class="max-w-3xl mx-auto px-4 py-8"><div class="card card-pad">
      <div class="flex items-center gap-2 mb-3"><span class="badge badge-primary">${ex.level}</span><span class="text-xs text-muted-foreground">${esc(ex.title)}</span></div>
      <p class="text-lg leading-relaxed text-foreground mb-6">${esc(q.q)}</p><div class="space-y-2.5">${opts}</div>
      <div class="mt-6 flex justify-end"><button onclick="examNext()" class="btn-primary px-6 py-2.5" ${pick===undefined?"disabled":""}>${i < qs.length-1 ? "下一题" : "提交试卷"}</button></div>
    </div></div></div>`;
}
function examPick(oi) { S.exam.picks[S.exam.idx] = oi; render(); }
function examNext() {
  const ex = EXAMS.find((e) => e.id === S.exam.id), qs = EXAM_QUESTIONS[ex.id];
  if (S.exam.idx < qs.length - 1) { S.exam.idx++; render(); }
  else { let score = 0; qs.forEach((q, i) => { if (S.exam.picks[i] === q.answer) score++; }); S.exam.score = Math.round((score / qs.length) * 100); S.exam.submitted = true; render(); }
}
function examResult() {
  const ex = EXAMS.find((e) => e.id === S.exam.id), qs = EXAM_QUESTIONS[ex.id], sc = S.exam.score, pass = sc >= 60;
  const rows = qs.map((q, i) => { const ok = S.exam.picks[i] === q.answer; return `<div class="flex items-start gap-3 p-3 rounded-md ${ok?'bg-success/10':'bg-destructive/10'}"><div class="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 ${ok?'bg-success text-success-foreground':'bg-destructive text-destructive-foreground'}">${ok?'<i data-lucide="check" class="w-4 h-4"></i>':'<i data-lucide="x" class="w-4 h-4"></i>'}</div><div class="flex-1"><p class="text-sm text-foreground">${esc(q.q)}</p><p class="text-xs text-muted-foreground mt-1">你的答案：${esc(q.options[S.exam.picks[i]])} · 正确答案：${esc(q.options[q.answer])}</p></div></div>`; }).join("");
  return `<div class="min-h-screen bg-background"><div class="max-w-3xl mx-auto px-4 py-12">
    <div class="text-center mb-8"><div class="w-24 h-24 rounded-full ${pass?'bg-success/10':'bg-destructive/10'} flex items-center justify-center mx-auto mb-6"><span class="text-3xl font-bold ${pass?'text-success':'text-destructive'}">${sc}</span></div>
    <h2 class="text-3xl font-bold mb-2">${pass?'恭喜，通过考试！':'很遗憾，未通过'}</h2><p class="text-muted-foreground">${esc(ex.title)} · 得分 ${sc} 分（满分 100，及格 60）</p></div>
    <div class="card mb-8"><div class="space-y-3">${rows}</div></div>
    <div class="flex justify-center gap-3"><button onclick="go('dashboard')" class="btn-primary px-6 py-3">返回工作台</button><button onclick="startExam('${ex.id}')" class="btn-outline px-6 py-3"><i data-lucide="rotate-ccw" class="w-4 h-4"></i>再来一次</button></div>
  </div></div>`;
}
/* ============================ 网课（占位） ============================ */
function screenOnline() {
  return `<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12"><div class="text-center py-20">
    <div class="w-20 h-20 rounded-full bg-muted/50 flex items-center justify-center mx-auto mb-6"><i data-lucide="video" class="w-10 h-10 text-muted-foreground/50"></i></div>
    <h3 class="text-xl font-semibold text-foreground mb-2">网课中心即将上线</h3><p class="text-muted-foreground mb-6">系统化视频课程正在筹备中，敬请期待。</p>
    <button onclick="go('dashboard')" class="btn-primary">返回工作台</button></div></div>`;
}
/* ============================ 渲染 ============================ */
function render() {
  document.getElementById("navbar").innerHTML = navbar();
  let html = "";
  switch (S.screen) {
    case "landing": html = screenLanding(); break;
    case "login": html = screenLogin(); break;
    case "dashboard": html = screenDashboard(); break;
    case "learn": html = screenLearn(); break;
    case "review": html = screenReview(); break;
    case "ai-chat": html = screenAiChat(); break;
    case "courses": html = screenCourses(); break;
    case "wrong-book": html = screenWrong(); break;
    case "profile": html = screenProfile(); break;
    case "exams": html = screenExams(); break;
    case "online-courses": html = screenOnline(); break;
    default: html = screenLanding();
  }
  document.getElementById("app").innerHTML = html;
  if (window.lucide) lucide.createIcons();
  const cl = document.getElementById("chatList"); if (cl) cl.scrollTop = cl.scrollHeight;
}
window.addEventListener("load", render);
render();
</script>
</body>
</html>
