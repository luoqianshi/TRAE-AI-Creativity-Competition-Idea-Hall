<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>记忆宝盒</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --rule: #e5e7eb;
      --accent: #4f46e5;
      --accent2: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 20px;
      --shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
    }

    .progress-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding: 0 0.5rem;
    }
    .progress-text {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 500;
    }
    .progress-pill {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem 1.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .word-badge {
      display: inline-block;
      background: var(--bg);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }

    .word {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 0.25rem;
    }

    .phonetic {
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .question {
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .option {
      background: var(--bg);
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      position: relative;
    }
    .option:hover:not(.disabled) {
      border-color: var(--accent);
      background: #eef2ff;
    }
    .option.correct {
      background: #d1fae5;
      border-color: var(--accent2);
      color: #065f46;
    }
    .option.wrong {
      background: #fee2e2;
      border-color: var(--danger);
      color: #991b1b;
    }
    .option.disabled {
      cursor: default;
      pointer-events: none;
    }

    .check-icon {
      width: 20px;
      height: 20px;
      display: none;
    }
    .option.correct .check-icon,
    .option.wrong .check-icon {
      display: inline-block;
    }

    .feedback {
      font-size: 0.95rem;
      font-weight: 600;
      min-height: 1.5rem;
      margin-bottom: 1rem;
    }
    .feedback.correct-text { color: var(--accent2); }
    .feedback.wrong-text { color: var(--danger); }

    .btn-next {
      width: 100%;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      opacity: 0.4;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .btn-next.active {
      opacity: 1;
      pointer-events: auto;
    }
    .btn-next:active { transform: scale(0.98); }

    .ai-tip {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .ai-tip svg {
      width: 16px;
      height: 16px;
      color: var(--accent);
    }

    .mastery-ring {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 44px;
      height: 44px;
    }
    .mastery-ring svg {
      transform: rotate(-90deg);
    }
    .mastery-ring circle.bg {
      fill: none;
      stroke: var(--rule);
      stroke-width: 4;
    }
    .mastery-ring circle.progress {
      fill: none;
      stroke: var(--accent2);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 126;
      stroke-dashoffset: 44;
      transition: stroke-dashoffset 0.6s ease;
    }
    .mastery-ring .percent {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--accent2);
    }

    .streak-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      margin-bottom: 1rem;
    }
    .streak-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--rule);
      transition: background 0.3s ease;
    }
    .streak-dot.on {
      background: var(--accent2);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card { animation: fadeIn 0.4s ease; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="progress-bar">
      <span class="progress-text">今日复习</span>
      <span class="progress-pill" id="progressPill">1 / 12</span>
    </div>

    <div class="card" id="card">
      <div class="mastery-ring">
        <svg width="44" height="44" viewBox="0 0 44 44">
          <circle class="bg" cx="22" cy="22" r="20"></circle>
          <circle class="progress" cx="22" cy="22" r="20" id="ring"></circle>
        </svg>
        <span class="percent" id="percent">65%</span>
      </div>

      <div class="word-badge" id="wordBadge">GRE 词汇</div>
      <div class="word" id="word">Ephemeral</div>
      <div class="phonetic" id="phonetic">/ɪˈfemərəl/</div>
      <div class="question" id="question">请选择正确的中文释义</div>

      <div class="streak-bar" id="streakBar"></div>

      <div class="options" id="options"></div>

      <div class="feedback" id="feedback"></div>
      <button class="btn-next" id="btnNext" onclick="nextWord()">下一词</button>
    </div>

    <div class="ai-tip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
        <path d="M12 2a10 10 0 0 1 10 10"></path>
        <path d="M12 12L2.5 12"></path>
      </svg>
      <span id="aiTip">AI 已根据你的记忆强度调整下次复习间隔为 3 天后</span>
    </div>
  </div>

  <script>
    // ===================== 公共词汇库 =====================
    const VOCABULARY = [
      { word: "Ephemeral", phonetic: "/ɪˈfemərəl/", meaning: "短暂的", tag: "GRE 词汇" },
      { word: "Serendipity", phonetic: "/ˌserənˈdɪpɪti/", meaning: "意外发现珍奇事物的能力", tag: "GRE 词汇" },
      { word: "Eloquent", phonetic: "/ˈeləkwənt/", meaning: "雄辩的", tag: "GRE 词汇" },
      { word: "Ubiquitous", phonetic: "/juːˈbɪkwɪtəs/", meaning: "无处不在的", tag: "GRE 词汇" },
      { word: "Pragmatic", phonetic: "/præɡˈmætɪk/", meaning: "务实的", tag: "GRE 词汇" },
      { word: "Meticulous", phonetic: "/məˈtɪkjələs/", meaning: "一丝不苟的", tag: "GRE 词汇" },
      { word: "Resilient", phonetic: "/rɪˈzɪliənt/", meaning: "有弹性的；能迅速恢复的", tag: "GRE 词汇" },
      { word: "Ambiguous", phonetic: "/æmˈbɪɡjuəs/", meaning: "模棱两可的", tag: "GRE 词汇" },
      { word: "Nostalgia", phonetic: "/nɒˈstældʒə/", meaning: "怀旧", tag: "GRE 词汇" },
      { word: "Epiphany", phonetic: "/ɪˈpɪfəni/", meaning: "顿悟", tag: "GRE 词汇" },
      { word: "Alleviate", phonetic: "/əˈliːvieɪt/", meaning: "减轻", tag: "GRE 词汇" },
      { word: "Coherent", phonetic: "/kəʊˈhɪərənt/", meaning: "连贯的", tag: "GRE 词汇" },
      { word: "Diligent", phonetic: "/ˈdɪlɪdʒənt/", meaning: "勤奋的", tag: "四级词汇" },
      { word: "Fragile", phonetic: "/ˈfrædʒaɪl/", meaning: "脆弱的", tag: "四级词汇" },
      { word: "Generous", phonetic: "/ˈdʒenərəs/", meaning: "慷慨的", tag: "四级词汇" },
      { word: "Hypothesis", phonetic: "/haɪˈpɒθəsɪs/", meaning: "假设", tag: "四级词汇" },
      { word: "Innovation", phonetic: "/ˌɪnəˈveɪʃn/", meaning: "创新", tag: "四级词汇" },
      { word: "Juxtapose", phonetic: "/ˌdʒʌkstəˈpəʊz/", meaning: "并置", tag: "六级词汇" },
      { word: "Kaleidoscope", phonetic: "/kəˈlaɪdəskəʊp/", meaning: "万花筒", tag: "六级词汇" },
      { word: "Ludicrous", phonetic: "/ˈluːdɪkrəs/", meaning: "荒唐的", tag: "六级词汇" }
    ];

    // ===================== 状态 =====================
    let currentIndex = 0;
    let answered = false;
    let streak = 0;
    const totalToday = 12;
    let reviewedCount = 0;
    let currentCorrectIndex = 0;

    // ===================== 工具函数 =====================
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getDistractors(correctMeaning, allMeanings) {
      const others = allMeanings.filter(m => m !== correctMeaning);
      const shuffled = shuffle(others);
      return shuffled.slice(0, 3);
    }

    function setRingPercent(percent) {
      const ring = document.getElementById('ring');
      const label = document.getElementById('percent');
      const circumference = 126;
      const offset = circumference - (percent / 100) * circumference;
      ring.style.strokeDashoffset = offset;
      label.textContent = percent + '%';
    }

    function renderStreak() {
      const bar = document.getElementById('streakBar');
      bar.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const dot = document.createElement('div');
        dot.className = 'streak-dot' + (i < streak ? ' on' : '');
        bar.appendChild(dot);
      }
    }

    function getReviewInterval(streakCount) {
      const intervals = [1, 3, 7, 14, 30];
      return intervals[Math.min(streakCount, intervals.length - 1)];
    }

    // ===================== 渲染题目 =====================
    function loadWord(index) {
      const item = VOCABULARY[index % VOCABULARY.length];
      document.getElementById('word').textContent = item.word;
      document.getElementById('phonetic').textContent = item.phonetic;
      document.getElementById('wordBadge').textContent = item.tag;

      // 生成选项
      const allMeanings = VOCABULARY.map(v => v.meaning);
      const distractors = getDistractors(item.meaning, allMeanings);
      const options = shuffle([item.meaning, ...distractors]);
      currentCorrectIndex = options.indexOf(item.meaning);

      const optsContainer = document.getElementById('options');
      optsContainer.innerHTML = '';
      options.forEach((text, i) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.dataset.index = i;
        btn.onclick = function() { selectOption(this); };
        btn.innerHTML = `
          <span>${text}</span>
          <svg class="check-icon" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
          </svg>
        `;
        optsContainer.appendChild(btn);
      });

      // 更新进度
      reviewedCount = Math.min(reviewedCount + 1, totalToday);
      document.getElementById('progressPill').textContent = `${reviewedCount} / ${totalToday}`;

      // 掌握度波动模拟
      const mastery = 50 + Math.floor(Math.random() * 40);
      setRingPercent(mastery);

      // AI 提示
      const days = getReviewInterval(streak);
      document.getElementById('aiTip').textContent = `AI 已根据你的记忆强度调整下次复习间隔为 ${days} 天后`;
    }

    // ===================== 答题交互 =====================
    function selectOption(el) {
      if (answered) return;
      answered = true;

      const index = parseInt(el.dataset.index);
      const options = document.querySelectorAll('.option');
      const feedback = document.getElementById('feedback');
      const btn = document.getElementById('btnNext');

      options.forEach(opt => opt.classList.add('disabled'));

      if (index === currentCorrectIndex) {
        el.classList.add('correct');
        feedback.textContent = '回答正确！记忆已巩固。';
        feedback.className = 'feedback correct-text';
        streak = Math.min(streak + 1, 5);
      } else {
        el.classList.add('wrong');
        options[currentCorrectIndex].classList.add('correct');
        const correctText = options[currentCorrectIndex].querySelector('span').textContent;
        feedback.textContent = `回答错误。正确答案是「${correctText}」。`;
        feedback.className = 'feedback wrong-text';
        streak = 0;
      }

      renderStreak();
      btn.classList.add('active');
    }

    // ===================== 下一词 =====================
    function nextWord() {
      const card = document.getElementById('card');
      card.style.animation = 'none';
      card.offsetHeight;
      card.style.animation = 'fadeIn 0.4s ease';

      answered = false;
      document.getElementById('feedback').textContent = '';
      document.getElementById('btnNext').classList.remove('active');

      currentIndex++;
      loadWord(currentIndex);
    }

    // ===================== 初始化 =====================
    renderStreak();
    loadWord(currentIndex);
  </script>
</body>
</html>
