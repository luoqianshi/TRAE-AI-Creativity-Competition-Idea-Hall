<!--
  牛马自救指南 · 感恩罐子
  参照小红书感恩日记、微信公众号每日感恩话题
  单文件、零外部依赖、全功能可交互
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="每日记录3件感恩的事，感恩罐子可视化，温暖记录生活中的小确幸，打工人心灵治愈小工具。">
<meta name="theme-color" content="#D4834A">
<title>牛马自救指南 · 感恩罐子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FDF8F0;
    --paper-dark: #F5EDE0;
    --paper-line: #EDE5D8;
    --ink: #3D3229;
    --ink-light: #6B5E52;
    --ink-muted: #A89B8C;
    --accent: #D4834A;
    --accent-light: #E8A87C;
    --accent-soft: #F5D5C0;
    --warm: #C4A882;
    --card-bg: #FFFDF9;
    --shadow: rgba(61,50,41,0.06);
    --shadow-hover: rgba(61,50,41,0.10);
    --orange: #E89B5A;
    --orange-light: #F0B880;
    --orange-soft: #FAE8D0;
    --yellow: #D4C47B;
    --yellow-light: #F0E4A8;
    --yellow-soft: #FAF0D4;
    --pink: #D48BA0;
    --pink-light: #F0B0C4;
    --pink-soft: #FAD4DE;
    --green: #7BA68A;
    --green-light: #A8D4B0;
    --green-soft: #D4EAD8;
    --blue: #7BAED4;
    --blue-light: #A8D0F0;
    --blue-soft: #D4EAFA;
    --purple: #9B7BD4;
    --purple-light: #C0A8F0;
    --purple-soft: #E0D4FA;
    --red: #D47B7B;
    --red-light: #F0A8A8;
    --red-soft: #FAD4D4;
    --radius-sm: 6px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --radius-full: 50%;
    --shadow-sm: 0 2px 8px rgba(61,50,41,0.06);
    --shadow-md: 0 4px 16px rgba(61,50,41,0.10);
    --shadow-lg: 0 4px 20px rgba(212,131,74,0.35);
    --transition: 0.3s ease;
    --dark-bg: #1A1A2E;
    --dark-card: #222244;
    --dark-ink: #E8E6E3;
    --dark-muted: #7A7670;
    --dark-accent: #E8A060;
  }

  html.dark-mode {
    --paper: var(--dark-bg);
    --paper-dark: #16213E;
    --paper-line: #2A2A4A;
    --ink: var(--dark-ink);
    --ink-light: #B8B5B0;
    --ink-muted: var(--dark-muted);
    --card-bg: var(--dark-card);
    --shadow: rgba(0,0,0,0.2);
    --shadow-hover: rgba(0,0,0,0.3);
    --accent: var(--dark-accent);
    --accent-light: #F0B880;
    --accent-soft: #3D2E20;
    --orange-soft: #3D2E20;
    --yellow-soft: #3D3820;
    --pink-soft: #3D2030;
    --green-soft: #203D28;
    --blue-soft: #20303D;
    --purple-soft: #2E2040;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { transition: background-color var(--transition), color var(--transition); }
  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--paper-dark);
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .handwriting { font-family: 'ZCOOL KuaiLe', 'STKaiti', 'KaiTi', cursive; }

  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--paper);
    position: relative;
    overflow: hidden;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--paper);
    border-bottom: 1px solid var(--paper-line);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .back-btn {
    width: 36px; height: 36px;
    border-radius: var(--radius-full);
    border: 1px solid var(--paper-line);
    background: var(--card-bg);
    color: var(--ink);
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .back-btn:active { transform: scale(0.92); }
  .header-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    color: var(--ink);
  }
  .theme-btn {
    width: 36px; height: 36px;
    border-radius: var(--radius-full);
    border: 1px solid var(--paper-line);
    background: var(--card-bg);
    color: var(--ink);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* Tabs */
  .tabs {
    display: flex;
    padding: 0 16px;
    border-bottom: 1px solid var(--paper-line);
    background: var(--paper);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 12px 0;
    font-size: 14px;
    color: var(--ink-muted);
    cursor: pointer;
    position: relative;
    transition: color 0.2s;
    font-weight: 500;
  }
  .tab.active { color: var(--accent); font-weight: 700; }
  .tab.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 24px; height: 3px;
    background: var(--accent);
    border-radius: 2px;
  }

  .page { display: none; padding: 16px; padding-bottom: 100px; min-height: calc(100vh - 110px); }
  .page.active { display: block; animation: pageIn 0.3s ease; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== JAR PAGE ===== */
  .jar-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0 20px;
  }
  .jar-svg-wrap {
    position: relative;
    width: 200px;
    height: 260px;
    margin-bottom: 16px;
  }
  .jar-svg-wrap svg {
    width: 100%;
    height: 100%;
  }
  .jar-fill-anim {
    transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .jar-count-label {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 14px;
    color: var(--accent);
    text-align: center;
    margin-bottom: 4px;
  }
  .jar-hint {
    font-size: 12px;
    color: var(--ink-muted);
    text-align: center;
  }

  /* Stats */
  .stats-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    flex: 1;
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius-lg);
    padding: 14px 10px;
    text-align: center;
  }
  .stat-num {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 28px;
    color: var(--accent);
    line-height: 1;
  }
  .stat-label {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 4px;
  }

  /* Input Section */
  .input-section {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 16px;
  }
  .input-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .gratitude-inputs {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 14px;
  }
  .gratitude-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .gratitude-num {
    width: 28px; height: 28px;
    border-radius: var(--radius-full);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .gratitude-input {
    flex: 1;
    padding: 10px 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--paper-line);
    background: var(--paper);
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .gratitude-input:focus { border-color: var(--accent); }
  .gratitude-input::placeholder { color: var(--ink-muted); }

  .btn-primary {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius-md);
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-primary:active { transform: scale(0.98); opacity: 0.9; }

  /* Random review */
  .random-card {
    background: linear-gradient(135deg, var(--orange-soft), var(--yellow-soft));
    border: 1.5px solid var(--accent-light);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .random-label {
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 10px;
  }
  .random-text {
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink);
    margin-bottom: 8px;
    min-height: 48px;
  }
  .random-date {
    font-size: 11px;
    color: var(--ink-muted);
    margin-bottom: 12px;
  }
  .random-btn {
    padding: 8px 20px;
    border-radius: 20px;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .random-btn:active { transform: scale(0.95); background: var(--accent); color: #fff; }

  /* ===== TIMELINE PAGE ===== */
  .timeline-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-muted);
  }
  .timeline-empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

  .timeline-group {
    margin-bottom: 20px;
  }
  .timeline-date-header {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .timeline-date-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--paper-line);
  }
  .timeline-items {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-left: 12px;
    border-left: 2px solid var(--accent-soft);
    margin-left: 6px;
  }
  .timeline-item {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    position: relative;
    transition: all 0.2s;
  }
  .timeline-item::before {
    content: '';
    position: absolute;
    left: -17px;
    top: 16px;
    width: 10px;
    height: 10px;
    border-radius: var(--radius-full);
    background: var(--accent);
    border: 2px solid var(--paper);
  }
  .timeline-item-text {
    font-size: 14px;
    color: var(--ink);
    line-height: 1.6;
  }
  .timeline-item-time {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 4px;
  }
  .timeline-item-del {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 24px; height: 24px;
    border-radius: var(--radius-full);
    border: none;
    background: transparent;
    color: var(--ink-muted);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .timeline-item-del:active { color: var(--red); }

  /* Share overlay */
  .share-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 150;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .share-overlay.active { display: flex; }
  .share-card {
    background: var(--card-bg);
    border-radius: var(--radius-xl);
    padding: 20px;
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .share-canvas-wrap {
    border-radius: var(--radius-md);
    overflow: hidden;
    margin-bottom: 16px;
    background: var(--paper);
  }
  .share-canvas-wrap canvas {
    width: 100%;
    display: block;
  }
  .share-btns {
    display: flex;
    gap: 10px;
  }
  .btn-secondary {
    flex: 1;
    padding: 12px;
    border-radius: var(--radius-md);
    background: var(--card-bg);
    color: var(--ink);
    border: 1px solid var(--paper-line);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-secondary:active { transform: scale(0.97); background: var(--paper-line); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 20px;
    border-radius: var(--radius-md);
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--paper-line); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <button class="back-btn" onclick="window.location.href='../niujiu-demo-final.html'">&#8592;</button>
    <div class="header-title handwriting">感恩罐子</div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">&#9788;</button>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('jar')">感恩罐</div>
    <div class="tab" onclick="switchTab('timeline')">时间线</div>
  </div>

  <!-- Jar Page -->
  <div class="page active" id="page-jar">
    <div class="jar-section">
      <div class="jar-svg-wrap">
        <svg viewBox="0 0 200 260" id="jarSvg">
          <!-- Jar body -->
          <defs>
            <linearGradient id="jarGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--accent-soft)" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.15"/>
            </linearGradient>
            <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--accent-light)" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.8"/>
            </linearGradient>
            <clipPath id="jarClip">
              <path d="M50,50 Q50,40 60,40 L140,40 Q150,40 150,50 L155,230 Q155,245 140,245 L60,245 Q45,245 45,230 Z"/>
            </clipPath>
          </defs>
          <!-- Jar outline -->
          <path d="M50,50 Q50,40 60,40 L140,40 Q150,40 150,50 L155,230 Q155,245 140,245 L60,245 Q45,245 45,230 Z"
                fill="url(#jarGrad)" stroke="var(--accent)" stroke-width="2" stroke-opacity="0.4"/>
          <!-- Jar lid -->
          <rect x="45" y="30" width="110" height="14" rx="4" fill="var(--accent)" opacity="0.7"/>
          <rect x="55" y="26" width="90" height="8" rx="3" fill="var(--accent-light)" opacity="0.5"/>
          <!-- Fill -->
          <rect id="jarFill" x="47" y="240" width="106" height="0" fill="url(#fillGrad)" clip-path="url(#jarClip)" class="jar-fill-anim"/>
          <!-- Hearts/bubbles inside -->
          <g id="jarBubbles" clip-path="url(#jarClip)"></g>
          <!-- Jar shine -->
          <path d="M60,50 L60,230" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="jar-count-label" id="jarCountLabel">罐子里有 0 颗感恩星</div>
      <div class="jar-hint">每记录一件感恩的事，罐子就会多一颗星</div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">总记录数</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statStreak">0</div>
        <div class="stat-label">连续天数</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statToday">0</div>
        <div class="stat-label">今日记录</div>
      </div>
    </div>

    <div class="input-section">
      <div class="input-title">&#127807; 今天感恩的3件事</div>
      <div class="gratitude-inputs">
        <div class="gratitude-input-row">
          <span class="gratitude-num">1</span>
          <input type="text" class="gratitude-input" id="gInput1" placeholder="感恩一件小事..." maxlength="100">
        </div>
        <div class="gratitude-input-row">
          <span class="gratitude-num">2</span>
          <input type="text" class="gratitude-input" id="gInput2" placeholder="感恩一个人..." maxlength="100">
        </div>
        <div class="gratitude-input-row">
          <span class="gratitude-num">3</span>
          <input type="text" class="gratitude-input" id="gInput3" placeholder="感恩一个瞬间..." maxlength="100">
        </div>
      </div>
      <button class="btn-primary" onclick="saveGratitude()">&#127807; 存入感恩罐</button>
    </div>

    <div class="random-card" id="randomCard">
      <div class="random-label">&#10024; 随机回顾</div>
      <div class="random-text" id="randomText">点击按钮，随机回顾一条感恩记录</div>
      <div class="random-date" id="randomDate"></div>
      <button class="random-btn" onclick="randomReview()">&#127922; 随机一条</button>
    </div>

    <button class="btn-secondary" style="width:100%;margin-bottom:16px;" onclick="openShare()">&#128241; 分享感恩卡片</button>
  </div>

  <!-- Timeline Page -->
  <div class="page" id="page-timeline">
    <div id="timelineContainer">
      <div class="timeline-empty">
        <div class="timeline-empty-icon">&#127807;</div>
        <p>还没有感恩记录，去记录第一件感恩的事吧</p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<!-- Share Overlay -->
<div class="share-overlay" id="shareOverlay" onclick="closeShare(event)">
  <div class="share-card" onclick="event.stopPropagation()">
    <div class="share-canvas-wrap">
      <canvas id="shareCanvas" width="600" height="400"></canvas>
    </div>
    <div class="share-btns">
      <button class="btn-secondary" onclick="closeShare()">关闭</button>
      <button class="btn-primary" onclick="downloadShare()" style="flex:1;">保存图片</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  const STORAGE_KEY = 'niujiu_gratitude_jar';
  const THEME_KEY = 'niujiu_gratitude_theme';
  let records = [];

  function init() {
    loadRecords();
    applyTheme();
    updateStats();
    updateJar();
    renderTimeline();
  }

  // ===== Theme =====
  function applyTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (saved === 'dark' || (!saved && prefersDark)) {
      document.documentElement.classList.add('dark-mode');
      document.getElementById('themeBtn').textContent = '\u263E';
    } else {
      document.documentElement.classList.remove('dark-mode');
      document.getElementById('themeBtn').textContent = '\u263C';
    }
  }
  window.toggleTheme = function() {
    const isDark = document.documentElement.classList.toggle('dark-mode');
    localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
    document.getElementById('themeBtn').textContent = isDark ? '\u263E' : '\u263C';
  };

  // ===== Tabs =====
  window.switchTab = function(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('page-' + name).classList.add('active');
    if (name === 'timeline') renderTimeline();
  };

  // ===== Storage =====
  function loadRecords() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) records = JSON.parse(raw);
    } catch(e) { records = []; }
  }
  function saveRecords() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }

  // ===== Stats =====
  function updateStats() {
    document.getElementById('statTotal').textContent = records.length;
    // Streak
    let streak = 0;
    const today = new Date();
    const dateSet = new Set();
    records.forEach(r => dateSet.add(r.date));
    for (let i = 0; i < 365; i++) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const ds = d.toISOString().split('T')[0];
      if (dateSet.has(ds)) {
        streak++;
      } else if (i > 0) {
        break;
      }
    }
    document.getElementById('statStreak').textContent = streak;
    // Today
    const todayStr = today.toISOString().split('T')[0];
    const todayCount = records.filter(r => r.date === todayStr).length;
    document.getElementById('statToday').textContent = todayCount;
  }

  // ===== Jar Visualization =====
  function updateJar() {
    const total = records.length;
    document.getElementById('jarCountLabel').textContent = '罐子里有 ' + total + ' 颗感恩星';
    // Fill level: max 100 records = full
    const maxRecords = 100;
    const fillPercent = Math.min(total / maxRecords, 1);
    const jarHeight = 190; // inner jar height in SVG
    const fillHeight = fillPercent * jarHeight;
    const fillEl = document.getElementById('jarFill');
    fillEl.setAttribute('y', String(240 - fillHeight));
    fillEl.setAttribute('height', String(fillHeight));
    // Bubbles
    const bubblesG = document.getElementById('jarBubbles');
    bubblesG.innerHTML = '';
    const bubbleCount = Math.min(total, 20);
    for (let i = 0; i < bubbleCount; i++) {
      const cx = 55 + Math.random() * 90;
      const baseY = 240 - fillHeight + 10;
      const cy = baseY + Math.random() * Math.max(fillHeight - 20, 5);
      const r = 3 + Math.random() * 5;
      const opacity = 0.3 + Math.random() * 0.5;
      const colors = ['var(--accent)', 'var(--accent-light)', 'var(--orange)', 'var(--yellow)', 'var(--pink)'];
      const color = colors[Math.floor(Math.random() * colors.length)];
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', String(cx));
      circle.setAttribute('cy', String(cy));
      circle.setAttribute('r', String(r));
      circle.setAttribute('fill', color);
      circle.setAttribute('opacity', String(opacity));
      bubblesG.appendChild(circle);
    }
  }

  // ===== Save Gratitude =====
  window.saveGratitude = function() {
    const inputs = [
      document.getElementById('gInput1').value.trim(),
      document.getElementById('gInput2').value.trim(),
      document.getElementById('gInput3').value.trim()
    ];
    const valid = inputs.filter(t => t.length > 0);
    if (valid.length === 0) {
      showToast('请至少写一件感恩的事');
      return;
    }
    const now = new Date();
    const dateStr = now.toISOString().split('T')[0];
    const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    valid.forEach(text => {
      records.unshift({
        id: Date.now() + Math.random(),
        text: text,
        date: dateStr,
        time: timeStr
      });
    });
    saveRecords();
    // Clear inputs
    document.getElementById('gInput1').value = '';
    document.getElementById('gInput2').value = '';
    document.getElementById('gInput3').value = '';
    updateStats();
    updateJar();
    showToast('已存入感恩罐！');
  };

  // ===== Random Review =====
  window.randomReview = function() {
    if (records.length === 0) {
      showToast('还没有记录，先写一条感恩吧');
      return;
    }
    const r = records[Math.floor(Math.random() * records.length)];
    const textEl = document.getElementById('randomText');
    const dateEl = document.getElementById('randomDate');
    textEl.style.opacity = '0';
    setTimeout(() => {
      textEl.textContent = r.text;
      dateEl.textContent = r.date + ' ' + r.time;
      textEl.style.opacity = '1';
      textEl.style.transition = 'opacity 0.4s';
    }, 200);
  };

  // ===== Timeline =====
  function renderTimeline() {
    const container = document.getElementById('timelineContainer');
    if (records.length === 0) {
      container.innerHTML = '<div class="timeline-empty"><div class="timeline-empty-icon">&#127807;</div><p>还没有感恩记录，去记录第一件感恩的事吧</p></div>';
      return;
    }
    // Group by date
    const groups = {};
    records.forEach(r => {
      if (!groups[r.date]) groups[r.date] = [];
      groups[r.date].push(r);
    });
    const sortedDates = Object.keys(groups).sort((a, b) => b.localeCompare(a));
    let html = '';
    sortedDates.forEach(date => {
      const items = groups[date];
      const d = new Date(date + 'T00:00:00');
      const weekDays = ['周日','周一','周二','周三','周四','周五','周六'];
      const label = (d.getMonth()+1) + '月' + d.getDate() + '日 ' + weekDays[d.getDay()];
      html += '<div class="timeline-group">';
      html += '<div class="timeline-date-header">' + label + ' (' + items.length + '条)</div>';
      html += '<div class="timeline-items">';
      items.forEach((item, idx) => {
        html += '<div class="timeline-item">';
        html += '<div class="timeline-item-text">' + escapeHtml(item.text) + '</div>';
        html += '<div class="timeline-item-time">' + item.time + '</div>';
        html += '<button class="timeline-item-del" onclick="deleteRecord(\'' + item.id + '\')">&#215;</button>';
        html += '</div>';
      });
      html += '</div></div>';
    });
    container.innerHTML = html;
  }

  window.deleteRecord = function(id) {
    records = records.filter(r => String(r.id) !== String(id));
    saveRecords();
    updateStats();
    updateJar();
    renderTimeline();
    showToast('已删除');
  };

  // ===== Share =====
  window.openShare = function() {
    if (records.length === 0) {
      showToast('还没有记录，先写一条感恩吧');
      return;
    }
    drawShareCard();
    document.getElementById('shareOverlay').classList.add('active');
  };

  window.closeShare = function(e) {
    if (!e || e.target === document.getElementById('shareOverlay')) {
      document.getElementById('shareOverlay').classList.remove('active');
    }
  };

  function drawShareCard() {
    const canvas = document.getElementById('shareCanvas');
    const ctx = canvas.getContext('2d');
    const w = 600, h = 400;
    canvas.width = w * 2;
    canvas.height = h * 2;
    ctx.scale(2, 2);

    const isDark = document.documentElement.classList.contains('dark-mode');
    const bg = isDark ? '#222244' : '#FFFDF9';
    const textColor = isDark ? '#E8E6E3' : '#3D3229';
    const accent = isDark ? '#E8A060' : '#D4834A';
    const subColor = isDark ? '#7A7670' : '#A89B8C';

    // Background
    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, isDark ? '#2A2040' : '#FFF5EB');
    grad.addColorStop(1, isDark ? '#1A2030' : '#FFF0E0');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // Decorative
    ctx.fillStyle = isDark ? 'rgba(232,160,96,0.08)' : 'rgba(212,131,74,0.06)';
    ctx.beginPath();
    ctx.arc(500, 60, 80, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(80, 350, 60, 0, Math.PI * 2);
    ctx.fill();

    // Title
    ctx.fillStyle = accent;
    ctx.font = 'bold 22px "ZCOOL KuaiLe", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('牛马自救指南 · 感恩罐子', w / 2, 50);

    // Divider
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(220, 62);
    ctx.lineTo(380, 62);
    ctx.stroke();

    // Stats
    ctx.fillStyle = subColor;
    ctx.font = '14px "Noto Sans SC", sans-serif';
    ctx.fillText('已记录 ' + records.length + ' 条感恩', w / 2, 88);

    // Recent 3 items
    const recent = records.slice(0, 3);
    let y = 120;
    recent.forEach((r, i) => {
      ctx.fillStyle = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(212,131,74,0.06)';
      const boxH = 56;
      roundRect(ctx, 60, y, w - 120, boxH, 10);
      ctx.fill();

      ctx.fillStyle = accent;
      ctx.font = 'bold 16px "Noto Sans SC", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('#' + (i + 1), 80, y + 24);

      ctx.fillStyle = textColor;
      ctx.font = '15px "Noto Sans SC", sans-serif';
      const displayText = r.text.length > 22 ? r.text.substring(0, 22) + '...' : r.text;
      ctx.fillText(displayText, 115, y + 24);

      ctx.fillStyle = subColor;
      ctx.font = '11px "Noto Sans SC", sans-serif';
      ctx.fillText(r.date, 115, y + 44);

      y += boxH + 12;
    });

    // Footer
    ctx.fillStyle = accent;
    ctx.font = '13px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('记录感恩，温暖每一天', w / 2, h - 30);
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  window.downloadShare = function() {
    const canvas = document.getElementById('shareCanvas');
    const link = document.createElement('a');
    link.download = 'gratitude-jar-' + new Date().toISOString().split('T')[0] + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('图片已保存');
  };

  // ===== Utils =====
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  init();
})();

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>
