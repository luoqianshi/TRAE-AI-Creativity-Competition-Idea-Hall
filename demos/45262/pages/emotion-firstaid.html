<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="牛马自救指南 - 情绪急救包，快速缓解负面情绪">
<title>情绪急救包 · 牛马自救指南</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FDF8F0;
  --bg2: #F5EDE0;
  --ink: #2D2A24;
  --accent: #E8916A;
  --ink-muted: #7A7670;
  --card-bg: #FFFBF5;
  --shadow: rgba(45,42,36,0.08);
  --shadow-md: rgba(45,42,36,0.12);
  --radius: 16px;
  --transition: 0.3s ease;
  --cat-anxiety: #FF6B6B;
  --cat-anger: #FF8C42;
  --cat-lowmood: #7EC8E3;
  --cat-overwhelm: #A78BFA;
  --cat-insomnia: #6C5CE7;
  --cat-burnout: #FDCB6E;
}
html.dark-mode {
  --bg: #1A1918;
  --bg2: #252320;
  --ink: #E8E4DC;
  --accent: #E8916A;
  --ink-muted: #9A968E;
  --card-bg: #2A2826;
  --shadow: rgba(0,0,0,0.25);
  --shadow-md: rgba(0,0,0,0.35);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;transition:background var(--transition),color var(--transition)}
.page-wrapper{opacity:0;animation:pageFadeIn .6s ease-out .1s forwards}
@keyframes pageFadeIn{to{opacity:1}}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);overflow:hidden;transition:background var(--transition)}

/* ===== Top Bar ===== */
.top-bar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.back-btn{display:flex;align-items:center;gap:4px;background:none;border:none;color:var(--ink);font-size:15px;cursor:pointer;padding:6px 0;transition:opacity .2s}
.back-btn:active{opacity:.6}
.back-btn svg{width:20px;height:20px}
.top-title{font-size:16px;font-weight:600;letter-spacing:.5px}
.dark-toggle{background:none;border:none;color:var(--ink);font-size:20px;cursor:pointer;padding:4px;transition:opacity .2s}
.dark-toggle:active{opacity:.6}

/* ===== Hero Section ===== */
.hero{padding:20px 16px 16px;text-align:center;position:relative;overflow:hidden}
.hero-title{font-size:26px;font-weight:800;margin-bottom:4px;background:linear-gradient(135deg,var(--accent),#D4724A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:13px;color:var(--ink-muted);margin-bottom:16px}

/* ===== First Aid Kit CSS Art ===== */
.kit-box{width:180px;height:140px;margin:0 auto 16px;position:relative;perspective:600px}
.kit-body{width:100%;height:100%;position:relative;border-radius:12px;background:linear-gradient(145deg,#FF9A76,var(--accent));box-shadow:0 8px 24px rgba(232,145,106,.3),inset 0 -4px 0 rgba(0,0,0,.1);overflow:hidden}
.kit-body::before{content:'';position:absolute;top:0;left:0;right:0;height:30%;background:linear-gradient(180deg,rgba(255,255,255,.25),transparent);border-radius:12px 12px 0 0}
.kit-body::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;border:3px solid rgba(255,255,255,.5);border-radius:50%;background:rgba(255,255,255,.15)}
.kit-cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2}
.kit-cross::before,.kit-cross::after{content:'';position:absolute;background:rgba(255,255,255,.6);border-radius:2px}
.kit-cross::before{width:4px;height:24px;top:-12px;left:-2px}
.kit-cross::after{width:24px;height:4px;top:-2px;left:-12px}
.kit-handle{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:60px;height:24px;border:4px solid var(--accent);border-bottom:none;border-radius:12px 12px 0 0;background:transparent}
.kit-items{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
.kit-item{width:20px;height:20px;border-radius:4px;animation:itemBounce 2s ease-in-out infinite}
.kit-item:nth-child(1){background:#FF6B6B;animation-delay:0s}
.kit-item:nth-child(2){background:#7EC8E3;animation-delay:.3s}
.kit-item:nth-child(3){background:#A78BFA;animation-delay:.6s}
.kit-item:nth-child(4){background:#FDCB6E;animation-delay:.9s}
.kit-item:nth-child(5){background:#6C5CE7;animation-delay:1.2s}
@keyframes itemBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.kit-lid{position:absolute;top:-2px;left:-4px;right:-4px;height:20px;border-radius:8px 8px 0 0;background:linear-gradient(145deg,#FFB088,#FF9A76);transform-origin:bottom center;transition:transform .6s cubic-bezier(.34,1.56,.64,1);z-index:5}
.kit-box:hover .kit-lid,.kit-box.open .kit-lid{transform:rotateX(-40deg) translateY(-4px)}

/* ===== SOS Button ===== */
.sos-section{padding:0 16px 16px}
.sos-btn{width:100%;padding:16px;border:none;border-radius:var(--radius);background:linear-gradient(135deg,#FF6B6B,#EE5A24);color:#fff;font-size:18px;font-weight:700;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 4px 16px rgba(238,90,36,.3);transition:transform .2s,box-shadow .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.sos-btn:active{transform:scale(.97);box-shadow:0 2px 8px rgba(238,90,36,.3)}
.sos-btn .pulse-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;height:100%;border-radius:var(--radius);border:2px solid rgba(255,255,255,.4);animation:sosPulse 2s ease-out infinite}
@keyframes sosPulse{0%{transform:translate(-50%,-50%) scale(1);opacity:.6}100%{transform:translate(-50%,-50%) scale(1.15);opacity:0}}
.sos-btn .pulse-ring:nth-child(2){animation-delay:.6s}

/* ===== Progress Bar ===== */
.progress-section{padding:0 16px 16px}
.progress-card{background:var(--card-bg);border-radius:var(--radius);padding:14px 16px;box-shadow:0 2px 8px var(--shadow);display:flex;align-items:center;justify-content:space-between}
.progress-text{font-size:13px;color:var(--ink-muted)}
.progress-text strong{color:var(--accent);font-size:18px}
.progress-bar-wrap{width:120px;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#D4724A);border-radius:4px;transition:width .6s ease}

/* ===== Category Tabs ===== */
.cat-tabs{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex-shrink:0;padding:8px 14px;border-radius:20px;border:2px solid var(--bg2);background:var(--card-bg);color:var(--ink-muted);font-size:13px;font-weight:600;cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:4px;white-space:nowrap}
.cat-tab.active{color:#fff;border-color:transparent;box-shadow:0 2px 8px var(--shadow-md)}
.cat-tab .tab-emoji{font-size:16px}

/* ===== Category Content ===== */
.cat-content{position:relative;min-height:200px;padding:0 16px 16px}
.cat-panel{display:none;animation:catFadeIn .4s ease-out}
.cat-panel.active{display:block}
@keyframes catFadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ===== Technique Cards ===== */
.tech-card{background:var(--card-bg);border-radius:var(--radius);margin-bottom:12px;box-shadow:0 2px 8px var(--shadow);overflow:hidden;perspective:800px;cursor:pointer;transition:transform .2s}
.tech-card:active{transform:scale(.98)}
.card-inner{position:relative;width:100%;transition:transform .6s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.card-inner.flipped{transform:rotateY(180deg)}
.card-front,.card-back{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card-front{padding:16px}
.card-back{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotateY(180deg);padding:16px;overflow-y:auto;background:var(--card-bg)}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.card-title{font-size:16px;font-weight:700;flex:1}
.card-badges{display:flex;gap:6px;flex-shrink:0;margin-left:8px}
.badge{font-size:11px;padding:3px 8px;border-radius:10px;font-weight:600}
.badge-time{background:var(--bg2);color:var(--ink-muted)}
.badge-diff{background:var(--bg2);color:var(--ink-muted)}
.card-stars{color:#FDCB6E;font-size:13px;margin-bottom:8px;letter-spacing:1px}
.card-desc{font-size:13px;color:var(--ink-muted);line-height:1.6}
.card-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:8px;margin-top:8px;font-weight:500}
.card-actions{display:flex;gap:8px;margin-top:10px}
.card-action-btn{flex:1;padding:8px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .2s}
.card-action-btn:active{opacity:.7}
.btn-start{background:var(--accent);color:#fff}
.btn-fav{background:var(--bg2);color:var(--ink)}
.btn-fav.faved{background:#FF6B6B;color:#fff}
.btn-used{background:var(--bg2);color:var(--ink)}
.btn-used.used{background:#7EC8E3;color:#fff}

/* Card Back */
.back-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.back-title .flip-hint{font-size:11px;font-weight:400;color:var(--ink-muted)}
.step-list{list-style:none;counter-reset:step}
.step-list li{counter-increment:step;padding:8px 0 8px 36px;position:relative;font-size:13px;line-height:1.6;border-bottom:1px solid var(--bg2)}
.step-list li:last-child{border-bottom:none}
.step-list li::before{content:counter(step);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.back-encourage{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--bg2);font-size:12px;color:var(--ink-muted);text-align:center;line-height:1.5}
.back-timer-area{margin-top:10px}
.back-timer-btn{width:100%;padding:10px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s}
.back-timer-btn:active{opacity:.7}
.timer-display{display:none;text-align:center;padding:12px;margin-top:8px}
.timer-display.active{display:block}
.timer-circle{width:80px;height:80px;margin:0 auto 8px;border-radius:50%;border:4px solid var(--bg2);position:relative;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--accent)}
.timer-circle .timer-fill{position:absolute;top:-4px;left:-4px;width:calc(100% + 8px);height:calc(100% + 8px);border-radius:50%;border:4px solid var(--accent);clip-path:inset(0 0 0 0);transition:clip-path 1s linear}
.timer-label{font-size:12px;color:var(--ink-muted)}

/* ===== SOS Modal ===== */
.sos-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:24px}
.sos-modal.active{display:flex}
.sos-modal-content{background:var(--card-bg);border-radius:20px;padding:24px;max-width:380px;width:100%;max-height:80vh;overflow-y:auto;animation:modalIn .4s ease-out}
@keyframes modalIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.sos-breathing{width:100px;height:100px;margin:0 auto 16px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,107,.3),rgba(255,107,107,.05));border:3px solid rgba(255,107,107,.3);animation:breathe 4s ease-in-out infinite;display:flex;align-items:center;justify-content:center;font-size:13px;color:#FF6B6B;font-weight:600}
@keyframes breathe{0%,100%{transform:scale(.85);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.sos-modal-title{font-size:18px;font-weight:700;text-align:center;margin-bottom:12px}
.sos-modal-body{font-size:14px;line-height:1.7;color:var(--ink-muted)}
.sos-modal-body h4{color:var(--ink);margin:8px 0 4px;font-size:14px}
.sos-close{width:100%;padding:12px;margin-top:16px;border:none;border-radius:12px;background:var(--bg2);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s}
.sos-close:active{opacity:.7}

/* ===== Favorites Section ===== */
.fav-section{padding:0 16px 24px}
.fav-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.fav-empty{text-align:center;padding:24px;color:var(--ink-muted);font-size:13px}
.fav-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fav-chip{padding:10px;border-radius:12px;background:var(--card-bg);box-shadow:0 2px 6px var(--shadow);font-size:12px;font-weight:600;text-align:center;cursor:pointer;transition:transform .2s;border:1px solid var(--bg2)}
.fav-chip:active{transform:scale(.95)}
.fav-chip .fav-cat{font-size:10px;color:var(--ink-muted);margin-top:2px}

/* ===== Footer ===== */
.footer{padding:20px 16px 32px;text-align:center}
.footer-text{font-size:12px;color:var(--ink-muted);line-height:1.6}

/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:0;height:0}

/* ===== Responsive ===== */
@media(max-width:360px){
  .hero-title{font-size:22px}
  .cat-tab{padding:6px 10px;font-size:12px}
  .card-title{font-size:14px}
}
</style>
</head>
<body>
<div class="page-wrapper">
<div class="app" id="app">

  <!-- Top Bar -->
  <div class="top-bar">
    <button class="back-btn" onclick="window.location.href='../niujiu-demo-final.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span>返回</span>
    </button>
    <div class="top-title">情绪急救包</div>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDark()">🌙</button>
  </div>

  <!-- Hero -->
  <div class="hero">
    <div class="hero-title">情绪急救包</div>
    <div class="hero-sub">当你需要一点温暖和力量的时候，打开它</div>
    <div class="kit-box" id="kitBox">
      <div class="kit-lid"></div>
      <div class="kit-handle"></div>
      <div class="kit-body">
        <div class="kit-cross"></div>
        <div class="kit-items">
          <div class="kit-item"></div>
          <div class="kit-item"></div>
          <div class="kit-item"></div>
          <div class="kit-item"></div>
          <div class="kit-item"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- SOS Button -->
  <div class="sos-section">
    <button class="sos-btn" onclick="triggerSOS()">
      <span class="pulse-ring"></span>
      <span class="pulse-ring"></span>
      🚑 一键SOS · 随机急救
    </button>
  </div>

  <!-- Progress -->
  <div class="progress-section">
    <div class="progress-card">
      <div class="progress-text">已掌握 <strong id="progressNum">0</strong>/<span id="progressTotal">0</span> 种急救技巧</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- Category Tabs -->
  <div class="cat-tabs" id="catTabs">
    <button class="cat-tab active" data-cat="anxiety" style="--tab-color:var(--cat-anxiety)" onclick="switchCat('anxiety')">
      <span class="tab-emoji">🚨</span>焦虑急救
    </button>
    <button class="cat-tab" data-cat="anger" style="--tab-color:var(--cat-anger)" onclick="switchCat('anger')">
      <span class="tab-emoji">💢</span>愤怒管理
    </button>
    <button class="cat-tab" data-cat="lowmood" style="--tab-color:var(--cat-lowmood)" onclick="switchCat('lowmood')">
      <span class="tab-emoji">😢</span>情绪低落
    </button>
    <button class="cat-tab" data-cat="overwhelm" style="--tab-color:var(--cat-overwhelm)" onclick="switchCat('overwhelm')">
      <span class="tab-emoji">😰</span>压力过载
    </button>
    <button class="cat-tab" data-cat="insomnia" style="--tab-color:var(--cat-insomnia)" onclick="switchCat('insomnia')">
      <span class="tab-emoji">🌙</span>失眠夜话
    </button>
    <button class="cat-tab" data-cat="burnout" style="--tab-color:var(--cat-burnout)" onclick="switchCat('burnout')">
      <span class="tab-emoji">💼</span>职场崩溃
    </button>
  </div>

  <!-- Category Panels -->
  <div class="cat-content" id="catContent"></div>

  <!-- Favorites -->
  <div class="fav-section" id="favSection">
    <div class="fav-title">⭐ 我的收藏</div>
    <div id="favContent"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-text">你不是一个人在战斗 🫂<br>每一种情绪都值得被温柔对待</div>
  </div>

</div>
</div>

<!-- SOS Modal -->
<div class="sos-modal" id="sosModal">
  <div class="sos-modal-content">
    <div class="sos-breathing" id="sosBreathing">吸气...</div>
    <div class="sos-modal-title" id="sosTitle"></div>
    <div class="sos-modal-body" id="sosBody"></div>
    <button class="sos-close" onclick="closeSOS()">我知道了，谢谢你 💛</button>
  </div>
</div>

<script>
// ===== DATA =====
const TECHNIQUES = {
  anxiety: {
    name: '焦虑急救', color: '#FF6B6B', emoji: '🚨',
    techniques: [
      {
        id:'a1', title:'4-7-8呼吸法', time:'2分钟', diff:'简单', stars:5,
        desc:'经典的放松呼吸技巧，帮助快速平复焦虑情绪',
        tag:'呼吸练习', hasTimer:true, timerSec:120,
        steps:['闭上嘴巴，用鼻子吸气4秒','屏住呼吸保持7秒','用嘴缓缓呼气8秒，发出轻微的"呼"声','重复3-4个循环','感受身体逐渐放松的感觉'],
        encourage:'你做得很好！每一次呼吸都在告诉自己：一切都会好的。'
      },
      {
        id:'a2', title:'5-4-3-2-1接地法', time:'3分钟', diff:'简单', stars:5,
        desc:'用五感把注意力拉回当下，打断焦虑循环',
        tag:'注意力转移', hasTimer:false,
        steps:['环顾四周，说出5件你能看到的东西','触摸4件你能感觉到的东西','倾听3种你现在能听到的声音','闻2种你能闻到的气味','品尝1种味道（或想象一种喜欢的味道）'],
        encourage:'你已经在当下了。此刻的你，是安全的。'
      },
      {
        id:'a3', title:'身体扫描放松', time:'5分钟', diff:'中等', stars:4,
        desc:'从头到脚逐步放松身体每个部位',
        tag:'身体放松', hasTimer:true, timerSec:300,
        steps:['闭上眼睛，做3次深呼吸','注意力从头顶开始，感受那里的紧张','慢慢向下移动：额头、眼睛、下巴...','到肩膀、手臂、手指，逐一放松','继续到胸部、腹部、臀部、双腿、脚趾','全身放松后，享受这份平静30秒'],
        encourage:'你的身体一直在默默承受很多，现在让它好好休息一下吧。'
      },
      {
        id:'a4', title:'焦虑思维停站', time:'2分钟', diff:'中等', stars:4,
        desc:'给焦虑想法一个"停车牌"，学会暂停和观察',
        tag:'认知调整', hasTimer:false,
        steps:['注意到焦虑想法出现时，在心里说"停"','想象一个红色的停车牌','把这个想法写下来（或心里默念）','问自己：这个想法100%是真的吗？','用更平衡的想法替换它'],
        encourage:'想法只是想法，不是事实。你有能力选择相信什么。'
      },
      {
        id:'a5', title:'温水浸泡法', time:'3分钟', diff:'简单', stars:4,
        desc:'用温度变化激活副交感神经，快速缓解焦虑',
        tag:'物理方法', hasTimer:false,
        steps:['准备一碗温水（不烫手）','将双手浸入水中，感受温度','缓慢地做5次深呼吸','注意水温带来的温暖和安全感','擦干双手，感受手心的余温'],
        encourage:'温暖从手心传到心里，你已经比刚才好一点了。'

        steps:['下班前5分钟开始准备','整理桌面，关闭不必要的标签页','写下明天最重要的3件事','对自己说：今天的工作到此为止','关上电脑，站起来伸个懒腰','通勤路上听一首喜欢的歌，切换到"生活模式"'],
        encourage:'你的生活不只是工作。下班后的你，同样值得被好好对待。'
      }
    ]
  }
};

// ===== STATE =====
let favorites = JSON.parse(localStorage.getItem('firstaid_favorites') || '[]');
let usedList = JSON.parse(localStorage.getItem('firstaid_used') || '[]');
let currentCat = 'anxiety';
let activeTimer = null;

// ===== INIT =====
function init() {
  // Dark mode
  if (localStorage.getItem('darkMode') === 'true') {
    document.documentElement.classList.add('dark-mode');
    document.getElementById('darkToggle').textContent = '☀️';
  }
  // Kit animation
  setTimeout(() => document.getElementById('kitBox').classList.add('open'), 800);
  // Render categories
  renderCategories();
  // Update progress
  updateProgress();
  // Render favorites
  renderFavorites();
}

// ===== DARK MODE =====
function toggleDark() {
  const isDark = localStorage.getItem('darkMode') === 'true';
  localStorage.setItem('darkMode', !isDark);
  document.documentElement.classList.toggle('dark-mode', !isDark);
  document.getElementById('darkToggle').textContent = !isDark ? '☀️' : '🌙';
}

// ===== CATEGORIES =====
function switchCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.cat === cat);
    if (t.dataset.cat === cat) {
      t.style.background = TECHNIQUES[cat].color;
      t.style.borderColor = 'transparent';
    } else {
      t.style.background = '';
      t.style.borderColor = '';
    }
  });
  document.querySelectorAll('.cat-panel').forEach(p => {
    p.classList.toggle('active', p.dataset.cat === cat);
  });
}

function renderCategories() {
  const container = document.getElementById('catContent');
  let html = '';
  for (const [catKey, cat] of Object.entries(TECHNIQUES)) {
    html += `<div class="cat-panel ${catKey === currentCat ? 'active' : ''}" data-cat="${catKey}">`;
    cat.techniques.forEach(t => {
      const isFav = favorites.includes(t.id);
      const isUsed = usedList.includes(t.id);
      html += renderCard(t, cat, isFav, isUsed);
    });
    html += '</div>';
  }
  container.innerHTML = html;
  // Set initial active tab style
  switchCat('anxiety');
}

function renderCard(t, cat, isFav, isUsed) {
  const starsHtml = '⭐'.repeat(t.stars);
  const diffLabel = t.diff === '简单' ? '🟢简单' : t.diff === '中等' ? '🟡中等' : '🔴困难';
  return `
  <div class="tech-card" id="card-${t.id}">
    <div class="card-inner" id="inner-${t.id}" onclick="flipCard('${t.id}')">
      <div class="card-front">
        <div class="card-header">
          <div class="card-title">${t.title}</div>
          <div class="card-badges">
            <span class="badge badge-time">⏱ ${t.time}</span>
            <span class="badge badge-diff">${diffLabel}</span>
          </div>
        </div>
        <div class="card-stars">${starsHtml}</div>
        <div class="card-desc">${t.desc}</div>
        <span class="card-tag" style="background:${cat.color}22;color:${cat.color}">${t.tag}</span>
        <div class="card-actions" onclick="event.stopPropagation()">
          <button class="card-action-btn btn-start" onclick="flipCard('${t.id}')">查看步骤 →</button>
          <button class="card-action-btn btn-fav ${isFav?'faved':''}" onclick="toggleFav('${t.id}')">${isFav?'⭐已收藏':'☆收藏'}</button>
          <button class="card-action-btn btn-used ${isUsed?'used':''}" onclick="toggleUsed('${t.id}')">${isUsed?'✓已练习':'练习打卡'}</button>
        </div>
      </div>
      <div class="card-back">
        <div class="back-title">📋 操作步骤 <span class="flip-hint">（点击翻回）</span></div>
        <ol class="step-list">
          ${t.steps.map(s => `<li>${s}</li>`).join('')}
        </ol>
        <div class="back-encourage">💛 ${t.encourage}</div>
        ${t.hasTimer ? `
        <div class="back-timer-area">
          <button class="back-timer-btn" id="timerBtn-${t.id}" onclick="event.stopPropagation();toggleTimer('${t.id}',${t.timerSec})">⏱ 开始计时 (${formatTime(t.timerSec)})</button>
          <div class="timer-display" id="timerDisp-${t.id}">
            <div class="timer-circle"><span id="timerNum-${t.id}">${formatTime(t.timerSec)}</span></div>
            <div class="timer-label" id="timerLabel-${t.id}">计时中...</div>
          </div>
        </div>` : ''}
      </div>
    </div>
  </div>`;
}

// ===== CARD FLIP =====
function flipCard(id) {
  const inner = document.getElementById('inner-' + id);
  inner.classList.toggle('flipped');
}

// ===== FAVORITES =====
function toggleFav(id) {
  const idx = favorites.indexOf(id);
  if (idx > -1) {
    favorites.splice(idx, 1);
  } else {
    favorites.push(id);
  }
  localStorage.setItem('firstaid_favorites', JSON.stringify(favorites));
  renderCategories();
  switchCat(currentCat);
  renderFavorites();
}

function renderFavorites() {
  const container = document.getElementById('favContent');
  if (favorites.length === 0) {
    container.innerHTML = '<div class="fav-empty">还没有收藏任何技巧<br>点击卡片上的 ☆ 收藏喜欢的急救方法</div>';
    return;
  }
  let html = '<div class="fav-grid">';
  favorites.forEach(id => {
    for (const [catKey, cat] of Object.entries(TECHNIQUES)) {
      const t = cat.techniques.find(x => x.id === id);
      if (t) {
        html += `<div class="fav-chip" onclick="goToCard('${catKey}','${id}')">
          <div>${t.title}</div>
          <div class="fav-cat">${cat.emoji} ${cat.name}</div>
        </div>`;
        break;
      }
    }
  });
  html += '</div>';
  container.innerHTML = html;
}

function goToCard(catKey, id) {
  switchCat(catKey);
  setTimeout(() => {
    const card = document.getElementById('card-' + id);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.style.boxShadow = `0 0 0 3px ${TECHNIQUES[catKey].color}`;
      setTimeout(() => card.style.boxShadow = '', 2000);
    }
  }, 100);
}

// ===== USED TRACKING =====
function toggleUsed(id) {
  const idx = usedList.indexOf(id);
  if (idx > -1) {
    usedList.splice(idx, 1);
  } else {
    usedList.push(id);
  }
  localStorage.setItem('firstaid_used', JSON.stringify(usedList));
  renderCategories();
  switchCat(currentCat);
  updateProgress();
}

// ===== PROGRESS =====
function updateProgress() {
  let total = 0;
  for (const cat of Object.values(TECHNIQUES)) {
    total += cat.techniques.length;
  }
  const used = usedList.length;
  document.getElementById('progressNum').textContent = used;
  document.getElementById('progressTotal').textContent = total;
  document.getElementById('progressBar').style.width = (total > 0 ? (used / total * 100) : 0) + '%';
}

// ===== TIMER =====
function toggleTimer(id, totalSec) {
  const btn = document.getElementById('timerBtn-' + id);
  const disp = document.getElementById('timerDisp-' + id);
  const num = document.getElementById('timerNum-' + id);
  const label = document.getElementById('timerLabel-' + id);

  if (activeTimer && activeTimer.id === id) {
    clearInterval(activeTimer.interval);
    activeTimer = null;
    btn.textContent = `⏱ 继续计时 (${formatTime(activeTimer?.remaining || totalSec)})`;
    disp.classList.remove('active');
    return;
  }

  // Stop any existing timer
  if (activeTimer) {
    clearInterval(activeTimer.interval);
    const prevDisp = document.getElementById('timerDisp-' + activeTimer.id);
    if (prevDisp) prevDisp.classList.remove('active');
    const prevBtn = document.getElementById('timerBtn-' + activeTimer.id);
    if (prevBtn) prevBtn.textContent = `⏱ 开始计时`;
  }

  disp.classList.add('active');
  let remaining = totalSec;
  num.textContent = formatTime(remaining);
  label.textContent = '计时中...';

  const interval = setInterval(() => {
    remaining--;
    num.textContent = formatTime(remaining);
    if (remaining <= 0) {
      clearInterval(interval);
      activeTimer = null;
      label.textContent = '✅ 时间到！做得好！';
      btn.textContent = `⏱ 重新开始`;
      disp.classList.remove('active');
    }
  }, 1000);

  activeTimer = { id, interval, remaining };
  btn.textContent = '⏱ 暂停计时';
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m > 0 ? `${m}:${s.toString().padStart(2, '0')}` : `${s}s`;
}

// ===== SOS =====
function triggerSOS() {
  const allTechs = [];
  for (const [catKey, cat] of Object.entries(TECHNIQUES)) {
    cat.techniques.forEach(t => allTechs.push({ ...t, catKey, catName: cat.name, catEmoji: cat.emoji, catColor: cat.color }));
  }
  const random = allTechs[Math.floor(Math.random() * allTechs.length)];

  document.getElementById('sosTitle').textContent = `${random.catEmoji} ${random.title}`;
  let bodyHtml = `<p style="margin-bottom:8px;color:var(--cat-${random.catKey === 'lowmood' ? 'lowmood' : random.catKey === 'overwhelm' ? 'overwhelm' : random.catKey === 'burnout' ? 'burnout' : random.catKey})">${random.catEmoji} ${random.catName} · ${random.time} · ${random.diff}</p>`;
  bodyHtml += `<p style="margin-bottom:12px">${random.desc}</p>`;
  bodyHtml += '<h4>快速步骤：</h4>';
  random.steps.forEach((s, i) => {
    bodyHtml += `<p>${i + 1}. ${s}</p>`;
  });
  bodyHtml += `<div style="margin-top:12px;padding:10px;border-radius:10px;background:var(--bg2);font-size:13px;color:var(--ink-muted);text-align:center">💛 ${random.encourage}</div>`;
  document.getElementById('sosBody').innerHTML = bodyHtml;

  // Breathing animation text
  const breathEl = document.getElementById('sosBreathing');
  let breathIdx = 0;
  const breathTexts = ['吸气...', '屏住...', '呼气...', '放松...'];
  window._sosBreathInterval && clearInterval(window._sosBreathInterval);
  window._sosBreathInterval = setInterval(() => {
    breathIdx = (breathIdx + 1) % breathTexts.length;
    breathEl.textContent = breathTexts[breathIdx];
  }, 1000);

  document.getElementById('sosModal').classList.add('active');
}

function closeSOS() {
  document.getElementById('sosModal').classList.remove('active');
  window._sosBreathInterval && clearInterval(window._sosBreathInterval);
}

  '你已经很努力了，今天也辛苦了 🌟',

// Show random encouraging message at bottom

// ===== START =====
document.addEventListener('DOMContentLoaded', () => {
  init();
  showEncourage();
});

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>
