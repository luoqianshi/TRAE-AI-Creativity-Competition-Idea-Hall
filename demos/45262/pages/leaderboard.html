<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="牛马自救指南 - 牛马排行榜，5维度排行竞技">
<title>牛马排行榜 · 牛马自救指南</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

  :root {
    --paper: #FDF8F0;
    --paper-dark: #F5EDE0;
    --paper-line: #EDE5D8;
    --ink: #3D3229;
    --ink-light: #6B5E52;
    --ink-muted: #A89B8C;
    --accent: #D4834A;
    --accent-light: #E8A87C;
    --accent-soft: #F5D5C0;
    --warm: #C4A882;
    --card-bg: #FFFDF9;
    --shadow: rgba(61,50,41,0.06);
    --shadow-hover: rgba(61,50,41,0.10);
    --gold: #D4A03C;
    --gold-light: #F0D080;
    --gold-soft: #FAF0D4;
    --silver: #A8A8A8;
    --silver-light: #C8C8C8;
    --silver-soft: #E8E8E8;
    --bronze: #C4845C;
    --bronze-light: #D8A080;
    --bronze-soft: #F0D8C8;
    --green: #7BA68A;
    --green-light: #A8D4B0;
    --red: #D47B7B;
    --red-light: #F0A8A8;
    --blue: #7BAED4;
    --blue-light: #A8D0F0;
    --purple: #9B7BD4;
    --purple-light: #C0A8F0;
    --rank-bg: #FFF8F0;
    --rank-border: #F0E0D0;
    --self-bg: linear-gradient(135deg, #FFF5E8 0%, #FFECD8 100%);
    --self-border: #E8A87C;
  }

  /* Dark mode */
  html.dark-mode {
    --paper: #1E1D2B;
    --paper-dark: #171622;
    --paper-line: #2A2940;
    --ink: #E8E4DF;
    --ink-light: #B8B3AC;
    --ink-muted: #6E6B66;
    --accent: #E8954A;
    --accent-light: #F0A86C;
    --accent-soft: #3D2E1E;
    --warm: #8A7A62;
    --card-bg: #252438;
    --shadow: rgba(0,0,0,0.2);
    --shadow-hover: rgba(0,0,0,0.3);
    --gold: #E8B84C;
    --gold-light: #F0D080;
    --gold-soft: #3D3010;
    --silver: #B8B8B8;
    --silver-light: #C8C8C8;
    --silver-soft: #2A2A30;
    --bronze: #D4986C;
    --bronze-light: #E0B090;
    --bronze-soft: #3D2820;
    --green: #5B9A6E;
    --green-light: #7BC08A;
    --red: #D47B7B;
    --red-light: #F0A8A8;
    --blue: #6A8AA5;
    --blue-light: #8AB0D0;
    --purple: #8A7BA4;
    --purple-light: #A898C8;
    --rank-bg: #252438;
    --rank-border: #3A3850;
    --self-bg: linear-gradient(135deg, #3D2E1E 0%, #2A2018 100%);
    --self-border: #E8A87C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #E8E0D4;
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.3s, color 0.3s;
  }
  html.dark-mode body { background: #12111C; }

  .handwriting {
    font-family: 'ZCOOL KuaiLe', 'STKaiti', 'KaiTi', cursive;
  }

  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--paper);
    position: relative;
    overflow: hidden;
    transition: background 0.3s;
  }

  /* ===== Header ===== */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(180deg, var(--paper-dark) 0%, var(--paper) 100%);
    border-bottom: 1px solid var(--paper-line);
    padding: 12px 16px 8px;
    backdrop-filter: blur(12px);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .back-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--ink);
    font-size: 18px;
    transition: all 0.2s;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .back-btn:active { transform: scale(0.92); }

  .header-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    text-align: center;
    flex: 1;
  }

  .header-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 0 2px 8px rgba(212,131,74,0.3);
  }

  /* ===== Tabs ===== */
  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 20px;
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    color: var(--ink-muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    white-space: nowrap;
    position: relative;
    overflow: hidden;
  }
  .tab.active {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(212,131,74,0.3);
    transform: translateY(-1px);
  }
  .tab:active { transform: scale(0.95); }

  /* ===== Podium ===== */
  .podium {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 12px;
    padding: 24px 16px 16px;
    position: relative;
  }

  .podium-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    animation: podiumIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .podium-item:nth-child(1) { animation-delay: 0.1s; }
  .podium-item:nth-child(2) { animation-delay: 0s; }
  .podium-item:nth-child(3) { animation-delay: 0.2s; }

  @keyframes podiumIn {
    from { opacity: 0; transform: translateY(30px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .podium-avatar-wrap {
    position: relative;
    margin-bottom: 8px;
  }

  .podium-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    background: var(--card-bg);
    border: 3px solid var(--paper-line);
    box-shadow: 0 4px 16px var(--shadow);
    position: relative;
    z-index: 2;
    transition: transform 0.3s;
  }
  .podium-item:hover .podium-avatar { transform: scale(1.08); }

  .podium-item.rank-1 .podium-avatar {
    width: 80px;
    height: 80px;
    font-size: 40px;
    border-color: var(--gold);
    box-shadow: 0 0 20px rgba(212,160,60,0.3), 0 4px 16px var(--shadow);
    animation: goldPulse 2s ease-in-out infinite;
  }
  .podium-item.rank-2 .podium-avatar {
    border-color: var(--silver);
    box-shadow: 0 0 12px rgba(168,168,168,0.2), 0 4px 16px var(--shadow);
  }
  .podium-item.rank-3 .podium-avatar {
    border-color: var(--bronze);
    box-shadow: 0 0 12px rgba(196,132,92,0.2), 0 4px 16px var(--shadow);
  }

  @keyframes goldPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(212,160,60,0.3), 0 4px 16px var(--shadow); }
    50% { box-shadow: 0 0 32px rgba(212,160,60,0.5), 0 4px 16px var(--shadow); }
  }

  .crown {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    z-index: 3;
    animation: crownBounce 1.5s ease-in-out infinite;
    filter: drop-shadow(0 2px 4px rgba(212,160,60,0.4));
  }
  @keyframes crownBounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-4px); }
  }

  .medal {
    position: absolute;
    bottom: -4px;
    right: -4px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    z-index: 3;
    border: 2px solid var(--paper);
  }
  .medal.gold { background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%); }
  .medal.silver { background: linear-gradient(135deg, var(--silver) 0%, var(--silver-light) 100%); }
  .medal.bronze { background: linear-gradient(135deg, var(--bronze) 0%, var(--bronze-light) 100%); }

  .podium-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    max-width: 80px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
  }
  .podium-item.rank-1 .podium-name { font-size: 16px; font-weight: 700; }

  .podium-score {
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
    margin-top: 2px;
  }
  .podium-item.rank-1 .podium-score { font-size: 15px; }

  .podium-base {
    width: 80px;
    height: 8px;
    border-radius: 4px;
    margin-top: 8px;
    position: relative;
  }
  .podium-base::after {
    content: attr(data-rank);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 10px;
    font-weight: 700;
    color: #fff;
  }
  .podium-item.rank-1 .podium-base { width: 100px; height: 12px; background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 100%); }
  .podium-item.rank-2 .podium-base { background: linear-gradient(90deg, var(--silver) 0%, var(--silver-light) 100%); }
  .podium-item.rank-3 .podium-base { background: linear-gradient(90deg, var(--bronze) 0%, var(--bronze-light) 100%); }

  /* ===== List ===== */
  .list-container {
    padding: 0 16px 100px;
  }

  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 8px;
    font-size: 12px;
    color: var(--ink-muted);
    font-weight: 500;
    border-bottom: 1px solid var(--paper-line);
  }

  .rank-item {
    display: flex;
    align-items: center;
    padding: 12px 10px;
    margin-bottom: 8px;
    border-radius: 16px;
    background: var(--rank-bg);
    border: 1px solid var(--rank-border);
    transition: all 0.25s;
    animation: listIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    position: relative;
    overflow: hidden;
  }
  .rank-item::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
    transform: translateX(-100%);
    transition: transform 0.6s;
  }
  .rank-item:hover::before { transform: translateX(100%); }
  html.dark-mode .rank-item::before { background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.05) 50%, transparent 100%); }

  @keyframes listIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .rank-item.is-self {
    background: var(--self-bg);
    border-color: var(--self-border);
    box-shadow: 0 2px 12px rgba(212,131,74,0.15);
  }
  .rank-item.is-self::after {
    content: '我';
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 10px;
  }

  .rank-num {
    width: 32px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-muted);
    flex-shrink: 0;
  }
  .rank-num.top { color: var(--gold); }

  .rank-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: var(--card-bg);
    border: 2px solid var(--paper-line);
    margin: 0 10px;
    flex-shrink: 0;
  }

  .rank-info {
    flex: 1;
    min-width: 0;
  }
  .rank-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rank-meta {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 2px;
  }

  .rank-score-wrap {
    text-align: right;
    flex-shrink: 0;
    margin-right: 4px;
  }
  .rank-score {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .rank-change {
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 2px;
    margin-top: 2px;
  }
  .rank-change.up { color: var(--green); }
  .rank-change.down { color: var(--red); }
  .rank-change.same { color: var(--ink-muted); }

  /* ===== Self Bar ===== */
  .self-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    background: linear-gradient(180deg, transparent 0%, var(--paper) 20%);
    padding: 20px 16px 24px;
    z-index: 90;
  }
  .self-bar-inner {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    border-radius: 16px;
    background: var(--self-bg);
    border: 2px solid var(--self-border);
    box-shadow: 0 4px 20px rgba(212,131,74,0.2);
    animation: selfBarIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes selfBarIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Number Roll ===== */
  .num-roll {
    display: inline-block;
    animation: numPop 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes numPop {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ===== Shimmer ===== */
  .shimmer {
    position: relative;
    overflow: hidden;
  }
  .shimmer::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shimmer 3s infinite;
  }
  @keyframes shimmer {
    0% { left: -100%; }
    100% { left: 200%; }
  }

  /* ===== Empty State ===== */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-muted);
  }
  .empty-state .emoji { font-size: 48px; margin-bottom: 12px; display: block; }
  .empty-state p { font-size: 14px; }

  /* ===== Scrollbar ===== */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--paper-line); border-radius: 2px; }

  /* ===== Particle BG ===== */
  .particles {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.15;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 0.15; }
    90% { opacity: 0.15; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* ===== Loading ===== */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--ink-muted);
  }
  .loading-spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--paper-line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Responsive ===== */
  @media (max-width: 360px) {
    .podium-avatar { width: 56px; height: 56px; font-size: 28px; }
    .podium-item.rank-1 .podium-avatar { width: 72px; height: 72px; font-size: 36px; }
    .podium-name { font-size: 12px; max-width: 64px; }
    .tab { padding: 6px 12px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="particles" id="particles"></div>

  <div class="header">
    <div class="header-top">
      <a href="../niujiu-demo-final.html" class="back-btn">&#8592;</a>
      <div class="header-title handwriting">&#127942; 牛马排行榜</div>
      <div class="header-icon">&#128293;</div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>

  <div id="content">
    <div class="loading">
      <div class="loading-spinner"></div>
      <p>加载排行榜中...</p>
    </div>
  </div>

  <div class="self-bar" id="selfBar" style="display:none">
    <div class="self-bar-inner" id="selfBarInner"></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ===== Config =====
  const TABS = [
    { key: 'flips', label: '&#127922; 翻牌次数', unit: '次', icon: '&#127922;' },
    { key: 'streak', label: '&#128197; 连续签到', unit: '天', icon: '&#128197;' },
    { key: 'collection', label: '&#128218; 收藏卡片', unit: '张', icon: '&#128218;' },
    { key: 'points', label: '&#11088; 积分排行', unit: '分', icon: '&#11088;' },
    { key: 'posts', label: '&#128172; 发帖数量', unit: '帖', icon: '&#128172;' }
  ];

  const AVATAR_EMOJIS = [
    '&#128056;','&#128045;','&#128046;','&#128047;','&#128048;','&#128049;','&#128050;',
    '&#128053;','&#128054;','&#128055;','&#128057;','&#128058;','&#128059;','&#128060;',
    '&#128040;','&#128039;','&#128038;','&#128037;','&#128036;','&#128035;','&#128034;',
    '&#128031;','&#128030;','&#128029;','&#128028;','&#128027;','&#128024;','&#128023;',
    '&#128021;','&#128020;','&#128019;','&#128018;','&#128017;','&#128016;','&#128015;',
    '&#128014;','&#128013;','&#128012;','&#128011;','&#128010;','&#128009;','&#128008;',
    '&#128007;','&#128005;','&#128004;','&#128003;','&#128002;','&#128001;','&#128000;'
  ];

  const NICKNAME_PARTS = {
    prefix: ['打工','摸鱼','加班','熬夜','早起','晚睡','内卷','躺平','佛系','奋斗',
             '搬砖','划水','冲鸭','努力','摆烂','积极','emo','开心','疲惫','元气'],
    mid: ['小','大','老','阿','超级','终极','无敌','佛系','暴躁','温柔',
          '快乐','悲伤','愤怒','平静','疯狂','冷静','热情','冷漠','可爱','帅气'],
    suffix: ['牛马','打工人','社畜','码农','设计师','产品经理','运营','销售','HR',
             '财务','行政','客服','编辑','主播','博主','创业者','自由职业','实习生','主管','总监']
  };

  const RANK_TRENDS = {};

  // ===== Utils =====
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function randItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function generateNickname() {
    const p = randItem(NICKNAME_PARTS.prefix);
    const m = Math.random() > 0.5 ? randItem(NICKNAME_PARTS.mid) : '';
    const s = randItem(NICKNAME_PARTS.suffix);
    return p + m + s;
  }

  // ===== State =====
  let currentTab = 'flips';
  let allUsers = [];
  let currentUser = null;

  // ===== Dark Mode =====
  function initDarkMode() {
    const dark = localStorage.getItem('darkMode') === 'true';
    if (dark) document.documentElement.classList.add('dark-mode');
  }

  // ===== Read localStorage =====
  function readLocalData() {
    try {
      const raw = localStorage.getItem('niujiu_state_v3');
      if (!raw) return null;
      const data = JSON.parse(raw);
      return data;
    } catch (e) {
      console.warn('读取本地数据失败:', e);
      return null;
    }
  }

  // ===== Generate Mock Users =====
  function generateMockUsers(realUser) {
    const count = rand(20, 30);
    const users = [];

    if (realUser) {
      users.push({
        id: 'real',
        name: realUser.nickname || '我',
        avatar: realUser.avatar || '&#128118;',
        isReal: true,
        flips: realUser.totalFlips || rand(50, 200),
        streak: realUser.streak || rand(3, 30),
        collection: (realUser.collectedCards && realUser.collectedCards.length) || rand(5, 50),
        points: realUser.points || rand(500, 3000),
        posts: realUser.posts || rand(0, 20)
      });
    }

    for (let i = 0; i < count; i++) {
      const flips = rand(10, 500);
      const streak = rand(1, 60);
      const collection = rand(0, 80);
      const points = flips * rand(3, 8) + collection * rand(10, 30) + streak * rand(5, 15);
      const posts = rand(0, 50);
      users.push({
        id: 'mock_' + i,
        name: generateNickname(),
        avatar: AVATAR_EMOJIS[i % AVATAR_EMOJIS.length],
        isReal: false,
        flips, streak, collection, points, posts
      });
    }

    return users;
  }

  // ===== Compute Ranks =====
  function computeRanks(users, key) {
    const sorted = [...users].sort((a, b) => b[key] - a[key]);
    return sorted.map((u, i) => ({ ...u, rank: i + 1 }));
  }

  // ===== Trend =====
  function getTrend(userId, rank) {
    const key = userId + '_' + currentTab;
    const prev = RANK_TRENDS[key];
    let trend = 'same';
    let diff = 0;
    if (prev !== undefined) {
      diff = prev - rank;
      if (diff > 0) trend = 'up';
      else if (diff < 0) trend = 'down';
    }
    RANK_TRENDS[key] = rank;
    return { trend, diff: Math.abs(diff) };
  }

  // ===== Render Tabs =====
  function renderTabs() {
    const el = document.getElementById('tabs');
    el.innerHTML = TABS.map(t => `
      <div class="tab ${t.key === currentTab ? 'active' : ''}" data-key="${t.key}">
        ${t.label}
      </div>
    `).join('');

    el.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        currentTab = tab.dataset.key;
        renderTabs();
        renderContent();
      });
    });
  }

  // ===== Render Podium =====
  function renderPodium(top3, unit) {
    const order = [1, 0, 2];
    return `
      <div class="podium">
        ${order.map(idx => {
          const u = top3[idx];
          if (!u) return '';
          const rank = idx + 1;
          const medalClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : 'bronze';
          const medalNum = rank === 1 ? '1' : rank === 2 ? '2' : '3';
          return `
            <div class="podium-item rank-${rank}">
              <div class="podium-avatar-wrap">
                ${rank === 1 ? '<div class="crown">&#128081;</div>' : ''}
                <div class="podium-avatar">${u.avatar}</div>
                <div class="medal ${medalClass}">${medalNum}</div>
              </div>
              <div class="podium-name">${u.name}</div>
              <div class="podium-score num-roll">${u[currentTab].toLocaleString()}${unit}</div>
              <div class="podium-base" data-rank="${medalNum}"></div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  // ===== Render List =====
  function renderList(ranked, unit) {
    const rest = ranked.slice(3);
    if (rest.length === 0) return '';

    return `
      <div class="list-container">
        <div class="list-header">
          <span>排名</span>
          <span>用户</span>
          <span style="text-align:right">${unit}</span>
        </div>
        ${rest.map((u, i) => {
          const isSelf = u.isReal;
          const { trend, diff } = getTrend(u.id, u.rank);
          const trendHtml = trend === 'up'
            ? `<span class="rank-change up">&#9650; ${diff || ''}</span>`
            : trend === 'down'
            ? `<span class="rank-change down">&#9660; ${diff || ''}</span>`
            : `<span class="rank-change same">&#8211;</span>`;
          return `
            <div class="rank-item ${isSelf ? 'is-self' : ''}" style="animation-delay:${i * 0.04}s">
              <div class="rank-num ${u.rank <= 10 ? 'top' : ''}">${u.rank}</div>
              <div class="rank-avatar">${u.avatar}</div>
              <div class="rank-info">
                <div class="rank-name">${u.name}</div>
                <div class="rank-meta">${trendHtml}</div>
              </div>
              <div class="rank-score-wrap">
                <div class="rank-score num-roll">${u[currentTab].toLocaleString()}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  // ===== Render Self Bar =====
  function renderSelfBar(ranked, unit) {
    const self = ranked.find(u => u.isReal);
    const bar = document.getElementById('selfBar');
    const inner = document.getElementById('selfBarInner');
    if (!self) {
      bar.style.display = 'none';
      return;
    }
    bar.style.display = 'block';
    const { trend, diff } = getTrend(self.id, self.rank);
    const trendText = trend === 'up' ? `&#9650; 上升${diff}名` : trend === 'down' ? `&#9660; 下降${diff}名` : '&#8211; 排名不变';
    const trendColor = trend === 'up' ? 'var(--green)' : trend === 'down' ? 'var(--red)' : 'var(--ink-muted)';
    inner.innerHTML = `
      <div class="rank-num" style="color:var(--accent);font-size:18px">${self.rank}</div>
      <div class="rank-avatar" style="margin:0 10px">${self.avatar}</div>
      <div class="rank-info">
        <div class="rank-name">${self.name}</div>
        <div class="rank-meta" style="color:${trendColor}">${trendText}</div>
      </div>
      <div class="rank-score-wrap">
        <div class="rank-score">${self[currentTab].toLocaleString()}${unit}</div>
      </div>
    `;
  }

  // ===== Render Content =====
  function renderContent() {
    const tabInfo = TABS.find(t => t.key === currentTab);
    const ranked = computeRanks(allUsers, currentTab);
    const top3 = ranked.slice(0, 3);

    const content = document.getElementById('content');
    content.innerHTML = renderPodium(top3, tabInfo.unit) + renderList(ranked, tabInfo.unit);
    renderSelfBar(ranked, tabInfo.unit);
  }

  // ===== Particles =====
  function initParticles() {
    const container = document.getElementById('particles');
    const colors = ['#D4A03C', '#E8A87C', '#D4834A', '#C4A882', '#7BAED4'];
    for (let i = 0; i < 12; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = rand(4, 12);
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.background = colors[i % colors.length];
      p.style.left = rand(0, 100) + '%';
      p.style.animationDuration = (rand(8, 20)) + 's';
      p.style.animationDelay = (rand(0, 10)) + 's';
      container.appendChild(p);
    }
  }

  // ===== Init =====
  function init() {
    initDarkMode();
    initParticles();

    const localData = readLocalData();
    currentUser = localData || {};
    allUsers = generateMockUsers(currentUser);

    renderTabs();
    renderContent();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>
</body>
</html>
