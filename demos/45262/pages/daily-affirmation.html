    transition: transform 0.2s;

    justify-content: center;
    align-items: center;
    text-align: center;

    width: 200px;
    height: 200px;

    background: radial-gradient(circle, rgba(212,131,74,0.08) 0%, transparent 70%);

    pointer-events: none;

    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;

    line-height: 1.7;
    color: var(--ink);
    font-weight: 500;
    z-index: 1;

</style>
</head>

const CATEGORIES = ['全部', '自我接纳', '职场自信', '人际关系', '情绪管理', '成长进步'];
const GRADS = ['var(--grad-1)', 'var(--grad-2)', 'var(--grad-3)', 'var(--grad-4)', 'var(--grad-5)'];

// ===== State =====
let currentIdx = 0;
let currentCat = '全部';
let favorites = [];
let customAffs = [];
let filtered = [];

// ===== Init =====
function init() {
  loadTheme();
  loadData();
  setDailyAffirmation();
  renderCategories();
  renderFavorites();
  updateDate();
}

// ===== Theme =====
function toggleTheme() {
  document.documentElement.classList.toggle('dark-mode');
  localStorage.setItem('niujiu_aff_theme', document.documentElement.classList.contains('dark-mode') ? 'dark' : 'light');
}

function loadTheme() {
  const saved = localStorage.getItem('niujiu_aff_theme');
  if (saved === 'dark') document.documentElement.classList.add('dark-mode');
  else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.classList.add('dark-mode');
  }
}

// ===== Data =====
function loadData() {
  const savedFav = localStorage.getItem('niujiu_aff_favorites');
  if (savedFav) { try { favorites = JSON.parse(savedFav); } catch(e) {} }
  const savedCustom = localStorage.getItem('niujiu_aff_custom');
  if (savedCustom) { try { customAffs = JSON.parse(savedCustom); } catch(e) {} }
}

function saveData() {
  localStorage.setItem('niujiu_aff_favorites', JSON.stringify(favorites));
  localStorage.setItem('niujiu_aff_custom', JSON.stringify(customAffs));
}

// ===== Daily Affirmation =====
function setDailyAffirmation() {
  const date = new Date();
  const seed = date.getFullYear() * 10000 + (date.getMonth() + 1) * 100 + date.getDate();
  currentIdx = seed % AFFIRMATIONS.length;
  showAffirmation(currentIdx);
}

function showAffirmation(idx) {
  const aff = AFFIRMATIONS[idx];
  if (!aff) return;
  const textEl = document.getElementById('affText');
  textEl.classList.add('fade');
  setTimeout(() => {
    document.getElementById('affCategory').textContent = aff.cat;
    textEl.textContent = aff.text;
    textEl.classList.remove('fade');
    updateFavBtn();
    updateCardBg(aff.cat);
  }, 250);
}

function updateCardBg(cat) {
  const card = document.getElementById('mainCard');
  const map = { '自我接纳': 0, '职场自信': 1, '人际关系': 2, '情绪管理': 3, '成长进步': 4 };
  card.style.background = GRADS[map[cat] || 0];
}

function updateDate() {
  const d = new Date();
  const str = d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
  document.getElementById('affDate').textContent = str;
}

// ===== Random =====
function randomAffirmation() {
  let idx;
  if (currentCat === '全部') {
    idx = Math.floor(Math.random() * AFFIRMATIONS.length);
  } else {
    const list = AFFIRMATIONS.filter(a => a.cat === currentCat);
    idx = AFFIRMATIONS.indexOf(list[Math.floor(Math.random() * list.length)]);
  }
  currentIdx = idx;
  showAffirmation(idx);
}

// ===== Categories =====
function renderCategories() {
  const tabs = document.getElementById('categoryTabs');
  tabs.innerHTML = CATEGORIES.map(c => `
    <button class="category-tab ${c === currentCat ? 'active' : ''}" onclick="selectCategory('${c}')">${c}</button>
  `).join('');
}

function selectCategory(cat) {
  currentCat = cat;
  renderCategories();
  if (cat === '全部') {
    randomAffirmation();
  } else {
    const list = AFFIRMATIONS.filter(a => a.cat === cat);
    if (list.length > 0) {
      currentIdx = AFFIRMATIONS.indexOf(list[0]);
      showAffirmation(currentIdx);
    }
  }
}

// ===== Favorites =====
function toggleFavorite() {
  const aff = AFFIRMATIONS[currentIdx];
  if (!aff) return;
  const key = aff.text;
  const idx = favorites.findIndex(f => f.text === key);
  if (idx >= 0) {
    favorites.splice(idx, 1);
  } else {
    favorites.push({ text: aff.text, cat: aff.cat, time: Date.now() });
  }
  updateFavBtn();
  renderFavorites();
  saveData();
}

function updateFavBtn() {
  const aff = AFFIRMATIONS[currentIdx];
  if (!aff) return;
  const btn = document.getElementById('favBtn');
  const isFav = favorites.some(f => f.text === aff.text);
  btn.classList.toggle('active', isFav);
  btn.innerHTML = isFav ? '&#9829;' : '&#9825;';
}

function renderFavorites() {
  const list = document.getElementById('favList');
  const allFavs = [...favorites, ...customAffs.map(c => ({ text: c.text, cat: '自定义', time: c.time, custom: true, id: c.id }))];
  document.getElementById('favCount').textContent = allFavs.length;

  if (allFavs.length === 0) {
    list.innerHTML = '<div class="fav-empty">还没有收藏，点击心形按钮收藏喜欢的肯定语</div>';
    return;
  }

  list.innerHTML = allFavs.map((f, i) => `
    <div class="fav-item" onclick="showFavAff('${escapeJs(f.text)}')">
      <span class="fav-item-text">${escapeHtml(f.text)}</span>
      <span class="fav-item-cat">${f.cat}</span>
      <button class="fav-item-del" onclick="event.stopPropagation();removeFav(${f.custom ? f.id : i}, ${!!f.custom})">&#215;</button>
    </div>
  `).join('');
}

function showFavAff(text) {
  const idx = AFFIRMATIONS.findIndex(a => a.text === text);
  if (idx >= 0) {
    currentIdx = idx;
    showAffirmation(idx);
  } else {
    const custom = customAffs.find(c => c.text === text);
    if (custom) {
      document.getElementById('affCategory').textContent = '自定义';
      document.getElementById('affText').textContent = custom.text;
      updateFavBtn();
      updateCardBg('自我接纳');
    }
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function removeFav(idOrIdx, isCustom) {
  if (isCustom) {
    customAffs = customAffs.filter(c => c.id !== idOrIdx);
  } else {
    favorites.splice(idOrIdx, 1);
  }
  renderFavorites();
  updateFavBtn();
  saveData();
}

// ===== Custom =====
function addCustom() {
  const input = document.getElementById('customInput');
  const text = input.value.trim();
  if (!text) return;
  customAffs.push({ id: Date.now(), text, time: Date.now() });
  input.value = '';
  renderFavorites();
  saveData();
}

// ===== Share Card (Canvas) =====
function openShare() {
  const aff = AFFIRMATIONS[currentIdx];
  if (!aff) return;
  drawShareCard(aff.text, aff.cat);
  document.getElementById('shareModal').classList.add('active');
}

function closeShare() {
  document.getElementById('shareModal').classList.remove('active');
}

function drawShareCard(text, cat) {
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  const w = 300, h = 400;
  canvas.width = w * 2;
  canvas.height = h * 2;
  ctx.scale(2, 2);

  // Background gradient
  const gradMap = {
    '自我接纳': ['#FFF5EB', '#FFF0E0'],
    '职场自信': ['#F0F8F5', '#E8F4F0'],
    '人际关系': ['#F5F0FF', '#EDE8F8'],
    '情绪管理': ['#FFF0F5', '#F8E8F0'],
    '成长进步': ['#F0F5FF', '#E8F0F8']
  };
  const colors = gradMap[cat] || gradMap['自我接纳'];
  const bg = ctx.createLinearGradient(0, 0, w, h);
  bg.addColorStop(0, colors[0]);
  bg.addColorStop(1, colors[1]);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  // Decorative circles
  ctx.fillStyle = 'rgba(212,131,74,0.06)';
  ctx.beginPath();
  ctx.arc(250, 80, 60, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(40, 350, 50, 0, Math.PI * 2);
  ctx.fill();

  // Top line
  ctx.strokeStyle = '#D4834A';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(130, 60);
  ctx.lineTo(170, 60);
  ctx.stroke();

  // Category
  ctx.fillStyle = '#D4834A';
  ctx.font = '500 12px -apple-system, PingFang SC, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(cat.toUpperCase(), w/2, 90);

  // Quote text - word wrap
  ctx.fillStyle = '#2D2A24';
  ctx.font = '600 20px -apple-system, PingFang SC, sans-serif';
  ctx.textAlign = 'center';
  const lines = wrapText(ctx, text, 240);
  let y = 160;
  lines.forEach(line => {
    ctx.fillText(line, w/2, y);
    y += 32;
  });

  // Bottom decoration
  ctx.fillStyle = 'rgba(212,131,74,0.15)';
  ctx.font = '24px serif';
  ctx.fillText('"', w/2, h - 100);

  // Brand
  ctx.fillStyle = '#A89B8C';
  ctx.font = '12px -apple-system, PingFang SC, sans-serif';
  ctx.fillText('牛马自救指南 · 每日肯定语', w/2, h - 40);

  // Date
  const d = new Date();
  ctx.fillText(d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0'), w/2, h - 22);
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split('');
  const lines = [];
  let line = '';
  for (let i = 0; i < words.length; i++) {
    const test = line + words[i];
    const metrics = ctx.measureText(test);
    if (metrics.width > maxWidth && line !== '') {
      lines.push(line);
      line = words[i];
    } else {
      line = test;
    }
  }
  lines.push(line);
  return lines;
}

function downloadShare() {
  const canvas = document.getElementById('shareCanvas');
  const link = document.createElement('a');
  link.download = '肯定语_' + new Date().toISOString().slice(0,10) + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// ===== Utils =====
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function escapeJs(text) {
  return text.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
}

// ===== Init =====
init();

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>
