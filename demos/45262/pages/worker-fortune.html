<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="牛马自救指南 - 每日运势抽签，为打工人带来一天的好运气">
<title>打工人今日运势 · 牛马自救指南</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF8F0;
    --bg2: #FFE8D6;
    --ink: #3D2C2E;
    --accent: #E8916A;
    --ink-muted: #8B7B7B;
    --card-bg: #FFFFFF;
    --shadow: rgba(232, 145, 106, 0.3);
    --fortune-dai: linear-gradient(135deg, #FFD700, #FFA500);
    --fortune-chu: linear-gradient(135deg, #7BC67E, #4CAF50);
    --fortune-sho: linear-gradient(135deg, #64B5F6, #1E88E5);
    --fortune-sue: linear-gradient(135deg, #CE93D8, #7B1FA2);
    --fortune-kyo: linear-gradient(135deg, #EF9A9A, #E53935);
    --gold: #FFD700;
    --particle-color: rgba(232, 145, 106, 0.6);
  }

  html.dark-mode {
    --bg: #1A1A2E;
    --bg2: #16213E;
    --ink: #E8E0D6;
    --accent: #E8916A;
    --ink-muted: #9E9E9E;
    --card-bg: #252540;
    --shadow: rgba(232, 145, 106, 0.15);
    --particle-color: rgba(232, 145, 106, 0.4);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    transition: background 0.4s ease, color 0.4s ease;
    position: relative;
  }

  /* ===== Floating particles background ===== */
  .particles-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: var(--particle-color);
    border-radius: 50%;
    opacity: 0;
    animation: floatParticle linear infinite;
  }

  @keyframes floatParticle {
    0%   { transform: translateY(100vh) rotate(0deg) scale(0); opacity: 0; }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.5; }
    100% { transform: translateY(-10vh) rotate(720deg) scale(1); opacity: 0; }
  }

  /* ===== Star sparkles ===== */
  .sparkle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--gold);
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50%      { opacity: 0.8; transform: scale(1.3); }
  }

  /* ===== Page load animation ===== */
  .page-wrapper {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 16px 20px 40px;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: pageEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
  }

  @keyframes pageEnter {
    0%   { opacity: 0; transform: scale(0.92) translateY(20px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* ===== Top bar ===== */
  .top-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 4px 0;
  }

  .btn-back {
    width: 40px;
    height: 40px;
    border: none;
    background: var(--card-bg);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 12px var(--shadow);
    transition: transform 0.2s, box-shadow 0.2s;
    color: var(--ink);
    font-size: 20px;
  }
  .btn-back:active { transform: scale(0.9); }

  .btn-dark-toggle {
    width: 40px;
    height: 40px;
    border: none;
    background: var(--card-bg);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 12px var(--shadow);
    transition: transform 0.2s, box-shadow 0.2s;
    color: var(--ink);
    font-size: 20px;
  }
  .btn-dark-toggle:active { transform: scale(0.9); }

  /* ===== Header ===== */
  .header {
    text-align: center;
    margin: 10px 0 24px;
    position: relative;
  }

  .header-icon {
    font-size: 48px;
    display: block;
    margin-bottom: 8px;
    animation: bounceIcon 2s ease-in-out infinite;
  }

  @keyframes bounceIcon {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  .header h1 {
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }

  .header p {
    font-size: 14px;
    color: var(--ink-muted);
    margin-top: 6px;
    letter-spacing: 1px;
  }

  /* ===== Date display ===== */
  .date-display {
    font-size: 14px;
    color: var(--ink-muted);
    background: var(--card-bg);
    padding: 6px 20px;
    border-radius: 20px;
    box-shadow: 0 2px 8px var(--shadow);
    margin-bottom: 20px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  /* ===== Fortune Box (the 3D flip card) ===== */
  .fortune-container {
    perspective: 1200px;
    width: 240px;
    height: 280px;
    margin: 10px auto 24px;
    cursor: pointer;
    position: relative;
  }

  .fortune-box {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
    border-radius: 20px;
  }

  .fortune-box.flipped {
    transform: rotateY(180deg);
  }

  .fortune-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* Front face - the sealed box */
  .fortune-front {
    background: linear-gradient(145deg, var(--accent), #D4785A);
    box-shadow: 0 8px 32px var(--shadow);
    border: 3px solid rgba(255,255,255,0.2);
  }

  .fortune-front .box-icon {
    font-size: 64px;
    margin-bottom: 16px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
    animation: pulseBox 2s ease-in-out infinite;
  }

  @keyframes pulseBox {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2)); }
    50%      { transform: scale(1.05); filter: drop-shadow(0 8px 24px rgba(0,0,0,0.3)); }
  }

  .fortune-front .box-label {
    color: #FFF;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 3px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
  }

  .fortune-front .box-sub {
    color: rgba(255,255,255,0.8);
    font-size: 13px;
    margin-top: 8px;
    letter-spacing: 2px;
  }

  .fortune-front .tap-hint {
    position: absolute;
    bottom: 20px;
    color: rgba(255,255,255,0.7);
    font-size: 12px;
    animation: hintPulse 1.5s ease-in-out infinite;
  }

  @keyframes hintPulse {
    0%, 100% { opacity: 0.4; transform: translateY(0); }
    50%      { opacity: 1; transform: translateY(-4px); }
  }

  /* Ribbon seal on front */
  .ribbon-seal {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 40px;
    height: 40px;
    background: var(--gold);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    animation: sealShine 2s ease-in-out infinite;
  }

  @keyframes sealShine {
    0%, 100% { filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)) brightness(1); }
    50%      { filter: drop-shadow(0 2px 8px rgba(255,215,0,0.6)) brightness(1.2); }
  }

  /* Back face - the fortune reveal */
  .fortune-back {
    background: var(--card-bg);
    transform: rotateY(180deg);
    box-shadow: 0 8px 32px var(--shadow);
    border: 2px solid rgba(232, 145, 106, 0.2);
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  /* Fortune level badge */
  .fortune-level {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 4px;
    margin-bottom: 4px;
    position: relative;
    z-index: 1;
  }

  .fortune-level .level-emoji {
    font-size: 28px;
    vertical-align: middle;
    margin-right: 4px;
  }

  .fortune-level-badge {
    display: inline-block;
    padding: 4px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    color: #FFF;
    margin-bottom: 10px;
  }

  .fortune-prediction {
    font-size: 15px;
    line-height: 1.6;
    text-align: center;
    color: var(--ink);
    margin: 8px 0;
    padding: 0 4px;
    position: relative;
    z-index: 1;
  }

  .fortune-lucky {
    font-size: 13px;
    color: var(--ink-muted);
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .fortune-lucky .lucky-emoji {
    font-size: 28px;
    line-height: 1;
  }

  /* Decorative sparkles on back face */
  .back-sparkles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .back-sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    opacity: 0;
    animation: backSparkleAnim 2s ease-in-out infinite;
  }

  @keyframes backSparkleAnim {
    0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
    50%      { opacity: 1; transform: scale(1) rotate(180deg); }
  }

  /* Ribbon effect on back */
  .ribbon-deco {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 6px;
    border-radius: 20px 20px 0 0;
  }

  /* ===== After-reveal actions ===== */
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s ease 0.6s, transform 0.5s ease 0.6s;
  }

  .actions.show {
    opacity: 1;
    transform: translateY(0);
  }

  .btn-action {
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #FFF;
  }

  .btn-action:active { transform: scale(0.92); }

  .btn-share {
    background: linear-gradient(135deg, var(--accent), #D4785A);
    box-shadow: 0 4px 16px rgba(232, 145, 106, 0.4);
  }

  .btn-redraw {
    background: var(--card-bg);
    color: var(--ink);
    box-shadow: 0 2px 8px var(--shadow);
    border: 1px solid rgba(232, 145, 106, 0.2);
  }

  /* ===== Already drawn today state ===== */
  .already-drawn {
    text-align: center;
    padding: 20px;
  }

  .already-drawn .today-result {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 4px 20px var(--shadow);
    margin-top: 16px;
    position: relative;
    overflow: hidden;
  }

  .already-drawn .label-today {
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }

  /* ===== Toast notification ===== */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--card-bg);
    color: var(--ink);
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    z-index: 100;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    border: 1px solid rgba(232, 145, 106, 0.2);
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== Sound wave effect ===== */
  .sound-wave {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 50;
  }

  .sound-wave.active {
    display: block;
    animation: soundRing 0.6s ease-out forwards;
  }

  .sound-ring {
    width: 80px;
    height: 80px;
    border: 3px solid var(--accent);
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .sound-ring:nth-child(2) { animation-delay: 0.1s; }
  .sound-ring:nth-child(3) { animation-delay: 0.2s; }

  @keyframes soundRing {
    0%   { width: 40px; height: 40px; opacity: 0.8; border-width: 4px; }
    100% { width: 200px; height: 200px; opacity: 0; border-width: 1px; }
  }

  /* ===== Responsive ===== */
  @media (max-width: 480px) {
    .page-wrapper { padding: 12px 16px 30px; }
    .header h1 { font-size: 22px; }
    .fortune-container { width: 200px; height: 250px; }
    .fortune-level { font-size: 36px; }
    .fortune-prediction { font-size: 14px; }
    .btn-action { padding: 8px 16px; font-size: 13px; }
  }

  @media (min-width: 481px) {
    .page-wrapper { padding: 24px 20px 40px; }
  }

  /* ===== Confetti burst on reveal ===== */
  .confetti-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    overflow: hidden;
  }

  .confetti-piece {
    position: absolute;
    width: 8px;
    height: 8px;
    top: 50%;
    left: 50%;
    opacity: 0;
    animation: confettiBurst 1.2s ease-out forwards;
  }

  @keyframes confettiBurst {
    0%   { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) rotate(720deg) scale(0); }
  }

  /* ===== Today's result card styles ===== */
  .result-card {
    padding: 20px;
  }
  .result-card .fc-level {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .result-card .fc-prediction {
    font-size: 15px;
    line-height: 1.6;
    margin: 10px 0;
  }
  .result-card .fc-lucky {
    font-size: 14px;
    color: var(--ink-muted);
    margin-top: 6px;
  }
  .result-card .fc-lucky span { font-size: 28px; }

  /* ===== Loading shimmer ===== */
  @keyframes shimmer {
    0%   { background-position: -200px 0; }
    100% { background-position: 200px 0; }
  }
</style>
</head>
<body>

<!-- Particles Background -->
<div class="particles-bg" id="particlesBg"></div>

<!-- Sound wave effect -->
<div class="sound-wave" id="soundWave">
  <div class="sound-ring"></div>
  <div class="sound-ring"></div>
  <div class="sound-ring"></div>
</div>

<!-- Confetti container -->
<div class="confetti-container" id="confettiContainer"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Page -->
<div class="page-wrapper" id="pageWrapper">

  <!-- Top bar -->
  <div class="top-bar">
    <button class="btn-back" id="btnBack" onclick="goBack()" aria-label="返回">&#x2190;</button>
    <button class="btn-dark-toggle" id="btnDark" onclick="toggleDark()" aria-label="切换深色模式">
      <span id="darkIcon">&#x2601;</span>
    </button>
  </div>

  <!-- Header -->
  <div class="header">
    <span class="header-icon">&#x1F3B2;</span>
    <h1>打工人今日运势</h1>
    <p>点击福箱，开启今日打工运势</p>
  </div>

  <!-- Date -->
  <div class="date-display" id="dateDisplay">
    <span>&#x1F4C5;</span>
    <span id="dateText"></span>
  </div>

  <!-- Fortune Box -->
  <div class="fortune-container" id="fortuneContainer" onclick="drawFortune()">
    <div class="fortune-box" id="fortuneBox">
      <!-- Front -->
      <div class="fortune-face fortune-front" id="fortuneFront">
        <div class="ribbon-seal"></div>
        <div class="box-icon">&#x1F9F3;</div>
        <div class="box-label">今日运势</div>
        <div class="box-sub">轻触开启</div>
        <div class="tap-hint">&#x1F447; 戳我抽签</div>
      </div>
      <!-- Back -->
      <div class="fortune-face fortune-back" id="fortuneBack">
        <div class="ribbon-deco" id="ribbonDeco"></div>
        <div class="back-sparkles" id="backSparkles"></div>
        <div class="fortune-level" id="fortuneLevel"></div>
        <div class="fortune-level-badge" id="fortuneBadge"></div>
        <div class="fortune-prediction" id="fortunePrediction"></div>
        <div class="fortune-lucky" id="fortuneLucky"></div>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions" id="actions">
    <button class="btn-action btn-share" onclick="shareFortune()">&#x1F4E4; 分享运势</button>
    <button class="btn-action btn-redraw" onclick="resetPage()">&#x1F504; 重来</button>
  </div>

  <!-- Already drawn today -->
  <div class="already-drawn" id="alreadyDrawn" style="display:none;">
    <div class="label-today">&#x1F3C6; 今日运势已揭晓</div>
    <div class="today-result" id="todayResult"></div>
    <div style="margin-top:16px;">
      <button class="btn-action btn-share" onclick="shareFortune()">&#x1F4E4; 分享运势</button>
    </div>
  </div>

</div>

<script>
  // ============================================================
  // FORTUNE DATA - 25 unique entries
  // ============================================================
  const FORTUNES = [

      '今天可能有点水逆，但问题不大！',

    ], lucky: ['&#x1F4A6;', '&#x1F9F0;', '&#x1F98B;', '&#x2721;&#xFE0F;', '&#x1F30A;'] },
    // -- 凶 (Bad Luck) --
    { level: '凶', emoji: '&#x26A1;', color: '#E53935', bg: 'linear-gradient(135deg, #FFEBEE, #EF9A9A)', badge: '凶', predictions: [
      '小心老板今天心情不好…但也就一天！',
      '可能被 @ 了一下，但问题不大！',
      '电脑今天更新系统，摸鱼时间被迫增加！',
      '快递配送延迟，但它明天一定会到！',
      '同事请假了，今天活多了一丢丢…加油打工人！'
    ], lucky: ['&#x1F4AA;', '&#x1F525;', '&#x1F6A8;', '&#x1F3AF;', '&#x1F3C3;'] }
  ];

  // ============================================================
  // STATE
  // ============================================================
  let currentFortune = null;
  let hasDrawnToday = false;
  let isFlipping = false;

  // ============================================================
  // INIT
  // ============================================================
  document.addEventListener('DOMContentLoaded', () => {
    initDarkMode();
    initParticles();
    initSparkles();
    initDate();
    checkTodayFortune();
  });

  // ============================================================
  // DARK MODE
  // ============================================================
  function initDarkMode() {
    const saved = localStorage.getItem('darkMode');
    if (saved === 'true' || (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark-mode');
      document.getElementById('darkIcon').innerHTML = '&#x2600;&#xFE0F;';
    } else {
      document.getElementById('darkIcon').innerHTML = '&#x1F31A;';
    }
  }

  function toggleDark() {
    const html = document.documentElement;
    const isDark = html.classList.contains('dark-mode');
    if (isDark) {
      html.classList.remove('dark-mode');
      localStorage.setItem('darkMode', 'false');
      document.getElementById('darkIcon').innerHTML = '&#x1F31A;';
    } else {
      html.classList.add('dark-mode');
      localStorage.setItem('darkMode', 'true');
      document.getElementById('darkIcon').innerHTML = '&#x2600;&#xFE0F;';
    }
  }

  // ============================================================
  // DATE
  // ============================================================
  function initDate() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    const wd = weekdays[now.getDay()];
    document.getElementById('dateText').textContent = `${y}年${m}月${d}日 星期${wd}`;
  }

  function getTodayKey() {
    const now = new Date();
    return `worker_fortune_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  }

  // ============================================================
  // PARTICLES & SPARKLES
  // ============================================================
  function initParticles() {
    const container = document.getElementById('particlesBg');
    const count = 15;
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'particle';
      el.style.left = Math.random() * 100 + '%';
      el.style.width = (4 + Math.random() * 6) + 'px';
      el.style.height = el.style.width;
      el.style.animationDuration = (12 + Math.random() * 18) + 's';
      el.style.animationDelay = (Math.random() * 20) + 's';
      container.appendChild(el);
    }
  }

  function initSparkles() {
    const count = 12;
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.style.left = Math.random() * 100 + '%';
      el.style.top = Math.random() * 100 + '%';
      el.style.animationDelay = (Math.random() * 5) + 's';
      el.style.animation = `twinkle ${2 + Math.random() * 3}s ease-in-out infinite`;
      el.style.animationDelay = (Math.random() * 5) + 's';
      document.body.appendChild(el);
    }
  }

  // ============================================================
  // CHECK TODAY
  // ============================================================
  function checkTodayFortune() {
    const key = getTodayKey();
    const saved = localStorage.getItem(key);
    if (saved) {
      try {
        const data = JSON.parse(saved);
        currentFortune = data;
        hasDrawnToday = true;
        showTodayResult(data);
      } catch (e) {
        localStorage.removeItem(key);
      }
    }
  }

  // ============================================================
  // DRAW FORTUNE
  // ============================================================
  function drawFortune() {
    if (hasDrawnToday) {
      showToast('&#x1F514; 今日运势已经揭晓啦，明天再来吧！');
      return;
    }
    if (isFlipping) return;
    isFlipping = true;

    // Pick random fortune
    const catIdx = Math.floor(Math.random() * FORTUNES.length);
    const cat = FORTUNES[catIdx];
    const predIdx = Math.floor(Math.random() * cat.predictions.length);
    const luckyIdx = Math.floor(Math.random() * cat.lucky.length);

    currentFortune = {
      level: cat.level,
      emoji: cat.emoji,
      color: cat.color,
      bg: cat.bg,
      badge: cat.badge,
      prediction: cat.predictions[predIdx],
      lucky: cat.lucky[luckyIdx]
    };

    // Save to localStorage
    const key = getTodayKey();
    localStorage.setItem(key, JSON.stringify(currentFortune));
    hasDrawnToday = true;

    // Sound effect
    triggerSound();

    // Confetti burst
    triggerConfetti(cat.color);

    // Flip
    const box = document.getElementById('fortuneBox');
    box.classList.add('flipped');

    // After flip, populate content
    setTimeout(() => {
      populateFortuneBack(currentFortune);
      document.getElementById('actions').classList.add('show');
      isFlipping = false;
    }, 500);
  }

  // ============================================================
  // POPULATE BACK FACE
  // ============================================================
  function populateFortuneBack(f) {
    const levelEl = document.getElementById('fortuneLevel');
    const badgeEl = document.getElementById('fortuneBadge');
    const predEl = document.getElementById('fortunePrediction');
    const luckyEl = document.getElementById('fortuneLucky');
    const ribbon = document.getElementById('ribbonDeco');
    const sparkleContainer = document.getElementById('backSparkles');

    levelEl.innerHTML = `${f.emoji} ${f.level}`;
    levelEl.style.color = f.color;

    badgeEl.textContent = f.badge;
    badgeEl.style.background = f.color;

    predEl.textContent = f.prediction;

    luckyEl.innerHTML = `&#x1F9E1; 幸运物：<span class="lucky-emoji">${f.lucky}</span>`;

    ribbon.style.background = f.color;

    // Back sparkles
    sparkleContainer.innerHTML = '';
    for (let i = 0; i < 8; i++) {
      const s = document.createElement('div');
      s.className = 'back-sparkle';
      s.style.left = (10 + Math.random() * 80) + '%';
      s.style.top = (10 + Math.random() * 80) + '%';
      s.style.background = f.color;
      s.style.animationDelay = (Math.random() * 2) + 's';
      s.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
      sparkleContainer.appendChild(s);
    }
  }

  // ============================================================
  // SHOW TODAY RESULT (already drawn)
  // ============================================================
  function showTodayResult(f) {
    document.getElementById('fortuneContainer').style.display = 'none';
    document.getElementById('actions').style.display = 'none';
    const container = document.getElementById('alreadyDrawn');
    container.style.display = 'block';

    const result = document.getElementById('todayResult');
    result.innerHTML = `
      <div class="result-card" style="text-align:center;">
        <div style="width:100%;height:6px;background:${f.color};border-radius:20px 20px 0 0;position:absolute;top:0;left:0;"></div>
        <div class="fc-level" style="color:${f.color};">${f.emoji} ${f.level}</div>
        <div style="display:inline-block;padding:3px 14px;border-radius:12px;background:${f.color};color:#FFF;font-size:13px;font-weight:600;margin-bottom:10px;">${f.badge}</div>
        <div class="fc-prediction">${f.prediction}</div>
        <div class="fc-lucky">&#x1F9E1; 幸运物：<span>${f.lucky}</span></div>
      </div>
    `;

    // Set current fortune for share
    currentFortune = f;

    // Trigger confetti for saved fortune too
    triggerConfetti(f.color);

    // Reinit back sparkles inside result card animation
    setTimeout(() => container.querySelector('.result-card').style.display = 'block', 100);
  }

  // ============================================================
  // SHARE
  // ============================================================
  function shareFortune() {
    if (!currentFortune) return;
    const text = `【打工人今日运势】${currentFortune.level} ${currentFortune.emoji}\n` +
                 `运势：${currentFortune.badge}\n` +
                 `今日预言：${currentFortune.prediction}\n` +
                 `幸运物：${currentFortune.lucky}\n` +
                 `—— 来自「牛马自救指南」`;

    if (navigator.share) {
      navigator.share({ title: '打工人今日运势', text: text }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('&#x2705; 运势已复制，快去分享给朋友吧！');
      }).catch(() => {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast('&#x2705; 运势已复制，快去分享给朋友吧！');
    } catch (e) {
      showToast('&#x274C; 复制失败，请手动截图分享~');
    }
    document.body.removeChild(ta);
  }

  // ============================================================
  // TOAST
  // ============================================================
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.innerHTML = msg;
    el.classList.add('show');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove('show'), 2500);
  }

  // ============================================================
  // SOUND EFFECT (CSS Animation)
  // ============================================================
  function triggerSound() {
    const sw = document.getElementById('soundWave');
    sw.classList.remove('active');
    // Force reflow
    void sw.offsetWidth;
    sw.classList.add('active');
    setTimeout(() => sw.classList.remove('active'), 800);
  }

  // ============================================================
  // CONFETTI
  // ============================================================
  function triggerConfetti(color) {
    const container = document.getElementById('confettiContainer');
    container.innerHTML = '';
    const colors = [color, '#FFD700', '#FF6B6B', '#4FC3F7', '#81C784', '#FFB74D', '#CE93D8'];
    const count = 30;
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      const angle = Math.random() * 360;
      const dist = 100 + Math.random() * 200;
      const tx = Math.cos(angle * Math.PI / 180) * dist;
      const ty = Math.sin(angle * Math.PI / 180) * dist - 50;
      piece.style.setProperty('--tx', tx + 'px');
      piece.style.setProperty('--ty', ty + 'px');
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      piece.style.width = (4 + Math.random() * 8) + 'px';
      piece.style.height = (4 + Math.random() * 8) + 'px';
      piece.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
      piece.style.animationDelay = (Math.random() * 0.3) + 's';
      container.appendChild(piece);
    }
    setTimeout(() => { container.innerHTML = ''; }, 2000);
  }

  // ============================================================
  // BACK / RESET
  // ============================================================
  function goBack() {
    window.location.href = '../niujiu-demo-final.html';
  }

  function resetPage() {
    if (hasDrawnToday) return;
    // Reset flip without refreshing the fortune (can only draw once)
    const box = document.getElementById('fortuneBox');
    box.classList.remove('flipped');
    document.getElementById('actions').classList.remove('show');
    isFlipping = false;
  }

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>

</body>
</html>
