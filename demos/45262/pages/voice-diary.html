<!--
  牛马自救指南 · 语音日记
  参照快手直播连麦倾诉、小红书语音笔记
  单文件、零外部依赖、全功能可交互
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>牛马自救指南 · 语音日记</title>
<meta name="description" content="用声音记录每一天的心情，语音转文字，情绪自动分析，打工人专属语音日记本。">
<meta name="theme-color" content="#D4834A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FDF8F0;
    --paper-dark: #F5EDE0;
    --paper-line: #EDE5D8;
    --ink: #3D3229;
    --ink-light: #6B5E52;
    --ink-muted: #A89B8C;
    --accent: #D4834A;
    --accent-light: #E8A87C;
    --accent-soft: #F5D5C0;
    --warm: #C4A882;
    --card-bg: #FFFDF9;
    --shadow: rgba(61,50,41,0.06);
    --shadow-hover: rgba(61,50,41,0.10);
    --blue: #7BAED4;
    --blue-light: #A8D0F0;
    --blue-soft: #D4EAFA;
    --green: #7BA68A;
    --green-light: #A8D4B0;
    --green-soft: #D4EAD8;
    --pink: #D48BA0;
    --pink-light: #F0B0C4;
    --pink-soft: #FAD4DE;
    --yellow: #D4C47B;
    --yellow-light: #F0E4A8;
    --yellow-soft: #FAF0D4;
    --red: #D47B7B;
    --red-light: #F0A8A8;
    --red-soft: #FAD4D4;
    --purple: #9B7BD4;
    --purple-light: #C0A8F0;
    --purple-soft: #E0D4FA;
    --gray: #A89B8C;
    --gray-light: #C8BEB2;
    --gray-soft: #E8E2DA;
    --radius-sm: 6px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --radius-full: 50%;
    --shadow-sm: 0 2px 8px rgba(61,50,41,0.06);
    --shadow-md: 0 4px 16px rgba(61,50,41,0.10);
    --shadow-lg: 0 4px 20px rgba(212,131,74,0.35);
  }

  html.dark-mode {
    --paper: #1A1A2E;
    --paper-dark: #16213E;
    --paper-line: #2A2A4A;
    --ink: #E8E6E3;
    --ink-light: #B8B5B0;
    --ink-muted: #7A7670;
    --card-bg: #222244;
    --shadow: rgba(0,0,0,0.2);
    --shadow-hover: rgba(0,0,0,0.3);
    --accent: #E8A060;
    --accent-light: #F0B880;
    --accent-soft: #3D2E20;
    --warm: #C4A882;
    --blue: #6B9EC4; --blue-light: #8BB8D8; --blue-soft: #B8D4EA;
    --green: #6B9A7A; --green-light: #8BB898; --green-soft: #B8D4C0;
    --pink: #B87A90; --pink-light: #D898A8; --pink-soft: #E8B8C8;
    --yellow: #B8A86B; --yellow-light: #D8C888; --yellow-soft: #E8D8A8;
    --red: #B86B6B; --red-light: #D89898; --red-soft: #E8B8B8;
    --purple: #8B6BC4; --purple-light: #A888D8; --purple-soft: #C8B8E8;
    --gray: #8B8078; --gray-light: #A89888; --gray-soft: #C8C0B8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.light-mode) {
      --paper: #1A1A2E;
      --paper-dark: #16213E;
      --paper-line: #2A2A4A;
      --ink: #E8E6E3;
      --ink-light: #B8B5B0;
      --ink-muted: #7A7670;
      --card-bg: #222244;
      --shadow: rgba(0,0,0,0.2);
      --shadow-hover: rgba(0,0,0,0.3);
      --accent: #E8A060;
      --accent-light: #F0B880;
      --accent-soft: #3D2E20;
      --warm: #C4A882;
      --blue: #6B9EC4; --blue-light: #8BB8D8; --blue-soft: #B8D4EA;
      --green: #6B9A7A; --green-light: #8BB898; --green-soft: #B8D4C0;
      --pink: #B87A90; --pink-light: #D898A8; --pink-soft: #E8B8C8;
      --yellow: #B8A86B; --yellow-light: #D8C888; --yellow-soft: #E8D8A8;
      --red: #B86B6B; --red-light: #D89898; --red-soft: #E8B8B8;
      --purple: #8B6BC4; --purple-light: #A888D8; --purple-soft: #C8B8E8;
      --gray: #8B8078; --gray-light: #A89888; --gray-soft: #C8C0B8;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { transition: background-color 0.3s ease, color 0.3s ease; }
  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--paper-dark);
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .handwriting { font-family: 'ZCOOL KuaiLe', 'STKaiti', 'KaiTi', cursive; }

  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--paper);
    position: relative;
    overflow: hidden;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--paper);
    border-bottom: 1px solid var(--paper-line);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .back-btn {
    width: 36px; height: 36px;
    border-radius: var(--radius-full);
    border: 1px solid var(--paper-line);
    background: var(--card-bg);
    color: var(--ink);
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .back-btn:active { transform: scale(0.92); }
  .header-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    color: var(--ink);
  }
  .theme-btn {
    width: 36px; height: 36px;
    border-radius: var(--radius-full);
    border: 1px solid var(--paper-line);
    background: var(--card-bg);
    color: var(--ink);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* Tabs */
  .tabs {
    display: flex;
    padding: 0 16px;
    border-bottom: 1px solid var(--paper-line);
    background: var(--paper);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 12px 0;
    font-size: 14px;
    color: var(--ink-muted);
    cursor: pointer;
    position: relative;
    transition: color 0.2s;
    font-weight: 500;
  }
  .tab.active { color: var(--accent); font-weight: 700; }
  .tab.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 24px; height: 3px;
    background: var(--accent);
    border-radius: 2px;
  }

  /* Page content */
  .page { display: none; padding: 16px; padding-bottom: 100px; min-height: calc(100vh - 110px); }
  .page.active { display: block; animation: pageIn 0.3s ease; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== RECORD PAGE ===== */
  .record-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 0 16px;
  }
  .record-hint {
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 20px;
    text-align: center;
  }
  .record-btn-wrap {
    position: relative;
    width: 140px; height: 140px;
    display: flex; align-items: center; justify-content: center;
  }
  .record-btn {
    width: 100px; height: 100px;
    border-radius: var(--radius-full);
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    transition: all 0.2s;
    position: relative;
    z-index: 2;
  }
  .record-btn:active { transform: scale(0.95); }
  .record-btn.recording {
    background: var(--red);
    animation: recordPulse 1.2s infinite;
  }
  @keyframes recordPulse {
    0% { box-shadow: 0 0 0 0 rgba(212,123,123,0.5); }
    70% { box-shadow: 0 0 0 20px rgba(212,123,123,0); }
    100% { box-shadow: 0 0 0 0 rgba(212,123,123,0); }
  }
  .record-ring {
    position: absolute;
    width: 140px; height: 140px;
    border-radius: var(--radius-full);
    border: 2px solid var(--accent-soft);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .recording + .record-ring { opacity: 1; animation: ringExpand 1.5s infinite; }
  @keyframes ringExpand {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.4); opacity: 0; }
  }

  /* Wave visualization */
  .wave-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    height: 48px;
    margin-top: 20px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .wave-box.active { opacity: 1; }
  .wave-bar {
    width: 4px;
    background: var(--accent);
    border-radius: 2px;
    transition: height 0.1s;
  }

  .record-status {
    margin-top: 12px;
    font-size: 13px;
    color: var(--ink-muted);
    height: 20px;
  }
  .record-timer {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 28px;
    color: var(--accent);
    margin-top: 8px;
    height: 36px;
  }

  /* Transcript area */
  .transcript-box {
    margin-top: 20px;
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius-lg);
    padding: 14px;
    min-height: 100px;
  }
  .transcript-label {
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .transcript-text {
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink);
    min-height: 60px;
    white-space: pre-wrap;
  }
  .transcript-text:empty::before {
    content: '语音内容将自动转写在这里...';
    color: var(--ink-muted);
  }

  /* Emotion tags */
  .emotion-section {
    margin-top: 16px;
  }
  .emotion-label {
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 10px;
  }
  .emotion-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .emotion-tag {
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 13px;
    border: 1.5px solid var(--paper-line);
    background: var(--card-bg);
    color: var(--ink-light);
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .emotion-tag.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 500;
  }
  .emotion-tag:active { transform: scale(0.95); }

  /* Action buttons */
  .action-btns {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .btn-primary {
    flex: 1;
    padding: 12px;
    border-radius: var(--radius-md);
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-primary:active { transform: scale(0.97); opacity: 0.9; }
  .btn-secondary {
    flex: 1;
    padding: 12px;
    border-radius: var(--radius-md);
    background: var(--card-bg);
    color: var(--ink);
    border: 1px solid var(--paper-line);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-secondary:active { transform: scale(0.97); background: var(--paper-line); }

  /* ===== LIST PAGE ===== */
  .diary-stats {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    flex: 1;
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius-md);
    padding: 12px;
    text-align: center;
  }
  .stat-num {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 24px;
    color: var(--accent);
  }
  .stat-label {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 2px;
  }

  .diary-list { display: flex; flex-direction: column; gap: 12px; }
  .diary-card {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius-lg);
    padding: 14px;
    transition: all 0.2s;
  }
  .diary-card:active { transform: scale(0.99); }
  .diary-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .diary-date {
    font-size: 12px;
    color: var(--ink-muted);
  }
  .diary-mood {
    display: flex;
    gap: 6px;
  }
  .diary-mood span {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .diary-body {
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink);
    white-space: pre-wrap;
    margin-bottom: 10px;
  }
  .diary-audio {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--paper-dark);
    border-radius: var(--radius-md);
    margin-bottom: 10px;
  }
  .audio-play-btn {
    width: 32px; height: 32px;
    border-radius: var(--radius-full);
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .audio-wave-mini {
    flex: 1;
    height: 24px;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .audio-wave-mini span {
    width: 3px;
    background: var(--accent-light);
    border-radius: 1px;
    transition: height 0.2s;
  }
  .audio-duration {
    font-size: 11px;
    color: var(--ink-muted);
    flex-shrink: 0;
  }
  .diary-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .diary-delete {
    font-size: 12px;
    color: var(--red);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
  }
  .diary-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-muted);
  }
  .diary-empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
  .diary-empty p { font-size: 14px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 20px;
    border-radius: var(--radius-md);
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--paper-line); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <button class="back-btn" onclick="window.location.href='../niujiu-demo-final.html'">&#8592;</button>
    <div class="header-title handwriting">语音日记</div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">&#9788;</button>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('record')">录音</div>
    <div class="tab" onclick="switchTab('list')">日记本</div>
  </div>

  <!-- Record Page -->
  <div class="page active" id="page-record">
    <div class="record-area">
      <div class="record-hint">按住录音按钮，说出今天的心情</div>
      <div class="record-btn-wrap">
        <button class="record-btn" id="recordBtn" onmousedown="startRecord()" onmouseup="stopRecord()" ontouchstart="startRecord()" ontouchend="stopRecord()">&#127908;</button>
        <div class="record-ring"></div>
      </div>
      <div class="record-timer" id="recordTimer">00:00</div>
      <div class="record-status" id="recordStatus">点击或按住按钮开始录音</div>
      <div class="wave-box" id="waveBox">
        <div class="wave-bar" style="height:8px"></div>
        <div class="wave-bar" style="height:16px"></div>
        <div class="wave-bar" style="height:24px"></div>
        <div class="wave-bar" style="height:12px"></div>
        <div class="wave-bar" style="height:20px"></div>
        <div class="wave-bar" style="height:28px"></div>
        <div class="wave-bar" style="height:14px"></div>
        <div class="wave-bar" style="height:22px"></div>
        <div class="wave-bar" style="height:18px"></div>
        <div class="wave-bar" style="height:10px"></div>
        <div class="wave-bar" style="height:26px"></div>
        <div class="wave-bar" style="height:16px"></div>
        <div class="wave-bar" style="height:20px"></div>
        <div class="wave-bar" style="height:12px"></div>
        <div class="wave-bar" style="height:24px"></div>
      </div>
    </div>

    <div class="transcript-box">
      <div class="transcript-label">
        <span>&#9998;</span>
        <span>语音转文字</span>
      </div>
      <div class="transcript-text" id="transcriptText"></div>
    </div>

    <div class="emotion-section">
      <div class="emotion-label">情绪标签（自动分析 / 手动选择）</div>
      <div class="emotion-tags" id="emotionTags">
        <span class="emotion-tag" data-mood="开心" onclick="toggleMood(this)">&#128522; 开心</span>
        <span class="emotion-tag" data-mood="平静" onclick="toggleMood(this)">&#128524; 平静</span>
        <span class="emotion-tag" data-mood="疲惫" onclick="toggleMood(this)">&#128555; 疲惫</span>
        <span class="emotion-tag" data-mood="焦虑" onclick="toggleMood(this)">&#128543; 焦虑</span>
        <span class="emotion-tag" data-mood="愤怒" onclick="toggleMood(this)">&#128544; 愤怒</span>
        <span class="emotion-tag" data-mood="委屈" onclick="toggleMood(this)">&#128546; 委屈</span>
        <span class="emotion-tag" data-mood="感动" onclick="toggleMood(this)">&#128549; 感动</span>
        <span class="emotion-tag" data-mood="期待" onclick="toggleMood(this)">&#128513; 期待</span>
      </div>
    </div>

    <div class="action-btns">
      <button class="btn-secondary" onclick="clearRecord()">清空</button>
      <button class="btn-primary" onclick="saveDiary()">保存日记</button>
    </div>
  </div>

  <!-- List Page -->
  <div class="page" id="page-list">
    <div class="diary-stats">
      <div class="stat-card">
        <div class="stat-num" id="statCount">0</div>
        <div class="stat-label">日记总数</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statDays">0</div>
        <div class="stat-label">记录天数</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statMin">0</div>
        <div class="stat-label">录音分钟</div>
      </div>
    </div>
    <div class="diary-list" id="diaryList">
      <div class="diary-empty">
        <div class="diary-empty-icon">&#128221;</div>
        <p>还没有日记，去录一条吧~</p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function() {
  'use strict';

  // ===== State =====
  let isRecording = false;
  let mediaRecorder = null;
  let audioChunks = [];
  let audioBlob = null;
  let audioUrl = null;
  let recordStartTime = 0;
  let recordTimerInterval = null;
  let waveInterval = null;
  let recognition = null;
  let transcript = '';
  let selectedMoods = [];
  let diaries = [];
  let currentAudio = null;
  const STORAGE_KEY = 'niujiu_voice_diary';

  // ===== Init =====
  function init() {
    loadDiaries();
    initSpeechRecognition();
    updateStats();
    renderDiaryList();
    applyTheme();
  }

  // ===== Theme =====
  function applyTheme() {
    const saved = localStorage.getItem('niujiu_theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (saved === 'dark' || (!saved && prefersDark)) {
      document.documentElement.classList.add('dark-mode');
      document.getElementById('themeBtn').textContent = '\u263E';
    } else {
      document.documentElement.classList.remove('dark-mode');
      document.getElementById('themeBtn').textContent = '\u263C';
    }
  }
  window.toggleTheme = function() {
    const isDark = document.documentElement.classList.toggle('dark-mode');
    localStorage.setItem('niujiu_theme', isDark ? 'dark' : 'light');
    document.getElementById('themeBtn').textContent = isDark ? '\u263E' : '\u263C';
  };

  // ===== Tabs =====
  window.switchTab = function(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('page-' + name).classList.add('active');
    if (name === 'list') {
      updateStats();
      renderDiaryList();
    }
  };

  // ===== Speech Recognition =====
  function initSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return;
    recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onresult = function(e) {
      let final = '';
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          final += e.results[i][0].transcript;
        } else {
          interim += e.results[i][0].transcript;
        }
      }
      if (final) transcript += final;
      document.getElementById('transcriptText').textContent = transcript + interim;
      if (final) analyzeEmotion(transcript + final);
    };
    recognition.onerror = function(e) {
      if (e.error !== 'aborted' && e.error !== 'no-speech') {
        showToast('语音识别出错: ' + e.error);
      }
    };
  }

  // ===== Recording =====
  window.startRecord = async function() {
    if (isRecording) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        audioUrl = URL.createObjectURL(audioBlob);
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      isRecording = true;
      recordStartTime = Date.now();
      document.getElementById('recordBtn').classList.add('recording');
      document.getElementById('recordStatus').textContent = '正在录音...';
      document.getElementById('waveBox').classList.add('active');
      startTimer();
      startWaveAnimation();
      if (recognition) {
        transcript = '';
        try { recognition.start(); } catch(e) {}
      }
    } catch (err) {
      showToast('无法访问麦克风: ' + err.message);
    }
  };

  window.stopRecord = function() {
    if (!isRecording) return;
    isRecording = false;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    if (recognition) {
      try { recognition.stop(); } catch(e) {}
    }
    document.getElementById('recordBtn').classList.remove('recording');
    document.getElementById('recordStatus').textContent = '录音完成，可保存或重新录制';
    document.getElementById('waveBox').classList.remove('active');
    stopTimer();
    stopWaveAnimation();
  };

  function startTimer() {
    const el = document.getElementById('recordTimer');
    recordTimerInterval = setInterval(() => {
      const sec = Math.floor((Date.now() - recordStartTime) / 1000);
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      el.textContent = m + ':' + s;
    }, 1000);
  }
  function stopTimer() {
    clearInterval(recordTimerInterval);
  }

  function startWaveAnimation() {
    const bars = document.querySelectorAll('.wave-bar');
    waveInterval = setInterval(() => {
      bars.forEach(bar => {
        const h = 6 + Math.random() * 26;
        bar.style.height = h + 'px';
      });
    }, 120);
  }
  function stopWaveAnimation() {
    clearInterval(waveInterval);
    document.querySelectorAll('.wave-bar').forEach(b => b.style.height = '8px');
  }

  // ===== Emotion Analysis =====
  function analyzeEmotion(text) {
    const moodMap = {
      '开心': ['开心', '高兴', '快乐', '棒', '好', '喜欢', '爱', '笑', '哈哈', '嘻嘻', '爽', '赞'],
      '平静': ['平静', '安静', '淡定', '从容', '舒服', '放松', '安心'],
      '疲惫': ['累', '疲惫', '困', '倦', '乏', '没劲', '虚', '睡'],
      '焦虑': ['焦虑', '担心', '怕', '紧张', '不安', '慌', '压力', '愁', '烦'],
      '愤怒': ['生气', '愤怒', '火大', '烦死', '讨厌', '恨', '怒', '滚', '妈的'],
      '委屈': ['委屈', '难过', '伤心', '想哭', '不公平', '冤枉', '苦'],
      '感动': ['感动', '温暖', '谢谢', '感激', '泪', '哭', '贴心'],
      '期待': ['期待', '希望', '想', '盼望', '等', '计划', '未来']
    };
    const detected = [];
    for (const [mood, keywords] of Object.entries(moodMap)) {
      for (const kw of keywords) {
        if (text.includes(kw)) { detected.push(mood); break; }
      }
    }
    if (detected.length > 0) {
      detected.forEach(m => {
        const tag = document.querySelector('.emotion-tag[data-mood="' + m + '"]');
        if (tag && !tag.classList.contains('selected')) {
          tag.classList.add('selected');
          if (!selectedMoods.includes(m)) selectedMoods.push(m);
        }
      });
    }
  }

  window.toggleMood = function(el) {
    const mood = el.dataset.mood;
    if (el.classList.contains('selected')) {
      el.classList.remove('selected');
      selectedMoods = selectedMoods.filter(m => m !== mood);
    } else {
      el.classList.add('selected');
      if (!selectedMoods.includes(mood)) selectedMoods.push(mood);
    }
  };

  // ===== Save / Clear =====
  window.saveDiary = function() {
    const text = document.getElementById('transcriptText').textContent.trim();
    if (!text && !audioBlob) {
      showToast('请先录音或输入内容');
      return;
    }
    const diary = {
      id: Date.now(),
      date: new Date().toLocaleString('zh-CN'),
      text: text || '(无文字内容)',
      moods: [...selectedMoods],
      audio: audioUrl || null,
      duration: document.getElementById('recordTimer').textContent,
      hasAudio: !!audioBlob
    };
    diaries.unshift(diary);
    saveDiaries();
    showToast('日记已保存');
    clearRecord();
    switchTabTo('list');
  };

  window.clearRecord = function() {
    transcript = '';
    audioBlob = null;
    audioUrl = null;
    selectedMoods = [];
    document.getElementById('transcriptText').textContent = '';
    document.getElementById('recordTimer').textContent = '00:00';
    document.getElementById('recordStatus').textContent = '点击或按住按钮开始录音';
    document.querySelectorAll('.emotion-tag').forEach(t => t.classList.remove('selected'));
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  };

  function switchTabTo(name) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', (name === 'record' && i === 0) || (name === 'list' && i === 1));
    });
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    if (name === 'list') { updateStats(); renderDiaryList(); }
  }

  // ===== Storage =====
  function loadDiaries() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) diaries = JSON.parse(raw);
    } catch(e) { diaries = []; }
  }
  function saveDiaries() {
    // Don't save audio URLs (blob URLs are ephemeral)
    const toSave = diaries.map(d => ({ ...d, audio: null }));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  }

  // ===== List Rendering =====
  function updateStats() {
    document.getElementById('statCount').textContent = diaries.length;
    const dates = new Set(diaries.map(d => d.date.split(' ')[0]));
    document.getElementById('statDays').textContent = dates.size;
    let totalSec = 0;
    diaries.forEach(d => {
      if (d.duration) {
        const [m, s] = d.duration.split(':').map(Number);
        totalSec += (m || 0) * 60 + (s || 0);
      }
    });
    document.getElementById('statMin').textContent = Math.round(totalSec / 60);
  }

  function renderDiaryList() {
    const container = document.getElementById('diaryList');
    if (diaries.length === 0) {
      container.innerHTML = '<div class="diary-empty"><div class="diary-empty-icon">&#128221;</div><p>还没有日记，去录一条吧~</p></div>';
      return;
    }
    container.innerHTML = diaries.map((d, idx) => {
      const moodHtml = d.moods.map(m => '<span>' + m + '</span>').join('');
      const audioHtml = d.hasAudio ? `
        <div class="diary-audio">
          <button class="audio-play-btn" onclick="playAudio(${idx}, this)">&#9654;</button>
          <div class="audio-wave-mini">${Array(16).fill(0).map(() => '<span style="height:' + (4 + Math.random() * 16) + 'px"></span>').join('')}</div>
          <span class="audio-duration">${d.duration || '00:00'}</span>
        </div>
      ` : '';
      return `
        <div class="diary-card">
          <div class="diary-header">
            <div class="diary-date">${d.date}</div>
            <div class="diary-mood">${moodHtml}</div>
          </div>
          <div class="diary-body">${escapeHtml(d.text)}</div>
          ${audioHtml}
          <div class="diary-footer">
            <span style="font-size:11px;color:var(--ink-muted)">${d.hasAudio ? '&#127908; 含录音' : '&#9998; 文字'}</span>
            <button class="diary-delete" onclick="deleteDiary(${idx})">删除</button>
          </div>
        </div>
      `;
    }).join('');
  }

  window.playAudio = function(idx, btn) {
    showToast('音频已保存为录音记录（演示模式）');
    btn.textContent = '\u25A0';
    setTimeout(() => btn.textContent = '\u25B6', 1000);
  };

  window.deleteDiary = function(idx) {
    if (!confirm('确定删除这条日记吗？')) return;
    diaries.splice(idx, 1);
    saveDiaries();
    updateStats();
    renderDiaryList();
    showToast('已删除');
  };

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ===== Toast =====
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // Prevent context menu on long press for record button
  document.getElementById('recordBtn').addEventListener('contextmenu', e => e.preventDefault());

  init();
})();

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>
</body>
</html>
