<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="牛马自救指南 - 成就解锁展示，记录你的每一个成长里程碑">
<title>牛马自救指南 · 成就殿堂</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

  :root {
    --paper: #FDF8F0;
    --paper-dark: #F5EDE0;
    --paper-line: #EDE5D8;
    --ink: #3D3229;
    --ink-light: #6B5E52;
    --ink-muted: #A89B8C;
    --accent: #D4834A;
    --accent-light: #E8A87C;
    --accent-soft: #F5D5C0;
    --warm: #C4A882;
    --green-soft: #B8C9A6;
    --blue-soft: #A8C4D9;
    --purple-soft: #C4B5D4;
    --pink-soft: #E8B4B8;
    --card-bg: #FFFDF9;
    --shadow: rgba(61,50,41,0.06);
    --shadow-hover: rgba(61,50,41,0.10);
    --card-n: #A89B8C;
    --card-r: #7BA68A;
    --card-sr: #6B8FB5;
    --card-ssr: #B07DAA;
    --card-ur: #D4A03C;
    --rarity-common: #A89B8C;
    --rarity-rare: #5B9A6E;
    --rarity-epic: #5A7FB5;
    --rarity-legendary: #D4A03C;
  }

  /* Dark mode */
  html.dark-mode {
    --paper: #1E1D2B;
    --paper-dark: #171622;
    --paper-line: #2A2940;
    --ink: #E8E4DF;
    --ink-light: #B8B3AC;
    --ink-muted: #6E6B66;
    --accent: #E8954A;
    --accent-light: #F0A86C;
    --accent-soft: #3D2E1E;
    --warm: #8A7A62;
    --green-soft: #6B8A5E;
    --blue-soft: #6A8AA5;
    --purple-soft: #8A7BA4;
    --pink-soft: #A88488;
    --card-bg: #252438;
    --shadow: rgba(0,0,0,0.2);
    --shadow-hover: rgba(0,0,0,0.3);
    --card-n: #6E6B66;
    --card-r: #5B9A6E;
    --card-sr: #6B8FB5;
    --card-ssr: #B07DAA;
    --card-ur: #D4A03C;
    --rarity-common: #6E6B66;
    --rarity-rare: #5B9A6E;
    --rarity-epic: #5A7FB5;
    --rarity-legendary: #D4A03C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #E8E0D4;
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.3s, color 0.3s;
  }
  html.dark-mode body { background: #12111C; }

  .handwriting {
    font-family: 'ZCOOL KuaiLe', 'STKaiti', 'KaiTi', cursive;
  }

  /* ===== App Shell ===== */
  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--paper);
    position: relative;
    overflow: hidden;
    transition: background 0.3s;
  }

  /* ===== Paper Texture ===== */
  .paper-texture {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.3;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 150px;
  }
  html.dark-mode .paper-texture { opacity: 0.08; }

  .notebook-lines {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    background-image: repeating-linear-gradient(
      transparent, transparent 31px, var(--paper-line) 31px, var(--paper-line) 32px
    );
    opacity: 0.2;
  }
  html.dark-mode .notebook-lines { opacity: 0.1; }

  /* ===== Animations ===== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes goldenGlow {
    0%, 100% { box-shadow: 0 0 8px rgba(212,160,60,0.3), 0 2px 12px var(--shadow); }
    50% { box-shadow: 0 0 20px rgba(212,160,60,0.5), 0 0 40px rgba(212,160,60,0.15), 0 2px 12px var(--shadow); }
  }
  @keyframes shimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
    50% { opacity: 1; transform: scale(1) rotate(180deg); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes progressFill {
    from { width: 0; }
  }
  @keyframes stamp {
    0% { transform: scale(2) rotate(-10deg); opacity: 0; }
    50% { transform: scale(0.9) rotate(-5deg); opacity: 1; }
    70% { transform: scale(1.05) rotate(-5deg); }
    100% { transform: scale(1) rotate(-5deg); opacity: 1; }
  }
  @keyframes confetti {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-60px) rotate(360deg); opacity: 0; }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ===== Page Container ===== */
  .page-content {
    position: relative;
    z-index: 2;
    padding: 16px 20px 40px;
    min-height: 100vh;
  }

  /* ===== Top Bar ===== */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0 8px;
    margin-bottom: 16px;
  }
  .back-btn {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1.5px solid var(--paper-line);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--ink);
    font-size: 18px;
  }
  .back-btn:active { transform: scale(0.92); }
  .top-bar-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    color: var(--ink);
  }
  .dark-toggle {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1.5px solid var(--paper-line);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 16px;
  }
  .dark-toggle:active { transform: scale(0.92); }

  /* ===== Hero / Stats Section ===== */
  .hero-section {
    text-align: center;
    padding: 20px 0 24px;
    animation: fadeInUp 0.5s ease-out;
  }
  .hero-icon {
    font-size: 56px;
    margin-bottom: 12px;
    animation: float 3s ease-in-out infinite;
    display: inline-block;
  }
  .hero-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 26px;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .hero-subtitle {
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 20px;
  }

  /* Stats Cards */
  .stats-row {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    animation: fadeInUp 0.6s ease-out;
  }
  .stat-card {
    flex: 1;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px 12px;
    text-align: center;
    border: 1.5px solid var(--paper-line);
    box-shadow: 0 2px 8px var(--shadow);
    transition: all 0.3s;
  }
  .stat-card:active { transform: scale(0.97); }
  .stat-value {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 28px;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-label {
    font-size: 11px;
    color: var(--ink-muted);
    font-weight: 500;
  }

  /* Overall Progress */
  .overall-progress {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 24px;
    border: 1.5px solid var(--paper-line);
    box-shadow: 0 2px 8px var(--shadow);
    animation: fadeInUp 0.65s ease-out;
  }
  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .progress-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }
  .progress-count {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
  }
  .progress-bar-bg {
    width: 100%;
    height: 10px;
    background: var(--paper-dark);
    border-radius: 5px;
    overflow: hidden;
    position: relative;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--accent-light), var(--accent));
    transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
    overflow: hidden;
  }
  .progress-bar-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    background-size: 200% 100%;
    animation: shimmer 2s infinite;
  }

  /* ===== Category Tabs ===== */
  .category-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 0 0 16px;
    margin-bottom: 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .category-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    border: 1.5px solid var(--paper-line);
    background: var(--card-bg);
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .cat-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .cat-tab:active { transform: scale(0.95); }

  /* ===== Achievement Cards ===== */
  .achievements-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 20px;
  }

  .achievement-card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px;
    border: 2px solid var(--paper-line);
    box-shadow: 0 2px 8px var(--shadow);
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    animation: fadeInUp 0.5s ease-out both;
  }
  .achievement-card:active { transform: scale(0.98); }

  /* Rarity borders */
  .achievement-card.rarity-common { border-color: var(--rarity-common); }
  .achievement-card.rarity-rare { border-color: var(--rarity-rare); }
  .achievement-card.rarity-epic { border-color: var(--rarity-epic); }
  .achievement-card.rarity-legendary { border-color: var(--rarity-legendary); }

  /* Unlocked golden glow */
  .achievement-card.unlocked.rarity-legendary {
    animation: goldenGlow 3s ease-in-out infinite, fadeInUp 0.5s ease-out both;
  }
  .achievement-card.unlocked.rarity-epic {
    box-shadow: 0 0 12px rgba(90,127,181,0.2), 0 2px 12px var(--shadow);
  }
  .achievement-card.unlocked.rarity-rare {
    box-shadow: 0 0 10px rgba(91,154,110,0.15), 0 2px 12px var(--shadow);
  }

  /* Locked state */
  .achievement-card.locked {
    opacity: 0.55;
    filter: grayscale(0.6);
  }
  .achievement-card.locked .ach-icon {
    filter: grayscale(1);
  }

  /* Card inner layout */
  .ach-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }
  .ach-icon-wrap {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }
  .ach-icon-wrap.rarity-common { background: rgba(168,155,140,0.12); }
  .ach-icon-wrap.rarity-rare { background: rgba(91,154,110,0.12); }
  .ach-icon-wrap.rarity-epic { background: rgba(90,127,181,0.12); }
  .ach-icon-wrap.rarity-legendary { background: rgba(212,160,60,0.15); }
  .ach-icon {
    font-size: 28px;
    line-height: 1;
  }
  .ach-lock-icon {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--ink-muted);
    color: #fff;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ach-info { flex: 1; min-width: 0; }
  .ach-title-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 2px;
  }
  .ach-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 16px;
    color: var(--ink);
    line-height: 1.2;
  }
  .ach-rarity-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .ach-rarity-badge.rarity-common { background: rgba(168,155,140,0.15); color: var(--rarity-common); }
  .ach-rarity-badge.rarity-rare { background: rgba(91,154,110,0.15); color: var(--rarity-rare); }
  .ach-rarity-badge.rarity-epic { background: rgba(90,127,181,0.15); color: var(--rarity-epic); }
  .ach-rarity-badge.rarity-legendary { background: rgba(212,160,60,0.2); color: var(--rarity-legendary); }

  .ach-desc {
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.5;
    margin-bottom: 2px;
  }
  .ach-condition {
    font-size: 11px;
    color: var(--ink-light);
    font-weight: 500;
  }
  .ach-condition .cond-icon { margin-right: 3px; }

  /* Reward & Points */
  .ach-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--paper-line);
  }
  .ach-reward {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
  }
  .ach-reward .reward-icon { font-size: 14px; }
  .ach-points {
    font-size: 11px;
    color: var(--ink-muted);
    font-weight: 500;
  }
  .ach-points .pts-num {
    color: var(--accent);
    font-weight: 700;
  }

  /* Progress bar for incomplete */
  .ach-progress {
    margin-top: 8px;
  }
  .ach-progress-header {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--ink-muted);
    margin-bottom: 4px;
  }
  .ach-progress-bar {
    width: 100%;
    height: 6px;
    background: var(--paper-dark);
    border-radius: 3px;
    overflow: hidden;
  }
  .ach-progress-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent-light), var(--accent));
    animation: progressFill 1s ease-out;
    transition: width 0.6s ease;
  }

  /* Unlocked stamp */
  .unlocked-stamp {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 40px;
    height: 40px;
    border: 2.5px solid var(--rarity-legendary);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--rarity-legendary);
    transform: rotate(-15deg);
    animation: stamp 0.5s ease-out;
    opacity: 0.7;
    pointer-events: none;
  }

  /* Share button */
  .share-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 14px;
    border-radius: 16px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    border: 1px solid rgba(212,131,74,0.2);
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }
  .share-btn:active {
    transform: scale(0.95);
    background: var(--accent);
    color: #fff;
  }

  /* ===== Recent Unlocks Timeline ===== */
  .timeline-section {
    margin-top: 28px;
    animation: fadeInUp 0.7s ease-out;
  }
  .section-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .title-icon { font-size: 20px; }

  .timeline {
    position: relative;
    padding-left: 24px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 7px;
    top: 4px;
    bottom: 4px;
    width: 2px;
    background: var(--paper-line);
    border-radius: 1px;
  }
  .timeline-item {
    position: relative;
    margin-bottom: 16px;
    animation: slideInRight 0.4s ease-out both;
  }
  .timeline-dot {
    position: absolute;
    left: -24px;
    top: 4px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }
  .timeline-dot .dot-inner {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  .timeline-card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 12px 14px;
    border: 1px solid var(--paper-line);
    box-shadow: 0 1px 4px var(--shadow);
  }
  .timeline-card .tl-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .timeline-card .tl-ach {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .timeline-card .tl-ach .tl-emoji { font-size: 16px; }
  .timeline-card .tl-time {
    font-size: 10px;
    color: var(--ink-muted);
  }
  .timeline-card .tl-desc {
    font-size: 11px;
    color: var(--ink-muted);
    line-height: 1.4;
  }

  /* ===== Category Label ===== */
  .category-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 20px 0 12px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-light);
  }
  .category-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--paper-line);
  }
  .category-label .cat-emoji { font-size: 16px; }

  /* ===== Toast / Share Modal ===== */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: var(--ink);
    color: var(--paper);
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    text-align: center;
    max-width: 260px;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* ===== Confetti Particles ===== */
  .confetti-container {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    animation: confetti 1.5s ease-out forwards;
  }

  /* ===== Decorative Elements ===== */
  .deco-doodle {
    position: absolute;
    pointer-events: none;
    opacity: 0.08;
    font-size: 40px;
    z-index: 0;
  }
  .deco-doodle.top-right {
    top: 60px;
    right: -10px;
    transform: rotate(15deg);
  }
  .deco-doodle.bottom-left {
    bottom: 100px;
    left: -10px;
    transform: rotate(-10deg);
  }

  /* ===== Responsive ===== */
  @media (max-width: 375px) {
    .hero-title { font-size: 22px; }
    .stat-value { font-size: 24px; }
    .ach-icon-wrap { width: 44px; height: 44px; }
    .ach-icon { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="paper-texture"></div>
  <div class="notebook-lines"></div>

  <div class="page-content">
    <!-- Decorative -->
    <div class="deco-doodle top-right">&#x2728;</div>

const rarityLabels = {
  common: '普通',
  rare: '稀有',
  epic: '史诗',

};

const categoryNames = {
  checkin: '签到达人',
  flip: '翻牌高手',
  community: '社区之星',
  emotion: '情绪管理',
  explore: '探索者'

const categoryEmojis = {
  checkin: '\u{1F4C5}',
  flip: '\u{1F0CF}',
  community: '\u{2B50}',
  emotion: '\u{1F49A}',
  explore: '\u{1F30D}'
};

let currentCategory = 'all';

// ===== Render Achievements =====
function renderAchievements() {
  const grid = document.getElementById('achievementsGrid');
  const filtered = currentCategory === 'all'
    ? achievements
    : achievements.filter(a => a.category === currentCategory);

  // Group by category if showing all
  let html = '';
  const grouped = {};
  filtered.forEach(a => {
    if (!grouped[a.category]) grouped[a.category] = [];
    grouped[a.category].push(a);
  });

  const cats = Object.keys(grouped);
  cats.forEach((cat, ci) => {
    if (currentCategory === 'all') {
      html += `<div class="category-label">
        <span class="cat-emoji">${categoryEmojis[cat]}</span>
        ${categoryNames[cat]}
      </div>`;
    }
    grouped[cat].forEach((a, i) => {
      const stateClass = a.unlocked ? 'unlocked' : 'locked';
      const delay = (ci * 0.1 + i * 0.08).toFixed(2);
      html += renderCard(a, stateClass, delay);
    });
  });

  grid.innerHTML = html;
}

function renderCard(a, stateClass, delay) {
  const rarityClass = `rarity-${a.rarity}`;
  const cardClasses = `achievement-card ${rarityClass} ${stateClass}`;
  const progressPercent = a.total > 0 ? Math.round((a.progress / a.total) * 100) : 0;

  let progressHtml = '';
  if (!a.unlocked && a.progress > 0) {
    progressHtml = `
      <div class="ach-progress">
        <div class="ach-progress-header">
          <span>进度 ${a.progress}/${a.total}</span>
          <span>${progressPercent}%</span>
        </div>
        <div class="ach-progress-bar">
          <div class="ach-progress-fill" style="width: ${progressPercent}%"></div>
        </div>
      </div>`;
  }

  let stampHtml = '';
  if (a.unlocked) {
    stampHtml = `<div class="unlocked-stamp">\u2713</div>`;
  }

  let lockHtml = '';
  if (!a.unlocked) {
    lockHtml = `<div class="ach-lock-icon">\u{1F512}</div>`;
  }

  let shareHtml = '';
  if (a.unlocked) {
    shareHtml = `<button class="share-btn" onclick="shareAchievement('${a.title}')">
      \u{1F4E4} 分享成就
    </button>`;
  }

  return `
    <div class="${cardClasses}" style="animation-delay: ${delay}s">
      ${stampHtml}
      <div class="ach-top">
        <div class="ach-icon-wrap ${rarityClass}">
          <span class="ach-icon">${a.emoji}</span>
          ${lockHtml}
        </div>
        <div class="ach-info">
          <div class="ach-title-row">
            <span class="ach-title">${a.title}</span>
            <span class="ach-rarity-badge ${rarityClass}">${rarityLabels[a.rarity]}</span>
          </div>
          <div class="ach-desc">${a.desc}</div>
          <div class="ach-condition">
            <span class="cond-icon">\u{1F4CD}</span>${a.condition}
          </div>
        </div>
      </div>
      ${progressHtml}
      <div class="ach-bottom">
        <div class="ach-reward">
          <span class="reward-icon">\u{1F381}</span>
          ${a.reward}
        </div>
        <div class="ach-points">
          <span class="pts-num">+${a.points}</span> 积分
        </div>
      </div>
      ${shareHtml}
    </div>`;
}

// ===== Render Timeline =====
function renderTimeline() {
  const timeline = document.getElementById('timeline');
  const unlocked = achievements
    .filter(a => a.unlocked && a.unlockedDate)
    .sort((a, b) => new Date(b.unlockedDate) - new Date(a.unlockedDate))
    .slice(0, 5);

  if (unlocked.length === 0) {
    timeline.innerHTML = '<div style="text-align:center;color:var(--ink-muted);font-size:13px;padding:20px 0;">还没有解锁任何成就哦，快去探索吧~</div>';
    return;
  }

  let html = '';
  unlocked.forEach((a, i) => {
    const date = new Date(a.unlockedDate);
    const now = new Date();
    const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));
    let timeText;
    if (diffDays === 0) timeText = '今天';
    else if (diffDays === 1) timeText = '昨天';
    else if (diffDays < 7) timeText = `${diffDays}天前`;
    else timeText = `${date.getMonth() + 1}月${date.getDate()}日`;

    html += `
      <div class="timeline-item" style="animation-delay: ${i * 0.1}s">
        <div class="timeline-dot"><div class="dot-inner"></div></div>
        <div class="timeline-card">
          <div class="tl-header">
            <span class="tl-ach">
              <span class="tl-emoji">${a.emoji}</span>
              ${a.title}
            </span>
            <span class="tl-time">${timeText}</span>
          </div>
          <div class="tl-desc">${a.desc}</div>
        </div>
      </div>`;
  });

  timeline.innerHTML = html;
}

// ===== Category Filter =====
function filterCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.cat-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.cat === cat);
  });
  renderAchievements();
}

// ===== Dark Mode =====
function toggleDark() {
  const html = document.documentElement;
  const isDark = html.classList.toggle('dark-mode');
  document.getElementById('darkToggle').textContent = isDark ? '\u{2600}' : '\u{1F319}';
  // 统一使用主应用darkMode键
  try { localStorage.setItem('darkMode', isDark); } catch(e) {}
}

// Restore dark mode - 优先读取主应用darkMode键
(function() {
  var isDark = false;
  try {
    var mainDark = localStorage.getItem('darkMode');
    if (mainDark === 'true') isDark = true;
    else if (!mainDark && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) isDark = true;
  } catch(e) {}
  if (isDark) {
    document.documentElement.classList.add('dark-mode');
    document.getElementById('darkToggle').textContent = '\u{2600}';
  }
})();

// ===== Share =====
function shareAchievement(title) {
  showToast(`\u2728 已复制「${title}」成就分享文案`);
  spawnConfetti();
}

// ===== Toast =====
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ===== Confetti =====
function spawnConfetti() {
  const container = document.getElementById('confettiContainer');
  const colors = ['#D4834A', '#E8A87C', '#F5D5C0', '#B07DAA', '#6B8FB5', '#7BA68A', '#D4A03C'];
  for (let i = 0; i < 20; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (Math.random() * 100) + '%';
    piece.style.top = (40 + Math.random() * 30) + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (1 + Math.random() * 1) + 's';
    piece.style.animationDelay = (Math.random() * 0.3) + 's';
    piece.style.width = (6 + Math.random() * 6) + 'px';
    piece.style.height = (6 + Math.random() * 6) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 2500);
  }
}
