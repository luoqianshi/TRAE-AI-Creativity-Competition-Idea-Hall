<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="牛马自救指南 - 情绪盲盒，随机抽取治愈小惊喜">
<title>情绪盲盒 · 牛马自救指南</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FDF8F0;
    --bg2: #F5EDE0;
    --ink: #2D2A24;
    --accent: #E8916A;
    --ink-muted: #7A7670;
    --card-bg: #FFFBF5;
    --shadow: rgba(45,42,36,0.08);
    --shadow-md: rgba(45,42,36,0.12);
    --radius: 16px;
    --transition: 0.3s ease;
  }

  html.dark-mode {
    --bg: #1A1918;
    --bg2: #252320;
    --ink: #E8E4DC;
    --accent: #E8916A;
    --ink-muted: #9A968E;
    --card-bg: #2A2826;
    --shadow: rgba(0,0,0,0.25);
    --shadow-md: rgba(0,0,0,0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    transition: background var(--transition), color var(--transition);
  }

  /* ===== Page Load Fade-in ===== */
  .page-wrapper {
    opacity: 0;
    animation: pageFadeIn 0.6s ease-out 0.1s forwards;
  }
  @keyframes pageFadeIn {
    to { opacity: 1; }
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    background: var(--bg);
    overflow: hidden;
    transition: background var(--transition);
  }

  /* ===== Animated Gradient Background ===== */
  .gradient-bg {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    height: 100vh;
    z-index: 0;
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 50%, var(--bg) 100%);
    background-size: 400% 400%;
    animation: gradientShift 8s ease infinite;
    pointer-events: none;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ===== Floating Geometric Shapes ===== */
  .floating-shapes {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .shape {
    position: absolute;
    opacity: 0.06;
    animation: floatShape 12s ease-in-out infinite;
  }
  .shape.circle {
    border-radius: 50%;
    border: 2px solid var(--accent);
  }
  .shape.square {
    border: 2px solid var(--accent);
    transform: rotate(45deg);
  }
  .shape.triangle {
    width: 0 !important; height: 0 !important;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-bottom: 35px solid var(--accent);
    background: none !important;
  }
  .shape:nth-child(1) { width: 40px; height: 40px; top: 8%; left: 10%; animation-delay: 0s; animation-duration: 10s; }
  .shape:nth-child(2) { width: 25px; height: 25px; top: 15%; right: 15%; animation-delay: 2s; animation-duration: 14s; }
  .shape:nth-child(3) { top: 30%; left: 80%; animation-delay: 4s; animation-duration: 11s; }
  .shape:nth-child(4) { width: 50px; height: 50px; top: 50%; left: 5%; animation-delay: 1s; animation-duration: 16s; }
  .shape:nth-child(5) { width: 30px; height: 30px; top: 65%; right: 10%; animation-delay: 3s; animation-duration: 13s; }
  .shape:nth-child(6) { top: 80%; left: 20%; animation-delay: 5s; animation-duration: 15s; }
  .shape:nth-child(7) { width: 35px; height: 35px; top: 90%; right: 25%; animation-delay: 2.5s; animation-duration: 12s; }
  .shape:nth-child(8) { width: 20px; height: 20px; top: 40%; left: 50%; animation-delay: 6s; animation-duration: 18s; }

  @keyframes floatShape {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-20px) rotate(90deg); }
    50% { transform: translateY(-10px) rotate(180deg); }
    75% { transform: translateY(-25px) rotate(270deg); }
  }

  /* ===== Header ===== */
  .header {
    display: flex;
    align-items: center;
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 50;
    transition: background var(--transition);
  }
  .back-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--card-bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px var(--shadow);
    transition: transform 0.2s, background var(--transition);
    flex-shrink: 0;
  }
  .back-btn:active { transform: scale(0.9); }
  .back-btn svg { width: 20px; height: 20px; }
  .header-title {
    flex: 1;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    margin-right: 36px;
  }

  /* ===== Counter ===== */
  .counter-bar {
    text-align: center;
    padding: 8px 20px 4px;
    font-size: 13px;
    color: var(--ink-muted);
    position: relative;
    z-index: 10;
  }
  .counter-bar span {
    color: var(--accent);
    font-weight: 700;
    font-size: 15px;
  }

  /* ===== Stage Area ===== */
  .stage {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 180px);
    padding: 20px;
  }

  /* ===== 3D Blind Box ===== */
  .box-container {
    perspective: 600px;
    width: 180px;
    height: 200px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }

  .box-wrapper {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: boxFloat 3s ease-in-out infinite;
  }

  @keyframes boxFloat {
    0%, 100% { transform: translateY(0) rotateX(0deg) rotateY(0deg); }
    50% { transform: translateY(-12px) rotateX(2deg) rotateY(-2deg); }
  }

  /* Box body */
  .box-body {
    width: 160px;
    height: 140px;
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 12px 12px 16px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15), inset 0 -4px 12px rgba(0,0,0,0.08);
    overflow: hidden;
    transition: transform 0.3s;
  }

  /* Box patterns */
  .box-body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    opacity: 0.15;
    pointer-events: none;
  }

  /* Pattern 1: polka dots */
  .box-pattern-1::before {
    background: radial-gradient(circle 8px, currentColor 6px, transparent 6px);
    background-size: 24px 24px;
    background-position: 0 0, 12px 12px;
  }
  /* Pattern 2: stripes */
  .box-pattern-2::before {
    background: repeating-linear-gradient(45deg, transparent, transparent 8px, currentColor 8px, currentColor 10px);
  }
  /* Pattern 3: stars */
  .box-pattern-3::before {
    background: radial-gradient(circle 6px, currentColor 4px, transparent 4px);
    background-size: 30px 30px;
    background-position: 0 0, 15px 15px;
    opacity: 0.1;
  }
  /* Pattern 4: zigzag */
  .box-pattern-4::before {
    background: linear-gradient(135deg, currentColor 25%, transparent 25%) -10px 0,
                linear-gradient(225deg, currentColor 25%, transparent 25%) -10px 0,
                linear-gradient(315deg, currentColor 25%, transparent 25%),
                linear-gradient(45deg, currentColor 25%, transparent 25%);
    background-size: 20px 20px;
    opacity: 0.1;
  }
  /* Pattern 5: hearts */
  .box-pattern-5::before {
    background: radial-gradient(circle 10px at 50% 50%, currentColor 5px, transparent 5px);
    background-size: 28px 28px;
    opacity: 0.12;
  }
  /* Pattern 6: crosshatch */
  .box-pattern-6::before {
    background: linear-gradient(0deg, transparent 45%, currentColor 45%, currentColor 55%, transparent 55%),
                linear-gradient(90deg, transparent 45%, currentColor 45%, currentColor 55%, transparent 55%);
    background-size: 16px 16px;
    opacity: 0.08;
  }

  .box-question {
    font-size: 56px;
    font-weight: 800;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 2;
    line-height: 1;
    user-select: none;
  }

  /* Box lid */
  .box-lid {
    width: 170px;
    height: 36px;
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 10px 10px 4px 4px;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.1), 0 4px 8px rgba(0,0,0,0.08);
    transform-origin: center bottom;
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 3;
  }

  /* Box ribbon */
  .box-ribbon-v {
    position: absolute;
    width: 20px;
    height: 140px;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0.3;
    border-radius: 2px;
  }
  .box-ribbon-h {
    position: absolute;
    width: 160px;
    height: 20px;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0.3;
    border-radius: 2px;
  }

  /* Box shadow on ground */
  .box-shadow {
    width: 120px;
    height: 16px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.12) 0%, transparent 70%);
    position: absolute;
    bottom: -24px;
    left: 50%;
    transform: translateX(-50%);
    animation: shadowPulse 3s ease-in-out infinite;
  }
  @keyframes shadowPulse {
    0%, 100% { transform: translateX(-50%) scaleX(1); opacity: 1; }
    50% { transform: translateX(-50%) scaleX(0.85); opacity: 0.7; }
  }

  /* ===== Shake Animation ===== */
  .box-container.shaking .box-wrapper {
    animation: boxShake 0.5s ease-in-out;
  }
  @keyframes boxShake {
    0%, 100% { transform: translateX(0) translateY(0) rotate(0deg); }
    10% { transform: translateX(-8px) translateY(-2px) rotate(-3deg); }
    20% { transform: translateX(8px) translateY(-4px) rotate(3deg); }
    30% { transform: translateX(-6px) translateY(-2px) rotate(-2deg); }
    40% { transform: translateX(6px) translateY(-3px) rotate(2deg); }
    50% { transform: translateX(-4px) translateY(-1px) rotate(-1deg); }
    60% { transform: translateX(4px) translateY(-2px) rotate(1deg); }
    70% { transform: translateX(-3px) translateY(-1px) rotate(-1deg); }
    80% { transform: translateX(3px) translateY(0) rotate(0.5deg); }
    90% { transform: translateX(-1px) translateY(0) rotate(0deg); }
  }

  /* ===== Opening Animation ===== */
  .box-container.opening .box-lid {
    transform: translateX(-50%) translateY(-40px) rotateX(-60deg) scale(0.8);
    opacity: 0;
  }
  .box-container.opening .box-wrapper {
    animation: none;
    transform: translateY(0);
  }
  .box-container.opening .box-shadow {
    animation: none;
    opacity: 0.5;
  }

  /* ===== Glow Ring (Sound Simulation) ===== */
  .glow-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    opacity: 0;
    pointer-events: none;
    z-index: 5;
  }
  .glow-ring.active {
    animation: ringExpand 0.8s ease-out forwards;
  }
  @keyframes ringExpand {
    0% { width: 80px; height: 80px; opacity: 0.8; border-width: 3px; }
    100% { width: 300px; height: 300px; opacity: 0; border-width: 1px; }
  }

  /* ===== Confetti / Particles ===== */
  .confetti-container {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    height: 100vh;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
  }
  .confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    animation: confettiFall 1.5s ease-out forwards;
  }
  @keyframes confettiFall {
    0% {
      opacity: 1;
      transform: translateY(0) rotate(0deg) scale(1);
    }
    100% {
      opacity: 0;
      transform: translateY(400px) rotate(720deg) scale(0.3);
    }
  }

  /* Sparkle particles */
  .sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    animation: sparkleBurst 1s ease-out forwards;
  }
  @keyframes sparkleBurst {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0); }
  }

  /* ===== Reveal Card ===== */
  .reveal-card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    opacity: 0;
    width: 300px;
    max-width: calc(100vw - 60px);
    background: var(--card-bg);
    border-radius: 24px;
    padding: 32px 24px 28px;
    text-align: center;
    box-shadow: 0 12px 48px var(--shadow-md);
    z-index: 20;
    pointer-events: none;
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .reveal-card.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }

  .category-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 20px;
    color: #fff;
  }

  .message-text {
    font-size: 18px;
    line-height: 1.7;
    color: var(--ink);
    margin-bottom: 28px;
    font-weight: 500;
  }

  .reveal-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .btn-again {
    padding: 12px 28px;
    border-radius: 24px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(232,145,106,0.35);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-again:active {
    transform: scale(0.95);
    box-shadow: 0 2px 8px rgba(232,145,106,0.25);
  }

  .btn-share {
    padding: 12px 20px;
    border-radius: 24px;
    border: 2px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }
  .btn-share:active {
    transform: scale(0.95);
    background: rgba(232,145,106,0.08);
  }

  /* ===== Hint Text ===== */
  .tap-hint {
    margin-top: 32px;
    font-size: 14px;
    color: var(--ink-muted);
    animation: hintPulse 2s ease-in-out infinite;
    text-align: center;
    z-index: 10;
    position: relative;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  /* ===== Box Color Themes ===== */
  .box-color-1 { background: linear-gradient(135deg, #FF6B6B, #EE5A5A); color: #FF6B6B; }
  .box-color-2 { background: linear-gradient(135deg, #4ECDC4, #3DBDB5); color: #4ECDC4; }
  .box-color-3 { background: linear-gradient(135deg, #FFD93D, #F0C830); color: #FFD93D; }
  .box-color-4 { background: linear-gradient(135deg, #A78BFA, #8B5CF6); color: #A78BFA; }
  .box-color-5 { background: linear-gradient(135deg, #F472B6, #EC4899); color: #F472B6; }
  .box-color-6 { background: linear-gradient(135deg, #60A5FA, #3B82F6); color: #60A5FA; }
  .box-color-7 { background: linear-gradient(135deg, #FB923C, #F97316); color: #FB923C; }

  /* ===== Category Colors ===== */
  .cat-warm { background: linear-gradient(135deg, #FF9A76, #FFBE76); }
  .cat-encourage { background: linear-gradient(135deg, #FF6B6B, #EE5A5A); }
  .cat-vent { background: linear-gradient(135deg, #A78BFA, #8B5CF6); }
  .cat-night { background: linear-gradient(135deg, #607D8B, #455A64); }
  .cat-action { background: linear-gradient(135deg, #4ECDC4, #3DBDB5); }

  /* ===== Dark mode adjustments ===== */
  html.dark-mode .box-body {
    box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 -4px 12px rgba(0,0,0,0.15);
  }
  html.dark-mode .box-lid {
    box-shadow: 0 -2px 12px rgba(0,0,0,0.2), 0 4px 8px rgba(0,0,0,0.15);
  }
  html.dark-mode .reveal-card {
    box-shadow: 0 12px 48px rgba(0,0,0,0.4);
  }
  html.dark-mode .shape { opacity: 0.04; }
  html.dark-mode .cat-night { background: linear-gradient(135deg, #78909C, #546E7A); }

  /* ===== Responsive ===== */
  @media (max-width: 380px) {
    .box-container { width: 150px; height: 170px; }
    .box-body { width: 130px; height: 115px; }
    .box-lid { width: 140px; height: 30px; top: 20px; }
    .box-ribbon-v { width: 16px; height: 115px; }
    .box-ribbon-h { width: 130px; height: 16px; bottom: 50px; }
    .box-question { font-size: 44px; }
    .reveal-card { padding: 24px 20px 24px; width: 260px; }
    .message-text { font-size: 16px; }
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(45,42,36,0.85);
    color: #fff;
    padding: 10px 24px;
    border-radius: 20px;
    font-size: 14px;
    z-index: 200;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  html.dark-mode .toast {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== Decorative stars around box ===== */
  .deco-star {
    position: absolute;
    font-size: 16px;
    opacity: 0;
    animation: decoStar 2s ease-in-out infinite;
    pointer-events: none;
    z-index: 4;
  }
  .deco-star:nth-child(1) { top: 0; left: -20px; animation-delay: 0s; }
  .deco-star:nth-child(2) { top: -10px; right: -15px; animation-delay: 0.7s; }
  .deco-star:nth-child(3) { bottom: 30px; left: -25px; animation-delay: 1.4s; }
  .deco-star:nth-child(4) { bottom: 40px; right: -20px; animation-delay: 0.3s; }
  @keyframes decoStar {
    0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
    50% { opacity: 0.7; transform: scale(1) rotate(180deg); }
  }
</style>
</head>
<body>
<div class="page-wrapper">
  <div class="app" id="app">
    <!-- Animated gradient background -->
    <div class="gradient-bg"></div>

    <!-- Floating geometric shapes -->
    <div class="floating-shapes">
      <div class="shape circle"></div>
      <div class="shape square"></div>
      <div class="shape triangle"></div>
      <div class="shape circle"></div>
      <div class="shape square"></div>
      <div class="shape triangle"></div>
      <div class="shape circle"></div>
      <div class="shape square"></div>
    </div>

    <!-- Header -->
    <div class="header">
      <button class="back-btn" onclick="window.location.href='../niujiu-demo-final.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="header-title">情绪盲盒</div>
    </div>

    <!-- Counter -->
    <div class="counter-bar">已开第 <span id="boxCount">0</span> 个盲盒</div>

    <!-- Stage -->
    <div class="stage" id="stage">
      <!-- Blind Box -->
      <div class="box-container" id="boxContainer" onclick="openBox()">
        <!-- Decorative stars -->
        <div class="deco-star">&#10022;</div>
        <div class="deco-star">&#10023;</div>
        <div class="deco-star">&#10022;</div>
        <div class="deco-star">&#10023;</div>

        <div class="box-wrapper" id="boxWrapper">
          <!-- Lid -->
          <div class="box-lid" id="boxLid"></div>
          <!-- Body -->
          <div class="box-body" id="boxBody">
            <div class="box-ribbon-v" id="ribbonV"></div>
            <div class="box-ribbon-h" id="ribbonH"></div>
            <div class="box-question">?</div>
          </div>
          <!-- Shadow -->
          <div class="box-shadow"></div>
        </div>

        <!-- Glow ring -->
        <div class="glow-ring" id="glowRing"></div>
      </div>

      <!-- Tap hint -->
      <div class="tap-hint" id="tapHint">&#9758; 轻触盲盒，开启惊喜</div>

      <!-- Reveal Card -->
      <div class="reveal-card" id="revealCard">
        <div class="category-badge" id="categoryBadge"></div>
        <div class="message-text" id="messageText"></div>
        <div class="reveal-actions">
          <button class="btn-again" onclick="resetBox()">再来一个</button>
          <button class="btn-share" onclick="shareBox()">分享</button>
        </div>
      </div>
    </div>

    <!-- Confetti container -->
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ===== Dark Mode =====
  function applyTheme() {
    var isDark = localStorage.getItem('darkMode') === 'true';
    document.documentElement.classList.toggle('dark-mode', isDark);
  }
  applyTheme();
  window.addEventListener('storage', function(e) {
    if (e.key === 'darkMode') applyTheme();
  });

  // ===== Box Count =====
  function getBoxCount() {
    return parseInt(localStorage.getItem('blindbox_count') || '0', 10);
  }
  function setBoxCount(n) {
    localStorage.setItem('blindbox_count', String(n));
  }
  document.getElementById('boxCount').textContent = getBoxCount();

  // ===== Messages Data =====
  var categories = [
    {
      id: 'warm',
      name: '\uD83D\uDC9B 温暖治愈',
      cssClass: 'cat-warm',
      messages: [
        '你已经很努力了，今天也辛苦了。允许自己休息一下吧。',
        '世界很大，你也是。你的存在本身就是一件美好的事。',
        '不管今天过得怎样，你都值得被温柔以待。',
        '慢慢来，比较快。不着急，一切都来得及。',
        '你不需要完美，你只需要做自己就好。',
        '今天也要记得对自己说一声：你真的很棒。'
      ]
    },
    {
      id: 'encourage',
      name: '\uD83D\uDCAA 打气加油',
      cssClass: 'cat-encourage',
      messages: [
        '困难只是暂时的，你的能力是永久的。加油！',
        '每一次跌倒都是为了下一次站得更高。',
        '你比你想象中更强大，相信自己的力量。',
        '今天的汗水，就是明天的勋章。继续冲！',
        '没有到不了的明天，只有不肯走的今天。',
        '你走过的每一步都算数，别放弃！'
      ]
    },
    {
      id: 'vent',
      name: '\uD83D\uDE02 职场吐槽',
      cssClass: 'cat-vent',
      messages: [
        '老板说"不加班"，然后发了工作到凌晨两点。懂了。',
        '会议的本意是解决问题，结果制造了更多问题。',
        '打工人的终极梦想：工资翻倍，工时减半。',
        '甲方改需求的速度，永远比我写代码的速度快。',
        '职场生存法则：能摸鱼的时候就摸鱼，该干活的时候干活。',
        '今天又是元气满满想辞职的一天呢~'
      ]
    },
    {
      id: 'night',
      name: '\uD83C\uDF19 深夜陪伴',
      cssClass: 'cat-night',
      messages: [
        '夜深了，别忘了早点休息。明天又是新的一天。',
        '睡不着也没关系，有些夜晚就是用来发呆的。',
        '深夜的安静，是送给疲惫灵魂最好的礼物。',
        '月亮不睡你不睡，但明天还是要加油哦。',
        '此刻的你并不孤单，整个夜空都在陪伴你。',
        '放下手机，闭上眼睛，给自己一个温暖的拥抱。'
      ]
    },
    {
      id: 'action',
      name: '\uD83C\uDFAF 行动指南',
      cssClass: 'cat-action',
      messages: [
        '焦虑的时候，就去做一件小事。行动是最好的解药。',
        '试试三分钟法则：先做三分钟，你会发现没那么难。',
        '把大目标拆成小任务，一步一步来，你会到达的。',
        '今天给自己定一个小目标，完成它，给自己一个小奖励。',
        '不要等到准备好了才开始，开始了你才会准备好。',
        '深呼吸三次，然后去做那件你一直在拖延的事。'
      ]
    }
  ];

  // ===== Box Color Pool =====
  var boxColors = [
    { body: 'box-color-1', lid: 'linear-gradient(135deg, #FF6B6B, #EE5A5A)', ribbon: '#fff' },
    { body: 'box-color-2', lid: 'linear-gradient(135deg, #4ECDC4, #3DBDB5)', ribbon: '#fff' },
    { body: 'box-color-3', lid: 'linear-gradient(135deg, #FFD93D, #F0C830)', ribbon: '#fff' },
    { body: 'box-color-4', lid: 'linear-gradient(135deg, #A78BFA, #8B5CF6)', ribbon: '#fff' },
    { body: 'box-color-5', lid: 'linear-gradient(135deg, #F472B6, #EC4899)', ribbon: '#fff' },
    { body: 'box-color-6', lid: 'linear-gradient(135deg, #60A5FA, #3B82F6)', ribbon: '#fff' },
    { body: 'box-color-7', lid: 'linear-gradient(135deg, #FB923C, #F97316)', ribbon: '#fff' }
  ];

  var boxPatterns = ['box-pattern-1', 'box-pattern-2', 'box-pattern-3', 'box-pattern-4', 'box-pattern-5', 'box-pattern-6'];

  // ===== State =====
  var isOpen = false;
  var currentMessage = null;
  var currentCategory = null;

  // ===== Initialize Box Appearance =====
  function randomizeBox() {
    var colorIdx = Math.floor(Math.random() * boxColors.length);
    var patternIdx = Math.floor(Math.random() * boxPatterns.length);
    var color = boxColors[colorIdx];
    var pattern = boxPatterns[patternIdx];

    var boxBody = document.getElementById('boxBody');
    var boxLid = document.getElementById('boxLid');
    var ribbonV = document.getElementById('ribbonV');
    var ribbonH = document.getElementById('ribbonH');

    // Reset classes
    boxBody.className = 'box-body ' + color.body + ' ' + pattern;
    boxLid.style.background = color.lid;
    ribbonV.style.background = color.ribbon;
    ribbonH.style.background = color.ribbon;
  }
  randomizeBox();

  // ===== Open Box =====
  window.openBox = function() {
    if (isOpen) return;
    isOpen = true;

    var container = document.getElementById('boxContainer');
    var hint = document.getElementById('tapHint');

    // Phase 1: Shake
    container.classList.add('shaking');
    hint.style.display = 'none';

    // Phase 2: Open lid after shake
    setTimeout(function() {
      container.classList.remove('shaking');
      container.classList.add('opening');

      // Glow ring
      var ring = document.getElementById('glowRing');
      ring.classList.add('active');

      // Phase 3: Show confetti & reveal
      setTimeout(function() {
        // Pick random message
        var catIdx = Math.floor(Math.random() * categories.length);
        var cat = categories[catIdx];
        var msgIdx = Math.floor(Math.random() * cat.messages.length);
        var msg = cat.messages[msgIdx];

        currentCategory = cat;
        currentMessage = msg;

        // Update count
        var count = getBoxCount() + 1;
        setBoxCount(count);
        document.getElementById('boxCount').textContent = count;

        // Show reveal card
        var badge = document.getElementById('categoryBadge');
        badge.className = 'category-badge ' + cat.cssClass;
        badge.textContent = cat.name;

        document.getElementById('messageText').textContent = msg;

        var card = document.getElementById('revealCard');
        card.classList.add('show');

        // Confetti burst
        createConfetti();
        createSparkles();

        // Hide box
        container.style.opacity = '0';
        container.style.transition = 'opacity 0.3s';

      }, 400);
    }, 500);
  };

  // ===== Reset Box =====
  window.resetBox = function() {
    isOpen = false;

    var container = document.getElementById('boxContainer');
    var card = document.getElementById('revealCard');
    var hint = document.getElementById('tapHint');
    var ring = document.getElementById('glowRing');

    card.classList.remove('show');

    setTimeout(function() {
      container.classList.remove('opening');
      container.style.opacity = '1';
      ring.classList.remove('active');
      hint.style.display = 'block';

      // Randomize new box appearance
      randomizeBox();

      // Clear confetti
      document.getElementById('confettiContainer').innerHTML = '';
    }, 300);
  };

  // ===== Share =====
  window.shareBox = function() {
    if (!currentMessage || !currentCategory) return;

    var text = currentCategory.name + '\n' + currentMessage + '\n\n\u2014 \u60C5\u7EEA\u76F2\u76D2 | \u725B\u9A6C\u81EA\u6551\u6307\u5357';

    if (navigator.share) {
      navigator.share({
        title: '\u60C5\u7EEA\u76F2\u76D2 | \u725B\u9A6C\u81EA\u6551\u6307\u5357',
        text: text
      }).catch(function() {});
    } else {
      // Fallback: copy to clipboard
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function() {
          showToast('\u5DF2\u590D\u5236\u5230\u526A\u8D34\u677F');
        }).catch(function() {
          showToast('\u5206\u4EAB\u5931\u8D25\uFF0C\u8BF7\u624B\u52A8\u590D\u5236');
        });
      } else {
        showToast('\u5F53\u524D\u6D4F\u89C8\u5668\u4E0D\u652F\u6301\u5206\u4EAB');
      }
    }
  };

  // ===== Toast =====
  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function() {
      toast.classList.remove('show');
    }, 2000);
  }

  // ===== Confetti =====
  function createConfetti() {
    var container = document.getElementById('confettiContainer');
    var colors = ['#FF6B6B', '#FFD93D', '#4ECDC4', '#A78BFA', '#F472B6', '#60A5FA', '#FB923C', '#E8916A'];
    var shapes = ['circle', 'rect', 'triangle'];

    for (var i = 0; i < 40; i++) {
      var el = document.createElement('div');
      el.className = 'confetti';
      var color = colors[Math.floor(Math.random() * colors.length)];
      var shape = shapes[Math.floor(Math.random() * shapes.length)];
      var size = 6 + Math.random() * 10;

      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.background = color;
      el.style.left = (30 + Math.random() * 40) + '%';
      el.style.top = (30 + Math.random() * 20) + '%';
      el.style.animationDuration = (1 + Math.random() * 1.5) + 's';
      el.style.animationDelay = (Math.random() * 0.3) + 's';

      if (shape === 'circle') {
        el.style.borderRadius = '50%';
      } else if (shape === 'triangle') {
        el.style.width = '0';
        el.style.height = '0';
        el.style.background = 'none';
        el.style.borderLeft = (size/2) + 'px solid transparent';
        el.style.borderRight = (size/2) + 'px solid transparent';
        el.style.borderBottom = size + 'px solid ' + color;
      }

      container.appendChild(el);
    }

    // Clean up after animation
    setTimeout(function() {
      container.innerHTML = '';
    }, 3000);
  }

  // ===== Sparkles =====
  function createSparkles() {
    var stage = document.getElementById('stage');
    var colors = ['#FFD700', '#FFF', '#FF6B6B', '#4ECDC4', '#A78BFA'];

    for (var i = 0; i < 16; i++) {
      var el = document.createElement('div');
      el.className = 'sparkle';
      var angle = (Math.PI * 2 / 16) * i;
      var dist = 80 + Math.random() * 60;
      var sx = Math.cos(angle) * dist;
      var sy = Math.sin(angle) * dist;

      el.style.setProperty('--sx', sx + 'px');
      el.style.setProperty('--sy', sy + 'px');
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.left = '50%';
      el.style.top = '50%';
      el.style.width = (4 + Math.random() * 6) + 'px';
      el.style.height = el.style.width;
      el.style.animationDelay = (Math.random() * 0.2) + 's';

      stage.appendChild(el);

      // Remove after animation
      (function(elem) {
        setTimeout(function() {
          if (elem.parentNode) elem.parentNode.removeChild(elem);
        }, 1200);
      })(el);
    }
  }

})();
</script>
</body>
</html>
