<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="牛马自救指南 - 白噪音助眠，雨声海浪森林篝火，陪你安然入睡">
<title>牛马自救指南 · 白噪音助眠</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  :root {
    --paper: #FDF8F0;
    --ink: #2D2A24;
    --ink-muted: #7A7670;
    --accent: #D4834A;
    --accent-light: #E8A87C;
    --accent-soft: #F5D5C0;
    --card-bg: #FFFBF5;
    --shadow: rgba(45,42,36,0.08);
    --shadow-md: rgba(45,42,36,0.12);
    --radius: 16px;
    --transition: 0.3s ease;
    --dark-bg: #0F1419;
    --dark-card: #1A1F26;
    --dark-ink: #D4D0C8;
    --dark-muted: #6B6860;
    --dark-accent: #E89B5A;
  }

  html.dark-mode {
    --paper: var(--dark-bg);
    --ink: var(--dark-ink);
    --ink-muted: var(--dark-muted);
    --accent: var(--dark-accent);
    --accent-light: #F0A86C;
    --accent-soft: #2A2018;
    --card-bg: var(--dark-card);
    --shadow: rgba(0,0,0,0.3);
    --shadow-md: rgba(0,0,0,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    transition: background var(--transition), color var(--transition);
  }

  .title-font {
    font-family: 'ZCOOL KuaiLe', 'STKaiti', 'KaiTi', cursive;
  }

  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    background: var(--paper);
    overflow: hidden;
    transition: background var(--transition);
  }

  /* ===== Header ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    background: var(--paper);
    z-index: 50;
    transition: background var(--transition);
  }

  .back-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--card-bg);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px var(--shadow);
    color: var(--ink);
    font-size: 18px;
    transition: transform 0.2s;
  }

  .back-btn:active { transform: scale(0.92); }

  .header-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    color: var(--ink);
  }

  .theme-toggle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--card-bg);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px var(--shadow);
    color: var(--ink);
    font-size: 16px;
    transition: transform 0.2s;
  }

  .theme-toggle:active { transform: scale(0.92); }

  /* ===== Visualizer ===== */
  .visualizer-wrap {
    position: relative;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 8px 0 20px;
  }

  .sound-wave {
    position: relative;
    width: 160px;
    height: 160px;
  }

  .wave-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 2px solid var(--accent);
    opacity: 0;
    transition: opacity 0.5s;
  }

  .wave-ring.active {
    opacity: 0.15;
    animation: waveExpand 3s ease-out infinite;
  }

  .wave-ring:nth-child(1).active { animation-delay: 0s; }
  .wave-ring:nth-child(2).active { animation-delay: 0.6s; }
  .wave-ring:nth-child(3).active { animation-delay: 1.2s; }
  .wave-ring:nth-child(4).active { animation-delay: 1.8s; }

  @keyframes waveExpand {
    0% { width: 60px; height: 60px; opacity: 0.3; }
    100% { width: 200px; height: 200px; opacity: 0; }
  }

  .wave-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(212,131,74,0.35);
    z-index: 2;
  }

  .wave-center svg {
    width: 36px;
    height: 36px;
    fill: white;
  }

  .wave-center.pulse {
    animation: centerPulse 2s ease-in-out infinite;
  }

  @keyframes centerPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.08); }
  }

  .playing-status {
    text-align: center;
    margin-top: 12px;
    font-size: 13px;
    color: var(--ink-muted);
    min-height: 20px;
  }

  /* ===== Sound Grid ===== */
  .section {
    padding: 0 20px;
    margin-bottom: 20px;
  }

  .section-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .sound-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .sound-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 14px 8px;
    text-align: center;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.25s;
    box-shadow: 0 2px 8px var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .sound-card:active { transform: scale(0.96); }

  .sound-card.active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .sound-card .icon {
    font-size: 28px;
    margin-bottom: 6px;
    display: block;
  }

  .sound-card .name {
    font-size: 12px;
    color: var(--ink);
    font-weight: 500;
  }

  .sound-card .playing-dot {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    animation: dotBlink 1.2s ease-in-out infinite;
  }

  .sound-card.active .playing-dot { opacity: 1; }

  @keyframes dotBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ===== Volume & Mix ===== */
  .control-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: 0 2px 8px var(--shadow);
    margin-bottom: 12px;
  }

  .control-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .control-row:last-child { margin-bottom: 0; }

  .control-label {
    font-size: 13px;
    color: var(--ink-muted);
    min-width: 48px;
  }

  .volume-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--accent-soft);
    outline: none;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(212,131,74,0.3);
  }

  .volume-value {
    font-size: 12px;
    color: var(--ink-muted);
    min-width: 32px;
    text-align: right;
  }

  .mix-hint {
    font-size: 11px;
    color: var(--ink-muted);
    text-align: center;
    padding: 4px 0;
  }

  /* ===== Timer ===== */
  .timer-options {
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  .timer-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1.5px solid var(--accent-soft);
    background: transparent;
    color: var(--ink);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.25s;
    font-family: inherit;
  }

  .timer-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .timer-btn:active { transform: scale(0.95); }

  .timer-display {
    text-align: center;
    font-size: 28px;
    font-weight: 300;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    margin: 12px 0 4px;
    font-family: 'Courier New', monospace;
  }

  .timer-display.hidden { opacity: 0; }

  /* ===== Master Controls ===== */
  .master-controls {
    display: flex;
    gap: 12px;
    padding: 0 20px;
    margin-bottom: 24px;
  }

  .master-btn {
    flex: 1;
    padding: 14px;
    border-radius: var(--radius);
    border: none;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .master-btn.primary {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
    color: white;
    box-shadow: 0 4px 16px rgba(212,131,74,0.3);
  }

  .master-btn.secondary {
    background: var(--card-bg);
    color: var(--ink);
    box-shadow: 0 2px 8px var(--shadow);
  }

  .master-btn:active { transform: scale(0.97); }

  /* ===== Sleep Tip ===== */
  .sleep-tip {
    margin: 0 20px 24px;
    padding: 14px 16px;
    background: linear-gradient(135deg, var(--accent-soft) 0%, rgba(212,131,74,0.08) 100%);
    border-radius: var(--radius);
    border-left: 3px solid var(--accent);
  }

  .sleep-tip-text {
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.6;
  }

  .sleep-tip-text strong {
    color: var(--accent);
  }

  /* ===== Footer ===== */
  .footer {
    text-align: center;
    padding: 16px;
    font-size: 11px;
    color: var(--ink-muted);
  }

  /* ===== Dark mode specific ===== */
  html.dark-mode .wave-center {
    box-shadow: 0 4px 20px rgba(232,155,90,0.25);
  }

  html.dark-mode .sound-card.active {
    background: rgba(232,155,90,0.15);
  }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <button class="back-btn" onclick="window.location.href='../niujiu-demo-final.html'">&#8592;</button>
    <span class="header-title title-font">白噪音助眠</span>
    <button class="theme-toggle" onclick="toggleTheme()" title="切换明暗模式">&#9788;</button>
  </div>

  <!-- Visualizer -->
  <div class="visualizer-wrap">
    <div class="sound-wave">
      <div class="wave-ring" style="width:60px;height:60px;"></div>
      <div class="wave-ring" style="width:60px;height:60px;"></div>
      <div class="wave-ring" style="width:60px;height:60px;"></div>
      <div class="wave-ring" style="width:60px;height:60px;"></div>
      <div class="wave-center" id="waveCenter">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
    </div>
  </div>
  <div class="playing-status" id="playingStatus">选择一种声音，开始放松</div>

  <!-- Sound Grid -->
  <div class="section">
    <div class="section-title title-font">&#127926; 选择声音</div>
    <div class="sound-grid" id="soundGrid"></div>
  </div>

  <!-- Volume Controls -->
  <div class="section" id="volumeSection" style="display:none;">
    <div class="section-title title-font">&#128266; 音量调节</div>
    <div class="control-card" id="volumeControls"></div>
    <div class="mix-hint">可同时选择两种声音混合播放</div>
  </div>

  <!-- Timer -->
  <div class="section">
    <div class="section-title title-font">&#9200; 定时关闭</div>
    <div class="control-card">
      <div class="timer-options">
        <button class="timer-btn" data-min="0" onclick="setTimer(0)">不限</button>
        <button class="timer-btn" data-min="15" onclick="setTimer(15)">15分</button>
        <button class="timer-btn" data-min="30" onclick="setTimer(30)">30分</button>
        <button class="timer-btn" data-min="60" onclick="setTimer(60)">60分</button>
      </div>
      <div class="timer-display hidden" id="timerDisplay">00:00</div>
    </div>
  </div>

  <!-- Master Controls -->
  <div class="master-controls">
    <button class="master-btn secondary" onclick="stopAll()">&#9632; 停止</button>
    <button class="master-btn primary" id="playPauseBtn" onclick="togglePlayPause()">&#9654; 播放</button>
  </div>

  <!-- Sleep Tip -->
  <div class="sleep-tip">
    <div class="sleep-tip-text" id="sleepTip">
      <strong>助眠小贴士：</strong>白噪音可以掩盖环境杂音，帮助大脑放松。建议音量调至30%-50%，配合深呼吸更易入睡。
    </div>
  </div>

  <div class="footer">晚安，好梦 &#127769;</div>
</div>

<script>
// ===== Sound Data =====
const SOUNDS = [
  { id: 'rain', name: '雨声', icon: '&#127783;', color: '#7BAED4',
    params: { type: 'rain', freq: 800, q: 0.5 } },
  { id: 'ocean', name: '海浪', icon: '&#127754;', color: '#5A9BB8',
    params: { type: 'ocean', freq: 300, q: 0.3 } },
  { id: 'forest', name: '森林', icon: '&#127795;', color: '#7BA68A',
    params: { type: 'forest', freq: 2000, q: 0.8 } },
  { id: 'fire', name: '篝火', icon: '&#128293;', color: '#D4834A',
    params: { type: 'fire', freq: 400, q: 0.4 } },
  { id: 'cafe', name: '咖啡馆', icon: '&#9749;', color: '#A08060',
    params: { type: 'cafe', freq: 1000, q: 0.6 } },
  { id: 'fan', name: '风扇', icon: '&#128168;', color: '#8A9BA8',
    params: { type: 'fan', freq: 200, q: 0.2 } }
];

const TIPS = [
  '助眠小贴士：白噪音可以掩盖环境杂音，帮助大脑放松。建议音量调至30%-50%，配合深呼吸更易入睡。',
  '助眠小贴士：睡前1小时避免使用电子屏幕，蓝光会抑制褪黑素分泌，影响入睡质量。',
  '助眠小贴士：保持卧室温度在18-22度之间，微凉的环境更有助于深度睡眠。',
  '助眠小贴士：尝试4-7-8呼吸法：吸气4秒，屏息7秒，呼气8秒，重复几次即可放松。',
  '助眠小贴士：规律的作息时间比睡眠时长更重要，尽量每天同一时间上床睡觉。',
  '助眠小贴士：如果20分钟还睡不着，不妨起身做些轻松的事，等有困意再回床上。'
];

// ===== State =====
let audioCtx = null;
let activeNodes = {};
let playing = {};
let selected = new Set();
let timerMinutes = 0;
let timerInterval = null;
let timerRemaining = 0;
let isPlaying = false;
let masterVolume = 0.5;

// ===== Init =====
function init() {
  loadTheme();
  loadSettings();
  renderSoundGrid();
  renderVolumeControls();
  rotateTip();
  setInterval(rotateTip, 20000);
}

// ===== Theme =====
function toggleTheme() {
  document.documentElement.classList.toggle('dark-mode');
  localStorage.setItem('niujiu_sleep_theme', document.documentElement.classList.contains('dark-mode') ? 'dark' : 'light');
}

function loadTheme() {
  const saved = localStorage.getItem('niujiu_sleep_theme');
  if (saved === 'dark') document.documentElement.classList.add('dark-mode');
  else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.classList.add('dark-mode');
  }
}

// ===== Settings =====
function loadSettings() {
  const saved = localStorage.getItem('niujiu_sleep_settings');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      if (s.selected) s.selected.forEach(id => selected.add(id));
      if (s.volume !== undefined) masterVolume = s.volume;
      if (s.timer) setTimer(s.timer);
    } catch(e) {}
  }
}

function saveSettings() {
  localStorage.setItem('niujiu_sleep_settings', JSON.stringify({
    selected: Array.from(selected),
    volume: masterVolume,
    timer: timerMinutes
  }));
}

// ===== Sound Grid =====
function renderSoundGrid() {
  const grid = document.getElementById('soundGrid');
  grid.innerHTML = SOUNDS.map(s => `
    <div class="sound-card ${selected.has(s.id) ? 'active' : ''}" data-id="${s.id}" onclick="toggleSound('${s.id}')">
      <span class="playing-dot"></span>
      <span class="icon">${s.icon}</span>
      <span class="name">${s.name}</span>
    </div>
  `).join('');
}

// ===== Volume Controls =====
function renderVolumeControls() {
  const container = document.getElementById('volumeControls');
  container.innerHTML = SOUNDS.map(s => `
    <div class="control-row" data-sound="${s.id}" style="display:${selected.has(s.id)?'flex':'none'}">
      <span class="control-label">${s.icon}</span>
      <input type="range" class="volume-slider" min="0" max="100" value="50"
        oninput="setSoundVolume('${s.id}', this.value/100)" id="vol-${s.id}">
      <span class="volume-value" id="volval-${s.id}">50%</span>
    </div>
  `).join('');
}

function updateVolumeVisibility() {
  const section = document.getElementById('volumeSection');
  section.style.display = selected.size > 0 ? 'block' : 'none';
  document.querySelectorAll('.control-row[data-sound]').forEach(row => {
    row.style.display = selected.has(row.dataset.sound) ? 'flex' : 'none';
  });
}

// ===== Audio Engine (Web Audio API) =====
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function createNoiseBuffer(ctx, type) {
  const sampleRate = ctx.sampleRate;
  const length = sampleRate * 2;
  const buffer = ctx.createBuffer(1, length, sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < length; i++) {
    data[i] = Math.random() * 2 - 1;
  }
  return buffer;
}

function createSoundNodes(soundId) {
  const ctx = getAudioCtx();
  const sound = SOUNDS.find(s => s.id === soundId);
  if (!sound) return null;

  const nodes = {};
  const p = sound.params;

  if (p.type === 'rain') {
    const buffer = createNoiseBuffer(ctx, 'pink');
    nodes.source = ctx.createBufferSource();
    nodes.source.buffer = buffer;
    nodes.source.loop = true;
    nodes.filter = ctx.createBiquadFilter();
    nodes.filter.type = 'lowpass';
    nodes.filter.frequency.value = p.freq;
    nodes.filter.Q.value = p.q;
    nodes.gain = ctx.createGain();
    nodes.gain.gain.value = 0;
    nodes.source.connect(nodes.filter);
    nodes.filter.connect(nodes.gain);
    nodes.gain.connect(ctx.destination);
    nodes.source.start();
  } else if (p.type === 'ocean') {
    const buffer = createNoiseBuffer(ctx, 'pink');
    nodes.source = ctx.createBufferSource();
    nodes.source.buffer = buffer;
    nodes.source.loop = true;
    nodes.filter = ctx.createBiquadFilter();
    nodes.filter.type = 'lowpass';
    nodes.filter.frequency.value = p.freq;
    nodes.lfo = ctx.createOscillator();
    nodes.lfo.frequency.value = 0.15;
    nodes.lfoGain = ctx.createGain();
    nodes.lfoGain.gain.value = 150;
    nodes.gain = ctx.createGain();
    nodes.gain.gain.value = 0;
    nodes.lfo.connect(nodes.lfoGain);
    nodes.lfoGain.connect(nodes.filter.frequency);
    nodes.source.connect(nodes.filter);
    nodes.filter.connect(nodes.gain);
    nodes.gain.connect(ctx.destination);
    nodes.lfo.start();
    nodes.source.start();
  } else if (p.type === 'forest') {
    nodes.source = ctx.createOscillator();
    nodes.source.type = 'sine';
    nodes.source.frequency.value = 3200;
    nodes.gain = ctx.createGain();
    nodes.gain.gain.value = 0;
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 12;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 0.015;
    lfo.connect(lfoGain);
    lfoGain.connect(nodes.gain.gain);
    nodes.source.connect(nodes.gain);
    nodes.gain.connect(ctx.destination);
    lfo.start();
    nodes.source.start();
    nodes.lfo = lfo;
  } else if (p.type === 'fire') {
    const buffer = createNoiseBuffer(ctx, 'brown');
    nodes.source = ctx.createBufferSource();
    nodes.source.buffer = buffer;
    nodes.source.loop = true;
    nodes.filter = ctx.createBiquadFilter();
    nodes.filter.type = 'bandpass';
    nodes.filter.frequency.value = p.freq;
    nodes.filter.Q.value = p.q;
    nodes.gain = ctx.createGain();
    nodes.gain.gain.value = 0;
    nodes.source.connect(nodes.filter);
    nodes.filter.connect(nodes.gain);
    nodes.gain.connect(ctx.destination);
    nodes.source.start();
  } else if (p.type === 'cafe') {
    const buffer = createNoiseBuffer(ctx, 'pink');
    nodes.source = ctx.createBufferSource();
    nodes.source.buffer = buffer;
    nodes.source.loop = true;
    nodes.filter = ctx.createBiquadFilter();
    nodes.filter.type = 'bandpass';
    nodes.filter.frequency.value = p.freq;
    nodes.filter.Q.value = p.q;
    nodes.gain = ctx.createGain();
    nodes.gain.gain.value = 0;
    nodes.source.connect(nodes.filter);
    nodes.filter.connect(nodes.gain);
    nodes.gain.connect(ctx.destination);
    nodes.source.start();
  } else if (p.type === 'fan') {
    const buffer = createNoiseBuffer(ctx, 'pink');
    nodes.source = ctx.createBufferSource();
    nodes.source.buffer = buffer;
    nodes.source.loop = true;
    nodes.filter = ctx.createBiquadFilter();
    nodes.filter.type = 'lowpass';
    nodes.filter.frequency.value = p.freq;
    nodes.gain = ctx.createGain();
    nodes.gain.gain.value = 0;
    nodes.source.connect(nodes.filter);
    nodes.filter.connect(nodes.gain);
    nodes.gain.connect(ctx.destination);
    nodes.source.start();
  }

  return nodes;
}

function toggleSound(id) {
  if (selected.has(id)) {
    if (selected.size === 1) {
      stopSound(id);
      selected.delete(id);
    } else {
      stopSound(id);
      selected.delete(id);
    }
  } else {
    if (selected.size >= 2) {
      const first = Array.from(selected)[0];
      stopSound(first);
      selected.delete(first);
    }
    selected.add(id);
    if (isPlaying) startSound(id);
  }
  renderSoundGrid();
  renderVolumeControls();
  updateVolumeVisibility();
  updateStatus();
  saveSettings();
}

function startSound(id) {
  if (activeNodes[id]) return;
  const nodes = createSoundNodes(id);
  if (!nodes) return;
  activeNodes[id] = nodes;
  const vol = getSoundVolume(id);
  const now = getAudioCtx().currentTime;
  nodes.gain.gain.setTargetAtTime(vol * masterVolume * 0.4, now, 0.5);
  playing[id] = true;
}

function stopSound(id) {
  const nodes = activeNodes[id];
  if (!nodes) return;
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  nodes.gain.gain.setTargetAtTime(0, now, 0.3);
  setTimeout(() => {
    try {
      if (nodes.source) nodes.source.stop();
      if (nodes.lfo) nodes.lfo.stop();
    } catch(e) {}
    delete activeNodes[id];
  }, 400);
  delete playing[id];
}

function getSoundVolume(id) {
  const slider = document.getElementById('vol-' + id);
  return slider ? parseInt(slider.value) / 100 : 0.5;
}

function setSoundVolume(id, val) {
  const nodes = activeNodes[id];
  if (nodes) {
    nodes.gain.gain.setTargetAtTime(val * masterVolume * 0.4, getAudioCtx().currentTime, 0.1);
  }
  const label = document.getElementById('volval-' + id);
  if (label) label.textContent = Math.round(val * 100) + '%';
}

// ===== Playback Control =====
function togglePlayPause() {
  if (selected.size === 0) {
    alert('请先选择一种声音');
    return;
  }
  if (isPlaying) {
    pauseAll();
  } else {
    playAll();
  }
}

function playAll() {
  isPlaying = true;
  selected.forEach(id => startSound(id));
  updatePlayBtn();
  updateVisualizer(true);
  updateStatus();
  if (timerMinutes > 0 && !timerInterval) startTimerCountdown();
}

function pauseAll() {
  isPlaying = false;
  Object.keys(activeNodes).forEach(id => {
    const nodes = activeNodes[id];
    if (nodes) {
      const now = getAudioCtx().currentTime;
      nodes.gain.gain.setTargetAtTime(0, now, 0.3);
    }
  });
  setTimeout(() => {
    Object.keys(activeNodes).forEach(id => {
      try {
        const n = activeNodes[id];
        if (n && n.source) n.source.stop();
        if (n && n.lfo) n.lfo.stop();
      } catch(e) {}
    });
    activeNodes = {};
  }, 400);
  playing = {};
  updatePlayBtn();
  updateVisualizer(false);
  updateStatus();
}

function stopAll() {
  pauseAll();
  selected.clear();
  renderSoundGrid();
  renderVolumeControls();
  updateVolumeVisibility();
  updateStatus();
  saveSettings();
  clearTimer();
}

function updatePlayBtn() {
  const btn = document.getElementById('playPauseBtn');
  btn.innerHTML = isPlaying ? '&#10074;&#10074; 暂停' : '&#9654; 播放';
}

// ===== Visualizer =====
function updateVisualizer(active) {
  const rings = document.querySelectorAll('.wave-ring');
  const center = document.getElementById('waveCenter');
  rings.forEach(r => r.classList.toggle('active', active));
  center.classList.toggle('pulse', active);
}

function updateStatus() {
  const el = document.getElementById('playingStatus');
  if (selected.size === 0) {
    el.textContent = '选择一种声音，开始放松';
  } else if (!isPlaying) {
    el.textContent = '已暂停，点击播放继续';
  } else {
    const names = Array.from(selected).map(id => SOUNDS.find(s => s.id === id).name);
    el.textContent = '正在播放：' + names.join(' + ');
  }
}

// ===== Timer =====
function setTimer(min) {
  timerMinutes = min;
  document.querySelectorAll('.timer-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.min) === min);
  });
  const display = document.getElementById('timerDisplay');
  if (min === 0) {
    display.classList.add('hidden');
    clearTimer();
  } else {
    display.classList.remove('hidden');
    timerRemaining = min * 60;
    updateTimerDisplay();
    if (isPlaying) startTimerCountdown();
  }
  saveSettings();
}

function startTimerCountdown() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      pauseAll();
      alert('时间到，祝你好梦！');
      document.getElementById('timerDisplay').classList.add('hidden');
    }
  }, 1000);
}

function clearTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  timerRemaining = 0;
}

function updateTimerDisplay() {
  const m = Math.floor(timerRemaining / 60);
  const s = timerRemaining % 60;
  document.getElementById('timerDisplay').textContent =
    String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

// ===== Tips =====
function rotateTip() {
  const tip = TIPS[Math.floor(Math.random() * TIPS.length)];
  document.getElementById('sleepTip').innerHTML = '<strong>' + tip.split('：')[0] + '：</strong>' + tip.split('：')[1];
}

// ===== Init =====
init();

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>
