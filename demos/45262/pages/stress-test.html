<!DOCTYPE html>
<html lang="zh-CN">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {

    --paper-dark: #F5EDE0;
    --paper-line: #EDE5D8;
    --ink: #3D3229;
    --ink-light: #6B5E52;
    --ink-muted: #A89B8C;
    --accent: #D4834A;
    --accent-light: #E8A87C;
    --accent-soft: #F5D5C0;
    --warm: #C4A882;
    --card-bg: #FFFDF9;
    --shadow: rgba(61,50,41,0.06);
    --shadow-hover: rgba(61,50,41,0.10);
    --blue: #7BAED4;
    --blue-light: #A8D0F0;
    --blue-soft: #D4EAFA;
    --green: #7BA68A;
    --green-light: #A8D4B0;
    --green-soft: #D4EAD8;
    --pink: #D48BA0;
    --pink-light: #F0B0C4;
    --pink-soft: #FAD4DE;
    --yellow: #D4C47B;
    --yellow-light: #F0E4A8;
    --yellow-soft: #FAF0D4;
    --red: #D47B7B;
    --red-light: #F0A8A8;
    --red-soft: #FAD4D4;
    --purple: #9B7BD4;
    --purple-light: #C0A8F0;
    --purple-soft: #E0D4FA;
    --orange: #E89B5A;
    --orange-light: #F0B880;
    --orange-soft: #FAE8D0;
    --gray: #A89B8C;
    --gray-light: #C8BEB2;

    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;

    --shadow-md: 0 4px 16px rgba(61,50,41,0.10);

    --dark-bg: #1A1A2E;

  html.dark-mode {
    --paper: var(--dark-bg);
    --paper-dark: #16213E;
    --paper-line: #2A2A4A;
    --ink: var(--dark-ink);
    --ink-light: #B8B5B0;
    --ink-muted: var(--dark-muted);
    --card-bg: var(--dark-card);
    --shadow: rgba(0,0,0,0.2);
    --shadow-hover: rgba(0,0,0,0.3);
    --accent: var(--dark-accent);
    --accent-light: #F0B880;
    --accent-soft: #3D2E20;
    --blue-soft: #20303D;
    --green-soft: #203D28;
    --pink-soft: #3D2030;
    --yellow-soft: #3D3820;
    --red-soft: #3D2020;
    --purple-soft: #2E2040;
    --orange-soft: #3D2E20;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { transition: background-color var(--transition), color var(--transition); }
  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--paper-dark);
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .handwriting { font-family: 'ZCOOL KuaiLe', 'STKaiti', 'KaiTi', cursive; }

  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--paper);
    position: relative;
    overflow: hidden;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--paper);
    border-bottom: 1px solid var(--paper-line);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .back-btn {
    width: 36px; height: 36px;
    border-radius: var(--radius-full);
    border: 1px solid var(--paper-line);
    background: var(--card-bg);
    color: var(--ink);
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .back-btn:active { transform: scale(0.92); }
  .header-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    color: var(--ink);
  }
  .theme-btn {
    width: 36px; height: 36px;
    border-radius: var(--radius-full);
    border: 1px solid var(--paper-line);
    background: var(--card-bg);
    color: var(--ink);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  .page { display: none; padding: 16px; padding-bottom: 100px; min-height: calc(100vh - 60px); }
  .page.active { display: block; animation: pageIn 0.3s ease; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== HOME PAGE ===== */
  .hero-card {
    background: linear-gradient(135deg, var(--accent-soft), var(--orange-soft));
    border: 1.5px solid var(--accent-light);
    border-radius: var(--radius-xl);
    padding: 28px 20px;
    margin-bottom: 20px;
    text-align: center;
  }
  .hero-icon { font-size: 48px; margin-bottom: 12px; }
  .hero-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 22px;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .hero-desc {
    font-size: 13px;
    color: var(--ink-muted);
    line-height: 1.7;
    margin-bottom: 16px;
  }
  .hero-info {
    display: flex;
    gap: 16px;
    justify-content: center;
    font-size: 12px;
    color: var(--ink-muted);
  }
  .hero-info span { display: flex; align-items: center; gap: 4px; }

  .btn-primary {
    width: 100%;
    padding: 16px;
    border-radius: var(--radius-md);
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    margin-bottom: 16px;
  }
  .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
  .btn-secondary {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius-md);
    background: var(--card-bg);
    color: var(--ink);
    border: 1px solid var(--paper-line);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    margin-bottom: 16px;
  }
  .btn-secondary:active { transform: scale(0.97); background: var(--paper-line); }

  /* ===== TEST PAGE ===== */
  .progress-bar-wrap {
    background: var(--paper-line);
    border-radius: 8px;
    height: 8px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
    transition: width 0.4s ease;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 20px;
  }

  .question-card {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 16px;
    animation: fadeSlide 0.3s ease;
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .question-category {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 12px;
  }
  .question-text {
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink);
    margin-bottom: 16px;
    font-weight: 500;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option-btn {
    padding: 12px 16px;
    border-radius: var(--radius-md);
    border: 1.5px solid var(--paper-line);
    background: var(--paper);
    color: var(--ink);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .option-btn:active { transform: scale(0.98); }
  .option-btn.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 500;
  }
  .option-num {
    width: 24px; height: 24px;
    border-radius: var(--radius-full);
    border: 1.5px solid var(--paper-line);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .option-btn.selected .option-num {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* ===== RESULT PAGE ===== */
  .result-score-card {
    background: linear-gradient(135deg, var(--accent-soft), var(--orange-soft));
    border: 1.5px solid var(--accent-light);
    border-radius: var(--radius-xl);
    padding: 28px 20px;
    margin-bottom: 20px;
    text-align: center;
  }
  .result-score-num {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 72px;
    line-height: 1;
    margin-bottom: 4px;
  }
  .result-score-label {
    font-size: 14px;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }
  .result-level {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 24px;
    margin-bottom: 8px;
  }
  .result-desc {
    font-size: 13px;
    color: var(--ink-light);
    line-height: 1.7;
  }

  .radar-card {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 16px;
    text-align: center;
  }
  .radar-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .radar-svg { width: 100%; max-width: 300px; margin: 0 auto; }

  .dimension-scores {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .dim-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius-md);
  }
  .dim-label {
    font-size: 13px;
    color: var(--ink);
    width: 70px;
    flex-shrink: 0;
  }
  .dim-bar-bg {
    flex: 1;
    height: 8px;
    background: var(--paper-line);
    border-radius: 4px;
    overflow: hidden;
  }
  .dim-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.6s ease;
  }
  .dim-score {
    font-size: 14px;
    font-weight: 600;
    width: 32px;
    text-align: right;
    flex-shrink: 0;
  }

  .advice-card {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 16px;
  }
  .advice-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .advice-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--paper-line);
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink-light);
    display: flex;
    gap: 8px;
  }
  .advice-item:last-child { border-bottom: none; }
  .advice-icon { flex-shrink: 0; font-size: 16px; }

  /* ===== HISTORY PAGE ===== */
  .history-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-muted);
  }
  .history-empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
  .history-list { display: flex; flex-direction: column; gap: 10px; }
  .history-item {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius-md);
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .history-score {
    width: 52px; height: 52px;
    border-radius: var(--radius-full);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .history-score-num {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 20px;
    line-height: 1;
  }
  .history-score-label {
    font-size: 9px;
    margin-top: 2px;
  }
  .history-info { flex: 1; }
  .history-date { font-size: 12px; color: var(--ink-muted); margin-bottom: 4px; }
  .history-level { font-size: 14px; font-weight: 500; color: var(--ink); }
  .history-delete {
    width: 32px; height: 32px;
    border-radius: var(--radius-full);
    border: none;
    background: var(--red-soft);
    color: var(--red);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* Share overlay */
  .share-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 150;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .share-overlay.active { display: flex; }
  .share-card {
    background: var(--card-bg);
    border-radius: var(--radius-xl);
    padding: 20px;
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .share-canvas-wrap {
    border-radius: var(--radius-md);
    overflow: hidden;
    margin-bottom: 16px;
    background: var(--paper);
  }
  .share-canvas-wrap canvas { width: 100%; display: block; }
  .share-btns { display: flex; gap: 10px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 20px;
    border-radius: var(--radius-md);
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--paper-line); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <button class="back-btn" onclick="window.location.href='../niujiu-demo-final.html'">&#8592;</button>
    <div class="header-title handwriting">压力自测</div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">&#9788;</button>
  </div>

  <!-- Home Page -->
  <div class="page active" id="page-home">
    <div class="hero-card">
      <div class="hero-icon">&#128528;</div>
      <div class="hero-title">测测你的压力指数</div>
      <div class="hero-desc">通过20道专业题目，从5个维度全面评估你的压力水平，并获得个性化减压建议。</div>

        <span>&#128203; 20道题目</span>

  <!-- Test Page -->
  <div class="page" id="page-test">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
    </div>
    <div class="progress-info">
      <span id="progressText">第 1/20 题</span>
      <span id="progressPercent">0%</span>

    <div id="questionContainer"></div>
  </div>

  <!-- Result Page -->
  <div class="page" id="page-result">
    <div class="result-score-card" id="resultScoreCard"></div>
    <div class="radar-card">
      <div class="radar-title">&#128200; 五维压力雷达图</div>

    <div class="dimension-scores" id="dimensionScores"></div>
    <div class="advice-card" id="adviceCard"></div>
    <div style="display:flex;gap:10px;">
      <button class="btn-secondary" style="flex:1;" onclick="goHome()">返回首页</button>
      <button class="btn-primary" style="flex:1;" onclick="openShare()">&#128241; 分享结果</button>
    </div>
  </div>

  <!-- History Page -->
  <div class="page" id="page-history">
    <div id="historyContainer">
      <div class="history-empty">
        <div class="history-empty-icon">&#128200;</div>
        <p>还没有测试记录</p>
      </div>
    </div>
    <button class="btn-secondary" style="margin-top:16px;" onclick="goHome()">&#8592; 返回首页</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<!-- Share Overlay -->
<div class="share-overlay" id="shareOverlay" onclick="closeShare(event)">
  <div class="share-card" onclick="event.stopPropagation()">
    <div class="share-canvas-wrap">
      <canvas id="shareCanvas" width="600" height="500"></canvas>
    </div>
    <div class="share-btns">
      <button class="btn-secondary" style="flex:1;" onclick="closeShare()">关闭</button>
      <button class="btn-primary" style="flex:1;" onclick="downloadShare()">保存图片</button>
    </div>
  </div>
</div>

<script>

    '有时这样',
    '经常这样',
    '总是如此'
  ];

  const DIMENSIONS = ['工作压力', '人际压力', '经济压力', '健康压力', '时间压力'];
  const DIM_COLORS = ['#D47B7B', '#7BAED4', '#D4C47B', '#7BA68A', '#9B7BD4'];
  const DIM_BG_COLORS = ['var(--red-soft)', 'var(--blue-soft)', 'var(--yellow-soft)', 'var(--green-soft)', 'var(--purple-soft)'];

  // ===== Init =====
  function init() {
    loadHistory();
    applyTheme();
  }

  // ===== Theme =====
  function applyTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (saved === 'dark' || (!saved && prefersDark)) {
      document.documentElement.classList.add('dark-mode');
      document.getElementById('themeBtn').textContent = '\u263E';
    } else {
      document.documentElement.classList.remove('dark-mode');
      document.getElementById('themeBtn').textContent = '\u263C';
    }
  }
  window.toggleTheme = function() {
    const isDark = document.documentElement.classList.toggle('dark-mode');
    localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
    document.getElementById('themeBtn').textContent = isDark ? '\u263E' : '\u263C';
  };

  // ===== Navigation =====
  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
  }
  window.goHome = function() { showPage('home'); };
  window.showHistory = function() {
    renderHistory();
    showPage('history');
  };

  // ===== Test =====
  window.startTest = function() {
    currentQ = 0;
    answers = new Array(QUESTIONS.length).fill(0);
    showPage('test');
    renderQuestion();
  };

  function renderQuestion() {
    const q = QUESTIONS[currentQ];
    const progress = ((currentQ) / QUESTIONS.length * 100);
    document.getElementById('progressBar').style.width = progress + '%';
    document.getElementById('progressText').textContent = '第 ' + (currentQ + 1) + '/' + QUESTIONS.length + ' 题';
    document.getElementById('progressPercent').textContent = Math.round(progress) + '%';

    const container = document.getElementById('questionContainer');
    let html = '<div class="question-card">';
    html += '<span class="question-category">' + q.cat + '</span>';
    html += '<div class="question-text">' + q.text + '</div>';
    html += '<div class="options">';
    OPTION_LABELS.forEach((label, i) => {
      const score = i + 1;
      html += '<button class="option-btn ' + (answers[currentQ] === score ? 'selected' : '') + '" onclick="selectOption(' + score + ')">';
      html += '<span class="option-num">' + score + '</span>';
      html += '<span>' + label + '</span>';
      html += '</button>';
    });
    html += '</div></div>';
    container.innerHTML = html;
  }

  window.selectOption = function(score) {
    answers[currentQ] = score;
    if (currentQ < QUESTIONS.length - 1) {
      currentQ++;
      renderQuestion();
    } else {
      // Complete
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('progressText').textContent = '完成！';
      document.getElementById('progressPercent').textContent = '100%';
      setTimeout(() => showResult(), 500);
    }
  };

  // ===== Calculate Result =====
  function calculateResult() {
    const dimScores = {};
    DIMENSIONS.forEach(d => dimScores[d] = 0);
    QUESTIONS.forEach((q, i) => {
      dimScores[q.cat] += answers[i];
    });
    // Each dimension: 4 questions, each 1-5, so range 4-20
    // Normalize to 0-100
    const dimNormalized = {};
    DIMENSIONS.forEach(d => {
      dimNormalized[d] = Math.round((dimScores[d] - 4) / 16 * 100);
    });
    const total = answers.reduce((a, b) => a + b, 0);
    return { total, dimScores, dimNormalized };
  }

  // ===== Show Result =====
  function showResult() {
    const result = calculateResult();
    lastResult = result;

    // Save to history
    history.unshift({
      id: Date.now(),
      date: new Date().toLocaleString('zh-CN'),
      dateStr: new Date().toISOString().split('T')[0],
      total: result.total,
      dimScores: result.dimScores,
      dimNormalized: result.dimNormalized,
      answers: [...answers]
    });
    saveHistory();

    // Score card
    const scoreCard = document.getElementById('resultScoreCard');
    let level, levelColor, desc;
    if (result.total <= 40) {
      level = '轻松自在';
      levelColor = 'var(--green)';
      desc = '你的压力水平较低，生活状态比较轻松。继续保持健康的生活方式，适当关注潜在的压力源。';
    } else if (result.total <= 60) {
      level = '适度压力';
      levelColor = 'var(--yellow)';
      desc = '你承受着适度的压力，这在正常范围内。适度的压力可以成为动力，但要注意调节，避免积累。';
    } else if (result.total <= 80) {
      level = '压力较大';
      levelColor = 'var(--accent)';
      desc = '你的压力水平偏高，需要引起重视。建议尝试一些减压方法，必要时寻求专业帮助。';
    } else {
      level = '压力严重';
      levelColor = 'var(--red)';
      desc = '你的压力水平很高，可能已经影响到身心健康。强烈建议你寻求专业的心理咨询帮助。';
    }
    scoreCard.innerHTML = `
      <div class="result-score-num" style="color:${levelColor}">${result.total}</div>
      <div class="result-score-label">总分 (20-100)</div>
      <div class="result-level" style="color:${levelColor}">${level}</div>
      <div class="result-desc">${desc}</div>
    `;

    // Radar chart
    renderRadar(result.dimNormalized);

    // Dimension scores
    const dimContainer = document.getElementById('dimensionScores');
    dimContainer.innerHTML = DIMENSIONS.map((d, i) => {
      const score = result.dimNormalized[d];
      return `
        <div class="dim-row">
          <span class="dim-label">${d}</span>
          <div class="dim-bar-bg">
            <div class="dim-bar-fill" style="width:${score}%;background:${DIM_COLORS[i]}"></div>
          </div>
          <span class="dim-score" style="color:${DIM_COLORS[i]}">${score}</span>
        </div>
      `;
    }).join('');

    // Advice
    renderAdvice(result.dimNormalized);

    showPage('result');
  }

  // ===== Radar Chart =====
  function renderRadar(dimNormalized) {
    const svg = document.getElementById('radarSvg');
    const cx = 150, cy = 150, maxR = 110;
    const n = 5;
    const angleStep = (Math.PI * 2) / n;
    const startAngle = -Math.PI / 2;

    let html = '';

    // Grid lines (5 levels)
    for (let level = 1; level <= 5; level++) {
      const r = (maxR / 5) * level;
      let pathD = '';
      for (let i = 0; i < n; i++) {
        const angle = startAngle + i * angleStep;
        const x = cx + r * Math.cos(angle);
        const y = cy + r * Math.sin(angle);
        pathD += (i === 0 ? 'M ' : 'L ') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
      }
      pathD += 'Z';
      html += '<path d="' + pathD + '" fill="none" stroke="var(--paper-line)" stroke-width="1"/>';
    }

    // Axis lines
    for (let i = 0; i < n; i++) {
      const angle = startAngle + i * angleStep;
      const x = cx + maxR * Math.cos(angle);
      const y = cy + maxR * Math.sin(angle);
      html += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="var(--paper-line)" stroke-width="1"/>';
    }

    // Data polygon
    let dataPathD = '';
    const points = [];
    DIMENSIONS.forEach((d, i) => {
      const val = dimNormalized[d] / 100;
      const r = val * maxR;
      const angle = startAngle + i * angleStep;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      points.push({ x, y });
      dataPathD += (i === 0 ? 'M ' : 'L ') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    });
    dataPathD += 'Z';

    // Fill
    html += '<path d="' + dataPathD + '" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>';

    // Data points
    points.forEach((p, i) => {
      html += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="5" fill="' + DIM_COLORS[i] + '" stroke="var(--card-bg)" stroke-width="2"/>';
    });

    // Labels
    DIMENSIONS.forEach((d, i) => {
      const angle = startAngle + i * angleStep;
      const lx = cx + (maxR + 22) * Math.cos(angle);
      const ly = cy + (maxR + 22) * Math.sin(angle);
      const anchor = Math.abs(Math.cos(angle)) < 0.1 ? 'middle' : Math.cos(angle) > 0 ? 'start' : 'end';
      html += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 4).toFixed(1) + '" text-anchor="' + anchor + '" font-size="11" fill="var(--ink-muted)">' + d + '</text>';
    });

    svg.innerHTML = html;
  }

  // ===== Advice =====
  function renderAdvice(dimNormalized) {
    const adviceData = {
      '工作压力': {
        icon: '&#128188;',
        tips: [
          { threshold: 60, text: '尝试将大任务拆解为小步骤，逐个完成，减轻压迫感。' },
          { threshold: 40, text: '与上级沟通合理的工作量，学会说"不"，设定清晰的边界。' },
          { threshold: 0, text: '你的工作压力管理得不错，继续保持高效的工作节奏。' }
        ]
      },
      '人际压力': {
        icon: '&#129309;',
        tips: [
          { threshold: 60, text: '找一个信任的朋友倾诉，或者考虑寻求专业心理咨询。' },
          { threshold: 40, text: '学习非暴力沟通技巧，用"我感到..."的方式表达需求。' },
          { threshold: 0, text: '你的人际关系状态良好，继续保持真诚的沟通方式。' }
        ]
      },
      '经济压力': {
        icon: '&#128176;',
        tips: [
          { threshold: 60, text: '制定详细的财务计划，优先处理高息债务，考虑增加收入来源。' },
          { threshold: 40, text: '建立应急基金，每月存入一定比例的收入，减少不必要的开支。' },
          { threshold: 0, text: '你的经济状况管理得当，继续保持良好的理财习惯。' }
        ]
      },
      '健康压力': {
        icon: '&#128153;',
        tips: [
          { threshold: 60, text: '建议尽快进行体检，关注身体发出的信号，保证充足睡眠。' },
          { threshold: 40, text: '每天安排30分钟运动时间，注意饮食均衡，规律作息。' },
          { threshold: 0, text: '你的健康状况良好，继续保持运动和健康饮食的习惯。' }
        ]
      },
      '时间压力': {
        icon: '&#9201;',
        tips: [
          { threshold: 60, text: '学习时间管理技巧，使用番茄工作法，学会优先级排序。' },
          { threshold: 40, text: '每天留出"自我时间"，哪怕只有15分钟，做让自己开心的事。' },
          { threshold: 0, text: '你的时间管理做得很好，工作生活平衡掌握得当。' }
        ]
      }
    };

    let html = '<div class="advice-title">&#128161; 个性化减压建议</div>';
    DIMENSIONS.forEach(d => {
      const val = dimNormalized[d];
      const data = adviceData[d];
      let tip = data.tips[data.tips.length - 1].text;
      for (const t of data.tips) {
        if (val >= t.threshold) { tip = t.text; break; }
      }
      html += '<div class="advice-item"><span class="advice-icon">' + data.icon + '</span><span><strong>' + d + '：</strong>' + tip + '</span></div>';
    });
    document.getElementById('adviceCard').innerHTML = html;
  }

  // ===== History =====
  function loadHistory() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch(e) { history = []; }
  }
  function saveHistory() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  }

  function renderHistory() {
    const container = document.getElementById('historyContainer');
    if (history.length === 0) {
      container.innerHTML = '<div class="history-empty"><div class="history-empty-icon">&#128200;</div><p>还没有测试记录</p></div>';
      return;
    }
    container.innerHTML = '<div class="history-list">' + history.map((h, idx) => {
      let level, levelColor, bgColor;
      if (h.total <= 40) { level = '轻松'; levelColor = 'var(--green)'; bgColor = 'var(--green-soft)'; }
      else if (h.total <= 60) { level = '适中'; levelColor = 'var(--yellow)'; bgColor = 'var(--yellow-soft)'; }
      else if (h.total <= 80) { level = '较大'; levelColor = 'var(--accent)'; bgColor = 'var(--accent-soft)'; }
      else { level = '严重'; levelColor = 'var(--red)'; bgColor = 'var(--red-soft)'; }
      return `
        <div class="history-item">
          <div class="history-score" style="background:${bgColor};color:${levelColor}">
            <div class="history-score-num">${h.total}</div>
            <div class="history-score-label">分</div>
          </div>
          <div class="history-info">
            <div class="history-date">${h.date}</div>
            <div class="history-level" style="color:${levelColor}">${level}</div>
          </div>
          <button class="history-delete" onclick="deleteHistory(${idx})">&#128465;</button>
        </div>
      `;
    }).join('') + '</div>';
  }

  window.deleteHistory = function(idx) {
    if (!confirm('确定删除这条记录吗？')) return;
    history.splice(idx, 1);
    saveHistory();
    renderHistory();
    showToast('已删除');
  };

  // ===== Share =====
  window.openShare = function() {
    if (!lastResult) return;
    drawShareCard();
    document.getElementById('shareOverlay').classList.add('active');
  };
  window.closeShare = function(e) {
    if (!e || e.target === document.getElementById('shareOverlay')) {
      document.getElementById('shareOverlay').classList.remove('active');
    }
  };

  function drawShareCard() {
    const canvas = document.getElementById('shareCanvas');
    const ctx = canvas.getContext('2d');
    const w = 600, h = 500;
    canvas.width = w * 2;
    canvas.height = h * 2;
    ctx.scale(2, 2);

    const isDark = document.documentElement.classList.contains('dark-mode');
    const bg = isDark ? '#222244' : '#FFFDF9';
    const textColor = isDark ? '#E8E6E3' : '#3D3229';
    const accent = isDark ? '#E8A060' : '#D4834A';
    const subColor = isDark ? '#7A7670' : '#A89B8C';

    // Background
    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, isDark ? '#2A2040' : '#FFF5EB');
    grad.addColorStop(1, isDark ? '#1A2030' : '#FFF0E0');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // Decorative
    ctx.fillStyle = isDark ? 'rgba(232,160,96,0.08)' : 'rgba(212,131,74,0.06)';
    ctx.beginPath(); ctx.arc(500, 60, 80, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(80, 450, 60, 0, Math.PI * 2); ctx.fill();

    // Title
    ctx.fillStyle = accent;
    ctx.font = 'bold 22px "ZCOOL KuaiLe", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('牛马自救指南 · 压力自测', w / 2, 45);

    // Divider
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(220, 57); ctx.lineTo(380, 57); ctx.stroke();

    // Score
    let level, levelColorHex;
    if (lastResult.total <= 40) { level = '轻松自在'; levelColorHex = '#7BA68A'; }
    else if (lastResult.total <= 60) { level = '适度压力'; levelColorHex = '#D4C47B'; }
    else if (lastResult.total <= 80) { level = '压力较大'; levelColorHex = '#D4834A'; }
    else { level = '压力严重'; levelColorHex = '#D47B7B'; }

    ctx.fillStyle = levelColorHex;
    ctx.font = 'bold 64px "ZCOOL KuaiLe", sans-serif';
    ctx.fillText(String(lastResult.total), w / 2, 140);

    ctx.fillStyle = subColor;
    ctx.font = '14px "Noto Sans SC", sans-serif';
    ctx.fillText('总分 (20-100)', w / 2, 162);

    ctx.fillStyle = levelColorHex;
    ctx.font = 'bold 20px "ZCOOL KuaiLe", sans-serif';
    ctx.fillText(level, w / 2, 195);

    // Dimension bars
    let y = 230;
    DIMENSIONS.forEach((d, i) => {
      const val = lastResult.dimNormalized[d];
      ctx.fillStyle = subColor;
      ctx.font = '13px "Noto Sans SC", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(d, 80, y + 12);

      // Bar bg
      ctx.fillStyle = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.06)';
      roundRect(ctx, 170, y, 300, 16, 8);
      ctx.fill();

      // Bar fill
      const barColors = ['#D47B7B', '#7BAED4', '#D4C47B', '#7BA68A', '#9B7BD4'];
      ctx.fillStyle = barColors[i];
      roundRect(ctx, 170, y, Math.max(val * 3, 8), 16, 8);
      ctx.fill();

      // Score
      ctx.fillStyle = barColors[i];
      ctx.font = 'bold 13px "Noto Sans SC", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(val, 520, y + 13);

      y += 36;
    });

    // Footer
    ctx.fillStyle = accent;
    ctx.font = '13px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('扫码测测你的压力指数', w / 2, h - 20);
  }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  window.downloadShare = function() {
    const canvas = document.getElementById('shareCanvas');
    const link = document.createElement('a');
    link.download = 'stress-test-' + new Date().toISOString().split('T')[0] + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('图片已保存');
  };

  // ===== Toast =====
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  init();
})();

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>
