  .toast {

    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);

    color: var(--paper);
    padding: 10px 24px;
    border-radius: 24px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    pointer-events: none;

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);

  .speaking-indicator .bar:nth-child(3) { animation-delay: 0.3s; height: 10px; }
  @keyframes barAnim {
    0%, 100% { transform: scaleY(0.5); }

</style>

  };

  // ===== 工具函数 =====
  function getToday() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function formatDate(dateStr) {
    var parts = dateStr.split('-');
    return parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
  }

  function formatDateFull(dateStr) {
    var parts = dateStr.split('-');
    var weekDays = ['日', '一', '二', '三', '四', '五', '六'];
    var d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    return parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日 周' + weekDays[d.getDay()];
  }

  function getWeekDay(dateStr) {
    var parts = dateStr.split('-');
    var weekDays = ['日', '一', '二', '三', '四', '五', '六'];
    var d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    return '周' + weekDays[d.getDay()];
  }

  function hashStr(str) {
    var hash = 0;
    for (var i = 0; i < str.length; i++) {
      hash = ((hash << 5) - hash) + str.charCodeAt(i);
      hash = hash & hash;
    }
    return Math.abs(hash);
  }

    try {
      var raw = localStorage.getItem('niujiu_state_v3');

    return null;

  function getRecentMood(state) {
    if (!state) return null;
    var history = state.moodHistory || [];
    if (history.length === 0) return null;
    var recent = history[history.length - 1];
    return recent.mood || null;
  }

  // ===== 获取用户心情频率最高的心情 =====
  function getDominantMood(state) {
    if (!state) return null;
    var history = state.moodHistory || [];
    if (history.length === 0) return null;
    var freq = {};
    for (var i = 0; i < history.length; i++) {
      var m = history[i].mood || 'default';
      freq[m] = (freq[m] || 0) + 1;
    }
    var max = 0, dom = null;
    for (var k in freq) {
      if (freq[k] > max) { max = freq[k]; dom = k; }
    }
    return dom;
  }

  // ===== 智能推荐金句 =====
  function getRecommendedQuote(state) {
    var recentMood = getRecentMood(state);
    var dominantMood = getDominantMood(state);
    var targetMood = recentMood || dominantMood || null;

    // 根据心情匹配金句
    if (targetMood) {
      var moodQuotes = QUOTES.filter(function(q) { return q.mood === targetMood; });
      if (moodQuotes.length > 0) {
        var todayHash = hashStr(getToday());
        return moodQuotes[todayHash % moodQuotes.length];
      }
    }

    // 默认：基于日期的稳定推荐
    var todayHash = hashStr(getToday());
    return QUOTES[todayHash % QUOTES.length];
  }

  // ===== 收藏管理 =====
  function loadFavorites() {
    try {
      var raw = localStorage.getItem('niujiu_daily_quotes_fav');
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return [];
  }

  function saveFavorites(favs) {
    localStorage.setItem('niujiu_daily_quotes_fav', JSON.stringify(favs));
  }

  function isFavorited(text) {
    var favs = loadFavorites();
    return favs.indexOf(text) !== -1;
  }

  // ===== 历史金句管理 =====
  function loadHistory() {
    try {
      var raw = localStorage.getItem('niujiu_daily_quotes_history');
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return [];
  }

  function saveHistory(history) {
    localStorage.setItem('niujiu_daily_quotes_history', JSON.stringify(history));
  }

  function addToHistory(quote, mood) {
    var history = loadHistory();
    var today = getToday();
    // 检查今天是否已有记录
    var existIdx = -1;
    for (var i = 0; i < history.length; i++) {
      if (history[i].date === today) { existIdx = i; break; }
    }
    var entry = {
      date: today,
      text: quote.text,
      mood: mood || quote.mood,
      category: quote.category
    };
    if (existIdx >= 0) {
      history[existIdx] = entry;
    } else {
      history.unshift(entry);
    }
    // 只保留最近30天
    if (history.length > 30) history = history.slice(0, 30);
    saveHistory(history);
    return history;
  }

  // ===== 暗色模式（已由 head 内同步脚本处理） =====
  function applyDarkMode() {
    // 同步脚本已在 head 中执行，此处仅作为兼容性保留
  }

  // ===== Toast =====
  var toastTimer = null;
  function showToast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      el.classList.remove('show');
    }, 2000);
  }

  // ===== 朗读功能 =====
  var currentUtterance = null;
  function speakQuote(type) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      var text = '';
      if (type === 'hero') {
        text = document.getElementById('heroText').textContent;
      } else {
        var el = document.getElementById('quoteText_' + type);
        if (el) text = el.textContent;
      }
      if (!text) return;

      currentUtterance = new SpeechSynthesisUtterance(text);
      currentUtterance.lang = 'zh-CN';
      currentUtterance.rate = 0.9;
      currentUtterance.pitch = 1.1;

      // 尝试选择中文语音
      var voices = window.speechSynthesis.getVoices();
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang.indexOf('zh') !== -1) {
          currentUtterance.voice = voices[i];
          break;
        }
      }

      currentUtterance.onstart = function() {
        if (type === 'hero') {
          document.getElementById('heroSpeakBtn').classList.add('speaking');
        } else {
          var btn = document.getElementById('speakBtn_' + type);
          if (btn) btn.classList.add('speaking');
        }
      };
      currentUtterance.onend = function() {
        if (type === 'hero') {
          document.getElementById('heroSpeakBtn').classList.remove('speaking');
        } else {
          var btn = document.getElementById('speakBtn_' + type);
          if (btn) btn.classList.remove('speaking');
        }
      };

      window.speechSynthesis.speak(currentUtterance);
    } else {
      showToast('当前浏览器不支持朗读功能');
    }
  }

  // 确保语音列表加载
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = function() {};
  }

  // ===== 分享功能 =====
  function shareQuote(type) {
    var text = '';
    if (type === 'hero') {
      text = document.getElementById('heroText').textContent;
    } else {
      var el = document.getElementById('quoteText_' + type);
      if (el) text = el.textContent;
    }
    if (!text) return;

    var shareContent = '\u201C' + text + '\u201D \n\u2014\u2014 \u6765\u81EA\u300A\u725B\u9A6C\u81EA\u6551\u6307\u5357\u300B\u6BCF\u65E5\u4E00\u53E5';

    if (navigator.share) {
      navigator.share({
        title: '\u6BCF\u65E5\u4E00\u53E5 \u00B7 \u725B\u9A6C\u81EA\u6551\u6307\u5357',
        text: shareContent
      }).catch(function() {
        copyToClipboard(shareContent);
      });
    } else {
      copyToClipboard(shareContent);
    }
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() {
        showToast('\u5DF2\u590D\u5236\u5230\u526A\u8D34\u677F');
      }).catch(function() {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast('\u5DF2\u590D\u5236\u5230\u526A\u8D34\u677F');
    } catch(e) {
      showToast('\u590D\u5236\u5931\u8D25\uFF0C\u8BF7\u624B\u52A8\u590D\u5236');
    }
    document.body.removeChild(ta);
  }

  // ===== 收藏切换 =====
  function toggleHeroFav() {
    var text = document.getElementById('heroText').textContent;
    var favs = loadFavorites();
    var idx = favs.indexOf(text);
    var btn = document.getElementById('heroFavBtn');
    if (idx >= 0) {
      favs.splice(idx, 1);
      btn.textContent = '\u2661';
      btn.classList.remove('fav-active');
      showToast('\u5DF2\u53D6\u6D88\u6536\u85CF');
    } else {
      favs.unshift(text);
      btn.textContent = '\u2665';
      btn.classList.add('fav-active');
      showToast('\u5DF2\u6536\u85CF \u2764\uFE0F');
    }
    saveFavorites(favs);
  }

  function toggleCardFav(text, btnId) {
    var favs = loadFavorites();
    var idx = favs.indexOf(text);
    var btn = document.getElementById(btnId);
    if (idx >= 0) {
      favs.splice(idx, 1);
      btn.textContent = '\u2661';
      btn.classList.remove('fav-active');
      showToast('\u5DF2\u53D6\u6D88\u6536\u85CF');
    } else {
      favs.unshift(text);
      btn.textContent = '\u2665';
      btn.classList.add('fav-active');
      showToast('\u5DF2\u6536\u85CF \u2764\uFE0F');
    }
    saveFavorites(favs);
  }

  // ===== 换一句 =====
  var refreshCount = 0;
  function refreshQuote() {
    refreshCount++;
    var state = loadState();
    var recentMood = getRecentMood(state);
    var dominantMood = getDominantMood(state);
    var targetMood = recentMood || dominantMood || null;

    var pool = targetMood
      ? QUOTES.filter(function(q) { return q.mood === targetMood; })
      : QUOTES;

    if (pool.length === 0) pool = QUOTES;
    var idx = (hashStr(getToday()) + refreshCount) % pool.length;
    var quote = pool[idx];

    renderHeroQuote(quote, targetMood);
    addToHistory(quote, targetMood);
    showToast('\u5DF2\u4E3A\u4F60\u6362\u4E86\u4E00\u53E5');
  }

  // ===== 渲染今日金句 =====
  function renderHeroQuote(quote, mood) {
    var moodInfo = mood ? (MOOD_MAP[mood] || MOOD_MAP.default) : MOOD_MAP.default;
    document.getElementById('heroMoodEmoji').textContent = moodInfo.emoji;
    document.getElementById('heroMoodText').textContent = moodInfo.label + '\u00B7\u63A8\u8350';
    document.getElementById('heroText').textContent = quote.text;

    // 更新收藏状态
    var btn = document.getElementById('heroFavBtn');
    if (isFavorited(quote.text)) {
      btn.textContent = '\u2665';
      btn.classList.add('fav-active');
    } else {
      btn.textContent = '\u2661';
      btn.classList.remove('fav-active');
    }
  }

  // ===== 渲染历史列表 =====
  function renderHistory() {
    var history = loadHistory();
    var container = document.getElementById('historyContainer');
    var countEl = document.getElementById('historyCount');

    // 过滤掉今天的（今天已在hero展示）
    var today = getToday();
    var pastHistory = history.filter(function(h) { return h.date !== today; });
    // 只展示最近7天
    pastHistory = pastHistory.slice(0, 7);

    countEl.textContent = pastHistory.length + ' \u6761';

    if (pastHistory.length === 0) {
      container.innerHTML =
        '<div class="empty-state">' +
          '<span class="empty-icon">\u{1F4D6}</span>' +
          '<div class="empty-title">\u8FD8\u6CA1\u6709\u5386\u53F2\u91D1\u53E5\u54E6</div>' +
          '<div class="empty-desc">\u6BCF\u5929\u6253\u5F00\u8FD9\u91CC\uFF0C\u5C31\u80FD\u6536\u96C6\u4E00\u53E5\u4E13\u5C5E\u4E8E\u4F60\u7684\u6CBB\u6108\u91D1\u53E5\u2728</div>' +
        '</div>';
      return;
    }

    var html = '<div class="history-list">';
    for (var i = 0; i < pastHistory.length; i++) {
      var item = pastHistory[i];
      var moodInfo = MOOD_MAP[item.mood] || MOOD_MAP.default;
      var favClass = isFavorited(item.text) ? ' fav-active' : '';
      var favIcon = isFavorited(item.text) ? '\u2665' : '\u2661';
      var cardId = 'card_' + i;

      html +=
        '<div class="quote-card">' +
          '<div class="quote-card-header">' +
            '<div class="quote-card-date">' +
              '<span class="emoji">' + moodInfo.emoji + '</span>' +
              '<span>' + formatDateFull(item.date) + '</span>' +
            '</div>' +
            '<button class="quote-card-fav' + favClass + '" id="favBtn_' + cardId + '" onclick="toggleCardFav(\'' + item.text.replace(/'/g, "\\'").replace(/"/g, '&quot;') + '\', \'favBtn_' + cardId + '\')" aria-label="\u6536\u85CF">' + favIcon + '</button>' +
          '</div>' +
          '<div class="quote-card-text" id="quoteText_' + cardId + '">' + item.text + '</div>' +
          '<div class="quote-card-actions">' +
            '<button class="card-action-btn" id="speakBtn_' + cardId + '" onclick="speakQuote(\'' + cardId + '\')">' +
              '<span class="icon">\u{1F50A}</span>\u6717\u8BFB' +
            '</button>' +
            '<button class="card-action-btn" onclick="shareQuote(\'' + cardId + '\')">' +
              '<span class="icon">\u{1F517}</span>\u5206\u4EAB' +
            '</button>' +
            '<span style="flex:1"></span>' +
            '<span style="font-size:11px;color:var(--ink-muted);background:var(--tag-bg);padding:2px 8px;border-radius:8px;">' + (item.category || '\u6CBB\u6108') + '</span>' +
          '</div>' +
        '</div>';
    }
    html += '</div>';
    container.innerHTML = html;
  }

  // ===== 初始化 =====
  function init() {
    applyDarkMode();

    // 设置日期
    document.getElementById('heroDate').textContent = formatDateFull(getToday());

    // 加载用户数据
    var state = loadState();
    var recentMood = getRecentMood(state);
    var dominantMood = getDominantMood(state);
    var targetMood = recentMood || dominantMood || null;

    // 获取推荐金句
    var quote = getRecommendedQuote(state);

    // 渲染今日金句
    renderHeroQuote(quote, targetMood);

    // 保存到历史
    addToHistory(quote, targetMood);

    // 渲染历史列表
    renderHistory();
  }

  // 暴露全局函数
  window.toggleHeroFav = toggleHeroFav;
  window.toggleCardFav = toggleCardFav;
  window.speakQuote = speakQuote;
  window.shareQuote = shareQuote;
  window.refreshQuote = refreshQuote;

  // 启动
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>
</body>
</html>
