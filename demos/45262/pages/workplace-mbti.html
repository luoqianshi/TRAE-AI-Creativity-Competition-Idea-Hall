<!--
  牛马自救指南 · 职场MBTI测试
  手绘温暖风 · 单文件零依赖
  16种职场人格 · Canvas分享卡片
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="12道职场MBTI测试题，发现你的职场人格类型，获取专属职场优势分析与岗位推荐。">
<meta name="theme-color" content="#D4834A">
<title>牛马自救指南 · 职场MBTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ========== CSS Variables ========== */
:root {
  --paper: #FDF8F0;
  --paper-dark: #F5EDE0;
  --paper-line: #EDE5D8;
  --ink: #3D3229;
  --ink-light: #6B5E52;
  --ink-muted: #A89B8C;
  --accent: #D4834A;
  --accent-light: #E8A87C;
  --accent-soft: #F5D5C0;
  --warm: #C4A882;
  --card-bg: #FFFDF9;
  --shadow: rgba(61,50,41,0.06);
  --shadow-hover: rgba(61,50,41,0.10);
  --blue: #7BAED4;
  --blue-light: #A8D0F0;
  --blue-soft: #D4EAFA;
  --green: #7BA68A;
  --green-light: #A8D4B0;
  --green-soft: #D4EAD8;
  --pink: #D48BA0;
  --pink-light: #F0B0C4;
  --pink-soft: #FAD4DE;
  --yellow: #D4C47B;
  --yellow-light: #F0E4A8;
  --yellow-soft: #FAF0D4;
  --red: #D47B7B;
  --red-light: #F0A8A8;
  --red-soft: #FAD4D4;
  --purple: #9B7BD4;
  --purple-light: #C0A8F0;
  --purple-soft: #E0D4FA;
  --orange: #E89B5A;
  --orange-soft: #FAE8D0;
  --gray: #A89B8C;
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 50%;
  --shadow-sm: 0 2px 8px rgba(61,50,41,0.06);
  --shadow-md: 0 4px 16px rgba(61,50,41,0.10);
  --shadow-lg: 0 8px 32px rgba(212,131,74,0.25);
  --transition: 0.3s ease;
}

html.dark-mode {
  --paper: #1A1A2E;
  --paper-dark: #16213E;
  --paper-line: #2A2A4A;
  --ink: #E8E6E3;
  --ink-light: #B8B5B0;
  --ink-muted: #7A7670;
  --accent: #E8A060;
  --accent-light: #F0B880;
  --accent-soft: #3D2E20;
  --card-bg: #222244;
  --shadow: rgba(0,0,0,0.2);
  --shadow-hover: rgba(0,0,0,0.3);
  --blue-soft: #20303D;
  --green-soft: #203D28;
  --pink-soft: #3D2030;
  --yellow-soft: #3D3820;
  --red-soft: #3D2020;
  --purple-soft: #2E2040;
  --orange-soft: #3D2E20;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { transition: background-color var(--transition), color var(--transition); }
body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--paper-dark);
  color: var(--ink);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.handwriting { font-family: 'ZCOOL KuaiLe', 'STKaiti', 'KaiTi', cursive; }

.app {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--paper);
  position: relative;
  overflow: hidden;
}

/* ========== Header ========== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--paper);
  border-bottom: 1px solid var(--paper-line);
  position: sticky;
  top: 0;
  z-index: 50;
}
.back-btn {
  width: 36px; height: 36px;
  border-radius: var(--radius-full);
  border: 1px solid var(--paper-line);
  background: var(--card-bg);
  color: var(--ink);
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
}
.back-btn:active { transform: scale(0.92); }
.header-title {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 18px;
  color: var(--ink);
}
.theme-btn {
  width: 36px; height: 36px;
  border-radius: var(--radius-full);
  border: 1px solid var(--paper-line);
  background: var(--card-bg);
  color: var(--ink);
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}

/* ========== Page ========== */
.page { display: none; padding: 16px; padding-bottom: 100px; min-height: calc(100vh - 60px); }
.page.active { display: block; animation: pageIn 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes pageIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ========== Cover Page ========== */
.cover-hero {
  background: linear-gradient(135deg, var(--accent-soft), var(--orange-soft));
  border: 1.5px solid var(--accent-light);
  border-radius: var(--radius-xl);
  padding: 32px 24px;
  margin-bottom: 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.cover-hero::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: rgba(212,131,74,0.08);
}
.cover-hero::after {
  content: '';
  position: absolute;
  bottom: -30px; left: -30px;
  width: 100px; height: 100px;
  border-radius: 50%;
  background: rgba(212,131,74,0.06);
}
.cover-icon { font-size: 56px; margin-bottom: 12px; position: relative; z-index: 2; animation: floatEmoji 3s ease-in-out infinite; }
@keyframes floatEmoji { 0%,100%{transform:translateY(0) rotate(0)} 25%{transform:translateY(-6px) rotate(3deg)} 75%{transform:translateY(4px) rotate(-3deg)} }
.cover-title {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 24px;
  color: var(--ink);
  margin-bottom: 8px;
  position: relative; z-index: 2;
}
.cover-desc {
  font-size: 13px;
  color: var(--ink-muted);
  line-height: 1.7;
  margin-bottom: 16px;
  position: relative; z-index: 2;
}
.cover-info {
  display: flex;
  gap: 16px;
  justify-content: center;
  font-size: 12px;
  color: var(--ink-muted);
  position: relative; z-index: 2;
}
.cover-info span { display: flex; align-items: center; gap: 4px; }

.cover-features {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.feature-card {
  background: var(--card-bg);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-lg);
  padding: 16px 12px;
  text-align: center;
}
.feature-icon { font-size: 28px; margin-bottom: 6px; }
.feature-title { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
.feature-desc { font-size: 11px; color: var(--ink-muted); }

/* ========== Buttons ========== */
.btn-primary {
  width: 100%;
  padding: 16px;
  border-radius: var(--radius-md);
  background: var(--accent);
  color: #fff;
  border: none;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  margin-bottom: 12px;
}
.btn-primary:active { transform: scale(0.98); opacity: 0.9; }
.btn-secondary {
  width: 100%;
  padding: 14px;
  border-radius: var(--radius-md);
  background: var(--card-bg);
  color: var(--ink);
  border: 1px solid var(--paper-line);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  margin-bottom: 12px;
}
.btn-secondary:active { transform: scale(0.97); background: var(--paper-line); }

/* ========== Test Page ========== */
.progress-bar-wrap {
  background: var(--paper-line);
  border-radius: 8px;
  height: 8px;
  margin-bottom: 8px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  border-radius: 8px;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  transition: width 0.4s ease;
}
.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--ink-muted);
  margin-bottom: 20px;
}

.question-card {
  background: var(--card-bg);
  border: 1.5px solid var(--paper-line);
  border-radius: var(--radius-lg);
  padding: 24px 20px;
  margin-bottom: 16px;
  animation: fadeSlide 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes fadeSlide { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
.question-dimension {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 10px;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 14px;
}
.question-text {
  font-size: 17px;
  line-height: 1.7;
  color: var(--ink);
  margin-bottom: 20px;
  font-weight: 500;
}
.options { display: flex; flex-direction: column; gap: 10px; }
.option-btn {
  padding: 14px 16px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--paper-line);
  background: var(--paper);
  color: var(--ink);
  font-size: 15px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
}
.option-btn:active { transform: scale(0.98); }
.option-btn:hover { border-color: var(--accent-light); background: var(--accent-soft); }
.option-letter {
  width: 28px; height: 28px;
  border-radius: var(--radius-full);
  border: 1.5px solid var(--paper-line);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
  transition: all 0.2s;
}
.option-btn:hover .option-letter { border-color: var(--accent); color: var(--accent); }

/* ========== Result Page ========== */
.result-hero {
  background: linear-gradient(135deg, var(--accent-soft), var(--orange-soft));
  border: 1.5px solid var(--accent-light);
  border-radius: var(--radius-xl);
  padding: 28px 20px;
  margin-bottom: 16px;
  text-align: center;
  position: relative;
  overflow: hidden;
  animation: cardSlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes cardSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.result-hero::before {
  content: '';
  position: absolute;
  top: -50%; right: -30%;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
}
.result-type-emoji { font-size: 56px; margin-bottom: 8px; position: relative; z-index: 2; animation: floatEmoji 3s ease-in-out infinite; }
.result-type-code {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 36px;
  color: var(--accent);
  margin-bottom: 4px;
  position: relative; z-index: 2;
}
.result-type-name {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 20px;
  color: var(--ink);
  margin-bottom: 8px;
  position: relative; z-index: 2;
}
.result-type-desc {
  font-size: 14px;
  color: var(--ink-light);
  line-height: 1.7;
  position: relative; z-index: 2;
  max-width: 300px;
  margin: 0 auto;
}

/* Dimension bars */
.dimension-card {
  background: var(--card-bg);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 16px;
  animation: cardSlideUp 0.5s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.dim-title {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.dim-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.dim-row:last-child { margin-bottom: 0; }
.dim-label { font-size: 13px; color: var(--ink); width: 24px; flex-shrink: 0; font-weight: 600; }
.dim-bar-bg { flex: 1; height: 10px; background: var(--paper-line); border-radius: 5px; overflow: hidden; position: relative; }
.dim-bar-fill { height: 100%; border-radius: 5px; transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
.dim-bar-left { position: absolute; left: 0; top: 0; height: 100%; border-radius: 5px; transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
.dim-bar-right { position: absolute; right: 0; top: 0; height: 100%; border-radius: 5px; transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
.dim-side-label { font-size: 11px; color: var(--ink-muted); width: 60px; text-align: center; flex-shrink: 0; }

/* Section cards */
.section-card {
  background: var(--card-bg);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 16px;
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}
.section-card.visible { opacity: 1; transform: translateY(0); }
.section-title {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-list { list-style: none; }
.section-list li {
  padding: 8px 0;
  border-bottom: 1px solid var(--paper-line);
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink-light);
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.section-list li:last-child { border-bottom: none; }
.section-list .li-icon { flex-shrink: 0; font-size: 16px; margin-top: 1px; }

/* Jobs */
.job-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.job-tag {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  background: var(--accent-soft);
  color: var(--accent);
}

/* Best match */
.match-card {
  background: linear-gradient(135deg, var(--green-soft), var(--blue-soft));
  border: 1.5px solid var(--green-light);
  border-radius: var(--radius-lg);
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.match-emoji { font-size: 36px; }
.match-info { flex: 1; }
.match-label { font-size: 12px; color: var(--ink-muted); margin-bottom: 2px; }
.match-name { font-family: 'ZCOOL KuaiLe', cursive; font-size: 16px; color: var(--ink); }

/* Action buttons */
.action-btns { display: flex; gap: 10px; margin-top: 8px; }
.action-btns .btn-primary, .action-btns .btn-secondary { flex: 1; margin-bottom: 0; }

/* ========== Share Overlay ========== */
.share-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: 150;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.share-overlay.active { display: flex; }
.share-card {
  background: var(--card-bg);
  border-radius: var(--radius-xl);
  padding: 20px;
  width: 100%;
  max-width: 340px;
  text-align: center;
}
.share-canvas-wrap {
  border-radius: var(--radius-md);
  overflow: hidden;
  margin-bottom: 16px;
  background: var(--paper);
}
.share-canvas-wrap canvas { width: 100%; display: block; }
.share-btns { display: flex; gap: 10px; }

/* ========== Toast ========== */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--paper);
  padding: 10px 20px;
  border-radius: var(--radius-md);
  font-size: 13px;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ========== History ========== */
.history-empty { text-align: center; padding: 60px 20px; color: var(--ink-muted); }
.history-empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.history-list { display: flex; flex-direction: column; gap: 10px; }
.history-item {
  background: var(--card-bg);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.history-emoji { font-size: 32px; }
.history-info { flex: 1; }
.history-date { font-size: 12px; color: var(--ink-muted); margin-bottom: 2px; }
.history-name { font-size: 14px; font-weight: 500; color: var(--ink); }
.history-code { font-size: 12px; color: var(--accent); font-weight: 600; }
.history-delete {
  width: 32px; height: 32px;
  border-radius: var(--radius-full);
  border: none;
  background: var(--red-soft);
  color: var(--red);
  font-size: 14px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--paper-line); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <button class="back-btn" onclick="window.location.href='../niujiu-demo-final.html'">&#8592;</button>
    <div class="header-title handwriting">职场MBTI</div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">&#9788;</button>
  </div>

  <!-- Cover Page -->
  <div class="page active" id="page-cover">
    <div class="cover-hero">
      <div class="cover-icon">&#127891;</div>
      <div class="cover-title">发现你的职场人格</div>
      <div class="cover-desc">基于MBTI理论，12道精选题目，测出你在职场中的真实人格类型，获取专属优势分析与岗位推荐。</div>
      <div class="cover-info">
        <span>&#128203; 12道题目</span>
        <span>&#127919; 16种人格</span>
        <span>&#9201; 约2分钟</span>
      </div>
    </div>
    <div class="cover-features">
      <div class="feature-card">
        <div class="feature-icon">&#128170;</div>
        <div class="feature-title">职场优势</div>
        <div class="feature-desc">发现你的核心竞争力</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">&#128161;</div>
        <div class="feature-title">岗位推荐</div>
        <div class="feature-desc">找到最适合的方向</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">&#129309;</div>
        <div class="feature-title">合拍搭档</div>
        <div class="feature-desc">了解最佳合作伙伴</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">&#128200;</div>
        <div class="feature-title">成长建议</div>
        <div class="feature-desc">突破职场瓶颈</div>
      </div>
    </div>
    <button class="btn-primary" onclick="startTest()">&#128640; 开始测试</button>
    <button class="btn-secondary" onclick="showHistory()">&#128221; 历史记录</button>
  </div>

  <!-- Test Page -->
  <div class="page" id="page-test">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
    </div>
    <div class="progress-info">
      <span id="progressText">第 1/12 题</span>
      <span id="progressPercent">0%</span>
    </div>
    <div id="questionContainer"></div>
  </div>

  <!-- Result Page -->
  <div class="page" id="page-result">
    <div class="result-hero" id="resultHero"></div>
    <div class="dimension-card">
      <div class="dim-title">&#128200; 四维分析</div>
      <div id="dimensionBars"></div>
    </div>
    <div class="section-card" id="strengthsCard">
      <div class="section-title">&#128170; 职场优势</div>
      <ul class="section-list" id="strengthsList"></ul>
    </div>
    <div class="section-card" id="challengesCard">
      <div class="section-title">&#9888; 职场挑战</div>
      <ul class="section-list" id="challengesList"></ul>
    </div>
    <div class="section-card" id="jobsCard">
      <div class="section-title">&#128188; 推荐岗位</div>
      <div class="job-tags" id="jobsTags"></div>
    </div>
    <div class="section-card" id="matchCard">
      <div class="section-title">&#129309; 最佳拍档</div>
      <div id="matchContent"></div>
    </div>
    <div class="action-btns">
      <button class="btn-secondary" onclick="goCover()">返回首页</button>
      <button class="btn-primary" onclick="openShare()">&#128241; 分享结果</button>
    </div>
  </div>

  // ===== Init =====
  function init() {
    loadHistory();
    applyTheme();
    // Check for saved result
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const data = JSON.parse(saved);
        if (data && data.type) {
          lastResult = data;
        }
      }
    } catch(e) {}
  }

  // ===== Theme =====
  function applyTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (saved === 'dark' || (!saved && prefersDark)) {
      document.documentElement.classList.add('dark-mode');
      document.getElementById('themeBtn').textContent = '\u263E';
    } else {
      document.documentElement.classList.remove('dark-mode');
      document.getElementById('themeBtn').textContent = '\u263C';
    }
  }
  window.toggleTheme = function() {
    const isDark = document.documentElement.classList.toggle('dark-mode');
    localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
    document.getElementById('themeBtn').textContent = isDark ? '\u263E' : '\u263C';
  };

  // ===== Navigation =====
  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    window.scrollTo(0, 0);
  }
  window.goCover = function() { showPage('cover'); };
  window.showHistory = function() {
    renderHistory();
    showPage('history');
  };

  // ===== Test =====
  window.startTest = function() {
    currentQ = 0;
    answers = [];
    showPage('test');
    renderQuestion();
  };

  function renderQuestion() {
    const q = QUESTIONS[currentQ];
    const progress = ((currentQ) / QUESTIONS.length * 100);
    document.getElementById('progressBar').style.width = progress + '%';
    document.getElementById('progressText').textContent = '第 ' + (currentQ + 1) + '/' + QUESTIONS.length + ' 题';
    document.getElementById('progressPercent').textContent = Math.round(progress) + '%';

    const container = document.getElementById('questionContainer');
    let html = '<div class="question-card">';
    html += '<span class="question-dimension">' + q.dimName + ' (' + q.dim + ')</span>';
    html += '<div class="question-text">' + q.text + '</div>';
    html += '<div class="options">';
    html += '<button class="option-btn" onclick="selectOption(\'' + q.optA.label + '\')">';
    html += '<span class="option-letter">A</span>';
    html += '<span>' + q.optA.text + '</span>';
    html += '</button>';
    html += '<button class="option-btn" onclick="selectOption(\'' + q.optB.label + '\')">';
    html += '<span class="option-letter">B</span>';
    html += '<span>' + q.optB.text + '</span>';
    html += '</button>';
    html += '</div></div>';
    container.innerHTML = html;
  }

  window.selectOption = function(choice) {
    answers.push(choice);
    if (currentQ < QUESTIONS.length - 1) {
      currentQ++;
      renderQuestion();
    } else {
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('progressText').textContent = '完成！';
      document.getElementById('progressPercent').textContent = '100%';
      setTimeout(() => showResult(), 500);
    }
  };

  // ===== Calculate Result =====
  function calculateResult() {
    const counts = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
    answers.forEach(a => { counts[a]++; });

    const type =
      (counts.E >= counts.I ? 'E' : 'I') +
      (counts.S >= counts.N ? 'S' : 'N') +
      (counts.T >= counts.F ? 'T' : 'F') +
      (counts.J >= counts.P ? 'J' : 'P');

    const dimScores = {
      EI: { E: counts.E, I: counts.I },
      SN: { S: counts.S, N: counts.N },
      TF: { T: counts.T, F: counts.F },
      JP: { J: counts.J, P: counts.P }
    };

    return { type, counts, dimScores };
  }

  // ===== Show Result =====
  function showResult() {
    const result = calculateResult();
    const p = PERSONALITIES[result.type];
    lastResult = {
      id: Date.now(),
      date: new Date().toLocaleString('zh-CN'),
      dateStr: new Date().toISOString().split('T')[0],
      type: result.type,
      name: p.name,
      emoji: p.emoji,
      counts: result.counts,
      dimScores: result.dimScores
    };

    // Save
    saveResult(lastResult);
    history.unshift(lastResult);
    saveHistory();

    // Hero
    const hero = document.getElementById('resultHero');
    hero.innerHTML = `
      <div class="result-type-emoji">${p.emoji}</div>
      <div class="result-type-code">${result.type}</div>
      <div class="result-type-name">${p.name}</div>
      <div class="result-type-desc">${p.desc}</div>
    `;

    // Dimension bars
    renderDimensionBars(result.dimScores);

    // Strengths
    const strengthsList = document.getElementById('strengthsList');
    strengthsList.innerHTML = p.strengths.map(s => '<li><span class="li-icon">&#9989;</span><span>' + s + '</span></li>').join('');

    // Challenges
    const challengesList = document.getElementById('challengesList');
    challengesList.innerHTML = p.challenges.map(c => '<li><span class="li-icon">&#9888;</span><span>' + c + '</span></li>').join('');

    // Jobs
    const jobsTags = document.getElementById('jobsTags');
    jobsTags.innerHTML = p.jobs.map(j => '<span class="job-tag">' + j + '</span>').join('');

    // Match
    const matchP = PERSONALITIES[p.match];
    document.getElementById('matchContent').innerHTML = `
      <div class="match-card">
        <div class="match-emoji">${matchP.emoji}</div>
        <div class="match-info">
          <div class="match-label">与你最合拍的人格</div>
          <div class="match-name">${matchP.name} ${p.match}</div>
        </div>
      </div>
    `;

    showPage('result');

    // Animate section cards
    setTimeout(() => {
      document.querySelectorAll('.section-card').forEach((el, i) => {
        setTimeout(() => el.classList.add('visible'), i * 120);
      });
    }, 300);
  }

  function renderDimensionBars(dimScores) {
    const dims = [
      { key: 'EI', left: 'E', right: 'I', leftColor: '#D4834A', rightColor: '#7BAED4' },
      { key: 'SN', left: 'S', right: 'N', leftColor: '#7BA68A', rightColor: '#9B7BD4' },
      { key: 'TF', left: 'T', right: 'F', leftColor: '#7BAED4', rightColor: '#D48BA0' },
      { key: 'JP', left: 'J', right: 'P', leftColor: '#D4C47B', rightColor: '#E89B5A' }
    ];

    const container = document.getElementById('dimensionBars');
    container.innerHTML = dims.map(d => {
      const total = dimScores[d.key][d.left] + dimScores[d.key][d.right];
      const leftPct = total > 0 ? (dimScores[d.key][d.left] / total * 100) : 50;
      const rightPct = 100 - leftPct;
      const winner = leftPct >= rightPct ? d.left : d.right;
      return `
        <div class="dim-row">
          <span class="dim-side-label" style="color:${d.leftColor};font-weight:${winner===d.left?700:400}">${d.left}</span>
          <div class="dim-bar-bg">
            <div class="dim-bar-left" style="width:${leftPct}%;background:${d.leftColor};opacity:0.7"></div>
            <div class="dim-bar-right" style="width:${rightPct}%;background:${d.rightColor};opacity:0.7"></div>
          </div>
          <span class="dim-side-label" style="color:${d.rightColor};font-weight:${winner===d.right?700:400}">${d.right}</span>
        </div>
      `;
    }).join('');
  }

  // ===== Storage =====
  function saveResult(data) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
  }
  function loadHistory() {
    try {
      const raw = localStorage.getItem('niujiu_mbti_history');
      if (raw) history = JSON.parse(raw);
    } catch(e) { history = []; }
  }
  function saveHistory() {
    try { localStorage.setItem('niujiu_mbti_history', JSON.stringify(history.slice(0, 20))); } catch(e) {}
  }

  function renderHistory() {
    const container = document.getElementById('historyContainer');
    if (history.length === 0) {
      container.innerHTML = '<div class="history-empty"><div class="history-empty-icon">&#128203;</div><p>还没有测试记录</p></div>';
      return;
    }
    container.innerHTML = '<div class="history-list">' + history.map((h, idx) => {
      const p = PERSONALITIES[h.type];
      return `
        <div class="history-item">
          <div class="history-emoji">${p ? p.emoji : '&#128203;'}</div>
          <div class="history-info">
            <div class="history-date">${h.date}</div>
            <div class="history-name">${p ? p.name : ''} <span class="history-code">${h.type}</span></div>
          </div>
          <button class="history-delete" onclick="deleteHistory(${idx})">&#128465;</button>
        </div>
      `;
    }).join('') + '</div>';
  }

  window.deleteHistory = function(idx) {
    if (!confirm('确定删除这条记录吗？')) return;
    history.splice(idx, 1);
    saveHistory();
    renderHistory();
    showToast('已删除');
  };

  // ===== Share =====
  window.openShare = function() {
    if (!lastResult) return;
    drawShareCard();
    document.getElementById('shareOverlay').classList.add('active');
  };
  window.closeShare = function(e) {
    if (!e || e.target === document.getElementById('shareOverlay')) {
      document.getElementById('shareOverlay').classList.remove('active');
    }
  };

  function drawShareCard() {
    const canvas = document.getElementById('shareCanvas');
    const ctx = canvas.getContext('2d');
    const w = 600, h = 700;
    canvas.width = w * 2;
    canvas.height = h * 2;
    ctx.scale(2, 2);

    const isDark = document.documentElement.classList.contains('dark-mode');
    const bg = isDark ? '#222244' : '#FFFDF9';
    const textColor = isDark ? '#E8E6E3' : '#3D3229';
    const accent = isDark ? '#E8A060' : '#D4834A';
    const subColor = isDark ? '#7A7670' : '#A89B8C';
    const cardBg = isDark ? '#2A2A4A' : '#FFF5EB';

    // Background
    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, isDark ? '#2A2040' : '#FFF5EB');
    grad.addColorStop(1, isDark ? '#1A2030' : '#FFF0E0');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // Decorative circles
    ctx.fillStyle = isDark ? 'rgba(232,160,96,0.08)' : 'rgba(212,131,74,0.06)';
    ctx.beginPath(); ctx.arc(520, 80, 90, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(80, 620, 70, 0, Math.PI * 2); ctx.fill();

    // Title
    ctx.fillStyle = accent;
    ctx.font = 'bold 22px "ZCOOL KuaiLe", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('牛马自救指南 · 职场MBTI', w / 2, 45);

    // Divider
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(200, 58); ctx.lineTo(400, 58); ctx.stroke();

    const p = PERSONALITIES[lastResult.type];

    // Emoji
    ctx.font = '64px sans-serif';
    ctx.fillText(p.emoji.replace(/&#(\d+);/g, (_, code) => String.fromCodePoint(code)), w / 2, 130);

    // Type code
    ctx.fillStyle = accent;
    ctx.font = 'bold 48px "ZCOOL KuaiLe", sans-serif';
    ctx.fillText(lastResult.type, w / 2, 185);

    // Name
    ctx.fillStyle = textColor;
    ctx.font = 'bold 22px "ZCOOL KuaiLe", sans-serif';
    ctx.fillText(p.name, w / 2, 220);

    // Desc
    ctx.fillStyle = subColor;
    ctx.font = '14px "Noto Sans SC", sans-serif';
    const descLines = wrapText(ctx, p.desc, 480);
    let y = 250;
    descLines.forEach(line => {
      ctx.fillText(line, w / 2, y);
      y += 22;
    });

    // Strengths card
    y += 10;
    roundRect(ctx, 40, y, w - 80, 110, 14);
    ctx.fillStyle = cardBg;
    ctx.fill();
    ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(212,131,74,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = accent;
    ctx.font = 'bold 16px "ZCOOL KuaiLe", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('职场优势', 60, y + 26);

    ctx.fillStyle = textColor;
    ctx.font = '13px "Noto Sans SC", sans-serif';
    p.strengths.forEach((s, i) => {
      ctx.fillText('• ' + s, 60, y + 50 + i * 22);
    });

    // Jobs
    y += 130;
    ctx.fillStyle = subColor;
    ctx.font = '13px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('推荐岗位', w / 2, y);

    y += 18;
    const jobColors = ['#D4834A', '#7BA68A', '#7BAED4', '#D48BA0'];
    const jobXStart = w / 2 - ((p.jobs.length * 90 + (p.jobs.length - 1) * 8) / 2);
    p.jobs.forEach((job, i) => {
      const tx = jobXStart + i * 98;
      roundRect(ctx, tx, y, 90, 28, 14);
      ctx.fillStyle = isDark ? 'rgba(212,131,74,0.2)' : 'rgba(212,131,74,0.1)';
      ctx.fill();
      ctx.strokeStyle = isDark ? 'rgba(212,131,74,0.3)' : 'rgba(212,131,74,0.25)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = jobColors[i % jobColors.length];
      ctx.font = '12px "Noto Sans SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(job, tx + 45, y + 19);
    });

    // Match
    y += 55;
    const matchP = PERSONALITIES[p.match];
    roundRect(ctx, 40, y, w - 80, 70, 14);
    ctx.fillStyle = isDark ? 'rgba(123,166,138,0.15)' : 'rgba(123,166,138,0.1)';
    ctx.fill();
    ctx.strokeStyle = isDark ? 'rgba(123,166,138,0.3)' : 'rgba(123,166,138,0.25)';
    ctx.stroke();

    ctx.font = '28px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(matchP.emoji.replace(/&#(\d+);/g, (_, code) => String.fromCodePoint(code)), 60, y + 45);

    ctx.fillStyle = subColor;
    ctx.font = '12px "Noto Sans SC", sans-serif';
    ctx.fillText('最佳拍档', 100, y + 24);
    ctx.fillStyle = textColor;
    ctx.font = 'bold 15px "ZCOOL KuaiLe", sans-serif';
    ctx.fillText(matchP.name + ' ' + p.match, 100, y + 46);

    // Footer
    ctx.fillStyle = accent;
    ctx.font = '13px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('扫码发现你的职场人格', w / 2, h - 22);
  }

  function wrapText(ctx, text, maxWidth) {
    const words = text.split('');
    const lines = [];
    let line = '';
    for (let i = 0; i < words.length; i++) {
      const testLine = line + words[i];
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && line !== '') {
        lines.push(line);
        line = words[i];
      } else {
        line = testLine;
      }
    }
    lines.push(line);
    return lines;
  }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  window.downloadShare = function() {
    const canvas = document.getElementById('shareCanvas');
    const link = document.createElement('a');
    link.download = 'workplace-mbti-' + lastResult.type + '-' + new Date().toISOString().split('T')[0] + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('图片已保存');
  };

  // ===== Toast =====
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  init();
})();

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>
