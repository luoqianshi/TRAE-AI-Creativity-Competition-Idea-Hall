<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="牛马自救指南 - 可视化人脉关系图，理清职场社交网络">
<title>人脉关系图 · 牛马自救指南</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f7;
    --bg2: #ffffff;
    --ink: #1d1d1f;
    --ink-muted: #86868b;
    --accent: #E8916A;
    --card-bg: #ffffff;
    --card-shadow: 0 8px 30px rgba(0,0,0,0.12);
    --line-color: rgba(0,0,0,0.12);
    --tag-bg: #f0f0f0;
    --node-shadow: 0 4px 16px rgba(0,0,0,0.10);
    --stat-card: #ffffff;
    --filter-bg: #f0f0f0;
    --filter-active: #E8916A;
    --filter-text: #1d1d1f;
    --filter-active-text: #fff;
    --modal-overlay: rgba(0,0,0,0.45);
    --node-bg: #ffffff;
    --score-high: #34c759;
    --score-mid: #ff9500;
    --score-low: #ff3b30;
    --header-bg: rgba(245,245,247,0.85);
    --loading-bg: #f5f5f7;
  }
  html.dark-mode {
    --bg: #1a1a1e;
    --bg2: #2c2c32;
    --ink: #f5f5f7;
    --ink-muted: #98989f;
    --card-bg: #2c2c32;
    --card-shadow: 0 8px 30px rgba(0,0,0,0.4);
    --line-color: rgba(255,255,255,0.10);
    --tag-bg: #3a3a42;
    --node-shadow: 0 4px 16px rgba(0,0,0,0.3);
    --stat-card: #2c2c32;
    --filter-bg: #3a3a42;
    --filter-text: #f5f5f7;
    --filter-active-text: #fff;
    --modal-overlay: rgba(0,0,0,0.65);
    --node-bg: #2c2c32;
    --header-bg: rgba(26,26,30,0.85);
    --loading-bg: #1a1a1e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.4s, color 0.4s;
    -webkit-font-smoothing: antialiased;
  }
  /* ===== Header ===== */
  .page-header {
    position: sticky; top: 0; z-index: 100;
    background: var(--header-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line-color);
  }
  .page-header .left { display: flex; align-items: center; gap: 12px; }
  .page-header .back-btn {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--filter-bg); color: var(--ink);
    font-size: 18px; cursor: pointer; border: none; transition: all 0.2s;
    text-decoration: none;
  }
  .page-header .back-btn:active { transform: scale(0.9); }
  .page-header h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.3px; }
  .page-header .actions { display: flex; gap: 8px; }
  .page-header .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center;
    background: var(--filter-bg); color: var(--ink); cursor: pointer;
    font-size: 16px; transition: all 0.2s;
  }
  .page-header .icon-btn:active { transform: scale(0.9); }

  /* ===== Loading ===== */
  .loading-screen {
    position: fixed; inset: 0; z-index: 999;
    background: var(--loading-bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.6s, visibility 0.6s;
  }
  .loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .loading-network {
    width: 120px; height: 120px; position: relative; margin-bottom: 24px;
  }
  .loading-network .dot {
    position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); opacity: 0;
    animation: loadDot 1.6s ease-in-out infinite;
  }
  .loading-network .dot:nth-child(1) { top: 50%; left: 50%; transform: translate(-50%,-50%); width: 20px; height: 20px; opacity: 1; background: var(--accent); animation: none; }
  .loading-network .dot:nth-child(2) { top: 10%; left: 50%; animation-delay: 0s; }
  .loading-network .dot:nth-child(3) { top: 50%; left: 90%; animation-delay: 0.2s; }
  .loading-network .dot:nth-child(4) { top: 90%; left: 50%; animation-delay: 0.4s; }
  .loading-network .dot:nth-child(5) { top: 50%; left: 10%; animation-delay: 0.6s; }
  .loading-network .dot:nth-child(6) { top: 18%; left: 18%; animation-delay: 0.1s; }
  .loading-network .dot:nth-child(7) { top: 18%; left: 82%; animation-delay: 0.3s; }
  .loading-network .dot:nth-child(8) { top: 82%; left: 18%; animation-delay: 0.5s; }
  .loading-network .dot:nth-child(9) { top: 82%; left: 82%; animation-delay: 0.7s; }
  @keyframes loadDot {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 0.8; transform: scale(1); }
  }
  .loading-screen p { font-size: 15px; color: var(--ink-muted); letter-spacing: 0.5px; }
  .loading-screen .progress-bar {
    width: 200px; height: 3px; background: var(--line-color); border-radius: 2px;
    margin-top: 16px; overflow: hidden;
  }
  .loading-screen .progress-bar .fill {
    height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #f0a87d);
    border-radius: 2px; transition: width 0.3s;
  }

  /* ===== Stats ===== */
  .stats-bar {
    display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .stats-bar::-webkit-scrollbar { display: none; }
  .stat-card {
    flex: 1; min-width: 100px; background: var(--stat-card); border-radius: 12px;
    padding: 12px; text-align: center; box-shadow: var(--node-shadow);
    border: 1px solid var(--line-color);
  }
  .stat-card .num {
    font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1.2;
  }
  .stat-card .label { font-size: 11px; color: var(--ink-muted); margin-top: 4px; }

  /* ===== Filters ===== */
  .filter-bar {
    display: flex; gap: 8px; padding: 0 16px 12px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-btn {
    flex-shrink: 0; padding: 6px 16px; border-radius: 20px; border: none;
    background: var(--filter-bg); color: var(--filter-text); font-size: 13px;
    cursor: pointer; transition: all 0.25s; font-weight: 500;
  }
  .filter-btn:active { transform: scale(0.95); }
  .filter-btn.active {
    background: var(--filter-active); color: var(--filter-active-text);
  }

  /* ===== Graph ===== */
  .graph-wrapper {
    position: relative; width: 100%; height: calc(100vh - 240px);
    min-height: 420px; overflow: hidden;
  }
  .graph-container {
    position: absolute; inset: 0;
  }
  .graph-container svg.lines {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }
  .graph-container svg.lines line {
    stroke: var(--line-color); stroke-width: 1.5; transition: all 0.4s;
  }
  .graph-container .nodes-layer {
    position: absolute; inset: 0; z-index: 2;
  }

  /* Node */
  .graph-node {
    position: absolute; transform: translate(-50%, -50%);
    cursor: grab; user-select: none; -webkit-user-select: none;
    transition: opacity 0.4s, transform 0.4s;
    touch-action: none;
    z-index: 2;
  }
  .graph-node:active { cursor: grabbing; }
  .graph-node.hidden-node { opacity: 0; pointer-events: none; }
  .graph-node .node-body {
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--node-bg); box-shadow: var(--node-shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 2.5px solid var(--accent); position: relative;
    transition: border-color 0.3s, box-shadow 0.3s;
    animation: nodeFloat 3s ease-in-out infinite;
  }
  .graph-node .node-body .emoji { font-size: 24px; line-height: 1; }
  .graph-node .node-body .score-badge {
    position: absolute; top: -6px; right: -6px;
    width: 22px; height: 22px; border-radius: 50%;
    font-size: 10px; font-weight: 700; color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .graph-node .node-label {
    text-align: center; margin-top: 6px; font-size: 11px;
    font-weight: 500; color: var(--ink); line-height: 1.3;
    max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-shadow: 0 1px 4px var(--bg);
  }
  .graph-node.selected .node-body {
    border-color: var(--accent); box-shadow: 0 0 0 4px rgba(232,145,106,0.25), var(--node-shadow);
  }

  .graph-node .pulse-ring {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid var(--accent); opacity: 0; pointer-events: none;
    animation: pulseRing 2.5s ease-out infinite;
  }
  .graph-node .pulse-ring:nth-child(2) { animation-delay: 0.8s; }

  @keyframes nodeFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-4px); }
  }
  @keyframes pulseRing {
    0% { transform: translate(-50%,-50%) scale(1); opacity: 0.5; }
    100% { transform: translate(-50%,-50%) scale(1.5); opacity: 0; }
  }

  /* Center node */
  .center-node {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); z-index: 3;
    text-align: center;
  }
  .center-node .circle {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #f0a87d);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto; box-shadow: 0 4px 20px rgba(232,145,106,0.35);
    animation: centerPulse 3s ease-in-out infinite;
  }
  .center-node .circle span { font-size: 32px; filter: brightness(1.1); }
  .center-node .label {
    margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--ink);
    text-shadow: 0 1px 4px var(--bg);
  }
  .center-node .sub-label {
    font-size: 11px; color: var(--ink-muted);
  }
  @keyframes centerPulse {
    0%, 100% { box-shadow: 0 4px 20px rgba(232,145,106,0.35); }
    50% { box-shadow: 0 4px 30px rgba(232,145,106,0.55); }
  }

  /* Connection line label */
  .line-label {
    position: absolute; font-size: 10px; color: var(--ink-muted);
    background: var(--node-bg); padding: 2px 8px; border-radius: 10px;
    pointer-events: none; z-index: 3; white-space: nowrap;
    opacity: 0; transition: opacity 0.3s; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    border: 1px solid var(--line-color);
  }
  .line-label.visible { opacity: 1; }

  /* ===== Detail Modal ===== */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: var(--modal-overlay);
    display: none; align-items: flex-end; justify-content: center;
    animation: fadeIn 0.3s;
  }
  .modal-overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .detail-card {
    width: 100%; max-width: 420px; max-height: 80vh;
    background: var(--card-bg); border-radius: 20px 20px 0 0;
    padding: 0; overflow-y: auto;
    animation: slideUp 0.35s ease-out;
    box-shadow: 0 -8px 40px rgba(0,0,0,0.15);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .detail-card .handle {
    width: 40px; height: 4px; border-radius: 2px; background: var(--ink-muted);
    margin: 12px auto; opacity: 0.3;
  }
  .detail-card .card-header {
    display: flex; align-items: center; gap: 16px; padding: 0 20px 20px;
    border-bottom: 1px solid var(--line-color);
  }
  .detail-card .card-header .avatar {
    width: 60px; height: 60px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; background: var(--tag-bg); flex-shrink: 0;
  }
  .detail-card .card-header .info { flex: 1; }
  .detail-card .card-header .info .name {
    font-size: 18px; font-weight: 600; margin-bottom: 2px;
  }
  .detail-card .card-header .info .title {
    font-size: 13px; color: var(--ink-muted);
  }
  .detail-card .card-header .info .archetype {
    display: inline-block; margin-top: 4px;
    padding: 2px 10px; border-radius: 12px;
    background: rgba(232,145,106,0.15); color: var(--accent);
    font-size: 12px; font-weight: 500;
  }
  .detail-card .card-body { padding: 20px; }
  .detail-card .score-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
  }
  .detail-card .score-row .score-label { font-size: 14px; color: var(--ink-muted); }
  .detail-card .score-row .score-bar {
    flex: 1; height: 6px; border-radius: 3px; background: var(--line-color); overflow: hidden;
  }
  .detail-card .score-row .score-bar .fill {
    height: 100%; border-radius: 3px; transition: width 0.6s;
  }
  .detail-card .score-row .score-num {
    font-size: 16px; font-weight: 700; min-width: 32px; text-align: right;
  }
  .detail-card .tags-row {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px;
  }
  .detail-card .tags-row .tag {
    padding: 4px 12px; border-radius: 14px; background: var(--tag-bg);
    font-size: 12px; color: var(--ink);
  }
  .detail-card .dept-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 13px; color: var(--ink-muted); margin-bottom: 12px;
  }
  .detail-card .quote-box {
    background: var(--tag-bg); border-radius: 12px; padding: 16px;
    margin-bottom: 16px; position: relative;
  }
  .detail-card .quote-box::before {
    content: '"'; position: absolute; top: 6px; left: 12px;
    font-size: 32px; color: var(--accent); opacity: 0.3; line-height: 1;
  }
  .detail-card .quote-box .quote-text {
    font-size: 14px; font-style: italic; color: var(--ink); line-height: 1.6;
    padding-left: 12px;
  }
  .detail-card .insight-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .detail-card .insight-item {
    background: var(--tag-bg); border-radius: 10px; padding: 12px; text-align: center;
  }
  .detail-card .insight-item .i-label { font-size: 11px; color: var(--ink-muted); }
  .detail-card .insight-item .i-value { font-size: 14px; font-weight: 600; margin-top: 2px; }
  .detail-card .card-actions {
    display: flex; gap: 10px; padding: 0 20px 24px;
  }
  .detail-card .card-actions button {
    flex: 1; padding: 10px; border-radius: 12px; border: none;
    font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
  }
  .detail-card .card-actions button:active { transform: scale(0.97); }
  .detail-card .card-actions .btn-edit {
    background: var(--filter-bg); color: var(--ink);
  }
  .detail-card .card-actions .btn-close {
    background: var(--accent); color: #fff;
  }

  /* Score edit in modal */
  .score-edit-row {
    display: none; align-items: center; gap: 12px; margin-bottom: 16px;
  }
  .score-edit-row.show { display: flex; }
  .score-edit-row input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none; height: 6px;
    border-radius: 3px; background: var(--line-color); outline: none;
  }
  .score-edit-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .score-edit-row .edit-val {
    font-size: 16px; font-weight: 700; min-width: 32px; text-align: center;
  }
  .score-edit-row .save-score {
    padding: 6px 16px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-size: 13px; cursor: pointer;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 300;
    background: var(--ink); color: var(--bg); padding: 10px 24px;
    border-radius: 24px; font-size: 14px; font-weight: 500;
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
    pointer-events: none; white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-8px); }

  /* ===== Empty state ===== */
  .empty-state {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    text-align: center; color: var(--ink-muted); display: none;
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* Share panel */
  .share-panel {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 250;
    background: var(--card-bg); border-radius: 20px 20px 0 0;
    padding: 20px; display: none; animation: slideUp 0.35s ease-out;
    box-shadow: 0 -8px 40px rgba(0,0,0,0.15);
  }
  .share-panel.show { display: block; }
  .share-panel .handle { width: 40px; height: 4px; border-radius: 2px; background: var(--ink-muted); margin: 0 auto 16px; opacity: 0.3; }
  .share-panel h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; text-align: center; }
  .share-panel .share-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .share-panel .share-options button {
    padding: 14px; border-radius: 12px; border: none;
    font-size: 14px; font-weight: 500; cursor: pointer;
    background: var(--tag-bg); color: var(--ink); transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .share-panel .share-options button:active { transform: scale(0.97); }
  .share-panel .share-options button.primary { background: var(--accent); color: #fff; }

  /* ===== Responsive ===== */
  @media (max-width: 480px) {
    .stat-card { min-width: 80px; padding: 10px 8px; }
    .stat-card .num { font-size: 18px; }
    .graph-wrapper { height: calc(100vh - 220px); min-height: 360px; }
    .graph-node .node-body { width: 52px; height: 52px; }
    .graph-node .node-body .emoji { font-size: 20px; }
    .graph-node .node-label { font-size: 10px; max-width: 68px; }
    .center-node .circle { width: 60px; height: 60px; }
    .center-node .circle span { font-size: 26px; }
  }
</style>
</head>
<body>

<!-- ===== Loading Screen ===== -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-network">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <p>正在构建你的人脉网络...</p>
  <div class="progress-bar"><div class="fill" id="loadProgress"></div></div>
</div>

<!-- ===== Header ===== -->
<header class="page-header">
  <div class="left">
    <button class="back-btn" onclick="window.location.href='../niujiu-demo-final.html'" aria-label="返回">&#8592;</button>
    <h1>人脉关系图</h1>
  </div>
  <div class="actions">
    <button class="icon-btn" onclick="toggleDarkMode()" id="darkToggle" aria-label="切换暗黑模式">&#9790;</button>
    <button class="icon-btn" onclick="showSharePanel()" aria-label="分享">&#8681;</button>
  </div>
</header>

<!-- ===== Stats Bar ===== -->
<div class="stats-bar" id="statsBar">
  <div class="stat-card">
    <div class="num" id="statTotal">0</div>
    <div class="label">人脉总数</div>
  </div>
  <div class="stat-card">
    <div class="num" id="statAvg">0</div>
    <div class="label">平均关系分</div>
  </div>
  <div class="stat-card">
    <div class="num" id="statBest">--</div>
    <div class="label">最强关系</div>
  </div>
  <div class="stat-card">
    <div class="num" id="statWorst">--</div>
    <div class="label">最弱关系</div>
  </div>
</div>

<!-- ===== Filter Bar ===== -->
<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-dept="all">全部</button>
  <button class="filter-btn" data-dept="产品">产品</button>
  <button class="filter-btn" data-dept="技术">技术</button>
  <button class="filter-btn" data-dept="运营">运营</button>
  <button class="filter-btn" data-dept="设计">设计</button>
  <button class="filter-btn" data-dept="老板">老板</button>
</div>

<!-- ===== Graph ===== -->
<div class="graph-wrapper" id="graphWrapper">
  <div class="graph-container" id="graphContainer">
    <svg class="lines" id="linesSvg"></svg>
    <div class="nodes-layer" id="nodesLayer"></div>
    <!-- Center node -->
    <div class="center-node" id="centerNode">
      <div class="circle"><span>&#129303;</span></div>
      <div class="label">我</div>
      <div class="sub-label">打工牛马</div>
    </div>
    <!-- Line labels container -->
    <div id="lineLabelsLayer"></div>
    <!-- Empty state -->
    <div class="empty-state" id="emptyState">

  { id:11, name:'杨小希', emoji:'👩‍💻', title:'发际线战士', dept:'技术', archetype:'加班搭子', score:58, tags:['卷王','社恐','话痨'], quote:QUOTES[4] },
  { id:12, name:'马老师', emoji:'👨‍🏫', title:'企业文化传销员', dept:'老板', archetype:'会议陀螺', score:22, tags:['高冷','腹黑','佛系'], quote:QUOTES[14] },
  { id:13, name:'宋小雨', emoji:'👩‍🍳', title:'外卖品鉴师', dept:'运营', archetype:'午饭搭子', score:81, tags:['社牛','幽默','热心'], quote:QUOTES[12] },
  { id:14, name:'郑克强', emoji:'🧑‍✈️', title:'定时下班侠', dept:'产品', archetype:'茶水间密友', score:64, tags:['佛系','咸鱼','耿直'], quote:QUOTES[1] },
];

// ===================================================================
// State
// ===================================================================
let colleagues = [...COLLEAGUES];
let currentFilter = 'all';
let selectedNodeId = null;
let dragData = null;
let isEditing = false;
let centerX = 0, centerY = 0;
let radius = 0;

// ===================================================================
// Initialization
// ===================================================================
function init() {
  loadPersonalized();
  initDarkMode();
  // Loading animation
  animateLoading();
}

function animateLoading() {
  const bar = document.getElementById('loadProgress');
  let p = 0;
  const interval = setInterval(() => {
    p += Math.random() * 12 + 4;
    if (p >= 100) { p = 100; clearInterval(interval); }
    bar.style.width = p + '%';
    if (p >= 100) {
      setTimeout(() => {
        document.getElementById('loadingScreen').classList.add('hidden');
        buildGraph();
      }, 400);
    }
  }, 180);
}

function getRadius() {
  const w = window.innerWidth;
  const h = document.getElementById('graphWrapper').clientHeight || 420;
  const base = Math.min(w, h) * 0.35;
  return Math.max(110, Math.min(base, 200));
}

function getCenter() {
  const rect = document.getElementById('graphContainer').getBoundingClientRect();
  return { x: rect.width / 2, y: rect.height / 2 };
}

// ===================================================================
// Graph Building
// ===================================================================
function buildGraph() {
  const container = document.getElementById('graphContainer');
  const c = getCenter();
  centerX = c.x; centerY = c.y;
  radius = getRadius();

  renderLines();
  renderNodes();
  updateStats();
}

function getPositions() {
  const positions = [];
  const n = colleagues.length;
  const offset = 0; // use Math.PI for offset
  for (let i = 0; i < n; i++) {
    const angle = (2 * Math.PI * i) / n + offset;
    const r = radius + (Math.random() - 0.5) * radius * 0.15;
    positions.push({
      x: centerX + r * Math.cos(angle),
      y: centerY + r * Math.sin(angle),
      angle
    });
  }
  return positions;
}

// ===== Lines =====
function renderLines() {
  const svg = document.getElementById('linesSvg');
  const container = document.getElementById('graphContainer');
  const w = container.clientWidth || 400;
  const h = container.clientHeight || 420;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);

  const pos = getPositions();
  let html = '';
  const filtered = currentFilter === 'all'
    ? colleagues.map((_,i) => i)
    : colleagues.reduce((acc, c, i) => { if (c.dept === currentFilter) acc.push(i); return acc; }, []);

  for (let i = 0; i < pos.length; i++) {
    const c = colleagues[i];
    const show = filtered.includes(i);
    const thickness = Math.max(1.5, (c.score / 100) * 4);
    const opacity = Math.max(0.2, c.score / 100);
    const color = getScoreColor(c.score);

    html += `<line x1="${centerX}" y1="${centerY}" x2="${pos[i].x}" y2="${pos[i].y}"
      stroke="${color}" stroke-width="${thickness}" stroke-opacity="${opacity}"
      data-index="${i}" class="conn-line ${show ? '' : 'hidden-line'}" />`;
  }
  // Inter-node lines (close relationships)
  for (let i = 0; i < pos.length; i++) {
    for (let j = i + 1; j < pos.length; j++) {
      const ci = colleagues[i], cj = colleagues[j];
      const avgScore = (ci.score + cj.score) / 2;
      if (avgScore > 70) {
        const show = currentFilter === 'all' || (filtered.includes(i) && filtered.includes(j));
        const interThick = Math.max(0.8, (avgScore / 100) * 2);
        html += `<line x1="${pos[i].x}" y1="${pos[i].y}" x2="${pos[j].x}" y2="${pos[j].y}"
          stroke="${getScoreColor(avgScore)}" stroke-width="${interThick}" stroke-opacity="0.15"
          data-from="${i}" data-to="${j}" class="inter-line ${show ? '' : 'hidden-line'}" />`;
      }
    }
  }

  svg.innerHTML = html;

  // Line labels
  renderLineLabels(pos);
}

function renderLineLabels(positions) {
  const layer = document.getElementById('lineLabelsLayer');
  if (!layer) return;
  // Use positions passed or compute
  const pos = positions || getPositions();
  let lblHtml = '';
  for (let i = 0; i < colleagues.length; i++) {
    const mx = (centerX + pos[i].x) / 2;
    const my = (centerY + pos[i].y) / 2;
    const c = colleagues[i];
    let type = '普通关系';
    if (c.score >= 80) type = '&#128293; 铁哥们';
    else if (c.score >= 60) type = '&#128578; 好同事';
    else if (c.score >= 40) type = '&#128528; 点头之交';
    else type = '&#128560; 表面关系';
    lblHtml += `<div class="line-label" data-line-label="${i}" style="left:${mx}px;top:${my}px">${type}</div>`;
  }
  layer.innerHTML = lblHtml;
}

function showLineLabel(index) {
  document.querySelectorAll('.line-label').forEach(el => el.classList.remove('visible'));
  const el = document.querySelector(`.line-label[data-line-label="${index}"]`);
  if (el) el.classList.add('visible');
}

function hideAllLineLabels() {
  document.querySelectorAll('.line-label').forEach(el => el.classList.remove('visible'));
}

// ===== Nodes =====
function renderNodes() {
  const layer = document.getElementById('nodesLayer');
  const pos = getPositions();
  const filtered = currentFilter === 'all'
    ? colleagues.map((_,i) => i)
    : colleagues.reduce((acc, c, i) => { if (c.dept === currentFilter) acc.push(i); return acc; }, []);

  const visibleCount = filtered.length;
  document.getElementById('emptyState').style.display = visibleCount === 0 && currentFilter !== 'all' ? 'block' : 'none';

  let html = '';
  for (let i = 0; i < colleagues.length; i++) {
    const c = colleagues[i];
    const isVisible = filtered.includes(i);
    const hidden = isVisible ? '' : 'hidden-node';
    const scoreColor = getScoreColor(c.score);
    const animDelay = (i * 0.12).toFixed(1);

    html += `<div class="graph-node ${hidden}" data-index="${i}" id="node-${i}"
      style="left:${pos[i].x}px;top:${pos[i].y}px;animation-delay:${animDelay}s"
      onpointerdown="startDrag(event, ${i})"
      onclick="selectNode(${i})">
      <div class="node-body" style="animation-delay:${animDelay}s">
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <span class="emoji">${c.emoji}</span>
        <span class="score-badge" style="background:${scoreColor}">${c.score}</span>
      </div>
      <div class="node-label">${c.name}</div>
    </div>`;
  }
  layer.innerHTML = html;
}

// ===================================================================
// Drag Interaction (Pointer + Touch)
// ===================================================================
let dragState = null;

function startDrag(e, index) {
  if (e.button !== undefined && e.button !== 0) return;
  const node = document.getElementById(`node-${index}`);
  if (!node || node.classList.contains('hidden-node')) return;
  e.preventDefault();

  const rect = document.getElementById('graphContainer').getBoundingClientRect();
  const clientX = e.clientX || (e.touches && e.touches[0].clientX);
  const clientY = e.clientY || (e.touches && e.touches[0].clientY);

  dragState = {
    index,
    offsetX: clientX - rect.left - parseFloat(node.style.left),
    offsetY: clientY - rect.top - parseFloat(node.style.top),
    rect
  };
  node.style.zIndex = 10;
  node.style.transition = 'none';

  // Prevent page scroll during drag
  document.addEventListener('pointermove', onDrag);
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('touchmove', onDragTouch, { passive: false });
  document.addEventListener('touchend', endDragTouch);
}

function onDrag(e) {
  if (!dragState) return;
  e.preventDefault();
  const rect = document.getElementById('graphContainer').getBoundingClientRect();
  const x = e.clientX - rect.left - dragState.offsetX;
  const y = e.clientY - rect.top - dragState.offsetY;
  updateNodePos(dragState.index, x, y);
}

function onDragTouch(e) {
  if (!dragState) return;
  e.preventDefault();
  const touch = e.touches[0];
  const rect = document.getElementById('graphContainer').getBoundingClientRect();
  const x = touch.clientX - rect.left - dragState.offsetX;
  const y = touch.clientY - rect.top - dragState.offsetY;
  updateNodePos(dragState.index, x, y);
}

function endDrag() {
  if (dragState) {
    const node = document.getElementById(`node-${dragState.index}`);
    if (node) { node.style.zIndex = 2; node.style.transition = ''; }
    dragState = null;
  }
  document.removeEventListener('pointermove', onDrag);
  document.removeEventListener('pointerup', endDrag);
  document.removeEventListener('touchmove', onDragTouch);
  document.removeEventListener('touchend', endDragTouch);
}

function endDragTouch() { endDrag(); }

function updateNodePos(index, x, y) {
  const node = document.getElementById(`node-${index}`);
  if (!node) return;
  node.style.left = x + 'px';
  node.style.top = y + 'px';
  // Update connected lines
  updateLinesForNode(index, x, y);
}

function updateLinesForNode(index, x, y) {
  const svg = document.getElementById('linesSvg');
  const lines = svg.querySelectorAll(`line[data-index="${index}"]`);
  lines.forEach(line => {
    line.setAttribute('x2', x.toString());
    line.setAttribute('y2', y.toString());
  });
  // Update inter-node lines
  const interLines = svg.querySelectorAll(`line[data-from="${index}"], line[data-to="${index}"]`);
  interLines.forEach(line => {
    const from = parseInt(line.getAttribute('data-from'));
    const to = parseInt(line.getAttribute('data-to'));
    const pos = getCurrentPositions();
    if (from === index) {
      line.setAttribute('x1', x.toString());
      line.setAttribute('y1', y.toString());
    } else {
      line.setAttribute('x2', x.toString());
      line.setAttribute('y2', y.toString());
    }
  });
  // Update line label
  const lbl = document.querySelector(`.line-label[data-line-label="${index}"]`);
  if (lbl) {
    const mx = (centerX + x) / 2;
    const my = (centerY + y) / 2;
    lbl.style.left = mx + 'px';
    lbl.style.top = my + 'px';
  }
}

function getCurrentPositions() {
  const pos = {};
  for (let i = 0; i < colleagues.length; i++) {
    const node = document.getElementById(`node-${i}`);
    if (node) {
      pos[i] = {
        x: parseFloat(node.style.left),
        y: parseFloat(node.style.top)
      };
    }
  }
  return pos;
}

// ===================================================================
// Node Selection & Detail Card
// ===================================================================
function selectNode(index) {
  const node = document.getElementById(`node-${index}`);
  if (!node || node.classList.contains('hidden-node')) return;

  // Deselect previous
  document.querySelectorAll('.graph-node.selected').forEach(el => el.classList.remove('selected'));
  node.classList.add('selected');
  selectedNodeId = index;

  showLineLabel(index);
  showDetail(index);
}

function showDetail(index) {
  const c = colleagues[index];
  if (!c) return;
  isEditing = false;
  const header = document.getElementById('detailHeader');
  const body = document.getElementById('detailBody');
  const scoreColor = getScoreColor(c.score);

  header.innerHTML = `
    <div class="avatar">${c.emoji}</div>
    <div class="info">
      <div class="name">${c.name}</div>
      <div class="title">${c.title}</div>
      <span class="archetype">${c.archetype}</span>
    </div>
  `;

  const tags = c.tags.map(t => `<span class="tag">${t}</span>`).join('');

  body.innerHTML = `
    <div class="dept-badge">&#128188; ${c.dept}部门</div>
    <div class="score-row" id="scoreRow">
      <span class="score-label">关系分</span>
      <div class="score-bar"><div class="fill" style="width:${c.score}%;background:${scoreColor}"></div></div>
      <span class="score-num" id="scoreNum">${c.score}</span>
    </div>
    <div class="score-edit-row" id="scoreEditRow">
      <span class="edit-val" id="editVal">${c.score}</span>
      <input type="range" min="0" max="100" value="${c.score}" id="scoreSlider" oninput="onScoreEdit(${index})">
      <button class="save-score" onclick="saveScore(${index})">保存</button>
    </div>
    <div class="tags-row">${tags}</div>
    <div class="quote-box">
      <div class="quote-text">${c.quote}</div>
    </div>
    <div class="insight-row">
      <div class="insight-item">
        <div class="i-label">关系状态</div>
        <div class="i-value" style="color:${scoreColor}">${getRelationLevel(c.score)}</div>
      </div>
      <div class="insight-item">
        <div class="i-label">互动频率</div>
        <div class="i-value">${getFreq(c.score)}</div>
      </div>
      <div class="insight-item">
        <div class="i-label">靠谱指数</div>
        <div class="i-value">${c.score >= 60 ? '&#9989;' : '&#10060;'} ${c.score >= 80 ? '极高' : c.score >= 60 ? '较高' : '一般'}</div>
      </div>
      <div class="insight-item">
        <div class="i-label">推荐合作</div>
        <div class="i-value">${c.score >= 70 ? '&#9989; 强烈推荐' : c.score >= 40 ? '&#128200; 可合作' : '&#128683; 谨慎'}</div>
      </div>
    </div>
  `;

  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('modalOverlay').classList.remove('show');
  document.querySelectorAll('.graph-node.selected').forEach(el => el.classList.remove('selected'));
  hideAllLineLabels();
  selectedNodeId = null;
  isEditing = false;
}

function toggleEditScore() {
  const row = document.getElementById('scoreEditRow');
  if (!row) return;
  isEditing = !isEditing;
  row.classList.toggle('show', isEditing);
  if (isEditing && selectedNodeId !== null) {
    const c = colleagues[selectedNodeId];
    document.getElementById('scoreSlider').value = c.score;
    document.getElementById('editVal').textContent = c.score;
  }
}

function onScoreEdit(index) {
  const val = parseInt(document.getElementById('scoreSlider').value);
  document.getElementById('editVal').textContent = val;
  // Live preview
  const c = colleagues[index];
  const scoreColor = getScoreColor(val);
  document.querySelector('#scoreRow .fill').style.width = val + '%';
  document.querySelector('#scoreRow .fill').style.background = scoreColor;
  document.getElementById('scoreNum').textContent = val;
}

function saveScore(index) {
  const val = parseInt(document.getElementById('scoreSlider').value);
  colleagues[index].score = val;
  savePersonalized();
  document.getElementById('scoreRow').querySelector('.fill').style.width = val + '%';
  document.getElementById('scoreRow').querySelector('.fill').style.background = getScoreColor(val);
  document.getElementById('scoreNum').textContent = val;
  // Update node badge
  const badge = document.querySelector(`#node-${index} .score-badge`);
  if (badge) {
    badge.textContent = val;
    badge.style.background = getScoreColor(val);
  }
  // Update lines
  updateLinesForNodeColor(index);
  updateStats();
  isEditing = false;
  document.getElementById('scoreEditRow').classList.remove('show');
  showToast('关系分已更新');
}

function updateLinesForNodeColor(index) {
  const c = colleagues[index];
  const svg = document.getElementById('linesSvg');
  const lines = svg.querySelectorAll(`line[data-index="${index}"]`);
  const thickness = Math.max(1.5, (c.score / 100) * 4);
  const opacity = Math.max(0.2, c.score / 100);
  lines.forEach(line => {
    line.setAttribute('stroke', getScoreColor(c.score));
    line.setAttribute('stroke-width', thickness.toString());
    line.setAttribute('stroke-opacity', opacity.toString());
  });
}

// ===================================================================
// Filters
// ===================================================================
document.getElementById('filterBar').addEventListener('click', function(e) {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.dept;
  applyFilter();
});

function applyFilter() {
  const filtered = currentFilter === 'all'
    ? colleagues.map((_,i) => i)
    : colleagues.reduce((acc, c, i) => { if (c.dept === currentFilter) acc.push(i); return acc; }, []);

  // Toggle nodes
  colleagues.forEach((_, i) => {
    const node = document.getElementById(`node-${i}`);
    if (!node) return;
    const show = filtered.includes(i);
    node.classList.toggle('hidden-node', !show);
  });

  // Toggle lines
  document.querySelectorAll('.conn-line').forEach(line => {
    const idx = parseInt(line.getAttribute('data-index'));
    line.classList.toggle('hidden-line', !filtered.includes(idx));
  });
  document.querySelectorAll('.inter-line').forEach(line => {
    const from = parseInt(line.getAttribute('data-from'));
    const to = parseInt(line.getAttribute('data-to'));
    const show = currentFilter === 'all' || (filtered.includes(from) && filtered.includes(to));
    line.classList.toggle('hidden-line', !show);
  });

  // Line labels
  document.querySelectorAll('.line-label').forEach(el => {
    const idx = parseInt(el.getAttribute('data-line-label'));
    el.classList.toggle('hidden-node', !filtered.includes(idx));
  });

  document.getElementById('emptyState').style.display = filtered.length === 0 && currentFilter !== 'all' ? 'block' : 'none';
  updateStats();
}

// ===================================================================
// Stats
// ===================================================================
function updateStats() {
  const filtered = currentFilter === 'all'
    ? colleagues
    : colleagues.filter(c => c.dept === currentFilter);

  const total = filtered.length;
  const avg = total > 0 ? Math.round(filtered.reduce((s, c) => s + c.score, 0) / total) : 0;

  let best = null, worst = null;
  if (total > 0) {
    best = filtered.reduce((a, b) => a.score >= b.score ? a : b);
    worst = filtered.reduce((a, b) => a.score <= b.score ? a : b);
  }

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statAvg').textContent = avg;
  document.getElementById('statBest').textContent = best ? `${best.emoji} ${best.name}(${best.score})` : '--';
  document.getElementById('statWorst').textContent = worst ? `${worst.emoji} ${worst.name}(${worst.score})` : '--';
}

// ===================================================================
// Helpers
// ===================================================================
function getScoreColor(s) {
  if (s >= 70) return '#34c759';
  if (s >= 40) return '#ff9500';
  return '#ff3b30';
}

function getRelationLevel(s) {
  if (s >= 80) return '亲密战友';
  if (s >= 60) return '靠谱伙伴';
  if (s >= 40) return '普通同事';
  return '表面关系';
}

function getFreq(s) {
  if (s >= 80) return '每天互吹';
  if (s >= 60) return '每周约饭';
  if (s >= 40) return '开会碰面';
  return '能不聊就不聊';
}

// ===================================================================
// Dark Mode
// ===================================================================
function initDarkMode() {
  const isDark = localStorage.getItem('darkMode') === 'true';
  if (isDark) {
    document.documentElement.classList.add('dark-mode');
    document.getElementById('darkToggle').innerHTML = '&#9788;';
  }
}

function toggleDarkMode() {
  const html = document.documentElement;
  const isDark = html.classList.contains('dark-mode');
  if (isDark) {
    html.classList.remove('dark-mode');
    localStorage.setItem('darkMode', 'false');
    document.getElementById('darkToggle').innerHTML = '&#9790;';
  } else {
    html.classList.add('dark-mode');
    localStorage.setItem('darkMode', 'true');
    document.getElementById('darkToggle').innerHTML = '&#9788;';
  }
}

// ===================================================================
// localStorage Persistence
// ===================================================================
function savePersonalized() {
  const data = colleagues.map(c => ({ id: c.id, score: c.score }));
  localStorage.setItem('social_graph_personalized', JSON.stringify(data));
}

function loadPersonalized() {
  try {
    const raw = localStorage.getItem('social_graph_personalized');
    if (!raw) return;
    const data = JSON.parse(raw);
    data.forEach(d => {
      const c = colleagues.find(col => col.id === d.id);
      if (c) c.score = d.score;
    });
  } catch(e) {}
}

// ===================================================================
// Share
// ===================================================================
function showSharePanel() {
  document.getElementById('sharePanel').classList.add('show');
}

function hideSharePanel() {
  document.getElementById('sharePanel').classList.remove('show');
}

function shareAsText() {
  const lines = colleagues.map(c =>
    `${c.emoji} ${c.name} (${c.title}) - ${c.archetype} - 关系分:${c.score}`
  ).join('\n');
  const text = `【人脉关系图】牛马自救指南\n${'='.repeat(20)}\n${lines}\n${'='.repeat(20)}\n平均关系分: ${Math.round(colleagues.reduce((s,c) => s + c.score, 0) / colleagues.length)}\n\n-- 来自 牛马自救指南`;
  copyToClipboard(text);
  hideSharePanel();
  showToast('文字已复制到剪贴板');
}

function copyShareText() {
  shareAsText();
}

function shareAsImage() {
  hideSharePanel();
  showToast('正在生成截图...');
  // Use canvas to capture the graph area
  setTimeout(captureGraph, 300);
}

function captureGraph() {
  const wrapper = document.getElementById('graphWrapper');
  // Use html2canvas-like approach: create a canvas from DOM
  // Since we can't use external libs, we'll draw a simplified version
  const canvas = document.createElement('canvas');
  const w = wrapper.offsetWidth;
  const h = wrapper.offsetHeight;
  canvas.width = w * 2;
  canvas.height = h * 2;
  const ctx = canvas.getContext('2d');
  ctx.scale(2, 2);

  // Background
  const isDark = document.documentElement.classList.contains('dark-mode');
  ctx.fillStyle = isDark ? '#1a1a1e' : '#f5f5f7';
  ctx.fillRect(0, 0, w, h);

  // Title
  ctx.fillStyle = isDark ? '#f5f5f7' : '#1d1d1f';
  ctx.font = 'bold 18px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('人脉关系图 | 牛马自救指南', w / 2, 36);

  // Draw connections
  const pos = getCurrentPositions();
  for (let i = 0; i < colleagues.length; i++) {
    const p = pos[i];
    if (!p) continue;
    const c = colleagues[i];
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = getScoreColor(c.score);
    ctx.globalAlpha = Math.max(0.3, c.score / 100);
    ctx.lineWidth = Math.max(1.5, (c.score / 100) * 4);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Draw nodes
  colleagues.forEach((c, i) => {
    const p = pos[i];
    if (!p) return;
    const x = p.x, y = p.y;
    // Circle
    ctx.beginPath();
    ctx.arc(x, y, 26, 0, Math.PI * 2);
    ctx.fillStyle = isDark ? '#2c2c32' : '#ffffff';
    ctx.fill();
    ctx.strokeStyle = getScoreColor(c.score);
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Emoji
    ctx.font = '22px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = isDark ? '#f5f5f7' : '#1d1d1f';
    ctx.fillText(c.emoji, x, y - 2);

    // Score badge
    const badgeX = x + 18, badgeY = y - 18;
    ctx.beginPath();
    ctx.arc(badgeX, badgeY, 11, 0, Math.PI * 2);
    ctx.fillStyle = getScoreColor(c.score);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.score.toString(), badgeX, badgeY);

    // Name
    ctx.fillStyle = isDark ? '#f5f5f7' : '#1d1d1f';
    ctx.font = '11px -apple-system, sans-serif';
    ctx.textBaseline = 'top';
    ctx.fillText(c.name, x, y + 30);
  });

  // Center node
  ctx.beginPath();
  ctx.arc(centerX, centerY, 34, 0, Math.PI * 2);
  const grad = ctx.createLinearGradient(centerX - 34, centerY - 34, centerX + 34, centerY + 34);
  grad.addColorStop(0, '#E8916A');
  grad.addColorStop(1, '#f0a87d');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.font = '28px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🤝', centerX, centerY);
  ctx.fillStyle = isDark ? '#f5f5f7' : '#1d1d1f';
  ctx.font = 'bold 12px -apple-system, sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillText('我', centerX, centerY + 38);

  // Stats
  const total = colleagues.length;
  const avg = Math.round(colleagues.reduce((s, c) => s + c.score, 0) / total);
  ctx.fillStyle = isDark ? '#98989f' : '#86868b';
  ctx.font = '12px -apple-system, sans-serif';
  ctx.textBaseline = 'bottom';
  ctx.fillText(`共${total}人脉 · 平均分${avg} · ${new Date().toLocaleDateString()}`, w / 2, h - 16);

  // Download
  const link = document.createElement('a');
  link.download = '人脉关系图.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('截图已保存');
}

// ===================================================================
// Toast
// ===================================================================
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ===================================================================
// Clipboard
// ===================================================================
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

// ===================================================================
// Resize Handler
// ===================================================================
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const c = getCenter();
    centerX = c.x; centerY = c.y;
    radius = getRadius();
    // Reposition nodes to new radial layout
    const pos = getPositions();
    colleagues.forEach((_, i) => {
      const node = document.getElementById(`node-${i}`);
      if (node) {
        node.style.left = pos[i].x + 'px';
        node.style.top = pos[i].y + 'px';
        node.style.transition = 'left 0.3s, top 0.3s';
        setTimeout(() => { if (node) node.style.transition = ''; }, 300);
      }
    });
    renderLines();
  }, 200);
});
