<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="牛马自救指南 - 牛马社区，匿名倾诉广场，找到共鸣">
<title>牛马社区 · 牛马自救指南</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

  :root {
    --paper: #FDF8F0;
    --paper-dark: #F5EDE0;
    --paper-line: #EDE5D8;
    --ink: #3D3229;
    --ink-light: #6B5E52;
    --ink-muted: #A89B8C;
    --accent: #D4834A;
    --accent-light: #E8A87C;
    --accent-soft: #F5D5C0;
    --warm: #C4A882;
    --card-bg: #FFFDF9;
    --shadow: rgba(61,50,41,0.06);
    --shadow-hover: rgba(61,50,41,0.12);
    --blue: #7BAED4;
    --blue-light: #A8D0F0;
    --blue-soft: #D4EAFA;
    --green: #7BA68A;
    --green-light: #A8D4B0;
    --green-soft: #D4EAD8;
    --pink: #D48BA0;
    --pink-light: #F0B0C4;
    --pink-soft: #FAD4DE;
    --yellow: #D4C47B;
    --yellow-light: #F0E4A8;
    --yellow-soft: #FAF0D4;
    --red: #D47B7B;
    --red-light: #F0A8A8;
    --red-soft: #FAD4D4;
    --purple: #9B7BD4;
    --purple-light: #C0A8F0;
    --purple-soft: #E0D4FA;
    --gray: #A89B8C;
    --gray-light: #C8BEB2;
    --gray-soft: #E8E2DA;
    --overlay: rgba(61,50,41,0.5);
  }

  html.dark-mode {
    --paper: #1E1D2B;
    --paper-dark: #171622;
    --paper-line: #2A2940;
    --ink: #E8E4DF;
    --ink-light: #B8B3AC;
    --ink-muted: #6E6B66;
    --accent: #E8954A;
    --accent-light: #F0A86C;
    --accent-soft: #3D2E1E;
    --warm: #8A7A62;
    --card-bg: #252438;
    --shadow: rgba(0,0,0,0.2);
    --shadow-hover: rgba(0,0,0,0.35);
    --blue: #6A8AA5;
    --blue-light: #5A7A95;
    --blue-soft: #2A3A4A;
    --green: #5B9A6E;
    --green-light: #4A8A5E;
    --green-soft: #2A3A2E;
    --pink: #A88488;
    --pink-light: #8A6468;
    --pink-soft: #3A2A2E;
    --yellow: #B5A44A;
    --yellow-light: #8A7A3A;
    --yellow-soft: #3A3520;
    --red: #A86464;
    --red-light: #8A4A4A;
    --red-soft: #3A2020;
    --purple: #8A7BA4;
    --purple-light: #6A5B84;
    --purple-soft: #2A2540;
    --gray: #6E6B66;
    --gray-light: #4A4844;
    --gray-soft: #2A2928;
    --overlay: rgba(0,0,0,0.6);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #E8E0D4;
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background 0.3s, color 0.3s;
  }
  html.dark-mode body { background: #12111C; }

  .handwriting {
    font-family: 'ZCOOL KuaiLe', 'STKaiti', 'KaiTi', cursive;
  }

  /* ===== App Shell ===== */
  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--paper);
    position: relative;
    overflow-x: hidden;
    transition: background 0.3s;
  }

  /* ===== Paper Texture ===== */
  .paper-texture {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.3;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 150px;
  }

  /* ===== Top Nav ===== */
  .top-nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--paper);
    padding: 12px 16px 0;
    transition: background 0.3s;
  }
  .top-nav-inner {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .back-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--paper-dark);
    color: var(--ink);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
    text-decoration: none;
  }
  .back-btn:active {
    transform: scale(0.92);
    background: var(--paper-line);
  }
  .nav-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 22px;
    color: var(--accent);
    flex: 1;
  }
  .nav-actions {
    display: flex;
    gap: 8px;
  }
  .nav-icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--paper-dark);
    color: var(--ink-light);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-icon-btn:active {
    transform: scale(0.92);
  }

  /* ===== Search Bar ===== */
  .search-wrap {
    position: relative;
    margin-bottom: 12px;
  }
  .search-bar {
    width: 100%;
    height: 40px;
    border-radius: 20px;
    border: 2px solid var(--paper-line);
    background: var(--paper-dark);
    color: var(--ink);
    font-size: 14px;
    padding: 0 16px 0 40px;
    outline: none;
    transition: all 0.3s;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .search-bar::placeholder {
    color: var(--ink-muted);
  }
  .search-bar:focus {
    border-color: var(--accent-light);
    background: var(--card-bg);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: var(--ink-muted);
    pointer-events: none;
  }
  .search-clear {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: var(--gray-light);
    color: #fff;
    font-size: 12px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .search-clear.show { display: flex; }

  /* ===== Sort Tabs ===== */
  .sort-tabs {
    display: flex;
    gap: 0;
    padding: 0 16px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--paper-line);
  }
  .sort-tab {
    flex: 1;
    text-align: center;
    padding: 8px 0 10px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-muted);
    cursor: pointer;
    position: relative;
    transition: color 0.3s;
    background: none;
    border: none;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .sort-tab.active {
    color: var(--accent);
    font-weight: 600;
  }
  .sort-tab.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    height: 3px;
    border-radius: 2px;
    background: var(--accent);
    animation: tabIn 0.3s ease;
  }
  @keyframes tabIn {
    from { width: 0; opacity: 0; }
    to { width: 28px; opacity: 1; }
  }

  /* ===== Hot Topics ===== */
  .hot-topics {
    padding: 0 16px 14px;
  }
  .hot-topics-label {
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hot-topics-label::before {
    content: '🔥';
    font-size: 14px;
  }
  .topics-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding-bottom: 4px;
  }
  .topics-scroll::-webkit-scrollbar { display: none; }
  .topic-tag {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 500;
    border: 1.5px solid var(--paper-line);
    background: var(--paper-dark);
    color: var(--ink-light);
    cursor: pointer;
    transition: all 0.25s;
    white-space: nowrap;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .topic-tag:active {
    transform: scale(0.95);
  }
  .topic-tag.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(212,131,74,0.3);
  }
  .topic-tag .topic-fire {
    margin-right: 2px;
  }

  /* ===== Pull Refresh ===== */
  .pull-refresh {
    text-align: center;
    padding: 8px 0 4px;
    font-size: 13px;
    color: var(--ink-muted);
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .pull-refresh .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid var(--paper-line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }
  .pull-refresh.refreshing .spinner { display: block; }
  .pull-refresh.refreshing .pull-text { display: none; }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ===== Post Feed ===== */
  .feed {
    padding: 0 12px 100px;
  }

  /* ===== Post Card ===== */
  .post-card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px var(--shadow);
    transition: all 0.3s;
    animation: cardIn 0.4s ease both;
    border: 1px solid var(--paper-line);
  }
  .post-card:active {
    box-shadow: 0 1px 4px var(--shadow);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .post-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .post-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    border: 2px solid var(--paper-line);
  }
  .post-meta {
    flex: 1;
    min-width: 0;
  }
  .post-author {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .post-author-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 500;
  }
  .post-time {
    font-size: 12px;
    color: var(--ink-muted);
    margin-top: 2px;
  }

  .post-content {
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink);
    margin-bottom: 10px;
    word-break: break-word;
  }
  .post-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .post-tag {
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 12px;
    background: var(--blue-soft);
    color: var(--blue);
    font-weight: 500;
  }
  html.dark-mode .post-tag {
    background: var(--blue-soft);
    color: var(--blue-light);
  }

  .post-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-top: 10px;
    border-top: 1px solid var(--paper-line);
  }
  .post-action-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 6px 0;
    border: none;
    background: none;
    color: var(--ink-muted);
    font-size: 13px;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .post-action-btn:active {
    background: var(--paper-dark);
    transform: scale(0.96);
  }
  .post-action-btn .action-icon {
    font-size: 18px;
    transition: transform 0.3s;
  }
  .post-action-btn.hugged .action-icon {
    transform: scale(1.2);
  }
  .post-action-btn.hugged {
    color: var(--pink);
  }
  .post-action-btn.hugged .action-icon {
    animation: hugPop 0.4s ease;
  }
  @keyframes hugPop {
    0% { transform: scale(1); }
    30% { transform: scale(1.4); }
    60% { transform: scale(0.9); }
    100% { transform: scale(1.2); }
  }

  /* ===== Comments Section ===== */
  .comments-section {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, padding 0.3s ease;
    padding: 0 0;
  }
  .comments-section.open {
    max-height: 600px;
    padding: 12px 0 0;
  }
  .comments-header {
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .comment-item {
    display: flex;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--paper-line);
  }
  .comment-item:last-child { border-bottom: none; }
  .comment-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--green-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .comment-body {
    flex: 1;
    min-width: 0;
  }
  .comment-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-light);
  }
  .comment-text {
    font-size: 13px;
    color: var(--ink);
    margin-top: 2px;
    line-height: 1.5;
  }
  .comment-input-wrap {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--paper-line);
  }
  .comment-input {
    flex: 1;
    height: 34px;
    border-radius: 17px;
    border: 1.5px solid var(--paper-line);
    background: var(--paper-dark);
    color: var(--ink);
    font-size: 13px;
    padding: 0 14px;
    outline: none;
    font-family: 'Noto Sans SC', sans-serif;
    transition: border-color 0.3s;
  }
  .comment-input:focus {
    border-color: var(--accent-light);
  }
  .comment-send-btn {
    height: 34px;
    padding: 0 14px;
    border-radius: 17px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans SC', sans-serif;
    white-space: nowrap;
  }
  .comment-send-btn:active {
    transform: scale(0.95);
    opacity: 0.85;
  }

  /* ===== Empty State ===== */
  .empty-state {
    text-align: center;
    padding: 60px 30px;
  }
  .empty-icon {
    font-size: 64px;
    margin-bottom: 16px;
    animation: emptyFloat 3s ease-in-out infinite;
  }
  @keyframes emptyFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .empty-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 20px;
    color: var(--ink-light);
    margin-bottom: 8px;
  }
  .empty-desc {
    font-size: 14px;
    color: var(--ink-muted);
    line-height: 1.6;
  }
  .empty-action {
    margin-top: 20px;
    padding: 10px 28px;
    border-radius: 20px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'ZCOOL KuaiLe', cursive;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(212,131,74,0.3);
  }
  .empty-action:active {
    transform: scale(0.95);
  }

  /* ===== FAB (New Post) ===== */
  .fab {
    position: fixed;
    bottom: 30px;
    right: calc(50% - 195px);
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: #fff;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(212,131,74,0.4);
    z-index: 60;
    transition: all 0.3s;
    animation: fabPulse 3s ease-in-out infinite;
  }
  @keyframes fabPulse {
    0%, 100% { box-shadow: 0 4px 16px rgba(212,131,74,0.4); }
    50% { box-shadow: 0 4px 24px rgba(212,131,74,0.6); }
  }
  .fab:active {
    transform: scale(0.9);
  }
  @media (max-width: 430px) {
    .fab { right: 20px; }
  }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--overlay);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
    animation: overlayIn 0.3s ease;
  }
  .modal-overlay.show {
    display: flex;
  }
  @keyframes overlayIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .modal {
    width: 100%;
    max-width: 430px;
    background: var(--paper);
    border-radius: 24px 24px 0 0;
    padding: 20px 20px 30px;
    animation: modalSlideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    max-height: 85vh;
    overflow-y: auto;
  }
  @keyframes modalSlideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-handle {
    width: 40px;
    height: 4px;
    border-radius: 2px;
    background: var(--gray-light);
    margin: 0 auto 18px;
  }
  .modal-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 20px;
    color: var(--accent);
    margin-bottom: 18px;
    text-align: center;
  }
  .form-group {
    margin-bottom: 16px;
  }
  .form-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-light);
    margin-bottom: 6px;
    display: block;
  }
  .form-textarea {
    width: 100%;
    min-height: 120px;
    border-radius: 14px;
    border: 2px solid var(--paper-line);
    background: var(--paper-dark);
    color: var(--ink);
    font-size: 15px;
    padding: 14px;
    outline: none;
    resize: vertical;
    font-family: 'Noto Sans SC', sans-serif;
    line-height: 1.6;
    transition: border-color 0.3s;
  }
  .form-textarea:focus {
    border-color: var(--accent-light);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .form-tags-select {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .form-tag-option {
    padding: 6px 14px;
    border-radius: 16px;
    border: 1.5px solid var(--paper-line);
    background: var(--paper-dark);
    color: var(--ink-light);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .form-tag-option.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .form-emoji-select {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .form-emoji-option {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 2px solid var(--paper-line);
    background: var(--paper-dark);
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .form-emoji-option.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: scale(1.1);
  }
  .form-submit {
    width: 100%;
    height: 48px;
    border-radius: 24px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'ZCOOL KuaiLe', cursive;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(212,131,74,0.3);
    margin-top: 8px;
  }

    {

      emoji: '🦆',
      content: '第一次独立完成了一个项目，虽然过程很痛苦，但看到成果的那一刻，觉得一切都值了。给自己点个赞！',
      tags: ['职场生存', '正能量'],
      time: Date.now() - 345600000,
      hugs: 178,
      comments: [
        { name: '前辈', emoji: '🐵', text: '恭喜恭喜！继续加油' },
        { name: '同组', emoji: '🐶', text: '你超棒的！' }
      ],
      hugged: false,
      featured: false
    }
  ];

  // ===== DOM Refs =====
  var feedEl = document.getElementById('feed');
  var searchInput = document.getElementById('searchInput');
  var searchClear = document.getElementById('searchClear');
  var topicsScroll = document.getElementById('topicsScroll');
  var pullRefresh = document.getElementById('pullRefresh');
  var fabBtn = document.getElementById('fabBtn');
  var modalOverlay = document.getElementById('modalOverlay');
  var submitPost = document.getElementById('submitPost');
  var cancelPost = document.getElementById('cancelPost');
  var postContent = document.getElementById('postContent');
  var emojiSelect = document.getElementById('emojiSelect');
  var tagsSelect = document.getElementById('tagsSelect');
  var darkToggle = document.getElementById('darkToggle');
  var toastEl = document.getElementById('toast');

  // ===== Init =====
  function init() {
    loadState();
    applyDarkMode();
    bindEvents();
    renderFeed();
  }

  // ===== Load State from localStorage =====
  function loadState() {
    try {
      var saved = localStorage.getItem('niujiu_community_posts');
      if (saved) {
        var parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length > 0) {
          state.posts = parsed.map(function(p) {
            return {
              id: p.id || ('p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5)),
              emoji: p.emoji || '🐮',
              content: p.content || '',
              tags: p.tags || [],
              time: p.time || Date.now(),
              hugs: p.hugs || 0,
              comments: p.comments || [],
              hugged: p.hugged || false,
              featured: p.featured || false
            };
          });
        } else {
          state.posts = defaultPosts.slice();
        }
      } else {
        // Fallback: try old key for migration
        try {
          var oldSaved = localStorage.getItem('niujiu_state_v3');
          if (oldSaved) {
            var oldParsed = JSON.parse(oldSaved);
            if (oldParsed && oldParsed.posts && Array.isArray(oldParsed.posts) && oldParsed.posts.length > 0) {
              state.posts = oldParsed.posts.map(function(p) {
                return {
                  id: p.id || ('p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5)),
                  emoji: p.emoji || '🐮',
                  content: p.content || '',
                  tags: p.tags || [],
                  time: p.time || Date.now(),
                  hugs: p.hugs || 0,
                  comments: p.comments || [],
                  hugged: p.hugged || false,
                  featured: p.featured || false
                };
              });
              // Migrate to new key
              localStorage.setItem('niujiu_community_posts', JSON.stringify(state.posts));
            } else {
              state.posts = defaultPosts.slice();
            }
          } else {
            state.posts = defaultPosts.slice();
          }
        } catch (e2) {
          state.posts = defaultPosts.slice();
        }
      }
    } catch (e) {
      state.posts = defaultPosts.slice();
    }

    // Dark mode
    try {
      var dm = localStorage.getItem('darkMode');
      state.darkMode = dm === 'true';
    } catch (e) {
      state.darkMode = false;
    }
  }

  // ===== Save State =====
  function saveState() {
    try {
      var postsToSave = state.posts.map(function(p) {
        return {
          id: p.id,
          emoji: p.emoji,
          content: p.content,
          tags: p.tags,
          time: p.time,
          hugs: p.hugs,
          comments: p.comments,
          hugged: p.hugged,
          featured: p.featured
        };
      });
      localStorage.setItem('niujiu_community_posts', JSON.stringify(postsToSave));
    } catch (e) {
      // silent
    }
  }

  // ===== Dark Mode =====
  function applyDarkMode() {
    if (state.darkMode) {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }

  function toggleDarkMode() {
    state.darkMode = !state.darkMode;
    localStorage.setItem('darkMode', state.darkMode ? 'true' : 'false');
    applyDarkMode();
    showToast(state.darkMode ? '已切换到暗色模式' : '已切换到亮色模式');
  }

  // ===== Toast =====
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      toastEl.classList.remove('show');
    }, 2000);
  }

  // Click to dismiss toast
  toastEl.addEventListener('click', function() {
    if (toastTimer) clearTimeout(toastTimer);
    toastEl.classList.remove('show');
  });

  // ===== Time Formatting =====
  function formatTime(ts) {
    var now = Date.now();
    var diff = now - ts;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
    if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
    var d = new Date(ts);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  // ===== Highlight Text =====
  function highlightText(text, query) {
    if (!query) return escapeHtml(text);
    var escaped = escapeHtml(text);
    var escapedQuery = escapeHtml(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var regex = new RegExp('(' + escapedQuery + ')', 'gi');
    return escaped.replace(regex, '<span class="highlight">$1</span>');
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  // ===== Get Filtered & Sorted Posts =====
  function getFilteredPosts() {
    var posts = state.posts.slice();

    // Filter by topic
    if (state.activeTopic !== 'all') {
      posts = posts.filter(function(p) {
        return p.tags && p.tags.indexOf(state.activeTopic) !== -1;
      });
    }

    // Filter by search
    if (state.searchQuery) {
      var q = state.searchQuery.toLowerCase();
      posts = posts.filter(function(p) {
        return p.content && p.content.toLowerCase().indexOf(q) !== -1;
      });
    }

    // Sort
    if (state.sortMode === 'latest') {
      posts.sort(function(a, b) { return b.time - a.time; });
    } else if (state.sortMode === 'hot') {
      posts.sort(function(a, b) { return b.hugs - a.hugs; });
    } else if (state.sortMode === 'featured') {
      var featured = posts.filter(function(p) { return p.featured; });
      var normal = posts.filter(function(p) { return !p.featured; });
      featured.sort(function(a, b) { return b.hugs - a.hugs; });
      normal.sort(function(a, b) { return b.time - a.time; });
      posts = featured.concat(normal);
    }

    return posts;
  }

  // ===== Render Feed =====
  function renderFeed() {
    var posts = getFilteredPosts();

    if (posts.length === 0) {
      var emptyMsg = state.searchQuery ? '没有找到相关帖子' : (state.activeTopic !== 'all' ? '该话题下暂无帖子' : '社区还没有帖子');
      var emptyDesc = state.searchQuery ? '换个关键词试试吧' : (state.activeTopic !== 'all' ? '换个话题看看' : '成为第一个发帖的人吧');

      feedEl.innerHTML =
        '<div class="empty-state fade-in-up">' +
          '<div class="empty-icon">🐄</div>' +
          '<div class="empty-title handwriting">' + emptyMsg + '</div>' +
          '<div class="empty-desc">' + emptyDesc + '</div>' +
          '<button class="empty-action" onclick="document.getElementById(\'fabBtn\').click()">发布第一条动态</button>' +
        '</div>';
      return;
    }

    var html = '';
    for (var i = 0; i < posts.length; i++) {
      html += renderPostCard(posts[i], i);
    }
    feedEl.innerHTML = html;

    // Bind post events
    bindPostEvents();
  }

  // ===== Render Single Post =====
  function renderPostCard(post, index) {
    var tagsHtml = '';
    if (post.tags && post.tags.length > 0) {
      for (var t = 0; t < post.tags.length; t++) {
        tagsHtml += '<span class="post-tag">' + escapeHtml(post.tags[t]) + '</span>';
      }
    }

    var commentsHtml = '';
    if (post.comments && post.comments.length > 0) {
      for (var c = 0; c < post.comments.length; c++) {
        var cm = post.comments[c];
        commentsHtml +=
          '<div class="comment-item">' +
            '<div class="comment-avatar">' + (cm.emoji || '🐮') + '</div>' +
            '<div class="comment-body">' +
              '<div class="comment-name">' + escapeHtml(cm.name || '匿名牛马') + '</div>' +
              '<div class="comment-text">' + escapeHtml(cm.text || '') + '</div>' +
            '</div>' +
          '</div>';
      }
    }

    var huggedClass = post.hugged ? ' hugged' : '';
    var contentHtml = highlightText(post.content, state.searchQuery);

    return (
      '<div class="post-card" data-id="' + post.id + '" style="animation-delay:' + (index * 0.05) + 's">' +
        '<div class="post-header">' +
          '<div class="post-avatar">' + post.emoji + '</div>' +
          '<div class="post-meta">' +
            '<div class="post-author">' +
              escapeHtml(post.emoji + '号牛马') +
              (post.featured ? '<span class="post-author-badge">精选</span>' : '') +
            '</div>' +
            '<div class="post-time">' + formatTime(post.time) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="post-content">' + contentHtml + '</div>' +
        (tagsHtml ? '<div class="post-tags">' + tagsHtml + '</div>' : '') +
        '<div class="post-actions">' +
          '<button class="post-action-btn hug-btn' + huggedClass + '" data-id="' + post.id + '">' +
            '<span class="action-icon">🤗</span>' +
            '<span class="hug-count">' + post.hugs + '</span>' +
          '</button>' +
          '<button class="post-action-btn comment-toggle-btn" data-id="' + post.id + '">' +
            '<span class="action-icon">💬</span>' +
            '<span class="comment-count">' + (post.comments ? post.comments.length : 0) + '</span>' +
          '</button>' +
          '<button class="post-action-btn share-btn" data-id="' + post.id + '">' +
            '<span class="action-icon">🔗</span>' +
            '<span>分享</span>' +
          '</button>' +
        '</div>' +
        '<div class="comments-section" id="comments-' + post.id + '">' +
          '<div class="comments-header">共 ' + (post.comments ? post.comments.length : 0) + ' 条评论</div>' +
          commentsHtml +
          '<div class="comment-input-wrap">' +
            '<input type="text" class="comment-input" data-id="' + post.id + '" placeholder="写一条评论...">' +
            '<button class="comment-send-btn" data-id="' + post.id + '">发送</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  // ===== Bind Post Events (delegated to feed) =====
  function bindPostEvents() {
    // Event delegation on feed container
    feedEl.addEventListener('click', function(e) {
      var target = e.target;
      // Find closest matching button
      var hugBtn = target.closest('.hug-btn');
      if (hugBtn) {
        handleHug(e, hugBtn);
        return;
      }
      var commentToggle = target.closest('.comment-toggle-btn');
      if (commentToggle) {
        handleCommentToggle(e, commentToggle);
        return;
      }
      var commentSend = target.closest('.comment-send-btn');
      if (commentSend) {
        handleCommentSend(e, commentSend);
        return;
      }
      var shareBtn = target.closest('.share-btn');
      if (shareBtn) {
        handleShare(e, shareBtn);
        return;
      }
    });

    // Enter key on comment inputs (delegated)
    feedEl.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var input = e.target.closest('.comment-input');
        if (input) {
          e.preventDefault();
          var id = input.getAttribute('data-id');
          handleCommentSendById(id);
        }
      }
    });
  }

  // ===== Hug Handler =====
  function handleHug(e, btn) {
    if (!btn) btn = e.currentTarget;
    var id = btn.getAttribute('data-id');
    var post = findPost(id);
    if (!post) return;

    if (post.hugged) {
      post.hugged = false;
      post.hugs = Math.max(0, post.hugs - 1);
      btn.classList.remove('hugged');
    } else {
      post.hugged = true;
      post.hugs += 1;
      btn.classList.add('hugged');
      showToast('已抱抱 🤗');
    }
    btn.querySelector('.hug-count').textContent = post.hugs;
    saveState();
  }

  // ===== Comment Toggle =====
  function handleCommentToggle(e, btn) {
    if (!btn) btn = e.currentTarget;
    var id = btn.getAttribute('data-id');
    var section = document.getElementById('comments-' + id);
    if (!section) return;

    if (section.classList.contains('open')) {
      section.classList.remove('open');
    } else {
      section.classList.add('open');
      var input = section.querySelector('.comment-input');
      if (input) {
        setTimeout(function() { input.focus(); }, 300);
      }
    }
  }

  // ===== Comment Send =====
  function handleCommentSend(e, btn) {
    if (!btn) btn = e.currentTarget;
    var id = btn.getAttribute('data-id');
    handleCommentSendById(id);
  }

  function handleCommentSendById(id) {
    var input = document.querySelector('.comment-input[data-id="' + id + '"]');
    if (!input) return;
    var text = input.value.trim();
    if (!text) {
      showToast('请输入评论内容');
      return;
    }

    var post = findPost(id);
    if (!post) return;

    if (!post.comments) post.comments = [];
    post.comments.push({
      name: '我',
      emoji: '🐮',
      text: text
    });

    input.value = '';
    saveState();
    showToast('评论成功');

    // Incremental DOM insertion
    var section = document.getElementById('comments-' + id);
    if (section) {
      var header = section.querySelector('.comments-header');
      if (header) {
        header.textContent = '共 ' + post.comments.length + ' 条评论';
      }

      var cm = post.comments[post.comments.length - 1];
      var item = document.createElement('div');
      item.className = 'comment-item';
      item.innerHTML =
        '<div class="comment-avatar">' + (cm.emoji || '🐮') + '</div>' +
        '<div class="comment-body">' +
          '<div class="comment-name">' + escapeHtml(cm.name || '匿名牛马') + '</div>' +
          '<div class="comment-text">' + escapeHtml(cm.text || '') + '</div>' +
        '</div>';

      var inputWrap = section.querySelector('.comment-input-wrap');
      if (inputWrap) {
        section.insertBefore(item, inputWrap);
      } else {
        section.appendChild(item);
      }

      var newInput = section.querySelector('.comment-input');
      if (newInput) {
        newInput.focus();
      }
    }

    // Update comment count in action bar
    var card = document.querySelector('.post-card[data-id="' + id + '"]');
    if (card) {
      var countEl = card.querySelector('.comment-count');
      if (countEl) countEl.textContent = post.comments.length;
    }
  }

  // ===== Share Handler =====
  function handleShare(e, btn) {
    showToast('链接已复制到剪贴板');
  }

  // ===== Find Post =====
  function findPost(id) {
    for (var i = 0; i < state.posts.length; i++) {
      if (state.posts[i].id === id) return state.posts[i];
    }
    return null;
  }

  // ===== Bind Events =====
  function bindEvents() {
    // Search
    searchInput.addEventListener('input', function() {
      state.searchQuery = this.value.trim();
      if (state.searchQuery) {
        searchClear.classList.add('show');
      } else {
        searchClear.classList.remove('show');
      }
      renderFeed();
    });

    searchClear.addEventListener('click', function() {
      searchInput.value = '';
      state.searchQuery = '';
      searchClear.classList.remove('show');
      searchInput.focus();
      renderFeed();
    });

    // Sort tabs
    var sortTabs = document.querySelectorAll('.sort-tab');
    for (var s = 0; s < sortTabs.length; s++) {
      sortTabs[s].addEventListener('click', function() {
        for (var j = 0; j < sortTabs.length; j++) {
          sortTabs[j].classList.remove('active');
        }
        this.classList.add('active');
        state.sortMode = this.getAttribute('data-sort');
        renderFeed();
      });
    }

    // Topic tags
    var topicTags = topicsScroll.querySelectorAll('.topic-tag');
    for (var tp = 0; tp < topicTags.length; tp++) {
      topicTags[tp].addEventListener('click', function() {
        for (var j = 0; j < topicTags.length; j++) {
          topicTags[j].classList.remove('active');
        }
        this.classList.add('active');
        state.activeTopic = this.getAttribute('data-topic');
        renderFeed();
      });
    }

    // Set initial active topic
    var allTag = topicsScroll.querySelector('[data-topic="all"]');
    if (allTag) allTag.classList.add('active');

    // FAB
    fabBtn.addEventListener('click', function() {
      openModal();
    });

    // Modal
    cancelPost.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', function(e) {
      if (e.target === modalOverlay) closeModal();
    });

    // Submit
    submitPost.addEventListener('click', handleSubmitPost);

    // Emoji select
    var emojiOptions = emojiSelect.querySelectorAll('.form-emoji-option');
    for (var eo = 0; eo < emojiOptions.length; eo++) {
      emojiOptions[eo].addEventListener('click', function() {
        for (var j = 0; j < emojiOptions.length; j++) {
          emojiOptions[j].classList.remove('selected');
        }
        this.classList.add('selected');
        state.newPost.emoji = this.getAttribute('data-emoji');
      });
    }

    // Tags select
    var tagOptions = tagsSelect.querySelectorAll('.form-tag-option');
    for (var to = 0; to < tagOptions.length; to++) {
      tagOptions[to].addEventListener('click', function() {
        this.classList.toggle('selected');
        var tag = this.getAttribute('data-tag');
        var idx = state.newPost.tags.indexOf(tag);
        if (idx === -1) {
          state.newPost.tags.push(tag);
        } else {
          state.newPost.tags.splice(idx, 1);
        }
      });
    }

    // Dark mode toggle
    darkToggle.addEventListener('click', toggleDarkMode);

    // Pull refresh simulation
    var startY = 0;
    var pulling = false;
    var appEl = document.getElementById('app');

    appEl.addEventListener('touchstart', function(e) {
      if (window.scrollY <= 0) {
        startY = e.touches[0].pageY;
        pulling = true;
      }
    }, { passive: true });

    appEl.addEventListener('touchmove', function(e) {
      if (!pulling) return;
      var diff = e.touches[0].pageY - startY;
      if (diff > 60 && window.scrollY <= 0) {
        pullRefresh.querySelector('.pull-text').textContent = '释放刷新';
      }
    }, { passive: true });

    appEl.addEventListener('touchend', function() {
      if (!pulling) return;
      pulling = false;
      pullRefresh.querySelector('.pull-text').textContent = '下拉刷新';
      if (window.scrollY <= 0) {
        doRefresh();
      }
    }, { passive: true });
  }

  // ===== Refresh =====
  function doRefresh() {
    pullRefresh.classList.add('refreshing');
    setTimeout(function() {
      pullRefresh.classList.remove('refreshing');
      loadState();
      renderFeed();
      showToast('刷新成功');
    }, 800);
  }

  // ===== Modal =====
  function openModal() {
    state.newPost = { emoji: '🐮', tags: [], content: '' };
    postContent.value = '';
    var emojiOptions = emojiSelect.querySelectorAll('.form-emoji-option');
    for (var i = 0; i < emojiOptions.length; i++) {
      emojiOptions[i].classList.remove('selected');
    }
    emojiOptions[0].classList.add('selected');
    var tagOptions = tagsSelect.querySelectorAll('.form-tag-option');
    for (var j = 0; j < tagOptions.length; j++) {
      tagOptions[j].classList.remove('selected');
    }
    modalOverlay.classList.add('show');
    setTimeout(function() { postContent.focus(); }, 400);
  }

  function closeModal() {
    modalOverlay.classList.remove('show');
  }

  // ===== Submit Post =====
  function handleSubmitPost() {
    var content = postContent.value.trim();
    if (!content) {
      showToast('请输入内容');
      postContent.focus();
      return;
    }
    if (content.length > 500) {
      showToast('内容不能超过500字');
      return;
    }

    var newPost = {
      id: 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
      emoji: state.newPost.emoji,
      content: content,
      tags: state.newPost.tags.slice(),
      time: Date.now(),
      hugs: 0,
      comments: [],
      hugged: false,
      featured: false
    };

    state.posts.unshift(newPost);
    saveState();
    closeModal();
    showToast('发布成功！');

    // Reset sort to latest
    state.sortMode = 'latest';
    state.activeTopic = 'all';
    state.searchQuery = '';
    searchInput.value = '';
    searchClear.classList.remove('show');

    var sortTabs = document.querySelectorAll('.sort-tab');
    for (var s = 0; s < sortTabs.length; s++) {
      sortTabs[s].classList.remove('active');
      if (sortTabs[s].getAttribute('data-sort') === 'latest') {
        sortTabs[s].classList.add('active');
      }
    }
    var topicTags = topicsScroll.querySelectorAll('.topic-tag');
    for (var t = 0; t < topicTags.length; t++) {
      topicTags[t].classList.remove('active');
      if (topicTags[t].getAttribute('data-topic') === 'all') {
        topicTags[t].classList.add('active');
      }
    }

    renderFeed();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ===== Start =====
  init();

})();
</script>
</body>
</html>
