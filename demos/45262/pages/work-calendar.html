<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="牛马自救指南 - 工作日历，月度视图与事件标记">
<title>打工日历 · 牛马自救指南</title>
<style>
  :root {
    --bg: #FDF8F0;
    --bg2: #F5EDE0;
    --ink: #2D2A24;
    --ink-muted: #9A968E;
    --accent: #E8916A;
    --card-bg: #FFFBF5;
    --border: rgba(196,168,130,0.2);
    --shadow: rgba(45,42,36,0.08);
    --radius: 16px;
    --weekend-bg: rgba(232,145,106,0.06);
    --today-glow: rgba(232,145,106,0.35);
    --level0: #EDE5D8;
    --level1: #F5D5C0;
    --level2: #F0B896;
    --level3: #E8916A;
    --level4: #D4704A;
  }

  html.dark-mode {
    --bg: #1A1918;
    --bg2: #242220;
    --ink: #E8E4DC;
    --ink-muted: #7A7670;
    --accent: #E8916A;
    --card-bg: #2A2826;
    --border: rgba(196,168,130,0.12);
    --shadow: rgba(0,0,0,0.25);
    --weekend-bg: rgba(232,145,106,0.08);
    --today-glow: rgba(232,145,106,0.5);
    --level0: #2A2826;
    --level1: #3D2E1E;
    --level2: #5A3D28;
    --level3: #7A4E30;
    --level4: #E8916A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.3s, color 0.3s;
  }

  /* Page load fade-in */
  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    padding-bottom: 60px;
    opacity: 0;
    animation: pageFadeIn 0.5s ease-out 0.1s forwards;
  }
  @keyframes pageFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Header ===== */
  .header {
    display: flex;
    align-items: center;
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 50;
    transition: background 0.3s;
  }
  .back-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--card-bg);
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px var(--shadow);
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .back-btn:active { transform: scale(0.92); }
  .header-title {
    flex: 1;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    margin-right: 36px;
    letter-spacing: 1px;
  }
  .header-title span { color: var(--accent); }

  /* ===== Stats Summary ===== */
  .stats-summary {
    margin: 0 16px 16px;
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 4px 16px var(--shadow);
    transition: background 0.3s;
    animation: fadeSlideUp 0.5s ease-out 0.2s both;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .stat-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .stat-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .stat-icon.checkin { background: rgba(232,145,106,0.12); }
  .stat-icon.streak { background: rgba(255,107,53,0.12); }
  .stat-icon.mood { background: rgba(255,213,79,0.15); }
  .stat-icon.activity { background: rgba(129,199,132,0.15); }
  .stat-info { flex: 1; min-width: 0; }
  .stat-label { font-size: 11px; color: var(--ink-muted); margin-bottom: 2px; }
  .stat-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.2;
  }
  .stat-value .stat-unit { font-size: 12px; font-weight: 400; color: var(--ink-muted); margin-left: 2px; }

  /* Activity progress bar */
  .activity-bar-wrap {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .activity-bar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .activity-bar-label { font-size: 12px; color: var(--ink-muted); }
  .activity-bar-pct { font-size: 14px; font-weight: 700; color: var(--accent); }
  .activity-bar-track {
    width: 100%;
    height: 10px;
    background: var(--bg2);
    border-radius: 5px;
    overflow: hidden;
  }
  .activity-bar-fill {
    height: 100%;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--level2), var(--accent));
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }
  .activity-bar-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
    animation: barShimmer 2.5s infinite;
  }
  @keyframes barShimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* ===== Month Navigation ===== */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 20px 12px;
    animation: fadeSlideUp 0.5s ease-out 0.3s both;
  }
  .month-nav button {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .month-nav button:active { transform: scale(0.9); background: var(--accent); color: #fff; border-color: var(--accent); }
  .month-label {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
  }
  .month-label .month-year { font-size: 13px; font-weight: 400; color: var(--ink-muted); margin-left: 6px; }

  /* ===== Calendar Card ===== */
  .calendar-card {
    margin: 0 16px 20px;
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: 0 4px 16px var(--shadow);
    transition: background 0.3s, box-shadow 0.3s;
    animation: fadeSlideUp 0.5s ease-out 0.35s both;
  }
  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }
  .weekday-cell {
    text-align: center;
    font-size: 12px;
    color: var(--ink-muted);
    font-weight: 600;
    padding: 4px 0;
  }
  .weekday-cell.weekend { color: var(--accent); }

  /* Month transition */
  .days-grid-wrap {
    position: relative;
    overflow: hidden;
  }
  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    transition: opacity 0.25s, transform 0.25s;
  }
  .days-grid.slide-left {
    opacity: 0;
    transform: translateX(-20px);
  }
  .days-grid.slide-right {
    opacity: 0;
    transform: translateX(20px);
  }

  .day-cell {
    aspect-ratio: 1;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    font-size: 13px;
    gap: 1px;
    border: 2px solid transparent;
    min-height: 44px;
  }
  .day-cell.empty { cursor: default; }
  .day-cell.weekend { background: var(--weekend-bg); }
  .day-cell.today {
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--today-glow);
    z-index: 2;
  }
  .day-cell.today::after {
    content: '今';
    position: absolute;
    top: 2px;
    right: 3px;
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
  }
  .day-cell.has-data:active { transform: scale(0.9); }
  .day-cell .day-num { font-size: 13px; line-height: 1; font-weight: 500; }
  .day-cell .cell-checkin { font-size: 10px; line-height: 1; }
  .day-cell .cell-mood { font-size: 14px; line-height: 1; }
  .day-cell.future { opacity: 0.3; cursor: default; }

  /* Activity level colors */
  .day-cell.level-0 { background: var(--level0); }
  .day-cell.level-1 { background: var(--level1); }
  .day-cell.level-2 { background: var(--level2); }
  .day-cell.level-3 { background: var(--level3); color: #fff; }
  .day-cell.level-4 { background: var(--level4); color: #fff; }

  /* ===== Legend ===== */
  .legend-bar {
    margin: 0 16px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 11px;
    color: var(--ink-muted);
    animation: fadeSlideUp 0.5s ease-out 0.4s both;
  }
  .legend-label { margin-right: 4px; }
  .legend-block {
    width: 14px; height: 14px;
    border-radius: 3px;
    border: 1px solid var(--border);
  }
  .legend-block.l0 { background: var(--level0); }
  .legend-block.l1 { background: var(--level1); }
  .legend-block.l2 { background: var(--level2); }
  .legend-block.l3 { background: var(--level3); }
  .legend-block.l4 { background: var(--level4); }
  .legend-texts { display: flex; gap: 6px; margin-left: 4px; }
  .legend-texts span { white-space: nowrap; }

  /* ===== Contribution Heatmap ===== */
  .heatmap-section {
    margin: 0 16px 20px;
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: 0 4px 16px var(--shadow);
    transition: background 0.3s;
    animation: fadeSlideUp 0.5s ease-out 0.45s both;
  }
  .heatmap-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .heatmap-subtitle {
    font-size: 11px;
    color: var(--ink-muted);
    margin-bottom: 12px;
  }
  .heatmap-grid {
    display: flex;
    gap: 3px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .heatmap-week {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .heatmap-cell {
    width: 14px; height: 14px;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .heatmap-cell.hl0 { background: var(--level0); }
  .heatmap-cell.hl1 { background: var(--level1); }
  .heatmap-cell.hl2 { background: var(--level2); }
  .heatmap-cell.hl3 { background: var(--level3); }
  .heatmap-cell.hl4 { background: var(--level4); }
  .heatmap-months {
    display: flex;
    gap: 3px;
    margin-top: 6px;
    overflow-x: auto;
  }
  .heatmap-months span {
    font-size: 10px;
    color: var(--ink-muted);
    flex-shrink: 0;
  }
  .heatmap-total {
    margin-top: 10px;
    font-size: 12px;
    color: var(--ink-muted);
    text-align: right;
  }
  .heatmap-total strong { color: var(--accent); font-weight: 700; }

  /* ===== Bottom Sheet ===== */
  .sheet-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.45);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .sheet-overlay.active { display: flex; }
  .sheet-overlay .sheet-bg { animation: fadeIn 0.2s ease-out; }
  .sheet {
    background: var(--bg);
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-width: 480px;
    max-height: 70vh;
    overflow-y: auto;
    padding: 20px 20px 36px;
    animation: slideUp 0.3s ease-out;
    transition: background 0.3s;
  }
  .sheet-handle {
    width: 40px; height: 4px;
    border-radius: 2px;
    background: var(--border);
    margin: 0 auto 16px;
  }
  .sheet-date {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 20px;
    color: var(--ink);
  }
  .sheet-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .sheet-row:last-child { border-bottom: none; }
  .sheet-row-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    background: var(--bg2);
  }
  .sheet-row-content { flex: 1; }
  .sheet-row-label { font-size: 12px; color: var(--ink-muted); margin-bottom: 2px; }
  .sheet-row-value { font-size: 15px; font-weight: 600; color: var(--ink); }
  .sheet-row-value .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
  }
  .badge-yes { background: rgba(129,199,132,0.15); color: #5B9A6E; }
  .badge-no { background: rgba(154,150,142,0.15); color: var(--ink-muted); }

  /* ===== Animations ===== */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes popIn {
    0% { transform: scale(0.7); opacity: 0; }
    60% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes countUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Footer ===== */
  .footer-tip {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.6;
  }

  /* ===== Scrollbar ===== */
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* ===== Responsive ===== */
  @media (max-width: 360px) {
    .stats-grid { gap: 10px; }
    .stat-icon { width: 34px; height: 34px; font-size: 17px; }
    .stat-value { font-size: 16px; }
    .day-cell { border-radius: 8px; min-height: 40px; }
    .day-cell .day-num { font-size: 12px; }
    .day-cell .cell-mood { font-size: 12px; }
    .heatmap-cell { width: 11px; height: 11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Header -->
  <div class="header">
    <button class="back-btn" onclick="window.location.href='../niujiu-demo-final.html'">&#8592;</button>
    <div class="header-title"><span>打工日历</span></div>
  </div>

  <!-- Stats Summary -->
  <div class="stats-summary">
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-icon checkin">&#9989;</div>
        <div class="stat-info">
          <div class="stat-label">本月签到</div>
          <div class="stat-value"><span class="counter" data-target="0" id="statCheckin">0</span><span class="stat-unit">天</span></div>
        </div>
      </div>
      <div class="stat-item">
        <div class="stat-icon streak">&#128293;</div>
        <div class="stat-info">
          <div class="stat-label">连续签到</div>
          <div class="stat-value"><span class="counter" data-target="0" id="statStreak">0</span><span class="stat-unit">天</span></div>
        </div>
      </div>
      <div class="stat-item">
        <div class="stat-icon mood">&#128522;</div>
        <div class="stat-info">
          <div class="stat-label">最常心情</div>
          <div class="stat-value" id="statMood">--</div>
        </div>
      </div>
      <div class="stat-item">
        <div class="stat-icon activity">&#128200;</div>
        <div class="stat-info">
          <div class="stat-label">本月活跃度</div>
          <div class="stat-value"><span class="counter" data-target="0" id="statActivity">0</span><span class="stat-unit">%</span></div>
        </div>
      </div>
    </div>
    <div class="activity-bar-wrap">
      <div class="activity-bar-header">
        <span class="activity-bar-label">活跃度进度</span>
        <span class="activity-bar-pct" id="activityPctText">0%</span>
      </div>
      <div class="activity-bar-track">
        <div class="activity-bar-fill" id="activityBarFill" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <!-- Month Navigation -->
  <div class="month-nav">
    <button onclick="changeMonth(-1)">&#8249;</button>
    <div class="month-label" id="monthLabel"></div>
    <button onclick="changeMonth(1)">&#8250;</button>
  </div>

  <!-- Calendar -->
  <div class="calendar-card">
    <div class="weekday-row">
      <div class="weekday-cell">一</div>
      <div class="weekday-cell">二</div>
      <div class="weekday-cell">三</div>
      <div class="weekday-cell">四</div>
      <div class="weekday-cell">五</div>
      <div class="weekday-cell weekend">六</div>
      <div class="weekday-cell weekend">日</div>
    </div>
    <div class="days-grid-wrap">
      <div class="days-grid" id="daysGrid"></div>
    </div>
  </div>

  <!-- Legend -->
  <div class="legend-bar">
    <span class="legend-label">少</span>
    <div class="legend-block l0"></div>
    <div class="legend-block l1"></div>
    <div class="legend-block l2"></div>
    <div class="legend-block l3"></div>
    <div class="legend-block l4"></div>
    <span>多</span>
  </div>

  <!-- Contribution Heatmap -->
  <div class="heatmap-section">
    <div class="heatmap-title">活跃热力图</div>
    <div class="heatmap-subtitle">过去12周的打卡记录</div>
    <div class="heatmap-grid" id="heatmapGrid"></div>
    <div class="heatmap-months" id="heatmapMonths"></div>
    <div class="heatmap-total" id="heatmapTotal"></div>
  </div>

  <!-- Footer -->
  <div class="footer-tip">
    坚持打卡，记录每一天的工作状态<br>
    你是最棒的牛马，加油！
  </div>
</div>

<!-- Bottom Sheet -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-date" id="sheetDate"></div>
    <div id="sheetContent"></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ===== Constants =====
  const MOODS = [
    { key: 'happy',   emoji: '\u{1F60A}', label: '开心' },
    { key: 'calm',    emoji: '\u{1F610}', label: '平静' },
    { key: 'sad',     emoji: '\u{1F622}', label: '难过' },
    { key: 'angry',   emoji: '\u{1F624}', label: '烦躁' },
    { key: 'tired',   emoji: '\u{1F634}', label: '疲惫' },
    { key: 'anxious', emoji: '\u{1F630}', label: '焦虑' },
    { key: 'giveup',  emoji: '\u{1FAE0}', label: '摆烂' },
    { key: 'excited', emoji: '\u{1F929}', label: '超棒' },
  ];

  const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];

  // ===== State =====
  let currentYear, currentMonth;
  const today = new Date();
  currentYear = today.getFullYear();
  currentMonth = today.getMonth();

  // ===== Dark Mode =====
  function applyDarkMode() {
    try {
      if (localStorage.getItem('darkMode') === 'true') {
        document.documentElement.classList.add('dark-mode');
      }
    } catch(e) {}
  }
  applyDarkMode();

  // ===== Data Store =====
  const calendarData = {};

  // Load real data from localStorage
  function loadRealData() {
    try {
      const raw = localStorage.getItem('niujiu_state_v3');
      if (!raw) return;
      const state = JSON.parse(raw);

      // checkinDate: "2026-06-19"
      if (state.checkinDate) {
        const key = formatDateKey(state.checkinDate);
        if (!calendarData[key]) calendarData[key] = {};
        calendarData[key].checkedIn = true;
      }

      // checkinCount
      if (state.checkinCount) {
        // distribute checkins across recent days
        const count = Math.min(state.checkinCount, 60);
        for (let i = 0; i < count; i++) {
          const d = new Date(today);
          d.setDate(d.getDate() - Math.floor(i * 0.7));
          const key = dateToKey(d);
          if (!calendarData[key]) calendarData[key] = {};
          calendarData[key].checkedIn = true;
        }
      }

      // selectionHistory: [{date, option}]
      if (state.selectionHistory && Array.isArray(state.selectionHistory)) {
        state.selectionHistory.forEach(item => {
          if (item.date && item.option) {
            const key = formatDateKey(item.date);
            if (!calendarData[key]) calendarData[key] = {};
            const mood = MOODS.find(m => m.key === item.option || m.label === item.option);
            if (mood) {
              calendarData[key].mood = mood.key;
              calendarData[key].moodEmoji = mood.emoji;
              calendarData[key].moodLabel = mood.label;
            }
          }
        });
      }

      // streak
      if (state.streak) {
        // use for display
      }

      // totalDays
      if (state.totalDays) {
        // use for display
      }
    } catch(e) {}
  }

  function formatDateKey(dateStr) {
    // normalize "2026-06-19" or "2026-6-19"
    const parts = dateStr.split('-');
    if (parts.length === 3) {
      return parts[0] + '-' + parseInt(parts[1]) + '-' + parseInt(parts[2]);
    }
    return dateStr;
  }

  function dateToKey(d) {
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  function keyToDate(key) {
    const parts = key.split('-');
    return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
  }

  // ===== Generate Sample Data =====
  function generateSampleData() {
    const moodKeys = ['happy','calm','tired','happy','angry','calm','sad','tired','anxious','calm','happy','excited','giveup','tired','happy','calm','anxious','happy','excited','calm'];
    const notes = [
      '今天效率很高，提前完成了任务',
      '和同事一起吃了好吃的午餐',
      '下班后去散步了，心情不错',
      '收到客户的好评，很开心',
      '天气真好，心情也跟着好了',
      '平平淡淡的一天，按部就班',
      '喝了一杯好茶，午休睡得不错',
      '没什么特别的事，但很平静',
      '被老板批评了，有点难过',
      '加班到很晚，身心俱疲',
      '项目被否了，需要重新来过',
      '客户又改需求了，很烦躁',
      '电脑死机丢文件，崩溃了',
      '地铁太挤了，心情不好',
      '连续加班第三天，太累了',
      '开了一天的会，头昏脑涨',
      '下周要交报告，有点焦虑',
      '担心项目延期，睡不好',
      '不想上班...摸鱼的一天',
      '什么都不想干，摆烂中',
      '升职加薪了！太棒了！',
      '项目上线成功，团队庆祝',
      '周末要去旅行，好期待',
      '被表扬了，今天超开心！',
    ];

    // Generate data for past 84 days (12 weeks)
    for (let i = 0; i < 84; i++) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const key = dateToKey(d);

      // Skip if already has real data
      if (calendarData[key]) continue;

      // 70% chance of having activity
      if (Math.random() < 0.7) {
        const moodKey = moodKeys[Math.floor(Math.random() * moodKeys.length)];
        const mood = MOODS.find(m => m.key === moodKey);
        const checkedIn = Math.random() < 0.85;
        const flippedCards = checkedIn ? Math.floor(Math.random() * 5) + 1 : 0;
        const wroteDiary = Math.random() < 0.4;
        const activityLevel = Math.min(4, Math.floor(Math.random() * 5));

        calendarData[key] = {
          checkedIn: checkedIn,
          mood: moodKey,
          moodEmoji: mood.emoji,
          moodLabel: mood.label,
          flippedCards: flippedCards,
          wroteDiary: wroteDiary,
          note: notes[Math.floor(Math.random() * notes.length)],
          activityLevel: activityLevel
        };
      }
    }
  }

  loadRealData();
  generateSampleData();

  // ===== Animated Counter =====
  function animateCounter(el, target, duration) {
    duration = duration || 800;
    const start = parseInt(el.textContent) || 0;
    const diff = target - start;
    if (diff === 0) { el.textContent = target; return; }
    const startTime = performance.now();

    function update(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
      el.textContent = Math.round(start + diff * eased);
      if (progress < 1) requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  }

  // ===== Render Stats =====
  function renderStats() {
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    let checkinCount = 0;
    let activitySum = 0;
    const moodCounts = {};

    for (let d = 1; d <= daysInMonth; d++) {
      const key = currentYear + '-' + (currentMonth + 1) + '-' + d;
      const data = calendarData[key];
      if (data) {
        if (data.checkedIn) checkinCount++;
        activitySum += (data.activityLevel || 0);
        if (data.mood) {
          moodCounts[data.mood] = (moodCounts[data.mood] || 0) + 1;
        }
      }
    }

    const maxActivity = daysInMonth * 4;
    const activityPct = maxActivity > 0 ? Math.round((activitySum / maxActivity) * 100) : 0;

    // Find top mood
    let topMood = '--';
    let topMoodEmoji = '';
    let topCount = 0;
    for (const mood in moodCounts) {
      if (moodCounts[mood] > topCount) {
        topCount = moodCounts[mood];
        const info = MOODS.find(m => m.key === mood);
        topMood = info ? info.emoji + ' ' + info.label : '--';
      }
    }

    // Calculate streak
    let streak = 0;
    const checkDate = new Date(today);
    // Start from today or yesterday
    const todayKey = dateToKey(checkDate);
    if (!calendarData[todayKey] || !calendarData[todayKey].checkedIn) {
      checkDate.setDate(checkDate.getDate() - 1);
    }
    while (true) {
      const key = dateToKey(checkDate);
      if (calendarData[key] && calendarData[key].checkedIn) {
        streak++;
        checkDate.setDate(checkDate.getDate() - 1);
      } else {
        break;
      }
    }

    // Animate counters
    animateCounter(document.getElementById('statCheckin'), checkinCount, 1000);
    animateCounter(document.getElementById('statStreak'), streak, 1000);
    animateCounter(document.getElementById('statActivity'), activityPct, 1200);
    document.getElementById('statMood').textContent = topMood;

    // Activity bar
    document.getElementById('activityPctText').textContent = activityPct + '%';
    requestAnimationFrame(() => {
      setTimeout(() => {
        document.getElementById('activityBarFill').style.width = activityPct + '%';
      }, 100);
    });
  }

  // ===== Render Calendar =====
  function renderCalendar(direction) {
    const grid = document.getElementById('daysGrid');
    const label = document.getElementById('monthLabel');
    label.innerHTML = (currentMonth + 1) + '月<span class="month-year">' + currentYear + '年</span>';

    // Transition animation
    if (direction) {
      grid.classList.add(direction > 0 ? 'slide-left' : 'slide-right');
      setTimeout(() => {
        buildCalendarGrid(grid);
        grid.classList.remove('slide-left', 'slide-right');
      }, 250);
    } else {
      buildCalendarGrid(grid);
    }
  }

  function buildCalendarGrid(grid) {
    const firstDay = new Date(currentYear, currentMonth, 1);
    let startWeekday = firstDay.getDay();
    startWeekday = startWeekday === 0 ? 6 : startWeekday - 1; // Mon=0

    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const isCurrentMonth = today.getFullYear() === currentYear && today.getMonth() === currentMonth;

    let html = '';

    // Empty cells
    for (let i = 0; i < startWeekday; i++) {
      html += '<div class="day-cell empty"></div>';
    }

    // Day cells
    for (let d = 1; d <= daysInMonth; d++) {
      const key = currentYear + '-' + (currentMonth + 1) + '-' + d;
      const data = calendarData[key];
      const isToday = isCurrentMonth && today.getDate() === d;
      const isFuture = new Date(currentYear, currentMonth, d) > today;
      const dayOfWeek = new Date(currentYear, currentMonth, d).getDay();
      const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;

      let classes = 'day-cell';
      if (isToday) classes += ' today';
      if (isWeekend && !isToday) classes += ' weekend';
      if (data) classes += ' has-data';
      if (isFuture) classes += ' future';

      // Activity level
      const level = data ? (data.activityLevel || 0) : 0;
      if (!isFuture && !isToday) {
        classes += ' level-' + level;
      } else if (isToday) {
        classes += ' level-' + level;
      }

      const clickAttr = (!isFuture && data) ? 'onclick="openSheet(\'' + key + '\')"' : '';

      html += '<div class="' + classes + '" ' + clickAttr + ' style="animation: popIn 0.25s ease-out ' + (d * 12) + 'ms both">';
      html += '<span class="day-num">' + d + '</span>';

      if (data && !isFuture) {
        if (data.checkedIn) {
          html += '<span class="cell-checkin">&#9989;</span>';
        }
        if (data.moodEmoji) {
          html += '<span class="cell-mood">' + data.moodEmoji + '</span>';
        }
      }

      html += '</div>';
    }

    grid.innerHTML = html;
  }

  // ===== Change Month =====
  window.changeMonth = function(delta) {
    currentMonth += delta;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderCalendar(delta);
    renderStats();
  };

  // ===== Bottom Sheet =====
  window.openSheet = function(dateKey) {
    const data = calendarData[dateKey];
    if (!data) return;

    const parts = dateKey.split('-');
    const d = keyToDate(dateKey);
    const weekday = WEEKDAYS[d.getDay()];
    document.getElementById('sheetDate').textContent =
      parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日 ' + weekday;

    let html = '';

    // Check-in status
    html += '<div class="sheet-row">';
    html += '<div class="sheet-row-icon">&#9989;</div>';
    html += '<div class="sheet-row-content">';
    html += '<div class="sheet-row-label">签到状态</div>';
    html += '<div class="sheet-row-value">';
    if (data.checkedIn) {
      html += '<span class="badge badge-yes">已签到</span>';
    } else {
      html += '<span class="badge badge-no">未签到</span>';
    }
    html += '</div></div></div>';

    // Mood
    html += '<div class="sheet-row">';
    html += '<div class="sheet-row-icon">' + (data.moodEmoji || '&#128528;') + '</div>';
    html += '<div class="sheet-row-content">';
    html += '<div class="sheet-row-label">选择的心情</div>';
    html += '<div class="sheet-row-value">' + (data.moodLabel || '未记录') + '</div>';
    html += '</div></div>';

    // Flipped cards
    html += '<div class="sheet-row">';
    html += '<div class="sheet-row-icon">&#127924;</div>';
    html += '<div class="sheet-row-content">';
    html += '<div class="sheet-row-label">翻了几张卡片</div>';
    html += '<div class="sheet-row-value">' + (data.flippedCards || 0) + ' 张</div>';
    html += '</div></div>';

    // Diary
    html += '<div class="sheet-row">';
    html += '<div class="sheet-row-icon">&#128221;</div>';
    html += '<div class="sheet-row-content">';
    html += '<div class="sheet-row-label">写了日记吗</div>';
    html += '<div class="sheet-row-value">';
    if (data.wroteDiary) {
      html += '<span class="badge badge-yes">写了</span>';
    } else {
      html += '<span class="badge badge-no">没写</span>';
    }
    html += '</div></div>';

    // Note (if exists)
    if (data.note) {
      html += '<div class="sheet-row">';
      html += '<div class="sheet-row-icon">&#128172;</div>';
      html += '<div class="sheet-row-content">';
      html += '<div class="sheet-row-label">当日备注</div>';
      html += '<div class="sheet-row-value" style="font-weight:400;font-size:13px;color:var(--ink-muted)">' + data.note + '</div>';
      html += '</div></div>';
    }

    document.getElementById('sheetContent').innerHTML = html;
    document.getElementById('sheetOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
  };

  window.closeSheet = function(e) {
    if (e && e.target !== document.getElementById('sheetOverlay')) return;
    document.getElementById('sheetOverlay').classList.remove('active');
    document.body.style.overflow = '';
  };

  // ===== Heatmap =====
  function renderHeatmap() {
    const grid = document.getElementById('heatmapGrid');
    const monthsEl = document.getElementById('heatmapMonths');
    const totalEl = document.getElementById('heatmapTotal');

    // 12 weeks = 84 days
    const weeks = 12;
    let html = '';
    let totalActivity = 0;
    let totalDays = 0;
    const monthLabels = [];

    // Build grid: columns = weeks, rows = 7 days (Mon-Sun)
    // We need to figure out what day of week the oldest date is
    const oldest = new Date(today);
    oldest.setDate(oldest.getDate() - (weeks * 7 - 1));

    // Adjust to start from Monday
    let startOffset = oldest.getDay();
    startOffset = startOffset === 0 ? 6 : startOffset - 1; // Mon=0

    // Generate columns (weeks)
    for (let w = 0; w < weeks; w++) {
      html += '<div class="heatmap-week">';
      for (let dow = 0; dow < 7; dow++) {
        const dayIndex = w * 7 + dow - startOffset;
        const d = new Date(oldest);
        d.setDate(d.getDate() + dayIndex);

        if (d > today) {
          html += '<div class="heatmap-cell hl0"></div>';
        } else {
          const key = dateToKey(d);
          const data = calendarData[key];
          const level = data ? (data.activityLevel || 0) : 0;
          html += '<div class="heatmap-cell hl' + level + '"></div>';
          totalActivity += level;
          totalDays++;

          // Track month labels
          if (d.getDate() === 1 || (w === 0 && dow === 0)) {
            monthLabels.push({ col: w, label: (d.getMonth() + 1) + '月' });
          }
        }
      }
      html += '</div>';
    }

    grid.innerHTML = html;

    // Month labels
    let mhtml = '';
    const seen = new Set();
    monthLabels.forEach(m => {
      if (!seen.has(m.label)) {
        // Approximate position: each week column is ~17px wide (14px cell + 3px gap)
        mhtml += '<span style="margin-left:' + (m.col * 17) + 'px">' + m.label + '</span>';
        seen.add(m.label);
      }
    });
    monthsEl.innerHTML = mhtml;

    // Total
    totalEl.innerHTML = '过去 ' + totalDays + ' 天共活跃 <strong>' + totalActivity + '</strong> 次';
  }

  // ===== Init =====
  function init() {
    renderCalendar(0);
    renderStats();
    renderHeatmap();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
