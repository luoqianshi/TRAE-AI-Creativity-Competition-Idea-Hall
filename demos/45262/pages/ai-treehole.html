<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="牛马自救指南 - AI心情树洞，倾诉烦恼获得智能安慰">
<title>AI心情树洞 · 牛马自救指南</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

  :root {
    --paper: #FDF8F0;
    --ink: #3D3229;
    --ink-muted: #7A7670;
    --accent: #D4834A;
    --accent-light: #F0D4B8;
    --card-bg: #FFFBF5;
    --bubble-ai: #FFF5EB;
    --bubble-user: #D4834A;
    --bubble-user-text: #FFFFFF;
    --paper-line: rgba(196,168,130,0.2);
    --shadow: rgba(45,42,36,0.08);
    --shadow-md: rgba(45,42,36,0.12);
    --radius: 16px;
    --transition: 0.3s ease;
  }

  html.dark-mode {
    --paper: #1E1D2B;
    --ink: #E8E4DC;
    --ink-muted: #9A968E;
    --accent: #E8954A;
    --accent-light: #3A2E20;
    --card-bg: #2A2826;
    --bubble-ai: #2E2B28;
    --bubble-user: #C07030;
    --bubble-user-text: #FFFFFF;
    --paper-line: rgba(196,168,130,0.12);
    --shadow: rgba(0,0,0,0.2);
    --shadow-md: rgba(0,0,0,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    transition: background var(--transition), color var(--transition);
  }

  .title-font {
    font-family: 'ZCOOL KuaiLe', 'STKaiti', 'KaiTi', cursive;
  }

  /* ===== App Shell ===== */
  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    transition: background var(--transition);
  }

  /* ===== Header ===== */
  .header {
    display: flex;
    align-items: center;
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    background: var(--paper);
    z-index: 50;
    border-bottom: 1px solid var(--paper-line);
    transition: background var(--transition);
  }
  .back-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--card-bg);
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px var(--shadow);
    transition: all 0.2s;
    flex-shrink: 0;
    text-decoration: none;
  }
  .back-btn:active { transform: scale(0.92); }
  .header-title {
    flex: 1;
    text-align: center;
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 20px;
    color: var(--ink);
    margin-right: 36px;
  }

  /* ===== Mood Indicator ===== */
  .mood-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 20px;
    background: linear-gradient(135deg, var(--accent-light) 0%, transparent 60%);
    font-size: 14px;
    color: var(--ink-muted);
    transition: all var(--transition);
  }
  .mood-indicator .mood-emoji {
    font-size: 22px;
    animation: moodBounce 2s ease-in-out infinite;
  }
  .mood-indicator .mood-text {
    font-weight: 500;
    color: var(--ink);
  }
  @keyframes moodBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  /* ===== Chat Area ===== */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 8px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--paper-line); border-radius: 2px; }

  /* Empty State */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
    text-align: center;
    animation: fadeInUp 0.6s ease;
  }
  .empty-state .empty-icon {
    width: 120px; height: 120px;
    background: var(--accent-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    margin-bottom: 20px;
    position: relative;
    animation: floatGentle 3s ease-in-out infinite;
  }
  .empty-state .empty-icon::after {
    content: '';
    position: absolute;
    width: 140px; height: 140px;
    border-radius: 50%;
    border: 2px dashed var(--paper-line);
    animation: spinSlow 20s linear infinite;
  }
  @keyframes floatGentle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes spinSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .empty-state h3 {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .empty-state p {
    font-size: 14px;
    color: var(--ink-muted);
    line-height: 1.6;
  }

  /* Message Bubbles */
  .message {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    animation: fadeInUp 0.4s ease;
  }
  .message.user { flex-direction: row-reverse; }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 0 2px 6px var(--shadow);
  }
  .message.ai .avatar {
    background: linear-gradient(135deg, var(--accent-light), var(--accent));
  }
  .message.user .avatar {
    background: linear-gradient(135deg, var(--accent), var(--accent-soft));
  }
  .message .bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.6;
    word-break: break-word;
    position: relative;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .message.ai .bubble {
    background: var(--bubble-ai);
    color: var(--ink);
    border-bottom-left-radius: 6px;
  }
  .message.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 6px;
  }
  .message .time {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 4px;
    opacity: 0.7;
  }
  .message.user .time { text-align: right; }

  /* Typing Indicator */
  .typing-indicator {
    display: none;
    gap: 8px;
    margin-bottom: 16px;
    animation: fadeInUp 0.3s ease;
  }
  .typing-indicator.show { display: flex; }
  .typing-indicator .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-light), var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .typing-indicator .dots {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px 18px;
    background: var(--bubble-ai);
    border-radius: 18px;
    border-bottom-left-radius: 6px;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .typing-indicator .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: typingBounce 1.4s ease-in-out infinite;
  }
  .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-8px); opacity: 1; }
  }

  /* ===== Quick Replies ===== */
  .quick-replies {
    padding: 8px 16px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .quick-replies::-webkit-scrollbar { display: none; }
  .quick-reply {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .quick-reply:active,
  .quick-reply.active {
    background: var(--accent);
    color: #fff;
    transform: scale(0.95);
  }

  /* ===== Input Area ===== */
  .input-area {
    padding: 12px 16px 20px;
    background: var(--paper);
    border-top: 1px solid var(--paper-line);
    transition: background var(--transition);
  }
  .input-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--card-bg);
    border-radius: 24px;
    padding: 8px 8px 8px 18px;
    box-shadow: 0 2px 12px var(--shadow);
    transition: all var(--transition);
  }
  .input-wrapper:focus-within {
    box-shadow: 0 2px 20px var(--shadow-md), 0 0 0 2px var(--accent-light);
  }
  .input-wrapper textarea {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: var(--ink);
    font-size: 15px;
    line-height: 1.5;
    resize: none;
    max-height: 100px;
    min-height: 24px;
    padding: 4px 0;
    font-family: inherit;
    transition: color var(--transition);
  }
  .input-wrapper textarea::placeholder { color: var(--ink-muted); opacity: 0.6; }
  .char-count {
    font-size: 11px;
    color: var(--ink-muted);
    opacity: 0.6;
    padding: 0 4px;
    align-self: center;
    white-space: nowrap;
  }
  .char-count.warn { color: #E85D4A; opacity: 1; }
  .send-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(212,131,74,0.3);
  }
  .send-btn:active { transform: scale(0.9); }
  .send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ===== Back to App ===== */
  .back-to-app {
    display: block;
    text-align: center;
    padding: 16px;
    color: var(--ink-muted);
    font-size: 13px;
    text-decoration: none;
    transition: color var(--transition);
  }
  .back-to-app:active { color: var(--accent); }

  /* ===== Responsive ===== */
  @media (max-width: 430px) {
    .app { max-width: 100%; }
    .header { padding: 12px 16px 10px; }
    .chat-area { padding: 12px 12px 8px; }
    .input-area { padding: 10px 12px 16px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Header -->
  <div class="header">
    <a href="../niujiu-demo-final.html" class="back-btn" aria-label="返回">&#8592;</a>
    <div class="header-title">AI心情树洞</div>
  </div>

  <!-- Mood Indicator -->
  <div class="mood-indicator" id="moodIndicator">
    <span class="mood-emoji" id="moodEmoji">&#127744;</span>
    <span class="mood-text" id="moodText">等待倾诉...</span>
  </div>

  <!-- Chat Area -->
  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">&#127754;</div>
      <h3>欢迎来到心情树洞</h3>
      <p>这里只有你和AI，<br>放心说出你的心里话吧。<br>所有内容都保存在本地，绝对私密。</p>
    </div>
    <div class="typing-indicator" id="typingIndicator">
      <div class="avatar">&#129302;</div>
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <!-- Quick Replies -->
  <div class="quick-replies" id="quickReplies">
    <button class="quick-reply" onclick="sendQuickReply(this)">今天好累</button>
    <button class="quick-reply" onclick="sendQuickReply(this)">工作压力好大</button>
    <button class="quick-reply" onclick="sendQuickReply(this)">想倾诉一下</button>
    <button class="quick-reply" onclick="sendQuickReply(this)">需要鼓励</button>
    <button class="quick-reply" onclick="sendQuickReply(this)">有点焦虑</button>
    <button class="quick-reply" onclick="sendQuickReply(this)">开心的事</button>
  </div>

  <!-- Input Area -->
  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="chatInput" rows="1" placeholder="说说你的心里话..." maxlength="200" oninput="handleInput(this)"></textarea>
      <span class="char-count" id="charCount">0/200</span>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>&#10148;</button>
    </div>
  </div>

  <a href="../niujiu-demo-final.html" class="back-to-app">&#8592; 返回主应用</a>
</div>

<script>
(function() {
  'use strict';

  // ===== Dark Mode =====
  function initDarkMode() {
    const isDark = localStorage.getItem('darkMode') === 'true';
    if (isDark) document.documentElement.classList.add('dark-mode');
  }
  initDarkMode();

  // ===== State =====
  const STORAGE_KEY = 'niujiu_state_v3';
  let chatHistory = [];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const state = JSON.parse(raw);
        chatHistory = state.aiChatHistory || [];
      }
    } catch(e) { chatHistory = []; }
  }

  function saveState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      let state = {};
      if (raw) state = JSON.parse(raw);
      state.aiChatHistory = chatHistory;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch(e) {}
  }

  // ===== Mood Analysis =====
  const moodKeywords = {
    'tired': { emoji: '\u{1F634}', text: '疲惫', keywords: ['累','疲惫','困','没精神','乏力','撑不住','筋疲力尽','好累','太累了','身心俱疲'] },
    'stressed': { emoji: '\u{1F629}', text: '压力大', keywords: ['压力','加班','忙','赶','deadline','截止','任务','堆','喘不过气','压力好大','忙不过来'] },
    'sad': { emoji: '\u{1F622}', text: '难过', keywords: ['难过','伤心','哭','委屈','不公平','被欺负','不开心','失落','沮丧','低落'] },
    'anxious': { emoji: '\u{1F630}', text: '焦虑', keywords: ['焦虑','紧张','担心','害怕','失眠','睡不着','烦躁','不安','恐慌','有点焦虑'] },
    'happy': { emoji: '\u{1F60A}', text: '开心', keywords: ['开心','高兴','快乐','幸福','满足','棒','好','不错','惊喜','开心的事','小确幸'] },
    'angry': { emoji: '\u{1F621}', text: '生气', keywords: ['生气','愤怒','烦','讨厌','恶心','气死','受不了','火大','无语','暴躁'] },
    'lonely': { emoji: '\u{1F614}', text: '孤独', keywords: ['孤独','寂寞','一个人','没人','没人理','被孤立','想家','想念','孤单'] },
    'encourage': { emoji: '\u{1F4AA}', text: '需要力量', keywords: ['鼓励','加油','撑','坚持','需要力量','动力','振作','打气','需要鼓励'] }
  };

  function analyzeMood(text) {
    let bestMood = null;
    let bestScore = 0;
    for (const [key, mood] of Object.entries(moodKeywords)) {
      let score = 0;
      for (const kw of mood.keywords) {
        if (text.includes(kw)) score++;
      }
      if (score > bestScore) {
        bestScore = score;
        bestMood = { key, ...mood };
      }
    }
    return bestMood || { key: 'neutral', emoji: '\u{1F60C}', text: '平静' };
  }

  function updateMoodIndicator(mood) {
    const emojiEl = document.getElementById('moodEmoji');
    const textEl = document.getElementById('moodText');
    emojiEl.textContent = mood.emoji;
    textEl.textContent = '当前心情: ' + mood.text;
    emojiEl.style.animation = 'none';
    emojiEl.offsetHeight; // reflow
    emojiEl.style.animation = 'moodBounce 2s ease-in-out infinite';
  }

  // ===== AI Response Templates =====
  const responses = {
    tired: [
      '辛苦了，今天真的很不容易吧。\n记得给自己倒杯热水，好好休息一下。你已经做得很好了，不要对自己太苛刻。',
      '累了就歇歇吧，这不是偷懒，是给自己充电。\n明天又是新的一天，今晚就好好睡一觉吧。',
      '听你说好累，我也心疼呢。\n偶尔停下来喘口气，不是软弱，而是智慧。你已经很努力了。'
    ],
    stressed: [
      '压力大的日子，记得深呼吸。\n一件事一件事来，不要想太多。你比你以为的更有能力应对这些挑战。',
      '加班到很晚吗？记得吃点东西。\n工作永远做不完，但你的健康是最重要的。适当放慢脚步也没关系的。',
      '感觉被任务压得喘不过气？\n试试把事情分成小块，做完一个划掉一个。每划掉一个，你就离终点更近一步。'
    ],
    sad: [
      '听到你这么说，我很心疼。\n难过的时候不用强撑着，哭出来也没关系。你的感受很重要，值得被认真对待。',
      '有时候生活确实不太公平。\n但请相信，这些困难终会过去的。你比你想象的更坚强，也值得被更好地对待。',
      '想哭就哭吧，眼泪不是软弱。\n它是身体在帮你释放情绪。哭完之后，记得喝杯温水，抱抱自己。'
    ],
    anxious: [
      '焦虑的时候，试试这个方法：\n找一个安静的地方，闭上眼睛，深呼吸5次。吸气4秒，屏住4秒，呼气6秒。\n你会感觉好一些的。',
      '担心的事情，有90%都不会发生。\n与其为还没到来的未来焦虑，不如专注做好眼前的事。一步一步来，你会没事的。',
      '焦虑说明你在乎，这本身不是坏事。\n但不要让焦虑控制你。试着把担心写下来，你会发现很多事情其实没有想象中那么可怕。'
    ],
    happy: [
      '太好了！听到开心的事情真让人高兴！\n把这些美好的瞬间记在心里，以后不开心的时候翻出来看看，会给你力量的。',
      '开心的时候就要尽情享受！\n分享快乐会让快乐加倍，记得把你的好心情也传递给身边的人哦。',
      '看到你这么开心，我也跟着开心起来了！\n希望这样的美好时刻能多一些。你值得拥有更多快乐。'
    ],
    angry: [
      '生气是很正常的反应，说明你的边界被触碰了。\n先让自己冷静一下，深呼吸几次。等情绪平复了，再想想怎么处理。',
      '有些事情确实让人很生气。\n但不要让别人的错误惩罚自己。你可以表达愤怒，但不要被愤怒吞噬。',
      '气大伤身，先喝杯水冷静一下。\n等你不那么生气了，也许会发现事情没有想象中那么糟。'
    ],
    lonely: [
      '你并不孤单，至少此刻我在这里听你说。\n孤独感会让人很难受，但请记住，这种感觉是暂时的。你值得被爱，也值得拥有温暖的关系。',
      '一个人待着的时候，可以做些让自己开心的事。\n听首歌、看本书、散散步。学会享受独处，也是一种能力。',
      '想家了吗？给家人打个电话或发个消息吧。\n有时候一句简单的问候，就能让心里暖起来。'
    ],
    encourage: [
      '你比你想象的更强大！\n每一次跌倒后的站起来，都让你变得更加坚韧。相信自己，你一定能度过这个难关。',
      '加油！不管现在有多难，\n请记住：没有过不去的坎，只有不肯走的路。你已经走了这么远，不要放弃。',
      '给你一个大大的拥抱！\n你正在做的事情很有意义。即使现在看不到成果，未来的你一定会感谢现在努力的自己。'
    ],
    neutral: [
      '嗯，我在听。\n不管你想说什么，都可以告诉我。这里是一个安全的空间，没有评判，只有陪伴。',
      '谢谢你愿意来这里。\n有什么想聊的都可以说，我会一直在这里陪你。',
      '今天过得怎么样？\n不管是好是坏，都值得被记录。有时候说出来，心情就会好很多。'
    ]
  };

  function getAIResponse(mood) {
    const pool = responses[mood.key] || responses.neutral;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // ===== Render =====
  function formatTime(ts) {
    const d = new Date(ts);
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    return h + ':' + m;
  }

  function renderMessages() {
    const area = document.getElementById('chatArea');
    const empty = document.getElementById('emptyState');
    const typing = document.getElementById('typingIndicator');

    if (chatHistory.length === 0) {
      // Remove all messages
      const oldMsgs = area.querySelectorAll('.message');
      oldMsgs.forEach(el => el.remove());
      empty.style.display = 'flex';
      return;
    }
    empty.style.display = 'none';

    // Find existing message elements by timestamp
    const existingMsgs = area.querySelectorAll('.message');
    const existingTimestamps = new Set();
    existingMsgs.forEach(el => {
      const ts = el.getAttribute('data-ts');
      if (ts) existingTimestamps.add(ts);
    });

    // Only append new messages
    chatHistory.forEach(msg => {
      const tsKey = String(msg.timestamp);
      if (existingTimestamps.has(tsKey)) return;

      const div = document.createElement('div');
      div.className = 'message ' + msg.role;
      div.setAttribute('data-ts', tsKey);
      const avatarEmoji = msg.role === 'ai' ? '\u{1F9D2}' : '\u{1F464}';
      div.innerHTML =
        '<div class="avatar">' + avatarEmoji + '</div>' +
        '<div>' +
          '<div class="bubble">' + escapeHtml(msg.text).replace(/\n/g, '<br>') + '</div>' +
          '<div class="time">' + formatTime(msg.timestamp) + '</div>' +
        '</div>';
      area.insertBefore(div, typing);
    });

    scrollToBottom();
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function scrollToBottom() {
    const area = document.getElementById('chatArea');
    requestAnimationFrame(() => {
      area.scrollTop = area.scrollHeight;
    });
  }

  // ===== Send Message =====
  window.sendMessage = function() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    // Add user message
    chatHistory.push({
      role: 'user',
      text: text,
      timestamp: Date.now()
    });
    saveState();

    input.value = '';
    input.style.height = 'auto';
    updateCharCount();
    renderMessages();

    // Show typing indicator
    showTyping(true);

    // Analyze mood and generate response
    const mood = analyzeMood(text);
    updateMoodIndicator(mood);

    const delay = 800 + Math.random() * 1200;
    const aiTimeout = setTimeout(() => {
      showTyping(false);
      const aiText = getAIResponse(mood);
      chatHistory.push({
        role: 'ai',
        text: aiText,
        timestamp: Date.now()
      });
      saveState();
      renderMessages();
    }, delay);

    // Store timeout for cleanup
    window._aiTreeholeTimeouts = window._aiTreeholeTimeouts || [];
    window._aiTreeholeTimeouts.push(aiTimeout);
  };

  window.sendQuickReply = function(btn) {
    const text = btn.textContent;
    document.getElementById('chatInput').value = text;
    updateCharCount();
    sendMessage();
  };

  window.handleInput = function(el) {
    // Auto-resize
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
    updateCharCount();
  };

  function updateCharCount() {
    const input = document.getElementById('chatInput');
    const count = document.getElementById('charCount');
    const btn = document.getElementById('sendBtn');
    const len = input.value.length;
    count.textContent = len + '/200';
    count.classList.toggle('warn', len > 180);
    btn.disabled = len === 0;
  }

  function showTyping(show) {
    const el = document.getElementById('typingIndicator');
    el.classList.toggle('show', show);
    if (show) scrollToBottom();
  }

  // ===== Enter to send =====
  function onChatInputKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }
  document.getElementById('chatInput').addEventListener('keydown', onChatInputKeydown);

  // ===== Cleanup on page unload =====
  window.addEventListener('beforeunload', function() {
    document.getElementById('chatInput').removeEventListener('keydown', onChatInputKeydown);
    if (window._aiTreeholeTimeouts) {
      window._aiTreeholeTimeouts.forEach(function(t) { clearTimeout(t); });
      window._aiTreeholeTimeouts = [];
    }
  });

  // ===== Init =====
  loadState();
  renderMessages();
  if (chatHistory.length > 0) {
    const lastUserMsg = [...chatHistory].reverse().find(m => m.role === 'user');
    if (lastUserMsg) {
      const mood = analyzeMood(lastUserMsg.text);
      updateMoodIndicator(mood);
    }
  }

})();
</script>
</body>
</html>
