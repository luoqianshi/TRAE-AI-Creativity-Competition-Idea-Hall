<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="牛马自救指南 - 情绪弹幕墙，匿名释放你的情绪">
<title>情绪弹幕墙 · 牛马自救指南</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  /* ========== CSS Variables ========== */
  :root {
    --bg: #f0ebe3;
    --bg2: #ffffff;
    --ink: #2c2c2c;
    --accent: #E8916A;
    --ink-muted: #99928a;
    --barrage-layer: rgba(255, 255, 255, 0.03);
    --glow: rgba(232, 145, 106, 0.3);
  }
  html.dark-mode {
    --bg: #1a1a1e;
    --bg2: #26262c;
    --ink: #e8e6e3;
    --ink-muted: #7a7a80;
    --barrage-layer: rgba(0, 0, 0, 0.15);
    --glow: rgba(232, 145, 106, 0.5);
  }

  /* ========== Reset & Base ========== */
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: var(--bg);
    color: var(--ink);
  }

  /* ========== Animated Gradient Background ========== */
  .bg-anim {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: linear-gradient(135deg, var(--bg) 0%, color-mix(in srgb, var(--accent) 8%, var(--bg)) 50%, var(--bg) 100%);
    animation: gradientShift 12s ease-in-out infinite alternate;
  }
  html.dark-mode .bg-anim {
    background: linear-gradient(135deg, var(--bg) 0%, color-mix(in srgb, var(--accent) 12%, var(--bg)) 50%, var(--bg) 100%);
  }
  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ========== Page Layout ========== */
  .page {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    opacity: 0;
    animation: pageFadeIn 0.6s ease forwards;
  }
  @keyframes pageFadeIn {
    to { opacity: 1; }
  }

  /* ========== Header ========== */
  .header {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    gap: 12px;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  .back-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--bg2);
    color: var(--ink);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: transform 0.15s, box-shadow 0.15s;
    flex-shrink: 0;
    touch-action: manipulation;
  }
  .back-btn:active {
    transform: scale(0.92);
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .header-title {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .header-title .accent {
    color: var(--accent);
  }
  .header-badge {
    margin-left: auto;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    background: color-mix(in srgb, var(--accent) 20%, var(--bg2));
    color: var(--accent);
    font-weight: 500;
    white-space: nowrap;
  }

  /* ========== Barrage Canvas ========== */
  .canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    margin: 0 12px 8px;
    border-radius: 20px;
    background: var(--barrage-layer);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    border: 1px solid color-mix(in srgb, var(--ink-muted) 10%, transparent);
    min-height: 0;
  }
  .canvas-inner {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  /* ========== Bullet Comments ========== */
  .bullet {
    position: absolute;
    white-space: nowrap;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.18), 0 0 12px rgba(0,0,0,0.08);
    will-change: transform;
    pointer-events: none;
    line-height: 1.4;
    opacity: 0;
    animation: bulletEnter 0.35s ease forwards;
  }
  @keyframes bulletEnter {
    0%   { opacity: 0; transform: translateX(0) scale(0.85); }
    100% { opacity: 1; transform: translateX(0) scale(1); }
  }

  /* ========== Empty State ========== */
  .empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--ink-muted);
    transition: opacity 0.5s;
    pointer-events: none;
    user-select: none;
  }
  .empty-state.hidden {
    opacity: 0;
  }
  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.6;
  }
  .empty-state .text {
    font-size: 14px;
    font-weight: 500;
  }
  .empty-state .sub {
    font-size: 12px;
    margin-top: 4px;
    opacity: 0.7;
  }

  /* ========== Bottom Input Area ========== */
  .input-area {
    flex-shrink: 0;
    padding: 10px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Mood emoji quick-select */
  .mood-row {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .mood-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: var(--bg2);
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.18s;
    touch-action: manipulation;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .mood-btn:active {
    transform: scale(0.88);
  }
  .mood-btn.active {
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--glow);
    transform: scale(1.08);
  }

  /* Input row */
  .input-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .input-row input {
    flex: 1;
    height: 42px;
    border-radius: 21px;
    border: 1.5px solid color-mix(in srgb, var(--ink-muted) 20%, transparent);
    background: var(--bg2);
    color: var(--ink);
    font-size: 15px;
    padding: 0 18px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  .input-row input::placeholder {
    color: var(--ink-muted);
  }
  .input-row input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--glow);
  }

  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    flex-shrink: 0;
    touch-action: manipulation;
    box-shadow: 0 3px 10px var(--glow);
  }
  .send-btn:active {
    transform: scale(0.88);
    box-shadow: 0 1px 4px var(--glow);
  }
  .send-btn:disabled {
    opacity: 0.5;
    transform: none;
    box-shadow: none;
  }

  /* ========== Dark Mode Toggle (small) ========== */
  .dm-toggle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--bg2);
    color: var(--ink);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: transform 0.15s;
    flex-shrink: 0;
    touch-action: manipulation;
    margin-left: auto;
  }
  .dm-toggle:active {
    transform: scale(0.92);
  }

  /* ========== Responsive fine-tune ========== */
  @media (max-width: 480px) {
    .header { padding: 10px 12px; }
    .header-title { font-size: 16px; }
    .canvas-wrap { margin: 0 8px 4px; border-radius: 16px; }
    .input-area { padding: 8px 12px 14px; gap: 8px; }
    .mood-btn { width: 38px; height: 38px; font-size: 20px; }
    .input-row input { height: 38px; font-size: 14px; padding: 0 14px; }
    .send-btn { width: 38px; height: 38px; font-size: 18px; }
    .back-btn, .dm-toggle { width: 36px; height: 36px; font-size: 15px; }
  }
  @media (max-width: 360px) {
    .mood-btn { width: 34px; height: 34px; font-size: 17px; }
  }
</style>
</head>
<body>

<!-- Animated Background -->
<div class="bg-anim"></div>

<!-- Page -->
<div class="page" id="app">

  <!-- Header -->
  <header class="header">
    <button class="back-btn" id="backBtn" aria-label="返回">&#x2190;</button>
    <span class="header-title">情绪<span class="accent">弹幕</span>墙</span>
    <span class="header-badge">&#x25CF; 实时</span>
    <button class="dm-toggle" id="dmToggle" aria-label="切换深色模式">&#x263E;</button>
  </header>

  <!-- Canvas -->
  <div class="canvas-wrap">
    <div class="canvas-inner" id="canvas">
      <div class="empty-state" id="emptyState">
        <div class="icon">&#x1F4AC;</div>
        <div class="text">弹幕正在加载...</div>
        <div class="sub">分享你的打工 mood</div>
      </div>
    </div>
  </div>

  <!-- Bottom Input -->
  <div class="input-area">
    <div class="mood-row" id="moodRow">
      <button class="mood-btn" data-emoji="&#x1F60A;" aria-label="开心">&#x1F60A;</button>
      <button class="mood-btn" data-emoji="&#x1F622;" aria-label="难过">&#x1F622;</button>
      <button class="mood-btn" data-emoji="&#x1F624;" aria-label="生气">&#x1F624;</button>
      <button class="mood-btn" data-emoji="&#x1F634;" aria-label="困">&#x1F634;</button>
      <button class="mood-btn" data-emoji="&#x1F97A;" aria-label="委屈">&#x1F97A;</button>
      <button class="mood-btn" data-emoji="&#x1F92F;" aria-label="崩溃">&#x1F92F;</button>
    </div>
    <div class="input-row">
      <input type="text" id="textInput" placeholder="说点啥... 吐槽你的工作" maxlength="50" autocomplete="off">
      <button class="send-btn" id="sendBtn" aria-label="发送">&#x27A4;</button>
    </div>
  </div>

</div>

<script>
(function() {
  'use strict';

  // ========== Dark mode init ==========
  const stored = localStorage.getItem('darkMode');
  if (stored === 'true' || (stored === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark-mode');
    dmToggle.innerHTML = '&#x2600;';
  }

  // ========== DOM refs ==========
  const canvas = document.getElementById('canvas');
  const emptyState = document.getElementById('emptyState');
  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const moodBtns = document.querySelectorAll('.mood-btn');
  const backBtn = document.getElementById('backBtn');
  const dmToggle = document.getElementById('dmToggle');

  // ========== State ==========
  let selectedEmoji = '\u{1F60A}';  // default smile
  let bulletCount = 0;
  let animFrameId = null;
  let bulletElements = [];
  const MAX_VISIBLE = 8;

  // ========== Color palette for bullets ==========
  const COLORS = [
    '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7',
    '#DDA0DD', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E9',
    '#F0B27A', '#82E0AA', '#F1948A', '#AED6F1', '#D7BDE2',
    '#F9E79F', '#A3E4D7', '#FAD7A0', '#ABEBC6', '#F5B7B1',
  ];

  // ========== Pre-made bullet comments ==========
  const PREMADE = [
    { text: '这班是一天都不想上了 😩', emoji: '\u{1F624}' },
    { text: '咖啡续命中 ☕', emoji: '\u{1F60A}' },
    { text: '摸鱼被发现了... 😰', emoji: '\u{1F92F}' },
    { text: '周五怎么还没到 🥲', emoji: '\u{1F97A}' },
    { text: '工位坐穿 腰椎报废', emoji: '\u{1F634}' },
    { text: '老板画饼 我吃撑了', emoji: '\u{1F622}' },
    { text: '又熬了一个大夜 🌚', emoji: '\u{1F634}' },
    { text: '工资没涨 血压涨了', emoji: '\u{1F624}' },
    { text: '同事摸鱼我写 BUG', emoji: '\u{1F92F}' },
    { text: '这个需求不合理！😤', emoji: '\u{1F624}' },
    { text: '我 TM 就是牛马本马 🐴', emoji: '\u{1F92F}' },
    { text: '好想一键离职 💨', emoji: '\u{1F622}' },
    { text: '茶水间偶遇老板 尴尬', emoji: '\u{1F97A}' },
    { text: '今天又忘带工卡了 🤦', emoji: '\u{1F602}' },
    { text: '在工位上偷偷看这个 🤫', emoji: '\u{1F60A}' },
    { text: '下班了！冲！🏃‍♂️💨', emoji: '\u{1F624}' },
    { text: '钉钉消息不敢看 📵', emoji: '\u{1F92F}' },
    { text: '会议室又吵起来了 🙉', emoji: '\u{1F622}' },
    { text: '三年经验 三年摸鱼经验', emoji: '\u{1F634}' },
    { text: '活着就好 🙏', emoji: '\u{1F97A}' },
    { text: '被 KPI 支配的一天 📊', emoji: '\u{1F624}' },
  ];

  // ========== Pick random item ==========
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // ========== Create a bullet comment ==========
  function createBullet(text, emoji, colorOverride) {
    const canvasRect = canvas.getBoundingClientRect();
    if (!canvasRect.width || !canvasRect.height) return;

    const el = document.createElement('div');
    el.className = 'bullet';
    const color = colorOverride || pick(COLORS);

    // Determine size & speed
    const sizeRoll = Math.random();
    let fontSize, speed;
    if (sizeRoll < 0.25) {
      fontSize = 20 + Math.random() * 4;   // large
      speed = 35 + Math.random() * 20;
    } else if (sizeRoll < 0.6) {
      fontSize = 16 + Math.random() * 4;   // medium
      speed = 45 + Math.random() * 25;
    } else {
      fontSize = 13 + Math.random() * 3;   // small
      speed = 55 + Math.random() * 35;
    }

    const displayText = emoji ? `${emoji} ${text}` : text;
    el.textContent = displayText;
    el.style.color = color;
    el.style.fontSize = fontSize + 'px';
    el.style.top = (8 + Math.random() * 75) + '%';

    // Start off-screen right
    const startX = canvasRect.width + 20;
    el.style.left = startX + 'px';

    // Add a subtle glow matching the color
    el.style.textShadow = `0 1px 6px rgba(0,0,0,0.25), 0 0 16px ${color}44`;

    // Dark mode slightly brighter
    if (document.documentElement.classList.contains('dark-mode')) {
      el.style.textShadow = `0 1px 6px rgba(0,0,0,0.4), 0 0 20px ${color}66`;
    }

    canvas.appendChild(el);
    bulletElements.push(el);
    bulletCount++;

    // Hide empty state
    emptyState.classList.add('hidden');

    // Animate with requestAnimationFrame
    const duration = (canvasRect.width + 60) / speed; // seconds
    const startTime = performance.now();

    function animateBullet(now) {
      const elapsed = (now - startTime) / 1000;
      const progress = Math.min(elapsed / duration, 1);
      const x = startX - progress * (canvasRect.width + 60 + 200);
      el.style.transform = `translateX(${x - startX}px)`;

      if (progress < 1) {
        // Check if element is still in DOM
        if (el.parentNode) {
          animFrameId = requestAnimationFrame(animateBullet);
        }
      } else {
        removeBullet(el);
      }
    }

    animFrameId = requestAnimationFrame(animateBullet);

    // Enforce max visible
    enforceMax();
  }

  // ========== Remove bullet ==========
  function removeBullet(el) {
    if (el.parentNode) {
      el.remove();
      const idx = bulletElements.indexOf(el);
      if (idx !== -1) bulletElements.splice(idx, 1);
    }
    if (bulletElements.length === 0) {
      emptyState.classList.remove('hidden');
    }
  }

  // ========== Enforce max visible bullets ==========
  function enforceMax() {
    while (bulletElements.length > MAX_VISIBLE + 3) {
      const oldest = bulletElements[0];
      if (oldest && oldest.parentNode) {
        // Fade out quickly
        oldest.style.transition = 'opacity 0.3s';
        oldest.style.opacity = '0';
        setTimeout(() => removeBullet(oldest), 300);
      }
    }
  }

  // ========== Send a bullet ==========
  function sendBullet(text, emoji) {
    const t = (text || '').trim();
    if (!t && !emoji) return;
    const displayText = t || '(无声吐槽)';
    const e = emoji || '';
    createBullet(displayText, e);
  }

  // ========== Submit from input ==========
  function handleSubmit() {
    const text = textInput.value.trim();
    if (!text && !selectedEmoji) return;
    const displayText = text || '--';
    createBullet(displayText, selectedEmoji);
    textInput.value = '';
    textInput.focus();
  }

  // ========== Load pre-made bullets gradually ==========
  function loadPremade() {
    let index = 0;
    function fireNext() {
      if (index >= PREMADE.length) return;
      const item = PREMADE[index];
      createBullet(item.text, item.emoji);
      index++;
      // Random delay between 500ms and 2000ms
      const delay = 500 + Math.random() * 1500;
      setTimeout(fireNext, delay);
    }
    // Start after a brief pause
    setTimeout(fireNext, 400);
  }

  // ========== Mood button selection ==========
  moodBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      moodBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      selectedEmoji = this.dataset.emoji;
      // Haptic-like feedback
      textInput.focus();
    });
  });

  // Select first mood by default
  if (moodBtns.length > 0) {
    moodBtns[0].classList.add('active');
    selectedEmoji = moodBtns[0].dataset.emoji;
  }

  // ========== Event listeners ==========
  sendBtn.addEventListener('click', handleSubmit);
  textInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleSubmit();
    }
  });

  backBtn.addEventListener('click', function() {
    window.location.href='../niujiu-demo-final.html';
  });

  dmToggle.addEventListener('click', function() {
    document.documentElement.classList.toggle('dark-mode');
    const isDark = document.documentElement.classList.contains('dark-mode');
    localStorage.setItem('darkMode', isDark ? 'true' : 'false');
    dmToggle.innerHTML = isDark ? '&#x2600;' : '&#x263E;';
    // Re-glow existing bullets
    bulletElements.forEach(el => {
      const color = el.style.color;
      if (isDark) {
        el.style.textShadow = `0 1px 6px rgba(0,0,0,0.4), 0 0 20px ${color}66`;
      } else {
        el.style.textShadow = `0 1px 6px rgba(0,0,0,0.25), 0 0 16px ${color}44`;
      }
    });
  });

  // ========== Clean up bullets on resize to avoid layout issues ==========
  let resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      // On resize, remove bullets that are way off
      // Just clean up any stuck ones
    }, 300);
  });

  // ========== Cleanup on page hide (optional) ==========
  // Not strictly necessary but good practice

  // ========== Init ==========
  loadPremade();

  // Also periodically add random ones to keep it lively
  setInterval(function() {
    // Only add if not too many and canvas is visible
    if (bulletElements.length < MAX_VISIBLE) {
      const item = pick(PREMADE);
      createBullet(item.text, item.emoji);
    }
  }, 5000);

})();

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>
</body>
</html>
