<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="牛马自救指南 - 记录和管理你的愿望清单，追踪实现进度">
<title>愿望清单 · 牛马自救指南</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  /* ==============================
     CSS Variables & Theme
  ============================== */
  :root {
    --bg: #F8F6F3;
    --bg2: #FFFFFF;
    --ink: #2D2A24;
    --ink-muted: #9C978F;
    --accent: #E8916A;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
    --transition: 0.3s cubic-bezier(.4,0,.2,1);
    /* Category colors */
    --cat-career: #F59E0B;
    --cat-career-bg: rgba(245,158,11,0.12);
    --cat-finance: #10B981;
    --cat-finance-bg: rgba(16,185,129,0.12);
    --cat-lifestyle: #0EA5E9;
    --cat-lifestyle-bg: rgba(14,165,233,0.12);
    --cat-relation: #F43F5E;
    --cat-relation-bg: rgba(244,63,94,0.12);
    --cat-growth: #8B5CF6;
    --cat-growth-bg: rgba(139,92,246,0.12);
    --cat-health: #EF4444;
    --cat-health-bg: rgba(239,68,68,0.12);
  }

  html.dark-mode {
    --bg: #1A1816;
    --bg2: #262320;
    --ink: #EDE9E3;
    --ink-muted: #8A847C;
    --shadow: 0 2px 12px rgba(0,0,0,0.3);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.45);
    --cat-career-bg: rgba(245,158,11,0.20);
    --cat-finance-bg: rgba(16,185,129,0.20);
    --cat-lifestyle-bg: rgba(14,165,233,0.20);
    --cat-relation-bg: rgba(244,63,94,0.20);
    --cat-growth-bg: rgba(139,92,246,0.20);
    --cat-health-bg: rgba(239,68,68,0.20);
  }

  /* ==============================
     Reset & Base
  ============================== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    transition: background var(--transition), color var(--transition);
    padding-bottom: 80px;
    overflow-x: hidden;
  }

  /* ==============================
     Scrollbar
  ============================== */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--ink-muted); border-radius: 4px; }

  /* ==============================
     Header
  ============================== */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(128,128,128,0.10);
    transition: background var(--transition);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .back-btn {
    width: 36px;
    height: 36px;
    border: none;
    background: var(--bg2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    color: var(--ink);
    transition: all var(--transition);
    box-shadow: var(--shadow);
  }

  .back-btn:active { transform: scale(0.9); }

  .header-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .header-title span { color: var(--accent); }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border: none;
    background: var(--bg2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    color: var(--ink);
    transition: all var(--transition);
    box-shadow: var(--shadow);
  }

  .icon-btn:active { transform: scale(0.9); }

  /* ==============================
     Daily Quote
  ============================== */
  .quote-bar {
    padding: 16px 16px 8px;
    text-align: center;
  }

  .quote-text {
    font-size: 14px;
    color: var(--ink-muted);
    font-style: italic;
    line-height: 1.7;
    max-width: 360px;
    margin: 0 auto;
    position: relative;
  }

  .quote-text::before { content: "\201C"; }
  .quote-text::after { content: "\201D"; }

  .quote-author {
    font-size: 12px;
    color: var(--ink-muted);
    opacity: 0.7;
    margin-top: 2px;
    font-style: normal;
  }

  /* ==============================
     Stats Bar
  ============================== */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 8px 16px 4px;
  }

  .stat-item {
    background: var(--bg2);
    border-radius: var(--radius-sm);
    padding: 10px 6px;
    text-align: center;
    box-shadow: var(--shadow);
    transition: background var(--transition);
  }

  .stat-value {
    font-size: 20px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.2;
  }

  .stat-label {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 2px;
  }

  /* ==============================
     Filter & Sort
  ============================== */
  .controls {
    display: flex;
    gap: 8px;
    padding: 12px 16px 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .controls::-webkit-scrollbar { display: none; }

  .filter-chip {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid rgba(128,128,128,0.20);
    background: var(--bg2);
    color: var(--ink-muted);
    font-size: 13px;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
    user-select: none;
  }

  .filter-chip:active { transform: scale(0.95); }
  .filter-chip.active {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }

  .sort-btn {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1.5px solid rgba(128,128,128,0.20);
    background: var(--bg2);
    color: var(--ink-muted);
    font-size: 13px;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .sort-btn:active { transform: scale(0.95); }
  .sort-btn.active { border-color: var(--accent); color: var(--accent); }

  /* ==============================
     Masonry Grid
  ============================== */
  .masonry {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 8px 16px;
  }

  /* ==============================
     Wish Card
  ============================== */
  .wish-card {
    background: var(--bg2);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: all var(--transition);
    position: relative;
    overflow: hidden;
    animation: cardEnter 0.5s ease backwards;
    break-inside: avoid;
  }

  .wish-card:active { transform: scale(0.97); }

  .wish-card .card-color-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
  }

  .wish-card .card-emoji {
    font-size: 28px;
    margin-bottom: 8px;
    display: block;
  }

  .wish-card .card-title {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .wish-card .card-category {
    display: inline-block;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 12px;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .wish-card .card-date {
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .wish-card .card-difficulty {
    font-size: 11px;
    color: var(--ink-muted);
    margin-bottom: 6px;
  }

  .wish-card .card-notes {
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.5;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Progress Bar */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .progress-track {
    flex: 1;
    height: 6px;
    background: rgba(128,128,128,0.12);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
    background: var(--accent);
  }

  .progress-text {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-muted);
    min-width: 36px;
    text-align: right;
  }

  .wish-card.completed .progress-fill {
    background: #10B981;
  }

  .wish-card.completed .card-title {
    text-decoration: line-through;
    opacity: 0.6;
  }

  /* Card size variants */
  .wish-card.card-lg {
    grid-column: span 2;
  }

  /* Card animations */
  @keyframes cardEnter {
    from {
      opacity: 0;
      transform: scale(0.85) translateY(20px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  @keyframes celebrationPop {
    0% { transform: scale(1); }
    30% { transform: scale(1.08); }
    60% { transform: scale(0.97); }
    100% { transform: scale(1); }
  }

  .wish-card.celebrate {
    animation: celebrationPop 0.6s ease;
  }

  /* Confetti particles */
  .confetti-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
  }

  .confetti-piece {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    animation: confettiFall linear forwards;
  }

  @keyframes confettiFall {
    0% {
      opacity: 1;
      transform: translateY(-10px) rotate(0deg) scale(1);
    }
    100% {
      opacity: 0;
      transform: translateY(100vh) rotate(720deg) scale(0.3);
    }
  }

  /* ==============================
     Empty State
  ============================== */
  .empty-state {
    padding: 60px 32px;
    text-align: center;
    grid-column: span 2;
  }

  .empty-state .empty-icon {
    font-size: 72px;
    margin-bottom: 16px;
    display: block;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .empty-state .empty-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .empty-state .empty-desc {
    font-size: 14px;
    color: var(--ink-muted);
    line-height: 1.7;
    margin-bottom: 20px;
  }

  .empty-state .empty-btn {
    display: inline-block;
    padding: 12px 28px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
  }

  .empty-state .empty-btn:active { transform: scale(0.95); }

  /* ==============================
     FAB - Add Wish
  ============================== */
  .fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(232,145,106,0.40);
    transition: all var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }

  .fab:active { transform: scale(0.9); }

  /* ==============================
     Modal
  ============================== */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.25s ease;
  }

  .modal-overlay.show { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal-sheet {
    background: var(--bg2);
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 16px));
    animation: slideUp 0.35s cubic-bezier(.4,0,.2,1);
    transition: background var(--transition);
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: rgba(128,128,128,0.25);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .modal-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 20px;
    text-align: center;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-muted);
    margin-bottom: 6px;
  }

  .form-label .required { color: #EF4444; }

  .form-input,
  .form-textarea,
  .form-select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid rgba(128,128,128,0.18);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    transition: all var(--transition);
    outline: none;
    font-family: inherit;
  }

  .form-input:focus,
  .form-textarea:focus,
  .form-select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(232,145,106,0.15);
  }

  .form-textarea {
    resize: vertical;
    min-height: 80px;
  }

  .char-count {
    text-align: right;
    font-size: 12px;
    color: var(--ink-muted);
    margin-top: 4px;
  }

  .char-count.over { color: #EF4444; }

  /* Category Picker */
  .category-picker {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .cat-option {
    padding: 10px 6px;
    border-radius: var(--radius-sm);
    border: 2px solid rgba(128,128,128,0.15);
    background: var(--bg);
    text-align: center;
    cursor: pointer;
    transition: all var(--transition);
    font-size: 13px;
    user-select: none;
  }

  .cat-option:active { transform: scale(0.95); }
  .cat-option.selected { border-color: var(--accent); background: rgba(232,145,106,0.08); }

  .cat-option .cat-emoji { font-size: 22px; display: block; margin-bottom: 2px; }

  /* Difficulty Picker */
  .diff-picker {
    display: flex;
    gap: 8px;
  }

  .diff-option {
    flex: 1;
    padding: 8px;
    border-radius: var(--radius-sm);
    border: 2px solid rgba(128,128,128,0.15);
    background: var(--bg);
    text-align: center;
    cursor: pointer;
    transition: all var(--transition);
    font-size: 13px;
    user-select: none;
  }

  .diff-option:active { transform: scale(0.95); }
  .diff-option.selected { border-color: var(--accent); background: rgba(232,145,106,0.08); }

  .btn-primary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition);
  }

  .btn-primary:active { transform: scale(0.97); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-secondary {
    width: 100%;
    padding: 12px;
    border: 1.5px solid rgba(128,128,128,0.20);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--ink-muted);
    font-size: 14px;
    cursor: pointer;
    transition: all var(--transition);
    margin-top: 8px;
  }

  .btn-secondary:active { transform: scale(0.97); }

  /* Progress update modal */
  .progress-update-area {
    text-align: center;
    padding: 16px 0;
  }

  .progress-big {
    font-size: 48px;
    font-weight: 800;
    color: var(--accent);
  }

  .progress-label {
    font-size: 14px;
    color: var(--ink-muted);
    margin-top: 4px;
  }

  .progress-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .progress-actions button {
    flex: 1;
    padding: 12px;
    border-radius: var(--radius-sm);
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
  }

  .progress-actions button:active { transform: scale(0.95); }

  .btn-inc {
    background: rgba(232,145,106,0.15);
    color: var(--accent);
  }

  .btn-complete {
    background: #10B981;
    color: #fff;
  }

  .btn-dec {
    background: rgba(128,128,128,0.10);
    color: var(--ink-muted);
  }

  /* Share toast */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    z-index: 300;
    opacity: 0;
    transition: all 0.35s ease;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ==============================
     Responsive
  ============================== */
  @media (max-width: 480px) {
    .header { padding: 10px 12px; }
    .stats-bar { padding: 8px 10px 4px; gap: 6px; }
    .stat-value { font-size: 18px; }
    .stat-label { font-size: 10px; }
    .masonry { padding: 8px 10px; gap: 8px; }
    .controls { padding: 10px 10px 6px; }
    .modal-sheet { padding: 20px 16px; }
    .quote-bar { padding: 12px 12px 4px; }
  }

  @media (min-width: 481px) and (max-width: 640px) {
    .masonry { padding: 8px 16px; }
  }
</style>
</head>
<body>
  <!-- ===== Header ===== -->
  <header class="header">
    <div class="header-left">
      <button class="back-btn" onclick="window.location.href='../niujiu-demo-final.html'" aria-label="返回">&#x2190;</button>
      <div class="header-title">愿望<span>清单</span></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleDarkMode()" id="darkToggle" aria-label="切换暗色模式">&#x263E;</button>
    </div>
  </header>

  <!-- ===== Daily Quote ===== -->
  <div class="quote-bar">
    <div class="quote-text" id="dailyQuote"></div>
    <div class="quote-author" id="quoteAuthor"></div>
  </div>

  <!-- ===== Stats Bar ===== -->
  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">总愿望</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="statCompleted">0</div>
      <div class="stat-label">已完成</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="statInProgress">0</div>
      <div class="stat-label">进行中</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="statRate">0%</div>
      <div class="stat-label">完成率</div>
    </div>
  </div>

  <!-- ===== Filter & Sort ===== -->
  <div class="controls" id="controls">
    <button class="filter-chip active" data-filter="all">&#x1F3AF; 全部</button>
    <button class="sort-btn" id="sortBtn">&#x1F500; 排序</button>
  </div>

  <!-- ===== Masonry Grid ===== -->
  <div class="masonry" id="masonry"></div>

  <!-- ===== FAB ===== -->
  <button class="fab" id="fabAdd" aria-label="添加愿望">+</button>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast"></div>

  <!-- ===== Add/Edit Modal ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title" id="modalTitle">&#x2728; 许下新愿望</div>

      <div class="form-group">
        <label class="form-label">愿望标题 <span class="required">*</span></label>
        <input class="form-input" id="inputTitle" placeholder="写下你的愿望..." maxlength="50">
      </div>

      <div class="form-group">
        <label class="form-label">分类 <span class="required">*</span></label>
        <div class="category-picker" id="categoryPicker"></div>
      </div>

      <div class="form-group">
        <label class="form-label">目标日期</label>
        <input class="form-input" id="inputDate" type="date">
      </div>

      <div class="form-group">
        <label class="form-label">难度</label>
        <div class="diff-picker" id="diffPicker">
          <div class="diff-option" data-diff="easy">&#x1F331; 简单</div>
          <div class="diff-option selected" data-diff="medium">&#x1F31F; 适中</div>
          <div class="diff-option" data-diff="hard">&#x1F4AA; 困难</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">备注</label>
        <textarea class="form-textarea" id="inputNotes" placeholder="写下你的行动计划..." maxlength="200"></textarea>
        <div class="char-count" id="charCount">0/200</div>
      </div>

      <button class="btn-primary" id="btnSave">&#x2728; 许下愿望</button>
      <button class="btn-secondary" id="btnCancel">取消</button>
    </div>
  </div>

  <!-- ===== Progress Modal ===== -->
  <div class="modal-overlay" id="progressOverlay">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title" id="progressTitle">&#x1F31F; 更新进度</div>

      <div id="progressDetail" style="text-align:center;margin-bottom:16px;"></div>

      <div class="progress-update-area">
        <div class="progress-big" id="progressBigNum">0%</div>
        <div class="progress-label">当前进度</div>
        <div class="progress-actions">
          <button class="btn-dec" id="btnDec">-10%</button>
          <button class="btn-inc" id="btnInc">+10%</button>
          <button class="btn-complete" id="btnMarkComplete">&#x2705; 标记完成</button>
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-top:16px;">
        <button class="btn-secondary" style="flex:1;" id="btnShareWish">&#x1F91D; 分享</button>
        <button class="btn-secondary" style="flex:1;" id="btnDeleteWish">&#x1F5D1; 删除</button>
      </div>
      <button class="btn-secondary" id="btnProgressClose">关闭</button>
    </div>
  </div>

  <!-- ===== Confetti Container ===== -->
  <div class="confetti-container" id="confettiContainer"></div>

  <script>
  (function(){
    'use strict';

    /* ================================
       Constants
    ================================ */
    const STORAGE_KEY = 'wish_list_data';
    const DARK_KEY = 'darkMode';
    const QUOTES_KEY = 'wish_quote_date';

    const CATEGORIES = [
      { id: 'career',     emoji: '\uD83D\uDCBC', label: '工作/职业', color: '#F59E0B' },
      { id: 'finance',    emoji: '\uD83D\uDCB0', label: '财务/搞钱', color: '#10B981' },
      { id: 'lifestyle',  emoji: '\uD83C\uDFE0', label: '生活/旅行', color: '#0EA5E9' },
      { id: 'relation',   emoji: '\u2764\uFE0F',  label: '情感/关系', color: '#F43F5E' },
      { id: 'growth',     emoji: '\uD83C\uDF31', label: '成长/学习', color: '#8B5CF6' },
      { id: 'health',     emoji: '\uD83C\uDFAF', label: '健康/运动', color: '#EF4444' }
    ];

    const QUOTES = [
      { text: '种一棵树最好的时间是十年前，其次是现在', author: '非洲谚语' },
      { text: '千里之行，始于足下', author: '老子' },
      { text: '梦想还是要有的，万一实现了呢', author: '马云' },
      { text: '你的愿望，就是你的超能力', author: '佚名' },
      { text: '相信你自己，你已经比想象中更强大', author: '佚名' },
      { text: '每一个认真的愿望，都值得被温柔以待', author: '佚名' },
      { text: '不要去等待完美的时刻，把握好现在让此刻变得完美', author: '佚名' },
      { text: '人生最大的冒险，就是过你梦想中的生活', author: '佚名' },
      { text: '目标不是终点线，而是新旅程的起点', author: '佚名' },
      { text: '当你真心渴望某样东西时，整个宇宙都会来帮忙', author: '保罗·科埃略' },
      { text: '不积跬步，无以至千里', author: '荀子' },
      { text: '道阻且长，行则将至', author: '荀子' },
      { text: '山再高，往上攀，总能登顶', author: '佚名' },
      { text: '路再远，走下去，定能到达', author: '佚名' },
      { text: '愿你在奔波的路上，仍有不灭的热望', author: '佚名' },
      { text: '把大目标拆成小确幸，每一天都在靠近', author: '佚名' },
      { text: '不求一步登天，但求日日进步', author: '佚名' },
      { text: '愿望是种下的种子，行动是浇灌的水', author: '佚名' },
      { text: '牛马的日子，也要有星辰大海的梦想', author: '佚名' },
      { text: '上班已经很累了，但梦想还是要有的', author: '佚名' },
      { text: '每天进步1%，一年后你就是37倍强的自己', author: '佚名' },
      { text: '不要因为走得太远，而忘了为什么出发', author: '纪伯伦' },
      { text: '只要方向是对的，就不怕路远', author: '佚名' },
      { text: '梦想不是用来仰望的，是用来实现的', author: '佚名' },
      { text: '你想过什么样的生活，就付出什么样的努力', author: '佚名' },
      { text: '今天的努力是明天的底气', author: '佚名' },
      { text: '慢慢来，比较快', author: '佚名' },
      { text: '所有的不可能，都是还没发生的可能', author: '佚名' },
      { text: '愿你眼中有光，心中有梦，脚下有路', author: '佚名' },
      { text: '自救的第一步，是敢于许下愿望', author: '佚名' }
    ];

    const DIFFICULTY_MAP = { easy: '\uD83C\uDF31 简单', medium: '\uD83C\uDF1F 适中', hard: '\uD83D\uDCAA 困难' };

    /* ================================
       State
    ================================ */
    let wishes = [];
    let currentFilter = 'all';
    let currentSort = 'date'; // date | progress | category
    let editId = null;
    let progressWishId = null;
    let selectedCategory = null;

    /* ================================
       DOM Refs
    ================================ */
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    const masonry = $('#masonry');
    const modalOverlay = $('#modalOverlay');
    const progressOverlay = $('#progressOverlay');
    const modalTitle = $('#modalTitle');
    const inputTitle = $('#inputTitle');
    const categoryPicker = $('#categoryPicker');
    const diffPicker = $('#diffPicker');
    const inputDate = $('#inputDate');
    const inputNotes = $('#inputNotes');
    const charCount = $('#charCount');
    const btnSave = $('#btnSave');
    const btnCancel = $('#btnCancel');
    const fabAdd = $('#fabAdd');
    const controls = $('#controls');
    const sortBtn = $('#sortBtn');
    const toast = $('#toast');

    const statTotal = $('#statTotal');
    const statCompleted = $('#statCompleted');
    const statInProgress = $('#statInProgress');
    const statRate = $('#statRate');

    const dailyQuote = $('#dailyQuote');
    const quoteAuthor = $('#quoteAuthor');

    const confettiContainer = $('#confettiContainer');

    /* ================================
       Dark Mode
    ================================ */
    function initDarkMode() {
      const dark = localStorage.getItem(DARK_KEY) === 'true';
      if (dark) document.documentElement.classList.add('dark-mode');
      updateDarkToggle();
    }

    function toggleDarkMode() {
      const root = document.documentElement;
      const isDark = root.classList.toggle('dark-mode');
      localStorage.setItem(DARK_KEY, isDark);
      updateDarkToggle();
    }

    function updateDarkToggle() {
      const isDark = document.documentElement.classList.contains('dark-mode');
      const btn = $('#darkToggle');
      if (btn) btn.textContent = isDark ? '\u2600\uFE0F' : '\u263E';
    }

    /* ================================
       Daily Quote
    ================================ */
    function getDailyQuote() {
      const today = new Date().toDateString();
      const stored = localStorage.getItem(QUOTES_KEY);
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (parsed.date === today) {
            dailyQuote.textContent = parsed.text;
            quoteAuthor.textContent = '—— ' + parsed.author;
            return;
          }
        } catch(e) {}
      }
      // Pick new quote based on day of year
      const start = new Date(new Date().getFullYear(), 0, 0);
      const diff = Math.floor((new Date() - start) / (1000 * 60 * 60 * 24));
      const idx = diff % QUOTES.length;
      const q = QUOTES[idx];
      dailyQuote.textContent = q.text;
      quoteAuthor.textContent = '—— ' + q.author;
      localStorage.setItem(QUOTES_KEY, JSON.stringify({ date: today, text: q.text, author: q.author }));
    }

    /* ================================
       Data Persistence
    ================================ */
    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        wishes = raw ? JSON.parse(raw) : [];
      } catch(e) { wishes = []; }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(wishes));
    }

    /* ================================
       Helpers
    ================================ */
    function getCategory(id) {
      return CATEGORIES.find(c => c.id === id) || CATEGORIES[0];
    }

    function generateId() {
      return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
    }

    function formatDate(d) {
      if (!d) return null;
      const parts = d.split('-');
      if (parts.length !== 3) return d;
      return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
    }

    function daysRemaining(dateStr) {
      if (!dateStr) return null;
      const target = new Date(dateStr + 'T23:59:59');
      const now = new Date();
      const diff = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
      return diff;
    }

    /* ================================
       Render
    ================================ */
    function getFilteredSorted() {
      let list = [...wishes];

      // Filter
      if (currentFilter !== 'all') {
        list = list.filter(w => w.category === currentFilter);
      }

      // Sort
      switch (currentSort) {
        case 'date':
          list.sort((a, b) => {
            if (a.targetDate && b.targetDate) return a.targetDate.localeCompare(b.targetDate);
            if (a.targetDate) return -1;
            if (b.targetDate) return 1;
            return b.createdAt - a.createdAt;
          });
          break;
        case 'progress':
          list.sort((a, b) => b.progress - a.progress || (b.createdAt - a.createdAt));
          break;
        case 'category':
          list.sort((a, b) => a.category.localeCompare(b.category) || (b.createdAt - a.createdAt));
          break;
        default:
          list.sort((a, b) => b.createdAt - a.createdAt);
      }

      return list;
    }

    function render() {
      const list = getFilteredSorted();

      // Stats
      const total = wishes.length;
      const completed = wishes.filter(w => w.progress >= 100).length;
      const inProgress = total - completed;
      const rate = total === 0 ? 0 : Math.round((completed / total) * 100);

      statTotal.textContent = total;
      statCompleted.textContent = completed;
      statInProgress.textContent = inProgress;
      statRate.textContent = rate + '%';

      // Masonry
      masonry.innerHTML = '';

      if (total === 0) {
        masonry.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">&#x2728;</span>
            <div class="empty-title">你的愿望清单还是空的</div>
            <div class="empty-desc">
              许下第一个愿望吧<br>
              每一个伟大的旅程，都始于一个小小的梦想
            </div>
            <button class="empty-btn" onclick="document.getElementById('fabAdd').click()">
              &#x2728; 许下第一个愿望
            </button>
          </div>
        `;
        return;
      }

      list.forEach((wish, i) => {
        const cat = getCategory(wish.category);
        const isCompleted = wish.progress >= 100;
        const remaining = daysRemaining(wish.targetDate);
        let dateText = '';
        if (wish.targetDate) {
          const f = formatDate(wish.targetDate);
          if (remaining !== null) {
            if (remaining > 0) dateText = f + ' \u2022 剩余' + remaining + '天';
            else if (remaining === 0) dateText = f + ' \u2022 \uD83D\uDD25 今天截止';
            else dateText = f + ' \u2022 已超期' + Math.abs(remaining) + '天';
          } else {
            dateText = f;
          }
        }

        const diffText = DIFFICULTY_MAP[wish.difficulty] || '';

        const card = document.createElement('div');
        card.className = 'wish-card' + (isCompleted ? ' completed' : '');
        card.style.animationDelay = (i * 0.06) + 's';
        card.dataset.id = wish.id;

        card.innerHTML = `
          <div class="card-color-bar" style="background:${cat.color}"></div>
          <span class="card-emoji">${cat.emoji}</span>
          <div class="card-title">${escapeHtml(wish.title)}</div>
          <span class="card-category" style="background:${cat.color}22;color:${cat.color}">${cat.label}</span>
          ${wish.targetDate ? `<div class="card-date">\uD83D\uDCC5 ${dateText}</div>` : ''}
          ${diffText ? `<div class="card-difficulty">${diffText}</div>` : ''}
          ${wish.notes ? `<div class="card-notes">${escapeHtml(wish.notes)}</div>` : ''}
          <div class="progress-wrap">
            <div class="progress-track">
              <div class="progress-fill" style="width:${wish.progress}%"></div>
            </div>
            <span class="progress-text">${wish.progress}%</span>
          </div>
        `;

        card.addEventListener('click', () => openProgressModal(wish.id));
        masonry.appendChild(card);
      });

      updateFilterChips();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    /* ================================
       Filter Controls
    ================================ */
    function buildControls() {
      // Clear existing chips except first two (all + sort)
      while (controls.children.length > 2) {
        controls.removeChild(controls.lastChild);
      }

      CATEGORIES.forEach(cat => {
        const chip = document.createElement('button');
        chip.className = 'filter-chip' + (currentFilter === cat.id ? ' active' : '');
        chip.textContent = cat.emoji + ' ' + cat.label;
        chip.dataset.filter = cat.id;
        chip.addEventListener('click', () => {
          currentFilter = cat.id;
          render();
        });
        controls.insertBefore(chip, sortBtn);
      });

      // "All" chip
      const allChip = controls.querySelector('[data-filter="all"]');
      if (allChip) {
        allChip.addEventListener('click', () => {
          currentFilter = 'all';
          render();
        });
      }

      // Sort button
      sortBtn.addEventListener('click', cycleSort);
    }

    function updateFilterChips() {
      controls.querySelectorAll('.filter-chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.filter === currentFilter);
      });
    }

    function cycleSort() {
      const modes = ['date', 'progress', 'category'];
      const labels = { date: '\uD83D\uDCC5 按日期', progress: '\uD83D\uDCC8 按进度', category: '\uD83D\uDCC1 按分类' };
      const idx = modes.indexOf(currentSort);
      currentSort = modes[(idx + 1) % modes.length];
      sortBtn.textContent = '\u{1F500} ' + labels[currentSort];
      render();
    }

    /* ================================
       Create/Edit Modal
    ================================ */
    function buildCategoryPicker() {
      categoryPicker.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const div = document.createElement('div');
        div.className = 'cat-option';
        div.dataset.cat = cat.id;
        div.innerHTML = `<span class="cat-emoji">${cat.emoji}</span>${cat.label}`;
        div.addEventListener('click', () => {
          categoryPicker.querySelectorAll('.cat-option').forEach(c => c.classList.remove('selected'));
          div.classList.add('selected');
          selectedCategory = cat.id;
        });
        categoryPicker.appendChild(div);
      });
    }

    function buildDiffPicker() {
      diffPicker.querySelectorAll('.diff-option').forEach(opt => {
        opt.addEventListener('click', () => {
          diffPicker.querySelectorAll('.diff-option').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
        });
      });
    }

    function openCreateModal() {
      editId = null;
      selectedCategory = null;
      modalTitle.textContent = '\u2728 许下新愿望';
      btnSave.textContent = '\u2728 许下愿望';
      inputTitle.value = '';
      inputDate.value = '';
      inputNotes.value = '';
      charCount.textContent = '0/200';
      categoryPicker.querySelectorAll('.cat-option').forEach(c => c.classList.remove('selected'));
      diffPicker.querySelectorAll('.diff-option').forEach(o => o.classList.remove('selected'));
      diffPicker.querySelector('[data-diff="medium"]').classList.add('selected');
      modalOverlay.classList.add('show');
      setTimeout(() => inputTitle.focus(), 400);
    }

    function openEditModal(id) {
      const wish = wishes.find(w => w.id === id);
      if (!wish) return;
      editId = id;
      modalTitle.textContent = '\u270F\uFE0F 编辑愿望';
      btnSave.textContent = '\u270F\uFE0F 保存修改';
      inputTitle.value = wish.title;
      selectedCategory = wish.category;
      inputDate.value = wish.targetDate || '';
      inputNotes.value = wish.notes || '';
      charCount.textContent = (wish.notes || '').length + '/200';
      categoryPicker.querySelectorAll('.cat-option').forEach(c => {
        c.classList.toggle('selected', c.dataset.cat === wish.category);
      });
      diffPicker.querySelectorAll('.diff-option').forEach(o => {
        o.classList.toggle('selected', o.dataset.diff === wish.difficulty);
      });
      modalOverlay.classList.add('show');
      setTimeout(() => inputTitle.focus(), 400);
    }

    function closeModal() {
      modalOverlay.classList.remove('show');
      editId = null;
      selectedCategory = null;
    }

    function saveWish() {
      const title = inputTitle.value.trim();
      if (!title) {
        showToast('\u8BF7\u8F93\u5165\u613F\u671B\u6807\u9898');
        inputTitle.focus();
        return;
      }
      if (!selectedCategory) {
        showToast('\u8BF7\u9009\u62E9\u5206\u7C7B');
        return;
      }

      const diffEl = diffPicker.querySelector('.diff-option.selected');
      const difficulty = diffEl ? diffEl.dataset.diff : 'medium';
      const notes = inputNotes.value.trim();
      const targetDate = inputDate.value || null;

      if (editId) {
        const idx = wishes.findIndex(w => w.id === editId);
        if (idx >= 0) {
          wishes[idx].title = title;
          wishes[idx].category = selectedCategory;
          wishes[idx].difficulty = difficulty;
          wishes[idx].notes = notes;
          wishes[idx].targetDate = targetDate;
        }
        showToast('\u2705 \u613F\u671B\u5DF2\u66F4\u65B0');
      } else {
        wishes.push({
          id: generateId(),
          title: title,
          category: selectedCategory,
          difficulty: difficulty,
          notes: notes,
          targetDate: targetDate,
          progress: 0,
          createdAt: Date.now()
        });
        showToast('\u2728 \u65B0\u613F\u671B\u5DF2\u8BB8\u4E0B\uFF01');
      }

      saveData();
      closeModal();
      render();
    }

    /* ================================
       Progress Modal
    ================================ */
    function openProgressModal(id) {
      const wish = wishes.find(w => w.id === id);
      if (!wish) return;
      progressWishId = id;
      const cat = getCategory(wish.category);
      const isCompleted = wish.progress >= 100;

      progressTitle.textContent = '\uD83C\uDF1F ' + escapeHtml(wish.title);

      document.getElementById('progressDetail').innerHTML = `
        <div style="font-size:40px;margin-bottom:8px;">${cat.emoji}</div>
        <div style="font-size:14px;color:var(--ink-muted);">${cat.label}</div>
        ${wish.targetDate ? `<div style="font-size:13px;color:var(--ink-muted);margin-top:4px;">\uD83D\uDCC5 ${formatDate(wish.targetDate)}</div>` : ''}
        <div style="font-size:13px;color:var(--ink-muted);margin-top:4px;">${DIFFICULTY_MAP[wish.difficulty] || ''}</div>
      `;

      document.getElementById('progressBigNum').textContent = wish.progress + '%';

      const btnInc = document.getElementById('btnInc');
      const btnDec = document.getElementById('btnDec');
      const btnComplete = document.getElementById('btnMarkComplete');

      btnInc.onclick = () => { updateProgress(progressWishId, 10); };
      btnDec.onclick = () => { updateProgress(progressWishId, -10); };
      btnComplete.onclick = () => { updateProgress(progressWishId, null, true); };

      progressOverlay.classList.add('show');
    }

    function updateProgress(id, delta, markComplete) {
      const wish = wishes.find(w => w.id === id);
      if (!wish) return;

      if (markComplete) {
        wish.progress = 100;
      } else {
        wish.progress = Math.max(0, Math.min(100, wish.progress + delta));
      }

      saveData();

      // Update UI
      document.getElementById('progressBigNum').textContent = wish.progress + '%';

      // Check celebration
      if (wish.progress >= 100) {
        const wasNotComplete = wish.progress - (delta || 0) < 100 || markComplete;
        if (wasNotComplete) {
          triggerCelebration(wish.title);
          closeProgressModal();
        }
      }

      render();
    }

    function closeProgressModal() {
      progressOverlay.classList.remove('show');
      progressWishId = null;
    }

    /* ================================
       Delete Wish
    ================================ */
    function deleteWish(id) {
      if (!confirm('\u786E\u5B9A\u8981\u5220\u9664\u8FD9\u4E2A\u613F\u671B\u5417\uFF1F')) return;
      wishes = wishes.filter(w => w.id !== id);
      saveData();
      closeProgressModal();
      render();
      showToast('\u613F\u671B\u5DF2\u5220\u9664');
    }

    /* ================================
       Share Wish
    ================================ */
    function shareWish(id) {
      const wish = wishes.find(w => w.id === id);
      if (!wish) return;
      const cat = getCategory(wish.category);
      const progressText = wish.progress >= 100 ? '\u2705 \u5DF2\u5B8C\u6210\uFF01' : '\uD83D\uDCC8 \u8FDB\u5EA6' + wish.progress + '%';
      const shareText = `\uD83C\uDF1F \u6211\u7684\u613F\u671B\uFF1A${wish.title}\n\ud83d\udcc1 \u5206\u7C7B\uFF1A${cat.emoji} ${cat.label}\n${progressText}\n\u2014\u2014 \u6765\u81EA\u300C\u726B\u9A6C\u81EA\u6551\u6307\u5357\u300D`;

      if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
        navigator.share({ text: shareText }).catch(() => {});
      } else {
        // Fallback: copy to clipboard
        navigator.clipboard.writeText(shareText).then(() => {
          showToast('\u2714\uFE0F \u613F\u671B\u5DF2\u590D\u5236\u5230\u526A\u8D34\u677F');
        }).catch(() => {
          // Fallback for browsers without clipboard API
          const ta = document.createElement('textarea');
          ta.value = shareText;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand('copy');
            showToast('\u2714\uFE0F \u613F\u671B\u5DF2\u590D\u5236\u5230\u526A\u8D34\u677F');
          } catch(e) {
            showToast('\u8BF7\u624B\u52A8\u590D\u5236\u613F\u671B\u5185\u5BB9');
          }
          document.body.removeChild(ta);
        });
      }

      closeProgressModal();
    }

    /* ================================
       Celebration
    ================================ */
    function triggerCelebration(title) {
      // Card celebration animation
      const card = masonry.querySelector(`[data-id="${progressWishId}"]`);
      if (card) {
        card.classList.add('celebrate');
        setTimeout(() => card.classList.remove('celebrate'), 600);
      }

      // Confetti
      const colors = ['#E8916A', '#F59E0B', '#10B981', '#0EA5E9', '#F43F5E', '#8B5CF6', '#EF4444', '#FCD34D', '#34D399', '#60A5FA'];
      const count = 60;
      confettiContainer.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.top = '-10px';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.width = (Math.random() * 6 + 4) + 'px';
        piece.style.height = (Math.random() * 6 + 4) + 'px';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        piece.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
        piece.style.animationDelay = (Math.random() * 0.8) + 's';
        confettiContainer.appendChild(piece);
      }

      showToast('\uD83C\uDF89 ' + escapeHtml(title) + ' \u5DF2\u5B8C\u6210\uFF01\u592A\u68D2\u4E86\uFF01');

      setTimeout(() => { confettiContainer.innerHTML = ''; }, 3500);
    }

    /* ================================
       Toast
    ================================ */
    let toastTimer = null;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    /* ================================
       Event Bindings
    ================================ */
    function initEvents() {
      // Dark toggle
      window.toggleDarkMode = toggleDarkMode;

      // FAB
      fabAdd.addEventListener('click', openCreateModal);

      // Modal cancel
      btnCancel.addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
      });

      // Save
      btnSave.addEventListener('click', saveWish);

      // Input notes char count
      inputNotes.addEventListener('input', () => {
        const len = inputNotes.value.length;
        charCount.textContent = len + '/200';
        if (len > 200) {
          inputNotes.value = inputNotes.value.slice(0, 200);
          charCount.textContent = '200/200';
        }
        charCount.classList.toggle('over', len > 180);
      });

      // Progress modal close
      document.getElementById('btnProgressClose').addEventListener('click', closeProgressModal);
      progressOverlay.addEventListener('click', (e) => {
        if (e.target === progressOverlay) closeProgressModal();
      });

      // Delete
      document.getElementById('btnDeleteWish').addEventListener('click', () => {
        if (progressWishId) deleteWish(progressWishId);
      });

      // Share
      document.getElementById('btnShareWish').addEventListener('click', () => {
        if (progressWishId) shareWish(progressWishId);
      });

      // Keyboard: Enter to save
      inputTitle.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') saveWish();
      });
    }

    /* ================================
       Init
    ================================ */
    function init() {
      initDarkMode();
      getDailyQuote();
      loadData();
      buildCategoryPicker();
      buildDiffPicker();
      buildControls();
      initEvents();
      render();
    }

    init();
  })();

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
  </script>
</body>
</html>
