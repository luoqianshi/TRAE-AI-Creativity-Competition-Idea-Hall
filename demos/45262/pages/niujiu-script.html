<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="牛马自救指南 - 牛马剧本杀，5章分支叙事12种结局">
<title>牛马剧本杀 · 沉浸式职场互动叙事</title>
<style>
/* ===== CSS变量与主题 ===== */
:root {
  --bg: #F5F1EB;
  --card-bg: #FFFFFF;
  --ink: #2D2A26;
  --ink-muted: #8C857D;
  --border: #E8E2DA;
  --accent: #D4834A;
  --accent-soft: #F5E6D8;
  --green: #7BA68A;
  --green-soft: #E8F0E8;
  --red: #C45B4A;
  --red-soft: #F5E0DC;
  --yellow: #D4A843;
  --yellow-soft: #F5EDD8;
  --purple: #9B7EBD;
  --purple-soft: #EDE5F5;
  --blue: #5A8FBB;
  --blue-soft: #D8E5F0;
  --shadow: 0 2px 12px rgba(45,42,38,0.08);
  --shadow-lg: 0 8px 32px rgba(45,42,38,0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

html.dark-mode {
  --bg: #1A1816;
  --card-bg: #252320;
  --ink: #E8E2DA;
  --ink-muted: #8C857D;
  --border: #3A3530;
  --accent: #E8A87C;
  --accent-soft: #3A3028;
  --green: #7BA68A;
  --green-soft: #2A352E;
  --red: #E07A6A;
  --red-soft: #3A2826;
  --yellow: #D4B85A;
  --yellow-soft: #3A3526;
  --purple: #B89FD4;
  --purple-soft: #352E3A;
  --blue: #7AA8CC;
  --blue-soft: #262E3A;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.3s, color 0.3s;
}

/* ===== 页面容器与翻页动画 ===== */
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  perspective: 1200px;
}

.scene-page {
  position: absolute;
  top: 0; left: 0; right: 0;
  min-height: 100vh;
  background: var(--bg);
  transition: transform 0.6s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  padding-bottom: 40px;
}

.scene-page.enter-from-right {
  transform: translateX(100%) rotateY(-15deg);
  opacity: 0;
}
.scene-page.enter-from-left {
  transform: translateX(-100%) rotateY(15deg);
  opacity: 0;
}
.scene-page.active {
  transform: translateX(0) rotateY(0deg);
  opacity: 1;
}
.scene-page.exit-to-left {
  transform: translateX(-100%) rotateY(15deg);
  opacity: 0;
}
.scene-page.exit-to-right {
  transform: translateX(100%) rotateY(-15deg);
  opacity: 0;
}

/* ===== 顶部进度条 ===== */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  padding: 12px 16px 8px;
  border-bottom: 1px solid var(--border);
}
.progress-track {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 8px;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--yellow));
  border-radius: 2px;
  transition: width 0.5s ease;
}
.top-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--ink-muted);
}
.top-info .chapter-title {
  font-weight: 600;
  color: var(--accent);
}

/* ===== 返回按钮 ===== */
.back-btn {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 200;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--card-bg);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow);
  font-size: 18px;
  color: var(--ink-muted);
  transition: all 0.2s;
}
.back-btn:hover { transform: scale(1.05); }

/* ===== 场景插画区域（纯CSS） ===== */
.scene-visual {
  height: 220px;
  position: relative;
  overflow: hidden;
  margin: 0 16px;
  border-radius: var(--radius);
  background: linear-gradient(180deg, var(--blue-soft) 0%, var(--bg) 100%);
  border: 1px solid var(--border);
}

/* 办公室场景元素 */
.office-scene {
  position: absolute;
  width: 100%; height: 100%;
}
/* 窗户 */
.office-window {
  position: absolute;
  top: 20px; left: 20px;
  width: 80px; height: 100px;
  background: linear-gradient(180deg, #A8D0E6 0%, #D4E8F2 100%);
  border: 3px solid var(--ink-muted);
  border-radius: 4px;
}
.office-window::after {
  content: '';
  position: absolute;
  top: 50%; left: 0; right: 0;
  height: 2px;
  background: var(--ink-muted);
}
.office-window::before {
  content: '';
  position: absolute;
  left: 50%; top: 0; bottom: 0;
  width: 2px;
  background: var(--ink-muted);
}
/* 太阳/月亮 */
.scene-sun {
  position: absolute;
  top: 30px; right: 40px;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #FFE4A1, #D4A843);
  box-shadow: 0 0 20px rgba(212,168,67,0.4);
}
.scene-moon {
  position: absolute;
  top: 30px; right: 40px;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #E8E2DA, #B8B0A6);
  box-shadow: 0 0 15px rgba(184,176,166,0.3);
}
/* 办公桌 */
.desk {
  position: absolute;
  bottom: 30px; left: 50%;
  transform: translateX(-50%);
  width: 160px; height: 60px;
  background: linear-gradient(180deg, #C4A882 0%, #A8906E 100%);
  border-radius: 4px 4px 0 0;
  border: 2px solid #9A8268;
}
.desk::after {
  content: '';
  position: absolute;
  bottom: -20px; left: 10px; right: 10px;
  height: 20px;
  background: #B09878;
  border-radius: 0 0 4px 4px;
}
/* 电脑 */
.computer {
  position: absolute;
  bottom: 90px; left: 50%;
  transform: translateX(-50%);
  width: 70px; height: 50px;
  background: #3A3530;
  border-radius: 4px;
  border: 2px solid #2D2A26;
}
.computer::after {
  content: '';
  position: absolute;
  bottom: -12px; left: 50%;
  transform: translateX(-50%);
  width: 30px; height: 12px;
  background: #4A4540;
  border-radius: 0 0 4px 4px;
}
.computer-screen {
  position: absolute;
  top: 4px; left: 4px; right: 4px; bottom: 4px;
  background: linear-gradient(180deg, #5A8FBB 0%, #7AA8CC 100%);
  border-radius: 2px;
  overflow: hidden;
}
.computer-screen::after {
  content: '';
  position: absolute;
  top: 8px; left: 6px;
  width: 40px; height: 3px;
  background: rgba(255,255,255,0.3);
  border-radius: 2px;
  box-shadow: 0 8px 0 rgba(255,255,255,0.2), 0 16px 0 rgba(255,255,255,0.15);
}
/* 椅子 */
.chair {
  position: absolute;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  width: 50px; height: 55px;
  background: linear-gradient(180deg, #8C857D 0%, #6A635C 100%);
  border-radius: 8px 8px 4px 4px;
  border: 2px solid #5A544E;
}
/* 咖啡杯 */
.coffee-cup {
  position: absolute;
  bottom: 95px; right: 60px;
  width: 18px; height: 22px;
  background: linear-gradient(180deg, #E8E2DA 0%, #D4CEC6 100%);
  border-radius: 0 0 8px 8px;
  border: 2px solid #B8B0A6;
}
.coffee-cup::after {
  content: '';
  position: absolute;
  top: 4px; right: -8px;
  width: 10px; height: 14px;
  border: 2px solid #B8B0A6;
  border-left: none;
  border-radius: 0 8px 8px 0;
}
/* 文件堆 */
.paper-stack {
  position: absolute;
  bottom: 95px; left: 55px;
  width: 30px; height: 8px;
  background: #F5F1EB;
  border: 1px solid #D4CEC6;
  border-radius: 2px;
  box-shadow: 0 -3px 0 #F5F1EB, 0 -3px 0 1px #D4CEC6, 0 -6px 0 #F5F1EB, 0 -6px 0 1px #D4CEC6;
}
/* 时钟 */
.wall-clock {
  position: absolute;
  top: 25px; right: 100px;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--card-bg);
  border: 2px solid var(--ink-muted);
}
.wall-clock::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 2px; height: 10px;
  background: var(--ink);
  transform: translate(-50%, -100%);
  transform-origin: bottom center;
}
.wall-clock::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 2px; height: 7px;
  background: var(--ink);
  transform: translate(-50%, -100%) rotate(90deg);
  transform-origin: bottom center;
}
/* 植物 */
.plant {
  position: absolute;
  bottom: 30px; right: 20px;
  width: 24px; height: 35px;
  background: linear-gradient(180deg, #7BA68A 0%, #5A8A6E 100%);
  border-radius: 50% 50% 4px 4px;
  border: 2px solid #4A7A5E;
}
.plant::after {
  content: '';
  position: absolute;
  bottom: -10px; left: 50%;
  transform: translateX(-50%);
  width: 20px; height: 12px;
  background: #C4A882;
  border-radius: 4px;
  border: 1px solid #A8906E;
}
/* 会议桌 */
.meeting-table {
  position: absolute;
  bottom: 40px; left: 50%;
  transform: translateX(-50%);
  width: 200px; height: 70px;
  background: linear-gradient(180deg, #B09878 0%, #9A8268 100%);
  border-radius: 8px;
  border: 2px solid #8A7258;
}
/* 会议室椅子 */
.meeting-chair {
  position: absolute;
  bottom: 20px;
  width: 36px; height: 40px;
  background: linear-gradient(180deg, #9A8E82 0%, #7A6E62 100%);
  border-radius: 6px 6px 3px 3px;
  border: 2px solid #6A5E52;
}
.meeting-chair.c1 { left: 60px; }
.meeting-chair.c2 { right: 60px; }
.meeting-chair.c3 { left: 50%; transform: translateX(-50%); bottom: 115px; }
/* 白板 */
.whiteboard {
  position: absolute;
  top: 15px; left: 50%;
  transform: translateX(-50%);
  width: 140px; height: 80px;
  background: #F8F8F8;
  border: 3px solid #C4C4C4;
  border-radius: 4px;
}
.whiteboard::after {
  content: '';
  position: absolute;
  top: 20px; left: 15px;
  width: 80px; height: 2px;
  background: #D4D4D4;
  box-shadow: 0 10px 0 #D4D4D4, 0 20px 0 #D4D4D4, 0 30px 0 #D4D4D4;
}
/* 微信消息气泡 */
.wechat-bubble {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: #95EC69;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 12px;
  color: #2D2A26;
  max-width: 160px;
  word-break: break-all;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.wechat-bubble::after {
  content: '';
  position: absolute;
  bottom: -6px; left: 20px;
  width: 0; height: 0;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-top: 8px solid #95EC69;
}
/* 手机 */
.phone {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 70px; height: 120px;
  background: #2D2A26;
  border-radius: 10px;
  border: 3px solid #4A4540;
}
.phone-screen {
  position: absolute;
  top: 8px; left: 4px; right: 4px;
  bottom: 12px;
  background: #1A1816;
  border-radius: 4px;
  overflow: hidden;
}
.phone-screen::after {
  content: '';
  position: absolute;
  top: 10px; left: 6px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #7BA68A;
  box-shadow: 14px 0 0 #7BA68A, 28px 0 0 #7BA68A;
}
/* 外卖袋 */
.food-bag {
  position: absolute;
  bottom: 50px; left: 50%;
  transform: translateX(-50%);
  width: 50px; height: 60px;
  background: linear-gradient(180deg, #F5E6D8 0%, #E8D4C4 100%);
  border-radius: 4px 4px 12px 12px;
  border: 2px solid #D4C4B4;
}
.food-bag::after {
  content: '';
  position: absolute;
  top: -15px; left: 50%;
  transform: translateX(-50%);
  width: 30px; height: 20px;
  border: 2px solid #D4C4B4;
  border-bottom: none;
  border-radius: 8px 8px 0 0;
}
/* 夜晚场景 */
.night-scene {
  background: linear-gradient(180deg, #1E2A3A 0%, #2A3A4A 40%, var(--bg) 100%);
}
.night-scene .office-window {
  background: linear-gradient(180deg, #1A2A3A 0%, #2A3A4A 100%);
}
.night-scene .scene-moon {
  display: block;
}
.night-scene .scene-sun {
  display: none;
}
/* 星星 */
.star {
  position: absolute;
  width: 3px; height: 3px;
  background: #FFE4A1;
  border-radius: 50%;
  animation: twinkle 2s ease-in-out infinite alternate;
}
@keyframes twinkle {
  0% { opacity: 0.3; }
  100% { opacity: 1; }
}

/* ===== 小牛马旁白角色 ===== */
.guide-character {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 12px 16px;
  animation: fadeInUp 0.5s ease;
}
.guide-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--yellow));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  border: 2px solid var(--border);
}
.guide-bubble {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13px;
  color: var(--ink-muted);
  line-height: 1.6;
  position: relative;
  box-shadow: var(--shadow);
  flex: 1;
}
.guide-bubble::before {
  content: '';
  position: absolute;
  left: -6px; top: 14px;
  width: 0; height: 0;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
  border-right: 6px solid var(--border);
}
.guide-bubble::after {
  content: '';
  position: absolute;
  left: -4px; top: 15px;
  width: 0; height: 0;
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
  border-right: 5px solid var(--card-bg);
}

/* ===== 叙事文本区（微信对话框风格） ===== */
.narrative-container {
  margin: 16px;
  background: var(--card-bg);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.narrative-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: linear-gradient(90deg, var(--accent-soft), transparent);
  border-bottom: 1px solid var(--border);
}
.narrative-header .time-badge {
  background: var(--accent);
  color: #fff;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.narrative-header .location {
  font-size: 12px;
  color: var(--ink-muted);
}
.narrative-body {
  padding: 16px;
  min-height: 120px;
}
.narrative-text {
  font-size: 15px;
  line-height: 1.8;
  color: var(--ink);
  white-space: pre-wrap;
}
.narrative-text .highlight {
  color: var(--accent);
  font-weight: 600;
}
.narrative-text .dialogue {
  color: var(--blue);
  font-style: italic;
}
/* 打字机光标 */
.type-cursor {
  display: inline-block;
  width: 2px; height: 18px;
  background: var(--accent);
  margin-left: 2px;
  vertical-align: middle;
  animation: blink 1s step-end infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* 内心独白区 */
.monologue-box {
  margin: 12px 16px;
  background: linear-gradient(135deg, var(--purple-soft), var(--blue-soft));
  border-radius: var(--radius-sm);
  padding: 14px;
  border-left: 4px solid var(--purple);
  animation: fadeInUp 0.6s ease;
}
.monologue-label {
  font-size: 11px;
  color: var(--purple);
  font-weight: 600;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.monologue-text {
  font-size: 14px;
  line-height: 1.7;
  color: var(--ink);
  font-style: italic;
}

/* ===== 选择按钮区 ===== */
.choices-container {
  margin: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.choice-btn {
  background: var(--card-bg);
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  text-align: left;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.choice-btn:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: var(--shadow-lg);
}
.choice-btn:active {
  transform: translateY(0);
}
.choice-btn .choice-label {
  font-size: 13px;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 4px;
}
.choice-btn .choice-text {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.5;
}
.choice-btn .choice-hint {
  font-size: 11px;
  color: var(--ink-muted);
  margin-top: 4px;
}
.choice-btn::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--accent);
  opacity: 0;
  transition: opacity 0.2s;
}
.choice-btn:hover::before {
  opacity: 1;
}

/* ===== 结局页 ===== */
.ending-page {
  text-align: center;
  padding: 20px 16px;
}
.ending-title {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 8px;
  animation: fadeInUp 0.6s ease;
}
.ending-subtitle {
  font-size: 14px;
  color: var(--ink-muted);
  margin-bottom: 20px;
}
.ending-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  border: 2px solid var(--accent);
  padding: 24px;
  margin: 0 16px 20px;
  box-shadow: var(--shadow-lg);
  animation: fadeInUp 0.8s ease 0.2s both;
}
.ending-badge {
  display: inline-block;
  background: linear-gradient(135deg, var(--accent), var(--yellow));
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  padding: 6px 18px;
  border-radius: 20px;
  margin-bottom: 16px;
}
.ending-desc {
  font-size: 15px;
  line-height: 1.8;
  color: var(--ink);
  margin-bottom: 16px;
}
.ending-stats {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 16px;
}
.ending-stat {
  text-align: center;
}
.ending-stat .stat-num {
  font-size: 24px;
  font-weight: 700;
  color: var(--accent);
}
.ending-stat .stat-label {
  font-size: 11px;
  color: var(--ink-muted);
}
.ending-quote {
  font-size: 13px;
  color: var(--ink-muted);
  font-style: italic;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}

/* 分支图 */
.branch-map {
  margin: 20px 16px;
  background: var(--card-bg);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 16px;
  overflow-x: auto;
}
.branch-map-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 12px;
  text-align: center;
}

/* ===== 分享卡片 ===== */
.share-card {
  margin: 20px 16px;
  background: linear-gradient(135deg, var(--accent-soft), var(--yellow-soft));
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  border: 2px solid var(--accent);
  position: relative;
  overflow: hidden;
}
.share-card::before {
  content: '';
  position: absolute;
  top: -50%; right: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(212,131,74,0.1) 0%, transparent 70%);
  animation: rotate 20s linear infinite;
}
@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

// ===== 初始化 =====
function init() {
  loadProgress();
  // 同步主应用暗色模式设置
  try {
    var mainDark = localStorage.getItem('darkMode');
    if (mainDark === 'true') {
      gameState.theme = 'dark';
    } else if (mainDark === 'false') {
      gameState.theme = 'light';
    } else if (!mainDark && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      gameState.theme = 'dark';
    }
  } catch(e) {}
  updateTheme();
  checkContinue();
}

// ===== 主题切换 =====
function toggleTheme() {
  gameState.theme = gameState.theme === 'light' ? 'dark' : 'light';
  updateTheme();
  saveProgress();
  // 同步保存到主应用darkMode键
  try { localStorage.setItem('darkMode', gameState.theme === 'dark' ? 'true' : 'false'); } catch(e) {}
}

function updateTheme() {
  var html = document.documentElement;
  var btn = document.getElementById('themeToggle');
  if (gameState.theme === 'dark') {
    html.classList.add('dark-mode');
    if (btn) btn.innerHTML = '&#9728;';
  } else {
    html.classList.remove('dark-mode');
    if (btn) btn.innerHTML = '&#127769;';
  }
}

// ===== 开始游戏 =====
function startGame() {
  gameState.startTime = Date.now();
  gameState.history = [];
  saveProgress();
  goToScene('ch1', 'right');
}

// ===== 继续游戏 =====
function continueGame() {
  if (gameState.currentScene && gameState.currentScene !== 'cover' && gameState.currentScene !== 'ending') {
    goToScene(gameState.currentScene, 'right');
  } else {
    startGame();
  }
}

function checkContinue() {
  var hint = document.getElementById('continueHint');
  if (hint && gameState.currentScene && gameState.currentScene !== 'cover' && gameState.currentScene !== 'ending') {
    hint.classList.remove('hidden');
  }
}

// ===== 场景跳转 =====
function goToScene(sceneId, direction) {
  direction = direction || 'right';
  var data = STORY_DATA[sceneId];
  if (!data) return;

  gameState.currentScene = sceneId;
  saveProgress();

  // 隐藏所有页面
  var allPages = document.querySelectorAll('.scene-page');
  allPages.forEach(function(p) {
    p.classList.add('hidden');
    p.classList.remove('active', 'enter-from-right', 'enter-from-left', 'exit-to-left', 'exit-to-right');
  });

  // 如果是结局，显示结局页
  if (sceneId.indexOf('ending_') === 0) {
    showEnding(sceneId);
    return;
  }

  // 创建或获取场景页面
  var pageId = 'page-' + sceneId;
  var page = document.getElementById(pageId);
  if (!page) {
    page = createScenePage(sceneId, data);
    document.getElementById('game-pages').appendChild(page);
  }

  // 动画切换
  page.classList.remove('hidden');
  if (direction === 'right') {
    page.classList.add('enter-from-right');
    setTimeout(function() {
      page.classList.remove('enter-from-right');
      page.classList.add('active');
    }, 50);
  } else {
    page.classList.add('active');
  }

  // 开始打字机效果
  startTyping(sceneId);
}

// ===== 创建场景页面 =====
function createScenePage(sceneId, data) {
  var page = document.createElement('div');
  page.className = 'scene-page';
  page.id = 'page-' + sceneId;

  var visualHtml = VISUAL_TEMPLATES[data.visual] || VISUAL_TEMPLATES.morning;

  var choicesHtml = data.choices.map(function(c, i) {
    return `
      <button class="choice-btn" onclick="makeChoice('${sceneId}', ${i})" id="choice-${sceneId}-${i}">
        <div class="choice-label">选择 ${c.label}</div>
        <div class="choice-text">${escapeHtml(c.text)}</div>
        <div class="choice-hint">${escapeHtml(c.hint)}</div>
      </button>
    `;
  }).join('');

  page.innerHTML = `
    <div class="top-bar">
      <div class="progress-track"><div class="progress-fill" style="width:${data.progress}%"></div></div>
      <div class="top-info">
        <span class="chapter-title">${escapeHtml(data.title)}</span>
        <span>${data.time} &#183; ${data.location}</span>
      </div>
    </div>
    <div class="scene-visual">${visualHtml}</div>
    <div class="guide-character">
      <div class="guide-avatar">&#129412;</div>
      <div class="guide-bubble">${escapeHtml(data.guide)}</div>
    </div>
    <div class="narrative-container">
      <div class="narrative-header">
        <span class="time-badge">${data.time}</span>
        <span class="location">${data.location}</span>
      </div>
      <div class="narrative-body">
        <div class="narrative-text" id="text-${sceneId}"></div>
      </div>
    </div>
    <div class="choices-container" id="choices-${sceneId}">
      ${choicesHtml}
    </div>
    <div id="monologue-${sceneId}"></div>
  `;

  return page;
}

// ===== 打字机效果 =====
function startTyping(sceneId) {
  var data = STORY_DATA[sceneId];
  if (!data) return;

  var el = document.getElementById('text-' + sceneId);
  if (!el) return;

  // 停止之前的打字
  if (typingTimer) {
    clearInterval(typingTimer);
    typingTimer = null;
  }
  isTyping = true;

  var text = data.narrative;
  var i = 0;
  el.innerHTML = '<span class="type-cursor"></span>';

  // 点击加速
  el.onclick = function() {
    if (isTyping) {
      clearInterval(typingTimer);
      el.innerHTML = formatNarrative(text);
      isTyping = false;
      showChoices(sceneId);
    }
  };

  typingTimer = setInterval(function() {
    if (i >= text.length) {
      clearInterval(typingTimer);
      typingTimer = null;
      isTyping = false;
      el.innerHTML = formatNarrative(text);
      showChoices(sceneId);
      return;
    }
    i++;
    var current = text.substring(0, i);
    el.innerHTML = formatNarrative(current) + '<span class="type-cursor"></span>';
  }, TYPE_SPEED);
}

function formatNarrative(text) {
  // 高亮对话和关键词
  return escapeHtml(text)
    .replace(/"([^"]+)"/g, '<span class="dialogue">"$1"</span>')
    .replace(/(领导|小李|小王|小张)/g, '<span class="highlight">$1</span>');
}

function showChoices(sceneId) {
  var container = document.getElementById('choices-' + sceneId);
  if (container) {
    container.style.display = 'flex';
    // 动画显示
    var btns = container.querySelectorAll('.choice-btn');
    btns.forEach(function(btn, i) {
      btn.style.opacity = '0';
      btn.style.transform = 'translateY(10px)';
      setTimeout(function() {
        btn.style.transition = 'all 0.3s ease';
        btn.style.opacity = '1';
        btn.style.transform = 'translateY(0)';
      }, i * 150);
    });
  }
}

// ===== 做出选择 =====
function makeChoice(sceneId, choiceIndex) {
  if (isTyping) {
    // 如果还在打字，先完成
    var el = document.getElementById('text-' + sceneId);
    if (el) el.click();
    setTimeout(function() {
      makeChoice(sceneId, choiceIndex);
    }, 100);
    return;
  }

  var data = STORY_DATA[sceneId];
  var choice = data.choices[choiceIndex];

  // 记录历史
  gameState.history.push({
    sceneId: sceneId,
    sceneTitle: data.title,
    choiceIndex: choiceIndex,
    choiceLabel: choice.label,
    choiceText: choice.text,
    time: data.time
  });
  saveProgress();

  // 显示内心独白
  showMonologue(sceneId, choice.monologue);

  // 延迟后进入下一章
  setTimeout(function() {
    if (choice.next.indexOf('ending_') === 0) {
      // 记录最终选择前的最后一个场景
      gameState.history.push({
        sceneId: 'ch5_final',
        sceneTitle: '第五章：最后的对齐',
        choiceIndex: 0,
        choiceLabel: '终',
        choiceText: '终于下班，领导说"再对齐一下"',
        time: '20:00'
      });
      saveProgress();
    }
    goToScene(choice.next, 'right');
  }, 2500);
}

function showMonologue(sceneId, text) {
  var container = document.getElementById('monologue-' + sceneId);
  if (!container) return;
  container.innerHTML = `
    <div class="monologue-box">
      <div class="monologue-label">&#128173; 内心独白</div>
      <div class="monologue-text">${escapeHtml(text)}</div>
    </div>
  `;
}

// ===== 显示结局 =====
function showEnding(endingId) {
  var endingKey = endingId.replace('ending_', '');
  var ending = STORY_DATA.endings[endingId];
  if (!ending) return;

  var page = document.getElementById('page-ending');
  page.classList.remove('hidden');
  page.classList.add('active');

  // 填充结局内容
  document.getElementById('endingBadge').textContent = ending.badge + ' ' + ending.title;
  document.getElementById('endingDesc').textContent = ending.desc;
  document.getElementById('endingQuote').textContent = ending.quote;
  document.getElementById('shareResult').textContent = ending.title;

  // 统计
  document.getElementById('statChoices').textContent = gameState.history.length;
  var mins = gameState.startTime ? Math.max(1, Math.round((Date.now() - gameState.startTime) / 60000)) : 0;
  document.getElementById('statTime').textContent = mins;
  document.getElementById('statEnding').textContent = endingKey;

  // 日期
  var now = new Date();
  document.getElementById('shareDate').textContent = now.getFullYear() + '.' +
    String(now.getMonth() + 1).padStart(2, '0') + '.' +
    String(now.getDate()).padStart(2, '0');

  // 绘制分支图
  drawBranchMap();

  // 保存完成状态
  gameState.currentScene = 'ending';
  saveProgress();
}

// ===== 绘制SVG分支图 =====
function drawBranchMap() {
  var svg = document.getElementById('branchSvg');
  if (!svg) return;

  var history = gameState.history;
  var width = 400;
  var height = 260;
  var startY = 30;
  var stepY = 50;

  var svgContent = '';

  // 绘制路径线
  for (var i = 0; i < history.length - 1; i++) {
    var y1 = startY + i * stepY;
    var y2 = startY + (i + 1) * stepY;
    var x1 = width / 2;
    var x2 = width / 2;

    // 如果有分支，稍微偏移
    if (history[i].choiceIndex === 0) x2 = width / 2 - 30;
    else if (history[i].choiceIndex === 2) x2 = width / 2 + 30;

    svgContent += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4,2" opacity="0.6"/>`;
  }

  // 绘制节点
  history.forEach(function(h, i) {
    var y = startY + i * stepY;
    var x = width / 2;
    if (i > 0) {
      if (history[i - 1].choiceIndex === 0) x = width / 2 - 30;
      else if (history[i - 1].choiceIndex === 2) x = width / 2 + 30;
    }

    var color = 'var(--accent)';
    if (h.choiceLabel === 'A') color = '#7BA68A';
    else if (h.choiceLabel === 'B') color = '#D4A843';
    else if (h.choiceLabel === 'C') color = '#9B7EBD';
    else if (h.choiceLabel === '终') color = '#C45B4A';

    svgContent += `<circle cx="${x}" cy="${y}" r="8" fill="${color}" stroke="var(--card-bg)" stroke-width="2"/>`;
    svgContent += `<text x="${x + 14}" y="${y + 4}" fill="var(--ink-muted)" font-size="11" font-family="sans-serif">${escapeHtml(h.time)} ${escapeHtml(h.sceneTitle.substring(0, 8))}</text>`;
    svgContent += `<text x="${x + 14}" y="${y + 16}" fill="var(--accent)" font-size="10" font-family="sans-serif">选择${h.choiceLabel}</text>`;
  });

  svg.innerHTML = svgContent;
}

// ===== 保存分享卡 =====
function saveShareCard() {
  var canvas = document.createElement('canvas');
  canvas.width = 600;
  canvas.height = 900;
  var ctx = canvas.getContext('2d');

  // 背景
  var isDark = gameState.theme === 'dark';
  ctx.fillStyle = isDark ? '#1A1816' : '#FDF8F0';
  ctx.fillRect(0, 0, 600, 900);

  // 边框
  ctx.strokeStyle = isDark ? '#3A3530' : '#C4A882';
  ctx.lineWidth = 2;
  ctx.strokeRect(20, 20, 560, 860);
  ctx.strokeStyle = isDark ? '#4A4540' : '#E8A87C';
  ctx.lineWidth = 1;
  ctx.strokeRect(30, 30, 540, 840);

  // 标题
  ctx.fillStyle = isDark ? '#E8A87C' : '#D4834A';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText('牛马剧本杀', 50, 80);

  // 结局
  var endingBadge = document.getElementById('endingBadge');
  var endingText = endingBadge ? endingBadge.textContent : '职场老黄牛';
  ctx.fillStyle = isDark ? '#E8E2DA' : '#2D2A26';
  ctx.font = 'bold 36px sans-serif';
  ctx.fillText(endingText, 50, 160);

  // 描述
  var endingDesc = document.getElementById('endingDesc');
  var descText = endingDesc ? endingDesc.textContent : '';
  ctx.fillStyle = isDark ? '#8C857D' : '#5A544E';
  ctx.font = '18px sans-serif';
  var lines = wrapText(ctx, descText, 500);
  lines.forEach(function(line, i) {
    ctx.fillText(line, 50, 220 + i * 32);
  });

  // 统计
  var statChoices = document.getElementById('statChoices');
  var statTime = document.getElementById('statTime');
  ctx.fillStyle = isDark ? '#8C857D' : '#8C857D';
  ctx.font = '14px sans-serif';
  ctx.fillText('做出选择: ' + (statChoices ? statChoices.textContent : '0') + '次', 50, 420);
  ctx.fillText('游戏时长: ' + (statTime ? statTime.textContent : '0') + '分钟', 50, 450);

  // 名言
  var endingQuote = document.getElementById('endingQuote');
  var quoteText = endingQuote ? endingQuote.textContent : '';
  ctx.fillStyle = isDark ? '#6A635C' : '#A89B8C';
  ctx.font = 'italic 16px sans-serif';
  var quoteLines = wrapText(ctx, quoteText, 500);
  quoteLines.forEach(function(line, i) {
    ctx.fillText(line, 50, 520 + i * 28);
  });

  // 底部
  ctx.fillStyle = isDark ? '#5A544E' : '#A89B8C';
  ctx.font = '13px sans-serif';
  ctx.fillText('—— 牛马剧本杀 · 小牛马亲笔', 50, 760);
  ctx.fillText('用 TRAE Work + TRAE IDE 制作', 50, 790);

  // 二维码占位
  ctx.fillStyle = isDark ? '#252320' : '#F0ECE6';
  ctx.fillRect(430, 740, 120, 120);
  ctx.strokeStyle = isDark ? '#3A3530' : '#C4A882';
  ctx.lineWidth = 1;
  ctx.strokeRect(430, 740, 120, 120);
  ctx.fillStyle = isDark ? '#E8E2DA' : '#3D3229';
  var qrSize = 8;
  for (var qr = 0; qr < 12; qr++) {
    for (var qc = 0; qc < 12; qc++) {
      if ((qr + qc) % 3 !== 0 || (qr < 3 && qc < 3) || (qr >= 9 && qc < 3) || (qr < 3 && qc >= 9)) {
        ctx.fillRect(436 + qc * qrSize, 746 + qr * qrSize, qrSize - 1, qrSize - 1);
      }
    }
  }
  ctx.fillStyle = isDark ? '#8C857D' : '#A89B8C';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('扫码体验', 490, 875);
  ctx.textAlign = 'left';

  // 下载
  var link = document.createElement('a');
  link.download = '牛马剧本杀-' + endingText + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('分享卡已保存');
}

function wrapText(ctx, text, maxWidth) {
  var lines = [];
  var line = '';
  for (var i = 0; i < text.length; i++) {
    var testLine = line + text[i];
    if (ctx.measureText(testLine).width > maxWidth && line.length > 0) {
      lines.push(line);
      line = text[i];
    } else {
      line = testLine;
    }
  }
  if (line) lines.push(line);
  return lines;
}

// ===== 重新开始 =====
function restartGame() {
  gameState.currentScene = 'cover';
  gameState.history = [];
  gameState.startTime = null;
  saveProgress();

  // 清除动态生成的页面
  document.getElementById('game-pages').innerHTML = '';

  // 显示封面
  var allPages = document.querySelectorAll('.scene-page');
  allPages.forEach(function(p) {
    p.classList.add('hidden');
    p.classList.remove('active');
  });
  document.getElementById('page-cover').classList.remove('hidden');
  document.getElementById('page-cover').classList.add('active');
}

// ===== 返回首页 =====
function goBack() {
  window.location.href = '../niujiu-demo-final.html';
}

// ===== localStorage存档 =====
function saveProgress() {
  try {
    localStorage.setItem('niujiu_script_progress', JSON.stringify(gameState));
  } catch(e) {}
}

function loadProgress() {
  try {
    var saved = localStorage.getItem('niujiu_script_progress');
    if (saved) {
      var parsed = JSON.parse(saved);
      gameState = Object.assign({}, gameState, parsed);
    }
  } catch(e) {}
}

// ===== 工具函数 =====
function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showToast(msg) {
  var toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() {
    toast.classList.remove('show');
  }, 2000);
}

// ===== 启动 =====
init();

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>
