<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="牛马自救指南 - 收藏卡册，网格展示你的稀有卡片收藏">
<title>收藏卡册 · 牛马自救指南</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* ========== CSS Variables ========== */
  :root {
    --paper: #FDF8F0;
    --paper-line: #EDE5D8;
    --ink: #3D3229;
    --ink-light: #6B5E52;
    --ink-muted: #A89B8C;
    --accent: #D4834A;
    --accent-light: #E8A87C;
    --accent-soft: #F5D5C0;
    --card-bg: #FFFDF9;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 4px 24px rgba(61,50,41,0.08);
    --shadow-lg: 0 8px 40px rgba(61,50,41,0.12);
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --card-n: #A89B8C;
    --card-r: #7BA68A;
    --card-sr: #7BAED4;
    --card-ssr: #9B7BD4;
    --card-ur: #D4A03C;
  }

  /* ========== Dark Mode ========== */
  html.dark-mode {
    --paper: #1A1A2E;
    --paper-line: #2A2A4A;
    --ink: #E8E6E3;
    --ink-light: #B8B5B0;
    --ink-muted: #7A7670;
    --accent: #E8A060;
    --accent-light: #F0B880;
    --accent-soft: #3D2E20;
    --card-bg: #222244;
    --shadow: 0 4px 24px rgba(0,0,0,0.3);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.4);
    --card-n: #8B8078;
    --card-r: #6B9A7A;
    --card-sr: #6B9EC4;
    --card-ssr: #8B6BC4;
    --card-ur: #C49030;
  }

  /* ========== Reset & Base ========== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; -webkit-tap-highlight-color: transparent; transition: background-color 0.3s ease, color 0.3s ease; }
  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #E8E0D4;
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
  }

  /* ========== App Container ========== */
  .app-container {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--paper);
    position: relative;
    overflow: hidden;
    padding: 0 20px 40px;
  }

  /* Paper texture */
  .app-container::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.35;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 150px;
  }

  /* Notebook lines */
  .notebook-lines {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    background-image: repeating-linear-gradient(transparent, transparent 31px, var(--paper-line) 31px, var(--paper-line) 32px);
    opacity: 0.25;
  }

  /* ========== Header ========== */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    position: sticky;
    top: 0;
    background: var(--paper);
    z-index: 100;
    transition: background var(--transition);
  }
  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--ink);
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    transition: all var(--transition);
    text-decoration: none;
  }
  .back-btn:hover, .back-btn:active { background: rgba(212,131,74,0.1); }
  .back-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
  .header-title { font-family: 'ZCOOL KuaiLe', cursive; font-size: 18px; color: var(--ink); }
  .theme-toggle {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid var(--ink-muted); background: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 18px; transition: all var(--transition); color: var(--ink);
  }
  .theme-toggle:hover { border-color: var(--accent); background: rgba(212,131,74,0.1); }

  /* ========== Stats Bar ========== */
  .stats-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
  }
  .stat-box {
    flex: 1;
    text-align: center;
    padding: 14px 8px;
    border-radius: var(--radius-sm);
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    transition: all var(--transition);
  }
  .stat-box .stat-value {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 22px;
    color: var(--accent);
    line-height: 1.2;
  }
  .stat-box .stat-label {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 4px;
  }
  .progress-ring {
    width: 48px; height: 48px; margin: 0 auto 6px; position: relative;
  }
  .progress-ring svg { transform: rotate(-90deg); }
  .progress-ring .ring-bg { fill: none; stroke: var(--paper-line); stroke-width: 4; }
  .progress-ring .ring-fill { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
  .progress-text {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-family: 'ZCOOL KuaiLe', cursive; font-size: 13px; color: var(--accent);
  }

  /* ========== Rarity Summary ========== */
  .rarity-summary {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }
  .rarity-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 20px;
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    font-size: 12px;
    color: var(--ink);
    transition: all var(--transition);
  }
  .rarity-pill .dot { width: 8px; height: 8px; border-radius: 50%; }
  .rarity-pill .count { font-weight: 700; color: var(--accent); }

  /* ========== Filter Bar ========== */
  .filter-section { margin-bottom: 16px; position: relative; z-index: 1; }
  .filter-label {
    font-size: 13px; font-weight: 500; color: var(--ink-muted); margin-bottom: 10px; display: block;
  }
  .filter-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1.5px solid var(--paper-line);
    background: var(--card-bg);
    color: var(--ink);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
  }
  .filter-chip.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .filter-chip:active { transform: scale(0.95); }

  /* ========== Card Grid ========== */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    position: relative;
    z-index: 1;
    margin-bottom: 24px;
  }
  .album-card {
    background: var(--card-bg);
    border-radius: var(--radius-sm);
    border: 1px solid var(--paper-line);
    padding: 16px 12px 12px;
    text-align: center;
    cursor: pointer;
    transition: all var(--transition);
    position: relative;
    overflow: hidden;
  }
  .album-card:hover, .album-card:active {
    transform: translateY(-3px);
    box-shadow: var(--shadow);
    border-color: var(--accent-light);
  }
  .album-card .card-emoji {
    font-size: 42px;
    line-height: 1;
    margin-bottom: 10px;
    display: block;
  }
  .album-card .card-rarity {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    color: white;
    margin-bottom: 8px;
  }
  .album-card .card-theme {
    font-size: 12px;
    color: var(--ink-light);
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .album-card .card-date {
    font-size: 11px;
    color: var(--ink-muted);
  }
  .album-card .card-shine {
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
    transform: translateX(-100%);
    transition: transform 0.6s ease;
    pointer-events: none;
  }
  .album-card:hover .card-shine { transform: translateX(100%); }

  /* Rarity colors */
  .rarity-n { background: var(--card-n); }
  .rarity-r { background: var(--card-r); }
  .rarity-sr { background: var(--card-sr); }
  .rarity-ssr { background: linear-gradient(135deg, #FFD700, #FFA500); color: var(--ink) !important; }
  .rarity-ur { background: linear-gradient(135deg, #E91E63, #FF5722); }

  /* ========== Empty State ========== */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-muted);
    position: relative;
    z-index: 1;
    grid-column: 1 / -1;
  }
  .empty-state .empty-icon { font-size: 64px; margin-bottom: 16px; display: block; }
  .empty-state .empty-title { font-family: 'ZCOOL KuaiLe', cursive; font-size: 18px; color: var(--ink); margin-bottom: 8px; }
  .empty-state .empty-desc { font-size: 14px; line-height: 1.7; margin-bottom: 20px; }
  .empty-action {
    padding: 12px 28px;
    border-radius: var(--radius);
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: white;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(212,131,74,0.3);
    transition: all var(--transition);
    text-decoration: none;
    display: inline-block;
  }
  .empty-action:active { transform: scale(0.96); }

  /* ========== Modal ========== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .modal-overlay.show { display: flex; opacity: 1; }
  .modal-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    color: var(--ink);
    box-shadow: var(--shadow-lg);
    transform: scale(0.9);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
    overflow: hidden;
    border: 1px solid var(--paper-line);
  }
  .modal-overlay.show .modal-card { transform: scale(1); }
  .modal-card .modal-rarity {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 14px;
    color: white;
  }
  .modal-card .modal-emoji { font-size: 48px; display: block; margin-bottom: 12px; }
  .modal-card .modal-content {
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 14px;
    white-space: pre-wrap;
    text-align: left;
  }
  .modal-card .modal-meta {
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 6px;
  }
  .modal-card .modal-close {
    margin-top: 16px;
    padding: 10px 28px;
    border-radius: 12px;
    background: var(--accent);
    color: white;
    border: none;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: all var(--transition);
  }
  .modal-card .modal-close:active { transform: scale(0.96); }
  .modal-card .modal-deco {
    position: absolute;
    top: 0; right: 0;
    width: 80px; height: 80px;
    background-image: radial-gradient(circle, rgba(212,131,74,0.1) 1.5px, transparent 1.5px);
    background-size: 10px 10px;
    border-radius: 0 var(--radius) 0 100%;
    pointer-events: none;
  }

  /* ========== Footer ========== */
  .page-footer {
    text-align: center;
    padding: 20px 0;
    font-size: 12px;
    color: var(--ink-muted);
    opacity: 0.6;
    position: relative;
    z-index: 1;
  }

  /* ========== Animations ========== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-in {
    animation: fadeInUp 0.5s ease forwards;
    opacity: 0;
  }
  .animate-in:nth-child(1) { animation-delay: 0.05s; }
  .animate-in:nth-child(2) { animation-delay: 0.1s; }
  .animate-in:nth-child(3) { animation-delay: 0.15s; }
  .animate-in:nth-child(4) { animation-delay: 0.2s; }
  .animate-in:nth-child(5) { animation-delay: 0.25s; }

  /* ========== Responsive ========== */
  @media (max-width: 360px) {
    .app-container { padding: 0 16px 32px; }
    .card-grid { gap: 10px; }
    .album-card { padding: 14px 10px 10px; }
    .album-card .card-emoji { font-size: 36px; }
    .stat-box { padding: 12px 6px; }
    .stat-box .stat-value { font-size: 18px; }
  }

  /* ========== Scrollbar ========== */
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>

<div class="app-container">
  <div class="notebook-lines"></div>

  <!-- Header -->
  <header class="page-header">
    <a href="../niujiu-demo-final.html" class="back-btn">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      <span>返回</span>
    </a>
    <h1 class="header-title">收藏卡册</h1>
    <button class="theme-toggle" onclick="toggleDarkMode()" id="themeToggle" aria-label="切换深色模式">
      <span id="themeIcon">&#9790;</span>
    </button>
  </header>

  <!-- Stats -->
  <section class="stats-bar animate-in">
    <div class="stat-box">
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">总收藏</div>
    </div>
    <div class="stat-box">
      <div class="progress-ring">
        <svg width="48" height="48" viewBox="0 0 48 48">
          <circle class="ring-bg" cx="24" cy="24" r="20"/>
          <circle class="ring-fill" id="progressCircle" cx="24" cy="24" r="20" stroke-dasharray="125.6" stroke-dashoffset="125.6"/>
        </svg>
        <span class="progress-text" id="progressText">0%</span>
      </div>
      <div class="stat-label">完成度</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="statUniqueThemes">0</div>
      <div class="stat-label">主题数</div>
    </div>
  </section>

  <!-- Rarity Summary -->
  <section class="rarity-summary animate-in" id="raritySummary">
    <div class="rarity-pill"><span class="dot" style="background:var(--card-n)"></span>N <span class="count" id="countN">0</span></div>
    <div class="rarity-pill"><span class="dot" style="background:var(--card-r)"></span>R <span class="count" id="countR">0</span></div>
    <div class="rarity-pill"><span class="dot" style="background:var(--card-sr)"></span>SR <span class="count" id="countSR">0</span></div>
    <div class="rarity-pill"><span class="dot" style="background:var(--card-ssr)"></span>SSR <span class="count" id="countSSR">0</span></div>
    <div class="rarity-pill"><span class="dot" style="background:var(--card-ur)"></span>UR <span class="count" id="countUR">0</span></div>
  </section>

  <!-- Rarity Filter -->
  <section class="filter-section animate-in">
    <span class="filter-label">按稀有度筛选</span>
    <div class="filter-bar" id="rarityFilter">
      <button class="filter-chip active" data-filter="all" onclick="setRarityFilter('all', this)">全部</button>
      <button class="filter-chip" data-filter="N" onclick="setRarityFilter('N', this)">N</button>
      <button class="filter-chip" data-filter="R" onclick="setRarityFilter('R', this)">R</button>
      <button class="filter-chip" data-filter="SR" onclick="setRarityFilter('SR', this)">SR</button>
      <button class="filter-chip" data-filter="SSR" onclick="setRarityFilter('SSR', this)">SSR</button>
      <button class="filter-chip" data-filter="UR" onclick="setRarityFilter('UR', this)">UR</button>
    </div>
  </section>

  <!-- Theme Filter -->
  <section class="filter-section animate-in">
    <span class="filter-label">按主题筛选</span>
    <div class="filter-bar" id="themeFilter">
      <button class="filter-chip active" data-filter="all" onclick="setThemeFilter('all', this)">全部</button>
    </div>
  </section>

  <!-- Card Grid -->
  <section class="card-grid animate-in" id="cardGrid">
    <!-- Cards rendered by JS -->
  </section>

  <!-- Footer -->
  <footer class="page-footer">
    牛马自救指南 &copy; 2026 &middot; 打工人的精神自留地
  </footer>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-deco"></div>
    <span class="modal-emoji" id="modalEmoji"></span>
    <div class="modal-rarity" id="modalRarity"></div>
    <div class="modal-content" id="modalContent"></div>
    <div class="modal-meta" id="modalMeta"></div>
    <button class="modal-close" onclick="closeModal()">关闭</button>
  </div>
</div>

<script>
  // ========== Config ==========
  var TOTAL_CARDS_POOL = 120; // 主应用卡片池总数（估算）
  var rarityEmojis = {
    N: '\u{1F4DD}', R: '\u{1F4AF}', SR: '\u{2728}', SSR: '\u{1F31F}', UR: '\u{1F525}'
  };
  var rarityNames = { N: '\u666E\u901A', R: '\u7A00\u6709', SR: '\u8D85\u7A00\u6709', SSR: '\u7279\u522B\u7A00\u6709', UR: '\u4F20\u8BF4' };
  var rarityColors = { N: '#A89B8C', R: '#7BA68A', SR: '#7BAED4', SSR: '#FFD700', UR: '#D4A03C' };
  var rarityBgs = { N: 'rgba(168,155,140,0.15)', R: 'rgba(123,166,138,0.15)', SR: 'rgba(123,174,212,0.15)', SSR: 'rgba(255,215,0,0.15)', UR: 'rgba(212,160,60,0.15)' };

  // ========== State ==========
  var collection = [];
  var currentRarityFilter = 'all';
  var currentThemeFilter = 'all';

  // ========== Load Data ==========
  function loadCollection() {
    try {
      var saved = localStorage.getItem('niujiu_state_v3');
      if (saved) {
        var parsed = JSON.parse(saved);
        collection = parsed.collection || [];
      }
    } catch (e) {
      collection = [];
    }
  }

  // ========== Theme Detection ==========
  function getCardTheme(card) {
    var content = card.content || '';
    if (card.tag) return card.tag;
    if (content.indexOf('\u6210\u957F') >= 0 || content.indexOf('\u8FDB\u6B65') >= 0 || content.indexOf('\u575A\u6301') >= 0) return '\u6210\u957F';
    if (content.indexOf('\u670B\u53CB') >= 0 || content.indexOf('\u5BB6\u4EBA') >= 0 || content.indexOf('\u793E\u4EA4') >= 0 || content.indexOf('\u4EBA\u9645') >= 0) return '\u793E\u4EA4';
    if (content.indexOf('\u751F\u6D3B') >= 0 || content.indexOf('\u65C5\u884C') >= 0 || content.indexOf('\u7F8E\u98DF') >= 0 || content.indexOf('\u5929\u7A7A') >= 0) return '\u751F\u6D3B';
    if (content.indexOf('\u5E7D\u9ED8') >= 0 || content.indexOf('\u81EA\u5632') >= 0 || content.indexOf('\u6253\u5DE5\u4EBA') >= 0) return '\u5E7D\u9ED8';
    if (content.indexOf('\u6DF1\u591C') >= 0 || content.indexOf('\u7761\u4E0D\u7740') >= 0 || content.indexOf('\u51CC\u6668') >= 0) return '\u6DF1\u591C';
    if (content.indexOf('\u5DE5\u4F5C') >= 0 || content.indexOf('\u52A0\u73ED') >= 0 || content.indexOf('\u9886\u5BFC') >= 0 || content.indexOf('\u5BA2\u6237') >= 0) return '\u804C\u573A';
    if (content.indexOf('\u60C5\u7EEA') >= 0 || content.indexOf('\u5B64\u72EC') >= 0 || content.indexOf('\u54ED') >= 0) return '\u60C5\u7EEA';
    return '\u6CBB\u6108';
  }

  function getUniqueThemes() {
    var themes = {};
    collection.forEach(function(c) {
      var t = getCardTheme(c);
      themes[t] = (themes[t] || 0) + 1;
    });
    return themes;
  }

  // ========== Render ==========
  function renderStats() {
    var total = collection.length;
    var counts = { N: 0, R: 0, SR: 0, SSR: 0, UR: 0 };
    var themes = {};
    collection.forEach(function(c) {
      if (counts[c.rarity] !== undefined) counts[c.rarity]++;
      var t = getCardTheme(c);
      themes[t] = (themes[t] || 0) + 1;
    });

    document.getElementById('statTotal').textContent = total;
    document.getElementById('countN').textContent = counts.N;
    document.getElementById('countR').textContent = counts.R;
    document.getElementById('countSR').textContent = counts.SR;
    document.getElementById('countSSR').textContent = counts.SSR;
    document.getElementById('countUR').textContent = counts.UR;

    var uniqueThemes = Object.keys(themes).length;
    document.getElementById('statUniqueThemes').textContent = uniqueThemes;

    var percent = Math.min(100, Math.round((total / TOTAL_CARDS_POOL) * 100));
    document.getElementById('progressText').textContent = percent + '%';
    var circle = document.getElementById('progressCircle');
    var circumference = 2 * Math.PI * 20; // ~125.6
    var offset = circumference - (percent / 100) * circumference;
    circle.style.strokeDashoffset = offset;
  }

  function renderThemeFilter() {
    var themes = getUniqueThemes();
    var container = document.getElementById('themeFilter');
    var html = '<button class="filter-chip active" data-filter="all" onclick="setThemeFilter(\'all\', this)">\u5168\u90E8</button>';
    Object.keys(themes).forEach(function(t) {
      html += '<button class="filter-chip" data-filter="' + t + '" onclick="setThemeFilter(\'' + t + '\', this)">' + t + ' (' + themes[t] + ')</button>';
    });
    container.innerHTML = html;
  }

  function renderCards() {
    var grid = document.getElementById('cardGrid');
    var filtered = collection.filter(function(c) {
      if (currentRarityFilter !== 'all' && c.rarity !== currentRarityFilter) return false;
      if (currentThemeFilter !== 'all' && getCardTheme(c) !== currentThemeFilter) return false;
      return true;
    });

    if (collection.length === 0) {
      grid.innerHTML =
        '<div class="empty-state">' +
        '<span class="empty-icon">\u{1F4DC}</span>' +
        '<div class="empty-title">\u8FD8\u6CA1\u6709\u6536\u85CF\u5361\u7247</div>' +
        '<div class="empty-desc">\u7FFB\u5230\u7684\u5361\u7247\u53EF\u4EE5\u6536\u85CF\u5230\u8FD9\u91CC<br>\u968F\u65F6\u56DE\u6765\u770B\u770B\uFF5E</div>' +
        '<a href="../niujiu-demo-final.html" class="empty-action">\u53BB\u7FFB\u4E00\u5F20</a>' +
        '</div>';
      return;
    }

    if (filtered.length === 0) {
      grid.innerHTML =
        '<div class="empty-state">' +
        '<span class="empty-icon">\u{1F50D}</span>' +
        '<div class="empty-title">\u6CA1\u6709\u627E\u5230\u5361\u7247</div>' +
        '<div class="empty-desc">\u6362\u4E2A\u7B5B\u9009\u6761\u4EF6\u8BD5\u8BD5\u5427</div>' +
        '</div>';
      return;
    }

    grid.innerHTML = '';
    filtered.forEach(function(card, index) {
      var theme = getCardTheme(card);
      var emoji = rarityEmojis[card.rarity] || '\u{1F4DD}';
      var rarityClass = 'rarity-' + card.rarity.toLowerCase();
      var div = document.createElement('div');
      div.className = 'album-card animate-in';
      div.style.animationDelay = (index * 0.05) + 's';
      div.innerHTML =
        '<div class="card-shine"></div>' +
        '<span class="card-emoji">' + emoji + '</span>' +
        '<span class="card-rarity ' + rarityClass + '">' + card.rarity + '</span>' +
        '<div class="card-theme">' + theme + '</div>' +
        '<div class="card-date">' + (card.time || '') + '</div>';
      div.addEventListener('click', function() { openModal(card); });
      grid.appendChild(div);
    });
  }

  // ========== Filters ==========
  function setRarityFilter(filter, btn) {
    currentRarityFilter = filter;
    document.querySelectorAll('#rarityFilter .filter-chip').forEach(function(el) { el.classList.remove('active'); });
    btn.classList.add('active');
    renderCards();
  }

  function setThemeFilter(filter, btn) {
    currentThemeFilter = filter;
    document.querySelectorAll('#themeFilter .filter-chip').forEach(function(el) { el.classList.remove('active'); });
    btn.classList.add('active');
    renderCards();
  }

  // ========== Modal ==========
  function openModal(card) {
    var overlay = document.getElementById('modalOverlay');
    var emoji = rarityEmojis[card.rarity] || '\u{1F4DD}';
    var rarityClass = 'rarity-' + card.rarity.toLowerCase();
    var theme = getCardTheme(card);
    document.getElementById('modalEmoji').textContent = emoji;
    var rarityEl = document.getElementById('modalRarity');
    rarityEl.textContent = card.rarity + ' \u00B7 ' + (rarityNames[card.rarity] || '');
    rarityEl.className = 'modal-rarity ' + rarityClass;
    document.getElementById('modalContent').textContent = card.content || '';
    document.getElementById('modalMeta').textContent = theme + ' \u00B7 ' + (card.time || '');
    overlay.style.display = 'flex';
    requestAnimationFrame(function() { overlay.classList.add('show'); });
    if (navigator.vibrate) navigator.vibrate(15);
  }

  function closeModal(evt) {
    if (evt && evt.target !== evt.currentTarget) return;
    var overlay = document.getElementById('modalOverlay');
    overlay.classList.remove('show');
    setTimeout(function() { overlay.style.display = 'none'; }, 300);
  }

  // ========== Dark Mode ==========
  function toggleDarkMode() {
    var html = document.documentElement;
    var icon = document.getElementById('themeIcon');
    if (html.classList.contains('dark-mode')) {
      html.classList.remove('dark-mode');
      icon.innerHTML = '&#9790;';
    } else {
      html.classList.add('dark-mode');
      icon.innerHTML = '&#9788;';
    }
    try { localStorage.setItem('darkMode', html.classList.contains('dark-mode') ? 'true' : 'false'); } catch(e) {}
  }

  (function initDarkMode() {
    var isDark = false;
    try {
      var mainDark = localStorage.getItem('darkMode');
      if (mainDark === 'true') isDark = true;
      else if (!mainDark && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) isDark = true;
    } catch(e) {}
    if (isDark) {
      document.documentElement.classList.add('dark-mode');
      document.getElementById('themeIcon').innerHTML = '&#9788;';
    }
  })();

  // ========== Init ==========
  document.addEventListener('DOMContentLoaded', function() {
    loadCollection();
    renderStats();
    renderThemeFilter();
    renderCards();
  });
</script>
</body>
</html>
