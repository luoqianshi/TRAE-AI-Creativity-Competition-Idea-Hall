<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="牛马自救指南 - 检测你的职场班味指数，五维雷达图分析">
<title>班味检测仪 · 牛马自救指南</title>
<meta name="theme-color" content="#8B6F47">
<style>
/* ========== CSS Variables ========== */
:root {
  --paper: #FDF8F0;
  --paper-dark: #F5EDE0;
  --ink: #3D3229;
  --ink-light: #6B5E52;
  --ink-muted: #A89B8C;
  --accent: #8B6F47;
  --accent-light: #A68B5E;
  --accent-soft: #D4C4A8;
  --warm: #C4A882;
  --card-bg: #FFFDF9;
  --shadow: rgba(61,50,41,0.08);
  --shadow-hover: rgba(61,50,41,0.12);
  --border: rgba(196,168,130,0.35);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  --liquid-clear: #E8F4F8;
  --liquid-yellow: #E8D088;
  --liquid-brown: #8B6914;
  --liquid-black: #2A2520;
  --beaker-glass: rgba(255,255,255,0.25);
}

/* ========== Dark Mode ========== */
html.dark-mode {
  --paper: #1A1A1E;
  --paper-dark: #242428;
  --ink: #E8E4DE;
  --ink-light: #B8B0A4;
  --ink-muted: #8A847C;
  --accent: #C4A882;
  --accent-light: #D4B896;
  --accent-soft: #5A5040;
  --warm: #8A7B6A;
  --card-bg: #242428;
  --shadow: rgba(0,0,0,0.3);
  --shadow-hover: rgba(0,0,0,0.4);
  --border: rgba(100,95,85,0.35);
  --liquid-clear: #2A3A40;
  --liquid-yellow: #5A4A20;
  --liquid-brown: #4A3A10;
  --liquid-black: #0A0A0C;
  --beaker-glass: rgba(255,255,255,0.06);
}

/* ========== Reset & Base ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  transition: background var(--transition), color var(--transition);
  position: relative;
}

/* Paper texture background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 31px, var(--border) 31px, var(--border) 32px);
  opacity: 0.15;
  pointer-events: none;
  z-index: 0;
}

/* ========== App Container ========== */
.app-container {
  max-width: 430px;
  margin: 0 auto;
  padding: 0 20px 40px;
  position: relative;
  z-index: 1;
  min-height: 100vh;
}

/* ========== Header ========== */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
  position: sticky;
  top: 0;
  background: var(--paper);
  z-index: 100;
  transition: background var(--transition);
}

.back-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  color: var(--ink);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  transition: all var(--transition);
  box-shadow: 0 2px 8px var(--shadow);
}
.back-btn:hover, .back-btn:active { background: rgba(139,111,71,0.1); transform: scale(0.96); }
.back-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }

.header-title {
  font-family: 'STKaiti', 'KaiTi', 'FangSong', cursive;
  font-size: 20px;
  color: var(--ink);
  letter-spacing: 1px;
}

.theme-toggle {
  width: 38px; height: 38px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--card-bg);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all var(--transition);
  color: var(--ink);
  box-shadow: 0 2px 8px var(--shadow);
}
.theme-toggle:hover { border-color: var(--accent); background: rgba(139,111,71,0.1); }
.theme-toggle:active { transform: scale(0.92); }

/* ========== Page Sections ========== */
.page-section { display: none; animation: fadeInUp 0.5s ease; }
.page-section.active { display: block; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== Handwriting Title ========== */
.handwriting-title {
  font-family: 'STKaiti', 'KaiTi', 'FangSong', cursive;
  font-size: 26px;
  color: var(--ink);
  text-align: center;
  margin: 24px 0 8px;
  letter-spacing: 2px;
  line-height: 1.4;
  position: relative;
}
.handwriting-title::after {
  content: '';
  display: block;
  width: 60px;
  height: 2px;
  background: var(--accent);
  margin: 10px auto 0;
  border-radius: 1px;
  opacity: 0.5;
}

.subtitle {
  text-align: center;
  font-size: 13px;
  color: var(--ink-muted);
  margin-bottom: 24px;
}

/* ========== Input Card ========== */
.input-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: 0 2px 12px var(--shadow);
  border: 1px solid var(--border);
  margin-bottom: 20px;
  position: relative;
}

.input-card::before {
  content: '';
  position: absolute;
  top: 12px; left: 12px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent-soft);
  opacity: 0.6;
}

.input-label {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-light);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.textarea-wrapper {
  position: relative;
}

.banwei-textarea {
  width: 100%;
  min-height: 140px;
  padding: 14px;
  border: 1.5px dashed var(--border);
  border-radius: var(--radius-sm);
  background: var(--paper);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.7;
  font-family: inherit;
  resize: vertical;
  transition: all var(--transition);
  outline: none;
}
.banwei-textarea:focus {
  border-color: var(--accent);
  background: var(--paper);
  box-shadow: 0 0 0 3px rgba(139,111,71,0.1);
}
.banwei-textarea::placeholder { color: var(--ink-muted); opacity: 0.7; }

.char-count {
  text-align: right;
  font-size: 12px;
  color: var(--ink-muted);
  margin-top: 6px;
}
.char-count.warning { color: #D47B7B; }

/* ========== Detect Button ========== */
.detect-btn {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: var(--radius);
  background: var(--accent);
  color: #fff;
  font-size: 17px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: 0 4px 16px rgba(139,111,71,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  letter-spacing: 1px;
  margin-top: 8px;
}
.detect-btn:hover { box-shadow: 0 6px 20px rgba(139,111,71,0.4); transform: translateY(-1px); }
.detect-btn:active { transform: scale(0.97); }
.detect-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

/* ========== Scanning Animation ========== */
.scan-overlay {
  position: fixed;
  inset: 0;
  background: rgba(26,26,30,0.92);
  z-index: 1000;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
}
.scan-overlay.active { display: flex; }

.scan-beaker {
  width: 120px;
  height: 160px;
  margin-bottom: 24px;
  position: relative;
}

.scan-text {
  font-size: 16px;
  letter-spacing: 2px;
  animation: pulseText 1s ease-in-out infinite;
}

@keyframes pulseText {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

.scan-line {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, #C4A882, transparent);
  animation: scanMove 1.2s ease-in-out infinite;
}

@keyframes scanMove {
  0% { top: 0; opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { top: 100%; opacity: 0; }
}

/* ========== Report Card (Medical Record Style) ========== */
.report-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 24px 20px;
  box-shadow: 0 2px 16px var(--shadow);
  border: 1px solid var(--border);
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}

.report-card::before {
  content: '病历卡';
  position: absolute;
  top: 10px; right: 14px;
  font-family: 'STKaiti', 'KaiTi', cursive;
  font-size: 13px;
  color: var(--ink-muted);
  opacity: 0.5;
  letter-spacing: 2px;
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 4px;
}

.report-header {
  text-align: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px dashed var(--border);
}

.report-title {
  font-family: 'STKaiti', 'KaiTi', cursive;
  font-size: 22px;
  color: var(--ink);
  margin-bottom: 4px;
}

.report-date {
  font-size: 12px;
  color: var(--ink-muted);
}

/* ========== Beaker SVG ========== */
.beaker-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 24px;
}

.beaker-wrapper {
  position: relative;
  width: 140px;
  height: 180px;
}

.beaker-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.beaker-glass {
  fill: none;
  stroke: var(--ink-muted);
  stroke-width: 2;
  opacity: 0.4;
}

.beaker-liquid {
  transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.beaker-bubbles circle {
  animation: bubbleRise 2s ease-in-out infinite;
  opacity: 0;
}
.beaker-bubbles circle:nth-child(2) { animation-delay: 0.4s; }
.beaker-bubbles circle:nth-child(3) { animation-delay: 0.8s; }
.beaker-bubbles circle:nth-child(4) { animation-delay: 1.2s; }

@keyframes bubbleRise {
  0% { transform: translateY(0); opacity: 0; }
  20% { opacity: 0.6; }
  80% { opacity: 0.4; }
  100% { transform: translateY(-30px); opacity: 0; }
}

.beaker-score {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'STKaiti', 'KaiTi', cursive;
  font-size: 32px;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  z-index: 10;
}

.beaker-label {
  margin-top: 10px;
  font-size: 14px;
  color: var(--ink-muted);
}

.beaker-level-text {
  font-family: 'STKaiti', 'KaiTi', cursive;
  font-size: 18px;
  color: var(--accent);
  margin-top: 4px;
}

/* ========== Radar Chart ========== */
.radar-section {
  margin-bottom: 24px;
}

.radar-title {
  font-family: 'STKaiti', 'KaiTi', cursive;
  font-size: 18px;
  color: var(--ink);
  margin-bottom: 16px;
  text-align: center;
}

.radar-wrapper {
  display: flex;
  justify-content: center;
  margin-bottom: 16px;
}

.radar-svg {
  width: 260px;
  height: 240px;
}

.radar-axis { stroke: var(--border); stroke-width: 1; }
.radar-grid { stroke: var(--border); stroke-width: 0.5; stroke-dasharray: 3 3; fill: none; }
.radar-area {
  fill: rgba(139,111,71,0.2);
  stroke: var(--accent);
  stroke-width: 2;
  transition: all 1s ease;
}
.radar-point {
  fill: var(--accent);
  r: 3;
  transition: all 0.5s ease;
}
.radar-label {
  font-size: 12px;
  fill: var(--ink-light);
  text-anchor: middle;
  dominant-baseline: middle;
}

.radar-legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.radar-legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--ink-muted);
  background: var(--paper);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
}

.radar-legend-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
}

/* ========== Diagnosis Text ========== */
.diagnosis-section {
  background: var(--paper);
  border-radius: var(--radius-sm);
  padding: 16px;
  margin-bottom: 20px;
  border: 1px dashed var(--border);
}

.diagnosis-title {
  font-family: 'STKaiti', 'KaiTi', cursive;
  font-size: 16px;
  color: var(--accent);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.diagnosis-text {
  font-size: 14px;
  line-height: 1.8;
  color: var(--ink-light);
}

.diagnosis-text strong { color: var(--accent); }

/* ========== Prescription ========== */
.prescription-section {
  background: linear-gradient(135deg, rgba(139,111,71,0.06), rgba(196,168,130,0.1));
  border-radius: var(--radius-sm);
  padding: 16px;
  margin-bottom: 20px;
  border: 1px solid var(--border);
  position: relative;
}

.prescription-section::before {
  content: 'R';
  position: absolute;
  top: 8px; right: 14px;
  font-family: 'Times New Roman', serif;
  font-size: 24px;
  color: var(--accent);
  opacity: 0.2;
  font-style: italic;
}

.prescription-title {
  font-family: 'STKaiti', 'KaiTi', cursive;
  font-size: 16px;
  color: var(--accent);
  margin-bottom: 8px;
}

.prescription-text {
  font-size: 14px;
  line-height: 1.8;
  color: var(--ink-light);
}

.prescription-dosage {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--border);
  font-size: 12px;
  color: var(--ink-muted);
  font-style: italic;
}

/* ========== History Mini ========== */
.history-section {
  margin-bottom: 20px;
}

.history-title {
  font-family: 'STKaiti', 'KaiTi', cursive;
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 10px;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: var(--paper);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  font-size: 13px;
}

.history-date { color: var(--ink-muted); }
.history-score { font-weight: 600; color: var(--accent); }
.history-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--accent-soft);
  color: var(--ink-light);
}

/* ========== Action Buttons ========== */
.action-buttons {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.action-btn {
  flex: 1;
  padding: 14px 10px;
  border-radius: var(--radius);
  border: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all var(--transition);
}
.action-btn:active { transform: scale(0.96); }

.btn-primary {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 4px 16px rgba(139,111,71,0.3);
}
.btn-primary:hover { box-shadow: 0 6px 20px rgba(139,111,71,0.4); }

.btn-secondary {
  background: var(--card-bg);
  color: var(--ink);
  border: 1.5px solid var(--border);
}
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

/* ========== Share Card Modal ========== */
.share-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 2000;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.share-modal.active { display: flex; }

.share-modal-content {
  position: relative;
  max-width: 340px;
  width: 100%;
}

.share-canvas-wrapper {
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  margin-bottom: 16px;
}

.share-canvas-wrapper canvas {
  display: block;
  width: 100%;
  height: auto;
}

.share-modal-actions {
  display: flex;
  gap: 10px;
}

.share-modal-actions .action-btn {
  flex: 1;
}

.close-modal {
  position: absolute;
  top: -40px; right: 0;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: none;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.close-modal:hover { background: rgba(255,255,255,0.25); }

/* ========== Decorative Elements ========== */
.clinic-stamp {
  display: inline-block;
  border: 2px solid var(--accent);
  color: var(--accent);
  padding: 2px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-family: 'STKaiti', 'KaiTi', cursive;
  transform: rotate(-3deg);
  opacity: 0.7;
  margin-top: 8px;
}

/* ========== Toast ========== */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--paper);
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.35s ease;
  z-index: 3000;
  white-space: nowrap;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ========== Animations ========== */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.animate-in { animation: slideUp 0.5s ease forwards; }
.animate-in:nth-child(2) { animation-delay: 0.1s; }
.animate-in:nth-child(3) { animation-delay: 0.2s; }
.animate-in:nth-child(4) { animation-delay: 0.3s; }

/* ========== Scrollbar ========== */
::-webkit-scrollbar { width: 0; height: 0; }

/* ========== Responsive ========== */
@media (max-width: 375px) {
  .app-container { padding: 0 16px 32px; }
  .handwriting-title { font-size: 22px; }
  .radar-svg { width: 220px; height: 200px; }
}
</style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <header class="page-header">
    <button class="back-btn" onclick="location.href='../niujiu-demo-final.html'">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      <span>返回</span>
    </button>
    <h1 class="header-title">班味检测仪</h1>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">
      <span id="themeIcon">&#9790;</span>
    </button>
  </header>

  <!-- ========== INPUT PAGE ========== -->
  <div class="page-section active" id="inputPage">
    <h2 class="handwriting-title">来，让牛马医生给你把把脉</h2>
    <p class="subtitle">输入今天的工作经历，AI化验室即刻出报告</p>

    <div class="input-card">
      <div class="input-label">
        <span>&#128221;</span>
        <span>今日工作描述</span>
      </div>
      <div class="textarea-wrapper">
        <textarea
          class="banwei-textarea"
          id="workInput"
          placeholder="今天又被拉去开了3小时会，最后结论是'再对齐一下'..."
          maxlength="200"
        ></textarea>
      </div>
      <div class="char-count" id="charCount">0 / 200</div>
    </div>

    <button class="detect-btn" id="detectBtn" onclick="startDetect()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      检测班味
    </button>

    <!-- Quick tags -->
    <div style="margin-top: 20px;">
      <div class="input-label" style="margin-bottom: 10px;">
        <span>&#128161;</span>
        <span>快速选择</span>
      </div>

// ========== Theme ==========
function toggleTheme() {
  const html = document.documentElement;
  const icon = document.getElementById('themeIcon');
  if (html.classList.contains('dark-mode')) {
    html.classList.remove('dark-mode');
    icon.innerHTML = '&#9790;';
    currentTheme = 'light';
  } else {
    html.classList.add('dark-mode');
    icon.innerHTML = '&#9788;';
    currentTheme = 'dark';
  }
  try { localStorage.setItem('darkMode', currentTheme === 'dark'); } catch(e) {}
}

(function initTheme() {
  var isDark = false;
  try {
    var mainDark = localStorage.getItem('darkMode');
    if (mainDark === 'true') isDark = true;
    else if (!mainDark && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) isDark = true;
  } catch(e) {}
  if (isDark) {
    document.documentElement.classList.add('dark-mode');
    document.getElementById('themeIcon').innerHTML = '&#9788;';
    currentTheme = 'dark';
  }
})();

// ========== Input Handling ==========
const workInput = document.getElementById('workInput');
const charCount = document.getElementById('charCount');

workInput.addEventListener('input', function() {
  const len = this.value.length;
  charCount.textContent = len + ' / 200';
  if (len >= 180) charCount.classList.add('warning');
  else charCount.classList.remove('warning');
});

function addTag(text) {
  const current = workInput.value;
  if (current.length + text.length + 2 > 200) {
    showToast('字数快超限了，精简一下~');
    return;
  }
  workInput.value = current ? current + '，' + text : text;
  workInput.dispatchEvent(new Event('input'));
}

// ========== Detection Engine ==========
function analyzeText(text) {
  const scores = {};
  let totalScore = 0;
  let maxDim = '';
  let maxVal = 0;

  for (const [key, dim] of Object.entries(keywordDB)) {
    let count = 0;
    dim.keywords.forEach(kw => {
      const regex = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      const matches = text.match(regex);
      if (matches) count += matches.length;
    });
    // Base score from keyword density + randomness for variety
    let base = Math.min(count * 15 * dim.weight, 85);
    // Add some entropy based on text length
    const lengthFactor = Math.min(text.length / 50, 1);
    base = base * (0.7 + lengthFactor * 0.3);
    // Ensure minimum variance
    if (count === 0) base = Math.random() * 12 + 3;
    else base = Math.min(base + Math.random() * 10, 98);
    scores[key] = Math.round(base);
    totalScore += scores[key];
    if (scores[key] > maxVal) { maxVal = scores[key]; maxDim = key; }
  }

  // Calculate total 0-100
  const avg = totalScore / 5;
  const total = Math.min(Math.round(avg + (maxVal - avg) * 0.3), 100);

  return { scores, total, maxDim, maxVal };
}

// ========== Detection Flow ==========

}

// ========== Beaker Animation ==========
function animateBeaker(score) {
  const liquidRect = document.getElementById('liquidRect');
  const beakerScore = document.getElementById('beakerScore');
  const levelText = document.getElementById('levelText');
  const stop1 = document.getElementById('liquidStop1');
  const stop2 = document.getElementById('liquidStop2');

  // Determine color based on score
  let colorTop, colorBottom, levelName;
  if (score <= 25) {
    colorTop = '#A8D8EA'; colorBottom = '#7BC8E0';
    levelName = '清澈见底';
  } else if (score <= 50) {
    colorTop = '#E8D088'; colorBottom = '#D4B860';
    levelName = '微黄浑浊';
  } else if (score <= 75) {
    colorTop = '#C4A060'; colorBottom = '#8B6914';
    levelName = '深褐粘稠';
  } else {
    colorTop = '#5A4A3A'; colorBottom = '#2A2520';
    levelName = '漆黑如墨';
  }

  stop1.setAttribute('stop-color', colorTop);
  stop2.setAttribute('stop-color', colorBottom);

  // Animate liquid height
  const maxHeight = 130;
  const targetHeight = (score / 100) * maxHeight;
  const targetY = 160 - targetHeight;

  // Number animation
  let currentNum = 0;
  const duration = 1200;
  const start = performance.now();
  function tick(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    currentNum = Math.round(eased * score);
    beakerScore.textContent = currentNum;
    const h = eased * targetHeight;
    liquidRect.setAttribute('y', 160 - h);
    liquidRect.setAttribute('height', h);
    if (progress < 1) requestAnimationFrame(tick);
    else levelText.textContent = levelName + ' (' + score + '分)';
  }
  requestAnimationFrame(tick);
}

// ========== Radar Chart ==========
function drawRadar(scores) {
  const svg = document.getElementById('radarSvg');
  const centerX = 130, centerY = 120, radius = 80;
  const dims = ['overtime', 'meeting', 'pua', 'pie', 'blame'];
  const labels = ['加班', '会议', 'PUA', '画饼', '背锅'];

  // Clear previous
  document.getElementById('radarGrids').innerHTML = '';
  document.getElementById('radarAxes').innerHTML = '';
  document.getElementById('radarPoints').innerHTML = '';
  document.getElementById('radarLabels').innerHTML = '';

  // Draw grids (20%, 40%, 60%, 80%, 100%)
  for (let i = 1; i <= 5; i++) {
    const r = (radius / 5) * i;
    const points = [];
    for (let j = 0; j < 5; j++) {
      const angle = (Math.PI * 2 / 5) * j - Math.PI / 2;
      points.push((centerX + r * Math.cos(angle)) + ',' + (centerY + r * Math.sin(angle)));
    }
    const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    polygon.setAttribute('points', points.join(' '));
    polygon.setAttribute('class', 'radar-grid');
    document.getElementById('radarGrids').appendChild(polygon);
  }

  // Draw axes
  for (let j = 0; j < 5; j++) {
    const angle = (Math.PI * 2 / 5) * j - Math.PI / 2;
    const x2 = centerX + radius * Math.cos(angle);
    const y2 = centerY + radius * Math.sin(angle);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', centerX);
    line.setAttribute('y1', centerY);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('class', 'radar-axis');
    document.getElementById('radarAxes').appendChild(line);
  }

  // Draw data area
  const dataPoints = [];
  for (let j = 0; j < 5; j++) {
    const angle = (Math.PI * 2 / 5) * j - Math.PI / 2;
    const val = scores[dims[j]] || 0;
    const r = (val / 100) * radius;
    dataPoints.push((centerX + r * Math.cos(angle)) + ',' + (centerY + r * Math.sin(angle)));
  }
  const area = document.getElementById('radarArea');
  area.setAttribute('points', dataPoints.join(' '));

  // Draw points
  for (let j = 0; j < 5; j++) {
    const angle = (Math.PI * 2 / 5) * j - Math.PI / 2;
    const val = scores[dims[j]] || 0;
    const r = (val / 100) * radius;
    const cx = centerX + r * Math.cos(angle);
    const cy = centerY + r * Math.sin(angle);
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', cx);
    circle.setAttribute('cy', cy);
    circle.setAttribute('class', 'radar-point');
    document.getElementById('radarPoints').appendChild(circle);
  }

  // Draw labels
  for (let j = 0; j < 5; j++) {
    const angle = (Math.PI * 2 / 5) * j - Math.PI / 2;
    const labelR = radius + 18;
    const lx = centerX + labelR * Math.cos(angle);
    const ly = centerY + labelR * Math.sin(angle);
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', lx);
    text.setAttribute('y', ly);
    text.setAttribute('class', 'radar-label');
    text.textContent = labels[j];
    document.getElementById('radarLabels').appendChild(text);
  }

  // Legend
  const legend = document.getElementById('radarLegend');
  legend.innerHTML = '';
  dims.forEach((d, i) => {
    const item = document.createElement('div');
    item.className = 'radar-legend-item';
    item.innerHTML = '<span class="radar-legend-dot"></span><span>' + labels[i] + ' ' + (scores[d] || 0) + '</span>';
    legend.appendChild(item);
  });
}

// ========== History ==========
function saveHistory(result) {
  try {
    let history = JSON.parse(localStorage.getItem('niujiu_banwei_history') || '[]');
    history.unshift({
      date: result.date,
      time: result.time,
      total: result.total,
      maxDim: result.maxDim,
      text: result.text.substring(0, 50)
    });
    if (history.length > 20) history = history.slice(0, 20);
    localStorage.setItem('niujiu_banwei_history', JSON.stringify(history));
  } catch(e) {}
}

function renderHistory() {
  try {
    const history = JSON.parse(localStorage.getItem('niujiu_banwei_history') || '[]');
    const section = document.getElementById('historySection');
    const list = document.getElementById('historyList');
    if (history.length <= 1) { section.style.display = 'none'; return; }
    section.style.display = 'block';
    list.innerHTML = '';
    history.slice(1, 6).forEach(h => {
      const item = document.createElement('div');
      item.className = 'history-item';
      const dimNames = { overtime: '加班', meeting: '会议', pua: 'PUA', pie: '画饼', blame: '背锅' };
      item.innerHTML = '<span class="history-date">' + h.date + '</span><span class="history-score">' + h.total + '分</span><span class="history-tag">' + (dimNames[h.maxDim] || '综合') + '最高</span>';
      list.appendChild(item);
    });
  } catch(e) {}
}

// ========== Share Card (Canvas) ==========
function generateShareCard() {
  if (!currentResult) return;
  const modal = document.getElementById('shareModal');
  modal.classList.add('active');
  drawShareCanvas();
}

function closeShareModal() {
  document.getElementById('shareModal').classList.remove('active');
}

function drawShareCanvas() {
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  const W = 720, H = 1280;
  const isDark = currentTheme === 'dark';

  // Background
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  if (isDark) {
    bgGrad.addColorStop(0, '#1A1A2E');
    bgGrad.addColorStop(1, '#16213E');
  } else {
    bgGrad.addColorStop(0, '#FDF8F0');
    bgGrad.addColorStop(1, '#F5EDE0');
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Paper texture dots
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.03)' : 'rgba(61,50,41,0.04)';
  for (let i = 0; i < W; i += 24) {
    for (let j = 0; j < H; j += 24) {
      ctx.beginPath();
      ctx.arc(i, j, 1, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Notebook lines
  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(61,50,41,0.06)';
  ctx.lineWidth = 1;
  for (let y = 80; y < H; y += 40) {
    ctx.beginPath();
    ctx.moveTo(40, y);
    ctx.lineTo(W - 40, y);
    ctx.stroke();
  }

  // Header
  ctx.fillStyle = isDark ? '#E8E4DE' : '#3D3229';
  ctx.font = 'bold 48px "STKaiti", "KaiTi", serif';
  ctx.textAlign = 'center';
  ctx.fillText('班味化验报告单', W / 2, 100);

  ctx.fillStyle = isDark ? '#8A847C' : '#A89B8C';
  ctx.font = '24px sans-serif';
  ctx.fillText(currentResult.date, W / 2, 140);

  // Divider
  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.15)' : 'rgba(61,50,41,0.15)';
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.moveTo(60, 170);
  ctx.lineTo(W - 60, 170);
  ctx.stroke();
  ctx.setLineDash([]);

  // Score circle
  const score = currentResult.total;
  const cx = W / 2, cy = 320, r = 110;
  const circumference = 2 * Math.PI * r;
  const offset = circumference * (1 - score / 100);

  // Background circle
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(61,50,41,0.1)';
  ctx.lineWidth = 12;
  ctx.stroke();

  // Progress arc
  ctx.beginPath();
  ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * score / 100));
  ctx.strokeStyle = getScoreColor(score);
  ctx.lineWidth = 12;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Score number
  ctx.fillStyle = getScoreColor(score);
  ctx.font = 'bold 80px "STKaiti", "KaiTi", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(score.toString(), cx, cy - 10);

  ctx.fillStyle = isDark ? '#8A847C' : '#A89B8C';
  ctx.font = '24px sans-serif';
  ctx.fillText('班味浓度', cx, cy + 45);

  // Level text
  const diag = diagnosisTexts.find(d => score >= d.min && score <= d.max) || diagnosisTexts[4];
  ctx.fillStyle = isDark ? '#C4A882' : '#8B6F47';
  ctx.font = '32px "STKaiti", "KaiTi", serif';
  ctx.fillText('「' + diag.title + '」', cx, cy + 100);

  // Radar chart on canvas
  const rcX = W / 2, rcY = 600, rcR = 140;
  const dims = ['overtime', 'meeting', 'pua', 'pie', 'blame'];
  const labels = ['加班', '会议', 'PUA', '画饼', '背锅'];

  // Grid
  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(61,50,41,0.12)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= 5; i++) {
    const rr = (rcR / 5) * i;
    ctx.beginPath();
    for (let j = 0; j <= 5; j++) {
      const angle = (Math.PI * 2 / 5) * j - Math.PI / 2;
      const x = rcX + rr * Math.cos(angle);
      const y = rcY + rr * Math.sin(angle);
      if (j === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
  }

  // Axes
  for (let j = 0; j < 5; j++) {
    const angle = (Math.PI * 2 / 5) * j - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(rcX, rcY);
    ctx.lineTo(rcX + rcR * Math.cos(angle), rcY + rcR * Math.sin(angle));
    ctx.stroke();
  }

  // Data area
  const dataPts = [];
  for (let j = 0; j < 5; j++) {
    const angle = (Math.PI * 2 / 5) * j - Math.PI / 2;
    const val = currentResult.scores[dims[j]] || 0;
    const rr = (val / 100) * rcR;
    dataPts.push({ x: rcX + rr * Math.cos(angle), y: rcY + rr * Math.sin(angle) });
  }
  ctx.beginPath();
  dataPts.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.closePath();
  ctx.fillStyle = isDark ? 'rgba(196,168,130,0.25)' : 'rgba(139,111,71,0.2)';
  ctx.fill();
  ctx.strokeStyle = isDark ? '#C4A882' : '#8B6F47';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Points & labels
  dataPts.forEach((p, j) => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = isDark ? '#C4A882' : '#8B6F47';
    ctx.fill();

    const angle = (Math.PI * 2 / 5) * j - Math.PI / 2;
    const lx = rcX + (rcR + 30) * Math.cos(angle);
    const ly = rcY + (rcR + 30) * Math.sin(angle);
    ctx.fillStyle = isDark ? '#B8B0A4' : '#6B5E52';
    ctx.font = '22px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(labels[j], lx, ly);
  });

  // Diagnosis text
  ctx.fillStyle = isDark ? '#E8E4DE' : '#3D3229';
  ctx.font = '26px "STKaiti", "KaiTi", serif';
  ctx.textAlign = 'left';
  ctx.fillText('诊断结论', 60, 830);

  ctx.fillStyle = isDark ? '#B8B0A4' : '#6B5E52';
  ctx.font = '22px sans-serif';
  const words = diag.text.split('');
  let line = '', y = 870;
  for (let i = 0; i < words.length; i++) {
    const test = line + words[i];
    if (ctx.measureText(test).width > W - 120 && line) {
      ctx.fillText(line, 60, y);
      line = words[i];
      y += 38;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, 60, y);

  // Prescription
  const pres = prescriptions[currentResult.maxDim];
  y += 50;
  ctx.fillStyle = isDark ? '#E8E4DE' : '#3D3229';
  ctx.font = '26px "STKaiti", "KaiTi", serif';
  ctx.fillText('自救处方', 60, y);
  y += 40;

  ctx.fillStyle = isDark ? '#B8B0A4' : '#6B5E52';
  ctx.font = '22px sans-serif';
  const presWords = pres.text.split('');
  line = '';
  for (let i = 0; i < presWords.length; i++) {
    const test = line + presWords[i];
    if (ctx.measureText(test).width > W - 120 && line) {
      ctx.fillText(line, 60, y);
      line = presWords[i];
      y += 38;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, 60, y);

  // Footer
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.15)' : 'rgba(61,50,41,0.15)';
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.moveTo(60, H - 120);
  ctx.lineTo(W - 60, H - 120);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = isDark ? '#8A847C' : '#A89B8C';
  ctx.font = '20px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('—— 牛马自救指南 · 班味检测仪 ——', W / 2, H - 70);
  ctx.font = '18px sans-serif';
  ctx.fillText('扫码体验更多打工人自救工具', W / 2, H - 40);

  // Stamp
  ctx.save();
  ctx.translate(W - 140, H - 180);
  ctx.rotate(-0.15);
  ctx.strokeStyle = isDark ? 'rgba(196,168,130,0.4)' : 'rgba(139,111,71,0.35)';
  ctx.lineWidth = 3;
  ctx.strokeRect(-50, -20, 100, 40);
  ctx.fillStyle = isDark ? 'rgba(196,168,130,0.4)' : 'rgba(139,111,71,0.35)';
  ctx.font = '20px "STKaiti", "KaiTi", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('已确诊', 0, 0);
  ctx.restore();
}

function getScoreColor(score) {
  if (score <= 25) return '#7BC8E0';
  if (score <= 50) return '#D4B860';
  if (score <= 75) return '#C4A060';
  return '#8B6F47';
}

function downloadCard() {
  const canvas = document.getElementById('shareCanvas');
  const link = document.createElement('a');
  link.download = '班味检测报告_' + new Date().toLocaleDateString('zh-CN') + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('诊断卡已保存到相册');
}

// ========== Toast ==========
let toastTimer = null;
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

// ========== Init ==========
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('reportDate').textContent = new Date().toLocaleDateString('zh-CN', {
    year: 'numeric', month: 'long', day: 'numeric'
  });
});

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>
