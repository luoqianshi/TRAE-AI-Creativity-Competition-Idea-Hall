<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="牛马自救指南 - 时间胶囊，给未来的自己写一封信">
<title>时间胶囊 · 牛马自救指南</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

  :root {
    --paper: #FDF8F0;
    --ink: #3D3229;
    --ink-muted: #7A7670;
    --accent: #D4834A;
    --accent-light: #F0D4B8;
    --accent-dark: #B86A30;
    --card-bg: #FFFBF5;
    --seal-red: #C0392B;
    --seal-gold: #D4A04A;
    --paper-line: rgba(196,168,130,0.2);
    --shadow: rgba(45,42,36,0.08);
    --shadow-md: rgba(45,42,36,0.12);
    --radius: 16px;
    --transition: 0.3s ease;
  }

  html.dark-mode {
    --paper: #1E1D1B;
    --ink: #E8E4DC;
    --ink-muted: #9A968E;
    --accent: #E8954A;
    --accent-light: #3A2E20;
    --accent-dark: #C08040;
    --card-bg: #2A2826;
    --seal-red: #A03020;
    --seal-gold: #B09040;
    --paper-line: rgba(196,168,130,0.12);
    --shadow: rgba(0,0,0,0.2);
    --shadow-md: rgba(0,0,0,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    transition: background var(--transition), color var(--transition);
  }

  .title-font {
    font-family: 'ZCOOL KuaiLe', 'STKaiti', 'KaiTi', cursive;
  }

  /* ===== App Shell ===== */
  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    background: var(--paper);
    padding-bottom: 40px;
    transition: background var(--transition);
  }

  /* ===== Header ===== */
  .header {
    display: flex;
    align-items: center;
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    background: var(--paper);
    z-index: 50;
    border-bottom: 1px solid var(--paper-line);
    transition: background var(--transition);
  }
  .back-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--card-bg);
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px var(--shadow);
    transition: all 0.2s;
    flex-shrink: 0;
    text-decoration: none;
  }
  .back-btn:active { transform: scale(0.92); }
  .header-title {
    flex: 1;
    text-align: center;
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 20px;
    color: var(--ink);
    margin-right: 36px;
  }

  /* ===== Hero Section ===== */
  .hero {
    position: relative;
    padding: 30px 20px 20px;
    text-align: center;
    overflow: hidden;
    background: linear-gradient(180deg, var(--accent-light) 0%, transparent 100%);
  }
  .hero-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 26px;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .hero-subtitle {
    font-size: 14px;
    color: var(--ink-muted);
    margin-bottom: 20px;
  }

  /* Floating Envelope Animation */
  .envelope-scene {
    position: relative;
    width: 160px;
    height: 120px;
    margin: 0 auto 10px;
    perspective: 600px;
  }
  .envelope {
    position: absolute;
    width: 100%;
    height: 100%;
    animation: envelopeFloat 4s ease-in-out infinite;
  }
  .envelope-body {
    width: 140px;
    height: 90px;
    margin: 15px auto 0;
    background: linear-gradient(135deg, #F5E6D0, #E8D5BC);
    border-radius: 6px;
    position: relative;
    box-shadow: 0 4px 16px rgba(180,140,100,0.2);
    border: 1px solid rgba(180,140,100,0.3);
  }
  .envelope-flap {
    width: 0;
    height: 0;
    border-left: 70px solid transparent;
    border-right: 70px solid transparent;
    border-top: 40px solid #E8D5BC;
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
  }
  .envelope-heart {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    z-index: 1;
    animation: heartBeat 2s ease-in-out infinite;
  }
  .envelope-shadow {
    width: 100px;
    height: 12px;
    background: radial-gradient(ellipse, rgba(180,140,100,0.15) 0%, transparent 70%);
    margin: 10px auto 0;
    animation: shadowPulse 4s ease-in-out infinite;
  }
  @keyframes envelopeFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-10px) rotate(1deg); }
    75% { transform: translateY(-5px) rotate(-1deg); }
  }
  @keyframes heartBeat {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.15); }
  }
  @keyframes shadowPulse {
    0%, 100% { transform: scaleX(1); opacity: 0.6; }
    50% { transform: scaleX(0.8); opacity: 0.3; }
  }

  /* Floating Particles */
  .particle {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.2;
    animation: particleFloat 6s ease-in-out infinite;
  }
  .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
  .particle:nth-child(2) { left: 80%; top: 30%; animation-delay: 1s; width: 8px; height: 8px; }
  .particle:nth-child(3) { left: 25%; top: 70%; animation-delay: 2s; }
  .particle:nth-child(4) { left: 70%; top: 60%; animation-delay: 3s; width: 4px; height: 4px; }
  .particle:nth-child(5) { left: 50%; top: 15%; animation-delay: 4s; width: 5px; height: 5px; }
  @keyframes particleFloat {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.2; }
    50% { transform: translateY(-20px) scale(1.3); opacity: 0.4; }
  }

  /* ===== Stats ===== */
  .stats {
    display: flex;
    gap: 12px;
    padding: 0 20px 20px;
  }
  .stat-card {
    flex: 1;
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 2px 10px var(--shadow);
    transition: all var(--transition);
  }
  .stat-card .stat-num {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 28px;
    color: var(--accent);
    line-height: 1;
  }
  .stat-card .stat-label {
    font-size: 12px;
    color: var(--ink-muted);
    margin-top: 4px;
  }

  /* ===== Compose Section ===== */
  .compose-section {
    padding: 0 20px 20px;
  }
  .compose-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 2px 12px var(--shadow);
    transition: all var(--transition);
  }
  .compose-card h3 {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .compose-card textarea {
    width: 100%;
    min-height: 120px;
    border: 1.5px solid var(--paper-line);
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    line-height: 1.6;
    background: var(--paper);
    color: var(--ink);
    resize: none;
    outline: none;
    font-family: inherit;
    transition: all var(--transition);
  }
  .compose-card textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }
  .compose-card textarea::placeholder { color: var(--ink-muted); opacity: 0.5; }

  /* Delay Selector */
  .delay-selector {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .delay-option {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1.5px solid var(--paper-line);
    background: transparent;
    color: var(--ink-muted);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .delay-option.active {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(212,131,74,0.3);
  }
  .delay-option:active { transform: scale(0.95); }

  /* Seal Button */
  .seal-btn {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(212,131,74,0.3);
  }
  .seal-btn:active { transform: scale(0.97); }
  .seal-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ===== Capsule List ===== */
  .capsule-list-section {
    padding: 0 20px 20px;
  }
  .section-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: '';
    width: 4px;
    height: 20px;
    background: var(--accent);
    border-radius: 2px;
  }

  /* Capsule Card */
  .capsule-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 12px var(--shadow);
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    animation: fadeInUp 0.4s ease;
    cursor: pointer;
  }
  .capsule-card:active { transform: scale(0.98); }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .capsule-card .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .capsule-card .card-date {
    font-size: 13px;
    color: var(--ink-muted);
  }
  .capsule-card .card-status {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: 500;
  }
  .card-status.sealed {
    background: rgba(192,57,43,0.1);
    color: var(--seal-red);
  }
  .card-status.openable {
    background: rgba(212,131,74,0.15);
    color: var(--accent);
    animation: pulseGlow 2s ease-in-out infinite;
  }
  .card-status.opened {
    background: rgba(120,160,100,0.15);
    color: #6B8E5A;
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: none; }
    50% { box-shadow: 0 0 8px rgba(212,131,74,0.3); }
  }

  /* Wax Seal */
  .wax-seal {
    position: absolute;
    top: -20px;
    right: -20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    opacity: 0.15;
    z-index: 0;
  }
  .wax-seal.sealed {
    background: radial-gradient(circle, var(--seal-red) 0%, transparent 70%);
  }
  .wax-seal.openable {
    background: radial-gradient(circle, var(--seal-gold) 0%, transparent 70%);
    opacity: 0.25;
    animation: sealShine 3s ease-in-out infinite;
  }
  .wax-seal.opened {
    background: radial-gradient(circle, #6B8E5A 0%, transparent 70%);
  }
  @keyframes sealShine {
    0%, 100% { transform: scale(1); opacity: 0.25; }
    50% { transform: scale(1.1); opacity: 0.4; }
  }

  .capsule-card .card-preview {
    font-size: 14px;
    color: var(--ink);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }
  .capsule-card .card-countdown {
    font-size: 12px;
    color: var(--accent);
    margin-top: 8px;
    font-weight: 500;
    position: relative;
    z-index: 1;
  }
  .capsule-card .card-countdown .countdown-num {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 16px;
  }

  /* ===== Empty State ===== */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    animation: fadeInUp 0.6s ease;
  }
  .empty-state .empty-icon {
    font-size: 64px;
    margin-bottom: 16px;
    animation: floatGentle 3s ease-in-out infinite;
  }
  @keyframes floatGentle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .empty-state h3 {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .empty-state p {
    font-size: 14px;
    color: var(--ink-muted);
    line-height: 1.6;
  }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.3s ease;
  }
  .modal-overlay.show { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .modal {
    background: var(--paper);
    border-radius: 20px;
    width: 100%;
    max-width: 380px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    animation: modalSlideUp 0.4s ease;
    position: relative;
  }
  @keyframes modalSlideUp {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--card-bg);
    color: var(--ink);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .modal-close:active { transform: scale(0.9); }
  .modal h3 {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 20px;
    color: var(--ink);
    margin-bottom: 6px;
    padding-right: 40px;
  }
  .modal .modal-date {
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 16px;
  }
  .modal .modal-content {
    font-size: 15px;
    line-height: 1.8;
    color: var(--ink);
    padding: 16px;
    background: var(--card-bg);
    border-radius: 12px;
    border-left: 3px solid var(--accent);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .modal .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .modal .modal-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .modal-btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    box-shadow: 0 2px 8px rgba(212,131,74,0.3);
  }
  .modal-btn.secondary {
    background: var(--card-bg);
    color: var(--ink-muted);
  }
  .modal-btn:active { transform: scale(0.97); }

  /* Reveal Animation */
  .reveal-anim {
    animation: revealEnvelope 0.8s ease;
  }
  @keyframes revealEnvelope {
    0% { opacity: 0; transform: scale(0.8) rotateY(90deg); }
    50% { opacity: 0.5; transform: scale(1.05) rotateY(0deg); }
    100% { opacity: 1; transform: scale(1) rotateY(0deg); }
  }

  /* ===== Back to App ===== */
  .back-to-app {
    display: block;
    text-align: center;
    padding: 16px;
    color: var(--ink-muted);
    font-size: 13px;
    text-decoration: none;
    transition: color var(--transition);
  }
  .back-to-app:active { color: var(--accent); }

  /* ===== Responsive ===== */
  @media (max-width: 430px) {
    .app { max-width: 100%; }
    .header { padding: 12px 16px 10px; }
    .hero { padding: 24px 16px 16px; }
    .stats, .compose-section, .capsule-list-section { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Header -->
  <div class="header">
    <a href="../niujiu-demo-final.html" class="back-btn" aria-label="返回">&#8592;</a>
    <div class="header-title">时间胶囊</div>
  </div>

  <!-- Hero -->
  <div class="hero">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="envelope-scene">
      <div class="envelope">
        <div class="envelope-flap"></div>
        <div class="envelope-body">
          <div class="envelope-heart">&#10084;</div>
        </div>
      </div>
      <div class="envelope-shadow"></div>
    </div>
    <div class="hero-title title-font">写一封信给未来</div>
    <div class="hero-subtitle">把此刻的心情封存，让时间给你答案</div>
  </div>

  <!-- Stats -->
  <div class="stats" id="statsSection">
    <div class="stat-card">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">全部胶囊</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statSealed">0</div>
      <div class="stat-label">封存中</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statOpened">0</div>
      <div class="stat-label">已开启</div>
    </div>
  </div>

  <!-- Compose -->
  <div class="compose-section">
    <div class="compose-card">
      <h3>&#9998; 写一封新胶囊</h3>
      <textarea id="capsuleInput" placeholder="写下你想对未来的自己说的话...&#10;&#10;可以是期望、目标、心情，或者任何你想记住的事。" maxlength="500"></textarea>
      <div class="delay-selector" id="delaySelector">
        <button class="delay-option active" data-days="7" onclick="selectDelay(this)">7天</button>
        <button class="delay-option" data-days="30" onclick="selectDelay(this)">30天</button>
        <button class="delay-option" data-days="90" onclick="selectDelay(this)">90天</button>
        <button class="delay-option" data-days="180" onclick="selectDelay(this)">180天</button>
        <button class="delay-option" data-days="365" onclick="selectDelay(this)">365天</button>
      </div>
      <button class="seal-btn" id="sealBtn" onclick="sealCapsule()" disabled>&#128307; 封存这封信</button>
    </div>
  </div>

  <!-- Capsule List -->
  <div class="capsule-list-section">
    <div class="section-title">我的胶囊</div>
    <div id="capsuleList"></div>
  </div>

  <a href="../niujiu-demo-final.html" class="back-to-app">&#8592; 返回主应用</a>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalContent">
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
    <h3 id="modalTitle">开启胶囊</h3>
    <div class="modal-date" id="modalDate"></div>
    <div class="modal-content reveal-anim" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ===== Dark Mode =====
  function initDarkMode() {
    const isDark = localStorage.getItem('darkMode') === 'true';
    if (isDark) document.documentElement.classList.add('dark-mode');
  }
  initDarkMode();

  // ===== State =====
  const STORAGE_KEY = 'niujiu_state_v3';
  let capsules = [];
  let selectedDays = 7;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const state = JSON.parse(raw);
        capsules = state.capsules || [];
      }
    } catch(e) { capsules = []; }
  }

  function saveState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      let state = {};
      if (raw) state = JSON.parse(raw);
      state.capsules = capsules;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch(e) {}
  }

  // ===== Delay Selector =====
  window.selectDelay = function(btn) {
    document.querySelectorAll('.delay-option').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedDays = parseInt(btn.dataset.days);
  };

  // ===== Seal Capsule =====
  const capsuleInput = document.getElementById('capsuleInput');
  const sealBtn = document.getElementById('sealBtn');

  capsuleInput.addEventListener('input', function() {
    sealBtn.disabled = this.value.trim().length === 0;
  });

  window.sealCapsule = function() {
    const text = capsuleInput.value.trim();
    if (!text) return;

    const capsule = {
      id: Date.now(),
      text: text,
      createdAt: Date.now(),
      openAt: Date.now() + selectedDays * 24 * 60 * 60 * 1000,
      delayDays: selectedDays,
      status: 'sealed', // sealed | opened
      openedAt: null
    };

    capsules.unshift(capsule);
    saveState();

    capsuleInput.value = '';
    sealBtn.disabled = true;

    renderCapsules();
    updateStats();

    // Show success feedback
    showModal({
      title: '胶囊已封存',
      date: formatDate(capsule.createdAt) + ' · ' + selectedDays + '天后可开启',
      body: '你的信已安全封存，请耐心等待。\n\n' + selectedDays + '天后回来，看看未来的自己有什么想说的吧。',
      actions: [{ text: '好的', type: 'primary', action: closeModal }]
    });
  };

  // ===== Render =====
  function formatDate(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
  }

  function formatCountdown(ms) {
    if (ms <= 0) return '可以开启了！';
    const days = Math.floor(ms / (24*60*60*1000));
    const hours = Math.floor((ms % (24*60*60*1000)) / (60*60*1000));
    if (days > 0) return '还有 <span class="countdown-num">' + days + '</span> 天 ' + hours + ' 小时';
    const mins = Math.floor((ms % (60*60*1000)) / (60*1000));
    return '还有 <span class="countdown-num">' + hours + '</span> 小时 ' + mins + ' 分钟';
  }

  function getStatus(capsule) {
    const now = Date.now();
    if (capsule.status === 'opened') return 'opened';
    if (now >= capsule.openAt) return 'openable';
    return 'sealed';
  }

  function getStatusLabel(status) {
    switch(status) {
      case 'sealed': return '封存中';
      case 'openable': return '可以开启';
      case 'opened': return '已开启';
    }
  }

  function renderCapsules() {
    const list = document.getElementById('capsuleList');

    if (capsules.length === 0) {
      list.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-icon">&#128233;</div>' +
          '<h3>还没有胶囊</h3>' +
          '<p>写下你想对未来的自己说的话，<br>封存起来等待时间揭晓。</p>' +
        '</div>';
      return;
    }

    list.innerHTML = '';
    capsules.forEach((cap, idx) => {
      const status = getStatus(cap);
      const remaining = cap.openAt - Date.now();
      const card = document.createElement('div');
      card.className = 'capsule-card';
      card.style.animationDelay = (idx * 0.08) + 's';
      card.onclick = function() { openCapsuleDetail(cap); };

      card.innerHTML =
        '<div class="wax-seal ' + status + '">' + (status === 'opened' ? '&#10003;' : status === 'openable' ? '&#127775;' : '&#128307;') + '</div>' +
        '<div class="card-top">' +
          '<span class="card-date">' + formatDate(cap.createdAt) + ' · ' + cap.delayDays + '天</span>' +
          '<span class="card-status ' + status + '">' + getStatusLabel(status) + '</span>' +
        '</div>' +
        '<div class="card-preview">' + escapeHtml(cap.text) + '</div>' +
        (status === 'sealed' ? '<div class="card-countdown">' + formatCountdown(remaining) + '</div>' : '') +
        (status === 'openable' ? '<div class="card-countdown" style="color:var(--accent);font-weight:600;">&#127775; 点击开启你的胶囊！</div>' : '') +
        (status === 'opened' ? '<div class="card-countdown" style="color:#6B8E5A;">&#10003; 开启于 ' + formatDate(cap.openedAt) + '</div>' : '');

      list.appendChild(card);
    });
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function updateStats() {
    const total = capsules.length;
    const opened = capsules.filter(c => c.status === 'opened').length;
    const sealed = total - opened;

    animateNumber('statTotal', total);
    animateNumber('statSealed', sealed);
    animateNumber('statOpened', opened);
  }

  function animateNumber(id, target) {
    const el = document.getElementById(id);
    const current = parseInt(el.textContent) || 0;
    if (current === target) return;
    const diff = target - current;
    const step = diff > 0 ? 1 : -1;
    let val = current;
    const interval = setInterval(() => {
      val += step;
      el.textContent = val;
      if (val === target) clearInterval(interval);
    }, 80);
  }

  // ===== Open Capsule Detail =====
  function openCapsuleDetail(cap) {
    const status = getStatus(cap);

    if (status === 'sealed') {
      showModal({
        title: '胶囊封存中',
        date: '创建于 ' + formatDate(cap.createdAt) + ' · ' + cap.delayDays + '天封存',
        body: '这封信还在封存中，请耐心等待。\n\n' + formatCountdown(cap.openAt - Date.now()).replace(/<[^>]+>/g, '') + ' 后就可以开启了。',
        actions: [{ text: '知道了', type: 'primary', action: closeModal }]
      });
    } else if (status === 'openable') {
      showModal({
        title: '开启胶囊？',
        date: '创建于 ' + formatDate(cap.createdAt) + ' · 已封存 ' + cap.delayDays + ' 天',
        body: '这封信已经等了你 ' + cap.delayDays + ' 天了。\n准备好看看过去的自己写了什么吗？',
        actions: [
          { text: '再等等', type: 'secondary', action: closeModal },
          { text: '开启胶囊', type: 'primary', action: function() { revealCapsule(cap); } }
        ]
      });
    } else {
      showModal({
        title: '已开启的胶囊',
        date: '创建于 ' + formatDate(cap.createdAt) + ' · 开启于 ' + formatDate(cap.openedAt),
        body: cap.text,
        actions: [
          { text: '关闭', type: 'secondary', action: closeModal },
          { text: '删除胶囊', type: 'primary', action: function() { deleteCapsule(cap.id); } }
        ]
      });
    }
  }

  function revealCapsule(cap) {
    cap.status = 'opened';
    cap.openedAt = Date.now();
    saveState();

    showModal({
      title: '来自过去的信',
      date: formatDate(cap.createdAt) + ' 的你，写给今天的你',
      body: cap.text,
      actions: [
        { text: '关闭', type: 'secondary', action: closeModal }
      ]
    });

    renderCapsules();
    updateStats();
  }

  function deleteCapsule(id) {
    capsules = capsules.filter(c => c.id !== id);
    saveState();
    closeModal();
    renderCapsules();
    updateStats();
  }

  // ===== Modal =====
  window.showModal = function(opts) {
    document.getElementById('modalTitle').textContent = opts.title;
    document.getElementById('modalDate').textContent = opts.date;
    document.getElementById('modalBody').textContent = opts.body;
    document.getElementById('modalBody').className = 'modal-content reveal-anim';

    const actionsEl = document.getElementById('modalActions');
    actionsEl.innerHTML = '';
    opts.actions.forEach(a => {
      const btn = document.createElement('button');
      btn.className = 'modal-btn ' + a.type;
      btn.textContent = a.text;
      btn.onclick = a.action;
      actionsEl.appendChild(btn);
    });

    document.getElementById('modalOverlay').classList.add('show');
  };

  window.closeModal = function(e) {
    if (e && e.target !== document.getElementById('modalOverlay')) return;
    document.getElementById('modalOverlay').classList.remove('show');
  };

  // ===== Countdown Timer Update =====
  function startCountdownTimer() {
    setInterval(() => {
      const sealedCapsules = capsules.filter(c => getStatus(c) === 'sealed');
      if (sealedCapsules.length > 0) {
        renderCapsules();
      }
    }, 60000); // Update every minute
  }

  // ===== Init =====
  loadState();
  renderCapsules();
  updateStats();
  startCountdownTimer();

})();
</script>
</body>
</html>
