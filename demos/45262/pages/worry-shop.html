<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="牛马自救指南 - 解忧杂货铺，把烦恼兑换成快乐">
<title>解忧杂货铺 · 牛马自救指南</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FDF6EC;
    --bg2: #F5E6D0;
    --ink: #3D3229;
    --accent: #E8916A;
    --ink-muted: #8A7E72;
    --wood: #8B6914;
    --wood-dark: #6B4F10;
    --wood-light: #C4A265;
    --cream: #FFF8EE;
    --amber: #D4954A;
    --warm-glow: rgba(232,145,106,0.3);
    --paper: #FFF9F0;
    --paper-line: rgba(180,155,120,0.25);
    --shadow: rgba(60,45,20,0.1);
    --shadow-md: rgba(60,45,20,0.15);
    --radius: 16px;
    --transition: 0.3s ease;
  }

  html.dark-mode {
    --bg: #1A1714;
    --bg2: #2A2420;
    --ink: #E8E0D4;
    --accent: #E8916A;
    --ink-muted: #9A9088;
    --wood: #5A4510;
    --wood-dark: #3A2A08;
    --wood-light: #8A6A30;
    --cream: #2A2420;
    --amber: #C08040;
    --warm-glow: rgba(232,145,106,0.15);
    --paper: #252220;
    --paper-line: rgba(180,155,120,0.1);
    --shadow: rgba(0,0,0,0.3);
    --shadow-md: rgba(0,0,0,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    transition: background var(--transition), color var(--transition);
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    transition: background var(--transition);
  }

  /* ===== Page Load Overlay ===== */
  .page-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  .page-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .store-opening {
    text-align: center;
  }
  .store-opening .door-frame {
    width: 120px;
    height: 160px;
    margin: 0 auto 20px;
    position: relative;
    perspective: 600px;
  }
  .store-opening .door-left,
  .store-opening .door-right {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    background: linear-gradient(135deg, var(--wood-light), var(--wood));
    border: 3px solid var(--wood-dark);
    transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    transform-origin: left center;
  }
  .store-opening .door-left {
    left: 0;
    border-radius: 8px 0 0 8px;
    transform-origin: left center;
  }
  .store-opening .door-right {
    right: 0;
    border-radius: 0 8px 8px 0;
    transform-origin: right center;
  }
  .store-opening .door-left::after,
  .store-opening .door-right::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 10px;
    height: 10px;
    background: var(--wood-dark);
    border-radius: 50%;
    transform: translateY(-50%);
  }
  .store-opening .door-left::after { right: 8px; }
  .store-opening .door-right::after { left: 8px; }
  .store-opening .door-inner {
    position: absolute;
    inset: 6px;
    background: var(--warm-glow);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .store-opening .door-inner span {
    font-size: 28px;
    opacity: 0;
    transition: opacity 0.6s ease 0.8s;
  }
  .page-overlay.opening .door-left { transform: rotateY(-110deg); }
  .page-overlay.opening .door-right { transform: rotateY(110deg); }
  .page-overlay.opening .door-inner span { opacity: 1; }
  .store-opening .opening-text {
    font-size: 18px;
    color: var(--ink-muted);
    opacity: 0;
    transition: opacity 0.6s ease 1s;
    letter-spacing: 2px;
  }
  .page-overlay.opening .opening-text { opacity: 1; }

  /* ===== Header ===== */
  .header {
    display: flex;
    align-items: center;
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 50;
    border-bottom: 1px solid var(--paper-line);
    transition: background var(--transition);
  }
  .back-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--bg2);
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px var(--shadow);
    transition: all 0.2s;
    flex-shrink: 0;
    text-decoration: none;
  }
  .back-btn:active { transform: scale(0.92); }
  .header-title {
    flex: 1;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .header-right {
    width: 36px;
    flex-shrink: 0;
  }
  .dark-toggle {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--bg2);
    color: var(--ink);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px var(--shadow);
    transition: all 0.2s;
  }
  .dark-toggle:active { transform: scale(0.92); }

  /* ===== Store Front ===== */
  .store-front {
    padding: 24px 20px 16px;
    text-align: center;
    position: relative;
  }
  .store-greeting {
    font-size: 14px;
    color: var(--ink-muted);
    margin-bottom: 16px;
    letter-spacing: 1px;
    line-height: 1.6;
  }
  .store-visual {
    width: 200px;
    height: 180px;
    margin: 0 auto 16px;
    position: relative;
  }
  /* Roof */
  .store-visual .roof {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 110px solid transparent;
    border-right: 110px solid transparent;
    border-bottom: 50px solid var(--wood);
    z-index: 2;
  }
  .store-visual .roof::after {
    content: '';
    position: absolute;
    top: 50px;
    left: -110px;
    width: 220px;
    height: 8px;
    background: var(--wood-dark);
  }
  /* Sign board */
  .store-visual .sign-board {
    position: absolute;
    top: 58px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 36px;
    background: linear-gradient(180deg, var(--cream), var(--bg2));
    border: 2px solid var(--wood);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    box-shadow: 0 2px 8px var(--shadow-md);
  }
  .store-visual .sign-board span {
    font-size: 16px;
    font-weight: 700;
    color: var(--wood-dark);
    letter-spacing: 4px;
  }
  /* Building body */
  .store-visual .building {
    position: absolute;
    top: 58px;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 100px;
    background: linear-gradient(180deg, var(--bg2), var(--cream));
    border: 2px solid var(--wood);
    border-top: none;
    border-radius: 0 0 8px 8px;
    z-index: 1;
  }
  /* Door */
  .store-visual .door {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 65px;
    background: linear-gradient(135deg, var(--wood-light), var(--wood));
    border: 2px solid var(--wood-dark);
    border-radius: 6px 6px 0 0;
    z-index: 2;
  }
  .store-visual .door::after {
    content: '';
    position: absolute;
    top: 50%;
    right: 8px;
    width: 8px;
    height: 8px;
    background: var(--wood-dark);
    border-radius: 50%;
    transform: translateY(-50%);
  }
  /* Windows */
  .store-visual .window {
    position: absolute;
    bottom: 20px;
    width: 30px;
    height: 30px;
    background: var(--warm-glow);
    border: 2px solid var(--wood);
    border-radius: 4px;
    z-index: 2;
    box-shadow: 0 0 15px var(--warm-glow);
  }
  .store-visual .window-left { left: 15px; }
  .store-visual .window-right { right: 15px; }
  .store-visual .window::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,220,150,0.4), transparent);
    border-radius: 2px;
  }
  /* Warm glow effect */
  .store-visual .glow {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 40px;
    background: radial-gradient(ellipse, var(--warm-glow), transparent);
    z-index: 0;
    animation: glowPulse 3s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.1); }
  }
  /* Open sign */
  .store-visual .open-sign {
    position: absolute;
    top: 100px;
    right: 5px;
    width: 32px;
    height: 18px;
    background: #D44;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 4;
    animation: signSwing 3s ease-in-out infinite;
    transform-origin: top center;
    box-shadow: 0 2px 6px rgba(200,50,50,0.3);
  }
  .store-visual .open-sign span {
    font-size: 11px;
    color: #FFF;
    font-weight: 700;
    letter-spacing: 1px;
  }
  @keyframes signSwing {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }
  /* Mailbox */
  .store-visual .mailbox {
    position: absolute;
    bottom: -5px;
    left: 8px;
    z-index: 3;
  }
  .store-visual .mailbox-post {
    width: 6px;
    height: 25px;
    background: var(--wood);
    margin: 0 auto;
    border-radius: 2px;
  }
  .store-visual .mailbox-box {
    width: 28px;
    height: 20px;
    background: linear-gradient(180deg, var(--wood-light), var(--wood));
    border: 2px solid var(--wood-dark);
    border-radius: 3px 3px 0 0;
    position: relative;
  }
  .store-visual .mailbox-slot {
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 3px;
    background: var(--wood-dark);
    border-radius: 2px;
  }
  /* Lanterns */
  .store-visual .lantern {
    position: absolute;
    top: 50px;
    width: 16px;
    height: 22px;
    z-index: 3;
  }
  .store-visual .lantern-left { left: 8px; }
  .store-visual .lantern-right { right: 8px; }
  .store-visual .lantern-string {
    width: 2px;
    height: 8px;
    background: var(--wood);
    margin: 0 auto;
  }
  .store-visual .lantern-body {
    width: 16px;
    height: 16px;
    background: radial-gradient(circle, #FFD080, var(--accent));
    border-radius: 50%;
    box-shadow: 0 0 10px var(--warm-glow);
    animation: lanternGlow 2s ease-in-out infinite alternate;
  }
  @keyframes lanternGlow {
    0% { box-shadow: 0 0 8px var(--warm-glow); }
    100% { box-shadow: 0 0 18px var(--warm-glow), 0 0 30px rgba(232,145,106,0.1); }
  }

  .store-hours {
    font-size: 13px;
    color: var(--ink-muted);
    margin-top: 8px;
    letter-spacing: 1px;
  }
  .letter-counter {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    padding: 6px 16px;
    background: var(--bg2);
    border-radius: 20px;
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .letter-counter .count-num {
    font-weight: 700;
    font-size: 16px;
  }

  /* ===== Tab Navigation ===== */
  .tab-nav {
    display: flex;
    padding: 0 20px;
    gap: 0;
    margin: 8px 0 16px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 0;
    border: none;
    background: transparent;
    color: var(--ink-muted);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    position: relative;
    transition: color 0.3s;
    letter-spacing: 1px;
  }
  .tab-btn.active {
    color: var(--accent);
    font-weight: 700;
  }
  .tab-btn::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) scaleX(0);
    width: 30px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
    transition: transform 0.3s;
  }
  .tab-btn.active::after {
    transform: translateX(-50%) scaleX(1);
  }

  /* ===== Tab Content ===== */
  .tab-content {
    display: none;
    padding: 0 20px 30px;
    animation: fadeIn 0.3s ease;
  }
  .tab-content.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Write Letter Section ===== */
  .letter-section {
    position: relative;
  }
  .letter-hint {
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 12px;
    line-height: 1.6;
    text-align: center;
  }
  .letter-paper {
    background: var(--paper);
    border-radius: var(--radius);
    padding: 20px 16px 16px;
    box-shadow: 0 4px 20px var(--shadow-md);
    position: relative;
    overflow: hidden;
    border: 1px solid var(--paper-line);
  }
  .letter-paper::before {
    content: '';
    position: absolute;
    top: 0;
    left: 60px;
    width: 1px;
    height: 100%;
    background: rgba(220,80,80,0.2);
  }
  .letter-paper::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 100%;
    background: repeating-linear-gradient(
      transparent,
      transparent 31px,
      var(--paper-line) 31px,
      var(--paper-line) 32px
    );
    pointer-events: none;
  }
  .letter-to {
    font-size: 14px;
    color: var(--ink-muted);
    margin-bottom: 8px;
    padding-left: 68px;
    position: relative;
    z-index: 1;
  }
  .letter-textarea {
    width: 100%;
    min-height: 140px;
    border: none;
    background: transparent;
    color: var(--ink);
    font-size: 15px;
    line-height: 32px;
    resize: none;
    outline: none;
    padding-left: 68px;
    position: relative;
    z-index: 1;
    font-family: inherit;
  }
  .letter-textarea::placeholder {
    color: var(--ink-muted);
    opacity: 0.6;
  }
  .letter-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    position: relative;
    z-index: 1;
  }
  .letter-date {
    font-size: 12px;
    color: var(--ink-muted);
    padding-left: 68px;
  }
  .char-count {
    font-size: 12px;
    color: var(--ink-muted);
    padding-right: 4px;
  }
  .mail-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 20px;
    padding: 14px 24px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--amber));
    color: #FFF;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 4px 16px rgba(232,145,106,0.3);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .mail-btn:active {
    transform: scale(0.97);
    box-shadow: 0 2px 8px rgba(232,145,106,0.2);
  }
  .mail-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  .mail-btn .btn-icon {
    font-size: 20px;
  }

  /* ===== Mailbox Animation ===== */
  .mailbox-anim {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.4);
  }
  .mailbox-anim.show { display: flex; }
  .mailbox-anim-content {
    text-align: center;
  }
  .anim-mailbox {
    width: 80px;
    height: 60px;
    margin: 0 auto 20px;
    position: relative;
  }
  .anim-mailbox-body {
    width: 80px;
    height: 50px;
    background: linear-gradient(180deg, var(--wood-light), var(--wood));
    border: 3px solid var(--wood-dark);
    border-radius: 8px 8px 0 0;
    position: relative;
  }
  .anim-mailbox-slot {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 5px;
    background: var(--wood-dark);
    border-radius: 3px;
  }
  .anim-mailbox-post {
    width: 10px;
    height: 20px;
    background: var(--wood);
    margin: 0 auto;
    border-radius: 2px;
  }
  .anim-letter {
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 35px;
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    opacity: 0;
  }
  .anim-letter.sliding {
    animation: letterSlide 1.2s ease-in forwards;
  }
  @keyframes letterSlide {
    0% { top: -40px; opacity: 1; transform: translateX(-50%) rotate(0deg); }
    60% { top: 8px; opacity: 1; transform: translateX(-50%) rotate(5deg); }
    80% { top: 8px; opacity: 1; transform: translateX(-50%) rotate(0deg); }
    100% { top: 20px; opacity: 0; transform: translateX(-50%) rotate(-2deg); }
  }
  /* Ring animation */
  .ring-effect {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    pointer-events: none;
  }
  .ring-effect.ringing::before,
  .ring-effect.ringing::after {
    content: '';
    position: absolute;
    inset: -20px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    animation: ringExpand 0.8s ease-out forwards;
  }
  .ring-effect.ringing::after {
    animation-delay: 0.2s;
  }
  @keyframes ringExpand {
    0% { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(2.5); opacity: 0; }
  }
  .anim-status {
    color: #FFF;
    font-size: 15px;
    letter-spacing: 1px;
    margin-top: 8px;
  }

  /* ===== Reply Section ===== */
  .reply-section {
    display: none;
    margin-top: 24px;
    animation: fadeIn 0.5s ease;
  }
  .reply-section.show { display: block; }
  .reply-label {
    font-size: 13px;
    color: var(--ink-muted);
    text-align: center;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }
  .reply-envelope {
    background: var(--paper);
    border-radius: var(--radius);
    padding: 24px 20px 20px;
    box-shadow: 0 4px 20px var(--shadow-md);
    border: 1px solid var(--paper-line);
    position: relative;
    overflow: hidden;
  }
  .reply-envelope::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--accent), var(--amber), var(--accent));
  }
  .reply-from {
    font-size: 13px;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .reply-text {
    font-size: 15px;
    line-height: 1.8;
    color: var(--ink);
    margin-bottom: 16px;
    white-space: pre-wrap;
  }
  .reply-actions {
    display: flex;
    gap: 10px;
  }
  .reply-action-btn {
    flex: 1;
    padding: 10px 0;
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    background: var(--bg2);
    color: var(--ink-muted);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .reply-action-btn:active {
    transform: scale(0.97);
    background: var(--accent);
    color: #FFF;
    border-color: var(--accent);
  }
  .reply-action-btn.copied {
    background: var(--accent);
    color: #FFF;
    border-color: var(--accent);
  }

  /* ===== Processing Animation ===== */
  .processing {
    display: none;
    text-align: center;
    padding: 30px 0;
  }
  .processing.show { display: block; }
  .processing-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .processing-dot {
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 50%;
    animation: dotBounce 1.4s ease-in-out infinite;
  }

<script>
// ===== Dark Mode =====
function initDark() {
  const dark = localStorage.getItem('darkMode') === 'true';
  if (dark) {
    document.documentElement.classList.add('dark-mode');
    document.getElementById('darkToggle').innerHTML = '&#9788;';
  }
}
function toggleDark() {
  const isDark = document.documentElement.classList.contains('dark-mode');
  if (isDark) {
    document.documentElement.classList.remove('dark-mode');
    localStorage.setItem('darkMode', 'false');
    document.getElementById('darkToggle').innerHTML = '&#9790;';
  } else {
    document.documentElement.classList.add('dark-mode');
    localStorage.setItem('darkMode', 'true');
    document.getElementById('darkToggle').innerHTML = '&#9788;';
  }
}
initDark();

// ===== Page Load Animation =====
window.addEventListener('load', function() {
  setTimeout(function() {
    document.getElementById('pageOverlay').classList.add('opening');
    setTimeout(function() {
      document.getElementById('pageOverlay').classList.add('hidden');
    }, 2000);
  }, 300);
});

// ===== Time-based Greeting =====
function setGreeting() {
  var h = new Date().getHours();
  var greeting = '';
  var hours = '';
  if (h >= 6 && h < 9) {
    greeting = '清晨的杂货铺飘着咖啡香，早起的你辛苦了';
    hours = '营业时间 06:00 - 次日 02:00 · 清晨时光';
  } else if (h >= 9 && h < 12) {
    greeting = '上午好呀，忙碌之前来坐坐吧';
    hours = '营业时间 06:00 - 次日 02:00 · 上午时光';
  } else if (h >= 12 && h < 14) {
    greeting = '午饭后的小憩时光，杂货铺为你敞开';
    hours = '营业时间 06:00 - 次日 02:00 · 午后时光';
  } else if (h >= 14 && h < 18) {
    greeting = '下午的阳光正好，进来歇歇脚吧';
    hours = '营业时间 06:00 - 次日 02:00 · 下午时光';
  } else if (h >= 18 && h < 21) {
    greeting = '傍晚了，杂货铺的灯已经为你点亮';
    hours = '营业时间 06:00 - 次日 02:00 · 傍晚时光';

    greeting = '深夜了，杂货铺永远为你留一盏灯';
    hours = '营业时间 06:00 - 次日 02:00 · 深夜时段';

    hours = '营业时间 06:00 - 次日 02:00 · 凌晨时段';
  }
  document.getElementById('storeGreeting').textContent = greeting;
  document.getElementById('storeHours').textContent = hours;
}
setGreeting();

// ===== Letter Date =====
function setLetterDate() {
  var now = new Date();
  var y = now.getFullYear();
  var m = String(now.getMonth() + 1).padStart(2, '0');
  var d = String(now.getDate()).padStart(2, '0');
  var weekDays = ['日', '一', '二', '三', '四', '五', '六'];
  var w = weekDays[now.getDay()];
  document.getElementById('letterDate').textContent = y + '年' + m + '月' + d + '日 星期' + w;
}
setLetterDate();

// ===== Today Count =====
function updateTodayCount() {
  var letters = JSON.parse(localStorage.getItem('worry_letters') || '[]');
  var today = new Date().toDateString();
  var count = letters.filter(function(l) { return new Date(l.time).toDateString() === today; }).length;
  document.getElementById('todayCount').textContent = count;
}
updateTodayCount();

// ===== Char Count =====
function updateCharCount() {
  var len = document.getElementById('letterInput').value.length;
  document.getElementById('charCount').textContent = len;
}

// ===== Tab Switch =====
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  document.getElementById('tabWrite').classList.toggle('active', tab === 'write');
  document.getElementById('tabWall').classList.toggle('active', tab === 'wall');
  if (tab === 'wall') renderLetterWall();
}

// ===== Keyword Matching =====
function matchCategory(text) {
  var t = text.toLowerCase();
  var keywords = {
    work: ['工作', '上班', '加班', '领导', '老板', '同事', '职场', '工资', '薪水', '辞职', '离职', '转行', '面试', '升职', 'KPI', '绩效', '开会', '项目', '客户', '加班费', '996', '007', '打工', '摸鱼', '内卷', '躺平', '被骂', '批评', '考核', '裁员', '毕业', 'offer', '公司', '部门', '岗位', '职业'],
    relationship: ['朋友', '友情', '闺蜜', '兄弟', '家人', '父母', '妈妈', '爸爸', '家', '恋爱', '分手', '男朋友', '女朋友', '对象', '暗恋', '表白', '结婚', '离婚', '吵架', '冷战', '孤独', '寂寞', '被误解', '被孤立', '合群', '社交', '讨好', '背叛', '信任', '婆婆', '岳母'],
    growth: ['迷茫', '方向', '未来', '梦想', '目标', '焦虑', '压力', '自卑', '自信', '比较', '别人', '同龄人', '成长', '改变', '选择', '后悔', '失败', '成功', '努力', '坚持', '放弃', '意义', '价值', '人生', '活着', '找不到', '不知道', '应该', '怎么办'],
    daily: ['生活', '日常', '无聊', '烦', '累', '钱', '穷', '房租', '房贷', '做饭', '家务', '减肥', '胖', '瘦', '吃', '睡', '天气', '下雨', '搬家', '堵车', '地铁', '公交', '外卖', '快递', '手机', '游戏', '追剧'],
    latenight: ['失眠', '睡不着', '半夜', '凌晨', '深夜', '晚上', '夜', 'emo', '哭', '眼泪', '崩溃', '抑郁', '焦虑', '害怕', '恐惧', '噩梦', '惊醒', '胡思乱想', '睡不着觉', '翻来覆去', '熬夜']
  };
  var scores = { work: 0, relationship: 0, growth: 0, daily: 0, latenight: 0 };
  for (var cat in keywords) {
    keywords[cat].forEach(function(kw) {
      if (t.indexOf(kw) !== -1) scores[cat] += 1;
    });
  }
  var best = 'growth';
  var bestScore = 0;
  for (var c in scores) {
    if (scores[c] > bestScore) {
      bestScore = scores[c];
      best = c;
    }
  }
  return best;
}

function getReply(text) {
  var cat = matchCategory(text);
  var replies = replyLibrary[cat];
  var idx = Math.floor(Math.random() * replies.length);
  return { text: replies[idx], category: cat };
}

// ===== Category Labels =====
var categoryLabels = {
  work: '工作/职场',
  relationship: '感情/人际',
  growth: '成长/迷茫',
  daily: '生活/日常',
  latenight: '深夜/情绪'
};

// ===== Mail Letter =====
var currentReply = null;

function mailLetter() {
  var input = document.getElementById('letterInput');
  var text = input.value.trim();
  if (!text) {
    showToast('请先写下你的烦恼');
    return;
  }
  if (text.length < 5) {
    showToast('再多写一点吧，小牛马想了解更多');
    return;
  }

  var btn = document.getElementById('mailBtn');
  btn.disabled = true;

  // Show mailbox animation
  var anim = document.getElementById('mailboxAnim');
  var letter = document.getElementById('animLetter');
  var ring = document.getElementById('ringEffect');
  var status = document.getElementById('animStatus');

  anim.classList.add('show');
  letter.classList.add('sliding');
  status.textContent = '信件投递中...';

  setTimeout(function() {
    ring.classList.add('ringing');
    status.textContent = '叮！信件已送达';
  }, 1200);

  setTimeout(function() {
    anim.classList.remove('show');
    letter.classList.remove('sliding');
    ring.classList.remove('ringing');

    // Show processing
    document.getElementById('processing').classList.add('show');
    document.querySelector('.letter-section').style.display = 'none';
    document.getElementById('replySection').classList.remove('show');
  }, 2500);

  setTimeout(function() {
    // Get reply
    var result = getReply(text);
    currentReply = result.text;

    // Save to localStorage
    saveLetter(text, result.text, result.category);

    // Show reply
    document.getElementById('processing').classList.remove('show');
    document.getElementById('replyText').textContent = result.text;
    document.getElementById('replySection').classList.add('show');
    document.getElementById('replySection').scrollIntoView({ behavior: 'smooth', block: 'center' });

    btn.disabled = false;
    updateTodayCount();
  }, 5000);
}

// ===== Save Letter =====
function saveLetter(userText, replyText, category) {
  var letters = JSON.parse(localStorage.getItem('worry_letters') || '[]');
  letters.unshift({
    userText: userText,
    replyText: replyText,
    category: category,
    time: new Date().toISOString()
  });
  if (letters.length > 20) letters = letters.slice(0, 20);
  localStorage.setItem('worry_letters', JSON.stringify(letters));
}

// ===== Copy Reply =====
function copyReply() {
  if (!currentReply) return;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(currentReply).then(function() {
      var btn = document.getElementById('copyBtn');
      btn.classList.add('copied');
      btn.innerHTML = '&#10003; 已复制';
      showToast('回信已复制到剪贴板');
      setTimeout(function() {
        btn.classList.remove('copied');
        btn.innerHTML = '&#128203; 复制回信';
      }, 2000);
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = currentReply;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('回信已复制到剪贴板');
  }
}

// ===== Write Again =====
function writeAgain() {
  document.getElementById('letterInput').value = '';
  document.getElementById('charCount').textContent = '0';
  document.querySelector('.letter-section').style.display = 'block';
  document.getElementById('replySection').classList.remove('show');
  document.getElementById('processing').classList.remove('show');
  currentReply = null;
  document.getElementById('letterInput').focus();
}

// ===== Letter Wall =====
function renderLetterWall() {
  var letters = JSON.parse(localStorage.getItem('worry_letters') || '[]');
  var wall = document.getElementById('letterWall');

  if (letters.length === 0) {
    wall.innerHTML = '<div class="letter-wall-empty">' +
      '<div class="empty-icon">&#128240;</div>' +
      '<p>信件墙还是空的<br>去写第一封信吧</p></div>';
    return;
  }

  var html = '<div class="letter-wall-list">';
  letters.forEach(function(letter, index) {
    var time = new Date(letter.time);
    var timeStr = time.getFullYear() + '/' +
      String(time.getMonth() + 1).padStart(2, '0') + '/' +
      String(time.getDate()).padStart(2, '0') + ' ' +
      String(time.getHours()).padStart(2, '0') + ':' +
      String(time.getMinutes()).padStart(2, '0');
    var catLabel = categoryLabels[letter.category] || '其他';

    html += '<div class="letter-card" id="card-' + index + '">' +
      '<div class="letter-card-header">' +
        '<span class="letter-card-time">' + timeStr + '</span>' +
        '<span class="letter-card-tag">' + catLabel + '</span>' +
      '</div>' +
      '<div class="letter-card-content" id="userText-' + index + '">' + escapeHtml(letter.userText) + '</div>' +
      '<div class="letter-card-reply">' +
        '<div class="letter-card-reply-text" id="replyText-' + index + '">' + escapeHtml(letter.replyText) + '</div>' +
      '</div>' +
      '<div class="letter-card-actions">' +
        '<button class="letter-card-btn" onclick="copyWallReply(' + index + ')">&#128203; 复制回信</button>' +
        '<button class="letter-card-btn" onclick="deleteLetter(' + index + ')">&#128465; 删除</button>' +
      '</div>' +
    '</div>';
  });

  html += '<button class="clear-wall-btn" onclick="clearWall()">&#128465; 清空所有信件</button>';
  html += '</div>';
  wall.innerHTML = html;
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function copyWallReply(index) {
  var letters = JSON.parse(localStorage.getItem('worry_letters') || '[]');
  if (letters[index]) {
    var text = letters[index].replyText;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function() {
        showToast('回信已复制到剪贴板');
      });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('回信已复制到剪贴板');
    }
  }
}

function deleteLetter(index) {
  var letters = JSON.parse(localStorage.getItem('worry_letters') || '[]');
  letters.splice(index, 1);
  localStorage.setItem('worry_letters', JSON.stringify(letters));
  renderLetterWall();
  updateTodayCount();
  showToast('信件已删除');
}

function clearWall() {
  if (confirm('确定要清空所有信件吗？这个操作不可撤销。')) {
    localStorage.removeItem('worry_letters');
    renderLetterWall();
    updateTodayCount();
    showToast('所有信件已清空');
  }
}

// ===== Toast =====
function showToast(msg) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() {
    toast.classList.remove('show');
  }, 2000);
}

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>
