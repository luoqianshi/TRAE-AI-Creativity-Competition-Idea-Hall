<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="牛马自救指南 - 用户等级，经验值与等级进度">
<title>牛马自救指南 · 我的等级</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

  :root {
    --paper: #FDF8F0;
    --paper-dark: #F5EDE0;
    --paper-line: #EDE5D8;
    --ink: #3D3229;
    --ink-light: #6B5E52;
    --ink-muted: #A89B8C;
    --accent: #D4834A;
    --accent-light: #E8A87C;
    --accent-soft: #F5D5C0;
    --warm: #C4A882;
    --green-soft: #B8C9A6;
    --blue-soft: #A8C4D9;
    --purple-soft: #C4B5D4;
    --pink-soft: #E8B4B8;
    --card-bg: #FFFDF9;
    --shadow: rgba(61,50,41,0.06);
    --shadow-hover: rgba(61,50,41,0.10);
    --gold: #D4A03C;
    --gold-light: #F0D080;
    --gold-soft: #FFF3D6;
    --level-locked: #C8C0B6;
    --level-locked-bg: #F0ECE6;
    --rpg-border: #8B7355;
    --rpg-glow: rgba(212,160,60,0.4);
  }

  /* Dark mode */
  html.dark-mode {
    --paper: #1E1D2B;
    --paper-dark: #171622;
    --paper-line: #2A2940;
    --ink: #E8E4DF;
    --ink-light: #B8B3AC;
    --ink-muted: #6E6B66;
    --accent: #E8954A;
    --accent-light: #F0A86C;
    --accent-soft: #3D2E1E;
    --warm: #8A7A62;
    --green-soft: #6B8A5E;
    --blue-soft: #6A8AA5;
    --purple-soft: #8A7BA4;
    --pink-soft: #A88488;
    --card-bg: #252438;
    --shadow: rgba(0,0,0,0.2);
    --shadow-hover: rgba(0,0,0,0.3);
    --gold: #F0C050;
    --gold-light: #D4A03C;
    --gold-soft: #3D3020;
    --level-locked: #4A4640;
    --level-locked-bg: #2A2830;
    --rpg-border: #8A7A5A;
    --rpg-glow: rgba(240,192,80,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #E8E0D4;
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.3s, color 0.3s;
  }
  html.dark-mode body { background: #12111C; }

  .app-container {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--paper);
    position: relative;
    overflow: hidden;
  }

  /* ===== 顶部导航 ===== */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--paper-line);
  }
  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-light);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 20px;
    background: var(--paper-dark);
    border: 1px solid var(--paper-line);
    transition: all 0.2s;
  }
  .back-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .back-btn svg { width: 16px; height: 16px; }
  .page-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 20px;
    color: var(--accent);
  }
  .placeholder-btn { width: 80px; }

  /* ===== 纸张纹理背景 ===== */
  .paper-texture {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    opacity: 0.03;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 28px, var(--ink) 28px, var(--ink) 29px);
  }
  html.dark-mode .paper-texture { opacity: 0.02; }

  /* ===== 主内容区 ===== */
  .main-content {
    padding: 0 20px 40px;
    position: relative;
    z-index: 1;
  }

  /* ===== 等级徽章展示区 ===== */
  .badge-section {
    text-align: center;
    padding: 30px 0 20px;
    position: relative;
  }
  .badge-glow {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--rpg-glow) 0%, transparent 70%);
    animation: glowPulse 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glowPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }
  .level-badge {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    border: 4px solid var(--gold);
    background: linear-gradient(135deg, var(--gold-soft), var(--card-bg));
    box-shadow:
      0 0 20px var(--rpg-glow),
      0 4px 16px var(--shadow),
      inset 0 2px 8px rgba(255,255,255,0.3);
    animation: badgeFloat 4s ease-in-out infinite;
  }
  @keyframes badgeFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .badge-level-num {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 48px;
    color: var(--gold);
    line-height: 1;
    text-shadow: 0 2px 4px rgba(212,160,60,0.3);
  }
  .badge-level-title {
    font-size: 13px;
    color: var(--ink-light);
    margin-top: 2px;
    font-weight: 600;
  }
  .badge-stars {
    display: flex;
    gap: 3px;
    margin-top: 4px;
  }
  .badge-star {
    width: 10px;
    height: 10px;
    background: var(--gold);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .badge-star.empty { background: var(--level-locked); }

  /* ===== 经验进度条 ===== */
  .progress-section {
    margin: 0 0 24px;
    padding: 20px;
    background: var(--card-bg);
    border-radius: 16px;
    border: 1px solid var(--paper-line);
    box-shadow: 0 2px 8px var(--shadow);
  }
  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .progress-label {
    font-size: 14px;
    color: var(--ink-light);
    font-weight: 500;
  }
  .progress-points {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    color: var(--accent);
  }
  .progress-bar-track {
    width: 100%;
    height: 14px;
    background: var(--paper-dark);
    border-radius: 7px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--paper-line);
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 7px;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }
  .progress-bar-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
    animation: shimmer 2s infinite;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .progress-detail {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 12px;
    color: var(--ink-muted);
  }
  .progress-percent {
    font-weight: 700;
    color: var(--accent);
  }

  /* ===== 统计卡片 ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    border: 1px solid var(--paper-line);
    box-shadow: 0 2px 8px var(--shadow);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px var(--shadow-hover);
  }
  .stat-icon {
    font-size: 28px;
    margin-bottom: 6px;
    display: block;
  }
  .stat-value {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 24px;
    color: var(--accent);
    line-height: 1.2;
  }
  .stat-label {
    font-size: 12px;
    color: var(--ink-muted);
    margin-top: 4px;
  }

  /* ===== 等级列表 ===== */
  .section-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: '';
    width: 4px;
    height: 18px;
    background: var(--accent);
    border-radius: 2px;
  }
  .levels-list {
    margin-bottom: 24px;
  }
  .level-item {
    display: flex;
    align-items: stretch;
    background: var(--card-bg);
    border-radius: 14px;
    margin-bottom: 10px;
    border: 2px solid var(--paper-line);
    overflow: hidden;
    transition: all 0.3s;
    position: relative;
  }
  .level-item.current {
    border-color: var(--gold);
    box-shadow: 0 0 16px var(--rpg-glow), 0 4px 12px var(--shadow);
  }
  .level-item.current::before {
    content: '当前';
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .level-item.locked {
    opacity: 0.55;
  }
  .level-item.unlocked {
    border-color: var(--warm);
  }
  .level-num-col {
    width: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px 8px;
    border-right: 1px solid var(--paper-line);
    flex-shrink: 0;
  }
  .level-num-badge {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    font-weight: 700;
    border: 2px solid var(--level-locked);
    color: var(--level-locked);
    background: var(--level-locked-bg);
  }
  .level-item.unlocked .level-num-badge {
    border-color: var(--gold);
    color: var(--gold);
    background: var(--gold-soft);
  }
  .level-item.current .level-num-badge {
    border-color: var(--accent);
    color: #fff;
    background: var(--accent);
    box-shadow: 0 0 12px var(--rpg-glow);
  }
  .level-info {
    flex: 1;
    padding: 12px 14px;
    min-width: 0;
  }
  .level-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .level-title {
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
  }
  .level-item.locked .level-title { color: var(--ink-muted); }
  .level-range {
    font-size: 11px;
    color: var(--ink-muted);
    background: var(--paper-dark);
    padding: 2px 8px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .level-perks {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .level-perk-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 8px;
    background: var(--paper-dark);
    color: var(--ink-light);
    border: 1px solid var(--paper-line);
  }
  .level-item.unlocked .level-perk-tag {
    background: var(--gold-soft);
    color: var(--gold);
    border-color: var(--gold);
  }
  .level-item.current .level-perk-tag {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
  }
  .level-lock-icon {
    width: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--level-locked);
    font-size: 18px;
    flex-shrink: 0;
  }

  /* ===== 积分历史 ===== */
  .history-section {
    margin-bottom: 24px;
  }
  .history-list {
    background: var(--card-bg);
    border-radius: 14px;
    border: 1px solid var(--paper-line);
    overflow: hidden;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .history-item {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--paper-line);
    transition: background 0.2s;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item:hover { background: var(--paper-dark); }
  .history-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    margin-right: 12px;
    flex-shrink: 0;
  }
  .history-icon.positive { background: #E8F5E9; }
  .history-icon.negative { background: #FFF3E0; }
  html.dark-mode .history-icon.positive { background: #1B3A20; }
  html.dark-mode .history-icon.negative { background: #3D2E1E; }
  .history-desc {
    flex: 1;
    font-size: 13px;
    color: var(--ink);
    min-width: 0;
  }
  .history-time {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 2px;
  }
  .history-points {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 16px;
    font-weight: 700;
    flex-shrink: 0;
    margin-left: 12px;
  }
  .history-points.positive { color: #4CAF50; }
  .history-points.negative { color: #FF7043; }

  /* ===== 升级庆祝动画 ===== */
  .confetti-container {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
  }
  .confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    top: -10px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    80% { opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg) scale(0.5); opacity: 0; }
  }
  .confetti:nth-child(1) { left: 10%; animation-duration: 2.5s; animation-delay: 0.1s; background: var(--gold); border-radius: 50%; }
  .confetti:nth-child(2) { left: 20%; animation-duration: 3s; animation-delay: 0.3s; background: var(--accent); width: 8px; height: 12px; border-radius: 2px; }
  .confetti:nth-child(3) { left: 30%; animation-duration: 2.8s; animation-delay: 0.15s; background: var(--pink-soft); border-radius: 50%; }
  .confetti:nth-child(4) { left: 40%; animation-duration: 3.2s; animation-delay: 0.4s; background: var(--blue-soft); width: 12px; height: 8px; border-radius: 2px; }
  .confetti:nth-child(5) { left: 50%; animation-duration: 2.6s; animation-delay: 0.2s; background: var(--green-soft); border-radius: 50%; }
  .confetti:nth-child(6) { left: 60%; animation-duration: 3.1s; animation-delay: 0.35s; background: var(--purple-soft); width: 8px; height: 14px; border-radius: 2px; }
  .confetti:nth-child(7) { left: 70%; animation-duration: 2.7s; animation-delay: 0.25s; background: var(--gold-light); border-radius: 50%; }
  .confetti:nth-child(8) { left: 80%; animation-duration: 3.3s; animation-delay: 0.45s; background: var(--accent-light); width: 14px; height: 8px; border-radius: 2px; }
  .confetti:nth-child(9) { left: 90%; animation-duration: 2.9s; animation-delay: 0.1s; background: var(--warm); border-radius: 50%; }
  .confetti:nth-child(10) { left: 15%; animation-duration: 3.4s; animation-delay: 0.5s; background: var(--pink-soft); width: 6px; height: 16px; border-radius: 2px; }
  .confetti:nth-child(11) { left: 45%; animation-duration: 2.4s; animation-delay: 0.2s; background: var(--gold); border-radius: 50%; }
  .confetti:nth-child(12) { left: 75%; animation-duration: 3.0s; animation-delay: 0.3s; background: var(--accent); width: 10px; height: 10px; border-radius: 50%; }
  .confetti:nth-child(13) { left: 25%; animation-duration: 2.8s; animation-delay: 0.4s; background: var(--blue-soft); border-radius: 50%; }
  .confetti:nth-child(14) { left: 55%; animation-duration: 3.2s; animation-delay: 0.15s; background: var(--green-soft); width: 12px; height: 6px; border-radius: 2px; }
  .confetti:nth-child(15) { left: 85%; animation-duration: 2.6s; animation-delay: 0.35s; background: var(--purple-soft); border-radius: 50%; }
  .confetti:nth-child(16) { left: 35%; animation-duration: 3.5s; animation-delay: 0.25s; background: var(--gold-light); width: 8px; height: 12px; border-radius: 2px; }
  .confetti:nth-child(17) { left: 65%; animation-duration: 2.7s; animation-delay: 0.45s; background: var(--accent-light); border-radius: 50%; }
  .confetti:nth-child(18) { left: 5%; animation-duration: 3.1s; animation-delay: 0.1s; background: var(--warm); width: 14px; height: 8px; border-radius: 2px; }
  .confetti:nth-child(19) { left: 95%; animation-duration: 2.5s; animation-delay: 0.3s; background: var(--pink-soft); border-radius: 50%; }
  .confetti:nth-child(20) { left: 50%; animation-duration: 3.3s; animation-delay: 0.2s; background: var(--gold); width: 10px; height: 10px; border-radius: 50%; }

  /* ===== 底部提示 ===== */
  .footer-tip {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.6;
  }
  .footer-tip .mascot { font-size: 24px; margin-bottom: 6px; display: block; }

  /* ===== 等级颜色映射 ===== */
  .level-color-1 { --lc: #A89B8C; }
  .level-color-2 { --lc: #7BA68A; }
  .level-color-3 { --lc: #6B8FB5; }
  .level-color-4 { --lc: #B07DAA; }
  .level-color-5 { --lc: #D4A03C; }
  .level-color-6 { --lc: #E87040; }
  .level-color-7 { --lc: #D45080; }
  .level-color-8 { --lc: #FFD700; }

  /* ===== 响应式 ===== */
  @media (max-width: 360px) {
    .level-badge { width: 120px; height: 120px; }
    .badge-level-num { font-size: 40px; }
    .stats-grid { gap: 8px; }
    .stat-card { padding: 12px; }
    .stat-value { font-size: 20px; }
  }

  /* ===== 滚动条美化 ===== */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--ink-muted); border-radius: 2px; }

  /* ===== 减少动画偏好 ===== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div class="app-container">
  <div class="paper-texture"></div>

  <!-- 顶部导航 -->
  <div class="top-bar">
    <a href="../niujiu-demo-final.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      返回主应用
    </a>
    <span class="page-title">我的等级</span>
    <div class="placeholder-btn"></div>
  </div>

  <!-- 主内容 -->
  <div class="main-content">

    <!-- 等级徽章 -->
    <div class="badge-section" id="badgeSection">
      <div class="badge-glow" id="badgeGlow"></div>
      <div class="level-badge" id="levelBadge">
        <span class="badge-level-num" id="badgeNum">1</span>
        <span class="badge-level-title" id="badgeTitle">萌新牛马</span>
        <div class="badge-stars" id="badgeStars"></div>
      </div>
    </div>

    <!-- 经验进度条 -->
    <div class="progress-section">
      <div class="progress-header">
        <span class="progress-label">距离下一等级</span>
        <span class="progress-points" id="progressPoints">0 / 100</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill" style="width: 0%"></div>
      </div>
      <div class="progress-detail">
        <span id="progressLevelInfo">Lv.1 萌新牛马</span>
        <span class="progress-percent" id="progressPercent">0%</span>
      </div>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-icon">&#127942;</span>
        <div class="stat-value" id="statPoints">0</div>
        <div class="stat-label">总积分</div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">&#11088;</span>
        <div class="stat-value" id="statLevel">1</div>
        <div class="stat-label">当前等级</div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">&#128197;</span>
        <div class="stat-value" id="statDays">0</div>
        <div class="stat-label">活跃天数</div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">&#127924;</span>
        <div class="stat-value" id="statFlips">0</div>
        <div class="stat-label">翻卡次数</div>
      </div>
    </div>

    <!-- 等级列表 -->
    <div class="levels-list">
      <div class="section-title">等级一览</div>
      <div id="levelsList"></div>
    </div>

    <!-- 积分历史 -->
    <div class="history-section">
      <div class="section-title">积分记录</div>
      <div class="history-list" id="historyList"></div>
    </div>

    <!-- 底部提示 -->
    <div class="footer-tip">
      <span class="mascot">&#129412;</span>
      每日签到、翻卡、写日记都能获得积分哦~<br>
      等级越高，解锁的特权越多！
    </div>
  </div>
</div>

<!-- 庆祝动画容器 -->
<div class="confetti-container" id="confettiContainer"></div>

<script>
(function() {
  'use strict';

  /* ===== 等级配置 ===== */
  const LEVEL_CONFIG = [
    { level: 1, title: '萌新牛马', min: 0, max: 100, perks: ['每日3次翻卡'], dailyFlips: 3 },
    { level: 2, title: '实习牛马', min: 100, max: 300, perks: ['每日4次翻卡', '收藏上限20'], dailyFlips: 4 },
    { level: 3, title: '正式牛马', min: 300, max: 600, perks: ['每日5次翻卡', '收藏上限30', '自定义昵称'], dailyFlips: 5 },
    { level: 4, title: '资深牛马', min: 600, max: 1000, perks: ['每日6次翻卡', '收藏上限50', 'emoji表情'], dailyFlips: 6 },
    { level: 5, title: '精英牛马', min: 1000, max: 2000, perks: ['每日7次翻卡', '收藏上限80', '发帖图片'], dailyFlips: 7 },
    { level: 6, title: '高级牛马', min: 2000, max: 4000, perks: ['每日8次翻卡', '收藏上限100', 'AI高级模板'], dailyFlips: 8 },
    { level: 7, title: '传奇牛马', min: 4000, max: 8000, perks: ['每日10次翻卡', '收藏上限150', '专属卡片背框'], dailyFlips: 10 },
    { level: 8, title: '牛马之神', min: 8000, max: 99999, perks: ['无限翻卡', '无限收藏', '所有特权', '专属称号'], dailyFlips: 999 }
  ];

  /* ===== 等级颜色 ===== */
  const LEVEL_COLORS = [
    '#A89B8C', '#7BA68A', '#6B8FB5', '#B07DAA',
    '#D4A03C', '#E87040', '#D45080', '#FFD700'
  ];

  /* ===== 读取状态 ===== */
  function loadState() {
    try {
      const raw = localStorage.getItem('niujiu_state_v3');
      if (raw) {
        const state = JSON.parse(raw);
        return {
          userPoints: state.userPoints || 0,
          userLevel: state.userLevel || 1,
          daysActive: state.daysActive || 1,
          totalFlips: state.totalFlips || 0,
          pointsHistory: state.pointsHistory || []
        };
      }
    } catch (e) { /* ignore */ }
    return {
      userPoints: 350,
      userLevel: 3,
      daysActive: 15,
      totalFlips: 42,
      pointsHistory: generateDefaultHistory()
    };
  }

  /* ===== 模拟积分历史 ===== */
  function generateDefaultHistory() {
    const items = [
      { desc: '每日签到', points: 10, icon: '&#128221;', type: 'positive' },
      { desc: '翻卡获得', points: 15, icon: '&#127924;', type: 'positive' },
      { desc: '写日记奖励', points: 20, icon: '&#128221;', type: 'positive' },
      { desc: 'AI聊天奖励', points: 10, icon: '&#129302;', type: 'positive' },
      { desc: '连续签到加成', points: 25, icon: '&#128293;', type: 'positive' },
      { desc: '分享奖励', points: 30, icon: '&#128228;', type: 'positive' },
      { desc: '被抱抱奖励', points: 5, icon: '&#129303;', type: 'positive' },
      { desc: '发帖奖励', points: 15, icon: '&#128172;', type: 'positive' },
      { desc: '完成每日任务', points: 20, icon: '&#9989;', type: 'positive' },
      { desc: '等级提升奖励', points: 50, icon: '&#127942;', type: 'positive' }
    ];
    const now = Date.now();
    return items.map((item, i) => ({
      ...item,
      time: new Date(now - i * 3600000 * (Math.random() * 5 + 1)).toLocaleString('zh-CN', {
        month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
      })
    }));
  }

  /* ===== 计算等级 ===== */
  function calcLevel(points) {
    for (let i = LEVEL_CONFIG.length - 1; i >= 0; i--) {
      if (points >= LEVEL_CONFIG[i].min) return LEVEL_CONFIG[i];
    }
    return LEVEL_CONFIG[0];
  }

  /* ===== 暗色模式 ===== */
  function applyDarkMode() {
    try {
      const dark = localStorage.getItem('darkMode');
      if (dark === 'true' || dark === '1') {
        document.documentElement.classList.add('dark-mode');
      } else {
        document.documentElement.classList.remove('dark-mode');
      }
    } catch (e) { /* ignore */ }
  }

  /* ===== 渲染徽章 ===== */
  function renderBadge(levelData, points) {
    const badge = document.getElementById('levelBadge');
    const num = document.getElementById('badgeNum');
    const title = document.getElementById('badgeTitle');
    const stars = document.getElementById('badgeStars');
    const glow = document.getElementById('badgeGlow');

    num.textContent = levelData.level;
    title.textContent = levelData.title;

    const color = LEVEL_COLORS[levelData.level - 1];
    badge.style.borderColor = color;
    badge.style.background = `linear-gradient(135deg, ${color}22, var(--card-bg))`;
    num.style.color = color;
    num.style.textShadow = `0 2px 4px ${color}44`;
    glow.style.background = `radial-gradient(circle, ${color}66 0%, transparent 70%)`;

    // 星星 (每级显示 level 数量的星星)
    let starsHTML = '';
    for (let i = 0; i < 5; i++) {
      starsHTML += `<span class="badge-star ${i < Math.min(levelData.level, 5) ? '' : 'empty'}" style="${i < levelData.level ? 'background:' + color : ''}"></span>`;
    }
    stars.innerHTML = starsHTML;
  }

  /* ===== 渲染进度条 ===== */
  function renderProgress(levelData, points) {
    const fill = document.getElementById('progressFill');
    const pointsEl = document.getElementById('progressPoints');
    const percentEl = document.getElementById('progressPercent');
    const infoEl = document.getElementById('progressLevelInfo');

    const isMax = levelData.level >= LEVEL_CONFIG.length;
    const range = isMax ? 0 : levelData.max - levelData.min;
    const current = isMax ? 0 : points - levelData.min;
    const pct = isMax ? 100 : Math.min(100, Math.round((current / range) * 100));

    pointsEl.textContent = isMax ? `${points} (已满级)` : `${current} / ${range}`;
    infoEl.textContent = `Lv.${levelData.level} ${levelData.title}`;

    // 延迟动画
    requestAnimationFrame(() => {
      setTimeout(() => {
        fill.style.width = pct + '%';
        percentEl.textContent = pct + '%';
      }, 300);
    });
  }

  /* ===== 渲染统计卡片 ===== */
  function renderStats(state) {
    document.getElementById('statPoints').textContent = state.userPoints.toLocaleString();
    document.getElementById('statLevel').textContent = state.userLevel;
    document.getElementById('statDays').textContent = state.daysActive;
    document.getElementById('statFlips').textContent = state.totalFlips;
  }

  /* ===== 渲染等级列表 ===== */
  function renderLevelsList(currentLevel, points) {
    const container = document.getElementById('levelsList');
    let html = '';

    LEVEL_CONFIG.forEach((lv) => {
      const isUnlocked = points >= lv.min;
      const isCurrent = lv.level === currentLevel;
      const statusClass = isCurrent ? 'current' : (isUnlocked ? 'unlocked' : 'locked');
      const color = LEVEL_COLORS[lv.level - 1];

      let perksHTML = lv.perks.map(p => `<span class="level-perk-tag">${p}</span>`).join('');

      html += `
        <div class="level-item ${statusClass} level-color-${lv.level}">
          <div class="level-num-col">
            <div class="level-num-badge" ${isUnlocked && !isCurrent ? `style="border-color:${color};color:${color};background:${color}18"` : ''}>
              ${lv.level}
            </div>
          </div>
          <div class="level-info">
            <div class="level-title-row">
              <span class="level-title">${lv.title}</span>
              <span class="level-range">${lv.min}~${lv.max === 99999 ? '∞' : lv.max}</span>
            </div>
            <div class="level-perks">${perksHTML}</div>
          </div>
          ${!isUnlocked ? '<div class="level-lock-icon">&#128274;</div>' : ''}
        </div>
      `;
    });

    container.innerHTML = html;
  }

  /* ===== 渲染积分历史 ===== */
  function renderHistory(history) {
    const container = document.getElementById('historyList');
    const items = history.slice(0, 10);

    if (items.length === 0) {
      container.innerHTML = `
        <div style="padding: 30px; text-align: center; color: var(--ink-muted); font-size: 14px;">
          暂无积分记录，快去完成任务吧~
        </div>
      `;
      return;
    }

    let html = '';
    items.forEach(item => {
      const sign = item.type === 'positive' ? '+' : '';
      html += `
        <div class="history-item">
          <div class="history-icon ${item.type}">${item.icon || '&#128200;'}</div>
          <div>
            <div class="history-desc">${item.desc}</div>
            <div class="history-time">${item.time}</div>
          </div>
          <div class="history-points ${item.type}">${sign}${item.points}</div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  /* ===== 庆祝动画 ===== */
  function triggerConfetti() {
    const container = document.getElementById('confettiContainer');
    container.innerHTML = '';
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = (2 + Math.random() * 2) + 's';
      el.style.animationDelay = (Math.random() * 0.6) + 's';
      const colors = ['#D4A03C', '#D4834A', '#E8B4B8', '#A8C4D9', '#B8C9A6', '#C4B5D4', '#E8A87C'];
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      const shapes = ['50%', '2px', '30%'];
      el.style.borderRadius = shapes[Math.floor(Math.random() * shapes.length)];
      el.style.width = (6 + Math.random() * 10) + 'px';
      el.style.height = (6 + Math.random() * 10) + 'px';
      container.appendChild(el);
    }
    setTimeout(() => { container.innerHTML = ''; }, 5000);
  }

  /* ===== 初始化 ===== */
  function init() {
    applyDarkMode();

    const state = loadState();
    // 根据积分重新计算等级（以防不匹配）
    const levelData = calcLevel(state.userPoints);

    renderBadge(levelData, state.userPoints);
    renderProgress(levelData, state.userPoints);
    renderStats(state);
    renderLevelsList(levelData.level, state.userPoints);
    renderHistory(state.pointsHistory);

    // 页面加载时播放一次庆祝动画
    setTimeout(triggerConfetti, 800);
  }

  // DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
