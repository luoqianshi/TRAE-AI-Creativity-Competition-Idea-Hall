<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="牛马自救指南 - 情绪电台，用声音治愈心灵">
<title>情绪电台 · 牛马自救指南</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FDF8F0;
    --bg2: #F5EDE0;
    --ink: #2D2A24;
    --accent: #E8916A;
    --ink-muted: #7A7670;
    --card-bg: #FFFBF5;
    --shadow: rgba(45,42,36,0.08);
    --shadow-md: rgba(45,42,36,0.12);
    --radius: 16px;
    --transition: 0.3s ease;
    --radio-glow: rgba(232,145,106,0.25);
    --vinyl-dark: #2D2A24;
    --vinyl-light: #3A3630;
  }

  html.dark-mode {
    --bg: #1A1918;
    --bg2: #252320;
    --ink: #E8E4DC;
    --accent: #E8916A;
    --ink-muted: #9A968E;
    --card-bg: #2A2826;
    --shadow: rgba(0,0,0,0.25);
    --shadow-md: rgba(0,0,0,0.35);
    --radio-glow: rgba(232,145,106,0.15);
    --vinyl-dark: #111;
    --vinyl-light: #222;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    transition: background var(--transition), color var(--transition);
  }

  /* ===== Radio Turn-On Animation ===== */
  .page-wrapper {
    opacity: 0;
    filter: brightness(0);
    animation: radioTurnOn 1.2s ease-out 0.2s forwards;
  }
  @keyframes radioTurnOn {
    0% { opacity: 0; filter: brightness(0); }
    30% { opacity: 1; filter: brightness(1.5); }
    50% { filter: brightness(0.8); }
    70% { filter: brightness(1.1); }
    100% { opacity: 1; filter: brightness(1); }
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    background: var(--bg);
    overflow: hidden;
    transition: background var(--transition);
  }

  /* ===== Warm Gradient Background ===== */
  .gradient-bg {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    height: 100vh;
    z-index: 0;
    background: radial-gradient(ellipse at 50% 0%, var(--radio-glow) 0%, var(--bg) 70%);
    pointer-events: none;
    transition: background 0.8s ease;
  }

  /* ===== Header ===== */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--shadow);
    backdrop-filter: blur(12px);
    transition: background var(--transition);
  }
  .header-left { display: flex; align-items: center; gap: 8px; }
  .back-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--card-bg);
    color: var(--ink);
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px var(--shadow);
    transition: all var(--transition);
  }
  .back-btn:active { transform: scale(0.92); }
  .header-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
  }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--card-bg);
    color: var(--ink-muted);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px var(--shadow);
    transition: all var(--transition);
  }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn.active { color: var(--accent); }

  /* ===== Radio Dial Section ===== */
  .radio-section {
    position: relative;
    z-index: 1;
    padding: 24px 20px 16px;
    text-align: center;
  }

  .radio-dial-container {
    position: relative;
    width: 200px;
    height: 200px;
    margin: 0 auto 20px;
  }

  /* Vinyl Record */
  .vinyl-record {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: conic-gradient(
      var(--vinyl-dark) 0deg,
      var(--vinyl-light) 10deg,
      var(--vinyl-dark) 20deg,
      var(--vinyl-light) 30deg,
      var(--vinyl-dark) 40deg,
      var(--vinyl-light) 50deg,
      var(--vinyl-dark) 60deg,
      var(--vinyl-light) 70deg,
      var(--vinyl-dark) 80deg,
      var(--vinyl-light) 90deg,
      var(--vinyl-dark) 100deg,
      var(--vinyl-light) 110deg,
      var(--vinyl-dark) 120deg,
      var(--vinyl-light) 130deg,
      var(--vinyl-dark) 140deg,
      var(--vinyl-light) 150deg,
      var(--vinyl-dark) 160deg,
      var(--vinyl-light) 170deg,
      var(--vinyl-dark) 180deg,
      var(--vinyl-light) 190deg,
      var(--vinyl-dark) 200deg,
      var(--vinyl-light) 210deg,
      var(--vinyl-dark) 220deg,
      var(--vinyl-light) 230deg,
      var(--vinyl-dark) 240deg,
      var(--vinyl-light) 250deg,
      var(--vinyl-dark) 260deg,
      var(--vinyl-light) 270deg,
      var(--vinyl-dark) 280deg,
      var(--vinyl-light) 290deg,
      var(--vinyl-dark) 300deg,
      var(--vinyl-light) 310deg,
      var(--vinyl-dark) 320deg,
      var(--vinyl-light) 330deg,
      var(--vinyl-dark) 340deg,
      var(--vinyl-light) 350deg,
      var(--vinyl-dark) 360deg
    );
    box-shadow: 0 4px 24px var(--shadow-md), inset 0 0 30px rgba(0,0,0,0.3);
    position: relative;
    animation: vinylSpin 4s linear infinite;
    animation-play-state: paused;
  }
  .vinyl-record.playing {
    animation-play-state: running;
  }

  @keyframes vinylSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .vinyl-label {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.15);
  }
  .vinyl-label::after {
    content: '';
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--bg);
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .vinyl-emoji {
    font-size: 28px;
    line-height: 1;
    z-index: 1;
    margin-bottom: 2px;
  }

  /* Frequency Display */
  .frequency-display {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 12px 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.1);
    border: 1px solid var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .frequency-display::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232,145,106,0.3), transparent);
  }
  .freq-main {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
  }
  .freq-channel-name {
    font-size: 14px;
    color: var(--ink-muted);
    margin-top: 4px;
  }

  /* Sound Wave / Equalizer */
  .now-playing-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 12px;
    min-height: 28px;
  }
  .now-playing-label {
    font-size: 12px;
    color: var(--accent);
    margin-right: 6px;
    font-weight: 500;
  }
  .equalizer {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 20px;
  }
  .eq-bar {
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
    animation: eqBounce 0.8s ease-in-out infinite alternate;
  }
  .eq-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
  .eq-bar:nth-child(2) { height: 16px; animation-delay: 0.15s; }
  .eq-bar:nth-child(3) { height: 10px; animation-delay: 0.3s; }
  .eq-bar:nth-child(4) { height: 20px; animation-delay: 0.1s; }
  .eq-bar:nth-child(5) { height: 12px; animation-delay: 0.25s; }
  .eq-bar:nth-child(6) { height: 6px; animation-delay: 0.35s; }
  .eq-bar:nth-child(7) { height: 14px; animation-delay: 0.05s; }

  @keyframes eqBounce {
    0% { transform: scaleY(0.3); }
    100% { transform: scaleY(1); }
  }

  .equalizer.paused .eq-bar {
    animation-play-state: paused;
    transform: scaleY(0.2);
  }

  /* Tuning Static Overlay */
  .tuning-overlay {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    height: 100vh;
    z-index: 200;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .tuning-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .static-noise {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }
  .static-noise::before,
  .static-noise::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: repeating-conic-gradient(
      var(--ink-muted) 0% 25%,
      transparent 0% 50%
    ) 0 0 / 4px 4px;
    opacity: 0.08;
    animation: staticMove 0.1s steps(4) infinite;
  }
  .static-noise::after {
    animation-delay: 0.05s;
    background: repeating-conic-gradient(
      var(--accent) 0% 25%,
      transparent 0% 50%
    ) 0 0 / 6px 6px;
    opacity: 0.05;
  }
  @keyframes staticMove {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-2px, 1px); }
    50% { transform: translate(1px, -2px); }
    75% { transform: translate(-1px, -1px); }
    100% { transform: translate(2px, 2px); }
  }
  .tuning-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 18px;
    color: var(--accent);
    font-weight: 600;
    text-align: center;
    z-index: 1;
    animation: tuningFlicker 0.15s steps(2) infinite;
  }
  @keyframes tuningFlicker {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ===== Channel Selector ===== */
  .channel-section {
    position: relative;
    z-index: 1;
    padding: 0 16px 12px;
  }
  .section-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 12px;
    padding-left: 4px;
  }
  .channel-list {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 8px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .channel-list::-webkit-scrollbar { display: none; }

  .channel-chip {
    flex-shrink: 0;
    scroll-snap-align: start;
    padding: 10px 16px;
    border-radius: 24px;
    background: var(--card-bg);
    border: 2px solid transparent;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 2px 8px var(--shadow);
    user-select: none;
    -webkit-user-select: none;
  }
  .channel-chip:active { transform: scale(0.95); }
  .channel-chip.active {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(232,145,106,0.1), rgba(232,145,106,0.05));
    box-shadow: 0 2px 12px var(--radio-glow);
  }
  .channel-chip-emoji { font-size: 18px; }
  .channel-chip-freq {
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
  }
  .channel-chip-name {
    font-size: 13px;
    color: var(--ink);
    font-weight: 500;
  }

  /* ===== Random Tune Button ===== */
  .random-tune-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 8px 16px 16px;
    padding: 10px 20px;
    border-radius: 24px;
    border: 1.5px dashed var(--accent);
    background: transparent;
    color: var(--accent);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    position: relative;
    z-index: 1;
  }
  .random-tune-btn:active {
    transform: scale(0.96);
    background: rgba(232,145,106,0.08);
  }

  /* ===== Content Cards ===== */
  .content-section {
    position: relative;
    z-index: 1;
    padding: 0 16px 24px;
  }
  .content-cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .content-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: 0 2px 12px var(--shadow);
    transition: all var(--transition);
    position: relative;
    overflow: hidden;
    animation: cardSlideIn 0.4s ease-out backwards;
  }
  .content-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px;
    height: 100%;
    border-radius: 0 4px 4px 0;
    transition: background var(--transition);
  }
  .content-card.type-activity::before { background: #6BCB77; }
  .content-card.type-breathing::before { background: #4D96FF; }
  .content-card.type-selfcare::before { background: #FFD93D; }
  .content-card.type-music::before { background: #C77DFF; }
  .content-card.type-affirmation::before { background: #FF6B6B; }

  .content-card:active { transform: scale(0.98); }

  @keyframes cardSlideIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .card-emoji {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .type-activity .card-emoji { background: rgba(107,203,119,0.15); }
  .type-breathing .card-emoji { background: rgba(77,150,255,0.15); }
  .type-selfcare .card-emoji { background: rgba(255,217,61,0.15); }
  .type-music .card-emoji { background: rgba(199,125,255,0.15); }
  .type-affirmation .card-emoji { background: rgba(255,107,107,0.15); }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    flex: 1;
  }
  .card-type-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
    flex-shrink: 0;
  }
  .type-activity .card-type-badge { background: rgba(107,203,119,0.12); color: #4A9E56; }
  .type-breathing .card-type-badge { background: rgba(77,150,255,0.12); color: #3A7BD5; }
  .type-selfcare .card-type-badge { background: rgba(255,217,61,0.12); color: #C5A020; }
  .type-music .card-type-badge { background: rgba(199,125,255,0.12); color: #9B5FD6; }
  .type-affirmation .card-type-badge { background: rgba(255,107,107,0.12); color: #D44E4E; }

  .card-desc {
    font-size: 13px;
    color: var(--ink-muted);
    line-height: 1.6;
    padding-left: 50px;
  }

  .card-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 10px;
    padding-left: 50px;
  }
  .card-action-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 12px;
    border: none;
    background: var(--bg2);
    color: var(--ink-muted);
    font-size: 12px;
    cursor: pointer;
    transition: all var(--transition);
  }
  .card-action-btn:active { transform: scale(0.92); }
  .card-action-btn.favorited {
    color: var(--accent);
    background: rgba(232,145,106,0.12);
  }

  /* ===== Favorites Panel ===== */
  .favorites-panel {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: 100%;
    max-width: 480px;
    height: 85vh;
    background: var(--bg);
    z-index: 300;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -4px 24px var(--shadow-md);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .favorites-panel.open {
    transform: translateX(-50%) translateY(0);
  }
  .fav-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--shadow);
  }
  .fav-panel-title {
    font-size: 16px;
    font-weight: 600;
  }
  .fav-close-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--bg2);
    color: var(--ink-muted);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fav-panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
  }
  .fav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--shadow);
  }
  .fav-item:last-child { border-bottom: none; }
  .fav-item-emoji { font-size: 24px; }
  .fav-item-info { flex: 1; }
  .fav-item-title { font-size: 14px; font-weight: 500; }
  .fav-item-channel { font-size: 12px; color: var(--ink-muted); }
  .fav-remove-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: rgba(255,107,107,0.1);
    color: #FF6B6B;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fav-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-muted);
    font-size: 14px;
  }
  .fav-empty-emoji { font-size: 48px; margin-bottom: 12px; display: block; }

  /* ===== History Panel ===== */
  .history-panel {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: 100%;
    max-width: 480px;
    height: 85vh;
    background: var(--bg);
    z-index: 300;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -4px 24px var(--shadow-md);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .history-panel.open {
    transform: translateX(-50%) translateY(0);
  }
  .history-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--shadow);
  }
  .history-panel-title { font-size: 16px; font-weight: 600; }
  .history-close-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--bg2);
    color: var(--ink-muted);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .history-panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--shadow);
  }
  .history-item:last-child { border-bottom: none; }
  .history-item-emoji { font-size: 24px; }
  .history-item-info { flex: 1; }
  .history-item-name { font-size: 14px; font-weight: 500; }
  .history-item-freq { font-size: 12px; color: var(--ink-muted); }
  .history-item-count {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    background: rgba(232,145,106,0.1);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .history-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-muted);
    font-size: 14px;
  }
  .history-empty-emoji { font-size: 48px; margin-bottom: 12px; display: block; }

  /* ===== Panel Backdrop ===== */
  .panel-backdrop {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 250;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .panel-backdrop.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--bg);

// ===== State =====
let currentChannelIndex = 0;
let favorites = JSON.parse(localStorage.getItem('radio_favorites') || '[]');
let listenHistory = JSON.parse(localStorage.getItem('radio_listen_history') || '{}');

// ===== Dark Mode =====
function initDarkMode() {
  const isDark = localStorage.getItem('darkMode') === 'true';
  if (isDark) {
    document.documentElement.classList.add('dark-mode');
  }
}

// ===== Render Channels =====
function renderChannels() {
  const list = document.getElementById('channelList');
  list.innerHTML = channels.map((ch, i) => `
    <div class="channel-chip ${i === currentChannelIndex ? 'active' : ''}" onclick="switchChannel(${i})" data-index="${i}">
      <span class="channel-chip-emoji">${ch.emoji}</span>
      <div>
        <div class="channel-chip-freq">${ch.freq}</div>
        <div class="channel-chip-name">${ch.name}</div>
      </div>
    </div>
  `).join('');
}

// ===== Render Content Cards =====
function renderCards() {
  const ch = channels[currentChannelIndex];
  const container = document.getElementById('contentCards');
  const title = document.getElementById('contentTitle');
  title.textContent = `${ch.name} · 推荐内容`;

  container.innerHTML = ch.cards.map((card, i) => {
    const isFav = favorites.some(f => f.channelId === ch.id && f.cardTitle === card.title);
    return `
    <div class="content-card type-${card.type}" style="animation-delay: ${i * 0.06}s">
      <div class="card-header">
        <div class="card-emoji">${card.emoji}</div>
        <span class="card-title">${card.title}</span>
        <span class="card-type-badge">${card.typeLabel}</span>
      </div>
      <div class="card-desc">${card.desc}</div>
      <div class="card-actions">
        <button class="card-action-btn ${isFav ? 'favorited' : ''}" onclick="toggleFavorite('${ch.id}', '${card.title.replace(/'/g, "\\'")}', '${card.emoji}', '${ch.name}')">
          ${isFav ? '&#9733; 已收藏' : '&#9734; 收藏'}
        </button>
      </div>
    </div>
  `}).join('');
}

// ===== Switch Channel =====
function switchChannel(index) {
  if (index === currentChannelIndex) return;

  // Show tuning animation
  const overlay = document.getElementById('tuningOverlay');
  const tuningText = document.getElementById('tuningText');
  const targetCh = channels[index];

  overlay.classList.add('active');
  tuningText.textContent = `${targetCh.freq} 调频中...`;

  // Pause equalizer during tuning
  document.getElementById('equalizer').classList.add('paused');
  document.getElementById('vinylRecord').classList.remove('playing');

  setTimeout(() => {
    currentChannelIndex = index;
    const ch = channels[currentChannelIndex];

    // Update display
    document.getElementById('freqDisplay').textContent = ch.freq;
    document.getElementById('channelNameDisplay').textContent = ch.name;
    document.getElementById('vinylEmoji').textContent = ch.emoji;

    // Update gradient
    document.getElementById('gradientBg').style.background =
      `radial-gradient(ellipse at 50% 0%, ${ch.color}22 0%, var(--bg) 70%)`;

    // Track history
    listenHistory[ch.id] = (listenHistory[ch.id] || 0) + 1;
    localStorage.setItem('radio_listen_history', JSON.stringify(listenHistory));

    // Render
    renderChannels();
    renderCards();

    // Hide overlay
    setTimeout(() => {
      overlay.classList.remove('active');
      document.getElementById('equalizer').classList.remove('paused');
      document.getElementById('vinylRecord').classList.add('playing');
    }, 300);
  }, 600);
}

// ===== Random Tune =====
function randomTune() {
  let newIndex;
  do {
    newIndex = Math.floor(Math.random() * channels.length);
  } while (newIndex === currentChannelIndex);
  switchChannel(newIndex);
}

// ===== Favorites =====
function toggleFavorite(channelId, cardTitle, cardEmoji, channelName) {
  const existingIndex = favorites.findIndex(f => f.channelId === channelId && f.cardTitle === cardTitle);
  if (existingIndex > -1) {
    favorites.splice(existingIndex, 1);
    showToast('已取消收藏');
  } else {
    favorites.push({ channelId, cardTitle, cardEmoji, channelName });
    showToast('已收藏 ♥');
  }
  localStorage.setItem('radio_favorites', JSON.stringify(favorites));
  renderCards();
}

function toggleFavorites() {
  const panel = document.getElementById('favoritesPanel');
  const backdrop = document.getElementById('panelBackdrop');
  const isOpen = panel.classList.contains('open');

  if (isOpen) {
    closeAllPanels();
  } else {
    renderFavoritesPanel();
    panel.classList.add('open');
    backdrop.classList.add('active');
  }
}

function renderFavoritesPanel() {
  const body = document.getElementById('favPanelBody');
  if (favorites.length === 0) {
    body.innerHTML = `
      <div class="fav-empty">
        <span class="fav-empty-emoji">🎧</span>
        还没有收藏的内容<br>收听电台时点击收藏按钮吧
      </div>`;
    return;
  }
  body.innerHTML = favorites.map((fav, i) => `
    <div class="fav-item">
      <span class="fav-item-emoji">${fav.cardEmoji}</span>
      <div class="fav-item-info">
        <div class="fav-item-title">${fav.cardTitle}</div>
        <div class="fav-item-channel">${fav.channelName}</div>
      </div>
      <button class="fav-remove-btn" onclick="removeFavorite(${i})">&#10005;</button>
    </div>
  `).join('');
}

function removeFavorite(index) {
  favorites.splice(index, 1);
  localStorage.setItem('radio_favorites', JSON.stringify(favorites));
  renderFavoritesPanel();
  renderCards();
  showToast('已取消收藏');
}

// ===== History =====
function toggleHistory() {
  const panel = document.getElementById('historyPanel');
  const backdrop = document.getElementById('panelBackdrop');
  const isOpen = panel.classList.contains('open');

  if (isOpen) {
    closeAllPanels();
  } else {
    renderHistoryPanel();
    panel.classList.add('open');
    backdrop.classList.add('active');
  }
}

function renderHistoryPanel() {
  const body = document.getElementById('historyPanelBody');
  const entries = Object.entries(listenHistory).sort((a, b) => b[1] - a[1]);

  if (entries.length === 0) {
    body.innerHTML = `
      <div class="history-empty">
        <span class="history-empty-emoji">📻</span>
        还没有收听记录<br>选择一个频道开始收听吧
      </div>`;
    return;
  }

  body.innerHTML = entries.map(([id, count]) => {
    const ch = channels.find(c => c.id === id);
    if (!ch) return '';
    return `
    <div class="history-item">
      <span class="history-item-emoji">${ch.emoji}</span>
      <div class="history-item-info">
        <div class="history-item-name">${ch.name}</div>
        <div class="history-item-freq">${ch.freq}</div>
      </div>
      <span class="history-item-count">收听 ${count} 次</span>
    </div>
  `}).join('');
}

function closeAllPanels() {
  document.getElementById('favoritesPanel').classList.remove('open');
  document.getElementById('historyPanel').classList.remove('open');
  document.getElementById('panelBackdrop').classList.remove('active');
}

// ===== Toast =====
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}

// ===== Init =====
function init() {
  initDarkMode();

  // Track initial channel visit
  const initCh = channels[currentChannelIndex];
  listenHistory[initCh.id] = (listenHistory[initCh.id] || 0) + 1;
  localStorage.setItem('radio_listen_history', JSON.stringify(listenHistory));

  // Set initial gradient
  document.getElementById('gradientBg').style.background =
    `radial-gradient(ellipse at 50% 0%, ${initCh.color}22 0%, var(--bg) 70%)`;

  renderChannels();
  renderCards();
}

init();

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>
