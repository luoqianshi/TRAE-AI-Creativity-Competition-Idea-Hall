<!--
  牛马自救指南 · 职场段子手
  参照抖音职场搞笑内容、微博职场吐槽
  单文件、零外部依赖、全功能可交互
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>牛马自救指南 · 职场段子手</title>
<meta name="description" content="100+条职场段子吐槽，每日推荐、点赞收藏、分享卡片，打工人的快乐源泉。">
<meta name="theme-color" content="#D4834A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FDF8F0;
    --paper-dark: #F5EDE0;
    --paper-line: #EDE5D8;
    --ink: #3D3229;
    --ink-light: #6B5E52;
    --ink-muted: #A89B8C;
    --accent: #D4834A;
    --accent-light: #E8A87C;
    --accent-soft: #F5D5C0;
    --warm: #C4A882;
    --card-bg: #FFFDF9;
    --shadow: rgba(61,50,41,0.06);
    --shadow-hover: rgba(61,50,41,0.10);
    --blue: #7BAED4;
    --blue-light: #A8D0F0;
    --blue-soft: #D4EAFA;
    --green: #7BA68A;
    --green-light: #A8D4B0;
    --green-soft: #D4EAD8;
    --pink: #D48BA0;
    --pink-light: #F0B0C4;
    --pink-soft: #FAD4DE;
    --yellow: #D4C47B;
    --yellow-light: #F0E4A8;
    --yellow-soft: #FAF0D4;
    --red: #D47B7B;
    --red-light: #F0A8A8;
    --red-soft: #FAD4D4;
    --purple: #9B7BD4;
    --purple-light: #C0A8F0;
    --purple-soft: #E0D4FA;
    --gray: #A89B8C;
    --gray-light: #C8BEB2;
    --gray-soft: #E8E2DA;
    --radius-sm: 6px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --radius-full: 50%;
    --shadow-sm: 0 2px 8px rgba(61,50,41,0.06);
    --shadow-md: 0 4px 16px rgba(61,50,41,0.10);
    --shadow-lg: 0 4px 20px rgba(212,131,74,0.35);
  }

  html.dark-mode {
    --paper: #1A1A2E;
    --paper-dark: #16213E;
    --paper-line: #2A2A4A;
    --ink: #E8E6E3;
    --ink-light: #B8B5B0;
    --ink-muted: #7A7670;
    --card-bg: #222244;
    --shadow: rgba(0,0,0,0.2);
    --shadow-hover: rgba(0,0,0,0.3);
    --accent: #E8A060;
    --accent-light: #F0B880;
    --accent-soft: #3D2E20;
    --warm: #C4A882;
    --blue: #6B9EC4; --blue-light: #8BB8D8; --blue-soft: #B8D4EA;
    --green: #6B9A7A; --green-light: #8BB898; --green-soft: #B8D4C0;
    --pink: #B87A90; --pink-light: #D898A8; --pink-soft: #E8B8C8;
    --yellow: #B8A86B; --yellow-light: #D8C888; --yellow-soft: #E8D8A8;
    --red: #B86B6B; --red-light: #D89898; --red-soft: #E8B8B8;
    --purple: #8B6BC4; --purple-light: #A888D8; --purple-soft: #C8B8E8;
    --gray: #8B8078; --gray-light: #A89888; --gray-soft: #C8C0B8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.light-mode) {
      --paper: #1A1A2E;
      --paper-dark: #16213E;
      --paper-line: #2A2A4A;
      --ink: #E8E6E3;
      --ink-light: #B8B5B0;
      --ink-muted: #7A7670;
      --card-bg: #222244;
      --shadow: rgba(0,0,0,0.2);
      --shadow-hover: rgba(0,0,0,0.3);
      --accent: #E8A060;
      --accent-light: #F0B880;
      --accent-soft: #3D2E20;
      --warm: #C4A882;
      --blue: #6B9EC4; --blue-light: #8BB8D8; --blue-soft: #B8D4EA;
      --green: #6B9A7A; --green-light: #8BB898; --green-soft: #B8D4C0;
      --pink: #B87A90; --pink-light: #D898A8; --pink-soft: #E8B8C8;
      --yellow: #B8A86B; --yellow-light: #D8C888; --yellow-soft: #E8D8A8;
      --red: #B86B6B; --red-light: #D89898; --red-soft: #E8B8B8;
      --purple: #8B6BC4; --purple-light: #A888D8; --purple-soft: #C8B8E8;
      --gray: #8B8078; --gray-light: #A89888; --gray-soft: #C8C0B8;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { transition: background-color 0.3s ease, color 0.3s ease; }
  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--paper-dark);
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .handwriting { font-family: 'ZCOOL KuaiLe', 'STKaiti', 'KaiTi', cursive; }

  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--paper);
    position: relative;
    overflow: hidden;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--paper);
    border-bottom: 1px solid var(--paper-line);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .back-btn {
    width: 36px; height: 36px;
    border-radius: var(--radius-full);
    border: 1px solid var(--paper-line);
    background: var(--card-bg);
    color: var(--ink);
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .back-btn:active { transform: scale(0.92); }
  .header-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    color: var(--ink);
  }
  .theme-btn {
    width: 36px; height: 36px;
    border-radius: var(--radius-full);
    border: 1px solid var(--paper-line);
    background: var(--card-bg);
    color: var(--ink);
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* Tabs */
  .tabs {
    display: flex;
    padding: 0 16px;
    border-bottom: 1px solid var(--paper-line);
    background: var(--paper);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 12px 0;
    font-size: 14px;
    color: var(--ink-muted);
    cursor: pointer;
    position: relative;
    transition: color 0.2s;
    font-weight: 500;
  }
  .tab.active { color: var(--accent); font-weight: 700; }
  .tab.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 24px; height: 3px;
    background: var(--accent);
    border-radius: 2px;
  }

  .page { display: none; padding: 16px; padding-bottom: 100px; min-height: calc(100vh - 110px); }
  .page.active { display: block; animation: pageIn 0.3s ease; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== FEED PAGE ===== */
  .category-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 12px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .category-bar::-webkit-scrollbar { display: none; }
  .category-pill {
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 13px;
    border: 1px solid var(--paper-line);
    background: var(--card-bg);
    color: var(--ink-light);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    user-select: none;
  }
  .category-pill.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 500;
  }
  .category-pill:active { transform: scale(0.95); }

  .anecdote-card {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .anecdote-badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    margin-bottom: 12px;
    font-weight: 500;
  }
  .anecdote-text {
    font-size: 18px;
    line-height: 1.8;
    color: var(--ink);
    margin-bottom: 16px;
    font-weight: 500;
  }
  .anecdote-source {
    font-size: 12px;
    color: var(--ink-muted);
    margin-bottom: 14px;
  }
  .anecdote-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .action-btn {
    flex: 1;
    padding: 8px;
    border-radius: var(--radius-md);
    border: 1px solid var(--paper-line);
    background: var(--paper);
    color: var(--ink-light);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: all 0.2s;
    font-family: inherit;
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn.liked {
    background: var(--red-soft);
    color: var(--red);
    border-color: var(--red-light);
  }
  .action-btn.disliked {
    background: var(--gray-soft);
    color: var(--gray);
    border-color: var(--gray-light);
  }
  .action-btn.favorited {
    background: var(--yellow-soft);
    color: var(--yellow);
    border-color: var(--yellow-light);
  }

  .daily-pick {
    background: linear-gradient(135deg, var(--accent-soft), var(--paper-dark));
    border: 1.5px solid var(--accent-light);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 16px;
    text-align: center;
  }
  .daily-pick-label {
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 8px;
  }
  .daily-pick-text {
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink);
    font-weight: 500;
  }

  .nav-btns {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .btn-primary {
    flex: 1;
    padding: 12px;
    border-radius: var(--radius-md);
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-primary:active { transform: scale(0.97); opacity: 0.9; }
  .btn-secondary {
    flex: 1;
    padding: 12px;
    border-radius: var(--radius-md);
    background: var(--card-bg);
    color: var(--ink);
    border: 1px solid var(--paper-line);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-secondary:active { transform: scale(0.97); background: var(--paper-line); }

  /* ===== FAVORITES PAGE ===== */
  .fav-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-muted);
  }
  .fav-empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

  /* ===== SUBMIT PAGE ===== */
  .submit-form {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 16px;
  }
  .form-label {
    font-size: 13px;
    color: var(--ink-light);
    margin-bottom: 8px;
    display: block;
  }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--paper-line);
    background: var(--paper);
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 12px;
    outline: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent-light); }
  .form-textarea { min-height: 100px; resize: vertical; }
  .form-select { cursor: pointer; }

  .pending-list { display: flex; flex-direction: column; gap: 10px; }
  .pending-item {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius-md);
    padding: 12px;
    font-size: 14px;
    color: var(--ink-light);
  }
  .pending-status {
    font-size: 11px;
    color: var(--accent);
    margin-top: 6px;
  }

  /* Share overlay */
  .share-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 150;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .share-overlay.active { display: flex; }
  .share-card {
    background: var(--card-bg);
    border-radius: var(--radius-xl);
    padding: 20px;
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .share-canvas-wrap {
    border-radius: var(--radius-md);
    overflow: hidden;
    margin-bottom: 16px;
    background: var(--paper);
  }
  .share-canvas-wrap canvas {
    width: 100%;
    display: block;
  }
  .share-btns {
    display: flex;
    gap: 10px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 20px;
    border-radius: var(--radius-md);
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Like animation */
  @keyframes likePop {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  .like-anim { animation: likePop 0.3s ease; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--paper-line); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <button class="back-btn" onclick="window.location.href='../niujiu-demo-final.html'">&#8592;</button>
    <div class="header-title handwriting">职场段子手</div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">&#9788;</button>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('feed')">每日一笑</div>
    <div class="tab" onclick="switchTab('favorites')">收藏</div>
    <div class="tab" onclick="switchTab('submit')">投稿</div>
  </div>

  <!-- Feed Page -->
  <div class="page active" id="page-feed">
    <div class="daily-pick" id="dailyPick">
      <div class="daily-pick-label">&#11088; 今日推荐</div>
      <div class="daily-pick-text" id="dailyPickText">加载中...</div>
    </div>

    <div class="category-bar" id="categoryBar">
      <span class="category-pill active" data-cat="all" onclick="filterCat('all')">全部</span>
      <span class="category-pill" data-cat="boss" onclick="filterCat('boss')">老板语录</span>
      <span class="category-pill" data-cat="colleague" onclick="filterCat('colleague')">同事迷惑</span>
      <span class="category-pill" data-cat="interview" onclick="filterCat('interview')">面试奇遇</span>
      <span class="category-pill" data-cat="overtime" onclick="filterCat('overtime')">加班文化</span>
      <span class="category-pill" data-cat="salary" onclick="filterCat('salary')">薪资秘密</span>
    </div>

    <div id="feedList"></div>

    <div class="nav-btns">
      <button class="btn-secondary" onclick="randomAnecdote()">&#127922; 随机一个</button>
      <button class="btn-primary" onclick="nextAnecdote()">下一个 &#8594;</button>
    </div>
  </div>

  <!-- Favorites Page -->
  <div class="page" id="page-favorites">
    <div id="favList">
      <div class="fav-empty">
        <div class="fav-empty-icon">&#128150;</div>
        <p>还没有收藏任何段子</p>
      </div>
    </div>
  </div>

  <!-- Submit Page -->
  <div class="page" id="page-submit">
    <div class="submit-form">
      <label class="form-label">选择分类</label>
      <select class="form-select" id="submitCat">
        <option value="boss">老板语录</option>
        <option value="colleague">同事迷惑行为</option>
        <option value="interview">面试奇遇</option>
        <option value="overtime">加班文化</option>
        <option value="salary">薪资秘密</option>
      </select>
      <label class="form-label">你的段子</label>
      <textarea class="form-textarea" id="submitText" placeholder="写下你的职场段子或吐槽..."></textarea>
      <label class="form-label">署名（可选）</label>
      <input type="text" class="form-input" id="submitAuthor" placeholder="匿名网友">
      <button class="btn-primary" onclick="submitAnecdote()">提交审核</button>
    </div>
    <div class="insight-title" style="font-size:14px;font-weight:500;margin-bottom:10px;color:var(--ink);">&#128220; 我的投稿</div>
    <div class="pending-list" id="pendingList">
      <div class="pending-item">暂无投稿</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<!-- Share Overlay -->
<div class="share-overlay" id="shareOverlay" onclick="closeShare(event)">
  <div class="share-card" onclick="event.stopPropagation()">
    <div class="share-canvas-wrap">
      <canvas id="shareCanvas" width="600" height="400"></canvas>
    </div>
    <div class="share-btns">
      <button class="btn-secondary" onclick="closeShare()">关闭</button>
      <button class="btn-primary" onclick="downloadShare()">保存图片</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  const STORAGE_KEY = 'niujiu_work_anecdote';
  const anecdotes = [
    { id: 1, cat: 'boss', text: '老板：我们要把公司当成家。\n我：那我可以随便躺沙发上吗？\n老板：不行。\n我：那这还是我家吗？', author: '打工人小王', likes: 342, dislikes: 12 },
    { id: 2, cat: 'boss', text: '老板开会：我们的目标是三年内上市！\n三年后，公司成功上了"失信名单"。', author: '职场老油条', likes: 567, dislikes: 23 },
    { id: 3, cat: 'boss', text: '老板：年轻人不要只看钱，要看成长。\n我：那您把工资给我，您拿成长？', author: '匿名', likes: 891, dislikes: 45 },
    { id: 4, cat: 'boss', text: '"公司不提倡加班"——但老板每天晚上十点在群里发消息。', author: '加班狗', likes: 445, dislikes: 18 },
    { id: 5, cat: 'boss', text: '老板：这个项目很简单，几天就能做完。\n三个月后，老板：怎么还没做完？\n我：您说的"几天"是指火星日吗？', author: '程序员阿强', likes: 678, dislikes: 21 },
    { id: 6, cat: 'colleague', text: '同事：你帮我看看这个bug。\n我：这是你自己写的注释"此处有坑，勿动"。\n同事：所以我才找你啊。', author: '码农小李', likes: 234, dislikes: 8 },
    { id: 7, cat: 'colleague', text: '新同事第一天：请大家多多关照！\n一个月后：这个我不会，那个我也不懂，但我工资比你高。', author: '老员工', likes: 556, dislikes: 34 },
    { id: 8, cat: 'colleague', text: '同事在工位上煮火锅，被HR约谈。\n同事：我这是团建。\nHR：一个人团建？\n同事：我和我自己和解了。', author: '吃货小张', likes: 334, dislikes: 15 },
    { id: 9, cat: 'colleague', text: '同事每天带饭，菜色丰富得像米其林。\n我：你女朋友做的？\n同事：我自己做的。\n我：那你男朋友真有福气。\n同事：我就是我男朋友。', author: '独身贵族', likes: 445, dislikes: 56 },
    { id: 10, cat: 'colleague', text: '同事请假理由：家里狗抑郁了，需要陪伴。\n老板批了。\n第二天我也说我家猫焦虑，老板：你猫有医保吗？', author: '铲屎官', likes: 223, dislikes: 9 },
    { id: 11, cat: 'interview', text: '面试官：你有什么缺点？\n我：诚实。\n面试官：我不觉得这是缺点。\n我：我也不觉得。', author: '面试达人', likes: 889, dislikes: 12 },
    { id: 12, cat: 'interview', text: 'HR：你期望薪资多少？\n我：根据贵司的薪资结构来定。\nHR：我们薪资结构是"底薪+梦想"。\n我：那我的梦想是月薪三万。', author: '求职者', likes: 667, dislikes: 28 },
    { id: 13, cat: 'interview', text: '面试官：你为什么从上家公司离职？\n我：因为公司倒闭了。\n面试官：那如果我们也倒闭了呢？\n我：那我会再换一家，反正习惯了。', author: '职场锦鲤', likes: 445, dislikes: 22 },
    { id: 14, cat: 'interview', text: '面试最后，HR说：你回去等通知吧。\n我：好的，那我明天来上班。\nHR：？？？\n我：反正你们肯定会要我的。', author: '自信哥', likes: 334, dislikes: 45 },
    { id: 15, cat: 'interview', text: '面试官：你会加班吗？\n我：会，但加班费怎么算？\n面试官：我们讲奉献。\n我：那我也讲讲劳动法。', author: '法律爱好者', likes: 778, dislikes: 67 },
    { id: 16, cat: 'overtime', text: '公司标语：今天工作不努力，明天努力找工作。\n我翻译：今天不加班，明天就滚蛋。', author: '翻译官', likes: 556, dislikes: 23 },
    { id: 17, cat: 'overtime', text: '加班到深夜，打车回家。\n司机：这么晚才下班？\n我：嗯。\n司机：做什么工作的？\n我：做牛做马。\n司机：这行这么卷？', author: '夜归人', likes: 445, dislikes: 18 },
    { id: 18, cat: 'overtime', text: '凌晨两点，公司群里老板@所有人：大家辛苦了！\n没人回。\n老板：？\n我（睡眼惺忪）：老板您也辛苦了，这么晚还在钓鱼。', author: '熬夜冠军', likes: 667, dislikes: 89 },
    { id: 19, cat: 'overtime', text: '"弹性工作制"——弹到晚上十点才能走。', author: '弹性人', likes: 334, dislikes: 12 },
    { id: 20, cat: 'overtime', text: '同事：你周末干嘛？\n我：加班。\n同事：那法定节假日呢？\n我：法定加班日。', author: '全年无休', likes: 223, dislikes: 8 },
    { id: 21, cat: 'salary', text: '老板：今年公司效益不好，大家理解一下。\n我：理解。\n第二天看到老板换了辆保时捷。\n我：理解不了。', author: '眼尖员工', likes: 889, dislikes: 45 },
    { id: 22, cat: 'salary', text: 'HR：你的绩效是C，所以年终奖只有半个月。\n我：那我绩效B的同事呢？\nHR：他们一个月。\n我：A呢？\nHR：A已经离职了。', author: '绩效达人', likes: 556, dislikes: 34 },
    { id: 23, cat: 'salary', text: '月薪三千，要求有五年经验。\n我：我五年经验就值三千？\nHR：不，你五年经验才能接受三千。', author: '经验过剩', likes: 778, dislikes: 56 },
    { id: 24, cat: 'salary', text: '工资条上的"其他补贴"一栏，永远是0。\n我：这个"其他"是指我的存在吗？', author: '会计小刘', likes: 334, dislikes: 15 },
    { id: 25, cat: 'salary', text: '老板说：明年给你涨薪。\n明年：老板调走了。\n新老板：谁承诺的找谁。', author: '接盘侠', likes: 445, dislikes: 22 },
    { id: 26, cat: 'boss', text: '老板：我们要打造狼性团队！\n我：那给肉吃吗？\n老板：给饼。\n我：狼不吃饼。\n老板：那就做哈士奇。', author: '动物学家', likes: 667, dislikes: 34 },
    { id: 27, cat: 'boss', text: '"扁平化管理"——老板直接骂到你，没有中间商赚差价。', author: '扁平人', likes: 445, dislikes: 19 },
    { id: 28, cat: 'boss', text: '老板：你这个人很佛系啊。\n我：不是佛系，是工资佛系，我跟着工资走。', author: '佛系青年', likes: 556, dislikes: 23 },
    { id: 29, cat: 'boss', text: '年会抽奖，特等奖是"与老板共进晚餐"。\n我：我可以换成三等奖的电饭煲吗？', author: '务实派', likes: 334, dislikes: 12 },
    { id: 30, cat: 'boss', text: '老板：你要有主人翁意识！\n我：那我能分股份吗？\n老板：意识要有，股份没有。', author: '股东梦', likes: 778, dislikes: 45 },
    { id: 31, cat: 'colleague', text: '同事每天准时下班，被领导约谈。\n领导：你工作不饱和啊。\n同事：我效率高。\n领导：那你帮别人做一点。\n同事：那是另外的价钱。', author: '效率王', likes: 445, dislikes: 28 },
    { id: 32, cat: 'colleague', text: '同事把"收到"设置成了自动回复。\n老板：来我办公室一趟。\n同事（自动）：收到。\n老板：现在。\n同事（自动）：收到。', author: '自动化工', likes: 556, dislikes: 34 },
    { id: 33, cat: 'colleague', text: '办公室政治：A说B坏话，B说C坏话，C说A坏话。\n我：你们仨建个群吧，别带我。', author: '吃瓜群众', likes: 334, dislikes: 15 },
    { id: 34, cat: 'colleague', text: '同事离职请吃饭，大家依依不舍。\n一周后，同事在新公司发了朋友圈：工资翻倍，不用加班。\n大家：散了吧。', author: '人间真实', likes: 667, dislikes: 45 },
    { id: 35, cat: 'colleague', text: '同事：你周末一般干嘛？\n我：睡觉。\n同事：不出去玩？\n我：上班已经够累了，周末要用来恢复上班受的伤。', author: '疗伤中', likes: 445, dislikes: 22 },
    { id: 36, cat: 'interview', text: '面试官：你最大的成就是什么？\n我：活到了现在。\n面试官：...\n我：在这个行业，这确实是成就。', author: '幸存者', likes: 778, dislikes: 56 },
    { id: 37, cat: 'interview', text: 'HR：你能接受出差吗？\n我：能，但报销要及时。\nHR：这个...\n我：那我不能。', author: '现实主义者', likes: 556, dislikes: 23 },
    { id: 38, cat: 'interview', text: '面试官：你对加班怎么看？\n我：看加班费。\n面试官：如果没有加班费呢？\n我：那我看都不看。', author: '视力保护者', likes: 889, dislikes: 67 },
    { id: 39, cat: 'interview', text: '面试题：如何把冰箱卖给爱斯基摩人？\n我：我不卖，这是诈骗。\n面试官：你被录用了，我们需要有良知的人。', author: '良心发现', likes: 445, dislikes: 34 },
    { id: 40, cat: 'interview', text: 'HR：你上份工作为什么只做了三个月？\n我：因为三个月足够我看清一家公司了。', author: '快准狠', likes: 667, dislikes: 45 },
    { id: 41, cat: 'overtime', text: '996是福报——那007是不是成仙？', author: '修仙党', likes: 889, dislikes: 123 },
    { id: 42, cat: 'overtime', text: '公司说：我们从来不强制加班。\n但你的KPI不加班根本完不成。\n这叫"自愿加班"，懂？', author: '自愿者', likes: 556, dislikes: 34 },
    { id: 43, cat: 'overtime', text: '凌晨的办公室，我和保洁阿姨相视一笑。\n阿姨：你也刚下班？\n我：不，我刚来。\n阿姨：...你们公司还招人吗？', author: '夜班王', likes: 445, dislikes: 22 },
    { id: 44, cat: 'overtime', text: '"大小周"——大周加班，小周也加班。', author: '周周乐', likes: 334, dislikes: 18 },
    { id: 45, cat: 'overtime', text: '同事问我：你怎么每天看起来都很累？\n我：因为我每天都在假装不累。', author: '演员', likes: 556, dislikes: 34 },
    { id: 46, cat: 'salary', text: '税前一万，税后七千，房租三千，吃饭两千。\n我：我上班是为了体验生活？', author: '体验派', likes: 778, dislikes: 56 },
    { id: 47, cat: 'salary', text: '老板说：公司就像一艘船，大家要同舟共济。\n我：那船沉了您先走，因为您有救生艇（股权）。', author: '船员', likes: 667, dislikes: 45 },
    { id: 48, cat: 'salary', text: '涨薪通知：经公司研究决定，您的薪资调整至...\n我激动地点开。\n"调整至与上月持平"。', author: '激动早了', likes: 445, dislikes: 34 },
    { id: 49, cat: 'salary', text: '十三薪——第十二个月发一半，说另一半是"年终奖"。\n年终奖：一个苹果。\n真苹果。', author: '水果爱好者', likes: 556, dislikes: 45 },
    { id: 50, cat: 'salary', text: '工资条上"代扣代缴"比"应发"还长。', author: '纳税人', likes: 334, dislikes: 22 },
    { id: 51, cat: 'boss', text: '老板：你要跳出舒适圈。\n我：我舒适圈里有空调和WiFi，我不想跳。', author: '舒适派', likes: 778, dislikes: 34 },
    { id: 52, cat: 'boss', text: '老板：这个需求很简单。\n我：那您自己做？\n老板：我要是会做还要你？\n我：那您怎么知道简单？', author: '逻辑鬼才', likes: 667, dislikes: 28 },
    { id: 53, cat: 'boss', text: '"年轻人要多吃苦"——老板开着奔驰说。', author: '吃苦中', likes: 889, dislikes: 67 },
    { id: 54, cat: 'boss', text: '老板：我当年也是这么过来的。\n我：您当年房价多少？\n老板：...好好干活。', author: '历史课代表', likes: 556, dislikes: 34 },
    { id: 55, cat: 'boss', text: '团建通知：周六早上七点公司集合。\n我：这是团建还是军训？\n老板：都是为了增强凝聚力。\n我：凝聚力不能在工作日增强吗？', author: '凝聚力', likes: 445, dislikes: 23 },
    { id: 56, cat: 'colleague', text: '同事结婚发请柬，全部门都收到了。\n一个月后离婚，又发了一遍。\n同事：上次没来的这次补上。', author: '礼尚往来', likes: 334, dislikes: 45 },
    { id: 57, cat: 'colleague', text: '办公室最忙的人：打印机。\n因为它要印所有人的辞职信。', author: '打印机', likes: 556, dislikes: 34 },
    { id: 58, cat: 'colleague', text: '同事：你信星座吗？\n我：信。\n同事：你什么座？\n我：打工座。\n同事：...没听过。\n我： newly discovered. ', author: '天文学家', likes: 445, dislikes: 22 },
    { id: 59, cat: 'colleague', text: '同事把微信名改成了"正在输入中..."。\n老板找他永远显示正在输入，但从不回复。', author: '输入中', likes: 667, dislikes: 56 },
    { id: 60, cat: 'colleague', text: '办公室恋情：两个人偷偷谈恋爱，全公司都知道，就他们以为藏得很好。', author: '旁观者', likes: 334, dislikes: 18 },
    { id: 61, cat: 'interview', text: '面试官：你有什么问题问我吗？\n我：贵司去年裁员了吗？\n面试官：...下一个问题。', author: '直击灵魂', likes: 778, dislikes: 45 },
    { id: 62, cat: 'interview', text: 'HR：我们需要能快速融入团队的人。\n我：我融入得很快，离职也快。', author: '快闪族', likes: 556, dislikes: 34 },
    { id: 63, cat: 'interview', text: '面试官：描述一下你的抗压能力。\n我：我现在就在抗压，因为我在面试。', author: '现场演示', likes: 445, dislikes: 28 },
    { id: 64, cat: 'interview', text: '面试结束，HR说：我们会综合考虑。\n我：综合考虑的意思是不要我对吧？\nHR：...我们会尽快通知您。', author: '读心术', likes: 667, dislikes: 45 },
    { id: 65, cat: 'interview', text: '面试官：你觉得自己最大的优点是什么？\n我：便宜。\n面试官：...\n我：而且好用。\n面试官：明天来上班。', author: '性价比', likes: 889, dislikes: 78 },
    { id: 66, cat: 'overtime', text: '我的工作时间：朝九晚不确定。', author: '不确定', likes: 556, dislikes: 23 },
    { id: 67, cat: 'overtime', text: '加班餐补20块，但加班到十点才能领。\n为了这20块，我多花50块打车。\n数学鬼才。', author: '数学家', likes: 445, dislikes: 34 },
    { id: 68, cat: 'overtime', text: '公司说：我们鼓励高效工作，不鼓励加班。\n然后布置了三天的工作量要求一天做完。', author: '高效人', likes: 667, dislikes: 45 },
    { id: 69, cat: 'overtime', text: '深夜加班，保安大叔来锁门。\n大叔：又是你？\n我：嗯。\n大叔：我记住你了，因为你总是最后一个。\n我：那您能帮我打卡吗？', author: '刷脸失败', likes: 334, dislikes: 22 },
    { id: 70, cat: 'overtime', text: '"调休"——加班攒的假，永远没机会休。', author: '调休收藏家', likes: 556, dislikes: 34 },
    { id: 71, cat: 'salary', text: '工资就像大姨妈：一个月一次，一周左右就没了。', author: '生理周期', likes: 889, dislikes: 123 },
    { id: 72, cat: 'salary', text: '老板：今年公司业绩翻倍，大家奖金翻倍！\n我激动地问：那我的奖金呢？\n老板：你去年是0，翻倍还是0。', author: '数学老师', likes: 667, dislikes: 56 },
    { id: 73, cat: 'salary', text: '同事问我工资多少，我说：不到十万。\n其实不到一万也是不到十万。', author: '语言艺术', likes: 445, dislikes: 34 },
    { id: 74, cat: 'salary', text: '社保基数按最低标准交，但HR说：这是为你好，到手多一点。\n我：那退休金呢？\nHR：到时候再说。', author: '长远规划', likes: 556, dislikes: 45 },
    { id: 75, cat: 'salary', text: '年终奖发了一箱橙子。\n我：这橙子多少钱一斤？\nHR：这是心意，不要谈钱。\n我：那我能把它换成钱吗？', author: '橙子爱好者', likes: 334, dislikes: 28 },
    { id: 76, cat: 'boss', text: '老板说：要有格局。\n我：格局能当饭吃吗？\n老板：不能，但能让我少发工资。', author: '格局打开', likes: 778, dislikes: 56 },
    { id: 77, cat: 'boss', text: '老板：这个项目是锻炼你的机会。\n我：那能加钱吗？\n老板：机会比钱重要。\n我：那您把机会给我，钱给您？', author: '机会主义者', likes: 556, dislikes: 34 },
    { id: 78, cat: 'boss', text: '"结果导向"——不管过程多惨，只要结果好就行。\n结果不好：过程怎么做的？', author: '导向人', likes: 445, dislikes: 23 },
    { id: 79, cat: 'boss', text: '老板：你要有创业心态。\n我：那我能拿创业的分成吗？\n老板：不能，但你可以有创业的风险承担能力。', author: '心态好', likes: 667, dislikes: 45 },
    { id: 80, cat: 'boss', text: '年度总结会上，老板说：今年大家辛苦了。\n然后发了每人一张"辛苦奖"——A4纸打印的奖状。', author: '奖状收藏家', likes: 334, dislikes: 45 },
    { id: 81, cat: 'colleague', text: '同事每天带不同的包，我以为她很有钱。\n后来才知道是A货，而且全是拼夕夕买的。\n我：那也挺有钱啊，能买这么多。', author: '包治百病', likes: 556, dislikes: 34 },
    { id: 82, cat: 'colleague', text: '办公室饮水机没水了，大家互相观望。\n最后新来的实习生换了。\n我：这就是职场潜规则。', author: '潜规则', likes: 445, dislikes: 28 },
    { id: 83, cat: 'colleague', text: '同事请假说去相亲，结果在商场偶遇他和另一个同事。\n两个人都请假说去相亲。\n他们相到彼此了？', author: '缘分', likes: 667, dislikes: 56 },
    { id: 84, cat: 'colleague', text: '同事把"离职倒计时"设成了电脑桌面。\n老板经过看到了，说：还有30天？那这30天好好干。\n同事：不，是30分钟。', author: '倒计时', likes: 889, dislikes: 78 },
    { id: 85, cat: 'colleague', text: '办公室最尴尬的事：在厕所隔间听到同事说你的坏话。\n更尴尬的是：你冲水的时候他们听到了。', author: '厕所情报', likes: 445, dislikes: 34 },
    { id: 86, cat: 'interview', text: '面试官：你对我们公司了解多少？\n我：了解不多，但贵司的负面新闻我倒是看了不少。', author: '调研充分', likes: 778, dislikes: 89 },
    { id: 87, cat: 'interview', text: 'HR：你能接受底薪+提成吗？\n我：提成比例多少？\nHR：1%。\n我：那我还是接受底薪吧。', author: '数学家', likes: 556, dislikes: 34 },
    { id: 88, cat: 'interview', text: '面试官：你的职业规划是什么？\n我：先活着。\n面试官：然后呢？\n我：继续活着。', author: '生存专家', likes: 667, dislikes: 45 },
    { id: 89, cat: 'interview', text: '面试被问：你最大的失败经历是什么？\n我：来面试这家公司。\n面试官：...你被录用了，我们需要有幽默感的人。', author: '幽默大师', likes: 445, dislikes: 56 },
    { id: 90, cat: 'interview', text: 'HR：我们需要能抗压的人。\n我：我抗压，但我不抗骗。\nHR：什么意思？\n我：就是别画饼。', author: '抗骗专家', likes: 889, dislikes: 67 },
    { id: 91, cat: 'overtime', text: '我的下班时间取决于老板什么时候走。\n老板不走，我不敢走。\n老板走了，我还不敢走，因为可能还有活。', author: '下班困难户', likes: 556, dislikes: 34 },
    { id: 92, cat: 'overtime', text: '"周末双休"——周六加班，周日休息，但周日要回工作消息。\n所以是0.5休。', author: '数学家', likes: 445, dislikes: 28 },
    { id: 93, cat: 'overtime', text: '加班到十一点，终于做完了。\n发给老板，老板秒回：收到，明天早上九点前给我最终版。\n我：这不就是最终版吗？\n老板：再改改。', author: '改改党', likes: 667, dislikes: 56 },
    { id: 94, cat: 'overtime', text: '公司说：我们提供免费的晚餐和夜宵。\n我：那早餐呢？\n公司：早餐你在家吃啊。\n我：可我加班到早上。', author: '夜宵达人', likes: 334, dislikes: 22 },
    { id: 95, cat: 'overtime', text: '连续加班一周，周末终于休息了。\n周六早上七点，自然醒。\n因为生物钟已经习惯了。', author: '生物钟', likes: 556, dislikes: 45 },
    { id: 96, cat: 'salary', text: '月薪三千，招聘要求：985硕士，五年经验，能独立带团队。\n我：这是招CEO吗？\nHR：不，招实习生。', author: 'CEO梦', likes: 889, dislikes: 78 },
    { id: 97, cat: 'salary', text: '老板说：钱不是最重要的，重要的是成长。\n我：那您把工资给我，您拿成长？\n老板：你怎么老说这句话？\n我：因为好使。', author: '复读机', likes: 556, dislikes: 34 },
    { id: 98, cat: 'salary', text: '公积金按最低基数交，但HR说：买房可以提取。\n我：这点公积金能买什么？\nHR：买根油条。', author: '买房专家', likes: 445, dislikes: 45 },
    { id: 99, cat: 'salary', text: '工资发下来，先还花呗，再还信用卡，然后交房租。\n最后剩下50块。\n我：这50块是我这个月的生活费？\n不，是下个月的花呗首付。', author: '月光族', likes: 667, dislikes: 89 },
    { id: 100, cat: 'salary', text: '老板说：公司上市了大家都有股份。\n十年后，公司上了新三板。\n我的股份值：一顿火锅。', author: '股东', likes: 778, dislikes: 56 },
    { id: 101, cat: 'boss', text: '老板说：你要有全局观。\n我：全局观能看到工资条上的数字变大吗？\n老板：...能看到公司的发展。\n我：那公司发展好了能给我涨工资吗？\n老板：下次开会讨论。', author: '讨论中', likes: 445, dislikes: 34 },
    { id: 102, cat: 'colleague', text: '同事把钉钉头像改成了"已离职"。\n老板找他的时候总是犹豫一下。', author: '头像党', likes: 334, dislikes: 22 },
    { id: 103, cat: 'interview', text: '面试官：你对我们行业有什么见解？\n我：我觉得贵司的竞品都比贵司强。\n面试官：...你说得对。', author: '诚实者', likes: 556, dislikes: 45 },
    { id: 104, cat: 'overtime', text: '加班文化：谁先走谁就是不努力。\n所以我学会了"表演式加班"——灯开着，人不在。', author: '表演系', likes: 667, dislikes: 78 },
    { id: 105, cat: 'salary', text: '谈薪时HR说：我们每年有两次调薪机会。\n入职后发现：两次都是"不调薪的机会"。', author: '机会主义者', likes: 889, dislikes: 56 }
  ];

  let state = {
    currentIdx: 0,
    category: 'all',
    liked: new Set(),
    disliked: new Set(),
    favorites: new Set(),
    pending: [],
    filtered: []
  };

  function init() {
    loadState();
    applyTheme();
    setDailyPick();
    filterCat('all');
    renderPending();
  }

  function applyTheme() {
    const saved = localStorage.getItem('niujiu_theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (saved === 'dark' || (!saved && prefersDark)) {
      document.documentElement.classList.add('dark-mode');
      document.getElementById('themeBtn').textContent = '\u263E';
    } else {
      document.documentElement.classList.remove('dark-mode');
      document.getElementById('themeBtn').textContent = '\u263C';
    }
  }
  window.toggleTheme = function() {
    const isDark = document.documentElement.classList.toggle('dark-mode');
    localStorage.setItem('niujiu_theme', isDark ? 'dark' : 'light');
    document.getElementById('themeBtn').textContent = isDark ? '\u263E' : '\u263C';
  };

  window.switchTab = function(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('page-' + name).classList.add('active');
    if (name === 'favorites') renderFavorites();
    if (name === 'submit') renderPending();
  };

  /* ===== Daily Pick ===== */
  function setDailyPick() {
    const day = new Date().getDate();
    const idx = day % anecdotes.length;
    const a = anecdotes[idx];
    document.getElementById('dailyPickText').textContent = a.text.replace(/\n/g, ' ');
  }

  /* ===== Filter & Feed ===== */
  window.filterCat = function(cat) {
    state.category = cat;
    document.querySelectorAll('.category-pill').forEach(p => {
      p.classList.toggle('active', p.dataset.cat === cat);
    });
    state.filtered = cat === 'all' ? [...anecdotes] : anecdotes.filter(a => a.cat === cat);
    state.currentIdx = 0;
    renderFeed();
  };

  function renderFeed() {
    const container = document.getElementById('feedList');
    if (state.filtered.length === 0) {
      container.innerHTML = '<div class="fav-empty"><p>该分类暂无段子</p></div>';
      return;
    }
    const a = state.filtered[state.currentIdx];
    const isLiked = state.liked.has(a.id);
    const isDisliked = state.disliked.has(a.id);
    const isFav = state.favorites.has(a.id);
    const catNames = { boss: '老板语录', colleague: '同事迷惑', interview: '面试奇遇', overtime: '加班文化', salary: '薪资秘密' };
    container.innerHTML = `
      <div class="anecdote-card">
        <span class="anecdote-badge">${catNames[a.cat] || '职场段子'}</span>
        <div class="anecdote-text">${escapeHtml(a.text).replace(/\n/g, '<br>')}</div>
        <div class="anecdote-source">—— ${escapeHtml(a.author)}</div>
        <div class="anecdote-actions">
          <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="likeAnecdote(${a.id}, this)">
            <span>${isLiked ? '&#128293;' : '&#128077;'}</span>
            <span>${a.likes + (isLiked ? 1 : 0)}</span>
          </button>
          <button class="action-btn ${isDisliked ? 'disliked' : ''}" onclick="dislikeAnecdote(${a.id}, this)">
            <span>&#128078;</span>
            <span>${a.dislikes + (isDisliked ? 1 : 0)}</span>
          </button>
          <button class="action-btn ${isFav ? 'favorited' : ''}" onclick="favoriteAnecdote(${a.id}, this)">
            <span>${isFav ? '&#128150;' : '&#9825;'}</span>
            <span>收藏</span>
          </button>
          <button class="action-btn" onclick="shareAnecdote(${a.id})">
            <span>&#128228;</span>
            <span>分享</span>
          </button>
        </div>
      </div>
    `;
  }

  window.nextAnecdote = function() {
    state.currentIdx = (state.currentIdx + 1) % state.filtered.length;
    renderFeed();
  };

  window.randomAnecdote = function() {
    state.currentIdx = Math.floor(Math.random() * state.filtered.length);
    renderFeed();
  };

  window.likeAnecdote = function(id, btn) {
    if (state.liked.has(id)) {
      state.liked.delete(id);
    } else {
      state.liked.add(id);
      state.disliked.delete(id);
      btn.classList.add('like-anim');
      setTimeout(() => btn.classList.remove('like-anim'), 300);
    }
    saveState();
    renderFeed();
  };

  window.dislikeAnecdote = function(id, btn) {
    if (state.disliked.has(id)) {
      state.disliked.delete(id);
    } else {
      state.disliked.add(id);
      state.liked.delete(id);
    }
    saveState();
    renderFeed();
  };

  window.favoriteAnecdote = function(id, btn) {
    if (state.favorites.has(id)) {
      state.favorites.delete(id);
      showToast('已取消收藏');
    } else {
      state.favorites.add(id);
      btn.classList.add('like-anim');
      setTimeout(() => btn.classList.remove('like-anim'), 300);
      showToast('已收藏');
    }
    saveState();
    renderFeed();
  };

  /* ===== Share ===== */
  window.shareAnecdote = function(id) {
    const a = anecdotes.find(x => x.id === id);
    if (!a) return;
    const canvas = document.getElementById('shareCanvas');
    const ctx = canvas.getContext('2d');
    const isDark = document.documentElement.classList.contains('dark-mode');
    const bg = isDark ? '#222244' : '#FFFDF9';
    const textColor = isDark ? '#E8E6E3' : '#3D3229';
    const accent = isDark ? '#E8A060' : '#D4834A';
    const subColor = isDark ? '#7A7670' : '#A89B8C';

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, 600, 400);

    // Border
    ctx.strokeStyle = accent;
    ctx.lineWidth = 4;
    ctx.strokeRect(8, 8, 584, 384);

    // Title
    ctx.fillStyle = accent;
    ctx.font = 'bold 24px "ZCOOL KuaiLe", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('牛马自救指南 · 职场段子', 300, 50);

    // Text
    ctx.fillStyle = textColor;
    ctx.font = '22px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'left';
    const lines = wrapText(ctx, a.text, 500, 280);
    let y = 100;
    lines.forEach(line => {
      ctx.fillText(line, 50, y);
      y += 34;
    });

    // Author
    ctx.fillStyle = subColor;
    ctx.font = '16px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('—— ' + a.author, 550, 340);

    // Footer
    ctx.fillStyle = accent;
    ctx.font = '14px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('扫码查看更多职场段子', 300, 375);

    document.getElementById('shareOverlay').classList.add('active');
  };

  function wrapText(ctx, text, maxWidth, x) {
    const words = text.split('');
    const lines = [];
    let line = '';
    for (let i = 0; i < words.length; i++) {
      const testLine = line + words[i];
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && line !== '') {
        lines.push(line);
        line = words[i];
      } else {
        line = testLine;
      }
    }
    lines.push(line);
    return lines;
  }

  window.closeShare = function(e) {
    if (!e || e.target === document.getElementById('shareOverlay')) {
      document.getElementById('shareOverlay').classList.remove('active');
    }
  };

  window.downloadShare = function() {
    const canvas = document.getElementById('shareCanvas');
    const link = document.createElement('a');
    link.download = 'niujiu-anecdote.png';
    link.href = canvas.toDataURL();
    link.click();
    showToast('图片已保存');
  };

  /* ===== Favorites ===== */
  function renderFavorites() {
    const container = document.getElementById('favList');
    if (state.favorites.size === 0) {
      container.innerHTML = '<div class="fav-empty"><div class="fav-empty-icon">&#128150;</div><p>还没有收藏任何段子</p></div>';
      return;
    }
    const favs = anecdotes.filter(a => state.favorites.has(a.id));
    container.innerHTML = favs.map(a => {
      const catNames = { boss: '老板语录', colleague: '同事迷惑', interview: '面试奇遇', overtime: '加班文化', salary: '薪资秘密' };
      return `
        <div class="anecdote-card">
          <span class="anecdote-badge">${catNames[a.cat] || '职场段子'}</span>
          <div class="anecdote-text">${escapeHtml(a.text).replace(/\n/g, '<br>')}</div>
          <div class="anecdote-source">—— ${escapeHtml(a.author)}</div>
          <div class="anecdote-actions">
            <button class="action-btn favorited" onclick="favoriteAnecdote(${a.id}, this)">
              <span>&#128150;</span><span>已收藏</span>
            </button>
            <button class="action-btn" onclick="shareAnecdote(${a.id})">
              <span>&#128228;</span><span>分享</span>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  /* ===== Submit ===== */
  window.submitAnecdote = function() {
    const cat = document.getElementById('submitCat').value;
    const text = document.getElementById('submitText').value.trim();
    const author = document.getElementById('submitAuthor').value.trim() || '匿名网友';
    if (!text) { showToast('请输入段子内容'); return; }
    if (text.length < 10) { showToast('段子太短啦，再多写点'); return; }
    state.pending.unshift({ cat, text, author, time: new Date().toLocaleString('zh-CN'), status: '审核中' });
    saveState();
    document.getElementById('submitText').value = '';
    document.getElementById('submitAuthor').value = '';
    renderPending();
    showToast('投稿成功，审核通过后将展示');
  };

  function renderPending() {
    const container = document.getElementById('pendingList');
    if (state.pending.length === 0) {
      container.innerHTML = '<div class="pending-item">暂无投稿</div>';
      return;
    }
    container.innerHTML = state.pending.map(p => `
      <div class="pending-item">
        <div>${escapeHtml(p.text).substring(0, 60)}${p.text.length > 60 ? '...' : ''}</div>
        <div class="pending-status">${p.status} · ${p.time}</div>
      </div>
    `).join('');
  }

  /* ===== Storage ===== */
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        if (saved.liked) state.liked = new Set(saved.liked);
        if (saved.disliked) state.disliked = new Set(saved.disliked);
        if (saved.favorites) state.favorites = new Set(saved.favorites);
        if (saved.pending) state.pending = saved.pending;
      }
    } catch(e) {}
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      liked: Array.from(state.liked),
      disliked: Array.from(state.disliked),
      favorites: Array.from(state.favorites),
      pending: state.pending
    }));
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  init();
})();

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>
</body>
</html>
