<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="牛马自救指南 - 专注番茄钟，25分钟高效专注，告别拖延">
<title>牛马自救指南 · 专注番茄钟</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  :root {
    --paper: #FDF8F0;
    --ink: #2D2A24;
    --ink-muted: #7A7670;
    --accent: #D4834A;
    --accent-light: #E8A87C;
    --accent-soft: #F5D5C0;
    --card-bg: #FFFBF5;
    --shadow: rgba(45,42,36,0.08);
    --shadow-md: rgba(45,42,36,0.12);
    --radius: 16px;
    --transition: 0.3s ease;
    --focus: #7BA68A;
    --focus-light: #A8D4B0;
    --focus-soft: #D4EAD8;
    --break: #7BAED4;
    --break-light: #A8D0F0;
    --break-soft: #D4EAFA;
    --dark-bg: #1A1814;
    --dark-card: #2A2824;
    --dark-ink: #E8E4DC;
    --dark-muted: #9A968E;
    --dark-accent: #E8954A;
  }

  html.dark-mode {
    --paper: var(--dark-bg);
    --ink: var(--dark-ink);
    --ink-muted: var(--dark-muted);
    --accent: var(--dark-accent);
    --accent-light: #F0A86C;
    --accent-soft: #3D2E1E;
    --card-bg: var(--dark-card);
    --shadow: rgba(0,0,0,0.3);
    --shadow-md: rgba(0,0,0,0.4);
    --focus-soft: #1A2A1E;
    --break-soft: #1A242A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    transition: background var(--transition), color var(--transition);
  }

  .title-font {
    font-family: 'ZCOOL KuaiLe', 'STKaiti', 'KaiTi', cursive;
  }

  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    background: var(--paper);
    overflow: hidden;
    transition: background var(--transition);
  }

  /* ===== Header ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    background: var(--paper);
    z-index: 50;
    transition: background var(--transition);
  }

  .back-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--card-bg);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px var(--shadow);
    color: var(--ink);
    font-size: 18px;
    transition: transform 0.2s;
  }

  .back-btn:active { transform: scale(0.92); }

  .header-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    color: var(--ink);
  }

  .theme-toggle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--card-bg);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px var(--shadow);
    color: var(--ink);
    font-size: 16px;
    transition: transform 0.2s;
  }

  .theme-toggle:active { transform: scale(0.92); }

  /* ===== Timer Circle ===== */
  .timer-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0 16px;
    position: relative;
  }

  .timer-circle-wrap {
    position: relative;
    width: 240px;
    height: 240px;
  }

  .timer-circle-wrap svg {
    transform: rotate(-90deg);
  }

  .timer-circle-bg {
    fill: none;
    stroke: var(--accent-soft);
    stroke-width: 8;
  }

  .timer-circle-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }

  .timer-circle-wrap.focus .timer-circle-progress {
    stroke: var(--focus);
  }

  .timer-circle-wrap.focus .timer-circle-bg {
    stroke: var(--focus-soft);
  }

  .timer-circle-wrap.break .timer-circle-progress {
    stroke: var(--break);
  }

  .timer-circle-wrap.break .timer-circle-bg {
    stroke: var(--break-soft);
  }

  .timer-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .timer-time {
    font-size: 52px;
    font-weight: 300;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    font-family: 'Courier New', monospace;
    line-height: 1;
  }

  .timer-label {
    font-size: 13px;
    color: var(--ink-muted);
    margin-top: 6px;
  }

  .timer-mode-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 11px;
    margin-top: 8px;
    font-weight: 500;
  }

  .timer-mode-badge.focus {
    background: var(--focus-soft);
    color: var(--focus);
  }

  .timer-mode-badge.break {
    background: var(--break-soft);
    color: var(--break);
  }

  /* ===== Timer Controls ===== */
  .timer-controls {
    display: flex;
    gap: 16px;
    margin-top: 20px;
  }

  .timer-control-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 22px;
    transition: all 0.25s;
    font-family: inherit;
  }

  .timer-control-btn.primary {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
    color: white;
    box-shadow: 0 4px 16px rgba(212,131,74,0.3);
    font-size: 28px;
  }

  .timer-control-btn.secondary {
    background: var(--card-bg);
    color: var(--ink);
    box-shadow: 0 2px 8px var(--shadow);
    font-size: 18px;
  }

  .timer-control-btn:active { transform: scale(0.92); }

  /* ===== Task Input ===== */
  .section {
    padding: 0 20px;
    margin-bottom: 20px;
  }

  .section-title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .section-title .count {
    font-family: inherit;
    font-size: 12px;
    color: var(--ink-muted);
    font-weight: normal;
  }

  .task-input-wrap {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .task-input {
    flex: 1;
    padding: 12px 14px;
    border-radius: var(--radius);
    border: 1.5px solid var(--accent-soft);
    background: var(--card-bg);
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  .task-input:focus {
    border-color: var(--accent);
  }

  .task-input::placeholder {
    color: var(--ink-muted);
  }

  .task-add-btn {
    padding: 0 18px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: white;
    font-size: 20px;
    cursor: pointer;
    transition: transform 0.2s;
    font-family: inherit;
  }

  .task-add-btn:active { transform: scale(0.92); }

  .task-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .task-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: 0 2px 8px var(--shadow);
    transition: all 0.2s;
  }

  .task-item.active {
    border: 1.5px solid var(--accent);
    background: var(--accent-soft);
  }

  .task-checkbox {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--ink-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 12px;
    color: white;
    transition: all 0.2s;
  }

  .task-checkbox.checked {
    background: var(--focus);
    border-color: var(--focus);
  }

  .task-text {
    flex: 1;
    font-size: 14px;
    color: var(--ink);
  }

  .task-text.done {
    text-decoration: line-through;
    color: var(--ink-muted);
  }

  .task-delete {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--ink-muted);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .task-delete:active { color: var(--red); }

  .task-empty {
    text-align: center;
    padding: 24px;
    color: var(--ink-muted);
    font-size: 13px;
  }

  /* ===== Stats ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .stat-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 14px 8px;
    text-align: center;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .stat-value {
    font-size: 24px;
    font-weight: 600;
    color: var(--accent);
    font-family: 'Courier New', monospace;
  }

  .stat-label {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 4px;
  }

  /* ===== Settings ===== */
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--accent-soft);
  }

  .settings-row:last-child {
    border-bottom: none;
  }

  .settings-label {
    font-size: 14px;
    color: var(--ink);
  }

  .settings-value {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .settings-btn {
    padding: 6px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--accent-soft);
    background: transparent;
    color: var(--ink);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }

  .settings-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .settings-btn:active { transform: scale(0.95); }

  /* ===== Fullscreen Mode ===== */
  .fullscreen-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--paper);
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  .fullscreen-overlay.active {
    display: flex;
  }

  .fullscreen-timer {
    font-size: 80px;
    font-weight: 200;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    font-family: 'Courier New', monospace;
  }

  .fullscreen-task {
    font-size: 18px;
    color: var(--ink-muted);
    margin-top: 20px;
    text-align: center;
  }

  .fullscreen-close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--card-bg);
    color: var(--ink);
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 2px 8px var(--shadow);
  }

  /* ===== Footer ===== */
  .footer {
    text-align: center;
    padding: 16px;
    font-size: 11px;
    color: var(--ink-muted);
  }

  /* ===== Dark mode specific ===== */
  html.dark-mode .timer-circle-wrap.focus .timer-circle-progress {
    stroke: #8AB89A;
  }

  html.dark-mode .timer-circle-wrap.break .timer-circle-progress {
    stroke: #8AB8D4;
  }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <button class="back-btn" onclick="window.location.href='../niujiu-demo-final.html'">&#8592;</button>
    <span class="header-title title-font">专注番茄钟</span>
    <button class="theme-toggle" onclick="toggleTheme()" title="切换明暗模式">&#9788;</button>
  </div>

  <!-- Timer -->
  <div class="timer-section">
    <div class="timer-circle-wrap focus" id="timerCircleWrap">
      <svg width="240" height="240" viewBox="0 0 240 240">
        <circle class="timer-circle-bg" cx="120" cy="120" r="110"/>
        <circle class="timer-circle-progress" id="progressCircle" cx="120" cy="120" r="110"
          stroke-dasharray="691" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-content">
        <div class="timer-time" id="timerDisplay">25:00</div>
        <div class="timer-label" id="timerLabel">保持专注</div>
        <div class="timer-mode-badge focus" id="modeBadge">专注中</div>
      </div>
    </div>

    <div class="timer-controls">
      <button class="timer-control-btn secondary" onclick="resetTimer()" title="重置">&#8634;</button>
      <button class="timer-control-btn primary" id="mainBtn" onclick="toggleTimer()">&#9654;</button>
      <button class="timer-control-btn secondary" onclick="toggleFullscreen()" title="全屏">&#9974;</button>
    </div>
  </div>

  <!-- Task List -->
  <div class="section">
    <div class="section-title title-font">
      <span>&#128221; 专注任务</span>
      <span class="count" id="taskCount">0/0</span>
    </div>
    <div class="task-input-wrap">
      <input type="text" class="task-input" id="taskInput" placeholder="输入今天要专注的任务..."
        onkeypress="if(event.key==='Enter')addTask()">
      <button class="task-add-btn" onclick="addTask()">+</button>
    </div>
    <div class="task-list" id="taskList"></div>
  </div>

  <!-- Stats -->
  <div class="section">
    <div class="section-title title-font">&#128200; 今日统计</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="statCount">0</div>
        <div class="stat-label">完成番茄</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statMinutes">0</div>
        <div class="stat-label">专注分钟</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statStreak">0</div>
        <div class="stat-label">连续天数</div>
      </div>
    </div>
  </div>

  <!-- Settings -->
  <div class="section">
    <div class="section-title title-font">&#9881; 设置</div>
    <div class="control-card" style="background:var(--card-bg);border-radius:var(--radius);padding:0 16px;box-shadow:0 2px 8px var(--shadow);">
      <div class="settings-row">
        <span class="settings-label">专注时长</span>
        <div class="settings-value">
          <button class="settings-btn" data-focus="15" onclick="setFocusTime(15)">15</button>
          <button class="settings-btn active" data-focus="25" onclick="setFocusTime(25)">25</button>
          <button class="settings-btn" data-focus="45" onclick="setFocusTime(45)">45</button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">休息时长</span>
        <div class="settings-value">
          <button class="settings-btn" data-break="3" onclick="setBreakTime(3)">3</button>
          <button class="settings-btn active" data-break="5" onclick="setBreakTime(5)">5</button>
          <button class="settings-btn" data-break="10" onclick="setBreakTime(10)">10</button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">通知提醒</span>
        <div class="settings-value">
          <button class="settings-btn active" id="notifBtn" onclick="toggleNotification()">开启</button>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">专注当下，效率倍增 &#127942;</div>
</div>

<!-- Fullscreen Overlay -->
<div class="fullscreen-overlay" id="fullscreenOverlay">
  <button class="fullscreen-close" onclick="toggleFullscreen()">&#10005;</button>
  <div class="fullscreen-timer" id="fullscreenTime">25:00</div>
  <div class="fullscreen-task" id="fullscreenTask">准备开始专注</div>
</div>

<script>
// ===== State =====
let focusTime = 25;
let breakTime = 5;
let timeLeft = focusTime * 60;
let totalTime = focusTime * 60;
let isRunning = false;
let isFocus = true;
let timerInterval = null;
let tasks = [];
let stats = { count: 0, minutes: 0, streak: 0, lastDate: '' };
let notificationsEnabled = true;

// ===== Init =====
function init() {
  loadTheme();
  loadData();
  renderTasks();
  updateStats();
  updateDisplay();
  requestNotificationPermission();
}

// ===== Theme =====
function toggleTheme() {
  document.documentElement.classList.toggle('dark-mode');
  localStorage.setItem('niujiu_tomato_theme', document.documentElement.classList.contains('dark-mode') ? 'dark' : 'light');
}

function loadTheme() {
  const saved = localStorage.getItem('niujiu_tomato_theme');
  if (saved === 'dark') document.documentElement.classList.add('dark-mode');
  else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.classList.add('dark-mode');
  }
}

// ===== Data =====
function loadData() {
  const savedTasks = localStorage.getItem('niujiu_tomato_tasks');
  if (savedTasks) {
    try { tasks = JSON.parse(savedTasks); } catch(e) {}
  }
  const savedStats = localStorage.getItem('niujiu_tomato_stats');
  if (savedStats) {
    try {
      stats = JSON.parse(savedStats);
      checkStreak();
    } catch(e) {}
  }
  const savedSettings = localStorage.getItem('niujiu_tomato_settings');
  if (savedSettings) {
    try {
      const s = JSON.parse(savedSettings);
      if (s.focusTime) { focusTime = s.focusTime; timeLeft = focusTime * 60; totalTime = timeLeft; }
      if (s.breakTime) breakTime = s.breakTime;
      if (s.notifications !== undefined) notificationsEnabled = s.notifications;
    } catch(e) {}
  }
  updateSettingsUI();
}

function saveData() {
  localStorage.setItem('niujiu_tomato_tasks', JSON.stringify(tasks));
  localStorage.setItem('niujiu_tomato_stats', JSON.stringify(stats));
  localStorage.setItem('niujiu_tomato_settings', JSON.stringify({
    focusTime, breakTime, notifications: notificationsEnabled
  }));
}

function checkStreak() {
  const today = new Date().toDateString();
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  if (stats.lastDate !== today && stats.lastDate !== yesterday) {
    stats.streak = 0;
  }
}

// ===== Timer =====
function toggleTimer() {
  if (isRunning) {
    pauseTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  if (timeLeft <= 0) {
    resetTimer();
    timeLeft = totalTime;
  }
  isRunning = true;
  updateMainBtn();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateDisplay();
    if (timeLeft <= 0) {
      completeTimer();
    }
  }, 1000);
}

function pauseTimer() {
  isRunning = false;
  clearInterval(timerInterval);
  updateMainBtn();
}

function resetTimer() {
  pauseTimer();
  timeLeft = isFocus ? focusTime * 60 : breakTime * 60;
  totalTime = timeLeft;
  updateDisplay();
}

function completeTimer() {
  pauseTimer();
  if (isFocus) {
    stats.count++;
    stats.minutes += focusTime;
    stats.lastDate = new Date().toDateString();
    if (stats.streak === 0) stats.streak = 1;
    else {
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      if (stats.lastDate === yesterday || stats.lastDate === new Date().toDateString()) {
        // already counted today, don't increment streak again
      } else {
        stats.streak++;
      }
    }
    sendNotification('专注完成！', '恭喜你完成了一个番茄钟，休息一下吧。');
    isFocus = false;
    timeLeft = breakTime * 60;
    totalTime = timeLeft;
  } else {
    sendNotification('休息结束！', '休息好了吗？开始下一个番茄钟吧。');
    isFocus = true;
    timeLeft = focusTime * 60;
    totalTime = timeLeft;
  }
  updateDisplay();
  updateStats();
  saveData();
  updateModeUI();
}

function updateDisplay() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  const text = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  document.getElementById('timerDisplay').textContent = text;
  document.getElementById('fullscreenTime').textContent = text;

  const circumference = 2 * Math.PI * 110;
  const offset = circumference - (timeLeft / totalTime) * circumference;
  document.getElementById('progressCircle').style.strokeDashoffset = offset;
}

function updateMainBtn() {
  const btn = document.getElementById('mainBtn');
  btn.innerHTML = isRunning ? '&#10074;&#10074;' : '&#9654;';
}

function updateModeUI() {
  const wrap = document.getElementById('timerCircleWrap');
  const badge = document.getElementById('modeBadge');
  const label = document.getElementById('timerLabel');
  wrap.classList.remove('focus', 'break');
  wrap.classList.add(isFocus ? 'focus' : 'break');
  badge.classList.remove('focus', 'break');
  badge.classList.add(isFocus ? 'focus' : 'break');
  badge.textContent = isFocus ? '专注中' : '休息中';
  label.textContent = isFocus ? '保持专注' : '放松身心';
}

// ===== Settings =====
function setFocusTime(min) {
  focusTime = min;
  if (isFocus && !isRunning) {
    timeLeft = min * 60;
    totalTime = timeLeft;
    updateDisplay();
  }
  updateSettingsUI();
  saveData();
}

function setBreakTime(min) {
  breakTime = min;
  if (!isFocus && !isRunning) {
    timeLeft = min * 60;
    totalTime = timeLeft;
    updateDisplay();
  }
  updateSettingsUI();
  saveData();
}

function updateSettingsUI() {
  document.querySelectorAll('[data-focus]').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.focus) === focusTime);
  });
  document.querySelectorAll('[data-break]').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.break) === breakTime);
  });
  const notifBtn = document.getElementById('notifBtn');
  if (notifBtn) {
    notifBtn.textContent = notificationsEnabled ? '开启' : '关闭';
    notifBtn.classList.toggle('active', notificationsEnabled);
  }
}

function toggleNotification() {
  notificationsEnabled = !notificationsEnabled;
  if (notificationsEnabled) requestNotificationPermission();
  updateSettingsUI();
  saveData();
}

// ===== Tasks =====
function addTask() {
  const input = document.getElementById('taskInput');
  const text = input.value.trim();
  if (!text) return;
  tasks.push({ id: Date.now(), text, done: false });
  input.value = '';
  renderTasks();
  saveData();
}

function toggleTask(id) {
  const task = tasks.find(t => t.id === id);
  if (task) {
    task.done = !task.done;
    renderTasks();
    saveData();
  }
}

function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  renderTasks();
  saveData();
}

function renderTasks() {
  const list = document.getElementById('taskList');
  const doneCount = tasks.filter(t => t.done).length;
  document.getElementById('taskCount').textContent = doneCount + '/' + tasks.length;

  if (tasks.length === 0) {
    list.innerHTML = '<div class="task-empty">还没有任务，添加一个开始专注吧</div>';
    document.getElementById('fullscreenTask').textContent = '准备开始专注';
    return;
  }

  list.innerHTML = tasks.map(t => `
    <div class="task-item ${!t.done ? 'active' : ''}">
      <div class="task-checkbox ${t.done ? 'checked' : ''}" onclick="toggleTask(${t.id})">
        ${t.done ? '&#10003;' : ''}
      </div>
      <span class="task-text ${t.done ? 'done' : ''}">${escapeHtml(t.text)}</span>
      <button class="task-delete" onclick="deleteTask(${t.id})">&#215;</button>
    </div>
  `).join('');

  const firstUndone = tasks.find(t => !t.done);
  document.getElementById('fullscreenTask').textContent = firstUndone ? firstUndone.text : '所有任务已完成！';
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ===== Stats =====
function updateStats() {
  document.getElementById('statCount').textContent = stats.count;
  document.getElementById('statMinutes').textContent = stats.minutes;
  document.getElementById('statStreak').textContent = stats.streak;
}

// ===== Notifications =====
function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function sendNotification(title, body) {
  if (!notificationsEnabled) return;
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body, icon: '', silent: false });
  }
}

// ===== Fullscreen =====
function toggleFullscreen() {
  const overlay = document.getElementById('fullscreenOverlay');
  overlay.classList.toggle('active');
}

// ===== Init =====
init();

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>
