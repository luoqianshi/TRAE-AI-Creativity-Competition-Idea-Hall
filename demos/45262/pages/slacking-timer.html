<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="牛马自救指南 - 摸鱼计时器，合理安排工作与休息">
<title>摸鱼计时器 · 牛马自救指南</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FDF8F0;
    --bg2: #F5EDE0;
    --ink: #2D2A24;
    --accent: #E8916A;
    --ink-muted: #7A7670;
    --card-bg: #FFFBF5;
    --shadow: rgba(45,42,36,0.08);
    --shadow-md: rgba(45,42,36,0.12);
    --radius: 16px;
    --transition: 0.3s ease;
    --ocean: #D4EEF7;
    --ocean-deep: #A8D8EA;
    --fish-color: #E8916A;
  }

  html.dark-mode {
    --bg: #0D1B2A;
    --bg2: #1B2838;
    --ink: #E8E4DC;
    --accent: #E8916A;
    --ink-muted: #7A8A9A;
    --card-bg: #162232;
    --shadow: rgba(0,0,0,0.3);
    --shadow-md: rgba(0,0,0,0.4);
    --ocean: #0D2137;
    --ocean-deep: #0A1A2E;
    --fish-color: #E8916A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    transition: background var(--transition), color var(--transition);
  }

  .page-wrapper {
    opacity: 0;
    animation: pageFadeIn 0.6s ease-out 0.1s forwards;
  }
  @keyframes pageFadeIn {
    to { opacity: 1; }
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    background: var(--bg);
    overflow: hidden;
    transition: background var(--transition);
  }

  /* ===== Ocean Background ===== */
  .ocean-bg {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    height: 100vh;
    z-index: 0;
    background: linear-gradient(180deg, var(--ocean) 0%, var(--bg) 40%, var(--bg) 100%);
    pointer-events: none;
    overflow: hidden;
  }

  /* ===== Swimming Fish ===== */
  .fish {
    position: absolute;
    font-size: 20px;
    opacity: 0.15;
    animation: swim linear infinite;
    pointer-events: none;
    z-index: 1;
  }
  .fish:nth-child(1) { top: 8%; animation-duration: 18s; animation-delay: 0s; font-size: 24px; }
  .fish:nth-child(2) { top: 18%; animation-duration: 22s; animation-delay: 3s; font-size: 16px; }
  .fish:nth-child(3) { top: 28%; animation-duration: 15s; animation-delay: 6s; font-size: 28px; }
  .fish:nth-child(4) { top: 12%; animation-duration: 25s; animation-delay: 9s; font-size: 18px; }
  .fish:nth-child(5) { top: 22%; animation-duration: 20s; animation-delay: 2s; font-size: 22px; }
  .fish:nth-child(6) { top: 5%; animation-duration: 28s; animation-delay: 7s; font-size: 14px; }
  .fish:nth-child(7) { top: 32%; animation-duration: 16s; animation-delay: 11s; font-size: 20px; }
  .fish:nth-child(8) { top: 15%; animation-duration: 24s; animation-delay: 4s; font-size: 26px; }

  @keyframes swim {
    0% { left: -60px; transform: scaleX(1) translateY(0); }
    25% { transform: scaleX(1) translateY(-10px); }
    50% { transform: scaleX(1) translateY(5px); }
    75% { transform: scaleX(1) translateY(-5px); }
    100% { left: calc(100% + 60px); transform: scaleX(1) translateY(0); }
  }

  /* ===== Bubbles ===== */
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.06;
    animation: bubbleRise linear infinite;
    pointer-events: none;
  }
  .bubble:nth-child(9) { width: 8px; height: 8px; left: 15%; animation-duration: 12s; animation-delay: 0s; }
  .bubble:nth-child(10) { width: 12px; height: 12px; left: 35%; animation-duration: 15s; animation-delay: 2s; }
  .bubble:nth-child(11) { width: 6px; height: 6px; left: 55%; animation-duration: 10s; animation-delay: 4s; }
  .bubble:nth-child(12) { width: 10px; height: 10px; left: 75%; animation-duration: 14s; animation-delay: 1s; }
  .bubble:nth-child(13) { width: 14px; height: 14px; left: 25%; animation-duration: 18s; animation-delay: 6s; }
  .bubble:nth-child(14) { width: 7px; height: 7px; left: 65%; animation-duration: 11s; animation-delay: 3s; }
  .bubble:nth-child(15) { width: 9px; height: 9px; left: 85%; animation-duration: 16s; animation-delay: 5s; }

  @keyframes bubbleRise {
    0% { bottom: -20px; opacity: 0; }
    10% { opacity: 0.06; }
    90% { opacity: 0.06; }
    100% { bottom: 110%; opacity: 0; }
  }

  /* ===== Header ===== */
  .header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    padding-top: max(16px, env(safe-area-inset-top));
  }

  .back-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all var(--transition);
    box-shadow: 0 2px 8px var(--shadow);
    color: var(--ink);
    font-size: 18px;
  }
  .back-btn:active { transform: scale(0.92); }

  .header-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
  }

  .dark-toggle {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all var(--transition);
    box-shadow: 0 2px 8px var(--shadow);
    font-size: 16px;
  }
  .dark-toggle:active { transform: scale(0.92); }

  /* ===== Content ===== */
  .content {
    position: relative;
    z-index: 10;
    padding: 0 20px 100px;
  }

  /* ===== Status Message ===== */
  .status-section {
    text-align: center;
    margin-bottom: 8px;
  }

  .status-msg {
    font-size: 15px;
    color: var(--accent);
    font-weight: 600;
    padding: 8px 20px;
    background: rgba(232,145,106,0.1);
    border-radius: 20px;
    display: inline-block;
    transition: all 0.5s ease;
    min-height: 36px;
    line-height: 20px;
  }

  /* ===== Timer Ring ===== */
  .timer-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 24px 0;
    position: relative;
  }

  .timer-ring-wrapper {
    position: relative;
    width: 260px;
    height: 260px;
  }

  .timer-ring-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .timer-ring-bg {
    fill: none;
    stroke: var(--bg2);
    stroke-width: 8;
  }

  .timer-ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 754;
    stroke-dashoffset: 754;
    transition: stroke-dashoffset 1s linear;
    filter: drop-shadow(0 0 6px rgba(232,145,106,0.4));
  }

  .timer-ring-glow {
    fill: none;
    stroke: var(--accent);
    stroke-width: 12;
    stroke-linecap: round;
    stroke-dasharray: 754;
    stroke-dashoffset: 754;
    opacity: 0.15;
    transition: stroke-dashoffset 1s linear;
  }

  .timer-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .timer-label {
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 4px;
  }

  .timer-display {
    font-size: 48px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    line-height: 1;
  }

  .timer-sub {
    font-size: 12px;
    color: var(--ink-muted);
    margin-top: 6px;
  }

  /* Pulse animation when running */
  .timer-ring-wrapper.running .timer-ring-progress {
    animation: ringPulse 2s ease-in-out infinite;
  }
  @keyframes ringPulse {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(232,145,106,0.4)); }
    50% { filter: drop-shadow(0 0 14px rgba(232,145,106,0.7)); }
  }

  /* ===== Controls ===== */
  .controls {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 20px 0 28px;
  }

  .ctrl-btn {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px var(--shadow-md);
    position: relative;
    overflow: hidden;
  }

  .ctrl-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0);
    transition: background 0.2s;
  }
  .ctrl-btn:active::after {
    background: rgba(255,255,255,0.2);
  }
  .ctrl-btn:active {
    transform: scale(0.9);
  }

  .ctrl-btn.start {
    background: var(--accent);
    color: #fff;
  }
  .ctrl-btn.start.running {
    background: #F0A070;
  }

  .ctrl-btn.pause {
    background: var(--card-bg);
    color: var(--ink);
    border: 2px solid var(--ink-muted);
  }

  .ctrl-btn.reset {
    background: var(--card-bg);
    color: var(--ink-muted);
    border: 2px solid var(--bg2);
  }

  .ctrl-btn.boss {
    background: #E74C3C;
    color: #fff;
    width: auto;
    border-radius: 28px;
    padding: 0 24px;
    font-size: 14px;
    font-weight: 600;
    gap: 6px;
  }

  /* Ripple on start */
  .ripple-effect {
    position: absolute;
    border-radius: 50%;
    background: rgba(232,145,106,0.3);
    animation: rippleOut 0.6s ease-out forwards;
    pointer-events: none;
  }
  @keyframes rippleOut {
    0% { width: 0; height: 0; opacity: 1; }
    100% { width: 120px; height: 120px; opacity: 0; margin-left: -60px; margin-top: -60px; }
  }

  /* ===== Boss Alert Mode ===== */
  .boss-mode {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1000;
    background: #F0F0F0;
    display: none;
    flex-direction: column;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  .boss-mode.active {
    display: flex;
    animation: bossFadeIn 0.15s ease-out;
  }
  @keyframes bossFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .boss-toolbar {
    background: #217346;
    color: #fff;
    display: flex;
    align-items: center;
    padding: 6px 12px;
    gap: 12px;
    font-size: 13px;
  }
  .boss-toolbar-logo {
    font-weight: 700;
    font-size: 14px;
    margin-right: 8px;
  }
  .boss-toolbar-menu {
    display: flex;
    gap: 16px;
    font-size: 12px;
    opacity: 0.9;
  }
  .boss-toolbar-right {
    margin-left: auto;
    font-size: 12px;
    opacity: 0.8;
  }

  .boss-formula-bar {
    background: #fff;
    border-bottom: 1px solid #D4D4D4;
    padding: 4px 12px;
    font-size: 13px;
    color: #333;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .boss-formula-bar .fx {
    font-weight: 700;
    color: #217346;
  }

  .boss-grid {
    flex: 1;
    overflow: auto;
    background: #fff;
  }

  .boss-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    color: #333;
  }
  .boss-table th {
    background: #E8E8E8;
    border: 1px solid #C0C0C0;
    padding: 3px 8px;
    font-weight: 400;
    text-align: center;
    color: #333;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .boss-table td {
    border: 1px solid #E0E0E0;
    padding: 3px 8px;
    text-align: center;
  }
  .boss-table td.num {
    text-align: right;
    color: #217346;
  }

  .boss-sheet-bar {
    background: #F0F0F0;
    border-top: 1px solid #D4D4D4;
    display: flex;
    align-items: center;
    padding: 4px 12px;
    gap: 4px;
  }
  .boss-sheet-tab {
    padding: 3px 12px;
    font-size: 12px;
    border: 1px solid #C0C0C0;
    background: #fff;
    color: #333;
  }
  .boss-sheet-tab.active {
    background: #fff;
    border-bottom: 2px solid #fff;
    margin-bottom: -1px;
  }

  .boss-exit-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    cursor: pointer;
    z-index: 1001;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .boss-exit-btn.show {
    opacity: 1;
  }

  /* ===== Achievement Section ===== */
  .section-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .icon {
    font-size: 18px;
  }

  .achievements-grid {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 8px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .achievements-grid::-webkit-scrollbar { display: none; }

  .achievement-item {
    flex-shrink: 0;
    width: 80px;
    text-align: center;
    padding: 12px 8px;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: 0 2px 8px var(--shadow);
    transition: all var(--transition);
    position: relative;
  }
  .achievement-item.locked {
    opacity: 0.4;
    filter: grayscale(1);
  }
  .achievement-item.unlocked {
    opacity: 1;
    filter: none;
    box-shadow: 0 2px 12px rgba(232,145,106,0.2);
  }

  .achievement-icon {
    font-size: 32px;
    display: block;
    margin-bottom: 4px;
  }
  .achievement-name {
    font-size: 11px;
    color: var(--ink);
    font-weight: 600;
  }
  .achievement-time {
    font-size: 10px;
    color: var(--ink-muted);
    margin-top: 2px;
  }

  /* ===== Stats Cards ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 20px 0;
  }

  .stat-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 2px 8px var(--shadow);
    transition: all var(--transition);
  }

  .stat-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.2;
  }
  .stat-label {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 4px;
  }

  /* ===== History ===== */
  .history-list {
    margin-top: 8px;
  }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: var(--card-bg);
    border-radius: 12px;
    margin-bottom: 8px;
    box-shadow: 0 2px 6px var(--shadow);
    transition: all var(--transition);
  }

  .history-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .history-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(232,145,106,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .history-info .history-time {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }
  .history-info .history-date {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 2px;
  }

  .history-duration {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
  }

  .history-empty {
    text-align: center;
    padding: 30px 20px;
    color: var(--ink-muted);
    font-size: 14px;
  }
  .history-empty .empty-icon {
    font-size: 40px;
    margin-bottom: 8px;
    display: block;
  }

  /* ===== Share Button ===== */
  .share-section {
    margin-top: 24px;
    text-align: center;
  }

  .share-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 32px;
    background: linear-gradient(135deg, var(--accent), #D47A4A);
    color: #fff;
    border: none;
    border-radius: 28px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(232,145,106,0.35);
    transition: all 0.2s;
  }
  .share-btn:active {
    transform: scale(0.95);
    box-shadow: 0 2px 8px rgba(232,145,106,0.3);
  }

  /* ===== Share Card Modal ===== */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.active {
    display: flex;
    animation: modalFadeIn 0.3s ease-out;
  }
  @keyframes modalFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .share-card {
    width: 320px;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .share-card-header {
    background: linear-gradient(135deg, #E8916A, #D47A4A);
    padding: 24px 20px;
    text-align: center;
    color: #fff;
  }
  .share-card-header .share-emoji {
    font-size: 40px;
    margin-bottom: 8px;
  }
  .share-card-header .share-title {
    font-size: 18px;
    font-weight: 700;
  }
  .share-card-header .share-subtitle {
    font-size: 12px;
    opacity: 0.9;
    margin-top: 4px;
  }

  .share-card-body {
    padding: 20px;
    text-align: center;
  }

  .share-stat-row {
    display: flex;
    justify-content: space-around;
    margin: 16px 0;
  }
  .share-stat-item .share-stat-val {
    font-size: 24px;
    font-weight: 700;
    color: #E8916A;
  }
  .share-stat-item .share-stat-lbl {
    font-size: 11px;
    color: #999;
    margin-top: 2px;
  }

  .share-achievement-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 12px 0;
    flex-wrap: wrap;
  }
  .share-achievement-badge {
    font-size: 24px;
    width: 40px; height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFF5EE;
    border-radius: 50%;
  }
  .share-achievement-badge.locked {
    filter: grayscale(1);
    opacity: 0.3;
  }

  .share-card-footer {
    padding: 12px 20px 16px;
    text-align: center;
  }
  .share-card-footer .share-cta {
    font-size: 13px;
    color: #999;
  }

  .modal-close {
    margin-top: 16px;
    padding: 10px 24px;
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
  }

  /* ===== Achievement Unlock Animation ===== */
  .achievement-popup {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 600;
    background: var(--card-bg);
    border-radius: 24px;
    padding: 30px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .achievement-popup.show {
    transform: translate(-50%, -50%) scale(1);
  }

  .achievement-popup .popup-icon {
    font-size: 56px;
    display: block;
    margin-bottom: 8px;
    animation: popupBounce 0.6s ease-out;
  }
  @keyframes popupBounce {
    0% { transform: scale(0) rotate(-20deg); }
    50% { transform: scale(1.3) rotate(10deg); }
    70% { transform: scale(0.9) rotate(-5deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .achievement-popup .popup-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .achievement-popup .popup-name {
    font-size: 14px;
    color: var(--accent);
    font-weight: 600;
  }

  /* Confetti */
  .confetti-container {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 599;
    pointer-events: none;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    width: 8px;
    height: 8px;
    top: -10px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* ===== Boss Button Section ===== */
  .boss-section {
    text-align: center;
    margin: 8px 0 20px;
  }

  /* ===== Sound Wave Animation ===== */
  .sound-wave {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    height: 20px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .sound-wave.active {
    opacity: 1;
  }
  .sound-wave span {
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    animation: soundWave 0.6s ease-in-out infinite;
  }
  .sound-wave span:nth-child(1) { height: 8px; animation-delay: 0s; }
  .sound-wave span:nth-child(2) { height: 14px; animation-delay: 0.1s; }
  .sound-wave span:nth-child(3) { height: 20px; animation-delay: 0.2s; }
  .sound-wave span:nth-child(4) { height: 14px; animation-delay: 0.3s; }
  .sound-wave span:nth-child(5) { height: 8px; animation-delay: 0.4s; }

  @keyframes soundWave {
    0%, 100% { transform: scaleY(0.5); }
    50% { transform: scaleY(1); }
  }

  /* ===== Section Spacing ===== */
  .section {
    margin-bottom: 24px;
  }

  /* ===== Scrollbar ===== */
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* ===== Responsive ===== */
  @media (max-width: 380px) {
    .timer-ring-wrapper { width: 220px; height: 220px; }
    .timer-display { font-size: 40px; }
    .ctrl-btn { width: 48px; height: 48px; font-size: 18px; }
    .achievement-item { width: 68px; }
    .achievement-icon { font-size: 26px; }
  }
</style>

<script>
(function() {
  'use strict';

  // ===== Constants =====
  var CIRCUMFERENCE = 2 * Math.PI * 120; // ~754
  var ACHIEVEMENTS = [
    { id: 'fish1', icon: '\u{1F41F}', name: '初出茅庐', time: 5 * 60 },
    { id: 'fish2', icon: '\u{1F420}', name: '摸鱼达人', time: 15 * 60 },
    { id: 'fish3', icon: '\u{1F421}', name: '摸鱼大师', time: 30 * 60 },
    { id: 'fish4', icon: '\u{1F40B}', name: '摸鱼王者', time: 60 * 60 },
    { id: 'fish5', icon: '\u{1F433}', name: '摸鱼传说', time: 120 * 60 }
  ];

  var STATUS_MESSAGES = [
    { max: 5 * 60, msg: '\u{1F60E} 正在摸鱼...老板还没发现' },
    { max: 15 * 60, msg: '\u{1F440} 摸鱼达人！同事都在偷偷看' },
    { max: 30 * 60, msg: '\u{1F3D6} 摸鱼大师！这班上得像度假' },
    { max: 60 * 60, msg: '\u{1F451} 摸鱼王者！老板以为你消失了' },
    { max: Infinity, msg: '\u{1F30D} 摸鱼传说！你确定还在上班？' }
  ];

  // ===== State =====
  var state = {
    isRunning: false,
    elapsedSeconds: 0,
    timerInterval: null,
    unlockedAchievements: [],
    bossModeActive: false,
    data: {
      sessions: [],
      totalToday: 0,
      bestRecord: 0,
      todayDate: ''
    }
  };

  // ===== DOM References =====
  var timerDisplay = document.getElementById('timerDisplay');
  var timerSub = document.getElementById('timerSub');
  var statusMsg = document.getElementById('statusMsg');
  var ringProgress = document.getElementById('ringProgress');
  var ringGlow = document.getElementById('ringGlow');
  var timerRingWrapper = document.getElementById('timerRingWrapper');
  var startBtn = document.getElementById('startBtn');
  var pauseBtn = document.getElementById('pauseBtn');
  var resetBtn = document.getElementById('resetBtn');
  var bossBtn = document.getElementById('bossBtn');
  var soundWave = document.getElementById('soundWave');
  var achievementsGrid = document.getElementById('achievementsGrid');
  var historyList = document.getElementById('historyList');
  var statTotal = document.getElementById('statTotal');
  var statBest = document.getElementById('statBest');
  var statAvg = document.getElementById('statAvg');
  var bossMode = document.getElementById('bossMode');
  var bossExitBtn = document.getElementById('bossExitBtn');
  var bossTableBody = document.getElementById('bossTableBody');
  var shareModal = document.getElementById('shareModal');
  var achievementPopup = document.getElementById('achievementPopup');
  var popupIcon = document.getElementById('popupIcon');
  var popupName = document.getElementById('popupName');
  var confettiContainer = document.getElementById('confettiContainer');
  var darkToggle = document.getElementById('darkToggle');

  // ===== Initialize =====
  function init() {
    loadDarkMode();
    loadData();
    renderAchievements();
    renderHistory();
    updateStats();
    generateBossTable();
    ringProgress.style.strokeDasharray = CIRCUMFERENCE;
    ringProgress.style.strokeDashoffset = CIRCUMFERENCE;
    ringGlow.style.strokeDasharray = CIRCUMFERENCE;
    ringGlow.style.strokeDashoffset = CIRCUMFERENCE;

    // Boss exit button appears after 3s
    bossMode.addEventListener('click', function(e) {
      if (state.bossModeActive) {
        bossExitBtn.classList.add('show');
      }
    });
  }

  // ===== Dark Mode =====
  window.toggleDarkMode = function() {
    var isDark = document.documentElement.classList.contains('dark-mode');
    if (isDark) {
      document.documentElement.classList.remove('dark-mode');
      localStorage.setItem('darkMode', 'false');
      darkToggle.textContent = '\u{1F319}';
    } else {
      document.documentElement.classList.add('dark-mode');
      localStorage.setItem('darkMode', 'true');
      darkToggle.textContent = '\u{2600}';
    }
  };

  function loadDarkMode() {
    var dm = localStorage.getItem('darkMode');
    if (dm === 'true') {
      document.documentElement.classList.add('dark-mode');
      darkToggle.textContent = '\u{2600}';
    }
  }

  // ===== Data Persistence =====
  function loadData() {
    try {
      var raw = localStorage.getItem('slacking_data');
      if (raw) {
        var parsed = JSON.parse(raw);
        state.data = parsed;
        // Reset today's total if it's a new day
        var today = getTodayStr();
        if (state.data.todayDate !== today) {
          state.data.totalToday = 0;
          state.data.todayDate = today;
          // Keep only today's sessions
          state.data.sessions = state.data.sessions.filter(function(s) {
            return s.date === today;
          });
          saveData();
        }
      } else {
        state.data.todayDate = getTodayStr();
        saveData();
      }
    } catch(e) {
      state.data = { sessions: [], totalToday: 0, bestRecord: 0, todayDate: getTodayStr() };
    }
  }

  function saveData() {
    try {
      localStorage.setItem('slacking_data', JSON.stringify(state.data));
    } catch(e) {}
  }

  function getTodayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // ===== Timer =====
  window.toggleTimer = function() {
    if (state.isRunning) {
      pauseTimer();
    } else {
      startTimer();
    }
  };

  function startTimer() {
    state.isRunning = true;
    startBtn.style.display = 'none';
    pauseBtn.style.display = 'flex';
    timerRingWrapper.classList.add('running');
    soundWave.classList.add('active');
    timerSub.textContent = '正在摸鱼中...';

    state.timerInterval = setInterval(function() {
      state.elapsedSeconds++;
      updateTimerDisplay();
      updateRingProgress();
      updateStatusMessage();
      checkAchievements();
    }, 1000);
  }

  function pauseTimer() {
    state.isRunning = false;
    clearInterval(state.timerInterval);
    startBtn.style.display = 'flex';
    pauseBtn.style.display = 'none';
    timerRingWrapper.classList.remove('running');
    soundWave.classList.remove('active');
    timerSub.textContent = '已暂停';
  }

  window.resetTimer = function() {
    var hadTime = state.elapsedSeconds > 0;
    pauseTimer();

    if (hadTime && state.elapsedSeconds >= 10) {
      // Save session
      var session = {
        duration: state.elapsedSeconds,
        date: getTodayStr(),
        timestamp: Date.now()
      };
      state.data.sessions.unshift(session);
      state.data.totalToday += state.elapsedSeconds;
      if (state.elapsedSeconds > state.data.bestRecord) {
        state.data.bestRecord = state.elapsedSeconds;
      }
      saveData();
      renderHistory();
      updateStats();
    }

    state.elapsedSeconds = 0;
    state.unlockedAchievements = [];
    updateTimerDisplay();
    updateRingProgress();
    updateStatusMessage();
    renderAchievements();
    timerSub.textContent = '点击开始你的摸鱼之旅';
    statusMsg.textContent = '\u{1F60E} 准备开始摸鱼...';
  };

  function updateTimerDisplay() {
    var h = Math.floor(state.elapsedSeconds / 3600);
    var m = Math.floor((state.elapsedSeconds % 3600) / 60);
    var s = state.elapsedSeconds % 60;
    timerDisplay.textContent =
      String(h).padStart(2,'0') + ':' +
      String(m).padStart(2,'0') + ':' +
      String(s).padStart(2,'0');
  }

  function updateRingProgress() {
    // Full circle = 120 minutes (7200s)
    var maxSeconds = 7200;
    var progress = Math.min(state.elapsedSeconds / maxSeconds, 1);
    var offset = CIRCUMFERENCE * (1 - progress);
    ringProgress.style.strokeDashoffset = offset;
    ringGlow.style.strokeDashoffset = offset;
  }

  function updateStatusMessage() {
    for (var i = 0; i < STATUS_MESSAGES.length; i++) {
      if (state.elapsedSeconds <= STATUS_MESSAGES[i].max) {
        statusMsg.textContent = STATUS_MESSAGES[i].msg;
        break;
      }
    }
  }

  // ===== Achievements =====
  function checkAchievements() {
    for (var i = 0; i < ACHIEVEMENTS.length; i++) {
      var ach = ACHIEVEMENTS[i];
      if (state.elapsedSeconds >= ach.time && state.unlockedAchievements.indexOf(ach.id) === -1) {
        state.unlockedAchievements.push(ach.id);
        showAchievementPopup(ach);
        renderAchievements();
      }
    }
  }

  function renderAchievements() {
    var html = '';
    for (var i = 0; i < ACHIEVEMENTS.length; i++) {
      var ach = ACHIEVEMENTS[i];
      var unlocked = state.unlockedAchievements.indexOf(ach.id) !== -1;
      html += '<div class="achievement-item ' + (unlocked ? 'unlocked' : 'locked') + '">' +
        '<span class="achievement-icon">' + ach.icon + '</span>' +
        '<div class="achievement-name">' + ach.name + '</div>' +
        '<div class="achievement-time">' + formatTimeShort(ach.time) + '</div>' +
      '</div>';
    }
    achievementsGrid.innerHTML = html;
  }

  function showAchievementPopup(ach) {
    popupIcon.textContent = ach.icon;
    popupName.textContent = ach.name;
    achievementPopup.classList.add('show');
    spawnConfetti();
    setTimeout(function() {
      achievementPopup.classList.remove('show');
    }, 2500);
  }

  function spawnConfetti() {
    var colors = ['#E8916A', '#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD'];
    var html = '';
    for (var i = 0; i < 40; i++) {
      var color = colors[Math.floor(Math.random() * colors.length)];
      var left = Math.random() * 100;
      var delay = Math.random() * 0.8;
      var duration = 1.5 + Math.random() * 1.5;
      var size = 4 + Math.random() * 8;
      var shapes = ['50%', '2px', '0'];
      var radius = shapes[Math.floor(Math.random() * shapes.length)];
      html += '<div class="confetti-piece" style="' +
        'left:' + left + '%;' +
        'width:' + size + 'px;' +
        'height:' + size + 'px;' +
        'background:' + color + ';' +
        'border-radius:' + radius + ';' +
        'animation-delay:' + delay + 's;' +
        'animation-duration:' + duration + 's;' +
      '"></div>';
    }
    confettiContainer.innerHTML = html;
    setTimeout(function() {
      confettiContainer.innerHTML = '';
    }, 3500);
  }

  // ===== Stats =====
  function updateStats() {
    statTotal.textContent = formatTimeShort(state.data.totalToday);
    statBest.textContent = formatTimeShort(state.data.bestRecord);
    var avg = 0;
    if (state.data.sessions.length > 0) {
      var total = 0;
      for (var i = 0; i < state.data.sessions.length; i++) {
        total += state.data.sessions[i].duration;
      }
      avg = Math.round(total / state.data.sessions.length);
    }
    statAvg.textContent = formatTimeShort(avg);
  }

  // ===== History =====
  function renderHistory() {
    if (state.data.sessions.length === 0) {
      historyList.innerHTML = '<div class="history-empty">' +
        '<span class="empty-icon">\u{1F41F}</span>' +
        '还没有摸鱼记录，快去摸鱼吧！</div>';
      return;
    }

    var html = '';
    var count = Math.min(state.data.sessions.length, 10);
    for (var i = 0; i < count; i++) {
      var s = state.data.sessions[i];
      var d = new Date(s.timestamp);
      var timeStr = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      var dateStr = String(d.getMonth()+1) + '/' + String(d.getDate());
      html += '<div class="history-item">' +
        '<div class="history-left">' +
          '<div class="history-icon">\u{1F41F}</div>' +
          '<div class="history-info">' +
            '<div class="history-time">' + formatTimeLong(s.duration) + '</div>' +
            '<div class="history-date">' + dateStr + ' ' + timeStr + ' 开始</div>' +
          '</div>' +
        '</div>' +
        '<div class="history-duration">' + formatTimeShort(s.duration) + '</div>' +
      '</div>';
    }
    historyList.innerHTML = html;
  }

  // ===== Boss Mode =====
  window.activateBossMode = function() {
    state.bossModeActive = true;
    bossMode.classList.add('active');
    bossExitBtn.classList.remove('show');
    setTimeout(function() {
      bossExitBtn.classList.add('show');
    }, 3000);
  };

  window.deactivateBossMode = function() {
    state.bossModeActive = false;
    bossMode.classList.remove('active');
    bossExitBtn.classList.remove('show');
  };

  function generateBossTable() {
    var rows = [];
    var months = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
    var depts = ['研发部','产品部','设计部','市场部','运营部','销售部','人事部','财务部','行政部','客服部','法务部','总经办'];
    for (var i = 0; i < 15; i++) {
      var row = '<tr><td>' + (i+1) + '</td>';
      row += '<td>' + months[i % 12] + '</td>';
      row += '<td class="num">' + (Math.floor(Math.random()*50000)+10000) + '</td>';
      row += '<td class="num">' + (Math.floor(Math.random()*30000)+5000) + '</td>';
      row += '<td class="num">' + (Math.floor(Math.random()*20000)+3000) + '</td>';
      row += '<td class="num">' + (Math.floor(Math.random()*15)+5) + '%</td>';
      row += '<td class="num">' + (Math.floor(Math.random()*8000)+1000) + '</td>';
      row += '</tr>';
      rows.push(row);
    }
    bossTableBody.innerHTML = rows.join('');
  }

  // ===== Share =====
  window.showShareCard = function() {
    var totalToday = state.data.totalToday + (state.isRunning ? state.elapsedSeconds : 0);
    document.getElementById('shareTotal').textContent = formatTimeShort(totalToday);
    document.getElementById('shareBest').textContent = formatTimeShort(state.data.bestRecord);
    document.getElementById('shareCount').textContent = state.data.sessions.length;

    var achHtml = '';
    for (var i = 0; i < ACHIEVEMENTS.length; i++) {
      var unlocked = state.unlockedAchievements.indexOf(ACHIEVEMENTS[i].id) !== -1;
      achHtml += '<div class="share-achievement-badge ' + (unlocked ? '' : 'locked') + '">' +
        ACHIEVEMENTS[i].icon + '</div>';
    }
    document.getElementById('shareAchievements').innerHTML = achHtml;

    shareModal.classList.add('active');
  };

  window.hideShareCard = function() {
    shareModal.classList.remove('active');
  };

  shareModal.addEventListener('click', function(e) {
    if (e.target === shareModal) {
      hideShareCard();
    }
  });

  // ===== Helpers =====
  function formatTimeShort(seconds) {
    if (seconds < 60) return seconds + 's';
    var m = Math.floor(seconds / 60);
    if (m < 60) return m + 'm';
    var h = Math.floor(m / 60);
    var rm = m % 60;
    if (rm === 0) return h + 'h';
    return h + 'h' + rm + 'm';
  }

  function formatTimeLong(seconds) {
    var h = Math.floor(seconds / 3600);
    var m = Math.floor((seconds % 3600) / 60);
    var s = seconds % 60;
    if (h > 0) return h + '时' + m + '分' + s + '秒';
    if (m > 0) return m + '分' + s + '秒';
    return s + '秒';
  }

  // ===== Init =====
  init();
})();

// 监听暗色模式变化
window.addEventListener('storage', function(e) {
  if (e.key === 'darkMode') {
    if (e.newValue === 'true') {
      document.documentElement.classList.add('dark-mode');
    } else {
      document.documentElement.classList.remove('dark-mode');
    }
  }
});
</script>
</body>
