<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>翻一张 · 牛马自救指南</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #F5EDE0 0%, #EDE4D8 40%, #E8DDD0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
    overflow-x: hidden;
    padding: 20px;
    position: relative;
  }
  
  /* 背景装饰 */
  body::before {
    content: '';
    position: fixed;
    top: -20%; left: -20%;
    width: 60%; height: 60%;
    background: radial-gradient(circle, rgba(212,160,60,0.06) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -10%; right: -10%;
    width: 50%; height: 50%;
    background: radial-gradient(circle, rgba(196,168,130,0.08) 0%, transparent 60%);
    pointer-events: none;
  }
  
  .page-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 28px;
    color: #5A4A3A;
    margin-bottom: 8px;
    letter-spacing: 4px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .page-subtitle {
    font-size: 13px;
    color: #9A8B7B;
    margin-bottom: 32px;
    letter-spacing: 2px;
    position: relative;
    z-index: 1;
  }
  
  /* 3D翻转场景 */
  .scene {
    width: 320px;
    height: 480px;
    perspective: 1200px;
    position: relative;
    z-index: 1;
  }
  
  .card {
    width: 100%;
    height: 100%;
    position: relative;
    cursor: pointer;
  }
  
  .card-face {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(61,50,41,0.15), 0 4px 12px rgba(61,50,41,0.08);
    transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }
  
  .card-front {
    transform: rotateY(0deg);
    opacity: 1;
    z-index: 2;
  }
  .card-back {
    transform: rotateY(180deg);
    opacity: 0;
    z-index: 1;
  }
  
  .card.flipped .card-front {
    transform: rotateY(-180deg);
    opacity: 0;
    z-index: 1;
  }
  .card.flipped .card-back {
    transform: rotateY(0deg);
    opacity: 1;
    z-index: 2;
  }
  
  /* ===== 正面：封面（小牛马） ===== */
  .card-front {
    background: linear-gradient(160deg, #FFFBF5 0%, #F5EDE0 50%, #EDE4D8 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .card-front::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 24px;
    padding: 2.5px;
    background: linear-gradient(135deg, #E8D5C0, #D4B896, #C4A882, #E8D5C0);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0.7;
  }
  
  /* 四角装饰 */
  .corner-decor {
    position: absolute;
    width: 24px; height: 24px;
    opacity: 0.3;
    z-index: 2;
  }
  .corner-decor::before, .corner-decor::after {
    content: '';
    position: absolute;
    background: linear-gradient(135deg, #C4A882, #A68B6A);
  }
  .corner-tl { top: 18px; left: 18px; }
  .corner-tl::before { top: 0; left: 0; width: 18px; height: 2px; }
  .corner-tl::after { top: 0; left: 0; width: 2px; height: 18px; }
  .corner-tr { top: 18px; right: 18px; }
  .corner-tr::before { top: 0; right: 0; width: 18px; height: 2px; }
  .corner-tr::after { top: 0; right: 0; width: 2px; height: 18px; }
  .corner-bl { bottom: 18px; left: 18px; }
  .corner-bl::before { bottom: 0; left: 0; width: 18px; height: 2px; }
  .corner-bl::after { bottom: 0; left: 0; width: 2px; height: 18px; }
  .corner-br { bottom: 18px; right: 18px; }
  .corner-br::before { bottom: 0; right: 0; width: 18px; height: 2px; }
  .corner-br::after { bottom: 0; right: 0; width: 2px; height: 18px; }
  
  .front-mascot-wrap {
    position: relative;
    width: 200px;
    height: 200px;
    margin-bottom: 24px;
    z-index: 1;
  }
  .front-mascot-wrap::before {
    content: '';
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    border: 1.5px solid rgba(196,168,130,0.25);
    animation: ringPulse 3s ease-in-out infinite;
  }
  @keyframes ringPulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.05); opacity: 1; }
  }
  .front-mascot {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 8px 24px rgba(139,115,85,0.2);
    animation: gentleFloat 4s ease-in-out infinite;
  }
  @keyframes gentleFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  
  .front-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 36px;
    background: linear-gradient(135deg, #D4834A, #C4703A, #B8652E);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 6px;
    margin-bottom: 8px;
    z-index: 1;
    filter: drop-shadow(0 2px 4px rgba(139,115,85,0.1));
  }
  .front-hint {
    font-size: 13px;
    color: #9A8B7B;
    letter-spacing: 3px;
    z-index: 1;
  }
  .front-tap-hint {
    position: absolute;
    bottom: 28px;
    font-size: 11px;
    color: #B8A99A;
    letter-spacing: 2px;
    z-index: 1;
    animation: tapHint 2s ease-in-out infinite;
  }
  @keyframes tapHint {
    0%, 100% { opacity: 0.5; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-3px); }
  }
  
  /* ===== 背面：内容（配图+文字） ===== */
  .card-back {
    transform: rotateY(180deg);
    background: #FFFBF5;
    display: flex;
    flex-direction: column;
  }
  
  .back-image-wrap {
    width: 100%;
    height: 55%;
    position: relative;
    overflow: hidden;
  }
  .back-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .back-image-overlay {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    height: 60%;
    background: linear-gradient(to top, rgba(255,251,245,1) 0%, rgba(255,251,245,0.8) 40%, transparent 100%);
    pointer-events: none;
  }
  
  .back-content {
    flex: 1;
    padding: 0 28px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }
  
  .back-quote-mark {
    font-size: 48px;
    line-height: 1;
    color: rgba(196,168,130,0.25);
    font-family: 'Noto Serif SC', serif;
    position: absolute;
    top: -16px;
    left: 20px;
  }
  
  .back-text {
    font-size: 16px;
    line-height: 1.9;
    color: #5A4A3A;
    text-align: center;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
    font-weight: 400;
  }
  
  .back-author {
    margin-top: 16px;
    text-align: center;
    font-size: 12px;
    color: #9A8B7B;
    letter-spacing: 2px;
  }
  .back-author::before {
    content: '—— ';
  }
  
  .back-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    justify-content: center;
  }
  .back-btn {
    padding: 10px 24px;
    border-radius: 20px;
    border: 1px solid rgba(196,168,130,0.4);
    background: transparent;
    color: #8A7B6B;
    font-size: 13px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
  }
  .back-btn:hover {
    background: rgba(196,168,130,0.1);
    border-color: rgba(196,168,130,0.6);
  }
  .back-btn.primary {
    background: linear-gradient(135deg, #D4834A, #C4703A);
    color: #fff;
    border: none;
    box-shadow: 0 4px 12px rgba(196,112,58,0.25);
  }
  .back-btn.primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(196,112,58,0.35);
  }
  
  /* 稀有度角标 */
  .rarity-tag {
    position: absolute;
    top: 14px;
    right: 14px;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    z-index: 3;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .rarity-tag.n { background: rgba(180,170,160,0.25); color: #8A7B6B; }
  .rarity-tag.r { background: rgba(123,166,138,0.2); color: #5A8A6A; }
  .rarity-tag.sr { background: rgba(123,174,212,0.2); color: #4A8AAA; }
  .rarity-tag.ssr { background: rgba(155,123,212,0.2); color: #7A5AAA; }
  
  /* 流光扫过 */
  .shine-sweep {
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    pointer-events: none;
    z-index: 4;
  }
  .card.flipped .shine-sweep {
    animation: shineMove 1.2s ease forwards;
  }
  @keyframes shineMove {
    0% { left: -100%; }
    100% { left: 200%; }
  }
  
  /* 底部提示 */
  .bottom-hint {
    margin-top: 32px;
    font-size: 12px;
    color: #B8A99A;
    letter-spacing: 2px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  
  @media (max-width: 360px) {
    .scene { width: 280px; height: 420px; }
    .front-title { font-size: 30px; }
    .front-mascot-wrap { width: 170px; height: 170px; }
    .back-text { font-size: 14px; }
  }
</style>
</head>
<body>

<h1 class="page-title">给今天的你</h1>
<p class="page-subtitle">每天一张，翻完明天再来</p>

<div class="scene">
  <div class="card" id="card">
    
    <!-- 正面：封面（小牛马） -->
    <div class="card-face card-front">
      <div class="corner-decor corner-tl"></div>
      <div class="corner-decor corner-tr"></div>
      <div class="corner-decor corner-bl"></div>
      <div class="corner-decor corner-br"></div>
      
      <div class="front-mascot-wrap">
        <img class="front-mascot" src="assets-h5/mascot-calf-refined.jpg" alt="小牛马">
      </div>
      <div class="front-title">翻一张</div>
      <div class="front-hint">点我，有小惊喜</div>
      <div class="front-tap-hint">点击翻转</div>
    </div>
    
    <!-- 背面：内容（配图+文字） -->
    <div class="card-face card-back">
      <div class="shine-sweep"></div>
      <span class="rarity-tag n" id="rarityTag">N卡</span>
      
      <div class="back-image-wrap">
        <img class="back-image" id="backImage" src="assets-h5/card-back-illustration.jpg" alt="配图">
        <div class="back-image-overlay"></div>
      </div>
      
      <div class="back-content">
        <div class="back-quote-mark">"</div>
        <p class="back-text" id="backText">
          有时候，停下来不是为了放弃，<br>而是为了看清方向。<br><br>你不必成为太阳，<br>做一盏温暖的灯也很好。
        </p>
        <div class="back-author">小牛马</div>
        <div class="back-actions">
          <button class="back-btn" onclick="event.stopPropagation(); collectCard()">收藏</button>
          <button class="back-btn primary" onclick="event.stopPropagation(); flipAgain()">再翻一张</button>
        </div>
      </div>
    </div>
    
  </div>
</div>

<p class="bottom-hint" id="bottomHint">今天还剩 3 次机会</p>

<script>
// 卡片数据
var cards = [
  {
    text: "有时候，停下来不是为了放弃，<br>而是为了看清方向。<br><br>你不必成为太阳，<br>做一盏温暖的灯也很好。",
    rarity: "n",
    rarityLabel: "N卡"
  },
  {
    text: "允许自己今天不完美，<br>这是对自己最大的温柔。<br><br>累了就歇一会儿，<br>世界不会因为你的暂停而崩塌。",
    rarity: "r",
    rarityLabel: "R卡"
  },
  {
    text: "那些你以为过不去的坎，<br>回头看，不过是人生路上的小石子。<br><br>你不是一个人在走，<br>小牛马一直在这里。",
    rarity: "sr",
    rarityLabel: "SR卡"
  },
  {
    text: "你已经在很努力生活了，<br>这本身就值得被骄傲。<br><br>今天的你，<br>比昨天更勇敢了一点点。",
    rarity: "ssr",
    rarityLabel: "SSR卡"
  }
];

var currentIndex = 0;
var flipsLeft = 3;

var card = document.getElementById('card');
var backText = document.getElementById('backText');
var rarityTag = document.getElementById('rarityTag');
var bottomHint = document.getElementById('bottomHint');

// 点击翻转
card.addEventListener('click', function(e) {
  if (card.classList.contains('flipped')) return;
  if (flipsLeft <= 0) {
    alert('今天的机会用完了，明天再来吧～');
    return;
  }
  card.classList.add('flipped');
  flipsLeft--;
  bottomHint.textContent = '今天还剩 ' + flipsLeft + ' 次机会';
});

// 再翻一张
function flipAgain() {
  if (flipsLeft <= 0) {
    alert('今天的机会用完了，明天再来吧～');
    return;
  }
  // 先翻回去
  card.classList.remove('flipped');
  setTimeout(function() {
    // 换内容
    currentIndex = (currentIndex + 1) % cards.length;
    var data = cards[currentIndex];
    backText.innerHTML = data.text;
    rarityTag.className = 'rarity-tag ' + data.rarity;
    rarityTag.textContent = data.rarityLabel;
    // 再翻出来
    setTimeout(function() {
      card.classList.add('flipped');
      flipsLeft--;
      bottomHint.textContent = '今天还剩 ' + flipsLeft + ' 次机会';
    }, 400);
  }, 400);
}

// 收藏
function collectCard() {
  alert('已收藏到卡册～');
}
</script>

</body>
</html>
