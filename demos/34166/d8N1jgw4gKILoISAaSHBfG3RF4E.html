<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixFlow 文本 MVP</title>
  <style>
    :root {
      --ink: #171512;
      --muted: #746f66;
      --paper: #f7f1e6;
      --panel: rgba(255, 252, 244, .82);
      --line: rgba(23, 21, 18, .14);
      --accent: #ff6a3d;
      --accent-2: #1f6f63;
      --warn: #ffc857;
      --shadow: 0 24px 80px rgba(36, 28, 18, .16);
      --radius: 28px;
      --mono: "SFMono-Regular", "Menlo", "Consolas", monospace;
      --serif: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
      --sans: "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 106, 61, .18), transparent 30%),
        radial-gradient(circle at 88% 0%, rgba(31, 111, 99, .14), transparent 26%),
        linear-gradient(135deg, #fbf6ea 0%, var(--paper) 48%, #efe4d2 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .33;
      background-image:
        linear-gradient(rgba(23, 21, 18, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 21, 18, .035) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, #000, transparent 85%);
    }

    .shell {
      position: relative;
      width: min(1480px, calc(100vw - 36px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    header {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 24px;
      align-items: end;
      margin-bottom: 22px;
    }

    .brand {
      padding: 26px 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 252, 244, .58);
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 46px rgba(36, 28, 18, .08);
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      color: var(--accent-2);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .kicker::before {
      content: "";
      width: 34px;
      height: 2px;
      background: var(--accent-2);
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(42px, 6vw, 88px);
      line-height: .92;
      letter-spacing: -.06em;
    }

    .tagline {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .intent-box {
      padding: 20px;
      border: 1px solid rgba(23, 21, 18, .18);
      border-radius: var(--radius);
      background: #171512;
      color: #fff8ea;
      box-shadow: var(--shadow);
    }

    .intent-box label {
      display: block;
      margin-bottom: 10px;
      color: rgba(255, 248, 234, .68);
      font-size: 13px;
      font-weight: 700;
    }

    .intent-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    input[type="text"] {
      width: 100%;
      min-height: 48px;
      padding: 0 16px;
      border: 1px solid rgba(255, 248, 234, .18);
      border-radius: 16px;
      outline: none;
      background: rgba(255, 255, 255, .08);
      color: #fff8ea;
      font-size: 15px;
    }

    input[type="text"]::placeholder { color: rgba(255, 248, 234, .42); }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      color: var(--ink);
      background: #fff7e8;
      font-weight: 800;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, .12);
    }

    .primary {
      background: var(--accent);
      color: #fffaf0;
    }

    .ghost {
      border: 1px solid var(--line);
      background: rgba(255, 252, 244, .72);
    }

    .workbench {
      display: grid;
      grid-template-columns: 1fr 340px 1fr;
      gap: 18px;
      align-items: stretch;
    }

    .pane, .nodes {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .pane-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .28);
    }

    .pane-title {
      margin: 0;
      font-family: var(--serif);
      font-size: 24px;
      letter-spacing: -.04em;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .upload {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 0 14px;
      border: 1px dashed rgba(23, 21, 18, .32);
      border-radius: 999px;
      color: var(--accent-2);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      overflow: hidden;
    }

    .upload input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      height: 560px;
      resize: vertical;
      border: 0;
      outline: none;
      padding: 22px;
      color: var(--ink);
      background: transparent;
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.85;
    }

    .output {
      height: 560px;
      padding: 22px;
      overflow: auto;
      white-space: pre-wrap;
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.85;
    }

    .empty {
      color: rgba(23, 21, 18, .38);
    }

    .nodes {
      display: flex;
      flex-direction: column;
      min-height: 640px;
    }

    .nodes-head {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
    }

    .nodes-head h2 {
      margin: 0 0 6px;
      font-family: var(--serif);
      font-size: 24px;
      letter-spacing: -.04em;
    }

    .node-list {
      flex: 1;
      padding: 12px;
      overflow: auto;
      max-height: 474px;
    }

    .node {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      padding: 12px;
      border: 1px solid transparent;
      border-radius: 18px;
      cursor: pointer;
    }

    .node:hover {
      border-color: rgba(23, 21, 18, .12);
      background: rgba(255, 255, 255, .36);
    }

    .node input { margin-top: 4px; accent-color: var(--accent); }

    .node strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .node span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .controls {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--line);
    }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 18px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, .22);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border: 1px solid rgba(23, 21, 18, .12);
      border-radius: 999px;
      background: rgba(255, 255, 255, .5);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    mark.ai {
      padding: 2px 5px;
      border-radius: 7px;
      background: rgba(255, 200, 87, .5);
      color: #5b3b00;
    }

    mark.dup {
      padding: 2px 5px;
      border-radius: 7px;
      background: rgba(31, 111, 99, .18);
      color: #164f46;
    }

    .notice {
      margin: 14px 0 0;
      color: rgba(255, 248, 234, .56);
      font-size: 12px;
      line-height: 1.6;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 20;
      transform: translateX(-50%) translateY(20px);
      padding: 12px 16px;
      border-radius: 999px;
      background: #171512;
      color: #fff8ea;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1180px) {
      header, .workbench { grid-template-columns: 1fr; }
      .nodes { min-height: auto; }
      .node-list { max-height: none; }
      textarea, .output { height: 420px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <section class="brand">
        <div class="kicker">Copy → Fix → Use</div>
        <h1>FixFlow<br />文本修复 MVP</h1>
        <p class="tagline">AI 只负责理解需求和勾选节点，不直接改写正文。真正修改来自可见、可控、可解释的格式修复节点。</p>
      </section>

      <section class="intent-box">
        <label for="intent">你想怎么处理这份内容？</label>
        <div class="intent-row">
          <input id="intent" type="text" placeholder="例如：去掉 Markdown，修复 PDF 换行，提示疑似 AI 废话" />
          <button class="primary" id="autoSelect">智能选择节点</button>
        </div>
        <p class="notice">当前原型用关键词模拟“大模型节点选择”。后续接入大模型时，只替换这一层，文本仍由确定性节点处理。</p>
      </section>
    </header>

    <section class="workbench">
      <article class="pane">
        <div class="pane-head">
          <div>
            <h2 class="pane-title">原始文本</h2>
            <div class="hint">粘贴文本，或上传 TXT / MD / CSV / JSON / HTML / RTF</div>
          </div>
          <label class="upload">
            上传文件
            <input id="fileInput" type="file" accept=".txt,.md,.csv,.json,.html,.htm,.rtf,text/*" />
          </label>
        </div>
        <textarea id="source" placeholder="把需要修复的文本粘贴到这里。"></textarea>
      </article>

      <aside class="nodes">
        <div class="nodes-head">
          <h2>能力节点</h2>
          <div class="hint">自然语言选择和手动勾选共用同一套执行顺序。</div>
        </div>
        <div class="node-list" id="nodeList"></div>
        <div class="controls">
          <button class="primary" id="run">一键修复</button>
          <div class="controls-row">
            <button class="ghost" id="selectDefault">默认流程</button>
            <button class="ghost" id="clearNodes">清空节点</button>
          </div>
        </div>
      </aside>

      <article class="pane">
        <div class="pane-head">
          <div>
            <h2 class="pane-title">修复结果</h2>
            <div class="hint">黄色为疑似 AI 无效内容，绿色为重复内容提示。</div>
          </div>
          <button class="primary" id="copy">一键复制</button>
        </div>
        <div class="output empty" id="output">修复后的文本会显示在这里。</div>
        <div class="stats" id="stats">
          <span class="pill">待处理</span>
        </div>
        <div class="stats">
          <button class="ghost" id="downloadTxt">下载 TXT</button>
          <button class="ghost" id="downloadDoc">下载 DOC</button>
          <button class="ghost" id="downloadPdf">下载 PDF</button>
        </div>
      </article>
    </section>
  </main>

  <div class="toast" id="toast">已完成</div>

  <script>
    const nodes = [
      { id: "basic_clean", name: "文本基础清理", desc: "清理零宽字符、异常控制字符，统一换行。", default: true, keywords: ["基础", "脏字符", "乱码", "清理"] },
      { id: "full_half", name: "全角半角转换", desc: "将全角英文字母和数字转半角，降低后续识别干扰。", default: false, keywords: ["全角", "半角", "数字", "英文"] },
      { id: "pdf_linebreak", name: "PDF 换行修复", desc: "合并 PDF 复制造成的错误断行，保留自然段。", default: true, keywords: ["pdf", "换行", "断行", "复制"] },
      { id: "ocr_fix", name: "OCR 修复", desc: "修复少量高置信 OCR 空格和常见误识别问题。", default: false, keywords: ["ocr", "识别", "扫描"] },
      { id: "markdown_clean", name: "Markdown 清洗", desc: "去除标题、加粗、反引号、引用等常见 Markdown 标记。", default: true, keywords: ["markdown", "md", "井号", "星号", "反引号"] },
      { id: "emoji_clean", name: "Emoji 清理", desc: "删除 Emoji 和部分装饰性表情符号。", default: false, keywords: ["emoji", "表情", "图标"] },
      { id: "duplicate_detect", name: "重复内容检测", desc: "检测重复段落并高亮，不默认删除。", default: false, keywords: ["重复", "去重", "重复内容"] },
      { id: "ai_detect", name: "疑似 AI 套话检测", desc: "高亮“如果你需要我可以”等疑似无效内容，不默认删除。", default: true, keywords: ["ai", "废话", "套话", "无效", "如果你", "当然可以"] },
      { id: "punctuation", name: "标点规范", desc: "统一常见中文标点，修复重复标点和标点前空格。", default: true, keywords: ["标点", "逗号", "句号", "符号"] },
      { id: "space", name: "空格整理", desc: "删除中文间多余空格，保留中英文和数字间必要空格。", default: true, keywords: ["空格", "间距"] },
      { id: "paragraph", name: "段落整理", desc: "压缩多余空行，整理段落边界。", default: true, keywords: ["段落", "排版", "整理"] },
      { id: "output_format", name: "输出格式整理", desc: "做最后的交付格式整理，不改变原文含义。", default: false, keywords: ["微信", "邮件", "正式", "交付", "发送"] }
    ];

    const state = {
      result: "",
      annotations: [],
      selected: new Set(nodes.filter(n => n.default).map(n => n.id))
    };

    const $ = selector => document.querySelector(selector);
    const source = $("#source");
    const output = $("#output");
    const stats = $("#stats");
    const toast = $("#toast");

    function renderNodes() {
      $("#nodeList").innerHTML = nodes.map(node => `
        <label class="node">
          <input type="checkbox" data-node="${node.id}" ${state.selected.has(node.id) ? "checked" : ""} />
          <span>
            <strong>${node.name}</strong>
            <span>${node.desc}</span>
          </span>
        </label>
      `).join("");

      document.querySelectorAll("[data-node]").forEach(input => {
        input.addEventListener("change", event => {
          const id = event.target.dataset.node;
          event.target.checked ? state.selected.add(id) : state.selected.delete(id);
        });
      });
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1600);
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }

    function basicClean(text) {
      return text
        .replace(/^\uFEFF/, "")
        .replace(/[\u200B-\u200D\u2060]/g, "")
        .replace(/\r\n?/g, "\n")
        .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, "");
    }

    function toHalfWidth(text) {
      return text.replace(/[Ａ-Ｚａ-ｚ０-９]/g, char =>
        String.fromCharCode(char.charCodeAt(0) - 0xFEE0)
      );
    }

    function fixPdfLinebreaks(text) {
      const lines = text.split("\n");
      const result = [];
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        const next = (lines[i + 1] || "").trim();
        if (!line) {
          if (result[result.length - 1] !== "") result.push("");
          continue;
        }
        const endSentence = /[。！？!?；;：:]$/.test(line);
        const nextStartsList = /^([\-*•]|\d+[.)、]|[一二三四五六七八九十]+[、.])/.test(next);
        const nextLooksLikeNewSentence = /^(当然|以下|如果|希望|这是|这段|本文|第一|第二|第三)/.test(next);
        if (next && !endSentence && !nextStartsList && !nextLooksLikeNewSentence && line.length < 80) {
          result.push(line + (/[A-Za-z0-9]$/.test(line) && /^[A-Za-z0-9]/.test(next) ? " " : ""));
        } else {
          result.push(line + "\n");
        }
      }
      return result.join("").replace(/\n{3,}/g, "\n\n").trim();
    }

    function fixOcr(text) {
      return text
        .replace(/([一-龥])[ \t]+([一-龥])/g, "$1$2")
        .replace(/([。！？；：，、])[ \t]+/g, "$1")
        .replace(/曰(?=[一-龥])/g, "日")
        .replace(/([一-龥])0([一-龥])/g, "$1〇$2");
    }

    function cleanMarkdown(text) {
      return text
        .replace(/^#{1,6}\s+/gm, "")
        .replace(/^>\s?/gm, "")
        .replace(/```[\s\S]*?```/g, block => block.replace(/```[a-zA-Z]*\n?/g, "").replace(/```/g, ""))
        .replace(/`([^`]+)`/g, "$1")
        .replace(/\*\*([^*]+)\*\*/g, "$1")
        .replace(/\*([^*]+)\*/g, "$1")
        .replace(/__([^_]+)__/g, "$1")
        .replace(/~~([^~]+)~~/g, "$1")
        .replace(/^\s*[-*+]\s+/gm, "")
        .replace(/^\s*\d+\.\s+/gm, "")
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, "$1");
    }

    function cleanEmoji(text) {
      return text.replace(/[\p{Extended_Pictographic}\uFE0F]/gu, "");
    }

    function normalizePunctuation(text) {
      return text
        .replace(/，{2,}/g, "，")
        .replace(/。{2,}/g, "。")
        .replace(/！{2,}/g, "！")
        .replace(/？{2,}/g, "？")
        .replace(/\.{3,}/g, "……")
        .replace(/\s+([，。！？；：、])/g, "$1")
        .replace(/([，。！？；：、])([^\s\n])/g, "$1$2")
        .replace(/,{1}(?=[\u4e00-\u9fa5])/g, "，")
        .replace(/\?{1}(?=$|[\s\n]|[\u4e00-\u9fa5])/g, "？")
        .replace(/!{1}(?=$|[\s\n]|[\u4e00-\u9fa5])/g, "！");
    }

    function normalizeSpaces(text) {
      let normalized = text.replace(/[ \t]{2,}/g, " ");
      let previous = "";
      while (previous !== normalized) {
        previous = normalized;
        normalized = normalized
          .replace(/([一-龥])[ \t]+([一-龥])/g, "$1$2")
          .replace(/([一-龥])[ \t]+([，。！？；：、])/g, "$1$2")
          .replace(/([（《【])[ \t]+/g, "$1")
          .replace(/[ \t]+([）》】])/g, "$1")
          .replace(/([A-Za-z0-9])[ \t]*([一-龥])/g, "$1 $2")
          .replace(/([一-龥])[ \t]*([A-Za-z0-9])/g, "$1 $2");
      }
      return normalized
        .replace(/[ \t]{2,}/g, " ")
        .replace(/[ \t]+\n/g, "\n")
        .replace(/\n[ \t]+/g, "\n");
    }

    function formatParagraphs(text) {
      return text
        .split("\n")
        .map(line => line.trim())
        .join("\n")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
    }

    function finalOutputFormat(text) {
      return text
        .replace(/([。！？])([^\n])/g, "$1\n$2")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
    }

    function detectAiBoilerplate(text) {
      const patterns = [
        /当然可以[，,。！!：:]?/g,
        /以下是.{0,12}(优化|整理|修改|润色).{0,8}(版本|内容)[：:]?/g,
        /如果你(需要|愿意|想要).{0,30}(我可以|可以继续|还可以).{0,40}/g,
        /希望(这|以上).{0,20}(帮到你|对你有帮助).{0,10}/g,
        /你可以根据.{0,20}(自行|实际情况).{0,20}(调整|修改).{0,10}/g
      ];
      return patterns.flatMap(pattern => [...text.matchAll(pattern)].map(match => ({
        start: match.index,
        end: match.index + match[0].length,
        type: "ai",
        label: "疑似 AI 无效内容"
      })));
    }

    function detectDuplicates(text) {
      const seen = new Map();
      const ranges = [];
      let cursor = 0;
      text.split(/\n+/).forEach(paragraph => {
        const trimmed = paragraph.trim();
        const start = text.indexOf(paragraph, cursor);
        cursor = start + paragraph.length;
        if (trimmed.length < 6) return;
        const key = trimmed.replace(/\s/g, "");
        if (seen.has(key)) {
          ranges.push({ start, end: start + paragraph.length, type: "dup", label: "重复内容" });
        } else {
          seen.set(key, true);
        }
      });
      return ranges;
    }

    function renderOutput(text, annotations) {
      if (!text) {
        output.className = "output empty";
        output.textContent = "修复后的文本会显示在这里。";
        return;
      }
      output.className = "output";
      const sorted = annotations
        .filter(a => a.start >= 0 && a.end > a.start)
        .sort((a, b) => a.start - b.start)
        .filter((a, index, arr) => index === 0 || a.start >= arr[index - 1].end);
      let html = "";
      let cursor = 0;
      sorted.forEach(a => {
        html += escapeHtml(text.slice(cursor, a.start));
        html += `<mark class="${a.type}" title="${a.label}">${escapeHtml(text.slice(a.start, a.end))}</mark>`;
        cursor = a.end;
      });
      html += escapeHtml(text.slice(cursor));
      output.innerHTML = html;
    }

    function renderStats(applied, annotations) {
      const aiCount = annotations.filter(a => a.type === "ai").length;
      const dupCount = annotations.filter(a => a.type === "dup").length;
      stats.innerHTML = `
        <span class="pill">已执行 ${applied.length} 个节点</span>
        <span class="pill">疑似 AI 无效内容 ${aiCount} 处</span>
        <span class="pill">重复内容 ${dupCount} 处</span>
      `;
    }

    function runWorkflow() {
      let text = source.value;
      const applied = [];
      let annotations = [];
      const has = id => state.selected.has(id);
      const apply = (id, fn) => {
        if (!has(id)) return;
        text = fn(text);
        applied.push(nodes.find(n => n.id === id).name);
      };

      apply("basic_clean", basicClean);
      apply("full_half", toHalfWidth);
      apply("pdf_linebreak", fixPdfLinebreaks);
      apply("ocr_fix", fixOcr);
      apply("markdown_clean", cleanMarkdown);
      apply("emoji_clean", cleanEmoji);
      apply("punctuation", normalizePunctuation);
      apply("space", normalizeSpaces);
      apply("paragraph", formatParagraphs);
      apply("output_format", finalOutputFormat);

      if (has("duplicate_detect")) {
        annotations = annotations.concat(detectDuplicates(text));
        applied.push("重复内容检测");
      }
      if (has("ai_detect")) {
        annotations = annotations.concat(detectAiBoilerplate(text));
        applied.push("疑似 AI 套话检测");
      }

      state.result = text;
      state.annotations = annotations;
      renderOutput(text, annotations);
      renderStats(applied, annotations);
      showToast("修复完成");
    }

    function autoSelectNodes() {
      const intent = $("#intent").value.trim().toLowerCase();
      if (!intent) {
        showToast("先输入处理需求");
        return;
      }
      state.selected.clear();
      state.selected.add("basic_clean");
      nodes.forEach(node => {
        if (node.keywords.some(keyword => intent.includes(keyword.toLowerCase()))) {
          state.selected.add(node.id);
        }
      });
      if (/(整理|规范|干净|直接发|交付|修复)/.test(intent)) {
        ["punctuation", "space", "paragraph"].forEach(id => state.selected.add(id));
      }
      renderNodes();
      showToast("已按需求勾选节点");
    }

    function downloadBlob(filename, type, content) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function downloadTxt() {
      downloadBlob("fixflow-result.txt", "text/plain;charset=utf-8", state.result || source.value);
    }

    function downloadDoc() {
      const content = `<!doctype html><html><head><meta charset="utf-8"></head><body><pre style="font-family:宋体;white-space:pre-wrap;line-height:1.8;">${escapeHtml(state.result || source.value)}</pre></body></html>`;
      downloadBlob("fixflow-result.doc", "application/msword;charset=utf-8", content);
    }

    function makePdfObject(objects, body) {
      objects.push(body);
      return objects.length;
    }

    async function downloadPdf() {
      const text = state.result || source.value;
      if (!text.trim()) {
        showToast("没有可导出的文本");
        return;
      }

      const pageW = 1240;
      const pageH = 1754;
      const margin = 96;
      const lineH = 36;
      const fontSize = 24;
      const canvas = document.createElement("canvas");
      canvas.width = pageW;
      canvas.height = pageH;
      const ctx = canvas.getContext("2d");

      function wrapLines(raw) {
        ctx.font = `${fontSize}px Songti SC, STSong, serif`;
        const maxW = pageW - margin * 2;
        const lines = [];
        raw.split("\n").forEach(paragraph => {
          if (!paragraph) {
            lines.push("");
            return;
          }
          let line = "";
          for (const char of paragraph) {
            const test = line + char;
            if (ctx.measureText(test).width > maxW && line) {
              lines.push(line);
              line = char;
            } else {
              line = test;
            }
          }
          lines.push(line);
        });
        return lines;
      }

      const lines = wrapLines(text);
      const linesPerPage = Math.floor((pageH - margin * 2) / lineH);
      const pages = [];
      for (let i = 0; i < lines.length; i += linesPerPage) {
        ctx.fillStyle = "#fffdf7";
        ctx.fillRect(0, 0, pageW, pageH);
        ctx.fillStyle = "#171512";
        ctx.font = `${fontSize}px Songti SC, STSong, serif`;
        ctx.textBaseline = "top";
        lines.slice(i, i + linesPerPage).forEach((line, idx) => {
          ctx.fillText(line, margin, margin + idx * lineH);
        });
        const dataUrl = canvas.toDataURL("image/jpeg", .88);
        const binary = atob(dataUrl.split(",")[1]);
        const bytes = new Uint8Array(binary.length);
        for (let j = 0; j < binary.length; j++) bytes[j] = binary.charCodeAt(j);
        pages.push(bytes);
      }

      const objects = [];
      const catalogId = makePdfObject(objects, "<< /Type /Catalog /Pages 2 0 R >>");
      const pageIds = [];
      const imageIds = [];
      const contentIds = [];
      makePdfObject(objects, "");
      pages.forEach((img, index) => {
        const imageId = objects.length + 1;
        imageIds.push(imageId);
        objects.push(`<< /Type /XObject /Subtype /Image /Width ${pageW} /Height ${pageH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n${Array.from(img, b => String.fromCharCode(b)).join("")}\nendstream`);
        const content = `q\n595 0 0 842 0 0 cm\n/Im${index} Do\nQ`;
        const contentId = makePdfObject(objects, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
        contentIds.push(contentId);
        const pageId = makePdfObject(objects, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im${index} ${imageId} 0 R >> >> /Contents ${contentId} 0 R >>`);
        pageIds.push(pageId);
      });
      objects[1] = `<< /Type /Pages /Count ${pageIds.length} /Kids [${pageIds.map(id => `${id} 0 R`).join(" ")}] >>`;

      let pdf = "%PDF-1.4\n";
      const offsets = [0];
      objects.forEach((obj, index) => {
        offsets.push(pdf.length);
        pdf += `${index + 1} 0 obj\n${obj}\nendobj\n`;
      });
      const xref = pdf.length;
      pdf += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
      offsets.slice(1).forEach(offset => {
        pdf += `${String(offset).padStart(10, "0")} 00000 n \n`;
      });
      pdf += `trailer\n<< /Size ${objects.length + 1} /Root ${catalogId} 0 R >>\nstartxref\n${xref}\n%%EOF`;

      const bytes = new Uint8Array(pdf.length);
      for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 0xff;
      downloadBlob("fixflow-result.pdf", "application/pdf", bytes);
    }

    $("#autoSelect").addEventListener("click", autoSelectNodes);
    $("#run").addEventListener("click", runWorkflow);
    $("#selectDefault").addEventListener("click", () => {
      state.selected = new Set(nodes.filter(n => n.default).map(n => n.id));
      renderNodes();
    });
    $("#clearNodes").addEventListener("click", () => {
      state.selected.clear();
      renderNodes();
    });
    $("#copy").addEventListener("click", async () => {
      await navigator.clipboard.writeText(state.result || source.value);
      showToast("已复制");
    });
    $("#downloadTxt").addEventListener("click", downloadTxt);
    $("#downloadDoc").addEventListener("click", downloadDoc);
    $("#downloadPdf").addEventListener("click", downloadPdf);
    $("#fileInput").addEventListener("change", async event => {
      const file = event.target.files[0];
      if (!file) return;
      const text = await file.text();
      source.value = text.replace(/\\par[d]?/g, "\n").replace(/[{}\\][a-z0-9-]+ ?/gi, "");
      showToast("文件已读取");
    });

    renderNodes();
  </script>
</body>
</html>
