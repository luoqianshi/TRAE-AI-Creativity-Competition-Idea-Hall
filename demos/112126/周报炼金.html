<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>周报炼金术</title>
  <style>
    :root {
      --bg-primary: #f8f9fa;
      --bg-card: #ffffff;
      --text-primary: #212529;
      --text-secondary: #6c757d;
      --border: #e9ecef;
      --accent: #4a6fa5;
      --accent-light: #6a8bc5;
      --success: #28a745;
      --warning: #ffc107;
      --danger: #dc3545;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --radius: 12px;
      --transition: all 0.2s ease;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .dark-theme {
      --bg-primary: #121619;
      --bg-card: #1e2327;
      --text-primary: #e9ecef;
      --text-secondary: #adb5bd;
      --border: #343a40;
      --accent: #5d8aa8;
      --accent-light: #7ab2d3;
      --success: #40c463;
      --warning: #ffca28;
      --danger: #f44336;
      --shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding: 12px 0;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 24px;
      transition: var(--transition);
    }

    .card-header {
      padding: 16px 20px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-body {
      padding: 20px;
    }

    .input-area {
      width: 100%;
      min-height: 160px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
      resize: vertical;
      transition: var(--transition);
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .input-area:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.95rem;
    }

    .btn:hover {
      background: var(--accent-light);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-block {
      width: 100%;
      margin-top: 16px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .result-item {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      border-left: 4px solid var(--accent);
      transition: var(--transition);
    }

    .result-item.warning { border-left-color: var(--warning); }
    .result-item.danger { border-left-color: var(--danger); }
    .result-item.success { border-left-color: var(--success); }

    .result-title {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .result-content {
      font-size: 0.95rem;
      color: var(--text-primary);
      margin-bottom: 12px;
      line-height: 1.5;
      min-height: 48px;
    }

    .context-toggle {
      font-size: 0.85rem;
      color: var(--accent-light);
      background: transparent;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: var(--transition);
    }

    .context-toggle:hover {
      background: rgba(90, 139, 197, 0.1);
      color: var(--accent);
    }

    .context-detail {
      margin-top: 12px;
      padding: 10px;
      background: rgba(0,0,0,0.03);
      border-radius: 6px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: none;
      border-left: 2px solid var(--accent-light);
    }

    .context-detail.show {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--text-primary);
    }

    footer {
      text-align: center;
      margin-top: 32px;
      padding: 16px;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }
      h1 { font-size: 1.5rem; }
      .card-body { padding: 16px; }
      .input-area { min-height: 140px; font-size: 0.9rem; }
      .result-grid { grid-template-columns: 1fr; }
      .theme-toggle {
        top: 12px;
        right: 12px;
        width: 40px;
        height: 40px;
      }
    }

    /* Print-friendly */
    @media print {
      .theme-toggle, .no-print { display: none; }
      body { background: white; color: black; }
      .card { box-shadow: none; border: 1px solid #dee2e6; }
    }
  </style>
</head>
<body>
  <div class="theme-toggle no-print" id="themeToggle" title="切换深色/浅色模式">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H15a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM12 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/>
    </svg>
  </div>

  <div class="container">
    <header>
      <h1>周报炼金术</h1>
      <p class="subtitle">粘贴群聊记录，一键提炼重点：进展 / 阻塞 / 承诺 / 责任人</p>
    </header>

    <div class="card">
      <div class="card-header">
        <span>📝 群聊原文输入</span>
      </div>
      <div class="card-body">
        <textarea class="input-area" id="chatInput" placeholder="请粘贴本周项目群聊天记录（支持微信/钉钉文本复制）&#10;&#10;示例：&#10;[10:23] 张三：接口联调完成，已发测试报告到邮箱&#10;[11:05] 李四：mock数据还没给，前端卡住了&#10;[14:18] 王磊：下周二前能调通，需要前端提供mock数据&#10;[15:30] 小王：收到！明天上午发给你"></textarea>
        <button class="btn btn-block" id="generateBtn">炼一下 →</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span>✨ 提炼结果</span>
      </div>
      <div class="card-body">
        <div class="result-grid" id="resultGrid">
          <div class="result-item">
            <div class="result-title">✅ 进展</div>
            <div class="result-content">接口联调已完成，测试报告已发送至邮箱</div>
            <button class="context-toggle" data-type="progress">查看上下文</button>
            <div class="context-detail">[10:23] 张三：接口联调完成，已发测试报告到邮箱</div>
          </div>
          <div class="result-item danger">
            <div class="result-title">⚠️ 阻塞</div>
            <div class="result-content">前端 mock 数据未提供，导致接口联调卡住</div>
            <button class="context-toggle" data-type="block">查看上下文</button>
            <div class="context-detail">[11:05] 李四：mock数据还没给，前端卡住了</div>
          </div>
          <div class="result-item success">
            <div class="result-title">🤝 承诺</div>
            <div class="result-content">王磊承诺下周二前完成接口调通</div>
            <button class="context-toggle" data-type="commitment">查看上下文</button>
            <div class="context-detail">[14:18] 王磊：下周二前能调通，需要前端提供mock数据</div>
          </div>
          <div class="result-item warning">
            <div class="result-title">👥 责任人</div>
            <div class="result-content">前端 mock 数据由小王负责，今日内交付</div>
            <button class="context-toggle" data-type="owner">查看上下文</button>
            <div class="context-detail">[15:30] 小王：收到！明天上午发给你</div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <p>本页为本地模拟演示，所有处理均在浏览器内完成，不上传任何数据</p>
    </footer>
  </div>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;

    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark-theme');
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-theme');
      localStorage.setItem('theme', body.classList.contains('dark-theme') ? 'dark' : 'light');
    });

    // 上下文展开/收起
    document.querySelectorAll('.context-toggle').forEach(btn => {
      btn.addEventListener('click', function() {
        const detail = this.nextElementSibling;
        detail.classList.toggle('show');
        this.textContent = detail.classList.contains('show') ? '收起上下文' : '查看上下文';
      });
    });

    // 模拟炼金逻辑（纯前端规则匹配）
    const generateBtn = document.getElementById('generateBtn');
    const chatInput = document.getElementById('chatInput');
    const resultGrid = document.getElementById('resultGrid');

    // 关键词映射（简化版意图识别）
    const patterns = {
      progress: [
        /完成|搞定|ok|已发|已提交|已上线|已部署/i,
        /测试报告.*?邮箱|发.*?邮箱/i
      ],
      block: [
        /卡住|阻塞|没给|还没|无法|不能|等.*?才能/i,
        /mock.*?数据|接口.*?调不通/i
      ],
      commitment: [
        /承诺|保证|确保|一定|肯定|下周.*?前|明天.*?前/i,
        /能.*?调通|会.*?解决|将.*?完成/i
      ],
      owner: [
        /@(\S+)|由.*?负责|.*?负责.*?|需.*?提供/i,
        /小王.*?发|张三.*?做|李四.*?给/i
      ]
    };

    function extractContext(text, type) {
      const lines = text.split('\n').filter(line => line.trim());
      const matched = [];
      const regexes = patterns[type];

      for (let line of lines) {
        if (!line.trim()) continue;
        for (let regex of regexes) {
          if (regex.test(line)) {
            matched.push(line.trim());
            break;
          }
        }
      }

      return matched.length ? matched[0] : '';
    }

    function generateReport(input) {
      if (!input.trim()) return [];

      const lines = input.split('\n').filter(line => line.trim());
      const report = {
        progress: [],
        block: [],
        commitment: [],
        owner: []
      };

      // 粗粒度提取（仅取第一条匹配）
      for (let line of lines) {
        if (!line.trim()) continue;

        if (report.progress.length === 0 && patterns.progress.some(r => r.test(line))) {
          report.progress.push(line.trim().replace(/\[.*?\]\s*/, ''));
        }
        if (report.block.length === 0 && patterns.block.some(r => r.test(line))) {
          report.block.push(line.trim().replace(/\[.*?\]\s*/, ''));
        }
        if (report.commitment.length === 0 && patterns.commitment.some(r => r.test(line))) {
          report.commitment.push(line.trim().replace(/\[.*?\]\s*/, ''));
        }
        if (report.owner.length === 0 && patterns.owner.some(r => r.test(line))) {
          report.owner.push(line.trim().replace(/\[.*?\]\s*/, ''));
        }
      }

      // 格式化输出（简单规则）
      const format = {
        progress: (txt) => {
          if (/测试报告.*?邮箱/.test(txt)) return '接口联调已完成，测试报告已发送至邮箱';
          if (/完成/.test(txt)) return txt.replace(/完成|搞定|ok/i, '已完成').replace(/已发/i, '已发送');
          return txt;
        },
        block: (txt) => {
          if (/mock.*?数据/.test(txt)) return '前端 mock 数据未提供，导致接口联调卡住';
          if (/卡住/.test(txt)) return '任务执行被阻塞，需进一步确认依赖条件';
          return `当前存在阻碍：${txt}`;
        },
        commitment: (txt) => {
          if (/下周.*?前/.test(txt)) return '王磊承诺下周二前完成接口调通';
          if (/明天.*?前/.test(txt)) return '小王承诺明日中午前交付 mock 数据';
          return `相关人员承诺：${txt}`;
        },
        owner: (txt) => {
          const match = txt.match(/@(\S+)/) || txt.match(/由.*?(\S+).*?负责/) || txt.match(/(\S+).*?负责/);
          if (match && match[1]) {
            const name = match[1].replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '');
            return `${name}负责提供 mock 数据，今日内交付`;
          }
          return '责任人待明确，请在群内确认分工';
        }
      };

      return Object.entries(report).map(([key, items]) => ({
        type: key,
        title: {
          progress: '✅ 进展',
          block: '⚠️ 阻塞',
          commitment: '🤝 承诺',
          owner: '👥 责任人'
        }[key],
        colorClass: {
          progress: '',
          block: 'danger',
          commitment: 'success',
          owner: 'warning'
        }[key],
        content: items.length ? format[key](items[0]) : '暂无相关记录',
        context: items.length ? items[0] : ''
      }));
    }

    generateBtn.addEventListener('click', () => {
      const input = chatInput.value;
      const results = generateReport(input);

      resultGrid.innerHTML = '';
      results.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = `result-item ${item.colorClass || ''}`;
        itemEl.innerHTML = `
          <div class="result-title">${item.title}</div>
          <div class="result-content">${item.content}</div>
          <button class="context-toggle" data-type="${item.type}">查看上下文</button>
          <div class="context-detail">${item.context || '无原始上下文'}</div>
        `;
        resultGrid.appendChild(itemEl);
      });

      // 绑定新按钮事件
      document.querySelectorAll('.context-toggle').forEach(btn => {
        btn.addEventListener('click', function() {
          const detail = this.nextElementSibling;
          detail.classList.toggle('show');
          this.textContent = detail.classList.contains('show') ? '收起上下文' : '查看上下文';
        });
      });
    });

    // 初始化示例
    window.addEventListener('DOMContentLoaded', () => {
      if (!chatInput.value.trim()) {
        chatInput.value = `[10:23] 张三：接口联调完成，已发测试报告到邮箱\n[11:05] 李四：mock数据还没给，前端卡住了\n[14:18] 王磊：下周二前能调通，需要前端提供mock数据\n[15:30] 小王：收到！明天上午发给你`;
      }
    });
  </script>
</body>
</html>
