// ===== LOCAL STORAGE =====
function getProgress() {
  try {
    return JSON.parse(localStorage.getItem('el-progress') || '{}');
  } catch { return {}; }
}

function saveProgress(topicId, step) {
  const p = getProgress();
  if (!p[topicId]) p[topicId] = { step: 0, stars: 0 };
  if (step > p[topicId].step) p[topicId].step = step;
  localStorage.setItem('el-progress', JSON.stringify(p));
}

function getTotalStars() {
  const p = getProgress();
  let total = 0;
  Object.values(p).forEach(v => total += (v.stars || 0));
  return total;
}

function addStars(topicId, count) {
  const p = getProgress();
  if (!p[topicId]) p[topicId] = { step: 0, stars: 0 };
  p[topicId].stars = (p[topicId].stars || 0) + count;
  localStorage.setItem('el-progress', JSON.stringify(p));
  updateStarsDisplay();
}

function updateStarsDisplay() {
  document.getElementById('total-stars').textContent = getTotalStars();
}

function resetProgress() {
  if (confirm('确定要重置所有学习进度吗？\n重置后星星和课程完成记录将全部清空。')) {
    localStorage.removeItem('el-progress');
    updateStarsDisplay();
    renderHome();
    alert('学习进度已重置！');
  }
}

// ===== SPEECH =====
function speak(text, lang, options) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'en-US';
  // 更自然的语速和音调
  u.rate = 0.8;
  u.pitch = 1.15;
  u.volume = 1;

  // 尝试选择更好的英语语音
  const voices = window.speechSynthesis.getVoices();
  if (voices.length > 0) {
    // 优先选择英文女声（更像老师）
    const preferred = voices.find(function(v) {
      return v.lang.startsWith('en') && v.name.toLowerCase().includes('female');
    }) || voices.find(function(v) {
      return v.lang.startsWith('en-US') && !v.localService;
    }) || voices.find(function(v) {
      return v.lang.startsWith('en-US');
    }) || voices.find(function(v) {
      return v.lang.startsWith('en');
    });
    if (preferred) {
      u.voice = preferred;
    }
  }

  // 如果有额外选项（用于不同语气）
  if (options) {
    if (options.rate) u.rate = options.rate;
    if (options.pitch) u.pitch = options.pitch;
    if (options.onEnd) u.onend = options.onEnd;
  }

  window.speechSynthesis.speak(u);
}

// 老师说话 - 更温暖的语气
function teacherSay(text, callback) {
  speak(text, 'en-US', { rate: 0.75, pitch: 1.2, onEnd: callback });
}

// 孩子跟读 - 稍慢的语速
function childListen(text) {
  speak(text, 'en-US', { rate: 0.7, pitch: 1.0 });
}

// ===== SPEECH RECOGNITION & FOLLOW (让孩子说) =====
var isListening = false;
var recognition = null;
var currentTargetWord = '';
var currentBtnId = '';
var listenTimer = null;
var hasSpeechRecognition = false;

// 检测语音识别支持
(function() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  hasSpeechRecognition = !!SR;
})();

function initRecognition() {
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return null;
  var rec = new SpeechRecognition();
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 3;
  rec.continuous = false;
  return rec;
}

// 主入口：点击🎤按钮
function startSpeaking(targetWord, btnId) {
  if (isListening) {
    stopSpeaking();
    return;
  }

  currentTargetWord = targetWord.toLowerCase().trim();
  currentBtnId = btnId;
  var btn = document.getElementById(btnId);
  if (!btn) return;

  // 为了稳定性，所有设备统一使用纯跟读模式（播放2遍）
  // 语音识别在移动端问题太多（需要HTTPS、麦克风权限、网络等）
  startFollowMode(targetWord, btnId);
}

// ===== 模式1：语音识别 + 打分 =====
function startRecognitionMode(targetWord, btnId) {
  var btn = document.getElementById(btnId);

  // 第1步：播放标准发音
  btn.innerHTML = '🔊 Listen...';
  btn.classList.add('recording-active');
  childListen(targetWord);

  // 第2步：1.5秒后开始录音识别
  listenTimer = setTimeout(function() {
    recognition = initRecognition();
    if (!recognition) {
      // 突然不支持了，降级
      startRecordMode(targetWord, btnId);
      return;
    }

    isListening = true;
    btn.innerHTML = '🎤 Say it!';
    btn.style.background = '#E53935';

    // 5秒超时
    listenTimer = setTimeout(function() {
      if (isListening) {
        stopSpeaking();
        showScoreFallback(btnId, 'timeout');
      }
    }, 5000);

    recognition.onresult = function(event) {
      clearTimeout(listenTimer);
      isListening = false;
      var results = event.results[0];
      var bestMatch = '';
      var bestScore = 0;

      for (var i = 0; i < results.length; i++) {
        var transcript = results[i].transcript.toLowerCase().trim();
        var score = calculateSimilarity(transcript, currentTargetWord);
        if (score > bestScore) {
          bestScore = score;
          bestMatch = transcript;
        }
      }

      showScore(btnId, bestScore, bestMatch, currentTargetWord);
    };

    recognition.onerror = function(event) {
      clearTimeout(listenTimer);
      isListening = false;
      var btn2 = document.getElementById(btnId);
      if (btn2) {
        btn2.classList.remove('recording-active');
        btn2.style.background = '';
        if (event.error === 'no-speech') {
          btn2.innerHTML = '🔇 Try again';
        } else if (event.error === 'not-allowed') {
          btn2.innerHTML = '🎤 Mic denied';
          hasSpeechRecognition = false; // 降级
        } else {
          btn2.innerHTML = '🎤 Try again';
        }
      }
    };

    recognition.onend = function() {
      isListening = false;
    };

    try {
      recognition.start();
    } catch(e) {
      startRecordMode(targetWord, btnId);
    }
  }, 1500);
}

// ===== 模式2：录音 + 回放（降级方案）=====
var mediaRecorder = null;
var audioChunks = [];

function startRecordMode(targetWord, btnId) {
  var btn = document.getElementById(btnId);
  if (!btn) return;

  // 检查录音支持
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    // 模式3：纯跟读（播放2遍）
    startFollowMode(targetWord, btnId);
    return;
  }

  // 第1步：播放标准发音
  btn.innerHTML = '🔊 Listen...';
  btn.classList.add('recording-active');
  childListen(targetWord);

  // 第2步：1.5秒后开始录音
  listenTimer = setTimeout(function() {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
      isListening = true;
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      btn.innerHTML = '⏺ Recording...';
      btn.style.background = '#E53935';

      mediaRecorder.ondataavailable = function(e) {
        audioChunks.push(e.data);
      };

      mediaRecorder.onstop = function() {
        isListening = false;
        stream.getTracks().forEach(function(t) { t.stop(); });

        var blob = new Blob(audioChunks, { type: 'audio/webm' });
        var url = URL.createObjectURL(blob);
        var audio = new Audio(url);

        // 播放孩子录的声音
        btn.innerHTML = '🔊 Playing...';
        btn.style.background = '#4CAF50';
        audio.play();

        audio.onended = function() {
          // 播放标准发音对比
          btn.innerHTML = '🔊 Compare';
          btn.style.background = '';
          childListen(targetWord);
          setTimeout(function() {
            btn.innerHTML = '🎤 Speak';
            btn.classList.remove('recording-active');
          }, 2000);
        };
      };

      mediaRecorder.start();

      // 最多录4秒
      listenTimer = setTimeout(function() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }
      }, 4000);

    }).catch(function(err) {
      // 麦克风权限被拒绝，降级为纯跟读
      startFollowMode(targetWord, btnId);
    });
  }, 1500);
}

// ===== 模式3：纯跟读（播放2遍让孩子跟读）=====
function startFollowMode(targetWord, btnId) {
  var btn = document.getElementById(btnId);
  if (!btn) return;

  btn.innerHTML = '🔊 Listen';
  btn.classList.add('recording-active');

  // 第1遍
  childListen(targetWord);

  // 第2遍（2.5秒后）
  listenTimer = setTimeout(function() {
    btn.innerHTML = '🔊 Your turn!';
    childListen(targetWord);

    listenTimer = setTimeout(function() {
      btn.innerHTML = '⭐⭐⭐';
      btn.style.background = '#4CAF50';
      btn.classList.remove('recording-active');
      
      // 显示评分详情
      var detail = document.getElementById(btnId + '-detail');
      if (detail) {
        detail.innerHTML = '<div style="font-size:0.75rem;color:#4CAF50;margin-top:4px;font-weight:600;">Great job! Keep practicing!</div>';
      }

      listenTimer = setTimeout(function() {
        btn.innerHTML = '🎤 Speak';
        btn.style.background = '';
        if (detail) detail.innerHTML = '';
      }, 2500);
    }, 2000);
  }, 2500);
}

function calculateSimilarity(spoken, target) {
  // 精确匹配
  if (spoken === target) return 100;
  
  // 去掉标点后比较
  var cleanSpoken = spoken.replace(/[.,!?']/g, '').trim();
  var cleanTarget = target.replace(/[.,!?']/g, '').trim();
  if (cleanSpoken === cleanTarget) return 100;

  // 包含关系
  if (cleanSpoken.indexOf(cleanTarget) >= 0 || cleanTarget.indexOf(cleanSpoken) >= 0) {
    return 85;
  }

  // 单词级别比较
  var spokenWords = cleanSpoken.split(/\s+/);
  var targetWords = cleanTarget.split(/\s+/);
  
  if (targetWords.length === 1) {
    // 单词：用编辑距离
    var dist = levenshteinDistance(cleanSpoken, cleanTarget);
    var maxLen = Math.max(cleanSpoken.length, cleanTarget.length);
    return Math.round((1 - dist / maxLen) * 100);
  }

  // 多词：计算单词匹配率
  var matched = 0;
  targetWords.forEach(function(tw) {
    spokenWords.forEach(function(sw) {
      if (sw === tw || levenshteinDistance(sw, tw) <= 1) {
        matched++;
      }
    });
  });
  return Math.round((matched / targetWords.length) * 100);
}

function levenshteinDistance(a, b) {
  var matrix = [];
  for (var i = 0; i <= b.length; i++) matrix[i] = [i];
  for (var j = 0; j <= a.length; j++) matrix[0][j] = j;
  for (var i = 1; i <= b.length; i++) {
    for (var j = 1; j <= a.length; j++) {
      if (b.charAt(i - 1) === a.charAt(j - 1)) {
        matrix[i][j] = matrix[i - 1][j - 1];
      } else {
        matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
      }
    }
  }
  return matrix[b.length][a.length];
}

  btn.style.background = '';

}

function showScore(btnId, score, spoken, target) {
  var btn = document.getElementById(btnId);
  if (!btn) return;

  var stars = '';
  var color = '';
  var msg = '';

  if (score >= 90) {
    stars = '⭐⭐⭐';
    color = '#4CAF50';
    msg = 'Perfect!';
    speak('Perfect! ' + target);
  } else if (score >= 70) {
    stars = '⭐⭐';
    color = '#FF9800';
    msg = 'Good!';
    speak('Good job! ' + target);
  } else if (score >= 50) {
    stars = '⭐';
    color = '#FFC107';
    msg = 'Try again!';
    speak('Try again! ' + target);
  } else {
    stars = '💪';
    color = '#F44336';
    msg = 'Listen & try';
    speak('Listen carefully. ' + target);
  }

  btn.innerHTML = stars + ' ' + score + '%';
  btn.style.background = color;
  btn.style.color = 'white';
  btn.classList.remove('recording-active');

  // 在按钮旁边显示评分详情
  var scoreDetail = document.getElementById(btnId + '-detail');
  if (scoreDetail) {
    scoreDetail.innerHTML = '<div style="font-size:0.75rem;color:' + color + ';margin-top:4px;font-weight:600;">' + msg + (spoken !== target ? '<br>You said: "' + spoken + '"' : '') + '</div>';
  }

  // 3秒后恢复按钮
  setTimeout(function() {
    btn.innerHTML = '🎤 Speak';
    btn.style.background = '';
    btn.style.color = '';
  }, 4000);
}

// ===== NAVIGATION =====
function navigate(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(page).classList.add('active');

  if (page === 'home') {
    renderHome();
  } else if (page === 'review') {
    renderReview();
  }
  window.scrollTo(0, 0);
}

  navigate('home');
  window.location.hash = '#home';
}

function goBack() {
  if (currentStep > 0) {
    // 有上一步，返回上一步
    currentStep--;
    renderStep(currentStep);
    window.scrollTo(0, 0);
  } else {
    // 已经是第一步，返回首页
    goHome();
  }
}

// ===== STEP DOTS =====
function renderStepDots() {
  const container = document.getElementById('step-dots');
  const progress = getProgress();
  const topicProgress = progress[currentTopicId] || { step: 0 };

  let html = '';
  for (let i = 0; i < TOTAL_STEPS; i++) {
    let cls = 'step-dot';
    if (i === currentStep) cls += ' active';
    else if (i < currentStep || i < topicProgress.step) cls += ' done';
    html += `<div class="${cls}"></div>`;
  }
  container.innerHTML = html;
}

// ===== RENDER STEP =====
function renderStep() {
  const topic = topics.find(t => t.id === currentTopicId);
  if (!topic) return;

  const container = document.getElementById('step-container');
  let html = '';

  switch (currentStep) {
    case 0: html = renderWarmup(topic); break;
    case 1: html = renderWords(topic); break;
    case 2: html = renderSentences(topic); break;
    case 3: html = renderDialogue(topic); break;
    case 4: html = renderStory(topic); break;
    case 5: html = renderGame(topic); break;
    case 6: html = renderSummary(topic); break;
  }

  container.innerHTML = html;
  renderStepDots();

  if (currentStep === 3) {
    setTimeout(startDialogueGame, 300);
  }
  if (currentStep === 5) {
    initGame(topic);
  }
}

function nextStep() {
  saveProgress(currentTopicId, currentStep + 1);
  currentStep++;
  if (currentStep >= TOTAL_STEPS) {
    currentStep = TOTAL_STEPS - 1;
  }
  renderStep();
  window.scrollTo(0, 0);
}

function startDialogueGame() {
  var topic = topics.find(function(t) { return t.id === currentTopicId; });
  if (!topic) return;

  // 构造对话问答对：每组老师问 + 孩子正确答 + 2个干扰项
  var pairs = [];
  var dialogues = topic.dialogue;
  for (var i = 0; i < dialogues.length; i += 2) {
    if (dialogues[i].role === 'teacher' && i + 1 < dialogues.length && dialogues[i + 1].role === 'child') {
      pairs.push({
        question: dialogues[i],
        correctAnswer: dialogues[i + 1]
      });
    }
  }

  // 如果不足2组，补充句型作为问答
  if (pairs.length < 2) {
    topic.sentences.forEach(function(s) {
      pairs.push({
        question: { en: s.en, cn: s.cn },
        correctAnswer: { en: s.en, cn: s.cn }
      });
    });
  }

  dialogueState.pairs = pairs;
  dialogueState.total = pairs.length;
  dialogueState.round = 0;
  dialogueState.score = 0;

  renderDialogueRound();
}

function renderDialogueRound() {
  var area = document.getElementById('dialogue-game-area');
  var scoreEl = document.getElementById('dialogue-score');
  if (!area) return;

  var pairs = dialogueState.pairs;
  var round = dialogueState.round;

  if (round >= pairs.length) {
    // 全部完成
    var msg = dialogueState.score === pairs.length ? 'Amazing! Perfect score!' : 'Good job! Keep going!';
    area.innerHTML = '<div style="text-align:center;padding:24px;"><div style="font-size:3rem;">🎉</div><p style="font-size:1.2rem;font-weight:700;color:var(--accent);">' + msg + '</p><p>答对 ' + dialogueState.score + ' / ' + pairs.length + ' 题</p></div>';
    if (scoreEl) scoreEl.textContent = '';
    speak(msg);
    var doneBtn = document.getElementById('dialogue-done-btn');
    if (doneBtn) doneBtn.style.display = 'block';
    return;
  }

  var pair = pairs[round];
  var correct = pair.correctAnswer;

  // 生成3个选项（1个正确 + 2个干扰）
  var allAnswers = [];
  pairs.forEach(function(p) {
    if (p.correctAnswer.en !== correct.en) {
      allAnswers.push(p.correctAnswer);
    }
  });
  // 如果干扰项不够，从其他主题的对话中补充
  if (allAnswers.length < 2) {
    topics.forEach(function(t) {
      if (t.id !== currentTopicId) {
        t.dialogue.forEach(function(d) {
          if (d.role === 'child' && d.en !== correct.en && allAnswers.length < 4) {
            allAnswers.push(d);
          }
        });
      }
    });
  }
  // 随机选2个干扰项
  var shuffled = allAnswers.sort(function() { return Math.random() - 0.5; });
  var wrongOptions = shuffled.slice(0, 2);

  var options = [correct].concat(wrongOptions);
  // 随机打乱选项
  options.sort(function() { return Math.random() - 0.5; });

  var optionsHtml = '';
  options.forEach(function(opt, idx) {
    var isCorrect = opt.en === correct.en;
    optionsHtml += '<button class="dialogue-option-btn" id="dlg-opt-' + idx + '" onclick="checkDialogueAnswer(this, ' + isCorrect + ', \'' + correct.en.replace(/'/g, "\\'") + '\', \'' + opt.en.replace(/'/g, "\\'") + '\')">';
    optionsHtml += '<span class="dlg-opt-en">' + opt.en + '</span>';
    optionsHtml += '<span class="dlg-opt-cn">' + opt.cn + '</span>';
    optionsHtml += '</button>';
  });

  var roundHtml = '';
  roundHtml += '<div class="dialogue-round" id="dialogue-round-' + round + '">';
  roundHtml += '<div class="dialogue-progress">第 ' + (round + 1) + ' / ' + pairs.length + ' 题</div>';

  // 老师提问气泡
  roundHtml += '<div class="teacher-ask-bubble">';
  roundHtml += '<div class="teacher-ask-avatar">👩‍🏫</div>';
  roundHtml += '<div class="teacher-ask-content">';
  roundHtml += '<div class="teacher-ask-label">老师问你：</div>';
  roundHtml += '<div class="teacher-ask-en">' + pair.question.en + '</div>';
  roundHtml += '<div class="teacher-ask-cn">' + pair.question.cn + '</div>';
  roundHtml += '<button class="speak-btn speak-btn-small" onclick="speak(\'' + pair.question.en.replace(/'/g, "\\'") + '\')" style="margin-top:6px;">🔊 听老师问</button>';
  roundHtml += '</div></div>';

  // 孩子回答区
  roundHtml += '<div class="child-answer-area">';
  roundHtml += '<div class="child-answer-label">🧒 请选择你的回答：</div>';
  roundHtml += '<div class="dialogue-options" id="dialogue-options">' + optionsHtml + '</div>';
  roundHtml += '<div class="dialogue-feedback" id="dialogue-feedback"></div>';
  roundHtml += '</div>';

  roundHtml += '</div>';

  area.innerHTML = roundHtml;
  if (scoreEl) scoreEl.textContent = '得分：' + dialogueState.score + ' / ' + dialogueState.total;

  // 自动播放老师提问
  setTimeout(function() {
    speak(pair.question.en);
  }, 500);
}

function checkDialogueAnswer(btn, isCorrect, correctEn, selectedEn) {
  if (dialogueState.answered) return;
  dialogueState.answered = true;

  var feedback = document.getElementById('dialogue-feedback');
  var options = document.querySelectorAll('.dialogue-option-btn');

  // 禁用所有选项
  options.forEach(function(opt) {
    opt.style.pointerEvents = 'none';
  });

  if (isCorrect) {
    // 正确
    dialogueState.score++;
    btn.classList.add('option-correct');
    if (feedback) feedback.innerHTML = '<div class="feedback-correct">✅ ' + correctEn + '</div>';
    speak(correctEn);
  } else {
    // 错误
    btn.classList.add('option-wrong');
    if (feedback) feedback.innerHTML = '<div class="feedback-wrong">❌ ' + correctEn + '</div>';
    speak(correctEn);
    // 高亮正确选项
    options.forEach(function(opt) {
      if (opt.querySelector('.dlg-opt-en').textContent === correctEn) {
        opt.classList.add('option-correct');
      }
    });
  }

  // 2.5秒后进入下一轮
  setTimeout(function() {
    dialogueState.round++;
    dialogueState.answered = false;
    renderDialogueRound();
  }, 2500);
}

function nextStoryPage() {
  const pages = document.querySelectorAll('.storybook-page');

  currentStoryPage = Math.min(currentStoryPage + 1, totalStoryPages - 1);
  updateStoryPage();
}

function prevStoryPage() {
  const pages = document.querySelectorAll('.storybook-page');
  if (!pages.length) return;
  totalStoryPages = pages.length;
  currentStoryPage = Math.max(currentStoryPage - 1, 0);
  updateStoryPage();
}

function updateStoryPage() {
  const pages = document.querySelectorAll('.storybook-page');
  pages.forEach((p, i) => {
    p.classList.toggle('active', i === currentStoryPage);

  const indicator = document.getElementById('page-indicator');
  if (indicator) indicator.textContent = '第 ' + (currentStoryPage + 1) + ' / ' + totalStoryPages + ' 页';

  if (prevBtn) prevBtn.style.opacity = currentStoryPage === 0 ? '0.4' : '1';

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initGame(topic) {
  gameState = { score: 0, round: 0, totalRounds: 5, questions: [], answered: false };
  const type = topic.game.type;
  const allWords = [...topic.words.basic, ...topic.words.extra];

  switch (type) {
    case 'color-match': {
      const colorMap = {
        'red': '🔴', 'blue': '🔵', 'yellow': '🟡', 'green': '🟢',
        'orange': '🟠', 'purple': '🟣', 'pink': '💗', 'brown': '🟤',
        'black': '⚫', 'white': '⚪'
      };
      const colorWords = topic.words.basic.concat(topic.words.extra);
      const shuffled = shuffleArray(colorWords);
      gameState.questions = shuffled.slice(0, 5).map(w => {
        const options = shuffleArray([w, ...shuffleArray(colorWords.filter(x => x.en !== w.en)).slice(0, 3)]);
        return { answer: w.en, display: colorMap[w.en] || w.emoji, options: options.map(o => o.en) };
      });
      break;
    }
    case 'count-select': {
      // Numbers主题：改为算式题，避免直接从题干数出答案
      const numWords = topic.words.basic;
      const ops = ['+', '-'];
      gameState.questions = [];
      for (let i = 0; i < 5; i++) {
        const op = ops[Math.floor(Math.random() * ops.length)];
        let a, b, result;
        if (op === '+') {
          a = Math.floor(Math.random() * 5) + 1; // 1-5
          b = Math.floor(Math.random() * 5) + 1; // 1-5
          result = a + b;
        } else {
          a = Math.floor(Math.random() * 5) + 5; // 5-9
          b = Math.floor(Math.random() * 4) + 1; // 1-4
          result = a - b;
        }
        const answerWord = numWords.find(w => w.cn === String(result)) || numWords[result - 1];
        if (!answerWord) continue;
        const display = `${a} ${op} ${b} = ?`;
        const options = shuffleArray([answerWord, ...shuffleArray(numWords.filter(w => w.en !== answerWord.en)).slice(0, 3)]);
        gameState.questions.push({ answer: answerWord.en, display, options: options.map(o => o.en) });
      }
      break;
    }
    case 'image-word': {
      const shuffled = shuffleArray(allWords);
      gameState.questions = shuffled.slice(0, 5).map(w => {
        const options = shuffleArray([w, ...shuffleArray(allWords.filter(x => x.en !== w.en)).slice(0, 3)]);
        return { answer: w.en, display: w.emoji, options: options.map(o => o.en) };
      });
      break;
    }
    case 'match-family': {
      const shuffled = shuffleArray(allWords);
      gameState.questions = shuffled.slice(0, 5).map(w => {
        const options = shuffleArray([w, ...shuffleArray(allWords.filter(x => x.en !== w.en)).slice(0, 3)]);
        return { answer: w.en, display: w.emoji, options: options.map(o => o.en) };
      });
      break;
    }
    case 'food-sort': {
      const foods = topic.words.basic.filter(w => !['milk', 'juice'].includes(w.en));
      const drinks = topic.words.extra.filter(w => ['juice'].includes(w.en)).concat(topic.words.basic.filter(w => ['milk'].includes(w.en)));
      const all = shuffleArray([...foods, ...drinks]);
      gameState.questions = all.slice(0, 5).map(w => ({
        answer: ['milk', 'juice'].includes(w.en) ? 'Drink' : 'Food',
        display: w.emoji,
        word: w.en
      }));
      break;
    }
    case 'animal-sound': {
      const descMap = {
        'cat': 'It says "meow" 🐱', 'dog': 'It says "woof" 🐶',
        'bird': 'It can fly in the sky 🐦', 'panda': 'It is black and white 🐼',
        'rabbit': 'It has long ears 🐰', 'monkey': 'It likes bananas 🐵',
        'tiger': 'It has stripes 🐯', 'lion': 'It is the king 🦁',
        'elephant': 'It has a long nose 🐘', 'fish': 'It lives in water 🐟'
      };
      const shuffled = shuffleArray(allWords);
      gameState.questions = shuffled.slice(0, 5).map(w => {
        const options = shuffleArray([w, ...shuffleArray(allWords.filter(x => x.en !== w.en)).slice(0, 3)]);
        return { answer: w.en, display: descMap[w.en] || `It is a ${w.cn}`, options: options.map(o => o.emoji + ' ' + o.en) };
      });
      break;
    }
    case 'body-point': {
      const shuffled = shuffleArray(allWords);
      gameState.questions = shuffled.slice(0, 5).map(w => {
        const options = shuffleArray([w, ...shuffleArray(allWords.filter(x => x.en !== w.en)).slice(0, 3)]);
        return { answer: w.en, display: `Touch your ${w.en}! 👆`, options: options.map(o => o.emoji + ' ' + o.cn) };
      });
      break;
    }
    case 'action-select': {
      const shuffled = shuffleArray(allWords);
      gameState.questions = shuffled.slice(0, 5).map(w => {
        const options = shuffleArray([w, ...shuffleArray(allWords.filter(x => x.en !== w.en)).slice(0, 3)]);
        return { answer: w.en, display: w.emoji, options: options.map(o => o.en) };
      });
      break;
    }
    case 'clothes-match': {
      const shuffled = shuffleArray(allWords);
      gameState.questions = shuffled.slice(0, 5).map(w => {
        const options = shuffleArray([w, ...shuffleArray(allWords.filter(x => x.en !== w.en)).slice(0, 3)]);
        return { answer: w.en, display: w.emoji, options: options.map(o => o.en) };
      });
      break;
    }
    case 'season-match': {
      const shuffled = shuffleArray(allWords);
      gameState.questions = shuffled.slice(0, 5).map(w => {
        const options = shuffleArray([w, ...shuffleArray(allWords.filter(x => x.en !== w.en)).slice(0, 3)]);
        return { answer: w.en, display: w.emoji, options: options.map(o => o.en) };
      });
      break;
    }
    case 'hobby-sort': {
      const toys = topic.words.basic;
      const hobbies = topic.words.extra;
      const all = shuffleArray([...toys, ...hobbies]);
      gameState.questions = all.slice(0, 5).map(w => ({
        answer: toys.find(t => t.en === w.en) ? 'Toy' : 'Hobby',
        display: w.emoji,
        word: w.en
      }));
      break;
    }
    case 'greeting-scene': {
      const sceneMap = {
        'hello': '早上在学校门口遇到老师 👩‍🏫', 'hi': '在操场上遇到好朋友 🧒',
        'good morning': '早上起床对妈妈说 🌅', 'good afternoon': '下午在教室对老师说 ☀️',
        'goodbye': '放学回家时说 👋', 'thank you': '收到礼物时说 🎁',
        "you're welcome": '别人对你说谢谢时 😊', 'please': '想要别人帮忙时 🤲',
        'sorry': '不小心撞到别人时 😔', 'excuse me': '想从人群中穿过时 🙋'
      };
      const shuffled = shuffleArray(allWords);
      gameState.questions = shuffled.slice(0, 5).map(w => {
        const options = shuffleArray([w, ...shuffleArray(allWords.filter(x => x.en !== w.en)).slice(0, 3)]);
        return { answer: w.en, display: sceneMap[w.en] || `When to say ${w.cn}?`, options: options.map(o => o.en) };
      });
      break;
    }
  }

  showGameQuestion();
}

function showGameQuestion() {
  const topic = topics.find(t => t.id === currentTopicId);
  const area = document.getElementById('game-area');
  const feedback = document.getElementById('game-feedback');
  const nextBtn = document.getElementById('game-next-btn');
  const scoreEl = document.getElementById('game-score');

  if (!area) return;

  feedback.innerHTML = '';
  gameState.answered = false;
  gameState.questionWrong = false;

  if (gameState.round >= gameState.questions.length) {
    area.innerHTML = `
      <div style="padding:20px;">
        <div style="font-size:3rem;margin-bottom:16px;">🎉</div>
        <p style="font-size:1.3rem;font-weight:700;margin-bottom:8px;">游戏结束！Game Over!</p>
        <p style="font-size:1.1rem;color:var(--muted);">你答对了 <strong style="color:var(--accent);">${gameState.score}</strong> / ${gameState.totalRounds} 题</p>
        <p style="font-size:1.1rem;margin-top:12px;">${gameState.score >= 4 ? '太棒了！You are amazing! 🌟' : gameState.score >= 2 ? '不错哦！Very good! 👍' : '继续加油！Keep trying! 💪'}</p>
      </div>
    `;
    nextBtn.style.display = 'block';
    return;
  }

  const q = gameState.questions[gameState.round];
  const type = topic.game.type;

  scoreEl.textContent = gameState.score;

  if (type === 'food-sort' || type === 'hobby-sort') {
    renderSortGame(area, q, type);
  } else {
    let html = '';
    if (typeof q.display === 'string' && q.display.length <= 10 && !q.display.includes(' ')) {
      html += `<div class="game-question">${q.display}</div>`;
    } else {
      html += `<div class="game-question-text">${q.display}</div>`;
    }
    html += '<div class="game-options">';
    q.options.forEach((opt, i) => {
      html += `<button class="game-option" data-idx="${i}" onclick="checkGameAnswer(this, '${opt.replace(/'/g, "\\'")}')">${opt}</button>`;
    });
    html += '</div>';
    area.innerHTML = html;
  }
}

function renderSortGame(area, q, type) {
  const basket1Label = type === 'food-sort' ? '🍎 Food' : '🧸 Toys';
  const basket2Label = type === 'food-sort' ? '🥤 Drink' : '🎨 Hobbies';
  const basket1Answer = type === 'food-sort' ? 'Food' : 'Toy';
  const basket2Answer = type === 'food-sort' ? 'Drink' : 'Hobby';

  area.innerHTML = `
    <div class="game-question">${q.display}</div>
    <p style="font-size:1.1rem;margin-bottom:16px;">这是什么？请选择正确的分类！</p>
    <div class="game-sort-area">
      <div class="sort-basket" onclick="checkSortAnswer(this, '${basket1Answer}')" data-answer="${basket1Answer}">
        <div class="basket-label">${basket1Label}</div>
        <div class="basket-items"></div>
      </div>
      <div class="sort-basket" onclick="checkSortAnswer(this, '${basket2Answer}')" data-answer="${basket2Answer}">
        <div class="basket-label">${basket2Label}</div>
        <div class="basket-items"></div>
      </div>
    </div>
  `;
}

function checkSortAnswer(el, basketAnswer) {
  if (gameState.answered) return;
  gameState.answered = true;

  const q = gameState.questions[gameState.round];
  const feedback = document.getElementById('game-feedback');
  const correct = basketAnswer === q.answer;

  if (correct) {
    gameState.score++;
    el.style.borderColor = '#4CAF50';
    el.style.background = '#E8F5E9';
    el.querySelector('.basket-items').textContent = q.display;
    feedback.innerHTML = '<div class="game-feedback correct-fb">太棒了！Correct! ⭐</div>';
    speak('Correct!');
  } else {
    el.style.borderColor = '#EF5350';
    el.style.background = '#FFEBEE';
    feedback.innerHTML = '<div class="game-feedback wrong-fb">再想想哦！Try again! 💪</div>';
    speak('Try again!');
  }

  gameState.round++;
  setTimeout(showGameQuestion, 1500);
}

function checkGameAnswer(el, selected) {
  const q = gameState.questions[gameState.round];
  const feedback = document.getElementById('game-feedback');
  // 选项可能包含emoji，需要从选项文本中提取答案
  var selectedClean = selected.replace(/^[^a-zA-Z]+\s*/, '').trim();
  var correct = selectedClean.toLowerCase() === q.answer.toLowerCase();

  if (correct) {
    // 答对了
    gameState.answered = true;
    el.classList.add('correct');
    gameState.score++;
    feedback.innerHTML = '<div class="game-feedback correct-fb">Correct! ⭐</div>';
    speak('Correct!');
    gameState.round++;
    setTimeout(showGameQuestion, 1500);
  } else {
    // 答错了：给予第二次机会
    if (!gameState.questionWrong) {
      // 第一次答错：标记本题已错过一次，禁用错误按钮，让用户再选
      gameState.questionWrong = true;
      el.classList.add('wrong');
      el.style.pointerEvents = 'none';
      el.style.opacity = '0.5';
      feedback.innerHTML = '<div class="game-feedback wrong-fb">Try again! 💪</div>';
      speak('Try again!');
      setTimeout(function() {
        feedback.innerHTML = '';
      }, 1200);
    } else {
      // 第二次答错：显示正确答案，进入下一题
      gameState.answered = true;
      el.classList.add('wrong');
      // 高亮正确答案
      document.querySelectorAll('.game-option').forEach(function(btn) {
        var btnClean = btn.textContent.trim().replace(/^[^a-zA-Z]+\s*/, '').trim();
        if (btnClean.toLowerCase() === q.answer.toLowerCase()) {
          btn.classList.add('correct');
        }
      });
      feedback.innerHTML = '<div class="game-feedback wrong-fb">The answer is: ' + q.answer + '</div>';
      speak('The answer is ' + q.answer);
      gameState.round++;
      setTimeout(showGameQuestion, 2000);
    }
  }
}

// ===== REVIEW PAGE =====
function renderReview() {
  const area = document.getElementById('review-area');
  const progress = getProgress();

  const learnedTopics = topics.filter(t => {
    const p = progress[t.id];
    return p && p.step >= 2;
  });

  if (learnedTopics.length === 0) {
    area.innerHTML = `
      <div class="no-review">
        <div class="no-review-emoji">📚</div>
        <p>还没有学过的内容哦！</p>
        <p>Go learn some topics first!</p>
        <button class="btn-secondary mt-16" onclick="navigate('home')">去学习 →</button>
      </div>
    `;
    return;
  }

  reviewState = { questions: [], current: 0, score: 0 };

  learnedTopics.forEach(t => {
    t.words.basic.forEach(w => {
      reviewState.questions.push({ type: 'word', en: w.en, cn: w.cn, emoji: w.emoji, topic: t });
    });
    t.sentences.forEach(s => {
      reviewState.questions.push({ type: 'sentence', en: s.en, cn: s.cn, emoji: t.emoji, topic: t });
    });
  });

  reviewState.questions = shuffleArray(reviewState.questions).slice(0, 10);
  showReviewQuestion();
}

function showReviewQuestion() {

        <button class="btn-primary mt-16" onclick="renderReview()">再来一次 🔄</button>
        <br>
        <button class="btn-secondary" onclick="navigate('home')">返回首页 🏠</button>
      </div>
    `;
    return;

  const q = reviewState.questions[reviewState.current];

    const otherWords = topic.words.basic.filter(w => w.en !== q.en);
    const shuffledOthers = shuffleArray(otherWords).slice(0, 3);
    options = shuffleArray([{ en: q.cn, correct: true }, ...shuffledOthers.map(w => ({ en: w.cn, correct: false }))]);
  } else {
    const topic = q.topic;
    const otherSents = topic.sentences.filter(s => s.en !== q.en);
    const shuffledOthers = shuffleArray(otherSents).slice(0, 3);
    options = shuffleArray([{ en: q.cn, correct: true }, ...shuffledOthers.map(s => ({ en: s.cn, correct: false }))]);
  }

  let html = `
    <div class="review-card">
      <div class="review-emoji">${q.emoji}</div>
      <div class="review-en">${q.en}</div>
      <div class="review-cn">这是什么意思？</div>
      <div class="review-options">
  `;

  options.forEach((opt, i) => {
    html += `<button class="review-option" onclick="checkReviewAnswer(this, ${opt.correct})">${opt.en}</button>`;
  });

  html += `
      </div>
      <div id="review-feedback" style="margin-top:12px;"></div>
      <p style="margin-top:12px;font-size:0.85rem;color:var(--muted);">${reviewState.current + 1} / ${reviewState.questions.length}</p>
    </div>
  `;

  area.innerHTML = html;
  speak(q.en);
}

function checkReviewAnswer(el, correct) {
  const feedback = document.getElementById('review-feedback');

  if (correct) {
    el.classList.add('correct');
    reviewState.score++;
    feedback.innerHTML = '<div class="game-feedback correct-fb">太棒了！Correct! ⭐</div>';
  } else {
    el.classList.add('wrong');
    feedback.innerHTML = '<div class="game-feedback wrong-fb">不对哦，记住正确答案！💪</div>';
  }

  document.querySelectorAll('.review-option').forEach(btn => btn.style.pointerEvents = 'none');

  reviewState.current++;
  setTimeout(showReviewQuestion, 1500);
}

// ===== HASH ROUTING =====
function handleHash() {
  const hash = window.location.hash;
  if (hash.startsWith('#topic-')) {
    const id = parseInt(hash.replace('#topic-', ''));
    if (id >= 1 && id <= 12) {
      openTopic(id);
      return;
    }
  }
  if (hash === '#review') {
    navigate('review');
    return;
  }
  navigate('home');
}

window.addEventListener('hashchange', handleHash);

// ===== INIT =====
function init() {
  renderHome();
  updateStarsDisplay();
  handleHash();
}

// 启动页：用户点击后解锁音频播放权限
var audioUnlocked = false;
document.getElementById('start-btn').addEventListener('click', function() {
  audioUnlocked = true;
  // 尝试播放一个无声的音频来解锁iOS/Safari的音频上下文
  var silentAudio = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQAAAAAAA==');
  silentAudio.play().catch(function(){});
  // 解锁Web Speech API
  if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
    var testU = new SpeechSynthesisUtterance('');
    testU.volume = 0;
    window.speechSynthesis.speak(testU);
  }
  // 隐藏启动页
  var overlay = document.getElementById('start-overlay');
  overlay.style.transition = 'opacity 0.5s';
  overlay.style.opacity = '0';
  setTimeout(function() {
    overlay.style.display = 'none';
  }, 500);
});

init();
</script>
