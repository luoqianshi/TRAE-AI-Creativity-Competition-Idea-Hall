<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>歪理研究所 Paradox Lab</title>
<style>
  :root {
    --bg: #05070d;
    --bg-card: #0c111c;
    --line: #1c2538;
    --neon: #5eead4;
    --neon-2: #67e8f9;
    --warn: #f97316;
    --text: #d8dee9;
    --text-dim: #7c8aa3;
    --accent: #a78bfa;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "JetBrains Mono", "Cascadia Code", "Source Code Pro", "Microsoft YaHei", monospace;
    min-height: 100%;
  }
  body {
    background:
      radial-gradient(circle at 20% 10%, rgba(94,234,212,0.08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(167,139,250,0.08), transparent 40%),
      var(--bg);
    overflow-x: hidden;
  }
  header {
    border-bottom: 1px solid var(--line);
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(6px);
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(5,7,13,0.85);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 30px; height: 30px;
    border: 1px solid var(--neon);
    color: var(--neon);
    display: grid; place-items: center;
    font-weight: 700;
    box-shadow: 0 0 12px rgba(94,234,212,0.35);
  }
  .brand h1 {
    font-size: 16px;
    margin: 0;
    letter-spacing: 2px;
  }
  .brand small {
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 1px;
  }
  .meta-bar {
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 1px;
  }
  main {
    max-width: 980px;
    margin: 28px auto 80px;
    padding: 0 24px;
  }
  .hero {
    text-align: center;
    padding: 36px 0 18px;
  }
  .hero h2 {
    font-size: 28px;
    margin: 0 0 8px;
    background: linear-gradient(120deg, var(--neon), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero p {
    color: var(--text-dim);
    margin: 4px 0;
    font-size: 13px;
    letter-spacing: 1px;
  }
  .modes {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 18px 0 14px;
    flex-wrap: wrap;
  }
  .mode-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 16px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    transition: all .2s;
  }
  .mode-btn:hover { border-color: var(--neon); color: var(--neon); }
  .mode-btn.active {
    border-color: var(--neon);
    color: var(--neon);
    background: rgba(94,234,212,0.08);
    box-shadow: 0 0 12px rgba(94,234,212,0.2);
  }
  .console {
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 18px;
    position: relative;
  }
  .console::before {
    content: "// PARADOX-LAB · CASE-INTAKE";
    position: absolute;
    top: -10px; left: 16px;
    background: var(--bg);
    padding: 0 8px;
    font-size: 10px;
    color: var(--neon);
    letter-spacing: 2px;
  }
  .console textarea {
    width: 100%;
    min-height: 90px;
    background: #060912;
    color: var(--text);
    border: 1px solid var(--line);
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
    outline: none;
  }
  .console textarea:focus { border-color: var(--neon); }
  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .actions .hint {
    font-size: 11px;
    color: var(--text-dim);
  }
  .actions .right { display: flex; gap: 8px; }
  .btn {
    background: transparent;
    border: 1px solid var(--neon);
    color: var(--neon);
    padding: 9px 18px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 2px;
    transition: all .2s;
  }
  .btn:hover {
    background: rgba(94,234,212,0.12);
    box-shadow: 0 0 16px rgba(94,234,212,0.4);
  }
  .btn-ghost {
    border-color: var(--line);
    color: var(--text-dim);
  }
  .btn-ghost:hover {
    border-color: var(--text);
    color: var(--text);
    box-shadow: none;
    background: rgba(255,255,255,0.04);
  }
  .progress {
    margin: 18px 0;
    color: var(--neon);
    font-size: 12px;
    letter-spacing: 1px;
    display: none;
  }
  .progress .dot { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  .report {
    margin-top: 24px;
    border: 1px solid var(--line);
    background: var(--bg-card);
    padding: 22px;
    position: relative;
    display: none;
  }
  .report::before {
    content: "// CASE-FILE";
    position: absolute;
    top: -10px; left: 16px;
    background: var(--bg);
    padding: 0 8px;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 2px;
  }
  .report-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px dashed var(--line);
    padding-bottom: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .report-head h3 {
    margin: 0 0 6px;
    font-size: 16px;
    color: var(--neon-2);
  }
  .report-head small {
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 1px;
  }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 2px 8px;
    font-size: 10px;
    letter-spacing: 1px;
  }
  .field { margin-bottom: 14px; }
  .field-label {
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .field-body {
    color: var(--text);
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
  }
  .deduction-step {
    border-left: 2px solid var(--neon);
    padding: 4px 0 4px 12px;
    margin-bottom: 8px;
    color: var(--text);
    font-size: 13px;
    line-height: 1.7;
  }
  .deduction-step::before {
    content: attr(data-step) "  ";
    color: var(--neon);
    font-weight: 700;
    margin-right: 4px;
  }
  .conclusion {
    border: 1px solid var(--neon);
    background: rgba(94,234,212,0.06);
    padding: 14px 16px;
    color: var(--neon-2);
    font-size: 15px;
    line-height: 1.7;
    box-shadow: 0 0 18px rgba(94,234,212,0.18) inset;
  }
  .footnote {
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.7;
    border-top: 1px dashed var(--line);
    padding-top: 10px;
  }
  .alt-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .alt-list li {
    border: 1px solid var(--line);
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.6;
    background: rgba(255,255,255,0.02);
  }
  .alt-list li::before {
    content: attr(data-no) "  ";
    color: var(--accent);
    font-weight: 700;
    margin-right: 4px;
  }
  .confidence {
    display: flex; align-items: center; gap: 10px;
    margin-top: 10px;
    color: var(--text-dim);
    font-size: 12px;
  }
  .bar {
    flex: 1;
    height: 4px;
    background: var(--line);
    position: relative;
  }
  .bar > span {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, var(--neon), var(--accent));
    box-shadow: 0 0 8px var(--neon);
  }
  .footer-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .safety-banner {
    border: 1px solid var(--warn);
    color: var(--warn);
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.6;
    margin-bottom: 14px;
    background: rgba(249,115,22,0.06);
  }
  .footer-note {
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 1px;
    margin-top: 30px;
  }
  .share-tip {
    color: var(--text-dim);
    font-size: 11px;
    line-height: 1.6;
    margin-top: 10px;
    text-align: right;
  }
  /* Share card hidden but rendered for canvas-free copy */
  .share-card {
    display: none;
    width: 540px;
    background: linear-gradient(160deg, #060912, #0c111c);
    border: 1px solid var(--neon);
    padding: 28px;
    color: var(--text);
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">歪</div>
    <div>
      <h1>歪理研究所</h1>
      <small>PARADOX LAB · 用最严密的逻辑，说最离谱的话</small>
    </div>
  </div>
  <div class="meta-bar" id="metaBar">// 案宗编号 #----  /  在线状态 STANDBY</div>
</header>

<main>
  <section class="hero">
    <h2>欢迎来到歪理研究所</h2>
    <p>本所专攻一切看似严谨、其实离谱的人生疑难。</p>
    <p>请输入您的疑问，由首席研究员歪博士为您出具研究报告。</p>
  </section>

  <div class="modes" id="modes">
    <button class="mode-btn active" data-mode="oracle">神谕模式</button>
    <button class="mode-btn" data-mode="divergence">创意发散</button>
    <button class="mode-btn" data-mode="rebuttal">抬杠训练</button>
  </div>

  <section class="console">
    <textarea id="question" placeholder="例：我今晚应该吃什么 / 给一款失眠耳塞起 slogan / 早睡早起身体好"></textarea>
    <div class="actions">
      <div class="hint">提示：本所拒绝处理涉及医疗、投资、违法及任何对真实人物的攻击性问题。</div>
      <div class="right">
        <button class="btn btn-ghost" id="diceBtn">随机出题</button>
        <button class="btn" id="submitBtn">立 案</button>
      </div>
    </div>
    <div class="progress" id="progress">
      // 调用超级逻辑内核 <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
      <span id="progressText"></span>
    </div>
  </section>

  <section class="report" id="report"></section>

  <p class="footer-note">© 歪理研究所 · TRAE AI 创造力大赛参赛作品 · 仅供娱乐，请勿据此做出任何严肃决策</p>
</main>

<script>
/* ==== 规则库（从 rules.json 同步精简） ==== */
const RULES = [
  { id:"R001", school:"数字玄学派", title:"微信步数奇偶择物律", body:"步数偶数取左侧，奇数取右侧，电梯按钮除外。" },
  { id:"R002", school:"数字玄学派", title:"时间末位决定律", body:"以分钟个位作决策因子：0-3 保守，4-6 浪漫，7-9 不计后果。" },
  { id:"R003", school:"数字玄学派", title:"电量心情同步原理", body:"手机电量百分比即可用情绪能量，低于 20 取消露出微笑的活动。" },
  { id:"R005", school:"五行风水派", title:"外卖五行相克表", body:"麻辣属火，凉拌属水，水克火，连点两顿麻辣，第三顿必凉皮。" },
  { id:"R006", school:"五行风水派", title:"工位坐向反推命格", body:"工位朝西属金主决断，朝东属木主拖延。" },
  { id:"R009", school:"伪科学论文派", title:"文献编号 IF-2031.7 第三章", body:"早餐颗粒状食物超过三种，下午会议走神频次下降 11.4%。" },
  { id:"R010", school:"伪科学论文派", title:"拖延能量守恒定律", body:"拖延总量在一周内守恒，今天少拖一小时，未来七天必有补偿。" },
  { id:"R013", school:"物理玄学派", title:"情绪熵增不可逆原理", body:"任何关闭的对话框都不会回到打开前的情绪状态。" },
  { id:"R014", school:"物理玄学派", title:"动量守恒社交律", body:"饭局首夹菜者决定全桌菜系动量方向。" },
  { id:"R017", school:"社交人格派", title:"MBTI 选择反演律", body:"对 I 型人格而言，最佳选择恰是 E 型最佳选择的反面。" },
  { id:"R018", school:"社交人格派", title:"水逆责任转嫁原则", body:"决策不满者，可援引水逆将责任转嫁至最近一颗肉眼可见的行星。" },
  { id:"R021", school:"日常物件派", title:"冰箱第二层原则", body:"涉及晚餐之最优解，永远位于冰箱第二层最左侧。" },
  { id:"R022", school:"日常物件派", title:"拖鞋朝向预言术", body:"起床时拖鞋朝外宜出行，朝内宜远程办公。" },
  { id:"R026", school:"时间地理派", title:"经度时差脱罪律", body:"凡涉迟到，可援引经度差转嫁责任，最多豁免十二分钟。" },
  { id:"R028", school:"时间地理派", title:"周三低能见度规则", body:"每周三上午十点至十一点，所有承诺自动顺延至次日午后。" }
];

const SAMPLE_QUESTIONS = [
  "我今晚应该吃什么",
  "周末去哪里玩",
  "该不该和他和好",
  "要不要辞职去旅居",
  "给一款失眠耳塞起 slogan",
  "给一家深夜面馆想三句广告语",
  "早睡早起身体好",
  "多喝热水真的有用吗",
  "下班后健身真的能减肥吗"
];

const RED_FLAGS = [
  /(自杀|自残|割腕)/, /(吃多少|吃几片|药.*剂量|停药)/,
  /(炒股|加杠杆|买什么币|抄底)/, /(整人|害他|报复)/,
  /(违法|犯罪|怎么躲过)/
];

const SAFETY_TEXT = "本所秉持「可以荒谬，绝不伤害」之原则，本案涉及现实世界的安全或健康风险，恕不予受理。如需相关建议，请咨询具备资质的专业人士。";

/* ==== 状态 ==== */
let state = { mode: "oracle", caseId: 3170 + Math.floor(Math.random()*40) };
state.lastPayload = null;

/* ==== DOM ==== */
const $ = (id) => document.getElementById(id);
const modesEl = $("modes");
const questionEl = $("question");
const reportEl = $("report");
const progressEl = $("progress");
const progressText = $("progressText");
const metaBar = $("metaBar");

modesEl.addEventListener("click", (e) => {
  if (e.target.dataset.mode) {
    state.mode = e.target.dataset.mode;
    [...modesEl.children].forEach(b => b.classList.toggle("active", b === e.target));
  }
});

$("diceBtn").addEventListener("click", () => {
  questionEl.value = pick(SAMPLE_QUESTIONS);
});

$("submitBtn").addEventListener("click", submit);
questionEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) submit();
});

/* ==== 工具 ==== */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pickN(arr, n){ const a=[...arr]; const out=[]; for (let i=0;i<n && a.length;i++){ out.push(a.splice(Math.floor(Math.random()*a.length),1)[0]); } return out; }
function fakeConfidence(){ return (0.6 + Math.random()*0.35).toFixed(3); }

function pickTwoDistinctSchoolRules(){
  const r1 = pick(RULES);
  let r2 = pick(RULES.filter(r => r.school !== r1.school));
  if (!r2) r2 = pick(RULES);
  return [r1, r2];
}

function safetyHit(q){
  return RED_FLAGS.some(re => re.test(q));
}

/* ==== 推理生成 ==== */
function generateOracle(q, rules){
  const minute = new Date().getMinutes();
  const stepsToday = 1000 + Math.floor(Math.random()*15000);
  const evenOdd = stepsToday % 2 === 0 ? "偶数" : "奇数";
  const side = stepsToday % 2 === 0 ? "左侧" : "右侧";
  const r1 = rules[0], r2 = rules[1];
  const tail = pick([
    "建议食用冰箱第二层最 " + side + " 那盒周一的剩饭。",
    "建议立即穿上桌下最靠 " + side + " 的那双拖鞋外出。",
    "建议把手机静音并面朝 " + side + " 倒扣三十分钟。",
    "建议放弃今晚一切社交活动，对自己进行一次 " + side + " 侧翻身仪式。",
    "建议向最近一位姓氏笔画为偶数的同事发一条没有上下文的「在吗」。"
  ]);
  return {
    case: `申请人于 ${new Date().toLocaleString("zh-CN", { hour12:false })} 提出「${q}」之疑问，主体为本人，决策半径限于居所内。`,
    evocation: `本案同时援引《${r1.title}》与《${r2.title}》，二律相互锁定，结果不可推翻。`,
    deduction: [
      `查申请人今日步数为 ${stepsToday} 步，属于 ${evenOdd}，依《${r1.title}》应取空间方位上的 ${side}。`,
      `再依《${r2.title}》之精神，决策最优解锁定于一切可见物体中最靠 ${side} 者。`,
      `当前为 ${new Date().getHours()} 时 ${minute} 分，分钟末位为 ${minute % 10}，此值进一步将选择压缩至单一对象。`,
      `综合以上三步，结论已经收敛至唯一解。`
    ],
    conclusion: tail,
    footnote: `本结论可补充申请人当日缺失的 ${(Math.random()*15+1).toFixed(1)}% 的怀旧感与 ${(Math.random()*15+1).toFixed(1)}% 的冒险精神。本所对该结论的真实可执行性不承担任何责任。`
  };
}

function generateDivergence(q, rules){
  const r = rules[0];
  const seeds = [
    "戴上它，让你的耳朵先睡",
    "替你屏蔽掉那条还没回的微信",
    "把噪音变成一种待办事项",
    "让你的脑内会议按下静音",
    "今晚第一个不再 emo 的器官",
    "为失眠提供一份正式的离场理由",
    "把世界调成省电模式",
    "热力学劝你别再翻身",
    "为你的耳膜提供一份临时签证",
    "睡前最后一个还在工作的部门"
  ];
  const variants = [...seeds];
  // 适度混入用户问题里的关键词
  const m = q.match(/[\u4e00-\u9fa5A-Za-z0-9]{2,}/g) || [];
  if (m.length){
    variants.push(`让 ${m[0]} 失去对你的支配权`);
    variants.push(`关于 ${m[0]} 的最后一个借口`);
  }
  const out = pickN(variants, 8);
  return {
    case: `本所就「${q}」征集创意候选。`,
    evocation: `援引《${r.title}》之精神，所有候选均沿其方向展开。`,
    alternatives: out
  };
}

function generateRebuttal(q, rules){
  const r = rules[0];
  return {
    case: `用户主张：${q}。本所拟提出反方意见。`,
    evocation: `依《${r.title}》之精神，对该主张进行重审。`,
    rebuttal: `首先，所谓「${q}」之结论，建立在一个未经声明的前提之上。该前提既未在任何经度上得到证伪，亦未在任何子午线上得到证立，故其普适性应当被严肃打折。其次，依本所掌握之规则，凡缺乏地理、温度与情绪三参数共同约束的命题，皆应视为辩论用催眠词。最后，本所建议：保留对该命题的口头尊敬，但拒绝在生活中执行。本陈词仅为辩论暖场之用，不构成对您健康作息或生活方式的负面建议。`
  };
}

/* ==== 渲染 ==== */
function renderReport(payload){
  state.lastPayload = payload;
  reportEl.style.display = "block";
  const { caseId, mode, rules, body, confidence, safety, question } = payload;
  const titleMap = { oracle: "号神谕", divergence: "号脑洞档案", rebuttal: "号反方陈词" };
  const tagsHtml = rules.map(r => `<span class="tag">${r.school}</span>`).join("") +
    rules.map(r => `<span class="tag">${r.id} ${r.title}</span>`).join("");
  const safetyHtml = safety
    ? `<div class="safety-banner">// SAFETY-REROUTE  本案不予受理<br/>${SAFETY_TEXT}</div>` : "";

  let middleHtml = "";
  if (mode === "oracle"){
    const steps = body.deduction.map((s,i) => `<div class="deduction-step" data-step="STEP-${(i+1).toString().padStart(2,'0')}">${escapeHtml(s)}</div>`).join("");
    middleHtml = `
      <div class="field"><div class="field-label">立 案</div><div class="field-body">${escapeHtml(body.case)}</div></div>
      <div class="field"><div class="field-label">援 引</div><div class="field-body">${escapeHtml(body.evocation)}</div></div>
      <div class="field"><div class="field-label">推 导</div>${steps}</div>
      <div class="field"><div class="field-label">结 论</div><div class="conclusion">${escapeHtml(body.conclusion)}</div></div>
      <div class="footnote">${escapeHtml(body.footnote)}</div>
    `;
  } else if (mode === "divergence"){
    const items = body.alternatives.map((s,i) => `<li data-no="${(i+1).toString().padStart(2,'0')}">${escapeHtml(s)}</li>`).join("");
    middleHtml = `
      <div class="field"><div class="field-label">立 案</div><div class="field-body">${escapeHtml(body.case)}</div></div>
      <div class="field"><div class="field-label">援 引</div><div class="field-body">${escapeHtml(body.evocation)}</div></div>
      <div class="field"><div class="field-label">候 选</div><ul class="alt-list">${items}</ul></div>
    `;
  } else if (mode === "rebuttal"){
    middleHtml = `
      <div class="field"><div class="field-label">立 案</div><div class="field-body">${escapeHtml(body.case)}</div></div>
      <div class="field"><div class="field-label">援 引</div><div class="field-body">${escapeHtml(body.evocation)}</div></div>
      <div class="field"><div class="field-label">反 方 陈 词</div><div class="conclusion">${escapeHtml(body.rebuttal)}</div></div>
    `;
  }

  reportEl.innerHTML = `
    ${safetyHtml}
    <div class="report-head">
      <div>
        <h3>歪理研究所第 ${caseId} ${titleMap[mode]}</h3>
        <small>CASE-ID #${caseId.toString().padStart(6,'0')}  /  MODE ${mode.toUpperCase()}  /  ISSUED ${new Date().toLocaleString("zh-CN", { hour12:false })}</small>
      </div>
      <div class="tags">${tagsHtml}</div>
    </div>
    ${middleHtml}
    <div class="confidence">
      <span>加权置信度</span>
      <div class="bar"><span style="width:${(confidence*100).toFixed(1)}%"></span></div>
      <span>${(confidence*100).toFixed(1)}%</span>
    </div>
    <div class="footer-actions">
      <button class="btn btn-ghost" id="copyBtn">复制全文</button>
      <button class="btn btn-ghost" id="againBtn">再来一句</button>
      <button class="btn btn-ghost" id="shareBtn">复制分享文案</button>
      <button class="btn" id="posterBtn">导出分享图</button>
    </div>
    <div class="share-tip">分享图会自动生成 1080 × 1440 海报，适合发抖音、小红书、朋友圈或社区帖。</div>
  `;

  document.getElementById("copyBtn").onclick = copyReport;
  document.getElementById("againBtn").onclick = () => submit(true);
  document.getElementById("shareBtn").onclick = shareReport;
  document.getElementById("posterBtn").onclick = exportPoster;

  reportEl.scrollIntoView({ behavior: "smooth", block: "start" });
}

function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[m]);
}

/* ==== 提交流程（带打字机式进度） ==== */
async function submit(reuse=false){
  const q = questionEl.value.trim();
  if (!q){ questionEl.focus(); return; }
  reportEl.style.display = "none";
  progressEl.style.display = "block";
  const steps = [
    "解析提问要素",
    "调度歪理规则库",
    "执行多步推导",
    "进行置信度加权",
    "生成研究报告"
  ];
  for (let i=0; i<steps.length; i++){
    progressText.textContent = `STEP-${(i+1).toString().padStart(2,'0')} ${steps[i]}`;
    await sleep(280 + Math.random()*200);
  }
  progressEl.style.display = "none";

  state.caseId += 1;
  metaBar.textContent = `// 案宗编号 #${state.caseId.toString().padStart(6,'0')}  /  在线状态 LIVE`;

  if (safetyHit(q)){
    renderReport({
      caseId: state.caseId,
      mode: state.mode,
      rules: pickTwoDistinctSchoolRules(),
      question: q,
      body: { case: `用户提问「${q}」涉及现实风险。`, evocation: "本案不予受理。", deduction: [], conclusion: SAFETY_TEXT, footnote: "如需相关帮助，请咨询专业人士。", alternatives: [], rebuttal: SAFETY_TEXT },
      confidence: 0.99,
      safety: true
    });
    return;
  }

  const rules = pickTwoDistinctSchoolRules();
  let body;
  if (state.mode === "oracle") body = generateOracle(q, rules);
  else if (state.mode === "divergence") body = generateDivergence(q, rules);
  else body = generateRebuttal(q, rules);

  renderReport({
    caseId: state.caseId,
    mode: state.mode,
    rules,
    question: q,
    body,
    confidence: parseFloat(fakeConfidence()),
    safety: false
  });
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

/* ==== 复制 / 分享 ==== */
function buildPlainText(){
  return reportEl.innerText.trim();
}

function copyReport(){
  const text = buildPlainText();
  navigator.clipboard.writeText(text).then(() => {
    flash("已复制到剪贴板");
  }).catch(() => {
    flash("复制失败，请手动选择");
  });
}

function shareReport(){
  const text = "【歪理研究所 第 " + state.caseId + " 号】\n" + buildPlainText() + "\n\n— 由 歪博士 出具，仅供娱乐";
  navigator.clipboard.writeText(text).then(() => {
    flash("分享文本已复制，去抖音或微信粘贴吧");
  });
}

function exportPoster(){
  const payload = state.lastPayload;
  if (!payload) {
    flash("请先立案生成一份报告");
    return;
  }
  const canvas = document.createElement("canvas");
  canvas.width = 1080;
  canvas.height = 1440;
  const ctx = canvas.getContext("2d");
  drawPosterBackground(ctx, canvas.width, canvas.height);

  const modeName = { oracle: "神谕模式", divergence: "创意发散", rebuttal: "抬杠训练" }[payload.mode] || "神谕模式";
  const titleMap = { oracle: "号神谕", divergence: "号脑洞档案", rebuttal: "号反方陈词" };
  const mainText = getPosterMainText(payload);

  ctx.fillStyle = "#5eead4";
  ctx.font = "700 42px Microsoft YaHei, sans-serif";
  ctx.fillText("歪理研究所", 84, 116);

  ctx.fillStyle = "#7c8aa3";
  ctx.font = "24px Microsoft YaHei, sans-serif";
  ctx.fillText("PARADOX LAB · 用最严密的逻辑，说最离谱的话", 84, 158);

  ctx.strokeStyle = "#5eead4";
  ctx.lineWidth = 2;
  ctx.strokeRect(78, 78, 72, 72);
  ctx.fillStyle = "#5eead4";
  ctx.font = "700 44px Microsoft YaHei, sans-serif";
  ctx.fillText("歪", 96, 130);

  ctx.strokeStyle = "rgba(94,234,212,0.45)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(84, 214);
  ctx.lineTo(996, 214);
  ctx.stroke();

  drawTag(ctx, `CASE #${payload.caseId.toString().padStart(6,"0")}`, 84, 254, "#5eead4");
  drawTag(ctx, modeName, 340, 254, "#a78bfa");
  drawTag(ctx, payload.rules[0]?.school || "歪理学派", 520, 254, "#67e8f9");

  ctx.fillStyle = "#a78bfa";
  ctx.font = "24px Microsoft YaHei, sans-serif";
  ctx.fillText("用户提问", 84, 350);
  ctx.fillStyle = "#d8dee9";
  ctx.font = "700 40px Microsoft YaHei, sans-serif";
  wrapText(ctx, `「${payload.question || "未命名疑问"}」`, 84, 408, 910, 54, 3);

  ctx.fillStyle = "#67e8f9";
  ctx.font = "700 36px Microsoft YaHei, sans-serif";
  ctx.fillText(`歪理研究所第 ${payload.caseId} ${titleMap[payload.mode]}`, 84, 585);

  ctx.fillStyle = "#7c8aa3";
  ctx.font = "24px Microsoft YaHei, sans-serif";
  const ruleLine = payload.rules.map(r => `${r.id}《${r.title}》`).join("  ·  ");
  wrapText(ctx, `援引规则：${ruleLine}`, 84, 640, 910, 36, 3);

  drawCard(ctx, 84, 760, 912, 360);
  ctx.fillStyle = "#5eead4";
  ctx.font = "700 28px Microsoft YaHei, sans-serif";
  ctx.fillText("最终结论", 122, 820);
  ctx.fillStyle = "#d8dee9";
  ctx.font = "34px Microsoft YaHei, sans-serif";
  wrapText(ctx, mainText, 122, 888, 836, 52, 6);

  ctx.fillStyle = "#7c8aa3";
  ctx.font = "24px Microsoft YaHei, sans-serif";
  wrapText(ctx, "本内容仅供娱乐，不构成医疗、投资、法律或任何现实决策建议。", 84, 1240, 760, 36, 2);

  ctx.fillStyle = "#5eead4";
  ctx.font = "700 28px Microsoft YaHei, sans-serif";
  ctx.fillText("TRAE AI 创造力大赛参赛作品", 84, 1342);
  ctx.fillStyle = "#7c8aa3";
  ctx.font = "22px Microsoft YaHei, sans-serif";
  ctx.fillText("扫码位 / 社区链接位", 790, 1342);
  ctx.strokeStyle = "rgba(94,234,212,0.55)";
  ctx.strokeRect(790, 1196, 150, 150);
  drawFakeQr(ctx, 806, 1212, 118);

  const link = document.createElement("a");
  link.download = `歪理研究所-${payload.caseId}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
  flash("分享图已生成并开始下载");
}

function getPosterMainText(payload){
  const b = payload.body || {};
  if (payload.safety) return SAFETY_TEXT;
  if (payload.mode === "divergence") return (b.alternatives || []).slice(0, 4).map((x, i) => `${i+1}. ${x}`).join("  ");
  if (payload.mode === "rebuttal") return b.rebuttal || "";
  return b.conclusion || "";
}

function drawPosterBackground(ctx, w, h){
  const gradient = ctx.createLinearGradient(0, 0, w, h);
  gradient.addColorStop(0, "#05070d");
  gradient.addColorStop(0.55, "#0c111c");
  gradient.addColorStop(1, "#111827");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = "rgba(94,234,212,0.08)";
  ctx.beginPath(); ctx.arc(130, 180, 280, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(167,139,250,0.10)";
  ctx.beginPath(); ctx.arc(960, 1190, 360, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(94,234,212,0.08)";
  for (let x = 0; x < w; x += 54) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y < h; y += 54) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
}

function drawTag(ctx, text, x, y, color){
  ctx.font = "22px Microsoft YaHei, sans-serif";
  const width = ctx.measureText(text).width + 34;
  ctx.strokeStyle = color;
  ctx.fillStyle = "rgba(255,255,255,0.02)";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x, y - 32, width, 44);
  ctx.fillRect(x, y - 32, width, 44);
  ctx.fillStyle = color;
  ctx.fillText(text, x + 17, y);
}

function drawCard(ctx, x, y, w, h){
  ctx.fillStyle = "rgba(12,17,28,0.82)";
  ctx.strokeStyle = "rgba(94,234,212,0.55)";
  ctx.lineWidth = 2;
  ctx.fillRect(x, y, w, h);
  ctx.strokeRect(x, y, w, h);
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
  const chars = String(text || "").split("");
  let line = "";
  let lines = 0;
  for (let i = 0; i < chars.length; i++) {
    const test = line + chars[i];
    if (ctx.measureText(test).width > maxWidth && line) {
      lines += 1;
      if (lines >= maxLines) {
        ctx.fillText(line.slice(0, Math.max(0, line.length - 1)) + "…", x, y);
        return;
      }
      ctx.fillText(line, x, y);
      line = chars[i];
      y += lineHeight;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, y);
}

function drawFakeQr(ctx, x, y, size){
  ctx.fillStyle = "#d8dee9";
  ctx.fillRect(x, y, size, size);
  ctx.fillStyle = "#05070d";
  const cell = size / 11;
  const blocks = [
    [0,0],[1,0],[2,0],[0,1],[2,1],[0,2],[1,2],[2,2],
    [8,0],[9,0],[10,0],[8,1],[10,1],[8,2],[9,2],[10,2],
    [0,8],[1,8],[2,8],[0,9],[2,9],[0,10],[1,10],[2,10],
    [4,1],[6,2],[5,4],[8,5],[3,6],[6,7],[9,8],[5,9],[7,10]
  ];
  blocks.forEach(([cx, cy]) => ctx.fillRect(x + cx * cell, y + cy * cell, cell * 0.92, cell * 0.92));
}

function flash(msg){
  const old = document.getElementById("__flash");
  if (old) old.remove();
  const el = document.createElement("div");
  el.id = "__flash";
  el.textContent = msg;
  el.style.cssText = "position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#0c111c;border:1px solid #5eead4;color:#5eead4;padding:10px 18px;font-size:12px;letter-spacing:1px;z-index:99;box-shadow:0 0 18px rgba(94,234,212,0.35)";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1800);
}

questionEl.value = "我今晚应该吃什么";
