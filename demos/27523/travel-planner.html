<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行攻略自动生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .preferences {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .preference-tag {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }

        .preference-tag:hover {
            border-color: #667eea;
            background: #f5f5f5;
        }

        .preference-tag.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .generate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-section {
            margin-top: 40px;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .result-header h2 {
            font-size: 1.8em;
            color: #333;
        }

        .copy-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            background: #5568d3;
        }

        .result-content {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            line-height: 1.8;
            color: #333;
            white-space: pre-wrap;
            font-size: 1em;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 旅行攻略自动生成器</h1>
            <p>输入目的地，一键生成完整旅行计划</p>
        </div>

        <div class="content">
            <div class="input-section">
                <div class="form-group">
                    <label>目的地</label>
                    <input type="text" id="destination" placeholder="例如：北京、上海、成都、日本东京...">
                </div>

                <div class="form-group">
                    <label>旅行天数</label>
                    <input type="number" id="days" min="1" max="30" value="3" placeholder="1-30天">
                </div>

                <div class="form-group">
                    <label>预算（元/人）</label>
                    <select id="budget">
                        <option value="经济型">经济型（1000-3000元）</option>
                        <option value="舒适型" selected>舒适型（3000-8000元）</option>
                        <option value="豪华型">豪华型（8000元以上）</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>旅行偏好（可多选）</label>
                    <div class="preferences">
                        <div class="preference-tag" data-value="历史文化">历史文化</div>
                        <div class="preference-tag" data-value="自然风光">自然风光</div>
                        <div class="preference-tag" data-value="美食体验">美食体验</div>
                        <div class="preference-tag" data-value="购物娱乐">购物娱乐</div>
                        <div class="preference-tag" data-value="休闲度假">休闲度假</div>
                        <div class="preference-tag" data-value="冒险运动">冒险运动</div>
                        <div class="preference-tag" data-value="亲子游">亲子游</div>
                        <div class="preference-tag" data-value="摄影打卡">摄影打卡</div>
                    </div>
                </div>

                <button class="generate-btn" id="generateBtn">生成旅行攻略</button>

                <div class="error" id="errorMsg"></div>
            </div>

            <div class="result-section" id="resultSection">
                <div class="result-header">
                    <h2>📋 你的专属旅行攻略</h2>
                    <button class="copy-btn" id="copyBtn">复制攻略</button>
                </div>
                <div class="result-content" id="resultContent"></div>
            </div>

            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>正在为你生成专属旅行攻略...</p>
            </div>
        </div>
    </div>

    <script>
        // 偏好标签选择
        const preferenceTags = document.querySelectorAll('.preference-tag');
        const selectedPreferences = new Set();

        preferenceTags.forEach(tag => {
            tag.addEventListener('click', () => {
                const value = tag.dataset.value;
                if (selectedPreferences.has(value)) {
                    selectedPreferences.delete(value);
                    tag.classList.remove('selected');
                } else {
                    selectedPreferences.add(value);
                    tag.classList.add('selected');
                }
            });
        });

        // 生成攻略
        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const resultSection = document.getElementById('resultSection');
        const resultContent = document.getElementById('resultContent');
        const errorMsg = document.getElementById('errorMsg');

        generateBtn.addEventListener('click', async () => {
            const destination = document.getElementById('destination').value.trim();
            const days = document.getElementById('days').value;
            const budget = document.getElementById('budget').value;
            const preferences = Array.from(selectedPreferences).join('、');

            // 验证输入
            if (!destination) {
                showError('请输入目的地');
                return;
            }

            if (!days || days < 1 || days > 30) {
                showError('请输入有效的旅行天数（1-30天）');
                return;
            }

            // 隐藏错误和结果
            errorMsg.classList.remove('show');
            resultSection.classList.remove('show');

            // 显示加载
            loading.style.display = 'block';
            generateBtn.disabled = true;

            try {
                const prompt = buildPrompt(destination, days, budget, preferences);
                const result = await callQianwenAPI(prompt);
                
                resultContent.textContent = result;
                resultSection.classList.add('show');
            } catch (error) {
                showError('生成攻略失败：' + error.message);
            } finally {
                loading.style.display = 'none';
                generateBtn.disabled = false;
            }
        });

        // 构建提示词
        function buildPrompt(destination, days, budget, preferences) {
            let prompt = `请为我生成一份详细的${destination}${days}天旅行攻略。\n\n`;
            prompt += `预算水平：${budget}\n`;
            
            if (preferences) {
                prompt += `旅行偏好：${preferences}\n`;
            }

            prompt += `\n请包含以下内容：\n`;
            prompt += `1. 每日详细行程安排（上午、下午、晚上）\n`;
            prompt += `2. 必去景点推荐及门票价格\n`;
            prompt += `3. 当地特色美食推荐（至少5道）\n`;
            prompt += `4. 住宿建议（根据预算水平）\n`;
            prompt += `5. 交通指南（如何到达、当地交通）\n`;
            prompt += `6. 预算明细估算\n`;
            prompt += `7. 实用贴士（注意事项、最佳旅游时间等）\n`;
            prompt += `\n请用清晰的格式输出，让攻略易于阅读和执行。`;

            return prompt;
        }

        // 调用通义千问 API
        async function callQianwenAPI(prompt) {
            // TODO: 在这里填入你的通义千问 API Key
            const API_KEY = 'YOUR_API_KEY_HERE';
            
            if (API_KEY === 'YOUR_API_KEY_HERE') {
                throw new Error('请先在代码中配置你的通义千问 API Key');
            }

            const response = await fetch('https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${API_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: 'qwen-turbo',
                    input: {
                        messages: [
                            {
                                role: 'system',
                                content: '你是一个专业的旅行规划师，擅长制定详细、实用的旅行攻略。'
                            },
                            {
                                role: 'user',
                                content: prompt
                            }
                        ]
                    },
                    parameters: {
                        result_format: 'message'
                    }
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || 'API 调用失败');
            }

            const data = await response.json();
            return data.output.choices[0].message.content;
        }

        // 复制攻略
        document.getElementById('copyBtn').addEventListener('click', () => {
            const text = resultContent.textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.textContent;
                btn.textContent = '已复制！';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        });

        // 显示错误
        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.classList.add('show');
        }
    </script>
</body>
</html>
