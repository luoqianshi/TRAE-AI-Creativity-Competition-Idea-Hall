<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国历史纪年时间轴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-deep:#0a0a0f;
  --bg-card:rgba(18,18,28,0.85);
  --bg-card-hover:rgba(28,28,42,0.95);
  --text-primary:#e8e0d0;
  --text-secondary:#9a9484;
  --text-dim:#6a6458;
  --border-subtle:rgba(201,168,76,0.15);
  --spine-width:3px;
}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Serif SC','SimSun',serif;
  background:var(--bg-deep);
  color:var(--text-primary);
  min-height:100vh;
  line-height:1.7;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 800px 600px at 20% 10%,rgba(194,58,43,0.04),transparent),
    radial-gradient(ellipse 600px 800px at 80% 90%,rgba(201,168,76,0.03),transparent);
  pointer-events:none;z-index:0;
}

/* ── 检索栏 ── */
.search-bar{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  background:rgba(10,10,15,0.94);
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-bottom:1px solid var(--border-subtle);
  padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.search-bar .brand{
  font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;
  font-size:20px;color:var(--gold,#c9a84c);white-space:nowrap;letter-spacing:4px;
  text-shadow:0 0 20px rgba(201,168,76,0.3);flex-shrink:0;
}
.search-bar .brand span{color:#e05545;font-size:13px;letter-spacing:1px;margin-left:6px;opacity:.7}
.search-input-wrap{position:relative;flex:1;max-width:340px;min-width:180px}
.search-input-wrap input{
  width:100%;padding:8px 14px 8px 38px;
  background:rgba(255,255,255,0.06);border:1px solid var(--border-subtle);
  border-radius:6px;color:var(--text-primary);font-family:inherit;font-size:13px;outline:none;
  transition:all .3s;
}
.search-input-wrap input:focus{border-color:#c9a84c;box-shadow:0 0 0 2px rgba(201,168,76,0.2);background:rgba(255,255,255,0.09)}
.search-input-wrap input::placeholder{color:var(--text-dim)}
.search-input-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-dim);pointer-events:none}
.dynasty-chips{display:flex;gap:5px;flex-wrap:wrap;flex:2;min-width:0}
.dynasty-chip{
  padding:4px 12px;background:rgba(255,255,255,0.04);border:1px solid var(--border-subtle);
  border-radius:4px;color:var(--text-secondary);font-size:12px;cursor:pointer;
  transition:all .25s;white-space:nowrap;font-family:'Noto Serif SC',serif;letter-spacing:1px;
}
.dynasty-chip:hover{transform:translateY(-1px)}
.dynasty-chip.active{box-shadow:0 0 12px rgba(0,0,0,0.3)}
.search-results-hint{
  position:absolute;top:100%;left:0;right:0;
  background:rgba(10,10,15,0.96);border:1px solid var(--border-subtle);
  border-radius:0 0 6px 6px;max-height:300px;overflow-y:auto;display:none;z-index:1001;
}
.search-results-hint.show{display:block}
.search-result-item{padding:8px 14px;cursor:pointer;font-size:12px;color:var(--text-secondary);border-bottom:1px solid rgba(255,255,255,0.03);transition:background .2s}
.search-result-item:hover{background:rgba(194,58,43,0.1);color:var(--text-primary)}
.search-result-item mark{background:rgba(201,168,76,0.3);color:#c9a84c;border-radius:2px;padding:0 2px}

/* ── 主内容 ── */
main{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:80px 20px 60px}

/* ── 朝代区块 ── */
.dynasty-section{
  position:relative;margin-bottom:16px;
  opacity:0;transform:translateY(30px);
  transition:opacity .6s ease,transform .6s ease;
}
.dynasty-section.visible{opacity:1;transform:translateY(0)}
.dynasty-section::before{
  content:'';position:absolute;inset:0;border-radius:8px;pointer-events:none;z-index:0;
  opacity:0.4;
}

/* 朝代标题 */
.dynasty-header{display:flex;align-items:center;justify-content:center;gap:16px;padding:28px 0 16px;position:relative;z-index:1}
.dynasty-header::before,.dynasty-header::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border-subtle),transparent)}
.dynasty-title-wrap{text-align:center;position:relative}
.dynasty-title{
  font-family:'ZCOOL XiaoWei','Noto Serif SC',serif;
  font-size:26px;font-weight:700;letter-spacing:8px;
  position:relative;padding:4px 24px;
}
.dynasty-title::after{
  content:'';position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);
  width:60%;height:2px;border-radius:1px;
}
.dynasty-years{font-size:12px;color:var(--text-dim);letter-spacing:2px;margin-top:2px}

/* ── 时间轴 ── */
.timeline-container{position:relative;display:grid;grid-template-columns:1fr 120px 1fr;gap:0;align-items:start;z-index:1}
.timeline-spine{position:relative;display:flex;flex-direction:column;align-items:center}
.timeline-spine::before{content:'';position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:var(--spine-width);border-radius:2px}
.year-node{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:10px 0;cursor:default}
.year-dot{
  width:12px;height:12px;border-radius:50%;border:2px solid;
  transition:all .3s;position:relative;z-index:2;
}
.year-node:hover .year-dot{transform:scale(1.4);filter:brightness(1.3)}
.year-label-ce{font-size:11px;margin-top:3px;white-space:nowrap;letter-spacing:.5px;font-weight:600;opacity:.9}
.year-label-era{font-size:11px;margin-top:1px;white-space:nowrap;letter-spacing:1px;opacity:.7;font-style:italic}

/* ── 事件卡片 ── */
.events-left,.events-right{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.events-left{align-items:flex-end;padding-right:4px}
.events-right{align-items:flex-start;padding-left:4px}
.event-card{
  max-width:480px;width:100%;padding:10px 14px;
  background:var(--bg-card);border:1px solid var(--border-subtle);
  border-radius:6px;transition:all .3s;position:relative;overflow:hidden;
}
.event-card::before{content:'';position:absolute;top:0;width:3px;height:100%}
.events-left .event-card::before{right:0}
.events-right .event-card::before{left:0}
.event-card:hover{background:var(--bg-card-hover);transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.event-year-badge{
  display:inline-block;font-size:10px;padding:1px 7px;border-radius:3px;margin-bottom:4px;
  font-weight:600;letter-spacing:.5px;
}
.events-left .event-year-badge{background:rgba(201,168,76,0.12);color:#c9a84c;border:1px solid rgba(201,168,76,0.2)}
.events-right .event-year-badge{background:rgba(194,58,43,0.12);color:#e05545;border:1px solid rgba(194,58,43,0.2)}
.event-text{font-size:13px;line-height:1.6;color:var(--text-primary)}

/* 连接线 */
.events-left .event-card::after{content:'';position:absolute;right:-14px;top:50%;width:14px;height:1px;opacity:.3}
.events-right .event-card::after{content:'';position:absolute;left:-14px;top:50%;width:14px;height:1px;opacity:.3}

/* ── 列标题 ── */
.column-headers{display:grid;grid-template-columns:1fr 120px 1fr;gap:0;margin-bottom:12px;padding:10px 0;border-bottom:1px solid var(--border-subtle)}
.col-header{font-size:12px;letter-spacing:3px;text-align:center;color:var(--text-dim);font-weight:600}
.legend{display:flex;justify-content:center;gap:28px;padding:6px 0 2px;font-size:11px;color:var(--text-dim)}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:8px;height:8px;border-radius:50%}
.legend-dot.world{background:#c9a84c}
.legend-dot.china{background:#c23a2b}

/* ── 回到顶部 ── */
.back-to-top{
  position:fixed;bottom:28px;right:28px;width:40px;height:40px;border-radius:50%;
  background:rgba(194,58,43,0.2);border:1px solid #c23a2b;color:#e05545;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  opacity:0;transform:translateY(10px);transition:all .3s;z-index:999;
  backdrop-filter:blur(10px);
}
.back-to-top.show{opacity:1;transform:translateY(0)}
.back-to-top:hover{background:rgba(194,58,43,0.4);transform:translateY(-2px)}

.stats-bar{text-align:center;padding:16px;color:var(--text-dim);font-size:11px;letter-spacing:2px;border-top:1px solid var(--border-subtle);margin-top:30px}

/* ── 搜索高亮 ── */
.event-card.search-match{border-color:#c9a84c !important;box-shadow:0 0 20px rgba(201,168,76,0.2) !important}
.event-card.search-dim{opacity:.15}
.dynasty-section.search-dim{opacity:.1;transform:translateY(0)}
.dynasty-section.search-dim.visible{opacity:.1;transform:translateY(0)}

/* ── 滚动条 ── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg-deep)}
::-webkit-scrollbar-thumb{background:#2a2a3e;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#c23a2b}

/* ── 响应式 ── */
@media(max-width:900px){
  .timeline-container{grid-template-columns:1fr 80px 1fr}
  .dynasty-chips{display:none}
  .event-card{max-width:100%}
  .dynasty-title{font-size:20px;letter-spacing:4px}
}
@media(max-width:600px){
  .search-bar{padding:6px 10px;gap:6px}
  .search-bar .brand{font-size:15px}
  main{padding:72px 6px 30px}
  .timeline-container{grid-template-columns:1fr 60px 1fr}
  .event-card{padding:7px 9px}
  .event-text{font-size:12px}
  .dynasty-title{font-size:16px}
  .year-label-ce,.year-label-era{font-size:9px}
}
</style>
</head>

  <div class="search-input-wrap">

    <div class="search-results-hint" id="searchResults"></div>
  </div>
  <nav class="dynasty-chips" id="dynastyChips"></nav>
</header>

<main id="mainContent">
  <div class="column-headers">
    <div class="col-header" style="color:#c9a84c">◈ 世界大事纪</div>

    <div class="col-header" style="color:#e05545">◈ 华夏大事纪</div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot world"></div>世界重大事件（含中国）</div>
    <div class="legend-item"><div class="legend-dot china"></div>中国国内重大事件</div>
  </div>
  <div id="timelineRoot"></div>
  <div class="stats-bar" id="statsBar"></div>
</main>

<div class="back-to-top" id="backToTop" title="回到顶部">

// 数字转中文年数
// ═══════════════════════════════════════════════════════════
function numToCnYear(n) {
  if (n === 1) return '元年';
  if (n <= 0) return '';
  const digits = ['零','一','二','三','四','五','六','七','八','九'];
  const teens = ['十','十一','十二','十三','十四','十五','十六','十七','十八','十九'];
  if (n < 10) return digits[n] + '年';
  if (n < 20) return teens[n - 10] + '年';
  if (n < 100) {
    const ten = Math.floor(n / 10);
    const unit = n % 10;
    return (ten > 1 ? digits[ten] : '') + '十' + (unit ? digits[unit] : '') + '年';
  }
  return n + '年';
}

// 根据年份获取中国纪年
function getEraName(year, dynastyKey) {
  // 新中国及以后统一使用公元纪年，不再使用年号纪年
  if (dynastyKey === '新中国') {
    return year + '年';
  }
  const eras = ERA_NAMES[dynastyKey];
  if (!eras) return null;
  for (const era of eras) {
    if (year >= era.s && year <= era.e) {
      const offset = year - era.s + 1;
      return era.name + numToCnYear(offset);
    }
  }
  return null;
}

// 工具函数
// ═══════════════════════════════════════════════════════════
function formatYear(y){
  if(y<0) return `公元前${Math.abs(y)}年`;
  return `公元${y}年`;
}
function formatYearShort(y){
  if(y<0) return `前${Math.abs(y)}`;
  return `${y}`;
}

// ═══════════════════════════════════════════════════════════
// 渲染时间轴
// ═══════════════════════════════════════════════════════════
function renderTimeline() {
  const root = document.getElementById('timelineRoot');
  root.innerHTML = '';
  let totalEvents = 0;

  HISTORICAL_DATA.forEach(dynasty => {
    const theme = DYNASTY_THEMES[dynasty.dynasty] || DYNASTY_THEMES['汉'];
    const section = document.createElement('section');
    section.className = 'dynasty-section';
    section.id = `dynasty-${dynasty.dynasty}`;
    section.dataset.dynasty = dynasty.dynasty;
    section.dataset.fullName = dynasty.fullName;

    // 朝代专属背景
    section.style.setProperty('--dynasty-primary', theme.primary);
    section.style.setProperty('--dynasty-secondary', theme.secondary);
    section.style.setProperty('--dynasty-accent', theme.accent);
    section.style.setProperty('--dynasty-bg', theme.bg);

    // 朝代专属背景
    const bgDiv = document.createElement('div');
    bgDiv.style.cssText = `position:absolute;inset:0;border-radius:8px;pointer-events:none;z-index:0;
      background:
        radial-gradient(ellipse 400px 200px at 15% 20%,${theme.bg},transparent 60%),
        radial-gradient(ellipse 400px 200px at 85% 80%,${theme.bg},transparent 60%),
        linear-gradient(135deg,${theme.bg},transparent 40%,${theme.bg});
      border:1px solid ${theme.primary}22;`;
    section.appendChild(bgDiv);

    // 朝代标题
    const header = document.createElement('div');
    header.className = 'dynasty-header';
    header.style.position = 'relative';
    header.style.zIndex = '1';
    header.innerHTML = `
      <div style="text-align:center;position:relative">
        <div class="dynasty-title" style="color:${theme.primary};text-shadow:0 0 30px ${theme.primary}40">
          ${dynasty.fullName}
        </div>
        <div style="width:60%;height:2px;margin:4px auto 0;background:linear-gradient(90deg,transparent,${theme.primary}80,transparent);border-radius:1px"></div>
        <div class="dynasty-years">${formatYear(dynasty.startYear)} — ${formatYear(dynasty.endYear)}</div>
      </div>
    `;
    section.appendChild(header);

    // 遍历各时期
    dynasty.eras.forEach(era => {
      const allEvents = [];
      era.world.forEach(e => allEvents.push({...e, side:'left'}));
      era.china.forEach(e => allEvents.push({...e, side:'right'}));
      allEvents.sort((a,b) => a.year - b.year);

      const yearGroups = {};
      allEvents.forEach(e => {
        if(!yearGroups[e.year]) yearGroups[e.year] = {left:[],right:[]};
        yearGroups[e.year][e.side].push(e.text);
      });

      const sortedYears = Object.keys(yearGroups).map(Number).sort((a,b) => a - b);

      sortedYears.forEach(year => {
        const group = yearGroups[year];
        totalEvents += group.left.length + group.right.length;

        const row = document.createElement('div');
        row.className = 'timeline-container';
        row.dataset.year = year;

        // 左侧事件
        const leftDiv = document.createElement('div');
        leftDiv.className = 'events-left';
        group.left.forEach(text => {
          const card = document.createElement('div');
          card.className = 'event-card';
          card.dataset.year = year;
          card.dataset.side = 'world';
          card.style.borderColor = `${theme.primary}20`;
          card.innerHTML = `
            <div class="event-year-badge" style="background:${theme.primary}18;color:${theme.secondary};border-color:${theme.primary}30">${formatYear(year)}</div>
            <div class="event-text">${text}</div>`;
          // 左侧装饰线
          card.querySelector('.event-card')?.style;
          const before = card.querySelector('::before');
          leftDiv.appendChild(card);
        });

        // 中轴节点 - 显示公元纪年 + 中国纪年
        const spine = document.createElement('div');
        spine.className = 'timeline-spine';
        spine.style.setProperty('--spine-color', theme.primary);

        const node = document.createElement('div');
        node.className = 'year-node';

        // 中国纪年
        const eraName = getEraName(year, dynasty.dynasty);

        node.innerHTML = `
          <div class="year-label-ce" style="color:${theme.secondary}">${formatYearShort(year)}</div>
          <div class="year-dot" style="border-color:${theme.primary};box-shadow:0 0 8px ${theme.primary}40;background:var(--bg-deep)"></div>
          <div class="year-label-era" style="color:${theme.primary};font-style:normal;font-weight:600;letter-spacing:1px">${eraName || ''}</div>
        `;
        spine.appendChild(node);

        // 中轴线颜色
        const spineLine = document.createElement('div');
        spineLine.style.cssText = `position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:2px;
          background:linear-gradient(180deg,${theme.primary}60,${theme.primary}20,${theme.primary}60);border-radius:1px;`;
        spine.insertBefore(spineLine, spine.firstChild);

        // 右侧事件
        const rightDiv = document.createElement('div');
        rightDiv.className = 'events-right';
        group.right.forEach(text => {
          const card = document.createElement('div');
          card.className = 'event-card';
          card.dataset.year = year;
          card.dataset.side = 'china';
          card.style.borderColor = `${theme.primary}20`;
          card.innerHTML = `
            <div class="event-year-badge" style="background:${theme.primary}18;color:${theme.secondary};border-color:${theme.primary}30">${formatYear(year)}</div>
            <div class="event-text">${text}</div>`;
          rightDiv.appendChild(card);
        });

        row.appendChild(leftDiv);
        row.appendChild(spine);
        row.appendChild(rightDiv);
        section.appendChild(row);
      });
    });

    root.appendChild(section);
  });

  document.getElementById('statsBar').textContent =
    `共 ${HISTORICAL_DATA.length} 个朝代 · ${totalEvents} 条重大事件 · 跨越 ${Math.abs(-1046)+2026} 年`;
}

// ═══════════════════════════════════════════════════════════
// 朝代快速导航
// ═══════════════════════════════════════════════════════════
function renderDynastyChips() {
  const container = document.getElementById('dynastyChips');
  HISTORICAL_DATA.forEach(d => {
    const theme = DYNASTY_THEMES[d.dynasty] || {};
    const chip = document.createElement('button');
    chip.className = 'dynasty-chip';
    chip.textContent = d.dynasty;
    chip.dataset.target = d.dynasty;
    chip.style.borderColor = `${theme.primary || '#666'}30`;
    chip.addEventListener('click', () => {
      const section = document.getElementById(`dynasty-${d.dynasty}`);
      if(section){
        section.scrollIntoView({behavior:'smooth',block:'start'});
        document.querySelectorAll('.dynasty-chip').forEach(c => {
          c.classList.remove('active');
          c.style.borderColor = `${DYNASTY_THEMES[c.dataset.target]?.primary || '#666'}30`;
          c.style.color = '';
        });
        chip.classList.add('active');
        chip.style.borderColor = theme.primary;
        chip.style.color = theme.secondary;
        setTimeout(() => {
          chip.classList.remove('active');
          chip.style.borderColor = `${theme.primary}30`;
          chip.style.color = '';
        }, 2000);
      }
    });
    container.appendChild(chip);
  });
}

// ═══════════════════════════════════════════════════════════
// 搜索功能
// ═══════════════════════════════════════════════════════════
function initSearch(){
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');

  input.addEventListener('input', () => {
    const q = input.value.trim();
    if(!q){ results.classList.remove('show'); clearSearchHighlight(); return; }
    performSearch(q);
  });

  input.addEventListener('keydown', e => {
    if(e.key==='Enter'){
      const q = input.value.trim();
      if(q){ results.classList.remove('show'); performSearch(q, true); }
    }
    if(e.key==='Escape'){ results.classList.remove('show'); input.value=''; clearSearchHighlight(); }
  });

  document.addEventListener('click', e => {
    if(!e.target.closest('.search-input-wrap')) results.classList.remove('show');
  });
}

function performSearch(query, scroll=false){
  const results = document.getElementById('searchResults');
  const matches = [];
  const q = query.toLowerCase();
  const isYearSearch = /^-?\d+$/.test(query);
  const yearNum = isYearSearch ? parseInt(query) : null;

  HISTORICAL_DATA.forEach(dynasty => {
    if(dynasty.dynasty.includes(q) || dynasty.fullName.includes(q)){
      matches.push({type:'dynasty',dynasty:dynasty.dynasty,fullName:dynasty.fullName,targetId:`dynasty-${dynasty.dynasty}`});
    }
    dynasty.eras.forEach(era => {
      if(era.label.toLowerCase().includes(q)){
        matches.push({type:'era',dynasty:dynasty.dynasty,era:era.label,targetId:`dynasty-${dynasty.dynasty}`});
      }
      // 年号搜索
      const eraNames = ERA_NAMES[dynasty.dynasty];
      if(eraNames){
        eraNames.forEach(en => {
          if(en.name.includes(q)){
            matches.push({type:'eraName',dynasty:dynasty.dynasty,eraName:en.name,
              yearRange:`${formatYearShort(en.s)}-${formatYearShort(en.e)}`,targetId:`dynasty-${dynasty.dynasty}`});
          }
        });
      }
      if(isYearSearch && yearNum >= era.yearStart && yearNum <= era.yearEnd){
        matches.push({type:'year',dynasty:dynasty.dynasty,era:era.label,year:yearNum,targetId:`dynasty-${dynasty.dynasty}`});
      }
      const allEvents = [...era.world.map(e=>({...e,side:'世界'})),...era.china.map(e=>({...e,side:'中国'}))];
      allEvents.forEach(e => {
        if(e.text.toLowerCase().includes(q)){
          matches.push({type:'event',dynasty:dynasty.dynasty,era:era.label,year:e.year,text:e.text,side:e.side,targetId:`dynasty-${dynasty.dynasty}`});
        }
      });
    });
  });

  const limited = matches.slice(0,20);

  if(scroll && limited.length > 0){
    const target = document.getElementById(limited[0].targetId);
    if(target){ target.scrollIntoView({behavior:'smooth',block:'start'}); highlightSearch(query); }
    results.classList.remove('show');
    return;
  }

  if(limited.length === 0){
    results.innerHTML = '<div class="search-result-item" style="color:var(--text-dim)">未找到匹配结果</div>';
  } else {
    results.innerHTML = limited.map(m => {
      let display = '';
      const theme = DYNASTY_THEMES[m.dynasty] || {};
      if(m.type==='dynasty') display = `<span style="color:${theme.primary}">【朝代】</span> ${m.fullName}`;
      else if(m.type==='era') display = `<span style="color:${theme.primary}">【时期】</span> ${m.era} — ${m.dynasty}`;
      else if(m.type==='eraName') display = `<span style="color:${theme.primary}">【年号】</span> ${m.eraName}（${m.yearRange}）— ${m.dynasty}`;
      else if(m.type==='year') display = `<span style="color:${theme.primary}">【年份】</span> ${formatYear(m.year)} — ${m.era}（${m.dynasty}）`;
      else {
        const highlighted = m.text.replace(new RegExp(`(${escapeRegex(query)})`,'gi'),'<mark>$1</mark>');
        display = `<span style="color:var(--text-dim)">${formatYear(m.year)} ${m.side}</span> ${highlighted}`;
      }
      return `<div class="search-result-item" data-target="${m.targetId}" data-year="${m.year||''}">${display}</div>`;
    }).join('');
  }
  results.classList.add('show');

  results.querySelectorAll('.search-result-item').forEach(item => {
    item.addEventListener('click', () => {
      const target = document.getElementById(item.dataset.target);
      if(target){ target.scrollIntoView({behavior:'smooth',block:'start'}); highlightSearch(query); }
      results.classList.remove('show');
    });
  });
}

function highlightSearch(query){
  const q = query.toLowerCase();
  const isYearSearch = /^-?\d+$/.test(query);
  const yearNum = isYearSearch ? parseInt(query) : null;

  document.querySelectorAll('.event-card').forEach(card => {
    const cardYear = parseInt(card.dataset.year);
    const cardText = card.querySelector('.event-text').textContent.toLowerCase();
    let match = false;
    if(isYearSearch && cardYear === yearNum) match = true;
    if(cardText.includes(q)) match = true;
    card.classList.toggle('search-match', match);
    card.classList.toggle('search-dim', !match);
  });

  document.querySelectorAll('.dynasty-section').forEach(section => {
    const hasMatch = section.querySelector('.event-card.search-match');
    section.classList.toggle('search-dim', !hasMatch);
  });
}

function clearSearchHighlight(){
  document.querySelectorAll('.event-card').forEach(card => { card.classList.remove('search-match','search-dim'); });
  document.querySelectorAll('.dynasty-section').forEach(section => { section.classList.remove('search-dim'); });
}

function escapeRegex(str){ return str.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

// ═══════════════════════════════════════════════════════════
// 滚动动画 & 回到顶部
// ═══════════════════════════════════════════════════════════
function initScrollAnimations(){
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('visible'); });
  }, {threshold:0.05, rootMargin:'0px 0px -50px 0px'});
  document.querySelectorAll('.dynasty-section').forEach(s => observer.observe(s));
}

function initBackToTop(){
  const btn = document.getElementById('backToTop');
  window.addEventListener('scroll', () => { btn.classList.toggle('show', window.scrollY > 600); });
  btn.addEventListener('click', () => { window.scrollTo({top:0,behavior:'smooth'}); });
}

// ═══════════════════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  renderTimeline();
  renderDynastyChips();
  initSearch();
  initScrollAnimations();
  initBackToTop();
});
</script>
