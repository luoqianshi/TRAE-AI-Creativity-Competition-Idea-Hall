<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏数据分析与修改工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #eee;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #e94560;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
        }

        .header p {
            color: #a0a0a0;
            margin-top: 10px;
        }

        .upload-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .upload-area {
            border: 3px dashed #e94560;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            background: rgba(233, 69, 96, 0.1);
            border-color: #ff6b81;
        }

        .upload-area.dragover {
            background: rgba(233, 69, 96, 0.2);
            border-color: #ff6b81;
        }

        .upload-icon {
            font-size: 3em;
            color: #e94560;
            margin-bottom: 15px;
        }

        .file-input {
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #e94560;
        }

        .stat-label {
            color: #a0a0a0;
            margin-top: 5px;
        }

        .data-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-title {
            font-size: 1.5em;
            color: #e94560;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #eee;
            font-size: 1em;
            margin-bottom: 20px;
        }

        .search-box:focus {
            outline: none;
            border-color: #e94560;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            background: rgba(233, 69, 96, 0.2);
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #e94560;
            border-bottom: 2px solid #e94560;
        }

        .data-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .data-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .field-name {
            font-weight: 600;
            color: #fff;
        }

        .field-path {
            font-size: 0.85em;
            color: #888;
            font-family: monospace;
        }

        .field-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .type-int { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .type-float { background: rgba(33, 150, 243, 0.2); color: #2196f3; }
        .type-str { background: rgba(255, 152, 0, 0.2); color: #ff9800; }
        .type-bool { background: rgba(156, 39, 176, 0.2); color: #9c27b0; }

        .value-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: #eee;
            font-size: 0.95em;
        }

        .value-input:focus {
            outline: none;
            border-color: #e94560;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #e94560;
            color: white;
        }

        .btn-primary:hover {
            background: #ff6b81;
            transform: scale(1.05);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #eee;
            margin-left: 10px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .key-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .key-stat-item {
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .key-stat-name {
            color: #e94560;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .key-stat-value {
            font-size: 1.3em;
            color: #fff;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: #4caf50;
        }

        .notification.error {
            background: #f44336;
        }

        .hidden {
            display: none;
        }

        .editable-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75em;
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
        }

        .readonly-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75em;
            background: rgba(158, 158, 158, 0.2);
            color: #9e9e9e;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .data-table {
                font-size: 0.85em;
            }
            
            .data-table th,
            .data-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 游戏数据分析与修改工具</h1>
            <p>支持 JSON、XML、SQLite、二进制存档格式</p>
        </div>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <h3>点击或拖拽上传游戏存档文件</h3>
                <p>支持 .json, .xml, .db, .sqlite, .sav 等格式</p>
                <input type="file" class="file-input" id="fileInput" accept="*/*">
            </div>
        </div>

        <div id="analysisResult" class="hidden">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="formatType">-</div>
                    <div class="stat-label">文件格式</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalFields">0</div>
                    <div class="stat-label">总字段数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="editableFields">0</div>
                    <div class="stat-label">可编辑字段</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="fileName">-</div>
                    <div class="stat-label">文件名</div>
                </div>
            </div>

            <div class="data-section">
                <div class="section-title">
                    🔍 关键数值统计
                </div>
                <div class="key-stats" id="keyStats">
                    <!-- 动态生成 -->
                </div>
            </div>

            <div class="data-section">
                <div class="section-title">
                    📊 数据字段详情
                </div>
                <input type="text" class="search-box" id="searchBox" placeholder="搜索字段名称或路径...">
                
                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>字段名</th>
                                <th>路径</th>
                                <th>类型</th>
                                <th>当前值</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody">
                            <!-- 动态生成 -->
                        </tbody>
                    </table>
                </div>

                <div class="actions">
                    <button class="btn btn-primary" onclick="downloadFile()">💾 下载修改后的文件</button>
                    <button class="btn btn-secondary" onclick="restoreBackup()">🔄 恢复备份</button>
                </div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        let currentData = null;
        let filteredFields = [];

        // 上传区域事件
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileUpload(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileUpload(e.target.files[0]);
            }
        });

        // 搜索功能
        document.getElementById('searchBox').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            filterFields(query);
        });

        function handleFileUpload(file) {
            const formData = new FormData();
            formData.append('file', file);

            showNotification('正在分析文件...', 'success');

            fetch('/api/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    currentData = data;
                    displayResults(data);
                    showNotification('文件分析完成！', 'success');
                } else {
                    showNotification('分析失败: ' + data.error, 'error');
                }
            })
            .catch(error => {
                showNotification('上传失败: ' + error.message, 'error');
            });
        }

        function displayResults(data) {
            document.getElementById('analysisResult').classList.remove('hidden');
            document.getElementById('formatType').textContent = data.format_type;
            document.getElementById('totalFields').textContent = data.total_fields;
            document.getElementById('editableFields').textContent = data.editable_fields;
            document.getElementById('fileName').textContent = data.file_name;

            // 显示关键统计
            const keyStatsContainer = document.getElementById('keyStats');
            keyStatsContainer.innerHTML = '';
            
            if (data.key_stats && Object.keys(data.key_stats).length > 0) {
                for (const [key, value] of Object.entries(data.key_stats)) {
                    const item = document.createElement('div');
                    item.className = 'key-stat-item';
                    item.innerHTML = `
                        <div class="key-stat-name">${key}</div>
                        <div class="key-stat-value">${value}</div>
                    `;
                    keyStatsContainer.appendChild(item);
                }
            } else {
                keyStatsContainer.innerHTML = '<p style="color: #888; text-align: center;">未检测到关键数值字段</p>';
            }

            // 显示字段表格
            filteredFields = data.fields;
            renderTable();
        }

        function filterFields(query) {
            if (!currentData) return;
            
            if (!query) {
                filteredFields = currentData.fields;
            } else {
                filteredFields = currentData.fields.filter(field => 
                    field.name.toLowerCase().includes(query) ||
                    field.path.toLowerCase().includes(query) ||
                    String(field.value).toLowerCase().includes(query)
                );
            }
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '';

            filteredFields.forEach(field => {
                const row = document.createElement('tr');
                const typeClass = `type-${field.field_type}`;
                const statusBadge = field.editable 
                    ? '<span class="editable-badge">可编辑</span>'
                    : '<span class="readonly-badge">只读</span>';
                
                row.innerHTML = `
                    <td class="field-name">${field.name}</td>
                    <td class="field-path">${field.path}</td>
                    <td><span class="field-type ${typeClass}">${field.field_type}</span></td>
                    <td>
                        <input type="text" class="value-input" value="${field.value}" 
                               id="input-${btoa(field.path).replace(/[^a-zA-Z0-9]/g, '')}" 
                               ${field.editable ? '' : 'disabled'}>
                    </td>
                    <td>${statusBadge}</td>
                    <td>
                        ${field.editable ? `
                            <button class="btn btn-primary" onclick="modifyValue('${field.path}', '${field.field_type}')">修改</button>
                        ` : '-'}
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function modifyValue(path, fieldType) {
            const inputId = 'input-' + btoa(path).replace(/[^a-zA-Z0-9]/g, '');
            const input = document.getElementById(inputId);
            let newValue = input.value;

            // 类型转换
            if (fieldType === 'int') {
                newValue = parseInt(newValue);
            } else if (fieldType === 'float') {
                newValue = parseFloat(newValue);
            } else if (fieldType === 'bool') {
                newValue = newValue.toLowerCase() === 'true';
            }

            fetch('/api/modify', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    path: path,
                    value: newValue
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    currentData.fields = data.fields;
                    currentData.key_stats = data.key_stats;
                    filterFields(document.getElementById('searchBox').value.toLowerCase());
                    showNotification('修改成功！', 'success');
                } else {
                    showNotification('修改失败: ' + data.error, 'error');
                }
            })
            .catch(error => {
                showNotification('修改失败: ' + error.message, 'error');
            });
        }

        function downloadFile() {
            window.location.href = '/api/download';
            showNotification('开始下载文件...', 'success');
        }

        function restoreBackup() {
            fetch('/api/restore', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    currentData.fields = data.fields;
                    currentData.key_stats = data.key_stats;
                    filterFields(document.getElementById('searchBox').value.toLowerCase());
                    showNotification('备份已恢复！', 'success');
                } else {
                    showNotification('恢复失败: ' + data.error, 'error');
                }
            })
            .catch(error => {
                showNotification('恢复失败: ' + error.message, 'error');
            });
        }

        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
