<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>厨房助手 App 演示</title>
  <style>
    :root {
      --bg: #FDFBF7;
      --wood: #D7C4A1;
      --primary: #C27B5A;
      --success: #8B9E7B;
      --text-primary: #333333;
      --text-secondary: #999999;
      --text-hint: #BBBBBB;
      --border: #EEEEEE;
      --warning: #E6A23C;
      --danger: #E05050;
      --card-radius: 16px;
      --button-radius: 12px;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #E8E4DF;
      color: var(--text-primary);
    }

    #app-frame {
      max-width: 430px;
      height: 100%;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.08);
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      background: var(--bg);
    }

    .screen.active {
      display: flex;
    }

    .app-bar {
      padding: 12px 16px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
    }

    .app-bar-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .app-bar-back {
      position: absolute;
      left: 12px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
    }

    .app-bar-action {
      position: absolute;
      right: 16px;
      font-size: 14px;
      color: var(--primary);
      font-weight: 500;
      cursor: pointer;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 100px;
    }

    /* 搜索栏 */
    .search-box {
      margin-top: 12px;
      padding: 10px 14px;
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 14px;
      color: var(--text-primary);
      background: transparent;
    }

    .search-box input::placeholder {
      color: var(--text-hint);
    }

    /* 分类筛选 */
    .category-filter {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .category-chip {
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-secondary);
      transition: all 0.2s;
    }

    .category-chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: 600;
    }

    /* 菜谱卡片 */
    .recipe-card {
      display: flex;
      background: #fff;
      border-radius: var(--card-radius);
      box-shadow: var(--shadow);
      margin-top: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s;
    }

    .recipe-card.selected {
      border-color: var(--primary);
    }

    .recipe-cover {
      width: 100px;
      height: 100px;
      background: #F5F5F5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-hint);
      font-size: 12px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .recipe-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .recipe-info {
      flex: 1;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .recipe-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .recipe-tags {
      display: flex;
      gap: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 12px;
      background: #F5F5F5;
      color: var(--text-secondary);
    }

    .recipe-select {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border);
      margin: auto 12px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .recipe-select.selected {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* 底部按钮 */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 24px calc(16px + env(safe-area-inset-bottom));
      background: #fff;
      box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.04);
      z-index: 20;
    }

    .btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: var(--button-radius);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:disabled {
      background: #ddd;
      color: #fff;
      cursor: not-allowed;
    }

    .btn-warning {
      background: var(--warning);
      color: #fff;
    }

    .btn-outline {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    /* 时间头部 */
    .time-header {
      margin: 16px 0;
      padding: 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(194, 123, 90, 0.9), rgba(194, 123, 90, 0.75));
      color: #fff;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .time-number {
      font-size: 48px;
      font-weight: 700;
    }

    .time-unit {
      font-size: 16px;
      opacity: 0.8;
      margin-left: 4px;
    }

    .time-recipes {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 8px;
    }

    /* 食材清单 */
    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 0 8px;
      font-size: 16px;
      font-weight: 600;
    }

    .ingredient-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: #fff;
      border-radius: 12px;
      margin-bottom: 6px;
      box-shadow: var(--shadow);
    }

    .ingredient-check {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      border-radius: 50%;
      margin-right: 12px;
    }

    .ingredient-name {
      flex: 1;
      font-size: 15px;
    }

    .ingredient-amount {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* 烹饪步骤 */
    .step-card {
      background: #fff;
      border-radius: var(--card-radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-top: 16px;
    }

    .step-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(194, 123, 90, 0.1);
      color: var(--primary);
      font-size: 14px;
      font-weight: 600;
    }

    .step-desc {
      font-size: 18px;
      line-height: 1.6;
      margin: 20px 0 16px;
      font-weight: 500;
    }

    .timer-ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 8px solid #f5f5f5;
      border-top-color: var(--warning);
      margin: 20px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .timer-time {
      font-size: 28px;
      font-weight: 700;
    }

    .timer-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .merged-step {
      white-space: pre-line;
      font-size: 15px;
      line-height: 1.8;
      color: var(--text-primary);
    }

    .merged-step strong {
      color: var(--primary);
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    /* 导航提示 */
    .nav-hint {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 12px;
      color: var(--text-hint);
      z-index: 11;
    }

    /* 表单样式 */
    .form-input, .form-select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      background: #fff;
      color: var(--text-primary);
      outline: none;
    }

    .form-input::placeholder {
      color: var(--text-hint);
    }

    .form-label {
      display: block;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      margin-top: 16px;
    }

    .cover-upload {
      width: 100%;
      height: 180px;
      background: #F5F5F5;
      border-radius: var(--card-radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-hint);
      cursor: pointer;
      border: 2px dashed var(--border);
    }

    .cover-upload-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 24px 0 12px;
    }

    .section-header-title {
      font-size: 17px;
      font-weight: 600;
    }

    .add-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--primary);
      color: var(--primary);
      background: #fff;
      font-size: 13px;
      cursor: pointer;
    }

    .form-card {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
    }

    .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .form-row .form-input {
      flex: 1;
    }

    .form-row .form-input.small {
      flex: 0 0 80px;
    }

    .delete-btn {
      color: var(--danger);
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
    }

    .step-number {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .timer-section {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .switch {
      position: relative;
      width: 44px;
      height: 24px;
      background: #ddd;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .switch.active {
      background: var(--primary);
    }

    .switch-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .switch.active .switch-thumb {
      transform: translateX(20px);
    }
  </style>
</head>
<body>
  <div id="app-frame">
    <!-- 菜谱列表页 -->
    <div id="screen-recipes" class="screen active">
      <div class="app-bar">
        <div class="app-bar-title">菜谱</div>
        <div class="app-bar-action" onclick="showScreen('add-recipe')">+ 新增</div>
      </div>
      <div class="content">
        <div class="search-box">
          <span>🔍</span>
          <input type="text" placeholder="搜索菜谱...">
        </div>
        <div class="category-filter">
          <div class="category-chip active">全部</div>
          <div class="category-chip">时蔬</div>
          <div class="category-chip">荤菜</div>
          <div class="category-chip">主食</div>
          <div class="category-chip">汤</div>
        </div>
        <div id="recipe-list"></div>
      </div>
      <div class="bottom-bar">
        <button id="btn-start" class="btn btn-primary" disabled>请至少选择一道菜</button>
      </div>
    </div>

    <!-- 食材清单页 -->
    <div id="screen-ingredients" class="screen">
      <div class="app-bar">
        <div class="app-bar-back" onclick="showScreen('recipes')">←</div>
        <div class="app-bar-title">食材清单</div>
      </div>
      <div class="content">
        <div class="time-header">
          <div>
            <span class="time-number" id="total-time">62</span>
            <span class="time-unit">分钟</span>
          </div>
          <div class="time-recipes" id="selected-names">红烧排骨 + 辣椒炒蛋 + 清炒时蔬</div>
        </div>
        <div class="section-title">
          必备食材
          <span class="tag">必备</span>
        </div>
        <div id="required-list"></div>
        <div class="section-title">
          可选食材
          <span class="tag">可选</span>
        </div>
        <div id="optional-list"></div>
      </div>
      <div class="bottom-bar">
        <button class="btn btn-primary" onclick="showScreen('cooking')">开始烹饪</button>
      </div>
    </div>

    <!-- 烹饪页 -->
    <div id="screen-cooking" class="screen">
      <div class="app-bar">
        <div class="app-bar-back" onclick="showScreen('recipes')">←</div>
        <div class="app-bar-title">烹饪中</div>
      </div>
      <div class="content">
        <div id="cooking-step"></div>
      </div>
      <div class="bottom-bar">
        <button id="cooking-action" class="btn btn-primary" onclick="nextStep()">下一步</button>
      </div>
    </div>

    <!-- 新增菜谱页 -->
    <div id="screen-add-recipe" class="screen">
      <div class="app-bar">
        <div class="app-bar-back" onclick="showScreen('recipes')">←</div>
        <div class="app-bar-title">新增菜谱</div>
      </div>
      <div class="content">
        <div class="cover-upload" onclick="alert('演示模式：点击上传封面图')">
          <div class="cover-upload-icon">📷</div>
          <div>点击上传封面图</div>
        </div>

        <label class="form-label">菜谱名称</label>
        <input type="text" class="form-input" id="recipe-name" placeholder="请输入菜谱名称">

        <label class="form-label">分类</label>
        <select class="form-select" id="recipe-category">
          <option value="时蔬">时蔬</option>
          <option value="荤菜">荤菜</option>
          <option value="主食">主食</option>
          <option value="汤">汤</option>
        </select>

        <label class="form-label">预计耗时（分钟）</label>
        <input type="number" class="form-input" id="recipe-time" placeholder="整道菜的预计耗时">

        <div class="section-header">
          <div class="section-header-title">原料</div>
          <button class="add-btn" onclick="addIngredient()">+ 添加原料</button>
        </div>
        <div id="form-ingredients"></div>

        <div class="section-header">
          <div class="section-header-title">步骤</div>
          <button class="add-btn" onclick="addStep()">+ 添加步骤</button>
        </div>
        <div id="form-steps"></div>
      </div>
      <div class="bottom-bar">
        <button class="btn btn-primary" onclick="saveRecipe()">创建菜谱</button>
      </div>
    </div>
  </div>

  <script>
    // 模拟数据
    const recipes = [
      {
        id: 1,
        name: '红烧排骨',
        category: '荤菜',
        estimatedTime: 2940,
        coverImage: '',
        steps: [
          { description: '排骨冷水下锅焯水，水量比排骨多四五倍', operationType: 'manual' },
          { description: '拍大蒜，切生姜，切杭椒', operationType: 'manual' },
          { description: '锅里加油小火爆香葱姜，排骨下锅加调料，加入开水炖煮', operationType: 'heat_unattended', hasTimer: true, timerDuration: 1800 },
          { description: '汁水差不多时放入辣椒大蒜，断生起锅', operationType: 'heat_attended' }
        ],
        ingredients: {
          required: [
            { name: '排骨', amount: 500, unit: '克' },
            { name: '大葱', amount: 2, unit: '根' },
            { name: '生姜', amount: 10, unit: '克' },
            { name: '大蒜', amount: 5, unit: '瓣' },
            { name: '杭椒', amount: 100, unit: '克' }
          ],
          optional: [
            { name: '老抽', amount: 5, unit: '毫升' }
          ]
        }
      },
      {
        id: 2,
        name: '辣椒炒蛋',
        category: '荤菜',
        estimatedTime: 960,
        coverImage: '',
        steps: [
          { description: '洗切辣椒，打散鸡蛋', operationType: 'manual' },
          { description: '热锅炒蛋盛出', operationType: 'heat_attended' },
          { description: '炒辣椒后倒入鸡蛋翻炒均匀', operationType: 'heat_attended' }
        ],
        ingredients: {
          required: [
            { name: '鸡蛋', amount: 3, unit: '个' },
            { name: '辣椒', amount: 150, unit: '克' }
          ],
          optional: []
        }
      },
      {
        id: 3,
        name: '清炒时蔬',
        category: '时蔬',
        estimatedTime: 480,
        coverImage: '',
        steps: [
          { description: '洗净青菜沥干水分', operationType: 'manual' },
          { description: '大火快炒至断生，加盐调味', operationType: 'heat_attended' }
        ],
        ingredients: {
          required: [
            { name: '青菜', amount: 300, unit: '克' },
            { name: '蒜末', amount: 5, unit: '克' }
          ],
          optional: []
        }
      }
    ];

    const state = {
      selectedIds: new Set([1, 2, 3]),
      currentStepIndex: 0,
      timeline: []
    };

    function buildTimeline() {
      const selected = recipes.filter(r => state.selectedIds.has(r.id));
      const mainRecipe = selected[0];
      const timeline = [];
      let counter = 0;

      // 主菜步骤
      mainRecipe.steps.forEach(step => {
        counter++;
        timeline.push({
          id: `step_${counter}`,
          stepNumber: counter,
          description: step.description,
          recipeName: mainRecipe.name,
          recipeId: mainRecipe.id,
          type: step.operationType,
          hasTimer: step.hasTimer || false,
          timerDuration: step.timerDuration || 0,
          estimatedTime: 0
        });
      });

      // 其他菜的爆炒和炖煮步骤
      selected.slice(1).forEach(recipe => {
        recipe.steps.forEach(step => {
          if (step.operationType !== 'manual') {
            counter++;
            timeline.push({
              id: `step_${counter}`,
              stepNumber: counter,
              description: step.description,
              recipeName: recipe.name,
              recipeId: recipe.id,
              type: step.operationType,
              hasTimer: step.hasTimer || false,
              timerDuration: step.timerDuration || 0,
              estimatedTime: 0
            });
          }
        });
      });

      // 其他菜的备菜步骤放到最后
      selected.slice(1).forEach(recipe => {
        recipe.steps.forEach(step => {
          if (step.operationType === 'manual') {
            counter++;
            timeline.push({
              id: `step_${counter}`,
              stepNumber: counter,
              description: step.description,
              recipeName: recipe.name,
              recipeId: recipe.id,
              type: 'manual',
              hasTimer: false,
              timerDuration: 0,
              estimatedTime: 0
            });
          }
        });
      });

      return timeline;
    }

    function renderRecipes() {
      const list = document.getElementById('recipe-list');
      list.innerHTML = recipes.map(recipe => `
        <div class="recipe-card ${state.selectedIds.has(recipe.id) ? 'selected' : ''}" onclick="toggleRecipe(${recipe.id})">
          <div class="recipe-cover">
            ${recipe.coverImage ? `<img src="${recipe.coverImage}" alt="">` : '封面图'}
          </div>
          <div class="recipe-info">
            <div class="recipe-name">${recipe.name}</div>
            <div class="recipe-tags">
              <span class="tag">⏱ ${recipe.estimatedTime / 60}分钟</span>
              <span class="tag">🍽 ${recipe.category}</span>
            </div>
          </div>
          <div class="recipe-select ${state.selectedIds.has(recipe.id) ? 'selected' : ''}" onclick="event.stopPropagation(); toggleRecipe(${recipe.id})">
            ${state.selectedIds.has(recipe.id) ? '✓' : ''}
          </div>
        </div>
      `).join('');

      updateStartButton();
    }

    function toggleRecipe(id) {
      if (state.selectedIds.has(id)) {
        state.selectedIds.delete(id);
      } else {
        state.selectedIds.add(id);
      }
      renderRecipes();
    }

    function updateStartButton() {
      const btn = document.getElementById('btn-start');
      const count = state.selectedIds.size;
      if (count === 0) {
        btn.disabled = true;
        btn.textContent = '请至少选择一道菜';
      } else {
        btn.disabled = false;
        btn.textContent = `已选 ${count} 道菜`;
        btn.onclick = startCooking;
      }
    }

    function startCooking() {
      state.timeline = buildTimeline();
      state.currentStepIndex = 0;

      const selected = recipes.filter(r => state.selectedIds.has(r.id));
      const totalSeconds = selected.reduce((sum, r) => sum + r.estimatedTime, 0);
      document.getElementById('total-time').textContent = Math.round(totalSeconds / 60);
      document.getElementById('selected-names').textContent = selected.map(r => r.name).join(' + ');

      // 合并食材
      const required = [];
      const optional = [];
      selected.forEach(r => {
        r.ingredients.required.forEach(i => required.push({ ...i, recipe: r.name }));
        r.ingredients.optional.forEach(i => optional.push({ ...i, recipe: r.name }));
      });

      document.getElementById('required-list').innerHTML = required.map(i => `
        <div class="ingredient-item">
          <div class="ingredient-check"></div>
          <div class="ingredient-name">${i.name}</div>
          <div class="ingredient-amount">${i.amount} ${i.unit}</div>
        </div>
      `).join('');

      document.getElementById('optional-list').innerHTML = optional.length > 0 ? optional.map(i => `
        <div class="ingredient-item">
          <div class="ingredient-check"></div>
          <div class="ingredient-name">${i.name}</div>
          <div class="ingredient-amount">${i.amount} ${i.unit}</div>
        </div>
      `).join('') : '<div style="color: var(--text-hint); font-size: 14px;">无可选食材</div>';

      showScreen('ingredients');
    }

    function renderCookingStep() {
      const step = state.timeline[state.currentStepIndex];
      const container = document.getElementById('cooking-step');
      const actionBtn = document.getElementById('cooking-action');

      if (!step) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎉</div>
            <div>烹饪完成！</div>
          </div>
        `;
        actionBtn.textContent = '完成';
        actionBtn.onclick = () => showScreen('recipes');
        return;
      }

      const isMerged = step.id.startsWith('merged');
      const typeLabel = step.type === 'heat_unattended' ? '炖煮' : step.type === 'heat_attended' ? '爆炒' : '备菜';

      container.innerHTML = `
        <div class="step-card">
          <div class="step-badge">步骤 ${state.currentStepIndex + 1}/${state.timeline.length}</div>
          <div class="step-desc">${isMerged ? '' : `【${step.recipeName}】`}${step.description}</div>
          ${!isMerged ? `<div class="tag">${typeLabel}</div>` : ''}
          ${step.hasTimer ? `
            <div class="timer-ring">
              <div class="timer-time">${formatTime(step.timerDuration)}</div>
              <div class="timer-label">等待</div>
            </div>
          ` : ''}
          ${isMerged ? `<div class="merged-step">${step.description}</div>` : ''}
        </div>
      `;

      if (state.currentStepIndex >= state.timeline.length - 1) {
        actionBtn.textContent = '完成烹饪';
      } else {
        actionBtn.textContent = '下一步';
      }
    }

    function nextStep() {
      const step = state.timeline[state.currentStepIndex];

      // 如果是炖煮步骤，执行合并备菜逻辑
      if (step && step.type === 'heat_unattended') {
        const currentRecipeId = step.recipeId;
        const manualStepsToMerge = [];
        const removeIndices = [];

        for (let i = 0; i < state.timeline.length; i++) {
          const s = state.timeline[i];
          if (s.type === 'manual') {
            if (s.recipeId !== currentRecipeId || i > state.currentStepIndex) {
              manualStepsToMerge.push(s);
              removeIndices.push(i);
            }
          }
        }

        if (manualStepsToMerge.length > 0) {
          const descriptions = manualStepsToMerge
            .map(s => `【${s.recipeName}】${s.description}`)
            .join('\n');

          const mergedStep = {
            id: 'merged_' + Date.now(),
            stepNumber: 0,
            description: '统一备料：\n' + descriptions,
            recipeName: '',
            recipeId: 0,
            type: 'manual',
            hasTimer: false,
            timerDuration: 0,
            estimatedTime: 0
          };

          removeIndices.sort((a, b) => b - a);
          removeIndices.forEach(idx => state.timeline.splice(idx, 1));
          state.timeline.splice(state.currentStepIndex + 1, 0, mergedStep);
        }
      }

      state.currentStepIndex++;
      renderCookingStep();
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function showScreen(name) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(`screen-${name}`).classList.add('active');
      if (name === 'cooking') {
        renderCookingStep();
      }
    }

    // 新增菜谱表单状态
    let formIngredients = [{ name: '', amount: '', unit: '克', isRequired: true }];
    let formSteps = [{ description: '', operationType: 'manual', hasTimer: false, timerDuration: 0 }];

    function renderFormIngredients() {
      const container = document.getElementById('form-ingredients');
      container.innerHTML = formIngredients.map((ing, index) => `
        <div class="form-card">
          <div class="form-row">
            <input type="text" class="form-input" placeholder="名称" value="${ing.name}" onchange="formIngredients[${index}].name = this.value">
            <input type="number" class="form-input small" placeholder="用量" value="${ing.amount}" onchange="formIngredients[${index}].amount = this.value">
            <input type="text" class="form-input small" placeholder="单位" value="${ing.unit}" onchange="formIngredients[${index}].unit = this.value">
          </div>
          ${formIngredients.length > 1 ? `<div class="delete-btn" onclick="removeIngredient(${index})">删除</div>` : ''}
        </div>
      `).join('');
    }

    function addIngredient() {
      formIngredients.push({ name: '', amount: '', unit: '克', isRequired: true });
      renderFormIngredients();
    }

    function removeIngredient(index) {
      formIngredients.splice(index, 1);
      renderFormIngredients();
    }

    function renderFormSteps() {
      const container = document.getElementById('form-steps');
      container.innerHTML = formSteps.map((step, index) => `
        <div class="form-card">
          <div class="step-number">${index + 1}</div>
          <input type="text" class="form-input" placeholder="步骤描述" value="${step.description}" onchange="formSteps[${index}].description = this.value" style="margin-bottom: 10px;">
          <select class="form-select" onchange="changeStepType(${index}, this.value)">
            <option value="manual" ${step.operationType === 'manual' ? 'selected' : ''}>备菜/备料</option>
            <option value="heat_attended" ${step.operationType === 'heat_attended' ? 'selected' : ''}>爆炒</option>
            <option value="heat_unattended" ${step.operationType === 'heat_unattended' ? 'selected' : ''}>炖煮</option>
          </select>
          ${step.operationType === 'heat_unattended' ? `
            <div class="timer-section">
              <span style="font-size: 14px; color: var(--text-secondary);">需要定时</span>
              <div class="switch ${step.hasTimer ? 'active' : ''}" onclick="toggleStepTimer(${index})">
                <div class="switch-thumb"></div>
              </div>
              ${step.hasTimer ? `<input type="number" class="form-input small" placeholder="分钟" value="${step.timerDuration > 0 ? step.timerDuration / 60 : ''}" onchange="formSteps[${index}].timerDuration = (parseInt(this.value) || 0) * 60">` : ''}
            </div>
          ` : ''}
          ${formSteps.length > 1 ? `<div class="delete-btn" onclick="removeStep(${index})">删除</div>` : ''}
        </div>
      `).join('');
    }

    function addStep() {
      formSteps.push({ description: '', operationType: 'manual', hasTimer: false, timerDuration: 0 });
      renderFormSteps();
    }

    function removeStep(index) {
      formSteps.splice(index, 1);
      renderFormSteps();
    }

    function changeStepType(index, type) {
      formSteps[index].operationType = type;
      if (type !== 'heat_unattended') {
        formSteps[index].hasTimer = false;
        formSteps[index].timerDuration = 0;
      }
      renderFormSteps();
    }

    function toggleStepTimer(index) {
      formSteps[index].hasTimer = !formSteps[index].hasTimer;
      if (!formSteps[index].hasTimer) {
        formSteps[index].timerDuration = 0;
      }
      renderFormSteps();
    }

    function saveRecipe() {
      const name = document.getElementById('recipe-name').value.trim();
      const category = document.getElementById('recipe-category').value;
      const time = parseInt(document.getElementById('recipe-time').value) || 0;

      if (!name) {
        alert('请输入菜谱名称');
        return;
      }
      if (time <= 0) {
        alert('请输入预计耗时');
        return;
      }

      const newRecipe = {
        id: Date.now(),
        name,
        category,
        estimatedTime: time * 60,
        coverImage: '',
        steps: formSteps.map(s => ({
          description: s.description,
          operationType: s.operationType,
          hasTimer: s.hasTimer,
          timerDuration: s.timerDuration
        })),
        ingredients: {
          required: formIngredients.filter(i => i.name).map(i => ({
            name: i.name,
            amount: parseFloat(i.amount) || 0,
            unit: i.unit
          })),
          optional: []
        }
      };

      recipes.push(newRecipe);
      state.selectedIds.add(newRecipe.id);

      // 重置表单
      document.getElementById('recipe-name').value = '';
      document.getElementById('recipe-time').value = '';
      formIngredients = [{ name: '', amount: '', unit: '克', isRequired: true }];
      formSteps = [{ description: '', operationType: 'manual', hasTimer: false, timerDuration: 0 }];
      renderFormIngredients();
      renderFormSteps();

      renderRecipes();
      showScreen('recipes');
      alert('菜谱创建成功（演示模式）');
    }

    // 初始化
    renderRecipes();
    renderFormIngredients();
    renderFormSteps();
  </script>
</body>
</html>
