<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随身情绪记录小栈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-start: #fdf2f8;
    --bg-end: #ede9fe;
    --card-bg: rgba(255, 255, 255, 0.75);
    --card-border: rgba(255, 255, 255, 0.6);
    --primary: #a855f7;
    --primary-light: #e9d5ff;
    --text-main: #3f3f4f;
    --text-muted: #9ca3af;
    --shadow: 0 8px 32px rgba(168, 85, 247, 0.12);
    --radius: 20px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
    min-height: 100vh;
    color: var(--text-main);
    padding: 20px;
    line-height: 1.6;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
  }

  /* ===== Header ===== */
  .header {
    text-align: center;
    padding: 30px 20px 10px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }
  .header p {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 8px;
  }

  /* ===== Card ===== */
  .card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 24px;
    margin-top: 20px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ===== Mood Selector ===== */
  .mood-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .mood-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 14px 8px;
    border: 2px solid transparent;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.5);
    cursor: pointer;
    transition: all 0.25s ease;
    font-size: 13px;
    color: var(--text-main);
  }
  .mood-btn .emoji {
    font-size: 30px;
    transition: transform 0.25s ease;
  }
  .mood-btn:hover {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, 0.85);
  }
  .mood-btn:hover .emoji { transform: scale(1.15); }
  .mood-btn.active {
    border-color: var(--primary);
    background: var(--primary-light);
    box-shadow: 0 4px 16px rgba(168, 85, 247, 0.25);
  }
  .mood-btn.active .emoji { transform: scale(1.1); }

  /* ===== Slider ===== */
  .slider-section {
    margin-top: 22px;
  }
  .slider-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .slider-value {
    font-weight: 700;
    color: var(--primary);
    font-size: 18px;
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 8px;
    border-radius: 8px;
    background: linear-gradient(90deg, #fbcfe8, #a855f7);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--primary);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(168, 85, 247, 0.35);
    transition: transform 0.15s ease;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  input[type="range"]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: #fff; border: 3px solid var(--primary);
    cursor: pointer; box-shadow: 0 2px 8px rgba(168,85,247,0.35);
  }

  /* ===== Textarea ===== */
  .note-section { margin-top: 22px; }
  textarea {
    width: 100%;
    min-height: 90px;
    padding: 14px;
    border: 1.5px solid #e5e7eb;
    border-radius: 14px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    background: rgba(255, 255, 255, 0.6);
    color: var(--text-main);
    transition: border-color 0.2s ease;
  }
  textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1);
  }
  textarea::placeholder { color: #c4c4cc; }

  /* ===== Tag Chips ===== */
  .tag-section { margin-top: 18px; }
  .tags-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .tag-chip {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    background: rgba(255, 255, 255, 0.6);
    border: 1.5px solid #e5e7eb;
    cursor: pointer;
    transition: all 0.2s ease;
    color: var(--text-muted);
  }
  .tag-chip:hover { border-color: var(--primary); color: var(--primary); }
  .tag-chip.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* ===== Save Button ===== */
  .save-btn {
    width: 100%;
    margin-top: 24px;
    padding: 15px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    transition: all 0.25s ease;
    box-shadow: 0 4px 16px rgba(168, 85, 247, 0.35);
  }
  .save-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(168, 85, 247, 0.45);
  }
  .save-btn:active { transform: translateY(0); }
  .save-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* ===== Stats ===== */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .stat-box {
    text-align: center;
    padding: 16px 8px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.5);
  }
  .stat-box .num {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-box .label {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .mood-bar-chart {
    margin-top: 18px;
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    height: 120px;
    gap: 8px;
    padding: 0 4px;
  }
  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    height: 100%;
    justify-content: flex-end;
  }
  .bar {
    width: 70%;
    max-width: 36px;
    border-radius: 8px 8px 4px 4px;
    min-height: 4px;
    transition: height 0.5s ease;
    position: relative;
  }
  .bar-count {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-main);
  }
  .bar-emoji { font-size: 18px; }

  /* ===== History ===== */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .history-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid rgba(0, 0, 0, 0.03);
    transition: all 0.2s ease;
    animation: fadeInUp 0.3s ease;
  }
  .history-item:hover {
    background: rgba(255, 255, 255, 0.8);
    transform: translateX(2px);
  }
  .history-emoji {
    font-size: 28px;
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    background: rgba(168, 85, 247, 0.08);
  }
  .history-content {
    flex: 1;
    min-width: 0;
  }
  .history-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .history-mood-name {
    font-weight: 600;
    font-size: 15px;
  }
  .history-time {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .history-note {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 6px;
    word-break: break-word;
  }
  .history-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .history-tag {
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 12px;
    background: rgba(168, 85, 247, 0.1);
    color: var(--primary);
  }
  .history-intensity {
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .intensity-dots {
    display: flex;
    gap: 3px;
  }
  .intensity-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #e5e7eb;
  }
  .intensity-dot.filled { background: var(--primary); }
  .delete-btn {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: #d1d5db;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .delete-btn:hover {
    background: #fef2f2;
    color: #ef4444;
  }

  /* ===== Empty State ===== */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }
  .empty-state .empty-emoji {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.5;
  }
  .empty-state p { font-size: 14px; }

  /* ===== Tabs ===== */
  .tabs {
    display: flex;
    gap: 4px;
    background: rgba(255, 255, 255, 0.4);
    padding: 4px;
    border-radius: 12px;
    margin-bottom: 16px;
  }
  .tab {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 9px;
    background: transparent;
    font-size: 14px;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.2s ease;
    font-weight: 500;
  }
  .tab.active {
    background: #fff;
    color: var(--primary);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    padding: 14px 28px;
    border-radius: 30px;
    background: rgba(76, 29, 149, 0.92);
    color: #fff;
    font-size: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    opacity: 0;
    transition: all 0.35s ease;
    z-index: 9999;
    pointer-events: none;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* ===== Animations ===== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .filter-chip {
    padding: 5px 12px;
    border-radius: 16px;
    font-size: 12px;
    background: rgba(255,255,255,0.5);
    border: 1.5px solid #e5e7eb;
    cursor: pointer;
    transition: all 0.2s ease;
    color: var(--text-muted);
  }
  .filter-chip.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  .footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--text-muted);
    font-size: 12px;
  }

  @media (max-width: 480px) {
    .mood-grid { grid-template-columns: repeat(4, 1fr); }
    .stats-row { grid-template-columns: 1fr; }
    .header h1 { font-size: 24px; }
    body { padding: 12px; }
    .card { padding: 18px; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <h1>🌿 随身情绪记录小栈</h1>
    <p>记录每一刻的心情，遇见更好的自己</p>
  </div>

  <!-- Record Card -->
  <div class="card">
    <div class="card-title">✨ 今天心情如何？</div>

    <!-- Mood Selection -->
    <div class="mood-grid" id="moodGrid"></div>

    <!-- Intensity Slider -->
    <div class="slider-section">
      <div class="slider-label">
        <span>情绪强度</span>
        <span class="slider-value" id="intensityValue">5</span>
      </div>
      <input type="range" id="intensitySlider" min="1" max="10" value="5">
    </div>

    <!-- Note -->
    <div class="note-section">
      <div class="card-title" style="margin-bottom:10px;font-size:14px;">📝 心情随笔（选填）</div>
      <textarea id="noteInput" placeholder="今天发生了什么？此刻在想什么？写下来，和自己说说话～"></textarea>
    </div>

    <!-- Tags -->
    <div class="tag-section">
      <div class="card-title" style="margin-bottom:6px;font-size:14px;">🏷️ 标签（选填）</div>
      <div class="tags-wrap" id="tagsWrap"></div>
    </div>

    <!-- Save -->
    <button class="save-btn" id="saveBtn" disabled>💾 记录此刻心情</button>
  </div>

  <!-- Stats Card -->
  <div class="card">
    <div class="card-title">📊 情绪概览</div>
    <div class="stats-row">
      <div class="stat-box">
        <div class="num" id="statTotal">0</div>
        <div class="label">总记录</div>
      </div>
      <div class="stat-box">
        <div class="num" id="statWeek">0</div>
        <div class="label">本周记录</div>
      </div>
      <div class="stat-box">
        <div class="num" id="statTopMood">—</div>
        <div class="label">最常心情</div>
      </div>
    </div>
    <div class="mood-bar-chart" id="moodChart"></div>
  </div>

  <!-- History Card -->
  <div class="card">
    <div class="card-title">📖 心情日记</div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="footer">
    数据保存在你的浏览器本地 · 关闭页面也不会丢失 💾
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ========== 数据定义 ==========
  const MOODS = [
    { key: 'happy',    emoji: '😄', name: '开心', color: '#fbbf24' },
    { key: 'calm',     emoji: '😌', name: '平静', color: '#34d399' },
    { key: 'excited',  emoji: '🤩', name: '兴奋', color: '#f97316' },
    { key: 'grateful', emoji: '🥰', name: '感恩', color: '#fb7185' },
    { key: 'sad',      emoji: '😢', name: '难过', color: '#60a5fa' },
    { key: 'angry',    emoji: '😤', name: '生气', color: '#ef4444' },
    { key: 'anxious',  emoji: '😰', name: '焦虑', color: '#a78bfa' },
    { key: 'tired',    emoji: '🥱', name: '疲惫', color: '#94a3b8' }
  ];

  const TAG_OPTIONS = ['工作', '学习', '家人', '朋友', '运动', '美食', '睡眠', '恋爱', '独处', '天气'];

  const STORAGE_KEY = 'mood_diary_records';

  // ========== 状态 ==========
  let selectedMood = null;
  let selectedTags = [];
  let currentFilter = 'all';
  let records = [];

  // ========== 初始化 ==========
  function init() {
    renderMoodGrid();
    renderTags();
    renderFilterBar();
    loadRecords();
    bindEvents();
    updateUI();
  }

  // ========== 渲染情绪选择 ==========
  function renderMoodGrid() {
    const grid = document.getElementById('moodGrid');
    grid.innerHTML = MOODS.map(m => `
      <div class="mood-btn" data-mood="${m.key}">
        <span class="emoji">${m.emoji}</span>
        <span>${m.name}</span>
      </div>
    `).join('');
    grid.querySelectorAll('.mood-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        grid.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedMood = btn.dataset.mood;
        document.getElementById('saveBtn').disabled = false;
      });
    });
  }

  // ========== 渲染标签 ==========
  function renderTags() {
    const wrap = document.getElementById('tagsWrap');
    wrap.innerHTML = TAG_OPTIONS.map(t => `<div class="tag-chip" data-tag="${t}">${t}</div>`).join('');
    wrap.querySelectorAll('.tag-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        chip.classList.toggle('active');
        const tag = chip.dataset.tag;
        if (chip.classList.contains('active')) {
          if (!selectedTags.includes(tag)) selectedTags.push(tag);
        } else {
          selectedTags = selectedTags.filter(t => t !== tag);
        }
      });
    });
  }

  // ========== 渲染筛选栏 ==========
  function renderFilterBar() {
    const bar = document.getElementById('filterBar');
    const filters = [{ key: 'all', label: '全部' }, ...MOODS.map(m => ({ key: m.key, label: `${m.emoji} ${m.name}` }))];
    bar.innerHTML = filters.map(f => `<div class="filter-chip ${f.key === 'all' ? 'active' : ''}" data-filter="${f.key}">${f.label}</div>`).join('');
    bar.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        bar.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentFilter = chip.dataset.filter;
        renderHistory();
      });
    });
  }

  // ========== 事件绑定 ==========
  function bindEvents() {
    const slider = document.getElementById('intensitySlider');
    slider.addEventListener('input', () => {
      document.getElementById('intensityValue').textContent = slider.value;
    });

    document.getElementById('saveBtn').addEventListener('click', saveRecord);
  }

  // ========== 加载记录 ==========
  function loadRecords() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      records = data ? JSON.parse(data) : [];
    } catch (e) {
      records = [];
    }
  }

  // ========== 保存记录 ==========
  function saveRecord() {
    if (!selectedMood) return;
    const now = new Date();
    const record = {
      id: Date.now(),
      mood: selectedMood,
      intensity: parseInt(document.getElementById('intensitySlider').value),
      note: document.getElementById('noteInput').value.trim(),
      tags: [...selectedTags],
      timestamp: now.toISOString()
    };
    records.unshift(record);
    persist();
    resetForm();
    updateUI();
    showToast('心情已记录 🌸');
  }

  // ========== 持久化 ==========
  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }

  // ========== 重置表单 ==========
  function resetForm() {
    selectedMood = null;
    selectedTags = [];
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
    document.getElementById('intensitySlider').value = 5;
    document.getElementById('intensityValue').textContent = '5';
    document.getElementById('noteInput').value = '';
    document.getElementById('saveBtn').disabled = true;
  }

  // ========== 删除记录 ==========
  function deleteRecord(id) {
    records = records.filter(r => r.id !== id);
    persist();
    updateUI();
    showToast('记录已删除');
  }

  // ========== 更新整个界面 ==========
  function updateUI() {
    renderStats();
    renderChart();
    renderHistory();
  }

  // ========== 统计 ==========
  function renderStats() {
    document.getElementById('statTotal').textContent = records.length;

    // 本周记录
    const now = new Date();
    const weekStart = new Date(now);
    const day = now.getDay() || 7;
    weekStart.setDate(now.getDate() - day + 1);
    weekStart.setHours(0, 0, 0, 0);
    const weekCount = records.filter(r => new Date(r.timestamp) >= weekStart).length;
    document.getElementById('statWeek').textContent = weekCount;

    // 最常心情
    const moodCount = {};
    records.forEach(r => { moodCount[r.mood] = (moodCount[r.mood] || 0) + 1; });
    let topMood = null, topCount = 0;
    for (const [k, v] of Object.entries(moodCount)) {
      if (v > topCount) { topCount = v; topMood = k; }
    }
    const topMoodData = MOODS.find(m => m.key === topMood);
    document.getElementById('statTopMood').innerHTML = topMoodData
      ? `${topMoodData.emoji}`
      : '—';
  }

  // ========== 柱状图 ==========
  function renderChart() {
    const chart = document.getElementById('moodChart');
    const moodCount = {};
    MOODS.forEach(m => { moodCount[m.key] = 0; });
    records.forEach(r => { moodCount[r.mood] = (moodCount[r.mood] || 0) + 1; });
    const max = Math.max(...Object.values(moodCount), 1);

    chart.innerHTML = MOODS.map(m => {
      const count = moodCount[m.key];
      const height = count > 0 ? (count / max) * 80 + 10 : 6;
      return `
        <div class="bar-col">
          <div class="bar" style="height:${height}px;background:${m.color};">
            ${count > 0 ? `<span class="bar-count">${count}</span>` : ''}
          </div>
          <span class="bar-emoji">${m.emoji}</span>
        </div>
      `;
    }).join('');
  }

  // ========== 历史记录列表 ==========
  function renderHistory() {
    const list = document.getElementById('historyList');
    let filtered = currentFilter === 'all' ? records : records.filter(r => r.mood === currentFilter);

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-emoji">🍃</div>
          <p>${records.length === 0 ? '还没有记录，快来记下第一份心情吧～' : '该心情暂无记录'}</p>
        </div>
      `;
      return;
    }

    list.innerHTML = filtered.map(r => {
      const mood = MOODS.find(m => m.key === r.mood) || MOODS[0];
      const time = formatTime(r.timestamp);
      const dots = Array.from({ length: 10 }, (_, i) =>
        `<span class="intensity-dot ${i < r.intensity ? 'filled' : ''}"></span>`
      ).join('');
      return `
        <div class="history-item">
          <div class="history-emoji">${mood.emoji}</div>
          <div class="history-content">
            <div class="history-top">
              <span class="history-mood-name">${mood.name}</span>
              <span class="history-time">${time}</span>
            </div>
            ${r.note ? `<div class="history-note">${escapeHtml(r.note)}</div>` : ''}
            <div class="history-intensity">
              <span>强度 ${r.intensity}/10</span>
              <div class="intensity-dots">${dots}</div>
            </div>
            ${r.tags.length > 0 ? `<div class="history-tags">${r.tags.map(t => `<span class="history-tag">${t}</span>`).join('')}</div>` : ''}
          </div>
          <button class="delete-btn" data-id="${r.id}" title="删除">✕</button>
        </div>
      `;
    }).join('');

    list.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteRecord(parseInt(btn.dataset.id)));
    });
  }

  // ========== 格式化时间 ==========
  function formatTime(iso) {
    const d = new Date(iso);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';

    const isToday = d.toDateString() === now.toDateString();
    if (isToday) {
      return '今天 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
    const yesterday = new Date(now);
    yesterday.setDate(now.getDate() - 1);
    if (d.toDateString() === yesterday.toDateString()) {
      return '昨天 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
    return `${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // ========== 转义HTML ==========
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ========== Toast ==========
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ========== 启动 ==========
  init();
</script>
</body>
</html>
