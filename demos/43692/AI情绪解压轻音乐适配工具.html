<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI情绪解压轻音乐适配工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#f5f0ff;--card:#fff;--primary:#b388ff;--primary-light:#e1bee7;
--text:#4a4a4a;--text-light:#7c7c7c;--shadow:rgba(179,136,255,0.15);
--accent:#ce93d8;--btn-hover:#ab47bc;--timer-bg:#ede7f6;
}
.dark{
--bg:#1a1025;--card:#2d1f3d;--primary:#9c64de;--primary-light:#6a3c98;
--text:#e0d6ec;--text-light:#a89bc2;--shadow:rgba(0,0,0,0.3);
--accent:#7e57c2;--btn-hover:#b388ff;--timer-bg:#3d2a52;
}
body{
font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
background:var(--bg);color:var(--text);min-height:100vh;
transition:all 0.5s ease;overflow-x:hidden;
}
.container{max-width:900px;margin:0 auto;padding:20px}
header{text-align:center;padding:40px 0 30px;position:relative}
h1{font-size:2em;background:linear-gradient(135deg,var(--primary),var(--accent));
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
margin-bottom:10px;font-weight:700}
.subtitle{color:var(--text-light);font-size:0.95em}
.dark-toggle{
position:absolute;top:0;right:0;width:48px;height:48px;border-radius:50%;
border:none;background:var(--card);cursor:pointer;font-size:1.5em;
box-shadow:0 2px 12px var(--shadow);transition:all 0.3s;display:flex;
align-items:center;justify-content:center;
}
.dark-toggle:hover{transform:scale(1.1)}
.section{
background:var(--card);border-radius:20px;padding:30px;margin-bottom:25px;
box-shadow:0 4px 20px var(--shadow);transition:all 0.5s;
}
.section-title{
font-size:1.3em;font-weight:600;margin-bottom:20px;
display:flex;align-items:center;gap:10px;
}
.section-title .icon{font-size:1.5em}
.mood-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px}
.mood-btn{
padding:25px 15px;border-radius:16px;border:2px solid var(--primary-light);
background:var(--card);cursor:pointer;text-align:center;transition:all 0.3s;
font-size:1em;color:var(--text);
}
.mood-btn:hover{transform:translateY(-3px);box-shadow:0 6px 20px var(--shadow)}
.mood-btn.active{
background:linear-gradient(135deg,var(--primary),var(--accent));
color:#fff;border-color:transparent;
}
.mood-btn .emoji{font-size:2em;display:block;margin-bottom:8px}
.music-list{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.music-item{
display:flex;align-items:center;justify-content:space-between;
padding:15px 20px;background:var(--timer-bg);border-radius:12px;
transition:all 0.3s;
}
.music-item:hover{transform:translateX(5px)}
.music-info{flex:1}
.music-name{font-weight:600;margin-bottom:4px}
.music-desc{font-size:0.85em;color:var(--text-light)}
.play-btn{
width:44px;height:44px;border-radius:50%;border:none;
background:var(--primary);color:#fff;cursor:pointer;font-size:1.2em;
transition:all 0.3s;display:flex;align-items:center;justify-content:center;
}
.play-btn:hover{background:var(--btn-hover);transform:scale(1.1)}
.play-btn.playing{background:#ef5350}
.sound-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.sound-btn{
padding:20px;border-radius:14px;border:2px solid var(--primary-light);
background:var(--card);cursor:pointer;text-align:center;transition:all 0.3s;
}
.sound-btn:hover{transform:translateY(-2px);box-shadow:0 4px 15px var(--shadow)}
.sound-btn.active{background:var(--primary);color:#fff;border-color:transparent}
.sound-btn .emoji{font-size:1.8em;display:block;margin-bottom:6px}
.timer-container{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.timer-card{
flex:1;min-width:200px;padding:25px;background:var(--timer-bg);
border-radius:16px;text-align:center;
}
.timer-card h3{margin-bottom:15px;font-size:1.1em}
.timer-display{
font-size:3em;font-weight:700;color:var(--primary);margin:20px 0;
font-variant-numeric:tabular-nums;
}
.timer-controls{display:flex;gap:10px;justify-content:center;margin-top:15px}
.timer-btn{
padding:10px 24px;border-radius:10px;border:none;cursor:pointer;
font-size:0.95em;transition:all 0.3s;font-weight:600;
}
.timer-btn.primary{background:var(--primary);color:#fff}
.timer-btn.primary:hover{background:var(--btn-hover)}
.timer-btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--primary-light)}
.timer-btn.secondary:hover{background:var(--primary-light)}
.timer-presets{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.preset-btn{
padding:6px 14px;border-radius:8px;border:1px solid var(--primary-light);
background:var(--card);cursor:pointer;font-size:0.85em;transition:all 0.3s;
}
.preset-btn:hover,.preset-btn.active{background:var(--primary);color:#fff}
.player-bar{
position:fixed;bottom:0;left:0;right:0;background:var(--card);
padding:15px 30px;box-shadow:0 -4px 20px var(--shadow);
display:flex;align-items:center;gap:20px;z-index:100;
transform:translateY(100%);transition:transform 0.4s;
}
.player-bar.visible{transform:translateY(0)}
.player-info{flex:1}
.player-track{font-weight:600;margin-bottom:4px}
.player-status{font-size:0.85em;color:var(--text-light)}
.player-controls{display:flex;gap:12px;align-items:center}
.player-btn{
width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
background:var(--primary);color:#fff;font-size:1.1em;transition:all 0.3s;
display:flex;align-items:center;justify-content:center;
}
.player-btn:hover{background:var(--btn-hover);transform:scale(1.1)}
.progress-bar{
flex:2;height:6px;background:var(--timer-bg);border-radius:3px;
overflow:hidden;cursor:pointer;
}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));
width:0%;transition:width 0.3s;border-radius:3px;}
.volume-control{display:flex;align-items:center;gap:8px}
.volume-control input[type="range"]{
width:80px;height:4px;-webkit-appearance:none;background:var(--timer-bg);
border-radius:2px;outline:none;
}
.volume-control input[type="range"]::-webkit-slider-thumb{
-webkit-appearance:none;width:14px;height:14px;background:var(--primary);
border-radius:50%;cursor:pointer;
}
.hidden{display:none}
@keyframes pulse{
0%,100%{transform:scale(1);opacity:1}
50%{transform:scale(1.05);opacity:0.8}
}
.pulse{animation:pulse 2s infinite}
@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}
}
.float{animation:float 3s ease-in-out infinite}
@media(max-width:600px){
.container{padding:15px}
h1{font-size:1.5em}
.section{padding:20px}
.timer-display{font-size:2.2em}
.player-bar{padding:12px 15px;gap:12px}
.progress-bar{display:none}
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🎵 AI情绪解压轻音乐</h1>
<p class="subtitle">选择你的心情，让音乐治愈你</p>
<button class="dark-toggle" onclick="toggleDark()" title="护眼模式">🌙</button>
</header>

<!-- 心情选择 -->
<section class="section">
<div class="section-title"><span class="icon">💭</span>你现在的心情是？</div>
<div class="mood-grid">
<button class="mood-btn" onclick="selectMood('irritable')">
<span class="emoji">😤</span>烦躁
</button>
<button class="mood-btn" onclick="selectMood('anxious')">
<span class="emoji">😰</span>焦虑
</button>
<button class="mood-btn" onclick="selectMood('tired')">
<span class="emoji">😴</span>疲惫
</button>
<button class="mood-btn" onclick="selectMood('empty')">
<span class="emoji">😶</span>放空
</button>
</div>
</section>

<!-- 音乐列表 -->
<section class="section hidden" id="musicSection">
<div class="section-title"><span class="icon">🎶</span>为你推荐</div>
<div class="music-list" id="musicList"></div>
</section>

<!-- 背景音 -->
<section class="section">
<div class="section-title"><span class="icon">🌿</span>背景音效</div>
<div class="sound-grid">
<button class="sound-btn" onclick="toggleSound('white')">
<span class="emoji">📻</span>白噪音
</button>
<button class="sound-btn" onclick="toggleSound('rain')">
<span class="emoji">🌧️</span>雨声
</button>
<button class="sound-btn" onclick="toggleSound('forest')">
<span class="emoji">🌲</span>森林
</button>
<button class="sound-btn" onclick="toggleSound('wave')">
<span class="emoji">🌊</span>海浪
</button>
</div>
</section>

<!-- 计时器 -->
<section class="section">
<div class="section-title"><span class="icon">⏱️</span>专注 & 冥想</div>
<div class="timer-container">
<div class="timer-card">
<h3>🎯 专注倒计时</h3>
<div class="timer-display" id="focusTime">25:00</div>
<div class="timer-presets">
<button class="preset-btn" onclick="setFocusPreset(15)">15分钟</button>
<button class="preset-btn active" onclick="setFocusPreset(25)">25分钟</button>
<button class="preset-btn" onclick="setFocusPreset(45)">45分钟</button>
<button class="preset-btn" onclick="setFocusPreset(60)">60分钟</button>
</div>
<div class="timer-controls">
<button class="timer-btn primary" id="focusStartBtn" onclick="toggleFocusTimer()">开始</button>
<button class="timer-btn secondary" onclick="resetFocusTimer()">重置</button>
</div>
</div>
<div class="timer-card">
<h3>🧘 冥想计时</h3>
<div class="timer-display" id="meditateTime">10:00</div>
<div class="timer-presets">
<button class="preset-btn" onclick="setMeditatePreset(5)">5分钟</button>
<button class="preset-btn active" onclick="setMeditatePreset(10)">10分钟</button>
<button class="preset-btn" onclick="setMeditatePreset(20)">20分钟</button>
<button class="preset-btn" onclick="setMeditatePreset(30)">30分钟</button>
</div>
<div class="timer-controls">
<button class="timer-btn primary" id="meditateStartBtn" onclick="toggleMeditateTimer()">开始</button>
<button class="timer-btn secondary" onclick="resetMeditateTimer()">重置</button>
</div>
</div>
</div>
</section>
</div>

<!-- 底部播放栏 -->
<div class="player-bar" id="playerBar">
<div class="player-info">
<div class="player-track" id="playerTrack">未选择音乐</div>
<div class="player-status" id="playerStatus">请选择一首歌曲</div>
</div>
<div class="player-controls">
<button class="player-btn" id="prevBtn" onclick="playPrev()">⏮</button>
<button class="player-btn" id="playPauseBtn" onclick="togglePlayPause()">▶</button>
<button class="player-btn" id="nextBtn" onclick="playNext()">⏭</button>
</div>
<div class="progress-bar" onclick="seekMusic(event)">
<div class="progress-fill" id="progressFill"></div>
</div>
<div class="volume-control">
<span>🔊</span>
<input type="range" min="0" max="100" value="70" onchange="setVolume(this.value)">
</div>
</div>

<script>
// ========== 状态管理 ==========
const state = {
currentMood: null,
currentMusicIndex: -1,
isPlaying: false,
currentSound: null,
darkMode: false,
focusTime: 25 * 60,
focusRemaining: 25 * 60,
focusRunning: false,
focusInterval: null,
meditateTime: 10 * 60,
meditateRemaining: 10 * 60,
meditateRunning: false,
meditateInterval: null,
audioContext: null,
musicGain: null,
soundGain: null,
currentOscillators: [],
currentNoise: null,
};

// ========== 音乐数据 ==========
const musicData = {
irritable: [
{name:'平静湖面',desc:'轻柔钢琴曲，抚平烦躁',freq:[261.63,329.63,392.00],type:'sine'},
{name:'微风细雨',desc:'温暖吉他旋律，舒缓情绪',freq:[293.66,369.99,440.00],type:'triangle'},
{name:'星空漫步',desc:'空灵合成器音色，释放压力',freq:[329.63,415.30,493.88],type:'sine'},
],
anxious: [
{name:'安心港湾',desc:'柔和弦乐，带来安全感',freq:[220.00,277.18,329.63],type:'sine'},
{name:'云朵之上',desc:'轻盈钢琴，缓解紧张',freq:[246.94,311.13,369.99],type:'triangle'},
{name:'月光小夜曲',desc:'缓慢节拍，安抚焦虑',freq:[196.00,246.94,293.66],type:'sine'},
],
tired: [
{name:'清晨阳光',desc:'明亮钢琴曲，唤醒活力',freq:[329.63,392.00,493.88],type:'triangle'},
{name:'花园漫步',desc:'轻快小提琴，驱散疲惫',freq:[349.23,440.00,523.25],type:'sine'},
{name:'鸟鸣山涧',desc:'自然旋律，恢复精神',freq:[293.66,369.99,440.00],type:'triangle'},
],
empty: [
{name:'虚空回响',desc:'空灵氛围音，适合放空',freq:[130.81,164.81,196.00],type:'sine'},
{name:'云端梦境',desc:'绵长合成器，沉浸冥想',freq:[146.83,185.00,220.00],type:'triangle'},
{name:'深海低语',desc:'低沉嗡鸣，深度放松',freq:[110.00,138.59,164.81],type:'sine'},
],
};

// ========== 初始化AudioContext ==========
function initAudio(){
if(!state.audioContext){
state.audioContext = new(window.AudioContext||window.webkitAudioContext)();
state.musicGain = state.audioContext.createGain();
state.musicGain.connect(state.audioContext.destination);
state.musicGain.gain.value = 0.7;
state.soundGain = state.audioContext.createGain();
state.soundGain.connect(state.audioContext.destination);
state.soundGain.gain.value = 0;
}
if(state.audioContext.state==='suspended'){
state.audioContext.resume();
}
}

// ========== 心情选择 ==========
function selectMood(mood){
initAudio();
state.currentMood = mood;
state.currentMusicIndex = -1;

document.querySelectorAll('.mood-btn').forEach(btn=>btn.classList.remove('active'));
event.target.closest('.mood-btn').classList.add('active');

const section = document.getElementById('musicSection');
section.classList.remove('hidden');

const list = document.getElementById('musicList');
list.innerHTML = '';

musicData[mood].forEach((music,i)=>{
const item = document.createElement('div');
item.className = 'music-item';
item.innerHTML = `
<div class="music-info">
<div class="music-name">${music.name}</div>
<div class="music-desc">${music.desc}</div>
</div>
<button class="play-btn" onclick="playMusic(${i})" id="playBtn${i}">▶</button>
`;
list.appendChild(item);
});

section.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ========== 音乐播放 ==========
function playMusic(index){
stopAllAudio();
state.currentMusicIndex = index;
const music = musicData[state.currentMood][index];

const oscillators = [];
music.freq.forEach(f=>{
const osc = state.audioContext.createOscillator();
const gain = state.audioContext.createGain();
osc.type = music.type;
osc.frequency.value = f;
gain.gain.value = 0.15;
osc.connect(gain);
gain.connect(state.musicGain);
osc.start();
oscillators.push(osc);
});

// 添加缓慢的频率调制，模拟真实音乐
const lfo = state.audioContext.createOscillator();
const lfoGain = state.audioContext.createGain();
lfo.frequency.value = 0.3;
lfoGain.gain.value = 3;
lfo.connect(lfoGain);
oscillators.forEach(o=>lfoGain.connect(o.frequency));
lfo.start();
oscillators.push(lfo);

state.currentOscillators = oscillators;
state.isPlaying = true;

document.querySelectorAll('.play-btn').forEach(b=>{b.textContent='⏸';b.classList.add('playing')});
document.getElementById('playPauseBtn').textContent='⏸';

document.getElementById('playerTrack').textContent = music.name;
document.getElementById('playerStatus').textContent = '正在播放';
document.getElementById('playerBar').classList.add('visible');

animateProgress();
}

function stopAllAudio(){
state.currentOscillators.forEach(o=>{try{o.stop()}catch(e){}});
state.currentOscillators = [];
state.isPlaying = false;

document.querySelectorAll('.play-btn').forEach(b=>{b.textContent='▶';b.classList.remove('playing')});
if(state.currentMusicIndex>=0){
const btn = document.getElementById('playBtn'+state.currentMusicIndex);
if(btn){btn.textContent='▶';btn.classList.remove('playing')}
}
}

function togglePlayPause(){
if(state.isPlaying){
stopAllAudio();
document.getElementById('playPauseBtn').textContent='▶';
document.getElementById('playerStatus').textContent='已暂停';
}else{
if(state.currentMood&&state.currentMusicIndex>=0){
playMusic(state.currentMusicIndex);
}
}
}

function playPrev(){
if(!state.currentMood)return;
const musicList = musicData[state.currentMood];
state.currentMusicIndex = (state.currentMusicIndex-1+musicList.length)%musicList.length;
playMusic(state.currentMusicIndex);
}

function playNext(){
if(!state.currentMood)return;
const musicList = musicData[state.currentMood];
state.currentMusicIndex = (state.currentMusicIndex+1)%musicList.length;
playMusic(state.currentMusicIndex);
}

let progressAnim = null;
function animateProgress(){
let width = 0;
if(progressAnim)clearInterval(progressAnim);
progressAnim = setInterval(()=>{
if(!state.isPlaying){clearInterval(progressAnim);return}
width += 0.5;
if(width>100)width=0;
document.getElementById('progressFill').style.width = width+'%';
},100);
}

function seekMusic(e){
const rect = e.target.getBoundingClientRect();
const percent = ((e.clientX-rect.left)/rect.width)*100;
document.getElementById('progressFill').style.width = percent+'%';
}

function setVolume(val){
if(state.musicGain){
state.musicGain.gain.value = val/100;
}
}

// ========== 背景音效 ==========
function toggleSound(type){
initAudio();

if(state.currentSound===type){
stopSound();
return;
}

stopSound();
state.currentSound = type;

document.querySelectorAll('.sound-btn').forEach(b=>b.classList.remove('active'));
event.target.closest('.sound-btn').classList.add('active');

if(type==='white'){
createWhiteNoise();
}else if(type==='rain'){
createRain();
}else if(type==='forest'){
createForest();
}else if(type==='wave'){
createWave();
}
}

function stopSound(){
if(state.currentNoise){
try{state.currentNoise.stop()}catch(e){}
state.currentNoise = null;
}
state.soundGain.gain.value = 0;
state.currentSound = null;
document.querySelectorAll('.sound-btn').forEach(b=>b.classList.remove('active'));
}

function createWhiteNoise(){
const bufferSize = 2*state.audioContext.sampleRate;
const buffer = state.audioContext.createBuffer(1,bufferSize,state.audioContext.sampleRate);
const data = buffer.getChannelData(0);
for(let i=0;i<bufferSize;i++){data[i]=Math.random()*2-1}
const noise = state.audioContext.createBufferSource();
noise.buffer = buffer;
noise.loop = true;
const gain = state.audioContext.createGain();
gain.gain.value = 0.3;
noise.connect(gain);
gain.connect(state.soundGain);
noise.start();
state.currentNoise = noise;
state.soundGain.gain.value = 0.5;
}

function createRain(){
const bufferSize = 2*state.audioContext.sampleRate;
const buffer = state.audioContext.createBuffer(1,bufferSize,state.audioContext.sampleRate);
const data = buffer.getChannelData(0);
for(let i=0;i<bufferSize;i++){
data[i]=(Math.random()*2-1)*Math.sin(i/5000);
}
const noise = state.audioContext.createBufferSource();
noise.buffer = buffer;
noise.loop = true;
const filter = state.audioContext.createBiquadFilter();
filter.type='bandpass';
filter.frequency.value=3000;
filter.Q.value=0.5;
const gain = state.audioContext.createGain();
gain.gain.value=0.4;
noise.connect(filter);
filter.connect(gain);
gain.connect(state.soundGain);
noise.start();
state.currentNoise=noise;
state.soundGain.gain.value=0.5;
}

function createForest(){
const oscillators=[];
const freqs=[800,1200,1600,2000];
freqs.forEach(f=>{
const osc=state.audioContext.createOscillator();
osc.type='sine';
osc.frequency.value=f;
const gain=state.audioContext.createGain();
gain.gain.value=0.05;
const lfo=state.audioContext.createOscillator();
lfo.frequency.value=3+Math.random()*5;
const lfoGain=state.audioContext.createGain();
lfoGain.gain.value=0.03;
lfo.connect(lfoGain);
lfoGain.connect(gain.gain);
lfo.start();
osc.connect(gain);
gain.connect(state.soundGain);
osc.start();
oscillators.push(osc,lfo);
});
oscillators.forEach(o=>state.currentOscillators.push(o));
state.soundGain.gain.value=0.6;
}

function createWave(){
const bufferSize=2*state.audioContext.sampleRate;
const buffer=state.audioContext.createBuffer(1,bufferSize,state.audioContext.sampleRate);
const data=buffer.getChannelData(0);
for(let i=0;i<bufferSize;i++){
data[i]=(Math.random()*2-1)*0.5*(1+Math.sin(i/20000));
}
const noise=state.audioContext.createBufferSource();
noise.buffer=buffer;
noise.loop=true;
const filter=state.audioContext.createBiquadFilter();
filter.type='lowpass';
filter.frequency.value=800;
const gain=state.audioContext.createGain();
gain.gain.value=0.3;
noise.connect(filter);
filter.connect(gain);
gain.connect(state.soundGain);
noise.start();
state.currentNoise=noise;
state.soundGain.gain.value=0.5;
}

// ========== 专注计时器 ==========
function setFocusPreset(minutes){
if(state.focusRunning)return;
state.focusTime = minutes*60;
state.focusRemaining = minutes*60;
updateFocusDisplay();
document.querySelectorAll('.timer-card:first-child .preset-btn').forEach(b=>b.classList.remove('active'));
event.target.classList.add('active');
}

function updateFocusDisplay(){
const m=Math.floor(state.focusRemaining/60);
const s=state.focusRemaining%60;
document.getElementById('focusTime').textContent=
`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

function toggleFocusTimer(){
if(state.focusRunning){
clearInterval(state.focusInterval);
state.focusRunning=false;
document.getElementById('focusStartBtn').textContent='继续';
}else{
state.focusRunning=true;
document.getElementById('focusStartBtn').textContent='暂停';
state.focusInterval=setInterval(()=>{
if(state.focusRemaining<=0){
clearInterval(state.focusInterval);
state.focusRunning=false;
document.getElementById('focusStartBtn').textContent='开始';
alert('专注时间到！休息一下吧~ 🎉');
return;
}
state.focusRemaining--;
updateFocusDisplay();
},1000);
}
}

function resetFocusTimer(){
clearInterval(state.focusInterval);
state.focusRunning=false;
state.focusRemaining=state.focusTime;
updateFocusDisplay();
document.getElementById('focusStartBtn').textContent='开始';
}

// ========== 冥想计时器 ==========
function setMeditatePreset(minutes){
if(state.meditateRunning)return;
state.meditateTime=minutes*60;
state.meditateRemaining=minutes*60;
updateMeditateDisplay();
document.querySelectorAll('.timer-card:last-child .preset-btn').forEach(b=>b.classList.remove('active'));
event.target.classList.add('active');
}

function updateMeditateDisplay(){
const m=Math.floor(state.meditateRemaining/60);
const s=state.meditateRemaining%60;
document.getElementById('meditateTime').textContent=
`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

function toggleMeditateTimer(){
if(state.meditateRunning){
clearInterval(state.meditateInterval);
state.meditateRunning=false;
document.getElementById('meditateStartBtn').textContent='继续';
}else{
state.meditateRunning=true;
document.getElementById('meditateStartBtn').textContent='暂停';
state.meditateInterval=setInterval(()=>{
if(state.meditateRemaining<=0){
clearInterval(state.meditateInterval);
state.meditateRunning=false;
document.getElementById('meditateStartBtn').textContent='开始';
alert('冥想完成！感觉好点了吗？💜');
// 播放提示音
playChime();
return;
}
state.meditateRemaining--;
updateMeditateDisplay();
},1000);
}
}

function resetMeditateTimer(){
clearInterval(state.meditateInterval);
state.meditateRunning=false;
state.meditateRemaining=state.meditateTime;
updateMeditateDisplay();
document.getElementById('meditateStartBtn').textContent='开始';
}

function playChime(){
const osc=state.audioContext.createOscillator();
const gain=state.audioContext.createGain();
osc.type='sine';
osc.frequency.value=528;
gain.gain.value=0.3;
gain.gain.exponentialRampToValueAtTime(0.01,state.audioContext.currentTime+3);
osc.connect(gain);
gain.connect(state.audioContext.destination);
osc.start();
osc.stop(state.audioContext.currentTime+3);
}

// ========== 暗色模式 ==========
function toggleDark(){
state.darkMode=!state.darkMode;
document.body.classList.toggle('dark');
document.querySelector('.dark-toggle').textContent=state.darkMode?'☀️':'🌙';
}

// ========== 页面加载 ==========
document.addEventListener('DOMContentLoaded',()=>{
updateFocusDisplay();
updateMeditateDisplay();
});
</script>
</body>
</html>
