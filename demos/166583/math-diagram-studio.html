<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数图助手 · 数学题目图形化工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0B0F14;
      --surface: #131922;
      --surface-2: #1A2330;
      --surface-3: #243040;
      --border: #2A3645;
      --border-light: #3A4A5E;
      --text: #E8EDF2;
      --text-muted: #8B9BAE;
      --text-dim: #5A6B7E;
      --amber: #F0A830;
      --amber-soft: #D99520;
      --teal: #3DCCC7;
      --coral: #FF6B5E;
      --green: #6BCB77;
      --blue: #5B9BD5;
      --radius: 12px;
      --radius-sm: 8px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(240,168,48,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(61,204,199,0.03) 0%, transparent 50%);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(19,25,34,0.7);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--amber), var(--amber-soft));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Fraunces', serif;
      font-size: 24px; font-weight: 800;
      color: #0B0F14;
      box-shadow: 0 4px 16px rgba(240,168,48,0.2);
    }
    .brand h1 { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
    .brand p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .header-actions { display: flex; gap: 10px; }
    .header-btn {
      padding: 8px 16px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-family: inherit; font-size: 13px;
      cursor: pointer; transition: var(--transition);
    }
    .header-btn:hover { color: var(--text); border-color: var(--border-light); }

    /* ── Main Layout ── */
    main {
      display: grid;
      grid-template-columns: 1fr 320px;
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 32px;
      gap: 24px;
      min-height: calc(100vh - 130px);
    }

    /* ── Input Section ── */
    .input-section { margin-bottom: 20px; }
    .input-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 1.5px;
      margin-bottom: 10px;
    }
    .input-label .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--amber);
    }

    .input-box {
      display: flex; gap: 12px;
      align-items: flex-start;
    }
    .input-field {
      flex: 1;
      min-height: 72px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.6;
      resize: vertical;
      transition: var(--transition);
    }
    .input-field:focus {
      outline: none;
      border-color: var(--amber);
      background: var(--surface-2);
      box-shadow: 0 0 0 3px rgba(240,168,48,0.1);
    }
    .input-field::placeholder { color: var(--text-dim); }

    .parse-btn {
      padding: 16px 28px;
      background: linear-gradient(135deg, var(--amber), var(--amber-soft));
      border: none;
      border-radius: var(--radius);
      color: #0B0F14;
      font-family: inherit;
      font-size: 15px; font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 16px rgba(240,168,48,0.2);
      white-space: nowrap;
      align-self: stretch;
      display: flex; align-items: center; gap: 8px;
    }
    .parse-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(240,168,48,0.35);
    }
    .parse-btn:active { transform: translateY(0); }
    .parse-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }
    .parse-btn .icon { font-size: 18px; }

    /* ── Example Chips ── */
    .examples {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-top: 12px;
    }
    .example-chip {
      padding: 6px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: var(--transition);
    }
    .example-chip:hover {
      border-color: var(--teal);
      color: var(--teal);
      background: rgba(61,204,199,0.05);
      transform: translateY(-2px);
    }

    /* ── Canvas Area ── */
    .canvas-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      animation: fadeInUp 0.4s ease-out;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .canvas-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
      gap: 12px;
      flex-wrap: wrap;
    }
    .canvas-title {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 600;
    }
    .canvas-title .tag {
      padding: 3px 10px;
      border-radius: 6px;
      background: rgba(240,168,48,0.12);
      color: var(--amber);
      font-size: 12px; font-weight: 600;
    }
    .canvas-controls {
      display: flex; align-items: center; gap: 14px;
    }
    .canvas-status {
      font-size: 12px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      display: flex; align-items: center; gap: 6px;
    }

    /* Toggle 按钮组 */
    .toggle-group { display: flex; gap: 6px; }
    .toggle-btn {
      padding: 5px 11px;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: var(--transition);
      display: flex; align-items: center; gap: 5px;
    }
    .toggle-btn .dot-i {
      width: 7px; height: 7px; border-radius: 50%;
      background: currentColor;
      opacity: 0.5;
    }
    .toggle-btn.active {
      color: var(--teal);
      border-color: var(--teal);
      background: rgba(61,204,199,0.08);
    }
    .toggle-btn.active .dot-i { opacity: 1; }
    .toggle-btn:hover { border-color: var(--border-light); }

    .canvas-wrap {
      position: relative;
      padding: 24px;
      display: flex; justify-content: center;
      background:
        radial-gradient(circle at 50% 50%, rgba(240,168,48,0.02) 0%, transparent 60%),
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(42,54,69,0.12) 39px, rgba(42,54,69,0.12) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(42,54,69,0.12) 39px, rgba(42,54,69,0.12) 40px);
      /* 微妙内阴影 */
      box-shadow: inset 0 2px 16px rgba(0,0,0,0.28);
    }
    #mainCanvas {
      max-width: 100%;
      border-radius: var(--radius-sm);
      position: relative;
      z-index: 1;
    }
    .canvas-empty {
      width: 100%; min-height: 320px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      position: absolute;
      top: 24px; left: 24px; right: 24px; bottom: 24px;
    }
    .canvas-empty.hidden { display: none; }
    .empty-icon {
      font-family: 'Fraunces', serif;
      font-size: 64px;
      color: var(--border-light);
      opacity: 0.5;
    }
    .canvas-empty p { color: var(--text-dim); font-size: 14px; }

    /* 错误卡片 */
    .error-card {
      width: 100%;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px;
      text-align: center;
    }
    .error-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(255,107,94,0.1);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Fraunces', serif;
      font-size: 38px; font-weight: 800;
      color: var(--coral);
      border: 2px solid rgba(255,107,94,0.4);
    }
    .error-title { font-size: 18px; font-weight: 600; color: var(--coral); }
    .error-suggestion {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 440px;
      line-height: 1.8;
      background: var(--surface-2);
      padding: 14px 20px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--amber);
    }

    /* ── Action Bar ── */
    .action-bar {
      display: flex; gap: 10px;
      padding: 0 20px 16px;
      flex-wrap: wrap;
    }
    .action-btn {
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: none;
      display: flex; align-items: center; gap: 6px;
    }
    .action-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .action-btn.primary { background: var(--amber); color: #0B0F14; }
    .action-btn.primary:not(:disabled):hover { background: #F5B540; }
    .action-btn.secondary {
      background: var(--surface-3); color: var(--teal);
      border: 1.5px solid var(--border);
    }
    .action-btn.secondary:not(:disabled):hover { border-color: var(--teal); transform: translateY(-1px); }

    /* ── Explanation Panel ── */
    .explanation-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-top: 20px;
      overflow: hidden;
    }
    .explanation-header {
      display: flex; align-items: center; gap: 8px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 14px; font-weight: 600;
      color: var(--teal);
    }
    .explanation-body {
      padding: 20px 22px;
      font-size: 14px;
      line-height: 1.8;
      color: var(--text-muted);
    }
    /* 步骤连接线 */
    .explanation-body .step {
      display: block;
      padding: 8px 0 8px 22px;
      position: relative;
      border-left: 2px solid var(--border-light);
      margin-left: 6px;
    }
    .explanation-body .step:not(:last-child) { margin-bottom: 4px; }
    .explanation-body .step::before {
      content: '';
      position: absolute;
      left: -6px;
      top: 14px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--amber);
    }
    /* 公式块左侧色条 */
    .explanation-body .formula {
      display: inline-block;
      padding: 2px 10px;
      background: var(--surface-3);
      border-left: 3px solid var(--amber);
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--amber);
    }
    .explanation-body .result {
      color: var(--green); font-weight: 600;
    }
    .explanation-body .highlight {
      color: var(--amber); font-weight: 600;
    }

    /* ── Sidebar ── */
    .sidebar { display: flex; flex-direction: column; gap: 16px; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }
    .panel h3 {
      font-size: 12px; font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 1.5px;
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .panel h3 .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }

    .param-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(42,54,69,0.5);
      gap: 8px;
    }
    .param-row:last-child { border-bottom: none; }
    .param-label { font-size: 13px; color: var(--text-muted); }
    .param-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px; font-weight: 600;
      color: var(--amber);
      padding: 2px 8px;
      background: var(--surface-3);
      border-radius: 4px;
      max-width: 60%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .parse-info {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.7;
    }
    .parse-info .label { color: var(--text-dim); }
    .parse-info .value { color: var(--teal); font-weight: 600; }

    .no-data {
      text-align: center;
      padding: 24px 0;
      color: var(--text-dim);
      font-size: 13px;
    }

    /* 历史记录 */
    .history-list { display: flex; flex-direction: column; gap: 6px; }
    .history-item {
      padding: 10px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      line-height: 1.5;
      display: flex; align-items: flex-start; gap: 8px;
      max-height: 64px;
      overflow: hidden;
    }
    .history-item:hover {
      border-color: var(--amber);
      color: var(--text);
      background: var(--surface-3);
      transform: translateX(2px);
    }
    .history-item .h-icon { color: var(--amber); flex-shrink: 0; font-size: 11px; line-height: 1.6; }
    .history-item .h-text { flex: 1; }
    .history-empty { text-align: center; color: var(--text-dim); font-size: 12px; padding: 16px 0; }

    /* loading 动画（三个跳动点） */
    .loading-dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }
    .loading-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--amber);
      animation: dotBounce 1.2s infinite ease-in-out;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dotBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      padding: 12px 24px;
      background: var(--surface-3);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 200;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error { border-color: var(--coral); color: var(--coral); }
    .toast.info { border-color: var(--teal); color: var(--teal); }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
    }

    /* 快捷键提示 */
    .kbd-hint {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 10px;
      line-height: 1.7;
    }
    .kbd-hint kbd {
      display: inline-block;
      padding: 1px 6px;
      background: var(--surface-3);
      border: 1px solid var(--border-light);
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
    }

    /* ── 响应式 ── */
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; padding: 16px; }
      .input-box { flex-direction: column; }
      .parse-btn { align-self: stretch; justify-content: center; }
      .canvas-header { flex-direction: column; align-items: flex-start; }
      .canvas-controls { width: 100%; justify-content: space-between; }
      header { padding: 14px 16px; }
      .sidebar { order: 2; }
    }

    /* ── 打印样式 ── */
    @media print {
      body { background: white !important; color: black !important; }
      header, .input-section, .sidebar, .action-bar, footer, .toast,
      .canvas-controls, .examples, .kbd-hint { display: none !important; }
      main { display: block !important; max-width: 100% !important; padding: 0 !important; gap: 0 !important; }
      .canvas-card, .explanation-card {
        border: 1px solid #999 !important;
        break-inside: avoid;
        margin-bottom: 14px;
      }
      .canvas-wrap { background: white !important; box-shadow: none !important; padding: 12px !important; }
      .canvas-header { background: white !important; border-color: #ccc !important; }
      .canvas-title, .canvas-title .tag,
      .explanation-header, .explanation-body { color: #222 !important; }
      .explanation-body .step { border-left-color: #999 !important; }
      #mainCanvas { max-width: 100% !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">∫</div>
      <div>
        <h1>数图助手</h1>
        <p>输入数学题目，自动生成示意图 · TRAE AI 创造力大赛</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="header-btn" id="clearBtn">清空 (Esc)</button>
    </div>
  </header>

  <main>
    <div class="left-col">
      <!-- 输入区 -->
      <div class="input-section">
        <div class="input-label"><span class="dot"></span>输入数学题目</div>
        <div class="input-box">
          <textarea class="input-field" id="problemInput" placeholder="在此输入数学题目，例如：&#10;• 三角形ABC的三边分别为3、4、5，求面积&#10;• 平行四边形底6高4求面积&#10;• 绝对值函数y=|2x-4|&#10;• 已知一次函数y=2x+3，画出函数图像&#10;• 圆面积为16π，求半径"></textarea>
          <button class="parse-btn" id="parseBtn">
            <span class="icon">⚡</span>
            <span>生成图形</span>
          </button>
        </div>
        <div class="examples">
          <button class="example-chip" data-example="triangle">三角形三边3,4,5求面积</button>
          <button class="example-chip" data-example="triangle2">三角形两边3和4夹角90度</button>
          <button class="example-chip" data-example="circle">圆半径5求周长</button>
          <button class="example-chip" data-example="circle2">圆面积16π求半径</button>
          <button class="example-chip" data-example="rectangle">矩形长8宽5求面积</button>
          <button class="example-chip" data-example="trapezoid">梯形上底3下底7高4求面积</button>
          <button class="example-chip" data-example="parallelogram">平行四边形底6高4求面积</button>
          <button class="example-chip" data-example="linear">一次函数y=2x-3</button>
          <button class="example-chip" data-example="quadratic">二次函数y=x²-4x+1</button>
          <button class="example-chip" data-example="inverse">反比例函数y=6/x</button>
          <button class="example-chip" data-example="absolute">绝对值函数y=|2x-4|</button>
          <button class="example-chip" data-example="distance">点A(1,2)点B(4,6)求距离</button>
          <button class="example-chip" data-example="bar">条形图：篮球12足球8乒乓球15</button>
          <button class="example-chip" data-example="pie">扇形图：餐饮40%交通25%购物20%其他15%</button>
        </div>
        <div class="kbd-hint">
          快捷键：<kbd>Ctrl</kbd>+<kbd>Enter</kbd> 生成图形 · <kbd>Ctrl</kbd>+<kbd>E</kbd> 导出图片 · <kbd>Esc</kbd> 清空
        </div>
      </div>

      <!-- 图形展示区 -->
      <div class="canvas-card" id="canvasCard">
        <div class="canvas-header">
          <div class="canvas-title">
            <span class="tag" id="diagramTag">等待输入</span>
            <span id="diagramDesc"></span>
          </div>
          <div class="canvas-controls">
            <div class="toggle-group">
              <button class="toggle-btn active" data-toggle="labels"><span class="dot-i"></span>标注</button>
              <button class="toggle-btn active" data-toggle="grid"><span class="dot-i"></span>网格</button>
              <button class="toggle-btn active" data-toggle="aux"><span class="dot-i"></span>辅助线</button>

          <div class="canvas-empty" id="canvasEmpty">
