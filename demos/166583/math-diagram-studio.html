          <button class="action-btn secondary" id="copyBtn" disabled>复制题目+图形</button>
          <button class="action-btn secondary" id="printBtn" disabled>打印</button>
        </div>
      </div>

      <!-- 讲解面板 -->
      <div class="explanation-card" id="explanationCard" style="display:none;">
        <div class="explanation-header">
          <span>💡</span>
          <span>题目讲解</span>
        </div>
        <div class="explanation-body" id="explanationBody"></div>
      </div>
    </div>

    <!-- 右侧参数面板 -->
    <aside class="sidebar">
      <div class="panel">
        <h3><span class="dot"></span>解析结果</h3>
        <div id="parseResultPanel">
          <div class="no-data">暂无解析数据</div>
        </div>
      </div>

      <div class="panel">
        <h3><span class="dot" style="background:var(--amber);"></span>题目参数</h3>
        <div id="paramPanel">
          <div class="no-data">暂无参数</div>
        </div>
      </div>

      <div class="panel">
        <h3><span class="dot" style="background:var(--coral);"></span>最近记录</h3>
        <div id="historyPanel">
          <div class="history-empty">暂无历史记录</div>
        </div>
      </div>

      <div class="panel">
        <h3><span class="dot" style="background:var(--green);"></span>支持类型</h3>
        <div class="parse-info">
          <span class="label">几何：</span>三角形、圆形、矩形、梯形、平行四边形<br>
          <span class="label">函数：</span>一次、二次、反比例、绝对值<br>
          <span class="label">坐标：</span>两点距离、中点<br>
          <span class="label">统计：</span>条形图、扇形图<br>
          <span class="label">提示：</span>支持中文数字和阿拉伯数字
        </div>
      </div>
    </aside>
  </main>

  <footer>
    数图助手 · 基于 TRAE 构建的数学教育可视化工具 · 适用于课堂讲解与学生讨论
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    /* ═══════════════════════════════════════════════════════
       数图助手 — 数学题目图形化工具
       核心流程：用户输入题目文本 → 解析引擎识别类型和参数 → Canvas绘制示意图
       ═══════════════════════════════════════════════════════ */

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const PI = Math.PI;

    // ─── 全局绘制开关 ───
    let showLabels = true;   // 标注开关
    let showGrid = true;     // 网格开关
    let showAuxLines = true; // 辅助线开关

    // ─── 工具函数 ───
    const round = (n, d=1) => Math.round(n * Math.pow(10,d)) / Math.pow(10,d);
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    // 中文数字转换
    const CN_NUM = { '零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10 };
    function parseCnNumber(str) {
      if (!str) return null;
      str = str.trim();
      const n = parseFloat(str);
      if (!isNaN(n)) return n;
      // 尝试中文数字
      if (str === '十') return 10;
      if (str.startsWith('十')) return 10 + (CN_NUM[str[1]] || 0);
      if (str.endsWith('十')) return (CN_NUM[str[0]] || 0) * 10;
      if (str.includes('十')) {
        const parts = str.split('十');
        return (CN_NUM[parts[0]] || 0) * 10 + (CN_NUM[parts[1]] || 0);
      }
      if (str.length === 1) return CN_NUM[str] !== undefined ? CN_NUM[str] : null;
      return null;
    }

    // 提取所有数字
    function extractNumbers(text) {
      const matches = text.match(/-?\d+\.?\d*/g);
      return matches ? matches.map(Number) : [];
    }

    // 提取坐标点（支持带括号、无括号、纯坐标三种格式）
    function extractPoints(text) {
      const points = [];
      let match;

      // 1. 带括号格式：点A(2,3) / A(2,3) / 点A（2,3）
      const regex1 = /点?\s*([A-Za-z])\s*[\(（](-?\d+\.?\d*)\s*[,，]\s*(-?\d+\.?\d*)[\)）]/g;
      while ((match = regex1.exec(text)) !== null) {
        points.push({ label: match[1], x: parseFloat(match[2]), y: parseFloat(match[3]) });
      }

      // 2. 无括号格式：点A的坐标是2,3 / 点A坐标2,3 / 点A为2,3
      if (points.length === 0) {
        const regex2 = /点\s*([A-Za-z])\s*(?:的)?(?:坐标)?(?:是为|为|是)?\s*(-?\d+\.?\d*)\s*[,，]\s*(-?\d+\.?\d*)/g;
        while ((match = regex2.exec(text)) !== null) {
          points.push({ label: match[1], x: parseFloat(match[2]), y: parseFloat(match[3]) });
        }
      }

      // 3. 纯坐标 (x,y) 格式（无标签时自动分配 A,B,C,D）
      if (points.length === 0) {
        const regex3 = /[\(（](-?\d+\.?\d*)\s*[,，]\s*(-?\d+\.?\d*)[\)）]/g;
        const labels = 'ABCD';
        let i = 0;
        while ((match = regex3.exec(text)) !== null) {
          points.push({ label: labels[i] || `P${i}`, x: parseFloat(match[1]), y: parseFloat(match[2]) });
          i++;
        }
      }
      return points;
    }

    /* ═══════════════════════════════════════════════════════
       解析引擎
       ═══════════════════════════════════════════════════════ */

    function parseProblem(text) {
      text = text.trim();
      if (!text) return { error: true, suggestion: '请输入数学题目文本，例如「三角形三边3,4,5求面积」' };

      // 尝试各种题型解析（顺序很重要）
      const parsers = [
        parseTriangle, parseCircle, parseParallelogram, parseRectangle, parseTrapezoid,
        parseAbsoluteValue, parseLinearFn, parseQuadraticFn, parseInverseFn,
        parseDistance, parseMidpoint, parseBarChart, parsePieChart
      ];

      for (const parser of parsers) {
        const result = parser(text);
        if (result) return result;
      }

      // 解析失败：返回带具体建议的错误对象
      let suggestion = '未能识别该题目类型。请参考下方示例，支持：三角形、圆、矩形、梯形、平行四边形、一次/二次/反比例/绝对值函数、两点距离、统计图等。';
      if (/三角|△/.test(text)) {
        suggestion = '检测到三角形关键词，但参数不足。请提供三边长度（如「三角形三边3,4,5」）或两边一角（如「三角形两边3和4夹角90度」）。';
      } else if (/圆/.test(text)) {
        suggestion = '检测到圆形关键词，但参数不足。请提供半径（如「圆半径5」）、直径，或面积（如「圆面积16π求半径」）。';
      } else if (/函数|y\s*=/.test(text)) {
        suggestion = '检测到函数关键词，但格式无法解析。请使用标准格式，如「一次函数y=2x-3」「二次函数y=x²-4x+1」或「绝对值函数y=|2x-4|」。';
      } else if (/点/.test(text)) {
        suggestion = '检测到坐标点关键词，请提供完整坐标，如「点A(2,3)和点B(-1,5)求距离」或「点A的坐标是2,3」。';
      } else if (/平行四边形/.test(text)) {
        suggestion = '检测到平行四边形关键词，请提供底和高，如「平行四边形底6高4求面积」。';
      }
      return { error: true, suggestion };
    }

    // ─── 三角形（支持三边 / 两边一角）───
    function parseTriangle(text) {
      if (!/三角|△/.test(text)) return null;

      // 情况1：两边一角（余弦定理求第三边）
      const twoSideMatch = text.match(/两边[为是]?\s*(\d+\.?\d*)\s*[和与及,，]\s*(\d+\.?\d*)/);
      const angleMatch = text.match(/夹角[为是]?\s*(\d+\.?\d*)\s*度?/);
      if (twoSideMatch && angleMatch) {
        const a = parseFloat(twoSideMatch[1]);
        const b = parseFloat(twoSideMatch[2]);
        const C = parseFloat(angleMatch[1]); // 夹角（度）
        if (C <= 0 || C >= 180) return null;
        // 余弦定理：c² = a² + b² - 2ab·cos(C)
        const c = Math.sqrt(a*a + b*b - 2*a*b*Math.cos(C*PI/180));
        const s = (a+b+c)/2;
        const area = Math.sqrt(Math.max(0, s*(s-a)*(s-b)*(s-c)));
        const perim = a+b+c;
        const isArea = /面积/.test(text);

        let question, answer, explanation;
        if (isArea) {
          question = `三角形面积（两边夹角）`;
          answer = `${round(area, 2)}`;
          explanation =
            `<span class="step">① 已知两边 a=${a}、b=${b}，夹角 C=${C}°</span>`+
            `<span class="step">② 用<span class="formula">余弦定理</span>求第三边：c² = a² + b² - 2ab·cosC</span>`+
            `<span class="step">③ c = √(${a}² + ${b}² - 2×${a}×${b}×cos${C}°) ≈ ${round(c,2)}</span>`+
            `<span class="step">④ 用海伦公式求面积，半周长 s = ${round(s,2)}</span>`+
            `<span class="step">⑤ S ≈ <span class="result">${answer}</span></span>`;
        } else {
          question = `三角形（两边${a},${b}夹角${C}°）`;
          answer = `第三边≈${round(c,2)}`;
          explanation =
            `<span class="step">① 已知两边 a=${a}、b=${b}，夹角 C=${C}°</span>`+
            `<span class="step">② <span class="formula">余弦定理</span>：c² = a² + b² - 2ab·cosC</span>`+
            `<span class="step">③ c = √(${a}² + ${b}² - 2×${a}×${b}×cos${C}°)</span>`+
            `<span class="step">④ c ≈ <span class="result">${round(c,2)}</span>，周长 ≈ ${round(perim,2)}，面积 ≈ ${round(area,2)}</span>`;
        }

        return {
          type: 'triangle', typeLabel: '三角形',
          question, answer, explanation,
          params: { a, b, c: round(c,2), angleC: C, area: round(area,2), perimeter: round(perim,2) },
          draw: () => drawTriangleDiagram(a, b, round(c,2))
        };
      }

      // 情况2：三边
      // 优先用「边为/三边」模式精确提取，避免抓到无关数字
      const edgePattern = text.match(/(?:三?边[为是]|边长[为是])\s*(\d+\.?\d*)\s*[、,，和与]\s*(\d+\.?\d*)\s*[、,，和与]\s*(\d+\.?\d*)/);
      let a, b, c;
      if (edgePattern) {
        a = parseFloat(edgePattern[1]);
        b = parseFloat(edgePattern[2]);
        c = parseFloat(edgePattern[3]);
      } else {
        // 回退：从文本提取数字，但跳过常见无关数字（如角度值）
        const nums = extractNumbers(text);
        if (nums.length < 3) return null;
        [a, b, c] = nums.slice(0, 3);
      }
      if (a + b <= c || a + c <= b || b + c <= a) return null;

      const isArea = /面积/.test(text);
      const isPerimeter = /周长/.test(text);
      const isAngle = /角|度数/.test(text);
      const s = (a+b+c)/2;
      const area = Math.sqrt(Math.max(0, s*(s-a)*(s-b)*(s-c)));
      const perim = a+b+c;
      let question = '三角形';
      let answer = '';
      let explanation = '';

      if (isArea) {
        question = `三角形面积`;
        answer = `${round(area, 2)}`;
        explanation =
          `<span class="step">① 使用<span class="formula">海伦公式</span>计算三角形面积</span>`+
          `<span class="step">② 先求半周长：s = (a+b+c)/2 = (${a}+${b}+${c})/2 = ${s}</span>`+
          `<span class="step">③ 面积公式：<span class="formula">S = √[s(s-a)(s-b)(s-c)]</span></span>`+
          `<span class="step">④ S = √[${s}×${round(s-a,2)}×${round(s-b,2)}×${round(s-c,2)}]</span>`+
          `<span class="step">⑤ S = √${round(s*(s-a)*(s-b)*(s-c),2)} ≈ <span class="result">${answer}</span></span>`;
      } else if (isPerimeter) {
        question = `三角形周长`;
        answer = `${perim}`;
        explanation =
          `<span class="step">① 三角形周长 = 三边之和</span>`+
          `<span class="step">② <span class="formula">C = a + b + c</span></span>`+
          `<span class="step">③ C = ${a} + ${b} + ${c} = <span class="result">${answer}</span></span>`;
      } else if (isAngle) {
        const cosA = clamp((b*b+c*c-a*a)/(2*b*c), -1, 1);
        const angleA = round(Math.acos(cosA)*180/PI, 1);
        question = `三角形角度`;
        answer = `${angleA}°`;
        explanation =
          `<span class="step">① 使用<span class="formula">余弦定理</span>：cos A = (b²+c²-a²)/(2bc)</span>`+
          `<span class="step">② cos A = (${b}²+${c}²-${a}²)/(2×${b}×${c})</span>`+
          `<span class="step">③ cos A = ${round(cosA,4)}</span>`+
          `<span class="step">④ A = arccos(${round(cosA,4)}) ≈ <span class="result">${answer}</span></span>`;
      } else {
        question = `三角形（三边 ${a}, ${b}, ${c}）`;
        explanation =
          `<span class="step">该三角形三边分别为 <span class="highlight">a=${a}</span>，<span class="highlight">b=${b}</span>，<span class="highlight">c=${c}</span></span>`+
          `<span class="step">周长 = ${perim}，面积 ≈ ${round(area,2)}</span>`;
      }

      return {
        type: 'triangle', typeLabel: '三角形',
        question, answer, explanation,
        params: { a, b, c, area: round(area,2), perimeter: perim },
        draw: () => drawTriangleDiagram(a, b, c)
      };
    }

    // ─── 圆形（支持半径/直径/面积反推）───
    function parseCircle(text) {
      if (!/圆|半径|直径/.test(text)) return null;

      let r = null;
      let fromArea = false;

      // 从面积反推半径：圆面积为16π，求半径
      const areaPiMatch = text.match(/面积[为是]?\s*(\d+\.?\d*)\s*π/);
      if (areaPiMatch) {
        const k = parseFloat(areaPiMatch[1]); // S = kπ
        r = Math.sqrt(k);
        fromArea = true;
      }

      // 半径（数字）
      if (!r) {
        let rMatch = text.match(/半径[为是]?\s*(\d+\.?\d*)/);
        if (rMatch) r = parseFloat(rMatch[1]);
      }
      if (!r) {
        let rMatch = text.match(/[rR][=＝]\s*(\d+\.?\d*)/);
        if (rMatch) r = parseFloat(rMatch[1]);
      }
      // 半径（中文数字）
      if (!r) {
        let rMatch = text.match(/半径[为是]?\s*([一二三四五六七八九十两]+)/);
        if (rMatch) r = parseCnNumber(rMatch[1]);
      }
      // 直径
      let dMatch = text.match(/直径[为是]?\s*(\d+\.?\d*)/);
      if (!r && dMatch) r = parseFloat(dMatch[1]) / 2;
      if (!r) return null;

      const isArea = /面积/.test(text);
      const isPerimeter = /周长/.test(text);
      const area = PI * r * r;
      const perim = 2 * PI * r;

      let question, answer, explanation;
      if (fromArea && /半径/.test(text)) {
        // 从面积求半径
        question = `圆半径（由面积反推）`;
        answer = `${round(r, 2)}`;
        explanation =
          `<span class="step">① 已知圆面积 S = ${round(areaPiMatch[1])}π</span>`+
          `<span class="step">② 面积公式：<span class="formula">S = πr²</span></span>`+
          `<span class="step">③ r² = S/π = ${round(areaPiMatch[1])}π/π = ${round(areaPiMatch[1])}</span>`+
          `<span class="step">④ r = √${round(areaPiMatch[1])} = <span class="result">${answer}</span></span>`;
      } else if (isArea && !fromArea) {
        question = `圆面积（r=${r}）`;
        answer = `${round(area, 2)}`;
        explanation =
          `<span class="step">① 圆面积公式：<span class="formula">S = πr²</span></span>`+
          `<span class="step">② S = π × ${r}² = π × ${r*r}</span>`+
          `<span class="step">③ S ≈ <span class="result">${answer}</span></span>`;
      } else if (isPerimeter) {
        question = `圆周长（r=${r}）`;
        answer = `${round(perim, 2)}`;
        explanation =
          `<span class="step">① 圆周长公式：<span class="formula">C = 2πr</span></span>`+
          `<span class="step">② C = 2π × ${r} = ${2*r}π</span>`+
          `<span class="step">③ C ≈ <span class="result">${answer}</span></span>`;
      } else {
        question = `圆（r=${r}）`;
        explanation =
          `<span class="step">该圆半径为 <span class="highlight">r=${r}</span></span>`+
          `<span class="step">周长 ≈ ${round(perim,2)}，面积 ≈ ${round(area,2)}</span>`;
      }

      return {
        type: 'circle', typeLabel: '圆形',
        question, answer, explanation,
        params: { r: round(r,2), area: round(area,2), perimeter: round(perim,2) },
        draw: () => drawCircleDiagram(r)
      };
    }

    // ─── 平行四边形（底、高、侧边）───
    function parseParallelogram(text) {
      if (!/平行四边形/.test(text)) return null;

      let base = null, height = null, side = null;
      let baseM = text.match(/底[为是]?\s*(\d+\.?\d*)/);
      let hM = text.match(/高[为是]?\s*(\d+\.?\d*)/);
      let sM = text.match(/(?:侧边|斜边|邻边|腰)[为是]?\s*(\d+\.?\d*)/);
      if (baseM) base = parseFloat(baseM[1]);
      if (hM) height = parseFloat(hM[1]);
      if (sM) side = parseFloat(sM[1]);

      // 兜底：按顺序取数字
      if (!base || !height) {
        const nums = extractNumbers(text);
        if (nums.length >= 2) {
          if (!base) base = nums[0];
          if (!height) height = nums[1];
          if (!side && nums.length >= 3) side = nums[2];
        }
      }
      if (!base || !height) return null;

      // 若未给出侧边，默认按 60° 角估算
      let sideAssumed = false;
      if (!side) {
        side = height / Math.sin(PI/3);
        sideAssumed = true;
      }

      const area = base * height;
      const perim = 2 * (base + side);
      const isArea = /面积/.test(text);
      const isPerimeter = /周长/.test(text);

      let question, answer, explanation;
      if (isArea) {
        question = `平行四边形面积`;
        answer = `${area}`;
        explanation =
          `<span class="step">① 平行四边形面积 = 底 × 高</span>`+
          `<span class="step">② <span class="formula">S = a × h</span></span>`+
          `<span class="step">③ S = ${base} × ${height} = <span class="result">${answer}</span></span>`+
          (sideAssumed
            ? `<span class="step">④ 周长 ≈ ${round(perim,2)}（侧边按60°角估算 ≈ ${round(side,2)}）</span>`
            : `<span class="step">④ 周长 = 2×(${base}+${round(side,2)}) = ${round(perim,2)}</span>`);
      } else if (isPerimeter) {
        question = `平行四边形周长`;
        answer = `${round(perim,2)}`;
        explanation =
          `<span class="step">① 平行四边形周长 = 2 × (底 + 侧边)</span>`+
          `<span class="step">② <span class="formula">C = 2(a + b)</span></span>`+
          `<span class="step">③ C = 2 × (${base} + ${round(side,2)}) = <span class="result">${answer}</span></span>`;
      } else {
        question = `平行四边形（底${base} 高${height}）`;
        explanation =
          `<span class="step">该平行四边形底为 <span class="highlight">${base}</span>，高为 <span class="highlight">${height}</span></span>`+
          `<span class="step">面积 = ${base}×${height} = <span class="result">${area}</span></span>`+
          (sideAssumed
            ? `<span class="step">周长 ≈ ${round(perim,2)}（侧边按60°角估算）</span>`
            : `<span class="step">周长 = ${round(perim,2)}</span>`);
      }

      return {
        type: 'parallelogram', typeLabel: '平行四边形',
        question, answer, explanation,
        params: { 底: base, 高: height, 侧边: round(side,2), 面积: area, 周长: round(perim,2) },
        draw: () => drawParallelogramDiagram(base, height, side)
      };
    }

    function parseRectangle(text) {
      if (!/矩形|长方形/.test(text)) return null;

      let length = null, width = null;
      let lMatch = text.match(/长[为是]?\s*(\d+\.?\d*)/);
      let wMatch = text.match(/宽[为是]?\s*(\d+\.?\d*)/);
      if (lMatch) length = parseFloat(lMatch[1]);
      if (wMatch) width = parseFloat(wMatch[1]);

      // 如果没有明确的长/宽，取前两个数字
      if (!length || !width) {
        const nums = extractNumbers(text);
        if (nums.length >= 2) {
          if (!length) length = nums[0];
          if (!width) width = nums[1];
        }
      }
      if (!length || !width) return null;

      const isArea = /面积/.test(text);
      const isPerimeter = /周长/.test(text);
      const isDiag = /对角线/.test(text);
      const area = length * width;
      const perim = 2 * (length + width);
      const diag = Math.sqrt(length*length + width*width);

      let question, answer, explanation;
      if (isArea) {
        question = `矩形面积`;
        answer = `${area}`;
        explanation =
          `<span class="step">① 矩形面积 = 长 × 宽</span>`+
          `<span class="step">② <span class="formula">S = l × w</span></span>`+
          `<span class="step">③ S = ${length} × ${width} = <span class="result">${answer}</span></span>`;
      } else if (isPerimeter) {
        question = `矩形周长`;
        answer = `${perim}`;
        explanation =
          `<span class="step">① 矩形周长 = 2 × (长 + 宽)</span>`+
          `<span class="step">② <span class="formula">C = 2(l + w)</span></span>`+
          `<span class="step">③ C = 2 × (${length} + ${width}) = <span class="result">${answer}</span></span>`;
      } else if (isDiag) {
        question = `矩形对角线`;
        answer = `${round(diag, 2)}`;
        explanation =
          `<span class="step">① 对角线 = √(长² + 宽²)</span>`+
          `<span class="step">② <span class="formula">d = √(l² + w²)</span></span>`+
          `<span class="step">③ d = √(${length}² + ${width}²) = √${length*length+width*width}</span>`+
          `<span class="step">④ d ≈ <span class="result">${answer}</span></span>`;
      } else {
        question = `矩形（${length}×${width}）`;
        explanation =
          `<span class="step">该矩形长为 <span class="highlight">${length}</span>，宽为 <span class="highlight">${width}</span></span>`+
          `<span class="step">面积 = ${area}，周长 = ${perim}</span>`;
      }

      return {
        type: 'rectangle', typeLabel: '矩形',
        question, answer, explanation,
        params: { length, width, area, perimeter: perim, diagonal: round(diag,2) },
        draw: () => drawRectangleDiagram(length, width)
      };
    }

    function parseTrapezoid(text) {
      if (!/梯形/.test(text)) return null;

      let top = null, bottom = null, height = null;
      let topM = text.match(/上底[为是]?\s*(\d+\.?\d*)/);
      let botM = text.match(/下底[为是]?\s*(\d+\.?\d*)/);
      let hM = text.match(/高[为是]?\s*(\d+\.?\d*)/);
      if (topM) top = parseFloat(topM[1]);
      if (botM) bottom = parseFloat(botM[1]);
      if (hM) height = parseFloat(hM[1]);

      // 兜底：按顺序取数字
      if (!top || !bottom || !height) {
        const nums = extractNumbers(text);
        if (nums.length >= 3) {
          if (!top) top = nums[0];
          if (!bottom) bottom = nums[1];
          if (!height) height = nums[2];
        }
      }
      if (!top || !bottom || !height) return null;

      const area = (top + bottom) * height / 2;
      const isArea = /面积/.test(text);
      let question, answer, explanation;

      if (isArea) {
        question = `梯形面积`;
        answer = `${area}`;
        explanation =
          `<span class="step">① 梯形面积 = (上底 + 下底) × 高 ÷ 2</span>`+
          `<span class="step">② <span class="formula">S = (a + b) × h / 2</span></span>`+
          `<span class="step">③ S = (${top} + ${bottom}) × ${height} / 2</span>`+
          `<span class="step">④ S = ${top+bottom} × ${height} / 2 = <span class="result">${answer}</span></span>`;
      } else {
        question = `梯形（上底${top} 下底${bottom} 高${height}）`;
        explanation =
          `<span class="step">该梯形上底 <span class="highlight">a=${top}</span>，下底 <span class="highlight">b=${bottom}</span>，高 <span class="highlight">h=${height}</span></span>`+
          `<span class="step">面积 = (${top}+${bottom})×${height}/2 = <span class="result">${area}</span></span>`;
      }

      return {
        type: 'trapezoid', typeLabel: '梯形',
        question, answer, explanation,
        params: { top, bottom, height, area },
        draw: () => drawTrapezoidDiagram(top, bottom, height)
      };
    }

    // ─── 绝对值函数 y=|ax+b| ───
    function parseAbsoluteValue(text) {
      // 匹配 y=|ax+b| 等格式，或含"绝对值"关键词
      const hasKw = /绝对值/.test(text);
      const m1 = text.match(/y\s*[=＝]\s*\|(-?\d*\.?\d*)\s*[x×]\s*([+\-－＋])\s*(\d+\.?\d*)\s*\|/);  // y=|ax+b|
      const m2 = text.match(/y\s*[=＝]\s*\|(-?\d*\.?\d*)\s*[x×]\s*\|/);                              // y=|ax|
      const m3 = text.match(/y\s*[=＝]\s*\|\s*[x×]\s*([+\-－＋])\s*(\d+\.?\d*)\s*\|/);               // y=|x+b|
      const m4 = text.match(/y\s*[=＝]\s*\|\s*[x×]\s*\|/);                                          // y=|x|

      if (!hasKw && !m1 && !m2 && !m3 && !m4) return null;

      let a = null, b = null;
      if (m1) {
        a = (m1[1] === '' || m1[1] === '-') ? (m1[1] === '-' ? -1 : 1) : parseFloat(m1[1]);
        b = parseFloat((m1[2] === '-' || m1[2] === '－' ? '-' : '') + m1[3]);
      } else if (m2) {
        a = (m2[1] === '' || m2[1] === '-') ? (m2[1] === '-' ? -1 : 1) : parseFloat(m2[1]);
        b = 0;
      } else if (m3) {
        a = 1;
        b = parseFloat((m3[1] === '-' || m3[1] === '－' ? '-' : '') + m3[2]);
      } else if (m4) {
        a = 1; b = 0;
      } else {
        return null;
      }

      if (a === 0) return null;
      const vertexX = -b / a;
      const yInt = Math.abs(b);

      const aStr = (a === 1 ? '' : a === -1 ? '-' : a);
      const question = `绝对值函数 y=|${aStr}x${b>=0?'+':''}${b}|`;
      const explanation =
        `<span class="step">① 函数解析式：<span class="formula">y = |${aStr}x ${b>=0?'+':'-'} ${Math.abs(b)}|</span></span>`+
        `<span class="step">② 绝对值函数图象为 <span class="highlight">V 型折线</span></span>`+
        `<span class="step">③ 顶点：令 ax+b=0，x = ${round(vertexX,2)}，顶点为 <span class="highlight">(${round(vertexX,2)}, 0)</span></span>`+
        `<span class="step">④ 与 y 轴交点：x=0，y=|${b}|=${yInt}，交点 <span class="highlight">(0, ${yInt})</span></span>`+
        (b !== 0 ? `<span class="step">⑤ 与 x 轴交点即顶点 (${round(vertexX,2)}, 0)</span>` : `<span class="step">⑤ 顶点在原点 (0, 0)</span>`);

      return {
        type: 'absoluteValue', typeLabel: '绝对值函数',
        question, answer: `顶点(${round(vertexX,1)}, 0)`, explanation,
        params: { a, b, 顶点x: round(vertexX,2), y轴交点: yInt },
        draw: () => drawAbsoluteValueDiagram(a, b)
      };
    }

    function parseLinearFn(text) {
      if (!/一次函数|直线/.test(text) && !/y\s*[=＝]\s*-?\d*\.?\d*\s*[x×](?![²2^])/.test(text)) return null;

      // 提取 y = kx + b
      let k = null, b = null;
      let match = text.match(/y\s*[=＝]\s*(-?\d*\.?\d*)\s*[x×](?![²2^])\s*([+\-－＋])\s*(\d+\.?\d*)/);
      if (match) {
        k = match[1] === '' || match[1] === '-' ? (match[1] === '-' ? -1 : 1) : parseFloat(match[1]);
        b = parseFloat((match[2] === '-' || match[2] === '－') ? `-${match[3]}` : match[3]);
      } else {
        // 尝试 y = kx 格式（k可为省略的1或-1）
        match = text.match(/y\s*[=＝]\s*(-?\d*\.?\d*)\s*[x×](?![²2^])/);
        if (match) {
          k = match[1] === '' || match[1] === '-' ? (match[1] === '-' ? -1 : 1) : parseFloat(match[1]);
          b = 0;
        }
      }

      if (k === null) return null;

      const vxMatch = text.match(/[xX][=＝]\s*(-?\d+\.?\d*)/);
      const vx = vxMatch ? parseFloat(vxMatch[1]) : null;
      let question, answer, explanation;

      if (vx !== null) {
        const vy = k * vx + b;
        question = `一次函数求值（x=${vx}）`;
        answer = `${vy}`;
        const kStr = k===1?'':k===-1?'-':k;
        const bStr = b===0?'':`${b>=0?'+':''}${b}`;
        explanation =
          `<span class="step">① 将 x = ${vx} 代入 <span class="formula">y = ${kStr}x${bStr}</span></span>`+
          `<span class="step">② y = ${kStr==='-'?'-':(k!==1&&k!==-1?k+'×':'')} ${vx} ${b>=0&&b!==0?'+ ':'- '}${Math.abs(b)}</span>`+
          `<span class="step">③ y = <span class="result">${answer}</span></span>`;
      } else {
        const kStr = k===1?'':k===-1?'-':k;
        const bStr = b===0?'':`${b>=0?'+':''}${b}`;
        question = `一次函数 y=${kStr}x${bStr}`;
        const xIntercept = -b/k;
        explanation =
          `<span class="step">函数解析式：<span class="formula">y = ${kStr}x ${b>=0&&b!==0?'+ ':'- '}${b===0?'':Math.abs(b)}</span></span>`+
          `<span class="step">斜率 k = <span class="highlight">${k}</span>，y轴截距 b = <span class="highlight">${b}</span></span>`+
          (b !== 0 ? `<span class="step">与x轴交点：令y=0，x = ${round(xIntercept,2)}</span>` : `<span class="step">该直线过原点</span>`);
      }

      return {
        type: 'linear', typeLabel: '一次函数',
        question, answer, explanation,
        params: { k, b },
        draw: () => drawLinearDiagram(k, b)
      };
    }

    function parseQuadraticFn(text) {
      if (!/二次函数|抛物线/.test(text) && !/y\s*[=＝]\s*-?\d*\.?\d*\s*[x×][²2^]/.test(text)) return null;

      let a = null, b = null, c = null;
      let match = text.match(/y\s*[=＝]\s*(-?\d*)\.?(\d*)\s*[x×][²2](?:\s*([+\-])\s*(\d+\.?\d*)\s*[x×])?(?:\s*([+\-])\s*(\d+\.?\d*))?/);
      if (match) {
        a = match[1] === '' || match[1] === '-' ? (match[1] === '-' ? -1 : 1) : parseFloat(match[1] + (match[2] ? '.' + match[2] : ''));
        b = match[4] ? parseFloat((match[3] === '-' ? '-' : '') + match[4]) : 0;
        c = match[6] ? parseFloat((match[5] === '-' ? '-' : '') + match[6]) : 0;
      }

      // 简化匹配：提取所有数字
      if (a === null) {
        if (/x[²2]/.test(text)) {
          const yMatch = text.match(/y\s*[=＝]\s*([-]?)\s*(\d+\.?\d*)?\s*x[²2]/);
          if (yMatch) {
            a = (yMatch[1] === '-' ? -1 : 1) * (yMatch[2] ? parseFloat(yMatch[2]) : 1);
          }
          const afterSq = text.split(/x[²2]/)[1] || '';
          const bxMatch = afterSq.match(/([+\-－＋])\s*(\d+\.?\d*)\s*[x×]/);
          if (bxMatch) {
            b = parseFloat((bxMatch[1] === '-' || bxMatch[1] === '－' ? '-' : '') + bxMatch[2]);
          }
          const cMatch = afterSq.match(/([+\-－＋])\s*(\d+\.?\d*)\s*(?:[。.？！?！,，）)）]|$)/);
          if (cMatch) {
            c = parseFloat((cMatch[1] === '-' || cMatch[1] === '－' ? '-' : '') + cMatch[2]);
          }
        }
      }

      if (a === null || a === 0) return null;

      const vx = -b / (2 * a);
      const vy = a * vx * vx + b * vx + c;
      let question, explanation;
      question = `二次函数 y=${a===1?'':a===-1?'-':''}${a!==1&&a!==-1?a:''}x²${b>=0?'+':''}${b}x${c>=0?'+':''}${c}`;
      explanation =
        `<span class="step">函数解析式：<span class="formula">y = ${a===1?'':a===-1?'-':a}x² ${b>=0?'+ ':'- '}${Math.abs(b)}x ${c>=0?'+ ':'- '}${Math.abs(c)}</span></span>`+
        `<span class="step">开口方向：${a>0?'向上':'向下'}</span>`+
        `<span class="step">对称轴：x = -b/(2a) = ${b>=0?'-':''}${Math.abs(b)}/(2×${a}) = <span class="highlight">${round(vx,2)}</span></span>`+
        `<span class="step">顶点坐标：(<span class="highlight">${round(vx,2)}</span>, <span class="highlight">${round(vy,2)}</span>)</span>`+
        `<span class="step">与y轴交点：(0, <span class="highlight">${c}</span>)</span>`;

      return {
        type: 'quadratic', typeLabel: '二次函数',
        question, answer: `顶点(${round(vx,1)}, ${round(vy,1)})`, explanation,
        params: { a, b, c, vertexX: round(vx,2), vertexY: round(vy,2) },
        draw: () => drawQuadraticDiagram(a, b, c)
      };
    }

    function parseInverseFn(text) {
      if (!/反比例/.test(text) && !/y\s*[=＝]\s*\d+\.?\d*\s*\/\s*x/.test(text)) return null;

      let k = null;
      let match = text.match(/y\s*[=＝]\s*(\d+\.?\d*)\s*\/\s*x/);
      if (match) k = parseFloat(match[1]);
      if (!k) {
        match = text.match(/[kK][=＝]\s*(\d+\.?\d*)/);
        if (match) k = parseFloat(match[1]);
      }
      if (!k) {
        const nums = extractNumbers(text);
        if (nums.length > 0) k = nums[0];
      }
      if (!k) return null;

      let question, explanation;
      const quadrant = k > 0 ? '第一、三象限' : '第二、四象限';
      question = `反比例函数 y=${k}/x`;
      explanation =
        `<span class="step">函数解析式：<span class="formula">y = ${k}/x</span></span>`+
        `<span class="step">k = ${k} ${k>0?'>':'<'} 0，图象位于<span class="highlight">${quadrant}</span></span>`+
        `<span class="step">图象关于原点对称，渐进逼近x轴和y轴</span>`+
        `<span class="step">在每个象限内，y 随 x 的增大而${k>0?'减小':'增大'}</span>`;

      return {
        type: 'inverse', typeLabel: '反比例函数',
        question, answer: '', explanation,
        params: { k },
        draw: () => drawInverseDiagram(k)
      };
    }

    function parseDistance(text) {
      if (!/距离|两点间/.test(text)) return null;
      const points = extractPoints(text);
      if (points.length < 2) return null;

      const p1 = points[0], p2 = points[1];
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      let question, answer, explanation;
      question = `两点间距离`;
      answer = `${round(dist, 2)}`;
      explanation =
        `<span class="step">① 两点间距离公式：<span class="formula">d = √[(x₂-x₁)² + (y₂-y₁)²]</span></span>`+
        `<span class="step">② d = √[(${p2.x}-${p1.x})² + (${p2.y}-${p1.y})²]</span>`+
        `<span class="step">③ d = √[${dx}² + ${dy}²] = √[${dx*dx} + ${dy*dy}]</span>`+
        `<span class="step">④ d = √${dx*dx+dy*dy} ≈ <span class="result">${answer}</span></span>`;

      return {
        type: 'distance', typeLabel: '两点距离',
        question, answer, explanation,
        params: { p1, p2, distance: round(dist,2) },
        draw: () => drawPointsDiagram([p1, p2], { connect: true, showDistance: true })
      };
    }

    function parseMidpoint(text) {
      if (!/中点/.test(text)) return null;
      const points = extractPoints(text);
      if (points.length < 2) return null;

      const p1 = points[0], p2 = points[1];
      const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
      let question, answer, explanation;
      question = `中点坐标`;
      answer = `(${mx}, ${my})`;
      explanation =
        `<span class="step">① 中点公式：<span class="formula">M = ((x₁+x₂)/2, (y₁+y₂)/2)</span></span>`+
        `<span class="step">② Mx = (${p1.x}+${p2.x})/2 = ${mx}</span>`+
        `<span class="step">③ My = (${p1.y}+${p2.y})/2 = ${my}</span>`+
        `<span class="step">④ 中点 = <span class="result">(${mx}, ${my})</span></span>`;

      return {
        type: 'midpoint', typeLabel: '中点坐标',
        question, answer, explanation,
        params: { p1, p2, midX: mx, midY: my },
        draw: () => drawPointsDiagram([p1, p2], { connect: true, showMidpoint: true, midX: mx, midY: my })
      };
    }

    function parseBarChart(text) {
      if (!/条形|柱状/.test(text)) return null;
      const nums = extractNumbers(text);
      if (nums.length < 2) return null;
      // 提取标签与数据
      const labelRegex = /([\u4e00-\u9fa5]+)\s*(\d+\.?\d*)/g;
      let match;
      let data = [];
      while ((match = labelRegex.exec(text)) !== null) {
        data.push({ label: match[1], value: parseFloat(match[2]) });
      }
      if (data.length === 0) {
        data = nums.map((n, i) => ({ label: `项${i+1}`, value: n }));
      }
      let question, explanation;
      const total = data.reduce((s,d)=>s+d.value, 0);
      const max = data.reduce((a,b)=>a.value>b.value?a:b);
      question = `条形统计图`;
      explanation =
        `<span class="step">各项目数据：${data.map(d=>`${d.label}=${d.value}`).join('，')}</span>`+
        `<span class="step">总数 = ${total}，最大项 = ${max.label}（${max.value}）</span>`;

      return {
        type: 'barChart', typeLabel: '条形统计图',
        question, answer: '', explanation,
        params: { data, total, max },
        draw: () => drawBarChartDiagram(data)
      };
    }

    function parsePieChart(text) {
      if (!/扇形|饼图/.test(text)) return null;
      const labelRegex = /([\u4e00-\u9fa5]+)\s*(\d+\.?\d*)\s*[%％]/g;
      let match;
      let data = [];
      while ((match = labelRegex.exec(text)) !== null) {
        data.push({ label: match[1], value: parseFloat(match[2]) });
      }
      if (data.length < 2) {
        // 尝试提取数字百分比
        const nums = extractNumbers(text);
        if (nums.length >= 2) {
          const labels = ['A','B','C','D','E'];
          data = nums.map((n,i) => ({ label: labels[i] || `项${i+1}`, value: n }));
        }
      }
      if (data.length < 2) return null;
      const total = data.reduce((s,d)=>s+d.value, 0);
      let question, explanation;
      question = `扇形统计图`;
      explanation =
        `<span class="step">各项占比：${data.map(d=>`${d.label} ${d.value}%`).join('，')}</span>`+
        `<span class="step">总计：${total}%</span>`;

      return {
        type: 'pieChart', typeLabel: '扇形统计图',
        question, answer: '', explanation,
        params: { data, total },
        draw: () => drawPieChartDiagram(data)
      };
    }

    /* ═══════════════════════════════════════════════════════
       Canvas 绘图函数
       ═══════════════════════════════════════════════════════ */

    function clearCanvas() { ctx.clearRect(0, 0, canvasW(), canvasH()); }
    // 获取canvas逻辑尺寸（高DPI适配）
    function canvasW() { return parseFloat(canvas.style.width) || canvas.width; }
    function canvasH() { return parseFloat(canvas.style.height) || canvas.height; }

    // 绘制坐标系（网格受 showGrid 控制，刻度/标签受 showLabels 控制）
    function drawCoordSystem(xRange, yRange) {
      const w = canvasW(), h = canvasH();
      const pad = 40;
      const cx = w / 2, cy = h / 2;
      const scaleX = (w - pad * 2) / (xRange * 2);
      const scaleY = (h - pad * 2) / (yRange * 2);
      const scale = Math.min(scaleX, scaleY);
      const toX = x => cx + x * scale;
      const toY = y => cy - y * scale;

      // 网格（受 showGrid 控制）
      if (showGrid) {
        ctx.strokeStyle = 'rgba(58,74,94,0.4)';
        ctx.lineWidth = 0.5;
        for (let i = -xRange; i <= xRange; i++) {
          if (i === 0) continue;
          ctx.beginPath(); ctx.moveTo(toX(i), toY(-yRange)); ctx.lineTo(toX(i), toY(yRange)); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(toX(-xRange), toY(i)); ctx.lineTo(toX(xRange), toY(i)); ctx.stroke();
        }
      }
      // 坐标轴
      ctx.strokeStyle = '#6B7B8E'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(toX(-xRange), toY(0)); ctx.lineTo(toX(xRange), toY(0));
      ctx.moveTo(toX(0), toY(-yRange)); ctx.lineTo(toX(0), toY(yRange));
      ctx.stroke();
      // 箭头
      ctx.fillStyle = '#6B7B8E';
      ctx.beginPath(); ctx.moveTo(toX(xRange), toY(0)); ctx.lineTo(toX(xRange)-8, toY(0)-4); ctx.lineTo(toX(xRange)-8, toY(0)+4); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(toX(0), toY(yRange)); ctx.lineTo(toX(0)-4, toY(yRange)-8); ctx.lineTo(toX(0)+4, toY(yRange)-8); ctx.closePath(); ctx.fill();
      // 标签与刻度（受 showLabels 控制）
      if (showLabels) {
        ctx.fillStyle = '#8B9BAE'; ctx.font = 'italic 14px "JetBrains Mono"'; ctx.textAlign = 'left';
        ctx.fillText('x', toX(xRange)+6, toY(0)+5);
        ctx.fillText('y', toX(0)+6, toY(yRange)-4);
        ctx.fillText('O', toX(0)-14, toY(0)+15);
        ctx.font = '11px "JetBrains Mono"'; ctx.fillStyle = '#5A6B7E';
        for (let i = -xRange; i <= xRange; i++) { if (i !== 0) { ctx.textAlign='center'; ctx.fillText(i, toX(i), toY(0)+15); } }
        for (let i = -yRange; i <= yRange; i++) { if (i !== 0) { ctx.textAlign='right'; ctx.fillText(i, toX(0)-7, toY(i)+4); } }
      }
      return { toX, toY, scale, cx, cy };
    }

    function drawTriangleDiagram(a, b, c) {
      const w = canvasW(), h = canvasH();
      const Ax=0, Ay=0, Bx=c, By=0;
      const Cx = (b*b + c*c - a*a) / (2*c);
      const Cy = Math.sqrt(Math.max(0, b*b - Cx*Cx));
      const minX = Math.min(0, Cx), maxX = Math.max(c, Cx), minY = 0, maxY = Math.max(Cy, 0.01);
      const pad = 75;
      const s = Math.min((w-pad*2)/(maxX-minX), (h-pad*2)/(maxY-minY));
      const ox = (w-(maxX-minX)*s)/2 - minX*s;
      const oy = (h-(maxY-minY)*s)/2 + maxY*s;
      const tx = x => ox + x*s, ty = y => oy - y*s;

      // 填充与边
      ctx.beginPath(); ctx.moveTo(tx(Ax),ty(Ay)); ctx.lineTo(tx(Bx),ty(By)); ctx.lineTo(tx(Cx),ty(Cy)); ctx.closePath();
      ctx.fillStyle = 'rgba(240,168,48,0.08)'; ctx.fill();
      ctx.strokeStyle = '#F0A830'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();

      // 高线（辅助线）
      if (showAuxLines) {
        ctx.beginPath(); ctx.moveTo(tx(Cx),ty(Cy)); ctx.lineTo(tx(Cx),ty(0));
        ctx.strokeStyle = 'rgba(61,204,199,0.4)'; ctx.lineWidth = 1.5; ctx.setLineDash([4,3]); ctx.stroke(); ctx.setLineDash([]);
      }

      // 顶点与标注
      if (showLabels) {
        [{x:Ax,y:Ay,l:'A',dx:-16,dy:6},{x:Bx,y:By,l:'B',dx:16,dy:6},{x:Cx,y:Cy,l:'C',dx:0,dy:-14}].forEach(v => {
          ctx.beginPath(); ctx.arc(tx(v.x),ty(v.y),5,0,PI*2); ctx.fillStyle='#F0A830'; ctx.fill();
          ctx.strokeStyle='#0B0F14'; ctx.lineWidth=2; ctx.stroke();
          ctx.font='bold 16px "JetBrains Mono"'; ctx.fillStyle='#E8EDF2'; ctx.textAlign='center';
          ctx.fillText(v.l, tx(v.x)+v.dx, ty(v.y)+v.dy);
        });
        // 边标注
        const midBC={x:(Bx+Cx)/2,y:(By+Cy)/2}, midAC={x:(Ax+Cx)/2,y:(Ay+Cy)/2}, midAB={x:(Ax+Bx)/2,y:(Ay+By)/2};
        ctx.font='14px "JetBrains Mono"'; ctx.fillStyle='#3DCCC7'; ctx.textAlign='left';
        ctx.fillText(`a=${a}`, tx(midBC.x)+12, ty(midBC.y));
        ctx.textAlign='right'; ctx.fillText(`b=${b}`, tx(midAC.x)-12, ty(midAC.y));
        ctx.textAlign='center'; ctx.fillStyle='#5B9BD5';
        ctx.fillText(`c=${c}`, tx(midAB.x), ty(midAB.y)+22);
        if (showAuxLines) {
          ctx.fillStyle='#8B9BAE'; ctx.font='12px "JetBrains Mono"';
          ctx.fillText(`h`, tx(Cx)-15, ty(Cy/2));
        }
      }
    }

    function drawCircleDiagram(r) {
      const w=canvasW(), h=canvasH();
      const cx=w/2, cy=h/2;
      const maxR=Math.min(w,h)/2-65;
      const minR=35; // 最小可视半径
      const dr=Math.max(minR, Math.min(maxR, r*28));

      // 圆
      ctx.beginPath(); ctx.arc(cx,cy,dr,0,PI*2);
      ctx.fillStyle='rgba(240,168,48,0.06)'; ctx.fill();
      ctx.strokeStyle='#F0A830'; ctx.lineWidth=2.5; ctx.stroke();

      // 圆心与半径线
      ctx.beginPath(); ctx.arc(cx,cy,4,0,PI*2); ctx.fillStyle='#F0A830'; ctx.fill();
      const ang=-PI/5, ex=cx+Math.cos(ang)*dr, ey=cy+Math.sin(ang)*dr;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(ex,ey);
      ctx.strokeStyle='#3DCCC7'; ctx.lineWidth=2; ctx.setLineDash([5,3]); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(ex,ey,3,0,PI*2); ctx.fillStyle='#3DCCC7'; ctx.fill();

      // 标注
      if (showLabels) {
        ctx.font='bold 14px "JetBrains Mono"'; ctx.fillStyle='#E8EDF2'; ctx.textAlign='center';
        ctx.fillText('O', cx-14, cy+18);
        ctx.font='bold 15px "JetBrains Mono"'; ctx.fillStyle='#3DCCC7'; ctx.textAlign='left';
        ctx.fillText(`r=${r}`, (cx+ex)/2+8, (cy+ey)/2-8);
      }

      // 直径线（辅助线）
      if (showAuxLines) {
        const ang2=PI/2.5;
        const dx1=cx+Math.cos(ang2)*dr, dy1=cy+Math.sin(ang2)*dr;
        const dx2=cx-Math.cos(ang2)*dr, dy2=cy-Math.sin(ang2)*dr;
        ctx.beginPath(); ctx.moveTo(dx1,dy1); ctx.lineTo(dx2,dy2);
        ctx.strokeStyle='rgba(91,155,213,0.3)'; ctx.lineWidth=1; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
        if (showLabels) {
          ctx.fillStyle='#5B9BD5'; ctx.font='12px "JetBrains Mono"'; ctx.textAlign='center';
          ctx.fillText(`d=${2*r}`, cx, dy1+18);
        }
      }
    }

    function drawRectangleDiagram(rw, rh) {
      const w=canvasW(), h=canvasH();
      const pad=70;
      const s=Math.min((w-pad*2)/rw,(h-pad*2)/rh);
      const dw=rw*s, dh=rh*s, x=(w-dw)/2, y=(h-dh)/2;

      ctx.beginPath(); ctx.rect(x,y,dw,dh);
      ctx.fillStyle='rgba(240,168,48,0.08)'; ctx.fill();
      ctx.strokeStyle='#F0A830'; ctx.lineWidth=2.5; ctx.stroke();

      // 对角线（辅助线）
      if (showAuxLines) {
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+dw,y+dh);
        ctx.strokeStyle='rgba(61,204,199,0.3)'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]); ctx.stroke(); ctx.setLineDash([]);
      }

      // 顶点
      [[x,y],[x+dw,y],[x+dw,y+dh],[x,y+dh]].forEach(pt => {
        ctx.beginPath(); ctx.arc(pt[0],pt[1],4,0,PI*2); ctx.fillStyle='#F0A830'; ctx.fill();
      });

      // 标注
      if (showLabels) {
        ctx.font='14px "JetBrains Mono"'; ctx.fillStyle='#3DCCC7'; ctx.textAlign='center';
        ctx.fillText(`${rw}`, x+dw/2, y+dh+24);
        ctx.save(); ctx.translate(x+dw+22, y+dh/2); ctx.rotate(-PI/2); ctx.fillText(`${rh}`, 0, 0); ctx.restore();
        ctx.fillStyle='#8B9BAE'; ctx.font='12px "JetBrains Mono"';
        ctx.fillText('长', x+dw/2, y-10);
        ctx.save(); ctx.translate(x-22, y+dh/2); ctx.rotate(-PI/2); ctx.fillText('宽', 0, 0); ctx.restore();
      }
    }

    function drawTrapezoidDiagram(topW, bottomW, height) {
      const w=canvasW(), h=canvasH();
      const pad=70;
      const shapeW=Math.max(topW,bottomW);
      const s=Math.min((w-pad*2)/shapeW,(h-pad*2)/height);
      const dSW=shapeW*s, dH=height*s, dTW=topW*s, dBW=bottomW*s;
      const ox=(w-dSW)/2, oy=(h-dH)/2;
      const x1=ox+(dSW-dBW)/2, y1=oy+dH;
      const x2=x1+dBW, y2=y1;
      const x3=ox+(dSW+dTW)/2, y3=oy;
      const x4=ox+(dSW-dTW)/2, y4=y3;

      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4); ctx.closePath();
      ctx.fillStyle='rgba(240,168,48,0.08)'; ctx.fill();
      ctx.strokeStyle='#F0A830'; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.stroke();

      // 高线（辅助线）
      if (showAuxLines) {
        const hx=ox+dSW/2;
        ctx.beginPath(); ctx.moveTo(hx,oy); ctx.lineTo(hx,oy+dH);
        ctx.strokeStyle='#FF6B5E'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]); ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(hx,oy); ctx.lineTo(hx+8,oy); ctx.lineTo(hx+8,oy+8);
        ctx.strokeStyle='#FF6B5E'; ctx.lineWidth=1; ctx.stroke();
      }

      // 标注
      if (showLabels) {
        ctx.font='14px "JetBrains Mono"'; ctx.fillStyle='#3DCCC7'; ctx.textAlign='center';
        ctx.fillText(`a=${topW}`, (x4+x3)/2, oy-12);
        ctx.fillText(`b=${bottomW}`, (x1+x2)/2, oy+dH+22);
        if (showAuxLines) {
          ctx.fillStyle='#FF6B5E'; ctx.fillText(`h=${height}`, ox+dSW/2+28, oy+dH/2);
        }
      }
    }

    // ─── 平行四边形绘图（斜切）───
    function drawParallelogramDiagram(base, height, side) {
      const w=canvasW(), h=canvasH();
      // 斜切偏移量：offset = √(side² - height²)
      let offset = Math.sqrt(Math.max(0.01, side*side - height*height));
      if (side < height) offset = height * 0.6; // 兜底

      // 顶点（数学坐标系，A左下 → B右下 → C右上 → D左上）
      const Ax=0, Ay=0, Bx=base, By=0;
      const Cx=base+offset, Cy=height, Dx=offset, Dy=height;
      const minX=Math.min(0,offset), maxX=Math.max(base,base+offset);
      const minY=0, maxY=height;
      const pad=75;
      const s=Math.min((w-pad*2)/(maxX-minX),(h-pad*2)/(maxY-minY));
      const ox=(w-(maxX-minX)*s)/2 - minX*s;
      const oy=(h-(maxY-minY)*s)/2 + maxY*s;
      const tx=x=>ox+x*s, ty=y=>oy-y*s;

      // 填充与边
      ctx.beginPath();
      ctx.moveTo(tx(Ax),ty(Ay)); ctx.lineTo(tx(Bx),ty(By));
      ctx.lineTo(tx(Cx),ty(Cy)); ctx.lineTo(tx(Dx),ty(Dy)); ctx.closePath();
      ctx.fillStyle='rgba(240,168,48,0.08)'; ctx.fill();
      ctx.strokeStyle='#F0A830'; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.stroke();

      // 高线（辅助线，从D垂直向下到底边）
      if (showAuxLines) {
        ctx.beginPath(); ctx.moveTo(tx(Dx),ty(Dy)); ctx.lineTo(tx(Dx),ty(0));
        ctx.strokeStyle='rgba(255,107,94,0.5)'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]); ctx.stroke(); ctx.setLineDash([]);
        // 直角符号
        ctx.beginPath(); ctx.moveTo(tx(Dx),ty(0)); ctx.lineTo(tx(Dx)+8,ty(0)); ctx.lineTo(tx(Dx)+8,ty(0)+8);
        ctx.strokeStyle='rgba(255,107,94,0.5)'; ctx.lineWidth=1; ctx.stroke();
      }

      // 顶点与标注
      if (showLabels) {
        [{x:Ax,y:Ay,l:'A',dx:-16,dy:6},{x:Bx,y:By,l:'B',dx:16,dy:6},
         {x:Cx,y:Cy,l:'C',dx:16,dy:-10},{x:Dx,y:Dy,l:'D',dx:-16,dy:-10}].forEach(v => {
          ctx.beginPath(); ctx.arc(tx(v.x),ty(v.y),5,0,PI*2); ctx.fillStyle='#F0A830'; ctx.fill();
          ctx.strokeStyle='#0B0F14'; ctx.lineWidth=2; ctx.stroke();
          ctx.font='bold 16px "JetBrains Mono"'; ctx.fillStyle='#E8EDF2'; ctx.textAlign='center';
          ctx.fillText(v.l, tx(v.x)+v.dx, ty(v.y)+v.dy);
        });
        ctx.font='14px "JetBrains Mono"'; ctx.fillStyle='#3DCCC7'; ctx.textAlign='center';
        ctx.fillText(`底=${base}`, tx((Ax+Bx)/2), ty(0)+22);
        ctx.fillText(`底=${base}`, tx((Dx+Cx)/2), ty(height)-12);
        ctx.fillStyle='#5B9BD5';
        ctx.fillText(`侧=${round(side,1)}`, tx((Bx+Cx)/2)+10, ty((By+Cy)/2));
        ctx.fillText(`侧=${round(side,1)}`, tx((Ax+Dx)/2)-10, ty((Ay+Dy)/2));
        if (showAuxLines) {
          ctx.fillStyle='#FF6B5E'; ctx.fillText(`h=${height}`, tx(Dx)+30, ty(height/2));
        }
      }
    }

    // ─── 绝对值函数绘图（V 型）───
    function drawAbsoluteValueDiagram(a, b) {
      const vertexX = -b / a;
      const yInt = Math.abs(b);
      const xR = Math.max(Math.abs(vertexX)+3, 5);
      const yR = Math.max(Math.abs(a)*xR + Math.abs(b) + 2, 6);
      const cs = drawCoordSystem(xR, yR);

      // V 型折线：左段 → 顶点 → 右段
      ctx.beginPath();
      ctx.moveTo(cs.toX(-xR), cs.toY(Math.abs(a*(-xR)+b)));
      ctx.lineTo(cs.toX(vertexX), cs.toY(0));
      ctx.lineTo(cs.toX(xR), cs.toY(Math.abs(a*xR+b)));
      ctx.strokeStyle='#F0A830'; ctx.lineWidth=2.5; ctx.stroke();

      // 标注
      if (showLabels) {
        // 顶点
        ctx.beginPath(); ctx.arc(cs.toX(vertexX), cs.toY(0), 5, 0, PI*2);
        ctx.fillStyle='#FF6B5E'; ctx.fill(); ctx.strokeStyle='#0B0F14'; ctx.lineWidth=2; ctx.stroke();
        ctx.font='bold 13px "JetBrains Mono"'; ctx.fillStyle='#FF6B5E'; ctx.textAlign='left';
        ctx.fillText(`顶点(${round(vertexX,1)}, 0)`, cs.toX(vertexX)+8, cs.toY(0)+18);
        // y轴交点
        if (b !== 0) {
          ctx.beginPath(); ctx.arc(cs.toX(0), cs.toY(yInt), 5, 0, PI*2);
          ctx.fillStyle='#6BCB77'; ctx.fill(); ctx.strokeStyle='#0B0F14'; ctx.lineWidth=2; ctx.stroke();
          ctx.fillStyle='#6BCB77';
          ctx.fillText(`(0, ${yInt})`, cs.toX(0)+8, cs.toY(yInt)-8);
        }
        // 函数标注
        ctx.font='bold 16px "JetBrains Mono"'; ctx.fillStyle='#F0A830'; ctx.textAlign='right';
        const aStr = (a===1?'':a===-1?'-':a);
        const sign = b>=0?'+':'-';
        ctx.fillText(`y = |${aStr}x ${sign} ${Math.abs(b)}|`, canvasW()-18, 28);
      }
    }

    function drawLinearDiagram(k, b) {
      const xR=6, rawYR=Math.abs(b)+Math.abs(k)*xR+2;
      const yR=Math.min(Math.max(rawYR, 8), 20); // 限制y轴范围避免大斜率压缩
      const cs=drawCoordSystem(xR, yR);
      // 直线
      ctx.beginPath(); ctx.moveTo(cs.toX(-xR), cs.toY(k*(-xR)+b)); ctx.lineTo(cs.toX(xR), cs.toY(k*xR+b));
      ctx.strokeStyle='#F0A830'; ctx.lineWidth=2.5; ctx.stroke();
      // 标注
      if (showLabels) {
        // y轴交点
        ctx.beginPath(); ctx.arc(cs.toX(0), cs.toY(b), 5, 0, PI*2);
        ctx.fillStyle='#FF6B5E'; ctx.fill(); ctx.strokeStyle='#0B0F14'; ctx.lineWidth=2; ctx.stroke();
        ctx.font='bold 13px "JetBrains Mono"'; ctx.fillStyle='#FF6B5E'; ctx.textAlign='left';
        ctx.fillText(`(0, ${b})`, cs.toX(0)+8, cs.toY(b)-8);
        // x轴交点
        if (b !== 0) {
          const xi = -b/k;
          ctx.beginPath(); ctx.arc(cs.toX(xi), cs.toY(0), 5, 0, PI*2);
          ctx.fillStyle='#6BCB77'; ctx.fill(); ctx.strokeStyle='#0B0F14'; ctx.lineWidth=2; ctx.stroke();
          ctx.fillStyle='#6BCB77'; ctx.fillText(`(${round(xi,1)}, 0)`, cs.toX(xi)+8, cs.toY(0)+18);
        }
        // 函数标注
        ctx.font='bold 16px "JetBrains Mono"'; ctx.fillStyle='#F0A830'; ctx.textAlign='right';
        const kLbl = k===1?'':k===-1?'-':k;
        const bLbl = b===0?'':` ${b>=0?'+':'-'} ${Math.abs(b)}`;
        ctx.fillText(`y = ${kLbl}x${bLbl}`, canvasW()-18, 28);
      }
    }

    function drawQuadraticDiagram(a, b, c) {
      const vx=-b/(2*a), vy=a*vx*vx+b*vx+c;
      const xR=Math.max(Math.abs(vx)+4, 5);
      const yR=Math.max(Math.abs(vy)+6, 8);
      const cs=drawCoordSystem(xR, yR);
      // 抛物线
      ctx.beginPath(); let first=true;
      for (let x=-xR; x<=xR; x+=0.05) {
        const y=a*x*x+b*x+c;
        if (y>yR || y<-yR) { if(!first){ctx.stroke();ctx.beginPath();} first=true; continue; }
        const px=cs.toX(x), py=cs.toY(y);
        if (first) { ctx.moveTo(px,py); first=false; } else ctx.lineTo(px,py);
      }
      ctx.strokeStyle='#F0A830'; ctx.lineWidth=2.5; ctx.stroke();
      // 对称轴（辅助线）
      if (showAuxLines) {
        ctx.beginPath(); ctx.moveTo(cs.toX(vx), cs.toY(-yR)); ctx.lineTo(cs.toX(vx), cs.toY(yR));
        ctx.strokeStyle='rgba(61,204,199,0.25)'; ctx.lineWidth=1; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
      }
      // 标注
      if (showLabels) {
        // 顶点
        ctx.beginPath(); ctx.arc(cs.toX(vx), cs.toY(vy), 5, 0, PI*2);
        ctx.fillStyle='#FF6B5E'; ctx.fill(); ctx.strokeStyle='#0B0F14'; ctx.lineWidth=2; ctx.stroke();
        ctx.font='bold 13px "JetBrains Mono"'; ctx.fillStyle='#FF6B5E'; ctx.textAlign='left';
        ctx.fillText(`顶点(${round(vx,1)}, ${round(vy,1)})`, cs.toX(vx)+8, cs.toY(vy)-8);
        // y轴交点
        ctx.beginPath(); ctx.arc(cs.toX(0), cs.toY(c), 5, 0, PI*2);
        ctx.fillStyle='#6BCB77'; ctx.fill(); ctx.strokeStyle='#0B0F14'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle='#6BCB77'; ctx.fillText(`(0, ${c})`, cs.toX(0)+8, cs.toY(c)-8);
        // 函数标注
        ctx.font='bold 15px "JetBrains Mono"'; ctx.fillStyle='#F0A830'; ctx.textAlign='right';
        let lbl='y = ';
        if (a!==1) lbl+=a; lbl+='x²';
        if (b!==0) lbl+=(b>0?' + ':' - ')+Math.abs(b)+'x';
        if (c!==0) lbl+=(c>0?' + ':' - ')+Math.abs(c);
        ctx.fillText(lbl, canvasW()-18, 28);
      }
    }

    function drawInverseDiagram(k) {
      const xR=Math.ceil(Math.sqrt(Math.abs(k)))+2;
      const yR=xR;
      const cs=drawCoordSystem(xR, yR);
      // 两条双曲线
      for (const sign of [1, -1]) {
        ctx.beginPath(); let first=true;
        for (let x=0.1; x<=xR; x+=0.05) {
          const y=(k*sign)/x;
          if (Math.abs(y)>yR) { if(!first){ctx.stroke();ctx.beginPath();} first=true; continue; }
          const px=cs.toX(x*sign), py=cs.toY(y);
          if (first) { ctx.moveTo(px,py); first=false; } else ctx.lineTo(px,py);
        }
        ctx.strokeStyle='#F0A830'; ctx.lineWidth=2.5; ctx.stroke();
      }
      // 标注
      if (showLabels) {
        ctx.beginPath(); ctx.arc(cs.toX(1), cs.toY(k), 5, 0, PI*2);
        ctx.fillStyle='#FF6B5E'; ctx.fill(); ctx.strokeStyle='#0B0F14'; ctx.lineWidth=2; ctx.stroke();
        ctx.font='bold 13px "JetBrains Mono"'; ctx.fillStyle='#FF6B5E'; ctx.textAlign='left';
        ctx.fillText(`(1, ${k})`, cs.toX(1)+8, cs.toY(k)-8);
        ctx.beginPath(); ctx.arc(cs.toX(k), cs.toY(1), 5, 0, PI*2);
        ctx.fillStyle='#6BCB77'; ctx.fill(); ctx.strokeStyle='#0B0F14'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle='#6BCB77'; ctx.fillText(`(${k}, 1)`, cs.toX(k)+8, cs.toY(1)-8);
        ctx.font='bold 16px "JetBrains Mono"'; ctx.fillStyle='#F0A830'; ctx.textAlign='right';
        ctx.fillText(`y = ${k}/x`, canvasW()-18, 28);
      }
    }

    function drawPointsDiagram(points, opts={}) {
      const allX=points.map(p=>p.x), allY=points.map(p=>p.y);
      const xR=Math.max(...allX.map(Math.abs))+2;
      const yR=Math.max(...allY.map(Math.abs))+2;
      const cs=drawCoordSystem(xR, yR);
      const colors=['#F0A830','#3DCCC7','#FF6B5E','#6BCB77'];
      // 连线
      if (opts.connect) {
        const isAux = showAuxLines && !opts.alwaysConnect;
        ctx.beginPath();
        points.forEach((p,i) => { i===0 ? ctx.moveTo(cs.toX(p.x),cs.toY(p.y)) : ctx.lineTo(cs.toX(p.x),cs.toY(p.y)); });
        ctx.strokeStyle = isAux ? 'rgba(91,155,213,0.25)' : 'rgba(91,155,213,0.4)';
        ctx.lineWidth=2; ctx.setLineDash([5,3]); ctx.stroke(); ctx.setLineDash([]);
      }
      // 标注
      if (showLabels) {
        if (opts.showDistance && points.length>=2) {
          const p1=points[0], p2=points[1];
          const midX=(p1.x+p2.x)/2, midY=(p1.y+p2.y)/2;
          const dx=p2.x-p1.x, dy=p2.y-p1.y;
          const dist=Math.sqrt(dx*dx+dy*dy);
          ctx.font='bold 14px "JetBrains Mono"'; ctx.fillStyle='#F0A830'; ctx.textAlign='center';
          ctx.fillText(`d=${round(dist,2)}`, cs.toX(midX), cs.toY(midY)-12);
        }
        if (opts.showMidpoint) {
          ctx.beginPath(); ctx.arc(cs.toX(opts.midX), cs.toY(opts.midY), 5, 0, PI*2);
          ctx.fillStyle='#6BCB77'; ctx.fill(); ctx.strokeStyle='#0B0F14'; ctx.lineWidth=2; ctx.stroke();
          ctx.font='bold 13px "JetBrains Mono"'; ctx.fillStyle='#6BCB77'; ctx.textAlign='left';
          ctx.fillText(`M(${opts.midX}, ${opts.midY})`, cs.toX(opts.midX)+8, cs.toY(opts.midY)-8);
        }
      }
      // 点
      points.forEach((p,i) => {
        ctx.beginPath(); ctx.arc(cs.toX(p.x),cs.toY(p.y),6,0,PI*2);
        ctx.fillStyle=colors[i%colors.length]; ctx.fill();
        ctx.strokeStyle='#0B0F14'; ctx.lineWidth=2; ctx.stroke();
        if (showLabels) {
          ctx.font='bold 15px "JetBrains Mono"'; ctx.fillStyle='#E8EDF2'; ctx.textAlign='center';
          ctx.fillText(`${p.label}(${p.x}, ${p.y})`, cs.toX(p.x), cs.toY(p.y)-14);
        }
      });
    }

    function drawBarChartDiagram(data) {
      const w=canvasW(), h=canvasH();
      const pad={t:30,r:30,b:45,l:50};
      const cw=w-pad.l-pad.r, ch=h-pad.t-pad.b;
      const maxVal=Math.max(...data.map(d=>d.value));
      const barW=cw/data.length*0.55, gap=cw/data.length*0.45;
      const colors=['#F0A830','#3DCCC7','#FF6B5E','#6BCB77','#5B9BD5'];

      // 坐标轴
      ctx.strokeStyle='#6B7B8E'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(pad.l,pad.t); ctx.lineTo(pad.l,h-pad.b); ctx.lineTo(w-pad.r,h-pad.b); ctx.stroke();
      // Y轴刻度与网格线
      const ySteps=5;
      ctx.font='11px "JetBrains Mono"'; ctx.fillStyle='#5A6B7E'; ctx.textAlign='right';
      for (let i=0;i<=ySteps;i++) {
        const val=Math.round(maxVal/ySteps*i);
        const y=h-pad.b-(ch/ySteps)*i;
        if (showLabels) ctx.fillText(val, pad.l-8, y+4);
        if (i>0 && showGrid) {
          ctx.strokeStyle='rgba(58,74,94,0.2)'; ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke(); ctx.strokeStyle='#6B7B8E';
        }
      }
      // 柱
      data.forEach((d,i) => {
        const x=pad.l+i*(barW+gap)+gap/2;
        const bh=(d.value/maxVal)*ch;
        const y=h-pad.b-bh;
        ctx.fillStyle=colors[i%colors.length];
        roundRect(ctx, x, y, barW, bh, 4); ctx.fill();
        if (showLabels) {
          ctx.fillStyle='#E8EDF2'; ctx.font='bold 13px "JetBrains Mono"'; ctx.textAlign='center';
          ctx.fillText(d.value, x+barW/2, y-6);
          ctx.fillStyle='#8B9BAE'; ctx.font='12px "Outfit"';
          ctx.fillText(d.label, x+barW/2, h-pad.b+18);
        }
      });
    }

    function drawPieChartDiagram(data) {
      const w=canvasW(), h=canvasH();
      const cx=w/2-60, cy=h/2;
      const radius=Math.min(w,h)*0.3;
      const total=data.reduce((s,d)=>s+d.value,0);
      const colors=['#F0A830','#3DCCC7','#FF6B5E','#6BCB77','#5B9BD5'];
      let start=-PI/2;

      data.forEach((d,i) => {
        const ang=(d.value/total)*PI*2, end=start+ang;
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,radius,start,end); ctx.closePath();
        ctx.fillStyle=colors[i%colors.length]; ctx.fill();
        ctx.strokeStyle='#131922'; ctx.lineWidth=2; ctx.stroke();
        if (showLabels) {
          const mid=start+ang/2;
          const lx=cx+Math.cos(mid)*(radius+28), ly=cy+Math.sin(mid)*(radius+28);
          const pct=Math.round(d.value/total*100);
          ctx.fillStyle='#E8EDF2'; ctx.font='bold 13px "JetBrains Mono"'; ctx.textAlign='center';
          ctx.fillText(`${d.label}`, lx, ly-6);
          ctx.fillStyle=colors[i%colors.length]; ctx.fillText(`${pct}%`, lx, ly+12);
        }
        start=end;
      });
      // 图例
      if (showLabels) {
        const legX=w-110, legY=h/2-data.length*13;
        data.forEach((d,i) => {
          ctx.fillStyle=colors[i%colors.length];
          ctx.fillRect(legX, legY+i*26, 12, 12);
          ctx.fillStyle='#8B9BAE'; ctx.font='12px "Outfit"'; ctx.textAlign='left';
          ctx.fillText(d.label, legX+18, legY+i*26+10);
        });
      }
    }

    function roundRect(ctx,x,y,w,h,r) {
      ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
      ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
    }

    /* ═══════════════════════════════════════════════════════
       UI 交互
       ═══════════════════════════════════════════════════════ */

    const elInput = document.getElementById('problemInput');
    const elParseBtn = document.getElementById('parseBtn');
    const elDiagramTag = document.getElementById('diagramTag');
    const elDiagramDesc = document.getElementById('diagramDesc');
    const elCanvasStatus = document.getElementById('canvasStatus');
    const elCanvasEmpty = document.getElementById('canvasEmpty');
    const elExplanationCard = document.getElementById('explanationCard');
    const elExplanationBody = document.getElementById('explanationBody');
    const elParseResultPanel = document.getElementById('parseResultPanel');
    const elParamPanel = document.getElementById('paramPanel');
    const elHistoryPanel = document.getElementById('historyPanel');
    const elExportBtn = document.getElementById('exportBtn');
    const elCopyBtn = document.getElementById('copyBtn');
    const elPrintBtn = document.getElementById('printBtn');
    const elToast = document.getElementById('toast');
    const elClearBtn = document.getElementById('clearBtn');
    const elCanvasWrap = document.getElementById('canvasWrap');

    let currentResult = null;

    // 示例题目
    const EXAMPLES = {
      triangle: '三角形ABC的三边分别为3、4、5，求面积',
      triangle2: '三角形两边为3和4，夹角90度，求第三边和面积',
      circle: '圆的半径为5，求周长',
      circle2: '圆面积为16π，求半径',
      rectangle: '矩形的长为8，宽为5，求面积',
      trapezoid: '梯形的上底为3，下底为7，高为4，求面积',
      parallelogram: '平行四边形底6高4求面积',
      linear: '一次函数y=2x-3，画出函数图像',
      quadratic: '二次函数y=x²-4x+1，求顶点坐标',
      inverse: '反比例函数y=6/x',
      absolute: '绝对值函数y=|2x-4|',
      distance: '点A(1,2)和点B(4,6)，求两点间距离',
      bar: '条形图：篮球12 足球8 乒乓球15 羽毛球10',
      pie: '扇形图：餐饮40% 交通25% 购物20% 其他15%'
    };

    document.querySelectorAll('.example-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const key = chip.dataset.example;
        elInput.value = EXAMPLES[key];
        elInput.focus();
      });
    });

    elParseBtn.addEventListener('click', handleParse);
    elExportBtn.addEventListener('click', exportImage);
    elCopyBtn.addEventListener('click', copyResult);
    elPrintBtn.addEventListener('click', printResult);
    elClearBtn.addEventListener('click', clearAll);

    // toggle 按钮事件
    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.toggle('active');
        const key = btn.dataset.toggle;
        const active = btn.classList.contains('active');
        if (key === 'labels') showLabels = active;
        if (key === 'grid') showGrid = active;
        if (key === 'aux') showAuxLines = active;
        // 重新绘制当前图形
        if (currentResult && !currentResult.error) {
          clearCanvas();
          currentResult.draw();
        }
      });
    });

    // ─── 历史记录（localStorage 持久化）───
    function loadHistory() {
      try { return JSON.parse(localStorage.getItem('mathHistory') || '[]'); }
      catch { return []; }
    }
    function addHistory(text) {
      let hist = loadHistory().filter(h => h !== text);
      hist.unshift(text);
      hist = hist.slice(0, 5);
      try { localStorage.setItem('mathHistory', JSON.stringify(hist)); } catch {}
      renderHistory();
    }
    function renderHistory() {
      const hist = loadHistory();
      if (hist.length === 0) {
        elHistoryPanel.innerHTML = '<div class="history-empty">暂无历史记录</div>';
        return;
      }
      elHistoryPanel.innerHTML = hist.map((text, i) =>
        `<div class="history-item" data-idx="${i}"><span class="h-icon">▸</span><span class="h-text">${escapeHtml(text)}</span></div>`
      ).join('');
      elHistoryPanel.querySelectorAll('.history-item').forEach(item => {
        item.addEventListener('click', () => {
          const idx = parseInt(item.dataset.idx);
          const list = loadHistory();
          elInput.value = list[idx];
          elInput.focus();
          showToast('已载入历史记录', 'info');
        });
      });
    }
    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ─── 状态切换辅助 ───
    function showEmptyState() {
      elCanvasEmpty.classList.remove('hidden');
      canvas.style.display = '';
      hideError();
    }
    function showErrorState(suggestion) {
      elCanvasEmpty.classList.add('hidden');
      canvas.style.display = 'none';
      hideError();
      const errorEl = document.createElement('div');
      errorEl.className = 'error-card';
      errorEl.id = 'errorCard';
      errorEl.innerHTML = `
        <div class="error-icon">?</div>
        <div class="error-title">无法识别该题目</div>
        <div class="error-suggestion">${escapeHtml(suggestion)}</div>
      `;
      elCanvasWrap.appendChild(errorEl);
    }
    function hideError() {
      const e = document.getElementById('errorCard');
      if (e) e.remove();
    }
    function showResultState() {
      elCanvasEmpty.classList.add('hidden');
      canvas.style.display = '';
      hideError();
    }

    function clearAll() {
      elInput.value = '';
      clearCanvas();
      showEmptyState();
      elDiagramTag.textContent = '等待输入';
      elDiagramDesc.textContent = '';
      elCanvasStatus.textContent = '就绪';
      elExplanationCard.style.display = 'none';
      elParseResultPanel.innerHTML = '<div class="no-data">暂无解析数据</div>';
      elParamPanel.innerHTML = '<div class="no-data">暂无参数</div>';
      elExportBtn.disabled = true;
      elCopyBtn.disabled = true;
      elPrintBtn.disabled = true;
      currentResult = null;
    }

    // ─── 解析主流程（含 loading 动画）───
    function handleParse() {
      const text = elInput.value.trim();
      if (!text) {
        showToast('请输入数学题目', 'error');
        return;
      }
      // 保存历史
      addHistory(text);

      // 显示 loading 动画
      elCanvasStatus.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span> 解析中';
      elParseBtn.disabled = true;

      // 延迟一帧让动画可见
      setTimeout(() => {
        const result = parseProblem(text);
        elParseBtn.disabled = false;

        if (result.error) {
          // 解析失败
          currentResult = null;
          showErrorState(result.suggestion);
          elDiagramTag.textContent = '解析失败';
          elDiagramDesc.textContent = '';
          elCanvasStatus.textContent = '解析失败';
          elExplanationCard.style.display = 'none';
          elParseResultPanel.innerHTML = '<div class="no-data">无法解析此题目</div>';
          elParamPanel.innerHTML = '<div class="no-data">无参数</div>';
          elExportBtn.disabled = true;
          elCopyBtn.disabled = true;
          elPrintBtn.disabled = true;
          showToast('未能识别题目类型', 'error');
          return;
        }

        // 解析成功
        currentResult = result;
        showResultState();
        clearCanvas();
        result.draw();

        elDiagramTag.textContent = result.typeLabel;
        elDiagramDesc.textContent = result.question;
        elCanvasStatus.textContent = '已生成';

        // 解析结果面板
        elParseResultPanel.innerHTML = `
          <div class="param-row"><span class="param-label">题目类型</span><span class="param-value">${result.typeLabel}</span></div>
          <div class="param-row"><span class="param-label">识别问题</span><span class="param-value" style="font-size:12px;">${escapeHtml(result.question)}</span></div>
          ${result.answer ? `<div class="param-row"><span class="param-label">计算结果</span><span class="param-value" style="color:var(--green);">${escapeHtml(result.answer)}</span></div>` : ''}
        `;

        // 参数面板
        let paramHTML = '';
        for (const [key, val] of Object.entries(result.params)) {
          let display;
          if (typeof val === 'object' && val !== null) {
            if (val.label !== undefined && val.x !== undefined) {
              display = `${val.label}(${val.x}, ${val.y})`;
            } else if (Array.isArray(val)) {
              display = val.map(d => d.label !== undefined ? `${d.label}=${d.value}` : String(d)).join(', ');
            } else {
              display = JSON.stringify(val);
            }
          } else {
            display = val;
          }
          paramHTML += `<div class="param-row"><span class="param-label">${escapeHtml(String(key))}</span><span class="param-value">${escapeHtml(String(display))}</span></div>`;
        }
        elParamPanel.innerHTML = paramHTML || '<div class="no-data">无参数</div>';

        // 讲解面板
        elExplanationBody.innerHTML = result.explanation;
        elExplanationCard.style.display = 'block';

        // 启用按钮
        elExportBtn.disabled = false;
        elCopyBtn.disabled = false;
        elPrintBtn.disabled = false;

        // 动画
        const card = document.getElementById('canvasCard');
        card.style.animation = 'none';
        card.offsetHeight;
        card.style.animation = 'fadeInUp 0.4s ease-out';

        showToast('图形已生成', 'success');
      }, 420);
    }

    // ─── 导出图片（底部含解题步骤摘要）───
    function stripHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
    }

    function wrapText(c, text, x, y, maxWidth, lineHeight) {
      const chars = text.split('');
      let line = '';
      let yy = y;
      for (const ch of chars) {
        const test = line + ch;
        if (c.measureText(test).width > maxWidth && line) {
          c.fillText(line, x, yy);
          line = ch;
          yy += lineHeight;
        } else {
          line = test;
        }
      }
      if (line) c.fillText(line, x, yy);
      return yy;
    }

    function exportImage() {
      if (!currentResult || currentResult.error) return;
      const stepsText = stripHtml(currentResult.explanation);
      const exp = document.createElement('canvas');
      exp.width = 660;
      exp.height = 760;
      const ex = exp.getContext('2d');

      // 背景
      ex.fillStyle = '#131922'; ex.fillRect(0, 0, exp.width, exp.height);
      // 标题
      ex.fillStyle = '#F0A830'; ex.font = 'bold 18px "Outfit", sans-serif'; ex.textAlign = 'center';
      ex.fillText(`数图助手 · ${currentResult.typeLabel}`, exp.width/2, 32);
      ex.fillStyle = '#8B9BAE'; ex.font = '13px "Outfit", sans-serif';
      ex.fillText(currentResult.question, exp.width/2, 54);
      // 图形（保持Canvas逻辑宽高比，居中绘制）
      const drawW = 640, drawH = 400;
      const srcW = canvasW(), srcH = canvasH();
      const scale = Math.min(drawW / srcW, drawH / srcH);
      const dw = srcW * scale, dh = srcH * scale;
      const dx = 10 + (drawW - dw) / 2, dy = 70 + (drawH - dh) / 2;
      ex.drawImage(canvas, dx, dy, dw, dh);
      // 答案
      let y = 494;
      if (currentResult.answer) {
        ex.fillStyle = '#6BCB77'; ex.font = 'bold 16px "JetBrains Mono", monospace';
        ex.textAlign = 'center';
        ex.fillText(`结果：${currentResult.answer}`, exp.width/2, y);
        y += 26;
      }
      // 解题步骤标题
      ex.fillStyle = '#3DCCC7'; ex.font = 'bold 13px "Outfit", sans-serif'; ex.textAlign = 'left';
      ex.fillText('解题步骤：', 20, y);
      y += 22;
      // 步骤正文
      ex.fillStyle = '#8B9BAE'; ex.font = '12px "Outfit", sans-serif';
      y = wrapText(ex, stepsText, 20, y, exp.width - 40, 18);
      // 底部水印
      ex.fillStyle = '#5A6B7E'; ex.font = '10px "Outfit", sans-serif'; ex.textAlign = 'center';
      ex.fillText('数图助手 · TRAE AI 创造力大赛', exp.width/2, exp.height - 12);

      const link = document.createElement('a');
      link.download = `math-diagram-${Date.now()}.png`;
      link.href = exp.toDataURL('image/png');
      link.click();
      showToast('图片已导出', 'success');
    }

    function copyResult() {
      if (!currentResult || currentResult.error) return;
      const text = `【${currentResult.typeLabel}】${currentResult.question}\n参数：${JSON.stringify(currentResult.params)}\n${currentResult.answer ? '答案：' + currentResult.answer : ''}`;
      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制到剪贴板', 'info');
      }).catch(() => {
        showToast('复制失败', 'error');
      });
    }

    // ─── 打印 ───
    function printResult() {
      if (!currentResult || currentResult.error) return;
      window.print();
    }

    function showToast(msg, type='') {
      elToast.textContent = msg;
      elToast.className = `toast show ${type}`;
      setTimeout(() => elToast.classList.remove('show'), 2500);
    }

    // ─── 响应式：Canvas 尺寸自适应 ───
    function resizeCanvas() {
      const availW = elCanvasWrap.clientWidth - 48; // padding 24*2
      const targetW = Math.min(640, Math.max(300, availW));
      const targetH = Math.round(targetW * 400 / 640);
      const dpr = window.devicePixelRatio || 1;
      if (canvas.width !== targetW * dpr || canvas.height !== targetH * dpr) {
        canvas.width = targetW * dpr;
        canvas.height = targetH * dpr;
        canvas.style.width = targetW + 'px';
        canvas.style.height = targetH + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      if (currentResult && !currentResult.error) {
        clearCanvas();
        currentResult.draw();
      }
    }
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resizeCanvas, 150);
    });

    // ─── 键盘快捷键 ───
    document.addEventListener('keydown', (e) => {
      // Ctrl+Enter 生成
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        handleParse();
      }
      // Ctrl+E 导出
      else if ((e.key === 'e' || e.key === 'E') && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        if (currentResult && !currentResult.error) exportImage();
      }
      // Escape 清空
      else if (e.key === 'Escape') {
        clearAll();
      }
    });

    // ─── 初始化 ───
    renderHistory();
    resizeCanvas();
  </script>
</body>
