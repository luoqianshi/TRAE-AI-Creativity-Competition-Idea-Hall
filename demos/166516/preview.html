<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI捧逗·万象伴声 | 相声捧哏Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #1a1a2e;
            color: #fff;
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #444;
            padding-bottom: 20px;
        }
        .header h1 {
            font-size: 28px;
            color: #ffd700;
        }
        .header p {
            margin-top: 8px;
            color: #aaa;
        }
        .box {
            background: #16213e;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .tip {
            color: #ffb74d;
            margin-bottom: 12px;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: #0f3460;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 16px;
            resize: none;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin: 16px 0;
        }
        button {
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }
        #send {
            background: #ffd700;
            color: #000;
            font-weight: bold;
        }
        .style-btn {
            background: #3498db;
            color: white;
        }
        .style-btn.active {
            background: #2980b9;
            box-shadow: 0 0 0 2px #ffd700;
        }
        .result-title {
            margin: 15px 0 8px;
            color: #9cf;
        }
        #result {
            min-height: 80px;
            background: #0f3460;
            padding: 14px;
            border-radius: 8px;
            line-height: 1.6;
            font-size: 16px;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI捧逗·万象伴声 AI Banter Companion</h1>
        <p>游戏直播实时相声捧哏 | 交互式AI陪伴Demo</p>
    </div>

    <div class="box">
        <div class="tip">输入你的操作/吐槽/直播发言（逗哏内容）</div>
        <textarea id="userInput" placeholder="例：这波五杀直接乱杀！/哎呀又被偷袭翻车了"></textarea>

        <div class="btn-group">
            <button class="style-btn active" data-type="praise">高光夸赞</button>
            <button class="style-btn" data-type="joke">翻车调侃</button>
            <button class="style-btn" data-type="normal">日常搭茬</button>
            <button id="send">生成AI捧哏</button>
        </div>

        <div class="result-title>AI捧哏回复：</div>
        <div id="result"></div>
    </div>

    <div class="footer">
        TREA AI创作大赛参赛作品 · 单页可直接离线运行
    </div>

    <script>
        let currentType = "praise";
        const btns = document.querySelectorAll(".style-btn");
        const resBox = document.getElementById("result");
        const input = document.getElementById("userInput");

        // 切换风格
        btns.forEach(btn => {
            btn.onclick = () => {
                btns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentType = btn.dataset.type;
            }
        })

        // 捧哏话术库
        const replyLib = {
            praise: [
                "嚯！这手操作真是炉火纯青，太见功力了！",
                "好家伙，就这一手，全场直接看呆了！",
                "可以可以，功底扎实，这波属实秀住了！",
                "真有你的，这波发挥直接封神！",
                "您这思路太通透，旁人可比不了！"
            ],
            joke: [
                "嗐，这一下属实有点出乎意料啊哈哈",
                "嗨，谁还没个马失前蹄的时候，不丢人！",
                "好家伙这波属于是战术性失误是吧？",
                "别着急别着急，咱缓一缓重整旗鼓！",
                "哎呀这一下给我都看懵咯"
            ],
            normal: [
                "可不是嘛，确实是这么个道理",
                "没错没错，接着往下唠",
                "这话在理，我跟着您一块儿看着呢",
                "确实如此，咱慢慢玩不着急",
                "您接着说，我这儿给您搭着茬儿"
            ]
        }

        // 随机抽取捧哏文案
        document.getElementById("send").onclick = () => {
            const text = input.value.trim();
            if (!text) {
                resBox.innerText = "请先输入逗哏台词再生成~";
                return;
            }
            const list = replyLib[currentType];
            const randomTxt = list[Math.floor(Math.random() * list.length)];
            resBox.innerText = randomTxt;
        }
    </script>
</body>
</html>
