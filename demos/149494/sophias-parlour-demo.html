<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心灵对话 · 智者的客厅</title>
  <meta name="description" content="与古今中外的心理学家、哲学家对话，让疗愈有据可循。" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@400;500&family=Noto+Serif+SC:wght@400;500;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">

  <style>/* ============= Design Tokens ============= */
:root {
  /* Paper / 纸张色 */
  --paper: #F2EAD7;
  --paper-deep: #E8DCC1;
  --paper-soft: #F8F1DF;
  --paper-vellum: #EFE3C7;

  /* Ink / 墨色 */
  --ink: #1F1A14;
  --ink-soft: #3A2E22;
  --ink-light: #6B5C4D;
  --ink-faint: #998A75;

  /* Gold / 烫金 */
  --gold: #A88B5C;
  --gold-deep: #6E4F2C;
  --gold-light: #C9AB7E;
  --gold-soft: rgba(168, 139, 92, 0.12);

  /* Accent */
  --vermillion: #8C2E2E;
  --vermillion-soft: rgba(140, 46, 46, 0.08);
  --sage: #4A5D4E;
  --sage-soft: rgba(74, 93, 78, 0.08);
  --indigo: #2C3A5A;

  /* Border */
  --line: rgba(110, 79, 44, 0.28);
  --line-soft: rgba(110, 79, 44, 0.14);

  /* Shadow */
  --shadow-soft: 0 4px 24px rgba(58, 46, 34, 0.08);
  --shadow-deep: 0 12px 36px rgba(58, 46, 34, 0.16);

  /* Type */
  --font-display: 'Cormorant Garamond', 'Noto Serif SC', serif;
  --font-body: 'EB Garamond', 'Noto Serif SC', serif;
  --font-cn: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
  --font-hand: 'Caveat', 'Ma Shan Zheng', cursive;

  /* Layout */
  --pad-x: clamp(24px, 6vw, 120px);
  --pad-y: clamp(24px, 4vw, 64px);
  --max-w: 1280px;
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;
}

/* ============= Reset & Base ============= */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  height: 100%;
}

body {
  font-family: var(--font-cn);
  color: var(--ink);
  background: var(--paper);
  background-image:
    radial-gradient(circle at 18% 24%, rgba(168, 139, 92, 0.10), transparent 40%),
    radial-gradient(circle at 82% 76%, rgba(140, 46, 46, 0.06), transparent 45%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18 0 0 0 0 0.12 0 0 0 0 0.06 0 0 0 0.08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  font-size: 16px;
  line-height: 1.7;
  letter-spacing: 0.02em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button {
  font-family: inherit;
  color: inherit;
  background: transparent;
  border: none;
  cursor: pointer;
  letter-spacing: inherit;
}

input,
textarea {
  font-family: inherit;
  color: inherit;
  background: transparent;
  border: none;
  outline: none;
}

a {
  color: var(--vermillion);
  text-decoration: none;
  border-bottom: 1px solid currentColor;
  transition: opacity 0.2s ease;
}
a:hover { opacity: 0.7; }

img, svg { display: block; max-width: 100%; }

::selection {
  background: var(--gold-soft);
  color: var(--ink);
}

/* ============= Typography ============= */
.display {
  font-family: var(--font-display);
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--ink);
}

.cn-title {
  font-family: var(--font-cn);
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--ink);
}

.cn-body {
  font-family: var(--font-cn);
  font-weight: 400;
  color: var(--ink-soft);
  letter-spacing: 0.04em;
  line-height: 1.85;
}

.hand {
  font-family: var(--font-hand);
  font-weight: 400;
  letter-spacing: 0.01em;
}

.italic-display {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 400;
  letter-spacing: 0.04em;
  color: var(--ink-soft);
}

.eyebrow {
  font-family: var(--font-display);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.4em;
  color: var(--gold-deep);
  font-weight: 500;
}

.divider {
  display: flex;
  align-items: center;
  gap: 16px;
  color: var(--gold);
  margin: 16px 0;
}
.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line), transparent);
}
.divider__mark {
  font-family: var(--font-display);
  color: var(--gold-deep);
  font-size: 14px;
  letter-spacing: 0.4em;
}

/* ============= Layout ============= */
.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.container {
  width: 100%;
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 var(--pad-x);
}

/* ============= Top Nav ============= */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(242, 234, 215, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line-soft);
}

.topbar__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px var(--pad-x);
  max-width: var(--max-w);
  margin: 0 auto;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 14px;
  cursor: pointer;
}

.brand__mark {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--ink);
}

.brand__mark--gold {
  color: var(--gold-deep);
  font-style: italic;
  font-size: 22px;
}

.brand__sub {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-light);
  letter-spacing: 0.16em;
}

.nav {
  display: flex;
  gap: 6px;
  align-items: center;
}

.nav__btn {
  font-family: var(--font-cn);
  font-size: 14px;
  letter-spacing: 0.16em;
  color: var(--ink-soft);
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  position: relative;
  transition: color 0.2s ease;
}

.nav__btn:hover { color: var(--gold-deep); }

.nav__btn.is-active { color: var(--gold-deep); }

.nav__btn.is-active::after {
  content: '';
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 2px;
  height: 1px;
  background: var(--gold);
}

.date-pill {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-light);
  letter-spacing: 0.16em;
  padding: 4px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
}

/* ============= Footer ============= */
.footer {
  margin-top: auto;
  padding: 48px var(--pad-x) 32px;
  border-top: 1px solid var(--line-soft);
  text-align: center;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 12px;
  letter-spacing: 0.32em;
  color: var(--ink-faint);
  text-transform: uppercase;
}

.footer__ornament {
  display: inline-block;
  margin: 0 12px;
  color: var(--gold);
}

/* ============= HOME ============= */
.home {
  padding: var(--pad-y) 0 96px;
}

.home__hero {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 72px;
  align-items: center;
  min-height: 76vh;
}

.home__left {
  position: relative;
  padding-right: 24px;
}

.home__eyebrow {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 32px;
  opacity: 0;
  animation: fadeUp 0.8s 0.1s ease-out forwards;
}

.home__eyebrow-line {
  width: 56px;
  height: 1px;
  background: var(--gold);
}

.home__title {
  font-family: var(--font-cn);
  font-size: clamp(48px, 7vw, 88px);
  font-weight: 700;
  letter-spacing: 0.18em;
  line-height: 1.1;
  color: var(--ink);
  margin-bottom: 18px;
  opacity: 0;
  animation: fadeUp 1s 0.25s ease-out forwards;
}

.home__title-en {
  font-family: var(--font-display);
  font-style: italic;
  font-size: clamp(20px, 2.4vw, 32px);
  font-weight: 400;
  letter-spacing: 0.24em;
  color: var(--gold-deep);
  margin-bottom: 40px;
  opacity: 0;
  animation: fadeUp 0.9s 0.4s ease-out forwards;
}

.home__lede {
  font-family: var(--font-cn);
  font-size: 17px;
  line-height: 2;
  color: var(--ink-soft);
  max-width: 520px;
  margin-bottom: 40px;
  letter-spacing: 0.06em;
  opacity: 0;
  animation: fadeUp 0.9s 0.55s ease-out forwards;
}

.home__lede::first-letter {
  font-family: var(--font-display);
  font-size: 56px;
  float: left;
  line-height: 0.9;
  padding: 8px 12px 0 0;
  color: var(--gold-deep);
  font-weight: 500;
}

.home__preface {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 14px;
  color: var(--ink-light);
  letter-spacing: 0.2em;
  padding: 16px 0 0;
  border-top: 1px solid var(--line-soft);
  max-width: 480px;
  margin-bottom: 40px;
  opacity: 0;
  animation: fadeUp 0.9s 0.7s ease-out forwards;
}

.home__actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 520px;
  opacity: 0;
  animation: fadeUp 0.9s 0.85s ease-out forwards;
}

/* ============= Action Button ============= */
.action {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 18px 22px;
  border: 1px solid var(--line);
  background: rgba(248, 241, 223, 0.5);
  text-align: left;
  position: relative;
  transition: all 0.3s ease;
  cursor: pointer;
  overflow: hidden;
}

.action::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--gold);
  transform: scaleY(0);
  transform-origin: center;
  transition: transform 0.3s ease;
}

.action:hover {
  background: rgba(248, 241, 223, 0.9);
  border-color: var(--gold);
  transform: translateX(2px);
}

.action:hover::before { transform: scaleY(1); }

.action__num {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 28px;
  color: var(--gold);
  width: 44px;
  flex-shrink: 0;
  text-align: center;
}

.action__text {
  flex: 1;
}

.action__title {
  font-family: var(--font-cn);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.18em;
  color: var(--ink);
  margin-bottom: 4px;
}

.action__desc {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-light);
  letter-spacing: 0.1em;
}

.action__arrow {
  font-family: var(--font-display);
  color: var(--gold-deep);
  font-size: 18px;
  transition: transform 0.3s ease;
}

.action:hover .action__arrow { transform: translateX(6px); }

/* ============= Daily Card ============= */
.home__right {
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  animation: fadeUp 1.1s 0.6s ease-out forwards;
}

.healing-card {
  width: 100%;
  max-width: 380px;
  aspect-ratio: 0.73;
  perspective: 1500px;
  position: relative;
}

.healing-card__inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}

.healing-card.is-flipped .healing-card__inner {
  transform: rotateY(180deg);
}

.healing-card__face {
  position: absolute;
  inset: 0;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  background: var(--paper-soft);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-deep);
  padding: 40px 32px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.healing-card__face::before {
  content: '';
  position: absolute;
  inset: 8px;
  border: 1px solid var(--line-soft);
  pointer-events: none;
}

.healing-card__face::after {
  content: '';
  position: absolute;
  inset: 16px;
  border: 1px dashed var(--line-soft);
  pointer-events: none;
}

.healing-card__back {
  transform: rotateY(180deg);
  background: var(--paper-vellum);
}

.healing-card__head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 11px;
  letter-spacing: 0.32em;
  color: var(--gold-deep);
  text-transform: uppercase;
  margin-bottom: 28px;
  position: relative;
  z-index: 1;
}

.healing-card__seal {
  width: 36px;
  height: 36px;
  border: 1px solid var(--vermillion);
  color: var(--vermillion);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-cn);
  font-size: 18px;
  font-weight: 700;
  background: var(--vermillion-soft);
  position: absolute;
  top: 8px;
  right: 8px;
}

.healing-card__quote {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
  position: relative;
  z-index: 1;
  padding: 0 12px;
}

.healing-card__quote-mark {
  font-family: var(--font-display);
  font-size: 80px;
  color: var(--gold);
  line-height: 0.4;
  font-weight: 500;
  margin-bottom: 24px;
  opacity: 0.4;
}

.healing-card__quote-text {
  font-family: var(--font-cn);
  font-size: 22px;
  font-weight: 600;
  line-height: 1.7;
  color: var(--ink);
  letter-spacing: 0.08em;
  margin-bottom: 28px;
}

.healing-card__title-en {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 14px;
  color: var(--gold-deep);
  letter-spacing: 0.24em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.healing-card__mentor {
  font-family: var(--font-cn);
  font-size: 14px;
  color: var(--ink-soft);
  letter-spacing: 0.2em;
}

.healing-card__foot {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  position: relative;
  z-index: 1;
  padding-top: 20px;
  border-top: 1px solid var(--line-soft);
}

.healing-card__date {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-light);
  letter-spacing: 0.16em;
}

.healing-card__cta {
  font-family: var(--font-cn);
  font-size: 12px;
  letter-spacing: 0.24em;
  color: var(--gold-deep);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: gap 0.3s ease;
}

.healing-card__inner:hover .healing-card__cta {
  gap: 10px;
}

/* Back face */
.healing-card__back-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  z-index: 1;
  padding: 8px;
}

.healing-card__back-label {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 11px;
  letter-spacing: 0.4em;
  color: var(--gold-deep);
  text-transform: uppercase;
  margin-bottom: 14px;
}

.healing-card__back-work {
  font-family: var(--font-cn);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.16em;
  color: var(--ink);
  margin-bottom: 8px;
}

.healing-card__back-chapter {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-light);
  letter-spacing: 0.2em;
  margin-bottom: 20px;
}

.healing-card__back-original {
  font-family: var(--font-cn);
  font-size: 14px;
  line-height: 1.9;
  color: var(--ink-soft);
  letter-spacing: 0.04em;
  padding: 16px;
  background: rgba(168, 139, 92, 0.06);
  border-left: 2px solid var(--gold);
  margin-bottom: 20px;
  position: relative;
}

.healing-card__back-pub {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-light);
  letter-spacing: 0.16em;
  text-align: right;
}

.healing-card__flip-hint {
  position: absolute;
  bottom: -36px;
  left: 0;
  right: 0;
  text-align: center;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-faint);
  letter-spacing: 0.24em;
}

/* ============= Mentor Picker ============= */
.mentor-picker {
  background: var(--paper-deep);
  border: 1px solid var(--line);
  padding: 28px 32px;
  margin-bottom: 32px;
}

.mentor-picker__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.mentor-picker__title {
  font-family: var(--font-cn);
  font-size: 14px;
  letter-spacing: 0.32em;
  color: var(--gold-deep);
  text-transform: uppercase;
  font-weight: 500;
}

.mentor-picker__desc {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-light);
  letter-spacing: 0.16em;
}

.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line-soft);
}

.tab {
  padding: 12px 20px;
  font-family: var(--font-cn);
  font-size: 14px;
  letter-spacing: 0.18em;
  color: var(--ink-light);
  position: relative;
  transition: color 0.2s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}

.tab__count {
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--gold);
  font-style: italic;
}

.tab.is-active {
  color: var(--ink);
}

.tab.is-active::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: var(--gold);
}

.tab:hover { color: var(--ink); }

.mentor-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
}

.mentor-card {
  position: relative;
  padding: 18px 14px 16px;
  background: var(--paper-soft);
  border: 1px solid var(--line-soft);
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
}

.mentor-card:hover {
  border-color: var(--gold);
  background: var(--paper);
  transform: translateY(-2px);
}

.mentor-card.is-selected {
  border-color: var(--gold-deep);
  background: var(--paper);
  box-shadow: inset 3px 0 0 var(--gold);
}

.mentor-card.is-selected .mentor-card__name {
  color: var(--gold-deep);
}

.mentor-avatar {
  width: 56px;
  height: 56px;
  margin: 0 auto 12px;
  border-radius: 50%;
  background: var(--paper);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-cn);
  font-size: 22px;
  font-weight: 600;
  color: var(--ink-soft);
  position: relative;
}

.mentor-avatar::after {
  content: '';
  position: absolute;
  inset: -4px;
  border: 1px solid var(--line-soft);
  border-radius: 50%;
  pointer-events: none;
}

.mentor-card__name {
  font-family: var(--font-cn);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.1em;
  color: var(--ink);
  margin-bottom: 2px;
}

.mentor-card__en {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 11px;
  color: var(--gold-deep);
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

.mentor-card__school {
  font-family: var(--font-cn);
  font-size: 12px;
  color: var(--ink-light);
  letter-spacing: 0.12em;
}

.mentor-card__era {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 10px;
  color: var(--ink-faint);
  letter-spacing: 0.12em;
  margin-top: 4px;
}

/* ============= Chat ============= */
.chat {
  padding: var(--pad-y) 0 96px;
  min-height: 100vh;
}

.chat__layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 32px;
  align-items: start;
}

.chat__sidebar {
  position: sticky;
  top: 100px;
  max-height: calc(100vh - 120px);

  padding-right: 8px;
}

.chat__sidebar::-webkit-scrollbar { width: 4px; }
.chat__sidebar::-webkit-scrollbar-thumb { background: var(--line); }

.chat__main {
  background: var(--paper-soft);
  border: 1px solid var(--line);

  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-soft);
}

.chat__head {
  padding: 24px 32px;
  border-bottom: 1px solid var(--line-soft);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--paper-vellum);
}

.chat__head-info {
  display: flex;
  align-items: center;
  gap: 16px;
}

.chat__head-title {
  font-family: var(--font-cn);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.16em;
  color: var(--ink);
  margin-bottom: 2px;
}

.chat__head-sub {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-light);
  letter-spacing: 0.16em;
}

.chat__mode-toggle {
  display: flex;
  gap: 4px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 2px;
  background: var(--paper);
}

.chat__mode-btn {
  padding: 6px 14px;
  font-family: var(--font-cn);
  font-size: 12px;
  letter-spacing: 0.18em;
  color: var(--ink-light);
  transition: all 0.2s ease;
}

.chat__mode-btn.is-active {
  background: var(--ink);
  color: var(--paper);
}

.chat__flow {
  flex: 1;
  padding: 32px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 24px;
  min-height: 50vh;
  max-height: 60vh;
}

.chat__flow::-webkit-scrollbar { width: 6px; }
.chat__flow::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.bubble {
  display: flex;
  gap: 14px;
  max-width: 80%;
  animation: fadeUp 0.5s ease-out;
}

.bubble--user {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.bubble--mentor {
  align-self: flex-start;
}

.bubble__avatar {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--paper);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-cn);
  font-size: 16px;
  font-weight: 600;
  color: var(--ink-soft);
}

.bubble__body {
  position: relative;
  padding: 16px 20px;
  border: 1px solid var(--line-soft);
  background: var(--paper);
}

.bubble--user .bubble__body {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

.bubble--mentor .bubble__body {
  background: var(--paper);
  border-color: var(--line);
}

.bubble__body::after {
  content: '';
  position: absolute;
  top: 14px;
  width: 8px;
  height: 8px;
  background: inherit;
  border: inherit;
  border-width: 0 0 1px 1px;
  transform: rotate(45deg);
}

.bubble--mentor .bubble__body::after {
  left: -5px;
  border-color: var(--line) transparent transparent var(--line);
  background: var(--paper);
}

.bubble--user .bubble__body::after {
  right: -5px;
  border-color: transparent var(--ink) var(--ink) transparent;
  background: var(--ink);
}

.bubble__meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;

.bubble__school {

  letter-spacing: 0.18em;
}

.bubble__text {

  letter-spacing: 0.04em;
}

.bubble__signature {
  font-family: var(--font-hand);
  font-size: 18px;

  text-align: right;
  margin-top: 8px;
  letter-spacing: 0.04em;
}

.bubble--user .bubble__signature {

  font-style: italic;

}

.bubble__typing {
  display: inline-flex;
  gap: 4px;
  padding: 4px 0;
}
.bubble__typing-dot {
  width: 5px;
  height: 5px;
  background: var(--gold);
  border-radius: 50%;

}
.bubble__typing-dot:nth-child(2) { animation-delay: 0.2s; }

.chat__input {

}

.chips {

  flex-wrap: wrap;
  margin-bottom: 16px;
}

.chip {

  font-size: 12px;

  cursor: pointer;
}

.chip:hover {
  border-color: var(--gold);

}

.chip.is-active {

  background: var(--gold-soft);
}

.chat__textarea {

.chat__textarea-field {

}

.btn {

  font-size: 13px;

.btn:hover {
  background: var(--gold-deep);

}

}

.btn--ghost {
  background: transparent;
  color: var(--ink);
}

.btn--ghost:hover {
  background: var(--ink);
  color: var(--paper);
}

/* ============= Empty / Hint ============= */
.empty {

.card-mini__source {

/* ============= Modal ============= */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(31, 26, 20, 0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 24px;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.modal.is-open {
  display: flex;
  opacity: 1;
}

.modal__dialog {
  background: var(--paper);
  border: 1px solid var(--line);

  box-shadow: var(--shadow-deep);
  max-height: 85vh;
  overflow-y: auto;
  transform: scale(0.96);
  transition: transform 0.3s ease;
}

.modal.is-open .modal__dialog {
  transform: scale(1);
}

.modal__close {
  position: absolute;
  top: 16px;
  right: 16px;
  font-family: var(--font-display);

  align-items: center;

}

.modal__close:hover { color: var(--vermillion); }

.modal__eyebrow {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 12px;
  letter-spacing: 0.4em;
  color: var(--gold-deep);
  text-transform: uppercase;
  margin-bottom: 16px;
}

.modal__title {
  font-family: var(--font-cn);
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 0.16em;
  color: var(--ink);
  margin-bottom: 24px;
}

.modal__quote {
  font-family: var(--font-cn);
  font-size: 18px;
  line-height: 2;
  color: var(--ink-soft);
  letter-spacing: 0.06em;
  padding: 20px 0;
  border-top: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
  margin-bottom: 24px;

}

.modal__quote::before {
  content: '「';
  position: absolute;
  left: -8px;

}

.modal__quote::after {

.modal__source-label {

.modal__mentor-card {

}

.recommender-wrap {

/* ============= Animations ============= */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes typing {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-4px); opacity: 1; }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }

}

}

}

}

    filter: blur(2px);
  }
  to {
    opacity: 1;
    filter: blur(0);
  }
}

@keyframes stamp {
  0% { transform: scale(1.6) rotate(-12deg); opacity: 0; }
  60% { transform: scale(0.94) rotate(-3deg); opacity: 1; }
  100% { transform: scale(1) rotate(-6deg); opacity: 1; }
}

.fade-in { animation: fadeIn 0.6s ease-out; }
.fade-up { animation: fadeUp 0.6s ease-out; }

// 工具函数

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function escapeHTML(str = '') {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatDate(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}年${m}月${day}日`;
}

function formatDateEn(d = new Date()) {
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  return `${String(d.getDate()).padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function formatISODate(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}

// 简单的字符串 hash
function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = (hash << 5) - hash + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

// 根据日期获取稳定的"今日疗愈卡"索引
function todayCardIndex(totalCards, date = new Date()) {
  return hashCode(formatISODate(date)) % totalCards;
}

// 字符 n-gram 切分（中文按 2-gram + 单词按 1-gram）
function ngram(text) {
  const tokens = [];
  const clean = String(text).toLowerCase().replace(/\s+/g, '');
  for (let i = 0; i < clean.length - 1; i++) {
    tokens.push(clean.slice(i, i + 2));
  }
  for (let i = 0; i < clean.length; i++) {
    tokens.push(clean[i]);
  }
  // 英文单词
  String(text).split(/\s+/).forEach((w) => {
    if (w.length > 1) tokens.push(w.toLowerCase());
  });
  return tokens;
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function debounce(fn, ms = 200) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

function scrollIntoViewSmooth(el) {
  if (el && el.scrollIntoView) {
    el.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
}

// 打字机效果
function typewrite(el, text, speed = 32) {
  return new Promise((resolve) => {
    el.textContent = '';
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'bubble__cursor';
    cursor.textContent = '▍';
    cursor.style.cssText = 'display:inline-block;color:var(--gold);margin-left:2px;animation:typing 1s infinite';
    el.appendChild(cursor);
    const tick = () => {
      if (i < text.length) {
        el.insertBefore(document.createTextNode(text[i]), cursor);
        i++;
        setTimeout(tick, speed);
      } else {
        setTimeout(() => {
          if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
          resolve();
        }, 600);
      }
    };
    tick();
  });
}

function extractTags(text) {
  const tagScores = {};
  for (const [keyword, tags] of Object.entries(KEYWORD_TAGS)) {
    if (text.includes(keyword)) {
      for (const t of tags) {
        tagScores[t] = (tagScores[t] || 0) + 1;
      }
    }
  }
  return tagScores;
}

// Jaccard 相似度
function jaccard(setA, setB) {
  if (!setA.length || !setB.length) return 0;
  const a = new Set(setA);
  const b = new Set(setB);
  let inter = 0;
  a.forEach((x) => { if (b.has(x)) inter++; });
  const union = a.size + b.size - inter;
  return union === 0 ? 0 : inter / union;
}

function recommendMentors(text, topN = 3) {
  if (!text || !text.trim()) return [];
  const tagScores = extractTags(text);
  if (!Object.keys(tagScores).length) {
    // 没有命中标签：返回多样性最强的 3 位
    const picks = ['freud', 'nietzsche', 'laozi'];
    return picks.map((id) => MENTORS.find((m) => m.id === id)).filter(Boolean);
  }
  const hitTags = Object.keys(tagScores);

  const scored = MENTORS.map((m) => {
    const matched = m.tags.filter((t) => hitTags.includes(t));
    return {
      mentor: m,
      score: jaccard(hitTags, m.tags) * 2 + matched.length * 0.5,
      matched,
    };
  });

  scored.sort((a, b) => b.score - a.score);

  return scored
    .filter((s) => s.matched.length > 0)
    .slice(0, topN)
    .map((s) => ({
      ...s.mentor,
      matchedTags: s.matched,
      reason: buildReason(s.matched, s.mentor),
    }));
}

function buildReason(matchedTags, mentor) {
  const cn = {
    '焦虑': '焦虑议题', '内耗': '精神内耗', '原生家庭': '原生家庭',
    '童年': '童年经历', '关系': '关系课题', '爱': '爱与依恋',
    '孤独': '存在的孤独', '死亡': '死亡焦虑', '自由': '自由与选择',
    '意义': '意义追寻', '虚无': '虚无与荒诞', '自卑': '自卑与超越',
    '勇气': '行动勇气', '工作': '职业身份', '中年': '中年转化',
    '压抑': '压抑与释放', '欲望': '欲望真相', '梦': '梦的解析',
    '痛苦': '受苦的尊严', '自我': '自我认识', '放下': '放下与释然',
    '行动': '知行合一', '成长': '自我成长', '知识': '认识论',
  };
  const readable = matchedTags.slice(0, 2).map((t) => cn[t] || t).join(' · ');
  const styles = {
    'challenge': '会直率质询，逼你直面核心',
    'dialogue': '会与你同行，在场倾听',
    'intervention': '会给出明确介入方向',
  };
  const style = styles[mentor.roundtableStyle] || '会以独特视角回应';
  return `命中「${readable}」——${mentor.name}${style}。`;
}


// 对话生成引擎


function detectTags(text) {
  const hits = [];
  for (const [keyword, tags] of Object.entries(KEYWORD_TAGS)) {
    if (text.includes(keyword)) {
      tags.forEach((t) => { if (!hits.includes(t)) hits.push(t); });
    }
  }
  return hits;
}

function fillTemplate(tpl, userText) {
  return tpl
    .replace(/\{userConcern\}/g, '“' + userText.slice(0, 60) + (userText.length > 60 ? '…' : '') + '”')
    .replace(/\{user\}/g, '你');
}

function generateReply(mentor, userText) {
  const tags = detectTags(userText);
  // 优先用命中 tag 的模板
  for (const t of tags) {
    if (mentor.replyTemplates[t] && mentor.replyTemplates[t].length) {
      return fillTemplate(pick(mentor.replyTemplates[t]), userText);
    }
  }
  return fillTemplate(pick(mentor.replyTemplates.default || ['让我们继续。']), userText);
}

function generateGreeting(mentor) {
  return pick(mentor.greetings).replace(/\{userConcern\}/g, '眼前这件事');
}

// 多位导师依次回应：按 roundtableStyle 微调语气
function generateRoundtable(mentors, userText) {
  return mentors.map((mentor) => {
    let base = generateReply(mentor, userText);
    // 风格前缀
    const prefix = {
      challenge: `（质询）`,
      dialogue: `（回应）`,
      intervention: `（介入）`,
    }[mentor.roundtableStyle] || '';
    return prefix + base;
  });
}

// 绑定对话页所有事件
function bindChatEvents(root) {
  // 模式切换
  $$('.chat__mode-btn', root).forEach((btn) => {
    btn.addEventListener('click', () => {
      const mode = btn.getAttribute('data-mode');
      if (mode === 'single' && AppState.chat.activeMentorIds.length > 1) {
        // 切到单师模式：保留第一位
        AppState.chat.activeMentorIds = [AppState.chat.activeMentorIds[0]];
      }
      AppState.chat.mode = mode;
      renderChat(root);
      bindChatEvents(root);
    });
  });

  // 导师选择
  $$('.mentor-card', root).forEach((card) => {
    card.addEventListener('click', () => {
      const id = card.getAttribute('data-mentor-id');
      const idx = AppState.chat.activeMentorIds.indexOf(id);
      if (AppState.chat.mode === 'roundtable') {
        if (idx >= 0) {
          AppState.chat.activeMentorIds.splice(idx, 1);
        } else {
          if (AppState.chat.activeMentorIds.length >= 4) {
            AppState.chat.activeMentorIds.shift();
          }
          AppState.chat.activeMentorIds.push(id);
        }
      } else {
        if (idx >= 0) AppState.chat.activeMentorIds = [];
        else AppState.chat.activeMentorIds = [id];
        if (idx < 0 && AppState.chat.messages.length === 0) {
          // 自动开场白
          const mentor = AppState.mentors.find((m) => m.id === id);
          if (mentor) {
            AppState.chat.messages.push({
              role: 'mentor',
              mentorId: mentor.id,
              text: generateGreeting(mentor),
              ts: Date.now(),
            });
          }
        }
      }
      renderChat(root);
      bindChatEvents(root);
    });
  });

  // tab 切换
  $$('.tab', root).forEach((tab) => {
    tab.addEventListener('click', () => {
      $$('.tab', root).forEach((t) => t.classList.remove('is-active'));
      tab.classList.add('is-active');
      const category = tab.getAttribute('data-tab');
      const list = category === 'all'
        ? AppState.mentors
        : AppState.mentors.filter((m) => m.category === category);
      const grid = $('#mentorGrid', root);
      if (grid) {
        grid.innerHTML = list.map((m) => `
          <div class="mentor-card ${AppState.chat.activeMentorIds.includes(m.id) ? 'is-selected' : ''}" data-mentor-id="${m.id}">
            <div class="mentor-avatar" style="color:${m.accent}">${m.avatarSymbol}</div>
            <p class="mentor-card__name">${m.name}</p>
            <p class="mentor-card__en">${m.enName}</p>
            <p class="mentor-card__school">${m.school}</p>
            <p class="mentor-card__era">${m.era}</p>
          </div>
        `).join('');
        // 重新绑定
        bindChatEvents(root);
      }
    });
  });

  // 情境 chip
  $$('.chip', root).forEach((chip) => {
    chip.addEventListener('click', () => {
      const v = chip.getAttribute('data-chip');
      const input = $('#chatInput', root);
      if (input) {
        input.value = v;
        input.focus();
        autoResize(input);
      }
    });
  });

  // 输入
  const input = $('#chatInput', root);
  if (input) {
    input.addEventListener('input', () => autoResize(input));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        $('#chatSend', root)?.click();
      }
    });
  }

  // 发送
  $('#chatSend', root)?.addEventListener('click', () => sendUserMessage(root));
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function renderSystemRecommender(recs) {
  if (!recs || !recs.length) {
    return `
      <div class="empty" style="padding: 32px 16px;">
        <p class="eyebrow" style="margin-bottom: 8px;">SYSTEM</p>
        <p class="empty__title" style="font-size: 18px;">书房未听见清晰的回响</p>
        <p class="empty__desc">请再具体一些——困扰你多久了？最让你难受的具体场景是什么？</p>
      </div>
    `;
  }
  return `
    <div class="recommender-wrap" data-system-block style="animation: fadeUp 0.6s ease-out;">
      <p class="eyebrow" style="text-align:center; margin-bottom: 8px;">SYSTEM · 书房召唤</p>
      <p class="recommender-wrap__title">基于你的文字，召唤 3 位导师</p>
      <p class="recommender-wrap__sub">请选择一位开始对话，或重新描述你的困惑。</p>
      <div class="recommender">
        ${recs.map((m, i) => `
          <div class="recommend-card" data-rec-mentor="${m.id}">
            <span class="recommend-card__rank">${['I', 'II', 'III'][i]}</span>
            <div class="mentor-avatar" style="color:${m.accent}">${m.avatarSymbol}</div>
            <p class="recommend-card__name">${escapeHTML(m.name)}</p>
            <p class="recommender-wrap__school">${escapeHTML(m.school)}</p>
            <div class="recommend-card__tags">
              ${m.matchedTags.slice(0, 3).map((t) => `<span class="tag">${escapeHTML(t)}</span>`).join('')}
            </div>
            <p class="recommend-card__reason">${escapeHTML(m.reason)}</p>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

async function sendUserMessage(root) {
  const input = $('#chatInput', root);
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;

  // 用户气泡
  AppState.chat.messages.push({
    role: 'user',
    text,
    ts: Date.now(),
  });

  if (AppState.chat.mode === 'confess') {
    handleConfess(root, text);
  } else if (AppState.chat.mode === 'roundtable') {
    handleRoundtable(root, text);
  } else {
    handleSingle(root, text);
  }

  input.value = '';
  renderChat(root);
  bindChatEvents(root);

  // 平滑滚动到底部
  const flow = $('#chatFlow', root);
  if (flow) {
    setTimeout(() => { flow.scrollTop = flow.scrollHeight; }, 50);
  }
}

function handleSingle(root, text) {
  const mentor = AppState.mentors.find((m) => m.id === AppState.chat.activeMentorIds[0]);
  if (!mentor) return;
  AppState.chat.messages.push({
    role: 'mentor',
    mentorId: mentor.id,
    text: generateReply(mentor, text),
    ts: Date.now(),
  });
}

function handleRoundtable(root, text) {
  const ids = AppState.chat.activeMentorIds;
  if (ids.length < 2) return;
  const mentors = ids.map((id) => AppState.mentors.find((m) => m.id === id));
  const replies = generateRoundtable(mentors, text);
  mentors.forEach((m, i) => {
    AppState.chat.messages.push({
      role: 'mentor',
      mentorId: m.id,
      text: replies[i],
      ts: Date.now() + i,
    });
  });
}

function handleConfess(root, text) {
  const recs = recommendMentors(text, 3);
  if (!recs.length) {
    AppState.chat.messages.push({
      role: 'mentor',
      mentorId: 'laozi',
      text: '你写下的，我听得不够清楚。请再具体一些——它困扰你多久了？最让你难受的具体场景是什么？',
      ts: Date.now(),
    });
    return;
  }
  // 系统消息：推荐
  AppState.chat.messages.push({
    role: 'system',
    text: 'system',
    recs,
    ts: Date.now(),
  });
}

      ${mentor ? `
        <div class="modal__mentor-card">
          <div class="mentor-avatar">${escapeHTML(mentor.avatarSymbol)}</div>
          <div class="modal__mentor-info">
            <p class="modal__mentor-name">${escapeHTML(mentor.name)}</p>
            <p class="modal__mentor-school">${escapeHTML(mentor.school)} · ${escapeHTML(mentor.era)}</p>
          </div>
          <button class="btn btn--ghost" data-modal-chat="${mentor.id}">邀其对话 →</button>
        </div>
      ` : ''}
    </div>
  `;

  document.body.appendChild(modal);
  requestAnimationFrame(() => modal.classList.add('is-open'));

  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
    if (e.target.matches('[data-modal-close]')) closeModal();
    const chatBtn = e.target.closest('[data-modal-chat]');
    if (chatBtn) {
      const mentorId = chatBtn.getAttribute('data-modal-chat');
      closeModal();
      AppState.chat.activeMentorIds = [mentorId];
      AppState.chat.mode = 'single';
      AppState.chat.messages = [];
      location.hash = 'chat';
    }
  });
}

function closeModal() {
  document.querySelectorAll('.modal').forEach((m) => {
    m.classList.remove('is-open');
    setTimeout(() => m.remove(), 200);
  });
}


// 全局状态与事件总线






const listeners = {};
const AppBus = {
  on(event, fn) { (listeners[event] = listeners[event] || []).push(fn); },
  off(event, fn) {
    if (!listeners[event]) return;
    listeners[event] = listeners[event].filter((f) => f !== fn);
  },
  emit(event, payload) {
    (listeners[event] || []).forEach((fn) => {
      try { fn(payload); } catch (e) { console.error(e); }
    });
  },
};

const AppState = {
  mentors: MENTORS,
  cards: CARDS,
  route: 'home',
  chat: {
    mode: 'single',
    activeMentorIds: [],
    messages: [],
  },
  favorites: new Set(JSON.parse((typeof localStorage !== 'undefined' && localStorage.getItem('fav_cards')) || '[]')),
  toggleFavorite(cardId) {
    if (this.favorites.has(cardId)) this.favorites.delete(cardId);
    else this.favorites.add(cardId);
    if (typeof localStorage !== 'undefined') {
      localStorage.setItem('fav_cards', JSON.stringify([...this.favorites]));
    }
    AppBus.emit('favorites:changed', cardId);
  },
};

// ============ 路由 ============
function setRoute(name) {
  AppState.route = name;
  document.querySelectorAll('.nav__btn').forEach((b) => {
    b.classList.toggle('is-active', b.getAttribute('data-nav') === name);
  });
  const view = document.getElementById('view');
  if (name === 'home') renderHome(view);
  else if (name === 'chat') {
    renderChat(view);
    bindChatEvents(view);
  } else if (name === 'cards') renderCardsDrawer(view);
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function parseHash() {
  const h = (location.hash || '#home').slice(1);
  const [route] = h.split('/');
  return { route: route || 'home' };
}

// ============ 全局事件 ============
function bindGlobalEvents() {
  document.querySelectorAll('[data-nav]').forEach((el) => {
    el.addEventListener('click', () => {
      const target = el.getAttribute('data-nav');
      const mode = el.getAttribute('data-mode');
      if (mode) {
        AppState.chat.mode = mode;
        if (mode === 'confess') {
          AppState.chat.activeMentorIds = [];
          AppState.chat.messages = [];
        }
        if (mode === 'single' || mode === 'roundtable') {
          AppState.chat.activeMentorIds = [];
        }
      }
      location.hash = target;
    });
  });

  window.addEventListener('hashchange', () => {
    const { route } = parseHash();
    setRoute(route);
  });

  document.addEventListener('click', (e) => {
    // 主页疗愈卡翻转
    const flip = e.target.closest('[data-flip]');
    if (flip) {
      flip.classList.toggle('is-flipped');
      return;
    }
    // 卡片库 -> 出处
    const cardMini = e.target.closest('.card-mini[data-card-id]');
    if (cardMini) {
      renderSourceModal(cardMini.getAttribute('data-card-id'));
      return;
    }
    // 系统推荐 -> 选导师
    const recCard = e.target.closest('[data-rec-mentor]');
    if (recCard) {
      const id = recCard.getAttribute('data-rec-mentor');
      AppState.chat.activeMentorIds = [id];
      AppState.chat.mode = 'single';
      AppState.chat.messages = [];
      const mentor = AppState.mentors.find((m) => m.id === id);
      if (mentor) {
        AppState.chat.messages.push({
          role: 'mentor',
          mentorId: mentor.id,
          text: generateGreetingInline(mentor),
          ts: Date.now(),
        });
      }
      location.hash = 'chat';
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
}

function generateGreetingInline(mentor) {
  const greetings = mentor.greetings || ['请说。'];
  return greetings[Math.floor(Math.random() * greetings.length)]
    .replace(/\{userConcern\}/g, '眼前这件事');
}

function init() {
  if (typeof document === 'undefined') return; // 跳过非浏览器环境
  const dateEl = document.getElementById('datePill');
  if (dateEl) dateEl.textContent = formatDateEn(new Date());

  bindGlobalEvents();

  const { route } = parseHash();
  setRoute(route);
}

init();

</script>
</body>
</html>
