<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>积木画语 - 让孤独症孩子用积木敲出内心世界</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 60px rgba(0,0,0,0.3);
        }

        /* 顶部 */
        .header {
            text-align: center;
            padding: 15px 20px;
            color: rgba(255,255,255,0.9);
            position: relative;
            z-index: 10;
        }
        .header h1 {
            font-size: 1.4em;
            font-weight: 600;
            letter-spacing: 4px;
        }
        .header p {
            font-size: 0.85em;
            opacity: 0.6;
            margin-top: 3px;
        }

        /* 主题切换 */
        .theme-switch {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 8px 20px;
            position: relative;
            z-index: 10;
        }
        .theme-btn {
            padding: 6px 20px;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.6);
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s;
        }
        .theme-btn.active {
            border-color: #FFD700;
            background: rgba(255,215,0,0.2);
            color: #FFD700;
        }

        /* 画布区域 */
        .canvas-area {
            flex: 1;
            margin: 10px 15px;
            border-radius: 24px;
            background: radial-gradient(ellipse at center, #1a1a3e, #0d0d1a);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.05);
            min-height: 300px;
        }
        #artCanvas {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* 积木感应区 */
        .block-area {
            background: linear-gradient(0deg, rgba(255,255,255,0.05), transparent);
            padding: 15px 15px 20px;
            position: relative;
            z-index: 10;
        }
        .block-hint {
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 0.8em;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .block-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 380px;
            margin: 0 auto;
        }

        /* 积木块样式 - 模拟实体积木 */
        .block {
            aspect-ratio: 1;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            box-shadow: 
                0 6px 0 rgba(0,0,0,0.3),
                0 8px 20px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.15);
        }
        .block:active {
            transform: scale(0.92) translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.3), 0 4px 10px rgba(0,0,0,0.3);
        }
        .block .block-icon {
            font-size: 2em;
            transition: transform 0.3s;
        }
        .block .block-label {
            color: rgba(255,255,255,0.9);
            font-size: 0.7em;
            margin-top: 4px;
            font-weight: 500;
        }
        .block .knock-effect {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            pointer-events: none;
        }

        /* 各积木颜色 */
        .block.red { background: linear-gradient(145deg, #ff6b6b, #c0392b); }
        .block.blue { background: linear-gradient(145deg, #74b9ff, #0984e3); }
        .block.yellow { background: linear-gradient(145deg, #ffeaa7, #fdcb6e); }
        .block.green { background: linear-gradient(145deg, #55efc4, #00b894); }
        .block.purple { background: linear-gradient(145deg, #a29bfe, #6c5ce7); }
        .block.orange { background: linear-gradient(145deg, #fdcb6e, #e17055); }

        /* 敲击动画涟漪 */
        .ripple {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.6);
            animation: rippleAnim 0.8s ease-out forwards;
            z-index: 50;
        }
        @keyframes rippleAnim {
            0% { width: 0; height: 0; opacity: 1; }
            100% { width: 200px; height: 200px; opacity: 0; }
        }

        /* 底部提示 */
        .footer-note {
            text-align: center;
            padding: 8px 20px 12px;
            color: rgba(255,255,255,0.25);
            font-size: 0.7em;
            letter-spacing: 1px;
        }

        /* 粒子飞出动画 */
        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 60;
            animation: particleFly 1.5s ease-out forwards;
        }
        @keyframes particleFly {
            0% { 
                opacity: 1; 
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            100% { 
                opacity: 0; 
                transform: translate(var(--dx), var(--dy)) scale(0) rotate(360deg);
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        /* 背景星星 */
        .bg-star {
            position: absolute;
            border-radius: 50%;
            background: white;
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }

        /* 响应式 */
        @media (max-width: 380px) {
            .block .block-icon { font-size: 1.5em; }
            .block .block-label { font-size: 0.6em; }
            .header h1 { font-size: 1.1em; }
            .block-grid { gap: 8px; }
        }
        @media (min-width: 600px) {
            .app-container { max-width: 500px; }
            .block .block-icon { font-size: 2.5em; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部 -->
        <div class="header">
            <h1>🧱 积木画语</h1>
            <p>敲敲积木 · 画出心中世界</p>
        </div>

        <!-- 主题切换 -->
        <div class="theme-switch">
            <div class="theme-btn active" data-theme="garden" onclick="switchTheme('garden')">🌺 花园</div>
            <div class="theme-btn" data-theme="starry" onclick="switchTheme('starry')">✨ 星夜</div>
            <div class="theme-btn" data-theme="ocean" onclick="switchTheme('ocean')">🌊 海洋</div>
        </div>

        <!-- 画布 -->
        <div class="canvas-area" id="canvasArea">
            <canvas id="artCanvas"></canvas>
            <!-- 背景星星由JS生成 -->
        </div>

        <!-- 积木感应区 -->
        <div class="block-area">
            <div class="block-hint">👇 敲击积木，画出色彩</div>
            <div class="block-grid">
                <div class="block red" data-color="red" onclick="knockBlock('red')">
                    <div class="block-icon">🌺</div>
                    <div class="block-label">敲出花朵</div>
                </div>
                <div class="block blue" data-color="blue" onclick="knockBlock('blue')">
                    <div class="block-icon">✨</div>
                    <div class="block-label">敲出星星</div>
                </div>
                <div class="block yellow" data-color="yellow" onclick="knockBlock('yellow')">
                    <div class="block-icon">🦋</div>
                    <div class="block-label">敲出蝴蝶</div>
                </div>
                <div class="block green" data-color="green" onclick="knockBlock('green')">
                    <div class="block-icon">🌿</div>
                    <div class="block-label">敲出藤蔓</div>
                </div>
                <div class="block purple" data-color="purple" onclick="knockBlock('purple')">
                    <div class="block-icon">💫</div>
                    <div class="block-label">敲出泡泡</div>
                </div>
                <div class="block orange" data-color="orange" onclick="knockBlock('orange')">
                    <div class="block-icon">☀️</div>
                    <div class="block-label">敲出暖光</div>
                </div>
            </div>
        </div>

        <div class="footer-note">把积木放在感应区，敲一敲就能画画 ✦</div>
    </div>

    <script>
        // ===== Canvas 引擎 =====
        const canvas = document.getElementById('artCanvas');
        const ctx = canvas.getContext('2d');
        const canvasArea = document.getElementById('canvasArea');

        let currentTheme = 'garden';
        let elements = [];
        let animationId = null;
        let canvasW, canvasH;

        function resizeCanvas() {
            const rect = canvasArea.getBoundingClientRect();
            canvasW = rect.width;
            canvasH = rect.height;
            canvas.width = canvasW * devicePixelRatio;
            canvas.height = canvasH * devicePixelRatio;
            canvas.style.width = canvasW + 'px';
            canvas.style.height = canvasH + 'px';
            ctx.scale(devicePixelRatio, devicePixelRatio);
        }

        // ===== 元素类 =====
        class ArtElement {
            constructor(x, y, type, color) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.color = color;
                this.size = 0;
                this.maxSize = 12 + Math.random() * 20;
                this.alpha = 1;
                this.growSpeed = 0.02 + Math.random() * 0.03;
                this.life = 1;
                this.decay = 0.003 + Math.random() * 0.005;
                this.angle = Math.random() * Math.PI * 2;
                this.swing = Math.random() * 0.03;
                this.driftX = (Math.random() - 0.5) * 0.3;
                this.driftY = -0.2 - Math.random() * 0.5;
                this.petalCount = 5 + Math.floor(Math.random() * 4);
                this.waveOffset = Math.random() * Math.PI * 2;
            }

            update() {
                if (this.size < this.maxSize) {
                    this.size += this.growSpeed * this.maxSize;
                }
                this.life -= this.decay;
                this.alpha = Math.min(1, this.life * 2);
                this.y += this.driftY;
                this.x += this.driftX + Math.sin(this.angle) * 0.2;
                this.angle += this.swing;
                this.waveOffset += 0.02;
                return this.life > 0 && this.y > -20 && this.x > -20 && this.x < canvasW + 20;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                
                switch (this.type) {
                    case 'flower': this.drawFlower(ctx); break;
                    case 'star': this.drawStar(ctx); break;
                    case 'butterfly': this.drawButterfly(ctx); break;
                    case 'vine': this.drawVine(ctx); break;
                    case 'bubble': this.drawBubble(ctx); break;
                    case 'glow': this.drawGlow(ctx); break;
                    case 'wave': this.drawWave(ctx); break;
                    case 'jellyfish': this.drawJellyfish(ctx); break;
                    case 'fish': this.drawFish(ctx); break;
                }
                ctx.restore();
            }

            drawFlower(ctx) {
                const s = this.size;
                // 花瓣
                for (let i = 0; i < this.petalCount; i++) {
                    const angle = (i / this.petalCount) * Math.PI * 2 + this.angle;
                    const px = this.x + Math.cos(angle) * s * 0.6;
                    const py = this.y + Math.sin(angle) * s * 0.6;
                    ctx.beginPath();
                    ctx.ellipse(px, py, s * 0.4, s * 0.25, angle, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
                // 花蕊
                ctx.beginPath();
                ctx.arc(this.x, this.y, s * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = '#FFD700';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x, this.y, s * 0.1, 0, Math.PI * 2);
                ctx.fillStyle = '#FFA500';
                ctx.fill();
            }

            drawStar(ctx) {
                const s = this.size;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i * 4 * Math.PI / 5) - Math.PI / 2 + this.angle;
                    const r = i === 0 ? s : s;
                    const x = this.x + Math.cos(angle) * r;
                    const y = this.y + Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
                // 小光晕
                ctx.beginPath();
                ctx.arc(this.x, this.y, s * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fill();
            }

            drawButterfly(ctx) {
                const s = this.size;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.sin(this.waveOffset) * 0.3);
                // 左翅膀
                ctx.beginPath();
                ctx.ellipse(-s * 0.3, 0, s * 0.6, s * 0.4, -0.3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                // 右翅膀
                ctx.beginPath();
                ctx.ellipse(s * 0.3, 0, s * 0.6, s * 0.4, 0.3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                // 身体
                ctx.beginPath();
                ctx.ellipse(0, 0, s * 0.08, s * 0.35, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#2d3436';
                ctx.fill();
                ctx.restore();
            }

            drawVine(ctx) {
                const s = this.size;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                for (let t = 0; t < 1; t += 0.05) {
                    const x = this.x + t * s * 1.5;
                    const y = this.y + Math.sin(t * 4 + this.waveOffset) * s * 0.3;
                    if (t === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
                // 叶子
                for (let i = 0; i < 3; i++) {
                    const t = 0.2 + i * 0.25;
                    const lx = this.x + t * s * 1.5;
                    const ly = this.y + Math.sin(t * 4 + this.waveOffset) * s * 0.3;
                    ctx.beginPath();
                    ctx.ellipse(lx + 8, ly - 5, 6, 3, 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#55efc4';
                    ctx.fill();
                }
            }

            drawBubble(ctx) {
                const s = this.size;
                ctx.beginPath();
                ctx.arc(this.x, this.y, s, 0, Math.PI * 2);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 1.5;
                ctx.stroke();
                // 高光
                ctx.beginPath();
                ctx.arc(this.x - s * 0.25, this.y - s * 0.25, s * 0.25, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fill();
                // 内光晕
                ctx.beginPath();
                ctx.arc(this.x, this.y, s * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color.replace('0.8', '0.1');
                ctx.fill();
            }

            drawGlow(ctx) {
                const s = this.size;
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, s * 1.5);
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(0.4, this.color.replace('1)', '0.5)'));
                gradient.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, s * 1.5, 0, Math.PI * 2);
                ctx.fill();
                // 中心亮点
                ctx.beginPath();
                ctx.arc(this.x, this.y, s * 0.15, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.fill();
            }

            drawWave(ctx) {
                const s = this.size;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let t = 0; t < 1; t += 0.02) {
                    const x = this.x + t * s * 2 - s;
                    const y = this.y + Math.sin(t * 6 + this.waveOffset + this.x * 0.05) * s * 0.4;
                    if (t === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
                // 波纹高光
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let t = 0; t < 1; t += 0.02) {
                    const x = this.x + t * s * 2 - s;
                    const y = this.y + 5 + Math.sin(t * 6 + this.waveOffset + this.x * 0.05 + 1) * s * 0.3;
                    if (t === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            drawJellyfish(ctx) {
                const s = this.size;
                // 伞盖
                ctx.beginPath();
                ctx.arc(this.x, this.y, s * 0.5, Math.PI, 0);
                ctx.fillStyle = this.color;
                ctx.fill();
                // 触手
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI - Math.PI / 2;
                    const tx = this.x + Math.cos(angle) * s * 0.4;
                    ctx.beginPath();
                    ctx.moveTo(tx, this.y);
                    ctx.quadraticCurveTo(
                        tx + Math.sin(this.waveOffset + i) * 5,
                        this.y + s * 0.5 + s * 0.3 * Math.sin(this.waveOffset + i),
                        tx + Math.sin(this.waveOffset + i + 1) * 8,
                        this.y + s * 1.2
                    );
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            }

            drawFish(ctx) {
                const s = this.size;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.sin(this.waveOffset) * 0.2);
                // 身体
                ctx.beginPath();
                ctx.ellipse(0, 0, s * 0.5, s * 0.25, 0, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                // 尾巴
                ctx.beginPath();
                ctx.moveTo(-s * 0.5, 0);
                ctx.lineTo(-s * 0.8, -s * 0.3);
                ctx.lineTo(-s * 0.8, s * 0.3);
                ctx.closePath();
                ctx.fillStyle = this.color;
                ctx.fill();
                // 眼睛
                ctx.beginPath();
                ctx.arc(s * 0.15, -s * 0.05, s * 0.06, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(s * 0.18, -s * 0.05, s * 0.03, 0, Math.PI * 2);
                ctx.fillStyle = '#333';
                ctx.fill();
                ctx.restore();
            }
        }

        // ===== 颜色配置 =====
        const colorMap = {
            'red': { garden: '#ff6b6b', starry: '#ff4757', ocean: '#ff6b6b' },
            'blue': { garden: '#74b9ff', starry: '#a29bfe', ocean: '#0984e3' },
            'yellow': { garden: '#ffeaa7', starry: '#fdcb6e', ocean: '#ffeaa7' },
            'green': { garden: '#55efc4', starry: '#00b894', ocean: '#81ecec' },
            'purple': { garden: '#a29bfe', starry: '#6c5ce7', ocean: '#a29bfe' },
            'orange': { garden: '#fdcb6e', starry: '#e17055', ocean: '#fdcb6e' },
        };

        const typeMap = {
            garden: { red: 'flower', blue: 'bubble', yellow: 'butterfly', green: 'vine', purple: 'bubble', orange: 'glow' },
            starry: { red: 'star', blue: 'star', yellow: 'glow', green: 'glow', purple: 'star', orange: 'glow' },
            ocean: { red: 'fish', blue: 'wave', yellow: 'jellyfish', green: 'wave', purple: 'jellyfish', orange: 'glow' },
        };

        function getColor(blockColor) {
            return colorMap[blockColor]?.[currentTheme] || '#fff';
        }

        function getType(blockColor) {
            return typeMap[currentTheme]?.[blockColor] || 'glow';
        }

        // ===== 主题切换 =====
        function switchTheme(theme) {
            currentTheme = theme;
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.theme-btn[data-theme="${theme}"]`).classList.add('active');
            // 清空画布，重新开始
            elements = [];
            // 创建20个初始元素模拟氛围
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const colors = ['red', 'blue', 'yellow', 'green', 'purple', 'orange'];
                    const c = colors[Math.floor(Math.random() * colors.length)];
                    const x = Math.random() * canvasW;
                    const y = Math.random() * canvasH;
                    const el = new ArtElement(x, y, getType(c), getColor(c));
                    el.size = 5 + Math.random() * 10;
                    el.maxSize = el.size;
                    el.life = 0.5 + Math.random() * 0.5;
                    el.alpha = el.life;
                    elements.push(el);
                }, i * 50);
            }
        }

        // ===== 敲击积木 =====
        function knockBlock(color) {
            // 视觉反馈：积木闪烁效果
            const blockEl = document.querySelector(`.block.${color}`);
            blockEl.style.transform = 'scale(0.92) translateY(4px)';
            setTimeout(() => {
                blockEl.style.transform = '';
            }, 150);

            // 创建敲击涟漪效果
            const rect = blockEl.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = (cx - 50) + 'px';
            ripple.style.top = (cy - 50) + 'px';
            ripple.style.borderColor = getColor(color);
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 800);

            // 在画布上生成多个元素
            const count = 4 + Math.floor(Math.random() * 4);
            for (let i = 0; i < count; i++) {
                const x = canvasW * (0.1 + Math.random() * 0.8);
                const y = canvasH * (0.1 + Math.random() * 0.8);
                const el = new ArtElement(x, y, getType(color), getColor(color));
                elements.push(el);
            }

            // 飞出彩色粒子
            const particleCount = 8;
            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = 6 + Math.random() * 10;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.background = getColor(color);
                p.style.left = (cx + (Math.random() - 0.5) * 60) + 'px';
                p.style.top = (cy + (Math.random() - 0.5) * 60) + 'px';
                const dx = (Math.random() - 0.5) * 400;
                const dy = -(100 + Math.random() * 300);
                p.style.setProperty('--dx', dx + 'px');
                p.style.setProperty('--dy', dy + 'px');
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1500);
            }

            // 触觉/音效反馈模拟：屏幕轻微振动
            canvasArea.style.transform = 'translate(1px, 1px)';
            setTimeout(() => { canvasArea.style.transform = ''; }, 80);
        }

        // ===== 背景星星 =====
        function createBgStars() {
            const area = document.getElementById('canvasArea');
            for (let i = 0; i < 30; i++) {
                const star = document.createElement('div');
                star.className = 'bg-star';
                const size = 1 + Math.random() * 2;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (2 + Math.random() * 3) + 's';
                star.style.opacity = 0.2 + Math.random() * 0.3;
                area.appendChild(star);
            }
        }

        // ===== 点击画布也可以触发 (方便触摸交互) =====
        canvasArea.addEventListener('click', (e) => {
            const rect = canvasArea.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            // 随机选一个颜色
            const colors = ['red', 'blue', 'yellow', 'green', 'purple', 'orange'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const count = 2 + Math.floor(Math.random() * 3);
            for (let i = 0; i < count; i++) {
                const el = new ArtElement(
                    x + (Math.random() - 0.5) * 80,
                    y + (Math.random() - 0.5) * 80,
                    getType(color),
                    getColor(color)
                );
                elements.push(el);
            }
        });

        // ===== 渲染循环 =====
        function animate() {
            ctx.clearRect(0, 0, canvasW, canvasH);

            // 画底色渐变
            const gradient = ctx.createRadialGradient(canvasW * 0.5, canvasH * 0.5, 0, canvasW * 0.5, canvasH * 0.5, canvasW * 0.6);
            if (currentTheme === 'starry') {
                gradient.addColorStop(0, '#1a1a3e');
                gradient.addColorStop(1, '#0d0d1a');
            } else if (currentTheme === 'ocean') {
                gradient.addColorStop(0, '#0c2461');
                gradient.addColorStop(1, '#0a3d62');
            } else {
                gradient.addColorStop(0, '#1a1a3e');
                gradient.addColorStop(1, '#0d2137');
            }
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvasW, canvasH);

            // 更新和绘制所有元素
            elements = elements.filter(el => el.update());
            elements.forEach(el => el.draw(ctx));

            // 左下角计数（隐藏，仅调试）
            // ctx.fillStyle = 'rgba(255,255,255,0.1)';
            // ctx.fillText(elements.length, 10, canvasH - 10);

            animationId = requestAnimationFrame(animate);
        }

        // ===== 初始化 =====
        function init() {
            resizeCanvas();
            createBgStars();
            // 初始生成一些元素
            for (let i = 0; i < 15; i++) {
                const colors = ['red', 'blue', 'yellow', 'green', 'purple', 'orange'];
                const c = colors[Math.floor(Math.random() * colors.length)];
                const x = Math.random() * canvasW;
                const y = Math.random() * canvasH;
                const el = new ArtElement(x, y, getType(c), getColor(c));
                el.size = 5 + Math.random() * 8;
                el.maxSize = el.size;
                el.life = 0.8;
                el.alpha = 0.8;
                elements.push(el);
            }
            animate();
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        init();
    </script>
</body>
</html>
