<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpriteCutoutTool 授权生成器</title>
  <style>
    :root {
      --bg: #11161d;
      --panel: #1e2530;
      --panel-2: #252d3a;
      --line: #3a4658;
      --text: #f2f5f8;
      --muted: #9aa6b2;
      --accent: #4da3ff;
      --accent-2: #2f80ed;
      --ok: #4ade80;
      --warn: #f5bf5b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      font: 14px/1.45 "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 20%, rgba(77, 163, 255, .14), transparent 34%),
        linear-gradient(180deg, #11161d 0%, #151b24 100%);
    }
    .app {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(30, 37, 48, .96);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .36), inset 0 1px 0 rgba(255, 255, 255, .04);
      overflow: hidden;
    }
    header {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 24px 26px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }
    .logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 14px;
      border: 1px solid rgba(77, 163, 255, .5);
      background: linear-gradient(145deg, #233247, #18202b);
    }
    .logo svg {
      width: 34px;
      height: 34px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }
    main {
      padding: 22px 26px 26px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    label {
      display: grid;
      gap: 7px;
      color: #d7dde8;
      font-weight: 700;
      font-size: 13px;
    }
    input,
    select {
      height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: #141b24;
      outline: none;
      font: inherit;
      font-weight: 700;
    }
    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(77, 163, 255, .16);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    button {
      height: 36px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: #2b3442;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover {
      border-color: rgba(77, 163, 255, .7);
      background: #323d4e;
    }
    button.primary {
      border-color: rgba(77, 163, 255, .7);
      background: var(--accent-2);
    }
    .result {
      margin-top: 20px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 12px;
      background: #171e28;
    }
    .row {
      display: grid;
      grid-template-columns: 110px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
    }
    .row:last-child { border-bottom: 0; }
    .key {
      color: var(--muted);
      font-weight: 700;
    }
    .value {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 14px;
      color: #f8fbff;
    }
    .copy {
      width: 52px;
      height: 28px;
      padding: 0;
      font-size: 12px;
      color: #dce8f8;
    }
    .note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
    }
    .status {
      min-height: 20px;
      margin-top: 12px;
      color: var(--ok);
      font-size: 12px;
    }
    .warning {
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px solid rgba(245, 191, 91, .26);
      border-radius: 10px;
      color: #f7d999;
      background: rgba(245, 191, 91, .08);
      font-size: 12px;
    }
    @media (max-width: 680px) {
      .grid { grid-template-columns: 1fr; }
      .row { grid-template-columns: 90px 1fr; }
      .copy { grid-column: 2; width: 72px; }
    }
  </style>
</head>
<body>
  <section class="app">
    <header>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <rect x="7" y="7" width="50" height="50" rx="14" fill="#1d2633" stroke="#4da3ff" stroke-opacity=".45"/>
          <circle cx="32" cy="32" r="4.8" fill="#4da3ff"/>
          <ellipse cx="32" cy="32" rx="23" ry="8.5" stroke="#f2f6ff" stroke-width="3.5" transform="rotate(-18 32 32)"/>
          <ellipse cx="32" cy="32" rx="23" ry="8.5" stroke="#f2f6ff" stroke-width="3.5" transform="rotate(62 32 32)"/>
          <ellipse cx="32" cy="32" rx="23" ry="8.5" stroke="#f2f6ff" stroke-width="3.5" transform="rotate(137 32 32)"/>
        </svg>
      </div>
      <div>
        <h1>SpriteCutoutTool 授权生成器</h1>
        <div class="subtitle">输入授权等级、用户编号和期数，生成账号与对应期密码。</div>
      </div>
    </header>

    <main>
      <div class="grid">
        <label>
          授权等级
          <select id="level">
            <option value="1">Level 1 - 无限额度</option>
            <option value="2">Level 2 - 1000 次</option>
            <option value="3">Level 3 - 500 次</option>
            <option value="4">Level 4 - 300 次</option>
            <option value="5" selected>Level 5 - 100 次</option>
          </select>
        </label>
        <label>
          用户编号
          <input id="userNo" inputmode="numeric" value="001" maxlength="3" placeholder="001">
        </label>
        <label>
          密码期数
          <input id="renewalIndex" inputmode="numeric" value="1" min="1" placeholder="1">
        </label>
      </div>

      <div class="actions">
        <button id="generateFirst" class="primary">生成第 1 期</button>
        <button id="generateRenewal">生成指定期</button>
        <button id="copyAll">复制发放信息</button>
      </div>

      <div class="result" aria-live="polite">
        <div class="row">
          <div class="key">账号 ID</div>
          <div id="accountId" class="value">-</div>
          <button class="copy" data-copy="accountId">复制</button>
        </div>
        <div class="row">
          <div class="key">账号</div>
          <div id="email" class="value">-</div>
          <button class="copy" data-copy="email">复制</button>
        </div>
        <div class="row">
          <div class="key">期数</div>
          <div id="period" class="value">-</div>
          <button class="copy" data-copy="period">复制</button>
        </div>
        <div class="row">
          <div class="key">密码</div>
          <div id="password" class="value">-</div>
          <button class="copy" data-copy="password">复制</button>
        </div>
        <div class="row">
          <div class="key">额度</div>
          <div id="quota" class="value">-</div>
          <button class="copy" data-copy="quota">复制</button>
        </div>
      </div>

      <div id="status" class="status"></div>
      <div class="warning">
        Owner 私有工具：只把“账号 + 当前期密码”发给用户，不要把这个文件、生成规则或整张 CSV 发给普通用户。
      </div>
      <div class="note">
        说明：第 1 期用于首次开通；续期时生成 renewalIndex + 1 的密码。可以直接生成第 6 期，但用户软件必须走到对应期数后才能使用。
      </div>
    </main>
  </section>

  <script>
    const LEVEL_QUOTA_MAP = {
      "1": "unlimited",
      "2": 1000,
      "3": 500,
      "4": 300,
      "5": 100
    };
    const INTERNAL_SECRET = "SpriteCutoutTool.algorithmic.offline.license.seed.2026";
    const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    const els = Object.fromEntries(
      ["level", "userNo", "renewalIndex", "accountId", "email", "period", "password", "quota", "status"]
        .map((id) => [id, document.getElementById(id)])
    );
    let current = null;

    document.getElementById("generateFirst").addEventListener("click", () => {
      els.renewalIndex.value = "1";
      generate();
    });
    document.getElementById("generateRenewal").addEventListener("click", generate);
    document.getElementById("copyAll").addEventListener("click", copyAll);
    document.querySelectorAll("[data-copy]").forEach((button) => {
      button.addEventListener("click", () => copyText(els[button.dataset.copy].textContent));
    });
    ["level", "userNo", "renewalIndex"].forEach((id) => {
      els[id].addEventListener("keydown", (event) => {
        if (event.key === "Enter") generate();
      });
    });
    generate();

    async function generate() {
      const level = String(els.level.value || "5");
      const userNo = normalizeUserNo(els.userNo.value);
      const renewalIndex = Math.max(1, Number.parseInt(els.renewalIndex.value || "1", 10));
      els.userNo.value = userNo;
      els.renewalIndex.value = String(renewalIndex);
      if (!/^[1-5]$/.test(level) || !/^\d{3}$/.test(userNo)) {
        setStatus("请输入正确的授权等级和三位用户编号。", true);
        return;
      }
      const accountId = `${level}${userNo}`;
      const domain = (await hmacHex(INTERNAL_SECRET, `domain:${level}:${userNo}`)).slice(0, 6).toLowerCase();
      const password = formatPassword(await hmacHex(INTERNAL_SECRET, `pwd:${level}:${userNo}:${renewalIndex}`));
      current = {
        level,
        userNo,
        accountId,
        email: `test${accountId}@${domain}.local`,
        renewalIndex,
        password,
        quota: LEVEL_QUOTA_MAP[level] ?? 100
      };
      render();
      setStatus("已生成。");
    }

    function render() {
      els.accountId.textContent = current.accountId;
      els.email.textContent = current.email;
      els.period.textContent = `第 ${current.renewalIndex} 期`;
      els.password.textContent = current.password;
      els.quota.textContent = current.quota === "unlimited" ? "unlimited" : `${current.quota} 次`;
    }

    async function hmacHex(key, text) {
      const encoder = new TextEncoder();
      const cryptoKey = await crypto.subtle.importKey(
        "raw",
        encoder.encode(key),
        { name: "HMAC", hash: "SHA-256" },
        false,
        ["sign"]
      );
      const signature = await crypto.subtle.sign("HMAC", cryptoKey, encoder.encode(text));
      return [...new Uint8Array(signature)].map((byte) => byte.toString(16).padStart(2, "0")).join("");
    }

    function formatPassword(rawHex) {
      const chars = [];
      for (let i = 0; chars.length < 8; i += 2) {
        const value = Number.parseInt(rawHex.slice(i, i + 2), 16);
        chars.push(ALPHABET[value % ALPHABET.length]);
      }
      return `SC-${chars.slice(0, 4).join("")}-${chars.slice(4, 8).join("")}`;
    }

    function normalizeUserNo(userNo) {
      return String(userNo || "1").replace(/\D/g, "").slice(0, 3).padStart(3, "0");
    }

    async function copyAll() {
      if (!current) await generate();
      await copyText(`账号：${current.email}\n密码：${current.password}`);
    }

    async function copyText(text) {
      if (!text || text === "-") return;
      await navigator.clipboard.writeText(text);
      setStatus("已复制。");
    }

    function setStatus(text, isError = false) {
      els.status.textContent = text;
      els.status.style.color = isError ? "#ff7b72" : "var(--ok)";
    }
  </script>
</body>
</html>
