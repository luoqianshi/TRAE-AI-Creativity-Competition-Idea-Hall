<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实施平台 · 点位路线区域管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Noto Sans CJK SC','WenQuanYi Micro Hei','Microsoft YaHei',sans-serif;color:#f3f4f6;background:#0b1220;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}

/* ===== Header ===== */
header{height:44px;background:#111827;border-bottom:1px solid #374151;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}
header h1{font-size:14px;font-weight:700;color:#3b82f6;letter-spacing:.05em}
.header-tools{display:flex;gap:6px;align-items:center}
.btn{background:#1f2937;border:1px solid #374151;color:#f3f4f6;padding:4px 12px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px;transition:.15s}
.btn:hover{border-color:#3b82f6;color:#3b82f6}
.btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6}

/* ===== Main Layout ===== */
.main{display:flex;flex:1;overflow:hidden}

/* ===== Left Sidebar - Material Library ===== */
.sidebar-left{width:224px;background:#111827;border-right:1px solid #374151;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.panel-title{font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.08em;padding:10px 12px 4px;font-weight:600}
.mat-group{margin-bottom:2px}
.mat-group-hd{display:flex;align-items:center;gap:6px;padding:7px 12px;cursor:pointer;font-size:12px;color:#f3f4f6;font-weight:600;user-select:none}
.mat-group-hd:hover{background:#1f2937}
.mat-group-hd .arr{font-size:9px;color:#9ca3af;transition:.2s;display:inline-block}
.mat-group-hd.open .arr{transform:rotate(90deg)}
.mat-group-bd{display:none;padding:2px 8px 8px 28px;flex-direction:column;gap:3px}
.mat-group-bd.open{display:flex}
.mat-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;cursor:grab;font-size:12px;color:#9ca3af;border:1px solid transparent;transition:.15s;user-select:none}
.mat-item:hover{background:#1f2937;color:#f3f4f6;border-color:#374151}
.mat-item:active{cursor:grabbing}
.mat-item .ico{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mat-item .ico svg{width:16px;height:16px}

/* ===== Canvas ===== */
.canvas-wrap{flex:1;position:relative;background:#0b1220;overflow:hidden}
#canvas{display:block;width:100%;height:100%;cursor:crosshair}
#canvas.panning{cursor:grab}
#canvas.dragging{cursor:grabbing}

/* ===== Right Sidebar ===== */
.sidebar-right{width:268px;background:#111827;border-left:1px solid #374151;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.search-box{padding:8px 12px;border-bottom:1px solid #374151}
.search-box input{width:100%;background:#1f2937;border:1px solid #374151;color:#f3f4f6;padding:6px 10px;border-radius:4px;font-family:inherit;font-size:12px}
.search-box input:focus{outline:none;border-color:#3b82f6}
.prop-panel{padding:10px 12px}
.prop-group{margin-bottom:12px}
.prop-group label{display:block;font-size:11px;color:#9ca3af;margin-bottom:3px;font-weight:500}
.prop-group input,.prop-group select{width:100%;background:#1f2937;border:1px solid #374151;color:#f3f4f6;padding:5px 8px;border-radius:3px;font-family:inherit;font-size:12px}
.prop-group input:focus,.prop-group select:focus{outline:none;border-color:#3b82f6}
.prop-group input[type="color"]{padding:2px;height:30px;cursor:pointer}
.prop-group input[type="number"]{font-family:'GeistMono',monospace}
.prop-row{display:flex;gap:8px}
.prop-row .prop-group{flex:1}
.prop-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.prop-tag{background:#1f2937;border:1px solid #374151;padding:2px 8px;border-radius:3px;font-size:11px;color:#9ca3af;display:flex;align-items:center;gap:4px}
.prop-tag .del{color:#9ca3af;cursor:pointer;font-size:14px;line-height:1}
.prop-tag .del:hover{color:#ef4444}
.add-tag-btn{font-size:11px;color:#3b82f6;cursor:pointer;margin-top:4px;display:inline-block}
.toggle-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px;color:#9ca3af}
.toggle-row input[type=checkbox]{accent-color:#3b82f6;width:14px;height:14px}
.layer-list{display:flex;flex-direction:column;gap:2px}
.layer-item{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:3px;cursor:pointer;font-size:12px;color:#9ca3af;user-select:none}
.layer-item:hover{background:#1f2937;color:#f3f4f6}
.layer-item.active{background:#374151;color:#f3f4f6}
.layer-item .eye{width:16px;text-align:center;font-size:12px}
.divider{height:1px;background:#374151;margin:8px 0}

/* ===== Bottom Toolbar ===== */
.toolbar-bottom{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:#111827;border:1px solid #374151;border-radius:8px;padding:4px 6px;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.tool-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:5px;cursor:pointer;border:1px solid transparent;background:transparent;color:#9ca3af;font-size:16px;transition:.15s}
.tool-btn:hover{background:#1f2937;color:#f3f4f6}
.tool-btn.active{background:#3b82f6;color:#fff;border-color:#60a5fa}
.tool-sep{width:1px;background:#374151;margin:4px 2px}

/* ===== Status Bar ===== */
.status-bar{height:26px;background:#111827;border-top:1px solid #374151;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11px;color:#9ca3af;flex-shrink:0}
.status-bar span{display:flex;align-items:center;gap:6px}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:200}
.modal-overlay.show{display:flex}
.modal{background:#111827;border:1px solid #374151;border-radius:8px;padding:20px;width:420px;max-width:90vw}
.modal h3{font-size:14px;margin-bottom:12px;color:#f3f4f6}
.modal textarea{width:100%;height:200px;background:#1f2937;border:1px solid #374151;color:#f3f4f6;padding:10px;border-radius:4px;font-family:monospace;font-size:11px;resize:vertical}
.modal textarea:focus{outline:none;border-color:#3b82f6}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}

/* ===== Zoom indicator ===== */
.zoom-indicator{position:absolute;top:12px;right:12px;background:#111827;border:1px solid #374151;border-radius:6px;padding:4px 10px;font-size:11px;color:#9ca3af;z-index:50;pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>实施平台 · Map Implementation Platform</h1>
    <div class="header-tools">
      <button class="btn" onclick="app.exportSample()">导出样表</button>
      <button class="btn" onclick="app.showImportModal()">导入</button>
      <button class="btn" onclick="app.exportData()">导出数据</button>
      <button class="btn" onclick="app.clearAll()">清空画布</button>
    </div>
  </header>
  <div class="main">
    <div class="sidebar-left">
      <div class="panel-title">素材库 Material Library</div>
      <div id="materials"></div>
    </div>
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div class="zoom-indicator" id="zoomIndicator">100%</div>
      <div class="toolbar-bottom">
        <div class="tool-btn active" data-tool="select" title="选择 (V)">&#10004;</div>
        <div class="tool-sep"></div>
        <div class="tool-btn" data-tool="point" title="点位 (P)">&#9679;</div>
        <div class="tool-sep"></div>
        <div class="tool-btn" data-tool="line" title="画线 (L)">&#47;</div>
        <div class="tool-btn" data-tool="polyline" title="多段线 (M)">&#8767;</div>
        <div class="tool-sep"></div>
        <div class="tool-btn" data-tool="rect" title="矩形 (R)">&#9633;</div>
        <div class="tool-btn" data-tool="polygon" title="多边形 (G)">&#11042;</div>
        <div class="tool-sep"></div>
        <div class="tool-btn" data-tool="rotate" title="旋转 (O)">&#8635;</div>
      </div>
    </div>
    <div class="sidebar-right">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索 Name / Code ...">
      </div>
      <div class="prop-panel" id="propPanel">
        <div class="prop-group">
          <label>显示设置</label>
          <div class="toggle-row"><input type="checkbox" id="showName" checked> <span>显示 Name</span></div>
          <div class="toggle-row"><input type="checkbox" id="showCode" checked> <span>显示 Code</span></div>
          <div class="toggle-row"><input type="checkbox" id="showGrid" checked> <span>显示网格</span></div>
          <div class="toggle-row"><input type="checkbox" id="showFloorPlan" checked> <span>显示底图</span></div>
        </div>
        <div class="divider"></div>
        <div class="prop-group">
          <label>图层管理</label>
          <div class="layer-list" id="layerList"></div>
        </div>
        <div class="divider"></div>
        <div id="selectedProps" style="display:none">
          <div class="panel-title">选中对象属性</div>
          <div class="prop-group"><label>Name</label><input type="text" id="pName"></div>
          <div class="prop-group"><label>Code</label><input type="text" id="pCode"></div>
          <div class="prop-row">
            <div class="prop-group"><label>X</label><input type="number" id="pX" step="0.1"></div>
            <div class="prop-group"><label>Y</label><input type="number" id="pY" step="0.1"></div>
          </div>
          <div class="prop-row">
            <div class="prop-group"><label>Rotation</label><input type="number" id="pRot" step="1"></div>
            <div class="prop-group"><label>Scale</label><input type="number" id="pScale" step="0.1"></div>
          </div>
          <div class="prop-group"><label>Color</label><input type="color" id="pColor"></div>
          <div class="prop-group"><label>MainType</label><select id="pMainType"><option value="point">点位</option><option value="route">路线</option><option value="area">区域</option></select></div>
          <div class="prop-group"><label>SubType</label><input type="text" id="pSubType"></div>
          <div class="prop-group"><label>SpaceID</label><input type="text" id="pSpaceID"></div>
          <div class="prop-group"><label>Layer</label><input type="text" id="pLayer"></div>
          <div class="prop-group">
            <label>Tags</label>
            <div class="prop-tags" id="pTags"></div>
            <div class="add-tag-btn" onclick="app.addTag()">+ 添加标签</div>
          </div>
        </div>
        <div id="noSelection" style="text-align:center;padding:20px 0;color:#4b5563;font-size:12px">
          点击画布上的对象查看属性<br>或使用素材库添加新对象
        </div>
      </div>
    </div>
  </div>
  <div class="status-bar">
    <span id="statusText">就绪 | 缩放: 100% | 对象: 0</span>
    <span>滚轮缩放 · 右键拖拽画布 · 左键实施 · 快捷键 V/P/L/M/R/G/O</span>
  </div>
</div>

<div class="modal-overlay" id="importModal">
  <div class="modal">
    <h3>导入数据 (JSON)</h3>
    <textarea id="importArea" placeholder="粘贴JSON数据..."></textarea>
    <div class="modal-btns">
      <button class="btn" onclick="document.getElementById('importModal').classList.remove('show')">取消</button>
      <button class="btn active" onclick="app.doImport()">导入</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ========== Material Library ========== */
var materials = {
  point:{label:'点位素材',items:[
    {id:'pt_circle',label:'无方向点位',type:'point',subType:'circle',icon:'circle'},
    {id:'pt_cone',label:'锥状方向点位',type:'point',subType:'cone',icon:'cone'},
    {id:'pt_rect_dir',label:'矩形方向点位',type:'point',subType:'rectDir',icon:'rect'},
    {id:'pt_circle_scale',label:'圆形缩放点位',type:'point',subType:'circleScale',icon:'circleS'},
    {id:'pt_arrow',label:'箭头射线点位',type:'point',subType:'arrow',icon:'arrow'},
    {id:'pt_station',label:'站点点位',type:'point',subType:'station',icon:'station'}
  ]},
  route:{label:'路线素材',items:[
    {id:'rt_line',label:'两点直线',type:'route',subType:'line',icon:'line'},
    {id:'rt_arc',label:'圆弧路线',type:'route',subType:'arc',icon:'arc'},
    {id:'rt_poly',label:'多段线路线',type:'route',subType:'polyline',icon:'poly'}
  ]},
  area:{label:'区域素材',items:[
    {id:'ar_poly',label:'闭合多边形',type:'area',subType:'polygon',icon:'poly'},
    {id:'ar_npoly',label:'正N边形',type:'area',subType:'nPolygon',icon:'npoly'},
    {id:'ar_rect',label:'矩形区域',type:'area',subType:'rect',icon:'rect'}
  ]}
};

var icons={
  circle:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="currentColor"/></svg>',
  cone:'<svg viewBox="0 0 16 16"><polygon points="8,2 13,12 3,12" fill="currentColor"/></svg>',
  rect:'<svg viewBox="0 0 16 16"><rect x="3" y="4" width="10" height="8" fill="currentColor"/></svg>',
  circleS:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  arrow:'<svg viewBox="0 0 16 16"><line x1="2" y1="8" x2="12" y2="8" stroke="currentColor" stroke-width="2"/><polygon points="12,8 9,5 9,11" fill="currentColor"/></svg>',
  station:'<svg viewBox="0 0 16 16"><rect x="4" y="3" width="8" height="10" rx="2" fill="currentColor"/></svg>',
  line:'<svg viewBox="0 0 16 16"><line x1="2" y1="14" x2="14" y2="2" stroke="currentColor" stroke-width="2"/></svg>',
  arc:'<svg viewBox="0 0 16 16"><path d="M2,14 Q8,2 14,14" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  poly:'<svg viewBox="0 0 16 16"><polyline points="2,12 6,4 10,12 14,4" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  npoly:'<svg viewBox="0 0 16 16"><polygon points="8,2 14,6 12,13 4,13 2,6" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
};

/* ========== Floor Plan (demo background) ========== */
var floorPlan = {
  rooms:[
    {x:-400,y:-300,w:250,h:180,label:'会议室 A',color:'#1e293b'},
    {x:-100,y:-300,w:200,h:180,label:'办公区 B',color:'#1a2332'},
    {x:130,y:-300,w:280,h:180,label:'实验室 C',color:'#1e293b'},
    {x:-400,y:-90,w:350,h:200,label:'大厅 D',color:'#1a2332'},
    {x:-20,y:-90,w:200,h:200,label:'走廊 E',color:'#172033'},
    {x:210,y:-90,w:200,h:200,label:'仓库 F',color:'#1e293b'},
    {x:-400,y:130,w:180,h:170,label:'休息室 G',color:'#1a2332'},
    {x:-190,y:130,w:220,h:170,label:'控制室 H',color:'#1e293b'},
    {x:50,y:130,w:180,h:170,label:'设备间 I',color:'#1a2332'},
    {x:260,y:130,w:150,h:170,label:'出口 J',color:'#1e293b'}
  ]
};

/* ========== State ========== */
var canvas,ctx,w,h;
var objects=[];
var layers={'Default':true,'点位层':true,'路线层':true,'区域层':true};
var camera={x:0,y:0,zoom:1};
var tool='select';
var selectedId=null;
var dragging=false,panning=false,drawing=false;
var dragStart=null,lastMouse={x:0,y:0};
var drawPoints=[];
var nextId=1;
var labelFontSize=11;
var dragMaterial=null;

/* ========== Demo Data ========== */
function loadDemoData(){
  var demos=[
    // Points
    {name:'入口大门',code:'PT0001',mainType:'point',subType:'station',x:335,y:215,rotation:0,scale:1.2,color:'#3b82f6',layer:'点位层',spaceID:'F1-01',tags:['入口','重要']},
    {name:'消防栓A',code:'PT0002',mainType:'point',subType:'circle',x:-320,y:-210,rotation:0,scale:1,color:'#ef4444',layer:'点位层',spaceID:'F1-01',tags:['消防']},
    {name:'监控摄像头01',code:'PT0003',mainType:'point',subType:'cone',x:-225,y:-210,rotation:45,scale:1,color:'#f59e0b',layer:'点位层',spaceID:'F1-01',tags:['安防']},
    {name:'温湿度传感器',code:'PT0004',mainType:'point',subType:'circleScale',x:0,y:-210,rotation:0,scale:1.3,color:'#10b981',layer:'点位层',spaceID:'F1-01',tags:['环境']},
    {name:'方向指示牌',code:'PT0005',mainType:'point',subType:'rectDir',x:270,y:-210,rotation:90,scale:1,color:'#8b5cf6',layer:'点位层',spaceID:'F1-01',tags:['标识']},
    {name:'紧急出口',code:'PT0006',mainType:'point',subType:'arrow',x:-310,y:215,rotation:0,scale:1,color:'#ef4444',layer:'点位层',spaceID:'F1-01',tags:['安全','出口']},
    {name:'空调出风口',code:'PT0007',mainType:'point',subType:'circle',x:-80,y:10,rotation:0,scale:0.8,color:'#06b6d4',layer:'点位层',spaceID:'F1-01',tags:['暖通']},
    {name:'配电箱',code:'PT0008',mainType:'point',subType:'rectDir',x:140,y:215,rotation:0,scale:1,color:'#f97316',layer:'点位层',spaceID:'F1-01',tags:['电力']},
    // Routes
    {name:'主通道',code:'RT0001',mainType:'route',subType:'line',points:[{x:-225,y:10},{x:80,y:10}],color:'#10b981',layer:'路线层',spaceID:'F1-01',tags:['主路'],x:0,y:0},
    {name:'巡检路线',code:'RT0002',mainType:'route',subType:'polyline',points:[{x:-310,y:-210},{x:-225,y:-210},{x:0,y:-210},{x:270,y:-210},{x:270,y:10},{x:270,y:215}],color:'#f59e0b',layer:'路线层',spaceID:'F1-01',tags:['巡检'],x:0,y:0},
    {name:'逃生路线',code:'RT0003',mainType:'route',subType:'polyline',points:[{x:0,y:10},{x:-80,y:10},{x:-80,y:215},{x:-310,y:215}],color:'#ef4444',layer:'路线层',spaceID:'F1-01',tags:['安全','逃生'],x:0,y:0},
    // Areas
    {name:'办公区域',code:'AR0001',mainType:'area',subType:'rect',x:-0,y:-210,width:200,height:180,rotation:0,scale:1,color:'#3b82f6',layer:'区域层',spaceID:'F1-01',tags:['办公']},
    {name:'设备禁区',code:'AR0002',mainType:'area',subType:'rect',x:140,y:215,width:150,height:170,rotation:0,scale:1,color:'#ef4444',layer:'区域层',spaceID:'F1-01',tags:['限制']},
    {name:'休息区域',code:'AR0003',mainType:'area',subType:'polygon',points:[{x:-400,y:130},{x:-220,y:130},{x:-220,y:300},{x:-400,y:300}],color:'#10b981',layer:'区域层',spaceID:'F1-01',tags:['公共'],x:-310,y:215}
  ];
  demos.forEach(function(d){
    d.id=nextId++;
    d.location={x:d.x||0,y:d.y||0};
    d.width=d.width||0;
    d.height=d.height||0;
    d.rotation=d.rotation||0;
    d.scale=d.scale||1;
    d.tags=d.tags||[];
    objects.push(d);
  });
}

/* ========== Init ========== */
function init(){
  canvas=document.getElementById('canvas');
  ctx=canvas.getContext('2d');
  resize();
  window.addEventListener('resize',resize);
  loadDemoData();
  buildMaterials();
  buildLayerList();
  bindEvents();
  updateStatus();
  render();
}

function resize(){
  var wrap=canvas.parentElement;
  w=wrap.clientWidth;
  h=wrap.clientHeight;
  canvas.width=w;
  canvas.height=h;
  render();
}

/* ========== Material Panel ========== */
function buildMaterials(){
  var c=document.getElementById('materials');
  c.innerHTML='';
  Object.keys(materials).forEach(function(key){
    var g=materials[key];
    var gEl=document.createElement('div');
    gEl.className='mat-group';
    var hd=document.createElement('div');
    hd.className='mat-group-hd open';
    hd.innerHTML='<span class="arr">&#9654;</span> '+g.label;
    hd.onclick=function(){hd.classList.toggle('open');bd.classList.toggle('open');};
    var bd=document.createElement('div');
    bd.className='mat-group-bd open';
    g.items.forEach(function(item){
      var it=document.createElement('div');
      it.className='mat-item';
      it.draggable=true;
      it.innerHTML='<span class="ico">'+(icons[item.icon]||'')+'</span><span>'+item.label+'</span>';
      it.ondragstart=function(e){dragMaterial=item;e.dataTransfer.setData('text/plain',JSON.stringify(item));};
      it.onclick=function(){selectMaterial(item);};
      bd.appendChild(it);
    });
    gEl.appendChild(hd);
    gEl.appendChild(bd);
    c.appendChild(gEl);
  });
}

function selectMaterial(item){
  setTool(item.type==='point'?'point':item.type==='route'?'line':'rect');
  app._pendingMaterial=item;
}

/* ========== Layer Panel ========== */
function buildLayerList(){
  var list=document.getElementById('layerList');
  list.innerHTML='';
  Object.keys(layers).forEach(function(name){
    var item=document.createElement('div');
    item.className='layer-item'+(name==='Default'?' active':'');
    item.innerHTML='<span class="eye">'+(layers[name]?'&#128065;':'&#128068;')+'</span> '+name;
    item.onclick=function(e){
      if(e.target.classList.contains('eye')){layers[name]=!layers[name];buildLayerList();render();}
      else{document.querySelectorAll('.layer-item').forEach(function(el){el.classList.remove('active');});item.classList.add('active');}
    };
    list.appendChild(item);
  });
}

/* ========== Events ========== */
function bindEvents(){
  canvas.addEventListener('wheel',onWheel,{passive:false});
  canvas.addEventListener('mousedown',onMouseDown);
  canvas.addEventListener('mousemove',onMouseMove);
  canvas.addEventListener('mouseup',onMouseUp);
  canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
  canvas.addEventListener('dragover',function(e){e.preventDefault();});
  canvas.addEventListener('drop',onDrop);
  document.querySelectorAll('.tool-btn').forEach(function(btn){
    btn.onclick=function(){setTool(btn.getAttribute('data-tool'));};
  });
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
    switch(e.key.toLowerCase()){
      case 'v':setTool('select');break;
      case 'p':setTool('point');break;
      case 'l':setTool('line');break;
      case 'm':setTool('polyline');break;
      case 'r':setTool('rect');break;
      case 'g':setTool('polygon');break;
      case 'o':setTool('rotate');break;
      case 'delete':case 'backspace':if(selectedId)deleteObject(selectedId);break;
      case 'escape':cancelDraw();break;
    }
  });
  document.getElementById('searchInput').addEventListener('input',function(){app.onSearch(this.value);});
  document.getElementById('showName').addEventListener('change',function(){render();});
  document.getElementById('showCode').addEventListener('change',function(){render();});
  document.getElementById('showGrid').addEventListener('change',function(){render();});
  document.getElementById('showFloorPlan').addEventListener('change',function(){render();});
  // Property inputs
  ['pName','pCode','pX','pY','pRot','pScale','pColor','pMainType','pSubType','pSpaceID','pLayer'].forEach(function(id){
    var el=document.getElementById(id);
    el.addEventListener('change',function(){
      var key=id.replace('p','').replace('Rot','rotation').replace('Scale','scale').replace('MainType','mainType').replace('SubType','subType').replace('SpaceID','spaceID').replace('Layer','layer');
      var val=el.type==='number'?parseFloat(el.value):el.value;
      app.updateProp(key,val);
    });
  });
}

function setTool(t){
  tool=t;
  document.querySelectorAll('.tool-btn').forEach(function(btn){
    btn.classList.toggle('active',btn.getAttribute('data-tool')===t);
  });
  canvas.className=t==='select'?'':'';
  cancelDraw();
}

function screenToWorld(sx,sy){return{x:(sx-w/2)/camera.zoom-camera.x,y:(sy-h/2)/camera.zoom-camera.y};}
function worldToScreen(wx,wy){return{x:(wx+camera.x)*camera.zoom+w/2,y:(wy+camera.y)*camera.zoom+h/2};}

function onWheel(e){
  e.preventDefault();
  var factor=e.deltaY>0?0.92:1.08;
  camera.zoom=Math.max(0.05,Math.min(20,camera.zoom*factor));
  document.getElementById('zoomIndicator').textContent=Math.round(camera.zoom*100)+'%';
  render();
  updateStatus();
}

function onMouseDown(e){
  lastMouse={x:e.offsetX,y:e.offsetY};
  if(e.button===2){panning=true;canvas.classList.add('dragging');return;}
  var pos=screenToWorld(e.offsetX,e.offsetY);
  if(tool==='select'){
    var hit=hitTest(pos.x,pos.y);
    if(hit){selectedId=hit.id;dragging=true;dragStart={x:pos.x,y:pos.y,obj:hit};showProps(hit);}
    else{selectedId=null;hideProps();}
    render();return;
  }
  if(tool==='point'){
    var mat=app._pendingMaterial||{type:'point',subType:'circle'};
    createObject({mainType:'point',subType:mat.subType||'circle',x:pos.x,y:pos.y,rotation:0,scale:1,color:'#3b82f6',layer:'Default',name:'点位'+nextId,code:'PT'+String(nextId).padStart(4,'0')});
    return;
  }
  if(tool==='line'||tool==='polyline'){
    if(!drawing){drawing=true;drawPoints=[{x:pos.x,y:pos.y}];}
    else{drawPoints.push({x:pos.x,y:pos.y});if(tool==='line'&&drawPoints.length>=2)finishDraw();}
    render();return;
  }
  if(tool==='rect'||tool==='polygon'){
    if(!drawing){drawing=true;drawPoints=[{x:pos.x,y:pos.y}];dragStart={x:pos.x,y:pos.y};}
    else{
      if(tool==='rect'){drawPoints.push({x:pos.x,y:pos.y});finishDraw();}
      else{drawPoints.push({x:pos.x,y:pos.y});if(drawPoints.length>=3&&dist(drawPoints[0],drawPoints[drawPoints.length-1])<15/camera.zoom)finishDraw();}
    }
    render();return;
  }
  if(tool==='rotate'&&selectedId){
    var obj=objects.find(function(o){return o.id===selectedId;});
    if(obj){obj.rotation=(obj.rotation||0)+15;showProps(obj);render();}
  }
}

function onMouseMove(e){
  var dx=e.offsetX-lastMouse.x,dy=e.offsetY-lastMouse.y;
  lastMouse={x:e.offsetX,y:e.offsetY};
  if(panning){camera.x+=dx/camera.zoom;camera.y+=dy/camera.zoom;render();return;}
  if(dragging&&dragStart&&dragStart.obj){
    var pos=screenToWorld(e.offsetX,e.offsetY);
    var obj=dragStart.obj;
    if(obj.mainType==='point'||(obj.mainType==='area'&&obj.subType==='rect')){
      obj.x+=pos.x-dragStart.x;obj.y+=pos.y-dragStart.y;obj.location.x=obj.x;obj.location.y=obj.y;
    }else if(obj.points){
      var ox=pos.x-dragStart.x,oy=pos.y-dragStart.y;
      obj.points.forEach(function(p){p.x+=ox;p.y+=oy;});
    }
    dragStart.x=pos.x;dragStart.y=pos.y;
    showProps(obj);render();return;
  }
  if(drawing&&(tool==='rect'||tool==='polygon')){
    render();
    var pos=screenToWorld(e.offsetX,e.offsetY);
    var s=worldToScreen(drawPoints[0].x,drawPoints[0].y);
    var e2=worldToScreen(pos.x,pos.y);
    ctx.save();ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;ctx.setLineDash([6,4]);
    if(tool==='rect'){ctx.strokeRect(s.x,s.y,e2.x-s.x,e2.y-s.y);}
    else{ctx.beginPath();ctx.moveTo(s.x,s.y);for(var i=1;i<drawPoints.length;i++){var p=worldToScreen(drawPoints[i].x,drawPoints[i].y);ctx.lineTo(p.x,p.y);}ctx.lineTo(e2.x,e2.y);ctx.stroke();}
    ctx.restore();
  }
}

function onMouseUp(e){
  if(panning){panning=false;canvas.classList.remove('dragging');}
  if(dragging){dragging=false;dragStart=null;}
}

function onDrop(e){
  e.preventDefault();
  var item=dragMaterial;
  if(!item&&e.dataTransfer.getData('text/plain')){try{item=JSON.parse(e.dataTransfer.getData('text/plain'));}catch(ex){}}
  if(!item)return;
  var rect=canvas.getBoundingClientRect();
  var pos=screenToWorld(e.clientX-rect.left,e.clientY-rect.top);
  createObject({mainType:item.type,subType:item.subType,x:pos.x,y:pos.y,rotation:0,scale:1,color:item.type==='point'?'#3b82f6':item.type==='route'?'#10b981':'#f59e0b',layer:'Default',name:item.label+nextId,code:(item.type==='point'?'PT':item.type==='route'?'RT':'AR')+String(nextId).padStart(4,'0')});
  dragMaterial=null;
}

function cancelDraw(){drawing=false;drawPoints=[];render();}

function finishDraw(){
  if(tool==='line'||tool==='polyline'){
    createObject({mainType:'route',subType:tool==='line'?'line':'polyline',points:drawPoints.slice(),color:'#10b981',layer:'Default',name:'路线'+nextId,code:'RT'+String(nextId).padStart(4,'0')});
  }else if(tool==='rect'){
    var p0=drawPoints[0],p1=drawPoints[1];
    createObject({mainType:'area',subType:'rect',x:(p0.x+p1.x)/2,y:(p0.y+p1.y)/2,width:Math.abs(p1.x-p0.x),height:Math.abs(p1.y-p0.y),rotation:0,scale:1,color:'#f59e0b',layer:'Default',name:'矩形'+nextId,code:'AR'+String(nextId).padStart(4,'0')});
  }else if(tool==='polygon'){
    createObject({mainType:'area',subType:'polygon',points:drawPoints.slice(),color:'#f59e0b',layer:'Default',name:'多边形'+nextId,code:'AR'+String(nextId).padStart(4,'0')});
  }
  drawing=false;drawPoints=[];
}

function dist(a,b){return Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y));}

/* ========== Object CRUD ========== */
function createObject(props){
  var obj={id:nextId++,name:props.name||'未命名',code:props.code||'ID'+nextId,location:{x:props.x||0,y:props.y||0},rotation:props.rotation||0,scale:props.scale||1,color:props.color||'#3b82f6',mainType:props.mainType||'point',subType:props.subType||'circle',tags:props.tags||[],layer:props.layer||'Default',spaceID:props.spaceID||'',x:props.x||0,y:props.y||0,width:props.width||0,height:props.height||0,points:props.points||null};
  objects.push(obj);
  if(!layers[obj.layer])layers[obj.layer]=true;
  buildLayerList();selectedId=obj.id;showProps(obj);render();updateStatus();
}

function deleteObject(id){
  objects=objects.filter(function(o){return o.id!==id;});
  if(selectedId===id){selectedId=null;hideProps();}
  render();updateStatus();
}

function hitTest(wx,wy){
  for(var i=objects.length-1;i>=0;i--){
    var o=objects[i];
    if(!layers[o.layer])continue;
    var sx=(wx+camera.x)*camera.zoom+w/2;
    var sy=(wy+camera.y)*camera.zoom+h/2;
    if(o.mainType==='point'){
      var s=worldToScreen(o.x,o.y);
      var r=14*camera.zoom*(o.scale||1);
      if(Math.abs(s.x-sx)<r&&Math.abs(s.y-sy)<r)return o;
    }else if(o.mainType==='area'&&o.subType==='rect'){
      var s=worldToScreen(o.x,o.y);
      var hw=(o.width/2)*camera.zoom*(o.scale||1);
      var hh=(o.height/2)*camera.zoom*(o.scale||1);
      if(Math.abs(s.x-sx)<hw&&Math.abs(s.y-sy)<hh)return o;
    }else if(o.points){
      var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
      o.points.forEach(function(p){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);});
      var s1=worldToScreen(minX,minY),s2=worldToScreen(maxX,maxY);
      if(sx>=s1.x-10&&sx<=s2.x+10&&sy>=s1.y-10&&sy<=s2.y+10)return o;
    }
  }
  return null;
}

/* ========== Render ========== */
function render(){
  var showN=document.getElementById('showName').checked;
  var showC=document.getElementById('showCode').checked;
  var showG=document.getElementById('showGrid').checked;
  var showF=document.getElementById('showFloorPlan').checked;

  ctx.clearRect(0,0,w,h);

  // Background gradient
  var grad=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*0.7);
  grad.addColorStop(0,'#0f172a');
  grad.addColorStop(1,'#0b1220');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,w,h);

  // Grid
  if(showG){
    ctx.save();
    var step=50;
    var s=worldToScreen(0,0);
    var offX=((s.x%(step*camera.zoom))+(step*camera.zoom))%(step*camera.zoom);
    var offY=((s.y%(step*camera.zoom))+(step*camera.zoom))%(step*camera.zoom);
    ctx.strokeStyle='#1e293b';ctx.lineWidth=1;
    for(var x=offX;x<w;x+=step*camera.zoom){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(var y=offY;y<h;y+=step*camera.zoom){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    // Major grid
    var majorStep=200;
    var mOffX=((s.x%(majorStep*camera.zoom))+(majorStep*camera.zoom))%(majorStep*camera.zoom);
    var mOffY=((s.y%(majorStep*camera.zoom))+(majorStep*camera.zoom))%(majorStep*camera.zoom);
    ctx.strokeStyle='#263348';ctx.lineWidth=1;
    for(var x=mOffX;x<w;x+=majorStep*camera.zoom){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(var y=mOffY;y<h;y+=majorStep*camera.zoom){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    ctx.restore();
  }

  // Floor plan
  if(showF){
    ctx.save();
    floorPlan.rooms.forEach(function(r){
      var s=worldToScreen(r.x,r.y);
      var sw=r.w*camera.zoom;
      var sh=r.h*camera.zoom;
      ctx.fillStyle=r.color;
      ctx.fillRect(s.x,s.y,sw,sh);
      ctx.strokeStyle='#334155';
      ctx.lineWidth=1.5;
      ctx.strokeRect(s.x,s.y,sw,sh);
      // Room label
      ctx.fillStyle='#475569';
      ctx.font=(11*Math.min(camera.zoom,1.5))+'px sans-serif';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(r.label,s.x+sw/2,s.y+sh/2);
    });
    ctx.restore();
  }

  // Objects
  objects.forEach(function(o){
    if(!layers[o.layer])return;
    drawObject(o);
    if(o.id===selectedId)drawSelection(o);
    if(showN||showC)drawLabel(o,showN,showC);
  });

  // Drawing preview
  if(drawing&&drawPoints.length>0){
    ctx.save();
    ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;ctx.setLineDash([6,4]);
    ctx.fillStyle='rgba(59,130,246,0.1)';
    var s0=worldToScreen(drawPoints[0].x,drawPoints[0].y);
    if(tool==='line'||tool==='polyline'){
      ctx.beginPath();ctx.moveTo(s0.x,s0.y);
      for(var i=1;i<drawPoints.length;i++){var p=worldToScreen(drawPoints[i].x,drawPoints[i].y);ctx.lineTo(p.x,p.y);}
      ctx.stroke();
      // Draw points
      drawPoints.forEach(function(p){var s=worldToScreen(p.x,p.y);ctx.beginPath();ctx.arc(s.x,s.y,4,0,Math.PI*2);ctx.fillStyle='#3b82f6';ctx.fill();});
    }
    ctx.restore();
  }
}

function drawObject(o){
  ctx.save();
  var s=worldToScreen(o.x,o.y);
  ctx.translate(s.x,s.y);
  ctx.rotate((o.rotation||0)*Math.PI/180);
  var sc=o.scale||1;
  ctx.scale(sc,sc);
  ctx.fillStyle=o.color;
  ctx.strokeStyle=o.color;
  ctx.lineWidth=Math.max(1,2/sc);

  if(o.mainType==='point'){
    var r=10;
    // Glow effect
    ctx.shadowColor=o.color;
    ctx.shadowBlur=8*sc;
    if(o.subType==='circle'){
      ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
    }else if(o.subType==='circleScale'){
      ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=o.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r+4,0,Math.PI*2);ctx.stroke();
    }else if(o.subType==='cone'){
      ctx.beginPath();ctx.moveTo(0,-r*1.5);ctx.lineTo(r,r);ctx.lineTo(-r,r);ctx.closePath();ctx.fill();
    }else if(o.subType==='rectDir'){
      ctx.fillRect(-r,-r*0.6,r*2,r*1.2);
      ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(r+8,-5);ctx.lineTo(r+8,5);ctx.closePath();ctx.fill();
    }else if(o.subType==='arrow'){
      ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r,0);ctx.stroke();
      ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(r-6,-5);ctx.lineTo(r-6,5);ctx.closePath();ctx.fill();
    }else if(o.subType==='station'){
      ctx.fillRect(-r,-r*1.3,r*2,r*2.6);
      ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(-r+3,-r*1.3+3,r*2-6,r*2.6-6);
    }
    ctx.shadowBlur=0;
  }else if(o.mainType==='route'){
    if(o.points&&o.points.length>=2){
      ctx.lineWidth=Math.max(1.5,2.5/sc);
      ctx.shadowColor=o.color;ctx.shadowBlur=4*sc;
      ctx.beginPath();
      var p0=worldToScreen(o.points[0].x,o.points[0].y);
      ctx.moveTo(p0.x-s.x,p0.y-s.y);
      for(var i=1;i<o.points.length;i++){
        var pi=worldToScreen(o.points[i].x,o.points[i].y);
        ctx.lineTo(pi.x-s.x,pi.y-s.y);
      }
      ctx.stroke();
      // Draw direction arrows along the path
      ctx.shadowBlur=0;
      for(var i=0;i<o.points.length-1;i++){
        var pa=worldToScreen(o.points[i].x,o.points[i].y);
        var pb=worldToScreen(o.points[i+1].x,o.points[i+1].y);
        var mx=(pa.x+pb.x)/2-s.x,my=(pa.y+pb.y)/2-s.y;
        var angle=Math.atan2(pb.y-pa.y,pb.x-pa.x);
        ctx.save();ctx.translate(mx,my);ctx.rotate(angle);
        ctx.fillStyle=o.color;ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-2,-4);ctx.lineTo(-2,4);ctx.closePath();ctx.fill();
        ctx.restore();
      }
    }
  }else if(o.mainType==='area'){
    ctx.shadowColor=o.color;ctx.shadowBlur=6*sc;
    if(o.subType==='rect'){
      ctx.fillStyle=o.color+'33';
      ctx.fillRect(-o.width/2,-o.height/2,o.width,o.height);
      ctx.strokeStyle=o.color;ctx.lineWidth=Math.max(1,2/sc);
      ctx.strokeRect(-o.width/2,-o.height/2,o.width,o.height);
    }else if(o.points&&o.points.length>=3){
      ctx.fillStyle=o.color+'33';
      ctx.beginPath();
      var p0=worldToScreen(o.points[0].x,o.points[0].y);
      ctx.moveTo(p0.x-s.x,p0.y-s.y);
      for(var i=1;i<o.points.length;i++){
        var pi=worldToScreen(o.points[i].x,o.points[i].y);
        ctx.lineTo(pi.x-s.x,pi.y-s.y);
      }
      ctx.closePath();ctx.fill();
      ctx.strokeStyle=o.color;ctx.lineWidth=Math.max(1,2/sc);ctx.stroke();
    }
    ctx.shadowBlur=0;
  }
  ctx.restore();
}

function drawSelection(o){
  ctx.save();
  var s=worldToScreen(o.x,o.y);
  ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.setLineDash([5,3]);
  ctx.shadowColor='#fbbf24';ctx.shadowBlur=6;
  if(o.mainType==='point'){
    var r=16*(o.scale||1);
    ctx.beginPath();ctx.arc(s.x,s.y,r*camera.zoom,0,Math.PI*2);ctx.stroke();
    // Corner handles
    ctx.setLineDash([]);ctx.fillStyle='#fbbf24';
    var hr=4;
    [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(function(d){
      ctx.beginPath();ctx.arc(s.x+d[0]*r*camera.zoom,s.y+d[1]*r*camera.zoom,hr,0,Math.PI*2);ctx.fill();
    });
  }else if(o.mainType==='area'&&o.subType==='rect'){
    var hw=(o.width/2)*camera.zoom*(o.scale||1);
    var hh=(o.height/2)*camera.zoom*(o.scale||1);
    ctx.strokeRect(s.x-hw-4,s.y-hh-4,hw*2+8,hh*2+8);
  }else if(o.points){
    var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    o.points.forEach(function(p){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);});
    var s1=worldToScreen(minX,minY),s2=worldToScreen(maxX,maxY);
    ctx.strokeRect(s1.x-4,s1.y-4,s2.x-s1.x+8,s2.y-s1.y+8);
  }
  ctx.restore();
}

function drawLabel(o,showN,showC){
  if(!showN&&!showC)return;
  ctx.save();
  var s=worldToScreen(o.x,o.y);
  var text='';
  if(showN&&showC)text=o.name+' | '+o.code;
  else if(showN)text=o.name;
  else text=o.code;
  var fs=labelFontSize*Math.min(camera.zoom,2);
  ctx.font='500 '+fs+'px "Noto Sans CJK SC","WenQuanYi Micro Hei",sans-serif';
  var tw=ctx.measureText(text).width;
  var px=4,py=2;
  var offset=o.mainType==='point'?20*camera.zoom*(o.scale||1):12*camera.zoom;
  var lx=s.x-tw/2-px;
  var ly=s.y+offset-py;
  // Background pill
  ctx.fillStyle='rgba(15,23,42,0.85)';
  ctx.beginPath();
  var rr=4;
  var bw=tw+px*2,bh=fs+py*2;
  ctx.moveTo(lx+rr,ly);ctx.lineTo(lx+bw-rr,ly);ctx.quadraticCurveTo(lx+bw,ly,lx+bw,ly+rr);
  ctx.lineTo(lx+bw,ly+bh-rr);ctx.quadraticCurveTo(lx+bw,ly+bh,lx+bw-rr,ly+bh);
  ctx.lineTo(lx+rr,ly+bh);ctx.quadraticCurveTo(lx,ly+bh,lx,ly+bh-rr);
  ctx.lineTo(lx,ly+rr);ctx.quadraticCurveTo(lx,ly,lx+rr,ly);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(59,130,246,0.3)';ctx.lineWidth=1;ctx.stroke();
  // Text
  ctx.fillStyle='#e2e8f0';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,s.x,s.y+offset+fs/2);
  ctx.restore();
}

/* ========== Props Panel ========== */
function showProps(o){
  document.getElementById('selectedProps').style.display='block';
  document.getElementById('noSelection').style.display='none';
  document.getElementById('pName').value=o.name||'';
  document.getElementById('pCode').value=o.code||'';
  document.getElementById('pX').value=(o.x||0).toFixed(1);
  document.getElementById('pY').value=(o.y||0).toFixed(1);
  document.getElementById('pRot').value=(o.rotation||0).toFixed(0);
  document.getElementById('pScale').value=(o.scale||1).toFixed(1);
  document.getElementById('pColor').value=o.color||'#3b82f6';
  document.getElementById('pMainType').value=o.mainType||'point';
  document.getElementById('pSubType').value=o.subType||'';
  document.getElementById('pSpaceID').value=o.spaceID||'';
  document.getElementById('pLayer').value=o.layer||'Default';
  renderTags(o.tags||[]);
}

function hideProps(){
  document.getElementById('selectedProps').style.display='none';
  document.getElementById('noSelection').style.display='block';
}

function renderTags(tags){
  var c=document.getElementById('pTags');c.innerHTML='';
  (tags||[]).forEach(function(tag,idx){
    var el=document.createElement('div');el.className='prop-tag';
    el.innerHTML='<span>'+tag+'</span><span class="del" onclick="app.removeTag('+idx+')">&times;</span>';
    c.appendChild(el);
  });
}

/* ========== Import / Export ========== */
function exportSample(){
  var sample={version:1,objects:[
    {name:'示例点位',code:'PT0001',mainType:'point',subType:'circle',x:100,y:100,rotation:0,scale:1,color:'#3b82f6',layer:'Default',spaceID:'F1',tags:['入口']},
    {name:'示例路线',code:'RT0001',mainType:'route',subType:'line',points:[{x:0,y:0},{x:200,y:100}],color:'#10b981',layer:'Default',spaceID:'F1',tags:['主通道']},
    {name:'示例区域',code:'AR0001',mainType:'area',subType:'rect',x:300,y:200,width:150,height:100,rotation:0,scale:1,color:'#f59e0b',layer:'Default',spaceID:'F1',tags:['办公区']}
  ]};
  var blob=new Blob([JSON.stringify(sample,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sample_import.json';a.click();
}

function showImportModal(){document.getElementById('importModal').classList.add('show');}

function doImport(){
  var text=document.getElementById('importArea').value;
  try{
    var data=JSON.parse(text);
    if(data.objects){
      data.objects.forEach(function(o){o.id=nextId++;if(!o.layer)o.layer='Default';o.location={x:o.x||0,y:o.y||0};objects.push(o);if(!layers[o.layer])layers[o.layer]=true;});
      buildLayerList();render();updateStatus();
    }
    document.getElementById('importModal').classList.remove('show');
    document.getElementById('importArea').value='';
  }catch(e){alert('导入失败: '+e.message);}
}

function exportData(){
  var data={version:1,objects:objects.map(function(o){return{name:o.name,code:o.code,mainType:o.mainType,subType:o.subType,x:o.x,y:o.y,rotation:o.rotation,scale:o.scale,color:o.color,layer:o.layer,spaceID:o.spaceID,tags:o.tags,width:o.width,height:o.height,points:o.points};})};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='map_impl_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}

function clearAll(){
  if(!confirm('确定清空所有对象?'))return;
  objects=[];selectedId=null;hideProps();render();updateStatus();
}

/* ========== Search ========== */
function onSearch(q){
  if(!q){return;}
  q=q.toLowerCase();
  for(var i=0;i<objects.length;i++){
    var o=objects[i];
    if((o.name&&o.name.toLowerCase().indexOf(q)>=0)||(o.code&&o.code.toLowerCase().indexOf(q)>=0)){
      selectedId=o.id;camera.x=-o.x;camera.y=-o.y;showProps(o);render();return;
    }
  }
}

/* ========== Update Prop ========== */
function updateProp(key,value){
  var obj=objects.find(function(o){return o.id===selectedId;});
  if(!obj)return;
  obj[key]=value;
  if(key==='x'||key==='y'){obj.location.x=obj.x;obj.location.y=obj.y;}
  if(key==='layer'&&!layers[value]){layers[value]=true;buildLayerList();}
  render();
}

function addTag(){
  var tag=prompt('输入标签:');if(!tag)return;
  var obj=objects.find(function(o){return o.id===selectedId;});if(!obj)return;
  obj.tags=obj.tags||[];obj.tags.push(tag);showProps(obj);render();
}

function removeTag(idx){
  var obj=objects.find(function(o){return o.id===selectedId;});if(!obj)return;
  obj.tags.splice(idx,1);showProps(obj);render();
}

function updateStatus(){
  document.getElementById('statusText').textContent='就绪 | 缩放: '+Math.round(camera.zoom*100)+'% | 对象: '+objects.length;
}

/* ========== Public API ========== */
window.app={
  exportSample:exportSample,showImportModal:showImportModal,doImport:doImport,
  exportData:exportData,clearAll:clearAll,onSearch:onSearch,updateProp:updateProp,
  addTag:addTag,removeTag:removeTag,render:render,_pendingMaterial:null
};

document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body>
</html>
