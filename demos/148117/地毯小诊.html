<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>地毯小诊</title>
  <style>
    :root {
      --bg-primary: #f8f5f0;
      --bg-card: #ffffff;
      --text-primary: #333333;
      --text-secondary: #666666;
      --accent: #4a6fa5;
      --accent-light: #dce7f2;
      --border: #e6e2dc;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --radius: 12px;
      --transition: all 0.3s ease;
    }

    .dark-mode {
      --bg-primary: #2a2d34;
      --bg-card: #3a3f4a;
      --text-primary: #f0f0f0;
      --text-secondary: #b8b8c4;
      --accent: #7aa4d3;
      --accent-light: #4a6fa5;
      --border: #4a4f5a;
      --shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      padding: 24px 0;
      position: relative;
    }

    .header-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--accent), #6a8bc5);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .header-subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
      font-weight: 400;
    }

    .theme-toggle {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent-light);
      color: white;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: var(--transition);
      z-index: 10;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      background: var(--accent);
    }

    /* Main Card */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      margin: 24px 0;
      transition: var(--transition);
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
    }

    .slider-group {
      margin-bottom: 24px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .slider-container {
      position: relative;
      height: 40px;
      margin: 12px 0;
    }

    .slider-track {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      transform: translateY(-50%);
    }

    .slider-fill {
      position: absolute;
      top: 50%;
      left: 0;
      height: 6px;
      background: var(--accent);
      border-radius: 3px;
      transform: translateY(-50%);
      transition: width 0.3s ease;
    }

    .slider-handle {
      position: absolute;
      top: 50%;
      width: 24px;
      height: 24px;
      background: var(--accent);
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: var(--transition);
      z-index: 2;
    }

    .slider-handle:hover {
      transform: translate(-50%, -50%) scale(1.1);
    }

    .slider-value {
      text-align: center;
      font-weight: 600;
      margin-top: 8px;
      color: var(--accent);
      font-size: 1.1rem;
      min-height: 24px;
    }

    /* Result Card */
    .result-card {
      background: #f9fbff;
      border-left: 4px solid var(--accent);
      padding: 16px;
      border-radius: 0 var(--radius) var(--radius) 0;
      margin-top: 24px;
      display: none;
    }

    .result-title {
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .steps-list {
      list-style: none;
      padding: 0;
    }

    .step-item {
      display: flex;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px dashed var(--border);
    }

    .step-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .step-icon {
      width: 36px;
      height: 36px;
      background: var(--accent-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
      color: var(--accent);
      font-weight: bold;
      font-size: 1rem;
    }

    .step-text {
      flex: 1;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .step-time {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
      white-space: nowrap;
      margin-left: 8px;
      padding: 2px 8px;
      background: rgba(74, 111, 165, 0.1);
      border-radius: 12px;
    }

    /* Footer hint */
    .hint {
      text-align: center;
      margin-top: 24px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      padding: 12px;
      background: rgba(74, 111, 165, 0.04);
      border-radius: 8px;
      font-style: italic;
    }

    /* Responsive */
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      .header-title {
        font-size: 1.5rem;
      }
      .card {
        padding: 20px;
      }
      .slider-container {
        height: 32px;
      }
      .slider-handle {
        width: 20px;
        height: 20px;
      }
      .step-item {
        flex-direction: column;
      }
      .step-icon {
        margin-right: 0;
        margin-bottom: 8px;
      }
      .step-time {
        margin-left: 0;
      }
    }

    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result-card.show {
      animation: fadeIn 0.4s ease-out forwards;
      display: block;
    }

    /* Hide scrollbar for slider track */
    .slider-container::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色模式">☀️</button>
      <h1 class="header-title">地毯小诊</h1>
      <p class="header-subtitle">拍一拍脏处，30秒获专属清洁方案｜不用记、不乱喷、不伤毯</p>
    </header>

    <main>
      <div class="card">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          告别猜错清洁法
        </h2>

        <div class="slider-group">
          <div class="slider-label">
            <span>污渍类型</span>
            <span id="stainValue">咖啡渍</span>
          </div>
          <div class="slider-container" id="stainSlider">
            <div class="slider-track"></div>
            <div class="slider-fill" style="width: 20%"></div>
            <div class="slider-handle" style="left: 20%"></div>
          </div>
          <div class="slider-value" id="stainDesc">冷敷 + 吸干，禁用热水</div>
        </div>

        <div class="slider-group">
          <div class="slider-label">
            <span>地毯材质</span>
            <span id="materialValue">仿羊毛短绒</span>
          </div>
          <div class="slider-container" id="materialSlider">
            <div class="slider-track"></div>
            <div class="slider-fill" style="width: 40%"></div>
            <div class="slider-handle" style="left: 40%"></div>
          </div>
          <div class="slider-value" id="materialDesc">可用中性清洁剂，禁用漂白水</div>
        </div>

        <div class="result-card" id="resultCard">
          <h3 class="result-title">
            <svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            您的专属清洁方案
          </h3>
          <ul class="steps-list" id="stepsList">
            <!-- Steps will be injected here -->
          </ul>
        </div>

        <p class="hint">💡 小贴士：方案基于您选择的污渍与材质组合生成，真实清洁请优先参考地毯背面标签说明</p>
      </div>
    </main>
  </div>

  <script>
    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;

    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      body.classList.add('dark-mode');
      themeToggle.innerHTML = '🌙';
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      themeToggle.innerHTML = body.classList.contains('dark-mode') ? '☀️' : '🌙';
    });

    // Slider data
    const stainOptions = [
      { value: '咖啡渍', desc: '冷敷 + 吸干，禁用热水', steps: [
        { icon: '1', text: '用冰袋冷敷5分钟，凝固表面残留', time: '5分' },
        { icon: '2', text: '纸巾轻压吸干，勿揉擦', time: '1分' },
        { icon: '3', text: '棉布蘸冷水轻拍，至无色渍渗出', time: '2分' }
      ]},
      { value: '宠物尿味', desc: '酶解 + 通风，禁用消毒水', steps: [
        { icon: '1', text: '吸干余液后，喷专用酶清洁剂', time: '1分' },
        { icon: '2', text: '静置2小时（室温≥20℃）', time: '2小时' },
        { icon: '3', text: '开窗通风+风扇吹干', time: '30分' }
      ]},
      { value: '油渍', desc: '吸油粉 + 刷除，禁用溶剂', steps: [
        { icon: '1', text: '撒玉米淀粉覆盖，静置1小时', time: '1小时' },
        { icon: '2', text: '软毛刷顺绒向轻刷', time: '2分' },
        { icon: '3', text: '吸尘器吸净粉末', time: '1分' }
      ]},
      { value: '呕吐物', desc: '刮除 + 酶解，禁用醋', steps: [
        { icon: '1', text: '硬卡刮去固体，勿按压', time: '1分' },
        { icon: '2', text: '喷稀释酶清洁剂，静置30分钟', time: '30分' },
        { icon: '3', text: '微湿布轻拍，晾干', time: '自然晾干' }
      ]},
      { value: '灰尘结块', desc: '干刷 + 吸尘，禁用湿拖', steps: [
        { icon: '1', text: '鬃毛刷逆绒向干刷松动浮尘', time: '3分' },
        { icon: '2', text: '吸尘器低档+扁吸头吸净', time: '2分' },
        { icon: '3', text: '刷后通风10分钟', time: '10分' }
      ]}
    ];

    const materialOptions = [
      { value: '仿羊毛短绒', desc: '可用中性清洁剂，禁用漂白水' },
      { value: '尼龙绒', desc: '耐碱性强，可用稀释肥皂水' },
      { value: '剑麻', desc: '只宜干刷，遇水易硬化' },
      { value: '纯羊毛', desc: '需专业pH6.5以下清洁剂' },
      { value: '化纤混纺', desc: '通用中性剂，忌高温蒸汽' }
    ];

    // DOM elements
    const stainSlider = document.getElementById('stainSlider');
    const materialSlider = document.getElementById('materialSlider');
    const stainValueEl = document.getElementById('stainValue');
    const materialValueEl = document.getElementById('materialValue');
    const stainDescEl = document.getElementById('stainDesc');
    const materialDescEl = document.getElementById('materialDesc');
    const resultCard = document.getElementById('resultCard');
    const stepsList = document.getElementById('stepsList');

    // Initialize sliders
    let stainIndex = 0;
    let materialIndex = 0;

    function updateSliders() {
      // Stain slider
      const stainTrack = stainSlider.querySelector('.slider-track');
      const stainFill = stainSlider.querySelector('.slider-fill');
      const stainHandle = stainSlider.querySelector('.slider-handle');
      
      const stainWidth = `${(stainIndex / (stainOptions.length - 1)) * 100}%`;
      stainFill.style.width = stainWidth;
      stainHandle.style.left = stainWidth;

      stainValueEl.textContent = stainOptions[stainIndex].value;
      stainDescEl.textContent = stainOptions[stainIndex].desc;

      // Material slider
      const materialTrack = materialSlider.querySelector('.slider-track');
      const materialFill = materialSlider.querySelector('.slider-fill');
      const materialHandle = materialSlider.querySelector('.slider-handle');
      
      const materialWidth = `${(materialIndex / (materialOptions.length - 1)) * 100}%`;
      materialFill.style.width = materialWidth;
      materialHandle.style.left = materialWidth;

      materialValueEl.textContent = materialOptions[materialIndex].value;
      materialDescEl.textContent = materialOptions[materialIndex].desc;

      // Generate & show result
      const stain = stainOptions[stainIndex];
      const material = materialOptions[materialIndex];
      const combinedSteps = stain.steps.map((step, i) => ({
        ...step,
        text: step.text + (i === 0 ? `（${material.desc}）` : '')
      }));

      stepsList.innerHTML = '';
      combinedSteps.forEach(step => {
        const li = document.createElement('li');
        li.className = 'step-item';
        li.innerHTML = `
          <div class="step-icon">${step.icon}</div>
          <div class="step-text">${step.text}</div>
          <div class="step-time">${step.time}</div>
        `;
        stepsList.appendChild(li);
      });

      resultCard.classList.add('show');
    }

    // Slider drag logic
    function initSlider(sliderEl, setValue, setIndex, options) {
      const handle = sliderEl.querySelector('.slider-handle');
      const track = sliderEl.querySelector('.slider-track');
      let isDragging = false;

      handle.addEventListener('mousedown', () => {
        isDragging = true;
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const rect = track.getBoundingClientRect();
        let pos = (e.clientX - rect.left) / rect.width;
        pos = Math.max(0, Math.min(1, pos));
        const index = Math.round(pos * (options.length - 1));
        setValue(index);
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
      });

      // Touch support
      handle.addEventListener('touchstart', (e) => {
        e.preventDefault();
        isDragging = true;
      });

      document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const rect = track.getBoundingClientRect();
        const touch = e.touches[0];
        let pos = (touch.clientX - rect.left) / rect.width;
        pos = Math.max(0, Math.min(1, pos));
        const index = Math.round(pos * (options.length - 1));
        setValue(index);
      });

      document.addEventListener('touchend', () => {
        isDragging = false;
      });
    }

    initSlider(stainSlider, (idx) => {
      stainIndex = idx;
      updateSliders();
    }, stainOptions);

    initSlider(materialSlider, (idx) => {
      materialIndex = idx;
      updateSliders();
    }, materialOptions);

    // Initial render
    updateSliders();
  </script>
</body>
</html>
