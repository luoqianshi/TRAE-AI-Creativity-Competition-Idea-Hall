<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 芭比换装搭配助手</title>
<style>
:root{
  --hot:#ff5ca8;
  --pink:#ff8ec7;
  --light:#fff0f8;
  --lav:#c9b6ff;
  --purple:#a78bfa;
  --blue:#a5d8ff;
  --mint:#b7f5d6;
  --gold:#ffd166;
  --ink:#583544;
  --muted:#9b7a8a;
  --card:#ffffff;
  --shadow:0 18px 40px rgba(255,92,168,.22);
  --pop: cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 20% 0%, rgba(255,140,199,.35) 0%, transparent 35%),
    radial-gradient(circle at 80% 100%, rgba(167,139,250,.35) 0%, transparent 35%),
    linear-gradient(160deg,#fff5fa 0%,#f3ecff 50%,#eaf6ff 100%);
  min-height:100vh;
  overflow-x:hidden;
}
.sparkle{
  position:fixed;pointer-events:none;font-size:22px;opacity:.7;
  animation:float 5s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-25px) rotate(15deg)}
}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 40px}

/* header */
header{text-align:center;padding:34px 10px 18px;position:relative}
.logo{font-size:44px;animation:bob 2.6s ease-in-out infinite;display:inline-block}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1{
  font-size:34px;margin-top:8px;
  background:linear-gradient(90deg,var(--hot),var(--purple),var(--blue));
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 3s linear infinite;
}
@keyframes shine{to{background-position:200% center}}
.sub{color:var(--muted);font-size:15px;margin-top:6px}

/* main stage */
.stage{
  display:grid;grid-template-columns:1fr 1.3fr;gap:18px;
  margin-top:14px;
}
@media(max-width:760px){.stage{grid-template-columns:1fr}}

.card{
  background:var(--card);
  border-radius:28px;
  padding:20px;
  box-shadow:var(--shadow);
  border:1px solid #ffe3f0;
}

/* doll mirror */
.mirror-wrap{text-align:center}
.mirror{
  width:260px;height:320px;margin:10px auto 0;border-radius:50% 50% 45% 45% / 55% 55% 45% 45%;
  background:radial-gradient(circle at 50% 35%,#fff7fc 0%,#ffe6f3 60%,#ffd6e9 100%);
  border:6px solid #fff;
  box-shadow:0 10px 30px rgba(255,92,168,.25), inset 0 0 40px rgba(255,255,255,.8);
  position:relative;overflow:hidden;
}
.doll{
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;
}
.hair{font-size:64px;margin-bottom:-18px;z-index:5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.08))}
.face{font-size:42px;margin-bottom:-8px;z-index:6}
.dress-area{
  width:96px;height:116px;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,230,245,.6));
  border-radius:40% 40% 10% 10% / 20% 20% 8% 8%;
  display:flex;align-items:center;justify-content:center;font-size:58px;
  position:relative;z-index:4;
  box-shadow:inset 0 0 16px rgba(255,255,255,.8);
}
.shoes{font-size:30px;margin-top:-6px;z-index:3}
.acc-head{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:30px;z-index:7}
.acc-neck{position:absolute;top:118px;left:50%;transform:translateX(-50%);font-size:24px;z-index:7}
.mirror-name{
  margin-top:14px;font-size:16px;color:var(--hot);font-weight:700;
  background:var(--light);display:inline-block;padding:6px 18px;border-radius:999px;
}

/* controls */
.scenes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.scene{
  border:none;cursor:pointer;font-size:14px;font-weight:700;
  padding:10px 16px;border-radius:999px;
  background:#fff;border:2px solid #ffd6e9;color:var(--hot);
  transition:.2s var(--pop);
}
.scene:hover{transform:translateY(-3px);box-shadow:0 8px 16px rgba(255,92,168,.18)}
.scene.active{
  background:linear-gradient(90deg,var(--hot),var(--purple));
  color:#fff;border-color:transparent;
}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{
  border:none;cursor:pointer;padding:8px 14px;border-radius:999px;
  background:#f5efff;color:#7c5cbf;font-weight:700;font-size:13px;
  transition:.2s;
}
.tab.active{background:linear-gradient(90deg,var(--hot),var(--purple));color:#fff}

.wardrobe{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  max-height:210px;overflow-y:auto;padding-right:4px;
}
.wardrobe::-webkit-scrollbar{width:6px}
.wardrobe::-webkit-scrollbar-thumb{background:#ffd6e9;border-radius:999px}
.item{
  aspect-ratio:1;border-radius:18px;border:2px solid #ffe8f3;
  background:linear-gradient(135deg,#fff 0%,#fff5fa 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:28px;cursor:pointer;transition:.18s var(--pop);
  box-shadow:0 4px 10px rgba(255,92,168,.1);
}
.item:hover{transform:scale(1.08);border-color:var(--pink)}
.item small{font-size:10px;color:var(--muted);margin-top:2px}
.item.equipped{border-color:var(--hot);background:#fff0f8;box-shadow:0 0 0 3px rgba(255,92,168,.15)}

.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{
  flex:1;min-width:120px;border:none;cursor:pointer;font-size:15px;font-weight:800;
  padding:13px 18px;border-radius:999px;color:#fff;
  background:linear-gradient(90deg,var(--hot),var(--purple));
  box-shadow:0 10px 20px rgba(255,92,168,.3);
  transition:.2s var(--pop);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(255,92,168,.38)}
.btn.secondary{background:#fff;color:var(--hot);border:2px solid #ffd6e9;box-shadow:none}
.btn.secondary:hover{background:var(--light)}

.result{
  margin-top:14px;background:var(--light);border-radius:20px;padding:14px 16px;
  border:1px dashed #ffcce3;
}
.result-title{font-weight:800;color:var(--hot);font-size:15px;margin-bottom:6px}
.result p{font-size:14px;color:#6b4d5b;margin-bottom:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:#fff;color:var(--hot);border:1px solid #ffd6e9;border-radius:999px;padding:3px 11px;font-size:12px}

.saved-toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:#fff;border:2px solid var(--pink);border-radius:999px;
  padding:12px 22px;font-weight:800;color:var(--hot);box-shadow:var(--shadow);
  transition:.4s var(--pop);z-index:100;
}
.saved-toast.show{transform:translateX(-50%) translateY(0)}

.confetti{
  position:fixed;pointer-events:none;width:10px;height:10px;border-radius:50%;
  animation:confetti-fall 1.2s ease-out forwards;
}
@keyframes confetti-fall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(260px) rotate(720deg);opacity:0}
}

footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
</style>
</head>
<body>

<div class="sparkle" style="top:10%;left:8%">✨</div>
<div class="sparkle" style="top:18%;right:10%;animation-delay:1s">💖</div>
<div class="sparkle" style="top:60%;left:4%;animation-delay:2s">🌟</div>
<div class="sparkle" style="top:70%;right:6%;animation-delay:.5s">🎀</div>

<div class="wrap">
  <header>
    <div class="logo">🪄🎀</div>
    <h1>AI 芭比换装搭配助手</h1>
    <p class="sub">给小芭比一个魔法衣橱，点一点就能变出漂亮造型 ✨</p>
  </header>

  <div class="stage">
    <!-- 左侧：魔法镜子里的娃娃 -->
    <div class="card mirror-wrap">
      <div class="mirror">
        <div class="doll">
          <div class="acc-head" id="accHead"></div>
          <div class="hair" id="hair">👩‍🦰</div>
          <div class="face" id="face">🙂</div>
          <div class="dress-area" id="dressArea">👗</div>
          <div class="acc-neck" id="accNeck"></div>
          <div class="shoes" id="shoes">🩰</div>
        </div>
      </div>
      <div class="mirror-name" id="lookName">甜美公主风</div>
    </div>

    <!-- 右侧：衣橱与操作 -->
    <div class="card">
      <p style="font-size:13px;color:var(--muted);margin-bottom:10px">先选一个场景吧 👇</p>
      <div class="scenes" id="scenes"></div>

      <p style="font-size:13px;color:var(--muted);margin:14px 0 10px">打开衣橱挑选单品 💄</p>
      <div class="tabs" id="tabs"></div>
      <div class="wardrobe" id="wardrobe"></div>

      <div class="actions">
        <button class="btn" id="aiBtn">✨ AI 一键搭配</button>
        <button class="btn secondary" id="saveBtn">💾 收藏造型</button>
        <button class="btn secondary" id="randomBtn">🎲 随机换装</button>
      </div>

      <div class="result" id="result">
        <div class="result-title">💡 搭配师悄悄话</div>
        <p id="reasonText">粉色蓬蓬裙配小皇冠，最适合生日派对的主角时刻！</p>
        <div class="tags" id="tags"></div>
      </div>
    </div>
  </div>

  <footer>让每个小女孩的娃娃，都有专属 AI 造型师 💕</footer>
</div>

<div class="saved-toast" id="toast">🎉 造型已收藏到心愿本！</div>

<script>
const wardrobeData={
  发型:[{e:'👩‍🦰',n:'棕卷发',tags:['日常']},{e:'👱‍♀️',n:'金发',tags:['公主']},{e:'👩‍🦳',n:'银长发',tags:['梦幻']},{e:'👧',n:'黑短发',tags:['学院']}],
  上衣:[{e:'👚',n:'白衬衫',tags:['学院','日常']},{e:'👕',n:'印花T恤',tags:['出游','日常']},{e:'🩱',n:'小背心',tags:['拍照','运动']},{e:'🧥',n:'小外套',tags:['出游','日常']}],
  裙子:[{e:'👗',n:'蓬蓬纱裙',tags:['公主','派对']},{e:'👘',n:'国风裙',tags:['拍照','独特']},{e:'👙',n:'泳衣',tags:['出游','清凉']},{e:'🩳',n:'小短裤',tags:['运动','日常']}],
  鞋子:[{e:'🩰',n:'芭蕾舞鞋',tags:['公主','日常']},{e:'👟',n:'小白鞋',tags:['学院','出游']},{e:'👠',n:'小高跟',tags:['派对','拍照']},{e:'🥿',n:'小皮鞋',tags:['学院','日常']}],
  配饰:[{e:'👑',n:'小皇冠',tags:['公主','派对']},{e:'🎀',n:'大蝴蝶结',tags:['甜美','日常']},{e:'🕶️',n:'墨镜',tags:['出游','酷']},{e:'💎',n:'宝石项链',tags:['派对','拍照']},{e:'👒',n:'草帽',tags:['出游','清凉']},{e:'🧦',n:'蕾丝袜',tags:['甜美','公主']}]
};

const scenes={
  生日派对:{prefer:['公主','派对','甜美'],name:'派对小公主',reason:'蓬蓬纱裙+小皇冠是派对主角标配，走到哪都是焦点！'},
  上学:{prefer:['学院','日常'],name:'元气小学妹',reason:'白衬衫+小皮鞋清爽利落，背起书包就能快乐出发。'},
  出游:{prefer:['出游','清凉','酷'],name:'活力旅行家',reason:'印花T恤+草帽防晒又出片，小白鞋走一天也不累。'},
  拍照:{prefer:['拍照','独特','甜美'],name:'甜酷小模特',reason:'国风裙配宝石项链，镜头里每一张都像大片。'},
  睡觉:{prefer:['日常','甜美'],name:'软糯安睡宝贝',reason:'柔软小背心+蕾丝袜，甜甜入梦的小可爱。'}
};

let currentScene='生日派对';
let current={发型:0,上衣:0,裙子:0,鞋子:0,配饰:null};
let activeTab='发型';

const scenesEl=document.getElementById('scenes');
const tabsEl=document.getElementById('tabs');
const wardrobeEl=document.getElementById('wardrobe');
const reasonText=document.getElementById('reasonText');
const lookName=document.getElementById('lookName');
const tagsEl=document.getElementById('tags');
const toast=document.getElementById('toast');

function renderScenes(){
  scenesEl.innerHTML=Object.keys(scenes).map(k=>{
    return `<button class="scene ${k===currentScene?'active':''}" data-k="${k}">${k}</button>`;
  }).join('');
  scenesEl.querySelectorAll('button').forEach(b=>b.onclick=()=>setScene(b.dataset.k));
}

function setScene(k){
  currentScene=k;
  renderScenes();
  aiMatch();
}

function renderTabs(){
  tabsEl.innerHTML=Object.keys(wardrobeData).map(cat=>{
    return `<button class="tab ${cat===activeTab?'active':''}" data-cat="${cat}">${cat}</button>`;
  }).join('');
  tabsEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeTab=b.dataset.cat;renderWardrobe();});
}

function renderWardrobe(){
  const list=wardrobeData[activeTab];
  wardrobeEl.innerHTML=list.map((it,i)=>{
    let equipped=false;
    if(activeTab==='配饰') equipped=current.配饰===i;
    else equipped=current[activeTab]===i;
    return `<div class="item ${equipped?'equipped':''}" data-i="${i}">${it.e}<small>${it.n}</small></div>`;
  }).join('');
  wardrobeEl.querySelectorAll('.item').forEach(el=>el.onclick=()=>equip(activeTab,parseInt(el.dataset.i)));
}

function equip(cat,i){
  if(cat==='配饰') current.配饰=current.配饰===i?null:i;
  else current[cat]=i;
  renderWardrobe();
  renderDoll();
  updateReasonByCurrent();
}

function renderDoll(){
  document.getElementById('hair').textContent=wardrobeData.发型[current.发型].e;
  document.getElementById('dressArea').textContent=wardrobeData.裙子[current.裙子].e;
  document.getElementById('shoes').textContent=wardrobeData.鞋子[current.鞋子].e;
  const acc=current.配饰!==null?wardrobeData.配饰[current.配饰]:null;
  if(acc && ['👑','🎀','👒'].includes(acc.e)){
    document.getElementById('accHead').textContent=acc.e;
    document.getElementById('accNeck').textContent='';
  }else if(acc){
    document.getElementById('accHead').textContent='';
    document.getElementById('accNeck').textContent=acc.e;
  }else{
    document.getElementById('accHead').textContent='';
    document.getElementById('accNeck').textContent='';
  }
}

function updateReasonByCurrent(){
  const s=scenes[currentScene];
  lookName.textContent=s.name;
  reasonText.textContent=s.reason;
  tagsEl.innerHTML=s.prefer.map(t=>`<span class="tag">#${t}</span>`).join('');
}

function aiMatch(){
  const prefer=scenes[currentScene].prefer;
  function score(i,it){return it.tags.filter(t=>prefer.includes(t)).length;}
  current.发型=wardrobeData.发型.map((it,i)=>[i,score(i,it)]).sort((a,b)=>b[1]-a[1])[0][0];
  current.裙子=wardrobeData.裙子.map((it,i)=>[i,score(i,it)]).sort((a,b)=>b[1]-a[1])[0][0];
  current.鞋子=wardrobeData.鞋子.map((it,i)=>[i,score(i,it)]).sort((a,b)=>b[1]-a[1])[0][0];
  const accScores=wardrobeData.配饰.map((it,i)=>[i,score(i,it)]).sort((a,b)=>b[1]-a[1]);
  current.配饰=accScores[0][1]>0?accScores[0][0]:null;
  renderWardrobe();
  renderDoll();
  updateReasonByCurrent();
}

function randomDress(){
  current.发型=Math.floor(Math.random()*wardrobeData.发型.length);
  current.裙子=Math.floor(Math.random()*wardrobeData.裙子.length);
  current.鞋子=Math.floor(Math.random()*wardrobeData.鞋子.length);
  current.配饰=Math.random()>.3?Math.floor(Math.random()*wardrobeData.配饰.length):null;
  renderWardrobe();
  renderDoll();
  const names=['闪闪小甜心','街头酷女孩','花园小公主','海边小精灵','童话女主角'];
  lookName.textContent=names[Math.floor(Math.random()*names.length)];
  reasonText.textContent='随机碰撞出的惊喜造型，每一套都独一无二！';
  tagsEl.innerHTML=['#随机搭配','#超好玩'].map(t=>`<span class="tag">${t}</span>`).join('');
}

function showToast(){
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),2200);
}

function confetti(){
  const colors=['#ff5ca8','#a78bfa','#ffd166','#b7f5d6','#a5d8ff'];
  for(let i=0;i<30;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=(Math.random()*100)+'vw';
    c.style.top='-20px';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay=(Math.random()*.5)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),1400);
  }
}

document.getElementById('aiBtn').onclick=aiMatch;
document.getElementById('randomBtn').onclick=randomDress;
document.getElementById('saveBtn').onclick=()=>{showToast();confetti();};

renderScenes();
renderTabs();
aiMatch();
</script>
</body>
</html>
