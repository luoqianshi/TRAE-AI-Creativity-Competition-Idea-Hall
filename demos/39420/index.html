<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>实体门店AI运营平台 - 首页</title>
  <style>
    :root {
      --bg-page: #F2F4F8;
      --bg-card: #FFFFFF;
      --bg-surface: #F8FAFC;
      --primary: #2563EB;
      --primary-light: #DBEAFE;
      --primary-gradient-start: #E0F2FE;
      --primary-gradient-end: #F2F4F8;
      --text-primary: #111827;
      --text-secondary: #4B5563;
      --text-tertiary: #9CA3AF;
      --text-tag: #D97706;
      --border: #E5E7EB;
      --badge-red: #EF4444;
      --badge-red-bg: #FEE2E2;
      --success: #10B981;
      --shadow-card: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-float: 0 -2px 10px rgba(0,0,0,0.04);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      overflow: hidden;
    }

    .app-container {
      max-width: 430px;
      margin: 0 auto;
      height: 100%;
      position: relative;
      background: var(--bg-page);
      display: flex;
      flex-direction: column;
    }

    .scroll-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      padding-bottom: calc(120px + env(safe-area-inset-bottom));
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #BFDBFE, #93C5FD);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .header-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .header-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .header-tag {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-tag);
      background: #FEF3C7;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .header-store {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      position: relative;
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
    }

    .badge-dot {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 7px;
      height: 7px;
      background: var(--badge-red);
      border-radius: 50%;
      border: 1.5px solid var(--bg-page);
    }

    /* Greeting */
    .greeting-section {
      background: linear-gradient(180deg, var(--primary-gradient-start) 0%, var(--primary-gradient-end) 100%);
      margin: -16px -16px 16px -16px;
      padding: 16px;
      padding-top: 4px;
    }

    .greeting-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ai-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3B82F6, #06B6D4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(37,99,235,0.25);
    }

    .ai-icon svg {
      width: 20px;
      height: 20px;
    }

    .greeting-text {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-badge {
      font-size: 12px;
      font-weight: 500;
      color: var(--badge-red);
      background: var(--badge-red-bg);
      padding: 3px 10px;
      border-radius: 12px;
    }

    /* Data Overview */
    .data-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .data-item {
      text-align: center;
      padding: 4px 0;
    }

    .data-label {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-bottom: 6px;
      white-space: nowrap;
    }

    .data-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .data-sub {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 4px;
    }

    /* Quick Actions */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-radius: 12px;
      transition: background 0.2s;
      cursor: pointer;
    }

    .action-item:active {
      background: var(--bg-surface);
      transform: scale(0.98);
    }

    .action-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }

    .action-icon svg {
      width: 24px;
      height: 24px;
    }

    .action-text {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    /* AI Suggestions */
    .suggestion-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .suggestion-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #EFF6FF;
      border-radius: 12px;
      padding: 12px 14px;
    }

    .suggestion-icon {
      width: 20px;
      height: 20px;
      color: var(--primary);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .suggestion-icon svg {
      width: 20px;
      height: 20px;
    }

    .suggestion-text {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Todo List */
    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 4px 0;
    }

    .todo-item:active {
      opacity: 0.8;
    }

    .todo-icon {
      width: 20px;
      height: 20px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .todo-icon svg {
      width: 20px;
      height: 20px;
    }

    .todo-body {
      flex: 1;
      min-width: 0;
    }

    .todo-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .todo-desc {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .todo-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .todo-count {
      min-width: 22px;
      height: 22px;
      border-radius: 11px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
    }

    .todo-arrow {
      color: var(--text-tertiary);
      font-size: 12px;
    }

    /* Chat Bar */
    .chat-bar {
      position: fixed;
      bottom: calc(56px + env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      max-width: 430px;
      margin: 0 auto;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      box-shadow: var(--shadow-float);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }

    .chat-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      flex-shrink: 0;
      cursor: pointer;
    }

    .chat-btn svg {
      width: 22px;
      height: 22px;
    }

    .chat-input-wrap {
      flex: 1;
      height: 40px;
      background: var(--bg-surface);
      border-radius: 20px;
      display: flex;
      align-items: center;
      padding: 0 14px;
    }

    .chat-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      color: var(--text-primary);
    }

    .chat-input::placeholder {
      color: var(--text-tertiary);
    }

    .chat-send {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(37,99,235,0.25);
    }

    .chat-send:active {
      transform: scale(0.95);
      opacity: 0.9;
    }

    .chat-send svg {
      width: 18px;
      height: 18px;
    }

    /* Tab Bar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 430px;
      margin: 0 auto;
      height: calc(56px + env(safe-area-inset-bottom));
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      padding-top: 6px;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 101;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 20%;
      padding-top: 2px;
      cursor: pointer;
      color: var(--text-tertiary);
      transition: color 0.2s;
    }

    .tab-item.active {
      color: var(--primary);
    }

    .tab-item:active {
      opacity: 0.8;
    }

    .tab-icon {
      width: 24px;
      height: 24px;
    }

    .tab-icon svg {
      width: 24px;
      height: 24px;
    }

    .tab-label {
      font-size: 10px;
      font-weight: 500;
      line-height: 1.2;
    }

    /* Scrollbar hide */
    .scroll-content::-webkit-scrollbar { display: none; }
    .scroll-content { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="scroll-content">
      <!-- Header -->
      <div class="header">
        <div class="header-left">
          <div class="avatar">王</div>
          <div class="header-info">
            <div class="header-name-row">
              <span class="header-name">王小明</span>
              <span class="header-tag">金牌话术</span>
            </div>
            <div class="header-store">门店: 丽莎博士-朝阳店</div>
          </div>
        </div>
        <div class="header-right">
          <div class="icon-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
          </div>
          <div class="icon-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span class="badge-dot"></span>
          </div>
        </div>
      </div>

      <!-- Greeting -->
      <div class="greeting-section">
        <div class="greeting-wrap">
          <div class="ai-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.387-1 1.732V7h1a7 7 0 0 1 7 7v4a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-4a7 7 0 0 1 7-7h1V5.732A2.001 2.001 0 0 1 12 2z"/><path d="M9 14h6"/><path d="M9 17h6"/></svg>
          </div>
          <div class="greeting-text">下午好，小明</div>
        </div>
      </div>

      <!-- Data Overview -->
      <div class="card">
        <div class="card-title">今日数据概览</div>
        <div class="data-grid">
          <div class="data-item">
            <div class="data-label">到店客户</div>
            <div class="data-value">12<span style="font-size:12px;font-weight:400;color:var(--text-tertiary)">/30</span></div>
            <div class="data-sub" style="color:var(--success)">↑ 20%</div>
          </div>
          <div class="data-item">
            <div class="data-label">成交订单</div>
            <div class="data-value">8<span style="font-size:12px;font-weight:400;color:var(--text-tertiary)">/20</span></div>
            <div class="data-sub" style="color:var(--success)">↑ 12%</div>
          </div>
          <div class="data-item">
            <div class="data-label">成交额</div>
            <div class="data-value">¥2.4k</div>
            <div class="data-sub" style="color:var(--success)">↑ 8%</div>
          </div>
          <div class="data-item">
            <div class="data-label">待跟进</div>
            <div class="data-value">5</div>
            <div class="data-sub">3条今日到期</div>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="card">
        <div class="action-grid">
          <div class="action-item">
            <div class="action-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4 8 4v14"/><path d="M14 11h-4v4h4z"/></svg>
            </div>
            <div class="action-text">到店接待</div>
          </div>
          <div class="action-item">
            <div class="action-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <div class="action-text">内容发布</div>
          </div>
          <div class="action-item">
            <div class="action-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <div class="action-text">客户管理</div>
          </div>
          <div class="action-item">
            <div class="action-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </div>
            <div class="action-text">知识库</div>
          </div>
        </div>
      </div>

      <!-- AI Suggestions -->
      <div class="card">
        <div class="card-title">AI 经营建议</div>
        <div class="suggestion-list">
          <div class="suggestion-item">
            <div class="suggestion-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M17.636 17.636l-.707-.707M12 21v-1M6.343 17.636l-.707.707M3 12h1M6.343 6.343l-.707-.707"/><circle cx="12" cy="12" r="4"/></svg>
            </div>
            <div class="suggestion-text">今日 14:00-16:00 客流低谷，建议安排地推或社群激活。</div>
          </div>
          <div class="suggestion-item">
            <div class="suggestion-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M17.636 17.636l-.707-.707M12 21v-1M6.343 17.636l-.707.707M3 12h1M6.343 6.343l-.707-.707"/><circle cx="12" cy="12" r="4"/></svg>
            </div>
            <div class="suggestion-text">本月复购率低于门店均值 5%，建议加强老客户回访。</div>
          </div>
        </div>
      </div>

      <!-- Todo List -->
      <div class="card">
        <div class="card-title">
          <span>待办事项</span>
          <span class="card-badge">7 待处理</span>
        </div>
        <div class="todo-list">
          <div class="todo-item">
            <div class="todo-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            </div>
            <div class="todo-body">
              <div class="todo-title">客户跟进提醒</div>
              <div class="todo-desc">张先生7天未复检</div>
            </div>
            <div class="todo-meta">
              <div class="todo-count">1</div>
              <div class="todo-arrow">&gt;</div>
            </div>
          </div>
          <div class="todo-item">
            <div class="todo-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            </div>
            <div class="todo-body">
              <div class="todo-title">内容发布提醒</div>
              <div class="todo-desc">今日待发布内容</div>
            </div>
            <div class="todo-meta">
              <div class="todo-count">2</div>
              <div class="todo-arrow">&gt;</div>
            </div>
          </div>
          <div class="todo-item">
            <div class="todo-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            </div>
            <div class="todo-body">
              <div class="todo-title">私信回复提醒</div>
              <div class="todo-desc">3条新私信待回复</div>
            </div>
            <div class="todo-meta">
              <div class="todo-count">3</div>
              <div class="todo-arrow">&gt;</div>
            </div>
          </div>
          <div class="todo-item">
            <div class="todo-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            </div>
            <div class="todo-body">
              <div class="todo-title">学习任务提醒</div>
              <div class="todo-desc">新话术考核未完成</div>
            </div>
            <div class="todo-meta">
              <div class="todo-count">1</div>
              <div class="todo-arrow">&gt;</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Chat Bar -->
    <div class="chat-bar">
      <div class="chat-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      <div class="chat-input-wrap">
        <input class="chat-input" type="text" placeholder="输入问题..." readonly />
      </div>
      <div class="chat-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>

    // Simple tab switching visual feedback
    document.querySelectorAll('.tab-item').forEach(item => {
      item.addEventListener('click', function() {
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
      });
    });

    // Todo item click feedback
    document.querySelectorAll('.todo-item, .action-item').forEach(item => {
      item.addEventListener('click', function() {
        this.style.opacity = '0.7';
        setTimeout(() => this.style.opacity = '', 150);
      });
    });
