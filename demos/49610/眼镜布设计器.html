<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智绘镜布 · AI眼镜布设计器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root{
    --bg:#070710; --bg2:#0d0d1f; --panel:rgba(22,20,40,0.72);
    --line:rgba(168,85,247,0.22); --neon:#a855f7; --neon2:#7c3aed;
    --cyan:#22d3ee; --pink:#ec4899; --txt:#e7e3ff; --txt2:#9a93c2;
    --radius:16px;
  }
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--bg); color:var(--txt); overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* 动态科技背景 */
  .bg-grid{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(168,85,247,0.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(168,85,247,0.06) 1px,transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 85%);
    animation:gridShift 20s linear infinite;
  }
  @keyframes gridShift{ to{ background-position:42px 42px; } }
  .bg-glow{
    position:fixed; z-index:0; pointer-events:none; border-radius:50%;
    filter:blur(90px); opacity:.5;
  }
  .g1{ width:520px;height:520px; background:radial-gradient(circle,#5b21b6,transparent 70%); top:-160px; left:-120px; animation:float1 14s ease-in-out infinite; }
  .g2{ width:460px;height:460px; background:radial-gradient(circle,#0891b2,transparent 70%); bottom:-140px; right:-100px; animation:float2 16s ease-in-out infinite; }
  .g3{ width:360px;height:360px; background:radial-gradient(circle,#be185d,transparent 70%); top:40%; right:18%; opacity:.28; animation:float1 18s ease-in-out infinite reverse; }
  @keyframes float1{ 50%{ transform:translate(60px,40px) scale(1.1);} }
  @keyframes float2{ 50%{ transform:translate(-50px,-30px) scale(1.08);} }

  /* 主布局 */
  .app{ position:relative; z-index:2; height:100vh; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 26px; border-bottom:1px solid var(--line);
    backdrop-filter:blur(12px); background:rgba(7,7,16,0.5);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .logo{
    width:38px;height:38px;border-radius:11px; display:grid;place-items:center;
    background:linear-gradient(135deg,var(--neon),var(--neon2));
    box-shadow:0 0 22px rgba(168,85,247,.55); font-size:20px;
    animation:pulse 3s ease-in-out infinite;
  }
  @keyframes pulse{ 50%{ box-shadow:0 0 34px rgba(168,85,247,.85);} }
  .brand h1{ font-size:18px; font-weight:700; letter-spacing:.5px;
    background:linear-gradient(90deg,#fff,var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .brand span{ font-size:11px; color:var(--txt2); display:block; letter-spacing:2px; }
  .topbar .tag{ font-size:12px; color:var(--txt2); display:flex; align-items:center; gap:8px; }
  .dot{ width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan); animation:blink 1.6s infinite;}
  @keyframes blink{ 50%{opacity:.25;} }

  .main{ flex:1; display:grid; grid-template-columns:1fr 360px; gap:18px; padding:18px 26px; min-height:0; }

  /* 预览区 */
  .stage{
    position:relative; border-radius:var(--radius); border:1px solid var(--line);
    background:linear-gradient(160deg,rgba(20,18,38,.7),rgba(10,10,22,.7));
    backdrop-filter:blur(10px); display:flex; flex-direction:column;
    overflow:hidden;
  }
  .stage-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); }
  .stage-head h2{ font-size:14px; color:var(--txt); letter-spacing:1px; }
  .stage-head .hint{ font-size:11px; color:var(--txt2); }
  .canvas-wrap{
    flex:1; display:grid; place-items:center; padding:30px; perspective:1400px; position:relative;
  }
  .cloth-holder{
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
    transform-style:preserve-3d; will-change:transform;
  }
  .cloth-holder:hover{ transform:rotateY(-14deg) rotateX(8deg) scale(1.03); }
  canvas#cloth{
    border-radius:14px; display:block; max-width:100%; max-height:62vh;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(168,85,247,.25), 0 0 50px rgba(124,58,237,.25);
    transition:box-shadow .4s;
  }
  .scanline{
    position:absolute; left:30px; right:30px; height:2px; top:30px;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    opacity:0; pointer-events:none; border-radius:2px;
  }
  .scanline.run{ animation:scan 1.1s ease-in-out; }
  @keyframes scan{
    0%{opacity:.9; top:30px;} 100%{opacity:0; top:calc(100% - 30px);}
  }
  .stage-foot{ display:flex; gap:10px; padding:14px 20px; border-top:1px solid var(--line); flex-wrap:wrap; }

  /* 按钮 */
  .btn{
    cursor:pointer; border:none; border-radius:11px; padding:10px 18px; font-size:13px;
    font-weight:600; color:#fff; display:inline-flex; align-items:center; gap:7px;
    transition:all .25s; font-family:inherit; letter-spacing:.5px;
  }
  .btn-ghost{ background:rgba(255,255,255,.05); border:1px solid var(--line); color:var(--txt); }
  .btn-ghost:hover{ background:rgba(168,85,247,.15); border-color:var(--neon); transform:translateY(-2px); }
  .btn-primary{ background:linear-gradient(135deg,var(--neon),var(--neon2)); box-shadow:0 6px 20px -6px rgba(168,85,247,.7); }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 10px 28px -6px rgba(168,85,247,.9); }
  .btn-cyan{ background:linear-gradient(135deg,#0891b2,#0e7490); box-shadow:0 6px 20px -6px rgba(34,211,238,.6); }
  .btn-cyan:hover{ transform:translateY(-2px); }

  /* 控制面板 */
  .panel{
    border-radius:var(--radius); border:1px solid var(--line);
    background:var(--panel); backdrop-filter:blur(14px);
    display:flex; flex-direction:column; overflow:hidden; min-height:0;
  }
  .tabs{ display:flex; border-bottom:1px solid var(--line); }
  .tab{
    flex:1; cursor:pointer; padding:14px 6px; text-align:center; font-size:12.5px;
    color:var(--txt2); border-bottom:2px solid transparent; transition:all .25s; font-weight:600;
  }
  .tab:hover{ color:var(--txt); }
  .tab.active{ color:#fff; border-bottom-color:var(--neon); background:rgba(168,85,247,.08); }
  .tab-content{ flex:1; overflow-y:auto; padding:18px; }
  .tab-content::-webkit-scrollbar{ width:6px; }
  .tab-content::-webkit-scrollbar-thumb{ background:rgba(168,85,247,.4); border-radius:3px; }
  .pane{ display:none; animation:fade .4s ease; }
  .pane.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:11.5px; color:var(--txt2); margin-bottom:8px; letter-spacing:1px; text-transform:uppercase; }
  .input{
    width:100%; background:rgba(0,0,0,.3); border:1px solid var(--line); border-radius:10px;
    padding:11px 13px; color:var(--txt); font-size:13px; font-family:inherit; transition:all .25s;
  }
  .input:focus{ outline:none; border-color:var(--neon); box-shadow:0 0 0 3px rgba(168,85,247,.18); }

  .colors{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .swatch{
    aspect-ratio:1; border-radius:9px; cursor:pointer; border:2px solid transparent;
    transition:all .2s; position:relative;
  }
  .swatch:hover{ transform:scale(1.12); }
  .swatch.sel{ border-color:#fff; box-shadow:0 0 12px rgba(255,255,255,.6); }
  .swatch.custom{ background:conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red); display:grid; place-items:center; }
  .swatch.custom input{ opacity:0; position:absolute; inset:0; cursor:pointer; }

  .pattern-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .pat{
    aspect-ratio:1.1; border-radius:11px; cursor:pointer; border:1px solid var(--line);
    background:rgba(0,0,0,.3); display:grid; place-items:center; gap:4px;
    transition:all .25s; color:var(--txt2); font-size:11px;
  }
  .pat canvas{ width:100%; height:62%; border-radius:6px; }
  .pat:hover{ border-color:var(--neon); transform:translateY(-2px); color:var(--txt); }
  .pat.sel{ border-color:var(--neon); background:rgba(168,85,247,.15); color:#fff; box-shadow:0 0 16px -4px rgba(168,85,247,.6); }

  .slider-row{ display:flex; align-items:center; gap:12px; }
  input[type=range]{
    flex:1; -webkit-appearance:none; appearance:none; height:5px; border-radius:3px;
    background:linear-gradient(90deg,var(--neon),var(--cyan)); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px;height:16px;border-radius:50%;
    background:#fff; box-shadow:0 0 10px var(--neon); cursor:pointer; border:2px solid var(--neon);
  }
  .val{ font-size:12px; color:var(--cyan); min-width:34px; text-align:right; font-variant-numeric:tabular-nums; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    padding:7px 12px; border-radius:20px; font-size:11.5px; cursor:pointer;
    background:rgba(255,255,255,.05); border:1px solid var(--line); color:var(--txt2);
    transition:all .2s;
  }
  .chip:hover{ background:rgba(168,85,247,.18); border-color:var(--neon); color:#fff; }

  /* AI 面板 */
  .ai-box{
    background:linear-gradient(160deg,rgba(124,58,237,.18),rgba(8,145,178,.12));
    border:1px solid rgba(168,85,247,.35); border-radius:13px; padding:16px; margin-bottom:16px;
  }
  .ai-title{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; margin-bottom:10px; }
  .ai-orb{
    width:22px;height:22px;border-radius:50%; background:conic-gradient(var(--neon),var(--cyan),var(--pink),var(--neon));
    animation:spin 3s linear infinite; position:relative;
  }
  .ai-orb::after{ content:"";position:absolute;inset:3px;border-radius:50%;background:var(--bg2); }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .ai-area{
    width:100%; min-height:90px; resize:vertical; background:rgba(0,0,0,.35); border:1px solid var(--line);
    border-radius:10px; padding:12px; color:var(--txt); font-size:13px; font-family:inherit; line-height:1.6;
  }
  .ai-area:focus{ outline:none; border-color:var(--neon); }
  .ai-btn{ width:100%; margin-top:12px; justify-content:center; }
  .ai-feedback{
    margin-top:12px; font-size:12px; color:var(--cyan); min-height:18px; line-height:1.5;
    opacity:0; transition:opacity .3s;
  }
  .ai-feedback.show{ opacity:1; }
  .ai-thinking{ display:inline-flex; gap:4px; align-items:center; }
  .ai-thinking span{ width:6px;height:6px;border-radius:50%;background:var(--cyan); animation:bounce 1s infinite; }
  .ai-thinking span:nth-child(2){animation-delay:.15s;} .ai-thinking span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{ 50%{transform:translateY(-6px);opacity:.4;} }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:6px 0; }
  .switch{ position:relative; width:42px;height:22px; background:rgba(255,255,255,.1); border-radius:11px; cursor:pointer; transition:.25s; }
  .switch.on{ background:linear-gradient(90deg,var(--neon),var(--cyan)); }
  .switch::after{ content:""; position:absolute; top:3px;left:3px; width:16px;height:16px;border-radius:50%; background:#fff; transition:.25s; }
  .switch.on::after{ left:23px; }

  /* toast */
  .toast{
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(80px);
    background:rgba(20,18,38,.95); border:1px solid var(--neon); color:#fff; padding:13px 24px;
    border-radius:12px; font-size:13px; z-index:99; box-shadow:0 10px 40px -8px rgba(168,85,247,.6);
    transition:transform .4s cubic-bezier(.2,.8,.2,1); backdrop-filter:blur(8px);
  }
  .toast.show{ transform:translateX(-50%) translateY(0); }

  @media(max-width:880px){
    .main{ grid-template-columns:1fr; }
    .panel{ max-height:46vh; }
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow g1"></div>
<div class="bg-glow g2"></div>
<div class="bg-glow g3"></div>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">👁</div>
      <div>
        <h1>智绘镜布 · AI眼镜布设计器</h1>
        <span>SMART CLOTH DESIGNER</span>
      </div>
    </div>
    <div class="tag"><span class="dot"></span> AI 引擎已就绪 · 零依赖本地运行</div>
  </div>

  <div class="main">
    <!-- 预览舞台 -->
    <div class="stage">
      <div class="stage-head">
        <h2>◆ 实时预览</h2>
        <span class="hint">移动鼠标查看 3D 效果</span>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <div class="cloth-holder" id="holder">
          <canvas id="cloth" width="640" height="640"></canvas>
        </div>
        <div class="scanline" id="scan"></div>
      </div>
      <div class="stage-foot">
        <button class="btn btn-ghost" id="resetBtn">↺ 重置</button>
        <button class="btn btn-ghost" id="randomBtn">🎲 随机灵感</button>
        <button class="btn btn-cyan" id="previewBtn">👁 全屏预览</button>
        <button class="btn btn-primary" id="downloadBtn">⬇ 下载我的镜布</button>
      </div>
    </div>

    <!-- 控制面板 -->
    <div class="panel">
      <div class="tabs">
        <div class="tab active" data-tab="ai">✦ AI创意</div>
        <div class="tab" data-tab="color">色彩</div>
        <div class="tab" data-tab="pattern">图案</div>
        <div class="tab" data-tab="text">文字</div>
      </div>
      <div class="tab-content">
        <!-- AI -->
        <div class="pane active" id="pane-ai">
          <div class="ai-box">
            <div class="ai-title"><span class="ai-orb"></span> 告诉AI你的想法</div>
            <textarea class="ai-area" id="aiInput" placeholder="例如：我要一块赛博朋克风格的镜布，主色霓虹紫，加上我的名字「阿哲」，要有电路纹理和科技感…"></textarea>
            <button class="btn btn-primary ai-btn" id="aiBtn">✦ 让AI帮我设计</button>
            <div class="ai-feedback" id="aiFeedback"></div>
          </div>
          <div class="field">
            <label>快捷灵感</label>
            <div class="chip-row" id="chipRow"></div>
          </div>
          <div class="field">
            <label>AI解读说明</label>
            <div style="font-size:12px;color:var(--txt2);line-height:1.7;">
              输入关键词，AI会自动识别 <b style="color:var(--neon)">风格</b>、<b style="color:var(--cyan)">主色</b>、
              <b style="color:var(--pink)">图案</b> 与 <b style="color:var(--neon)">文字</b>，一键生成专属镜布。
              支持自然语言，例如"星空+我的名字小蓝"。
            </div>
          </div>
        </div>

        <!-- 色彩 -->
        <div class="pane" id="pane-color">
          <div class="field">
            <label>布面底色</label>
            <div class="colors" id="bgColors"></div>
          </div>
          <div class="field">
            <label>图案 / 文字色</label>
            <div class="colors" id="fgColors"></div>
          </div>
          <div class="field">
            <label>渐变强度</label>
            <div class="slider-row">
              <input type="range" id="grad" min="0" max="100" value="40">
              <span class="val" id="gradVal">40</span>
            </div>
          </div>
        </div>

        <!-- 图案 -->
        <div class="pane" id="pane-pattern">
          <div class="field">
            <label>纹理图案</label>
            <div class="pattern-grid" id="patternGrid"></div>
          </div>
          <div class="field">
            <label>图案密度</label>
            <div class="slider-row">
              <input type="range" id="density" min="10" max="100" value="50">
              <span class="val" id="densityVal">50</span>
            </div>
          </div>
          <div class="toggle-row">
            <label style="margin:0;font-size:12px;color:var(--txt);">显示缝线边框</label>
            <div class="switch on" id="stitchToggle"></div>
          </div>
        </div>

        <!-- 文字 -->
        <div class="pane" id="pane-text">
          <div class="field">
            <label>专属文字</label>
            <input class="input" id="textInput" placeholder="输入名字 / 标语…" value="我的镜布">
          </div>
          <div class="field">
            <label>字号</label>
            <div class="slider-row">
              <input type="range" id="fontSize" min="14" max="60" value="34">
              <span class="val" id="fontSizeVal">34</span>
            </div>
          </div>
          <div class="field">
            <label>文字位置</label>
            <div class="chip-row" id="posRow">
              <div class="chip" data-pos="top">顶部</div>
              <div class="chip sel" data-pos="center">居中</div>
              <div class="chip" data-pos="bottom">底部</div>
            </div>
          </div>
          <div class="toggle-row">
            <label style="margin:0;font-size:12px;color:var(--txt);">发光描边</label>
            <div class="switch on" id="glowToggle"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== 状态 ===================== */
const S = {
  bg:'#14122b', fg:'#a855f7', accent:'#22d3ee',
  pattern:'circuit', density:50, grad:40,
  text:'我的镜布', fontSize:34, textPos:'center', glow:true,
  stitch:true, shape:'rect'
};
const PALETTE = ['#14122b','#0b1e3f','#061018','#1a0b2e','#2d0a1a','#0a1f1a','#3a2810',
                 '#a855f7','#22d3ee','#ec4899','#10b981','#f59e0b','#ef4444','#ffffff'];

const PATTERNS = [
  {id:'none', name:'纯色'},
  {id:'grid', name:'科技格'},
  {id:'circuit', name:'电路'},
  {id:'dots', name:'星点'},
  {id:'waves', name:'波纹'},
  {id:'hex', name:'蜂巢'},
  {id:'stripes', name:'条纹'},
  {id:'stars', name:'星空'},
  {id:'tri', name:'三角'},
  {id:'rings', name:'光环'},
  {id:'rain', name:'数字雨'},
  {id:'topo', name:'等高线'},
];

const canvas = document.getElementById('cloth');
const ctx = canvas.getContext('2d');

/* ===================== 绘制 ===================== */
function draw(){
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  const pad=46;
  const x=pad,y=pad,sw=w-pad*2,sh=h-pad*2;
  const r=22;

  // 底色 + 渐变
  roundRect(x,y,sw,sh,r); ctx.save(); ctx.clip();
  const g = ctx.createLinearGradient(x,y,x+sw,y+sh);
  g.addColorStop(0, S.bg);
  g.addColorStop(1, mix(S.bg, S.fg, S.grad/100*0.7));
  ctx.fillStyle=g; ctx.fillRect(x,y,sw,sh);
  // 顶部高光
  const hg = ctx.createLinearGradient(x,y,x,y+sh*0.5);
  hg.addColorStop(0,'rgba(255,255,255,0.10)'); hg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hg; ctx.fillRect(x,y,sw,sh);

  // 图案
  drawPattern(x,y,sw,sh);
  ctx.restore();

  // 缝线边框
  if(S.stitch){
    ctx.save();
    ctx.strokeStyle=mix(S.fg,'#ffffff',0.3); ctx.lineWidth=1.5; ctx.setLineDash([7,5]);
    roundRect(x+10,y+10,sw-20,sh-20,r-8); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle='rgba(168,85,247,0.5)'; ctx.lineWidth=2;
    roundRect(x,y,sw,sh,r); ctx.stroke();
    ctx.restore();
  }

  // 文字
  if(S.text){
    ctx.save();
    ctx.font=`700 ${S.fontSize}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    let ty = y+sh/2;
    if(S.textPos==='top') ty=y+sh*0.18;
    if(S.textPos==='bottom') ty=y+sh*0.82;
    if(S.glow){
      ctx.shadowColor=S.accent; ctx.shadowBlur=22;
      ctx.fillStyle=S.accent;
      ctx.fillText(S.text, x+sw/2, ty);
      ctx.shadowBlur=0;
    }
    ctx.fillStyle=S.fg==='#ffffff'?S.accent:'#ffffff';
    ctx.fillText(S.text, x+sw/2, ty);
    ctx.restore();
  }
  // 角标
  ctx.save();
  ctx.font='600 13px monospace'; ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.textAlign='left'; ctx.fillText('智绘镜布 · AI DESIGN', x+16, y+sh-16);
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawPattern(x,y,w,h){
  if(S.pattern==='none') return;
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  const col = S.fg, acc = S.accent;
  const d = S.density/50;
  switch(S.pattern){
    case 'grid': {
      ctx.strokeStyle=hexA(col,0.35); ctx.lineWidth=1;
      const step=34/d;
      for(let i=x;i<x+w;i+=step){ctx.beginPath();ctx.moveTo(i,y);ctx.lineTo(i,y+h);ctx.stroke();}
      for(let j=y;j<y+h;j+=step){ctx.beginPath();ctx.moveTo(x,j);ctx.lineTo(x+w,j);ctx.stroke();}
      ctx.strokeStyle=hexA(acc,0.5); ctx.lineWidth=1.5;
      for(let i=x;i<x+w;i+=step*3){ctx.beginPath();ctx.moveTo(i,y);ctx.lineTo(i,y+h);ctx.stroke();}
      break;}
    case 'circuit': {
      ctx.strokeStyle=hexA(acc,0.55); ctx.lineWidth=1.6;
      const n=Math.floor(18*d);
      for(let k=0;k<n;k++){
        let cx=x+Math.random()*w, cy=y+Math.random()*h;
        ctx.beginPath(); ctx.moveTo(cx,cy);
        for(let s=0;s<4;s++){
          if(Math.random()>0.5) cx+= (Math.random()>0.5?1:-1)*(30+Math.random()*60);
          else cy+= (Math.random()>0.5?1:-1)*(30+Math.random()*60);
          ctx.lineTo(cx,cy);
        }
        ctx.stroke();
        ctx.fillStyle=hexA(col,0.9);
        ctx.beginPath(); ctx.arc(cx,cy,3,0,7); ctx.fill();
      }
      break;}
    case 'dots': {
      ctx.fillStyle=hexA(col,0.55);
      const step=26/d;
      for(let i=x+step/2;i<x+w;i+=step)
        for(let j=y+step/2;j<y+h;j+=step){
          ctx.beginPath(); ctx.arc(i,j,1.6+d*0.8,0,7); ctx.fill();
        }
      break;}
    case 'waves': {
      ctx.strokeStyle=hexA(col,0.4); ctx.lineWidth=2;
      const amp=18*d, wl=70/d;
      for(let j=y;j<y+h;j+=22){
        ctx.beginPath();
        for(let i=x;i<=x+w;i+=4){
          const yy=j+Math.sin((i-x)/wl*Math.PI*2)*amp;
          i===x?ctx.moveTo(i,yy):ctx.lineTo(i,yy);
        }
        ctx.stroke();
      }
      break;}
    case 'hex': {
      ctx.strokeStyle=hexA(col,0.4); ctx.lineWidth=1.4;
      const s=22/d, hx=s*1.7, hy=s*1.5;
      for(let row=0; row*hy<h+hy; row++){
        for(let col2=0; col2*hx<w+hx; col2++){
          const cx=x+col2*hx+(row%2?hx/2:0), cy=y+row*hy;
          ctx.beginPath();
          for(let k=0;k<6;k++){
            const a=Math.PI/3*k-Math.PI/6;
            const px=cx+Math.cos(a)*s, py=cy+Math.sin(a)*s;
            k===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
          }
          ctx.closePath(); ctx.stroke();
        }
      }
      break;}
    case 'stripes': {
      ctx.fillStyle=hexA(col,0.25);
      const step=22/d;
      for(let i=x;i<x+w;i+=step){ ctx.fillRect(i,y,step/2,h); }
      break;}
    case 'stars': {
      ctx.fillStyle=hexA('#ffffff',0.9);
      const n=Math.floor(120*d);
      for(let k=0;k<n;k++){
        const sx=x+Math.random()*w, sy=y+Math.random()*h, r=Math.random()*1.6+0.3;
        ctx.globalAlpha=Math.random()*0.8+0.2;
        ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.fill();
      }
      ctx.globalAlpha=1;
      // 几颗亮星
      ctx.fillStyle=hexA(acc,0.9);
      for(let k=0;k<6;k++){
        const sx=x+Math.random()*w, sy=y+Math.random()*h;
        ctx.shadowColor=acc; ctx.shadowBlur=10;
        ctx.beginPath(); ctx.arc(sx,sy,2.2,0,7); ctx.fill();
      }
      ctx.shadowBlur=0;
      break;}
    case 'tri': {
      ctx.strokeStyle=hexA(col,0.35); ctx.lineWidth=1.3;
      const s=40/d;
      for(let j=y;j<y+h+s;j+=s*0.866){
        for(let i=x;i<x+w+s;i+=s){
          ctx.beginPath();
          ctx.moveTo(i,j); ctx.lineTo(i+s/2,j-s*0.866); ctx.lineTo(i+s,j); ctx.closePath(); ctx.stroke();
        }
      }
      break;}
    case 'rings': {
      ctx.strokeStyle=hexA(col,0.3); ctx.lineWidth=1.6;
      const n=Math.floor(10*d), cxn=x+w/2, cyn=y+h/2;
      for(let k=1;k<=n;k++){
        ctx.beginPath(); ctx.arc(cxn,cyn,k*(30/d),0,7); ctx.stroke();
      }
      break;}
    case 'rain': {
      ctx.font=`12px monospace`; ctx.fillStyle=hexA(acc,0.6);
      const cols=Math.floor(w/16);
      for(let c=0;c<cols;c++){
        for(let r=0;r<h/16;r++){
          if(Math.random()>0.5) continue;
          ctx.globalAlpha=Math.random()*0.7+0.1;
          ctx.fillText(Math.random()>0.5?'1':'0', x+c*16, y+r*16+12);
        }
      }
      ctx.globalAlpha=1;
      break;}
    case 'topo': {
      ctx.strokeStyle=hexA(col,0.3); ctx.lineWidth=1.3;
      const cxn=x+w/2, cyn=y+h/2;
      for(let k=1;k<30;k++){
        ctx.beginPath();
        for(let a=0;a<7;a+=0.05){
          const rad=k*8 + Math.sin(a*3+k)*8*d;
          const px=cxn+Math.cos(a)*rad, py=cyn+Math.sin(a)*rad;
          a===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
        }
        ctx.closePath(); ctx.stroke();
      }
      break;}
  }
  ctx.restore();
}

/* ===================== 工具 ===================== */
function hexA(hex,a){
  if(hex.startsWith('rgba')) return hex;
  const c=hex.replace('#','');
  const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  return `rgba(${r},${g},${b},${a})`;
}
function mix(c1,c2,t){
  const p=h=>{const x=h.replace('#','');return [parseInt(x.substr(0,2),16),parseInt(x.substr(2,2),16),parseInt(x.substr(4,2),16)];};
  const a=p(c1),b=p(c2);
  const r=Math.round(a[0]+(b[0]-a[0])*t),g=Math.round(a[1]+(b[1]-a[1])*t),bl=Math.round(a[2]+(b[2]-a[2])*t);
  return `rgb(${r},${g},${bl})`;
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200);
}

  const s=document.getElementById('scan'); s.classList.remove('run'); void s.offsetWidth; s.classList.add('run');
}

function drawThumb(cv,id){
  const c=cv.getContext('2d'), w=cv.width,h=cv.height;
  c.fillStyle='#0c0a1e'; c.fillRect(0,0,w,h);
  const old={pattern:id,density:50,fg:'#a855f7',accent:'#22d3ee'};
  // 简化缩略：用临时绘制
  const savedPattern=S.pattern, savedDens=S.density;
  S.pattern=id; S.density=50;
  // 借用 drawPattern（需要 clip 到画布）
  const realCtx=ctx; 
  // 临时切换上下文
  window._tc=c;
  drawPatternOn(c,0,0,w,h,old);
  S.pattern=savedPattern; S.density=savedDens;
}
function drawPatternOn(c,x,y,w,h,st){
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  const col=st.fg, acc=st.accent, d=1;
  // 简化版，复用主要逻辑
  const id=st.pattern;
  if(id==='grid'){
    c.strokeStyle=hexA(col,0.5); c.lineWidth=1;
    for(let i=0;i<w;i+=10){c.beginPath();c.moveTo(i,0);c.lineTo(i,h);c.stroke();}
    for(let j=0;j<h;j+=10){c.beginPath();c.moveTo(0,j);c.lineTo(w,j);c.stroke();}
  }else if(id==='circuit'){
    c.strokeStyle=hexA(acc,0.7); c.lineWidth=1;
    for(let k=0;k<6;k++){let cx=Math.random()*w,cy=Math.random()*h;c.beginPath();c.moveTo(cx,cy);
      for(let s=0;s<3;s++){Math.random()>0.5?cx+=(Math.random()>.5?1:-1)*15:cy+=(Math.random()>.5?1:-1)*15;c.lineTo(cx,cy);}c.stroke();
      c.fillStyle=col;c.beginPath();c.arc(cx,cy,1.5,0,7);c.fill();}
  }else if(id==='dots'){c.fillStyle=hexA(col,0.7);for(let i=4;i<w;i+=8)for(let j=4;j<h;j+=8){c.beginPath();c.arc(i,j,1,0,7);c.fill();}}
  else if(id==='waves'){c.strokeStyle=hexA(col,0.5);c.lineWidth=1.2;for(let j=4;j<h;j+=8){c.beginPath();for(let i=0;i<=w;i+=2){c.lineTo(i,j+Math.sin(i/8)*3);}c.stroke();}}
  else if(id==='hex'){c.strokeStyle=hexA(col,0.5);c.lineWidth=0.8;const s=7;for(let r=0;r*6<h+6;r++)for(let cc=0;cc*10<w+10;cc++){const cx=cc*10+(r%2?5:0),cy=r*6;c.beginPath();for(let k=0;k<6;k++){const a=Math.PI/3*k-Math.PI/6;c.lineTo(cx+Math.cos(a)*s,cy+Math.sin(a)*s);}c.closePath();c.stroke();}}
  else if(id==='stripes'){c.fillStyle=hexA(col,0.4);for(let i=0;i<w;i+=6)c.fillRect(i,0,3,h);}
  else if(id==='stars'){c.fillStyle='#fff';for(let k=0;k<40;k++){c.globalAlpha=Math.random();c.beginPath();c.arc(Math.random()*w,Math.random()*h,Math.random()*1.2,0,7);c.fill();}c.globalAlpha=1;}
  else if(id==='tri'){c.strokeStyle=hexA(col,0.5);c.lineWidth=0.8;const s=12;for(let j=0;j<h+s;j+=10)for(let i=0;i<w+s;i+=12){c.beginPath();c.moveTo(i,j);c.lineTo(i+6,j-10);c.lineTo(i+12,j);c.closePath();c.stroke();}}
  else if(id==='rings'){c.strokeStyle=hexA(col,0.5);c.lineWidth=1;for(let k=1;k<8;k++){c.beginPath();c.arc(w/2,h/2,k*4,0,7);c.stroke();}}
  else if(id==='rain'){c.font='8px monospace';c.fillStyle=hexA(acc,0.8);for(let cc=0;cc<w/8;cc++)for(let r=0;r<h/8;r++){if(Math.random()>.6){c.globalAlpha=Math.random();c.fillText(Math.random()>.5?'1':'0',cc*8,r*8+8);}}c.globalAlpha=1;}
  else if(id==='topo'){c.strokeStyle=hexA(col,0.4);c.lineWidth=0.8;for(let k=1;k<10;k++){c.beginPath();for(let a=0;a<7;a+=0.1){const rad=k*3;c.lineTo(w/2+Math.cos(a)*rad,h/2+Math.sin(a)*rad);}c.closePath();c.stroke();}}
  else if(id==='none'){c.fillStyle=hexA(col,0.2);c.fillRect(0,0,w,h);c.fillStyle='rgba(255,255,255,0.3)';c.font='8px sans-serif';c.textAlign='center';c.fillText('纯色',w/2,h/2);}
  c.restore();
}

function aiGenerate(){
  const raw=document.getElementById('aiInput').value.trim();
  if(!raw){ toast('请先输入你的想法～'); return; }
  const fb=document.getElementById('aiFeedback');
  fb.innerHTML='<span class="ai-thinking"><span></span><span></span><span></span></span> AI 正在解析你的创意…';

    draw();
    fb.innerHTML='✓ '+r.msg;
  }, 900);

function interpret(t){
  const s=t.toLowerCase();
  const st={};
  const notes=[];
  // 文字：提取引号或"名字/叫/写入"
  let txt=null;
  const q=t.match(/[「「""](.+?)[」」""]/);
  if(q){ txt=q[1]; notes.push('文字「'+txt+'」'); }
  else{
    const m=t.match(/名字[是为叫]?([\u4e00-\u9fa5a-zA-Z0-9]{1,8})/);
    if(m){ txt=m[1]; notes.push('文字「'+txt+'」'); }
  }
  if(txt) st.text=txt;

  // 风格 → 图案
  if(/赛博|cyber|科技|电路|未来|机械/.test(t)){ st.pattern='circuit'; notes.push('电路纹理'); }
  else if(/星空|宇宙|银河|星辰|夜空/.test(t)){ st.pattern='stars'; st.bg='#070716'; notes.push('星空图案'); }
  else if(/极简|简约|简单|minimal|纯色/.test(t)){ st.pattern='none'; st.bg='#f4f4f6'; st.fg='#888'; notes.push('极简纯色'); }
  else if(/粉|少女|可爱|萌|甜/.test(t)){ st.bg='#2d0a1a'; st.fg='#ec4899'; st.accent='#f9a8d4'; st.pattern='dots'; notes.push('粉色星点'); }
  else if(/海|蓝|水|清凉/.test(t)){ st.bg='#061018'; st.fg='#22d3ee'; st.accent='#67e8f9'; st.pattern='waves'; notes.push('海洋波纹'); }
  else if(/森林|绿|自然|植物/.test(t)){ st.bg='#0a1f1a'; st.fg='#10b981'; st.accent='#6ee7b7'; st.pattern='hex'; notes.push('蜂巢绿意'); }
  else if(/数字|矩阵|代码|黑客|matrix/.test(t)){ st.pattern='rain'; st.bg='#04140a'; st.fg='#10b981'; st.accent='#34d399'; notes.push('数字矩阵'); }
  else if(/暖|橙|阳光|夕阳/.test(t)){ st.bg='#3a2810'; st.fg='#f59e0b'; st.accent='#fcd34d'; st.pattern='rings'; notes.push('暖阳光环'); }
  else if(/格|网格|线条/.test(t)){ st.pattern='grid'; notes.push('科技网格'); }
  else if(/条纹|斑马/.test(t)){ st.pattern='stripes'; notes.push('条纹'); }
  else if(/等高|地图|地形/.test(t)){ st.pattern='topo'; notes.push('等高线'); }

  // 颜色关键词
  if(/紫色|紫|霓虹紫/.test(t)){ st.fg='#a855f7'; st.accent='#c084fc'; st.bg = st.bg||'#14122b'; notes.push('霓虹紫'); }
  if(/青|cyan|蓝绿/.test(t)){ st.accent='#22d3ee'; }
  if(/粉色|粉红/.test(t) && !st.fg){ st.fg='#ec4899'; }
  if(/黑色|暗|深色/.test(t)){ st.bg='#070710'; }
  if(/白色|亮色|浅色/.test(t) && !/极简/.test(t)){ st.bg='#1a1a2e'; }

  // 密度
  if(/密|满|丰富/.test(t)) st.density=85;
  else if(/疏|稀|少|淡/.test(t)) st.density=25;

  const msg = '已为你生成专属镜布：'+ (notes.join('、')||'通用科技风');
  return {state:st, msg};
}
