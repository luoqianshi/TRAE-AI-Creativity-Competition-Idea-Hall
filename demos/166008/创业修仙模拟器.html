<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>创业修仙模拟器 · 散修之路</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;700&display=swap');

:root {
  --bg-dark: #0a0a0f;
  --bg-card: #161620;
  --bg-card2: #1e1e2e;
  --gold: #c9a96e;
  --gold-bright: #e8c896;
  --gold-dim: #8a7654;
  --red-seal: #b03030;
  --text-main: #d4cbb8;
  --text-dim: #8a8275;
  --text-bright: #f0e6d2;
  --green-jade: #5a8a6a;
  --purple-mystic: #6a4a8a;
  --border-gold: rgba(201,169,110,0.3);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: 'Noto Serif SC', serif;
  background: var(--bg-dark);
  color: var(--text-main);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* 背景星空+水墨效果 */
body::before {
  content:'';
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(106,74,138,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(90,138,106,0.1) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(201,169,110,0.05) 0%, transparent 70%);
  pointer-events:none; z-index:0;
}

body::after {
  content:'';
  position:fixed; top:0; left:0; right:0; bottom:0;
  background-image:
    radial-gradient(1px 1px at 25% 15%, rgba(201,169,110,0.4), transparent),
    radial-gradient(1px 1px at 60% 80%, rgba(201,169,110,0.3), transparent),
    radial-gradient(1px 1px at 85% 25%, rgba(201,169,110,0.35), transparent),
    radial-gradient(1px 1px at 15% 60%, rgba(201,169,110,0.25), transparent),
    radial-gradient(1px 1px at 70% 45%, rgba(201,169,110,0.3), transparent),
    radial-gradient(1px 1px at 40% 90%, rgba(201,169,110,0.2), transparent);
  pointer-events:none; z-index:0;
}

#app { position:relative; z-index:1; max-width:520px; margin:0 auto; min-height:100vh; padding:16px; }

/* 通用样式 */
.title-font { font-family:'Ma Shan Zheng', cursive; }
.serif-font { font-family:'ZCOOL XiaoWei', serif; }

.screen { display:none; animation: fadeIn 0.6s ease; }
.screen.active { display:block; }

@keyframes fadeIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
@keyframes glow { 0%,100%{text-shadow:0 0 8px rgba(201,169,110,0.3);} 50%{text-shadow:0 0 20px rgba(201,169,110,0.6);} }
@keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }
@keyframes flash { 0%{opacity:0;} 50%{opacity:1;} 100%{opacity:0;} }
@keyframes slideUp { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
@keyframes pulse-border { 0%,100%{border-color:rgba(201,169,110,0.3);} 50%{border-color:rgba(201,169,110,0.7);} }

/* ===== 开局画面 ===== */
.start-screen { text-align:center; padding-top:15vh; }
.start-title {
  font-family:'Ma Shan Zheng', cursive;
  font-size:3.2rem; color:var(--gold-bright);
  animation: glow 3s ease-in-out infinite;
  letter-spacing:0.15em; line-height:1.3;
  text-shadow: 0 0 30px rgba(201,169,110,0.3);
}
.start-subtitle {
  font-family:'ZCOOL XiaoWei', serif;
  font-size:1rem; color:var(--text-dim);
  margin-top:0.8rem; letter-spacing:0.3em;
}
.start-desc {
  font-size:0.85rem; color:var(--text-dim);
  margin-top:1.5rem; line-height:1.8;
  padding:0 2rem;
}
.start-btn {
  margin-top:3rem; padding:0.8rem 3rem;
  font-family:'ZCOOL XiaoWei', serif;
  font-size:1.3rem; color:var(--gold-bright);
  background: linear-gradient(135deg, rgba(201,169,110,0.15), rgba(201,169,110,0.05));
  border:1px solid var(--border-gold);
  border-radius:2px; cursor:pointer;
  letter-spacing:0.2em; transition:all 0.3s;
  position:relative; overflow:hidden;
}
.start-btn:hover { background: linear-gradient(135deg, rgba(201,169,110,0.25), rgba(201,169,110,0.1)); box-shadow:0 0 20px rgba(201,169,110,0.2); }
.start-btn:active { transform:scale(0.97); }

.seal-decoration {
  display:inline-block; width:60px; height:60px;
  border:2px solid var(--red-seal); border-radius:50%;
  color:var(--red-seal); font-size:0.7rem; line-height:56px;
  font-family:'Ma Shan Zheng', cursive;
  margin:1.5rem auto; opacity:0.6;
  transform:rotate(-15deg);
}

/* ===== 角色创建 ===== */
.creation-screen { padding-top:2rem; }
.creation-header { text-align:center; margin-bottom:1.5rem; }
.creation-title { font-family:'Ma Shan Zheng', cursive; font-size:1.8rem; color:var(--gold-bright); letter-spacing:0.1em; }
.creation-hint { font-size:0.8rem; color:var(--text-dim); margin-top:0.4rem; }

.section-label {
  font-family:'ZCOOL XiaoWei', serif;
  font-size:1.1rem; color:var(--gold);
  margin:1.2rem 0 0.8rem;
  padding-left:0.8rem;
  border-left:3px solid var(--gold-dim);
  letter-spacing:0.1em;
}

.name-input {
  width:100%; padding:0.7rem 1rem;
  background:var(--bg-card); border:1px solid var(--border-gold);
  color:var(--text-bright); font-size:1rem;
  font-family:'Noto Serif SC',serif; border-radius:4px;
  outline:none; transition:border-color 0.3s;
}
.name-input:focus { border-color:var(--gold); }
.name-input::placeholder { color:var(--text-dim); }

.option-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.6rem; }
.option-card {
  padding:0.8rem; background:var(--bg-card);
  border:1px solid transparent; border-radius:6px;
  cursor:pointer; transition:all 0.3s;
  position:relative; overflow:hidden;
}
.option-card:hover { border-color:var(--border-gold); background:var(--bg-card2); }
.option-card.selected {
  border-color:var(--gold); background:rgba(201,169,110,0.08);
  box-shadow:0 0 12px rgba(201,169,110,0.15);
}
.option-card.selected::after {
  content:'选'; position:absolute; top:4px; right:6px;
  font-size:0.6rem; color:var(--gold-bright);
  background:rgba(201,169,110,0.2); padding:1px 5px; border-radius:2px;
}
.opt-name { font-family:'Ma Shan Zheng',cursive; font-size:1.1rem; color:var(--gold-bright); margin-bottom:0.3rem; }
.opt-desc { font-size:0.75rem; color:var(--text-dim); line-height:1.5; margin-bottom:0.3rem; }
.opt-bonus { font-size:0.7rem; color:var(--green-jade); }

.confirm-btn {
  width:100%; margin-top:1.5rem; padding:0.8rem;
  font-family:'ZCOOL XiaoWei',serif; font-size:1.1rem;
  color:var(--gold-bright);
  background:linear-gradient(135deg,rgba(201,169,110,0.15),rgba(201,169,110,0.05));
  border:1px solid var(--border-gold); border-radius:4px;
  cursor:pointer; letter-spacing:0.2em; transition:all 0.3s;
}
.confirm-btn:hover { background:linear-gradient(135deg,rgba(201,169,110,0.25),rgba(201,169,110,0.1)); }
.confirm-btn:active { transform:scale(0.98); }
.confirm-btn:disabled { opacity:0.3; cursor:not-allowed; }

/* ===== 游戏主界面 ===== */
.game-screen { padding-top:0.5rem; }

/* 顶部状态栏 */
.status-bar {
  display:flex; justify-content:space-between; align-items:center;
  padding:0.5rem 0.8rem; background:var(--bg-card);
  border:1px solid var(--border-gold); border-radius:6px;
  margin-bottom:0.8rem;
}
.status-left { display:flex; align-items:center; gap:0.5rem; }
.status-name { font-family:'Ma Shan Zheng',cursive; font-size:1rem; color:var(--gold-bright); }
.status-month { font-size:0.75rem; color:var(--text-dim); }
.status-stage {
  font-size:0.7rem; color:var(--gold); padding:2px 8px;
  border:1px solid var(--border-gold); border-radius:10px;
}

/* 数值面板 */
.stats-panel {
  display:grid; grid-template-columns:repeat(5,1fr); gap:0.4rem;
  padding:0.6rem; background:var(--bg-card);
  border:1px solid var(--border-gold); border-radius:6px;
  margin-bottom:0.8rem;
}
.stat-item { text-align:center; position:relative; }
.stat-icon { font-size:1.1rem; margin-bottom:0.2rem; }
.stat-value { font-size:0.9rem; font-weight:bold; color:var(--text-bright); }
.stat-label { font-size:0.6rem; color:var(--text-dim); margin-top:0.1rem; }
.stat-bar {
  height:3px; background:rgba(255,255,255,0.1);
  border-radius:2px; margin-top:0.3rem; overflow:hidden;
}
.stat-bar-fill { height:100%; border-radius:2px; transition:width 0.5s ease; }
.stat-bar-fill.lingli { background:linear-gradient(90deg,#c9a96e,#e8c896); }
.stat-bar-fill.daohang { background:linear-gradient(90deg,#5a8a6a,#7ab08a); }
.stat-bar-fill.xinjing { background:linear-gradient(90deg,#6a4a8a,#9a7aba); }
.stat-bar-fill.shengwang { background:linear-gradient(90deg,#b08030,#d4a050); }
.stat-bar-fill.dizi { background:linear-gradient(90deg,#4a6a8a,#6a8aba); }

.stat-flash { animation: shake 0.3s ease; }
.stat-gain { color:var(--green-jade) !important; animation:flash 0.6s ease; }
.stat-loss { color:#c05050 !important; animation:flash 0.6s ease; }

/* 叙事区域 */
.narrative-box {
  background:var(--bg-card); border:1px solid var(--border-gold);
  border-radius:8px; padding:1.2rem; margin-bottom:0.8rem;
  min-height:160px; position:relative;
}
.narrative-tag {
  display:inline-block; font-size:0.65rem;
  padding:2px 8px; border-radius:10px;
  margin-bottom:0.6rem; letter-spacing:0.1em;
}
.tag-opportunity { background:rgba(90,138,106,0.2); color:var(--green-jade); border:1px solid rgba(90,138,106,0.3); }
.tag-crisis { background:rgba(180,60,60,0.15); color:#c06060; border:1px solid rgba(180,60,60,0.3); }
.tag-choice { background:rgba(201,169,110,0.15); color:var(--gold); border:1px solid var(--border-gold); }
.tag-tribulation { background:rgba(138,74,74,0.2); color:#d07070; border:1px solid rgba(180,80,80,0.4); }
.tag-heartdemon { background:rgba(106,74,138,0.2); color:#a87aca; border:1px solid rgba(106,74,138,0.3); }

.narrative-title { font-family:'Ma Shan Zheng',cursive; font-size:1.3rem; color:var(--gold-bright); margin-bottom:0.6rem; }
.narrative-text { font-size:0.88rem; line-height:1.8; color:var(--text-main); }
.narrative-metaphor {
  font-size:0.72rem; color:var(--text-dim);
  margin-top:0.6rem; padding-top:0.6rem;
  border-top:1px dashed rgba(201,169,110,0.15);
  font-style:italic;
}

/* 选项按钮 */
.choice-list { display:flex; flex-direction:column; gap:0.5rem; }
.choice-btn {
  padding:0.7rem 1rem; background:var(--bg-card);
  border:1px solid var(--border-gold); border-radius:6px;
  color:var(--text-main); font-size:0.85rem; text-align:left;
  cursor:pointer; transition:all 0.3s;
  font-family:'Noto Serif SC',serif; line-height:1.5;
}
.choice-btn:hover { border-color:var(--gold); background:var(--bg-card2); transform:translateX(4px); }
.choice-btn:active { transform:scale(0.98); }
.choice-btn .choice-hint { font-size:0.7rem; color:var(--gold-dim); margin-top:0.3rem; display:block; }

/* 结果反馈 */
.result-box {
  background:var(--bg-card2); border:1px solid var(--border-gold);
  border-radius:8px; padding:1rem; margin-bottom:0.8rem;
  animation: slideUp 0.5s ease;
}
.result-text { font-size:0.85rem; line-height:1.7; color:var(--text-main); }
.result-changes { display:flex; flex-wrap:wrap; gap:0.4rem; margin-top:0.6rem; }
.change-tag {
  font-size:0.7rem; padding:2px 8px; border-radius:10px;
}
.change-gain { background:rgba(90,138,106,0.15); color:var(--green-jade); }
.change-loss { background:rgba(180,60,60,0.12); color:#c06060; }

.continue-btn {
  width:100%; padding:0.7rem; margin-top:0.6rem;
  font-family:'ZCOOL XiaoWei',serif; font-size:1rem;
  color:var(--gold-bright);
  background:linear-gradient(135deg,rgba(201,169,110,0.12),rgba(201,169,110,0.04));
  border:1px solid var(--border-gold); border-radius:4px;
  cursor:pointer; letter-spacing:0.15em; transition:all 0.3s;
}
.continue-btn:hover { background:linear-gradient(135deg,rgba(201,169,110,0.2),rgba(201,169,110,0.08)); }

/* ===== 渡劫界面 ===== */
.tribulation-overlay {
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(10,5,5,0.92); z-index:100;
  display:none; align-items:center; justify-content:center;
  padding:1rem;
}
.tribulation-overlay.active { display:flex; animation:fadeIn 0.5s ease; }
.tribulation-content {
  max-width:480px; width:100%; text-align:center;
  animation: fadeIn 0.8s ease;
}
.tribulation-flash {
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(255,200,100,0.3); z-index:99;
  pointer-events:none; opacity:0;
}
.tribulation-flash.active { animation: flash 0.3s ease 3; }

.trib-title {
  font-family:'Ma Shan Zheng',cursive;
  font-size:2.5rem; color:#d05050;
  text-shadow:0 0 30px rgba(208,80,80,0.5);
  margin-bottom:0.5rem; animation:glow 2s ease-in-out infinite;
}
.trib-subtitle { font-size:0.85rem; color:var(--text-dim); margin-bottom:1.5rem; letter-spacing:0.2em; }
.trib-desc { font-size:0.9rem; line-height:1.8; color:var(--text-main); margin-bottom:1.5rem; }
.trib-metaphor { font-size:0.72rem; color:var(--text-dim); font-style:italic; margin-bottom:1.2rem; }

.trib-challenge-box {
  background:var(--bg-card); border:1px solid rgba(180,80,80,0.3);
  border-radius:8px; padding:1rem; margin-bottom:1rem;
  animation: pulse-border 2s ease-in-out infinite;
}
.trib-challenge-q { font-size:0.85rem; color:var(--text-bright); margin-bottom:0.8rem; }
.trib-choices { display:flex; flex-direction:column; gap:0.5rem; }

.trib-result { font-family:'Ma Shan Zheng',cursive; font-size:1.8rem; margin:1rem 0; }
.trib-success { color:var(--green-jade); }
.trib-fail { color:#c05050; }

/* ===== 结局界面 ===== */
.ending-screen { text-align:center; padding-top:3vh; }
.ending-title {
  font-family:'Ma Shan Zheng',cursive;
  font-size:2.8rem; margin-bottom:0.5rem;
  animation: glow 3s ease-in-out infinite;
}
.ending-title.ascend { color:var(--gold-bright); }
.ending-title.sect { color:var(--green-jade); }
.ending-title.wander { color:var(--gold); }
.ending-title.demon { color:#a040a0; }
.ending-title.destroy { color:#c05050; }

.ending-poem {
  font-family:'ZCOOL XiaoWei',serif; font-size:1rem;
  color:var(--text-dim); line-height:2; margin:1rem 0;
  padding:0 2rem;
}

.ending-summary {
  background:var(--bg-card); border:1px solid var(--border-gold);
  border-radius:8px; padding:1rem; margin:1rem 0;
  text-align:left;
}
.summary-row { display:flex; justify-content:space-between; padding:0.3rem 0; font-size:0.82rem; border-bottom:1px dashed rgba(201,169,110,0.1); }
.summary-row:last-child { border-bottom:none; }
.summary-label { color:var(--text-dim); }
.summary-value { color:var(--text-bright); }

.ending-journey {
  background:var(--bg-card); border:1px solid var(--border-gold);
  border-radius:8px; padding:0.8rem; margin:1rem 0;
  text-align:left; max-height:200px; overflow-y:auto;
}
.journey-item { font-size:0.75rem; color:var(--text-dim); padding:0.2rem 0; line-height:1.5; }
.journey-item .month-tag { color:var(--gold-dim); margin-right:0.4rem; }

.share-card {
  background:linear-gradient(135deg,rgba(201,169,110,0.1),rgba(106,74,138,0.05));
  border:1px solid var(--border-gold); border-radius:8px;
  padding:1rem; margin:1rem 0;
}
.share-title { font-family:'Ma Shan Zheng',cursive; font-size:1.2rem; color:var(--gold-bright); margin-bottom:0.5rem; }
.share-text { font-size:0.8rem; color:var(--text-main); line-height:1.7; }
.share-btn {
  width:100%; padding:0.6rem; margin-top:0.6rem;
  font-family:'ZCOOL XiaoWei',serif; font-size:0.9rem;
  color:var(--gold-bright);
  background:rgba(201,169,110,0.1); border:1px solid var(--border-gold);
  border-radius:4px; cursor:pointer; transition:all 0.3s;
}
.share-btn:hover { background:rgba(201,169,110,0.2); }

.restart-btn {
  width:100%; padding:0.8rem; margin-top:0.8rem;
  font-family:'ZCOOL XiaoWei',serif; font-size:1.1rem;
  color:var(--gold-bright);
  background:linear-gradient(135deg,rgba(201,169,110,0.15),rgba(201,169,110,0.05));
  border:1px solid var(--border-gold); border-radius:4px;
  cursor:pointer; letter-spacing:0.2em; transition:all 0.3s;
}
.restart-btn:hover { background:linear-gradient(135deg,rgba(201,169,110,0.25),rgba(201,169,110,0.1)); }

/* Toast */
.toast {
  position:fixed; bottom:20%; left:50%; transform:translateX(-50%);
  background:var(--bg-card2); border:1px solid var(--border-gold);
  color:var(--gold-bright); padding:0.5rem 1.5rem;
  border-radius:20px; font-size:0.8rem; z-index:200;
  opacity:0; transition:opacity 0.3s; pointer-events:none;
}
.toast.show { opacity:1; }

/* 滚动条 */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--gold-dim); border-radius:2px; }
</style>
</head>
<body>
<div id="app">

<!-- ===== 开局画面 ===== -->
<div class="screen start-screen active" id="screen-start">
  <div class="start-title">创业修仙<br>模拟器</div>
  <div class="start-subtitle">散 修 之 路</div>
  <div class="seal-decoration">试道</div>
  <div class="start-desc">
    天地初开，万物有灵。<br>
    你本是凡尘一散修，怀揣开宗立派之志，<br>
    踏入这凶险万分的修仙商道。<br><br>
    资金如灵力，稍有不慎便油尽灯枯；<br>
    人心似心魔，一个执念便可走火入魔。<br><br>
    <span style="color:var(--gold);">你，能渡过几重天劫？</span>
  </div>
  <button class="start-btn" onclick="startCreation()">踏 入 修 仙 界</button>
</div>

<!-- ===== 角色创建 ===== -->
<div class="screen creation-screen" id="screen-creation">
  <div class="creation-header">
    <div class="creation-title">开辟洞府</div>
    <div class="creation-hint">选择你的灵根与功法，踏上修仙创业之路</div>
  </div>

  <div class="section-label">道号</div>
  <input type="text" class="name-input" id="nameInput" placeholder="请输入你的道号..." maxlength="8">

  <div class="section-label">灵根禀赋（个人特质）</div>
  <div class="option-grid" id="linggenGrid"></div>

  <div class="section-label">功法道途（创业赛道）</div>
  <div class="option-grid" id="gongfaGrid"></div>

  <button class="confirm-btn" id="confirmBtn" onclick="startGame()" disabled>开 始 修 行</button>
</div>

<!-- ===== 游戏主界面 ===== -->
<div class="screen game-screen" id="screen-game">
  <div class="status-bar">
    <div class="status-left">
      <span class="status-name" id="statusName">散修</span>
      <span class="status-month" id="statusMonth">第1月</span>
    </div>
    <span class="status-stage" id="statusStage">散修期</span>
  </div>

  <div class="stats-panel" id="statsPanel"></div>

  <div class="narrative-box" id="narrativeBox"></div>
  <div id="choiceArea"></div>
</div>

<!-- ===== 结局画面 ===== -->
<div class="screen ending-screen" id="screen-ending">
  <div class="ending-title" id="endingTitle"></div>
  <div class="ending-poem" id="endingPoem"></div>
  <div class="ending-summary" id="endingSummary"></div>
  <div class="ending-journey" id="endingJourney"></div>
  <div class="share-card" id="shareCard"></div>
  <button class="restart-btn" onclick="restart()">重 新 入 道</button>
</div>

</div>

<!-- 渡劫遮罩 -->
<div class="tribulation-flash" id="tribFlash"></div>
<div class="tribulation-overlay" id="tribOverlay">
  <div class="tribulation-content" id="tribContent"></div>

// ===== 游戏状态 =====
let game = {};

function initGame() {
  game = {
    phase: 'start',
    month: 1,
    maxMonths: 24,
    name: '',
    linggen: null,
    gongfa: null,
    stats: { lingli:30, daohang:10, xinjing:70, shengwang:10, dizi:1 },
    eventsSeen: [],
    tribResults: [],
    log: [],
    pendingEvent: null,
    currentTrib: null,
    currentChallengeIdx: 0,
  };
}

// ===== UI 渲染 =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== 开局 =====
function startCreation() {
  showScreen('screen-creation');
  renderLinggen();
  renderGongfa();
  checkConfirm();
}

function renderLinggen() {
  const grid = document.getElementById('linggenGrid');
  grid.innerHTML = linggenOptions.map(o => `
    <div class="option-card" onclick="selectOption('linggen','${o.id}')">
      <div class="opt-name">${o.name}</div>
      <div class="opt-desc">${o.desc}</div>
      <div class="opt-bonus">${o.bonus}</div>
    </div>
  `).join('');
}

function renderGongfa() {
  const grid = document.getElementById('gongfaGrid');
  grid.innerHTML = gongfaOptions.map(o => `
    <div class="option-card" onclick="selectOption('gongfa','${o.id}')">
      <div class="opt-name">${o.name}</div>
      <div class="opt-desc">${o.desc}</div>
      <div class="opt-bonus">${o.bonus}</div>
    </div>
  `).join('');
}

function selectOption(type, id) {
  if (type === 'linggen') {
    game.linggen = id;
    document.querySelectorAll('#linggenGrid .option-card').forEach((c,i) => {
      c.classList.toggle('selected', linggenOptions[i].id === id);
    });
  } else {
    game.gongfa = id;
    document.querySelectorAll('#gongfaGrid .option-card').forEach((c,i) => {
      c.classList.toggle('selected', gongfaOptions[i].id === id);
    });
  }
  checkConfirm();
}

function checkConfirm() {
  const name = document.getElementById('nameInput').value.trim();
  const btn = document.getElementById('confirmBtn');
  btn.disabled = !(game.linggen && game.gongfa && name.length > 0);
}

document.addEventListener('input', e => {
  if (e.target.id === 'nameInput') checkConfirm();
});

function startGame() {
  game.name = document.getElementById('nameInput').value.trim();
  const lg = linggenOptions.find(o => o.id === game.linggen);
  const gf = gongfaOptions.find(o => o.id === game.gongfa);
  // 应用灵根加成
  if (lg.init) {
    for (let k in lg.init) game.stats[k] += lg.init[k];
  }
  showScreen('screen-game');
  nextEvent();
}

// ===== 游戏主循环 =====
function renderStats() {
  const lg = linggenOptions.find(o => o.id === game.linggen);
  const gf = gongfaOptions.find(o => o.id === game.gongfa);
  document.getElementById('statusName').textContent = game.name;
  document.getElementById('statusMonth').textContent = `第${game.month}月`;

  let stage = '散修期';
  if (game.month >= 18) stage = '渡劫期';
  else if (game.month >= 12) stage = '筑基期';
  else if (game.month >= 6) stage = '开光期';
  document.getElementById('statusStage').textContent = stage;

  const s = game.stats;
  const maxVal = 100;
  const items = [
    { icon:'💰', key:'lingli', label:'灵力', val:s.lingli, cls:'lingli' },
    { icon:'📜', key:'daohang', label:'道行', val:s.daohang, cls:'daohang' },
    { icon:'🧘', key:'xinjing', label:'心境', val:s.xinjing, cls:'xinjing' },
    { icon:'⭐', key:'shengwang', label:'声望', val:s.shengwang, cls:'shengwang' },
    { icon:'👥', key:'dizi', label:'弟子', val:s.dizi, cls:'dizi' },
  ];
  document.getElementById('statsPanel').innerHTML = items.map(it => {
    const pct = it.key === 'dizi' ? Math.min(it.val/10*100, 100) : Math.min(it.val/maxVal*100, 100);
    return `
      <div class="stat-item" id="stat-${it.key}">
        <div class="stat-icon">${it.icon}</div>
        <div class="stat-value" id="val-${it.key}">${it.val}</div>
        <div class="stat-label">${it.label}</div>
        <div class="stat-bar"><div class="stat-bar-fill ${it.cls}" style="width:${pct}%"></div></div>
      </div>
    `;
  }).join('');
}

function checkTribulation() {
  const trib = tribulations.find(t => t.month === game.month);
  if (trib && !game.tribResults.find(r => r.month === trib.month)) {
    return trib;
  }
  return null;
}

function nextEvent() {
  // 检查游戏结束
  if (game.stats.lingli <= 0) { endGame('destroy'); return; }
  if (game.stats.xinjing <= 0) { endGame('demon'); return; }
  if (game.month > game.maxMonths) { endGame('checkEnding'); return; }

  renderStats();

  // 检查渡劫
  const trib = checkTribulation();
  if (trib) {
    startTribulation(trib);
    return;
  }

  // 检查是否最后一月
  if (game.month >= game.maxMonths) {
    endGame('checkEnding');
    return;
  }

  // 随机事件
  const available = eventPool.filter(e => !game.eventsSeen.includes(e.title));
  const pool = available.length > 3 ? available : eventPool;
  const event = pool[Math.floor(Math.random() * pool.length)];
  game.pendingEvent = event;
  game.eventsSeen.push(event.title);
  renderEvent(event);
}

function renderEvent(event) {
  const tagClass = {
    opportunity: 'tag-opportunity',
    crisis: 'tag-crisis',
    choice: 'tag-choice',
    heartdemon: 'tag-heartdemon',
  }[event.type] || 'tag-choice';

  document.getElementById('narrativeBox').innerHTML = `
    <span class="narrative-tag ${tagClass}">${event.tag}</span>
    <div class="narrative-title">${event.title}</div>
    <div class="narrative-text">${event.text}</div>
    <div class="narrative-metaphor">${event.metaphor}</div>
  `;

  document.getElementById('choiceArea').innerHTML = `
    <div class="choice-list">
      ${event.choices.map((c,i) => `
        <button class="choice-btn" onclick="makeChoice(${i})">
          ${c.text}
          ${c.hint ? `<span class="choice-hint">${c.hint}</span>` : ''}
        </button>
      `).join('')}
    </div>
  `;
}

function makeChoice(idx) {
  const event = game.pendingEvent;
  const choice = event.choices[idx];
  applyEffects(choice.effects);

  // 记录日志
  game.log.push({
    month: game.month,
    title: event.title,
    choice: choice.text,
    effects: choice.effects,
  });

  // 显示结果
  showResult(event, choice);
}

function applyEffects(effects) {
  if (!effects) return;
  const before = {...game.stats};
  for (let k in effects) {
    if (k === 'lingli_turn') continue; // 每月灵力收入，特殊处理
    game.stats[k] = Math.max(0, (game.stats[k] || 0) + effects[k]);
  }
  // lingli_turn: 每月增加灵力
  if (effects.lingli_turn) {
    game._lingliTurn = (game._lingliTurn || 0) + effects.lingli_turn;
  }
}

function showResult(event, choice) {
  const changes = [];
  if (choice.effects) {
    const labels = {lingli:'灵力',daohang:'道行',xinjing:'心境',shengwang:'声望',dizi:'弟子'};
    for (let k in choice.effects) {
      if (k === 'lingli_turn') continue;
      const v = choice.effects[k];
      if (v > 0) changes.push(`<span class="change-tag change-gain">${labels[k]} +${v}</span>`);
      else if (v < 0) changes.push(`<span class="change-tag change-loss">${labels[k]} ${v}</span>`);
    }
  }

  let resultText = '';
  const e = choice.effects || {};
  if (e.lingli > 10 || e.daohang > 10) resultText = '你的选择带来了丰厚的回报，修行更上一层楼。';
  else if (e.lingli < -10 || e.daohang < -10) resultText = '这个选择让你付出了不小的代价，但修行之路本就如此。';
  else if (e.xinjing < -5) resultText = '心中隐隐有些不安，但你强迫自己继续前行。';
  else if (e.xinjing > 5) resultText = '心境澄明，仿佛对修行之道有了新的感悟。';
  else resultText = '一切尘埃落定，修行仍在继续。';

  document.getElementById('choiceArea').innerHTML = `
    <div class="result-box">
      <div class="result-text">${resultText}</div>
      ${changes.length ? `<div class="result-changes">${changes.join('')}</div>` : ''}
    </div>
    <button class="continue-btn" onclick="advanceMonth()">继 续 修 行</button>
  `;

  // 数值变化动画
  animateStatChanges(choice.effects);
}

function animateStatChanges(effects) {
  if (!effects) return;
  for (let k in effects) {
    if (k === 'lingli_turn') continue;
    const el = document.getElementById('val-' + k);
    if (el) {
      el.classList.remove('stat-gain','stat-loss');
      void el.offsetWidth;
      if (effects[k] > 0) el.classList.add('stat-gain');
      else if (effects[k] < 0) el.classList.add('stat-loss');
    }
    const item = document.getElementById('stat-' + k);
    if (item) {
      item.classList.remove('stat-flash');
      void item.offsetWidth;
      item.classList.add('stat-flash');
    }
  }
}

function advanceMonth() {
  game.month++;
  // 每月灵力收入
  if (game._lingliTurn) {
    game.stats.lingli += game._lingliTurn;
  }
  // 每月小额灵力消耗（维持洞府）
  if (game.stats.dizi > 0) {
    game.stats.lingli = Math.max(0, game.stats.lingli - game.stats.dizi * 2);
  }
  // 心境自然恢复
  if (game.stats.xinjing < 70) game.stats.xinjing += 2;

  // 检查死亡条件
  if (game.stats.lingli <= 0) { endGame('destroy'); return; }
  if (game.stats.xinjing <= 0) { endGame('demon'); return; }

  nextEvent();
}

// ===== 渡劫系统 =====
function startTribulation(trib) {
  game.currentTrib = trib;
  game.currentChallengeIdx = 0;
  const flash = document.getElementById('tribFlash');
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 900);

  setTimeout(() => {
    document.getElementById('tribOverlay').classList.add('active');
    renderTribulation();
  }, 600);
}

function renderTribulation() {
  const trib = game.currentTrib;
  const idx = game.currentChallengeIdx;

  if (idx >= trib.challenges.length) {
    // 渡劫完成
    finishTribulation();
    return;
  }

  const challenge = trib.challenges[idx];

  document.getElementById('tribContent').innerHTML = `
    <div class="trib-title">${trib.name}</div>
    <div class="trib-subtitle">${trib.subtitle}</div>
    <div class="trib-desc">${idx === 0 ? trib.desc : '天劫持续，新的挑战接踵而至...'}</div>
    <div class="trib-metaphor">${trib.metaphor}</div>
    <div class="trib-challenge-box">
      <div class="trib-challenge-q">${challenge.q}</div>
      <div class="trib-choices">
        ${challenge.choices.map((c,i) => `
          <button class="choice-btn" onclick="tribChoice(${i})">
            ${c.text}
            ${c.hint ? `<span class="choice-hint">${c.hint}</span>` : ''}
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function tribChoice(idx) {
  const trib = game.currentTrib;
  const challenge = trib.challenges[game.currentChallengeIdx];
  const choice = challenge.choices[idx];

  // 检查是否满足条件
  const reqMet = !choice.req || Object.entries(choice.req).every(([k,v]) => game.stats[k] >= v);

  applyEffects(choice.effects);

  if (!reqMet || !choice.pass) {
    // 渡劫失败
    game.tribResults.push({ month: trib.month, name: trib.name, success: false });
    game.log.push({ month: game.month, title: trib.name, choice: choice.text + '（渡劫失败）', effects: choice.effects });

    document.getElementById('tribContent').innerHTML = `
      <div class="trib-title trib-fail">渡 劫 失 败</div>
      <div class="trib-desc">${trib.fail}</div>
      <div class="result-changes" style="justify-content:center;">
        ${Object.entries(choice.effects).filter(([k,v])=>k!=='lingli_turn').map(([k,v])=>{
          const labels={lingli:'灵力',daohang:'道行',xinjing:'心境',shengwang:'声望',dizi:'弟子'};
          return v>0 ? `<span class="change-tag change-gain">${labels[k]} +${v}</span>` : `<span class="change-tag change-loss">${labels[k]} ${v}</span>`;
        }).join('')}
      </div>
      <button class="continue-btn" onclick="closeTribulation()" style="margin-top:1rem;">吞 下 苦 果</button>
    `;
  } else {
    game.currentChallengeIdx++;
    // 检查是否所有挑战都通过
    if (game.currentChallengeIdx >= trib.challenges.length) {
      // 渡劫成功
      game.tribResults.push({ month: trib.month, name: trib.name, success: true });
      game.log.push({ month: game.month, title: trib.name, choice: '渡劫成功', effects: {} });
      // 渡劫成功奖励
      game.stats.lingli += 10;
      game.stats.shengwang += 8;

      document.getElementById('tribContent').innerHTML = `
        <div class="trib-title trib-success">渡 劫 成 功</div>
        <div class="trib-desc">${trib.success}</div>
        <div class="result-changes" style="justify-content:center;">
          <span class="change-tag change-gain">灵力 +10</span>
          <span class="change-tag change-gain">声望 +8</span>
        </div>
        <button class="continue-btn" onclick="closeTribulation()" style="margin-top:1rem;">乘 胜 前 行</button>
      `;
    } else {
      // 继续下一个挑战
      renderTribulation();
    }
  }
}

function closeTribulation() {
  document.getElementById('tribOverlay').classList.remove('active');
  game.currentTrib = null;
  game.currentChallengeIdx = 0;
  // 检查渡劫后是否死亡
  if (game.stats.lingli <= 0) { endGame('destroy'); return; }
  if (game.stats.xinjing <= 0) { endGame('demon'); return; }
  setTimeout(() => nextEvent(), 300);
}

// ===== 结局系统 =====
function endGame(type) {
  showScreen('screen-ending');
  renderStats();

  let ending, poem, titleClass;

  if (type === 'destroy') {
    ending = 'destroy';
    poem = '灵力枯竭，洞府崩塌<br>散修一场，终成泡影<br>莫道修行无代价<br>凡入此道，皆付光阴';
    titleClass = 'destroy';
  } else if (type === 'demon') {
    ending = 'demon';
    poem = '心魔缠身，道心崩碎<br>执念成魔，迷失本我<br>莫问前路何处去<br>回首已是百年身';
    titleClass = 'demon';
  } else {
    // 根据数值判定结局
    const s = game.stats;
    const tribSuccess = game.tribResults.filter(t => t.success).length;
    if (s.lingli >= 70 && s.daohang >= 50 && s.shengwang >= 50 && s.xinjing >= 30 && tribSuccess >= 3) {
      ending = 'ascend';
      poem = '九天雷动，仙乐飘飘<br>一朝飞升，万人仰望<br>莫道散修无仙路<br>心坚志定，终成大道';
      titleClass = 'ascend';
    } else if (s.lingli >= 40 && s.shengwang >= 25) {
      ending = 'sect';
      poem = '开宗立派，弟子如云<br>虽未飞升，亦是一方之主<br>莫道此生虚度<br>山中无甲子，修行为真';
      titleClass = 'sect';
    } else {
      ending = 'wander';
      poem = '修行一场，终归平淡<br>散修之路，各有归途<br>莫道此行无所获<br>经历即修行，放下即得道';
      titleClass = 'wander';
    }
  }

  const titles = {
    ascend: '飞 升 成 仙',
    sect: '开 宗 立 派',
    wander: '隐 世 散 修',
    demon: '走 火 入 魔',
    destroy: '魂 飞 魄 散',
  };

  document.getElementById('endingTitle').className = 'ending-title ' + titleClass;
  document.getElementById('endingTitle').textContent = titles[ending];
  document.getElementById('endingPoem').innerHTML = poem;

  // 结局数值总结
  const s = game.stats;
  const tribCount = game.tribResults.length;
  const tribPass = game.tribResults.filter(t => t.success).length;
  document.getElementById('endingSummary').innerHTML = `
    <div class="summary-row"><span class="summary-label">道号</span><span class="summary-value">${game.name}</span></div>
    <div class="summary-row"><span class="summary-label">灵根</span><span class="summary-value">${linggenOptions.find(o=>o.id===game.linggen).name}</span></div>
    <div class="summary-row"><span class="summary-label">功法</span><span class="summary-value">${gongfaOptions.find(o=>o.id===game.gongfa).name}</span></div>
    <div class="summary-row"><span class="summary-label">修行时长</span><span class="summary-value">${game.month - 1} 月</span></div>
    <div class="summary-row"><span class="summary-label">渡劫经历</span><span class="summary-value">${tribPass} 成 ${tribCount} 劫</span></div>
    <div class="summary-row"><span class="summary-label">最终灵力</span><span class="summary-value">${Math.max(0,s.lingli)}</span></div>
    <div class="summary-row"><span class="summary-label">最终道行</span><span class="summary-value">${s.daohang}</span></div>
    <div class="summary-row"><span class="summary-label">最终心境</span><span class="summary-value">${Math.max(0,s.xinjing)}</span></div>
    <div class="summary-row"><span class="summary-label">最终声望</span><span class="summary-value">${s.shengwang}</span></div>
    <div class="summary-row"><span class="summary-label">门下弟子</span><span class="summary-value">${s.dizi} 人</span></div>
  `;

  // 修行历程
  document.getElementById('endingJourney').innerHTML = `
    <div style="font-size:0.8rem;color:var(--gold);margin-bottom:0.4rem;">📜 修行历程</div>
    ${game.log.map(l => `
      <div class="journey-item">
        <span class="month-tag">第${l.month}月</span>
        <span style="color:var(--text-main);">${l.title}</span>
        <span style="color:var(--text-dim);">— ${l.choice}</span>
      </div>
    `).join('')}
  `;

  // 社交分享卡
  const linggenName = linggenOptions.find(o=>o.id===game.linggen).name;
  const gongfaName = gongfaOptions.find(o=>o.id===game.gongfa).name;
  let shareText = '';
  if (ending === 'ascend') {
    shareText = `我是「${game.name}」，修${linggenName}、练${gongfaName}，历经${tribPass}重天劫，终得飞升成仙！你也来试试你的修仙创业之路？`;
  } else if (ending === 'sect') {
    shareText = `我是「${game.name}」，修${linggenName}、练${gongfaName}，虽未飞升，但开宗立派，门下${s.dizi}人！你的修仙之路又会如何？`;
  } else if (ending === 'wander') {
    shareText = `我是「${game.name}」，修${linggenName}、练${gongfaName}，修行${game.month-1}月，终归平淡。散修之路，各有归途，你呢？`;
  } else if (ending === 'demon') {
    shareText = `我是「${game.name}」，修${linggenName}、练${gongfaName}，心境崩碎，走火入魔... 创业修仙，心魔比天劫更可怕。`;
  } else {
    shareText = `我是「${game.name}」，修${linggenName}、练${gongfaName}，灵力枯竭，魂飞魄散... 散修一场，终成泡影。`;
  }

  document.getElementById('shareCard').innerHTML = `
    <div class="share-title">渡劫报告</div>
    <div class="share-text">${shareText}</div>
    <button class="share-btn" onclick="copyShare('${ending}')">复制渡劫报告</button>
  `;
}

function copyShare(ending) {
  const lg = linggenOptions.find(o=>o.id===game.linggen).name;
  const gf = gongfaOptions.find(o=>o.id===game.gongfa).name;
  const s = game.stats;
  const tribPass = game.tribResults.filter(t=>t.success).length;
  const titles = {ascend:'飞升成仙',sect:'开宗立派',wander:'隐世散修',demon:'走火入魔',destroy:'魂飞魄散'};

  const text = `【创业修仙模拟器 · 渡劫报告】\n` +
    `道号：${game.name}\n` +
    `灵根：${lg} | 功法：${gf}\n` +
    `结局：${titles[ending]}\n` +
    `修行时长：${game.month-1}月\n` +
    `渡劫：${tribPass}成${game.tribResults.length}劫\n` +
    `灵力:${Math.max(0,s.lingli)} 道行:${s.daohang} 心境:${Math.max(0,s.xinjing)} 声望:${s.shengwang} 弟子:${s.dizi}\n` +
    `你也来试试你的修仙创业之路？`;

  // 复制到剪贴板
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('渡劫报告已复制！'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('渡劫报告已复制！'); }
    catch(e) { showToast('复制失败，请手动选择'); }
    document.body.removeChild(ta);
  }
}

function restart() {
  initGame();
  showScreen('screen-start');
  document.getElementById('nameInput').value = '';
}

// ===== 初始化 =====
initGame();
</script>
</body>
</html>
