<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>盲区猎人 · 注意力训练站</title>
<style>
  /* =============================
     全局变量与基础样式
     ============================= */
  :root {
    --bg: #0b1020;          /* 深蓝黑背景 */
    --bg-2: #121a30;        /* 面板/卡片背景 */
    --line: #1e2a4a;        /* 边框/分割线 */
    --text: #e6ecff;        /* 主文字 */
    --text-dim: #8a97b8;    /* 次要文字 */
    --text-mute: #566283;   /* 弱文字 */
    --primary: #22d3ee;     /* 主色调 - 青色 */
    --primary-soft: rgba(34, 211, 238, 0.12);
    --danger: #ff6b6b;      /* 错误/危险色 */
    --warn: #fbbf24;        /* 警告/高亮色 */
    --mono: "JetBrains Mono", "SFMono-Regular", "Fira Code", Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent; /* 移除 iOS 点击高亮 */
    user-select: none;
    touch-action: manipulation; /* 禁用双击缩放，优化触摸响应 */
  }

  .app {
    max-width: 820px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  /* =============================
     顶部品牌区
     ============================= */
  .brand {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
  }
  .brand-title {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; letter-spacing: 0.5px;
  }
  .brand-title .logo {
    width: 26px; height: 26px; border-radius: 6px;
    background: var(--primary);
    display: grid; place-items: center; color: var(--bg);
    font-family: var(--mono); font-weight: 800; font-size: 14px;
  }
  .brand-title .sub {
    color: var(--text-dim); font-size: 13px; margin-left: 4px; font-weight: 400;
  }
  .nav-tabs { display: flex; gap: 4px; }
  .nav-tabs button {
    background: transparent; color: var(--text-mute);
    border: 1px solid transparent;
    padding: 6px 12px; border-radius: 6px;
    font-size: 13px; cursor: pointer; transition: all .15s ease;
  }
  .nav-tabs button:hover { color: var(--text); background: var(--bg-2); }
  .nav-tabs button.active {
    color: var(--primary); border-color: var(--line);
    background: var(--primary-soft);
  }

  /* =============================
     卡片面板
     ============================= */
  .panel {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 24px;
  }

  /* 页面切换 */
  .page { display: none; }
  .page.active { display: block; }

  /* =============================
     首页
     ============================= */
  .hero {
    text-align: left; padding: 8px 4px 20px;
  }
  .hero h1 {
    margin: 0 0 6px; font-size: 26px; font-weight: 600; letter-spacing: 0.5px;
    color: var(--text);
  }
  .hero p.lead {
    color: var(--text-dim); margin: 0 0 18px; line-height: 1.6; font-size: 14px;
  }

  /* 尺寸选择按钮 */
  .size-selector {
    display: flex; justify-content: flex-start; gap: 8px; margin: 8px 0 18px;
    flex-wrap: wrap;
  }
  .size-btn {
    background: var(--bg-2); color: var(--text-dim);
    border: 1px solid var(--line); padding: 10px 16px;
    border-radius: 6px; cursor: pointer; font-size: 14px;
    transition: all .2s ease;
    font-family: var(--mono);
    position: relative;
    overflow: hidden;
  }
  .size-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.1), transparent);
    transition: left .3s ease;
  }
  .size-btn:hover::before {
    left: 100%;
  }
  .size-btn .sub { color: var(--text-mute); font-size: 11px; margin-left: 4px; }
  .size-btn:hover { border-color: var(--primary); color: var(--text); }
  .size-btn.active {
    border-color: var(--primary);
    background: var(--primary-soft);
    color: var(--primary);
    box-shadow: 0 0 12px rgba(34, 211, 238, 0.2);
  }

  /* 主按钮 */
  .primary-btn {
    display: inline-block;
    background: linear-gradient(135deg, var(--primary), #0ea5b9);
    color: var(--bg); border: none;
    padding: 12px 28px; border-radius: 6px; font-size: 14px;
    font-weight: 600; cursor: pointer; letter-spacing: 0.5px;
    transition: all .2s ease;
    box-shadow: 0 4px 12px rgba(34, 211, 238, 0.3);
  }
  .primary-btn:hover { 
    opacity: 0.9; 
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(34, 211, 238, 0.4);
  }
  .primary-btn:active {
    transform: translateY(0);
  }

  /* 次要按钮 */
  .ghost-btn {
    background: var(--bg-2); color: var(--text-dim);
    border: 1px solid var(--line); padding: 8px 16px;
    border-radius: 6px; font-size: 13px; cursor: pointer;
    transition: all .15s;
  }
  .ghost-btn:hover { border-color: var(--primary); color: var(--primary); }

  /* 统计卡片 */
  .stats-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px; margin-top: 8px;
  }
  .stat-card {
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 12px 14px;
    transition: all .2s ease;
  }
  .stat-card:hover {
    border-color: var(--text-mute);
    transform: translateY(-2px);
  }
  .stat-card .label { color: var(--text-mute); font-size: 11px; letter-spacing: 0.5px; }
  .stat-card .value { color: var(--text); font-size: 20px; margin-top: 4px; font-family: var(--mono); font-weight: 500; }
  .stat-card .value small { font-size: 11px; color: var(--text-dim); font-weight: 400; margin-left: 4px; }

  /* =============================
     训练页
     ============================= */
  .training-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .timer {
    font-family: var(--mono); font-size: 28px; font-weight: 500;
    color: var(--primary); letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
  }
  .timer small { color: var(--text-mute); font-size: 12px; margin-left: 6px; font-weight: 400; }
  .progress {
    font-family: var(--mono); color: var(--text-dim); font-size: 13px;
  }
  .combo-badge {
    background: transparent; color: var(--primary);
    border: 1px solid var(--line); padding: 4px 10px;
    border-radius: 4px; font-family: var(--mono); font-size: 12px;
    transition: all .2s ease;
  }
  .combo-badge.pop { 
    border-color: var(--primary);
    background: var(--primary-soft);
    transform: scale(1.1);
    box-shadow: 0 0 12px rgba(34, 211, 238, 0.3);
  }

  /* 网格容器 */
  .grid-wrap {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 10px;
  }
  .grid {
    display: grid; gap: 4px;
    width: min(90vw, 520px); aspect-ratio: 1 / 1;
    background: transparent;
    padding: 4px;
  }
  .cell {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    display: grid; place-items: center;
    font-family: var(--mono); font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: all .15s ease;
    user-select: none;
    position: relative;
    overflow: hidden;
  }
  .cell::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(34, 211, 238, 0.2) 0%, transparent 70%);
    opacity: 0;
    transition: opacity .3s ease;
  }
  .cell:hover { 
    border-color: var(--primary);
    transform: scale(1.02);
  }
  .cell:hover::after {
    opacity: 1;
  }
  .cell:active {
    transform: scale(0.98);
  }
  /* 正确点击反馈 */
  .cell.correct {
    background: var(--primary);
    color: var(--bg);
    border-color: var(--primary);
    transform: scale(0.95);
    opacity: 0.3;
    pointer-events: none;
    box-shadow: 0 0 12px rgba(34, 211, 238, 0.4);
  }
  .cell.correct::after {
    opacity: 0;
  }
  /* 错误点击反馈 */
  .cell.wrong {
    animation: shake .35s ease;
    border-color: var(--danger);
    color: var(--danger);
    background: rgba(255, 107, 107, 0.1);
  }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-3px, 1px); }
    50% { transform: translate(2px, -1px); }
    75% { transform: translate(-1px, 1px); }
  }

  /* 倒计时遮罩 */
  .countdown {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 80px; font-weight: 300;
    color: var(--primary);
    background: rgba(11, 16, 32, 0.85);
    border-radius: 4px;
    pointer-events: none;
  }
  .countdown.show { display: flex; }

  /* =============================
     结果页
     ============================= */
  .result-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    align-items: start;
  }
  @media (max-width: 720px) {
    .result-grid { grid-template-columns: 1fr; }
  }
  .time-card {
    text-align: left; padding: 4px 0 8px;
  }
  .time-card .t {
    font-family: var(--mono); font-size: 48px; font-weight: 500; color: var(--primary);
    letter-spacing: 2px;
    text-shadow: 0 0 30px rgba(34, 211, 238, 0.4);
    animation: fadeInUp .5s ease;
  }
  .time-card .t small { font-size: 16px; color: var(--text-dim); margin-left: 4px; font-weight: 400; }
  .time-card .sub { color: var(--text-mute); font-size: 12px; margin-top: 6px; }
  .time-card .record-badge {
    display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 4px;
    background: linear-gradient(135deg, var(--warn), #f97316);
    color: var(--bg); font-weight: 600; font-size: 12px;
    box-shadow: 0 4px 12px rgba(251, 191, 36, 0.4);
    animation: fadeInUp .5s ease .2s both;
  }
  .metrics {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    animation: fadeInUp .5s ease .3s both;
  }
  .metric {
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
    padding: 12px;
    transition: all .2s ease;
  }
  .metric:hover {
    border-color: var(--text-mute);
    transform: translateY(-2px);
  }
  .metric .k { color: var(--text-mute); font-size: 11px; }
  .metric .v { color: var(--text); font-size: 20px; font-family: var(--mono); margin-top: 4px; font-weight: 600; }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* 雷达图区域 */
  .radar-wrap {
    margin-top: 4px; text-align: center;
  }
  .radar-wrap h3 { margin: 0 0 2px; font-size: 13px; color: var(--text-dim); font-weight: 500; }
  .radar-wrap canvas { max-width: 100%; height: auto; }

  /* 建议卡片 */
  .suggest-card {
    margin-top: 14px;
    background: var(--bg);
    border-left: 2px solid var(--primary);
    padding: 10px 14px;
  }
  .suggest-card .txt { color: var(--text-dim); font-size: 13px; line-height: 1.6; }
  .suggest-card .txt strong { color: var(--primary); font-weight: 500; }

  /* =============================
     历史页
     ============================= */
  .history-grid {
    display: grid; grid-template-columns: 1fr; gap: 12px;
  }
  .chart-card h3 { margin: 0 0 4px; font-size: 14px; color: var(--text); font-weight: 500; }
  .chart-card .hint { color: var(--text-mute); font-size: 12px; margin-bottom: 6px; }
  .chart-card canvas { max-width: 100%; height: auto; width: 100%; }

  /* 历史记录列表 */
  .record-list {
    margin-top: 6px;
  }
  .record-item {
    display: grid; grid-template-columns: 44px 1fr auto auto; gap: 10px;
    padding: 10px 12px; background: transparent;
    border: 1px solid var(--line); border-radius: 4px;
    margin-bottom: 4px; align-items: center;
    transition: all .2s ease;
  }
  .record-item:hover {
    background: rgba(34, 211, 238, 0.05);
    border-color: var(--text-mute);
    transform: translateX(4px);
  }
  .record-item .idx { font-family: var(--mono); color: var(--text-mute); font-size: 11px; }
  .record-item .date { color: var(--text-dim); font-size: 12px; font-family: var(--mono); }
  .record-item .size { color: var(--primary); font-family: var(--mono); font-size: 12px; }
  .record-item .time { font-family: var(--mono); font-size: 14px; color: var(--text); font-weight: 600; }

  /* 按钮行 */
  .btn-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; justify-content: flex-start; }

  /* Toast 提示 */
  .toast {
    position: fixed; left: 50%; top: 24px;
    transform: translateX(-50%) translateY(-20px);
    background: var(--bg-2); border: 1px solid var(--line);
    color: var(--primary); padding: 6px 14px; border-radius: 4px;
    font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 空态 */
  .empty {
    color: var(--text-mute); text-align: left; padding: 24px 10px; font-size: 13px;
  }

  /* 导出按钮 */
  .export-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; color: var(--text-mute); border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 4px; font-size: 11px; cursor: pointer;
    margin-top: 4px;
    font-family: var(--mono);
  }
  .export-btn:hover { color: var(--primary); border-color: var(--primary); }

  /* 键盘提示 */
  .kbd-hint {
    color: var(--text-mute); font-size: 11px; margin-top: 4px;
    font-family: var(--mono);
  }
  .kbd-hint kbd {
    background: var(--bg); border: 1px solid var(--line); border-radius: 3px;
    padding: 1px 4px; font-size: 10px;
  }
</style>
</head>
<body>
<div class="app">

  <!-- ==============================
       顶部品牌与导航
       ============================== -->
  <div class="brand">
    <div class="brand-title">
      <div class="logo">◉</div>
      <div>盲区猎人<span class="sub">注意力训练</span></div>
    </div>
    <div class="nav-tabs" id="navTabs">
      <button data-target="home" class="active">训练</button>
      <button data-target="history">记录</button>
    </div>
  </div>

  <!-- ==============================
       首页：训练设置与统计
       ============================== -->
  <section class="page active" id="page-home">
    <div class="panel">
      <div class="hero">
        <h1>注意力训练</h1>
        <p class="lead">
          眼睛尽量盯住网格中心，用余光按顺序点击 1、2、3……训练结束后，
          视觉盲区雷达图会告诉你八个方位中哪些方向反应较慢。
        </p>

        <!-- 首页统计卡片 -->
        <div class="stats-row" id="homeStats"></div>

        <!-- 尺寸选择 -->
        <div style="margin-top: 14px; color: var(--text-mute); font-size: 12px;" id="sizeHint">选择网格尺寸</div>
        <div class="size-selector" id="sizeSelector"></div>

        <!-- 开始按钮 -->
        <button class="primary-btn" id="btnStart">开始训练</button>
        <div class="kbd-hint">提示：训练中可按 <kbd>Esc</kbd> 退出</div>
      </div>
    </div>
  </section>

  <!-- ==============================
       训练页：实时训练界面
       ============================== -->
  <section class="page" id="page-train">
    <div class="panel">
      <!-- 顶部：计时器 / COMBO / 进度 -->
      <div class="training-head">
        <div class="timer" id="timer">00:00.00<small id="timerLabel">训练中</small></div>
        <div class="combo-badge" id="comboBadge">COMBO × 0</div>
        <div class="progress" id="progress">0 / 0</div>
      </div>

      <!-- 网格 + 倒计时 -->
      <div class="grid-wrap">
        <div class="grid" id="grid"></div>
        <div class="countdown" id="countdown"></div>
      </div>

      <!-- 放弃按钮 -->
      <div class="btn-row">
        <button class="ghost-btn" id="btnQuit">结束</button>
      </div>
    </div>
  </section>

  <!-- ==============================
       结果页：本轮成绩与雷达图
       ============================== -->
  <section class="page" id="page-result">
    <div class="panel">
      <!-- 耗时大字 -->
      <div class="time-card">
        <div class="t" id="finalTime">0.00<small>秒</small></div>
        <div class="sub" id="finalSub">完成 5×5 网格 · 准确率 100%</div>
        <div id="recordBadgeWrap"></div>
      </div>

      <!-- 指标 + 雷达图 -->
      <div class="result-grid">
        <div>
          <div class="metrics" id="resultMetrics"></div>
        </div>
        <div>
          <div class="radar-wrap">
            <canvas id="radarCanvas" width="420" height="400"></canvas>
          </div>
        </div>
      </div>

      <!-- 难度建议 -->
      <div class="suggest-card" id="suggestCard"></div>

      <!-- 操作按钮 -->
      <div class="btn-row">
        <button class="primary-btn" id="btnNext">下一轮</button>
        <button class="ghost-btn" id="btnBackHome">返回</button>
        <button class="ghost-btn" id="btnExportRadar">导出雷达图</button>
      </div>
    </div>
  </section>

  <!-- ==============================
       历史页：成长曲线与记录
       ============================== -->
  <section class="page" id="page-history">
    <div class="panel">
      <div class="history-grid">
        <!-- 成长曲线图 -->
        <div class="chart-card">
          <h3>成长曲线</h3>
          <div class="hint">完成时间（秒）· 越低越好 · 不同颜色代表不同网格尺寸</div>
          <canvas id="growthCanvas" width="800" height="280"></canvas>
        </div>

        <!-- 最近训练记录 -->
        <div class="chart-card">
          <h3>最近训练</h3>
          <div class="hint" id="historyHint"></div>
          <div class="record-list" id="recordList"></div>
        </div>
      </div>

      <!-- 清空按钮 -->
      <div class="btn-row">
        <button class="ghost-btn" id="btnClearHistory">清空记录</button>
      </div>
    </div>
  </section>

</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<script>
/* =========================================================
 * 盲区猎人 Blind Spot Hunter - 注意力训练工具
 * ---------------------------------------------------------
 * 单文件前端实现：HTML + CSS + 原生 JavaScript + Canvas
 * 数据持久化：localStorage
 *
 * 核心模块：
 *   1. Fisher-Yates 洗牌 + 网格生成
 *   2. performance.now() 高精度计时
 *   3. 8 方位判断与反应时间统计
 *   4. Canvas 手绘雷达图 / 折线图
 *   5. localStorage 读写与容错
 *   6. 自适应难度建议
 *   7. 键盘快捷键支持
 *   8. 移动端触摸优化
 * ========================================================= */

(function () {
  'use strict';

  /* ===========================
     工具函数
     =========================== */

  /**
   * Fisher-Yates 洗牌算法
   * 时间复杂度 O(n)，空间复杂度 O(1)
   * 确保每个排列出现的概率相等（均匀分布）
   */
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  /**
   * 数字前导零补全
   * @param {number} n - 数字
   * @returns {string} 补零后的两位字符串
   */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /**
   * 格式化毫秒为 mm:ss.ms
   * @param {number} ms - 毫秒数
   * @returns {string} 格式化时间字符串
   */
  function formatTime(ms) {
    const total = Math.max(0, ms);
    const m = Math.floor(total / 60000);
    const s = Math.floor((total % 60000) / 1000);
    const cs = Math.floor((total % 1000) / 10); // 百分之一秒
    return pad2(m) + ':' + pad2(s) + '.' + pad2(cs);
  }

  /**
   * 显示 Toast 提示
   * @param {string} msg - 提示内容
   * @param {number} ms - 显示时长（毫秒）
   */
  function showToast(msg, ms) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove('show'), ms || 1800);
  }

  /* ===========================
     8 方位定义
     =========================== */
  /**
   * 方位索引与方向对应关系：
   * 0: 上 (Top)
   * 1: 右上 (Top-Right)
   * 2: 右 (Right)
   * 3: 右下 (Bottom-Right)
   * 4: 下 (Bottom)
   * 5: 左下 (Bottom-Left)
   * 6: 左 (Left)
   * 7: 左上 (Top-Left)
   */
  const DIRS = ['上', '右上', '右', '右下', '下', '左下', '左', '左上'];

  /**
   * 根据格子坐标 (row, col) 与网格边长 size，计算其归属方位
   * 以网格中心为原点，使用 atan2 计算角度，8分圆判断
   * @param {number} row - 行索引（从0开始）
   * @param {number} col - 列索引（从0开始）
   * @param {number} size - 网格边长
   * @returns {number} 方位索引 0-7
   */
  function getDirection(row, col, size) {
    // 中心点坐标（以 0 索引浮点）
    const cx = (size - 1) / 2;
    const cy = (size - 1) / 2;
    const dx = col - cx;
    const dy = row - cy;
    // 几乎在中心（距离小于 0.3），归类为"上"作为兜底
    if (Math.abs(dx) < 0.3 && Math.abs(dy) < 0.3) return 0;

    // 计算角度（弧度）：atan2(y, x)
    // 目标：0° 指向上方（-y 方向），顺时针
    let angle = Math.atan2(dx, -dy); // (-y 为 0 方向，x 是顺时针正向)
    if (angle < 0) angle += Math.PI * 2;
    // 每 45° 一个扇区，共 8 个
    const idx = Math.floor((angle + Math.PI / 8) / (Math.PI / 4)) % 8;
    return idx;
  }

  /* ===========================
     localStorage 封装（带容错）
     =========================== */
  const STORAGE_KEY = 'blind_spot_hunter_history_v1';

  /**
   * 读取训练历史
   * @returns {Array} 训练记录数组
   */
  function loadHistory() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return [];
      return arr.filter(x => x && typeof x === 'object');
    } catch (e) {
      console.warn('读取历史失败，重置：', e);
      return [];
    }
  }

  /**
   * 保存训练历史
   * @param {Array} list - 训练记录数组
   * @returns {boolean} 是否保存成功
   */
  function saveHistory(list) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      console.warn('保存历史失败：', e);
      return false;
    }
  }

  /**
   * 追加一条训练记录
   * @param {Object} rec - 训练记录
   * @returns {Array} 更新后的历史记录
   */
  function appendRecord(rec) {
    const list = loadHistory();
    list.push(rec);
    saveHistory(list);
    return list;
  }

  /* ===========================
     全局状态
     =========================== */
  const state = {
    size: 5,                  // 当前网格尺寸
    training: false,          // 是否在训练中
    paused: false,            // 是否暂停（页面切换时）
    startTime: 0,             // 本轮开始时间戳（performance.now）
    lastClickTime: 0,         // 上一次点击时间戳
    expectedNext: 1,          // 下一个要点的数字
    total: 0,                 // 总格子数
    correctClicks: 0,         // 正确点击次数
    wrongClicks: 0,           // 错误点击次数
    combo: 0,                 // 当前连击数
    maxCombo: 0,              // 最高连击数
    dirStats: new Array(8).fill(null).map(() => ({ count: 0, sum: 0 })), // 8 方位累计
    cellPositions: {},        // 数字 -> {row, col} 映射
    tickTimer: null,          // 计时器刷新句柄
    countdownInterval: null,  // 倒计时句柄
  };

  /* ===========================
     DOM 快捷方法
     =========================== */
  const $ = id => document.getElementById(id);

  /* ===========================
     页面切换
     =========================== */
  /**
   * 切换到指定页面
   * @param {string} name - 页面名称：home / train / result / history
   */
  function switchPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    $('page-' + name).classList.add('active');
    document.querySelectorAll('.nav-tabs button').forEach(b => {
      b.classList.toggle('active', b.dataset.target === name);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ===========================
     首页：尺寸选择 & 统计
     =========================== */

  /**
   * 基于历史记录推荐尺寸
   * 取最近 5 条，统计同一尺寸下的平均耗时与错误率
   * @returns {number} 推荐尺寸 4-7
   */
  function recommendSize() {
    const list = loadHistory();
    if (list.length === 0) return 5;
    const recent = list.slice(-5);
    const sizeCount = {};
    recent.forEach(r => { sizeCount[r.size] = (sizeCount[r.size] || 0) + 1; });
    let mostCommon = 5, maxC = 0;
    for (const k in sizeCount) {
      if (sizeCount[k] > maxC) { maxC = sizeCount[k]; mostCommon = +k; }
    }
    const sameSize = recent.filter(r => r.size === mostCommon).slice(-3);
    if (sameSize.length >= 2) {
      const avgTime = sameSize.reduce((a, b) => a + b.duration, 0) / sameSize.length;
      const baseline = sameSize[0].size * 1800; // 假设基准：size * 1.8 秒
      const avgWrong = sameSize.reduce((a, b) => a + (b.wrong || 0), 0) / sameSize.length;
      if (avgTime < baseline && avgWrong === 0 && mostCommon < 7) {
        return mostCommon + 1;
      }
      if (avgTime > baseline * 1.6 && mostCommon > 4) {
        return mostCommon - 1;
      }
    }
    return mostCommon;
  }

  /**
   * 渲染首页：尺寸按钮 + 统计卡片
   */
  function renderHome() {
    const sizes = [4, 5, 6, 7];
    const sel = $('sizeSelector');
    sel.innerHTML = '';
    const rec = recommendSize();
    sizes.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'size-btn' + (s === state.size ? ' active' : '');
      btn.dataset.size = s;
      let sub = s + '×' + s + ' 共 ' + (s*s) + ' 格';
      if (s === rec && loadHistory().length > 0) sub += ' · 推荐';
      btn.innerHTML = s + '×' + s + '<span class="sub">' + sub + '</span>';
      btn.addEventListener('click', () => {
        state.size = s;
        document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateSizeHint();
      });
      sel.appendChild(btn);
    });

    // 首页统计卡片
    const stats = $('homeStats');
    const list = loadHistory();
    const total = list.length;
    const bestBySize = {};
    list.forEach(r => {
      const cur = bestBySize[r.size];
      if (!cur || r.duration < cur.duration) bestBySize[r.size] = r;
    });
    const bestOverall = list.length ? Math.min(...list.map(r => r.duration)) : 0;

    stats.innerHTML = '';
    const cards = [
      { label: '累计训练', value: total, unit: '轮' },
      { label: '历史最佳', value: bestOverall ? (bestOverall / 1000).toFixed(2) : '--', unit: '秒' },
      { label: '本周训练', value: thisWeekCount(list), unit: '轮' },
      { label: '推荐尺寸', value: rec + '×' + rec, unit: '' },
    ];
    cards.forEach(c => {
      const d = document.createElement('div');
      d.className = 'stat-card';
      d.innerHTML = '<div class="label">' + c.label + '</div>' +
                    '<div class="value">' + c.value + '<small>' + c.unit + '</small></div>';
      stats.appendChild(d);
    });

    updateSizeHint();
  }

  /**
   * 计算本周训练轮次
   * @param {Array} list - 训练记录
   * @returns {number} 本周训练轮次
   */
  function thisWeekCount(list) {
    const now = new Date();
    const weekStart = new Date(now);
    weekStart.setHours(0, 0, 0, 0);
    weekStart.setDate(weekStart.getDate() - weekStart.getDay());
    const t = weekStart.getTime();
    return list.filter(r => r.date >= t).length;
  }

  /**
   * 更新尺寸提示文字
   */
  function updateSizeHint() {
    const total = state.size * state.size;
    $('sizeHint').textContent = '当前 ' + state.size + '×' + state.size + ' · ' + total + ' 个数字';
  }

  /* ===========================
     训练页：网格生成
     =========================== */

  /**
   * 构建网格：洗牌 + 生成 DOM + 初始化状态
   */
  function buildGrid() {
    const size = state.size;
    const total = size * size;
    const nums = shuffle(Array.from({ length: total }, (_, i) => i + 1));

    const grid = $('grid');
    grid.style.gridTemplateColumns = 'repeat(' + size + ', 1fr)';
    grid.style.fontSize = Math.max(14, Math.min(36, 440 / size)) + 'px';
    grid.innerHTML = '';

    // 重置状态
    state.cellPositions = {};
    state.total = total;
    state.expectedNext = 1;
    state.correctClicks = 0;
    state.wrongClicks = 0;
    state.combo = 0;
    state.maxCombo = 0;
    state.dirStats = new Array(8).fill(null).map(() => ({ count: 0, sum: 0 }));

    // 生成格子 DOM
    nums.forEach((num, idx) => {
      const row = Math.floor(idx / size);
      const col = idx % size;
      state.cellPositions[num] = { row, col };
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = num;
      cell.dataset.num = num;
      cell.addEventListener('click', onCellClick);
      cell.addEventListener('touchstart', onCellTouch, { passive: true });
      grid.appendChild(cell);
    });

    $('progress').textContent = '0 / ' + total;
    $('timer').innerHTML = '00:00.00<small>准备中</small>';
    $('comboBadge').textContent = 'COMBO × 0';
  }

  /**
   * 移动端触摸事件处理
   * iOS Safari 的 click 事件有 300ms 延迟，触摸事件更及时
   */
  function onCellTouch(e) {
    // 已经用 touch-action: manipulation 防止双击缩放，这里处理触摸事件
    const cell = e.currentTarget;
    if (!state.training) return;
    // 触摸事件与 click 事件都会触发，这里不重复处理
  }

  /**
   * 格子点击处理
   * @param {Event} e - 点击事件
   */
  function onCellClick(e) {
    if (!state.training) return;
    const cell = e.currentTarget;
    const num = +cell.dataset.num;
    const now = performance.now();

    if (num === state.expectedNext) {
      /* ---- 正确点击 ---- */
      const dt = now - state.lastClickTime;
      state.lastClickTime = now;
      cell.classList.add('correct');

      // 记录方位统计
      const pos = state.cellPositions[num];
      const dir = getDirection(pos.row, pos.col, state.size);
      state.dirStats[dir].count += 1;
      state.dirStats[dir].sum += dt;

      state.correctClicks += 1;
      state.expectedNext += 1;
      state.combo += 1;
      state.maxCombo = Math.max(state.maxCombo, state.combo);

      updateComboBadge(true);
      $('progress').textContent = state.correctClicks + ' / ' + state.total;

      // 全部完成
      if (state.correctClicks >= state.total) {
        finishTraining();
      }
    } else {
      /* ---- 错误点击 ---- */
      state.wrongClicks += 1;
      state.combo = 0;
      updateComboBadge(false);
      // 抖动动画反馈
      cell.classList.remove('wrong');
      void cell.offsetWidth; // 强制重排，重置动画
      cell.classList.add('wrong');
      setTimeout(() => cell.classList.remove('wrong'), 400);
    }
  }

  /**
   * 更新 COMBO 显示
   * @param {boolean} correct - 是否正确点击
   */
  function updateComboBadge(correct) {
    const b = $('comboBadge');
    b.textContent = 'COMBO × ' + state.combo;
    if (correct && state.combo >= 2) {
      b.classList.remove('pop');
      void b.offsetWidth;
      b.classList.add('pop');
      setTimeout(() => b.classList.remove('pop'), 150);
    }
  }

  /* ===========================
     倒计时 & 开始训练
     =========================== */

  /**
   * 开始 3 秒倒计时，然后开始训练
   * 倒计时引导用户聚焦中心点，培养正确训练习惯
   */
  function startCountdownAndGo() {
    switchPage('train');
    buildGrid();
    state.training = false;
    state.paused = false;

    const cd = $('countdown');
    let n = 3;
    cd.textContent = n;
    cd.classList.add('show');

    // 清除旧的倒计时
    if (state.countdownInterval) clearInterval(state.countdownInterval);

    state.countdownInterval = setInterval(() => {
      n -= 1;
      if (n > 0) {
        cd.textContent = n;
        // 重置动画
        cd.style.animation = 'none';
        void cd.offsetWidth;
        cd.style.animation = '';
      } else if (n === 0) {
        cd.textContent = '开始';
        cd.style.animation = 'none';
        void cd.offsetWidth;
        cd.style.animation = '';
      } else {
        clearInterval(state.countdownInterval);
        state.countdownInterval = null;
        cd.classList.remove('show');
        beginTraining();
      }
    }, 900);
  }

  /**
   * 正式开始训练：启动计时器
   */
  function beginTraining() {
    state.training = true;
    state.paused = false;
    state.startTime = performance.now();
    state.lastClickTime = state.startTime;
    $('timerLabel').textContent = '训练中';

    clearInterval(state.tickTimer);
    state.tickTimer = setInterval(() => {
      const elapsed = performance.now() - state.startTime;
      $('timer').innerHTML = formatTime(elapsed) + '<small>训练中</small>';
    }, 33); // ~30fps 更新
  }

  /**
   * 完成训练：停止计时、保存记录、渲染结果
   */
  function finishTraining() {
    if (!state.training) return;
    state.training = false;
    clearInterval(state.tickTimer);
    const elapsed = performance.now() - state.startTime;

    // 构建训练记录
    const rec = {
      date: Date.now(),
      size: state.size,
      duration: elapsed,
      correct: state.correctClicks,
      wrong: state.wrongClicks,
      total: state.total,
      maxCombo: state.maxCombo,
      dirStats: state.dirStats.map(d => ({ count: d.count, sum: d.sum })),
    };
    appendRecord(rec);

    // 渲染结果页
    renderResult(rec, elapsed);
    setTimeout(() => switchPage('result'), 500);
  }

  /* ===========================
     结果页：耗时、破纪录、雷达图、建议
     =========================== */

  /**
   * 渲染结果页
   * @param {Object} rec - 训练记录
   * @param {number} elapsed - 本轮耗时（毫秒）
   */
  function renderResult(rec, elapsed) {
    $('finalTime').innerHTML = (elapsed / 1000).toFixed(2) + '<small>秒</small>';
    const accuracy = rec.total === 0 ? 100 :
      Math.round((rec.correct / (rec.correct + rec.wrong)) * 100);
    $('finalSub').textContent = rec.size + '×' + rec.size + ' · 准确率 ' + accuracy + '% · 最高连击 ' + rec.maxCombo;

    // 破纪录判断
    const list = loadHistory();
    const sameSize = list.filter(r => r.size === rec.size && r.wrong === 0);
    const bestSameSize = sameSize.length ? Math.min(...sameSize.map(r => r.duration)) : Infinity;
    const isRecord = rec.wrong === 0 && rec.duration <= bestSameSize + 1;
    const wrap = $('recordBadgeWrap');
    wrap.innerHTML = '';
    if (isRecord && sameSize.length > 1) {
      const b = document.createElement('div');
      b.className = 'record-badge';
      b.textContent = '★ 新纪录';
      wrap.appendChild(b);
    }

    // 本轮详细指标
    const metrics = $('resultMetrics');
    metrics.innerHTML = '';
    const avgReaction = rec.correct > 0 ? (elapsed / rec.correct).toFixed(0) : 0;
    const items = [
      { k: '平均反应', v: avgReaction + ' ms' },
      { k: '正确 / 错误', v: rec.correct + ' / ' + rec.wrong },
      { k: '最高连击', v: '× ' + rec.maxCombo },
      { k: '网格尺寸', v: rec.size + '×' + rec.size },
    ];
    items.forEach(m => {
      const d = document.createElement('div');
      d.className = 'metric';
      d.innerHTML = '<div class="k">' + m.k + '</div><div class="v">' + m.v + '</div>';
      metrics.appendChild(d);
    });

    // 绘制雷达图
    drawRadar(rec);

    // 难度建议
    renderSuggest(rec, list);
  }

  /**
   * 渲染难度建议
   * @param {Object} rec - 本轮记录
   * @param {Array} list - 历史记录
   */
  function renderSuggest(rec, list) {
    const wrap = $('suggestCard');
    const accuracy = rec.correct / (rec.correct + rec.wrong);
    let suggestSize = rec.size;
    let reason = '';

    const baseline = rec.size * 1800; // ms 基准

    if (accuracy >= 0.98 && rec.duration < baseline && rec.size < 7) {
      suggestSize = rec.size + 1;
      reason = '表现出色，建议升级至 <strong>' + suggestSize + '×' + suggestSize + '</strong>';
    } else if (accuracy < 0.85 || rec.duration > baseline * 1.6) {
      if (rec.size > 4) {
        suggestSize = rec.size - 1;
        reason = '失误较多，建议降至 <strong>' + suggestSize + '×' + suggestSize + '</strong>';
      } else {
        suggestSize = rec.size;
        reason = '保持 <strong>' + suggestSize + '×' + suggestSize + '</strong>，专注减少错误';
      }
    } else {
      suggestSize = rec.size;
      reason = '表现稳定，继续 <strong>' + suggestSize + '×' + suggestSize + '</strong>';
    }

    // 盲区提示
    const dirAvgs = rec.dirStats.map(d => d.count > 0 ? d.sum / d.count : null);
    const validDirs = dirAvgs.map((v, i) => v !== null ? { idx: i, val: v } : null).filter(Boolean);
    let blindSpot = '';
    if (validDirs.length >= 4) {
      const sorted = validDirs.slice().sort((a, b) => b.val - a.val);
      const worst = sorted[0];
      const best = sorted[sorted.length - 1];
      if (worst.val > best.val * 1.5) {
        blindSpot = ' · <strong style="color:#fbbf24">' + DIRS[worst.idx] + '方</strong>较慢';
      }
    }

    wrap.innerHTML =
      '<div class="txt">' + reason + blindSpot + '</div>' +
      '<div><span style="color:var(--text-mute); font-size:12px;">下一轮：</span>' +
      '<strong style="color:var(--primary); font-family:var(--mono); font-size:16px; margin-left:6px;">' +
      suggestSize + '×' + suggestSize + '</strong></div>';

    state._suggestSize = suggestSize;
  }

  /* ===========================
     雷达图（Canvas 手绘）
     =========================== */

  /**
   * 绘制雷达图
   * 反应越快 -> 越靠近中心（线段短）
   * 反应越慢 -> 越向外（线段长）
   * 盲区（反应慢的方位）用琥珀色高亮
   * @param {Object} rec - 训练记录
   */
  function drawRadar(rec) {
    const canvas = $('radarCanvas');
    const dpr = window.devicePixelRatio || 1;
    const cssW = 420, cssH = 400;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;

    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const cx = cssW / 2, cy = cssH / 2;
    const radius = 140;
    const levels = 5;
    const n = 8;

    ctx.clearRect(0, 0, cssW, cssH);

    // 背景渐变
    const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 1.3);
    bgGrad.addColorStop(0, 'rgba(18, 26, 48, 0.8)');
    bgGrad.addColorStop(1, 'rgba(11, 16, 32, 0.95)');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, cssW, cssH);

    // 绘制同心多边形（5层）
    ctx.strokeStyle = 'rgba(138, 151, 184, 0.12)';
    ctx.lineWidth = 1;
    for (let lv = 1; lv <= levels; lv++) {
      const r = (radius * lv) / levels;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const angle = -Math.PI / 2 + i * (Math.PI * 2 / n);
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    }

    // 绘制 8 等分网格线（从中心出发）
    ctx.strokeStyle = 'rgba(138, 151, 184, 0.08)';
    for (let i = 0; i < n; i++) {
      const angle = -Math.PI / 2 + i * (Math.PI * 2 / n);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
      ctx.stroke();
    }

    // 计算每个方位的平均反应时间
    const dirAvgs = rec.dirStats.map(d => d.count > 0 ? d.sum / d.count : 0);
    const maxAvg = Math.max(...dirAvgs) || 1;

    // 绘制数据多边形
    const dataPts = [];
    for (let i = 0; i < n; i++) {
      const angle = -Math.PI / 2 + i * (Math.PI * 2 / n);
      const ratio = dirAvgs[i] / maxAvg;
      const r = radius * Math.max(0.15, ratio);
      dataPts.push({
        x: cx + Math.cos(angle) * r,
        y: cy + Math.sin(angle) * r,
        angle, ratio, dir: i, value: dirAvgs[i]
      });
    }

    // 渐变填充数据多边形
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    grad.addColorStop(0, 'rgba(34, 211, 238, 0.08)');
    grad.addColorStop(0.5, 'rgba(34, 211, 238, 0.15)');
    grad.addColorStop(1, 'rgba(34, 211, 238, 0.25)');
    
    ctx.beginPath();
    dataPts.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    });
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(34, 211, 238, 0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 数据点 + 方位标签 + 反应时间
    dataPts.forEach((p, i) => {
      // 判断是否为盲区（反应较慢）
      const isBlindSpot = p.value > (maxAvg * 0.7) && p.value > 0;
      
      // 数据点
      ctx.beginPath();
      ctx.arc(p.x, p.y, isBlindSpot ? 5 : 4, 0, Math.PI * 2);
      ctx.fillStyle = isBlindSpot ? '#fbbf24' : '#22d3ee';
      ctx.fill();
      if (isBlindSpot) {
        ctx.strokeStyle = 'rgba(251, 191, 36, 0.4)';
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      // 方位标签
      const lx = cx + Math.cos(p.angle) * (radius + 22);
      const ly = cy + Math.sin(p.angle) * (radius + 22);
      ctx.fillStyle = isBlindSpot ? '#fbbf24' : '#8a97b8';
      ctx.font = isBlindSpot ? '600 12px -apple-system, sans-serif' : '400 11px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(DIRS[i], lx, ly);

      // 反应时间
      if (p.value > 0) {
        ctx.fillStyle = isBlindSpot ? '#fbbf24' : '#566283';
        ctx.font = isBlindSpot ? '600 10px "JetBrains Mono", monospace' : '400 10px "JetBrains Mono", monospace';
        ctx.fillText(Math.round(p.value) + 'ms', lx, ly + 14);
      }
    });

    // 中心点
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    const centerGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 4);
    centerGrad.addColorStop(0, '#22d3ee');
    centerGrad.addColorStop(1, 'rgba(34, 211, 238, 0.6)');
    ctx.fillStyle = centerGrad;
    ctx.fill();

    // 底部说明
    ctx.fillStyle = '#566283';
    ctx.font = '10px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('BLIND SPOT RADAR · ' + rec.size + 'x' + rec.size, cx, cssH - 16);
  }

  /* ===========================
     历史页：成长曲线 & 列表
     =========================== */

  /**
   * 渲染历史页
   */
  function renderHistory() {
    const list = loadHistory();
    const hint = $('historyHint');
    const listEl = $('recordList');

    if (list.length === 0) {
      hint.textContent = '';
      listEl.innerHTML = '<div class="empty">暂无训练记录</div>';
      drawGrowthEmpty();
      return;
    }

    // 按尺寸分组的最佳
    const bestBySize = {};
    list.forEach(r => {
      const cur = bestBySize[r.size];
      if (!cur || r.duration < cur.duration) bestBySize[r.size] = r;
    });

    // 最近 12 条倒序展示
    const recent = list.slice().sort((a, b) => b.date - a.date).slice(0, 12);
    hint.textContent = '共 ' + list.length + ' 轮';
    listEl.innerHTML = '';
    recent.forEach((r, i) => {
      const d = new Date(r.date);
      const ds = pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
      const isBest = bestBySize[r.size] && bestBySize[r.size].date === r.date;
      const acc = Math.round((r.correct / (r.correct + r.wrong)) * 100);
      const item = document.createElement('div');
      item.className = 'record-item';
      item.innerHTML =
        '<div class="idx">' + (list.length - i) + '</div>' +
        '<div class="date">' + ds + '</div>' +
        '<div class="size">' + r.size + '×' + r.size + ' · ' + acc + '%</div>' +
        '<div class="time">' + (r.duration / 1000).toFixed(2) + 's' +
        (isBest ? ' <span style="color:#fbbf24;font-size:11px;">★</span>' : '') + '</div>';
      listEl.appendChild(item);
    });

    drawGrowth(list);
  }

  /**
   * 绘制空态成长曲线
   */
  function drawGrowthEmpty() {
    const canvas = $('growthCanvas');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.style.width = rect.width + 'px';
    canvas.style.height = '280px';
    canvas.width = rect.width * dpr;
    canvas.height = 280 * dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    // 背景
    const bgGrad = ctx.createLinearGradient(0, 0, 0, 280);
    bgGrad.addColorStop(0, 'rgba(18, 26, 48, 0.3)');
    bgGrad.addColorStop(1, 'rgba(11, 16, 32, 0.6)');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, rect.width, 280);
    
    ctx.fillStyle = '#566283';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无训练数据', rect.width / 2, 140);
  }

  /**
   * 绘制成长曲线图
   * @param {Array} list - 训练记录列表
   */
  function drawGrowth(list) {
    const canvas = $('growthCanvas');
    const rect = canvas.getBoundingClientRect();
    const cssW = Math.max(300, rect.width);
    const cssH = 280;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    const dpr = window.devicePixelRatio || 1;
    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;

    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);

    // 背景
    const bgGrad = ctx.createLinearGradient(0, 0, 0, cssH);
    bgGrad.addColorStop(0, 'rgba(18, 26, 48, 0.3)');
    bgGrad.addColorStop(1, 'rgba(11, 16, 32, 0.6)');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, cssW, cssH);

    const padL = 50, padR = 16, padT = 20, padB = 36;
    const plotW = cssW - padL - padR;
    const plotH = cssH - padT - padB;

    // 取最近 30 条数据
    const data = list.slice(-30);
    const durations = data.map(r => r.duration / 1000);
    let minV = Math.min(...durations);
    let maxV = Math.max(...durations);
    if (minV === maxV) { maxV = minV + 1; }
    const range = maxV - minV;
    minV = Math.max(0, minV - range * 0.1);
    maxV = maxV + range * 0.15;

    // y 轴网格线 + 标签
    ctx.strokeStyle = 'rgba(138, 151, 184, 0.15)';
    ctx.lineWidth = 1;
    ctx.fillStyle = '#566283';
    ctx.font = '11px "JetBrains Mono", monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let i = 0; i <= 4; i++) {
      const y = padT + (plotH * i) / 4;
      ctx.beginPath();
      ctx.setLineDash([4, 4]);
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + plotW, y);
      ctx.stroke();
      ctx.setLineDash([]);
      const v = maxV - (maxV - minV) * (i / 4);
      ctx.fillText(v.toFixed(1) + 's', padL - 8, y);
    }

    // 不同尺寸用不同颜色
    const sizeColors = { 
      4: { line: '#34d399', fill: 'rgba(52, 211, 153, 0.2)' },
      5: { line: '#22d3ee', fill: 'rgba(34, 211, 238, 0.2)' },
      6: { line: '#a78bfa', fill: 'rgba(167, 139, 250, 0.2)' },
      7: { line: '#fbbf24', fill: 'rgba(251, 191, 36, 0.2)' }
    };

    // 绘制折线 + 填充 + 点
    if (data.length >= 2) {
      const stepX = plotW / (data.length - 1);
      
      // 计算点坐标
      const points = data.map((r, i) => ({
        x: padL + stepX * i,
        y: padT + plotH * (1 - (r.duration / 1000 - minV) / (maxV - minV)),
        size: r.size
      }));

      // 绘制渐变填充区域
      const fillGrad = ctx.createLinearGradient(0, padT, 0, padT + plotH);
      fillGrad.addColorStop(0, 'rgba(34, 211, 238, 0.15)');
      fillGrad.addColorStop(1, 'rgba(34, 211, 238, 0.02)');
      
      ctx.beginPath();
      ctx.moveTo(points[0].x, padT + plotH); // 底部起点
      points.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.lineTo(points[points.length - 1].x, padT + plotH); // 底部终点
      ctx.closePath();
      ctx.fillStyle = fillGrad;
      ctx.fill();

      // 绘制折线
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.6)';
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();
      points.forEach((p, i) => {
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      });
      ctx.stroke();

      // 绘制数据点
      points.forEach((p, i) => {
        const colors = sizeColors[p.size] || sizeColors[5];
        
        // 外圈光晕
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = colors.fill;
        ctx.fill();
        
        // 内圈
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = colors.line;
        ctx.fill();
        
        // 高光
        ctx.beginPath();
        ctx.arc(p.x - 1, p.y - 1, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.fill();
      });

      // x 轴标签
      ctx.fillStyle = '#566283';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.font = '11px "JetBrains Mono", monospace';
      const labelIdxs = data.length <= 8
        ? data.map((_, i) => i)
        : [0, Math.floor(data.length / 4), Math.floor(data.length / 2), Math.floor(data.length * 3 / 4), data.length - 1];
      labelIdxs.forEach(i => {
        const x = padL + stepX * i;
        const d = new Date(data[i].date);
        ctx.fillText((d.getMonth() + 1) + '/' + d.getDate(), x, cssH - padB + 10);
      });
    }

    // 图例
    const legendX = padL;
    const legendY = 8;
    const legendItems = Object.entries(sizeColors);
    ctx.font = '10px -apple-system, sans-serif';
    legendItems.forEach(([size, colors], i) => {
      const x = legendX + i * 52;
      ctx.beginPath();
      ctx.arc(x, legendY, 3, 0, Math.PI * 2);
      ctx.fillStyle = colors.line;
      ctx.fill();
      ctx.fillStyle = '#8a97b8';
      ctx.textAlign = 'left';
      ctx.fillText(size + '×' + size, x + 6, legendY + 3);
    });
  }

  /* ===========================
     事件绑定
     =========================== */

  /**
   * 绑定所有事件
   */
  function bindEvents() {
    // 导航切换
    document.querySelectorAll('.nav-tabs button').forEach(b => {
      b.addEventListener('click', () => {
        const target = b.dataset.target;
        // 训练中切换到其他页面时暂停
        if (state.training && target !== 'train') {
          state.paused = true;
          clearInterval(state.tickTimer);
        }
        if (target === 'home') {
          renderHome();
          switchPage('home');
        } else if (target === 'history') {
          renderHistory();
          switchPage('history');
        }
      });
    });

    // 开始按钮
    $('btnStart').addEventListener('click', () => startCountdownAndGo());

    // 放弃本轮
    $('btnQuit').addEventListener('click', () => {
      if (confirm('结束本轮？成绩不会被记录。')) {
        clearInterval(state.tickTimer);
        clearInterval(state.countdownInterval);
        state.training = false;
        state.paused = false;
        renderHome();
        switchPage('home');
      }
    });

    // 下一轮 / 返回
    $('btnNext').addEventListener('click', () => {
      state.size = state._suggestSize || state.size;
      startCountdownAndGo();
    });
    $('btnBackHome').addEventListener('click', () => {
      renderHome();
      switchPage('home');
    });

    // 导出雷达图
    $('btnExportRadar').addEventListener('click', () => {
      const canvas = $('radarCanvas');
      try {
        const url = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = url;
        a.download = '盲区雷达图_' + new Date().toISOString().slice(0, 10) + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('已导出');
      } catch (e) {
        showToast('导出失败');
      }
    });

    // 清空历史
    $('btnClearHistory').addEventListener('click', () => {
      if (confirm('确定清空所有记录？')) {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        renderHistory();
        showToast('已清空');
      }
    });

    // 窗口尺寸变化时重绘
    window.addEventListener('resize', () => {
      if ($('page-history').classList.contains('active')) renderHistory();
    });

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
      // ESC 退出训练
      if (e.key === 'Escape' && state.training) {
        if (confirm('结束本轮？')) {
          clearInterval(state.tickTimer);
          clearInterval(state.countdownInterval);
          state.training = false;
          state.paused = false;
          renderHome();
          switchPage('home');
        }
      }
    });
  }

  /* ===========================
     初始化
     =========================== */

  function init() {
    state.size = recommendSize();
    renderHome();
    bindEvents();
  }

  // 等待 DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // 暴露调试 API
  window.__bsh = { loadHistory, recommendSize };
})();
</script>
