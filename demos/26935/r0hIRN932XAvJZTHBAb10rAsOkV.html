<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>偏见照镜子：10个决定暴露你的认知盲区</title>
<style>
  :root {
    --bg: #0b0f19;
    --card: rgba(255,255,255,0.06);
    --accent: #60a5fa;
    --accent2: #c084fc;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --danger: #f87171;
    --warn: #fbbf24;
    --success: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 800px at 20% -10%, #1e293b 0%, var(--bg) 60%),
                radial-gradient(900px 600px at 110% 90%, #312e81 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  .app {
    width: 92vw;
    max-width: 720px;
    min-height: 560px;
    position: relative;
  }

  .glass {
    background: var(--card);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
    padding: 40px 36px;
    transition: opacity .4s ease, transform .4s ease;
  }

  /* Intro */
  .intro { text-align: center; }
  .intro h1 {
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 12px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .intro p { color: var(--muted); font-size: 16px; line-height: 1.7; margin-bottom: 28px; }
  .btn {
    display: inline-block;
    padding: 14px 36px;
    border-radius: 999px;
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 8px 24px rgba(96,165,250,0.35);
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(96,165,250,0.45); }
  .btn:active { transform: translateY(0); }
  .btn.secondary {
    background: rgba(255,255,255,0.08);
    box-shadow: none;
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .btn.secondary:hover { background: rgba(255,255,255,0.14); }

  /* Progress */
  .progress-wrap { margin-bottom: 22px; }
  .progress-top { display:flex; justify-content:space-between; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .progress-track { height: 6px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow:hidden; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 999px; transition: width .4s cubic-bezier(.4,0,.2,1); }

  /* Question */
  .question-num { color: var(--accent); font-weight: 800; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
  .question-title { font-size: clamp(18px, 3.2vw, 24px); font-weight: 700; line-height: 1.45; margin-bottom: 24px; }
  .options { display: grid; gap: 12px; }
  .option {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 18px 20px;
    cursor: pointer;
    display: flex; align-items: flex-start; gap: 12px;
    transition: all .18s ease;
    position: relative; overflow: hidden;
  }
  .option:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.18); transform: translateY(-1px); }
  .option:active { transform: translateY(0); }
  .option-letter {
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 800; font-size: 12px;
    background: rgba(255,255,255,0.08);
    color: var(--muted); flex-shrink: 0;
  }
  .option-text { font-size: 15px; line-height: 1.6; color: #cbd5e1; padding-top: 2px; }
  .option.selected .option-letter { background: var(--accent); color: #fff; }
  .option.selected { border-color: var(--accent); background: rgba(96,165,250,0.08); }

  /* Mirror result */
  .result { text-align: center; }
  .mirror-frame {
    position: relative;
    margin: 0 auto 28px;
    width: min(72vw, 320px); height: min(72vw, 320px);
    border-radius: 50%;
    padding: 6px;
    background: conic-gradient(from 0deg, #e2e8f0, #94a3b8, #cbd5e1, #f1f5f9, #94a3b8, #e2e8f0);
    box-shadow: 0 0 60px rgba(148,163,184,0.15), inset 0 0 20px rgba(0,0,0,0.6);
    animation: mirrorSpin 8s linear infinite;
  }
  .mirror-frame::before {
    content: ''; position: absolute; inset: 6px; border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.02) 60%);
    z-index: 2; pointer-events: none;
  }
  .mirror-inner {
    width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), rgba(0,0,0,0.6) 70%);
    overflow: hidden; position: relative;
    display: grid; place-items: center;
  }
  .sheen {
    position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.18) 48%, rgba(255,255,255,0.05) 52%, transparent 60%);
    animation: sheenMove 4s ease-in-out infinite alternate;
    pointer-events: none; z-index: 3;
  }
  @keyframes mirrorSpin { to { filter: hue-rotate(0deg); } } /* placeholder for conic shimmer if needed */
  @keyframes sheenMove { from { transform: translateX(-12%) rotate(-10deg); } to { transform: translateX(12%) rotate(10deg); } }

  .result h2 { font-size: clamp(22px, 4vw, 30px); font-weight: 800; margin-bottom: 10px; }
  .result .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 15px; }

  .radar-wrap { position: relative; width: 100%; max-width: 480px; margin: 0 auto 28px; }
  canvas { width: 100%; height: auto; }

  .bias-list { text-align: left; display: grid; gap: 14px; max-width: 560px; margin: 0 auto 24px; }
  .bias-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 18px 20px;
    opacity: 0; transform: translateY(12px);
    animation: fadeUp .6s ease forwards;
  }
  .bias-card:nth-child(1) { animation-delay: .3s; }
  .bias-card:nth-child(2) { animation-delay: .5s; }
  .bias-card:nth-child(3) { animation-delay: .7s; }
  .bias-card h4 { font-size: 16px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .bias-card p { color: var(--muted); font-size: 14px; line-height: 1.65; }
  .badge { font-size: 11px; padding: 4px 10px; border-radius: 999px; font-weight: 700; letter-spacing: .02em; }
  .badge.high { background: rgba(248,113,113,0.15); color: var(--danger); border: 1px solid rgba(248,113,113,0.25); }
  .badge.medium { background: rgba(251,191,36,0.15); color: var(--warn); border: 1px solid rgba(251,191,36,0.25); }
  .badge.low { background: rgba(52,211,153,0.12); color: var(--success); border: 1px solid rgba(52,211,153,0.25); }

  .insight {
    background: linear-gradient(90deg, rgba(96,165,250,0.08), rgba(192,132,252,0.08));
    border-left: 3px solid var(--accent);
    border-radius: 12px;
    padding: 16px 20px;
    text-align: left;
    color: #cbd5e1;
    font-size: 15px;
    line-height: 1.7;
    max-width: 560px;
    margin: 0 auto 24px;
  }

  .hidden { opacity: 0; pointer-events: none; position: absolute; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px) scale(.995); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .animate-in { animation: fadeIn .45s ease both; }

  .reflection {
    margin-top: 8px;
    font-style: italic;
    color: #94a3b8;
    font-size: 14px;
  }

  @media (max-width: 560px) {
    .glass { padding: 24px 18px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Intro -->
  <div id="intro" class="glass intro animate-in">
    <h1>偏见照镜子</h1>
    <p>
      10个看似普通的日常决策，正悄悄暴露你的认知盲区。<br>
      这不是测试“对错”，而是一面镜子——让你自己“看见”自己。<br>
      准备好了吗？
    </p>
    <button class="btn" onclick="startQuiz()">开始照镜子</button>
  </div>

  <!-- Quiz -->
  <div id="quiz" class="glass hidden">
    <div class="progress-wrap">
      <div class="progress-top"><span id="progLabel">问题 1 / 10</span><span id="progPct">0%</span></div>
      <div class="progress-track"><div id="progBar" class="progress-fill"></div></div>
    </div>
    <div id="qAnim">
      <div class="question-num" id="qNum">问题 01</div>
      <div class="question-title" id="qTitle">加载中…</div>
      <div class="options" id="qOptions"></div>
    </div>
  </div>

  <!-- Result -->
  <div id="result" class="glass result hidden">
    <div class="mirror-frame">
      <div class="mirror-inner">
        <canvas id="radar" width="640" height="640"></canvas>
        <div class="sheen"></div>
      </div>
    </div>

    <h2>你的认知偏见图谱</h2>
    <div class="subtitle" id="resultSubtitle">以下是你决策模式中潜藏的“自动导航”</div>

    <div class="radar-wrap" style="display:none"><canvas id="radar2"></canvas></div>

    <div class="bias-list" id="biasList"></div>

    <div class="insight" id="insightBox"></div>

    <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
      <button class="btn secondary" onclick="restartQuiz()">再照一次</button>
      <button class="btn" onclick="shareResult()">保存结果图</button>
    </div>
    <p class="reflection">“觉察，是改变的开始。”</p>
  </div>
</div>

<script>
const biases = [
  { key:'anchoring', name:'锚定效应', desc:'你容易被接触到的第一个数字或信息“锚定”，即使它毫不相干。' },
  { key:'confirmation', name:'确认偏误', desc:'你倾向于寻找、相信那些支持自己已有观点的信息。' },
  { key:'availability', name:'可得性启发', desc:'你容易被最近看到、听到或记忆深刻的事情影响判断。' },
  { key:'loss', name:'损失厌恶', desc:'面对同等收益和损失时，损失带来的痛苦远大于收益带来的快乐。' },
  { key:'sunk', name:'沉没成本谬误', desc:'你会因为已经投入的时间、金钱或感情，而难以理性止损。' },
  { key:'bandwagon', name:'从众效应', desc:'在群体行为和舆论面前，你的独立判断容易被稀释。' },
  { key:'framing', name:'框架效应', desc:'同样的信息，只因表述方式不同，就会改变你的决定。' },
  { key:'survivorship', name:'幸存者偏差', desc:'你只看到了成功留下来的样本，却忽略了无数失败的沉默数据。' },
  { key:'representativeness', name:'代表性启发', desc:'你容易被刻板印象和“像不像”误导，忽视基础概率。' },
  { key:'hindsight', name:'后见之明偏误', desc:'事情发生后，你总觉得它“本来就很明显”，高估自己当初的预测能力。' },
];

const questions = [
  {
    bias: 'anchoring',
    title: '你在看二手房。中介先带你看了一套标价800万的房子（户型一般）；随后带你看同小区同户型标价650万的房子。你的第一直觉是？',
    options: [
      { text: '650万真划算，一下子便宜了150万！', score: 8 },
      { text: '650万是不是有什么隐藏问题？', score: 3 },
      { text: '我需要更多同小区的成交数据来判断。', score: 0 },
    ]
  },
  {
    bias: 'confirmation',
    title: '你持有某科技公司的股票。某天看到一篇深度报告，质疑这家公司盈利模式不可持续。你会？',
    options: [
      { text: '立刻去搜更多看空报告来验证它的确有问题。', score: 8 },
      { text: '先去搜反驳这篇报告的证据。', score: 3 },
      { text: '搁置情绪，重新独立审视自己的投资逻辑。', score: 0 },
    ]
  },
  {
    bias: 'availability',
    title: '最近新闻连续报道了3起飞机失事事故。下周你要出差，面临“坐1小时飞机 vs 坐5小时高铁”。你的直觉是？',
    options: [
      { text: '坐飞机太危险了，宁可多花4小时坐高铁。', score: 8 },
      { text: '有点担心，但查一下近期的实际安全数据再决定。', score: 3 },
      { text: '飞机仍然是最安全的交通工具之一，按需选择。', score: 0 },
    ]
  },
  {
    bias: 'loss',
    title: '半年前你买的股票跌了25%，市场整体平稳。这笔钱你短期内不需要急用。你现在？',
    options: [
      { text: '坚决不卖，只要没卖就不是真亏，一定要等它回本。', score: 8 },
      { text: '再跌5%就割肉，给自己设个止损线。', score: 4 },
      { text: '重新评估公司当前价值，与我的买入价无关地做决定。', score: 0 },
    ]
  },
  {
    bias: 'sunk',
    title: '你花了800元买了一张热门演唱会门票。演出当天你突然感冒发烧，身体很不舒服。你会？',
    options: [
      { text: '还是去吧，不然这800块就白白浪费了。', score: 8 },
      { text: '低价转卖掉，能回一点是一点。', score: 4 },
      { text: '800块已经“沉没”了，不该影响我现在对身体状况的判断。', score: 0 },
    ]
  },
  {
    bias: 'bandwagon',
    title: '你注意到身边几乎所有朋友、同事最近都在买某只热门基金，聊天群里也在讨论。你还没研究过它。你会？',
    options: [
      { text: '赶紧跟投一点，不然好像落伍了。', score: 8 },
      { text: '先观察一下，等确定了再加入。', score: 3 },
      { text: '别人买与我无关，我只按自己的策略执行。', score: 0 },
    ]
  },
  {
    bias: 'framing',
    title: '某款零食，A包装写“90%不含脂肪”，B包装写“含10%脂肪”。成分完全相同。你更想买哪个？',
    options: [
      { text: 'A包装，听起来更健康。', score: 8 },
      { text: 'B包装，至少它更坦诚。', score: 3 },
      { text: '看具体成分表，不在意这种措辞游戏。', score: 0 },
    ]
  },
  {
    bias: 'survivorship',
    title: '你经常在媒体上看到“辍学创业成功”的故事，比如某某富豪从车库起家。由此你认为？',
    options: [
      { text: '学历和文凭对成功没那么重要，实战经验更关键。', score: 8 },
      { text: '可能有一些成功案例，但不具备普遍性。', score: 3 },
      { text: '那些被忽视的“沉默失败者”数量巨大，不能简单推断。', score: 0 },
    ]
  },
  {
    bias: 'representativeness',
    title: '你认识一个人：性格内向、做事细致、喜欢阅读和安静，不太擅长社交。他更可能是？',
    options: [
      { text: '图书管理员——这太符合职业形象了。', score: 8 },
      { text: '销售员——虽然反差大，但销售员基数要大得多。', score: 0 },
      { text: '仅凭这些特质无法判断，需要更多信息。', score: 2 },
    ]
  },
  {
    bias: 'hindsight',
    title: '回顾去年某次突如其来的股市大跌，你现在的感受是？',
    options: [
      { text: '其实早有征兆，我当时就觉得不对劲。', score: 8 },
      { text: '事后看确实明显，但当时其实很模糊。', score: 3 },
      { text: '当时真的很难预测，是事后解释让它看起来“必然”。', score: 0 },
    ]
  },
];

let current = 0;
const scores = {};
biases.forEach(b => scores[b.key] = 0);

function startQuiz() {
  document.getElementById('intro').classList.add('hidden');
  const q = document.getElementById('quiz');
  q.classList.remove('hidden');
  q.classList.add('animate-in');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  const anim = document.getElementById('qAnim');
  anim.style.opacity = '0';
  anim.style.transform = 'translateY(8px)';
  anim.style.transition = 'none';

  setTimeout(() => {
    document.getElementById('qNum').textContent = '问题 ' + String(current+1).padStart(2,'0');
    document.getElementById('qTitle').textContent = q.title;
    const opts = document.getElementById('qOptions');
    opts.innerHTML = '';
    q.options.forEach((opt, idx) => {
      const el = document.createElement('div');
      el.className = 'option';
      el.innerHTML = `<div class="option-letter">${String.fromCharCode(65+idx)}</div><div class="option-text">${opt.text}</div>`;
      el.onclick = () => choose(idx);
      opts.appendChild(el);
    });
    updateProgress();
    anim.style.transition = 'opacity .35s ease, transform .35s ease';
    anim.style.opacity = '1';
    anim.style.transform = 'translateY(0)';
  }, 50);
}

function updateProgress() {
  const pct = Math.round((current) / questions.length * 100);
  document.getElementById('progLabel').textContent = `问题 ${current+1} / ${questions.length}`;
  document.getElementById('progPct').textContent = pct + '%';
  document.getElementById('progBar').style.width = pct + '%';
}

function choose(idx) {
  const q = questions[current];
  scores[q.bias] += q.options[idx].score;
  // visual selected
  const opts = document.querySelectorAll('.option');
  opts.forEach((el, i) => {
    el.classList.toggle('selected', i === idx);
  });
  setTimeout(() => {
    current++;
    if (current < questions.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }, 280);
}

function showResult() {
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('progBar').style.width = '100%';
  const r = document.getElementById('result');
  r.classList.remove('hidden');
  r.classList.add('animate-in');

  // compute normalized 0-100
  const norm = biases.map(b => {
    const raw = scores[b.key]; // max 8
    return Math.min(100, Math.round((raw / 8) * 100));
  });

  // draw radar
  drawRadar('radar', norm);

  // top biases
  const ranked = biases.map((b, i) => ({ ...b, score: norm[i] })).sort((a,b) => b.score - a.score);
  const list = document.getElementById('biasList');
  list.innerHTML = '';
  const top3 = ranked.slice(0,3);
  top3.forEach((b, i) => {
    let badgeClass = 'low', badgeText = '轻度';
    if (b.score >= 70) { badgeClass = 'high'; badgeText = '显著'; }
    else if (b.score >= 35) { badgeClass = 'medium'; badgeText = '中度'; }
    const card = document.createElement('div');
    card.className = 'bias-card';
    card.innerHTML = `
      <h4><span>${i+1}. ${b.name}</span><span class="badge ${badgeClass}">${badgeText}</span></h4>
      <p>${b.desc}</p>
    `;
    list.appendChild(card);
  });

  // insight
  const total = norm.reduce((a,b)=>a+b,0);
  const avg = total / norm.length;
  let insight = '';
  if (avg <= 20) {
    insight = '你的决策模式相对理性，认知偏见的“噪音”较低。不过，偏见是人类的默认设置，保持这种觉察本身就是一种优势。';
  } else if (avg <= 45) {
    insight = '你在部分场景中会受到直觉和情绪的影响，这很正常。关键在于：当你做重大决定时，能否刻意切换到“慢思考”模式。';
  } else {
    insight = '你的决策高度依赖直觉与情绪启发，这在快节奏生活中很高效，但也容易在重要节点上产生系统性偏差。试着在关键决策前引入“逆向思考”或“外部视角”。';
  }
  document.getElementById('insightBox').textContent = insight;
}

function restartQuiz() {
  current = 0;
  biases.forEach(b => scores[b.key] = 0);
  document.getElementById('result').classList.add('hidden');
  const intro = document.getElementById('intro');
  intro.classList.remove('hidden');
  intro.classList.add('animate-in');
}

// Canvas radar chart
function drawRadar(canvasId, data) {
  const canvas = document.getElementById(canvasId);
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = 640 * dpr;
  canvas.height = 640 * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const W = 640, H = 640;
  const cx = W/2, cy = H/2;
  const radius = 220;
  const N = biases.length;
  const angleStep = (Math.PI * 2) / N;
  const labels = biases.map(b => b.name);

  // grid
  ctx.strokeStyle = 'rgba(148,163,184,0.15)';
  ctx.lineWidth = 1;
  for (let level = 1; level <= 5; level++) {
    const r = (radius / 5) * level;
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const a = i * angleStep - Math.PI/2;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
  }
  // axes
  for (let i = 0; i < N; i++) {
    const a = i * angleStep - Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
    ctx.stroke();
  }

  // data area (animated)
  let progress = 0;
  function drawFrame() {
    progress += 0.03;
    if (progress > 1) progress = 1;

    // clear only data area? easier to clear all and redraw static
    ctx.clearRect(0,0,W,H);

    // redraw grid
    ctx.strokeStyle = 'rgba(148,163,184,0.15)';
    ctx.lineWidth = 1;
    for (let level = 1; level <= 5; level++) {
      const r = (radius / 5) * level;
      ctx.beginPath();
      for (let i = 0; i < N; i++) {
        const a = i * angleStep - Math.PI/2;
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    }
    for (let i = 0; i < N; i++) {
      const a = i * angleStep - Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
      ctx.stroke();
    }

    // labels
    ctx.fillStyle = '#94a3b8';
    ctx.font = '600 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < N; i++) {
      const a = i * angleStep - Math.PI/2;
      const labelR = radius + 28;
      const x = cx + Math.cos(a) * labelR;
      const y = cy + Math.sin(a) * labelR;
      ctx.fillText(labels[i], x, y);
    }

    // data
    const pts = data.map((v, i) => {
      const a = i * angleStep - Math.PI/2;
      const r = (v / 100) * radius * easeOutQuart(progress);
      return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r };
    });

    // fill
    ctx.beginPath();
    pts.forEach((p, i) => { if (i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
    ctx.closePath();
    const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,radius);
    grad.addColorStop(0, 'rgba(96,165,250,0.25)');
    grad.addColorStop(1, 'rgba(192,132,252,0.12)');
    ctx.fillStyle = grad;
    ctx.fill();

    // stroke
    ctx.strokeStyle = 'rgba(148,163,184,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    pts.forEach((p, i) => { if (i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
    ctx.closePath();
    ctx.stroke();

    // dots
    pts.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
      ctx.fillStyle = '#e2e8f0';
      ctx.fill();
    });

    if (progress < 1) requestAnimationFrame(drawFrame);
  }
  drawFrame();
}

function easeOutQuart(x) { return 1 - Math.pow(1 - x, 4); }
