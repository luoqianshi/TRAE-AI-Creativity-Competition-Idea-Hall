<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>AI代码安全审计员 - IDE插件演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #1e1e1e; color: #d4d4d4; overflow: hidden; }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* Top Bar */
  .topbar {
    height: 44px;
    background: #2d2d30;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid #252526;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .brand-logo {
    width: 24px; height: 24px; border-radius: 6px;
    background: linear-gradient(135deg, #007acc, #00d4ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #fff; font-weight: 700;
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
  }
  .brand-title { font-size: 14px; color: #e0e0e0; }
  .brand-sub { font-size: 12px; color: #858585; margin-left: 8px; padding-left: 8px; border-left: 1px solid #3c3c3c; }

  .actions { display: flex; gap: 8px; }
  .btn {
    background: #0e639c;
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { background: #1177bb; }
  .btn.secondary { background: #3c3c3c; }
  .btn.secondary:hover { background: #4a4a4a; }

  /* Main Layout */
  .main { flex: 1; display: flex; overflow: hidden; }

  /* Activity Bar */
  .activity-bar {
    width: 48px;
    background: #333333;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 12px;
    gap: 20px;
    border-right: 1px solid #252526;
  }
  .activity-icon {
    width: 24px; height: 24px; color: #858585;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px;
  }
  .activity-icon.active { color: #fff; border-left: 2px solid #007acc; padding-left: 2px; }

  /* Sidebar (File Explorer) */
  .sidebar {
    width: 220px;
    background: #252526;
    border-right: 1px solid #1e1e1e;
    font-size: 13px;
    overflow-y: auto;
  }
  .sidebar-header { padding: 12px 16px; font-weight: 600; color: #cccccc; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
  .file-tree { padding: 0 8px 16px; }
  .folder { margin-bottom: 4px; }
  .folder-label { display: flex; align-items: center; padding: 4px 8px; cursor: pointer; color: #cccccc; }
  .folder-label::before { content: "▾"; margin-right: 6px; font-size: 10px; color: #858585; }
  .file { display: flex; align-items: center; padding: 4px 8px 4px 24px; cursor: pointer; color: #969696; border-radius: 3px; }
  .file.active { background: #37373d; color: #fff; }
  .file:hover { background: #2a2d2e; }
  .file .icon { margin-right: 6px; font-size: 12px; }

  /* Editor + Audit Panel Container */
  .workspace { flex: 1; display: flex; overflow: hidden; }

  /* Editor */
  .editor { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #1e1e1e; }
  .tabs {
    height: 35px;
    background: #252526;
    display: flex;
    align-items: flex-end;
    border-bottom: 1px solid #1e1e1e;
  }
  .tab {
    padding: 0 14px;
    height: 35px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: #2d2d30;
    border-right: 1px solid #252526;
    font-size: 13px;
    color: #969696;
    cursor: pointer;
    border-top: 1px solid transparent;
  }
  .tab.active { background: #1e1e1e; color: #fff; border-top-color: #007acc; }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: #e74c3c; }

  .editor-area { flex: 1; display: flex; overflow: auto; position: relative; }
  .gutter {
    padding: 12px 10px 12px 12px;
    color: #4a4a4a;
    font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
    font-size: 13px;
    line-height: 20px;
    text-align: right;
    user-select: none;
    min-width: 45px;
    background: #1e1e1e;
    border-right: 1px solid #252526;
  }
  .gutter div { height: 20px; }

  .code {
    flex: 1;
    padding: 12px 16px;
    font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
    font-size: 13px;
    line-height: 20px;
    white-space: pre;
    position: relative;
    background: #1e1e1e;
  }
  .code-line { position: relative; height: 20px; }
  .code-line .warning {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 3px;
    background: repeating-linear-gradient(90deg, #e74c3c 0, #e74c3c 4px, transparent 4px, transparent 7px);
    cursor: pointer;
    transition: all 0.2s;
  }
  .code-line .warning:hover { background: repeating-linear-gradient(90deg, #ff6b5b 0, #ff6b5b 4px, transparent 4px, transparent 7px); height: 5px; }
  .code-line.error-line { background: rgba(231, 76, 60, 0.08); }

  /* Syntax highlighting */
  .kw { color: #569cd6; }
  .fn { color: #dcdcaa; }
  .str { color: #ce9178; }
  .num { color: #b5cea8; }
  .cm { color: #6a9955; font-style: italic; }
  .var { color: #9cdcfe; }
  .cls { color: #4ec9b0; }
  .op { color: #d4d4d4; }
  .punct { color: #808080; }
  .prop { color: #9cdcfe; }

  /* Audit inline indicator */
  .audit-indicator {
    position: absolute;
    right: -8px;
    top: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #e74c3c;
    color: #fff;
    font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 5;
    box-shadow: 0 0 8px rgba(231, 76, 60, 0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 8px rgba(231, 76, 60, 0.6); }
    50% { box-shadow: 0 0 16px rgba(231, 76, 60, 0.9); }
  }

  /* Status Bar */
  .status-bar {
    height: 24px;
    background: #007acc;
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-size: 12px;
    color: #fff;
    gap: 20px;
  }
  .status-item { display: flex; align-items: center; gap: 5px; }
  .status-item.danger { margin-left: auto; }

  /* Audit Panel */
  .audit-panel {
    width: 380px;
    background: #252526;
    border-left: 1px solid #1e1e1e;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .audit-header {
    padding: 14px 16px;
    background: #2d2d30;
    border-bottom: 1px solid #1e1e1e;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .audit-title {
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .audit-badge {
    background: #e74c3c;
    color: #fff;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  .audit-badge.info { background: #3498db; }
  .audit-badge.safe { background: #27ae60; }

  .audit-body { flex: 1; overflow-y: auto; padding: 16px; }

  .issue-list { display: flex; flex-direction: column; gap: 10px; }
  .issue-card {
    background: #2d2d30;
    border: 1px solid #3c3c3c;
    border-left: 3px solid #e74c3c;
    border-radius: 4px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .issue-card:hover { border-color: #e74c3c; background: #323233; transform: translateX(-2px); }
  .issue-card.active { border-color: #e74c3c; background: #37373d; }
  .issue-severity {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    color: #fff;
    margin-bottom: 6px;
  }
  .severity.high { background: #e74c3c; }
  .severity.medium { background: #f39c12; }
  .severity.low { background: #3498db; }
  .issue-title { font-size: 13px; color: #fff; font-weight: 600; margin-bottom: 4px; }
  .issue-location { font-size: 11px; color: #858585; }

  .issue-detail {
    background: #1e1e1e;
    border-radius: 4px;
    padding: 14px;
    margin-top: 12px;
    display: none;
  }
  .issue-detail.visible { display: block; }

  .detail-section { margin-bottom: 16px; }
  .detail-section:last-child { margin-bottom: 0; }
  .detail-label {
    font-size: 11px;
    color: #007acc;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .detail-content {
    font-size: 13px;
    color: #d4d4d4;
    line-height: 1.6;
  }
  .detail-content p { margin-bottom: 8px; }

  .principle-diagram {
    background: #2d2d30;
    border: 1px solid #3c3c3c;
    border-radius: 6px;
    padding: 14px;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 12px;
    line-height: 1.8;
  }
  .diagram-flow { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
  .diagram-node {
    background: #3c3c3c;
    padding: 6px 10px;
    border-radius: 4px;
    color: #d4d4d4;
    font-size: 11px;
    text-align: center;
    flex: 1;
    min-width: 70px;
  }
  .diagram-node.danger { background: #e74c3c; color: #fff; }
  .diagram-node.safe { background: #27ae60; color: #fff; }
  .diagram-arrow { color: #858585; font-size: 14px; }

  .code-block {
    background: #1e1e1e;
    border: 1px solid #3c3c3c;
    border-radius: 4px;
    padding: 10px 12px;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 12px;
    line-height: 1.6;
    margin: 8px 0;
    overflow-x: auto;
  }
  .code-block.dangerous { border-left: 3px solid #e74c3c; }
  .code-block.fixed { border-left: 3px solid #27ae60; }

  .apply-btn {
    width: 100%;
    background: linear-gradient(135deg, #007acc, #00d4ff);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    margin-top: 8px;
  }
  .apply-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0, 122, 204, 0.4); }
  .apply-btn:disabled { background: #3c3c3c; cursor: not-allowed; transform: none; box-shadow: none; }
  .apply-btn .icon { font-size: 16px; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    color: #858585;
  }
  .empty-state .emoji { font-size: 40px; margin-bottom: 12px; }
  .empty-state .text { font-size: 13px; }

  .toast {
    position: fixed;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #27ae60;
    color: #fff;
    padding: 12px 24px;
    border-radius: 6px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    transition: transform 0.3s;
    z-index: 100;
    font-size: 13px;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .scan-overlay {
    position: absolute;
    inset: 0;
    background: rgba(30, 30, 30, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 50;
  }
  .scan-overlay.active { display: flex; }
  .scan-spinner {
    width: 50px; height: 50px;
    border: 3px solid #3c3c3c;
    border-top-color: #007acc;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .scan-text { margin-top: 16px; color: #d4d4d4; font-size: 13px; }

  .scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
  .scrollbar::-webkit-scrollbar-track { background: #1e1e1e; }
  .scrollbar::-webkit-scrollbar-thumb { background: #3c3c3c; border-radius: 4px; }
  .scrollbar::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }

  .code-marker {
    position: absolute;
    left: -14px;
    top: 3px;
    font-size: 11px;
    color: #e74c3c;
    cursor: pointer;
    z-index: 2;
  }
</style>
</head>
<body>
<div class="app">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-logo">AI</div>
      <span class="brand-title">AI代码安全审计员</span>
      <span class="brand-sub">v1.2.0 · 企业版</span>
    </div>
    <div class="actions">
      <button class="btn secondary" onclick="resetCode()">重置示例</button>
      <button class="btn" onclick="runScan()">⚡ 重新审计</button>
    </div>
  </div>

  <div class="main">
    <!-- Activity Bar -->
    <div class="activity-bar">
      <div class="activity-icon">📁</div>
      <div class="activity-icon active">🛡️</div>
      <div class="activity-icon">🔍</div>
      <div class="activity-icon">🐞</div>
      <div class="activity-icon">📊</div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar scrollbar">
      <div class="sidebar-header">资源管理器</div>
      <div class="file-tree">
        <div class="folder">
          <div class="folder-label">🔒 secure-app</div>
          <div class="file active"><span class="icon">📄</span>auth_service.js</div>
          <div class="file"><span class="icon">📄</span>user_model.js</div>
          <div class="file"><span class="icon">📄</span>payment.js</div>
          <div class="file"><span class="icon">📄</span>config.js</div>
          <div class="file"><span class="icon">📁</span>utils</div>
        </div>
      </div>
      <div class="sidebar-header">审计历史</div>
      <div class="file" style="color:#858585"><span class="icon">•</span> 今日 · 3 个漏洞</div>
      <div class="file" style="color:#858585"><span class="icon">•</span> 昨日 · 1 个漏洞</div>
    </div>

    <!-- Workspace -->
    <div class="workspace">
      <!-- Editor -->
      <div class="editor">
        <div class="tabs">
          <div class="tab active"><span class="dot"></span>auth_service.js</div>
          <div class="tab">user_model.js</div>
          <div class="tab">payment.js</div>
        </div>

        <div class="editor-area scrollbar" id="editorArea">
          <div class="gutter" id="gutter"></div>
          <div class="code" id="codeBlock"></div>

          <div class="scan-overlay" id="scanOverlay">
            <div class="scan-spinner"></div>
            <div class="scan-text">AI正在分析代码安全性...</div>
          </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
          <div class="status-item">● 已连接</div>
          <div class="status-item">⟨/⟩ JavaScript</div>
          <div class="status-item">行 12, 列 24</div>
          <div class="status-item">UTF-8</div>
          <div class="status-item danger">⚠ <span id="issueCount">2</span> 个安全漏洞</div>
        </div>
      </div>

      <!-- Audit Panel -->
      <div class="audit-panel">
        <div class="audit-header">
          <div class="audit-title">
            <span>🛡️ 安全审计报告</span>
            <span class="audit-badge" id="panelBadge">2 个风险</span>
          </div>
        </div>

        <div class="audit-body scrollbar" id="auditBody"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">✅ 修复已应用！代码已更新</div>

<script>
const originalCode = [
  "const express = require('express');",
  "const jwt = require('jsonwebtoken');",
  "",
  "class AuthService {",
  "  constructor(db) {",
  "    this.db = db;",
  "  }",
  "",
  "  // 用户登录接口",
  "  async login(username, password) {",
  "    // ⚠ 漏洞1: SQL注入风险 - 字符串拼接",
  "    const query = \"SELECT * FROM users WHERE name = '\" + username + \"' AND pw = '\" + password + \"'\";",
  "    const result = await this.db.query(query);",
  "",
  "    if (result.length > 0) {",
  "      const token = jwt.sign({ id: result[0].id }, 'secret-key');",
  "      return { success: true, token };",
  "    }",
  "    return { success: false };",
  "  }",
  "",
  "  // 动态权限校验",
  "  checkPermission(role, action) {",
  "    // ⚠ 漏洞2: 代码注入风险 - eval()使用",
  "    const rule = \"user.role === '\" + role + \"' && canDo\" + action;",
  "    return eval(rule);",
  "  }",
  "",
  "  // 安全的方法（示例）",
  "  verifyToken(token) {",
  "    try {",
  "      return jwt.verify(token, 'secret-key');",
  "    } catch (e) {",
  "      return null;",
  "    }",
  "  }",
  "}"
];

let currentCode = [...originalCode];

const issues = {
  sql: {
    id: 'sql',
    line: 12,
    title: 'SQL注入风险',
    severity: 'high',
    severityLabel: '高危',
    location: 'auth_service.js:12',
    description: '检测到通过字符串拼接构建SQL查询语句，攻击者可通过注入恶意SQL代码获取、修改数据库敏感数据，甚至删除整张表。',
    principle: '用户输入未经任何过滤直接拼接进SQL语句，导致攻击者可构造如 <span style="color:#e74c3c">OR 1=1 --</span> 的 payload 绕过认证。',
    flow: [
      { text: '用户输入', type: 'normal' },
      { text: '拼接字符串', type: 'danger' },
      { text: 'SQL执行', type: 'danger' },
      { text: '数据泄露', type: 'danger' }
    ],
    dangerousCode: `const query = "SELECT * FROM users WHERE name = '" + username + "' AND pw = '" + password + "'";\nconst result = await this.db.query(query);`,
    fixedCode: `const query = "SELECT * FROM users WHERE name = ? AND pw = ?";\nconst result = await this.db.query(query, [username, password]);`,
    fixLabel: '应用参数化查询'
  },
  eval: {
    id: 'eval',
    line: 27,
    title: '代码注入风险',
    severity: 'high',
    severityLabel: '高危',
    location: 'auth_service.js:27',
    description: '使用 eval() 执行动态字符串，攻击者可通过控制 role 或 action 参数注入任意 JavaScript 代码，获取服务器执行权限。',
    principle: 'eval() 会将字符串作为代码执行，当字符串内容由外部输入拼接时，攻击者可以注入诸如 <span style="color:#e74c3c">;require("fs").readFileSync("/etc/passwd")</span> 等恶意代码。',
    flow: [
      { text: '外部输入', type: 'normal' },
      { text: 'eval拼接', type: 'danger' },
      { text: '代码执行', type: 'danger' },
      { text: '服务器沦陷', type: 'danger' }
    ],
    dangerousCode: `const rule = "user.role === '" + role + "' && canDo" + action;\nreturn eval(rule);`,
    fixedCode: `const permissions = {\n  admin: { read: true, write: true, delete: true },\n  user:  { read: true, write: false, delete: false }\n};\nreturn !!permissions[role]?.[action];`,
    fixLabel: '应用安全映射表'
  }
};

let activeIssue = null;

function renderGutter() {
  const gutter = document.getElementById('gutter');
  gutter.innerHTML = currentCode.map((_, i) => {
    const issue = Object.values(issues).find(x => x.line === i + 1);
    return `<div style="position:relative">${i + 1}${issue ? '<span style="position:absolute;left:2px;color:#e74c3c;font-size:9px">●</span>' : ''}</div>`;
  }).join('');
}

function highlightLine(line) {
  let html = line;
  // comments
  html = html.replace(/\/\/.*$/g, '<span class="cm">$&</span>');
  // keywords
  html = html.replace(/\b(const|let|var|async|await|return|if|else|try|catch|new|class|function|this)\b/g, '<span class="kw">$&</span>');
  // strings
  html = html.replace(/'[^']*'|"[^"]*"|`[^`]*`/g, '<span class="str">$&</span>');
  // function calls
  html = html.replace(/\b(require|eval|query|sign|verify|catch)\b/g, '<span class="fn">$&</span>');
  // numbers
  html = html.replace(/\b(\d+)\b/g, '<span class="num">$1</span>');
  // booleans/null
  html = html.replace(/\b(true|false|null|undefined)\b/g, '<span class="kw">$&</span>');
  // class names
  html = html.replace(/\b(AuthService)\b/g, '<span class="cls">$1</span>');
  return html;
}

function renderCode() {
  const codeBlock = document.getElementById('codeBlock');
  const lines = currentCode.map((line, i) => {
    const issue = Object.values(issues).find(x => x.line === i + 1);
    const highlighted = highlightLine(line);
    let lineHtml = `<div class="code-line ${issue ? 'error-line' : ''}" data-line="${i + 1}">`;
    if (issue) {
      lineHtml += `<span class="code-marker" title="${issue.title}" onclick="selectIssue('${issue.id}')">⚠</span>`;
    }
    lineHtml += highlighted;
    if (issue) {
      lineHtml += `<div class="warning" title="${issue.title} - 点击查看详情" onclick="selectIssue('${issue.id}')"></div>`;
      lineHtml += `<div class="audit-indicator" title="${issue.title}" onclick="selectIssue('${issue.id}')">!</div>`;
    }
    lineHtml += '</div>';
    return lineHtml;
  });
  codeBlock.innerHTML = lines.join('');
  renderGutter();
}

function renderAuditPanel() {
  const body = document.getElementById('auditBody');
  const openIssue = activeIssue ? issues[activeIssue] : null;

  if (!openIssue) {
    body.innerHTML = `
      <div class="issue-list">
        ${Object.values(issues).map(iss => `
          <div class="issue-card" onclick="selectIssue('${iss.id}')">
            <span class="issue-severity severity ${iss.severity}">${iss.severityLabel}</span>
            <div class="issue-title">${iss.title}</div>
            <div class="issue-location">📍 ${iss.location}</div>
          </div>
        `).join('')}
      </div>
      <div style="margin-top:16px;padding:12px;background:#1e1e1e;border-radius:4px;font-size:12px;color:#858585">
        <div style="color:#007acc;font-weight:600;margin-bottom:6px">📊 统计概览</div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>高危漏洞</span><span style="color:#e74c3c">2</span></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>中危漏洞</span><span>0</span></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>已扫描行数</span><span>${currentCode.length}</span></div>
      </div>
      <div style="margin-top:16px;text-align:center">
        <button class="btn secondary" onclick="expandAll()">展开全部详情</button>
      </div>
    `;
    return;
  }

  body.innerHTML = `
    <div class="issue-detail visible">
      <div class="detail-section">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <span class="issue-severity severity ${openIssue.severity}">${openIssue.severityLabel}</span>
          <span class="audit-badge info">${openIssue.location}</span>
        </div>
        <div style="font-size:15px;color:#fff;font-weight:600;margin-bottom:8px">${openIssue.title}</div>
        <div class="detail-content"><p>${openIssue.description}</p></div>
      </div>

      <div class="detail-section">
        <div class="detail-label">漏洞原理</div>
        <div class="detail-content" style="margin-bottom:10px">${openIssue.principle}</div>
        <div class="principle-diagram">
          <div class="diagram-flow">
            ${openIssue.flow.map((n, i) => `
              <div style="display:flex;align-items:center;gap:4px;flex:1">
                <div class="diagram-node ${n.type}">${n.text}</div>
                ${i < openIssue.flow.length - 1 ? '<span class="diagram-arrow">→</span>' : ''}
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-label">当前代码（危险）</div>
        <div class="code-block dangerous">${openIssue.dangerousCode}</div>
      </div>

      <div class="detail-section">
        <div class="detail-label">建议修复方案</div>
        <div class="code-block fixed">${openIssue.fixedCode}</div>
        <button class="apply-btn" onclick="applyFix('${openIssue.id}')">
          <span class="icon">✨</span> ${openIssue.fixLabel}
        </button>
      </div>
    </div>
  `;
}

function selectIssue(id) {
  activeIssue = id;
  renderCode();
  renderAuditPanel();
  document.getElementById('issueCount').textContent = Object.keys(issues).length;
}

function expandAll() {
  activeIssue = null;
  renderAuditPanel();
}

function applyFix(id) {
  if (id === 'sql') {
    currentCode[11] = '    const query = "SELECT * FROM users WHERE name = ? AND pw = ?";';
    currentCode[12] = '    const result = await this.db.query(query, [username, password]);';
    delete issues.sql;
  } else if (id === 'eval') {
    currentCode[26] = '    const permissions = {';
    currentCode[27] = '      admin: { read: true, write: true, delete: true },';
    currentCode[28] = '      user:  { read: true, write: false, delete: false }';
    currentCode[29] = '    };';
    currentCode[30] = '    return !!permissions[role]?.[action];';
    delete issues.eval;
  }

  activeIssue = null;
  renderCode();

  const count = Object.keys(issues).length;
  document.getElementById('issueCount').textContent = count;
  document.getElementById('panelBadge').textContent = count > 0 ? `${count} 个风险` : '已修复';
  document.getElementById('panelBadge').className = count > 0 ? 'audit-badge' : 'audit-badge safe';

  if (count === 0) {
    document.getElementById('auditBody').innerHTML = `
      <div class="empty-state">
        <div class="emoji">🎉</div>
        <div class="text" style="font-size:16px;color:#27ae60;font-weight:600;margin-bottom:6px">所有漏洞已修复</div>
        <div style="font-size:12px;color:#858585">您的代码已通过安全审计，符合 OWASP 最佳实践。</div>
      </div>
    `;
  } else {
    renderAuditPanel();
  }

  showToast(id === 'sql' ? '✅ SQL注入漏洞已修复！已应用参数化查询' : '✅ 代码注入漏洞已修复！已替换为安全映射表');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove(''),  2500);
}

function resetCode() {
  currentCode = [...originalCode];
  issues.sql = {
    id: 'sql', line: 12, title: 'SQL注入风险', severity: 'high', severityLabel: '高危',
    location: 'auth_service.js:12',
    description: '检测到通过字符串拼接构建SQL查询语句，攻击者可通过注入恶意SQL代码获取、修改数据库敏感数据。',
    principle: '用户输入未经任何过滤直接拼接进SQL语句，可构造 <span style="color:#e74c3c">OR 1=1 --</span> 绕过认证。',
    flow: [
      { text: '用户输入', type: 'normal' }, { text: '拼接字符串', type: 'danger' },
      { text: 'SQL执行', type: 'danger' }, { text: '数据泄露', type: 'danger' }
    ],
    dangerousCode: `const query = "SELECT * FROM users WHERE name = '" + username + "' AND pw = '" + password + "'";\nconst result = await this.db.query(query);`,
    fixedCode: `const query = "SELECT * FROM users WHERE name = ? AND pw = ?";\nconst result = await this.db.query(query, [username, password]);`,
    fixLabel: '应用参数化查询'
  };
  issues.eval = {
    id: 'eval', line: 27, title: '代码注入风险', severity: 'high', severityLabel: '高危',
    location: 'auth_service.js:27',
    description: '使用 eval() 执行动态字符串，攻击者可注入任意 JavaScript 代码。',
    principle: 'eval() 会将字符串作为代码执行，可注入诸如 <span style="color:#e74c3c">;require("fs")</span> 等恶意代码。',
    flow: [
      { text: '外部输入', type: 'normal' }, { text: 'eval拼接', type: 'danger' },
      { text: '代码执行', type: 'danger' }, { text: '服务器沦陷', type: 'danger' }
    ],
    dangerousCode: `const rule = "user.role === '" + role + "' && canDo" + action;\nreturn eval(rule);`,
    fixedCode: `const permissions = {\n  admin: { read: true, write: true, delete: true },\n  user:  { read: true, write: false, delete: false }\n};\nreturn !!permissions[role]?.[action];`,
    fixLabel: '应用安全映射表'
  };
  activeIssue = null;
  document.getElementById('panelBadge').className = 'audit-badge';
  document.getElementById('panelBadge').textContent = '2 个风险';
  document.getElementById('issueCount').textContent = '2';
  renderCode();
  renderAuditPanel();
}

function runScan() {
  const overlay = document.getElementById('scanOverlay');
  overlay.classList.add('active');
  setTimeout(() => {
    overlay.classList.remove('active');
    showToast('⚡ 审计完成：检测到 2 个高危漏洞');
  }, 1500);
}

// Init
renderCode();
renderAuditPanel();
</script>
</body>
</html>
