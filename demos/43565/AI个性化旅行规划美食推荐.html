<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI个性化旅行规划&美食推荐</title>
<style>
/* ===== 基础重置与变量 ===== */
:root {
  --primary-blue: #7EC8E3;
  --light-blue: #B5E3F5;
  --pale-blue: #E8F4FA;
  --cream-white: #FFF8F0;
  --warm-white: #FFFFFF;
  --accent-orange: #FFB347;
  --accent-green: #7BC8A1;
  --text-dark: #2C3E50;
  --text-medium: #5D6D7E;
  --text-light: #95A5A6;
  --border-light: #E8EEF2;
  --shadow-card: 0 2px 12px rgba(126, 200, 227, 0.12);
  --shadow-hover: 0 6px 24px rgba(126, 200, 227, 0.22);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: all 0.3s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, var(--pale-blue) 0%, var(--cream-white) 50%, var(--warm-white) 100%);
  color: var(--text-dark);
  min-height: 100vh;
  line-height: 1.6;
}

/* ===== 顶部标题区 ===== */
.header {
  background: linear-gradient(135deg, var(--primary-blue) 0%, #A8D8EA 100%);
  padding: 40px 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
  animation: float 8s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  50% { transform: translate(30px, -30px) rotate(10deg); }
}
.header h1 {
  font-size: 2.2em;
  color: white;
  position: relative;
  z-index: 1;
  text-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.header p {
  color: rgba(255,255,255,0.9);
  font-size: 1.05em;
  margin-top: 10px;
  position: relative;
  z-index: 1;
}
.header .emoji-row {
  font-size: 1.8em;
  margin-top: 12px;
  position: relative;
  z-index: 1;
}

/* ===== 容器 ===== */
.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 30px 20px 100px;
}

/* ===== 卡片通用样式 ===== */
.card {
  background: var(--warm-white);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  padding: 28px;
  margin-bottom: 24px;
  transition: var(--transition);
  border: 1px solid var(--border-light);
  opacity: 0;
  transform: translateY(20px);
  animation: fadeInUp 0.5s forwards;
}
.card:hover {
  box-shadow: var(--shadow-hover);
}
@keyframes fadeInUp {
  to { opacity: 1; transform: translateY(0); }
}
.card-title {
  font-size: 1.3em;
  color: var(--primary-blue);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
}
.card-title .icon { font-size: 1.2em; }

/* ===== 表单样式 ===== */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
.form-group {
  display: flex;
  flex-direction: column;
}
.form-group.full-width {
  grid-column: 1 / -1;
}
.form-group label {
  font-size: 0.92em;
  color: var(--text-medium);
  margin-bottom: 6px;
  font-weight: 500;
}
.form-group input,
.form-group select {
  padding: 12px 16px;
  border: 2px solid var(--border-light);
  border-radius: var(--radius-sm);
  font-size: 1em;
  color: var(--text-dark);
  transition: var(--transition);
  background: var(--pale-blue);
  outline: none;
}
.form-group input:focus,
.form-group select:focus {
  border-color: var(--primary-blue);
  box-shadow: 0 0 0 3px rgba(126, 200, 227, 0.2);
}

/* 兴趣标签 */
.tag-container {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 4px;
}
.tag-item {
  padding: 8px 18px;
  border: 2px solid var(--border-light);
  border-radius: 24px;
  cursor: pointer;
  transition: var(--transition);
  font-size: 0.92em;
  background: var(--pale-blue);
  user-select: none;
}
.tag-item:hover {
  border-color: var(--primary-blue);
  background: var(--light-blue);
}
.tag-item.active {
  background: var(--primary-blue);
  color: white;
  border-color: var(--primary-blue);
}

/* ===== 按钮样式 ===== */
.btn {
  padding: 14px 32px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 1.05em;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary-blue) 0%, #5BB5D5 100%);
  color: white;
  box-shadow: 0 4px 15px rgba(126, 200, 227, 0.35);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(126, 200, 227, 0.5);
}
.btn-secondary {
  background: var(--pale-blue);
  color: var(--primary-blue);
  border: 2px solid var(--primary-blue);
}
.btn-secondary:hover {
  background: var(--light-blue);
}
.btn-danger {
  background: #FFE5E5;
  color: #E74C3C;
  border: 2px solid #E74C3C;
}
.btn-danger:hover {
  background: #E74C3C;
  color: white;
}
.btn-sm {
  padding: 8px 16px;
  font-size: 0.88em;
  border-radius: 8px;
}
.btn-group {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

/* ===== 行程展示 ===== */
.itinerary-section { display: none; }
.itinerary-section.visible { display: block; }

.day-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.day-tab {
  padding: 10px 22px;
  border: 2px solid var(--border-light);
  border-radius: 24px;
  cursor: pointer;
  transition: var(--transition);
  font-size: 0.95em;
  background: var(--pale-blue);
  font-weight: 500;
}
.day-tab:hover { border-color: var(--primary-blue); }
.day-tab.active {
  background: var(--primary-blue);
  color: white;
  border-color: var(--primary-blue);
}

.day-content { display: none; }
.day-content.active { display: block; }

.time-block {
  margin-bottom: 20px;
  padding: 16px;
  background: var(--pale-blue);
  border-radius: var(--radius-sm);
  border-left: 4px solid var(--primary-blue);
  transition: var(--transition);
}
.time-block:hover {
  transform: translateX(4px);
}
.time-block.dinner { border-left-color: var(--accent-orange); }
.time-block.lunch { border-left-color: var(--accent-green); }
.time-block.rest { border-left-color: var(--text-light); }
.time-label {
  font-size: 0.85em;
  color: var(--text-light);
  font-weight: 600;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.time-title {
  font-size: 1.05em;
  font-weight: 600;
  color: var(--text-dark);
  margin-bottom: 4px;
}
.time-duration {
  font-size: 0.85em;
  color: var(--text-medium);
}
.time-actions {
  margin-top: 10px;
  display: flex;
  gap: 8px;
}

/* ===== 美食推荐 ===== */
.food-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.food-card {
  background: var(--pale-blue);
  border-radius: var(--radius-sm);
  padding: 18px;
  transition: var(--transition);
  border: 1px solid var(--border-light);
}
.food-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
}
.food-type {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 0.78em;
  font-weight: 600;
  margin-bottom: 10px;
}
.food-type.meal { background: #E8F8F0; color: var(--accent-green); }
.food-type.snack { background: #FFF3E0; color: var(--accent-orange); }
.food-type.tea { background: #F3E5F5; color: #9C27B0; }
.food-name {
  font-size: 1.05em;
  font-weight: 600;
  margin-bottom: 6px;
}
.food-cuisine {
  font-size: 0.88em;
  color: var(--text-medium);
  margin-bottom: 4px;
}
.food-price {
  font-size: 0.9em;
  color: var(--accent-orange);
  font-weight: 600;
}
.food-time {
  font-size: 0.85em;
  color: var(--text-light);
  margin-top: 4px;
}

/* ===== 出行小贴士 ===== */
.tips-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}
.tip-card {
  background: var(--pale-blue);
  border-radius: var(--radius-sm);
  padding: 20px;
  border: 1px solid var(--border-light);
}
.tip-card h4 {
  color: var(--primary-blue);
  margin-bottom: 10px;
  font-size: 1em;
}
.tip-card ul {
  list-style: none;
  padding: 0;
}
.tip-card li {
  padding: 4px 0;
  font-size: 0.92em;
  color: var(--text-medium);
}
.tip-card li::before {
  content: '✦ ';
  color: var(--primary-blue);
}

/* ===== 底部操作栏 ===== */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  padding: 16px 20px;
  display: flex;
  justify-content: center;
  gap: 16px;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
  z-index: 100;
  flex-wrap: wrap;
}

/* ===== Toast提示 ===== */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: var(--accent-green);
  color: white;
  padding: 14px 28px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  z-index: 9999;
  transition: transform 0.4s ease;
  box-shadow: 0 4px 15px rgba(123, 200, 161, 0.4);
}
.toast.show {
  transform: translateX(-50%) translateY(0);
}

/* ===== 加载动画 ===== */
.loading {
  display: none;
  text-align: center;
  padding: 40px;
}
.loading.visible { display: block; }
.spinner {
  width: 50px;
  height: 50px;
  border: 4px solid var(--border-light);
  border-top-color: var(--primary-blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== 模态框 ===== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 1000;
  justify-content: center;
  align-items: center;
}
.modal-overlay.visible { display: flex; }
.modal {
  background: white;
  border-radius: var(--radius);
  padding: 28px;
  max-width: 500px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}
.modal h3 {
  color: var(--primary-blue);
  margin-bottom: 18px;
}
.modal .form-group { margin-bottom: 14px; }
.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 20px;
}

/* ===== 响应式 ===== */
@media (max-width: 768px) {
  .header h1 { font-size: 1.6em; }
  .header p { font-size: 0.95em; }
  .form-grid { grid-template-columns: 1fr; }
  .card { padding: 20px; }
  .btn { padding: 12px 24px; font-size: 0.95em; }
  .food-grid { grid-template-columns: 1fr; }
  .tips-grid { grid-template-columns: 1fr; }
  .bottom-bar { padding: 12px 16px; gap: 10px; }
  .day-tabs { gap: 6px; }
  .day-tab { padding: 8px 16px; font-size: 0.88em; }
}

/* ===== 编辑模式指示 ===== */
.edit-mode-banner {
  background: var(--accent-orange);
  color: white;
  text-align: center;
  padding: 10px;
  border-radius: var(--radius-sm);
  margin-bottom: 16px;
  font-weight: 600;
  display: none;
}
.edit-mode-banner.visible { display: block; }

/* 景点计数 */
.attractions-count {
  font-size: 0.85em;
  color: var(--text-light);
  margin-bottom: 12px;
}
</style>
</head>
<body>

<!-- 顶部标题 -->
<div class="header">
  <h1>🌴 AI个性化旅行规划 & 美食推荐</h1>
  <p>输入你的出行信息，AI为你定制专属旅行方案</p>
  <div class="emoji-row">✈️ 🗺️ 📸 🍜 🌅</div>
</div>

<div class="container">

  <!-- 出行信息表单 -->
  <div class="card" id="formCard">
    <div class="card-title"><span class="icon">📝</span> 填写出行信息</div>
    <div class="form-grid">
      <div class="form-group">
        <label>目的地城市 *</label>
        <input type="text" id="destination" placeholder="例如：杭州、成都、西安..." autocomplete="off">
      </div>
      <div class="form-group">
        <label>出行天数 *</label>
        <select id="days">
          <option value="">请选择天数</option>
          <option value="1">1天</option>
          <option value="2">2天</option>
          <option value="3">3天</option>
          <option value="4">4天</option>
          <option value="5">5天</option>
          <option value="6">6天</option>
          <option value="7">7天</option>
        </select>
      </div>
      <div class="form-group">
        <label>出行预算区间 *</label>
        <select id="budget">
          <option value="">请选择预算</option>
          <option value="low">经济型（1000元以下）</option>
          <option value="mid">舒适型（1000-3000元）</option>
          <option value="high">品质型（3000-5000元）</option>
          <option value="luxury">豪华型（5000元以上）</option>
        </select>
      </div>
      <div class="form-group">
        <label>出行人群 *</label>
        <select id="group">
          <option value="">请选择人群</option>
          <option value="solo">单人出行</option>
          <option value="couple">情侣二人</option>
          <option value="family">亲子家庭</option>
          <option value="friends">朋友结伴</option>
        </select>
      </div>
      <div class="form-group full-width">
        <label>个人兴趣标签（可多选）</label>
        <div class="tag-container" id="interestTags">
          <span class="tag-item" data-value="nature">🌿 自然风光</span>
          <span class="tag-item" data-value="history">🏛️ 人文古迹</span>
          <span class="tag-item" data-value="photo">📷 网红打卡</span>
          <span class="tag-item" data-value="shopping">🛍️ 休闲逛街</span>
          <span class="tag-item" data-value="hiking">🥾 户外徒步</span>
          <span class="tag-item" data-value="culture">🎭 文化体验</span>
          <span class="tag-item" data-value="food">🍲 美食探店</span>
          <span class="tag-item" data-value="relax">☕ 休闲放松</span>
        </div>
      </div>
    </div>
    <div style="margin-top: 24px; text-align: center;">
      <button class="btn btn-primary" onclick="generateItinerary()">✨ AI智能生成行程</button>
    </div>
  </div>

  <!-- 加载动画 -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="color: var(--text-medium);">AI正在为你规划行程...</p>
  </div>

  <!-- 行程展示区 -->
  <div class="itinerary-section" id="itinerarySection">

    <!-- 每日行程卡片 -->
    <div class="card" id="itineraryCard">
      <div class="card-title"><span class="icon">🗓️</span> <span id="itineraryTitle">我的行程</span></div>
      
      <div class="edit-mode-banner" id="editBanner">📌 编辑模式中 — 你可以增删景点、调整顺序</div>
      
      <div class="day-tabs" id="dayTabs"></div>
      <div id="dayContents"></div>

      <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn btn-secondary btn-sm" id="editBtn" onclick="toggleEditMode()">✏️ 编辑行程</button>
        <button class="btn btn-secondary btn-sm" id="addAttractionBtn" onclick="showAddModal()" style="display:none;">➕ 添加景点</button>
      </div>
    </div>

    <!-- 美食推荐卡片 -->
    <div class="card" id="foodCard">
      <div class="card-title"><span class="icon">🍜</span> <span id="foodTitle">美食推荐</span></div>
      <div class="food-grid" id="foodGrid"></div>
    </div>

    <!-- 出行小贴士卡片 -->
    <div class="card" id="tipsCard">
      <div class="card-title"><span class="icon">💡</span> 出行小贴士</div>
      <div class="tips-grid" id="tipsGrid"></div>
    </div>

  </div>

</div>

<!-- 底部操作栏 -->
<div class="bottom-bar" id="bottomBar" style="display:none;">
  <button class="btn btn-primary btn-sm" onclick="copyItinerary()">📋 复制行程</button>
  <button class="btn btn-secondary btn-sm" onclick="regenerate()">🔄 重新生成</button>
  <button class="btn btn-danger btn-sm" onclick="resetAll()">🗑️ 重置表单</button>
</div>

<!-- Toast提示 -->
<div class="toast" id="toast"></div>

<!-- 添加景点模态框 -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3>➕ 添加景点</h3>
    <div class="form-group">
      <label>选择日期</label>
      <select id="addDaySelect"></select>
    </div>
    <div class="form-group">
      <label>选择时段</label>
      <select id="addTimeSlot">
        <option value="morning">上午</option>
        <option value="afternoon">下午</option>
        <option value="evening">晚上</option>
      </select>
    </div>
    <div class="form-group">
      <label>景点名称 *</label>
      <input type="text" id="addName" placeholder="输入景点名称">
    </div>
    <div class="form-group">
      <label>预计游玩时长（分钟）</label>
      <input type="number" id="addDuration" placeholder="例如：90" value="90">
    </div>
    <div class="form-group">
      <label>备注</label>
      <input type="text" id="addNote" placeholder="可选备注">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary btn-sm" onclick="closeAddModal()">取消</button>
      <button class="btn btn-primary btn-sm" onclick="addAttraction()">添加</button>
    </div>
  </div>
</div>

<script>
// ===== 数据层 =====
let itineraryData = [];
let editMode = false;
let selectedInterestTags = [];
let currentDestination = '';

// 城市数据知识库
const cityKnowledge = {
  '杭州': {
    attractions: {
      nature: ['西湖断桥残雪', '灵隐寺', '西溪湿地', '龙井茶园', '千岛湖'],
      history: ['雷峰塔', '岳王庙', '宋城', '中国丝绸博物馆', '南宋御街'],
      photo: ['河坊街', '运河畔', '茅家埠', '太子湾公园', '满觉陇'],
      shopping: ['湖滨银泰in77', '武林广场', '四季青服装城', '天目里'],
      hiking: ['宝石山', '北高峰', '九溪十八涧', '梅家坞', '云栖竹径'],
      culture: ['浙江省博物馆', '中国茶叶博物馆', '中国丝绸博物馆', '中国刀剪剑博物馆'],
      food: ['楼外楼', '知味观', '外婆家', '新白鹿', '绿茶餐厅'],
      relax: ['龙井村品茶', '满觉陇咖啡馆', '西湖游船', '西溪摇橹船']
    },
    food: [
      { name: '西湖醋鱼', cuisine: '杭帮菜', price: '80-120元', type: 'meal', times: '午餐/晚餐' },
      { name: '东坡肉', cuisine: '杭帮菜', price: '60-90元', type: 'meal', times: '午餐/晚餐' },
      { name: '龙井虾仁', cuisine: '杭帮菜', price: '70-100元', type: 'meal', times: '午餐/晚餐' },
      { name: '片儿川', cuisine: '杭州面条', price: '20-35元', type: 'snack', times: '早餐/午餐' },

// 城市智能匹配
function matchCity(dest) {
  dest = dest.toLowerCase().trim();
  for (let key in cityKnowledge) {
    if (dest.includes(key.toLowerCase()) || key.toLowerCase().includes(dest)) {
      return cityKnowledge[key];
    }
  }
  // 尝试模糊匹配
  const commonCities = ['北京', '上海', '广州', '深圳', '重庆', '南京', '苏州', '厦门', '丽江', '桂林', '长沙', '武汉', '青岛', '大连', '昆明', '三亚', '西安', '成都', '杭州'];
  for (let city of commonCities) {
    if (dest.includes(city.toLowerCase()) || city.toLowerCase().includes(dest)) {
      return cityKnowledge[city];
    }
  }
  return null;
}

// ===== 生成行程 =====
function generateItinerary() {
  const dest = document.getElementById('destination').value.trim();
  const days = parseInt(document.getElementById('days').value);
  const budget = document.getElementById('budget').value;
  const group = document.getElementById('group').value;

  // 验证
  if (!dest) { showToast('⚠️ 请输入目的地城市'); return; }
  if (!days) { showToast('⚠️ 请选择出行天数'); return; }
  if (!budget) { showToast('⚠️ 请选择预算区间'); return; }
  if (!group) { showToast('⚠️ 请选择出行人群'); return; }
  if (selectedInterestTags.length === 0) { showToast('⚠️ 请至少选择一个兴趣标签'); return; }

  currentDestination = dest;

  // 显示加载
  document.getElementById('loading').classList.add('visible');
  document.getElementById('itinerarySection').classList.remove('visible');

  // 模拟AI延迟
  setTimeout(() => {
    buildItinerary(dest, days, budget, group);
    document.getElementById('loading').classList.remove('visible');
    document.getElementById('itinerarySection').classList.add('visible');
    
    // 滚动到行程区域
    document.getElementById('itinerarySection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    showToast('✅ 行程生成完成！');
  }, 1500);
}

function buildItinerary(dest, days, budget, group) {
  const cityData = matchCity(dest) || defaultCity;
  const budgetLevels = { low: 0.7, mid: 1, high: 1.3, luxury: 1.8 };
  const budgetMul = budgetLevels[budget] || 1;

  // 构建每日行程
  itineraryData = [];
  const timeSlots = [
    { key: 'morning', label: '上午', icon: '🌅', cls: '' },
    { key: 'afternoon', label: '下午', icon: '☀️', cls: '' },
    { key: 'evening', label: '晚上', icon: '🌙', cls: 'dinner' }
  ];

  // 根据人群调整
  const groupAdjustments = {
    solo: { rest: true, relaxed: true },
    couple: { romantic: true, photo: true },
    family: { kidFriendly: true, rest: true, earlyFinish: true },
    friends: { active: true, nightLife: true }
  };
  const adj = groupAdjustments[group] || {};

  for (let d = 0; d < days; d++) {
    const dayData = { day: d + 1, slots: [] };
    
    // 上午时段
    const morningAttractions = pickAttractions(cityData, selectedInterestTags, 2, d);
    dayData.slots.push({
      period: 'morning',
      label: '上午探索',
      icon: '🌅',
      items: morningAttractions.map(a => ({
        name: a.name,
        duration: a.duration,
        note: a.note || ''
      }))
    });

    // 午休（除单人外都有）
    if (adj.rest || group !== 'solo') {
      dayData.slots.push({
        period: 'rest',
        label: '午休时光',
        icon: '😴',
        items: [{ name: '酒店休息 / 附近散步', duration: 60, note: '补充体力' }]
      });
    }

    // 下午时段
    const afternoonAttractions = pickAttractions(cityData, selectedInterestTags, 2, d + 10);
    dayData.slots.push({
      period: 'afternoon',
      label: '下午漫游',
      icon: '☀️',
      items: afternoonAttractions.map(a => ({
        name: a.name,
        duration: a.duration,
        note: a.note || ''
      }))
    });

    // 晚餐
    const dinnerOptions = adj.nightLife ? 
      [{ name: '当地特色晚餐', duration: 90, note: '推荐当地知名餐厅' }] :
      [{ name: '轻松享用晚餐', duration: 60, note: '选择附近评价好的餐厅' }];
    dayData.slots.push({
      period: 'evening',
      label: '晚间时光',
      icon: '🌙',
      items: dinnerOptions
    });

    itineraryData.push(dayData);
  }

  renderItinerary(cityData);
}

function pickAttractions(cityData, tags, count, seed) {
  const results = [];
  const shuffled = [...tags].sort(() => Math.sin(seed++) * 10000 % 1 - 0.5);
  
  for (let tag of shuffled) {
    const attrList = cityData.attractions[tag] || [];
    for (let attr of attrList) {
      if (results.length >= count) break;
      const durations = [45, 60, 90, 120];
      results.push({
        name: attr,
        duration: durations[Math.floor(Math.random() * durations.length)],
        note: ''
      });
    }
    if (results.length >= count) break;
  }
  
  // 如果还不够，用默认数据填充
  const defaults = cityData.attractions.nature || [];
  for (let attr of defaults) {
    if (results.length >= count) break;
    if (!results.find(r => r.name === attr)) {
      results.push({ name: attr, duration: 60, note: '' });
    }
  }
  
  return results.slice(0, count);
}

// ===== 渲染行程 =====
function renderItinerary(cityData) {
  // 标题
  document.getElementById('itineraryTitle').textContent = `${currentDestination} ${itineraryData.length}日行程`;

  // 构建Tab
  const tabsContainer = document.getElementById('dayTabs');
  const contentsContainer = document.getElementById('dayContents');
  tabsContainer.innerHTML = '';
  contentsContainer.innerHTML = '';

  itineraryData.forEach((day, idx) => {
    // Tab按钮
    const tab = document.createElement('div');
    tab.className = 'day-tab' + (idx === 0 ? ' active' : '');
    tab.textContent = `第${day.day}天`;
    tab.onclick = () => switchDay(idx);
    tabsContainer.appendChild(tab);

    // 内容
    const content = document.createElement('div');
    content.className = 'day-content' + (idx === 0 ? ' active' : '');
    
    let html = '';
    day.slots.forEach((slot, sIdx) => {
      html += `<div class="time-block ${slot.cls || ''}">`;
      html += `<div class="time-label">${slot.icon} ${slot.label}</div>`;
      
      slot.items.forEach((item, iIdx) => {
        html += `<div class="time-title">${item.name}</div>`;
        html += `<div class="time-duration">⏱️ 约${item.duration}分钟</div>`;
        if (item.note) html += `<div style="font-size:0.85em;color:var(--text-light);margin-top:4px;">📝 ${item.note}</div>`;
        
        // 编辑模式下的操作按钮
        if (editMode) {
          html += `<div class="time-actions">
            <button class="btn btn-danger btn-sm" onclick="removeItem(${idx},${sIdx},${iIdx})">删除</button>
            <button class="btn btn-secondary btn-sm" onclick="moveItem(${idx},${sIdx},${iIdx},-1)">↑</button>
            <button class="btn btn-secondary btn-sm" onclick="moveItem(${idx},${sIdx},${iIdx},1)">↓</button>
          </div>`;
        }
      });
      
      html += `</div>`;
    });

    content.innerHTML = html;
    contentsContainer.appendChild(content);
  });

  // 渲染美食
  renderFood(cityData);
  
  // 渲染小贴士
  renderTips(cityData);
}

function switchDay(idx) {
  document.querySelectorAll('.day-tab').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.day-content').forEach((c, i) => {
    c.classList.toggle('active', i === idx);
  });
}

function refreshDayDisplay() {
  const contentsContainer = document.getElementById('dayContents');
  const activeContent = contentsContainer.querySelector('.day-content.active');
  if (!activeContent) return;

  const dayIdx = Array.from(contentsContainer.children).indexOf(activeContent);
  const day = itineraryData[dayIdx];
  if (!day) return;

  let html = '';
  day.slots.forEach((slot, sIdx) => {
    html += `<div class="time-block ${slot.cls || ''}">`;
    html += `<div class="time-label">${slot.icon} ${slot.label}</div>`;
    
    slot.items.forEach((item, iIdx) => {
      html += `<div class="time-title">${item.name}</div>`;
      html += `<div class="time-duration">⏱️ 约${item.duration}分钟</div>`;
      if (item.note) html += `<div style="font-size:0.85em;color:var(--text-light);margin-top:4px;">📝 ${item.note}</div>`;
      
      if (editMode) {
        html += `<div class="time-actions">
          <button class="btn btn-danger btn-sm" onclick="removeItem(${dayIdx},${sIdx},${iIdx})">删除</button>
          <button class="btn btn-secondary btn-sm" onclick="moveItem(${dayIdx},${sIdx},${iIdx},-1)">上移</button>
          <button class="btn btn-secondary btn-sm" onclick="moveItem(${dayIdx},${sIdx},${iIdx},1)">下移</button>
        </div>`;
      }
    });
    
    html += `</div>`;
  });

  activeContent.innerHTML = html;
}

function removeItem(dayIdx, slotIdx, itemIdx) {
  if (!confirm('确定删除这个景点吗？')) return;
  itineraryData[dayIdx].slots[slotIdx].items.splice(itemIdx, 1);
  showToast('🗑️ 已删除');
  refreshDayDisplay();
}

function moveItem(dayIdx, slotIdx, itemIdx, dir) {
  const items = itineraryData[dayIdx].slots[slotIdx].items;
  const newIdx = itemIdx + dir;
  if (newIdx < 0 || newIdx >= items.length) return;
  [items[itemIdx], items[newIdx]] = [items[newIdx], items[itemIdx]];
  refreshDayDisplay();
}

// ===== 添加景点 =====
function showAddModal() {
  const modal = document.getElementById('addModal');
  const daySelect = document.getElementById('addDaySelect');
  daySelect.innerHTML = '';
  itineraryData.forEach((day, idx) => {
    daySelect.innerHTML += `<option value="${idx}">第${day.day}天</option>`;
  });
  modal.classList.add('visible');
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('visible');
  document.getElementById('addName').value = '';
  document.getElementById('addDuration').value = '90';
  document.getElementById('addNote').value = '';
}

function addAttraction() {
  const dayIdx = parseInt(document.getElementById('addDaySelect').value);
  const timeSlot = document.getElementById('addTimeSlot').value;
  const name = document.getElementById('addName').value.trim();
  const duration = parseInt(document.getElementById('addDuration').value) || 90;
  const note = document.getElementById('addNote').value.trim();

  if (!name) { showToast('⚠️ 请输入景点名称'); return; }

  const slotMap = { morning: 0, afternoon: 2, evening: 3 };
  const slotKey = slotMap[timeSlot];
  
  if (!itineraryData[dayIdx].slots[slotKey]) {
    showToast('⚠️ 该时段不存在');
    return;
  }

  itineraryData[dayIdx].slots[slotKey].items.push({
    name: name,
    duration: duration,
    note: note || '自定义添加'
  });

  closeAddModal();
  showToast('✅ 景点已添加');
  refreshDayDisplay();
}

// ===== 复制行程 =====
function copyItinerary() {
  let text = `🌴 ${currentDestination} ${itineraryData.length}日行程\n`;
  text += `${'='.repeat(30)}\n\n`;

  itineraryData.forEach(day => {
    text += `📅 第${day.day}天\n`;
    text += `${'-'.repeat(20)}\n`;
    
    day.slots.forEach(slot => {
      text += `\n${slot.icon} ${slot.label}:\n`;
      slot.items.forEach(item => {
        text += `  • ${item.name}（约${item.duration}分钟）\n`;
        if (item.note) text += `    📝 ${item.note}\n`;
      });
    });
    
    text += '\n';
  });

  // 复制
  navigator.clipboard.writeText(text).then(() => {
    showToast('📋 行程已复制到剪贴板！');
  }).catch(() => {
    // 降级方案
    const textarea = document.createElement('textarea');
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    showToast('📋 行程已复制到剪贴板！');
  });
}

// ===== 重新生成 =====
function regenerate() {
  document.getElementById('itinerarySection').classList.remove('visible');
  document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
  showToast('🔄 请调整信息后重新生成');
}

// ===== 重置 =====
function resetAll() {
  if (!confirm('确定要重置所有信息吗？')) return;
  
  document.getElementById('destination').value = '';
  document.getElementById('days').value = '';
  document.getElementById('budget').value = '';
  document.getElementById('group').value = '';
  
  document.querySelectorAll('.tag-item').forEach(t => t.classList.remove('active'));
  selectedInterestTags = [];
  
  itineraryData = [];
  editMode = false;
  currentDestination = '';
  
  document.getElementById('itinerarySection').classList.remove('visible');
  document.getElementById('bottomBar').style.display = 'none';
  document.getElementById('editBanner').classList.remove('visible');
  document.getElementById('addAttractionBtn').style.display = 'none';
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
  showToast('🗑️ 已重置');
}

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', () => {
  // 点击模态框外部关闭
  document.getElementById('addModal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('addModal')) {
      closeAddModal();
    }
  });
});
</script>
