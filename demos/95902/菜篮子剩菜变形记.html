<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>菜篮子·剩菜变形记</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Ma Shan Zheng", "ZCOOL KuaiLe", "PingFang SC", cursive;
    background: #fff5e6 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 60 60'><circle cx='30' cy='30' r='2' fill='%23ffb74d' opacity='0.3'/></svg>");
    min-height: 100vh;
    padding: 30px 20px;
    color: #4e342e;
  }
  .frame {
    max-width: 880px;
    margin: 0 auto;
    background: #fffaf0;
    border: 6px double #d84315;
    border-radius: 30px;
    padding: 40px 36px;
    box-shadow: 0 14px 40px rgba(216, 67, 21, 0.15);
    position: relative;
  }
  .frame::before, .frame::after {
    content: "🍅";
    position: absolute;
    font-size: 2.4rem;
  }
  .frame::before { top: -20px; left: 30px; }
  .frame::after { bottom: -20px; right: 30px; content: "🥕"; }
  .title-area { text-align: center; margin-bottom: 28px; }
  .title-area h1 {
    font-family: "ZCOOL KuaiLe", cursive;
    font-size: 2.6rem;
    color: #d84315;
    letter-spacing: 4px;
  }
  .title-area .sub { color: #8d6e63; font-size: 1.1rem; margin-top: 4px; }
  .stage {
    background: #fff3e0;
    border-radius: 20px;
    padding: 24px;
    border: 2px dashed #ffb74d;
    margin-bottom: 22px;
  }
  .stage h2 {
    font-family: "ZCOOL KuaiLe", cursive;
    color: #bf360c;
    font-size: 1.4rem;
    margin-bottom: 14px;
    padding-left: 14px;
    border-left: 6px solid #ff7043;
  }
  .ingredients-display {
    min-height: 64px;
    padding: 14px;
    background: #fff;
    border-radius: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
    border: 1px dashed #ffb74d;
  }
  .ing-pill {
    background: linear-gradient(135deg, #ff8a65, #ffab91);
    color: #fff;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.95rem;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(255, 138, 101, 0.3);
    transition: transform 0.2s;
  }
  .ing-pill:hover { transform: rotate(-3deg) scale(1.05); }
  .ing-pill::after { content: " ×"; opacity: 0.7; }
  .input-row {
    display: flex;
    gap: 10px;
  }
  .input-row input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #ffb74d;
    border-radius: 14px;
    background: #fff;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
  }
  .btn {
    padding: 12px 26px;
    background: linear-gradient(135deg, #ff7043, #d84315);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-family: "ZCOOL KuaiLe", cursive;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 4px 12px rgba(216, 67, 21, 0.3);
    transition: transform 0.2s;
  }
  .btn:hover { transform: translateY(-2px) rotate(-1deg); }
  .recipe-card {
    background: #fff;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 14px;
    border: 2px solid #ffcc80;
    position: relative;
    animation: rise 0.5s ease;
  }
  .recipe-card .num {
    position: absolute;
    top: -14px;
    left: 18px;
    background: #d84315;
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "ZCOOL KuaiLe", cursive;
    font-size: 1.2rem;
  }
  .recipe-card h3 {
    font-family: "ZCOOL KuaiLe", cursive;
    color: #bf360c;
    font-size: 1.3rem;
    margin: 4px 0 10px;
  }
  .recipe-card p { color: #5d4037; line-height: 1.7; font-size: 1.05rem; }
  .recipe-card .tag-row { margin-top: 10px; }
  .recipe-card .tag-row span {
    display: inline-block;
    background: #fff3e0;
    color: #e65100;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 0.85rem;
    margin-right: 6px;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(20px) rotate(-1deg); }
    to { opacity: 1; transform: translateY(0) rotate(0); }
  }
  .empty {
    text-align: center;
    color: #a1887f;
    padding: 30px;
    font-size: 1.1rem;
  }
  .sign {
    text-align: right;
    color: #a1887f;
    font-size: 0.95rem;
    margin-top: 12px;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="title-area">
    <h1>🥬 菜篮子 · 剩菜变形记</h1>
    <p class="sub">——打开冰箱，看看今天能变出什么魔法</p>
  </div>

  <div class="stage">
    <h2>① 翻翻你的小冰箱</h2>
    <div class="ingredients-display" id="ingBox">
      <span class="empty">空空如也，先去翻翻冰箱吧 ~</span>
    </div>
    <div class="input-row">
      <input type="text" id="ingInput" placeholder="例如：半根胡萝卜、两个鸡蛋..." />
      <button class="btn" onclick="addIng()">丢进篮子</button>
    </div>
  </div>

  <div class="stage">
    <h2>② 叮咚！今晚吃这些</h2>
    <div id="recipeArea">
      <div class="empty">放点食材，魔法就开始啦 ✨</div>
    </div>
    <div style="text-align:center; margin-top: 18px;">
      <button class="btn" onclick="cook()">开始烹饪！</button>
    </div>
  </div>

  <div class="sign">—— 厨房小白也能当大厨 ——</div>
</div>
<script>
  const fridge = [];
  const recipeBook = [
    { name: '🥚 黄金番茄盅', desc: '番茄挖空塞入蛋液，蒸 8 分钟，淋少许生抽，鲜嫩到筷子都夹不住。', tags: ['快手', '低卡', '颜值高'] },
    { name: '🥞 蔬菜鸡蛋饼', desc: '剩菜切碎拌入蛋液，平底锅小火煎至两面金黄，外酥里嫩。', tags: ['消灭剩菜', '孩子爱吃'] },
    { name: '🍲 一锅鲜蔬粥', desc: '剩米饭加水熬成粥，加入所有蔬菜丁，慢炖 15 分钟，养胃暖身。', tags: ['暖胃', '省事'] },
    { name: '🥗 爽口醋拌菜', desc: '黄瓜、胡萝卜切丝，蒜末香醋热油淋上去，3 分钟搞定开胃小菜。', tags: ['夏日必选', '低脂'] },
    { name: '🍛 咖喱剩菜饭', desc: '蔬菜与米饭同炒，加入咖喱块与少量牛奶，香浓到舔盘。', tags: ['浓郁', '主食'] }
  ];
  function addIng() {
    const input = document.getElementById('ingInput');
    const v = input.value.trim();
    if (v) {
      fridge.push(v);
      input.value = '';
      renderFridge();
    }
  }
  function renderFridge() {
    const box = document.getElementById('ingBox');
    if (!fridge.length) {
      box.innerHTML = '<span class="empty">空空如也，先去翻翻冰箱吧 ~</span>';
      return;
    }
    box.innerHTML = fridge.map((it, i) => `<span class="ing-pill" onclick="removeIng(${i})">${it}</span>`).join('');
  }
  function removeIng(i) { fridge.splice(i, 1); renderFridge(); }
  function cook() {
    const area = document.getElementById('recipeArea');
    const list = fridge.length ? [...recipeBook].sort(() => 0.5 - Math.random()).slice(0, 3) : recipeBook.slice(0, 3);
    area.innerHTML = list.map((r, i) => `
      <div class="recipe-card" style="animation-delay:${i * 0.12}s">
        <span class="num">${i + 1}</span>
        <h3>${r.name}</h3>
        <p>${r.desc}</p>
        <div class="tag-row">${r.tags.map(t => `<span>#${t}</span>`).join('')}</div>
      </div>
    `).join('');
  }
  document.getElementById('ingInput').addEventListener('keypress', e => { if (e.key === 'Enter') addIng(); });
</script>
</body>
</html>
