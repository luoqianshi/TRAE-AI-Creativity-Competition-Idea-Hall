<script>
/* ==================== 演示数据 ==================== */
const demoContradictions = [
  { loc: '第3章', text: '主角李默自称"自幼怕水"，但第3章却描写他"纵身跃入江中救人"，前后人设冲突。' },
  { loc: '第7章', text: '女主角苏婉设定为"不通医术"，却在危急时刻准确辨认出罕见毒草并配制解药。' },
  { loc: '第12章', text: '反派张彪前期被描述为"心狠手辣、从不留活口"，第12章却莫名放走目击者，动机不足。' },
  { loc: '第15章', text: '世界观设定中明确"灵力无法治愈外伤"，但本章主角以灵力瞬间愈合骨折。' }
];

const demoChapters = [
  { name: '第1章 初入宗门', words: 3240, density: '高', pace: '紧凑' },
  { name: '第2章 试炼开始', words: 4100, density: '高', pace: '紧凑' },
  { name: '第3章 暗流涌动', words: 2890, density: '中', pace: '适中' },
  { name: '第4章 秘境探险', words: 5600, density: '高', pace: '紧凑' },
  { name: '第5章 同门相争', words: 2100, density: '低', pace: '偏慢' },
  { name: '第6章 意外收获', words: 1980, density: '低', pace: '偏慢' },
  { name: '第7章 危机降临', words: 4520, density: '高', pace: '紧凑' },
  { name: '第8章 背水一战', words: 3890, density: '高', pace: '紧凑' }
];

const demoFillers = [
  { loc: '第5章 · 第3段', text: '连续三段对环境山石的颜色、纹理进行过度描写，与当前紧张情节脱节，建议压缩或删减。' },
  { loc: '第6章 · 第2段', text: '主角内心独白重复表达同一焦虑情绪，共187字，建议合并为一句点睛之笔。' },
  { loc: '第9章 · 第5段', text: '配角甲与配角乙的对话围绕与主线无关的家长里短展开，约320字，建议精简或删除。' },
  { loc: '第11章 · 开头', text: '章节开头用大量笔墨回顾前情，与上一章结尾衔接重复，建议直接切入新情节。' }
];

const demoReaderSerial = '前4章节奏明快、冲突密集，追更体验较好；但第5-6章明显放缓，情节推进不足，连载期间容易造成读者流失。建议每3章设置一个微型高潮或悬念钩子，维持追更动力。';
const demoReaderComplete = '整体架构完整，主线清晰，但中段（第5-9章）存在明显的"节奏塌陷"，一口气阅读时会有"卡壳"感。建议在完本修订时，将中段冗余段落压缩20%-30%，并加强反派动机铺垫，提升整体阅读流畅度。';

/* ==================== DOM 元素 ==================== */
const novelInput = document.getElementById('novelInput');
const btnClear = document.getElementById('btnClear');
const btnUpload = document.getElementById('btnUpload');
const fileInput = document.getElementById('fileInput');
const btnAnalyze = document.getElementById('btnAnalyze');
const loadingOverlay = document.getElementById('loadingOverlay');
const resultsSection = document.getElementById('resultsSection');
const btnCopy = document.getElementById('btnCopy');

const listContradictions = document.getElementById('listContradictions');
const tableChaptersBody = document.querySelector('#tableChapters tbody');
const listFiller = document.getElementById('listFiller');
const readerSerial = document.getElementById('readerSerial');
const readerComplete = document.getElementById('readerComplete');

/* ==================== 工具函数 ==================== */
function escapeHtml(str) {
  return str.replace(/[&<>"']/g, function(m) {
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[m];
  });
}

function getPaceTagClass(pace) {
  if (pace === '紧凑') return 'tag-green';
  if (pace === '适中') return 'tag-yellow';
  return 'tag-red';
}

function getDensityTagClass(density) {
  if (density === '高') return 'tag-green';
  if (density === '中') return 'tag-yellow';
  return 'tag-red';
}

/* ==================== 事件绑定 ==================== */
// 清空内容
btnClear.addEventListener('click', function() {
  novelInput.value = '';
  novelInput.focus();
});

// 上传TXT
btnUpload.addEventListener('click', function() {
  fileInput.click();
});

fileInput.addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    novelInput.value = evt.target.result;
  };
  reader.readAsText(file, 'UTF-8');
  // 重置input以便可重复选择同一文件
  fileInput.value = '';
});

// 一键自查分析
btnAnalyze.addEventListener('click', function() {
  const text = novelInput.value.trim();
  if (!text) {
    alert('请先输入或上传小说正文内容');
    novelInput.focus();
    return;
  }

  // 显示加载，隐藏结果
  resultsSection.classList.remove('active');
  loadingOverlay.classList.add('active');
  btnAnalyze.disabled = true;
  btnAnalyze.textContent = '分析中…';

  // 模拟异步分析（1.6秒）
  setTimeout(function() {
    fillDemoResults();
    loadingOverlay.classList.remove('active');
    resultsSection.classList.add('active');
    btnAnalyze.disabled = false;
    btnAnalyze.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg> 一键全文自查分析';
    // 平滑滚动到结果区
    resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 1600);
});

// 填充演示结果
function fillDemoResults() {
  // ① 人设与剧情矛盾
  listContradictions.innerHTML = demoContradictions.map(function(item) {
    return '<li><span class="loc">[' + escapeHtml(item.loc) + ']</span>' + escapeHtml(item.text) + '</li>';
  }).join('');

  // ② 章节字数&节奏统计
  tableChaptersBody.innerHTML = demoChapters.map(function(ch) {
    return '<tr>' +
      '<td>' + escapeHtml(ch.name) + '</td>' +
      '<td>' + ch.words.toLocaleString() + '</td>' +
      '<td><span class="tag ' + getDensityTagClass(ch.density) + '">' + escapeHtml(ch.density) + '</span></td>' +
      '<td><span class="tag ' + getPaceTagClass(ch.pace) + '">' + escapeHtml(ch.pace) + '</span></td>' +
      '</tr>';
  }).join('');

  // ③ 灌水冗余段落
  listFiller.innerHTML = demoFillers.map(function(item) {
    return '<li><span class="loc">[' + escapeHtml(item.loc) + ']</span>' + escapeHtml(item.text) + '</li>';
  }).join('');

  // ④ 读者视角
  readerSerial.textContent = demoReaderSerial;
  readerComplete.textContent = demoReaderComplete;
}

// 复制全部检测报告
btnCopy.addEventListener('click', function() {
  if (!resultsSection.classList.contains('active')) {
    alert('请先执行自查分析');
    return;
  }

  let report = '【网文初稿自查检测报告】\n========================\n\n';

  report += '① 人设与剧情矛盾汇总\n--------------------\n';
  demoContradictions.forEach(function(item) {
    report += '[' + item.loc + '] ' + item.text + '\n';
  });

  report += '\n② 章节字数 & 节奏统计\n--------------------\n';
  demoChapters.forEach(function(ch) {
    report += ch.name + ' | 字数:' + ch.words + ' | 密度:' + ch.density + ' | 节奏:' + ch.pace + '\n';
  });

  report += '\n③ 灌水冗余段落标注\n--------------------\n';
  demoFillers.forEach(function(item) {
    report += '[' + item.loc + '] ' + item.text + '\n';
  });

  report += '\n④ 两种读者视角评价建议\n--------------------\n';
  report += '【追更读者视角】\n' + demoReaderSerial + '\n\n';
  report += '【完本读者视角】\n' + demoReaderComplete + '\n';

  report += '\n========================\n生成工具：网文初稿自查智能体（演示版）';

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(report).then(function() {
      alert('检测报告已复制到剪贴板');
    }).catch(function() {
      fallbackCopy(report);
    });
  } else {
    fallbackCopy(report);
  }
});

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    alert('检测报告已复制到剪贴板');
  } catch (err) {
    alert('复制失败，请手动复制');
  }
  document.body.removeChild(ta);
}
</script>
</body>
