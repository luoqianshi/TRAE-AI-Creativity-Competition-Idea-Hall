<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>乐理树</title>
  <style>
    :root {
      --bg: #f9f8f5;
      --card-bg: #ffffff;
      --text: #333333;
      --text-secondary: #666;
      --border: #e0d9cc;
      --accent: #4CAF70;
      --accent-light: #e8f5e9;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --radius: 12px;
      --space-xs: 0.5rem;
      --space-sm: 1rem;
      --space-md: 1.5rem;
      --space-lg: 2rem;
      --font-main: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --line-height: 1.6;
    }

    .dark-mode {
      --bg: #1a1a1a;
      --card-bg: #2d2d2d;
      --text: #f0f0f0;
      --text-secondary: #b0b0b0;
      --border: #444;
      --accent: #4CAF70;
      --accent-light: #2d5c42;
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg);
      color: var(--text);
      line-height: var(--line-height);
      padding: var(--space-sm);
      transition: background-color 0.3s, color 0.3s;
    }

    @media (min-width: 768px) {
      body {
        padding: var(--space-md) var(--space-lg);
      }
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: var(--space-lg);
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 700;
      margin-bottom: var(--space-xs);
      background: linear-gradient(90deg, var(--accent), #2e7d32);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: clamp(0.875rem, 3vw, 1rem);
      max-width: 600px;
      margin: 0 auto;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent-light);
      color: var(--accent);
      border: none;
      border-radius: 50px;
      padding: 0.4rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: var(--space-sm);
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      transform: scale(1.03);
      background: var(--accent);
      color: white;
    }

    .input-section {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: var(--space-md);
      box-shadow: var(--shadow);
      margin-bottom: var(--space-lg);
      border: 1px solid var(--border);
    }

    .input-label {
      display: block;
      margin-bottom: var(--space-xs);
      font-weight: 600;
      color: var(--text);
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-family: var(--font-main);
      font-size: 1rem;
      line-height: 1.5;
      resize: vertical;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(76, 175, 112, 0.2);
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: var(--space-sm);
      box-shadow: 0 2px 6px rgba(76, 175, 112, 0.25);
    }

    .btn:hover:not(:disabled) {
      background: #388e3c;
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(76, 175, 112, 0.35);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .tree-section {
      margin-top: var(--space-lg);
    }

    .tree-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: var(--space-md);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tree-title svg {
      width: 1.2rem;
      height: 1.2rem;
      fill: var(--accent);
    }

    .tree-container {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: var(--space-md);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .tree-root {
      margin-left: 0;
      list-style: none;
    }

    .tree-node {
      margin-bottom: var(--space-sm);
      position: relative;
      padding-left: 1.8rem;
    }

    .tree-node::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.8rem;
      width: 1rem;
      height: 1px;
      background: var(--border);
    }

    .tree-node::after {
      content: "•";
      position: absolute;
      left: 0.4rem;
      top: 0.4rem;
      font-size: 1.2rem;
      color: var(--accent);
      line-height: 1;
    }

    .tree-node-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      background: rgba(76, 175, 112, 0.06);
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .tree-node-header:hover {
      background: rgba(76, 175, 112, 0.12);
    }

    .tree-node-header.collapsed .arrow {
      transform: rotate(-90deg);
    }

    .arrow {
      width: 1rem;
      height: 1rem;
      fill: var(--accent);
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .tree-node-content {
      margin-top: var(--space-xs);
      padding-left: 1.5rem;
      border-left: 1px dashed var(--border);
      padding-bottom: var(--space-xs);
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .tree-node-content p {
      margin: 0.3rem 0;
    }

    .tree-node-content ul {
      padding-left: 1.2rem;
      margin-top: 0.3rem;
    }

    .highlight-mode .tree-node.highlighted {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(76, 175, 112, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(76, 175, 112, 0); }
      100% { box-shadow: 0 0 0 0 rgba(76, 175, 112, 0); }
    }

    .toggle-highlight {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(76, 175, 112, 0.1);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 0.3rem 0.8rem;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: var(--space-sm);
      transition: all 0.2s;
    }

    .toggle-highlight:hover:not(.active) {
      background: var(--accent);
      color: white;
    }

    .toggle-highlight.active {
      background: var(--accent);
      color: white;
    }

    .example-note {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: var(--space-sm);
      padding-top: var(--space-xs);
      border-top: 1px dashed var(--border);
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      h1 {
        font-size: 1.75rem;
      }
      .input-section, .tree-container {
        padding: var(--space-sm);
      }
      .tree-node {
        padding-left: 1.4rem;
      }
      .tree-node::after {
        left: 0.2rem;
      }
      .tree-node-header {
        padding: 0.4rem 0.6rem;
        font-size: 0.9rem;
      }
      .tree-node-content {
        padding-left: 1rem;
      }
    }

    /* Print-friendly */
    @media print {
      .theme-toggle, .toggle-highlight, .btn {
        display: none;
      }
      body {
        background: white;
        color: black;
        padding: 0;
      }
      .container {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>乐理树</h1>
      <p class="subtitle">粘贴一段乐理文字，3秒生成可展开/折叠的知识树</p>
      <button class="theme-toggle" id="themeToggle">
        <svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a.75.75 0 00-1.042-.853l-.208-.159a.75.75 0 011.042.853l.208.159zM21.75 12a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM17.834 18.894a.75.75 0 001.042.853l.208.159a.75.75 0 01-1.042.853l-.208-.159zM12 18a4.5 4.5 0 110-9 4.5 4.5 0 010 9zM7.758 17.303a.75.75 0 00-1.042.853l.208.159a.75.75 0 011.042-.853l-.208-.159zM6 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM6.046 6.162a.75.75 0 00-1.042-.853l-.208.159a.75.75 0 011.042.853l.208-.159z"/></svg>
        浅色模式
      </button>
    </header>

    <section class="input-section">
      <label class="input-label" for="inputText">粘贴你的乐理笔记（教材段落 / 课堂记录 / 自己写的疑问）</label>
      <textarea id="inputText" placeholder="例如：大调音阶由全全半全全全半构成，主音到属音是纯五度，属七和弦需解决到主和弦，避免平行五八度……">大调音阶由全全半全全全半构成。主音到属音是纯五度关系。属七和弦（如G7）包含根音、三音、五音、小七音，必须解决到主和弦（如C），其中七音下行二度到主和弦三音，三音上行二度到主和弦根音。转调常通过共同和弦实现，比如C大调与G大调共享G和弦（G-B-D）。</textarea>
      <button id="generateBtn" class="btn">生成知识树</button>
      <p class="example-note">💡 提示：输入50–200字效果最佳，支持中文乐理术语（调式、音程、和弦、节奏型等）</p>
    </section>

    <section class="tree-section">
      <h2 class="tree-title">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59.34-1 .98-1 1.7 0 2.21 1.71 4 4 4s4-1.79 4-4c0-.72-.41-1.36-1-1.7V3h-6z"/></svg>
        知识树（点击节点展开/收起）
      </h2>
      <div class="tree-container">
        <ul class="tree-root" id="treeRoot">
          <!-- 初始化为空，由JS填充 -->
        </ul>
      </div>
      <button class="toggle-highlight" id="highlightToggle">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        开启逻辑链高亮
      </button>
    </section>
  </div>

  <script>
    // 切换深色/浅色模式
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      body.classList.add('dark-mode');
      themeToggle.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a.75.75 0 00-1.042-.853l-.208-.159a.75.75 0 011.042.853l.208.159zM21.75 12a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM17.834 18.894a.75.75 0 001.042.853l.208.159a.75.75 0 01-1.042.853l-.208-.159zM12 18a4.5 4.5 0 110-9 4.5 4.5 0 010 9zM7.758 17.303a.75.75 0 00-1.042.853l.208.159a.75.75 0 011.042-.853l-.208-.159zM6 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM6.046 6.162a.75.75 0 00-1.042-.853l-.208.159a.75.75 0 011.042.853l.208-.159z"/></svg> 深色模式';
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      if (body.classList.contains('dark-mode')) {
        localStorage.setItem('theme', 'dark');
        themeToggle.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a.75.75 0 00-1.042-.853l-.208-.159a.75.75 0 011.042.853l.208.159zM21.75 12a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM17.834 18.894a.75.75 0 001.042.853l.208.159a.75.75 0 01-1.042.853l-.208-.159zM12 18a4.5 4.5 0 110-9 4.5 4.5 0 010 9zM7.758 17.303a.75.75 0 00-1.042.853l.208.159a.75.75 0 011.042-.853l-.208-.159zM6 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM6.046 6.162a.75.75 0 00-1.042-.853l-.208.159a.75.75 0 011.042.853l.208-.159z"/></svg> 深色模式';
      } else {
        localStorage.setItem('theme', 'light');
        themeToggle.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a.75.75 0 00-1.042-.853l-.208-.159a.75.75 0 011.042.853l.208.159zM21.75 12a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM17.834 18.894a.75.75 0 001.042.853l.208.159a.75.75 0 01-1.042.853l-.208-.159zM12 18a4.5 4.5 0 110-9 4.5 4.5 0 010 9zM7.758 17.303a.75.75 0 00-1.042.853l.208.159a.75.75 0 011.042-.853l-.208-.159zM6 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM6.046 6.162a.75.75 0 00-1.042-.853l-.208.159a.75.75 0 011.042.853l.208-.159z"/></svg> 浅色模式';
      }
    });

    // 模拟AI解析逻辑（轻量版，无真实API）
    function parseToTree(text) {
      // 简单关键词匹配 + 规则映射（模拟轻量NLP效果）
      const nodes = [];

      if (text.includes('大调音阶') || text.includes('全全半全全全半')) {
        nodes.push({
          title: "大调音阶",
          content: "由全音、全音、半音、全音、全音、全音、半音构成。",
          children: [
            {
              title: "主音与属音",
              content: "主音到属音为纯五度关系，是调性稳定性的核心。",
              children: []
            },
            {
              title: "音级功能",
              content: "Ⅰ级（主）、Ⅴ级（属）、Ⅳ级（下属）构成正三和弦。",
              children: []
            }
          ]
        });
      }

      if (text.includes('属七和弦') || text.includes('G7') || text.includes('解决到主和弦')) {
        nodes.push({
          title: "属七和弦",
          content: "由根音、大三度、纯五度、小七度构成（如G-B-D-F）。",
          children: [
            {
              title: "解决规则",
              content: "七音下行二度 → 主和弦三音；三音上行二度 → 主和弦根音。",
              children: []
            },
            {
              title: "不协和性来源",
              content: "小七度音程造成紧张感，驱动其向稳定和弦解决。",
              children: []
            }
          ]
        });
      }

      if (text.includes('转调') || text.includes('共同和弦')) {
        nodes.push({
          title: "转调",
          content: "从一个调平稳过渡到另一个调的过程。",
          children: [
            {
              title: "共同和弦法",
              content: "利用两调共有的和弦作中介（如C大调与G大调共享G和弦）。",
              children: []
            },
            {
              title: "离调和弦",
              content: "临时借用其他调的和弦（如重属和弦）制造色彩变化。",
              children: []
            }
          ]
        });
      }

      // 若无匹配，返回默认示意
      if (nodes.length === 0) {
        return [{
          title: "乐理概念",
          content: "请粘贴含调式、和弦、音程或节奏型描述的文本，例如：“小调有自然、和声、旋律三种形式”",
          children: []
        }];
      }

      return nodes;
    }

    // 渲染树节点（递归）
    function renderTreeNode(node, depth = 0) {
      const li = document.createElement('li');
      li.className = 'tree-node';
      if (depth > 0) {
        li.style.paddingLeft = `${1.8 + depth * 1.2}rem`;
      }

      const header = document.createElement('div');
      header.className = 'tree-node-header';
      header.innerHTML = `
        <svg class="arrow" viewBox="0 0 24 24"><path fill="currentColor" d="M8.12 9.29 13.5 14l-5.38-4.71z"/></svg>
        <span>${node.title}</span>
      `;

      const contentDiv = document.createElement('div');
      contentDiv.className = 'tree-node-content';
      contentDiv.innerHTML = `<p>${node.content}</p>`;
      if (node.children && node.children.length > 0) {
        const ul = document.createElement('ul');
        node.children.forEach(child => {
          ul.appendChild(renderTreeNode(child, depth + 1));
        });
        contentDiv.appendChild(ul);
      }

      li.appendChild(header);
      li.appendChild(contentDiv);

      // 折叠/展开逻辑
      header.addEventListener('click', () => {
        const isCollapsed = contentDiv.style.display === 'none' || contentDiv.style.display === '';
        contentDiv.style.display = isCollapsed ? 'block' : 'none';
        header.classList.toggle('collapsed', !isCollapsed);
      });

      return li;
    }

    // 高亮逻辑链
    const highlightToggle = document.getElementById('highlightToggle');
    let isHighlightMode = false;
    highlightToggle.addEventListener('click', () => {
      isHighlightMode = !isHighlightMode;
      highlightToggle.classList.toggle('active', isHighlightMode);
      document.body.classList.toggle('highlight-mode', isHighlightMode);
    });

    // 绑定高亮悬停事件（仅在高亮模式下生效）
    document.addEventListener('DOMContentLoaded', () => {
      const treeRoot = document.getElementById('treeRoot');
      const inputText = document.getElementById('inputText');
      const generateBtn = document.getElementById('generateBtn');

      // 初始生成
      function generateTree() {
        const text = inputText.value.trim();
        if (!text) return;

        const nodes = parseToTree(text);
        treeRoot.innerHTML = '';
        nodes.forEach(node => {
          treeRoot.appendChild(renderTreeNode(node));
        });

        // 添加悬停高亮逻辑（只在高亮模式开启时绑定）
        if (isHighlightMode) {
          const headers = document.querySelectorAll('.tree-node-header');
          headers.forEach(header => {
            header.addEventListener('mouseenter', function() {
              const targetTitle = this.querySelector('span').textContent.trim();

              // 移除之前高亮
              document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('highlighted'));

              // 查找所有含该关键词的节点（粗略匹配）
              const allNodes = document.querySelectorAll('.tree-node-header span');
              allNodes.forEach(span => {
                const title = span.textContent.trim();
                if (
                  title.includes(targetTitle) ||
                  targetTitle.includes(title) ||
                  title.toLowerCase().includes(targetTitle.toLowerCase()) ||
                  targetTitle.toLowerCase().includes(title.toLowerCase())
                ) {
                  span.closest('.tree-node').classList.add('highlighted');
                }
              });
            });

            header.addEventListener('mouseleave', () => {
              document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('highlighted'));
            });
          });
        }
      }

      generateBtn.addEventListener('click', generateTree);

      // 页面加载后立即生成一次示例
      generateTree();

      // 支持回车生成（非空时）
      inputText.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.ctrlKey) {
          e.preventDefault();
          generateTree();
        }
      });
    });
  </script>
</body>
</html>
