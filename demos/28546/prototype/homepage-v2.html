<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>耗材中心 - 简洁卡片版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #F5F5F3;
            --bg-card: #FFFFFF;
            --accent: #5B7B5A;
            --text-primary: #1A1A1A;
            --text-secondary: #6B6B6B;
            --text-tertiary: #ABABAB;
            --border: #EBEBEB;
            --danger: #D4736A;
            --warning: #C9A574;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .phone-frame {
            width: 390px;
            height: 844px;
            background: var(--bg-primary);
            border-radius: 40px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .page {
            height: 100%;
            overflow-y: auto;
            padding: 60px 20px 120px;
        }

        /* 导航 */
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .nav-title {
            font-size: 26px;
            font-weight: 700;
        }

        .nav-add {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 300;
        }

        /* 概览 */
        .overview {
            background: var(--accent);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 24px;
            color: white;
        }

        .overview-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .overview-main {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .overview-num {
            font-size: 48px;
            font-weight: 700;
            line-height: 1;
        }

        .overview-label {
            font-size: 15px;
            opacity: 0.9;
        }

        .overview-stats {
            display: flex;
            gap: 20px;
        }

        .overview-stat {
            text-align: right;
        }

        .overview-stat-num {
            font-size: 16px;
            font-weight: 600;
        }

        .overview-stat-label {
            font-size: 11px;
            opacity: 0.7;
        }

        /* 列表标题 */
        .section-title {
            font-size: 12px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            margin-top: 24px;
        }

        /* 卡片 */
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            overflow: hidden;
        }

        /* 左侧状态条 */
        .card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
        }

        .card.urgent::before { background: var(--danger); }
        .card.warning::before { background: var(--warning); }
        .card.normal::before { background: var(--accent); }

        .card-icon {
            font-size: 26px;
            flex-shrink: 0;
            line-height: 1;
        }

        .card-info {
            flex: 1;
            min-width: 0;
        }

        .card-name {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .card-right {
            text-align: right;
            flex-shrink: 0;
        }

        .card-days {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .card.urgent .card-days { color: var(--danger); }
        .card.warning .card-days { color: var(--warning); }
        .card.normal .card-days { color: var(--accent); }

        .card-days-label {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .card-price {
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .card-price span {
            color: var(--accent);
            font-weight: 500;
        }

        /* 底部导航 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 12px 0 36px;
            display: flex;
            justify-content: space-around;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-tertiary);
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-item-icon {
            width: 22px;
            height: 22px;
        }

        .nav-item-label {
            font-size: 10px;
        }

        /* SVG 图标样式 */
        .icon-line {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="page">
            <!-- 导航 -->
            <div class="nav">
                <h1 class="nav-title">耗材</h1>
                <div class="nav-add">+</div>
            </div>

            <!-- 概览 -->
            <div class="overview">
                <div class="overview-row">
                    <div class="overview-main">
                        <div class="overview-num">2</div>
                        <div class="overview-label">个需要关注</div>
                    </div>
                    <div class="overview-stats">
                        <div class="overview-stat">
                            <div class="overview-stat-num">3</div>
                            <div class="overview-stat-label">历史低价</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 需要关注的列表 -->
            <div class="section-title">需要关注</div>

            <div class="card urgent">
                <div class="card-icon">🪥</div>
                <div class="card-info">
                    <div class="card-name">舒适达牙膏</div>
                    <div class="card-meta">100g · 已用完</div>
                </div>
                <div class="card-right">
                    <div class="card-days">已用完</div>
                    <div class="card-price">上次 <span>¥35</span></div>
                </div>
            </div>

            <div class="card warning">
                <div class="card-icon">🧼</div>
                <div class="card-info">
                    <div class="card-name">多芬沐浴露</div>
                    <div class="card-meta">300ml</div>
                </div>
                <div class="card-right">
                    <div class="card-days">5天</div>
                    <div class="card-price"><span>¥42</span> · 历史最低</div>
                </div>
            </div>

            <!-- 正常的列表 -->
            <div class="section-title">正常使用</div>

            <div class="card normal">
                <div class="card-icon">🧴</div>
                <div class="card-info">
                    <div class="card-name">海飞丝洗发水</div>
                    <div class="card-meta">200ml · 宝洁</div>
                </div>
                <div class="card-right">
                    <div class="card-days">28天</div>
                    <div class="card-price"><span>¥35</span> · 历史最低</div>
                </div>
            </div>

            <div class="card normal">
                <div class="card-icon">✨</div>
                <div class="card-info">
                    <div class="card-name">SK-II 神仙水</div>
                    <div class="card-meta">200ml</div>
                </div>
                <div class="card-right">
                    <div class="card-days">35天</div>
                    <div class="card-price"><span>¥640</span> · 历史最低</div>
                </div>
            </div>

            <div class="card normal">
                <div class="card-icon">🧽</div>
                <div class="card-info">
                    <div class="card-name">洗洁精</div>
                    <div class="card-meta">500ml</div>
                </div>
                <div class="card-right">
                    <div class="card-days">60天</div>
                    <div class="card-price"><span>¥15</span></div>
                </div>
            </div>

            <div class="card normal">
                <div class="card-icon">🧻</div>
                <div class="card-info">
                    <div class="card-name">卷纸</div>
                    <div class="card-meta">12卷</div>
                </div>
                <div class="card-right">
                    <div class="card-days">90天</div>
                    <div class="card-price"><span>¥28</span></div>
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <div class="nav-item-icon">
                    <svg class="icon-line" viewBox="0 0 24 24">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </div>
                <span class="nav-item-label">首页</span>
            </div>
            <div class="nav-item">
                <div class="nav-item-icon">
                    <svg class="icon-line" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M3 9h18"/>
                        <path d="M9 21V9"/>
                    </svg>
                </div>
                <span class="nav-item-label">分类</span>
            </div>
            <div class="nav-item">
                <div class="nav-item-icon">
                    <svg class="icon-line" viewBox="0 0 24 24">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </div>
                <span class="nav-item-label">添加</span>
            </div>
            <div class="nav-item">
                <div class="nav-item-icon">
                    <svg class="icon-line" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                </div>
                <span class="nav-item-label">统计</span>
            </div>
            <div class="nav-item">
                <div class="nav-item-icon">
                    <svg class="icon-line" viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <span class="nav-item-label">我的</span>
            </div>
        </div>
    </div>
</body>
</html>
