<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>耗材</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FAFAFA;
            --bg-card: #FFFFFF;
            --accent: #2D9B8E;
            --text-primary: #1A1A1A;
            --text-secondary: #6B6B6B;
            --text-tertiary: #C5C5C5;
            --border: #EEEEEE;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .phone-frame {
            width: 390px;
            height: 844px;
            background: var(--bg-primary);
            border-radius: 40px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .page {
            height: 100%;
            overflow-y: auto;
            padding: 60px 24px 120px;
        }

        /* 标题 */
        .header {
            margin-bottom: 40px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-tertiary);
            margin-top: 6px;
        }

        /* 分类 */
        .category {
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 12px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        /* 商品项 */
        .item {
            display: flex;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-icon {
            font-size: 24px;
            margin-right: 14px;
            opacity: 0.8;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .item-meta {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .item-right {
            text-align: right;
        }

        .item-days {
            font-size: 15px;
            color: var(--text-secondary);
        }

        .item-days-unit {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        /* 间隔 */
        .spacer {
            height: 40px;
        }

        /* 底部导航 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 16px 0 40px;
            display: flex;
            justify-content: space-around;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-tertiary);
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-item-icon {
            width: 22px;
            height: 22px;
        }

        .nav-item-label {
            font-size: 10px;
        }

        .icon-line {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="page">
            <!-- 标题 -->
            <div class="header">
                <h1 class="title">耗材</h1>
                <p class="subtitle">知道自己有什么</p>
            </div>

            <!-- 洗护类 -->
            <div class="category">
                <div class="category-title">洗护</div>

                <div class="item">
                    <span class="item-icon">🧴</span>
                    <div class="item-info">
                        <div class="item-name">海飞丝去屑洗发水</div>
                        <div class="item-meta">200ml</div>
                    </div>
                    <div class="item-right">
                        <div class="item-days">28 天</div>
                        <div class="item-days-unit">剩余</div>
                    </div>
                </div>

                <div class="item">
                    <span class="item-icon">🧼</span>
                    <div class="item-info">
                        <div class="item-name">多芬沐浴露</div>
                        <div class="item-meta">300ml</div>
                    </div>
                    <div class="item-right">
                        <div class="item-days">5 天</div>
                        <div class="item-days-unit">剩余</div>
                    </div>
                </div>

                <div class="item">
                    <span class="item-icon">🪥</span>
                    <div class="item-info">
                        <div class="item-name">舒适达牙膏</div>
                        <div class="item-meta">100g</div>
                    </div>
                    <div class="item-right">
                        <div class="item-days">快用完了</div>
                        <div class="item-days-unit">记得补</div>
                    </div>
                </div>
            </div>

            <!-- 护肤类 -->
            <div class="category">
                <div class="category-title">护肤</div>

                <div class="item">
                    <span class="item-icon">✨</span>
                    <div class="item-info">
                        <div class="item-name">SK-II 神仙水</div>
                        <div class="item-meta">200ml</div>
                    </div>
                    <div class="item-right">
                        <div class="item-days">35 天</div>
                        <div class="item-days-unit">剩余</div>
                    </div>
                </div>

                <div class="item">
                    <span class="item-icon">💧</span>
                    <div class="item-info">
                        <div class="item-name">精华液</div>
                        <div class="item-meta">30ml</div>
                    </div>
                    <div class="item-right">
                        <div class="item-days">42 天</div>
                        <div class="item-days-unit">剩余</div>
                    </div>
                </div>
            </div>

            <!-- 清洁类 -->
            <div class="category">
                <div class="category-title">清洁</div>

                <div class="item">
                    <span class="item-icon">🧽</span>
                    <div class="item-info">
                        <div class="item-name">洗洁精</div>
                        <div class="item-meta">500ml</div>
                    </div>
                    <div class="item-right">
                        <div class="item-days">60 天</div>
                        <div class="item-days-unit">剩余</div>
                    </div>
                </div>

                <div class="item">
                    <span class="item-icon">🧻</span>
                    <div class="item-info">
                        <div class="item-name">卷纸</div>
                        <div class="item-meta">12卷</div>
                    </div>
                    <div class="item-right">
                        <div class="item-days">90 天</div>
                        <div class="item-days-unit">剩余</div>
                    </div>
                </div>
            </div>

            <div class="spacer"></div>
        </div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <div class="nav-item-icon">
                    <svg class="icon-line" viewBox="0 0 24 24">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </div>
                <span class="nav-item-label">首页</span>
            </div>
            <div class="nav-item">
                <div class="nav-item-icon">
                    <svg class="icon-line" viewBox="0 0 24 24">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </div>
                <span class="nav-item-label">添加</span>
            </div>
            <div class="nav-item">
                <div class="nav-item-icon">
                    <svg class="icon-line" viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <span class="nav-item-label">我的</span>
            </div>
        </div>
    </div>
</body>
</html>
