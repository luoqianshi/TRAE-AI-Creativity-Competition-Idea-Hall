<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>耗材中心 - 极简版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 极简配色：只用一个强调色 */
            --bg-primary: #FAFAFA;
            --bg-card: #FFFFFF;
            --accent: #5B7B5A;
            --text-primary: #1A1A1A;
            --text-secondary: #6B6B6B;
            --text-tertiary: #ABABAB;
            --border: #EBEBEB;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        .phone-frame {
            width: 390px;
            height: 844px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 0;
            margin: 40px auto;
            overflow: hidden;
            position: relative;
        }

        .page {
            height: 100%;
            overflow-y: auto;
            padding: 60px 24px 120px;
        }

        /* 导航 */
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
        }

        .nav-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .nav-add {
            color: var(--accent);
            font-size: 32px;
            font-weight: 300;
        }

        /* 概览 */
        .overview {
            margin-bottom: 40px;
        }

        .overview-num {
            font-size: 56px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }

        .overview-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        /* 列表 */
        .list-title {
            font-size: 12px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .item {
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }

        .item-name {
            font-size: 17px;
            font-weight: 500;
        }

        .item-days {
            font-size: 15px;
            color: var(--text-secondary);
        }

        .item-meta {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .item-price {
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .item-price span {
            color: var(--accent);
        }

        /* 底部导航 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 16px 0 40px;
            display: flex;
            justify-content: space-around;
        }

        .nav-item {
            text-align: center;
            color: var(--text-tertiary);
            font-size: 10px;
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-icon {
            font-size: 22px;
            margin-bottom: 4px;
        }

        /* 状态标签（简洁版） */
        .status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            background: #F5F5F5;
            color: var(--text-tertiary);
        }

        .status.urgent {
            background: #FFF5F5;
            color: #C97B7B;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="page">
            <!-- 导航 -->
            <div class="nav">
                <h1 class="nav-title">耗材</h1>
                <span class="nav-add">+</span>
            </div>

            <!-- 概览 -->
            <div class="overview">
                <div class="overview-num">2</div>
                <div class="overview-label">个需要关注</div>
            </div>

            <!-- 需要关注的列表 -->
            <div class="list-title">需要关注</div>
            
            <div class="item">
                <div class="item-header">
                    <span class="item-name">舒适达牙膏</span>
                    <span class="item-days" style="color: #C97B7B;">已用完</span>
                </div>
                <div class="item-meta">100g · 葛兰素史克</div>
                <div class="item-price">上次 <span>¥35</span> (¥0.35/g)</div>
            </div>

            <div class="item">
                <div class="item-header">
                    <span class="item-name">多芬沐浴露</span>
                    <span class="item-days">5 天</span>
                </div>
                <div class="item-meta">300ml · 联合利华</div>
                <div class="item-price">上次 <span>¥42</span> (¥0.14/ml) · <span>历史最低</span></div>
            </div>

            <!-- 正常的列表 -->
            <div class="list-title" style="margin-top: 40px;">正常使用</div>

            <div class="item">
                <div class="item-header">
                    <span class="item-name">海飞丝洗发水</span>
                    <span class="item-days">28 天</span>
                </div>
                <div class="item-meta">200ml · 宝洁</div>
                <div class="item-price">上次 <span>¥35</span> (¥0.175/ml) · <span>历史最低</span></div>
            </div>

            <div class="item">
                <div class="item-header">
                    <span class="item-name">SK-II 神仙水</span>
                    <span class="item-days">35 天</span>
                </div>
                <div class="item-meta">200ml</div>
                <div class="item-price">上次 <span>¥640</span> (¥3.2/ml) · <span>历史最低</span></div>
            </div>

            <div class="item">
                <div class="item-header">
                    <span class="item-name">洗洁精</span>
                    <span class="item-days">60 天</span>
                </div>
                <div class="item-meta">500ml</div>
                <div class="item-price">上次 <span>¥15</span> (¥0.03/ml)</div>
            </div>

            <div class="item">
                <div class="item-header">
                    <span class="item-name">卷纸</span>
                    <span class="item-days">90 天</span>
                </div>
                <div class="item-meta">12卷</div>
                <div class="item-price">上次 <span>¥28</span> (¥2.3/卷)</div>
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <div class="nav-icon">🏠</div>
                <div>首页</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">📊</div>
                <div>统计</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">📦</div>
                <div>记录</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">👤</div>
                <div>我的</div>
            </div>
        </div>
    </div>
</body>
</html>
