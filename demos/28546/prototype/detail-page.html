<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>详情页</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FAFAFA;
            --bg-card: #FFFFFF;
            --accent: #2D9B8E;
            --accent-light: #E8F5F3;
            --text-primary: #1A1A1A;
            --text-secondary: #6B6B6B;
            --text-tertiary: #C5C5C5;
            --border: #EEEEEE;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .phone-frame {
            width: 390px;
            height: 844px;
            background: var(--bg-primary);
            border-radius: 40px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .page {
            height: 100%;
            overflow-y: auto;
            padding: 60px 20px 120px;
            scrollbar-width: none;
        }

        .page::-webkit-scrollbar {
            display: none;
        }

        /* 卡片 */
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        /* 商品信息 */
        .product-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .product-icon {
            font-size: 40px;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .product-meta {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        /* 状态概览 */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .status-item {
            text-align: center;
            padding: 12px;
            background: var(--bg-primary);
            border-radius: 8px;
        }

        .status-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .status-value.accent {
            color: var(--accent);
        }

        .status-label {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        /* 区块标题 */
        .section-title {
            font-size: 12px;
            color: var(--text-tertiary);
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            margin-top: 24px;
        }

        /* 使用记录 - 当前使用中 */
        .usage-current {
            padding: 16px;
            margin-bottom: 4px;
        }

        .usage-current-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .usage-current-label {
            font-size: 15px;
            font-weight: 500;
        }

        .usage-current-badge {
            font-size: 12px;
            color: var(--accent);
            padding: 3px 10px;
            background: var(--accent-light);
            border-radius: 12px;
        }

        .usage-details {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
        }

        .usage-detail-item {
            display: flex;
            flex-direction: column;
        }

        .usage-detail-value {
            font-size: 14px;
            font-weight: 500;
        }

        .usage-detail-label {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        /* 标记用完区域 */
        .finish-section {
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }

        .finish-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            padding: 4px 0;
        }

        .finish-toggle-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .finish-toggle-arrow {
            font-size: 12px;
            color: var(--text-tertiary);
            transition: transform 0.2s;
        }

        .finish-toggle-arrow.open {
            transform: rotate(90deg);
        }

        .finish-form {
            margin-top: 16px;
        }

        .finish-date-picker {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-primary);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 16px;
        }

        .picker-column {
            flex: 1;
            text-align: center;
            position: relative;
        }

        .picker-column::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 16px;
            background: var(--border);
        }

        .picker-column:last-child::after {
            display: none;
        }

        .picker-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .picker-label {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        .picker-dim {
            font-size: 13px;
            color: var(--text-tertiary);
            margin-top: 3px;
        }

        .finish-result {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--accent-light);
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .finish-result-left {
            display: flex;
            flex-direction: column;
        }

        .finish-result-label {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-bottom: 2px;
        }

        .finish-result-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
        }

        .finish-result-compare {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .finish-result-compare span {
            font-weight: 600;
            color: var(--text-primary);
        }

        .btn-confirm {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        /* 使用记录 - 历史 */
        .usage-history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }

        .usage-history-item:last-child {
            border-bottom: none;
        }

        .usage-history-left {
            display: flex;
            flex-direction: column;
        }

        .usage-history-label {
            font-size: 14px;
            font-weight: 500;
        }

        .usage-history-date {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        .usage-history-days {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* 购买记录 */
        .purchase-item {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }

        .purchase-item:last-child {
            border-bottom: none;
        }

        .purchase-date {
            width: 50px;
            text-align: center;
        }

        .purchase-date-month {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .purchase-date-day {
            font-size: 18px;
            font-weight: 600;
        }

        .purchase-info {
            flex: 1;
            padding: 0 12px;
        }

        .purchase-spec {
            font-size: 14px;
            font-weight: 500;
        }

        .purchase-price {
            text-align: right;
        }

        .purchase-price-value {
            font-size: 15px;
            font-weight: 600;
        }

        .purchase-price-unit {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .purchase-average {
            text-align: center;
            padding-top: 12px;
            margin-top: 4px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-secondary);
        }

        .purchase-average span {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* 底部操作 */
        .bottom-action {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 20px 40px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        /* 底部导航 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 12px 0 36px;
            display: flex;
            justify-content: space-around;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-tertiary);
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-item-icon {
            width: 22px;
            height: 22px;
        }

        .nav-item-label {
            font-size: 10px;
        }

        .icon-line {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="page">
            <!-- 商品信息卡片 -->
            <div class="card">
                <div class="product-header">
                    <div class="product-icon">🧴</div>
                    <div class="product-info">
                        <div class="product-name">海飞丝去屑洗发水</div>
                        <div class="product-meta">宝洁 · 洗护</div>
                    </div>
                </div>

                <div class="status-grid">
                    <div class="status-item">
                        <div class="status-value">28</div>
                        <div class="status-label">天剩余</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value accent">¥0.175</div>
                        <div class="status-label">最低单价</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value">3</div>
                        <div class="status-label">购买次数</div>
                    </div>
                </div>
            </div>

            <!-- 使用记录 -->
            <div class="section-title">使用记录</div>
            <div class="card">
                <!-- 当前使用中 -->
                <div class="usage-current">
                    <div class="usage-current-header">
                        <span class="usage-current-label">第2瓶</span>
                        <span class="usage-current-badge">使用中</span>
                    </div>
                    <div class="usage-details">
                        <div class="usage-detail-item">
                            <span class="usage-detail-value">2024.04.12</span>
                            <span class="usage-detail-label">开封日期</span>
                        </div>
                        <div class="usage-detail-item">
                            <span class="usage-detail-value">一天一次</span>
                            <span class="usage-detail-label">使用频率</span>
                        </div>
                        <div class="usage-detail-item">
                            <span class="usage-detail-value">46 天</span>
                            <span class="usage-detail-label">已使用</span>
                        </div>
                    </div>

                    <!-- 标记用完（内嵌） -->
                    <div class="finish-section">
                        <div class="finish-toggle" onclick="toggleFinish()">
                            <span class="finish-toggle-text">标记用完</span>
                            <span class="finish-toggle-arrow" id="finishArrow">›</span>
                        </div>
                        <div class="finish-form" id="finishForm" style="display: none;">
                            <div class="finish-date-picker">
                                <div class="picker-column">
                                    <div class="picker-dim">2023</div>
                                    <div class="picker-value">2024</div>
                                    <div class="picker-dim">2025</div>
                                    <div class="picker-label">年</div>
                                </div>
                                <div class="picker-column">
                                    <div class="picker-dim">4</div>
                                    <div class="picker-value">5</div>
                                    <div class="picker-dim">6</div>
                                    <div class="picker-label">月</div>
                                </div>
                                <div class="picker-column">
                                    <div class="picker-dim">26</div>
                                    <div class="picker-value">27</div>
                                    <div class="picker-dim">28</div>
                                    <div class="picker-label">日</div>
                                </div>
                            </div>
                            <div class="finish-result">
                                <div class="finish-result-left">
                                    <span class="finish-result-label">本次使用周期</span>
                                    <span class="finish-result-value">46 天</span>
                                </div>
                                <div class="finish-result-compare">
                                    上一次 <span>76 天</span><br>本次更快
                                </div>
                            </div>
                            <button class="btn-confirm">确认</button>
                        </div>
                    </div>
                </div>

                <!-- 历史使用记录 -->
                <div class="usage-history-item">
                    <div class="usage-history-left">
                        <span class="usage-history-label">第1瓶</span>
                        <span class="usage-history-date">2024.01.08 - 2024.03.24</span>
                    </div>
                    <span class="usage-history-days">76 天</span>
                </div>
            </div>

            <!-- 购买记录 -->
            <div class="section-title">购买记录</div>
            <div class="card">
                <div class="purchase-item">
                    <div class="purchase-date">
                        <div class="purchase-date-month">5月</div>
                        <div class="purchase-date-day">15</div>
                    </div>
                    <div class="purchase-info">
                        <div class="purchase-spec">200ml</div>
                    </div>
                    <div class="purchase-price">
                        <div class="purchase-price-value">¥35</div>
                        <div class="purchase-price-unit">¥0.175</div>
                    </div>
                </div>
                <div class="purchase-item">
                    <div class="purchase-date">
                        <div class="purchase-date-month">3月</div>
                        <div class="purchase-date-day">22</div>
                    </div>
                    <div class="purchase-info">
                        <div class="purchase-spec">200ml</div>
                    </div>
                    <div class="purchase-price">
                        <div class="purchase-price-value">¥42</div>
                        <div class="purchase-price-unit">¥0.210</div>
                    </div>
                </div>
                <div class="purchase-item">
                    <div class="purchase-date">
                        <div class="purchase-date-month">1月</div>
                        <div class="purchase-date-day">08</div>
                    </div>
                    <div class="purchase-info">
                        <div class="purchase-spec">200ml</div>
                    </div>
                    <div class="purchase-price">
                        <div class="purchase-price-value">¥38</div>
                        <div class="purchase-price-unit">¥0.190</div>
                    </div>
                </div>
                <div class="purchase-average">
                    平均单价 <span>¥0.192</span>
                </div>
            </div>
        </div>

        <!-- 底部操作 -->
        <div class="bottom-action">
            <button class="btn-primary">记录本次购买</button>
        </div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item">
                <div class="nav-item-icon">
                    <svg class="icon-line" viewBox="0 0 24 24">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </div>
                <span class="nav-item-label">首页</span>
            </div>
            <div class="nav-item">
                <div class="nav-item-icon">
                    <svg class="icon-line" viewBox="0 0 24 24">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </div>
                <span class="nav-item-label">添加</span>
            </div>
            <div class="nav-item">
                <div class="nav-item-icon">
                    <svg class="icon-line" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                </div>
                <span class="nav-item-label">统计</span>
            </div>
        </div>
    </div>

    <script>
        function toggleFinish() {
            const form = document.getElementById('finishForm');
            const arrow = document.getElementById('finishArrow');
            if (form.style.display === 'none') {
                form.style.display = 'block';
                arrow.classList.add('open');
            } else {
                form.style.display = 'none';
                arrow.classList.remove('open');
            }
        }
    </script>
</body>
</html>
