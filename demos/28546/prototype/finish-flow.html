<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>标记用完</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FAFAFA;
            --bg-card: #FFFFFF;
            --accent: #2D9B8E;
            --text-primary: #1A1A1A;
            --text-secondary: #6B6B6B;
            --text-tertiary: #C5C5C5;
            --border: #EEEEEE;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .phone-frame {
            width: 390px;
            height: 844px;
            background: var(--bg-primary);
            border-radius: 40px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .page {
            height: 100%;
            overflow-y: auto;
            padding: 60px 24px 120px;
        }

        /* 导航 */
        .nav {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .nav-close {
            font-size: 24px;
            color: var(--text-tertiary);
            margin-right: 16px;
            cursor: pointer;
            line-height: 1;
        }

        .nav-title {
            font-size: 20px;
            font-weight: 600;
        }

        /* 商品信息卡片 */
        .product-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .product-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
        }

        .product-spec {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* 使用信息 */
        .usage-info {
            margin-bottom: 32px;
        }

        .usage-row {
            display: flex;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .usage-row:last-child {
            border-bottom: none;
        }

        .usage-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .usage-value {
            font-size: 14px;
            font-weight: 500;
        }

        /* 日期滚轮 */
        .form-group {
            margin-bottom: 32px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            color: var(--text-tertiary);
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .date-picker {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px 20px;
            border: 1px solid var(--border);
        }

        .picker-column {
            flex: 1;
            text-align: center;
            position: relative;
        }

        .picker-column::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 20px;
            background: var(--border);
        }

        .picker-column:last-child::after {
            display: none;
        }

        .picker-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .picker-label {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        .picker-dim {
            font-size: 14px;
            color: var(--text-tertiary);
            margin-top: 4px;
        }

        /* 结果预览 */
        .result {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            margin-top: 32px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .result-label {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--accent);
        }

        .result-unit {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .result-compare {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-secondary);
        }

        .result-compare span {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* 底部按钮 */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 16px 24px 40px;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="page">
            <!-- 导航 -->
            <div class="nav">
                <span class="nav-close">×</span>
                <span class="nav-title">标记用完</span>
            </div>

            <!-- 商品信息 -->
            <div class="product-card">
                <div class="product-icon">🧴</div>
                <div class="product-info">
                    <div class="product-name">海飞丝去屑洗发水</div>
                    <div class="product-spec">200ml · 第2瓶</div>
                </div>
            </div>

            <!-- 使用信息 -->
            <div class="usage-info">
                <div class="usage-row">
                    <span class="usage-label">开封日期</span>
                    <span class="usage-value">2024年4月12日</span>
                </div>
                <div class="usage-row">
                    <span class="usage-label">使用频率</span>
                    <span class="usage-value">一天一次</span>
                </div>
                <div class="usage-row">
                    <span class="usage-label">已使用</span>
                    <span class="usage-value">46 天</span>
                </div>
            </div>

            <!-- 用完日期 -->
            <div class="form-group">
                <label class="form-label">用完日期</label>
                <div class="date-picker">
                    <div class="picker-column">
                        <div class="picker-dim">2023</div>
                        <div class="picker-value">2024</div>
                        <div class="picker-dim">2025</div>
                        <div class="picker-label">年</div>
                    </div>
                    <div class="picker-column">
                        <div class="picker-dim">4</div>
                        <div class="picker-value">5</div>
                        <div class="picker-dim">6</div>
                        <div class="picker-label">月</div>
                    </div>
                    <div class="picker-column">
                        <div class="picker-dim">26</div>
                        <div class="picker-value">27</div>
                        <div class="picker-dim">28</div>
                        <div class="picker-label">日</div>
                    </div>
                </div>
            </div>

            <!-- 结果预览 -->
            <div class="result">
                <div class="result-label">本次使用周期</div>
                <div class="result-value">46 天</div>
                <div class="result-unit">从开封到用完</div>
                <div class="result-compare">
                    上一次 <span>76 天</span>，本次更快
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="bottom-bar">
            <button class="btn-primary">确认</button>
        </div>
    </div>
</body>
</html>
