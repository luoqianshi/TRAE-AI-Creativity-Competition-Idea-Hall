<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>记录购买</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FAFAFA;
            --bg-card: #FFFFFF;
            --accent: #2D9B8E;
            --text-primary: #1A1A1A;
            --text-secondary: #6B6B6B;
            --text-tertiary: #C5C5C5;
            --border: #EEEEEE;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .phone-frame {
            width: 390px;
            height: 844px;
            background: var(--bg-primary);
            border-radius: 40px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .page {
            height: 100%;
            overflow-y: auto;
            padding: 60px 24px 120px;
        }

        /* 导航 */
        .nav {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .nav-close {
            font-size: 24px;
            color: var(--text-tertiary);
            margin-right: 16px;
            cursor: pointer;
            line-height: 1;
        }

        .nav-title {
            font-size: 20px;
            font-weight: 600;
        }

        /* 表单 */
        .form-group {
            margin-bottom: 32px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            color: var(--text-tertiary);
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .form-input {
            width: 100%;
            padding: 14px 0;
            border: none;
            border-bottom: 1px solid var(--border);
            background: transparent;
            font-size: 18px;
            font-weight: 500;
            color: var(--text-primary);
            outline: none;
            font-family: inherit;
        }

        .form-input::placeholder {
            color: var(--text-tertiary);
            font-weight: 400;
        }

        .form-input:focus {
            border-bottom-color: var(--accent);
        }

        /* 历史商品标签 */
        .history-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .history-tag {
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            transition: all 0.15s;
        }

        .history-tag:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* 价格和容量 */
        .price-row {
            display: flex;
            gap: 24px;
        }

        .price-row .form-group {
            flex: 1;
        }

        /* 日期滚轮 */
        .date-picker {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px 20px;
            border: 1px solid var(--border);
        }

        .picker-column {
            flex: 1;
            text-align: center;
            position: relative;
        }

        .picker-column::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 20px;
            background: var(--border);
        }

        .picker-column:last-child::after {
            display: none;
        }

        .picker-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .picker-label {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        .picker-dim {
            font-size: 14px;
            color: var(--text-tertiary);
            margin-top: 4px;
        }

        /* 单价预览 */
        .preview {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-top: 40px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-left {
            display: flex;
            flex-direction: column;
        }

        .preview-label {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-bottom: 4px;
        }

        .preview-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
        }

        .preview-hint {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        /* 底部按钮 */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 16px 24px 40px;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="page">
            <!-- 导航 -->
            <div class="nav">
                <span class="nav-close">×</span>
                <span class="nav-title">记录购买</span>
            </div>

            <!-- 商品名称 -->
            <div class="form-group">
                <label class="form-label">商品名称</label>
                <input type="text" class="form-input" placeholder="输入商品名称" value="海飞丝去屑洗发水">
                <div class="history-tags">
                    <div class="history-tag">海飞丝洗发水</div>
                    <div class="history-tag">多芬沐浴露</div>
                    <div class="history-tag">SK-II 神仙水</div>
                    <div class="history-tag">舒适达牙膏</div>
                    <div class="history-tag">洗洁精</div>
                </div>
            </div>

            <!-- 价格和容量 -->
            <div class="price-row">
                <div class="form-group">
                    <label class="form-label">价格</label>
                    <input type="text" class="form-input" placeholder="¥0" value="35">
                </div>
                <div class="form-group">
                    <label class="form-label">容量</label>
                    <input type="text" class="form-input" placeholder="0" value="200">
                </div>
            </div>

            <!-- 购买日期 -->
            <div class="form-group">
                <label class="form-label">购买日期</label>
                <div class="date-picker">
                    <div class="picker-column">
                        <div class="picker-dim">2023</div>
                        <div class="picker-value">2024</div>
                        <div class="picker-dim">2025</div>
                        <div class="picker-label">年</div>
                    </div>
                    <div class="picker-column">
                        <div class="picker-dim">4</div>
                        <div class="picker-value">5</div>
                        <div class="picker-dim">6</div>
                        <div class="picker-label">月</div>
                    </div>
                    <div class="picker-column">
                        <div class="picker-dim">26</div>
                        <div class="picker-value">27</div>
                        <div class="picker-dim">28</div>
                        <div class="picker-label">日</div>
                    </div>
                </div>
            </div>

            <!-- 单价预览 -->
            <div class="preview">
                <div class="preview-left">
                    <span class="preview-label">单价</span>
                    <span class="preview-value">¥0.175</span>
                </div>
                <div class="preview-hint">
                    历史均价 ¥0.192
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="bottom-bar">
            <button class="btn-primary">保存</button>
        </div>
    </div>
</body>
</html>
