    /* Responsive */
    @media (max-width: 600px) {

<body>
  <header class="header">
    <h1>AI 奶茶新品宣传图文批量生成器</h1>
    <p>输入新品信息，3 秒生成 ins 风配图 + 种草文案，零基础直接保存使用</p>
  </header>

  <div class="container">
    <!-- Sidebar Form -->
    <aside class="sidebar">
      <h2>新品信息配置</h2>

      <div class="form-group">
        <label>奶茶名称 / 口味</label>
        <input type="text" id="productName" placeholder="例如：芋泥波波奶茶" value="芋泥波波奶茶">
      </div>

      <div class="form-group">
        <label>优惠活动</label>
        <input type="text" id="promotion" placeholder="例如：第二杯半价" value="新品上市 第二杯半价">
      </div>

      <div class="form-group">
        <label>门店 / 品牌名</label>
        <input type="text" id="storeName" placeholder="例如：茶语小铺" value="茶语小铺">
      </div>

      <div class="form-group">
        <label>价格（可选）</label>
        <input type="text" id="price" placeholder="例如：¥18" value="¥18">
      </div>

      <div class="form-group">
        <label>风格选择</label>
        <div class="style-options">
          <div class="style-option active" data-style="ins" onclick="selectStyle(this)">
            <img src="./assets/demo-ins.jpg" alt="ins风">
            <span>清新 ins</span>
          </div>
          <div class="style-option" data-style="guofeng" onclick="selectStyle(this)">
            <img src="./assets/demo-guofeng.jpg" alt="国风">
            <span>国风</span>
          </div>
          <div class="style-option" data-style="cartoon" onclick="selectStyle(this)">
            <img src="./assets/demo-cartoon.jpg" alt="卡通">
            <span>可爱卡通</span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>生成数量</label>
        <select id="batchCount">
          <option value="1">1 张</option>
          <option value="3" selected>3 张</option>
          <option value="5">5 张</option>
          <option value="9">9 张</option>
        </select>
      </div>

      <div class="form-group">
        <label>快速模板</label>
        <div class="templates">
          <button class="template-chip" onclick="applyTemplate('芋泥波波', '第二杯半价', '¥16')">芋泥波波</button>
          <button class="template-chip" onclick="applyTemplate('鲜果茶', '买一送一', '¥22')">鲜果茶</button>
          <button class="template-chip" onclick="applyTemplate('芝士奶盖', '限时8折', '¥20')">芝士奶盖</button>
          <button class="template-chip" onclick="applyTemplate('黑糖珍珠', '加料免费', '¥15')">黑糖珍珠</button>
        </div>
      </div>

      <button class="btn btn-primary" onclick="generatePromos()">
        一键生成宣传图文
      </button>
      <button class="btn btn-secondary" onclick="clearAll()">
        清空全部
      </button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('cards')">图文卡片</button>
        <button class="tab" onclick="switchTab('canvas')">海报预览</button>
        <button class="tab" onclick="switchTab('text')">文案库</button>
      </div>

      <div class="preview-area">
        <div class="preview-header">
          <h3>生成结果预览</h3>
          <div class="preview-actions">
            <button onclick="downloadAll()">全部下载</button>
            <button onclick="copyAllText()">复制文案</button>
          </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
          <div class="loading-spinner"></div>
          <p>AI 正在生成奶茶宣传素材...</p>
        </div>

        <!-- Cards View -->
        <div id="cardsView" class="cards-grid">
          <div class="empty-state">
            <div class="empty-icon">🧋</div>
            <h3>还没有生成宣传素材</h3>
            <p>在左侧填写新品信息，点击"一键生成宣传图文"即可批量产出朋友圈 / 小红书 / 抖音推广素材</p>
          </div>
        </div>

        <!-- Canvas View -->
        <div id="canvasView" class="canvas-container" style="display:none;">
          <canvas id="promoCanvas" width="600" height="800"></canvas>
          <div class="preview-actions">
            <button onclick="downloadCanvas()">下载海报</button>
            <button onclick="prevCanvas()">上一张</button>
            <button onclick="nextCanvas()">下一张</button>
          </div>
        </div>

        <!-- Text View -->
        <div id="textView" style="display:none;">
          <div class="text-preview">
            <h4>朋友圈 / 社群文案</h4>
            <div class="copy-text" id="wechatText">点击生成按钮获取文案...</div>
          </div>
          <div class="text-preview" style="margin-top:1rem;">
            <h4>小红书种草文案</h4>
            <div class="copy-text" id="xhsText">点击生成按钮获取文案...</div>
          </div>
          <div class="text-preview" style="margin-top:1rem;">
            <h4>抖音 / 短视频文案</h4>
            <div class="copy-text" id="douyinText">点击生成按钮获取文案...</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // State
    let currentStyle = 'ins';
    let generatedCards = [];
    let currentCanvasIndex = 0;

    // Style selection
    function selectStyle(el) {
      document.querySelectorAll('.style-option').forEach(o => o.classList.remove('active'));
      el.classList.add('active');
      currentStyle = el.dataset.style;
    }

    // Tab switching
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('cardsView').style.display = tab === 'cards' ? 'grid' : 'none';
      document.getElementById('canvasView').style.display = tab === 'canvas' ? 'flex' : 'none';
      document.getElementById('textView').style.display = tab === 'text' ? 'block' : 'none';
      if (tab === 'canvas' && generatedCards.length > 0) {
        drawCanvas(currentCanvasIndex);
      }
    }

    // Apply template
    function applyTemplate(name, promo, price) {
      document.getElementById('productName').value = name;
      document.getElementById('promotion').value = promo;
      document.getElementById('price').value = price;
      showToast('已应用模板：' + name);
    }

    // Toast
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Copy text
    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => showToast('文案已复制到剪贴板'));
    }

    // Copy all text
    function copyAllText() {
      if (generatedCards.length === 0) { showToast('请先生成宣传素材'); return; }
      const allText = generatedCards.map((c, i) => `--- 素材 ${i+1} ---\n${c.wechat}\n${c.xhs}\n${c.douyin}`).join('\n\n');
      navigator.clipboard.writeText(allText).then(() => showToast('全部文案已复制'));
    }

    // Generate promotional content
    function generatePromos() {
      const name = document.getElementById('productName').value.trim() || '芋泥波波奶茶';
      const promo = document.getElementById('promotion').value.trim() || '新品上市';
      const store = document.getElementById('storeName').value.trim() || '茶语小铺';
      const price = document.getElementById('price').value.trim() || '';
      const count = parseInt(document.getElementById('batchCount').value);

      document.getElementById('loading').classList.add('active');
      document.getElementById('cardsView').style.display = 'none';

      setTimeout(() => {
        generatedCards = [];
        for (let i = 0; i < count; i++) {
          generatedCards.push(createCardData(name, promo, store, price, i));
        }
        renderCards();
        updateTextViews();
        document.getElementById('loading').classList.remove('active');
        document.getElementById('cardsView').style.display = 'grid';
        showToast(`成功生成 ${count} 张宣传素材！`);
      }, 1200 + Math.random() * 800);
    }

    // Create card data
    function createCardData(name, promo, store, price, index) {
      const styleConfig = {
        ins: { tag: '清新 ins', tagClass: 'tag-ins', img: './assets/demo-ins.jpg', bg: '#fce4ec' },
        guofeng: { tag: '国风', tagClass: 'tag-guofeng', img: './assets/demo-guofeng.jpg', bg: '#fff3e0' },
        cartoon: { tag: '可爱卡通', tagClass: 'tag-cartoon', img: './assets/demo-cartoon.jpg', bg: '#e3f2fd' }
      };

      const styles = Object.keys(styleConfig);
      const styleKey = currentStyle === 'all' ? styles[index % styles.length] : currentStyle;
      const cfg = styleConfig[styleKey];

      const wechat = generateWechatText(name, promo, store, price);
      const xhs = generateXHSText(name, promo, store, price);
      const douyin = generateDouyinText(name, promo, store, price);

      return { name, promo, store, price, styleKey, cfg, wechat, xhs, douyin, index };
    }

    // Text generators
    function generateWechatText(name, promo, store, price) {
      const emojis = ['🧋', '✨', '💕', '🔥', '🌟', '🍵'];
      const e1 = emojis[Math.floor(Math.random() * emojis.length)];
      const e2 = emojis[Math.floor(Math.random() * emojis.length)];
      return `${e1} ${store} · ${name} 上新啦！\n\n${promo}${price ? ' 仅需 ' + price : ''}\n\n${e2} 限时活动，快来尝鲜吧~\n\n#${name} #${store} #奶茶新品`;
    }

    function generateXHSText(name, promo, store, price) {
      return `🧋 探店 | ${store} 新品 ${name} 测评\n\n姐妹们！${store} 上新了 ${name}，${promo}！\n\n${price ? '价格：' + price + '\n' : ''}口感层次丰富，颜值超高，拍照超出片📸\n\n✅ 推荐点单：正常冰 + 七分糖\n✅ 适合场景：下午茶、闺蜜聚会\n\n#奶茶探店 #${name} #种草 #${store}`;
    }

    function generateDouyinText(name, promo, store, price) {
      return `🔥 ${store} ${name} 来啦！\n${promo}${price ? '，' + price + '就能喝到' : ''}\n\n这杯奶茶太上头了！\n颜值天花板，一口沦陷💕\n\n左下角链接下单，手慢无！`;
    }

    // Render cards
    function renderCards() {
      const container = document.getElementById('cardsView');
      if (generatedCards.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🧋</div>
            <h3>还没有生成宣传素材</h3>
            <p>在左侧填写新品信息，点击"一键生成宣传图文"即可批量产出朋友圈 / 小红书 / 抖音推广素材</p>
          </div>`;
        return;
      }

      container.innerHTML = generatedCards.map(card => `
        <div class="promo-card">
          <img class="card-image" src="${card.cfg.img}" alt="${card.name}">
          <div class="card-body">
            <span class="card-tag ${card.cfg.tagClass}">${card.cfg.tag}</span>
            <div class="card-title">${card.store} · ${card.name}</div>
            <div class="card-desc">${card.promo}${card.price ? ' | ' + card.price : ''}</div>
            <div class="card-footer">
              <span class="card-price">${card.price || '限时优惠'}</span>
              <div class="card-actions">
                <button onclick="copyText('${card.wechat.replace(/'/g, "\\'")}')">复制文案</button>
                <button onclick="downloadCard(${card.index})">下载</button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Update text views
    function updateTextViews() {
      if (generatedCards.length === 0) return;
      document.getElementById('wechatText').textContent = generatedCards.map((c, i) => `【素材 ${i+1}】\n${c.wechat}`).join('\n\n');
      document.getElementById('xhsText').textContent = generatedCards.map((c, i) => `【素材 ${i+1}】\n${c.xhs}`).join('\n\n');
      document.getElementById('douyinText').textContent = generatedCards.map((c, i) => `【素材 ${i+1}】\n${c.douyin}`).join('\n\n');
    }

    // Canvas drawing
    function drawCanvas(idx) {
      if (generatedCards.length === 0) return;
      const card = generatedCards[idx];
      const canvas = document.getElementById('promoCanvas');
      const ctx = canvas.getContext('2d');

      // Background
      ctx.fillStyle = card.cfg.bg;
      ctx.fillRect(0, 0, 600, 800);

      // Image area
      const img = new Image();
      img.onload = function() {
        ctx.drawImage(img, 50, 50, 500, 400);

        // Title
        ctx.fillStyle = '#2d2a26';
        ctx.font = 'bold 32px "Segoe UI", "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(card.store, 300, 500);

        ctx.font = 'bold 28px "Segoe UI", "Microsoft YaHei", sans-serif';
        ctx.fillText(card.name, 300, 545);

        // Promo
        ctx.fillStyle = '#d4a574';
        ctx.font = 'bold 24px "Segoe UI", "Microsoft YaHei", sans-serif';
        ctx.fillText(card.promo, 300, 600);

        // Price
        if (card.price) {
          ctx.fillStyle = '#c9a96e';
          ctx.font = 'bold 36px "Segoe UI", "Microsoft YaHei", sans-serif';
          ctx.fillText(card.price, 300, 660);
        }

        // Footer
        ctx.fillStyle = '#8c8279';
          ctx.font = '16px "Segoe UI", "Microsoft YaHei", sans-serif';
          ctx.fillText('长按识别 · 扫码下单', 300, 740);
      };
      img.src = card.cfg.img;
    }

    function prevCanvas() {
      if (generatedCards.length === 0) return;
      currentCanvasIndex = (currentCanvasIndex - 1 + generatedCards.length) % generatedCards.length;
      drawCanvas(currentCanvasIndex);
    }

    function nextCanvas() {
      if (generatedCards.length === 0) return;
      currentCanvasIndex = (currentCanvasIndex + 1) % generatedCards.length;
      drawCanvas(currentCanvasIndex);
    }

    // Download canvas
    function downloadCanvas() {
      const canvas = document.getElementById('promoCanvas');
      const link = document.createElement('a');
      link.download = `奶茶宣传_${currentCanvasIndex + 1}.png`;
      link.href = canvas.toDataURL();
      link.click();
      showToast('海报已下载');
    }

    // Download card (simulate)
    function downloadCard(index) {
      const card = generatedCards[index];
      const canvas = document.createElement('canvas');
      canvas.width = 600;
      canvas.height = 800;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = card.cfg.bg;
      ctx.fillRect(0, 0, 600, 800);

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        ctx.drawImage(img, 50, 50, 500, 400);
        ctx.fillStyle = '#2d2a26';
        ctx.font = 'bold 32px "Segoe UI", "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(card.store, 300, 500);
        ctx.font = 'bold 28px "Segoe UI", "Microsoft YaHei", sans-serif';
        ctx.fillText(card.name, 300, 545);
        ctx.fillStyle = '#d4a574';
        ctx.font = 'bold 24px "Segoe UI", "Microsoft YaHei", sans-serif';
        ctx.fillText(card.promo, 300, 600);
        if (card.price) {
          ctx.fillStyle = '#c9a96e';
          ctx.font = 'bold 36px "Segoe UI", "Microsoft YaHei", sans-serif';
          ctx.fillText(card.price, 300, 660);
        }

        const link = document.createElement('a');
        link.download = `${card.name}_宣传图.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('图片已下载');
      };
      img.src = card.cfg.img;
    }

    // Download all
    function downloadAll() {
      if (generatedCards.length === 0) { showToast('请先生成宣传素材'); return; }
      generatedCards.forEach((_, i) => setTimeout(() => downloadCard(i), i * 300));
      showToast('开始批量下载...');
    }

    // Clear all
    function clearAll() {
      generatedCards = [];
      document.getElementById('productName').value = '';
      document.getElementById('promotion').value = '';
      document.getElementById('storeName').value = '';
      document.getElementById('price').value = '';
      renderCards();
      document.getElementById('wechatText').textContent = '点击生成按钮获取文案...';
      document.getElementById('xhsText').textContent = '点击生成按钮获取文案...';
      document.getElementById('douyinText').textContent = '点击生成按钮获取文案...';
      showToast('已清空全部内容');
    }
  </script>
</body>
</html>
