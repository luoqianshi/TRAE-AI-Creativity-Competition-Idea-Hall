<script>

{id:'t3',bid:null,title:'周末露营计划',pub:true,mems:['me','u3','u4'],last:'我带了天幕和椅子',up:'1小时前'}
];
const msgs={
t1:[{id:'m1',tid:'t1',uid:'u1',name:'堵车小王子',av:av.u1,type:'voice',txt:'前面为什么堵车啊？有人知道情况吗？',dur:8,time:'2分钟前'},{id:'m2',tid:'t1',uid:'u2',name:'奶茶控',av:av.u2,type:'text',txt:'好像是前面有事故，交警在处理',time:'1分钟前'},{id:'m3',tid:'t1',uid:'me',name:'我',av:av.me,type:'text',txt:'那我换个路线吧，谢谢提醒',time:'刚刚'}],
t2:[{id:'m4',tid:'t2',uid:'u2',name:'奶茶控',av:av.u2,type:'text',txt:'有人在图书馆附近吗？想拼单喜茶，第二杯半价！',time:'5分钟前'},{id:'m5',tid:'t2',uid:'me',name:'我',av:av.me,type:'text',txt:'我在！我要多肉葡萄',time:'4分钟前'},{id:'m6',tid:'t2',uid:'u2',name:'奶茶控',av:av.u2,type:'text',txt:'我要多肉葡萄，全糖！',time:'3分钟前'}],
t3:[{id:'m7',tid:'t3',uid:'u3',name:'露营达人',av:av.u3,type:'voice',txt:'周末有一起去露营的吗？',dur:5,time:'2小时前'},{id:'m8',tid:'t3',uid:'u4',name:'演唱会志愿者',av:av.u4,type:'text',txt:'我想去！有具体地点吗？',time:'1小时前'},{id:'m9',tid:'t3',uid:'u3',name:'露营达人',av:av.u3,type:'text',txt:'我带了天幕和椅子',time:'1小时前'},{id:'m10',tid:'t3',uid:'me',name:'我',av:av.me,type:'text',txt:'我可以带食材和饮料',time:'30分钟前'}]

// ===== State =====
let tab='broadcast';
let playingId=null;
let showSend=false;
let activeTid=null;
let settings=JSON.parse(localStorage.getItem('jiaojiqun_settings')||'{"receiveBroadcast":true,"allowAddFriend":true}');
let selFid=null;

// ===== Helpers =====
function $(id){return document.getElementById(id);}
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e;}
function dist(d){return d<1000?d+'m':(d/1000).toFixed(1)+'km';}

// ===== Render =====
function render(){
  const app=$('app');
  app.innerHTML='';
  app.className='min-h-screen bg-gradient-to-br from-slate-100 to-slate-200 flex items-center justify-center p-4 md:p-8';

  // Phone frame
  const phone=h('div','relative w-full max-w-[400px] h-[844px] bg-gray-900 rounded-[48px] p-3 shadow-2xl');
  const inner=h('div','w-full h-full bg-white rounded-[40px] overflow-hidden flex flex-col relative');

  // Status bar
  const sb=h('div','h-12 bg-white flex items-center justify-between px-6 pt-2 flex-shrink-0 z-20');
  sb.innerHTML='<span class="text-sm font-semibold text-gray-900">9:41</span><div class="absolute left-1/2 -translate-x-1/2 top-2 w-28 h-7 bg-gray-900 rounded-full"></div><div class="flex items-center gap-1"><div class="w-4 h-4 rounded-full border-2 border-gray-800"></div><div class="w-4 h-4 rounded-full border-2 border-gray-800"></div></div>';
  inner.appendChild(sb);

  // Content
  const content=h('div','flex-1 overflow-hidden relative');
  if(activeTid) content.appendChild(renderTopicDetail());
  else if(tab==='broadcast') content.appendChild(renderBroadcast());
  else if(tab==='topics') content.appendChild(renderTopicList());
  else if(tab==='contacts') content.appendChild(renderContacts());
  else if(tab==='profile') content.appendChild(renderProfile());
  inner.appendChild(content);

  // Tab bar
  if(!activeTid){
    const tb=h('div','h-16 bg-white/90 backdrop-blur-md border-t border-gray-100 flex items-center justify-around flex-shrink-0 z-20 pb-2');
    const tabs=[{k:'broadcast',l:'广播',i:'<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2m4.22-17.22l1.42 1.42M6.36 17.64l1.42 1.42M23 12h-2M3 12H1m17.22 4.22l-1.42-1.42M6.36 6.36L4.93 4.93"/></svg>'},
      {k:'topics',l:'话题',i:'<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'},
      {k:'contacts',l:'通讯录',i:'<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'},
      {k:'profile',l:'我的',i:'<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'}];
    tabs.forEach(t=>{
      const btn=h('button','flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl active:scale-95');
      btn.innerHTML=t.i+'<span class="text-[10px] font-medium '+(tab===t.k?'text-indigo-500':'text-gray-400')+'">'+t.l+'</span>';
      btn.onclick=()=>{tab=t.k;render();};
      tb.appendChild(btn);
    });
    inner.appendChild(tb);
  }

  // Home indicator
  const hi=h('div','h-1 bg-white flex-shrink-0 flex items-start justify-center pb-2');
  hi.innerHTML='<div class="w-32 h-1 bg-gray-300 rounded-full"></div>';
  inner.appendChild(hi);

  phone.appendChild(inner);
  app.appendChild(phone);

  // Send broadcast modal
  if(showSend) app.appendChild(renderSendModal());
}

  // Header
  const hd=h('div','flex items-center justify-between px-4 py-3 bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-10');

  wrap.appendChild(hd);

  if(!settings.receiveBroadcast){
    const empty=h('div','flex flex-col items-center justify-center h-full px-8 text-center');
    empty.innerHTML='<svg class="w-16 h-16 text-gray-300 mb-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2m4.22-17.22l1.42 1.42M6.36 17.64l1.42 1.42M23 12h-2M3 12H1m17.22 4.22l-1.42-1.42M6.36 6.36L4.93 4.93"/></svg><h3 class="text-lg font-semibold text-gray-700 mb-2">广播接收已关闭</h3><p class="text-sm text-gray-500">前往「我的」页面开启接收广播开关</p>';
    wrap.appendChild(empty);
    return wrap;
  }

  // List
  const list=h('div','flex-1 overflow-y-auto px-4 py-3 space-y-3');
  broadcasts.forEach(b=>{
    const card=h('div','bg-white rounded-2xl shadow-sm border border-gray-100 p-4 active:scale-[0.98]');
    const isPlaying=playingId===b.id;

    let content='';
    if(b.type==='voice'){
      content='<div class="flex items-center gap-3 bg-gray-50 rounded-xl p-3">'+

function renderSendModal(){
  const wrap=h('div','fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm');
  const box=h('div','bg-white w-full max-w-md mx-4 rounded-3xl shadow-2xl overflow-hidden');
  box.innerHTML='<div class="flex items-center justify-between px-5 py-4 border-b border-gray-100"><h2 class="text-lg font-bold text-gray-800">发送广播</h2><button onclick="showSend=false;render();" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>'+
    '<div class="px-5 py-3 flex items-center gap-2 text-sm text-gray-600 bg-gray-50/50"><svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span>当前位置 · 上海市人民广场</span></div>'+
    '<div class="px-5 py-3 flex gap-2">'+
    '<button id="sm-voice" onclick="setSendMode(\'voice\')" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-medium bg-indigo-500 text-white shadow-md">'+
    '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>语音</button>'+
    '<button id="sm-text" onclick="setSendMode(\'text\')" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-medium bg-gray-100 text-gray-600">'+
    '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>文字</button></div>'+
    '<div id="sendBody" class="px-5 py-4"></div>'+
    '<div class="px-5 py-4 border-t border-gray-100"><button onclick="submitBroadcast()" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold text-sm shadow-md active:scale-[0.98] flex items-center justify-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>发布广播</button></div>';
  wrap.appendChild(box);

  // Init send mode
  setTimeout(()=>setSendMode('voice'),0);
  return wrap;
}

let sendMode='voice',recDur=0,recTimer=null;
function setSendMode(m){
  sendMode=m;
  const v=$('sm-voice'),t=$('sm-text'),b=$('sendBody');
  if(!v||!t||!b)return;
  v.className='flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-medium '+(m==='voice'?'bg-indigo-500 text-white shadow-md':'bg-gray-100 text-gray-600');
  t.className='flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-medium '+(m==='text'?'bg-indigo-500 text-white shadow-md':'bg-gray-100 text-gray-600');
  if(m==='voice'){
    b.innerHTML='<div class="flex flex-col items-center gap-6 py-6">'+
      '<button id="recBtn" onclick="toggleRecord()" class="relative w-24 h-24 rounded-full flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600 shadow-lg text-white active:scale-95">'+
      '<svg id="recIcon" class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>'+
      '</button>'+
      '<div class="text-center"><p id="recTxt" class="text-lg font-mono font-semibold text-gray-800">按住录音</p><p class="text-xs text-gray-400 mt-1">最长 60 秒</p></div>'+
      '<div id="recWave" class="hidden w-full bg-gray-50 rounded-xl p-3 flex items-center gap-3"><div class="flex items-center gap-0.5 h-6 flex-1">';
    for(let i=0;i<20;i++) b.innerHTML+='<div class="w-1 rounded-full bg-indigo-400" style="height:'+(Math.random()*16+4)+'px"></div>';
    b.innerHTML+='</div><span id="recDurDisp" class="text-xs text-gray-500">0秒</span></div></div>';
  }else{
    b.innerHTML='<textarea id="sendText" placeholder="说点什么..." maxlength="200" class="w-full h-32 bg-gray-50 rounded-xl p-4 text-sm text-gray-700 placeholder-gray-400 outline-none focus:ring-2 focus:ring-indigo-200 resize-none"></textarea>';
  }
}
function toggleRecord(){
  const btn=$('recBtn'),icon=$('recIcon'),txt=$('recTxt'),wave=$('recWave'),dur=$('recDurDisp');
  if(recTimer){
    clearInterval(recTimer);recTimer=null;
    btn.className='relative w-24 h-24 rounded-full flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600 shadow-lg text-white active:scale-95';
    icon.innerHTML='<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>';
    txt.textContent='按住录音';
    if(recDur>0) wave.classList.remove('hidden');
  }else{
    recDur=0;
    btn.className='relative w-24 h-24 rounded-full flex items-center justify-center bg-red-500 shadow-lg text-white active:scale-95';
    icon.innerHTML='<rect x="6" y="6" width="12" height="12"/>';
    txt.textContent='00:00';
    wave.classList.add('hidden');
    recTimer=setInterval(()=>{recDur++;txt.textContent='00:'+(recDur<10?'0':'')+recDur;if(recDur>=60){toggleRecord();}},1000);
  }
}
function submitBroadcast(){
  if(sendMode==='text'){
    const txt=$('sendText').value.trim(); if(!txt)return;
    broadcasts.unshift({id:'b'+Date.now(),uid:'me',name:'我',av:av.me,type:'text',txt:txt,dis:0,time:'刚刚'});
  }else{
    if(recDur===0)return;
    broadcasts.unshift({id:'b'+Date.now(),uid:'me',name:'我',av:av.me,type:'voice',txt:'语音广播内容',dur:recDur,dis:0,time:'刚刚'});
  }
  showSend=false;recDur=0;recTimer=null;
  render();
}

// ===== Actions =====
function playBroadcast(id){if(playingId===id)playingId=null;else playingId=id;render();}
function toggleMsgPlay(id){if(playingId===id)playingId=null;else playingId=id;render();}
function toggleReply(id){
  const el=$('reply-'+id);
  if(el.classList.contains('hidden')){el.classList.remove('hidden');el.classList.add('flex');$('inp-'+id).focus();}
  else{el.classList.add('hidden');el.classList.remove('flex');}
}
function sendReply(bid){
  const b=broadcasts.find(x=>x.id===bid); const txt=$('inp-'+bid).value.trim(); if(!b||!txt)return;
  const tid='t'+Date.now();
  topics.unshift({id:tid,bid:bid,title:b.txt.slice(0,20)+(b.txt.length>20?'...':''),pub:true,mems:['me',b.uid],last:txt,up:'刚刚'});
  msgs[tid]=[{id:'m'+Date.now(),tid:tid,uid:'me',name:'我',av:av.me,type:'text',txt:txt,time:'刚刚'}];
  activeTid=tid;render();
}
function sendMsg(){
  const txt=$('msgInp').value.trim(); if(!txt||!activeTid)return;
  const arr=msgs[activeTid]||[];
  arr.push({id:'m'+Date.now(),tid:activeTid,uid:'me',name:'我',av:av.me,type:'text',txt:txt,time:'刚刚'});
  msgs[activeTid]=arr;
  const t=topics.find(x=>x.id===activeTid); if(t){t.last=txt;t.up='刚刚';}
  render();
}
function toggleSetting(key){settings[key]=!settings[key];localStorage.setItem('jiaojiqun_settings',JSON.stringify(settings));render();}
function addFriendFromMsg(uid,name,avatar){
  if(friends.some(f=>f.uid===uid))return;
  friends.push({id:'f'+Date.now(),uid:uid,name:name,av:avatar,bio:'',com:1});
  alert('已添加 '+name+' 为好友');render();
}

// ===== Init =====
render();
</script>

</html>
