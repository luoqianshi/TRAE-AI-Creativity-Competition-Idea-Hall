<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平行舞台 Parallel Stage</title>
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 戏剧院主题色彩 */
        :root {
            --crimson: #8B0000;
            --gold: #DAA520;
            --dark-red: #2C0A0A;
            --velvet: #4A1515;
            --cream: #F5E6D3;
            --shadow-gold: rgba(218, 165, 32, 0.3);
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, var(--dark-red) 0%, var(--velvet) 50%, var(--crimson) 100%);
            min-height: 100vh;
            overflow: hidden;
            color: var(--cream);
        }

        /* 探照灯效果 */
        .spotlight-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .spotlight {
            position: absolute;
            top: -10%;
            left: 50%;
            width: 600px;
            height: 600px;
            background: radial-gradient(ellipse at center, 
                rgba(218, 165, 32, 0.15) 0%, 
                rgba(218, 165, 32, 0.05) 30%, 
                transparent 70%);
            border-radius: 50%;
            transform: translateX(-50%);
            animation: spotlight-swing 8s ease-in-out infinite;
        }

        .spotlight::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            background: radial-gradient(ellipse at center, 
                rgba(218, 165, 32, 0.4) 0%, 
                rgba(218, 165, 32, 0.1) 50%, 
                transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: spotlight-pulse 3s ease-in-out infinite;
        }

        @keyframes spotlight-swing {
            0%, 100% { transform: translateX(-50%) rotate(-5deg); }
            50% { transform: translateX(-50%) rotate(5deg); }
        }

        @keyframes spotlight-pulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
        }

        /* 主舞台区域 */
        .stage {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 标题 */
        .title-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-size: 3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--gold);
            text-shadow: 
                0 0 10px var(--shadow-gold),
                0 0 30px var(--shadow-gold),
                0 0 60px var(--shadow-gold);
            margin-bottom: 10px;
            animation: title-glow 4s ease-in-out infinite;
        }

        .subtitle {
            font-size: 1rem;
            letter-spacing: 0.5em;
            color: rgba(245, 230, 211, 0.7);
            font-style: italic;
        }

        @keyframes title-glow {
            0%, 100% { text-shadow: 0 0 10px var(--shadow-gold), 0 0 30px var(--shadow-gold); }
            50% { text-shadow: 0 0 20px var(--shadow-gold), 0 0 50px var(--shadow-gold), 0 0 80px var(--shadow-gold); }
        }

        /* 输入区域 */
        .input-section {
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .input-label {
            display: block;
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--cream);
            letter-spacing: 0.1em;
        }

        .regret-input {
            width: 100%;
            padding: 20px 30px;
            font-size: 1.2rem;
            background: rgba(44, 10, 10, 0.8);
            border: 2px solid var(--gold);
            border-radius: 5px;
            color: var(--cream);
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .regret-input:focus {
            box-shadow: 
                0 0 10px var(--shadow-gold),
                0 0 30px var(--shadow-gold);
            border-color: #FFD700;
        }

        .regret-input::placeholder {
            color: rgba(245, 230, 211, 0.4);
            font-style: italic;
        }

        /* 拉开帷幕按钮 */
        .curtain-btn {
            position: relative;
            padding: 18px 60px;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--gold);
            background: transparent;
            border: 2px solid var(--gold);
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .curtain-btn:hover {
            color: var(--dark-red);
            background: var(--gold);
            box-shadow: 0 0 30px var(--shadow-gold);
            transform: scale(1.05);
        }

        .curtain-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .curtain-btn:hover::before {
            left: 100%;
        }

        /* 幕布动画 */
        .curtain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease;
        }

        .curtain-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .curtain-left, .curtain-right {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, var(--crimson) 0%, var(--velvet) 100%);
            transform-origin: left center;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .curtain-left {
            left: 0;
            transform: scaleX(1);
        }

        .curtain-right {
            right: 0;
            transform-origin: right center;
            transform: scaleX(1);
        }

        .curtain-overlay.curtains-open .curtain-left {
            transform: scaleX(0);
        }

        .curtain-overlay.curtains-open .curtain-right {
            transform: scaleX(0);
        }

        /* 幕布褶皱效果 */
        .curtain-left::before, .curtain-right::before {
            content: '';
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 30px,
                rgba(139, 0, 0, 0.5) 30px,
                rgba(139, 0, 0, 0.5) 35px
            );
        }

        /* 四格镜像舞台（全息投影布局） */
        .hologram-stage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a0a 50%, #0a0a0a 100%);
            display: none;
            z-index: 50;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .hologram-stage.active {
            display: flex;
        }

        /* 田字形布局容器 */
        .quad-container {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            background: var(--dark-red);
            padding: 8px;
            border-radius: 8px;
            box-shadow: 
                0 0 30px rgba(218, 165, 32, 0.3),
                inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        /* 四个镜像画面 */
        .quad-panel {
            background: linear-gradient(135deg, #1a0a0a 0%, #0a0a0a 100%);
            border: 1px solid rgba(218, 165, 32, 0.3);
            border-radius: 4px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* 剧照占位图 */
        .scene-placeholder {
            width: 100%;
            aspect-ratio: 4/3;
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.3) 0%, rgba(44, 10, 10, 0.5) 100%);
            border: 1px dashed rgba(218, 165, 32, 0.3);
            border-radius: 4px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .scene-placeholder::before {
            content: '🎭';
            font-size: 2rem;
            opacity: 0.5;
        }

        .scene-placeholder::after {
            content: '剧照生成中...';
            position: absolute;
            bottom: 8px;
            font-size: 0.7rem;
            color: rgba(218, 165, 32, 0.5);
        }

        /* 戏剧文本 */
        .play-text {
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--cream);
            font-style: italic;
            opacity: 0.9;
            max-height: 60px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .play-text::before {
            content: '「';
        }

        .play-text::after {
            content: '」';
        }

        /* 场景标签 */
        .scene-label {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 0.65rem;
            color: var(--gold);
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* 全息金字塔提示 */
        .hologram-tip {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: rgba(218, 165, 32, 0.6);
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(218, 165, 32, 0.2);
        }

        /* 返回按钮 */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            font-size: 0.9rem;
            color: var(--gold);
            background: rgba(44, 10, 10, 0.8);
            border: 1px solid var(--gold);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 60;
            display: none;
        }

        .back-btn.active {
            display: block;
        }

        .back-btn:hover {
            background: var(--gold);
            color: var(--dark-red);
        }

        /* 装饰性元素 */
        .theater-border {
            position: fixed;
            top: 10%;
            left: 5%;
            right: 5%;
            bottom: 10%;
            border: 3px solid rgba(218, 165, 32, 0.2);
            pointer-events: none;
            z-index: 5;
        }

        .theater-border::before, .theater-border::after {
            content: '';
            position: absolute;
            top: -20px;
            left: 10%;
            right: 10%;
            height: 3px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--gold), 
                transparent);
        }

        .theater-border::after {
            top: auto;
            bottom: -20px;
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .title {
                font-size: 1.8rem;
                letter-spacing: 0.2em;
            }

            .subtitle {
                font-size: 0.85rem;
            }

            .regret-input {
                padding: 15px 20px;
                font-size: 1rem;
            }

            .curtain-btn {
                padding: 15px 40px;
                font-size: 1.1rem;
            }

            .quad-container {
                max-width: 320px;
            }

            .play-text {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- 探照灯效果 -->
    <div class="spotlight-container">
        <div class="spotlight"></div>
    </div>

    <!-- 剧院边框装饰 -->
    <div class="theater-border"></div>

    <!-- 幕布动画层 -->
    <div class="curtain-overlay" id="curtainOverlay">
        <div class="curtain-left"></div>
        <div class="curtain-right"></div>
    </div>

    <!-- 返回按钮 -->
    <button class="back-btn" id="backBtn" onclick="goBack()">← 返回</button>

    <!-- 主舞台 -->
    <div class="stage" id="mainStage">
        <div class="title-container">
            <h1 class="title">平行舞台</h1>
            <p class="subtitle">Parallel Stage</p>
        </div>

        <div class="input-section">
            <label class="input-label" for="regretInput">输入你人生未选择的那个遗憾</label>
            <input 
                type="text" 
                id="regretInput" 
                class="regret-input" 
                placeholder="如果当年...我选择了另一条路..."
                maxlength="100"
            >
        </div>

        <button class="curtain-btn" id="curtainBtn" onclick="openCurtains()">
            拉开帷幕
        </button>
    </div>

    <!-- 四格全息舞台 -->
    <div class="hologram-stage" id="hologramStage">
        <div class="quad-container">
            <!-- 左上 -->
            <div class="quad-panel">
                <span class="scene-label">场景一</span>
                <div class="scene-placeholder"></div>
                <p class="play-text">在那个平行时空里，你选择了热爱的艺术，成为了一名舞台设计师。此刻，你正站在聚光灯下，感受着梦想照进现实的温暖。</p>
            </div>
            
            <!-- 右上 -->
            <div class="quad-panel">
                <span class="scene-label">场景二</span>
                <div class="scene-placeholder"></div>
                <p class="play-text">时光回溯到那个重要的十字路口，这一次你听从了内心的声音。没有遗憾，只有对未来的无限憧憬。</p>
            </div>
            
            <!-- 左下 -->
            <div class="quad-panel">
                <span class="scene-label">场景三</span>
                <div class="scene-placeholder"></div>
                <p class="play-text">舞台上的你光彩夺目，每一个动作都诠释着对生命的热爱。这是另一个你，正在绽放属于自己的光芒。</p>
            </div>
            
            <!-- 右下 -->
            <div class="quad-panel">
                <span class="scene-label">场景四</span>
                <div class="scene-placeholder"></div>
                <p class="play-text">谢幕时刻，掌声雷动。你微笑着鞠躬，眼中闪烁着泪光。这个舞台，属于勇敢追梦的灵魂。</p>
            </div>
        </div>

        <div class="hologram-tip">✨ 将手机放入全息投影盒，观看3D效果</div>
    </div>

    <script>
        // 获取DOM元素
        const curtainBtn = document.getElementById('curtainBtn');
        const curtainOverlay = document.getElementById('curtainOverlay');
        const mainStage = document.getElementById('mainStage');
        const hologramStage = document.getElementById('hologramStage');
        const backBtn = document.getElementById('backBtn');
        const regretInput = document.getElementById('regretInput');

        // 拉开帷幕
        function openCurtains() {
            const regret = regretInput.value.trim() || "未选择的人生道路";
            
            // 显示幕布层并播放动画
            curtainOverlay.classList.add('active');
            
            // 延迟后拉开幕布
            setTimeout(() => {
                curtainOverlay.classList.add('curtains-open');
            }, 300);
            
            // 动画完成后切换到全息舞台
            setTimeout(() => {
                mainStage.style.display = 'none';
                hologramStage.classList.add('active');
                backBtn.classList.add('active');
                
                // 更新戏剧文本（根据用户输入）
                updatePlayText(regret);
            }, 1800);
        }

        // 返回主舞台
        function goBack() {
            // 关闭全息舞台
            hologramStage.classList.remove('active');
            backBtn.classList.remove('active');
            
            // 重置幕布并关闭
            curtainOverlay.classList.remove('curtains-open');
            setTimeout(() => {
                curtainOverlay.classList.remove('active');
                mainStage.style.display = 'flex';
            }, 300);
        }

        // 根据用户输入更新戏剧文本
        function updatePlayText(regret) {
            const texts = [
                `在那个平行时空里，${regret}。此刻，你正站在聚光灯下，感受着梦想照进现实的温暖。`,
                `时光回溯到那个重要的十字路口，这一次你选择了${regret}。没有遗憾，只有对未来的无限憧憬。`,
                `舞台上的你光彩夺目，${regret}让你成为了更好的自己。这是另一个你，正在绽放属于自己的光芒。`,
                `谢幕时刻，掌声雷动。你微笑着鞠躬，眼中闪烁着泪光。因为${regret}，这个舞台格外精彩。`
            ];

            const panels = document.querySelectorAll('.play-text');
            panels.forEach((panel, index) => {
                panel.textContent = texts[index];
            });
        }

        // 键盘事件：按回车键拉开帷幕
        regretInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                openCurtains();
            }
        });
    </script>
</body>
</html>
