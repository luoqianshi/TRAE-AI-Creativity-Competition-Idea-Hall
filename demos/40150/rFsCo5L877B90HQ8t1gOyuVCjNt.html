<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>外婆的灶边 · 家味之书</title>
<style>
  :root{
    --paper:#f7f0e1;
    --paper-2:#f1e7d2;
    --ink:#4a3526;
    --ink-soft:#7a6450;
    --accent:#a8421f;
    --accent-soft:#c8763f;
    --line:#d8c7a8;
    --shadow:rgba(74,53,38,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    background:radial-gradient(circle at 50% 20%,#3a2a1c,#241710 70%);
    color:var(--ink);
    display:flex;flex-direction:column;align-items:center;
    min-height:100vh;padding:24px 12px 40px;
  }
  .masthead{text-align:center;color:#f0e2c8;margin-bottom:18px;}
  .masthead h1{font-size:22px;letter-spacing:4px;font-weight:600;}
  .masthead p{font-size:13px;color:#cdb78f;margin-top:6px;letter-spacing:1px;}

  /* book */
  .book-wrap{perspective:2400px;width:min(92vw,460px);}
  .book{
    position:relative;width:100%;aspect-ratio:3/4;
    transform-style:preserve-3d;
    box-shadow:0 18px 50px rgba(0,0,0,.5);border-radius:8px;
  }
  .page{
    position:absolute;top:0;left:0;width:100%;height:100%;
    transform-origin:left center;transform-style:preserve-3d;
    transition:transform 1s cubic-bezier(.65,.05,.2,1);
    cursor:pointer;
  }
  .page .face{
    position:absolute;inset:0;backface-visibility:hidden;
    background:linear-gradient(135deg,var(--paper),var(--paper-2));
    overflow:hidden;
    box-shadow:inset 0 0 60px rgba(120,90,50,.12);
    border-radius:8px;
  }
  .page .front{transform:rotateY(0deg);}
  .page .back{transform:rotateY(180deg);background:linear-gradient(135deg,var(--paper-2),var(--paper));}
  /* page spine shading on the binding (left) edge */
  .page .front::after,.page .back::after{
    content:"";position:absolute;top:0;bottom:0;width:36px;left:0;
    background:linear-gradient(to right,rgba(80,50,20,.16),transparent);
  }
  .page.flipped{transform:rotateY(-180deg);}
  /* stacking handled by JS via z-index */

  .pad{position:absolute;inset:0;padding:30px 34px;display:flex;flex-direction:column;}

  /* cover */
  .cover{background:linear-gradient(160deg,#8a3318,#5e2410)!important;color:#f6e7c8;}
  .cover::after{display:none;}
  .cover .inner{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:2px solid rgba(246,231,200,.4);margin:16px;border-radius:6px;padding:20px 16px 46px;}
  .cover .badge{font-size:11px;letter-spacing:3px;color:#e9c79a;border:1px solid rgba(233,199,154,.5);padding:3px 11px;border-radius:20px;margin-bottom:14px;}
  .cover h2{font-size:30px;letter-spacing:6px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.4);line-height:1.3;}
  .cover .sub{margin-top:12px;font-size:13px;color:#e8cfa6;letter-spacing:2px;line-height:1.7;}
  .cover .cover-img{width:104px;height:104px;border-radius:50%;object-fit:cover;margin-bottom:14px;border:3px solid rgba(246,231,200,.6);box-shadow:0 6px 18px rgba(0,0,0,.4);}
  .cover .tip{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:11px;color:#e9c79a;opacity:.8;letter-spacing:1px;}

  /* recipe page */
  .recipe-title{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--line);padding-bottom:10px;margin-bottom:14px;}
  .recipe-title .cn{font-size:24px;font-weight:700;color:var(--accent);letter-spacing:2px;}
  .recipe-title .by{font-size:12px;color:var(--ink-soft);margin-left:auto;}
  .dish-img{width:100%;height:150px;object-fit:cover;border-radius:6px;box-shadow:0 4px 12px var(--shadow);margin-bottom:12px;}
  .section-h{font-size:13px;font-weight:700;color:var(--accent-soft);letter-spacing:2px;margin:10px 0 6px;display:flex;align-items:center;gap:6px;}
  .section-h::before{content:"";width:14px;height:2px;background:var(--accent-soft);}
  .ingredients{display:flex;flex-wrap:wrap;gap:6px;}
  .ingredients span{font-size:12px;background:rgba(168,66,31,.08);color:var(--ink);padding:3px 9px;border-radius:12px;border:1px solid var(--line);}
  .steps{list-style:none;counter-reset:s;font-size:12.5px;line-height:1.85;color:var(--ink);}
  .steps li{counter-increment:s;position:relative;padding-left:24px;margin-bottom:5px;}
  .steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:16px;height:16px;background:var(--accent);color:#fff;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;}

  /* story page */
  .story{background:linear-gradient(135deg,#f3ead6,#ece0c6)!important;}
  .quote-mark{font-size:60px;color:var(--accent-soft);opacity:.35;line-height:.6;font-family:Georgia,serif;}
  .story-text{font-size:14px;line-height:2.1;color:var(--ink);margin:8px 0 14px;text-indent:0;}
  .grandma-words{background:rgba(168,66,31,.07);border-left:3px solid var(--accent);padding:10px 14px;font-size:13px;color:var(--ink-soft);font-style:italic;line-height:1.9;border-radius:0 6px 6px 0;}
  .voice{margin-top:auto;display:flex;align-items:center;gap:10px;background:rgba(74,53,38,.06);padding:10px 14px;border-radius:30px;cursor:pointer;border:1px dashed var(--line);}
  .voice .play{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .voice .wave{flex:1;display:flex;align-items:center;gap:3px;height:24px;}
  .voice .wave i{display:block;width:3px;background:var(--accent-soft);border-radius:2px;animation:wave 1s ease-in-out infinite;}
  @keyframes wave{0%,100%{height:5px}50%{height:20px}}
  .voice .label{font-size:11px;color:var(--ink-soft);flex-shrink:0;}
  .photo{width:100%;height:130px;object-fit:cover;border-radius:6px;margin-bottom:12px;box-shadow:0 4px 12px var(--shadow);filter:sepia(.15);}

  .page-num{position:absolute;bottom:14px;font-size:11px;color:var(--ink-soft);letter-spacing:1px;}
  .front .page-num{right:30px;}
  .back .page-num{left:30px;}

  /* back cover */
  .endpage{background:linear-gradient(160deg,#5e2410,#8a3318)!important;color:#f6e7c8;}
  .endpage::after{display:none;}
  .endpage .inner{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;}
  .endpage h3{font-size:20px;letter-spacing:3px;}
  .endpage p{font-size:13px;line-height:2;color:#e8cfa6;max-width:80%;}

  /* controls */
  .controls{display:flex;align-items:center;gap:14px;margin-top:24px;}
  .btn{font-family:inherit;background:rgba(246,231,200,.92);color:var(--ink);border:none;padding:10px 20px;border-radius:24px;font-size:13px;cursor:pointer;letter-spacing:1px;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:transform .15s,background .2s;}
  .btn:hover{transform:translateY(-2px);background:#fff;}
  .btn:disabled{opacity:.4;cursor:default;transform:none;}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.primary:hover{background:#c0501f;}
  .progress{color:#e8cfa6;font-size:12px;letter-spacing:1px;min-width:64px;text-align:center;}

  @media (max-width:560px){
    .pad{padding:18px 18px;}
    .cover h2{font-size:24px;}
    .recipe-title .cn{font-size:19px;}
    .dish-img{height:110px;}
  }

  /* print / pdf */
  @media print{
    body{background:#fff;padding:0;}
    .masthead,.controls{display:none!important;}
    .book-wrap{perspective:none;width:100%;}
    .book{aspect-ratio:auto;height:auto;transform:none!important;}
    .page{position:relative!important;width:100%!important;height:auto;left:0;transform:none!important;page-break-after:always;}
    .page .face{position:relative;backface-visibility:visible;transform:none!important;box-shadow:none;border:1px solid #ddd;}
    .page .back{display:block;}
    .page .front::after,.page .back::after{display:none;}
    .pad{position:relative;min-height:540px;}
    .dish-img,.photo{height:220px;}
  }
</style>
</head>
<body>
  <div class="masthead">
    <h1>外 婆 的 灶 边</h1>
    <p>把家的味道，变成可以传承的书 · TRAE AI 创造力大赛作品 Demo</p>
  </div>

  <div class="book-wrap">
    <div class="book" id="book"></div>
  </div>

  <div class="controls">
    <button class="btn" id="prev">‹ 上一页</button>
    <span class="progress" id="progress"></span>
    <button class="btn" id="next">下一页 ›</button>
    <button class="btn primary" id="export">🖨️ 导出 / 打印成书</button>
  </div>

<script>
/* ---------- 数据：家味之书的内容 ---------- */
const pages = [
  { type:"cover" },
  {
    type:"recipe",
    cn:"红烧肉",
    by:"外婆 · 张桂芬",
    img:"assets/hongshaorou.jpg",
    ingredients:["五花肉 一块","冰糖 一小把","老抽 少许","生姜 几片","八角 两颗","料酒 适量"],
    steps:[
      "五花肉切大块，冷水下锅焯一下，去腥。",
      "锅里放冰糖小火炒出枣红色糖色。",
      "下肉块翻炒上色，加姜、八角、料酒。",
      "添热水没过肉，老抽调色，大火烧开转小火。",
      "慢炖一个钟头，等汤收得稠亮，肉一抿就化。"
    ]
  },
  {
    type:"story",
    title:"灶台边的那一个钟头",
    photo:"assets/grandma.jpg",
    text:"小时候每到过年，外婆天没亮就守在灶边。她从不用秤，糖放多少、火烧多久，全在她手上。我问她到底要炖多久，她总是笑着说——",
    words:"“火候到了就行喽，急不得。你坐着等，香味出来了就好了。”",
    voiceLabel:"外婆的原声 · 02:14"
  },
  {
    type:"recipe",
    cn:"腌笃鲜",
    by:"外婆 · 张桂芬",
    img:"assets/yanduxian.jpg",
    ingredients:["咸肉 一段","鲜五花 一块","春笋 两根","百叶结 一把","姜 几片"],
    steps:[
      "咸肉、鲜肉切块，分别焯水。",
      "砂锅里铺姜片，放入咸肉、鲜肉。",
      "加足量清水，大火烧开撇去浮沫。",
      "转小火笃上一个钟头，汤色变奶白。",
      "下春笋和百叶结，再笃半小时，鲜得眉毛都要掉。"
    ]
  },
  {
    type:"story",
    title:"一锅汤里的春天",
    photo:"assets/cover.jpg",
    text:"外婆说，腌笃鲜是要等春笋冒头才做的。咸肉是去年冬天腌的，鲜肉是当天买的，一咸一鲜在锅里咕嘟，叫“笃”。这锅汤里，藏着她对一整年的盘算。",
    words:"“咸的鲜的放一道，日子才有滋味。笋要当天挖的，等不得隔夜。”",
    voiceLabel:"外婆的原声 · 01:47"
  },
  { type:"end" }
];

/* ---------- 渲染 ---------- */
const book = document.getElementById("book");
let totalLeaves = pages.length; // 每个 page 数据 = 一张纸（含正反两面简化为单面内容）
let current = 0; // 当前已翻开的纸张数

function faceHTML(p, idx){
  if(p.type==="cover"){
    return `<div class="pad cover" style="position:absolute;inset:0;">
      <div class="inner">
        <span class="badge">家 味 之 书</span>
        <img class="cover-img" src="assets/grandma.jpg" alt="外婆"/>
        <h2>外婆的灶边</h2>
        <div class="sub">把家的味道<br/>变成可以传承的书</div>
      </div>
      <div class="tip">轻触书页，开始翻阅 →</div>
    </div>`;
  }
  if(p.type==="recipe"){
    return `<div class="pad">
      <div class="recipe-title"><span class="cn">${p.cn}</span><span class="by">— ${p.by}</span></div>
      <img class="dish-img" src="${p.img}" alt="${p.cn}"/>
      <div class="section-h">食材</div>
      <div class="ingredients">${p.ingredients.map(i=>`<span>${i}</span>`).join("")}</div>
      <div class="section-h">做法</div>
      <ol class="steps">${p.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
      <span class="page-num">第 ${idx} 页</span>
    </div>`;
  }
  if(p.type==="story"){
    return `<div class="pad story">
      <div class="quote-mark">&ldquo;</div>
      <img class="photo" src="${p.photo}" alt="老照片"/>
      <div class="section-h">${p.title}</div>
      <p class="story-text">${p.text}</p>
      <div class="grandma-words">${p.words}</div>
      <div class="voice" onclick="event.stopPropagation();this.classList.toggle('on')">
        <div class="play">▶</div>
        <div class="wave">${Array.from({length:18}).map((_,i)=>`<i style="animation-delay:${i*0.06}s"></i>`).join("")}</div>
        <div class="label">${p.voiceLabel}</div>
      </div>
      <span class="page-num">第 ${idx} 页</span>
    </div>`;
  }
  if(p.type==="end"){
    return `<div class="pad endpage" style="position:absolute;inset:0;">
      <div class="inner">
        <h3>味道会留下来</h3>
        <p>灶台会冷，照片会旧，<br/>但只要这本书还在，<br/>外婆的味道，就一直在家里。</p>
        <p style="opacity:.7;font-size:11px;margin-top:10px;">外婆的灶边 · 由 TRAE 打造<br/>世界很大，放手去造</p>
      </div>
    </div>`;
  }
  return "";
}

// 创建纸张：单页翻书。每张纸正面=该页内容，背面=空白纸；翻开后露出下一张纸正面
pages.forEach((p,i)=>{
  const leaf=document.createElement("div");
  leaf.className="page";
  leaf.dataset.index=i;
  const front=document.createElement("div");
  front.className="face front";
  front.innerHTML=faceHTML(p,i);
  const back=document.createElement("div");
  back.className="face back";
  back.innerHTML="<div class='pad'></div>";
  leaf.appendChild(front);
  leaf.appendChild(back);
  leaf.addEventListener("click",()=>{ if(+leaf.dataset.index===current) next(); });
  book.appendChild(leaf);
});

const leaves=[...document.querySelectorAll(".page")];
function render(){
  leaves.forEach((leaf,i)=>{
    if(i<current){ leaf.classList.add("flipped"); leaf.style.zIndex=i; }
    else { leaf.classList.remove("flipped"); leaf.style.zIndex=leaves.length-i; }
  });
  document.getElementById("progress").textContent=`${current} / ${leaves.length}`;
  document.getElementById("prev").disabled=current===0;
  document.getElementById("next").disabled=current>=leaves.length;
}
function next(){ if(current<leaves.length){current++;render();} }
function prev(){ if(current>0){current--;render();} }
document.getElementById("next").onclick=next;
document.getElementById("prev").onclick=prev;
document.getElementById("export").onclick=()=>window.print();
document.addEventListener("keydown",e=>{ if(e.key==="ArrowRight")next(); if(e.key==="ArrowLeft")prev(); });
render();
</script>
</body>
</html>
