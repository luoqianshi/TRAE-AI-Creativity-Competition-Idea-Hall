  { title: 'NumPy/Pandas', category: '基础知识', sub: '数据处理', level: '入门', desc: '数值计算与数据分析基础库', score: 9 },

const learningPath = [
  { title: 'Python基础', status: '已掌握', tier: 0, desc: '语法、数据结构、面向对象' },
  { title: 'NumPy/Pandas', status: '已掌握', tier: 0, desc: '数组操作、数据分析' },
  { title: '线性代数', status: '已掌握', tier: 0, desc: '矩阵、向量、特征分解' },
  { title: '概率统计', status: '已掌握', tier: 0, desc: '概率分布、统计推断' },
  { title: '机器学习入门', status: '已掌握', tier: 0, desc: '线性回归、逻辑回归' },
  { title: '神经网络', status: '学习中', tier: 1, desc: '反向传播、CNN基础' },
  { title: 'PyTorch实战', status: '学习中', tier: 1, desc: '搭建与训练模型' },
  { title: 'Transformer', status: '学习中', tier: 1, desc: '注意力机制原理' },
  { title: '大模型应用', status: '待学习', tier: 2, desc: 'Prompt工程、RAG' },
  { title: 'AI Agent开发', status: '待学习', tier: 2, desc: '智能体设计与实现' },
  { title: '模型微调', status: '待学习', tier: 2, desc: 'LoRA、全参数微调' },
  { title: '模型部署', status: '待学习', tier: 2, desc: '推理优化、量化压缩' },

// ── Scene ──
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.5, 200);
camera.position.set(0, 8, 40);
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.3;

// ── Controls ──
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.autoRotate = true; controls.autoRotateSpeed = 0.2;
controls.minDistance = 5; controls.maxDistance = 120;

// ── Universe Background ──
function buildStarfield(count, spread) {
  const g = new THREE.BufferGeometry();
  const p = new Float32Array(count * 3), c = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = spread * 0.4 + Math.random() * spread * 0.6;
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    p[i*3]=Math.cos(th)*Math.sin(ph)*r; p[i*3+1]=Math.sin(ph)*r; p[i*3+2]=Math.sin(th)*Math.sin(ph)*r;
    const col = new THREE.Color().setHSL(0.55 + Math.random() * 0.25, 0.5, 0.5 + Math.random() * 0.5);
    c[i*3]=col.r; c[i*3+1]=col.g; c[i*3+2]=col.b;
  }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.setAttribute('color', new THREE.BufferAttribute(c, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ size: 0.12, vertexColors: true, transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending }));
}
const starField = buildStarfield(2500, 80); scene.add(starField);

// Nebula
const nebGeo = new THREE.BufferGeometry();
const nbp = new Float32Array(600 * 3);
for (let i = 0; i < 600; i++) { nbp[i*3] = (Math.random() - 0.5) * 50; nbp[i*3+1] = (Math.random() - 0.5) * 35; nbp[i*3+2] = (Math.random() - 0.5) * 50; }
nebGeo.setAttribute('position', new THREE.BufferAttribute(nbp, 3));
const nebula = new THREE.Points(nebGeo, new THREE.PointsMaterial({ color: 0x3355cc, size: 0.6, transparent: true, opacity: 0.05, depthWrite: false, blending: THREE.AdditiveBlending }));
scene.add(nebula);

// Lights
scene.add(new THREE.AmbientLight(0x112244, 2));
const mainLight = new THREE.PointLight(0x4488ff, 50, 60); mainLight.position.set(10, 15, 10); scene.add(mainLight);
scene.add(new THREE.PointLight(0x8822ff, 25, 40));

// ── Dynamic content group ──
let contentGroup = new THREE.Group(); scene.add(contentGroup);
let currentMod = 0;

// ── Module Builder ──
function clearContent() {
  while (contentGroup.children.length > 0) {
    const ch = contentGroup.children[0];
    ch.traverse(c => { if (c.material) { if (Array.isArray(c.material)) c.material.forEach(m => m.dispose()); else c.material.dispose(); } if (c.geometry && !c.geometry._shared) c.geometry.dispose(); });
    contentGroup.remove(ch);
  }
}

function buildModule(mod) {
  clearContent(); currentMod = mod;
  if (mod === 0) buildKnowledgeGalaxy();
  else if (mod === 1) buildSkillTree();
  else buildLearningOrbit();
}

// ── Module 1: AI知识星系 ──
function buildKnowledgeGalaxy() {
  $('infoTitle').textContent = 'AI知识星系系统';
  $('infoSub').textContent = 'MACHINE LEARNING · DEEP LEARNING · GENERATIVE AI';
  $('legend').innerHTML = '<div class="l-item"><span class="l-dot" style="background:#4ecdc4;box-shadow:0 0 8px #4ecdc4;"></span>机器学习</div><div class="l-item"><span class="l-dot" style="background:#ff6b9d;box-shadow:0 0 8px #ff6b9d;"></span>深度学习</div><div class="l-item"><span class="l-dot" style="background:#ffa940;box-shadow:0 0 8px #ffa940;"></span>大模型应用</div><div class="l-item"><span class="l-dot" style="background:#60a0ff;box-shadow:0 0 8px #60a0ff;"></span>基础知识</div>';

  // Central core = AI Core
  const coreGeo = new THREE.IcosahedronGeometry(1.5, 3);
  const coreMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1, metalness: 0.9, emissive: 0x4488ff, emissiveIntensity: 0.6 });
  const core = new THREE.Mesh(coreGeo, coreMat); contentGroup.add(core);

  // Three orbital planes for AI domains
  const planes = [
    { name: '机器学习', color: 0x4ecdc4, tilt: 0, radius: 8, data: aiKnowledge.filter(t => t.category === '机器学习') },
    { name: '深度学习', color: 0xff6b9d, tilt: Math.PI / 3, radius: 12, data: aiKnowledge.filter(t => t.category === '深度学习') },
    { name: '大模型应用', color: 0xffa940, tilt: -Math.PI / 3, radius: 16, data: aiKnowledge.filter(t => t.category === '大模型应用') },
  ];

  planes.forEach(plane => {
    // Orbital ring
    const ring = new THREE.Mesh(new THREE.TorusGeometry(plane.radius, 0.03, 16, 128), new THREE.MeshBasicMaterial({ color: plane.color, transparent: true, opacity: 0.25, depthWrite: false }));
    ring.rotation.x = Math.PI / 2 + plane.tilt; contentGroup.add(ring);

    // Ring particles
    const pg = new THREE.BufferGeometry();
    const pp = new Float32Array(200 * 3);
    for (let i = 0; i < 200; i++) {
      const a = (i / 200) * Math.PI * 2;
      pp[i*3] = Math.cos(a) * plane.radius + (Math.random() - 0.5) * 0.5;
      pp[i*3+1] = (Math.random() - 0.5) * 0.3;
      pp[i*3+2] = Math.sin(a) * plane.radius + (Math.random() - 0.5) * 0.5;
    }
    pg.setAttribute('position', new THREE.BufferAttribute(pp, 3));
    const ringParticles = new THREE.Points(pg, new THREE.PointsMaterial({ color: plane.color, size: 0.08, transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending }));
    ringParticles.rotation.x = Math.PI / 2 + plane.tilt; contentGroup.add(ringParticles);

    // Knowledge nodes on this plane
    plane.data.forEach((t, i) => {
      const a = (i / plane.data.length) * Math.PI * 2;
      const r = plane.radius + (Math.random() - 0.5) * 2;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      const y = (Math.random() - 0.5) * 1;
      const geo = new THREE.IcosahedronGeometry(0.2 + t.score * 0.04, 0);
      const mat = new THREE.MeshStandardMaterial({ color: plane.color, roughness: 0.3, emissive: plane.color, emissiveIntensity: 0.4 });
      const node = new THREE.Mesh(geo, mat);
      node.position.set(x, y, z);
      node.userData = { knowledge: t, type: plane.name, color: plane.color };
      contentGroup.add(node);
    });
  });

  // Scatter foundational knowledge (blue)
  const basics = aiKnowledge.filter(t => t.category === '基础知识');
  basics.forEach((t, i) => {
    const r = 5 + Math.random() * 25;
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    const x = Math.cos(th) * Math.sin(ph) * r, y = Math.sin(ph) * r, z = Math.sin(th) * Math.sin(ph) * r;
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.08 + t.score * 0.02, 8, 8), new THREE.MeshBasicMaterial({ color: 0x60a0ff, transparent: true, opacity: 0.5, depthWrite: false }));
    dot.position.set(x, y, z);
    dot.userData = { knowledge: t, type: '基础知识', color: 0x60a0ff };
    contentGroup.add(dot);
  });

  camera.position.set(0, 15, 35); controls.target.set(0, 0, 0);
}

// ── Module 2: 学习技能树 ──
function buildSkillTree() {
  $('infoTitle').textContent = 'AI学习技能树';
  $('infoSub').textContent = 'FOUNDATION · ALGORITHM · PRACTICE · APPLICATION';
  $('legend').innerHTML = '<div class="l-item"><span class="l-dot" style="background:#44d4aa;box-shadow:0 0 8px #44d4aa;"></span>基础层</div><div class="l-item"><span class="l-dot" style="background:#ffb020;box-shadow:0 0 8px #ffb020;"></span>算法层</div><div class="l-item"><span class="l-dot" style="background:#60a0ff;box-shadow:0 0 8px #60a0ff;"></span>应用层</div>';

  // Tree trunk
  const trunkGeo = new THREE.CylinderGeometry(0.3, 0.5, 12, 16);
  const trunk = new THREE.Mesh(trunkGeo, new THREE.MeshStandardMaterial({ color: 0x3a5c40, roughness: 0.6, emissive: 0x2b4a30, emissiveIntensity: 0.2 }));
  trunk.position.y = -6; contentGroup.add(trunk);

  // Core at base
  const rootCore = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, emissive: 0x88ccff, emissiveIntensity: 0.5 }));
  rootCore.position.y = -12; contentGroup.add(rootCore);

  // Branch structure based on categories
  const categories = {};
  aiKnowledge.forEach(t => { const c = t.category; if (!categories[c]) categories[c] = []; categories[c].push(t); });

  const branchColors = [0x44d4aa, 0x60a0ff, 0xffb020, 0xff6b9d, 0xa29bfe, 0x4ecdc4];
  let bi = 0;
  Object.entries(categories).forEach(([cat, items], idx) => {
    if (idx > 7) return;
    const color = branchColors[bi++ % branchColors.length];
    const angle = (idx / Math.min(8, Object.keys(categories).length)) * Math.PI * 2;
    const branchLen = 6 + items.length * 0.15;

    // Branch line
    const start = new THREE.Vector3(0, -3, 0);
    const end = new THREE.Vector3(Math.cos(angle) * 4, 1 + idx * 0.5, Math.sin(angle) * 4);
    const mid = new THREE.Vector3(Math.cos(angle) * 2, -1, Math.sin(angle) * 2);
    const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
    const tube = new THREE.TubeGeometry(curve, 20, 0.12, 8, false);
    const branch = new THREE.Mesh(tube, new THREE.MeshStandardMaterial({ color, roughness: 0.4, emissive: color, emissiveIntensity: 0.3 }));
    contentGroup.add(branch);

    // Leaves = individual knowledge points
    items.slice(0, 20).forEach((t, i) => {
      const t_ = (i / Math.min(20, items.length));
      const pos = curve.getPoint(0.5 + t_ * 0.5);
      pos.x += (Math.random() - 0.5) * 2;
      pos.y += (Math.random() - 0.5) * 1.5;
      pos.z += (Math.random() - 0.5) * 2;
      const leaf = new THREE.Mesh(new THREE.OctahedronGeometry(0.15 + t.score * 0.03, 0), new THREE.MeshStandardMaterial({ color, roughness: 0.3, emissive: color, emissiveIntensity: 0.5 }));
      leaf.position.copy(pos);
      leaf.userData = { knowledge: t, type: '知识节点' };
      contentGroup.add(leaf);
    });

    // Category label node
    const labelNode = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4, 0), new THREE.MeshStandardMaterial({ color, roughness: 0.2, emissive: color, emissiveIntensity: 0.7 }));
    labelNode.position.copy(end);
    labelNode.userData = { name: cat, count: items.length, type: '领域分支' };
    contentGroup.add(labelNode);
  });

  camera.position.set(10, 5, 25); controls.target.set(0, -2, 0);
}

// ── Module 3: 学习路径轨道 ──
function buildLearningOrbit() {
  $('infoTitle').textContent = 'AI学习路径轨道';
  $('infoSub').textContent = 'LEARNING PATH · MASTERY · PROGRESS · FUTURE';
  $('legend').innerHTML = '<div class="l-item"><span class="l-dot" style="background:#44d4aa;box-shadow:0 0 8px #44d4aa;"></span>已掌握</div><div class="l-item"><span class="l-dot" style="background:#ffb020;box-shadow:0 0 8px #ffb020;"></span>学习中</div><div class="l-item"><span class="l-dot" style="background:#60a0ff;box-shadow:0 0 8px #60a0ff;"></span>待学习</div>';

  // Self at center
  const selfGeo = new THREE.IcosahedronGeometry(1, 3);
  const self = new THREE.Mesh(selfGeo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.05, metalness: 0.9, emissive: 0xffffff, emissiveIntensity: 0.8 }));
  contentGroup.add(self);
  // Self glow
  const selfGlow = new THREE.Mesh(new THREE.SphereGeometry(1.4, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.1, depthWrite: false }));
  contentGroup.add(selfGlow);

  // Orbital rings
  [4, 8, 13].forEach((r, i) => {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.015, 16, 128), new THREE.MeshBasicMaterial({ color: [0x44d4aa, 0xffb020, 0x60a0ff][i], transparent: true, opacity: 0.15, depthWrite: false }));
    ring.rotation.x = Math.PI / 2 + i * 0.5; ring.rotation.y = i * 0.8; contentGroup.add(ring);
  });

  // Learning items as planets
  learningPath.forEach((item, i) => {
    const tier = item.tier;
    const colors = [0x44d4aa, 0xffb020, 0x60a0ff];
    const radii = [4, 8, 13];
    const color = colors[tier];
    const radius = radii[tier] + (Math.random() - 0.5) * 2;
    const angle = (i / Math.max(1, learningPath.length)) * Math.PI * 2 + Math.random() * 0.3;
    const height = (Math.random() - 0.5) * 4;

    const planet = new THREE.Mesh(new THREE.SphereGeometry(0.15 + (2 - tier) * 0.05, 12, 12), new THREE.MeshStandardMaterial({ color, roughness: 0.4, emissive: color, emissiveIntensity: 0.5 }));
    planet.position.set(Math.cos(angle) * radius, height, Math.sin(angle) * radius);
    planet.userData = { pathItem: item, tier: ['已掌握', '学习中', '待学习'][tier], color };

    // Small orbit ring
    const orbitGeo = new THREE.TorusGeometry(0.25, 0.01, 8, 16);
    const orbitRing = new THREE.Mesh(orbitGeo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3, depthWrite: false }));
    orbitRing.position.copy(planet.position);
    orbitRing.rotation.x = Math.random() * Math.PI;
    contentGroup.add(orbitRing);

    contentGroup.add(planet);
  });

  camera.position.set(5, 15, 25); controls.target.set(0, 0, 0);
}

// ── Stats ──
function updateStats() {
  const total = aiKnowledge.length;
  const ml = aiKnowledge.filter(t => t.category === '机器学习').length;
  const dl = aiKnowledge.filter(t => t.category === '深度学习').length;
  const llm = aiKnowledge.filter(t => t.category === '大模型应用').length;
  $('stats').innerHTML = `
    <div class="stat-card"><div class="sv">${total}</div><div class="sl">知识点</div></div>
    <div class="stat-card"><div class="sv">${ml}</div><div class="sl">机器学习</div></div>
    <div class="stat-card"><div class="sv">${dl}</div><div class="sl">深度学习</div></div>
    <div class="stat-card"><div class="sv">${llm}</div><div class="sl">大模型应用</div></div>`;
}

// ── Hover / Tooltip ──
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tip = $('tooltip');
let hovered = null;

window.addEventListener('mousemove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const meshes = [];
  contentGroup.traverse(c => { if (c.isMesh && c.userData && (c.userData.knowledge || c.userData.pathItem || c.userData.name)) meshes.push(c); });
  const hits = raycaster.intersectObjects(meshes);
  const hit = hits.length > 0 ? hits[0].object : null;

  if (hit && hit.userData) {
    const ud = hit.userData;
    if (hovered !== hit) {
      if (hovered) hovered.scale?.setScalar(1);
      hovered = hit;
      hit.scale?.setScalar(1.8);
    }
    if (ud.knowledge) {
      const t = ud.knowledge;
      $('ttTitle').textContent = t.title;
      $('ttDetail').textContent = (t.desc || '暂无描述') + '\n\n分类: ' + (t.category || '-') + ' | 子类: ' + (t.sub || '-') + ' | 难度: ' + (t.level || '-');
      $('ttMeta').textContent = '重要度: ' + (t.score || '-') + '/10 | ' + (t.sub || '');
    } else if (ud.pathItem) {
      const p = ud.pathItem;
      $('ttTitle').textContent = p.title;
      $('ttDetail').textContent = (p.desc || '暂无描述');
      $('ttMeta').textContent = '状态: ' + (p.status || '-') + ' | 阶段: ' + (ud.tier || '-');
    } else if (ud.name) {
      $('ttTitle').textContent = ud.name;
      $('ttDetail').textContent = '包含 ' + (ud.count || 0) + ' 个知识节点';
      $('ttMeta').textContent = '类型: ' + (ud.type || '-');
    }
    tip.style.opacity = '1';
    tip.style.left = (e.clientX + 20) + 'px';
    tip.style.top = Math.min(e.clientY - 100, innerHeight - 300) + 'px';
    document.body.style.cursor = 'pointer';
  } else {
    if (hovered) { hovered.scale?.setScalar(1); hovered = null; }
    tip.style.opacity = '0';
    document.body.style.cursor = '';
  }
});

// ── Nav ──
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    buildModule(parseInt(btn.dataset.mod));
  });
});

// ── Animate ──
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  controls.update();

  // Rotate content group
  if (currentMod === 0) contentGroup.rotation.y += 0.001;
  else if (currentMod === 2) contentGroup.rotation.y += 0.002;

  nebula.rotation.y += 0.0002;
  mainLight.intensity = 45 + Math.sin(t * 0.7) * 10;

  renderer.render(scene, camera);
}

// ── Init ──
buildModule(0); updateStats(); animate();
window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
