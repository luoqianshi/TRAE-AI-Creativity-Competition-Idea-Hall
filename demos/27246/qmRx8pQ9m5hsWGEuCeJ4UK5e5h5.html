<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学术成长记录系统</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F5;--surface:#F5F3F0;--surface-elevated:#FFFFFF;
  --ink-primary:#2A2A2A;--ink-secondary:#6B6560;--ink-tertiary:#9A948E;
  --accent-sage:#A8B5A0;--accent-rose:#C9A9A6;--accent-warm:#D4C4B0;
  --border:#E5E0DA;--paper:#F5EFE0;
  --font-serif:'Crimson Pro',Georgia,'Times New Roman',serif;
  --font-sans:'Instrument Sans','Helvetica Neue',Arial,system-ui,sans-serif;
  --radius-sm:6px;--radius-md:10px;--radius-full:9999px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);color:var(--ink-primary);background:var(--paper);line-height:1.7}
.app-container{max-width:1200px;margin:0 auto;padding:var(--space-6) var(--space-7)}
h1,h2,h3{font-family:var(--font-serif)}
.tab-nav{display:flex;gap:var(--space-6);justify-content:center;margin-bottom:var(--space-6);padding-bottom:var(--space-3);border-bottom:2px solid var(--accent-warm)}
.tab-btn{font-family:var(--font-serif);font-size:18px;font-weight:600;color:var(--ink-tertiary);background:none;border:none;cursor:pointer;padding:var(--space-2);transition:color .2s}
.tab-btn.active{color:var(--ink-primary)}
.tab-btn:hover{color:var(--ink-secondary)}
.page-section{display:none}
.page-section.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5)}
.card{background:var(--surface);border:1px solid var(--ink-primary);border-radius:var(--radius-md);padding:var(--space-5);margin-bottom:var(--space-5);box-shadow:3px 3px 0 rgba(42,42,42,0.08)}
.card-title{font-size:20px;font-weight:700;margin-bottom:var(--space-3)}
.card-subtitle{font-size:13px;color:var(--ink-secondary);font-style:italic;font-family:var(--font-serif)}
.btn{font-family:var(--font-sans);font-size:14px;font-weight:600;padding:var(--space-3) var(--space-5);border:1px solid var(--ink-primary);border-radius:var(--radius-sm);cursor:pointer;background:var(--surface-elevated);color:var(--ink-primary);box-shadow:2px 2px 0 var(--ink-primary);transition:all .15s;display:inline-flex;align-items:center;gap:var(--space-2)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink-primary)}
.btn-primary{background:var(--accent-sage);color:#fff}
.btn-sm{padding:6px var(--space-3);font-size:13px}
.form-group{margin-bottom:var(--space-4)}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--ink-secondary);margin-bottom:var(--space-2);text-transform:uppercase;letter-spacing:0.05em}
.form-input{width:100%;font-size:14px;background:var(--surface-elevated);border:1px solid var(--ink-primary);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4);outline:none;box-shadow:2px 2px 0 rgba(42,42,42,0.06)}
.form-input:focus{border-color:var(--accent-sage)}
.form-row{display:flex;gap:var(--space-3)}
.form-row .form-group{flex:1}
.gpa-card{text-align:center;padding:var(--space-6)}
.gpa-number{font-family:var(--font-serif);font-size:64px;font-weight:700;color:var(--ink-primary);line-height:1}
.gpa-label{font-family:var(--font-serif);font-style:italic;color:var(--ink-secondary);font-size:14px;margin-top:var(--space-2)}
.prediction-result{background:var(--surface-elevated);border:1px solid var(--ink-primary);border-radius:var(--radius-sm);padding:var(--space-4);text-align:center;margin-top:var(--space-4)}
.pred-gpa{font-family:var(--font-serif);font-size:32px;font-weight:700}
.progress-track{background:var(--surface);border:1px solid var(--ink-primary);border-radius:var(--radius-full);height:12px;overflow:hidden;padding:2px}
.progress-fill{background:var(--accent-sage);border-radius:var(--radius-full);height:100%;transition:width .4s}
.pie-chart{width:140px;height:140px;border-radius:50%;border:2px solid var(--ink-primary);position:relative;margin:0 auto}
.course-item{display:flex;justify-content:space-between;padding:var(--space-3);border-bottom:1px dashed var(--accent-warm)}
.course-item:last-child{border-bottom:none}
.course-name{font-family:var(--font-serif);font-weight:600}
.course-score{font-family:var(--font-serif);font-weight:700}
.empty-state{text-align:center;padding:var(--space-6);color:var(--ink-tertiary);font-style:italic}
.sub-tab-nav{display:flex;justify-content:center;gap:var(--space-2);margin-bottom:var(--space-4);background:var(--paper);padding:var(--space-2);border-radius:var(--radius-sm);border:1px solid var(--ink-primary)}
.sub-tab-btn{font-size:14px;font-weight:600;background:none;border:none;padding:var(--space-3) var(--space-5);cursor:pointer;border-radius:var(--radius-sm);font-family:var(--font-serif)}
.sub-tab-btn.active{background:var(--ink-primary);color:var(--paper)}
.sub-tab-content{display:none}
.sub-tab-content.active{display:block}
.record-item{padding:var(--space-4);border:1px solid var(--accent-warm);border-radius:var(--radius-sm);margin-bottom:var(--space-2)}
.record-item:hover{border-color:var(--ink-primary)}
.record-title{font-family:var(--font-serif);font-weight:700;font-size:15px}
.record-meta{font-size:12px;color:var(--ink-tertiary);font-style:italic}
.growth-tree-area{display:flex;flex-direction:column;align-items:center;padding:var(--space-5);min-height:300px}
.growth-tree-svg{width:200px;height:260px}
.stamp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-3);margin-top:var(--space-4)}
.stamp-wrap{text-align:center;padding:var(--space-3)}
.stamp-svg{width:64px;height:64px}
.resume-preview{background:#FFFDF5;padding:var(--space-6);border:1px solid var(--ink-primary);border-radius:var(--radius-md);min-height:400px}
.resume-header{text-align:center;padding-bottom:var(--space-4);border-bottom:2px solid var(--ink-primary)}
.resume-name{font-family:var(--font-serif);font-size:28px;font-weight:700}
.resume-section-title{font-family:var(--font-serif);font-weight:700;margin-top:var(--space-4);margin-bottom:var(--space-2);display:flex;align-items:center;gap:var(--space-2)}
.resume-section-title::before,.resume-section-title::after{content:"";flex:1;height:1px;background:var(--accent-warm)}
.resume-course-item{display:flex;justify-content:space-between;padding:var(--space-2);border-bottom:1px dotted var(--accent-warm)}
.timeline-item{padding:var(--space-3) var(--space-3) var(--space-3) var(--space-6);border-left:2px dashed var(--accent-warm);margin-bottom:var(--space-2)}
.timeline-item::before{content:"✦";position:absolute;left:8px;color:var(--accent-rose);font-size:11px}
.badge-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--space-3);margin:var(--space-4) 0}
.badge-tag{padding:var(--space-4);border:2px solid var(--ink-primary);border-radius:10px;background:#FFFDF5;box-shadow:2px 2px 0 var(--ink-primary);min-width:100px;text-align:center}
.badge-tag svg{width:24px;height:24px;stroke:currentColor}
.badge-label{font-family:var(--font-serif);font-weight:700;font-size:13px}
.stat-row{display:flex;justify-content:space-between;padding:var(--space-3);border-bottom:1px dashed var(--accent-warm)}
.stat-label{font-family:var(--font-serif);font-size:13px;color:var(--ink-secondary)}
.stat-value{font-family:var(--font-serif);font-weight:700;font-size:18px}
.toast{position:fixed;bottom:var(--space-6);right:var(--space-6);background:var(--ink-primary);color:#fff;padding:var(--space-3) var(--space-5);border-radius:var(--radius-sm);font-size:14px;z-index:1000;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app-container" id="app">
<div style="text-align:center;margin-bottom:var(--space-6)">
  <h1 style="font-family:var(--font-serif);font-size:32px;font-weight:700;margin-bottom:var(--space-2)">一本关于你学业成长的个人杂志</h1>
  <p style="font-family:var(--font-serif);font-style:italic;color:var(--ink-secondary)">记录、推演、陪伴</p>
</div>
<nav class="tab-nav">
<button class="tab-btn active" data-tab="page1">学业管理</button>
<button class="tab-btn" data-tab="page2">成长记录</button>
<button class="tab-btn" data-tab="page3">简历导出</button>
</nav>

<section class="page-section active" id="page1">
<div class="grid-2col">
  <div>
    <div class="card">
      <h2 class="card-title">课程录入</h2>
      <p class="card-subtitle">Chapter I</p>
      <form id="courseForm" onsubmit="return false;">
        <div class="form-row">
          <div class="form-group" style="flex:2"><label class="form-label">课程名称</label><input class="form-input" id="courseName" type="text" placeholder="高等数学"></div>
          <div class="form-group"><label class="form-label">学分</label><input class="form-input" id="courseCredits" type="number" placeholder="4" min="0" max="8" step="0.5"></div>
          <div class="form-group"><label class="form-label">成绩</label><input class="form-input" id="courseScore" type="number" placeholder="90" min="0" max="100"></div>
        </div>
        <button class="btn btn-primary" type="button" id="addCourseBtn">添加课程</button>
        <input type="hidden" id="editingCourseId">
      </form>
    </div>
    <div class="card">
      <h2 class="card-title">课程名册</h2>
      <p class="card-subtitle">共 <span id="courseCount">0</span> 门课程</p>
      <div id="courseListContainer"></div>
    </div>
  </div>
  <div>
    <div class="card gpa-card">
      <h2 class="card-title">当前 GPA</h2>
      <div class="gpa-number" id="gpaDisplay">---</div>
      <div class="gpa-label" id="gpaLabel">还没有课程数据</div>
    </div>
    <div class="card">
      <h2 class="card-title">GPA 推演</h2>
      <p class="card-subtitle">What-if 模拟</p>
      <div class="form-row">
        <div class="form-group"><label class="form-label">课程</label><input class="form-input" id="predName" type="text" placeholder="选修课"></div>
        <div class="form-group"><label class="form-label">学分</label><input class="form-input" id="predCredits" type="number" placeholder="3" min="1" max="8" step="0.5"></div>
        <div class="form-group"><label class="form-label">假设成绩</label><input class="form-input" id="predScore" type="number" placeholder="85" min="0" max="100"></div>
      </div>
      <div class="prediction-result" id="predictionResult">输入假设分数查看预测结果</div>
    </div>
  </div>
</div>
<div class="card" style="margin-top:var(--space-5)">
  <h2 class="card-title">学分进度</h2>
  <div class="grid-2col">
    <div>
      <div style="display:flex;justify-content:space-between;margin-bottom:var(--space-2)"><span>进度</span><span style="font-family:var(--font-serif);font-weight:700;color:var(--accent-sage)" id="creditPercent">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="creditProgressFill" style="width:0%"></div></div>
      <div style="text-align:center;margin-top:var(--space-2);color:var(--ink-secondary);font-style:italic" id="creditMeta">已修 0 / 共 160 学分</div>
    </div>
    <div>
      <div style="text-align:center">
        <div class="pie-chart" id="creditPieChart"></div>
        <div style="display:flex;justify-content:center;gap:var(--space-4);margin-top:var(--space-3)">
          <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent-sage)"></span> 已修 <span id="pieEarned">0</span></div>
          <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent-warm)"></span> 剩余 <span id="pieRemaining">160</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</section>

<section class="page-section" id="page2">
<div class="grid-2col">
  <div class="card">
    <h2 class="card-title">成长之树</h2>
    <div class="growth-tree-area">
      <svg class="growth-tree-svg" id="growthTreeSvg" viewBox="0 0 200 300"></svg>
      <div style="font-family:var(--font-serif);font-style:italic;margin-top:var(--space-3)" id="treeStageLabel">种下一颗种子</div>
    </div>
  </div>
  <div class="card">
    <h2 class="card-title">成就印章</h2>
    <div id="stampGrid" class="stamp-grid"></div>
  </div>
</div>
<div class="card">
  <div class="sub-tab-nav">
    <button class="sub-tab-btn active" data-subtab="comp">竞赛</button>
    <button class="sub-tab-btn" data-subtab="intern">实习</button>
    <button class="sub-tab-btn" data-subtab="research">科研</button>
  </div>
  <div class="sub-tab-content active" id="compTab">
    <form onsubmit="return false;">
      <div class="form-row">
        <div class="form-group" style="flex:2"><label class="form-label">竞赛名称</label><input class="form-input" id="compName" type="text"></div>
        <div class="form-group"><label class="form-label">时间</label><input class="form-input" id="compTime" type="text"></div>
        <div class="form-group"><label class="form-label">角色</label><input class="form-input" id="compRole" type="text"></div>
      </div>
      <button class="btn btn-primary" type="button" onclick="addRecord('competition')">添加</button>
    </form>
    <div id="compList"></div>
  </div>
  <div class="sub-tab-content" id="internTab">
    <form onsubmit="return false;">
      <div class="form-row">
        <div class="form-group" style="flex:2"><label class="form-label">公司名称</label><input class="form-input" id="internName" type="text"></div>
        <div class="form-group"><label class="form-label">时间</label><input class="form-input" id="internTime" type="text"></div>
        <div class="form-group"><label class="form-label">岗位</label><input class="form-input" id="internRole" type="text"></div>
      </div>
      <button class="btn btn-primary" type="button" onclick="addRecord('internship')">添加</button>
    </form>
    <div id="internList"></div>
  </div>
  <div class="sub-tab-content" id="researchTab">
    <form onsubmit="return false;">
      <div class="form-row">
        <div class="form-group" style="flex:2"><label class="form-label">项目名称</label><input class="form-input" id="researchName" type="text"></div>
        <div class="form-group"><label class="form-label">时间</label><input class="form-input" id="researchTime" type="text"></div>
        <div class="form-group"><label class="form-label">角色</label><input class="form-input" id="researchRole" type="text"></div>
      </div>
      <button class="btn btn-primary" type="button" onclick="addRecord('research')">添加</button>
    </form>
    <div id="researchList"></div>
  </div>
</div>
</section>

<section class="page-section" id="page3">
<div class="grid-2col">
  <div class="card">
    <h2 class="card-title">简历预览</h2>
    <div class="resume-preview" id="resumePreview">
      <div class="resume-header">
        <div class="resume-name">学业成长简历</div>
        <div style="font-style:italic;color:var(--ink-secondary)" id="resumeGpaLine">GPA: -- | 共 0 门课程</div>
      </div>
      <div><div class="resume-section-title">教育背景</div><div id="resumeCourses"></div></div>
      <div><div class="resume-section-title">竞赛经历</div><div id="resumeCompetitions"></div></div>
      <div><div class="resume-section-title">实习经历</div><div id="resumeInternships"></div></div>
      <div><div class="resume-section-title">科研项目</div><div id="resumeResearch"></div></div>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:var(--space-4)" id="exportResumeBtn">导出 PDF</button>
  </div>
  <div>
    <div class="card">
      <h2 class="card-title">智能画像</h2>
      <div id="evalTagsContainer" class="badge-tags"></div>
    </div>
    <div class="card">
      <h2 class="card-title">数据总览</h2>
      <div id="quickStats">
        <div class="stat-row"><span class="stat-label">总 GPA</span><span class="stat-value" id="statGpa">--</span></div>
        <div class="stat-row"><span class="stat-label">已修学分</span><span class="stat-value" id="statCredits">0</span></div>
        <div class="stat-row"><span class="stat-label">竞赛记录</span><span class="stat-value" id="statComp">0</span></div>
        <div class="stat-row"><span class="stat-label">实习记录</span><span class="stat-value" id="statIntern">0</span></div>
        <div class="stat-row"><span class="stat-label">科研项目</span><span class="stat-value" id="statResearch">0</span></div>
      </div>
    </div>
  </div>
</div>
</section>

<div class="toast" id="toast"></div>

<script>
var appData={courses:[],records:{competition:[],internship:[],research:[]}};
function calcGpa(s){return s<0?0:Math.max(0,Math.min(4,s/10-5))}
function calcTotalGpa(c){if(!c.length)return null;var tw=0,tc=0;for(var i=0;i<c.length;i++){var cr=parseFloat(c[i].credits);if(cr>0){tw+=calcGpa(c[i].score)*cr;tc+=cr}}return tc?tw/tc:null}
function calcTotalCredits(c){return c.reduce(function(s,x){return s+parseFloat(x.credits||0)},0)}
function generateId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}

function renderPage1(){
  var c=appData.courses,g=calcTotalGpa(c);
  document.getElementById('gpaDisplay').textContent=g!==null?g.toFixed(2):'---';
  document.getElementById('gpaLabel').textContent=g!==null?'基于 '+c.length+' 门课程计算':'还没有课程数据';
  document.getElementById('courseCount').textContent=c.length;
  
  var cl=document.getElementById('courseListContainer');
  if(!c.length){cl.innerHTML='<div class="empty-state">暂无课程记录</div>';}
  else{
    var h='';
    for(var i=0;i<c.length;i++)h+='<div class="course-item"><span class="course-name">'+c[i].name+'</span><span class="course-score">'+c[i].score+'</span><span style="color:var(--ink-secondary)">('+c[i].credits+'学分)</span><button class="btn btn-sm" style="margin-left:auto" onclick="deleteCourse(\''+c[i].id+'\')">删除</button></div>';
    cl.innerHTML=h;
  }
  
  var totalCredits=calcTotalCredits(c),percent=Math.round((totalCredits/160)*100);
  document.getElementById('creditPercent').textContent=percent+'%';
  document.getElementById('creditProgressFill').style.width=percent+'%';
  document.getElementById('creditMeta').textContent='已修 '+totalCredits.toFixed(1)+' / 共 160 学分';
  document.getElementById('pieEarned').textContent=totalCredits.toFixed(1);
  document.getElementById('pieRemaining').textContent=(160-totalCredits).toFixed(1);
  
  var pc=document.getElementById('creditPieChart');
  pc.style.background='conic-gradient(var(--accent-sage) '+percent+'%, var(--accent-warm) '+percent+'% 100%)';
  
  var predCredits=parseFloat(document.getElementById('predCredits').value),predScore=parseFloat(document.getElementById('predScore').value);
  if(predCredits>0&&!isNaN(predScore)){
    var pg=calcTotalGpa(c.concat([{credits:predCredits,score:predScore}]));
    document.getElementById('predictionResult').innerHTML='<div class="pred-gpa">'+pg.toFixed(2)+'</div><div style="font-size:12px;color:var(--ink-secondary)">预计 GPA（含 '+predCredits+' 学分）</div>';
  }else{
    document.getElementById('predictionResult').textContent='输入假设分数查看预测结果';
  }
}

function renderPage2(){
  var s=appData.courses.length+appData.records.competition.length+appData.records.internship.length+appData.records.research.length;
  var stage=s===0?0:s<=3?1:s<=7?2:s<=12?3:4;
  var labels=['种下一颗种子','小苗破土而出','树苗茁壮成长','枝叶日渐繁茂','大树开花结果'];
  document.getElementById('treeStageLabel').textContent=labels[stage];
  
  var svg=document.getElementById('growthTreeSvg');
  var colors=['#D4C4B0','#A8B5A0','#8FA088','#7A9A70','#5A8A50'];
  var cx=100,gy=260;
  var html='<ellipse cx="'+cx+'" cy="'+gy+'" rx="50" ry="5" fill="var(--border)" opacity="0.5"/>';
  
  if(stage===0){
    html+='<ellipse cx="'+cx+'" cy="'+(gy-5)+'" rx="8" ry="6" fill="'+colors[0]+'" opacity="0.6"/>';
  }else{
    var trunkH=[0,30,60,90,120][stage];
    html+='<path d="M '+cx+' '+gy+' L '+cx+' '+(gy-trunkH)+'" stroke="'+colors[stage]+'" stroke-width="6" stroke-linecap="round"/>';
    
    var branches=[
      [],
      [{x:cx,y:gy-20,len:20,angle:-45}],
      [{x:cx,y:gy-30,len:25,angle:-45},{x:cx,y:gy-50,len:20,angle:45}],
      [{x:cx,y:gy-30,len:30,angle:-45},{x:cx,y:gy-50,len:25,angle:45},{x:cx,y:gy-70,len:20,angle:-30}],
      [{x:cx,y:gy-30,len:35,angle:-50},{x:cx,y:gy-50,len:30,angle:50},{x:cx,y:gy-70,len:25,angle:-30},{x:cx,y:gy-90,len:20,angle:30}]
    ];
    
    for(var i=0;i<branches[stage].length;i++){
      var b=branches[stage][i],rad=b.angle*Math.PI/180;
      html+='<path d="M '+b.x+' '+b.y+' L '+(b.x+b.len*Math.cos(rad))+' '+(b.y-b.len*Math.sin(rad))+'" stroke="'+colors[stage]+'" stroke-width="3" stroke-linecap="round"/>';
      
      var leafCount=[0,2,4,6,8][stage];
      for(var j=0;j<leafCount;j++){
        var lx=b.x+(b.len*Math.cos(rad))*0.5+Math.random()*10-5;
        var ly=b.y-(b.len*Math.sin(rad))*0.5+Math.random()*10-5;
        html+='<ellipse cx="'+lx+'" cy="'+ly+'" rx="5" ry="3" fill="'+colors[stage]+'" opacity="0.8" transform="rotate('+Math.random()*360+' '+lx+' '+ly+')"/>';
      }
    }
  }
  svg.innerHTML=html;
  
  var stamps=[
    {id:'diligent',name:'全勤',cond:function(d){return d.courses.length>0}},
    {id:'comp',name:'竞赛',cond:function(d){return d.records.competition.length>=3}},
    {id:'intern',name:'实习',cond:function(d){return d.records.internship.length>=2}},
    {id:'research',name:'科研',cond:function(d){return d.records.research.length>=3}},
    {id:'allround',name:'全能',cond:function(d){return d.records.competition.length>=1&&d.records.internship.length>=1&&d.records.research.length>=1}}
  ];
  
  var sg=document.getElementById('stampGrid');
  var unlocked=0;
  var h='';
  for(var i=0;i<stamps.length;i++){
    var u=stamps[i].cond(appData);
    if(u)unlocked++;
    h+='<div class="stamp-wrap"'+(u?'':' style="opacity:0.4"')+'><div style="width:64px;height:64px;border:2px solid '+ (u?'#C9A9A6':'#D4C4B0') +';border-radius:50%;display:flex;align-items:center;justify-content:center"><span style="font-family:var(--font-serif);font-size:20px;color:'+(u?'#C9A9A6':'#9A948E')+'">'+stamps[i].name+'</span></div><div style="font-family:var(--font-serif);font-size:11px;margin-top:8px">'+stamps[i].name+'</div><div style="font-size:10px;color:'+(u?'#C9A9A6':'#9A948E')+'">'+(u?'已解锁':'未解锁')+'</div></div>';
  }
  sg.innerHTML=h;
  
  function rr(cid,type){var c=document.getElementById(cid),r=appData.records[type];if(!r.length){c.innerHTML='<div class="empty-state">暂无记录</div>';return}var h='';for(var i=0;i<r.length;i++)h+='<div class="record-item"><div class="record-title">'+r[i].name+'</div><div class="record-meta">'+(r[i].time||'')+(r[i].role?' · '+r[i].role:'')+'</div><button class="btn btn-sm" onclick="deleteRecord(\''+type+'\',\''+r[i].id+'\')" style="margin-top:8px">删除</button></div>';c.innerHTML=h}
  rr('compList','competition');rr('internList','internship');rr('researchList','research');
}

function renderPage3(){
  var c=appData.courses,g=calcTotalGpa(c);
  document.getElementById('resumeGpaLine').textContent='GPA: '+(g!==null?g.toFixed(2):'--')+' | 共 '+c.length+' 门课程';
  
  function rc(containerId,data,formatFn){var el=document.getElementById(containerId);if(!data.length){el.innerHTML='<div class="empty-state">暂无记录</div>';return}var h='';for(var i=0;i<data.length;i++)h+=formatFn(data[i]);el.innerHTML=h}
  
  rc('resumeCourses',c,function(item){return'<div class="resume-course-item"><span>'+item.name+'</span><span>'+item.score+'分 ('+item.credits+'学分)</span></div>'});
  rc('resumeCompetitions',appData.records.competition,function(item){return'<div class="timeline-item"><div>'+item.name+'</div><div style="font-size:12px;color:var(--ink-tertiary)">'+(item.time||'')+(item.role?' · '+item.role:'')+'</div></div>'});
  rc('resumeInternships',appData.records.internship,function(item){return'<div class="timeline-item"><div>'+item.name+'</div><div style="font-size:12px;color:var(--ink-tertiary)">'+(item.time||'')+(item.role?' · '+item.role:'')+'</div></div>'});
  rc('resumeResearch',appData.records.research,function(item){return'<div class="timeline-item"><div>'+item.name+'</div><div style="font-size:12px;color:var(--ink-tertiary)">'+(item.time||'')+(item.role?' · '+item.role:'')+'</div></div>'});
  
  var tags=[];
  if(g!==null&&g>3.8)tags.push({name:'学神',type:'rose'});
  else if(g!==null&&g>3.0)tags.push({name:'学霸',type:'sage'});
  var pt=appData.records.competition.length+appData.records.internship.length+appData.records.research.length;
  if(pt>3)tags.push({name:'实践达人',type:'sage'});
  if(appData.records.research.length>=2)tags.push({name:'科研新星',type:'rose'});
  if(g!==null&&g>3.0&&pt>3)tags.push({name:'全面发展',type:'warm'});
  
  var tc=document.getElementById('evalTagsContainer');
  if(!tags.length&&!c.length){tc.innerHTML='<div class="empty-state">开始记录你的旅程</div>';}
  else{
    var h='';
    for(var i=0;i<tags.length;i++)h+='<div class="badge-tag"><div class="badge-label">'+tags[i].name+'</div><div style="font-size:10px;color:var(--ink-tertiary)">UNLOCKED</div></div>';
    tc.innerHTML=h;
  }
  
  document.getElementById('statGpa').textContent=g!==null?g.toFixed(2):'--';
  document.getElementById('statCredits').textContent=calcTotalCredits(c).toFixed(1);
  document.getElementById('statComp').textContent=appData.records.competition.length;
  document.getElementById('statIntern').textContent=appData.records.internship.length;
  document.getElementById('statResearch').textContent=appData.records.research.length;
}

function addCourse(){
  var n=document.getElementById('courseName').value.trim(),cd=parseFloat(document.getElementById('courseCredits').value),sc=parseFloat(document.getElementById('courseScore').value);
  if(!n||isNaN(cd)||cd<=0||isNaN(sc)||sc<0||sc>100){showToast('请填写完整信息');return}
  appData.courses.push({id:generateId(),name:n,credits:cd,score:sc});
  document.getElementById('courseName').value='';document.getElementById('courseCredits').value='';document.getElementById('courseScore').value='';
  renderAll();showToast('课程已添加');
}

function deleteCourse(id){appData.courses=appData.courses.filter(function(x){return x.id!==id});renderAll();showToast('课程已删除')}
function addRecord(type){
  var n,t,r;
  if(type==='competition'){n=document.getElementById('compName').value.trim();t=document.getElementById('compTime').value.trim();r=document.getElementById('compRole').value.trim();}
  else if(type==='internship'){n=document.getElementById('internName').value.trim();t=document.getElementById('internTime').value.trim();r=document.getElementById('internRole').value.trim();}
  else{n=document.getElementById('researchName').value.trim();t=document.getElementById('researchTime').value.trim();r=document.getElementById('researchRole').value.trim();}
  if(!n){showToast('请填写名称');return}
  appData.records[type].push({id:generateId(),name:n,time:t,role:r});
  if(type==='competition'){document.getElementById('compName').value='';document.getElementById('compTime').value='';document.getElementById('compRole').value='';}
  else if(type==='internship'){document.getElementById('internName').value='';document.getElementById('internTime').value='';document.getElementById('internRole').value='';}
  else{document.getElementById('researchName').value='';document.getElementById('researchTime').value='';document.getElementById('researchRole').value='';}
  renderAll();showToast('记录已添加');
}
function deleteRecord(type,id){appData.records[type]=appData.records[type].filter(function(x){return x.id!==id});renderAll();showToast('记录已删除')}
function exportResume(){
  var t='===== 学业成长简历 =====\n\n';
  var g=calcTotalGpa(appData.courses);
  t+='GPA: '+(g!==null?g.toFixed(2):'--')+'\n课程数: '+appData.courses.length+'\n\n';
  t+='--- 教育背景 ---\n';
  for(var i=0;i<appData.courses.length;i++)t+=appData.courses[i].name+': '+appData.courses[i].score+'分 ('+appData.courses[i].credits+'学分)\n';
  t+='\n--- 竞赛经历 ---\n';
  for(var i=0;i<appData.records.competition.length;i++)t+=appData.records.competition[i].name+(appData.records.competition[i].time?' ('+appData.records.competition[i].time+')':'')+'\n';
  t+='\n--- 实习经历 ---\n';
  for(var i=0;i<appData.records.internship.length;i++)t+=appData.records.internship[i].name+(appData.records.internship[i].time?' ('+appData.records.internship[i].time+')':'')+'\n';
  t+='\n--- 科研项目 ---\n';
  for(var i=0;i<appData.records.research.length;i++)t+=appData.records.research[i].name+(appData.records.research[i].time?' ('+appData.records.research[i].time+')':'')+'\n';
  var b=new Blob([t],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='学业简历.txt';a.click();URL.revokeObjectURL(u);showToast('简历已导出');
}

function renderAll(){renderPage1();renderPage2();renderPage3()}

document.getElementById('addCourseBtn').addEventListener('click',addCourse);
document.getElementById('exportResumeBtn').addEventListener('click',exportResume);
document.querySelectorAll('.tab-btn').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.tab-btn').forEach(function(x){x.classList.remove('active')});b.classList.add('active');document.querySelectorAll('.page-section').forEach(function(x){x.classList.remove('active')});document.getElementById(b.dataset.tab).classList.add('active')})});
document.querySelectorAll('.sub-tab-btn').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.sub-tab-btn').forEach(function(x){x.classList.remove('active')});b.classList.add('active');document.querySelectorAll('.sub-tab-content').forEach(function(x){x.classList.remove('active')});document.getElementById(b.dataset.subtab+'Tab').classList.add('active')})});
document.getElementById('predCredits').addEventListener('input',renderPage1);
document.getElementById('predScore').addEventListener('input',renderPage1);

renderAll();
</script>
</body>
</html>
