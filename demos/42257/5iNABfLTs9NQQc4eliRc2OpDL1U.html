<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知阅伴学 - AI无障碍阅读学习助手 Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", sans-serif;
    }
    body {
      background: #f5f7fa;
      color: #333;
    }
    header {
      background: #407bff;
      color: white;
      padding: 16px 30px;
      box-shadow: 0 2px 8px #0002;
    }
    .header-wrap {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 22px;
      font-weight: bold;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .card h3 {
      margin-bottom: 16px;
      color: #222;
      border-left: 4px solid #407bff;
      padding-left: 10px;
    }
    .upload-area {
      border: 2px dashed #c9d8f0;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }
    .upload-area:hover {
      border-color: #407bff;
      background: #f0f6ff;
    }
    input[type="file"] {
      display: none;
    }
    .btn {
      background: #407bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      margin: 8px 4px;
    }
    .btn.gray {
      background: #999;
    }
    .btn.large {
      padding: 12px 28px;
      font-size: 16px;
    }
    .text-box {
      width: 100%;
      min-height: 220px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 14px;
      margin-top: 10px;
      resize: vertical;
      font-size: 16px;
      line-height: 1.6;
    }
    .tool-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .font-big {
      font-size: 24px !important;
      line-height: 1.8;
      letter-spacing: 1px;
    }
    .audio-box {
      margin-top: 16px;
      padding: 12px;
      background: #f8faff;
      border-radius: 8px;
    }
    .summary-block {
      background: #fff8e8;
      padding: 14px;
      border-radius: 8px;
      margin-top: 12px;
      border-left: 4px solid #ffb800;
    }
    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      margin-top: 60px;
    }
  </style>
</head>
<body>
<header>
  <div class="header-wrap">
    <div class="logo">知阅伴学 · AI无障碍阅读助手 Demo</div>
    <div>#学习工作赛道</div>
  </div>
</header>

<div class="container">
  <!-- 左侧：文档上传与文本区域 -->
  <div class="card">
    <h3>文档/文字导入区</h3>
    <div class="upload-area" id="uploadBox">
      <p>点击上传 PDF/图片/Word 文档（Demo仅模拟）</p>
      <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.png,.jpg">
    </div>
    <p style="margin:10px 0">或直接粘贴文本：</p>
    <textarea class="text-box" id="originText" placeholder="粘贴课件、作业、文章内容...">人工智能正在改变现代学习方式，对于视力障碍、读写困难人群，普通文字资料很难自主阅读。传统朗读工具仅机械播报文字，无法提炼重点、划分知识点，学习效率低下。本工具提供AI摘要、分段朗读、大字护眼模式，降低特殊群体学习门槛。</textarea>
    <div class="tool-bar">
      <button class="btn" id="bigFontBtn">切换大字无障碍模式</button>
      <button class="btn gray" id="resetBtn">重置文本</button>
    </div>
  </div>

  <!-- 右侧：AI功能结果区 -->
  <div class="card">
    <h3>AI智能处理结果</h3>
    <button class="btn large" id="readBtn">开始AI语音朗读</button>
    <button class="btn large" id="summaryBtn">一键提取学习重点</button>

    <div class="audio-box">
      <p>朗读状态：<span id="readStatus">未开始</span></p>
      <audio id="audioPlayer" controls style="width:100%;margin-top:8px;">
        <source src="" type="audio/mpeg">
      
    </div>

    <h4 style="margin-top:18px">内容摘要</h4>
    <div class="summary-block" id="summaryResult">
      点击【一键提取学习重点】生成AI摘要
    </div>
  </div>
</div>

<footer>
  TRAE Work Demo产物 · 纯前端静态页面，无后端接口，仅用于赛道创意展示
</footer>

<script>
  // DOM元素
  const uploadBox = document.getElementById('uploadBox');
  const fileInput = document.getElementById('fileInput');
  const originText = document.getElementById('originText');
  const bigFontBtn = document.getElementById('bigFontBtn');
  const resetBtn = document.getElementById('resetBtn');
  const readBtn = document.getElementById('readBtn');
  const summaryBtn = document.getElementById('summaryBtn');
  const readStatus = document.getElementById('readStatus');
  const summaryResult = document.getElementById('summaryResult');
  const audioPlayer = document.getElementById('audioPlayer');

  // 上传模拟
  uploadBox.onclick = () => fileInput.click();
  fileInput.onchange = function() {
    if(this.files.length > 0) {
      alert(`Demo模拟：已读取文件【${this.files[0].name}】，文本已填充至左侧输入框`);
      originText.value = "模拟文档内容：中小学语文课件、职场培训资料，支持图片文字识别、PDF全文提取，适配视障学生自学场景。";
    }
  }

  // 大字模式切换
  let bigFontMode = false;
  bigFontBtn.onclick = () => {
    bigFontMode = !bigFontMode;
    if(bigFontMode){
      originText.classList.add('font-big');
      bigFontBtn.innerText = "恢复标准字体";
    }else{
      originText.classList.remove('font-big');
      bigFontBtn.innerText = "切换大字无障碍模式";
    }
  }

  // 重置文本
  resetBtn.onclick = () => {
    originText.value = "";
    summaryResult.innerText = "点击【一键提取学习重点】生成AI摘要";
    readStatus.innerText = "未开始";
    audioPlayer.pause();
  }

  // 模拟朗读
  readBtn.onclick = () => {
    if(!originText.value.trim()){
      alert("请先输入或上传文本内容！");
      return;
    }
    readStatus.innerText = "正在朗读中（Demo模拟语音）";
    // 前端Web Speech API 原生文字转语音，无需接口
    const speech = new SpeechSynthesisUtterance(originText.value);
    speech.lang = "zh-CN";
    speech.rate = 0.9;
    window.speechSynthesis.speak(speech);
    speech.onend = () => readStatus.innerText = "朗读完成";
  }

  // 模拟AI摘要
  summaryBtn.onclick = () => {
    const text = originText.value.trim();
    if(!text){
      summaryResult.innerText = "无有效文本，无法提取重点";
      return;
    }
    // Demo固定模拟摘要逻辑
    summaryResult.innerHTML = `
      <strong>AI提炼学习要点：</strong><br>
      1. 痛点：特殊人群阅读资料依赖他人协助，普通朗读工具无智能整理功能<br>
      2. 产品能力：文档识别、语音朗读、大字护眼、知识点摘要<br>
      3. 用户价值：自主学习，大幅提升阅读与资料整理效率
    `;
  }
</script>
</body>
</html>
