<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>色彩情绪实验室 · Color Mood Lab</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#fafafa;--ink:#1a1a2e;--muted:#6c6c80}
  body{
    font-family:'Poppins','PingFang SC',sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;
    transition:background 1s ease;
  }
  .lab{max-width:1100px;margin:0 auto;padding:28px 20px}
  header{text-align:center;margin-bottom:32px}
  header .tag{display:inline-block;padding:4px 16px;border-radius:20px;font-size:11px;letter-spacing:3px;
    background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#a55eea);color:#fff;margin-bottom:12px;text-transform:uppercase}
  header h1{font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:-1px;
    background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#a55eea,#ff6b6b);
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shift 6s linear infinite}
  @keyframes shift{to{background-position:300% 0}}
  header p{margin-top:8px;font-size:14px;color:var(--muted)}

  .main-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;margin-bottom:30px}

  /* 色轮选择器 */
  .wheel-box{background:#fff;border-radius:24px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.06);border:1px solid #f0f0f0}
  .wheel-box h3{font-size:14px;font-weight:600;margin-bottom:16px;color:var(--ink);letter-spacing:1px}
  .color-wheel{position:relative;width:240px;height:240px;margin:0 auto;cursor:pointer}
  .color-wheel canvas{width:100%;height:100%;border-radius:50%}
  .wheel-pointer{position:absolute;width:16px;height:16px;border:3px solid #fff;border-radius:50%;
    box-shadow:0 2px 8px rgba(0,0,0,.3);transform:translate(-50%,-50%);pointer-events:none;transition:all .15s}
  .picked-info{text-align:center;margin-top:16px}
  .picked-swatch{width:100%;height:60px;border-radius:14px;margin-bottom:10px;transition:background .3s;box-shadow:0 4px 14px rgba(0,0,0,.1)}
  .picked-hex{font-family:'Consolas',monospace;font-size:18px;font-weight:700;letter-spacing:1px}
  .picked-name{font-size:13px;color:var(--muted);margin-top:4px}

  /* 情绪分析 */
  .mood-box{background:#fff;border-radius:24px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.06);border:1px solid #f0f0f0}
  .mood-box h3{font-size:14px;font-weight:600;margin-bottom:16px;color:var(--ink);letter-spacing:1px}
  .mood-result{text-align:center;padding:20px 0}
  .mood-emoji{font-size:64px;margin-bottom:12px;transition:transform .4s}
  .mood-emoji:hover{transform:scale(1.15) rotate(5deg)}
  .mood-name{font-size:24px;font-weight:800;margin-bottom:6px}
  .mood-desc{font-size:13px;color:var(--muted);line-height:1.7;max-width:320px;margin:0 auto}
  .mood-traits{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
  .trait{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;color:#fff;transition:transform .3s}
  .trait:hover{transform:translateY(-3px)}

  /* 色彩心理学卡片 */
  .section-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .palette-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:30px}
  .palette-card{border-radius:18px;overflow:hidden;cursor:pointer;transition:all .35s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 14px rgba(0,0,0,.06)}
  .palette-card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 14px 30px rgba(0,0,0,.12)}
  .palette-card .pc-color{height:100px;transition:height .3s}
  .palette-card .pc-body{padding:14px;background:#fff}
  .palette-card .pc-name{font-size:14px;font-weight:700}
  .palette-card .pc-mood{font-size:11px;color:var(--muted);margin-top:3px}
  .palette-card .pc-hex{font-size:11px;font-family:'Consolas',monospace;color:var(--muted);margin-top:4px}

  /* 渐变生成器 */
  .gradient-box{background:#fff;border-radius:24px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.06);border:1px solid #f0f0f0;margin-bottom:30px}
  .gradient-preview{height:120px;border-radius:18px;margin-bottom:14px;transition:background .5s;box-shadow:0 4px 14px rgba(0,0,0,.1)}
  .gradient-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .gc-label{font-size:12px;color:var(--muted);font-weight:600}
  .gc-color{width:44px;height:44px;border-radius:12px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer}
  .gc-angle{flex:1;min-width:120px}
  .gc-angle input{width:100%}
  .gc-text{flex-basis:100%;font-family:'Consolas',monospace;font-size:12px;color:var(--muted);background:#f8f8f8;padding:10px 14px;border-radius:10px;word-break:break-all}
  .preset-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .preset{padding:6px 14px;border:1px solid #e0e0e0;border-radius:20px;font-size:12px;cursor:pointer;transition:all .3s;background:#fff}
  .preset:hover{border-color:var(--ink);transform:translateY(-2px)}

  /* 色彩心理学手风琴 */
  .psy-acc{display:flex;flex-direction:column;gap:10px}
  .psy-item{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #f0f0f0;transition:all .3s}
  .psy-item:hover{box-shadow:0 6px 18px rgba(0,0,0,.06)}
  .psy-head{padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:12px}
  .psy-head .psy-dot{width:28px;height:28px;border-radius:50%;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .psy-head .psy-name{flex:1;font-weight:700;font-size:14px}
  .psy-head .psy-keyword{font-size:12px;color:var(--muted)}
  .psy-head .psy-arrow{transition:transform .35s;color:var(--muted)}
  .psy-item.open .psy-arrow{transform:rotate(180deg)}
  .psy-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
  .psy-body-inner{padding:0 18px 16px;font-size:13px;line-height:1.8;color:var(--muted)}
  .psy-body-inner .psy-app{margin-top:8px;padding:10px 14px;border-radius:10px;font-size:12px}
  .psy-body-inner .psy-app b{color:var(--ink)}

  footer{text-align:center;padding:28px 0;color:var(--muted);font-size:12px}
  @media(max-width:768px){.main-grid{grid-template-columns:1fr}.color-wheel{width:200px;height:200px}}
</style>
</head>
<body>
<div class="lab">
  <header>
    <div class="tag">COLOR MOOD LAB</div>
    <h1>色彩情绪实验室</h1>
    <p>每一种颜色，都藏着一种心情</p>
  </header>

  <div class="main-grid">
    <div class="wheel-box">
      <h3>🎨 色轮选色器</h3>
      <div class="color-wheel">
        <canvas id="wheel" width="240" height="240"></canvas>
        <div class="wheel-pointer" id="pointer" style="left:50%;top:50%"></div>
      </div>
      <div class="picked-info">
        <div class="picked-swatch" id="swatch" style="background:#ff6b6b"></div>
        <div class="picked-hex" id="hex">#FF6B6B</div>
        <div class="picked-name" id="cName">珊瑚红</div>
      </div>
    </div>
    <div class="mood-box">
      <h3>💫 色彩情绪分析</h3>
      <div class="mood-result">
        <div class="mood-emoji" id="moodEmoji">🔥</div>
        <div class="mood-name" id="moodName">热情活力</div>
        <div class="mood-desc" id="moodDesc">珊瑚红传递着温暖与能量，象征着生命力与热情。它能激发行动力，适合用于需要鼓舞士气的场景。</div>
        <div class="mood-traits" id="moodTraits"></div>
      </div>
    </div>
  </div>

  <div class="section-title">🌈 经典情绪色板</div>
  <div class="palette-grid" id="paletteGrid"></div>

  <div class="gradient-box">
    <h3 style="font-size:14px;font-weight:600;margin-bottom:16px">✨ 渐变生成器</h3>
    <div class="gradient-preview" id="gradPreview" style="background:linear-gradient(135deg,#ff6b6b,#feca57)"></div>
    <div class="gradient-controls">
      <span class="gc-label">起始色</span>
      <div class="gc-color" id="gc1" style="background:#ff6b6b" onclick="pickGrad(1)"></div>
      <span class="gc-label">结束色</span>
      <div class="gc-color" id="gc2" style="background:#feca57" onclick="pickGrad(2)"></div>
      <div class="gc-angle"><span class="gc-label">角度: <span id="angleVal">135</span>°</span><input type="range" id="angleSlider" min="0" max="360" value="135" style="width:100%"></div>
      <div class="gc-text" id="gradCSS">background: linear-gradient(135deg, #ff6b6b, #feca57);</div>
    </div>
    <div class="preset-btns" id="presetBtns"></div>
  </div>

  <div class="section-title">🧠 色彩心理学解码</div>
  <div class="psy-acc" id="psyAcc"></div>

  <footer>色彩是光的诗歌 · Color Mood Lab © 2026</footer>
</div>
<script>
// 色轮
const cv=document.getElementById('wheel'),ctx=cv.getContext('2d');
const cx=120,cy=120,r=110;
for(let a=0;a<360;a++){
  for(let rad=0;rad<r;rad+=1){
    const hue=a;const sat=rad/r*100;const light=55;
    ctx.fillStyle=`hsl(${hue},${sat}%,${light}%)`;
    const ang=a*Math.PI/180;const x=cx+Math.cos(ang)*rad;const y=cy+Math.sin(ang)*rad;
    ctx.fillRect(x,y,2,2);
  }
}
const colorData=[
  {range:[0,15],name:'正红',hex:'#E63946',emoji:'🔥',mood:'热情似火',desc:'正红是最具能量的颜色，象征爱情、勇气与力量。它能加速心跳、激发食欲，是行动派的颜色。',traits:['热情','勇气','力量','危险'],app:'餐饮品牌、促销活动'},
  {range:[15,45],name:'珊瑚橙',hex:'#FF6B6B',emoji:'🌅',mood:'温暖活力',desc:'珊瑚橙融合了红色的热情与黄色的明朗，传递温暖与社交性，令人感到亲切与乐观。',traits:['温暖','社交','乐观','亲和'],app:'社交App、生活方式品牌'},
  {range:[45,70],name:'阳光黄',hex:'#FFD93D',emoji:'☀️',mood:'快乐明朗',desc:'黄色是光谱中最明亮的颜色，象征智慧、希望与快乐。它能刺激思维活跃度，提升注意力。',traits:['快乐','智慧','希望','警觉'],app:'儿童产品、教育平台'},
  {range:[70,150],name:'自然绿',hex:'#6BCB77',emoji:'🌿',mood:'平和生长',desc:'绿色是自然与平衡的色彩，象征生命、健康与和谐。它能缓解眼部疲劳，带来放松与安全感。',traits:['自然','平衡','健康','成长'],app:'健康医疗、环保品牌'},
  {range:[150,210],name:'天空蓝',hex:'#4D96FF',emoji:'🌊',mood:'宁静信任',desc:'蓝色是信任与理性的颜色，象征广阔、深沉与稳定。它能降低心率，营造专业与可靠感。',traits:['信任','理性','宁静','专业'],app:'科技金融、企业官网'},
  {range:[210,270],name:'神秘紫',hex:'#9B72CB',emoji:'🔮',mood:'创意高贵',desc:'紫色融合红的热烈与蓝的沉静，象征创意、灵性与奢华。它能激发想象力与艺术感知。',traits:['创意','神秘','高贵','灵性'],app:'美妆艺术、奢侈品'},
  {range:[270,330],name:'浪漫粉',hex:'#FF6B9D',emoji:'💗',mood:'温柔浪漫',desc:'粉色是柔软与关爱的色彩，象征浪漫、天真与呵护。它能降低攻击性，营造温暖治愈感。',traits:['温柔','浪漫','关爱','治愈'],app:'女性产品、母婴品牌'},
  {range:[330,360],name:'正红',hex:'#E63946',emoji:'🔥',mood:'热情似火',desc:'正红是最具能量的颜色，象征爱情、勇气与力量。',traits:['热情','勇气'],app:'餐饮、促销'}
];
let curColor={hex:'#FF6B6B',name:'珊瑚橙'};
function hslToHex(h,s,l){
  s/=100;l/=100;const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const r=Math.round(255*f(0)),g=Math.round(255*f(8)),b=Math.round(255*f(4));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();
}
function pickColor(e){
  const rect=cv.getBoundingClientRect();const x=(e.clientX-rect.left)*(240/rect.width)-cx;const y=(e.clientY-rect.top)*(240/rect.height)-cy;
  const dist=Math.hypot(x,y);if(dist>r)return;
  const ang=Math.atan2(y,x)*180/Math.PI;const hue=(ang+360)%360;
  const hex=hslToHex(hue,dist/r*100,55);
  const data=colorData.find(d=>hue>=d.range[0]&&hue<d.range[1])||colorData[0];
  curColor={hex,name:data.name};
  document.getElementById('swatch').style.background=hex;
  document.getElementById('hex').textContent=hex;
  document.getElementById('cName').textContent=data.name;
  document.getElementById('moodEmoji').textContent=data.emoji;
  document.getElementById('moodName').textContent=data.mood;
  document.getElementById('moodDesc').textContent=data.desc;
  const tc=document.getElementById('moodTraits');tc.innerHTML='';
  data.traits.forEach(t=>{const s=document.createElement('span');s.className='trait';s.textContent=t;s.style.background=hex;tc.appendChild(s);});
  const px=cx+Math.cos(ang*Math.PI/180)*dist,py=cy+Math.sin(ang*Math.PI/180)*dist;
  const pointer=document.getElementById('pointer');
  pointer.style.left=(px/240*100)+'%';pointer.style.top=(py/240*100)+'%';
}
cv.addEventListener('click',pickColor);
cv.addEventListener('mousemove',e=>{if(e.buttons===1)pickColor(e);});

// 色板
const palettes=[
  {hex:'#E63946',name:'正红',mood:'热情'},{hex:'#FF6B6B',name:'珊瑚',mood:'温暖'},
  {hex:'#FFD93D',name:'阳光黄',mood:'快乐'},{hex:'#6BCB77',name:'自然绿',mood:'平和'},
  {hex:'#4D96FF',name:'天空蓝',mood:'宁静'},{hex:'#9B72CB',name:'神秘紫',mood:'创意'},
  {hex:'#FF6B9D',name:'浪漫粉',mood:'温柔'},{hex:'#1A1A2E',name:'深夜黑',mood:'沉稳'},
  {hex:'#F4A261',name:'焦糖橙',mood:'复古'},{hex:'#2A9D8F',name:'青松绿',mood:'清新'}
];
const pg=document.getElementById('paletteGrid');
palettes.forEach(p=>{
  const c=document.createElement('div');c.className='palette-card';
  c.innerHTML=`<div class="pc-color" style="background:${p.hex}"></div><div class="pc-body"><div class="pc-name">${p.name}</div><div class="pc-mood">${p.mood}</div><div class="pc-hex">${p.hex}</div></div>`;
  c.onclick=()=>{
    document.getElementById('swatch').style.background=p.hex;
    document.getElementById('hex').textContent=p.hex;
    document.getElementById('cName').textContent=p.name;
  };
  pg.appendChild(c);
});

// 渐变生成器
let g1='#ff6b6b',g2='#feca57',angle=135,selectGC=0;
function updateGrad(){
  const css=`linear-gradient(${angle}deg, ${g1}, ${g2})`;
  document.getElementById('gradPreview').style.background=css;
  document.getElementById('gradCSS').textContent='background: '+css+';';
}
function pickGrad(n){selectGC=n;}
document.querySelectorAll('.gc-color').forEach((el,i)=>{
  el.onclick=()=>{
    const hues=[0,30,60,120,210,270,330];const h=hues[Math.floor(Math.random()*hues.length)];
    const hex=hslToHex(h,70,55);
    if(i===0)g1=hex;else g2=hex;
    el.style.background=hex;updateGrad();
  };
});
document.getElementById('angleSlider').oninput=function(){angle=this.value;document.getElementById('angleVal').textContent=angle;updateGrad();};
const presets=[['#ff6b6b','#feca57','日落'],['#4D96FF','#9B72CB','极光'],['#6BCB77','#4D96FF','海洋'],['#FF6B9D','#9B72CB','晚霞'],['#FFD93D','#FF6B6B','火焰'],['#2A9D8F','#F4A261','森林']];
const pb=document.getElementById('presetBtns');
presets.forEach(p=>{
  const b=document.createElement('div');b.className='preset';b.textContent=p[2];
  b.style.background=`linear-gradient(90deg,${p[0]},${p[1]})`;b.style.color='#fff';
  b.onclick=()=>{g1=p[0];g2=p[1];document.getElementById('gc1').style.background=g1;document.getElementById('gc2').style.background=g2;updateGrad();};
  pb.appendChild(b);
});

// 色彩心理学
const psyData=[
  {c:'#E63946',n:'红色 Red',kw:'热情·能量·危险',body:'红色能显著提升心率和血压，是最具刺激性的颜色。在营销中，红色能制造紧迫感，常用于促销和餐饮（麦当劳、肯德基）。研究表明红色环境下人的反应速度提升12%，但长期暴露易引发焦虑。',app:'适用：促销按钮、餐饮品牌、运动赛事'},
  {c:'#4D96FF',n:'蓝色 Blue',kw:'信任·理性·专业',body:'蓝色是全球最受欢迎的颜色，能降低心率、缓解压力。蓝色让人联想到天空与海洋，传递稳定与可靠。科技公司（IBM、Intel）和金融机构大量使用蓝色，因为它天然传递"可信赖"的信号。',app:'适用：科技金融、企业官网、医疗'},
  {c:'#6BCB77',n:'绿色 Green',kw:'自然·平衡·健康',body:'绿色是人眼最敏感的颜色，处于光谱中央，视觉上最舒适。绿色象征生命与生长，能有效缓解眼部疲劳。在医院、药店和环保品牌中大量使用，星巴克绿色Logo传递的正是"自然放松"的品牌调性。',app:'适用：健康环保、有机食品、金融(增长)'},
  {c:'#FFD93D',n:'黄色 Yellow',kw:'快乐·智慧·警觉',body:'黄色是可见光中最亮的颜色，能刺激大脑释放血清素，提升愉悦感。黄色也是注意力抓取最强的颜色，常用于警示标识。但大面积黄色易造成视觉疲劳，宜作为点缀色使用。',app:'适用：儿童产品、警示标识、点缀高亮'},
  {c:'#9B72CB',n:'紫色 Purple',kw:'创意·高贵·神秘',body:'紫色在自然界中稀少，历史上提取成本极高，长期与皇室贵族关联。紫色刺激创意右脑，激发想象力与艺术感知。美妆、巧克力和奢侈品品牌偏爱紫色，以营造高端神秘感。',app:'适用：美妆艺术、奢侈品、创意设计'},
  {c:'#FF6B9D',n:'粉色 Pink',kw:'温柔·浪漫·关爱',body:'粉色能降低攻击性，美国监狱曾用"贝克粉"涂墙以减少暴力事件。粉色传递呵护与关爱，在女性和母婴产品中广泛使用。近年"千禧粉"和"芭比粉"成为流行文化符号，打破性别刻板印象。',app:'适用：女性产品、母婴品牌、甜品'}
];
const pa=document.getElementById('psyAcc');
psyData.forEach(p=>{
  const item=document.createElement('div');item.className='psy-item';
  item.innerHTML=`<div class="psy-head"><div class="psy-dot" style="background:${p.c}"></div><div class="psy-name">${p.n}</div><div class="psy-keyword">${p.kw}</div><div class="psy-arrow">▾</div></div>
    <div class="psy-body"><div class="psy-body-inner">${p.body}<div class="psy-app" style="background:${p.c}15"><b>应用场景：</b>${p.app}</div></div></div>`;
  item.querySelector('.psy-head').onclick=()=>{
    const open=item.classList.contains('open');
    document.querySelectorAll('.psy-item').forEach(x=>{x.classList.remove('open');x.querySelector('.psy-body').style.maxHeight=0;});
    if(!open){item.classList.add('open');const b=item.querySelector('.psy-body');b.style.maxHeight=b.scrollHeight+'px';}
  };
  pa.appendChild(item);
});
updateGrad();
