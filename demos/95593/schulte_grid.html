<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>舒尔特方格训练</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        /* 粒子背景容器 */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 闪烁光效覆盖层 */
        .light-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.3;
            background: radial-gradient(circle at var(--light-x, 50%) var(--light-y, 50%), 
                        rgba(255, 255, 255, 0.4) 0%, 
                        transparent 50%);
            transition: all 0.3s ease;
        }

        .game-container {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        h1 {
            color: #fff;
            text-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff;
            margin-bottom: 10px;
            font-size: 2.5rem;
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff; }
            50% { text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff, 0 0 60px #00d4ff; }
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            color: #fff;
            font-size: 1.2rem;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-value {
            color: #00d4ff;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 80px);
            grid-template-rows: repeat(5, 80px);
            gap: 10px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
            animation: cellPulse 3s ease-in-out infinite;
        }

        .cell::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, 
                        transparent 30%, 
                        rgba(255, 255, 255, 0.1) 50%, 
                        transparent 70%);
            animation: cellShine 4s linear infinite;
        }

        @keyframes cellShine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        @keyframes cellPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .cell:hover {
            transform: scale(1.1);
            z-index: 10;
        }

        .cell.correct {
            background: linear-gradient(135deg, #00ff88, #00cc6a) !important;
            animation: correctFlash 0.5s ease;
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
        }

        @keyframes correctFlash {
            0%, 100% { transform: scale(1.1); }
            50% { transform: scale(1.2); }
        }

        .cell.wrong {
            animation: wrongShake 0.5s ease;
            background: linear-gradient(135deg, #ff4444, #cc0000) !important;
            border-color: #ff4444;
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        .controls {
            margin-top: 20px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: white;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 15px;
            font-size: 1.3rem;
            color: #00ff88;
            font-weight: bold;
            min-height: 30px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        /* 难度指示器 */
        .difficulty-indicator {
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div class="light-effect" id="lightEffect"></div>
    
    <div class="game-container">
        <h1>🎯 舒尔特方格训练</h1>
        
        <div class="stats">
            <div class="stat-item">
                <div>当前数字</div>
                <div class="stat-value" id="currentNumber">1</div>
            </div>
            <div class="stat-item">
                <div>用时</div>
                <div class="stat-value" id="timer">0.0s</div>
            </div>
            <div class="stat-item">
                <div>最佳成绩</div>
                <div class="stat-value" id="bestScore">--</div>
            </div>
        </div>

        <div class="grid-container" id="grid"></div>

        <div class="message" id="message"></div>

        <div class="controls">
            <button class="btn" id="startBtn">开始游戏</button>
        </div>

        <div class="difficulty-indicator">
            💡 提示: 粒子效果、颜色渐变和闪烁光效会增加游戏难度
        </div>
    </div>

    <script>
        // ===== 粒子效果系统 =====
        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.resize();
                this.init();
                
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            init() {
                const particleCount = 80;
                for (let i = 0; i < particleCount; i++) {
                    this.particles.push(this.createParticle());
                }
            }

            createParticle() {
                const colors = [
                    'rgba(0, 212, 255, ',
                    'rgba(138, 43, 226, ',
                    'rgba(255, 0, 128, ',
                    'rgba(0, 255, 136, ',
                    'rgba(255, 165, 0, '
                ];
                return {
                    x: Math.random() * this.canvas.width,
                    y: Math.random() * this.canvas.height,
                    size: Math.random() * 4 + 1,
                    speedX: (Math.random() - 0.5) * 2,
                    speedY: (Math.random() - 0.5) * 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    opacity: Math.random() * 0.5 + 0.2,
                    opacityDirection: Math.random() > 0.5 ? 1 : -1
                };
            }

            update() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                this.particles.forEach((p, index) => {
                    // 更新位置
                    p.x += p.speedX;
                    p.y += p.speedY;

                    // 边界检测
                    if (p.x < 0 || p.x > this.canvas.width) p.speedX *= -1;
                    if (p.y < 0 || p.y > this.canvas.height) p.speedY *= -1;

                    // 闪烁效果
                    p.opacity += p.opacityDirection * 0.01;
                    if (p.opacity >= 0.7 || p.opacity <= 0.1) {
                        p.opacityDirection *= -1;
                    }

                    // 绘制粒子
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = p.color + p.opacity + ')';
                    this.ctx.fill();

                    // 添加光晕
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size * 2, 0, Math.PI * 2);
                    this.ctx.fillStyle = p.color + (p.opacity * 0.3) + ')';
                    this.ctx.fill();
                });

                // 连接附近的粒子
                this.connectParticles();
            }

            connectParticles() {
                for (let i = 0; i < this.particles.length; i++) {
                    for (let j = i + 1; j < this.particles.length; j++) {
                        const dx = this.particles[i].x - this.particles[j].x;
                        const dy = this.particles[i].y - this.particles[j].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < 120) {
                            const opacity = (1 - distance / 120) * 0.3;
                            this.ctx.beginPath();
                            this.ctx.strokeStyle = `rgba(0, 212, 255, ${opacity})`;
                            this.ctx.lineWidth = 0.5;
                            this.ctx.moveTo(this.particles[i].x, this.particles[i].y);
                            this.ctx.lineTo(this.particles[j].x, this.particles[j].y);
                            this.ctx.stroke();
                        }
                    }
                }
            }
        }

        // ===== 闪烁光效系统 =====
        class LightEffect {
            constructor(element) {
                this.element = element;
                this.angle = 0;
                this.init();
            }

            init() {
                setInterval(() => {
                    this.angle += 0.05;
                    const x = 50 + Math.sin(this.angle) * 30;
                    const y = 50 + Math.cos(this.angle * 0.7) * 30;
                    this.element.style.setProperty('--light-x', x + '%');
                    this.element.style.setProperty('--light-y', y + '%');
                }, 50);
            }
        }

        // ===== 游戏核心逻辑 =====
        class SchulteGridGame {
            constructor() {
                this.gridSize = 5;
                this.currentNumber = 1;
                this.timer = null;
                this.startTime = null;
                this.isPlaying = false;
                this.numbers = [];
                this.bestScore = localStorage.getItem('schulteBestScore') || null;
                
                this.init();
            }

            init() {
                this.gridElement = document.getElementById('grid');
                this.currentNumberElement = document.getElementById('currentNumber');
                this.timerElement = document.getElementById('timer');
                this.bestScoreElement = document.getElementById('bestScore');
                this.messageElement = document.getElementById('message');
                this.startBtn = document.getElementById('startBtn');

                if (this.bestScore) {
                    this.bestScoreElement.textContent = this.bestScore + 's';
                }

                this.startBtn.addEventListener('click', () => this.startGame());
                this.createGrid();
            }

            createGrid() {
                this.gridElement.innerHTML = '';
                this.numbers = this.shuffleArray([...Array(25).keys()].map(i => i + 1));
                
                // 为每个格子生成随机渐变颜色
                const gradients = [
                    'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                    'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                    'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                    'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
                    'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
                    'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
                    'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)',
                    'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)'
                ];

                this.numbers.forEach((num, index) => {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = num;
                    cell.dataset.number = num;
                    cell.style.background = gradients[index % gradients.length];
                    cell.style.animationDelay = `${Math.random() * 2}s`;
                    
                    cell.addEventListener('click', (e) => this.handleClick(e));
                    this.gridElement.appendChild(cell);
                });
            }

            shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            startGame() {
                this.currentNumber = 1;
                this.currentNumberElement.textContent = '1';
                this.isPlaying = true;
                this.startTime = Date.now();
                this.messageElement.textContent = '';
                
                // 重置所有格子
                document.querySelectorAll('.cell').forEach(cell => {
                    cell.classList.remove('correct', 'wrong');
                });

                this.createGrid();

                // 开始计时
                this.timer = setInterval(() => {
                    const elapsed = ((Date.now() - this.startTime) / 1000).toFixed(1);
                    this.timerElement.textContent = elapsed + 's';
                }, 100);

                this.startBtn.textContent = '重新开始';
            }

            handleClick(e) {
                if (!this.isPlaying) return;

                const cell = e.target;
                const number = parseInt(cell.dataset.number);

                if (number === this.currentNumber) {
                    cell.classList.add('correct');
                    cell.style.pointerEvents = 'none';
                    
                    this.currentNumber++;
                    this.currentNumberElement.textContent = this.currentNumber;

                    if (this.currentNumber > 25) {
                        this.gameWon();
                    }
                } else {
                    cell.classList.add('wrong');
                    setTimeout(() => cell.classList.remove('wrong'), 500);
                }
            }

            gameWon() {
                this.isPlaying = false;
                clearInterval(this.timer);
                
                const finalTime = ((Date.now() - this.startTime) / 1000).toFixed(2);
                this.messageElement.textContent = `🎉 恭喜完成! 用时 ${finalTime}秒`;

                // 检查最佳成绩
                if (!this.bestScore || parseFloat(finalTime) < parseFloat(this.bestScore)) {
                    this.bestScore = finalTime;
                    this.bestScoreElement.textContent = finalTime + 's';
                    localStorage.setItem('schulteBestScore', finalTime);
                    this.messageElement.textContent += ' 🏆 新纪录!';
                }
            }
        }

        // ===== 初始化所有系统 =====
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化粒子系统
            const particleCanvas = document.getElementById('particles-canvas');
            const particleSystem = new ParticleSystem(particleCanvas);

            // 初始化光效系统
            const lightEffect = document.getElementById('lightEffect');
            const lightSystem = new LightEffect(lightEffect);

            // 初始化游戏
            const game = new SchulteGridGame();

            // 动画循环
            function animate() {
                particleSystem.update();
                requestAnimationFrame(animate);
            }
            animate();
        });
    </script>
</body>
</html>
