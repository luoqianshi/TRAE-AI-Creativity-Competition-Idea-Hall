/* ---------- 工具：根据输入找基金 ---------- */
function findFund(input) {
  if (!input) return null;
  const q = input.trim().toLowerCase();
  if (!q) return null;
  // 1. 代码精确匹配
  if (FUND_DB[q]) return FUND_DB[q];
  // 2. 名称/别名包含匹配
  for (const code in FUND_DB) {
    const f = FUND_DB[code];
    if (f.name.toLowerCase().includes(q)) return f;
    if (f.aliases.some(a => a.toLowerCase().includes(q) || q.includes(a.toLowerCase()))) return f;
  }
  return null;
}

/* ---------- 对比逻辑 ---------- */
function generateComparison(a, b) {
  // 简单评分：风险更低/趋势更好/收益更稳，得分高者胜
  const scoreOf = f => {
    let s = 0;
    if (f.riskLevel === "low")  s += 3;
    if (f.riskLevel === "mid")  s += 2;
    if (f.riskLevel === "high") s += 1;
    if (f.trend === "good") s += 3;
    if (f.trend === "wait") s += 1;
    return s;
  };
  const sa = scoreOf(a), sb = scoreOf(b);
  let winner, reason;
  if (sa > sb) {
    winner = a;
    reason = `综合考虑风险、当前时机和持仓特点，<strong>${a.name}</strong> 对大学生更友好。`;
  } else if (sb > sa) {
    winner = b;
    reason = `综合考虑风险、当前时机和持仓特点，<strong>${b.name}</strong> 对大学生更友好。`;
  } else {
    winner = null;
    reason = `两只基金各有特点，<strong>看你更想要什么</strong>：要稳就选风险低的，要刺激就选高风险高弹性的。`;
  }

  // 维度判断
  const dim = (label, va, vb, advice) => `
    <tr>
      <th>${label}</th>
      <td class="col-a">${va}</td>
      <td class="col-b">${vb}</td>
    </tr>
  `;

  return `
    <div class="card fade-in">
      <div class="compare-result-header">
        <div class="winner-label">🏆 翻译官的结论</div>
        <div class="winner-name">${winner ? `推荐：${winner.name}` : "两只基金势均力敌"}</div>
      </div>

      <div class="translate-block">
        <div class="tb-title"><span class="tb-emoji">📋</span>一句话总结</div>
        <div class="tb-content">
          <p>${reason}</p>
          <p>${buildCompareNarrative(a, b, winner)}</p>
        </div>
      </div>

      <div class="translate-block">
        <div class="tb-title"><span class="tb-emoji">📊</span>具体差在哪</div>
        <div class="tb-content" style="overflow-x:auto;">
          <table class="compare-table">
            <thead>
              <tr><th></th><th class="col-a">${a.name.slice(0,8)}</th><th class="col-b">${b.name.slice(0,8)}</th></tr>
            </thead>
            <tbody>
              ${dim("买什么", `${a.sectorTag}<br><span style="color:var(--muted);font-size:12px;">${a.holdings.slice(0,30)}…</span>`, `${b.sectorTag}<br><span style="color:var(--muted);font-size:12px;">${b.holdings.slice(0,30)}…</span>`)}
              ${dim("风险", RISK_MAP[a.riskLevel].text, RISK_MAP[b.riskLevel].text)}
              ${dim("最多可能亏", `约 ${a.maxLoss}%`, `约 ${b.maxLoss}%`)}
              ${dim("近期表现", a.avgReturn, b.avgReturn)}
              ${dim("现在适合买吗", `<span class="verdict ${VERDICT_MAP[a.trend].cls}">${VERDICT_MAP[a.trend].text}</span>`, `<span class="verdict ${VERDICT_MAP[b.trend].cls}">${VERDICT_MAP[b.trend].text}</span>`)}
            </tbody>
          </table>
        </div>
      </div>

      <div class="translate-block">
        <div class="tb-title"><span class="tb-emoji">🎯</span>怎么选才不踩坑</div>
        <div class="tb-content">
          <p>👉 如果你<strong>怕亏钱睡不着</strong>，选风险更低的那只：<strong>${a.maxLoss <= b.maxLoss ? a.name : b.name}</strong>。</p>
          <p>👉 如果你<strong>想搏一搏单车变摩托</strong>，选高弹性的：<strong>${a.maxLoss > b.maxLoss ? a.name : b.name}</strong>。</p>
          <p>👉 如果你<strong>实在难选</strong>，干脆两只各买一半，相当于做了个简单的"分散投资"。</p>
        </div>
      </div>

      <div class="disclaimer">
        <strong>⚠️ 翻译官的小提醒：</strong>对比结果只是基于风险、时机、持仓的简单分析，<strong>仅供参考</strong>，不是投资建议。每个人钱袋子大小、风险承受力不一样，还得自己拿主意～
      </div>
    </div>
  `;
}

function buildCompareNarrative(a, b, winner) {
  if (!winner) {
    return `${a.name} 偏 <strong>${a.sectorTag}</strong>，${b.name} 偏 <strong>${b.sectorTag}</strong>，方向不同没法说谁绝对好。`;
  }
  const loser = winner === a ? b : a;
  if (winner.riskLevel !== loser.riskLevel) {
    return `主要是因为 <strong>${winner.name}</strong> 风险更低（${RISK_MAP[winner.riskLevel].text}），对学生党的钱包更安全。`;
  }
  if (winner.trend === "good" && loser.trend !== "good") {
    return `主要因为 <strong>${winner.name}</strong> 当前的市场时机更好，更适合现在入场。`;
  }
  return `两者风险相近，但 <strong>${winner.name}</strong> 在收益稳定性和当前时机上略胜一筹。`;
}

/* 历史记录 */
const HISTORY_KEY = "ft_history_v1";
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); }
  catch (e) { return []; }
}
function saveHistory(name) {
  let arr = loadHistory().filter(x => x !== name);
  arr.unshift(name);
  arr = arr.slice(0, 6);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(arr));
  renderHistory();
}
function renderHistory() {
  const arr = loadHistory();
  const card = $("#historyCard");
  const list = $("#historyList");
  if (!arr.length) { card.style.display = "none"; return; }
  card.style.display = "";
  list.innerHTML = "";
  arr.forEach(n => {
    const el = document.createElement("span");
    el.className = "history-item";
    el.textContent = n;
    el.addEventListener("click", () => {
      $("#input-single").value = n;
      $("#row-single").classList.add("has-value");
      runTranslate();
    });
    list.appendChild(el);
  });
}
renderHistory();

            目前内置 10 只常见基金，可以试试：<br>
            诺安成长 / 易方达蓝筹 / 白酒 / 新能源车 / 沪深300 / 易方达消费 / 广发稳健<br>
            <span style="color:#b3bccc;font-size:11px;">// TODO: 接入基金数据API（如天天基金API）</span>
          </div>
        </div>`;
      return;
    }
    if (a.code === b.code) {
      out.innerHTML = `
        <div class="card empty">
          <div class="empty-icon">🤨</div>
          <div class="empty-title">同一只基金没法对比哦</div>
          <div class="empty-tip">换一只不一样的再试试～</div>
        </div>`;
      return;
    }
    out.innerHTML = generateComparison(a, b);
  }, 700);
}
$("#btn-compare").addEventListener("click", runCompare);
[$("#input-a"), $("#input-b")].forEach(el => {
  el.addEventListener("keydown", e => { if (e.key === "Enter") runCompare(); });
});
</script>
