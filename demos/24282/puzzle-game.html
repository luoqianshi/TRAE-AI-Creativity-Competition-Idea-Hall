<body>
  <h1>华容道拼图</h1>
  <p class="subtitle">上传图片，选择难度，挑战你的拼图技巧！</p>

  <div class="game-container">
    <!-- 上传区域 -->
    <div class="upload-section" id="uploadSection">
      <div class="upload-icon">📷</div>
      <div class="upload-text">点击或拖拽上传图片</div>
      <div class="upload-hint">支持 JPG、PNG、GIF 格式</div>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <!-- 图片预览和控制 -->
    <div class="image-preview-section hidden" id="previewSection">
      <img class="preview-image" id="previewImage" alt="预览">
      <div>
        <p style="color: #aaa; margin-bottom: 10px;">原图预览</p>
        <button class="btn btn-secondary" id="changeImageBtn">更换图片</button>
      </div>
    </div>

    <!-- 控制面板 -->
    <div class="controls hidden" id="controlsSection">
      <div class="difficulty-group">
        <span class="difficulty-label">难度：</span>
        <button class="btn btn-difficulty active" data-size="3">3 × 3</button>
        <button class="btn btn-difficulty" data-size="4">4 × 4</button>
        <button class="btn btn-difficulty" data-size="6">6 × 6</button>
      </div>
      <button class="btn btn-primary" id="startBtn">开始游戏</button>
      <button class="btn btn-secondary hidden" id="shuffleBtn">重新打乱</button>
      <button class="btn btn-secondary hidden" id="showHintBtn">提示</button>
    </div>

    <!-- 游戏状态 -->
    <div class="stats hidden" id="statsSection">
      <div class="stat-item">
        <div class="stat-value" id="moveCount">0</div>
        <div class="stat-label">移动次数</div>
      </div>
      <div class="stat-item">
        <div class="timer" id="timer">00:00</div>
        <div class="stat-label">用时</div>
      </div>
    </div>

    <!-- 拼图区域 -->
    <div class="puzzle-board hidden" id="puzzleBoard">
      <div class="puzzle-grid" id="puzzleGrid"></div>
    </div>
  </div>

  <!-- 胜利弹窗 -->
  <div class="modal-overlay" id="winModal">
    <div class="modal-content">
      <div class="modal-title">🎉 恭喜完成！</div>
      <div class="modal-text">你成功完成了拼图挑战！</div>
      <div class="modal-stats">
        <div class="stat-item">
          <div class="stat-value" id="finalMoves">0</div>
          <div class="stat-label">移动次数</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="finalTime">00:00</div>
          <div class="stat-label">用时</div>
        </div>
      </div>
      <button class="btn btn-primary" id="playAgainBtn">再玩一次</button>
    </div>
  </div>

  <script>
    // 游戏状态
    let gameState = {
      image: null,
      gridSize: 3,
      pieces: [],
      emptyIndex: -1,
      moves: 0,
      timer: 0,
      timerInterval: null,
      isPlaying: false,
      isShuffling: false
    };

    // DOM 元素
    const uploadSection = document.getElementById('uploadSection');
    const fileInput = document.getElementById('fileInput');
    const previewSection = document.getElementById('previewSection');
    const previewImage = document.getElementById('previewImage');
    const controlsSection = document.getElementById('controlsSection');
    const startBtn = document.getElementById('startBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const showHintBtn = document.getElementById('showHintBtn');
    const changeImageBtn = document.getElementById('changeImageBtn');
    const statsSection = document.getElementById('statsSection');
    const puzzleBoard = document.getElementById('puzzleBoard');
    const puzzleGrid = document.getElementById('puzzleGrid');
    const moveCount = document.getElementById('moveCount');
    const timer = document.getElementById('timer');
    const winModal = document.getElementById('winModal');
    const playAgainBtn = document.getElementById('playAgainBtn');

    // 难度选择
    document.querySelectorAll('.btn-difficulty').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-difficulty').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        gameState.gridSize = parseInt(btn.dataset.size);
      });
    });

    // 上传图片
    uploadSection.addEventListener('click', () => fileInput.click());
    
    uploadSection.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadSection.classList.add('dragover');
    });
    
    uploadSection.addEventListener('dragleave', () => {
      uploadSection.classList.remove('dragover');
    });
    
    uploadSection.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadSection.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0 && files[0].type.startsWith('image/')) {
        handleImageUpload(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleImageUpload(e.target.files[0]);
      }
    });

    function handleImageUpload(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          gameState.image = img;
          previewImage.src = e.target.result;
          uploadSection.classList.add('hidden');
          previewSection.classList.remove('hidden');
          controlsSection.classList.remove('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 更换图片
    changeImageBtn.addEventListener('click', () => {
      gameState.image = null;
      fileInput.value = '';
      uploadSection.classList.remove('hidden');
      previewSection.classList.add('hidden');
      controlsSection.classList.add('hidden');
      statsSection.classList.add('hidden');
      puzzleBoard.classList.add('hidden');
      resetGame();
    });

    // 开始游戏
    startBtn.addEventListener('click', () => {
      if (!gameState.image) return;
      initGame();
    });

    // 重新打乱
    shuffleBtn.addEventListener('click', () => {
      if (gameState.isPlaying) {
        shufflePieces();
      }
    });

    // 提示
    let hintTimeout = null;
    showHintBtn.addEventListener('click', () => {
      if (!gameState.isPlaying) return;
      showHint();
    });

    function showHint() {
      const pieces = document.querySelectorAll('.puzzle-piece');
      pieces.forEach((piece, index) => {
        const correctIndex = gameState.pieces[index];
        if (correctIndex !== -1) {
          const row = Math.floor(correctIndex / gameState.gridSize);
          const col = correctIndex % gameState.gridSize;
          piece.style.backgroundImage = `url(${gameState.image.src})`;
          piece.style.backgroundSize = `${gameState.gridSize * 100}%`;
          piece.style.backgroundPosition = `${col * 100 / (gameState.gridSize - 1)}% ${row * 100 / (gameState.gridSize - 1)}%`;
          if (piece.querySelector('img')) {
            piece.querySelector('img').style.opacity = '0.3';
          }
        }
      });

      if (hintTimeout) clearTimeout(hintTimeout);
      hintTimeout = setTimeout(() => {
        pieces.forEach(piece => {
          piece.style.backgroundImage = '';
          piece.style.backgroundSize = '';
          piece.style.backgroundPosition = '';
          if (piece.querySelector('img')) {
            piece.querySelector('img').style.opacity = '1';
          }
        });
      }, 2000);
    }

    // 初始化游戏
    function initGame() {
      resetGame();
      gameState.isPlaying = true;
      
      startBtn.classList.add('hidden');
      shuffleBtn.classList.remove('hidden');
      showHintBtn.classList.remove('hidden');
      statsSection.classList.remove('hidden');
      puzzleBoard.classList.remove('hidden');

      const size = gameState.gridSize;
      const totalPieces = size * size;
      
      // 创建拼图数据（右下角为空）
      gameState.pieces = [];
      for (let i = 0; i < totalPieces; i++) {
        gameState.pieces.push(i);
      }
      gameState.emptyIndex = totalPieces - 1;
      gameState.pieces[totalPieces - 1] = -1;

      // 渲染拼图
      renderPuzzle();
      
      // 打乱拼图
      shufflePieces();
      
      // 开始计时
      startTimer();
    }

    // 渲染拼图
    function renderPuzzle() {
      const size = gameState.gridSize;
      const boardWidth = Math.min(500, window.innerWidth - 40);
      const pieceSize = Math.floor((boardWidth - (size - 1) * 2) / size);
      
      puzzleGrid.style.gridTemplateColumns = `repeat(${size}, ${pieceSize}px)`;
      puzzleGrid.style.gridTemplateRows = `repeat(${size}, ${pieceSize}px)`;
      puzzleGrid.innerHTML = '';

      gameState.pieces.forEach((pieceIndex, index) => {
        const piece = document.createElement('div');
        piece.className = 'puzzle-piece';
        piece.style.width = `${pieceSize}px`;
        piece.style.height = `${pieceSize}px`;
        piece.dataset.index = index;

        if (pieceIndex === -1) {
          piece.classList.add('empty');
        } else {
          const img = document.createElement('img');
          img.src = gameState.image.src;
          img.alt = `拼图块 ${pieceIndex + 1}`;
          
          // 计算裁剪位置
          const row = Math.floor(pieceIndex / size);
          const col = pieceIndex % size;
          
          // 使用 canvas 裁剪图片
          const canvas = document.createElement('canvas');
          canvas.width = pieceSize;
          canvas.height = pieceSize;
          const ctx = canvas.getContext('2d');
          
          const imgWidth = gameState.image.width;
          const imgHeight = gameState.image.height;
          const pieceWidth = imgWidth / size;
          const pieceHeight = imgHeight / size;
          
          ctx.drawImage(
            gameState.image,
            col * pieceWidth, row * pieceHeight,
            pieceWidth, pieceHeight,
            0, 0,
            pieceSize, pieceSize
          );
          
          img.src = canvas.toDataURL();
          piece.appendChild(img);
          
          // 添加编号（可选）
          // const number = document.createElement('span');
          // number.className = 'piece-number';
          // number.textContent = pieceIndex + 1;
          // piece.appendChild(number);
        }

        piece.addEventListener('click', () => handlePieceClick(index));
        puzzleGrid.appendChild(piece);
      });
    }

    // 打乱拼图（华容道可解算法）
    function shufflePieces() {
      gameState.isShuffling = true;
      const size = gameState.gridSize;
      const totalPieces = size * size;
      
      // 重置为完成状态
      for (let i = 0; i < totalPieces; i++) {
        gameState.pieces[i] = i;
      }
      gameState.pieces[totalPieces - 1] = -1;
      gameState.emptyIndex = totalPieces - 1;
      
      // 随机移动（确保可解）
      const shuffleMoves = size * size * 20;
      let lastMove = -1;
      
      for (let i = 0; i < shuffleMoves; i++) {
        const neighbors = getNeighbors(gameState.emptyIndex);
        // 避免立即回退
        const validNeighbors = neighbors.filter(n => n !== lastMove);
        const randomNeighbor = validNeighbors[Math.floor(Math.random() * validNeighbors.length)];
        
        swapPieces(gameState.emptyIndex, randomNeighbor, false);
        lastMove = gameState.emptyIndex;
        gameState.emptyIndex = randomNeighbor;
      }
      
      updatePuzzleDisplay();
      gameState.moves = 0;
      gameState.timer = 0;
      updateStats();
      gameState.isShuffling = false;
    }

    // 获取相邻位置
    function getNeighbors(index) {
      const size = gameState.gridSize;
      const row = Math.floor(index / size);
      const col = index % size;
      const neighbors = [];
      
      if (row > 0) neighbors.push(index - size); // 上
      if (row < size - 1) neighbors.push(index + size); // 下
      if (col > 0) neighbors.push(index - 1); // 左
      if (col < size - 1) neighbors.push(index + 1); // 右
      
      return neighbors;
    }

    // 交换拼图块
    function swapPieces(index1, index2, countMove = true) {
      const temp = gameState.pieces[index1];
      gameState.pieces[index1] = gameState.pieces[index2];
      gameState.pieces[index2] = temp;
      
      if (countMove) {
        gameState.moves++;
        updateStats();
      }
    }

    // 处理点击
    function handlePieceClick(index) {
      if (!gameState.isPlaying || gameState.isShuffling) return;
      if (gameState.pieces[index] === -1) return;
      
      const neighbors = getNeighbors(gameState.emptyIndex);
      if (neighbors.includes(index)) {
        swapPieces(index, gameState.emptyIndex);
        gameState.emptyIndex = index;
        updatePuzzleDisplay();
        
        // 检查胜利
        if (checkWin()) {
          handleWin();
        }
      }
    }

    // 更新显示
    function updatePuzzleDisplay() {
      const pieces = document.querySelectorAll('.puzzle-piece');
      const size = gameState.gridSize;
      
      pieces.forEach((piece, index) => {
        const pieceIndex = gameState.pieces[index];
        piece.innerHTML = '';
        piece.className = 'puzzle-piece';
        
        if (pieceIndex === -1) {
          piece.classList.add('empty');
        } else {
          const img = document.createElement('img');
          
          const canvas = document.createElement('canvas');
          const pieceSize = parseInt(piece.style.width);
          canvas.width = pieceSize;
          canvas.height = pieceSize;
          const ctx = canvas.getContext('2d');
          
          const imgWidth = gameState.image.width;
          const imgHeight = gameState.image.height;
          const pieceWidth = imgWidth / size;
          const pieceHeight = imgHeight / size;
          const row = Math.floor(pieceIndex / size);
          const col = pieceIndex % size;
          
          ctx.drawImage(
            gameState.image,
            col * pieceWidth, row * pieceHeight,
            pieceWidth, pieceHeight,
            0, 0,
            pieceSize, pieceSize
          );
          
          img.src = canvas.toDataURL();
          piece.appendChild(img);
          
          // 如果位置正确，添加提示
          if (pieceIndex === index) {
            piece.classList.add('correct');
          }
        }
        
        piece.dataset.index = index;
      });
    }

    // 检查胜利
    function checkWin() {
      for (let i = 0; i < gameState.pieces.length - 1; i++) {
        if (gameState.pieces[i] !== i) return false;
      }
      return gameState.pieces[gameState.pieces.length - 1] === -1;
    }

    // 处理胜利
    function handleWin() {
      gameState.isPlaying = false;
      stopTimer();
      
      // 填充最后一块
      const pieces = document.querySelectorAll('.puzzle-piece');
      const lastPiece = pieces[pieces.length - 1];
      lastPiece.classList.remove('empty');
      const img = document.createElement('img');
      
      const size = gameState.gridSize;
      const canvas = document.createElement('canvas');
      const pieceSize = parseInt(lastPiece.style.width);
      canvas.width = pieceSize;
      canvas.height = pieceSize;
      const ctx = canvas.getContext('2d');
      
      const imgWidth = gameState.image.width;
      const imgHeight = gameState.image.height;
      const pieceWidth = imgWidth / size;
      const pieceHeight = imgHeight / size;
      
      ctx.drawImage(
        gameState.image,
        (size - 1) * pieceWidth, (size - 1) * pieceHeight,
        pieceWidth, pieceHeight,
        0, 0,
        pieceSize, pieceSize
      );
      
      img.src = canvas.toDataURL();
      lastPiece.appendChild(img);
      
      // 显示胜利弹窗
      document.getElementById('finalMoves').textContent = gameState.moves;
      document.getElementById('finalTime').textContent = formatTime(gameState.timer);
      setTimeout(() => {
        winModal.classList.add('show');
      }, 500);
    }

    // 再玩一次
    playAgainBtn.addEventListener('click', () => {
      winModal.classList.remove('show');
      initGame();
    });

    // 计时器
    function startTimer() {
      stopTimer();
      gameState.timerInterval = setInterval(() => {
        gameState.timer++;
        updateStats();
      }, 1000);
    }

    function stopTimer() {
      if (gameState.timerInterval) {
        clearInterval(gameState.timerInterval);
        gameState.timerInterval = null;
      }
    }

    // 更新统计
    function updateStats() {
      moveCount.textContent = gameState.moves;
      timer.textContent = formatTime(gameState.timer);
    }

    // 格式化时间
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // 重置游戏
    function resetGame() {
      gameState.isPlaying = false;
      gameState.isShuffling = false;
      gameState.moves = 0;
      gameState.timer = 0;
      stopTimer();
      updateStats();
    }

    // 窗口大小改变时重新渲染
    window.addEventListener('resize', () => {
      if (gameState.isPlaying) {
        renderPuzzle();
        updatePuzzleDisplay();
      }
    });
  </script>
</body>
</html>
