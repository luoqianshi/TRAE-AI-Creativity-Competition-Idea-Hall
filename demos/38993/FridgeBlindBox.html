<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冰箱盲盒 - AI剩菜食谱生成器</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --bg: #f7f9fc;
            --text: #2d3436;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 2rem; }
        .container { background: white; width: 100%; max-width: 500px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 2rem; overflow: hidden; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { color: var(--primary); font-size: 1.8rem; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header p { color: #636e72; font-size: 0.9rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; margin-bottom: 0.8rem; font-weight: bold; }
        .input-wrapper { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px 15px; border: 2px solid #eee; border-radius: 10px; outline: none; font-size: 1rem; transition: border 0.3s; }
        input[type="text"]:focus { border-color: var(--secondary); }
        button.add-btn { background: var(--secondary); color: white; border: none; padding: 0 20px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: opacity 0.3s; }
        button.add-btn:hover { opacity: 0.8; }
        .tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 1rem; min-height: 40px; }
        .tag { background: #ffeaa7; color: #d35400; padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; animation: popIn 0.3s ease; }
        .tag span { cursor: pointer; font-weight: bold; }
        .generate-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 1rem; transition: transform 0.2s, box-shadow 0.2s; }
        .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,107,107,0.3); }
        .result-card { display: none; margin-top: 2rem; background: #fff5f5; border: 2px dashed var(--primary); border-radius: 15px; padding: 1.5rem; animation: slideUp 0.5s ease; }
        .result-card h3 { color: var(--primary); margin-bottom: 1rem; text-align: center; font-size: 1.4rem; }
        .recipe-step { margin-bottom: 0.8rem; line-height: 1.6; color: #555; }
        .loading { display: none; text-align: center; margin-top: 2rem; color: #636e72; font-style: italic; }
        
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        
        .footer { text-align: center; margin-top: 2rem; font-size: 0.8rem; color: #b2bec3; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🍱 冰箱盲盒</h1>
        <p>输入你的剩余食材，AI 拯救你的晚餐！</p>
    </div>

    <div class="input-group">
        <label>今天冰箱里还剩什么？</label>
        <div class="input-wrapper">
            <input type="text" id="ingredientInput" placeholder="例如：半个洋葱, 两个鸡蛋" onkeypress="handleKeyPress(event)">
            <button class="add-btn" onclick="addIngredient()">添加</button>
        </div>
        <div class="tags" id="tagsContainer">
            <!-- 默认放两个示例标签 -->
            <div class="tag">剩米饭 <span onclick="this.parentElement.remove()">×</span></div>
            <div class="tag">番茄 <span onclick="this.parentElement.remove()">×</span></div>
        </div>
    </div>

    <button class="generate-btn" onclick="generateRecipe()">✨ AI 开启盲盒</button>

    <div class="loading" id="loading">
        👩‍🍳 AI 大厨正在头脑风暴，根据你的食材创作中...
    </div>

    <div class="result-card" id="resultCard">
        <h3 id="recipeTitle">黄金番茄盖饭</h3>
        <div id="recipeContent">
            <p class="recipe-step"><strong>准备：</strong>将番茄切块，准备好剩米饭。</p>
            <p class="recipe-step"><strong>步骤1：</strong>热锅少油，下入番茄块翻炒出汁。</p>
            <p class="recipe-step"><strong>步骤2：</strong>加入少许生抽、盐和一点点糖提鲜。</p>
            <p class="recipe-step"><strong>步骤3：</strong>将剩米饭倒入锅中，迅速翻炒均匀，让每粒米裹上汤汁。</p>
            <p class="recipe-step"><strong>💡 AI 小贴士：</strong>如果家里有奶酪，出锅前撒一点，会变成意式浓汤饭的味道哦！</p>
        </div>
    </div>

    <div class="footer">
        Trae 创意大赛 - 生活娱乐赛道 Demo
    </div>
</div>

<script>
    function addIngredient() {
        const input = document.getElementById('ingredientInput');
        const value = input.value.trim();
        if (value) {
            const container = document.getElementById('tagsContainer');
            const tag = document.createElement('div');
            tag.className = 'tag';
            tag.innerHTML = `${value} <span onclick="this.parentElement.remove()">×</span>`;
            container.appendChild(tag);
            input.value = '';
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            addIngredient();
        }
    }

    function generateRecipe() {
        const tags = document.querySelectorAll('.tag');
        if (tags.length === 0) {
            alert('请至少输入一种食材哦！');
            return;
        }

        // 隐藏结果，显示加载动画模拟 AI 思考
        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        // 模拟网络延迟
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('resultCard').style.display = 'block';
            
            // 获取所有食材名称
            let ingredients = [];
            tags.forEach(tag => {
                ingredients.push(tag.innerText.replace(' ×', ''));
            });

            // 动态生成食谱标题
            document.getElementById('recipeTitle').innerText = `创意${ingredients[0]}大乱炖`;
            
            // 动态生成内容
            document.getElementById('recipeContent').innerHTML = `
                <p class="recipe-step"><strong>🎯 核心食材：</strong>${ingredients.join('、')}</p>
                <p class="recipe-step"><strong>👨‍🍳 步骤1：</strong>将 ${ingredients[0]} 切备用，起锅烧油。</p>
                <p class="recipe-step"><strong>👨‍🍳 步骤2：</strong>加入 ${ingredients.join(' 和 ')} 一起翻炒，释放灵魂香气。</p>
                <p class="recipe-step"><strong>👨‍🍳 步骤3：</strong>加入适量清水，盖上锅盖焖煮3分钟，收汁装盘。</p>
                <p class="recipe-step"><strong>💡 AI 小贴士：</strong>虽然食材搭配看似狂野，但只要加点生抽和蚝油，味道绝对惊艳，拯救食物不浪费！</p>
            `;
        }, 1500);
    }
</script>
</body>
</html>
