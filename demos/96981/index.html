<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简记账</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --accent: #e94560;
            --accent-light: #ff6b6b;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #2d2d44;
            --income-color: #00d9ff;
            --expense-color: #e94560;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        h1 {
            font-size: 2rem;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .tab {
            flex: 1;
            min-width: 100px;
            padding: 10px 15px;
            background-color: var(--bg-secondary);
            border: none;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .tab.active {
            background-color: var(--accent);
            color: white;
        }

        .tab:hover:not(.active) {
            background-color: var(--bg-tertiary);
        }

        .card {
            background-color: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .type-buttons {
            display: flex;
            gap: 10px;
        }

        .type-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .type-btn.active {
            border-color: var(--accent);
            background-color: rgba(233, 69, 96, 0.1);
            color: var(--accent);
        }

        .type-btn.income.active {
            border-color: var(--income-color);
            background-color: rgba(0, 217, 255, 0.1);
            color: var(--income-color);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent);
            color: white;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--accent-light);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--bg-tertiary);
        }

        .btn-secondary:hover {
            background-color: #1a4a7a;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat-item {
            background-color: var(--bg-primary);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .stat-value.income {
            color: var(--income-color);
        }

        .stat-value.expense {
            color: var(--expense-color);
        }

        .stat-value.balance {
            color: var(--text-primary);
        }

        .chart-container {
            margin-top: 20px;
        }

        .chart-title {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chart-bar-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-label {
            width: 60px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chart-bar-wrapper {
            flex: 1;
            height: 25px;
            background-color: var(--bg-primary);
            border-radius: 4px;
            overflow: hidden;
        }

        .chart-bar {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            padding-left: 8px;
            font-size: 0.75rem;
            color: white;
            white-space: nowrap;
        }

        .chart-bar.expense {
            background-color: var(--expense-color);
        }

        .chart-bar.income {
            background-color: var(--income-color);
        }

        .chart-bar.other {
            background-color: #4ecdc4;
        }

        .chart-amount {
            width: 70px;
            text-align: right;
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .records-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: var(--bg-primary);
            border-radius: 8px;
            margin-bottom: 10px;
            transition: transform 0.2s ease;
        }

        .record-item:hover {
            transform: translateX(5px);
        }

        .record-info {
            flex: 1;
        }

        .record-category {
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .record-note {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 3px;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .record-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .record-amount {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .record-amount.income {
            color: var(--income-color);
        }

        .record-amount.expense {
            color: var(--expense-color);
        }

        .record-actions {
            display: flex;
            gap: 8px;
            margin-left: 15px;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background-color: var(--accent);
            color: white;
        }

        .category-management {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .category-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .category-tag {
            padding: 6px 12px;
            background-color: var(--bg-primary);
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .category-tag.income {
            color: var(--income-color);
        }

        .category-tag.expense {
            color: var(--expense-color);
        }

        .category-tag .remove {
            cursor: pointer;
            font-size: 0.7rem;
            opacity: 0.6;
        }

        .category-tag .remove:hover {
            opacity: 1;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background-color: var(--bg-secondary);
            border-radius: 12px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
        }

        .modal h3 {
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .modal .btn {
            margin-top: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        .month-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .month-selector button {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1.2rem;
            transition: background-color 0.2s ease;
        }

        .month-selector button:hover {
            background-color: var(--accent);
        }

        .month-display {
            font-size: 1.2rem;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .record-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .record-actions {
                margin-left: 0;
                margin-top: 10px;
            }

            .chart-label {
                width: 50px;
            }

            .chart-amount {
                width: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>极简记账</h1>
            <p class="subtitle">记录每一笔收支</p>
        </header>

        <div class="month-selector">
            <button id="prevMonth">‹</button>
            <span class="month-display" id="currentMonth">2024年1月</span>
            <button id="nextMonth">›</button>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="add">添加记录</button>
            <button class="tab" data-tab="records">收支明细</button>
            <button class="tab" data-tab="stats">统计分析</button>
        </div>

        <div class="tab-content" id="addTab">
            <div class="card">
                <div class="type-buttons">
                    <button class="type-btn expense active" data-type="expense">支出</button>
                    <button class="type-btn income" data-type="income">收入</button>
                </div>

                <div class="form-group">
                    <label>金额</label>
                    <input type="number" id="amountInput" placeholder="0.00" step="0.01" min="0">
                </div>

                <div class="form-group">
                    <label>分类</label>
                    <select id="categorySelect">
                    </select>
                    <button class="btn btn-secondary" id="addCategoryBtn" style="margin-top: 8px;">添加自定义分类</button>
                </div>

                <div class="form-group">
                    <label>备注</label>
                    <textarea id="noteInput" placeholder="添加备注..."></textarea>
                </div>

                <div class="form-group">
                    <label>日期</label>
                    <input type="date" id="dateInput">
                </div>

                <button class="btn" id="saveBtn">保存记录</button>
            </div>

            <div class="card category-management">
                <h3>分类管理</h3>
                <div class="category-list" id="categoryList"></div>
            </div>
        </div>

        <div class="tab-content" id="recordsTab" style="display: none;">
            <div class="card">
                <div class="type-buttons" style="margin-bottom: 15px;">
                    <button class="type-btn active" data-filter="all">全部</button>
                    <button class="type-btn expense" data-filter="expense">支出</button>
                    <button class="type-btn income" data-filter="income">收入</button>
                </div>
                <div class="records-list" id="recordsList">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 20v-6"></path>
                            <path d="M18 20v-6a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v6"></path>
                            <path d="M4 10h16"></path>
                            <path d="M16 6v4"></path>
                            <path d="M8 6v4"></path>
                            <path d="M12 6v4"></path>
                        </svg>
                        <p>暂无记录</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-content" id="statsTab" style="display: none;">
            <div class="card">
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-label">本月收入</div>
                        <div class="stat-value income" id="monthIncome">¥0.00</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">本月支出</div>
                        <div class="stat-value expense" id="monthExpense">¥0.00</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">本月结余</div>
                        <div class="stat-value balance" id="monthBalance">¥0.00</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">记录总数</div>
                        <div class="stat-value" id="recordCount">0</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="chart-container">
                    <div class="chart-title">支出分类统计</div>
                    <div class="bar-chart" id="expenseChart"></div>
                </div>
            </div>

            <div class="card">
                <div class="chart-container">
                    <div class="chart-title">收入分类统计</div>
                    <div class="bar-chart" id="incomeChart"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="categoryModal">
        <div class="modal">
            <h3>添加分类</h3>
            <div class="form-group">
                <label>分类名称</label>
                <input type="text" id="newCategoryName" placeholder="输入分类名称">
            </div>
            <div class="form-group">
                <label>分类类型</label>
                <select id="newCategoryType">
                    <option value="expense">支出</option>
                    <option value="income">收入</option>
                </select>
            </div>
            <button class="btn" id="saveCategoryBtn">保存</button>
            <button class="btn btn-secondary" id="closeCategoryModal" style="background-color: #333;">取消</button>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h3>确认删除</h3>
            <p id="confirmMessage">确定要删除这条记录吗？</p>
            <button class="btn" id="confirmDeleteBtn">删除</button>
            <button class="btn btn-secondary" id="cancelDeleteBtn" style="background-color: #333;">取消</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'minimal_account_records';
        const CATEGORIES_KEY = 'minimal_account_categories';

        let currentType = 'expense';
        let currentFilter = 'all';
        let currentDate = new Date();
        let pendingDeleteId = null;

        const defaultCategories = {
            expense: ['餐饮', '交通', '购物', '娱乐', '医疗', '教育', '房租', '水电', '其他'],
            income: ['工资', '奖金', '理财', '兼职', '其他']
        };

        function getCategories() {
            const stored = localStorage.getItem(CATEGORIES_KEY);
            if (stored) {
                return JSON.parse(stored);
            }
            return defaultCategories;
        }

        function saveCategories(categories) {
            localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
        }

        function getRecords() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                return JSON.parse(stored);
            }
            return [];
        }

        function saveRecords(records) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        }

        function formatAmount(amount) {
            return '¥' + parseFloat(amount).toFixed(2);
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            return `${month}月${day}日 ${weekDays[date.getDay()]}`;
        }

        function getMonthKey(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        }

        function renderCategorySelect() {
            const select = document.getElementById('categorySelect');
            const categories = getCategories();
            const options = categories[currentType] || [];
            
            select.innerHTML = options.map(cat => 
                `<option value="${cat}">${cat}</option>`
            ).join('');
        }

        function renderCategoryList() {
            const container = document.getElementById('categoryList');
            const categories = getCategories();
            
            let html = '';
            categories.expense.forEach(cat => {
                html += `<span class="category-tag expense">${cat} <span class="remove" onclick="removeCategory('expense', '${cat}')">×</span></span>`;
            });
            categories.income.forEach(cat => {
                html += `<span class="category-tag income">${cat} <span class="remove" onclick="removeCategory('income', '${cat}')">×</span></span>`;
            });
            
            container.innerHTML = html;
        }

        function removeCategory(type, name) {
            const categories = getCategories();
            categories[type] = categories[type].filter(c => c !== name);
            saveCategories(categories);
            renderCategorySelect();
            renderCategoryList();
        }

        function addCategory(name, type) {
            const categories = getCategories();
            if (!categories[type].includes(name)) {
                categories[type].push(name);
                saveCategories(categories);
                renderCategorySelect();
                renderCategoryList();
            }
        }

        function renderRecords() {
            const container = document.getElementById('recordsList');
            const records = getRecords();
            const monthKey = getMonthKey(currentDate);
            
            let filtered = records.filter(r => r.date.startsWith(monthKey));
            
            if (currentFilter !== 'all') {
                filtered = filtered.filter(r => r.type === currentFilter);
            }
            
            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 20v-6"></path>
                            <path d="M18 20v-6a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v6"></path>
                            <path d="M4 10h16"></path>
                            <path d="M16 6v4"></path>
                            <path d="M8 6v4"></path>
                            <path d="M12 6v4"></path>
                        </svg>
                        <p>暂无记录</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filtered.map(record => `
                <div class="record-item">
                    <div class="record-info">
                        <div class="record-category">${record.category}</div>
                        ${record.note ? `<div class="record-note">${record.note}</div>` : ''}
                        <div class="record-date">${formatDate(record.date)}</div>
                    </div>
                    <div class="record-amount ${record.type}">${record.type === 'income' ? '+' : '-' }${formatAmount(record.amount).substring(1)}</div>
                    <div class="record-actions">
                        <button class="action-btn" onclick="deleteRecord(${record.id})">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 6h18"></path>
                                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderStats() {
            const records = getRecords();
            const monthKey = getMonthKey(currentDate);
            
            const monthRecords = records.filter(r => r.date.startsWith(monthKey));
            
            const income = monthRecords
                .filter(r => r.type === 'income')
                .reduce((sum, r) => sum + parseFloat(r.amount), 0);
            
            const expense = monthRecords
                .filter(r => r.type === 'expense')
                .reduce((sum, r) => sum + parseFloat(r.amount), 0);
            
            document.getElementById('monthIncome').textContent = formatAmount(income);
            document.getElementById('monthExpense').textContent = formatAmount(expense);
            document.getElementById('monthBalance').textContent = formatAmount(income - expense);
            document.getElementById('recordCount').textContent = monthRecords.length;
            
            renderChart('expense', monthRecords);
            renderChart('income', monthRecords);
        }

        function renderChart(type, records) {
            const container = document.getElementById(type === 'expense' ? 'expenseChart' : 'incomeChart');
            const filtered = records.filter(r => r.type === type);
            
            const categoryTotals = {};
            filtered.forEach(r => {
                categoryTotals[r.category] = (categoryTotals[r.category] || 0) + parseFloat(r.amount);
            });
            
            const sorted = Object.entries(categoryTotals)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 6);
            
            const maxAmount = sorted.length > 0 ? Math.max(...sorted.map(s => s[1])) : 1;
            
            if (sorted.length === 0) {
                container.innerHTML = `<div class="empty-state" style="padding: 20px;"><p>暂无${type === 'expense' ? '支出' : '收入'}数据</p></div>`;
                return;
            }
            
            container.innerHTML = sorted.map(([category, amount]) => {
                const percentage = (amount / maxAmount) * 100;
                return `
                    <div class="chart-bar-item">
                        <div class="chart-label">${category}</div>
                        <div class="chart-bar-wrapper">
                            <div class="chart-bar ${type}" style="width: ${percentage}%">${category}</div>
                        </div>
                        <div class="chart-amount">${formatAmount(amount)}</div>
                    </div>
                `;
            }).join('');
        }

        function saveRecord() {
            const amount = document.getElementById('amountInput').value;
            const category = document.getElementById('categorySelect').value;
            const note = document.getElementById('noteInput').value;
            const date = document.getElementById('dateInput').value;
            
            if (!amount || parseFloat(amount) <= 0) {
                alert('请输入有效金额');
                return;
            }
            
            const records = getRecords();
            const newRecord = {
                id: Date.now(),
                type: currentType,
                amount: parseFloat(amount),
                category: category,
                note: note,
                date: date || new Date().toISOString().split('T')[0]
            };
            
            records.push(newRecord);
            saveRecords(records);
            
            document.getElementById('amountInput').value = '';
            document.getElementById('noteInput').value = '';
            
            renderRecords();
            renderStats();
            
            switchTab('records');
        }

        function deleteRecord(id) {
            pendingDeleteId = id;
            document.getElementById('confirmModal').classList.add('active');
        }

        function confirmDelete() {
            if (pendingDeleteId !== null) {
                const records = getRecords();
                const filtered = records.filter(r => r.id !== pendingDeleteId);
                saveRecords(filtered);
                pendingDeleteId = null;
                
                renderRecords();
                renderStats();
            }
            document.getElementById('confirmModal').classList.remove('active');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            document.getElementById(`${tabName}Tab`).style.display = 'block';
            
            if (tabName === 'records') {
                renderRecords();
            } else if (tabName === 'stats') {
                renderStats();
            }
        }

        function updateMonthDisplay() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            document.getElementById('currentMonth').textContent = `${year}年${month}月`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
            updateMonthDisplay();
            renderCategorySelect();
            renderCategoryList();
            renderRecords();
            renderStats();

            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    switchTab(tab.dataset.tab);
                });
            });

            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (btn.dataset.type) {
                        currentType = btn.dataset.type;
                        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        renderCategorySelect();
                    } else if (btn.dataset.filter) {
                        currentFilter = btn.dataset.filter;
                        document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        renderRecords();
                    }
                });
            });

            document.getElementById('saveBtn').addEventListener('click', saveRecord);
            
            document.getElementById('addCategoryBtn').addEventListener('click', () => {
                document.getElementById('categoryModal').classList.add('active');
            });

            document.getElementById('closeCategoryModal').addEventListener('click', () => {
                document.getElementById('categoryModal').classList.remove('active');
            });

            document.getElementById('saveCategoryBtn').addEventListener('click', () => {
                const name = document.getElementById('newCategoryName').value.trim();
                const type = document.getElementById('newCategoryType').value;
                
                if (name) {
                    addCategory(name, type);
                    document.getElementById('newCategoryName').value = '';
                    document.getElementById('categoryModal').classList.remove('active');
                }
            });

            document.getElementById('prevMonth').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                updateMonthDisplay();
                renderRecords();
                renderStats();
            });

            document.getElementById('nextMonth').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                updateMonthDisplay();
                renderRecords();
                renderStats();
            });

            document.getElementById('confirmDeleteBtn').addEventListener('click', confirmDelete);
            document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
                document.getElementById('confirmModal').classList.remove('active');
                pendingDeleteId = null;
            });

            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        overlay.classList.remove('active');
                    }
                });
            });
        });
    </script>
</body>
</html>
