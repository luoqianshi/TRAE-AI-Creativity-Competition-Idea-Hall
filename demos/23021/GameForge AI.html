<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameForge AI - 智能游戏设计原型生成器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
      color: #e2e8f0;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Orbitron', sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
    }
    .neon-text {
      text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7, 0 0 40px #a855f7;
    }
    .neon-border {
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.5), inset 0 0 10px rgba(168, 85, 247, 0.1);
    }
    .gradient-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transition: all 0.3s ease;
    }
    .gradient-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    .tab-active {
      background: rgba(168, 85, 247, 0.3);
      border-bottom: 2px solid #a855f7;
    }
    .json-key { color: #f472b6; }
    .json-string { color: #34d399; }
    .json-number { color: #fbbf24; }
    .tree-node {
      position: relative;
      padding-left: 20px;
    }
    .tree-node::before {
      content: '│';
      position: absolute;
      left: 4px;
      color: rgba(255,255,255,0.2);
    }
    .tree-node:last-child::before {
      content: '└';
    }
    .resource-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .loop-step {
      background: linear-gradient(135deg, rgba(102,126,234,0.2), rgba(118,75,162,0.2));
      border: 1px solid rgba(102,126,234,0.3);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      min-width: 120px;
    }
    .loop-arrow {
      display: flex;
      align-items: center;
      color: #a855f7;
      font-size: 24px;
    }
    .section-card {
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 16px;
      border-left: 4px solid #a855f7;
    }
    .code-block {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 16px;
      font-family: 'Consolas', monospace;
      font-size: 13px;
      overflow-x: auto;
    }
    .tab-btn {
      padding: 10px 16px;
      border-radius: 8px 8px 0 0;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      background: rgba(168, 85, 247, 0.2);
    }
    .tab-btn.active {
      background: rgba(168, 85, 247, 0.3);
      border-bottom: 2px solid #a855f7;
    }
  </style>
</head>
<body class="min-h-screen">
  <!-- Navigation -->
  <nav class="fixed top-0 left-0 right-0 z-50 glass-card border-b-0">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center">
          <span class="text-xl">🎮</span>
        </div>
        <div>
          <h1 class="text-xl font-bold neon-text">GameForge AI</h1>
          <p class="text-xs text-gray-400">智能游戏设计原型生成器</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="downloadJSON()" class="px-4 py-2 text-sm rounded-lg bg-blue-600/20 text-blue-400 hover:bg-blue-600/30 transition">
          📥 下载JSON
        </button>
        <button onclick="downloadGDD()" class="px-4 py-2 text-sm rounded-lg bg-green-600/20 text-green-400 hover:bg-green-600/30 transition">
          📄 下载GDD
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="pt-20 pb-10 px-4">
    <div class="max-w-7xl mx-auto">
      <!-- Header -->
      <div class="text-center mb-8">
        <h2 class="text-3xl font-bold mb-2">🎮 将创意转化为游戏设计</h2>
        <p class="text-gray-400">输入您的游戏创意，AI将自动生成完整的GDD、系统设计、工程结构和资源建议</p>
      </div>

      <!-- Input Section -->
      <div class="glass-card p-6 mb-8">
        <div class="flex flex-col lg:flex-row gap-6">
          <div class="flex-1">
            <label class="block text-sm font-medium text-gray-300 mb-2">🎯 游戏创意描述</label>
            <textarea 
              id="ideaInput"
              class="w-full h-32 p-4 rounded-lg bg-black/30 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 transition resize-none"
              placeholder="例如：做一个沙盒建造+战斗+关卡探索游戏..."
            ></textarea>
            <div class="mt-3 flex flex-wrap gap-2">
              <span class="text-xs text-gray-500">快速示例：</span>
              <button onclick="fillExample('做一个沙盒建造+战斗+关卡探索游戏')" class="px-3 py-1 text-xs rounded-full bg-purple-600/20 text-purple-400 hover:bg-purple-600/30 transition">🏗️ 沙盒建造</button>
              <button onclick="fillExample('一个太空射击游戏，玩家驾驶飞船在宇宙中战斗')" class="px-3 py-1 text-xs rounded-full bg-purple-600/20 text-purple-400 hover:bg-purple-600/30 transition">🚀 太空射击</button>
              <button onclick="fillExample('一个角色扮演RPG游戏，玩家在奇幻世界中冒险')" class="px-3 py-1 text-xs rounded-full bg-purple-600/20 text-purple-400 hover:bg-purple-600/30 transition">⚔️ RPG冒险</button>
              <button onclick="fillExample('一个解谜冒险游戏，玩家探索神秘遗迹')" class="px-3 py-1 text-xs rounded-full bg-purple-600/20 text-purple-400 hover:bg-purple-600/30 transition">🧩 解谜探索</button>
              <button onclick="fillExample('一个塔防策略游戏，玩家布置防御塔抵御敌人')" class="px-3 py-1 text-xs rounded-full bg-purple-600/20 text-purple-400 hover:bg-purple-600/30 transition">🏰 塔防策略</button>
              <button onclick="fillExample('一个音乐节奏游戏，玩家跟随节拍点击音符')" class="px-3 py-1 text-xs rounded-full bg-purple-600/20 text-purple-400 hover:bg-purple-600/30 transition">🎵 音乐节奏</button>
            </div>
          </div>
          <div class="flex flex-col justify-end">
            <button 
              id="generateBtn"
              onclick="generateDesign()"
              class="gradient-btn px-8 py-4 rounded-xl font-bold text-white flex items-center justify-center gap-3 neon-border"
            >
              <span>✨</span>
              <span>生成完整设计</span>
            </button>
            <p class="text-center text-xs text-gray-500 mt-3">支持多种游戏类型组合</p>
          </div>
        </div>
      </div>

      <!-- Loading State -->
      <div id="loadingState" class="hidden">
        <div class="glass-card p-12 text-center">
          <div class="w-24 h-24 mx-auto mb-6 relative">
            <div class="absolute inset-0 border-4 border-purple-600/30 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-t-purple-500 border-r-transparent border-b-transparent border-l-transparent rounded-full animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center text-4xl">🎮</div>
          </div>
          <h3 class="text-2xl font-bold mb-2">正在生成游戏设计...</h3>
          <p class="text-gray-400">AI正在分析创意并生成完整的游戏设计文档</p>
          <div class="mt-6 flex justify-center gap-2">
            <span class="w-3 h-3 rounded-full bg-purple-500 animate-bounce" style="animation-delay: 0ms"></span>
            <span class="w-3 h-3 rounded-full bg-purple-500 animate-bounce" style="animation-delay: 150ms"></span>
            <span class="w-3 h-3 rounded-full bg-purple-500 animate-bounce" style="animation-delay: 300ms"></span>
          </div>
        </div>
      </div>

      <!-- Result Section -->
      <div id="resultSection" class="hidden">
        <!-- Game Title -->
        <div class="glass-card p-6 mb-6">
          <h2 class="text-2xl font-bold mb-2" id="gameTitle">游戏标题</h2>
          <p class="text-gray-400" id="gameConcept">游戏概念描述</p>
        </div>

        <!-- Tab Navigation -->
        <div class="flex flex-wrap gap-1 mb-6 border-b border-gray-700">
          <button onclick="switchTab('gdd')" id="tab-gdd" class="tab-btn active text-sm font-medium">📋 GDD概览</button>
          <button onclick="switchTab('coreloop')" id="tab-coreloop" class="tab-btn text-sm font-medium text-gray-400">🔄 核心循环</button>
          <button onclick="switchTab('systems')" id="tab-systems" class="tab-btn text-sm font-medium text-gray-400">⚙️ 系统设计</button>
          <button onclick="switchTab('json')" id="tab-json" class="tab-btn text-sm font-medium text-gray-400">📦 JSON结构</button>
          <button onclick="switchTab('project')" id="tab-project" class="tab-btn text-sm font-medium text-gray-400">📁 工程结构</button>
          <button onclick="switchTab('resources')" id="tab-resources" class="tab-btn text-sm font-medium text-gray-400">🎨 资源适配</button>
          <button onclick="switchTab('prototype')" id="tab-prototype" class="tab-btn text-sm font-medium text-gray-400">🎮 原型预览</button>
        </div>

        <!-- Tab Contents -->
        <div id="content-gdd" class="space-y-6">
          <!-- GDD Overview -->
        </div>

        <div id="content-coreloop" class="hidden space-y-6">
          <div class="glass-card p-6">
            <h3 class="text-xl font-bold mb-6">🔄 核心循环 (Core Loop)</h3>
            <div id="coreLoopFlow" class="flex flex-wrap items-center justify-center gap-4 mb-8"></div>
            <div class="section-card">
              <h4 class="font-bold mb-2">循环描述</h4>
              <p id="coreLoopDesc" class="text-gray-300"></p>
            </div>
          </div>
        </div>

        <div id="content-systems" class="hidden space-y-6">
          <div id="systemsContainer"></div>
        </div>

        <div id="content-json" class="hidden space-y-6">
          <div class="glass-card p-6">
            <h3 class="text-xl font-bold mb-4">📦 AI结构化输出 (JSON)</h3>
            <div class="flex gap-3 mb-4">
              <button onclick="setJSONView('formatted')" id="json-formatted" class="px-4 py-2 rounded-lg bg-purple-600/30 text-purple-400 text-sm">格式化视图</button>
              <button onclick="setJSONView('code')" id="json-code" class="px-4 py-2 rounded-lg bg-gray-700/30 text-gray-400 text-sm">代码视图</button>
            </div>
            <div id="jsonContent" class="code-block max-h-96 overflow-y-auto"></div>
          </div>
        </div>

        <div id="content-project" class="hidden space-y-6">
          <div class="glass-card p-6">
            <h3 class="text-xl font-bold mb-4">📁 工程化项目结构</h3>
            <div class="flex gap-3 mb-6">
              <button onclick="setEngineView('unity')" id="engine-unity" class="px-4 py-2 rounded-lg bg-purple-600/30 text-purple-400 font-medium">Unity结构</button>
              <button onclick="setEngineView('unreal')" id="engine-unreal" class="px-4 py-2 rounded-lg bg-gray-700/30 text-gray-400 font-medium">Unreal结构</button>
              <button onclick="setEngineView('generic')" id="engine-generic" class="px-4 py-2 rounded-lg bg-gray-700/30 text-gray-400 font-medium">通用结构</button>
            </div>
            <div id="projectStructure" class="code-block"></div>
          </div>
        </div>

        <div id="content-resources" class="hidden space-y-6">
          <div class="glass-card p-6">
            <h3 class="text-xl font-bold mb-6">🎨 资源适配建议</h3>
            <div id="resourcesContainer" class="space-y-6"></div>
          </div>
        </div>

        <div id="content-prototype" class="hidden space-y-6">
          <div class="glass-card p-6">
            <h3 class="text-xl font-bold mb-4">🎮 游戏原型预览</h3>
            <div class="flex gap-3 mb-6">
              <button onclick="openPrototype()" class="gradient-btn px-6 py-2 rounded-lg font-medium text-white">打开独立原型</button>
              <button onclick="resetPrototype()" class="px-6 py-2 rounded-lg bg-gray-700/30 text-gray-400 font-medium">重置游戏</button>
            </div>
            <div class="relative rounded-xl overflow-hidden border border-gray-700">
              <canvas id="gameCanvas" width="800" height="500" class="w-full"></canvas>
              <div class="absolute top-4 left-4 flex flex-col gap-2">
                <div class="bg-black/70 backdrop-blur px-4 py-2 rounded-lg">
                  <p class="text-xs text-gray-400">生命值</p>
                  <div class="w-40 h-4 bg-gray-700 rounded-full overflow-hidden mt-1">
                    <div id="healthBar" class="h-full bg-green-500 transition-all" style="width: 100%"></div>
                  </div>
                </div>
                <div class="bg-black/70 backdrop-blur px-4 py-2 rounded-lg">
                  <p class="text-sm font-bold">得分: <span id="scoreDisplay">0</span></p>
                </div>
                <div class="bg-black/70 backdrop-blur px-4 py-2 rounded-lg">
                  <p class="text-xs text-gray-300" id="gameStatus">准备开始</p>
                </div>
              </div>
              <div class="absolute bottom-4 left-4 bg-black/70 backdrop-blur px-4 py-2 rounded-lg">
                <p class="text-xs text-gray-300">WASD/方向键移动 | 空格跳跃 | 点击收集物品</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============ 游戏类型检测 ============
    const GAME_TYPES = {
      sandbox: { keywords: ['沙盒', '建造', '创造', 'sandbox', 'build', 'minecraft'], weight: 1 },
      combat: { keywords: ['战斗', '攻击', 'combat', 'battle', 'fight', 'war'], weight: 2 },
      rpg: { keywords: ['rpg', '角色', '冒险', 'quest', '英雄', '冒险'], weight: 1 },
      exploration: { keywords: ['探索', '关卡', 'explore', 'level', '地图', '迷宫'], weight: 1 },
      shooter: { keywords: ['射击', 'shooter', '枪', 'gun', '飞船', 'space'], weight: 1 },
      strategy: { keywords: ['策略', '塔防', 'strategy', 'tower', '防守', '防御'], weight: 1 },
      puzzle: { keywords: ['解谜', 'puzzle', '谜题', '推理', 'logic'], weight: 1 },
      rhythm: { keywords: ['音乐', '节奏', 'rhythm', '节拍', '音符', 'dance'], weight: 1 },
      platformer: { keywords: ['平台', '跳跃', 'platformer', '跑酷', 'jump'], weight: 1 }
    };

    // ============ 核心数据结构生成器 ============
    function generateCoreLoop(types) {
      const loops = {
        sandbox: [
          { step: '收集资源', icon: '⛏️', desc: '采集木材、矿石等原材料' },
          { step: '制作物品', icon: '🔨', desc: '使用资源制作工具和材料' },
          { step: '建造建筑', icon: '🏗️', desc: '建造房屋、设施和装饰' },
          { step: '扩展领地', icon: '🗺️', desc: '扩大基地，解锁新区域' }
        ],
        combat: [
          { step: '遭遇敌人', icon: '👾', desc: '发现敌人，准备战斗' },
          { step: '战斗攻击', icon: '⚔️', desc: '使用技能和武器攻击' },
          { step: '获取战利品', icon: '🎁', desc: '击败敌人获得奖励' },
          { step: '恢复状态', icon: '💚', desc: '恢复生命，准备下一场战斗' }
        ],
        rpg: [
          { step: '探索世界', icon: '🗺️', desc: '在开放世界中探索' },
          { step: '接受任务', icon: '📜', desc: '接受NPC任务' },
          { step: '完成任务', icon: '✅', desc: '击败敌人或收集物品' },
          { step: '获得奖励', icon: '🏆', desc: '获得经验值和装备' }
        ],
        exploration: [
          { step: '进入关卡', icon: '🚪', desc: '开始新的关卡' },
          { step: '寻找线索', icon: '🔍', desc: '搜索隐藏的道具和路径' },
          { step: '解决谜题', icon: '🧩', desc: '解开机关和谜题' },
          { step: '到达终点', icon: '🏁', desc: '完成关卡目标' }
        ],
        shooter: [
          { step: '瞄准目标', icon: '🎯', desc: '锁定敌人位置' },
          { step: '射击攻击', icon: '🔫', desc: '发射武器攻击' },
          { step: '躲避攻击', icon: '💨', desc: '利用掩体躲避' },
          { step: '消灭敌人', icon: '💥', desc: '击败所有敌人过关' }
        ],
        strategy: [
          { step: '规划布局', icon: '📐', desc: '布置防御/进攻单位' },
          { step: '资源管理', icon: '💰', desc: '分配金币和资源' },
          { step: '执行策略', icon: '🚀', desc: '发起攻击或防御' },
          { step: '升级强化', icon: '⬆️', desc: '升级塔或单位' }
        ],
        puzzle: [
          { step: '观察场景', icon: '👀', desc: '分析环境和线索' },
          { step: '收集道具', icon: '📦', desc: '获取可用的物品' },
          { step: '组合推理', icon: '🧠', desc: '思考解决方案' },
          { step: '解开谜题', icon: '🔓', desc: '成功解开谜题' }
        ],
        rhythm: [
          { step: '聆听节拍', icon: '🎧', desc: '感受音乐节奏' },
          { step: '点击音符', icon: '👆', desc: '在正确时机点击' },
          { step: '完成连击', icon: '🔥', desc: '连续正确点击' },
          { step: '获得高分', icon: '⭐', desc: '完成歌曲获得评价' }
        ],
        platformer: [
          { step: '移动跳跃', icon: '🏃', desc: '控制角色移动' },
          { step: '躲避障碍', icon: '⚠️', desc: '避开陷阱和敌人' },
          { step: '收集道具', icon: '🪙', desc: '收集金币和道具' },
          { step: '到达终点', icon: '🏁', desc: '完成关卡' }
        ]
      };

      let result = [];
      if (types.includes('sandbox')) result = result.concat(loops.sandbox);
      if (types.includes('combat')) result = result.concat(loops.combat);
      if (types.includes('rpg')) result = result.concat(loops.rpg);
      if (types.includes('exploration')) result = result.concat(loops.exploration);
      if (types.includes('shooter')) result = result.concat(loops.shooter);
      if (types.includes('strategy')) result = result.concat(loops.strategy);
      if (types.includes('puzzle')) result = result.concat(loops.puzzle);
      if (types.includes('rhythm')) result = result.concat(loops.rhythm);
      if (types.includes('platformer')) result = result.concat(loops.platformer);

      // 去重并限制为4-6个步骤
      const unique = result.filter((item, index) => 
        result.findIndex(i => i.step === item.step) === index
      );
      return unique.slice(0, 6);
    }

    // ============ 系统设计生成器 ============
    function generateSystems(types) {
      const systems = {};

      if (types.includes('combat')) {
        systems.combat = {
          name: '战斗系统',
          type: '实时战斗 / 回合制',
          mechanics: ['普通攻击', '技能释放', '闪避躲避', '暴击机制', '连击系统'],
          stats: ['生命值', '攻击力', '防御力', '速度', '暴击率', '闪避率'],
          abilities: [
            { name: '普通攻击', damage: 10, cooldown: 0, range: '近战' },
            { name: '技能A', damage: 25, cooldown: 3, range: '远程' },
            { name: '技能B', damage: 50, cooldown: 8, range: '范围' },
            { name: '终极技能', damage: 100, cooldown: 30, range: '全屏' }
          ]
        };
      }

      if (types.includes('sandbox')) {
        systems.building = {
          name: '建造系统',
          resources: [
            { name: '木材', icon: '🪵', desc: '基础材料' },
            { name: '石头', icon: '🪨', desc: '坚固材料' },
            { name: '铁矿', icon: '⚙️', desc: '金属材料' },
            { name: '金币', icon: '🪙', desc: '货币资源' }
          ],
          buildings: [
            { name: '木屋', cost: { '木材': 10 }, output: '提供住所' },
            { name: '伐木场', cost: { '木材': 20 }, output: '+5木材/分钟' },
            { name: '采石场', cost: { '木材': 20 }, output: '+3石头/分钟' },

    function generateLevels(types, gameTitle) {
      const levelThemes = {

        combat: ['训练场', '边境哨站', '敌军营地', '地下城', '巨龙巢穴', '最终决战'],
        rpg: ['新手村', '迷雾森林', '黑暗洞穴', '精灵领地', '矮人王国', '龙之谷'],
        exploration: ['入口大厅', '迷雾走廊', '机关室', '宝藏室', 'BOSS房间', '秘密区域'],
        shooter: ['训练关', '丛林突袭', '城市废墟', '太空港口', '外星基地', '旗舰对决'],

        strategy: ['第1波', '第2波', '精英波', 'BOSS波', '无尽模式', '特殊挑战'],
        platformer: ['草地关', '森林关', '山洞关', '火山关', '冰原关', '天空关', '最终关'],
        rhythm: ['教程曲', '新手曲', '进阶曲', '专家曲', '大师曲', 'BOSS曲']
      };

      let themes = [];
      if (types.includes('sandbox')) themes = themes.concat(levelThemes.sandbox.slice(0, 3));
      if (types.includes('combat')) themes = themes.concat(levelThemes.combat.slice(0, 3));
      if (types.includes('rpg')) themes = themes.concat(levelThemes.rpg.slice(0, 3));
      if (types.includes('exploration')) themes = themes.concat(levelThemes.exploration.slice(0, 3));
      if (types.includes('shooter')) themes = themes.concat(levelThemes.shooter.slice(0, 3));
      if (types.includes('strategy')) themes = themes.concat(levelThemes.strategy.slice(0, 3));
      if (types.includes('puzzle')) themes = themes.concat(levelThemes.puzzle.slice(0, 3));
      if (types.includes('platformer')) themes = themes.concat(levelThemes.platformer.slice(0, 3));

    // ============ 主生成函数 ============
    function parseGameTypes(concept) {
      const conceptLower = concept.toLowerCase();
      const detected = [];

      for (const [type, config] of Object.entries(GAME_TYPES)) {
        for (const keyword of config.keywords) {
          if (conceptLower.includes(keyword)) {
            if (!detected.includes(type)) {
              detected.push(type);
            }
            break;
          }
        }
      }

      return detected.length > 0 ? detected : ['rpg'];
    }

    function generateDesign() {
      const input = document.getElementById('ideaInput').value.trim();
      if (!input) {
        alert('请输入游戏创意描述');
        return;
      }

      document.getElementById('loadingState').classList.remove('hidden');
      document.getElementById('resultSection').classList.add('hidden');

        const types = parseGameTypes(input);
        const title = input.length > 40 ? input.substring(0, 40) + '...' : input;

        const gameDesign = {
          id: `game_${Date.now()}`,
          title: title,
          concept: input,
          types: types,
          
          // ① GDD核心
          gdd: {
            title: title,
            genre: types.join(' + '),
            targetPlatform: 'PC / Mobile / Console',
            targetAudience: '12-35岁',
            artStyle: '根据游戏类型适配',
            description: input
          },

          // 核心循环
          core_loop: generateCoreLoop(types),
          
          // 系统设计
          systems: generateSystems(types),
          
          // 进度体系
          progression: generateProgression(types),
          
          // 关卡结构
          levels: generateLevels(types, title),
          
          // 工程结构
          projectStructure: {
            unity: generateProjectStructure('unity', types, title),
            unreal: generateProjectStructure('unreal', types, title),
            generic: generateProjectStructure('generic', types, title)
          },
          
          // 资源建议
          resources: generateResourceSuggestions(types),

          // 原型配置
          prototype: {
            bgColor: '#1a1a2e',
            playerColor: '#4ade80'
          }
        };

        window.currentDesign = gameDesign;
        renderAll(gameDesign);

        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('resultSection').classList.remove('hidden');
        switchTab('gdd');
    }

    // ============ 渲染函数 ============

      document.getElementById('gameTitle').textContent = design.title;

      renderCoreLoop(design);
      renderSystems(design);
      renderJSON(design);
      renderProjectStructure('unity');
      renderResources(design);
      
      requestAnimationFrame(() => initPrototype(design));
    }

    // ============ 原型游戏 ============
    let canvas, ctx, animationId;
    let player, collectibles, enemies, obstacles, goal;
    let score, health;
    let keys = {};
    const GRAVITY = 0.6;
    const JUMP = -14;
    const SPEED = 5;

    function initPrototype(design) {
      canvas = document.getElementById('gameCanvas');
      ctx = canvas.getContext('2d');

      player = { x: 80, y: 400, w: 40, h: 40, vx: 0, vy: 0, color: design.prototype.playerColor };
      collectibles = [
        { x: 200, y: 350, w: 25, h: 25, color: '#fbbf24', collected: false },
        { x: 400, y: 300, w: 25, h: 25, color: '#fbbf24', collected: false },
        { x: 600, y: 250, w: 25, h: 25, color: '#fbbf24', collected: false }
      ];
      enemies = [
        { x: 300, y: 400, w: 35, h: 35, color: '#ef4444', vx: 2 },
        { x: 550, y: 400, w: 35, h: 35, color: '#ef4444', vx: -2 }
      ];
      obstacles = [
        { x: 250, y: 450, w: 80, h: 50 },
        { x: 450, y: 450, w: 80, h: 50 },
        { x: 350, y: 350, w: 100, h: 20 }
      ];
      goal = { x: 750, y: 400, w: 40, h: 40, color: '#10b981' };
      score = 0;
      health = 100;

      document.getElementById('scoreDisplay').textContent = score;
      document.getElementById('healthBar').style.width = '100%';
      document.getElementById('gameStatus').textContent = '准备开始！';

      window.addEventListener('keydown', handleKeyDown);
      window.addEventListener('keyup', handleKeyUp);
      canvas.addEventListener('click', handleClick);

      if (animationId) cancelAnimationFrame(animationId);
      gameLoop();
    }

    function handleKeyDown(e) {
      keys[e.key.toLowerCase()] = true;
      if (e.key === ' ') {
        e.preventDefault();
        if (player.y >= 430) player.vy = JUMP;
      }
    }

    function handleKeyUp(e) {
      keys[e.key.toLowerCase()] = false;
    }

    function handleClick(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      collectibles.forEach(c => {
        if (!c.collected && x > c.x && x < c.x + c.w && y > c.y && y < c.y + c.h) {
          c.collected = true;
          score += 50;
          document.getElementById('scoreDisplay').textContent = score;
        }
      });
    }

    function gameLoop() {
      // 移动
      if (keys['a'] || keys['arrowleft']) player.vx = -SPEED;
      else if (keys['d'] || keys['arrowright']) player.vx = SPEED;
      else player.vx = 0;

      player.vy += GRAVITY;
      player.x += player.vx;
      player.y += player.vy;

      // 边界
      if (player.x < 0) player.x = 0;
      if (player.x > 760) player.x = 760;
      if (player.y > 460) { player.y = 460; player.vy = 0; }

      // 障碍物碰撞
      obstacles.forEach(o => {
        if (player.x < o.x + o.w && player.x + player.w > o.x &&
            player.y < o.y + o.h && player.y + player.h > o.y) {
          if (player.vy > 0) {
            player.y = o.y - player.h;
            player.vy = 0;
          }
        }
      });

      // 敌人移动
      enemies.forEach(e => {
        e.x += e.vx;
        if (e.x < 0 || e.x > 765) e.vx *= -1;

        // 碰撞伤害
        if (player.x < e.x + e.w && player.x + player.w > e.x &&
            player.y < e.y + e.h && player.y + player.h > e.y) {
          health -= 5;
          player.x -= 30;
          updateHealth();
        }
      });

      // 终点检测
      if (player.x < goal.x + goal.w && player.x + player.w > goal.x &&
          player.y < goal.y + goal.h && player.y + player.h > goal.y) {
        score += 200;
        document.getElementById('gameStatus').textContent = '🎉 恭喜通关！';
        document.getElementById('scoreDisplay').textContent = score;
      }

      draw();
      animationId = requestAnimationFrame(gameLoop);
    }

    function updateHealth() {
      document.getElementById('healthBar').style.width = health + '%';
      document.getElementById('healthBar').className = `h-full transition-all ${health > 60 ? 'bg-green-500' : health > 30 ? 'bg-yellow-500' : 'bg-red-500'}`;
      if (health <= 0) {
        document.getElementById('gameStatus').textContent = '💀 游戏结束';
      }
    }

    function draw() {
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, 800, 500);

      // 网格
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      for (let i = 0; i < 800; i += 40) {
        for (let j = 0; j < 500; j += 40) {
          ctx.strokeRect(i, j, 40, 40);
        }
      }

      // 障碍物
      ctx.fillStyle = '#4b5563';
      obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));

      // 敌人
      enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(e.x, e.y, e.w, e.h);
      });

      // 收集品
      collectibles.forEach(c => {
        if (!c.collected) {
          ctx.fillStyle = c.color;
          ctx.beginPath();
          ctx.arc(c.x + c.w/2, c.y + c.h/2, c.w/2, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.stroke();
        }
      });

      // 终点
      ctx.fillStyle = goal.color;
      ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('🏁', goal.x + 20, goal.y + 28);

      // 玩家
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.strokeStyle = '#fff';
      ctx.strokeRect(player.x, player.y, player.w, player.h);

      // 地面
      ctx.fillStyle = '#374151';
      ctx.fillRect(0, 460, 800, 40);
    }

    function resetPrototype() {

      const scriptEnd = '<' + '/script>';
      const proto = '<!DOCTYPE html><html><head><title>' + design.title + ' - 原型</title><style>body { margin: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: Arial, sans-serif; } canvas { border: 2px solid #a855f7; }</style></head><body><canvas id="game" width="800" height="500"></canvas><script>const canvas = document.getElementById("game"); const ctx = canvas.getContext("2d"); let p = {x:80,y:400,w:40,h:40,vx:0,vy:0,color:"' + design.prototype.playerColor + '"}; let items = [{x:200,y:350,w:25,h:25,c:"#fbbf24"},{x:400,y:300,w:25,h:25,c:"#fbbf24"},{x:600,y:250,w:25,h:25,c:"#fbbf24"}]; let score = 0, keys = {}; document.addEventListener("keydown", e => { keys[e.key] = true; if(e.key === " ") { e.preventDefault(); if(p.y >= 430) p.vy = -14; } }); document.addEventListener("keyup", e => keys[e.key] = false); canvas.addEventListener("click", e => { const x = e.clientX - canvas.getBoundingClientRect().left; const y = e.clientY - canvas.getBoundingClientRect().top; items = items.filter(i => { if(x > i.x && x < i.x + i.w && y > i.y && y < i.y + i.h) { score += 50; return false; } return true; }); }); function loop() { if(keys["a"] || keys["ArrowLeft"]) p.vx = -5; else if(keys["d"] || keys["ArrowRight"]) p.vx = 5; else p.vx = 0; p.vy += 0.6; p.x += p.vx; p.y += p.vy; if(p.x < 0) p.x = 0; if(p.x > 760) p.x = 760; if(p.y > 460) { p.y = 460; p.vy = 0; } ctx.fillStyle = "#1a1a2e"; ctx.fillRect(0,0,800,500); items.forEach(i => { ctx.fillStyle = i.c; ctx.beginPath(); ctx.arc(i.x+i.w/2,i.y+i.h/2,i.w/2,0,Math.PI*2); ctx.fill(); }); ctx.fillStyle = "#374151"; ctx.fillRect(0,460,800,40); ctx.fillStyle = "#10b981"; ctx.fillRect(750,400,40,40); ctx.fillStyle = p.color; ctx.fillRect(p.x,p.y,p.w,p.h); ctx.fillStyle = "#fff"; ctx.font = "20px Arial"; ctx.fillText("终点", 755, 425); ctx.fillText("得分: " + score, 10, 30); requestAnimationFrame(loop); } loop();' + scriptEnd + '</body></html>';

      const blob = new Blob([proto], { type: 'text/html' });
