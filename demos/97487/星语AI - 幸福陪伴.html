.chat-name {

}

.speech-btn.recording {

.bible-title {

<script>
const chatArea = document.getElementById('chatArea');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');
const speechBtn = document.getElementById('speechBtn');
const subtitleBtn = document.getElementById('subtitleBtn');
const videoBtn = document.getElementById('videoBtn');
const videoMode = document.getElementById('videoMode');
const mouth = document.getElementById('mouth');
const videoStatus = document.getElementById('videoStatus');

let isRecording = false;
let isSubtitleMode = false;
let isVideoMode = false;
let recognition = null;

let conversationState = {
    step: 0,
    discomfort: null,
    discomfortArea: null,
    hasBP: null,
    bpValue: null,
    hasO2: null,
    o2Value: null,
    hasMeds: null,
    needsSupplies: null,
    suppliesList: null,
    talkingAboutBible: false
};

let deepSeekApiKey = 'sk-851312c8fa0e4ea89fba7c5b84de60d9';
let chatHistory = [];

async function callDeepSeekApi(prompt) {
    if (!deepSeekApiKey) {
        return null;
    }
    
    const systemMessage = {
        role: 'system',
        content: '你是妈妈的贴心小棉袄，正在和妈妈聊天。说话要温柔体贴，像女儿对妈妈说话一样，带着关心和温暖。用最自然的口语，不要客气见外，想到什么说什么。关心妈妈的身体，问问妈妈吃了没、累不累，让妈妈感受到你的体贴和爱。回答要简短亲切，就像平时跟妈妈聊天一样。'
    };
    
    const messages = [systemMessage, ...chatHistory, {
        role: 'user',
        content: prompt
    }];
    
    try {
        const requestData = {
            model: 'deepseek-chat',
            messages: messages,
            temperature: 0.9,
            max_tokens: 1000,
            stream: false
        };
        
        const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${deepSeekApiKey}`
            },
            body: JSON.stringify(requestData)
        });
        
        console.log('API Response Status:', response.status);
        
        if (!response.ok) {
            const errorText = await response.text();
            console.error('API Error:', response.status, errorText);
            
            if (response.status === 402) {
                return '❌ API Key 余额不足，请前往 DeepSeek 官网充值。';
            } else if (response.status === 401) {
                return '❌ API Key 无效，请检查 Key 是否正确。';
            } else if (response.status === 400) {
                return '❌ 请求格式错误，请稍后重试。';
            } else {
                return `❌ API 错误 (${response.status})，请稍后重试。`;
            }
        }
        
        const data = await response.json();
        console.log('API Response:', data);
        
        if (data.choices && data.choices.length > 0) {
            return data.choices[0].message.content;
        }
        
        if (data.error) {
            console.error('API Error:', data.error.message);
            return `❌ ${data.error.message}`;
        }
        
        return null;
    } catch (error) {
        console.error('DeepSeek API error:', error.message);
        return '❌ 网络连接失败，请检查网络。';
    }
}

    const confirmBtn = document.createElement('button');

function showApiSettingsContent() {
    const modal = document.createElement('div');
    modal.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    `;
    
    const content = document.createElement('div');
    content.style.cssText = `
        background: #fff;
        padding: 30px;
        border-radius: 20px;
        width: 80%;
        max-width: 320px;
    `;
    
    const title = document.createElement('div');
    title.textContent = 'DeepSeek API 设置';
    title.style.cssText = 'font-size: 18px; font-weight: 600; margin-bottom: 20px; text-align: center;';
    
    const input = document.createElement('input');
    input.type = 'password';
    input.placeholder = '请输入 API Key';
    input.value = deepSeekApiKey;
    input.style.cssText = `
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 14px;
        margin-bottom: 20px;
        box-sizing: border-box;
    `;
    
    const saveBtn = document.createElement('button');
    saveBtn.textContent = '保存';
    saveBtn.style.cssText = `
        width: 100%;
        padding: 12px;
        background: #FF69B4;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
    `;
    
    saveBtn.addEventListener('click', () => {
        deepSeekApiKey = input.value;
        localStorage.setItem('deepSeekApiKey', deepSeekApiKey);
        modal.remove();
    });
    
    const closeBtn = document.createElement('button');
    closeBtn.textContent = '关闭';
    closeBtn.style.cssText = `

async function speak(text) {
    const cleanText = text.replace(/[💡📖📅💭🎤🎙️✅🔕🔒📶❌\n\r]/g, '').replace(/\n\n/g, '，').replace(/\n/g, '，').trim();
    if (!cleanText) return;

    mouth.classList.add('speaking');
    if (isVideoMode) {
        videoStatus.textContent = '女儿正在说话...';
    }

    if (!window.speechSynthesis) {
        console.warn('浏览器不支持语音合成');
        mouth.classList.remove('speaking');
        return;
    }

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.9;
    utterance.pitch = 1.1;

    let voices = window.speechSynthesis.getVoices();
    if (voices.length === 0) {
        await new Promise(resolve => {
            window.speechSynthesis.onvoiceschanged = () => {
                resolve();
            };
        });
        voices = window.speechSynthesis.getVoices();
    }

    const preferredNames = [
        'Microsoft Xiaoxiao',
        'Google 普通话',
        'Ting-Ting',
        'Yunyang',
        'Xiaoyi'
    ];
    
    const selectedVoice = voices.find(v =>
        preferredNames.some(name => v.name.includes(name)) && v.lang.startsWith('zh')
    ) || voices.find(v => v.lang.startsWith('zh'));

    if (selectedVoice) {
        utterance.voice = selectedVoice;
        console.log('✅ 使用语音:', selectedVoice.name);
    } else {
        console.log('ℹ️ 使用浏览器默认语音');
    }

    utterance.onend = () => {
        mouth.classList.remove('speaking');
        if (isVideoMode) {
            videoStatus.textContent = '正在倾听...';
        }
    };

    utterance.onerror = (e) => {
        console.error('语音播放出错:', e);
        mouth.classList.remove('speaking');
        if (isVideoMode) {
            videoStatus.textContent = '正在倾听...';
        }
    };

    window.speechSynthesis.speak(utterance);
}

function getBibleContent(category = null) {
    let filteredVerses = bibleVerses;
    if (category) {
        filteredVerses = bibleVerses.filter(v => v.category === category);
        if (filteredVerses.length === 0) {
            filteredVerses = bibleVerses;
        }
    }
    const randomVerse = filteredVerses[Math.floor(Math.random() * filteredVerses.length)];
    return `${randomVerse.title}\n\n${randomVerse.content}`;
}

function getDailyBible() {
    const verse = dailyBible.verse;

}

function getCategoryList() {
    let list = '📚 圣经主题分类：\n\n';
    bibleCategories.forEach((cat, index) => {

    });
    list += '\n你可以说"读一段安慰的经文"或"给我讲信心的经文"哦。';

function getBibleWithExplanation(title = null) {
    let verse;
    if (title) {
        verse = bibleVerses.find(v => v.title.includes(title));
    }
    if (!verse) {
        verse = bibleVerses[Math.floor(Math.random() * bibleVerses.length)];
    }
    return `${verse.title}\n\n${verse.content}\n\n💡 讲解：${verse.explanation}`;
}

async function processUserInput(input) {
    const text = input.trim();
    addMessage(text, 'user');
    
    if (isVideoMode) {
        videoStatus.textContent = '正在思考...';
    }
    
    const typingIndicator = addTypingIndicator();
    
    if (text.includes('圣经') || text.includes('学习圣经')) {
        conversationState.talkingAboutBible = true;
        await new Promise(resolve => setTimeout(resolve, 300));
        removeTypingIndicator();
        handleBibleConversation(text);
        return;
    }
    
    let response = '';
    
    if (deepSeekApiKey) {
        console.log('API Key:', deepSeekApiKey ? '已配置' : '未配置');
        response = await callDeepSeekApi(text);
        console.log('API 返回:', response ? response.substring(0, 50) + '...' : 'null');
    }
    
    if (!response) {
        if (!deepSeekApiKey) {
            response = '请先设置 DeepSeek API Key，否则无法使用 AI 对话功能。';
        } else {
            response = 'AI 暂时无法回复，请稍后再试。';
        }
    }
    
    await new Promise(resolve => setTimeout(resolve, 300));
    removeTypingIndicator();
    
    if (response) {
        addMessage(response, 'bot');
        
        chatHistory.push({ role: 'user', content: text });
        chatHistory.push({ role: 'assistant', content: response });
        
        if (chatHistory.length > 20) {
            chatHistory = chatHistory.slice(-20);
        }
    }
}

function handleBibleConversation(text) {
    let matchedCategory = null;
    bibleCategories.forEach(cat => {
        if (text.includes(cat.name)) {
            matchedCategory = cat.name;
        }
    });

    if (text.includes('再读') || text.includes('继续') || text.includes('换一段')) {
        const response = matchedCategory ? getBibleContent(matchedCategory) : getBibleContent();
        addMessage(response, 'bot');
    } else if (text.includes('不懂') || text.includes('什么意思') || text.includes('讲解') || text.includes('解释')) {
        const response = getBibleWithExplanation();
        addMessage(response, 'bot');
    } else if (text.includes('每日') || text.includes('今天') || text.includes('今日')) {
        const response = getDailyBible();
        addMessage(response, 'bot');
    } else if (text.includes('分类') || text.includes('主题')) {
        const response = getCategoryList();
        addMessage(response, 'bot');
    } else if (matchedCategory) {
        const response = getBibleContent(matchedCategory);
        addMessage(response, 'bot');
    } else if (text.includes('视频') || text.includes('看')) {
        addMessage('好的妈妈，我这里有一些圣经学习资源可以一起看哦。', 'bot');
        setTimeout(() => {
            addBibleResources();
        }, 500);
    } else {
        const responses = [
            '是的妈妈，圣经里的话都很有智慧。',
            '妈妈读得真好！继续加油哦。',
            '这段我也很喜欢，每次读都会觉得很安心。',
            '上帝的话语真是充满力量呢。',
            '妈妈想了解这段经文的意思吗？我可以讲解给你听。'
        ];
        addMessage(responses[Math.floor(Math.random() * responses.length)], 'bot');
    }
}

speechBtn.addEventListener('click', async () => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        inputBox.placeholder = '您的浏览器不支持语音识别，请使用Chrome或Edge';
        return;
    }
    
    if (isRecording) {
        isRecording = false;
        speechBtn.classList.remove('recording');
        inputBox.placeholder = '请输入消息或点击麦克风说话';
        if (recognition) {
            try {
                recognition.stop();
            } catch (e) {}
        }
        return;
    }
    
    inputBox.value = '';
    inputBox.placeholder = '🎤 正在请求麦克风权限...';
    
    try {
        await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
        console.error('麦克风权限请求失败:', err);
        inputBox.placeholder = '🔒 请允许麦克风权限后重试';
        return;
    }
    
    inputBox.placeholder = '🎤 正在启动语音识别...';
    
    recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN';
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    
    recognition.onstart = () => {
        isRecording = true;
        speechBtn.classList.add('recording');
        inputBox.value = '';
        inputBox.placeholder = '🎤 正在听您说话，请开口...';
        if (isVideoMode) {
            videoStatus.textContent = '正在听您说话...';
        }
    };
    
    recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            transcript += event.results[i][0].transcript;
        }
        inputBox.value = transcript;
        
        if (event.results[event.results.length - 1].isFinal) {
            isRecording = false;
            speechBtn.classList.remove('recording');
            setTimeout(() => {
                if (inputBox.value.trim()) {
                    processUserInput(inputBox.value.trim());
                    inputBox.value = '';
                }
                inputBox.placeholder = '请输入消息或点击麦克风说话';
            }, 300);
        }
    };
    
    recognition.onerror = (event) => {
        console.error('语音识别错误:', event.error);
        isRecording = false;
        speechBtn.classList.remove('recording');
        
        if (event.error === 'no-speech') {
            inputBox.placeholder = '🔕 没有听到声音，请再试一次';
        } else if (event.error === 'not-allowed' || event.error === 'audio-capture') {
            inputBox.placeholder = '🔒 请允许麦克风权限后重试';
        } else if (event.error === 'network') {
            inputBox.placeholder = '📶 网络错误，请检查网络连接';
        } else {
            inputBox.placeholder = '❌ 识别出错: ' + event.error;
        }
    };
    
    recognition.onend = () => {
        isRecording = false;
        speechBtn.classList.remove('recording');
        
        if (isVideoMode) {
            videoStatus.textContent = '正在倾听...';
        }
    };
    
    try {
        recognition.start();
    } catch (e) {
        console.error('启动语音识别失败:', e);
        inputBox.placeholder = '❌ 启动失败: ' + e.message;
        speechBtn.classList.remove('recording');
    }
});

subtitleBtn.addEventListener('click', () => {
    isSubtitleMode = !isSubtitleMode;
    subtitleBtn.classList.toggle('active');
    if (isSubtitleMode) {
        subtitleBtn.textContent = '语音';
        subtitleBtn.style.background = 'rgba(255,255,255,0.9)';
        subtitleBtn.style.color = '#FF69B4';
    } else {
        subtitleBtn.textContent = '字幕';
        subtitleBtn.style.background = 'rgba(255,255,255,0.3)';
        subtitleBtn.style.color = '#fff';
    }
});

videoBtn.addEventListener('click', () => {
    isVideoMode = !isVideoMode;
    videoMode.classList.toggle('active');
});

const bibleBtn = document.getElementById('bibleBtn');
bibleBtn.addEventListener('click', () => {
    bibleBtn.classList.toggle('active');
    if (bibleBtn.classList.contains('active')) {
        bibleBtn.style.background = 'rgba(255,255,255,0.9)';
        bibleBtn.style.color = '#FF69B4';
        addMessage(getBibleContent(), 'bot');
        conversationState.talkingAboutBible = true;
    } else {
        bibleBtn.style.background = 'rgba(255,255,255,0.3)';
        bibleBtn.style.color = '#fff';
    }
});

const apiBtn = document.getElementById('apiBtn');
apiBtn.addEventListener('click', () => {
    showApiSettings();
});

initSpeechRecognition();

window.addEventListener('load', () => {
    setTimeout(() => {
        addMessage('妈妈，早上好！', 'bot');
    }, 500);
});
</script>
</body>
