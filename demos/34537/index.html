<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冰箱异世界 - 可爱像素风试玩Demo</title>
    
    <!-- 引入 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================
           2.2 限定调色板（32色）- CSS 变量定义
           ======================================== */
        :root {
            /* 背景/环境色 */
            --color-deep-night: #1A1C2C;      /* 深夜蓝（冰箱内部背景） */
            --color-stroke-black: #2B2B2B;    /* 描边黑 */
            --color-shadow: #3E3E5E;          /* 暗紫灰（阴影） */
            --color-steel-blue: #5B6E8A;      /* 冷钢蓝（冰箱外壳） */
            --color-ice-blue: #8DAFC9;        /* 浅冰蓝（冰箱内层高光） */
            --color-frost-white: #D4E4F7;     /* 霜白蓝（冷气/霜效果） */
            --color-snow-white: #F0F4F8;      /* 雪白（高光/文字背景） */
            
            /* 食材暖色系 */
            --color-tomato-red: #E84855;      /* 番茄红 */
            --color-coral-red: #FF6B6B;       /* 浅珊瑚红 */
            --color-carrot-orange: #F9A03F;   /* 胡萝卜橙 */
            --color-corn-yellow: #F7D060;     /* 玉米黄 */
            --color-cream-yellow: #FFF1A8;    /* 奶油淡黄 */
            --color-veg-green: #7BC950;       /* 蔬菜绿 */
            --color-leaf-green: #4FA832;      /* 深叶绿 */
            --color-mint-green: #2D936C;      /* 薄荷绿 */
            
            /* 肉蛋奶系 */
            --color-egg-white: #F2E6D9;       /* 蛋壳白 */
            --color-meat-pink: #FFDAB9;       /* 肉色粉 */
            --color-cooked-brown: #C97B63;    /* 熟肉棕 */
            --color-soy-brown: #8B5E3C;       /* 深棕（酱油/巧克力） */
            --color-tofu-beige: #F5E6CC;      /* 豆腐米 */
            --color-milk-white: #FFF5EE;      /* 牛奶白 */
            
            /* 特效/UI色 */
            --color-danger-red: #FF477E;      /* 黑化红（危险/警告） */
            --color-magic-purple: #A837CF;    /* 神秘紫（魔法/特效） */
            --color-info-blue: #5FCDE4;       /* 信息蓝（按钮/提示） */
            --color-success-cyan: #44CFCB;    /* 清新青（成功/治愈） */
            --color-medal-gold: #FFD700;      /* 勋章金（奖励） */
            --color-cute-pink: #FF85A1;       /* 可爱粉（UI装饰） */
            --color-confirm-green: #B8E6B8;   /* 薄荷浅绿（确认按钮） */
            --color-panel-brown: #6B4226;     /* 像素棕（面板边框） */
        }
        
        /* ========================================
           全局像素风样式
           ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;         /* 像素渲染模式 */
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        
        body {
            font-family: 'ZCOOL QingKe HuangYou', 'Press Start 2P', cursive;
            background: linear-gradient(135deg, var(--color-steel-blue), var(--color-deep-night));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--color-snow-white);
        }
        
        /* 响应式容器 */
        #game-container {
            max-width: 480px;
            width: 100%;
            background: var(--color-deep-night);
            border: 4px solid var(--color-stroke-black);
            box-shadow: 0 0 0 4px var(--color-stroke-black),
                        8px 8px 0 4px var(--color-shadow);
            position: relative;
            overflow: hidden;
        }
        
        /* 所有页面默认隐藏 */
        .page {
            display: none;
            padding: 20px;
            min-height: 600px;
        }
        
        /* 直角边框全局应用 */
        * {
            border-radius: 0 !important;
        }
        
        /* ========================================
           像素按钮样式
           ======================================== */
        .pixel-btn {
            font-family: 'ZCOOL QingKe HuangYou', cursive;
            font-size: 16px;
            padding: 12px 24px;
            border: 3px solid var(--color-stroke-black);
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 var(--color-stroke-black);
            position: relative;
            top: 0;
            color: var(--color-stroke-black);
            font-weight: bold;
            text-align: center;
            display: inline-block;
            text-decoration: none;
        }
        
        .pixel-btn:hover {
            opacity: 0.9;
        }
        
        .pixel-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--color-stroke-black);
        }
        
        /* 主要按钮（蓝色） */
        .pixel-btn-primary {
            background: var(--color-info-blue);
        }
        
        /* 确认按钮（绿色） */
        .pixel-btn-confirm {
            background: var(--color-confirm-green);
        }
        
        /* 危险按钮（红色） */
        .pixel-btn-danger {
            background: var(--color-danger-red);
            color: var(--color-snow-white);
        }
        
        /* ========================================
           标题画面样式
           ======================================== */
        #page-title {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(180deg, var(--color-deep-night), var(--color-shadow));
        }
        
        .game-title {
            font-size: 32px;
            color: var(--color-corn-yellow);
            text-shadow: 4px 4px 0 var(--color-stroke-black),
                        -2px -2px 0 var(--color-stroke-black),
                        2px -2px 0 var(--color-stroke-black),
                        -2px 2px 0 var(--color-stroke-black);
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        
        .title-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 300px;
        }
        
        /* ========================================
           昵称输入框样式
           ======================================== */
        #page-nickname {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        
        .nickname-label {
            font-size: 20px;
            color: var(--color-snow-white);
        }
        
        .pixel-input {
            font-family: 'ZCOOL QingKe HuangYou', cursive;
            font-size: 18px;
            padding: 12px 16px;
            border: 3px solid var(--color-stroke-black);
            background: var(--color-snow-white);
            color: var(--color-stroke-black);
            width: 100%;
            max-width: 300px;
            outline: none;
            box-shadow: 0 4px 0 var(--color-stroke-black);
        }
        
        .pixel-input:focus {
            background: var(--color-cream-yellow);
        }
        
        /* ========================================
           其他页面基础样式
           ======================================== */
        .page-header {
            font-size: 24px;
            color: var(--color-corn-yellow);
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 var(--color-stroke-black);
        }
        
        .page-content {
            color: var(--color-snow-white);
            line-height: 1.8;
        }
        
        /* ========================================
           冰箱界面样式
           ======================================== */
        #page-fridge {
            position: relative;
        }
        
        /* 冰箱门容器 */
        .fridge-door-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 1000px;
            pointer-events: none;
            z-index: 10;
        }
        
        /* 冰箱门 */
        .fridge-door {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--color-ice-blue), var(--color-frost-white));
            border: 4px solid var(--color-stroke-black);
            transform-origin: left center;
            transform: rotateY(0deg);
            transition: transform 0.5s ease-out;
            box-shadow: inset 0 0 20px rgba(141,175,201,0.5);
        }
        
        .fridge-door.open {
            transform: rotateY(-110deg);
        }
        
        /* 冷气粒子效果 */
        .cold-air-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--color-frost-white);
            opacity: 0;
            pointer-events: none;
            animation: coldAirRise 2s ease-out forwards;
        }
        
        .cold-air-particle:nth-child(1) {
            left: 20%;
            animation-delay: 0s;
        }
        
        .cold-air-particle:nth-child(2) {
            left: 40%;
            animation-delay: 0.2s;
        }
        
        .cold-air-particle:nth-child(3) {
            left: 60%;
            animation-delay: 0.4s;
        }
        
        .cold-air-particle:nth-child(4) {
            left: 80%;
            animation-delay: 0.6s;
        }
        
        .cold-air-particle:nth-child(5) {
            left: 50%;
            animation-delay: 0.8s;
        }
        
        @keyframes coldAirRise {
            0% {
                bottom: 0%;
                opacity: 0;
                transform: scale(0.5);
            }
            20% {
                opacity: 0.8;
            }
            100% {
                bottom: 100%;
                opacity: 0;
                transform: scale(1.5);
            }
        }
        
        #fridge-content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            padding: 20px;
            background: var(--color-ice-blue);
            border: 3px solid var(--color-stroke-black);
            min-height: 300px;
        }
        
        .ingredient-card {
            background: var(--color-snow-white);
            border: 3px solid var(--color-stroke-black);
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            box-shadow: 0 3px 0 var(--color-stroke-black);
        }
        
        /* 待机浮动动画 - 1.2s循环，上下浮动2-3px */
        .ingredient-card.float-idle {
            animation: floatIdle 1.2s ease-in-out infinite;
        }
        
        @keyframes floatIdle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        
        /* 紧急状态闪烁动画 - 0.5s循环，边框红色闪烁 */
        .ingredient-card.pulse-critical {
            animation: pulseCritical 0.5s ease-in-out infinite;
        }
        
        @keyframes pulseCritical {
            0%, 100% { 
                border-color: var(--color-stroke-black);
                box-shadow: 0 3px 0 var(--color-stroke-black);
            }
            50% { 
                border-color: var(--color-danger-red);
                box-shadow: 0 0 8px 2px var(--color-danger-red), 0 3px 0 var(--color-danger-red);
            }
        }
        
        /* 黑化震动动画 - 0.3s，左右震动 */
        .ingredient-card.shake {
            animation: shakeAnim 0.3s ease-in-out infinite;
        }
        
        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }
        
        .ingredient-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 0 var(--color-stroke-black);
        }
        
        .ingredient-card.float-idle:hover {
            animation: none;
            transform: translateY(-2px);
            box-shadow: 0 5px 0 var(--color-stroke-black);
        }
        
        .ingredient-card.selected {
            border-color: var(--color-success-cyan);
            box-shadow: 0 0 0 3px var(--color-success-cyan);
            transform: scale(1.05);
        }
        
        .ingredient-card.corrupted {
            background: var(--color-danger-red);
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .ingredient-avatar {
            width: 60px;
            height: 60px;
            margin: 0 auto 8px;
            border: 2px solid var(--color-stroke-black);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            line-height: 1;
            background: var(--color-snow-white);
        }
        
        .ingredient-name {
            font-size: 14px;
            color: var(--color-stroke-black);
            text-align: center;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .ingredient-personality {
            font-size: 11px;
            color: var(--color-shadow);
            text-align: center;
            margin-bottom: 5px;
        }
        
        .ingredient-shelf {
            font-size: 12px;
            text-align: center;
            padding: 3px 6px;
            background: var(--color-cream-yellow);
            border: 2px solid var(--color-stroke-black);
            color: var(--color-stroke-black);
            font-weight: bold;
        }
        
        .shelf-warning {
            background: var(--color-carrot-orange);
            color: var(--color-stroke-black);
        }
        
        .shelf-critical {
            background: var(--color-danger-red);
            color: var(--color-snow-white);
            animation: blink 0.5s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 对话气泡 */
        .dialogue-bubble {
            position: absolute;
            background: var(--color-snow-white);
            border: 3px solid var(--color-stroke-black);
            padding: 10px;
            font-size: 12px;
            color: var(--color-stroke-black);
            max-width: 150px;
            z-index: 100;
            box-shadow: 0 3px 0 var(--color-stroke-black);
            animation: bubbleFade 3s ease-out forwards;
        }
        
        .dialogue-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: var(--color-stroke-black);
        }
        
        @keyframes bubbleFade {
            0% { opacity: 0; transform: translateY(10px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        /* 选择面板 */
        #selection-panel {
            background: var(--color-shadow);
            border: 3px solid var(--color-stroke-black);
            padding: 15px;
            margin-top: 20px;
        }
        
        #selected-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
            min-height: 40px;
        }
        
        .selected-tag {
            background: var(--color-success-cyan);
            color: var(--color-stroke-black);
            padding: 5px 10px;
            border: 2px solid var(--color-stroke-black);
            font-size: 12px;
        }
        
        #btn-start-cooking {
            width: 100%;
            font-size: 18px;
            padding: 15px;
        }
        
        #btn-start-cooking:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* ========================================
           烹饪小游戏样式
           ======================================== */
        #cooking-content {
            text-align: center;
            padding: 20px;
        }
        
        .cooking-progress {
            width: 100%;
            height: 40px;
            background: var(--color-shadow);
            border: 3px solid var(--color-stroke-black);
            margin: 10px 0 30px 0;
            position: relative;
            overflow: visible;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--color-success-cyan), var(--color-info-blue));
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .progress-cursor {
            position: absolute;
            top: -5px;
            width: 4px;
            height: 50px;
            background: var(--color-danger-red);
            transition: left 0.05s linear;
            z-index: 5;
            pointer-events: none;
        }
        
        .rhythm-point {
            position: absolute;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--color-corn-yellow);
        }
        
        .rhythm-label {
            position: absolute;
            top: -25px;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: bold;
            color: var(--color-corn-yellow);
            text-shadow: 1px 1px 0 var(--color-stroke-black);
            white-space: nowrap;
        }
        
        .cooking-timer {
            font-size: 28px;
            color: var(--color-corn-yellow);
            text-shadow: 2px 2px 0 var(--color-stroke-black);
            margin: 10px 0;
        }
        
        .cooking-hint {
            font-size: 16px;
            color: var(--color-frost-white);
            margin: 10px 0;
            min-height: 24px;
        }
        
        .combo-multiplier {
            font-size: 18px;
            color: var(--color-cute-pink);
            margin: 5px 0;
            min-height: 24px;
            text-shadow: 1px 1px 0 var(--color-stroke-black);
        }
        
        .cooking-feedback {
            font-size: 32px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 50px;
        }
        
        .feedback-perfect {
            color: var(--color-corn-yellow);
            text-shadow: 2px 2px 0 var(--color-stroke-black);
            animation: feedbackPop 0.3s ease-out;
        }
        
        .feedback-good {
            color: var(--color-success-cyan);
            text-shadow: 2px 2px 0 var(--color-stroke-black);
            animation: feedbackPop 0.3s ease-out;
        }
        
        .feedback-miss {
            color: var(--color-danger-red);
            text-shadow: 2px 2px 0 var(--color-stroke-black);
            animation: feedbackPop 0.3s ease-out;
        }
        
        @keyframes feedbackPop {
            0% { transform: scale(0.5); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        .combo-counter {
            font-size: 24px;
            color: var(--color-magic-purple);
            margin: 10px 0;
        }
        
        .cooking-score {
            font-size: 20px;
            color: var(--color-corn-yellow);
            margin: 20px 0;
        }
        
        /* ========================================
           剧情界面样式
           ======================================== */
        #story-content {
            background: var(--color-shadow);
            border: 3px solid var(--color-stroke-black);
            padding: 20px;
            margin: 20px 0;
            min-height: 200px;
            font-size: 16px;
            line-height: 2;
        }
        
        .story-line {
            margin-bottom: 15px;
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ========================================
           结局界面样式
           ======================================== */
        #ending-content {
            text-align: center;
            padding: 30px 20px;
        }
        
        .ending-title {
            font-size: 28px;
            margin-bottom: 30px;
            text-shadow: 3px 3px 0 var(--color-stroke-black);
        }
        
        .ending-description {
            font-size: 16px;
            line-height: 2;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--color-shadow);
            border: 3px solid var(--color-stroke-black);
        }
        
        .ending-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
            padding: 20px;
            background: var(--color-shadow);
            border: 3px solid var(--color-stroke-black);
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            color: var(--color-corn-yellow);
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 14px;
            color: var(--color-frost-white);
            margin-top: 5px;
        }
        
        .medal-display {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        
        .medal {
            background: var(--color-medal-gold);
            color: var(--color-stroke-black);
            padding: 8px 15px;
            border: 3px solid var(--color-stroke-black);
            font-size: 14px;
            font-weight: bold;
            animation: medalDrop 0.8s ease-out;
        }
        
        /* 勋章掉落动画 - 从上方掉入，0.8s */
        @keyframes medalDrop {
            0% {
                transform: translateY(-100px);
                opacity: 0;
            }
            60% {
                transform: translateY(10px);
                opacity: 1;
            }
            80% {
                transform: translateY(-5px);
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .ending-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }
        
        /* 每日开始页面增强 */
        #day-start-content {
            background: var(--color-shadow);
            border: 3px solid var(--color-stroke-black);
            padding: 20px;
            margin: 20px 0;
            min-height: 150px;
            font-size: 16px;
            line-height: 2;
        }
    </style>
</head>
<body>
    <!-- 游戏主容器 -->
    <div id="game-container">
        
        <!-- 页面1：标题画面 -->
        <div id="page-title" class="page">
            <h1 class="game-title">冰箱异世界</h1>
            <div class="title-buttons">
                <button class="pixel-btn pixel-btn-primary" onclick="switchPage('nickname')">开始游戏</button>
                <button class="pixel-btn pixel-btn-confirm" id="btn-continue" style="display:none;" onclick="continueGame()">继续游戏</button>
            </div>
        </div>
        
        <!-- 页面2：昵称输入 -->
        <div id="page-nickname" class="page">
            <div class="page-header">请输入你的昵称</div>
            <label class="nickname-label">厨师名称：</label>
            <input type="text" class="pixel-input" id="input-nickname" placeholder="输入昵称..." maxlength="10">
            <button class="pixel-btn pixel-btn-confirm" onclick="confirmNickname()">确认</button>
        </div>
        
        <!-- 页面3：每日开始 -->
        <div id="page-day-start" class="page">

        /* ========================================

        /**
         * 初始化游戏状态
         */
        function initGameState() {
            gameState = {
                playerName: '',
                currentDay: 1,
                fridge: [],
                savedCount: 0,
                corruptedCount: 0,
                medals: [],
                recipes: [],
                selectedIngredients: []
            };
        }
        
        /**
         * 保存游戏到 localStorage
         */
        function saveGame() {
            try {
                localStorage.setItem('fridgeGameSave', JSON.stringify(gameState));
                console.log('游戏已保存');
            } catch (e) {
                console.error('保存游戏失败:', e);
            }
        }
        
        /**
         * 从 localStorage 加载游戏
         */
        function loadGame() {
            try {
                const saveData = localStorage.getItem('fridgeGameSave');
                if (saveData) {
                    gameState = JSON.parse(saveData);
                    console.log('游戏已加载');
                    return true;
                }
                return false;
            } catch (e) {
                console.error('加载游戏失败:', e);
                return false;
            }
        }
        
        /**
         * 检查存档是否存在
         */
        function hasSave() {
            return localStorage.getItem('fridgeGameSave') !== null;
        }

           5. 页面状态机

         * 切换页面
         * @param {string} pageName - 目标页面名称
         */
        function switchPage(pageName) {
            // 隐藏所有页面
            PAGES.forEach(p => {
                document.getElementById(`page-${p}`).style.display = 'none';
            });
            // 显示目标页面
            document.getElementById(`page-${pageName}`).style.display = 'block';

            if (pageName === 'title') {
                checkContinueButton();
            }
        }

         */

            if (hasSave()) {

            }

                initAudioSystem();

           4.1 日循环系统

         */
        function startDay(dayNumber) {
            gameState.currentDay = dayNumber;
            gameState.selectedIngredients = [];
            
            // 显示当日标题
            const storyData = STORIES[dayNumber];
            document.getElementById('day-start-title').textContent = `Day ${dayNumber} - ${storyData.title}`;
            
            // 播放每日剧情
            playDailyStory(dayNumber);
            
            // 加载当日食材配置到冰箱
            loadDailyFridge(dayNumber);
            
            // 渲染冰箱界面
            renderFridge();
            
            // 更新选择 UI
            updateSelectionUI();
            
            // 切换到每日开始页面
            switchPage('day-start');
            
            saveGame();
        }
        
        /**
         * 播放每日剧情
         * @param {number} dayNumber - 天数
         */
        function playDailyStory(dayNumber) {
            const storyData = STORIES[dayNumber];
            const contentDiv = document.getElementById('day-start-content');
            contentDiv.innerHTML = '';
            
            // 显示所有剧情文本
            storyData.lines.forEach((line, index) => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'story-line';
                lineDiv.textContent = line;
                lineDiv.style.animationDelay = `${index * 0.3}s`;
                contentDiv.appendChild(lineDiv);
            });
        }
        
        /**
         * 加载当日食材到冰箱
         * @param {number} dayNumber - 天数
         */
        function loadDailyFridge(dayNumber) {
            const dailyConfig = DAILY_FRIDGE[dayNumber];
            
            // 保留未烹饪且未黑化的旧食材，保质期已在上一步递减
            const survivingIngredients = gameState.fridge.filter(i => 
                !i.isSaved && !i.isCorrupted && i.remainingDays > 0
            );
            
            // 添加新食材
            const newIngredients = [];
            dailyConfig.forEach(ingredientId => {
                // 检查是否已有该食材
                const existing = survivingIngredients.find(i => i.id === ingredientId);
                if (!existing) {
                    const ingredientData = INGREDIENTS[ingredientId];
                    const minLife = ingredientData.shelfLife.min;
                    const maxLife = ingredientData.shelfLife.max;
                    const remainingDays = Math.floor(Math.random() * (maxLife - minLife + 1)) + minLife;
                    newIngredients.push({
                        id: ingredientId,
                        remainingDays: remainingDays,
                        isCorrupted: false,
                        isSaved: false
                    });
                }
            });
            
            gameState.fridge = [...survivingIngredients, ...newIngredients];
        }
        
        /**
         * 结束当天
         */
        function endDay() {
            // 递减所有未烹饪食材的保质期
            updateSpoilage();
            
            // 检查黑化状态
            checkCorruption();
            
            // 保存游戏
            saveGame();
            
            // 进入下一天或结局
            if (gameState.currentDay >= 7) {
                // 七天结束，显示结局
                showEnding();
            } else {
                // 进入下一天
                startDay(gameState.currentDay + 1);
            }
        }
        
        /* ========================================
           4.2 保质期/黑化系统
           ======================================== */
        
        /**
         * 更新所有食材保质期
         */
        function updateSpoilage() {
            gameState.fridge.forEach(ingredient => {
                // 只递减未烹饪且未黑化的食材
                if (!ingredient.isSaved && !ingredient.isCorrupted) {
                    ingredient.remainingDays -= 1;
                }
            });
        }
        
        /**
         * 获取食材状态
         * @param {number} remainingDays - 剩余天数
         * @returns {string} 'normal' | 'warning' | 'critical' | 'corrupted'
         */
        function getIngredientState(remainingDays) {
            if (remainingDays <= 0) return 'corrupted';
            if (remainingDays <= 1) return 'critical';
            if (remainingDays <= 2) return 'warning';
            return 'normal';
        }
        
        /**
         * 检查并触发黑化
         */
        function checkCorruption() {
            gameState.fridge.forEach(ingredient => {
                if (ingredient.remainingDays <= 0 && !ingredient.isSaved && !ingredient.isCorrupted) {
                    ingredient.isCorrupted = true;
                    gameState.corruptedCount++;
                }
            });
        }

           4.3 食材选择系统

        function toggleIngredientSelection(ingredientId) {
            const ingredient = gameState.fridge.find(i => i.id === ingredientId);
            
            // 不能选择已黑化的食材
            if (ingredient.isCorrupted) {
                return;
            }
            
            const selectedIndex = gameState.selectedIngredients.indexOf(ingredientId);
            
            if (selectedIndex === -1) {
                // 未选中，尝试选中
                if (gameState.selectedIngredients.length < 3) {
                    gameState.selectedIngredients.push(ingredientId);
                }
            } else {
                // 已选中，取消选中
                gameState.selectedIngredients.splice(selectedIndex, 1);
            }
            
            // 更新 UI
            updateSelectionUI();
            renderFridge();
        }
        
        /**
         * 获取已选食材列表
         * @returns {Array} 已选食材 ID 数组

        function getSelectedIngredients() {
            return gameState.selectedIngredients;
        }
        
        /**

        function updateSelectionUI() {

        /* ========================================
           4.4 菜谱匹配系统
           ======================================== */
        
        /**
         * 匹配菜谱
         * @param {Array} selectedIngredientIds - 选中的食材 ID 数组
         * @returns {Object|null} 匹配到的菜谱或 null
         */
        function matchRecipe(selectedIngredientIds) {
            const sortedSelected = [...selectedIngredientIds].sort();
            
            // 精确匹配：选择的食材完全匹配某菜谱的 ingredients
            for (let recipe of RECIPES) {
                if (recipe.ingredients[0] === 'ANY3') continue; // 跳过万能匹配
                
                const sortedRecipe = [...recipe.ingredients].sort();
                if (sortedSelected.length === sortedRecipe.length &&
                    sortedSelected.every((id, idx) => id === sortedRecipe[idx])) {
                    return recipe;
                }
            }
            
            // 部分匹配：选择的食材包含某菜谱的核心食材 >= 2 个
            for (let recipe of RECIPES) {
                if (recipe.ingredients[0] === 'ANY3') continue;
                
                const matchCount = selectedIngredientIds.filter(id => 
                    recipe.ingredients.includes(id)
                ).length;
                
                if (matchCount >= 2) {
                    return recipe;
                }
            }
            
            // 万能匹配：任意 3 个食材 → 全家福火锅 (R05)
            if (selectedIngredientIds.length === 3) {
                return RECIPES.find(r => r.id === 'R05');
            }
            
            // 兜底匹配：任意 2 个食材 → 返回 null（使用通用剧情）
            return null;
        }
        
        /**
         * 获取烹饪剧情
         * @param {Object|null} recipe - 匹配到的菜谱
         * @param {Array} selectedIngredients - 选中的食材
         * @returns {string} 剧情文本
         */
        function getCookingStory(recipe, selectedIngredients) {
            if (recipe && recipe.story) {
                return recipe.story;
            }
            
            // 通用剧情
            const ingredientNames = selectedIngredients.map(id => INGREDIENTS[id].name).join('和');
            return `${ingredientNames}一起跳进了锅里，完成了它们的使命。`;
        }
        
        /* ========================================
           4.5 烹饪小游戏
           ======================================== */
        
        let cookingGameState = {
            startTime: 0,
            clicks: [],
            score: 0,
            combo: 0,
            maxCombo: 0,
            rhythmPoints: [0, 1500, 3000], // 0s, 1.5s, 3s in milliseconds
            duration: 3000,
            isRunning: false
        };
        
        /**
         * 开始烹饪游戏
         */
        function startCookingGame() {
            // 重置游戏状态
            cookingGameState = {
                startTime: Date.now(),
                clicks: [],
                score: 0,
                combo: 0,
                maxCombo: 0,
                rhythmPoints: [0, 1500, 3000],
                duration: 3000,
                isRunning: true
            };
            
            // 切换到烹饪页面
            switchPage('cooking');
            
            // 重置 UI
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('progress-cursor').style.left = '0%';
            document.getElementById('cooking-feedback').textContent = '';
            document.getElementById('combo-counter').textContent = '连击: 0';
            document.getElementById('combo-multiplier').textContent = '';
            document.getElementById('cooking-score').textContent = '得分: 0';
            document.getElementById('cooking-timer').textContent = '3.0s';
            document.getElementById('cooking-hint').textContent = '等待节奏点...';
            document.getElementById('btn-cooking-click').disabled = false;
            
            // 启动进度条动画
            const progressBar = document.getElementById('progress-bar');
            const progressCursor = document.getElementById('progress-cursor');
            const cookingTimer = document.getElementById('cooking-timer');
            const cookingHint = document.getElementById('cooking-hint');
            const startTime = Date.now();
            
            function updateProgress() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min((elapsed / cookingGameState.duration) * 100, 100);
                const remaining = Math.max((cookingGameState.duration - elapsed) / 1000, 0);
                
                progressBar.style.width = progress + '%';
                progressCursor.style.left = progress + '%';
                cookingTimer.textContent = remaining.toFixed(1) + 's';
                
                // 更新提示文字
                let nearestRhythm = null;
                let minDistance = Infinity;
                cookingGameState.rhythmPoints.forEach(rhythmTime => {
                    const distance = Math.abs(elapsed - rhythmTime);
                    if (distance < minDistance) {
                        minDistance = distance;
                        nearestRhythm = rhythmTime;
                    }
                });
                
                // 当接近节奏点时（±500ms）显示提示
                if (minDistance <= 500) {
                    cookingHint.textContent = '准备...';
                    cookingHint.style.color = 'var(--color-corn-yellow)';
                } else {
                    cookingHint.textContent = '等待节奏点...';
                    cookingHint.style.color = 'var(--color-frost-white)';
                }
                
                if (elapsed < cookingGameState.duration) {
                    requestAnimationFrame(updateProgress);
                } else {
                    // 时间到，结束游戏
                    cookingHint.textContent = '完成!';
                    endCookingGame();
                }
            }
            
            updateProgress();
        }
        
        /**
         * 处理玩家点击
         */
        function handleCookingClick() {
            if (!cookingGameState.isRunning) return;
            
            const clickTime = Date.now() - cookingGameState.startTime;
            cookingGameState.clicks.push(clickTime);
            
            // 初始化音效系统（首次交互）
            initAudioSystem();
            
            // 播放点击音效
            playClickSound();
            
            // 找到最近的节奏点
            let minDiff = Infinity;
            cookingGameState.rhythmPoints.forEach(rhythmTime => {
                const diff = Math.abs(clickTime - rhythmTime);
                if (diff < minDiff) {
                    minDiff = diff;
                }
            });
            
            // 判定结果
            let judgment = '';
            let points = 0;
            const feedbackDiv = document.getElementById('cooking-feedback');
            
            if (minDiff <= 150) {
                judgment = 'Perfect!';
                points = 100;
                cookingGameState.combo++;
                feedbackDiv.className = 'cooking-feedback feedback-perfect';
            } else if (minDiff <= 400) {
                judgment = 'Good!';
                points = 50;
                cookingGameState.combo++;
                feedbackDiv.className = 'cooking-feedback feedback-good';
            } else {
                judgment = 'Miss';
                points = 0;
                cookingGameState.combo = 0;
                feedbackDiv.className = 'cooking-feedback feedback-miss';
            }
            
            // 更新连击
            if (cookingGameState.combo > cookingGameState.maxCombo) {
                cookingGameState.maxCombo = cookingGameState.combo;
            }
            
            // 计算连击倍率
            let multiplier = 1;
            if (cookingGameState.combo >= 3) {
                multiplier = Math.min(Math.floor(cookingGameState.combo / 2), 5);
            }
            
            // 累加得分（应用倍率）
            cookingGameState.score += points * multiplier;
            
            // 更新 UI
            feedbackDiv.textContent = judgment;
            document.getElementById('combo-counter').textContent = `连击: ${cookingGameState.combo}`;
            document.getElementById('cooking-score').textContent = `得分: ${cookingGameState.score}`;
            
            // 更新连击倍率显示
            const multiplierDiv = document.getElementById('combo-multiplier');
            if (multiplier > 1) {
                multiplierDiv.textContent = `× ${multiplier} 倍率!`;
            } else {
                multiplierDiv.textContent = '';
            }
        }
        
        /**
         * 结束烹饪游戏
         */
        function endCookingGame() {
            cookingGameState.isRunning = false;
            document.getElementById('btn-cooking-click').disabled = true;
            
            // 计算总分
            const finalScore = cookingGameState.score;
            
            // 判定品质
            let quality = '';
            if (finalScore >= 240) {
                quality = '完美';
            } else if (finalScore >= 120) {
                quality = '良好';
            } else {
                quality = '普通';
            }
            
            // 播放烹饪完成音效
            playCookingCompleteSound();
            
            // 返回烹饪结果
            const result = {
                score: finalScore,
                quality: quality,
                maxCombo: cookingGameState.maxCombo
            };
            
            // 延迟一下再进入剧情
            setTimeout(() => {
                onCookingComplete(result);
            }, 1000);
        }
        
        /**
         * 烹饪完成后的处理
         * @param {Object} result - 烹饪结果

        function onCookingComplete(result) {

            const recipe = matchRecipe(gameState.selectedIngredients);
            const story = getCookingStory(recipe, gameState.selectedIngredients);

         * @returns {string} HTML 字符串
         */
        function renderIngredientCard(ingredient, state) {
            const ingredientData = INGREDIENTS[ingredient.id];
            const isSelected = gameState.selectedIngredients.includes(ingredient.id);
            const isCorrupted = ingredient.isCorrupted;
            
            let cardClass = 'ingredient-card';
            if (isSelected) cardClass += ' selected';
            if (isCorrupted) cardClass += ' corrupted';
            
            // 添加动画类
            if (isCorrupted) {
                cardClass += ' shake';
            } else if (state === 'critical') {
                cardClass += ' pulse-critical';
            } else {
                cardClass += ' float-idle';
            }
            
            let shelfClass = 'ingredient-shelf';
            if (state === 'warning') shelfClass += ' shelf-warning';
            if (state === 'critical') shelfClass += ' shelf-critical';
            
            const shelfText = isCorrupted ? '已黑化' : 
                             state === 'corrupted' ? '已黑化' : 
                             `剩余 ${ingredient.remainingDays} 天`;
            
            // emoji 映射
            const emojiMap = {
                'V01': '🍅', 'V02': '🥕', 'V04': '🥒', 'V08': '🌽',
                'P01': '🥚', 'P02': '🍗', 'P04': '🧈', 'S01': '🍚',
                'S04': '🫙', 'S05': '🧄'
            };
            const emoji = emojiMap[ingredient.id] || '❓';
            
            return `
                <div class="${cardClass}" data-ingredient-id="${ingredient.id}">
                    <div class="ingredient-avatar">${emoji}</div>
                    <div class="ingredient-name">${ingredientData.name}</div>
                    <div class="ingredient-personality">${ingredientData.personality}</div>
                    <div class="${shelfClass}">${shelfText}</div>

            const ingredient = gameState.fridge.find(i => i.id === ingredientId);
            if (!ingredient) return;
            
            const ingredientData = INGREDIENTS[ingredientId];
            const state = getIngredientState(ingredient.remainingDays);
            const dialogueText = getDialogueText(ingredientData.personality, state);
            
            // 找到对应的卡片
            const card = document.querySelector(`[data-ingredient-id="${ingredientId}"]`);
            if (!card) return;
            
            // 创建对话气泡
            const bubble = document.createElement('div');
            bubble.className = 'dialogue-bubble';
            bubble.textContent = dialogueText;
            
            // 定位在卡片上方
            bubble.style.position = 'absolute';
            bubble.style.bottom = '100%';
            bubble.style.left = '50%';
            bubble.style.transform = 'translateX(-50%)';
            bubble.style.marginBottom = '10px';
            
            card.style.position = 'relative';
            card.appendChild(bubble);
            
            // 3秒后自动消失或点击消失
            setTimeout(() => {
                if (bubble.parentElement) {
                    bubble.remove();
                }
            }, 3000);
            
            bubble.onclick = () => {
                if (bubble.parentElement) {
                    bubble.remove();
                }
            };
        }
        
        /**
         * 获取台词文本
         * @param {string} personality - 性格
         * @param {string} state - 状态
         * @returns {string} 台词文本
         */
        function getDialogueText(personality, state) {
            // 黑化状态没有台词
            if (state === 'corrupted') {
                return '……';
            }
            
            const dialogues = DIALOGUES[personality];
            if (!dialogues || !dialogues[state]) {
                return '……';
            }
            
            const lines = dialogues[state];
            const randomIndex = Math.floor(Math.random() * lines.length);
            return lines[randomIndex];
        }

        /* ========================================
           8-bit 音效合成系统
           ======================================== */
        
        let audioContext = null;
        let audioInitialized = false;
        
        /**
         * 初始化音频系统（在用户首次交互后调用）
         */
        function initAudioSystem() {
            if (audioInitialized) return;
            
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioInitialized = true;
                console.log('音频系统已初始化');
            } catch (e) {
                console.warn('音频系统初始化失败:', e);
            }
        }
        
        /**
         * 播放基础音效
         * @param {number} frequency - 频率 (Hz)
         * @param {number} duration - 持续时间 (秒)
         * @param {string} type - 波形类型 ('sine', 'square', 'sawtooth', 'triangle')
         */
        function playSound(frequency, duration, type = 'square') {
            if (!audioContext || !audioInitialized) return;
            
            try {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.type = type;
                oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
                
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            } catch (e) {
                console.warn('播放音效失败:', e);
            }
        }
        
        /**
         * 播放点击音效 - 短促方波，400Hz，0.1s
         */
        function playClickSound() {
            playSound(400, 0.1, 'square');
        }
        
        /**
         * 播放选中音效 - 上升音调，从300Hz到500Hz，0.15s
         */
        function playSelectSound() {
            if (!audioContext || !audioInitialized) return;
            
            try {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(300, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(500, audioContext.currentTime + 0.15);
                
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.15);
            } catch (e) {
                console.warn('播放选中音效失败:', e);
            }
        }
        
        /**
         * 播放烹饪完成音效 - 和弦 C-E-G，0.5s
         */
        function playCookingCompleteSound() {
            if (!audioContext || !audioInitialized) return;
            
            try {
                // C 音 (261.63 Hz)
                const osc1 = audioContext.createOscillator();
                const gain1 = audioContext.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(261.63, audioContext.currentTime);
                gain1.gain.setValueAtTime(0.08, audioContext.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                osc1.connect(gain1);
                gain1.connect(audioContext.destination);
                osc1.start(audioContext.currentTime);
                osc1.stop(audioContext.currentTime + 0.5);
                
                // E 音 (329.63 Hz)
                const osc2 = audioContext.createOscillator();
                const gain2 = audioContext.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(329.63, audioContext.currentTime);
                gain2.gain.setValueAtTime(0.08, audioContext.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                osc2.connect(gain2);
                gain2.connect(audioContext.destination);
                osc2.start(audioContext.currentTime);
                osc2.stop(audioContext.currentTime + 0.5);
                
                // G 音 (392.00 Hz)
                const osc3 = audioContext.createOscillator();
                const gain3 = audioContext.createGain();
                osc3.type = 'sine';
                osc3.frequency.setValueAtTime(392.00, audioContext.currentTime);
                gain3.gain.setValueAtTime(0.08, audioContext.currentTime);
                gain3.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                osc3.connect(gain3);
                gain3.connect(audioContext.destination);
                osc3.start(audioContext.currentTime);
                osc3.stop(audioContext.currentTime + 0.5);
            } catch (e) {
                console.warn('播放烹饪完成音效失败:', e);
            }
        }
        
        /**
         * 播放勋章获得音效 - 金光闪烁效果，从低到高扫频，0.8s
         */
        function playMedalSound() {
            if (!audioContext || !audioInitialized) return;
            
            try {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.8);
                
                gainNode.gain.setValueAtTime(0.12, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.8);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.8);
            } catch (e) {
                console.warn('播放勋章音效失败:', e);
            }
        }
        
        /* ========================================
           冰箱门动画控制
           ======================================== */
        
        /**
         * 打开冰箱门并显示冷气效果
         */
        function openFridgeDoor() {
            const door = document.getElementById('fridge-door');
            if (door) {
                door.classList.add('open');
                
                // 重置冷气粒子动画
                const particles = door.querySelectorAll('.cold-air-particle');
                particles.forEach(particle => {
                    particle.style.animation = 'none';
                    setTimeout(() => {
                        particle.style.animation = '';
                    }, 10);
                });
            }
        }
        
        /**
         * 关闭冰箱门
         */
        function closeFridgeDoor() {
            const door = document.getElementById('fridge-door');
            if (door) {
                door.classList.remove('open');
            }
        }
        
        /* ========================================
           初始化
           ======================================== */
        window.addEventListener('DOMContentLoaded', () => {
            // 初始化时显示标题页面
            switchPage('title');
        });
    </script>
