<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AimLab — 射击训练场</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#0a0e1a;--panel:#131826;--panel2:#1a2138;--accent:#00d9ff;--accent2:#7c3aed;
    --green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--text:#e2e8f0;--muted:#64748b;
    --border:#1e293b;
  }
  body{
    background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
    overflow:hidden;height:100vh;user-select:none;
  }
  #game-container{position:relative;width:100vw;height:100vh;overflow:hidden;}
  canvas{display:block;cursor:none;}

  /* 菜单 */
  #menu{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:100;
    background:radial-gradient(circle at 50% 40%,#1a2138 0%,#0a0e1a 70%);
  }
  #menu.hidden{display:none;}
  .logo{font-size:64px;font-weight:800;letter-spacing:6px;margin-bottom:8px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;}
  .subtitle{color:var(--muted);font-size:16px;margin-bottom:40px;letter-spacing:3px;}
  .mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:560px;width:90%;}
  .mode-card{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:24px;cursor:pointer;transition:all .2s;text-align:left;position:relative;overflow:hidden;
  }
  .mode-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,217,255,.15);}
  .mode-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--accent);opacity:0;transition:opacity .2s;}
  .mode-card:hover::before{opacity:1;}
  .mode-icon{font-size:28px;margin-bottom:8px;}
  .mode-title{font-size:18px;font-weight:600;margin-bottom:4px;}
  .mode-desc{font-size:13px;color:var(--muted);line-height:1.4;}

  /* 设置面板 */
  .settings{
    margin-top:24px;display:flex;gap:24px;flex-wrap:wrap;justify-content:center;
    max-width:560px;
  }
  .setting-group{display:flex;flex-direction:column;gap:6px;align-items:center;}
  .setting-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .setting-row{display:flex;gap:6px;}
  .btn{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:all .15s;
  }
  .btn:hover{border-color:var(--accent);}
  .btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;}
  .btn-big{
    background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;
    padding:14px 48px;border-radius:8px;cursor:pointer;font-size:16px;font-weight:700;
    margin-top:28px;letter-spacing:2px;transition:all .2s;
  }
  .btn-big:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(0,217,255,.4);}

  /* HUD */
  #hud{
    position:absolute;top:0;left:0;right:0;padding:16px 24px;
    display:flex;justify-content:space-between;align-items:flex-start;
    z-index:10;pointer-events:none;
  }
  #hud.hidden{display:none;}
  .hud-left,.hud-right{display:flex;gap:24px;}
  .hud-stat{display:flex;flex-direction:column;}
  .hud-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .hud-value{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  .hud-value.accent{color:var(--accent);}
  .hud-value.green{color:var(--green);}
  .hud-value.yellow{color:var(--yellow);}

  /* 倒计时 */
  #countdown{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:120px;font-weight:800;color:var(--accent);z-index:50;
    text-shadow:0 0 40px rgba(0,217,255,.5);pointer-events:none;
  }
  #countdown.hidden{display:none;}

  /* 结算 */
  #results{
    position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;z-index:100;
    background:rgba(10,14,26,.92);backdrop-filter:blur(8px);
  }
  #results.show{display:flex;}
  .results-title{font-size:36px;font-weight:800;margin-bottom:32px;}
  .results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:32px;min-width:480px;}
  .result-card{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:20px;text-align:center;
  }
  .result-label{font-size:12px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;letter-spacing:1px;}
  .result-value{font-size:32px;font-weight:800;}
  .btn-back{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:12px 36px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600;
  }
  .btn-back:hover{border-color:var(--accent);color:var(--accent);}

  /* 准星预览 */
  .crosshair-preview{
    width:60px;height:60px;display:flex;align-items:center;justify-content:center;
    position:relative;margin:0 auto 8px;
  }

  /* 顶部提示 */
  .hint{
    position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
    color:var(--muted);font-size:13px;z-index:10;
  }
  .hint.hidden{display:none;}
  .hint kbd{
    background:var(--panel2);border:1px solid var(--border);border-radius:4px;
    padding:2px 8px;font-family:monospace;font-size:12px;
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="hud-stat"><span class="hud-label">得分</span><span class="hud-value accent" id="hud-score">0</span></div>
      <div class="hud-stat"><span class="hud-label">命中</span><span class="hud-value green" id="hud-hits">0</span></div>
      <div class="hud-stat"><span class="hud-label">命中率</span><span class="hud-value" id="hud-accuracy">0%</span></div>
    </div>
    <div class="hud-right">
      <div class="hud-stat"><span class="hud-label">连击</span><span class="hud-value yellow" id="hud-combo">0</span></div>
      <div class="hud-stat"><span class="hud-label">时间</span><span class="hud-value" id="hud-time">60</span></div>
    </div>
  </div>

  <!-- 倒计时 -->
  <div id="countdown" class="hidden"></div>

  <!-- 结算 -->
  <div id="results">
    <div class="results-title" id="results-title">训练完成</div>
    <div class="results-grid">
      <div class="result-card"><div class="result-label">最终得分</div><div class="result-value accent" id="r-score" style="color:var(--accent)">0</div></div>
      <div class="result-card"><div class="result-label">命中率</div><div class="result-value green" id="r-accuracy" style="color:var(--green)">0%</div></div>
      <div class="result-card"><div class="result-label">平均反应</div><div class="result-value yellow" id="r-avg-react" style="color:var(--yellow)">0ms</div></div>
    </div>
    <div class="results-grid" style="margin-top:-8px;margin-bottom:32px;">
      <div class="result-card"><div class="result-label">总命中</div><div class="result-value" id="r-hits">0</div></div>
      <div class="result-card"><div class="result-label">总射击</div><div class="result-value" id="r-shots">0</div></div>
      <div class="result-card"><div class="result-label">最高连击</div><div class="result-value" id="r-max-combo">0</div></div>
    </div>
    <button class="btn-back" onclick="backToMenu()">返回菜单</button>
  </div>

  <!-- 提示 -->
  <div class="hint" id="hint"><kbd>左键</kbd> 射击 &nbsp; <kbd>Esc</kbd> 返回菜单</div>

  <!-- 主菜单 -->
  <div id="menu">
    <div class="logo">AIMLAB</div>
    <div class="subtitle">射击训练场</div>
    <div class="mode-grid" id="mode-grid"></div>
    <div class="settings" id="settings"></div>
    <button class="btn-big" id="start-btn" onclick="startGame()">开始训练</button>
  </div>
</div>

<script>
// ===================== 配置 =====================
const MODES = [
  {id:'grid',icon:'◎',title:'网格射击',desc:'6个靶子同时出现，全部命中后刷新'},
  {id:'flick',icon:'⚡',title:'快速反应',desc:'单个靶子随机出现，考验甩枪速度'},
  {id:'tracking',icon:'~',title:'追踪目标',desc:'移动靶子，持续命中加分'},
  {id:'precise',icon:'⊕',title:'精准射击',desc:'小靶子，考验精准度'},
  {id:'speed',icon:'⏱',title:'限时爆发',desc:'60秒内尽可能多命中'},
  {id:'spiders',icon:'🕷',title:'蛛网挑战',desc:'靶子会缩小消失，手要快'},
];

const DIFFICULTIES = {
  easy:{label:'简单',targetSize:60,spawnRate:1200,targetSpeed:2,life:3000},
  normal:{label:'普通',targetSize:45,spawnRate:1000,targetSpeed:3.5,life:2200},
  hard:{label:'困难',targetSize:30,spawnRate:800,targetSpeed:5,life:1500},
  insane:{label:'噩梦',targetSize:20,spawnRate:600,targetSpeed:7,life:1000},
};

let settings = {
  mode:'grid',
  difficulty:'normal',
  crosshairColor:'#00d9ff',
  crosshairStyle:'cross', // cross, dot, circle, t
  crosshairSize:14,
  duration:60,
};

// ===================== 画布 =====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W=0,H=0;
function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

// ===================== 状态 =====================
let state = {
  playing:false,
  targets:[],
  particles:[],
  score:0, hits:0, shots:0, combo:0, maxCombo:0,
  reactionTimes:[],
  startTime:0, timeLeft:60,
  mouseX:0, mouseY:0,
  lastSpawn:0,
  trail:[], // 准星轨迹
};

// ===================== 菜单构建 =====================
function buildMenu(){
  const grid = document.getElementById('mode-grid');
  grid.innerHTML = MODES.map(m=>`
    <div class="mode-card ${m.id===settings.mode?'':''}" data-mode="${m.id}" onclick="selectMode('${m.id}')">
      <div class="mode-icon">${m.icon}</div>
      <div class="mode-title">${m.title}</div>
      <div class="mode-desc">${m.desc}</div>
    </div>`).join('');
  selectMode(settings.mode);

  // 设置区
  const s = document.getElementById('settings');
  s.innerHTML = `
    <div class="setting-group">
      <span class="setting-label">难度</span>
      <div class="setting-row" id="diff-row">
        ${Object.entries(DIFFICULTIES).map(([k,v])=>`<button class="btn ${k===settings.difficulty?'active':''}" data-diff="${k}" onclick="setDiff('${k}')">${v.label}</button>`).join('')}
      </div>
    </div>
    <div class="setting-group">
      <span class="setting-label">准星样式</span>
      <div class="setting-row" id="ch-style-row">
        ${['cross','dot','circle','t'].map(st=>`<button class="btn ${st===settings.crosshairStyle?'active':''}" onclick="setCHStyle('${st}')">${st}</button>`).join('')}
      </div>
    </div>
    <div class="setting-group">
      <span class="setting-label">准星颜色</span>
      <div class="setting-row" id="ch-color-row">
        ${['#00d9ff','#22c55e','#ef4444','#f59e0b','#e2e8f0','#ff00ff'].map(c=>`<button class="btn ${c===settings.crosshairColor?'active':''}" style="padding:6px 10px;color:${c}" onclick="setCHColor('${c}')">●</button>`).join('')}
      </div>
    </div>
    <div class="setting-group">
      <span class="setting-label">时长(秒)</span>
      <div class="setting-row" id="dur-row">
        ${[30,60,120].forEach(()=>{})}
        ${[30,60,120].map(d=>`<button class="btn ${d===settings.duration?'active':''}" onclick="setDur(${d})">${d}</button>`).join('')}
      </div>
    </div>
  `;
}
function selectMode(id){
  settings.mode=id;
  document.querySelectorAll('.mode-card').forEach(c=>{
    c.style.borderColor = c.dataset.mode===id?'var(--accent)':'';
    c.style.background = c.dataset.mode===id?'var(--panel2)':'';
  });
}
function setDiff(k){settings.difficulty=k;refreshBtns('diff-row','diff',k);}
function setCHStyle(s){settings.crosshairStyle=s;refreshBtns('ch-style-row',null,s,true);}
function setCHColor(c){settings.crosshairColor=c;refreshBtns('ch-color-row',null,c,true);}
function setDur(d){settings.duration=d;refreshBtns('dur-row',null,d,true);}
function refreshBtns(rowId,attr,val,isTextMatch){
  const row=document.getElementById(rowId);
  if(!row)return;
  row.querySelectorAll('.btn').forEach(b=>{
    const match = isTextMatch ? b.textContent.trim()===String(val) : b.dataset[attr]===val;
    b.classList.toggle('active',match);
  });
}

// ===================== 游戏流程 =====================
function startGame(){
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('results').classList.remove('show');
  // 倒计时
  const cd=document.getElementById('countdown');
  cd.classList.remove('hidden');
  let n=3;
  cd.textContent=n;
  const tick=()=>{
    n--;
    if(n>0){cd.textContent=n;setTimeout(tick,700);}
    else if(n===0){cd.textContent='GO';setTimeout(tick,600);}
    else{
      cd.classList.add('hidden');
      beginGame();
    }
  };
  setTimeout(tick,700);
}

function beginGame(){
  state={
    playing:true, targets:[], particles:[],
    score:0,hits:0,shots:0,combo:0,maxCombo:0,
    reactionTimes:[], startTime:performance.now(), timeLeft:settings.duration,
    mouseX:W/2, mouseY:H/2, lastSpawn:0, trail:[],
  };
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('hint').classList.remove('hidden');
  updateHUD();
  // 初始生成
  if(settings.mode==='grid') spawnGrid();
  requestAnimationFrame(loop);
}

function endGame(){
  state.playing=false;
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('hint').classList.add('hidden');
  // 结算
  const acc = state.shots>0?Math.round(state.hits/state.shots*100):0;
  const avgReact = state.reactionTimes.length?Math.round(state.reactionTimes.reduce((a,b)=>a+b,0)/state.reactionTimes.length):0;
  document.getElementById('r-score').textContent=state.score;
  document.getElementById('r-accuracy').textContent=acc+'%';
  document.getElementById('r-avg-react').textContent=avgReact+'ms';
  document.getElementById('r-hits').textContent=state.hits;
  document.getElementById('r-shots').textContent=state.shots;
  document.getElementById('r-max-combo').textContent=state.maxCombo;
  document.getElementById('results').classList.add('show');
}

function backToMenu(){
  document.getElementById('results').classList.remove('show');
  document.getElementById('menu').classList.remove('hidden');
}

// ===================== 目标生成 =====================
function spawnTarget(x,y,sizeOverride){
  const diff=DIFFICULTIES[settings.difficulty];
  const size = sizeOverride||diff.targetSize;
  if(x===undefined) x=size+Math.random()*(W-size*2);
  if(y===undefined) y=size+Math.random()*(H-size*2);
  const t={
    x,y,size, maxSize:size, born:performance.now(),
    life:diff.life, hit:false, shrinkStart:null,
    vx:0,vy:0, type:'normal',
  };
  if(settings.mode==='tracking'){
    const ang=Math.random()*Math.PI*2;
    t.vx=Math.cos(ang)*diff.targetSpeed;
    t.vy=Math.sin(ang)*diff.targetSpeed;
    t.type='tracking';
    t.life=999999;
  }
  if(settings.mode==='spiders'){
    t.shrinkStart=performance.now();
  }
  state.targets.push(t);
}

function spawnGrid(){
  state.targets=[];
  const diff=DIFFICULTIES[settings.difficulty];
  const cols=3,rows=2;
  const padX=W*0.18, padY=H*0.2;
  const gapX=(W-padX*2)/(cols-1), gapY=(H-padY*2)/(rows-1);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    spawnTarget(padX+c*gapX, padY+r*gapY, diff.targetSize);
  }
}

function maybeSpawn(now){
  const diff=DIFFICULTIES[settings.difficulty];
  if(settings.mode==='flick'||settings.mode==='precise'){
    if(state.targets.filter(t=>!t.hit).length===0 && now-state.lastSpawn>diff.spawnRate){
      spawnTarget();
      state.lastSpawn=now;
    }
  } else if(settings.mode==='speed'){
    if(state.targets.filter(t=>!t.hit).length<3 && now-state.lastSpawn>diff.spawnRate){
      spawnTarget();
      state.lastSpawn=now;
    }
  } else if(settings.mode==='spiders'){
    if(state.targets.filter(t=>!t.hit).length<5 && now-state.lastSpawn>diff.spawnRate){
      spawnTarget();
      state.lastSpawn=now;
    }
  } else if(settings.mode==='tracking'){
    while(state.targets.filter(t=>!t.hit).length<2){
      spawnTarget();
    }
  }
}

// ===================== 主循环 =====================
let lastFrame=0;
function loop(now){
  if(!state.playing)return;
  const dt=Math.min(33, now-lastFrame);
  lastFrame=now;

  // 时间
  state.timeLeft = settings.duration - (now-state.startTime)/1000;
  if(state.timeLeft<=0){state.timeLeft=0;updateHUD();endGame();return;}
  updateHUD();

  // 生成
  maybeSpawn(now);

  // 更新目标
  for(const t of state.targets){
    if(t.hit)continue;
    // 追踪模式移动
    if(t.type==='tracking'){
      t.x+=t.vx*(dt/16); t.y+=t.vy*(dt/16);
      if(t.x<t.size||t.x>W-t.size){t.vx*=-1;t.x=Math.max(t.size,Math.min(W-t.size,t.x));}
      if(t.y<t.size||t.y>H-t.size){t.vy*=-1;t.y=Math.max(t.size,Math.min(H-t.size,t.y));}
    }
    // 蛛网缩小
    if(t.shrinkStart){
      const p=(now-t.shrinkStart)/t.life;
      t.size=t.maxSize*Math.max(0,1-p);
    }
    // 过期
    if(t.type!=='tracking' && now-t.born>t.life && !t.shrinkStart){
      t.expired=true;
    }
    if(t.shrinkStart && t.size<=1){
      t.expired=true;
    }
  }
  // 清理
  state.targets=state.targets.filter(t=>!t.hit&&!t.expired);
  // 网格模式：全命中后刷新
  if(settings.mode==='grid' && state.targets.length===0){
    spawnGrid();
  }

  // 更新粒子
  for(const p of state.particles){
    p.x+=p.vx*(dt/16); p.y+=p.vy*(dt/16);
    p.vy+=0.1*(dt/16);
    p.life-=dt;
    p.alpha=Math.max(0,p.life/p.maxLife);
  }
  state.particles=state.particles.filter(p=>p.life>0);

  // 准星轨迹
  state.trail.push({x:state.mouseX,y:state.mouseY,t:now});
  state.trail=state.trail.filter(p=>now-p.t<200);

  draw();
  requestAnimationFrame(loop);
}

// ===================== 绘制 =====================
function draw(){
  ctx.clearRect(0,0,W,H);
  // 背景网格
  drawBgGrid();
  // 目标
  for(const t of state.targets){
    if(t.hit)continue;
    drawTarget(t);
  }
  // 粒子
  for(const p of state.particles){
    ctx.globalAlpha=p.alpha;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
  // 准星
  drawCrosshair();
}

function drawBgGrid(){
  ctx.strokeStyle='rgba(30,41,59,0.5)';
  ctx.lineWidth=1;
  const step=40;
  for(let x=0;x<W;x+=step){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  for(let y=0;y<H;y+=step){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
}

function drawTarget(t){
  const r=t.size;
  // 外圈
  ctx.strokeStyle='rgba(239,68,68,0.3)';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(t.x,t.y,r+6,0,Math.PI*2);ctx.stroke();
  // 主体渐变
  const grad=ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,r);
  grad.addColorStop(0,'#ef4444');
  grad.addColorStop(0.6,'#dc2626');
  grad.addColorStop(1,'#991b1b');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.arc(t.x,t.y,r,0,Math.PI*2);ctx.fill();
  // 内圈白色
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.beginPath();ctx.arc(t.x,t.y,r*0.35,0,Math.PI*2);ctx.fill();
  // 中心点
  ctx.fillStyle='#dc2626';
  ctx.beginPath();ctx.arc(t.x,t.y,r*0.1,0,Math.PI*2);ctx.fill();
}

function drawCrosshair(){
  const x=state.mouseX,y=state.mouseY;
  const s=settings.crosshairSize;
  const c=settings.crosshairColor;
  ctx.strokeStyle=c;
  ctx.fillStyle=c;
  ctx.lineWidth=2;
  // 轨迹
  if(state.trail.length>1){
    ctx.strokeStyle=c+'40';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(state.trail[0].x,state.trail[0].y);
    for(const p of state.trail)ctx.lineTo(p.x,p.y);
    ctx.stroke();
  }
  ctx.strokeStyle=c;
  switch(settings.crosshairStyle){
    case 'cross':
      ctx.beginPath();
      ctx.moveTo(x-s,y-3);ctx.lineTo(x-s,y-s);ctx.lineTo(x-3,y-s);
      ctx.moveTo(x+3,y-s);ctx.lineTo(x+s,y-s);ctx.lineTo(x+s,y-3);
      ctx.moveTo(x+s,y+3);ctx.lineTo(x+s,y+s);ctx.lineTo(x+3,y+s);
      ctx.moveTo(x-3,y+s);ctx.lineTo(x-s,y+s);ctx.lineTo(x-s,y+3);
      ctx.stroke();
      ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill();
      break;
    case 'dot':
      ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
      break;
    case 'circle':
      ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill();
      break;
    case 't':
      ctx.beginPath();
      ctx.moveTo(x-s,y-s);ctx.lineTo(x+s,y-s);
      ctx.moveTo(x,y-s);ctx.lineTo(x,y+s*0.5);
      ctx.stroke();
      break;
  }
}

// ===================== 命中判定 =====================
canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  state.mouseX=e.clientX-rect.left;
  state.mouseY=e.clientY-rect.top;
});

canvas.addEventListener('mousedown',e=>{
  if(!state.playing)return;
  if(e.button!==0)return;
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;
  state.shots++;
  let hit=false;
  // 从后往前检测（后绘制的在上层）
  for(let i=state.targets.length-1;i>=0;i--){
    const t=state.targets[i];
    if(t.hit)continue;
    const dx=x-t.x, dy=y-t.y;
    if(dx*dx+dy*dy<=t.size*t.size){
      t.hit=true;
      hit=true;
      state.hits++;
      state.combo++;
      state.maxCombo=Math.max(state.maxCombo,state.combo);
      const reactTime=performance.now()-t.born;
      state.reactionTimes.push(reactTime);
      // 得分：基础10 + 难度加成 + 连击加成 + 精准加成
      const diffMul = {easy:1,normal:1.5,hard:2.5,insane:4}[settings.difficulty];
      const precisionBonus = Math.round((1-t.size/ (DIFFICULTIES[settings.difficulty].targetSize))*20);
      const comboBonus = Math.min(state.combo*2,50);
      const gained = Math.round((10+precisionBonus+comboBonus)*diffMul);
      state.score += gained;
      // 粒子
      spawnHitParticles(t.x,t.y);
      // 浮动得分
      state.particles.push({
        x:t.x,y:t.y,vx:0,vy:-1.5,size:0,
        color:'#00d9ff',life:800,maxLife:800,alpha:1,
        text:'+'+gained, isText:true,
      });
      break;
    }
  }
  if(!hit){
    state.combo=0;
    // 未命中粒子
    spawnMissParticles(x,y);
  }
  updateHUD();
});

function spawnHitParticles(x,y){
  const colors=['#ef4444','#f59e0b','#00d9ff','#fff'];
  for(let i=0;i<15;i++){
    const ang=Math.random()*Math.PI*2;
    const sp=2+Math.random()*5;
    state.particles.push({
      x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-2,
      size:2+Math.random()*3,
      color:colors[Math.floor(Math.random()*colors.length)],
      life:500+Math.random()*400,maxLife:900,alpha:1,
    });
  }
}
function spawnMissParticles(x,y){
  for(let i=0;i<6;i++){
    const ang=Math.random()*Math.PI*2;
    state.particles.push({
      x,y,vx:Math.cos(ang)*3,vy:Math.sin(ang)*3-1,
      size:1.5,color:'#64748b',life:300,maxLife:300,alpha:1,
    });
  }
}

// 修正粒子绘制以支持文字
const _origDraw=draw;
draw=function(){
  ctx.clearRect(0,0,W,H);
  drawBgGrid();
  for(const t of state.targets){if(t.hit)continue;drawTarget(t);}
  for(const p of state.particles){
    ctx.globalAlpha=p.alpha;
    if(p.isText){
      ctx.font='bold 18px sans-serif';
      ctx.fillStyle=p.color;
      ctx.textAlign='center';
      ctx.fillText(p.text,p.x,p.y);
    }else{
      ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  drawCrosshair();
};

// ===================== HUD =====================
function updateHUD(){
  document.getElementById('hud-score').textContent=state.score;
  document.getElementById('hud-hits').textContent=state.hits;
  const acc=state.shots>0?Math.round(state.hits/state.shots*100):0;
  document.getElementById('hud-accuracy').textContent=acc+'%';
  document.getElementById('hud-combo').textContent=state.combo;
  document.getElementById('hud-time').textContent=Math.ceil(state.timeLeft);
}

// ===================== Esc 返回 =====================
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&state.playing){
    state.playing=false;
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('hint').classList.add('hidden');
    document.getElementById('menu').classList.remove('hidden');
  }
});

// ===================== 初始化 =====================
buildMenu();
</script>
