<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视觉轴控系统 Web 版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: white; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(90deg, #00b894, #0984e3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: #636e72; }
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .tab { padding: 12px 30px; border: none; border-radius: 8px; background: #2d3436; color: #636e72; cursor: pointer; transition: all 0.3s; font-size: 14px; }
        .tab.active { background: #00b894; color: white; }
        .tab:hover { background: #3d4449; }
        .content { display: none; }
        .content.active { display: block; }
        .motor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .motor-card { background: #2d3436; border-radius: 12px; padding: 20px; border: 2px solid #3d4449; transition: all 0.3s; }
        .motor-card.online { border-color: #00b894; }
        .motor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .motor-id { font-size: 18px; font-weight: 600; }
        .motor-status { font-size: 12px; padding: 4px 12px; border-radius: 20px; background: #e17055; }
        .motor-status.online { background: #00b894; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #3d4449; }
        .info-label { color: #636e72; }
        .info-value { font-weight: 500; }
        .controls { display: flex; gap: 10px; margin-top: 15px; }
        .ctrl-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
        .enable-btn { background: #00b894; color: white; }
        .enable-btn:hover { background: #00a383; }
        .home-btn { background: #0984e3; color: white; }
        .home-btn:hover { background: #0652dd; }
        .move-btn { background: #fdcb6e; color: #2d3436; }
        .move-btn:hover { background: #f9a825; }
        .ctrl-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .pos-input { flex: 1; padding: 10px; border: 1px solid #3d4449; border-radius: 6px; background: #1a1a2e; color: white; }
        .io-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .io-card { background: #2d3436; border-radius: 10px; padding: 15px; border: 2px solid #3d4449; }
        .io-card.active { border-color: #00b894; }
        .io-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .io-name { font-weight: 500; }
        .io-status { font-size: 12px; padding: 3px 10px; border-radius: 15px; background: #e17055; }
        .io-status.on { background: #00b894; }
        .io-toggle { width: 100%; padding: 8px; border: none; border-radius: 5px; background: #e17055; color: white; cursor: pointer; margin-top: 10px; }
        .io-toggle.on { background: #00b894; }
        .log-panel { background: #2d3436; border-radius: 12px; padding: 20px; margin-top: 20px; }
        .log-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .log-content { max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #636e72; }
        .log-item { padding: 5px 0; border-bottom: 1px solid #3d4449; }
        .conn-panel { background: #2d3436; border-radius: 12px; padding: 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .conn-select { padding: 10px; border: 1px solid #3d4449; border-radius: 6px; background: #1a1a2e; color: white; }
        .conn-btn { padding: 10px 30px; border: none; border-radius: 6px; background: #00b894; color: white; cursor: pointer; font-weight: 500; }
        .conn-btn.disconnected { background: #e17055; }
        .conn-status { color: #00b894; }
        .conn-status.disconnected { color: #e17055; }
        .seq-list { background: #1a1a2e; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        .seq-header { display: grid; grid-template-columns: 60px 60px 100px 80px 100px 80px 100px 60px; padding: 12px; background: #2d3436; font-weight: 500; font-size: 12px; color: #636e72; }
        .seq-item { display: grid; grid-template-columns: 60px 60px 100px 80px 100px 80px 100px 60px; padding: 12px; border-bottom: 1px solid #2d3436; align-items: center; }
        .seq-input { padding: 6px; border: 1px solid #3d4449; border-radius: 4px; background: #2d3436; color: white; font-size: 12px; }
        .seq-btn { padding: 5px 10px; border: none; border-radius: 4px; background: #e17055; color: white; font-size: 11px; cursor: pointer; }
        .add-btn { padding: 10px 20px; border: none; border-radius: 6px; background: #0984e3; color: white; cursor: pointer; margin-right: 10px; }
        .seq-controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .start-btn { padding: 12px 30px; border: none; border-radius: 6px; background: #00b894; color: white; cursor: pointer; font-weight: 500; }
        .stop-btn { padding: 12px 30px; border: none; border-radius: 6px; background: #e17055; color: white; cursor: pointer; font-weight: 500; }
        .progress-bar { height: 10px; background: #1a1a2e; border-radius: 5px; overflow: hidden; margin-bottom: 10px; }
        .progress-fill { height: 100%; background: #00b894; transition: width 0.3s; }
        .vision-panel { display: grid; grid-template-columns: 1fr 400px; gap: 20px; }
        .config-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .config-item { display: flex; flex-direction: column; gap: 5px; }
        .config-label { font-size: 12px; color: #636e72; }
        .config-input { padding: 10px; border: 1px solid #3d4449; border-radius: 6px; background: #1a1a2e; color: white; }
        .vision-btn { padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .camera-btn { background: #0984e3; color: white; }
        .capture-btn { background: #00b894; color: white; }
        .preview-box { height: 200px; background: #1a1a2e; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 2px dashed #3d4449; }
        .result-box { background: #1a1a2e; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .result-value { font-size: 24px; font-weight: 600; }
        .result-value.pass { color: #00b894; }
        .result-value.fail { color: #e17055; }
        .homed-badge { background: #0984e3; color: white; font-size: 10px; padding: 2px 8px; border-radius: 4px; margin-left: 8px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #636e72; display: inline-block; margin-right: 5px; }
        .status-dot.enabled { background: #00b894; box-shadow: 0 0 8px #00b894; }
        @media (max-width: 768px) {
            .vision-panel { grid-template-columns: 1fr; }
            .seq-header, .seq-item { grid-template-columns: 40px 50px 80px 60px 80px 60px 80px 50px; font-size: 11px; }
            .motor-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>视觉轴控系统</h1>
            <p>7 轴伺服 · CANable 2.0 Pro S · 手动 / 自动 / IO / 视觉</p>
        </div>
        
        <div class="conn-panel">
            <select id="portSelect" class="conn-select">
                <option value="COM1">COM1</option>
                <option value="COM2">COM2</option>
                <option value="COM3" selected>COM3</option>
                <option value="COM4">COM4</option>
                <option value="COM5">COM5</option>
                <option value="COM6">COM6</option>
            </select>
            <select id="baudSelect" class="conn-select">
                <option value="1000k">1000k</option>
                <option value="500k" selected>500k</option>
                <option value="250k">250k</option>
                <option value="125k">125k</option>
            </select>
            <button id="connBtn" class="conn-btn" onclick="toggleConnection()">连接</button>
            <span id="connStatus" class="conn-status disconnected">● 未连接</span>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('manual')">手动模式</button>
            <button class="tab" onclick="showTab('auto')">自动模式</button>
            <button class="tab" onclick="showTab('io')">IO配置</button>
            <button class="tab" onclick="showTab('vision')">视觉配置</button>
        </div>

        <div id="manual" class="content active">
            <div class="motor-grid" id="motorGrid"></div>
            <div class="log-panel">
                <div class="log-header"><h3>系统日志</h3><button class="ctrl-btn" onclick="clearLogs()" style="width:auto;padding:5px 15px;">清空</button></div>
                <div class="log-content" id="logContent"></div>
            </div>
        </div>

        <div id="auto" class="content">
            <div class="seq-controls">
                <button class="start-btn" onclick="startSequence()">▶ 启动序列</button>
                <button class="stop-btn" onclick="stopSequence()">■ 停止序列</button>
                <button class="add-btn" onclick="addStep()">+ 添加步骤</button>
                <button class="add-btn" onclick="saveSequence()" style="background:#fdcb6e;color:#2d3436;">保存序列</button>
                <button class="add-btn" onclick="loadSequence()" style="background:#6c5ce7;">加载序列</button>
            </div>
            <div class="seq-list" id="seqList">
                <div class="seq-header"><span>序号</span><span>轴</span><span>目标位置</span><span>速度</span><span>等待IO</span><span>延时</span><span>输出控制</span><span>操作</span></div>
            </div>
            <div class="log-panel">
                <div class="progress-bar"><div class="progress-fill" id="seqProgress" style="width:0%"></div></div>
                <div id="seqStatus">就绪</div>
            </div>
        </div>

        <div id="io" class="content">
            <div style="margin-bottom:20px;">
                <button class="tab active" onclick="showIO('output')" id="outputTab" style="margin-right:10px;">输出配置</button>
                <button class="tab" onclick="showIO('input')" id="inputTab">输入监控</button>
            </div>
            <div id="ioContent">
                <div class="io-grid" id="ioGrid"></div>
                <div style="margin-top:20px;" id="batchControls">
                    <button class="ctrl-btn" onclick="setAllOutputs(true)" style="width:200px;">全部开启</button>
                    <button class="ctrl-btn" onclick="setAllOutputs(false)" style="width:200px;background:#e17055;">全部关闭</button>
                </div>
            </div>
        </div>

        <div id="vision" class="content">
            <div class="vision-panel">
                <div>
                    <h3>相机配置</h3>
                    <div class="config-grid">
                        <div class="config-item"><label class="config-label">相机型号</label><select class="config-input" id="cameraModel"><option value="HIKVISION">海康威视</option><option value="BASLER">Basler</option><option value="IDS">IDS</option></select></div>
                        <div class="config-item"><label class="config-label">IP地址</label><input class="config-input" type="text" id="cameraIp" value="192.168.1.100"></div>
                        <div class="config-item"><label class="config-label">端口</label><input class="config-input" type="number" id="cameraPort" value="8000"></div>
                        <div class="config-item"><label class="config-label">分辨率</label><select class="config-input" id="resolution"><option value="1920x1080">1920×1080</option><option value="1280x720">1280×720</option><option value="640x480">640×480</option></select></div>
                        <div class="config-item"><label class="config-label">帧率</label><input class="config-input" type="number" id="frameRate" value="30"></div>
                        <div class="config-item"><label class="config-label">曝光时间</label><input class="config-input" type="number" id="exposureTime" value="1000"></div>
                    </div>
                    <button class="vision-btn camera-btn" onclick="connectCamera()" style="width:100%;margin-top:15px;" id="cameraBtn">连接相机</button>
                    
                    <h3 style="margin-top:30px;">视觉标定</h3>
                    <div class="config-grid">
                        <div class="config-item"><label class="config-label">标定状态</label><span class="config-input" id="calibStatus" style="background:#e17055;display:block;">未标定</span></div>
                        <div class="config-item"><label class="config-label">标定板类型</label><select class="config-input" id="calibType"><option value="chessboard">棋盘格</option><option value="circle">圆点阵列</option></select></div>
                        <div class="config-item"><label class="config-label">格子大小(mm)</label><input class="config-input" type="number" id="gridSize" value="10"></div>
                    </div>
                    <div style="margin-top:15px;">
                        <button class="vision-btn" onclick="startCalibration()" style="width:32%;background:#2d3436;">开始标定</button>
                        <button class="vision-btn" onclick="loadCalibration()" style="width:32%;background:#2d3436;">加载标定</button>
                        <button class="vision-btn" onclick="saveCalibration()" style="width:32%;background:#2d3436;">保存标定</button>
                    </div>

                    <h3 style="margin-top:30px;">视觉控制</h3>
                    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;">
                        <button class="vision-btn capture-btn" onclick="captureImage()">📷 采集图像</button>
                        <button class="vision-btn capture-btn" onclick="startDetection()">🔍 开始检测</button>
                        <button class="vision-btn" style="background:#fdcb6e;color:#2d3436;" onclick="saveImage()">💾 保存图像</button>
                        <button class="vision-btn" style="background:#6c5ce7;" onclick="resetVision()">🔄 重置</button>
                    </div>
                </div>
                <div>
                    <h3>检测结果</h3>
                    <div class="preview-box" id="imagePreview">图像预览区域</div>
                    <div class="result-box">
                        <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
                            <span>检测数量</span><span>合格</span><span>不合格</span><span>合格率</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:600;">
                            <span id="detectCount">0</span><span id="passCount" style="color:#00b894;">0</span><span id="failCount" style="color:#e17055;">0</span><span id="passRate">0%</span>
                        </div>
                    </div>
                    <div class="result-box" id="lastResult">
                        <div style="text-align:center;font-size:18px;font-weight:600;color:#636e72;">无检测记录</div>
                    </div>
                    <div class="result-box" id="detectionDetails" style="display:none;">
                        <h4 style="margin-bottom:10px;color:#636e72;">最近检测详情</h4>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;">
                            <div>坐标X: <span id="lastX">0.00</span></div>
                            <div>坐标Y: <span id="lastY">0.00</span></div>
                            <div>尺寸: <span id="lastSize">0.00</span> mm</div>
                            <div>置信度: <span id="lastConfidence">0.0</span>%</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 状态数据
        let isConnected = false;
        let isCameraConnected = false;
        let isCalibrated = false;
        let isSequenceRunning = false;
        let currentIOType = 'output';
        
        // 电机数据
        let motors = [];
        for (let i = 1; i <= 7; i++) {
            motors.push({
                node_id: i,
                status: 'offline',
                position: 0,
                velocity: 0,
                current: 0,
                enabled: false,
                homed: false,
                targetPosition: 0
            });
        }
        
        // IO数据
        let outputs = [
            { id: 1, name: '夹持气缸', active: false, type: 'cylinder' },
            { id: 2, name: '输出2', active: false, type: 'digital' },
            { id: 3, name: '输出3', active: false, type: 'digital' },
            { id: 4, name: '输出4', active: false, type: 'digital' },
            { id: 5, name: '输出5', active: false, type: 'digital' },
            { id: 6, name: '输出6', active: false, type: 'digital' },
            { id: 7, name: '输出7', active: false, type: 'digital' },
            { id: 8, name: '输出8', active: false, type: 'digital' }
        ];
        
        let inputs = [
            { id: 1, name: '上料到位', active: false, type: 'proximity' },
            { id: 2, name: '输入2', active: false, type: 'limit' },
            { id: 3, name: '输入3', active: false, type: 'digital' },
            { id: 4, name: '输入4', active: false, type: 'digital' },
            { id: 5, name: '输入5', active: false, type: 'digital' },
            { id: 6, name: '输入6', active: false, type: 'digital' },
            { id: 7, name: '输入7', active: false, type: 'digital' },
            { id: 8, name: '输入8', active: false, type: 'digital' }
        ];
        
        // 序列数据
        let sequenceSteps = [
            { axis: 1, position: 90, speed: 100, waitIo: '', delay: 0, output: '' },
            { axis: 2, position: 45, speed: 80, waitIo: '', delay: 0, output: '' }
        ];
        
        // 检测数据
        let detectCount = 0, passCount = 0, failCount = 0;
        
        // 日志
        let logs = [];
        
        // 初始化
        function init() {
            renderMotors();
            renderSequence();
            renderIO();
            addLog('系统初始化完成');
        }
        
        // 添加日志
        function addLog(message) {
            const now = new Date();
            const time = now.toLocaleTimeString();
            logs.unshift({ time, message });
            if (logs.length > 100) logs.pop();
            renderLogs();
        }
        
        // 渲染日志
        function renderLogs() {
            const content = document.getElementById('logContent');
            content.innerHTML = logs.map(l => `<div class="log-item">[${l.time}] ${l.message}</div>`).join('');
        }
        
        // 清空日志
        function clearLogs() {
            logs = [];
            renderLogs();
        }
        
        // 显示标签页
        function showTab(tab) {
            document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab).classList.add('active');
        }
        
        // 连接/断开
        function toggleConnection() {
            const btn = document.getElementById('connBtn');
            const status = document.getElementById('connStatus');
            
            if (isConnected) {
                // 断开连接
                isConnected = false;
                btn.textContent = '连接';
                btn.classList.remove('disconnected');
                status.textContent = '● 未连接';
                status.classList.add('disconnected');
                
                motors.forEach(m => {
                    m.status = 'offline';
                    m.enabled = false;
                    m.homed = false;
                });
                addLog('CANable 已断开连接');
            } else {
                // 连接
                isConnected = true;
                btn.textContent = '断开';
                btn.classList.add('disconnected');
                status.textContent = '● 已连接';
                status.classList.remove('disconnected');
                
                const port = document.getElementById('portSelect').value;
                const baud = document.getElementById('baudSelect').value;
                
                motors.forEach(m => {
                    m.status = 'online';
                });
                addLog(`CANable 已连接 ${port}，CAN ${baud}`);
            }
            
            renderMotors();
        }
        
        // 渲染电机
        function renderMotors() {
            const grid = document.getElementById('motorGrid');
            grid.innerHTML = motors.map(m => `
                <div class="motor-card ${m.status === 'online' ? 'online' : ''}">
                    <div class="motor-header">
                        <span class="motor-id">轴 ${m.node_id}</span>
                        <span class="motor-status ${m.status === 'online' ? 'online' : ''}">
                            ${m.status === 'online' ? '在线' : '离线'}
                            ${m.homed ? '<span class="homed-badge">已回零</span>' : ''}
                        </span>
                    </div>
                    <div class="info-row"><span class="info-label">位置</span><span class="info-value">${m.position.toFixed(2)}°</span></div>
                    <div class="info-row"><span class="info-label">速度</span><span class="info-value">${m.velocity.toFixed(1)} rpm</span></div>
                    <div class="info-row"><span class="info-label">电流</span><span class="info-value">${m.current.toFixed(2)} A</span></div>
                    <div class="controls">
                        <button class="ctrl-btn enable-btn" onclick="toggleMotor(${m.node_id})" ${m.status !== 'online' ? 'disabled' : ''}>${m.enabled ? '禁用' : '使能'}</button>
                        <button class="ctrl-btn home-btn" onclick="homeMotor(${m.node_id})" ${!m.enabled ? 'disabled' : ''}>回零</button>
                    </div>
                    <div class="controls" style="margin-top:10px;">
                        <input type="number" class="pos-input" placeholder="目标位置" id="pos_${m.node_id}" value="${m.targetPosition}">
                        <button class="ctrl-btn move-btn" onclick="moveMotor(${m.node_id})" ${!m.enabled ? 'disabled' : ''}>移动</button>
                    </div>
                </div>
            `).join('');
        }
        
        // 使能/禁用电机
        function toggleMotor(nodeId) {
            const m = motors.find(x => x.node_id === nodeId);
            if (!m) return;
            
            m.enabled = !m.enabled;
            addLog(`电机${nodeId}: ${m.enabled ? '已使能' : '已禁用'}`);
            renderMotors();
        }
        
        // 回零
        function homeMotor(nodeId) {
            const m = motors.find(x => x.node_id === nodeId);
            if (!m) return;
            
            m.homed = true;
            m.position = 0;
            addLog(`电机${nodeId}: 回零完成`);
            renderMotors();
        }
        
        // 移动电机
        function moveMotor(nodeId) {
            const m = motors.find(x => x.node_id === nodeId);
            if (!m) return;
            
            const posInput = document.getElementById(`pos_${nodeId}`);
            const targetPos = parseFloat(posInput.value) || 0;
            
            m.position = targetPos;
            m.targetPosition = targetPos;
            addLog(`电机${nodeId}: 移动到 ${targetPos}°`);
            renderMotors();
        }
        
        // 渲染序列
        function renderSequence() {
            const list = document.getElementById('seqList');
            let html = '<div class="seq-header"><span>序号</span><span>轴</span><span>目标位置</span><span>速度</span><span>等待IO</span><span>延时</span><span>输出控制</span><span>操作</span></div>';
            
            sequenceSteps.forEach((step, index) => {
                html += `
                    <div class="seq-item">
                        <span>${index + 1}</span>
                        <select class="seq-input" onchange="updateStep(${index}, 'axis', this.value)">
                            ${[1,2,3,4,5,6,7].map(i => `<option value="${i}" ${step.axis === i ? 'selected' : ''}>${i}</option>`).join('')}
                        </select>
                        <input class="seq-input" type="number" value="${step.position}" placeholder="位置" onchange="updateStep(${index}, 'position', this.value)">
                        <input class="seq-input" type="number" value="${step.speed}" placeholder="速度" onchange="updateStep(${index}, 'speed', this.value)">
                        <select class="seq-input" onchange="updateStep(${index}, 'waitIo', this.value)">
                            <option value="">无</option>
                            ${inputs.map(i => `<option value="${i.id}" ${step.waitIo === i.id.toString() ? 'selected' : ''}>${i.name}</option>`).join('')}
                        </select>
                        <input class="seq-input" type="number" value="${step.delay}" placeholder="延时" onchange="updateStep(${index}, 'delay', this.value)">
                        <select class="seq-input" onchange="updateStep(${index}, 'output', this.value)">
                            <option value="">无</option>
                            ${outputs.map(o => `<option value="${o.id}" ${step.output === o.id.toString() ? 'selected' : ''}>${o.name}</option>`).join('')}
                        </select>
                        <button class="seq-btn" onclick="removeStep(${index})">删除</button>
                    </div>
                `;
            });
            
            list.innerHTML = html;
        }
        
        // 更新步骤
        function updateStep(index, field, value) {
            if (field === 'position' || field === 'speed' || field === 'delay') {
                sequenceSteps[index][field] = parseFloat(value) || 0;
            } else {
                sequenceSteps[index][field] = value;
            }
        }
        
        // 添加步骤
        function addStep() {
            sequenceSteps.push({ axis: 1, position: 0, speed: 100, waitIo: '', delay: 0, output: '' });
            renderSequence();
            addLog('已添加新步骤');
        }
        
        // 删除步骤
        function removeStep(index) {
            sequenceSteps.splice(index, 1);
            renderSequence();
            addLog(`已删除步骤 ${index + 1}`);
        }
        
        // 保存序列
        function saveSequence() {
            localStorage.setItem('sequence', JSON.stringify(sequenceSteps));
            addLog('序列已保存');
            alert('序列已保存');
        }
        
        // 加载序列
        function loadSequence() {
            const saved = localStorage.getItem('sequence');
            if (saved) {
                sequenceSteps = JSON.parse(saved);
                renderSequence();
                addLog('序列已加载');
                alert('序列已加载');
            } else {
                alert('无保存的序列');
            }
        }
        
        // 启动序列
        async function startSequence() {
            if (isSequenceRunning) return;
            
            isSequenceRunning = true;
            const progress = document.getElementById('seqProgress');
            const status = document.getElementById('seqStatus');
            
            addLog('序列开始运行');
            
            for (let i = 0; i < sequenceSteps.length; i++) {
                if (!isSequenceRunning) break;
                
                const step = sequenceSteps[i];
                status.textContent = `执行步骤 ${i + 1}/${sequenceSteps.length}: 轴${step.axis} → ${step.position}°`;
                progress.style.width = `${((i + 1) / sequenceSteps.length) * 100}%`;
                
                // 模拟执行
                const m = motors.find(x => x.node_id === step.axis);
                if (m && m.enabled) {
                    m.position = step.position;
                }
                
                addLog(`步骤 ${i + 1}: 轴${step.axis} 移动到 ${step.position}°`);
                
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
            
            isSequenceRunning = false;
            status.textContent = '序列完成';
            addLog('序列执行完成');
            renderMotors();
        }
        
        // 停止序列
        function stopSequence() {
            isSequenceRunning = false;
            document.getElementById('seqStatus').textContent = '已停止';
            document.getElementById('seqProgress').style.width = '0%';
            addLog('序列已停止');
        }
        
        // 显示IO
        function showIO(type) {
            currentIOType = type;
            document.getElementById('outputTab').classList.toggle('active', type === 'output');
            document.getElementById('inputTab').classList.toggle('active', type === 'input');
            document.getElementById('batchControls').style.display = type === 'output' ? 'block' : 'none';
            renderIO();
        }
        
        // 渲染IO
        function renderIO() {
            const grid = document.getElementById('ioGrid');
            
            if (currentIOType === 'output') {
                grid.innerHTML = outputs.map(o => `
                    <div class="io-card ${o.active ? 'active' : ''}">
                        <div class="io-header">
                            <span class="io-name">${o.name}</span>
                            <span class="io-status ${o.active ? 'on' : ''}">${o.active ? 'ON' : 'OFF'}</span>
                        </div>
                        <div style="color:#636e72;font-size:12px;margin-bottom:5px;">${o.type === 'cylinder' ? '气缸' : '数字输出'}</div>
                        <button class="io-toggle ${o.active ? 'on' : ''}" onclick="toggleOutput(${o.id})">${o.active ? '关闭' : '开启'}</button>
                    </div>
                `).join('');
            } else {
                grid.innerHTML = inputs.map(i => `
                    <div class="io-card ${i.active ? 'active' : ''}">
                        <div class="io-header">
                            <span class="io-name">${i.name}</span>
                            <span class="io-status ${i.active ? 'on' : ''}">${i.active ? '触发' : '空闲'}</span>
                        </div>
                        <div style="color:#636e72;font-size:12px;">${i.type === 'proximity' ? '接近传感器' : i.type === 'limit' ? '限位开关' : '数字输入'}</div>
                    </div>
                `).join('');
            }
        }
        
        // 切换输出
        function toggleOutput(id) {
            const o = outputs.find(x => x.id === id);
            if (!o) return;
            
            o.active = !o.active;
            addLog(`输出${id} (${o.name}): ${o.active ? '已开启' : '已关闭'}`);
            renderIO();
        }
        
        // 全部输出
        function setAllOutputs(state) {
            outputs.forEach(o => o.active = state);
            addLog(`全部输出: ${state ? '已开启' : '已关闭'}`);
            renderIO();
        }
        
        // 连接相机
        function connectCamera() {
            isCameraConnected = !isCameraConnected;
            const btn = document.getElementById('cameraBtn');
            const preview = document.getElementById('imagePreview');
            
            if (isCameraConnected) {
                btn.textContent = '断开相机';
                btn.style.background = '#e17055';
                preview.textContent = '相机已连接';
                addLog('相机已连接');
            } else {
                btn.textContent = '连接相机';
                btn.style.background = '#0984e3';
                preview.textContent = '图像预览区域';
                addLog('相机已断开');
            }
        }
        
        // 开始标定
        function startCalibration() {
            isCalibrated = true;
            document.getElementById('calibStatus').textContent = '已标定';
            document.getElementById('calibStatus').style.background = '#00b894';
            addLog('视觉标定完成');
            alert('标定完成');
        }
        
        // 加载标定
        function loadCalibration() {
            isCalibrated = true;
            document.getElementById('calibStatus').textContent = '已标定';
            document.getElementById('calibStatus').style.background = '#00b894';
            addLog('标定数据已加载');
            alert('标定已加载');
        }
        
        // 保存标定
        function saveCalibration() {
            const config = {
                cameraModel: document.getElementById('cameraModel').value,
                cameraIp: document.getElementById('cameraIp').value,
                cameraPort: document.getElementById('cameraPort').value,
                resolution: document.getElementById('resolution').value,
                frameRate: document.getElementById('frameRate').value,
                exposureTime: document.getElementById('exposureTime').value,
                calibType: document.getElementById('calibType').value,
                gridSize: document.getElementById('gridSize').value,
                isCalibrated: isCalibrated
            };
            localStorage.setItem('visionConfig', JSON.stringify(config));
            addLog('视觉配置已保存');
            alert('配置已保存');
        }
        
        // 采集图像
        function captureImage() {
            if (!isCameraConnected) {
                alert('请先连接相机');
                return;
            }
            document.getElementById('imagePreview').textContent = '图像已采集';
            addLog('图像采集完成');
        }
        
        // 开始检测
        function startDetection() {
            if (!isCameraConnected) {
                alert('请先连接相机');
                return;
            }
            
            const lastResult = document.getElementById('lastResult');
            lastResult.innerHTML = '<div style="text-align:center;font-size:18px;font-weight:600;">检测中...</div>';
            
            setTimeout(() => {
                detectCount++;
                const passed = Math.random() > 0.2;
                
                if (passed) {
                    passCount++;
                    lastResult.innerHTML = '<div style="text-align:center;font-size:24px;font-weight:600;color:#00b894;">✓ 合格</div>';
                } else {
                    failCount++;
                    lastResult.innerHTML = '<div style="text-align:center;font-size:24px;font-weight:600;color:#e17055;">✗ 不合格</div>';
                }
                
                document.getElementById('detectCount').textContent = detectCount;
                document.getElementById('passCount').textContent = passCount;
                document.getElementById('failCount').textContent = failCount;
                document.getElementById('passRate').textContent = Math.round(passCount / detectCount * 100) + '%';
                
                // 显示详情
                document.getElementById('detectionDetails').style.display = 'block';
                document.getElementById('lastX').textContent = (Math.random() * 100).toFixed(2);
                document.getElementById('lastY').textContent = (Math.random() * 100).toFixed(2);
                document.getElementById('lastSize').textContent = (Math.random() * 50 + 10).toFixed(2);
                document.getElementById('lastConfidence').textContent = (Math.random() * 20 + 80).toFixed(1);
                
                addLog(`检测完成: ${passed ? '合格' : '不合格'}`);
            }, 1500);
        }
        
        // 保存图像
        function saveImage() {
            addLog('图像已保存');
            alert('图像已保存');
        }
        
        // 重置视觉
        function resetVision() {
            detectCount = 0;
            passCount = 0;
            failCount = 0;
            
            document.getElementById('detectCount').textContent = '0';
            document.getElementById('passCount').textContent = '0';
            document.getElementById('failCount').textContent = '0';
            document.getElementById('passRate').textContent = '0%';
            document.getElementById('lastResult').innerHTML = '<div style="text-align:center;font-size:18px;font-weight:600;color:#636e72;">无检测记录</div>';
            document.getElementById('detectionDetails').style.display = 'none';
            document.getElementById('imagePreview').textContent = '图像预览区域';
            
            addLog('视觉检测已重置');
        }
        
        // 模拟数据更新
        setInterval(() => {
            if (isConnected) {
                motors.forEach(m => {
                    if (m.status === 'online') {
                        m.velocity = Math.random() * 10;
                        m.current = Math.random() * 0.5;
                    }
                });
                
                inputs.forEach(i => {
                    i.active = Math.random() > 0.7;
                });
                
                renderMotors();
                if (currentIOType === 'input') {
                    renderIO();
                }
            }
        }, 500);
        
        // 初始化
        init();
    </script>
</body>
</html>
