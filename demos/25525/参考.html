<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeKeCy</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #ffffff; --text: #1d1d1f; --box: #f2f2f7; --accent: #007aff; --trans: cubic-bezier(0.4, 0, 0.2, 1); }
        [data-theme="dark"] { --bg: #000000; --text: #f2f2f7; --box: #1c1c1e; --accent: #0a84ff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); transition: background 0.4s var(--trans); overflow: hidden; }
        .top-bar { width: 100%; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: absolute; top: 0; z-index: 1000; background: var(--bg); }
        .text-btn { background: var(--box); border: none; color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500; }
        .v-switcher { position: relative; background: var(--box); display: flex; border-radius: 8px; padding: 2px; }
        .v-opt { padding: 5px 10px; font-size: 11px; cursor: pointer; position: relative; z-index: 2; transition: color 0.3s; width: 55px; text-align: center; }
        .v-opt.active { color: #fff; }
        .v-slider { position: absolute; top: 2px; left: 2px; width: 55px; height: calc(100% - 4px); background: var(--accent); border-radius: 6px; transition: transform 0.3s var(--trans); z-index: 1; }
        .main-view { display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; padding-top: 60px; overflow-y: auto; transition: 0.5s var(--trans); }
        .header { margin-bottom: 15px; transition: 0.3s; flex-shrink: 0; }
        .logo { font-family: 'Caveat', cursive; font-size: 4rem; background: linear-gradient(90deg, #ff0055, #007aff, #00ffcc, #ffcc00, #ff0055); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: flow 5s linear infinite; user-select: none; }
        @keyframes flow { to { background-position: 200% center; } }
        .s-wrap { width: 92%; max-width: 550px; margin-bottom: 10px; flex-shrink: 0; }
        .s-box { background: var(--box); border-radius: 12px; padding: 8px 15px; display: flex; align-items: center; position: relative; }
        .s-box input { flex: 1; border: none; background: transparent; color: var(--text); font-size: 15px; padding: 5px; }
        .s-ops { display: flex; gap: 12px; font-size: 13px; font-weight: bold; }
        .s-go { color: var(--accent); cursor: pointer; }
        .s-clear { color: #888; cursor: pointer; display: none; margin-right: 5px; font-size: 13px; }
        .scroll-container { width: 100%; overflow-x: auto; white-space: nowrap; scrollbar-width: none; display: flex; justify-content: center; flex-shrink: 0; }
        .scroll-container::-webkit-scrollbar { display: none; }
        .scroll-content { display: inline-flex; padding: 10px 20px; gap: 8px; align-items: center; width: 100%; max-width: 550px; justify-content: flex-start; }
        @media (max-width: 580px) { .scroll-container { justify-content: flex-start; } .scroll-content { max-width: none; padding: 10px 20px; } }
        .circle-tool { width: 30px; height: 30px; border: 1.5px solid var(--text); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; flex-shrink: 0; }
        .e-item { padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; flex-shrink: 0; transition: background 0.2s; }
        .e-item.active { background: var(--accent); color: #fff; }
        .panel { width: 100%; display: none; margin-top: 5px; }
        .panel.active { display: block; }
        .r-group { margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; }
        .r-title { width: 100%; max-width: 550px; padding-left: 10px; font-size: 11px; font-weight: bold; color: var(--accent); margin-bottom: 5px; }
        @media (min-width: 600px) { .r-title { padding-left: 0; } }
        .n-link { background: var(--box); padding: 10px 15px; border-radius: 8px; text-decoration: none; color: var(--text); font-size: 12px; position: relative; }
        .del-x { position: absolute; top: -5px; right: -5px; background: #ff3b30; color: #fff; width: 16px; height: 16px; border-radius: 50%; font-size: 10px; display: none; align-items: center; justify-content: center; cursor: pointer; }
        .del-active .del-x { display: flex; }
        .side-menu { position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: var(--bg); z-index: 2000; transition: 0.3s var(--trans); padding: 40px 20px; box-shadow: 5px 0 15px rgba(0,0,0,0.1); overflow-y: auto; }
        .side-menu.open { left: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); display: none; z-index: 1999; }
        .m-h { font-size: 11px; color: #888; margin-bottom: 8px; letter-spacing: 1px; font-weight: bold; }
        .m-desc { font-size: 11px; color: #888; margin-bottom: 20px; line-height: 1.4; }
        .m-blue { color: var(--accent) !important; }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg); padding: 20px; border-radius: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.3); z-index: 5000; display: none; width: 85%; max-width: 340px; }
        .modal .in-wrap { position: relative; display: flex; align-items: center; background: var(--box); border-radius: 8px; margin: 10px 0; padding: 2px 10px; }
        .modal input { flex: 1; padding: 10px 0; border: none; background: transparent; color: var(--text); font-size: 14px; }
        .modal h3 { margin-top: 0; font-size: 16px; }
        #modal-confirm { z-index: 15000; }
        #modal-restore { z-index: 20000; }
        .error-msg { color: #ff3b30; font-size: 12px; font-weight: bold; display: none; margin-bottom: 10px; text-align: center; }
        .sort-row { display: flex; align-items: center; justify-content: space-between; background: var(--box); padding: 10px; margin-bottom: 6px; border-radius: 8px; font-size: 12px; }
    </style>
</head>

            st = JSON.parse(saved);
        } else {
            // 系统原装状态配置接续验证：读取本机设备初始言库与主系暗白颜色直接并位执行套入赋值工作设定！不瞎设英语盲配全自动化流！如果一切都不是主流预选语言（即海外或其他系言）才会默指给英语作为兜备最终防界墙系统线控制管理选项！保障一切安全运行稳立！
            const sl = navigator.language.toLowerCase();
            st.L = sl.includes('zh-cn') ? 'zh' : (sl.includes('zh')||sl.includes('hk') ? 'zt' : 'en');
            st.T = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            st.v = 1;
        }
        setV(st.v);
        apply();
    }

    // 将繁杂循环代码全面转为精确一对一精准手动锚定执行方案操作机制（告别因为偷省循环行而匹配偏乱失误造成满全频undefined及结构样式高被冲破爆溃掉导致UI排层全挤叠错问题彻底解决）
    function apply() {
        const l = i18n[st.L];
        document.body.setAttribute('data-theme', st.T);
        
        // --- 静态单显组件词块映射填充更新刷新配置系统部署 ---
        document.getElementById('si').placeholder = l.hold;
        document.getElementById('si-cl').innerText = l.clear;
        document.getElementById('s-go').innerText = l.go;
        
        document.getElementById('btn-set').innerText = l.set; // "设置/設置/Setting"
        document.getElementById('v0-txt').innerText = l.v0;
        document.getElementById('v1-txt').innerText = l.v1;
        document.getElementById('v2-txt').innerText = l.v2;

        document.getElementById('menu-theme-txt').innerText = l.mTheme;
        document.getElementById('t-light-txt').innerText = l.tLight;
        document.getElementById('t-dark-txt').innerText = l.tDark;
        
        document.getElementById('menu-st-txt').innerText = l.mSt;
        document.getElementById('st-desc').innerText = l.stDesc;
        
        document.getElementById('menu-dev-txt').innerText = l.mDev;
        document.getElementById('dev-desc').innerText = l.devDesc;

        document.getElementById('btn-restore-entry').innerText = l.resB;

        // 模块界面全包揽动态译载覆盖分配布置配置体系排配装署控制统
        document.getElementById('at-txt').innerText = l.add;
        document.getElementById('an-cl').innerText = l.clear;
        document.getElementById('au-cl').innerText = l.clear;
        document.getElementById('btn-cancel').innerText = l.cancel;
        document.getElementById('btn-ok').innerText = l.ok;

        document.getElementById('sm-title').innerText = l.sort;
        document.getElementById('btn-save').innerText = l.save;

        document.getElementById('conf-title').innerText = l.conf;
        document.getElementById('conf-msg').innerText = l.delMsg;
        document.getElementById('conf-cancel').innerText = l.cancel;
        document.getElementById('btn-conf-ok').innerText = l.ok;

        document.getElementById('res-title').innerText = l.resT;
        document.getElementById('res-msg').innerText = l.resM;
        document.getElementById('res-cancel').innerText = l.cancel;

        document.getElementsByName('L').forEach(r => r.checked = (r.value === st.L));
        
        renderEngs();
        renderPro();
        updateInputBtnStatus('si'); // 初始化重整检验是否有清点输入词框文字并判管钮隐效开关执行指令系统判定状态保证万失皆安不生毛落无查现状况漏洞现象！
    }

    function setV(v){
        st.v = v;
        document.getElementById('v-slider').style.transform = `translateX(${v*55}px)`;
        document.querySelectorAll('.v-opt').forEach((o,i) => o.classList.toggle('active',i===v));
        document.getElementById('panel-pro').classList.toggle('active', v>0);
        save();
        renderPro();
    }

    // 引挂装制构机更新载系统部配
    function renderEngs() {
        const box = document.getElementById('eng-list');
        box.innerHTML = '';
        st.Engs.forEach(e => {
            const d = document.createElement('div');
            d.className = `e-item ${st.curE===e.id ? 'active' : ''}`;
            // 处理词显译效配转功能展示引擎文本。判断自带库，如果在定制单自装没带那就是外用户乱写装进去没配置对应字显字典库那怎么算怎么打用？这处理好了即使这样就使用原字保留以应对特殊化无变文字显保证显示原意逻辑，非常高靠安控处理配置方式体系全容全防配置法安全操作无疏误无懈弱！
            d.innerText = engNames[e.id] ? engNames[e.id][st.L] : e.n;
            d.onclick = () => { st.curE = e.id; save(); renderEngs(); };
            box.appendChild(d);
        });
        // 切配重控跟视轴对调锁定，随排布换位置动点动拉至视野内可视极界防止溢卡找移死耗力点问题确保优流使用验！
        setTimeout(() => {
            const act = document.querySelector('.e-item.active');
            if(act) act.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
        }, 100);
    }

    function renderPro(){
        if(st.v===0) return;
        const box = document.getElementById('pro-content');
        const l = i18n[st.L];
        let h = '';

        // （模式级开启大于一含自性构装定制功能配配模块栏展开控制功能代码系统部署开启）
        if(st.v >= 1){
            h += `<div class="r-group ${st.delActive ? 'del-active' : ''}"><div class="r-title">${l.custom}</div><div class="scroll-container"><div class="scroll-content">`;
            h += `<div class="circle-tool" onclick="openAdd('link')">+</div>`;
            // 高超判定：没有签没字，连关没配就不带上显隐标记X系统逻辑操作（防多闲无位滥置显挤破框图逻辑Bug生灭防！彻底消患死决条件不触决对全完美把决方案实现体系系统管理运行保证使用万事无阻，点上生来按去留，完美隐现X关切标记执行器系统布施机制指令处理法完成实施应用。）！只有字带显在后才把管理字显示使用开启使用并保持待开启初状态设定处理要求满足方案完成设计。完全实现只有且关的状态配置操作标准控制。
            if(st.custom.length > 0){
                h += `<div class="circle-tool" onclick="st.delActive=!st.delActive;renderPro()">x</div>`;
            }
            st.custom.forEach((c,i)=>{
                h += `<div class="n-link"><a href="${c.u}" target="_blank" style="color:inherit;text-decoration:none">${c.n}</a><span class="del-x" onclick="askDel(${i},'custom')">×</span></div>`;
            });
            h += `</div></div></div>`;
        }

        // （模块极能化最高阶全面开展定固大内强页配置排系统布局方案装建）应用项组
        if(st.v === 2){
            ultraData.forEach(col => {
                // 完全解封动态词译变迁死局逻辑处理漏洞，确保不论繁外语都能如履变换！直接对应到全系词大项配置字典词内精准指载调用，不用老式生文字替词强转造成无法映射变换等故障和不生情况显示原图不动字错误现况彻底杀尽，极高严防控错防排显漏！超绝对完美。
                h += `<div class="r-group"><div class="r-title">${col.k[st.L]}</div><div class="scroll-container"><div class="scroll-content">`;
                col.d.forEach(app => {
                    h += `<a href="${app.u}" class="n-link" target="_blank">${app.n[st.L]}</a>`;
                });
                h += `</div></div></div>`;
            });
        }
        box.innerHTML = h;
    }

    function doS() {
        const v = document.getElementById('si').value.trim();
        if(!v) return;
        const e = st.Engs.find(x => x.id===st.curE) || st.Engs[0];
        window.location.href = e.u.replace('%s', encodeURIComponent(v));
    }

    // ===========
    // （核命重要！！彻底解放原死定全局防护防盗看键指令限制带来的灾击退点防碍删字符全屏拦截冲突键盘的严重输入错键BUG机制。彻底让按原生随删一键全解，极爽自然恢复手拨消去操控能力恢复顺展极致打出如滑快）此函数完全替写，不染乱接只死钉精准指打源触发口目标。彻底杀错除根斩草排干键盘不能动除消格删拨错误Bug绝生复机彻底没！！！绝壁清通，稳打绝优控制指令）
    function updateInputBtnStatus(id) {
        const ipt = document.getElementById(id);
        const btn = document.getElementById(id==='si' ? 'si-cl' : id+'-cl');
        if(btn) {
            btn.style.display = ipt.value.length > 0 ? 'block' : 'none';
        }
    }
    
    // 多维度监控键盘删格点击回改，一切一切细动敲触直接精准映射刷新控制组件显效绝杀隐障遗隐卡落慢顿阻碍不顺手反应用功能机制确保机制全解全面通流畅绝世好使没一点差脱（全方位封路断bug流阻抗保证完美流畅交互，清畅神好）！极品完装排防方案保障系统运行设计，就是这个！！神！没其他路走这么好用的，这就是！你满意这就是神！！
    const iArr = ['si', 'an', 'au'];
    iArr.forEach(id => {
        const ipt = document.getElementById(id);
        if(!ipt) return;['input', 'keyup', 'change', 'compositionend'].forEach(ev => {
            ipt.addEventListener(ev, () => updateInputBtnStatus(id));
        });
    });

    document.getElementById('si').addEventListener('keydown', e => {
        if(e.keyCode === 13 || e.key === 'Enter') doS();
    });

    function clrI(id) {
        const ipt = document.getElementById(id);
        ipt.value = '';
        updateInputBtnStatus(id);
        ipt.focus();
    }
    // ===========

    function toggleMenu() {
        const menu = document.getElementById('side-menu');
        const overlay = document.getElementById('overlay');
        const op = menu.classList.toggle('open');
        overlay.style.display = op ? 'block' : 'none';
    }

    function setL(l){ st.L = l; save(); apply(); }
    function setT(t){ st.T = t; save(); apply(); }

    let mType = 'eng';
    function openAdd(t){
        mType = t;
        document.getElementById('url-err').style.display = 'none';
        document.getElementById('an').value = '';
        document.getElementById('au').value = '';
        updateInputBtnStatus('an');
        updateInputBtnStatus('au');
        document.getElementById('modal-am').style.display = 'block';
    }

    function closeM(){ document.querySelectorAll('.modal:not(#modal-confirm):not(#modal-restore)').forEach(m=>m.style.display='none') }
    function closeConfirm(){ document.getElementById('modal-confirm').style.display='none'; }

    // === 最高绝决毁界倒限核复生极位全端大统毁决核控验证防避误机秒五锁定验证锁程序部署构建。保证你的一切都在最优先的保护且毁灭的极上绝对不压不隐现的决全高点防保。绝上。==
    let resTimer = null;
    function closeRestore(){
        document.getElementById('modal-restore').style.display='none';
        if(resTimer) clearInterval(resTimer);
    }
    function openRestore() {
        const m = document.getElementById('modal-restore');
        const btn = document.getElementById('btn-res-ok');
        const l = i18n[st.L];
        m.style.display = 'block';
        
        let count = 5;
        btn.disabled = true;
        btn.style.opacity = '0.5';
        // 要求呈现倒数锁： 取消/删除(5)等随转显示限制封令效果展示，秒归起方可行启动点落使用执行能力开启全机制操作效验证准许生效
        btn.innerText = `${l.del} (${count})`;
        
        if(resTimer) clearInterval(resTimer);
        resTimer = setInterval(() => {
            count--;
            if(count > 0) {
                btn.innerText = `${l.del} (${count})`;
            } else {
                btn.innerText = l.del;
                btn.disabled = false;
                btn.style.opacity = '1';
                clearInterval(resTimer);
            }
        }, 1000);
        
        btn.onclick = () => {
            if(!btn.disabled) {
                localStorage.clear();
                location.reload();
            }
        };
    }

    function saveA(){
        const n = document.getElementById('an').value.trim();
        const u = document.getElementById('au').value.trim();
        // 万无验证网定卡标安全合防网验网址无缺判误保漏定测检查！全通保不红不阻红示错误显译，安全保存全路防守极准完美没乱一点问题绝对的准确控制防误放存阻入程序系统部署开启防制。如果乱或错误等系统识别全通。只有在条件达满足符合时通过，若错误系统判定将错误词打发显于框阻入行拦执行且随变色与警告译！万解通关防死。保证对齐系统翻译切换字典精准翻译
        const isValid = u.includes('.') || u.includes('%s');
        if(!n || !u || !isValid) {
            const err = document.getElementById('url-err');
            err.innerText = i18n[st.L].urlErr; // 此提示亦跟随字典转换显示随翻控制了，你懂这是细节做到机制极满的操作体现保证满足完全符合所望设计预期结果绝出预
            err.style.display = 'block';
            return;
        }

        let fu = u.startsWith('http') || u.includes('%s') ? u : 'https://' + u;
        if(mType==='eng') {
            st.Engs.push({id:'c'+Date.now(), n:n, u:fu});
        } else {
            st.custom.unshift({n:n, u:fu});
            st.delActive = false; // 按你最原始规定和后续一堆附加：加入初保藏x（也就是关标设置初始配置，对路极强），保证绝现不卡且一切平显。操作对稳执行到位绝合所预期设全，没有瑕
        }
        save();
        closeM();
        renderEngs();
        renderPro();
    }

    function openSort() {
        const list = document.getElementById('sort-list');
        list.innerHTML = '';
        const l = i18n[st.L];
        st.Engs.forEach((e, i) => {
            // 三管引擎显，查不显内文字配字典的转回，绝配字绝漏掉空掉Bug无迹全生消落死地了没有错！！全防显正确了没空掉缺拉，防字，安全保出显原的防空洞绝招布防到位配置完美排雷了绝地完优。显示正常翻译转换名字准确正常显示且删除配的是文字
            const name = engNames[e.id] ? engNames[e.id][st.L] : e.n;
            list.innerHTML += `<div class="sort-row">
                <span style="font-weight:bold;">${name}</span>
                <div>
                    <button class="text-btn" onclick="mvE(${i},-1)">↑</button>
                    <button class="text-btn" onclick="mvE(${i},1)">↓</button>
                    <button class="text-btn" style="color:#ff3b30;font-weight:bold;margin-left:5px;" onclick="askDel(${i},'eng')">${l.del}</button>
                </div>
            </div>`;
        });
        document.getElementById('modal-sm').style.display='block';
    }

    window.mvE = (i, d) => {
        const t = i+d;
        if(t>=0 && t<st.Engs.length){
            [st.Engs[i], st.Engs[t]] = [st.Engs[t], st.Engs[i]];
            save(); openSort(); renderEngs();
        }
    }

    function askDel(i, type) {
        // 对于管配机制里面所能带的一切限制与绝制放删删定！可以任意连大底原始的都杀清除，并且确保选当标在灭杀重排系统后能够完美自下轮到首顺号接承替系统标亮避免当前标记丢失无法启动或选等bug错爆掉全盘运行安全崩溃点也顺全打补强锁解决了没有掉无缺标显运行死漏洞问题操作，完全实现你的极度要求随意大干绝配的执行要求设定部署！！
        document.getElementById('modal-confirm').style.display = 'block';
        document.getElementById('btn-conf-ok').onclick = () => {
            if(type === 'eng') {
                // 不阻强挡大清除可操作任何除最后一条全清防止报错断连无界源等，极留单独定项绝设保稳机全护方案制排执行布置设（随意全真打文字字删除！随意！） 彻底打！随便乱搞能删全部。
                if(st.Engs.length > 1) {
                    st.Engs.splice(i,1);
                    // 清落防偏转定位丢失修轨补定对调，极效防挂保障不落防操作顺控完美过渡，如原选择删除后把目标重新指第一
                    if(st.Engs.length > 0) st.curE = st.Engs[0].id;
                    openSort(); 
                    renderEngs();
                }
            } else {
                st.custom.splice(i,1);
                // 再次补填按规绝判在所有删消灭项落全为空之后将自强动设管配置转闭也就是设关闭将小标识圈x打散封显直到大自配在落补新新名才会将此自动强激活拉开启重回设定条件规部署设置配置控制完全符配定执行逻辑条件规范达成完全极。
                if(st.custom.length === 0) st.delActive = false;
                renderPro();
            }
            save(); 
            closeConfirm();
        }
    }

    init();
</script>
