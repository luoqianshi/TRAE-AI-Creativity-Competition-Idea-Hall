<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FAF5F3">
  <title>Haru Word - 韩语背词</title>
  <style>
    :root {
      --bg: #FAF5F3;
      --primary: #E8B9B5;
      --success: #C8D6C5;
      --container: #FBF9F3;
      --text: #3C3935;
      --text-secondary: #4A4141;
      --text-muted: #A0968E;
      --text-light: #B9C9D6;
      --android-nav-height: 64px;
      --status-bar-height: 28px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    /* ===== Full-screen overlay pages (Splash / Study) ===== */
    .page {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity 0.4s ease;
      overflow: hidden;
      z-index: 50;
      background: var(--bg);
    }
    .page.active {
      display: flex;
      opacity: 1;
    }

    /* ===== Splash ===== */
    .splash {
      justify-content: center;
      align-items: center;
      z-index: 200;
      background: var(--bg);
    }
    .splash h1 {
      font-size: 56px;
      font-weight: 300;
      letter-spacing: 6px;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeInUp 0.8s ease 0.3s forwards;
    }
    .splash .brand {
      font-size: 15px;
      color: var(--text-muted);
      letter-spacing: 8px;
      font-weight: 500;
      opacity: 0;
      animation: fadeInUp 0.8s ease 0.6s forwards;
    }
    .splash .slogan {
      margin-top: 12px;
      font-size: 14px;
      color: var(--primary);
      font-weight: 500;
      opacity: 0;
      animation: fadeInUp 0.8s ease 0.9s forwards;
    }

    /* ===== Tab Root ===== */
    .tab-root {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      z-index: 1;
      background: var(--bg);
    }
    .tab-content {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .tab-page {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.25s ease, visibility 0.25s;
      -webkit-overflow-scrolling: touch;
    }
    .tab-page.active {
      visibility: visible;
      opacity: 1;
    }

    /* ===== Bottom Nav (Android style) ===== */
    .bottom-nav {
      height: var(--android-nav-height);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(185, 201, 214, 0.18);
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 24px;
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.25s;
      min-width: 64px;
      min-height: 48px;
      position: relative;
    }
    .nav-item.active { color: var(--primary); }
    .nav-item::before {
      content: '';
      position: absolute;
      top: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--primary);
      opacity: 0;
      transform: scale(0);
      transition: opacity 0.25s, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .nav-item.active::before {
      opacity: 1;
      transform: scale(1);
    }
    .nav-icon {
      width: 24px; height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-icon svg {
      width: 22px; height: 22px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .nav-label { font-size: 11px; font-weight: 600; letter-spacing: 0.3px; }

    /* ===== Tab 1: Today ===== */
    .today-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 28px calc(24px + var(--android-nav-height));
      position: relative;
      overflow: hidden;
    }
    .today-page::before {
      content: '';
      position: absolute;
      top: -80px; right: -60px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,185,181,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .today-page::after {
      content: '';
      position: absolute;
      bottom: 80px; left: -40px;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,214,197,0.14) 0%, transparent 70%);
      pointer-events: none;
    }
    .today-spacer { flex: 1; min-height: 40px; }
    .today-quote {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      text-align: center;
      line-height: 1.4;
    }
    .today-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 48px;
      text-align: center;
    }
    .today-stats {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-bottom: 48px;
    }
    .today-stat { text-align: center; }
    .today-num {
      font-size: 40px;
      font-weight: 700;
      line-height: 1;
    }
    .today-num.review { color: var(--success); }
    .today-num.new { color: var(--primary); }
    .today-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 8px;
      font-weight: 500;
    }
    .today-divider {
      width: 1px;
      height: 48px;
      background: rgba(185, 201, 214, 0.35);
    }
    .today-btn {
      width: 100%;
      max-width: 300px;
      padding: 22px 28px;
      border: 1px solid rgba(185, 201, 214, 0.3);
      border-radius: 28px;
      background: linear-gradient(180deg, #ffffff 0%, var(--container) 100%);
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 36px rgba(74, 65, 65, 0.08), 0 4px 12px rgba(74, 65, 65, 0.04);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s, background 0.2s;
      letter-spacing: 0.5px;
      position: relative;
      z-index: 1;
    }
    .today-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 42px rgba(74, 65, 65, 0.1), 0 6px 16px rgba(74, 65, 65, 0.05);
    }
    .today-btn:active {
      transform: scale(0.96) translateY(0);
      box-shadow: 0 4px 14px rgba(74, 65, 65, 0.04);
      background: linear-gradient(180deg, #faf8f4 0%, #f0ece2 100%);
    }
    .today-btn-hint {
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-light);
    }
    .today-spacer2 { flex: 1.5; min-height: 40px; }

    /* ===== Tab 2: Vocab ===== */
    .vocab-page {
      padding: 16px 16px calc(16px + var(--android-nav-height));
    }
    .vocab-search-wrap {
      position: sticky;
      top: 0;
      background: var(--bg);
      padding: 8px 4px 12px;
      z-index: 5;
    }
    .vocab-search {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      border-radius: 16px;
      padding: 0 14px;
      box-shadow: 0 2px 8px rgba(74,65,65,0.04);
    }
    .vocab-search svg {
      width: 18px; height: 18px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
      flex-shrink: 0;
    }
    .vocab-search input {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: transparent;
      font-size: 15px;
      color: var(--text);
      outline: none;
    }
    .vocab-search input::placeholder { color: var(--text-light); }
    .vocab-search:has(input:focus) {
      box-shadow: 0 2px 12px rgba(232, 185, 181, 0.2), 0 0 0 2px rgba(232, 185, 181, 0.15);
    }
    .vocab-categories {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      padding: 0 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .vocab-categories::-webkit-scrollbar { display: none; }
    .vocab-cat {
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      background: white;
      color: var(--text-muted);
      border: none;
      transition: all 0.2s;
      box-shadow: 0 1px 4px rgba(74,65,65,0.03);
    }
    .vocab-cat.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(232, 185, 181, 0.25);
    }
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 4px;
    }
    .vocab-card {
      background: white;
      border-radius: 20px;
      padding: 20px 16px;
      box-shadow: 0 4px 16px rgba(74,65,65,0.04);
      display: flex;
      flex-direction: column;
      min-height: 120px;
      transition: transform 0.2s, box-shadow 0.2s;
      border-left: 3px solid transparent;
    }
    .vocab-card:active { transform: scale(0.97); }
    .vocab-card[data-status="new"] { border-left-color: var(--primary); }
    .vocab-card[data-status="learning"] { border-left-color: var(--success); }
    .vocab-card[data-status="mastered"] { border-left-color: var(--text-light); }
    .vocab-card .v-word {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    .vocab-card .v-meaning {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .vocab-card .v-meta {
      margin-top: auto;
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .v-tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .tag-new { background: rgba(232,185,181,0.15); color: var(--primary); }
    .tag-learning { background: rgba(200,214,197,0.35); color: #5a7a5a; }
    .tag-mastered { background: var(--container); color: var(--text-muted); }
    .v-count {
      font-size: 11px;
      color: var(--text-light);
      font-weight: 500;
    }
    .vocab-import {
      margin-top: 20px;
      padding: 0 4px;
    }
    .vocab-import-btn {
      width: 100%;
      padding: 14px;
      border: 1.5px dashed rgba(185, 201, 214, 0.5);
      border-radius: 16px;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .vocab-import-btn:active {
      background: rgba(232,185,181,0.08);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* ===== Tab 3: Profile ===== */
    .profile-page {
      padding: 20px 20px calc(20px + var(--android-nav-height));
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding: 8px 4px;
    }
    .profile-avatar {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #d4a09c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: white;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 6px 18px rgba(232, 185, 181, 0.3);
      border: 2px solid rgba(255,255,255,0.6);
    }
    .profile-info { flex: 1; }
    .profile-name { font-size: 18px; font-weight: 700; margin-bottom: 3px; }
    .profile-level { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .profile-stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .profile-stat-card {
      flex: 1;
      background: white;
      border-radius: 18px;
      padding: 14px 8px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(74,65,65,0.04);
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .profile-stat-card:active { transform: scale(0.96); }
    .profile-stat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.3px; }
    .profile-stat-num { font-size: 24px; font-weight: 700; color: var(--primary); line-height: 1.2; }
    .profile-section {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(74,65,65,0.03);
    }
    .profile-section-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .profile-section-title .sub { font-size: 12px; color: var(--primary); font-weight: 600; }
    /* Calendar in profile */
    .calendar-title-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 28px;
      border-radius: 8px;
      background: rgba(232, 185, 181, 0.15);
      color: var(--primary);
      margin-right: 6px;
      vertical-align: middle;
    }
    .calendar-title-icon svg {
      stroke: var(--primary);
      width: 16px; height: 16px;
    }
    .calendar-month {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 10px;
      text-align: center;
      letter-spacing: 1px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .calendar-day-header {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      padding: 4px 0;
      letter-spacing: 0.5px;
    }
    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      border-radius: 50%;
      position: relative;
      color: var(--text);
    }
    .calendar-day.empty {
      visibility: hidden;
    }
    .calendar-day.checked::after {
      content: '';
      position: absolute;
      width: 30px; height: 30px;
      border: 2.5px solid #7DB87D;
      border-radius: 45% 55% 50% 50% / 50% 45% 55% 50%;
      transform: rotate(-6deg);
      pointer-events: none;
      top: 50%; left: 50%;
      margin-top: -15px; margin-left: -15px;
    }
    /* Settings */
    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid rgba(185, 201, 214, 0.2);
      cursor: pointer;
    }
    .setting-item:last-child { border-bottom: none; }
    .setting-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .setting-icon {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: var(--container);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .setting-item:nth-child(1) .setting-icon { background: rgba(232, 185, 181, 0.12); }
    .setting-item:nth-child(1) .setting-icon svg { stroke: var(--primary); }
    .setting-item:nth-child(2) .setting-icon { background: rgba(200, 214, 197, 0.25); }
    .setting-item:nth-child(2) .setting-icon svg { stroke: #6a8a6a; }
    .setting-item:nth-child(3) .setting-icon { background: rgba(185, 201, 214, 0.15); }
    .setting-item:nth-child(3) .setting-icon svg { stroke: #7a9aaa; }
    .setting-item:nth-child(4) .setting-icon { background: rgba(232, 185, 181, 0.08); }
    .setting-item:nth-child(4) .setting-icon svg { stroke: #c4a09c; }
    .setting-icon svg {
      width: 16px; height: 16px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
    }
    .setting-text { font-size: 14px; font-weight: 500; color: var(--text); }
    .setting-arrow {
      font-size: 13px;
      color: var(--text-light);
    }

    /* ===== Study Page ===== */
    .study {
      padding: 16px 20px;
      justify-content: flex-start;
      z-index: 100;
    }
    .study-header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      margin-top: 12px;
      padding-top: var(--status-bar-height);
    }
    .study-back {
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
      min-width: 48px;
      min-height: 48px;
      display: flex;
      align-items: center;
    }
    .progress-area {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 12px;
    }
    .progress-bar {
      flex: 1;
      height: 5px;
      background: var(--container);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--success);
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .progress-text { font-size: 12px; color: var(--text-muted); white-space: nowrap; font-weight: 500; }

    .card-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative;
    }
    .card-scene {
      perspective: 1200px;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 4/5;
      position: relative;
      user-select: none;
    }
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 24px;
    }
    .card.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 24px;
      overflow: hidden;
      background: white;
      box-shadow: 0 12px 32px rgba(74, 65, 65, 0.04);
    }

    .card-front {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }
    .card-front .word {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
      color: var(--text);
    }
    .card-front .pronunciation {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 20px;
      font-weight: 500;
    }
    .speaker-btn {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--container);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--primary);
      cursor: pointer;
      margin-bottom: 24px;
      transition: transform 0.2s;
      border: none;
    }
    .speaker-btn:active { transform: scale(0.88); }
    .mouth-demo {
      width: 80px; height: 60px;
      margin-bottom: 20px;
      display: none;
    }
    .mouth-demo.active { display: block; }
    .mouth-face {
      width: 56px; height: 56px;
      border: 3px solid var(--text);
      border-radius: 50%;
      margin: 0 auto;
      position: relative;
    }
    .mouth-lips {
      width: 24px; height: 12px;
      border: 2px solid var(--text);
      border-radius: 0 0 24px 24px;
      border-top: none;
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      animation: mouthMove 0.6s ease infinite alternate;
    }
    @keyframes mouthMove {
      from { height: 4px; border-radius: 0 0 12px 12px; }
      to { height: 16px; border-radius: 0 0 28px 28px; }
    }
    .card-front .hint {
      margin-top: auto;
      font-size: 13px;
      color: var(--text-light);
      text-align: center;
      line-height: 1.5;
    }
    .card-front .hint .arrow { font-size: 16px; margin: 0 4px; }

    .card-back {
      transform: rotateY(180deg);
      background: white;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .back-header { margin-bottom: 16px; }
    .back-word-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .back-word { font-size: 24px; font-weight: 700; }
    .back-speaker {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--container);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;

        meaning: '图书馆',
        pronunciation: 'do-seo-gwan',
        type: 'hanja',
        roots: [
          { kr: '도', cn: '图' },
          { kr: '서', cn: '书' },
          { kr: '관', cn: '馆' }
        ],
        mnemonic: '<span class="highlight">图</span>书<span class="highlight">馆</span>里<span class="highlight">读</span>书，<span class="highlight">馆</span>长<span class="highlight">关</span>门',
        contextImg: 'https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=600&h=338&fit=crop',
        sentence: '週末에 <span class="key">도서관</span>에서 공부해요. (周末在图书馆学习。)',
        soundChange: false,
        showMouth: false
      },
      {
        word: '아이스크림',
        meaning: '冰淇淋',
        pronunciation: 'a-i-seu-keu-rim',
        type: 'loan',
        loanFrom: 'Ice Cream',
        contextImg: 'https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?w=600&h=338&fit=crop',
        sentence: '여름에는 <span class="key">아이스크림</span>이 최고야! (夏天冰淇淋最棒了！)',
        soundChange: false,
        showMouth: false
      },
      {
        word: '사랑',
        meaning: '爱',
        pronunciation: 'sa-rang',
        type: 'native',
        contextImg: 'https://images.unsplash.com/photo-1518621736915-f3b1c41bfd08?w=600&h=338&fit=crop',
        sentence: '그 드라마는 <span class="key">사랑</span> 이야기야. (那部剧是爱情故事。)',
        soundChange: false,
        showMouth: false
      },
      {
        word: '감기',
        meaning: '感冒',
        pronunciation: 'gam-gi',
        type: 'hanja',
        roots: [
          { kr: '감', cn: '感' },
          { kr: '기', cn: '气' }
        ],
        mnemonic: '<span class="highlight">感</span>冒了，<span class="highlight">气</span>色不好',
        contextImg: 'https://images.unsplash.com/photo-1513224502586-d254786b77c5?w=600&h=338&fit=crop',
        sentence: '요즘 <span class="key">감기</span> 걸리기 쉬워요. (最近容易感冒。)',
        soundChange: true,
        soundChangeNote: '注意！有鼻音化音变，实际发音为 "강기" (gang-gi)',
        showMouth: true
      },
      {
        word: '카페',
        meaning: '咖啡厅',
        pronunciation: 'ka-pe',
        type: 'loan',
        loanFrom: 'Café',
        contextImg: 'https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=600&h=338&fit=crop',
        sentence: '이 <span class="key">카페</span> 커피가 진짜 맛있어. (这家咖啡厅咖啡真的很好喝。)',
        soundChange: false,
        showMouth: false
      }
    ];

    const VOCAB_LIB = [
      { word: '학교', meaning: '学校', status: 'learning', type: 'hanja', count: 3 },
      { word: '친구', meaning: '朋友', status: 'new', type: 'native', count: 0 },
      { word: '물', meaning: '水', status: 'mastered', type: 'native', count: 5 },
      { word: '컴퓨터', meaning: '电脑', status: 'learning', type: 'loan', count: 2 },
      { word: '사과', meaning: '苹果', status: 'mastered', type: 'native', count: 6 },
      { word: '영화', meaning: '电影', status: 'new', type: 'hanja', count: 0 },
      { word: '버스', meaning: '公交车', status: 'learning', type: 'loan', count: 1 },
      { word: '날씨', meaning: '天气', status: 'mastered', type: 'native', count: 4 },
      { word: '음악', meaning: '音乐', status: 'new', type: 'hanja', count: 0 },
      { word: '커피', meaning: '咖啡', status: 'learning', type: 'loan', count: 3 },
      { word: '병원', meaning: '医院', status: 'new', type: 'hanja', count: 0 },
      { word: '운동', meaning: '运动', status: 'mastered', type: 'native', count: 7 },
    ];

    const app = {
      state: {
        currentIndex: 0,
        flipped: false,
        isDragging: false,
        startX: 0,
        currentX: 0,
        activeTab: 'today',
        vocabFilter: 'all'
      },

      init() {
        this.renderCalendar();
        this.renderVocabGrid();
        this.setupSwipe();
        setTimeout(() => {
          document.getElementById('page-splash').classList.remove('active');
          const root = document.getElementById('tab-root');
          root.style.visibility = 'visible';
          root.style.opacity = '1';
        }, 2200);
      },

      switchTab(tabName) {
        this.state.activeTab = tabName;
        document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelector(`.nav-item[data-tab="${tabName}"]`).classList.add('active');
      },

      renderCalendar() {
        const monthEl = document.getElementById('calendar-month');
        const grid = document.getElementById('calendar-grid');
        if (!grid || !monthEl) return;

        const year = 2026, month = 6; // July = 6 (0-indexed)
        const firstDay = new Date(year, month, 1).getDay(); // 3 = Wednesday
        const daysInMonth = new Date(year, month + 1, 0).getDate(); // 31
        const checkedDates = [1, 2, 3];
        const weekDays = ['日', '一', '二', '三', '四', '五', '六'];

        monthEl.textContent = `${year}年${month + 1}月`;

        let html = weekDays.map(d => `<div class="calendar-day-header">${d}</div>`).join('');

        for (let i = 0; i < firstDay; i++) {
          html += `<div class="calendar-day empty"></div>`;
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const isChecked = checkedDates.includes(d);
          let cls = 'calendar-day';
          if (isChecked) cls += ' checked';
          html += `<div class="${cls}"><span>${d}</span></div>`;
        }

        grid.innerHTML = html;
      },

      renderVocabGrid() {
        const grid = document.getElementById('vocab-grid');
        if (!grid) return;
        const filter = this.state.vocabFilter;
        const items = filter === 'all' ? VOCAB_LIB : VOCAB_LIB.filter(v => v.status === filter);
        const tagMap = {
          new: { cls: 'tag-new', text: '未学' },
          learning: { cls: 'tag-learning', text: '正在啃' },
          mastered: { cls: 'tag-mastered', text: '已消灭' }
        };
        grid.innerHTML = items.map(v => {
          const t = tagMap[v.status];
          return `<div class="vocab-card" data-status="${v.status}">
            <div class="v-word">${v.word}</div>
            <div class="v-meaning">${v.meaning}</div>
            <div class="v-meta">
              <span class="v-tag ${t.cls}">${t.text}</span>
              <span class="v-count">巩固 ${v.count} 次</span>
            </div>
          </div>`;
        }).join('');
      },

      switchVocabCat(cat) {
        this.state.vocabFilter = cat;
        document.querySelectorAll('.vocab-cat').forEach(c => c.classList.remove('active'));
        document.querySelector(`.vocab-cat[data-cat="${cat}"]`).classList.add('active');
        this.renderVocabGrid();
      },

      filterVocab() {
        const query = document.getElementById('vocab-search-input').value.toLowerCase().trim();
        const grid = document.getElementById('vocab-grid');
        if (!grid) return;
        const filter = this.state.vocabFilter;
        let items = filter === 'all' ? VOCAB_LIB : VOCAB_LIB.filter(v => v.status === filter);
        if (query) {
          items = items.filter(v => v.word.includes(query) || v.meaning.includes(query));
        }
        const tagMap = {
          new: { cls: 'tag-new', text: '未学' },
          learning: { cls: 'tag-learning', text: '正在啃' },
          mastered: { cls: 'tag-mastered', text: '已消灭' }
        };
        grid.innerHTML = items.map(v => {
          const t = tagMap[v.status];
          return `<div class="vocab-card" data-status="${v.status}">
            <div class="v-word">${v.word}</div>
            <div class="v-meaning">${v.meaning}</div>
            <div class="v-meta">
              <span class="v-tag ${t.cls}">${t.text}</span>
              <span class="v-count">巩固 ${v.count} 次</span>
            </div>
          </div>`;
        }).join('');
      },

      importMistakes() {
        alert('导入错题功能：支持从相册或文件选择错题截图，AI 自动识别并加入词库');
      },

      startStudy() {
        this.state.currentIndex = 0;
        this.state.flipped = false;
        document.getElementById('page-study').classList.add('active');
        this.renderCard();
      },

      closeStudy() {
        document.getElementById('page-study').classList.remove('active');
      },

      renderCard() {
        const word = VOCAB[this.state.currentIndex];
        const progress = (this.state.currentIndex / VOCAB.length) * 100;
        document.getElementById('progress-fill').style.width = progress + '%';
        document.getElementById('progress-text').textContent = `${this.state.currentIndex}/${VOCAB.length}`;

        const card = document.getElementById('card');
        card.classList.remove('flipped');
        this.state.flipped = false;
        card.style.transform = '';
        document.getElementById('next-btn').classList.remove('visible');
        document.getElementById('rating-buttons').style.display = 'flex';

        document.getElementById('front-word').textContent = word.word;
        document.getElementById('front-pronunciation').textContent = word.pronunciation;
        document.getElementById('mouth-demo').classList.toggle('active', !!word.showMouth);

        const hintMap = { hanja: '点击卡片查看字根拆解', loan: '点击卡片查看外来语映射', native: '点击卡片查看语境例句' };
        document.getElementById('front-hint').innerHTML = hintMap[word.type] || '点击卡片查看释义';

        document.getElementById('back-word').textContent = word.word;
        document.getElementById('back-meaning').textContent = `${word.meaning} &#183; [${word.pronunciation}]`;

        const warningEl = document.getElementById('sound-warning');
        if (word.soundChange) {
          warningEl.style.display = 'flex';
          warningEl.textContent = word.soundChangeNote;
        } else {
          warningEl.style.display = 'none';
        }

        const methodBlock = document.getElementById('method-block');
        const loanBlock = document.getElementById('loan-block');
        const contextSection = document.getElementById('context-section');

        if (word.type === 'hanja') {
          methodBlock.style.display = 'block';
          loanBlock.style.display = 'none';
          document.getElementById('roots').innerHTML = word.roots.map((r, i) =>
            `<div class="root"><span class="root-kr">${r.kr}</span><span class="root-cn">${r.cn}</span></div>` +
            (i < word.roots.length - 1 ? '<div class="root-plus">+</div>' : '')
          ).join('');
          document.getElementById('mnemonic').innerHTML = word.mnemonic;
        } else if (word.type === 'loan') {
          methodBlock.style.display = 'none';
          loanBlock.style.display = 'block';
          document.getElementById('loan-mapping').innerHTML =
            `${word.word} <span class="arrow">&#10132;</span> <span class="origin">${word.loanFrom}</span>`;
        } else {
          methodBlock.style.display = 'none';
          loanBlock.style.display = 'none';
        }

        contextSection.style.display = 'block';
        document.getElementById('context-img').src = word.contextImg;
        document.getElementById('context-sentence').innerHTML = word.sentence;

        const c = Math.floor(Math.random() * 3);
        document.getElementById('consolidated').textContent = `&#127793; 已巩固 ${c} 次`;
        const days = [1, 3, 7, 15];
        document.getElementById('next-review').textContent =
          `下次复习：${days[Math.floor(Math.random() * days.length)]}天后`;
      },

      playAudio() {
        document.querySelectorAll('.speaker-btn, .back-speaker').forEach(btn => {
          btn.style.transform = 'scale(0.85)';
          setTimeout(() => btn.style.transform = '', 200);
        });
      },

      flipCard() {
        if (this.state.flipped) return;
        document.getElementById('card').classList.add('flipped');
        this.state.flipped = true;
        document.getElementById('next-btn').classList.add('visible');
        document.getElementById('rating-buttons').style.display = 'none';
      },

      handleRating(level) {
        if (level === 'known') {
          this.nextWord();
        } else {
          this.flipCard();
        }
      },

      nextWord() {
        this.animateCardExit('left', () => {
          this.state.currentIndex++;
          if (this.state.currentIndex >= VOCAB.length) {
            this.showReward();
            return;
          }
          this.renderCard();
          this.animateCardEnter();
        });
      },

      animateCardExit(direction, callback) {
        const card = document.getElementById('card');
        const x = direction === 'left' ? '-120%' : '120%';
        card.style.transition = 'transform 0.35s cubic-bezier(0.4, 0, 0.2, 1)';
        card.style.transform = `translateX(${x})${this.state.flipped ? ' rotateY(180deg)' : ''}`;
        setTimeout(callback, 350);
      },

      animateCardEnter() {
        const card = document.getElementById('card');
        const fromX = this.state.flipped ? '120% rotateY(180deg)' : '120%';
        const toX = this.state.flipped ? 'rotateY(180deg)' : '';
        card.style.transition = 'none';
        card.style.transform = `translateX(${fromX})`;
        setTimeout(() => {
          card.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
          card.style.transform = toX;
        }, 40);
      },

      showReward() {
        document.getElementById('reward-overlay').classList.add('active');
      },

      closeReward() {
        document.getElementById('reward-overlay').classList.remove('active');
        this.closeStudy();
      },

      setupSwipe() {
        const scene = document.getElementById('card-scene');
        const card = document.getElementById('card');
        const overlaySkip = document.getElementById('overlay-skip');
        const overlayFlip = document.getElementById('overlay-flip');

        const onStart = (x) => {
          this.state.isDragging = true;
          this.state.startX = x;
          this.state.currentX = 0;
          card.style.transition = 'none';
        };

        const onMove = (x) => {
          if (!this.state.isDragging) return;
          const dx = x - this.state.startX;
          this.state.currentX = dx;
          const rotate = dx * 0.04;
          const base = this.state.flipped ? 'rotateY(180deg)' : '';
          card.style.transform = `translateX(${dx}px) rotate(${rotate}deg) ${base}`;

          if (dx > 50) {
            overlaySkip.style.opacity = Math.min((dx - 50) / 80, 0.95);
            overlayFlip.style.opacity = 0;
          } else if (dx < -50) {
            overlayFlip.style.opacity = Math.min((-dx - 50) / 80, 0.95);
            overlaySkip.style.opacity = 0;
          } else {
            overlaySkip.style.opacity = 0;
            overlayFlip.style.opacity = 0;
          }
        };

        const onEnd = () => {
          if (!this.state.isDragging) return;
          this.state.isDragging = false;
          const dx = this.state.currentX;
          const base = this.state.flipped ? 'rotateY(180deg)' : '';
          overlaySkip.style.opacity = 0;
          overlayFlip.style.opacity = 0;

          if (dx > 100) {
            card.style.transition = 'transform 0.35s ease';
            card.style.transform = `translateX(150%) ${base}`;
            setTimeout(() => {
              this.state.currentIndex++;
              if (this.state.currentIndex >= VOCAB.length) {
                this.showReward();
                return;
              }
              this.renderCard();
              card.style.transition = 'none';
              card.style.transform = `translateX(-150%) ${base}`;
              setTimeout(() => {
                card.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                card.style.transform = base;
              }, 40);
            }, 350);
          } else if (dx < -100) {
            card.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
            if (!this.state.flipped) this.flipCard();
            else card.style.transform = base;
          } else {
            card.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
            card.style.transform = base;
          }
          this.state.currentX = 0;
        };

        scene.addEventListener('mousedown', e => onStart(e.clientX));
        scene.addEventListener('mousemove', e => onMove(e.clientX));
        scene.addEventListener('mouseup', onEnd);
        scene.addEventListener('mouseleave', onEnd);
        scene.addEventListener('touchstart', e => onStart(e.touches[0].clientX), { passive: true });
        scene.addEventListener('touchmove', e => onMove(e.touches[0].clientX), { passive: true });
        scene.addEventListener('touchend', onEnd);

        card.addEventListener('click', (e) => {
          if (!this.state.isDragging && Math.abs(this.state.currentX) < 5) {
            this.flipCard();
          }
        });
      }
    };

    app.init();
  </script>
</body>
</html>
