<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D破坏城市模拟器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:'Microsoft YaHei',sans-serif;background:#000}
#loading{position:fixed;top:0;left:0;width:100%;height:100%;background:#111;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:999;color:#fff;font-size:24px}
#loading .bar{width:300px;height:6px;background:#333;border-radius:3px;margin-top:20px;overflow:hidden}
#loading .bar-fill{width:0;height:100%;background:#ff4444;transition:width .3s}
#hud{position:fixed;top:20px;left:20px;z-index:100;pointer-events:none}
.hud-item{background:rgba(0,0,0,0.7);color:#fff;padding:8px 16px;border-radius:6px;margin-bottom:8px;font-size:16px;border-left:4px solid #ff4444}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;z-index:100;pointer-events:none}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,0.8)}
#crosshair::before{width:2px;height:100%;left:50%;transform:translateX(-50%)}
#crosshair::after{width:100%;height:2px;top:50%;transform:translateY(-50%)}
#weaponPanel{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:12px;background:rgba(0,0,0,0.8);padding:12px 20px;border-radius:12px}
.weapon-btn{padding:10px 20px;border:2px solid #555;background:rgba(255,255,255,0.05);color:#aaa;border-radius:8px;cursor:pointer;font-size:16px;transition:all .2s;white-space:nowrap}
.weapon-btn.active{border-color:#ff4444;color:#ff4444;background:rgba(255,68,68,0.15);box-shadow:0 0 15px rgba(255,68,68,0.3)}
.weapon-btn:hover{border-color:#ff6666;color:#ff6666}
#instructions{position:fixed;top:20px;right:20px;z-index:100;background:rgba(0,0,0,0.7);color:#ccc;padding:12px 18px;border-radius:8px;font-size:13px;line-height:1.8}
#instructions span{color:#ff4444;font-weight:bold}
#damagePopup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);color:#ff0;font-size:48px;font-weight:bold;z-index:200;pointer-events:none;transition:transform .1s;text-shadow:0 0 20px #f00}
#damagePopup.show{transform:translate(-50%,-50%) scale(1);animation:popAnim .6s ease-out forwards}
@keyframes popAnim{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1.5)}}
</style>
</head>
<body>

<div id="loading">
    <div>加载中...</div>
    <div class="bar"><div class="bar-fill" id="loadBar"></div></div>
</div>

<div id="hud">
    <div class="hud-item">🏚️ 破坏建筑: <span id="buildingsDestroyed">0</span>/<span id="totalBuildings">0</span></div>
    <div class="hud-item">💥 破坏分数: <span id="destructionScore">0</span></div>
    <div class="hud-item">🛡️ 玩家生命: <span id="playerHealth">100</span></div>
</div>

<div id="crosshair"></div>

<div id="weaponPanel">
    <button class="weapon-btn active" data-weapon="fist" onclick="switchWeapon('fist')">👊 拳头</button>
    <button class="weapon-btn" data-weapon="gun" onclick="switchWeapon('gun')">🔫 步枪</button>
    <button class="weapon-btn" data-weapon="knife" onclick="switchWeapon('knife')">🔪 砍刀</button>
    <button class="weapon-btn" data-weapon="rpg" onclick="switchWeapon('rpg')">🚀 RPG</button>
    <button class="weapon-btn" data-weapon="car" onclick="switchWeapon('car')">🚗 开车</button>
</div>

<div id="instructions">
    <span>WASD</span> 移动 &nbsp; <span>鼠标</span> 视角<br>
    <span>空格</span> 跳跃 &nbsp; <span>Shift</span> 奔跑<br>
    <span>左键</span> 攻击 &nbsp; <span>1-5</span> 切换武器<br>
    <span>R</span> 修复车辆 &nbsp; <span>F</span> 下车
</div>

<div id="damagePopup"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ============ 核心系统 ============
let scene, camera, renderer, clock;
let player, playerBody, playerDir = new THREE.Vector3(0,0,-1);
let keys = {};
let mouse = { x:0, y:0 };
let mouseWorldPos = new THREE.Vector3();
let raycaster = new THREE.Raycaster();
let cameraYaw = Math.PI;
let cameraPitch = 0.5;
let weapon = 'fist';
let playerHealth = 100;
let destructionScore = 0;
let buildingsDestroyed = 0;
let totalBuildings = 0;
let isOnGround = true;
let playerVelocity = new THREE.Vector3();
let car = null;
let isDriving = false;
let carSpeed = 0;
let carSteering = 0;

// 碰撞体列表
let colliders = [];
// 可破坏建筑列表
let destructibleBuildings = [];
// 子弹
let bullets = [];
// 粒子
let particles = [];
// 碎片
let debrisPieces = [];
// RPG火箭
let rockets = [];

const GRAVITY = -0.3;
const PLAYER_SPEED = 0.25;
const RUN_SPEED = 0.45;
const JUMP_FORCE = 8;
const PLAYER_RADIUS = 0.8;
const PLAYER_HEIGHT = 3;

// ============ 初始化 ============
function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0xccccdd, 100, 400);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.5, 500);
    camera.position.set(0, 20, 40);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);
    clock = new THREE.Clock();

    // 光照
    const sun = new THREE.DirectionalLight(0xffffcc, 3);
    sun.position.set(80, 120, 40);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 400;
    sun.shadow.camera.left = -100;
    sun.shadow.camera.right = 100;
    sun.shadow.camera.top = 100;
    sun.shadow.camera.bottom = -100;
    scene.add(sun);

    const ambient = new THREE.AmbientLight(0x6688cc, 0.6);
    scene.add(ambient);
    const hemi = new THREE.HemisphereLight(0x87CEEB, 0x444444, 0.5);
    scene.add(hemi);

    createGround();
    createCity();
    createPlayer();
    createCar();

    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup', onKeyUp);
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('resize', onResize);

    // 攻击绑定在mousedown上（避免和pointerLock冲突）
    document.addEventListener('mousedown', (e) => {
        if (e.button === 0 && document.pointerLockElement === renderer.domElement) {
            attack();
        }
    });

    // PointerLock: 点击canvas锁定鼠标（忽略UI按钮点击）
    renderer.domElement.addEventListener('click', (e) => {
        if (e.target === renderer.domElement && !isDriving) {
            renderer.domElement.requestPointerLock();
        }
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('totalBuildings').textContent = totalBuildings;

    gameLoop();
}

// ============ 地面 ============
function createGround() {
    const geo = new THREE.PlaneGeometry(400, 400);
    const mat = new THREE.MeshStandardMaterial({ color: 0x3d3d3d, roughness: 0.9 });
    const ground = new THREE.Mesh(geo, mat);
    ground.rotation.x = -Math.PI/2;
    ground.position.y = -0.05;
    ground.receiveShadow = true;
    scene.add(ground);

    // 不可见碰撞地面
    const colliderGeo = new THREE.BoxGeometry(400, 0.1, 400);
    const colliderMesh = new THREE.Mesh(colliderGeo, new THREE.MeshBasicMaterial({ visible: false }));
    colliderMesh.position.y = -0.1;
    colliderMesh.userData.isGround = true;
    colliderMesh.userData.destructible = false;
    scene.add(colliderMesh);
    colliders.push(colliderMesh);

    // 道路网格
    createRoads();
}

function createRoads() {
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.7 });
    // 横向道路
    for (let z = -120; z <= 120; z += 30) {
        const road = new THREE.Mesh(new THREE.PlaneGeometry(400, 8), roadMat);
        road.rotation.x = -Math.PI/2;
        road.position.set(0, 0.02, z);
        road.receiveShadow = true;
        scene.add(road);

        // 道路标线
        const line = new THREE.Mesh(new THREE.PlaneGeometry(380, 0.3), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
        line.rotation.x = -Math.PI/2;
        line.position.set(0, 0.03, z);
        scene.add(line);
    }
    // 纵向道路
    for (let x = -120; x <= 120; x += 30) {
        const road = new THREE.Mesh(new THREE.PlaneGeometry(8, 400), roadMat);
        road.rotation.x = -Math.PI/2;
        road.position.set(x, 0.02, 0);
        road.receiveShadow = true;
        scene.add(road);
        const line = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 380), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
        line.rotation.x = -Math.PI/2;
        line.position.set(x, 0.03, 0);
        scene.add(line);
    }
}

// ============ 城市建筑 ============
function createCity() {
    const buildingColors = [0x8899aa, 0x99aabb, 0xaabbcc, 0x778899, 0x8a9baa, 0x9ab0c0, 0xbbc0c8, 0x8090a0];
    const windowMat = new THREE.MeshStandardMaterial({ color: 0xffffcc, emissive: 0x333300, emissiveIntensity: 0.3 });

    // 生成街区建筑
    const blockSize = 30;
    for (let bx = -4; bx <= 4; bx++) {
        for (let bz = -4; bz <= 4; bz++) {
            if (bx === 0 && bz === 0) continue; // 中心留给玩家
            const cx = bx * blockSize + (Math.random()-0.5)*10;
            const cz = bz * blockSize + (Math.random()-0.5)*10;
            const w = 3 + Math.random() * 8;
            const d = 3 + Math.random() * 8;
            const h = 5 + Math.random() * 40;
            createBuilding(cx, cz, w, d, h, buildingColors[Math.floor(Math.random()*buildingColors.length)], windowMat);
        }
    }

    // 一些摩天大楼
    for (let i = 0; i < 8; i++) {
        const cx = (Math.random()-0.5)*200;
        const cz = (Math.random()-0.5)*200;
        // 不和其他建筑重叠
        let tooClose = false;
        for (const b of destructibleBuildings) {
            if (Math.abs(cx - b.position.x) < 10 && Math.abs(cz - b.position.z) < 10) {
                tooClose = true;
                break;
            }
        }
        if (!tooClose) {
            createBuilding(cx, cz, 6+Math.random()*8, 6+Math.random()*8, 40+Math.random()*60, 0x667788, windowMat);
        }
    }
}

function createBuilding(x, z, w, d, h, color, windowMat) {
    const building = new THREE.Group();

    // 主体
    const bodyGeo = new THREE.BoxGeometry(w, h, d);
    const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.3 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = h/2;
    body.castShadow = true;
    body.receiveShadow = true;
    building.add(body);

    // 窗户
    const windowGeo = new THREE.PlaneGeometry(0.8, 1.2);
    const floors = Math.floor(h / 3);
    const windowsPerSide = Math.floor(w / 2.5);
    for (let f = 0; f < floors; f++) {
        for (let wi = 0; wi < windowsPerSide; wi++) {
            const wx = -w/2 + 1.2 + wi * 2.5;
            const wy = 1.5 + f * 3;
            if (wx < w/2 - 0.5) {
                const winFront = new THREE.Mesh(windowGeo, windowMat);
                winFront.position.set(wx, wy, d/2 + 0.01);
                building.add(winFront);
                const winBack = new THREE.Mesh(windowGeo, windowMat);
                winBack.position.set(wx, wy, -d/2 - 0.01);
                winBack.rotation.y = Math.PI;
                building.add(winBack);
            }
        }
        const windowsPerDepth = Math.floor(d / 2.5);
        for (let wi = 0; wi < windowsPerDepth; wi++) {
            const wz = -d/2 + 1.2 + wi * 2.5;
            const wy = 1.5 + f * 3;
            if (wz < d/2 - 0.5) {
                const winLeft = new THREE.Mesh(windowGeo, windowMat);
                winLeft.position.set(-w/2 - 0.01, wy, wz);
                winLeft.rotation.y = -Math.PI/2;
                building.add(winLeft);
                const winRight = new THREE.Mesh(windowGeo, windowMat);
                winRight.position.set(w/2 + 0.01, wy, wz);
                winRight.rotation.y = Math.PI/2;
                building.add(winRight);
            }
        }
    }

    // 屋顶
    const roofGeo = new THREE.BoxGeometry(w + 1, 0.5, d + 1);
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.6 });
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.position.y = h + 0.25;
    roof.castShadow = true;
    building.add(roof);

    building.position.set(x, 0, z);
    building.userData.health = h * 2;
    building.userData.maxHealth = h * 2;
    building.userData.width = w;
    building.userData.depth = d;
    building.userData.height = h;
    building.userData.destructible = true;
    building.userData.isBuilding = true;

    // 碰撞体
    const collider = new THREE.Mesh(
        new THREE.BoxGeometry(w + 0.5, h, d + 0.5),
        new THREE.MeshBasicMaterial({ visible: false })
    );
    collider.position.copy(building.position);
    collider.position.y = h/2;
    collider.userData.building = building;
    collider.userData.destructible = true;
    collider.userData.isCollider = true;
    scene.add(collider);
    colliders.push(collider);

    scene.add(building);
    destructibleBuildings.push(building);
    totalBuildings++;
}

// ============ 玩家 ============
function createPlayer() {
    player = new THREE.Group();

    // 身体
    const bodyGeo = new THREE.CapsuleGeometry(0.4, 1.2, 4, 8);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3366cc, roughness: 0.5 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.2;
    body.castShadow = true;
    player.add(body);

    // 头
    const headGeo = new THREE.SphereGeometry(0.35, 8, 8);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 2.3;
    head.castShadow = true;
    player.add(head);

    // 手臂（拳头）
    const armGeo = new THREE.CylinderGeometry(0.12, 0.12, 1, 6);
    const armMat = new THREE.MeshStandardMaterial({ color: 0x3366cc });
    const arm = new THREE.Mesh(armGeo, armMat);
    arm.position.set(0.5, 1.8, -0.3);
    arm.rotation.z = 0.5;
    arm.castShadow = true;
    arm.userData.isArm = true;
    player.add(arm);

    // 当前手持武器模型
    player.userData.weaponModel = arm;

    player.position.set(0, PLAYER_HEIGHT/2 + 0.1, 0);
    player.castShadow = true;
    scene.add(player);

    // 玩家碰撞体
    playerBody = new THREE.Mesh(
        new THREE.CylinderGeometry(PLAYER_RADIUS, PLAYER_RADIUS, PLAYER_HEIGHT, 8),
        new THREE.MeshBasicMaterial({ visible: false })
    );
    playerBody.position.set(0, PLAYER_HEIGHT/2, 0);
    playerBody.userData.isPlayer = true;
    playerBody.userData.destructible = false;
    scene.add(playerBody);
    colliders.push(playerBody);
}

// ============ 车辆 ============
function createCar() {
    car = new THREE.Group();

    // 车身
    const carBodyGeo = new THREE.BoxGeometry(2.5, 1, 5);
    const carBodyMat = new THREE.MeshStandardMaterial({ color: 0xff2222, roughness: 0.3, metalness: 0.6 });
    const carBody = new THREE.Mesh(carBodyGeo, carBodyMat);
    carBody.position.y = 0.8;
    carBody.castShadow = true;
    car.add(carBody);

    // 驾驶舱
    const cabinGeo = new THREE.BoxGeometry(2.2, 0.6, 2.5);
    const cabinMat = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.2, metalness: 0.8, transparent: true, opacity: 0.7 });
    const cabin = new THREE.Mesh(cabinGeo, cabinMat);
    cabin.position.set(0, 1.5, -0.2);
    car.add(cabin);

    // 车轮
    const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
    const wheelPositions = [[-1.5, 0.5, 1.8], [1.5, 0.5, 1.8], [-1.5, 0.5, -1.8], [1.5, 0.5, -1.8]];
    wheelPositions.forEach(([wx, wy, wz]) => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.rotation.z = Math.PI/2;
        wheel.position.set(wx, wy, wz);
        wheel.castShadow = true;
        car.add(wheel);
    });

    // 保险杠
    const bumperGeo = new THREE.BoxGeometry(2.8, 0.3, 0.4);
    const bumperMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, metalness: 0.5 });
    const frontBumper = new THREE.Mesh(bumperGeo, bumperMat);
    frontBumper.position.set(0, 0.5, 2.6);
    car.add(frontBumper);
    const rearBumper = new THREE.Mesh(bumperGeo, bumperMat);
    rearBumper.position.set(0, 0.5, -2.6);
    car.add(rearBumper);

    car.position.set(15, 0.5, 15);
    car.rotation.y = 0;
    car.visible = false;
    scene.add(car);

    // 车辆碰撞体
    car.userData.collider = new THREE.Mesh(
        new THREE.BoxGeometry(3, 1.5, 5.5),
        new THREE.MeshBasicMaterial({ visible: false })
    );
    car.userData.collider.position.copy(car.position);
    car.userData.collider.position.y = 1;
    car.userData.collider.userData.isCar = true;
    car.userData.collider.userData.car = car;
    car.userData.collider.userData.destructible = false;
    scene.add(car.userData.collider);
    colliders.push(car.userData.collider);
}

// ============ 武器系统 ============
function switchWeapon(w) {
    weapon = w;
    document.querySelectorAll('.weapon-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-weapon="${w}"]`).classList.add('active');

    // 更新手臂模型
    const arm = player.userData.weaponModel;
    if (arm) arm.visible = weapon !== 'gun' && weapon !== 'rpg';

    if (weapon === 'car') {
        enterCar();
    } else if (isDriving) {
        exitCar();
    }

    // 更新HUD
    const weaponNames = { fist:'👊 拳头', gun:'🔫 步枪', knife:'🔪 砍刀', rpg:'🚀 RPG', car:'🚗 开车' };
    updateWeaponHUD(weaponNames[w]);
}

function updateWeaponHUD(name) {
    let el = document.getElementById('weaponName');
    if (!el) {
        el = document.createElement('div');
        el.id = 'weaponName';
        el.className = 'hud-item';
        el.style.cssText = 'border-left-color:#ffaa00';
        document.getElementById('hud').appendChild(el);
    }
    el.textContent = '🔧 当前武器: ' + name;
}

function attack() {
    if (isDriving) {
        // 车辆撞击
        car.userData.boosting = true;
        setTimeout(() => { if (car) car.userData.boosting = false; }, 300);
        return;
    }

    if (weapon === 'fist' || weapon === 'knife') {
        meleeAttack();
    } else if (weapon === 'gun') {
        shootBullet();
    } else if (weapon === 'rpg') {
        shootRocket();
    }
}

function meleeAttack() {
    // 动画
    const arm = player.userData.weaponModel;
    if (arm) {
        arm.rotation.z = -1.2;
        setTimeout(() => { if (arm) arm.rotation.z = 0.5; }, 150);
    }

    // 射线检测前方
    raycaster.set(player.position, playerDir);
    const hits = raycaster.intersectObjects(scene.children, true);

    for (const hit of hits) {
        if (hit.distance > 4) break;
        let obj = hit.object;
        while (obj) {
            if (obj.userData.destructible && obj.userData.isBuilding) {
                const dmg = weapon === 'knife' ? 8 : 3;
                damageBuilding(obj, dmg, hit.point);
                break;
            }
            obj = obj.parent;
        }
    }
}

function shootBullet() {
    // 枪口闪光
    createMuzzleFlash();

    const bullet = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 4, 4),
        new THREE.MeshBasicMaterial({ color: 0xffff00 })
    );
    bullet.position.copy(player.position);
    bullet.position.y += 1.8;
    bullet.position.add(playerDir.clone().multiplyScalar(2));
    bullet.userData.velocity = playerDir.clone().multiplyScalar(3);
    bullet.userData.life = 60;
    bullet.userData.damage = 5;
    scene.add(bullet);
    bullets.push(bullet);

    // 弹道轨迹
    const trail = new THREE.Mesh(
        new THREE.CylinderGeometry(0.02, 0.02, 0.5, 4),
        new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.6 })
    );
    trail.position.copy(bullet.position);
    trail.rotation.x = Math.PI/2;
    trail.userData.life = 5;
    scene.add(trail);
    bullet.userData.trail = trail;
}

function shootRocket() {
    createMuzzleFlash();

    const rocket = new THREE.Group();

    const bodyGeo = new THREE.CylinderGeometry(0.15, 0.15, 1.2, 8);
    const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.3 }));
    body.rotation.x = Math.PI/2;
    rocket.add(body);

    const head = new THREE.Mesh(
        new THREE.ConeGeometry(0.15, 0.4, 8),
        new THREE.MeshStandardMaterial({ color: 0xff0000 })
    );
    head.rotation.x = -Math.PI/2;
    head.position.z = 0.7;
    rocket.add(head);

    // 尾焰
    const flame = new THREE.Mesh(
        new THREE.ConeGeometry(0.12, 0.6, 6),
        new THREE.MeshBasicMaterial({ color: 0xff6600 })
    );
    flame.rotation.x = Math.PI/2;
    flame.position.z = -0.8;
    rocket.add(flame);

    rocket.position.copy(player.position);
    rocket.position.y += 1.5;
    rocket.position.add(playerDir.clone().multiplyScalar(2));
    rocket.userData.velocity = playerDir.clone().multiplyScalar(1.5);
    rocket.userData.life = 200;
    rocket.userData.damage = 40;
    rocket.userData.explosionRadius = 8;

    // 让火箭朝飞行方向
    rocket.lookAt(rocket.position.clone().add(rocket.userData.velocity));

    scene.add(rocket);
    rockets.push(rocket);
}

function createMuzzleFlash() {
    const flash = new THREE.PointLight(0xffaa00, 5, 8);
    const pos = player.position.clone();
    pos.y += 1.8;
    pos.add(playerDir.clone().multiplyScalar(2));
    flash.position.copy(pos);
    scene.add(flash);
    setTimeout(() => scene.remove(flash), 60);
}

// ============ 车辆系统 ============
function enterCar() {
    if (isDriving) return;
    const dist = player.position.distanceTo(car.position);
    if (dist > 8) {
        showPopup('太远了!');
        return;
    }
    isDriving = true;
    car.visible = true;
    player.visible = false;
    playerBody.visible = false;
    carSpeed = 0;
    carSteering = 0;
    updateWeaponHUD('🚗 开车中');
}

function exitCar() {
    if (!isDriving) return;
    isDriving = false;
    player.position.copy(car.position);
    player.position.x += 3;
    player.position.z += 3;
    player.position.y = 2;
    player.visible = true;
    playerBody.visible = true;
    playerVelocity.set(0, 0, 0);
    carSpeed = 0;
    carSteering = 0;
    switchWeapon('fist');
}

// ============ 破坏系统 ============
function damageBuilding(building, damage, hitPoint) {
    if (!building || !building.userData.destructible) return;

    building.userData.health -= damage;

    // 创建碎片粒子
    spawnDebris(hitPoint || building.position, building.userData.width, building.userData.height, building.userData.depth);

    // 更新建筑外观（变色表示损坏）
    building.children.forEach(child => {
        if (child.material && child.material.color && child.material.emissive) {
            const ratio = building.userData.health / building.userData.maxHealth;
            child.material.emissive = new THREE.Color(0x330000).multiplyScalar(1 - ratio);
            child.material.emissiveIntensity = (1 - ratio) * 0.5;
        }
    });

    // 建筑倒塌
    if (building.userData.health <= 0) {
        destroyBuilding(building);
    }
}

function destroyBuilding(building) {
    // 大爆炸
    createExplosion(building.position.clone().add(new THREE.Vector3(0, building.userData.height/2, 0)), 0xff6600, 3);

    // 大量碎片
    const count = 40;
    for (let i = 0; i < count; i++) {
        const size = 0.3 + Math.random() * 1.5;
        const debris = new THREE.Mesh(
            new THREE.BoxGeometry(size, size * (0.5 + Math.random()), size),
            new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(0.08, 0.05, 0.2 + Math.random() * 0.5),
                roughness: 0.8
            })
        );
        debris.position.copy(building.position);
        debris.position.y += building.userData.height * Math.random();
        debris.position.x += (Math.random() - 0.5) * building.userData.width;
        debris.position.z += (Math.random() - 0.5) * building.userData.depth;
        debris.userData.velocity = new THREE.Vector3(
            (Math.random() - 0.5) * 3,
            Math.random() * 5 + 2,
            (Math.random() - 0.5) * 3
        );
        debris.userData.life = 120 + Math.random() * 60;
        debris.userData.rotSpeed = new THREE.Vector3(
            Math.random() * 0.3, Math.random() * 0.3, Math.random() * 0.3
        );
        debris.castShadow = true;
        scene.add(debris);
        debrisPieces.push(debris);
    }

    // 移除建筑和碰撞体
    scene.remove(building);
    destructibleBuildings = destructibleBuildings.filter(b => b !== building);

    // 移除对应碰撞体
    for (let i = colliders.length - 1; i >= 0; i--) {
        if (colliders[i].userData.building === building) {
            scene.remove(colliders[i]);
            colliders.splice(i, 1);
        }
    }

    buildingsDestroyed++;
    destructionScore += Math.floor(building.userData.maxHealth * 2);
    updateHUD();
    showPopup('💥', true);

    // 震动效果
    camera.position.y += 2;
    setTimeout(() => { camera.position.y -= 2; }, 100);
}

function createExplosion(position, color, intensity) {
    // 光
    const light = new THREE.PointLight(color, intensity * 5, 20);
    light.position.copy(position);
    scene.add(light);
    setTimeout(() => scene.remove(light), 200);

    // 粒子
    for (let i = 0; i < 20; i++) {
        const p = new THREE.Mesh(
            new THREE.SphereGeometry(0.2 + Math.random() * 0.4, 4, 4),
            new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
        );
        p.position.copy(position);
        p.userData.velocity = new THREE.Vector3(
            (Math.random() - 0.5) * 4,
            Math.random() * 4,
            (Math.random() - 0.5) * 4
        );
        p.userData.life = 1;
        particles.push(p);
        scene.add(p);
    }
}

function spawnDebris(position, w, h, d) {
    for (let i = 0; i < 8; i++) {
        const size = 0.2 + Math.random() * 0.6;
        const debris = new THREE.Mesh(
            new THREE.BoxGeometry(size, size, size),
            new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.8 })
        );
        debris.position.copy(position);
        debris.position.x += (Math.random() - 0.5) * w;
        debris.position.y += Math.random() * h * 0.5;
        debris.position.z += (Math.random() - 0.5) * d;
        debris.userData.velocity = new THREE.Vector3(
            (Math.random() - 0.5) * 2,
            Math.random() * 3,
            (Math.random() - 0.5) * 2
        );
        debris.userData.life = 60 + Math.random() * 40;
        debris.userData.rotSpeed = new THREE.Vector3(0.2, 0.2, 0.2);
        scene.add(debris);
        debrisPieces.push(debris);
    }
}

// ============ 碰撞检测 ============
function checkPlayerCollision() {
    const playerBox = new THREE.Box3().setFromObject(playerBody);

    for (const col of colliders) {
        if (col === playerBody) continue;
        if (col.userData.isPlayer || col.userData.isCar) continue;

        const colBox = new THREE.Box3().setFromObject(col);
        if (playerBox.intersectsBox(colBox)) {
            const pCenter = new THREE.Vector3();
            playerBox.getCenter(pCenter);
            const cCenter = new THREE.Vector3();
            colBox.getCenter(cCenter);
            const pushDir = pCenter.clone().sub(cCenter);
            pushDir.y = 0;

            if (pushDir.length() < 0.001) {
                pushDir.set(1, 0, 0);
            } else {
                pushDir.normalize();
            }

            player.position.x += pushDir.x * 0.5;
            player.position.z += pushDir.z * 0.5;
            playerBody.position.x = player.position.x;
            playerBody.position.z = player.position.z;
        }
    }
}

function checkCarCollision() {
    if (!isDriving || !car.userData.collider) return;
    const carBox = new THREE.Box3().setFromObject(car.userData.collider);

    for (const col of colliders) {
        if (col === car.userData.collider) continue;
        const colBox = new THREE.Box3().setFromObject(col);
        if (carBox.intersectsBox(colBox)) {
            // 碰撞到建筑
            if (col.userData.destructible && col.userData.building) {
                const building = col.userData.building;
                const dmg = carSpeed * 3 + (car.userData.boosting ? 15 : 0);
                if (dmg > 1) {
                    damageBuilding(building, dmg, car.position);
                }
                carSpeed *= 0.5;
            }

            // 推开车辆
            const cCenter = new THREE.Vector3();
            carBox.getCenter(cCenter);
            const colCenter = new THREE.Vector3();
            colBox.getCenter(colCenter);
            const pushDir = cCenter.clone().sub(colCenter).normalize();
            pushDir.y = 0;
            if (pushDir.length() < 0.001) pushDir.set(1, 0, 0);
            car.position.x += pushDir.x * 1;
            car.position.z += pushDir.z * 1;
            car.userData.collider.position.x = car.position.x;
            car.userData.collider.position.z = car.position.z;
        }
    }
}

// ============ 伤害玩家 ============
function damagePlayer(amount) {
    playerHealth -= amount;
    updateHUD();
    if (playerHealth <= 0) {
        playerHealth = 0;
        // 复活
        setTimeout(() => {
            playerHealth = 100;
            player.position.set(0, 2, 0);
            updateHUD();
            showPopup('已复活');
        }, 1500);
    }
}

// ============ HUD ============
function updateHUD() {
    document.getElementById('buildingsDestroyed').textContent = buildingsDestroyed;
    document.getElementById('destructionScore').textContent = destructionScore;
    document.getElementById('playerHealth').textContent = Math.ceil(playerHealth);
}

function showPopup(text, big = false) {
    const popup = document.getElementById('damagePopup');
    popup.textContent = text;
    popup.className = big ? 'show' : '';
    if (!big) {
        popup.classList.add('show');
    }
    setTimeout(() => popup.classList.remove('show'), big ? 100 : 600);
}

// ============ 输入处理 ============
function onKeyDown(e) {
    keys[e.code] = true;

    if (e.code === 'Digit1') switchWeapon('fist');
    if (e.code === 'Digit2') switchWeapon('gun');
    if (e.code === 'Digit3') switchWeapon('knife');
    if (e.code === 'Digit4') switchWeapon('rpg');
    if (e.code === 'Digit5') switchWeapon('car');
    if (e.code === 'KeyF') exitCar();
    if (e.code === 'KeyR' && isDriving) {
        carSpeed = 0;
        carSteering = 0;
        car.position.set(car.position.x, 0.5, car.position.z);
        showPopup('车辆已修复');
    }
    if (e.code === 'Space') e.preventDefault();
}

function onKeyUp(e) {
    keys[e.code] = false;
}

function onMouseMove(e) {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    // 鼠标控制视角旋转
    if (document.pointerLockElement === renderer.domElement) {
        cameraYaw -= e.movementX * 0.003;
        cameraPitch -= e.movementY * 0.003;
        cameraPitch = Math.max(-0.8, Math.min(1.2, cameraPitch));
    }
}

function onMouseClick(e) {
    // 已用 mousedown 替代，保留空函数防止引用错误
}

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// ============ 游戏循环 ============
function gameLoop() {
    requestAnimationFrame(gameLoop);
    const dt = Math.min(clock.getDelta(), 0.1);

    if (!isDriving) {
        updatePlayer(dt);
    } else {
        updateCar(dt);
    }

    updateBullets();
    updateRockets();
    updateParticles(dt);
    updateDebris(dt);
    checkCarCollision();

    // 更新天空颜色（基于破坏程度）
    const destructionRatio = buildingsDestroyed / Math.max(totalBuildings, 1);
    const skyColor = new THREE.Color().lerpColors(
        new THREE.Color(0x87CEEB),
        new THREE.Color(0x332211),
        destructionRatio * 0.8
    );
    scene.background = skyColor;
    scene.fog.color = skyColor;

    renderer.render(scene, camera);
}

function updatePlayer(dt) {
    // 计算移动方向
    const moveDir = new THREE.Vector3();
    const cameraDir = new THREE.Vector3();
    camera.getWorldDirection(cameraDir);
    cameraDir.y = 0;
    cameraDir.normalize();
    const cameraRight = new THREE.Vector3().crossVectors(camera.up, cameraDir).normalize();

    if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(cameraDir);
    if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(cameraDir);
    if (keys['KeyA'] || keys['ArrowLeft']) moveDir.add(cameraRight);
    if (keys['KeyD'] || keys['ArrowRight']) moveDir.sub(cameraRight);

    moveDir.normalize();
    const speed = keys['ShiftLeft'] || keys['ShiftRight'] ? RUN_SPEED : PLAYER_SPEED;

    // 应用移动
    const oldPos = player.position.clone();
    player.position.x += moveDir.x * speed;
    player.position.z += moveDir.z * speed;

    // 重力
    playerVelocity.y += GRAVITY;
    player.position.y += playerVelocity.y * dt * 30;

    // 地面检测
    if (player.position.y <= PLAYER_HEIGHT/2) {
        player.position.y = PLAYER_HEIGHT/2;
        playerVelocity.y = 0;
        isOnGround = true;
    }

    // 跳跃
    if ((keys['Space']) && isOnGround) {
        playerVelocity.y = JUMP_FORCE;
        isOnGround = false;
    }

    // 更新碰撞体
    playerBody.position.copy(player.position);
    playerBody.position.y = PLAYER_HEIGHT/2;

    // 碰撞检测
    checkPlayerCollision();

    // 第三人称相机跟随（鼠标控制旋转）
    const camDist = 15;
    const camHeight = 8;
    const targetCamPos = player.position.clone();
    targetCamPos.x += Math.sin(cameraYaw) * camDist;
    targetCamPos.y += camHeight;
    targetCamPos.z += Math.cos(cameraYaw) * camDist;
    camera.position.lerp(targetCamPos, 0.15);
    camera.lookAt(player.position.x, player.position.y + 2, player.position.z);

    // 更新玩家朝向（朝向相机前方）
    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.y = 0;
    forward.normalize();
    playerDir.copy(forward);
    if (forward.length() > 0.01) {
        player.lookAt(player.position.x + forward.x, player.position.y, player.position.z + forward.z);
    }

    // 边界检测
    player.position.x = Math.max(-190, Math.min(190, player.position.x));
    player.position.z = Math.max(-190, Math.min(190, player.position.z));
    if (player.position.y < -50) {
        player.position.set(0, 2, 0);
        playerVelocity.set(0, 0, 0);
        damagePlayer(20);
        showPopup('坠落!');
    }
}

function updateCar(dt) {
    // 加速/减速
    if (keys['KeyW'] || keys['ArrowUp']) carSpeed += 0.04;
    if (keys['KeyS'] || keys['ArrowDown']) carSpeed -= 0.04;
    if (!keys['KeyW'] && !keys['ArrowUp'] && !keys['KeyS'] && !keys['ArrowDown']) {
        carSpeed *= 0.95;
    }

    // 转向
    if (keys['KeyA'] || keys['ArrowLeft']) carSteering += 0.03;
    if (keys['KeyD'] || keys['ArrowRight']) carSteering -= 0.03;
    if (!keys['KeyA'] && !keys['ArrowLeft'] && !keys['KeyD'] && !keys['ArrowRight']) {
        carSteering *= 0.9;
    }

    // 加速时转向更灵敏
    carSteering = Math.max(-0.06, Math.min(0.06, carSteering));
    carSpeed = Math.max(-0.5, Math.min(2.5, carSpeed));

    // 应用移动
    car.rotation.y += carSteering;
    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(car.quaternion);
    car.position.x += forward.x * carSpeed;
    car.position.z += forward.z * carSpeed;
    car.position.y = 0.5;

    // 更新碰撞体
    car.userData.collider.position.copy(car.position);
    car.userData.collider.position.y = 1;
    car.userData.collider.rotation.y = car.rotation.y;

    // 相机跟随车辆
    const camTarget = car.position.clone();
    camTarget.y += 10;
    camTarget.z += 18;
    camera.position.lerp(camTarget, 0.08);
    camera.lookAt(car.position.x, car.position.y + 2, car.position.z);

    // 边界
    car.position.x = Math.max(-190, Math.min(190, car.position.x));
    car.position.z = Math.max(-190, Math.min(190, car.position.z));
}

function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.position.add(b.userData.velocity);
        b.userData.life--;

        // 更新弹道轨迹
        if (b.userData.trail) {
            b.userData.trail.position.copy(b.position);
            b.userData.trail.userData.life--;
            if (b.userData.trail.userData.life <= 0) {
                scene.remove(b.userData.trail);
                b.userData.trail = null;
            }
        }

        // 碰撞检测
        for (const col of colliders) {
            if (col.userData.isPlayer || col.userData.isCar) continue;
            const colBox = new THREE.Box3().setFromObject(col);
            if (colBox.containsPoint(b.position)) {
                if (col.userData.destructible && col.userData.building) {
                    damageBuilding(col.userData.building, b.userData.damage, b.position);
                }
                createExplosion(b.position, 0xffff00, 0.5);
                scene.remove(b);
                if (b.userData.trail) scene.remove(b.userData.trail);
                bullets.splice(i, 1);
                break;
            }
        }

        if (b.userData.life <= 0) {
            scene.remove(b);
            if (b.userData.trail) scene.remove(b.userData.trail);
            bullets.splice(i, 1);
        }
    }
}

function updateRockets() {
    for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.position.add(r.userData.velocity);
        r.userData.life--;

        // 碰撞检测
        let exploded = false;
        for (const col of colliders) {
            if (col.userData.isPlayer || col.userData.isCar) continue;
            const colBox = new THREE.Box3().setFromObject(col);
            if (colBox.containsPoint(r.position)) {
                // 范围伤害
                for (const col2 of colliders) {
                    if (col2.userData.isPlayer || col2.userData.isCar) continue;
                    if (col2.userData.destructible && col2.userData.building) {
                        const dist = r.position.distanceTo(col2.position);
                        if (dist < r.userData.explosionRadius) {
                            const dmg = r.userData.damage * (1 - dist / r.userData.explosionRadius);
                            damageBuilding(col2.userData.building, dmg, col2.position);
                        }
                    }
                }
                createExplosion(r.position, 0xff4400, 2);
                scene.remove(r);
                rockets.splice(i, 1);
                exploded = true;
                break;
            }
        }

        if (!exploded && r.userData.life <= 0) {
            createExplosion(r.position, 0xff4400, 1);
            scene.remove(r);
            rockets.splice(i, 1);
        }
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.position.add(p.userData.velocity.clone().multiplyScalar(dt * 30));
        p.userData.velocity.y += GRAVITY * dt * 30;
        p.userData.life -= dt * 2;
        p.material.opacity = Math.max(0, p.userData.life);
        p.scale.multiplyScalar(0.98);
        if (p.userData.life <= 0) {
            scene.remove(p);
            particles.splice(i, 1);
        }
    }
}

function updateDebris(dt) {
    for (let i = debrisPieces.length - 1; i >= 0; i--) {
        const d = debrisPieces[i];
        d.position.add(d.userData.velocity.clone().multiplyScalar(dt * 30));
        d.userData.velocity.y += GRAVITY * dt * 30;
        d.rotation.x += d.userData.rotSpeed.x;
        d.rotation.y += d.userData.rotSpeed.y;
        d.rotation.z += d.userData.rotSpeed.z;
        d.userData.life--;

        // 落地停止
        if (d.position.y < 0.3) {
            d.position.y = 0.3;
            d.userData.velocity.set(0, 0, 0);
            d.userData.rotSpeed.set(0, 0, 0);
        }

        if (d.userData.life <= 0) {
            scene.remove(d);
            debrisPieces.splice(i, 1);
        }
    }
}

// ============ 启动 ============
init();
console.log('🏙️ 3D破坏城市模拟器已就绪!');
console.log('💡 提示: WASD移动 | 鼠标控制视角 | 左键攻击 | 1-5切换武器');
</script>
