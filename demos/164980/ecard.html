<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电子贺卡 · 手写祝福</title>
<style>
  :root{
    --bg1:#ff9a9e; --bg2:#fecfef; --accent:#ff6b9d;
    --flap:#ff8fb3; --pocket:#ffb3c8; --card:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#5a3d4f;min-height:100vh;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed;
    transition:background .6s ease;overflow-x:hidden;}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 16px 70px;}

  .topbar{display:flex;justify-content:flex-end;gap:10px;padding:18px 0 4px;}
  .icon-btn{width:44px;height:44px;border:none;border-radius:50%;background:rgba(255,255,255,.8);
    color:var(--accent);font-size:19px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.1);
    transition:transform .2s,background .2s;display:flex;align-items:center;justify-content:center;}
  .icon-btn:hover{transform:translateY(-2px) scale(1.06);}
  .icon-btn.active{background:var(--accent);color:#fff;}

  .head{text-align:center;padding:18px 0 4px;}
  .head .kicker{letter-spacing:5px;font-size:12px;color:rgba(90,61,79,.6);text-transform:uppercase;}
  .head h1{font-size:26px;font-weight:800;margin-top:6px;}

  /* ===== 信封场景 ===== */
  .scene{position:relative;width:340px;height:240px;margin:34px auto 8px;perspective:1200px;}
  .envelope{position:relative;width:100%;height:100%;cursor:pointer;}
  .env-back{position:absolute;inset:0;background:var(--pocket);border-radius:12px;
    box-shadow:0 18px 40px rgba(0,0,0,.18);}
  .env-front{position:absolute;inset:0;background:var(--pocket);border-radius:12px;z-index:3;
    clip-path:polygon(0 32%,50% 66%,100% 32%,100% 100%,0 100%);}
  .env-flap{position:absolute;inset:0;background:var(--flap);border-radius:12px;z-index:4;
    clip-path:polygon(0 0,100% 0,50% 36%);transform-origin:top center;transition:transform .7s ease,z-index 0s .35s;}
  .seal{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;
    background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;
    z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.2);transition:opacity .3s,transform .3s;}
  .letter{position:absolute;left:18px;right:18px;top:14px;height:210px;background:var(--card);border-radius:12px;
    z-index:2;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:22px 20px;overflow:hidden;
    transition:transform .7s cubic-bezier(.2,.8,.3,1.2),z-index 0s .2s,box-shadow .4s;
    display:flex;flex-direction:column;}
  .envelope.open .env-flap{transform:rotateX(180deg);z-index:1;}
  .envelope.open .seal{opacity:0;transform:translateX(-50%) scale(.4);}
  .envelope.open .letter{transform:translateY(-176px) scale(1.04);z-index:6;box-shadow:0 26px 50px rgba(0,0,0,.28);}

  .letter .l-to{font-size:13px;color:#b08;opacity:.7;margin-bottom:6px;}
  .letter .l-title{font-size:23px;font-weight:800;color:var(--accent);margin:2px 0 10px;line-height:1.3;}
  .letter .l-msg{flex:1;font-size:15px;line-height:1.85;color:#4a3545;white-space:pre-wrap;overflow:auto;}
  .letter .l-from{text-align:right;font-size:13px;color:#907;opacity:.8;margin-top:8px;}
  .line-in{opacity:0;transform:translateY(12px);}
  .envelope.open .line-in{animation:rise .6s forwards;}
  .envelope.open .line-in:nth-child(1){animation-delay:.45s;}
  .envelope.open .line-in:nth-child(2){animation-delay:.6s;}
  .envelope.open .line-in:nth-child(3){animation-delay:.8s;}
  .envelope.open .line-in:nth-child(4){animation-delay:1s;}
  .envelope.open .line-in:nth-child(5){animation-delay:1.15s;}
  @keyframes rise{to{opacity:1;transform:translateY(0);}}

  .hint{text-align:center;color:rgba(90,61,79,.65);font-size:14px;margin-top:10px;min-height:20px;transition:opacity .3s;}
  .replay{display:block;margin:14px auto 0;padding:9px 22px;border:none;border-radius:20px;background:rgba(255,255,255,.85);
    color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.1);}

  /* ===== 设置抽屉 ===== */
  .drawer{position:fixed;top:0;right:-440px;width:440px;max-width:92vw;height:100%;background:#fff;z-index:70;
    box-shadow:-10px 0 40px rgba(0,0,0,.18);transition:right .35s ease;overflow-y:auto;padding:24px;}
  .drawer.open{right:0;}
  .drawer h3{font-size:20px;margin-bottom:18px;}
  .drawer .close-x{position:absolute;top:18px;right:18px;border:none;background:none;font-size:24px;cursor:pointer;color:#999;}
  .field{margin-bottom:15px;}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#8a6a7a;}
  .field input,.field textarea{width:100%;padding:10px 12px;border:1.5px solid #eee;border-radius:10px;
    font-size:14px;font-family:inherit;color:#5a3d4f;outline:none;transition:border .2s;}
  .field input:focus,.field textarea:focus{border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:90px;line-height:1.7;}
  .theme-pick{display:flex;flex-wrap:wrap;gap:10px;}
  .theme-pick .t{padding:8px 14px;border-radius:12px;cursor:pointer;border:2px solid transparent;font-size:13px;font-weight:700;color:#fff;}
  .theme-pick .t.sel{border-color:#333;box-shadow:0 0 0 2px #fff inset;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border:none;border-radius:12px;
    background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s;}
  .btn:hover{transform:translateY(-2px);}
  .btn.ghost{background:#f2f2f2;color:#5a3d4f;}
  .btn.block{width:100%;}
  .row{display:flex;gap:10px;}
  .divider{height:1px;background:#eee;margin:20px 0;}
  .hint-sm{font-size:12px;color:#8a6a7a;line-height:1.6;margin-top:4px;}

  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;
    padding:12px 22px;border-radius:24px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:.3s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  footer{text-align:center;margin-top:40px;color:rgba(90,61,79,.6);font-size:12px;}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="topbar">
    <button class="icon-btn" id="musicBtn" title="背景音乐">♪</button>
    <button class="icon-btn" id="shareBtn" title="复制分享链接">🔗</button>
    <button class="icon-btn" id="settingsBtn" title="编辑祝福">✎</button>
  </div>

  <div class="head">
    <div class="kicker">A HANDMADE CARD</div>
    <h1>一张会动的小卡片</h1>
  </div>

  <div class="scene">
    <div class="envelope" id="envelope">
      <div class="env-back"></div>
      <div class="letter" id="letter">
        <div class="l-to line-in" id="lTo">致：</div>
        <div class="l-title line-in" id="lTitle">标题</div>
        <div class="l-msg line-in" id="lMsg">祝福语</div>
        <div class="l-from line-in" id="lFrom">—— 你的朋友</div>
      </div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <div class="seal" id="seal">💌</div>
    </div>
  </div>
  <div class="hint" id="hint">点击信封，开启这份心意 💌</div>
  <button class="replay" id="replay" style="display:none;">↺ 重新播放</button>

  <footer>手作感电子贺卡 · 数据只存在你自己的浏览器里</footer>
</div>

<!-- 设置抽屉 -->
<div class="drawer" id="drawer">
  <button class="close-x" id="drawerClose">✕</button>
  <h3>✎ 写一张贺卡</h3>
  <div class="field">
    <label>主题</label>
    <div class="theme-pick" id="themePick"></div>
  </div>
  <div class="field">
    <label>收件人（To）</label>
    <input id="fTo" type="text" placeholder="亲爱的朋友">
  </div>
  <div class="field">
    <label>标题</label>
    <input id="fTitle" type="text" placeholder="生日快乐">
  </div>
  <div class="field">
    <label>祝福语</label>
    <textarea id="fMsg" placeholder="写下你想说的话……"></textarea>
  </div>
  <div class="field">
    <label>寄件人（From）</label>
    <input id="fFrom" type="text" placeholder="你的好友">
  </div>
  <div class="divider"></div>
  <div class="field">
    <label>背景音乐</label>
    <div class="hint-sm">默认程序生成的轻音乐（离线可用），也可填自定义音乐直链：</div>
    <input id="fMusic" type="text" placeholder=".mp3 / .ogg 直链（可选）" style="margin-top:6px;">
    <label style="margin-top:10px;display:flex;align-items:center;gap:8px;font-weight:400;color:#8a6a7a;">
      <input id="fMusicOn" type="checkbox"> 打开卡片时自动播放
    </label>
  </div>
  <div class="divider"></div>
  <button class="btn block" id="saveBtn">保存贺卡</button>
  <div class="row" style="margin-top:10px;">
    <button class="btn ghost" id="exportBtn" style="flex:1;">导出备份</button>
    <button class="btn ghost" id="importBtn" style="flex:1;">导入备份</button>
  </div>
  <input id="importFile" type="file" accept="application/json" style="display:none;">
  <div class="hint-sm" style="margin-top:14px;">小贴士：编辑后点右上角 🔗 可复制一条带内容的分享链接，发给朋友就能看到这张专属卡片（无需联网/后端）。</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 主题 ============ */
const THEMES={
  birthday:{name:"🎂 生日",bg:["#ff9a9e","#fecfef"],accent:"#ff6b9d",flap:"#ff8fb3",pocket:"#ffb3c8",emo:["🎂","🎈","🎉","✨","🎁","🍰"]},
  newyear:{name:"🧧 新年",bg:["#ff5f6d","#ffc371"],accent:"#e63946",flap:"#ff6b6b",pocket:"#ffd28a",emo:["🧧","🏮","🎆","✨","💰","🐯"]},
  love:{name:"💕 情人节",bg:["#ff758c","#ff7eb3"],accent:"#e84393",flap:"#ff7eb3",pocket:"#ff9ec4",emo:["💕","💗","🌹","💞","✨","💝"]},
  midautumn:{name:"🌕 中秋",bg:["#355c7d","#6c5b7b"],accent:"#f8b500",flap:"#5a6b9a",pocket:"#8a7ba8",emo:["🌕","🥮","✨","🏮","🌟","🍵"]},
  christmas:{name:"🎄 圣诞",bg:["#0f2027","#2c5364"],accent:"#2ecc71",flap:"#1f6e4f",pocket:"#3a8f6b",emo:["🎄","🎁","❄️","⭐","🔔","🍪"]},
  generic:{name:"💜 紫韵",bg:["#7b4397","#c471ed"],accent:"#8e2de2",flap:"#a44fd6",pocket:"#c48ee8",emo:["💜","✨","🔮","🌌","⭐","🌸"]}
};

/* ============ 状态 ============ */
const KEY="ecard_v1";
const $=s=>document.querySelector(s);
function defaultState(){return{
  theme:"generic",
  to:"亲爱的朋友",
  title:"愿好运常伴",
  msg:"愿你所求皆如愿，所行皆坦途。\n往后的日子，继续闪闪发光 ✨",
  from:"你的好友",
  music:{url:"",auto:false}
};}
function load(){
  try{const h=location.hash.slice(1); if(h){ const s=JSON.parse(decodeURIComponent(escape(atob(h)))); if(s&&s.title!==undefined) return s; }}catch(e){}
  try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.theme) return s;}catch(e){}
  return defaultState();
}
let state=load();
function save(){localStorage.setItem(KEY,JSON.stringify(state));}

/* ============ 应用主题 ============ */
function applyTheme(){
  const t=THEMES[state.theme]||THEMES.generic;
  const r=document.documentElement.style;
  r.setProperty("--bg1",t.bg[0]); r.setProperty("--bg2",t.bg[1]); r.setProperty("--accent",t.accent);
  r.setProperty("--flap",t.flap); r.setProperty("--pocket",t.pocket);
  document.body.style.background=`linear-gradient(135deg,${t.bg[0]},${t.bg[1]})`;
  buildThemePicker();
}
function buildThemePicker(){
  $("#themePick").innerHTML=Object.entries(THEMES).map(([k,t])=>
    `<div class="t ${k===state.theme?'sel':''}" data-t="${k}" style="background:linear-gradient(135deg,${t.bg[0]},${t.bg[1]});color:${t.accent}">${t.name}</div>`).join("");
  document.querySelectorAll("#themePick .t").forEach(el=>el.onclick=()=>{
    state.theme=el.dataset.t; applyTheme(); renderCard(); spawnBurst(20);
  });
}

/* ============ 渲染卡片 ============ */
function renderCard(){
  $("#lTo").textContent="致："+(state.to||"");
  $("#lTitle").textContent=state.title||"";
  $("#lMsg").textContent=state.msg||"";
  $("#lFrom").textContent="—— "+(state.from||"");
}

/* ============ 信封交互 ============ */
const env=$("#envelope");
function openCard(){
  if(env.classList.contains("open")) return;
  env.classList.add("open");
  $("#hint").textContent="希望这份心意能让你微笑 ☺";
  $("#replay").style.display="block";
  confettiBurst();
  if(state.music.auto) try{playMusic();}catch(e){}
}
function closeCard(){
  env.classList.remove("open");
  $("#hint").textContent="点击信封，开启这份心意 💌";
  $("#replay").style.display="none";
}
env.onclick=openCard;
$("#replay").onclick=()=>{ closeCard(); setTimeout(openCard,450); };

/* ============ 飘落装饰 ============ */
const canvas=$("#fx"),ctx=canvas.getContext("2d");
let parts=[];
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;} resize(); addEventListener("resize",resize);
function curEmo(){return (THEMES[state.theme]||THEMES.generic).emo;}
function spawn(n,opts){opts=opts||{}; const emo=curEmo();
  for(let i=0;i<n;i++){
    const sp=opts.up?-(3+Math.random()*4):(0.5+Math.random()*1.2);
    parts.push({x:opts.x??Math.random()*canvas.width,y:opts.y??-20,
    s:14+Math.random()*16,sp:sp,
    sw:Math.random()*2-1,rot:Math.random()*6,vr:0.02+Math.random()*0.04,
    e:emo[Math.floor(Math.random()*emo.length)],up:!!opts.up,upLife:opts.up?90:0});
  }
}
spawn(24);
function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  parts.forEach(p=>{
    if(p.up){ p.y+=p.sp; p.x+=p.sw; p.upLife--; if(p.upLife<=0||p.y< -30){ p.dead=true; } }
    else { p.y+=p.sp; p.x+=p.sw; p.rot+=p.vr; if(p.y>canvas.height+30){p.y=-20;p.x=Math.random()*canvas.width;} }
    if(!p.dead){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.font=p.s+"px serif"; ctx.fillText(p.e,0,0); ctx.restore(); }
  });
  parts=parts.filter(p=>!p.dead);
  if(parts.length<22 && !state.theme) spawn(1);
  requestAnimationFrame(loop);
}
loop();
function spawnBurst(n){ spawn(n,{up:true}); }
function confettiBurst(){
  const colors=["#ff6b9d","#ffd166","#06d6a0","#4cc9f0","#f72585","#ffb703"];
  const cx=innerWidth/2, cy=innerHeight*0.32;
  for(let i=0;i<70;i++){
    const a=Math.random()*Math.PI*2, v=4+Math.random()*7;
    parts.push({x:cx,y:cy,s:8+Math.random()*8,sp:-v,sw:Math.cos(a)*v,rot:Math.random()*6,vr:(Math.random()-.5)*.3,
      e:Math.random()>.5?colors[i%colors.length]:"🎉",up:true,upLife:80+Math.random()*40,confetti:true});
  }
}

/* ============ 设置抽屉 ============ */
$("#settingsBtn").onclick=()=>{ fillForm(); $("#drawer").classList.add("open"); };
$("#drawerClose").onclick=()=>$("#drawer").classList.remove("open");
function fillForm(){
  $("#fTo").value=state.to; $("#fTitle").value=state.title; $("#fMsg").value=state.msg;
  $("#fFrom").value=state.from; $("#fMusic").value=state.music.url||""; $("#fMusicOn").checked=!!state.music.auto;
  buildThemePicker();
}
$("#saveBtn").onclick=()=>{
  state.to=$("#fTo").value.trim(); state.title=$("#fTitle").value.trim()||"祝福";
  state.msg=$("#fMsg").value; state.from=$("#fFrom").value.trim();
  state.music={url:$("#fMusic").value.trim(),auto:$("#fMusicOn").checked};
  save(); applyTheme(); renderCard();
  if(state.music.url) setupAudioUrl(state.music.url);
  $("#drawer").classList.remove("open"); toast("已保存 ✓ 点信封看看效果");
};

/* ============ 备份 ============ */
$("#exportBtn").onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="ecard-backup.json";a.click();toast("已导出");};
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.theme)throw 0;state=s;save();applyTheme();renderCard();fillForm();toast("导入成功 ✓");}catch(err){toast("文件格式不正确");}};
  r.readAsText(f);e.target.value="";};

/* ============ 分享链接 ============ */
$("#shareBtn").onclick=()=>{
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(state))));
  const url=location.origin+location.pathname+"#"+code;
  if(navigator.clipboard){ navigator.clipboard.writeText(url).then(()=>toast("分享链接已复制 🔗"),()=>fallbackCopy(url)); }
  else fallbackCopy(url);
};
function fallbackCopy(url){ const ta=document.createElement("textarea");ta.value=url;document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");toast("分享链接已复制 🔗");}catch(e){prompt("复制此链接：",url);} document.body.removeChild(ta); }

/* ============ 背景音乐 ============ */
let audioCtx=null,musicNodes=[],customAudio=null,musicPlaying=false,masterGain=null;
function setupAudioUrl(u){ if(customAudio){customAudio.pause();customAudio=null;} if(u){customAudio=new Audio(u);customAudio.loop=true;} }
function startSynth(){ if(audioCtx)return; audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();masterGain.gain.value=0;masterGain.connect(audioCtx.destination);
  const chords=[[261.63,329.63,392],[293.66,369.99,440],[329.63,415.3,493.88],[233.08,293.66,349.23]];let ci=0;
  function chord(){const ch=chords[ci++%chords.length];ch.forEach(f=>{const o=audioCtx.createOscillator();o.type="sine";o.frequency.value=f;
    const g=audioCtx.createGain();g.gain.value=0;o.connect(g);g.connect(masterGain);const t=audioCtx.currentTime;
    g.gain.linearRampToValueAtTime(.16,t+.8);g.gain.linearRampToValueAtTime(0,t+3.2);o.start(t);o.stop(t+3.4);});}
  chord();masterGain.gain.linearRampToValueAtTime(.5,audioCtx.currentTime+1);musicNodes.push(setInterval(chord,3200));
}
function playMusic(){
  if(state.music.url&&customAudio){ customAudio.play(); musicPlaying=true; $("#musicBtn").classList.add("active"); return; }
  if(!audioCtx) startSynth(); if(audioCtx.state==="suspended")audioCtx.resume(); musicPlaying=true;
  if(masterGain) masterGain.gain.linearRampToValueAtTime(.5,audioCtx.currentTime+.3);
  $("#musicBtn").classList.add("active");
}
$("#musicBtn").onclick=()=>{
  if(state.music.url&&customAudio){ if(musicPlaying){customAudio.pause();}else{customAudio.play();} musicPlaying=!musicPlaying;
    $("#musicBtn").classList.toggle("active",musicPlaying); return; }
  if(musicPlaying){ if(masterGain)masterGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+.3); musicPlaying=false;
    $("#musicBtn").classList.remove("active"); }
  else playMusic();
};
if(state.music.url) setupAudioUrl(state.music.url);

/* ============ Toast ============ */
let tt=null; function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1800);}

/* ============ 启动 ============ */
applyTheme(); renderCard();
if(location.hash) setTimeout(openCard,400);
</script>
</body>
</html>
