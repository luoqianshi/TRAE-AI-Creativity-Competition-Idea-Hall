<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秘密花园 · 植物养护日志</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Serif SC", "PingFang SC", serif;
    background: #f5f5dc url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><path d='M30 60 Q50 20 70 60 T110 60' stroke='%23d4c4a8' stroke-width='1' fill='none' opacity='0.3'/></svg>");
    min-height: 100vh;
    padding: 30px 20px;
    color: #2e4a36;
  }
  .paper {
    max-width: 900px;
    margin: 0 auto;
    background: #fffef8;
    border-radius: 8px;
    box-shadow: 0 12px 40px rgba(46, 74, 54, 0.15);
    padding: 40px 36px;
    position: relative;
  }
  .paper::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 60px;
    width: 2px;
    background: linear-gradient(to bottom, transparent 8px, #e0e0d0 8px, #e0e0d0 9px, transparent 9px);
    background-size: 100% 30px;
  }
  .header {
    position: relative;
    padding-left: 60px;
    margin-bottom: 32px;
  }
  .header h1 {
    font-family: "Patrick Hand", "Noto Serif SC", cursive;
    font-size: 2.6rem;
    color: #2e7d32;
  }
  .header p { color: #7a9b7a; font-size: 1rem; font-style: italic; }
  .header .date-stamp {
    position: absolute;
    top: 0; right: 0;
    transform: rotate(-8deg);
    border: 2px solid #d4a574;
    color: #d4a574;
    padding: 6px 14px;
    border-radius: 6px;
    font-family: "Patrick Hand", cursive;
    font-size: 1rem;
  }
  .section {
    position: relative;
    padding-left: 60px;
    margin-bottom: 28px;
  }
  .section h2 {
    font-family: "Patrick Hand", cursive;
    font-size: 1.5rem;
    color: #1b5e20;
    margin-bottom: 16px;
    display: inline-block;
    border-bottom: 2px solid #a5d6a7;
  }
  .weather-cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  .weather-card {
    background: #fff;
    border: 2px solid #c8e6c9;
    border-radius: 16px;
    padding: 18px 10px;
    text-align: center;
    transition: transform 0.2s;
  }
  .weather-card:hover { transform: translateY(-4px); }
  .weather-card .icon { font-size: 2rem; }
  .weather-card .val { font-size: 1.3rem; color: #2e7d32; font-weight: 700; margin-top: 6px; }
  .weather-card .lab { font-size: 0.8rem; color: #81c784; margin-top: 4px; }
  .plant-journal {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px;
  }
  .plant-card {
    background: #fff;
    border-radius: 18px;
    padding: 20px;
    border: 2px solid #dcedc8;
    position: relative;
    overflow: hidden;
  }
  .plant-card::before {
    content: "";
    position: absolute;
    top: -30px; right: -30px;
    width: 90px; height: 90px;
    background: #e8f5e9;
    border-radius: 50%;
  }
  .plant-card .emoji { font-size: 3rem; position: relative; }
  .plant-card h3 { font-size: 1.2rem; color: #1b5e20; margin-bottom: 6px; position: relative; }
  .plant-card .diary { font-size: 0.85rem; color: #5a7a5a; line-height: 1.6; margin-bottom: 12px; position: relative; }
  .plant-card .care-tag {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.8rem;
    background: #e8f5e9;
    color: #2e7d32;
    position: relative;
  }
  .plant-card .care-tag.warn { background: #fff3e0; color: #e65100; }
  .plant-card .water-btn {
    position: relative;
    margin-top: 12px;
    width: 100%;
    padding: 10px;
    background: #42a5f5;
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.95rem;
  }
  .plant-card .water-btn:disabled { background: #bdbdbd; }
  .handwrite-note {
    margin-top: 24px;
    background: #fffde7;
    border: 1px solid #f0f4c3;
    border-radius: 10px;
    padding: 16px 20px;
    font-family: "Patrick Hand", cursive;
    font-size: 1.1rem;
    color: #5d4037;
    transform: rotate(-1deg);
  }
  .footer-note {
    text-align: center;
    color: #9aaa9a;
    font-size: 0.85rem;
    margin-top: 24px;
    padding-left: 60px;
  }
</style>
</head>
<body>
<div class="paper">
  <div class="header">
    <div class="date-stamp">2026.07.09</div>
    <h1>🌿 秘密花园 · 植物养护日志</h1>
    <p>记录每一株植物的生长与心事</p>
  </div>

  <div class="section">
    <h2>环境观察</h2>
    <div class="weather-cards">
      <div class="weather-card">
        <div class="icon">💧</div>
        <div class="val" id="moisture">62%</div>
        <div class="lab">土壤湿度</div>
      </div>
      <div class="weather-card">
        <div class="icon">☀️</div>
        <div class="val" id="light">850</div>
        <div class="lab">光照 lux</div>
      </div>
      <div class="weather-card">
        <div class="icon">🌡️</div>
        <div class="val" id="temp">24°C</div>
        <div class="lab">温度</div>
      </div>
      <div class="weather-card">
        <div class="icon">🔋</div>
        <div class="val">86%</div>
        <div class="lab">设备电量</div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>今日植物</h2>
    <div class="plant-journal">
      <div class="plant-card">
        <div class="emoji">🌿</div>
        <h3>绿萝 · 小绿</h3>
        <p class="diary">叶片油亮，精神很好。今天不用浇水，保持通风即可。</p>
        <span class="care-tag">健康生长</span>
        <button class="water-btn" onclick="water(this, '小绿')">浇水</button>
      </div>
      <div class="plant-card">
        <div class="emoji">🌵</div>
        <h3>仙人掌 · 刺刺</h3>
        <p class="diary">一周一次水，今天可以稍微喷一点。记得别多浇。</p>
        <span class="care-tag">健康生长</span>
        <button class="water-btn" onclick="water(this, '刺刺')">浇水</button>
      </div>
      <div class="plant-card">
        <div class="emoji">🌹</div>
        <h3>月季 · 玫瑰</h3>
        <p class="diary">土壤偏干，叶片有点耷拉，需要马上补水了。</p>
        <span class="care-tag warn">需要浇水</span>
        <button class="water-btn" onclick="water(this, '玫瑰')">立即浇水</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="handwrite-note">
      ✍️ 园丁笔记：今天玫瑰有点缺水，明早记得再看看新芽。绿萝长得最省心，适合新手养。
    </div>
  </div>

  <div class="footer-note">愿每一片叶子都被温柔对待</div>
</div>

<script>
  function updateMetrics() {
    document.getElementById('moisture').textContent = (58 + Math.floor(Math.random() * 10)) + '%';
    document.getElementById('light').textContent = 800 + Math.floor(Math.random() * 100);
    document.getElementById('temp').textContent = (22 + Math.floor(Math.random() * 4)) + '°C';
  }
  function water(btn, name) {
    btn.textContent = '已浇 💧';
    btn.disabled = true;
    alert(`${name} 喝饱水了，叶片会重新挺起来 ~`);
  }
  setInterval(updateMetrics, 3000);
</script>
</body>
</html>
