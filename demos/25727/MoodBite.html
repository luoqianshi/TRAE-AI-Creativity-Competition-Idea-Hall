<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoodBite - 用美食和音乐治愈你的心情</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
:root{--color-primary:#F5E6D3;--color-secondary:#E8956A;--color-accent:#8B4513;--color-light-brown:#D4A574;--color-text:#5D4037;--color-text-light:#8D6E63;--color-white:#FFFFFF;--color-cream:#FDF8F3;--shadow-soft:0 4px 20px rgba(139,69,19,0.1);--shadow-hover:0 8px 30px rgba(139,69,19,0.15);--radius-small:8px;--radius-medium:16px;--radius-large:24px;--transition-fast:0.2s ease;--transition-normal:0.3s ease}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--color-primary);color:var(--color-text);line-height:1.6;min-height:100vh}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 80%,rgba(232,149,106,0.1) 0,transparent 50%),radial-gradient(circle at 80% 20%,rgba(139,69,19,0.08) 0,transparent 50%),linear-gradient(135deg,rgba(253,248,243,0.8) 0,rgba(245,230,211,0.9) 100%);pointer-events:none;z-index:-1}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
header{background:linear-gradient(135deg,var(--color-accent) 0%,#6D3610 100%);padding:15px 0;box-shadow:var(--shadow-soft);position:sticky;top:0;z-index:100}
header .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.logo-icon{font-size:2rem;animation:bounce 2s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.logo-text{font-size:1.8rem;font-weight:800;color:var(--color-white);letter-spacing:-0.5px}
.logo-highlight{background:linear-gradient(135deg,#FFD700 0%,#FFA500 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.lang-switcher{position:relative}
.lang-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:20px;color:var(--color-white);font-size:0.9rem;cursor:pointer;transition:var(--transition-fast)}
.lang-btn:hover{background:rgba(255,255,255,0.25)}
.lang-icon{font-size:1.1rem}
.lang-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--color-white);border-radius:var(--radius-medium);box-shadow:var(--shadow-hover);overflow:hidden;opacity:0;visibility:hidden;transform:translateY(-10px);transition:var(--transition-fast);min-width:120px;z-index:200}
.lang-dropdown.show{opacity:1;visibility:visible;transform:translateY(0)}
.lang-option{width:100%;padding:12px 16px;border:none;background:none;color:var(--color-text);font-size:0.95rem;text-align:left;cursor:pointer;transition:var(--transition-fast)}
.lang-option:hover{background:var(--color-cream);color:var(--color-accent)}
.hero{padding:60px 0 40px}
.hero .container{max-width:800px}
.hero-slogan{text-align:center;margin-bottom:40px}
.hero-slogan p{font-size:1.1rem;color:var(--color-text-light)}
.input-section{background:var(--color-white);border-radius:var(--radius-large);padding:40px;box-shadow:var(--shadow-soft);margin-bottom:30px}
.input-section label{display:block;font-size:1.1rem;font-weight:600;color:var(--color-accent);margin-bottom:15px}
#moodInput{width:100%;min-height:120px;padding:20px;border:2px solid var(--color-light-brown);border-radius:var(--radius-medium);font-size:1.1rem;line-height:1.8;resize:vertical;transition:var(--transition-normal);background:var(--color-cream);color:var(--color-text)}
#moodInput::placeholder{color:var(--color-text-light);opacity:0.7}
#moodInput:focus{outline:none;border-color:var(--color-secondary);box-shadow:0 0 0 4px rgba(232,149,106,0.2)}
.input-actions{display:flex;gap:15px;margin-top:20px;flex-wrap:wrap}
#micBtn{width:56px;height:56px;border:none;border-radius:50%;background:var(--color-light-brown);color:var(--color-white);font-size:1.5rem;cursor:pointer;transition:var(--transition-fast);display:flex;align-items:center;justify-content:center}
#micBtn:hover{background:var(--color-secondary);transform:scale(1.05)}
#micBtn.listening{background:#e74c3c;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(231,76,60,0.4)}50%{transform:scale(1.05);box-shadow:0 0 0 15px rgba(231,76,60,0)}}
#analyzeBtn{flex:1;min-width:200px;height:56px;border:none;border-radius:var(--radius-medium);background:linear-gradient(135deg,var(--color-secondary) 0%,#d4825a 100%);color:var(--color-white);font-size:1.15rem;font-weight:600;cursor:pointer;transition:var(--transition-normal);box-shadow:0 4px 15px rgba(232,149,106,0.4)}
#analyzeBtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(232,149,106,0.5)}
#analyzeBtn:active:not(:disabled){transform:translateY(0)}
#analyzeBtn:disabled{opacity:0.6;cursor:not-allowed}
.solar-tip{margin-top:20px;padding:15px 20px;background:linear-gradient(135deg,rgba(232,149,106,0.15) 0%,rgba(139,69,19,0.1) 100%);border-radius:var(--radius-medium);display:flex;align-items:center;gap:10px;color:var(--color-accent);font-size:1rem}
.tip-icon{font-size:1.3rem}
.results{padding:40px 0 60px;display:none}
.analysis-card{background:var(--color-white);border-radius:var(--radius-large);padding:30px;box-shadow:var(--shadow-soft);margin-bottom:30px;text-align:center}
.analysis-header{display:flex;justify-content:center;gap:15px;margin-bottom:25px;flex-wrap:wrap}
.emotion-badge{padding:8px 24px;border-radius:30px;font-size:1.1rem;font-weight:600}
.emotion-badge.primary{background:linear-gradient(135deg,var(--color-secondary) 0%,#d4825a 100%);color:var(--color-white)}
.emotion-badge.secondary{background:var(--color-light-brown);color:var(--color-white)}
.analysis-wuxing{display:flex;justify-content:center;gap:40px;margin-bottom:20px;flex-wrap:wrap}
.wuxing-item{text-align:center}
.wuxing-label{display:block;font-size:0.9rem;color:var(--color-text-light);margin-bottom:5px}
.wuxing-value{font-size:1.4rem;font-weight:700;color:var(--color-accent)}
.wuxing-analysis{font-size:1.2rem;color:var(--color-secondary);margin-bottom:15px;font-weight:500}
.overall-summary{font-size:1.05rem;color:var(--color-text);line-height:1.8;padding:15px;background:var(--color-cream);border-radius:var(--radius-medium)}
.radar-section{background:var(--color-white);border-radius:var(--radius-large);padding:30px;box-shadow:var(--shadow-soft);margin-bottom:30px;text-align:center}
.radar-section h2{font-size:1.3rem;color:var(--color-accent);margin-bottom:20px}
.radar-container{max-width:400px;margin:0 auto}
.bagua-labels{position:relative;margin-top:15px;text-align:center;font-size:0.9rem;color:var(--color-text-light)}
.food-section{margin-bottom:30px}
.food-section>h2{font-size:1.5rem;color:var(--color-accent);text-align:center;margin-bottom:20px}
.food-overall-reason{text-align:center;font-size:1.1rem;color:var(--color-text);margin-bottom:25px;padding:15px 25px;background:linear-gradient(135deg,rgba(232,149,106,0.2) 0%,rgba(139,69,19,0.1) 100%);border-radius:var(--radius-medium);max-width:700px;margin:0 auto 25px}
#foodCardsContainer{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:25px}
.food-card{background:var(--color-white);border-radius:var(--radius-large);padding:25px;box-shadow:var(--shadow-soft);transition:var(--transition-normal);opacity:0;transform:translateY(20px);animation:fadeInUp 0.5s ease forwards}
.food-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-hover)}
@keyframes fadeInUp{to{opacity:1;transform:translateY(0)}}
.food-emoji{font-size:4rem;text-align:center;margin-bottom:15px}
.food-content{text-align:center}
.food-name{font-size:1.4rem;color:var(--color-accent);margin-bottom:12px;font-weight:600}
.food-tags{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.tag{padding:4px 12px;background:var(--color-cream);color:var(--color-secondary);border-radius:20px;font-size:0.85rem}
.food-reason{font-size:1rem;color:var(--color-text);line-height:1.7;margin-bottom:15px}
.ingredients-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:10px;text-align:left}
.food-section-title{font-size:1.05rem;font-weight:600;color:var(--color-accent);margin-bottom:15px;padding-bottom:8px;border-bottom:2px dashed var(--color-light-brown);text-align:left;margin-top:25px}
.ingredient-item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--color-cream);border-radius:var(--radius-small);border:1px solid var(--color-light-brown);transition:var(--transition-fast);opacity:0;transform:translateY(10px) scale(0.95);animation:ingredientFadeIn 0.5s ease forwards}
@keyframes ingredientFadeIn{to{opacity:1;transform:translateY(0) scale(1)}}
.ingredient-item:hover{background:var(--color-primary);transform:translateY(-2px) scale(1.02);box-shadow:0 2px 8px rgba(139,69,19,0.1)}
.ingredient-icon{font-size:1.3rem}
.ingredient-name{font-size:0.95rem;color:var(--color-text);font-weight:500;flex:1}
.ingredient-amount{font-size:0.85rem;color:var(--color-text-light)}
.steps-list{display:flex;flex-direction:column;gap:15px;margin-top:15px;text-align:left}
.step-item{display:flex;gap:15px;padding:15px;background:var(--color-cream);border-radius:var(--radius-medium);border-left:4px solid var(--color-secondary);opacity:0;transform:translateY(10px);animation:stepFadeIn 0.6s ease forwards;transition:var(--transition-fast)}
.step-item:hover{background:var(--color-primary);transform:translateY(-2px) translateX(2px);box-shadow:0 4px 12px rgba(139,69,19,0.12)}
@keyframes stepFadeIn{to{opacity:1;transform:translateY(0)}}
.step-circle{width:36px;height:36px;min-width:36px;border-radius:50%;background:linear-gradient(135deg,var(--color-secondary) 0%,#d4825a 100%);color:var(--color-white);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;box-shadow:0 2px 8px rgba(232,149,106,0.3)}
.step-content{flex:1;text-align:left}
.step-name{font-size:1rem;font-weight:600;color:var(--color-accent);margin-bottom:5px}
.step-desc{font-size:0.9rem;color:var(--color-text);line-height:1.6;margin-bottom:5px}
.step-time{font-size:0.85rem;color:var(--color-text-light);display:inline-block}
.food-meta{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;font-size:0.9rem;color:var(--color-text-light);margin-top:15px}
.difficulty{padding:4px 12px;background:var(--color-light-brown);color:var(--color-white);border-radius:15px}
.cook-time{padding:4px 12px;background:var(--color-cream);border-radius:15px;border:1px solid var(--color-light-brown)}
.wuxing-tag{padding:4px 12px;background:linear-gradient(135deg,var(--color-secondary) 0%,#d4825a 100%);color:var(--color-white);border-radius:15px}
.bgm-section{background:var(--color-white);border-radius:var(--radius-large);padding:30px;box-shadow:var(--shadow-soft)}
.bgm-section h2{font-size:1.5rem;color:var(--color-accent);text-align:center;margin-bottom:25px}
#bgmContainer{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%}
.bgm-header{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%}
@media(min-width:768px){.bgm-header{flex-direction:row;align-items:flex-start}}
.bgm-cover{width:150px;height:150px;border-radius:var(--radius-medium);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow-soft)}
.music-icon{font-size:4rem;opacity:0.9}
.bgm-info{flex:1;text-align:center}
@media(min-width:768px){.bgm-info{text-align:left}}
.bgm-name{font-size:1.4rem;color:var(--color-accent);margin-bottom:5px}
.bgm-artist{font-size:1rem;color:var(--color-text-light);margin-bottom:10px}
.bgm-reason{font-size:0.95rem;color:var(--color-text);line-height:1.6}
.player-controls{width:100%;max-width:400px}
.play-btn{width:60px;height:60px;border:none;border-radius:50%;background:linear-gradient(135deg,var(--color-secondary) 0%,#d4825a 100%);color:var(--color-white);font-size:1.5rem;cursor:pointer;transition:var(--transition-fast);display:flex;align-items:center;justify-content:center;margin:0 auto 15px;box-shadow:0 4px 15px rgba(232,149,106,0.4)}
.play-btn:hover{transform:scale(1.1)}
.progress-container{margin-bottom:15px}
.progress-bar{height:6px;background:var(--color-light-brown);border-radius:3px;cursor:pointer;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--color-secondary) 0%,#d4825a 100%);border-radius:3px;width:0%;transition:width 0.1s linear}
.time-display{display:flex;justify-content:space-between;font-size:0.85rem;color:var(--color-text-light);margin-top:8px}
.volume-control{display:flex;align-items:center;justify-content:center;gap:10px}
.volume-icon{font-size:1.2rem}
.volume-slider{width:100px;height:4px;-webkit-appearance:none;appearance:none;background:var(--color-light-brown);border-radius:2px;cursor:pointer}
.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--color-secondary);cursor:pointer}
.bgm-copyright{display:flex;gap:15px;flex-wrap:wrap;justify-content:center;padding:15px 20px;background:linear-gradient(135deg,rgba(232,149,106,0.1) 0%,rgba(139,69,19,0.05) 100%);border-radius:var(--radius-medium);width:100%;margin-top:10px}
.copyright-item{font-size:0.85rem;color:var(--color-text-light);display:flex;align-items:center;gap:6px}
.copyright-item:first-child{color:var(--color-accent);font-weight:500}
#loadingOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(245,230,211,0.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:1000}
.loading-spinner{width:60px;height:60px;border:4px solid var(--color-light-brown);border-top-color:var(--color-secondary);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:1.2rem;color:var(--color-accent);animation:fadeInOut 1.5s ease infinite}
@keyframes fadeInOut{0%,100%{opacity:0.6}50%{opacity:1}}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--color-accent);color:var(--color-white);padding:15px 30px;border-radius:var(--radius-medium);font-size:1rem;box-shadow:var(--shadow-hover);z-index:1001;transition:transform 0.3s ease;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
footer{background:var(--color-accent);padding:25px 0;text-align:center}
footer p{color:var(--color-cream);font-size:0.9rem;opacity:0.85}
.animate-item{opacity:0;transform:translateY(20px)}
@media(max-width:768px){header .container{flex-direction:column;text-align:center}.hero{padding:40px 0 30px}.input-section{padding:25px}.analysis-wuxing{gap:20px}.wuxing-value{font-size:1.2rem}#foodCardsContainer{grid-template-columns:1fr}.bgm-cover{width:120px;height:120px}}
@media(max-width:480px){.input-actions{flex-direction:column}#micBtn,#analyzeBtn{width:100%;border-radius:var(--radius-medium)}.food-card{padding:20px}.food-emoji{font-size:3rem}}
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1 class="logo"><span class="logo-icon">🍜</span><span class="logo-text">Mood<span class="logo-highlight">Bite</span></span></h1>
      <div class="lang-switcher">
        <button class="lang-btn" id="langBtn"><span class="lang-icon">🌐</span><span class="lang-current" id="langCurrent">中文</span></button>
        <div class="lang-dropdown" id="langDropdown">
          <button class="lang-option" data-lang="zh">中文</button>
          <button class="lang-option" data-lang="en">English</button>
          <button class="lang-option" data-lang="ja">日本語</button>
          <button class="lang-option" data-lang="ko">한국어</button>
        </div>
      </div>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="container">
        <div class="hero-slogan"><p>用美食和音乐治愈你的心情</p></div>
        <div class="input-section">
          <label for="moodInput">今天心情怎么样？</label>
          <textarea id="moodInput" placeholder="今天心情怎么样？比如：加班好累，又累又烦，想吃点安慰的食物..."></textarea>
          <div class="input-actions">
            <button id="micBtn" title="语音输入">🎤</button>
            <button id="analyzeBtn">分析我的心情</button>
          </div>
          <div id="solarTip" class="solar-tip"><span class="tip-icon">☘</span><span class="tip-text">加载中...</span></div>
        </div>
      </div>
    </section>
    <section id="results" class="results">
      <div class="container">
        <div id="analysisCard" class="analysis-card animate-item"></div>
        <div class="radar-section animate-item">
          <h2 id="radarTitle">📊 情绪雷达图</h2>
          <div class="radar-container"><canvas id="emotionRadar"></canvas></div>
          <div class="bagua-labels"><span>乾</span> <span>坤</span> <span>震</span> <span>巽</span> <span>坎</span> <span>离</span> <span>艮</span> <span>兑</span></div>
        </div>
        <div class="food-section animate-item">
          <h2 id="foodTitle">🍜 美食推荐</h2>
          <p id="foodOverallReason" class="food-overall-reason"></p>
          <div id="foodCardsContainer"></div>
        </div>
        <div class="bgm-section animate-item">
          <h2 id="bgmTitle">🎵 背景音乐推荐</h2>
          <div id="bgmContainer"></div>
        </div>
      </div>
    </section>
  </main>
  <footer><div class="container"><p id="footerText">免责声明：本应用提供的美食推荐仅供参考，不构成医疗或饮食建议。</p></div></footer>
  <div id="loadingOverlay"><div class="loading-spinner"></div><p id="loadingText" class="loading-text">正在读懂你的心情...</p></div>

function getRecommendations(emotions,wuxing,text,lang){const scores={};const lower=text.toLowerCase();for(const[name,data] of Object.entries(FOOD_DATABASE)){let score=0;for(const e of emotions){if(data.suitable.some(s=>e.includes(s)||s.includes(e)))score+=3}if(data.wuxing===wuxing.weak)score+=2;if(data.wuxing===wuxing.strong)score-=1;for(const kw of data.suitable){if(lower.includes(kw))score+=2}scores[name]=score}const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);return sorted.slice(0,3).map(([name])=>({name,...FOOD_DATABASE[name]}));}

function updateUILanguage(){const t1=TRANSLATIONS[currentLang];document.documentElement.lang=currentLang;document.title=t1.siteTitle||'MoodBite';document.getElementById('inputLabel')&&(document.getElementById('inputLabel').textContent=t('inputLabel'));document.getElementById('moodInput').placeholder=t('inputPlaceholder');document.getElementById('analyzeBtn').textContent=t('analyzeBtn');document.getElementById('radarTitle')&&(document.getElementById('radarTitle').textContent=t('radarTitle'));document.getElementById('foodTitle')&&(document.getElementById('foodTitle').textContent=t('foodTitle'));document.getElementById('bgmTitle')&&(document.getElementById('bgmTitle').textContent=t('bgmTitle'));document.getElementById('footerText').textContent=t('footer');document.getElementById('loadingText').textContent=t('loading');document.getElementById('langCurrent').textContent={zh:'中文',en:'English',ja:'日本語',ko:'한국어'}[currentLang];if(document.getElementById('solarTip')&&document.getElementById('solarTip').querySelector('.tip-text')){document.getElementById('solarTip').querySelector('.tip-text').textContent=getSolarTip(getSolarTerm(),currentLang);}}
function displayAnalysis(result,lang){const t1=TRANSLATIONS[lang];const em=t1.emotions;const map={'喜':em[0],'怒':em[1],'忧':em[2],'思':em[3],'悲':em[4],'恐':em[5],'惊':em[6],'平':em[7]};const card=document.getElementById('analysisCard');const topEmotion=result.emotions[0];card.innerHTML='<div class="analysis-header"><span class="emotion-badge primary">'+map[topEmotion]+'</span>'+(result.emotions[1]?'<span class="emotion-badge secondary">'+map[result.emotions[1]]+'</span>':'')+'</div><div class="analysis-wuxing"><div class="wuxing-item"><span class="wuxing-label">'+(lang==='zh'?'强':lang==='en'?'Strong':lang==='ja'?'強':'강')+'</span><span class="wuxing-value">'+t1.wuxingLabels[['木','火','土','金','水'].indexOf(result.wuxing.strong)]+'</span></div><div class="wuxing-item"><span class="wuxing-label">'+(lang==='zh'?'弱':lang==='en'?'Weak':lang==='ja'?'弱':'약')+'</span><span class="wuxing-value">'+t1.wuxingLabels[['木','火','土','金','水'].indexOf(result.wuxing.weak)]+'</span></div></div><p class="wuxing-analysis">'+generateOverallSummary(result.emotions,result.wuxing,lang)+'</p>';}
function displayRadar(emotionScore,lang){const t1=TRANSLATIONS[lang];const labels=['喜','怒','忧','思','悲','恐','惊','平'].map(e=>{const idx=['喜','怒','忧','思','悲','恐','惊','平'].indexOf(e);return t1.emotions[idx]||e;});const data=['喜','怒','忧','思','悲','恐','惊','平'].map(e=>emotionScore[e]||0);const ctx=document.getElementById('emotionRadar').getContext('2d');if(emotionChart){emotionChart.destroy()}emotionChart=new Chart(ctx,{type:'radar',data:{labels:labels,datasets:[{label:lang==='zh'?'情绪得分':lang==='en'?'Emotion Score':lang==='ja'?'感情スコア':'감정 점수',data:data,backgroundColor:'rgba(232,149,106,0.3)',borderColor:'rgba(139,69,19,0.8)',borderWidth:2,pointBackgroundColor:'rgba(139,69,19,1)',pointRadius:4}]},options:{responsive:true,maintainAspectRatio:true,scales:{r:{beginAtZero:true,max:Math.max(...data,5),ticks:{display:false}}},plugins:{legend:{display:false}}}});}
function displayFoodCards(foods,lang){const t1=TRANSLATIONS[lang];const container=document.getElementById('foodCardsContainer');const reason=document.getElementById('foodOverallReason');const reasons={zh:'根据你的情绪状态和五行平衡，以下美食最能帮助你调理身心：',en:'Based on your emotional state and five-element balance, these foods will help balance your mind and body:',ja:'あなたの感情状態と五行バランスに基づき、以下の料理が心身を整えるのに最適です：',ko:'당신의 감정 상태와 오행 균형에 따라, 다음 음식들이 마음과 몸을 돌보는 데 가장 적합합니다：'};reason.textContent=reasons[lang];container.innerHTML='';foods.forEach((food,idx)=>{const card=document.createElement('div');card.className='food-card animate-item';card.style.animationDelay=(idx*0.15)+'s';let ingHTML='';food.ingredients.forEach((ing,i)=>{ingHTML+='<div class="ingredient-item" style="animation-delay:'+(i*0.05)+'s"><span class="ingredient-icon">'+ing.icon+'</span><span class="ingredient-name">'+ing.name+'</span><span class="ingredient-amount">'+ing.amount+'</span></div>'});let stepsHTML='';food.steps.forEach((step,i)=>{stepsHTML+='<div class="step-item" style="animation-delay:'+(i*0.1)+'s"><div class="step-circle">'+(i+1)+'</div><div class="step-content"><div class="step-name">'+step.icon+' '+step.name+'</div><div class="step-desc">'+step.desc+'</div><div class="step-time">⏱ '+step.time+(lang==='zh'?'分钟':lang==='en'?' min':lang==='ja'?'分':' 분')+'</div></div></div>'});card.innerHTML='<div class="food-emoji">'+food.emoji+'</div><div class="food-content"><h3 class="food-name">'+food.name+'</h3><div class="food-tags">'+food.tags.map(tg=>'<span class="tag">'+tg+'</span>').join('')+'</div><p class="food-reason">'+food.reason+'</p><h4 class="food-section-title">🛒 '+t1.ingredientsTitle+'</h4><div class="ingredients-list">'+ingHTML+'</div><h4 class="food-section-title">👨‍🍳 '+t1.stepsTitle+'</h4><div class="steps-list">'+stepsHTML+'</div><div class="food-meta"><span class="difficulty">'+t1.difficultyLabel+': '+food.difficulty+'</span><span class="cook-time">⏱ '+food.cookTime+'</span><span class="wuxing-tag">'+t1.wuxingLabels[['木','火','土','金','水'].indexOf(food.wuxing)]+'</span></div></div>';container.appendChild(card);});}
function displayBGM(bgm,lang){const t1=TRANSLATIONS[lang];const container=document.getElementById('bgmContainer');container.innerHTML='<div class="bgm-header"><div class="bgm-cover"><span class="music-icon">'+bgm.emoji+'</span></div><div class="bgm-info"><h3 class="bgm-name">'+bgm.name+'</h3><p class="bgm-artist">'+bgm.artist+' · '+bgm.style+'</p><p class="bgm-reason">'+bgm.reason+'</p></div></div><div class="player-controls"><button class="play-btn" id="playBtn">▶</button><div class="progress-container"><div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div><div class="time-display"><span id="currentTime">0:00</span><span id="totalTime">3:00</span></div></div><div class="volume-control"><span class="volume-icon">🔊</span><input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="60"></div></div><div class="bgm-copyright"><span class="copyright-item">📄 '+t1.copyrightLabel+': '+bgm.copyright+'</span><span class="copyright-item">🔖 '+t1.sourceLabel+': '+bgm.source+'</span></div>';const playBtn=document.getElementById('playBtn');const volumeSlider=document.getElementById('volumeSlider');const progressBar=document.getElementById('progressBar');const progressFill=document.getElementById('progressFill');let isPlaying=false;let fakeDuration=180;let fakeTime=0;let playInterval=null;playBtn.addEventListener('click',()=>{isPlaying=!isPlaying;if(isPlaying){playBtn.textContent='⏸';playInterval=setInterval(()=>{fakeTime+=1;if(fakeTime>=fakeDuration)fakeTime=0;const pct=(fakeTime/fakeDuration)*100;progressFill.style.width=pct+'%';const mins=Math.floor(fakeTime/60);const secs=fakeTime%60;document.getElementById('currentTime').textContent=mins+':'+(secs<10?'0':'')+secs;},1000)}else{playBtn.textContent='▶';clearInterval(playInterval)}});volumeSlider.addEventListener('input',e=>{const v=e.target.value/100;volumeSlider.style.opacity=0.5+v*0.5;});progressBar.addEventListener('click',e=>{const rect=progressBar.getBoundingClientRect();const pct=(e.clientX-rect.left)/rect.width;fakeTime=Math.floor(fakeDuration*pct);progressFill.style.width=(pct*100)+'%';const mins=Math.floor(fakeTime/60);const secs=fakeTime%60;document.getElementById('currentTime').textContent=mins+':'+(secs<10?'0':'')+secs;});}
function handleAnalyze(){const input=document.getElementById('moodInput').value.trim();if(!input){alert(currentLang==='zh'?'请先输入你的心情描述':currentLang==='en'?'Please describe your mood first':currentLang==='ja'?'まず気分を入力してください':'기분을 먼저 입력해 주세요');return}document.getElementById('loadingOverlay').style.display='flex';setTimeout(()=>{const emotionScores=analyzeText(input);const emotions=getDominantEmotions(emotionScores);const wuxing=analyzeWuxingBalance(input);const wuxingInsights=getWuxingInsights(wuxing);const foods=getRecommendations(emotions,wuxingInsights,input,currentLang);const bgm=getBGMRecommendation(emotions,wuxingInsights);document.getElementById('results').style.display='block';displayAnalysis({emotions:emotions,wuxing:wuxingInsights},currentLang);displayRadar(emotionScores,currentLang);displayFoodCards(foods,currentLang);displayBGM(bgm,currentLang);document.getElementById('loadingOverlay').style.display='none';document.getElementById('results').scrollIntoView({behavior:'smooth'});},800);}
function initVoiceRecognition(){if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){const mic=document.getElementById('micBtn');mic.style.display='none';return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.continuous=false;recognition.interimResults=true;recognition.lang={zh:'zh-CN',en:'en-US',ja:'ja-JP',ko:'ko-KR'}[currentLang];recognition.onstart=()=>{isListening=true;document.getElementById('micBtn').classList.add('listening')};recognition.onresult=(event)=>{let interim='';let final='';for(let i=event.resultIndex;i<event.results.length;i++){if(event.results[i].isFinal)final+=event.results[i][0].transcript;else interim+=event.results[i][0].transcript}const input=document.getElementById('moodInput');if(interim)input.value=(final||input.value)+' '+interim;if(final){input.value=final;stopListening();setTimeout(()=>handleAnalyze(),500)}};recognition.onerror=()=>{stopListening()};recognition.onend=()=>{stopListening()};}
function stopListening(){isListening=false;if(document.getElementById('micBtn'))document.getElementById('micBtn').classList.remove('listening');if(recognition){try{recognition.stop()}catch(e){}}}
function initEvents(){document.getElementById('analyzeBtn').addEventListener('click',handleAnalyze);document.getElementById('moodInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){handleAnalyze()}});document.getElementById('micBtn').addEventListener('click',()=>{if(isListening){stopListening()}else{if(recognition){recognition.lang={zh:'zh-CN',en:'en-US',ja:'ja-JP',ko:'ko-KR'}[currentLang];try{recognition.start()}catch(e){}}}});document.getElementById('langBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('langDropdown').classList.toggle('show')});document.querySelectorAll('.lang-option').forEach(btn=>{btn.addEventListener('click',()=>{currentLang=btn.dataset.lang;document.getElementById('langDropdown').classList.remove('show');updateUILanguage();});});document.addEventListener('click',()=>{document.getElementById('langDropdown').classList.remove('show')});}
function initSolarTip(){const term=getSolarTerm();const tip=getSolarTip(term,currentLang);const solarTip=document.getElementById('solarTip');if(solarTip)solarTip.querySelector('.tip-text').textContent=tip;}
document.addEventListener('DOMContentLoaded',()=>{initVoiceRecognition();initEvents();initSolarTip();updateUILanguage();});
