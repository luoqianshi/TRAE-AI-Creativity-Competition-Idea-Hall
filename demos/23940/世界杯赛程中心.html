<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 FIFA World Cup 赛程中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --surface-2: #1a2332;
      --accent: #00d4aa;
      --accent-2: #ff3e6c;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --border: rgba(255,255,255,0.06);
      --gold: #fbbf24;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Hero */
    .hero {
      position: relative;
      height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 20%, rgba(0,212,170,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(255,62,108,0.08) 0%, transparent 50%),
        linear-gradient(180deg, rgba(10,14,26,0.3) 0%, var(--bg) 100%);
      z-index: 1;
    }
    .hero-canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem;
      max-width: 900px;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.25rem;
      border-radius: 999px;
      background: rgba(0,212,170,0.1);
      border: 1px solid rgba(0,212,170,0.2);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
    }
    .hero-badge .live-dot {
      width: 8px; height: 8px;
      background: var(--accent-2);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }
    .hero h1 {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(3rem, 8vw, 6.5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero h1 span {
      display: block;
      font-size: 0.5em;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      -webkit-text-fill-color: var(--accent);
      margin-top: 0.25rem;
    }
    .hero-sub {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--text-dim);
      max-width: 560px;
      margin: 0 auto 2.5rem;
      line-height: 1.7;
      font-weight: 300;
    }
    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 2.5rem;
      background: var(--accent);
      color: var(--bg);
      font-weight: 700;
      font-size: 1rem;
      border-radius: 999px;
      text-decoration: none;
      transition: all 0.3s ease;
      letter-spacing: 0.02em;
    }
    .hero-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0,212,170,0.3);
    }
    .hero-cta svg {
      transition: transform 0.3s ease;
    }
    .hero-cta:hover svg {
      transform: translateY(3px);
    }

    /* Section base */
    section {
      padding: 5rem 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .section-header {
      margin-bottom: 3rem;
    }
    .section-header h2 {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .section-header h2 .icon {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface-2);
      border-radius: 10px;
      color: var(--accent);
    }
    .section-header p {
      color: var(--text-dim);
      font-size: 1rem;
      margin-left: 3rem;
    }

    /* Loading */
    .loading-container {
      text-align: center;
      padding: 3rem;
    }
    .loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(0,212,170,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      color: var(--text-dim);
      font-size: 0.9rem;
    }
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--accent);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .refresh-btn:hover {
      background: var(--accent);
      color: var(--bg);
    }
    .data-source {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 0.5rem;
      opacity: 0.7;
    }

    /* Date tabs */
    .date-tabs {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 2rem;
      scrollbar-width: none;
    }
    .date-tabs::-webkit-scrollbar { display: none; }
    .date-tab {
      flex-shrink: 0;
      padding: 0.75rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-dim);
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .date-tab:hover {
      background: var(--surface-2);
      color: var(--text);
    }
    .date-tab.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 700;
    }
    .date-tab .day-label {
      font-size: 0.75rem;
      opacity: 0.8;
      display: block;
      margin-bottom: 0.15rem;
    }

    /* Match cards */
    .matches-grid {
      display: grid;
      gap: 1rem;
    }
    .match-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1.5rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .match-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .match-card:hover {
      background: var(--surface-2);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .match-card:hover::before {
      opacity: 1;
    }
    .match-card.live::before {
      opacity: 1;
      background: var(--accent-2);
    }
    .match-card.live {
      border-color: rgba(255,62,108,0.2);
    }
    .team {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .team.home { justify-content: flex-end; text-align: right; }
    .team.away { justify-content: flex-start; text-align: left; }
    .team-name {
      font-weight: 700;
      font-size: 1.1rem;
    }
    .team-flag {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
      border: 2px solid var(--border);
    }
    .match-center {
      text-align: center;
      min-width: 100px;
    }
    .match-time {
      font-family: 'Oswald', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.02em;
    }
    .match-status {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .match-status.live {
      color: var(--accent-2);
      font-weight: 700;
      animation: pulse 2s infinite;
    }
    .match-score {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
    }
    .match-odds {
      grid-column: 1 / -1;
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding-top: 0.75rem;
      margin-top: 0.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
    }
    .match-odds .odds-item {
      text-align: center;
    }
    .match-odds .odds-item .odds-label {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-bottom: 0.15rem;
    }
    .match-odds .odds-item .odds-value {
      font-weight: 700;
      color: var(--gold);
    }
    .match-meta {
      grid-column: 1 / -1;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      padding-top: 1rem;
      margin-top: 0.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .match-meta span {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    /* Group stage table */
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .group-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .group-card:hover {
      background: var(--surface-2);
      transform: translateY(-2px);
    }
    .group-header {
      padding: 1rem 1.25rem;
      background: rgba(0,212,170,0.05);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .group-header h3 {
      font-family: 'Oswald', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
    }
    .group-table {
      width: 100%;
      border-collapse: collapse;
    }
    .group-table th,
    .group-table td {
      padding: 0.65rem 1rem;
      text-align: center;
      font-size: 0.85rem;
    }
    .group-table th {
      color: var(--text-dim);
      font-weight: 500;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .group-table td:first-child {
      text-align: left;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .group-table tr:not(:last-child) td {
      border-bottom: 1px solid var(--border);
    }
    .group-table tr:hover td {
      background: rgba(255,255,255,0.02);
    }

    /* Knockout bracket */
    .knockout-section {
      max-width: 1000px;
    }
    .knockout-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
    }
    .knockout-round {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
    }
    .knockout-round h4 {
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 1rem;
      text-align: center;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .knockout-match {
      background: var(--surface-2);
      border-radius: 10px;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
    }
    .knockout-match .ko-date {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 0.35rem;
    }
    .knockout-match .ko-teams {
      font-weight: 600;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--text-dim);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      margin-top: 3rem;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .match-card {
        grid-template-columns: 1fr;
        gap: 1rem;
        text-align: center;
      }
      .team.home, .team.away {
        justify-content: center;
        text-align: center;
      }
      .match-center {
        order: -1;
      }
      .match-meta {
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .groups-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Scroll reveal */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Hero -->
  <section class="hero">
    <canvas class="hero-canvas" id="heroCanvas"></canvas>
    <div class="hero-content">
      <div class="hero-badge">
        <span class="live-dot"></span>
        正在火热进行中
      </div>
      <h1>
        2026 FIFA World Cup
        <span>美加墨世界杯</span>
      </h1>
      <p class="hero-sub">
        48支球队，12个小组，104场巅峰对决。<br />
        从6月11日到7月19日，见证足球史上最盛大的赛事。
      </p>
      <a href="#today" class="hero-cta">
        查看今日赛程
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      </a>
    </div>
  </section>

  <!-- Today's Matches -->
  <section id="today" class="reveal">
    <div class="section-header">
      <h2>
        <span class="icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </span>
        每日赛程
      </h2>
      <p>选择日期查看当天所有比赛安排 · 数据实时同步竞彩网</p>
    </div>

    <div class="date-tabs" id="dateTabs"></div>
    <div class="matches-grid" id="matchesGrid">
      <div class="loading-container">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在从竞彩网获取最新赛程数据...</div>
      </div>
    </div>
    <div class="data-source" id="dataSource"></div>
  </section>

  <!-- Group Standings -->
  <section id="groups" class="reveal">
    <div class="section-header">
      <h2>
        <span class="icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        </span>
        小组积分榜
      </h2>
      <p>12个小组实时排名情况</p>
    </div>
    <div class="groups-grid" id="groupsGrid"></div>
  </section>

  <!-- Knockout Stage -->
  <section id="knockout" class="knockout-section reveal">
    <div class="section-header">
      <h2>
        <span class="icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        </span>
        淘汰赛赛程
      </h2>
      <p>从32强到冠军之路</p>
    </div>
    <div class="knockout-grid" id="knockoutGrid"></div>
  </section>

  <footer>
    <p>2026 FIFA World Cup 美加墨世界杯 · 数据来源于竞彩网(sporttery.cn) · 仅供参考</p>
  </footer>

  <script>
    // ========================
    // Config
    // ========================
    const API_URL = 'https://webapi.sporttery.cn/gateway/uniform/football/getMatchListV1.qry?clientCode=3001';
    const WORLD_CUP_LEAGUE_ID = '72';
    const CACHE_KEY = 'wc2026_match_data';
    const CACHE_TIME_KEY = 'wc2026_cache_time';
    const CACHE_DURATION = 5 * 60 * 1000; // 5分钟缓存

    // ========================
    // Flag Map
    // ========================
    const flagMap = {
      '墨西哥': '🇲🇽', '南非': '🇿🇦', '韩国': '🇰🇷', '捷克': '🇨🇿',
      '加拿大': '🇨🇦', '波黑': '🇧🇦', '卡塔尔': '🇶🇦', '瑞士': '🇨🇭',
      '巴西': '🇧🇷', '摩洛哥': '🇲🇦', '海地': '🇭🇹', '苏格兰': '🏴󠁧󠁢󠁳󠁣󠁴󠁿',
      '美国': '🇺🇸', '巴拉圭': '🇵🇾', '澳大利亚': '🇦🇺', '土耳其': '🇹🇷',
      '德国': '🇩🇪', '库拉索': '🇨🇼', '科特迪瓦': '🇨🇮', '厄瓜多尔': '🇪🇨',
      '荷兰': '🇳🇱', '日本': '🇯🇵', '瑞典': '🇸🇪', '突尼斯': '🇹🇳',
      '比利时': '🇧🇪', '埃及': '🇪🇬', '伊朗': '🇮🇷', '新西兰': '🇳🇿',
      '西班牙': '🇪🇸', '佛得角': '🇨🇻', '沙特': '🇸🇦', '乌拉圭': '🇺🇾',
      '法国': '🇫🇷', '塞内加尔': '🇸🇳', '伊拉克': '🇮🇶', '挪威': '🇳🇴',
      '阿根廷': '🇦🇷', '阿尔及利亚': '🇩🇿', '奥地利': '🇦🇹', '约旦': '🇯🇴',
      '葡萄牙': '🇵🇹', '刚果(金)': '🇨🇩', '乌兹别克斯坦': '🇺🇿', '哥伦比亚': '🇨🇴',
      '英格兰': '🏴󠁧󠁢󠁥󠁮󠁧󠁿', '克罗地亚': '🇭🇷', '加纳': '🇬🇭', '巴拿马': '🇵🇦'
    };

    // ========================
    // State
    // ========================
    let matchesData = [];
    let currentDate = '';

    // ========================
    // API & Cache
    // ========================
    async function fetchMatchData() {
      // Check cache first
      const cached = localStorage.getItem(CACHE_KEY);
      const cachedTime = localStorage.getItem(CACHE_TIME_KEY);
      const now = Date.now();

      if (cached && cachedTime && (now - parseInt(cachedTime)) < CACHE_DURATION) {
        console.log('Using cached data');
        return JSON.parse(cached);
      }

      try {
        const response = await fetch(API_URL, {
          method: 'GET',
          headers: {
            'Accept': 'application/json',
          }
        });

        if (!response.ok) {
          throw new Error('Network response was not ok');
        }

        const data = await response.json();

        if (data.success && data.value && data.value.matchInfoList) {
          // Cache the data
          localStorage.setItem(CACHE_KEY, JSON.stringify(data));
          localStorage.setItem(CACHE_TIME_KEY, now.toString());
          return data;
        } else {
          throw new Error('Invalid data format');
        }
      } catch (error) {
        console.error('Fetch error:', error);
        // Try to use cached data even if expired
        if (cached) {
          console.log('Using expired cached data');
          return JSON.parse(cached);
        }
        throw error;
      }
    }

    function parseApiData(apiData) {
      const matches = [];
      const matchInfoList = apiData.value.matchInfoList;

      matchInfoList.forEach(day => {
        const businessDate = day.businessDate; // e.g., "2026-06-12"
        day.subMatchList.forEach(match => {
          // Filter only World Cup matches (leagueId === "72")
          if (match.leagueId !== WORLD_CUP_LEAGUE_ID) return;

          const matchDate = match.matchDate; // e.g., "2026-06-13"
          const matchTime = match.matchTime; // e.g., "03:00"
          const home = match.homeTeamAllName;
          const away = match.awayTeamAllName;

          // Determine status based on matchStatus
          let status = '未开始';
          if (match.matchStatus === 'End' || match.matchStatus === 'Closed') {
            status = '已结束';
          } else if (match.matchStatus === 'Selling') {
            status = '在售';
          } else if (match.matchStatus === 'Define') {
            status = '待定';
          }

          // Extract odds if available
          let odds = null;
          if (match.oddsList && match.oddsList.length > 0) {
            const hadOdds = match.oddsList.find(o => o.poolCode === 'HAD');
            if (hadOdds && hadOdds.h) {
              odds = {
                home: hadOdds.h,
                draw: hadOdds.d,
                away: hadOdds.a
              };
            }
          }

          // Extract stadium from remark
          let stadium = '';
          if (match.remark) {
            const matchResult = match.remark.match(/比赛将在(.+?)举行/);
            if (matchResult) {
              stadium = matchResult[1];
            }
          }

          matches.push({
            date: matchDate,
            time: matchTime,
            home: home,
            away: away,
            group: '', // API doesn't provide group info directly
            stadium: stadium,
            status: status,
            score: '-',
            odds: odds,
            matchNumStr: match.matchNumStr || ''
          });
        });
      });

      return matches;
    }

    // ========================
    // Canvas Animation
    // ========================
    function initCanvas() {
      const canvas = document.getElementById('heroCanvas');
      const ctx = canvas.getContext('2d');
      let w, h, particles = [];

      function resize() {
        w = canvas.width = canvas.offsetWidth;
        h = canvas.height = canvas.offsetHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      for (let i = 0; i < 60; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 2 + 0.5,
          dx: (Math.random() - 0.5) * 0.3,
          dy: (Math.random() - 0.5) * 0.3,
          alpha: Math.random() * 0.5 + 0.1,
        });
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => {
          p.x += p.dx;
          p.y += p.dy;
          if (p.x < 0) p.x = w;
          if (p.x > w) p.x = 0;
          if (p.y < 0) p.y = h;
          if (p.y > h) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 212, 170, ${p.alpha})`;
          ctx.fill();
        });
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(0, 212, 170, ${0.08 * (1 - dist / 120)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    }

    function initReveal() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    }
