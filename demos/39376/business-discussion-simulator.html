            <div class="roles-grid">
              ${levelRoles.map(r => `
                <div class="role-card" data-id="${r.id}" onclick="toggleRole('${r.id}')">
                  <div class="role-avatar" style="background: ${r.color}20; color: ${r.color};">${r.avatar}</div>
                  <div class="role-info">
                    <h4>${r.name}</h4>
                    <div class="role-title">${r.title}</div>
                    <div class="role-style">${r.style}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    // ==================== 交互逻辑 ====================
    function selectIndustry(id) {
      currentIndustry = industries.find(i => i.id === id);
      
      document.querySelectorAll('.industry-card').forEach(card => {
        card.classList.toggle('active', card.dataset.id === id);
      });

      // 更新步骤
      updateStep(1, true);
      updateStep(2, false);

      // 渲染场景
      renderScenarios(id);
      document.getElementById('scenarioSection').classList.add('visible');
      
      // 隐藏后续部分
      document.getElementById('rolesSection').classList.remove('visible');
      
      showToast(`已选择行业：${currentIndustry.name}`);
      
      // 滚动到场景选择
      document.getElementById('scenarioSection').scrollIntoView({ behavior: 'smooth' });
    }

    function selectScenario(id) {
      currentScenario = scenarios[currentIndustry.id].find(s => s.id === id);
      
      document.querySelectorAll('.scenario-card').forEach(card => {
        card.classList.toggle('active', card.dataset.id === id);
      });

      // 更新步骤
      updateStep(2, true);
      updateStep(3, false);

      // 渲染角色
      renderRoles();
      document.getElementById('rolesSection').classList.add('visible');
      
      showToast(`已选择场景：${currentScenario.title}`);
      
      // 滚动到角色选择
      document.getElementById('rolesSection').scrollIntoView({ behavior: 'smooth' });
    }

    function updateStep(stepNum, completed) {
      const step = document.getElementById(`step${stepNum}`);
      if (completed) {
        step.classList.add('completed');
        step.classList.remove('active');
      } else {
        step.classList.add('active');
        step.classList.remove('completed');
      }
      
      // 下一步激活
      if (stepNum < 4) {
        const nextStep = document.getElementById(`step${stepNum + 1}`);
        if (!completed) {
          nextStep.classList.add('active');
        }
      }
    }

    function toggleRole(id) {
      const index = selectedRoles.indexOf(id);
      if (index > -1) {
        selectedRoles.splice(index, 1);
      } else {
        if (selectedRoles.length >= 6) {
          showToast('最多选择6个角色');
          return;
        }
        selectedRoles.push(id);
      }

      document.querySelectorAll('.role-card').forEach(card => {
        card.classList.toggle('selected', selectedRoles.includes(card.dataset.id));
      });

      updateStartButton();
    }

    function updateStartButton() {
      const btn = document.getElementById('startBtn');
      btn.disabled = selectedRoles.length < 2;
    }

    function startDiscussion() {
      if (!currentScenario || selectedRoles.length < 2) {
        showToast('请至少选择2个角色');
        return;
      }

      // 更新步骤
      updateStep(3, true);
      document.getElementById('step4').classList.add('active');

      isDiscussionActive = true;
      discussionMessages = [];
      currentDecisionIndex = 0;

      // 显示讨论区域
      document.getElementById('discussionSection').classList.add('visible');
      document.getElementById('userInputSection').classList.add('visible');
      document.getElementById('progressBar').style.display = 'block';
      document.getElementById('statsSection').classList.add('visible');

      // 添加开场白
      const roleNames = selectedRoles.map(id => roles.find(r => r.id === id).name).join('、');
      addMessage('system', '系统', '🔔', '#94a3b8', 
        `欢迎进入「${currentIndustry.name} - ${currentScenario.title}」讨论场景。\n\n${currentScenario.context}\n\n参与讨论的角色：${roleNames}\n\n每个角色将基于自身立场和策略发表观点。`,
        '', ''
      );

      // 开始模拟讨论
      simulateDiscussion();
      updateStats();
    }

    function simulateDiscussion() {
      let messageIndex = 0;
      const maxMessages = 14;
      const shuffledRoles = [...selectedRoles].sort(() => Math.random() - 0.5);

      function sendNextMessage() {
        if (!isDiscussionActive || messageIndex >= maxMessages) {
          showDecision();
          return;
        }

        const roleId = shuffledRoles[messageIndex % shuffledRoles.length];
        const role = roles.find(r => r.id === roleId);
        const message = generateMessage(role);
        
        addMessage(roleId, role.name, role.avatar, role.color, message.text, message.strategy, message.opinion);
        
        // 更新进度
        const progress = ((messageIndex + 1) / maxMessages) * 100;
        document.getElementById('progressFill').style.width = `${progress}%`;

        messageIndex++;
        
        // 随机间隔发送下一条
        const delay = 1500 + Math.random() * 2000;
        setTimeout(sendNextMessage, delay);
      }

      sendNextMessage();
    }

    function generateMessage(role) {
      const templates = roleTemplates[role.id] || roleTemplates.ceo;
      const template = templates[Math.floor(Math.random() * templates.length)];
      
      const additions = contextAdditions[currentScenario.id] || ['这个方向', '相关因素', '潜在机会', '可能风险'];
      const addition = additions[Math.floor(Math.random() * additions.length)];
      
      const opinions = role.opinions || ['需要进一步分析', '建议深入讨论'];
      const opinion = opinions[Math.floor(Math.random() * opinions.length)];

      let text = template.text
        .replace('{topic}', currentScenario.title)
        .replace('{aspect}', addition)
        .replace('{point}', addition)
        .replace('{role}', role.name)
        .replace('{perspective}', role.title)
        .replace('{observation}', `这是一个需要深入分析的${addition}问题`)
        .replace('{action}', `针对${addition}制定详细计划`)
        .replace('{benefit}', `有效提升${addition}的效果`)
        .replace('{concern}', addition)
        .replace('{data}', `关于${addition}的最新数据`)
        .replace('{conclusion}', `在${addition}方面的结论`)
        .replace('{example}', `类似场景中的${addition}案例`)
        .replace('{lesson}', `在${addition}方面的经验`)
        .replace('{detail}', addition);

      return {
        text: text,
        strategy: role.strategy,
        opinion: template.hasOpinion ? opinion : null
      };
    }

    function addMessage(roleId, author, avatar, color, text, strategy, opinion) {
      const container = document.getElementById('discussionContainer');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message';
      
      let strategyHtml = strategy ? `<div class="message-strategy">💡 策略：${strategy}</div>` : '';
      let opinionHtml = opinion ? `<div class="message-opinion">💭 个人意见：${opinion}</div>` : '';
      
      const role = roles.find(r => r.id === roleId);
      const roleTitle = role ? role.title : '';
      
      messageDiv.innerHTML = `
        <div class="message-avatar" style="background: ${color}20; color: ${color};">${avatar}</div>
        <div class="message-content">
          <div class="message-header">
            <span>
              <span class="message-author">${author}</span>
              <span class="message-role-tag">${roleTitle}</span>
            </span>
            <span class="message-time">${new Date().toLocaleTimeString()}</span>
          </div>
          <div class="message-text">${text}</div>
          ${strategyHtml}
          ${opinionHtml}
        </div>
      `;
      container.appendChild(messageDiv);
      container.scrollTop = container.scrollHeight;

      discussionMessages.push({ roleId, author, text, strategy, opinion, time: new Date() });
    }

    function showDecision() {
      if (currentDecisionIndex >= currentScenario.decisions?.length || 0) {
        addMessage('system', '系统', '✅', '#4ade80', 
          '讨论结束！所有决策点已完成。\n\n您可以查看上方的讨论统计，或点击"重置"开始新的讨论。',
          '', ''
        );
        isDiscussionActive = false;
        return;
      }

      const decision = currentScenario.decisions[currentDecisionIndex];
      const container = document.getElementById('decisionContainer');
      
      document.getElementById('decisionSection').classList.add('visible');
      
      container.innerHTML = `
        <div class="decision-card">
          <h4>💡 ${decision.question}</h4>
          <p>基于以上讨论，请做出您的决策：</p>
          <div class="decision-options">
            ${decision.options.map(opt => `
              <button class="decision-btn" onclick="makeDecision('${opt}')">${opt}</button>
            `).join('')}
          </div>
        </div>
      `;

      addMessage('system', '系统', '⚡', '#fbbf24', 
        `到达决策点：${decision.question}\n请从下方选项中选择您的决策。`,
        '', ''
      );
    }

    function makeDecision(option) {
      addMessage('user', '您', '🎯', '#38bdf8', `我的决策是：${option}`, '', '');
      
      // 角色对决策的反应
      selectedRoles.forEach((roleId, index) => {
        setTimeout(() => {
          const role = roles.find(r => r.id === roleId);
          const reactions = [
            `我支持这个决策，特别是在${option}方面，这与我们的目标一致。`,
            `这个选择有其合理性，但我建议我们在执行时关注风险管控。`,
            `从${role.title}的角度，${option}是可行的，但需要细化实施方案。`,
            `我同意，同时建议建立监控机制来跟踪${option}的效果。`
          ];
          const reaction = reactions[Math.floor(Math.random() * reactions.length)];
          addMessage(roleId, role.name, role.avatar, role.color, reaction, role.strategy, null);
        }, (index + 1) * 1500);
      });

      currentDecisionIndex++;
      
      setTimeout(() => {
        document.getElementById('decisionSection').classList.remove('visible');
        if (currentDecisionIndex < (currentScenario.decisions?.length || 0)) {
          simulateDiscussion();
        } else {
          setTimeout(() => showDecision(), 3000);
        }
      }, selectedRoles.length * 1500 + 1000);
    }

    function sendUserMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      
      if (!text) return;

      addMessage('user', '您', '🎯', '#38bdf8', text, '', '');
      input.value = '';

      // 随机角色回应
      setTimeout(() => {
        const roleId = selectedRoles[Math.floor(Math.random() * selectedRoles.length)];
        const role = roles.find(r => r.id === roleId);
        const responses = [
          `您提到的观点很有价值，特别是关于${text.substring(0, 10)}...的见解。`,
          `这是一个很好的视角，让我重新思考这个问题。`,
          `我认同您的分析，建议我们进一步探讨这个方向。`,
          `您提出了一个关键点，这可能会影响我们的最终决策。`
        ];
        const response = responses[Math.floor(Math.random() * responses.length)];
        addMessage(roleId, role.name, role.avatar, role.color, response, role.strategy, null);
      }, 1500);
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendUserMessage();
      }
    }

    function updateStats() {
      const statsGrid = document.getElementById('statsGrid');
      
      // 按层级统计
      const levelCounts = {};
      selectedRoles.forEach(id => {
        const role = roles.find(r => r.id === id);
        const level = role.level;
        levelCounts[level] = (levelCounts[level] || 0) + 1;
      });

      const levelNames = { management: '管理层', middle: '中层', frontline: '基层' };

      statsGrid.innerHTML = `
        <div class="stat-card">
          <div class="stat-value">${discussionMessages.length}</div>
          <div class="stat-label">总发言数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${selectedRoles.length}</div>
          <div class="stat-label">参与角色</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${levelCounts.management || 0}</div>
          <div class="stat-label">管理层</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${levelCounts.frontline || 0}</div>
          <div class="stat-label">基层员工</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${currentDecisionIndex}/${currentScenario?.decisions?.length || 0}</div>
          <div class="stat-label">决策进度</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${Math.floor(discussionMessages.length / (selectedRoles.length || 1))}</div>
          <div class="stat-label">人均发言</div>
        </div>
      `;
    }

    function resetAll() {
      currentIndustry = null;
      currentScenario = null;
      selectedRoles = [];
      discussionMessages = [];
      currentDecisionIndex = 0;
      isDiscussionActive = false;

      // 重置步骤
      [1, 2, 3, 4].forEach(i => {
        const step = document.getElementById(`step${i}`);
        step.classList.remove('active', 'completed');
        if (i === 1) step.classList.add('active');
      });

      document.querySelectorAll('.industry-card').forEach(card => card.classList.remove('active'));
      document.querySelectorAll('.scenario-card').forEach(card => card.classList.remove('active'));
      document.querySelectorAll('.role-card').forEach(card => card.classList.remove('selected'));
      
      document.getElementById('scenarioSection').classList.remove('visible');
      document.getElementById('rolesSection').classList.remove('visible');
      document.getElementById('discussionSection').classList.remove('visible');
      document.getElementById('userInputSection').classList.remove('visible');
      document.getElementById('decisionSection').classList.remove('visible');
      document.getElementById('statsSection').classList.remove('visible');
      document.getElementById('progressBar').style.display = 'none';
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('discussionContainer').innerHTML = '';
      document.getElementById('decisionContainer').innerHTML = '';
      
      updateStartButton();
      showToast('已重置，请重新选择行业、场景和角色');
      
      // 滚动到顶部
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // 定期更新统计
    setInterval(() => {
      if (isDiscussionActive) {
        updateStats();
      }
    }, 2000);

    // 初始化
    init();
  </script>
</body>
</html>
