        function seededRandom(seed) {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        function generateSeededScores(seed) {
            const ingredientScore = Math.floor(seededRandom(seed) * 41) + 60;
            const colorScore = Math.floor(seededRandom(seed + 100) * 41) + 60;
            const layoutScore = Math.floor(seededRandom(seed + 200) * 41) + 60;
            const overallScore = Math.round((ingredientScore * 0.5 + colorScore * 0.3 + layoutScore * 0.2) / 10);
            return { ingredientScore, colorScore, layoutScore, overallScore };
        }

        function getEvaluation(score) {
            if (score >= 9) return evaluations.excellent[Math.floor(Math.random() * evaluations.excellent.length)];
            if (score >= 7) return evaluations.good[Math.floor(Math.random() * evaluations.good.length)];
            if (score >= 5) return evaluations.average[Math.floor(Math.random() * evaluations.average.length)];
            return evaluations.poor[Math.floor(Math.random() * evaluations.poor.length)];
        }

        function analyzeImageColors(imageData) {
            let rTotal = 0, gTotal = 0, bTotal = 0;
            let pixelCount = 0;
            let redPixels = 0, greenPixels = 0, yellowPixels = 0, brownPixels = 0, orangePixels = 0, bluePixels = 0;
            
            for (let i = 0; i < imageData.data.length; i += 4) {
                const r = imageData.data[i];
                const g = imageData.data[i + 1];
                const b = imageData.data[i + 2];
                
                rTotal += r;
                gTotal += g;
                bTotal += b;
                pixelCount++;
                
                const hsl = rgbToHsl(r, g, b);
                
                if (hsl.h >= 0 && hsl.h < 30 || hsl.h >= 340) redPixels++;
                else if (hsl.h >= 30 && hsl.h < 60) yellowPixels++;
                else if (hsl.h >= 60 && hsl.h < 90) greenPixels++;
                else if (hsl.h >= 90 && hsl.h < 180) bluePixels++;
                else if (hsl.h >= 180 && hsl.h < 340) {
                    if (hsl.l < 50) brownPixels++;
                    else orangePixels++;
                }
            }
            
            return {
                avgR: rTotal / pixelCount,
                avgG: gTotal / pixelCount,
                avgB: bTotal / pixelCount,
                redRatio: redPixels / pixelCount,
                greenRatio: greenPixels / pixelCount,
                yellowRatio: yellowPixels / pixelCount,
                brownRatio: brownPixels / pixelCount,
                orangeRatio: orangePixels / pixelCount,
                blueRatio: bluePixels / pixelCount
            };
        }

        function rgbToHsl(r, g, b) {
            r /= 255, g /= 255, b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            
            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }
            
            return { h: h * 360, s, l };
        }

        function getFoodCategoryByColor(colorAnalysis) {
            if (colorAnalysis.redRatio > 0.15 || colorAnalysis.brownRatio > 0.1) {
                return ['肉类', '海鲜'];
            } else if (colorAnalysis.greenRatio > 0.1) {
                return ['蔬菜', '健康'];
            } else if (colorAnalysis.yellowRatio > 0.1 || colorAnalysis.orangeRatio > 0.1) {
                return ['蛋类', '甜点', '主食'];
            } else if (colorAnalysis.blueRatio > 0.1) {
                return ['饮品', '海鲜'];
            }
            return ['肉类', '主食', '西餐', '日料'];
        }

        function getRandomFoodsByCategory(categories, count, seed) {
            const filteredFoods = foodDatabase.filter(f => categories.includes(f.category));
            const availableFoods = filteredFoods.length > 0 ? filteredFoods : foodDatabase;
            
            const selected = [];
            const usedIndices = new Set();
            
            for (let i = 0; i < count; i++) {
                let index;
                do {
                    index = Math.floor(seededRandom(seed + i * 1000 + selected.length) * availableFoods.length);
                } while (usedIndices.has(index));
                usedIndices.add(index);
                selected.push(availableFoods[index]);
            }
            
            return selected;
        }

        function simulateProcessing(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 100;
                        canvas.height = 100;
                        ctx.drawImage(img, 0, 0, 100, 100);
                        const imageData = ctx.getImageData(0, 0, 100, 100);
                        
                        const colorAnalysis = analyzeImageColors(imageData);
                        const seed = Math.floor(colorAnalysis.avgR + colorAnalysis.avgG * 1000 + colorAnalysis.avgB * 10000);
                        
                        const categories = getFoodCategoryByColor(colorAnalysis);
                        const numFoods = Math.floor(seededRandom(seed) * 3) + 1;
                        const foods = getRandomFoodsByCategory(categories, numFoods, seed);
                        
                        let totalCalories = 0;
                        const resultFoods = foods.map(food => {
                            totalCalories += food.calories;
                            return {
                                name: food.name,
                                calories: food.calories,
                                category: food.category
                            };
                        });
                        
                        setTimeout(() => {
                            const scores = generateSeededScores(seed);
                            const evaluation = getEvaluation(scores.overallScore);
                            
                            resolve({
                                foods: resultFoods,
                                totalCalories: totalCalories + ' 卡路里',
                                ingredientScore: scores.ingredientScore,
                                colorScore: scores.colorScore,
                                layoutScore: scores.layoutScore,
                                overallScore: scores.overallScore,
                                evaluation: evaluation
                            });
                        }, 1500);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        const uploadBox = document.getElementById('uploadBox');
        const fileInput = document.getElementById('fileInput');
        const resultSection = document.getElementById('resultSection');

        uploadBox.addEventListener('click', () => {
            fileInput.click();
        });

        uploadBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBox.style.borderColor = '#fd79a8';
        });

        uploadBox.addEventListener('dragleave', () => {
            uploadBox.style.borderColor = '#ff7675';
        });

        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBox.style.borderColor = '#ff7675';
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                processFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                processFile(file);
            }
        });

        async function processFile(file) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                resultSection.innerHTML = `
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p class="loading-text">AI正在分析图片...</p>
                    </div>
                `;
                resultSection.style.display = 'block';
                
                const result = await simulateProcessing(file);
                
                let foodListHtml = '';
                result.foods.forEach((food, index) => {
                    foodListHtml += `
                        <div class="food-item">
                            <span class="food-index">${index + 1}.</span>
                            <span class="food-name">${food.name}</span>
                            <span class="food-category">(${food.category})</span>
                            <span class="food-calories">${food.calories} 卡路里</span>
                        </div>
                    `;
                });
                
                resultSection.innerHTML = `
                    <div class="image-preview">
                        <img id="previewImage" src="${e.target.result}" alt="预览图片">
                    </div>
                    
                    <div class="food-info">
                        <div class="info-header">
                            <span class="label">识别到 ${result.foods.length} 个菜品：</span>
                        </div>
                        <div class="food-list">
                            ${foodListHtml}
                        </div>
                        <div class="info-item total-calories">
                            <span class="label">总热量：</span>
                            <span class="value" id="calories">${result.totalCalories}</span>
                        </div>
                    </div>

                    <div class="score-display">
                        <div class="overall-score">
                            <div class="score-circle">
                                <span class="score-number" id="overallScore">${result.overallScore}</span>
                                <span class="score-unit">分</span>
                            </div>
                            <p class="score-label">综合颜值评分</p>
                        </div>

                        <div class="dimension-scores">
                            <div class="dimension-item">
                                <div class="dimension-icon">🎨</div>
                                <div class="dimension-info">
                                    <span class="dimension-name">食材搭配 (50%)</span>
                                    <div class="progress-bar">
                                        <div class="progress-fill" id="ingredientProgress" style="width: ${result.ingredientScore}%"></div>
                                    </div>
                                    <span class="dimension-score" id="ingredientScore">${result.ingredientScore}分</span>
                                </div>
                            </div>
                            <div class="dimension-item">
                                <div class="dimension-icon">🌈</div>
                                <div class="dimension-info">
                                    <span class="dimension-name">色彩还原 (30%)</span>
                                    <div class="progress-bar">
                                        <div class="progress-fill" id="colorProgress" style="width: ${result.colorScore}%"></div>
                                    </div>
                                    <span class="dimension-score" id="colorScore">${result.colorScore}分</span>
                                </div>
                            </div>
                            <div class="dimension-item">
                                <div class="dimension-icon">🏗️</div>
                                <div class="dimension-info">
                                    <span class="dimension-name">摆盘层次 (20%)</span>
                                    <div class="progress-bar">
                                        <div class="progress-fill" id="layoutProgress" style="width: ${result.layoutScore}%"></div>
                                    </div>
                                    <span class="dimension-score" id="layoutScore">${result.layoutScore}分</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="evaluation">
                        <p class="evaluation-text" id="evaluationText">${result.evaluation}</p>
                    </div>

                    <button class="retry-btn" id="retryBtn">重新上传</button>
                `;
                
                document.getElementById('retryBtn').addEventListener('click', () => {
                    resultSection.style.display = 'none';
                    fileInput.value = '';
                });
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
