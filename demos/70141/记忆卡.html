<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4F46E5">
<meta name="mobile-web-app-capable" content="yes">
<title>记忆卡 - 艾宾浩斯记忆背诵</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E8%AE%B0%E5%BF%86%E5%8D%A1%22%2C%22short_name%22%3A%22%E8%AE%B0%E5%BF%86%E5%8D%A1%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23F0F2F5%22%2C%22theme_color%22%3A%22%234F46E5%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%253E%253Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2720%27%20fill%3D%27%25234F46E5%27%2F%253E%253Ctext%20x%3D%2750%27%20y%3D%2768%27%20font-size%3D%2750%27%20text-anchor%3D%27middle%27%20fill%3D%27white%27%20font-family%3D%27sans-serif%27%253E%25E5%25AD%2597%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
<style>
:root{
  --primary:#4F46E5;
  --primary-light:#818CF8;
  --primary-dark:#3730A3;
  --bg:#F0F2F5;
  --card:#FFFFFF;
  --text:#1F2937;
  --text-secondary:#6B7280;
  --text-light:#9CA3AF;
  --border:#E5E7EB;
  --danger:#EF4444;
  --success:#10B981;
  --warning:#F59E0B;
  --info:#3B82F6;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px rgba(0,0,0,.1),0 4px 6px rgba(0,0,0,.05);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --nav-h:56px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;font-size:16px;line-height:1.5}
body{padding-top:var(--safe-t)}
#app{height:100%;display:flex;flex-direction:column}
.page{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(var(--nav-h) + var(--safe-b) + 16px)}
.page.active{display:block}

/* Header */
.header{background:var(--primary);color:#fff;padding:16px 16px calc(12px + var(--safe-t));text-align:center;font-size:18px;font-weight:600;position:sticky;top:0;z-index:100;flex-shrink:0}
.header h1{font-size:20px;font-weight:700}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);z-index:200}
.bottom-nav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-light);font-size:11px;cursor:pointer;transition:color .2s;text-decoration:none;-webkit-user-select:none;user-select:none}
.bottom-nav .nav-item.active{color:var(--primary)}
.bottom-nav .nav-item svg{width:24px;height:24px}
.bottom-nav .nav-item span{font-size:11px;font-weight:500}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card-title{font-size:15px;font-weight:600;margin-bottom:8px;color:var(--text)}
.card-body{font-size:13px;color:var(--text-secondary);margin-bottom:8px;word-break:break-word}
.card-footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-light)}
.tag{display:inline-block;background:#EEF2FF;color:var(--primary);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;margin-right:4px}

/* Stat Cards */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;text-align:center}
.stat-card .stat-num{font-size:28px;font-weight:700;margin-bottom:2px}
.stat-card .stat-label{font-size:12px;color:var(--text-secondary)}
.stat-card.st-reviews .stat-num{color:var(--danger)}
.stat-card.st-new .stat-num{color:var(--info)}
.stat-card.st-learning .stat-num{color:var(--warning)}
.stat-card.st-mastered .stat-num{color:var(--success)}

/* Filter Bar */
.filter-bar{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.filter-bar::-webkit-scrollbar{display:none}
.filter-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text-secondary);font-size:13px;cursor:pointer;white-space:nowrap}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.filter-btn:active{opacity:.7}

/* Search Bar */
.search-bar{display:flex;align-items:center;background:var(--card);border-radius:var(--radius-sm);box-shadow:var(--shadow);margin-bottom:12px;padding:0 12px;height:40px}
.search-bar svg{width:18px;height:18px;color:var(--text-light);flex-shrink:0}
.search-bar input{flex:1;border:none;outline:none;background:none;padding:0 8px;font-size:14px;font-family:var(--font);color:var(--text)}
.search-bar input::placeholder{color:var(--text-light)}

/* Card Item */
.card-item{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;position:relative;transition:transform .15s}
.card-item:active{transform:scale(.98)}
.card-item .q{font-size:15px;font-weight:600;margin-bottom:6px;line-height:1.4}
.card-item .a{font-size:13px;color:var(--text-secondary);margin-bottom:8px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-item .meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.card-item .actions{display:flex;gap:6px}
.btn-icon{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.btn-icon:active{background:var(--border)}
.btn-icon.danger:active{background:#FEE2E2;color:var(--danger)}

/* Flip Card */
.review-card-wrapper{display:flex;flex-direction:column;align-items:center;padding-top:20px}
.progress-info{text-align:center;margin-bottom:16px;color:var(--text-secondary);font-size:14px}
.progress-bar-wrap{width:100%;height:6px;background:var(--border);border-radius:3px;margin-bottom:8px;overflow:hidden}
.progress-bar{height:100%;background:var(--primary);border-radius:3px;transition:width .3s}
.flip-card{width:100%;max-width:400px;min-height:200px;perspective:800px;margin-bottom:20px;cursor:pointer}
.flip-card-inner{position:relative;width:100%;min-height:200px;transition:transform .5s;transform-style:preserve-3d}
.flip-card-inner.flipped{transform:rotateY(180deg)}
.flip-card-front,.flip-card-back{position:absolute;top:0;left:0;width:100%;min-height:200px;backface-visibility:hidden;border-radius:var(--radius);box-shadow:var(--shadow-md);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.flip-card-front{background:var(--card)}
.flip-card-back{background:var(--primary);color:#fff;transform:rotateY(180deg)}
.flip-card-front .label,.flip-card-back .label{font-size:12px;margin-bottom:8px;opacity:.7}
.flip-card-front .content,.flip-card-back .content{font-size:18px;font-weight:600;line-height:1.6;word-break:break-word}
.flip-card-back .content{font-size:18px}
.flip-hint{text-align:center;color:var(--text-light);font-size:13px;margin-bottom:16px}

/* Rating Buttons */
.rating-btns{width:100%;max-width:400px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rating-btn{padding:12px 4px;border-radius:var(--radius-sm);border:2px solid var(--border);background:var(--card);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;text-align:center;transition:all .2s}
.rating-btn:active{transform:scale(.95)}
.rating-btn.r0{border-color:#FCA5A5;color:#DC2626}
.rating-btn.r0:active,.rating-btn.r0.selected{background:#FEE2E2}
.rating-btn.r1{border-color:#FDBA74;color:#EA580C}
.rating-btn.r1:active,.rating-btn.r1.selected{background:#FFF7ED}
.rating-btn.r2{border-color:#FDE68A;color:#CA8A04}
.rating-btn.r2:active,.rating-btn.r2.selected{background:#FEFCE8}
.rating-btn.r3{border-color:#86EFAC;color:#16A34A}
.rating-btn.r3:active,.rating-btn.r3.selected{background:#F0FDF4}
.rating-btn.r4{border-color:#6EE7B7;color:#059669}
.rating-btn.r4:active,.rating-btn.r4.selected{background:#ECFDF5}
.rating-btn.r5{border-color:#A5B4FC;color:#4338CA}
.rating-btn.r5:active,.rating-btn.r5.selected{background:#EEF2FF}
.rating-btn .r-label{display:block;font-size:16px;font-weight:700;margin-bottom:2px}
.rating-btn .r-desc{display:block;font-size:10px;opacity:.7}

/* Add Form */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--text)}
.form-group textarea,.form-group input,.form-group select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:var(--font);color:var(--text);background:var(--card);outline:none;transition:border-color .2s}
.form-group textarea{min-height:80px;resize:vertical}
.form-group textarea:focus,.form-group input:focus,.form-group select:focus{border-color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:var(--radius-sm);border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .2s;width:100%}
.btn:active{opacity:.8;transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:var(--bg);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:var(--radius-sm)}
.btn-block{display:flex;width:100%}

/* Tabs */
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:500;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-content{display:none}
.tab-content.active{display:block}

/* Category Progress */
.cat-progress{margin-bottom:14px}
.cat-progress .cat-header{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.cat-progress .cat-header .cat-name{font-weight:600;color:var(--text)}
.cat-progress .cat-header .cat-count{color:var(--text-secondary)}
.cat-progress .bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.cat-progress .bar-fill{height:100%;border-radius:4px;background:var(--primary);transition:width .5s}

/* Stats Page */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stats-item{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;text-align:center}
.stats-item .num{font-size:24px;font-weight:700;color:var(--primary);margin-bottom:2px}
.stats-item .label{font-size:12px;color:var(--text-secondary)}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:500;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;padding:20px 16px calc(20px + var(--safe-b));animation:slideUp .3s}
.modal h3{font-size:17px;font-weight:700;margin-bottom:16px;text-align:center}
.modal-close{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;border:none;background:var(--bg);color:var(--text-secondary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:transform:translateY(0)}}

/* Confirm Dialog */
.confirm-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:600;align-items:center;justify-content:center}
.confirm-overlay.show{display:flex}
.confirm-box{background:var(--card);border-radius:var(--radius);padding:24px;width:calc(100% - 48px);max-width:340px;text-align:center;box-shadow:var(--shadow-lg)}
.confirm-box .msg{font-size:15px;margin-bottom:20px;line-height:1.5}
.confirm-box .btn-row{display:flex;gap:10px}
.confirm-box .btn-row .btn{flex:1}

/* Toast */
.toast{position:fixed;top:calc(16px + var(--safe-t));left:50%;transform:translateX(-50%) translateY(-80px);background:#1F2937;color:#fff;padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;z-index:700;transition:transform .3s;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Empty State */
.empty{text-align:center;padding:40px 20px;color:var(--text-light)}
.empty svg{width:64px;height:64px;margin-bottom:12px;opacity:.4}
.empty p{font-size:14px;margin-bottom:16px}

/* Review Complete */
.review-complete{text-align:center;padding:40px 20px}
.review-complete .big-icon{font-size:64px;margin-bottom:16px}
.review-complete h2{font-size:20px;font-weight:700;margin-bottom:8px;color:var(--text)}
.review-complete p{color:var(--text-secondary);font-size:14px;margin-bottom:24px}

/* File input */
.file-input-wrap{position:relative;overflow:hidden;margin-bottom:12px}
.file-input-wrap input[type=file]{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer}
.btn-file{display:flex;align-items:center;justify-content:center;gap:6px}

/* Scrollbar */
::-webkit-scrollbar{width:0;height:0}

/* AI Add Page */
.ai-provider-bar{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.ai-provider-bar::-webkit-scrollbar{display:none}
.ai-provider-btn{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text-secondary);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .2s}
.ai-provider-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.ai-provider-btn:active{opacity:.7}
.ai-config-section{background:var(--bg);border-radius:var(--radius-sm);padding:14px;margin-bottom:14px}
.ai-config-section .section-title{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:10px;display:flex;align-items:center;gap:4px}
.ai-textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:var(--font);color:var(--text);background:var(--card);outline:none;min-height:120px;resize:vertical;transition:border-color .2s}
.ai-textarea:focus{border-color:var(--primary)}
.ai-progress{background:var(--card);border-radius:var(--radius-sm);padding:14px;margin-top:14px;display:none}
.ai-progress.show{display:block}
.ai-progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:8px}
.ai-progress-bar-fill{height:100%;background:var(--primary);border-radius:4px;transition:width .3s}
.ai-progress-text{font-size:12px;color:var(--text-secondary)}
.ai-result-preview{background:var(--card);border-radius:var(--radius-sm);padding:14px;margin-top:14px;max-height:300px;overflow-y:auto;display:none}
.ai-result-preview.show{display:block}
.ai-result-item{padding:10px 0;border-bottom:1px solid var(--border)}
.ai-result-item:last-child{border-bottom:none}
.ai-result-item .ai-q{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.ai-result-item .ai-a{font-size:13px;color:var(--text-secondary);line-height:1.4}
.input-password-wrap{position:relative;display:flex;align-items:center}
.input-password-wrap input{padding-right:40px}
.input-password-wrap .toggle-pw{position:absolute;right:10px;background:none;border:none;color:var(--text-light);cursor:pointer;font-size:16px;padding:4px}

/* Batch Manage Page */
.batch-toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 0;margin-bottom:8px}
.batch-select-all{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);cursor:pointer;-webkit-user-select:none;user-select:none}
.batch-select-all input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);cursor:pointer}
.batch-count{font-size:13px;color:var(--primary);font-weight:600}
.batch-card-item{display:flex;align-items:flex-start;gap:10px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:8px;transition:transform .15s}
.batch-card-item:active{transform:scale(.98)}
.batch-card-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);cursor:pointer;flex-shrink:0;margin-top:2px}
.batch-card-item .batch-card-body{flex:1;min-width:0}
.batch-card-item .batch-card-body .bc-q{font-size:14px;font-weight:600;margin-bottom:4px;line-height:1.4;word-break:break-word}
.batch-card-item .batch-card-body .bc-a{font-size:12px;color:var(--text-secondary);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.batch-card-item .batch-card-body .bc-meta{display:flex;align-items:center;gap:6px;margin-top:6px}
.batch-action-bar{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b));left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;z-index:150;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
.batch-action-bar .btn{flex:1;padding:10px 8px;font-size:13px}
.batch-action-bar:empty{display:none}
.page.batch-page{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 70px)}

/* Sub tabs */
.sub-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px}
.sub-tab{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:500;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.sub-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.sub-tab-content{display:none}
.sub-tab-content.active{display:block}

/* Responsive */
@media(min-width:600px){
  .page{max-width:500px;margin:0 auto}
  .flip-card{max-width:460px}
  .rating-btns{max-width:460px}
  .batch-action-bar{max-width:500px;left:50%;transform:translateX(-50%)}
}
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div class="header"><h1>记忆卡</h1></div>

  <!-- Page: Home -->
  <div id="page-home" class="page active">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="searchInput" type="text" placeholder="搜索卡片...">
    </div>
    <div id="filterBar" class="filter-bar"></div>
    <div class="stat-grid">
      <div class="stat-card st-reviews"><div class="stat-num" id="statReview">0</div><div class="stat-label">待复习</div></div>
      <div class="stat-card st-new"><div class="stat-num" id="statNew">0</div><div class="stat-label">新卡片</div></div>
      <div class="stat-card st-learning"><div class="stat-num" id="statLearning">0</div><div class="stat-label">学习中</div></div>
      <div class="stat-card st-mastered"><div class="stat-num" id="statMastered">0</div><div class="stat-label">已掌握</div></div>
    </div>
    <div id="cardList"></div>
  </div>

  <!-- Page: Review -->
  <div id="page-review" class="page">
    <div class="review-card-wrapper">
      <div id="reviewContent"></div>
    </div>
  </div>

  <!-- Page: Add -->
  <div id="page-add" class="page">
    <div class="tabs" id="addMainTabs">
      <div class="tab active" data-tab="add-ai">AI添加</div>
      <div class="tab" data-tab="add-manual">自主添加</div>
    </div>
    <!-- AI添加 -->

<script>
(function(){
'use strict';

// ========== Data Layer ==========
const STORAGE_KEY = 'memory_cards_data';

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { cards:[], reviewLog:[] };
}

function saveData(data){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function uuid(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    const r = Math.random()*16|0;
    return (c==='x'?r:(r&0x3|0x8)).toString(16);
  });
}

let appData = loadData();

// ========== SM-2 Algorithm ==========
function sm2(card, quality){
  // quality: 0-5
  let ef = card.easiness || 2.5;
  let interval = card.interval || 0;
  let repetitions = card.repetitions || 0;

  if(quality >= 3){
    // Correct response
    if(repetitions === 0) interval = 1;
    else if(repetitions === 1) interval = 3;
    else interval = Math.round(interval * ef);
    repetitions++;
  } else {
    // Incorrect response
    repetitions = 0;
    interval = 1;
  }

  ef = ef + 0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02);
  ef = Math.max(1.3, ef);

  const now = new Date();
  const nextReview = new Date(now.getTime() + interval * 24 * 60 * 60 * 1000);

  card.easiness = parseFloat(ef.toFixed(2));
  card.interval = interval;
  card.repetitions = repetitions;
  card.next_review = nextReview.toISOString();
  card.last_review = now.toISOString();

  if(quality >= 3) card.correct_count = (card.correct_count || 0) + 1;
  else card.incorrect_count = (card.incorrect_count || 0) + 1;

  return card;
}

// ========== Review Log ==========
function getTodayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getTodayLog(){
  const ds = getTodayStr();
  let entry = appData.reviewLog.find(l => l.date === ds);
  if(!entry){
    entry = { date:ds, reviewed:0, correct:0 };
    appData.reviewLog.push(entry);
  }
  return entry;
}

function logReview(correct){
  const entry = getTodayLog();
  entry.reviewed++;
  if(correct) entry.correct++;
  saveData(appData);
}

// ========== Stats Helpers ==========
function getDueCards(){
  const now = new Date();
  return appData.cards.filter(c => new Date(c.next_review) <= now);
}

function getNewCards(){
  return appData.cards.filter(c => c.repetitions === 0);
}

function getLearningCards(){
  return appData.cards.filter(c => c.repetitions > 0 && c.repetitions <= 4);
}

function getMasteredCards(){
  return appData.cards.filter(c => c.repetitions > 4);
}

function getAllCategories(){
  const cats = new Set();
  appData.cards.forEach(c => { if(c.category) cats.add(c.category); });
  return Array.from(cats);
}

// ========== Page Switching ==========
window.switchPage = function(page){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector('.nav-item[data-page="'+page+'"]').classList.add('active');

  if(page === 'home') renderHome();
  else if(page === 'review') renderReview();
  else if(page === 'stats') renderStats();
  else if(page === 'manage') renderManage();
};

// ========== Toast ==========
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2000);
}

// ========== Confirm Dialog ==========
let confirmCallback = null;
function showConfirm(msg, cb){
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmOverlay').classList.add('show');
  confirmCallback = cb;
}

window.cancelConfirm = function(){
  document.getElementById('confirmOverlay').classList.remove('show');
  confirmCallback = null;
};

document.getElementById('confirmOk').addEventListener('click', function(){
  document.getElementById('confirmOverlay').classList.remove('show');
  if(confirmCallback) confirmCallback();
  confirmCallback = null;
});

// ========== Home Page ==========
let currentFilter = '全部';
let searchQuery = '';

function renderFilters(){
  const cats = getAllCategories();
  const bar = document.getElementById('filterBar');
  let html = '<button class="filter-btn '+(currentFilter==='全部'?'active':'')+'" onclick="setFilter(\'全部\')">全部</button>';
  cats.forEach(c => {
    html += '<button class="filter-btn '+(currentFilter===c?'active':'')+'" onclick="setFilter(\''+c.replace(/'/g,"\\'")+'\')">'+c+'</button>';
  });
  bar.innerHTML = html;
}

window.setFilter = function(f){
  currentFilter = f;
  renderHome();
};

function renderHome(){
  // Stats
  document.getElementById('statReview').textContent = getDueCards().length;
  document.getElementById('statNew').textContent = getNewCards().length;
  document.getElementById('statLearning').textContent = getLearningCards().length;
  document.getElementById('statMastered').textContent = getMasteredCards().length;

  renderFilters();

  // Card list
  let cards = appData.cards.slice().reverse(); // newest first
  if(currentFilter !== '全部'){
    cards = cards.filter(c => c.category === currentFilter);
  }
  if(searchQuery){
    const q = searchQuery.toLowerCase();
    cards = cards.filter(c =>
      c.question.toLowerCase().includes(q) ||
      c.answer.toLowerCase().includes(q) ||
      (c.category && c.category.toLowerCase().includes(q))
    );
  }

  const list = document.getElementById('cardList');
  if(cards.length === 0){
    list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 8h20"/></svg><p>'+(appData.cards.length===0?'还没有卡片，去添加吧':'没有找到匹配的卡片')+'</p></div>';
    return;
  }

  let html = '';
  cards.forEach(c => {
    const due = new Date(c.next_review) <= new Date();
    const statusLabel = due ? '<span style="color:var(--danger);font-weight:500">待复习</span>' :
                        c.repetitions === 0 ? '<span style="color:var(--info)">新卡片</span>' :
                        c.repetitions <= 4 ? '<span style="color:var(--warning)">学习中</span>' :
                        '<span style="color:var(--success)">已掌握</span>';
    html += '<div class="card-item">'
      + '<div class="q">'+escHtml(c.question)+'</div>'
      + '<div class="a">'+escHtml(c.answer)+'</div>'
      + '<div class="meta">'
      + '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'
      + (c.category ? '<span class="tag">'+escHtml(c.category)+'</span>' : '')
      + statusLabel
      + '</div>'
      + '<div style="font-size:11px;color:var(--text-light)">复习 '+c.repetitions+' 次</div>'
      + '</div>'
      + '<div class="actions" style="margin-top:8px">'
      + '<button class="btn-icon" onclick="openEdit(\''+c.id+'\')" title="编辑">&#9998;</button>'
      + '<button class="btn-icon danger" onclick="deleteCard(\''+c.id+'\')" title="删除">&#10005;</button>'
      + '</div></div>';
  });
  list.innerHTML = html;
}

// Search
document.getElementById('searchInput').addEventListener('input', function(){
  searchQuery = this.value.trim();
  renderHome();
});

// ========== Card CRUD ==========
window.addCard = function(){
  const q = document.getElementById('addQuestion').value.trim();
  const a = document.getElementById('addAnswer').value.trim();
  const cat = document.getElementById('addCategory').value.trim() || '默认';
  if(!q || !a){ showToast('请输入问题和答案'); return; }

  const card = {
    id: uuid(),
    question: q,
    answer: a,
    category: cat,
    easiness: 2.5,
    interval: 0,
    repetitions: 0,
    next_review: new Date().toISOString(),
    last_review: null,
    created_at: new Date().toISOString(),
    correct_count: 0,
    incorrect_count: 0
  };
  appData.cards.push(card);
  saveData(appData);
  document.getElementById('addQuestion').value = '';
  document.getElementById('addAnswer').value = '';
  document.getElementById('addCategory').value = '';
  showToast('卡片添加成功');
};

window.batchImport = function(){
  const raw = document.getElementById('batchJson').value.trim();
  if(!raw){ showToast('请输入 JSON 数据'); return; }
  try{
    const arr = JSON.parse(raw);
    if(!Array.isArray(arr)){ showToast('JSON 必须是数组格式'); return; }
    let count = 0;
    arr.forEach(item => {
      if(item.question && item.answer){
        appData.cards.push({
          id: uuid(),
          question: item.question,
          answer: item.answer,
          category: item.category || '默认',
          easiness: 2.5,
          interval: 0,
          repetitions: 0,
          next_review: new Date().toISOString(),
          last_review: null,
          created_at: new Date().toISOString(),
          correct_count: 0,
          incorrect_count: 0
        });
        count++;
      }
    });
    saveData(appData);
    document.getElementById('batchJson').value = '';
    showToast('成功导入 '+count+' 张卡片');
  }catch(e){
    showToast('JSON 格式错误，请检查');
  }
};

window.deleteCard = function(id){
  showConfirm('确定要删除这张卡片吗？', function(){
    appData.cards = appData.cards.filter(c => c.id !== id);
    saveData(appData);
    renderHome();
    showToast('已删除');
  });
};

// ========== Edit Modal ==========
window.openEdit = function(id){
  const card = appData.cards.find(c => c.id === id);
  if(!card) return;
  document.getElementById('editId').value = id;
  document.getElementById('editQuestion').value = card.question;
  document.getElementById('editAnswer').value = card.answer;
  document.getElementById('editCategory').value = card.category;
  document.getElementById('editModal').classList.add('show');
};

window.closeEditModal = function(e){
  if(e && e.target !== document.getElementById('editModal')) return;
  document.getElementById('editModal').classList.remove('show');
};

window.saveEdit = function(){
  const id = document.getElementById('editId').value;
  const card = appData.cards.find(c => c.id === id);
  if(!card) return;
  card.question = document.getElementById('editQuestion').value.trim();
  card.answer = document.getElementById('editAnswer').value.trim();
  card.category = document.getElementById('editCategory').value.trim() || '默认';
  if(!card.question || !card.answer){ showToast('问题和答案不能为空'); return; }
  saveData(appData);
  document.getElementById('editModal').classList.remove('show');
  renderHome();
  showToast('保存成功');
};

// ========== Import/Export File ==========
window.importFromFile = function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const data = JSON.parse(ev.target.result);
      let count = 0;
      let arr = Array.isArray(data) ? data : (data.cards || []);
      arr.forEach(item => {
        if(item.question && item.answer){
          appData.cards.push({
            id: uuid(),
            question: item.question,
            answer: item.answer,
            category: item.category || '默认',
            easiness: 2.5,
            interval: 0,
            repetitions: 0,
            next_review: new Date().toISOString(),
            last_review: null,
            created_at: new Date().toISOString(),
            correct_count: 0,
            incorrect_count: 0
          });
          count++;
        }
      });
      saveData(appData);
      showToast('成功导入 '+count+' 张卡片');
    }catch(err){
      showToast('文件格式错误');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

window.exportToFile = function(){
  const exportData = appData.cards.map(c => ({
    question: c.question,
    answer: c.answer,
    category: c.category
  }));
  const blob = new Blob([JSON.stringify(exportData, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '记忆卡_' + getTodayStr() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('导出成功');
};

// ========== Review Page ==========
let reviewQueue = [];
let reviewIndex = 0;
let isFlipped = false;

function renderReview(){
  reviewQueue = getDueCards();
  reviewIndex = 0;
  isFlipped = false;

  if(reviewQueue.length === 0){
    document.getElementById('reviewContent').innerHTML =
      '<div class="review-complete">'
      + '<div class="big-icon">&#127942;</div>'
      + '<h2>暂无待复习卡片</h2>'
      + '<p>所有卡片都已复习完毕，太棒了！</p>'
      + '</div>';
    return;
  }

  showReviewCard();
}

function showReviewCard(){
  if(reviewIndex >= reviewQueue.length){
    document.getElementById('reviewContent').innerHTML =
      '<div class="review-complete">'
      + '<div class="big-icon">&#127881;</div>'
      + '<h2>复习完成</h2>'
      + '<p>本次共复习 '+reviewQueue.length+' 张卡片</p>'
      + '<button class="btn btn-primary" style="max-width:200px;margin:0 auto" onclick="renderReview()">再来一轮</button>'
      + '</div>';
    return;
  }

  const card = reviewQueue[reviewIndex];
  isFlipped = false;
  const total = reviewQueue.length;
  const pct = Math.round(((reviewIndex) / total) * 100);

  let html = '<div class="progress-info">第 '+(reviewIndex+1)+' / '+total+' 张</div>'
    + '<div class="progress-bar-wrap"><div class="progress-bar" style="width:'+pct+'%"></div></div>'
    + '<div class="flip-card" id="flipCard" onclick="toggleFlip()">'
    + '<div class="flip-card-inner" id="flipInner">'
    + '<div class="flip-card-front">'
    + '<div class="label">&#128214; 问题</div>'
    + '<div class="content">'+escHtml(card.question)+'</div>'
    + '</div>'
    + '<div class="flip-card-back">'
    + '<div class="label">&#128221; 答案</div>'
    + '<div class="content">'+escHtml(card.answer)+'</div>'
    + '</div>'
    + '</div></div>'
    + '<div class="flip-hint">&#128073; 点击卡片翻转查看答案</div>'
    + '<div class="rating-btns" id="ratingBtns">';

  const ratings = [
    { v:0, label:'忘了', desc:'完全不记得' },
    { v:1, label:'困难', desc:'想了很久' },
    { v:2, label:'模糊', desc:'不太确定' },
    { v:3, label:'记得', desc:'回忆起来了' },
    { v:4, label:'熟悉', desc:'比较熟练' },
    { v:5, label:'轻松', desc:'完全掌握' }
  ];

  ratings.forEach(r => {
    html += '<button class="rating-btn r'+r.v+'" onclick="rateCard('+r.v+')">'
      + '<span class="r-label">'+r.label+'</span>'
      + '<span class="r-desc">'+r.desc+'</span></button>';
  });

  html += '</div>';
  document.getElementById('reviewContent').innerHTML = html;
}

window.toggleFlip = function(){
  isFlipped = !isFlipped;
  document.getElementById('flipInner').classList.toggle('flipped', isFlipped);
  if(isFlipped){
    const hint = document.querySelector('.flip-hint');
    if(hint) hint.style.display = 'none';
  }
};

window.rateCard = function(quality){
  if(!isFlipped){
    showToast('请先点击卡片查看答案');
    return;
  }

  const card = reviewQueue[reviewIndex];
  sm2(card, quality);
  logReview(quality >= 3);

  // Update in appData
  const idx = appData.cards.findIndex(c => c.id === card.id);
  if(idx >= 0) appData.cards[idx] = card;
  saveData(appData);

  reviewIndex++;
  showReviewCard();
};

// ========== Stats Page ==========
function renderStats(){
  document.getElementById('sTotal').textContent = appData.cards.length;

  const todayLog = getTodayLog();
  document.getElementById('sToday').textContent = todayLog.reviewed;
  document.getElementById('sCorrect').textContent = todayLog.correct;
  document.getElementById('sRate').textContent = todayLog.reviewed > 0
    ? Math.round(todayLog.correct / todayLog.reviewed * 100) + '%'

  const cats = getAllCategories();

    const catCards = appData.cards.filter(c => c.category === cat);
    const mastered = catCards.filter(c => c.repetitions > 4).length;
    const total = catCards.length;
    const pct = total > 0 ? Math.round(mastered / total * 100) : 0;

      + '<div class="cat-header"><span class="cat-name">'+escHtml(cat)+'</span><span class="cat-count">已掌握 '+mastered+'/'+total+'</span></div>'

// ========== AI Add ==========
const AI_PROVIDERS = [
  { id:'deepseek', name:'DeepSeek', url:'https://api.deepseek.com/v1/chat/completions', model:'deepseek-chat' },
  { id:'openai', name:'OpenAI', url:'https://api.openai.com/v1/chat/completions', model:'gpt-4o-mini' },
  { id:'zhipu', name:'智谱AI', url:'https://open.bigmodel.cn/api/paas/v4/chat/completions', model:'glm-4-flash' },
  { id:'moonshot', name:'Moonshot', url:'https://api.moonshot.cn/v1/chat/completions', model:'moonshot-v1-8k' },
  { id:'ollama', name:'Ollama(本地)', url:'http://localhost:11434/v1/chat/completions', model:'qwen2.5:14b' }
];
let selectedProvider = null;

function renderAiProviderBar(){
  const bar = document.getElementById('aiProviderBar');
  bar.innerHTML = AI_PROVIDERS.map(p =>
    '<button class="ai-provider-btn'+(selectedProvider===p.id?' active':'')+'" onclick="selectAiProvider(\''+p.id+'\')">'+p.name+'</button>'
  ).join('');
}

function loadAiConfig(){
  try{
    const raw = localStorage.getItem('ai_config');
    if(raw){
      const cfg = JSON.parse(raw);
      if(cfg.providerId){
        selectedProvider = cfg.providerId;
        const p = AI_PROVIDERS.find(x => x.id === cfg.providerId);
        if(cfg.apiKey) document.getElementById('aiApiKey').value = cfg.apiKey;
        if(cfg.url) document.getElementById('aiApiUrl').value = cfg.url;
        if(cfg.model) document.getElementById('aiModel').value = cfg.model;
      }
    }
  }catch(e){}
  renderAiProviderBar();
}

window.selectAiProvider = function(id){
  selectedProvider = id;
  const p = AI_PROVIDERS.find(x => x.id === id);
  document.getElementById('aiApiUrl').value = p.url;
  document.getElementById('aiModel').value = p.model;
  renderAiProviderBar();
};

window.toggleAiKeyVisibility = function(){
  const inp = document.getElementById('aiApiKey');
  inp.type = inp.type === 'password' ? 'text' : 'password';
};

window.saveAiConfig = function(){
  const cfg = {
    providerId: selectedProvider,
    apiKey: document.getElementById('aiApiKey').value.trim(),
    url: document.getElementById('aiApiUrl').value.trim(),
    model: document.getElementById('aiModel').value.trim()
  };
  localStorage.setItem('ai_config', JSON.stringify(cfg));
  showToast('AI配置已保存');
};

window.handleAiFileUpload = function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    document.getElementById('aiTextInput').value = ev.target.result;
  };
  reader.readAsText(file);
  e.target.value = '';
};

window.aiGenerate = async function(){
  const text = document.getElementById('aiTextInput').value.trim();
  if(!text){ showToast('请输入或上传文本内容'); return; }

  const apiKey = document.getElementById('aiApiKey').value.trim();
  const apiUrl = document.getElementById('aiApiUrl').value.trim();
  const model = document.getElementById('aiModel').value.trim();
  const category = document.getElementById('aiCategory').value.trim() || '默认';

  if(!apiUrl || !model){ showToast('请先配置 AI 服务'); return; }
  if(selectedProvider !== 'ollama' && !apiKey){ showToast('请输入 API Key'); return; }

  // Save config first
  saveAiConfig();

  // Split text into chunks (~5000 chars)
  const CHUNK_SIZE = 5000;
  const chunks = [];
  for(let i = 0; i < text.length; i += CHUNK_SIZE){
    chunks.push(text.substring(i, i + CHUNK_SIZE));
  }

  const btn = document.getElementById('aiGenerateBtn');
  btn.disabled = true;
  btn.textContent = '生成中...';
  btn.style.opacity = '.6';

  const progressDiv = document.getElementById('aiProgress');
  progressDiv.classList.add('show');
  const progressBar = document.getElementById('aiProgressBar');
  const progressText = document.getElementById('aiProgressText');

  let allResults = [];
  let hasError = false;

  for(let i = 0; i < chunks.length; i++){
    progressText.textContent = '处理第 '+(i+1)+'/'+chunks.length+' 段...';
    progressBar.style.width = Math.round(((i) / chunks.length) * 100) + '%';

    const prompt = '请分析以下教材内容，提取重要知识点生成问答对。\n要求：\n1. 问题应是考试常见问法，答案准确完整\n2. 每个问题聚焦一个知识点\n3. 覆盖定义、定理、公式、重要结论\n4. 最多生成15个问答对\n内容：\n' + chunks[i] + '\n严格以JSON数组输出：[{"question":"问题","answer":"答案"}]';

    try{
      const headers = { 'Content-Type':'application/json' };
      if(apiKey) headers['Authorization'] = 'Bearer ' + apiKey;

      const resp = await fetch(apiUrl, {
        method:'POST',
        headers: headers,
        body: JSON.stringify({
          model: model,
          messages: [{ role:'user', content: prompt }],
          temperature: 0.3,
          max_tokens: 4096
        })
      });

      if(!resp.ok){
        throw new Error('API返回错误: ' + resp.status + ' ' + resp.statusText);
      }

      const data = await resp.json();
      const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if(!content) throw new Error('AI返回内容为空');

      // Parse JSON from response (may have markdown code fences)
      let jsonStr = content.trim();
      const fenceMatch = jsonStr.match(/```(?:json)?\s*([\s\S]*?)```/);
      if(fenceMatch) jsonStr = fenceMatch[1].trim();
      // Try to extract array
      const arrStart = jsonStr.indexOf('[');
      const arrEnd = jsonStr.lastIndexOf(']');
      if(arrStart >= 0 && arrEnd > arrStart){
        jsonStr = jsonStr.substring(arrStart, arrEnd + 1);
      }

      const parsed = JSON.parse(jsonStr);
      if(Array.isArray(parsed)){
        parsed.forEach(item => {
          if(item.question && item.answer){
            allResults.push({ question: item.question, answer: item.answer });
          }
        });
      }
    }catch(err){
      console.error('AI generation error for chunk '+(i+1)+':', err);
      if(err.message && (err.message.includes('Failed to fetch') || err.message.includes('NetworkError') || err.message.includes('CORS') || err.message.includes('TypeError'))){
        showToast('网络请求失败，可能是CORS跨域限制。请确认API服务支持浏览器直接调用。');
        hasError = true;
        break;
      } else {
        showToast('第'+(i+1)+'段处理失败: ' + err.message);
        hasError = true;
      }
    }
  }

  progressBar.style.width = '100%';
  progressText.textContent = '完成！共生成 ' + allResults.length + ' 个问答对';

  // Deduplicate by question
  const seen = new Set();
  const unique = allResults.filter(item => {
    const key = item.question.trim();
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  // Show preview
  const preview = document.getElementById('aiResultPreview');
  if(unique.length > 0){
    let html = '<div style="font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text)">生成结果预览（共'+unique.length+'个）</div>';
    unique.forEach((item, idx) => {
      html += '<div class="ai-result-item">'
        + '<div class="ai-q">'+(idx+1)+'. '+escHtml(item.question)+'</div>'
        + '<div class="ai-a">'+escHtml(item.answer)+'</div>'
        + '</div>';
    });
    html += '<button class="btn btn-primary" onclick="confirmAiAdd()" style="margin-top:12px">全部添加为卡片</button>';
    preview.innerHTML = html;
    preview.classList.add('show');
    // Store temp results
    window._aiTempResults = unique;
    window._aiTempCategory = category;
  } else {
    preview.innerHTML = '<div style="font-size:13px;color:var(--text-secondary);text-align:center;padding:20px">未能生成任何问答对</div>';
    preview.classList.add('show');
  }

  btn.disabled = false;
  btn.textContent = '🤖 AI智能生成';
  btn.style.opacity = '1';
};

window.confirmAiAdd = function(){
  const results = window._aiTempResults;
  const category = window._aiTempCategory;
  if(!results || !results.length) return;

  let count = 0;
  results.forEach(item => {
    appData.cards.push({
      id: uuid(),
      question: item.question,
      answer: item.answer,
      category: category,
      easiness: 2.5,
      interval: 0,
      repetitions: 0,
      next_review: new Date().toISOString(),
      last_review: null,
      created_at: new Date().toISOString(),
      correct_count: 0,
      incorrect_count: 0
    });
    count++;
  });
  saveData(appData);
  showToast('成功添加 '+count+' 张卡片');
  document.getElementById('aiResultPreview').classList.remove('show');
  document.getElementById('aiTextInput').value = '';
  window._aiTempResults = null;
};

// ========== Batch Manage ==========
let batchSelected = new Set();
let manageFilter = '全部';
let manageSearchQuery = '';

function renderManage(){
  batchSelected.clear();
  document.getElementById('batchSelectAll').checked = false;
  renderManageFilters();
  renderBatchList();
  renderBatchActionBar();
}

function renderManageFilters(){
  const cats = getAllCategories();
  const bar = document.getElementById('manageFilterBar');
  let html = '<button class="filter-btn '+(manageFilter==='全部'?'active':'')+'" onclick="setManageFilter(\'全部\')">全部</button>';
  cats.forEach(c => {
    html += '<button class="filter-btn '+(manageFilter===c?'active':'')+'" onclick="setManageFilter(\''+c.replace(/'/g,"\\'")+'\')">'+c+'</button>';
  });
  bar.innerHTML = html;
}

window.setManageFilter = function(f){
  manageFilter = f;
  renderManageFilters();
  renderBatchList();
};

document.getElementById('manageSearchInput').addEventListener('input', function(){
  manageSearchQuery = this.value.trim();
  renderBatchList();
});

function getFilteredManageCards(){
  let cards = appData.cards.slice();
  if(manageFilter !== '全部'){
    cards = cards.filter(c => c.category === manageFilter);
  }
  if(manageSearchQuery){
    const q = manageSearchQuery.toLowerCase();
    cards = cards.filter(c =>
      c.question.toLowerCase().includes(q) ||
      c.answer.toLowerCase().includes(q) ||
      (c.category && c.category.toLowerCase().includes(q))
    );
  }
  return cards;
}

function renderBatchList(){
  const cards = getFilteredManageCards();
  const list = document.getElementById('batchCardList');

  if(cards.length === 0){
    list.innerHTML = '<div class="empty"><p>'+(appData.cards.length===0?'还没有卡片':'没有找到匹配的卡片')+'</p></div>';
    updateBatchCount();
    return;
  }

  let html = '';
  cards.forEach(c => {
    const checked = batchSelected.has(c.id) ? 'checked' : '';
    html += '<div class="batch-card-item">'
      + '<input type="checkbox" data-id="'+c.id+'" '+checked+' onchange="toggleBatchItem(\''+c.id+'\')">'
      + '<div class="batch-card-body">'
      + '<div class="bc-q">'+escHtml(c.question)+'</div>'
      + '<div class="bc-a">'+escHtml(c.answer)+'</div>'
      + '<div class="bc-meta">'
      + (c.category ? '<span class="tag">'+escHtml(c.category)+'</span>' : '')
      + '<span style="font-size:11px;color:var(--text-light)">复习 '+c.repetitions+' 次</span>'
      + '</div></div></div>';
  });
  list.innerHTML = html;
  updateBatchCount();
}

function updateBatchCount(){
  document.getElementById('batchCount').textContent = '已选 ' + batchSelected.size + ' 张';
  renderBatchActionBar();
}

window.toggleBatchItem = function(id){
  if(batchSelected.has(id)) batchSelected.delete(id);
  else batchSelected.add(id);

  // Update checkbox in DOM
  const cb = document.querySelector('.batch-card-item input[data-id="'+id+'"]');
  if(cb) cb.checked = batchSelected.has(id);

  // Update select-all
  const allCards = getFilteredManageCards();
  document.getElementById('batchSelectAll').checked = allCards.length > 0 && allCards.every(c => batchSelected.has(c.id));

  updateBatchCount();
};

window.toggleBatchSelectAll = function(){
  const allCards = getFilteredManageCards();
  const checked = document.getElementById('batchSelectAll').checked;
  batchSelected.clear();
  if(checked){
    allCards.forEach(c => batchSelected.add(c.id));
  }
  // Update all checkboxes
  document.querySelectorAll('.batch-card-item input[type=checkbox]').forEach(cb => {
    cb.checked = batchSelected.has(cb.dataset.id);
  });
  updateBatchCount();
};

function renderBatchActionBar(){
  const bar = document.getElementById('batchActionBar');
  if(batchSelected.size === 0){
    bar.innerHTML = '';
    return;
  }
  bar.innerHTML =
    '<button class="btn btn-danger" onclick="batchDelete()">批量删除</button>'
    + '<button class="btn btn-secondary" onclick="batchChangeCategory()">修改分类</button>'
    + '<button class="btn btn-outline" onclick="batchResetProgress()">重置进度</button>'
    + '<button class="btn btn-success" onclick="batchExportSelected()">导出JSON</button>';
}

window.batchDelete = function(){
  showConfirm('确定要删除选中的 '+batchSelected.size+' 张卡片吗？此操作不可恢复。', function(){
    appData.cards = appData.cards.filter(c => !batchSelected.has(c.id));
    saveData(appData);
    batchSelected.clear();
    renderManage();
    showToast('已删除');
  });
};

window.batchChangeCategory = function(){
  // Show a simple prompt-like modal using confirm overlay style
  const newCat = prompt('请输入新的分类名称：');
  if(newCat === null) return;
  const cat = newCat.trim();
  if(!cat){ showToast('分类不能为空'); return; }
  let count = 0;
  appData.cards.forEach(c => {
    if(batchSelected.has(c.id)){
      c.category = cat;
      count++;
    }
  });
  saveData(appData);
  batchSelected.clear();
  renderManage();
  showToast('已修改 '+count+' 张卡片的分类');
};

window.batchResetProgress = function(){
  showConfirm('确定要重置选中卡片的复习进度吗？', function(){
    let count = 0;
    appData.cards.forEach(c => {
      if(batchSelected.has(c.id)){
        c.repetitions = 0;
        c.interval = 0;
        c.easiness = 2.5;
        c.next_review = new Date().toISOString();
        c.last_review = null;
        c.correct_count = 0;
        c.incorrect_count = 0;
        count++;
      }
    });
    saveData(appData);
    batchSelected.clear();
    renderManage();
    showToast('已重置 '+count+' 张卡片的进度');
  });
};

window.batchExportSelected = function(){
  const exportCards = appData.cards.filter(c => batchSelected.has(c.id)).map(c => ({
    question: c.question,
    answer: c.answer,
    category: c.category
  }));
  const blob = new Blob([JSON.stringify(exportCards, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '记忆卡_选中导出_' + getTodayStr() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出 '+exportCards.length+' 张卡片');
};

// ========== Utility ==========
function escHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ========== Init ==========
loadAiConfig();
renderHome();

})();
