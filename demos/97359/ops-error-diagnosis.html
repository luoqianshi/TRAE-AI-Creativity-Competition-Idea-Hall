// ===== 状态管理 =====
let uploadedImages = [];
let history = JSON.parse(localStorage.getItem('ops_diagnosis_history') || '[]');

// ===== 初始化 =====
updateModelOptions();
renderHistory();

// 拖拽上传
document.getElementById('upload-zone').addEventListener('dragover', e => {
  e.preventDefault();
  e.currentTarget.classList.add('dragover');
});
document.getElementById('upload-zone').addEventListener('dragleave', e => {
  e.currentTarget.classList.remove('dragover');
});
document.getElementById('upload-zone').addEventListener('drop', e => {
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});

// ===== 图片处理 =====
function handleFiles(files) {
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      uploadedImages.push({ name: file.name, data: e.target.result });
      renderImages();
    };
    reader.readAsDataURL(file);
  });
}

function renderImages() {
  const container = document.getElementById('image-preview-list');
  container.innerHTML = uploadedImages.map((img, i) => `
    <div class="image-preview">
      <img src="${img.data}" alt="${img.name}" onclick="openModal('${img.data}')" style="cursor:zoom-in">
      <button class="remove" onclick="removeImage(${i})">&times;</button>
    </div>
  `).join('');
}

function removeImage(index) {
  uploadedImages.splice(index, 1);
  renderImages();
}

function openModal(src) {
  document.getElementById('modal-img').src = src;
  document.getElementById('img-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('img-modal').classList.remove('active');
}

// ===== 配置面板 =====
function toggleConfig() {
  document.getElementById('config-body').classList.toggle('open');
  document.getElementById('config-chevron').classList.toggle('open');
}

function updateModelOptions() {
  const provider = document.getElementById('provider').value;
  const modelSelect = document.getElementById('model');
  const customModelInput = document.getElementById('custom-model');
  const urlInput = document.getElementById('api-url');

  const presets = {
    openai: {
      url: 'https://api.openai.com/v1/chat/completions',
      models: ['gpt-4o','gpt-4o-mini','gpt-4-turbo','gpt-3.5-turbo']
    },
    azure: {
      url: 'https://<your-resource>.openai.azure.com/openai/deployments/<deployment>/chat/completions?api-version=2024-02-01',
      models: ['gpt-4o','gpt-4','gpt-35-turbo']
    },
    anthropic: {
      url: 'https://api.anthropic.com/v1/messages',
      models: ['claude-3-opus','claude-3-sonnet','claude-3-haiku']
    },
    google: {
      url: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent',
      models: ['gemini-pro','gemini-1.5-pro']
    },
    custom: {
      url: '',
      models: ['自定义']
    }
  };

  const preset = presets[provider];
  if (preset) {
    if (urlInput.value === '' || Object.values(presets).some(p => p.url === urlInput.value)) {
      urlInput.value = preset.url;
    }
    modelSelect.innerHTML = preset.models.map(m => `<option value="${m}">${m}</option>`).join('');
  }

  if (provider === 'custom') {
    customModelInput.style.display = 'block';
    modelSelect.style.display = 'none';
  } else {
    customModelInput.style.display = 'none';
    modelSelect.style.display = 'block';
  }
}

async function testConnection() {
  const status = document.getElementById('test-status');
  status.textContent = '测试中...';
  status.style.color = 'var(--muted)';

  const apiKey = document.getElementById('api-key').value.trim();
  if (!apiKey) {
    status.textContent = '请先填写 API Key';
    status.style.color = 'var(--error)';
    return;
  }

  // 实际测试连接
  const provider = document.getElementById('provider').value;
  const url = document.getElementById('api-url').value.trim();

  try {
    if (provider === 'openai' || provider === 'custom') {
      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: document.getElementById('model').value,
          messages: [{ role: 'user', content: 'hi' }],
          max_tokens: 5
        })
      });
      if (res.ok) {
        status.textContent = '连接成功';
        status.style.color = 'var(--success)';
      } else {
        const err = await res.json().catch(() => ({}));
        status.textContent = `连接失败: ${err.error?.message || res.statusText}`;
        status.style.color = 'var(--error)';
      }
    } else {
      status.textContent = '该提供商暂不支持自动测试，请直接发起诊断';
      status.style.color = 'var(--warning)';
    }
  } catch (e) {
    status.textContent = `请求异常: ${e.message}`;
    status.style.color = 'var(--error)';
  }
}

// ===== 诊断核心 =====
async function startDiagnosis() {
  const input = document.getElementById('error-input').value.trim();
  if (!input && uploadedImages.length === 0) {
    showToast('请输入报错内容或上传截图');
    return;
  }

  const apiKey = document.getElementById('api-key').value.trim();
  const apiUrl = document.getElementById('api-url').value.trim();
  if (!apiKey || !apiUrl) {
    showToast('请先配置大模型 API 信息');
    toggleConfig();
    return;
  }

  document.getElementById('result-empty').style.display = 'none';
  document.getElementById('result-content').classList.remove('active');
  document.getElementById('result-loading').style.display = 'flex';
  document.getElementById('diagnose-btn').disabled = true;

  const modelVal = document.getElementById('provider').value === 'custom'
    ? document.getElementById('custom-model').value
    : document.getElementById('model').value;

  const temperature = parseFloat(document.getElementById('temperature').value) || 0.3;
  const maxTokens = parseInt(document.getElementById('max-tokens').value) || 4096;

  const systemPrompt = `你是一位资深运维专家，擅长分析和解决各种线上报错问题。请根据用户提供的报错信息（支持文本日志和截图），按以下结构输出诊断结果：

1. **问题概述**：简要总结这是什么类型的错误
2. **错误原因**：详细分析导致该错误的根本原因
3. **影响范围**：说明可能影响的服务或功能
4. **解决方案**：提供具体的修复步骤，包括代码示例或命令
5. **预防措施**：给出避免类似问题再次发生的建议

请用中文回答，保持专业但易懂。如果信息不足，请说明需要补充哪些信息。`;

  let messages = [
    { role: 'system', content: systemPrompt }
  ];

  // 构建用户消息（支持多模态）
  if (uploadedImages.length > 0 && (apiUrl.includes('openai') || apiUrl.includes('custom'))) {
    // OpenAI 兼容的多模态格式
    const content = [];
    if (input) content.push({ type: 'text', text: input });
    uploadedImages.forEach(img => {
      content.push({
        type: 'image_url',
        image_url: { url: img.data, detail: 'high' }
      });
    });
    messages.push({ role: 'user', content });
  } else {
    let text = input;
    if (uploadedImages.length > 0) {
      text += '\n\n[用户还上传了 ' + uploadedImages.length + ' 张截图，但当前模型/配置不支持图片分析]';
    }
    messages.push({ role: 'user', content: text });
  }

  try {
    const res = await fetch(apiUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: modelVal,
        messages,
        temperature,
        max_tokens: maxTokens
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || data.content?.[0]?.text || JSON.stringify(data);

    renderResult(reply);
    addToHistory(input || '[图片诊断]', reply);
    document.getElementById('result-status').innerHTML = '<span class="tag tag-success">诊断完成</span>';
  } catch (e) {
    renderError(e.message);
    document.getElementById('result-status').innerHTML = '<span class="tag tag-error">诊断失败</span>';
  } finally {
    document.getElementById('result-loading').style.display = 'none';
    document.getElementById('diagnose-btn').disabled = false;
  }
}

function renderResult(content) {
  const body = document.getElementById('diagnosis-body');
  // 简单的 Markdown 解析
  let html = escapeHtml(content)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/## (.+)/g, '<h3 style="color:var(--accent);margin:1rem 0 0.5rem">$1</h3>')
    .replace(/### (.+)/g, '<h4 style="color:var(--accent2);margin:0.75rem 0 0.4rem">$1</h4>')
    .replace(/```(\w+)?\n([\s\S]*?)```/g, '<div style="position:relative"><button class="copy-btn" onclick="copyCode(this)">复制</button><pre class="code-block"><code>$2</code></pre></div>')
    .replace(/`([^`]+)`/g, '<code style="background:var(--bg3);padding:2px 6px;border-radius:4px;font-size:0.85em">$1</code>')
    .replace(/\n/g, '<br>');

  body.innerHTML = html;
  document.getElementById('result-content').classList.add('active');
}

function renderError(msg) {
  document.getElementById('diagnosis-body').innerHTML = `
    <div class="diagnosis-step">
      <div class="diagnosis-step-header">
        <span style="color:var(--error)">请求失败</span>
      </div>
      <div class="step-content" style="color:var(--error)">
        ${escapeHtml(msg)}
        <br><br>
        建议检查：
        <ul style="margin-top:0.5rem;padding-left:1.5rem">
          <li>API Key 是否正确</li>
          <li>API 地址是否可达</li>
          <li>模型名称是否有效</li>
          <li>网络连接是否正常</li>
        </ul>
      </div>
    </div>
  `;
  document.getElementById('result-content').classList.add('active');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function copyCode(btn) {
  const code = btn.nextElementSibling.textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '已复制';
    setTimeout(() => btn.textContent = '复制', 1500);
  });
}

// ===== 历史记录 =====
function addToHistory(title, result) {
  const item = {
    id: Date.now(),
    title: title.slice(0, 60) + (title.length > 60 ? '...' : ''),
    time: new Date().toLocaleString('zh-CN'),
    result
  };
  history.unshift(item);
  if (history.length > 20) history = history.slice(0, 20);
  localStorage.setItem('ops_diagnosis_history', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const container = document.getElementById('history-list');
  if (history.length === 0) {
    container.innerHTML = '<div class="result-empty" style="min-height:120px"><div>暂无诊断记录</div></div>';
    return;
  }
  container.innerHTML = history.map(h => `
    <div class="history-item" onclick="loadHistory(${h.id})">
      <div>
        <div class="history-title">${escapeHtml(h.title)}</div>
        <div class="history-meta">${h.time}</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted);flex-shrink:0">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </div>
  `).join('');
}

function loadHistory(id) {
  const item = history.find(h => h.id === id);
  if (!item) return;
  document.getElementById('result-empty').style.display = 'none';
  document.getElementById('result-loading').style.display = 'none';
  renderResult(item.result);
  document.getElementById('result-status').innerHTML = '<span class="tag tag-success">历史记录</span>';
}

function clearHistory() {
  history = [];
  localStorage.removeItem('ops_diagnosis_history');
  renderHistory();
}

// ===== 工具函数 =====
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function clearAll() {
  document.getElementById('error-input').value = '';
  uploadedImages = [];
  renderImages();
  document.getElementById('result-content').classList.remove('active');
  document.getElementById('result-empty').style.display = 'flex';
  document.getElementById('result-status').innerHTML = '';
}

function loadExample() {
  document.getElementById('error-input').value = `Exception in thread "main" java.lang.OutOfMemoryError: Java heap space
    at java.base/java.util.Arrays.copyOf(Arrays.java:3481)
    at java.base/java.util.ArrayList.grow(ArrayList.java:237)
    at java.base/java.util.ArrayList.grow(ArrayList.java:244)
    at java.base/java.util.ArrayList.add(ArrayList.java:483)
    at java.base/java.util.ArrayList.add(ArrayList.java:496)
    at com.myapp.DataProcessor.processBatch(DataProcessor.java:89)
    at com.myapp.DataProcessor.run(DataProcessor.java:45)
    at com.myapp.Main.main(Main.java:23)`;
}

// Enter 快捷键
window.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') startDiagnosis();
});
</script>
