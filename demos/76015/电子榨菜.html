<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电子榨菜搭子</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #FFF5E6;
            background-image: 
                radial-gradient(#FFD9B3 1px, transparent 1px),
                radial-gradient(#FFD9B3 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 手机外壳 */
        .phone-frame {
            width: 375px;
            height: 720px;
            background: #FFFBF5;
            border-radius: 36px;
            box-shadow: 
                0 20px 50px rgba(255, 126, 63, 0.2),
                0 0 0 3px #2D1B0E;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        /* 状态栏 */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 700;
            color: #2D1B0E;
            flex-shrink: 0;
            background: #FFFBF5;
        }

        /* 导航栏 */
        .nav-bar {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            background: #FFFBF5;
            border-bottom: 2px dashed #FFD9B3;
            z-index: 10;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 800;
            color: #2D1B0E;
            letter-spacing: 1px;
        }

        .nav-back {
            position: absolute;
            left: 16px;
            font-size: 18px;
            font-weight: 800;
            color: #FF7E3F;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FFF0E0;
            border: 2px solid #FF7E3F;
            border-radius: 12px;
            transition: all 0.15s;
            z-index: 11;
        }

        .nav-back:active {
            transform: scale(0.95);
            background: #FFE0CC;
        }

        /* 页面容器 */
        .page-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            background: #FFFBF5;
        }

        .page {
            display: none;
            height: 100%;
            flex-direction: column;
        }

        .page.active {
            display: flex;
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ========== 首页样式 ========== */
        .home-header {
            padding: 28px 24px 20px;
            position: relative;
            background: linear-gradient(180deg, #FFF0E0 0%, #FFFBF5 100%);
            border-bottom: 2px dashed #FFD9B3;
        }

        .home-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #FF7E3F;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            border-radius: 20px;
            margin-bottom: 12px;
            transform: rotate(-2deg);
        }

        .home-title {
            font-size: 32px;
            font-weight: 900;
            color: #2D1B0E;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .home-title span {
            color: #FF7E3F;
            position: relative;
        }

        .home-title span::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 0;
            width: 100%;
            height: 6px;
            background: #FFE082;
            z-index: -1;
            border-radius: 3px;
        }

        .home-subtitle {
            font-size: 14px;
            color: #7A5C45;
            line-height: 1.6;
            font-weight: 500;
        }

        .section {
            padding: 20px 20px 10px;
            position: relative;
            z-index: 1;
        }

        .section-title {
            font-size: 16px;
            font-weight: 800;
            color: #2D1B0E;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 6px;
            height: 20px;
            background: #FF7E3F;
            border-radius: 3px;
        }

        /* 时长选择 */
        .duration-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .duration-item {
            padding: 16px 6px;
            background: #fff;
            border: 2.5px solid #FFD9B3;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #FFD9B3;
        }

        .duration-item:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #FFD9B3;
        }

        .duration-item.active {
            background: #FF7E3F;
            border-color: #E66A2B;
            color: #fff;
            box-shadow: 0 4px 0 #E66A2B;
            transform: translateY(-2px);
        }

        .duration-item.active .duration-unit {
            color: rgba(255,255,255,0.9);
        }

        .duration-num {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 2px;
        }

        .duration-unit {
            font-size: 12px;
            color: #7A5C45;
            font-weight: 600;
        }

        /* 口味卡片 */
        .flavor-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .flavor-item {
            padding: 18px 14px;
            background: #fff;
            border: 2.5px solid #FFD9B3;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #FFD9B3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .flavor-item:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #FFD9B3;
        }

        .flavor-item.active {
            background: #FFF0E0;
            border-color: #FF7E3F;
            box-shadow: 0 4px 0 #FF7E3F;
            transform: translateY(-2px);
        }

        .flavor-emoji {
            font-size: 32px;
        }

        .flavor-text {
            font-size: 14px;
            font-weight: 700;
            color: #2D1B0E;
        }

        .start-btn {
            margin: 10px 0 24px;
            height: 56px;
            background: #FF7E3F;
            color: #fff;
            border: 3px solid #E66A2B;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 6px 0 #E66A2B;
            letter-spacing: 2px;
            width: 100%;
            position: relative;
            z-index: 3;
        }

        .start-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #E66A2B;
        }

        .start-btn:disabled {
            background: #D4C4B5;
            border-color: #B8A898;
            box-shadow: 0 6px 0 #B8A898;
            cursor: not-allowed;
            color: #fff;
        }

        /* ========== 匹配页样式 ========== */
        .match-page {
            justify-content: center;
            align-items: center;
            padding: 40px 30px;
            text-align: center;
            background: #FFF5E6;
        }

        .match-bowl {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #fff;
            border: 4px solid #FF7E3F;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            margin-bottom: 32px;
            box-shadow: 0 8px 0 #FFD9B3;
            animation: bowlBounce 1.2s ease-in-out infinite;
            position: relative;
        }

        .match-bowl::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 20px;
            background: #FFE082;
            border-radius: 5px;
            animation: steam 1.5s ease-in-out infinite;
            opacity: 0;
        }

        .match-bowl::after {
            content: '';
            position: absolute;
            top: -25px;
            left: calc(50% + 15px);
            width: 8px;
            height: 16px;
            background: #FFE082;
            border-radius: 4px;
            animation: steam 1.5s ease-in-out infinite 0.5s;
            opacity: 0;
        }

        @keyframes bowlBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-8px) rotate(-3deg); }
            75% { transform: translateY(-8px) rotate(3deg); }
        }

        @keyframes steam {
            0% { opacity: 0; transform: translateY(0) scale(1); }
            50% { opacity: 0.8; transform: translateY(-10px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-20px) scale(0.8); }
        }

        .match-text {
            font-size: 22px;
            font-weight: 800;
            color: #2D1B0E;
            margin-bottom: 10px;
        }

        .match-desc {
            font-size: 14px;
            color: #7A5C45;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .match-tags {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .match-tag {
            padding: 6px 14px;
            background: #FFF0E0;
            border: 2px solid #FF7E3F;
            border-radius: 20px;
            font-size: 13px;
            color: #FF7E3F;
            font-weight: 700;
        }

        .match-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .match-dots span {
            width: 12px;
            height: 12px;
            background: #FF7E3F;
            border-radius: 50%;
            animation: dotJump 1s ease-in-out infinite;
            border: 2px solid #E66A2B;
        }

        .match-dots span:nth-child(2) { animation-delay: 0.15s; }
        .match-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes dotJump {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ========== 播放页样式 ========== */
        .player-page {
            flex-direction: column;
            background: #1A0F08;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: rgba(45, 27, 14, 0.9);
            color: #fff;
            flex-shrink: 0;
            position: relative;
            z-index: 5;
            border-bottom: 2px solid #3D2817;
        }

        .player-title {
            font-size: 14px;
            font-weight: 700;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-countdown {
            font-size: 13px;
            padding: 4px 12px;
            background: #FF7E3F;
            border-radius: 12px;
            font-weight: 700;
            border: 2px solid #E66A2B;
        }

        .player-countdown.warning {
            background: #FF4D4F;
            border-color: #CF1322;
            animation: shake 0.5s ease-in-out infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        /* 视频区域 */
        .video-area {
            flex: 1;
            position: relative;
            background: #0D0704;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-placeholder {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            position: absolute;
            z-index: 1;
        }

        .video-placeholder-icon {
            font-size: 64px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .video-placeholder-text {
            font-size: 14px;
            font-weight: 500;
        }

        /* 弹幕层 - 修复：确保层级在视频之上 */
        .danmaku-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }

        /* 弹幕项 - 修复动画逻辑 */
        .danmaku-item {
            position: absolute;
            white-space: nowrap;
            font-weight: 600;
            text-shadow: 1.5px 1.5px 0 rgba(0, 0, 0, 0.85);
            left: 100%; /* 从屏幕右侧外开始 */
            animation-name: danmakuScroll;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        @keyframes danmakuScroll {
            0% {
                left: 100%; /* 起始：在容器右侧外面 */
                transform: translateX(0);
            }
            100% {
                left: 0; /* 结束：文字完全移出左侧 */
                transform: translateX(-100%);
            }
        }

        /* 控制栏 */
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 16px 20px;
            background: rgba(45, 27, 14, 0.95);
            color: #fff;
            flex-shrink: 0;
            border-top: 2px solid #3D2817;
        }

        .control-btn {
            font-size: 12px;
            color: #FFD9B3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.15s;
            font-weight: 600;
        }

        .control-btn:active {
            transform: scale(0.9);
            color: #FF7E3F;
        }

        .control-icon {
            font-size: 24px;
        }

        /* ========== 结束页样式 ========== */
        .end-page {
            padding: 36px 24px;
            align-items: center;
            text-align: center;
            background: #FFF5E6;
        }

        .end-sticker {
            width: 100px;
            height: 100px;
            background: #fff;
            border: 4px solid #FF7E3F;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin-bottom: 20px;
            box-shadow: 0 6px 0 #FFD9B3;
            transform: rotate(-5deg);
            animation: stickerPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes stickerPop {
            0% { transform: rotate(-15deg) scale(0); }
            100% { transform: rotate(-5deg) scale(1); }
        }

        .end-title {
            font-size: 26px;
            font-weight: 900;
            color: #2D1B0E;
            margin-bottom: 8px;
        }

        .end-desc {
            font-size: 14px;
            color: #7A5C45;
            margin-bottom: 28px;
            line-height: 1.6;
            font-weight: 500;
        }

        .summary-card {
            width: 100%;
            background: #fff;
            border: 3px solid #FF7E3F;
            border-radius: 20px;
            padding: 24px 20px;
            margin-bottom: 28px;
            box-shadow: 0 8px 0 #FFD9B3;
            position: relative;
        }

        .summary-card::before {
            content: '下饭报告';
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            background: #FF7E3F;
            color: #fff;
            padding: 4px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .card-item {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            margin-bottom: 12px;
            color: #2D1B0E;
            font-weight: 600;
            padding-bottom: 10px;
            border-bottom: 1px dashed #FFD9B3;
        }

        .card-item:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .card-score {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 2px dashed #FFD9B3;
            text-align: center;
        }

        .score-num {
            font-size: 40px;
            font-weight: 900;
            color: #FF7E3F;
            line-height: 1;
            margin-bottom: 4px;
        }

        .score-label {
            font-size: 13px;
            color: #7A5C45;
            font-weight: 600;
        }

        .back-home-btn {
            width: 100%;
            height: 54px;
            background: #fff;
            color: #FF7E3F;
            border: 3px solid #FF7E3F;
            border-radius: 18px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 5px 0 #FF7E3F;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
        }

        .back-home-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #FF7E3F;
        }

        /* 滚动条 */
        .page-container::-webkit-scrollbar {
            width: 4px;
        }

        .page-container::-webkit-scrollbar-thumb {
            background: #FFD9B3;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>9:41</span>
            <span>📶 🔋</span>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="nav-back" id="navBack" style="display:none;" onclick="goBack()">←</div>
            <div class="nav-title" id="navTitle">电子榨菜搭子</div>
        </div>

        <!-- 页面内容 -->
        <div class="page-container">
            <!-- 首页 -->
            <div class="page active" id="pageHome">
                <div class="home-header">
                    <div class="home-badge">🍱 干饭人专属</div>
                    <div class="home-title">电子<span>榨菜</span>搭子</div>
                    <div class="home-subtitle">精准匹配吃饭时长<br>饭吃完刚好结束，绝不超时</div>
                </div>
                
                <div class="section">
                    <div class="section-title">吃饭时长</div>
                    <div class="duration-grid">
                        <div class="duration-item" data-duration="10" onclick="selectDuration(this)">
                            <div class="duration-num">10</div>
                            <div class="duration-unit">分钟</div>
                        </div>
                        <div class="duration-item" data-duration="15" onclick="selectDuration(this)">
                            <div class="duration-num">15</div>
                            <div class="duration-unit">分钟</div>
                        </div>
                        <div class="duration-item" data-duration="20" onclick="selectDuration(this)">
                            <div class="duration-num">20</div>
                            <div class="duration-unit">分钟</div>
                        </div>
                        <div class="duration-item" data-duration="30" onclick="selectDuration(this)">
                            <div class="duration-num">30</div>
                            <div class="duration-unit">分钟</div>
                        </div>
                    </div>

                    <div class="section-title">榨菜口味</div>
                    <div class="flavor-list">
                        <div class="flavor-item" data-flavor="搞笑下饭" onclick="selectFlavor(this)">
                            <span class="flavor-emoji">😂</span>
                            <span class="flavor-text">搞笑下饭</span>
                        </div>
                        <div class="flavor-item" data-flavor="治愈纪录片" onclick="selectFlavor(this)">
                            <span class="flavor-emoji">🌿</span>
                            <span class="flavor-text">治愈纪录片</span>
                        </div>
                        <div class="flavor-item" data-flavor="爽剧切片" onclick="selectFlavor(this)">
                            <span class="flavor-emoji">🔥</span>
                            <span class="flavor-text">爽剧切片</span>
                        </div>
                        <div class="flavor-item" data-flavor="综艺名场面" onclick="selectFlavor(this)">
                            <span class="flavor-emoji">🎬</span>
                            <span class="flavor-text">综艺名场面</span>
                        </div>
                    </div>

                    <button class="start-btn" id="startBtn" disabled onclick="startMatch()">🍱 开饭啦</button>
                </div>
            </div>

            <!-- 匹配页 -->
            <div class="page match-page" id="pageMatch">
                <div class="match-bowl">🍜</div>
                <div class="match-text">正在调配你的榨菜</div>
                <div class="match-desc">保证饭吃完刚好结束～</div>
                <div class="match-tags">
                    <span class="match-tag" id="matchDurationTag">15 分钟</span>
                    <span class="match-tag" id="matchFlavorTag">搞笑下饭</span>
                </div>
                <div class="match-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <!-- 播放页 -->
            <div class="page player-page" id="pagePlayer" style="display: none; flex-direction: column;">
                <div class="player-header">
                    <div class="player-title" id="videoTitle">搞笑合集 · 今日份快乐源泉</div>
                    <div class="player-countdown" id="countdown">15:00</div>
                </div>

                <div class="video-area">
                    <div class="danmaku-layer" id="danmakuLayer"></div>
                    <div class="video-placeholder">
                        <div class="video-placeholder-icon">🎬</div>
                        <div class="video-placeholder-text">视频播放区域</div>
                    </div>
                </div>

                <div class="player-controls">
                    <div class="control-btn">
                        <span class="control-icon">👍</span>
                        <span>点赞</span>
                    </div>
                    <div class="control-btn">
                        <span class="control-icon">💬</span>
                        <span>弹幕</span>
                    </div>
                    <div class="control-btn">
                        <span class="control-icon">⏭️</span>
                        <span>下一个</span>
                    </div>
                    <div class="control-btn">
                        <span class="control-icon">⭐</span>
                        <span>收藏</span>
                    </div>
                </div>
            </div>

            <!-- 结束页 -->
            <div class="page end-page" id="pageEnd">
                <div class="end-sticker">😋</div>
                <div class="end-title">用餐愉快～</div>
                <div class="end-desc">本次电子榨菜已准时结束<br>好好吃饭，下次再来哦</div>

                <div class="summary-card">
                    <div class="card-item">
                        <span>陪伴时长</span>
                        <span id="cardDuration">15 分钟</span>
                    </div>
                    <div class="card-item">
                        <span>榨菜口味</span>
                        <span id="cardFlavor">搞笑下饭</span>
                    </div>
                    <div class="card-score">
                        <div class="score-num">98</div>
                        <div class="score-label">下饭指数</div>
                    </div>
                </div>

                <button class="back-home-btn" onclick="backToHome()">再来一份 🍱</button>
            </div>
        </div>
    </div>

    <script>
        let selectedDuration = null;
        let selectedFlavor = null;
        let countdownTimer = null;
        let remainingSeconds = 0;
        let danmakuTimer = null;
        let isPlaying = false;

        // 弹幕颜色池
        const danmakuColors = [
            '#ffffff',
            '#FFE066',
            '#FF85A2',
            '#66E0FF',
            '#FFB86C'
        ];

        // 弹幕语料库
        const danmakuLibrary = {
            '搞笑下饭': [
                '哈哈哈哈笑喷饭了', '这段太绝了', '救命我笑到打嗝',
                '下饭神片段啊', '这梗也太密了吧', '不行了笑到夹不住菜',
                '百看不厌哈哈', '这段我能看十遍', '建议吃饭时别看',
                '笑到抖腿', '嘴替啊简直是', '这段封神了',
                '我能循环一百遍', '笑到米饭从鼻子出来', '太损了哈哈',
                '接着奏乐接着舞', '从未见过如此厚颜无耻之人',
                '贾贵你个笨蛋', '黄金标你个窝囊废', '笑到邻居敲门'
            ],
            '治愈纪录片': [
                '好治愈啊', '画面太美了', '安安静静的真好',
                '看完心情都平静了', '生活的烟火气', '慢慢吃慢慢看',
                '太舒服了这种感觉', '岁月静好', '美食最治愈',
                '好想去这里', '人间烟火气最抚凡人心', '慢悠悠的生活',
                '看着就很幸福', '平凡日子里的光', '好温暖的感觉',
                '这才是生活啊', '治愈了我的内耗', '好想住在这里',
                '色香味俱全', '看饿了'
            ],
            '爽剧切片': [
                '这段太解气了', '爽到了！', '主角智商在线',
                '这段我能循环看', '太带感了', '节奏刚好',
                '吃饭就爱看这个', '不拖沓就是爽', '这段封神',
                '越看越上头', '大快人心', '干得漂亮',
                '就喜欢这种不墨迹的', '反转绝了', '全程高能',
                '看得我热血沸腾', '太燃了', '主角气场两米八',
                '这才叫爽剧', '舒服了'
            ],
            '综艺名场面': [
                '名场面来了！', '这段笑到打鸣', '经典永流传',
                '每次看都笑', '节目组太会了', '这几个人太有梗了',
                '下饭综艺天花板', '笑到米饭喷出来', '百看不厌',
                '这段我能背下来了', '前方高能预警', '笑到肚子疼',
                '建议反复观看', '这都什么神仙嘉宾', '笑出眼泪',
                '年度名场面', '太敢说了', '笑到捶桌',
                'yyds', '看一次笑一次'
            ]
        };

        const videoTitles = {
            '搞笑下饭': '搞笑合集 · 今日份快乐源泉',
            '治愈纪录片': '人间烟火 · 治愈美食纪录片',
            '爽剧切片': '高能合集 · 爽点密集剪辑',
            '综艺名场面': '综艺名场面 · 爆笑精选'
        };

        function selectDuration(el) {
            document.querySelectorAll('.duration-item').forEach(item => {
                item.classList.remove('active');
            });
            el.classList.add('active');
            selectedDuration = parseInt(el.dataset.duration);
            checkStartBtn();
        }

        function selectFlavor(el) {
            document.querySelectorAll('.flavor-item').forEach(item => {
                item.classList.remove('active');
            });
            el.classList.add('active');
            selectedFlavor = el.dataset.flavor;
            checkStartBtn();
        }

        function checkStartBtn() {
            const btn = document.getElementById('startBtn');
            btn.disabled = !(selectedDuration && selectedFlavor);
        }

        function startMatch() {
            if (!selectedDuration || !selectedFlavor) return;
            switchPage('pageMatch');
            document.getElementById('matchDurationTag').textContent = `${selectedDuration} 分钟`;
            document.getElementById('matchFlavorTag').textContent = selectedFlavor;
            document.getElementById('navBack').style.display = 'flex';
            document.getElementById('navTitle').textContent = '调配中';

            setTimeout(() => {
                enterPlayer();
            }, 2500);
        }

        function enterPlayer() {
            switchPage('pagePlayer');
            document.getElementById('pagePlayer').style.display = 'flex';
            document.getElementById('navTitle').textContent = '陪看中';
            document.getElementById('videoTitle').textContent = videoTitles[selectedFlavor];

            remainingSeconds = selectedDuration * 60;
            updateCountdownDisplay();
            isPlaying = true;
            startCountdown();
            startDanmaku();
        }

        function startCountdown() {
            countdownTimer = setInterval(() => {
                remainingSeconds--;
                updateCountdownDisplay();
                if (remainingSeconds <= 0) {
                    clearInterval(countdownTimer);
                    clearInterval(danmakuTimer);
                    endSession();
                }
            }, 1000);
        }

        function updateCountdownDisplay() {
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            const timeStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            const el = document.getElementById('countdown');
            el.textContent = timeStr;
            if (remainingSeconds <= 60) {
                el.classList.add('warning');
            } else {
                el.classList.remove('warning');
            }
        }

        // 修复后的弹幕系统
        function startDanmaku() {
            const layer = document.getElementById('danmakuLayer');
            const danmakus = danmakuLibrary[selectedFlavor] || danmakuLibrary['搞笑下饭'];
            const trackCount = 8;
            const layerWidth = layer.offsetWidth;

            danmakuTimer = setInterval(() => {
                if (!isPlaying) return;

                const text = danmakus[Math.floor(Math.random() * danmakus.length)];
                const track = Math.floor(Math.random() * trackCount);
                const top = 20 + track * 34;
                const duration = 6 + Math.random() * 4; // 6-10秒滚动完
                const color = danmakuColors[Math.floor(Math.random() * danmakuColors.length)];
                const fontSize = 13 + Math.floor(Math.random() * 4);

                const item = document.createElement('div');
                item.className = 'danmaku-item';
                item.textContent = text;
                item.style.top = top + 'px';
                item.style.animationDuration = duration + 's';
                item.style.color = color;
                item.style.fontSize = fontSize + 'px';

                layer.appendChild(item);

                // 动画结束后移除元素
                item.addEventListener('animationend', () => {
                    item.remove();
                });
            }, 700);
        }

        function endSession() {
            isPlaying = false;
            setTimeout(() => {
                switchPage('pageEnd');
                document.getElementById('pagePlayer').style.display = 'none';
                document.getElementById('navTitle').textContent = '用餐结束';
                document.getElementById('cardDuration').textContent = `${selectedDuration} 分钟`;
                document.getElementById('cardFlavor').textContent = selectedFlavor;
            }, 800);
        }

        function backToHome() {
            clearInterval(countdownTimer);
            clearInterval(danmakuTimer);
            isPlaying = false;
            selectedDuration = null;
            selectedFlavor = null;

            document.querySelectorAll('.duration-item').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.flavor-item').forEach(item => item.classList.remove('active'));
            document.getElementById('startBtn').disabled = true;
            document.getElementById('danmakuLayer').innerHTML = '';
            document.getElementById('countdown').classList.remove('warning');
            document.getElementById('navBack').style.display = 'none';
            document.getElementById('navTitle').textContent = '电子榨菜搭子';

            switchPage('pageHome');
        }

        function goBack() {
            const currentPage = document.querySelector('.page.active').id;
            if (currentPage === 'pageMatch') {
                backToHome();
            } else if (currentPage === 'pagePlayer') {
                if (confirm('确定要结束本次陪看吗？')) {
                    backToHome();
                }
            } else if (currentPage === 'pageEnd') {
                backToHome();
            }
        }

        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }
    </script>
</body>
</html>
