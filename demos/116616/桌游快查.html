<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌游快查</title>
    <style>
        :root {
            --bg-primary: #FEFAF0;
            --card-bg: #FFFFFF;
            --text-primary: #332D21;
            --text-secondary: #6B5B4B;
            --accent: #D97706;
            --accent-hover: #B45E05;
            --border: #E8DCC6;
            --shadow: 0 4px 12px rgba(139, 92, 46, 0.08);
            --transition: all 0.25s ease;
        }

        .dark-mode {
            --bg-primary: #25221D;
            --card-bg: #2D2825;
            --text-primary: #F8F4EB;
            --text-secondary: #B4A593;
            --accent: #E9A23D;
            --accent-hover: #FFB75E;
            --border: #4A3120;
            --shadow: 0 4px 12px rgba(74, 49, 32, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 16px;
            transition: var(--transition);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
            padding-top: 12px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--accent), #B45E05);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 24px;
            margin-bottom: 24px;
            transition: var(--transition);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title::before {
            content: "📜";
            font-size: 1.1rem;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--card-bg);
            color: var(--text-primary);
            transition: var(--transition);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-section {
            margin-top: 24px;
            display: none;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border);
        }

        .result-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .result-content {
            background: rgba(217, 119, 6, 0.05);
            border-left: 4px solid var(--accent);
            padding: 16px;
            border-radius: 0 8px 8px 0;
            margin-top: 12px;
        }

        .rule-original {
            font-size: 0.95rem;
            margin-bottom: 8px;
            font-style: italic;
            color: var(--text-secondary);
        }

        .rule-explain {
            font-size: 1rem;
            font-weight: 500;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 16px;
        }

        .upload-area:hover:not(:disabled) {
            border-color: var(--accent);
            background: rgba(217, 119, 6, 0.03);
        }

        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .upload-text {
            font-size: 1.05rem;
            margin-bottom: 16px;
            color: var(--text-secondary);
        }

        .upload-btn {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 10px 20px;
            font-size: 0.95rem;
        }

        .upload-btn:hover:not(:disabled) {
            background: var(--accent);
            color: white;
        }

        .preview-container {
            display: none;
            margin-top: 20px;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .preview-img {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 8px;
            background: #f5f0e6;
            border: 1px solid var(--border);
        }

        .ocr-preview {
            margin-top: 16px;
            padding: 14px;
            background: rgba(217, 119, 6, 0.05);
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .ocr-preview strong {
            color: var(--accent);
        }

        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .theme-toggle svg {
            width: 22px;
            height: 22px;
            fill: var(--text-primary);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .input-group {
                flex-direction: column;
            }

            h1 {
                font-size: 1.5rem;
            }

            .card {
                padding: 20px 16px;
            }
        }

        /* Animation for result reveal */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-section.active {
            display: block;
            animation: fadeInUp 0.3s ease-out forwards;
        }
    </style>
</head>
<body>
    <div class="theme-toggle" id="themeToggle">
        <svg viewBox="0 0 24 24">
            <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H9.75a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h2.25zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H5.25a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h2.25zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-2.25a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h2.25zM21 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-2.25a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h2.25zM-1.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-2.25a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h2.25z"/>
        </svg>
    </div>

    <div class="container">
        <header>
            <h1>桌游快查</h1>
            <p class="subtitle">拍照或输入关键词，30秒内精准定位规则原文与白话解读</p>
        </header>

        <main>
            <section class="card">
                <h2 class="card-title">快速查规则</h2>
                <p>输入游戏名+关键词，例如：<strong>“阿瓦隆 身份公布顺序”</strong> 或 <strong>“卡坦岛 建路”</strong></p>
                <div class="input-group">
                    <input type="text" id="searchInput" placeholder="试试：幽港迷城 第二阶段重掷骰子？">
                    <button id="searchBtn">🔍 查一下</button>
                </div>
                <div class="result-section" id="resultSection">
                    <div class="result-header">
                        <div class="result-title" id="resultTitle">《阿瓦隆》身份公布规则</div>
                        <span id="resultSource">P12 第3段</span>
                    </div>
                    <div class="result-content">
                        <div class="rule-original" id="ruleOriginal"></div>
                        <div class="rule-explain" id="ruleExplain"></div>
                    </div>
                </div>
            </section>

            <section class="card">
                <h2 class="card-title">拍规则页</h2>
                <p>上传说明书截图，自动识别关键条款（模拟OCR）</p>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📱</div>
                    <p class="upload-text">点击上传规则页截图<br><small>支持 JPG/PNG，建议清晰文字区域</small></p>
                    <button class="upload-btn">选择图片</button>
                    <input type="file" id="fileInput" accept="image/*" style="display:none;">
                </div>
                <div class="preview-container" id="previewContainer">
                    <div class="preview-header">
                        <h3>识别结果预览</h3>
                        <span>✅ 已识别关键文字</span>
                    </div>
                    <img src="" alt="上传预览" class="preview-img" id="previewImg">
                    <div class="ocr-preview" id="ocrPreview">
                        <strong>原文：</strong>“每轮结束时，若玩家持有‘忠诚’标记，则可公开声明其身份。”<br>
                        <strong>白话：</strong>只有拿到忠诚标记的人，才能在每轮结束后主动亮明自己是好人。
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // 主题切换
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        if (localStorage.getItem('darkMode') === 'true') {
            body.classList.add('dark-mode');
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', body.classList.contains('dark-mode'));
        });

        // 检索功能
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultSection = document.getElementById('resultSection');
        const resultTitle = document.getElementById('resultTitle');
        const resultSource = document.getElementById('resultSource');
        const ruleOriginal = document.getElementById('ruleOriginal');
        const ruleExplain = document.getElementById('ruleExplain');

        // 内置规则库（模拟5款游戏高频问题）
        const ruleDB = {
            '阿瓦隆 身份公布顺序': {
                title: '《阿瓦隆》身份公布规则',
                source: 'P12 第3段',
                original: '“每轮结束时，若玩家持有‘忠诚’标记，则可公开声明其身份。”',
                explain: '只有拿到忠诚标记的人，才能在每轮结束后主动亮明自己是好人。'
            },
            '卡坦岛 建路': {
                title: '《卡坦岛》建路规则',
                source: 'P8 第2段',
                original: '“道路必须连接至你已拥有的定居点、城市，或另一条你建造的道路。”',
                explain: '新路不能悬空，至少一端要连着你自己的建筑或已有道路。'
            },
            '幽港迷城 第二阶段重掷骰子': {
                title: '《幽港迷城》第二阶段规则',
                source: 'P24 第1段',
                original: '“第二阶段中，每位英雄仅可对同一骰子重掷一次。”',
                explain: '重掷机会每人每颗骰子限1次，不能反复重掷同一颗。'
            },
            '狼人杀 天亮后发言顺序': {
                title: '《狼人杀》天亮发言规则',
                source: '官方简版 P3',
                original: '“从昨晚被投票淘汰的玩家左侧开始，顺时针依次发言。”',
                explain: '淘汰者左边的人先说，然后按顺时针轮流，每人限时2分钟。'
            },
            '璀璨宝石 购买卡牌': {
                title: '《璀璨宝石》购买卡牌规则',
                source: 'P10 第4段',
                original: '“购买卡牌时，可将任意数量的宝石返还至供应堆，但必须满足卡牌所需宝石数量。”',
                explain: '买卡时，手上宝石不够？可以还掉多余宝石凑够数量，但总数不能少于卡上要求。'
            }
        };

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') performSearch();
        });

        function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            let matched = null;
            // 精确匹配优先，再模糊匹配关键词
            if (ruleDB[query]) {
                matched = ruleDB[query];
            } else {
                for (const [key, rule] of Object.entries(ruleDB)) {
                    if (key.toLowerCase().includes(query.toLowerCase())) {
                        matched = rule;
                        break;
                    }
                }
            }

            if (matched) {
                resultTitle.textContent = matched.title;
                resultSource.textContent = matched.source;
                ruleOriginal.textContent = matched.original;
                ruleExplain.textContent = matched.explain;
                resultSection.classList.add('active');
                // 滚动到结果
                resultSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                resultTitle.textContent = '未找到匹配规则';
                resultSource.textContent = '';
                ruleOriginal.textContent = '请尝试输入更具体的关键词，例如：“卡坦岛建路” 或 “阿瓦隆身份公布”。';
                ruleExplain.textContent = '当前支持：阿瓦隆、卡坦岛、幽港迷城、狼人杀、璀璨宝石。';
                resultSection.classList.add('active');
            }
        }

        // 图片上传模拟
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImg = document.getElementById('previewImg');
        const ocrPreview = document.getElementById('ocrPreview');

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                previewImg.src = event.target.result;
                previewContainer.style.display = 'block';
                // 滚动到预览
                previewContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            };
            reader.readAsDataURL(file);
        }

        // 初始化：聚焦输入框
        window.addEventListener('load', () => {
            searchInput.focus();
        });
    </script>
</body>
</html>
