    {

    {
      id: 4,
      text: "看到一篇讲复利思维的文章，核心观点是每天进步1%，一年后就是37倍的成长。联想到自己的知识管理，零散记录没有复利，必须形成网络",

      todos: [
        { text: "重读《卡片笔记写作法》", done: true }
      ],

    {
      id: 5,
      text: "开会时老板随口说Q3要重点做用户增长，但没给具体指标，回头要跟运营确认一下拉新目标和预算分配",
      type: "todo",
      typeLabel: "待办",
      time: "昨天",
      tags: ["工作", "增长"],
      todos: [
        { text: "确认Q3拉新目标", done: false },
        { text: "了解预算分配", done: false }

      related: null

  // AI Analysis Logic
  function analyzeText(text) {
    const lower = text.toLowerCase();
    let type = 'idea';
    let typeLabel = '灵感';
    let tags = [];
    let todos = [];
    let related = null;

    // Detect type
    if (/记得|要|需要|必须|待办|todo|任务|跟.*确认|跟.*对/.test(text)) {
      type = 'todo';
      typeLabel = '待办';
    } else if (/焦虑|开心|难过|郁闷|压力|累|烦|情绪|感觉|心情/.test(text)) {
      type = 'emotion';
      typeLabel = '情绪';
    } else if (/文章|书|读到|学到|概念|理论|方法|思维|模型/.test(text)) {
      type = 'knowledge';
      typeLabel = '知识';
    }

    // Extract tags (keywords)
    const keywordMap = {
      '工作': /工作|项目|需求|产品|运营|开发|设计|会议|老板|客户/,
      '产品': /产品|原型|需求|功能|用户|体验|交互/,
      '灵感': /灵感|想法|创意|点子|突然想到|如果/,
      '生活': /生活|日常|家里|家人|朋友|吃饭|睡觉|运动/,
      '学习': /学习|读书|课程|文章|知识|技能|提升/,
      '情绪': /焦虑|压力|情绪|心情|状态|累|烦|郁闷/
    };

    Object.keys(keywordMap).forEach(tag => {
      if (keywordMap[tag].test(text) && !tags.includes(tag)) {
        tags.push(tag);
      }
    });

    if (tags.length === 0) tags.push('未分类');

    // Extract todos
    const sentences = text.split(/[。！？;；\n]/);
    sentences.forEach(sent => {
      sent = sent.trim();
      if (!sent) return;
      if (/要|需要|记得|必须|应该|跟.*确认|跟.*对|准备|整理|完成/.test(sent) && sent.length > 5 && sent.length < 50) {
        let todoText = sent
          .replace(/^(我|你)?(要|需要|记得|必须|应该)/, '')
          .replace(/一下$/, '')
          .trim();
        if (todoText && !todos.find(t => t.text === todoText)) {
          todos.push({ text: todoText, done: false });
        }
      }
    });

    // Simulate related idea
    if (notes.length > 0 && Math.random() > 0.5) {
      const relatedNote = notes.find(n => n.type === type && n.id !== notes.length + 1);
      if (relatedNote) {
        related = `你${relatedNote.time}记录过类似的${relatedNote.typeLabel}`;
      }
    }

    return { type, typeLabel, tags, todos, related };
  }

  // Render Functions
  function renderCards() {
    const container = document.getElementById('cards-container');
    const emptyState = document.getElementById('empty-state');

    const filtered = currentFilter === 'all'
      ? notes
      : notes.filter(n => n.type === currentFilter);

    if (filtered.length === 0) {
      container.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }

    emptyState.style.display = 'none';
    container.innerHTML = filtered.map(note => `
      <div class="card ${note.type}" data-id="${note.id}">
        <div class="card-actions">
          <button class="btn-delete" onclick="deleteNote(${note.id})">✕</button>
        </div>
        <div class="card-header">
          <span class="card-type">${getTypeIcon(note.type)} ${note.typeLabel}</span>
          <span class="card-time">${note.time}</span>
        </div>
        <div class="card-body">${escapeHtml(note.text)}</div>
        ${note.todos.length > 0 ? `
          <div class="ai-extract">
            <div class="extract-label">📋 AI提取的待办</div>
            ${note.todos.map((todo, idx) => `
              <div class="todo-item">
                <div class="todo-check ${todo.done ? 'checked' : ''}" onclick="toggleTodo(${note.id}, ${idx})"></div>
                <div class="todo-text ${todo.done ? 'done' : ''}">${escapeHtml(todo.text)}</div>
              </div>
            `).join('')}
          </div>
        ` : ''}
        ${note.related ? `
          <div class="related">
            <span class="related-icon">🔗</span>
            <span>${escapeHtml(note.related)}</span>
          </div>
        ` : ''}
        <div class="card-tags">
          ${note.tags.map(tag => `<span class="tag">#${escapeHtml(tag)}</span>`).join('')}
        </div>
      </div>
    `).join('');
  }

  function getTypeIcon(type) {
    const icons = { idea: '💡', todo: '✅', emotion: '😊', knowledge: '📚' };
    return icons[type] || '📝';
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function updateStats() {
    document.getElementById('stat-notes').textContent = notes.length;
    todoCount = notes.reduce((sum, n) => sum + n.todos.filter(t => !t.done).length, 0);
    document.getElementById('stat-todos').textContent = todoCount;
  }

  function getTimeLabel() {
    const now = new Date();
    const hours = now.getHours();
    if (hours < 6) return '凌晨';
    if (hours < 12) return '上午';
    if (hours < 14) return '中午';
    if (hours < 18) return '下午';
    return '晚上';
  }

  // Actions
  window.deleteNote = function(id) {
    notes = notes.filter(n => n.id !== id);
    renderCards();
    updateStats();
  };

  window.toggleTodo = function(noteId, todoIdx) {
    const note = notes.find(n => n.id === noteId);
    if (note && note.todos[todoIdx]) {
      note.todos[todoIdx].done = !note.todos[todoIdx].done;
      renderCards();
      updateStats();
    }
  };

  function addNote(text) {
    if (!text.trim()) return;

    const processing = document.getElementById('ai-processing');
    processing.classList.add('active');

    setTimeout(() => {
      const analysis = analyzeText(text);
      const newNote = {
        id: Date.now(),
        text: text.trim(),
        type: analysis.type,
        typeLabel: analysis.typeLabel,
        time: '刚刚',
        tags: analysis.tags,
        todos: analysis.todos,
        related: analysis.related
      };

      notes.unshift(newNote);
      processing.classList.remove('active');
      renderCards();
      updateStats();

      // Scroll to top
      document.getElementById('content').scrollTop = 0;
    }, 1200 + Math.random() * 800);
  }

  // Event Listeners
  document.getElementById('btn-send').addEventListener('click', () => {
    const input = document.getElementById('note-input');
    addNote(input.value);
    input.value = '';
    input.rows = 1;
  });

  document.getElementById('note-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('btn-send').click();
    }
  });

  document.getElementById('note-input').addEventListener('input', function() {
    this.rows = Math.min(5, Math.max(1, this.value.split('\n').length));
  });

  // Tip chips
  document.querySelectorAll('.tip-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const input = document.getElementById('note-input');
      input.value = chip.dataset.text;
      input.rows = Math.min(5, Math.max(1, input.value.split('\n').length));
      input.focus();
    });
  });

  // Tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      renderCards();
    });
  });

  // Voice
  const btnVoice = document.getElementById('btn-voice');
  const voiceOverlay = document.getElementById('voice-overlay');
  const voiceStop = document.getElementById('voice-stop');

  btnVoice.addEventListener('click', () => {
    btnVoice.classList.add('recording');
    voiceOverlay.classList.add('active');
  });

  voiceStop.addEventListener('click', () => {
    btnVoice.classList.remove('recording');
    voiceOverlay.classList.remove('active');
    // Simulate voice transcript
    const demos = [
      "下周二要交季度报告，需要汇总销售数据和市场反馈",
      "突然想到一个产品点子，做一个能自动整理碎片想法的工具",
      "今天心情不太好，项目延期了，团队成员也有情绪"
    ];
    const randomText = demos[Math.floor(Math.random() * demos.length)];
    document.getElementById('note-input').value = randomText;
    document.getElementById('note-input').rows = 2;
  });

  // Init with demo data
  notes = [...demoNotes];
  renderCards();
  updateStats();
})();
</script>
</body>
</html>
