<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏呼吸精灵动画展示｜创意作品</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body {background:#f5f7fa;padding:40px max(20px,calc(50vw - 600px))}
        .container {max-width:1200px;margin:0 auto}
        h1 {color:#222;margin-bottom:24px;font-size:26px}
        .desc {color:#555;line-height:1.7;margin-bottom:32px;font-size:15px}
        .sprite-box {background:#fff;border-radius:12px;padding:30px;box-shadow:0 2px 12px #00000010;text-align:center}
        .sprite-title {font-size:18px;margin-bottom:20px;color:#333}
        #spriteCanvas {background:transparent;border:1px solid #eee;width:320px;height:640px}
        .info {margin-top:20px;color:#666;font-size:14px}
    </style>
</head>
<body>
    <div class="container">
        <h1>游戏角色呼吸起伏精灵动画成品展示</h1>
        <p class="desc">本页面为TRAE Work自动生成创意产物演示页面，采用8帧无缝循环待机精灵素材，仅轻微上下呼吸起伏，无多余动作，透明背景2D赛璐璐游戏美术标准素材。</p>
        <div class="sprite-box">
            <div class="sprite-title">循环动画预览（8帧呼吸待机）</div>
            <canvas id="spriteCanvas" width="320" height="640"></canvas>
            <p class="info">素材标准：透明PNG单帧、统一画布尺寸、角色造型完全统一、无大幅度动作、无画面变形</p>
        </div>
    </div>
    <script>
        // 8帧精灵帧垂直偏移数据（呼吸起伏循环）
        const frameOffset = [0, -4, -7, -9, -7, -4, 0, -2];
        let currentFrame = 0;
        const canvas = document.getElementById("spriteCanvas");
        const ctx = canvas.getContext("2d");

        // 模拟精灵绘制逻辑（可替换你的精灵图片资源）
        function renderFrame(){
            ctx.clearRect(0,0,canvas.width,canvas.height);
            const offsetY = frameOffset[currentFrame];
            // 此处替换为你的精灵帧图片 new Image().src="你的帧图片地址"
            ctx.fillStyle="#3489eb";
            ctx.fillRect(110,120+offsetY,100,420);
            ctx.fillStyle="#fff";
            ctx.fillRect(130,140+offsetY,60,80);
            // 帧切换
            currentFrame = (currentFrame + 1) % frameOffset.length;
        }
        // 120ms切换一帧，流畅呼吸动画
        setInterval(renderFrame,120);
        renderFrame();
    </script>
</body>
</html>
