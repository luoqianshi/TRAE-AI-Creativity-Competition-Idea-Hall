<title>ProjectBoard Aurora · 重新设计版</title>
<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:var(--font-sans);background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-30%;pointer-events:none;background:radial-gradient(circle at 16% 12%,rgba(124,92,255,.30),transparent 32%),radial-gradient(circle at 88% 4%,rgba(56,211,255,.20),transparent 28%),radial-gradient(circle at 58% 98%,rgba(255,122,61,.22),transparent 34%);filter:blur(20px);opacity:.86}body::after{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(to bottom,black,transparent 86%)}

.pipeline-list{display:grid;gap:12px}.pipeline-card{padding:14px;border:1px solid var(--border);background:var(--surface-2);border-radius:18px;transition:var(--fast)}.pipeline-card:hover{transform:translateY(-2px);border-color:var(--border-2);background:var(--surface-3)}.pipeline-head{display:flex;align-items:flex-start;gap:12px}.project-mark{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:850;flex:0 0 auto}.pipeline-main{min-width:0;flex:1}.pipeline-name{font-weight:800}.pipeline-desc{font-size:12px;color:var(--text-3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pipeline-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tag{font-size:11px;color:var(--text-2);background:rgba(148,163,184,.10);border:1px solid var(--border);padding:4px 8px;border-radius:999px}.tag.hot{color:var(--accent);background:rgba(255,122,61,.10);border-color:rgba(255,122,61,.32)}.stage-line{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}.stage{min-width:0;text-align:center}.stage-dot{height:5px;border-radius:999px;background:var(--surface-3);position:relative;overflow:hidden}.stage.done .stage-dot{background:linear-gradient(90deg,var(--green),#7cf5c1)}.stage.active .stage-dot{background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 0 4px rgba(255,122,61,.12)}.stage-label{font-size:10px;color:var(--text-3);margin-top:6px;white-space:nowrap}.stage.done .stage-label{color:var(--green)}.stage.active .stage-label{color:var(--accent);font-weight:800}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.task-col{border:1px solid var(--border);background:var(--surface-2);border-radius:18px;padding:12px;min-height:240px}.task-col-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:800}.task-list{display:grid;gap:8px}.task-card{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:12px;transition:var(--fast)}.task-card:hover{border-color:var(--border-2);transform:translateY(-1px)}.task-title{font-size:13px;font-weight:750}.task-meta{display:flex;justify-content:space-between;color:var(--text-3);font-size:11px;margin-top:8px}.priority{font-size:10px;padding:2px 7px;border-radius:999px}.priority.high{color:var(--red);background:rgba(255,95,115,.12)}.priority.mid{color:var(--yellow);background:rgba(255,209,102,.12)}.priority.low{color:var(--cyan);background:rgba(56,211,255,.12)}

emo-item.done{opacity:.55}.memo-item.done .memo-text{text-decoration:line-through}.memo-check{width:18px;height:18px;border-radius:6px;accent-color:var(--accent);margin-top:1px}.memo-text{font-size:13px;line-height:1.35;flex:1}.memo-del{border:0;background:transparent;color:var(--text-3);font-size:18px;line-height:1}
.table-tools{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.data-table{width:100%;border-collapse:separate;border-spacing:0 8px}.data-table th{text-align:left;color:var(--text-3);font-size:12px;font-weight:700;padding:0 12px 6px}.data-table td{background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:13px 12px;font-size:13px}.data-table td:first-child{border-left:1px solid var(--border);border-radius:14px 0 0 14px}.data-table td:last-child{border-right:1px solid var(--border);border-radius:0 14px 14px 0}.data-table tr:hover td{background:var(--surface-2)}.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.entity-card{padding:16px;border:1px solid var(--border);background:var(--surface);border-radius:18px;transition:var(--fast)}.entity-card:hover{transform:translateY(-2px);border-color:var(--border-2)}.entity-top{display:flex;align-items:center;gap:10px}.entity-title{font-weight:800}.entity-sub{font-size:12px;color:var(--text-3);margin-top:2px}.entity-desc{font-size:12px;color:var(--text-2);margin-top:12px;line-height:1.55}.progress{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin-top:12px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:inherit}.agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.agent-card{padding:18px;border:1px solid var(--border);border-radius:20px;background:linear-gradient(180deg,var(--surface),var(--surface-2));transition:var(--fast)}.agent-card:hover{transform:translateY(-3px);border-color:rgba(255,122,61,.34);box-shadow:0 18px 46px rgba(0,0,0,.18)}.agent-icon{font-size:28px}.agent-name{font-weight:850;margin-top:10px}.agent-desc{font-size:12px;color:var(--text-3);line-height:1.55;margin-top:8px}.empty{border:1px dashed var(--border-2);border-radius:18px;padding:40px;text-align:center;color:var(--text-3);background:var(--surface)}

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-logo">P</div><div class="brand-text"><div class="brand-title">ProjectBoard</div><div class="brand-sub">Aurora Redesign</div></div></div>
    <div class="nav-group"><div class="nav-label">Overview</div>
      <button class="nav-link active" data-page="dashboard"><span class="nav-icon">◉</span><span>仪表盘</span></button>
      <button class="nav-link" data-page="projects"><span class="nav-icon">▦</span><span>全部项目</span><span class="nav-badge" id="projectBadge">8</span></button>
      <button class="nav-link" data-page="tasks"><span class="nav-icon">✓</span><span>任务管理</span></button>
    </div>
    <div class="nav-group"><div class="nav-label">Collaboration</div>
      <button class="nav-link" data-page="partners"><span class="nav-icon">◇</span><span>合作商</span></button>
      <button class="nav-link" data-page="team"><span class="nav-icon">☷</span><span>团队</span></button>
      <button class="nav-link" data-page="messages"><span class="nav-icon">✉</span><span>消息</span><span class="nav-badge">3</span></button>
    </div>
    <div class="nav-group"><div class="nav-label">Resources</div>
      <button class="nav-link" data-page="docs"><span class="nav-icon">▤</span><span>文档中心</span></button>
      <button class="nav-link" data-page="agents"><span class="nav-icon">✦</span><span>Agent 库</span></button>
      <button class="nav-link" data-page="settings"><span class="nav-icon">⚙</span><span>设置</span></button>
    </div>
    <div class="profile"><div class="profile-card"><div class="avatar">陈</div><div><div class="profile-name">陈明远</div><div class="profile-role">项目经理</div></div></div></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="page-heading"><div class="page-kicker" id="todayText"></div><div class="page-title" id="pageTitle">项目看板</div></div>
      <div class="top-actions">
        <button class="search-pill" id="openSearch">⌘K <span>搜索项目、日程、客户...</span></button>

function renderDashboard(){const active=projects.filter(p=>p.stage>1&&p.stage<7).length,done=projects.filter(p=>p.stage===7).length,avg=Math.round(projects.reduce((a,p)=>a+p.stage,0)/projects.length/STAGES.length*100);document.getElementById('view-dashboard').innerHTML=`
<div class="dashboard-grid"><div class="left-stack">

function calendarHTML(){const y=state.calendarYear,m=state.calendarMonth;const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();const today=todayISO();let cells=[];for(let i=first-1;i>=0;i--)cells.push({d:prevDays-i,muted:true,iso:''});for(let d=1;d<=days;d++){const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells.push({d,iso})}while(cells.length<42)cells.push({d:cells.length-days-first+1,muted:true,iso:''});const upcoming=[...events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4);return `<div class="cal-head"><div><div class="cal-title">${y}年 ${m+1}月</div><div class="panel-sub">日程密度视图</div></div><div class="cal-nav"><button onclick="moveMonth(-1)">‹</button><button onclick="moveMonth(1)">›</button></div></div><div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="days">${cells.map(c=>`<button class="day ${c.muted?'muted':''} ${c.iso===today?'today':''} ${events.some(e=>e.date===c.iso)?'has':''}" ${c.iso?`onclick="openEventList('${c.iso}')"`:''}>${c.d}</button>`).join('')}</div><div class="event-list">${upcoming.map(e=>`<div class="event-item"><div class="event-time">${esc(e.time)}</div><div><div class="event-title">${esc(e.title)}</div><div class="panel-sub">${esc(e.date)}</div></div><span class="event-type">${esc(e.type)}</span></div>`).join('')}</div>`}

function renderProjects(){const q=(document.getElementById('projectSearch')?.value||'').trim().toLowerCase();const stage=state.projectFilter;const filtered=projects.filter(p=>(stage==='all'||p.stage===+stage)&&(p.name.toLowerCase().includes(q)||p.type.toLowerCase().includes(q)||p.owner.toLowerCase().includes(q)));document.getElementById('view-projects').innerHTML=`<div class="card panel"><div class="panel-header"><div><div class="panel-title">项目组合</div><div class="panel-sub">支持搜索、阶段筛选和快速查看详情</div></div><button class="btn primary" onclick="openProjectModal()">+ 新建项目</button></div><div class="table-tools"><input class="input" id="projectSearch" placeholder="搜索项目 / 类型 / 负责人" value="${esc(q)}" oninput="renderProjects()" style="max-width:320px"><div class="chip-row"><button class="chip ${stage==='all'?'active':''}" onclick="setProjectFilter('all')">全部</button>${STAGES.map((s,i)=>`<button class="chip ${stage===String(i+1)?'active':''}" onclick="setProjectFilter('${i+1}')">${s}</button>`).join('')}</div></div><table class="data-table"><thead><tr><th>项目</th><th>阶段</th><th>预算</th><th>负责人</th><th>周期</th><th></th></tr></thead><tbody>${filtered.map((p,i)=>`<tr><td><strong>${esc(p.name)}</strong><div class="panel-sub">${esc(p.type)}</div></td><td><span class="tag hot">${STAGES[p.stage-1]} · ${pct(p.stage)}%</span></td><td>${esc(p.budget)}</td><td>${esc(p.owner)}</td><td>${esc(p.date)}</td><td><button class="btn" onclick="openProjectDetail(${projects.indexOf(p)})">查看</button></td></tr>`).join('')}</tbody></table></div>`}
function setProjectFilter(v){state.projectFilter=v;renderProjects()}
function renderTasks(){document.getElementById('view-tasks').innerHTML=`<div class="card panel"><div class="panel-header"><div><div class="panel-title">任务管理</div><div class="panel-sub">按状态分组，本地保存</div></div><button class="btn primary" onclick="openTaskModal()">+ 新建任务</button></div>${taskBoardHTML(tasks)}</div>`}
function renderPartners(){document.getElementById('view-partners').innerHTML=`<div class="card panel"><div class="panel-header"><div><div class="panel-title">合作商雷达</div><div class="panel-sub">按照合作阶段和行业识别交付机会</div></div></div><div class="grid-cards">${partners.map((p,i)=>`<div class="entity-card"><div class="entity-top"><div class="project-mark" style="background:${colors[i%colors.length]}">${p.avatar}</div><div><div class="entity-title">${esc(p.name)}</div><div class="entity-sub">${esc(p.industry)} · ${STAGES[p.stage-1]}</div></div></div><div class="entity-desc">${esc(p.desc)}</div><div class="progress"><span style="width:${pct(p.stage)}%"></span></div></div>`).join('')}</div></div>`}
function renderTeam(){document.getElementById('view-team').innerHTML=`<div class="card panel"><div class="panel-header"><div><div class="panel-title">团队</div><div class="panel-sub">项目交付与客户成功团队</div></div></div><div class="grid-cards">${team.map((m,i)=>`<div class="entity-card"><div class="entity-top"><div class="project-mark" style="background:${colors[i%colors.length]}">${m[3]}</div><div><div class="entity-title">${m[0]}</div><div class="entity-sub">${m[1]}</div></div></div><div class="entity-desc">${m[2]}</div></div>`).join('')}</div></div>`}
function renderMessages(){document.getElementById('view-messages').innerHTML=`<div class="card panel"><div class="panel-header"><div><div class="panel-title">消息</div><div class="panel-sub">近期项目沟通摘要</div></div><button class="btn primary" onclick="toast('演示版：消息草稿已创建')">+ 撰写消息</button></div><div class="pipeline-list">${messages.map(m=>`<div class="pipeline-card"><div class="pipeline-head"><div class="project-mark" style="background:${m.unread?'var(--accent)':'var(--surface-3)'}">${m.from[0]}</div><div class="pipeline-main"><div class="pipeline-name">${esc(m.from)} <span class="panel-sub">${esc(m.time)}</span></div><div class="entity-desc">${esc(m.text)}</div></div></div></div>`).join('')}</div></div>`}
function renderDocs(){document.getElementById('view-docs').innerHTML=`<div class="card panel"><div class="panel-header"><div><div class="panel-title">文档中心</div><div class="panel-sub">项目资产与交付文档</div></div><button class="btn primary" onclick="toast('演示版：已打开上传入口')">+ 上传文档</button></div><table class="data-table"><thead><tr><th>文档名称</th><th>类型</th><th>更新时间</th><th>负责人</th></tr></thead><tbody>${docs.map(d=>`<tr><td><strong>${d[0]}</strong></td><td><span class="tag">${d[1]}</span></td><td>${d[2]}</td><td>${d[3]}</td></tr>`).join('')}</tbody></table></div>`}
function renderAgents(){document.getElementById('view-agents').innerHTML=`<div class="card panel"><div class="panel-header"><div><div class="panel-title">Agent 库</div><div class="panel-sub">按场景调用智能助手</div></div></div><div class="agent-grid">${agents.map(a=>`<div class="agent-card" onclick="openAgent('${esc(a[1])}')"><div class="agent-icon">${a[0]}</div><span class="tag hot">${a[3]}</span><div class="agent-name">${a[1]}</div><div class="agent-desc">${a[2]}</div></div>`).join('')}</div></div>`}
function renderSettings(){document.getElementById('view-settings').innerHTML=`<div class="two-col"><div class="left-stack"><div class="setting-card"><div><div class="entity-title">外观主题</div><div class="entity-sub">深色 / 浅色模式，自动保存</div></div><button class="toggle ${document.documentElement.dataset.theme==='dark'?'on':''}" onclick="toggleTheme()"><span></span></button></div><div class="setting-card"><div><div class="entity-title">重置演示数据</div><div class="entity-sub">清除本地新增项目、任务和备忘录</div></div><button class="btn" onclick="resetData()">重置</button></div></div><div class="card panel"><div class="panel-title">设计说明</div><p class="entity-desc">这一版采用 Aurora 工作台风格：高对比背景、低饱和玻璃卡片、首屏 KPI、阶段生命线、右侧行动区，并强化了移动端重排。</p></div></div>`}
function openModal(title,body,foot=''){document.getElementById('modalTitle').innerHTML=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFoot').innerHTML=foot;document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
function openProjectModal(){openModal('新建项目',`<div class="form-field"><label>项目名称</label><input class="input" id="fName" placeholder="例如：智慧园区一体化平台"></div><div class="form-grid"><div class="form-field"><label>项目类型</label><input class="input" id="fType" placeholder="行业 / 方向"></div><div class="form-field"><label>负责人</label><input class="input" id="fOwner" placeholder="负责人姓名"></div><div class="form-field"><label>阶段</label><select class="select" id="fStage">${STAGES.map((s,i)=>`<option value="${i+1}">${s}</option>`).join('')}</select></div><div class="form-field"><label>预算</label><input class="input" id="fBudget" placeholder="例如：3200 万"></div></div><div class="form-field"><label>周期</label><input class="input" id="fDate" placeholder="2026.06 - 2027.02"></div><div class="form-field"><label>描述</label><textarea class="textarea" id="fDesc" rows="4" placeholder="写一句项目简介"></textarea></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="submitProject()">创建项目</button>`)}
function submitProject(){const name=fName.value.trim();if(!name){toast('请填写项目名称');return}projects.unshift({name,type:fType.value.trim()||'未分类',owner:fOwner.value.trim()||'未指定',stage:+fStage.value,budget:fBudget.value.trim()||'-',date:fDate.value.trim()||'-',avatar:name[0],color:colors[projects.length%colors.length],desc:fDesc.value.trim()||'暂无描述'});save(STORE.projects,projects);closeModal();renderAll();toast('项目已创建')}
function openEventModal(){openModal('新建日程',`<div class="form-grid"><div class="form-field"><label>日期</label><input class="input" type="date" id="eDate" value="${todayISO()}"></div><div class="form-field"><label>时间</label><input class="input" type="time" id="eTime" value="10:00"></div></div><div class="form-field"><label>标题</label><input class="input" id="eTitle" placeholder="例如：客户 Demo 演示"></div><div class="form-field"><label>类型</label><select class="select" id="eType"><option>会议</option><option>评审</option><option>截止</option></select></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="submitEvent()">保存日程</button>`)}
function submitEvent(){if(!eTitle.value.trim()){toast('请填写日程标题');return}events.push({date:eDate.value,time:eTime.value,title:eTitle.value.trim(),type:eType.value});save(STORE.events,events);closeModal();renderAll();toast('日程已保存')}
function openTaskModal(){openModal('新建任务',`<div class="form-field"><label>任务标题</label><input class="input" id="tTitle" placeholder="任务内容"></div><div class="form-grid"><div class="form-field"><label>状态</label><select class="select" id="tStatus"><option value="todo">待处理</option><option value="doing">进行中</option><option value="done">已完成</option></select></div><div class="form-field"><label>优先级</label><select class="select" id="tPriority"><option value="high">高</option><option value="mid">中</option><option value="low">低</option></select></div><div class="form-field"><label>负责人</label><input class="input" id="tOwner" placeholder="负责人"></div><div class="form-field"><label>截止</label><input class="input" id="tDue" placeholder="06/30"></div></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="submitTask()">保存任务</button>`)}
function submitTask(){if(!tTitle.value.trim())return toast('请填写任务标题');tasks.unshift({title:tTitle.value.trim(),status:tStatus.value,priority:tPriority.value,owner:tOwner.value.trim()||'未指定',due:tDue.value.trim()||'-'});save(STORE.tasks,tasks);closeModal();renderAll();toast('任务已创建')}
function openProjectDetail(i){const p=projects[i];openModal(p.name,`<div class="entity-top"><div class="project-mark" style="background:${p.color};width:58px;height:58px;border-radius:20px">${p.avatar}</div><div><div class="entity-title" style="font-size:20px">${esc(p.name)}</div><div class="entity-sub">${esc(p.type)} · 负责人 ${esc(p.owner)}</div></div></div><p class="entity-desc" style="font-size:14px">${esc(p.desc)}</p><div class="pipeline-meta"><span class="tag hot">当前阶段：${STAGES[p.stage-1]}</span><span class="tag">预算 ${esc(p.budget)}</span><span class="tag">周期 ${esc(p.date)}</span></div>${stageHTML(p.stage)}<div class="progress"><span style="width:${pct(p.stage)}%"></span></div>`,`<button class="btn" onclick="closeModal()">关闭</button><button class="btn primary" onclick="toast('演示版：已生成下一步行动建议')">生成下一步建议</button>`)}
function openEventList(date){const list=events.filter(e=>e.date===date);openModal(`${date} 日程`,list.length?`<div class="event-list">${list.map(e=>`<div class="event-item"><div class="event-time">${e.time}</div><div><div class="event-title">${esc(e.title)}</div><div class="panel-sub">${esc(e.type)}</div></div></div>`).join('')}</div>`:'<div class="empty">这一天暂无日程</div>','<button class="btn" onclick="closeModal()">关闭</button><button class="btn primary" onclick="openEventModal()">新增日程</button>')}
function openSearchModal(){openModal('全局搜索',`<input class="input" id="globalSearchInput" placeholder="搜索项目、负责人、日程、合作商..." oninput="renderSearchResults(this.value)" autofocus><div class="sr" id="searchResults" style="margin-top:14px"><div class="empty" style="padding:24px">输入关键词开始搜索</div></div>`,'<button class="btn" onclick="closeModal()">关闭</button>');setTimeout(()=>globalSearchInput.focus(),30)}
function renderSearchResults(q){q=q.trim().toLowerCase();const box=document.getElementById('searchResults');if(!q){box.innerHTML='<div class="empty" style="padding:24px">输入关键词开始搜索</div>';return}const rows=[...projects.map((p,i)=>({kind:'项目',name:p.name,desc:`${p.type} · ${p.owner}`,onclick:`openProjectDetail(${i})`})),...events.map(e=>({kind:'日程',name:e.title,desc:`${e.date} ${e.time} · ${e.type}`})),...partners.map(p=>({kind:'合作商',name:p.name,desc:p.industry}))].filter(r=>(r.name+r.desc).toLowerCase().includes(q));box.innerHTML=rows.length?rows.map(r=>`<div class="sr-item" onclick="${r.onclick||''}"><div class="sr-name">${esc(r.name)} <span class="tag hot">${r.kind}</span></div><div class="sr-desc">${esc(r.desc)}</div></div>`).join(''):'<div class="empty" style="padding:24px">没有找到匹配结果</div>'}
function openReportModal(){const byStage=STAGES.map((s,i)=>projects.filter(p=>p.stage===i+1).length);openModal('经营报告',`<div class="kpi-grid" style="grid-template-columns:repeat(2,1fr)"><div class="card kpi-card"><div class="kpi-label">项目总量</div><div class="kpi-value">${projects.length}</div></div><div class="card kpi-card"><div class="kpi-label">合作商</div><div class="kpi-value">${partners.length}</div></div></div><div style="margin-top:16px" class="pipeline-list">${STAGES.map((s,i)=>`<div><div class="panel-sub" style="margin-bottom:5px">${s} · ${byStage[i]} 项</div><div class="progress"><span style="width:${Math.max(byStage[i]/Math.max(...byStage,1)*100,4)}%"></span></div></div>`).join('')}</div>`,'<button class="btn" onclick="closeModal()">关闭</button><button class="btn primary" onclick="toast(\'报告已导出（演示）\')">导出报告</button>')}
function openAgent(name){const item=agents.find(a=>a[1]===name);if(!item)return;openModal(item[1],`<div class="agent-card"><div class="agent-icon">${item[0]}</div><div class="agent-name">${item[1]}</div><div class="agent-desc">${item[2]}</div><span class="tag hot">${item[3]}</span></div><p class="entity-desc">可接入项目工作流，用于自动生成文档、审查代码、汇总会议纪要或分析数据。当前为前端演示版。</p>`,'<button class="btn" onclick="closeModal()">关闭</button><button class="btn primary" onclick="toast(\'Agent 已加入快捷入口（演示）\')">添加到工作台</button>')}
function resetData(){if(!confirm('确定清除本地演示数据并恢复默认吗？'))return;Object.values(STORE).forEach(k=>localStorage.removeItem(k));location.reload()}
init();
</script>
