  <style>

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;

      color: var(--ink);
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

    }

    .wallpaper-preview {
      min-height: 170px;

        radial-gradient(circle at 20% 20%, rgba(156, 247, 255, 0.24), transparent 32%),
        linear-gradient(135deg, rgba(220, 168, 255, 0.18), rgba(255, 255, 255, 0.05));
      background-size: cover;
      background-position: center;
    }

    .firework {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 999999;

    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: hsl(var(--h), 92%, 72%);
      box-shadow: 0 0 16px hsl(var(--h), 92%, 72%);
      animation: burst 820ms ease-out forwards;
    }

    @keyframes burst {
      from {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      to {
        opacity: 0;
        transform: translate(calc(var(--x) - 50%), calc(var(--y) - 50%)) scale(0.25);
      }
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 80;
      max-width: 320px;
      padding: 13px 16px;
      border: 1px solid var(--rule);
      border-radius: 18px;
      background: rgba(5, 10, 22, 0.82);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.32);
      color: var(--ink);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 980px) {
      .hero,
      .grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        grid-template-columns: 1fr;
        border-radius: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="topbar" aria-label="今日专注值">
      <strong>今日专注值</strong>
      <div class="progress"><span id="focusFill"></span></div>
      <span id="focusText">25%</span>
    </section>

    <section class="hero">
      <article class="panel intro">
        <p class="eyebrow">Interactive Demo</p>
        <h1>MySpace Studio 最新版 Demo</h1>
        <p id="greeting" class="greeting">欢迎回来，准备好进入今天的节奏了吗？</p>
        <p class="lead">
          这是一个可直接点击体验的 Demo：你可以添加任务、勾选完成触发烟花、启动迷你番茄钟、切换早晚氛围、播放模拟音乐、选择本地图片设为壁纸和拖拽文件。
        </p>
        <div class="actions">
          <a class="btn primary" href="index.html">打开正式工作台</a>
          <button id="morningBtn" class="btn" type="button">早晨模式</button>
          <button id="nightBtn" class="btn" type="button">深夜模式</button>
        </div>
      </article>

      <aside class="panel card">
        <h2>番茄钟演示</h2>
        <div id="bubble" class="bubble">慢慢来，我会陪你进入今天的专注节奏。</div>
        <div class="timer">
          <div>
            <strong id="timerText">05:00</strong>
            <p>Demo Focus Timer</p>
          </div>
        </div>
        <div class="timer-buttons">
          <button id="startBtn" class="btn primary" type="button">开始</button>
          <button id="pauseBtn" class="btn" type="button">暂停</button>
          <button id="resetBtn" class="btn" type="button">重置</button>
        </div>
      </aside>
    </section>

    <section class="grid">
      <article class="panel card">
        <h2>任务烟花</h2>
        <form id="taskForm" class="task-form">
          <input id="taskInput" type="text" placeholder="输入一个演示任务" />
          <button class="btn primary" type="submit">添加</button>
        </form>
        <ul id="taskList" class="task-list"></ul>
      </article>

      <article class="panel card">
        <h2>壁纸与文件</h2>
        <input id="wallpaperInput" type="file" accept="image/*" hidden />
        <button id="wallpaperBtn" class="btn primary" type="button">选择本地图片设为壁纸</button>
        <div id="wallpaperPreview" class="wallpaper-preview"></div>
        <div id="dropZone" class="drop">
          <div>
            <strong>拖拽文件到这里</strong>
            <p>Demo 会列出文件名，不会真正编辑文件。</p>
          </div>
        </div>
        <div id="fileList" class="file-list"></div>
      </article>

      <article class="panel card">
        <h2>音乐演示</h2>
        <p id="trackName">Morning Light 轻快纯音乐</p>
        <div class="music">
          <button id="musicBtn" class="btn primary" type="button">播放模拟音乐</button>
          <button id="switchTrackBtn" class="btn" type="button">切换吉他卡农</button>
          <div class="url-row">
            <input id="musicUrl" type="url" placeholder="粘贴音频直链演示" />
            <button id="addUrlBtn" class="btn" type="button">添加</button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script>
    const $ = (selector) => document.querySelector(selector);
    let focus = 25;
    let timerSeconds = 300;
    let timerId = null;
    let audioState = null;
    let currentTrack = "morning";

    const messages = {
      start: ["很好，现在只需要把注意力轻轻放回眼前这一件事。", "把世界调成静音，我们一起进入一段安静的专注。"],
      pause: ["暂停不是退后，是给自己一点呼吸的空间。", "休息片刻也很好，重新开始时依然算数。"],
      reset: ["清空计时，不清空努力；下一轮可以更轻盈。", "新的时间已经准备好，你可以按自己的速度再出发。"],
      finish: ["这一轮完成了，辛苦你了，记得给自己一点肯定。", "你刚刚守住了一段专注时间，这很值得被看见。"]
    };

    function toast(text) {
      $("#toast").textContent = text;
      $("#toast").classList.add("show");
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 2200);
    }

    function updateFocus(amount = 0) {
      focus = Math.min(100, Math.max(0, focus + amount));
      $("#focusFill").style.width = `${focus}%`;
      $("#focusText").textContent = `${focus}%`;
    }

    function randomMessage(type) {
      const list = messages[type];
      return list[Math.floor(Math.random() * list.length)];
    }

    function updateTimer() {
      const min = String(Math.floor(timerSeconds / 60)).padStart(2, "0");
      const sec = String(timerSeconds % 60).padStart(2, "0");
      $("#timerText").textContent = `${min}:${sec}`;
    }

    function playPop() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const now = ctx.currentTime;
      osc.type = "sine";
      osc.frequency.setValueAtTime(660, now);
      osc.frequency.exponentialRampToValueAtTime(1180, now + 0.08);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.45);
    }

    function firework(x = window.innerWidth / 2, y = window.innerHeight / 2) {
      const root = document.createElement("div");
      root.className = "firework";
      root.style.left = `${x}px`;
      root.style.top = `${y}px`;
      for (let i = 0; i < 28; i += 1) {
        const p = document.createElement("span");
        const angle = (Math.PI * 2 * i) / 28;
        const distance = 45 + Math.random() * 72;
        p.className = "particle";
        p.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
        p.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
        p.style.setProperty("--h", `${Math.floor(Math.random() * 360)}`);
        root.appendChild(p);
      }
      document.body.appendChild(root);
      setTimeout(() => root.remove(), 900);
    }

    function setMode(mode) {
      document.body.classList.remove("morning", "night");
      document.body.classList.add(mode);
      if (mode === "morning") {
        $("#greeting").textContent = "早上好，今天也是元气满满的一天";
        currentTrack = "morning";
        $("#trackName").textContent = "Morning Light 轻快纯音乐";
      } else {
        $("#greeting").textContent = "很晚了，辛苦了，再坚持一下就去睡吧";
        currentTrack = "night";
        $("#trackName").textContent = "Night Guitar Canon 吉他和弦卡农";
      }
      toast(mode === "morning" ? "已切换早晨氛围" : "已切换深夜氛围");
    }

    function stopMusic() {
      if (!audioState) return;
      audioState.intervals.forEach(clearInterval);
      audioState.nodes.forEach(node => {
        try { node.stop?.(); node.disconnect?.(); } catch {}
      });
      audioState.context.close?.();
      audioState = null;
      $("#musicBtn").textContent = "播放模拟音乐";
    }

    function pluck(ctx, dest, freq, time, vol = 0.05) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = currentTrack === "night" ? "triangle" : "sine";
      osc.frequency.setValueAtTime(freq, time);
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(vol, time + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 1.1);
      osc.connect(gain);
      gain.connect(dest);
      osc.start(time);
      osc.stop(time + 1.2);
    }

    async function playMusic() {
      if (audioState) {
        stopMusic();
        return;
      }
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return toast("当前浏览器不支持 Web Audio");
      const ctx = new AudioContext();
      await ctx.resume();
      const master = ctx.createGain();
      master.gain.value = 0.18;
      master.connect(ctx.destination);
      const intervals = [];
      const nodes = [master];

      if (currentTrack === "night") {
        const chords = [[146.83, 220, 293.66, 369.99], [110, 220, 277.18, 329.63], [123.47, 246.94, 293.66, 369.99], [92.5, 185, 277.18, 369.99], [98, 196, 246.94, 392]];
        let step = 0;
        const play = () => {
          const chord = chords[step % chords.length];
          const now = ctx.currentTime;
          [0, 2, 3, 1, 2, 3].forEach((idx, i) => pluck(ctx, master, chord[idx], now + i * 0.34, 0.05));
          step += 1;
        };
        play();
        intervals.push(setInterval(play, 2200));
      } else {
        const notes = [523.25, 659.25, 783.99, 987.77];
        let step = 0;
        const play = () => {
          pluck(ctx, master, notes[step % notes.length], ctx.currentTime, 0.06);
          step += 1;
        };
        play();
        intervals.push(setInterval(play, 760));
      }
      audioState = { context: ctx, intervals, nodes };
      $("#musicBtn").textContent = "停止模拟音乐";
    }

    $("#taskForm").addEventListener("submit", event => {
      event.preventDefault();
      const input = $("#taskInput");
      const text = input.value.trim();
      if (!text) return;
      const li = document.createElement("li");
      li.innerHTML = `<input type="checkbox" /><span>${text}</span>`;
      li.querySelector("input").addEventListener("change", event => {
        if (event.target.checked) {
          li.classList.add("done");
          const rect = li.getBoundingClientRect();
          firework(rect.left + rect.width / 2, rect.top + rect.height / 2);
          playPop();
          updateFocus(10);
          toast("任务完成，今日专注值 +10%");
        }
      });
      $("#taskList").prepend(li);
      input.value = "";
    });

    $("#startBtn").addEventListener("click", () => {
      if (timerId) return;
      $("#bubble").textContent = randomMessage("start");
      timerId = setInterval(() => {
        timerSeconds -= 1;
        updateTimer();
        if (timerSeconds > 0 && timerSeconds % 60 === 0) updateFocus(2);
        if (timerSeconds <= 0) {
          clearInterval(timerId);
          timerId = null;
          $("#bubble").textContent = randomMessage("finish");
          updateFocus(10);
          playPop();
          firework();
        }
      }, 1000);
    });

    $("#pauseBtn").addEventListener("click", () => {
      clearInterval(timerId);
      timerId = null;
      $("#bubble").textContent = randomMessage("pause");
    });

    $("#resetBtn").addEventListener("click", () => {
      clearInterval(timerId);
      timerId = null;
      timerSeconds = 300;
      updateTimer();
      $("#bubble").textContent = randomMessage("reset");
    });

    $("#morningBtn").addEventListener("click", () => setMode("morning"));
    $("#nightBtn").addEventListener("click", () => setMode("night"));
    $("#musicBtn").addEventListener("click", playMusic);
    $("#switchTrackBtn").addEventListener("click", () => {
      currentTrack = currentTrack === "night" ? "morning" : "night";
      $("#trackName").textContent = currentTrack === "night" ? "Night Guitar Canon 吉他和弦卡农" : "Morning Light 轻快纯音乐";
      stopMusic();
      toast("已切换演示音色");
    });
    $("#addUrlBtn").addEventListener("click", () => {
      const url = $("#musicUrl").value.trim();
      toast(url ? "已添加音频直链演示项" : "请先粘贴音频直链");
      $("#musicUrl").value = "";
    });

    $("#wallpaperBtn").addEventListener("click", () => $("#wallpaperInput").click());
    $("#wallpaperInput").addEventListener("change", event => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        document.body.style.backgroundImage = `url(${reader.result})`;
        $("#wallpaperPreview").style.backgroundImage = `url(${reader.result})`;
        toast("本地图片已设为壁纸");
      };
      reader.readAsDataURL(file);
    });

    const drop = $("#dropZone");
    ["dragenter", "dragover"].forEach(name => {
      drop.addEventListener(name, event => {
        event.preventDefault();
        drop.classList.add("drag");
      });
    });
    ["dragleave", "drop"].forEach(name => {
      drop.addEventListener(name, event => {
        event.preventDefault();
        drop.classList.remove("drag");
      });
    });
    drop.addEventListener("drop", event => {
      [...event.dataTransfer.files].forEach(file => {
        const item = document.createElement("div");
        item.className = "file-item";
        item.innerHTML = `<span>${file.name}</span><strong>${(file.size / 1024).toFixed(1)} KB</strong>`;
        $("#fileList").prepend(item);
      });
      toast("文件已加入 Demo 列表");
    });

    updateFocus(0);
    updateTimer();
  </script>
</body>
</html>
