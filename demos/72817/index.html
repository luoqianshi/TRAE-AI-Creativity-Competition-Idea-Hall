<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银行知识库 RAG 智能助手</title>

    <!-- Markdown 渲染 + 代码高亮（CDN） -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/sql.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            padding: 16px;
            color: #333;
            font-size: 14px;
            line-height: 1.6;
        }
        html { height: 100%; }

        /* ====== 布局 ====== */
        .container {
            max-width: 1500px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .header h1 { font-size: 24px; margin-bottom: 4px; font-weight: 700; letter-spacing: 0.5px; }
        .header p { font-size: 12px; opacity: 0.92; }

        .main-layout {
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 12px;
        }

        /* ====== 左侧面板 ====== */
        .side-panel {
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-section {
            border-bottom: 1px solid #eee;
            display: flex;
            flex-direction: column;
        }
        .panel-section:last-child { border-bottom: none; }

        .panel-section-header {
            padding: 12px 16px 8px;
            font-weight: 600;
            font-size: 13px;
            color: #555;
            letter-spacing: 0.3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-section-header .count-badge {
            background: #f0f4ff;
            color: #667eea;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* ====== 会话列表 ====== */
        .new-chat-btn {
            margin: 0 12px 10px;
            padding: 10px 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(102,126,234,0.25);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .new-chat-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(102,126,234,0.35);
        }
        .new-chat-btn:active { transform: translateY(0); }

        .conversation-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 0 8px 8px;
        }
        .conversation-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            transition: background 0.15s;
            gap: 8px;
        }
        .conversation-item:hover { background: #f5f7fb; }
        .conversation-item.active {
            background: linear-gradient(135deg, #e8edff, #f0ebff);
        }
        .conversation-item.active .conv-title { color: #4c5cbf; font-weight: 600; }
        .conv-icon {
            width: 22px; height: 22px;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: #eef2fb; border-radius: 6px;
            font-size: 12px;
        }
        .conversation-item.active .conv-icon {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .conv-title {
            flex: 1;
            font-size: 13px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-meta {
            font-size: 10px;
            color: #999;
            margin-top: 2px;
        }
        .conv-info { flex: 1; min-width: 0; }
        .conv-delete-btn {
            opacity: 0;
            width: 22px; height: 22px;
            border-radius: 6px;
            background: transparent;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.15s;
            display: flex; align-items: center; justify-content: center;
        }
        .conversation-item:hover .conv-delete-btn { opacity: 1; }
        .conv-delete-btn:hover { background: #ffe4e4; color: #e74c3c; }

        /* ====== 文档管理 ====== */
        .document-section { flex-shrink: 0; max-height: 40%; display: flex; flex-direction: column; }
        .upload-area {
            border: 2px dashed #d0d0d0;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin: 0 12px 10px;
            background: #fafbfc;
        }
        .upload-area:hover { border-color: #667eea; background: #f3f5ff; }
        .upload-icon { font-size: 24px; color: #888; }
        .upload-text { color: #666; font-size: 12px; margin-top: 6px; }

        .document-list {
            overflow-y: auto;
            padding: 0 12px 12px;
        }
        .document-item {
            padding: 8px 10px;
            background: #f8f9fb;
            border-radius: 8px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        .document-name {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #333;
        }
        .document-meta { color: #999; font-size: 11px; }
        .doc-delete-btn {
            background: transparent;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.6;
            padding: 0 4px;
        }
        .doc-delete-btn:hover { opacity: 1; }

        /* ====== 中央对话区 ====== */
        .chat-panel {
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 14px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .chat-title {
            font-size: 16px;
            font-weight: 600;
            color: #222;
        }
        .chat-mode-switch {
            display: flex;
            gap: 4px;
            background: #f3f5fa;
            padding: 4px;
            border-radius: 8px;
        }
        .mode-btn {
            padding: 6px 14px;
            border: none;
            background: transparent;
            color: #666;
            font-size: 12px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .mode-btn.active {
            background: white;
            color: #4c5cbf;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        /* ====== 消息区 ====== */
        .chat-messages {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 100%;
            animation: messageFadeIn 0.3s ease-out;
        }
        @keyframes messageFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { justify-content: flex-end; }
        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .message.user .message-content p { color: rgba(255,255,255,0.95); }

        .message-avatar {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
        }
        .message.user .message-avatar {
            background: linear-gradient(135deg, #4c5cbf, #5e4aa8);
            color: white;
            order: 2;
        }
        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #e8edff, #f0ebff);
            color: #4c5cbf;
        }
        .message.assistant .message-content { order: 2; }

        .message-bubble {
            background: #f7f9fc;
            border-radius: 12px;
            padding: 14px 16px;
            max-width: 100%;
            min-width: 80px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .message-content { flex: 1; min-width: 0; }

        .message-text {
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        /* ====== Markdown 样式 ====== */
        .message-text h1, .message-text h2, .message-text h3 {
            margin: 12px 0 8px;
            font-weight: 600;
            line-height: 1.3;
        }
        .message-text h1 { font-size: 18px; }
        .message-text h2 { font-size: 16px; }
        .message-text h3 { font-size: 14px; }
        .message-text p { margin-bottom: 8px; }
        .message-text p:last-child { margin-bottom: 0; }
        .message-text ul, .message-text ol {
            margin: 8px 0 8px 22px;
        }
        .message-text li { margin-bottom: 4px; }
        .message-text strong { font-weight: 600; }
        .message-text em { font-style: italic; }
        .message-text code:not(pre code) {
            background: rgba(102,126,234,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: "SF Mono", Menlo, Consolas, monospace;
            font-size: 12.5px;
            color: #4c5cbf;
        }
        .message.user .message-text code:not(pre code) {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        .message-text pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 12px 14px;
            border-radius: 8px;
            margin: 10px 0;
            overflow-x: auto;
            font-size: 12.5px;
            line-height: 1.55;
        }
        .message-text pre code {
            background: transparent;
            padding: 0;
            color: inherit;
            font-family: "SF Mono", Menlo, Consolas, monospace;
        }
        .message-text blockquote {
            border-left: 3px solid #c7d2fe;
            padding-left: 12px;
            color: #64748b;
            margin: 8px 0;
            font-style: italic;
        }
        .message-text a { color: #4c5cbf; text-decoration: none; border-bottom: 1px dashed #c7d2fe; }
        .message-text hr { border: none; border-top: 1px solid #e2e8f0; margin: 12px 0; }
        .message-text table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
            font-size: 12.5px;
        }
        .message-text th, .message-text td {
            border: 1px solid #e2e8f0;
            padding: 6px 10px;
            text-align: left;
        }
        .message-text th { background: #f3f5fa; font-weight: 600; }

        /* ====== 工具调用卡片 ====== */
        .tool-call-box {
            background: #fdf8ef;
            border: 1px solid #f5e6c5;
            border-left: 3px solid #f39c12;
            border-radius: 8px;
            padding: 10px 12px;
            margin: 10px 0;
            font-size: 12.5px;
        }
        .tool-call-box.result {
            background: #eef8f5;
            border-color: #cfe8dd;
            border-left-color: #27ae60;
        }
        .tool-call-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #8b5a00;
            margin-bottom: 6px;
        }
        .tool-call-box.result .tool-call-header { color: #1a6b3e; }
        .tool-call-icon {
            font-size: 14px;
        }
        .tool-call-args {
            color: #666;
            font-family: "SF Mono", Menlo, Consolas, monospace;
            font-size: 12px;
            background: rgba(255,255,255,0.6);
            padding: 6px 10px;
            border-radius: 6px;
            margin-top: 4px;
            word-break: break-word;
        }
        .tool-call-box.result .tool-call-args {
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        /* ====== 思考中提示 ====== */
        .thinking-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #777;
            font-size: 12.5px;
            font-style: italic;
            padding: 8px 0;
        }
        .thinking-dots { display: inline-flex; gap: 4px; }
        .thinking-dots span {
            width: 6px; height: 6px;
            background: #bbb;
            border-radius: 50%;
            animation: thinkingPulse 1.4s infinite;
        }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes thinkingPulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        /* ====== 输入区 ====== */
        .chat-input-area {
            padding: 16px 20px 20px;
            border-top: 1px solid #eee;
            background: #fafbfc;
            flex-shrink: 0;
        }
        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: white;
            border-radius: 12px;
            padding: 10px 12px;
            border: 1px solid #e4e7ee;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-wrapper:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        #questionInput {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 22px;
            max-height: 140px;
            line-height: 1.6;
            background: transparent;
        }
        .send-btn {
            padding: 8px 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            box-shadow: 0 4px 12px rgba(102,126,234,0.25);
        }
        .send-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(102,126,234,0.35);
        }
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .input-hint {
            text-align: center;
            font-size: 11px;
            color: #999;
            margin-top: 8px;
        }

        /* ====== 滚动条美化 ====== */
        .chat-messages::-webkit-scrollbar,
        .conversation-list::-webkit-scrollbar,
        .document-list::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-thumb,
        .conversation-list::-webkit-scrollbar-thumb,
        .document-list::-webkit-scrollbar-thumb {
            background: #d5d9e3;
            border-radius: 3px;
        }
        .chat-messages::-webkit-scrollbar-thumb:hover,
        .conversation-list::-webkit-scrollbar-thumb:hover,
        .document-list::-webkit-scrollbar-thumb:hover {
            background: #b0b6c4;
        }

        /* ====== 错误提示 ====== */
        .error-box {
            background: #fff5f5;
            border: 1px solid #ffcfcf;
            color: #c0392b;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            margin: 10px 0;
        }

        /* ====== 响应式 ====== */
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            .side-panel { max-height: 40vh; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏦 银行知识库智能助手</h1>
            <p>RAG 检索增强 · Agent 工具调用 · 流式对话</p>
        </div>

        <div class="main-layout">
            <!-- ====== 左侧面板：会话 + 文档 ====== -->
            <div class="side-panel">
                <div class="panel-section">
                    <div class="panel-section-header">
                        <span>💬 对话</span>
                        <span class="count-badge" id="convCount">0</span>
                    </div>
                    <button class="new-chat-btn" onclick="createConversation()">+ 新建对话</button>
                    <div class="conversation-list" id="conversationList">
                        <div style="text-align:center; padding: 30px 20px; color: #aaa; font-size: 12px;">
                            暂无对话，点击上方按钮开始
                        </div>
                    </div>
                </div>

                <div class="panel-section document-section">
                    <div class="panel-section-header">
                        <span>📚 知识库文档</span>
                        <span class="count-badge" id="docCount">0</span>
                    </div>
                    <label class="upload-area" for="docFile">
                        <div class="upload-icon">📄</div>
                        <div class="upload-text">点击上传文档<br>(.txt / .md)</div>
                        <input type="file" id="docFile" accept=".txt,.md" style="display:none" onchange="uploadDocument(event)">
                    </label>
                    <div class="document-list" id="documentList">
                        <div style="text-align:center; padding: 14px; color: #aaa; font-size: 11px;">
                            暂无文档
                        </div>
                    </div>
                </div>
            </div>

            <!-- ====== 中央对话区 ====== -->
            <div class="chat-panel">
                <div class="chat-header">
                    <div class="chat-title" id="chatTitle">开始新对话</div>
                    <div class="chat-mode-switch">
                        <button class="mode-btn active" id="modeAgentBtn" onclick="switchMode('agent')">🤖 Agent模式</button>
                        <button class="mode-btn" id="modeRagBtn" onclick="switchMode('rag')">📖 纯RAG模式</button>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <!-- 消息动态插入 -->
                </div>

                <div class="chat-input-area">
                    <div class="input-wrapper">
                        <textarea id="questionInput"
                                  placeholder="输入问题，按 Enter 发送，Shift+Enter 换行..."
                                  rows="1"
                                  onkeydown="handleKeyDown(event)"
                                  oninput="autoResize(this)"></textarea>
                        <button class="send-btn" id="sendBtn" onclick="sendQuestion()">发送</button>
                    </div>
                    <div class="input-hint">Enter 发送 · Shift+Enter 换行</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 配置 Marked + highlight.js
        // ============================================================
        (function initMarked() {
            if (window.marked && window.hljs) {
                marked.setOptions({
                    breaks: true,
                    gfm: true,
                    highlight: function(code, lang) {
                        try {
                            if (lang && hljs.getLanguage(lang)) {
                                return hljs.highlight(code, { language: lang }).value;
                            }
                            return hljs.highlightAuto(code).value;
                        } catch (e) {
                            return code;
                        }
                    }
                });
            }
        })();

        function renderMarkdown(text) {
            if (!text) return '';
            if (window.marked) {
                try {
                    return marked.parse(text);
                } catch (e) {
                    return escapeHtml(text).replace(/\n/g, '<br>');
                }
            }
            return escapeHtml(text).replace(/\n/g, '<br>');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // 状态
        // ============================================================
        let currentSessionId = null;
        let currentMode = 'agent';  // 'agent' | 'rag'
        let isStreaming = false;
        let currentStreamAnswer = '';
        let currentStreamMessageDiv = null;
        let currentStreamContentDiv = null;

        // ============================================================
        // 初始化
        // ============================================================
        window.addEventListener('DOMContentLoaded', () => {
            loadDocuments();
            // 自动创建第一个会话
            createConversation();
        });

        // ============================================================
        // 会话管理
        // ============================================================
        async function createConversation() {
            try {
                const res = await fetch('/api/conversations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: currentMode })
                });
                const data = await res.json();
                if (data.success && data.sessionId) {
                    currentSessionId = data.sessionId;
                    await loadConversations();
                    clearChatMessages();
                    updateChatTitle('新对话');
                    document.getElementById('questionInput').focus();
                }
            } catch (e) {
                alert('创建会话失败: ' + e.message);
            }
        }

        async function loadConversations() {
            try {
                const res = await fetch('/api/conversations');
                const list = await res.json();
                const container = document.getElementById('conversationList');
                document.getElementById('convCount').textContent = list.length;

                if (!list.length) {
                    container.innerHTML = '<div style="text-align:center; padding: 30px 20px; color: #aaa; font-size: 12px;">暂无对话</div>';
                    return;
                }

                container.innerHTML = '';
                // 后端已经按最后活跃时间倒序
                for (const conv of list) {
                    const item = document.createElement('div');
                    item.className = 'conversation-item' + (conv.sessionId === currentSessionId ? ' active' : '');
                    const title = conv.title && conv.title !== '新对话' ? conv.title : '新对话';
                    const msgCount = typeof conv.messageCount === 'number' ? conv.messageCount : 0;
                    const icon = (conv.mode === 'rag') ? '📖' : '🤖';
                    item.innerHTML = `
                        <div class="conv-icon">${icon}</div>
                        <div class="conv-info">
                            <div class="conv-title">${escapeHtml(title)}</div>
                            <div class="conv-meta">${msgCount > 0 ? (msgCount + ' 条消息') : '空对话'}</div>
                        </div>
                        <button class="conv-delete-btn" title="删除" onclick="event.stopPropagation(); deleteConversation('${conv.sessionId}')">✕</button>
                    `;
                    item.onclick = () => selectConversation(conv.sessionId, conv.title);
                    container.appendChild(item);
                }
            } catch (e) {
                console.error('加载会话列表失败:', e);
            }
        }

        function selectConversation(sessionId, title) {
            currentSessionId = sessionId;
            clearChatMessages();
            updateChatTitle(title);
            loadConversations();
        }

        async function deleteConversation(sessionId) {
            try {
                await fetch('/api/conversations/' + encodeURIComponent(sessionId), {
                    method: 'DELETE'
                });
                if (sessionId === currentSessionId) {
                    // 当前会话被删除，创建一个新的
                    await createConversation();
                } else {
                    await loadConversations();
                }
            } catch (e) {
                console.error('删除会话失败:', e);
            }
        }

        function clearChatMessages() {
            const msgs = document.getElementById('chatMessages');
            msgs.innerHTML = '';
            const welcome = document.createElement('div');
            welcome.style.cssText = 'margin:auto; text-align:center; color:#bbb; padding:40px 20px;';
            welcome.innerHTML = `
                <div style="font-size:42px; margin-bottom:12px;">${currentMode === 'agent' ? '🤖' : '📖'}</div>
                <div style="font-size:14px; color:#888; margin-bottom:6px; font-weight:600;">
                    ${currentMode === 'agent' ? 'Agent 模式：自主思考 + 动态工具调用' : 'RAG 模式：直接检索文档回答'}
                </div>
                <div style="font-size:12px; color:#aaa;">
                    输入你的问题，开始对话...
                </div>
            `;
            msgs.appendChild(welcome);
        }

        function updateChatTitle(title) {
            document.getElementById('chatTitle').textContent = title || '新对话';
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('modeAgentBtn').classList.toggle('active', mode === 'agent');
            document.getElementById('modeRagBtn').classList.toggle('active', mode === 'rag');
            // 切换模式时新建一个会话
            createConversation();
        }

        // ============================================================
        // 文档管理
        // ============================================================
        async function loadDocuments() {
            try {
                const res = await fetch('/api/documents');
                const list = await res.json();
                const container = document.getElementById('documentList');
                document.getElementById('docCount').textContent = list.length;

                if (!list.length) {
                    container.innerHTML = '<div style="text-align:center; padding: 14px; color: #aaa; font-size: 11px;">暂无文档</div>';
                    return;
                }

                container.innerHTML = '';
                for (const doc of list) {
                    const item = document.createElement('div');
                    item.className = 'document-item';
                    const name = doc.name || doc.docName || '未知文档';
                    const chunks = doc.chunkCount != null ? doc.chunkCount + ' 块' : '';
                    item.innerHTML = `
                        <span style="font-size:14px;">📄</span>
                        <span class="document-name" title="${escapeHtml(name)}">${escapeHtml(name)}</span>
                        <span class="document-meta">${chunks}</span>
                        <button class="doc-delete-btn" title="删除" onclick="deleteDocument('${escapeHtml(name).replace(/'/g, "\\'")}')">✕</button>
                    `;
                    container.appendChild(item);
                }
            } catch (e) {
                console.error('加载文档列表失败:', e);
            }
        }

        async function uploadDocument(event) {
            const file = event.target.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    loadDocuments();
                    // 重置 input，以便再次上传同名文件
                    event.target.value = '';
                } else {
                    alert('上传失败: ' + (data.message || '未知错误'));
                }
            } catch (e) {
                alert('上传失败: ' + e.message);
            }
        }

        async function deleteDocument(name) {
            if (!confirm('删除文档 "' + name + '"？')) return;
            try {
                const res = await fetch('/api/documents?name=' + encodeURIComponent(name), { method: 'DELETE' });
                const data = await res.json();
                if (data.success) loadDocuments();
            } catch (e) { console.error('删除文档失败:', e); }
        }

        // ============================================================
        // 消息渲染辅助
        // ============================================================
        function appendUserMessage(text) {
            const msgs = document.getElementById('chatMessages');
            // 移除欢迎信息
            const welcome = msgs.querySelector('[style*="margin:auto"]');
            if (welcome) welcome.remove();

            const msg = document.createElement('div');
            msg.className = 'message user';
            msg.innerHTML = `
                <div class="message-content">
                    <div class="message-bubble">
                        <div class="message-text" style="white-space:pre-wrap; word-break:break-word;">${escapeHtml(text)}</div>
                    </div>
                </div>
                <div class="message-avatar">我</div>
            `;
            msgs.appendChild(msg);
            msgs.scrollTop = msgs.scrollHeight;
        }

        function createAssistantMessage() {
            const msgs = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = 'message assistant';
            msg.innerHTML = `
                <div class="message-avatar">AI</div>
                <div class="message-content" style="flex:1; min-width:0;">
                    <div class="message-bubble" style="min-width:100px;">
                        <div class="message-text"></div>
                    </div>
                </div>
            `;
            msgs.appendChild(msg);
            msgs.scrollTop = msgs.scrollHeight;
            return msg.querySelector('.message-text');
        }

        function appendToolCall(toolName, args, isResult) {
            const contentDiv = currentStreamContentDiv;
            if (!contentDiv) return;
            const box = document.createElement('div');
            box.className = 'tool-call-box' + (isResult ? ' result' : '');
            const label = isResult ? '工具结果' : '调用工具';
            const icon = isResult ? '📦' : '🔧';
            let displayArgs = args;
            if (typeof args === 'object') {
                try { displayArgs = JSON.stringify(args, null, 2); }
                catch (e) { displayArgs = String(args); }
            }
            box.innerHTML = `
                <div class="tool-call-header">
                    <span class="tool-call-icon">${icon}</span>
                    <span>${label}: ${escapeHtml(toolName)}</span>
                </div>
                <div class="tool-call-args">${escapeHtml(displayArgs)}</div>
            `;
            contentDiv.appendChild(box);
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
            return box;
        }

        function appendThinking(text) {
            const contentDiv = currentStreamContentDiv;
            if (!contentDiv) return;
            const div = document.createElement('div');
            div.className = 'thinking-indicator';
            div.innerHTML = `<span>${escapeHtml(text)}</span><span class="thinking-dots"><span></span><span></span><span></span></span>`;
            contentDiv.appendChild(div);
            return div;
        }

        // ============================================================
        // 主逻辑：发送问题 + 流式接收
        // ============================================================
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendQuestion();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            const newHeight = Math.min(textarea.scrollHeight, 140);
            textarea.style.height = newHeight + 'px';
        }

        async function sendQuestion() {
            if (isStreaming) return;

            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;

            if (!currentSessionId) {
                try {
                    const res = await fetch('/api/conversations', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mode: currentMode })
                    });
                    const data = await res.json();
                    currentSessionId = data.sessionId;
                } catch (e) {
                    alert('创建会话失败: ' + e.message);
                    return;
                }
            }

            appendUserMessage(question);
            input.value = '';
            input.style.height = 'auto';
            document.getElementById('sendBtn').disabled = true;
            isStreaming = true;
            currentStreamAnswer = '';

            // 创建一个空的助手消息容器
            currentStreamContentDiv = createAssistantMessage();

            // 初始化一个占位符供流式增量写入
            const answerDiv = document.createElement('div');
            answerDiv.className = 'streaming-answer';
            currentStreamContentDiv.appendChild(answerDiv);
            currentStreamMessageDiv = answerDiv;

            try {
                const endpoint = currentMode === 'agent'
                    ? '/api/agent/ask/stream'
                    : '/api/ask/stream';
                const resp = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, sessionId: currentSessionId })
                });

                if (!resp.ok) {
                    throw new Error('HTTP ' + resp.status);
                }

                const reader = resp.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';
                let receivedDone = false;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    // SSE：按 \n\n 分块
                    const parts = buffer.split('\n\n');
                    buffer = parts.pop();
                    for (const part of parts) {
                        const lines = part.split('\n');
                        for (const line of lines) {
                            if (!line.startsWith('data:')) continue;
                            const jsonStr = line.substring(5).trim();
                            if (!jsonStr) continue;
                            try {
                                const evt = JSON.parse(jsonStr);
                                handleStreamEvent(evt);
                                if (evt.type === 'done') receivedDone = true;
                            } catch (e) {
                                console.warn('SSE 事件解析失败:', jsonStr.substring(0, 80));
                            }
                        }
                    }
                }

                if (!receivedDone && currentStreamAnswer.length === 0) {
                    const errBox = document.createElement('div');
                    errBox.className = 'error-box';
                    errBox.textContent = '⚠️ 连接中断，未收到完整回答';
                    currentStreamContentDiv.appendChild(errBox);
                }
            } catch (e) {
                console.error('流式请求失败:', e);
                const errBox = document.createElement('div');
                errBox.className = 'error-box';
                errBox.textContent = '❌ 请求失败: ' + e.message;
                if (currentStreamContentDiv) currentStreamContentDiv.appendChild(errBox);
            } finally {
                isStreaming = false;
                document.getElementById('sendBtn').disabled = false;
                // 刷新会话列表（标题/消息数可能更新）
                loadConversations();
            }
        }

        function handleStreamEvent(evt) {
            if (!evt) return;
            const msgs = document.getElementById('chatMessages');

            if (evt.type === 'start') {
                // 思考中
                const thinking = appendThinking('正在思考...');
                setTimeout(() => { if (thinking && thinking.parentNode) thinking.remove(); }, 2500);
            }
            else if (evt.type === 'thinking') {
                const thinking = appendThinking(evt.content || '思考中...');
                setTimeout(() => { if (thinking && thinking.parentNode) thinking.remove(); }, 3000);
            }
            else if (evt.type === 'tool_call') {
                appendToolCall(evt.tool, evt.arguments, false);
            }
            else if (evt.type === 'tool_result') {
                appendToolCall(evt.tool, evt.result, true);
            }
            else if (evt.type === 'delta') {
                currentStreamAnswer += evt.content || '';
                if (currentStreamMessageDiv) {
                    // 流式期间用纯文本展示（便于看到光标动画），done 后再渲染 Markdown
                    currentStreamMessageDiv.innerHTML =
                        escapeHtml(currentStreamAnswer).replace(/\n/g, '<br>') +
                        '<span style="color:#667eea; font-weight:600; animation:cursorBlink 1s infinite;">▋</span>';
                    msgs.scrollTop = msgs.scrollHeight;
                }
            }
            else if (evt.type === 'done') {
                // 最终渲染成 Markdown
                if (currentStreamMessageDiv) {
                    const finalText = (evt.answer != null) ? evt.answer : currentStreamAnswer;
                    currentStreamAnswer = finalText;
                    currentStreamMessageDiv.innerHTML = renderMarkdown(finalText);
                }
                // 工具调用结果 + 来源信息（如果有）
                if (evt.sources && Array.isArray(evt.sources) && evt.sources.length) {
                    const sourceBox = document.createElement('div');
                    sourceBox.className = 'tool-call-box result';
                    sourceBox.innerHTML = `
                        <div class="tool-call-header">
                            <span class="tool-call-icon">📚</span>
                            <span>参考来源 (${evt.sources.length})</span>
                        </div>
                        <div class="tool-call-args">${
                            evt.sources.map(s => {
                                const n = s.docName || s.name || '未知文档';
                                const sc = s.score != null ? '（相似度: ' + (Number(s.score) * 100).toFixed(1) + '%）' : '';
                                return '• ' + escapeHtml(n) + sc;
                            }).join('<br>')
                        }</div>
                    `;
                    currentStreamContentDiv.appendChild(sourceBox);
                }
                msgs.scrollTop = msgs.scrollHeight;
            }
            else if (evt.type === 'error') {
                const errBox = document.createElement('div');
                errBox.className = 'error-box';
                errBox.textContent = '⚠️ ' + (evt.message || '发生错误');
                currentStreamContentDiv.appendChild(errBox);
            }
        }

        // 添加光标动画 CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes cursorBlink {
                0%, 50% { opacity: 1; }
                51%, 100% { opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
