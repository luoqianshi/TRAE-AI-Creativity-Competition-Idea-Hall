        fullText: '大堰河，是我的保姆。\n她的名字就是生她的村庄的名字，\n她是童养媳，\n大堰河，是我的保姆。',
        author: '艾青《大堰河——我的保姆》', tags: ['底层', '真情'],
        description: '艾青是中国现代诗歌的重要代表。他以自由诗的形式关注底层人民的命运，《大堰河》是中国现代诗中最感人的抒情长诗之一。黄土高原的苍凉与厚重，成为艾青诗歌最重要的精神底色。' }
    ]
  }
];

// ===== RENDER FUNCTIONS =====
function renderTimeline() {
  const track = document.getElementById('timelineTrack');
  track.innerHTML = dynasties.map((d, i) => `
    <div class="dynasty-node" data-index="${i}" onclick="scrollToDynasty(${i})">
      <div class="dynasty-dot"></div>
      <div class="dynasty-label">${d.name}</div>
      <div class="dynasty-period">${d.period.split('—')[0].replace('约','')}</div>
    </div>
    ${i < dynasties.length - 1 ? '<div class="timeline-line"></div>' : ''}
  `).join('');
}

function renderSections() {
  const main = document.getElementById('mainContent');
  main.innerHTML = dynasties.map((d, i) => `
    <section class="dynasty-section" id="dynasty-${i}" data-index="${i}">
      <div class="section-header fade-in">
        <h2 class="section-dynasty-name">${d.name}</h2>
        <p class="section-period">${d.period}</p>
        <p class="section-intro">${d.intro}</p>
      </div>
      <div class="map-area fade-in">
        <div class="echarts-map" id="echarts-map-${i}"></div>
      </div>
      <div class="poem-list-bar fade-in">
        ${d.poems.map((p, j) => `
          <div class="poem-chip" onclick="openModal(${i}, ${j})">
            <span class="poem-chip-dot"></span>
            <span>${p.location}</span>
            <span class="poem-chip-author">${p.author.split('《')[0]}</span>
          </div>
        `).join('')}
      </div>
    </section>
  `).join('');
}

// ===== ECharts Map Rendering =====
const chartInstances = {};

function initMap(dynastyIndex) {
  const containerId = 'echarts-map-' + dynastyIndex;
  const container = document.getElementById(containerId);
  if (!container || chartInstances[containerId]) return;

  const d = dynasties[dynastyIndex];
  const chart = echarts.init(container, null, { renderer: 'svg' });
  chartInstances[containerId] = chart;

  const scatterData = d.poems.map((p, idx) => ({
    name: p.location,
    value: [p.lon, p.lat],
    poemIndex: idx,
    dynastyIndex: dynastyIndex,
    itemStyle: { color: '#8b2500' }
  }));

  chart.setOption({
    backgroundColor: '#faf6ee',
    geo: {
      map: 'china',
      roam: false,
      zoom: 1.15,
      center: [105, 36],
      label: { show: false },
      itemStyle: {
        areaColor: '#e8ddd0',
        borderColor: '#c4b89a',
        borderWidth: 0.8
      },
      emphasis: {
        disabled: true,
        itemStyle: { areaColor: '#ddd0c0' }
      }
    },
    tooltip: {
      trigger: 'item',
      backgroundColor: 'rgba(250, 246, 238, 0.96)',
      borderColor: '#c4b89a',
      borderWidth: 1,
      textStyle: {
        color: '#2c2416',
        fontFamily: 'Noto Sans CJK SC, sans-serif',
        fontSize: 13
      },
      padding: [10, 14],
      formatter: function(params) {
        const p = dynasties[params.data.dynastyIndex].poems[params.data.poemIndex];
        return '<div style="font-weight:600;color:#8b2500;margin-bottom:4px;">' + p.location + '</div>' +
               '<div style="font-size:12px;color:#8a7e6b;margin-bottom:6px;">' + p.author + '</div>' +
               '<div style="font-size:12px;line-height:1.6;color:#2c2416;">' + p.text.replace(/\n/g, '<br>') + '</div>';
      }
    },
    series: [{
      type: 'scatter',
      coordinateSystem: 'geo',
      data: scatterData,
      symbol: 'circle',
      symbolSize: 14,
      itemStyle: {
        color: '#8b2500',
        shadowBlur: 8,
        shadowColor: 'rgba(139, 37, 0, 0.3)'
      },
      emphasis: {
        scale: 1.8,
        itemStyle: {
          color: '#2e5c4f',
          shadowBlur: 16,
          shadowColor: 'rgba(46, 92, 79, 0.4)'
        }
      }
    }],
    animationDuration: 800,
    animationEasing: 'cubicOut'
  });

  chart.on('click', function(params) {
    if (params.data && params.data.dynastyIndex !== undefined) {
      openModal(params.data.dynastyIndex, params.data.poemIndex);
    }
  });

  window.addEventListener('resize', function() {
    chart.resize();
  });
}

function initVisibleMaps() {
  dynasties.forEach((_, i) => {
    const section = document.getElementById('dynasty-' + i);
    if (!section) return;
    const rect = section.getBoundingClientRect();
    if (rect.top < window.innerHeight && rect.bottom > 0) {
      initMap(i);
    }
  });
}

function scrollToDynasty(index) {
  const section = document.getElementById('dynasty-' + index);
  if (section) {
    const navHeight = document.querySelector('.timeline-nav').offsetHeight;
    const y = section.getBoundingClientRect().top + window.pageYOffset - navHeight - 20;
    window.scrollTo({ top: y, behavior: 'smooth' });
    setTimeout(() => initMap(index), 400);
  }
}

function updateActiveDynasty() {
  const sections = document.querySelectorAll('.dynasty-section');
  const nodes = document.querySelectorAll('.dynasty-node');
  let activeIndex = 0;
  sections.forEach((s, i) => {
    const rect = s.getBoundingClientRect();
    if (rect.top < window.innerHeight / 2) activeIndex = i;
  });
  nodes.forEach((n, i) => n.classList.toggle('active', i === activeIndex));

  const activeNode = nodes[activeIndex];
  if (activeNode) {
    const nav = document.querySelector('.timeline-nav');
    const nodeLeft = activeNode.offsetLeft;
    const navWidth = nav.offsetWidth;
    if (nodeLeft > navWidth / 2) {
      nav.scrollLeft = nodeLeft - navWidth / 2 + 40;
    }
  }
}

// ===== Modal =====
function openModal(dynastyIndex, poemIndex) {
  const d = dynasties[dynastyIndex];
  const p = d.poems[poemIndex];
  document.getElementById('modalBody').innerHTML = `
    <div class="modal-dynasty-label">${d.name} · ${d.period}</div>
    <h2 class="modal-location">${p.location}</h2>
    <p class="modal-modern-location">${p.modernLocation}</p>
    <div class="modal-poem">${p.fullText.replace(/\n/g, '<br>')}</div>
    <p class="modal-author">— ${p.author}</p>
    <div class="modal-desc-title">地理背景</div>
    <p class="modal-desc">${p.description}</p>
  `;
  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay') || e.target.classList.contains('modal-close')) {
    document.getElementById('modalOverlay').classList.remove('active');
    document.body.style.overflow = '';
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

function handleScrollAnimations() {
  document.querySelectorAll('.fade-in').forEach(el => {
    if (el.getBoundingClientRect().top < window.innerHeight * 0.85) {
      el.classList.add('visible');
    }
  });
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    const active = document.querySelector('.dynasty-node.active');
    const idx = parseInt(active?.dataset.index || 0);
    if (idx < dynasties.length - 1) scrollToDynasty(idx + 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    const active = document.querySelector('.dynasty-node.active');
    const idx = parseInt(active?.dataset.index || 0);
    if (idx > 0) scrollToDynasty(idx - 1);
  }
});

// ===== INIT =====
window.addEventListener('scroll', () => {
  updateActiveDynasty();
  handleScrollAnimations();
  initVisibleMaps();
});

// Register China map with ECharts
echarts.registerMap('china', chinaGeoJSON);

renderTimeline();
renderSections();

setTimeout(() => {
  handleScrollAnimations();
  updateActiveDynasty();
  initVisibleMaps();
}, 100);
</script>

</body>
</html>
