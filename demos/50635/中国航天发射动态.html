<title>中国航天发射史动态回放系统</title>
<!-- ECharts 5 -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #030a1a;
    color: #cfe0ff;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    overflow: hidden;
  }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    background:
      radial-gradient(ellipse at center, #0a1a3a 0%, #030a1a 70%) no-repeat;
  }

  /* 顶部标题 */
  .title-bar {
    position: absolute;
    top: 16px;
    left: 0; right: 0;
    text-align: center;
    z-index: 20;
    pointer-events: none;
    color: #cfe0ff;
  }
  .title-bar .t1 {
    font-size: 24px;
    letter-spacing: 6px;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(80,160,255,0.4);
  }
  .title-bar .t2 {
    margin-top: 4px;
    font-size: 12px;
    letter-spacing: 4px;
    color: #7fa8e0;
    opacity: 0.85;
  }

  /* 地图容器 */
  #map {
    position: absolute;
    top: 60px;
    left: 0;
    right: 0;
    height: 60vh;
    z-index: 1;
  }

  /* 柱状图容器 */
  #chart {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 34vh;
    z-index: 1;
    border-top: 1px solid rgba(80, 160, 255, 0.15);
    background: linear-gradient(to bottom, rgba(5,15,35,0) 0%, rgba(5,15,35,0.6) 100%);
  }

  /* 左上角统计 */
  .stat-panel {
    position: absolute;
    top: 70px;
    left: 24px;
    z-index: 10;
    padding: 12px 18px;
    min-width: 180px;
    background: rgba(10, 25, 55, 0.55);
    border: 1px solid rgba(80, 160, 255, 0.35);
    border-radius: 4px;
    font-family: "Consolas", "Courier New", monospace;
    backdrop-filter: blur(4px);
  }
  .stat-panel .lbl {
    font-size: 12px;
    color: #7fa8e0;
    letter-spacing: 2px;
  }
  .stat-panel .val {
    margin-top: 4px;
    font-size: 38px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1;
    text-shadow: 0 0 10px rgba(80,160,255,0.6);
  }
  .stat-panel .sub {
    margin-top: 6px;
    font-size: 11px;
    color: #5a83b5;
    letter-spacing: 1px;
  }

  /* 右上角年份 */
  .year-panel {
    position: absolute;
    top: 70px;
    right: 24px;
    z-index: 10;
    padding: 12px 18px;
    min-width: 180px;
    text-align: right;
    background: rgba(10, 25, 55, 0.55);
    border: 1px solid rgba(80, 160, 255, 0.35);
    border-radius: 4px;
    font-family: "Consolas", "Courier New", monospace;
    backdrop-filter: blur(4px);
  }
  .year-panel .lbl {
    font-size: 12px;
    color: #7fa8e0;
    letter-spacing: 2px;
  }
  .year-panel .val {
    margin-top: 4px;
    font-size: 48px;
    font-weight: 700;
    color: #ffd07a;
    line-height: 1;
    text-shadow: 0 0 12px rgba(255,180,80,0.55);
  }
  .year-panel .sub {
    margin-top: 6px;
    font-size: 11px;
    color: #5a83b5;
    letter-spacing: 1px;
  }

  /* 播放控制条 */
  .control-bar {
    position: absolute;
    bottom: calc(34vh + 36px);
    left: 24px;
    right: 24px;
    height: 28px;
    z-index: 15;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: #7fa8e0;
  }
  .control-bar button {
    background: rgba(10, 25, 55, 0.75);
    color: #cfe0ff;
    border: 1px solid rgba(80,160,255,0.45);
    padding: 4px 12px;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 2px;
    font-family: inherit;
  }
  .control-bar button:hover { background: rgba(30, 70, 140, 0.85); color: #fff; }
  .control-bar label { display: flex; align-items: center; gap: 6px; }

  /* 音乐控制按钮（在播放组件上方） */
  .music-bar {
    position: absolute;
    bottom: calc(34vh + 72px);
    left: 24px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .music-bar button {
    background: rgba(10, 25, 55, 0.8);
    color: #ffd07a;
    border: 1px solid rgba(255, 208, 122, 0.55);
    padding: 4px 14px;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 2px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .music-bar button:hover {
    background: rgba(30, 70, 140, 0.85);
    color: #fff;
  }

  /* 当前发射信息（地图与控制条之间） */
  .launch-info {
    position: absolute;
    bottom: calc(34vh + 72px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    padding: 6px 16px;
    background: rgba(10, 25, 55, 0.55);
    border: 1px solid rgba(80, 160, 255, 0.25);
    border-radius: 2px;
    font-size: 13px;
    letter-spacing: 2px;
    color: #aad1ff;
    min-height: 24px;
    min-width: 300px;
    text-align: center;
    opacity: 0.0;
    transition: opacity 0.4s ease;
    font-family: "Consolas", "Courier New", monospace;
  }
  .launch-info.show { opacity: 0.95; }

  /* 历史发射列表（地图右侧 · 可滚动） */
  .history-panel {
    position: absolute;
    right: 24px;
    top: 300px;
    width: 340px;
    height: calc(60vh - 240px);
    min-height: 260px;
    background: rgba(10, 25, 55, 0.55);
    border: 1px solid rgba(80, 160, 255, 0.35);
    border-radius: 4px;
    z-index: 10;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: "Consolas", "Courier New", monospace;
  }
  .history-panel .history-title {
    padding: 8px 14px;
    font-size: 12px;
    letter-spacing: 4px;
    color: #ffd07a;
    border-bottom: 1px solid rgba(80, 160, 255, 0.25);
    background: rgba(20, 40, 80, 0.5);
  }
  .history-panel .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.85;
    color: #cfe0ff;
    scrollbar-width: thin;
    scrollbar-color: #3a6dc7 transparent;
  }
  .history-panel .history-list::-webkit-scrollbar { width: 8px; }
  .history-panel .history-list::-webkit-scrollbar-thumb {
    background: rgba(80, 160, 255, 0.45);
    border-radius: 4px;
  }
  .history-panel .history-list::-webkit-scrollbar-track { background: transparent; }
  .history-panel .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 0;
    border-bottom: 1px dashed rgba(80, 160, 255, 0.08);
    animation: rowFadeIn 0.4s ease;
  }
  .history-panel .row .idx { color: #5a83b5; width: 44px; flex-shrink: 0; font-size: 11px; }
  .history-panel .row .date { color: #7fa8e0; width: 84px; flex-shrink: 0; }
  .history-panel .row .site { color: #ffd07a; width: 42px; flex-shrink: 0; }
  .history-panel .row .name { color: #cfe0ff; flex: 1; }
  @keyframes rowFadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 火箭动画容器 —— 覆盖在地图上 */
  #rocket-layer {
    position: absolute;
    top: 60px;
    left: 0;
    right: 0;
    height: 60vh;
    z-index: 5;
    pointer-events: none;
    overflow: hidden;
  }

  /* 单枚火箭（缩小至约 14px 宽） */
  .rocket {
    position: absolute;
    width: 14px;
    height: 24px;
    transform: translate(-50%, 0);
    pointer-events: none;
    will-change: transform, opacity;
  }

  .rocket .r-body {
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 60'>\
<defs>\
  <linearGradient id='g1' x1='0' y1='0' x2='0' y2='1'>\
    <stop offset='0%' stop-color='%23ffffff'/>\
    <stop offset='100%' stop-color='%23aad1ff'/>\
  </linearGradient>\
</defs>\
<path d='M18 0 C 25 10, 28 22, 28 36 L 28 50 L 8 50 L 8 36 C 8 22, 11 10, 18 0 Z' fill='url(%23g1)' stroke='%23ffffff' stroke-width='0.8'/>\
<circle cx='18' cy='24' r='3' fill='%235aaaff' stroke='%23ffffff' stroke-width='0.6'/>\
<path d='M8 42 L 2 54 L 10 50 Z' fill='%23e25a5a' stroke='%23ffffff' stroke-width='0.6'/>\
<path d='M28 42 L 34 54 L 26 50 Z' fill='%23e25a5a' stroke='%23ffffff' stroke-width='0.6'/>\
<path d='M12 50 L 18 58 L 24 50 Z' fill='%23ffd07a' stroke='%23ffffff' stroke-width='0.6'/>\
</svg>");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center bottom;
    filter: drop-shadow(0 0 3px rgba(120, 180, 255, 0.6));
  }

  /* 底部小火焰 */
  .rocket .r-flame {
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    height: 7px;
    background: linear-gradient(to bottom, rgba(255,208,122,0.85), rgba(255,120,60,0.0));
    border-radius: 2px 2px 50% 50% / 2px 2px 100% 100%;
    opacity: 0.85;
  }

  /* 喷气圆环（发射前扩散动画） */
  .jet-ring {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 0 4px rgba(200, 220, 255, 0.9);
    transform: translate(-50%, -50%);
    pointer-events: none;
    will-change: width, height, opacity, transform;
  }

  /* 发射场标签 */
  .site-label {
    position: absolute;
    transform: translate(-50%, 0);
    font-size: 12px;
    color: #aad1ff;
    letter-spacing: 2px;
    padding: 2px 6px;
    background: rgba(10, 25, 55, 0.6);
    border: 1px solid rgba(80, 160, 255, 0.25);
    white-space: nowrap;
    pointer-events: none;
    transition: color 0.15s ease, text-shadow 0.15s ease, background 0.15s ease;
  }
  /* 闪烁高亮状态 */
  .site-label.flash {
    color: #ffffff;
    background: rgba(80, 130, 200, 0.75);
    text-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
  }

  .site-dot {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ffd07a;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 4px rgba(255, 208, 122, 0.75);
    pointer-events: none;
  }

  /* 加载提示 */
  .loader {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #7fa8e0;
    letter-spacing: 4px;
    font-size: 14px;
    z-index: 30;
  }
</style>
</head>

  /* ---------- 全局配置 ---------- */
  const CONFIG = {
    // 中国地图 GeoJSON
    mapUrl: 'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json',
    // JSON 数据
    dataUrl: null, // 已改为内联方式：直接使用 __SPACE_DATA__
    // 动画时序（毫秒）
    anim: {
      ringDur: 400,           // 喷气圆环扩散时长（6→50px，opa 1→0）
      labelFlash: 300,        // 发射场名称闪烁时长
      rise: 350,              // 火箭垂直上升时长
      hold: 80,               // 停留

      gapBetween: 20,         // 两次发射之间的间隔
    },
    // 无发射年份的停留（快速跳过）
    yearGap: 80,
    // 速度倍率（由下拉框在运行时覆盖）
    speedFactor: 0.33,
  };

  /* ---------- 状态 ---------- */
  const state = {
    raw: null,
    launchesByYear: {},
    yearList: [],
    sitePositions: {},     // { 酒泉: {x, y}, ... }
    siteLabelEls: {},      // { 酒泉: <HTMLElement>, ... } —— 用于闪烁

    barChart: null,
    barSeriesData: null,

  /* ---------- 工具 ---------- */
  const $ = id => document.getElementById(id);
  function setStatTotal(v) { $('stat-total').textContent = v; }
  function setStatYear(v)  { $('stat-year').textContent = v; }
  function setLaunchInfo(text, visible) {
    const el = $('launch-info');
    el.textContent = text || '';
    if (visible) el.classList.add('show');
    else el.classList.remove('show');
  }
  function setStatus(text) { $('status-text').textContent = text; }

  // 追加一条发射记录到右侧列表（可滚动）
  function appendHistory(index, launch) {
    const list = $('history-list');
    if (!list) return;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<span class="idx">#' + String(index).padStart(3, '0') + '</span>' +
      '<span class="date">' + launch.date + '</span>' +
      '<span class="site">' + launch.site + '</span>' +
      '<span class="name">' + launch.rocket + '</span>';
    list.appendChild(row);
    // 自动滚到底部
    list.scrollTop = list.scrollHeight;
  }
  function clearHistory() {
    const list = $('history-list');
    if (list) list.innerHTML = '';
  }
  function sleep(ms) {
    return new Promise(resolve => {
      const start = Date.now();
      (function tick() {
        if (state.abortFlag) return resolve();
        const elapsed = Date.now() - start;
        if (elapsed >= ms) return resolve();
        setTimeout(tick, Math.min(20, ms - elapsed));
      })();
    });
  }

  /* requestAnimationFrame 动画辅助 */
  function animate({ duration, onTick }) {
    return new Promise(resolve => {
      const start = performance.now();
      (function step(now) {
        if (state.abortFlag) return resolve();
        const elapsed = now - start;
        onTick(elapsed);
        if (elapsed >= duration) return resolve();
        requestAnimationFrame(step);
      })(start);
    });
  }

  /* ---------- 数据 ---------- */
  async function fetchJSON(url) {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('网络请求失败: ' + url);
    return await resp.json();
  }

  function prepareData(data) {
    state.raw = data;
    state.yearList = [];
    for (let y = data.year_min; y <= data.year_max; y++) state.yearList.push(y);
    state.launchesByYear = {};
    state.yearList.forEach(y => { state.launchesByYear[y] = []; });
    data.launches.forEach(l => {
      (state.launchesByYear[l.year] = state.launchesByYear[l.year] || []).push(l);
    });
    Object.keys(state.launchesByYear).forEach(y => {
      state.launchesByYear[y].sort((a, b) => a.date.localeCompare(b.date));
    });
  }

    echarts.registerMap('china', geoJson);
    state.mapChart = echarts.init($('map'));

    const locationData = (state.raw.locations || []).map(l => ({
      name: l.name,
      value: l.value,
    }));

    const option = {
      backgroundColor: 'transparent',
      tooltip: {
        trigger: 'item',
        formatter: p => p.name,
      },
      geo: {
        map: 'china',
        roam: false,
        aspectScale: 0.75,
        zoom: 1.2,
        itemStyle: {
          areaColor: '#0b1e45',
          borderColor: '#3a6dc7',
          borderWidth: 0.8,
        },
        emphasis: { disabled: true },
        silent: true,
      },
      series: [{
        name: '发射场',
        type: 'scatter',
        coordinateSystem: 'geo',
        symbol: 'circle',
        symbolSize: 0,
        data: locationData,
        silent: true,
      }]
    };
    state.mapChart.setOption(option);

    const recomputeCoords = () => {
      state.sitePositions = {};
      locationData.forEach(loc => {
        const px = state.mapChart.convertToPixel({ geoIndex: 0 }, loc.value);
        if (px && px.length === 2) {
          state.sitePositions[loc.name] = { x: px[0], y: px[1] };
        }
      });
      renderSiteLabels();
    };
    state.mapChart.on('finished', recomputeCoords);
    window.addEventListener('resize', () => {
      state.mapChart.resize();
      state.barChart && state.barChart.resize();
      setTimeout(recomputeCoords, 120);
    });
    state.recomputeCoords = recomputeCoords;
  }

  /* ---------- 发射场标签 + 小圆点 ---------- */
  function renderSiteLabels() {
    const layer = $('rocket-layer');
    layer.querySelectorAll('.site-label, .site-dot').forEach(n => n.remove());
    state.siteLabelEls = {};

    Object.keys(state.sitePositions).forEach(name => {
      const pos = state.sitePositions[name];

      const dot = document.createElement('div');
      dot.className = 'site-dot';
      dot.style.left = pos.x + 'px';
      dot.style.top  = pos.y + 'px';
      layer.appendChild(dot);

      const label = document.createElement('div');
      label.className = 'site-label';
      label.style.left = pos.x + 'px';
      label.style.top  = (pos.y + 8) + 'px';
      label.textContent = name;
      layer.appendChild(label);

      state.siteLabelEls[name] = label;
    });
  }

  /* ---------- ECharts 柱状图（当年发射次数） ---------- */
  function initBarChart() {
    state.barChart = echarts.init($('chart'));
    const years = state.yearList.map(y => String(y));
    const zeros = state.yearList.map(() => 0);

    const option = {
      backgroundColor: 'transparent',
      grid: { left: 55, right: 20, top: 30, bottom: 50 },
      tooltip: {
        trigger: 'axis',
        formatter: p => p[0].axisValue + ' 年 · ' + p[0].value + ' 次发射',
      },
      xAxis: {
        type: 'category',
        data: years,
        axisLine: { lineStyle: { color: '#3a6dc7' } },
        axisLabel: {
          color: '#7fa8e0',
          fontSize: 10,
          interval: Math.max(0, Math.floor(years.length / 16) - 1),
        },
        axisTick: { show: false },
      },
      yAxis: {
        type: 'value',
        name: '当年发射',
        nameTextStyle: { color: '#7fa8e0', fontSize: 11 },
        axisLine: { lineStyle: { color: '#3a6dc7' } },
        axisLabel: { color: '#7fa8e0', fontSize: 11 },
        splitLine: { lineStyle: { color: 'rgba(80,160,255,0.12)' } },
      },
      series: [{
        name: '当年发射',
        type: 'bar',
        data: zeros,
        itemStyle: {
          color: {
            type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
            colorStops: [
              { offset: 0, color: '#ffd07a' },
              { offset: 1, color: '#1b4886' },
            ]
          },
          borderRadius: [2, 2, 0, 0],
        },
        barMaxWidth: 16,
      }]
    };
    state.barChart.setOption(option);
    state.barSeriesData = zeros.slice();
  }

  // 更新柱状图：把当前年份的柱子数值 = 当年发射次数，其它年份保持已有值（但重播时会 reset）
  // 采用"推进式"：只高亮当前年 & 已过年的柱子（已过年 = 真实当年值）。
  // 按用户需求"显示当年发射次数"——即每个柱子高度为该年发射次数。
  // 我们让柱子随着年份推进逐个"亮起来"。
  function updateBarChart(currentYear) {
    for (let i = 0; i < state.yearList.length; i++) {
      const y = state.yearList[i];
      const count = (state.launchesByYear[y] || []).length;
      state.barSeriesData[i] = (y <= currentYear) ? count : 0;
    }
    state.barChart.setOption({ series: [{ data: state.barSeriesData }] });
  }

  /* ================================================================
   * 单枚发射动画（核心）
   *   1. 喷气圆环：6px → 50px，opa 1→0，400ms
   *   2. 发射场名称闪烁：300ms（加/去 .flash 类）
   *   3. 火箭：350ms 垂直上升 200px，80ms 停留，120ms 淡出
   * ================================================================ */
  function launchOneRocket(launch) {
    return new Promise(async resolve => {
      const pos = state.sitePositions[launch.site];
      if (!pos) return resolve();

      const layer = $('rocket-layer');
      const { rise, hold, fade, distancePx, riseDelay, ringDur, labelFlash } = CONFIG.anim;
      const startY = pos.y;
      const endY   = pos.y - distancePx;

      // —— 1) 喷气圆环（立即启动）
      const ring = document.createElement('div');
      ring.className = 'jet-ring';
      ring.style.left = pos.x + 'px';
      ring.style.top  = pos.y + 'px';
      ring.style.width  = '6px';
      ring.style.height = '6px';
      ring.style.opacity = '1';
      layer.appendChild(ring);

      animate({
        duration: ringDur,
        onTick: (elapsed) => {
          const t = Math.min(1, elapsed / ringDur);
          // 6 → 50
          const size = 6 + (50 - 6) * t;
          ring.style.width  = size + 'px';
          ring.style.height = size + 'px';
          ring.style.opacity = (1 - t).toFixed(3);
        }
      }).then(() => ring.remove());

      // —— 2) 发射场名称闪烁（立即启动，300ms）
      const labelEl = state.siteLabelEls[launch.site];
      if (labelEl) {
        labelEl.classList.add('flash');
        setTimeout(() => {
          if (labelEl) labelEl.classList.remove('flash');
        }, labelFlash);
      }

      // —— 3) 火箭：先等待 riseDelay，然后 rise + hold + fade
      await sleep(riseDelay);
      if (state.abortFlag) return resolve();

      const rocket = document.createElement('div');
      rocket.className = 'rocket';
      rocket.innerHTML = '<div class="r-body"></div><div class="r-flame"></div>';
      rocket.style.left = pos.x + 'px';
      rocket.style.top  = startY + 'px';
      rocket.style.opacity = '0';
      rocket.style.transform = 'translate(-50%, 0)';
      layer.appendChild(rocket);

      // 3a) 垂直上升 350ms
      await animate({
        duration: rise,
        onTick: (elapsed) => {
          const t = Math.min(1, elapsed / rise);
          // linear 上升（纪录片感：稳定匀速）
          const y = startY - distancePx * t;
          rocket.style.top = y + 'px';
          rocket.style.opacity = Math.min(1, t / 0.15).toFixed(3);
        }
      });
      if (state.abortFlag) { rocket.remove(); return resolve(); }

      // 3b) 停留 80ms
      await animate({
        duration: hold,
        onTick: () => {
          rocket.style.top = endY + 'px';
          rocket.style.opacity = '1';
        }
      });
      if (state.abortFlag) { rocket.remove(); return resolve(); }

      // 3c) 淡出 120ms
      await animate({
        duration: fade,
        onTick: (elapsed) => {
          const t = Math.min(1, elapsed / fade);
          rocket.style.opacity = (1 - t).toFixed(3);
          // 继续轻微上飘
          rocket.style.top = (endY - 12 * t) + 'px';
        }
      });

      rocket.remove();
      resolve();
    });
  }

  /* ---------- 主回放循环 ---------- */
  async function playHistory() {
    if (state.playing) return;
    state.playing = true;
    state.abortFlag = false;
    setStatus('播放中');

    // 每次点击播放都从头开始（避免上次停在某一年导致"断点续播"的错觉）
    state.total = 0;
    setStatTotal(0);
    clearHistory();
    const startYear = state.yearList[0];

    for (let yi = 0; yi < state.yearList.length; yi++) {
      if (state.abortFlag) break;
      const y = state.yearList[yi];
      if (y < startYear) continue;

      state.currentYear = y;
      setStatYear(y);
      updateBarChart(y);

      const list = state.launchesByYear[y] || [];

      if (list.length === 0) {
        setLaunchInfo(y + ' 年 · 无发射记录', false);
        await sleep(CONFIG.yearGap);
        continue;
      }

      for (let li = 0; li < list.length; li++) {
        if (state.abortFlag) break;
        const launch = list[li];

        setLaunchInfo(
          launch.date + ' · ' + launch.site + ' · ' + launch.rocket,
          true
        );

        await launchOneRocket(launch);

        state.total += 1;
        setStatTotal(state.total);

        // 追加到历史列表
        appendHistory(state.total, launch);

        await sleep(CONFIG.anim.gapBetween);
      }
    }

    // 正常播放完成：彻底重置，下次点击从头开始
    setLaunchInfo('回放结束 · 总计 ' + state.total + ' 次发射', true);
    setStatus('完成');
    state.currentYear = null;
    state.playing = false;
  }

  function pause() {
    state.abortFlag = true;
    state.playing = false;
    setStatus('已暂停');
    // 清理可能残留
    document.querySelectorAll('.rocket, .jet-ring').forEach(n => n.remove());
    document.querySelectorAll('.site-label.flash').forEach(n => n.classList.remove('flash'));
  }

  function reset() {
    state.abortFlag = true;
    state.playing = false;
    state.currentYear = null;
    state.total = 0;
    setStatTotal(0);
    setStatYear('----');
    setLaunchInfo('', false);
    setStatus('已重置');
    state.barSeriesData = state.yearList.map(() => 0);
    state.barChart.setOption({ series: [{ data: state.barSeriesData }] });
    document.querySelectorAll('.rocket, .jet-ring').forEach(n => n.remove());
    document.querySelectorAll('.site-label.flash').forEach(n => n.classList.remove('flash'));
    clearHistory();
  }

  /* ---------- 入口 ---------- */
  async function main() {
    try {
      $('loader').textContent = '正在加载地图与发射数据 ...';
      const [geoJson, dataJson] = await Promise.all([
        fetchJSON(CONFIG.mapUrl),
        Promise.resolve(typeof __SPACE_DATA__ !== 'undefined' ? __SPACE_DATA__ : {
          year_min: 1970, year_max: 2021, locations: [], launches: []
        })
      ]);

      prepareData(dataJson);
      initMapChart(geoJson);
      initBarChart();
      $('loader').style.display = 'none';

      $('btn-play').addEventListener('click', playHistory);
      $('btn-pause').addEventListener('click', pause);
      $('btn-reset').addEventListener('click', reset);

      // ========= 背景音乐控制（默认不循环） =========
      const bgm = new Audio('bgm.mp3');
      bgm.loop = false;
      bgm.preload = 'auto';
      const btnMusic = $('btn-music');

      function updateMusicBtn() {
        btnMusic.textContent = (!bgm.paused) ? '⏸ 暂停音乐' : '🎵 播放音乐';
      }
      btnMusic.addEventListener('click', () => {
        if (!bgm.paused) {
          bgm.pause();
        } else {
          const p = bgm.play();
          if (p && typeof p.then === 'function') {
            p.then(updateMusicBtn).catch(err => {
              console.warn('音乐播放被浏览器策略阻止，请再点一次：', err);
              updateMusicBtn();
            });
          }
        }
        updateMusicBtn();
      });
      bgm.addEventListener('play', updateMusicBtn);
      bgm.addEventListener('pause', updateMusicBtn);
      bgm.addEventListener('ended', updateMusicBtn);
      updateMusicBtn();
      $('speed-select').addEventListener('change', e => {
        const v = parseFloat(e.target.value);
        CONFIG.speedFactor = v;
        // 速度倍率：0.5x 代表"半速"，动画时长 = 基础时长 / 0.5 = 2倍（变慢）；
        // 1.0x 代表"基准速度"；2.0x 代表"加速到 2 倍"（时长减半）。
        const base = { ringDur: 400, labelFlash: 300, rise: 350, hold: 80, fade: 120, distancePx: 200, riseDelay: 20, gapBetween: 20 };
        Object.keys(base).forEach(k => {
          if (k === 'distancePx') return;
          CONFIG.anim[k] = Math.round(base[k] / v);
        });
        CONFIG.yearGap = Math.round(80 / v);
      });
      // 初始化一次（页面刚打开时使用默认值 0.33x 的"修正后"时长）
      (function applyDefaultSpeed() {
        const v = parseFloat($('speed-select').value);
        CONFIG.speedFactor = v;
        const base = { ringDur: 400, labelFlash: 300, rise: 350, hold: 80, fade: 120, distancePx: 200, riseDelay: 20, gapBetween: 20 };
        Object.keys(base).forEach(k => {
          if (k === 'distancePx') return;
          CONFIG.anim[k] = Math.round(base[k] / v);
        });
        CONFIG.yearGap = Math.round(80 / v);
      })();

      setStatus('就绪 · 共 ' + dataJson.launches.length + ' 次发射');
      setStatYear(state.raw.year_min);
      setLaunchInfo('点击左下角【▶ 播放】开始回放', true);

    } catch (err) {
      console.error(err);
      $('loader').textContent = '初始化失败：' + err.message;
    }
  }

  window.addEventListener('DOMContentLoaded', main);
})();
</script>
</body>
