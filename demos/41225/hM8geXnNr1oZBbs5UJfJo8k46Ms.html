<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拾光复盘 - 轻量化任务复盘速记工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
    body { font-family: 'Noto Sans SC', sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(0,0,0,0.08); }
    .type-radio:checked + label { ring-width: 2px; ring-offset-width: 2px; }
    .bar { transition: height 0.5s ease; }
    .fade-in { animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen text-slate-800">

  <div class="max-w-4xl mx-auto px-4 py-8">
    <!-- 顶部 -->
    <header class="text-center mb-10">
      <h1 class="text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-pink-600 mb-2">拾光复盘</h1>
      <p class="text-slate-500 text-sm md:text-base">30秒速记 · 自动分类 · 本地留存 · 可视化成长</p>
    </header>

    <!-- 统计卡片区 -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="glass rounded-2xl p-4 card-hover">
        <div class="text-xs text-slate-500 mb-1">今日记录</div>
        <div class="text-2xl font-bold text-indigo-600" id="stat-today">0</div>
      </div>
      <div class="glass rounded-2xl p-4 card-hover">
        <div class="text-xs text-slate-500 mb-1">连续记录</div>
        <div class="text-2xl font-bold text-pink-600" id="stat-streak">0 <span class="text-sm font-normal text-slate-400">天</span></div>
      </div>
      <div class="glass rounded-2xl p-4 card-hover">
        <div class="text-xs text-slate-500 mb-1">本周记录</div>
        <div class="text-2xl font-bold text-violet-600" id="stat-week">0</div>
      </div>
      <div class="glass rounded-2xl p-4 card-hover">
        <div class="text-xs text-slate-500 mb-1">累计沉淀</div>
        <div class="text-2xl font-bold text-emerald-600" id="stat-total">0</div>
      </div>
    </section>

    <!-- 快速输入区 -->
    <section class="glass rounded-2xl p-6 mb-8 shadow-sm">
      <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
        <span class="w-1.5 h-6 bg-indigo-500 rounded-full"></span>
        快速记录
      </h2>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4" id="type-selector">
        <label class="cursor-pointer">
          <input type="radio" name="type" value="学习" class="type-radio sr-only" checked />
          <div class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-center text-sm font-medium text-slate-600 hover:bg-indigo-50 peer-checked:ring-2 peer-checked:ring-indigo-500 transition">
            <div class="text-xl mb-1">📚</div>学习
          </div>
        </label>
        <label class="cursor-pointer">
          <input type="radio" name="type" value="工作" class="type-radio sr-only" />
          <div class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-center text-sm font-medium text-slate-600 hover:bg-blue-50 transition">
            <div class="text-xl mb-1">💼</div>工作
          </div>
        </label>
        <label class="cursor-pointer">
          <input type="radio" name="type" value="灵感" class="type-radio sr-only" />
          <div class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-center text-sm font-medium text-slate-600 hover:bg-amber-50 transition">
            <div class="text-xl mb-1">💡</div>灵感
          </div>
        </label>
        <label class="cursor-pointer">
          <input type="radio" name="type" value="待办" class="type-radio sr-only" />
          <div class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-center text-sm font-medium text-slate-600 hover:bg-emerald-50 transition">
            <div class="text-xl mb-1">✅</div>待办
          </div>
        </label>
      </div>

      <div class="space-y-3">
        <input id="input-content" type="text" placeholder="做了什么 / 学到了什么 / 想到什么…" class="w-full rounded-xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white/80" />
        <textarea id="input-summary" rows="2" placeholder="一句话复盘：收获了什么？下次如何更好？" class="w-full rounded-xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white/80 resize-none"></textarea>
        <button onclick="addRecord()" class="w-full md:w-auto md:px-10 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-medium hover:opacity-90 transition shadow-lg shadow-indigo-200">
          ✨ 保存复盘
        </button>
      </div>
    </section>

    <!-- 可视化区 -->
    <section class="grid md:grid-cols-2 gap-6 mb-8">
      <!-- 近7天趋势 -->
      <div class="glass rounded-2xl p-6 shadow-sm">
        <h3 class="text-sm font-semibold text-slate-600 mb-4">近7天记录趋势</h3>
        <div class="h-40 flex items-end justify-between gap-2" id="trend-chart">
          <div class="w-full h-full flex items-center justify-center text-sm text-slate-400">暂无数据</div>
        </div>
        <div class="flex justify-between text-xs text-slate-400 mt-2" id="trend-labels"></div>
      </div>

      <!-- 分类占比 -->
      <div class="glass rounded-2xl p-6 shadow-sm">
        <h3 class="text-sm font-semibold text-slate-600 mb-4">分类占比</h3>
        <div class="flex items-center gap-6">
          <div class="relative w-28 h-28" id="pie-chart">
            <div class="absolute inset-0 rounded-full border-8 border-slate-200"></div>
          </div>
          <div class="flex-1 space-y-2 text-sm" id="pie-legend"></div>
        </div>
      </div>
    </section>

    <!-- 记录列表 -->
    <section class="mb-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold flex items-center gap-2">
          <span class="w-1.5 h-6 bg-pink-500 rounded-full"></span>
          复盘记录
        </h2>
        <div class="text-sm text-slate-400" id="record-count">共 0 条</div>
      </div>
      <div id="records-list" class="space-y-6">
        <div class="text-center py-12 text-slate-400 text-sm">还没有记录，快来写下第一条复盘吧 ✍️</div>
      </div>
    </section>

    <!-- 数据管理 -->
    <section class="glass rounded-2xl p-6 shadow-sm">
      <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
        <span class="w-1.5 h-6 bg-emerald-500 rounded-full"></span>
        数据管理
      </h2>
      <p class="text-sm text-slate-500 mb-4">数据仅保存在当前浏览器本地，建议定期导出备份。</p>
      <div class="flex flex-wrap gap-3">
        <button onclick="exportData()" class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-medium hover:opacity-90 transition">导出 JSON 备份</button>
        <label class="px-5 py-2.5 rounded-xl bg-slate-800 text-white text-sm font-medium hover:opacity-90 transition cursor-pointer">
          导入 JSON 备份
          <input type="file" accept="application/json" onchange="importData(this)" class="hidden" />
        </label>
        <button onclick="clearData()" class="px-5 py-2.5 rounded-xl border border-red-200 text-red-600 text-sm font-medium hover:bg-red-50 transition">清空所有数据</button>
      </div>
    </section>

    <footer class="text-center text-xs text-slate-400 mt-10 pb-6">
      拾光复盘 · 让每一次微小努力都被看见
    </footer>
  </div>

  <script>
    const STORAGE_KEY = 'shiguang_review_records';

    const typeMeta = {
      '学习': { emoji: '📚', color: 'bg-indigo-100 text-indigo-700 border-indigo-200', bar: '#6366f1' },
      '工作': { emoji: '💼', color: 'bg-blue-100 text-blue-700 border-blue-200', bar: '#3b82f6' },
      '灵感': { emoji: '💡', color: 'bg-amber-100 text-amber-700 border-amber-200', bar: '#f59e0b' },
      '待办': { emoji: '✅', color: 'bg-emerald-100 text-emerald-700 border-emerald-200', bar: '#10b981' }
    };

    function getRecords() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) { return []; }
    }

    function saveRecords(records) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      render();
    }

    function formatDate(ts) {
      const d = new Date(ts);
      const now = new Date();
      const isToday = d.toDateString() === now.toDateString();
      const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
      const week = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
      return `${isToday ? '今天' : `${m}月${day}日`} ${week} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function getDateKey(ts) {
      const d = new Date(ts);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function addRecord() {
      const content = document.getElementById('input-content').value.trim();
      const summary = document.getElementById('input-summary').value.trim();
      const type = document.querySelector('input[name="type"]:checked').value;

      if (!content) {
        alert('请先输入记录内容');
        return;
      }

      const records = getRecords();
      records.unshift({
        id: Date.now(),
        type,
        content,
        summary,
        createdAt: Date.now()
      });

      saveRecords(records);
      document.getElementById('input-content').value = '';
      document.getElementById('input-summary').value = '';
    }

    function deleteRecord(id) {
      if (!confirm('确定删除这条记录吗？')) return;
      const records = getRecords().filter(r => r.id !== id);
      saveRecords(records);
    }

    function computeStats(records) {
      const todayKey = getDateKey(Date.now());
      const countsByDay = {};
      const countsByType = {};
      let today = 0, week = 0, total = records.length;

      records.forEach(r => {
        const key = getDateKey(r.createdAt);
        countsByDay[key] = (countsByDay[key] || 0) + 1;
        countsByType[r.type] = (countsByType[r.type] || 0) + 1;
        if (key === todayKey) today++;
      });

      for (let i = 0; i < 7; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = getDateKey(d.getTime());
        week += countsByDay[key] || 0;
      }

      // 连续天数
      let streak = 0;
      for (let i = 0; ; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = getDateKey(d.getTime());
        if (countsByDay[key]) streak++;
        else if (i > 0) break;
      }

      return { today, week, total, streak, countsByDay, countsByType };
    }

    function renderStats(stats) {
      document.getElementById('stat-today').textContent = stats.today;
      document.getElementById('stat-streak').innerHTML = `${stats.streak} <span class="text-sm font-normal text-slate-400">天</span>`;
      document.getElementById('stat-week').textContent = stats.week;
      document.getElementById('stat-total').textContent = stats.total;
    }

    function renderTrend(stats) {
      const container = document.getElementById('trend-chart');
      const labels = document.getElementById('trend-labels');
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        days.push({ key: getDateKey(d.getTime()), label: `${d.getMonth()+1}/${d.getDate()}` });
      }

      const values = days.map(d => stats.countsByDay[d.key] || 0);
      const max = Math.max(...values, 1);

      container.innerHTML = values.map((v, idx) => `
        <div class="flex-1 flex flex-col justify-end items-center group relative">
          <div class="text-xs text-slate-500 mb-1 opacity-0 group-hover:opacity-100 transition absolute -top-6">${v}</div>
          <div class="w-full max-w-[32px] rounded-t-md bg-gradient-to-t from-indigo-500 to-violet-400 bar" style="height: ${(v / max) * 100}%"></div>
        </div>
      `).join('');

      labels.innerHTML = days.map(d => `<span>${d.label}</span>`).join('');
    }

    function renderPie(stats) {
      const total = Object.values(stats.countsByType).reduce((a, b) => a + b, 0);
      const chart = document.getElementById('pie-chart');
      const legend = document.getElementById('pie-legend');

      if (total === 0) {
        chart.innerHTML = '<div class="absolute inset-0 rounded-full border-8 border-slate-200"></div>';
        legend.innerHTML = '<div class="text-slate-400 text-sm">暂无数据</div>';
        return;
      }

      let acc = 0;
      const segments = Object.entries(stats.countsByType).map(([type, count]) => {
        const pct = count / total;
        const start = acc;
        acc += pct;
        return { type, count, pct, start, end: acc, color: typeMeta[type].bar };
      });

      // 用 conic-gradient 做饼图
      const gradient = segments.map(s => `${s.color} ${s.start * 100}% ${s.end * 100}%`).join(', ');
      chart.innerHTML = `
        <div class="absolute inset-0 rounded-full" style="background: conic-gradient(${gradient})"></div>
        <div class="absolute inset-[18%] rounded-full bg-white"></div>
      `;

      legend.innerHTML = segments.map(s => `
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full" style="background:${s.color}"></span>
            <span class="text-slate-600">${typeMeta[s.type].emoji} ${s.type}</span>
          </div>
          <span class="font-medium text-slate-700">${Math.round(s.pct * 100)}%</span>
        </div>
      `).join('');
    }

    function renderRecords(records) {
      const container = document.getElementById('records-list');
      document.getElementById('record-count').textContent = `共 ${records.length} 条`;

      if (records.length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-slate-400 text-sm">还没有记录，快来写下第一条复盘吧 ✍️</div>';
        return;
      }

      const grouped = {};
      records.forEach(r => {
        const key = getDateKey(r.createdAt);
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(r);
      });

      const sortedKeys = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

      container.innerHTML = sortedKeys.map(key => {
        const list = grouped[key];
        const dateObj = new Date(list[0].createdAt);
        const isToday = getDateKey(Date.now()) === key;
        return `
          <div class="fade-in">
            <div class="text-sm font-medium text-slate-500 mb-2 flex items-center gap-2">
              <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
              ${isToday ? '今天' : `${dateObj.getFullYear()}年${dateObj.getMonth()+1}月${dateObj.getDate()}日`}
            </div>
            <div class="space-y-3">
              ${list.map(r => `
                <div class="glass rounded-xl p-4 card-hover flex gap-3 items-start">
                  <div class="flex-shrink-0 w-10 h-10 rounded-full ${typeMeta[r.type].color.split(' ')[0]} flex items-center justify-center text-lg">
                    ${typeMeta[r.type].emoji}
                  </div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                      <span class="text-xs px-2 py-0.5 rounded-full border ${typeMeta[r.type].color}">${r.type}</span>
                      <span class="text-xs text-slate-400">${formatDate(r.createdAt)}</span>
                    </div>
                    <div class="text-slate-800 font-medium break-words">${escapeHtml(r.content)}</div>
                    ${r.summary ? `<div class="mt-2 text-sm text-slate-600 bg-white/60 rounded-lg px-3 py-2 break-words">💬 ${escapeHtml(r.summary)}</div>` : ''}
                  </div>
                  <button onclick="deleteRecord(${r.id})" class="text-slate-300 hover:text-red-500 transition text-lg" title="删除">×</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function render() {
      const records = getRecords();
      const stats = computeStats(records);
      renderStats(stats);
      renderTrend(stats);
      renderPie(stats);
      renderRecords(records);
    }

    function exportData() {
      const data = localStorage.getItem(STORAGE_KEY) || '[]';
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `拾光复盘备份_${getDateKey(Date.now())}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const records = JSON.parse(e.target.result);
          if (!Array.isArray(records)) throw new Error('格式错误');
          if (!confirm(`确认导入 ${records.length} 条记录？当前数据将被覆盖。`)) return;
          saveRecords(records);
          alert('导入成功');
        } catch (err) {
          alert('导入失败：文件格式不正确');
        }
      };
      reader.readAsText(file);
      input.value = '';
    }

    function clearData() {
      if (!confirm('确定清空所有数据？此操作不可恢复。')) return;
      localStorage.removeItem(STORAGE_KEY);
      render();
    }

    // 高亮选中类型
    document.querySelectorAll('input[name="type"]').forEach(radio => {
      radio.addEventListener('change', function() {
        document.querySelectorAll('#type-selector label > div').forEach(div => {
          div.classList.remove('ring-2', 'ring-indigo-500', 'ring-offset-2');
        });
        if (this.checked) {
          this.nextElementSibling.classList.add('ring-2', 'ring-indigo-500', 'ring-offset-2');
        }
      });
    });

    // 初始化
    render();
  </script>
</body>
</html>
