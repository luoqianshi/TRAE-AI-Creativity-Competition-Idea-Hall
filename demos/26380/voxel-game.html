<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Box - 体素玩具箱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            color: #e2e8f0;
            overflow: hidden;
        }
        
        /* Left Sidebar - Gallery */
        .sidebar {
            width: 280px;
            background: rgba(30, 41, 59, 0.95);
            border-right: 1px solid rgba(148, 163, 184, 0.1);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-header p {
            font-size: 0.85rem;
            color: #c7d2fe;
            margin-top: 4px;
        }
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .section-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 16px 0 10px;
            padding-left: 4px;
        }
        .model-card {
            background: rgba(51, 65, 85, 0.5);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .model-card:hover {
            background: rgba(51, 65, 85, 0.8);
            border-color: #6366f1;
            transform: translateY(-2px);
        }
        .model-card.active {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.15);
        }
        .model-card h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 4px;
        }
        .model-card p {
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .model-preview {
            width: 100%;
            height: 80px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        
        /* Main Canvas Area */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .top-bar {
            height: 60px;
            background: rgba(30, 41, 59, 0.9);
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }
        .model-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f1f5f9;
        }
        .top-bar-actions {
            display: flex;
            gap: 8px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }
        .btn-secondary {
            background: rgba(71, 85, 105, 0.6);
            color: #e2e8f0;
        }
        .btn-secondary:hover {
            background: rgba(71, 85, 105, 0.8);
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }
        
        /* Mode Tabs */
        .mode-tabs {
            display: flex;
            gap: 4px;
            padding: 12px 24px;
            background: rgba(30, 41, 59, 0.7);
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }
        .mode-tab {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .mode-tab:hover {
            background: rgba(99, 102, 241, 0.1);
            color: #c7d2fe;
        }
        .mode-tab.active {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
        }
        
        /* 3D Canvas */
        #canvas-container {
            flex: 1;
            position: relative;
            background: radial-gradient(ellipse at center, #1e293b 0%, #0f172a 100%);
        }
        #canvas-container canvas {
            width: 100% !important;
            height: 100% !important;
        }
        
        /* Ambient Filter Buttons */
        .filter-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(30, 41, 59, 0.9);
            padding: 8px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }
        .filter-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            color: white;
        }
        .filter-btn.active {
            background: #6366f1;
            color: white;
        }
        
        /* Right Panel - Editor */
        .right-panel {
            width: 300px;
            background: rgba(30, 41, 59, 0.95);
            border-left: 1px solid rgba(148, 163, 184, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100vh;
            overflow-y: auto;
        }
        .panel-section {
            background: rgba(51, 65, 85, 0.4);
            border-radius: 12px;
            padding: 16px;
        }
        .panel-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        
        /* Color Palette */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }
        .color-swatch {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.15s;
        }
        .color-swatch:hover {
            transform: scale(1.1);
        }
        .color-swatch.selected {
            border-color: white;
            box-shadow: 0 0 12px currentColor;
        }
        
        /* Tool Selection */
        .tool-buttons {
            display: flex;
            gap: 8px;
        }
        .tool-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tool-btn.build {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }
        .tool-btn.build.active {
            background: #22c55e;
            color: white;
        }
        .tool-btn.erase {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }
        .tool-btn.erase.active {
            background: #ef4444;
            color: white;
        }
        
        /* History Buttons */
        .history-buttons {
            display: flex;
            gap: 8px;
        }
        .history-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: rgba(51, 65, 85, 0.4);
            color: #94a3b8;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .history-btn:hover:not(:disabled) {
            background: rgba(99, 102, 241, 0.2);
            color: white;
        }
        .history-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        /* Symmetry Toggle */
        .symmetry-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toggle-switch {
            width: 44px;
            height: 24px;
            background: rgba(71, 85, 105, 0.6);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-switch.active {
            background: #6366f1;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: all 0.2s;
        }
        .toggle-switch.active::after {
            left: 23px;
        }
        
        /* Build Progress */
        .build-progress {
            margin-top: 12px;
        }
        .progress-bar {
            height: 8px;
            background: rgba(71, 85, 105, 0.4);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 4px;
            transition: width 0.3s;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 6px;
        }
        
        /* Save/Export */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        /* Generator Panel */
        .generator-panel {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 350px;
            height: 100vh;
            background: rgba(30, 41, 59, 0.98);
            border-left: 1px solid rgba(148, 163, 184, 0.1);
            padding: 24px;
            z-index: 1000;
            overflow-y: auto;
        }
        .generator-panel.show {
            display: block;
        }
        .gen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .gen-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f1f5f9;
        }
        .close-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(71, 85, 105, 0.4);
            color: #94a3b8;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .close-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        .prompt-input {
            width: 100%;
            padding: 12px;
            background: rgba(51, 65, 85, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 0.9rem;
            resize: none;
            height: 100px;
            margin-bottom: 12px;
        }
        .prompt-input:focus {
            outline: none;
            border-color: #6366f1;
        }
        .inspiration-prompts {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }
        .inspiration-chip {
            padding: 6px 12px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .inspiration-chip:hover {
            background: rgba(99, 102, 241, 0.3);
        }
        .generate-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }
        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .gen-status {
            margin-top: 16px;
            padding: 12px;
            background: rgba(51, 65, 85, 0.4);
            border-radius: 8px;
            font-size: 0.85rem;
            color: #94a3b8;
            display: none;
        }
        .gen-status.show {
            display: block;
        }
        
        /* Hidden file input */
        #file-input {
            display: none;
        }
        
        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #22c55e;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s;
            z-index: 2000;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.error {
            background: #ef4444;
        }
    </style>
</head>
<body>
    <!-- Left Sidebar - Gallery -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>Toy Box</h1>
            <p>体素玩具箱</p>
        </div>
        <div class="sidebar-content">
            <div class="section-title">预设模型</div>
            <div id="preset-gallery"></div>
            
            <div class="section-title">我的作品</div>
            <div id="saved-gallery"></div>
            
            <div class="section-title">导入</div>
            <button class="btn btn-secondary" style="width:100%" onclick="document.getElementById('file-input').click()">
                导入JSON模型
            </button>
            <input type="file" id="file-input" accept=".json" onchange="handleFileImport(event)">
        </div>
    </div>
    
    <!-- Main Area -->
    <div class="main-area">
        <div class="top-bar">
            <div class="model-name" id="current-model-name">橡皮鸭</div>
            <div class="top-bar-actions">
                <button class="btn btn-secondary" onclick="showGenerator()">AI 生成</button>
                <button class="btn btn-primary" onclick="saveCurrentModel()">保存</button>
                <button class="btn btn-secondary" onclick="exportJSON()">导出JSON</button>
            </div>
        </div>
        
        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="viewer" onclick="setMode('viewer')">查看器</button>
            <button class="mode-tab" data-mode="builder" onclick="setMode('builder')">构建动画</button>
            <button class="mode-tab" data-mode="editor" onclick="setMode('editor')">编辑器</button>
        </div>
        
        <div id="canvas-container"></div>
        
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="minimal" onclick="setAmbientFilter('minimal')">自然光</button>
            <button class="filter-btn" data-filter="sunset" onclick="setAmbientFilter('sunset')">日落</button>
            <button class="filter-btn" data-filter="neon" onclick="setAmbientFilter('neon')">霓虹</button>
            <button class="filter-btn" data-filter="gameboy" onclick="setAmbientFilter('gameboy')">复古</button>
        </div>
    </div>
    
    <!-- Right Panel - Editor Controls -->
    <div class="right-panel" id="editor-panel">
        <div class="panel-section">
            <div class="panel-title">画笔工具</div>
            <div class="tool-buttons">
                <button class="tool-btn build active" id="build-btn" onclick="setTool('build')">
                    建造
                </button>
                <button class="tool-btn erase" id="erase-btn" onclick="setTool('erase')">
                    擦除
                </button>
            </div>
        </div>
        
        <div class="panel-section">
            <div class="panel-title">颜色选择</div>
            <div class="color-grid" id="color-palette"></div>
        </div>
        
        <div class="panel-section">
            <div class="panel-title">操作历史</div>
            <div class="history-buttons">
                <button class="history-btn" id="undo-btn" onclick="undo()" disabled>撤销</button>
                <button class="history-btn" id="redo-btn" onclick="redo()" disabled>重做</button>
            </div>
        </div>
        
        <div class="panel-section">
            <div class="panel-title">对称构建</div>
            <div class="symmetry-toggle">
                <span>X轴镜像</span>
                <div class="toggle-switch" id="symmetry-toggle" onclick="toggleSymmetry()"></div>
            </div>
        </div>
        
        <div class="panel-section" id="build-section" style="display:none">
            <div class="panel-title">构建进度</div>
            <div class="build-progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="build-progress-fill" style="width:100%"></div>
                </div>
                <div class="progress-label">
                    <span>进度</span>
                    <span id="build-percent">100%</span>
                </div>
            </div>
            <button class="btn btn-secondary" style="width:100%;margin-top:12px" onclick="resetBuildProgress()">
                重置动画
            </button>
        </div>
        
        <div class="panel-section">
            <div class="panel-title">编辑操作</div>
            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="clearEditor()">清空画布</button>
                <button class="btn btn-danger" onclick="deleteCurrentModel()">删除模型</button>
            </div>
        </div>
    </div>
    
    <!-- Generator Panel -->
    <div class="generator-panel" id="generator-panel">
        <div class="gen-header">
            <h2>AI 构建器</h2>
            <button class="close-btn" onclick="hideGenerator()">×</button>
        </div>
        <p style="color:#94a3b8;font-size:0.85rem;margin-bottom:16px">
            描述你想要创建的体素模型，AI将为你生成
        </p>
        <textarea class="prompt-input" id="prompt-input" placeholder="例如：一辆蓝色的赛车"></textarea>
        <div class="inspiration-prompts">
            <span class="inspiration-chip" onclick="setPrompt('像素怪兽')">像素怪兽</span>
            <span class="inspiration-chip" onclick="setPrompt('芝士汉堡')">芝士汉堡</span>
            <span class="inspiration-chip" onclick="setPrompt('科技太空船')">科技太空船</span>
            <span class="inspiration-chip" onclick="setPrompt('绿皮霸王龙')">绿皮霸王龙</span>
            <span class="inspiration-chip" onclick="setPrompt('桃色萌章鱼')">桃色萌章鱼</span>
            <span class="inspiration-chip" onclick="setPrompt('天空之城')">天空之城</span>
        </div>
        <button class="generate-btn" id="generate-btn" onclick="generateModel()">
            生成体素艺术
        </button>
        <div class="gen-status" id="gen-status"></div>
    </div>
    
    <!-- Toast -->
    <div class="toast" id="toast"></div>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>

        // ========== THREE.JS SETUP ==========
        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e293b);
            
            // Camera
            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(15, 12, 15);
            camera.lookAt(0, 3, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);
            
            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);
            
            // Ground plane for shadows
            const groundGeometry = new THREE.PlaneGeometry(30, 30);
            const groundMaterial = new THREE.ShadowMaterial({ opacity: 0.3 });
            groundPlane = new THREE.Mesh(groundGeometry, groundMaterial);
            groundPlane.rotation.x = -Math.PI / 2;
            groundPlane.position.y = -0.5;
            groundPlane.receiveShadow = true;
            scene.add(groundPlane);
            
            // Grid helper
            const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x333333);
            gridHelper.position.y = -0.49;
            scene.add(gridHelper);
            
            // Raycaster for interaction
            setupRaycaster();
            
            // Window resize handler
            window.addEventListener('resize', onWindowResize);
            
            // Start render loop
            animate();
        }
        
        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Auto-rotate in viewer mode
            if (mode === 'viewer') {
                scene.rotation.y += 0.002;
            }
            
            renderer.render(scene, camera);
        }
        
        // ========== RAYCASTER FOR INTERACTION ==========
        let raycaster, mouse;
        let groundPlaneInteractive;
        
        function setupRaycaster() {
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            const container = document.getElementById('canvas-container');
            
            container.addEventListener('mousedown', onMouseDown);
            container.addEventListener('mousemove', onMouseMove);
            container.addEventListener('mouseup', onMouseUp);
            container.addEventListener('click', onClick);
            
            // Create invisible ground plane for raycasting
            const planeGeometry = new THREE.PlaneGeometry(30, 30);
            const planeMaterial = new THREE.MeshBasicMaterial({ visible: false });
            groundPlaneInteractive = new THREE.Mesh(planeGeometry, planeMaterial);
            groundPlaneInteractive.rotation.x = -Math.PI / 2;
            groundPlaneInteractive.position.y = -0.49;
            groundPlaneInteractive.name = 'ground-plane';
            scene.add(groundPlaneInteractive);
        }
        
        function updateMousePosition(event) {
            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / container.clientWidth) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / container.clientHeight) * 2 + 1;
        }
        
        function onMouseDown(event) {
            if (event.button !== 0) return;
            isDragging = true;
            previousMousePosition = { x: event.clientX, y: event.clientY };
        }
        
        function onMouseMove(event) {
            updateMousePosition(event);
            
            if (isDragging) {
                const deltaX = event.clientX - previousMousePosition.x;
                const deltaY = event.clientY - previousMousePosition.y;
                
                scene.rotation.y += deltaX * 0.01;
                camera.position.y = Math.max(1, camera.position.y - deltaY * 0.05);
                
                previousMousePosition = { x: event.clientX, y: event.clientY };
            }
        }
        
        function onMouseUp() {
            isDragging = false;
        }
        
        function onClick(event) {
            if (mode !== 'editor') return;
            
            updateMousePosition(event);
            raycaster.setFromCamera(mouse, camera);
            
            // Check intersection with voxels
            const intersects = raycaster.intersectObjects(voxelMeshes);
            
            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                const voxelId = clickedMesh.userData.id;
                
                if (tool === 'erase') {
                    removeVoxel(voxelId);
                }
            } else {
                // Check ground plane for adding voxel
                const groundIntersects = raycaster.intersectObject(groundPlaneInteractive);
                if (groundIntersects.length > 0) {
                    const point = groundIntersects[0].point;
                    const x = Math.round(point.x);
                    const z = Math.round(point.z);
                    const y = Math.round(point.y + 0.5);
                    
                    if (tool === 'build') {
                        addVoxel(x, y, z, selectedColor);
                    }
                }
            }
        }
        
        // ========== VOXEL RENDERING ==========
        function renderVoxels() {
            // Clear existing meshes
            voxelMeshes.forEach(mesh => scene.remove(mesh));
            voxelMeshes = [];
            
            const voxels = mode === 'builder' 
                ? currentModel.voxels.slice(0, Math.floor(currentModel.voxels.length * buildProgress))
                : currentModel.voxels;
            
            voxels.forEach(voxel => {
                const geometry = new THREE.BoxGeometry(1, 1, 1);
                const color = transformColor(voxel.color, ambientFilter);
                const material = new THREE.MeshStandardMaterial({ 
                    color: color,
                    roughness: 0.7,
                    metalness: 0.1
                });
                
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(voxel.x, voxel.y, voxel.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData.id = voxel.id;
                
                scene.add(mesh);
                voxelMeshes.push(mesh);
                
                // Add edges
                const edges = new THREE.EdgesGeometry(geometry);
                const edgeMaterial = new THREE.LineBasicMaterial({ 
                    color: ambientFilter === 'neon' ? 0x00ffff : 
                           ambientFilter === 'gameboy' ? 0x306230 : 0x000000,
                    transparent: true,
                    opacity: ambientFilter === 'minimal' ? 0.1 : 0.3
                });
                const edgeMesh = new THREE.LineSegments(edges, edgeMaterial);
                mesh.add(edgeMesh);
            });
            
            // Update ghost block position in editor mode
            updateGhostBlock();
        }
        
        let ghostMesh = null;
        
        function updateGhostBlock() {
            if (mode !== 'editor' || !ghostMesh) return;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(groundPlaneInteractive);
            
            if (intersects.length > 0) {
                const point = intersects[0].point;
                ghostMesh.position.set(Math.round(point.x), Math.round(point.y + 0.5), Math.round(point.z));
                ghostMesh.visible = true;
            } else {
                ghostMesh.visible = false;
            }
        }
        
        function createGhostBlock() {
            const geometry = new THREE.BoxGeometry(1.01, 1.01, 1.01);
            const material = new THREE.MeshBasicMaterial({
                color: selectedColor,
                transparent: true,
                opacity: 0.5
            });
            ghostMesh = new THREE.Mesh(geometry, material);
            ghostMesh.visible = false;
            scene.add(ghostMesh);
        }
        
        function transformColor(hex, filter) {
            if (filter === 'gameboy') {
                const lum = getLuminance(hex);
                if (lum < 0.25) return 0x0f380f;
                if (lum < 0.5) return 0x306230;
                if (lum < 0.75) return 0x8bac0f;
                return 0xe0f8cf;
            }
            if (filter === 'neon') {
                return hex;
            }
            if (filter === 'sunset') {
                return 0xff9966;
            }
            return hex;
        }
        
        function getLuminance(hex) {
            const c = hex.replace('#', '');
            const r = parseInt(c.substring(0, 2), 16) / 255;
            const g = parseInt(c.substring(2, 4), 16) / 255;
            const b = parseInt(c.substring(4, 6), 16) / 255;
            return 0.299 * r + 0.587 * g + 0.114 * b;
        }
        
        // ========== VOXEL OPERATIONS ==========
        function addVoxel(x, y, z, color) {
            const id = `manual-${Date.now()}-${Math.random()}`;
            const newVoxel = { id, x, y, z, color };
            currentModel.voxels.push(newVoxel);
            
            // Symmetry
            if (symmetry && x !== 0) {
                currentModel.voxels.push({ ...newVoxel, x: -x, id: id + '-sym' });
            }
            
            saveToHistory();
            renderVoxels();
        }
        
        function removeVoxel(id) {
            currentModel.voxels = currentModel.voxels.filter(v => v.id !== id);
            
            // Also remove symmetric voxel
            if (symmetry) {
                const voxel = currentModel.voxels.find(v => v.id === id);
                if (voxel && voxel.x !== 0) {
                    currentModel.voxels = currentModel.voxels.filter(v => v.x !== -voxel.x || v.id === id);
                }
            }
            
            saveToHistory();
            renderVoxels();
        }
        
        // ========== HISTORY ==========
        function saveToHistory() {
            const voxelsCopy = JSON.parse(JSON.stringify(currentModel.voxels));
            history = history.slice(0, historyIndex + 1);
            history.push(voxelsCopy);
            historyIndex = history.length - 1;
            updateHistoryButtons();
        }
        
        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                currentModel.voxels = JSON.parse(JSON.stringify(history[historyIndex]));
                renderVoxels();
                updateHistoryButtons();
            }
        }
        
        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                currentModel.voxels = JSON.parse(JSON.stringify(history[historyIndex]));
                renderVoxels();
                updateHistoryButtons();
            }
        }
        
        function updateHistoryButtons() {
            document.getElementById('undo-btn').disabled = historyIndex <= 0;
            document.getElementById('redo-btn').disabled = historyIndex >= history.length - 1;
        }
        
        // ========== UI FUNCTIONS ==========
        function initColorPalette() {
            const palette = document.getElementById('color-palette');
            PALETTE_COLORS.forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch' + (color === selectedColor ? ' selected' : '');
                swatch.style.background = color;
                swatch.style.color = color;
                swatch.onclick = () => selectColor(color);
                palette.appendChild(swatch);
            });
        }
        
        function selectColor(color) {
            selectedColor = color;
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
            event.target.classList.add('selected');
            
            if (ghostMesh) {
                ghostMesh.material.color.setStyle(selectedColor);
            }
        }
        
        function setTool(newTool) {
            tool = newTool;
            document.getElementById('build-btn').classList.toggle('active', tool === 'build');
            document.getElementById('erase-btn').classList.toggle('active', tool === 'erase');
        }
        
        function toggleSymmetry() {
            symmetry = !symmetry;
            document.getElementById('symmetry-toggle').classList.toggle('active', symmetry);
        }
        
        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-mode="${newMode}"]`).classList.add('active');
            
            document.getElementById('editor-panel').style.display = newMode === 'editor' ? 'flex' : 'none';
            document.getElementById('build-section').style.display = newMode === 'builder' ? 'block' : 'none';
            
            if (ghostMesh) {
                ghostMesh.visible = false;
            }
            
            // Reset build progress when entering builder mode
            if (newMode === 'builder') {
                buildProgress = 0;
                animateBuild();
            } else {
                buildProgress = 1;
                renderVoxels();
            }
        }
        
        function animateBuild() {
            if (mode !== 'builder') return;
            
            buildProgress += 0.02;
            if (buildProgress > 1) buildProgress = 1;
            
            document.getElementById('build-progress-fill').style.width = (buildProgress * 100) + '%';
            document.getElementById('build-percent').textContent = Math.floor(buildProgress * 100) + '%';
            
            renderVoxels();
            
            if (buildProgress < 1) {
                setTimeout(animateBuild, 50);
            }
        }
        
        function resetBuildProgress() {
            buildProgress = 0;
            animateBuild();
        }
        
        function setAmbientFilter(filter) {
            ambientFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
            renderVoxels();
        }
        
        function clearEditor() {
            if (confirm('确定要清空画布吗？')) {
                currentModel.voxels = [];
                saveToHistory();
                renderVoxels();
            }
        }
        
        // ========== MODEL MANAGEMENT ==========
        function renderGallery() {
            const presetGallery = document.getElementById('preset-gallery');
            presetGallery.innerHTML = '';
            
            PRESET_MODELS.forEach(model => {
                const card = createModelCard(model, model.id === currentModel.id);
                presetGallery.appendChild(card);
            });
            
            renderSavedGallery();
        }
        
        function renderSavedGallery() {
            const savedGallery = document.getElementById('saved-gallery');
            savedGallery.innerHTML = '';
            
            loadSavedModels();
            
            savedModels.forEach(model => {
                const card = createModelCard(model, model.id === currentModel.id);
                card.querySelector('.delete-btn')?.remove();
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn btn-danger delete-btn';
                deleteBtn.style.marginTop = '8px';
                deleteBtn.style.width = '100%';
                deleteBtn.textContent = '删除';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteModel(model.id);
                };
                card.appendChild(deleteBtn);
                
                savedGallery.appendChild(card);
            });
        }
        
        function createModelCard(model, isActive) {
            const card = document.createElement('div');
            card.className = 'model-card' + (isActive ? ' active' : '');
            card.onclick = () => selectModel(model);
            
            const emojis = { duck: '🦆', robot: '🤖', castle: '🏰', fox: '🦊', custom: '✨' };
            card.innerHTML = `
                <div class="model-preview">${emojis[model.category] || '📦'}</div>
                <h3>${model.name}</h3>
                <p>${model.voxels.length} 个方块</p>
            `;
            
            return card;
        }
        
        function selectModel(model) {
            currentModel = JSON.parse(JSON.stringify(model));
            currentModel.id = model.id + '-' + Date.now();
            document.getElementById('current-model-name').textContent = model.name;
            history = [JSON.parse(JSON.stringify(currentModel.voxels))];
            historyIndex = 0;
            updateHistoryButtons();
            buildProgress = 1;
            renderVoxels();
            renderGallery();
        }
        
        function saveCurrentModel() {
            const isPreset = PRESET_MODELS.some(m => m.id === currentModel.id);
            
            if (isPreset) {
                // Clone preset as new custom model
                const newModel = {
                    ...currentModel,
                    id: 'custom-' + Date.now(),
                    name: currentModel.name + ' (副本)',
                    category: 'custom'
                };
                savedModels.push(newModel);
            } else {
                // Update or add
                const index = savedModels.findIndex(m => m.id === currentModel.id);
                if (index >= 0) {
                    savedModels[index] = { ...currentModel };
                } else {
                    savedModels.push({ ...currentModel });
                }
            }
            
            localStorage.setItem('toybox_saved_models', JSON.stringify(savedModels));
            showToast('已保存 "' + currentModel.name + '"！');
            renderSavedGallery();
        }
        
        function loadSavedModels() {
            const saved = localStorage.getItem('toybox_saved_models');
            if (saved) {
                try {
                    savedModels = JSON.parse(saved);
                } catch (e) {
                    savedModels = [];
                }
            }
        }
        
        function deleteModel(id) {
            if (confirm('确定要删除此模型吗？')) {
                savedModels = savedModels.filter(m => m.id !== id);
                localStorage.setItem('toybox_saved_models', JSON.stringify(savedModels));
                showToast('模型已删除');
                renderSavedGallery();
                
                if (currentModel.id === id) {
                    selectModel(PRESET_MODELS[0]);
                }
            }
        }
        
        function deleteCurrentModel() {
            const isPreset = PRESET_MODELS.some(m => m.id === currentModel.id);
            if (!isPreset) {
                deleteModel(currentModel.id);
            }
            selectModel(PRESET_MODELS[0]);
        }
        
        function exportJSON() {
            const data = {
                name: currentModel.name,
                voxels: currentModel.voxels.map(v => ({ x: v.x, y: v.y, z: v.z, color: v.color }))
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (currentModel.name || 'model') + '.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('JSON 已导出');
        }
        
        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed && Array.isArray(parsed.voxels)) {
                        const imported = {
                            id: 'custom-' + Date.now(),
                            name: parsed.name || '导入的模型',
                            category: 'custom',
                            voxels: parsed.voxels.map((v, i) => ({
                                id: `imported-${i}`,
                                x: Number(v.x) || 0,
                                y: Number(v.y) || 0,
                                z: Number(v.z) || 0,
                                color: v.color || '#FCD34D'
                            }))
                        };
                        selectModel(imported);
                        savedModels.push(imported);
                        localStorage.setItem('toybox_saved_models', JSON.stringify(savedModels));
                        renderSavedGallery();
                        showToast('模型已导入');
                    } else {
                        showToast('文件格式错误', true);
                    }
                } catch (err) {
                    showToast('解析失败', true);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
        
        // ========== AI GENERATOR ==========
        function showGenerator() {
            document.getElementById('generator-panel').classList.add('show');
        }
        
        function hideGenerator() {
            document.getElementById('generator-panel').classList.remove('show');
        }
        
        function setPrompt(text) {
            document.getElementById('prompt-input').value = text;
        }
        
        async function generateModel() {
            const prompt = document.getElementById('prompt-input').value.trim();
            if (!prompt) {
                showToast('请输入描述', true);
                return;
            }
            
            const btn = document.getElementById('generate-btn');
            const status = document.getElementById('gen-status');
            
            btn.disabled = true;
            btn.textContent = '生成中...';
            status.classList.add('show');
            status.textContent = '正在连接 Gemini API...';
            
            // Simulate generation since we don't have actual API key
            setTimeout(() => {
                // Generate a simple random model
                const generatedVoxels = [];
                const shapes = [
                    { dx: 0, dy: 0, dz: 0, color: '#FCD34D' },
                    { dx: 1, dy: 0, dz: 0, color: '#FCD34D' },
                    { dx: 0, dy: 1, dz: 0, color: '#FCD34D' },
                    { dx: 0, dy: 0, dz: 1, color: '#F97316' },
                ];
                
                // Create a simple random structure
                for (let i = 0; i < 20 + Math.floor(Math.random() * 30); i++) {
                    generatedVoxels.push({
                        id: `gen-${i}`,
                        x: Math.floor(Math.random() * 5) - 2,
                        y: Math.floor(Math.random() * 5),
                        z: Math.floor(Math.random() * 5) - 2,
                        color: PALETTE_COLORS[Math.floor(Math.random() * PALETTE_COLORS.length)]
                    });
                }
                
                const generated = {
                    id: 'custom-' + Date.now(),
                    name: 'AI生成: ' + prompt.substring(0, 10),
                    category: 'custom',
                    voxels: generatedVoxels
                };
                
                selectModel(generated);
                savedModels.push(generated);
                localStorage.setItem('toybox_saved_models', JSON.stringify(savedModels));
                renderSavedGallery();
                
                btn.disabled = false;
                btn.textContent = '生成体素艺术';
                status.classList.remove('show');
                hideGenerator();
                setMode('editor');
                showToast('模型已生成！');
                
            }, 2000);
        }
        
        // ========== TOAST ==========
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        // ========== INIT ==========
        function init() {
            initThreeJS();
            initColorPalette();
            createGhostBlock();
            renderVoxels();
            renderGallery();
            
            history = [JSON.parse(JSON.stringify(currentModel.voxels))];
            historyIndex = 0;
            updateHistoryButtons();
            
            document.getElementById('current-model-name').textContent = currentModel.name;
        }
        
        // Start
        window.onload = init;
    </script>
</body>
</html>
