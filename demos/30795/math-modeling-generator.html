<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学建模初稿生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .main-content {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #eee;
        }
        
        .tab {
            padding: 18px 24px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            color: #666;
            border: none;
            background: none;
            transition: all 0.3s;
            position: relative;
        }
        
        .tab:hover {
            color: #667eea;
        }
        
        .tab.active {
            color: #667eea;
            background: white;
        }
        
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }
        
        .form-section {
            padding: 30px;
            display: none;
        }
        
        .form-section.active {
            display: block;
        }
        
        .section-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
            font-size: 15px;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .form-group .hint {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
            font-style: italic;
        }
        
        .model-type-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }
        
        .model-option {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        
        .model-option:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        
        .model-option.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            color: #667eea;
            font-weight: 600;
        }
        
        .symbol-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        .symbol-table th,
        .symbol-table td {
            padding: 12px;
            border: 1px solid #e0e0e0;
            text-align: left;
        }
        
        .symbol-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #666;
        }
        
        .add-symbol-btn,
        .remove-symbol-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .add-symbol-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .add-symbol-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .remove-symbol-btn {
            background: #f87171;
            color: white;
        }
        
        .remove-symbol-btn:hover {
            background: #ef4444;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            padding: 30px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
        }
        
        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: #666;
            border: 2px solid #ddd;
        }
        
        .btn-secondary:hover {
            border-color: #667eea;
            color: #667eea;
        }
        
        .preview-section {
            padding: 30px;
            background: #fdfdfd;
        }
        
        .preview-content {
            background: white;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 30px;
            min-height: 400px;
            white-space: pre-wrap;
            font-family: 'SimSun', 'Songti SC', serif;
            line-height: 1.8;
            color: #333;
        }
        
        .preview-content h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.4rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        
        .preview-content h3 {
            color: #444;
            margin: 20px 0 10px;
            font-size: 1.1rem;
        }
        
        .preview-content p {
            margin-bottom: 12px;
            text-indent: 2em;
        }
        
        .preview-content ul,
        .preview-content ol {
            margin-left: 2em;
            margin-bottom: 12px;
        }
        
        .preview-content li {
            margin-bottom: 8px;
        }
        
        .nav-progress {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 14px;
        }
        
        .nav-progress .step {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .nav-progress .step.active {
            font-weight: 600;
        }
        
        .nav-progress .step::before {
            content: '';
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .nav-progress .step.active::before {
            background: white;
            color: #667eea;
            content: '✓';
        }
        
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .checkbox-item:hover {
            border-color: #667eea;
        }
        
        .checkbox-item.selected {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        
        .checkbox-item input {
            width: auto;
            margin: 0;
        }
        
        @media (max-width: 768px) {
            .tabs {
                overflow-x: auto;
            }
            
            .tab {
                min-width: 100px;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 数学建模初稿生成器</h1>
            <p>快速构建数学建模论文框架，让您专注于深度优化</p>
        </div>
        
        <div class="main-content">
            <div class="nav-progress">
                <div class="step active">1. 问题分析</div>
                <div class="step">2. 模型构建</div>
                <div class="step">3. 模型求解</div>
                <div class="step">4. 结果分析</div>
                <div class="step">5. 预览导出</div>
            </div>
            
            <div class="tabs">
                <button class="tab active" data-tab="problem">问题分析</button>
                <button class="tab" data-tab="model">模型构建</button>
                <button class="tab" data-tab="solution">模型求解</button>
                <button class="tab" data-tab="analysis">结果分析</button>
                <button class="tab" data-tab="preview">预览导出</button>
            </div>
            
            <div class="form-section active" id="problem">
                <div class="section-title">问题重述</div>
                <div class="form-group">
                    <label>竞赛题目</label>
                    <input type="text" id="problem-title" placeholder="请输入竞赛题目名称">
                </div>
                <div class="form-group">
                    <label>问题背景</label>
                    <textarea id="problem-background" placeholder="请简述问题的背景和来源，包括问题提出的背景、实际应用场景等"></textarea>
                </div>
                <div class="form-group">
                    <label>问题描述</label>
                    <textarea id="problem-description" placeholder="请详细描述需要解决的问题，包括问题的核心要求、约束条件等"></textarea>
                </div>
                <div class="form-group">
                    <label>问题分析</label>
                    <textarea id="problem-analysis" placeholder="请分析问题的关键点、难点以及解决问题的思路方向"></textarea>
                </div>
                
                <div class="section-title">模型假设</div>
                <div class="form-group">
                    <label>基本假设</label>
                    <textarea id="assumptions" placeholder="请列出针对问题的合理假设，如：假设数据服从某种分布、忽略某些次要因素等"></textarea>
                    <div class="hint">提示：假设应合理、简化问题且不影响问题的本质</div>
                </div>
            </div>
            
            <div class="form-section" id="model">
                <div class="section-title">符号说明</div>
                <table class="symbol-table" id="symbol-table">
                    <thead>
                        <tr>
                            <th>符号</th>
                            <th>含义</th>
                            <th>单位</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><input type="text" placeholder="如：x" class="symbol-input"></td>
                            <td><input type="text" placeholder="如：时间" class="symbol-input"></td>
                            <td><input type="text" placeholder="如：秒" class="symbol-input"></td>
                            <td><button class="remove-symbol-btn" onclick="removeSymbolRow(this)">删除</button></td>
                        </tr>
                    </tbody>
                </table>
                <button class="add-symbol-btn" onclick="addSymbolRow()">+ 添加符号</button>
                
                <div class="section-title">模型选择</div>
                <div class="form-group">
                    <label>选择主要数学模型（可多选）</label>
                    <div class="model-type-options" id="model-types">
                        <div class="model-option" data-model="linear">线性规划模型</div>
                        <div class="model-option" data-model="nonlinear">非线性规划模型</div>
                        <div class="model-option" data-model="integer">整数规划模型</div>
                        <div class="model-option" data-model="graph">图论模型</div>
                        <div class="model-option" data-model="probability">概率统计模型</div>
                        <div class="model-option" data-model="differential">微分方程模型</div>
                        <div class="model-option" data-model="fuzzy">模糊数学模型</div>
                        <div class="model-option" data-model="neural">神经网络模型</div>
                        <div class="model-option" data-model="optimization">优化模型</div>
                        <div class="model-option" data-model="simulation">仿真模型</div>
                        <div class="model-option" data-model="other">其他模型</div>
                    </div>
                </div>
                
                <div class="section-title">模型建立</div>
                <div class="form-group">
                    <label>模型框架</label>
                    <textarea id="model-framework" placeholder="请描述模型的整体框架结构，包括各个子模型之间的关系"></textarea>
                </div>
                <div class="form-group">
                    <label>核心公式</label>
                    <textarea id="model-formulas" placeholder="请列出模型的核心公式（可使用Latex格式），如：min f(x) = sum(x_i)"></textarea>
                </div>
                <div class="form-group">
                    <label>建模思路</label>
                    <textarea id="model-thinking" placeholder="请详细描述建模的思考过程，包括如何将实际问题转化为数学问题"></textarea>
                </div>
            </div>
            
            <div class="form-section" id="solution">
                <div class="section-title">求解方法</div>
                <div class="form-group">
                    <label>求解算法选择</label>
                    <select id="solution-algorithm">
                        <option value="">请选择求解算法</option>
                        <option value="simplex">单纯形法</option>
                        <option value="gradient">梯度下降法</option>
                        <option value="genetic">遗传算法</option>
                        <option value="simulated">模拟退火算法</option>
                        <option value="particle">粒子群算法</option>
                        <option value="dynamic">动态规划</option>
                        <option value="branch">分支定界法</option>
                        <option value="other">其他算法</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>算法描述</label>
                    <textarea id="algorithm-description" placeholder="请描述所选用算法的原理和步骤"></textarea>
                </div>
                
                <div class="section-title">编程实现</div>
                <div class="form-group">
                    <label>编程语言</label>
                    <select id="programming-lang">
                        <option value="matlab">MATLAB</option>
                        <option value="python">Python</option>
                        <option value="lingo">LINGO</option>
                        <option value="c++">C++</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>代码结构</label>
                    <textarea id="code-structure" placeholder="请描述代码的整体结构和主要模块"></textarea>
                </div>
                <div class="form-group">
                    <label>关键代码片段</label>
                    <textarea id="code-snippet" placeholder="请提供核心代码片段（可选）"></textarea>
                </div>
                
                <div class="section-title">数据来源</div>
                <div class="form-group">
                    <label>数据获取途径</label>
                    <textarea id="data-source" placeholder="请说明数据的来源，如：题目提供、公开数据集、实地调研等"></textarea>
                </div>
                <div class="form-group">
                    <label>数据预处理</label>
                    <textarea id="data-preprocessing" placeholder="请描述数据预处理的方法，如：数据清洗、标准化、缺失值处理等"></textarea>
                </div>
            </div>
            
            <div class="form-section" id="analysis">
                <div class="section-title">结果分析</div>
                <div class="form-group">
                    <label>计算结果</label>
                    <textarea id="results" placeholder="请列出模型的主要计算结果和结论"></textarea>
                </div>
                <div class="form-group">
                    <label>结果验证</label>
                    <textarea id="validation" placeholder="请描述结果的验证方法和验证结果"></textarea>
                </div>
                <div class="form-group">
                    <label>灵敏度分析</label>
                    <textarea id="sensitivity" placeholder="请描述对关键参数的灵敏度分析结果"></textarea>
                </div>
                
                <div class="section-title">模型评价</div>
                <div class="form-group">
                    <label>模型优点</label>
                    <textarea id="model-advantages" placeholder="请分析模型的优点和创新点"></textarea>
                </div>
                <div class="form-group">
                    <label>模型缺点</label>
                    <textarea id="model-disadvantages" placeholder="请分析模型的局限性和不足之处"></textarea>
                </div>
                <div class="form-group">
                    <label>改进方向</label>
                    <textarea id="improvement" placeholder="请提出模型的改进方向和拓展思路"></textarea>
                </div>
                
                <div class="section-title">参考文献</div>
                <div class="form-group">
                    <label>引用文献</label>
                    <textarea id="references" placeholder="请列出引用的主要参考文献（格式：作者. 标题. 期刊/会议, 年份）"></textarea>
                </div>
            </div>
            
            <div class="form-section" id="preview">
                <div class="section-title">论文预览</div>
                <div class="preview-content" id="preview-content">
                    <p style="text-align: center; color: #888;">点击下方"生成初稿"按钮预览论文内容</p>
                </div>
                
                <div class="btn-group" style="padding-top: 20px;">
                    <button class="btn btn-primary" onclick="generatePaper()">📝 生成初稿</button>
                    <button class="btn btn-secondary" onclick="exportPaper()">📥 导出Word</button>
                </div>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="prevTab()">← 上一步</button>
                <button class="btn btn-primary" onclick="nextTab()">下一步 →</button>
            </div>
        </div>
        
        <div style="text-align: center; color: white; margin-top: 30px; opacity: 0.8; font-size: 14px;">
            <p>数学建模初稿生成器 - 助力大学生建模竞赛</p>
        </div>
    </div>
    
    <script>
        const tabs = document.querySelectorAll('.tab');
        const sections = document.querySelectorAll('.form-section');
        const navSteps = document.querySelectorAll('.nav-progress .step');
        
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const tabId = tab.dataset.tab;
                showTab(tabId);
            });
        });
        
        function showTab(tabId) {
            tabs.forEach(t => t.classList.remove('active'));
            sections.forEach(s => s.classList.remove('active'));
            
            document.querySelector(`.tab[data-tab="${tabId}"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
            
            const tabOrder = ['problem', 'model', 'solution', 'analysis', 'preview'];
            const currentIndex = tabOrder.indexOf(tabId);
            navSteps.forEach((step, index) => {
                if (index <= currentIndex) {
                    step.classList.add('active');
                } else {
                    step.classList.remove('active');
                }
            });
        }
        
        function prevTab() {
            const tabOrder = ['problem', 'model', 'solution', 'analysis', 'preview'];
            const currentTab = document.querySelector('.tab.active').dataset.tab;
            const currentIndex = tabOrder.indexOf(currentTab);
            
            if (currentIndex > 0) {
                showTab(tabOrder[currentIndex - 1]);
            }
        }
        
        function nextTab() {
            const tabOrder = ['problem', 'model', 'solution', 'analysis', 'preview'];
            const currentTab = document.querySelector('.tab.active').dataset.tab;
            const currentIndex = tabOrder.indexOf(currentTab);
            
            if (currentIndex < tabOrder.length - 1) {
                showTab(tabOrder[currentIndex + 1]);
            }
        }
        
        function addSymbolRow() {
            const table = document.getElementById('symbol-table').querySelector('tbody');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><input type="text" placeholder="如：x" class="symbol-input"></td>
                <td><input type="text" placeholder="如：时间" class="symbol-input"></td>
                <td><input type="text" placeholder="如：秒" class="symbol-input"></td>
                <td><button class="remove-symbol-btn" onclick="removeSymbolRow(this)">删除</button></td>
            `;
            table.appendChild(row);
        }
        
        function removeSymbolRow(btn) {
            const row = btn.parentElement.parentElement;
            const table = document.getElementById('symbol-table').querySelector('tbody');
            if (table.children.length > 1) {
                table.removeChild(row);
            }
        }
        
        document.querySelectorAll('.model-option').forEach(opt => {
            opt.addEventListener('click', () => {
                opt.classList.toggle('selected');
            });
        });
        
        function generatePaper() {
            const data = {
                title: document.getElementById('problem-title').value || '数学建模论文',
                background: document.getElementById('problem-background').value || '',
                description: document.getElementById('problem-description').value || '',
                analysis: document.getElementById('problem-analysis').value || '',
                assumptions: document.getElementById('assumptions').value || '',
                symbols: getSymbols(),
                models: getSelectedModels(),
                framework: document.getElementById('model-framework').value || '',
                formulas: document.getElementById('model-formulas').value || '',
                thinking: document.getElementById('model-thinking').value || '',
                algorithm: document.getElementById('solution-algorithm').value || '',
                algorithmDesc: document.getElementById('algorithm-description').value || '',
                language: document.getElementById('programming-lang').value || '',
                codeStructure: document.getElementById('code-structure').value || '',
                codeSnippet: document.getElementById('code-snippet').value || '',
                dataSource: document.getElementById('data-source').value || '',
                dataPreprocessing: document.getElementById('data-preprocessing').value || '',
                results: document.getElementById('results').value || '',
                validation: document.getElementById('validation').value || '',
                sensitivity: document.getElementById('sensitivity').value || '',
                advantages: document.getElementById('model-advantages').value || '',
                disadvantages: document.getElementById('model-disadvantages').value || '',
                improvement: document.getElementById('improvement').value || '',
                references: document.getElementById('references').value || ''
            };
            
            let paper = `<h2>${data.title}</h2>`;
            
            paper += `<h3>摘要</h3>`;
            paper += `<p>${data.background.substring(0, 150) || '本文针对给定问题进行了深入分析，建立了相应的数学模型，并通过合适的算法进行求解，得到了较为满意的结果。'}...</p>`;
            
            paper += `<h3>一、问题重述</h3>`;
            if (data.background) paper += `<p>${data.background}</p>`;
            if (data.description) paper += `<p>${data.description}</p>`;
            if (data.analysis) paper += `<p>${data.analysis}</p>`;
            
            paper += `<h3>二、模型假设</h3>`;
            if (data.assumptions) {
                const items = data.assumptions.split('\n').filter(item => item.trim());
                paper += `<ol>`;
                items.forEach((item, i) => paper += `<li>${item.trim()}</li>`);
                paper += `</ol>`;
            }
            
            paper += `<h3>三、符号说明</h3>`;
            if (data.symbols.length > 0) {
                paper += `<table style="width:100%;border-collapse:collapse;"><tr><th>符号</th><th>含义</th><th>单位</th></tr>`;
                data.symbols.forEach(s => {
                    paper += `<tr><td>${s.symbol || '-'}</td><td>${s.meaning || '-'}</td><td>${s.unit || '-'}</td></tr>`;
                });
                paper += `</table>`;
            }
            
            paper += `<h3>四、模型建立</h3>`;
            if (data.models.length > 0) {
                paper += `<p>本文采用的数学模型包括：${data.models.join('、')}。</p>`;
            }
            if (data.framework) paper += `<p>${data.framework}</p>`;
            if (data.formulas) {
                paper += `<p><strong>核心公式：</strong></p>`;
                paper += `<p style="font-family: monospace;">${data.formulas}</p>`;
            }
            if (data.thinking) paper += `<p>${data.thinking}</p>`;
            
            paper += `<h3>五、模型求解</h3>`;
            if (data.algorithm) paper += `<p><strong>求解算法：</strong>${getAlgorithmName(data.algorithm)}</p>`;
            if (data.algorithmDesc) paper += `<p>${data.algorithmDesc}</p>`;
            if (data.language) paper += `<p><strong>编程语言：</strong>${getLanguageName(data.language)}</p>`;
            if (data.codeStructure) paper += `<p>${data.codeStructure}</p>`;
            if (data.codeSnippet) {
                paper += `<p><strong>关键代码：</strong></p>`;
                paper += `<pre style="background:#f5f5f5;padding:10px;border-radius:5px;">${data.codeSnippet}</pre>`;
            }
            
            paper += `<h3>六、数据来源与预处理</h3>`;
            if (data.dataSource) paper += `<p>${data.dataSource}</p>`;
            if (data.dataPreprocessing) paper += `<p>${data.dataPreprocessing}</p>`;
            
            paper += `<h3>七、结果分析</h3>`;
            if (data.results) paper += `<p>${data.results}</p>`;
            if (data.validation) paper += `<p><strong>结果验证：</strong>${data.validation}</p>`;
            if (data.sensitivity) paper += `<p><strong>灵敏度分析：</strong>${data.sensitivity}</p>`;
            
            paper += `<h3>八、模型评价</h3>`;
            if (data.advantages) paper += `<p><strong>模型优点：</strong>${data.advantages}</p>`;
            if (data.disadvantages) paper += `<p><strong>模型缺点：</strong>${data.disadvantages}</p>`;
            if (data.improvement) paper += `<p><strong>改进方向：</strong>${data.improvement}</p>`;
            
            paper += `<h3>参考文献</h3>`;
            if (data.references) {
                const refs = data.references.split('\n').filter(r => r.trim());
                paper += `<ol>`;
                refs.forEach((ref, i) => paper += `<li>${ref.trim()}</li>`);
                paper += `</ol>`;
            }
            
            document.getElementById('preview-content').innerHTML = paper;
            showTab('preview');
        }
        
        function getSymbols() {
            const rows = document.querySelectorAll('#symbol-table tbody tr');
            const symbols = [];
            rows.forEach(row => {
                const inputs = row.querySelectorAll('.symbol-input');
                symbols.push({
                    symbol: inputs[0].value,
                    meaning: inputs[1].value,
                    unit: inputs[2].value
                });
            });
            return symbols;
        }
        
        function getSelectedModels() {
            const selected = document.querySelectorAll('.model-option.selected');
            const names = {
                'linear': '线性规划模型',
                'nonlinear': '非线性规划模型',
                'integer': '整数规划模型',
                'graph': '图论模型',
                'probability': '概率统计模型',
                'differential': '微分方程模型',
                'fuzzy': '模糊数学模型',
                'neural': '神经网络模型',
                'optimization': '优化模型',
                'simulation': '仿真模型',
                'other': '其他模型'
            };
            return Array.from(selected).map(s => names[s.dataset.model]);
        }
        
        function getAlgorithmName(code) {
            const names = {
                'simplex': '单纯形法',
                'gradient': '梯度下降法',
                'genetic': '遗传算法',
                'simulated': '模拟退火算法',
                'particle': '粒子群算法',
                'dynamic': '动态规划',
                'branch': '分支定界法',
                'other': '其他算法'
            };
            return names[code] || code;
        }
        
        function getLanguageName(code) {
            const names = {
                'matlab': 'MATLAB',
                'python': 'Python',
                'lingo': 'LINGO',
                'c++': 'C++',
                'other': '其他语言'
            };
            return names[code] || code;
        }
        
        function exportPaper() {
            const content = document.getElementById('preview-content').innerHTML;
            const blob = new Blob([content], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '数学建模论文初稿.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
