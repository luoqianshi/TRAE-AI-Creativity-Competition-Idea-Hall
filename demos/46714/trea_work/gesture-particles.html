<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手势控制粒子系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: oklch(0.06 0.01 270);
            overflow: hidden;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            color: white;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #camera-preview {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 120px;
            height: 160px;
            border-radius: 12px;
            border: 2px solid oklch(0.7 0.22 290);
            transform: scaleX(-1);
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            background: #000;
        }

        .gesture-info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 16px;
            z-index: 100;
            font-size: 0.85rem;
        }

        .gesture-info h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: oklch(0.7 0.22 290);
        }

        .gesture-info ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .gesture-info li {
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: oklch(0.6 0.01 90);
        }

        .gesture-info li.active {
            color: oklch(0.7 0.22 145);
            font-weight: 600;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: oklch(0.6 0.22 25);
            animation: pulse-red 1s ease infinite;
        }

        .status-indicator.active {
            background: oklch(0.7 0.22 145);
            animation: pulse-green 1s ease infinite;
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes pulse-green {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .mode-switcher {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 8px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }

        .mode-btn {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background: oklch(0.2 0.02 270);
            color: oklch(0.6 0.01 90);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: oklch(0.65 0.22 290);
            color: white;
        }

        .particle-count {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(15, 15, 25, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 0.85rem;
            color: oklch(0.5 0.01 90);
            z-index: 100;
        }

        .connection-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 25, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            z-index: 200;
            max-width: 300px;
        }

        .connection-hint h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: oklch(0.7 0.22 290);
        }

        .connection-hint p {
            font-size: 0.9rem;
            color: oklch(0.6 0.01 90);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .connection-hint button {
            padding: 12px 32px;
            background: oklch(0.65 0.22 290);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .connection-hint button:hover {
            background: oklch(0.75 0.22 290);
        }

        @media (max-width: 480px) {
            #camera-preview {
                width: 80px;
                height: 107px;
            }

            .gesture-info {
                padding: 12px;
                font-size: 0.75rem;
            }

            .mode-btn {
                padding: 8px 16px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    <video id="camera-preview" playsinline></video>
    
    <div class="gesture-info">
        <h3>手势控制</h3>
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
            <span class="status-indicator" id="status"></span>
            <span id="status-text">等待连接...</span>
        </div>
        <ul>
            <li id="gesture-none">无手势 - 粒子自由飘动</li>
            <li id="gesture-point">食指伸出 - 指向控制</li>
            <li id="gesture-pinch">捏合手势 - 吸引粒子</li>
            <li id="gesture-open">张开手掌 - 推开粒子</li>
        </ul>
    </div>

    <div class="mode-switcher">
        <button class="mode-btn active" data-mode="follow">跟随</button>
        <button class="mode-btn" data-mode="direction">方向</button>
        <button class="mode-btn" data-mode="wave">波浪</button>
    </div>

    <div class="particle-count">
        粒子数: <span id="count">200</span>
    </div>

    <div class="connection-hint" id="connectionHint">
        <h2>开启摄像头</h2>
        <p>请允许摄像头访问以使用手势控制粒子系统。确保在光线充足的环境下使用。</p>
        <button onclick="startCamera()">开启摄像头</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('camera-preview');
        const statusIndicator = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const connectionHint = document.getElementById('connectionHint');
        
        let particles = [];
        let gestureData = {
            active: false,
            x: 0,
            y: 0,
            directionX: 0,
            directionY: 0,
            gesture: 'none',
            pinchStrength: 0
        };
        
        let settings = {
            particleCount: 200,
            mode: 'follow',
            forceStrength: 0.15,
            connectionDistance: 120
        };
        
        let animationId;
        let lastTime = 0;
        let hands;
        let camera;
        
        const colorSchemes = {
            default: { start: 270, end: 30 },
            cyan: { start: 160, end: 220 },
            orange: { start: 20, end: 80 }
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.radius = Math.random() * 2.5 + 0.5;
                this.baseRadius = this.radius;
                this.hue = 270 + Math.random() * 60;
                this.life = 1;
            }

            update(dt) {
                if (gestureData.active) {
                    const dx = gestureData.x - this.x;
                    const dy = gestureData.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 250) {
                        const force = settings.forceStrength * (250 - distance) / 250;
                        
                        switch (settings.mode) {
                            case 'follow':
                                if (gestureData.gesture === 'pinch') {
                                    this.vx += (dx / distance) * force * dt * gestureData.pinchStrength;
                                    this.vy += (dy / distance) * force * dt * gestureData.pinchStrength;
                                } else if (gestureData.gesture === 'open') {
                                    this.vx -= (dx / distance) * force * dt * 1.5;
                                    this.vy -= (dy / distance) * force * dt * 1.5;
                                } else if (gestureData.gesture === 'point') {
                                    this.vx += gestureData.directionX * force * dt * 0.5;
                                    this.vy += gestureData.directionY * force * dt * 0.5;
                                }
                                break;
                                
                            case 'direction':
                                this.vx += gestureData.directionX * force * dt;
                                this.vy += gestureData.directionY * force * dt;
                                break;
                                
                            case 'wave':
                                const waveOffset = Math.sin(Date.now() * 0.005 + this.x * 0.01) * 0.5;
                                this.vx += gestureData.directionX * force * dt * (0.5 + waveOffset);
                                this.vy += gestureData.directionY * force * dt * (0.5 - waveOffset);
                                break;
                        }
                    }
                }
                
                this.vx *= 0.985;
                this.vy *= 0.985;
                
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                this.radius = Math.max(0.5, this.baseRadius * (1 + Math.min(speed, 4) / 8));
                this.hue = (270 + speed * 15) % 360;
                
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                
                if (this.x < -30) this.x = canvas.width + 30;
                if (this.x > canvas.width + 30) this.x = -30;
                if (this.y < -30) this.y = canvas.height + 30;
                if (this.y > canvas.height + 30) this.y = -30;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.1, this.radius), 0, Math.PI * 2);
                ctx.fillStyle = `oklch(${0.55 + Math.random() * 0.25} ${0.12 + Math.random() * 0.08} ${this.hue})`;
                ctx.fill();
            }
        }

        function createGrid() {
            const gridSize = settings.connectionDistance;
            const grid = {};
            
            particles.forEach(p => {
                const gridX = Math.floor(p.x / gridSize);
                const gridY = Math.floor(p.y / gridSize);
                const key = `${gridX},${gridY}`;
                
                if (!grid[key]) grid[key] = [];
                grid[key].push(p);
            });
            
            return grid;
        }

        function connectParticles() {
            const grid = createGrid();
            const gridSize = settings.connectionDistance;
            
            particles.forEach(p => {
                const gridX = Math.floor(p.x / gridSize);
                const gridY = Math.floor(p.y / gridSize);
                
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        const key = `${gridX + dx},${gridY + dy}`;
                        const neighbors = grid[key] || [];
                        
                        neighbors.forEach(n => {
                            if (n === p) return;
                            
                            const dx2 = p.x - n.x;
                            const dy2 = p.y - n.y;
                            const distance = Math.sqrt(dx2 * dx2 + dy2 * dy2);
                            
                            if (distance < settings.connectionDistance) {
                                const opacity = (1 - distance / settings.connectionDistance) * 0.25;
                                ctx.beginPath();
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(n.x, n.y);
                                ctx.strokeStyle = `oklch(0.5 0.12 ${p.hue} / ${opacity})`;
                                ctx.lineWidth = 0.4;
                                ctx.stroke();
                            }
                        });
                    }
                }
            });
        }

        function updateParticles(dt) {
            if (particles.length > settings.particleCount) {
                particles.splice(settings.particleCount);
            } else if (particles.length < settings.particleCount) {
                while (particles.length < settings.particleCount) {
                    particles.push(new Particle());
                }
            }
            
            particles.forEach(p => p.update(dt));
        }

        function draw() {
            ctx.fillStyle = 'oklch(0.06 0.01 270)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            connectParticles();
            particles.forEach(p => p.draw());
            
            if (gestureData.active) {
                ctx.beginPath();
                ctx.arc(gestureData.x, gestureData.y, 35, 0, Math.PI * 2);
                const gradient = ctx.createRadialGradient(
                    gestureData.x, gestureData.y, 0,
                    gestureData.x, gestureData.y, 35
                );
                
                if (gestureData.gesture === 'pinch') {
                    gradient.addColorStop(0, 'oklch(0.7 0.22 145 / 0.4)');
                    gradient.addColorStop(1, 'oklch(0.7 0.22 145 / 0)');
                } else if (gestureData.gesture === 'open') {
                    gradient.addColorStop(0, 'oklch(0.7 0.22 25 / 0.4)');
                    gradient.addColorStop(1, 'oklch(0.7 0.22 25 / 0)');
                } else {
                    gradient.addColorStop(0, 'oklch(0.7 0.22 290 / 0.3)');
                    gradient.addColorStop(1, 'oklch(0.7 0.22 290 / 0)');
                }
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                if (gestureData.gesture === 'point') {
                    ctx.beginPath();
                    ctx.moveTo(gestureData.x, gestureData.y);
                    ctx.lineTo(
                        gestureData.x + gestureData.directionX * 100,
                        gestureData.y + gestureData.directionY * 100
                    );
                    ctx.strokeStyle = 'oklch(0.7 0.22 290 / 0.6)';
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.arc(
                        gestureData.x + gestureData.directionX * 100,
                        gestureData.y + gestureData.directionY * 100,
                        8, 0, Math.PI * 2
                    );
                    ctx.fillStyle = 'oklch(0.7 0.22 290)';
                    ctx.fill();
                }
            }
        }

        function loop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 16.67, 3);
            lastTime = timestamp;
            
            updateParticles(dt);
            draw();
            
            animationId = requestAnimationFrame(loop);
        }

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                const wrist = landmarks[0];
                const middleTip = landmarks[12];
                const ringTip = landmarks[16];
                const pinkyTip = landmarks[20];
                
                gestureData.x = indexTip.x * canvas.width;
                gestureData.y = indexTip.y * canvas.height;
                
                const wristToIndex = {
                    x: indexTip.x - wrist.x,
                    y: indexTip.y - wrist.y
                };
                const length = Math.sqrt(wristToIndex.x * wristToIndex.x + wristToIndex.y * wristToIndex.y);
                gestureData.directionX = wristToIndex.x / length;
                gestureData.directionY = wristToIndex.y / length;
                
                const pinchDistance = Math.sqrt(
                    Math.pow(indexTip.x - thumbTip.x, 2) + 
                    Math.pow(indexTip.y - thumbTip.y, 2)
                );
                
                const fingersExtended = [
                    indexTip.y < landmarks[6].y,
                    middleTip.y < landmarks[10].y,
                    ringTip.y < landmarks[14].y,
                    pinkyTip.y < landmarks[18].y
                ];
                
                const extendedCount = fingersExtended.filter(f => f).length;
                
                if (pinchDistance < 0.08) {
                    gestureData.gesture = 'pinch';
                    gestureData.pinchStrength = 1 - (pinchDistance / 0.08);
                    gestureData.active = true;
                } else if (extendedCount >= 3) {
                    gestureData.gesture = 'open';
                    gestureData.active = true;
                } else if (fingersExtended[0] && !fingersExtended[1] && !fingersExtended[2] && !fingersExtended[3]) {
                    gestureData.gesture = 'point';
                    gestureData.active = true;
                } else {
                    gestureData.gesture = 'none';
                    gestureData.active = false;
                }
                
                updateGestureUI();
            } else {
                gestureData.active = false;
                gestureData.gesture = 'none';
                updateGestureUI();
            }
        }

        function updateGestureUI() {
            document.querySelectorAll('.gesture-info li').forEach(li => li.classList.remove('active'));
            
            if (gestureData.active) {
                document.getElementById(`gesture-${gestureData.gesture}`).classList.add('active');
                statusIndicator.classList.add('active');
                statusText.textContent = '手势检测中';
            } else {
                document.getElementById('gesture-none').classList.add('active');
                statusIndicator.classList.remove('active');
                statusText.textContent = '等待手势...';
            }
        }

        async function startCamera() {
            connectionHint.style.display = 'none';
            
            hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});
            
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            
            hands.onResults(onResults);
            
            try {
                camera = new Camera(video, {
                    onFrame: async () => {
                        await hands.send({image: video});
                    },
                    width: 320,
                    height: 240
                });
                
                await camera.start();
                statusIndicator.classList.add('active');
                statusText.textContent = '摄像头已启动';
            } catch (error) {
                console.error('摄像头启动失败:', error);
                statusText.textContent = '摄像头访问失败';
                alert('无法访问摄像头，请检查权限设置。');
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < settings.particleCount; i++) {
                particles.push(new Particle());
            }
        }

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                settings.mode = btn.dataset.mode;
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        window.addEventListener('resize', resize);

        resize();
        initParticles();
        animationId = requestAnimationFrame(loop);
    </script>
</body>
</html>
