<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子交互系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: oklch(0.06 0.01 270);
            overflow: hidden;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            color: white;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(102, 59, 205, 0.3);
            border-radius: 16px;
            padding: 24px;
            min-width: 280px;
            z-index: 100;
            opacity: 0;
            transform: translateX(-20px);
            animation: slideIn 0.5s ease 0.3s forwards;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }

        .controls h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, oklch(0.7 0.22 290), oklch(0.75 0.2 45));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 0.85rem;
            color: oklch(0.6 0.01 90);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 6px;
            background: oklch(0.2 0.02 270);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: oklch(0.7 0.22 290);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .control-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .control-group input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: oklch(0.7 0.22 290);
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .control-group input[type="range"]::-moz-range-track {
            background: oklch(0.2 0.02 270);
            border-radius: 3px;
        }

        .range-value {
            font-size: 0.75rem;
            color: oklch(0.5 0.01 90);
            margin-top: 4px;
            text-align: right;
        }

        .mode-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 10px;
            background: oklch(0.15 0.02 270);
            border: 1px solid oklch(0.25 0.03 270);
            border-radius: 8px;
            color: oklch(0.7 0.01 90);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: oklch(0.65 0.22 290);
            border-color: oklch(0.75 0.22 290);
            color: white;
        }

        .mode-btn:hover {
            border-color: oklch(0.5 0.15 290);
        }

        .color-schemes {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .color-scheme-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .color-scheme-btn.active {
            border-color: white;
            transform: scale(1.1);
        }

        .color-scheme-btn:nth-child(1) { background: linear-gradient(135deg, oklch(0.7 0.22 290), oklch(0.75 0.2 45)); }
        .color-scheme-btn:nth-child(2) { background: linear-gradient(135deg, oklch(0.6 0.2 145), oklch(0.7 0.18 200)); }
        .color-scheme-btn:nth-child(3) { background: linear-gradient(135deg, oklch(0.7 0.22 25), oklch(0.75 0.18 80)); }
        .color-scheme-btn:nth-child(4) { background: linear-gradient(135deg, oklch(0.6 0.2 340), oklch(0.7 0.18 10)); }

        .info-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 15, 25, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 16px;
            font-size: 0.8rem;
            color: oklch(0.5 0.01 90);
            z-index: 100;
        }

        .info-panel ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .info-panel li {
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-panel li:last-child {
            margin-bottom: 0;
        }

        .info-panel code {
            background: oklch(0.2 0.02 270);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', monospace;
            font-size: 0.7rem;
            color: oklch(0.7 0.01 90);
        }

        .fps-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(15, 15, 25, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            padding: 8px 16px;
            font-family: 'SF Mono', monospace;
            font-size: 0.9rem;
            z-index: 100;
        }

        .fps-counter span {
            color: oklch(0.7 0.22 145);
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .controls {
                top: 10px;
                left: 10px;
                right: 10px;
                min-width: auto;
                padding: 16px;
            }

            .mode-buttons {
                grid-template-columns: repeat(4, 1fr);
            }

            .info-panel {
                bottom: 10px;
                left: 10px;
                right: 10px;
                padding: 12px;
            }

            .fps-counter {
                top: auto;
                bottom: 100px;
                right: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .controls {
                animation: none;
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="controls">
        <h2>粒子控制</h2>
        
        <div class="control-group">
            <label for="particleCount">粒子数量</label>
            <input type="range" id="particleCount" min="50" max="500" value="200" step="10">
            <div class="range-value" id="particleCountValue">200</div>
        </div>

        <div class="control-group">
            <label for="forceStrength">力强度</label>
            <input type="range" id="forceStrength" min="0.01" max="0.5" value="0.1" step="0.01">
            <div class="range-value" id="forceStrengthValue">0.10</div>
        </div>

        <div class="control-group">
            <label for="connectionDistance">连接距离</label>
            <input type="range" id="connectionDistance" min="50" max="200" value="100" step="10">
            <div class="range-value" id="connectionDistanceValue">100</div>
        </div>

        <div class="control-group">
            <label>交互模式</label>
            <div class="mode-buttons">
                <button class="mode-btn active" data-mode="attract">吸引</button>
                <button class="mode-btn" data-mode="repel">排斥</button>
                <button class="mode-btn" data-mode="orbit">轨道</button>
                <button class="mode-btn" data-mode="explode">爆炸</button>
            </div>
        </div>

        <div class="control-group">
            <label>颜色方案</label>
            <div class="color-schemes">
                <button class="color-scheme-btn active" data-scheme="purple"></button>
                <button class="color-scheme-btn" data-scheme="cyan"></button>
                <button class="color-scheme-btn" data-scheme="orange"></button>
                <button class="color-scheme-btn" data-scheme="pink"></button>
            </div>
        </div>
    </div>

    <div class="fps-counter">
        FPS: <span id="fps">60</span>
    </div>

    <div class="info-panel">
        <ul>
            <li><code>鼠标</code> 拖动交互</li>
            <li><code>左键点击</code> 生成粒子爆发</li>
            <li><code>右键点击</code> 创建引力井</li>
            <li><code>空格</code> 重置粒子</li>
            <li><code>1-4</code> 切换模式</li>
        </ul>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        let mouse = { x: 0, y: 0, active: false, clicked: false, rightClicked: false };
        let settings = {
            particleCount: 200,
            forceStrength: 0.1,
            connectionDistance: 100,
            mode: 'attract',
            scheme: 'purple'
        };
        
        let animationId;
        let lastTime = 0;
        let frameCount = 0;
        let fps = 60;
        
        const colorSchemes = {
            purple: { start: 270, end: 30 },
            cyan: { start: 160, end: 220 },
            orange: { start: 20, end: 80 },
            pink: { start: 320, end: 360 }
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor(x, y) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = Math.random() * 3 + 1;
                this.baseRadius = this.radius;
                this.hue = colorSchemes[settings.scheme].start + 
                           Math.random() * (colorSchemes[settings.scheme].end - colorSchemes[settings.scheme].start);
                this.life = 1;
                this.maxLife = 1;
                this.isNew = false;
            }

            update(dt) {
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (mouse.active && distance < 200) {
                    const force = settings.forceStrength * (200 - distance) / 200;
                    
                    switch (settings.mode) {
                        case 'attract':
                            this.vx += (dx / distance) * force * dt;
                            this.vy += (dy / distance) * force * dt;
                            break;
                        case 'repel':
                            this.vx -= (dx / distance) * force * dt * 1.5;
                            this.vy -= (dy / distance) * force * dt * 1.5;
                            break;
                        case 'orbit':
                            this.vx += (-dy / distance) * force * dt;
                            this.vy += (dx / distance) * force * dt;
                            break;
                        case 'explode':
                            this.vx += (dx / distance) * force * dt * 2;
                            this.vy += (dy / distance) * force * dt * 2;
                            break;
                    }
                }
                
                if (mouse.rightClicked && distance < 300) {
                    const gravityForce = 0.5 * (300 - distance) / 300;
                    this.vx += (dx / distance) * gravityForce * dt;
                    this.vy += (dy / distance) * gravityForce * dt;
                }
                
                this.vx *= 0.99;
                this.vy *= 0.99;
                
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                this.radius = this.baseRadius * (1 + Math.min(speed, 5) / 10);
                
                const hueRange = colorSchemes[settings.scheme].end - colorSchemes[settings.scheme].start;
                this.hue = colorSchemes[settings.scheme].start + ((speed / 10) * hueRange);
                
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                
                if (this.isNew) {
                    this.life += 0.02;
                    if (this.life >= 1) this.isNew = false;
                }
                
                if (this.x < -50) this.x = canvas.width + 50;
                if (this.x > canvas.width + 50) this.x = -50;
                if (this.y < -50) this.y = canvas.height + 50;
                if (this.y > canvas.height + 50) this.y = -50;
            }

            draw() {
                const alpha = Math.max(0.3, Math.min(1, this.life));
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.1, this.radius), 0, Math.PI * 2);
                ctx.fillStyle = `oklch(${0.6 + Math.random() * 0.2} ${0.15 + Math.random() * 0.05} ${this.hue})`;
                ctx.globalAlpha = alpha;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function createGrid() {
            const gridSize = settings.connectionDistance;
            const grid = {};
            
            particles.forEach(p => {
                const gridX = Math.floor(p.x / gridSize);
                const gridY = Math.floor(p.y / gridSize);
                const key = `${gridX},${gridY}`;
                
                if (!grid[key]) grid[key] = [];
                grid[key].push(p);
            });
            
            return grid;
        }

        function connectParticles() {
            const grid = createGrid();
            const gridSize = settings.connectionDistance;
            
            particles.forEach(p => {
                const gridX = Math.floor(p.x / gridSize);
                const gridY = Math.floor(p.y / gridSize);
                
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        const key = `${gridX + dx},${gridY + dy}`;
                        const neighbors = grid[key] || [];
                        
                        neighbors.forEach(n => {
                            if (n === p) return;
                            
                            const dx2 = p.x - n.x;
                            const dy2 = p.y - n.y;
                            const distance = Math.sqrt(dx2 * dx2 + dy2 * dy2);
                            
                            if (distance < settings.connectionDistance) {
                                const opacity = (1 - distance / settings.connectionDistance) * 0.3;
                                ctx.beginPath();
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(n.x, n.y);
                                ctx.strokeStyle = `oklch(0.5 0.15 ${p.hue} / ${opacity})`;
                                ctx.lineWidth = 0.5;
                                ctx.stroke();
                            }
                        });
                    }
                }
            });
        }

        function spawnBurst(x, y, count = 20) {
            for (let i = 0; i < count; i++) {
                const p = new Particle(x, y);
                const angle = (Math.PI * 2 * i) / count;
                const speed = Math.random() * 3 + 2;
                p.vx = Math.cos(angle) * speed;
                p.vy = Math.sin(angle) * speed;
                p.isNew = true;
                p.life = 0;
                particles.push(p);
            }
        }

        function updateParticles(dt) {
            if (particles.length > settings.particleCount) {
                particles.splice(settings.particleCount);
            } else if (particles.length < settings.particleCount) {
                while (particles.length < settings.particleCount) {
                    particles.push(new Particle());
                }
            }
            
            particles.forEach(p => p.update(dt));
        }

        function draw() {
            ctx.fillStyle = 'oklch(0.06 0.01 270)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            connectParticles();
            particles.forEach(p => p.draw());
            
            if (mouse.active) {
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 30, 0, Math.PI * 2);
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 30);
                gradient.addColorStop(0, 'oklch(0.7 0.22 290 / 0.3)');
                gradient.addColorStop(1, 'oklch(0.7 0.22 290 / 0)');
                ctx.fillStyle = gradient;
                ctx.fill();
            }
            
            if (mouse.rightClicked) {
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 50, 0, Math.PI * 2);
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 50);
                gradient.addColorStop(0, 'oklch(0.5 0.2 145 / 0.4)');
                gradient.addColorStop(1, 'oklch(0.5 0.2 145 / 0)');
                ctx.fillStyle = gradient;
                ctx.fill();
            }
        }

        function loop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 16.67, 3);
            lastTime = timestamp;
            
            frameCount++;
            if (frameCount % 10 === 0) {
                fps = Math.round(1000 / (timestamp - lastTime));
                document.getElementById('fps').textContent = fps;
            }
            
            updateParticles(dt);
            draw();
            
            animationId = requestAnimationFrame(loop);
        }

        function init() {
            resize();
            
            for (let i = 0; i < settings.particleCount; i++) {
                particles.push(new Particle());
            }
            
            animationId = requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resize);

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                mouse.active = true;
                spawnBurst(e.clientX, e.clientY, 15);
            } else if (e.button === 2) {
                mouse.rightClicked = true;
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                mouse.active = false;
            } else if (e.button === 2) {
                mouse.rightClicked = false;
            }
        });

        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                particles = [];
                for (let i = 0; i < settings.particleCount; i++) {
                    particles.push(new Particle());
                }
            }
            
            if (e.code === 'Digit1') settings.mode = 'attract';
            if (e.code === 'Digit2') settings.mode = 'repel';
            if (e.code === 'Digit3') settings.mode = 'orbit';
            if (e.code === 'Digit4') settings.mode = 'explode';
            
            updateModeButtons();
        });

        document.getElementById('particleCount').addEventListener('input', (e) => {
            settings.particleCount = parseInt(e.target.value);
            document.getElementById('particleCountValue').textContent = settings.particleCount;
        });

        document.getElementById('forceStrength').addEventListener('input', (e) => {
            settings.forceStrength = parseFloat(e.target.value);
            document.getElementById('forceStrengthValue').textContent = settings.forceStrength.toFixed(2);
        });

        document.getElementById('connectionDistance').addEventListener('input', (e) => {
            settings.connectionDistance = parseInt(e.target.value);
            document.getElementById('connectionDistanceValue').textContent = settings.connectionDistance;
        });

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                settings.mode = btn.dataset.mode;
                updateModeButtons();
            });
        });

        document.querySelectorAll('.color-scheme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                settings.scheme = btn.dataset.scheme;
                document.querySelectorAll('.color-scheme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        function updateModeButtons() {
            document.querySelectorAll('.mode-btn').forEach(btn => {
                if (btn.dataset.mode === settings.mode) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        init();
    </script>
</body>
</html>
