<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow - 学习专注助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            color: white;
            padding: 40px 0 30px;
        }

        header h1 {
            font-size: 2.8em;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 1.1em;
        }

        .icon-timer {
            background: #fee;
            color: #e53e3e;
        }

        .icon-task {
            background: #e6fffa;
            color: #38b2ac;
        }

        /* Timer Styles */
        .timer-display {
            text-align: center;
            padding: 30px 0;
        }

        .timer-circle {
            width: 200px;
            height: 200px;
            margin: 0 auto 24px;
            position: relative;
        }

        .timer-circle svg {
            transform: rotate(-90deg);
        }

        .timer-circle .bg {
            fill: none;
            stroke: #e2e8f0;
            stroke-width: 8;
        }

        .timer-circle .progress {
            fill: none;
            stroke: #667eea;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 565;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3em;
            font-weight: 700;
            color: #2d3748;
            font-variant-numeric: tabular-nums;
        }

        .timer-label {
            text-align: center;
            color: #718096;
            margin-bottom: 20px;
            font-size: 0.95em;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #edf2f7;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .timer-modes {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 8px 16px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            color: #718096;
            transition: all 0.2s;
            font-family: inherit;
        }

        .mode-btn.active {
            border-color: #667eea;
            color: #667eea;
            background: #f7fafc;
        }

        /* Task Styles */
        .task-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .task-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1em;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .task-input:focus {
            border-color: #667eea;
        }

        .task-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: #f7fafc;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .task-item:hover {
            background: #edf2f7;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #a0aec0;
        }

        .task-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid #cbd5e0;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .task-checkbox:hover {
            border-color: #667eea;
        }

        .task-checkbox.checked {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        .task-text {
            flex: 1;
            font-size: 0.95em;
        }

        .task-delete {
            background: none;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            font-size: 1.2em;
            padding: 4px;
            transition: color 0.2s;
        }

        .task-delete:hover {
            color: #e53e3e;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #a0aec0;
        }

        /* Stats Styles */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .stat-value {
            font-size: 2.2em;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 6px;
        }

        .stat-label {
            color: #718096;
            font-size: 0.9em;
        }

        footer {
            text-align: center;
            color: white;
            padding: 30px 0;
            opacity: 0.8;
            font-size: 0.9em;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
            font-weight: 500;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            border-left: 4px solid #48bb78;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>FocusFlow</h1>
            <p>让每一次专注都有价值</p>
        </header>

        <div class="main-grid">
            <div class="card">
                <div class="card-title">
                    <span class="icon icon-timer">⏱️</span>
                    专注计时器
                </div>
                <div class="timer-modes">
                    <button class="mode-btn active" data-time="25">专注 25分</button>
                    <button class="mode-btn" data-time="45">深度 45分</button>
                    <button class="mode-btn" data-time="5">休息 5分</button>
                </div>
                <div class="timer-display">
                    <div class="timer-circle">
                        <svg width="200" height="200" viewBox="0 0 200 200">
                            <circle class="bg" cx="100" cy="100" r="90"></circle>
                            <circle class="progress" id="progressCircle" cx="100" cy="100" r="90"></circle>
                        </svg>
                        <div class="timer-text" id="timerText">25:00</div>
                    </div>
                    <div class="timer-label" id="timerLabel">准备好开始专注了吗？</div>
                    <div class="timer-controls">
                        <button class="btn btn-primary" id="startBtn">开始专注</button>
                        <button class="btn btn-secondary" id="resetBtn">重置</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <span class="icon icon-task">📝</span>
                    今日任务
                </div>
                <div class="task-input-group">
                    <input type="text" class="task-input" id="taskInput" placeholder="输入任务，按回车添加...">
                    <button class="btn btn-primary" id="addTaskBtn" style="padding: 12px 20px;">添加</button>
                </div>
                <div class="task-list" id="taskList">
                    <div class="empty-state">
                        暂无任务，添加一个开始行动吧 ✨
                    </div>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="statFocus">0</div>
                <div class="stat-label">今日专注(分钟)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statTasks">0</div>
                <div class="stat-label">完成任务数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statSessions">0</div>
                <div class="stat-label">专注次数</div>
            </div>
        </div>

        <footer>
            <p>FocusFlow - 用 TRAE 打造的轻量学习助手</p>
        </footer>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // Timer Logic
        let timerInterval = null;
        let totalSeconds = 25 * 60;
        let remainingSeconds = totalSeconds;
        let isRunning = false;
        let currentMode = 25;

        const timerText = document.getElementById('timerText');
        const progressCircle = document.getElementById('progressCircle');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const timerLabel = document.getElementById('timerLabel');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const circumference = 2 * Math.PI * 90;

        progressCircle.style.strokeDasharray = circumference;

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            timerText.textContent = formatTime(remainingSeconds);
            const offset = circumference - (remainingSeconds / totalSeconds) * circumference;
            progressCircle.style.strokeDashoffset = offset;
        }

        function startTimer() {
            if (isRunning) {
                pauseTimer();
                return;
            }
            isRunning = true;
            startBtn.textContent = '暂停';
            timerLabel.textContent = '专注中... 保持心流状态！';
            
            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateDisplay();
                
                if (remainingSeconds <= 0) {
                    completeTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            startBtn.textContent = '继续';
            timerLabel.textContent = '已暂停';
        }

        function resetTimer() {
            pauseTimer();
            remainingSeconds = totalSeconds;
            startBtn.textContent = '开始专注';
            timerLabel.textContent = '准备好开始专注了吗？';
            updateDisplay();
        }

        function completeTimer() {
            pauseTimer();
            showNotification('🎉 专注时间结束！休息一下吧');
            timerLabel.textContent = '本轮专注完成！';
            startBtn.textContent = '开始专注';
            
            // Update stats
            if (currentMode >= 25) {
                const focusMinutes = parseInt(document.getElementById('statFocus').textContent);
                document.getElementById('statFocus').textContent = focusMinutes + currentMode;
                
                const sessions = parseInt(document.getElementById('statSessions').textContent);
                document.getElementById('statSessions').textContent = sessions + 1;
            }
            
            remainingSeconds = totalSeconds;
            updateDisplay();
        }

        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = parseInt(btn.dataset.time);
                totalSeconds = currentMode * 60;
                resetTimer();
            });
        });

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        // Task Logic
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskList = document.getElementById('taskList');
        let tasks = [];

        function renderTasks() {
            if (tasks.length === 0) {
                taskList.innerHTML = '<div class="empty-state">暂无任务，添加一个开始行动吧 ✨</div>';
                return;
            }
            
            taskList.innerHTML = tasks.map((task, index) => `
                <div class="task-item ${task.completed ? 'completed' : ''}">
                    <div class="task-checkbox ${task.completed ? 'checked' : ''}" onclick="toggleTask(${index})">
                        ${task.completed ? '✓' : ''}
                    </div>
                    <span class="task-text">${escapeHtml(task.text)}</span>
                    <button class="task-delete" onclick="deleteTask(${index})">×</button>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (!text) return;
            
            tasks.push({ text, completed: false });
            taskInput.value = '';
            renderTasks();
        }

        window.toggleTask = function(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
            
            if (tasks[index].completed) {
                const completedCount = tasks.filter(t => t.completed).length;
                document.getElementById('statTasks').textContent = completedCount;
                showNotification('✅ 任务完成！继续保持');
            }
        };

        window.deleteTask = function(index) {
            tasks.splice(index, 1);
            renderTasks();
            const completedCount = tasks.filter(t => t.completed).length;
            document.getElementById('statTasks').textContent = completedCount;
        };

        addTaskBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // Notification
        function showNotification(message) {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.classList.add('show', 'success');
            setTimeout(() => {
                notif.classList.remove('show');
            }, 3000);
        }

        // Initialize
        updateDisplay();
    </script>
</body>
</html>
