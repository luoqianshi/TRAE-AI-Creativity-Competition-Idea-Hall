<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>话术小灯</title>
  <style>
    :root {
      --bg-primary: #FFFFFF;
      --bg-card: #FFFFFF;
      --text-primary: #333333;
      --text-secondary: #666666;
      --accent: #FFECB3;
      --accent-light: #FFF8E1;
      --border: #E0E0E0;
      --shadow: 0 2px 12px rgba(0,0,0,0.05);
      --transition: all 0.25s ease;
    }

    .dark-mode {
      --bg-primary: #2E3A45;
      --bg-card: #3A4A5A;
      --text-primary: #F5F5F5;
      --text-secondary: #B0BEC5;
      --accent: #FFD54F;
      --accent-light: #FFECB3;
      --border: #4A5A6A;
      --shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      color: var(--text-primary);
      background-color: var(--bg-primary);
      transition: var(--transition);
      padding: 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 16px;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #FFD54F, #FFECB3);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: var(--text-primary);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: var(--transition);
      z-index: 10;
      outline: none;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      background: var(--accent-light);
    }

    .theme-toggle.dark {
      background: #FFD54F;
      color: #2E3A45;
    }

    .input-section {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 32px;
      border: 1px solid var(--border);
    }

    .input-label {
      display: block;
      margin-bottom: 12px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .input-area {
      width: 100%;
      min-height: 120px;
      padding: 16px;
      font-size: 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-primary);
      color: var(--text-primary);
      resize: vertical;
      transition: var(--transition);
      font-family: inherit;
    }

    .input-area:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 236, 179, 0.3);
    }

    .generate-btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: var(--accent);
      color: var(--text-primary);
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 2px 6px rgba(255, 236, 179, 0.4);
    }

    .generate-btn:hover:not(:disabled) {
      background: #FFD54F;
      transform: translateY(-1px);
    }

    .generate-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .result-section {
      display: none;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-title::before {
      content: "💡";
      font-size: 1.3rem;
    }

    .suggestion-list {
      display: grid;
      gap: 16px;
    }

    .suggestion-card {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .suggestion-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .suggestion-text {
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .hint-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.9rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: var(--transition);
      margin-top: 4px;
    }

    .hint-toggle:hover:not(:disabled) {
      background: rgba(255, 221, 79, 0.15);
    }

    .hint-content {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      font-size: 0.9rem;
      color: var(--text-secondary);
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out, padding-top 0.3s ease-out;
    }

    .hint-content.show {
      max-height: 200px;
      padding-top: 12px;
    }

    .example-section {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .example-title {
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .example-btn {
      padding: 6px 12px;
      background: var(--accent-light);
      color: var(--text-primary);
      border-radius: 20px;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .example-btn:hover:not(:disabled) {
      background: var(--accent);
      transform: scale(1.03);
    }

    footer {
      text-align: center;
      margin-top: 48px;
      padding: 20px;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      margin-bottom: 16px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .input-section,
      .suggestion-card {
        padding: 20px 16px;
      }
      .input-area {
        min-height: 100px;
      }
      .theme-toggle {
        width: 42px;
        height: 42px;
        font-size: 18px;
      }
    }

    @media (max-width: 420px) {
      .suggestion-text {
        font-size: 1rem;
      }
      .hint-content {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <button id="themeToggle" class="theme-toggle">☀️</button>

  <div class="container">
    <header>
      <h1>话术小灯</h1>
      <p class="subtitle">输入一句您刚想脱口而出的话，立刻获得3条孩子听得进的表达建议</p>
    </header>

    <section class="input-section">
      <label class="input-label" for="userInput">您想对孩子说的话（例如：“这么简单都不会？”）：</label>
      <textarea id="userInput" class="input-area" placeholder="试试输入：‘你别闹了’、‘必须去上学’、‘今天是不是又没考好？’……"></textarea>
      <button id="generateBtn" class="generate-btn">点亮话术 →</button>
    </section>

    <section id="resultSection" class="result-section">
      <h2 class="result-title">为您点亮的三句话</h2>
      <div class="suggestion-list" id="suggestionList">
        <!-- populated by JS -->
      </div>
    </section>

    <section class="example-section">
      <h3 class="example-title">试试这些常见场景：</h3>
      <div class="examples">
        <button class="example-btn" data-input="这么简单都不会？">这么简单都不会？</button>
        <button class="example-btn" data-input="必须去上学！">必须去上学！</button>
        <button class="example-btn" data-input="今天是不是又没考好？">今天是不是又没考好？</button>
        <button class="example-btn" data-input="你别闹了！">你别闹了！</button>
        <button class="example-btn" data-input="快点写完！">快点写完！</button>
      </div>
    </section>

    <footer>
      <p>专为小学三年级至初中二年级家长设计｜轻量、即时、不打扰真实对话</p>
    </footer>
  </div>

  <script>
    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      body.classList.add('dark-mode');
      themeToggle.innerHTML = '🌙';
      themeToggle.classList.add('dark');
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      if (body.classList.contains('dark-mode')) {
        themeToggle.innerHTML = '🌙';
        themeToggle.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      } else {
        themeToggle.innerHTML = '☀️';
        themeToggle.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      }
    });

    // Example buttons
    const exampleBtns = document.querySelectorAll('.example-btn');
    exampleBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById('userInput');
        input.value = btn.getAttribute('data-input');
        input.focus();
        generateSuggestions();
      });
    });

    // Generate suggestions
    const generateBtn = document.getElementById('generateBtn');
    const userInput = document.getElementById('userInput');
    const resultSection = document.getElementById('resultSection');
    const suggestionList = document.getElementById('suggestionList');

    function generateSuggestions() {
      const text = userInput.value.trim();
      if (!text) return;

      // Simulated AI output — lightweight, realistic, age-tuned
      const responses = [
        {
          text: "我看到你刚才把卷子揉成一团，是不是这道题让你特别着急？",
          hint: "先描述行为+命名情绪，让孩子感到被看见，比直接问‘怎么了’更安全"
        },
        {
          text: "咱们一起看看错在哪？你可以选一道最想搞懂的题，我陪你慢慢理。",
          hint: "把‘必须做’变成‘一起选’，给孩子有限选择权，降低对抗感"
        },
        {
          text: "你愿意告诉我，刚才心里最卡住的那个地方是什么吗？",
          hint: "用‘最卡住的地方’替代‘为什么不会’，把问题从能力审判转向情绪入口"
        }
      ];

      // Clear and populate
      suggestionList.innerHTML = '';
      responses.forEach((item, i) => {
        const card = document.createElement('div');
        card.className = 'suggestion-card';
        card.innerHTML = `
          <div class="suggestion-text">${item.text}</div>
          <button class="hint-toggle" data-index="${i}">
            <span>💡</span> 点击查看小贴士
          </button>
          <div class="hint-content">
            ${item.hint}
          </div>
        `;
        suggestionList.appendChild(card);
      });

      // Add toggle listeners
      document.querySelectorAll('.hint-toggle').forEach(btn => {
        btn.addEventListener('click', function() {
          const content = this.nextElementSibling;
          content.classList.toggle('show');
          this.innerHTML = content.classList.contains('show') 
            ? '<span>👇</span> 收起提示' 
            : '<span>💡</span> 点击查看小贴士';
        });
      });

      resultSection.style.display = 'block';
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    generateBtn.addEventListener('click', generateSuggestions);
    userInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        generateSuggestions();
      }
    });

    // Initial focus
    userInput.focus();
  </script>
</body>
</html>
