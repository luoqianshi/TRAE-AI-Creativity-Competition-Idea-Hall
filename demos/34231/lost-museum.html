<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>遗失的博物馆 | The Lost Museum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink-black: #0D0D0D;
      --ink-deep: #1A1A1A;
      --bronze-gold: #B8860B;
      --bronze-light: #D4A84B;
      --celadon: #88B04B;
      --cinnabar: #E74C3C;
      --paper-white: #F5F5DC;
      --text-light: #E8E8E8;
      --text-muted: #888888;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--ink-black);
      color: var(--text-light);
      min-height: 100vh;
      overflow: hidden;
    }

    .game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* Particle Canvas */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Page Base */
    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      z-index: 10;
    }

    .page.active {
      opacity: 1;
      visibility: visible;
    }

    /* Start Page */
    .start-page {
      background: radial-gradient(ellipse at center, var(--ink-deep) 0%, var(--ink-black) 70%);
    }

    .title-container {
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .subtitle {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 8px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeInUp 1s ease 0.5s forwards;
    }

    .main-title {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(48px, 8vw, 80px);
      font-weight: 700;
      color: var(--paper-white);
      text-shadow: 0 0 60px rgba(184, 134, 11, 0.3);
      opacity: 0;
      animation: titleReveal 1.5s ease 0.8s forwards;
      margin-bottom: 8px;
    }

    .main-title-en {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(16px, 2vw, 20px);
      font-weight: 400;
      color: var(--bronze-gold);
      letter-spacing: 6px;
      opacity: 0;
      animation: fadeInUp 1s ease 1.5s forwards;
    }

    .story-text {
      max-width: 500px;
      margin: 40px auto 0;
      font-size: 15px;
      line-height: 1.9;
      color: var(--text-muted);
      opacity: 0;
      animation: fadeInUp 1s ease 2s forwards;
    }

    .story-text strong {
      color: var(--cinnabar);
      font-weight: 500;
    }

    .start-btn {
      margin-top: 50px;
      padding: 18px 60px;
      font-family: 'Noto Serif SC', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--ink-black);
      background: linear-gradient(135deg, var(--bronze-gold) 0%, var(--bronze-light) 100%);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: fadeInUp 1s ease 2.5s forwards;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(184, 134, 11, 0.4);
    }

    .start-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s ease;
    }

    .start-btn:hover::before {
      left: 100%;
    }

    /* Level Select Page */
    .level-page {
      background: radial-gradient(ellipse at center, var(--ink-deep) 0%, var(--ink-black) 70%);
      padding: 40px 20px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 60px;
    }

    .page-title {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 600;
      color: var(--paper-white);
      margin-bottom: 8px;
    }

    .page-desc {
      font-size: 14px;
      color: var(--text-muted);
    }

    .levels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 30px;
      max-width: 900px;
      width: 100%;
      padding: 0 20px;
    }

    .level-card {
      background: linear-gradient(145deg, rgba(30,30,30,0.8), rgba(20,20,20,0.9));
      border: 1px solid rgba(184, 134, 11, 0.2);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .level-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--bronze-gold), var(--celadon));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .level-card:hover {
      transform: translateY(-5px);
      border-color: rgba(184, 134, 11, 0.5);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .level-card:hover::before {
      opacity: 1;
    }

    .level-card.locked {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .level-card.locked:hover {
      transform: none;
      border-color: rgba(184, 134, 11, 0.2);
      box-shadow: none;
    }

    .level-number {
      font-family: 'Noto Serif SC', serif;
      font-size: 48px;
      font-weight: 700;
      color: var(--bronze-gold);
      line-height: 1;
      margin-bottom: 15px;
    }

    .level-card.locked .level-number {
      color: var(--text-muted);
    }

    .level-name {
      font-family: 'Noto Serif SC', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--paper-white);
      margin-bottom: 8px;
    }

    .level-status {
      font-size: 12px;
      color: var(--text-muted);
    }

    .level-card.locked .level-status::before {
      content: '🔒 ';
    }

    .back-btn {
      position: absolute;
      top: 30px;
      left: 30px;
      padding: 10px 20px;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 14px;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 20;
    }

    .back-btn:hover {
      color: var(--paper-white);
      border-color: rgba(184, 134, 11, 0.5);
    }

    /* Puzzle Page */
    .puzzle-page {
      background: var(--ink-black);
      padding: 20px;
    }

    .puzzle-header {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 0 10px;
    }

    .puzzle-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--paper-white);
    }

    .hints-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hints-label {
      font-size: 14px;
      color: var(--text-muted);
    }

    .hint-dots {
      display: flex;
      gap: 6px;
    }

    .hint-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--bronze-gold);
      transition: all 0.3s ease;
    }

    .hint-dot.used {
      background: rgba(255,255,255,0.1);
    }

    .puzzle-area {
      display: flex;
      gap: 60px;
      max-width: 1000px;
      width: 100%;
      align-items: flex-start;
      justify-content: center;
    }

    .patterns-zone, .names-zone {
      flex: 1;
      max-width: 400px;
    }

    .zone-label {
      font-family: 'Noto Serif SC', serif;
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .patterns-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .pattern-item {
      aspect-ratio: 1;
      background: linear-gradient(145deg, rgba(40,40,40,0.6), rgba(20,20,20,0.8));
      border: 2px solid rgba(184, 134, 11, 0.3);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .pattern-item:active {
      cursor: grabbing;
    }

    .pattern-item.dragging {
      opacity: 0.5;
      transform: scale(0.95);
    }

    .pattern-item.placed {
      opacity: 0.3;
      pointer-events: none;
    }

    .pattern-item svg {
      width: 80%;
      height: 80%;
    }

    .names-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .name-slot {
      padding: 20px;
      background: linear-gradient(145deg, rgba(30,30,30,0.6), rgba(15,15,15,0.8));
      border: 2px dashed rgba(184, 134, 11, 0.3);
      border-radius: 10px;
      text-align: center;
      font-family: 'Noto Serif SC', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.3s ease;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .name-slot.drag-over {
      border-color: var(--bronze-gold);
      background: rgba(184, 134, 11, 0.1);
      color: var(--paper-white);
    }

    .name-slot.correct {
      border-style: solid;
      border-color: var(--celadon);
      background: rgba(136, 176, 75, 0.1);
      color: var(--celadon);
    }

    .name-slot.wrong {
      animation: shake 0.5s ease;
    }

    .slot-pattern {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .slot-pattern svg {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .slot-pattern span {
      font-family: 'Noto Serif SC', serif;
      font-size: 16px;
      font-weight: 600;
    }

    /* Success Page */
    .success-page {
      background: radial-gradient(ellipse at center, rgba(184, 134, 11, 0.1) 0%, var(--ink-black) 70%);
      text-align: center;
      padding: 40px 20px;
    }

    .success-title {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 700;
      color: var(--bronze-gold);
      margin-bottom: 20px;
      opacity: 0;
      animation: successPulse 2s ease forwards;
    }

    .success-artifact {
      width: 300px;
      height: 300px;
      margin: 40px auto;
      position: relative;
    }

    .success-artifact svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 30px rgba(184, 134, 11, 0.5));
    }

    .success-desc {
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      background: rgba(30,30,30,0.6);
      border: 1px solid rgba(184, 134, 11, 0.2);
      border-radius: 12px;
    }

    .success-desc h3 {
      font-family: 'Noto Serif SC', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--paper-white);
      margin-bottom: 15px;
    }

    .success-desc p {
      font-size: 15px;
      line-height: 1.8;
      color: var(--text-muted);
    }

    .success-btns {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 40px;
      flex-wrap: wrap;
    }

    .success-btn {
      padding: 16px 40px;
      font-family: 'Noto Serif SC', serif;
      font-size: 16px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .success-btn.primary {
      color: var(--ink-black);
      background: linear-gradient(135deg, var(--bronze-gold) 0%, var(--bronze-light) 100%);
      border: none;
    }

    .success-btn.secondary {
      color: var(--paper-white);
      background: transparent;
      border: 1px solid rgba(184, 134, 11, 0.5);
    }

    .success-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(184, 134, 11, 0.3);
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes titleReveal {
      0% {
        opacity: 0;
        letter-spacing: 20px;
      }
      100% {
        opacity: 1;
        letter-spacing: 8px;
      }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    @keyframes successPulse {
      0% {
        opacity: 0;
        transform: scale(0.8);
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes glow {
      0%, 100% {
        filter: drop-shadow(0 0 20px rgba(184, 134, 11, 0.5));
      }
      50% {
        filter: drop-shadow(0 0 40px rgba(184, 134, 11, 0.8));
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .puzzle-area {
        flex-direction: column;
        gap: 40px;
        align-items: center;
      }

      .patterns-zone, .names-zone {
        max-width: 100%;
      }

      .patterns-container {
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      .puzzle-header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .success-artifact {
        width: 200px;
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <canvas id="particles"></canvas>

    <!-- Start Page -->
    <div class="page start-page active" id="startPage">
      <div class="title-container">
        <p class="subtitle">数字风暴之后 · 2035</p>
        <h1 class="main-title">遗失的博物馆</h1>
        <p class="main-title-en">THE LOST MUSEUM</p>
        <p class="story-text">
          <strong>2035年</strong>，一场数字风暴抹去了人类的文化记忆。<br>
          你是最后一位「记忆修复师」。<br>
          通过解开藏在非遗图案中的谜题，让消失的技艺重新存在。
        </p>
        <button class="start-btn" onclick="goToLevelSelect()">开始修复记忆</button>
      </div>
    </div>

    <!-- Level Select Page -->
    <div class="page level-page" id="levelPage">
      <button class="back-btn" onclick="goToStart()">← 返回</button>
      <div class="page-header">
        <h2 class="page-title">选择关卡</h2>
        <p class="page-desc">每一关都是一项等待被修复的非遗记忆</p>
      </div>
      <div class="levels-grid">
        <div class="level-card" onclick="startPuzzle(1)">
          <div class="level-number">01</div>
          <div class="level-name">青铜器纹样</div>
          <div class="level-status">商周 · 青铜文明</div>
        </div>
        <div class="level-card locked">
          <div class="level-number">02</div>
          <div class="level-name">瓷器釉色</div>
          <div class="level-status">即将解锁</div>
        </div>
        <div class="level-card locked">
          <div class="level-number">03</div>
          <div class="level-name">刺绣针法</div>
          <div class="level-status">即将解锁</div>
        </div>
      </div>
    </div>

    <!-- Puzzle Page -->
    <div class="page puzzle-page" id="puzzlePage">
      <button class="back-btn" onclick="goToLevelSelect()">← 返回</button>
      <div class="puzzle-header">
        <h2 class="puzzle-title">青铜器纹样匹配</h2>
        <div class="hints-box">
          <span class="hints-label">提示次数</span>
          <div class="hint-dots">
            <div class="hint-dot" id="hint1"></div>
            <div class="hint-dot" id="hint2"></div>
            <div class="hint-dot" id="hint3"></div>
          </div>
        </div>
      </div>
      <div class="puzzle-area">
        <div class="patterns-zone">
          <div class="zone-label">拖拽纹样到正确名称</div>
          <div class="patterns-container" id="patternsContainer"></div>
        </div>
        <div class="names-zone">
          <div class="zone-label">纹样名称</div>
          <div class="names-container" id="namesContainer"></div>
        </div>
      </div>
    </div>

    <!-- Success Page -->
    <div class="page success-page" id="successPage">
      <h2 class="success-title">记忆修复成功</h2>
      <div class="success-artifact" id="successArtifact"></div>
      <div class="success-desc">
        <h3 id="artifactName">饕餮纹青铜鼎</h3>
        <p id="artifactDesc">青铜器是中华文明的标志性器物。这件青铜鼎上的饕餮纹，象征着威严与权力，是商周时期祭祀文化的重要遗存。</p>
      </div>
      <div class="success-btns">
        <button class="success-btn primary" onclick="goToLevelSelect()">返回关卡选择</button>
        <button class="success-btn secondary" onclick="goToStart()">重新开始</button>
      </div>
    </div>
  </div>

  <script>
    // Pattern SVG definitions
    const patternSVGs = {
      taotie: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 10 L80 30 L80 60 L50 90 L20 60 L20 30 Z" stroke="#B8860B" stroke-width="2" fill="none"/>
        <circle cx="35" cy="40" r="8" stroke="#B8860B" stroke-width="2"/>
        <circle cx="65" cy="40" r="8" stroke="#B8860B" stroke-width="2"/>
        <path d="M35 60 Q50 75 65 60" stroke="#B8860B" stroke-width="2" fill="none"/>
        <path d="M25 25 L35 35 M75 25 L65 35" stroke="#B8860B" stroke-width="1.5"/>
        <path d="M25 75 L35 65 M75 75 L65 65" stroke="#B8860B" stroke-width="1.5"/>
      </svg>`,
      kui: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 80 Q50 20 80 80" stroke="#B8860B" stroke-width="2.5" fill="none"/>
        <path d="M30 50 Q50 30 70 50" stroke="#B8860B" stroke-width="2" fill="none"/>
        <circle cx="50" cy="35" r="6" stroke="#B8860B" stroke-width="2"/>
        <path d="M40 65 L50 80 L60 65" stroke="#B8860B" stroke-width="2" fill="none"/>
        <path d="M25 75 L35 70 M75 75 L65 70" stroke="#B8860B" stroke-width="1.5"/>
      </svg>`,
      yunlei: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 50 Q25 30 40 50 Q55 70 70 50 Q85 30 100 50" stroke="#B8860B" stroke-width="2" fill="none"/>
        <path d="M10 30 Q25 50 40 30 Q55 10 70 30 Q85 50 100 30" stroke="#B8860B" stroke-width="1.5" fill="none" opacity="0.7"/>
        <path d="M10 70 Q25 50 40 70 Q55 90 70 70 Q85 50 100 70" stroke="#B8860B" stroke-width="1.5" fill="none" opacity="0.7"/>
        <circle cx="25" cy="50" r="3" fill="#B8860B" opacity="0.5"/>
        <circle cx="50" cy="50" r="3" fill="#B8860B" opacity="0.5"/>
        <circle cx="75" cy="50" r="3" fill="#B8860B" opacity="0.5"/>
      </svg>`,
      fengniao: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 20 L50 50 L30 80" stroke="#B8860B" stroke-width="2" fill="none"/>
        <path d="M50 50 L70 80" stroke="#B8860B" stroke-width="2" fill="none"/>
        <circle cx="50" cy="30" r="10" stroke="#B8860B" stroke-width="2"/>
        <path d="M40 30 L35 25 M60 30 L65 25" stroke="#B8860B" stroke-width="1.5"/>
        <path d="M30 80 Q20 70 25 60 Q35 55 30 80" stroke="#B8860B" stroke-width="1.5" fill="none"/>
        <path d="M70 80 Q80 70 75 60 Q65 55 70 80" stroke="#B8860B" stroke-width="1.5" fill="none"/>
        <path d="M45 35 L55 35 M45 38 L55 38" stroke="#B8860B" stroke-width="1"/>
      </svg>`
    };

    // Pattern data
    const patterns = [
      { id: 'taotie', name: '饕餮纹', correctName: 'taotie' },
      { id: 'kui', name: '夔纹', correctName: 'kui' },
      { id: 'yunlei', name: '云雷纹', correctName: 'yunlei' },
      { id: 'fengniao', name: '凤鸟纹', correctName: 'fengniao' }
    ];

    // Game state
    let gameState = {
      currentPage: 'start',
      hintsRemaining: 3,
      placedPatterns: [],
      draggedPattern: null
    };

    // Particle system
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initParticles() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      particles = [];
      for (let i = 0; i < 50; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2 + 0.5,
          speedX: (Math.random() - 0.5) * 0.3,
          speedY: (Math.random() - 0.5) * 0.3,
          opacity: Math.random() * 0.5 + 0.1
        });
      }
      animateParticles();
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(184, 134, 11, ${p.opacity})`;
        ctx.fill();
      });
      requestAnimationFrame(animateParticles);
    }

    window.addEventListener('resize', initParticles);

    // Page navigation
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      gameState.currentPage = pageId;
    }

    function goToStart() {
      showPage('startPage');
    }

    function goToLevelSelect() {
      showPage('levelPage');
      // Reset puzzle state when going back
      gameState.hintsRemaining = 3;
      gameState.placedPatterns = [];
      updateHintDots();
    }

    function startPuzzle(level) {
      if (level !== 1) return;
      showPage('puzzlePage');
      initPuzzle();
    }

    // Puzzle initialization
    function initPuzzle() {
      const patternsContainer = document.getElementById('patternsContainer');
      const namesContainer = document.getElementById('namesContainer');

      // Shuffle patterns for display
      const shuffledPatterns = [...patterns].sort(() => Math.random() - 0.5);

      // Create pattern items
      patternsContainer.innerHTML = shuffledPatterns.map(p => `
        <div class="pattern-item"
             draggable="true"
             data-pattern="${p.id}"
             ondragstart="handleDragStart(event)"
             ondragend="handleDragEnd(event)">
          ${patternSVGs[p.id]}
        </div>
      `).join('');

      // Create name slots (in fixed order)
      const names = ['饕餮纹', '夔纹', '云雷纹', '凤鸟纹'];
      const nameKeys = ['taotie', 'kui', 'yunlei', 'fengniao'];
      namesContainer.innerHTML = names.map((name, i) => `
        <div class="name-slot"
             data-correct="${nameKeys[i]}"
             ondragover="handleDragOver(event)"
             ondragleave="handleDragLeave(event)"
             ondrop="handleDrop(event)">
          ${name}
        </div>
      `).join('');

      gameState.hintsRemaining = 3;
      gameState.placedPatterns = [];
      updateHintDots();
    }

    // Drag and drop handlers
    function handleDragStart(e) {
      e.target.classList.add('dragging');
      gameState.draggedPattern = e.target.dataset.pattern;
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
      gameState.draggedPattern = null;
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(e) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');

      const pattern = gameState.draggedPattern;
      const correctPattern = e.currentTarget.dataset.correct;

      if (gameState.placedPatterns.includes(pattern)) return;

      if (pattern === correctPattern) {
        // Correct match
        e.currentTarget.classList.add('correct');
        e.currentTarget.innerHTML = `
          <div class="slot-pattern">
            ${patternSVGs[pattern]}
            <span>${patterns.find(p => p.id === pattern).name}</span>
          </div>
        `;

        // Mark pattern as placed
        document.querySelector(`[data-pattern="${pattern}"]`).classList.add('placed');
        gameState.placedPatterns.push(pattern);

        // Check win condition
        if (gameState.placedPatterns.length === 4) {
          setTimeout(showSuccess, 800);
        }
      } else {
        // Wrong match
        e.currentTarget.classList.add('wrong');
        setTimeout(() => e.currentTarget.classList.remove('wrong'), 500);
      }
    }

    // Hint system
    function useHint() {
      if (gameState.hintsRemaining <= 0) return;

      // Find first unmatched pattern
      const unmatchedPattern = patterns.find(p => !gameState.placedPatterns.includes(p.id));
      if (!unmatchedPattern) return;

      // Find correct slot
      const slots = document.querySelectorAll('.name-slot:not(.correct)');
      for (let slot of slots) {
        if (slot.dataset.correct === unmatchedPattern.id) {
          // Highlight the correct slot briefly
          slot.style.borderColor = 'var(--cinnabar)';
          slot.style.background = 'rgba(231, 76, 60, 0.1)';
          setTimeout(() => {
            slot.style.borderColor = '';
            slot.style.background = '';
          }, 1500);
          break;
        }
      }

      gameState.hintsRemaining--;
      updateHintDots();
    }

    function updateHintDots() {
      for (let i = 1; i <= 3; i++) {
        const dot = document.getElementById(`hint${i}`);
        if (i > gameState.hintsRemaining) {
          dot.classList.add('used');
        } else {
          dot.classList.remove('used');
        }
      }
    }

    // Click to use hint (alternative to drag)
    document.addEventListener('click', (e) => {
      if (gameState.currentPage === 'puzzlePage' &&
          e.target.closest('.name-slot:not(.correct)')) {
        // Small chance to trigger hint on click in empty area
        if (gameState.hintsRemaining > 0 && Math.random() < 0.3) {
          useHint();
        }
      }
    });

    // Success page
    function showSuccess() {
      showPage('successPage');

      // Create combined artifact SVG
      const artifactSvg = `
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" style="animation: glow 2s ease-in-out infinite;">
          <rect x="40" y="120" width="120" height="60" rx="5" stroke="#B8860B" stroke-width="3" fill="none"/>
          <rect x="50" y="130" width="100" height="40" stroke="#B8860B" stroke-width="2" fill="none" opacity="0.5"/>
          ${patternSVGs.taotie.replace('<svg', '<svg style="position:absolute;left:60px;top:135px;width:80px;height:80px;"')}
        </svg>
      `;
      document.getElementById('successArtifact').innerHTML = artifactSvg;
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      initParticles();
    });
  </script>
</body>
</html>
