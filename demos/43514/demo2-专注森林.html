<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI专注森林 - Focus Forest</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  background: linear-gradient(180deg, #0d1b2a 0%, #1b4332 50%, #2d6a4f 100%);
  color: #fff;
}
.container { max-width: 960px; margin: 0 auto; padding: 20px; }

header { text-align: center; padding: 30px 20px; }
header h1 {
  font-size: 2.3rem;
  background: linear-gradient(135deg, #95d5b2 0%, #52b788 50%, #2d6a4f 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
header p { opacity: 0.7; font-size: 1rem; }

/* 森林画布 */
.forest-container {
  position: relative;
  width: 100%;
  height: 320px;
  border-radius: 24px;
  overflow: hidden;
  margin-bottom: 24px;
  background: linear-gradient(180deg, #87CEEB 0%, #b7e4c7 60%, #52b788 100%);
  box-shadow: 0 16px 48px rgba(0,0,0,0.25);
}
#forestCanvas {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
}

/* 地面 */
.ground {
  position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
  background: linear-gradient(to top, #40916c, #52b788);
  border-top: 3px solid rgba(255,255,255,0.15);
}

/* 树木 */
.tree {
  position: absolute; bottom: 70px;
  animation: treeGrow 1s ease-out forwards;
  transform-origin: bottom center;
}
@keyframes treeGrow {
  from { transform: scaleY(0); opacity: 0; }
  to { transform: scaleY(1); opacity: 1; }
}
.tree-trunk {
  width: 12px; height: 35px; background: linear-gradient(90deg, #5c4033, #8B4513, #5c4033);
  border-radius: 3px; margin: 0 auto;
}
.tree-crown {
  width: 0; height: 0;
  border-left: 32px solid transparent;
  border-right: 32px solid transparent;
  border-bottom: 70px solid;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
}
/* 枯萎的树 */
.tree.withered .tree-crown { border-bottom-color: #8B7355 !important; }
.tree.withered .tree-trunk { background: linear-gradient(90deg, #4a3728, #6b4423); }
.tree.withered { animation: witherShake 0.5s ease-in-out; }
@keyframes witherShake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-5deg)} 75%{transform:rotate(5deg)} }

/* 番茄钟 */
.pomodoro-section {
  display: flex; gap: 24px; align-items: stretch; flex-wrap: wrap;
}
.timer-panel {
  flex: 1; min-width: 300px;
  background: rgba(255,255,255,0.08); border-radius: 24px; padding: 28px;
  backdrop-filter: blur(10px); text-align: center;
}
.timer-ring {
  width: 200px; height: 200px; margin: 0 auto 20px;
  position: relative;
}
.timer-ring svg { transform: rotate(-90deg); width: 200px; height: 200px; }
.timer-ring circle {
  fill: none; stroke-width: 10;
  stroke-linecap: round;
}
.timer-bg { stroke: rgba(255,255,255,0.1); }
.timer-progress { stroke: url(#timerGradient); transition: stroke-dashoffset 0.5s linear; }
.timer-time {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  font-size: 2.8rem; font-weight: bold; font-variant-numeric: tabular-nums;
}
.timer-label { font-size: 0.95rem; opacity: 0.65; margin-bottom: 18px; }

.timer-controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
  padding: 11px 26px; border: none; border-radius: 12px; font-size: 0.95rem;
  cursor: pointer; font-weight: 500; transition: all 0.3s;
  font-family: inherit;
}
.btn-primary {
  background: linear-gradient(135deg, #52b788, #2d6a4f); color: #fff;
}
.btn-primary:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(82,183,136,0.4); }
.btn-secondary {
  background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);
}
.btn-secondary:hover { background: rgba(255,255,255,0.18); }
.btn-danger {
  background: linear-gradient(135deg, #e76f51, #c1121f); color: #fff;
}
.btn-danger:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(231,111,81,0.4); }

.time-presets {
  display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap;
}
.preset-btn {
  padding: 6px 14px; border-radius: 20px; background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15); color: #fff; cursor: pointer;
  font-size: 0.85rem; transition: all 0.3s; font-family: inherit;
}
.preset-btn:hover, .preset-btn.active { background: rgba(82,183,136,0.3); border-color: #52b788; }

/* 任务面板 */
.task-panel {
  flex: 1; min-width: 280px;
  background: rgba(255,255,255,0.08); border-radius: 24px; padding: 24px;
  backdrop-filter: blur(10px);
}
.task-panel h3 { margin-bottom: 16px; font-size: 1.15rem; }
.task-input-wrap { display: flex; gap: 8px; margin-bottom: 16px; }
.task-input {
  flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06); color: #fff; outline: none; font-size: 0.95rem;
  font-family: inherit;
}
.task-input:focus { border-color: #52b788; }
.task-input::placeholder { color: rgba(255,255,255,0.4); }
.add-task-btn {
  padding: 10px 18px; border-radius: 10px; background: #52b788; border: none;
  color: #fff; cursor: pointer; font-size: 0.95rem; transition: all 0.3s;
  font-family: inherit;
}
.add-task-btn:hover { background: #40916c; }

.task-list { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.task-item {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  background: rgba(255,255,255,0.05); border-radius: 12px;
  transition: all 0.3s; animation: taskSlideIn 0.3s ease;
}
@keyframes taskSlideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
.task-item.done { opacity: 0.5; }
.task-item.done .task-name { text-decoration: line-through; }
.task-check {
  width: 22px; height: 22px; border-radius: 6px; border: 2px solid rgba(255,255,255,0.3);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.3s; flex-shrink: 0;
}
.task-check.checked { background: #52b788; border-color: #52b788; }
.task-name { flex: 1; font-size: 0.93rem; }
.task-pomodoros { font-size: 0.8rem; opacity: 0.5; white-space: nowrap; }
.task-delete {
  background: none; border: none; color: rgba(255,255,255,0.3); cursor: pointer;
  font-size: 1.1rem; padding: 0 4px; transition: color 0.3s;
}
.task-delete:hover { color: #e76f51; }

/* 统计 */
.stats-row {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-top: 24px;
}
.stat-card {
  background: rgba(255,255,255,0.06); border-radius: 16px; padding: 18px; text-align: center;
}
.stat-num { font-size: 1.8rem; font-weight: bold; color: #95d5b2; }
.stat-label { font-size: 0.82rem; opacity: 0.55; margin-top: 4px; }

/* 当前任务显示 */
.current-task-display {
  text-align: center; margin-top: 12px; padding: 10px;
  background: rgba(82,183,136,0.15); border-radius: 10px; font-size: 0.92rem;
  min-height: 42px; display: flex; align-items: center; justify-content: center;
}
.current-task-display span { opacity: 0.7; }

/* 森林信息 */
.forest-info {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; background: rgba(0,0,0,0.2); border-radius: 12px;
  margin-top: 16px; font-size: 0.9rem;
}
.forest-count { font-weight: bold; color: #95d5b2; font-size: 1.2rem; }

.empty-tasks { text-align: center; padding: 24px; opacity: 0.45; font-size: 0.92rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>专注森林</h1>
    <p>每完成一次专注，你的森林就会长出一棵新树 🌲</p>
  </header>

  <!-- 森林区域 -->
  <div class="forest-container" id="forestContainer">
    <svg id="forestCanvas" viewBox="0 0 900 320" preserveAspectRatio="xMidYMax slice"></svg>
    <div class="ground"></div>
    <div class="forest-info">
      <span>我的森林</span>
      <span class="forest-count" id="treeCount">🌳 0 棵树</span>
    </div>
  </div>

  <!-- 番茄钟 + 任务 -->
  <div class="pomodoro-section">
    <!-- 计时器 -->
    <div class="timer-panel">
      <div class="time-presets">
        <button class="preset-btn active" data-minutes="25">25分钟</button>
        <button class="preset-btn" data-minutes="15">15分钟</button>
        <button class="preset-btn" data-minutes="45">45分钟</button>
        <button class="preset-btn" data-minutes="5">5分钟</button>
      </div>

      <div class="current-task-display" id="currentTaskDisplay"><span>选择一个任务开始专注</span></div>

      <div class="timer-ring">
        <svg viewBox="0 0 200 200">
          <defs>
            <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#95d5b2"/>
              <stop offset="100%" stop-color="#2d6a4f"/>
            </linearGradient>
          </defs>
          <circle class="timer-bg" cx="100" cy="100" r="88"/>
          <circle class="timer-progress" id="timerProgress" cx="100" cy="100" r="88"
                  stroke-dasharray="553" stroke-dashoffset="0"/>
        </svg>
        <div class="timer-time" id="timerDisplay">25:00</div>
      </div>

      <div class="timer-label" id="timerLabel">准备开始专注</div>

      <div class="timer-controls">
        <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">开始专注</button>
        <button class="btn btn-secondary" onclick="resetTimer()">重置</button>
        <button class="btn btn-danger" id="giveUpBtn" onclick="giveUp()" style="display:none;">放弃</button>
      </div>
    </div>

    <!-- 任务列表 -->
    <div class="task-panel">
      <h3>今日任务</h3>
      <div class="task-input-wrap">
        <input type="text" class="task-input" id="taskInput" placeholder="添加新任务..." onkeydown="if(event.key==='Enter')addTask()">
        <button class="add-task-btn" onclick="addTask()">添加</button>
      </div>
      <div class="task-list" id="taskList">
        <div class="empty-tasks">还没有任务，添加一个吧</div>
      </div>
    </div>
  </div>

  <!-- 统计 -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="todayFocus">0</div><div class="stat-label">今日专注(次)</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="todayMinutes">0</div><div class="stat-label">今日时长(分)</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="totalTrees">0</div><div class="stat-label">累计种树</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="totalTasksDone">0</div><div class="stat-label">完成任务</div>
    </div>
  </div>
</div>

<script>
// ===== 状态 =====
const CIRCUMFERENCE = 2 * Math.PI * 88; // 553
let timerDuration = 25 * 60; // 秒
let timeRemaining = timerDuration;
let timerInterval = null;
let isRunning = false;
let currentTaskId = null;

// 树木颜色
const TREE_COLORS = [
  '#228B22', '#2E8B57', '#3CB371', '#20B2AA',
  '#006400', '#32CD32', '#66CDAA', '#8FBC8F'
];

// 数据
let trees = JSON.parse(localStorage.getItem('focusTrees') || '[]');
let tasks = JSON.parse(localStorage.getItem('focusTasks') || '[]');
let stats = JSON.parse(localStorage.getItem('focusStats') || '{"todayFocus":0,"todayMinutes":0,"totalTrees":0,"totalTasksDone":0,"lastDate":""}');

// 初始化
function init() {
  checkNewDay();
  renderTrees();
  renderTasks();
  updateStats();
  bindPresets();
  updateTimerDisplay();
}

function checkNewDay() {
  const today = new Date().toDateString();
  if (stats.lastDate !== today) {
    stats.todayFocus = 0;
    stats.todayMinutes = 0;
    stats.lastDate = today;
    saveStats();
  }
}

function bindPresets() {
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (isRunning) return;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      timerDuration = parseInt(btn.dataset.minutes) * 60;
      timeRemaining = timerDuration;
      updateTimerDisplay();
    });
  });
}

// ===== 计时器 =====
function toggleTimer() {
  if (isRunning) {
    pauseTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  isRunning = true;
  document.getElementById('startBtn').textContent = '暂停';
  document.getElementById('giveUpBtn').style.display = '';
  document.getElementById('timerLabel').textContent = '专注中...保持专注！';

  timerInterval = setInterval(() => {
    timeRemaining--;
    updateTimerDisplay();

    if (timeRemaining <= 0) {
      completePomodoro();
    }
  }, 1000);
}

function pauseTimer() {
  isRunning = false;
  clearInterval(timerInterval);
  document.getElementById('startBtn').textContent = '继续';
  document.getElementById('timerLabel').textContent = '已暂停，点击继续';
}

function resetTimer() {
  isRunning = false;
  clearInterval(timerInterval);
  timeRemaining = timerDuration;
  updateTimerDisplay();
  document.getElementById('startBtn').textContent = '开始专注';
  document.getElementById('giveUpBtn').style.display = 'none';
  document.getElementById('timerLabel').textContent = '准备开始专注';
}

function giveUp() {
  if (!confirm('确定要放弃本次专注吗？树木会枯萎哦...')) return;
  resetTimer();
  // 枯萎一棵树
  witherTree();
}

function completePomodoro() {
  clearInterval(timerInterval);
  isRunning = false;

  // 种树
  plantTree();

  // 更新统计
  stats.todayFocus++;
  stats.todayMinutes += Math.round(timerDuration / 60);
  stats.totalTrees++;
  saveStats();
  updateStats();

  // 更新任务番茄数
  if (currentTaskId) {
    const task = tasks.find(t => t.id === currentTaskId);
    if (task) task.pomodoros++;
    saveTasks();
    renderTasks();
  }

  // 重置
  timeRemaining = timerDuration;
  updateTimerDisplay();
  document.getElementById('startBtn').textContent = '开始专注';
  document.getElementById('giveUpBtn').style.display = 'none';
  document.getElementById('timerLabel').textContent = '太棒了! 完成一次专注! 🎉';

  // 播放提示
  try { new AudioContext().createOscillator(); } catch(e) {}
  alert(`🎉 恭喜完成 ${Math.round(timerDuration/60)} 分钟专注！森林里又多了一棵树！`);
}

function updateTimerDisplay() {
  const mins = Math.floor(timeRemaining / 60);
  const secs = timeRemaining % 60;
  document.getElementById('timerDisplay').textContent =
    `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;

  const progress = (timerDuration - timeRemaining) / timerDuration;
  document.getElementById('timerProgress').style.strokeDashoffset =
    CIRCUMFERENCE * (1 - progress);
}

// ===== 森林 =====
function plantTree() {
  const tree = {
    id: Date.now(),
    x: 50 + Math.random() * 800,
    color: TREE_COLORS[Math.floor(Math.random() * TREE_COLORS.length)],
    scale: 0.7 + Math.random() * 0.5,
    withered: false,
    date: new Date().toLocaleDateString('zh-CN')
  };
  trees.push(tree);
  localStorage.setItem('focusTrees', JSON.stringify(trees));
  renderTrees();
}

function witherTree() {
  if (trees.length > 0) {
    const lastTree = trees[trees.length - 1];
    lastTree.withered = true;
    lastTree.color = '#8B7355';
    localStorage.setItem('focusTrees', JSON.stringify(trees));
    renderTrees();
  }
}

function renderTrees() {
  const svg = document.getElementById('forestCanvas');
  svg.innerHTML = '';

  // 按x坐标排序，远的先画（小一点）
  const sorted = [...trees].sort((a, b) => a.x - b.x);

  sorted.forEach((tree, i) => {
    const h = 70 * tree.scale;
    const w = 32 * tree.scale;
    const trunkH = 35 * tree.scale;
    const trunkW = 12 * tree.scale;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

    // 树干
    const trunk = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    trunk.setAttribute('x', tree.x - trunkW / 2);
    trunk.setAttribute('y', 250 - trunkH);
    trunk.setAttribute('width', trunkW);
    trunk.setAttribute('height', trunkH);
    trunk.setAttribute('fill', tree.withered ? '#4a3728' : 'url(#trunkGradient)');
    trunk.setAttribute('rx', 2);

    // 树冠 (三角形)
    const crown = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    crown.setAttribute('points', `${tree.x},${250 - trunkH - h} ${tree.x - w},${250 - trunkH} ${tree.x + w},${250 - trunkH}`);
    crown.setAttribute('fill', tree.color);
    crown.setAttribute('filter', 'drop-shadow(0 4px 6px rgba(0,0,0,0.15))');

    g.appendChild(trunk);
    g.appendChild(crown);

    if (tree.withered) {
      g.style.animation = 'witherShake 0.5s ease-in-out';
    } else {
      g.style.animation = `treeGrow 0.8s ease-out ${i * 0.1}s both`;
    }

    svg.appendChild(g);
  });

  // 渐变定义
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  defs.innerHTML = `
    <linearGradient id="trunkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c4033"/>
      <stop offset="50%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#5c4033"/>
    </linearGradient>
  `;
  svg.insertBefore(defs, svg.firstChild);

  document.getElementById('treeCount').textContent = `🌳 ${trees.filter(t => !t.withered).length} 棵树`;
}

// ===== 任务 =====
function addTask() {
  const input = document.getElementById('taskInput');
  const name = input.value.trim();
  if (!name) return;

  tasks.unshift({
    id: Date.now(),
    name: name,
    done: false,
    pomodoros: 0
  });
  input.value = '';
  saveTasks();
  renderTasks();
}

function toggleTask(id) {
  const task = tasks.find(t => t.id === id);
  if (task) {
    task.done = !task.done;
    if (task.done) {
      stats.totalTasksDone++;
      saveStats();
      updateStats();
    }
    saveTasks();
    renderTasks();
  }
}

function selectTask(id) {
  currentTaskId = id;
  const task = tasks.find(t => t.id === id);
  document.getElementById('currentTaskDisplay').innerHTML =
    task ? `正在专注：<strong>${escapeHtml(task.name)}</strong>` : '<span>选择一个任务开始专注</span>';
  renderTasks();
}

function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  if (currentTaskId === id) currentTaskId = null;
  saveTasks();
  renderTasks();
  document.getElementById('currentTaskDisplay').innerHTML = '<span>选择一个任务开始专注</span>';
}

function renderTasks() {
  const list = document.getElementById('taskList');
  if (tasks.length === 0) {
    list.innerHTML = '<div class="empty-tasks">还没有任务，添加一个吧</div>';
    return;
  }

  list.innerHTML = tasks.map(t => `
    <div class="task-item ${t.done ? 'done' : ''}" style="${t.id === currentTaskId ? 'border-left: 3px solid #52b788;' : ''}">
      <div class="task-check ${t.done ? 'checked' : ''}" onclick="toggleTask(${t.id})">${t.done ? '✓' : ''}</div>
      <span class="task-name" onclick="selectTask(${t.id})" style="cursor:pointer;">${escapeHtml(t.name)}</span>
      <span class="task-pomodoros">🍅${t.pomodoros}</span>
      <button class="task-delete" onclick="deleteTask(${t.id})">×</button>
    </div>
  `).join('');
}

// ===== 存储 =====
function saveTasks() { localStorage.setItem('focusTasks', JSON.stringify(tasks)); }
function saveStats() { localStorage.setItem('focusStats', JSON.stringify(stats)); }
function updateStats() {
  document.getElementById('todayFocus').textContent = stats.todayFocus;
  document.getElementById('todayMinutes').textContent = stats.todayMinutes;
  document.getElementById('totalTrees').textContent = stats.totalTrees;
  document.getElementById('totalTasksDone').textContent = stats.totalTasksDone;
}

function escapeHtml(text) {
  const d = document.createElement('div'); d.textContent = text; return d.innerHTML;
}

init();
</script>
</body>
</html>
