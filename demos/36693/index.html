<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简黑白 - TRAE AI 创造力大赛 Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 0;
            border-bottom: 1px solid #000;
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1em;
            line-height: 1.6;
        }

        .demo-section {
            margin-bottom: 40px;
        }

        .demo-title {
            font-size: 1.2em;
            font-weight: 300;
            margin-bottom: 20px;
            padding-left: 15px;
            border-left: 2px solid #000;
        }

        .card {
            border: 1px solid #000;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            background: #f5f5f5;
            transform: translateY(-2px);
        }

        .card h3 {
            font-size: 1.1em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .card p {
            color: #666;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .interactive-area {
            background: #f9f9f9;
            padding: 30px;
            border: 1px solid #000;
            margin-top: 30px;
        }

        .interactive-area h3 {
            font-size: 1.1em;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border: 1px solid #000;
            font-size: 1em;
            outline: none;
        }

        .input-group button {
            padding: 12px 25px;
            background: #000000;
            color: #ffffff;
            border: none;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .input-group button:hover {
            background: #333;
        }

        .result-area {
            min-height: 100px;
            padding: 20px;
            border: 1px dashed #000;
            background: #fff;
        }

        .result-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 0.95em;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #000;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.5em;
            font-weight: 300;
        }

        .stat-label {
            color: #666;
            font-size: 0.85em;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px 0;
            color: #666;
            font-size: 0.85em;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .stats {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>极简黑白</h1>
            <p>TRAE AI 创造力大赛 - 生活娱乐赛道 Demo</p>
        </div>

        <div class="demo-section">
            <div class="demo-title">Demo 简介</div>
            <div class="card">
                <h3>是什么</h3>
                <p>一个极简风格的创意生成工具，帮助用户快速生成黑白风格的设计灵感和创意方案。</p>
            </div>
            <div class="card">
                <h3>面向谁</h3>
                <p>设计师、创意工作者、以及对极简风格感兴趣的人群。</p>
            </div>
            <div class="card">
                <h3>主要功能</h3>
                <p>1. 黑白风格灵感生成<br>2. 创意方案快速生成<br>3. 设计元素组合推荐</p>
            </div>
        </div>

        <div class="interactive-area">
            <h3>✨ 交互体验区</h3>
            <div class="input-group">
                <input type="text" id="inputText" placeholder="输入您的创意主题或关键词...">
                <button onclick="generateIdea()">生成创意</button>
            </div>
            <div class="result-area" id="resultArea">
                <div class="result-item">点击"生成创意"按钮，体验 TRAE AI 的创意生成能力</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">1000+</div>
                <div class="stat-label">创意生成</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">99%</div>
                <div class="stat-label">用户满意度</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">0.1s</div>
                <div class="stat-label">响应速度</div>
            </div>
        </div>

        <div class="footer">
            <p>TRAE AI 创造力大赛 Demo | 极简黑白风格</p>
            <p>使用 TRAE IDE 开发 | 生活娱乐赛道</p>
        </div>
    </div>

    <script>
        const ideas = [
            "极简黑白线条画：用单一黑色线条勾勒出无限可能的形状",
            "黑白几何组合：简约而不简单的几何图形设计",
            "极简排版艺术：黑白对比下的文字视觉冲击",
            "抽象黑白图案：通过黑白元素表达复杂情感",
            "极简插画风格：用最少的元素讲述最多的故事",
            "黑白光影对比：捕捉光影变化的极简表达",
            "简约图标设计：黑白风格的现代感图标方案",
            "极简界面布局：黑白配色的清爽界面设计"
        ];

        function generateIdea() {
            const input = document.getElementById('inputText').value.trim();
            const resultArea = document.getElementById('resultArea');
            
            if (!input) {
                resultArea.innerHTML = '<div class="result-item">请输入您的创意主题或关键词！</div>';
                return;
            }

            const randomIndex = Math.floor(Math.random() * ideas.length);
            const newIdea = ideas[randomIndex];
            
            resultArea.innerHTML = `
                <div class="result-item">🎯 您的创意主题：${input}</div>
                <div class="result-item">💡 推荐方向：${newIdea}</div>
                <div class="result-item" style="margin-top: 15px; padding: 15px; background: #f5f5f5; border: 1px dashed #000;">
                    💡 设计建议：保持黑白纯粹，注重线条质感，强调对比关系，追求简约表达
                </div>
            `;
        }

        // 为卡片添加悬停效果
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.style.background = '#f5f5f5';
            });
            
            card.addEventListener('mouseleave', () => {
                card.style.background = 'transparent';
            });
        });

        // 支持回车键生成
        document.getElementById('inputText').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                generateIdea();
            }
        });
    </script>
</body>
</html>
