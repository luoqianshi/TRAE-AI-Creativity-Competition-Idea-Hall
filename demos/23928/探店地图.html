<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探店地图 - 发现身边的美食宝藏</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-primary: #F7F3EE;
            --bg-secondary: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #6B6B6B;
            --accent: #D4A574;
            --accent-dark: #B8935F;
            --highlight: #E85D4E;
            --card-bg: #FFFFFF;
            --border: #E8E0D8;
            --shadow: rgba(0, 0, 0, 0.08);
            --map-filter: sepia(0.15) saturate(0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* 顶部导航 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(247, 243, 238, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Noto Serif SC', serif;
            font-size: 24px;
            font-weight: 900;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 24px;
            border: none;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--text-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* 主布局 */
        .main-container {
            display: flex;
            height: 100vh;
            padding-top: 68px;
        }

        /* 侧边栏 */
        .sidebar {
            width: 420px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 100;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .sidebar-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 搜索栏 */
        .search-box {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
        }

        .search-input-wrapper {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px 14px 44px;
            border: 1px solid var(--border);
            border-radius: 16px;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 14px;
            background: var(--bg-primary);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* 筛选标签 */
        .filter-tags {
            padding: 12px 24px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
        }

        .filter-tag {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .filter-tag:hover,
        .filter-tag.active {
            background: var(--text-primary);
            color: white;
            border-color: var(--text-primary);
        }

        /* 餐厅列表 */
        .restaurant-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .restaurant-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .restaurant-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px var(--shadow);
        }

        .restaurant-card.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.2);
        }

        .card-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 18px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .card-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.3;
        }

        .card-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-primary);
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            color: var(--highlight);
        }

        .card-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .card-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .card-tag {
            padding: 4px 10px;
            border-radius: 8px;
            background: var(--bg-primary);
            font-size: 12px;
            color: var(--text-secondary);
        }

        .card-blogger {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .blogger-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .blogger-name {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .blogger-badge {
            margin-left: auto;
            font-size: 12px;
            color: var(--accent-dark);
            font-weight: 500;
        }

        /* 地图区域 */
        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* 自定义地图标记 */
        .custom-marker {
            background: var(--highlight);
            border: 3px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(232, 93, 78, 0.4);
            transition: all 0.3s ease;
        }

        .custom-marker:hover {
            transform: scale(1.15);
        }

        /* 定位按钮 */
        .locate-btn {
            position: absolute;
            bottom: 32px;
            right: 32px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--text-primary);
            color: white;
            border: none;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .locate-btn:hover {
            transform: scale(1.1);
            background: var(--accent-dark);
        }

        /* 详情弹窗 */
        .detail-popup {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .detail-popup.active {
            display: flex;
        }

        .detail-content {
            background: var(--bg-secondary);
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            animation: popupIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes popupIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .detail-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 24px 24px 0 0;
        }

        .detail-body {
            padding: 28px;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .detail-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 26px;
            font-weight: 700;
        }

        .detail-rating {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 20px;
            font-weight: 700;
            color: var(--highlight);
        }

        .detail-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .detail-section {
            margin-bottom: 24px;
        }

        .detail-section-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .detail-review {
            background: var(--bg-primary);
            padding: 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .detail-blogger {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: var(--bg-primary);
            border-radius: 16px;
        }

        .detail-blogger-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        .detail-blogger-info h4 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .detail-blogger-info p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .detail-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .detail-btn {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .detail-btn-primary {
            background: var(--text-primary);
            color: white;
        }

        .detail-btn-primary:hover {
            background: var(--accent-dark);
        }

        .detail-btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .detail-btn-secondary:hover {
            background: var(--border);
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: white;
            transform: rotate(90deg);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                height: 45vh;
                border-radius: 24px 24px 0 0;
                z-index: 100;
            }

            .main-container {
                flex-direction: column;
            }

            .map-container {
                height: 55vh;
            }
        }

        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-logo {
            font-family: 'Noto Serif SC', serif;
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading-bar {
            width: 200px;
            height: 3px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }

        .loading-bar-inner {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            animation: loading 1.5s ease-in-out infinite;
        }

        @keyframes loading {
            0% { width: 0%; margin-left: 0; }
            50% { width: 100%; margin-left: 0; }
            100% { width: 0%; margin-left: 100%; }
        }

        /* 距离标签 */
        .distance-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
            z-index: 5;
        }

        /* 地图弹窗样式 */
        .leaflet-popup-content-wrapper {
            border-radius: 16px;
            padding: 0;
            overflow: hidden;
        }

        .leaflet-popup-content {
            margin: 0;
            width: 280px !important;
        }

        .popup-card {
            cursor: pointer;
        }

        .popup-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .popup-info {
            padding: 14px;
        }

        .popup-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .popup-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <!-- 加载画面 -->
    <div class="loading-overlay" id="loading">
        <div class="loading-logo">探店地图</div>
        <div class="loading-bar">
            <div class="loading-bar-inner"></div>
        </div>
    </div>

    <!-- 顶部导航 -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">📍</div>
            <span>探店地图</span>
        </div>
        <div class="nav-actions">
            <button class="btn btn-ghost">我的收藏</button>
            <button class="btn btn-primary">分享地图</button>

    <!-- 主内容区 -->
    <div class="main-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">

            </div>

            <div class="search-box">
                <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" placeholder="搜索餐厅、美食、博主...">
                </div>
            </div>

            <div class="filter-tags">
                <button class="filter-tag active">全部</button>
                <button class="filter-tag">火锅</button>
                <button class="filter-tag">日料</button>
                <button class="filter-tag">咖啡</button>
                <button class="filter-tag">甜品</button>
                <button class="filter-tag">烧烤</button>
            </div>

            <div class="restaurant-list" id="restaurantList">
                <!-- 动态生成 -->
            </div>
        </aside>

        <!-- 地图 -->
        <div class="map-container">
            <div id="map"></div>
            <button class="locate-btn" id="locateBtn" title="定位到我的位置">📍</button>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="detail-popup" id="detailPopup">
        <div class="detail-content" id="detailContent">
            <!-- 动态生成 -->
        </div>
    </div>

                tags: ["高颜值", "法式甜点", "下午茶"],

                },

            {

                tags: ["夜宵", "烤串", "啤酒"],
                blogger: {

                },
                lat: 39.9800,

            },
            {
                id: 7,
                name: "茶颜悦色",
                rating: 4.7,
                category: "茶饮",
                price: "¥22/人",
                distance: "320m",
                address: "朝阳区望京SOHO T1",
                hours: "10:00-22:00",
                image: "https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=600&h=400&fit=crop",
                tags: ["网红奶茶", "古风", "拍照"],
                blogger: {
                    name: "奶茶测评师",
                    avatar: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=100&h=100&fit=crop",
                    followers: "178万",
                    review: "终于开到北京了！幽兰拿铁必点，茶底清香，奶油顶绵密。声声乌龙也很棒，桃子香气自然清新。排队虽然长，但值得！"
                },
                lat: 39.9950,
                lng: 116.4800
            },
            {
                id: 8,
                name: "小确幸西餐",
                rating: 4.6,
                category: "西餐",
                price: "¥158/人",
                distance: "1.2km",
                address: "朝阳区国贸商城三期",
                hours: "11:30-22:00",
                image: "https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=600&h=400&fit=crop",
                tags: ["约会", "景观位", "精致"],
                blogger: {
                    name: "精致生活家",
                    avatar: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=100&h=100&fit=crop",
                    followers: "67万",
                    review: "环境优雅，国贸景观位可以看到CBD全景。惠灵顿牛排做得非常专业，酥皮金黄酥脆，牛肉五分熟刚刚好。服务细致入微，适合纪念日或商务宴请。"
                },
                lat: 39.9090,
                lng: 116.4550
            }
        ];

        let map;
        let markers = [];
        let userLocation = null;

        // 初始化地图
        function initMap() {
            // 默认位置（北京）
            const defaultLat = 39.9042;
            const defaultLng = 116.4074;

            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([defaultLat, defaultLng], 14);

            // 添加地图图层
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
            }).addTo(map);

            // 添加缩放控件到右侧
            L.control.zoom({
                position: 'bottomright'
            }).addTo(map);

            // 添加餐厅标记
            addRestaurantMarkers();

            // 尝试获取用户位置
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        map.setView([userLocation.lat, userLocation.lng], 15);
                        
                        // 添加用户位置标记
                        L.circleMarker([userLocation.lat, userLocation.lng], {
                            radius: 8,
                            fillColor: '#4A90E2',
                            color: '#fff',
                            weight: 3,
                            opacity: 1,
                            fillOpacity: 0.9
                        }).addTo(map).bindPopup('您的位置');
                    },
                    () => {
                        console.log('无法获取位置，使用默认位置');
                    }
                );
            }
        }

        // 添加餐厅标记
        function addRestaurantMarkers() {
            restaurants.forEach((restaurant, index) => {
                const marker = L.marker([restaurant.lat, restaurant.lng], {
                    icon: L.divIcon({
                        className: 'custom-marker-container',
                        html: `<div class="custom-marker">${index + 1}</div>`,
                        iconSize: [40, 40],
                        iconAnchor: [20, 20]
                    })
                }).addTo(map);

                // 点击标记显示详情
                marker.on('click', () => {
                    showRestaurantDetail(restaurant);
                    highlightCard(restaurant.id);
                });

                // 悬停显示简要信息
                marker.bindPopup(`
                    <div class="popup-card" onclick="showRestaurantDetailById(${restaurant.id})">
                        <img class="popup-image" src="${restaurant.image}" alt="${restaurant.name}">
                        <div class="popup-info">
                            <div class="popup-title">${restaurant.name}</div>
                            <div class="popup-meta">⭐ ${restaurant.rating} · ${restaurant.distance} · ${restaurant.price}</div>
                        </div>
                    </div>
                `, {
                    maxWidth: 280,
                    className: 'custom-popup'
                });

                markers.push(marker);
            });
        }

        // 渲染餐厅列表
        function renderRestaurantList() {
            const listContainer = document.getElementById('restaurantList');
            listContainer.innerHTML = restaurants.map((restaurant, index) => `
                <div class="restaurant-card" data-id="${restaurant.id}" onclick="selectRestaurant(${restaurant.id})">
                    <div style="position: relative;">
                        <img class="card-image" src="${restaurant.image}" alt="${restaurant.name}">
                        <span class="distance-badge">${restaurant.distance}</span>
                    </div>
                    <div class="card-content">
                        <div class="card-header">
                            <h3 class="card-title">${restaurant.name}</h3>
                            <div class="card-rating">⭐ ${restaurant.rating}</div>
                        </div>
                        <div class="card-meta">
                            <span>🍽️ ${restaurant.category}</span>
                            <span>💰 ${restaurant.price}</span>
                        </div>
                        <div class="card-tags">
                            ${restaurant.tags.map(tag => `<span class="card-tag">${tag}</span>`).join('')}
                        </div>
                        <div class="card-blogger">
                            <img class="blogger-avatar" src="${restaurant.blogger.avatar}" alt="${restaurant.blogger.name}">
                            <span class="blogger-name">${restaurant.blogger.name}</span>
                            <span class="blogger-badge">${restaurant.blogger.followers}粉丝</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 选择餐厅
        function selectRestaurant(id) {
            const restaurant = restaurants.find(r => r.id === id);
            if (restaurant) {
                map.setView([restaurant.lat, restaurant.lng], 16);
                highlightCard(id);
                
                // 打开对应标记的弹窗
                const markerIndex = restaurants.findIndex(r => r.id === id);
                if (markers[markerIndex]) {
                    markers[markerIndex].openPopup();
                }
            }
        }

        // 高亮卡片
        function highlightCard(id) {
            document.querySelectorAll('.restaurant-card').forEach(card => {
                card.classList.remove('active');
                if (parseInt(card.dataset.id) === id) {
                    card.classList.add('active');
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        }

        // 显示餐厅详情
        function showRestaurantDetail(restaurant) {
            const popup = document.getElementById('detailPopup');
            const content = document.getElementById('detailContent');
            
            content.innerHTML = `
                <button class="close-btn" onclick="closeDetail()">✕</button>
                <img class="detail-image" src="${restaurant.image}" alt="${restaurant.name}">
                <div class="detail-body">
                    <div class="detail-header">
                        <h2 class="detail-title">${restaurant.name}</h2>
                        <div class="detail-rating">⭐ ${restaurant.rating}</div>
                    </div>
                    <div class="detail-info">
                        <span>📍 ${restaurant.address}</span>
                        <span>🕐 ${restaurant.hours}</span>
                        <span>💰 ${restaurant.price} · ${restaurant.distance}</span>
                    </div>
                    <div class="detail-section">
                        <h3 class="detail-section-title">探店博主推荐</h3>
                        <div class="detail-review">${restaurant.blogger.review}</div>
                    </div>
                    <div class="detail-section">
                        <h3 class="detail-section-title">推荐博主</h3>
                        <div class="detail-blogger">
                            <img class="detail-blogger-avatar" src="${restaurant.blogger.avatar}" alt="${restaurant.blogger.name}">
                            <div class="detail-blogger-info">
                                <h4>${restaurant.blogger.name}</h4>
                                <p>${restaurant.blogger.followers}粉丝 · 美食探店达人</p>
                            </div>
                        </div>
                    </div>
                    <div class="detail-actions">
                        <button class="detail-btn detail-btn-primary">导航到店</button>
                        <button class="detail-btn detail-btn-secondary">收藏店铺</button>
                    </div>
                </div>
            `;
            
            popup.classList.add('active');
        }

        // 通过ID显示详情
        function showRestaurantDetailById(id) {
            const restaurant = restaurants.find(r => r.id === id);
            if (restaurant) {
                showRestaurantDetail(restaurant);
            }
        }

        // 关闭详情
        function closeDetail() {
            document.getElementById('detailPopup').classList.remove('active');
        }

        // 定位按钮
        document.getElementById('locateBtn').addEventListener('click', () => {
            if (userLocation) {
                map.setView([userLocation.lat, userLocation.lng], 15);
            } else {
                alert('正在获取您的位置...');
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            userLocation = {
                                lat: position.coords.latitude,
                                lng: position.coords.longitude
                            };
                            map.setView([userLocation.lat, userLocation.lng], 15);
                        }
                    );
                }
            }
        });

        // 筛选标签
        document.querySelectorAll('.filter-tag').forEach(tag => {
            tag.addEventListener('click', () => {
                document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
                tag.classList.add('active');
            });
        });

        // 点击弹窗外部关闭
        document.getElementById('detailPopup').addEventListener('click', (e) => {
            if (e.target.id === 'detailPopup') {
                closeDetail();
            }
        });

        // 初始化
        window.onload = () => {
            initMap();
            renderRestaurantList();
            
            // 隐藏加载画面
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 1500);
        };
    </script>
</body>
</html>
