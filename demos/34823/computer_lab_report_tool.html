<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>计算机专业实验报告生成工具</title>
  <style>
    :root {
      --bg: #eef5ff;
      --panel: rgba(255, 255, 255, 0.92);
      --line: #d6e7ff;
      --line-strong: #aacdff;
      --primary: #2f76ff;
      --primary-deep: #1757d6;
      --text: #17345f;
      --muted: #6580a8;
      --shadow: 0 18px 40px rgba(44, 105, 220, 0.12);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(110, 173, 255, 0.22), transparent 28%),
        radial-gradient(circle at bottom right, rgba(62, 135, 255, 0.16), transparent 26%),
        linear-gradient(180deg, #f6fbff 0%, #edf5ff 100%);
      min-height: 100vh;
    }

    .app {
      width: min(1400px, calc(100vw - 32px));
      margin: 20px auto;
      display: grid;
      grid-template-columns: minmax(380px, 520px) minmax(420px, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(170, 205, 255, 0.7);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      backdrop-filter: blur(8px);
    }

    .left-panel {
      padding: 22px;
      position: sticky;
      top: 16px;
    }

    .right-panel {
      padding: 0;
      overflow: hidden;
    }

    .hero {
      margin-bottom: 20px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
      color: #1048ad;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
      color: #174a9f;
    }

    .hint {
      font-weight: 400;
      color: var(--muted);
      font-size: 12px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line-strong);
      background: #fbfdff;
      border-radius: 14px;
      color: var(--text);
      padding: 12px 14px;
      outline: none;
      transition: 0.2s ease;
      font: inherit;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(47, 118, 255, 0.12);
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.7;
    }

    #codeInput {
      min-height: 240px;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 13px;
    }

    .grid-two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--primary), #5a9dff);
      color: #fff;
      box-shadow: 0 12px 26px rgba(47, 118, 255, 0.24);
    }

    .secondary-btn {
      background: #edf5ff;
      color: #215fcf;
      border: 1px solid #cfe1ff;
    }

    .ghost-btn {
      background: #fff;
      color: #3569c7;
      border: 1px dashed #b5d2ff;
    }

    .tips {
      margin-top: 18px;
      padding: 14px 16px;
      background: #f5f9ff;
      border-radius: 14px;
      border: 1px solid #dceaff;
    }

    .tips h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: #215fcf;
    }

    .tips ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.8;
      font-size: 13px;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 20px 22px;
      border-bottom: 1px solid #e0ecff;
      background: linear-gradient(180deg, rgba(247, 251, 255, 0.98), rgba(238, 246, 255, 0.92));
    }

    .preview-header h2 {
      margin: 0;
      font-size: 20px;
      color: #11479f;
    }

    .preview-header p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .preview-wrap {
      padding: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(248,252,255,0.98));
      min-height: 780px;
    }

    .report-sheet {
      background: #fff;
      border: 1px solid #dce8ff;
      border-radius: 18px;
      max-width: 960px;
      margin: 0 auto;
      padding: 28px;
      box-shadow: 0 16px 36px rgba(51, 112, 214, 0.08);
    }

    .report-title {
      text-align: center;
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 2px solid #e9f1ff;
    }

    .report-title h1 {
      margin: 0 0 10px;
      font-size: 30px;
      color: #1048ad;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .meta span {
      background: #f4f8ff;
      border: 1px solid #dfebff;
      padding: 6px 10px;
      border-radius: 999px;
    }

    .section {
      margin-bottom: 22px;
    }

    .section h3 {
      margin: 0 0 12px;
      font-size: 18px;
      color: #1757d6;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section h3::before {
      content: "";
      width: 6px;
      height: 20px;
      border-radius: 999px;
      background: linear-gradient(180deg, #3e8fff, #1d5edf);
    }

    .section p,
    .section li {
      color: #28466f;
      line-height: 1.9;
      font-size: 15px;
    }

    .section ul,
    .section ol {
      margin: 0;
      padding-left: 22px;
    }

    .sub-card {
      padding: 16px 18px;
      border-radius: 14px;
      background: linear-gradient(180deg, #fbfdff 0%, #f5f9ff 100%);
      border: 1px solid #e1edff;
      margin-bottom: 12px;
    }

    .sub-card h4 {
      margin: 0 0 10px;
      font-size: 15px;
      color: #1f5ed0;
    }

    .code-box {
      background: #0f2142;
      color: #e6f0ff;
      border-radius: 14px;
      padding: 16px;
      overflow: auto;
      border: 1px solid rgba(97, 149, 255, 0.24);
      font-family: "Consolas", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .annotation-list {
      display: grid;
      gap: 10px;
    }

    .annotation-item {
      border: 1px solid #dce9ff;
      background: #fcfdff;
      border-radius: 12px;
      padding: 12px 14px;
    }

    .annotation-item strong {
      color: #1450bb;
      display: inline-block;
      margin-bottom: 6px;
    }

    .placeholder {
      text-align: center;
      padding: 70px 24px;
      color: var(--muted);
    }

    .placeholder h3 {
      margin: 0 0 8px;
      color: #1c5dd3;
      font-size: 24px;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      padding: 12px 16px;
      background: rgba(20, 72, 173, 0.92);
      color: #fff;
      border-radius: 12px;
      box-shadow: 0 14px 24px rgba(11, 52, 129, 0.28);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: 0.25s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1060px) {
      .app {
        grid-template-columns: 1fr;
      }

      .left-panel {
        position: static;
      }
    }

    @media (max-width: 700px) {
      .app {
        width: min(100vw - 18px, 1400px);
        margin: 10px auto;
      }

      .grid-two {
        grid-template-columns: 1fr;
      }

      .preview-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .report-sheet {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="panel left-panel">
      <div class="hero">
        <h1>计算机专业实验报告生成工具</h1>
        <p>输入实验题目与代码，自动生成完整实验报告框架、代码注释说明与原理分析。右侧实时预览，支持一键复制。</p>
      </div>

      <div class="field">
        <label for="titleInput">实验题目 <span class="hint">必填</span></label>
        <input id="titleInput" type="text" placeholder="例如：基于栈的表达式求值实验" />
      </div>

      <div class="grid-two">
        <div class="field">
          <label for="courseInput">课程名称</label>
          <input id="courseInput" type="text" placeholder="例如：数据结构" />
        </div>
        <div class="field">
          <label for="authorInput">实验人</label>
          <input id="authorInput" type="text" placeholder="例如：张三" />
        </div>
      </div>

      <div class="grid-two">
        <div class="field">
          <label for="classInput">班级</label>
          <input id="classInput" type="text" placeholder="例如：计科 2201" />
        </div>
        <div class="field">
          <label for="languageSelect">代码语言</label>
          <select id="languageSelect">
            <option value="auto">自动识别</option>
            <option value="c">C</option>
            <option value="cpp">C++</option>
            <option value="java">Java</option>
            <option value="python">Python</option>
            <option value="javascript">JavaScript</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="goalInput">实验要求 / 关键点 <span class="hint">选填，帮助优化内容</span></label>
        <textarea id="goalInput" placeholder="例如：要求使用栈结构完成中缀表达式转后缀表达式，并实现结果计算。"></textarea>
      </div>

      <div class="field">
        <label for="codeInput">实验代码 <span class="hint">粘贴完整代码可生成代码说明与原理分析</span></label>
        <textarea id="codeInput" placeholder="请在这里粘贴代码，例如 Python / C / Java / C++ / JavaScript"></textarea>
      </div>

      <div class="actions">
        <button class="primary-btn" id="generateBtn">生成实验报告</button>
        <button class="secondary-btn" id="loadDemoBtn">加载示例</button>
        <button class="ghost-btn" id="clearBtn">清空内容</button>
      </div>

      <div class="tips">
        <h3>使用建议</h3>
        <ul>
          <li>先填写实验题目，再补充实验要求，可以让报告更贴合具体实验。</li>
          <li>粘贴完整代码后，系统会自动提取关键结构并生成代码逐段说明。</li>
          <li>右侧内容会实时刷新，确认无误后可直接一键复制整份报告。</li>
        </ul>
      </div>
    </section>

    <section class="panel right-panel">
      <div class="preview-header">
        <div>
          <h2>报告实时预览</h2>
          <p>自动生成实验目的、原理、步骤、结果分析、代码说明与实验总结。</p>
        </div>
        <div class="toolbar">
          <button class="secondary-btn" id="copyBtn">复制报告文本</button>
          <button class="ghost-btn" id="copyHtmlBtn">复制预览内容</button>
        </div>
      </div>
      <div class="preview-wrap">
        <div id="preview" class="report-sheet">
          <div class="placeholder">
            <h3>等待生成</h3>
            <p>在左侧输入实验题目和代码后，点击“生成实验报告”或直接实时编辑，即可在这里查看完整报告。</p>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const elements = {
      title: document.getElementById("titleInput"),
      course: document.getElementById("courseInput"),
      author: document.getElementById("authorInput"),
      className: document.getElementById("classInput"),
      language: document.getElementById("languageSelect"),
      goal: document.getElementById("goalInput"),
      code: document.getElementById("codeInput"),
      preview: document.getElementById("preview"),
      generateBtn: document.getElementById("generateBtn"),
      loadDemoBtn: document.getElementById("loadDemoBtn"),
      clearBtn: document.getElementById("clearBtn"),
      copyBtn: document.getElementById("copyBtn"),
      copyHtmlBtn: document.getElementById("copyHtmlBtn"),
      toast: document.getElementById("toast")
    };

    let currentReport = { text: "", html: "" };

    function escapeHtml(text = "") {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showToast(message) {
      elements.toast.textContent = message;
      elements.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        elements.toast.classList.remove("show");
      }, 1800);
    }

    function formatDate() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function getCodeLanguage(rawCode, selected) {
      if (selected !== "auto") return selected;
      const code = rawCode || "";
      const rules = [
        { type: "python", score: (code.match(/\bdef\b|\bimport\b|\bprint\(|if __name__ == ['"]__main__['"]/g) || []).length },
        { type: "java", score: (code.match(/\bpublic class\b|\bSystem\.out\.println\b|\bstatic void main\b/g) || []).length },
        { type: "cpp", score: (code.match(/#include\s*<iostream>|std::|cout\s*<</g) || []).length },
        { type: "c", score: (code.match(/#include\s*<stdio\.h>|printf\s*\(|scanf\s*\(/g) || []).length },
        { type: "javascript", score: (code.match(/\bfunction\b|console\.log|=>|document\./g) || []).length }
      ];
      const best = rules.sort((a, b) => b.score - a.score)[0];
      return best && best.score > 0 ? best.type : "通用程序设计";
    }

    function splitCodeLines(code) {
      return code
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean);
    }

    function inferExperimentType(title, goal, code) {
      const all = `${title} ${goal} ${code}`.toLowerCase();
      const mapping = [
        { key: /(链表|队列|栈|tree|图|排序|查找|data structure|dfs|bfs)/, text: "数据结构与算法实现" },
        { key: /(数据库|sql|mysql|oracle|查询|事务)/, text: "数据库设计与查询实现" },
        { key: /(网络|socket|tcp|udp|http|通信)/, text: "计算机网络通信实现" },
        { key: /(操作系统|进程|线程|调度|互斥|同步)/, text: "操作系统原理验证" },
        { key: /(编译|词法|语法|解释器|自动机)/, text: "编译原理与语言处理" },
        { key: /(网页|web|html|css|javascript|前端|后端|接口)/, text: "Web 程序设计与交互实现" }
      ];
      const hit = mapping.find(item => item.key.test(all));
      return hit ? hit.text : "程序设计与算法验证";
    }

    function buildPurposes(title, goal, expType) {
      const custom = goal ? `结合实验要求“${goal}”，验证所设计方案是否能够稳定完成指定任务。` : `通过实验题目“${title}”完成对相关算法或系统流程的实现与验证。`;
      return [
        `理解 ${expType} 的核心思想，并掌握从需求分析到程序实现的完整过程。`,
        `训练代码编写、调试、测试与结果分析能力，提升独立完成实验报告的规范性。`,
        custom
      ];
    }

    function buildPrinciples(title, goal, expType, language, codeFeatures) {
      const languageText = language === "通用程序设计" ? "常见程序设计语言" : language.toUpperCase ? language.toUpperCase() : language;
      const principle = [
        `${title} 属于 ${expType} 类型实验，其核心在于将抽象问题转化为可执行的程序流程，通过输入、处理、输出三个阶段完成功能闭环。`,
        `在实现过程中，程序通常会围绕数据结构组织、条件判断、循环控制、函数拆分以及异常或边界处理展开，体现软件设计中的模块化思想。`,
        `本实验采用 ${languageText} 语言完成实现，该语言能够较好地支持算法表达、流程控制与结果展示，便于观察程序执行逻辑。`
      ];
      if (goal) {
        principle.push(`结合给定要求可知，实验重点在于 ${goal}，因此设计时需要重点考虑功能正确性、步骤完整性以及结果可验证性。`);
      }
      if (codeFeatures.length) {
        principle.push(`从代码内容来看，程序涉及 ${codeFeatures.slice(0, 4).join("、")} 等关键实现环节，这些部分共同构成了实验功能实现的技术基础。`);
      }
      return principle;
    }

    function extractCodeFeatures(code) {
      const features = [];
      const tests = [
        { regex: /\bfor\b|\bwhile\b/, text: "循环结构" },
        { regex: /\bif\b|\belse\b|\bswitch\b/, text: "条件分支" },
        { regex: /\bdef\b|\bfunction\b|\bvoid\b|\bint\s+\w+\s*\(|public\s+static|class\s+\w+/, text: "函数或类封装" },
        { regex: /\barray\b|\blist\b|\bvector\b|\bstack\b|\bqueue\b|\bdict\b|\bmap\b|\bset\b|\[\]/i, text: "数据结构操作" },
        { regex: /\binput\b|\bscanf\b|\bcin\b|System\.in|prompt\(/, text: "输入处理" },
        { regex: /\bprint\b|\bprintf\b|\bcout\b|System\.out|console\.log/, text: "结果输出" },
        { regex: /\btry\b|\bcatch\b|except\b/, text: "异常处理" },
        { regex: /\breturn\b/, text: "结果返回机制" }
      ];
      tests.forEach(item => {
        if (item.regex.test(code)) features.push(item.text);
      });
      return features;
    }

    function buildSteps(title, goal, code) {
      const hasCode = code.trim().length > 0;
      const lines = splitCodeLines(code);
      const steps = [
        `分析实验题目“${title || "未命名实验"}”的功能要求，明确输入数据、处理流程与输出目标。`,
        goal ? `根据实验要求“${goal}”设计整体实现方案，并确定主要函数或模块划分。` : "根据实验目标设计程序流程图或模块划分，梳理关键处理步骤。",
        hasCode ? `完成代码编写后，对程序进行调试，重点检查变量变化、分支逻辑和边界条件处理。` : "编写程序主体代码，逐步完成输入、处理和输出模块。",
        hasCode ? `结合现有 ${lines.length} 行代码进行测试，使用样例数据验证程序运行结果的正确性。` : "使用测试数据运行程序，验证实验结果是否满足预期要求。",
        "整理实验现象、结果截图或关键输出信息，完成实验报告撰写与反思总结。"
      ];
      return steps;
    }

    function buildResultAnalysis(title, features, code) {
      const lines = splitCodeLines(code);
      const result = [
        `从实验结果来看，程序能够围绕“${title || "当前实验"}”完成预期功能，整体流程较为清晰。`,
        features.length ? `代码中体现了 ${features.join("、")} 等典型程序设计元素，说明实验实现具备较完整的逻辑结构。` : "程序结构以基本流程控制为主，适合用于验证课堂中的核心知识点。"
      ];
      if (lines.length) {
        result.push(`当前代码规模约为 ${lines.length} 行，说明实验实现已经覆盖主要功能模块。通过进一步补充异常处理和测试用例，可提升程序鲁棒性。`);
      } else {
        result.push("若后续补充完整代码与测试数据，还可以进一步细化运行结果分析与性能讨论。");
      }
      return result;
    }

    function buildSummary(title, goal, features) {
      const sentences = [
        `通过本次“${title || "实验报告生成"}”实验，我进一步理解了理论知识如何在程序实现中落地。`,
        goal ? `实验围绕“${goal}”展开，使我认识到需求分析对程序设计方向具有决定性作用。` : "实验过程中，我体会到合理划分模块、明确步骤顺序对于提升代码可读性十分重要。",
        features.length ? `在实现过程中，我重点练习了 ${features.slice(0, 3).join("、")} 等编程能力，并认识到调试与测试对结果正确性的重要性。` : "通过调试与结果验证，我认识到实验不仅要求程序能运行，还需要保证逻辑正确、表达清晰。",
        "今后在完成类似实验时，应进一步加强代码规范、边界处理与实验分析能力，使报告内容更加完整严谨。"
      ];
      return sentences;
    }

    function analyzeLine(line) {
      const value = line.trim();
      if (!value) return "";
      const rules = [
        { regex: /^(#include|import |from |using )/, desc: "导入运行所需的库或头文件，为后续功能提供基础支持。" },
        { regex: /(class\s+\w+|public class\s+\w+)/, desc: "定义类结构，用于封装数据与方法，提升程序组织性。" },
        { regex: /(def\s+\w+|function\s+\w+|void\s+\w+|int\s+\w+\s*\(|public\s+static\s+\w+\s+\w+\s*\()/, desc: "定义函数或方法，将功能拆分为独立模块，便于复用与维护。" },
        { regex: /main\s*\(|if __name__ == ['"]__main__['"]/, desc: "程序主入口，负责组织整体执行流程。" },
        { regex: /\bfor\b/, desc: "使用 `for` 循环处理重复任务，适合遍历数据或执行固定次数操作。" },
        { regex: /\bwhile\b/, desc: "使用 `while` 循环控制持续执行过程，通常与条件判断配合实现动态处理。" },
        { regex: /\bif\b|\belse\b|\belif\b|\bswitch\b|\bcase\b/, desc: "进行条件判断，根据不同情况执行对应逻辑。" },
        { regex: /(return\b)/, desc: "返回计算结果或状态值，使调用者可以继续处理输出数据。" },
        { regex: /(print\(|printf\(|cout\s*<<|System\.out\.println|console\.log)/, desc: "输出运行结果，用于展示实验处理后的数据或状态信息。" },
        { regex: /(input\(|scanf\(|cin\s*>>|System\.in|prompt\()/, desc: "接收外部输入数据，为程序处理提供原始信息。" },
        { regex: /(sort|sorted|Collections\.sort|Arrays\.sort|qsort)/, desc: "执行排序操作，用于提升数据处理的有序性和后续分析效率。" },
        { regex: /(push|pop|enqueue|dequeue|append|insert)/, desc: "进行数据结构的增删操作，体现实验中对数据组织方式的控制。" },
        { regex: /(try\b|catch\b|except\b)/, desc: "处理运行过程中可能出现的异常，提升程序稳定性。" }
      ];
      const matched = rules.find(rule => rule.regex.test(value));
      return matched ? matched.desc : "该语句用于完成当前模块中的具体处理逻辑，是整体功能实现的一部分。";
    }

    function buildAnnotatedCode(code, language) {
      const lines = code.split(/\r?\n/);
      const commentMap = {
        python: "#",
        javascript: "//",
        java: "//",
        c: "//",
        cpp: "//"
      };
      const prefix = commentMap[language] || "//";
      const result = [];
      const annotations = [];
      lines.forEach((line, index) => {
        const trimmed = line.trim();
        if (!trimmed) {
          result.push("");
          return;
        }
        const comment = analyzeLine(trimmed);
        result.push(`${prefix} 第 ${index + 1} 行说明：${comment}`);
        result.push(line);
        annotations.push({
          line: index + 1,
          code: trimmed,
          comment
        });
      });
      return { annotatedCode: result.join("\n"), annotations };
    }

    function buildCodePrinciples(language, code, annotations) {
      const lines = splitCodeLines(code);
      const languageName = language === "通用程序设计" ? "当前代码" : language.toUpperCase ? language.toUpperCase() : language;
      const blocks = [];
      if (!lines.length) {
        return [
          "当前未输入代码，因此本部分暂以实验题目为基础生成通用原理说明。",
          "补充代码后，系统会自动分析程序结构、关键语句作用以及实现思路。"
        ];
      }

      const highLevel = [
        `该程序使用 ${languageName} 实现实验功能，整体遵循“输入数据 → 逻辑处理 → 输出结果”的基本设计思路。`,
        "代码通过函数、条件分支与循环结构组织实验流程，使各处理环节能够按照既定顺序执行。"
      ];

      const annotationKeywords = annotations.map(item => item.comment).join(" ");
      if (/数据结构/.test(annotationKeywords) || /(push|pop|append|insert|stack|queue|list|map)/i.test(code)) {
        highLevel.push("在核心原理上，程序借助数据结构完成数据的存储与访问，从而保证实验中的信息处理更有条理。");
      }
      if (/条件判断/.test(annotationKeywords) || /\bif\b|\belse\b/.test(code)) {
        highLevel.push("程序通过条件判断区分不同输入或运行状态，确保算法能够在多种场景下给出对应处理结果。");
      }
      if (/\bfor\b|\bwhile\b/.test(code)) {
        highLevel.push("循环结构用于重复执行关键步骤，既减少冗余代码，也提高了批量处理数据时的效率。");
      }
      blocks.push(...highLevel);
      return blocks;
    }

    function toTextList(items, ordered = false) {
      return items.map((item, index) => `${ordered ? `${index + 1}.` : "•"} ${item}`).join("\n");
    }

    function buildReport() {
      const title = elements.title.value.trim();
      const course = elements.course.value.trim() || "计算机专业实验课程";
      const author = elements.author.value.trim() || "待填写";
      const className = elements.className.value.trim() || "待填写";
      const goal = elements.goal.value.trim();
      const code = elements.code.value.replace(/\t/g, "    ");
      const lang = getCodeLanguage(code, elements.language.value);
      const expType = inferExperimentType(title, goal, code);
      const features = extractCodeFeatures(code);
      const purposes = buildPurposes(title || "未命名实验", goal, expType);
      const principles = buildPrinciples(title || "未命名实验", goal, expType, lang, features);
      const steps = buildSteps(title || "未命名实验", goal, code);
      const resultAnalysis = buildResultAnalysis(title || "未命名实验", features, code);
      const summary = buildSummary(title || "未命名实验", goal, features);
      const annotated = buildAnnotatedCode(code, lang);
      const codePrinciples = buildCodePrinciples(lang, code, annotated.annotations);

      const reportTitle = title || "未命名实验";
      const metaInfo = [
        `课程：${course}`,
        `实验人：${author}`,
        `班级：${className}`,
        `日期：${formatDate()}`,
        `语言：${lang === "通用程序设计" ? "自动识别中" : lang.toUpperCase ? lang.toUpperCase() : lang}`
      ];

      const annotationHtml = annotated.annotations.length
        ? annotated.annotations.map(item => `
            <div class="annotation-item">
              <strong>第 ${item.line} 行</strong>
              <div>代码：<code>${escapeHtml(item.code)}</code></div>
              <div>说明：${escapeHtml(item.comment)}</div>
            </div>
          `).join("")
        : `<div class="annotation-item">暂未输入代码，补充后这里会生成逐行说明。</div>`;

      const html = `
        <div class="report-title">
          <h1>${escapeHtml(reportTitle)} 实验报告</h1>
          <div class="meta">
            ${metaInfo.map(item => `<span>${escapeHtml(item)}</span>`).join("")}
          </div>
        </div>

        <section class="section">
          <h3>一、实验目的</h3>
          <ul>${purposes.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
        </section>

        <section class="section">
          <h3>二、实验原理</h3>
          ${principles.map(item => `<p>${escapeHtml(item)}</p>`).join("")}
        </section>

        <section class="section">
          <h3>三、实验步骤</h3>
          <ol>${steps.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ol>
        </section>

        <section class="section">
          <h3>四、实验结果与分析</h3>
          ${resultAnalysis.map(item => `<p>${escapeHtml(item)}</p>`).join("")}
        </section>

        <section class="section">
          <h3>五、代码说明</h3>
          <div class="sub-card">
            <h4>带注释代码</h4>
            <div class="code-box">${escapeHtml(annotated.annotatedCode || "暂未输入代码，补充代码后将自动生成带注释版本。")}</div>
          </div>
          <div class="sub-card">
            <h4>逐段说明</h4>
            <div class="annotation-list">${annotationHtml}</div>
          </div>
        </section>

        <section class="section">
          <h3>六、代码原理分析</h3>
          ${codePrinciples.map(item => `<p>${escapeHtml(item)}</p>`).join("")}
        </section>

        <section class="section">
          <h3>七、实验总结</h3>
          ${summary.map(item => `<p>${escapeHtml(item)}</p>`).join("")}
        </section>
      `;

      const text = [
        `${reportTitle} 实验报告`,
        metaInfo.join(" | "),
        "",
        "一、实验目的",
        toTextList(purposes),
        "",
        "二、实验原理",
        principles.join("\n"),
        "",
        "三、实验步骤",
        toTextList(steps, true),
        "",
        "四、实验结果与分析",
        resultAnalysis.join("\n"),
        "",
        "五、代码说明",
        "带注释代码：",
        annotated.annotatedCode || "暂未输入代码。",
        "",
        "逐段说明：",
        annotated.annotations.length
          ? annotated.annotations.map(item => `第 ${item.line} 行：${item.code}\n说明：${item.comment}`).join("\n\n")
          : "暂未输入代码。",
        "",
        "六、代码原理分析",
        codePrinciples.join("\n"),
        "",
        "七、实验总结",
        summary.join("\n")
      ].join("\n");

      currentReport = { html, text };
      elements.preview.innerHTML = html;
    }

    function debounce(fn, delay = 220) {
      let timer = null;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
      };
    }

    function loadDemo() {
      elements.title.value = "基于栈的表达式求值实验";
      elements.course.value = "数据结构";
      elements.author.value = "张三";
      elements.className.value = "计科 2201";
      elements.language.value = "python";
      elements.goal.value = "要求使用栈实现中缀表达式转后缀表达式，并完成表达式结果计算。";
      elements.code.value = `def precedence(op):
    if op in ('+', '-'):
        return 1
    if op in ('*', '/'):
        return 2
    return 0

def infix_to_postfix(expression):
    stack = []
    output = []
    for ch in expression:
        if ch.isdigit():
            output.append(ch)
        elif ch == '(':
            stack.append(ch)
        elif ch == ')':
            while stack and stack[-1] != '(':
                output.append(stack.pop())
            stack.pop()
        else:
            while stack and precedence(stack[-1]) >= precedence(ch):
                output.append(stack.pop())
            stack.append(ch)
    while stack:
        output.append(stack.pop())
    return output

def evaluate_postfix(postfix):
    stack = []
    for token in postfix:
        if token.isdigit():
            stack.append(int(token))
        else:
            b = stack.pop()
            a = stack.pop()
            if token == '+':
                stack.append(a + b)
            elif token == '-':
                stack.append(a - b)
            elif token == '*':
                stack.append(a * b)
            elif token == '/':
                stack.append(a / b)
    return stack.pop()

expr = "3+5*2"
postfix = infix_to_postfix(expr)
print("后缀表达式:", ''.join(postfix))
print("计算结果:", evaluate_postfix(postfix))`;
      buildReport();
      showToast("示例已加载");
    }

    async function copyText(content, successText) {
      if (!content.trim()) {
        showToast("请先生成报告内容");
        return;
      }
      try {
        await navigator.clipboard.writeText(content);
        showToast(successText);
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = content;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        showToast(successText);
      }
    }

    elements.generateBtn.addEventListener("click", buildReport);
    elements.loadDemoBtn.addEventListener("click", loadDemo);
    elements.clearBtn.addEventListener("click", () => {
      elements.title.value = "";
      elements.course.value = "";
      elements.author.value = "";
      elements.className.value = "";
      elements.language.value = "auto";
      elements.goal.value = "";
      elements.code.value = "";
      currentReport = { html: "", text: "" };
      elements.preview.innerHTML = `
        <div class="placeholder">
          <h3>等待生成</h3>
          <p>在左侧输入实验题目和代码后，点击“生成实验报告”或直接实时编辑，即可在这里查看完整报告。</p>
        </div>
      `;
      showToast("内容已清空");
    });

    elements.copyBtn.addEventListener("click", () => copyText(currentReport.text, "报告文本已复制"));
    elements.copyHtmlBtn.addEventListener("click", () => copyText(elements.preview.innerText, "预览内容已复制"));

    const liveUpdate = debounce(() => {
      const hasTitle = elements.title.value.trim();
      const hasGoal = elements.goal.value.trim();
      const hasCode = elements.code.value.trim();
      if (hasTitle || hasGoal || hasCode) buildReport();
    });

    [
      elements.title,
      elements.course,
      elements.author,
      elements.className,
      elements.language,
      elements.goal,
      elements.code
    ].forEach(el => {
      el.addEventListener("input", liveUpdate);
      el.addEventListener("change", liveUpdate);
    });

    loadDemo();
  </script>
</body>
</html>
