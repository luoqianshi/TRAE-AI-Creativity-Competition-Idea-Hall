    <!-- 高德安全密钥：必须在任何高德脚本加载前设置 -->
    <script>
      window._AMapSecurityConfig = {
        securityJsCode: 'cccb4fc576a044f01722f742cfde9582'
      }
    </script>
    <!-- ── 预加载脚本：种子数据 + 主题同步 + AI 模拟 ── -->
    <script>
    (function(){
      const DB_NAME='XiaoShenFoodJournal';
      const DB_VER=3;
      const IMG_BASE='imgs/';

      const seedRestaurants=[
        {name:'柳州老牌螺蛳粉',address:'长沙市岳麓区麓山南路',latitude:28.1950,longitude:112.9730},
        {name:'湘味小厨',address:'长沙市天心区黄兴南路',latitude:28.1940,longitude:112.9723},
        {name:'老王烧烤',address:'长沙市芙蓉区人民东路',latitude:28.1930,longitude:112.9710},
        {name:'湘西砂锅馆',address:'长沙市岳麓区金星中路',latitude:28.1960,longitude:112.9740},
        {name:'巷子口烤鸡',address:'长沙市开福区湘江中路',latitude:28.1920,longitude:112.9700},
        {name:'邕记螺蛳粉',address:'长沙市雨花区韶山南路',latitude:28.1970,longitude:112.9750}
      ];

      const seedDishes=[
        {dishName:'葱油饼',restaurantIdx:1,image:IMG_BASE+'food1.jpg',rating:4.5,feeling:'酥脆可口，葱香四溢，早餐首选',tags:['面食','早餐','酥脆'],price:12,checkInCount:8},
        {dishName:'螺蛳粉',restaurantIdx:0,image:IMG_BASE+'food2.jpg',rating:4.8,feeling:'酸辣过瘾，粉质Q弹，每次都想再来一碗',tags:['嗦粉','夜宵','酸辣'],price:18,checkInCount:12},
        {dishName:'烤串拼盘',restaurantIdx:2,image:IMG_BASE+'food3.png',rating:4.7,feeling:'聚会必点，炭火香十足，串串都入味',tags:['烧烤','夜宵','聚会'],price:35,checkInCount:5},
        {dishName:'砂锅螺蛳粉',restaurantIdx:3,image:IMG_BASE+'food4.jpg',rating:4.6,feeling:'冬日暖胃首选，砂锅炖煮更入味',tags:['嗦粉','冬日','暖胃'],price:22,checkInCount:3},
        {dishName:'秘制烤鸡腿',restaurantIdx:4,image:IMG_BASE+'food5.jpg',rating:4.9,feeling:'外焦里嫩，秘制酱料一绝，每次来都点',tags:['烧烤','酱香','招牌'],price:15,checkInCount:6},
        {dishName:'酸辣螺蛳粉',restaurantIdx:5,image:IMG_BASE+'food6.jpg',rating:4.7,feeling:'酸辣重口，越吃越上瘾，酸笋味浓郁',tags:['嗦粉','酸辣','重口'],price:19,checkInCount:9}
      ];

      const mockAI={
        '帮我决定':{dish_name:'螺蛳粉',reason:'累计打卡12次、评分4.8，螺蛳粉是你最爱的品类，推荐指数五星'},
        '想吃辣的':{dish_name:'酸辣螺蛳粉',reason:'酸辣重口标签命中率100%，近7天最常搜索的口味组合'},
        '附近有什么':{dish_name:'秘制烤鸡腿',reason:'所有记录中评分最高(4.9)，就在巷子口烤鸡，步行可达'},
        '高分推荐':{dish_name:'秘制烤鸡腿',reason:'你所有打卡菜品中评分最高(4.9)，酱香标签匹配度98%'},
        '清淡点':{dish_name:'葱油饼',reason:'8次早餐打卡中，酥脆面食评分稳定4.5+，今日推荐'},
        '夜宵推荐':{dish_name:'烤串拼盘',reason:'夜宵时段67%选择烧烤，聚会场景吻合近30天活跃模式'}
      };

      // Mock AI API fetch
      const _origFetch=window.fetch;
      window.fetch=function(url,opts){
        if(typeof url==='string' && url.includes('/chat/completions')){
          let body;try{body=JSON.parse(opts.body)}catch(e){body=null}
          if(!body||!body.messages) return _origFetch.apply(this,arguments);
          // Taste profile
          if(body.messages[0]&&body.messages[0].content&&body.messages[0].content.includes('美食口味分析师')){
            return Promise.resolve(new Response(JSON.stringify({
              choices:[{message:{content:JSON.stringify({
                summary:'你是「夜宵型辣味党」，偏爱嗦粉、烧烤和重口味湘菜，炸物和街头小吃也是你的心头好。近30天打卡活跃于岳麓区，对酸辣口味有极强偏好。',
                tags:['辣','夜宵','嗦粉','烧烤','湘菜','酸辣','早餐','聚会']
              })}}]
            }),{status:200,headers:{'Content-Type':'application/json'}}));
          }
          // Recommendation
          let prompt='';
          if(body.messages[1]&&body.messages[1].content) prompt=body.messages[1].content||'';
          else if(body.messages[0]&&body.messages[0].role==='user') prompt=body.messages[0].content||'';
          let best=null;
          for(let key in mockAI){if(prompt.includes(key)){best=mockAI[key];break}}
          if(!best) best={dish_name:'螺蛳粉',reason:'根据你的打卡记录和口味标签，螺蛳粉是最佳选择'};
          return Promise.resolve(new Response(JSON.stringify({
            choices:[{message:{content:JSON.stringify(best)}}]
          }),{status:200,headers:{'Content-Type':'application/json'}}));
        }
        return _origFetch.apply(this,arguments);
      };

      // Seed IndexedDB — 在 onupgradeneeded 中同步插入，确保 React 初始化前数据就绪
      (function(){
        var rq = indexedDB.open('XiaoShenFoodJournal', 3);
        rq.onupgradeneeded = function(e) {
          var db = e.target.result, now = new Date();
          // 创建 stores（与 Dexie storage.ts schema 一致）
          if (!db.objectStoreNames.contains('restaurants')) {
            var rs = db.createObjectStore('restaurants', {keyPath:'id', autoIncrement:true});
            rs.createIndex('name','name',{unique:false});
          }
          if (!db.objectStoreNames.contains('dishes')) {
            var ds = db.createObjectStore('dishes', {keyPath:'id', autoIncrement:true});
            ds.createIndex('restaurantId','restaurantId',{unique:false});
            ds.createIndex('dishName','dishName',{unique:false});
          }
          if (!db.objectStoreNames.contains('foodRecords')) db.createObjectStore('foodRecords',{keyPath:'id',autoIncrement:true});
          if (!db.objectStoreNames.contains('checkInLogs')) db.createObjectStore('checkInLogs',{keyPath:'id',autoIncrement:true});
        };
        rq.onsuccess = function(e) {
          var db = e.target.result, now = new Date();
          // 检查是否已有数据，避免重复插入
          try {
            var txn = db.transaction(['restaurants'], 'readonly');
            var store = txn.objectStore('restaurants');
            store.count().onsuccess = function(ev) {
              if (ev.target.result > 0) { db.close(); return; }
              db.close();
              doSeed();
            };
          } catch(ex) { db.close(); doSeed(); }
          function doSeed() {
            var rq2 = indexedDB.open('XiaoShenFoodJournal', 3);
            rq2.onsuccess = function(e) {
              var db = e.target.result, ids = [];
              try {
                var t = db.transaction(['restaurants'], 'readwrite');
                var s = t.objectStore('restaurants');
                seedRestaurants.forEach(function(r,i) {
                  var a = s.add({name:r.name,address:r.address,latitude:r.latitude,longitude:r.longitude,createdAt:now,updatedAt:now});
                  a.onsuccess = function(aev) { ids[i] = aev.target.result; };
                });
                t.oncomplete = function() {
                  var t2 = db.transaction(['dishes'], 'readwrite');
                  var s2 = t2.objectStore('dishes');
                  seedDishes.forEach(function(d) {
                    s2.add({restaurantId:ids[d.restaurantIdx],dishName:d.dishName,image:d.image,rating:d.rating,feeling:d.feeling,tags:d.tags,price:d.price,aiResult:null,checkInCount:d.checkInCount,lastCheckIn:null,visitedAt:now,createdAt:now,updatedAt:now});
                  });
                  t2.oncomplete = function() { db.close(); };
                };
              } catch(ex) { db.close(); }
            };
          }
        };
        rq.onerror = function() {};
      })();

      // Theme sync — 使用 React App 的 localStorage key
      function applyTheme(mode){
        // localStorage key 与 ThemeModeContext.tsx 一致
        localStorage.setItem('xysj_theme_mode',mode||'light');
        if(mode==='system'||mode==='auto'){
          mode=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
        }
        document.documentElement.dataset.theme=mode||'light';
      }
      window.addEventListener('message',function(e){
        if(e.data&&e.data.type==='setTheme') applyTheme(e.data.theme);
      });
      // 初始主题：同步父页面
      try{
        var pt=window.parent.document.documentElement.getAttribute('data-theme');
        if(pt) applyTheme(pt);
      }catch(e){}
      // 兜底：强制 light（headless browser 默认 dark）
      if(!localStorage.getItem('xysj_theme_mode')){
        applyTheme('light');
      }
    })();
    </script>
    <div id="root"></div>
