          <svg id="iconSun" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </div>

    <!-- ── Chat Tab ── -->
    <div id="tabChat" class="tab-content" style="flex:1;display:flex;flex-direction:column">
      <div class="chat-area" id="chatArea">
        <!-- Messages injected here -->
      </div>
      <div class="quick-replies" id="quickReplies">
        <button class="quick-btn" onclick="sendQuick(this,'心里很难受，突然就崩溃了')">心里很难受，突然就崩溃了</button>
        <button class="quick-btn" onclick="sendQuick(this,'总是忍不住看ta的动态')">总是忍不住看ta的动态</button>
        <button class="quick-btn intense" onclick="sendQuick(this,'很痛苦，不知道怎么熬过去')">很痛苦，不知道怎么熬过去</button>
      </div>
      <div class="input-area">
        <div class="input-wrapper">
          <textarea id="msgInput" rows="1" placeholder="想说点什么..." oninput="autoResize(this);checkSendBtn()" onkeydown="handleEnter(event)"></textarea>
        </div>
        <button class="btn-send" id="btnSend" onclick="sendUserMsg()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>

    <!-- ── Garden Tab ── -->
    <div id="tabGarden" class="tab-content" style="flex:1;display:none;flex-direction:column">
      <div class="garden-container">
        <div class="garden-scene" id="gardenScene">
          <div class="garden-sky"></div>
          <div class="garden-particles" id="gardenParticles"></div>
          <div class="garden-ground"></div>
          <div class="seedling" style="left:35%">
            <div style="position:relative">
              <div class="seedling-leaf left"></div>
              <div class="seedling-leaf right"></div>
              <div class="seedling-stem"></div>
            </div>
            <div class="seedling-base"></div>
          </div>
          <div class="seedling" style="left:58%;bottom:30%">
            <div style="position:relative">
              <div class="seedling-leaf left"></div>
              <div class="seedling-leaf right"></div>
              <div class="seedling-stem" style="height:22px"></div>
            </div>
            <div class="seedling-base"></div>
          </div>
        </div>
        <div class="garden-info">
          <div class="garden-title">你的花园正在生长</div>
          <div class="milestone">
            <div class="milestone-icon">🌱</div>
            <div class="milestone-text">
              <div class="label">第一次倾诉 · 种下一颗种子</div>
              <div class="desc">今天 · 你迈出了很重要的一步</div>
            </div>
          </div>
          <div class="milestone">
            <div class="milestone-icon">💧</div>
            <div class="milestone-text">
              <div class="label">完成一次呼吸练习</div>
              <div class="desc">照顾自己，从呼吸开始</div>
            </div>
          </div>
          <div class="milestone">
            <div class="milestone-icon">🌙</div>
            <div class="milestone-text">
              <div class="label">连续三天登录</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Profile Tab ── -->
    <div id="tabProfile" class="tab-content" style="flex:1;display:none;flex-direction:column">
      <div class="profile-container">
        <div class="profile-card">
          <div class="profile-avatar">渡</div>
          <div class="profile-name">渡口旅人</div>
          <div class="profile-days">疗愈之旅 · 第3天</div>
        </div>
        <div class="profile-stats">
          <div class="stat-card">
            <div class="stat-num">7</div>
            <div class="stat-label">对话次数</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">1</div>
            <div class="stat-label">呼吸练习</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">2</div>
            <div class="stat-label">花园种子</div>
          </div>
        </div>
        <div class="profile-menu">
          <div class="menu-item">
            <div class="menu-item-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              <span>隐私与安全</span>
            </div>
            <div class="menu-item-right">端到端加密</div>
          </div>
          <div class="menu-item">
            <div class="menu-item-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
              <span>疗愈设置</span>
            </div>
            <div class="menu-item-right">&gt;</div>
          </div>
          <div class="menu-item">
            <div class="menu-item-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
              <span>关于渡口</span>
            </div>
            <div class="menu-item-right">&gt;</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <button class="nav-item active" id="navChat" onclick="switchTab('chat')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <span>聊天</span>
      </button>
      <button class="nav-item" id="navGarden" onclick="switchTab('garden')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22c4-4 8-7.5 8-12a8 8 0 10-16 0c0 4.5 4 8 8 12z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>花园</span>
      </button>
      <button class="nav-item" id="navProfile" onclick="switchTab('profile')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </button>
    </div>
  </div>

  <!-- ═══════ BREATHING OVERLAY ═══════ -->
  <div class="screen" id="breathing">
    <div class="breath-content">
      <div class="breath-circle-wrap">
        <div class="breath-circle" id="breathCircle">
          <span class="breath-text" id="breathText">吸气...</span>
        </div>
      </div>
      <div class="breath-count" id="breathCount"></div>
      <button class="btn-breath-done" id="btnBreathDone" onclick="finishBreathing()">完成</button>
    </div>
  </div>

</div><!-- /phone-frame -->

<script>
// ── State ──
let isDark = true;
let currentTab = 'chat';
let responseIndex = 0;
let breathInterval = null;
let breathCycleCount = 0;
let isBreathing = false;

// ── AI Responses ──
const aiResponses = [
  "嗯，我听到了。那种感觉一定很难受。",
  "你愿意跟我说更多吗？不用急，慢慢来。",
  "谢谢你愿意把这些告诉我。",
  "这很正常。失恋的时候，最难的就是那些突然涌上来的回忆。",
  "你不是一个人在经历这些。很多人都有过这样的时刻。",
  "不用逼自己现在就想明白。有时候，能说出来就已经很勇敢了。",
  "我能感受到你的难过。那些感受都是真实的，不需要去否定它们。",
  "有时候，即使是最小的事情也会触动那些伤口。这并不代表你在退步。"
];

const intenseResponse = "我感觉到你现在很痛苦。在继续之前，我们先做一次呼吸好不好？跟随着屏幕上的圆圈，慢慢吸气……慢慢呼气……";

const afterBreathingResponse = "你做得很好。如果愿意，可以继续跟我说。";

const replyMap = {
  '心里很难受，突然就崩溃了': [
    "那种突然被情绪淹没的感觉，真的很难受。你能说出来，说明你在面对它。",
    "有时候情绪就是这样，像潮水一样突然涌上来。不用急着让它退去，让它流过就好。"
  ],
  '总是忍不住看ta的动态': [
    "这很正常。戒掉一个习惯需要时间，不必因此责怪自己。",
    "每次忍不住去看的时候，也许可以试着感受一下那个瞬间的心情。是什么让你想去点开呢？"
  ],
  '很痛苦，不知道怎么熬过去': [intenseResponse]
};

// ── Welcome → App ──
function enterApp() {
  document.getElementById('welcome').classList.remove('active');
  setTimeout(() => {
    document.getElementById('app').classList.add('active');
    setTimeout(() => addAIMsg("我在。你随时可以说。"), 600);
  }, 300);
}

// ── Chat Functions ──
function addAIMsg(text, callback) {
  const chatArea = document.getElementById('chatArea');
  // Show typing indicator
  const typing = document.createElement('div');
  typing.className = 'message ai';
  typing.innerHTML = `
    <div class="msg-avatar">渡</div>
    <div class="msg-bubble">
      <div class="typing-indicator"><span></span><span></span><span></span></div>
    </div>
  `;
  chatArea.appendChild(typing);
  scrollChat();

  setTimeout(() => {
    typing.remove();
    const msg = document.createElement('div');
    msg.className = 'message ai';
    msg.innerHTML = `
      <div class="msg-avatar">渡</div>
      <div class="msg-bubble">${text}</div>
    `;
    chatArea.appendChild(msg);
    scrollChat();
    if (callback) callback();
  }, 1200 + Math.random() * 800);
}

function addUserMsg(text) {
  const chatArea = document.getElementById('chatArea');
  const msg = document.createElement('div');
  msg.className = 'message user';
  msg.innerHTML = `
    <div class="msg-avatar">我</div>
    <div class="msg-bubble">${text}</div>
  `;
  chatArea.appendChild(msg);
  scrollChat();
}

function getAIResponse(userText) {
  // Check for intense trigger
  if (userText.includes('痛苦') || userText.includes('熬不过') || userText.includes('崩溃') || userText.includes('受不了')) {
    if (replyMap[userText] && replyMap[userText][0] === intenseResponse) {
      return { text: intenseResponse, triggerBreathing: true };
    }
  }
  if (replyMap[userText]) {
    const replies = replyMap[userText];
    if (replies[0] === intenseResponse) {
      return { text: intenseResponse, triggerBreathing: true };
    }
    const idx = Math.floor(Math.random() * replies.length);
    return { text: replies[idx], triggerBreathing: false };
  }
  const text = aiResponses[responseIndex % aiResponses.length];
  responseIndex++;
  return { text, triggerBreathing: false };
}

function sendUserMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  addUserMsg(text);
  input.value = '';
  autoResize(input);
  checkSendBtn();
  hideQuickReplies();
  setTimeout(() => {
    const resp = getAIResponse(text);
    if (resp.triggerBreathing) {
      addAIMsg(resp.text, () => {
        setTimeout(startBreathing, 1000);
      });
    } else {
      addAIMsg(resp.text);
    }
  }, 300);
}

function sendQuick(btn, text) {
  addUserMsg(text);
  hideQuickReplies();
  setTimeout(() => {
    const resp = getAIResponse(text);
    if (resp.triggerBreathing) {
      addAIMsg(resp.text, () => {
        setTimeout(startBreathing, 1000);
      });
    } else {
      addAIMsg(resp.text);
    }
  }, 300);
}

function hideQuickReplies() {
  const qr = document.getElementById('quickReplies');
  qr.style.opacity = '0';
  qr.style.transform = 'translateY(8px)';
  setTimeout(() => { qr.style.display = 'none'; }, 350);
}

function scrollChat() {
  const area = document.getElementById('chatArea');
  requestAnimationFrame(() => {
    area.scrollTop = area.scrollHeight;
  });
}

// ── Input Helpers ──
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 80) + 'px';
}

function checkSendBtn() {
  const btn = document.getElementById('btnSend');
  const val = document.getElementById('msgInput').value.trim();
  if (val) { btn.classList.add('ready'); }
  else { btn.classList.remove('ready'); }
}

function handleEnter(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendUserMsg();
  }
}

// ── Breathing Exercise ──
function startBreathing() {
  isBreathing = true;
  breathCycleCount = 0;
  const breathScreen = document.getElementById('breathing');
  const circle = document.getElementById('breathCircle');
  const text = document.getElementById('breathText');
  const count = document.getElementById('breathCount');
  const doneBtn = document.getElementById('btnBreathDone');

  breathScreen.classList.add('active');
  doneBtn.classList.remove('visible');
  count.textContent = '';

  let inhaling = true;
  breathCycleCount = 0;

  function breathCycle() {
    if (!isBreathing) return;
    if (inhaling) {
      circle.className = 'breath-circle';
      void circle.offsetWidth;
      circle.classList.add('inflate');
      text.textContent = '吸气...';
    } else {
      circle.classList.remove('inflate');
      circle.classList.add('deflate');
      text.textContent = '呼气...';
    }
    inhaling = !inhaling;
    if (!inhaling) {
      breathCycleCount++;
      count.textContent = `第 ${Math.min(breathCycleCount, 2)} / 2 次呼吸`;
      if (breathCycleCount >= 2) {
        clearTimeout(breathInterval);
        setTimeout(() => {
          doneBtn.classList.add('visible');
        }, 2000);
        return;
      }
    }
  }

  // Start with initial inflate
  circle.classList.add('inflate');
  text.textContent = '吸气...';
  setTimeout(() => {
    circle.classList.remove('inflate');
    circle.classList.add('deflate');
    text.textContent = '呼气...';
    inhaling = true;
    breathInterval = setInterval(breathCycle, 4000);
  }, 4000);
}

function finishBreathing() {
  isBreathing = false;
  clearInterval(breathInterval);
  document.getElementById('breathing').classList.remove('active');
  document.getElementById('breathCircle').className = 'breath-circle';
  switchTab('chat');
  setTimeout(() => {
    addAIMsg(afterBreathingResponse);
    showQuickReplies();
  }, 500);
}

// ── Theme Toggle ──
function toggleTheme() {
  isDark = !isDark;
  const frame = document.getElementById('phoneFrame');
  const moon = document.getElementById('iconMoon');
  const sun = document.getElementById('iconSun');
  if (isDark) {
    frame.classList.remove('light');
    frame.classList.add('dark');
    moon.classList.remove('hidden');
    sun.classList.add('hidden');
  } else {
    frame.classList.remove('dark');
    frame.classList.add('light');
    moon.classList.add('hidden');
    sun.classList.remove('hidden');
  }
}

// ── Tab Switching ──
function switchTab(tab) {
  currentTab = tab;
  const tabs = ['chat', 'garden', 'profile'];
  tabs.forEach(t => {
    const content = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
    const nav = document.getElementById('nav' + t.charAt(0).toUpperCase() + t.slice(1));
    if (t === tab) {
      content.style.display = 'flex';
      nav.classList.add('active');
    } else {
      content.style.display = 'none';
      nav.classList.remove('active');
    }
  });
  if (tab === 'chat') {
    scrollChat();
  }
}

function showQuickReplies() {
  const qr = document.getElementById('quickReplies');
  qr.style.display = 'flex';
  requestAnimationFrame(() => {
    qr.style.opacity = '1';
    qr.style.transform = 'translateY(0)';
  });
}

// ── Garden Particles ──
function initGardenParticles() {
  const container = document.getElementById('gardenParticles');
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = (10 + Math.random() * 80) + '%';
    p.style.bottom = (20 + Math.random() * 30) + '%';
    p.style.animationDuration = (4 + Math.random() * 6) + 's';
    p.style.animationDelay = (Math.random() * 5) + 's';
    p.style.width = (2 + Math.random() * 2) + 'px';
    p.style.height = p.style.width;
    container.appendChild(p);
  }
}

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  initGardenParticles();
  const qr = document.getElementById('quickReplies');
  qr.style.transition = 'opacity .35s ease, transform .35s ease';
});
</script>

</body>
</html>
