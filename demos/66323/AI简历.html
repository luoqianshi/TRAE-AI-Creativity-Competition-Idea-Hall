<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职面AI复盘馆 - 求职面试智能训练平台</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f9ff;
            color: #2c3e50;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #d0e4ff;
            margin-bottom: 30px;
        }
        h1 {
            color: #0066cc;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #6688bb;
            font-size: 15px;
        }
        .card-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 30px;
        }
        @media (max-width:768px) {
            .card-wrap {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 2px 12px rgba(0,102,204,0.08);
            border: 1px solid #e0edff;
        }
        .card h2 {
            font-size: 18px;
            color: #0055aa;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        textarea, input[type="file"] {
            width: 100%;
            border: 1px solid #b8d4f2;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            background: #fafcff;
        }
        textarea {
            min-height: 110px;
            resize: vertical;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }
        .btn-primary {
            background: #0066cc;
            color: white;
        }
        .btn-primary:hover {
            background: #0052a3;
        }
        .btn-outline {
            background: white;
            color: #0066cc;
            border: 1px solid #0066cc;
        }
        .btn-outline:hover {
            background: #f0f7ff;
        }
        /* 对话气泡 */
        .chat-box {
            height: 320px;
            overflow-y: auto;
            padding: 12px;
            background: #fafcff;
            border-radius: 8px;
            border:1px solid #d0e4ff;
            margin-bottom:12px;
        }
        .msg {
            max-width: 80%;
            margin:10px 0;
            padding:10px 14px;
            border-radius:10px;
            line-height:1.6;
            font-size:14px;
        }
        .ai-msg {
            background: #e0edff;
            border-bottom-left-radius: 2px;
            align-self: flex-start;
        }
        .user-msg {
            background: #0066cc;
            color:white;
            margin-left:auto;
            border-bottom-right-radius: 2px;
        }
        .score-row {
            display:flex;
            align-items:center;
            gap:10px;
            margin:12px 0;
        }
        .score-label {
            width:120px;
        }
        .score-bar-bg {
            flex:1;
            height:10px;
            background:#e4edf7;
            border-radius:99px;
        }
        .score-bar {
            height:100%;
            background:#0066cc;
            border-radius:99px;
        }
        .chart-container {
            height:300px;
            margin-top:20px;
        }
        .export-area {
            text-align:right;
            margin-top:16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>职面AI复盘馆</h1>
            <div class="subtitle">简历上传 | JD匹配 | AI模拟面试 | 自动复盘打分 | 报告导出</div>
        </header>

        <div class="card-wrap">
            <!-- 左侧：简历&JD上传 -->
            <div class="card">
                <h2>📄 简历与岗位信息录入</h2>
                <div style="margin-bottom:16px;">
                    <label>上传简历文件（PDF/Word）</label>
                    <input type="file" accept=".pdf,.doc,.docx" id="resumeFile">
                </div>
                <div>
                    <label>粘贴岗位JD需求描述</label>
                    <textarea id="jdInput" placeholder="请粘贴目标岗位招聘要求，AI将自动提取面试考点..."></textarea>
                </div>
                <div class="btn-group">
                    <button class="btn-primary" id="matchBtn">AI匹配面试考点</button>
                </div>
            </div>

            <!-- 右侧：AI模拟面试对话 -->
            <div class="card">
                <h2>🤖 AI一对一模拟面试</h2>
                <div class="chat-box" id="chatBox">
                    <div class="msg ai-msg">你好，我是你的专属面试AI考官，请先上传简历和岗位JD，我将开始针对性提问。</div>
                </div>
                <textarea id="userAnswer" placeholder="在这里输入你的面试回答..."></textarea>
                <div class="btn-group">
                    <button class="btn-primary" id="sendAnsBtn">提交回答，实时打分</button>
                    <button class="btn-outline" id="nextQBtn">下一道面试题</button>
                </div>
            </div>
        </div>

        <!-- 复盘打分 & 图表报告区域 -->
        <div class="card">
            <h2>📊 面试复盘评分与分析报告</h2>
            <div id="scorePanel">
                <div class="score-row">
                    <div class="score-label">专业知识得分</div>
                    <div class="score-bar-bg"><div class="score-bar" style="width:78%"></div></div>
                    <span>78分</span>
                </div>
                <div class="score-row">
                    <div class="score-label">逻辑表达得分</div>
                    <div class="score-bar-bg"><div class="score-bar" style="width:65%"></div></div>
                    <span>65分</span>
                </div>
                <div class="score-row">
                    <div class="score-label">岗位匹配度</div>
                    <div class="score-bar-bg"><div class="score-bar" style="width:83%"></div></div>
                    <span>83分</span>
                </div>
                <div class="score-row">
                    <div class="score-label">临场应变能力</div>
                    <div class="score-bar-bg"><div class="score-bar" style="width:70%"></div></div>
                    <span>70分</span>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="scoreChart"></canvas>
            </div>
            <div class="export-area">
                <button class="btn-primary" id="exportBtn">导出完整复盘报告（文本）</button>
            </div>
        </div>
    </div>

    <script>
        // 柱状复盘图表初始化
        const ctx = document.getElementById('scoreChart').getContext('2d');
        const scoreChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['专业知识','逻辑表达','岗位匹配','临场应变'],
                datasets: [{
                    label: '本次面试得分',
                    data: [78,65,83,70],
                    backgroundColor: '#0066cc',
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        min:0, max:100
                    }
                }
            }
        });

        // 对话发送功能
        const chatBox = document.getElementById('chatBox');
        const userAnswer = document.getElementById('userAnswer');
        const sendBtn = document.getElementById('sendAnsBtn');

        sendBtn.addEventListener('click',()=>{
            const text = userAnswer.value.trim();
            if(!text) return;
            // 用户消息
            const userMsg = document.createElement('div');
            userMsg.className = 'msg user-msg';
            userMsg.innerText = text;
            chatBox.appendChild(userMsg);
            // AI回复模拟
            setTimeout(()=>{
                const aiReply = document.createElement('div');
                aiReply.className = 'msg ai-msg';
                aiReply.innerText = "已完成回答评分：逻辑表达偏弱，建议增加项目数据佐证，可点击下一题继续训练。";
                chatBox.appendChild(aiReply);
                chatBox.scrollTop = chatBox.scrollHeight;
            },600)
            userAnswer.value = "";
        })

        // 导出报告模拟
        document.getElementById('exportBtn').addEventListener('click',()=>{
            const report = `
职面AI复盘馆面试报告
1.专业知识：78分
2.逻辑表达：65分（薄弱项）
3.岗位匹配度：83分
4.临场应变：70分
优化建议：回答增加量化成果，梳理项目逻辑框架
            `;
            const blob = new Blob([report],{type:'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "面试复盘报告.txt";
            a.click();
        })
    </script>
</body>
</html>
