  // ==================== 当前状态 ====================
  let currentScene = '工作';
  let currentMood = '开心';
  let currentText = '';
  let lastGeneratedText = '';

  // ==================== DOM 元素引用 ====================
  const sceneGrid = document.getElementById('sceneGrid');
  const moodGrid = document.getElementById('moodGrid');
  const copyDisplay = document.getElementById('copyDisplay');
  const copyTextEl = document.getElementById('copyText');
  const copyTagEl = document.getElementById('copyTag');
  const placeholder = document.getElementById('placeholder');
  const btnRefresh = document.getElementById('btnRefresh');
  const btnCopy = document.getElementById('btnCopy');
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toast-msg');

  // ==================== 场景选择事件 ====================
  sceneGrid.addEventListener('click', function(e) {
    const chip = e.target.closest('.scene-chip');
    if (!chip) return;

    // 更新激活状态
    sceneGrid.querySelectorAll('.scene-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentScene = chip.dataset.scene;

    // 切换场景时自动生成新文案
    generateCopy();
  });

  // ==================== 情绪选择事件 ====================
  moodGrid.addEventListener('click', function(e) {
    const chip = e.target.closest('.mood-chip');
    if (!chip) return;

    // 更新激活状态
    moodGrid.querySelectorAll('.mood-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentMood = chip.dataset.mood;

    // 切换情绪时自动生成新文案
    generateCopy();
  });

  // ==================== 筛选匹配的文案 ====================
  function getMatchingCopy() {
    return copyLibrary.filter(item =>
      item.scene === currentScene && item.mood === currentMood
    );
  }

  // ==================== 随机选择一条 ====================
  function getRandomCopy(list) {
    if (list.length === 0) return null;
    const index = Math.floor(Math.random() * list.length);
    return list[index];
  }

  // ==================== 生成文案 ====================
  function generateCopy() {
    const matching = getMatchingCopy();

    if (matching.length === 0) {
      // 无匹配时显示默认文案
      currentText = '还没有这个组合的文案，换个试试吧～';
      showCopy(currentText, '');
      return;
    }

    // 如果有多条，确保不和上次重复
    let selected;
    if (matching.length === 1) {
      selected = matching[0];
    } else {
      do {
        selected = getRandomCopy(matching);
      } while (matching.length > 1 && selected.text === lastGeneratedText);
    }

    lastGeneratedText = selected.text;
    currentText = selected.text;

    // 构建标签信息
    const sceneEmoji = sceneEmojiMap[currentScene] || '';
    const moodEmoji = moodEmojiMap[currentMood] || '';
    const tagText = `${sceneEmoji} ${currentScene} · ${moodEmoji} ${currentMood}`;

    showCopy(selected.text, tagText);
  }

  // ==================== 显示文案 ====================
  function showCopy(text, tagText) {
    copyTextEl.textContent = text;
    copyTextEl.style.display = 'block';
    placeholder.style.display = 'none';

    if (tagText) {
      copyTagEl.textContent = tagText;
      copyTagEl.style.display = 'inline-flex';
    } else {
      copyTagEl.style.display = 'none';
    }

    copyDisplay.classList.add('has-content');
    btnRefresh.disabled = false;
    btnCopy.disabled = false;

    // 触发动效
    copyTextEl.style.animation = 'none';
    copyTagEl.style.animation = 'none';
    copyTextEl.offsetHeight; // 强制回流
    copyTagEl.offsetHeight;
    copyTextEl.style.animation = 'fadeInUp 0.4s ease-out';
    copyTagEl.style.animation = 'fadeInUp 0.4s ease-out 0.1s both';
  }

  // ==================== 换一换 ====================
  function refreshCopy() {
    if (btnRefresh.disabled) return;
    generateCopy();
  }

  // ==================== 复制功能 ====================
  function copyText() {
    if (!currentText) return;

    // 使用 Clipboard API
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(currentText).then(() => {
        showToast('已复制到剪贴板，快去发圈吧！');
      }).catch(() => {
        fallbackCopy();
      });
    } else {
      fallbackCopy();
    }
  }

  // 降级复制方案
  function fallbackCopy() {
    const textarea = document.createElement('textarea');
    textarea.value = currentText;
    textarea.style.position = 'fixed';
    textarea.style.left = '-9999px';
    textarea.style.top = '-9999px';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();

    try {
      document.execCommand('copy');
      showToast('已复制到剪贴板，快去发圈吧！');
    } catch (err) {
      showToast('复制失败，请手动长按复制哦～');
    }

    document.body.removeChild(textarea);
  }

  // ==================== Toast 提示 ====================
  let toastTimer;

  function showToast(message) {
    toastMsg.textContent = message;
    toast.classList.add('show');

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 2200);
  }

  // ==================== 初始化 ====================
  function init() {
    // 页面加载时自动生成一条初始文案
    generateCopy();
  }

  // 启动
  init();
  </script>
</body>
