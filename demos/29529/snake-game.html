<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇小游戏</title>
    <style>﻿* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game-container {
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    text-align: center;
}

.title {
    color: #333;
    margin-bottom: 20px;
    font-size: 2.5rem;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
}

.game-info {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-bottom: 20px;
}

.score, .high-score {
    font-size: 1.2rem;
    font-weight: bold;
    color: #555;
}

.score span, .high-score span {
    color: #e74c3c;
    font-size: 1.4rem;
}

#gameCanvas {
    border: 4px solid #3498db;
    border-radius: 10px;
    background: #ecf0f1;
    display: block;
    margin: 0 auto 20px;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 20px;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
}

#startBtn:disabled {
    background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
}

#pauseBtn:disabled {
    background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
}

#restartBtn:disabled {
    background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
}

#startBtn {
    background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
    color: white;
}

#startBtn:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 20px rgba(46, 204, 113, 0.4);
}

#pauseBtn {
    background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
    color: white;
}

#pauseBtn:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 20px rgba(243, 156, 18, 0.4);
}

#restartBtn {
    background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
    color: white;
}

#restartBtn:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 20px rgba(52, 152, 219, 0.4);
}

.instructions {
    background: #f8f9fa;
    border-radius: 10px;
    padding: 20px;
    margin-top: 20px;
}

.instructions h3 {
    color: #333;
    margin-bottom: 15px;
}

.instructions p {
    color: #666;
    margin: 8px 0;
    font-size: 0.95rem;
}

.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-content {
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}

.modal-content h2 {
    color: #e74c3c;
    margin-bottom: 20px;
    font-size: 2rem;
}

.modal-content p {
    font-size: 1.2rem;
    margin: 10px 0;
    color: #333;
}

.modal-content #finalScore {
    color: #27ae60;
    font-weight: bold;
    font-size: 1.5rem;
}

#playAgainBtn {
    background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
    color: white;
    margin-top: 20px;
}

#playAgainBtn:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 20px rgba(231, 76, 60, 0.4);
}

#pauseOverlay {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 10px;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

#pauseOverlay span {
    color: white;
    font-size: 3rem;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
}

#gameCanvasContainer {
    position: relative;
    display: inline-block;
}
</style>
</head>
<body>
    <div class="game-container">
        <h1 class="title">🐍 贪吃蛇游戏</h1>
        
        <div class="game-info">
            <div class="score">分数: <span id="score">0</span></div>
            <div class="high-score">最高分: <span id="highScore">0</span></div>
            <div class="game-status" id="gameStatus">等待开始</div>
        </div>

        <div id="gameCanvasContainer">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="pauseOverlay">
                <span>⏸️ 已暂停</span>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">开始游戏</button>
            <button id="pauseBtn">暂停游戏</button>
            <button id="restartBtn">重新开始</button>
        </div>

        <div class="instructions">
            <h3>游戏说明</h3>
            <p>🎮 使用 <strong>方向键</strong> 或 <strong>WASD</strong> 控制蛇的移动方向</p>
            <p>🍎 吃到红色食物得分，蛇会变长</p>
            <p>💀 撞到墙壁或自己的身体游戏结束</p>
            <p>⏸️ 按 <strong>空格键</strong> 暂停/继续游戏</p>
        </div>

        <div id="gameOverModal" class="modal">
            <div class="modal-content">
                <h2>游戏结束!</h2>
                <p>最终得分: <span id="finalScore">0</span></p>
                <p id="gameOverReason"></p>
                <button id="playAgainBtn">再玩一次</button>
            </div>
        </div>
    </div>

    <script>﻿const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const highScoreElement = document.getElementById('highScore');
const gameStatusElement = document.getElementById('gameStatus');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const restartBtn = document.getElementById('restartBtn');
const gameOverModal = document.getElementById('gameOverModal');
const finalScoreElement = document.getElementById('finalScore');
const gameOverReasonElement = document.getElementById('gameOverReason');
const playAgainBtn = document.getElementById('playAgainBtn');
const pauseOverlay = document.getElementById('pauseOverlay');

const GRID_SIZE = 20;
const CANVAS_SIZE = 400;
const GRID_COUNT = CANVAS_SIZE / GRID_SIZE;

let snake = [];
let food = {};
let direction = 'right';
let nextDirection = 'right';
let score = 0;
let highScore = 0;
let gameState = 'idle';
let gameLoop = null;
let speed = 150;
const INITIAL_SPEED = 150;
const MIN_SPEED = 50;
const SPEED_INCREASE_INTERVAL = 50;

function initGame() {
    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];
    direction = 'right';
    nextDirection = 'right';
    score = 0;
    updateScore();
    spawnFood();
}

function spawnFood() {
    let newFood;
    do {
        newFood = {
            x: Math.floor(Math.random() * GRID_COUNT),
            y: Math.floor(Math.random() * GRID_COUNT)
        };
    } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
    food = newFood;
}

function draw() {
    ctx.fillStyle = '#ecf0f1';
    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

    ctx.fillStyle = '#2ecc71';
    snake.forEach((segment, index) => {
        if (index === 0) {
            ctx.fillStyle = '#27ae60';
        } else {
            ctx.fillStyle = '#2ecc71';
        }
        ctx.beginPath();
        ctx.roundRect(
            segment.x * GRID_SIZE + 2,
            segment.y * GRID_SIZE + 2,
            GRID_SIZE - 4,
            GRID_SIZE - 4,
            4
        );
        ctx.fill();
    });

    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(
        food.x * GRID_SIZE + GRID_SIZE / 2,
        food.y * GRID_SIZE + GRID_SIZE / 2,
        GRID_SIZE / 2 - 2,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.fillStyle = '#f39c12';
    ctx.beginPath();
    ctx.arc(
        food.x * GRID_SIZE + GRID_SIZE / 2 + 4,
        food.y * GRID_SIZE + GRID_SIZE / 2 - 4,
        3,
        0,
        Math.PI * 2
    );
    ctx.fill();
}

function move() {
    direction = nextDirection;

    const head = { ...snake[0] };

    switch (direction) {
        case 'up':
            head.y--;
            break;
        case 'down':
            head.y++;
            break;
        case 'left':
            head.x--;
            break;
        case 'right':
            head.x++;
            break;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score += 10;
        updateScore();
        spawnFood();
        increaseSpeed();
    } else {
        snake.pop();
    }
}

function increaseSpeed() {
    if (score % SPEED_INCREASE_INTERVAL === 0 && speed > MIN_SPEED) {
        speed -= 10;
        if (gameState === 'playing' && gameLoop) {
            clearInterval(gameLoop);
            gameLoop = setInterval(gameStep, speed);
        }
    }
}

function checkCollision() {
    const head = snake[0];

    if (head.x < 0 || head.x >= GRID_COUNT || head.y < 0 || head.y >= GRID_COUNT) {
        return { collision: true, reason: '撞到墙壁了!' };
    }

    for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
            return { collision: true, reason: '撞到自己了!' };
        }
    }

    return { collision: false, reason: '' };
}

function gameStep() {
    move();
    const collision = checkCollision();
    
    if (collision.collision) {
        gameOver(collision.reason);
        return;
    }
    
    draw();
}

function updateScore() {
    scoreElement.textContent = score;
    if (score > highScore) {
        highScore = score;
        highScoreElement.textContent = highScore;
        localStorage.setItem('snakeHighScore', highScore);
    }
}

function gameOver(reason) {
    gameState = 'gameover';
    clearInterval(gameLoop);
    gameLoop = null;
    finalScoreElement.textContent = score;
    gameOverReasonElement.textContent = reason;
    gameOverModal.style.display = 'flex';
    pauseOverlay.style.display = 'none';
    updateButtonStates();
    updateGameStatus('游戏结束');
}

function startGame() {
    if (gameState === 'playing') return;

    gameState = 'playing';
    initGame();
    draw();
    gameLoop = setInterval(gameStep, speed);
    updateButtonStates();
    updateGameStatus('游戏进行中');
}

function pauseGame() {
    if (gameState !== 'playing') return;

    gameState = 'paused';
    clearInterval(gameLoop);
    gameLoop = null;
    pauseOverlay.style.display = 'flex';
    updateButtonStates();
    updateGameStatus('已暂停');
}

function resumeGame() {
    if (gameState !== 'paused') return;

    gameState = 'playing';
    pauseOverlay.style.display = 'none';
    gameLoop = setInterval(gameStep, speed);
    updateButtonStates();
    updateGameStatus('游戏进行中');
}

function restartGame() {
    clearInterval(gameLoop);
    gameLoop = null;
    gameState = 'idle';
    speed = INITIAL_SPEED;
    gameOverModal.style.display = 'none';
    pauseOverlay.style.display = 'none';
    startGame();
}

function updateButtonStates() {
    switch (gameState) {
        case 'idle':
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            restartBtn.disabled = true;
            break;
        case 'playing':
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            restartBtn.disabled = false;
            break;
        case 'paused':
            startBtn.disabled = true;
            pauseBtn.disabled = true;
            restartBtn.disabled = false;
            break;
        case 'gameover':
            startBtn.disabled = true;
            pauseBtn.disabled = true;
            restartBtn.disabled = false;
            break;
    }
}

function updateGameStatus(status) {
    gameStatusElement.textContent = status;
}

function handleKeyDown(e) {
    const key = e.key.toLowerCase();

    if (key === ' ' || key === 'spacebar') {
        e.preventDefault();
        if (gameState === 'playing') {
            pauseGame();
        } else if (gameState === 'paused') {
            resumeGame();
        }
        return;
    }

    if (gameState !== 'playing') return;

    switch (key) {
        case 'arrowup':
        case 'w':
            if (direction !== 'down') nextDirection = 'up';
            break;
        case 'arrowdown':
        case 's':
            if (direction !== 'up') nextDirection = 'down';
            break;
        case 'arrowleft':
        case 'a':
            if (direction !== 'right') nextDirection = 'left';
            break;
        case 'arrowright':
        case 'd':
            if (direction !== 'left') nextDirection = 'right';
            break;
    }
}

startBtn.addEventListener('click', startGame);
pauseBtn.addEventListener('click', () => {
    if (gameState === 'playing') {
        pauseGame();
    } else if (gameState === 'paused') {
        resumeGame();
    }
});
restartBtn.addEventListener('click', restartGame);
playAgainBtn.addEventListener('click', () => {
    gameOverModal.style.display = 'none';
    restartGame();
});
document.addEventListener('keydown', handleKeyDown);

highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
highScoreElement.textContent = highScore;

updateButtonStates();
updateGameStatus('等待开始');
draw();
</script>
</body>
</html>
