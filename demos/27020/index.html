<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<title>小慈</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:320px; height:430px;
    background:transparent; overflow:hidden;
    display:flex; align-items:flex-end; justify-content:center;
    user-select:none; font-family:"PingFang SC",sans-serif;
  }
  #stage {
    position:relative; width:320px; height:398px; flex-shrink:0;
  }
  #pet-img {
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:140px; height:auto; image-rendering:pixelated;
    cursor:pointer; -webkit-user-drag:none; -webkit-app-region:no-drag;
    transition:transform 0.15s;
  }
  #pet-img:hover { transform:translateX(-50%) scale(1.05); }
  #pet-img.outfit-rock { transform:translateX(calc(-50% + 10px)); }
  #pet-img.outfit-rock:hover { transform:translateX(calc(-50% + 10px)) scale(1.05); }

  /* 爱心（休息状态） */
  #rest-heart {
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    display:none; cursor:pointer; image-rendering:pixelated;
    -webkit-app-region:no-drag; z-index:400;
    animation:heartbeat 1.2s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%,100%{ transform:translateX(-50%) scale(1); }
    50%{ transform:translateX(-50%) scale(1.15); }
  }

  .r-btn {
    position:absolute; left:160px; top:301px;
    background:rgba(255,255,255,0.95); border:1.5px solid #c8a8f0;
    border-radius:16px; padding:6px 14px; font-size:12px; color:#7c5cbf;
    cursor:pointer; white-space:nowrap;
    box-shadow:0 2px 10px rgba(120,80,200,0.18);
    transform:translate(-50%,-50%) scale(0); opacity:0;
    transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.22s ease;
    pointer-events:none; -webkit-app-region:no-drag;
  }
  .r-btn:hover { background:#f0e6ff; }
  .r-btn.danger { color:#c44; border-color:#f0c0c0; }
  .r-btn.back   { color:#999; border-color:#e0e0e0; font-size:11px; }

  /* ── 配置面板 ── */
  #config-panel {
    position:absolute; top:5px; left:40px; width:240px;
    background:#fff; border-radius:16px;
    box-shadow:0 4px 20px rgba(120,80,200,0.18); border:1px solid #e8d8ff;
    overflow:hidden; opacity:0; transform:translateY(12px) scale(0.95);
    pointer-events:none; transition:opacity 0.25s ease,transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index:300;
  }
  #config-panel.open { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .config-form { padding:5px 10px 10px; }
  .config-label { font-size:11px; color:#9b7dcc; margin:8px 0 3px; font-weight:600; }
  .config-input {
    width:100%; border:1px solid #e0d0f8; border-radius:8px;
    padding:4px 8px; font-size:11px; outline:none;
    font-family:"PingFang SC",sans-serif; color:#333; box-sizing:border-box;
  }
  .config-input:focus { border-color:#b090e8; }
  .config-input::placeholder { color:#bbb; }
  .config-input.unconfigured::placeholder { color:#ddd; }
  .config-hint { font-size:10px; color:#bbb; margin:4px 0 0; line-height:1.4; }
  .config-save-row { margin-top:10px; }
  .config-save-row button {
    width:100%; background:#7c5cbf; color:#fff; border:none;
    border-radius:8px; padding:6px 0; font-size:12px; cursor:pointer;
  }
  .config-save-row button:hover { background:#6a4aad; }

  /* 面板 */
  #task-panel, #alarm-panel {
    position:absolute; top:43px; left:40px; width:240px;
    background:#fff; border-radius:16px;
    box-shadow:0 4px 20px rgba(120,80,200,0.18); border:1px solid #e8d8ff;
    overflow:hidden; opacity:0; transform:translateY(12px) scale(0.95);
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index:300; -webkit-app-region:no-drag;
  }
  #task-panel.open, #alarm-panel.open { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .panel-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:7px 12px 6px; font-size:13px; font-weight:600; color:#7c5cbf;
    border-bottom:1px solid #f0e8ff;
  }
  .panel-close { cursor:pointer; font-size:16px; color:#bbb; line-height:1; padding:0 2px; }
  .panel-close:hover { color:#999; }

  /* 任务 */
  .task-input-row { display:flex; gap:6px; padding:5px 10px 4px; border-bottom:1px solid #f5f0ff; }
  .task-input-row input { flex:1; border:1px solid #e0d0f8; border-radius:8px; padding:3px 8px; font-size:12px; outline:none; font-family:"PingFang SC",sans-serif; color:#333; }
  .task-input-row input:focus { border-color:#b090e8; }
  .task-input-row button { background:#7c5cbf; color:#fff; border:none; border-radius:8px; padding:3px 10px; font-size:12px; cursor:pointer; white-space:nowrap; }
  .task-input-row button:hover { background:#6a4aad; }
  .task-list { max-height:72px; overflow-y:auto; padding:4px 0; }
  .task-item { display:flex; align-items:center; gap:8px; padding:7px 12px; border-bottom:1px solid #f8f5ff; font-size:12px; color:#333; }
  .task-item:last-child { border-bottom:none; }
  .task-item input[type=checkbox] { cursor:pointer; accent-color:#7c5cbf; width:14px; height:14px; flex-shrink:0; }
  .task-item .task-text { flex:1; line-height:1.4; }
  .task-item .task-text.done { text-decoration:line-through; color:#bbb; }
  .task-item .task-del { color:#ddd; cursor:pointer; font-size:15px; flex-shrink:0; }
  .task-item .task-del:hover { color:#e55; }
  .task-empty { text-align:center; color:#ccc; font-size:12px; padding:10px 0; }

  /* 闹钟 */
  .alarm-form { padding:5px 10px 4px; border-bottom:1px solid #f5f0ff; }
  .alarm-time-row { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .alarm-time-row input { width:52px; border:1px solid #e0d0f8; border-radius:8px; padding:3px 6px; font-size:13px; text-align:center; outline:none; font-family:"PingFang SC",sans-serif; color:#333; }
  .alarm-time-row input:focus { border-color:#b090e8; }
  .alarm-time-row .colon { font-size:16px; color:#7c5cbf; font-weight:bold; }
  .alarm-label-row { display:flex; gap:6px; }
  .alarm-label-row input { flex:1; border:1px solid #e0d0f8; border-radius:8px; padding:3px 8px; font-size:12px; outline:none; font-family:"PingFang SC",sans-serif; color:#333; }
  .alarm-label-row input:focus { border-color:#b090e8; }
  .alarm-label-row button { background:#7c5cbf; color:#fff; border:none; border-radius:8px; padding:3px 10px; font-size:12px; cursor:pointer; white-space:nowrap; }
  .alarm-label-row button:hover { background:#6a4aad; }
  .alarm-list { max-height:72px; overflow-y:auto; padding:4px 0; }
  .alarm-item { display:flex; align-items:center; gap:8px; padding:7px 12px; border-bottom:1px solid #f8f5ff; font-size:12px; }
  .alarm-item:last-child { border-bottom:none; }
  .alarm-time-label { font-weight:700; color:#7c5cbf; min-width:38px; }
  .alarm-desc { flex:1; color:#555; }
  .alarm-del { color:#ddd; cursor:pointer; font-size:15px; }
  .alarm-del:hover { color:#e55; }

  /* 角色动画 */
  @keyframes pet-jump { 0%{bottom:0} 25%{bottom:28px} 55%{bottom:8px} 75%{bottom:18px} 100%{bottom:0} }
  @keyframes pet-shake { 0%,100%{transform:translateX(-50%) rotate(0)} 20%{transform:translateX(-50%) rotate(-6deg)} 40%{transform:translateX(-50%) rotate(5deg)} 60%{transform:translateX(-50%) rotate(-4deg)} 80%{transform:translateX(-50%) rotate(3deg)} }
  @keyframes pet-shake-rock { 0%,100%{transform:translateX(calc(-50% + 10px)) rotate(0)} 20%{transform:translateX(calc(-50% + 10px)) rotate(-6deg)} 40%{transform:translateX(calc(-50% + 10px)) rotate(5deg)} 60%{transform:translateX(calc(-50% + 10px)) rotate(-4deg)} 80%{transform:translateX(calc(-50% + 10px)) rotate(3deg)} }
  #pet-img.anim-jump  { animation:pet-jump 0.5s ease; }
  #pet-img.anim-shake { animation:pet-shake 0.45s ease; }
  #pet-img.outfit-rock.anim-shake { animation:pet-shake-rock 0.45s ease; }

  /* 气泡 */
  #bubble {
    position:absolute; bottom:200px; left:50%; transform:translateX(-50%);
    background:#fff; border:2px solid #c8a8f0; border-radius:14px;
    padding:8px 14px; font-size:12px; color:#555;
    width:210px; text-align:center; line-height:1.6;
    box-shadow:0 3px 14px rgba(120,80,200,0.15);
    display:none; z-index:500; pointer-events:none; -webkit-app-region:no-drag;
  }
  #bubble::after { content:''; position:absolute; bottom:-11px; left:50%; transform:translateX(-50%); border:6px solid transparent; border-top-color:#c8a8f0; }
  #bubble::before { content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); border:5px solid transparent; border-top-color:#fff; z-index:1; }

  /* AI 对话框 */
  #chat-box {
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    width:220px; background:rgba(255,255,255,0.97);
    border:1.5px solid #c8a8f0; border-radius:20px;
    padding:5px 6px 5px 12px;
    box-shadow:0 2px 12px rgba(120,80,200,0.2);
    display:none; align-items:center; gap:6px; z-index:600;
    -webkit-app-region:no-drag;
  }
  #chat-box.open { display:flex; }
  #chat-input { border:none; outline:none; font-size:12px; font-family:"PingFang SC",sans-serif; color:#333; background:transparent; flex:1; min-width:0; }
  #chat-input::placeholder { color:#bbb; }
  #chat-send { background:#7c5cbf; color:#fff; border:none; border-radius:14px; padding:4px 12px; font-size:11px; cursor:pointer; font-family:"PingFang SC",sans-serif; white-space:nowrap; flex-shrink:0; }
  #chat-send:hover { background:#6a4aad; }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble"></div>
  <img id="pet-img" src="assets/outfit1_idle.png" />
  <svg id="rest-heart" onclick="wakeUp()" width="56" height="48" viewBox="0 0 7 6" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="0" width="1" height="1" fill="#ff2244"/>
    <rect x="2" y="0" width="1" height="1" fill="#ff2244"/>
    <rect x="4" y="0" width="1" height="1" fill="#ff2244"/>
    <rect x="5" y="0" width="1" height="1" fill="#ff2244"/>
    <rect x="0" y="1" width="3" height="1" fill="#ff2244"/>
    <rect x="4" y="1" width="3" height="1" fill="#ff2244"/>
    <rect x="0" y="2" width="7" height="1" fill="#ff2244"/>
    <rect x="1" y="3" width="5" height="1" fill="#ff2244"/>
    <rect x="2" y="4" width="3" height="1" fill="#ff2244"/>
    <rect x="3" y="5" width="1" height="1" fill="#ff2244"/>
  </svg>

  <!-- 配置面板（长按小慈触发） -->
  <div id="config-panel">
    <div class="panel-header">
      <span>API 设置</span>
      <span class="panel-close" onclick="closeConfigPanel()">×</span>
    </div>
    <div class="config-form">
      <div class="config-label">API Key</div>
      <input class="config-input" id="cfg-dskey" type="password" placeholder="sk-c***（未配置）" />
      <div class="config-label">Tavily Key <span style="color:#bbb;font-weight:400;font-size:10px">可选，联网搜索</span></div>
      <input class="config-input" id="cfg-tvkey" type="password" placeholder="tvly-xxxxxxxxxxxxxxxx" />
      <div class="config-hint">保存后重启小慈生效 · 长按小慈可再次打开</div>
      <div class="config-save-row"><button onclick="saveConfig()">保存</button></div>
    </div>
  </div>

  <!-- 闹钟面板 -->
  <div id="alarm-panel">
    <div class="panel-header"><span>闹钟</span><span class="panel-close" onclick="closeAlarmPanel()">×</span></div>
    <div class="alarm-form">
      <div class="alarm-time-row">
        <input id="alarm-hour" type="number" min="0" max="23" placeholder="时"/>
        <span class="colon">:</span>
        <input id="alarm-minute" type="number" min="0" max="59" placeholder="分"/>
      </div>
      <div class="alarm-label-row">
        <input id="alarm-label" type="text" placeholder="备注（可选）" maxlength="15"/>
        <button onclick="addAlarm()">设置</button>
      </div>
    </div>
    <div class="alarm-list" id="alarm-list"></div>
  </div>

  <!-- 任务面板 -->
  <div id="task-panel">
    <div class="panel-header"><span>今日任务</span><span class="panel-close" onclick="closeTaskPanel()">×</span></div>
    <div class="task-input-row">
      <input id="task-input" type="text" placeholder="添加新任务…" maxlength="30" onkeydown="if(event.key==='Enter')addTask()"/>
      <button onclick="addTask()">添加</button>
    </div>
    <div class="task-list" id="task-list"></div>
  </div>

  <!-- 菜单按钮 -->
  <button class="r-btn" id="b-alarms" onclick="openAlarmPanel()">闹钟</button>
  <button class="r-btn" id="b-tasks"  onclick="openTaskPanel()">任务</button>
  <button class="r-btn" id="b-hide"   onclick="handleRest()">休息</button>
  <button class="r-btn" id="b-outfit" onclick="handleOutfit()">换装</button>
  <button class="r-btn danger" id="b-quit" onclick="handleQuit()">关闭</button>
  <button class="r-btn" id="b-s0"   onclick="selectOutfit(0)">街头少女</button>
  <button class="r-btn" id="b-s1"   onclick="selectOutfit(1)">摇滚歌手</button>
  <button class="r-btn" id="b-s2"   onclick="selectOutfit(2)">暗黑少女</button>
  <button class="r-btn" id="b-s3"   onclick="selectOutfit(3)">精英白领</button>
  <button class="r-btn back" id="b-back" onclick="handleBack()">← 返回</button>

  <!-- AI 对话框 -->
  <div id="chat-box">
    <input id="chat-input" type="text" placeholder="和小慈说点什么…" maxlength="80"
           onkeydown="if(event.key==='Enter')sendChat();if(event.key==='Escape')closeChat()"/>
    <button id="chat-send" onclick="sendChat()">发送</button>
  </div>

<script>
  const OUTFITS = ['assets/outfit1_idle.png','assets/outfit2_idle.png','assets/outfit3_idle.png','assets/outfit4_idle.png']

  const MSGS = {
    encourage: ['你已经很厉害了啦，继续加油喔！','每一步都算数捏，别小看自己！','再难的事，你都能撑过去的啦！','你的努力我都看见了喔，真的！','你比昨天更好了捏，这样就够了！','只要还在走，就是在赢啦！','低潮是暂时的喔，你的光不会灭！','你有资格追求你想要的生活啦！','你做的每件小事都有意义喔！','别怕啦，迈出去就赢了一半！','你的坚持，终究会有回报的喔！','你是自己最好的礼物捏！','有你在，世界会更好一点喔！','加油啦！我超看好你的！','你也太努力了吧，真的好棒棒！','偶尔软弱没关系啦，我在这里喔！','慢慢来没关系，但别停下来喔！','你值得所有美好的事情啦，真的！'],
    cute: ['我刚才一直在想你吃饭了没…你吃了吗啦？','欸，今天有没有发生什么有趣的事啦，快告诉我！','我陪着你呢，你不是一个人喔！','欸，我刚才还在想你有没有在认真努力咧！','你要记得我喔，我可是一直在这里等你的！'],
    cuteLongWait: ['哎呀，我刚才做了个梦，梦到你了～','等你的时候我数了好多颗星星喔！'],
    curious: ['你今天吃饭了吗啦？要好好吃饭喔！','欸，今天心情怎么样捏？','最近睡得好吗？要早点休息喔！','你今天有没有做到一件让自己骄傲的事啦？','欸，你有没有想做但一直没做的事咧？','最近有没有什么让你开心的小事喔？','你现在在做什么啦？很忙吗？','你有没有喝水啦？去喝一杯再回来！','今天天气怎么样捏？有没有出去走走？','你有什么想跟我说的吗啦？我在听喔！','欸，你今天有没有对自己好一点啦？','你最近有没有做什么新鲜的事咧？','今天有没有遇到什么让你烦恼的事喔？说来听听！','你知道吗，我超好奇你今天过得怎么样啦！','欸，你有没有什么小目标想完成啦？','你今天笑了几次捏？要多笑一点喔！'],
  }

  let lastInteractTime = Date.now()
  function recordInteract() { lastInteractTime = Date.now() }
  function getTimePrefix() {
    const h = new Date().getHours()
    if (h>=5&&h<9) return '早安！'
    if (h>=9&&h<12) return '上午好～'
    if (h>=12&&h<14) return '吃午饭了吗？'
    if (h>=14&&h<18) return ''
    if (h>=18&&h<21) return '晚上好！'
    if (h>=21&&h<24) return '这么晚了，'
    return '这么晚还没睡啊，'
  }
  function pickMsg() {
    const longWait = (Date.now()-lastInteractTime)/3600000 >= 3
    let types = ['encourage','encourage','encourage','cute','curious','curious']
    if (longWait) types = types.concat(['cuteLongWait','cuteLongWait','cuteLongWait'])
    const type = types[Math.floor(Math.random()*types.length)]
    const pool = MSGS[type]
    const text = pool[Math.floor(Math.random()*pool.length)]
    return (Math.random()<0.3 ? getTimePrefix() : '') + text
  }

  const L1 = [{id:'b-alarms',tx:0,ty:-100},{id:'b-tasks',tx:-58,ty:-69},{id:'b-hide',tx:58,ty:-69},{id:'b-outfit',tx:-85,ty:-31},{id:'b-quit',tx:85,ty:-31}]
  const L2 = [{id:'b-s0',tx:0,ty:-100},{id:'b-s1',tx:-75,ty:-60},{id:'b-s2',tx:75,ty:-60},{id:'b-s3',tx:-88,ty:-18},{id:'b-back',tx:88,ty:-18}]

  let currentLevel=0, bubbleTimer=null, lastClickTime=0, singleClickTimer=null
  let alarmRinging=false
  const ringSet = new Set()

  function showBubble(text, ms=4000) {
    clearTimeout(bubbleTimer)
    const b = document.getElementById('bubble')
    b.textContent = text; b.style.display='block'
    if (ms > 0) bubbleTimer = setTimeout(()=>b.style.display='none', ms)
  }
  function show(el,tx,ty,delay=0) {
    setTimeout(()=>{ el.style.transform=`translate(-50%,-50%) translate(${tx}px,${ty}px) scale(1)`; el.style.opacity='1'; el.style.pointerEvents='auto' }, delay)
  }
  function hide(el) {
    el.style.transition='transform 0.12s ease-in, opacity 0.10s ease'
    el.style.transform='translate(-50%,-50%) scale(0)'; el.style.opacity='0'; el.style.pointerEvents='none'
    setTimeout(()=>{ el.style.transition='transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.22s ease' }, 200)
  }
  function openL1() {
    currentLevel=1
    const delays=[0,60,60,120,120]
    L1.forEach(({id,tx,ty},i)=>show(document.getElementById(id),tx,ty,delays[i]))
  }
  function closeAll() {
    currentLevel=0
    ;[...L1,...L2].forEach(({id})=>hide(document.getElementById(id)))
    document.getElementById('task-panel').classList.remove('open')
    document.getElementById('alarm-panel').classList.remove('open')
    document.getElementById('chat-box').classList.remove('open')
  }

  // 双击鼓励
  function showEncouragement() {
    recordInteract(); showBubble(pickMsg(), 5000)
    const anim = Math.random()<0.5 ? 'anim-jump' : 'anim-shake'
    const img = document.getElementById('pet-img')
    img.classList.remove('anim-jump','anim-shake'); void img.offsetWidth
    img.classList.add(anim)
    img.addEventListener('animationend',()=>img.classList.remove(anim),{once:true})
  }

  // 右键 AI 对话
  function openChat() { closeAll(); currentLevel=5; document.getElementById('chat-box').classList.add('open'); setTimeout(()=>document.getElementById('chat-input').focus(),50) }
  function closeChat() { document.getElementById('chat-box').classList.remove('open'); currentLevel=0 }

  let chatHistory=JSON.parse(localStorage.getItem('xiaoci_chat')||'[]')
  function saveChatHistory() { localStorage.setItem('xiaoci_chat', JSON.stringify(chatHistory.slice(-100))) }
  async function sendChat() {
    const input = document.getElementById('chat-input')
    const text = input.value.trim()
    if (!text) return
    input.value = ''
    if (text.length>15) showBubble('嗯嗯，让我想想…', 10000)
    try {
      const savedCfg = JSON.parse(localStorage.getItem('xiaoci_config') || '{}')
      const result = await window.electronAPI.sendChat(text, chatHistory, tasks, savedCfg)
      const { reply, action } = result
      chatHistory.push({role:'user',content:text})
      chatHistory.push({role:'assistant',content:reply})
      if (chatHistory.length>100) chatHistory=chatHistory.slice(-100)
      saveChatHistory()
      if (action) executeAction(action)
      showBubble(reply, 7000)
    } catch { showBubble('欸，网络有点问题啦，等下再试试喔～', 4000) }
  }

  function executeAction({name, params}) {
    if (name==='set_alarm') {
      const h=parseInt(params.hour), m=parseInt(params.minute)
      if (!isNaN(h)&&!isNaN(m)&&h>=0&&h<=23&&m>=0&&m<=59) { alarms.push({id:alarmId++,h,m,label:params.label||''}); saveAlarms(); renderAlarms() }
    } else if (name==='add_task') {
      if (params.text) { tasks.push({id:nextId++,text:params.text,done:false}); saveTasks(); renderTasks() }
    } else if (name==='complete_task') {
      const kw=(params.keyword||'').toLowerCase()
      const t=tasks.find(t=>t.text.toLowerCase().includes(kw))
      if (t) { t.done=true; saveTasks(); renderTasks() }
    } else if (name==='delete_task') {
      const kw=(params.keyword||'').toLowerCase()
      tasks=tasks.filter(t=>!t.text.toLowerCase().includes(kw)); saveTasks(); renderTasks()
    }
  }

  // ── 拖拽 + 长按设置 ──
  let isDragging=false, dragMoved=false, dragStartX=0, dragStartY=0
  let longPressTimer=null
  const petImg = document.getElementById('pet-img')

  petImg.addEventListener('mousedown', e => {
    if (e.button !== 0) return
    isDragging = true; dragMoved = false
    dragStartX = e.screenX; dragStartY = e.screenY
    longPressTimer = setTimeout(() => {
      longPressTimer = null
      if (!dragMoved) openConfigPanel()
    }, 500)
    e.preventDefault()
  })
  document.addEventListener('mousemove', e => {
    if (!isDragging) return
    const dx = e.screenX - dragStartX, dy = e.screenY - dragStartY
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
      dragMoved = true
      clearTimeout(longPressTimer); longPressTimer = null
      window.electronAPI.moveWindow(dx, dy)
      dragStartX = e.screenX; dragStartY = e.screenY
    }
  })
  document.addEventListener('mouseup', () => { isDragging = false; clearTimeout(longPressTimer) })

  // ── 点击逻辑（拖拽/长按时不触发）──
  petImg.addEventListener('click', e => {
    e.preventDefault()
    if (dragMoved) { dragMoved = false; return }
    if (!longPressTimer && Date.now() - lastClickTime > 600) return  // 长按后忽略 click
    if (alarmRinging) { dismissAlarm(); return }
    const now = Date.now(); clearTimeout(singleClickTimer)
    if (now-lastClickTime<350) { showEncouragement() }
    else { singleClickTimer=setTimeout(()=>{ if(currentLevel===0)openL1(); else closeAll() },180) }
    lastClickTime=now
  })
  petImg.addEventListener('contextmenu', e=>{ e.preventDefault(); openChat() })

  // 换装
  function handleOutfit() { clearTimeout(singleClickTimer); currentLevel=2; L1.forEach(({id})=>hide(document.getElementById(id))); setTimeout(()=>{ const d=[0,60,60,120,120]; L2.forEach(({id,tx,ty},i)=>show(document.getElementById(id),tx,ty,d[i])) },250) }
  function selectOutfit(i) {
    const names=['街头少女','摇滚歌手','暗黑少女','精英白领']
    const img=document.getElementById('pet-img'); img.src=OUTFITS[i]; img.classList.toggle('outfit-rock',i===1)
    localStorage.setItem('outfit',i); showBubble(`欸！我换上${names[i]}啦，好看吗 ✨`,3000); closeAll()
  }
  function handleBack() { currentLevel=1; L2.forEach(({id})=>hide(document.getElementById(id))); setTimeout(openL1,200) }

  // 任务
  let tasks=JSON.parse(localStorage.getItem('xiaoci_tasks')||localStorage.getItem('tasks')||'[]')
  let nextId=tasks.length?Math.max(...tasks.map(t=>t.id))+1:1
  function saveTasks() {
    localStorage.setItem('xiaoci_tasks',JSON.stringify(tasks))
    archiveTasks()
  }
  function archiveTasks() {
    const today=new Date()
    const key=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`
    const archive=JSON.parse(localStorage.getItem('xiaoci_archive')||'{}')
    if (tasks.length) archive[key]=tasks.map(t=>({text:t.text,done:t.done}))
    const cutoff=new Date(today); cutoff.setDate(cutoff.getDate()-30)
    Object.keys(archive).forEach(k=>{if(new Date(k)<cutoff)delete archive[k]})
    localStorage.setItem('xiaoci_archive',JSON.stringify(archive))
  }
  function loadTasks() { /* tasks already loaded above */ }
  function openTaskPanel() { clearTimeout(singleClickTimer); currentLevel=3; L1.forEach(({id})=>hide(document.getElementById(id))); setTimeout(()=>document.getElementById('task-panel').classList.add('open'),250) }
  function closeTaskPanel() { document.getElementById('task-panel').classList.remove('open'); currentLevel=0 }
  function renderTasks() {
    const list=document.getElementById('task-list')
    if (!tasks.length) { list.innerHTML='<div class="task-empty">还没有任务，加一个吧 🌸</div>'; return }
    list.innerHTML=tasks.map(t=>`<div class="task-item"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id})"/><span class="task-text ${t.done?'done':''}">${t.text}</span><span class="task-del" onclick="deleteTask(${t.id})">×</span></div>`).join('')
  }
  function addTask() { const input=document.getElementById('task-input'),text=input.value.trim(); if(!text)return; tasks.push({id:nextId++,text,done:false}); input.value=''; renderTasks(); saveTasks() }
  function toggleTask(id) { const t=tasks.find(t=>t.id===id); if(t){t.done=!t.done;renderTasks();saveTasks()} }
  function deleteTask(id) { tasks=tasks.filter(t=>t.id!==id); renderTasks(); saveTasks() }

  // 闹钟
  let alarms=[], alarmId=1
  function saveAlarms() { localStorage.setItem('alarms',JSON.stringify(alarms)) }
  function loadAlarms() { alarms=JSON.parse(localStorage.getItem('alarms')||'[]'); alarmId=alarms.length?Math.max(...alarms.map(a=>a.id))+1:1 }
  function openAlarmPanel() { clearTimeout(singleClickTimer); currentLevel=4; L1.forEach(({id})=>hide(document.getElementById(id))); setTimeout(()=>{ document.getElementById('alarm-panel').classList.add('open'); renderAlarms() },250) }
  function closeAlarmPanel() { document.getElementById('alarm-panel').classList.remove('open'); currentLevel=0 }
  function renderAlarms() {
    const list=document.getElementById('alarm-list')
    if (!alarms.length) { list.innerHTML='<div class="task-empty">还没有闹钟 ⏰</div>'; return }
    list.innerHTML=alarms.map(a=>`<div class="alarm-item"><span class="alarm-time-label">${String(a.h).padStart(2,'0')}:${String(a.m).padStart(2,'0')}</span><span class="alarm-desc">${a.label||'提醒'}</span><span class="alarm-del" onclick="deleteAlarm(${a.id})">×</span></div>`).join('')
  }
  function addAlarm() {
    const h=parseInt(document.getElementById('alarm-hour').value), m=parseInt(document.getElementById('alarm-minute').value), label=document.getElementById('alarm-label').value.trim()
    if(isNaN(h)||isNaN(m)||h<0||h>23||m<0||m>59)return
    alarms.push({id:alarmId++,h,m,label}); document.getElementById('alarm-hour').value=''; document.getElementById('alarm-minute').value=''; document.getElementById('alarm-label').value=''; renderAlarms(); saveAlarms()
  }
  function deleteAlarm(id) { alarms=alarms.filter(a=>a.id!==id); renderAlarms(); saveAlarms() }

  // 闹钟响铃
  function ringAlarm(label) {
    alarmRinging=true; clearTimeout(bubbleTimer)
    const b=document.getElementById('bubble')
    b.textContent=`⏰ ${label||'时间到啦！'} 单击小慈关闭喔～`; b.style.display='block'
  }
  function dismissAlarm() { alarmRinging=false; document.getElementById('bubble').style.display='none' }

  // 休息
  let restTimer=null
  function handleRest() { clearTimeout(singleClickTimer); closeAll(); document.getElementById('pet-img').style.display='none'; document.getElementById('rest-heart').style.display='block'; clearTimeout(restTimer); restTimer=setTimeout(wakeUp,2*60*60*1000) }
  function wakeUp() { clearTimeout(restTimer); document.getElementById('rest-heart').style.display='none'; document.getElementById('pet-img').style.display=''; currentLevel=0; showBubble('欸！你回来啦～我等你好久了 🌸',4000) }

  // 关闭
  function handleQuit() { window.electronAPI.quit() }

  // ── 配置面板 ──
  function makeMask(key) { return '•'.repeat(key.length) }
  function openConfigPanel() {
    clearTimeout(singleClickTimer)
    closeAll()
    const saved = JSON.parse(localStorage.getItem('xiaoci_config') || '{}')
    const dskeyEl = document.getElementById('cfg-dskey')
    const tvkeyEl = document.getElementById('cfg-tvkey')
    if (saved.deepseekKey) {
      dskeyEl.value = makeMask(saved.deepseekKey)
      dskeyEl.placeholder = ''; dskeyEl.classList.remove('unconfigured')
    } else {
      dskeyEl.value = ''; dskeyEl.placeholder = 'sk-c***（未配置）'
      dskeyEl.classList.add('unconfigured')
    }
    if (saved.tavilyKey) {
      tvkeyEl.value = makeMask(saved.tavilyKey)
      tvkeyEl.placeholder = ''; tvkeyEl.classList.remove('unconfigured')
    } else {
      tvkeyEl.value = ''; tvkeyEl.placeholder = 'tvly-***（未配置）'
      tvkeyEl.classList.add('unconfigured')
    }
    dskeyEl.oninput = () => {
      if (!dskeyEl.value) { dskeyEl.placeholder='sk-c***（未配置）'; dskeyEl.classList.add('unconfigured') }
      else dskeyEl.classList.remove('unconfigured')
    }
    tvkeyEl.oninput = () => {
      if (!tvkeyEl.value) { tvkeyEl.placeholder='tvly-***（未配置）'; tvkeyEl.classList.add('unconfigured') }
      else tvkeyEl.classList.remove('unconfigured')
    }
    setTimeout(() => document.getElementById('config-panel').classList.add('open'), 50)
  }
  function closeConfigPanel() {
    document.getElementById('config-panel').classList.remove('open')
    document.getElementById('cfg-dskey').value = ''
    document.getElementById('cfg-tvkey').value = ''
  }
  function saveConfig() {
    const saved = JSON.parse(localStorage.getItem('xiaoci_config') || '{}')
    const dsRaw = document.getElementById('cfg-dskey').value.trim()
    const tvRaw = document.getElementById('cfg-tvkey').value.trim()
    const isMasked = s => s.length > 0 && /^•+$/.test(s)
    const ds = isMasked(dsRaw) ? saved.deepseekKey : dsRaw
    const tv = isMasked(tvRaw) ? saved.tavilyKey  : tvRaw
    localStorage.setItem('xiaoci_config', JSON.stringify({ deepseekKey: ds, tavilyKey: tv }))
    closeConfigPanel()
    showBubble('保存好啦！重启小慈后生效喔 ✨', 4000)
  }

  // 每分钟：闹钟 + 子夜复盘
  let midnightReviewDate=''
  setInterval(()=>{
    const now=new Date(), hh=now.getHours(), mm=now.getMinutes()
    const dateKey=`${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`
    const ringKey=`${hh}:${mm}`
    if (!ringSet.has(ringKey)) {
      alarms.forEach(a=>{ if(a.h===hh&&a.m===mm){ ringSet.add(ringKey); ringAlarm(a.label) } })
      if (ringSet.size>30) ringSet.clear()
    }
    if (hh===23&&mm===59&&midnightReviewDate!==dateKey&&tasks.length) {
      midnightReviewDate=dateKey
      const done=tasks.filter(t=>t.done).length
      const summary=tasks.map(t=>`${t.done?'✅':'⬜'}${t.text}`).join('、')
      chatHistory=[{role:'system',content:`用户今日任务完成情况（${done}/${tasks.length}）：${summary}。请用温柔的语气询问用户今天任务完成情况如何，根据他的回复给予鼓励。`}]
      showBubble(`欸～快到零点了喔！今天的任务完成得怎么样啦？(${done}/${tasks.length} 已完成)`,8000)
      setTimeout(()=>openChat(),2000)
    }
  },60000)

  // 点空白收起
  document.body.addEventListener('click', e=>{
    if (e.target.classList.contains('r-btn')) return
    if (e.target.id==='pet-img'||e.target.id==='rest-heart') return
    if (e.target.closest('#task-panel')||e.target.closest('#alarm-panel')||e.target.closest('#chat-box')) return
    if (currentLevel===1||currentLevel===2) closeAll()
  })

  // 初始化
  ;(function init(){
    loadTasks(); loadAlarms(); renderTasks(); renderAlarms()
    const savedOutfit=parseInt(localStorage.getItem('outfit')||'0')
    if (savedOutfit>0) { const img=document.getElementById('pet-img'); img.src=OUTFITS[savedOutfit]; img.classList.toggle('outfit-rock',savedOutfit===1) }
  })()
</script>
</div>
</body>
</html>
