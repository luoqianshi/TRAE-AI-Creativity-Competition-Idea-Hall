<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>动境物理 · 一拍即现的3D物理实验室</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
  <style>
:root {
  --bg-0: #0a0e1a;
  --bg-1: #141927;
  --bg-2: #1c2234;
  --bg-3: #242b40;
  --line: #2e3550;
  --text-0: #f0f3fa;
  --text-1: #b4bbd0;
  --text-2: #7a8196;
  --accent: #7c5cff;
  --accent-2: #5ce1ff;
  --accent-3: #ffb35c;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: radial-gradient(ellipse at top, #1a2040 0%, var(--bg-0) 60%);
  color: var(--text-0);
  overflow: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; outline: none; }
.hidden { display: none !important; }

.btn-primary {
  background: linear-gradient(135deg, var(--accent), #5c88ff);
  color: #fff;
  padding: 11px 22px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  transition: transform 0.15s ease, box-shadow 0.2s ease;
}
.btn-primary:hover { transform: translateY(-1px); }
.btn-primary.full { width: 100%; margin-top: 12px; }

.btn-ghost {
  background: var(--bg-3);
  color: var(--text-1);
  padding: 10px 18px;
  border-radius: var(--radius);
  font-size: 13px;
  transition: background 0.15s ease;
  margin-top: 8px;
}
.btn-ghost:hover { background: #2e3555; color: var(--text-0); }
.btn-ghost.full { width: 100%; }

.intro {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  background: radial-gradient(circle at 30% 20%, rgba(124, 92, 255, 0.25), transparent 45%),
              radial-gradient(circle at 70% 80%, rgba(92, 225, 255, 0.2), transparent 45%),
              var(--bg-0);
}
.intro-inner { text-align: center; max-width: 600px; padding: 40px; }
.intro-badge {
  display: inline-block;
  padding: 6px 16px;
  background: rgba(124, 92, 255, 0.15);
  border: 1px solid rgba(124, 92, 255, 0.4);
  color: var(--accent-2);
  border-radius: 100px;
  font-size: 12px;
  margin-bottom: 24px;
}
.intro-title {
  font-size: 56px;
  font-weight: 700;
  margin: 0;
  background: linear-gradient(135deg, #fff 0%, #aaccff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.intro-subtitle { font-size: 20px; color: var(--text-1); margin: 12px 0 20px; }
.intro-desc { font-size: 15px; color: var(--text-2); line-height: 1.8; margin-bottom: 36px; }
#startBtn { font-size: 16px; padding: 14px 40px; }
.intro-hint { margin-top: 20px; font-size: 12px; color: var(--text-2); }

.app { display: flex; height: 100vh; width: 100vw; }

.sidebar {
  width: 400px;
  min-width: 400px;
  background: var(--bg-1);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.sidebar-header { padding: 24px; border-bottom: 1px solid var(--line); }
.logo { font-size: 18px; font-weight: 700; }
.subtitle { font-size: 12px; color: var(--text-2); margin-top: 4px; }

.panel { padding: 20px 24px; border-bottom: 1px solid var(--line); }
.panel-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-0);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
}
.step {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #0a0e1a;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  margin-right: 10px;
}

#problemInput {
  width: 100%;
  min-height: 96px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  color: var(--text-0);
  padding: 12px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  resize: vertical;
  font-family: inherit;
}
#problemInput:focus { outline: none; border-color: var(--accent); }

.example-row {
  margin-top: 10px;
  font-size: 12px;
  color: var(--text-2);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  background: var(--bg-3);
  color: var(--text-1);
  padding: 5px 12px;
  border-radius: 100px;
  font-size: 11px;
  transition: all 0.15s ease;
}
.chip:hover { background: var(--accent); color: #fff; }

.parsed-summary {
  background: linear-gradient(135deg, rgba(124, 92, 255, 0.1), rgba(92, 225, 255, 0.08));
  border: 1px solid rgba(124, 92, 255, 0.3);
  padding: 12px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  color: var(--text-0);
  line-height: 1.7;
  margin-bottom: 16px;
}

.param-group { margin-bottom: 14px; }
.param-group label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--text-1);
  margin-bottom: 6px;
}
.param-group .val { color: var(--accent-2); font-weight: 600; font-family: monospace; }
.param-group input[type="range"] {
  width: 100%;
  -webkit-appearance: none;
  height: 4px;
  background: var(--bg-3);
  border-radius: 4px;
  outline: none;
}
.param-group input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 50%;
  cursor: pointer;
}

.info-card {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 14px;
}
.info-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  padding: 6px 0;
}
.info-row + .info-row { border-top: 1px solid var(--line); }
.info-label { color: var(--text-2); }
.info-val { color: var(--accent-2); font-weight: 600; font-family: monospace; }

.controls { display: flex; gap: 8px; margin-top: 4px; }
.controls button { flex: 1; margin-top: 0; padding: 10px 8px; font-size: 12px; }

.back-controls {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.back-controls button { font-size: 12px; }

.tip {
  font-size: 12px;
  color: var(--text-2);
  margin-top: 12px;
  padding: 8px 10px;
  background: var(--bg-2);
  border-radius: 8px;
}

.sidebar-footer {
  margin-top: auto;
  padding: 16px 24px;
  font-size: 11px;
  color: var(--text-2);
  text-align: center;
  border-top: 1px solid var(--line);
}

.scene-wrap {
  flex: 1;
  position: relative;
  background: radial-gradient(circle at 50% 30%, rgba(92, 120, 255, 0.15), transparent 60%), var(--bg-0);
}
.scene-container { width: 100%; height: 100%; }
.scene-banner {
  position: absolute;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 20px;
  background: rgba(20, 25, 39, 0.7);
  border: 1px solid var(--line);
  border-radius: 100px;
  font-size: 13px;
  color: var(--text-1);
}

@media (max-width: 900px) {
  .sidebar { width: 340px; min-width: 340px; }
  .intro-title { font-size: 40px; }
}
  </style>
</head>
<body>
  <section id="intro" class="intro">
    <div class="intro-inner">
      <div class="intro-badge">TRAE × 学习工作赛道</div>
      <h1 class="intro-title">动境物理</h1>
      <p class="intro-subtitle">一拍即现的 3D 物理实验室</p>
      <p class="intro-desc">
        输入一道物理题，让抽象的运动过程真正"动起来"。<br />
        自由落体 · 斜面滑动 · 碰撞反弹，随时改变参数，随时重新观察。
      </p>
      <button id="startBtn" class="btn-primary">开始体验 →</button>
      <div class="intro-hint">建议使用 Chrome / Edge 浏览器</div>
    </div>
  </section>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="logo">⚛ 动境物理</div>
        <div class="subtitle">把题目变成看得见的实验</div>
      </header>

      <section class="panel" id="panelInput">
        <div class="panel-title"><span class="step">1</span>输入物理题</div>
        <textarea id="problemInput" placeholder="例如：质量为 2kg 的小球从高度 10m 处自由落下"></textarea>
        <div class="example-row">
          <span>试试：</span>
          <button class="chip" data-example="fall">自由落体</button>
          <button class="chip" data-example="incline">斜面滑动</button>
          <button class="chip" data-example="collision">两球碰撞</button>
          <button class="chip" data-example="projectile">斜抛运动</button>
        </div>
        <button id="parseBtn" class="btn-primary full">🧠 AI 解析题目</button>
      </section>

      <section class="panel hidden" id="panelParams">
        <div class="panel-title"><span class="step">2</span>确认 / 调整参数</div>
        <div class="parsed-summary" id="parsedSummary"></div>

        <div class="param-group">
          <label>小球质量 (kg) <span class="val" id="massVal">2</span></label>
          <input type="range" id="massSlider" min="0.1" max="10" step="0.1" value="2" />
        </div>
        <div class="param-group" id="heightGroup">
          <label>初始高度 (m) <span class="val" id="heightVal">10</span></label>
          <input type="range" id="heightSlider" min="1" max="30" step="0.5" value="10" />
        </div>
        <div class="param-group hidden" id="angleGroup">
          <label>斜面角度 (°) <span class="val" id="angleVal">30</span></label>
          <input type="range" id="angleSlider" min="5" max="85" step="1" value="30" />
        </div>
        <div class="param-group">
          <label>重力加速度 g (m/s²) <span class="val" id="gravityVal">9.8</span></label>
          <input type="range" id="gravitySlider" min="1" max="25" step="0.1" value="9.8" />
        </div>
        <div class="param-group hidden" id="frictionGroup">
          <label>摩擦系数 μ <span class="val" id="frictionVal">0.2</span></label>
          <input type="range" id="frictionSlider" min="0" max="1" step="0.01" value="0.2" />
        </div>

        <button id="runBtn" class="btn-primary full">▶ 生成 3D 场景</button>
        <button id="resetBtn" class="btn-ghost full">重新输入题目</button>
      </section>

      <section class="panel hidden" id="panelRun">
        <div class="panel-title"><span class="step">3</span>实时观察 · 交互</div>

        <div class="info-card">
          <div class="info-row"><span class="info-label">运动时间</span><span class="info-val" id="infoTime">0.00 s</span></div>
          <div class="info-row"><span class="info-label">当前速度</span><span class="info-val" id="infoVelocity">0.00 m/s</span></div>
          <div class="info-row"><span class="info-label">下落高度</span><span class="info-val" id="infoHeight">0.00 m</span></div>
        </div>

        <div class="controls">
          <button id="playBtn" class="btn-primary">▶ 播放</button>
          <button id="pauseBtn" class="btn-ghost">⏸ 暂停</button>
          <button id="restartBtn" class="btn-ghost">↺ 重置</button>
        </div>

        <div class="back-controls">
          <button id="backToParamsBtn" class="btn-ghost full">↩ 修改参数</button>
          <button id="backToInputBtn" class="btn-ghost full">← 重新输入题目</button>
        </div>

        <div class="tip">💡 拖动场景可旋转视角 · 滚轮缩放</div>
      </section>

      <footer class="sidebar-footer">© 动境物理 · TRAE 作品</footer>
    </aside>

    <main class="scene-wrap">
      <div id="sceneContainer" class="scene-container"></div>
      <div class="scene-banner" id="sceneBanner">🌟 在左侧输入题目，或点击示例按钮直接体验</div>
    </main>
  </div>

  <script>
function extractMass(text) {
  const m = text.match(/(\d+\.?\d*)\s*(kg|千克|公斤|g|克)/i);
  if (m) {
    let val = parseFloat(m[1]);
    if (m[2].toLowerCase() === 'g' || m[2].toLowerCase() === '克') val /= 1000;
    return val;
  }
  return null;
}

function extractHeight(text) {
  const m = text.match(/(?:高度|高处|高).{0,6}?(\d+\.?\d*)\s*(m|米)/i)
             || text.match(/(\d+\.?\d*)\s*(m|米)(?!.*(秒|s|度|°|角度))/i);
  if (m) return parseFloat(m[1]);
  return null;
}

function extractAngle(text) {
  const m = text.match(/(\d+\.?\d*)\s*(°|度)(?!.*?(角|角度))?/);
  if (m) return parseFloat(m[1]);
  return null;
}

function extractVelocity(text) {
  const m = text.match(/(?:速度|初速度|以).{0,10}?(\d+\.?\d*)\s*(m\/s|米\/秒|米每秒)/i)
             || text.match(/(\d+\.?\d*)\s*(m\/s|米\/秒|米每秒)/i);
  if (m) return parseFloat(m[1]);
  return null;
}

function extractFriction(text) {
  const m = text.match(/(?:摩擦系数|动摩擦因数|μ).{0,10}?(\d\.?\d*|\d?\.\d+)/);
  if (m) return parseFloat(m[1]);
  return null;
}

function detectType(text) {
  if (/(碰撞|相撞|撞|反弹)/.test(text)) return 'collision';
  if (/(斜面|倾角|斜面上)/.test(text)) return 'incline';
  if (/(斜抛|平抛|抛出|抛射)/.test(text)) return 'projectile';
  return 'free_fall';
}

function defaultParams(type) {
  switch (type) {
    case 'free_fall': return { mass: 2, height: 10, gravity: 9.8 };
    case 'incline': return { mass: 2, height: 5, angle: 30, gravity: 9.8, friction: 0.2 };
    case 'collision': return { mass: 2, mass2: 3, height: 5, velocity: 4, gravity: 9.8 };
    case 'projectile': return { mass: 1, height: 2, angle: 45, velocity: 10, gravity: 9.8 };
    default: return { mass: 2, height: 10, gravity: 9.8 };
  }
}

function buildSummary(type, params) {
  let scenario = '';
  switch (type) {
    case 'free_fall': scenario = `自由落体 · 质量 ${params.mass} kg，高度 ${params.height} m`; break;
    case 'incline': scenario = `斜面滑动 · 倾角 ${params.angle}°，摩擦系数 ${params.friction}`; break;
    case 'collision': scenario = `两球碰撞 · 小球1质量 ${params.mass} kg，速度 ${params.velocity} m/s`; break;
    case 'projectile': scenario = `斜抛运动 · 初速度 ${params.velocity} m/s，仰角 ${params.angle}°`; break;
  }
  return `识别到：${scenario}。下方可继续微调参数。`;
}

function parseProblem(rawText) {
  const text = (rawText || '').trim();
  if (!text) {
    return { type: 'free_fall', summary: '未输入题目，使用默认场景：自由落体', params: defaultParams('free_fall') };
  }
  const type = detectType(text);
  const base = defaultParams(type);
  const params = {
    ...base,
    ...(extractMass(text) !== null && { mass: extractMass(text) }),
    ...(extractHeight(text) !== null && { height: extractHeight(text) }),
    ...(extractAngle(text) !== null && { angle: extractAngle(text) }),
    ...(extractVelocity(text) !== null && { velocity: extractVelocity(text) }),
    ...(extractFriction(text) !== null && { friction: extractFriction(text) }),
  };
  return { type, summary: buildSummary(type, params), params };
}

const EXAMPLE_PROBLEMS = {
  fall: '质量为 2kg 的小球从高度 10m 处自由落下，忽略空气阻力。',
  incline: '一个物体在倾角 30° 的光滑斜面顶部从静止开始下滑，斜面高 5m，动摩擦因数 0.2。',
  collision: '质量为 2kg 的小球以 4m/s 的速度在光滑水平面上运动，与前方静止的 3kg 小球发生碰撞。',
  projectile: '一物体从高 2m 的平台上以 10m/s 的速度、仰角 45° 斜向上抛出。',
};

class PhysicsScene {
  constructor(container) {
    this.container = container;
    this.running = false;
    this.elapsed = 0;
    this.currentType = null;
    this.currentParams = null;
    this.initialState = null;
    this.onTick = null;
    this._initThree();
    this._initCannon();
    this._bindResize();
    this._startLoop();
  }

  _initThree() {
    const w = this.container.clientWidth;
    const h = this.container.clientHeight;

    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.Fog(0x0a0e1a, 25, 80);

    this.camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
    this.camera.position.set(10, 10, 16);

    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    this.renderer.setSize(w, h);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.shadowMap.enabled = true;
    this.container.appendChild(this.renderer.domElement);

    this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.08;
    this.controls.minDistance = 5;
    this.controls.maxDistance = 50;
    this.controls.target.set(0, 3, 0);

    const ambient = new THREE.AmbientLight(0x8090b0, 0.6);
    this.scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    this.scene.add(dirLight);

    const accentLight = new THREE.PointLight(0x7c5cff, 1.5, 30);
    accentLight.position.set(-8, 8, 6);
    this.scene.add(accentLight);

    const accentLight2 = new THREE.PointLight(0x5ce1ff, 0.8, 30);
    accentLight2.position.set(8, 4, -8);
    this.scene.add(accentLight2);

    this.meshes = [];
  }

  _initCannon() {
    this.world = new CANNON.World();
    this.world.gravity.set(0, -9.8, 0);
    this.world.broadphase = new CANNON.NaiveBroadphase();
    this.world.solver.iterations = 10;
    this.bodies = [];
  }

  _clear() {
    for (const m of this.meshes) {
      this.scene.remove(m);
      if (m.geometry) m.geometry.dispose();
      if (m.material) {
        if (Array.isArray(m.material)) m.material.forEach(x => x.dispose());
        else m.material.dispose();
      }
    }
    this.meshes = [];
    for (const b of this.bodies) this.world.removeBody(b);
    this.bodies = [];
  }

  loadScenario(type, params) {
    this.currentType = type;
    this.currentParams = { ...params };
    this._clear();
    this.elapsed = 0;
    this.world.gravity.set(0, -(params.gravity || 9.8), 0);

    switch (type) {
      case 'free_fall': this._buildFreeFall(params); break;
      case 'incline': this._buildIncline(params); break;
      case 'collision': this._buildCollision(params); break;
      case 'projectile': this._buildProjectile(params); break;
      default: this._buildFreeFall(params);
    }
    this._saveInitialState();
  }

  _buildFreeFall(params) {
    const { mass = 2, height = 10 } = params;
    this._addGround(12);
    this._addBall(0.5, mass, 0x7c5cff, { x: 0, y: height, z: 0 });
    this._addHeightMarker(height);
  }

  _buildIncline(params) {
    const { mass = 2, height = 5, angle = 30, friction = 0.2 } = params;
    const rad = angle * Math.PI / 180;
    const slopeLength = height / Math.sin(rad);

    this._addGround(14);

    const slopeGeo = new THREE.BoxGeometry(slopeLength, 0.3, 4);
    const slopeMat = new THREE.MeshStandardMaterial({ color: 0x4a5280, roughness: 0.8 });
    const slope = new THREE.Mesh(slopeGeo, slopeMat);
    slope.position.set((slopeLength * Math.cos(rad)) / 2, height / 2, 0);
    slope.rotation.z = -rad;
    this.scene.add(slope);
    this.meshes.push(slope);

    const slopeShape = new CANNON.Box(new CANNON.Vec3(slopeLength / 2, 0.15, 2));
    const slopeMaterial = new CANNON.Material();
    slopeMaterial.friction = friction;
    slopeMaterial.restitution = 0;
    const slopeBody = new CANNON.Body({ mass: 0, material: slopeMaterial });
    slopeBody.addShape(slopeShape);
    slopeBody.position.copy(slope.position);
    slopeBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), -rad);
    this.world.addBody(slopeBody);
    this.bodies.push(slopeBody);

    this._addBall(0.4, mass, 0xffb35c, { x: 0.4, y: height + 0.4, z: 0 });

    const support = new THREE.Mesh(new THREE.BoxGeometry(slopeLength * Math.cos(rad), 0.3, 4), slopeMat);
    support.position.set((slopeLength * Math.cos(rad)) / 2, -0.15, 0);
    this.scene.add(support);
    this.meshes.push(support);
  }

  _buildCollision(params) {
    const { mass = 2, mass2 = 3, velocity = 4 } = params;
    this._addGround(16);
    const ballA = this._addBall(0.6, mass, 0x7c5cff, { x: -6, y: 0.6, z: 0 });
    ballA.body.velocity.x = velocity;
    this._addBall(0.75, mass2, 0x5ce1ff, { x: 2, y: 0.75, z: 0 });
  }

  _buildProjectile(params) {
    const { mass = 1, height = 2, angle = 45, velocity = 10 } = params;
    const rad = angle * Math.PI / 180;

    this._addGround(20);

    const platform = new THREE.Mesh(
      new THREE.BoxGeometry(3, 0.3, 3),
      new THREE.MeshStandardMaterial({ color: 0x4a5280, roughness: 0.8 })
    );
    platform.position.set(0, height - 0.15, 0);
    this.scene.add(platform);
    this.meshes.push(platform);

    const platformBody = new CANNON.Body({ mass: 0 });
    platformBody.addShape(new CANNON.Box(new CANNON.Vec3(1.5, 0.15, 1.5)));
    platformBody.position.copy(platform.position);
    this.world.addBody(platformBody);
    this.bodies.push(platformBody);

    const ball = this._addBall(0.4, mass, 0xffb35c, { x: 1.8, y: height + 0.4, z: 0 });
    ball.body.velocity.x = velocity * Math.cos(rad);
    ball.body.velocity.y = velocity * Math.sin(rad);
  }

  _addGround(size = 12) {
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(size * 2, size * 2),
      new THREE.MeshStandardMaterial({ color: 0x1c2234, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    this.scene.add(ground);
    this.meshes.push(ground);

    const grid = new THREE.GridHelper(size * 2, 24, 0x2e3550, 0x1a2040);
    grid.position.y = 0.01;
    this.scene.add(grid);
    this.meshes.push(grid);

    const groundBody = new CANNON.Body({ mass: 0 });
    groundBody.addShape(new CANNON.Plane());
    groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
    this.world.addBody(groundBody);
    this.bodies.push(groundBody);
  }

  _addBall(radius, mass, colorHex, pos) {
    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(radius, 32, 32),
      new THREE.MeshStandardMaterial({
        color: colorHex,
        roughness: 0.3,
        metalness: 0.3,
        emissive: colorHex,
        emissiveIntensity: 0.15,
      })
    );
    ball.castShadow = true;
    ball.position.set(pos.x, pos.y, pos.z);
    this.scene.add(ball);
    this.meshes.push(ball);

    const body = new CANNON.Body({
      mass,
      shape: new CANNON.Sphere(radius),
    });
    body.position.set(pos.x, pos.y, pos.z);
    this.world.addBody(body);
    this.bodies.push(body);
    ball.userData.body = body;

    return { mesh: ball, body };
  }

  _addHeightMarker(height) {
    const points = [new THREE.Vector3(-3, 0, 3), new THREE.Vector3(-3, height, 3)];
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(points),
      new THREE.LineDashedMaterial({ color: 0x5ce1ff, dashSize: 0.3, gapSize: 0.2 })
    );
    line.computeLineDistances();
    this.scene.add(line);
    this.meshes.push(line);
  }

  _saveInitialState() {
    this.initialState = this.bodies.map(b => ({
      position: b.position.clone(),
      quaternion: b.quaternion.clone(),
      velocity: b.velocity.clone(),
      angularVelocity: b.angularVelocity.clone(),
    }));
  }

  reset() {
    this.elapsed = 0;
    if (!this.initialState) return;
    this.bodies.forEach((b, i) => {
      const s = this.initialState[i];
      b.position.copy(s.position);
      b.quaternion.copy(s.quaternion);
      b.velocity.copy(s.velocity);
      b.angularVelocity.copy(s.angularVelocity);
    });
  }

  play() { this.running = true; }
  pause() { this.running = false; }

  _startLoop() {
    const fixedDt = 1 / 60;
    let last = performance.now();

    const tick = (now) => {
      requestAnimationFrame(tick);
      const frameDt = Math.min((now - last) / 1000, 0.05);
      last = now;

      if (this.running) {
        this.world.step(fixedDt, frameDt, 3);
        this.elapsed += frameDt;
      }

      for (const m of this.meshes) {
        if (m.userData && m.userData.body) {
          m.position.copy(m.userData.body.position);
          m.quaternion.copy(m.userData.body.quaternion);
        }
      }

      this.controls.update();
      this.renderer.render(this.scene, this.camera);

      if (typeof this.onTick === 'function') {
        const firstBallBody = this._getMainBallBody();
        if (firstBallBody) {
          const v = firstBallBody.velocity.length();
          this.onTick({
            time: this.elapsed,
            velocity: v,
            height: Math.max(0, firstBallBody.position.y - 0.5),
          });
        }
      }
    };
    requestAnimationFrame(tick);
  }

  _getMainBallBody() {
    for (const b of this.bodies) {
      if (b.mass > 0 && b.shapes.some(s => s instanceof CANNON.Sphere)) return b;
    }
    return null;
  }

  _bindResize() {
    this._resizeHandler = () => {
      const w = this.container.clientWidth;
      const h = this.container.clientHeight;
      this.camera.aspect = w / h;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(w, h);
    };
    window.addEventListener('resize', this._resizeHandler);
  }

  destroy() {
    window.removeEventListener('resize', this._resizeHandler);
    this._clear();
    if (this.renderer && this.renderer.domElement.parentNode === this.container) {
      this.container.removeChild(this.renderer.domElement);
    }
  }
}

const $ = (id) => document.getElementById(id);

const dom = {
  intro: $('intro'),
  startBtn: $('startBtn'),
  app: $('app'),
  problemInput: $('problemInput'),
  parseBtn: $('parseBtn'),
  exampleChips: document.querySelectorAll('.chip'),
  panelInput: $('panelInput'),
  panelParams: $('panelParams'),
  panelRun: $('panelRun'),
  parsedSummary: $('parsedSummary'),
  massSlider: $('massSlider'),
  massVal: $('massVal'),
  heightSlider: $('heightSlider'),
  heightVal: $('heightVal'),
  angleGroup: $('angleGroup'),
  angleSlider: $('angleSlider'),
  angleVal: $('angleVal'),
  gravitySlider: $('gravitySlider'),
  gravityVal: $('gravityVal'),
  frictionGroup: $('frictionGroup'),
  frictionSlider: $('frictionSlider'),
  frictionVal: $('frictionVal'),
  runBtn: $('runBtn'),
  resetBtn: $('resetBtn'),
  playBtn: $('playBtn'),
  pauseBtn: $('pauseBtn'),
  restartBtn: $('restartBtn'),
  backToParamsBtn: $('backToParamsBtn'),
  backToInputBtn: $('backToInputBtn'),
  infoTime: $('infoTime'),
  infoVelocity: $('infoVelocity'),
  infoHeight: $('infoHeight'),
  sceneContainer: $('sceneContainer'),
  sceneBanner: $('sceneBanner'),
};

let physics = null;
let currentResult = null;

dom.startBtn.addEventListener('click', () => {
  dom.intro.style.display = 'none';
  dom.app.classList.remove('hidden');
  physics = new PhysicsScene(dom.sceneContainer);
  physics.onTick = (info) => {
    dom.infoTime.textContent = info.time.toFixed(2) + ' s';
    dom.infoVelocity.textContent = info.velocity.toFixed(2) + ' m/s';
    dom.infoHeight.textContent = info.height.toFixed(2) + ' m';
  };
});

dom.exampleChips.forEach((chip) => {
  chip.addEventListener('click', () => {
    const key = chip.dataset.example;
    const example = EXAMPLE_PROBLEMS[key];
    if (!example) return;
    dom.problemInput.value = example;
    handleParse();
  });
});

dom.parseBtn.addEventListener('click', handleParse);

function handleParse() {
  const text = dom.problemInput.value.trim();
  currentResult = parseProblem(text);
  dom.parsedSummary.textContent = currentResult.summary;

  const p = currentResult.params;
  setSlider(dom.massSlider, dom.massVal, p.mass);
  setSlider(dom.heightSlider, dom.heightVal, p.height);
  setSlider(dom.gravitySlider, dom.gravityVal, p.gravity);

  if (currentResult.type === 'incline') {
    dom.angleGroup.classList.remove('hidden');
    dom.frictionGroup.classList.remove('hidden');
    setSlider(dom.angleSlider, dom.angleVal, p.angle);
    setSlider(dom.frictionSlider, dom.frictionVal, p.friction);
  } else if (currentResult.type === 'projectile') {
    dom.angleGroup.classList.remove('hidden');
    dom.frictionGroup.classList.add('hidden');
    setSlider(dom.angleSlider, dom.angleVal, p.angle);
  } else {
    dom.angleGroup.classList.add('hidden');
    dom.frictionGroup.classList.add('hidden');
  }

  dom.panelInput.classList.add('hidden');
  dom.panelParams.classList.remove('hidden');
  dom.panelRun.classList.add('hidden');
  if (dom.sceneBanner) dom.sceneBanner.style.display = 'none';
}

function bindSlider(slider, valEl) {
  slider.addEventListener('input', () => {
    valEl.textContent = Number(slider.value).toFixed(slider.step && slider.step < 1 ? 2 : 0);
  });
}

function setSlider(slider, valEl, value) {
  slider.value = value;
  const step = parseFloat(slider.step);
  valEl.textContent = step < 1 ? Number(value).toFixed(1) : String(Math.round(value));
}

bindSlider(dom.massSlider, dom.massVal);
bindSlider(dom.heightSlider, dom.heightVal);
bindSlider(dom.angleSlider, dom.angleVal);
bindSlider(dom.gravitySlider, dom.gravityVal);
bindSlider(dom.frictionSlider, dom.frictionVal);

dom.runBtn.addEventListener('click', () => {
  if (!physics || !currentResult) return;
  const params = collectParams();
  physics.pause();
  physics.loadScenario(currentResult.type, params);
  physics.play();

  dom.panelParams.classList.add('hidden');
  dom.panelRun.classList.remove('hidden');

  const typeName = {
    free_fall: '自由落体',
    incline: '斜面滑动',
    collision: '两球碰撞',
    projectile: '斜抛运动',
  }[currentResult.type] || '物理仿真';

  dom.sceneBanner.textContent = `正在演示：${typeName} · 拖动场景可旋转视角`;
  dom.sceneBanner.style.display = '';
  setTimeout(() => { dom.sceneBanner.style.display = 'none'; }, 3000);
});

dom.resetBtn.addEventListener('click', () => {
  dom.panelParams.classList.add('hidden');
  dom.panelRun.classList.add('hidden');
  dom.panelInput.classList.remove('hidden');
  if (physics) physics.pause();
});

dom.playBtn.addEventListener('click', () => { if (physics) physics.play(); });
dom.pauseBtn.addEventListener('click', () => { if (physics) physics.pause(); });
dom.restartBtn.addEventListener('click', () => {
  if (!physics || !currentResult) return;
  physics.pause();
  physics.loadScenario(currentResult.type, collectParams());
  physics.play();
});

dom.backToParamsBtn.addEventListener('click', () => {
  if (physics) physics.pause();
  dom.panelRun.classList.add('hidden');
  dom.panelParams.classList.remove('hidden');
});

dom.backToInputBtn.addEventListener('click', () => {
  if (physics) physics.pause();
  dom.panelRun.classList.add('hidden');
  dom.panelParams.classList.add('hidden');
  dom.panelInput.classList.remove('hidden');
});

function collectParams() {
  const base = {
    mass: parseFloat(dom.massSlider.value),
    height: parseFloat(dom.heightSlider.value),
    gravity: parseFloat(dom.gravitySlider.value),
  };
  if (!dom.angleGroup.classList.contains('hidden')) {
    base.angle = parseFloat(dom.angleSlider.value);
  }
  if (!dom.frictionGroup.classList.contains('hidden')) {
    base.friction = parseFloat(dom.frictionSlider.value);
  }
  return { ...(currentResult?.params || {}), ...base };
}
