<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .app-header {
            text-align: center;
            color: white;
            padding: 30px 0;
        }

        .app-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .ingredient-section, .recipe-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .ingredient-section h2, .recipe-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #ingredientInput {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #ingredientInput:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd6;
        }

        .btn-recommend {
            width: 100%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 18px;
            padding: 15px;
            margin-top: 20px;
        }

        .btn-recommend:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }

        .preset-ingredients {
            margin-bottom: 20px;
        }

        .preset-ingredients p {
            color: #666;
            margin-bottom: 10px;
        }

        .preset-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .preset-btn {
            padding: 8px 12px;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .preset-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .preset-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .selected-ingredients p {
            color: #666;
            margin-bottom: 10px;
        }

        .selected-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 40px;
        }

        .ingredient-tag {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            font-size: 14px;
        }

        .ingredient-tag .remove {
            cursor: pointer;
            opacity: 0.8;
            font-weight: bold;
        }

        .ingredient-tag .remove:hover {
            opacity: 1;
        }

        .recipe-list {
            min-height: 400px;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 50px 0;
        }

        .recipe-card {
            background: #f9f9f9;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 5px solid #667eea;
        }

        .recipe-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .recipe-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .recipe-card .difficulty {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .recipe-card .match-rate {
            float: right;
            color: #f5576c;
            font-weight: bold;
        }

        .recipe-card p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .recipe-card .ingredients {
            margin-top: 10px;
            color: #888;
            font-size: 13px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.hidden {
            display: none;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .modal-close:hover {

        #modalBody h2 {

            margin-bottom: 15px;

        #modalBody h3 {

            font-size: 1.2em;
        }

        #modalBody .ingredients-list {

            gap: 8px;
            margin-bottom: 15px;
        }

        #modalBody .ingredients-list span {

            background: #f0f0f0;
            border-radius: 15px;
            font-size: 14px;
        }

        #modalBody .steps {
            line-height: 1.8;
            color: #555;
        }

        #modalBody .steps p {
            margin-bottom: 10px;
        }

        .app-footer {
            text-align: center;
            color: white;
            padding: 30px 0;
            opacity: 0.8;
        }

        .empty-recipe {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }

        .empty-recipe h3 {
            margin-bottom: 10px;
            color: #666;
        }
    </style>
</head>
<body>

                        <button class="preset-btn" data-ingredient="葱">🧅 葱</button>

                <div class="selected-ingredients">

                </div>
                <button id="recommendBtn" class="btn btn-recommend">🍳 获取菜谱推荐</button>
            </section>

            <section class="recipe-section">

        </main>

        <div id="recipeModal" class="modal hidden">

        <footer class="app-footer">

    </div>

            {

                name: "白菜猪肉炖粉条",
                difficulty: "中等",
                time: "35分钟",
                description: "东北名菜，热气腾腾的暖心菜",
                ingredients: ["白菜", "猪肉", "豆腐", "大蒜"],
                steps: [
                    "白菜洗净切块，猪肉切片",
                    "豆腐切块，大蒜切末",
                    "热锅凉油，放入猪肉煸炒",
                    "加入大蒜炒香，加生抽调味",
                    "加入白菜翻炒至变软",
                    "加入适量清水，放入豆腐",
                    "大火烧开转小火炖20分钟",
                    "加盐调味即可出锅"
                ],
                tags: ["炖菜", "东北菜", "硬菜"]
            },
            {
                id: 10,
                name: "胡萝卜炖肉",
                difficulty: "中等",
                time: "40分钟",
                description: "胡萝卜吸收肉香，软糯可口",
                ingredients: ["猪肉", "胡萝卜", "葱", "大蒜"],
                steps: [
                    "猪肉切块，胡萝卜切滚刀块",
                    "葱切段，大蒜切末",
                    "猪肉冷水下锅焯水后捞出",
                    "热锅凉油，放入猪肉煸炒",
                    "加入葱段、大蒜炒香",
                    "加入生抽、老抽、料酒调味",
                    "加入热水没过猪肉，炖25分钟",
                    "加入胡萝卜继续炖15分钟",
                    "大火收汁即可"
                ],
                tags: ["炖菜", "家常菜"]

        ];

        const ingredientEmojis = {
            "鸡蛋": "🥚",
            "西红柿": "🍅",
            "土豆": "🥔",
            "青椒": "🫑",
            "豆腐": "🧈",
            "白菜": "🥬",
            "胡萝卜": "🥕",
            "猪肉": "🥩",
            "米饭": "🍚",
            "面条": "🍜",
            "大蒜": "🧄",
            "葱": "🧅"
        };

        document.addEventListener('DOMContentLoaded', function() {
            const ingredientInput = document.getElementById('ingredientInput');
            const addBtn = document.getElementById('addBtn');
            const recommendBtn = document.getElementById('recommendBtn');
            const selectedList = document.getElementById('selectedList');
            const recipeList = document.getElementById('recipeList');
            const recipeModal = document.getElementById('recipeModal');
            const modalBody = document.getElementById('modalBody');
            const modalClose = document.querySelector('.modal-close');
            const presetBtns = document.querySelectorAll('.preset-btn');

            let selectedIngredients = [];

            function addIngredient(ingredient) {
                ingredient = ingredient.trim();
                if (!ingredient) return;
                if (selectedIngredients.includes(ingredient)) {
                    alert('该食材已添加！');
                    return;
                }
                selectedIngredients.push(ingredient);
                updateSelectedList();
                updatePresetBtns();
                ingredientInput.value = '';
            }

            function removeIngredient(ingredient) {
                selectedIngredients = selectedIngredients.filter(i => i !== ingredient);
                updateSelectedList();
                updatePresetBtns();
            }

            function updateSelectedList() {
                selectedList.innerHTML = selectedIngredients.map(ingredient => {
                    const emoji = ingredientEmojis[ingredient] || '🍽️';
                    return `
                        <div class="ingredient-tag">
                            <span>${emoji} ${ingredient}</span>
                            <span class="remove" data-ingredient="${ingredient}">&times;</span>
                        </div>
                    `;
                }).join('');

                document.querySelectorAll('.ingredient-tag .remove').forEach(btn => {
                    btn.addEventListener('click', function() {
                        removeIngredient(this.dataset.ingredient);
                    });
                });
            }

            function updatePresetBtns() {
                presetBtns.forEach(btn => {
                    if (selectedIngredients.includes(btn.dataset.ingredient)) {
                        btn.classList.add('selected');
                    } else {
                        btn.classList.remove('selected');
                    }
                });
            }

            function calculateMatchRate(recipe) {
                const matchedIngredients = recipe.ingredients.filter(i => selectedIngredients.includes(i));
                return Math.round((matchedIngredients.length / recipe.ingredients.length) * 100);
            }

            function getRecommendedRecipes() {
                if (selectedIngredients.length === 0) {
                    alert('请先添加食材！');
                    return;
                }

                const recipesWithMatch = recipes.map(recipe => ({
                    ...recipe,
                    matchRate: calculateMatchRate(recipe)
                })).filter(recipe => recipe.matchRate > 0)
                  .sort((a, b) => b.matchRate - a.matchRate);

                if (recipesWithMatch.length === 0) {
                    recipeList.innerHTML = `
                        <div class="empty-recipe">
                            <h3>😅 暂无推荐</h3>
                            <p>当前食材组合暂无匹配菜谱</p>
                            <p>试试添加更多常用食材吧！</p>
                        </div>
                    `;
                    return;
                }

                recipeList.innerHTML = recipesWithMatch.map(recipe => {
                    const emoji = recipe.ingredients.map(i => ingredientEmojis[i] || '').filter(Boolean).join('');
                    return `
                        <div class="recipe-card" data-id="${recipe.id}">
                            <span class="match-rate">匹配度 ${recipe.matchRate}%</span>
                            <h3>${recipe.name}</h3>
                            <span class="difficulty">${recipe.difficulty}</span>
                            <p>${recipe.description}</p>
                            <p class="ingredients">需要：${recipe.ingredients.join('、')}</p>
                        </div>
                    `;
                }).join('');

                document.querySelectorAll('.recipe-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const recipeId = parseInt(this.dataset.id);
                        showRecipeDetail(recipeId);
                    });
                });
            }

            function showRecipeDetail(recipeId) {
                const recipe = recipes.find(r => r.id === recipeId);
                if (!recipe) return;

                const emoji = recipe.ingredients.map(i => ingredientEmojis[i] || '').filter(Boolean).join(' ');
                const steps = recipe.steps.map((step, index) => `<p>${index + 1}. ${step}</p>`).join('');

                modalBody.innerHTML = `
                    <h2>${emoji} ${recipe.name}</h2>
                    <p><strong>难度：</strong>${recipe.difficulty} | <strong>时间：</strong>${recipe.time}</p>
                    <p style="margin: 10px 0;">${recipe.description}</p>
                    
                    <h3>📋 所需食材</h3>
                    <div class="ingredients-list">
                        ${recipe.ingredients.map(i => `<span>${ingredientEmojis[i] || ''} ${i}</span>`).join('')}
                    </div>
                    
                    <h3>👩‍🍳 烹饪步骤</h3>
                    <div class="steps">
                        ${steps}
                    </div>
                    
                    <p style="margin-top: 20px; color: #666; font-size: 13px;">
                        <strong>标签：</strong>${recipe.tags.join(' · ')}
                    </p>
                `;

                recipeModal.classList.remove('hidden');
            }

            addBtn.addEventListener('click', () => addIngredient(ingredientInput.value));

            ingredientInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addIngredient(this.value);
                }
            });

            presetBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    addIngredient(this.dataset.ingredient);
                });
            });

            recommendBtn.addEventListener('click', getRecommendedRecipes);

            modalClose.addEventListener('click', () => {
                recipeModal.classList.add('hidden');
            });

            recipeModal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
