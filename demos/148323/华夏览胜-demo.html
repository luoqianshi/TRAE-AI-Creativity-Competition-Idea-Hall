<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>华夏览胜 - 全国美景美食互动地图</title>
  <!-- ECharts 核心库（外部CDN保留） -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    /* ========== 全局变量与重置 ========== */
    :root {
      --primary: #c53030;
      --primary-light: #e53e3e;
      --primary-dark: #9b2c2c;
      --gold: #d69e2e;
      --dark: #1a202c;
      --gray: #4a5568;
      --light-gray: #e2e8f0;
      --bg: #f7fafc;
      --white: #ffffff;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.15);
      --radius: 12px;
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body { width: 100%; height: 100%; }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--dark);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ========== 首页样式 ========== */
    .home-hero {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* 首页主体：左右分栏 */
    .home-body {
      display: flex;
      flex-direction: row;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* 左侧标题区 */
    .hero-header {
      text-align: left;
      padding: 40px 15px 30px 30px;
      width: 200px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      z-index: 10;
      position: relative;
    }

    .hero-header h1 {
      font-size: clamp(1.8rem, 3vw, 3.2rem);
      color: var(--white);
      letter-spacing: 8px;
      text-shadow: 0 2px 20px rgba(197, 48, 48, 0.5);
      margin-bottom: 0;
      white-space: nowrap;
      display: inline-block;
    }
    .hero-header h1 span { color: var(--gold); }

    /* 黄线分隔：宽度与华夏览胜标题文字等宽 */
    .hero-divider {
      width: 100%;
      height: 3px;
      background: var(--gold);
      margin: 15px 0;
      border-radius: 2px;
      min-width: 80px;
    }

    /* 装饰线条（左对齐） - style.css 中通过 ::after 实现，单文件版用 .hero-divider 替代 */
    .hero-header p {
      color: rgba(255, 255, 255, 0.7);
      font-size: clamp(0.85rem, 1.2vw, 1.1rem);
      letter-spacing: 4px;
      line-height: 1.8;
    }

    /* 地图容器（右侧放大） */
    .map-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 20px;
      min-height: 0;
      position: relative;
    }

    #chinaMap {
      width: 100%;
      height: 100%;
      min-height: 700px;
    }

    /* 自定义悬浮卡片 */
    .hover-card {
      position: fixed;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-hover);
      padding: 0;
      width: 320px;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      overflow: hidden;
    }

    .hover-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .hover-card-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: var(--white);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hover-card-header .province-name {
      font-size: 1.3rem;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .hover-card-header .season-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      white-space: nowrap;
    }

    .hover-card-body {
      padding: 14px 18px;
    }

    .hover-card-body h4 {
      color: var(--primary);
      font-size: 0.85rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hover-card-body h4::before {
      content: '';
      width: 3px;
      height: 14px;
      background: var(--gold);
      border-radius: 2px;
    }

    .hover-card-body .item-list {
      list-style: none;
      margin-bottom: 10px;
    }

    .hover-card-body .item-list li {
      font-size: 0.85rem;
      color: var(--gray);
      padding: 2px 0;
    }

    .hover-card-body .item-list li strong {
      color: var(--dark);
    }

    .hover-card-footer {
      padding: 8px 18px 14px;
      font-size: 0.8rem;
      color: var(--primary);
      text-align: center;
      border-top: 1px solid var(--light-gray);
      padding-top: 10px;
    }

    /* 底部说明 */
    .hero-footer {
      text-align: center;
      padding: 10px 20px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.8rem;
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    /* ========== 省份详情页样式 ========== */
    .province-page {
      min-height: 100vh;
      background: var(--bg);
    }

    /* 返回按钮 */
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      background: var(--white);
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      box-shadow: var(--shadow);
      cursor: pointer;
      font-size: 0.95rem;
      color: var(--primary);
      z-index: 100;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn:hover {
      background: var(--primary);
      color: var(--white);
      transform: translateX(-3px);
    }

    /* 返回按钮中的左箭头图标 */
    .back-btn .arrow-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .back-btn .arrow-icon svg {
      width: 16px;
      height: 16px;
    }

    /* 省份头部横幅 */
    .province-hero {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: var(--white);
      padding: 80px 20px 50px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .province-hero::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
    }

    .province-hero::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
    }

    .province-hero h1 {
      font-size: 3rem;
      letter-spacing: 6px;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }

    .province-hero .subtitle {
      font-size: 1.2rem;
      opacity: 0.9;
      letter-spacing: 3px;
      position: relative;
      z-index: 1;
    }

    .province-hero .season-info {
      margin-top: 15px;
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      padding: 6px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      position: relative;
      z-index: 1;
    }

    /* 内容区 */
    .province-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* 区块标题 */
    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
      font-size: 1.6rem;
      color: var(--dark);
    }

    .section-title .icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .section-title.scenery .icon {
      background: linear-gradient(135deg, #48bb78, #38a169);
      color: var(--white);
    }

    .section-title.food .icon {
      background: linear-gradient(135deg, #ed8936, #dd6b20);
      color: var(--white);
    }

    .section-title.culture .icon {
      background: linear-gradient(135deg, var(--gold), #b7791f);
      color: var(--white);
    }

    .section-title span:last-child {
      font-weight: bold;
      letter-spacing: 2px;
    }

    /* 美景卡片网格 */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }

    .scenery-card {
      background: var(--white);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .scenery-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
    }

    .scenery-card-img {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .scenery-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .scenery-card:hover .scenery-card-img img {
      transform: scale(1.05);
    }

    .scenery-card-img .placeholder-icon {
      font-size: 3rem;
      opacity: 0.8;
    }

    .scenery-card-body {
      padding: 16px 20px;
    }

    .scenery-card-body h3 {
      font-size: 1.15rem;
      color: var(--dark);
      margin-bottom: 6px;
    }

    .scenery-card-body p {
      font-size: 0.9rem;
      color: var(--gray);
      line-height: 1.5;
    }

    /* 美食卡片 */
    .food-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: var(--transition);
      overflow: hidden;
    }

    .food-card-img {
      width: 100%;
      height: 160px;
      overflow: hidden;
      background: #f7f7f7;
    }

    .food-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .food-card:hover .food-card-img img {
      transform: scale(1.05);
    }

    .food-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }

    .food-card-body {
      padding: 16px 20px;
      border-left: 4px solid var(--gold);
    }

    .food-card h3 {
      font-size: 1.1rem;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .food-card p {
      font-size: 0.9rem;
      color: var(--gray);
    }

    /* 文化介绍 */
    .culture-box {
      background: var(--white);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .culture-box::before {
      content: '"';
      position: absolute;
      top: 10px;
      right: 30px;
      font-size: 6rem;
      color: var(--light-gray);
      font-family: Georgia, serif;
      line-height: 1;
    }

    .culture-box p {
      font-size: 1.05rem;
      color: var(--gray);
      line-height: 2;
      position: relative;
      z-index: 1;
    }

    /* 加载动画 */
    .loader {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .loader-circle {
      width: 50px;
      height: 50px;
      border: 4px solid var(--light-gray);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 错误页面 */
    .error-page {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .error-page h1 {
      font-size: 3rem;
      color: var(--primary);
      margin-bottom: 15px;
    }

    .error-page p {
      font-size: 1.1rem;
      color: var(--gray);
      margin-bottom: 25px;
    }

    .error-page a {
      background: var(--primary);
      color: var(--white);
      padding: 12px 30px;
      border-radius: 30px;
      transition: var(--transition);
    }

    .error-page a:hover {
      background: var(--primary-dark);
    }

    /* ========== 响应式 ========== */
    @media (max-width: 900px) {
      .home-body { flex-direction: column; }
      .hero-header {
        text-align: center;
        width: 100%;
        padding: 15px 20px 8px;
        justify-content: flex-start;
        align-items: center;
      }
      .hero-divider { width: auto; }
      .hero-header h1 { font-size: 1.5rem; letter-spacing: 4px; }
      .hero-header p { font-size: 0.8rem; letter-spacing: 2px; }
      #chinaMap { flex: 1; min-height: auto; }
      .hover-card { width: 280px; }
    }

    @media (max-width: 768px) {
      .home-hero {
        flex-direction: column;
      }
      .home-body {
        flex-direction: column;
      }
      .hero-header {
        text-align: center;
        width: 100%;
        padding: 30px 20px 10px;
        justify-content: flex-start;
      }
      .hero-header h1 {
        font-size: 1.8rem;
        letter-spacing: 4px;
      }
      .hero-header p {
        font-size: 0.9rem;
        letter-spacing: 2px;
      }
      #chinaMap {
        height: 500px;
        min-height: auto;
      }
      .hover-card {
        width: 280px;
      }
      .province-hero h1 {
        font-size: 2rem;
        letter-spacing: 3px;
      }
      .province-hero .subtitle {
        font-size: 0.95rem;
        letter-spacing: 1px;
      }
      .card-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ========== 路由相关：页面切换隐藏/显示 ========== */
    .page-home, .page-province {
      display: none;
    }
    .page-home.active, .page-province.active {
      display: block;
    }
    .page-home.active {
      display: flex;
    }
  </style>
</head>
<body>

  <!-- ========== 首页：中国地图 ========== -->
  <div class="home-hero page-home" id="pageHome">
    <!-- 左右分栏主体 -->
    <div class="home-body">
      <!-- 左侧标题区 -->
      <div class="hero-header">
        <h1>华夏<span>览胜</span></h1>
        <div class="hero-divider"></div>
        <p>探寻神州美景<br>品味中华美食</p>
      </div>

      <!-- 右侧地图区 -->
      <div class="map-container">
        <div id="chinaMap"></div>
      </div>
    </div>

    <!-- 底部说明 -->
    <div class="hero-footer">
      鼠标悬停查看各省美景美食 · 点击省份进入详情页
    </div>
  </div>

  <!-- ========== 省份详情页 ========== -->
  <div class="province-page page-province" id="pageProvince">
    <!-- 加载动画（数据加载前显示） -->
    <div class="loader" id="loader">
      <div class="loader-circle"></div>
    </div>
  </div>

  <!-- 自定义悬浮卡片（首页用） -->
  <div class="hover-card" id="hoverCard">
    <div class="hover-card-header">
      <span class="province-name" id="cardProvinceName"></span>
      <span class="season-badge" id="cardSeason"></span>
    </div>
    <div class="hover-card-body">
      <h4>美景推荐</h4>
      <ul class="item-list" id="cardScenery"></ul>
      <h4>特色美食</h4>
      <ul class="item-list" id="cardFood"></ul>
    </div>
    <div class="hover-card-footer">点击查看详情</div>
  </div>

  <!-- ========== 内联数据：全国34个省级行政区 ========== -->

  <!-- ========== 内联脚本：路由 + 地图逻辑 + 省份详情逻辑 ========== -->
  <script>
/**
 * =============================================
 * 华夏览胜 - 单文件版路由与业务逻辑
 * =============================================
 * 通过 URL hash 实现首页 / 省份详情页 之间的无刷新切换
 * hash 为空或 #home → 显示首页地图
 * hash 为 #province=省份名 → 显示省份详情页
 */

// ========== 路由系统 ==========

/**
 * 解析当前 URL hash，返回 { page, provinceName }
 * 格式：
 *   #province=北京  → { page: 'province', provinceName: '北京' }
 *   #home 或 空     → { page: 'home', provinceName: null }
 */
function parseHash() {
  var hash = window.location.hash.replace('#', '');
  if (hash.indexOf('province=') === 0) {
    return { page: 'province', provinceName: decodeURIComponent(hash.substring('province='.length)) };
  }
  return { page: 'home', provinceName: null };
}

/**
 * 导航到省份详情页
 * @param {string} name - 省份名称
 */
function navigateToProvince(name) {
  window.location.hash = 'province=' + encodeURIComponent(name);
}

/**
 * 导航回首页
 */
function navigateToHome() {
  window.location.hash = '#home';
  // 首页 body 需要 overflow:hidden 来防止滚动条
  document.body.style.overflow = 'hidden';
}

/**
 * 切换页面显示状态
 * @param {string} page - 'home' 或 'province'
 */
function showPage(page) {
  var pageHome = document.getElementById('pageHome');
  var pageProvince = document.getElementById('pageProvince');

  if (page === 'home') {
    pageHome.classList.add('active');
    pageProvince.classList.remove('active');
    document.body.style.overflow = 'hidden';
  } else {
    pageHome.classList.remove('active');
    pageProvince.classList.add('active');
    document.body.style.overflow = '';
  }
}

// 监听 hash 变化，实现页面切换
window.addEventListener('hashchange', handleRoute);

/**
 * 路由处理入口
 * 根据 URL hash 判断显示哪个页面
 */
function handleRoute() {
  var route = parseHash();

  if (route.page === 'province') {
    showPage('province');
    initProvincePage(route.provinceName);
  } else {
    showPage('home');
    // 如果地图尚未初始化，则初始化
    if (!mapInitialized) {
      initMap();
    }
  }
}


// ========== 省份详情页逻辑 ==========

/**
 * 生成美景卡片的不同渐变色（让卡片更有层次感）
 * @param {number} index - 卡片索引
 * @returns {string} CSS 渐变色
 */
function getSceneryGradient(index) {
  var gradients = [
    'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
    'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
    'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
    'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
    'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
    'linear-gradient(135deg, #30cfd0 0%, #330867 100%)',
    'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
    'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)'
  ];
  return gradients[index % gradients.length];
}

/**
 * 渲染美景区域
 * @param {Array} sceneryList - 美景列表
 * @returns {string} HTML 字符串
 */
function renderScenerySection(sceneryList) {
  var cardsHTML = sceneryList.map(function(scenery, index) {
    return '<div class="scenery-card">' +
      '<div class="scenery-card-img" style="background:' + getSceneryGradient(index) + '">' +
        '<img src="' + scenery.img + '" alt="' + scenery.name + '" loading="lazy" crossorigin="anonymous" />' +
      '</div>' +
      '<div class="scenery-card-body">' +
        '<h3>' + scenery.name + '</h3>' +
        '<p>' + scenery.desc + '</p>' +
      '</div>' +
    '</div>';
  }).join('');

  return '<div class="section-title scenery">' +
      '<span class="icon">景</span>' +
      '<span>绝美风光</span>' +
    '</div>' +
    '<div class="card-grid">' + cardsHTML + '</div>';
}

/**
 * 渲染美食区域
 * @param {Array} foodList - 美食列表
 * @returns {string} HTML 字符串
 */
function renderFoodSection(foodList) {
  var cardsHTML = foodList.map(function(food) {
    return '<div class="food-card">' +
      '<div class="food-card-img">' +
        '<img src="' + food.img + '" alt="' + food.name + '" loading="lazy" crossorigin="anonymous" />' +
      '</div>' +
      '<div class="food-card-body">' +
        '<h3>' + food.name + '</h3>' +
        '<p>' + food.desc + '</p>' +
      '</div>' +
    '</div>';
  }).join('');

  return '<div class="section-title food">' +
      '<span class="icon">食</span>' +
      '<span>舌尖美味</span>' +
    '</div>' +
    '<div class="card-grid">' + cardsHTML + '</div>';
}

/**
 * 渲染文化区域
 * @param {string} culture - 文化介绍文本
 * @returns {string} HTML 字符串
 */
function renderCultureSection(culture) {
  return '<div class="section-title culture">' +
      '<span class="icon">文</span>' +
      '<span>人文底蕴</span>' +
    '</div>' +
    '<div class="culture-box">' +
      '<p>' + culture + '</p>' +

}

/**

function renderProvincePage(provinceName, data) {

/**
 * 省份详情页初始化入口
 * @param {string|null} provinceName - 省份名称

function initProvincePage(provinceName) {

// ========== 首页地图逻辑 ==========

// 标记地图是否已初始化，避免重复初始化
var mapInitialized = false;

// ECharts 实例引用
var myChart = null;

// 悬浮卡片 DOM 元素引用
var hoverCard = document.getElementById('hoverCard');
var cardProvinceName = document.getElementById('cardProvinceName');
var cardSeason = document.getElementById('cardSeason');
var cardScenery = document.getElementById('cardScenery');
var cardFood = document.getElementById('cardFood');

/**
 * GeoJSON 中的省份全称 → 数据简称 映射表
 */
var NAME_MAP = {
  "北京市": "北京",
  "天津市": "天津",
  "河北省": "河北",
  "山西省": "山西",
  "内蒙古自治区": "内蒙古",
  "辽宁省": "辽宁",
  "吉林省": "吉林",
  "黑龙江省": "黑龙江",
  "上海市": "上海",
  "江苏省": "江苏",
  "浙江省": "浙江",
  "安徽省": "安徽",
  "福建省": "福建",
  "江西省": "江西",
  "山东省": "山东",
  "河南省": "河南",
  "湖北省": "湖北",
  "湖南省": "湖南",
  "广东省": "广东",
  "广西壮族自治区": "广西",
  "海南省": "海南",
  "重庆市": "重庆",
  "四川省": "四川",
  "贵州省": "贵州",
  "云南省": "云南",
  "西藏自治区": "西藏",
  "陕西省": "陕西",
  "甘肃省": "甘肃",
  "青海省": "青海",
  "宁夏回族自治区": "宁夏",
  "新疆维吾尔自治区": "新疆",
  "台湾省": "台湾",
  "香港特别行政区": "香港",
  "澳门特别行政区": "澳门"
};

/**
 * 将 GeoJSON 全称映射为数据简称
 */
function toShortName(geoName) {
  if (NAME_MAP[geoName]) return NAME_MAP[geoName];
  return geoName.replace(/维吾尔自治区|壮族自治区|回族自治区|特别行政区|自治区|省|市/g, '');
}

/**
 * 构建 ECharts series 数据
 */
function buildMapData() {
  return Object.keys(PROVINCE_DATA).map(function(shortName) {
    return { name: shortName, value: 1 };
  });
}

/**
 * 渲染悬浮卡片内容
 */
function renderHoverCard(name) {
  var shortName = toShortName(name);
  var data = PROVINCE_DATA[shortName] || PROVINCE_DATA[name];
  if (!data) return;

  cardProvinceName.textContent = shortName;
  cardSeason.textContent = '最佳: ' + data.bestSeason;

  cardScenery.innerHTML = data.scenery.slice(0, 3).map(function(s) {
    return '<li><strong>' + s.name + '</strong> - ' + s.desc + '</li>';
  }).join('');

  cardFood.innerHTML = data.food.slice(0, 3).map(function(f) {
    return '<li><strong>' + f.name + '</strong> - ' + f.desc + '</li>';
  }).join('');
}

/**
 * 定位悬浮卡片到鼠标附近，避免超出窗口
 */
function positionHoverCard(x, y) {
  var cardWidth = 320;
  var cardHeight = hoverCard.offsetHeight || 300;
  var windowWidth = window.innerWidth;
  var windowHeight = window.innerHeight;

  var posX = x + 15;
  var posY = y + 15;

  if (posX + cardWidth > windowWidth) {
    posX = x - cardWidth - 15;
  }
  if (posY + cardHeight > windowHeight) {
    posY = y - cardHeight - 15;
  }

  posX = Math.max(10, posX);
  posY = Math.max(10, posY);

  hoverCard.style.left = posX + 'px';
  hoverCard.style.top = posY + 'px';
}

function showHoverCard() { hoverCard.classList.add('visible'); }
function hideHoverCard() { hoverCard.classList.remove('visible'); }

/**
 * 获取 GeoJSON 中所有区域名称
 */
function getGeoNames(geoJson) {
  return geoJson.features.map(function(f) { return f.properties.name; });
}

/**
 * 找出需要隐藏的非省级行政区区域
 */
function buildHiddenRegions(geoJson) {
  var keepSet = new Set(Object.keys(NAME_MAP));
  var allNames = getGeoNames(geoJson);
  return allNames.filter(function(n) { return !keepSet.has(n); });
}

/**
 * 清理台湾省 GeoJSON：移除东侧离岛（绿岛、兰屿等）
 */
function cleanTaiwanCoords(feature) {
  function polygonCenterLng(polygon) {
    var sum = 0;
    for (var i = 0; i < polygon.length; i++) sum += polygon[i][0];
    return sum / polygon.length;
  }

  var cleaned = JSON.parse(JSON.stringify(feature));
  var geometry = cleaned.geometry;

  if (geometry.type === 'MultiPolygon') {
    geometry.coordinates = geometry.coordinates.filter(function(polygonGroup) {
      return polygonGroup.some(function(polygon) { return polygonCenterLng(polygon) <= 122; });
    });
    geometry.coordinates = geometry.coordinates.map(function(polygonGroup) {
      return polygonGroup.filter(function(polygon) { return polygonCenterLng(polygon) <= 122; });
    });
  }

  return cleaned;
}

/**
 * 清理海南省 GeoJSON：移除南海岛礁（纬度 < 18N）
 */
function cleanHainanCoords(feature) {
  var MIN_LAT = 18.0;

  function polygonAboveMinLat(polygon) {
    for (var i = 0; i < polygon.length; i++) {
      if (polygon[i][1] < MIN_LAT) return false;
    }
    return true;
  }

  var cleaned = JSON.parse(JSON.stringify(feature));
  var geometry = cleaned.geometry;

  if (geometry.type === 'MultiPolygon') {
    geometry.coordinates = geometry.coordinates.filter(function(polygonGroup) {
      return polygonGroup.some(function(polygon) { return polygonAboveMinLat(polygon); });
    });
    geometry.coordinates = geometry.coordinates.map(function(polygonGroup) {
      return polygonGroup.filter(function(polygon) { return polygonAboveMinLat(polygon); });
    });
  } else if (geometry.type === 'Polygon') {
    if (!polygonAboveMinLat(geometry.coordinates[0])) {
      geometry.coordinates = [];
    }
  }

  return cleaned;
}

/**
 * 配置并渲染 ECharts 地图
 */
function renderMap(geoJson) {
  var chartDom = document.getElementById('chinaMap');
  myChart = echarts.init(chartDom, null, { renderer: 'canvas' });

  // 注册自定义地图，避免自动添加南海诸岛缩略图
  echarts.registerMap('china_custom', geoJson);

  var hiddenNames = buildHiddenRegions(geoJson);
  var hiddenRegions = hiddenNames.map(function(name) {
    return {
      name: name,
      itemStyle: { areaColor: 'transparent', borderColor: 'transparent' },
      label: { show: false }
    };
  });

  var option = {
    backgroundColor: 'transparent',
    tooltip: { show: false },
    series: [
      {
        name: '省份',
        type: 'map',
        map: 'china_custom',
        roam: false,
        zoom: 1.2,
        scaleLimit: { min: 1, max: 10 },
        itemStyle: {
          areaColor: '#2d3748',
          borderColor: '#4a5568',
          borderWidth: 1
        },
        label: {
          show: true,
          color: 'rgba(255,255,255,0.85)',
          fontSize: 11,
          fontWeight: 'normal',
          formatter: function(params) {
            var shortName = toShortName(params.name);
            if (shortName === '香港' || shortName === '澳门' || shortName === '河北') return '';
            return shortName;
          }
        },
        emphasis: {
          itemStyle: {
            areaColor: '#c53030',
            borderColor: '#fff',
            borderWidth: 1.5,
            shadowBlur: 20,
            shadowColor: 'rgba(197, 48, 48, 0.5)'
          },
          label: {
            show: true,
            color: '#fff',
            fontSize: 13,
            fontWeight: 'bold',
            formatter: function(params) {
              var sn = toShortName(params.name);
              if (sn === '香港' || sn === '澳门' || sn === '河北') return '';
              return sn;
            }
          }
        },
        select: {
          itemStyle: {
            areaColor: '#d69e2e',
            borderColor: '#fff',
            borderWidth: 2
          },
          label: {
            show: true,
            color: '#fff',
            fontWeight: 'bold',
            formatter: function(params) {
              var sn = toShortName(params.name);
              if (sn === '香港' || sn === '澳门' || sn === '河北') return '';
              return sn;
            }
          }
        },
        nameMap: NAME_MAP,
        data: buildMapData(),
        regions: hiddenRegions.concat([
          { name: '香港特别行政区', label: { show: false } },
          { name: '澳门特别行政区', label: { show: false } },
          { name: '河北省', label: { show: false } },
          {
            name: '台湾省',
            label: {
              show: true,
              position: 'right',
              color: 'rgba(255,255,255,0.85)',
              fontSize: 11,
              fontWeight: 'normal',
              formatter: '台湾'
            }
          }
        ])
      }
    ]
  };

  myChart.setOption(option, true);

  // ========== HTML overlay 为香港/澳门/河北添加独立标签 ==========
  function addHKMOLabels() {
    var container = document.getElementById('chinaMap');
    container.querySelectorAll('.hk-mo-label').forEach(function(el) { el.remove(); });

    var hkPx = myChart.convertToPixel('series', [114.17, 22.32]);
    var moPx = myChart.convertToPixel('series', [113.55, 22.20]);
    var hbPx = myChart.convertToPixel('series', [115.47, 38.87]);
    if (!hkPx || !moPx || !hbPx) return;

    var items = [
      { text: '香港', x: hkPx[0] + 6, y: hkPx[1] - 1, name: '香港', geoName: '香港特别行政区' },
      { text: '澳门', x: moPx[0] - 19, y: moPx[1] + 9, name: '澳门', geoName: '澳门特别行政区' },
      { text: '河北', x: hbPx[0] - 10, y: hbPx[1] + 5, name: '河北', geoName: '河北省' }
    ];

    items.forEach(function(item) {
      var el = document.createElement('div');
      el.className = 'hk-mo-label';
      el.textContent = item.text;
      el.style.cssText = 'position:absolute;left:' + item.x + 'px;top:' + item.y + 'px;color:rgba(255,255,255,0.85);font-size:11px;font-family:Microsoft YaHei,sans-serif;cursor:pointer;white-space:nowrap;pointer-events:auto;text-shadow:0 1px 3px rgba(0,0,0,0.8);z-index:5;transition:transform 0.2s ease,font-size 0.2s ease,color 0.2s ease;transform-origin:center;';
      el.addEventListener('mouseenter', function() {
        el.style.color = '#fff';
        el.style.fontSize = '13px';
        el.style.fontWeight = 'bold';
        renderHoverCard(item.geoName);
        showHoverCard();
      });
      el.addEventListener('mouseleave', function() {
        el.style.color = 'rgba(255,255,255,0.85)';
        el.style.fontSize = '11px';
        el.style.fontWeight = 'normal';
        hideHoverCard();
      });
      // 点击跳转使用 hash 路由
      el.addEventListener('click', function() {
        navigateToProvince(item.name);
      });
      container.appendChild(el);
    });
  }

  setTimeout(addHKMOLabels, 500);
  window.addEventListener('resize', function() {
    myChart.resize();
    setTimeout(addHKMOLabels, 200);
  });

  // ========== 地图事件绑定 ==========

  // 鼠标悬停 → 显示美景美食卡片
  myChart.on('mouseover', function(params) {
    if (params.componentType === 'series') {
      var shortName = toShortName(params.name);
      if (PROVINCE_DATA[shortName]) {
        renderHoverCard(params.name);
        showHoverCard();
      }
    }
  });

  // 鼠标移出 → 隐藏卡片
  myChart.on('mouseout', function(params) {
    if (params.componentType === 'series') {
      hideHoverCard();
    }
  });

  // 点击省份 → 使用 hash 路由跳转详情页
  myChart.on('click', function(params) {
    if (params.componentType === 'series') {
      var shortName = toShortName(params.name);
      if (PROVINCE_DATA[shortName]) {
        navigateToProvince(shortName);
      }
    }
  });

  // 鼠标移动时更新卡片位置
  chartDom.addEventListener('mousemove', function(e) {
    if (hoverCard.classList.contains('visible')) {
      positionHoverCard(e.clientX, e.clientY);
    }
  });
}

/**
 * 加载中国地图 GeoJSON 数据并初始化
 */
function initMap() {
  var geoJsonUrl = 'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json';

  fetch(geoJsonUrl).then(function(response) {
    if (!response.ok) throw new Error('地图数据加载失败');
    return response.json();
  }).then(function(geoJson) {
    // 第一步：按名称过滤，只保留34个省级行政区
    var keepSet = new Set(Object.keys(NAME_MAP));
    geoJson.features = geoJson.features.filter(function(f) { return keepSet.has(f.properties.name); });

    // 第二步：坐标级清理海南和台湾
    geoJson.features = geoJson.features.map(function(f) {
      if (f.properties.name === '海南省') return cleanHainanCoords(f);
      if (f.properties.name === '台湾省') return cleanTaiwanCoords(f);
      return f;
    });

    // 第三步：删除残留的低纬度区域（南海诸岛框等）
    geoJson.features = geoJson.features.filter(function(f) {
      if (!f.geometry || !f.geometry.coordinates) return false;
      var coords = f.geometry.coordinates;
      var minLat = Infinity;
      function extractMinLat(c) {
        if (typeof c[0] === 'number') {
          if (c[1] < minLat) minLat = c[1];
        } else {
          c.forEach(extractMinLat);
        }
      }
      extractMinLat(coords);
      return minLat >= 16;
    });

    mapInitialized = true;
    renderMap(geoJson);
  }).catch(function(error) {
    console.error('地图初始化失败:', error);
    document.getElementById('chinaMap').innerHTML =
      '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#fff;">' +
        '<h2 style="margin-bottom:15px;">地图加载失败</h2>' +
        '<p style="opacity:0.7;margin-bottom:20px;">请检查网络连接后刷新页面</p>' +
        '<button onclick="location.reload()" style="padding:10px 30px;border:none;border-radius:25px;background:#c53030;color:#fff;cursor:pointer;font-size:1rem;">重新加载</button>' +
      '</div>';
  });
}

// 同步黄线宽度与标题等宽（保留原有逻辑）
function syncDividerWidth() {
  var h1 = document.querySelector('.hero-header h1');
  var divider = document.querySelector('.hero-divider');
  if (h1 && divider) {
    var w = h1.offsetWidth;
    if (w > 0) divider.style.width = w + 'px';
  }
}
syncDividerWidth();
window.addEventListener('resize', syncDividerWidth);

// 窗口大小变化时重新调整图表
window.addEventListener('resize', function() {
  if (myChart) myChart.resize();
});

// 监听地图容器尺寸变化（flex 布局下 window.resize 可能不够）
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(function() {
    if (myChart) myChart.resize();
  }).observe(document.getElementById('chinaMap'));
}
