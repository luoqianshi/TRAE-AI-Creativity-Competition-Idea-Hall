<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百万赌局：命运箱子</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:white;
    text-align:center;
    margin:0;
}

.header{
    padding:20px;
    background:#222;
}

.money-board{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    max-width:300px;
    margin:20px auto;
}

.money{
    background:#333;
    padding:8px;
    border-radius:8px;
}

.box-area{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
    max-width:900px;
    margin:20px auto;
}

.box{
    height:60px;
    background:gold;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:18px;
}

.box:hover{
    transform:scale(1.05);
}

.opened{
    background:#555 !important;
    color:#aaa;
}

.banker{
    max-width:700px;
    margin:20px auto;
    background:#1f1f1f;
    padding:20px;
    border-radius:12px;
}

.offer{
    font-size:32px;
    color:#00ff88;
    margin:10px 0;
}

button.action{
    padding:10px 20px;
    margin:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="header">
<h1>💰 百万赌局：命运箱子</h1>
<p>你能带走100万美元吗？</p>
</div>

<div class="money-board" id="moneyBoard"></div>

<div class="box-area" id="boxes"></div>

<div class="banker">
<h2>🤵 AI银行家</h2>

<p id="message">
请选择一个箱子开始游戏
</p>

<div class="offer" id="offer">
--
</div>

<button class="action" onclick="deal()">
接受报价
</button>

<button class="action" onclick="noDeal()">
继续游戏
</button>
</div>

<script>

const prizes=[
1,5,10,25,50,75,
100,200,300,500,
1000,5000,10000,
25000,50000,
75000,100000,
150000,200000,
250000,300000,
400000,500000,
750000,900000,
1000000
];

let remaining=[...prizes];
let opened=0;

const board=document.getElementById("moneyBoard");

prizes.forEach(v=>{
    const div=document.createElement("div");
    div.className="money";
    div.innerText="$"+v.toLocaleString();
    div.id="money-"+v;
    board.appendChild(div);
});

const boxArea=document.getElementById("boxes");

for(let i=1;i<=26;i++){

    const btn=document.createElement("button");

    btn.className="box";
    btn.innerText=i;

    btn.onclick=function(){

        if(btn.classList.contains("opened"))
            return;

        const index=Math.floor(Math.random()*remaining.length);

        const value=remaining[index];

        remaining.splice(index,1);

        document.getElementById("money-"+value)
        .style.opacity="0.25";

        btn.classList.add("opened");

        btn.innerText="$"+value.toLocaleString();

        opened++;

        document.getElementById("message").innerHTML=
        "打开箱子获得：<b>$"+
        value.toLocaleString()+"</b>";

        if(opened%5===0){
            bankerOffer();
        }

    }

    boxArea.appendChild(btn);
}

function bankerOffer(){

    const avg=
    remaining.reduce((a,b)=>a+b,0)
    /remaining.length;

    const offer=Math.floor(avg*0.75);

    document.getElementById("offer")
    .innerText=
    "$"+offer.toLocaleString();

    document.getElementById("message")
    .innerHTML=
    "AI银行家出价来了！";
}

function deal(){

    const offer=
    document.getElementById("offer")
    .innerText;

    alert(
    "恭喜成交！\n你带走了 "+
    offer
    );
}

function noDeal(){

    alert(
    "NO DEAL!\n继续挑战命运！"
    );
}

</script>

</body>
</html>
