<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭AI语音助手 - 温暖的记忆管家</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary: #FF7F6E;
      --primary-light: #FFB4AA;
      --primary-dark: #E5685A;
      --bg-cream: #FFF8F0;
      --bg-warm: #FFF5EB;
      --accent-mint: #7ED8C4;
      --accent-lavender: #B8A9D9;
      --accent-gold: #F5C87A;
      --text-dark: #4A3F3A;
      --text-muted: #8B7E7A;
      --shadow-soft: 0 4px 20px rgba(255, 127, 110, 0.15);
      --shadow-hover: 0 8px 30px rgba(255, 127, 110, 0.25);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-full: 50px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg-cream);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1, h2, h3, h4 {
      font-family: 'Noto Serif SC', serif;
    }

    /* Layout */
    .app-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #FFF8F0 0%, #FFE8E3 100%);
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      left: 0;
      top: 0;
      border-right: 1px solid rgba(255, 127, 110, 0.1);
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 32px;
      border-bottom: 1px solid rgba(255, 127, 110, 0.15);
      margin-bottom: 24px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: var(--shadow-soft);
    }

    .logo-text h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-dark);
    }

    .logo-text span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .nav-menu {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
    }

    .nav-item:hover {
      background: rgba(255, 127, 110, 0.1);
      color: var(--primary);
    }

    .nav-item.active {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      box-shadow: var(--shadow-soft);
    }

    .nav-item i {
      width: 20px;
      height: 20px;
    }

    .main-content {
      flex: 1;
      margin-left: 260px;
      padding: 32px 40px;
      min-height: 100vh;
    }

    /* Page transitions */
    .page {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Home Page */
    .page-header {
      margin-bottom: 32px;
    }

    .page-header h2 {
      font-size: 28px;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .page-header p {
      color: var(--text-muted);
      font-size: 15px;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: white;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      font-size: 14px;
      color: var(--text-muted);
      box-shadow: var(--shadow-soft);
      margin-bottom: 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: white;
      padding: 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 16px;
    }

    .stat-card:nth-child(1) .stat-icon { background: linear-gradient(135deg, #FFE0DC 0%, #FFCDCA 100%); }
    .stat-card:nth-child(2) .stat-icon { background: linear-gradient(135deg, #D4F5E9 0%, #B8E8DA 100%); }
    .stat-card:nth-child(3) .stat-icon { background: linear-gradient(135deg, #E8E0F5 0%, #D4C9EB 100%); }
    .stat-card:nth-child(4) .stat-icon { background: linear-gradient(135deg, #FFF3D6 0%, #FFE8B8 100%); }

    .stat-card h3 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-card p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .section-title {
      font-size: 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title span {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Reminder Cards */
    .reminder-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }

    .reminder-card {
      background: white;
      padding: 20px 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .reminder-card:hover {
      transform: translateX(8px);
      box-shadow: var(--shadow-hover);
    }

    .reminder-date {
      min-width: 60px;
      text-align: center;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border-radius: var(--radius-md);
      color: white;
    }

    .reminder-date .day {
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
    }

    .reminder-date .month {
      font-size: 12px;
      opacity: 0.9;
    }

    .reminder-info {
      flex: 1;
    }

    .reminder-info h4 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .reminder-info p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .reminder-tag {
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 500;
    }

    .tag-birthday { background: #FFE0DC; color: #E5685A; }
    .tag-health { background: #D4F5E9; color: #3D9A7E; }
    .tag-study { background: #E8E0F5; color: #8B6DC9; }
    .tag-life { background: #FFF3D6; color: #C49A3A; }

    /* Family Members */
    .family-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .member-card {
      background: white;
      padding: 28px 20px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .member-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
    }

    .member-avatar {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, var(--bg-warm) 0%, #FFE8E3 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 16px;
    }

    .member-card h4 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .member-card p {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Records Page */
    .filter-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-tab {
      padding: 10px 20px;
      border-radius: var(--radius-full);
      background: white;
      border: 1px solid rgba(255, 127, 110, 0.2);
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 14px;
      color: var(--text-muted);
    }

    .filter-tab:hover, .filter-tab.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .records-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .record-card {
      background: white;
      padding: 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      display: flex;
      gap: 16px;
      transition: all 0.3s ease;
    }

    .record-card:hover {
      transform: translateX(4px);
      box-shadow: var(--shadow-hover);
    }

    .record-type-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .record-content {
      flex: 1;
    }

    .record-content h4 {
      font-size: 16px;
      margin-bottom: 6px;
    }

    .record-content p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .record-meta {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .record-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Members Page */
    .members-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .member-detail-card {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    .member-detail-header {
      padding: 32px 24px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      text-align: center;
    }

    .member-detail-header .big-avatar {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 16px;
    }

    .member-detail-header h3 {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .member-detail-header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .member-detail-body {
      padding: 24px;
    }

    .member-info-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .member-info-row:last-child {
      border-bottom: none;
    }

    .member-info-row label {
      color: var(--text-muted);
      font-size: 14px;
    }

    .member-info-row span {
      font-weight: 500;
    }

    /* Floating Action Button */
    .fab {
      position: fixed;
      right: 40px;
      bottom: 40px;
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      box-shadow: var(--shadow-hover);
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 200;
      border: none;
    }

    .fab:hover {
      transform: scale(1.1);
    }

    .fab.recording {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: white;
      border-radius: var(--radius-lg);
      padding: 32px;
      width: 90%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(20px);
      transition: all 0.3s ease;
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal h3 {
      font-size: 22px;
      margin-bottom: 24px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid rgba(255, 127, 110, 0.15);
      border-radius: var(--radius-md);
      font-size: 15px;
      font-family: inherit;
      transition: all 0.3s ease;
      background: white;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn {
      padding: 14px 28px;
      border-radius: var(--radius-full);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      width: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .btn-secondary {
      background: rgba(255, 127, 110, 0.1);
      color: var(--primary);
    }

    .btn-secondary:hover {
      background: rgba(255, 127, 110, 0.2);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .modal-actions .btn {
      flex: 1;
    }

    .voice-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent-mint) 0%, #5BC4AE 100%);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 12px;
    }

    .voice-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(126, 216, 196, 0.4);
    }

    .voice-btn.recording {
      animation: pulse 1s infinite;
      background: linear-gradient(135deg, #FF6B6B 0%, #FF8E8E 100%);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state .icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .empty-state h4 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--text-dark);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text-dark);
      color: white;
      padding: 14px 28px;
      border-radius: var(--radius-full);
      font-size: 14px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 2000;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .main-content {
        margin-left: 0;
        padding: 20px;
        padding-bottom: 100px;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .fab {
        right: 20px;
        bottom: 90px;
      }

      .mobile-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: white;
        display: flex;
        justify-content: space-around;
        padding: 12px 0;
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
        z-index: 100;
      }

      .mobile-nav .nav-item {
        flex-direction: column;
        gap: 4px;
        padding: 8px 16px;
        font-size: 11px;
      }
    }

    @media (min-width: 769px) {
      .mobile-nav {
        display: none;
      }
    }

    /* Celebration Animation */
    @keyframes celebrate {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .celebration {
      animation: celebrate 0.5s ease;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon">🏠</div>
        <div class="logo-text">
          <h1>家庭助手</h1>
          <span>温暖的记忆管家</span>
        </div>
      </div>
      <nav class="nav-menu">
        <a href="#home" class="nav-item active" data-page="home">
          <i data-lucide="home"></i>
          <span>首页</span>
        </a>
        <a href="#records" class="nav-item" data-page="records">
          <i data-lucide="book-open"></i>
          <span>生活记录</span>
        </a>
        <a href="#members" class="nav-item" data-page="members">
          <i data-lucide="users"></i>
          <span>家庭成员</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Home Page -->
      <section id="home" class="page active">
        <div class="date-badge">
          <i data-lucide="calendar" style="width:16px;height:16px;"></i>
          <span id="currentDate"></span>
        </div>

        <div class="page-header">
          <h2>你好，主人 👋</h2>
          <p>今天有什么需要记住的事情吗？</p>
        </div>

        <div class="stats-grid">
          <div class="stat-card" onclick="navigateTo('records')">
            <div class="stat-icon">📝</div>
            <h3 id="totalRecords">0</h3>
            <p>总记录数</p>
          </div>
          <div class="stat-card" onclick="navigateTo('records', {filter: 'health'})">
            <div class="stat-icon">💊</div>
            <h3 id="healthCount">0</h3>
            <p>健康记录</p>
          </div>
          <div class="stat-card" onclick="navigateTo('records', {filter: 'study'})">
            <div class="stat-icon">📚</div>
            <h3 id="studyCount">0</h3>
            <p>学习记录</p>
          </div>
          <div class="stat-card" onclick="navigateTo('members')">
            <div class="stat-icon">👨‍👩‍👧</div>
            <h3 id="memberCount">0</h3>
            <p>家庭成员</p>
          </div>
        </div>

        <h3 class="section-title">📅 近期提醒 <span>未来7天</span></h3>
        <div class="reminder-list" id="reminderList">
          <!-- Reminders will be inserted here -->
        </div>

        <h3 class="section-title">👨‍👩‍👧 家庭成员</h3>
        <div class="family-grid" id="familyGrid">
          <!-- Members will be inserted here -->
        </div>
      </section>

      <!-- Records Page -->
      <section id="records" class="page">
        <div class="page-header">
          <h2>生活记录簿</h2>
          <p>记录生活中的每一个重要时刻</p>
        </div>

        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">全部</button>
          <button class="filter-tab" data-filter="study">📚 学习</button>
          <button class="filter-tab" data-filter="health">💊 健康</button>
          <button class="filter-tab" data-filter="life">🌿 生活</button>
          <button class="filter-tab" data-filter="important">⭐ 重要日期</button>
        </div>

        <div class="records-list" id="recordsList">
          <!-- Records will be inserted here -->
        </div>
      </section>

      <!-- Members Page -->
      <section id="members" class="page">
        <div class="page-header">
          <h2>家庭成员</h2>
          <p>管理每一位家人的重要信息</p>
        </div>

        <div class="members-container" id="membersContainer">
          <!-- Member cards will be inserted here -->
        </div>
      </section>
    </main>

    <!-- Mobile Navigation -->
    <nav class="mobile-nav">
      <a href="#home" class="nav-item active" data-page="home">
        <i data-lucide="home"></i>
        <span>首页</span>
      </a>
      <a href="#records" class="nav-item" data-page="records">
        <i data-lucide="book-open"></i>
        <span>记录</span>
      </a>
      <a href="#members" class="nav-item" data-page="members">
        <i data-lucide="users"></i>
        <span>成员</span>
      </a>
    </nav>

    <!-- Floating Action Button -->
    <button class="fab" id="fabBtn" title="添加记录">
      <i data-lucide="plus"></i>
    </button>

    <!-- Add Record Modal -->
    <div class="modal-overlay" id="recordModal">
      <div class="modal">
        <h3>✨ 添加新记录</h3>
        <form id="recordForm">
          <div class="form-group">
            <label>标题</label>
            <input type="text" id="recordTitle" placeholder="给记录起个标题" required>
          </div>
          <div class="form-group">
            <label>内容</label>
            <textarea id="recordContent" placeholder="详细描述一下..."></textarea>
          </div>
          <div class="form-group">
            <label>类型</label>
            <select id="recordType">
              <option value="life">🌿 生活</option>
              <option value="study">📚 学习</option>
              <option value="health">💊 健康</option>
              <option value="important">⭐ 重要日期</option>
            </select>
          </div>
          <div class="form-group">
            <label>关联成员</label>
            <select id="recordMember">
              <option value="">无</option>
            </select>
          </div>
          <div class="form-group">
            <label>日期</label>
            <input type="date" id="recordDate" required>
          </div>
          <button type="button" class="voice-btn" id="voiceInput">
            <i data-lucide="mic"></i>
            <span>语音输入</span>
          </button>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal('recordModal')">取消</button>
            <button type="submit" class="btn btn-primary">保存</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Add Member Modal -->
    <div class="modal-overlay" id="memberModal">
      <div class="modal">
        <h3>👨‍👩‍👧 添加家庭成员</h3>
        <form id="memberForm">
          <div class="form-group">
            <label>姓名</label>
            <input type="text" id="memberName" placeholder="成员姓名" required>
          </div>
          <div class="form-group">
            <label>关系</label>
            <select id="memberRelation">
              <option value="父亲">👨 父亲</option>
              <option value="母亲">👩 母亲</option>
              <option value="子女">👧 子女</option>
              <option value="配偶">💑 配偶</option>
              <option value="其他">👤 其他</option>
            </select>
          </div>
          <div class="form-group">
            <label>生日</label>
            <input type="date" id="memberBirthday">
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal('memberModal')">取消</button>
            <button type="submit" class="btn btn-primary">保存</button>
          </div>
        </form>
      </div>
    </div>

    <!-- View Member Modal -->
    <div class="modal-overlay" id="viewMemberModal">
      <div class="modal">
        <div class="member-detail-card">
          <div class="member-detail-header">
            <div class="big-avatar" id="viewMemberAvatar">👤</div>
            <h3 id="viewMemberName">成员姓名</h3>
            <p id="viewMemberRelation">关系</p>
          </div>
          <div class="member-detail-body">
            <div class="member-info-row">
              <label>生日</label>
              <span id="viewMemberBirthday">-</span>
            </div>
            <div class="member-info-row">
              <label>专属记录</label>
              <span id="viewMemberRecords">0 条</span>
            </div>
          </div>
        </div>
        <div class="modal-actions" style="margin-top: 20px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('viewMemberModal')">关闭</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">保存成功</div>
  </div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Data Store
    const STORAGE_KEYS = {
      members: 'family_members',
      records: 'family_records'
    };

    // Avatar emojis for members
    const AVATARS = {
      '父亲': '👨',
      '母亲': '👩',
      '子女': '👧',
      '配偶': '💑',
      '其他': '👤'
    };

    const TYPE_ICONS = {
      study: '📚',
      health: '💊',
      life: '🌿',
      important: '⭐'
    };

    // Load data from localStorage
    function loadData(key) {
      const data = localStorage.getItem(key);
      return data ? JSON.parse(data) : null;
    }

    // Save data to localStorage
    function saveData(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }

    // Initialize with sample data if empty
    function initializeSampleData() {
      if (!loadData(STORAGE_KEYS.members)) {
        const sampleMembers = [
          { id: '1', name: '爸爸', relation: '父亲', birthday: '1980-05-15', avatar: '👨', createdAt: Date.now() },
          { id: '2', name: '妈妈', relation: '母亲', birthday: '1985-08-20', avatar: '👩', createdAt: Date.now() },
          { id: '3', name: '乐乐', relation: '子女', birthday: '2015-03-10', avatar: '👧', createdAt: Date.now() }
        ];
        saveData(STORAGE_KEYS.members, sampleMembers);
      }

      if (!loadData(STORAGE_KEYS.records)) {
        const today = new Date();
        const formatDate = (d) => d.toISOString().split('T')[0];
        
        const nextWeek = new Date(today);
        nextWeek.setDate(nextWeek.getDate() + 5);
        
        const sampleRecords = [
          { id: '1', title: '妈妈生日', content: '记得准备礼物和蛋糕', type: 'important', memberId: '2', date: '2026-08-20', isCompleted: false, createdAt: Date.now() },
          { id: '2', title: '爸爸体检', content: '年度健康体检，早上空腹', type: 'health', memberId: '1', date: formatDate(nextWeek), isCompleted: false, createdAt: Date.now() },
          { id: '3', title: '乐乐期中考试成绩', content: '语文95分，数学98分，很棒！', type: 'study', memberId: '3', date: formatDate(today), isCompleted: false, createdAt: Date.now() },
          { id: '4', title: '家庭大扫除', content: '周末一起打扫卫生', type: 'life', memberId: '', date: formatDate(today), isCompleted: true, createdAt: Date.now() }
        ];
        saveData(STORAGE_KEYS.records, sampleRecords);
      }
    }

    // Get all members
    function getMembers() {
      return loadData(STORAGE_KEYS.members) || [];
    }

    // Get all records
    function getRecords() {
      return loadData(STORAGE_KEYS.records) || [];
    }

    // Generate unique ID
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    // Format date
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return {
        month: date.toLocaleDateString('zh-CN', { month: 'short' }),
        day: date.getDate(),
        full: date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' })
      };
    }

    // Update current date display
    function updateDateDisplay() {
      const now = new Date();
      const dateStr = now.toLocaleDateString('zh-CN', { 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric',
        weekday: 'long'
      });
      document.getElementById('currentDate').textContent = dateStr;
    }

    // Update statistics on home page
    function updateStats() {
      const records = getRecords();
      const members = getMembers();
      
      document.getElementById('totalRecords').textContent = records.length;
      document.getElementById('healthCount').textContent = records.filter(r => r.type === 'health').length;
      document.getElementById('studyCount').textContent = records.filter(r => r.type === 'study').length;
      document.getElementById('memberCount').textContent = members.length;
    }

    // Get upcoming reminders (next 7 days)
    function getUpcomingReminders() {
      const records = getRecords();
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const nextWeek = new Date(today);
      nextWeek.setDate(nextWeek.getDate() + 7);

      return records.filter(record => {
        const recordDate = new Date(record.date);
        return recordDate >= today && recordDate <= nextWeek && !record.isCompleted;
      }).sort((a, b) => new Date(a.date) - new Date(b.date));
    }

    // Render reminders on home page
    function renderReminders() {
      const container = document.getElementById('reminderList');
      const reminders = getUpcomingReminders();
      const members = getMembers();

      if (reminders.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">📅</div>
            <h4>暂无近期提醒</h4>
            <p>点击右下角按钮添加新记录</p>
          </div>
        `;
        return;
      }

      container.innerHTML = reminders.map(record => {
        const member = members.find(m => m.id === record.memberId);
        const dateInfo = formatDate(record.date);
        const typeLabels = { study: '学习', health: '健康', life: '生活', important: '重要日期' };
        
        return `
          <div class="reminder-card" onclick="openRecordDetail('${record.id}')">
            <div class="reminder-date">
              <div class="day">${dateInfo.day}</div>
              <div class="month">${dateInfo.month}</div>
            </div>
            <div class="reminder-info">
              <h4>${record.title}</h4>
              <p>${record.content || '无详细描述'}</p>
            </div>
            <span class="reminder-tag tag-${record.type}">${typeLabels[record.type]}</span>
          </div>
        `;
      }).join('');
    }

    // Render family members on home page
    function renderFamilyGrid() {
      const container = document.getElementById('familyGrid');
      const members = getMembers();

      container.innerHTML = members.map(member => `
        <div class="member-card" onclick="viewMember('${member.id}')">
          <div class="member-avatar">${member.avatar}</div>
          <h4>${member.name}</h4>
          <p>${member.relation}</p>
        </div>
      `).join('');
    }

    // Render records list
    function renderRecords(filter = 'all') {
      const container = document.getElementById('recordsList');
      const records = getRecords();
      const members = getMembers();

      let filteredRecords = records;
      if (filter !== 'all') {
        filteredRecords = records.filter(r => r.type === filter);
      }

      filteredRecords.sort((a, b) => new Date(b.date) - new Date(a.date));

      if (filteredRecords.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">📝</div>
            <h4>暂无记录</h4>
            <p>点击右下角按钮添加第一条记录</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filteredRecords.map(record => {
        const member = members.find(m => m.id === record.memberId);
        const dateInfo = formatDate(record.date);
        const typeLabels = { study: '📚 学习', health: '💊 健康', life: '🌿 生活', important: '⭐ 重要日期' };
        
        return `
          <div class="record-card">
            <div class="record-type-icon" style="background: ${record.type === 'study' ? '#E8E0F5' : record.type === 'health' ? '#D4F5E9' : record.type === 'important' ? '#FFF3D6' : '#F0F9F7'}">
              ${TYPE_ICONS[record.type]}
            </div>
            <div class="record-content">
              <h4>${record.title}</h4>
              <p>${record.content || '无详细描述'}</p>
              <div class="record-meta">
                <span><i data-lucide="calendar" style="width:12px;height:12px;"></i> ${dateInfo.full}</span>
                ${member ? `<span><i data-lucide="user" style="width:12px;height:12px;"></i> ${member.name}</span>` : ''}
                <span>${typeLabels[record.type]}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // Render members page
    function renderMembersPage() {
      const container = document.getElementById('membersContainer');
      const members = getMembers();
      const records = getRecords();

      container.innerHTML = members.map(member => {
        const memberRecords = records.filter(r => r.memberId === member.id);
        const birthday = member.birthday ? formatDate(member.birthday).full : '-';
        
        return `
          <div class="member-detail-card">
            <div class="member-detail-header">
              <div class="big-avatar">${member.avatar}</div>
              <h3>${member.name}</h3>
              <p>${member.relation}</p>
            </div>
            <div class="member-detail-body">
              <div class="member-info-row">
                <label>生日</label>
                <span>${birthday}</span>
              </div>
              <div class="member-info-row">
                <label>专属记录</label>
                <span>${memberRecords.length} 条</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Update member select dropdown in record form
    function updateMemberSelect() {
      const select = document.getElementById('recordMember');
      const members = getMembers();
      select.innerHTML = '<option value="">无</option>' + 
        members.map(m => `<option value="${m.id}">${m.avatar} ${m.name}</option>`).join('');
    }

    // Navigation
    function navigateTo(page, options = {}) {
      window.location.hash = page;
      if (options.filter) {
        setTimeout(() => {
          document.querySelector(`.filter-tab[data-filter="${options.filter}"]`)?.click();
        }, 100);
      }
    }

    // Handle hash changes
    function handleHashChange() {
      const hash = window.location.hash.slice(1) || 'home';
      const pages = document.querySelectorAll('.page');
      const navItems = document.querySelectorAll('.nav-item');

      pages.forEach(page => page.classList.remove('active'));
      navItems.forEach(item => item.classList.remove('active'));

      document.getElementById(hash)?.classList.add('active');
      document.querySelectorAll(`.nav-item[data-page="${hash}"]`).forEach(item => item.classList.add('active'));

      // Refresh page content
      if (hash === 'home') {
        updateStats();
        renderReminders();
        renderFamilyGrid();
      } else if (hash === 'records') {
        renderRecords();
      } else if (hash === 'members') {
        renderMembersPage();
      }
    }

    // Modal controls
    function openModal(modalId) {
      document.getElementById(modalId).classList.add('active');
      if (modalId === 'recordModal') {
        updateMemberSelect();
        document.getElementById('recordDate').valueAsDate = new Date();
      }
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    // Show toast
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // View member detail
    function viewMember(memberId) {
      const members = getMembers();
      const records = getRecords();
      const member = members.find(m => m.id === memberId);
      
      if (member) {
        document.getElementById('viewMemberAvatar').textContent = member.avatar;
        document.getElementById('viewMemberName').textContent = member.name;
        document.getElementById('viewMemberRelation').textContent = member.relation;
        document.getElementById('viewMemberBirthday').textContent = member.birthday ? formatDate(member.birthday).full : '-';
        document.getElementById('viewMemberRecords').textContent = records.filter(r => r.memberId === memberId).length + ' 条';
        openModal('viewMemberModal');
      }
    }

    // Open record detail (simple version - could be expanded)
    function openRecordDetail(recordId) {
      const records = getRecords();
      const record = records.find(r => r.id === recordId);
      if (record) {
        showToast(`查看: ${record.title}`);
      }
    }

    // Speech Recognition
    let recognition = null;
    let isRecording = false;

    function initSpeechRecognition() {
      if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = 'zh-CN';

        recognition.onresult = function(event) {
          let transcript = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          document.getElementById('recordTitle').value = transcript;
        };

        recognition.onend = function() {
          isRecording = false;
          document.getElementById('voiceInput')?.classList.remove('recording');
          document.getElementById('fabBtn')?.classList.remove('recording');
        };
      }
    }

    function toggleVoiceInput() {
      if (!recognition) {
        showToast('您的浏览器不支持语音识别');
        return;
      }

      if (isRecording) {
        recognition.stop();
        isRecording = false;
        document.getElementById('voiceInput')?.classList.remove('recording');
        document.getElementById('fabBtn')?.classList.remove('recording');
      } else {
        recognition.start();
        isRecording = true;
        document.getElementById('voiceInput')?.classList.add('recording');
        document.getElementById('fabBtn')?.classList.add('recording');
        showToast('正在聆听，请说话...');
      }
    }

    // Text-to-Speech
    function speak(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 1;
        speechSynthesis.speak(utterance);
      }
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      initializeSampleData();
      updateDateDisplay();
      initSpeechRecognition();

      // Handle navigation
      window.addEventListener('hashchange', handleHashChange);
      handleHashChange();

      // FAB click
      document.getElementById('fabBtn').addEventListener('click', () => {
        openModal('recordModal');
      });

      // Filter tabs
      document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          renderRecords(tab.dataset.filter);
        });
      });

      // Record form submit
      document.getElementById('recordForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const record = {
          id: generateId(),
          title: document.getElementById('recordTitle').value,
          content: document.getElementById('recordContent').value,
          type: document.getElementById('recordType').value,
          memberId: document.getElementById('recordMember').value,
          date: document.getElementById('recordDate').value,
          isCompleted: false,
          createdAt: Date.now()
        };

        const records = getRecords();
        records.push(record);
        saveData(STORAGE_KEYS.records, records);

        closeModal('recordModal');
        document.getElementById('recordForm').reset();
        showToast('记录已保存');
        speak('记录已保存成功');
        
        // Refresh current view
        handleHashChange();

        // Add celebration animation to the new card
        setTimeout(() => {
          const cards = document.querySelectorAll('.record-card');
          if (cards.length > 0) {
            cards[0].classList.add('celebration');
          }
        }, 100);
      });

      // Member form submit
      document.getElementById('memberForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const relation = document.getElementById('memberRelation').value;
        const member = {
          id: generateId(),
          name: document.getElementById('memberName').value,
          relation: relation,
          birthday: document.getElementById('memberBirthday').value,
          avatar: AVATARS[relation] || '👤',
          createdAt: Date.now()
        };

        const members = getMembers();
        members.push(member);
        saveData(STORAGE_KEYS.members, members);

        closeModal('memberModal');
        document.getElementById('memberForm').reset();
        showToast('成员已添加');
        speak('家庭成员已添加成功');
        
        renderMembersPage();
        renderFamilyGrid();
        updateStats();
      });

      // Voice input button
      document.getElementById('voiceInput').addEventListener('click', toggleVoiceInput);

      // Close modal on overlay click
      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            overlay.classList.remove('active');
          }
        });
      });

      // Add member button on members page
      setTimeout(() => {
        const membersContainer = document.getElementById('membersContainer');
        if (membersContainer && window.location.hash === '#members') {
          renderMembersPage();
        }
      }, 500);
    });

    // Make functions globally available
    window.navigateTo = navigateTo;
    window.viewMember = viewMember;
    window.openRecordDetail = openRecordDetail;
    window.closeModal = closeModal;
  </script>
</body>
</html>
