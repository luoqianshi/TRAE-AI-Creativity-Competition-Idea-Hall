<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热血地图 · AI 献血点导航</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: linear-gradient(180deg, #fff5f5 0%, #ffeaea 100%);
  color: #333;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.04;
  background-image:
    radial-gradient(circle, #e53935 1px, transparent 1px);
  background-size: 24px 24px;
}

/* 头部 */
.header {
  background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
  color: #fff; padding: 18px 28px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 4px 18px rgba(183,28,28,0.25);
  position: relative; z-index: 10;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.logo {
  width: 48px; height: 48px; background: #fff; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; position: relative;
  box-shadow: 0 3px 8px rgba(0,0,0,0.2);
}
.logo::before, .logo::after {
  content: ''; position: absolute; background: #d32f2f; border-radius: 2px;
}
.logo::before { width: 28px; height: 7px; }
.logo::after { width: 7px; height: 28px; }
.header h1 { font-size: 24px; letter-spacing: 2px; font-weight: 900; }
.header .sub { font-size: 12px; opacity: 0.85; letter-spacing: 1px; margin-top: 2px; }
.header-stats { display: flex; gap: 18px; align-items: center; }
.header-stat {
  text-align: right;
}
.header-stat .lbl { font-size: 11px; opacity: 0.85; letter-spacing: 1px; }
.header-stat .num { font-size: 22px; font-weight: 900; }
.live-dot {
  display: inline-block; width: 8px; height: 8px; background: #4caf50; border-radius: 50%;
  margin-right: 4px; animation: livePulse 1.5s ease-in-out infinite;
}
@keyframes livePulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(76,175,80,0.5); }
  50% { box-shadow: 0 0 0 6px rgba(76,175,80,0); }
}

/* 仪表盘 */
.dashboard {
  display: flex; gap: 16px; padding: 18px 28px;
  background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(229,57,53,0.1);
  position: relative; z-index: 5; flex-wrap: wrap;
}
.blood-gauge {
  flex: 1; min-width: 150px;
  background: rgba(255,255,255,0.9);
  border: 1px solid rgba(229,57,53,0.15);
  border-radius: 12px; padding: 12px; text-align: center;
  cursor: pointer; transition: all 0.25s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  position: relative; overflow: hidden;
}
.blood-gauge::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, #e53935, #ff7043);
}
.blood-gauge:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(229,57,53,0.18); border-color: #e53935; }
.blood-gauge.urgent { border-color: #e53935; animation: urgentShake 2s ease-in-out infinite; }
@keyframes urgentShake {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}
.gauge-svg { width: 90px; height: 90px; }
.blood-gauge .type { font-size: 20px; font-weight: 900; color: #c62828; margin-top: 4px; letter-spacing: 2px; }
.blood-gauge .level { font-size: 11px; color: #888; margin-top: 2px; }
.blood-gauge .status-tag {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 10px; font-weight: 800; margin-top: 4px; letter-spacing: 1px;
}
.blood-gauge .status-tag.urgent { background: #ffebee; color: #c62828; }
.blood-gauge .status-tag.ok { background: #e8f5e9; color: #2e7d32; }

.main {
  display: grid; grid-template-columns: 1fr 380px; gap: 20px;
  padding: 20px 28px; max-width: 1400px; margin: 0 auto;
  position: relative; z-index: 2;
}
.map-box {
  background: rgba(255,255,255,0.95);
  border-radius: 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  padding: 18px; position: relative;
  min-height: 540px;
  border: 1px solid rgba(229,57,53,0.1);
}
.map-box-title {
  color: #c62828; margin-bottom: 14px; font-size: 17px; font-weight: 800;
  display: flex; align-items: center; gap: 8px;
}
.map-box-title::before { content: ''; width: 4px; height: 18px; background: linear-gradient(180deg, #e53935, #ff7043); border-radius: 2px; }
.map-box-title .ico { font-size: 18px; }
.map-box-title .badge {
  margin-left: auto; padding: 3px 10px; background: #ffebee;
  color: #c62828; border-radius: 12px; font-size: 11px; font-weight: 700;
}
#mapSvg {
  width: 100%; height: 500px; display: block;
  background: linear-gradient(180deg, #f5f7fa 0%, #ebeef2 100%);
  border-radius: 10px; border: 1px solid #e0e0e0;
}
.pin { cursor: pointer; }
.pin circle { transition: all 0.3s; }
.pin:hover circle.pin-dot { r: 13; }
.pin.active circle.pin-dot { r: 14; fill: #ff1744; filter: drop-shadow(0 0 8px #ff1744); }
.pin.active .pulse-ring { fill: #ff1744; }
.pulse { animation: pulse 2s infinite; transform-origin: center; }
@keyframes pulse {
  0% { r: 10; opacity: 0.7; }
  100% { r: 32; opacity: 0; }
}
.route-path {
  stroke-dasharray: 8 4; animation: dash 1s linear infinite;
  filter: drop-shadow(0 0 4px rgba(229,57,53,0.5));
}
@keyframes dash { to { stroke-dashoffset: -12; } }

.map-legend {
  position: absolute; bottom: 28px; right: 28px;
  background: rgba(255,255,255,0.95); border: 1px solid #e0e0e0;
  border-radius: 8px; padding: 10px 14px; font-size: 11px; color: #666;
  display: flex; flex-direction: column; gap: 6px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.map-legend .item { display: flex; align-items: center; gap: 6px; }
.map-legend .dot { width: 10px; height: 10px; border-radius: 50%; background: #e53935; box-shadow: 0 0 4px #e53935; }

.info-box {
  background: rgba(255,255,255,0.95);
  border-radius: 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  padding: 18px; max-height: 600px; overflow-y: auto;
  border: 1px solid rgba(229,57,53,0.1);
}
.info-box h3 {
  color: #c62828; margin-bottom: 14px; font-size: 17px; font-weight: 800;
  display: flex; align-items: center; gap: 8px;
  padding-bottom: 10px; border-bottom: 2px solid #ffebee;
}
.info-box h3::before { content: '📋'; }
.info-box h3 .count {
  margin-left: auto; padding: 2px 10px; background: #ffebee;
  color: #c62828; border-radius: 12px; font-size: 11px; font-weight: 700;
}
.point-card {
  border: 1px solid #eee; border-radius: 10px; padding: 14px;
  margin-bottom: 12px; cursor: pointer; transition: all 0.3s;
  position: relative; background: #fafafa;
}
.point-card:hover { border-color: #e53935; box-shadow: 0 4px 12px rgba(229,57,53,0.15); transform: translateX(-2px); }
.point-card.active { border-color: #e53935; background: linear-gradient(135deg, #ffebee 0%, #fff 100%); box-shadow: 0 4px 12px rgba(229,57,53,0.2); }
.point-card .name { font-weight: 800; font-size: 15px; margin-bottom: 6px; color: #c62828; display: flex; align-items: center; gap: 6px; }
.point-card .num-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; background: #e53935; color: #fff;
  border-radius: 50%; font-size: 11px; font-weight: 900;
}
.point-card .meta { font-size: 12px; color: #666; display: flex; gap: 12px; flex-wrap: wrap; }
.point-card .meta span { display: flex; align-items: center; gap: 3px; }
.queue-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.queue-bar { flex: 1; height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
.queue-fill { height: 100%; background: linear-gradient(90deg, #4caf50, #ff9800, #e53935); border-radius: 3px; transition: width 0.5s; }
.queue-text { font-size: 11px; color: #666; min-width: 60px; text-align: right; }
.blood-need {
  display: inline-block; background: linear-gradient(135deg, #ffcdd2, #ef9a9a);
  color: #b71c1c; padding: 3px 8px; border-radius: 6px;
  font-size: 11px; margin-top: 4px; font-weight: 800;
  box-shadow: 0 1px 3px rgba(229,57,53,0.2);
}
.nav-btn {
  background: linear-gradient(135deg, #e53935, #c62828); color: #fff;
  border: none; padding: 7px 16px; border-radius: 18px; cursor: pointer;
  font-size: 12px; margin-top: 10px; transition: all 0.2s;
  box-shadow: 0 3px 8px rgba(229,57,53,0.3);
  font-weight: 700; letter-spacing: 1px; display: flex; align-items: center; gap: 4px;
}
.nav-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 12px rgba(229,57,53,0.4); }

.drop { position: fixed; pointer-events: none; z-index: 1000; }

/* 详情弹窗 */
.detail-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: none; align-items: center; justify-content: center; z-index: 2000;
  backdrop-filter: blur(3px);
}
.detail-modal.show { display: flex; animation: fadeIn 0.2s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-content {
  background: #fff; border-radius: 16px; padding: 30px;
  width: 360px; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  animation: modalIn 0.3s cubic-bezier(.2,1.5,.4,1);
  border-top: 5px solid #e53935;
  position: relative;
}
@keyframes modalIn { from { transform: scale(0.7) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
.modal-close {
  position: absolute; top: 12px; right: 14px;
  background: none; border: none; font-size: 22px; cursor: pointer;
  color: #999; width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: #f5f5f5; color: #e53935; }
.modal-content h3 { color: #c62828; margin-bottom: 14px; font-size: 18px; font-weight: 800; }
.modal-content .big-type {
  font-size: 56px; font-weight: 900; color: #e53935;
  font-family: 'Arial', sans-serif; line-height: 1;
  text-shadow: 2px 2px 0 rgba(255,205,210,0.8);
}
.modal-content .stats { margin: 18px 0; text-align: left; padding: 0 8px; }
.modal-content .stats p { padding: 6px 0; border-bottom: 1px dashed #eee; font-size: 13px; color: #555; }
.modal-content .stats p:last-child { border-bottom: none; }
.modal-content .stats strong { color: #c62828; }

/* Toast */
.toast {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px);
  background: rgba(229,57,53,0.95); color: #fff; padding: 10px 22px; border-radius: 22px;
  font-size: 13px; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 100;
  box-shadow: 0 6px 20px rgba(229,57,53,0.4); pointer-events: none;
  display: flex; align-items: center; gap: 6px;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 960px) {
  .main { grid-template-columns: 1fr; padding: 14px; }
  .header { padding: 14px 18px; }
  .header h1 { font-size: 18px; }
  .header-stats { gap: 10px; }
  .dashboard { padding: 12px; gap: 8px; }
  .blood-gauge { min-width: 80px; }
  .gauge-svg { width: 60px; height: 60px; }
  .info-box { max-height: 400px; }
  #mapSvg { height: 360px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo"></div>
    <div>
      <h1>热血地图</h1>
      <div class="sub">智能献血点导航 · 让爱心不等待</div>
    </div>
  </div>
  <div class="header-stats">
    <div class="header-stat">
      <div class="lbl"><span class="live-dot"></span>今日献血</div>
      <div class="num" id="todayCount">128</div>
    </div>
    <div class="header-stat">
      <div class="lbl">在线志愿</div>
      <div class="num" id="volCount">2,341</div>
    </div>
  </div>
</div>

<div class="dashboard" id="dashboard"></div>

<div class="main">
  <div class="map-box">
    <div class="map-box-title">
      <span class="ico">🗺️</span>城市献血点分布
      <span class="badge" id="urgentBadge">1 处急需</span>
    </div>
    <svg id="mapSvg" viewBox="0 0 600 500"></svg>
    <div class="map-legend">
      <div class="item"><span class="dot"></span>献血点</div>
      <div class="item"><span class="dot" style="background:#ff1744;"></span>当前选中</div>
      <div class="item">━━━ 导航路线</div>
    </div>
  </div>
  <div class="info-box">
    <h3>献血点列表<span class="count" id="pointCount">5</span></h3>
    <div id="pointList"></div>
  </div>
</div>

<div class="detail-modal" id="detailModal">
  <div class="modal-content" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const bloodTypes = [
  {type:'A', level:75, status:'ok', tag:'充足'},
  {type:'B', level:45, status:'urgent', tag:'紧张'},
  {type:'O', level:30, status:'urgent', tag:'急需'},
  {type:'AB', level:60, status:'ok', tag:'正常'}
];
const points = [
  {id:1, name:'市中心广场献血屋', x:200, y:180, dist:'0.8km', queue:35, time:'09:00-17:00', need:'O型'},
  {id:2, name:'人民医院献血点', x:420, y:120, dist:'2.3km', queue:60, time:'08:30-16:30', need:'A型'},
  {id:3, name:'大学城献血车', x:150, y:340, dist:'3.1km', queue:15, time:'10:00-18:00', need:'B型'},
  {id:4, name:'火车站献血屋', x:480, y:320, dist:'4.5km', queue:80, time:'07:00-20:00', need:'AB型'},
  {id:5, name:'万达广场献血点', x:330, y:260, dist:'1.5km', queue:45, time:'09:30-17:30', need:'O型'},
];

function showToast(icon, text){
  const t = document.getElementById('toast');
  t.innerHTML = '<span>'+icon+'</span><span>'+text+'</span>';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

const dashboard = document.getElementById('dashboard');
bloodTypes.forEach(b=>{
  const d = document.createElement('div');
  d.className = 'blood-gauge' + (b.status==='urgent' ? ' urgent' : '');
  d.innerHTML = `
    <svg class="gauge-svg" viewBox="0 0 80 80">
      <defs>
        <linearGradient id="gaugeGrad${b.type}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="${b.status==='urgent'?'#ff7043':'#66bb6a'}"/>
          <stop offset="100%" stop-color="${b.status==='urgent'?'#d32f2f':'#2e7d32'}"/>
        </linearGradient>
      </defs>
      <circle cx="40" cy="40" r="32" fill="none" stroke="#f5f5f5" stroke-width="6"/>
      <circle cx="40" cy="40" r="32" fill="none" stroke="url(#gaugeGrad${b.type})" stroke-width="6"
        stroke-dasharray="${b.level*2.01} 201" stroke-linecap="round"
        transform="rotate(-90 40 40)"/>
      <text x="40" y="46" text-anchor="middle" fill="#c62828" font-size="16" font-weight="900">${b.level}%</text>
    </svg>
    <div class="type">${b.type}型</div>
    <div class="level">库存 · ${Math.round(b.level*12)} 单位</div>
    <div class="status-tag ${b.status}">${b.tag}</div>
  `;
  d.addEventListener('click', ()=>showBloodDetail(b));
  dashboard.appendChild(d);
});

function showBloodDetail(b){
  const modal = document.getElementById('detailModal');
  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" onclick="document.getElementById('detailModal').classList.remove('show')">×</button>
    <h3>${b.type} 型血库存详情</h3>
    <div class="big-type">${b.level}%</div>
    <div class="stats">
      <p>当前库存量：<strong>${Math.round(b.level*12)} 单位</strong></p>
      <p>安全库存线：<strong>50%</strong></p>
      <p>本月已用：<strong>${Math.round((100-b.level)*3)} 单位</strong></p>
      <p>急需次数：<strong style="color:${b.level<50?'#e53935':'#2e7d32'}">${b.level<30?'紧急':b.level<50?'告警':'稳定'}</strong></p>
    </div>
    <button class="nav-btn" onclick="document.getElementById('detailModal').classList.remove('show')">查看献血点</button>
  `;
  modal.classList.add('show');
}
document.getElementById('detailModal').addEventListener('click', e=>{
  if(e.target.id==='detailModal') e.target.classList.remove('show');
});

const mapSvg = document.getElementById('mapSvg');
let svgContent = '';
// 网格背景
for(let i=0;i<=12;i++){ svgContent += `<line x1="${i*50}" y1="0" x2="${i*50}" y2="500" stroke="#e0e0e0" stroke-width="0.5"/>`; }
for(let i=0;i<=10;i++){ svgContent += `<line x1="0" y1="${i*50}" x2="600" y2="${i*50}" stroke="#e0e0e0" stroke-width="0.5"/>`; }
// 道路
svgContent += `<path d="M0,250 Q150,210 300,250 T600,230" fill="none" stroke="#bdbdbd" stroke-width="10" stroke-linecap="round"/>`;
svgContent += `<path d="M300,0 Q280,150 300,300 T320,500" fill="none" stroke="#bdbdbd" stroke-width="10" stroke-linecap="round"/>`;
svgContent += `<path d="M100,0 L100,500" fill="none" stroke="#bdbdbd" stroke-width="8" stroke-linecap="round" opacity="0.5"/>`;
svgContent += `<path d="M500,0 L500,500" fill="none" stroke="#bdbdbd" stroke-width="8" stroke-linecap="round" opacity="0.5"/>`;
// 河流
svgContent += `<path d="M0,420 Q150,400 300,420 T600,400" fill="none" stroke="#90caf9" stroke-width="14" stroke-linecap="round" opacity="0.6"/>`;
svgContent += `<path d="M0,420 Q150,400 300,420 T600,400" fill="none" stroke="#64b5f6" stroke-width="2" opacity="0.4"/>`;
// 区域块
svgContent += `<rect x="60" y="60" width="180" height="120" fill="#e8f5e9" opacity="0.4" rx="4"/>`;
svgContent += `<text x="150" y="125" text-anchor="middle" fill="#558b2f" font-size="12" font-weight="700">市民公园</text>`;
svgContent += `<rect x="380" y="380" width="160" height="100" fill="#e3f2fd" opacity="0.4" rx="4"/>`;
svgContent += `<text x="460" y="435" text-anchor="middle" fill="#1976d2" font-size="12" font-weight="700">商业中心</text>`;
// Pin
points.forEach(p=>{
  svgContent += `<g class="pin" data-id="${p.id}" transform="translate(${p.x},${p.y})">
    <circle class="pulse pulse-ring" r="10" fill="#e53935" opacity="0.4"/>
    <circle class="pin-dot" r="10" fill="#e53935" stroke="#fff" stroke-width="2.5"/>
    <text y="4" text-anchor="middle" fill="#fff" font-size="11" font-weight="900">${p.id}</text>
  </g>`;
});
svgContent += `<g id="routeGroup"></g>`;
mapSvg.innerHTML = svgContent;

const pointList = document.getElementById('pointList');
points.forEach(p=>{
  const c = document.createElement('div');
  c.className = 'point-card';
  c.dataset.id = p.id;
  c.innerHTML = `
    <div class="name"><span class="num-badge">${p.id}</span>${p.name}</div>
    <div class="meta">
      <span>📍 ${p.dist}</span>
      <span>🕒 ${p.time}</span>
    </div>
    <div class="queue-row">
      <div class="queue-bar"><div class="queue-fill" style="width:${p.queue}%"></div></div>
      <div class="queue-text">排队 ${p.queue}人</div>
    </div>
    <div style="margin-top:6px;"><span class="blood-need">🩸 急需 ${p.need}</span></div>
    <button class="nav-btn" data-id="${p.id}"><span>🧭</span>导航前往</button>
  `;
  c.addEventListener('click', e=>{
    if(e.target.classList.contains('nav-btn') || e.target.closest('.nav-btn')) return;
    selectPoint(p.id);
  });
  c.querySelector('.nav-btn').addEventListener('click', e=>{
    e.stopPropagation(); navigateTo(p);
  });
  pointList.appendChild(c);
});

function selectPoint(id){
  document.querySelectorAll('.pin').forEach(p=>p.classList.toggle('active', p.dataset.id==id));
  document.querySelectorAll('.point-card').forEach(c=>c.classList.toggle('active', c.dataset.id==id));
  const p = points.find(x=>x.id==id);
  if(p){
    const card = document.querySelector('.point-card[data-id="'+id+'"]');
    if(card) card.scrollIntoView({behavior:'smooth', block:'nearest'});
    showToast('📍', '已选中：'+p.name);
  }
}
document.querySelectorAll('.pin').forEach(p=>{
  p.addEventListener('click', ()=>selectPoint(p.dataset.id));
});

function navigateTo(p){
  const routeGroup = document.getElementById('routeGroup');
  routeGroup.innerHTML = `<path class="route-path" d="M300,250 Q${(300+p.x)/2},${Math.min(250,p.y)-50} ${p.x},${p.y}"
    fill="none" stroke="#e53935" stroke-width="3" stroke-linecap="round"/>`;
  setTimeout(()=>{ selectPoint(p.id); }, 500);
  showToast('🧭', '路线已绘制 · 距离 '+p.dist);
}

// 血滴下落
setInterval(()=>{
  const drop = document.createElement('div');
  drop.className = 'drop';
  drop.innerHTML = `<svg width="14" height="20" viewBox="0 0 16 22"><defs><linearGradient id="dropG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ef5350"/><stop offset="100%" stop-color="#b71c1c"/></linearGradient></defs><path d="M8,0 C8,0 0,10 0,15 C0,18.866 3.582,22 8,22 C12.418,22 16,18.866 16,15 C16,10 8,0 8,0 Z" fill="url(#dropG)" opacity="0.65"/></svg>`;
  drop.style.left = Math.random()*window.innerWidth + 'px';
  drop.style.top = '-30px';
  drop.style.transition = 'top 3.5s linear, opacity 0.6s';
  document.body.appendChild(drop);
  setTimeout(()=>{ drop.style.top = window.innerHeight+30+'px'; }, 10);
  setTimeout(()=>{ drop.style.opacity = '0'; }, 3000);
  setTimeout(()=>drop.remove(), 3700);
}, 900);

// 模拟数据
let todayCount = 128;
setInterval(()=>{
  if(Math.random() > 0.6){
    todayCount++;
    document.getElementById('todayCount').textContent = todayCount;
  }
}, 5000);
</script>
