    <style>
:root {
  color-scheme: dark;
  --bg: #08111f;
  --panel: rgba(255, 255, 255, 0.08);
  --panel-strong: rgba(255, 255, 255, 0.13);
  --text: #f3f7ff;
  --muted: #9eb0cc;
  --blue: #2f7cff;
  --blue-light: #69b7ff;
  --gold: #ffd166;
  --green: #6ee7b7;
  --danger: #ff7a90;
  --shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: start center;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background:
    radial-gradient(circle at 20% 0%, rgba(47, 124, 255, 0.35), transparent 34rem),
    radial-gradient(circle at 90% 18%, rgba(105, 183, 255, 0.2), transparent 28rem),
    linear-gradient(150deg, #050a14 0%, #0d1a2f 46%, #07101c 100%);
}

button,
input,
textarea {
  font: inherit;
}

button {
  border: 0;
  color: var(--text);
  cursor: pointer;
}

.app-shell {
  width: min(430px, 100%);
  min-height: 100dvh;
  margin: 0 auto;
  padding: calc(18px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 50% 0%, rgba(47, 124, 255, 0.26), transparent 22rem),
    rgba(8, 17, 31, 0.84);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 30px 90px rgba(0, 0, 0, 0.48);
}

.hero {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0;
  margin-bottom: 18px;
}

.eyebrow {
  margin: 0 0 8px;
  color: var(--blue-light);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 10px;
  font-size: clamp(34px, 6vw, 64px);
  line-height: 0.95;
}

h2 {
  margin-bottom: 0;
  font-size: clamp(24px, 8vw, 32px);
}

h3 {
  margin-bottom: 10px;
}

.hero-copy {
  max-width: 560px;
  margin-bottom: 0;
  color: var(--muted);
}

.profile-pill,
.cart-pill,
.live-tag {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  white-space: nowrap;
}

.avatar,
.big-avatar {
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #06101f;
  font-weight: 900;
  background: linear-gradient(135deg, var(--gold), #fff0a6);
}

.avatar {
  width: 34px;
  height: 34px;
}

.big-avatar {
  width: 96px;
  height: 96px;
  flex: 0 0 auto;
  font-size: 42px;
}

.page {
  display: none;
}

.page.active {
  display: block;
  animation: rise 0.35s ease both;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 4px 0 18px;
}

.primary,
.ghost-button,
.player-actions button {
  padding: 12px 18px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.1);
  transition: transform 0.2s ease, background 0.2s ease;
}

.primary {
  color: white;
  background: linear-gradient(135deg, var(--blue), #61b6ff);
  box-shadow: 0 14px 30px rgba(47, 124, 255, 0.3);
}

.primary.small {
  padding: 10px 14px;
  border-radius: 13px;
}

.wide {
  width: 100%;
}

.ghost-button {
  border: 1px solid rgba(255, 255, 255, 0.16);
}

button:hover {
  transform: translateY(-2px);
}

.record-store,
.ticket-grid,
.chat-room {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
}

.turntable-card,
.playlist-card,
.concert-card,
.lightstick-card,
.chat-list-panel,
.chat-panel,
.chat-side-card,
.notice,
.news-item,
.product-card,
.profile-card,
.orders-card,
.settings-card,
.profile-grid article,
.choir-card {
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 28px;
  background: var(--panel);
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
}

.turntable-card {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
  padding: 18px;
  min-height: auto;
}

.turntable {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 280px;
  border-radius: 26px;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02)),
    #101a2a;
  overflow: hidden;
}

.turntable::before {
  content: "";
  position: absolute;
  inset: 24px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 22px;
}

.vinyl {
  position: relative;
  width: min(74vw, 270px);
  height: min(74vw, 270px);
  border-radius: 50%;
  background:
    repeating-radial-gradient(circle, #111 0 4px, #1b2130 5px 7px),
    radial-gradient(circle, #222 0%, #090b0f 65%, #000 100%);
  box-shadow: inset 0 0 34px rgba(255, 255, 255, 0.08), 0 20px 40px rgba(0, 0, 0, 0.4);
}

.vinyl.playing {
  animation: spin 4s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.vinyl-label {
  position: absolute;
  inset: 36%;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #06101f;
  text-align: center;
  font-weight: 900;
  background: linear-gradient(135deg, #d9f0ff, var(--blue-light));
}

.vinyl-label small {
  display: block;
  font-size: 11px;
}

.tonearm {
  position: absolute;
  top: 56px;
  right: 44px;
  width: 120px;
  height: 16px;
  border-radius: 999px;
  background: linear-gradient(90deg, #d9e7ff, #6b7a90);
  transform: rotate(-26deg);
  transform-origin: 90% 50%;
  transition: transform 0.25s ease;
}

.tonearm::after {
  content: "";
  position: absolute;
  left: -12px;
  top: -9px;
  width: 28px;
  height: 34px;
  border-radius: 10px;
  background: #cbd7e8;
}

.tonearm.playing {
  transform: rotate(-12deg);
}

.player-info {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.player-info h3 {
  font-size: clamp(34px, 12vw, 48px);
  line-height: 1;
}

.player-info p,
.concert-card p,
.lightstick-card p,
.chat-side-card p,
.news-item p,
.product-card p,
.choir-card p,
.settings-card p {
  color: var(--muted);
}

.progress {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px;
  margin: 28px 0;
  color: var(--muted);
  font-size: 13px;
}

.bar {
  height: 8px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
}

.bar span {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--blue), var(--gold));
}

.player-actions {
  display: flex;
  flex-wrap: wrap;
  width: 100%;
  gap: 10px;
}

.player-actions button {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  padding: 0;
  border-radius: 50%;
}

.player-actions svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#playPause {
  position: relative;
}

#playPause .pause-icon,
#playPause.playing .play-icon {
  display: none;
}

#playPause.playing .pause-icon {
  display: block;
}

#favoriteTrack.active {
  color: #06101f;
  background: linear-gradient(135deg, var(--gold), #fff0a6);
}

#favoriteTrack {
  margin-left: auto;
}

#favoriteTrack.active svg {
  fill: currentColor;
}

.playlist-card {
  padding: 24px;
}

.playlist {
  display: grid;
  gap: 12px;
}

.track-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 14px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.07);
}

.track-row.active {
  outline: 1px solid rgba(105, 183, 255, 0.7);
  background: rgba(47, 124, 255, 0.18);
}

.track-row strong {
  display: block;
}

.track-row small {
  color: var(--muted);
}

.notice {
  padding: 18px 20px;
  margin-bottom: 18px;
  color: var(--muted);
}

.card-list,
.news-list {
  display: grid;
  gap: 16px;
}

.choir-card,
.news-item {
  padding: 22px;
}

.choir-card {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;
}

.distance {
  display: grid;
  place-items: center;
  min-width: 78px;
  height: 78px;
  border-radius: 22px;
  color: #07101c;
  font-weight: 900;
  background: linear-gradient(135deg, var(--green), #d2fff0);
}

.concert-card,
.lightstick-card,
.chat-list-panel,
.chat-panel,
.chat-side-card {
  padding: 26px;
}

.hidden {
  display: none !important;
}

.concert-card h3 {
  font-size: 34px;
}

.chat-list-panel {
  display: grid;
  gap: 18px;
}

.chat-room-list {
  display: grid;
  gap: 14px;
}

.chat-room-card {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;
  align-items: center;
  width: 100%;
  padding: 18px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 22px;
  text-align: left;
  background: rgba(255, 255, 255, 0.07);
}

.chat-room-card:hover {
  background: rgba(47, 124, 255, 0.2);
}

.chat-room-card h3 {
  margin-bottom: 8px;
}

.chat-room-meta,
.create-room-tip {
  margin-bottom: 0;
  color: var(--muted);
}

.room-count {
  display: grid;
  place-items: center;
  min-width: 84px;
  height: 76px;
  border-radius: 20px;
  color: #06101f;
  font-weight: 900;
  background: linear-gradient(135deg, var(--gold), #fff0a6);
}

.room-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.room-tags span {
  display: inline-flex;
  width: fit-content;
  padding: 7px 10px;
  border-radius: 999px;
  color: #dbeafe;
  background: rgba(47, 124, 255, 0.18);
  font-size: 13px;
}

.chat-detail {
  display: block;
}

.chat-create {
  display: block;
}

.chat-panel {
  display: grid;
  grid-template-rows: auto minmax(320px, 1fr) auto;
  gap: 18px;
}

.chat-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.chat-header h3 {
  margin-bottom: 0;
  font-size: 30px;
}

.chat-header span {
  padding: 8px 12px;
  border-radius: 999px;
  color: #06101f;
  font-weight: 900;
  background: linear-gradient(135deg, var(--green), #d2fff0);
  white-space: nowrap;
}

.chat-messages {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: 440px;
  overflow: auto;
  padding: 16px;
  border-radius: 22px;
  background: rgba(0, 0, 0, 0.2);
}

.chat-message {
  display: grid;
  gap: 5px;
  max-width: 78%;
  padding: 12px 14px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.09);
}

.chat-message.mine {
  align-self: flex-end;
  background: linear-gradient(135deg, rgba(47, 124, 255, 0.9), rgba(105, 183, 255, 0.72));
}

.chat-message strong {
  font-size: 13px;
}

.chat-message span {
  color: var(--muted);
  font-size: 12px;
}

.chat-message.mine span {
  color: rgba(255, 255, 255, 0.75);
}

.chat-message p {
  margin: 0;
}

.chat-input-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
}

.concert-meta {
  display: grid;
  gap: 10px;
  margin: 22px 0;
}

.concert-meta span,
.news-tag {
  display: inline-flex;
  width: fit-content;
  padding: 8px 12px;
  border-radius: 999px;
  color: #dbeafe;
  background: rgba(47, 124, 255, 0.18);
}

label {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
  color: var(--muted);
  font-size: 14px;
}

input,
textarea {
  width: 100%;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  padding: 13px 14px;
  color: var(--text);
  background: rgba(0, 0, 0, 0.22);
  outline: none;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.bind-result {
  min-height: 22px;
  margin: 12px 0 0;
  color: var(--green) !important;
}

.news-item {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 16px;
}

.news-date {
  width: 68px;
  height: 68px;
  display: grid;
  place-items: center;
  border-radius: 20px;
  color: #06101f;
  font-weight: 900;
  background: linear-gradient(135deg, #d9f0ff, var(--blue-light));
}

.product-grid,
.profile-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.profile-grid {
  grid-template-columns: repeat(3, 1fr);
}

.product-card {
  overflow: hidden;
}

.product-cover {
  display: grid;
  place-items: center;
  min-height: 126px;
  font-size: 44px;
  font-weight: 900;
  color: #07101c;
  background: linear-gradient(135deg, #e0f2ff, #66b8ff 45%, #ffd166);
}

.product-content {
  padding: 14px;
}

.price-row {

const $ = (selector) => document.querySelector(selector);
const $$ = (selector) => document.querySelectorAll(selector);

function formatTime(seconds) {
  const minute = Math.floor(seconds / 60);
  const second = String(seconds % 60).padStart(2, "0");
  return `${minute}:${second}`;
}

function toast(message) {
  const element = $("#toast");
  element.textContent = message;
  element.classList.add("show");
  window.clearTimeout(element.hideTimer);
  element.hideTimer = window.setTimeout(() => element.classList.remove("show"), 2200);
}

function switchPage(route) {
  $$(".page").forEach((page) => page.classList.toggle("active", page.id === route));
  $$(".tabbar button").forEach((button) => button.classList.toggle("active", button.dataset.route === route));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderPlaylist() {
  const list = state.favoriteOnly
    ? tracks.filter((track) => state.favorites.includes(track.title))
    : tracks;

  $("#playlist").innerHTML = list.length
    ? list
        .map((track) => {
          const index = tracks.findIndex((item) => item.title === track.title);
          const isActive = index === state.currentTrack;
          const isFavorite = state.favorites.includes(track.title);
          return `
            <button class="track-row ${isActive ? "active" : ""}" data-track="${index}">
              <span>
                <strong>${track.title} ${isFavorite ? "★" : ""}</strong>
                <small>${track.album} · ${track.year}</small>
              </span>
              <small>${formatTime(track.duration)}</small>
            </button>
          `;
        })
        .join("")
    : `<div class="notice">你还没有收藏歌曲，先回到全部歌单收藏几首吧。</div>`;

  $$(".track-row").forEach((button) => {
    button.addEventListener("click", () => {
      state.currentTrack = Number(button.dataset.track);
      state.elapsed = 0;
      state.playing = true;
      updatePlayer();
      startTimer();
    });
  });
}

function updatePlayer() {
  const track = tracks[state.currentTrack];
  $("#trackTitle").textContent = track.title;
  $("#trackAlbum").textContent = track.album;
  $("#trackYear").textContent = track.year;
  $("#elapsed").textContent = formatTime(state.elapsed);
  $("#progressBar").style.width = `${Math.min((state.elapsed / track.duration) * 100, 100)}%`;
  $("#playPause").classList.toggle("playing", state.playing);
  $("#playPause").setAttribute("aria-label", state.playing ? "暂停" : "播放");
  $("#playPause").setAttribute("title", state.playing ? "暂停" : "播放");
  $("#vinyl").classList.toggle("playing", state.playing);
  $("#tonearm").classList.toggle("playing", state.playing);
  $("#favoriteTrack").classList.toggle("active", state.favorites.includes(track.title));
  $("#favoriteTrack").setAttribute("aria-label", state.favorites.includes(track.title) ? "已收藏" : "收藏");
  $("#favoriteTrack").setAttribute("title", state.favorites.includes(track.title) ? "已收藏" : "收藏");
  $("#favoriteCount").textContent = state.favorites.length;
  renderPlaylist();
}

function startTimer() {
  window.clearInterval(state.timer);
  if (!state.playing) return;

  state.timer = window.setInterval(() => {
    const track = tracks[state.currentTrack];
    state.elapsed += 1;
    if (state.elapsed >= track.duration) {
      nextTrack(true);
      return;
    }
    updatePlayer();
  }, 1000);
}

function nextTrack(random = true) {
  if (random) {
    let next = state.currentTrack;
    while (next === state.currentTrack && tracks.length > 1) {
      next = Math.floor(Math.random() * tracks.length);
    }
    state.currentTrack = next;
  } else {
    state.currentTrack = (state.currentTrack + 1) % tracks.length;
  }
  state.elapsed = 0;
  state.playing = true;
  updatePlayer();
  startTimer();
}

function previousTrack() {
  state.currentTrack = (state.currentTrack - 1 + tracks.length) % tracks.length;
  state.elapsed = 0;
  state.playing = true;
  updatePlayer();
  startTimer();
}

function saveFavorites() {
  localStorage.setItem("maydayFavorites", JSON.stringify(state.favorites));
  updatePlayer();
}

function distanceKm(a, b) {
  const earthRadius = 6371;
  const dLat = ((b.lat - a.lat) * Math.PI) / 180;
  const dLng = ((b.lng - a.lng) * Math.PI) / 180;
  const lat1 = (a.lat * Math.PI) / 180;
  const lat2 = (b.lat * Math.PI) / 180;
  const h =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  return 2 * earthRadius * Math.asin(Math.sqrt(h));
}

function renderChoirs(position = { lat: 31.2304, lng: 121.4737 }, label = "默认以上海人民广场为示例位置排序。") {
  const sorted = choirs
    .map((choir) => ({ ...choir, distance: distanceKm(position, choir) }))
    .sort((a, b) => a.distance - b.distance);

  $("#locationNotice").textContent = label;
  $("#choirList").innerHTML = sorted
    .map(
      (choir) => `
        <article class="choir-card">
          <div>
            <p class="eyebrow">${choir.name}</p>
            <h3>${choir.time}</h3>
            <p>${choir.address}</p>
          </div>
          <div class="distance">${choir.distance.toFixed(1)}km</div>
        </article>
      `
    )
    .join("");
}

function locateChoirs() {
  if (!navigator.geolocation) {
    renderChoirs(undefined, "当前浏览器不支持定位，已使用示例位置推荐附近练歌团。");
    return;
  }

  $("#locationNotice").textContent = "正在获取位置授权，请在浏览器弹窗中允许定位。";
  navigator.geolocation.getCurrentPosition(
    (position) => {
      renderChoirs(
        { lat: position.coords.latitude, lng: position.coords.longitude },
        "已根据你的当前位置排序，距离为直线估算。"
      );
    },
    () => {
      renderChoirs(undefined, "未获得定位授权，已使用示例位置推荐附近练歌团。");
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
}

function renderNews() {
  $("#newsList").innerHTML = news
    .map(
      (item) => `
        <article class="news-item">
          <div class="news-date">${item.date}</div>
          <div>
            <span class="news-tag">${item.tag}</span>
            <h3>${item.title}</h3>
            <p>${item.content}</p>
          </div>
        </article>
      `
    )
    .join("");
}

function renderProducts() {
  $("#cartCount").textContent = state.cartCount;
  $("#productGrid").innerHTML = products
    .map(
      (product, index) => `
        <article class="product-card">
          <div class="product-cover">${product.mark}</div>
          <div class="product-content">
            <h3>${product.name}</h3>
            <p>${product.desc}</p>
            <div class="price-row">
              <strong>¥${product.price}</strong>
              <button class="primary small" data-product="${index}">加入购物车</button>
            </div>
          </div>
        </article>
      `
    )
    .join("");

  $$("[data-product]").forEach((button) => {
    button.addEventListener("click", () => {
      const product = products[Number(button.dataset.product)];
      state.cartCount += 1;
      localStorage.setItem("maydayCartCount", String(state.cartCount));
      $("#cartCount").textContent = state.cartCount;
      toast(`${product.name} 已加入购物车`);
    });
  });
}

function saveChatRooms() {
  localStorage.setItem("maydayChatVersion", chatDataVersion);
  localStorage.setItem("maydayChatRooms", JSON.stringify(state.chatRooms));
}

function getActiveRoom() {
  return state.chatRooms.find((room) => room.id === state.activeChatRoomId);
}

function renderChatRooms() {
  $("#roomTotal").textContent = `${state.chatRooms.length} 个聊天室`;
  $("#chatRoomList").innerHTML = state.chatRooms
    .map(
      (room) => `
        <button class="chat-room-card" data-room="${room.id}">
          <div>
            <p class="eyebrow">${room.topic}</p>
            <h3>${room.name}</h3>
            <p class="chat-room-meta">${room.location} · ${room.messages.length} 条消息</p>
            <div class="room-tags">
              <span>${room.location}</span>
              <span>${room.people} 人在线</span>
            </div>
          </div>
          <div class="room-count">${room.people}人</div>
        </button>
      `
    )
    .join("");

  $$("[data-room]").forEach((button) => {
    button.addEventListener("click", () => enterChatRoom(button.dataset.room));
  });
}

function renderChat() {
  const room = getActiveRoom();
  if (!room) return;

  $("#activeRoomLocation").textContent = room.location;
  $("#activeRoomName").textContent = room.name;
  $("#activeRoomMeta").textContent = `${room.people} 人在线 · ${room.topic}`;

  const messages = $("#chatMessages");
  messages.innerHTML = room.messages
    .map(
      (message) => `
        <div class="chat-message ${message.mine ? "mine" : ""}">
          <strong>${message.user}</strong>
          <p>${message.text}</p>
          <span>${message.time}</span>
        </div>
      `
    )
    .join("");
  messages.scrollTop = messages.scrollHeight;
  $("#chatCount").textContent = state.chatCount;
}

function enterChatRoom(roomId) {
  state.activeChatRoomId = roomId;
  $("#chatListView").classList.add("hidden");
  $("#chatCreateView").classList.add("hidden");
  $("#chatDetailView").classList.remove("hidden");
  renderChat();
}

function backToChatRooms() {
  state.activeChatRoomId = null;
  $("#chatDetailView").classList.add("hidden");
  $("#chatCreateView").classList.add("hidden");
  $("#chatListView").classList.remove("hidden");
  renderChatRooms();
}

function enterCreateRoomPage() {
  state.activeChatRoomId = null;
  $("#chatListView").classList.add("hidden");
  $("#chatDetailView").classList.add("hidden");
  $("#chatCreateView").classList.remove("hidden");
  window.setTimeout(() => $("#roomNameInput").focus(), 100);
}

function createChatRoom() {
  const name = $("#roomNameInput").value.trim();
  const location = $("#roomLocationInput").value.trim();
  if (!name || !location) {
    toast("请填写聊天室名字和位置。");
    return;
  }

  const room = {
    id: `room-${Date.now()}`,
    name,
    location,
    people: Math.floor(Math.random() * 60) + 12,
    topic: "新聊天室",
    messages: [
      {
        user: "系统消息",
        text: `欢迎来到「${name}」，和五迷老师们开始聊天吧。`,
        time: "刚刚"
      }
    ]
  };
  state.chatRooms.unshift(room);
  saveChatRooms();
  $("#roomNameInput").value = "";
  $("#roomLocationInput").value = "";
  backToChatRooms();
  toast("聊天室已创建。");
}

function sendChatMessage() {
  const input = $("#chatInput");
  const text = input.value.trim();
  const room = getActiveRoom();
  if (!room) {
    toast("请先进入一个聊天室。");
    return;
  }
  if (!text) {
    toast("先输入聊天内容再发送。");
    return;
  }

  const now = new Date();
  const time = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
  room.messages.push({
    user: "我",
    text,
    time,
    mine: true
  });
  state.chatCount += 1;
  saveChatRooms();
  localStorage.setItem("maydayChatCount", String(state.chatCount));
  input.value = "";
  renderChat();
}

function loadProfile() {
  const profile = JSON.parse(localStorage.getItem("maydayProfile") || "{}");
  if (profile.name) $("#fanName").textContent = profile.name;
  if (profile.bio) $("#fanBio").textContent = profile.bio;
  $("#favoriteCount").textContent = state.favorites.length;
  $("#chatCount").textContent = state.chatCount;
}

function bindEvents() {
  $$("[data-route]").forEach((button) => {
    button.addEventListener("click", () => switchPage(button.dataset.route));
  });

  $("#playPause").addEventListener("click", () => {
    state.playing = !state.playing;
    updatePlayer();
    startTimer();
  });

  $("#nextTrack").addEventListener("click", () => nextTrack(false));
  $("#prevTrack").addEventListener("click", previousTrack);

  $("#favoriteTrack").addEventListener("click", () => {
    const title = tracks[state.currentTrack].title;
    if (state.favorites.includes(title)) {
      state.favorites = state.favorites.filter((item) => item !== title);
      toast(`已取消收藏《${title}》`);
    } else {
      state.favorites.push(title);
      toast(`已收藏《${title}》`);
    }
    saveFavorites();
  });

  $("#toggleFavoriteOnly").addEventListener("click", () => {
    state.favoriteOnly = !state.favoriteOnly;
    $("#toggleFavoriteOnly").textContent = state.favoriteOnly ? "全部歌单" : "收藏歌单";
    renderPlaylist();
  });

  $("#locateButton").addEventListener("click", locateChoirs);

  $("#createRoom").addEventListener("click", createChatRoom);
  $("#jumpToCreateRoom").addEventListener("click", enterCreateRoomPage);
  $("#backFromCreate").addEventListener("click", backToChatRooms);
  $("#backToRooms").addEventListener("click", backToChatRooms);
  $("#sendMessage").addEventListener("click", sendChatMessage);
  $("#chatInput").addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      sendChatMessage();
    }
  });

  $("#refreshNews").addEventListener("click", () => {
    renderNews();
    toast("小道消息已刷新。正式版可接入行程、活动和票务信息源。");
  });

  $$("[data-order-status]").forEach((button) => {
    button.addEventListener("click", () => {
      toast(`已进入${button.dataset.orderStatus}订单。`);
    });
  });
}

function init() {
  bindEvents();
  renderChoirs();
  renderNews();
  renderProducts();
  renderChatRooms();
  loadProfile();
  updatePlayer();
}

init();


</script>
  </body>
</html>
