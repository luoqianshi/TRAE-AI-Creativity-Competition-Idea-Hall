<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对话分析结果管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        
        .search-panel {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }
        
        .search-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }
        
        .search-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .search-item label {
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }
        
        .search-item select,
        .search-item input {
            padding: 10px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            min-width: 150px;
            transition: border-color 0.2s;
        }
        
        .search-item select:focus,
        .search-item input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-reset {
            background: #f5f7fa;
            color: #666;
        }
        
        .btn-reset:hover {
            background: #e8eaed;
        }
        
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
            font-size: 13px;
        }
        
        tr:hover {
            background: #fafafa;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .badge-yes {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-no {
            background: #f8d7da;
            color: #721c24;
        }
        
        .badge-separated {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .badge-not-separated {
            background: #fff3cd;
            color: #856404;
        }
        
        .btn-detail {
            padding: 6px 14px;
            background: #667eea;
            color: white;
            border-radius: 6px;
            font-size: 12px;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-detail:hover {
            background: #5a6fd6;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 8px;
        }
        
        .pagination button {
            padding: 8px 16px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .pagination button:hover:not(:disabled) {
            background: #f5f7fa;
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pagination span {
            padding: 8px 16px;
            color: #666;
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal {
            width: 75%;
            max-height: 85vh;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: #f5f7fa;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-close:hover {
            background: #e8eaed;
        }
        
        .modal-tabs {
            display: flex;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .tab {
            padding: 14px 24px;
            border: none;
            background: none;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            position: relative;
        }
        
        .tab.active {
            color: #667eea;
        }
        
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 24px;
            right: 24px;
            height: 2px;
            background: #667eea;
        }
        
        .modal-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        
        .tab-panel {
            display: none;
        }
        
        .tab-panel.active {
            display: block;
        }
        
        .card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
            border-left: 4px solid #667eea;
        }
        
        .card-business {
            border-left-color: #28a745;
            background: linear-gradient(135deg, #f0f9f0 0%, #f8f9fa 100%);
        }
        
        .card-downshift {
            border-left-color: #ffc107;
            background: linear-gradient(135deg, #fff9e6 0%, #f8f9fa 100%);
        }
        
        .card-negative {
            border-left-color: #dc3545;
            background: linear-gradient(135deg, #fff0f0 0%, #f8f9fa 100%);
        }
        
        .card-positive {
            border-left-color: #17a2b8;
            background: linear-gradient(135deg, #e6f7f9 0%, #f8f9fa 100%);
        }
        
        .card-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
            font-size: 15px;
        }
        
        .card-business .card-title { color: #28a745; }
        .card-downshift .card-title { color: #ffc107; }
        .card-negative .card-title { color: #dc3545; }
        .card-positive .card-title { color: #17a2b8; }
        
        .card-content {
            font-size: 14px;
            line-height: 2.2;
        }
        
        .card-content p {
            margin-bottom: 12px;
        }
        
        .card-content .label {
            color: #555;
            margin-right: 8px;
            font-weight: 600;
            display: inline-block;
            min-width: 80px;
        }
        
        .card-content .value {
            color: #333;
        }
        
        .card-content .segment-label {
            font-weight: 600;
            color: #555;
            margin: 16px 0 8px 0;
            font-size: 13px;
        }
        
        .card-empty {
            color: #999;
            font-style: italic;
            padding: 12px;
            text-align: center;
        }
        
        .collapse-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        
        .collapse-header {
            padding: 14px 16px;
            background: #f8f9fa;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }
        
        .collapse-header:hover {
            background: #f0f0f0;
        }
        
        .collapse-header::after {
            content: '▼';
            font-size: 10px;
            color: #999;
            transition: transform 0.2s;
        }
        
        .collapse-header.collapsed::after {
            transform: rotate(-90deg);
        }
        
        .collapse-body {
            padding: 16px;
            display: none;
        }
        
        .collapse-body.show {
            display: block;
        }
        
        .dialogue-item {
            padding: 12px;
            background: #fff;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #e8eaed;
        }
        
        .dialogue-item .dialogue-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        
        .dialogue-item .dialogue-time {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }
        
        .dialogue-item .dialogue-content {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }
        
        .tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            margin-left: 8px;
        }
        
        .tag-content {
            background: #d4edda;
            color: #155724;
        }
        
        .tag-opening {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .tag-closing {
            background: #fff3cd;
            color: #856404;
        }
        
        .tag-noise {
            background: #f8d7da;
            color: #721c24;
        }
        
        .no-content {
            text-align: center;
            padding: 40px;
            color: #999;
            font-style: italic;
        }
        
        .segment-text {
            background: #fff3cd;
            padding: 6px 10px;
            border-radius: 4px;
            margin: 4px 0;
            font-size: 13px;
        }
        
        .highlight {
            color: red;
        }
        
        .info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 16px;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .info-item label {
            font-size: 12px;
            color: #999;
        }
        
        .info-item span {
            font-size: 14px;
            font-weight: 500;
        }
        
        .audio-item {
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .audio-content {
            flex: 1;
            font-size: 14px;
            color: #333;
        }
        
        .audio-time {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>对话分析结果管理</h1>
        </div>
        
        <div class="search-panel">
            <div class="search-row">
                <div class="search-item">
                    <label>对话分离</label>
                    <select id="dialogue_id">
                        <option value="">全部</option>
                        <option value="0">未分离(0)</option>
                        <option value="1">已分离(非0)</option>
                    </select>
                </div>
                <div class="search-item">
                    <label>是否降档</label>
                    <select id="downshift">
                        <option value="">全部</option>
                        <option value="0">否</option>
                        <option value="1">是</option>
                    </select>
                </div>
                <div class="search-item">
                    <label>是否负向</label>
                    <select id="negative">
                        <option value="">全部</option>
                        <option value="0">否</option>
                        <option value="1">是</option>
                    </select>
                </div>
                <div class="search-item">
                    <label>是否正向</label>
                    <select id="positive">
                        <option value="">全部</option>
                        <option value="0">否</option>
                        <option value="1">是</option>
                    </select>
                </div>
                <div class="search-item">
                    <label>主分类</label>
                    <input type="text" id="main_type" placeholder="模糊查询">
                </div>
                <div class="search-item">
                    <label>细分类</label>
                    <input type="text" id="sub_type" placeholder="模糊查询">
                </div>
                <div class="search-item">
                    <label>录音ID</label>
                    <input type="text" id="request_id" placeholder="模糊查询">
                </div>
                <div style="flex-direction: row; gap: 8px; margin-top: 22px;">
                    <button class="btn btn-primary" onclick="searchData()">查询</button>
                    <button class="btn btn-reset" onclick="resetSearch()">重置</button>
                </div>
            </div>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>录音ID</th>
                        <th>对话ID</th>
                        <th>主分类</th>
                        <th>细分类</th>
                        <th>降档</th>
                        <th>负向</th>
                        <th>正向</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
            
            <div class="pagination" id="pagination">
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">详情</h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-tabs">
                <button class="tab active" onclick="switchTab('tab1')">对话内容</button>
                <button class="tab" onclick="switchTab('tab2')">标注转写内容</button>
                <button class="tab" onclick="switchTab('tab3')">音频转写内容</button>
            </div>
            <div class="modal-content">
                <div class="tab-panel active" id="tab1">
                    <div id="dialogueContent">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
                <div class="tab-panel" id="tab2">
                    <div id="annotationContent">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
                <div class="tab-panel" id="tab3">
                    <div id="audioContent">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/dialogue';
        let currentPage = 1;
        let currentDetail = null;
        
        function formatTime(ms) {
            if (!ms) return '';
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            const millis = ms % 1000;
            return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${millis.toString().padStart(3, '0')}`;
        }
        
        function searchData() {
            currentPage = 1;
            loadData();
        }
        
        function resetSearch() {
            document.getElementById('dialogue_id').value = '';
            document.getElementById('downshift').value = '';
            document.getElementById('negative').value = '';
            document.getElementById('positive').value = '';
            document.getElementById('main_type').value = '';
            document.getElementById('sub_type').value = '';
            document.getElementById('request_id').value = '';
            currentPage = 1;
            loadData();
        }
        
        async function loadData() {
            const params = new URLSearchParams();
            params.set('page', currentPage);
            params.set('page_size', 20);
            
            const dialogue_id = document.getElementById('dialogue_id').value;
            const downshift = document.getElementById('downshift').value;
            const negative = document.getElementById('negative').value;
            const positive = document.getElementById('positive').value;
            const main_type = document.getElementById('main_type').value;
            const sub_type = document.getElementById('sub_type').value;
            const request_id = document.getElementById('request_id').value;
            
            if (dialogue_id) params.set('dialogue_id', dialogue_id);
            if (downshift) params.set('downshift', downshift);
            if (negative) params.set('negative', negative);
            if (positive) params.set('positive', positive);
            if (main_type) params.set('main_type', main_type);
            if (sub_type) params.set('sub_type', sub_type);
            if (request_id) params.set('request_id', request_id);
            
            try {
                const response = await fetch(`${API_BASE}/list?${params}`);
                const result = await response.json();
                
                if (result.code === 200) {
                    renderTable(result.data);
                    renderPagination(result.total, result.page, result.page_size);
                } else {
                    alert(result.msg);
                }
            } catch (error) {
                console.error('加载数据失败:', error);
                alert('加载数据失败');
            }
        }
        
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="no-content">暂无数据</td></tr>';
                return;
            }
            
            tbody.innerHTML = data.map(item => `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.request_id || '-'}</td>
                    <td>
                        ${item.dialogue_id === 0 ? '<span style="color: #999; font-style: italic;">无有效对话</span>' : item.dialogue_id}
                    </td>
                    <td>${item.main_type || '-'}</td>
                    <td>${item.sub_type || '-'}</td>
                    <td><span class="badge ${item.downshift ? 'badge-yes' : 'badge-no'}">${item.downshift ? '是' : '否'}</span></td>
                    <td><span class="badge ${item.negative ? 'badge-yes' : 'badge-no'}">${item.negative ? '是' : '否'}</span></td>
                    <td><span class="badge ${item.positive ? 'badge-yes' : 'badge-no'}">${item.positive ? '是' : '否'}</span></td>
                    <td><button class="btn-detail" onclick="showDetail(${item.id})">详情</button></td>
                </tr>
            `).join('');
        }
        
        function renderPagination(total, page, pageSize) {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(total / pageSize);
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            
            let html = `
                <button onclick="goToPage(1)" ${page === 1 ? 'disabled' : ''}>首页</button>
                <button onclick="goToPage(${page - 1})" ${page === 1 ? 'disabled' : ''}>上一页</button>
                <span>第 ${page} / ${totalPages} 页</span>
                <button onclick="goToPage(${page + 1})" ${page === totalPages ? 'disabled' : ''}>下一页</button>
                <button onclick="goToPage(${totalPages})" ${page === totalPages ? 'disabled' : ''}>尾页</button>
            `;
            
            pagination.innerHTML = html;
        }
        
        function goToPage(page) {
            currentPage = page;
            loadData();
        }
        
        async function showDetail(id) {
            try {
                const response = await fetch(`${API_BASE}/detail/${id}`);
                const result = await response.json();
                
                if (result.code === 200) {
                    currentDetail = result.data;
                    document.getElementById('modalTitle').textContent = `详情 - ID: ${id}`;
                    document.getElementById('modalOverlay').classList.add('show');
                    
                    switchTab('tab1');
                } else {
                    alert(result.msg);
                }
            } catch (error) {
                console.error('获取详情失败:', error);
                alert('获取详情失败');
            }
        }
        
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
            currentDetail = null;
        }
        
        async function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            
            document.querySelector(`.tab:nth-child(${tabId === 'tab1' ? 1 : tabId === 'tab2' ? 2 : 3})`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
            
            if (!currentDetail) return;
            
            if (tabId === 'tab1') {
                await loadDialogueContent();
            } else if (tabId === 'tab2') {
                await loadAnnotationContent();
            } else if (tabId === 'tab3') {
                await loadAudioContent();
            }
        }
        
        async function loadDialogueContent() {
            const container = document.getElementById('dialogueContent');
            container.innerHTML = '<div class="loading">加载中...</div>';
            
            if (!currentDetail || !currentDetail.object_name || currentDetail.dialogue_id === 0) {
                container.innerHTML = '<div class="no-content">无相关内容</div>';
                return;
            }
            
            try {
                const params = new URLSearchParams({
                    bucket_name: currentDetail.bucket_name,
                    object_name: currentDetail.object_name,
                    dialogue_id: currentDetail.dialogue_id
                });
                
                const response = await fetch(`${API_BASE}/dialogue_content?${params}`);
                const result = await response.json();
                
                if (result.code === 200 && result.data) {
                    renderDialogueContent(result.data);
                } else {
                    container.innerHTML = `<div class="no-content">${result.message || '无相关内容'}</div>`;
                }
            } catch (error) {
                console.error('加载对话内容失败:', error);
                container.innerHTML = '<div class="no-content">加载失败</div>';
            }
        }
        
        function renderDialogueContent(data) {
            const container = document.getElementById('dialogueContent');
            
            let html = `
                <div class="info-row">
                    <div class="info-item">
                        <label>对话ID</label>
                        <span>${data.dialogue_id}</span>
                    </div>
                    <div class="info-item">
                        <label>开始时间</label>
                        <span>${formatTime(data.start_ms)}</span>
                    </div>
                    <div class="info-item">
                        <label>结束时间</label>
                        <span>${formatTime(data.end_ms)}</span>
                    </div>
                </div>
                <div class="info-row" style="flex-direction: column; gap: 12px;">
                    <div class="info-item">
                        <label>开场白</label>
                        <span>${data.opening_matched || '-'}</span>
                    </div>
                    <div class="info-item">
                        <label>结束语</label>
                        <span>${data.closing_matched || '-'}</span>
                    </div>
                </div>
            `;
            
            if (data.simplified_text) {
                html += `
                    <div class="collapse-card">
                        <div class="collapse-header" onclick="toggleCollapse(this)">完整对话内容</div>
                        <div class="collapse-body">
                            <div class="dialogue-item">
                                <div class="dialogue-title">对话内容</div>
                                <div class="dialogue-content">${data.simplified_text}</div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            if (data.sentences && data.sentences.length > 0) {
                html += `
                    <div class="collapse-card">
                        <div class="collapse-header" onclick="toggleCollapse(this)">对话片段</div>
                        <div class="collapse-body">
                `;
                
                data.sentences.forEach((sentence, index) => {
                    const tagClass = getTagClass(sentence.label);
                    html += `
                        <div class="dialogue-item">
                            <div class="dialogue-title">
                                对话 ${index + 1}
                                <span class="tag ${tagClass}">${sentence.label}</span>
                            </div>
                            <div class="dialogue-time">${formatTime(sentence.start)} - ${formatTime(sentence.end)}</div>
                            <div class="dialogue-content">${sentence.text_zh}</div>
                        </div>
                    `;
                });
                
                html += '</div></div>';
            }
            
            const analysis = data.analysis || {};
            
            if (analysis.business) {
                html += renderAnalysisSection('业务信息', 'business', analysis.business, data.sentences);
            } else {
                html += `
                    <div class="card card-business">
                        <div class="card-title">业务信息</div>
                        <div class="card-content card-empty">无相关内容</div>
                    </div>
                `;
            }
            
            if (analysis.downshift) {
                html += renderAnalysisSection('降档信息', 'downshift', analysis.downshift, data.sentences);
            } else {
                html += `
                    <div class="card card-downshift">
                        <div class="card-title">降档信息</div>
                        <div class="card-content card-empty">无相关内容</div>
                    </div>
                `;
            }
            
            if (analysis.negative) {
                html += renderAnalysisSection('负向信息', 'negative', analysis.negative, data.sentences);
            } else {
                html += `
                    <div class="card card-negative">
                        <div class="card-title">负向信息</div>
                        <div class="card-content card-empty">无相关内容</div>
                    </div>
                `;
            }
            
            if (analysis.positive) {
                html += renderAnalysisSection('正向信息', 'positive', analysis.positive, data.sentences);
            } else {
                html += `
                    <div class="card card-positive">
                        <div class="card-title">正向信息</div>
                        <div class="card-content card-empty">无相关内容</div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }
        
        function renderAnalysisSection(title, cardClass, data, sentences) {
            let html = `
                <div class="card card-${cardClass}">
                    <div class="card-title">${title}</div>
                    <div class="card-content">
            `;
            
            const fields = [
                { key: 'type', label: '类型' },
                { key: 'reason', label: '理由' },
                { key: 'summary', label: '总结' },
                { key: 'stay_summary', label: '挽留内容' },
                { key: 'customer_number', label: '手机号' },
                { key: 'status', label: '状态' },
                { key: 'score', label: '评分' }
            ];
            
            fields.forEach(field => {
                if (data[field.key] !== undefined && data[field.key] !== null) {
                    let value = data[field.key];
                    if (field.key === 'summary') {
                        value = value.replace(/<span style="color: red;">([^<]+)<\/span>/g, '<span class="highlight">$1</span>');
                    }
                    html += `<p><span class="label">${field.label}:</span><span class="value">${value}</span></p>`;
                }
            });
            
            const segmentFields = [
                { key: 'segment_indexs', label: '相关对话' },
                { key: 'reason_segment_indexs', label: '降档理由对话' },
                { key: 'stay_segment_indexs', label: '挽留对话' }
            ];
            
            segmentFields.forEach(field => {
                if (data[field.key] && data[field.key].length > 0) {
                    html += `<p class="segment-label">${field.label}:</p>`;
                    data[field.key].forEach(index => {
                        if (sentences && sentences[index]) {
                            html += `<div class="segment-text">${sentences[index].text_zh}</div>`;
                        }
                    });
                }
            });
            
            html += '</div></div>';
            return html;
        }
        
        function getTagClass(label) {
            const labelLower = (label || '').toLowerCase();
            if (labelLower === 'content') return 'tag-content';
            if (labelLower === 'opening') return 'tag-opening';
            if (labelLower === 'closing') return 'tag-closing';
            if (labelLower === 'noise') return 'tag-noise';
            return 'tag-content';
        }
        
        async function loadAnnotationContent() {
            const container = document.getElementById('annotationContent');
            container.innerHTML = '<div class="loading">加载中...</div>';
            
            if (!currentDetail || !currentDetail.object_name) {
                container.innerHTML = '<div class="no-content">无相关内容</div>';
                return;
            }
            
            try {
                const params = new URLSearchParams({
                    bucket_name: currentDetail.bucket_name,
                    object_name: currentDetail.object_name
                });
                
                const response = await fetch(`${API_BASE}/annotation_transcript?${params}`);
                const result = await response.json();
                
                if (result.code === 200 && result.data && result.data.length > 0) {
                    renderAnnotationContent(result.data);
                } else {
                    container.innerHTML = '<div class="no-content">无相关内容</div>';
                }
            } catch (error) {
                console.error('加载标注转写内容失败:', error);
                container.innerHTML = '<div class="no-content">加载失败</div>';
            }
        }
        
        function renderAnnotationContent(data) {
            const container = document.getElementById('annotationContent');
            
            let html = '';
            
            data.forEach((item, index) => {
                const tagClass = getTagClass(item.label);
                html += `
                    <div class="dialogue-item">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                            <div class="dialogue-time">${formatTime(item.start)} - ${formatTime(item.end)}</div>
                            <span class="tag ${tagClass}">${item.label}</span>
                        </div>
                        <div class="dialogue-content">${item.text_zh}</div>
                `;
                
                if (item.sentence && item.sentence !== item.text_zh) {
                    html += `<div style="font-size: 12px; color: #999; margin-top: 4px;">原始: ${item.sentence}</div>`;
                }
                
                html += '</div>';
            });
            
            container.innerHTML = html;
        }
        
        async function loadAudioContent() {
            const container = document.getElementById('audioContent');
            container.innerHTML = '<div class="loading">加载中...</div>';
            
            if (!currentDetail || !currentDetail.object_name) {
                container.innerHTML = '<div class="no-content">无相关内容</div>';
                return;
            }
            
            try {
                const params = new URLSearchParams({
                    bucket_name: currentDetail.bucket_name,
                    object_name: currentDetail.object_name
                });
                
                const response = await fetch(`${API_BASE}/audio_transcript?${params}`);
                const result = await response.json();
                
                if (result.code === 200 && result.data && result.data.length > 0) {
                    renderAudioContent(result.data);
                } else {
                    container.innerHTML = '<div class="no-content">无相关内容</div>';
                }
            } catch (error) {
                console.error('加载音频转写内容失败:', error);
                container.innerHTML = '<div class="no-content">加载失败</div>';
            }
        }
        
        function renderAudioContent(data) {
            const container = document.getElementById('audioContent');
            
            let html = '';
            
            data.forEach((item, index) => {
                html += `
                    <div class="audio-item">
                        <div>
                            <div class="audio-content">${item.sentence}</div>
                            <div class="audio-time">${formatTime(item.start)} - ${formatTime(item.end)}</div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function toggleCollapse(el) {
            el.classList.toggle('collapsed');
            const body = el.nextElementSibling;
            body.classList.toggle('show');
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            
            document.getElementById('modalOverlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('modalOverlay')) {
                    closeModal();
                }
            });
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        });
    </script>
</body>
