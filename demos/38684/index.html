<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数研通 · 考研数学智能刷题平台</title>
<style>
  :root{
    --bg:#f4f6fb;
    --panel:#ffffff;
    --text:#1a1f35;
    --muted:#6b7292;
    --accent:#2255cc;
    --accent-soft:#e8eefc;
    --line:#e2e6f0;
    --ok:#1a9e70;
    --ok-soft:#e3f5ec;
    --warn:#c97a1a;
    --warn-soft:#fbf0de;
    --danger:#cc3333;
    --danger-soft:#fbe4e4;
    --shadow:0 2px 8px rgba(26,31,53,0.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
  input{font-family:inherit;font-size:inherit;color:inherit;}
  a{color:var(--accent);text-decoration:none;}
  .hidden{display:none!important;}

  /* ========== 登录页 ========== */
  .auth-wrap{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    background:
      radial-gradient(circle at 20% 20%, #e8eefc 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, #dde7fb 0%, transparent 50%),
      var(--bg);
  }
  .auth-card{
    width:100%;max-width:420px;
    background:var(--panel);
    border-radius:16px;
    padding:40px 36px;
    box-shadow:0 8px 32px rgba(34,85,204,0.08);
  }
  .auth-logo{
    display:flex;flex-direction:column;align-items:center;margin-bottom:24px;
  }
  .auth-logo-mark{
    width:56px;height:56px;border-radius:14px;
    background:linear-gradient(135deg,#2255cc,#4a79e6);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:22px;
    box-shadow:0 6px 16px rgba(34,85,204,0.3);
    margin-bottom:12px;
  }
  .auth-title{font-size:22px;font-weight:700;margin-bottom:4px;}
  .auth-sub{color:var(--muted);font-size:13px;}
  .auth-tabs{
    display:flex;background:var(--bg);border-radius:10px;padding:4px;margin:20px 0;
  }
  .auth-tab{
    flex:1;padding:8px 0;text-align:center;border-radius:7px;
    font-weight:500;color:var(--muted);transition:all .2s;
  }
  .auth-tab.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .field input{
    width:100%;padding:11px 14px;
    border:1px solid var(--line);
    border-radius:8px;background:var(--bg);
    outline:none;transition:all .2s;
  }
  .field input:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 20px;border-radius:8px;font-weight:600;
    transition:all .2s;white-space:nowrap;
  }
  .btn-primary{background:var(--accent);color:#fff;width:100%;margin-top:8px;}
  .btn-primary:hover{background:#1a44aa;}
  .btn-primary:disabled{background:#a5b4d0;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--line);width:100%;margin-top:10px;}
  .btn-ghost:hover{border-color:var(--accent);background:var(--accent-soft);}
  .auth-msg{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:13px;}
  .auth-msg.error{background:var(--danger-soft);color:var(--danger);}
  .auth-msg.success{background:var(--ok-soft);color:var(--ok);}
  .auth-msg.info{background:var(--accent-soft);color:var(--accent);}
  .divider{
    text-align:center;margin:16px 0 4px;position:relative;font-size:12px;color:var(--muted);
  }
  .divider::before,.divider::after{
    content:"";position:absolute;top:50%;width:42%;height:1px;background:var(--line);
  }
  .divider::before{left:0;}
  .divider::after{right:0;}

  /* ========== 主应用 ========== */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:240px;flex-shrink:0;background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .side-logo{
    padding:20px 24px;display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--line);
  }
  .side-logo-mark{
    width:36px;height:36px;border-radius:10px;
    background:linear-gradient(135deg,#2255cc,#4a79e6);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:15px;
  }
  .side-logo-text{font-weight:700;font-size:16px;}
  .side-logo-sub{font-size:11px;color:var(--muted);}
  .side-nav{padding:16px 12px;flex:1;overflow-y:auto;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;border-radius:8px;
    color:var(--text);font-size:14px;font-weight:500;
    margin-bottom:2px;cursor:pointer;transition:all .15s;
  }
  .nav-item:hover{background:var(--bg);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);}
  .nav-ico{width:18px;height:18px;flex-shrink:0;}
  .side-user{
    padding:16px 20px;border-top:1px solid var(--line);
    display:flex;align-items:center;gap:10px;
  }
  .avatar{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(135deg,#2255cc,#4a79e6);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:600;font-size:14px;flex-shrink:0;
  }
  .user-info{flex:1;min-width:0;}
  .user-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .user-sub{font-size:11px;color:var(--muted);}
  .logout-btn{
    padding:6px;border-radius:6px;color:var(--muted);
    display:flex;align-items:center;justify-content:center;
  }
  .logout-btn:hover{background:var(--danger-soft);color:var(--danger);}

  .main{flex:1;min-width:0;overflow:hidden;}
  .topbar{
    background:var(--panel);border-bottom:1px solid var(--line);
    padding:14px 32px;display:flex;align-items:center;justify-content:space-between;
  }
  .topbar h2{font-size:18px;font-weight:700;}
  .topbar-right{color:var(--muted);font-size:13px;}
  .content{padding:24px 32px;}
  .mode-badge{
    display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;
    background:var(--warn-soft);color:var(--warn);margin-left:8px;
  }
  .mode-badge.online{background:var(--ok-soft);color:var(--ok);}

  /* ========== 仪表盘 ========== */
  .stat-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px;
  }
  .stat-card{
    background:var(--panel);border-radius:12px;padding:20px;
    box-shadow:var(--shadow);border:1px solid var(--line);
  }
  .stat-label{color:var(--muted);font-size:13px;margin-bottom:8px;}
  .stat-value{font-size:28px;font-weight:700;}
  .stat-sub{font-size:12px;color:var(--muted);margin-top:6px;}
  .stat-accent{color:var(--accent);}
  .stat-ok{color:var(--ok);}
  .stat-danger{color:var(--danger);}
  .panel{
    background:var(--panel);border-radius:12px;padding:24px;
    box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:16px;
  }
  .panel-title{font-size:16px;font-weight:700;margin-bottom:16px;}
  .chart-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px dashed var(--line);
  }
  .chart-row:last-child{border-bottom:none;}
  .chart-name{flex:1;font-weight:500;}
  .chart-bar-wrap{flex:2;display:flex;align-items:center;gap:12px;margin:0 20px;}
  .chart-bar{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;}
  .chart-bar-inner{height:100%;background:var(--accent);border-radius:4px;}
  .chart-bar-inner.ok{background:var(--ok);}
  .chart-bar-inner.warn{background:var(--warn);}
  .chart-bar-inner.danger{background:var(--danger);}
  .chart-num{width:90px;text-align:right;color:var(--muted);font-size:13px;}
  .empty{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-ico{font-size:48px;margin-bottom:12px;opacity:.5;}

  /* ========== 刷题页 ========== */
  .quiz-layout{display:grid;grid-template-columns:280px 1fr;gap:20px;}
  .toc-panel{
    background:var(--panel);border-radius:12px;padding:20px;
    box-shadow:var(--shadow);border:1px solid var(--line);
    align-self:start;position:sticky;top:20px;
  }
  .toc-title{font-size:15px;font-weight:700;margin-bottom:4px;}
  .toc-sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
  .toc-legend{
    display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;padding:10px;
    background:var(--bg);border-radius:8px;font-size:11px;
  }
  .legend-item{display:flex;align-items:center;gap:5px;}
  .legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .toc-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
  }
  .toc-cell{
    aspect-ratio:1;border-radius:6px;background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;color:var(--muted);
    cursor:pointer;transition:all .15s;
    border:1px solid transparent;
  }
  .toc-cell:hover{background:var(--accent-soft);color:var(--accent);}
  .toc-cell.correct{background:var(--ok-soft);color:var(--ok);}
  .toc-cell.wrong{background:var(--danger-soft);color:var(--danger);}
  .toc-cell.current{
    background:var(--accent);color:#fff;
    box-shadow:0 2px 8px rgba(34,85,204,0.3);
  }
  .toc-cell.current.correct{background:var(--ok);color:#fff;}
  .toc-cell.current.wrong{background:var(--danger);color:#fff;}

  .question-panel{
    background:var(--panel);border-radius:12px;padding:28px 32px;
    box-shadow:var(--shadow);border:1px solid var(--line);
  }
  .q-meta{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;
    padding-bottom:14px;border-bottom:1px solid var(--line);
  }
  .q-no{font-size:17px;font-weight:700;color:var(--accent);}
  .tag{
    display:inline-block;padding:3px 10px;border-radius:20px;
    font-size:12px;font-weight:500;background:var(--bg);color:var(--muted);
  }
  .tag.year{background:var(--accent-soft);color:var(--accent);}
  .tag.subject{background:var(--bg);color:var(--text);}
  .tag.difficulty{background:var(--warn-soft);color:var(--warn);}
  .tag.difficulty.hard{background:var(--danger-soft);color:var(--danger);}
  .tag.difficulty.mid{background:var(--warn-soft);color:var(--warn);}
  .tag.difficulty.easy{background:var(--ok-soft);color:var(--ok);}
  .tag.tag-item{background:var(--accent-soft);color:var(--accent);}
  .q-body{
    font-size:15px;line-height:1.8;margin:18px 0 22px;
    padding:14px 18px;background:var(--bg);border-radius:8px;
    border-left:3px solid var(--accent);
  }
  .q-body p{margin:6px 0;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    display:flex;align-items:flex-start;gap:12px;
    padding:14px 16px;border:1.5px solid var(--line);
    border-radius:10px;cursor:pointer;transition:all .15s;
    background:var(--bg);
  }
  .option:hover{border-color:var(--accent);background:var(--panel);}
  .option-letter{
    width:28px;height:28px;border-radius:50%;
    background:var(--panel);color:var(--muted);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;flex-shrink:0;
    border:1.5px solid var(--line);
  }
  .option-text{flex:1;line-height:1.7;padding-top:2px;}
  .option.selected{border-color:var(--accent);background:var(--accent-soft);}
  .option.selected .option-letter{background:var(--accent);color:#fff;border-color:var(--accent);}
  .option.correct{border-color:var(--ok);background:var(--ok-soft);}
  .option.correct .option-letter{background:var(--ok);color:#fff;border-color:var(--ok);}
  .option.wrong{border-color:var(--danger);background:var(--danger-soft);}
  .option.wrong .option-letter{background:var(--danger);color:#fff;border-color:var(--danger);}
  .option.disabled{cursor:not-allowed;}
  .option.disabled:hover{border-color:var(--line);background:var(--bg);}
  .option .result-mark{font-size:18px;line-height:1;}
  .feedback{
    margin-top:20px;padding:16px 18px;border-radius:10px;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.correct{background:var(--ok-soft);border-left:3px solid var(--ok);}
  .feedback.wrong{background:var(--danger-soft);border-left:3px solid var(--danger);}
  .feedback-title{font-weight:700;margin-bottom:6px;font-size:14px;}
  .feedback.correct .feedback-title{color:var(--ok);}
  .feedback.wrong .feedback-title{color:var(--danger);}
  .feedback-body{font-size:13px;color:var(--text);line-height:1.8;}
  .solution{
    margin-top:14px;padding:16px 18px;background:var(--accent-soft);
    border-radius:10px;border-left:3px solid var(--accent);
    display:none;
  }
  .solution.show{display:block;}
  .solution-title{font-weight:700;color:var(--accent);margin-bottom:8px;font-size:14px;}
  .solution-body{font-size:13px;line-height:1.8;}

  .quiz-nav{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:24px;padding-top:20px;border-top:1px solid var(--line);
  }
  .btn-outline{
    padding:9px 18px;border-radius:8px;font-weight:600;
    border:1.5px solid var(--line);background:var(--panel);color:var(--text);
    transition:all .15s;
  }
  .btn-outline:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .btn-outline:disabled{opacity:.4;cursor:not-allowed;}
  .btn-outline .ico{margin-right:6px;}
  .progress-info{color:var(--muted);font-size:13px;}

  /* ========== 错题本 / 报告 ========== */
  .list{display:flex;flex-direction:column;gap:12px;}
  .list-item{
    background:var(--panel);border-radius:10px;padding:16px 20px;
    box-shadow:var(--shadow);border:1px solid var(--line);
    cursor:pointer;transition:all .15s;
    display:flex;align-items:center;gap:16px;
  }
  .list-item:hover{border-color:var(--accent);transform:translateY(-1px);}
  .list-num{
    width:40px;height:40px;border-radius:8px;background:var(--accent-soft);
    color:var(--accent);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;flex-shrink:0;
  }
  .list-item.wrong .list-num{background:var(--danger-soft);color:var(--danger);}
  .list-main{flex:1;min-width:0;}
  .list-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .list-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .list-desc{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .list-right{flex-shrink:0;text-align:right;}
  .list-right .mark{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;}
  .mark-wrong{background:var(--danger-soft);color:var(--danger);}
  .mark-ok{background:var(--ok-soft);color:var(--ok);}
  .mark-time{color:var(--muted);font-size:11px;margin-top:4px;display:block;}

  /* ========== 社区 ========== */
  .post{
    background:var(--panel);border-radius:12px;padding:20px;
    box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px;
  }
  .post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .post-name{font-weight:600;}
  .post-time{color:var(--muted);font-size:12px;}
  .post-title{font-weight:700;font-size:16px;margin-bottom:8px;}
  .post-body{color:#3a4060;line-height:1.8;margin-bottom:12px;}
  .post-foot{display:flex;gap:18px;color:var(--muted);font-size:13px;padding-top:12px;border-top:1px dashed var(--line);}
  .post-foot button{display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;}
  .post-foot button:hover{background:var(--accent-soft);color:var(--accent);}

  /* ========== 响应式 ========== */
  @media (max-width: 900px){
    .quiz-layout{grid-template-columns:1fr;}
    .toc-panel{position:static;}
    .sidebar{display:none;}
    .mobile-top{display:flex!important;}
    .topbar{padding:12px 16px;}
    .content{padding:16px;}
  }
</style>
</head>
<body>

<!-- ============ 登录页 ============ -->
<div id="authView" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-mark">数</div>
      <div class="auth-title">数研通</div>
      <div class="auth-sub">考研数学智能刷题平台</div>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-mode="login">登录</button>
      <button class="auth-tab" data-mode="register">注册</button>
    </div>

    <div class="field">
      <label>邮箱</label>
      <input type="email" id="authEmail" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" id="authPassword" placeholder="至少6位" autocomplete="current-password" minlength="6">
    </div>

    <div id="authMsg" class="auth-msg hidden"></div>

    <button class="btn btn-primary" id="authBtn">登 录</button>

    <div class="divider">或</div>
    <button class="btn btn-ghost" id="offlineBtn">进入离线演示模式</button>
  </div>
</div>

<!-- ============ 主应用 ============ -->
<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="side-logo">
      <div class="side-logo-mark">数</div>
      <div>
        <div class="side-logo-text">数研通</div>
        <div class="side-logo-sub">数学智能刷题</div>
      </div>
    </div>
    <nav class="side-nav" id="sideNav">
      <div class="nav-item active" data-page="dashboard">📊 <span>仪表盘</span></div>
      <div class="nav-item" data-page="quiz">✍️ <span>刷题</span></div>
      <div class="nav-item" data-page="wrong">📕 <span>错题本</span></div>
      <div class="nav-item" data-page="report">📈 <span>诊断报告</span></div>
      <div class="nav-item" data-page="community">💬 <span>社区</span></div>
    </nav>
    <div class="side-user">
      <div class="avatar" id="userAvatar">U</div>
      <div class="user-info">
        <div class="user-name" id="userName">离线用户</div>
        <div class="user-sub" id="userSub">演示模式</div>
      </div>
      <button class="logout-btn" id="logoutBtn" title="退出登录">⎋</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2 id="pageTitle">仪表盘 <span class="mode-badge" id="modeBadge">离线模式</span></h2>
      <div class="topbar-right" id="topRight">共 8 道示例题</div>
    </div>
    <div class="content" id="pageContent"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>

<script>
/* =========================================================
   内置示例题目 (Offline Fallback)
   结构：{id,no,year,subject,tag,difficulty,est_time,body,options:[{letter,text,correct}],solution}
   ========================================================= */
const DEMO_QUESTIONS = [
  {
    id: "q001", no: 1, year: 2023, subject: "数学一", tag: ["高等数学", "极限"],
    difficulty: "easy", est_time: 5,
    body: "设函数 f(x) 在 x = 0 处连续，且 lim[x→0] f(x) / x = 1，则下列结论正确的是：",
    options: [
      { letter: "A", text: "f(0) = 0", correct: false },
      { letter: "B", text: "f(0) = 1", correct: false },
      { letter: "C", text: "f'(0) 存在且等于 1", correct: true },
      { letter: "D", text: "f'(0) 不存在", correct: false }
    ],
    solution: "由极限 lim[x→0] f(x)/x = 1 存在且有限，而分母趋于 0，故分子也必须趋于 0，即 f(0) = 0。于是 f'(0) = lim[x→0] (f(x) − f(0))/x = lim[x→0] f(x)/x = 1。答案 C。"
  },
  {
    id: "q002", no: 2, year: 2023, subject: "数学一", tag: ["高等数学", "定积分"],
    difficulty: "mid", est_time: 8,

/* =========================================================
   存储管理
   ========================================================= */
const STORAGE_KEY = "syt_records_v1";
const USER_KEY = "syt_user_v1";

function loadRecords(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e){ return []; }
}
function saveRecords(arr){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}
function addRecord(rec){
  const list = loadRecords();
  // 同一题允许多次记录 (保留历史)
  list.push(rec);
  saveRecords(list);
}
function getLatestPerQuestion(){
  const list = loadRecords();
  const map = {};
  list.forEach(r => {
    if(!map[r.question_id] || new Date(r.created_at) > new Date(map[r.question_id].created_at)){
      map[r.question_id] = r;
    }
  });
  return map;
}
function saveUser(user){
  localStorage.setItem(USER_KEY, JSON.stringify(user));
}
function loadUser(){
  try{ return JSON.parse(localStorage.getItem(USER_KEY)); }
  catch(e){ return null; }
}
function clearUser(){ localStorage.removeItem(USER_KEY); }

/* =========================================================
   状态
   ========================================================= */
const state = {
  supabase: null,
  onlineMode: false,
  user: null,
  questions: DEMO_QUESTIONS,
  currentPage: "dashboard",
  currentQuestionIndex: 0,
  selectedOption: null,     // 当前题目选择(字母)
  answeredMap: {},          // 当前会话作答状态 (题目id -> {chosen, correct})
};

/* 初始化已作答状态 (从 localStorage 载入最近一次) */
function restoreAnswered(){
  const latest = getLatestPerQuestion();
  state.answeredMap = latest;
}

/* =========================================================
   Supabase 初始化
   ========================================================= */
function initSupabase(){
  const cfg = window.APP_CONFIG;
  const hasCfg = cfg && cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY
    && cfg.SUPABASE_URL !== "YOUR-PROJECT"
    && cfg.SUPABASE_URL !== "";
  // CDN 加载的 supabase-js 暴露在 window.supabase 上
  const sb = window.supabase;
  if(hasCfg && sb && typeof sb.createClient === "function"){
    try{
      state.supabase = sb.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
      return true;
    }catch(e){ console.warn("supabase init failed", e); }
  }
  return false;
}

/* =========================================================
   登录/登出
   ========================================================= */
function showAuthMsg(msg, type){
  const el = document.getElementById("authMsg");
  el.textContent = msg;
  el.className = "auth-msg " + (type || "info");
  el.classList.remove("hidden");
}

async function handleAuth(){
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const mode = document.querySelector(".auth-tab.active").dataset.mode;

  if(!email || !password){
    showAuthMsg("请输入邮箱和密码", "error"); return;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    showAuthMsg("邮箱格式不正确", "error"); return;
  }

  const btn = document.getElementById("authBtn");
  btn.disabled = true;
  btn.textContent = "处理中...";

  if(state.supabase){
    try{
      let res;
      if(mode === "login"){
        res = await state.supabase.auth.signInWithPassword({ email, password });
      }else{
        res = await state.supabase.auth.signUp({ email, password });
      }
      if(res.error){ throw new Error(res.error.message); }
      const u = res.data.user;
      state.user = { email: u.email || email, id: u.id, name: (u.email || email).split("@")[0] };
      state.onlineMode = true;
      saveUser(state.user);
      enterApp();
    }catch(err){
      showAuthMsg("操作失败：" + err.message, "error");
      btn.disabled = false;
      btn.textContent = (mode === "login" ? "登 录" : "注 册");
    }
  }else{
    showAuthMsg("Supabase 未配置，已进入离线模式", "info");
    state.user = { email: email || "guest@demo.com", id: "local", name: (email || "guest").split("@")[0] };
    state.onlineMode = false;
    saveUser(state.user);
    setTimeout(enterApp, 600);
  }
}

function enterOffline(){
  state.user = { email: "guest@demo.com", id: "local", name: "访客" };
  state.onlineMode = false;
  saveUser(state.user);
  enterApp();
}

function enterApp(){
  document.getElementById("authView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
  restoreAnswered();

  // 用户信息
  const user = state.user;
  document.getElementById("userName").textContent = user.name;
  document.getElementById("userSub").textContent = state.onlineMode ? user.email : "离线演示模式";
  document.getElementById("userAvatar").textContent = (user.name || "U").charAt(0).toUpperCase();

  // 模式徽章
  const badge = document.getElementById("modeBadge");
  if(state.onlineMode){
    badge.textContent = "已登录";
    badge.className = "mode-badge online";
  }else{
    badge.textContent = "离线模式";
    badge.className = "mode-badge";
  }

  navigate("dashboard");
}

function logout(){
  clearUser();
  state.user = null;
  state.onlineMode = false;
  state.currentQuestionIndex = 0;
  state.selectedOption = null;
  document.getElementById("appView").classList.add("hidden");
  document.getElementById("authView").classList.remove("hidden");
  document.getElementById("authEmail").value = "";
  document.getElementById("authPassword").value = "";
  document.getElementById("authMsg").classList.add("hidden");
}

/* =========================================================
   页面导航
   ========================================================= */
function navigate(page){
  state.currentPage = page;
  document.querySelectorAll(".nav-item").forEach(el => {
    el.classList.toggle("active", el.dataset.page === page);
  });
  const titles = { dashboard:"仪表盘", quiz:"刷题", wrong:"错题本", report:"诊断报告", community:"社区" };
  document.getElementById("pageTitle").innerHTML = (titles[page] || "") +
    ` <span class="mode-badge ${state.onlineMode?'online':''}">${state.onlineMode?'已登录':'离线模式'}</span>`;

  if(page === "dashboard") renderDashboard();
  else if(page === "quiz") renderQuiz();
  else if(page === "wrong") renderWrong();
  else if(page === "report") renderReport();
  else if(page === "community") renderCommunity();
}

/* =========================================================
   仪表盘
   ========================================================= */
function renderDashboard(){
  const records = loadRecords();
  const answeredIds = new Set(records.map(r => r.question_id));
  const latestMap = getLatestPerQuestion();
  const correctCount = Object.values(latestMap).filter(r => r.correct).length;
  const wrongCount = Object.values(latestMap).filter(r => !r.correct).length;
  const total = state.questions.length;
  const rate = answeredIds.size > 0 ? Math.round(correctCount / answeredIds.size * 100) : 0;

  // 知识点统计
  const knowledge = {};
  state.questions.forEach(q => {
    (q.tag || []).forEach(t => {
      if(!knowledge[t]) knowledge[t] = { total:0, correct:0, wrong:0 };
      knowledge[t].total++;
      if(latestMap[q.id]){
        if(latestMap[q.id].correct) knowledge[t].correct++;
        else knowledge[t].wrong++;
      }
    });
  });

  const weak = Object.entries(knowledge)
    .filter(([,d]) => d.wrong > 0)
    .sort((a,b) => b[1].wrong - a[1].wrong);

  document.getElementById("topRight").textContent = `总题量 ${total} · 已答 ${answeredIds.size} · 正确 ${correctCount}`;

  const html = `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">📚 题库总数</div>
        <div class="stat-value">${total}</div>
        <div class="stat-sub">内置示例题目</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">✍️ 已答题目</div>
        <div class="stat-value stat-accent">${answeredIds.size}</div>
        <div class="stat-sub">待练习 ${total - answeredIds.size} 题</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">🎯 正确率</div>
        <div class="stat-value stat-ok">${rate}%</div>
        <div class="stat-sub">正确 ${correctCount} / 错误 ${wrongCount}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">⏱️ 答题次数</div>
        <div class="stat-value">${records.length}</div>
        <div class="stat-sub">含重复作答记录</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">🎓 知识点掌握情况</div>
      ${Object.keys(knowledge).length > 0
        ? Object.entries(knowledge).map(([name, d]) => {
            const answered = d.correct + d.wrong;
            const rate = answered > 0 ? Math.round(d.correct/answered*100) : 0;
            const cls = answered === 0 ? "" : (rate >= 70 ? "ok" : rate >= 40 ? "warn" : "danger");
            return `
            <div class="chart-row">
              <div class="chart-name">${name}</div>
              <div class="chart-bar-wrap">
                <div class="chart-bar"><div class="chart-bar-inner ${cls}" style="width:${answered>0?rate:3}%"></div></div>
              </div>
              <div class="chart-num">${answered}/${d.total} · ${answered>0?rate+'%':'—'}</div>
            </div>`;
          }).join("")
        : `<div class="empty"><div class="empty-ico">📖</div>还没有作答记录</div>`}
    </div>

    ${weak.length > 0 ? `
    <div class="panel">
      <div class="panel-title">⚠️ 薄弱知识点 (建议优先复习)</div>
      ${weak.slice(0,5).map(([name,d]) => `
        <div class="chart-row">
          <div class="chart-name">${name}</div>
          <div class="chart-bar-wrap">
            <div class="chart-bar"><div class="chart-bar-inner danger" style="width:${Math.max(d.wrong*25,10)}%"></div></div>
          </div>
          <div class="chart-num" style="color:var(--danger)">错误 ${d.wrong} 次</div>
        </div>`).join("")}
    </div>` : ""}
  `;
  document.getElementById("pageContent").innerHTML = html;
}

/* =========================================================
   刷题页
   ========================================================= */
function renderQuiz(){
  const total = state.questions.length;
  if(state.currentQuestionIndex >= total) state.currentQuestionIndex = 0;
  if(state.currentQuestionIndex < 0) state.currentQuestionIndex = total - 1;
  const q = state.questions[state.currentQuestionIndex];
  const rec = state.answeredMap[q.id];
  state.selectedOption = rec ? rec.chosen : null;
  const answered = !!rec;

  document.getElementById("topRight").textContent = `第 ${q.no}/${total} 题`;

  document.getElementById("pageContent").innerHTML = `
    <div class="quiz-layout">
      <div class="toc-panel">
        <div class="toc-title">题目目录</div>
        <div class="toc-sub">点击题号直接跳转</div>
        <div class="toc-legend">
          <div class="legend-item"><span class="legend-dot" style="background:var(--bg);border:1px solid var(--line);"></span>未作答</div>
          <div class="legend-item"><span class="legend-dot" style="background:var(--accent);"></span>当前题</div>
          <div class="legend-item"><span class="legend-dot" style="background:var(--ok);"></span>已答对</div>
          <div class="legend-item"><span class="legend-dot" style="background:var(--danger);"></span>已答错</div>
        </div>
        <div class="toc-grid" id="tocGrid"></div>
      </div>
      <div class="question-panel" id="questionPanel"></div>
    </div>
  `;

  renderTocGrid();
  renderQuestionPanel();
}

function renderTocGrid(){
  const grid = document.getElementById("tocGrid");
  if(!grid) return;
  const latest = getLatestPerQuestion();
  grid.innerHTML = state.questions.map((q, i) => {
    let cls = "toc-cell";
    if(i === state.currentQuestionIndex) cls += " current";
    if(latest[q.id]){
      if(latest[q.id].correct) cls += " correct";
      else cls += " wrong";
    }
    return `<div class="${cls}" data-idx="${i}">${q.no}</div>`;
  }).join("");
  grid.querySelectorAll(".toc-cell").forEach(el => {
    el.addEventListener("click", () => {
      state.currentQuestionIndex = parseInt(el.dataset.idx);
      state.selectedOption = null;
      renderQuiz();
    });
  });
}

function renderQuestionPanel(){
  const q = state.questions[state.currentQuestionIndex];
  const latest = getLatestPerQuestion();
  const rec = latest[q.id];
  const isAnswered = !!rec;
  const chosen = state.selectedOption;

  const difficultyMap = { easy:["简单","easy"], mid:["中等","mid"], hard:["困难","hard"] };
  const diff = difficultyMap[q.difficulty] || ["中等","mid"];

  let fbHtml = "";
  if(isAnswered || chosen){
    const correctOpt = q.options.find(o => o.correct);
    const isCorrectNow = chosen && correctOpt && chosen === correctOpt.letter;
    const fbType = rec ? (rec.correct ? "correct" : "wrong") : (isCorrectNow ? "correct" : "wrong");
    const fbTitle = rec ? (rec.correct ? "✓ 答对了" : "✗ 答错了") : (isCorrectNow ? "✓ 回答正确" : "✗ 回答错误");
    const yourAns = rec ? rec.chosen : chosen;
    fbHtml = `
      <div class="feedback show ${fbType}">
        <div class="feedback-title">${fbTitle}</div>
        <div class="feedback-body">你的答案：<b>${yourAns}</b> · 正确答案：<b>${correctOpt.letter}</b></div>
      </div>
      <div class="solution show">
        <div class="solution-title">💡 解析</div>
        <div class="solution-body">${q.solution}</div>
      </div>
    `;
  }

  document.getElementById("questionPanel").innerHTML = `
    <div class="q-meta">
      <span class="q-no">第 ${q.no} 题</span>
      <span class="tag year">${q.year} 年真题</span>
      <span class="tag subject">${q.subject}</span>
      <span class="tag difficulty ${diff[1]}">${diff[0]}</span>
      <span class="tag">⏱️ 约 ${q.est_time} 分钟</span>
      ${(q.tag||[]).map(t => `<span class="tag tag-item">${t}</span>`).join("")}
    </div>
    <div class="q-body">${q.body}</div>
    <div class="options" id="optionsBox"></div>
    ${fbHtml}
    <div class="quiz-nav">
      <button class="btn-outline" id="prevBtn" ${state.currentQuestionIndex===0?'disabled':''}>← 上一题</button>
      <span class="progress-info">${state.currentQuestionIndex+1} / ${state.questions.length}</span>
      <button class="btn-outline" id="nextBtn" ${state.currentQuestionIndex===state.questions.length-1?'disabled':''}>下一题 →</button>
    </div>
  `;

  // 渲染选项
  const optsBox = document.getElementById("optionsBox");
  const correctOpt = q.options.find(o => o.correct);
  const disabled = isAnswered; // 已答过的锁定

  optsBox.innerHTML = q.options.map(opt => {
    let cls = "option";
    if(disabled){
      cls += " disabled";
      if(opt.letter === rec.chosen){
        cls += opt.correct ? " correct" : " wrong";
      }else if(opt.correct){
        cls += " correct";
      }
    }else{
      if(chosen === opt.letter) cls += " selected";
    }
    const mark = disabled
      ? (opt.correct ? `<span class="result-mark" style="color:var(--ok)">✓</span>`
                     : (opt.letter === rec.chosen ? `<span class="result-mark" style="color:var(--danger)">✗</span>` : ""))
      : "";
    return `<div class="${cls}" data-letter="${opt.letter}">
      <div class="option-letter">${opt.letter}</div>
      <div class="option-text">${opt.text}</div>
      ${mark}
    </div>`;
  }).join("");

  if(!disabled){
    optsBox.querySelectorAll(".option").forEach(el => {
      el.addEventListener("click", () => {
        if(state.selectedOption) return; // 每题只允许答一次，可刷新重答
        const letter = el.dataset.letter;
        state.selectedOption = letter;
        const isCorrect = correctOpt.letter === letter;
        // 记录
        addRecord({
          question_id: q.id,
          chosen: letter,
          correct: isCorrect,
          created_at: new Date().toISOString()
        });
        renderQuestionPanel();
        renderTocGrid();
        // 更新顶部
        document.getElementById("topRight").textContent = `第 ${q.no}/${state.questions.length} 题`;
      });
    });
  }

  document.getElementById("prevBtn").addEventListener("click", () => {
    state.currentQuestionIndex--;
    renderQuiz();
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    state.currentQuestionIndex++;
    renderQuiz();
  });
}

/* =========================================================
   错题本
   ========================================================= */
function renderWrong(){
  const latest = getLatestPerQuestion();
  const wrongs = state.questions.filter(q => latest[q.id] && !latest[q.id].correct);

  document.getElementById("topRight").textContent = `共 ${wrongs.length} 道错题`;

  if(wrongs.length === 0){
    document.getElementById("pageContent").innerHTML = `
      <div class="panel">
        <div class="empty">
          <div class="empty-ico">🎉</div>
          <div style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px;">太棒了！暂无错题</div>
          <div>继续保持，去<a href="#" onclick="navigate('quiz');return false;">刷题</a>巩固吧~</div>
        </div>
      </div>`;
    return;
  }

  document.getElementById("pageContent").innerHTML = `
    <div class="panel">
      <div class="panel-title">📕 我的错题本 (${wrongs.length} 道)</div>
      <div class="list">
        ${wrongs.map(q => {
          const r = latest[q.id];
          const t = new Date(r.created_at);
          const timeStr = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
          const bodyText = q.body.replace(/<[^>]+>/g,"").slice(0, 80);
          return `
          <div class="list-item wrong" onclick="jumpToQuestion('${q.id}')">
            <div class="list-num">${q.no}</div>
            <div class="list-main">
              <div class="list-top">
                <span class="list-title">${bodyText}${q.body.length > 80 ? '...' : ''}</span>
              </div>
              <div class="list-desc">${q.year} · ${q.subject} · ${(q.tag||[]).join(" / ")}</div>
            </div>
            <div class="list-right">
              <span class="mark mark-wrong">答错</span>
              <span class="mark-time">${timeStr}</span>
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>
  `;
}

function jumpToQuestion(qid){
  const idx = state.questions.findIndex(q => q.id === qid);
  if(idx >= 0){
    state.currentQuestionIndex = idx;
    state.selectedOption = null;
    navigate("quiz");
  }
}

/* =========================================================
   诊断报告
   ========================================================= */
function renderReport(){
  const records = loadRecords();
  const latest = getLatestPerQuestion();
  const total = state.questions.length;
  const answeredCount = Object.keys(latest).length;
  const correctCount = Object.values(latest).filter(r => r.correct).length;
  const rate = answeredCount > 0 ? Math.round(correctCount/answeredCount*100) : 0;

  document.getElementById("topRight").textContent = `基于 ${records.length} 次作答生成`;

  // 科目统计
  const bySubject = {};
  state.questions.forEach(q => {
    const s = q.subject || "其他";
    if(!bySubject[s]) bySubject[s] = { total:0, answered:0, correct:0 };
    bySubject[s].total++;
    if(latest[q.id]){
      bySubject[s].answered++;
      if(latest[q.id].correct) bySubject[s].correct++;
    }
  });

  // 难度统计
  const byDiff = { easy:{total:0,correct:0,answered:0}, mid:{total:0,correct:0,answered:0}, hard:{total:0,correct:0,answered:0} };
  state.questions.forEach(q => {
    const d = byDiff[q.difficulty] || byDiff.mid;
    d.total++;
    if(latest[q.id]){
      d.answered++;
      if(latest[q.id].correct) d.correct++;
    }
  });

  // 综合评价
  let level = "入门阶段", advice = "建议从简单题开始，建立基础概念。", color = "var(--warn)";
  if(answeredCount >= total*0.8 && rate >= 80){ level="冲刺高手"; advice="已具备扎实基础，可开始真题综合训练。"; color="var(--ok)"; }
  else if(answeredCount >= total*0.5 && rate >= 60){ level="稳步上升"; advice="继续保持节奏，重点突破薄弱知识点。"; color="var(--accent)"; }
  else if(answeredCount > 0){ level="成长阶段"; advice="多复习错题，夯实基础概念。"; }

  document.getElementById("pageContent").innerHTML = `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">📈 整体正确率</div>
        <div class="stat-value stat-ok">${rate}%</div>
        <div class="stat-sub">${correctCount} 对 / ${answeredCount-correctCount} 错</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">🎓 学习阶段</div>
        <div class="stat-value" style="color:${color}">${level}</div>
        <div class="stat-sub">${advice}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">📚 总作答次数</div>
        <div class="stat-value">${records.length}</div>
        <div class="stat-sub">覆盖 ${answeredCount}/${total} 题</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">📊 分科目表现</div>
      ${Object.entries(bySubject).map(([name, d]) => {
        const r = d.answered > 0 ? Math.round(d.correct/d.answered*100) : 0;
        const cls = d.answered === 0 ? "" : (r >= 70 ? "ok" : r >= 40 ? "warn" : "danger");
        return `<div class="chart-row">
          <div class="chart-name">${name}</div>
          <div class="chart-bar-wrap"><div class="chart-bar"><div class="chart-bar-inner ${cls}" style="width:${Math.max(r,3)}%"></div></div></div>
          <div class="chart-num">${d.correct}/${d.answered} (${d.answered>0?r+'%':'—'})</div>
        </div>`;
      }).join("")}
    </div>

    <div class="panel">
      <div class="panel-title">🎯 按难度分析</div>
      ${[ ["easy","简单"], ["mid","中等"], ["hard","困难"] ].map(([k,name]) => {
        const d = byDiff[k];
        const r = d.answered > 0 ? Math.round(d.correct/d.answered*100) : 0;
        const cls = d.answered === 0 ? "" : (r >= 70 ? "ok" : r >= 40 ? "warn" : "danger");
        return `<div class="chart-row">
          <div class="chart-name">${name}</div>
          <div class="chart-bar-wrap"><div class="chart-bar"><div class="chart-bar-inner ${cls}" style="width:${Math.max(r,3)}%"></div></div></div>
          <div class="chart-num">${d.correct}/${d.answered} · ${d.answered>0?r+'%':'未答'}</div>
        </div>`;
      }).join("")}
    </div>

    <div class="panel">
      <div class="panel-title">💡 学习建议</div>
      <div style="line-height:2;color:#3a4060;">
        <p><b>1. 错题回看：</b>定期复习 <a href="#" onclick="navigate('wrong');return false;">错题本</a> 中的题目，理解每一步推导。</p>
        <p><b>2. 薄弱强化：</b>从仪表盘查看薄弱知识点，优先做相关章节的题目。</p>
        <p><b>3. 限时训练：</b>模拟考试环境，按每道题建议时间限时作答。</p>
        <p><b>4. 持续坚持：</b>每天至少练习 15 分钟，数学能力的提升源于持续积累。</p>
      </div>
    </div>
  `;
}

/* =========================================================
   社区
   ========================================================= */
function renderCommunity(){
  document.getElementById("topRight").textContent = `分享学习心得`;
  document.getElementById("pageContent").innerHTML = `
    <div class="panel">
      <div class="panel-title">💬 热门讨论</div>
      ${DEMO_POSTS.map(p => `
        <div class="post">
          <div class="post-head">
            <div class="avatar">${p.name.charAt(0)}</div>

              <div class="post-name">${p.name}</div>
              <div class="post-time">${p.time}</div>
            </div>
          </div>
          <div class="post-title">${p.title}</div>
          <div class="post-body">${p.body}</div>
          <div class="post-foot">

            <button>💬 ${p.comments}</button>
            <button>🔖 收藏</button>
            <button>↗ 分享</button>

    </div>
  `;
}

/* =========================================================
   事件绑定
   ========================================================= */
document.querySelectorAll(".auth-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".auth-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("authBtn").textContent = tab.dataset.mode === "login" ? "登 录" : "注 册";
  });
});
document.getElementById("authBtn").addEventListener("click", handleAuth);
document.getElementById("offlineBtn").addEventListener("click", enterOffline);
document.getElementById("authPassword").addEventListener("keypress", e => { if(e.key === "Enter") handleAuth(); });
document.getElementById("logoutBtn").addEventListener("click", logout);
document.querySelectorAll(".nav-item").forEach(el => {
  el.addEventListener("click", () => navigate(el.dataset.page));
});

/* =========================================================
   启动
   ========================================================= */
(function boot(){
  const ok = initSupabase();
  state.onlineMode = ok && !!state.supabase;

  // 已登录用户直接进入
  const saved = loadUser();
  if(saved){
    state.user = saved;
    enterApp();
  }
})();
</script>
