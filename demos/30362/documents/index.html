<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS 美颜师 - JavaScript 代码美化工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-orange: #d29922;
            --accent-purple: #a371f7;
            --accent-pink: #f778ba;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景装饰 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(88, 166, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(163, 113, 247, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航 */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 24px;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 16px;
            color: white;
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.3);
        }

        .logo h1 {
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 选项栏 */
        .options-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            animation: slideDown 0.6s ease-out 0.1s both;
        }

        .option-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .option-select {
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-select:hover {
            border-color: var(--accent-blue);
        }

        .option-select:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
        }

        /* 主内容区 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            flex: 1;
            animation: fadeIn 0.6s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .code-panel {
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        .panel-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-red { background: #ff5f57; }
        .dot-yellow { background: #febc2e; }
        .dot-green { background: #28c840; }

        .panel-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
            border-color: var(--accent-blue);
        }

        .icon-btn svg {
            width: 16px;
            height: 16px;
        }

        .code-area {
            flex: 1;
            position: relative;
        }

        .code-textarea {
            width: 100%;
            height: 100%;
            min-height: 400px;
            padding: 20px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .code-textarea::placeholder {
            color: var(--text-secondary);
        }

        /* 结果面板 */
        .result-panel .panel-header {
            border-bottom: none;
        }

        .result-content {
            flex: 1;
            padding: 20px;
            overflow: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            animation: resultFadeIn 0.4s ease-out;
        }

        @keyframes resultFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-content:empty::before {
            content: '美化后的代码将在此处显示...';
            color: var(--text-secondary);
        }

        /* 语法高亮 */
        .keyword { color: var(--accent-pink); }
        .string { color: var(--accent-green); }
        .number { color: var(--accent-orange); }
        .comment { color: var(--text-secondary); font-style: italic; }
        .function { color: var(--accent-blue); }
        .operator { color: var(--accent-purple); }

        /* 底部操作栏 */
        .action-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 24px;
            animation: slideUp 0.6s ease-out 0.3s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            box-shadow: 0 4px 16px rgba(88, 166, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(88, 166, 255, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--accent-blue);
            background: var(--bg-secondary);
        }

        .btn-success {
            background: var(--accent-green);
            color: white;
        }

        .btn-success:hover {
            box-shadow: 0 4px 16px rgba(63, 185, 80, 0.4);
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 12px 24px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            .options-bar {
                justify-content: center;
            }

            .code-textarea {
                min-height: 250px;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }

            .action-bar {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">JS</div>
                <div>
                    <h1>JS 美颜师</h1>
                    <p class="tagline">JavaScript 代码美化工具</p>
                </div>
            </div>
            <div class="options-bar">
                <div class="option-group">
                    <span class="option-label">缩进</span>
                    <select class="option-select" id="indentSize">
                        <option value="2">2 空格</option>
                        <option value="4" selected>4 空格</option>
                        <option value="tab">Tab</option>
                    </select>
                </div>
                <div class="option-group">
                    <span class="option-label">引号</span>
                    <select class="option-select" id="quoteStyle">
                        <option value="single">单引号</option>
                        <option value="double" selected>双引号</option>
                    </select>
                </div>
                <div class="option-group">
                    <span class="option-label">分号</span>
                    <select class="option-select" id="semicolon">
                        <option value="add" selected>添加分号</option>
                        <option value="remove">移除分号</option>
                        <option value="keep">保持原样</option>
                    </select>
                </div>
                <div class="option-group">
                    <span class="option-label">花括号</span>
                    <select class="option-select" id="braceStyle">
                        <option value="same" selected>同行</option>
                        <option value="new">新行</option>
                    </select>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="code-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="panel-dot dot-red"></span>
                        <span class="panel-dot dot-yellow"></span>
                        <span class="panel-dot dot-green"></span>
                        <span>输入代码</span>
                    </div>
                    <div class="panel-actions">
                        <button class="icon-btn" onclick="pasteCode()" title="粘贴">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                        <button class="icon-btn" onclick="clearInput()" title="清空">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="code-area">
                    <textarea class="code-textarea" id="inputCode" placeholder="在此粘贴或输入 JavaScript 代码..."></textarea>
                </div>
            </div>

            <div class="code-panel result-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <span class="panel-dot dot-red"></span>
                        <span class="panel-dot dot-yellow"></span>
                        <span class="panel-dot dot-green"></span>
                        <span>美化结果</span>
                    </div>
                    <div class="panel-actions">
                        <button class="icon-btn" onclick="copyResult()" title="复制">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="code-area">
                    <div class="result-content" id="resultCode"></div>
                </div>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn btn-primary" onclick="beautifyCode()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
                美化代码
            </button>
            <button class="btn btn-success" onclick="copyResult()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                复制结果
            </button>
            <button class="btn btn-secondary" onclick="clearAll()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                清空全部
            </button>
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script>
        // 美化选项
        const options = {
            indentSize: 4,
            indentType: '    ',
            quoteStyle: '"',
            semicolon: 'add',
            braceStyle: 'same'
        };

        // 获取选项值
        function updateOptions() {
            const indentSize = document.getElementById('indentSize').value;
            options.indentSize = indentSize === 'tab' ? 1 : parseInt(indentSize);
            options.indentType = indentSize === 'tab' ? '\t' : ' '.repeat(options.indentSize);
            options.quoteStyle = document.getElementById('quoteStyle').value === 'single' ? "'" : '"';
            options.semicolon = document.getElementById('semicolon').value;
            options.braceStyle = document.getElementById('braceStyle').value;
        }

        // 监听选项变化
        document.querySelectorAll('.option-select').forEach(select => {
            select.addEventListener('change', updateOptions);
        });

        // 显示提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // 粘贴代码
        async function pasteCode() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('inputCode').value = text;
                showToast('已粘贴到输入区');
            } catch (err) {
                showToast('粘贴失败，请手动粘贴');
            }
        }

        // 清空输入
        function clearInput() {
            document.getElementById('inputCode').value = '';
            document.getElementById('inputCode').focus();
        }

        // 清空全部
        function clearAll() {
            document.getElementById('inputCode').value = '';
            document.getElementById('resultCode').textContent = '';
            document.getElementById('inputCode').focus();
        }

        // 复制结果
        async function copyResult() {
            const result = document.getElementById('resultCode').textContent;
            if (!result) {
                showToast('结果为空，请先美化代码');
                return;
            }
            try {
                await navigator.clipboard.writeText(result);
                showToast('已复制到剪贴板');
            } catch (err) {
                showToast('复制失败，请手动复制');
            }
        }

        // 简单 JS 美化器
        function beautifyCode() {
            updateOptions();
            const input = document.getElementById('inputCode').value.trim();

            if (!input) {
                showToast('请输入要美化的代码');
                return;
            }

            try {
                let result = beautifyJS(input);
                document.getElementById('resultCode').textContent = result;
                showToast('美化成功');
            } catch (err) {
                showToast('美化失败：' + err.message);
            }
        }

        // JS 美化核心算法
        function beautifyJS(code) {
            let result = '';
            let indentLevel = 0;
            let i = 0;
            const len = code.length;

            function addIndent() {
                return options.indentType.repeat(indentLevel);
            }

            function addNewLine() {
                return '\n';
            }

            while (i < len) {
                const char = code[i];
                const nextChar = code[i + 1];

                // 跳过空白
                if (/\s/.test(char) && char !== '\n') {
                    i++;
                    continue;
                }

                // 注释处理
                if (char === '/' && nextChar === '/') {
                    const commentEnd = code.indexOf('\n', i);
                    const comment = code.substring(i, commentEnd === -1 ? len : commentEnd);
                    result += addNewLine() + addIndent() + comment.trim();
                    i = commentEnd === -1 ? len : commentEnd;
                    continue;
                }

                if (char === '/' && nextChar === '*') {
                    const commentEnd = code.indexOf('*/', i);
                    const comment = code.substring(i, commentEnd === -1 ? len : commentEnd + 2);
                    const lines = comment.split('\n');
                    result += addNewLine() + addIndent() + lines[0].trim();
                    for (let j = 1; j < lines.length; j++) {
                        result += addNewLine() + addIndent() + ' '.repeat(3) + lines[j].trim();
                    }
                    i = commentEnd === -1 ? len : commentEnd + 2;
                    continue;
                }

                // 字符串处理
                if (char === '"' || char === "'") {
                    const quote = char;
                    let str = quote;
                    i++;
                    while (i < len) {
                        const c = code[i];
                        str += c;
                        if (c === '\\' && i + 1 < len) {
                            str += code[i + 1];
                            i += 2;
                            continue;
                        }
                        if (c === quote) {
                            break;
                        }
                        i++;
                    }
                    // 转换引号风格
                    if (quote !== options.quoteStyle) {
                        str = str.replace(/^./, options.quoteStyle).replace(/.$/, options.quoteStyle);
                    }
                    result += str;
                    i++;
                    continue;
                }

                // 模板字符串
                if (char === '`') {
                    let str = '`';
                    i++;
                    while (i < len) {
                        const c = code[i];
                        str += c;
                        if (c === '\\' && i + 1 < len) {
                            str += code[i + 1];
                            i += 2;
                            continue;
                        }
                        if (c === '`') {
                            break;
                        }
                        i++;
                    }
                    result += str;
                    i++;
                    continue;
                }

                // 花括号
                if (char === '{') {
                    if (options.braceStyle === 'new' && result.length > 0 && !result.endsWith(addNewLine())) {
                        // 检查是否需要换行
                        const lastNonSpace = result.trimEnd().slice(-1);
                        if (lastNonSpace === ')' || lastNonSpace === '{' || /[;}]/.test(lastNonSpace)) {
                            result += addNewLine() + addIndent();
                        }
                    }
                    indentLevel++;
                    result += ' {';
                    i++;
                    continue;
                }

                if (char === '}') {
                    indentLevel = Math.max(0, indentLevel - 1);
                    // 在 } 前换行
                    if (!result.endsWith(addNewLine())) {
                        result += addNewLine() + addIndent();
                    } else {
                        result += addIndent();
                    }
                    result += '}';
                    i++;

                    // 分号处理
                    if (options.semicolon === 'add') {
                        while (i < len && /\s/.test(code[i]) && code[i] !== '\n') i++;
                        if (i < len && code[i] !== ';' && code[i] !== '}' && code[i] !== 'e') {
                            // 检查下一个token是否是 else 或 while
                            const rest = code.slice(i).trim();
                            if (!rest.startsWith('else') && !rest.startsWith('while') && !rest.startsWith(',')) {
                                result += ';';
                            }
                        }
                    }

                    // 花括号后换行
                    if (i < len && code[i] !== '\n' && code[i] !== ';' && code[i] !== ',') {
                        result += addNewLine();
                    }
                    continue;
                }

                // 分号
                if (char === ';') {
                    result += ';';
                    i++;
                    if (options.semicolon === 'remove') {
                        // 移除分号，跳过后续空格
                        while (i < len && /\s/.test(code[i]) && code[i] !== '\n') i++;
                        continue;
                    }
                    // 添加换行
                    while (i < len && code[i] === ' ') i++;
                    if (i < len && code[i] !== '\n' && code[i] !== '/' && code[i] !== '}') {
                        result += addNewLine();
                    }
                    continue;
                }

                // 逗号
                if (char === ',') {
                    result += ',';
                    i++;
                    // 逗号后加空格
                    while (i < len && code[i] === ' ') i++;
                    continue;
                }

                // 换行处理
                if (char === '\n') {
                    i++;
                    continue;
                }

                // 括号
                if (char === '(' || char === ')') {
                    result += char;
                    i++;
                    continue;
                }

                // 方括号
                if (char === '[' || char === ']') {
                    result += char;
                    i++;
                    continue;
                }

                // 其他字符
                result += char;
                i++;
            }

            // 清理多余空行
            result = result.replace(/\n{3,}/g, '\n\n');

            // 移除开头多余换行
            result = result.replace(/^\n+/, '');

            // 确保花括号格式正确
            if (options.braceStyle === 'new') {
                result = result.replace(/\{ /g, ' {\n').replace(/\} /g, '\n}');
            }

            return result.trim();
        }

        // 初始化
        updateOptions();
    </script>
