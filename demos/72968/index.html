<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今天吃什么 - 随机选餐器</title>
    <style>
:root {
  --color-primary: #FF6B35; --color-primary-light: #FF8F66; --color-primary-dark: #E55A25;
  --color-secondary: #FFC233; --color-accent: #4ECDC4;
  --color-bg: #FFFBF7; --color-surface: #FFFFFF; --color-text-primary: #2D1B0E;
  --color-text-secondary: #6B5344; --color-text-tertiary: #A08E7F; --color-border: #F0E6DC;
  --font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --radius-full: 9999px; --radius-xl: 16px; --radius-lg: 12px; --radius-md: 8px;
  --shadow-sm: 0 2px 4px rgba(45,27,14,0.04);
}
html.dark {
  --color-bg: #1A1210; --color-surface: #2A1E16; --color-text-primary: #F5E6D8;
  --color-text-secondary: #C4A890; --color-text-tertiary: #8B7565; --color-border: #3D2E22;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-family); background: var(--color-bg); color: var(--color-text-primary); -webkit-font-smoothing: antialiased; }
button { border: none; cursor: pointer; font-family: inherit; }
input, select { font-family: inherit; outline: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

.food-picker-page { min-height: 100vh; padding: 32px 16px; background-color: var(--color-bg); display: flex; flex-direction: column; align-items: center; }
.header-section { width: 100%; max-width: 351px; display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 32px; }
.title-container { flex: 1; text-align: center; }
.decorative-dots { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 12px; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.dot-secondary { background-color: var(--color-secondary); }
.dot-primary-light { width: 8px; height: 8px; background-color: var(--color-primary-light); }
.dot-accent { background-color: var(--color-accent); }
.title-with-emoji { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 8px; }
.time-emoji { font-size: 24px; }
.main-title { font-size: 24px; font-weight: 700; color: var(--color-text-primary); margin: 0; }
.subtitle { font-size: 16px; color: var(--color-text-secondary); margin: 0; }
.dark-toggle-btn { width: 36px; height: 36px; border-radius: var(--radius-full); border: 1px solid var(--color-border); background-color: var(--color-surface); color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center; font-size: 16px; }

.food-card-section { width: 100%; max-width: 351px; margin-bottom: 24px; }
.food-card { width: 100%; min-height: 200px; border-radius: var(--radius-xl); border: 1px solid var(--color-border); background-color: var(--color-surface); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; }
.food-card.card-shaking { animation: card-shake 0.15s linear infinite; }
.food-card.card-celebrate { animation: card-celebrate 0.5s cubic-bezier(.3,0,0,1) forwards; }
.food-emoji { font-size: 80px; line-height: 1; margin-bottom: 12px; }
.food-name { font-size: 24px; font-weight: 600; color: var(--color-text-primary); text-align: center; }

.category-filter-section { width: 100%; max-width: 351px; margin-bottom: 16px; }
.category-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.category-tag { display: inline-flex; align-items: center; white-space: nowrap; padding: 6px 12px; font-size: 14px; font-weight: 500; border-radius: var(--radius-full); background-color: #FFF5EB; color: var(--color-text-secondary); }
.category-tag.active { background-color: var(--color-primary); color: #FFFFFF; }

.budget-filter-section { width: 100%; max-width: 351px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.budget-label { font-size: 14px; color: var(--color-text-tertiary); }
.budget-tags { display: flex; gap: 8px; }
.budget-tag { display: inline-flex; align-items: center; white-space: nowrap; padding: 4px 10px; font-size: 12px; font-weight: 500; border-radius: var(--radius-full); background-color: #FFF5EB; color: var(--color-text-secondary); }
.budget-tag.active { background-color: var(--color-primary); color: #FFFFFF; }

.custom-food-section { width: 100%; max-width: 351px; margin-bottom: 24px; }
.toggle-custom-btn { width: 100%; border-radius: var(--radius-lg); border: 1px solid var(--color-border); background-color: var(--color-surface); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
.panel-title-wrap { display: flex; align-items: center; gap: 8px; }
.count-badge { min-width: 20px; height: 20px; border-radius: var(--radius-full); background-color: var(--color-primary); color: #FFFFFF; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
.panel-title { font-size: 14px; font-weight: 500; color: var(--color-text-secondary); }
.toggle-icon { font-size: 18px; color: var(--color-text-tertiary); }
.custom-panel { margin-top: 8px; border-radius: var(--radius-lg); border: 1px solid var(--color-border); background-color: var(--color-surface); padding: 16px; }
.add-food-form { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.food-name-input { flex: 1; min-width: 100px; border-radius: var(--radius-md); border: 1px solid var(--color-border); background-color: #FFF5EB; color: var(--color-text-primary); padding: 8px 12px; font-size: 14px; }
.emoji-input { width: 60px; border-radius: var(--radius-md); border: 1px solid var(--color-border); background-color: #FFF5EB; color: var(--color-text-primary); padding: 8px 12px; font-size: 14px; text-align: center; }
.price-select { border-radius: var(--radius-md); border: 1px solid var(--color-border); background-color: #FFF5EB; color: var(--color-text-primary); padding: 8px 8px; font-size: 14px; }
.add-btn { border-radius: var(--radius-md); background-color: var(--color-primary); color: #FFFFFF; padding: 8px 16px; font-size: 14px; font-weight: 500; }
.emoji-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.emoji-pick { font-size: 18px; padding: 4px 6px; border-radius: 4px; background-color: transparent; }
.emoji-pick.selected { outline: 2px solid var(--color-primary); }
.custom-food-list { max-height: 192px; overflow-y: auto; }
.custom-food-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius-md); border: 1px solid var(--color-border); background-color: var(--color-surface); margin-bottom: 8px; }
.food-info { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--color-text-primary); }
.emoji-display { font-size: 20px; }
.delete-btn { width: 28px; height: 28px; border-radius: 50%; background-color: transparent; color: var(--color-text-tertiary); font-size: 16px; display: flex; align-items: center; justify-content: center; }
.empty-hint { text-align: center; padding: 16px; font-size: 14px; color: var(--color-text-tertiary); }

.start-section { width: 100%; max-width: 351px; margin-bottom: 24px; }
.start-btn { width: 100%; min-height: 52px; border-radius: var(--radius-full); background: linear-gradient(135deg, #FF6B35 0%, #E55A25 100%); color: #FFFFFF; font-size: 18px; font-weight: 600; }
.tip-text { text-align: center; margin-top: 12px; font-size: 14px; color: var(--color-text-tertiary); }

.blacklist-hint { width: 100%; max-width: 351px; margin-bottom: 16px; text-align: center; }
.hint-text { font-size: 12px; color: var(--color-text-tertiary); }
.clear-btn { background: none; color: var(--color-primary); text-decoration: underline; font-size: 12px; padding: 0; }

.result-section { width: 100%; max-width: 351px; margin-bottom: 32px; }
.result-card { width: 100%; border-radius: var(--radius-xl); border: 1px solid var(--color-border); background-color: var(--color-surface); padding: 24px; text-align: center; }
.result-label { font-size: 16px; color: var(--color-text-secondary); margin-bottom: 8px; }
.result-food { font-size: 32px; font-weight: 700; color: var(--color-primary); margin-bottom: 20px; }
.action-buttons { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
.action-btn { padding: 10px 20px; font-size: 14px; font-weight: 500; border-radius: var(--radius-full); }
.primary-btn { background-color: var(--color-primary); color: #FFFFFF; }
.default-btn { border: 1px solid var(--color-border); background-color: var(--color-surface); color: var(--color-text-secondary); }
.icon-btn { padding: 10px 14px; border: 1px solid var(--color-border); background-color: var(--color-surface); color: var(--color-text-tertiary); }
.share-btn { width: 100%; border-radius: var(--radius-full); border: 1px dashed var(--color-border); background-color: transparent; color: var(--color-text-tertiary); padding: 8px 16px; font-size: 14px; }

.share-modal { position: fixed; inset: 0; z-index: 60; display: none; }
.share-backdrop { position: absolute; inset: 0; background-color: rgba(0,0,0,0.4); }
.share-container { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
.share-card { width: 100%; max-width: 280px; padding: 24px; text-align: center; border-radius: var(--radius-xl); background-color: var(--color-surface); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
.share-label { font-size: 14px; color: var(--color-text-tertiary); margin-bottom: 4px; }
.share-food { font-size: 36px; font-weight: 700; color: var(--color-primary); margin-bottom: 4px; }
.share-time { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 16px; }
.share-source { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 16px; }
.share-actions { display: flex; justify-content: center; gap: 8px; }
.share-copy-btn { flex: 1; border-radius: var(--radius-full); background-color: var(--color-primary); color: #FFFFFF; padding: 8px 16px; font-size: 14px; }
.share-close-btn { border-radius: var(--radius-full); border: 1px solid var(--color-border); background-color: var(--color-surface); color: var(--color-text-secondary); padding: 8px 16px; font-size: 14px; }

.history-section { width: 100%; max-width: 351px; margin-top: 24px; margin-bottom: 8px; }
.history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.history-title { font-size: 14px; font-weight: 500; color: var(--color-text-secondary); }
.clear-history-btn { font-size: 12px; color: var(--color-text-tertiary); background: none; padding: 0; }
.history-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.history-tag { flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; font-size: 12px; white-space: nowrap; border-radius: var(--radius-full); border: 1px solid var(--color-border); background-color: var(--color-surface); color: var(--color-text-secondary); }
.history-empty { font-size: 12px; color: var(--color-text-tertiary); }

.confetti-container { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
.confetti-piece { position: absolute; width: 8px; height: 8px; border-radius: 2px; top: -10px; animation: confetti-fall linear forwards; }

.footer-section { width: 100%; max-width: 351px; margin-top: auto; padding-top: 24px; text-align: center; }
.pick-count { font-size: 14px; color: var(--color-text-tertiary); margin-bottom: 4px; }
.source-text { font-size: 14px; color: var(--color-text-tertiary); }

@keyframes card-shake {
  0%,100%{transform:translateX(0);}10%{transform:translateX(-2px)rotate(-0.5deg);}20%{transform:translateX(2px)rotate(0.5deg);}
  30%{transform:translateX(-3px)rotate(-0.5deg);}40%{transform:translateX(3px)rotate(0.5deg);}50%{transform:translateX(-2px)rotate(-0.3deg);}
  60%{transform:translateX(2px)rotate(0.3deg);}70%{transform:translateX(-1px)rotate(-0.2deg);}80%{transform:translateX(1px)rotate(0.2deg);}
}
@keyframes card-celebrate { 0%{transform:scale(1);}30%{transform:scale(1.06);}60%{transform:scale(0.98);}80%{transform:scale(1.02);}100%{transform:scale(1);} }
@keyframes confetti-fall { 0%{transform:translateY(-10px)rotate(0deg);opacity:1;}100%{transform:translateY(100vh)rotate(720deg);opacity:0;} }

@media (max-width:375px) { .food-picker-page{padding:24px 12px;} .main-title{font-size:22px;} .food-emoji{font-size:64px;} .food-name{font-size:20px;} }
    </style>
</head>
<body>
    <main class="food-picker-page">
        <header class="header-section">
            <div class="title-container">
                <div class="decorative-dots"><span class="dot dot-secondary"></span><span class="dot dot-primary-light"></span><span class="dot dot-accent"></span></div>
                <div class="title-with-emoji"><span id="time-emoji" class="time-emoji">☀️</span><h1 class="main-title">今天吃什么</h1></div>
                <p id="subtitle" class="subtitle">选择困难症终结者</p>
            </div>
            <button id="dark-toggle" class="dark-toggle-btn" title="切换暗色模式"><span id="dark-icon">🌙</span></button>
        </header>
        <section class="food-card-section"><div id="food-card" class="food-card"><div id="food-emoji" class="food-emoji">🍜</div><div id="food-name" class="food-name">点击下方按钮开始</div></div></section>
        <section class="category-filter-section"><div class="category-tags" id="category-tags"></div></section>
        <section class="budget-filter-section"><span class="budget-label">预算</span><div class="budget-tags" id="budget-tags"></div></section>
        <section class="custom-food-section">
            <button id="toggle-custom" class="toggle-custom-btn">
                <span class="panel-title-wrap"><span id="custom-count-badge" class="count-badge" style="display:none;">0</span><span class="panel-title">我的食物库</span></span>
                <span id="toggle-icon" class="toggle-icon">+</span>
            </button>
            <div id="custom-panel" class="custom-panel" style="display:none;">
                <div class="add-food-form">
                    <input id="custom-food-name" type="text" placeholder="食物名称" maxlength="20" class="food-name-input">
                    <input id="custom-food-emoji" type="text" placeholder="emoji" maxlength="4" class="emoji-input">
                    <select id="custom-food-price" class="price-select">
                        <option value="1">≤20元</option><option value="2">20-50元</option><option value="3">50元以上</option>
                    </select>
                    <button id="add-food-btn" class="add-btn">添加</button>
                </div>
                <div class="emoji-picker" id="emoji-picker"></div>
                <div id="custom-food-list" class="custom-food-list no-scrollbar"></div>
                <p id="custom-empty-hint" class="empty-hint">还没有自定义食物，快添加你爱吃的吧</p>
            </div>
        </section>
        <section class="start-section"><button id="start-btn" class="start-btn">开始选</button><p class="tip-text">按空格键也可以开始</p></section>
        <div id="blacklist-hint" class="blacklist-hint" style="display:none;"><div class="hint-content"><span class="hint-text">🚫 已屏蔽 <span id="blacklist-count">0</span> 种，<button id="clear-blacklist" class="clear-btn">清空</button></span></div></div>
        <section id="result-section" class="result-section" style="display:none;">
            <div class="result-card">
                <p class="result-label">今天就吃</p><p id="result-text" class="result-food">--</p>
                <div class="action-buttons">
                    <button id="retry-btn" class="action-btn primary-btn">再来一次</button>
                    <button id="skip-btn" class="action-btn default-btn">换一个</button>
                    <button id="blacklist-btn" class="action-btn icon-btn" title="本轮不再出现">🚫</button>
                </div>
                <button id="share-btn" class="share-btn">📸 分享今天吃了啥</button>
            </div>
        </section>
        <div id="share-modal" class="share-modal">
            <div id="share-backdrop" class="share-backdrop"></div>
            <div class="share-container">
                <div class="share-card">
                    <p class="share-label">今天吃了</p><p id="share-food-text" class="share-food">--</p>
                    <p id="share-time-text" class="share-time">--</p><p class="share-source">来自「今天吃什么」随机选餐器</p>
                    <div class="share-actions">
                        <button id="share-copy-btn" class="share-copy-btn">复制文字</button>
                        <button id="share-close-btn" class="share-close-btn">关闭</button>
                    </div>
                </div>
            </div>
        </div>
        <section class="history-section">
            <div class="history-header"><span class="history-title">最近吃过</span><button id="clear-history" class="clear-history-btn">清空</button></div>
            <div id="history-list" class="history-list no-scrollbar"></div>
            <p id="history-empty" class="history-empty">还没有记录哦</p>
        </section>
        <div id="confetti-container" class="confetti-container"></div>
        <footer class="footer-section"><p id="pick-count" class="pick-count">已帮你做了 0 次选择</p><p class="source-text">本餐灵感来源：你的随机运气</p></footer>
    </main>
    <script>

    function getTimeSlot(){
        var h=new Date().getHours();
        if(h>=5&&h<9)return{label:'早餐',emoji:'🌅',greeting:'早安，今天早餐吃什么？'};

        if(h>=14&&h<17)return{label:'下午茶',emoji:'☕',greeting:'下午茶时间，来点啥？'};
        if(h>=17&&h<20)return{label:'晚餐',emoji:'🌆',greeting:'晚上好，今天晚饭吃什么？'};
        if(h>=20&&h<23)return{label:'夜宵',emoji:'🌙',greeting:'夜宵时间，来点啥好吃的？'};
        return{label:'夜宵',emoji:'🌙',greeting:'这个点了还在想吃的？佩服！'};
    }
    var timeSlot=getTimeSlot();
    document.getElementById('time-emoji').textContent=timeSlot.emoji;
    document.getElementById('subtitle').textContent=timeSlot.greeting;

    var darkToggle=document.getElementById('dark-toggle'),darkIcon=document.getElementById('dark-icon'),htmlEl=document.documentElement;
    try{var savedTheme=localStorage.getItem('eat-what-theme');if(savedTheme==='dark'){htmlEl.classList.remove('light');htmlEl.classList.add('dark');darkIcon.textContent='☀️';}}catch(e){}
    darkToggle.addEventListener('click',function(){
        var isDark=htmlEl.classList.contains('dark');
        if(isDark){htmlEl.classList.remove('dark');htmlEl.classList.add('light');darkIcon.textContent='🌙';try{localStorage.setItem('eat-what-theme','light');}catch(e){}}
        else{htmlEl.classList.remove('light');htmlEl.classList.add('dark');darkIcon.textContent='☀️';try{localStorage.setItem('eat-what-theme','dark');}catch(e){}}
    });

    var categoryTagsEl=document.getElementById('category-tags');
    categoryConfig.forEach(function(cat,i){
        var btn=document.createElement('button');btn.className='category-tag'+(i===0?' active':'');btn.setAttribute('data-category',cat.key);btn.textContent=(cat.emoji?cat.emoji+' ':'')+cat.label;categoryTagsEl.appendChild(btn);
    });

    var budgetTagsEl=document.getElementById('budget-tags');
    budgetConfig.forEach(function(budget,i){
        var btn=document.createElement('button');btn.className='budget-tag'+(i===0?' active':'');btn.setAttribute('data-budget',budget.key);btn.textContent=budget.label;budgetTagsEl.appendChild(btn);
    });

    var emojiPickerEl=document.getElementById('emoji-picker');
    emojiOptions.forEach(function(emoji){var btn=document.createElement('button');btn.className='emoji-pick';btn.setAttribute('data-emoji',emoji);btn.textContent=emoji;emojiPickerEl.appendChild(btn);});

    var confettiContainer=document.getElementById('confetti-container'),confettiColors=['var(--color-primary)','var(--color-secondary)','var(--color-accent)','var(--color-primary-light)','var(--color-secondary-light)','var(--color-accent-light)'];
    for(var i=0;i<40;i++){var piece=document.createElement('span');piece.className='confetti-piece';piece.style.left=(Math.random()*100)+'%';piece.style.backgroundColor=confettiColors[Math.floor(Math.random()*confettiColors.length)];confettiContainer.appendChild(piece);}

    var customFoods=[];try{var saved=localStorage.getItem('eat-what-custom-foods');if(saved)customFoods=JSON.parse(saved);}catch(e){}
    function saveCustomFoods(){try{localStorage.setItem('eat-what-custom-foods',JSON.stringify(customFoods));}catch(e){}}

    var currentCategory='all',currentBudget='all',isSpinning=false,spinTimer=null,pickCount=0,lastSelectedItem=null,blacklist=[],selectedEmoji='',panelOpen=false;
    var foodCard=document.getElementById('food-card'),foodEmoji=document.getElementById('food-emoji'),foodName=document.getElementById('food-name'),startBtn=document.getElementById('start-btn'),resultSection=document.getElementById('result-section'),resultText=document.getElementById('result-text'),retryBtn=document.getElementById('retry-btn'),skipBtn=document.getElementById('skip-btn'),pickCountEl=document.getElementById('pick-count'),categoryTags=document.querySelectorAll('.category-tag'),budgetTags=document.querySelectorAll('.budget-tag');

    function getFoodList(){
        var list;
        if(currentCategory==='all'){list=[];for(var key in foodData){list=list.concat(foodData[key]);}list=list.concat(customFoods);}
        else if(currentCategory==='custom'){list=customFoods.slice();}
        else{list=(foodData[currentCategory]||[]).slice();}
        if(currentBudget==='low')list=list.filter(function(f){return(f.price||1)===1;});
        else if(currentBudget==='mid')list=list.filter(function(f){return(f.price||1)===2;});
        else if(currentBudget==='high')list=list.filter(function(f){return(f.price||1)===3;});
        list=list.filter(function(f){return blacklist.indexOf(f.name)===-1;});
        return list;
    }
    function updateCard(item){foodEmoji.textContent=item.emoji;foodName.textContent=item.name;}

    function startSpin(){
        if(isSpinning)return;isSpinning=true;resultSection.style.display='none';startBtn.textContent='选择中...';startBtn.disabled=true;foodCard.classList.add('card-shaking');foodCard.classList.remove('card-celebrate');
        var list=getFoodList();if(list.length===0){stopSpin(null);return;}
        var interval=50,totalSteps=0,maxSteps=25+Math.floor(Math.random()*15),currentIndex=Math.floor(Math.random()*list.length);
        function tick(){
            var nextIdx;do{nextIdx=Math.floor(Math.random()*list.length);}while(nextIdx===currentIndex&&list.length>1);
            currentIndex=nextIdx;updateCard(list[currentIndex]);totalSteps++;
            if(totalSteps>=maxSteps){stopSpin(list[currentIndex]);return;}
            interval=interval+8+Math.floor(totalSteps/5)*4;spinTimer=setTimeout(tick,interval);
        }spinTimer=setTimeout(tick,interval);
    }

    function stopSpin(selectedItem){
        isSpinning=false;clearTimeout(spinTimer);foodCard.classList.remove('card-shaking');foodCard.classList.add('card-celebrate');startBtn.textContent='开始选';startBtn.disabled=false;
        if(!selectedItem){foodName.textContent=currentCategory==='custom'?'先添加些食物吧':'当前筛选无结果';foodEmoji.textContent='💰';return;}
        lastSelectedItem=selectedItem;pickCount++;pickCountEl.textContent='已帮你做了 '+pickCount+' 次选择';addToHistory(selectedItem);
        setTimeout(function(){resultSection.style.display='block';resultText.textContent=selectedItem.emoji+' '+selectedItem.name;launchConfetti();},300);
    }

    function launchConfetti(){
        var pieces=confettiContainer.querySelectorAll('.confetti-piece');
        pieces.forEach(function(piece){
            piece.style.animationDuration='0s';piece.style.animationDelay='0s';piece.style.opacity='0';void piece.offsetWidth;
            var duration=(2+Math.random()*2.5)+'s',delay=(Math.random()*0.6)+'s';
            piece.style.animationDuration=duration;piece.style.animationDelay=delay;piece.style.opacity='1';
            piece.style.width=(6+Math.floor(Math.random()*6))+'px';piece.style.height=(6+Math.floor(Math.random()*6))+'px';
        });
        setTimeout(function(){pieces.forEach(function(piece){piece.style.opacity='0';piece.style.animationDuration='0s';});},5000);
    }

    categoryTags.forEach(function(tag){
        tag.addEventListener('click',function(){
            if(isSpinning)return;currentCategory=this.getAttribute('data-category');
            categoryTags.forEach(function(t){t.classList.remove('active');});this.classList.add('active');resultSection.style.display='none';
            var list=getFoodList();
            if(list.length>0){var sample=list[Math.floor(Math.random()*list.length)];updateCard(sample);}
            else{foodEmoji.textContent=currentCategory==='custom'?'💭':'💰';foodName.textContent=currentCategory==='custom'?'先添加些食物吧':'当前筛选无结果';}
        });
    });

    budgetTags.forEach(function(tag){
        tag.addEventListener('click',function(){
            currentBudget=this.getAttribute('data-budget');budgetTags.forEach(function(t){t.classList.remove('active');});this.classList.add('active');resultSection.style.display='none';
            var list=getFoodList();
            if(list.length>0){var sample=list[Math.floor(Math.random()*list.length)];updateCard(sample);}
            else{foodEmoji.textContent='💰';foodName.textContent='当前筛选无结果';}
        });
    });

    startBtn.addEventListener('click',startSpin);
    retryBtn.addEventListener('click',function(){startSpin();});
    skipBtn.addEventListener('click',function(){
        var list=getFoodList();if(list.length===0)return;
        var item=list[Math.floor(Math.random()*list.length)];updateCard(item);lastSelectedItem=item;pickCount++;pickCountEl.textContent='已帮你做了 '+pickCount+' 次选择';addToHistory(item);
        foodCard.classList.remove('card-shaking');foodCard.classList.add('card-celebrate');resultSection.style.display='block';resultText.textContent=item.emoji+' '+item.name;launchConfetti();
    });

    var blacklistHint=document.getElementById('blacklist-hint'),blacklistCountEl=document.getElementById('blacklist-count');
    function updateBlacklistUI(){if(blacklist.length>0){blacklistHint.style.display='block';blacklistCountEl.textContent=blacklist.length;}else{blacklistHint.style.display='none';}}
    document.getElementById('blacklist-btn').addEventListener('click',function(){if(!lastSelectedItem)return;if(blacklist.indexOf(lastSelectedItem.name)===-1){blacklist.push(lastSelectedItem.name);}updateBlacklistUI();resultSection.style.display='none';startSpin();});
    document.getElementById('clear-blacklist').addEventListener('click',function(){blacklist=[];updateBlacklistUI();var list=getFoodList();if(list.length>0)updateCard(list[Math.floor(Math.random()*list.length)]);});

    var history=[];try{var savedHistory=localStorage.getItem('eat-what-history');if(savedHistory)history=JSON.parse(savedHistory);}catch(e){}
    function saveHistory(){try{localStorage.setItem('eat-what-history',JSON.stringify(history));}catch(e){}}
    function addToHistory(item){
        var recent=history.slice(0,3),isRecent=recent.some(function(h){return h.name===item.name;});
        if(!isRecent){history.unshift({name:item.name,emoji:item.emoji,time:Date.now()});if(history.length>20)history=history.slice(0,20);saveHistory();renderHistory();}
    }
    function renderHistory(){
        var listEl=document.getElementById('history-list'),emptyEl=document.getElementById('history-empty');
        if(history.length===0){listEl.innerHTML='';emptyEl.style.display='block';return;}emptyEl.style.display='none';
        var html='';history.forEach(function(item){html+='<div class="history-tag"><span>'+item.emoji+'</span><span>'+escapeHtml(item.name)+'</span></div>';});
        listEl.innerHTML=html;
    }
    document.getElementById('clear-history').addEventListener('click',function(){history=[];saveHistory();renderHistory();});renderHistory();

    var shareModal=document.getElementById('share-modal'),shareFoodText=document.getElementById('share-food-text'),shareTimeTextEl=document.getElementById('share-time-text');
    document.getElementById('share-btn').addEventListener('click',function(){
        if(!lastSelectedItem)return;shareFoodText.textContent=lastSelectedItem.emoji+' '+lastSelectedItem.name;
        var now=new Date();var timeStr=now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate()+' '+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes();
        shareTimeTextEl.textContent=timeStr+' · '+timeSlot.label;shareModal.style.display='block';
    });
    function closeShareModal(){shareModal.style.display='none';}
    document.getElementById('share-close-btn').addEventListener('click',closeShareModal);document.getElementById('share-backdrop').addEventListener('click',closeShareModal);

    document.getElementById('share-copy-btn').addEventListener('click',function(){
        var text='今天吃了 '+lastSelectedItem.emoji+' '+lastSelectedItem.name+'（来自「今天吃什么」随机选餐器）';
        if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){showCopySuccess();}).catch(function(){fallbackCopy(text);});}else{fallbackCopy(text);}
    });
    function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showCopySuccess();}catch(e){}document.body.removeChild(ta);}
    function showCopySuccess(){var btn=document.getElementById('share-copy-btn');btn.textContent='已复制';btn.style.backgroundColor='var(--state-success,#4CAF50)';setTimeout(function(){btn.textContent='复制文字';btn.style.backgroundColor='';},1500);}

    var toggleCustom=document.getElementById('toggle-custom'),customPanel=document.getElementById('custom-panel'),toggleIcon=document.getElementById('toggle-icon'),customFoodNameInput=document.getElementById('custom-food-name'),customFoodEmojiInput=document.getElementById('custom-food-emoji'),addFoodBtn=document.getElementById('add-food-btn'),customFoodListEl=document.getElementById('custom-food-list'),customEmptyHint=document.getElementById('custom-empty-hint'),customCountBadge=document.getElementById('custom-count-badge'),emojiPicks=document.querySelectorAll('.emoji-pick');

    toggleCustom.addEventListener('click',function(){panelOpen=!panelOpen;if(panelOpen){customPanel.style.display='block';toggleIcon.textContent='-';}else{customPanel.style.display='none';toggleIcon.textContent='+';}});
    emojiPicks.forEach(function(btn){btn.addEventListener('click',function(){emojiPicks.forEach(function(b){b.classList.remove('selected');});this.classList.add('selected');selectedEmoji=this.getAttribute('data-emoji');customFoodEmojiInput.value=selectedEmoji;});});
    customFoodEmojiInput.addEventListener('input',function(){emojiPicks.forEach(function(b){b.classList.remove('selected');});selectedEmoji='';});

    function addCustomFood(){
        var name=customFoodNameInput.value.trim(),emoji=customFoodEmojiInput.value.trim()||'🍽️',price=parseInt(document.getElementById('custom-food-price').value)||1;
        if(!name){customFoodNameInput.style.borderColor='var(--state-error,#F44336)';setTimeout(function(){customFoodNameInput.style.borderColor='';},1000);return;}
        var isDuplicate=customFoods.some(function(f){return f.name===name;});
        if(isDuplicate){customFoodNameInput.style.borderColor='var(--state-warning,#FF9800)';setTimeout(function(){customFoodNameInput.style.borderColor='';},1000);return;}
        customFoods.push({name:name,emoji:emoji,price:price});saveCustomFoods();renderCustomList();customFoodNameInput.value='';customFoodEmojiInput.value='';emojiPicks.forEach(function(b){b.classList.remove('selected');});selectedEmoji='';customFoodNameInput.focus();
    }
    addFoodBtn.addEventListener('click',addCustomFood);customFoodNameInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addCustomFood();}});customFoodEmojiInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addCustomFood();}});
    function deleteCustomFood(index){customFoods.splice(index,1);saveCustomFoods();renderCustomList();}
    function renderCustomList(){
        customCountBadge.textContent=customFoods.length;if(customFoods.length>0)customCountBadge.style.display='inline-flex';else customCountBadge.style.display='none';
        if(customFoods.length===0){customFoodListEl.innerHTML='';customEmptyHint.style.display='block';return;}customEmptyHint.style.display='none';
        var html='';customFoods.forEach(function(food,i){html+='<div class="custom-food-item"><div class="food-info"><span class="emoji-display">'+food.emoji+'</span><span>'+escapeHtml(food.name)+'</span></div><button class="delete-btn" data-delete-index="'+i+'" title="删除">×</button></div>';});
        customFoodListEl.innerHTML=html;customFoodListEl.querySelectorAll('.delete-btn').forEach(function(btn){btn.addEventListener('click',function(){deleteCustomFood(parseInt(this.getAttribute('data-delete-index')));});});
    }

    function escapeHtml(text){var div=document.createElement('div');div.textContent=text;return div.innerHTML;}renderCustomList();

    document.addEventListener('keydown',function(e){if(e.code==='Space'&&!isSpinning&&e.target===document.body){e.preventDefault();startSpin();}});

    var initialList=getFoodList();if(initialList.length>0){var initFood=initialList[Math.floor(Math.random()*initialList.length)];updateCard(initFood);}
})();
    </script>
</body>
</html>
