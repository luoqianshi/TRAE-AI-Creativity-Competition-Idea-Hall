<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>叮咚眼 · AI智能门铃</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-1: #0a1929;
  --bg-2: #132f4c;
  --bg-3: #0d1f2d;
  --cyan: #00b0ff;
  --cyan-light: #18ffff;
  --green: #39ff14;
  --yellow: #ffc107;
  --red: #ff5252;
  --text: #e3f2fd;
  --text-dim: #78909c;
}
html, body { width: 100%; min-height: 100vh; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, #0a1f3d 100%);
  min-height: 100vh; color: var(--text); overflow-x: hidden;
  position: relative;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(0,176,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,176,255,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);
}
.bg-orb {
  position: fixed; border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: 0;
}
.bg-orb-1 { width: 400px; height: 400px; background: rgba(0,176,255,0.1); top: -100px; right: -100px; }
.bg-orb-2 { width: 350px; height: 350px; background: rgba(24,255,255,0.08); bottom: -80px; left: -80px; }

.container {
  position: relative; z-index: 1;
  max-width: 1240px; margin: 0 auto; padding: 24px;
}

/* 头部 */
.header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 22px; flex-wrap: wrap; gap: 16px;
  padding-bottom: 18px; border-bottom: 1px solid rgba(0,176,255,0.1);
}
.logo-wrap { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--cyan), var(--cyan-light));
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 20px rgba(0,176,255,0.4);
}
.logo-icon svg { width: 26px; height: 26px; color: #0a1929; }
.logo-text h1 {
  font-size: 24px; font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(90deg, var(--cyan), var(--cyan-light));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  line-height: 1.1;
}
.logo-text p { font-size: 11px; color: var(--text-dim); letter-spacing: 4px; margin-top: 2px; }

.status-badge {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px;
  background: rgba(57,255,20,0.1);
  border: 1px solid rgba(57,255,20,0.3);
  border-radius: 22px;
  font-size: 12px; color: var(--green);
  letter-spacing: 1px;
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 8px var(--green);
  animation: blink 1.5s infinite;
}
@keyframes blink { 50% { opacity: 0.3; } }

/* 主区域 */
.main-grid {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 24px;
  margin-bottom: 24px;
}
@media (max-width: 920px) { .main-grid { grid-template-columns: 1fr; } }

/* 监控区 */
.camera-area {
  background: #000;
  border: 2px solid rgba(0,176,255,0.5);
  border-radius: 16px; overflow: hidden;
  position: relative; aspect-ratio: 16/9;
  box-shadow: 0 0 40px rgba(0,176,255,0.25);
}
.camera-feed {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, var(--bg-3) 0%, #1a3a5c 50%, var(--bg-3) 100%);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.camera-feed::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.5) 100%);
  pointer-events: none;
}
.scanlines {
  position: absolute; inset: 0; pointer-events:none;
  background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,176,255,0.08) 2px, rgba(0,176,255,0.08) 4px);
  animation: scan 4s linear infinite;
  z-index: 2;
}
@keyframes scan { from { background-position: 0 0; } to { background-position: 0 100px; } }
.scan-bar {
  position: absolute; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  box-shadow: 0 0 20px var(--cyan);
  animation: scanMove 3s ease-in-out infinite; z-index: 3;
}
@keyframes scanMove { 0%, 100% { top: 5%; } 50% { top: 95%; } }

.corner { position: absolute; width: 30px; height: 30px; border: 3px solid var(--cyan); z-index: 4; }
.corner.tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
.corner.tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
.corner.bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
.corner.br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

.hud-info {
  position: absolute; top: 16px; left: 50px; z-index: 5;
  font-size: 12px; color: var(--cyan); font-family: "Consolas", monospace; line-height: 1.7;
}
.hud-info .rec { color: var(--red); font-weight: 700; }
.hud-info .rec::before {
  content: ''; display: inline-block; width: 8px; height: 8px;
  background: var(--red); border-radius: 50%; margin-right: 4px;
  box-shadow: 0 0 8px var(--red); animation: blink 1s infinite;
}
.hud-bottom {
  position: absolute; bottom: 16px; left: 50px; right: 50px; z-index: 5;
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--cyan); font-family: "Consolas", monospace;
}
.hud-bottom span { display: flex; align-items: center; gap: 4px; }

/* 访客场景 */
.visitor-scene {
  position: relative; z-index: 3;
  display: flex; flex-direction: column; align-items: center;
  opacity: 0; transition: opacity 0.5s;
}
.visitor-scene.show { opacity: 1; }
.visitor-scene svg { filter: drop-shadow(0 0 20px rgba(0,176,255,0.6)); }
.visitor-label {
  margin-top: 16px; padding: 10px 28px;
  background: rgba(0,176,255,0.2); border: 2px solid var(--cyan);
  border-radius: 24px; font-size: 15px; font-weight: 700; color: var(--cyan-light);
  letter-spacing: 3px;
  animation: labelPop 0.5s cubic-bezier(0.2,1.5,0.4,1);
  display: flex; align-items: center; gap: 8px;
}
.visitor-label .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
@keyframes labelPop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* AI 识别结果卡 */
.ai-result {
  position: absolute; top: 16px; right: 50px; z-index: 5;
  background: rgba(0,176,255,0.15); backdrop-filter: blur(10px);
  border: 1px solid var(--cyan); border-radius: 10px;
  padding: 10px 14px; font-size: 11px; color: var(--cyan-light);
  min-width: 180px; opacity: 0; transform: translateX(20px);
  transition: all 0.5s; font-family: "Consolas", monospace;
}
.ai-result.show { opacity: 1; transform: translateX(0); }
.ai-result .ai-row { display: flex; justify-content: space-between; margin: 3px 0; }
.ai-result .ai-row .k { color: var(--cyan); }
.ai-result .ai-row .v { color: var(--text); font-weight: 700; }
.ai-result .ai-title { color: var(--cyan-light); font-size: 12px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }

/* 门铃面板 */
.doorbell-panel {
  background: linear-gradient(135deg, rgba(0,176,255,0.08), rgba(0,176,255,0.03));
  border: 1px solid rgba(0,176,255,0.3);
  border-radius: 16px; padding: 28px 20px;
  display: flex; flex-direction: column; align-items: center;
  position: relative; overflow: hidden;
}
.doorbell-panel::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
}
.doorbell-panel h3 {
  font-size: 14px; color: var(--cyan); letter-spacing: 3px;
  margin-bottom: 22px; display: flex; align-items: center; gap: 6px;
  font-weight: 600;
}
.doorbell-panel h3 svg { width: 16px; height: 16px; }
.doorbell-btn {
  width: 140px; height: 140px; border-radius: 50%;
  border: 3px solid var(--cyan);
  background: radial-gradient(circle, rgba(0,176,255,0.4), rgba(0,176,255,0.1));
  cursor: pointer; position: relative;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800; color: var(--cyan-light); letter-spacing: 3px;
  transition: all 0.25s;
  box-shadow: 0 0 20px rgba(0,176,255,0.3), inset 0 0 20px rgba(0,176,255,0.1);
}
.doorbell-btn:hover {
  box-shadow: 0 0 40px rgba(0,176,255,0.6), inset 0 0 30px rgba(0,176,255,0.2);
  transform: scale(1.05);
}
.doorbell-btn:active { transform: scale(0.95); }
.doorbell-btn svg { width: 32px; height: 32px; margin-bottom: 4px; }
.pulse-ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 3px solid var(--cyan); opacity: 0; pointer-events: none;
}
.doorbell-btn.ringing .pulse-ring { animation: pulse 1.5s ease-out infinite; }
.doorbell-btn.ringing .pulse-ring:nth-child(2) { animation-delay: 0.5s; }
.doorbell-btn.ringing .pulse-ring:nth-child(3) { animation-delay: 1s; }
@keyframes pulse {
  0% { transform: scale(1); opacity: 0.8; }
  100% { transform: scale(2.4); opacity: 0; }
}
.btn-hint {
  margin-top: 18px; font-size: 12px; color: var(--text-dim);
  display: flex; align-items: center; gap: 5px;
}
.btn-hint svg { width: 12px; height: 12px; }

.doorbell-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 18px;
}
.stat-mini {
  background: rgba(0,176,255,0.08);
  border: 1px solid rgba(0,176,255,0.15);
  border-radius: 10px; padding: 10px 6px; text-align: center;
}
.stat-mini .num { font-size: 18px; font-weight: 800; color: var(--cyan); }
.stat-mini .lbl { font-size: 10px; color: var(--text-dim); margin-top: 2px; letter-spacing: 1px; }

/* 访客记录 */
.records-section {
  background: linear-gradient(135deg, rgba(0,176,255,0.05), rgba(0,176,255,0.02));
  border: 1px solid rgba(0,176,255,0.2);
  border-radius: 16px; padding: 22px;
  position: relative;
}
.records-section::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
}
.records-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px;
}
.records-header h3 {
  font-size: 16px; color: var(--cyan); letter-spacing: 2px;
  display: flex; align-items: center; gap: 8px;
}
.records-header h3 svg { width: 18px; height: 18px; }
.record-count { font-size: 12px; color: var(--text-dim); }
.record-count strong { color: var(--cyan); }
.filter-tags { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.filter-tag {
  padding: 4px 12px; border-radius: 12px;
  background: rgba(0,176,255,0.08); border: 1px solid rgba(0,176,255,0.15);
  color: var(--text-dim); font-size: 11px; cursor: pointer;
  transition: all 0.2s; letter-spacing: 1px;
}
.filter-tag:hover, .filter-tag.active { background: var(--cyan); color: var(--bg-1); border-color: var(--cyan); }

.records-list { max-height: 400px; overflow-y: auto; padding-right: 6px; }
.records-list::-webkit-scrollbar { width: 6px; }
.records-list::-webkit-scrollbar-track { background: rgba(0,176,255,0.05); border-radius: 3px; }
.records-list::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 3px; }

.record-item {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 14px;
  background: rgba(255,255,255,0.03);
  border-radius: 10px; margin-bottom: 8px; cursor: pointer;
  transition: all 0.25s; border-left: 3px solid transparent;
}
.record-item:hover {
  background: rgba(0,176,255,0.1); border-left-color: var(--cyan);
  transform: translateX(4px);
}
.record-avatar {
  width: 48px; height: 48px; border-radius: 50%;
  background: rgba(0,176,255,0.15);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  border: 2px solid rgba(0,176,255,0.2);
}
.record-info { flex: 1; min-width: 0; }
.record-time { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; font-family: "Consolas", monospace; }
.record-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.tag {
  display: inline-block; padding: 2px 10px; border-radius: 10px;
  font-size: 11px; font-weight: 700;
}
.tag-family { background: rgba(57,255,20,0.15); color: var(--green); border: 1px solid rgba(57,255,20,0.4); }
.tag-courier { background: rgba(255,193,7,0.15); color: var(--yellow); border: 1px solid rgba(255,193,7,0.4); }
.tag-stranger { background: rgba(255,82,82,0.15); color: var(--red); border: 1px solid rgba(255,82,82,0.4); }
.tag-regular { background: rgba(0,176,255,0.15); color: var(--cyan); border: 1px solid rgba(0,176,255,0.4); }
.no-records { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 14px; }
.no-records svg { width: 48px; height: 48px; margin: 0 auto 10px; opacity: 0.3; display: block; }

/* 详情弹窗 */
.detail-modal {
  display: none; position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.8); align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
}
.detail-modal.show { display: flex; }
.detail-box {
  background: linear-gradient(135deg, #132f4c, #0a1929);
  border: 2px solid var(--cyan); border-radius: 16px;
  padding: 30px; max-width: 460px; width: 90%;
  animation: modalIn 0.4s cubic-bezier(0.2,1.5,0.4,1);
  position: relative;
}
@keyframes modalIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.detail-box h3 {
  color: var(--cyan-light); font-size: 20px;
  margin-bottom: 18px; text-align: center; letter-spacing: 3px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.detail-box h3::before, .detail-box h3::after {
  content: ''; flex: 1; height: 1px; max-width: 60px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
}
.detail-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid rgba(0,176,255,0.1);
  font-size: 14px;
}
.detail-row:last-child { border-bottom: none; }
.detail-row .label { color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
.detail-row .label svg { width: 14px; height: 14px; }
.detail-row .value { color: var(--text); font-weight: 600; }
.confidence-bar {
  width: 80px; height: 6px; background: rgba(0,176,255,0.1);
  border-radius: 3px; overflow: hidden; margin-top: 4px;
}
.confidence-bar > div { height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); border-radius: 3px; }
.close-modal {
  display: block; margin: 22px auto 0;
  padding: 10px 32px;
  background: linear-gradient(135deg, var(--cyan), var(--cyan-light));
  border: none; border-radius: 22px;
  color: var(--bg-1); cursor: pointer; font-size: 14px; font-weight: 700;
  letter-spacing: 2px; transition: all 0.2s;
  font-family: inherit;
}
.close-modal:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,176,255,0.4); }
</style>
</head>
<body>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<div class="container">
  <div class="header">
    <div class="logo-wrap">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1c-4.97 0-9 4.03-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-4v8h3c1.66 0 3-1.34 3-3v-7c0-4.97-4.03-9-9-9z"/></svg>
      </div>
      <div class="logo-text">
        <h1>叮咚眼 · AI 智能门铃</h1>
        <p>SMART DOORBELL · VISION AI</p>
      </div>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      在线监控中
    </div>
  </div>

  <div class="main-grid">
    <div class="camera-area">
      <div class="camera-feed">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="hud-info">
          <div><span class="rec">REC</span> CAM_01 · 4K</div>
          <div id="hudTime">--:--:--</div>
        </div>
        <div class="ai-result" id="aiResult">
          <div class="ai-title">⚡ AI 识别结果</div>
          <div class="ai-row"><span class="k">访客</span><span class="v" id="aiName">--</span></div>
          <div class="ai-row"><span class="k">类型</span><span class="v" id="aiType">--</span></div>
          <div class="ai-row"><span class="k">置信度</span><span class="v" id="aiConf">--%</span></div>
          <div class="ai-row"><span class="k">停留</span><span class="v" id="aiStay">--s</span></div>
        </div>
        <div class="scanlines"></div>
        <div class="scan-bar"></div>
        <div class="visitor-scene" id="visitorScene">
          <svg width="120" height="180" viewBox="0 0 120 180" id="visitorSvg">
            <circle cx="60" cy="40" r="28" fill="none" stroke="#00b0ff" stroke-width="2.5"/>
            <path d="M20,180 Q20,90 60,90 Q100,90 100,180" fill="none" stroke="#00b0ff" stroke-width="2.5"/>
          </svg>
          <div class="visitor-label" id="visitorLabel">
            <span class="dot"></span>
            <span id="visitorLabelText">访客</span>
          </div>
        </div>
        <div class="hud-bottom">
          <span>◉ RES: 1080P</span>
          <span id="hudDate">----/--/--</span>
          <span>◉ FPS: 30</span>
        </div>
      </div>
    </div>

    <div class="doorbell-panel">
      <h3>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        门 铃
      </h3>
      <div class="doorbell-btn" id="doorbellBtn">
        <span class="pulse-ring"></span>
        <span class="pulse-ring"></span>
        <span class="pulse-ring"></span>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        叮咚
      </div>
      <div class="btn-hint">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        点击模拟访客按铃
      </div>
      <div class="doorbell-stats">
        <div class="stat-mini"><div class="num" id="todayCount">0</div><div class="lbl">今日访客</div></div>
        <div class="stat-mini"><div class="num" id="aiCount">0</div><div class="lbl">AI 识别</div></div>
      </div>
    </div>
  </div>

  <div class="records-section">
    <div class="records-header">
      <h3>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
        访客记录
      </h3>
      <div class="record-count">共 <strong id="recordCount">0</strong> 条</div>
    </div>
    <div class="filter-tags" id="filterTags">
      <div class="filter-tag active" data-filter="all">全部</div>
      <div class="filter-tag" data-filter="family">家人</div>
      <div class="filter-tag" data-filter="courier">快递</div>
      <div class="filter-tag" data-filter="regular">常客</div>
      <div class="filter-tag" data-filter="stranger">陌生人</div>
    </div>
    <div class="records-list" id="recordsList">
      <div class="no-records" id="noRecords">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
        暂无访客记录，点击右上角门铃模拟
      </div>
    </div>
  </div>
</div>

<div class="detail-modal" id="detailModal">
  <div class="detail-box">
    <h3>访客详情</h3>
    <div id="detailContent"></div>
    <button class="close-modal" onclick="closeDetail()">关闭</button>
  </div>
</div>

<script>
const visitorTypes = [
  { type: 'family', label: '家人', color: '#39ff14' },
  { type: 'courier', label: '快递员', color: '#ffc107' },
  { type: 'stranger', label: '陌生人', color: '#ff5252' },
  { type: 'regular', label: '常客', color: '#00b0ff' }
];
const visitorNames = {
  family: ['爸爸', '妈妈', '爷爷', '奶奶', '孩子'],
  courier: ['顺丰小哥', '京东快递', '外卖骑手', '邮政'],
  stranger: ['未知访客', '推销人员', '陌生人'],
  regular: ['邻居王叔', '物业小李', '常客张姐']
};
let records = [];
let currentFilter = 'all';
let todayCount = 0, aiCount = 0;

function updateTime() {
  const now = new Date();
  const t = now.toLocaleTimeString('zh-CN', { hour12: false });
  const d = now.toLocaleDateString('zh-CN');
  document.getElementById('hudTime').textContent = t;
  document.getElementById('hudDate').textContent = d;
}
setInterval(updateTime, 1000);
updateTime();

const btn = document.getElementById('doorbellBtn');
btn.addEventListener('click', function() {
  btn.classList.add('ringing');
  setTimeout(function() { btn.classList.remove('ringing'); }, 4000);
  setTimeout(simulateVisitor, 800);
});

function simulateVisitor() {
  const vt = visitorTypes[Math.floor(Math.random() * visitorTypes.length)];
  const name = visitorNames[vt.type][Math.floor(Math.random() * visitorNames[vt.type].length)];
  const scene = document.getElementById('visitorScene');
  const svg = document.getElementById('visitorSvg');
  const label = document.getElementById('visitorLabel');
  const labelText = document.getElementById('visitorLabelText');
  const aiResult = document.getElementById('aiResult');
  labelText.textContent = vt.label;
  label.style.color = vt.color;
  label.style.borderColor = vt.color;
  label.style.background = 'rgba(0,0,0,0.3)';
  svg.querySelectorAll('circle, path').forEach(function(el) {
    el.setAttribute('stroke', vt.color);
  });
  scene.classList.add('show');

  // AI 识别结果
  const confidence = 85 + Math.floor(Math.random() * 15);
  const stay = 5 + Math.floor(Math.random() * 30);
  document.getElementById('aiName').textContent = name;
  document.getElementById('aiName').style.color = vt.color;
  document.getElementById('aiType').textContent = vt.label;
  document.getElementById('aiType').style.color = vt.color;
  document.getElementById('aiConf').textContent = confidence + '%';
  document.getElementById('aiStay').textContent = stay + 's';
  aiResult.style.borderColor = vt.color;
  aiResult.classList.add('show');

  setTimeout(function() { scene.classList.remove('show'); aiResult.classList.remove('show'); }, 3500);
  addRecord(vt, name, confidence, stay);
}

function addRecord(vt, name, confidence, stay) {
  const now = new Date();
  const time = now.toLocaleTimeString('zh-CN', { hour12: false });
  const date = now.toLocaleDateString('zh-CN');
  const record = {
    id: Date.now() + Math.random(),
    type: vt.type, label: vt.label, name: name, color: vt.color,
    time: time, date: date, confidence: confidence, stay: stay
  };
  records.unshift(record);
  todayCount++;
  aiCount++;
  document.getElementById('todayCount').textContent = todayCount;
  document.getElementById('aiCount').textContent = aiCount;
  renderRecords();
}

function renderRecords() {
  const list = document.getElementById('recordsList');
  const noRecords = document.getElementById('noRecords');
  document.getElementById('recordCount').textContent = records.length;
  const filtered = currentFilter === 'all' ? records : records.filter(function(r) { return r.type === currentFilter; });
  if (filtered.length === 0) {
    list.innerHTML = '<div class="no-records"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>' +
      (records.length === 0 ? '暂无访客记录，点击右上角门铃模拟' : '该类型暂无记录') + '</div>';
    return;
  }
  list.innerHTML = filtered.map(function(r) {
    return '<div class="record-item" onclick="showDetail(' + r.id + ')">' +
      '<div class="record-avatar" style="border-color:' + r.color + '">' +
      '<svg width="28" height="28" viewBox="0 0 28 28">' + getAvatarSvg(r.type, r.color) + '</svg>' +
      '</div>' +
      '<div class="record-info">' +
      '<div class="record-time">' + r.date + ' ' + r.time + '</div>' +
      '<div class="record-name">' + r.name + '<span class="tag tag-' + r.type + '">' + r.label + '</span></div>' +
      '</div></div>';
  }).join('');
}

function getAvatarSvg(type, color) {
  if (type === 'family') return '<circle cx="14" cy="11" r="6" fill="none" stroke="' + color + '" stroke-width="1.5"/><path d="M3,26 Q3,16 14,16 Q25,16 25,26" fill="none" stroke="' + color + '" stroke-width="1.5"/>';
  if (type === 'courier') return '<rect x="6" y="5" width="16" height="16" fill="none" stroke="' + color + '" stroke-width="1.5" rx="2"/><path d="M3,26 L25,26" stroke="' + color + '" stroke-width="1.5"/><circle cx="14" cy="13" r="2" fill="' + color + '"/>';
  if (type === 'stranger') return '<polygon points="14,4 24,22 4,22" fill="none" stroke="' + color + '" stroke-width="1.5"/><line x1="14" y1="11" x2="14" y2="16" stroke="' + color + '" stroke-width="1.5"/><circle cx="14" cy="18" r="1" fill="' + color + '"/>';
  if (type === 'regular') return '<polygon points="14,4 24,14 14,24 4,14" fill="none" stroke="' + color + '" stroke-width="1.5"/>';
  return '';
}

function showDetail(id) {
  const r = records.find(function(x) { return x.id == id; });
  if (!r) return;
  const content = document.getElementById('detailContent');
  content.innerHTML =
    '<div class="detail-row"><span class="label"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>访客</span><span class="value">' + r.name + '</span></div>' +
    '<div class="detail-row"><span class="label"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l-5.5 9h11z"/></svg>类型</span><span class="value" style="color:' + r.color + '">' + r.label + '</span></div>' +
    '<div class="detail-row"><span class="label"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19a2 2 0 002 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>日期</span><span class="value">' + r.date + '</span></div>' +
    '<div class="detail-row"><span class="label"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>时间</span><span class="value">' + r.time + '</span></div>' +
    '<div class="detail-row"><span class="label"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>AI置信度</span><span class="value">' + r.confidence + '%<div class="confidence-bar"><div style="width:' + r.confidence + '%"></div></div></span></div>' +
    '<div class="detail-row"><span class="label"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8z"/></svg>停留时长</span><span class="value">' + r.stay + ' 秒</span></div>' +
    '<div class="detail-row"><span class="label"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>截图状态</span><span class="value">已保存</span></div>';
  document.getElementById('detailModal').classList.add('show');
}
function closeDetail() {
  document.getElementById('detailModal').classList.remove('show');
}

document.querySelectorAll('.filter-tag').forEach(function(tag) {
  tag.addEventListener('click', function() {
    document.querySelectorAll('.filter-tag').forEach(function(t) { t.classList.remove('active'); });
    tag.classList.add('active');
    currentFilter = tag.dataset.filter;
    renderRecords();
  });
});

window.showDetail = showDetail;
window.closeDetail = closeDetail;
</script>
</body>
</html>
