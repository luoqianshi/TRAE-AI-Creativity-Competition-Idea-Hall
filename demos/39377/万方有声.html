<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>万方有声 - 中国地名诗意地图</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
/* ===== 全局变量 ===== */
:root {
    --ink-black: #1a1a1a;
    --ink-dark: #2d2d2d;
    --paper-white: #faf8f3;
    --paper-warm: #f5f0e8;
    --cinnabar: #c45c48;
    --cinnabar-light: #e8a598;
    --verdigris: #5a8a7a;
    --verdigris-light: #a8c9bd;
    --gold: #c9a84c;
    --gold-light: #e8d9a0;
    --shadow-soft: rgba(0,0,0,0.08);
    --shadow-medium: rgba(0,0,0,0.15);
    --font-display: 'Ma Shan Zheng', cursive;
    --font-serif: 'Noto Serif SC', 'SimSun', serif;
    --font-body: 'ZCOOL XiaoWei', 'Microsoft YaHei', sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: var(--font-body);
    background: var(--paper-white);
    color: var(--ink-black);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

/* ===== 启动页 ===== */
.splash-screen {
    position: fixed;
    inset: 0;
    background: var(--paper-white);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.8s ease, visibility 0.8s ease;
}

.splash-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.splash-content {
    text-align: center;
    animation: splashFadeIn 1s ease;
}

@keyframes splashFadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.splash-ink {
    width: 80px;
    height: 80px;
    margin: 0 auto 24px;
    background: var(--ink-black);
    border-radius: 50% 40% 55% 45%;
    animation: inkSpread 2s ease-in-out infinite alternate;
}

@keyframes inkSpread {
    0% { border-radius: 50% 40% 55% 45%; transform: scale(1); }
    100% { border-radius: 45% 55% 40% 60%; transform: scale(1.05); }
}

.splash-title {
    font-family: var(--font-display);
    font-size: 48px;
    color: var(--ink-black);
    margin-bottom: 12px;
    letter-spacing: 8px;
}

.splash-subtitle {
    font-family: var(--font-serif);
    font-size: 16px;
    color: var(--ink-dark);
    opacity: 0.7;
    letter-spacing: 4px;
}

.splash-loading {
    margin-top: 32px;
}

.ink-drop {
    width: 12px;
    height: 12px;
    background: var(--cinnabar);
    border-radius: 50%;
    margin: 0 auto;
    animation: inkDrop 1.5s ease-in-out infinite;
}

@keyframes inkDrop {
    0%, 100% { transform: translateY(0); opacity: 1; }
    50% { transform: translateY(20px); opacity: 0.3; }
}

/* ===== 主应用 ===== */
.app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.app.hidden {
    display: none;
}

/* ===== 头部 ===== */
.app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--paper-white);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    backdrop-filter: blur(10px);
}

.header-brand {
    display: flex;
    align-items: center;
    gap: 8px;
}

.header-icon {
    font-size: 24px;
}

.header-title {
    font-family: var(--font-display);
    font-size: 22px;
    color: var(--ink-black);
}

.header-nav {
    display: flex;
    gap: 4px;
}

.nav-btn {
    padding: 6px 16px;
    border: none;
    background: transparent;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink-dark);
    opacity: 0.6;
    cursor: pointer;
    border-radius: 20px;
    transition: all 0.3s ease;
}

.nav-btn:hover {
    opacity: 0.9;
    background: var(--paper-warm);
}

.nav-btn.active {
    opacity: 1;
    background: var(--ink-black);
    color: var(--paper-white);
}

/* ===== 页面 ===== */
.page {
    display: none;
    flex: 1;
    animation: pageIn 0.4s ease;
}

.page.active {
    display: block;
}

@keyframes pageIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ===== 地图页 ===== */
.map-container {
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
}

.map-title {
    text-align: center;
    margin-bottom: 20px;
}

.map-title h2 {
    font-family: var(--font-display);
    font-size: 24px;
    color: var(--ink-black);
    margin-bottom: 6px;
}

.map-title p {
    font-family: var(--font-serif);
    font-size: 13px;
    color: var(--ink-dark);
    opacity: 0.6;
}

.china-map-wrapper {
    position: relative;
    background: var(--paper-warm);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 4px 20px var(--shadow-soft);
}

#china-map {
    width: 100%;
    height: auto;
}

.province {
    fill: var(--paper-white);
    stroke: var(--ink-dark);
    stroke-width: 0.8;
    stroke-opacity: 0.2;
    cursor: pointer;
    transition: all 0.3s ease;
}

.province:hover {
    fill: var(--verdigris-light);
    stroke-opacity: 0.5;
    filter: drop-shadow(0 2px 4px var(--shadow-soft));
}

.province.active {
    fill: var(--verdigris);
    stroke: var(--verdigris);
    stroke-opacity: 0.8;
}

.province-label {
    font-family: var(--font-body);
    font-size: 10px;
    fill: var(--ink-dark);
    opacity: 0.7;
    text-anchor: middle;
    pointer-events: none;
}

.province-label-small {
    font-family: var(--font-body);
    font-size: 8px;
    fill: var(--ink-dark);
    opacity: 0.6;
    text-anchor: middle;
    pointer-events: none;
}

/* ===== 搜索页 ===== */
.search-container {
    padding: 40px 20px;
    max-width: 720px;
    margin: 0 auto;
}

.search-box-large {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
}

.search-box-large input {
    flex: 1;
    padding: 14px 20px;
    border: 2px solid rgba(0,0,0,0.1);
    border-radius: 12px;
    font-family: var(--font-body);
    font-size: 16px;
    background: var(--paper-white);
    transition: border-color 0.3s;
}

.search-box-large input:focus {
    outline: none;
    border-color: var(--verdigris);
}

.search-btn {
    padding: 14px 20px;
    border: none;
    background: var(--ink-black);
    color: var(--paper-white);
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.2s;
}

.search-btn:hover {
    background: var(--ink-dark);
}

.search-suggestions {
    background: var(--paper-white);
    border-radius: 12px;
    box-shadow: 0 4px 20px var(--shadow-soft);
    overflow: hidden;
    margin-bottom: 24px;
}

.suggestion-item {
    padding: 12px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: background 0.2s;
    border-bottom: 1px solid rgba(0,0,0,0.04);
}

.suggestion-item:hover {
    background: var(--paper-warm);
}

.suggestion-item:last-child {
    border-bottom: none;
}

.suggestion-name {
    font-family: var(--font-display);
    font-size: 16px;
    color: var(--ink-black);
}

.suggestion-province {
    font-size: 12px;
    color: var(--ink-dark);
    opacity: 0.5;
}

.hot-places h3 {
    font-family: var(--font-display);
    font-size: 18px;
    margin-bottom: 12px;
    color: var(--ink-black);
}

.hot-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.hot-tag {
    padding: 8px 18px;
    background: var(--paper-warm);
    border-radius: 20px;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink-dark);
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid rgba(0,0,0,0.06);
}

.hot-tag:hover {
    background: var(--cinnabar);
    color: var(--paper-white);
    border-color: var(--cinnabar);
}

/* ===== 收藏页 ===== */
.favorites-container {
    padding: 20px;
    max-width: 720px;
    margin: 0 auto;
}

.favorites-container h2 {
    font-family: var(--font-display);
    font-size: 24px;
    margin-bottom: 20px;
}

.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-dark);
    opacity: 0.5;
}

.empty-icon {
    font-size: 48px;
    margin-bottom: 16px;
}

.empty-hint {
    font-size: 13px;
    margin-top: 8px;
}

.favorite-card {
    background: var(--paper-warm);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.favorite-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px var(--shadow-soft);
}

.favorite-info h4 {
    font-family: var(--font-display);
    font-size: 18px;
    margin-bottom: 4px;
}

.favorite-info p {
    font-size: 13px;
    opacity: 0.6;
}

.favorite-remove {
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    font-size: 18px;
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.2s;
}

.favorite-remove:hover {
    opacity: 1;
    color: var(--cinnabar);
}

/* ===== 诗意卡片弹窗 ===== */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
}

.modal.active {
    opacity: 1;
    visibility: visible;
}

.modal-content {
    background: var(--paper-white);
    border-radius: 20px;
    max-width: 720px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    animation: modalIn 0.3s ease;
}

@keyframes modalIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

.modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border: none;
    background: var(--paper-warm);
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
}

.modal-close:hover {
    background: var(--cinnabar-light);
}

.poetry-card-body {
    padding: 40px 28px 28px;
}

.card-header {
    text-align: center;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
}

.card-place-name {
    font-family: var(--font-display);
    font-size: 36px;
    color: var(--ink-black);
    margin-bottom: 4px;
}

.card-place-alias {
    font-family: var(--font-serif);
    font-size: 14px;
    color: var(--cinnabar);
    opacity: 0.8;
}

.card-section {
    margin-bottom: 24px;
}

.card-section-title {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--ink-black);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.card-section-content {
    font-family: var(--font-serif);
    font-size: 15px;
    line-height: 1.8;
    color: var(--ink-dark);
}

.card-poem-item {
    background: var(--paper-warm);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 12px;
    border-left: 3px solid var(--verdigris);
    position: relative;
}

.card-poem-text {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--ink-black);
    line-height: 1.6;
    margin-bottom: 8px;
}

.card-poem-author {
    font-family: var(--font-serif);
    font-size: 13px;
    color: var(--ink-dark);
    opacity: 0.6;
}

.poem-read-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    border: none;
    background: var(--paper-white);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    box-shadow: 0 2px 6px var(--shadow-soft);
    z-index: 2;
}

.poem-read-btn:hover {
    background: var(--cinnabar);
    color: var(--paper-white);
}

.card-figure-item {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(0,0,0,0.04);
}

.card-figure-item:last-child {
    border-bottom: none;
}

.card-figure-avatar {
    width: 40px;
    height: 40px;
    background: var(--verdigris-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--verdigris);
    flex-shrink: 0;
}

.card-figure-text {
    flex: 1;
}

.card-figure-name {
    font-family: var(--font-display);
    font-size: 16px;
    margin-bottom: 4px;
}

.card-figure-story {
    font-family: var(--font-serif);
    font-size: 13px;
    color: var(--ink-dark);
    opacity: 0.7;
    line-height: 1.6;
}

.card-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(0,0,0,0.06);
}

.btn-primary {
    flex: 1;
    padding: 12px 20px;
    border: none;
    background: var(--ink-black);
    color: var(--paper-white);
    border-radius: 12px;
    font-family: var(--font-body);
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.btn-primary:hover {
    background: var(--ink-dark);
}

.btn-secondary {
    flex: 1;
    padding: 12px 20px;
    border: 1.5px solid var(--ink-black);
    background: transparent;
    color: var(--ink-black);
    border-radius: 12px;
    font-family: var(--font-body);
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.btn-secondary:hover {
    background: var(--ink-black);
    color: var(--paper-white);
}

.btn-favorite {
    width: 44px;
    height: 44px;
    border: 1.5px solid var(--cinnabar);
    background: transparent;
    color: var(--cinnabar);
    border-radius: 12px;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-favorite:hover,
.btn-favorite.active {
    background: var(--cinnabar);
    color: var(--paper-white);
}

.share-hint {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--paper-warm);
    border-radius: 10px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--ink-dark);
    opacity: 0.7;
}

.share-hint-icon {
    font-size: 16px;
}

/* ===== 海报弹窗 ===== */
.poster-modal-content {
    text-align: center;
    padding: 20px;
}

.poster-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.poster-header h3 {
    font-family: var(--font-display);
    font-size: 20px;
}

.poster-style-selector {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
}

.style-btn {
    padding: 8px 16px;
    border: 1.5px solid var(--ink-dark);
    background: transparent;
    color: var(--ink-dark);
    border-radius: 20px;
    font-family: var(--font-body);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
}

.style-btn:hover {
    background: var(--paper-warm);
}

.style-btn.active {
    background: var(--ink-black);
    color: var(--paper-white);
    border-color: var(--ink-black);
}

#poster-canvas {
    max-width: 100%;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 4px 20px var(--shadow-soft);
}

.poster-actions {
    margin-top: 16px;
}

/* ===== 诗词飘落动画 ===== */
.poetry-fall-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    overflow: hidden;
}

.falling-poem {
    position: absolute;
    font-family: var(--font-display);
    color: var(--ink-black);
    opacity: 0;
    white-space: nowrap;
    animation: fallEnhanced linear forwards;
    pointer-events: none;
}

@keyframes fallEnhanced {
    0% {
        transform: translateY(-80px) rotate(var(--fall-rotate, 0deg));
        opacity: 0;
    }
    10% {
        opacity: var(--fall-opacity, 0.15);
    }
    85% {
        opacity: var(--fall-opacity, 0.15);
    }
    100% {
        transform: translateY(100vh) rotate(var(--fall-rotate-end, 360deg));
        opacity: 0;
    }
}

/* ===== Toast ===== */
.toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink-black);
    color: var(--paper-white);
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    z-index: 400;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* ===== 迷你播放器栏 ===== */
.mini-player {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: var(--ink-black);
    color: var(--paper-white);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    z-index: 500;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
}

.mini-player.visible {
    transform: translateY(0);
}

.player-btn {
    width: 36px;
    height: 36px;
    border: 2px solid var(--paper-white);
    background: transparent;
    border-radius: 50%;
    color: var(--paper-white);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
}

.player-btn:hover {
    background: var(--paper-white);
    color: var(--ink-black);
}

.player-info {
    flex: 1;
    min-width: 0;
}

.player-place-name {
    font-family: var(--font-display);
    font-size: 15px;
    color: var(--paper-white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-music-name {
    font-family: var(--font-serif);
    font-size: 12px;
    color: var(--gold-light);
    opacity: 0.8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-close {
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    color: var(--paper-white);
    opacity: 0.5;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s;
}

.player-close:hover {
    opacity: 1;
}

.player-waves {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 20px;
}

.player-wave-bar {
    width: 3px;
    background: var(--gold);
    border-radius: 2px;
    animation: playerWave 0.8s ease-in-out infinite alternate;
}

.player-wave-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
.player-wave-bar:nth-child(2) { height: 14px; animation-delay: 0.15s; }
.player-wave-bar:nth-child(3) { height: 10px; animation-delay: 0.3s; }
.player-wave-bar:nth-child(4) { height: 16px; animation-delay: 0.45s; }
.player-wave-bar:nth-child(5) { height: 6px; animation-delay: 0.6s; }

@keyframes playerWave {
    0% { transform: scaleY(0.4); }
    100% { transform: scaleY(1); }
}

.mini-player.paused .player-wave-bar {
    animation-play-state: paused;

const provinceMap = {};
placeData.forEach(item => { provinceMap[item.province] = item; });

function searchPlaces(query) {
    if (!query) return [];
    const q = query.toLowerCase();
    return placeData.filter(p =>
        p.city.includes(query) || p.alias.includes(query) ||
        p.province.includes(query) || p.city.toLowerCase().includes(q) ||
        p.author.includes(query) || p.poem.includes(query)
    );
}

function getPlaceData(name) {
    return placeData.find(p => p.city === name || p.province === name);
}

document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
        document.getElementById('splash-screen').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        startPoetryFall();
    }, 2500);
    applyRegionColors();
    if (window.speechSynthesis) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.addEventListener('voiceschanged', () => { window.speechSynthesis.getVoices(); });
    }
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const page = btn.dataset.page;
            switchPage(page);
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });
    document.querySelectorAll('.province').forEach(province => {
        province.addEventListener('click', (e) => {
            e.stopPropagation();
            const provinceName = province.dataset.name;
            const data = provinceMap[provinceName];
            if (data) {
                showPoetryCard(data);
                document.querySelectorAll('.province').forEach(p => p.classList.remove('active'));
                province.classList.add('active');
                showMiniPlayer(provinceName);
            } else { showToast('该地区数据收集中~'); }
        });
    });
    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input', (e) => { showSearchSuggestions(e.target.value); });
    searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.province') && !e.target.closest('.modal') && !e.target.closest('.mini-player'))
            document.querySelectorAll('.province').forEach(p => p.classList.remove('active'));
    });
});

function applyRegionColors() {
    document.querySelectorAll('.province').forEach(province => {
        const name = province.dataset.name;
        for (const [region, provinces] of Object.entries(regionMap)) {
            if (provinces.includes(name)) { province.classList.add(region); break; }
        }
    });
}

function showMiniPlayer(provinceName) {
    const player = document.getElementById('mini-player');
    const musicInfo = provinceMusic[provinceName] || { name: '地方民谣', desc: '华夏大地' };
    document.getElementById('player-place-name').textContent = provinceName;
    document.getElementById('player-music-name').textContent = musicInfo.name + ' · ' + musicInfo.desc;
    player.classList.add('visible');
    player.classList.remove('paused');
    isPlayerPlaying = true;
}

function togglePlayer() {
    const player = document.getElementById('mini-player');
    if (isPlayerPlaying) { player.classList.add('paused'); isPlayerPlaying = false; }
    else { player.classList.remove('paused'); isPlayerPlaying = true; }
}

function closeMiniPlayer() {
    document.getElementById('mini-player').classList.remove('visible');
    isPlayerPlaying = false;
}

function switchPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

function readPoem(poemIndex) {
    if (!currentPlace) return;
    const poem = currentPlace.poem;
    const btn = document.querySelector('#poem-item-' + poemIndex + ' .poem-read-btn');
    if (window.speechSynthesis.speaking) { window.speechSynthesis.cancel(); if (btn) btn.classList.remove('reading'); return; }
    if (btn) btn.classList.add('reading');
    const utterance = new SpeechSynthesisUtterance(poem);
    utterance.lang = 'zh-CN'; utterance.rate = 0.8; utterance.pitch = 1.0;
    const voices = window.speechSynthesis.getVoices();
    const chineseVoice = voices.find(v => v.lang.includes('zh'));
    if (chineseVoice) utterance.voice = chineseVoice;
    utterance.onend = () => { if (btn) btn.classList.remove('reading'); };
    utterance.onerror = () => { if (btn) btn.classList.remove('reading'); };
    window.speechSynthesis.speak(utterance);
}

const FAVORITES_KEY = 'wanfang_favorites';
function getFavorites() { try { return JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]'); } catch(e) { return []; } }
function addFavorite(n) { const f = getFavorites(); if (!f.includes(n)) { f.push(n); localStorage.setItem(FAVORITES_KEY, JSON.stringify(f)); } }
function removeFavorite(n) { const f = getFavorites(); const i = f.indexOf(n); if (i > -1) { f.splice(i, 1); localStorage.setItem(FAVORITES_KEY, JSON.stringify(f)); } }
function isFavorite(n) { return getFavorites().includes(n); }
function toggleFavorite() {
    if (!currentPlace) return;
    const btn = document.getElementById('fav-btn');
    const fav = isFavorite(currentPlace.province);
    if (fav) { removeFavorite(currentPlace.province); btn.innerHTML = '&#x2661;'; btn.classList.remove('active'); showToast('已取消收藏'); }
    else { addFavorite(currentPlace.province); btn.innerHTML = '&#x2764;'; btn.classList.add('active'); showToast('已收藏'); }
}
function renderFavorites() {
    const container = document.getElementById('favorites-list');
    const favs = getFavorites();
    if (favs.length === 0) { container.innerHTML = '<div class="empty-state"><div class="empty-icon">&#x1F4DC;</div><p>还没有收藏任何地名</p><p class="empty-hint">在地图或搜索中点击&#x2764;收藏</p></div>'; return; }
    container.innerHTML = favs.map(provName => { const place = provinceMap[provName]; if (!place) return ''; return '<div class="favorite-card" onclick="showPoetryCard(provinceMap[' + "'" + provName + "'" + '])"><div class="favorite-info"><h4>' + place.city + '</h4><p>' + place.province + ' · ' + place.alias + '</p></div><button class="favorite-remove" onclick="event.stopPropagation(); removeFav(' + "'" + provName + "'" + ')">&#x2715;</button></div>'; }).join('');
}
function removeFav(name) { removeFavorite(name); renderFavorites(); showToast('已取消收藏'); }

function showSearchSuggestions(query) {
    const container = document.getElementById('search-suggestions');
    if (!query) { container.innerHTML = ''; return; }
    const results = searchPlaces(query);
    if (results.length === 0) { container.innerHTML = '<div class="suggestion-item"><span class="suggestion-name">未找到相关地名</span></div>'; return; }
    container.innerHTML = results.slice(0, 8).map(place => '<div class="suggestion-item" data-province="' + place.province + '"><span class="suggestion-name">' + place.city + '（' + place.province + '）</span><span class="suggestion-province">' + place.alias + '</span></div>').join('');
    container.querySelectorAll('.suggestion-item[data-province]').forEach(item => {
        item.addEventListener('click', () => { const data = provinceMap[item.dataset.province]; if (data) showPoetryCard(data); container.innerHTML = ''; });
    });
}
function performSearch() {
    const query = document.getElementById('search-input').value.trim();
    if (!query) return;
    const results = searchPlaces(query);
    if (results.length > 0) { showPoetryCard(results[0]); document.getElementById('search-suggestions').innerHTML = ''; }
    else showToast('未找到该地名，试试其他~');
}
function quickSearch(name) {
    document.getElementById('search-input').value = name;
    document.getElementById('search-suggestions').innerHTML = '';
    const place = getPlaceData(name);
    if (place) showPoetryCard(place);
}

function showPoster() { if (!currentPlace) return; document.getElementById('poster-modal').classList.add('active'); setTimeout(generatePoster, 100); }
let currentPosterStyle = 'classic';
function switchPosterStyle(style) {
    currentPosterStyle = style;
    document.querySelectorAll('.style-btn').forEach(btn => { btn.classList.remove('active'); if (btn.dataset.style === style) btn.classList.add('active'); });
    generatePoster();
}
function closePoster() { document.getElementById('poster-modal').classList.remove('active'); }
function generatePoster() {
    const canvas = document.getElementById('poster-canvas');
    const ctx = canvas.getContext('2d');
    if (currentPosterStyle === 'classic') generateClassicPoster(ctx, canvas, currentPlace);
    else if (currentPosterStyle === 'dark') generateDarkPoster(ctx, canvas, currentPlace);
    else generateRoundedPoster(ctx, canvas, currentPlace);
}
function generateClassicPoster(ctx, canvas, place) {
    const gradient = ctx.createLinearGradient(0, 0, 600, 800);
    gradient.addColorStop(0, '#faf8f3'); gradient.addColorStop(1, '#f5f0e8');
    ctx.fillStyle = gradient; ctx.fillRect(0, 0, 600, 800);
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2; ctx.strokeRect(20, 20, 560, 760);
    ctx.strokeStyle = '#c45c48'; ctx.lineWidth = 1; ctx.strokeRect(28, 28, 544, 744);
    ctx.fillStyle = '#1a1a1a'; ctx.font = 'bold 24px "Ma Shan Zheng", cursive'; ctx.textAlign = 'center'; ctx.fillText('万方有声', 300, 70);
    ctx.font = '14px "Noto Serif SC", serif'; ctx.fillStyle = '#2d2d2d'; ctx.fillText('每一个地名，都是一首诗', 300, 95);
    ctx.fillStyle = '#1a1a1a'; ctx.font = 'bold 52px "Ma Shan Zheng", cursive'; ctx.fillText(place.city, 300, 170);
    ctx.font = '16px "Noto Serif SC", serif'; ctx.fillStyle = '#c45c48'; ctx.fillText(place.province + ' · ' + place.alias, 300, 200);
    ctx.strokeStyle = '#5a8a7a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(150, 220); ctx.lineTo(450, 220); ctx.stroke();
    ctx.font = 'bold 18px "Ma Shan Zheng", cursive'; ctx.fillStyle = '#1a1a1a'; ctx.textAlign = 'left'; ctx.fillText('地名由来', 60, 260);
    ctx.font = '15px "Noto Serif SC", serif'; ctx.fillStyle = '#2d2d2d'; wrapText(ctx, place.meaning, 60, 290, 480, 24);
    ctx.font = 'bold 18px "Ma Shan Zheng", cursive'; ctx.fillStyle = '#1a1a1a'; ctx.fillText('诗意', 60, 400);
    ctx.font = '20px "Ma Shan Zheng", cursive'; ctx.fillStyle = '#2d2d2d'; const poemY = wrapText(ctx, place.poem, 60, 430, 480, 32);
    ctx.font = '14px "Noto Serif SC", serif'; ctx.fillStyle = '#5a8a7a'; ctx.textAlign = 'right'; ctx.fillText('—— [' + (place.dynasty || '民间') + '] ' + place.author, 540, poemY + 30);
    ctx.textAlign = 'center'; ctx.font = '12px "Noto Serif SC", serif'; ctx.fillStyle = '#999'; ctx.fillText('万方有声 · 中国地名诗意地图', 300, 770);
}
function generateDarkPoster(ctx, canvas, place) {
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 0, 600, 800);
    ctx.strokeStyle = '#c9a84c'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(60, 60); ctx.lineTo(540, 60); ctx.stroke();
    ctx.fillStyle = '#c9a84c'; ctx.font = 'bold 72px "Ma Shan Zheng", cursive'; ctx.textAlign = 'center'; ctx.fillText(place.city, 300, 200);
    ctx.font = '14px "Noto Serif SC", serif'; ctx.fillStyle = '#888'; ctx.fillText(place.province.toUpperCase() + ' · ' + place.alias, 300, 235);
    ctx.strokeStyle = '#c9a84c'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(250, 260); ctx.lineTo(350, 260); ctx.stroke();
    ctx.font = '10px "Noto Serif SC", serif'; ctx.fillStyle = '#666'; ctx.fillText('POETIC PLACE', 300, 280);
    ctx.font = '28px "Ma Shan Zheng", cursive'; ctx.fillStyle = '#e8d9a0'; ctx.textAlign = 'center'; const poemY = wrapTextCenter(ctx, place.poem, 300, 360, 500, 42);
    ctx.font = '13px "Noto Serif SC", serif'; ctx.fillStyle = '#888'; ctx.fillText('[' + (place.dynasty || '民间') + '] ' + place.author, 300, poemY + 35);
    ctx.font = '13px "Noto Serif SC", serif'; ctx.fillStyle = '#aaa'; ctx.textAlign = 'left'; wrapText(ctx, place.meaning, 80, 520, 440, 22);
    ctx.textAlign = 'center'; ctx.font = '11px "Noto Serif SC", serif'; ctx.fillStyle = '#555'; ctx.fillText('万方有声 · 中国地名诗意地图', 300, 740);
    ctx.strokeStyle = '#c9a84c'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(60, 760); ctx.lineTo(540, 760); ctx.stroke();
}
function generateRoundedPoster(ctx, canvas, place) {
    ctx.fillStyle = '#faf8f3'; roundRect(ctx, 20, 20, 560, 760, 30);
    ctx.shadowColor = 'rgba(0,0,0,0.08)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 4; ctx.fillStyle = '#ffffff'; roundRect(ctx, 40, 40, 520, 720, 20); ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#5a8a7a'; roundRectTop(ctx, 40, 40, 520, 180, 20);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 56px "Ma Shan Zheng", cursive'; ctx.textAlign = 'center'; ctx.fillText(place.city, 300, 140);
    ctx.font = '15px "Noto Serif SC", serif'; ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillText(place.province + ' · ' + place.alias, 300, 175);
    ctx.font = 'bold 22px "Ma Shan Zheng", cursive'; ctx.fillStyle = '#1a1a1a'; ctx.textAlign = 'center'; const poemY = wrapTextCenter(ctx, place.poem, 300, 280, 480, 36);
    ctx.font = '13px "Noto Serif SC", serif'; ctx.fillStyle = '#5a8a7a'; ctx.fillText(place.author + ' · ' + (place.dynasty || '民间'), 300, poemY + 25);
    ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(100, poemY + 50); ctx.lineTo(500, poemY + 50); ctx.stroke();
    ctx.font = 'bold 16px "Ma Shan Zheng", cursive'; ctx.fillStyle = '#1a1a1a'; ctx.textAlign = 'left'; ctx.fillText('地名由来', 80, poemY + 85);
    ctx.font = '14px "Noto Serif SC", serif'; ctx.fillStyle = '#555'; wrapText(ctx, place.meaning, 80, poemY + 110, 440, 22);
    ctx.textAlign = 'center'; ctx.font = '12px "Noto Serif SC", serif'; ctx.fillStyle = '#999'; ctx.fillText('万方有声', 300, 720);
}
function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath(); ctx.fill();
}
function roundRectTop(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath(); ctx.fill();
}
function wrapTextCenter(ctx, text, x, y, maxWidth, lineHeight) {
    const chars = text.split(''); let line = '', currentY = y;
    for (let i = 0; i < chars.length; i++) { const testLine = line + chars[i]; if (ctx.measureText(testLine).width > maxWidth && line !== '') { ctx.fillText(line, x, currentY); line = chars[i]; currentY += lineHeight; } else line = testLine; }
    ctx.fillText(line, x, currentY); return currentY;
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    let line = '', currentY = y;
    for (let i = 0; i < text.length; i++) { const testLine = line + text[i]; if (ctx.measureText(testLine).width > maxWidth && line !== '') { ctx.fillText(line, x, currentY); line = text[i]; currentY += lineHeight; } else line = testLine; }
    ctx.fillText(line, x, currentY); return currentY;
}
function downloadPoster() {
    const canvas = document.getElementById('poster-canvas'); const link = document.createElement('a');
    link.download = '万方有声_' + currentPlace.city + '.png'; link.href = canvas.toDataURL('image/png'); link.click(); showToast('海报已下载');
}
function startPoetryFall() {
    const container = document.getElementById('poetry-fall-container');
    const allPoems = placeData.map(p => p.poem);
    const poems = allPoems.length > 10 ? allPoems : [...allPoems, '江南忆，最忆是杭州', '春风得意马蹄疾'];
    function createFallingPoem() {
        const poem = poems[Math.floor(Math.random() * poems.length)];
        const short = poem.split(/[，。、；]/).find(p => p.trim().length >= 4 && p.trim().length <= 12) || poem;
        const el = document.createElement('div'); el.className = 'falling-poem'; el.textContent = short.trim();
        el.style.left = Math.random() * 90 + 5 + '%'; el.style.fontSize = (14 + Math.random() * 10) + 'px';
        el.style.animationDuration = (8 + Math.random() * 6) + 's'; el.style.animationDelay = Math.random() * 2 + 's';
        el.style.setProperty('--fall-rotate', (-15 + Math.random() * 30) + 'deg');
        el.style.setProperty('--fall-opacity', (0.08 + Math.random() * 0.15).toString());
        container.appendChild(el); setTimeout(() => el.remove(), 14000);
    }
    for (let i = 0; i < 5; i++) setTimeout(createFallingPoem, i * 1500);
    setInterval(createFallingPoem, 4000);
}
function showToast(message) {
    const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}
