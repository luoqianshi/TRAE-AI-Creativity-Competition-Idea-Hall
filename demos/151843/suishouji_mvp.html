<body>
  <main class="shell">
    <section class="hero" aria-label="产品概览">
      <div class="brand-card">
        <div class="eyebrow"><span class="dot"></span>最小 MVP 场景原型</div>
        <h1>随手记</h1>
        <p class="subtitle">打开就能记录，记录后能分类，忘记时能搜索，过后能回看。这个 MVP 先验证“生活与工作记忆库”的核心闭环。</p>
        <div class="stats" aria-label="记录统计">
          <div class="stat">
            <strong id="statTotal">0</strong>
            <span>总记录</span>
          </div>
          <div class="stat">
            <strong id="statTodo">0</strong>
            <span>待办未完成</span>
          </div>
          <div class="stat">
            <strong id="statImportant">0</strong>
            <span>重要记忆</span>
          </div>
        </div>
      </div>

      <aside class="quick-card" aria-label="快速随手记">
        <div class="card-title">
          <h2>快速随手记</h2>
          <span class="pill">3 秒记录</span>
        </div>
        <form class="form" id="entryForm">
          <textarea id="content" placeholder="例如：蓝牙耳机放在卧室书桌第三层抽屉；明天 10 点交周报；宝宝今天第一次自己走了 5 步。" required></textarea>
          <div class="row">
            <select id="category" aria-label="选择分类">
              <option value="生活备忘">生活备忘</option>
              <option value="成长瞬间">成长瞬间</option>
              <option value="工作记事">工作记事</option>
              <option value="日常待办">日常待办</option>
            </select>
            <input id="dueDate" type="date" aria-label="待办截止日期" />
          </div>
          <div class="switch-row">
            <label class="check-chip"><input id="isTodo" type="checkbox" />待办事项</label>
            <label class="check-chip"><input id="isImportant" type="checkbox" />重要节点</label>
            <label class="check-chip"><input id="isPractical" type="checkbox" checked />实用备忘</label>
          </div>
          <div class="actions">
            <button class="btn" type="submit">保存记录</button>
            <button class="btn secondary" type="button" id="seedBtn">填入示例</button>
          </div>
        </form>
      </aside>
    </section>

    <section class="grid" aria-label="记录工作台">
      <aside class="sidebar">
        <div class="panel">
          <h2>搜索记录</h2>
          <div class="search-wrap">
            <input id="searchInput" type="search" placeholder="搜索：钥匙、孩子、会议、周报..." />
            <select id="sortSelect" aria-label="排序方式">
              <option value="newest">最新优先</option>
              <option value="oldest">最早优先</option>
            </select>
          </div>
        </div>

        <div class="panel">
          <h2>分类归档</h2>
          <div class="category-list" id="categoryList"></div>
        </div>

        <div class="panel">
          <h2>时光回顾</h2>
          <div class="timebox">
            <strong id="todayTitle">今日回顾</strong>
            <p id="todayMemory">今天还没有记录。先写下一条，给以后的自己回看。</p>
          </div>
        </div>
      </aside>

      <section class="content">
        <div class="toolbar">
          <div class="tabs" aria-label="筛选视图">
            <button class="tab active" type="button" data-filter="all">全部</button>
            <button class="tab" type="button" data-filter="important">重要</button>
            <button class="tab" type="button" data-filter="todo">待办</button>
            <button class="tab" type="button" data-filter="done">已完成</button>
          </div>
          <span class="pill" id="resultCount">0 条记录</span>
        </div>
        <div class="memory-list" id="memoryList"></div>
      </section>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "suishouji_mvp_records";
    const categories = ["全部", "生活备忘", "成长瞬间", "工作记事", "日常待办"];
    const sampleRecords = [
      {
        content: "蓝牙耳机放在卧室书桌第三层抽屉，充电线在旁边的小收纳盒里。",
        category: "生活备忘",
        dueDate: "",
        isTodo: false,
        isImportant: false,
        isPractical: true,
        completed: false
      },
      {
        content: "宝宝今天第一次自己走了 5 步，摇摇晃晃但特别开心。",
        category: "成长瞬间",
        dueDate: "",
        isTodo: false,
        isImportant: true,
        isPractical: false,
        completed: false
      },
      {
        content: "明天上午 10 点前提交周报，补充本周项目风险和下周计划。",
        category: "工作记事",
        dueDate: new Date(Date.now() + 86400000).toISOString().slice(0, 10),
        isTodo: true,
        isImportant: false,
        isPractical: true,
        completed: false
      }
    ];

    let records = loadRecords();
    let activeCategory = "全部";
    let activeFilter = "all";

    const els = {
      form: document.getElementById("entryForm"),
      content: document.getElementById("content"),
      category: document.getElementById("category"),
      dueDate: document.getElementById("dueDate"),
      isTodo: document.getElementById("isTodo"),
      isImportant: document.getElementById("isImportant"),
      isPractical: document.getElementById("isPractical"),
      seedBtn: document.getElementById("seedBtn"),
      searchInput: document.getElementById("searchInput"),
      sortSelect: document.getElementById("sortSelect"),
      categoryList: document.getElementById("categoryList"),
      memoryList: document.getElementById("memoryList"),
      resultCount: document.getElementById("resultCount"),
      statTotal: document.getElementById("statTotal"),
      statTodo: document.getElementById("statTodo"),
      statImportant: document.getElementById("statImportant"),
      todayTitle: document.getElementById("todayTitle"),
      todayMemory: document.getElementById("todayMemory"),
      toast: document.getElementById("toast")
    };

    els.form.addEventListener("submit", (event) => {
      event.preventDefault();
      addRecord();
    });

    els.seedBtn.addEventListener("click", () => {
      const item = sampleRecords[Math.floor(Math.random() * sampleRecords.length)];
      els.content.value = item.content;
      els.category.value = item.category;
      els.dueDate.value = item.dueDate;
      els.isTodo.checked = item.isTodo;
      els.isImportant.checked = item.isImportant;
      els.isPractical.checked = item.isPractical;
      els.content.focus();
    });

    els.searchInput.addEventListener("input", render);
    els.sortSelect.addEventListener("change", render);

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((item) => item.classList.remove("active"));
        tab.classList.add("active");
        activeFilter = tab.dataset.filter;
        render();
      });
    });

    function loadRecords() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (error) {
        return [];
      }
    }

    function saveRecords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function addRecord() {
      const content = els.content.value.trim();
      if (!content) {
        showToast("先写点内容再保存");
        return;
      }

      const record = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        content,
        category: els.category.value,
        dueDate: els.dueDate.value,
        isTodo: els.isTodo.checked,
        isImportant: els.isImportant.checked,
        isPractical: els.isPractical.checked,
        completed: false,
        createdAt: new Date().toISOString()
      };

      records.unshift(record);
      saveRecords();
      els.form.reset();
      els.category.value = "生活备忘";
      els.isPractical.checked = true;
      showToast("记录已保存");
      render();
    }

    function deleteRecord(id) {
      records = records.filter((record) => record.id !== id);
      saveRecords();
      showToast("记录已删除");
      render();
    }

    function toggleDone(id) {
      records = records.map((record) => {
        if (record.id === id) {
          return { ...record, completed: !record.completed, isTodo: true };
        }
        return record;
      });
      saveRecords();
      render();
    }

    function filteredRecords() {
      const keyword = els.searchInput.value.trim().toLowerCase();
      let list = records.filter((record) => {
        const matchCategory = activeCategory === "全部" || record.category === activeCategory;
        const searchable = [
          record.content,
          record.category,
          record.isImportant ? "重要节点" : "",
          record.isTodo ? "待办事项" : "",
          record.isPractical ? "实用备忘" : "",
          record.dueDate || ""
        ].join(" ").toLowerCase();
        const matchKeyword = !keyword || searchable.includes(keyword);
        const matchFilter =
          activeFilter === "all" ||
          (activeFilter === "important" && record.isImportant) ||
          (activeFilter === "todo" && record.isTodo && !record.completed) ||
          (activeFilter === "done" && record.completed);
        return matchCategory && matchKeyword && matchFilter;
      });

      list.sort((a, b) => {
        const left = new Date(a.createdAt).getTime();
        const right = new Date(b.createdAt).getTime();
        return els.sortSelect.value === "oldest" ? left - right : right - left;
      });

      return list;
    }

    function renderCategories() {
      const counts = categories.reduce((acc, category) => {
        acc[category] = category === "全部" ? records.length : records.filter((record) => record.category === category).length;
        return acc;
      }, {});

      els.categoryList.innerHTML = categories.map((category) => `
        <button class="category-btn ${activeCategory === category ? "active" : ""}" type="button" data-category="${category}">
          <span>${category}</span>
          <span>${counts[category]} 条</span>
        </button>
      `).join("");

      els.categoryList.querySelectorAll(".category-btn").forEach((button) => {
        button.addEventListener("click", () => {
          activeCategory = button.dataset.category;
          render();
        });
      });
    }

    function renderStats() {
      els.statTotal.textContent = records.length;
      els.statTodo.textContent = records.filter((record) => record.isTodo && !record.completed).length;
      els.statImportant.textContent = records.filter((record) => record.isImportant).length;
    }

    function renderTodayMemory() {
      const today = new Date();
      const todayMonth = today.getMonth();
      const todayDate = today.getDate();
      const todayItems = records.filter((record) => {
        const date = new Date(record.createdAt);
        return date.getMonth() === todayMonth && date.getDate() === todayDate;
      });

      els.todayTitle.textContent = `今日回顾 · ${todayItems.length} 条`;
      if (!todayItems.length) {
        els.todayMemory.textContent = "今天还没有记录。先写下一条，给以后的自己回看。";
        return;
      }
      const first = todayItems[0];
      els.todayMemory.textContent = `${first.category}：${first.content.slice(0, 46)}${first.content.length > 46 ? "..." : ""}`;
    }

    function renderList() {
      const list = filteredRecords();
      els.resultCount.textContent = `${list.length} 条记录`;

      if (!list.length) {
        els.memoryList.innerHTML = `
          <div class="empty">
            没有找到记录。可以换个关键词，或先在右上方保存一条新的随手记。
          </div>
        `;
        return;
      }

      els.memoryList.innerHTML = list.map((record) => {
        const date = new Date(record.createdAt);
        const day = String(date.getDate()).padStart(2, "0");
        const month = `${date.getMonth() + 1}月`;
        const time = date.toLocaleString("zh-CN", {
          month: "long",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
        const tags = [
          `<span class="tag">${record.category}</span>`,
          record.isImportant ? `<span class="tag important">重要节点</span>` : "",
          record.isTodo ? `<span class="tag todo">${record.completed ? "待办已完成" : "待办未完成"}</span>` : "",
          record.isPractical ? `<span class="tag">实用备忘</span>` : ""
        ].filter(Boolean).join("");

        return `
          <article class="memory-card ${record.completed ? "completed" : ""}">
            <div class="date-badge">
              <strong>${day}</strong>
              <span>${month}</span>
            </div>
            <div class="memory-main">
              <div class="memory-head">
                <div class="memory-meta">${tags}</div>
                <span class="pill">${time}</span>
              </div>
              <p class="memory-text">${escapeHtml(record.content)}</p>
              <div class="memory-extra">
                <span>${record.dueDate ? `截止：${record.dueDate}` : "无截止时间"}</span>
                <div class="mini-actions">
                  <button class="mini ${record.completed ? "done" : ""}" type="button" data-action="done" data-id="${record.id}">
                    ${record.completed ? "恢复待办" : "标记完成"}
                  </button>
                  <button class="mini danger" type="button" data-action="delete" data-id="${record.id}">删除</button>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join("");

      els.memoryList.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", () => {
          const action = button.dataset.action;
          const id = button.dataset.id;
          if (action === "done") toggleDone(id);
          if (action === "delete") deleteRecord(id);
        });
      });
    }

    function render() {
      renderStats();
      renderCategories();
      renderTodayMemory();
      renderList();
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => {
        els.toast.classList.remove("show");
      }, 1800);
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    render();
  </script>
</body>
</html>
