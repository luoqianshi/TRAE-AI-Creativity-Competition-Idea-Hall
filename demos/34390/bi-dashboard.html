<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能数据分析平台 - BI Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #00f2fe; --secondary: #4facfe; --accent: #00ff88;
            --warning: #ff6b6b; --bg-dark: #0a0e27;
            --bg-card: rgba(16, 24, 64, 0.8); --border-glow: rgba(0, 242, 254, 0.3);
            --text-primary: #ffffff; --text-secondary: #8b92a8;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark); color: var(--text-primary);
            min-height: 100vh; overflow-x: hidden;
        }
        .bg-particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4b 50%, #0a0e27 100%);
        }
        .bg-particles::before {
            content: ''; position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background: radial-gradient(circle at 20% 80%, rgba(0,242,254,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(79,172,254,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(0,255,136,0.05) 0%, transparent 50%);
            animation: bgRotate 30s linear infinite;
        }
        @keyframes bgRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .header {
            background: linear-gradient(90deg, transparent, rgba(0,242,254,0.1), transparent);
            padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-glow); position: relative;
        }
        .header::after {
            content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            animation: headerGlow 3s ease-in-out infinite;
        }
        @keyframes headerGlow { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
        .header h1 {
            font-size: 28px; background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; letter-spacing: 4px;
        }
        .header-info { display: flex; gap: 30px; font-size: 14px; color: var(--text-secondary); }
        .header-info span { display: flex; align-items: center; gap: 8px; }
        .header-info .dot {
            width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(0,255,136,0.7); }
            50% { box-shadow: 0 0 0 10px rgba(0,255,136,0); }
        }
        .filters {
            display: flex; gap: 20px; padding: 20px 40px; flex-wrap: wrap;
            animation: slideDown 0.6s ease-out;
        }
        @keyframes slideDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
        .filter-item { display: flex; flex-direction: column; gap: 8px; }
        .filter-item label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        .filter-item select, .filter-item input {
            background: var(--bg-card); border: 1px solid var(--border-glow);
            color: var(--text-primary); padding: 10px 15px; border-radius: 8px;
            font-size: 14px; min-width: 180px; cursor: pointer; transition: all 0.3s;
        }
        .filter-item select:hover, .filter-item input:hover {
            border-color: var(--primary); box-shadow: 0 0 15px rgba(0,242,254,0.3);
        }
        .filter-item select:focus, .filter-item input:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 20px rgba(0,242,254,0.5);
        }
        .kpi-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px; padding: 20px 40px;
        }
        .kpi-card {
            background: var(--bg-card); border: 1px solid var(--border-glow);
            border-radius: 16px; padding: 25px; position: relative; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4,0,0.2,1); animation: cardAppear 0.8s ease-out backwards;
        }
        .kpi-card:nth-child(1) { animation-delay: 0.1s; }
        .kpi-card:nth-child(2) { animation-delay: 0.2s; }
        .kpi-card:nth-child(3) { animation-delay: 0.3s; }
        .kpi-card:nth-child(4) { animation-delay: 0.4s; }
        .kpi-card:nth-child(5) { animation-delay: 0.5s; }
        @keyframes cardAppear { from { opacity:0; transform:translateY(30px) scale(0.95); } to { opacity:1; transform:translateY(0) scale(1); } }
        .kpi-card:hover {
            transform: translateY(-8px); border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0,242,254,0.2);
        }
        .kpi-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,242,254,0.1), transparent);
            transition: left 0.6s;
        }
        .kpi-card:hover::before { left: 100%; }
        .kpi-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .kpi-title { font-size: 14px; color: var(--text-secondary); }
        .kpi-icon {
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .kpi-icon.sales { background: linear-gradient(135deg, #00f2fe, #4facfe); }
        .kpi-icon.profit { background: linear-gradient(135deg, #00ff88, #00d4aa); }
        .kpi-icon.orders { background: linear-gradient(135deg, #ff6b6b, #ff8e53); }
        .kpi-icon.customers { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
        .kpi-icon.products { background: linear-gradient(135deg, #fbc2eb, #a6c1ee); }
        .kpi-value {
            font-size: 32px; font-weight: bold; margin-bottom: 10px;
            background: linear-gradient(90deg, var(--text-primary), var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .kpi-trend { display: flex; align-items: center; gap: 5px; font-size: 13px; }
        .kpi-trend.up { color: var(--accent); }
        .kpi-trend.down { color: var(--warning); }
        .charts-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 20px; padding: 20px 40px;
        }
        .chart-card {
            background: var(--bg-card); border: 1px solid var(--border-glow);
            border-radius: 16px; padding: 20px; position: relative;
            transition: all 0.4s; animation: chartAppear 1s ease-out backwards;
        }
        .chart-card:nth-child(1) { animation-delay: 0.6s; }
        .chart-card:nth-child(2) { animation-delay: 0.7s; }
        .chart-card:nth-child(3) { animation-delay: 0.8s; }
        .chart-card:nth-child(4) { animation-delay: 0.9s; }
        .chart-card:nth-child(5) { animation-delay: 1.0s; }
        .chart-card:nth-child(6) { animation-delay: 1.1s; }
        .chart-card:nth-child(7) { animation-delay: 1.2s; }
        .chart-card:nth-child(8) { animation-delay: 1.3s; }
        @keyframes chartAppear { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
        .chart-card:hover { border-color: var(--primary); box-shadow: 0 10px 30px rgba(0,242,254,0.15); }
        .chart-card.full-width { grid-column: span 3; }
        .chart-card.half-width { grid-column: span 2; }
        .chart-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .chart-title {
            font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px;
        }
        .chart-title::before {
            content: ''; width: 4px; height: 20px;
            background: linear-gradient(180deg, var(--primary), var(--accent)); border-radius: 2px;
        }
        .chart-actions { display: flex; gap: 10px; }
        .chart-btn {
            background: transparent; border: 1px solid var(--border-glow);
            color: var(--text-secondary); padding: 5px 12px; border-radius: 6px;
            font-size: 12px; cursor: pointer; transition: all 0.3s;
        }
        .chart-btn:hover, .chart-btn.active {
            background: var(--primary); color: var(--bg-dark); border-color: var(--primary);
        }
        .chart-container { height: 350px; width: 100%; }
        .chart-container.large { height: 450px; }
        .data-table-container { padding: 20px 40px; animation: chartAppear 1.2s ease-out backwards; }
        .data-table {
            width: 100%; background: var(--bg-card); border: 1px solid var(--border-glow);
            border-radius: 16px; overflow: hidden;
        }
        .data-table table { width: 100%; border-collapse: collapse; }
        .data-table th {
            background: rgba(0,242,254,0.1); padding: 15px 20px; text-align: left;
            font-size: 13px; color: var(--primary); text-transform: uppercase;
            letter-spacing: 1px; border-bottom: 1px solid var(--border-glow);
        }
        .data-table td {
            padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px; transition: all 0.3s;
        }
        .data-table tr:hover td { background: rgba(0,242,254,0.05); }
        .data-table tbody tr { animation: rowAppear 0.5s ease-out backwards; }
        .data-table tbody tr:nth-child(1) { animation-delay: 0.1s; }
        .data-table tbody tr:nth-child(2) { animation-delay: 0.15s; }
        .data-table tbody tr:nth-child(3) { animation-delay: 0.2s; }
        .data-table tbody tr:nth-child(4) { animation-delay: 0.25s; }
        .data-table tbody tr:nth-child(5) { animation-delay: 0.3s; }
        @keyframes rowAppear { from { opacity:0; transform:translateX(-20px); } to { opacity:1; transform:translateX(0); } }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .status-badge.success { background: rgba(0,255,136,0.2); color: var(--accent); }
        .status-badge.warning { background: rgba(255,107,107,0.2); color: var(--warning); }
        .status-badge.info { background: rgba(0,242,254,0.2); color: var(--primary); }
        .footer {
            text-align: center; padding: 30px; color: var(--text-secondary);
            font-size: 13px; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 40px;
        }
        @media (max-width: 1400px) {
            .charts-grid { grid-template-columns: repeat(2, 1fr); }
            .chart-card.full-width { grid-column: span 2; }
        }
        @media (max-width: 1024px) {
            .charts-grid { grid-template-columns: 1fr; }
            .chart-card.full-width, .chart-card.half-width { grid-column: span 1; }
            .header { flex-direction: column; gap: 15px; }
        }
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); display: flex; justify-content: center;
            align-items: center; z-index: 9999; transition: opacity 0.5s;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loader {
            width: 60px; height: 60px; border: 3px solid transparent;
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; position: relative;
        }
        .loader::before, .loader::after {
            content: ''; position: absolute; border: 3px solid transparent; border-radius: 50%;
        }
        .loader::before {
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border-top-color: var(--accent); animation: spin 2s linear infinite;
        }
        .loader::after {
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border-top-color: var(--secondary); animation: spin 1.5s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay"><div class="loader"></div></div>
    <div class="bg-particles"></div>

    <div class="kpi-container">

        <div class="kpi-card"><div class="kpi-header"><span class="kpi-title">订单数量</span><div class="kpi-icon orders">📦</div></div><div class="kpi-value" id="totalOrders">0</div><div class="kpi-trend up"><span>↑</span><span>15.2% 同比增长</span></div></div>
        <div class="kpi-card"><div class="kpi-header"><span class="kpi-title">客户数量</span><div class="kpi-icon customers">👥</div></div><div class="kpi-value" id="totalCustomers">0</div><div class="kpi-trend up"><span>↑</span><span>6.8% 同比增长</span></div></div>
        <div class="kpi-card"><div class="kpi-header"><span class="kpi-title">商品种类</span><div class="kpi-icon products">📊</div></div><div class="kpi-value" id="totalProducts">0</div><div class="kpi-trend up"><span>↑</span><span>3.5% 同比增长</span></div></div>
    </div>

    <div class="charts-grid">
        <div class="chart-card full-width">
            <div class="chart-header"><div class="chart-title">销售趋势分析</div><div class="chart-actions"><button class="chart-btn active" onclick="switchTrendView('month')">月度</button><button class="chart-btn" onclick="switchTrendView('quarter')">季度</button></div></div>
            <div class="chart-container large" id="trendChart"></div>
        </div>
        <div class="chart-card"><div class="chart-header"><div class="chart-title">地区销售分布</div></div><div class="chart-container" id="regionChart"></div></div>
        <div class="chart-card"><div class="chart-header"><div class="chart-title">商品类别占比</div></div><div class="chart-container" id="productChart"></div></div>
        <div class="chart-card"><div class="chart-header"><div class="chart-title">销售员业绩排行</div></div><div class="chart-container" id="salesRankChart"></div></div>
        <div class="chart-card half-width"><div class="chart-header"><div class="chart-title">客户贡献度分析</div></div><div class="chart-container" id="customerChart"></div></div>
        <div class="chart-card"><div class="chart-header"><div class="chart-title">数量-金额散点分析</div></div><div class="chart-container" id="scatterChart"></div></div>
        <div class="chart-card"><div class="chart-header"><div class="chart-title">月度同比对比</div></div><div class="chart-container" id="compareChart"></div></div>
        <div class="chart-card"><div class="chart-header"><div class="chart-title">销售漏斗分析</div></div><div class="chart-container" id="funnelChart"></div></div>
    </div>

    <div class="data-table-container">
        <div class="data-table">
            <div class="chart-header" style="padding:20px;"><div class="chart-title">详细交易数据</div></div>

        </div>
    </div>

    <footer class="footer"><p>智能数据分析平台 © 2026 | 数据实时更新 | 技术支持: BI Analytics Team</p></footer>

            {id:'ORD-2026-005',customer:'小米集团',sales:'陈明',product:'IoT解决方案',region:'华东',quantity:85,amount:456000,date:'2026-06-14',status:'已完成'},
            {id:'ORD-2026-006',customer:'京东集团',sales:'张伟',product:'仓储系统',region:'华北',quantity:28,amount:389000,date:'2026-06-13',status:'进行中'},
            {id:'ORD-2026-007',customer:'百度在线',sales:'李娜',product:'AI平台',region:'华北',quantity:15,amount:345000,date:'2026-06-12',status:'已完成'},
            {id:'ORD-2026-008',customer:'网易公司',sales:'王强',product:'游戏云服务',region:'华中',quantity:67,amount:298000,date:'2026-06-11',status:'待付款'}
        ]
    };

    const colors = ['#00f2fe','#4facfe','#00ff88','#ff6b6b','#a18cd1','#fbc2eb','#ff8e53','#a6c1ee'];
    let charts = {};

    function animateValue(el, start, end, dur, prefix='', suffix='') {
        const range = end - start;
        const t0 = performance.now();
        function update(now) {
            const p = Math.min((now - t0) / dur, 1);
            const ease = 1 - Math.pow(1 - p, 3);
            const cur = start + range * ease;
            el.textContent = prefix + Math.floor(cur).toLocaleString() + suffix;
            if (p < 1) requestAnimationFrame(update);
        }
        requestAnimationFrame(update);
    }

    function updateTime() {
        document.getElementById('currentTime').textContent = new Date().toLocaleString('zh-CN');
    }

    function initCharts() {
        ['trendChart','regionChart','productChart','salesRankChart','customerChart','scatterChart','compareChart','funnelChart'].forEach(id => {
            charts[id] = echarts.init(document.getElementById(id));
        });
        updateTrendChart();
        updateRegionChart();
        updateProductChart();
        updateSalesRankChart();
        updateCustomerChart();
        updateScatterChart();
        updateCompareChart();
        updateFunnelChart();
        window.addEventListener('resize', () => Object.values(charts).forEach(c => c.resize()));
    }

    function updateTrendChart() {
        const d = demoData.monthlySales;
        charts.trendChart.setOption({
            tooltip: { trigger:'axis', backgroundColor:'rgba(16,24,64,0.9)', borderColor:'#00f2fe', textStyle:{color:'#fff'} },
            legend: { data:['2025销售额','2026销售额','2025利润','2026利润'], textStyle:{color:'#8b92a8'}, top:0 },
            grid: { left:'3%', right:'4%', bottom:'3%', containLabel:true },
            xAxis: { type:'category', data:d.months, axisLine:{lineStyle:{color:'rgba(255,255,255,0.1)'}}, axisLabel:{color:'#8b92a8'} },
            yAxis: { type:'value', axisLine:{lineStyle:{color:'rgba(255,255,255,0.1)'}}, axisLabel:{color:'#8b92a8',formatter:v=>'¥'+v+'万'}, splitLine:{lineStyle:{color:'rgba(255,255,255,0.05)'}} },
            series: [
                { name:'2025销售额', type:'line', data:d.sales2025, smooth:true, symbolSize:8, lineStyle:{width:3,color:'#4facfe'}, itemStyle:{color:'#4facfe'},
                  areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(79,172,254,0.3)'},{offset:1,color:'rgba(79,172,254,0)'}])} },
                { name:'2026销售额', type:'line', data:d.sales2026, smooth:true, symbolSize:8, lineStyle:{width:3,color:'#00ff88'}, itemStyle:{color:'#00ff88'},
                  areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(0,255,136,0.3)'},{offset:1,color:'rgba(0,255,136,0)'}])} },
                { name:'2025利润', type:'bar', data:d.profit2025, itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#ff6b6b'},{offset:1,color:'rgba(255,107,107,0.3)'}])}, barWidth:'15%' },
                { name:'2026利润', type:'bar', data:d.profit2026, itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#00f2fe'},{offset:1,color:'rgba(0,242,254,0.3)'}])}, barWidth:'15%' }
            ],
            animationDuration: 1500, animationEasing: 'cubicOut'
        });
    }

    function updateRegionChart() {
        charts.regionChart.setOption({
            tooltip: { trigger:'item', backgroundColor:'rgba(16,24,64,0.9)', borderColor:'#00f2fe', textStyle:{color:'#fff'}, formatter:'{b}: ¥{c}万 ({d}%)' },
            series: [{
                type:'pie', radius:['40%','70%'], center:['50%','50%'],
                itemStyle:{borderRadius:10,borderColor:'#0a0e27',borderWidth:2},
                label:{show:true,formatter:'{b}\n{d}%',color:'#8b92a8'},
                emphasis:{label:{show:true,fontSize:16,fontWeight:'bold',color:'#fff'},itemStyle:{shadowBlur:20,shadowColor:'rgba(0,242,254,0.5)'}},
                labelLine:{lineStyle:{color:'rgba(255,255,255,0.2)'}},
                data:demoData.regionData.map((item,i)=>({...item,itemStyle:{color:colors[i]}})),
                animationType:'expansion',animationEasing:'elasticOut',animationDuration:2000
            }]
        });
    }

    function updateProductChart() {
        charts.productChart.setOption({
            tooltip: { trigger:'item', backgroundColor:'rgba(16,24,64,0.9)', borderColor:'#00f2fe', textStyle:{color:'#fff'}, formatter:'{b}: ¥{c}万 ({d}%)' },
            series: [{
                type:'pie', radius:[20,100], center:['50%','50%'], roseType:'area',
                itemStyle:{borderRadius:8}, label:{color:'#8b92a8'},
                data:demoData.productData.map((item,i)=>({...item,itemStyle:{color:colors[i]}})),
                animationType:'scale',animationEasing:'elasticOut',animationDuration:2000
            }]
        });
    }

    function updateSalesRankChart() {
        const data = demoData.salesData.slice(0,6).reverse();
        charts.salesRankChart.setOption({
            tooltip: { trigger:'axis', axisPointer:{type:'shadow'}, backgroundColor:'rgba(16,24,64,0.9)', borderColor:'#00f2fe', textStyle:{color:'#fff'}, formatter:'{b}: ¥{c}万' },
            grid: { left:'3%', right:'4%', bottom:'3%', containLabel:true },
            xAxis: { type:'value', axisLine:{lineStyle:{color:'rgba(255,255,255,0.1)'}}, axisLabel:{color:'#8b92a8',formatter:v=>'¥'+v+'万'}, splitLine:{lineStyle:{color:'rgba(255,255,255,0.05)'}} },
            yAxis: { type:'category', data:data.map(d=>d.name), axisLine:{lineStyle:{color:'rgba(255,255,255,0.1)'}}, axisLabel:{color:'#8b92a8'} },
            series: [{
                type:'bar', data:data.map(d=>({value:d.sales,itemStyle:{color:new echarts.graphic.LinearGradient(1,0,0,0,[{offset:0,color:'#00f2fe'},{offset:1,color:'#4facfe'}])}})),
                barWidth:'60%', label:{show:true,position:'right',formatter:p=>'¥'+p.value+'万',color:'#8b92a8'},
                animationDuration:1500,animationEasing:'cubicOut'
            }]
        });
    }

    function updateCustomerChart() {
        charts.customerChart.setOption({
            tooltip: { trigger:'axis', backgroundColor:'rgba(16,24,64,0.9)', borderColor:'#00f2fe', textStyle:{color:'#fff'} },
            legend: { data:['销售额','订单数'], textStyle:{color:'#8b92a8'}, top:0 },
            grid: { left:'3%', right:'4%', bottom:'3%', containLabel:true },
            xAxis: { type:'category', data:demoData.customerData.map(d=>d.name), axisLine:{lineStyle:{color:'rgba(255,255,255,0.1)'}}, axisLabel:{color:'#8b92a8'} },
            yAxis: [
                { type:'value', axisLine:{lineStyle:{color:'rgba(255,255,255,0.1)'}}, axisLabel:{color:'#8b92a8',formatter:v=>'¥'+v+'万'}, splitLine:{lineStyle:{color:'rgba(255,255,255,0.05)'}} },
                { type:'value', axisLabel:{color:'#8b92a8'}, splitLine:{show:false} }
            ],
            series: [
                { name:'销售额', type:'bar', data:demoData.customerData.map(d=>d.sales),
                  itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#00f2fe'},{offset:1,color:'rgba(0,242,254,0.3)'}])}, barWidth:'40%' },
                { name:'订单数', type:'line', yAxisIndex:1, data:demoData.customerData.map(d=>d.orders), smooth:true, symbolSize:8, lineStyle:{width:3,color:'#00ff88'}, itemStyle:{color:'#00ff88'} }
            ],
            animationDuration:1500,animationEasing:'cubicOut'
        });
    }

    function updateScatterChart() {
        charts.scatterChart.setOption({
            tooltip: { backgroundColor:'rgba(16,24,64,0.9)', borderColor:'#00f2fe', textStyle:{color:'#fff'}, formatter:p=>p.data[2]+'<br/>数量: '+p.data[0]+'<br/>金额: ¥'+p.data[1]+'万<br/>地区: '+p.data[3] },
            grid: { left:'3%', right:'8%', bottom:'3%', containLabel:true },
            xAxis: { name:'数量', type:'value', axisLine:{lineStyle:{color:'rgba(255,255,255,0.1)'}}, axisLabel:{color:'#8b92a8'}, splitLine:{lineStyle:{color:'rgba(255,255,255,0.05)'}} },
            yAxis: { name:'金额 (万)', type:'value', axisLine:{lineStyle:{color:'rgba(255,255,255,0.1)'}}, axisLabel:{color:'#8b92a8'}, splitLine:{lineStyle:{color:'rgba(255,255,255,0.05)'}} },
            series: [{
                type:'scatter', data:demoData.scatterData,
                symbolSize:d=>Math.sqrt(d[1])*3,
                itemStyle:{color:new echarts.graphic.RadialGradient(0.5,0.5,0.5,[{offset:0,color:'#00f2fe'},{offset:1,color:'#4facfe'}]),shadowBlur:10,shadowColor:'rgba(0,242,254,0.5)'},
                animationDuration:1500,animationEasing:'cubicOut'
            }]
        });
    }

    function updateCompareChart() {
        const d = demoData.monthlySales;
        const growth = d.sales2025.slice(0,6).map((v,i)=>d.sales2026[i]?((d.sales2026[i]-v)/v*100).toFixed(1):null);
        charts.compareChart.setOption({
            tooltip: { trigger:'axis', backgroundColor:'rgba(16,24,64,0.9)', borderColor:'#00f2fe', textStyle:{color:'#fff'} },
            legend: { data:['2025年','2026年','增长率'], textStyle:{color:'#8b92a8'}, top:0 },
            grid: { left:'3%', right:'4%', bottom:'3%', containLabel:true },
            xAxis: { type:'category', data:d.months.slice(0,6), axisLine:{lineStyle:{color:'rgba(255,255,255,0.1)'}}, axisLabel:{color:'#8b92a8'} },
            yAxis: [
                { type:'value', axisLine:{lineStyle:{color:'rgba(255,255,255,0.1)'}}, axisLabel:{color:'#8b92a8',formatter:v=>'¥'+v+'万'}, splitLine:{lineStyle:{color:'rgba(255,255,255,0.05)'}} },
                { type:'value', name:'增长率', axisLabel:{color:'#8b92a8',formatter:'{value}%'}, splitLine:{show:false} }
            ],
            series: [
                { name:'2025年', type:'bar', data:d.sales2025.slice(0,6), itemStyle:{color:'#4facfe'}, barWidth:'30%' },
                { name:'2026年', type:'bar', data:d.sales2026.slice(0,6), itemStyle:{color:'#00ff88'}, barWidth:'30%' },
                { name:'增长率', type:'line', yAxisIndex:1, data:growth, smooth:true, symbolSize:8, lineStyle:{width:3,color:'#ff6b6b'}, itemStyle:{color:'#ff6b6b'},
                  label:{show:true,formatter:'{c}%',color:'#ff6b6b',position:'top'} }
            ],
            animationDuration:1500,animationEasing:'cubicOut'
        });
    }

    function updateFunnelChart() {
        charts.funnelChart.setOption({
            tooltip: { trigger:'item', backgroundColor:'rgba(16,24,64,0.9)', borderColor:'#00f2fe', textStyle:{color:'#fff'}, formatter:'{b}: {c} ({d}%)' },
            series: [{
                type:'funnel', left:'10%', top:20, bottom:20, width:'80%', min:0, max:demoData.funnelData[0].value,
                minSize:'0%', maxSize:'100%', sort:'descending', gap:5,
                label:{show:true,position:'inside',color:'#fff',formatter:'{b}\n{c}'},
                labelLine:{length:10,lineStyle:{width:1,type:'solid'}},
                itemStyle:{borderColor:'#0a0e27',borderWidth:2},
                emphasis:{itemStyle:{shadowBlur:20,shadowColor:'rgba(0,242,254,0.5)'}},
                data:demoData.funnelData.map((item,i)=>({...item,itemStyle:{color:colors[i]}})),
                animationDuration:2000,animationEasing:'cubicOut'
            }]
        });
    }

    function renderTable() {
        document.getElementById('tableBody').innerHTML = demoData.tableData.map(row =>
            `<tr><td>${row.id}</td><td>${row.customer}</td><td>${row.sales}</td><td>${row.product}</td><td>${row.region}</td><td>${row.quantity}</td><td>¥${row.amount.toLocaleString()}</td><td>${row.date}</td><td><span class="status-badge ${row.status==='已完成'?'success':row.status==='进行中'?'info':'warning'}">${row.status}</span></td></tr>`
        ).join('');
    }

    function switchTrendView(view) {
        document.querySelectorAll('.chart-actions .chart-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        updateTrendChart();
    }

    // 筛选器联动
    ['customerFilter','salesFilter','regionFilter','productFilter','dateStart','dateEnd'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
            const kpi = demoData.kpi;
            const m = 0.7 + Math.random() * 0.6;
            animateValue(document.getElementById('totalSales'), 0, Math.floor(kpi.totalSales * m), 1500, '¥');
            animateValue(document.getElementById('totalProfit'), 0, Math.floor(kpi.totalProfit * m), 1500, '¥');
            animateValue(document.getElementById('totalOrders'), 0, Math.floor(kpi.totalOrders * m), 1500);
            animateValue(document.getElementById('totalCustomers'), 0, Math.floor(kpi.totalCustomers * m), 1500);
            animateValue(document.getElementById('totalProducts'), 0, Math.floor(kpi.totalProducts * m), 1500);
            Object.values(charts).forEach(c => c.clear());
            setTimeout(() => {
                updateTrendChart(); updateRegionChart(); updateProductChart();
                updateSalesRankChart(); updateCustomerChart(); updateScatterChart();
                updateCompareChart(); updateFunnelChart();
            }, 300);
        });
    });

    // 图表联动 - 点击地区筛选
    ['regionChart','productChart'].forEach(id => {
        charts[id] && charts[id].on('click', function(params) {
            console.log('联动选择:', params.name);
        });
    });

    // 初始化
    window.addEventListener('load', () => {
        initCharts();
        renderTable();
        updateTime();
        setInterval(updateTime, 1000);

        const kpi = demoData.kpi;
        animateValue(document.getElementById('totalSales'), 0, kpi.totalSales, 2000, '¥');
        animateValue(document.getElementById('totalProfit'), 0, kpi.totalProfit, 2000, '¥');
        animateValue(document.getElementById('totalOrders'), 0, kpi.totalOrders, 2000);
        animateValue(document.getElementById('totalCustomers'), 0, kpi.totalCustomers, 2000);
        animateValue(document.getElementById('totalProducts'), 0, kpi.totalProducts, 2000);

        setTimeout(() => document.getElementById('loadingOverlay').classList.add('hidden'), 800);
    });
    </script>
</body>
