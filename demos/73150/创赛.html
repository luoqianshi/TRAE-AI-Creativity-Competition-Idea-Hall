<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题助手</title>
<style>
  :root {
    --bg: #f7f8fc;
    --card: #ffffff;
    --primary: #5b8def;
    --primary-light: #e8f0fe;
    --text: #2c3e50;
    --text-secondary: #7f8c9b;
    --border: #e8ecf1;
    --tag-bg: #f0f4ff;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header .logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header .logo .icon {
    width: 28px; height: 28px;
    background: var(--primary);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 14px;
  }
  .header .user {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text-secondary);
  }
  .header .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a8c8ff, #5b8def);
  }

  /* Main Layout */
  .main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 24px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
  }

  /* Cards */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .card-header {
    padding: 18px 20px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card-header .step {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .card-header h3 {
    font-size: 15px;
    font-weight: 600;
  }
  .card-body {
    padding: 20px;
  }

  /* Upload Zone */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .upload-zone:hover {
    border-color: var(--primary);
    background: #fafbff;
  }
  .upload-zone .upload-icon {
    font-size: 36px;
    margin-bottom: 10px;
    opacity: 0.6;
  }
  .upload-zone p {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .upload-zone .hint {
    margin-top: 6px;
    font-size: 12px;
    color: #b0b8c4;
  }

  .preview-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .preview-thumb {
    width: 60px; height: 60px;
    border-radius: 8px;
    background: #eef1f6;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #c0c8d4;
  }

  /* Classification */
  .class-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .class-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-radius: 8px;
    background: #fafbfc;
    border: 1px solid var(--border);
    font-size: 14px;
  }
  .class-item .name {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .class-item .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .class-item .dot.red { background: #f56c6c; }
  .class-item .dot.orange { background: #e6a23c; }
  .class-item .dot.blue { background: #409eff; }
  .class-item .count {
    font-size: 12px;
    color: var(--text-secondary);
    background: #f0f2f5;
    padding: 2px 8px;
    border-radius: 10px;
  }

  /* Exercise */
  .exercise-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
    background: #fafbfc;
  }
  .exercise-card .q {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .exercise-card .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .exercise-card .option {
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 6px;
    background: #fff;
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .exercise-card .option.correct {
    border-color: #67c23a;
    color: #67c23a;
    background: #f0f9eb;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
  }
  .btn-outline {
    background: #fff;
    color: var(--primary);
    border: 1px solid var(--primary);
  }
  .btn:hover { opacity: 0.85; }

  .btn-row {
    margin-top: 16px;
    display: flex;
    gap: 10px;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: #b0b8c4;
  }

  @media (max-width: 800px) {
    .main {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <span class="icon">📐</span>
    错题助手
  </div>
  <div class="user">
    <span>张同学</span>
    <div class="avatar"></div>
  </div>
</header>

<div class="main">

  <!-- 板块一：上传图片 -->
  <div class="card">
    <div class="card-header">
      <span class="step">1</span>
      <h3>上传图片</h3>
    </div>
    <div class="card-body">
      <div class="upload-zone">
        <div class="upload-icon">📷</div>
        <p>点击或拖拽上传错题图片</p>
        <p class="hint">支持 JPG / PNG，单张不超过 10MB</p>
      </div>
      <div class="preview-row">
        <div class="preview-thumb">📄</div>
        <div class="preview-thumb">📄</div>
        <div class="preview-thumb" style="background:#e8f0fe">📄</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary">开始识别</button>
        <button class="btn btn-outline">清空</button>
      </div>
    </div>
  </div>

  <!-- 板块二：错题分类 -->
  <div class="card">
    <div class="card-header">
      <span class="step">2</span>
      <h3>错题分类</h3>
    </div>
    <div class="card-body">
      <div class="class-list">
        <div class="class-item">
          <span class="name"><span class="dot red"></span> 计算错误</span>
          <span class="count">3 题</span>
        </div>
        <div class="class-item">
          <span class="name"><span class="dot orange"></span> 概念模糊</span>
          <span class="count">5 题</span>
        </div>
        <div class="class-item">
          <span class="name"><span class="dot blue"></span> 审题不清</span>
          <span class="count">2 题</span>
        </div>
        <div class="class-item">
          <span class="name"><span class="dot" style="background:#a0cfff"></span> 公式记错</span>
          <span class="count">1 题</span>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-outline" style="width:100%;justify-content:center">查看全部</button>
      </div>
    </div>
  </div>

  <!-- 板块三：生成练习题 -->
  <div class="card">
    <div class="card-header">
      <span class="step">3</span>
      <h3>生成练习题</h3>
    </div>
    <div class="card-body">
      <div class="exercise-card">
        <div class="q">1. 下列计算正确的是（ ）</div>
        <div class="options">
          <span class="option">A. 3 + 2 = 6</span>
          <span class="option correct">B. 8 ÷ 2 = 4</span>
          <span class="option">C. 5 × 0 = 5</span>
          <span class="option">D. 7 - 1 = 5</span>
        </div>
      </div>
      <div class="exercise-card">
        <div class="q">2. 一个长方形的长是 8cm，宽是 5cm，它的面积是（ ）</div>
        <div class="options">
          <span class="option">A. 13 cm²</span>
          <span class="option">B. 26 cm²</span>
          <span class="option correct">C. 40 cm²</span>
          <span class="option">D. 80 cm²</span>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" style="width:100%;justify-content:center">生成更多练习</button>
      </div>
    </div>
  </div>

</div>

<div class="footer">
  错题助手 · 让每一次错误都变成进步
</div>

</body>
</html>
