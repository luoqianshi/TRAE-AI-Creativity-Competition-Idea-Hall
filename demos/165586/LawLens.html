    { type: 'thirdParty', label: '第三人',   color: '#059669', desc: '案件利害关系人' },
    { type: 'guarantor',  label: '保证人',   color: '#D97706', desc: '担保责任承担方' },
    { type: 'subject',    label: '标的物',   color: '#7C3AED', desc: '权利义务指向对象' },
    { type: 'creditor',   label: '债权人',   color: '#0891B2', desc: '享有债权的一方' },
    { type: 'debtor',     label: '债务人',   color: '#EA580C', desc: '负有债务的一方' },
    { type: 'mortgagee',  label: '抵押权人', color: '#4F46E5', desc: '享有抵押权的一方' },
  ];

  const RELATIONS = ['买卖', '质押', '担保', '租赁', '借贷', '抵押', '委托', '赠与', '承揽', '保证'];

  // ============================================================
  //  STATE
  // ============================================================
  const state = {
    nodes: [],        // { id, type, label, color, x, y, el }
    connections: [],  // { id, fromId, toId, type, lineEl, labelEl }
    nextNodeId: 1,
    nextConnId: 1,
    isConnecting: false,
    connectFrom: null,  // node id
    dragNodeId: null,
    dragOffsetX: 0,
    dragOffsetY: 0,
  };

  // DOM refs
  const canvas = document.getElementById('canvas-area');
  const svg = document.getElementById('canvas-svg');
  const connLabels = document.getElementById('conn-labels');
  const entityList = document.getElementById('entity-list');
  const reportPlaceholder = document.getElementById('report-placeholder');
  const reportContent = document.getElementById('report-content');
  const loadingOverlay = document.getElementById('loading-overlay');
  const loadingBar = document.getElementById('loading-bar');
  const btnClear = document.getElementById('btn-clear');
  const btnConnect = document.getElementById('btn-connect');
  const btnDiagnose = document.getElementById('btn-diagnose');
  const canvasHint = document.getElementById('canvas-hint');

  // ============================================================
  //  RENDER ENTITY LIST
  // ============================================================
  function renderEntityList() {
    entityList.innerHTML = '';
    ENTITIES.forEach(e => {
      const card = document.createElement('div');
      card.className = 'entity-card';
      card.dataset.type = e.type;
      card.innerHTML = `
        <span class="dot" style="background:${e.color}"></span>
        <span class="label">${e.label}</span>
        <span class="hint">+</span>
      `;
      card.addEventListener('click', () => addNode(e.type));
      entityList.appendChild(card);
    });
  }

  // ============================================================
  //  NODE MANAGEMENT
  // ============================================================
  function addNode(type) {
    const entity = ENTITIES.find(e => e.type === type);
    if (!entity) return;

    // Random position within canvas
    const rect = canvas.getBoundingClientRect();
    const x = 40 + Math.random() * (Math.min(rect.width, 600) - 180);
    const y = 60 + Math.random() * (Math.min(rect.height, 400) - 120);

    const id = state.nextNodeId++;
    const node = { id, type, label: entity.label, color: entity.color, x, y, el: null };

    // Create DOM element
    const el = document.createElement('div');
    el.className = 'canvas-node';
    el.dataset.nodeId = id;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.borderColor = entity.color;

    // Icon SVG based on type
    let iconSvg = '';
    switch (type) {
      case 'plaintiff': case 'defendant':
        iconSvg = '<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>';
        break;
      case 'thirdParty':
        iconSvg = '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"/></svg>';
        break;
      case 'guarantor':
        iconSvg = '<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>';
        break;
      case 'subject':
        iconSvg = '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M4 3a2 2 0 100 4h12a2 2 0 100-4H4z"/><path fill-rule="evenodd" d="M3 8h14v7a2 2 0 01-2 2H5a2 2 0 01-2-2V8zm5 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>';
        break;
      case 'creditor':
        iconSvg = '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M8.433 7.418c.155-.103.346-.196.567-.267v1.698a2.305 2.305 0 01-.567-.267C8.07 8.34 8 8.114 8 8c0-.114.07-.34.433-.582zM11 12.849v-1.698c.22.071.412.164.567.267.364.243.433.468.433.582 0 .114-.07.34-.433.582a2.305 2.305 0 01-.567.267z"/><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v.092a4.535 4.535 0 00-1.676.662C6.602 6.234 6 7.009 6 8c0 .99.602 1.765 1.324 2.246.48.32 1.054.545 1.676.662v1.941c-.391-.127-.68-.317-.843-.504a1 1 0 10-1.51 1.31c.562.649 1.413 1.076 2.353 1.253V15a1 1 0 102 0v-.092a4.535 4.535 0 001.676-.662C13.398 13.766 14 12.991 14 12c0-.99-.602-1.765-1.324-2.246A4.535 4.535 0 0011 9.092V7.151c.391.127.68.317.843.504a1 1 0 101.51-1.31c-.562-.649-1.413-1.076-2.353-1.253V5z" clip-rule="evenodd"/></svg>';
        break;
      case 'debtor':
        iconSvg = '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z"/><path fill-rule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clip-rule="evenodd"/></svg>';
        break;
      case 'mortgagee':
        iconSvg = '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>';
        break;
      default:
        iconSvg = '<svg viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="10" r="8"/></svg>';
    }

    el.innerHTML = `
      <div class="node-header" style="background:${entity.color}">
        ${iconSvg}
        <span>${entity.label}</span>
      </div>
      <div class="node-body">
        <div class="node-label">${entity.label} #${id}</div>
        <div class="node-id">${entity.desc}</div>
      </div>
      <div class="node-remove" data-node-id="${id}">&#x2715;</div>
    `;

    // Remove button
    el.querySelector('.node-remove').addEventListener('click', (e) => {
      e.stopPropagation();
      removeNode(id);
    });

    // Click for connection
    el.addEventListener('click', (e) => {
      if (state.isConnecting) {
        e.stopPropagation();
        handleNodeClick(id);
      }
    });

    // Drag start
    el.addEventListener('mousedown', (e) => {
      if (e.target.closest('.node-remove')) return;
      startDrag(e, id);
    });

    // Touch support
    el.addEventListener('touchstart', (e) => {
      if (e.target.closest('.node-remove')) return;
      const touch = e.touches[0];
      startDrag({ clientX: touch.clientX, clientY: touch.clientY, target: e.target }, id);
    }, { passive: true });

    canvas.appendChild(el);
    node.el = el;
    state.nodes.push(node);

    // Update SVG size
    updateSvgSize();
    updateConnections();
    updateHint();
    return node;
  }

  function removeNode(id) {
    const idx = state.nodes.findIndex(n => n.id === id);
    if (idx === -1) return;
    const node = state.nodes[idx];
    if (node.el && node.el.parentNode) node.el.parentNode.removeChild(node.el);
    state.nodes.splice(idx, 1);

    // Remove connected connections
    const connsToRemove = state.connections.filter(c => c.fromId === id || c.toId === id);
    connsToRemove.forEach(c => removeConnection(c.id));

    if (state.connectFrom === id) state.connectFrom = null;
    updateConnections();
    updateHint();
  }

  function clearAll() {
    // Remove all node elements
    state.nodes.forEach(n => {
      if (n.el && n.el.parentNode) n.el.parentNode.removeChild(n.el);
    });
    // Remove all connection elements
    state.connections.forEach(c => {
      if (c.lineEl && c.lineEl.parentNode) c.lineEl.parentNode.removeChild(c.lineEl);
      if (c.labelEl && c.labelEl.parentNode) c.labelEl.parentNode.removeChild(c.labelEl);
    });
    state.nodes = [];
    state.connections = [];
    state.nextNodeId = 1;
    state.nextConnId = 1;
    state.connectFrom = null;
    updateConnections();
    updateHint();
  }

  // ============================================================
  //  DRAG
  // ============================================================
  function startDrag(e, nodeId) {
    const node = state.nodes.find(n => n.id === nodeId);
    if (!node) return;
    const rect = node.el.getBoundingClientRect();
    state.dragNodeId = nodeId;
    state.dragOffsetX = e.clientX - rect.left;
    state.dragOffsetY = e.clientY - rect.top;
    node.el.classList.add('dragging');
    e.preventDefault();
  }

  function doDrag(e) {
    if (state.dragNodeId === null) return;
    const node = state.nodes.find(n => n.id === state.dragNodeId);
    if (!node) return;

    const canvasRect = canvas.getBoundingClientRect();
    let x = e.clientX - canvasRect.left - state.dragOffsetX;
    let y = e.clientY - canvasRect.top - state.dragOffsetY;

    // Clamp within canvas
    const nodeRect = node.el.getBoundingClientRect();
    const w = nodeRect.width || 140;
    const h = nodeRect.height || 80;
    x = Math.max(0, Math.min(x, canvasRect.width - w));
    y = Math.max(0, Math.min(y, canvasRect.height - h));

    node.x = x;
    node.y = y;
    node.el.style.left = x + 'px';
    node.el.style.top = y + 'px';

    updateConnections();
  }

  function endDrag() {
    if (state.dragNodeId !== null) {
      const node = state.nodes.find(n => n.id === state.dragNodeId);
      if (node && node.el) node.el.classList.remove('dragging');
      state.dragNodeId = null;
    }
  }

  // Global mouse/touch events for drag
  document.addEventListener('mousemove', doDrag);
  document.addEventListener('mouseup', endDrag);
  document.addEventListener('touchmove', (e) => {
    if (state.dragNodeId === null) return;
    const touch = e.touches[0];
    doDrag({ clientX: touch.clientX, clientY: touch.clientY });
  }, { passive: true });
  document.addEventListener('touchend', endDrag);

  // ============================================================
  //  CONNECTION MANAGEMENT
  // ============================================================
  function toggleConnectMode() {
    state.isConnecting = !state.isConnecting;
    if (state.isConnecting) {
      btnConnect.classList.add('active');
      btnConnect.style.background = '#D97706';
      btnConnect.style.color = '#fff';
      btnConnect.style.borderColor = '#D97706';
      canvasHint.textContent = '点击起始节点 → 再点目标节点建立连线';
    } else {
      btnConnect.classList.remove('active');
      btnConnect.style.background = '';
      btnConnect.style.color = '';
      btnConnect.style.borderColor = '';
      state.connectFrom = null;
      clearConnectHighlights();
      canvasHint.textContent = '点击左侧实体卡添加节点';
    }
  }

  function clearConnectHighlights() {
    document.querySelectorAll('.canvas-node.connect-target').forEach(el => {
      el.classList.remove('connect-target');
    });
  }

  function handleNodeClick(nodeId) {
    if (!state.isConnecting) return;

    if (state.connectFrom === null) {
      // First node selected
      state.connectFrom = nodeId;
      clearConnectHighlights();
      const node = state.nodes.find(n => n.id === nodeId);
      if (node && node.el) node.el.classList.add('connect-target');
      canvasHint.textContent = '已选中起始节点，请点击目标节点';
    } else {
      // Second node selected
      if (state.connectFrom === nodeId) {
        // Clicked same node - deselect
        state.connectFrom = null;
        clearConnectHighlights();
        canvasHint.textContent = '点击起始节点 → 再点目标节点建立连线';
        return;
      }
      // Create connection
      addConnection(state.connectFrom, nodeId);
      state.connectFrom = null;
      clearConnectHighlights();
      canvasHint.textContent = '点击起始节点 → 再点目标节点建立连线';
    }
  }

  function addConnection(fromId, toId) {
    // Check if connection already exists
    const exists = state.connections.some(c => c.fromId === fromId && c.toId === toId);
    if (exists) return;

    const id = state.nextConnId++;
    const conn = { id, fromId, toId, type: '买卖', lineEl: null, labelEl: null };

    // Create SVG line group
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('stroke', '#D97706');
    line.setAttribute('stroke-width', '2.5');
    line.setAttribute('marker-end', 'url(#arrowhead)');
    line.style.cursor = 'pointer';
    g.appendChild(line);
    svg.appendChild(g);
    conn.lineEl = g;

    // Create label (select dropdown)
    const labelDiv = document.createElement('div');
    labelDiv.className = 'conn-label';
    labelDiv.style.pointerEvents = 'auto';
    const select = document.createElement('select');
    RELATIONS.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r;
      opt.textContent = r;
      if (r === '买卖') opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener('change', () => {
      conn.type = select.value;
    });
    labelDiv.appendChild(select);
    connLabels.appendChild(labelDiv);
    conn.labelEl = labelDiv;

    // Remove connection on double-click line
    g.addEventListener('dblclick', () => removeConnection(id));

    state.connections.push(conn);
    updateConnections();
    updateConnectionsPosition();
    return conn;
  }

  function removeConnection(id) {
    const idx = state.connections.findIndex(c => c.id === id);
    if (idx === -1) return;
    const conn = state.connections[idx];
    if (conn.lineEl && conn.lineEl.parentNode) conn.lineEl.parentNode.removeChild(conn.lineEl);
    if (conn.labelEl && conn.labelEl.parentNode) conn.labelEl.parentNode.removeChild(conn.labelEl);
    state.connections.splice(idx, 1);
  }

  function updateConnections() {
    updateConnectionsPosition();
  }

  function updateConnectionsPosition() {
    state.connections.forEach(conn => {
      const fromNode = state.nodes.find(n => n.id === conn.fromId);
      const toNode = state.nodes.find(n => n.id === conn.toId);
      if (!fromNode || !toNode || !fromNode.el || !toNode.el) return;

      const fromRect = fromNode.el.getBoundingClientRect();
      const toRect = toNode.el.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();

      // Center of nodes relative to canvas
      const x1 = fromRect.left - canvasRect.left + fromRect.width / 2;
      const y1 = fromRect.top - canvasRect.top + fromRect.height / 2;
      const x2 = toRect.left - canvasRect.left + toRect.width / 2;
      const y2 = toRect.top - canvasRect.top + toRect.height / 2;

      // Update line
      const line = conn.lineEl.querySelector('line');
      if (line) {
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
      }

      // Update label position (midpoint)
      if (conn.labelEl) {
        const mx = (x1 + x2) / 2;
        const my = (y1 + y2) / 2;
        conn.labelEl.style.left = mx + 'px';
        conn.labelEl.style.top = my + 'px';
      }
    });
  }

  function updateSvgSize() {
    const rect = canvas.getBoundingClientRect();
    svg.setAttribute('width', rect.width);
    svg.setAttribute('height', rect.height);
    svg.style.width = rect.width + 'px';
    svg.style.height = rect.height + 'px';
  }

  // ============================================================
  //  HINT
  // ============================================================
  function updateHint() {
    if (state.isConnecting) return;
    if (state.nodes.length === 0) {
      canvasHint.textContent = '点击左侧实体卡添加节点';
    } else {
      canvasHint.textContent = `画布上 ${state.nodes.length} 个节点 · ${state.connections.length} 条连线`;
    }
  }

  // ============================================================
  //  DIAGNOSIS
  // ============================================================
  function runDiagnosis() {
    if (state.nodes.length === 0) {
      alert('请在画布中添加至少一个实体节点后再进行诊断。');
      return;
    }

    // Show loading
    loadingOverlay.classList.add('show');
    loadingBar.style.width = '0%';

    // Animate progress
    let progress = 0;
    const interval = setInterval(() => {
      progress += 2 + Math.random() * 5;
      if (progress > 100) {
        progress = 100;
        clearInterval(interval);
      }
      loadingBar.style.width = progress + '%';
    }, 50);

    // Generate report after 1.5s
    setTimeout(() => {
      clearInterval(interval);
      loadingBar.style.width = '100%';
      setTimeout(() => {
        loadingOverlay.classList.remove('show');
        generateReport();
      }, 300);
    }, 1500);
  }

  function generateReport() {
    const nodes = state.nodes;
    const conns = state.connections;

    // Identify entities
    const hasPlaintiff = nodes.some(n => n.type === 'plaintiff');
    const hasDefendant = nodes.some(n => n.type === 'defendant');
    const hasThirdParty = nodes.some(n => n.type === 'thirdParty');
    const hasGuarantor = nodes.some(n => n.type === 'guarantor');
    const hasSubject = nodes.some(n => n.type === 'subject');
    const hasCreditor = nodes.some(n => n.type === 'creditor');
    const hasDebtor = nodes.some(n => n.type === 'debtor');
    const hasMortgagee = nodes.some(n => n.type === 'mortgagee');

    const plaintiffNode = nodes.find(n => n.type === 'plaintiff');
    const defendantNode = nodes.find(n => n.type === 'defendant');
    const subjectNode = nodes.find(n => n.type === 'subject');

    const getLabel = (type) => { const e = ENTITIES.find(ee => ee.type === type); return e ? e.label : type; };

    // Build sections
    let sections = [];

    // Section 1: Case Overview
    let overview = '<div class="section"><h4>案件概况</h4><p>';
    if (plaintiffNode && defendantNode) {
      overview += `本案为 ${plaintiffNode.label}（${plaintiffNode.el ? plaintiffNode.el.querySelector('.node-label')?.textContent || plaintiffNode.label : plaintiffNode.label}）诉 ${defendantNode.label}（${defendantNode.el ? defendantNode.el.querySelector('.node-label')?.textContent || defendantNode.label : defendantNode.label}）之纠纷。`;
    } else if (plaintiffNode) {
      overview += `本案由 ${plaintiffNode.label} 提起诉讼。`;
    } else {
      overview += '本案涉及多方当事人之间的法律关系。';
    }
    if (subjectNode) {
      overview += `本案核心标的物为「${subjectNode.label}」，需审查其权属及流转情况。`;
    }
    overview += '</p><p>';
    conns.forEach((c, i) => {
      const fromN = nodes.find(n => n.id === c.fromId);
      const toN = nodes.find(n => n.id === c.toId);
      if (fromN && toN) {
        overview += `<span class="tag tag-blue">${fromN.label}</span> → ${c.type} → <span class="tag tag-blue">${toN.label}</span>`;
        if (i < conns.length - 1) overview += '　';
      }
    });
    if (conns.length === 0) overview += '（暂未建立法律关系连线）';
    overview += '</p></div>';
    sections.push(overview);

    // Section 2: Contract Validity
    if (plaintiffNode && defendantNode) {
      let sec = '<div class="section gold"><h4>合同效力分析</h4><p>';
      sec += `经初步审查，原告与被告之间存在法律关系。根据《中华人民共和国民法典》第143条，民事法律行为有效的要件包括：<strong>（一）行为人具有相应的民事行为能力；（二）意思表示真实；（三）不违反法律、行政法规的强制性规定，不违背公序良俗。</strong>`;
      if (subjectNode) {
        sec += `本案标的物「${subjectNode.label}」的权属状态及流转合法性将是合同效力判断的关键。`;
      }
      sec += `</p><p>初步判断：<span class="tag tag-green">合同成立</span> 需进一步审查意思表示真实性与标的物合法性。</p></div>`;
      sections.push(sec);
    }

    // Section 3: Third Party / Good Faith
    if (hasThirdParty) {
      let sec = '<div class="section green"><h4>第三人善意取得分析</h4><p>';
      sec += `本案涉及第三人。根据《民法典》第311条，<strong>善意取得</strong>须同时满足：（一）受让人受让该不动产或者动产时是善意的；（二）以合理的价格转让；（三）转让的不动产或者动产依照法律规定应当登记的已经登记，不需要登记的已经交付给受让人。`;
      if (hasSubject) {
        sec += `第三人是否知晓标的物上存在的权利瑕疵，以及转让价格是否合理，将是判断是否构成善意取得的核心要素。`;
      }
      sec += `</p><p>初步判断：<span class="tag tag-gold">需进一步查明</span> 第三人是否满足善意取得的构成要件。</p></div>`;
      sections.push(sec);
    }

    // Section 4: Guarantor
    if (hasGuarantor) {
      let sec = '<div class="section red"><h4>保证人担保责任分析</h4><p>';
      sec += `本案涉及保证人。根据《民法典》第686条，保证的方式包括<strong>一般保证</strong>和<strong>连带责任保证</strong>。`;
      if (hasCreditor) {
        sec += `债权人有权依据保证合同向保证人主张保证责任。`;
      }
      sec += `根据《民法典》第692条，保证期间是确定保证人承担保证责任的法定期间，债权人未在保证期间内依法主张权利的，保证人不再承担保证责任。`;
      sec += `</p><p>初步判断：<span class="tag tag-gold">需审查保证方式</span> 及保证期间是否届满。</p></div>`;
      sections.push(sec);
    }

    // Section 5: Creditor-Debtor
    if (hasCreditor && hasDebtor) {
      let sec = '<div class="section"><h4>债权债务关系分析</h4><p>';
      sec += `根据《民法典》第118条，<strong>债权</strong>是因合同、侵权行为、无因管理、不当得利以及法律的其他规定，权利人请求特定义务人为或者不为一定行为的权利。`;
      if (hasSubject) {
        sec += `本案标的物与债权债务关系之间存在直接关联，需审查债务人是否已履行给付义务。`;
      }
      sec += `</p><p>初步判断：<span class="tag tag-blue">债权成立</span> 需进一步审查债务履行情况。</p></div>`;
      sections.push(sec);
    }

    // Section 6: Mortgage
    if (hasMortgagee) {
      let sec = '<div class="section gold"><h4>抵押权效力分析</h4><p>';
      sec += `根据《民法典》第394条，<strong>抵押权</strong>是债务人或第三人不转移财产的占有，将该财产作为债权的担保。债务人不履行到期债务或发生约定的实现抵押权的情形，债权人有权就该财产优先受偿。`;
      if (hasSubject) {
        sec += `需审查标的物上是否存在在先抵押权，以及抵押登记是否有效。`;
      }
      sec += `</p><p>初步判断：<span class="tag tag-gold">需审查登记情况</span> 抵押权的设立以登记为对抗要件。</p></div>`;
      sections.push(sec);
    }

    // Section 7: Summary
    let summary = '<div class="section gold"><h4>综合诊断结论</h4><p>';
    summary += `基于当前画布上 ${nodes.length} 个实体节点与 ${conns.length} 条法律关系连线，AI 初步推演如下：</p><ul style="margin:0.3rem 0;padding-left:1.2rem;">`;
    if (plaintiffNode && defendantNode) {
      summary += `<li><strong>诉讼主体适格</strong>：原告与被告具备诉讼主体资格。</li>`;
    }
    if (hasSubject) {
      summary += `<li><strong>标的物为核心争议焦点</strong>：需重点审查标的物权属与流转合法性。</li>`;
    }
    if (hasGuarantor) {
      summary += `<li><strong>担保法律关系复杂</strong>：建议重点审查保证期间与保证方式约定。</li>`;
    }
    if (hasThirdParty) {
      summary += `<li><strong>第三人权益需保护</strong>：善意取得制度的适用与否将影响案件走向。</li>`;
    }
    summary += `<li><strong>建议</strong>：进一步收集证据材料，完善法律事实链条，建议咨询执业律师进行深入分析。</li>`;
    summary += `</ul><p style="margin-top:0.4rem;font-size:0.7rem;color:var(--muted);">⚠ 本报告由 AI 自动生成，仅供学术参考，不构成正式法律意见。</p></div>`;
    sections.push(summary);

    // Render
    const now = new Date();
    const timeStr = now.toLocaleString('zh-CN', { hour12: false });
    reportPlaceholder.style.display = 'none';
    reportContent.style.display = 'block';
    reportContent.innerHTML = `
      <div class="report-header">
        <h3>模拟法律定性分析报告</h3>
        <div class="meta">生成时间：${timeStr} ｜ 引用：《中华人民共和国民法典》</div>
      </div>
      ${sections.join('')}
    `;
    reportContent.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ============================================================
  //  RESIZE
  // ============================================================
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      updateSvgSize();
      updateConnectionsPosition();
    }, 150);
  });

  // ============================================================
  //  INIT
  // ============================================================
  function init() {
    renderEntityList();
    updateSvgSize();

    // Buttons
    btnClear.addEventListener('click', clearAll);
    btnConnect.addEventListener('click', toggleConnectMode);
    btnDiagnose.addEventListener('click', runDiagnosis);

    // Click outside canvas to deselect connect
    document.addEventListener('click', (e) => {
      if (state.isConnecting && state.connectFrom !== null) {
        if (!e.target.closest('.canvas-node') && !e.target.closest('#btn-connect')) {
          state.connectFrom = null;
          clearConnectHighlights();
          canvasHint.textContent = '点击起始节点 → 再点目标节点建立连线';
        }
      }
    });

    // Add initial sample nodes and connections for demo
    setTimeout(() => {
      const p = addNode('plaintiff');
      const d = addNode('defendant');
      const s = addNode('subject');
      const g = addNode('guarantor');
      // Reposition
      if (p && p.el) { p.x = 50; p.y = 60; p.el.style.left = '50px'; p.el.style.top = '60px'; }
      if (d && d.el) { d.x = 350; d.y = 60; d.el.style.left = '350px'; d.el.style.top = '60px'; }
      if (s && s.el) { s.x = 200; s.y = 200; s.el.style.left = '200px'; s.el.style.top = '200px'; }
      if (g && g.el) { g.x = 50; g.y = 340; g.el.style.left = '50px'; g.el.style.top = '340px'; }
      // Add sample connections
      if (p && d) {
        const c1 = addConnection(p.id, d.id);
        if (c1) { c1.type = '买卖'; c1.labelEl.querySelector('select').value = '买卖'; }
      }
      if (d && s) {
        const c2 = addConnection(d.id, s.id);
        if (c2) { c2.type = '质押'; c2.labelEl.querySelector('select').value = '质押'; }
      }
      if (d && g) {
        const c3 = addConnection(d.id, g.id);
        if (c3) { c3.type = '担保'; c3.labelEl.querySelector('select').value = '担保'; }
      }
      updateConnectionsPosition();
      updateHint();
    }, 100);
  }

  // Run on DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
