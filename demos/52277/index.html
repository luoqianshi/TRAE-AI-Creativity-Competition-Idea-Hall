<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>围棋盲棋打谱 · v1</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="top-bar">
            <h1 class="title">围棋盲棋打谱</h1>
            <div class="top-actions">
                <button id="btn-toggle-blind" class="btn" aria-pressed="false">盲棋模式</button>
                <button id="btn-toggle-voice" class="btn" aria-pressed="false">语音</button>
                <button id="btn-save-all" class="btn">保存全部</button>
                <button id="btn-load-all" class="btn">载入存档</button>
                <button id="btn-export-sgf" class="btn">导出SGF</button>
                <label class="btn file-btn">
                    导入SGF
                    <input type="file" id="input-sgf" accept=".sgf" hidden>
                </label>
                <a href="viewer.html" class="btn btn-link" target="_blank">观众页</a>
            </div>
        </header>

        <main class="main-layout">
            <aside class="panel panel-left" aria-label="对局列表">
                <div class="panel-header">
                    <h2>对局列表</h2>
                    <button id="btn-new-game" class="btn btn-sm">+ 新对局</button>
                </div>
                <div class="game-list-filter">
                    <input type="text" id="input-filter" placeholder="搜索对局..." aria-label="搜索对局">
                </div>
                <ul id="game-list" class="game-list" role="tablist"></ul>
            </aside>

            <section class="panel panel-center" aria-label="棋盘区域">
                <div class="game-info">
                    <div class="info-line">
                        <span class="label">当前局:</span>
                        <span id="current-game-name" class="value">—</span>
                    </div>
                    <div class="info-line">
                        <span class="label">手数:</span>
                        <span id="current-move-count" class="value">0</span>
                        <span class="label" style="margin-left:1em;">执黑:</span>
                        <span id="black-player" class="value">我</span>
                        <span class="label" style="margin-left:1em;">执白:</span>
                        <span id="white-player" class="value">AI</span>
                        <span class="label" style="margin-left:1em;">下一步:</span>
                        <span id="next-player" class="value">黑</span>
                    </div>
                </div>

                <div id="board-wrapper" class="board-wrapper">
                    <canvas id="board" aria-label="围棋棋盘"></canvas>
                </div>

                <div id="last-move-announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>
                <div id="status-announce" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
            </section>

            <aside class="panel panel-right" aria-label="控制面板">
                <div class="panel-header">
                    <h2>操作</h2>
                </div>

                <div class="control-group">
                    <label class="control-label" for="input-coord">坐标输入 (如 D15 / 16三 / 星位)</label>
                    <div class="row">
                        <input type="text" id="input-coord" class="text-input" placeholder="例如: D15 或 16三 或 星位" aria-label="坐标输入">
                        <button id="btn-submit-coord" class="btn">落子</button>
                    </div>
                </div>

                <div class="control-group voice-group" id="voice-group" hidden>
                    <label class="control-label">语音识别</label>
                    <div class="row">
                        <button id="btn-voice-start" class="btn btn-primary">🎙 开始语音</button>
                        <button id="btn-voice-stop" class="btn">停止</button>
                    </div>
                    <div id="voice-status" class="voice-status" aria-live="polite">未启动</div>
                    <div id="voice-transcript" class="voice-transcript" aria-live="polite"></div>
                </div>

                <div class="control-group">
                    <label class="control-label">对局控制</label>
                    <div class="btn-row">
                        <button id="btn-pass" class="btn">停一手</button>
                        <button id="btn-undo" class="btn">悔棋</button>
                        <button id="btn-resign" class="btn btn-danger">认输</button>
                        <button id="btn-reset" class="btn">重置此局</button>
                    </div>
                </div>

                <div class="control-group">
                    <label class="control-label">AI 对手</label>
                    <div class="row">
                        <select id="select-ai" class="text-input" aria-label="AI类型">
                            <option value="random">随机AI</option>
                            <option value="simple">简易策略AI</option>
                            <option value="katago">Katago (需配置)</option>
                        </select>
                        <button id="btn-ai-move" class="btn">AI立即落子</button>
                    </div>
                    <label class="checkbox">
                        <input type="checkbox" id="checkbox-auto-ai" checked>
                        <span>我落子后自动AI回应</span>
                    </label>
                </div>

                <div class="control-group">
                    <label class="control-label">棋盘设置</label>
                    <div class="row">
                        <label class="label-inline">路数:</label>
                        <select id="select-board-size" class="text-input">
                            <option value="19" selected>19×19</option>
                            <option value="13">13×13</option>
                            <option value="9">9×9</option>
                        </select>
                    </div>
                    <div class="row">
                        <label class="label-inline">坐标:</label>
                        <select id="select-coord-style" class="text-input">
                            <option value="int" selected>国际 (A-T / 1-19)</option>
                            <option value="cn">中文 (路/路)</option>
                            <option value="kr">韩式</option>
                            <option value="none">关闭</option>
                        </select>
                    </div>
                    <label class="checkbox">
                        <input type="checkbox" id="checkbox-show-num" checked>
                        <span>显示手数编号</span>
                    </label>
                    <label class="checkbox">
                        <input type="checkbox" id="checkbox-blind">
                        <span>隐藏棋盘（盲棋只看文字）</span>
                    </label>
                </div>

                <div class="control-group">
                    <label class="control-label">棋谱文本</label>
                    <div id="move-text" class="move-text" aria-live="polite">（暂无）</div>
                </div>

                <div class="control-group">
                    <label class="control-label">键盘快捷键</label>
                    <div class="kbd-hint">
                        <p><kbd>Enter</kbd> 提交输入框坐标</p>
                        <p><kbd>U</kbd> 悔棋 &nbsp; <kbd>P</kbd> 停一手 &nbsp; <kbd>R</kbd> AI落子</p>
                        <p><kbd>1</kbd>-<kbd>9</kbd>,<kbd>0</kbd> 快速切换对局 (Alt+编号上一个10组)</p>
                        <p><kbd>/</kbd> 聚焦输入框</p>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <script src="js/go.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/sgf.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
