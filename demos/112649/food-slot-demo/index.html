<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什么——智能餐食决策老虎机</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
  }
  .container { max-width: 480px; margin: 0 auto; padding: 24px 16px; }

  /* 标题 */
  .header { text-align: center; margin-bottom: 20px; }
  .header-icon { font-size: 36px; margin-bottom: 4px; }
  .header h1 { font-size: 26px; font-weight: 800; background: linear-gradient(90deg, #ffd700, #ffaa00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 2px; }
  .header .time-label { font-size: 13px; color: #90a4ae; margin-top: 4px; }

  /* 老虎机外壳 */
  .slot-machine {
    background: linear-gradient(145deg, #2d2d44 0%, #1e1e32 100%);
    border-radius: 24px;
    padding: 20px 16px 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    border: 2px solid #3a3a55;
    position: relative;
  }
  .slot-machine::before {
    content: '';
    position: absolute;
    top: -2px; left: 20px; right: 20px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #ffd700, transparent);
    border-radius: 3px;
  }
  .slot-label {
    text-align: center;
    font-size: 12px;
    color: #ffd700;
    letter-spacing: 4px;
    margin-bottom: 12px;
    font-weight: 600;
  }

  /* 三个槽位 */
  .slots-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .slot-window {
    width: 90px;
    height: 120px;
    background: linear-gradient(180deg, #0a0a1a 0%, #12122a 100%);
    border-radius: 14px;
    border: 3px solid #ffd700;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 4px 12px rgba(0,0,0,0.6), 0 0 16px rgba(255,215,0,0.15);
  }
  .slot-window::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.4) 100%);
    pointer-events: none;
    z-index: 2;
  }
  .slot-strip {
    position: absolute;
    left: 0; right: 0;
    top: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    will-change: transform;
  }
  .slot-item {
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    color: #ffd700;
    text-align: center;
    padding: 0 6px;
    width: 100%;
    word-break: break-all;
    line-height: 1.3;
  }
  .slot-window .shine {
    position: absolute;
    top: 8px; left: 8px; right: 8px;
    height: 20px;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent);
    border-radius: 8px;
    pointer-events: none;
    z-index: 3;
  }

  /* 摇杆区 */
  .lever-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 4px;
  }
  .lever-btn {
    width: 100%;
    max-width: 220px;
    padding: 16px 28px;
    background: linear-gradient(145deg, #e53935 0%, #c62828 100%);
    border: none;
    border-radius: 50px;
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 0 #8e0000, 0 8px 20px rgba(229,57,53,0.4);
    transition: all 0.1s ease;
    letter-spacing: 2px;
    position: relative;
    overflow: hidden;
  }
  .lever-btn:active {
    transform: translateY(6px);
    box-shadow: 0 0 0 #8e0000, 0 2px 8px rgba(229,57,53,0.4);
  }
  .lever-btn:disabled {
    background: linear-gradient(145deg, #555, #444);
    box-shadow: 0 6px 0 #333, 0 8px 20px rgba(0,0,0,0.3);
    cursor: not-allowed;
  }
  .lever-btn .btn-glow {
    position: absolute;
    top: 0; left: -50%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    animation: shine 2s infinite;
  }
  @keyframes shine {
    0% { left: -50%; }
    100% { left: 150%; }
  }

  /* 食物管理 */
  .food-manager {
    margin-top: 24px;
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 16px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .food-manager h3 {
    font-size: 14px;
    color: #ffd700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .food-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .food-input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.25);
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  .food-input::placeholder { color: #78909c; }
  .add-btn {
    padding: 10px 18px;
    background: linear-gradient(145deg, #43a047, #2e7d32);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
  }
  .food-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .food-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    font-size: 13px;
    color: #e0e0e0;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .food-tag .del {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    line-height: 1;
  }
  .food-tag .del:hover { background: #e53935; }

  /* 结果弹窗 */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: linear-gradient(145deg, #2d2d44, #1e1e32);
    border-radius: 24px;
    padding: 28px 24px;
    width: 100%;
    max-width: 360px;
    text-align: center;
    border: 2px solid #ffd700;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }
  .modal-box .result-title {
    font-size: 20px;
    font-weight: 800;
    color: #ffd700;
    margin-bottom: 16px;
  }
  .result-items {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .result-item {
    background: rgba(255,215,0,0.1);
    border: 1px solid rgba(255,215,0,0.3);
    border-radius: 12px;
    padding: 12px;
    font-size: 16px;
    font-weight: 700;
    color: #ffd700;
  }
  .result-advice {
    font-size: 13px;
    color: #b0bec5;
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .modal-close {
    padding: 12px 36px;
    background: linear-gradient(145deg, #e53935, #c62828);
    border: none;
    border-radius: 50px;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  /* 底部 */
  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 11px;
    color: #546e7a;
  }

  /*  confetti */
  .confetti-container {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 99;
    overflow: hidden;
  }
  .confetti {
    position: absolute;
    width: 8px; height: 8px;
    animation: confetti-fall 2.5s ease-out forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* 滚动动画 */
  @keyframes slot-scroll {
    0% { transform: translateY(0); }
    100% { transform: translateY(var(--scroll-distance)); }
  }

  .slot-window .center-line {
    position: absolute;
    top: 50%; left: 4px; right: 4px;
    height: 2px;
    background: rgba(255,215,0,0.3);
    transform: translateY(-50%);
    pointer-events: none;
    z-index: 4;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-icon">🎰</div>
    <h1 id="pageTitle">今天吃什么</h1>
    <div class="time-label" id="timeLabel">智能餐食决策老虎机</div>
  </div>

  <div class="slot-machine">
    <div class="slot-label">★ MEAL SLOT ★</div>
    <div class="slots-row">
      <div class="slot-window">
        <div class="shine"></div>
        <div class="center-line"></div>
        <div class="slot-strip" id="slot0"></div>
      </div>
      <div class="slot-window">
        <div class="shine"></div>
        <div class="center-line"></div>
        <div class="slot-strip" id="slot1"></div>
      </div>
      <div class="slot-window">
        <div class="shine"></div>
        <div class="center-line"></div>
        <div class="slot-strip" id="slot2"></div>
      </div>
    </div>
    <div class="lever-area">
      <button class="lever-btn" id="spinBtn" onclick="spin()">
        <span class="btn-glow"></span>
        🎲 拉动摇杆
      </button>
    </div>
  </div>

  <div class="food-manager">
    <h3>🍽️ 食物清单（点击 × 删除）</h3>
    <div class="food-input-row">
      <input type="text" class="food-input" id="foodInput" placeholder="输入食物名称..." onkeydown="if(event.key==='Enter')addFood()">
      <button class="add-btn" onclick="addFood()">添加</button>
    </div>
    <div class="food-tags" id="foodTags"></div>
  </div>

  <div class="footer">无需注册 · 点击即玩 · 让运气决定你的下一餐</div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-box">
    <div class="result-title">🎉 今天推荐你吃</div>
    <div class="result-items" id="resultItems"></div>
    <div class="result-advice" id="resultAdvice"></div>
    <button class="modal-close" onclick="closeModal()">太棒了，开吃！</button>
  </div>
</div>

<div class="confetti-container" id="confettiContainer"></div>

<script>
  // 默认食物
  const defaultFoods = [
    '麻辣烫', '黄焖鸡', '兰州拉面', '蛋炒饭', '盖浇饭',
    '汉堡套餐', '日式便当', '火锅', '烧烤', '轻食沙拉',
    '披萨', '炸鸡', '馄饨', '牛肉面', '猪脚饭',
    '螺蛳粉', '煎饼果子', '寿司', '拌饭', '水饺'
  ];
  const STORAGE_KEY = 'mealslot_foods_v1';

  function getFoods() {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : [...defaultFoods];
  }
  function saveFoods(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  let foods = getFoods();
  let isSpinning = false;

  // 时间标题
  function updateTitle() {
    const h = new Date().getHours();
    let title = '今天吃什么';
    if (h >= 5 && h <= 10) title = '早上吃什么';
    else if (h >= 11 && h <= 14) title = '中午吃什么';
    else if (h >= 15 && h <= 16) title = '下午茶吃什么';
    else if (h >= 17 && h <= 21) title = '晚上吃什么';
    else title = '夜宵吃什么';
    document.getElementById('pageTitle').textContent = title;
    document.getElementById('timeLabel').textContent = title + ' · 智能餐食决策老虎机';
  }
  updateTitle();

  // 渲染食物标签
  function renderTags() {
    const box = document.getElementById('foodTags');
    box.innerHTML = foods.map((f, i) =>
      `<span class="food-tag">${f}<span class="del" onclick="removeFood(${i})">×</span></span>`
    ).join('');
  }
  renderTags();

  function addFood() {
    const input = document.getElementById('foodInput');
    const name = input.value.trim();
    if (!name) return;
    if (foods.includes(name)) { input.value = ''; return; }
    foods.push(name);
    saveFoods(foods);
    renderTags();
    input.value = '';
  }
  function removeFood(i) {
    if (foods.length <= 3) { alert('至少需要保留 3 个食物选项哦！'); return; }
    foods.splice(i, 1);
    saveFoods(foods);
    renderTags();
  }

  // 生成随机结果 1-3 个
  function pickResults() {
    const count = Math.floor(Math.random() * 3) + 1; // 1-3
    const pool = [...foods];
    const results = [];
    for (let i = 0; i < count && pool.length > 0; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      results.push(pool.splice(idx, 1)[0]);
    }
    return results;
  }

  // 生成建议文案
  function getAdvice(results) {
    if (results.length === 1) return `别犹豫了，${results[0]} 就是今天的最佳选择！相信自己的直觉，冲就完事了！`;
    if (results.length === 2) return `有点纠结对吧？${results[0]} 和 ${results[1]} 都不错，抛个硬币决定吧！或者……两顿都吃？`;
    return `选择困难症晚期？没关系，从 ${results.join('、')} 里闭眼选一个，每一口都是幸福的味道！`;
  }

  // 初始化槽位内容
  function initSlots() {
    for (let s = 0; s < 3; s++) {
      const strip = document.getElementById('slot' + s);
      // 复制多份食物形成长条
      let items = [];
      for (let r = 0; r < 8; r++) items = items.concat([...foods]);
      strip.innerHTML = items.map(f => `<div class="slot-item">${f}</div>`).join('');
      // 初始显示随机位置
      const startIdx = Math.floor(Math.random() * foods.length) + foods.length * 3;
      strip.style.transform = `translateY(-${startIdx * 120}px)`;
    }
  }
  initSlots();

  function spin() {
    if (isSpinning) return;
    isSpinning = true;
    document.getElementById('spinBtn').disabled = true;

    const results = pickResults();
    const resultCount = results.length;

    // 重新初始化长条确保有足够长度滚动
    for (let s = 0; s < 3; s++) {
      const strip = document.getElementById('slot' + s);
      let items = [];
      for (let r = 0; r < 10; r++) items = items.concat([...foods]);
      strip.innerHTML = items.map(f => `<div class="slot-item">${f}</div>`).join('');
      strip.style.transition = 'none';
      strip.style.transform = `translateY(0px)`;
    }

    // 强制重排
    void document.body.offsetHeight;

    // 为每个槽位计算最终位置
    const slotResults = [];
    for (let s = 0; s < 3; s++) {
      if (s < resultCount) {
        // 这个结果要在该槽位显示
        const targetFood = results[s];
        const strip = document.getElementById('slot' + s);
        // 在 strip 中找到 targetFood 的某个出现位置（靠后的）
        const itemEls = strip.querySelectorAll('.slot-item');
        let targetIdx = -1;
        for (let i = itemEls.length - 1; i >= 0; i--) {
          if (itemEls[i].textContent === targetFood) {
            targetIdx = i;
            break;
          }
        }
        if (targetIdx === -1) targetIdx = Math.floor(Math.random() * foods.length) + foods.length * 5;
        slotResults.push({ idx: targetIdx, food: targetFood });
      } else {
        // 不使用的槽位也滚动但无所谓停在哪儿
        const randomIdx = Math.floor(Math.random() * foods.length) + foods.length * 5;
        slotResults.push({ idx: randomIdx, food: null });
      }
    }

    // 开始动画
    for (let s = 0; s < 3; s++) {
      const strip = document.getElementById('slot' + s);
      const targetIdx = slotResults[s].idx;
      const distance = targetIdx * 120;
      const duration = 1.5 + s * 0.4; // 依次停止
      strip.style.transition = `transform ${duration}s cubic-bezier(0.15, 0.9, 0.3, 1)`;
      strip.style.transform = `translateY(-${distance}px)`;
    }

    // 动画结束后显示结果
    const totalDuration = (1.5 + (resultCount - 1) * 0.4) * 1000 + 300;
    setTimeout(() => {
      isSpinning = false;
      document.getElementById('spinBtn').disabled = false;
      showResult(results);
    }, totalDuration);
  }

  function showResult(results) {
    const box = document.getElementById('resultItems');
    box.innerHTML = results.map(f => `<div class="result-item">${f}</div>`).join('');
    document.getElementById('resultAdvice').textContent = getAdvice(results);
    document.getElementById('modalOverlay').classList.add('active');
    spawnConfetti();
  }

  function closeModal(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('modalOverlay').classList.remove('active');
  }

  function spawnConfetti() {
    const container = document.getElementById('confettiContainer');
    container.innerHTML = '';
    const colors = ['#ffd700', '#ff5252', '#448aff', '#69f0ae', '#e040fb', '#ffab40'];
    for (let i = 0; i < 40; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDelay = Math.random() * 1 + 's';
      el.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      el.style.width = (6 + Math.random() * 6) + 'px';
      el.style.height = (6 + Math.random() * 6) + 'px';
      container.appendChild(el);
    }
    setTimeout(() => { container.innerHTML = ''; }, 3500);
  }
</script>

</body>
</html>
