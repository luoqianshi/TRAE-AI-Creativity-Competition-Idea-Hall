<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词境阁 · AI主题闪卡&错题归集工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'gufeng': ['"Ma Shan Zheng"', 'cursive'],
                        'serif-sc': ['"Noto Serif SC"', 'serif'],
                        'xianxia': ['"ZCOOL XiaoWei"', 'serif'],
                        'anime': ['"ZCOOL KuaiLe"', 'cursive'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-primary: #f5f0e8;
            --bg-secondary: #e8e0d0;
            --bg-card: #faf6ed;
            --text-primary: #2c1810;
            --text-secondary: #5c4033;
            --accent: #8b4513;
            --accent-light: #d4a574;
            --border: #c4a882;
            --shadow: rgba(44, 24, 16, 0.15);
            --gradient-start: #f5f0e8;
            --gradient-end: #e8ddd0;
            --font-title: 'Ma Shan Zheng', cursive;
            --font-body: 'Noto Serif SC', serif;
            --pattern-opacity: 0.03;
            --card-border: 2px solid #c4a882;
            --btn-radius: 8px;
            --transition-speed: 0.5s;
        }
        [data-theme="xianxia"] {
            --bg-primary: #0a1628;
            --bg-secondary: #0d1f3a;
            --bg-card: rgba(13, 31, 58, 0.85);
            --text-primary: #e0f0ff;
            --text-secondary: #8ec5e8;
            --accent: #00d4ff;
            --accent-light: #5ce1ff;
            --border: rgba(0, 212, 255, 0.3);
            --shadow: rgba(0, 212, 255, 0.2);
            --gradient-start: #0a1628;
            --gradient-end: #0d2b4a;
            --font-title: 'ZCOOL XiaoWei', serif;
            --font-body: 'Noto Serif SC', serif;
            --pattern-opacity: 0.08;
            --card-border: 1px solid rgba(0, 212, 255, 0.4);
            --btn-radius: 20px;
            --transition-speed: 0.6s;
        }
        [data-theme="anime"] {
            --bg-primary: #fff5f8;
            --bg-secondary: #ffe0ec;
            --bg-card: #ffffff;
            --text-primary: #ff6b9d;
            --text-secondary: #ff8fab;
            --accent: #ff6b9d;
            --accent-light: #ffb3c6;
            --border: #ffc2d1;
            --shadow: rgba(255, 107, 157, 0.2);
            --gradient-start: #fff5f8;
            --gradient-end: #ffe0ec;
            --font-title: 'ZCOOL KuaiLe', cursive;
            --font-body: 'ZCOOL KuaiLe', cursive;
            --pattern-opacity: 0.06;
            --card-border: 3px solid #ffc2d1;
            --btn-radius: 16px;
            --transition-speed: 0.4s;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: var(--text-primary);
            min-height: 100vh;
            transition: background var(--transition-speed) ease, color var(--transition-speed) ease;
            overflow-x: hidden;
        }
        .bg-texture {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; opacity: var(--pattern-opacity);
            transition: opacity var(--transition-speed) ease;
        }
        .theme-gufeng .bg-texture {
            background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 100 Q50 50 100 100 T200 100' stroke='%238b4513' fill='none' stroke-width='0.5'/%3E%3Cpath d='M0 120 Q50 70 100 120 T200 120' stroke='%238b4513' fill='none' stroke-width='0.5'/%3E%3C/svg%3E");
        }
        .theme-xianxia .bg-texture {
            background: radial-gradient(ellipse at 20% 50%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 20%, rgba(100, 200, 255, 0.08) 0%, transparent 50%);
        }
        .theme-anime .bg-texture {
            background-image: radial-gradient(circle, #ffc2d1 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .navbar {
            position: relative; z-index: 100; backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            transition: all var(--transition-speed) ease;
        }
        .theme-gufeng .navbar { background: rgba(245, 240, 232, 0.9); }
        .theme-xianxia .navbar { background: rgba(10, 22, 40, 0.85); box-shadow: 0 0 20px rgba(0, 212, 255, 0.15); }
        .theme-anime .navbar { background: rgba(255, 245, 248, 0.9); }
        .nav-title {
            font-family: var(--font-title); font-size: 1.6rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .theme-btn {
            padding: 0.4rem 1rem; border-radius: var(--btn-radius); border: 2px solid var(--border);
            background: transparent; color: var(--text-secondary); font-family: var(--font-body);
            cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .theme-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--shadow); }
        .theme-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .theme-gufeng .theme-btn.active { background: #8b4513; }
        .theme-xianxia .theme-btn.active { background: #00d4ff; box-shadow: 0 0 15px rgba(0, 212, 255, 0.5); }
        .theme-anime .theme-btn.active { background: #ff6b9d; box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4); }
        .page-tab {
            padding: 0.5rem 1.5rem; border-radius: var(--btn-radius); border: 2px solid var(--border);
            background: transparent; color: var(--text-secondary); font-family: var(--font-title);
            cursor: pointer; transition: all 0.3s ease; font-size: 1rem;
        }
        .page-tab:hover { background: var(--bg-secondary); }
        .page-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
        .main-container {
            position: relative; z-index: 10; max-width: 1400px; margin: 0 auto;
            padding: 1.5rem; min-height: calc(100vh - 80px);
        }
        .panel {
            background: var(--bg-card); border: var(--card-border); border-radius: var(--btn-radius);
            padding: 1.5rem; box-shadow: 0 4px 20px var(--shadow);
            transition: all var(--transition-speed) ease;
        }
        .theme-xianxia .panel { backdrop-filter: blur(10px); background: rgba(13, 31, 58, 0.7); }
        .panel-title {
            font-family: var(--font-title); font-size: 1.3rem; margin-bottom: 1rem;
            color: var(--accent); display: flex; align-items: center; gap: 0.5rem;
        }
        .word-input {
            width: 100%; min-height: 180px; padding: 1rem;
            border: 2px solid var(--border); border-radius: var(--btn-radius);
            background: var(--bg-primary); color: var(--text-primary);
            font-family: var(--font-body); font-size: 1rem; resize: vertical;
            transition: all 0.3s ease;
        }
        .word-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px var(--shadow); }
        .theme-xianxia .word-input { background: rgba(10, 22, 40, 0.6); }
        .btn-primary {
            width: 100%; padding: 0.875rem; border: none; border-radius: var(--btn-radius);
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white; font-family: var(--font-title); font-size: 1.1rem;
            cursor: pointer; transition: all 0.3s ease; overflow: hidden; margin-top: 0.75rem;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--shadow); }
        .btn-secondary {
            width: 100%; padding: 0.75rem; border: 2px solid var(--border); border-radius: var(--btn-radius);
            background: transparent; color: var(--text-secondary); font-family: var(--font-body);
            font-size: 1rem; cursor: pointer; transition: all 0.3s ease; margin-top: 0.5rem;
        }
        .btn-secondary:hover { background: var(--bg-secondary); border-color: var(--accent); }
        .btn-export {
            padding: 0.75rem 1.5rem; border: 2px solid var(--accent); border-radius: var(--btn-radius);
            background: var(--bg-card); color: var(--accent); font-family: var(--font-title);
            font-size: 1rem; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-export:hover { background: var(--accent); color: white; transform: translateY(-2px); box-shadow: 0 4px 15px var(--shadow); }
        .flashcard-container { perspective: 1000px; width: 100%; max-width: 400px; height: 280px; margin: 1rem 0; cursor: pointer; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .flashcard.flipped { transform: rotateY(180deg); }
        .flashcard-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            border-radius: var(--btn-radius); border: var(--card-border);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 2rem; box-shadow: 0 8px 32px var(--shadow); transition: all var(--transition-speed) ease;
        }
        .flashcard-front { background: var(--bg-card); }
        .flashcard-back { background: var(--bg-card); transform: rotateY(180deg); }
        .theme-xianxia .flashcard-face { backdrop-filter: blur(10px); background: rgba(13, 31, 58, 0.8); }
        .theme-gufeng .flashcard-face { background: linear-gradient(135deg, #faf6ed, #f0e8d8); }
        .theme-anime .flashcard-face { background: linear-gradient(135deg, #ffffff, #fff0f5); }
        .card-word { font-family: var(--font-title); font-size: 2.5rem; color: var(--accent); margin-bottom: 0.5rem; }
        .card-phonetic { font-size: 1.2rem; color: var(--text-secondary); font-style: italic; }
        .card-meaning { font-size: 1.3rem; color: var(--text-primary); text-align: center; margin-bottom: 1rem; line-height: 1.6; }
        .card-mnemonic { font-size: 1rem; color: var(--accent); text-align: center; padding: 0.75rem; border-radius: var(--btn-radius); background: var(--bg-secondary); font-style: italic; }
        .card-etymology { font-size: 0.9rem; color: var(--text-secondary); margin-top: 0.75rem; text-align: center; }
        .card-nav { display: flex; align-items: center; gap: 1rem; margin-top: 1rem; }
        .nav-arrow { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--border); background: var(--bg-card); color: var(--accent); font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; }
        .nav-arrow:hover { background: var(--accent); color: white; transform: scale(1.1); }
        .card-counter { font-family: var(--font-title); font-size: 1.1rem; color: var(--text-secondary); }
        .game-stats { display: flex; justify-content: space-between; margin-bottom: 1rem; padding: 0.75rem; background: var(--bg-secondary); border-radius: var(--btn-radius); }
        .stat-item { text-align: center; }
        .stat-value { font-family: var(--font-title); font-size: 1.5rem; color: var(--accent); }
        .stat-label { font-size: 0.8rem; color: var(--text-secondary); }
        .progress-bar { width: 100%; height: 12px; background: var(--bg-secondary); border-radius: 6px; overflow: hidden; margin: 1rem 0; border: 1px solid var(--border); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-light)); border-radius: 6px; transition: width 0.5s ease; }
        .quiz-area { margin-top: 1rem; padding: 1rem; background: var(--bg-primary); border-radius: var(--btn-radius); border: 1px solid var(--border); }
        .quiz-word { font-family: var(--font-title); font-size: 1.5rem; text-align: center; color: var(--accent); margin-bottom: 1rem; }
        .quiz-options { display: flex; flex-direction: column; gap: 0.5rem; }
        .quiz-option { padding: 0.75rem; border: 2px solid var(--border); border-radius: var(--btn-radius); background: var(--bg-card); color: var(--text-primary); font-family: var(--font-body); cursor: pointer; transition: all 0.3s ease; text-align: left; }
        .quiz-option:hover { border-color: var(--accent); background: var(--bg-secondary); }
        .quiz-option.correct { border-color: #4ade80; background: rgba(74, 222, 128, 0.2); }
        .quiz-option.wrong { border-color: #f87171; background: rgba(248, 113, 113, 0.2); }
        .quiz-hint { margin-top: 0.75rem; padding: 0.75rem; background: var(--bg-secondary); border-radius: var(--btn-radius); color: var(--accent); font-style: italic; text-align: center; display: none; }
        .reward-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; display: none; align-items: center; justify-content: center; }
        .reward-overlay.show { display: flex; }
        .reward-text { font-family: var(--font-title); font-size: 3rem; color: var(--accent); animation: rewardPop 1s ease forwards; text-shadow: 0 0 20px var(--shadow); }
        @keyframes rewardPop { 0% { transform: scale(0) rotate(-10deg); opacity: 0; } 50% { transform: scale(1.2) rotate(5deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); opacity: 0; } }
        .theme-gufeng .reward-text::before { content: '✦ '; } .theme-gufeng .reward-text::after { content: ' ✦'; }
        .theme-xianxia .reward-text { text-shadow: 0 0 30px rgba(0, 212, 255, 0.8), 0 0 60px rgba(0, 212, 255, 0.4); }
        .theme-anime .reward-text { animation: rewardBounce 1s ease forwards; }
        @keyframes rewardBounce { 0% { transform: scale(0) translateY(50px); opacity: 0; } 40% { transform: scale(1.1) translateY(-20px); opacity: 1; } 60% { transform: scale(0.95) translateY(10px); } 100% { transform: scale(1) translateY(0); opacity: 0; } }
        .bottom-bar { position: relative; z-index: 10; max-width: 1400px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
        .particle { position: absolute; border-radius: 50%; opacity: 0.6; animation: float 8s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0) translateX(0); opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.6; } 50% { transform: translateY(-100vh) translateX(50px); } }
        .crane { position: fixed; top: 20%; right: -100px; width: 60px; height: 60px; opacity: 0; z-index: 2; pointer-events: none; }
        .theme-xianxia .crane { animation: craneFly 15s infinite linear; }
        @keyframes craneFly { 0% { right: -100px; opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.6; } 100% { right: 110%; opacity: 0; } }
        @media (max-width: 768px) {
            .nav-title { font-size: 1.2rem; } .theme-buttons { flex-wrap: wrap; gap: 0.3rem; }
            .theme-btn { padding: 0.3rem 0.6rem; font-size: 0.8rem; }
            .flashcard-container { height: 240px; } .card-word { font-size: 2rem; }
            .main-container { padding: 1rem; } .panel { padding: 1rem; }
        }
        @media print { .navbar, .left-panel, .right-panel, .bottom-bar, .particles, .bg-texture { display: none !important; } }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: var(--bg-secondary); } ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
        .empty-state { text-align: center; color: var(--text-secondary); padding: 2rem; }
        .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
        .card-thumbnails { display: flex; gap: 0.5rem; margin-top: 1rem; overflow-x: auto; padding-bottom: 0.5rem; }
        .card-thumb { min-width: 60px; height: 40px; border: 2px solid var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; cursor: pointer; transition: all 0.3s ease; background: var(--bg-card); color: var(--text-secondary); }
        .card-thumb:hover, .card-thumb.active { border-color: var(--accent); background: var(--accent); color: white; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid var(--border); border-radius: 50%; border-top-color: var(--accent); animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== 错题归集页样式 ===== */
        .mistake-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem; border: 1px solid var(--border); border-radius: var(--btn-radius); margin-bottom: 0.5rem; background: var(--bg-card); transition: all 0.3s ease; }
        .mistake-item:hover { border-color: var(--accent); box-shadow: 0 2px 8px var(--shadow); }
        .mistake-item.selected { border-color: var(--accent); background: var(--bg-secondary); }
        .mistake-checkbox { width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent); }
        .mistake-content { flex: 1; }
        .mistake-word { font-family: var(--font-title); font-size: 1.1rem; color: var(--accent); }
        .mistake-meaning { font-size: 0.9rem; color: var(--text-secondary); }
        .mistake-tag { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; margin-left: 0.5rem; }
        .tag-english { background: rgba(139, 69, 19, 0.15); color: #8b4513; }
        .tag-math { background: rgba(0, 212, 255, 0.15); color: #00a8cc; }
        .tag-chinese { background: rgba(255, 107, 157, 0.15); color: #ff6b9d; }
        .tag-comprehensive { background: rgba(100, 200, 100, 0.15); color: #4ade80; }
        .mistake-actions { display: flex; gap: 0.5rem; }
        .mistake-btn { padding: 0.3rem 0.6rem; border: 1px solid var(--border); border-radius: 4px; background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 0.8rem; transition: all 0.3s ease; }
        .mistake-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
        .camera-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; border: 2px solid var(--border); border-radius: var(--btn-radius); overflow: hidden; background: var(--bg-primary); }
        .camera-video { width: 100%; display: block; }
        .camera-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); }
        .camera-btn { padding: 1rem 2rem; border: none; border-radius: var(--btn-radius); background: var(--accent); color: white; font-family: var(--font-title); font-size: 1.2rem; cursor: pointer; transition: all 0.3s ease; }
        .camera-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--shadow); }
        .camera-canvas { display: none; }
        .preview-image { width: 100%; max-width: 500px; border: 2px solid var(--border); border-radius: var(--btn-radius); margin: 1rem auto; display: block; }
        .ocr-result { padding: 1rem; background: var(--bg-secondary); border-radius: var(--btn-radius); margin-top: 1rem; border: 1px solid var(--border); }
        .ocr-text { font-family: var(--font-body); color: var(--text-primary); white-space: pre-wrap; line-height: 1.6; }
        .tag-filter { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .tag-filter-btn { padding: 0.4rem 0.8rem; border: 2px solid var(--border); border-radius: var(--btn-radius); background: transparent; color: var(--text-secondary); cursor: pointer; transition: all 0.3s ease; font-size: 0.9rem; }
        .tag-filter-btn:hover, .tag-filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .batch-actions { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .mode-selector { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .mode-btn { padding: 0.5rem 1rem; border: 2px solid var(--border); border-radius: var(--btn-radius); background: transparent; color: var(--text-secondary); cursor: pointer; transition: all 0.3s ease; font-family: var(--font-body); }
        .mode-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .hidden { display: none !important; }
        .grid-layout { display: grid; grid-template-columns: 300px 1fr 300px; gap: 1.5rem; }
        @media (max-width: 1024px) { .grid-layout { grid-template-columns: 1fr; gap: 1rem; } }
        .two-col-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        @media (max-width: 1024px) { .two-col-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="theme-gufeng" data-theme="gufeng">
    <div class="bg-texture"></div>
    <div class="particles" id="particles"></div>
    <svg class="crane" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 50 Q40 30 60 45 Q70 50 80 40" stroke="rgba(200,230,255,0.6)" stroke-width="2" fill="none"/>
        <path d="M60 45 Q65 35 70 30" stroke="rgba(200,230,255,0.6)" stroke-width="2" fill="none"/>
        <circle cx="70" cy="30" r="3" fill="rgba(200,230,255,0.6)"/>
        <path d="M70 30 L75 25 M70 30 L75 35" stroke="rgba(200,230,255,0.6)" stroke-width="1"/>
    </svg>
    <div class="reward-overlay" id="rewardOverlay">
        <div class="reward-text" id="rewardText">答对了！</div>
    </div>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 flex-wrap gap-2">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">📖</span>
                    <h1 class="nav-title">词境阁 · AI闪卡&错题归集</h1>
                </div>
                <div class="flex items-center gap-3 flex-wrap">
                    <div class="flex gap-1">
                        <button class="page-tab active" id="tabFlashcard" onclick="switchPage('flashcard')">🎯 闪卡生成</button>
                        <button class="page-tab" id="tabMistake" onclick="switchPage('mistake')">📷 错题归集</button>
                    </div>
                    <div class="flex gap-1">
                        <button class="theme-btn active" data-theme="gufeng" onclick="switchTheme('gufeng')">🎋 古风</button>
                        <button class="theme-btn" data-theme="xianxia" onclick="switchTheme('xianxia')">☁️ 仙侠</button>
                        <button class="theme-btn" data-theme="anime" onclick="switchTheme('anime')">🌸 动漫</button>
                    </div>
                </div>

    <script>
        // ===== 全局状态 =====
        let cards = [];
        let currentIndex = 0;
        let isFlipped = false;
        let score = 0;
        let streak = 0;
        let todayCount = 0;
        let currentLevel = 1;
        let levelProgress = 0;
        let quizIndex = 0;
        let isQuizActive = false;
        let currentMode = 'word';
        let currentPage = 'flashcard';
        let mistakeBank = [];
        let selectedMistakes = new Set();
        let currentFilter = 'all';
        let cameraStream = null;
        let ocrTextResult = '';

        // ===== 模拟数据库 =====
        const mockDatabase = {
            'abandon': { phonetic: '/əˈbændən/', meaning: '放弃，抛弃', mnemonic: 'a(一个) + band(乐队) + on(上) → 一个乐队上台后被抛弃了', etymology: '来自古法语 abandoner', answer: '', solution: '' },
            'ability': { phonetic: '/əˈbɪləti/', meaning: '能力，才能', mnemonic: 'a(一) + bili(比利) + ty(踢) → 比利一脚踢出了能力', etymology: '源自拉丁语 habilitas', answer: '', solution: '' },
            'absence': { phonetic: '/ˈæbsəns/', meaning: '缺席，缺乏', mnemonic: 'ab(不) + sent(送) + ce → 不送人来，就是缺席', etymology: '来自拉丁语 absentia', answer: '', solution: '' },
            'absolute': { phonetic: '/ˈæbsəluːt/', meaning: '绝对的，完全的', mnemonic: 'ab(不) + solute(溶解) → 绝不溶解，绝对不变', etymology: '源自拉丁语 absolutus', answer: '', solution: '' },
            'academic': { phonetic: '/ˌækəˈdemɪk/', meaning: '学术的，学院的', mnemonic: 'a(一个) + ca(擦) + demic(底面) → 一个擦底面的学术实验', etymology: '源自希腊语 Akademeia', answer: '', solution: '' },
            'accept': { phonetic: '/əkˈsept/', meaning: '接受，认可', mnemonic: 'ac(一再) + cept(拿) → 一再拿过来，就是接受', etymology: '来自拉丁语 acceptare', answer: '', solution: '' },
            'access': { phonetic: '/ˈækses/', meaning: '进入，通道', mnemonic: 'ac(一再) + cess(走) → 一再走过去，找到入口', etymology: '源自拉丁语 accessus', answer: '', solution: '' },
            'accident': { phonetic: '/ˈæksɪdənt/', meaning: '事故，意外', mnemonic: 'ac(一再) + ci(刺) + dent(牙) → 一再刺到牙，真是意外', etymology: '来自拉丁语 accidens', answer: '', solution: '' },
            'account': { phonetic: '/əˈkaʊnt/', meaning: '账户，解释', mnemonic: 'ac(一再) + count(数) → 一再数钱，核对账户', etymology: '源自古法语 acont', answer: '', solution: '' },
            'achieve': { phonetic: '/əˈtʃiːv/', meaning: '达到，实现', mnemonic: 'a(一) + chieve(Chief首领) → 一个首领实现了目标', etymology: '源自古法语 achever', answer: '', solution: '' },
        };

        const subjectDatabase = {
            '1+1=?': { meaning: '2', mnemonic: '最基本的加法，一个苹果加一个苹果等于两个苹果', etymology: '算术基础', answer: '2', solution: '直接相加：1 + 1 = 2' },
            '勾股定理': { meaning: '直角三角形两直角边的平方和等于斜边的平方', mnemonic: '勾三股四弦五，直角三角形要记住', etymology: '中国古代数学成就', answer: 'a²+b²=c²', solution: '在直角三角形中，设两直角边为a、b，斜边为c，则有a²+b²=c²' },
            '水的化学式': { meaning: 'H₂O', mnemonic: '氢二氧一，生命之源', etymology: '化学基础知识', answer: 'H₂O', solution: '水由两个氢原子和一个氧原子组成，化学式为H₂O' },
            '床前明月光': { meaning: '疑是地上霜', mnemonic: '李白《静夜思》名句，表达思乡之情', etymology: '唐代诗歌', answer: '疑是地上霜', solution: '出自李白《静夜思》：床前明月光，疑是地上霜。举头望明月，低头思故乡。' },
        };

        // ===== 页面切换 =====
        function switchPage(page) {
            currentPage = page;
            document.getElementById('pageFlashcard').classList.toggle('hidden', page !== 'flashcard');
            document.getElementById('pageMistake').classList.toggle('hidden', page !== 'mistake');
            document.getElementById('tabFlashcard').classList.toggle('active', page === 'flashcard');
            document.getElementById('tabMistake').classList.toggle('active', page === 'mistake');
            if (page === 'mistake') { renderMistakeList(); updateMistakeFlashcardArea(); }
        }

        // ===== 模式切换 =====
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('modeWord').classList.toggle('active', mode === 'word');
            document.getElementById('modeSubject').classList.toggle('active', mode === 'subject');
            document.getElementById('inputHint').textContent = mode === 'word' ? '每行输入一个英文单词，支持批量粘贴' : '每行输入一个题目，支持批量粘贴';
            document.getElementById('wordInput').placeholder = mode === 'word' ? '例如：\nabandon\nability\nabsence' : '例如：\n1+1=?\n勾股定理\n水的化学式';
        }

        // ===== 主题切换 =====
        function switchTheme(theme) {
            document.body.className = 'theme-' + theme;
            document.body.setAttribute('data-theme', theme);
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === theme);
            });
            generateParticles(theme);
        }

        function generateParticles(theme) {
            const container = document.getElementById('particles');
            container.innerHTML = '';
            const colors = { gufeng: ['#c4a882', '#8b4513', '#d4a574'], xianxia: ['#00d4ff', '#5ce1ff', '#8ec5e8'], anime: ['#ff6b9d', '#ffb3c6', '#ffc2d1'] };
            const themeColors = colors[theme] || colors.gufeng;
            const particleCount = theme === 'xianxia' ? 30 : 20;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 6 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.background = themeColors[Math.floor(Math.random() * themeColors.length)];
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (Math.random() * 6 + 6) + 's';
                container.appendChild(particle);
            }
        }

        // ===== 生成闪卡 =====
        function generateCards() {
            const input = document.getElementById('wordInput').value;
            const lines = input.split(/[\n\r]+/).map(w => w.trim()).filter(w => w !== '');
            if (lines.length === 0) { alert('请输入至少一个内容！'); return; }
            cards = lines.map(line => generateCardData(line));
            currentIndex = 0; isFlipped = false;
            updateCardDisplay(); updateThumbnails(); updateCardNav(); initQuiz();
            showReward('生成成功！✨');
        }

        function generateCardData(content) {
            content = content.trim();
            const key = content.toLowerCase();
            if (currentMode === 'word' && mockDatabase[key]) {
                return { type: 'word', content, word: content, ...mockDatabase[key] };
            }
            if (currentMode === 'subject' && subjectDatabase[content]) {
                return { type: 'subject', content, word: content, ...subjectDatabase[content] };
            }
            if (currentMode === 'word') {
                return { type: 'word', content, word: content, phonetic: generatePhonetic(content), meaning: generateMeaning(content), mnemonic: generateMnemonic(content), etymology: generateEtymology(content), answer: '', solution: '' };
            } else {
                return { type: 'subject', content, word: content, phonetic: '', meaning: '待解答', mnemonic: '认真思考，仔细分析', etymology: '学科知识', answer: '详见解析', solution: '请查阅教材或请教老师' };
            }
        }

        function generatePhonetic(word) { return '/ˈ' + word.substring(0, Math.min(3, word.length)) + '.../'; }
        function generateMeaning(word) { const meanings = ['重要的，关键的', '美丽的，优雅的', '强大的，有力的', '聪明的，智慧的', '勇敢的，无畏的']; return meanings[word.length % meanings.length]; }
        function generateMnemonic(word) { const prefixes = ['记住', '想象', '联想', '口诀']; return prefixes[word.length % prefixes.length] + '：' + word + '就像你心中的那道光'; }
        function generateEtymology(word) { return '源自古代语言，意为"' + word.split('').reverse().join('').substring(0, 3) + '..."'; }

        function updateCardDisplay() {
            const flashcard = document.getElementById('flashcard');
            if (cards.length === 0) return;
            const card = cards[currentIndex]; isFlipped = false; flashcard.classList.remove('flipped');
            const frontFace = flashcard.querySelector('.flashcard-front');
            const backFace = flashcard.querySelector('.flashcard-back');
            if (card.type === 'word') {
                frontFace.innerHTML = `<div class="card-word">${card.word}</div><div class="card-phonetic">${card.phonetic}</div><div class="card-etymology">${card.etymology}</div>`;
                backFace.innerHTML = `<div class="card-meaning">${card.meaning}</div><div class="card-mnemonic">💡 ${card.mnemonic}</div><div class="card-etymology">${card.etymology}</div>`;
            } else {
                frontFace.innerHTML = `<div class="card-word">${card.content}</div><div class="card-phonetic">学科题目</div><div class="card-etymology">${card.etymology}</div>`;
                backFace.innerHTML = `<div class="card-meaning">答案：${card.answer}</div><div class="card-mnemonic">💡 解题思路：${card.solution}</div><div class="card-etymology">${card.meaning}</div>`;
            }
        }

        function flipCard() { if (cards.length === 0) return; const flashcard = document.getElementById('flashcard'); isFlipped = !isFlipped; flashcard.classList.toggle('flipped', isFlipped); }
        function prevCard(event) { event.stopPropagation(); if (cards.length === 0) return; currentIndex = (currentIndex - 1 + cards.length) % cards.length; updateCardDisplay(); updateThumbnails(); updateCardNav(); }
        function nextCard(event) { event.stopPropagation(); if (cards.length === 0) return; currentIndex = (currentIndex + 1) % cards.length; updateCardDisplay(); updateThumbnails(); updateCardNav(); }
        function updateCardNav() { const nav = document.getElementById('cardNav'); const counter = document.getElementById('cardCounter'); if (cards.length > 0) { nav.style.display = 'flex'; counter.textContent = `${currentIndex + 1} / ${cards.length}`; } else { nav.style.display = 'none'; } }
        function updateThumbnails() { const container = document.getElementById('cardThumbnails'); container.innerHTML = ''; cards.forEach((card, index) => { const thumb = document.createElement('div'); thumb.className = 'card-thumb' + (index === currentIndex ? ' active' : ''); thumb.textContent = (card.word || card.content).substring(0, 6); thumb.onclick = () => { currentIndex = index; updateCardDisplay(); updateThumbnails(); updateCardNav(); }; container.appendChild(thumb); }); }
        function clearInput() { document.getElementById('wordInput').value = ''; cards = []; currentIndex = 0; isFlipped = false; const flashcard = document.getElementById('flashcard'); flashcard.classList.remove('flipped'); flashcard.querySelector('.flashcard-front').innerHTML = '<div class="empty-state"><div class="empty-state-icon">📚</div><p>输入内容后点击生成</p><p style="font-size: 0.9rem; margin-top: 0.5rem;">点击卡片可翻转查看</p></div>'; flashcard.querySelector('.flashcard-back').innerHTML = '<div class="empty-state"><div class="empty-state-icon">💡</div><p>背面显示答案与解析</p></div>'; document.getElementById('cardNav').style.display = 'none'; document.getElementById('cardThumbnails').innerHTML = ''; }

        // ===== 标记易错与加入复习库 =====
        function markAsMistake() { if (cards.length === 0) { alert('请先生成闪卡！'); return; } const card = cards[currentIndex]; addToMistakeBankInternal(card, true); showReward('已标记为易错！⚠️'); }
        function addToMistakeBank() { if (cards.length === 0) { alert('请先生成闪卡！'); return; } const card = cards[currentIndex]; addToMistakeBankInternal(card, false); showReward('已加入复习库！⭐'); }
        function addToMistakeBankInternal(card, isMistake) {
            const exists = mistakeBank.find(m => m.content === card.content);
            if (exists) { exists.isMistake = exists.isMistake || isMistake; return; }
            const tag = card.type === 'word' ? 'english' : 'comprehensive';
            mistakeBank.push({ id: Date.now() + Math.random(), content: card.content, word: card.word || card.content, meaning: card.meaning, mnemonic: card.mnemonic, answer: card.answer || '', solution: card.solution || '', tag: tag, isMistake: isMistake, date: new Date().toLocaleDateString() });
        }

        // ===== 游戏化测验 =====
        function initQuiz() { if (cards.length === 0) return; isQuizActive = false; quizIndex = 0; document.getElementById('quizWord').textContent = '准备开始'; document.getElementById('quizOptions').innerHTML = '<button class="quiz-option" onclick="startQuiz()">开始闯关</button>'; document.getElementById('quizHint').style.display = 'none'; }
        function startQuiz() { if (cards.length === 0) { alert('请先生成闪卡！'); return; } isQuizActive = true; quizIndex = Math.floor(Math.random() * cards.length); showQuizQuestion(); }
        function showQuizQuestion() { if (cards.length === 0) return; const card = cards[quizIndex]; document.getElementById('quizWord').textContent = card.word || card.content; document.getElementById('quizHint').style.display = 'none'; const options = [card.meaning]; const otherCards = cards.filter((_, i) => i !== quizIndex); while (options.length < 4 && otherCards.length > 0) { const randomIndex = Math.floor(Math.random() * otherCards.length); const meaning = otherCards[randomIndex].meaning; if (!options.includes(meaning)) options.push(meaning); otherCards.splice(randomIndex, 1); } options.sort(() => Math.random() - 0.5); const optionsContainer = document.getElementById('quizOptions'); optionsContainer.innerHTML = ''; options.forEach(option => { const btn = document.createElement('button'); btn.className = 'quiz-option'; btn.textContent = option; btn.onclick = () => checkAnswer(option, card.meaning, card.mnemonic); optionsContainer.appendChild(btn); }); }
        function checkAnswer(selected, correct, mnemonic) { const options = document.querySelectorAll('.quiz-option'); const hint = document.getElementById('quizHint'); options.forEach(btn => { btn.disabled = true; if (btn.textContent === correct) btn.classList.add('correct'); else if (btn.textContent === selected && selected !== correct) btn.classList.add('wrong'); }); if (selected === correct) { score += 10 + streak * 2; streak++; todayCount++; levelProgress++; const theme = document.body.getAttribute('data-theme'); const rewards = { gufeng: ['妙哉！', '才高八斗！', '过目不忘！', '学富五车！'], xianxia: ['悟道成功！', '修为精进！', '仙缘深厚！', '突破境界！'], anime: ['太棒了！', '赛高！', '萌力全开！', '完美～'] }; const rewardTexts = rewards[theme] || rewards.gufeng; showReward(rewardTexts[Math.min(streak - 1, 3)]); checkLevelUp(); } else { streak = 0; hint.textContent = '💡 记忆口诀：' + mnemonic; hint.style.display = 'block'; showReward('再接再厉！'); } updateStats(); setTimeout(() => { if (isQuizActive) { quizIndex = Math.floor(Math.random() * cards.length); showQuizQuestion(); } }, 2000); }
        function checkLevelUp() { const target = 5 * currentLevel; if (levelProgress >= target) { currentLevel++; levelProgress = 0; showReward('🎉 晋级第' + currentLevel + '关！'); } }
        function updateStats() { document.getElementById('score').textContent = score; document.getElementById('streak').textContent = streak; document.getElementById('todayCount').textContent = todayCount; document.getElementById('level').textContent = '第 ' + currentLevel + ' 关'; document.getElementById('levelTarget').textContent = 5 * currentLevel; const progress = cards.length > 0 ? Math.min((todayCount / cards.length) * 100, 100) : 0; document.getElementById('progressFill').style.width = progress + '%'; document.getElementById('progressText').textContent = Math.round(progress) + '%'; }
        function showReward(text) { const overlay = document.getElementById('rewardOverlay'); const rewardText = document.getElementById('rewardText'); rewardText.textContent = text; overlay.classList.add('show'); setTimeout(() => { overlay.classList.remove('show'); }, 1200); }

        // ===== 摄像头功能 =====
        async function startCamera() {
            try {
                const video = document.getElementById('cameraVideo');
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = cameraStream;
                document.getElementById('cameraOverlay').style.display = 'none';
            } catch (err) {
                alert('无法访问摄像头，请确保已授予权限或使用HTTPS环境。\n错误：' + err.message);
            }
        }
        function stopCamera() {
            if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); cameraStream = null; }
            document.getElementById('cameraOverlay').style.display = 'flex';
            document.getElementById('previewImage').classList.add('hidden');
        }
        function capturePhoto() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.getElementById('cameraCanvas');
            const preview = document.getElementById('previewImage');
            if (!cameraStream) { alert('请先开启摄像头！'); return; }
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            preview.src = canvas.toDataURL('image/png');
            preview.classList.remove('hidden');
            // 模拟OCR识别
            simulateOCR();
        }
        function simulateOCR() {
            const ocrResult = document.getElementById('ocrResult');
            const ocrText = document.getElementById('ocrText');
            ocrResult.classList.remove('hidden');
            ocrText.innerHTML = '<div class="loading"></div> 正在识别中...';
            setTimeout(() => {
                const sampleTexts = [
                    'abandon\nability\nabsence\nabsolute\nacademic',
                    '1+1=?\n勾股定理\n水的化学式\n床前明月光',
                    'accept\naccess\naccident\naccount\nachieve'
                ];
                ocrTextResult = sampleTexts[Math.floor(Math.random() * sampleTexts.length)];
                ocrText.textContent = ocrTextResult;
                showReward('识别完成！🔍');
            }, 2000);
        }
        function addOcrToMistakes() {
            if (!ocrTextResult) { alert('请先拍照识别！'); return; }
            const lines = ocrTextResult.split(/[\n\r]+/).map(l => l.trim()).filter(l => l !== '');
            lines.forEach(line => {
                const tag = /^[a-zA-Z]+$/.test(line) ? 'english' : (/[\u4e00-\u9fa5]/.test(line) && /[0-9\+\-\*\/\=]/.test(line)) ? 'math' : 'chinese';
                mistakeBank.push({ id: Date.now() + Math.random(), content: line, word: line, meaning: '待学习', mnemonic: '从OCR识别导入', answer: '', solution: '', tag: tag, isMistake: true, date: new Date().toLocaleDateString() });
            });
            renderMistakeList(); updateMistakeFlashcardArea();
            showReward('已加入错题库！📚');
        }
        function clearOcr() { ocrTextResult = ''; document.getElementById('ocrResult').classList.add('hidden'); document.getElementById('previewImage').classList.add('hidden'); }

        // ===== 错题库管理 =====
        function renderMistakeList() {
            const list = document.getElementById('mistakeList');
            const filtered = currentFilter === 'all' ? mistakeBank : mistakeBank.filter(m => m.tag === currentFilter);
            if (filtered.length === 0) { list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>暂无错题记录</p><p style="font-size: 0.9rem; margin-top: 0.5rem;">拍照识别或从闪卡页添加</p></div>'; return; }
            list.innerHTML = '';
            filtered.forEach(mistake => {
                const item = document.createElement('div');
                item.className = 'mistake-item' + (selectedMistakes.has(mistake.id) ? ' selected' : '');
                const tagClass = 'tag-' + mistake.tag;
                const tagName = { english: '英语', math: '数学', chinese: '语文', comprehensive: '综合' }[mistake.tag] || '其他';
                item.innerHTML = `
                    <input type="checkbox" class="mistake-checkbox" ${selectedMistakes.has(mistake.id) ? 'checked' : ''} onchange="toggleSelectMistake('${mistake.id}')">
                    <div class="mistake-content">
                        <div class="mistake-word">${mistake.word || mistake.content}<span class="mistake-tag ${tagClass}">${tagName}</span></div>
                        <div class="mistake-meaning">${mistake.meaning}</div>
                    </div>
                    <div class="mistake-actions">
                        <button class="mistake-btn" onclick="reviewMistake('${mistake.id}')">👁️</button>
                        <button class="mistake-btn" onclick="deleteMistake('${mistake.id}')">🗑️</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }
        function toggleSelectMistake(id) { if (selectedMistakes.has(id)) selectedMistakes.delete(id); else selectedMistakes.add(id); renderMistakeList(); }
        function selectAllMistakes() { const filtered = currentFilter === 'all' ? mistakeBank : mistakeBank.filter(m => m.tag === currentFilter); filtered.forEach(m => selectedMistakes.add(m.id)); renderMistakeList(); }
        function deselectAllMistakes() { selectedMistakes.clear(); renderMistakeList(); }
        function deleteMistake(id) { mistakeBank = mistakeBank.filter(m => m.id !== id); selectedMistakes.delete(id); renderMistakeList(); updateMistakeFlashcardArea(); }
        function deleteSelectedMistakes() { if (selectedMistakes.size === 0) { alert('请先选择要删除的错题！'); return; } mistakeBank = mistakeBank.filter(m => !selectedMistakes.has(m.id)); selectedMistakes.clear(); renderMistakeList(); updateMistakeFlashcardArea(); showReward('删除成功！🗑️'); }
        function filterMistakes(tag) { currentFilter = tag; document.querySelectorAll('.tag-filter-btn').forEach(btn => btn.classList.remove('active')); event.target.classList.add('active'); renderMistakeList(); }
        function reviewMistake(id) { const mistake = mistakeBank.find(m => m.id === id); if (!mistake) return; alert(`内容：${mistake.content}\n释义：${mistake.meaning}\n口诀：${mistake.mnemonic}`); }

        // ===== 易错闪卡复习 =====
        let mistakeCards = [];
        let mistakeCardIndex = 0;
        let isMistakeFlipped = false;
        function updateMistakeFlashcardArea() {
            const area = document.getElementById('mistakeFlashcardArea');
            const filtered = currentFilter === 'all' ? mistakeBank : mistakeBank.filter(m => m.tag === currentFilter);
            if (filtered.length === 0) { area.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🎴</div><p>错题库为空，无法生成复习闪卡</p></div>'; return; }
            mistakeCards = filtered.map(m => ({ ...m, word: m.word || m.content }));
            mistakeCardIndex = 0; isMistakeFlipped = false;
            renderMistakeFlashcard();
        }
        function renderMistakeFlashcard() {
            const area = document.getElementById('mistakeFlashcardArea');
            if (mistakeCards.length === 0) { area.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🎴</div><p>错题库为空</p></div>'; return; }
            const card = mistakeCards[mistakeCardIndex];
            area.innerHTML = `
                <div class="flashcard-container" style="margin: 1rem auto;" onclick="flipMistakeCard()">
                    <div class="flashcard" id="mistakeFlashcard">
                        <div class="flashcard-face flashcard-front">
                            <div class="card-word">${card.word}</div>
                            <div class="card-phonetic">${card.tag === 'english' ? '英语单词' : '学科题目'}</div>
                            <div class="card-etymology">加入日期：${card.date}</div>
                        </div>
                        <div class="flashcard-face flashcard-back">
                            <div class="card-meaning">${card.meaning}</div>
                            <div class="card-mnemonic">💡 ${card.mnemonic}</div>
                            ${card.answer ? `<div class="card-etymology">答案：${card.answer}</div>` : ''}
                        </div>
                    </div>
                </div>
                <div class="card-nav" style="justify-content: center;">
                    <button class="nav-arrow" onclick="prevMistakeCard(event)">◀</button>
                    <span class="card-counter">${mistakeCardIndex + 1} / ${mistakeCards.length}</span>
                    <button class="nav-arrow" onclick="nextMistakeCard(event)">▶</button>
                </div>
            `;
        }
        function flipMistakeCard() { if (mistakeCards.length === 0) return; const fc = document.getElementById('mistakeFlashcard'); isMistakeFlipped = !isMistakeFlipped; fc.classList.toggle('flipped', isMistakeFlipped); }
        function prevMistakeCard(e) { e.stopPropagation(); if (mistakeCards.length === 0) return; mistakeCardIndex = (mistakeCardIndex - 1 + mistakeCards.length) % mistakeCards.length; isMistakeFlipped = false; renderMistakeFlashcard(); }
        function nextMistakeCard(e) { e.stopPropagation(); if (mistakeCards.length === 0) return; mistakeCardIndex = (mistakeCardIndex + 1) % mistakeCards.length; isMistakeFlipped = false; renderMistakeFlashcard(); }

        // ===== 易错闯关测验 =====
        let mistakeQuizIndex = 0;
        let isMistakeQuizActive = false;
        function startMistakeQuiz() {
            const filtered = currentFilter === 'all' ? mistakeBank : mistakeBank.filter(m => m.tag === currentFilter);
            if (filtered.length === 0) { alert('错题库为空，请先添加错题！'); return; }
            switchPage('flashcard');
            cards = filtered.map(m => ({ type: m.tag === 'english' ? 'word' : 'subject', content: m.content, word: m.word || m.content, meaning: m.meaning, mnemonic: m.mnemonic, answer: m.answer || '', solution: m.solution || '', etymology: m.date }));
            currentIndex = 0; isFlipped = false;
            updateCardDisplay(); updateThumbnails(); updateCardNav();
            setTimeout(() => { startQuiz(); showReward('易错闯关开始！🔥'); }, 500);
        }

        // ===== 导出功能 =====
        function exportCards() {
            if (cards.length === 0) { alert('请先生成闪卡！'); return; }
            let exportHTML = `<html><head><meta charset="UTF-8"><title>词境阁 - 闪卡导出</title><style>body{font-family:'Noto Serif SC',serif;padding:20px;background:#f5f0e8;}.card{border:2px solid #c4a882;border-radius:12px;padding:24px;margin:16px 0;background:white;page-break-inside:avoid;}.word{font-size:28px;color:#8b4513;font-weight:bold;margin-bottom:8px;}.phonetic{font-size:16px;color:#666;margin-bottom:12px;}.meaning{font-size:18px;color:#333;margin-bottom:12px;}.mnemonic{font-size:14px;color:#8b4513;font-style:italic;padding:12px;background:#faf6ed;border-radius:8px;}</style></head><body><h1 style="text-align:center;color:#8b4513;">词境阁 · 闪卡导出</h1><p style="text-align:center;color:#999;">共 ${cards.length} 张</p>`;
            cards.forEach(card => { exportHTML += `<div class="card"><div class="word">${card.word || card.content}</div><div class="phonetic">${card.phonetic || card.etymology}</div><div class="meaning">${card.meaning}</div><div class="mnemonic">💡 ${card.mnemonic}</div></div>`; });
            exportHTML += '</body></html>';
            const blob = new Blob([exportHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = '词境阁_闪卡_' + new Date().toLocaleDateString() + '.html'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            showReward('导出成功！📷');
        }
        function exportMistakes() {
            if (selectedMistakes.size === 0) { alert('请先选择要导出的错题！'); return; }
            const selected = mistakeBank.filter(m => selectedMistakes.has(m.id));
            let text = '词境阁 · 易错单词/错题导出\n==================\n\n';
            selected.forEach((m, i) => { text += `${i + 1}. [${m.tag}] ${m.content}\n   释义：${m.meaning}\n   口诀：${m.mnemonic}\n   日期：${m.date}\n\n`; });
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = '词境阁_易错题_' + new Date().toLocaleDateString() + '.txt'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            showReward('导出成功！📤');
        }
        function exportAllMistakes() {
            if (mistakeBank.length === 0) { alert('错题库为空！'); return; }
            let text = '词境阁 · 全部易错单词/错题\n==================\n\n';
            mistakeBank.forEach((m, i) => { text += `${i + 1}. [${m.tag}] ${m.content}\n   释义：${m.meaning}\n   口诀：${m.mnemonic}\n   日期：${m.date}\n\n`; });
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = '词境阁_全部错题_' + new Date().toLocaleDateString() + '.txt'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            showReward('全部导出成功！📷');
        }

        // ===== 键盘快捷键 =====
        document.addEventListener('keydown', (e) => {
            if (currentPage !== 'flashcard') return;
            if (cards.length === 0) return;
            if (e.key === 'ArrowLeft') prevCard({ stopPropagation: () => {} });
            else if (e.key === 'ArrowRight') nextCard({ stopPropagation: () => {} });
            else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
        });

        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', () => {
            generateParticles('gufeng');
            updateStats();
            // 预置一些示例错题
            mistakeBank.push(
                { id: 'demo1', content: 'abandon', word: 'abandon', meaning: '放弃，抛弃', mnemonic: 'a(一个) + band(乐队) + on(上) → 一个乐队上台后被抛弃了', answer: '', solution: '', tag: 'english', isMistake: true, date: '2026-06-17' },
                { id: 'demo2', content: 'ability', word: 'ability', meaning: '能力，才能', mnemonic: 'a(一) + bili(比利) + ty(踢) → 比利一脚踢出了能力', answer: '', solution: '', tag: 'english', isMistake: true, date: '2026-06-17' },
                { id: 'demo3', content: '1+1=?', word: '1+1=?', meaning: '2', mnemonic: '最基本的加法', answer: '2', solution: '直接相加', tag: 'math', isMistake: false, date: '2026-06-17' }
            );
        });
    </script>
