<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>香搭小镜</title>
  <style>
    :root {
      --bg-primary: #F8F6F3;
      --card-bg: #FFFFFF;
      --text-primary: #333333;
      --text-secondary: #666666;
      --accent: #D9C7B8;
      --accent-light: #EDE7DD;
      --border: #E0D8D0;
      --shadow: rgba(0, 0, 0, 0.04);
      --transition: all 0.3s ease;
    }

    .dark-theme {
      --bg-primary: #2A2A2A;
      --card-bg: #3A3A3A;
      --text-primary: #F5F5F5;
      --text-secondary: #BBBBBB;
      --accent: #8A7D6B;
      --accent-light: #4A4A4A;
      --border: #555555;
      --shadow: rgba(0, 0, 0, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      padding: 16px;
      transition: var(--transition);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 16px;
    }

    h1 {
      font-weight: 600;
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 12px var(--shadow);
      border: 1px solid var(--border);
      transition: var(--transition);
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::before {
      content: "•";
      color: var(--accent);
      font-size: 1.2rem;
    }

    .slider-group {
      margin-bottom: 24px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .slider-container {
      position: relative;
      height: 40px;
      margin: 12px 0;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: var(--accent-light);
      border-radius: 3px;
      outline: none;
      transition: var(--transition);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .slider-value {
      text-align: center;
      font-weight: 500;
      margin-top: 8px;
      font-size: 1.1rem;
      color: var(--text-primary);
    }

    .preview-box {
      background-color: var(--accent-light);
      border-radius: 10px;
      padding: 16px;
      margin-top: 16px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-primary);
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px dashed var(--accent);
    }

    .upload-area {
      border: 2px dashed var(--accent);
      border-radius: 10px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      background-color: var(--accent-light);
      margin-top: 16px;
    }

    .upload-area:hover {
      background-color: var(--accent);
      color: white;
    }

    .upload-icon {
      font-size: 2rem;
      margin-bottom: 12px;
      color: var(--accent);
    }

    .upload-text {
      font-size: 1rem;
      margin-bottom: 12px;
      color: var(--text-secondary);
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--transition);
      font-weight: 500;
    }

    .btn:hover {
      background-color: #C4B2A0;
      transform: translateY(-1px);
    }

    .photo-preview {
      margin-top: 16px;
      display: none;
      text-align: center;
    }

    .photo-preview img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px var(--shadow);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .tag {
      background-color: var(--accent-light);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .theme-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--accent);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--shadow);
      z-index: 100;
      transition: var(--transition);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      background-color: #C4B2A0;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 16px;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Responsive */
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .card {
        padding: 20px;
      }
      .slider-container {
        height: 36px;
      }
      .slider-label {
        font-size: 0.9rem;
      }
      .preview-box {
        font-size: 0.9rem;
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>香搭小镜</h1>
      <p class="subtitle">三步匹配今日香：选天气、定场合、调心情 —— 瞬间获得一句懂你的香调提示</p>
    </header>

    <main>
      <section class="card">
        <h2 class="card-title">今天喷哪瓶？</h2>
        <div class="slider-group">
          <div class="slider-label">
            <span>🌤️ 天气</span>
            <span id="weather-value">晴</span>
          </div>
          <div class="slider-container">
            <input type="range" id="weather-slider" min="0" max="3" value="0">
          </div>
        </div>

        <div class="slider-group">
          <div class="slider-label">
            <span>📍 场合</span>
            <span id="occasion-value">通勤</span>
          </div>
          <div class="slider-container">
            <input type="range" id="occasion-slider" min="0" max="3" value="0">
          </div>
        </div>

        <div class="slider-group">
          <div class="slider-label">
            <span>💭 心情</span>
            <span id="mood-value">轻松</span>
          </div>
          <div class="slider-container">
            <input type="range" id="mood-slider" min="0" max="3" value="0">
          </div>
        </div>

        <div class="preview-box" id="preview">
          拖动上方滑块，获取专属香调建议...
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">拍一瓶，秒懂它</h2>
        <p class="upload-text">点击下方区域，上传香水瓶照片（支持jpg/png）</p>
        <div class="upload-area" id="upload-area">
          <div class="upload-icon">📸</div>
          <p>拍一瓶</p>
          <button class="btn">选择图片</button>
          <input type="file" id="photo-input" accept="image/*" style="display:none;">
        </div>

        <div class="photo-preview" id="photo-preview">
          <img id="preview-img" alt="香水瓶预览">
          <div class="tags">
            <span class="tag">前调：青柠皮</span>
            <span class="tag">中调：紫罗兰叶</span>
            <span class="tag">尾调：干燥雪松</span>
            <span class="tag">适配：通勤午后</span>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>香搭小镜 · 轻量香水搭配助手</p>
    </footer>
  </div>

  <button class="theme-toggle" id="theme-toggle">☀️</button>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('theme-toggle');
    const body = document.body;
    const isDark = localStorage.getItem('dark-theme') === 'true';

    if (isDark) {
      body.classList.add('dark-theme');
      themeToggle.textContent = '🌙';
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-theme');
      if (body.classList.contains('dark-theme')) {
        localStorage.setItem('dark-theme', 'true');
        themeToggle.textContent = '🌙';
      } else {
        localStorage.setItem('dark-theme', 'false');
        themeToggle.textContent = '☀️';
      }
    });

    // 滑块数据映射
    const weatherOptions = ['晴', '微雨', '闷热', '阴冷'];
    const occasionOptions = ['通勤', '约会', '居家', '聚会'];
    const moodOptions = ['轻松', '专注', '疲惫', '兴奋'];

    const weatherSlider = document.getElementById('weather-slider');
    const occasionSlider = document.getElementById('occasion-slider');
    const moodSlider = document.getElementById('mood-slider');

    const weatherValue = document.getElementById('weather-value');
    const occasionValue = document.getElementById('occasion-value');
    const moodValue = document.getElementById('mood-value');
    const previewBox = document.getElementById('preview');

    function updatePreview() {
      const w = parseInt(weatherSlider.value);
      const o = parseInt(occasionSlider.value);
      const m = parseInt(moodSlider.value);

      const prompts = [
        "晴天+通勤+轻松 → 推荐柑橘木质调，像咬开一颗阳光晒暖的柚子，尾调有干净雪松回甘",
        "微雨+约会+疲惫 → 推荐粉红胡椒+鸢尾根调，微辛带粉感，像躲进咖啡馆窗边闻到的旧书页与暖香",
        "闷热+居家+专注 → 推荐薄荷+广藿香调，清凉中带泥土气息，像午后阳台吹来的穿堂风与青苔味",
        "阴冷+聚会+兴奋 → 推荐琥珀+香草调，暖甜不腻，像围炉时捧着一杯热朗姆酒的氤氲香气"
      ];

      const index = (w + o + m) % 4;
      previewBox.textContent = prompts[index];
    }

    weatherSlider.addEventListener('input', () => {
      weatherValue.textContent = weatherOptions[parseInt(weatherSlider.value)];
      updatePreview();
    });
    occasionSlider.addEventListener('input', () => {
      occasionValue.textContent = occasionOptions[parseInt(occasionSlider.value)];
      updatePreview();
    });
    moodSlider.addEventListener('input', () => {
      moodValue.textContent = moodOptions[parseInt(moodSlider.value)];
      updatePreview();
    });

    // 图片上传模拟
    const uploadArea = document.getElementById('upload-area');
    const photoInput = document.getElementById('photo-input');
    const photoPreview = document.getElementById('photo-preview');
    const previewImg = document.getElementById('preview-img');

    uploadArea.addEventListener('click', () => {
      photoInput.click();
    });

    photoInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        const reader = new FileReader();
        reader.onload = function(event) {
          previewImg.src = event.target.result;
          photoPreview.style.display = 'block';
        };
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    // 初始化预览
    updatePreview();
  </script>
</body>
</html>
