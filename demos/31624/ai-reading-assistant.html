<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能读书笔记助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .upload-area {
            border: 2px dashed #e2e8f0;
            transition: all 0.3s ease;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: #667eea;
            background-color: #f8fafc;
        }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .mindmap-node {
            transition: all 0.3s ease;
        }

        .mindmap-node:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .mindmap-line {
            stroke: #cbd5e1;
            stroke-width: 2;
            fill: none;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="py-8 px-4">
    <div class="max-w-7xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2 gradient-text" style="color: white; -webkit-text-fill-color: white;">AI 智能读书笔记助手</h1>
            <p class="text-white/80">上传书籍或输入文本，让 AI 帮你生成精美笔记和思维导图</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <div class="glass-card p-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
                    <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    文件上传
                </h2>
                <div id="uploadArea" class="upload-area rounded-xl p-8 text-center cursor-pointer" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" class="hidden" accept=".txt,.pdf,.md">
                    <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                    </div>
                    <p class="text-gray-600 font-medium">点击或拖拽上传文件</p>
                    <p class="text-gray-400 text-sm mt-2">支持 .txt, .pdf, .md 格式</p>
                    <div id="fileInfo" class="mt-4 text-left bg-gray-50 rounded-lg p-4 hidden">
                        <p id="fileName" class="text-gray-700 font-medium"></p>
                        <p id="fileSize" class="text-gray-500 text-sm"></p>
                        <button onclick="clearFile()" class="mt-2 text-sm text-red-500 hover:text-red-600">移除文件</button>
                    </div>
                </div>
            </div>

            <div class="glass-card p-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
                    <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                    文本输入
                </h2>
                <textarea id="textInput" class="w-full h-48 p-4 border border-gray-200 rounded-xl resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-gray-700" placeholder="在此粘贴书籍内容或输入想要分析的文本..."></textarea>
            </div>
        </div>

        <div class="flex justify-center mb-6">
            <button id="generateBtn" onclick="generateNotes()" class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-8 py-3 rounded-full font-semibold text-lg shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
                <span>生成读书笔记</span>
            </button>
        </div>

        <div id="resultSection" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                <div class="glass-card p-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
                        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        AI 智能笔记
                    </h2>
                    <div id="notesContent" class="space-y-4 max-h-96 overflow-y-auto scrollbar-hide">
                    </div>
                </div>

                <div class="glass-card p-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
                        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                        </svg>
                        核心知识点
                    </h2>
                    <div id="keyPointsContent" class="space-y-3 max-h-96 overflow-y-auto scrollbar-hide">
                    </div>
                </div>
            </div>

            <div class="glass-card p-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
                    <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V5z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7h18M9 9v8m-5 0h10M12 9v8"></path>
                    </svg>
                    思维导图
                </h2>
                <div class="bg-gray-50 rounded-xl p-6">
                    <svg id="mindmapSvg" width="100%" height="400" viewBox="0 0 800 400"></svg>
                </div>
            </div>
        </div>

        <div id="loadingSection" class="hidden flex justify-center items-center py-12">
            <div class="text-center">
                <div class="loading-spinner mx-auto mb-4"></div>
                <p class="text-white font-medium">AI 正在分析内容并生成笔记...</p>
            </div>
        </div>
    </div>

    <script>
        let uploadedFile = null;

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                uploadedFile = file;
                document.getElementById('fileName').textContent = '文件名: ' + file.name;
                document.getElementById('fileSize').textContent = '大小: ' + formatFileSize(file.size);
                document.getElementById('fileInfo').classList.remove('hidden');
            }
        });

        document.getElementById('uploadArea').addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('dragover');
        });

        document.getElementById('uploadArea').addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
        });

        document.getElementById('uploadArea').addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && (file.type.includes('text') || file.name.endsWith('.pdf') || file.name.endsWith('.md'))) {
                uploadedFile = file;
                document.getElementById('fileName').textContent = '文件名: ' + file.name;
                document.getElementById('fileSize').textContent = '大小: ' + formatFileSize(file.size);
                document.getElementById('fileInfo').classList.remove('hidden');
            }
        });

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function clearFile() {
            uploadedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('fileInfo').classList.add('hidden');
        }

        async function generateNotes() {
            const textInput = document.getElementById('textInput').value.trim();

            if (!uploadedFile && !textInput) {
                alert('请上传文件或输入文本');
                return;
            }

            document.getElementById('generateBtn').disabled = true;
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('loadingSection').classList.remove('hidden');

            let content = textInput;

            if (uploadedFile) {
                try {
                    content = await readFileContent(uploadedFile);
                } catch (error) {
                    alert('读取文件失败，请确保上传的是文本文件');
                    document.getElementById('generateBtn').disabled = false;
                    document.getElementById('loadingSection').classList.add('hidden');
                    return;
                }
            }

            await simulateAIGeneration(content);

            document.getElementById('generateBtn').disabled = false;
            document.getElementById('loadingSection').classList.add('hidden');
            document.getElementById('resultSection').classList.remove('hidden');
        }

        function readFileContent(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }

        async function simulateAIGeneration(content) {
            await new Promise(resolve => setTimeout(resolve, 2000));

            const notes = [
                {
                    title: '核心思想',
                    content: '本文探讨了人工智能在现代教育中的应用，强调个性化学习和智能辅导系统如何改变传统教学模式，使教育更加高效和普惠。'
                },
                {
                    title: '关键论点',
                    content: '1. AI 技术能够分析学生的学习行为和模式，提供个性化的学习路径\n2. 智能辅导系统可以24/7提供即时反馈，弥补传统教学的时间限制\n3. 大数据分析帮助教师更好地了解学生需求，优化教学策略'
                },
                {
                    title: '实践建议',
                    content: '建议教育机构逐步引入AI辅助工具，但需注意保持人机平衡，避免过度依赖技术。同时要关注数据隐私和算法偏见问题。'
                },
                {
                    title: '未来展望',
                    content: '随着AI技术的不断进步，未来教育将更加智能化、个性化。虚拟现实和增强现实技术将为学生提供沉浸式学习体验。'
                }
            ];

            const keyPoints = [
                '人工智能教育应用',
                '个性化学习路径',
                '智能辅导系统',
                '大数据分析',
                '人机平衡',
                '数据隐私保护',
                'VR/AR沉浸式学习'
            ];

            const mindmapData = {
                root: 'AI 教育应用',
                children: [
                    {
                        name: '个性化学习',
                        children: ['学习路径定制', '自适应难度', '兴趣推荐']
                    },
                    {
                        name: '智能辅导',
                        children: ['即时反馈', '答疑解惑', '作业批改']
                    },
                    {
                        name: '数据分析',
                        children: ['学习行为分析', '成绩预测', '教学优化']
                    },
                    {
                        name: '技术趋势',
                        children: ['VR/AR', '机器学习', '自然语言处理']
                    }
                ]
            };

            renderNotes(notes);
            renderKeyPoints(keyPoints);
            renderMindmap(mindmapData);
        }

        function renderNotes(notes) {
            const container = document.getElementById('notesContent');
            container.innerHTML = '';

            notes.forEach((note, index) => {
                const noteDiv = document.createElement('div');
                noteDiv.className = 'bg-white rounded-lg p-4 border-l-4 border-indigo-500 shadow-sm';
                noteDiv.innerHTML = `
                    <h3 class="font-semibold text-gray-800 mb-2 flex items-center gap-2">
                        <span class="w-6 h-6 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-sm">${index + 1}</span>
                        ${note.title}
                    </h3>
                    <p class="text-gray-600 text-sm leading-relaxed whitespace-pre-wrap">${note.content}</p>
                `;
                container.appendChild(noteDiv);
            });
        }

        function renderKeyPoints(points) {
            const container = document.getElementById('keyPointsContent');
            container.innerHTML = '';

            points.forEach((point, index) => {
                const pointDiv = document.createElement('div');
                pointDiv.className = 'flex items-center gap-3 bg-gradient-to-r from-indigo-50 to-purple-50 rounded-lg p-3';
                pointDiv.innerHTML = `
                    <div class="w-2 h-2 bg-indigo-500 rounded-full"></div>
                    <span class="text-gray-700 font-medium">${point}</span>
                `;
                container.appendChild(pointDiv);
            });
        }

        function renderMindmap(data) {
            const svg = document.getElementById('mindmapSvg');
            svg.innerHTML = '';

            const width = 800;
            const height = 400;
            const centerX = width / 2;
            const centerY = height / 2;
            const rootRadius = 40;
            const level1Radius = 180;
            const level2Radius = 280;

            const rootGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');

            const rootCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            rootCircle.setAttribute('cx', centerX);
            rootCircle.setAttribute('cy', centerY);
            rootCircle.setAttribute('r', rootRadius);
            rootCircle.setAttribute('fill', 'url(#rootGradient)');
            rootCircle.setAttribute('stroke', '#667eea');
            rootCircle.setAttribute('stroke-width', '2');

            const rootText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            rootText.setAttribute('x', centerX);
            rootText.setAttribute('y', centerY + 5);
            rootText.setAttribute('text-anchor', 'middle');
            rootText.setAttribute('fill', 'white');
            rootText.setAttribute('font-size', '14');
            rootText.setAttribute('font-weight', 'bold');
            rootText.textContent = data.root;

            rootGroup.appendChild(rootCircle);
            rootGroup.appendChild(rootText);
            svg.appendChild(rootGroup);

            const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            const rootGradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
            rootGradient.setAttribute('id', 'rootGradient');
            rootGradient.setAttribute('x1', '0%');
            rootGradient.setAttribute('y1', '0%');
            rootGradient.setAttribute('x2', '100%');
            rootGradient.setAttribute('y2', '100%');
            const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
            stop1.setAttribute('offset', '0%');
            stop1.setAttribute('stop-color', '#667eea');
            const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
            stop2.setAttribute('offset', '100%');
            stop2.setAttribute('stop-color', '#764ba2');
            rootGradient.appendChild(stop1);
            rootGradient.appendChild(stop2);
            gradient.appendChild(rootGradient);
            svg.appendChild(gradient);

            const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c'];

            data.children.forEach((child, index) => {
                const angle = (index / data.children.length) * Math.PI * 2 - Math.PI / 2;
                const x1 = centerX + Math.cos(angle) * level1Radius;
                const y1 = centerY + Math.sin(angle) * level1Radius;

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', centerX + Math.cos(angle) * rootRadius);
                line.setAttribute('y1', centerY + Math.sin(angle) * rootRadius);
                line.setAttribute('x2', x1 - Math.cos(angle) * 30);
                line.setAttribute('y2', y1 - Math.sin(angle) * 30);
                line.setAttribute('class', 'mindmap-line');
                svg.appendChild(line);

                const nodeGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');

                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', x1 - 60);
                rect.setAttribute('y', y1 - 20);
                rect.setAttribute('width', 120);
                rect.setAttribute('height', 40);
                rect.setAttribute('rx', 8);
                rect.setAttribute('fill', colors[index % colors.length]);
                rect.setAttribute('opacity', '0.9');

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', x1);
                text.setAttribute('y', y1 + 6);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('fill', 'white');
                text.setAttribute('font-size', '12');
                text.setAttribute('font-weight', 'bold');
                text.textContent = child.name;

                nodeGroup.appendChild(rect);
                nodeGroup.appendChild(text);
                svg.appendChild(nodeGroup);

                if (child.children && child.children.length > 0) {
                    child.children.forEach((subChild, subIndex) => {
                        const subAngle = angle + ((subIndex - (child.children.length - 1) / 2) * 0.25);
                        const x2 = x1 + Math.cos(subAngle) * 80;
                        const y2 = y1 + Math.sin(subAngle) * 80;

                        const subLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        subLine.setAttribute('x1', x1 + Math.cos(subAngle) * 60);
                        subLine.setAttribute('y1', y1 + Math.sin(subAngle) * 20);
                        subLine.setAttribute('x2', x2 - Math.cos(subAngle) * 25);
                        subLine.setAttribute('y2', y2 - Math.sin(subAngle) * 12);
                        subLine.setAttribute('class', 'mindmap-line');
                        subLine.setAttribute('stroke', '#94a3b8');
                        svg.appendChild(subLine);

                        const subNodeGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');

                        const subRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        subRect.setAttribute('x', x2 - 50);
                        subRect.setAttribute('y', y2 - 15);
                        subRect.setAttribute('width', 100);
                        subRect.setAttribute('height', 30);
                        subRect.setAttribute('rx', 6);
                        subRect.setAttribute('fill', '#f1f5f9');
                        subRect.setAttribute('stroke', colors[index % colors.length]);
                        subRect.setAttribute('stroke-width', '2');

                        const subText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        subText.setAttribute('x', x2);
                        subText.setAttribute('y', y2 + 5);
                        subText.setAttribute('text-anchor', 'middle');
                        subText.setAttribute('fill', '#475569');
                        subText.setAttribute('font-size', '11');
                        subText.textContent = subChild;

                        subNodeGroup.appendChild(subRect);
                        subNodeGroup.appendChild(subText);
                        svg.appendChild(subNodeGroup);
                    });
                }
            });
        }
    </script>
</body>
</html>
