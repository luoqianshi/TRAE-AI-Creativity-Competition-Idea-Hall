<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>朗读练习器</title>

  <!-- Font faces -->
  <style>
    @font-face {
      font-family: 'BigShoulders';
      src: url('./_shared/fonts/BigShoulders-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'InstrumentSans';
      src: url('./_shared/fonts/InstrumentSans-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'InstrumentSans';
      src: url('./_shared/fonts/InstrumentSans-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'InstrumentSerif';
      src: url('./_shared/fonts/InstrumentSerif-Italic.ttf') format('truetype');
      font-weight: 400;
      font-style: italic;
    }
    @font-face {
      font-family: 'GeistMono';
      src: url('./_shared/fonts/GeistMono-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
  </style>

  <!-- Theme & base styles -->
  <style>
    :root {
      --bg: #f0faf0;
      --bg2: #dceddc;
      --ink: #1a2e1e;
      --muted: #5a7a5e;
      --rule: #b8d0b8;
      --accent: #16a34a;
      --accent2: #22c55e;
      --green: #16a34a;
      --navy: #15803d;
      --red: #dc5a5a;
      --gold-light: #86efac;
      --font: 'InstrumentSans', system-ui, sans-serif;
      --font-h: 'BigShoulders', system-ui, sans-serif;
      --font-serif: 'InstrumentSerif', Georgia, serif;
      --font-mono: 'GeistMono', 'Courier New', monospace;
      --max: 820px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; height: 100%; overflow: hidden; scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ===== HERO (navy header) ===== */
    .hero {
      flex-shrink: 0;
      background: linear-gradient(135deg, #1b8a3f 0%, #22c55e 100%);
      color: #fff;
      padding: 12px 20px 10px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -100px;
      right: -100px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: -60px;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-inner {
      max-width: var(--max);
      margin: 0 auto;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hero-title {
      font-family: var(--font-h);
      font-size: clamp(1.2rem, 3vw, 1.5rem);
      line-height: 1.1;
      letter-spacing: 0.02em;
      margin-bottom: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      order: 1;
    }
    .hero-title-badge {
      font-family: var(--font);
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0.05em;
      background: rgba(255,255,255,0.2);
      padding: 2px 7px;
      border-radius: 8px;
      vertical-align: middle;
      white-space: nowrap;
    }
    .hero-top {
      display: contents;
    }
    .hero-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      order: 3;
    }
    .hero-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .hero-icon-btn:hover { background: rgba(255,255,255,0.22); }
    .hero-icon-btn:active { transform: scale(0.92); }
    .hero-icon-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .hero-icon-btn.faved { color: var(--red); }
    .fave-btn { }
    .day-card.liked { border-color: var(--red); }
    .day-card.liked .day-card-header .day-title::after {
      content: ' ♥';
      color: var(--red);
      font-size: 0.85em;
    }
    .hero-subtitle {
      font-family: var(--font);
      font-size: 0.78rem;
      color: rgba(255,255,255,0.85);
      margin: 0;
      line-height: 1.4;
      text-align: center;
      order: 4;
      flex-basis: 100%;
      padding-top: 2px;
    }
    .hero-features {
      display: none;
    }

    /* Progress row (day counter + arrows) */
    .progress-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 0;
      flex: 1;
      min-width: 0;
      order: 2;
    }
    .progress-label {
      font-family: var(--font-h);
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      color: #fff;
      white-space: nowrap;
    }
    .progress-arrows {
      display: flex;
      gap: 6px;
    }
    .arrow-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    .arrow-btn:hover { background: rgba(255,255,255,0.2); }
    .arrow-btn:active { transform: scale(0.92); }

    /* ===== TIMER ZONE (shared) ===== */

    /* ===== CATALOG PANEL ===== */
    .catalog-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(26,26,46,0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      animation: fadeIn 0.18s ease;
    }
    .catalog-backdrop[hidden] { display: none; }
    .catalog {
      background: #fff;
      width: 360px;
      max-width: 90vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: -8px 0 30px rgba(0,0,0,0.15);
      animation: slideInRight 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
      overflow: hidden;
    }
    @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .catalog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--rule);
      flex-shrink: 0;
    }
    .catalog-title {
      font-family: var(--font-h);
      font-size: 1.1rem;
      letter-spacing: 0.03em;
      color: var(--ink);
    }
    .catalog-close {
      width: 32px;
      height: 32px;
      background: var(--bg2);
      border: none;
      border-radius: 8px;
      font-size: 1.2rem;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
    }
    .catalog-close:hover { background: var(--rule); color: var(--ink); }
    .catalog-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }
    .catalog-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 18px;
      cursor: pointer;
      transition: background 0.1s;
      border-left: 3px solid transparent;
    }
    .catalog-item:hover { background: var(--bg); }
    .catalog-item.active { border-left-color: var(--accent); background: var(--bg2); }
    .catalog-item.liked { border-left-color: var(--red); }
    .catalog-item.active.liked { border-left-color: var(--red); }
    .catalog-item-num {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--muted);
      width: 26px;
      flex-shrink: 0;
      text-align: right;
    }
    .catalog-item-title {
      flex: 1;
      font-size: 0.82rem;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .catalog-item-badge {
      font-size: 0.65rem;
      flex-shrink: 0;
    }
    .catalog-item-badge.faved { color: var(--red); }
    .catalog-item-badge.done { color: var(--green); }
    .catalog-item-cat {
      font-size: 0.6rem;
      color: var(--accent2);
      background: rgba(21,128,61,0.1);
      padding: 1px 7px;
      border-radius: 10px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* ===== CATEGORY TAG ON CARD ===== */
    .day-cat-tag {
      font-size: 0.65rem;
      color: var(--accent2);
      background: rgba(21,128,61,0.08);
      padding: 2px 10px;
      border-radius: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ===== CATALOG FILTER ===== */
    .catalog-filter {
      display: flex;
      gap: 6px;
      padding: 6px 16px 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--rule);
    }
    .catalog-filter-btn {
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 12px;
      background: var(--bg2);
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s;
    }
    .catalog-filter-btn:hover { color: var(--ink); }
    .catalog-filter-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .catalog-toolbar {
      display: flex; gap: 6px; padding: 8px 18px;
      border-bottom: 1px solid var(--rule); flex-shrink: 0;
    }
    .catalog-toolbar-btn {
      display: flex; align-items: center; gap: 4px;
      padding: 5px 12px; border-radius: 8px; border: 1px solid var(--rule);
      background: #fff; color: var(--ink); font-size: 0.78rem;
      cursor: pointer; transition: all 0.12s; white-space: nowrap;
    }
    .catalog-toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }
    .catalog-toolbar-btn-danger { color: #e53e3e; border-color: #e53e3e; }
    .catalog-toolbar-btn-danger:hover { background: #e53e3e; color: #fff; }

    /* ===== VOICE SELECTOR ===== */
    .voice-list { margin: 0; padding: 0 26px 24px; max-height: 50vh; overflow-y: auto; flex: 1; min-height: 0; }
    .voice-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      margin-bottom: 4px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.1s;
      border: 1px solid var(--rule);
    }
    .voice-item:hover { background: var(--bg); }
    .voice-item.selected { border-color: var(--accent); background: var(--bg2); }
    .voice-item-name { font-size: 0.85rem; color: var(--ink); }
    .voice-item-lang { font-size: 0.72rem; color: var(--muted); }
    .voice-item-active { font-size: 0.72rem; color: var(--accent); font-weight: 600; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(26,26,46,0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
      animation: fadeIn 0.18s ease;
    }
    .modal-backdrop[hidden] { display: none; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--bg);
      border-radius: 16px;
      padding: 0;
      max-width: 440px;
      width: 100%;
      max-height: 85vh;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: modalIn 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 14px;
      z-index: 10;
      width: 32px;
      height: 32px;
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.3rem;
      line-height: 1;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .modal-body {
      padding: 0 26px 24px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    /* Custom scrollbar for modal */
    .modal-body::-webkit-scrollbar { width: 6px; }
    .modal-body::-webkit-scrollbar-track { background: transparent; }
    .modal-body::-webkit-scrollbar-thumb {
      background: var(--rule);
      border-radius: 3px;
    }
    .modal-body::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    @keyframes modalIn { from { transform: translateY(20px) scale(0.95); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal-close:hover { border-color: var(--accent); color: var(--accent); }

    /* ===== Confirm dialog ===== */
    .confirm-overlay {
      position: fixed; inset: 0; z-index: 10000;
      background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .confirm-overlay[hidden] { display: none; }
    .confirm-box {
      background: #fff; border-radius: 16px; padding: 24px 26px 20px;
      max-width: 360px; width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
      animation: modalIn 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .confirm-box p {
      margin: 0 0 20px; font-size: 0.95rem; color: var(--ink); line-height: 1.6;
    }
    .confirm-actions {
      display: flex; gap: 10px; justify-content: flex-end;
    }
    .confirm-actions button {
      border: 1px solid var(--rule); border-radius: 8px;
      padding: 8px 20px; font-size: 0.85rem; cursor: pointer;
      background: #fff; color: var(--ink); transition: all 0.12s;
    }
    .confirm-actions button:hover { border-color: var(--accent); }
    .confirm-actions .btn-danger {
      background: #e53e3e; color: #fff; border-color: #e53e3e;
    }
    .confirm-actions .btn-danger:hover { background: #c53030; }

    .modal-title {
      font-family: var(--font-h);
      font-size: 1.5rem;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin: 0;
      padding: 22px 26px 4px;
      padding-right: 58px;
    }
    .modal-sub {
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--accent2);
      font-size: 0.95rem;
      margin: 0;
      padding: 0 26px 12px;
    }
    .modal-body p {
      font-size: 0.95rem;
      line-height: 1.8;
      color: var(--ink);
    }
    .modal-body p + p { margin-top: 12px; }
    .modal-method {
      display: flex;
      gap: 14px;
      margin-bottom: 14px;
    }
    .modal-method .mm-step {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      background: var(--accent);
      color: #fff;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-h);
      font-size: 0.95rem;
    }
    .modal-method h6 {
      font-family: var(--font-h);
      font-size: 1rem;
      color: var(--ink);
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .modal-method p {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .modal-keys {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--rule);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .modal-keys span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .modal-keys kbd {
      display: inline-block;
      padding: 1px 6px;
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--ink);
    }

    /* ===== IMPORT MODAL ===== */
    .modal-import { max-width: 540px; }
    .import-label {
      display: block;
      font-family: var(--font-h);
      font-size: 0.88rem;
      color: var(--ink);
      margin: 14px 0 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .import-hint {
      font-family: var(--font);
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: none;
      font-weight: normal;
    }
    .import-input {
      display: block;
      width: 100%;
      padding: 10px 14px;
      font-size: 1rem;
      font-family: var(--font);
      border: 1px solid var(--rule);
      border-radius: 8px;
      outline: none;
      background: #fff;
      color: var(--ink);
      box-sizing: border-box;
    }
    .import-input:focus { border-color: var(--accent); }
    .import-textarea {
      display: block;
      width: 100%;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-family: var(--font);
      line-height: 1.7;
      border: 1px solid var(--rule);
      border-radius: 8px;
      outline: none;
      background: #fff;
      color: var(--ink);
      resize: vertical;
      min-height: 120px;
      box-sizing: border-box;
    }
    .import-textarea:focus { border-color: var(--accent); }
    .import-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      align-items: center;
    }
    .btn-import-save {
      padding: 10px 28px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-import-save:hover { background: #3a8a56; }
    .btn-import-delete {
      padding: 10px 20px;
      background: #fff;
      color: var(--red);
      border: 1px solid var(--red);
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      margin-right: auto;
    }
    .btn-import-delete:hover { background: #fff5f5; }
    .btn-import-cancel {
      padding: 10px 20px;
      background: var(--bg2);
      color: var(--muted);
      border: 1px solid var(--rule);
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-import-cancel:hover { color: var(--ink); }
    /* Batch import/export */
    .batch-actions-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .btn-batch-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: #fff;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 8px;
      font-size: 0.88rem;
      font-family: var(--font);
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-batch-action:hover {
      background: var(--accent);
      color: #fff;
    }
    .batch-mode-row {
      display: flex;
      gap: 20px;
      margin-top: 14px;
      margin-bottom: 4px;
    }
    .batch-radio {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      color: var(--muted);
      cursor: pointer;
    }
    .batch-radio input[type="radio"] {
      accent-color: var(--accent);
    }
    .batch-hint {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
    }
    .batch-hint.success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .batch-hint.error {
      display: block;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    /* ===== FIXED BOTTOM TIMER BAR ===== */
    .timer-bar-fixed {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--rule);
      box-shadow: 0 -2px 12px rgba(44,36,24,0.06);
    }
    .timer-bar-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 8px 16px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    /* Timer digits shown in day-card header */
    .timer-digits-header {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      letter-spacing: 0.02em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      margin-left: auto;
      padding: 6px 12px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(22,163,74,0.3);
      min-width: 68px;
      text-align: center;
      transition: all 0.2s ease;
    }
    .timer-digits-header.running {
      background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
      box-shadow: 0 2px 12px rgba(234,88,12,0.4);
      animation: pulse-timer 1s ease-in-out infinite;
    }
    .timer-digits-header.complete {
      background: linear-gradient(135deg, var(--green) 0%, #4ade80 100%);
      box-shadow: 0 2px 12px rgba(22,163,74,0.4);
    }
    @keyframes pulse-timer {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    /* Buttons inside fixed bar */
    .btn-timer-primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 18px;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .btn-timer-primary:hover { background: #166534; }
    .btn-timer-primary:active { transform: scale(0.97); }
    .btn-timer-primary.running { background: var(--accent2); }
    .btn-timer-primary.running:hover { background: #16a34a; }
    .btn-timer-primary.complete { background: var(--green); }
    .btn-timer-icon {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 38px;
      padding: 0 14px;
      background: #f5f5f5;
      color: var(--ink);
      border: 1px solid var(--rule);
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .btn-timer-icon:hover { border-color: var(--accent); color: var(--accent); }
    .btn-timer-icon:active { transform: scale(0.92); }
    .btn-speak.speaking { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-speak.speaking:hover { background: #3a8a56; }
    .day-card.speaking { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ===== SCROLLABLE CONTENT AREA ===== */
    .container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 16px 80px;
      max-width: var(--max);
      margin: 0 auto;
      width: 100%;
    }
    .container::-webkit-scrollbar { width: 4px; }
    .container::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }

    /* ===== DAY CARDS ===== */
    .days-section {
      padding: 16px 0 24px;
    }
    .day-card {
      background: #fff;
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 0;
      position: relative;
      transition: opacity 0.3s ease, transform 0.3s ease;
      touch-action: pan-y;
    }
    .day-card:not(.active-day) {
      /* hidden by default, shown in list mode */
    }
    .day-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--rule);
    }
    .day-card-header .day-title {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      letter-spacing: 0.01em;
      color: var(--navy);
      font-weight: 500;
      flex: 1;
    }
    .day-card .day-content {
      font-size: 0.95rem;
      line-height: 1.85;
      color: var(--ink);
    }
    .day-card .day-content p { margin-bottom: 10px; }
    .day-card .day-content p:last-child { margin-bottom: 0; }

    /* === Focus mode — always on === */
    .days-section .day-card { display: none; }
    .days-section .day-card.active-day { display: block; }

    /* ===== RESPONSIVE ===== */
    /* Safe area support for notched devices */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    @media (max-width: 768px) {
      :root { --max: 100%; }
      body {
        font-size: 15px;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      .hero {
        padding: calc(10px + var(--sat)) 14px 8px;
      }
      .hero-inner { gap: 10px; }
      .hero-title { font-size: 1.15rem; gap: 6px; }
      .hero-title-badge { font-size: 0.55rem; padding: 2px 6px; }
      .hero-icon-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
      }
      .hero-icon-btn svg { width: 14px; height: 14px; }
      .hero-actions { gap: 5px; }
      .progress-label { font-size: 0.82rem; }
      .arrow-btn {
        width: 30px;
        height: 30px;
        border-radius: 8px;
      }
      .arrow-btn svg { width: 11px; height: 11px; }
      .container {
        padding: 0 calc(12px + var(--sal)) calc(76px + var(--sab)) calc(12px + var(--sar)) !important;
      }
      .days-section { padding: 12px 0 8px; }
      .day-card {
        padding: 20px 18px;
        border-radius: 16px;
      }
      .day-card-header {
        gap: 8px;
        padding-bottom: 12px;
        margin-bottom: 14px;
        align-items: center;
      }
      .day-card-header .day-title { font-size: 1.15rem; }
      .day-cat-tag { font-size: 0.7rem; padding: 2px 8px; }
      .timer-digits-header {
        font-size: 1rem;
        padding: 7px 14px;
        min-width: 72px;
      }
      .day-card .day-content { font-size: 1rem; line-height: 1.85; }
      .day-card .day-content p { margin-bottom: 14px; }

      /* Fixed timer bar */
      .timer-bar-fixed {
        padding-bottom: var(--sab);
      }
      .timer-bar-inner {
        padding: 8px 12px 8px;
        gap: 8px;
      }
      .btn-timer-primary {
        height: 44px;
        padding: 0 18px;
        font-size: 0.88rem;
        border-radius: 12px;
        flex: 0 0 auto;
      }
      .btn-timer-icon {
        height: 44px;
        padding: 0 12px;
        font-size: 0.85rem;
        border-radius: 12px;
      }

      /* Modal */
      .modal {
        width: calc(100% - 24px);
        max-height: calc(90vh - var(--sat));
        margin: calc(var(--sat) + 5vh) auto 0;
        border-radius: 16px;
      }
      .modal-title { font-size: 1.1rem; padding: 18px 20px 4px; padding-right: 50px; }
      .modal-sub { padding: 0 20px 10px; font-size: 0.85rem; }
      .modal-body { padding: 0 20px 20px; }
      .modal-close { width: 30px; height: 30px; top: 10px; right: 10px; }
      .import-input, .import-textarea {
        font-size: 16px !important; /* Prevent iOS zoom */
      }
      .btn-import-save, .btn-import-cancel, .btn-import-delete, .btn-batch-action {
        height: 44px;
        font-size: 0.9rem;
        border-radius: 10px;
      }
      .batch-actions-row { gap: 8px; }
      .btn-batch-action {
        flex: 1;
        min-width: calc(50% - 4px);
        justify-content: center;
      }
      .batch-mode-row { gap: 16px; }

      /* Catalog */
      .catalog {
        width: calc(100% - 20px);
        max-height: calc(85vh - var(--sat));
        margin: calc(var(--sat) + 8vh) auto 0;
        border-radius: 16px;
      }
      .catalog-list { padding: 8px 12px calc(12px + var(--sab)); }
      .catalog-item {
        padding: 12px 14px;
        min-height: 48px;
      }
    }

    /* Mobile secondary actions - all buttons visible in header */
    @media (max-width: 480px) {
      .catalog-toolbar { display: none; }
    }

    @media (max-width: 480px) {
      .hero { padding: calc(10px + var(--sat)) 14px 8px; }
      /* Mobile: two rows - row1: title + 4 buttons, row2: subtitle + progress */
      .hero-inner {
        flex-wrap: wrap;
        gap: 6px;
      }
      .hero-title {
        font-size: 1.05rem;
        gap: 5px;
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        order: 1;
      }
      .hero-title-badge { font-size: 0.5rem; padding: 2px 5px; flex-shrink: 0; }
      .hero-actions {
        gap: 5px;
        flex-shrink: 0;
        order: 2;
      }
      .hero-icon-btn {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: rgba(255,255,255,0.15);
      }
      .hero-icon-btn svg { width: 14px; height: 14px; }

      .hero-subtitle {
        font-size: 0.7rem;
        padding-top: 0;
        order: 3;
      }

      .progress-row {
        flex: 0 0 100%;
        order: 4;
        gap: 10px;
        justify-content: center;
      }
      .progress-label { font-size: 0.82rem; font-weight: 600; }
      .arrow-btn { width: 32px; height: 32px; border-radius: 9px; background: rgba(255,255,255,0.15); }
      .arrow-btn svg { width: 11px; height: 11px; }

      .catalog-filter {
        padding: 8px 14px 10px;
      }

      .container {
        padding: 0 calc(12px + var(--sal)) calc(70px + var(--sab)) calc(12px + var(--sar)) !important;
      }
      .day-card {
        padding: 18px 14px;
        border-radius: 14px;
      }
      .day-card-header .day-title { font-size: 1.08rem; }
      .day-card .day-content { font-size: 0.98rem; line-height: 1.82; }
      .day-card .day-content p { margin-bottom: 12px; }
      .timer-digits-header {
        font-size: 0.95rem;
        padding: 6px 12px;
        min-width: 66px;
      }

      .timer-bar-inner {
        padding: 6px 8px 6px;
        gap: 6px;
      }
      .btn-timer-primary {
        height: 42px;
        padding: 0 14px;
        font-size: 0.82rem;
      }
      .btn-speak, #btnVoice { display: none !important; }
      .btn-timer-icon {
        height: 42px;
        padding: 0 12px;
        font-size: 0.8rem;
      }
      .btn-timer-icon span { display: inline; }
    }

    @media (max-width: 360px) {
      .hero-icon-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
      }
      .hero-actions { gap: 5px; }
      .hero-icon-btn svg { width: 14px; height: 14px; }
      .hero-title { font-size: 1rem; }
      .hero-title-badge { font-size: 0.5rem; padding: 1px 5px; }
      .arrow-btn { width: 30px; height: 30px; border-radius: 8px; }
      .arrow-btn svg { width: 11px; height: 11px; }
      .progress-label { font-size: 0.8rem; }
    }

    @media (hover: none) and (pointer: coarse) {
      .day-card { cursor: default; }
      /* Larger touch targets */
      .hero-icon-btn, .arrow-btn { min-width: 36px; min-height: 36px; }
    }

    @media print {
      .hero, .timer-bar-fixed { display: none !important; }
      .day-card { break-inside: avoid; border: 1px solid #ccc; box-shadow: none; }
      body { padding-bottom: 0; }
    }

    .day-anchor { scroll-margin-top: 80px; }
  </style>
</head>
<body>

<!-- ==================== HERO HEADER (navy) ==================== -->
<header class="hero">
  <div class="hero-inner">
    <div class="hero-top">
      <h1 class="hero-title">朗读练习器</h1>
      <div class="hero-actions">
        <button class="hero-icon-btn fave-btn" id="btnFav" title="标记喜欢" aria-label="喜欢">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" id="favIcon"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <button class="hero-icon-btn" id="btnShuffle" title="随机顺序" aria-label="随机顺序">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button class="hero-icon-btn fav-filter-btn" id="btnFavFilter" title="只看喜欢" aria-label="只看喜欢">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="hero-icon-btn" id="btnCatalog" title="查看所有篇目" aria-label="目录">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
      </div>
    </div>
    <p class="hero-subtitle">每天开口一分钟，练就流畅表达力</p>

    <div class="progress-row">
      <button class="arrow-btn" id="btnPrev" title="上一天 (←)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <span class="progress-label" id="dayLabel">第 1 / 60 天</span>
      <button class="arrow-btn" id="btnNext" title="下一天 (→)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>


  </div>
</header>

<!-- Catalog panel -->
<div class="catalog-backdrop" id="catalogPanel" hidden>
  <div class="catalog" role="dialog" aria-modal="true">
    <div class="catalog-header">
      <span class="catalog-title" id="catalogTitle">全部篇目</span>
      <button class="catalog-close" id="catalogClose" aria-label="关闭">×</button>
    </div>
    <div class="catalog-toolbar" id="catalogToolbar">
      <button class="catalog-toolbar-btn catalog-toolbar-btn-danger" id="catalogBtnClear" title="清除所有记录">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        清除所有记录
      </button>
    </div>
    <div class="catalog-filter" id="catalogFilter">
      <span class="catalog-filter-btn active" data-cat="">全部</span>
    </div>
    <div class="catalog-list" id="catalogList"></div>
  </div>
</div>

<!-- Confirm dialog -->
<div class="confirm-overlay" id="confirmClear" hidden>
  <div class="confirm-box">
    <p>确定要清除所有历史记录吗？<br>这将重置完成状态、喜欢标记和练习进度，此操作不可撤销。</p>
    <div class="confirm-actions">
      <button id="confirmClearCancel">取消</button>
      <button class="btn-danger" id="confirmClearOk">确认清除</button>
    </div>
  </div>
</div>

<!-- Voice selector -->
<div class="modal-backdrop" id="modalVoice" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" data-close="modalVoice" aria-label="关闭">×</button>
    <div class="modal-title">选择朗读语音</div>
    <div class="modal-sub">点击试听，选中后自动保存</div>
    <div class="voice-list" id="voiceList"></div>
  </div>
</div>

<!-- Modals -->
<div class="modal-backdrop" id="modalAbout" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" data-close="modalAbout" aria-label="关闭">×</button>
    <div class="modal-title">关于朗读练习器</div>
    <div class="modal-sub">读得流畅，说得自信</div>
    <div class="modal-body">
      <p>朗读是提升表达力最简单有效的方法。每天一篇，用心读，用耳听。</p>
      <p>本工具会自动根据文章字数计算所需的朗读时间，让你精准掌控节奏。</p>
      <p>你只需要添加内容，然后跟着计时器练习即可。</p>
    </div>
  </div>
</div>

<!-- Import / Edit modal -->
<div class="modal-backdrop" id="modalImport" hidden>
  <div class="modal modal-import" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalImportClose" aria-label="关闭">×</button>
    <div class="modal-title" id="importModalTitle">导入新文章</div>
    <div class="modal-body">
      <label class="import-label">标题</label>
      <input class="import-input" id="importTitle" type="text" placeholder="给这篇文章起个标题" maxlength="40">
      <label class="import-label">领域/分类</label>
      <input class="import-input" id="importCategory" type="text" placeholder="如：沟通艺术、思维方法、声音训练…" list="catSuggestions" maxlength="20">
      <datalist id="catSuggestions">
        <option value="沟通艺术"><option value="语言精炼"><option value="思维方法"><option value="表达设计">
        <option value="声音训练"><option value="素材积累"><option value="叙事技巧"><option value="练习方法">
        <option value="心理建设"><option value="复盘成长"><option value="说服技巧"><option value="个人风格">
        <option value="基础理念">
      </datalist>
      <label class="import-label">正文 <span class="import-hint">每段之间用空行分隔</span></label>
      <textarea class="import-textarea" id="importContent" rows="8" placeholder="粘贴或输入你的朗读内容&#10;每段之间留一个空行"></textarea>
      <div class="import-actions">
        <button class="btn-import-save" id="btnImportSave">保存</button>
        <button class="btn-import-delete" id="btnImportDelete" hidden>删除此篇</button>
        <button class="btn-import-cancel" id="btnImportCancel">取消</button>
      </div>
    </div>
  </div>
</div>

<!-- Batch Import/Export modal -->
<div class="modal-backdrop" id="modalBatch" hidden>
  <div class="modal modal-import" role="dialog" aria-modal="true" style="max-width: 640px;">
    <button class="modal-close" id="modalBatchClose" aria-label="关闭">×</button>
    <div class="modal-title">批量导入 / 导出</div>
    <div class="modal-sub">使用 JSON 格式备份或恢复你的练习内容</div>
    <div class="modal-body">
      <div class="batch-actions-row">
        <button class="btn-batch-action" id="btnExportJson">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          导出 JSON
        </button>
        <button class="btn-batch-action" id="btnDownloadTemplate">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          下载模板
        </button>
        <button class="btn-batch-action" id="btnImportJson">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          导入 JSON
        </button>
        <input type="file" id="batchFileInput" accept=".json" style="display:none">
      </div>
      <label class="import-label">JSON 数据 <span class="import-hint">粘贴 JSON 内容后点击下方导入按钮</span></label>
      <textarea class="import-textarea" id="batchJsonArea" rows="10" placeholder='[{"title":"标题","category":"分类","content":["段落1","段落2"]}]'></textarea>
      <div class="batch-mode-row">
        <label class="batch-radio">
          <input type="radio" name="batchMode" value="append" checked> 追加到现有内容
        </label>
        <label class="batch-radio">
          <input type="radio" name="batchMode" value="replace"> 替换所有内容
        </label>
      </div>
      <div class="import-actions">
        <button class="btn-import-save" id="btnBatchImportConfirm">确认导入</button>
        <button class="btn-import-cancel" id="btnBatchCancel">关闭</button>
      </div>
      <div class="batch-hint" id="batchHint"></div>
    </div>
  </div>
</div>

<!-- Days content -->
<div class="container">

  <!-- ==================== 60 DAYS ==================== -->
  <section class="days-section">

    <div id="daysContainer"></div>
  </section>

</div>

<!-- Fixed bottom timer bar -->
<div class="timer-bar-fixed">
  <div class="timer-bar-inner">
    <button class="btn-timer-primary" id="btnTimer" title="空格键 开始/暂停">
      <span id="btnTimerIcon">▶</span>

(function() {

  function goToDay(day) {

  function prevDay() {

  function getBestZHVoice() {
    if (!speechVoicesLoaded && allVoices.length === 0) return null;
    var zh = allVoices.filter(function(v) { return v.lang.startsWith('zh'); });

    // Preferred voice name patterns (more natural sounding)
    var preferred = ['Xiaoxiao Online (Natural)', 'Xiaoxiao', 'Kangkang', 'Yunxi', 'Yunjian', 'Huihui', 'Yaoyao'];
    for (var p = 0; p < preferred.length; p++) {
      var match = zh.find(function(v) { return v.name.indexOf(preferred[p]) !== -1; });
      if (match) return match;
    }
    // Fallback: prefer female (zh-CN) over male
    var zhCN = zh.filter(function(v) { return v.lang.indexOf('CN') !== -1; });
    if (zhCN.length > 0) return zhCN[0];
    return zh.length > 0 ? zh[0] : null;
  }

  function calcTimerValue(day) {
    var text = getDayText(day);

  function speakDay(day) {
    if (speechPlaying) { cancelSpeech(); return; }
    if (speechPaused) { resumeSpeech(); return; }
    var text = getDayText(day);

    // Cancel existing
    speechSynth.cancel();

    speechUtterance = new SpeechSynthesisUtterance(text);
    speechUtterance.lang = 'zh-CN';
    speechUtterance.rate = 1.0;
    speechUtterance.pitch = 1.0;
    speechUtterance.volume = 1.0;

    // Use selected voice or best available
    if (selectedVoiceURI) {
      var savedVoice = allVoices.find(function(v) { return v.voiceURI === selectedVoiceURI; });
      if (savedVoice) speechUtterance.voice = savedVoice;
    }
    if (!speechUtterance.voice) {
      var bestVoice = getBestZHVoice();
      if (bestVoice) {
        speechUtterance.voice = bestVoice;
        selectedVoiceURI = bestVoice.voiceURI;
        localStorage.setItem('rp_voiceURI', selectedVoiceURI);

  // Validate and parse JSON data
  function parseBatchData(jsonStr) {
    try {
      var data = JSON.parse(jsonStr);
      if (!Array.isArray(data)) {
        return { error: 'JSON 必须是数组格式' };
      }
      var validItems = [];
      var errors = [];
      data.forEach(function(item, idx) {
        if (!item || typeof item !== 'object') {
          errors.push('第 ' + (idx+1) + ' 项格式错误');
          return;
        }
        if (!item.title || typeof item.title !== 'string') {
          errors.push('第 ' + (idx+1) + ' 项缺少 title 字段');
          return;
        }
        if (!Array.isArray(item.content) || item.content.length === 0) {
          errors.push('第 ' + (idx+1) + ' 项「' + item.title + '」缺少 content 段落');
          return;
        }
        var validContent = item.content.filter(function(p) { return p && typeof p === 'string' && p.trim(); });
        if (validContent.length === 0) {
          errors.push('第 ' + (idx+1) + ' 项「' + item.title + '」content 为空');
          return;
        }
        validItems.push({
          title: item.title.trim(),
          category: (item.category && typeof item.category === 'string') ? item.category.trim() : '',
          content: validContent.map(function(p) { return p.trim(); })
        });
      });
      if (validItems.length === 0) {
        return { error: '没有有效的文章数据' + (errors.length > 0 ? '：' + errors[0] : '') };
      }
      return { items: validItems, errors: errors };
    } catch(e) {
      return { error: 'JSON 解析错误：' + e.message };
    }
  }

  // Confirm batch import
  function doBatchImport() {
    var jsonStr = document.getElementById('batchJsonArea').value.trim();
    if (!jsonStr) {
      showBatchHint('请先粘贴 JSON 内容或选择文件', 'error');
      return;
    }
    var result = parseBatchData(jsonStr);
    if (result.error) {
      showBatchHint(result.error, 'error');
      return;
    }
    var mode = document.querySelector('input[name="batchMode"]:checked').value;
    var newItems = result.items;

    if (mode === 'replace') {
      if (!confirm('确定要替换所有现有内容吗？此操作不可撤销！')) return;
      // Find max ID in existing data to continue numbering? No, replace completely
      daysData = [];
      likedDays = [];
      completedDays = [];
    }

    // Find current max ID
    var maxId = 0;
    daysData.forEach(function(d) { if (d.id > maxId) maxId = d.id; });

    // Add new items with IDs
    newItems.forEach(function(item, idx) {
      maxId++;
      daysData.push({
        id: maxId,
        title: item.title,
        category: item.category,
        content: item.content
      });
    });

    TOTAL = daysData.length;
    dayTitles = {};
    dayCategories = {};
    daysData.forEach(function(d) { dayTitles[d.id] = d.title; dayCategories[d.id] = d.category || ''; });

    // If replaced and no currentDay valid, set to first
    if (mode === 'replace' || !daysData.some(function(d) { return d.id === currentDay; })) {
      currentDay = daysData[0] ? daysData[0].id : 1;
    }

    saveUserData();
    saveState();
    renderCards();
    updateUI();
    buildCatalog();
    goToDay(currentDay);

    var msg = '成功导入 ' + newItems.length + ' 篇内容';
    if (result.errors && result.errors.length > 0) {
      msg += '，跳过 ' + result.errors.length + ' 项格式错误';

  }

    container.addEventListener('touchmove', function(e) {
      if (!swiping) return;
      // Prevent vertical scroll when swiping horizontally
      var dx = Math.abs(e.touches[0].clientX - touchStartX);
      var dy = Math.abs(e.touches[0].clientY - touchStartY);
      if (dx > dy && dx > 10) e.preventDefault();
    }, { passive: false });
    container.addEventListener('touchend', function(e) {
      if (!swiping) return;
      swiping = false;
      var dx = e.changedTouches[0].clientX - touchStartX;
      var dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) < 30 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      if (dx > 0) prevDay(); else nextDay();
    }, { passive: true });
  })();



  function renderCards() {
    var container = document.getElementById('daysContainer');
    if (!container) return;
    // Detach timerEl from its parent so it survives innerHTML replacement
    if (timerEl.parentNode) timerEl.parentNode.removeChild(timerEl);
    var html = '';
    daysData.forEach(function(d) {
      html += '<div class="day-card day-anchor" id="day' + d.id + '">';
      html += '<div class="day-card-header"><span class="day-title">' + d.title + '</span>';
      if (d.category) html += '<span class="day-cat-tag">' + d.category + '</span>';
      html += '</div>';
      html += '<div class="day-content">';
      d.content.forEach(function(p) { html += '<p>' + p + '</p>'; });
      html += '</div></div>';
    });
    container.innerHTML = html;
    cards = Array.from(document.querySelectorAll('.day-card'));
  }

  // Init shuffle button state
  if (shuffleOn) {
    document.getElementById('btnShuffle').classList.add('active');
    var catalogShuffle = document.getElementById('catalogBtnShuffle');
    if (catalogShuffle) catalogShuffle.classList.add('active');
  }
  if (favFilterOn) {
    document.getElementById('btnFavFilter').classList.add('active');
    var catalogFavFilter = document.getElementById('catalogBtnFavFilter');
    if (catalogFavFilter) catalogFavFilter.classList.add('active');
  }

  // Init shuffle orders on page load
  if (shuffleOn) {
    generateShuffle();
    for (var i = 0; i < TOTAL; i++) {
      if (shuffledOrder[i] === currentDay) { shuffleIndex = i; break; }
    }
  }
  if (shuffleOn && favFilterOn && likedDays.length > 0) {
    generateFavShuffle();
    for (var i = 0; i < favShuffleOrder.length; i++) {
      if (favShuffleOrder[i] === currentDay) { favShuffleIndex = i; break; }
    }
  }

  // Init
  loadUserData();
  // Rebuild lookup maps in case loadUserData didn't run (length mismatch)
  if (Object.keys(dayTitles).length !== daysData.length) {
    dayTitles = {};
    dayCategories = {};
    daysData.forEach(function(d) { dayTitles[d.id] = d.title; dayCategories[d.id] = d.category || ''; });
    TOTAL = daysData.length;
  }
  // Clean up stale IDs in completedDays and likedDays (articles that no longer exist)
  (function() {
    var validIds = {};
    daysData.forEach(function(d) { validIds[d.id] = true; });
    var beforeC = completedDays.length, beforeL = likedDays.length;
    completedDays = completedDays.filter(function(id) { return validIds[id]; });
    likedDays = likedDays.filter(function(id) { return validIds[id]; });
    if (completedDays.length !== beforeC || likedDays.length !== beforeL) {
      saveState();
    }
    // Reset currentDay if it no longer exists
    if (currentDay && !validIds[currentDay]) {
      currentDay = daysData[0] ? daysData[0].id : 1;
      saveState();
    }
  })();
  renderCards();
  buildCatalog();
  updateUI();
  // Set timer based on current content
  timerValue = calcTimerValue(currentDay);
  getTimerEl().textContent = formatTime(timerValue);
  // Scroll to current day after layout settles
  setTimeout(function() {
    var el = document.getElementById('day' + currentDay);
    if (el) el.scrollIntoView({ block: 'center' });
  }, 100);
})();
</script>

</body>
