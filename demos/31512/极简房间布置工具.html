<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简房间布置工具 RoomPlan</title>
<style>
  :root{
    --bg:#f7f6f2; --panel:#ffffff; --ink:#1a1a1a; --muted:#8a8a8a;
    --line:#e8e6e0; --accent:#ff6b4a; --accent-soft:#fff1ed;
    --warn:#ef4444; --ok:#10b981; --room:#fafaf7;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}

  /* ===== Layout ===== */
  .app{display:flex;flex-direction:column;height:100vh}
  .topbar{
    display:flex;align-items:center;gap:16px;padding:0 20px;height:56px;
    background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;z-index:20;
  }
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.3px}
  .logo .dot{width:22px;height:22px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
  .topbar .divider{width:1px;height:24px;background:var(--line)}
  .room-input{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  .room-input input{
    width:54px;height:30px;border:1px solid var(--line);border-radius:6px;text-align:center;
    font-size:13px;color:var(--ink);background:var(--bg);outline:none;transition:.15s;
  }
  .room-input input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  .room-input input.err{border-color:var(--warn);background:#fef2f2}
  .topbar .spacer{flex:1}
  .btn{
    display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;
    font-size:13px;font-weight:500;transition:.15s;white-space:nowrap;
  }
  .btn-ghost{color:var(--muted)} .btn-ghost:hover{background:var(--bg);color:var(--ink)}
  .btn-primary{background:var(--accent);color:#fff} .btn-primary:hover{background:#ff5733}
  .btn-outline{border:1px solid var(--line);color:var(--ink);background:var(--panel)} .btn-outline:hover{border-color:var(--ink)}
  .btn-pro{background:linear-gradient(135deg,#1a1a1a,#333);color:#fff} .btn-pro:hover{opacity:.9}
  .btn svg{width:15px;height:15px}

  .main{display:flex;flex:1;overflow:hidden}
  .sidebar{
    width:240px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;
  }
  .sidebar h3{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;padding:16px 16px 8px}
  .cat{border-bottom:1px solid var(--line)}
  .cat-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;user-select:none}
  .cat-head .arrow{transition:.2s;color:var(--muted)} .cat.open .cat-head .arrow{transform:rotate(90deg)}
  .cat-body{display:none;padding:0 12px 12px} .cat.open .cat-body{display:block}
  .furn-item{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;
    transition:.12s;margin-bottom:2px;
  }
  .furn-item:hover{background:var(--accent-soft)}
  .furn-icon{width:30px;height:30px;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--line)}
  .furn-icon svg{width:18px;height:18px}
  .furn-meta{flex:1;min-width:0}
  .furn-name{font-size:13px;font-weight:500;line-height:1.2}
  .furn-size{font-size:11px;color:var(--muted);margin-top:1px}

  .canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg)}
  #stage{display:block;cursor:default}
  .canvas-overlay{position:absolute;left:0;right:0;bottom:0;padding:10px 16px;display:flex;align-items:center;gap:14px;background:linear-gradient(to top,rgba(247,246,242,.95),transparent);pointer-events:none}
  .canvas-overlay > *{pointer-events:auto}
  .scale-tag{font-size:11px;color:var(--muted);background:var(--panel);padding:5px 10px;border-radius:6px;border:1px solid var(--line)}
  .toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--panel);padding:5px 10px;border-radius:6px;border:1px solid var(--line);cursor:pointer}
  .toggle .sw{width:26px;height:15px;border-radius:8px;background:var(--line);position:relative;transition:.2s}
  .toggle .sw::after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .toggle.on .sw{background:var(--accent)} .toggle.on .sw::after{left:13px}
  .zoom-ctrl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--panel);padding:5px 10px;border-radius:6px;border:1px solid var(--line)}
  .zoom-ctrl button{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink)}
  .zoom-ctrl button:hover{background:var(--bg)}
  .zoom-val{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}

  /* floating toolbar on selected furniture */
  .float-tools{
    position:absolute;display:none;gap:2px;background:var(--ink);padding:4px;border-radius:8px;
    box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:15;
  }
  .float-tools button{width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;transition:.12s}
  .float-tools button:hover{background:rgba(255,255,255,.15)}
  .float-tools button.danger:hover{background:var(--warn)}
  .float-tools svg{width:14px;height:14px}

  /* toast */
  .toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:100;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.2)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* modal */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(2px)}
  .modal-mask.show{display:flex}
  .modal{background:var(--panel);border-radius:14px;padding:28px;max-width:380px;width:90%;box-shadow:var(--shadow);text-align:center;animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h3{font-size:18px;margin-bottom:8px}
  .modal p{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:20px}
  .modal .actions{display:flex;gap:10px;justify-content:center}

  .empty-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);pointer-events:none}
  .empty-hint .big{font-size:15px;font-weight:500;margin-bottom:4px}
  .empty-hint .small{font-size:12px}

  .furn-count{font-size:11px;color:var(--muted);margin-left:auto;background:var(--bg);padding:2px 8px;border-radius:10px}
</style>
</head>
<body>
<div class="app">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="logo"><div class="dot">R</div>RoomPlan</div>
    <div class="divider"></div>
    <div class="room-input">
      宽 <input id="inW" type="number" min="1" max="20" step="0.5" value="4.5"> m
      <span style="margin:0 4px">×</span>
      长 <input id="inH" type="number" min="1" max="20" step="0.5" value="4.0"> m
    </div>
    <button class="btn btn-ghost" id="btnApply" title="应用尺寸">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>应用
    </button>
    <div class="spacer"></div>
    <button class="btn btn-outline" id="btnSave">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
      保存JSON
    </button>
    <button class="btn btn-outline" id="btnLoad">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg>
      加载JSON
    </button>
    <button class="btn btn-primary" id="btnPng">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
      导出PNG
    </button>
    <button class="btn btn-pro" id="btnPro">Pro</button>
    <input type="file" id="fileInput" accept=".json" style="display:none">
  </div>

  <div class="main">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar"></div>

    <!-- Canvas -->
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="stage"></canvas>
      <div class="empty-hint" id="emptyHint">
        <div class="big">点击左侧家具添加到房间</div>
        <div class="small">拖拽移动 · 选中后旋转/删除 · 滚轮缩放</div>
      </div>
      <div class="float-tools" id="floatTools">
        <button id="ftRotate" title="旋转90°">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.36 2.64L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button id="ftDup" title="复制">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        </button>
        <button id="ftDel" class="danger" title="删除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        </button>
      </div>
      <div class="canvas-overlay">
        <div class="scale-tag" id="scaleTag">1格 = 0.5m</div>
        <div class="toggle on" id="gridToggle"><div class="sw"></div>网格</div>
        <div class="toggle on" id="snapToggle"><div class="sw"></div>吸附</div>
        <div class="zoom-ctrl">
          <button id="zoomOut">−</button>
          <span class="zoom-val" id="zoomVal">100%</span>
          <button id="zoomIn">+</button>
          <button id="zoomFit" title="适应窗口" style="font-size:12px;width:auto;padding:0 6px">适应</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3 id="modalTitle">升级 Pro</h3>
    <p id="modalText">免费版每房间最多 10 件家具。升级 Pro 解锁无限家具、高清导出与云端保存。</p>
    <div class="actions">
      <button class="btn btn-outline" id="modalCancel">稍后再说</button>
      <button class="btn btn-primary" id="modalOk">了解 Pro</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   极简房间布置工具 RoomPlan — 单文件实现
   ============================================================ */

/* ---------- Furniture Library ---------- */
const FURN = {
  bedroom:{label:"卧室",items:[
    {n:"单人床",w:0.9,d:2.0,c:"#d4a5a5"},{n:"双人床",w:1.5,d:2.0,c:"#c98b8b"},
    {n:"大床",w:1.8,d:2.0,c:"#b87070"},{n:"床头柜",w:0.5,d:0.4,c:"#e0c4a8"},
    {n:"衣柜",w:1.6,d:0.5,c:"#a89070"},
  ]},
  living:{label:"客厅",items:[
    {n:"双人沙发",w:1.4,d:0.8,c:"#a5c4d4"},{n:"三人沙发",w:1.8,d:0.8,c:"#8baecb"},
    {n:"茶几",w:1.1,d:0.5,c:"#c4b89a"},{n:"电视柜",w:1.6,d:0.4,c:"#9a8c70"},
  ]},
  study:{label:"书房 / 工作区",items:[
    {n:"书桌",w:1.2,d:0.6,c:"#b8c4a8"},{n:"办公椅",w:0.6,d:0.6,c:"#a0b890"},
    {n:"书柜",w:0.8,d:0.3,c:"#8ca070"},
  ]},
  dining:{label:"餐厅",items:[
    {n:"餐桌",w:1.4,d:0.8,c:"#d4c4a5"},{n:"餐椅",w:0.45,d:0.45,c:"#c0a884"},
  ]},
  general:{label:"通用",items:[
    {n:"洗手台",w:0.6,d:0.5,c:"#a8d4d4"},{n:"马桶",w:0.4,d:0.7,c:"#b8d4d4"},
  ]},
};

/* simple SVG icons per category */
const ICONS={
  bed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 17v-5a2 2 0 012-2h16a2 2 0 012 2v5M2 17h20M2 17v3M22 17v3M6 10V7a1 1 0 011-1h10a1 1 0 011 1v3"/></svg>',
  sofa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12v5h18v-5M3 12V8a2 2 0 012-2h14a2 2 0 012 2v4M3 12h18M6 17v2M18 17v2"/></svg>',
  desk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10h18M5 10v10M19 10v10M8 10V6h8v4"/></svg>',
  dining:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="8" width="14" height="2" rx="1"/><path d="M12 10v8M9 18h6M8 8V5M16 8V5"/></svg>',
  bath:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h16v3a4 4 0 01-4 4H8a4 4 0 01-4-4v-3zM6 12V6a2 2 0 012-2h2M18 12V8"/></svg>',
};

/* ---------- State ---------- */
const FREE_MAX_FURN=10;
let room={w:4.5,h:4.0};
let items=[]; // {id,n,w,d,x,y,rot,c}
let selectedId=null;
let scale=1;          // px per meter
let zoom=1;           // user zoom multiplier
let panX=0,panY=0;    // canvas pan offset
let showGrid=true;
let snap=true;
let isPro=false;
let drag=null;        // dragging state
let nextId=1;

/* ---------- DOM ---------- */
const canvas=document.getElementById('stage');
const ctx=canvas.getContext('2d');
const wrap=document.getElementById('canvasWrap');
const sidebar=document.getElementById('sidebar');
const emptyHint=document.getElementById('emptyHint');
const floatTools=document.getElementById('floatTools');
const toastEl=document.getElementById('toast');
const modalMask=document.getElementById('modalMask');

/* ---------- Init Sidebar ---------- */
function buildSidebar(){
  sidebar.innerHTML='<h3>家具库</h3>';
  Object.entries(FURN).forEach(([key,cat])=>{
    const ic=ICONS[key]||ICONS.desk;
    const catEl=document.createElement('div');
    catEl.className='cat open';
    catEl.innerHTML=`
      <div class="cat-head"><span>${cat.label}</span><span class="arrow">›</span></div>
      <div class="cat-body"></div>`;
    const body=catEl.querySelector('.cat-body');
    cat.items.forEach(f=>{
      const it=document.createElement('div');
      it.className='furn-item';
      it.innerHTML=`<div class="furn-icon" style="color:${f.c}">${ic}</div>
        <div class="furn-meta"><div class="furn-name">${f.n}</div>
        <div class="furn-size">${f.w}×${f.d}m</div></div>`;
      it.onclick=()=>addFurniture(f);
      body.appendChild(it);
    });
    catEl.querySelector('.cat-head').onclick=()=>catEl.classList.toggle('open');
    sidebar.appendChild(catEl);
  });
}

/* ---------- Add Furniture ---------- */
function addFurniture(f){
  if(!isPro && items.length>=FREE_MAX_FURN){
    showModal('已达免费版上限',`免费版每房间最多 ${FREE_MAX_FURN} 件家具。升级 Pro 解锁无限家具、高清导出与云端保存。`);
    return;
  }
  const cx=room.w/2 - f.w/2;
  const cy=room.h/2 - f.d/2;
  const it={id:nextId++,n:f.n,w:f.w,d:f.d,x:cx,y:cy,rot:0,c:f.c};
  items.push(it);
  selectedId=it.id;
  hideEmptyHint();
  render();
}

/* ---------- Geometry helpers ---------- */
function getRotatedSize(it){
  // after 90/270 rotation w<->d swap
  if(it.rot===90||it.rot===270) return {w:it.d,d:it.w};
  return {w:it.w,d:it.d};
}
function clampItem(it){
  const s=getRotatedSize(it);
  it.x=Math.max(0,Math.min(room.w-s.w,it.x));
  it.y=Math.max(0,Math.min(room.h-s.d,it.y));
}
function snapVal(v){return snap?Math.round(v*2)/2:v;}
function rectsOverlap(a,b){
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.d && a.y+a.d>b.y;
}
function checkOverlap(id){
  const it=items.find(i=>i.id===id); if(!it) return false;
  const s=getRotatedSize(it);
  const a={x:it.x,y:it.y,w:s.w,d:s.d};
  return items.some(o=>{
    if(o.id===id) return false;
    const os=getRotatedSize(o);
    return rectsOverlap(a,{x:o.x,y:o.y,w:os.w,d:os.d});
  });
}

/* ---------- Coordinate transform ---------- */
function w2s(mx,my){ // world(meter) -> screen(px)
  return {x:panX+mx*scale*zoom, y:panY+my*scale*zoom};
}
function s2w(px,py){ // screen(px) -> world(meter)
  return {x:(px-panX)/(scale*zoom), y:(py-panY)/(scale*zoom)};
}

/* ---------- Render ---------- */
function resize(){
  const r=wrap.getBoundingClientRect();
  canvas.width=r.width*devicePixelRatio;
  canvas.height=r.height*devicePixelRatio;
  canvas.style.width=r.width+'px';
  canvas.style.height=r.height+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
function fitView(){
  const r=wrap.getBoundingClientRect();
  const pad=60;
  const sx=(r.width-pad*2)/room.w;
  const sy=(r.height-pad*2-40)/room.h;
  scale=Math.min(sx,sy);
  zoom=1;
  panX=(r.width-room.w*scale)/2;
  panY=(r.height-40-room.h*scale)/2;
  updateZoomLabel();
}
function render(){
  const r=wrap.getBoundingClientRect();
  ctx.clearRect(0,0,r.width,r.height);
  // background dots
  ctx.fillStyle='#eeebe4';
  for(let x=0;x<r.width;x+=24){for(let y=0;y<r.height;y+=24){ctx.fillRect(x,y,1,1);}}

  const o=w2s(0,0);
  const rw=room.w*scale*zoom, rh=room.h*scale*zoom;

  // room shadow
  ctx.fillStyle='rgba(0,0,0,.06)';
  ctx.fillRect(o.x+4,o.y+4,rw,rh);
  // room floor
  ctx.fillStyle='#fafaf7';
  ctx.fillRect(o.x,o.y,rw,rh);

  // grid
  if(showGrid){
    ctx.strokeStyle='#e8e6e0';
    ctx.lineWidth=1;
    const gridM=0.5;
    const step=gridM*scale*zoom;
    ctx.beginPath();
    for(let m=0;m<=room.w+0.001;m+=gridM){
      const x=o.x+m*scale*zoom;
      ctx.moveTo(x,o.y); ctx.lineTo(x,o.y+rh);
    }
    for(let m=0;m<=room.h+0.001;m+=gridM){
      const y=o.y+m*scale*zoom;
      ctx.moveTo(o.x,y); ctx.lineTo(o.x+rw,y);
    }
    ctx.stroke();
    // 1m darker
    ctx.strokeStyle='#d8d4ca';
    ctx.beginPath();
    for(let m=0;m<=room.w+0.001;m+=1){
      const x=o.x+m*scale*zoom;
      ctx.moveTo(x,o.y); ctx.lineTo(x,o.y+rh);
    }
    for(let m=0;m<=room.h+0.001;m+=1){
      const y=o.y+m*scale*zoom;
      ctx.moveTo(o.x,y); ctx.lineTo(o.x+rw,y);
    }
    ctx.stroke();
  }

  // room border
  ctx.strokeStyle='#1a1a1a';
  ctx.lineWidth=2.5;
  ctx.strokeRect(o.x,o.y,rw,rh);

  // dimension labels
  ctx.fillStyle='#8a8a8a';
  ctx.font='11px -apple-system,sans-serif';
  ctx.textAlign='center';
  ctx.fillText(room.w+'m',o.x+rw/2,o.y-8);
  ctx.save();
  ctx.translate(o.x-10,o.y+rh/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText(room.h+'m',0,0);
  ctx.restore();

  // furniture
  items.forEach(it=>{
    const p=w2s(it.x,it.y);
    const s=getRotatedSize(it);
    const fw=s.w*scale*zoom, fd=s.d*scale*zoom;
    const overlap=checkOverlap(it.id);
    const sel=it.id===selectedId;

    ctx.save();
    ctx.translate(p.x+fw/2,p.y+fd/2);
    ctx.rotate(it.rot*Math.PI/180);
    // body
    ctx.fillStyle=it.c;
    ctx.globalAlpha=0.85;
    ctx.fillRect(-fw/2,-fd/2,fw,fd);
    ctx.globalAlpha=1;
    // border
    ctx.strokeStyle=overlap?'#ef4444':sel?'#ff6b4a':'rgba(0,0,0,.25)';
    ctx.lineWidth=overlap?2.5:sel?2:1;
    ctx.strokeRect(-fw/2,-fd/2,fw,fd);
    // label
    if(fw>40 && fd>24){
      ctx.fillStyle='rgba(0,0,0,.65)';
      ctx.font=`${Math.max(9,Math.min(13,fw/8))}px -apple-system,sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(it.n,0,0);
    }
    ctx.restore();
  });

  positionFloatTools();
}

/* ---------- Float Tools ---------- */
function positionFloatTools(){
  if(!selectedId){floatTools.style.display='none';return;}
  const it=items.find(i=>i.id===selectedId); if(!it){floatTools.style.display='none';return;}
  const p=w2s(it.x,it.y);
  const s=getRotatedSize(it);
  const fw=s.w*scale*zoom, fd=s.d*scale*zoom;
  floatTools.style.display='flex';
  floatTools.style.left=(p.x+fw/2-44)+'px';
  floatTools.style.top=(p.y-40)+'px';
}

/* ---------- Interaction ---------- */
function getMouse(e){
  const r=canvas.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}
function hitTest(px,py){
  const w=s2w(px,py);
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    const s=getRotatedSize(it);
    if(w.x>=it.x && w.x<=it.x+s.w && w.y>=it.y && w.y<=it.y+s.d) return it;
  }
  return null;
}

canvas.addEventListener('mousedown',e=>{
  const m=getMouse(e);
  const hit=hitTest(m.x,m.y);
  if(hit){
    selectedId=hit.id;
    const w=s2w(m.x,m.y);
    drag={id:hit.id,dx:w.x-hit.x,dy:w.y-hit.y,moved:false};
  }else{
    selectedId=null;
  }
  render();
});
canvas.addEventListener('mousemove',e=>{
  if(!drag) return;
  const m=getMouse(e);
  const w=s2w(m.x,m.y);
  const it=items.find(i=>i.id===drag.id); if(!it)return;
  it.x=snapVal(w.x-drag.dx);
  it.y=snapVal(w.y-drag.dy);
  clampItem(it);
  drag.moved=true;
  render();
});
window.addEventListener('mouseup',()=>{drag=null});

// touch
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  const m=getMouse(e);
  const hit=hitTest(m.x,m.y);
  if(hit){selectedId=hit.id;const w=s2w(m.x,m.y);drag={id:hit.id,dx:w.x-hit.x,dy:w.y-hit.y,moved:false};}
  else selectedId=null;
  render();
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!drag)return;
  const m=getMouse(e);
  const w=s2w(m.x,m.y);
  const it=items.find(i=>i.id===drag.id);if(!it)return;
  it.x=snapVal(w.x-drag.dx);it.y=snapVal(w.y-drag.dy);clampItem(it);drag.moved=true;render();
},{passive:false});
canvas.addEventListener('touchend',()=>{drag=null});

// wheel zoom
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const m=getMouse(e);
  const before=s2w(m.x,m.y);
  zoom*=e.deltaY<0?1.1:0.9;
  zoom=Math.max(0.3,Math.min(3,zoom));
  const after=s2w(m.x,m.y);
  panX+=(after.x-before.x)*scale*zoom;
  panY+=(after.y-before.y)*scale*zoom;
  updateZoomLabel();
  render();
},{passive:false});

// keyboard
window.addEventListener('keydown',e=>{
  if(!selectedId)return;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSelected();}
  if(e.key==='r'||e.key==='R'){rotateSelected();}
});

/* ---------- Actions ---------- */
function rotateSelected(){
  const it=items.find(i=>i.id===selectedId);if(!it)return;
  it.rot=(it.rot+90)%360;
  clampItem(it);
  render();
}
function deleteSelected(){
  items=items.filter(i=>i.id!==selectedId);
  selectedId=null;
  if(!items.length) showEmptyHint();
  render();
}
function duplicateSelected(){
  const it=items.find(i=>i.id===selectedId);if(!it)return;
  if(!isPro && items.length>=FREE_MAX_FURN){showModal('已达免费版上限',`免费版每房间最多 ${FREE_MAX_FURN} 件家具。升级 Pro 解锁无限家具。`);return;}
  const copy={...it,id:nextId++,x:it.x+0.5,y:it.y+0.5};
  clampItem(copy);
  items.push(copy);
  selectedId=copy.id;
  render();
}

document.getElementById('ftRotate').onclick=rotateSelected;
document.getElementById('ftDup').onclick=duplicateSelected;
document.getElementById('ftDel').onclick=deleteSelected;

/* ---------- Top bar ---------- */
document.getElementById('btnApply').onclick=()=>{
  const w=parseFloat(document.getElementById('inW').value);
  const h=parseFloat(document.getElementById('inH').value);
  const iw=document.getElementById('inW'),ih=document.getElementById('inH');
  iw.classList.remove('err');ih.classList.remove('err');
  if(!w||w<=0||w>20){iw.classList.add('err');toast('宽度需在 1–20m 之间');return;}
  if(!h||h<=0||h>20){ih.classList.add('err');toast('长度需在 1–20m 之间');return;}
  room={w:Math.round(w*100)/100,h:Math.round(h*100)/100};
  items.forEach(clampItem);
  fitView();render();toast('房间尺寸已更新');
};
document.getElementById('inW').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btnApply').click();});
document.getElementById('inH').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btnApply').click();});

document.getElementById('btnSave').onclick=()=>{
  const data={version:'2.0',room:{width:room.w,length:room.h},furniture:items.map(it=>({name:it.n,width:it.w,depth:it.d,x:it.x,y:it.y,rotation:it.rot}))};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='room-layout.json';
  a.click();
  toast('布局 JSON 已保存');
};
document.getElementById('btnLoad').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(!d.room||!d.furniture) throw 0;
      room={w:d.room.width,h:d.room.length};
      document.getElementById('inW').value=room.w;
      document.getElementById('inH').value=room.h;
      items=d.furniture.map(f=>({id:nextId++,n:f.name,w:f.width,d:f.depth,x:f.x,y:f.y,rot:f.rotation||0,c:pickColor(f.name)}));
      items.forEach(it=>{clampItem(it);});
      selectedId=null;
      hideEmptyHint();
      fitView();render();
      toast('布局已加载');
    }catch(err){toast('文件格式不正确');}
  };
  reader.readAsText(f);
  e.target.value='';
};
function pickColor(name){
  for(const cat of Object.values(FURN)){
    const f=cat.items.find(i=>i.n===name);
    if(f) return f.c;
  }
  return '#cccccc';
}

document.getElementById('btnPng').onclick=()=>{
  // render at 2x for crispness
  const tmp=document.createElement('canvas');
  const pad=40;
  const exp=2;
  tmp.width=(room.w*scale+pad*2)*exp;
  tmp.height=(room.h*scale+pad*2+30)*exp;
  const tc=tmp.getContext('2d');
  tc.scale(exp,exp);
  tc.fillStyle='#fff';tc.fillRect(0,0,tmp.width,tmp.height);
  const ox=pad,oy=pad;
  // grid
  if(showGrid){
    tc.strokeStyle='#eee';tc.lineWidth=1;tc.beginPath();
    for(let m=0;m<=room.w;m+=0.5){tc.moveTo(ox+m*scale,oy);tc.lineTo(ox+m*scale,oy+room.h*scale);}
    for(let m=0;m<=room.h;m+=0.5){tc.moveTo(ox,oy+m*scale);tc.lineTo(ox+room.w*scale,oy+m*scale);}
    tc.stroke();
  }
  // room border
  tc.strokeStyle='#1a1a1a';tc.lineWidth=2.5;
  tc.strokeRect(ox,oy,room.w*scale,room.h*scale);
  // furniture
  items.forEach(it=>{
    const s=getRotatedSize(it);
    tc.save();
    tc.translate(ox+it.x*scale+s.w*scale/2, oy+it.y*scale+s.d*scale/2);
    tc.rotate(it.rot*Math.PI/180);
    tc.fillStyle=it.c;tc.globalAlpha=.85;
    tc.fillRect(-s.w*scale/2,-s.d*scale/2,s.w*scale,s.d*scale);
    tc.globalAlpha=1;
    tc.strokeStyle='rgba(0,0,0,.25)';tc.lineWidth=1;
    tc.strokeRect(-s.w*scale/2,-s.d*scale/2,s.w*scale,s.d*scale);
    if(s.w*scale>40){
      tc.fillStyle='rgba(0,0,0,.65)';
      tc.font=`${Math.max(9,s.w*scale/8)}px -apple-system,sans-serif`;
      tc.textAlign='center';tc.textBaseline='middle';
      tc.fillText(it.n,0,0);
    }
    tc.restore();
  });
  // watermark
  tc.fillStyle='rgba(0,0,0,.25)';
  tc.font='11px -apple-system,sans-serif';
  tc.textAlign='right';
  tc.fillText('Made with RoomPlan',ox+room.w*scale,oy+room.h*scale+20);
  // download
  const a=document.createElement('a');
  a.href=tmp.toDataURL('image/png');
  a.download='room-layout.png';
  a.click();
  toast('PNG 已导出');
};

document.getElementById('btnPro').onclick=()=>{
  showModal('升级 RoomPlan Pro',`月订阅 $6/月 · 年订阅 $48/年（省33%）\n\nPro 专属：无限家具、高清2x导出、云端保存、分享链接、自定义家具尺寸。`);
};

/* ---------- Toggles ---------- */
document.getElementById('gridToggle').onclick=function(){showGrid=!showGrid;this.classList.toggle('on',showGrid);render();};
document.getElementById('snapToggle').onclick=function(){snap=!snap;this.classList.toggle('on',snap);};
document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(3,zoom*1.2);updateZoomLabel();render();};
document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(0.3,zoom*0.83);updateZoomLabel();render();};
document.getElementById('zoomFit').onclick=()=>{fitView();render();};
function updateZoomLabel(){document.getElementById('zoomVal').textContent=Math.round(zoom*100)+'%';}

/* ---------- Modal & Toast ---------- */
function showModal(title,text){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalText').textContent=text;
  modalMask.classList.add('show');
}
document.getElementById('modalCancel').onclick=()=>modalMask.classList.remove('show');
document.getElementById('modalOk').onclick=()=>{modalMask.classList.remove('show');toast('Pro 功能即将上线，敬请期待！');};
modalMask.onclick=e=>{if(e.target===modalMask)modalMask.classList.remove('show');};

let toastTimer;
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2200);
}

function showEmptyHint(){emptyHint.style.display='block';}
function hideEmptyHint(){emptyHint.style.display='none';}

/* ---------- Boot ---------- */
buildSidebar();
resize();
fitView();
render();
window.addEventListener('resize',()=>{resize();fitView();render();});
</script>
</body>
