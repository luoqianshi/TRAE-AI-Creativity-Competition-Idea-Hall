<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 魔法绘本工坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400&family=ZCOOL+KuaiLe&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-1: #f6efe4;
    --bg-2: #f2e2cc;
    --ink: #2b2316;
    --ink-soft: #6b5a43;
    --accent: #d75a4a;
    --accent-2: #e8a33d;
    --paper: #fff8ec;
    --shadow: 0 20px 50px -12px rgba(80, 50, 20, 0.25), 0 2px 6px rgba(80, 50, 20, 0.08);
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    color: var(--ink);
    font-family: 'LXGW WenKai TC', 'ZCOOL KuaiLe', 'PingFang SC', 'Microsoft YaHei', serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #ffe7c9 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 110%, #ffd9a8 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(rgba(80, 50, 20, 0.08) 1px, transparent 1px),
      radial-gradient(rgba(80, 50, 20, 0.05) 1px, transparent 1px);
    background-size: 22px 22px, 44px 44px;
    background-position: 0 0, 11px 11px;
    opacity: 0.55;
    mix-blend-mode: multiply;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 36px 24px 80px;
  }

  header.masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-dot {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffd27a, var(--accent) 70%);
    box-shadow: 0 10px 24px -8px rgba(215, 90, 74, 0.55), inset -4px -6px 10px rgba(0,0,0,0.12);
    position: relative;
  }
  .brand-dot::after {
    content: "✦";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: #fff8ec;
    font-size: 22px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }

  h1.title {
    font-family: 'Fraunces', 'ZCOOL KuaiLe', serif;
    font-weight: 900;
    font-size: clamp(28px, 3.6vw, 40px);
    margin: 0;
    letter-spacing: 0.5px;
  }
  h1.title .ink { color: var(--accent); }
  .subtitle {
    color: var(--ink-soft);
    font-size: 15px;
    margin-top: 4px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.5);
    border: 1px dashed rgba(80, 50, 20, 0.25);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    color: var(--ink-soft);
    backdrop-filter: blur(6px);
  }

  .grid {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 28px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--paper);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
    border: 1px solid rgba(80, 50, 20, 0.08);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.6), transparent 40%),
      radial-gradient(circle at 100% 0%, rgba(232, 163, 61, 0.15), transparent 50%);
  }

  .card h2 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    margin: 0 0 4px;
    font-size: 22px;
  }
  .card .hint {
    color: var(--ink-soft);
    font-size: 13px;
    margin-bottom: 16px;
  }

  label.field {
    display: block;
    margin-bottom: 14px;
  }
  label.field .label-text {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--ink);
  }
  label.field .label-sub {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  input[type=text], input[type=number], select, textarea {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: #fffdf6;
    border: 1.5px solid rgba(80, 50, 20, 0.18);
    border-radius: 12px;
    padding: 11px 13px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  textarea { min-height: 82px; resize: vertical; }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(215, 90, 74, 0.12);
    background: #fff;
  }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 8px 12px;
    border-radius: 999px;
    background: #fffdf6;
    border: 1.5px solid rgba(80, 50, 20, 0.18);
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
  }
  .chip:hover { transform: translateY(-1px); border-color: var(--accent); }
  .chip.active {
    background: var(--accent);
    color: #fff8ec;
    border-color: var(--accent);
    box-shadow: 0 6px 14px -6px rgba(215,90,74,0.6);
  }

  .actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  button.btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    border: 0;
    cursor: pointer;
    padding: 12px 18px;
    border-radius: 12px;
    transition: transform 0.1s, box-shadow 0.15s, background 0.15s;
  }
  button.btn.primary {
    background: linear-gradient(180deg, #e26a5a, var(--accent));
    color: #fff8ec;
    box-shadow: 0 10px 22px -8px rgba(215,90,74,0.6);
  }
  button.btn.primary:hover { transform: translateY(-1px); }
  button.btn.primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
  button.btn.ghost {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid rgba(80,50,20,0.25);
  }
  button.btn.ghost:hover { background: rgba(80,50,20,0.05); }

  .section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 6px;
    margin-bottom: 10px;
  }
  .section-title h3 {
    font-family: 'Fraunces', serif;
    margin: 0;
    font-size: 18px;
  }
  .pill {
    font-size: 12px;
    color: var(--ink-soft);
    background: rgba(80,50,20,0.06);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .api-key-wrap { position: relative; }
  .api-key-wrap .toggle-visibility {
    position: absolute;
    top: 50%;
    right: 10px;
    transform: translateY(-50%);
    background: transparent;
    border: 0;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 14px;
  }

  /* Book area */
  .book-shell {
    min-height: 520px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--ink-soft);
  }
  .empty-state .big-icon {
    width: 96px;
    height: 96px;
    margin: 0 auto 18px;
    border-radius: 26px;
    background: linear-gradient(135deg, #ffe7c9, #ffcf9a);
    display: grid;
    place-items: center;
    font-size: 48px;
    color: #8a5a2a;
    box-shadow: var(--shadow);
    transform: rotate(-3deg);
  }
  .empty-state h3 {
    font-family: 'Fraunces', serif;
    color: var(--ink);
    margin: 6px 0;
  }

  .progress {
    display: none;
    padding: 16px 18px;
    border-radius: 14px;
    background: rgba(232, 163, 61, 0.15);
    border: 1px dashed rgba(232, 163, 61, 0.45);
    margin-bottom: 16px;
    align-items: center;
    gap: 12px;
  }
  .progress.active { display: flex; }
  .progress .spinner {
    width: 18px;
    height: 18px;
    border: 2.5px solid rgba(215,90,74,0.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress-text { font-size: 14px; color: var(--ink); }
  .progress-text small { color: var(--ink-soft); display: block; margin-top: 2px; }

  .progress-bar-outer {
    height: 6px;
    background: rgba(80,50,20,0.1);
    border-radius: 99px;
    flex: 1;
    overflow: hidden;
    margin-left: auto;
    min-width: 120px;
    max-width: 220px;
  }
  .progress-bar-inner {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.4s;
  }

  /* Pages / book */
  .book-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .book-meta .book-title {
    font-family: 'Fraunces', 'ZCOOL KuaiLe', serif;
    font-weight: 900;
    font-size: 28px;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }
  .book-meta .book-byline { color: var(--ink-soft); font-size: 13px; }
  .book-actions { display: flex; gap: 8px; }

  .page-stage {
    perspective: 2400px;
  }

  .page {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    background: #fffdf6;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: var(--shadow);
    min-height: 480px;
    animation: pageIn 0.5s ease;
  }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(12px) rotateY(6deg); }
    to { opacity: 1; transform: translateY(0) rotateY(0); }
  }
  .page .illu {
    position: relative;
    background: #f6e7cf;
    min-height: 320px;
    overflow: hidden;
  }
  .page .illu img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .page .illu .loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: #8a5a2a;
    font-size: 14px;
    background:
      repeating-linear-gradient(45deg, rgba(232,163,61,0.08) 0 14px, transparent 14px 28px),
      linear-gradient(135deg, #ffe7c9, #ffcf9a);
    gap: 10px;
    flex-direction: column;
  }
  .page .illu .loading span { font-family: 'Fraunces', serif; }
  .page .text {
    padding: 32px 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 18px;
    background:
      radial-gradient(500px 300px at 100% 0%, rgba(232,163,61,0.08), transparent 60%),
      #fffdf6;
  }
  .page .page-number {
    font-family: 'Fraunces', serif;
    color: var(--accent);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .page .story {
    font-size: 18px;
    line-height: 1.8;
    color: var(--ink);
    white-space: pre-wrap;
  }
  .page .story p { margin: 0 0 14px; }
  .page .caption {
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
    border-top: 1px dashed rgba(80,50,20,0.18);
    padding-top: 10px;
  }

  @media (max-width: 720px) {
    .page { grid-template-columns: 1fr; }
    .page .illu { min-height: 260px; }
  }

  .pager {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .page-dots {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
    justify-content: center;
  }
  .page-dots .dot {
    min-width: 34px;
    padding: 6px 10px;
    border-radius: 10px;
    text-align: center;
    font-size: 13px;
    background: #fffdf6;
    border: 1.5px solid rgba(80,50,20,0.15);
    cursor: pointer;
    transition: all 0.15s;
  }
  .page-dots .dot.active {
    background: var(--accent);
    color: #fff8ec;
    border-color: var(--accent);
  }

  .nav-btn {
    padding: 10px 14px;
    border-radius: 12px;
    border: 1.5px solid rgba(80,50,20,0.18);
    background: #fffdf6;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    color: var(--ink);
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Thumbnail strip */
  .thumbs {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 120px;
    gap: 10px;
    overflow-x: auto;
    padding: 10px 4px 14px;
    margin-top: 10px;
    scrollbar-width: thin;
  }
  .thumb {
    border: 2px solid transparent;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    background: #fffdf6;
    box-shadow: 0 4px 12px -6px rgba(80,50,20,0.25);
    transition: transform 0.15s, border-color 0.15s;
    position: relative;
  }
  .thumb:hover { transform: translateY(-2px); }
  .thumb.active { border-color: var(--accent); }
  .thumb img { width: 100%; height: 80px; object-fit: cover; display: block; }
  .thumb .thumb-label {
    font-size: 11px;
    padding: 6px 8px;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .error-box {
    display: none;
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(215,90,74,0.1);
    border: 1px solid rgba(215,90,74,0.35);
    color: #8a2a1e;
    font-size: 13px;
    margin-top: 10px;
    white-space: pre-wrap;
  }
  .error-box.show { display: block; }

  footer.note {
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
    margin-top: 28px;
  }

  /* Toggle style group */
  details.adv {
    margin-top: 6px;
    border-top: 1px dashed rgba(80,50,20,0.15);
    padding-top: 12px;
  }
  details.adv > summary {
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink-soft);
    list-style: none;
  }
  details.adv > summary::-webkit-details-marker { display: none; }
  details.adv > summary::before { content: "▸ "; color: var(--accent); }
  details.adv[open] > summary::before { content: "▾ "; }

  .danger-note {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 8px;
    background: rgba(215,90,74,0.08);
    border: 1px dashed rgba(215,90,74,0.25);
    padding: 8px 10px;
    border-radius: 10px;
  }
</style>
</head>
<body>
  <div class="app">
    <header class="masthead">
      <div class="brand">
        <div class="brand-dot" aria-hidden="true"></div>
        <div>
          <h1 class="title">AI 魔法<span class="ink">绘本工坊</span></h1>
          <div class="subtitle">输入主题 · 由 OpenAI 生成分页故事与插图</div>
        </div>
      </div>
      <div class="badge">✎ 单文件 HTML · 直接在浏览器运行</div>
    </header>

    <div class="grid">
      <!-- LEFT: Controls -->
      <section class="card" aria-label="创作设置">
        <h2>开始创作</h2>
        <p class="hint">填写下面的设置，然后点击「生成绘本」。API Key 仅保存在你的浏览器。</p>

        <label class="field api-key-wrap">
          <span class="label-text">OpenAI API Key</span>
          <span class="label-sub">以 sk- 开头，建议使用仅含 Chat/Image 权限的 Project Key</span>
          <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
          <button class="toggle-visibility" type="button" id="toggleKey">显示</button>
        </label>

        <label class="field">
          <span class="label-text">Base URL（可选）</span>
          <span class="label-sub">默认为官方 API，使用中转服务时可修改</span>
          <input id="baseUrl" type="text" placeholder="https://api.openai.com/v1" />
        </label>

        <div class="row">
          <label class="field">
            <span class="label-text">文本模型</span>
            <select id="textModel">
              <option>gpt-4o-mini</option>
              <option selected>gpt-4o</option>
              <option>gpt-3.5-turbo</option>
            </select>
          </label>
          <label class="field">
            <span class="label-text">图像模型</span>
            <select id="imageModel">
              <option selected>dall-e-3</option>
              <option>dall-e-2</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span class="label-text">绘本主题 / 标题</span>
          <input id="topic" type="text" placeholder="例如：小松鼠的第一次远行" />
        </label>

        <div class="row">
          <label class="field">
            <span class="label-text">目标读者</span>
            <select id="audience">
              <option>3-6 岁 幼儿</option>
              <option selected>6-9 岁 小学低年级</option>
              <option>9-12 岁 小学高年级</option>
              <option>青少年 / 成人</option>
            </select>
          </label>
          <label class="field">
            <span class="label-text">页数</span>
            <input id="pageCount" type="number" min="3" max="20" value="8" />
          </label>
        </div>

        <label class="field">
          <span class="label-text">美术风格</span>
          <div class="chips" id="styleChips" role="radiogroup" aria-label="美术风格">
            <span class="chip active" data-value="温暖手绘水彩，柔和色彩，儿童插画，类似 Beatrix Potter 风格">水彩手绘</span>
            <span class="chip" data-value="色彩鲜艳的卡通插画，厚涂质感，像皮克斯动画场景">卡通厚涂</span>
            <span class="chip" data-value="扁平插画，大色块，简洁几何，现代童书风格">扁平几何</span>
            <span class="chip" data-value="复古蚀刻版画风格，sepia 色调，经典童话插图">复古蚀刻</span>
            <span class="chip" data-value="东方水墨工笔，留白，宣纸质感，柔和淡雅">水墨国风</span>
            <span class="chip" data-value="3D 渲染，柔和光照，童话玩偶质感，柔和阴影">3D 童话</span>
          </div>
        </label>

        <label class="field">
          <span class="label-text">补充设定（可选）</span>
          <textarea id="extra" placeholder="例如：主角是一只戴着红围巾的小狐狸，场景设定在冬天的森林…"></textarea>
        </label>

        <details class="adv">
          <summary>高级选项</summary>
          <div style="padding-top:10px;">
            <label class="field">
              <span class="label-text">图像尺寸</span>
              <select id="imageSize">
                <option>1024x1024</option>
                <option selected>1792x1024</option>
                <option>1024x1792</option>
              </select>
            </label>
            <label class="field">
              <span class="label-text">自定义 System Prompt（可选，留空使用默认）</span>
              <textarea id="customSys" placeholder="默认：你是一位富有想象力的童书作者与插画指导..."></textarea>
            </label>
          </div>
        </details>

        <div class="actions">
          <button class="btn primary" id="generateBtn">✨ 生成绘本</button>
          <button class="btn ghost" id="printBtn" disabled>🖨️ 打印 / 保存 PDF</button>
        </div>

        <div class="error-box" id="errorBox"></div>

        <p class="danger-note">⚠️ 出于安全考虑，<strong>不要在他人或公共电脑上保存真实的 API Key</strong>，并定期轮换 Key。生成调用会直接从浏览器发出，不会经过任何第三方服务器。</p>
      </section>

      <!-- RIGHT: Book -->
      <section class="card book-shell" aria-label="绘本展示">
        <div class="progress" id="progress">
          <div class="spinner" aria-hidden="true"></div>
          <div class="progress-text" id="progressText">准备中…<small>请稍候</small></div>
          <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
        </div>

        <div id="bookArea">
          <div class="empty-state" id="emptyState">
            <div class="big-icon">📖</div>
            <h3>还没有绘本</h3>
            <p>在左侧输入主题，点击「生成绘本」，AI 将为你创作一本多页绘本。</p>
          </div>
        </div>
      </section>
    </div>

    <footer class="note">
      Made with ♥ — 故事与插图由 OpenAI 生成，仅用于个人欣赏与非商业用途。
    </footer>
  </div>

<script>
(() => {
  // ---------- Utilities ----------
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  const LS = {
    get(k, dflt) {
      try { const v = localStorage.getItem(k); return v == null ? dflt : JSON.parse(v); }
      catch { return dflt; }
    },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    remove(k) { try { localStorage.removeItem(k); } catch {} }
  };

  // Restore inputs
  const restore = () => {
    const saved = LS.get('pb_settings', {});
    if (saved.apiKey) $('#apiKey').value = saved.apiKey;
    if (saved.baseUrl) $('#baseUrl').value = saved.baseUrl;
    if (saved.textModel) $('#textModel').value = saved.textModel;
    if (saved.imageModel) $('#imageModel').value = saved.imageModel;
    if (saved.topic) $('#topic').value = saved.topic;
    if (saved.audience) $('#audience').value = saved.audience;
    if (saved.pageCount) $('#pageCount').value = saved.pageCount;
    if (saved.style) {
      const chip = $$('#styleChips .chip').find(c => c.dataset.value === saved.style);
      if (chip) selectChip(chip);
    }
    if (saved.imageSize) $('#imageSize').value = saved.imageSize;
    if (saved.extra) $('#extra').value = saved.extra;
    if (saved.customSys) $('#customSys').value = saved.customSys;

    const book = LS.get('pb_book', null);
    if (book && Array.isArray(book.pages) && book.pages.length) {
      renderBook(book);
    }
  };

  const saveSettings = () => {
    LS.set('pb_settings', {
      apiKey: $('#apiKey').value.trim(),
      baseUrl: $('#baseUrl').value.trim(),
      textModel: $('#textModel').value,
      imageModel: $('#imageModel').value,
      topic: $('#topic').value.trim(),
      audience: $('#audience').value,
      pageCount: $('#pageCount').value,
      style: activeStyle(),
      imageSize: $('#imageSize').value,
      extra: $('#extra').value.trim(),
      customSys: $('#customSys').value.trim()
    });
  };

  // ---------- Style chips ----------
  const selectChip = (chip) => {
    $$('#styleChips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
  };
  const activeStyle = () => {
    const active = $('#styleChips .chip.active');
    return active ? active.dataset.value : '';
  };
  $('#styleChips').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    selectChip(chip);
    saveSettings();
  });

  // Listen to inputs
  ['apiKey','baseUrl','textModel','imageModel','topic','audience','pageCount','imageSize','extra','customSys']
    .forEach(id => {
      const el = $('#' + id);
      el.addEventListener('input', saveSettings);
      el.addEventListener('change', saveSettings);
    });

  $('#toggleKey').addEventListener('click', () => {
    const input = $('#apiKey');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    $('#toggleKey').textContent = show ? '隐藏' : '显示';
  });

  // ---------- Error ----------
  const showError = (msg) => {
    const el = $('#errorBox');
    el.textContent = msg;
    el.classList.add('show');
  };
  const clearError = () => $('#errorBox').classList.remove('show');

  // ---------- Progress ----------
  const setProgress = (label, sub, pct) => {
    const wrap = $('#progress');
    wrap.classList.add('active');
    $('#progressText').innerHTML = `${label}<small>${sub || ''}</small>`;
    if (typeof pct === 'number') $('#progressBar').style.width = Math.max(0, Math.min(100, pct)) + '%';
  };
  const hideProgress = () => $('#progress').classList.remove('active');

  // ---------- OpenAI callers ----------
  const makeOpenAI = () => {
    const apiKey = $('#apiKey').value.trim();
    if (!apiKey) throw new Error('请先填写 OpenAI API Key。');
    const baseUrl = ($('#baseUrl').value.trim() || 'https://api.openai.com/v1').replace(/\/$/, '');
    return {
      apiKey, baseUrl,
      async post(path, body) {
        const res = await fetch(baseUrl + path, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + apiKey
          },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          let detail = '';
          try { const j = await res.json(); detail = j?.error?.message || JSON.stringify(j); }
          catch { detail = await res.text(); }
          throw new Error(`请求失败 (HTTP ${res.status})：${detail || res.statusText}`);
        }
        return res.json();
      }
    };
  };

  const extractJSON = (text) => {
    const t = text.trim();
    // Try direct JSON
    try { return JSON.parse(t); } catch {}
    // Try first ```json ... ``` block
    const m = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (m) { try { return JSON.parse(m[1]); } catch {} }
    // Try largest { ... } block
    const first = t.indexOf('{');
    const last = t.lastIndexOf('}');
    if (first >= 0 && last > first) {
      try { return JSON.parse(t.slice(first, last + 1)); } catch {}
    }
    throw new Error('AI 响应不是可解析的 JSON 格式，请重试。');
  };

  const generateStory = async ({ topic, audience, pageCount, style, extra, textModel, customSys }) => {
    const openai = makeOpenAI();
    const sysDefault = `你是一位富有想象力的童书作者与插画指导。你会为孩子们创作结构完整、情感温暖、节奏舒缓的多页绘本故事。`;
    const sys = (customSys && customSys.trim()) || sysDefault;

    const userPrompt =
`请根据以下设定创作一本多页绘本的故事大纲，并为每一页撰写一段适合朗读的文字与一个视觉化的插图描述。

【主题 / 标题】${topic || '（未填）'}
【目标读者】${audience}
【页数】共 ${pageCount} 页（包含封面页与结尾页）
【美术风格】${style}
【补充设定】${extra || '（无）'}

【输出要求】
- 严格输出 JSON，不要包含额外说明。
- JSON 结构：
{
  "title": "绘本标题（中文，不超过 16 字）",
  "byline": "一句话的副标题 / 引子",
  "pages": [
    {
      "type": "cover" | "story" | "ending",
      "text": "本页的故事文字，中文，不超过 120 字，适合朗读，情感温馨。封面页的 text 可留空或写一句话寄语。",
      "caption": "简短的画面中文提示，不超过 30 字，例如：小松鼠背着小背包，站在森林入口。"
    }
    // 共 ${pageCount} 项，第 1 项 type 可为 cover，最后 1 项 type 可为 ending
  ]
}

- 文本语言必须是中文。
- 各页画面需在故事逻辑与视觉上保持连贯，主角外观保持一致。
- 注意避免出现暴力、恐怖、成人或品牌内容。`;

    setProgress('正在构思故事…', '调用文本模型 · ' + textModel, 5);
    const res = await openai.post('/chat/completions', {
      model: textModel,
      messages: [
        { role: 'system', content: sys },
        { role: 'user', content: userPrompt }
      ],
      temperature: 0.9,
      response_format: { type: 'json_object' }
    });
    const content = res?.choices?.[0]?.message?.content || '';
    return extractJSON(content);
  };

  const generateImage = async ({ prompt, size, imageModel }) => {
    const openai = makeOpenAI();
    const res = await openai.post('/images/generations', {
      model: imageModel,
      prompt,
      n: 1,
      size,
      quality: 'standard',
      style: 'vivid'
    });
    const url = res?.data?.[0]?.url;
    if (!url) throw new Error('图像生成未返回有效结果。');
    return url;
  };

  // ---------- Render ----------
  let book = null;
  let current = 0;

  const renderBook = (b) => {
    book = b;
    current = 0;
    LS.set('pb_book', b);
    $('#printBtn').disabled = false;
    drawStage();
  };

  const drawStage = () => {
    if (!book) return;
    const area = $('#bookArea');
    const pages = book.pages || [];
    const page = pages[current];
    area.innerHTML = `
      <div class="book-header">
        <div class="book-meta">
          <h2 class="book-title">${escapeHTML(book.title || '未命名绘本')}</h2>
          <div class="book-byline">${escapeHTML(book.byline || '')} · 共 ${pages.length} 页</div>
        </div>
        <div class="book-actions">
          <button class="nav-btn" id="prevBtn" ${current === 0 ? 'disabled' : ''}>← 上一页</button>
          <button class="nav-btn" id="nextBtn" ${current === pages.length - 1 ? 'disabled' : ''}>下一页 →</button>
        </div>
      </div>

      <div class="page-stage">
        <div class="page" id="pageCard">
          <div class="illu" id="illu">
            ${page.imageUrl
              ? `<img src="${page.imageUrl}" alt="${escapeHTML(page.caption || '')}" />`
              : `<div class="loading"><div class="spinner" style="width:24px;height:24px;border-width:3px;"></div><span>插图生成中…</span></div>`}
          </div>
          <div class="text">
            <div>
              <div class="page-number">第 ${current + 1} 页 · ${page.type === 'cover' ? '封面' : (page.type === 'ending' ? '结尾' : '故事')}</div>
              <div class="story"><p>${escapeHTML(page.text || '').replace(/\n+/g, '</p><p>') || '（此处留白）'}</p></div>
            </div>
            <div class="caption">${escapeHTML(page.caption || '')}</div>
          </div>
        </div>
      </div>

      <div class="pager">
        <div class="page-dots" id="pageDots">
          ${pages.map((_, i) => `<button class="dot ${i === current ? 'active' : ''}" data-idx="${i}">${i + 1}</button>`).join('')}
        </div>
      </div>

      <div class="thumbs" id="thumbs">
        ${pages.map((p, i) => `
          <div class="thumb ${i === current ? 'active' : ''}" data-idx="${i}">
            ${p.imageUrl
              ? `<img src="${p.imageUrl}" alt="" />`
              : `<img src="data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%2280%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23f6e7cf%22/><text x=%2250%25%22 y=%2255%25%22 text-anchor=%22middle%22 font-size=%2214%22 fill=%22%238a5a2a%22>待生成</text></svg>" alt="" />`}
            <div class="thumb-label">第 ${i + 1} 页 · ${escapeHTML((p.caption || '').slice(0, 14))}</div>
          </div>
        `).join('')}
      </div>
    `;
    // Bind
    $('#prevBtn').addEventListener('click', () => { if (current > 0) { current--; drawStage(); } });
    $('#nextBtn').addEventListener('click', () => { if (current < pages.length - 1) { current++; drawStage(); } });
    $$('#pageDots .dot').forEach(d => d.addEventListener('click', () => { current = +d.dataset.idx; drawStage(); }));
    $$('#thumbs .thumb').forEach(d => d.addEventListener('click', () => { current = +d.dataset.idx; drawStage(); }));
  };

  const escapeHTML = (s) => String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  // Update a single page's image after it has been generated
  const updatePageImage = (idx, url) => {
    if (!book) return;
    book.pages[idx].imageUrl = url;
    LS.set('pb_book', book);
    if (idx === current) drawStage();
    else {
      // Update thumbnail only if stage already rendered
      const thumb = document.querySelector(`#thumbs .thumb[data-idx="${idx}"]`);
      if (thumb) {
        const img = thumb.querySelector('img');
        if (img) img.src = url;
      }
    }
  };

  // ---------- Main generator flow ----------
  $('#generateBtn').addEventListener('click', async () => {
    clearError();
    try {
      const topic = $('#topic').value.trim();
      if (!topic) throw new Error('请填写「绘本主题 / 标题」。');
      const pageCount = Math.min(20, Math.max(3, parseInt($('#pageCount').value, 10) || 8));
      $('#pageCount').value = pageCount;
      $('#generateBtn').disabled = true;

      const textModel = $('#textModel').value;
      const imageModel = $('#imageModel').value;
      const imageSize = $('#imageSize').value;
      const style = activeStyle();
      const audience = $('#audience').value;
      const extra = $('#extra').value.trim();
      const customSys = $('#customSys').value.trim();

      saveSettings();

      // Step 1: story
      const story = await generateStory({ topic, audience, pageCount, style, extra, textModel, customSys });
      if (!story || !Array.isArray(story.pages) || story.pages.length === 0) {
        throw new Error('未能从 AI 获得有效的分页故事结构。');
      }
      // Normalize length
      if (story.pages.length > pageCount) story.pages.length = pageCount;
      story.pages[0].type = story.pages[0].type || 'cover';
      story.pages[story.pages.length - 1].type = story.pages[story.pages.length - 1].type || 'ending';

      renderBook({
        title: story.title || topic,
        byline: story.byline || '',
        pages: story.pages.map(p => ({ type: p.type || 'story', text: p.text || '', caption: p.caption || '' }))
      });

      // Step 2: generate images one by one
      const pages = story.pages;
      const totalImages = pages.length;
      let done = 0;
      const pctBase = 15; // 0-15% was story
      const pctImg = 80 / totalImages;
      setProgress('正在绘制第 1 / ' + totalImages + ' 幅插图…', '调用图像模型 · ' + imageModel, pctBase);

      for (let i = 0; i < pages.length; i++) {
        const p = pages[i];
        // Construct a safer, self-contained prompt (in English works best for DALL-E)
        const imagePrompt = [
          `Children's picture book illustration, style: ${style}`,
          `Scene description (from author): ${p.caption || p.text || ''}`,
          `Context: story titled "${story.title || topic}" — for ${audience}.`,
          `Keep the main character's appearance consistent across pages.`,
          `Warm, gentle, age-appropriate. No text, no watermarks, no logos.`,
          `Horizontal book-cover-like composition with clear focal point.`
        ].join(' ');

        try {
          const url = await generateImage({ prompt: imagePrompt, size: imageSize, imageModel });
          updatePageImage(i, url);
        } catch (err) {
          // Mark with placeholder error but continue
          console.warn('第', i + 1, '页插图失败：', err.message);
          // Don't block the rest; tell user via progress
        }
        done++;
        const pct = pctBase + done * pctImg;
        if (done < totalImages) {
          setProgress(`正在绘制第 ${done + 1} / ${totalImages} 幅插图…`, '调用图像模型 · ' + imageModel, pct);
        } else {
          setProgress('完成！', '你可以在右侧浏览绘本，或点击「打印 / 保存 PDF」导出。', 100);
        }
      }

      setTimeout(hideProgress, 1500);
    } catch (err) {
      console.error(err);
      showError((err && err.message) || String(err));
      setProgress('生成被中断', '查看左下方错误信息', 0);
      setTimeout(hideProgress, 400);
    } finally {
      $('#generateBtn').disabled = false;
    }
  });

  // ---------- Print ----------
  $('#printBtn').addEventListener('click', () => window.print());

  // Keyboard navigation
  window.addEventListener('keydown', (e) => {
    if (!book) return;
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;
    if (e.key === 'ArrowLeft' && current > 0) { current--; drawStage(); }
    if (e.key === 'ArrowRight' && current < book.pages.length - 1) { current++; drawStage(); }
  });

  // init
  restore();
})();
</script>
</body>
</html>
