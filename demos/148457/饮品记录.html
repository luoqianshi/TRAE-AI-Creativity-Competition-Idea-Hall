<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>☕ 我的饮品记录 - 牛马能量站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        html {
            -webkit-text-size-adjust: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top));
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            padding-left: calc(16px + env(safe-area-inset-left));
            padding-right: calc(16px + env(safe-area-inset-right));
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #e94560, #ff6b81, #d4a574);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            text-align: center;
            color: #a0a0b0;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        /* 评级展示 */
        .rank-card {
            background: #16213e;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            margin-bottom: 25px;
            border: 2px solid #0f3460;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .rank-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(233,69,96,0.12) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .rank-emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        .rank-title {
            font-size: 2rem;
            font-weight: bold;
            color: #e94560;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        .rank-desc {
            color: #a0a0b0;
            font-size: 0.95rem;
            position: relative;
            z-index: 1;
        }
        .total-count {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            margin: 15px 0;
            position: relative;
            z-index: 1;
        }
        .total-count span {
            font-size: 1rem;
            color: #a0a0b0;
            font-weight: normal;
        }
        .rank-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }
        .stat-item {
            text-align: center;
        }
        .stat-num {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .stat-label {
            font-size: 0.8rem;
            color: #777;
        }
        .coffee-stat { color: #d4a574; }
        .tea-stat { color: #e94560; }

        /* 品牌选择区 */
        .brand-section {
            background: #16213e;
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 25px;
            border: 2px solid #0f3460;
        }
        .brand-section h2 {
            font-size: 1.2rem;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .coffee-title { color: #d4a574; }
        .tea-title { color: #e94560; }
        .brand-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
        }
        .brand-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 8px;
            min-height: 88px;
            border-radius: 16px;
            border: 2px solid #0f3460;
            background: #0a0a1a;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        .brand-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .brand-btn.coffee-brand:hover {
            border-color: #d4a574;
            background: #1a1510;
        }
        .brand-btn.tea-brand:hover {
            border-color: #e94560;
            background: #1a1015;
        }
        .brand-btn:active {
            transform: translateY(0) scale(0.93);
        }
        .brand-icon {
            font-size: 2rem;
            margin-bottom: 6px;
            line-height: 1;
        }
        .brand-name {
            font-size: 0.8rem;
            font-weight: bold;
            text-align: center;
            color: #ccc;
            line-height: 1.2;
        }
        .brand-btn .brand-count {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #e94560;
            color: #fff;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 22px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .brand-btn.coffee-brand .brand-count {
            background: #8b6914;
        }
        .brand-btn.has-count .brand-count {
            opacity: 1;
        }
        @keyframes addPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .brand-btn.pop {
            animation: addPop 0.3s ease;
        }

        /* 统计列表 */
        .list-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        .list-card {
            background: #16213e;
            border-radius: 24px;
            padding: 25px;
            border: 2px solid #0f3460;
        }
        .list-card h2 {
            font-size: 1.2rem;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .drink-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #0a0a1a;
            border-radius: 14px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        .drink-item:hover {
            background: #141428;
            transform: translateX(5px);
        }
        .drink-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }
        .drink-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        .drink-name {
            font-weight: bold;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .drink-count {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .count-badge {
            background: #e94560;
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
        }
        .coffee-badge {
            background: linear-gradient(135deg, #6f4e37, #8b6914);
        }
        .tea-badge {
            background: linear-gradient(135deg, #e94560, #ff6b81);
        }
        .btn-small {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        .btn-add {
            background: #0f3460;
            color: #fff;
        }
        .btn-add:hover {
            background: #1a4a8a;
        }
        .btn-remove {
            background: #3a1a1a;
            color: #e94560;
        }
        .btn-remove:hover {
            background: #5a2a2a;
        }
        .empty-state {
            text-align: center;
            color: #555;
            padding: 25px 10px;
            font-style: italic;
            font-size: 0.9rem;
        }

        /* 操作按钮 */
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 14px;
            border: 2px solid transparent;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .btn-export {
            background: #0f3460;
            color: #fff;
        }
        .btn-export:hover {
            background: #1a4a8a;
            transform: translateY(-2px);
        }
        .btn-clear {
            background: transparent;
            color: #aaa;
            border-color: #333;
        }
        .btn-clear:hover {
            border-color: #e94560;
            color: #e94560;
        }

        /* 等级说明 */
        .legend-section {
            background: #16213e;
            border-radius: 24px;
            padding: 25px;
            border: 2px solid #0f3460;
        }
        .legend-section h2 {
            font-size: 1.2rem;
            margin-bottom: 18px;
            color: #e94560;
        }
        .legend-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: #0a0a1a;
            border-radius: 12px;
            font-size: 0.9rem;
        }
        .legend-emoji {
            font-size: 1.6rem;
        }
        .legend-name {
            font-weight: bold;
        }
        .legend-range {
            color: #777;
            font-size: 0.75rem;
        }

        /* ============ 移动端适配 ============ */
        /* 小屏手机 (<=480px) */
        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-top: calc(12px + env(safe-area-inset-top));
                padding-bottom: calc(20px + env(safe-area-inset-bottom));
                padding-left: calc(12px + env(safe-area-inset-left));
                padding-right: calc(12px + env(safe-area-inset-right));
            }
            h1 {
                font-size: 1.6rem;
                margin-bottom: 6px;
            }
            .subtitle {
                font-size: 0.82rem;
                margin-bottom: 18px;
            }
            .rank-card {
                padding: 22px 16px;
                border-radius: 20px;
                margin-bottom: 16px;
            }
            .rank-emoji {
                font-size: 3rem;
            }
            .rank-title {
                font-size: 1.5rem;
            }
            .rank-desc {
                font-size: 0.82rem;
                padding: 0 4px;
                line-height: 1.5;
            }
            .total-count {
                font-size: 2.2rem;
                margin: 10px 0;
            }
            .rank-stats {
                gap: 20px;
                margin-top: 10px;
            }
            .stat-num {
                font-size: 1.2rem;
            }
            .stat-label {
                font-size: 0.72rem;
            }
            .brand-section {
                padding: 16px 14px;
                border-radius: 20px;
                margin-bottom: 16px;
            }
            .brand-section h2 {
                font-size: 1.05rem;
                margin-bottom: 14px;
            }
            .brand-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 9px;
            }
            .brand-btn {
                padding: 12px 4px;
                min-height: 76px;
                border-radius: 14px;
            }
            .brand-icon {
                font-size: 1.7rem;
                margin-bottom: 4px;
            }
            .brand-name {
                font-size: 0.7rem;
            }
            .brand-btn .brand-count {
                font-size: 0.65rem;
                padding: 1px 5px;
                min-width: 20px;
                top: 3px;
                right: 3px;
            }
            .list-section {
                grid-template-columns: 1fr;
                gap: 16px;
                margin-bottom: 16px;
            }
            .list-card {
                padding: 16px 14px;
                border-radius: 20px;
            }
            .list-card h2 {
                font-size: 1.05rem;
                margin-bottom: 14px;
            }
            .drink-item {
                padding: 10px 12px;
                border-radius: 12px;
                margin-bottom: 8px;
            }
            .drink-icon {
                font-size: 1.3rem;
            }
            .drink-name {
                font-size: 0.88rem;
            }
            .count-badge {
                padding: 3px 10px;
                font-size: 0.85rem;
                min-width: 32px;
            }
            .btn-small {
                width: 32px;
                height: 32px;
                font-size: 1.1rem;
            }
            .action-bar {
                gap: 10px;
                margin-bottom: 16px;
            }
            .btn {
                padding: 11px 20px;
                font-size: 0.88rem;
                border-radius: 12px;
                flex: 1;
                min-width: 0;
            }
            .legend-section {
                padding: 16px 14px;
                border-radius: 20px;
            }
            .legend-section h2 {
                font-size: 1.05rem;
                margin-bottom: 14px;
            }
            .legend-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .legend-item {
                padding: 10px 12px;
                border-radius: 10px;
                font-size: 0.82rem;
                gap: 8px;
            }
            .legend-emoji {
                font-size: 1.3rem;
            }
            .legend-range {
                font-size: 0.7rem;
            }
            .empty-state {
                padding: 20px 8px;
                font-size: 0.82rem;
            }
        }

        /* 中屏手机/小平板 (481px ~ 650px) */
        @media (min-width: 481px) and (max-width: 650px) {
            body {
                padding: 16px;
                padding-top: calc(16px + env(safe-area-inset-top));
                padding-bottom: calc(20px + env(safe-area-inset-bottom));
            }
            h1 {
                font-size: 1.9rem;
            }
            .brand-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 10px;
            }
            .list-section {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .legend-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* 平板/大手机 (651px ~ 900px) */
        @media (min-width: 651px) and (max-width: 900px) {
            .brand-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        /* 横屏手机适配 */
        @media (max-height: 500px) and (orientation: landscape) {
            .rank-card {
                padding: 16px;
            }
            .rank-emoji {
                font-size: 2.5rem;
                margin-bottom: 4px;
            }
            .rank-title {
                font-size: 1.3rem;
                margin-bottom: 4px;
            }
            .total-count {
                font-size: 2rem;
                margin: 6px 0;
            }
        }

        /* 触摸设备去掉hover浮动效果 */
        @media (hover: none) {
            .brand-btn:hover {
                transform: none;
                box-shadow: none;
            }
            .drink-item:hover {
                transform: none;
            }
            .btn-export:hover, .btn-coffee:hover, .btn-tea:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>☕ 我的饮品记录</h1>
        <p class="subtitle">一键点击记录每一杯，见证你的牛马进阶之路</p>

        <!-- 评级展示 -->
        <div class="rank-card">
            <span class="rank-emoji" id="rankEmoji">🧘</span>
            <div class="rank-title" id="rankTitle">佛系养生</div>
            <div class="total-count"><span id="totalCount">0</span> <span>杯</span></div>
            <div class="rank-desc" id="rankDesc">您目前还是人间清醒，请继续保持</div>
            <div class="rank-stats">
                <div class="stat-item">
                    <div class="stat-num coffee-stat" id="coffeeTotal">0</div>
                    <div class="stat-label">☕ 咖啡</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num tea-stat" id="teaTotal">0</div>
                    <div class="stat-label">🧋 奶茶</div>
                </div>
            </div>
        </div>

        <!-- 咖啡品牌选择 -->
        <div class="brand-section">
            <h2 class="coffee-title">☕ 点击记录咖啡</h2>
            <div class="brand-grid" id="coffeeGrid"></div>
        </div>

        <!-- 奶茶品牌选择 -->
        <div class="brand-section">
            <h2 class="tea-title">🧋 点击记录奶茶</h2>
            <div class="brand-grid" id="teaGrid"></div>
        </div>

        <!-- 统计列表 -->
        <div class="list-section">
            <div class="list-card">
                <h2 class="coffee-title">📊 咖啡排行</h2>
                <div id="coffeeList">
                    <div class="empty-state">还没喝过咖啡，点击上方品牌记录第一杯</div>
                </div>
            </div>
            <div class="list-card">
                <h2 class="tea-title">📊 奶茶排行</h2>
                <div id="teaList">
                    <div class="empty-state">还没喝过奶茶，点击上方品牌记录第一杯</div>
                </div>
            </div>
        </div>

        <!-- 操作栏 -->
        <div class="action-bar">
            <button class="btn btn-export" onclick="exportData()">📋 复制记录</button>
            <button class="btn btn-clear" onclick="clearAll()">🗑️ 清空记录</button>
        </div>

        <!-- 等级说明 -->
        <div class="legend-section">
            <h2>🏆 牛马等级体系</h2>
            <div class="legend-grid">
                <div class="legend-item">
                    <span class="legend-emoji">🧘</span>
                    <div>
                        <div class="legend-name">佛系养生</div>
                        <div class="legend-range">0 杯</div>
                    </div>
                </div>
                <div class="legend-item">
                    <span class="legend-emoji">🐮</span>
                    <div>
                        <div class="legend-name">初级牛马</div>
                        <div class="legend-range">1 ~ 5 杯</div>
                    </div>
                </div>
                <div class="legend-item">
                    <span class="legend-emoji">🐴</span>
                    <div>
                        <div class="legend-name">中级牛马</div>
                        <div class="legend-range">6 ~ 15 杯</div>
                    </div>
                </div>
                <div class="legend-item">
                    <span class="legend-emoji">🦄</span>
                    <div>
                        <div class="legend-name">超级牛马</div>
                        <div class="legend-range">16 ~ 30 杯</div>
                    </div>
                </div>
                <div class="legend-item">
                    <span class="legend-emoji">🚀</span>
                    <div>
                        <div class="legend-name">核动力驴</div>
                        <div class="legend-range">31 ~ 50 杯</div>
                    </div>
                </div>
                <div class="legend-item">
                    <span class="legend-emoji">👑</span>
                    <div>
                        <div class="legend-name">生产队主力</div>
                        <div class="legend-range">51+ 杯</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 品牌预设
        const BRANDS = {
            coffee: [
                { key: 'luckin', name: '瑞幸', icon: '🦌' },
                { key: 'starbucks', name: '星巴克', icon: '🟢' },
                { key: 'manner', name: 'Manner', icon: '⚫' },
                { key: 'tims', name: 'Tims', icon: '🍁' },
                { key: 'kudi', name: '库迪', icon: '🐆' },
                { key: 'mstand', name: 'M Stand', icon: '🅼' },
                { key: 'peets', name: '皮爷', icon: '🔴' },
                { key: 'seesaw', name: 'Seesaw', icon: '🎪' },
                { key: 'costa', name: 'Costa', icon: '🟤' },
                { key: 'luckypick', name: '幸运咖', icon: '🍀' },
                { key: 'other_coffee', name: '其他咖啡', icon: '☕' }
            ],
            tea: [
                { key: 'heytea', name: '喜茶', icon: '🍵' },
                { key: 'nayuki', name: '奈雪', icon: '🌸' },
                { key: 'mixue', name: '蜜雪冰城', icon: '⛄' },
                { key: 'chabaidao', name: '茶百道', icon: '🐼' },
                { key: 'guming', name: '古茗', icon: '🍃' },
                { key: 'yidiandian', name: '一点点', icon: '🔵' },
                { key: 'coco', name: 'CoCo', icon: '🟠' },
                { key: 'shanghai', name: '沪上阿姨', icon: '👩' },
                { key: 'chagee', name: '霸王茶姬', icon: '👸' },
                { key: 'shuyi', name: '书亦', icon: '📖' },
                { key: 'other_tea', name: '其他奶茶', icon: '🧋' }
            ]
        };

        // 等级配置 - 评语根据咖啡/奶茶比例动态生成
        const RANKS = [
            {
                min: 0, max: 0, emoji: '🧘', title: '佛系养生',
                coffeeDesc: '您目前还是人间清醒，咖啡奶茶都不染指',
                teaDesc: '您目前还是人间清醒，奶茶咖啡都不染指',
                balancedDesc: '您目前还是人间清醒，请继续保持这份难得的克制'
            },
            {
                min: 1, max: 5, emoji: '🐮', title: '初级牛马',
                coffeeDesc: '初尝咖啡因的甜头，小心前方是无底洞',
                teaDesc: '糖分与快乐正在向你招手，一口就上瘾',
                balancedDesc: '咖啡奶茶左右开弓，初级双修玩家就位'
            },
            {
                min: 6, max: 15, emoji: '🐴', title: '中级牛马',
                coffeeDesc: '已入咖啡因的坑，血液里开始有拿铁味了',
                teaDesc: '奶茶续命已成习惯，胰岛素在疯狂加班',
                balancedDesc: '早C午T双管齐下，快乐水和续命水两手都要硬'
            },
            {
                min: 16, max: 30, emoji: '🦄', title: '超级牛马',
                coffeeDesc: '血液里流淌着拿铁，同事眼中的永动机，睡觉是浪费时间',
                teaDesc: '糖水中泡大的超级选手，每一个细胞都在喊"全糖去冰"',
                balancedDesc: '咖啡因与糖分之王，白天靠咖啡晚上靠奶茶，全天无休'
            },
            {
                min: 31, max: 50, emoji: '🚀', title: '核动力驴',
                coffeeDesc: '不需要睡觉，只需要再来一杯浓缩，心脏已经在跳迪斯科',
                teaDesc: '奶茶就是你的血液，珍珠是你的红细胞，糖度是你的脉搏',
                balancedDesc: '一半咖啡因一半糖，核动力双引擎驱动，地球已经装不下你'
            },
            {
                min: 51, max: Infinity, emoji: '👑', title: '生产队主力',
                coffeeDesc: '您就是行走的咖啡测评机，各大品牌的VVVIP，咖啡因之神',
                teaDesc: '您就是奶茶界的活化石，去冰三分糖是你的口头禅，糖王登基',
                balancedDesc: '您是饮品界的终极BOSS，咖啡奶茶通吃，生产队的MVP，没有你不认识的品牌'
            }
        ];

        // 数据初始化（兼容旧数据格式）
        let data = { coffee: {}, tea: {} };
        try {
            const saved = localStorage.getItem('drinkData');
            if (saved) {
                const parsed = JSON.parse(saved);
                // 迁移旧数据格式（如果用品牌名做key的话自动兼容）
                if (parsed.coffee && typeof parsed.coffee === 'object') data.coffee = parsed.coffee;
                if (parsed.tea && typeof parsed.tea === 'object') data.tea = parsed.tea;
            }
        } catch(e) {
            console.warn('数据读取异常，已重置', e);
        }

        function getRank(total) {
            return RANKS.find(r => total >= r.min && total <= r.max) || RANKS[0];
        }

        function getTypeTotal(type) {
            return Object.values(data[type]).reduce((sum, v) => sum + (Number(v) || 0), 0);
        }

        function getTotal() {
            return getTypeTotal('coffee') + getTypeTotal('tea');
        }

        function save() {
            try {
                localStorage.setItem('drinkData', JSON.stringify(data));
            } catch(e) {
                console.warn('保存失败', e);
            }
        }

        // 获取预设key集合
        function getPresetKeys(type) {
            return new Set(BRANDS[type].map(b => b.key));
        }

        // 获取所有条目（预设品牌 + 旧数据/自定义品牌）
        function getAllEntries(type) {
            const presetKeys = getPresetKeys(type);
            const otherIcon = type === 'coffee' ? '☕' : '🧋';
            const entries = [];

            // 预设品牌
            BRANDS[type].forEach(b => {
                entries.push({
                    key: b.key,
                    name: b.name,
                    icon: b.icon,
                    count: Number(data[type][b.key]) || 0,
                    isPreset: true
                });
            });

            // 旧数据或不在预设中的品牌（如旧版手动输入的中文名）
            Object.keys(data[type]).forEach(k => {
                if (!presetKeys.has(k)) {
                    const cnt = Number(data[type][k]) || 0;
                    if (cnt > 0) {
                        entries.push({
                            key: k,
                            name: k,
                            icon: otherIcon,
                            count: cnt,
                            isPreset: false
                        });
                    }
                }
            });

            return entries.filter(e => e.count > 0).sort((a, b) => b.count - a.count);
        }

        // 安全转义用于HTML属性中的字符串
        function escAttr(s) {
            return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        // 渲染品牌按钮网格
        function renderBrandGrid(type, gridId) {
            const grid = document.getElementById(gridId);
            const brands = BRANDS[type];
            const typeClass = type === 'coffee' ? 'coffee-brand' : 'tea-brand';

            grid.innerHTML = brands.map(b => {
                const count = Number(data[type][b.key]) || 0;
                const hasCount = count > 0 ? 'has-count' : '';
                const safeKey = escAttr(b.key);
                const safeType = escAttr(type);
                return `
                    <button class="brand-btn ${typeClass} ${hasCount}" data-type="${safeType}" data-key="${safeKey}" onclick="addCup('${safeType}','${safeKey}',this)">
                        <span class="brand-count">${count}</span>
                        <span class="brand-icon">${b.icon}</span>
                        <span class="brand-name">${b.name}</span>
                    </button>
                `;
            }).join('');
        }

        // 渲染排行列表
        function renderList(type, listId, badgeClass) {
            const list = document.getElementById(listId);
            const entries = getAllEntries(type);

            if (entries.length === 0) {
                list.innerHTML = `<div class="empty-state">还没喝过${type === 'coffee' ? '咖啡' : '奶茶'}，点击上方品牌记录第一杯</div>`;
                return;
            }

            list.innerHTML = entries.map(b => {
                const safeKey = escAttr(b.key);
                const safeType = escAttr(type);
                return `
                <div class="drink-item">
                    <div class="drink-info">
                        <span class="drink-icon">${b.icon}</span>
                        <span class="drink-name">${b.name}</span>
                    </div>
                    <div class="drink-count">
                        <span class="count-badge ${badgeClass}">${b.count}</span>
                        <button class="btn-small btn-add" onclick="updateCount('${safeType}','${safeKey}',1)">+</button>
                        <button class="btn-small btn-remove" onclick="updateCount('${safeType}','${safeKey}',-1)">-</button>
                    </div>
                </div>
            `;
            }).join('');
        }

        // 根据咖啡/奶茶比例获取动态评语
        function getDynamicDesc(rank, coffeeN, teaN) {
            if (coffeeN === 0 && teaN === 0) return rank.balancedDesc;
            if (coffeeN === 0) return rank.teaDesc;
            if (teaN === 0) return rank.coffeeDesc;
            // 判断偏向：比例 > 2:1 视为偏向某一方
            const ratio = coffeeN / teaN;
            if (ratio >= 2) return rank.coffeeDesc;
            if (ratio <= 0.5) return rank.teaDesc;
            return rank.balancedDesc;
        }

        // 更新评级和统计
        function renderRank() {
            const total = getTotal();
            const coffeeN = getTypeTotal('coffee');
            const teaN = getTypeTotal('tea');
            const rank = getRank(total);
            const desc = getDynamicDesc(rank, coffeeN, teaN);

            document.getElementById('rankEmoji').textContent = rank.emoji;
            document.getElementById('rankTitle').textContent = rank.title;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('rankDesc').textContent = desc;
            document.getElementById('coffeeTotal').textContent = coffeeN;
            document.getElementById('teaTotal').textContent = teaN;
        }

        function render() {
            renderRank();
            renderBrandGrid('coffee', 'coffeeGrid');
            renderBrandGrid('tea', 'teaGrid');
            renderList('coffee', 'coffeeList', 'coffee-badge');
            renderList('tea', 'teaList', 'tea-badge');
        }

        // 加一杯（点击品牌按钮）
        function addCup(type, key, btnEl) {
            data[type][key] = (Number(data[type][key]) || 0) + 1;
            save();
            render();

            // 点击动画
            if (btnEl) {
                btnEl.classList.remove('pop');
                void btnEl.offsetWidth;
                btnEl.classList.add('pop');
            }
        }

        // 增减杯数
        function updateCount(type, key, delta) {
            const current = Number(data[type][key]) || 0;
            const next = current + delta;
            if (next <= 0) {
                delete data[type][key];
            } else {
                data[type][key] = next;
            }
            save();
            render();
        }

        // 清空
        function clearAll() {
            if (!confirm('确定要清空所有记录吗？此操作不可恢复！')) return;
            data = { coffee: {}, tea: {} };
            save();
            render();
        }

        // 导出为文本
        function exportData() {
            const total = getTotal();
            const coffeeN = getTypeTotal('coffee');
            const teaN = getTypeTotal('tea');
            const rank = getRank(total);

            let text = `【我的饮品记录】\n`;
            text += `当前等级：${rank.emoji} ${rank.title}\n`;
            text += `总杯数：${total} 杯（☕${coffeeN}杯 / 🧋${teaN}杯）\n\n`;

            const coffeeList = getAllEntries('coffee');
            const teaList = getAllEntries('tea');

            if (coffeeList.length) {
                text += `☕ 咖啡：\n`;
                coffeeList.forEach(b => { text += `  ${b.icon} ${b.name}：${b.count}杯\n`; });
                text += `\n`;
            }
            if (teaList.length) {
                text += `🧋 奶茶：\n`;
                teaList.forEach(b => { text += `  ${b.icon} ${b.name}：${b.count}杯\n`; });
            }

            // 复制到剪贴板
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('记录已复制到剪贴板！');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                alert('记录已复制到剪贴板！');
            } catch(e) {
                alert('复制失败，请手动复制：\n\n' + text);
            }
            document.body.removeChild(ta);
        }

        // 初始化
        render();
    </script>
</body>
</html>
