<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>药丸消消乐 - 俄罗斯方块创意版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Microsoft YaHei', sans-serif;
            color: #fff;
        }

        .game-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 20px;
        }

        #gameCanvas {
            border: 3px solid #e94560;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
            background: #0a0a1a;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 200px;
        }

        .panel-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 10px;
            padding: 20px;
        }

        .panel-title {
            font-size: 16px;
            color: #e94560;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .score-value {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
        }

        .level-value {
            font-size: 24px;
            color: #ffd700;
        }

        .next-canvas {
            border: 2px solid rgba(233, 69, 96, 0.5);
            border-radius: 5px;
            background: #0a0a1a;
        }

        .controls-info {
            font-size: 13px;
            line-height: 2;
            color: #ccc;
        }

        .controls-info span {
            color: #e94560;
            font-weight: bold;
        }

        .pill-legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 11px;
        }

        .pill-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pill-preview {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-start {
            background: linear-gradient(135deg, #e94560, #c73e54);
            color: #fff;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.5);
        }

        .btn-pause {
            background: linear-gradient(135deg, #533483, #7b68ee);
            color: #fff;
        }

        .btn-pause:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(123, 104, 238, 0.5);
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 8px;
        }

        .game-over-overlay.active {
            display: flex;
        }

        .game-over-text {
            font-size: 36px;
            color: #e94560;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .combo-text {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            pointer-events: none;
            animation: comboAnim 1s ease-out forwards;
        }

        @keyframes comboAnim {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
        }

        .canvas-wrapper {
            position: relative;
        }

        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .mobile-btn {
            padding: 15px;
            background: rgba(233, 69, 96, 0.3);
            border: 1px solid #e94560;
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            touch-action: manipulation;
        }

        .mobile-btn:active {
            background: rgba(233, 69, 96, 0.6);
        }

        @media (max-width: 768px) {
            .game-container {
                flex-direction: column;
                align-items: center;
                padding: 10px;
            }
            .right-panel {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                min-width: auto;
            }
            .panel-box {
                min-width: 150px;
            }
            .mobile-controls {
                display: grid;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="left-panel">
            <div class="title">💊 药丸消消乐</div>
            <div class="subtitle">俄罗斯方块创意版 · TRAE AI 创造力大赛</div>
            <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="300" height="600"></canvas>
                <div class="game-over-overlay" id="gameOverOverlay">
                    <div class="game-over-text">游戏结束</div>
                    <button class="btn btn-start" onclick="game.restart()">再来一局</button>
                </div>
            </div>
            <div class="mobile-controls">
                <div></div>
                <button class="mobile-btn" onclick="game.rotate()">↻</button>
                <div></div>
                <button class="mobile-btn" onclick="game.moveLeft()">←</button>
                <button class="mobile-btn" onclick="game.moveDown()">↓</button>
                <button class="mobile-btn" onclick="game.moveRight()">→</button>
                <div></div>
                <button class="mobile-btn" onclick="game.hardDrop()">⤓</button>
                <div></div>
            </div>
        </div>
        <div class="right-panel">
            <div class="panel-box">
                <div class="panel-title">🏆 得分</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="panel-box">
                <div class="panel-title">📈 等级</div>
                <div class="level-value" id="level">1</div>
            </div>
            <div class="panel-box">
                <div class="panel-title">💊 下一个</div>
                <canvas id="nextCanvas" class="next-canvas" width="100" height="100"></canvas>
            </div>
            <div class="panel-box">
                <div class="panel-title">🎮 操作说明</div>
                <div class="controls-info">
                    <span>← →</span> 左右移动<br>
                    <span>↓</span> 加速下落<br>
                    <span>↑</span> 旋转<br>
                    <span>空格</span> 直接落下<br>
                    <span>P</span> 暂停
                </div>
            </div>
            <div class="panel-box">
                <div class="panel-title">💊 药丸图鉴</div>
                <div class="pill-legend" id="pillLegend"></div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-start" id="startBtn" onclick="game.start()">开始游戏</button>
                <button class="btn btn-pause" id="pauseBtn" onclick="game.togglePause()">暂停</button>
            </div>
        </div>
    </div>

    <script>
        // 药丸主题配置 - 每种药物有独特的真实造型
        const PILL_CONFIG = {
            1: { 
                name: '阿司匹林', 
                type: 'tablet',           // 白色圆形药片
                color1: '#F0F0F0', 
                color2: '#E0E0E0',
                accent: '#C0C0C0',
                description: '白色圆片'
            },
            2: { 
                name: '维生素C', 
                type: 'capsule',          // 橙色胶囊
                color1: '#FF8C00', 
                color2: '#FFD700',
                accent: '#FFA500',
                description: '双色胶囊'
            },
            3: { 
                name: '益生菌', 
                type: 'capsule',          // 蓝白胶囊
                color1: '#4169E1', 
                color2: '#F0F8FF',
                accent: '#6495ED',
                description: '蓝白胶囊'
            },
            4: { 
                name: '褪黑素', 
                type: 'tablet',           // 紫色圆片
                color1: '#9370DB', 
                color2: '#8A2BE2',
                accent: '#BA55D3',
                description: '紫色圆片'
            },
            5: { 
                name: '布洛芬', 
                type: 'capsule',          // 红白胶囊
                color1: '#DC143C', 
                color2: '#FFF5EE',
                accent: '#B22222',
                description: '红白胶囊'
            },
            6: { 
                name: '钙片', 
                type: 'tablet',           // 白色大圆片带刻痕
                color1: '#FFFAF0', 
                color2: '#F5F5DC',
                accent: '#D3D3D3',
                description: '刻痕圆片'
            },
            7: { 
                name: '鱼油', 
                type: 'softgel',          // 黄色椭圆形软胶囊
                color1: '#FFD700', 
                color2: '#FFA500',
                accent: '#DAA520',
                description: '透明软胶囊'
            }
        };

        // 俄罗斯方块形状
        const SHAPES = [
            [[1,1,1,1]],           // I - 长条
            [[1,1],[1,1]],         // O - 方形
            [[0,1,0],[1,1,1]],     // T
            [[1,0,0],[1,1,1]],     // L
            [[0,0,1],[1,1,1]],     // J
            [[0,1,1],[1,1,0]],     // S
            [[1,1,0],[0,1,1]]      // Z
        ];

        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;

        class PillGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.nextCanvas = document.getElementById('nextCanvas');
                this.nextCtx = this.nextCanvas.getContext('2d');
                
                this.board = [];
                this.currentPiece = null;
                this.nextPiece = null;
                this.score = 0;
                this.level = 1;
                this.lines = 0;
                this.gameOver = false;
                this.paused = false;
                this.running = false;
                this.dropCounter = 0;
                this.dropInterval = 1000;
                this.lastTime = 0;
                this.combo = 0;

                this.initBoard();
                this.initLegend();
                this.setupControls();
            }

            initBoard() {
                this.board = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
            }

            initLegend() {
                const legend = document.getElementById('pillLegend');
                legend.innerHTML = '';
                Object.entries(PILL_CONFIG).forEach(([key, pill]) => {
                    const item = document.createElement('div');
                    item.className = 'pill-item';
                    
                    // 创建预览 canvas
                    const previewCanvas = document.createElement('canvas');
                    previewCanvas.className = 'pill-preview';
                    previewCanvas.width = 22;
                    previewCanvas.height = 22;
                    const pctx = previewCanvas.getContext('2d');
                    this.drawPillBlock(pctx, 0, 0, 22, parseInt(key), true);
                    
                    item.appendChild(previewCanvas);
                    const textSpan = document.createElement('span');
                    textSpan.textContent = pill.name;
                    item.appendChild(textSpan);
                    legend.appendChild(item);
                });
            }

            createPiece() {
                const shapeIdx = Math.floor(Math.random() * SHAPES.length);
                const colorIdx = Math.floor(Math.random() * 7) + 1;
                const shape = SHAPES[shapeIdx].map(row => row.map(cell => cell ? colorIdx : 0));
                
                return {
                    shape: shape,
                    x: Math.floor((COLS - shape[0].length) / 2),
                    y: 0,
                    colorIdx: colorIdx
                };
            }

            start() {
                if (this.running) return;
                this.running = true;
                this.gameOver = false;
                this.score = 0;
                this.level = 1;
                this.lines = 0;
                this.combo = 0;
                this.dropInterval = 1000;
                this.initBoard();
                
                document.getElementById('gameOverOverlay').classList.remove('active');
                document.getElementById('startBtn').textContent = '游戏中';
                document.getElementById('startBtn').disabled = true;
                
                this.currentPiece = this.createPiece();
                this.nextPiece = this.createPiece();
                this.drawNext();
                this.updateUI();
                this.lastTime = performance.now();
                requestAnimationFrame(this.gameLoop.bind(this));
            }

            restart() {
                this.running = false;
                document.getElementById('startBtn').textContent = '开始游戏';
                document.getElementById('startBtn').disabled = false;
                this.start();
            }

            togglePause() {
                if (!this.running || this.gameOver) return;
                this.paused = !this.paused;
                document.getElementById('pauseBtn').textContent = this.paused ? '继续' : '暂停';
                if (!this.paused) {
                    this.lastTime = performance.now();
                    requestAnimationFrame(this.gameLoop.bind(this));
                }
            }

            gameLoop(time) {
                if (!this.running || this.paused || this.gameOver) return;
                
                const deltaTime = time - this.lastTime;
                this.lastTime = time;
                
                this.dropCounter += deltaTime;
                if (this.dropCounter > this.dropInterval) {
                    this.moveDown();
                    this.dropCounter = 0;
                }
                
                this.draw();
                requestAnimationFrame(this.gameLoop.bind(this));
            }

            draw() {
                this.ctx.fillStyle = '#0a0a1a';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // 网格线
                this.ctx.strokeStyle = 'rgba(233, 69, 96, 0.08)';
                this.ctx.lineWidth = 0.5;
                for (let i = 0; i <= COLS; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(i * BLOCK_SIZE, 0);
                    this.ctx.lineTo(i * BLOCK_SIZE, this.canvas.height);
                    this.ctx.stroke();
                }
                for (let i = 0; i <= ROWS; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, i * BLOCK_SIZE);
                    this.ctx.lineTo(this.canvas.width, i * BLOCK_SIZE);
                    this.ctx.stroke();
                }

                // 已固定的药片
                for (let row = 0; row < ROWS; row++) {
                    for (let col = 0; col < COLS; col++) {
                        if (this.board[row][col]) {
                            this.drawPillBlock(this.ctx, col * BLOCK_SIZE, row * BLOCK_SIZE, BLOCK_SIZE, this.board[row][col]);
                        }
                    }
                }

                // 当前药片
                if (this.currentPiece) {
                    this.drawPiece(this.ctx, this.currentPiece);
                    this.drawGhost();
                }
            }

            // 绘制真实药片造型
            drawPillBlock(ctx, x, y, size, colorIdx, isSmall = false) {
                const pill = PILL_CONFIG[colorIdx];
                const padding = size * 0.08;
                const px = x + padding;
                const py = y + padding;
                const pw = size - padding * 2;
                const ph = size - padding * 2;
                const scale = isSmall ? 0.7 : 1;

                ctx.save();
                
                if (pill.type === 'capsule') {
                    this.drawCapsule(ctx, px, py, pw, ph, pill, scale);
                } else if (pill.type === 'tablet') {
                    this.drawTablet(ctx, px, py, pw, ph, pill, scale);
                } else if (pill.type === 'softgel') {
                    this.drawSoftgel(ctx, px, py, pw, ph, pill, scale);
                }
                
                ctx.restore();
            }

            // 胶囊 - 长椭圆，上下两半不同颜色
            drawCapsule(ctx, x, y, w, h, pill, scale) {
                const r = Math.min(w, h) * 0.45 * scale;
                const cx = x + w / 2;
                const cy = y + h / 2;
                const hw = w * 0.35 * scale;
                const hh = h * 0.35 * scale;

                // 上半部分
                ctx.beginPath();
                ctx.ellipse(cx, cy - hh * 0.5, hw, hh, 0, 0, Math.PI, true);
                ctx.ellipse(cx, cy + hh * 0.5, hw, hh, 0, Math.PI, 0, true);
                ctx.closePath();
                
                // 渐变填充上半
                const grad1 = ctx.createLinearGradient(cx - hw, cy - hh, cx + hw, cy);
                grad1.addColorStop(0, pill.color1);
                grad1.addColorStop(0.5, pill.color1);
                grad1.addColorStop(1, pill.color2);
                ctx.fillStyle = grad1;
                ctx.fill();

                // 下半部分
                ctx.beginPath();
                ctx.ellipse(cx, cy + hh * 0.5, hw, hh, 0, 0, Math.PI, false);
                ctx.ellipse(cx, cy - hh * 0.5, hw, hh, 0, Math.PI, 0, false);
                ctx.closePath();
                
                const grad2 = ctx.createLinearGradient(cx - hw, cy, cx + hw, cy + hh);
                grad2.addColorStop(0, pill.color2);
                grad2.addColorStop(0.5, pill.color2);
                grad2.addColorStop(1, pill.color1);
                ctx.fillStyle = grad2;
                ctx.fill();

                // 中间分割线
                ctx.beginPath();
                ctx.moveTo(cx - hw, cy);
                ctx.lineTo(cx + hw, cy);
                ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // 高光
                ctx.beginPath();
                ctx.ellipse(cx - hw * 0.3, cy - hh * 0.6, hw * 0.25, hh * 0.15, -0.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.35)';
                ctx.fill();

                // 外边框光泽
                ctx.beginPath();
                ctx.ellipse(cx, cy - hh * 0.5, hw, hh, 0, 0, Math.PI, true);
                ctx.ellipse(cx, cy + hh * 0.5, hw, hh, 0, Math.PI, 0, true);
                ctx.closePath();
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 0.8;
                ctx.stroke();
            }

            // 圆形药片 - 带刻痕
            drawTablet(ctx, x, y, w, h, pill, scale) {
                const r = Math.min(w, h) * 0.38 * scale;
                const cx = x + w / 2;
                const cy = y + h / 2;

                // 阴影
                ctx.beginPath();
                ctx.arc(cx + 1, cy + 2, r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.fill();

                // 主体
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                const grad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 0, cx, cy, r);
                grad.addColorStop(0, pill.color1);
                grad.addColorStop(0.7, pill.color2);
                grad.addColorStop(1, pill.accent);
                ctx.fillStyle = grad;
                ctx.fill();

                // 刻痕（十字或单线）
                ctx.beginPath();
                if (pill.name === '钙片') {
                    // 十字刻痕
                    ctx.moveTo(cx - r * 0.6, cy);
                    ctx.lineTo(cx + r * 0.6, cy);
                    ctx.moveTo(cx, cy - r * 0.6);
                    ctx.lineTo(cx, cy + r * 0.6);
                } else {
                    // 单线刻痕
                    ctx.moveTo(cx - r * 0.5, cy);
                    ctx.lineTo(cx + r * 0.5, cy);
                }
                ctx.strokeStyle = 'rgba(100,100,100,0.3)';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                // 高光
                ctx.beginPath();
                ctx.arc(cx - r * 0.25, cy - r * 0.25, r * 0.35, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fill();

                // 边缘
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 0.8;
                ctx.stroke();
            }

            // 软胶囊 - 椭圆形透明感
            drawSoftgel(ctx, x, y, w, h, pill, scale) {
                const cx = x + w / 2;
                const cy = y + h / 2;
                const hw = w * 0.32 * scale;
                const hh = h * 0.28 * scale;

                // 阴影
                ctx.beginPath();
                ctx.ellipse(cx + 1, cy + 2, hw, hh, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fill();

                // 主体 - 半透明感
                ctx.beginPath();
                ctx.ellipse(cx, cy, hw, hh, 0, 0, Math.PI * 2);
                const grad = ctx.createRadialGradient(cx - hw * 0.2, cy - hh * 0.2, 0, cx, cy, Math.max(hw, hh));
                grad.addColorStop(0, pill.color1);
                grad.addColorStop(0.6, pill.color2);
                grad.addColorStop(1, pill.accent);
                ctx.fillStyle = grad;
                ctx.fill();

                // 透明光泽
                ctx.beginPath();
                ctx.ellipse(cx - hw * 0.15, cy - hh * 0.2, hw * 0.5, hh * 0.25, -0.4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fill();

                // 边缘高光
                ctx.beginPath();
                ctx.ellipse(cx, cy, hw, hh, 0, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 内高光点
                ctx.beginPath();
                ctx.arc(cx + hw * 0.2, cy + hh * 0.1, 2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fill();
            }

            drawPiece(ctx, piece) {
                piece.shape.forEach((row, y) => {
                    row.forEach((cell, x) => {
                        if (cell) {
                            this.drawPillBlock(ctx, (piece.x + x) * BLOCK_SIZE, (piece.y + y) * BLOCK_SIZE, BLOCK_SIZE, cell);
                        }
                    });
                });
            }

            drawGhost() {
                let ghostY = this.currentPiece.y;
                while (this.isValidMove(this.currentPiece.shape, this.currentPiece.x, ghostY + 1)) {
                    ghostY++;
                }
                
                if (ghostY !== this.currentPiece.y) {
                    this.currentPiece.shape.forEach((row, y) => {
                        row.forEach((cell, x) => {
                            if (cell) {
                                const px = (this.currentPiece.x + x) * BLOCK_SIZE;
                                const py = (ghostY + y) * BLOCK_SIZE;
                                const r = BLOCK_SIZE * 0.35;
                                const cx = px + BLOCK_SIZE / 2;
                                const cy = py + BLOCK_SIZE / 2;
                                
                                ctx.beginPath();
                                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                                ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
                                ctx.lineWidth = 1.5;
                                ctx.setLineDash([3, 3]);
                                ctx.stroke();
                                ctx.setLineDash([]);
                            }
                        });
                    });
                }
            }

            drawNext() {
                this.nextCtx.fillStyle = '#0a0a1a';
                this.nextCtx.fillRect(0, 0, this.nextCanvas.width, this.nextCanvas.height);
                
                if (!this.nextPiece) return;
                
                const offsetX = (this.nextCanvas.width - this.nextPiece.shape[0].length * 20) / 2;
                const offsetY = (this.nextCanvas.height - this.nextPiece.shape.length * 20) / 2;
                
                this.nextPiece.shape.forEach((row, y) => {
                    row.forEach((cell, x) => {
                        if (cell) {
                            this.drawPillBlock(this.nextCtx, offsetX + x * 20, offsetY + y * 20, 20, cell, true);
                        }
                    });
                });
            }

            isValidMove(shape, offsetX, offsetY) {
                for (let y = 0; y < shape.length; y++) {
                    for (let x = 0; x < shape[y].length; x++) {
                        if (shape[y][x]) {
                            const newX = offsetX + x;
                            const newY = offsetY + y;
                            
                            if (newX < 0 || newX >= COLS || newY >= ROWS) {
                                return false;
                            }
                            if (newY >= 0 && this.board[newY][newX]) {
                                return false;
                            }
                        }
                    }
                }
                return true;
            }

            moveLeft() {
                if (!this.running || this.paused || this.gameOver) return;
                if (this.isValidMove(this.currentPiece.shape, this.currentPiece.x - 1, this.currentPiece.y)) {
                    this.currentPiece.x--;
                    this.draw();
                }
            }

            moveRight() {
                if (!this.running || this.paused || this.gameOver) return;
                if (this.isValidMove(this.currentPiece.shape, this.currentPiece.x + 1, this.currentPiece.y)) {
                    this.currentPiece.x++;
                    this.draw();
                }
            }

            moveDown() {
                if (!this.running || this.paused || this.gameOver) return;
                if (this.isValidMove(this.currentPiece.shape, this.currentPiece.x, this.currentPiece.y + 1)) {
                    this.currentPiece.y++;
                    return true;
                } else {
                    this.lockPiece();
                    return false;
                }
            }

            hardDrop() {
                if (!this.running || this.paused || this.gameOver) return;
                let dropDistance = 0;
                while (this.isValidMove(this.currentPiece.shape, this.currentPiece.x, this.currentPiece.y + 1)) {
                    this.currentPiece.y++;
                    dropDistance++;
                }
                this.score += dropDistance * 2;
                this.lockPiece();
            }

            rotate() {
                if (!this.running || this.paused || this.gameOver) return;
                const rotated = this.currentPiece.shape[0].map((_, i) =>
                    this.currentPiece.shape.map(row => row[i]).reverse()
                );
                
                const kicks = [0, -1, 1, -2, 2];
                for (const kick of kicks) {
                    if (this.isValidMove(rotated, this.currentPiece.x + kick, this.currentPiece.y)) {
                        this.currentPiece.shape = rotated;
                        this.currentPiece.x += kick;
                        this.draw();
                        return;
                    }
                }
            }

            lockPiece() {
                this.currentPiece.shape.forEach((row, y) => {
                    row.forEach((cell, x) => {
                        if (cell) {
                            const boardY = this.currentPiece.y + y;
                            const boardX = this.currentPiece.x + x;
                            if (boardY >= 0) {
                                this.board[boardY][boardX] = cell;
                            }
                        }
                    });
                });

                const linesCleared = this.clearLines();
                
                if (linesCleared > 0) {
                    this.combo++;
                    const basePoints = [0, 100, 300, 500, 800];
                    const points = basePoints[linesCleared] * this.level * (1 + this.combo * 0.5);
                    this.score += Math.floor(points);
                    this.lines += linesCleared;
                    this.level = Math.floor(this.lines / 10) + 1;
                    this.dropInterval = Math.max(100, 1000 - (this.level - 1) * 100);
                    
                    this.showCombo(linesCleared);
                } else {
                    this.combo = 0;
                }

                this.currentPiece = this.nextPiece;
                this.nextPiece = this.createPiece();
                this.drawNext();

                if (!this.isValidMove(this.currentPiece.shape, this.currentPiece.x, this.currentPiece.y)) {
                    this.endGame();
                    return;
                }

                this.updateUI();
            }

            clearLines() {
                let linesCleared = 0;
                for (let row = ROWS - 1; row >= 0; row--) {
                    if (this.board[row].every(cell => cell !== 0)) {
                        this.board.splice(row, 1);
                        this.board.unshift(Array(COLS).fill(0));
                        linesCleared++;
                        row++;
                    }
                }
                return linesCleared;
            }

            showCombo(lines) {
                const comboTexts = ['', '消除!', '双消!', '三消!', '四消!'];
                const text = comboTexts[lines] || `${lines}消!`;
                
                const comboEl = document.createElement('div');
                comboEl.className = 'combo-text';
                comboEl.textContent = text + (this.combo > 1 ? ` x${this.combo}连击!` : '');
                comboEl.style.left = '50%';
                comboEl.style.top = '40%';
                comboEl.style.transform = 'translateX(-50%)';
                this.canvas.parentElement.appendChild(comboEl);
                
                setTimeout(() => comboEl.remove(), 1000);
            }

            endGame() {
                this.gameOver = true;
                document.getElementById('gameOverOverlay').classList.add('active');
                document.getElementById('startBtn').textContent = '开始游戏';
                document.getElementById('startBtn').disabled = false;
            }

            updateUI() {
                document.getElementById('score').textContent = this.score.toLocaleString();
                document.getElementById('level').textContent = this.level;
            }

            setupControls() {
                document.addEventListener('keydown', (e) => {
                    if (!this.running) return;
                    
                    switch(e.key) {
                        case 'ArrowLeft':
                            e.preventDefault();
                            this.moveLeft();
                            break;
                        case 'ArrowRight':
                            e.preventDefault();
                            this.moveRight();
                            break;
                        case 'ArrowDown':
                            e.preventDefault();
                            this.moveDown();
                            break;
                        case 'ArrowUp':
                            e.preventDefault();
                            this.rotate();
                            break;
                        case ' ':
                            e.preventDefault();
                            this.hardDrop();
                            break;
                        case 'p':
                        case 'P':
                            e.preventDefault();
                            this.togglePause();
                            break;
                    }
                });
            }
        }

        const game = new PillGame();
        game.draw();
    </script>
</body>
</html>
