<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI音频工作室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 40px 0;
        }
        h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #888;
            font-size: 1.1em;
        }
        .modules {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }
        .module-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .module-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 217, 255, 0.2);
        }
        .module-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
        .module-title {
            font-size: 1.4em;
            margin-bottom: 10px;
            color: #00d9ff;
        }
        .module-desc {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 50px;
        }
        .feature-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }
        .feature-icon {
            font-size: 1.5em;
        }
        .feature-text {
            color: #ccc;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: opacity 0.3s;
        }
        .btn:hover {
            opacity: 0.8;
        }
        .waveform {
            height: 100px;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 10px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .wave-bar {
            width: 4px;
            background: linear-gradient(to top, #00d9ff, #00ff88);
            margin: 0 2px;
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite;
        }
        @keyframes wave {
            0%, 100% { height: 20px; }
            50% { height: 60px; }
        }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }
        footer {
            text-align: center;
            padding: 40px 0;
            color: #666;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI音频工作室</h1>
            <p class="subtitle">录制 · 编辑 · 智能生成</p>
        </header>

        <div class="waveform">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>

        <div class="modules">
            <div class="module-card">
                <div class="module-icon">🎙️</div>
                <h3 class="module-title">音频录制</h3>
                <p class="module-desc">支持设备选择、实时音量监测，录制高质量WAV格式音频</p>
                <a href="#" class="btn">开始录制</a>
            </div>

            <div class="module-card">
                <div class="module-icon">🎛️</div>
                <h3 class="module-title">音频编辑</h3>
                <p class="module-desc">11种专业音效：混响、回声、变速、变调、降噪等</p>
                <a href="#" class="btn">编辑音频</a>
            </div>

            <div class="module-card">
                <div class="module-icon">🎵</div>
                <h3 class="module-title">AI生成</h3>
                <p class="module-desc">基于参考音频智能生成音乐，支持多种风格</p>
                <a href="#" class="btn">生成歌曲</a>
            </div>
        </div>

        <div class="features">
            <div class="feature-item">
                <span class="feature-icon">⚡</span>
                <span class="feature-text">实时录制监控</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">🎨</span>
                <span class="feature-text">多种音效处理</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">🤖</span>
                <span class="feature-text">AI智能生成</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">📁</span>
                <span class="feature-text">文件管理</span>
            </div>
        </div>

        <footer>
            <p>基于 Python + AI 技术构建 | 使用 sounddevice, librosa, scipy</p>
        </footer>
    </div>
</body>
</html>
