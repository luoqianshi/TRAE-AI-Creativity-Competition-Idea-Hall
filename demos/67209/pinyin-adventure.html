<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼音小勇士 · 快乐闯关</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --candy-pink: #FFB7C5;
            --candy-yellow: #FFE66D;
            --candy-mint: #95E1D3;
            --candy-blue: #A8D8EA;
            --candy-purple: #D4A5FF;
            --candy-orange: #FFC078;
            --text-dark: #4A4A68;
            --text-light: #7A7A9A;
            --bg-cream: #FFF9F0;
            --shadow-soft: 0 8px 24px rgba(123, 97, 142, 0.12);
            --shadow-press: 0 4px 12px rgba(123, 97, 142, 0.15);
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif;
            background: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 15% 25%, rgba(255, 183, 197, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 15%, rgba(255, 230, 109, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 75% 85%, rgba(149, 225, 211, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 25% 75%, rgba(212, 165, 255, 0.2) 0%, transparent 45%);
        }

        /* Floating decorations */
        .float-decor {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.45;
            animation: float 6s ease-in-out infinite;
        }

        .cloud1 { top: 8%; left: 5%; animation-delay: 0s; }
        .cloud2 { top: 20%; right: 8%; animation-delay: 1.5s; }
        .cloud3 { bottom: 15%; left: 8%; animation-delay: 3s; }
        .star-decor { top: 12%; right: 20%; animation-delay: 2s; }
        .heart-decor { bottom: 22%; right: 12%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-16px) rotate(2deg); }
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        @keyframes pop {
            0% { transform: scale(0.9); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @keyframes bounce-in {
            0% { transform: scale(0.6); opacity: 0; }
            60% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Layout */
        .app-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px 40px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
            position: relative;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            background: white;
            padding: 14px 30px;
            border-radius: 50px;
            box-shadow: var(--shadow-soft);
            animation: bounce-in 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--candy-pink), var(--candy-purple));
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 28px;
            color: white;
            animation: wiggle 2.5s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            background: linear-gradient(90deg, #FF6B9D, #FFA94D, #4ECDC4, #9B59B6);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 4s ease infinite;
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .subtitle {
            color: var(--text-light);
            font-size: 1.05rem;
            margin-top: 8px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Screens */
        .screen {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Level map */
        .level-map {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 22px;
            margin-top: 30px;
        }

        .level-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 24px 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: var(--shadow-soft);
            border: 4px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .level-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .level-card:hover::before { opacity: 1; }

        .level-card.locked {
            opacity: 0.55;
            cursor: not-allowed;
            filter: grayscale(0.6);
        }

        .level-card:not(.locked):hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 16px 40px rgba(123, 97, 142, 0.2);
            border-color: var(--candy-yellow);
        }

        .level-icon {
            width: 86px;
            height: 86px;
            margin: 0 auto 14px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 42px;
            transition: transform 0.3s;
        }

        .level-card:not(.locked):hover .level-icon {
            transform: scale(1.1) rotate(-5deg);
        }

        .level-card.level-1 .level-icon { background: linear-gradient(135deg, #FFB7C5, #FF8FAB); }
        .level-card.level-2 .level-icon { background: linear-gradient(135deg, #FFE66D, #FFC078); }
        .level-card.level-3 .level-icon { background: linear-gradient(135deg, #95E1D3, #74D3C2); }
        .level-card.level-4 .level-icon { background: linear-gradient(135deg, #A8D8EA, #7EC8E3); }
        .level-card.level-5 .level-icon { background: linear-gradient(135deg, #D4A5FF, #B388FF); }

        .level-title {
            font-size: 1.3rem;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .level-desc {
            font-size: 0.92rem;
            color: var(--text-light);
            font-family: 'Noto Sans SC', sans-serif;
        }

        .stars {
            margin-top: 12px;
            font-size: 1.3rem;
            letter-spacing: 3px;
        }

        .star.empty { opacity: 0.25; }

        /* Game area */
        .game-panel {
            background: white;
            border-radius: var(--radius-xl);
            padding: 28px 24px 34px;
            box-shadow: var(--shadow-soft);
            max-width: 720px;
            margin: 0 auto;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .back-btn {
            background: #F0F0F8;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover {
            background: var(--candy-pink);
            color: white;
            transform: scale(1.05);
        }

        .progress-bar {
            flex: 1;
            min-width: 140px;
            height: 18px;
            background: #F0F0F8;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--candy-mint), var(--candy-blue));
            border-radius: 20px;
            transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 0%;
        }

        .score-badge {
            background: linear-gradient(135deg, var(--candy-yellow), var(--candy-orange));
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 700;
            color: #5D4A2A;
            box-shadow: var(--shadow-press);
        }

        /* Question card */
        .question-card {
            background: linear-gradient(180deg, #FFFDF8 0%, #FFF5F8 100%);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            text-align: center;
            margin-bottom: 24px;
            border: 3px dashed rgba(255, 183, 197, 0.5);
            position: relative;
        }

        .mascot {
            width: 90px;
            height: 90px;
            margin: 0 auto 16px;
            animation: wiggle 3s ease-in-out infinite;
        }

        .question-hint {
            font-size: 1.15rem;
            color: var(--text-light);
            margin-bottom: 14px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .pinyin-display {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(4rem, 14vw, 7.5rem);
            color: var(--text-dark);
            line-height: 1.1;
            text-shadow: 4px 4px 0px rgba(255, 183, 197, 0.3);
            letter-spacing: 8px;
            margin: 10px 0 18px;
            transition: transform 0.3s;
        }

        .pinyin-display.tone-1 { color: #E74C3C; }
        .pinyin-display.tone-2 { color: #2ECC71; }
        .pinyin-display.tone-3 { color: #3498DB; }
        .pinyin-display.tone-4 { color: #9B59B6; }

        .word-image {
            font-size: clamp(3.5rem, 10vw, 5.5rem);
            margin: 8px 0;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.08));
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 16px;
            margin-top: 8px;
        }

        .option-btn {
            background: white;
            border: 3px solid #F0F0F8;
            border-radius: var(--radius-md);
            padding: 18px 14px;
            font-family: 'ZCOOL KuaiLe', sans-serif;
            font-size: 1.6rem;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 0 #E8E8F0;
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-4px);
            border-color: var(--candy-mint);
            box-shadow: 0 8px 0 #D5F2EC;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #D5F2EC;
        }

        .option-btn.correct {
            background: #D4F8E8;
            border-color: #2ECC71;
            color: #1E8449;
            box-shadow: 0 4px 0 #A8E6C8;
            animation: pop 0.4s ease;
        }

        .option-btn.wrong {
            background: #FFE5E5;
            border-color: #E74C3C;
            color: #C0392B;
            box-shadow: 0 4px 0 #F5B7B1;
            animation: shake 0.4s ease;
        }

        .option-btn:disabled {
            cursor: default;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .feedback-msg {
            min-height: 36px;
            font-size: 1.25rem;
            margin-top: 18px;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .feedback-msg.show { opacity: 1; }
        .feedback-msg.correct { color: #27AE60; }
        .feedback-msg.wrong { color: #E74C3C; }

        /* Level complete modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(74, 74, 104, 0.55);
            display: none;
            place-items: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.show {
            display: grid;
            animation: fadeIn 0.3s ease;
        }

        .modal {
            background: white;
            border-radius: var(--radius-xl);
            padding: 36px 28px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 24px 60px rgba(74, 74, 104, 0.3);
            animation: bounce-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-emoji {
            font-size: 4.5rem;
            margin-bottom: 12px;
            display: inline-block;
            animation: pop 1s ease infinite;
        }

        .modal h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        .modal p {
            color: var(--text-light);
            font-family: 'Noto Sans SC', sans-serif;
            margin-bottom: 8px;
        }

        .modal-stars {
            font-size: 2.4rem;
            margin: 16px 0;
            letter-spacing: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--candy-pink), var(--candy-purple));
            color: white;
            border: none;
            padding: 16px 36px;
            border-radius: 50px;
            font-family: 'ZCOOL KuaiLe', sans-serif;
            font-size: 1.25rem;
            cursor: pointer;
            box-shadow: 0 6px 0 #D890D0;
            transition: all 0.2s;
            margin: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #D890D0;
        }

        .btn-primary:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #D890D0;
        }

        .btn-secondary {
            background: white;
            color: var(--text-dark);
            border: 3px solid #E8E8F0;
            padding: 14px 28px;
            border-radius: 50px;
            font-family: 'ZCOOL KuaiLe', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin: 8px;
        }

        .btn-secondary:hover {
            border-color: var(--candy-blue);
            background: #F8FBFF;
        }

        /* Confetti */
        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 99;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: confetti-fall 3s ease-out forwards;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        footer {
            text-align: center;
            margin-top: 36px;
            color: var(--text-light);
            font-size: 0.9rem;
            font-family: 'Noto Sans SC', sans-serif;
        }

        @media (max-width: 640px) {
            .app-container { padding: 16px 14px 30px; }
            .game-panel { padding: 22px 16px 26px; }
            .game-header { flex-direction: column; align-items: stretch; }
            .options-grid { grid-template-columns: repeat(2, 1fr); }
            .level-map { grid-template-columns: repeat(2, 1fr); gap: 14px; }
        }
    </style>
</head>
<body>
    <!-- Decorative background elements -->
    <svg class="float-decor cloud1" width="80" height="50" viewBox="0 0 80 50">
        <path d="M15,35 Q5,35 5,25 Q5,10 25,12 Q30,2 45,5 Q60,0 70,12 Q80,12 78,25 Q78,35 68,35 Z" fill="#fff" stroke="#FFD6E0" stroke-width="2"/>
    </svg>
    <svg class="float-decor cloud2" width="70" height="45" viewBox="0 0 80 50">
        <path d="M15,35 Q5,35 5,25 Q5,10 25,12 Q30,2 45,5 Q60,0 70,12 Q80,12 78,25 Q78,35 68,35 Z" fill="#fff" stroke="#FFF0B3" stroke-width="2"/>
    </svg>
    <svg class="float-decor cloud3" width="90" height="55" viewBox="0 0 80 50">
        <path d="M15,35 Q5,35 5,25 Q5,10 25,12 Q30,2 45,5 Q60,0 70,12 Q80,12 78,25 Q78,35 68,35 Z" fill="#fff" stroke="#D5F2EC" stroke-width="2"/>
    </svg>
    <svg class="float-decor star-decor" width="40" height="40" viewBox="0 0 40 40">
        <polygon points="20,2 25,15 38,15 28,23 32,36 20,28 8,36 12,23 2,15 15,15" fill="#FFE66D" stroke="#FFC078" stroke-width="2"/>
    </svg>
    <svg class="float-decor heart-decor" width="36" height="36" viewBox="0 0 36 36">
        <path d="M18,30 C18,30 4,20 4,12 C4,7 8,3 13,3 C15,3 17,5 18,7 C19,5 21,3 23,3 C28,3 32,7 32,12 C32,20 18,30 18,30 Z" fill="#FFB7C5" stroke="#FF8FAB" stroke-width="2"/>
    </svg>

    <div class="app-container">
        <header>
            <div class="logo">
                <div class="logo-icon">🐼</div>
                <h1>拼音小勇士</h1>
            </div>
            <p class="subtitle">快乐闯关 · 轻松学会汉语拼音</p>
        </header>

        <!-- Level Map Screen -->
        <section id="levelScreen" class="screen active">
            <div class="level-map" id="levelMap"></div>
        </section>

        <!-- Game Screen -->
        <section id="gameScreen" class="screen">
            <div class="game-panel">
                <div class="game-header">
                    <button class="back-btn" onclick="app.goHome()">← 返回地图</button>
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                    <div class="score-badge" id="scoreBadge">⭐ 0</div>
                </div>

                <div class="question-card">
                    <svg class="mascot" viewBox="0 0 100 100">
                        <circle cx="50" cy="55" r="40" fill="#FFB7C5"/>
                        <circle cx="35" cy="48" r="5" fill="#4A4A68"/>
                        <circle cx="65" cy="48" r="5" fill="#4A4A68"/>
                        <ellipse cx="50" cy="65" rx="10" ry="6" fill="#FF8FAB"/>
                        <circle cx="22" cy="35" r="10" fill="#4A4A68" opacity="0.2"/>
                        <circle cx="78" cy="35" r="10" fill="#4A4A68" opacity="0.2"/>
                        <path d="M30,25 Q20,10 35,15" stroke="#4A4A68" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M70,25 Q80,10 65,15" stroke="#4A4A68" stroke-width="3" fill="none" stroke-linecap="round"/>
                    </svg>
                    <p class="question-hint" id="questionHint">请选出正确的拼音</p>
                    <div class="pinyin-display" id="pinyinDisplay">b</div>
                    <div class="word-image" id="wordImage"></div>
                </div>

                <div class="options-grid" id="optionsGrid"></div>
                <div class="feedback-msg" id="feedbackMsg"></div>
            </div>
        </section>

        <footer>
            <p>每天练习10分钟，拼音进步看得见 ✨</p>
        </footer>
    </div>

    <!-- Level Complete Modal -->
    <div class="modal-overlay" id="completeModal">
        <div class="modal">
            <div class="modal-emoji" id="modalEmoji">🎉</div>
            <h2 id="modalTitle">闯关成功！</h2>
            <p id="modalDesc">你真棒，拼音小勇士！</p>
            <div class="modal-stars" id="modalStars">⭐⭐⭐</div>
            <p id="modalScore">得分：0</p>
            <div>
                <button class="btn-primary" onclick="app.goHome()">继续闯关</button>
                <button class="btn-secondary" onclick="app.replayLevel()">再玩一次</button>
            </div>
        </div>
    </div>

    <div class="confetti-container" id="confettiContainer"></div>

    <script>
        const levels = [
            {
                id: 1,
                title: '声母城堡',
                desc: '认识声母 b p m f',
                icon: '🏰',
                theme: '#FFB7C5',
                questions: [
                    { pinyin: 'b', answer: 'b', options: ['b', 'p', 'm', 'f'], emoji: '🍌', hint: '这是哪个声母？' },
                    { pinyin: 'p', answer: 'p', options: ['b', 'p', 'd', 'q'], emoji: '🍇', hint: '请选出对应的声母' },
                    { pinyin: 'm', answer: 'm', options: ['n', 'm', 'f', 'h'], emoji: '🐴', hint: '听音选拼音' },
                    { pinyin: 'f', answer: 'f', options: ['t', 'f', 'h', 'l'], emoji: '🌬️', hint: '这个字母怎么读？' },
                    { pinyin: 'd', answer: 'd', options: ['b', 'd', 'p', 'q'], emoji: '🥁', hint: '找出正确声母' }
                ]
            },
            {
                id: 2,
                title: '韵母花园',
                desc: '学习单韵母 a o e i u ü',
                icon: '🌸',
                theme: '#95E1D3',
                questions: [
                    { pinyin: 'a', answer: 'a', options: ['a', 'o', 'e', 'i'], emoji: '👩', hint: '张大嘴巴 aaa' },
                    { pinyin: 'o', answer: 'o', options: ['u', 'o', 'e', 'ü'], emoji: '🥚', hint: '圆圆嘴巴 ooo' },
                    { pinyin: 'e', answer: 'e', options: ['a', 'i', 'e', 'u'], emoji: '🦢', hint: '扁扁嘴巴 eee' },
                    { pinyin: 'i', answer: 'i', options: ['ü', 'i', 'u', 'o'], emoji: '👕', hint: '牙齿对齐 iii' },
                    { pinyin: 'u', answer: 'u', options: ['o', 'ü', 'u', 'e'], emoji: '🌧️', hint: '突出嘴巴 uuu' }
                ]
            },
            {
                id: 3,
                title: '音节森林',
                desc: '拼读简单音节',
                icon: '🌲',
                theme: '#A8D8EA',
                questions: [
                    { pinyin: 'ba', answer: 'ba', options: ['ba', 'pa', 'ma', 'fa'], emoji: '🎒', hint: 'b + a = ?' },
                    { pinyin: 'ma', answer: 'ma', options: ['mo', 'ma', 'mi', 'mu'], emoji: '👩', hint: 'm + a = ?' },
                    { pinyin: 'he', answer: 'he', options: ['ha', 'he', 'hu', 'hi'], emoji: '🦩', hint: 'h + e = ?' },
                    { pinyin: 'ni', answer: 'ni', options: ['nu', 'ni', 'na', 'ne'], emoji: '👋', hint: 'n + i = ?' },
                    { pinyin: 'gu', answer: 'gu', options: ['ga', 'ge', 'gu', 'guo'], emoji: '🥁', hint: 'g + u = ?' }
                ]
            },
            {
                id: 4,
                title: '声调山谷',
                desc: '认识四个声调',
                icon: '⛰️',
                theme: '#FFE66D',
                questions: [
                    { pinyin: 'ā', answer: 'ā', tone: 1, options: ['ā', 'á', 'ǎ', 'à'], emoji: '📢', hint: '第一声，高高平' },
                    { pinyin: 'á', answer: 'á', tone: 2, options: ['ā', 'á', 'ǎ', 'à'], emoji: '⬆️', hint: '第二声，向上扬' },
                    { pinyin: 'ǎ', answer: 'ǎ', tone: 3, options: ['ā', 'á', 'ǎ', 'à'], emoji: '〰️', hint: '第三声，拐个弯' },
                    { pinyin: 'à', answer: 'à', tone: 4, options: ['ā', 'á', 'ǎ', 'à'], emoji: '⬇️', hint: '第四声，向下落' },
                    { pinyin: 'mā', answer: 'mā', tone: 1, options: ['mā', 'má', 'mǎ', 'mà'], emoji: '👩', hint: '妈妈怎么读？' }
                ]
            },
            {
                id: 5,
                title: '拼音王国',
                desc: '综合挑战大闯关',
                icon: '👑',
                theme: '#D4A5FF',
                questions: [
                    { pinyin: 'xiǎo māo', answer: 'xiǎo māo', options: ['xiǎo māo', 'xiǎo gǒu', 'xiǎo niǎo', 'xiǎo yú'], emoji: '🐱', hint: '这是什么动物？' },
                    { pinyin: 'tài yáng', answer: 'tài yáng', options: ['yuè liang', 'tài yáng', 'xīng xing', 'tiān kōng'], emoji: '☀️', hint: '白天发光的是？' },
                    { pinyin: 'hóng sè', answer: 'hóng sè', options: ['lán sè', 'hóng sè', 'huáng sè', 'lǜ sè'], emoji: '🍎', hint: '苹果是什么颜色？' },
                    { pinyin: 'xuě huā', answer: 'xuě huā', options: ['yǔ diǎn', 'xuě huā', 'bīng kuài', 'shuǐ dī'], emoji: '❄️', hint: '冬天天上飘下什么？' },
                    { pinyin: 'lǎo shī', answer: 'lǔ shī', options: ['lǎo shī', 'tóng xué', 'mā ma', 'yī shēng'], emoji: '👩‍🏫', hint: '在学校教书的是？' }
                ]
            }
        ];

        // Fix typo in question data
        levels[4].questions[4].answer = 'lǎo shī';

        class PinyinGame {
            constructor() {
                this.currentLevel = null;
                this.currentQuestion = 0;
                this.score = 0;
                this.stars = 0;
                this.progress = JSON.parse(localStorage.getItem('pinyinProgress') || '{}');
                this.init();
            }

            init() {
                this.renderLevelMap();
            }

            saveProgress() {
                localStorage.setItem('pinyinProgress', JSON.stringify(this.progress));
            }

            isUnlocked(levelId) {
                if (levelId === 1) return true;
                return (this.progress[levelId - 1] || 0) > 0;
            }

            renderLevelMap() {
                const map = document.getElementById('levelMap');
                map.innerHTML = levels.map(level => {
                    const unlocked = this.isUnlocked(level.id);
                    const stars = this.progress[level.id] || 0;
                    return `
                        <div class="level-card level-${level.id} ${unlocked ? '' : 'locked'}" 
                             onclick="${unlocked ? `app.startLevel(${level.id})` : ''}">
                            <div class="level-icon">${level.icon}</div>
                            <div class="level-title">${level.title}</div>
                            <div class="level-desc">${level.desc}</div>
                            <div class="stars">
                                ${unlocked ? this.renderStars(stars) : '🔒'}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            renderStars(count) {
                return Array(3).fill(0).map((_, i) => 
                    `<span class="star ${i < count ? '' : 'empty'}">⭐</span>`
                ).join('');
            }

            startLevel(levelId) {
                this.currentLevel = levels.find(l => l.id === levelId);
                this.currentQuestion = 0;
                this.score = 0;
                document.getElementById('levelScreen').classList.remove('active');
                document.getElementById('gameScreen').classList.add('active');
                this.renderQuestion();
            }

            renderQuestion() {
                const q = this.currentLevel.questions[this.currentQuestion];
                const total = this.currentLevel.questions.length;
                
                document.getElementById('progressFill').style.width = `${(this.currentQuestion / total) * 100}%`;
                document.getElementById('scoreBadge').textContent = `⭐ ${this.score}`;
                document.getElementById('questionHint').textContent = q.hint;
                document.getElementById('pinyinDisplay').textContent = q.pinyin;
                document.getElementById('pinyinDisplay').className = 'pinyin-display' + (q.tone ? ` tone-${q.tone}` : '');
                document.getElementById('wordImage').textContent = q.emoji || '';
                document.getElementById('feedbackMsg').className = 'feedback-msg';
                document.getElementById('feedbackMsg').textContent = '';

                const grid = document.getElementById('optionsGrid');
                grid.innerHTML = q.options.map(opt => 
                    `<button class="option-btn" onclick="app.checkAnswer('${opt}', this)">${opt}</button>`
                ).join('');

                this.speak(q.pinyin);
            }

            checkAnswer(selected, btn) {
                const q = this.currentLevel.questions[this.currentQuestion];
                const buttons = document.querySelectorAll('.option-btn');
                buttons.forEach(b => b.disabled = true);

                const feedback = document.getElementById('feedbackMsg');
                feedback.classList.add('show');

                if (selected === q.answer) {
                    btn.classList.add('correct');
                    feedback.textContent = '答对啦！太棒了！🎉';
                    feedback.classList.add('correct');
                    this.score += 10;
                    document.getElementById('scoreBadge').textContent = `⭐ ${this.score}`;
                    this.playSound('correct');
                    
                    setTimeout(() => this.nextQuestion(), 1200);
                } else {
                    btn.classList.add('wrong');
                    feedback.textContent = '再想一想哦～💪';
                    feedback.classList.add('wrong');
                    this.playSound('wrong');
                    
                    // Show correct answer
                    buttons.forEach(b => {
                        if (b.textContent === q.answer) b.classList.add('correct');
                    });
                    
                    setTimeout(() => this.nextQuestion(), 1800);
                }
            }

            nextQuestion() {
                this.currentQuestion++;
                if (this.currentQuestion < this.currentLevel.questions.length) {
                    this.renderQuestion();
                } else {
                    this.completeLevel();
                }
            }

            completeLevel() {
                const total = this.currentLevel.questions.length * 10;
                this.stars = this.score >= total * 0.9 ? 3 : this.score >= total * 0.6 ? 2 : 1;
                
                const currentBest = this.progress[this.currentLevel.id] || 0;
                if (this.stars > currentBest) {
                    this.progress[this.currentLevel.id] = this.stars;
                    this.saveProgress();
                }

                document.getElementById('modalTitle').textContent = '闯关成功！';
                document.getElementById('modalDesc').textContent = `你完成了「${this.currentLevel.title}」`;
                document.getElementById('modalStars').innerHTML = this.renderStars(this.stars);
                document.getElementById('modalScore').textContent = `得分：${this.score}`;
                document.getElementById('modalEmoji').textContent = this.stars === 3 ? '🏆' : this.stars === 2 ? '🌟' : '🎈';
                
                document.getElementById('completeModal').classList.add('show');
                this.fireConfetti();
                this.playSound('win');
            }

            goHome() {
                document.getElementById('gameScreen').classList.remove('active');
                document.getElementById('completeModal').classList.remove('show');
                document.getElementById('levelScreen').classList.add('active');
                this.renderLevelMap();
            }

            replayLevel() {
                document.getElementById('completeModal').classList.remove('show');
                this.startLevel(this.currentLevel.id);
            }

            speak(text) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utter = new SpeechSynthesisUtterance(text);
                    utter.lang = 'zh-CN';
                    utter.rate = 0.85;
                    utter.pitch = 1.1;
                    window.speechSynthesis.speak(utter);
                }
            }

            playSound(type) {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContext) return;
                    const ctx = new AudioContext();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    if (type === 'correct') {
                        osc.frequency.setValueAtTime(523, ctx.currentTime);
                        osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
                        osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
                        gain.gain.setValueAtTime(0.15, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                        osc.start(ctx.currentTime);
                        osc.stop(ctx.currentTime + 0.4);
                    } else if (type === 'wrong') {
                        osc.frequency.setValueAtTime(300, ctx.currentTime);
                        osc.frequency.linearRampToValueAtTime(200, ctx.currentTime + 0.3);
                        gain.gain.setValueAtTime(0.15, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                        osc.start(ctx.currentTime);
                        osc.stop(ctx.currentTime + 0.3);
                    } else if (type === 'win') {
                        [523, 659, 784, 1047].forEach((freq, i) => {
                            const o = ctx.createOscillator();
                            const g = ctx.createGain();
                            o.connect(g);
                            g.connect(ctx.destination);
                            o.frequency.value = freq;
                            g.gain.setValueAtTime(0.1, ctx.currentTime + i * 0.12);
                            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.12 + 0.3);
                            o.start(ctx.currentTime + i * 0.12);
                            o.stop(ctx.currentTime + i * 0.12 + 0.3);
                        });
                    }
                } catch (e) {}
            }

            fireConfetti() {
                const container = document.getElementById('confettiContainer');
                container.innerHTML = '';
                const colors = ['#FFB7C5', '#FFE66D', '#95E1D3', '#A8D8EA', '#D4A5FF', '#FFC078'];
                
                for (let i = 0; i < 60; i++) {
                    const conf = document.createElement('div');
                    conf.className = 'confetti';
                    conf.style.left = Math.random() * 100 + 'vw';
                    conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    conf.style.animationDuration = (2.5 + Math.random() * 1.5) + 's';
                    conf.style.animationDelay = Math.random() * 0.5 + 's';
                    conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    container.appendChild(conf);
                }

                setTimeout(() => container.innerHTML = '', 4000);
            }
        }

        const app = new PinyinGame();
    </script>
</body>
</html>
