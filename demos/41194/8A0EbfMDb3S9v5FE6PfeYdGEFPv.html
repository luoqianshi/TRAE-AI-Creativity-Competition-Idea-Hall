<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>智能穿搭推荐</title>

  <!--
    内嵌 Tailwind 风格原子类 CSS
    说明：为满足“单文件、无外部资源”，此处内嵌本页面所需的 Tailwind 风格工具类
  -->
  <style>
    /* 基础重置 */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
      color: #1f2933;
      background:
        radial-gradient(circle at top left, rgba(201, 218, 230, 0.35), transparent 32%),
        linear-gradient(180deg, #fbf7ef 0%, #f6f1e8 52%, #eef4f7 100%);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* Tailwind 风格工具类 */
    .min-h-screen { min-height: 100vh; }
    .w-full { width: 100%; }
    .max-w-md { max-width: 28rem; }
    .mx-auto { margin-left: auto; margin-right: auto; }

    .relative { position: relative; }
    .fixed { position: fixed; }
    .top-0 { top: 0; }
    .bottom-0 { bottom: 0; }
    .left-0 { left: 0; }
    .right-0 { right: 0; }
    .z-20 { z-index: 20; }

    .flex { display: flex; }
    .grid { display: grid; }
    .items-center { align-items: center; }
    .items-start { align-items: flex-start; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 0.5rem; }
    .gap-3 { gap: 0.75rem; }
    .gap-4 { gap: 1rem; }
    .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .overflow-hidden { overflow: hidden; }

    .px-1 { padding-left: 0.25rem; padding-right: 0.25rem; }
    .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .px-5 { padding-left: 1.25rem; padding-right: 1.25rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .pt-24 { padding-top: 6rem; }
    .pb-28 { padding-bottom: 7rem; }
    .p-3 { padding: 0.75rem; }
    .p-4 { padding: 1rem; }
    .p-5 { padding: 1.25rem; }

    .mt-1 { margin-top: 0.25rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mt-3 { margin-top: 0.75rem; }
    .mt-4 { margin-top: 1rem; }
    .mt-5 { margin-top: 1.25rem; }
    .mb-2 { margin-bottom: 0.5rem; }

    .h-2 { height: 0.5rem; }
    .h-4 { height: 1rem; }
    .h-5 { height: 1.25rem; }
    .h-10 { height: 2.5rem; }
    .h-12 { height: 3rem; }
    .h-24 { height: 6rem; }
    .h-36 { height: 9rem; }
    .w-2 { width: 0.5rem; }
    .w-4 { width: 1rem; }
    .w-5 { width: 1.25rem; }
    .w-10 { width: 2.5rem; }
    .w-12 { width: 3rem; }
    .w-24 { width: 6rem; }

    .flex-1 { flex: 1 1 0%; }
    .rounded-full { border-radius: 9999px; }
    .rounded-3xl { border-radius: 1.5rem; }
    .rounded-2rem { border-radius: 2rem; }

    .border { border-width: 1px; border-style: solid; }
    .border-white-60 { border-color: rgba(255, 255, 255, 0.6); }
    .border-blue-20 { border-color: rgba(122, 146, 163, 0.2); }

    .bg-white-50 { background-color: rgba(255, 255, 255, 0.5); }
    .bg-white-65 { background-color: rgba(255, 255, 255, 0.65); }
    .bg-blue { background-color: #7a92a3; }
    .bg-blue-10 { background-color: rgba(122, 146, 163, 0.1); }
    .bg-blue-15 { background-color: rgba(122, 146, 163, 0.15); }
    .bg-blue-20 { background-color: rgba(122, 146, 163, 0.2); }

    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .text-base { font-size: 1rem; line-height: 1.5rem; }
    .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
    .text-xl { font-size: 1.25rem; line-height: 1.75rem; }

    .font-medium { font-weight: 500; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }

    .text-primary { color: #1f2933; }
    .text-muted { color: #7d8791; }
    .text-blue { color: #6f8798; }
    .text-white { color: #ffffff; }

    .tracking-tight { letter-spacing: -0.025em; }
    .leading-none { line-height: 1; }

    .shadow-soft {
      box-shadow:
        0 16px 40px rgba(122, 146, 163, 0.14),
        0 4px 14px rgba(143, 121, 94, 0.08);
    }

    .shadow-button {
      box-shadow:
        0 12px 24px rgba(122, 146, 163, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .safe-top {
      padding-top: max(0.75rem, env(safe-area-inset-top));
    }

    .safe-bottom {
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
    }

    .transition {
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background-color 0.2s ease;
    }

    .active-scale:active {
      transform: scale(0.97);
    }

    /* 页面专用结构 */
    .app-shell {
      min-height: 100vh;
      padding-left: 1rem;
      padding-right: 1rem;
    }

    .ios-glass {
      background: rgba(251, 247, 239, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.58);
      box-shadow: 0 8px 28px rgba(122, 146, 163, 0.12);
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
    }

    .placeholder-line {
      border-radius: 9999px;
      background: linear-gradient(
        90deg,
        rgba(122, 146, 163, 0.12),
        rgba(255, 255, 255, 0.58),
        rgba(122, 146, 163, 0.12)
      );
    }

    @media (min-width: 430px) {
      .app-shell {
        padding-left: 1.25rem;
        padding-right: 1.25rem;
      }
    }
  </style>
</head>

<body>
  <!-- 页面根容器 -->
  <main class="relative min-h-screen w-full max-w-md mx-auto app-shell pt-24 pb-28">

    <!-- 顶部 iOS 毛玻璃导航栏 -->
    <header class="fixed top-0 left-0 right-0 z-20 safe-top px-4">
      <nav class="max-w-md mx-auto ios-glass rounded-2rem px-5 py-3 flex items-center justify-between">
        <!-- 左侧标题区 -->
        <section class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-blue-15 flex items-center justify-center">
            <div class="w-4 h-4 rounded-full bg-blue"></div>
          </div>

          <div>
            <p class="text-xs text-muted leading-none">今日穿搭</p>
            <h1 class="text-lg font-semibold tracking-tight text-primary mt-1">智能推荐</h1>
          </div>
        </section>

        <!-- 右侧设置入口占位 -->
        <button class="w-10 h-10 rounded-full bg-white-65 border border-white-60 shadow-soft flex items-center justify-center transition active-scale" aria-label="打开设置">
          <span class="w-5 h-5 rounded-full bg-blue-20"></span>
        </button>
      </nav>
    </header>

    <!-- 中部筛选区域容器 -->
    <section class="ios-glass rounded-2rem p-5 shadow-soft">
      <!-- 筛选区域标题 -->
      <div class="flex items-center justify-between mb-2">
        <div>
          <h2 class="text-xl font-bold tracking-tight text-primary">筛选偏好</h2>
          <p class="text-sm text-muted mt-1">选择场景、天气与风格</p>
        </div>

        <span class="text-xs font-medium text-blue bg-blue-10 rounded-full px-3 py-2">基础骨架</span>
      </div>

      <!-- 筛选控件网格 -->
      <div class="grid grid-cols-2 gap-3 mt-5">
        <!-- 场景筛选占位 -->
        <button class="rounded-3xl bg-white-65 border border-white-60 p-4 shadow-soft transition active-scale">
          <div class="flex items-center justify-between">
            <span class="text-sm font-semibold text-primary">场景</span>
            <span class="w-2 h-2 rounded-full bg-blue"></span>
          </div>
          <div class="placeholder-line h-2 w-full mt-4"></div>
          <div class="placeholder-line h-2 w-full mt-2"></div>
        </button>

        <!-- 天气筛选占位 -->
        <button class="rounded-3xl bg-white-65 border border-white-60 p-4 shadow-soft transition active-scale">
          <div class="flex items-center justify-between">
            <span class="text-sm font-semibold text-primary">天气</span>
            <span class="w-2 h-2 rounded-full bg-blue"></span>
          </div>
          <div class="placeholder-line h-2 w-full mt-4"></div>
          <div class="placeholder-line h-2 w-full mt-2"></div>
        </button>

        <!-- 风格筛选占位 -->
        <button class="rounded-3xl bg-white-65 border border-white-60 p-4 shadow-soft transition active-scale">
          <div class="flex items-center justify-between">
            <span class="text-sm font-semibold text-primary">风格</span>
            <span class="w-2 h-2 rounded-full bg-blue"></span>
          </div>
          <div class="placeholder-line h-2 w-full mt-4"></div>
          <div class="placeholder-line h-2 w-full mt-2"></div>
        </button>

        <!-- 色系筛选占位 -->
        <button class="rounded-3xl bg-white-65 border border-white-60 p-4 shadow-soft transition active-scale">
          <div class="flex items-center justify-between">
            <span class="text-sm font-semibold text-primary">色系</span>
            <span class="w-2 h-2 rounded-full bg-blue"></span>
          </div>
          <div class="placeholder-line h-2 w-full mt-4"></div>
          <div class="placeholder-line h-2 w-full mt-2"></div>
        </button>
      </div>
    </section>

    <!-- 穿搭卡片占位容器 -->
    <section class="mt-5">
      <!-- 区域标题 -->
      <div class="flex items-center justify-between px-1">
        <div>
          <h2 class="text-base font-semibold text-primary">推荐结果</h2>
          <p class="text-sm text-muted mt-1">此处预留穿搭卡片列表</p>
        </div>

        <span class="text-xs text-blue bg-white-50 rounded-full px-3 py-2">待生成</span>
      </div>

      <!-- 主卡片占位 -->
      <article class="ios-glass rounded-2rem p-4 shadow-soft mt-4 overflow-hidden">
        <!-- 图片 / 视觉区占位 -->
        <div class="h-36 rounded-3xl bg-blue-10 border border-blue-20 flex items-center justify-center">
          <div class="w-12 h-12 rounded-full bg-white-65 shadow-soft"></div>
        </div>

        <!-- 文案骨架占位 -->
        <div class="mt-4">
          <div class="placeholder-line h-4 w-full"></div>
          <div class="placeholder-line h-4 w-full mt-3"></div>
          <div class="placeholder-line h-2 w-full mt-4"></div>
          <div class="placeholder-line h-2 w-full mt-2"></div>
        </div>

        <!-- 标签占位 -->
        <div class="flex items-center gap-2 mt-4">
          <span class="h-10 rounded-full bg-blue-10 px-5"></span>
          <span class="h-10 rounded-full bg-white-65 px-5"></span>
          <span class="h-10 rounded-full bg-white-65 px-5"></span>
        </div>
      </article>

      <!-- 次级卡片占位 -->
      <article class="rounded-2rem bg-white-50 border border-white-60 p-4 shadow-soft mt-4">
        <div class="flex items-start gap-4">
          <div class="w-24 h-24 rounded-3xl bg-blue-10"></div>

          <div class="flex-1">
            <div class="placeholder-line h-4 w-full"></div>
            <div class="placeholder-line h-4 w-full mt-3"></div>
            <div class="placeholder-line h-2 w-full mt-4"></div>
            <div class="placeholder-line h-2 w-full mt-2"></div>
          </div>
        </div>
      </article>
    </section>

    <!-- 底部功能按钮区 -->
    <footer class="fixed bottom-0 left-0 right-0 z-20 safe-bottom px-4">
      <section class="max-w-md mx-auto ios-glass rounded-2rem p-3 flex items-center gap-3">
        <!-- 次要功能按钮 -->
        <button class="w-12 h-12 rounded-full bg-white-65 border border-white-60 flex items-center justify-center shadow-soft transition active-scale" aria-label="保存偏好">
          <span class="w-5 h-5 rounded-full bg-blue-20"></span>
        </button>

        <!-- 主功能按钮 -->
        <button class="flex-1 h-12 rounded-full bg-blue text-white text-base font-semibold shadow-button transition active-scale">
          生成穿搭
        </button>

        <!-- 次要功能按钮 -->
        <button class="w-12 h-12 rounded-full bg-white-65 border border-white-60 flex items-center justify-center shadow-soft transition active-scale" aria-label="查看历史">
          <span class="w-5 h-5 rounded-full bg-blue-20"></span>
        </button>
      </section>
    </footer>
  </main>
</body>
</html>
