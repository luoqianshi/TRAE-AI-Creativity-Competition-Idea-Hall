<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PutIn 工作台</title>
    <style>
      :root {
        --sidebar: #10251d;
        --sidebar-soft: #244f40;
        --green: #13724f;
        --mint: #5bd59a;
        --text: #0f1714;
        --muted: #738079;
        --line: #dbe3df;
        --bg: #f3f6f5;
        --card: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC",
          Arial, sans-serif;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 250px 1fr;
      }

      .sidebar {
        background: var(--sidebar);
        color: #d9eee6;
        padding: 19px 15px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 4px 34px;
      }

      .brand-mark {
        width: 39px;
        height: 39px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: var(--mint);
        color: var(--sidebar);
        font-size: 20px;
        font-weight: 800;
      }

      .brand strong,
      .brand span {
        display: block;
      }

      .brand strong {
        color: white;
        font-size: 17px;
        line-height: 1.1;
      }

      .brand span {
        margin-top: 4px;
        color: #a9c1b8;
        font-size: 12px;
      }

      .nav {
        display: grid;
        gap: 5px;
      }

      .nav-item {
        height: 46px;
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 0 13px;
        border-radius: 6px;
        color: #b8cbc4;
        font-size: 15px;
        font-weight: 650;
      }

      .nav-item.active {
        background: var(--sidebar-soft);
        color: #fff;
      }

      .nav svg {
        width: 19px;
        height: 19px;
        stroke-width: 2;
        color: currentColor;
      }

      .main {
        min-width: 0;
        background: var(--bg);
      }

      .topbar {
        height: 71px;
        border-bottom: 1px solid var(--line);
        background: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 25px 0 33px;
      }

      .page-title {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .page-title h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.02em;
      }

      .page-title span {
        color: var(--muted);
        font-size: 12px;
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      .button {
        height: 42px;
        border: 1px solid #d2ddd8;
        border-radius: 7px;
        padding: 0 17px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        background: white;
        color: #26352f;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }

      .button.primary {
        border-color: var(--green);
        background: var(--green);
        color: white;
      }

      .button svg {
        width: 18px;
        height: 18px;
      }

      .content {
        max-width: 626px;
        padding: 35px 0 40px 33px;
      }

      .hero {
        position: relative;
        min-height: 173px;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: #0d8055;
        font-size: 12px;
        font-weight: 800;
      }

      .hero h2 {
        width: 330px;
        margin: 0;
        font-size: 28px;
        line-height: 1.18;
        letter-spacing: -0.04em;
      }

      .hero p {
        width: 360px;
        margin: 12px 0 0;
        color: #66746e;
        font-size: 14px;
        line-height: 1.7;
      }

      .hero-actions {
        position: absolute;
        right: 0;
        top: 103px;
        display: flex;
        gap: 10px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 13px;
        margin-top: 1px;
      }

      .stat-card {
        min-height: 128px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        padding: 19px 19px 17px;
      }

      .stat-top {
        display: flex;
        align-items: center;
        gap: 13px;
        color: #6e7b75;
        font-size: 14px;
        line-height: 1.35;
      }

      .icon-box {
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        border-radius: 8px;
        display: grid;
        place-items: center;
      }

      .icon-box svg {
        width: 20px;
        height: 20px;
      }

      .mint {
        background: #dff4eb;
        color: #16885c;
      }

      .amber {
        background: #f7ebcc;
        color: #9d6919;
      }

      .blue {
        background: #dfeef8;
        color: #2f77aa;
      }

      .violet {
        background: #ece1fb;
        color: #7c56b7;
      }

      .stat-number {
        margin-top: 13px;
        font-size: 32px;
        line-height: 1;
        font-weight: 850;
        letter-spacing: -0.05em;
      }

      .panel {
        margin-top: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        min-height: 96px;
        padding: 23px 23px;
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .panel small {
        display: block;
        color: #177650;
        font-size: 12px;
        font-weight: 800;
        margin-bottom: 5px;
      }

      .panel h3 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.03em;
      }

      .link {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #177650;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }

      .link svg {
        width: 15px;
        height: 15px;
      }

      @media (max-width: 760px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          display: none;
        }

        .topbar {
          height: auto;
          padding: 16px;
          align-items: flex-start;
          gap: 12px;
          flex-direction: column;
        }

        .actions,
        .hero-actions {
          position: static;
          flex-wrap: wrap;
        }

        .content {
          max-width: none;
          padding: 24px 16px;
        }

        .hero h2,
        .hero p {
          width: auto;
        }

        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">P</div>
          <div>
            <strong>PutIn</strong>
            <span>求职工作台</span>
          </div>
        </div>

        <nav class="nav" aria-label="主导航">
          <div class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>
            工作台
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
            简历库
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m12 3 1.6 4.7L18 9.2l-4.4 1.6L12 15l-1.6-4.2L6 9.2l4.4-1.5z"/><path d="m19 15 .8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
            简历优化
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="5" width="16" height="6" rx="1.5"/><path d="M4 15h7v4H4zM15 15h5v4h-5z"/></svg>
            模板库
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="7" width="16" height="12" rx="2"/><path d="M9 7V5h6v2M4 12h16"/></svg>
            岗位池
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 20V9M12 20V4M19 20v-7"/><path d="M3 20h18"/></svg>
            投递进度
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="8" width="14" height="10" rx="2"/><path d="M9 8V5h6v3M9 13h.01M15 13h.01M12 18v3"/></svg>
            自动化
          </div>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="page-title">
            <h1>工作台</h1>
            <span>当前使用：苗怡飞-简历(1)</span>
          </div>
          <div class="actions">
            <a href="#" class="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/></svg>
              上传简历
            </a>
            <a href="#" class="button primary">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
              添加岗位
            </a>
          </div>
        </header>

        <section class="content">
          <div class="hero">
            <p class="eyebrow">今日求职进度</p>
            <h2>把合适的岗位，放到最前面。</h2>
            <p>先维护真实简历，再分析岗位并生成沟通草稿。所有发送动作由你最终确认。</p>
            <div class="hero-actions">
              <a href="#" class="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/></svg>
                管理简历
              </a>
              <a href="#" class="button primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
                录入岗位
              </a>
            </div>
          </div>

          <div class="stats">
            <article class="stat-card">
              <div class="stat-top">
                <span class="icon-box mint">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
                </span>
                <span>简历版<br />本</span>
              </div>
              <div class="stat-number">01</div>
            </article>

            <article class="stat-card">
              <div class="stat-top">
                <span class="icon-box amber">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="7" width="16" height="12" rx="2"/><path d="M9 7V5h6v2M4 12h16"/></svg>
                </span>
                <span>岗位池</span>
              </div>
              <div class="stat-number">00</div>
            </article>

            <article class="stat-card">
              <div class="stat-top">
                <span class="icon-box blue">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 6h14v10H8l-3 3z"/><path d="M8 10h8M8 13h6"/></svg>
                </span>
                <span>已沟通</span>
              </div>
              <div class="stat-number">00</div>
            </article>

            <article class="stat-card">
              <div class="stat-top">
                <span class="icon-box violet">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
                </span>
                <span>进入面<br />试</span>
              </div>
              <div class="stat-number">00</div>
            </article>
          </div>

          <section class="panel">
            <div class="panel-head">
              <div>
                <small>优先队列</small>
                <h3>值得先沟通的岗位</h3>
              </div>
              <a class="link" href="#">
                查看全部
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m9 18 6-6-6-6"/></svg>
              </a>
            </div>
          </section>
        </section>
      </main>
    </div>
  </body>
</html>
