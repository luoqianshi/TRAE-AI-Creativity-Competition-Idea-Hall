<body>
  <div class="app-container">
    <!-- Header -->
    <div class="header">
      <h1>🤖 AI自律伙伴</h1>
      <p>您的智能健康生活助手，记录每一天的进步</p>
      <div class="date-display" id="currentDate"></div>

    <!-- Navigation -->

      <button class="nav-tab active" data-section="record">
        <span>📝</span> 数据记录
      </button>
      <button class="nav-tab" data-section="plan">
        <span>🎯</span> AI计划
      </button>
      <button class="nav-tab" data-section="stats">
        <span>📊</span> 数据统计
      </button>

        <span>📋</span> 历史记录
      </button>
    </div>

    <!-- Section: Data Record -->
    <div class="section active" id="section-record">
      <!-- Exercise Record -->
      <div class="card">
        <div class="card-title">
          <span class="icon">🏃</span>
          运动记录
        </div>
        <div class="time-slots" id="exerciseTimeSlots">
          <button class="time-slot-btn active" data-time="morning">🌅 早晨</button>
          <button class="time-slot-btn" data-time="noon">☀️ 中午</button>
          <button class="time-slot-btn" data-time="evening">🌙 晚上</button>
        </div>
        <div class="form-group">
          <label class="form-label">运动类型</label>
          <select class="form-select" id="exerciseType">
            <option value="">请选择运动类型</option>
            <option value="跑步">🏃 跑步</option>
            <option value="游泳">🏊 游泳</option>
            <option value="骑行">🚴 骑行</option>
            <option value="健身">💪 健身</option>
            <option value="瑜伽">🧘 瑜伽</option>
            <option value="散步">🚶 散步</option>
            <option value="球类">⚽ 球类运动</option>
            <option value="其他">✨ 其他</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">运动时长（分钟）</label>
          <input type="number" class="form-input" id="exerciseDuration" placeholder="例如：30" min="1">

        <div class="form-group">
          <label class="form-label">消耗热量（千卡，可选）</label>
          <input type="number" class="form-input" id="exerciseCalories" placeholder="例如：200" min="1">
        </div>
        <div class="form-group">
          <label class="form-label">备注</label>
          <textarea class="form-textarea" id="exerciseNote" placeholder="记录运动感受..."></textarea>

        <button class="btn btn-primary" onclick="saveExercise()">
          <span>💾</span> 保存运动记录
        </button>

      <!-- Diet Record -->
      <div class="card">
        <div class="card-title">
          <span class="icon">🍽️</span>
          饮食记录

        <div class="time-slots" id="dietTimeSlots">
          <button class="time-slot-btn active" data-time="morning">🌅 早餐</button>
          <button class="time-slot-btn" data-time="noon">☀️ 午餐</button>
          <button class="time-slot-btn" data-time="evening">🌙 晚餐</button>
        </div>
        <div class="form-group">
          <label class="form-label">食物内容</label>
          <textarea class="form-textarea" id="dietContent" placeholder="记录您吃了什么..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">摄入热量（千卡，可选）</label>
          <input type="number" class="form-input" id="dietCalories" placeholder="例如：500" min="1">
        </div>
        <div class="form-group">
          <label class="form-label">饮水量（毫升）</label>
          <input type="number" class="form-input" id="waterIntake" placeholder="例如：500" min="0">
        </div>
        <button class="btn btn-primary" onclick="saveDiet()">
          <span>💾</span> 保存饮食记录
        </button>
      </div>

      <!-- Weight Record -->
      <div class="card">
        <div class="card-title">
          <span class="icon">⚖️</span>
          体重记录
        </div>
        <div class="time-slots" id="weightTimeSlots">
          <button class="time-slot-btn active" data-time="morning">🌅 晨起</button>
          <button class="time-slot-btn" data-time="noon">☀️ 午间</button>
          <button class="time-slot-btn" data-time="evening">🌙 晚间</button>
        </div>
        <div class="form-group">
          <label class="form-label">体重（公斤）</label>
          <input type="number" class="form-input" id="weightValue" placeholder="例如：65.5" step="0.1" min="1">
        </div>
        <div class="form-group">
          <label class="form-label">体脂率（%，可选）</label>
          <input type="number" class="form-input" id="bodyFat" placeholder="例如：20.5" step="0.1" min="1">
        </div>
        <button class="btn btn-primary" onclick="saveWeight()">
          <span>💾</span> 保存体重记录
        </button>

    <!-- Section: AI Plan -->
    <div class="section" id="section-plan">
      <div class="card">
        <div class="card-title">
          <span class="icon">🤖</span>
          AI智能计划生成
        </div>
        <p style="color: var(--muted); margin-bottom: 1rem; font-size: 0.9rem;">
          基于您的身体数据和目标，AI将为您生成个性化的饮食食谱和运动计划。
        </p>
        <div class="form-group">
          <label class="form-label">您的健康目标</label>
          <select class="form-select" id="healthGoal">
            <option value="lose_weight">减重减脂</option>
            <option value="maintain">保持健康</option>
            <option value="gain_muscle">增肌塑形</option>
            <option value="improve_endurance">提升耐力</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">饮食偏好</label>
          <select class="form-select" id="dietPreference">
            <option value="balanced">均衡饮食</option>
            <option value="low_carb">低碳水</option>
            <option value="high_protein">高蛋白</option>
            <option value="vegetarian">素食</option>
            <option value="light">清淡饮食</option>
          </select>
        </div>
        <div class="btn-group">
          <button class="btn btn-success" onclick="generateDietPlan()">
            <span>🥗</span> 生成今日食谱
          </button>
          <button class="btn btn-success" onclick="generateExercisePlan()">
            <span>🏃</span> 生成运动计划
          </button>
        </div>
      </div>

      <div class="loading" id="planLoading">
        <div class="spinner"></div>
        <p>AI正在为您制定专属计划...</p>
      </div>

      <div id="dietPlanResult"></div>
      <div id="exercisePlanResult"></div>
    </div>

    <!-- Section: Stats -->
    <div class="section" id="section-stats">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="statExercise">0</div>
          <div class="stat-label">今日运动（分钟）</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statCalories" style="color: var(--accent3)">0</div>
          <div class="stat-label">今日摄入（千卡）</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statWeight" style="color: var(--accent4)">--</div>
          <div class="stat-label">最新体重（kg）</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statWater" style="color: var(--accent2)">0</div>
          <div class="stat-label">今日饮水（ml）</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span class="icon">📈</span>
          体重变化趋势
        </div>
        <div class="chart-container" id="weightChart"></div>
      </div>

      <div class="card">
        <div class="card-title">
          <span class="icon">🔥</span>
          运动统计
        </div>
        <div class="chart-container" id="exerciseChart"></div>
      </div>

      <div class="card">
        <div class="card-title">
          <span class="icon">🍎</span>
          热量摄入趋势
        </div>
        <div class="chart-container" id="calorieChart"></div>
      </div>
    </div>

    <!-- Section: History -->
    <div class="section" id="section-history">
      <div class="card">
        <div class="card-title">
          <span class="icon">📋</span>
          今日记录
        </div>
        <div id="todayRecords">
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <p>今天还没有记录哦，快去添加吧！</p>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span class="icon">📅</span>
          历史记录
        </div>
        <div class="form-group">
          <label class="form-label">选择日期</label>
          <input type="date" class="form-input" id="historyDate" onchange="loadHistory()">
        </div>
        <div id="historyRecords">
          <div class="empty-state">
            <div class="empty-state-icon">📅</div>
            <p>选择日期查看历史记录</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==================== Data Management ====================
    const StorageKey = 'aiHealthBuddy';
    let currentData = loadData();
    let currentExerciseTime = 'morning';
    let currentDietTime = 'morning';
    let currentWeightTime = 'morning';

    function loadData() {
      const data = localStorage.getItem(StorageKey);
      return data ? JSON.parse(data) : {};
    }

    function saveData() {
      localStorage.setItem(StorageKey, JSON.stringify(currentData));
    }

    function getToday() {
      return new Date().toISOString().split('T')[0];
    }

    function getTodayData() {
      const today = getToday();
      if (!currentData[today]) {
        currentData[today] = { exercise: {}, diet: {}, weight: {} };
      }
      return currentData[today];
    }

    // ==================== UI Initialization ====================
    function init() {
      document.getElementById('currentDate').textContent = formatDate(new Date());
      document.getElementById('historyDate').value = getToday();

      // Nav tabs
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById(`section-${tab.dataset.section}`).classList.add('active');
          if (tab.dataset.section === 'stats') updateStats();
          if (tab.dataset.section === 'history') loadTodayRecords();
        });
      });

      // Time slots
      setupTimeSlots('exerciseTimeSlots', time => currentExerciseTime = time);
      setupTimeSlots('dietTimeSlots', time => currentDietTime = time);
      setupTimeSlots('weightTimeSlots', time => currentWeightTime = time);

      updateStats();
    }

    function setupTimeSlots(containerId, callback) {
      const container = document.getElementById(containerId);
      container.querySelectorAll('.time-slot-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          container.querySelectorAll('.time-slot-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          callback(btn.dataset.time);
        });
      });
    }

    function formatDate(date) {
      const d = new Date(date);
      const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${weekDays[d.getDay()]}`;
    }

    // ==================== Save Functions ====================
    function saveExercise() {
      const type = document.getElementById('exerciseType').value;
      const duration = document.getElementById('exerciseDuration').value;

    function updateStats() {
      const today = getToday();
      const todayData = currentData[today] || { exercise: {}, diet: {}, weight: {} };

      // Exercise stats
      let totalExercise = 0;
      let totalExerciseCalories = 0;
      Object.values(todayData.exercise).forEach(e => {
        totalExercise += e.duration || 0;
        totalExerciseCalories += e.calories || 0;
      });
      document.getElementById('statExercise').textContent = totalExercise;

      // Diet stats
      let totalCalories = 0;
      let totalWater = 0;
      Object.values(todayData.diet).forEach(d => {
        totalCalories += d.calories || 0;
        totalWater += d.water || 0;
      });
      document.getElementById('statCalories').textContent = totalCalories;
      document.getElementById('statWater').textContent = totalWater;

      // Weight stats
      let latestWeight = '--';
      const weightEntries = Object.values(todayData.weight);
      if (weightEntries.length > 0) {
        latestWeight = weightEntries[weightEntries.length - 1].weight;
      } else {
        // Find latest weight from history
        const dates = Object.keys(currentData).sort().reverse();
        for (const date of dates) {
          const w = Object.values(currentData[date].weight || {});
          if (w.length > 0) {
            latestWeight = w[w.length - 1].weight;
            break;
          }
        }
      }
      document.getElementById('statWeight').textContent = latestWeight;

      updateCharts();
    }

      const date = document.getElementById('historyDate').value;
      displayRecords(date, 'historyRecords');
    }

    function displayRecords(date, containerId) {
      const data = currentData[date];
      const container = document.getElementById(containerId);

      if (!data) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <p>该日期暂无记录</p>
          </div>
        `;
        return;
      }

      let html = '<div class="data-list">';

      // Exercise
      Object.entries(data.exercise || {}).forEach(([time, record]) => {
        const timeLabels = { morning: '早晨', noon: '中午', evening: '晚上' };
        html += `
          <div class="data-item">
            <div class="data-item-info">
              <h4><span class="tag tag-exercise">运动</span> ${timeLabels[time]} - ${record.type}</h4>
              <p>${record.time} ${record.note ? '| ' + record.note : ''}</p>
            </div>
            <div class="data-item-value">${record.duration}分钟</div>
          </div>
        `;
      });

      // Diet
      Object.entries(data.diet || {}).forEach(([time, record]) => {
        const timeLabels = { morning: '早餐', noon: '午餐', evening: '晚餐' };
        html += `
          <div class="data-item">
            <div class="data-item-info">
              <h4><span class="tag tag-diet">饮食</span> ${timeLabels[time]}</h4>
              <p>${record.time} | ${record.content}</p>
            </div>
            <div class="data-item-value diet">${record.calories || '--'}千卡</div>
          </div>
        `;
      });

      // Weight
      Object.entries(data.weight || {}).forEach(([time, record]) => {
        const timeLabels = { morning: '晨起', noon: '午间', evening: '晚间' };
        html += `
          <div class="data-item">
            <div class="data-item-info">
              <h4><span class="tag tag-weight">体重</span> ${timeLabels[time]}</h4>
              <p>${record.time} ${record.bodyFat ? '| 体脂率: ' + record.bodyFat + '%' : ''}</p>
            </div>
            <div class="data-item-value weight">${record.weight}kg</div>
          </div>
        `;
      });

      html += '</div>';
      container.innerHTML = html;
    }

    // ==================== Init ====================
    init();
  </script>
</body>
</html>
