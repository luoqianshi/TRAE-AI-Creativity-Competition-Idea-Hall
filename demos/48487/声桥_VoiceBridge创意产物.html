<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声桥 VoiceBridge — 让每一个声音都值得被听见</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            200: '#b9dffd',
                            300: '#7cc5fd',
                            400: '#36a9fa',
                            500: '#0c8ee9',
                            600: '#0172c7',
                            700: '#015ba1',
                            800: '#064d85',
                            900: '#0b416e',
                        },
                        warm: {
                            50: '#fff8f1',
                            100: '#ffefdb',
                            200: '#ffdbb3',
                            300: '#ffc18a',
                            400: '#ff9f57',
                            500: '#f97d2a',
                            600: '#e05f10',
                            700: '#ba4810',
                            800: '#953a17',
                            900: '#7a3218',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: #0a0f1a;
            color: #e8ecf4;
            overflow-x: hidden;
        }

        /* 粒子背景 */
        .particles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(100, 180, 255, 0.4) 0%, transparent 70%);
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.3; }
            25% { transform: translateY(-100px) translateX(50px) scale(1.2); opacity: 0.6; }
            50% { transform: translateY(-50px) translateX(-30px) scale(0.8); opacity: 0.4; }
            75% { transform: translateY(-150px) translateX(20px) scale(1.1); opacity: 0.5; }
        }

        /* 渐变流体背景 */
        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: orbFloat 15s infinite ease-in-out;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
        }

        /* 扫描线效果 */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(100, 180, 255, 0.3), transparent);
            animation: scan 6s infinite linear;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* 声波动画 */
        .sound-wave {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 30px;
        }

        .sound-wave-bar {
            width: 3px;
            background: linear-gradient(to top, #0c8ee9, #36a9fa);
            border-radius: 2px;
            animation: wave 1s infinite ease-in-out;
        }

        .sound-wave-bar:nth-child(1) { animation-delay: 0s; height: 20%; }
        .sound-wave-bar:nth-child(2) { animation-delay: 0.1s; height: 40%; }
        .sound-wave-bar:nth-child(3) { animation-delay: 0.2s; height: 60%; }
        .sound-wave-bar:nth-child(4) { animation-delay: 0.3s; height: 80%; }
        .sound-wave-bar:nth-child(5) { animation-delay: 0.4s; height: 100%; }
        .sound-wave-bar:nth-child(6) { animation-delay: 0.5s; height: 80%; }
        .sound-wave-bar:nth-child(7) { animation-delay: 0.6s; height: 60%; }
        .sound-wave-bar:nth-child(8) { animation-delay: 0.7s; height: 40%; }
        .sound-wave-bar:nth-child(9) { animation-delay: 0.8s; height: 20%; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); opacity: 0.6; }
            50% { transform: scaleY(1); opacity: 1; }
        }

        /* 呼吸光环 */
        .pulse-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(100, 180, 255, 0.3);
            animation: pulse 3s infinite ease-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* 文字渐变 */
        .text-gradient {
            background: linear-gradient(135deg, #e8ecf4 0%, #7cc5fd 50%, #36a9fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .text-gradient-warm {
            background: linear-gradient(135deg, #ffdbb3 0%, #ff9f57 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 卡片悬浮效果 */
        .hover-lift {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hover-lift:hover {
            transform: translateY(-8px);
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.4);
        }

        /* 玻璃拟态 */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .glass-strong {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0f1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e3a5f;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #2a4a6f;
        }

        /* 导航栏 */
        .nav-blur {
            background: rgba(10, 15, 26, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 按钮发光 */
        .btn-glow {
            position: relative;
            overflow: hidden;
        }

        .btn-glow::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #0c8ee9, #36a9fa, #7cc5fd, #0c8ee9);
            border-radius: inherit;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-glow:hover::before {
            opacity: 1;
        }

        /* 打字机效果 */
        .typing-cursor::after {
            content: '|';
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* 网格背景 */
        .grid-bg {
            background-image: 
                linear-gradient(rgba(100, 180, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(100, 180, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* 圆形进度 */
        .circle-progress {
            transform: rotate(-90deg);
        }

        .circle-progress circle {
            transition: stroke-dashoffset 0.5s ease;
        }

        /* 语音波形 */
        .voice-wave {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 40px;
        }

        .voice-wave span {
            width: 3px;
            background: linear-gradient(to top, #0c8ee9, #36a9fa);
            border-radius: 2px;
            animation: voiceWave 0.5s infinite ease-in-out alternate;
        }

        .voice-wave span:nth-child(1) { animation-delay: 0.0s; }
        .voice-wave span:nth-child(2) { animation-delay: 0.1s; }
        .voice-wave span:nth-child(3) { animation-delay: 0.2s; }
        .voice-wave span:nth-child(4) { animation-delay: 0.3s; }
        .voice-wave span:nth-child(5) { animation-delay: 0.4s; }
        .voice-wave span:nth-child(6) { animation-delay: 0.5s; }
        .voice-wave span:nth-child(7) { animation-delay: 0.6s; }
        .voice-wave span:nth-child(8) { animation-delay: 0.7s; }
        .voice-wave span:nth-child(9) { animation-delay: 0.8s; }
        .voice-wave span:nth-child(10) { animation-delay: 0.9s; }
        .voice-wave span:nth-child(11) { animation-delay: 1.0s; }
        .voice-wave span:nth-child(12) { animation-delay: 1.1s; }
        .voice-wave span:nth-child(13) { animation-delay: 1.2s; }
        .voice-wave span:nth-child(14) { animation-delay: 1.3s; }
        .voice-wave span:nth-child(15) { animation-delay: 1.4s; }
        .voice-wave span:nth-child(16) { animation-delay: 1.5s; }
        .voice-wave span:nth-child(17) { animation-delay: 1.6s; }
        .voice-wave span:nth-child(18) { animation-delay: 1.7s; }
        .voice-wave span:nth-child(19) { animation-delay: 1.8s; }
        .voice-wave span:nth-child(20) { animation-delay: 1.9s; }

        @keyframes voiceWave {
            0% { height: 5px; opacity: 0.4; }
            100% { height: 35px; opacity: 1; }
        }

        /* 脉冲动画 */
        .animate-pulse-slow {
            animation: pulseSlow 3s infinite ease-in-out;
        }

        @keyframes pulseSlow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* 淡入上移动画 */
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 连接线 */
        .connector-line {
            position: relative;
        }

        .connector-line::before {
            content: '';
            position: absolute;
            left: 50%;
            top: -40px;
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, transparent, rgba(100, 180, 255, 0.3));
        }

        /* 装饰圆环 */
        .deco-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(100, 180, 255, 0.15);
            animation: rotateRing 20s linear infinite;
            pointer-events: none;
        }

        .deco-ring-inner {
            position: absolute;
            border-radius: 50%;
            border: 1px dashed rgba(100, 180, 255, 0.1);
            animation: rotateRing 15s linear infinite reverse;
            pointer-events: none;
        }

        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 装饰菱形 */
        .deco-diamond {
            position: absolute;
            width: 12px;
            height: 12px;
            border: 1px solid rgba(100, 180, 255, 0.2);
            transform: rotate(45deg);
            animation: pulseDiamond 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulseDiamond {
            0%, 100% { opacity: 0.3; transform: rotate(45deg) scale(1); }
            50% { opacity: 0.7; transform: rotate(45deg) scale(1.3); }
        }

        /* 装饰十字 */
        .deco-cross {
            position: absolute;
            width: 16px;
            height: 16px;
            pointer-events: none;
        }

        .deco-cross::before,
        .deco-cross::after {
            content: '';
            position: absolute;
            background: rgba(100, 180, 255, 0.2);
        }

        .deco-cross::before {
            width: 100%;
            height: 1px;
            top: 50%;
            left: 0;
        }

        .deco-cross::after {
            width: 1px;
            height: 100%;
            left: 50%;
            top: 0;
        }

        /* 发光脉冲点 */
        .deco-glow-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(100, 180, 255, 0.5);
            box-shadow: 0 0 12px rgba(100, 180, 255, 0.3);
            animation: glowPulse 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* 浮动线条装饰 */
        .deco-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(100, 180, 255, 0.15), transparent);
            pointer-events: none;
        }


    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const { motion, AnimatePresence } = window.Motion;

        // 粒子背景组件
        const ParticleBackground = () => {
            const particles = Array.from({ length: 30 }, (_, i) => ({
                id: i,
                size: Math.random() * 200 + 50,
                left: Math.random() * 100,
                top: Math.random() * 100,
                duration: Math.random() * 15 + 15,
                delay: Math.random() * 10,
            }));

            return (
                <div className="particles-container">
                    {particles.map((p) => (
                        <div
                            key={p.id}
                            className="particle"
                            style={{
                                width: p.size,
                                height: p.size,
                                left: `${p.left}%`,
                                top: `${p.top}%`,
                                animationDuration: `${p.duration}s`,
                                animationDelay: `${p.delay}s`,
                            }}
                        />
                    ))}
                    <div 
                        className="gradient-orb"
                        style={{
                            width: 600,
                            height: 600,
                            background: 'radial-gradient(circle, rgba(12, 142, 233, 0.2) 0%, transparent 70%)',
                            top: '10%',
                            left: '-10%',
                        }}
                    />
                    <div 
                        className="gradient-orb"
                        style={{
                            width: 500,
                            height: 500,
                            background: 'radial-gradient(circle, rgba(255, 159, 87, 0.1) 0%, transparent 70%)',
                            bottom: '10%',
                            right: '-5%',
                            animationDelay: '5s',
                        }}
                    />
                    <div 
                        className="gradient-orb"
                        style={{
                            width: 400,
                            height: 400,
                            background: 'radial-gradient(circle, rgba(100, 180, 255, 0.15) 0%, transparent 70%)',
                            top: '50%',
                            right: '20%',
                            animationDelay: '8s',
                        }}
                    />
                    <div className="scan-line" />
                </div>
            );
        };

        // 区块装饰背景组件（轻量级粒子 + 光球）
        const SectionDecoration = ({ colorTheme = 'blue', particleCount = 12 }) => {
            const colors = {
                blue: { particle: 'rgba(100, 180, 255, 0.25)', orb1: 'rgba(12, 142, 233, 0.12)', orb2: 'rgba(100, 180, 255, 0.08)' },
                warm: { particle: 'rgba(255, 159, 87, 0.25)', orb1: 'rgba(255, 159, 87, 0.1)', orb2: 'rgba(255, 200, 130, 0.06)' },
                purple: { particle: 'rgba(180, 140, 255, 0.2)', orb1: 'rgba(139, 92, 246, 0.1)', orb2: 'rgba(180, 140, 255, 0.06)' },
            };
            const theme = colors[colorTheme] || colors.blue;

            const particles = Array.from({ length: particleCount }, (_, i) => ({
                id: i,
                size: Math.random() * 120 + 30,
                left: Math.random() * 100,
                top: Math.random() * 100,
                duration: Math.random() * 12 + 18,
                delay: Math.random() * 8,
            }));

            return (
                <div className="particles-container" style={{ pointerEvents: 'none' }}>
                    {particles.map((p) => (
                        <div
                            key={p.id}
                            className="particle"
                            style={{
                                width: p.size,
                                height: p.size,
                                left: `${p.left}%`,
                                top: `${p.top}%`,
                                animationDuration: `${p.duration}s`,
                                animationDelay: `${p.delay}s`,
                                background: `radial-gradient(circle, ${theme.particle} 0%, transparent 70%)`,
                            }}
                        />
                    ))}
                    <div 
                        className="gradient-orb"
                        style={{
                            width: 400,
                            height: 400,
                            background: `radial-gradient(circle, ${theme.orb1} 0%, transparent 70%)`,
                            top: '5%',
                            left: '-5%',
                            animationDelay: '2s',
                        }}
                    />
                    <div 
                        className="gradient-orb"
                        style={{
                            width: 350,
                            height: 350,
                            background: `radial-gradient(circle, ${theme.orb2} 0%, transparent 70%)`,
                            bottom: '5%',
                            right: '-3%',
                            animationDelay: '6s',
                        }}
                    />
                    {/* 浮动光点 */}
                    {[...Array(5)].map((_, i) => (
                        <motion.div
                            key={`glow-${i}`}
                            className="absolute rounded-full"
                            style={{
                                width: Math.random() * 6 + 2,
                                height: Math.random() * 6 + 2,
                                background: theme.particle,
                                boxShadow: `0 0 ${Math.random() * 20 + 10}px ${theme.particle}`,
                                left: `${Math.random() * 90 + 5}%`,
                                top: `${Math.random() * 90 + 5}%`,
                            }}
                            animate={{
                                y: [0, -30, 0],
                                opacity: [0.3, 0.8, 0.3],
                            }}
                            transition={{
                                duration: Math.random() * 4 + 4,
                                repeat: Infinity,
                                ease: 'easeInOut',
                                delay: Math.random() * 3,
                            }}
                        />
                    ))}
                </div>
            );
        };

        // 导航栏组件
        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                }
            };

            return (
                <motion.nav
                    initial={{ y: -100 }}
                    animate={{ y: 0 }}
                    transition={{ duration: 0.8, ease: 'easeOut' }}
                    className={`fixed top-0 left-0 right-0 z-50 transition-all duration-500 ${
                        scrolled ? 'nav-blur py-4' : 'py-6'
                    }`}
                >
                    <div className="max-w-[1700px] mx-auto px-8 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                    <line x1="12" y1="19" x2="12" y2="22"/>
                                </svg>
                            </div>
                            <span className="text-xl font-bold text-white tracking-tight">
                                声桥 <span className="font-light text-brand-300">VoiceBridge</span>
                            </span>
                        </div>

                        <div className="hidden md:flex items-center gap-10">
                            {[
                                { label: '首页', id: 'hero' },
                                { label: '项目介绍', id: 'intro' },
                                { label: '目标用户', id: 'users' },
                                { label: '价值意义', id: 'value' },
                                { label: '功能演示', id: 'demo' },
                            ].map((item) => (
                                <button
                                    key={item.id}
                                    onClick={() => scrollToSection(item.id)}
                                    className="text-sm text-slate-400 hover:text-white transition-colors duration-300 tracking-wide"
                                >
                                    {item.label}
                                </button>
                            ))}
                        </div>

                        <button
                            onClick={() => scrollToSection('contact')}
                            className="px-6 py-2.5 rounded-lg bg-gradient-to-r from-brand-500 to-brand-600 text-white text-sm font-medium hover:from-brand-400 hover:to-brand-500 transition-all duration-300 hover:shadow-lg hover:shadow-brand-500/25"
                        >
                            联系我们
                        </button>
                    </div>
                </motion.nav>
            );
        };

        // Hero 区域
        const HeroSection = () => {
            const [typedText, setTypedText] = useState('');
            const fullText = '让每一个声音都值得被听见';

            useEffect(() => {
                let index = 0;
                const timer = setInterval(() => {
                    if (index <= fullText.length) {
                        setTypedText(fullText.slice(0, index));
                        index++;
                    } else {
                        clearInterval(timer);
                    }
                }, 100);
                return () => clearInterval(timer);
            }, []);

            return (
                <section id="hero" className="relative min-h-screen flex items-center justify-center overflow-hidden">
                    <ParticleBackground />
                    
                    <div className="relative z-10 max-w-[1700px] mx-auto px-8 py-32 w-full">
                        <div className="grid lg:grid-cols-2 gap-16 items-center">
                            <motion.div
                                initial={{ opacity: 0, x: -50 }}
                                animate={{ opacity: 1, x: 0 }}
                                transition={{ duration: 1, delay: 0.3 }}
                            >
                                <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full glass-strong mb-8">
                                    <span className="w-2 h-2 rounded-full bg-brand-400 animate-pulse" />
                                    <span className="text-sm text-brand-300 font-medium">社会服务 / 社会公益</span>
                                </div>

                                <h1 className="text-6xl lg:text-7xl font-black text-white leading-tight mb-6 tracking-tight">
