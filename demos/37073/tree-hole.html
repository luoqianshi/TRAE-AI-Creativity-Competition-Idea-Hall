<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>树洞 · 情绪自留地</title>
<style>
  /* ========================
     【可自由修改区】配色方案
     ======================== */
  :root {
    --bg-1: #f5f0eb;
    --bg-2: #e8ecf1;
    --bg-3: #efe7ea;
    --text-main: #5a5248;
    --text-soft: #8a8278;
    --card-bg: rgba(255, 255, 255, 0.55);
    --card-border: rgba(180, 170, 160, 0.25);
    --accent: #c9b8a8;
    --accent-hover: #b8a593;
    --textarea-bg: rgba(255, 255, 255, 0.7);
    --shadow: 0 8px 32px rgba(140, 130, 120, 0.12);
    /* 种子颜色 */
    --seed-color: #d4c4b0;
    --seed-inner: #e8dcd0;
    /* 土壤分层色 */
    --soil-1: #d8c8b0;  /* 表土 */
    --soil-2: #c4b299;  /* 浅层 */
    --soil-3: #a89483;  /* 深层 */
  }

  [data-theme="dark"] {
    --bg-1: #2a2825;
    --bg-2: #32353a;
    --bg-3: #3a2f34;
    --text-main: #d9d2c7;
    --text-soft: #a8a096;
    --card-bg: rgba(60, 55, 50, 0.55);
    --card-border: rgba(120, 110, 100, 0.3);
    --accent: #8a7a68;
    --accent-hover: #a0907c;
    --textarea-bg: rgba(50, 45, 40, 0.6);
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    --seed-color: #6a5d50;
    --seed-inner: #4a4238;
    --soil-1: #3a352f;
    --soil-2: #2e2a25;
    --soil-3: #221f1b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    color: var(--text-main);
    background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), var(--bg-1));
    background-size: 400% 400%;
    animation: bgShift 20s ease infinite;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* 背景浮动微光 */
  .floating-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }
  .orb-1 {
    width: 300px; height: 300px;
    background: rgba(230, 215, 200, 0.6);
    top: -80px; left: -80px;
    animation: float1 18s ease-in-out infinite;
  }
  .orb-2 {
    width: 240px; height: 240px;
    background: rgba(200, 210, 225, 0.55);
    bottom: -60px; right: -60px;
    animation: float2 22s ease-in-out infinite;
  }
  .orb-3 {
    width: 180px; height: 180px;
    background: rgba(230, 210, 215, 0.5);
    top: 40%; right: 15%;
    animation: float1 25s ease-in-out infinite;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(40px, 60px) scale(1.1); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-50px, -40px) scale(1.08); }
  }

  /* 主题切换按钮 */
  .theme-toggle {
    position: fixed;
    top: 24px;
    right: 24px;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--text-main);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    z-index: 10;
    box-shadow: var(--shadow);
  }
  .theme-toggle:hover { transform: translateY(-2px); }

  /* ===== 树洞主舞台（可整体变换） ===== */
  .stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  /* 树洞卡片 */
  .tree-hole {
    position: relative;
    width: 100%;
    max-width: 520px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 48px 40px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: var(--shadow);
    transition: transform 1.2s cubic-bezier(0.65, 0, 0.35, 1),
                opacity 1.2s ease,
                border-radius 1.2s ease;
    transform-origin: center center;
  }

  /* 树洞孔洞装饰（开口 + 内部阴影） */
  .hole-shape {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 60px;
    height: 80px;
    background: rgba(0, 0, 0, 0.15);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    transition: transform 0.6s ease;
    z-index: 5;
    box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.3);
  }
  .tree-hole.hole-open .hole-shape {
    transform: translate(-50%, -50%) scale(1);
  }

  /* 闭合动画 - 树洞收缩成种子 */
  .tree-hole.closing {
    transform: scale(0.05);
    opacity: 0.3;
    border-radius: 50%;
  }

  /* 重新打开动画 - 新树洞展开 */
  .tree-hole.opening {
    animation: holeOpen 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes holeOpen {
    0% { transform: scale(0.05); opacity: 0; border-radius: 50%; }
    50% { transform: scale(0.7); opacity: 0.8; border-radius: 30%; }
    80% { transform: scale(1.05); opacity: 1; border-radius: 22%; }
    100% { transform: scale(1); opacity: 1; border-radius: 24px; }
  }

  /* 卡片内容在闭合时淡出 */
  .tree-hole-content {
    transition: opacity 0.4s ease;
  }
  .tree-hole.closing .tree-hole-content,
  .tree-hole.opening .tree-hole-content {
    opacity: 0;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 标题区 */
  .title {
    text-align: center;
    margin-bottom: 32px;
  }
  .title h1 {
    font-size: 26px;
    font-weight: 300;
    letter-spacing: 6px;
    margin-bottom: 10px;
  }
  .title .subtitle {
    font-size: 13px;
    color: var(--text-soft);
    letter-spacing: 2px;
    font-weight: 300;
  }

  .divider {
    width: 24px;
    height: 1px;
    background: var(--text-soft);
    opacity: 0.4;
    margin: 0 auto 28px;
  }

  /* 文本输入框 */
  textarea {
    width: 100%;
    min-height: 180px;
    padding: 18px 20px;
    border: 1px solid var(--card-border);
    border-radius: 16px;
    background: var(--textarea-bg);
    color: var(--text-main);
    font-size: 15px;
    line-height: 1.8;
    font-family: inherit;
    font-weight: 300;
    resize: vertical;
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  textarea::placeholder {
    color: var(--text-soft);
    font-weight: 300;
    letter-spacing: 1px;
  }
  textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(201, 184, 168, 0.15);
  }

  /* 按钮区 */
  .btn-group {
    margin-top: 24px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    padding: 12px 28px;
    border: 1px solid var(--card-border);
    border-radius: 999px;
    background: transparent;
    color: var(--text-main);
    font-size: 14px;
    letter-spacing: 2px;
    font-family: inherit;
    font-weight: 300;
    cursor: pointer;
    transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    box-shadow: 0 6px 16px rgba(180, 165, 147, 0.3);
  }
  .btn-secondary:hover {
    background: var(--textarea-bg);
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .footer-tip {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    color: var(--text-soft);
    letter-spacing: 1px;
    font-weight: 300;
    line-height: 1.8;
  }
  .scroll-hint {
    margin-top: 8px;
    color: var(--text-soft);
    opacity: 0.7;
    font-size: 11px;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.95);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: var(--text-main);
    padding: 24px 36px;
    border-radius: 18px;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 2px;
    line-height: 1.8;
    text-align: center;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s ease;
    max-width: 80vw;
    z-index: 100;
    white-space: pre-line;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* ================================
     【核心】种子动画系统
     ================================ */
  .seed {
    position: fixed;
    width: 16px;
    height: 22px;
    pointer-events: none;
    z-index: 60;
    background: var(--seed-color);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    box-shadow:
      inset -3px -3px 6px rgba(0, 0, 0, 0.15),
      inset 2px 2px 4px rgba(255, 255, 255, 0.3);
    opacity: 0;
  }
  .seed::after {
    content: '';
    position: absolute;
    top: 4px;
    left: 4px;
    width: 6px;
    height: 8px;
    background: var(--seed-inner);
    border-radius: 50%;
    opacity: 0.6;
  }

  /* 种子从树洞落下 */
  @keyframes seedDrop {
    0%   { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    30%  { opacity: 1; transform: translateY(40px) scale(1.05) rotate(180deg); }
    60%  { opacity: 1; transform: translateY(120px) scale(0.95) rotate(360deg); }
    85%  { opacity: 0.6; transform: translateY(180px) scale(0.7) rotate(500deg); }
    100% { opacity: 0; transform: translateY(220px) scale(0.4) rotate(540deg); }
  }

  /* 种子轻弹（入土反馈） */
  @keyframes seedBounce {
    0%   { transform: translateY(0) scale(0.4); opacity: 0; }
    40%  { transform: translateY(-20px) scale(0.6); opacity: 1; }
    70%  { transform: translateY(0) scale(0.5); opacity: 1; }
    85%  { transform: translateY(-6px) scale(0.5); opacity: 0.8; }
    100% { transform: translateY(0) scale(0.45); opacity: 0; }
  }

  /* 尘土微动 */
  @keyframes dustFloat {
    0%   { transform: translate(0, 0) scale(0.5); opacity: 0; }
    30%  { opacity: 0.6; }
    100% { transform: translate(var(--dx), -30px) scale(1.2); opacity: 0; }
  }

  .seed-anim-drop {
    animation: seedDrop 1.5s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards;
  }
  .seed-anim-bounce {
    animation: seedBounce 1.2s ease-out forwards;
  }
  .dust {
    position: fixed;
    width: 4px;
    height: 4px;
    background: var(--text-soft);
    border-radius: 50%;
    pointer-events: none;
    z-index: 55;
    opacity: 0;
  }
  .dust-anim {
    animation: dustFloat 1.2s ease-out forwards;
  }

  /* ================================
     【核心】土地剖面视图
     ================================ */
  .soil-view {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: 5;
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transform: translateY(100%);
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease;
  }
  .soil-view.active {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  /* 地表（上方） */
  .ground-surface {
    height: 30vh;
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--soil-1) 100%);
    position: relative;
    overflow: hidden;
  }
  .ground-surface::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: rgba(0, 0, 0, 0.1);
  }
  /* 地表小草装饰 */
  .grass {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* 土壤剖面（下方分层） */
  .soil-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .soil-layer {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .soil-layer-1 { background: var(--soil-1); }
  .soil-layer-2 { background: var(--soil-2); }
  .soil-layer-3 { background: var(--soil-3); }
  /* 土层分隔线 */
  .soil-layer::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 1px;
    background: rgba(0, 0, 0, 0.08);
  }
  .soil-layer-3::before {
    background: rgba(0, 0, 0, 0.3);
  }

  /* 种子在土层中 */
  .seed-bed {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* 去掉 flex，改用纯绝对定位容器 */
    padding: 20px 30px;
  }

  .buried-seed {
    position: absolute;
    width: 14px;
    height: 20px;
    background: var(--seed-color);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    box-shadow:
      inset -2px -2px 4px rgba(0, 0, 0, 0.2),
      inset 1px 1px 3px rgba(255, 255, 255, 0.2);
    cursor: pointer;
    transition: transform 0.4s ease, filter 0.3s ease;
    animation: seedAppear 0.6s ease-out backwards;
  }
  .buried-seed::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 5px;
    height: 7px;
    background: var(--seed-inner);
    border-radius: 50%;
    opacity: 0.5;
  }
  .buried-seed:hover {
    transform: scale(1.6);
    filter: brightness(1.1);
    z-index: 10;
  }
  @keyframes seedAppear {
    from { opacity: 0; transform: scale(0.3); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* ================================
     【核心】全局 tooltip 层（Portal 模式）
     使用 fixed 定位，基于视口坐标，不受任何祖先层叠上下文影响
     ================================ */
  .global-tooltip-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    /* 全局最高层级 */
    z-index: 9999;
    pointer-events: none;
  }

  /* 全局 tooltip 本身 */
  .global-seed-tooltip {
    position: fixed;
    /* 位置由 JS 动态设置（基于种子在视口中的位置） */
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 14px;
    padding: 12px 18px;
    min-width: 200px;
    max-width: 280px;
    box-shadow: var(--shadow);
    /* 默认在种子正上方；具体坐标由 JS 设置 */
    transform: translate(-50%, calc(-100% - 18px)) scale(0.9);
    transform-origin: 50% 100%;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    /* 兜底层级 */
    z-index: 9999;
    overflow: visible;
    contain: none;
  }
  .global-seed-tooltip.show {
    opacity: 1;
    transform: translate(-50%, calc(-100% - 18px)) scale(1);
  }
  /* tooltip 小三角（指向种子） */
  .global-seed-tooltip::after {
    content: '';
    position: absolute;
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 12px;
    height: 12px;
    background: var(--card-bg);
    border-right: 1px solid var(--card-border);
    border-bottom: 1px solid var(--card-border);
  }
  .global-seed-tooltip .tt-time {
    font-size: 11px;
    color: var(--text-soft);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .global-seed-tooltip .tt-content {
    font-size: 13px;
    color: var(--text-main);
    line-height: 1.6;
    font-weight: 300;
    word-break: break-word;
    white-space: pre-wrap;
  }

  /* 土地视图顶部提示 */
  .soil-hint {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 12px;
    color: var(--text-soft);
    letter-spacing: 2px;
    z-index: 10;
    box-shadow: var(--shadow);
    animation: fadeInHint 1s ease 0.5s backwards;
  }
  @keyframes fadeInHint {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* 响应式 */
  @media (max-width: 560px) {
    .tree-hole { padding: 36px 24px; }
    .title h1 { font-size: 22px; letter-spacing: 4px; }
    textarea { min-height: 160px; font-size: 14px; }
    .btn { padding: 10px 22px; font-size: 13px; }
    .seed-bed { padding: 20px; gap: 14px; }
    .seed-tooltip { min-width: 160px; max-width: 220px; }
  }
</style>
</head>
<body>

  <!-- 背景浮动微光 -->
  <div class="floating-orb orb-1"></div>
  <div class="floating-orb orb-2"></div>
  <div class="floating-orb orb-3"></div>

  <!-- 主题切换按钮 -->
  <button class="theme-toggle" id="themeToggle" title="切换浅/深色模式">☾</button>

  <!-- 树洞主舞台 -->
  <div class="stage" id="stage">
    <div class="tree-hole" id="treeHole">
      <!-- 孔洞装饰 -->
      <div class="hole-shape"></div>

      <div class="tree-hole-content" id="holeContent">
        <div class="title">
          <h1>树 洞</h1>
          <p class="subtitle">一个安静的情绪自留地</p>
        </div>

        <div class="divider"></div>

        <textarea
          id="holeInput"
          placeholder="在这里写下你的心事、烦恼或碎碎念&#10;&#10;说完就会被温柔接住，不会被任何人看到。"
        ></textarea>

        <div class="btn-group">
          <button class="btn btn-primary" id="submitBtn">把心事说给树洞</button>
          <button class="btn btn-secondary" id="clearBtn">清空文字</button>
        </div>

        <p class="footer-tip">
          输入内容仅在本地存储 · 完全私密<br>
          按 Enter 一键提交（Shift + Enter 换行）
        </p>
        <p class="footer-tip scroll-hint">⇣ 下滑页面可查看土地里的种子 ⇣</p>
      </div>
    </div>
  </div>

  <!-- 土地剖面视图 -->
  <div class="soil-view" id="soilView">
    <!-- 地表 -->
    <div class="ground-surface">
      <div class="grass"></div>
      <div class="soil-hint">⇡ 上滑返回树洞 · 悬停种子查看心事</div>
    </div>
    <!-- 土壤分层 -->
    <div class="soil-section">
      <div class="soil-layer soil-layer-1">
        <div class="seed-bed" id="seedBed1"></div>
      </div>
      <div class="soil-layer soil-layer-2">
        <div class="seed-bed" id="seedBed2"></div>
      </div>
      <div class="soil-layer soil-layer-3">
        <div class="seed-bed" id="seedBed3"></div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- 全局 tooltip 层（Portal 模式：脱离祖先层叠上下文，确保永远在最上层） -->
  <div class="global-tooltip-layer" id="globalTooltipLayer" aria-hidden="true"></div>

<script>
  /* ========================
     【可自由修改区】文案
     ======================== */
  const healingWords = [
    "树洞认真听完啦，辛苦了。",
    "你的情绪被好好接住了，没关系的。",
    "愿意说出来，已经很勇敢了。",
    "深呼吸，世界依然温柔。",
    "你已经做得很好了，真的。",
    "烦恼暂时放下吧，先抱抱自己。",
    "这里只有你，和安静。",
    "每一个情绪，都值得被看见。",
    "不着急，慢慢来。",
    "今晚可以好好休息了。",
    "被理解，是一种温柔的治愈。",
    "你不是一个人，树洞在听。",
    "把烦恼交给风吧。",
    "今天的你，也辛苦了。",
    "心里的话，说出来就轻了。"
  ];

  const emptyWords = [
    "先写下一点点心事，再说给树洞听吧～",
    "树洞在等你说点什么呢。",
    "哪怕一个字也可以呀。",
    "别急，慢慢写，树洞会等。"
  ];

  const seedSuccessWords = [
    "树洞闭合，化作种子，埋进土里。",
    "心事变成种子，安静地躺在这里了。",
    "种子落地生根，你的心事被温柔收藏。",
    "新的种子种下，又一个心事被接住。",
    "好哒，种子已种下，等它慢慢治愈你。"
  ];

  const newHoleWords = [
    "一棵新的树洞，静静长出来啦。",
    "新树洞打开了，准备好倾听下一段心事。",
    "又是一个全新的开始。",
    "你回来了呀，新树洞准备好了。"
  ];

  // DOM
  const input            = document.getElementById("holeInput");
  const submitBtn        = document.getElementById("submitBtn");
  const clearBtn         = document.getElementById("clearBtn");
  const toast            = document.getElementById("toast");
  const themeBtn         = document.getElementById("themeToggle");
  const treeHole         = document.getElementById("treeHole");
  const holeContent      = document.getElementById("holeContent");
  const soilView         = document.getElementById("soilView");
  const seedBed1         = document.getElementById("seedBed1");
  const seedBed2         = document.getElementById("seedBed2");
  const seedBed3         = document.getElementById("seedBed3");
  const stage            = document.getElementById("stage");
  const globalTooltipLayer = document.getElementById("globalTooltipLayer");

  let toastTimer = null;
  let isAnimating = false;   // 防止动画期间重复提交
  let isInSoilView = false;  // 是否在土地视图
  let activeTooltip = null;  // 当前显示的全局 tooltip

  /** 隐藏并销毁当前 tooltip */
  function hideGlobalTooltip() {
    if (activeTooltip) {
      activeTooltip.classList.remove("show");
      const t = activeTooltip;
      activeTooltip = null;
      setTimeout(() => t.remove(), 250);
    }
  }

  /** Toast */
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
  }

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  /* ================================
     【核心】种子播种完整动画链
     流程：树洞闭合 → 变种子 → 落下 → 入土 → 新树洞展开
     ================================ */

  /** 读取本地种子 */
  function getSeeds() {
    try {
      return JSON.parse(localStorage.getItem("tree-hole-seeds") || "[]");
    } catch { return []; }
  }

  /** 保存种子 */
  function saveSeeds(seeds) {
    localStorage.setItem("tree-hole-seeds", JSON.stringify(seeds));
  }

  /** 在指定位置生成种子元素 */
  function createSeedEl(x, y) {
    const seed = document.createElement("div");
    seed.className = "seed";
    seed.style.left = (x - 8) + "px";
    seed.style.top  = (y - 11) + "px";
    document.body.appendChild(seed);
    return seed;
  }

  /** 入土尘土微动 */
  function createDust(x, y) {
    for (let i = 0; i < 6; i++) {
      const dust = document.createElement("div");
      dust.className = "dust";
      dust.style.left = (x - 2) + "px";
      dust.style.top  = (y - 2) + "px";
      dust.style.setProperty("--dx", (Math.random() * 60 - 30) + "px");
      dust.style.animationDelay = (i * 0.05) + "s";
      dust.classList.add("dust-anim");
      document.body.appendChild(dust);
      setTimeout(() => dust.remove(), 1500);
    }
  }

  /**
   * 完整播种动画链
   * @param {string} content - 心里话内容
   */
  async function runSowingAnimation(content) {
    if (isAnimating) return;
    isAnimating = true;

    // 禁用按钮
    submitBtn.disabled = true;
    clearBtn.disabled = true;

    const holeRect = treeHole.getBoundingClientRect();
    const centerX = holeRect.left + holeRect.width / 2;
    const centerY = holeRect.top + holeRect.height / 2;

    // 1. 树洞孔洞打开
    treeHole.classList.add("hole-open");
    await sleep(500);

    // 2. 树洞内容淡出 + 树洞开始闭合
    treeHole.classList.add("closing");
    await sleep(800);

    // 3. 闭合完成，在原位置生成种子并开始掉落
    const seed = createSeedEl(centerX, centerY);
    // 用 rAF 触发动画
    requestAnimationFrame(() => {
      seed.classList.add("seed-anim-drop");
    });

    // 4. 计算"土地"位置（屏幕下方约 70vh 处）
    const landY = window.innerHeight * 0.7;
    await sleep(1500); // 等待种子落下

    // 5. 入土反馈：尘土 + 种子轻弹
    createDust(centerX, landY);
    const bounceSeed = createSeedEl(centerX, landY);
    requestAnimationFrame(() => {
      bounceSeed.classList.add("seed-anim-bounce");
    });
    await sleep(1200);

    // 6. 保存种子到本地
    const newSeed = {
      id: Date.now(),
      content: content,
      time: new Date().toLocaleString("zh-CN", {
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit"
      })
    };
    const seeds = getSeeds();
    seeds.unshift(newSeed);
    saveSeeds(seeds);

    // 7. 重新打开树洞（同时清空旧内容、显示新内容）
    treeHole.classList.remove("closing", "hole-open");
    input.value = "";
    // 强制重排
    void treeHole.offsetWidth;
    treeHole.classList.add("opening");
    holeContent.style.opacity = "0";

    // 8. 新树洞展开到一半时显示内容
    setTimeout(() => {
      holeContent.style.opacity = "1";
    }, 600);

    await sleep(1200);
    treeHole.classList.remove("opening");

    // 9. 完成
    isAnimating = false;
    submitBtn.disabled = false;
    clearBtn.disabled = false;

    // 弹双行 Toast 反馈
    showToast(pickRandom(seedSuccessWords) + "\n" + pickRandom(newHoleWords));
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  /* ================================
     【核心】土地剖面视图交互
     下滑进入 / 上滑退出
     ================================ */

  /** 渲染土地里的种子（按层级分配） */
  function renderSoilView() {
    const seeds = getSeeds();
    // 清空
    [seedBed1, seedBed2, seedBed3].forEach(bed => bed.innerHTML = "");

    if (seeds.length === 0) {
      // 即使没有种子也显示一个温和提示（嵌入地表）
      const ground = document.querySelector(".ground-surface");
      ground.dataset.empty = "true";
      return;
    }

    // 按层级分配（最旧的在最深层）
    const beds = [seedBed1, seedBed2, seedBed3];
    seeds.forEach((seed, idx) => {
      // 简单分配：每层最多 12 个
      const bedIndex = Math.min(Math.floor(idx / 12), 2);
      const bed = beds[bedIndex];

      const el = document.createElement("div");
      el.className = "buried-seed";
      el.style.animationDelay = (idx * 0.03) + "s";

      // ========== 核心修改：绝对定位 + 随机坐标散落（集中版）==========
      // 获取当前土层的尺寸
      const bedRect = bed.getBoundingClientRect();
      // 可用区域（减去 padding，并额外收缩避免 tooltip 超出）
      // tooltip 最大宽度 280px，所以左右各留 140px 安全距离
      const safeMargin = 140;
      const availableW = bedRect.width - safeMargin * 2;
      const availableH = bedRect.height - 60; // 上下各留 30px
      
      // 随机 X 坐标（在中心区域集中分布）
      const randX = safeMargin + Math.random() * availableW;
      // 随机 Y 坐标（在可用高度内分布）
      const randY = 30 + Math.random() * availableH;
      
      // 应用绝对定位坐标
      el.style.left = randX + "px";
      el.style.top  = randY + "px";
      
      // 随机小角度旋转（-15° 到 +15° 之间，更温和）
      const randomRotate = Math.floor(Math.random() * 30) - 15;
      // 随机缩放（0.9~1.1 倍，更统一）
      const randomScale = 0.9 + Math.random() * 0.2;
      // 只保留旋转和缩放
      el.style.transform = `rotate(${randomRotate}deg) scale(${randomScale})`;
      // =========================================

      // 存储种子数据到 element 上，供悬停时使用
      el.dataset.time = seed.time;
      el.dataset.content = seed.content;

      bed.appendChild(el);

      // 绑定悬停事件：动态创建全局 tooltip（Portal 模式）
      el.addEventListener("mouseenter", (e) => showGlobalTooltip(e.currentTarget));
      el.addEventListener("mouseleave", hideGlobalTooltip);
    });
  }

  /**
   * 在全局层（body 直接子元素）显示 tooltip
   * 脱离所有祖先的层叠上下文，永远在最上层
   */
  function showGlobalTooltip(seedEl) {
    // 隐藏上一个
    hideGlobalTooltip();

    const rect = seedEl.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top;

    const tip = document.createElement("div");
    tip.className = "global-seed-tooltip";
    tip.innerHTML = `
      <div class="tt-time">${escapeHtml(seedEl.dataset.time)}</div>
      <div class="tt-content">${escapeHtml(seedEl.dataset.content)}</div>
    `;
    // 初始位置（先放在屏幕外，避免初次定位闪烁）
    tip.style.left = "0px";
    tip.style.top  = "0px";
    globalTooltipLayer.appendChild(tip);
    activeTooltip = tip;

    // 触发动画（先把位置设到正确坐标）
    requestAnimationFrame(() => {
      tip.style.left = x + "px";
      tip.style.top  = y + "px";
      tip.classList.add("show");
    });
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  /** 进入土地视图 */
  function enterSoilView() {
    if (isInSoilView) return;
    renderSoilView();
    soilView.classList.add("active");
    isInSoilView = true;
  }

  /** 退出土地视图 */
  function exitSoilView() {
    if (!isInSoilView) return;
    hideGlobalTooltip(); // 顺手清理悬停中的 tooltip
    soilView.classList.remove("active");
    isInSoilView = false;
  }

  /** 监听滚轮事件：下滑进入 / 上滑退出 */
  let scrollAccumulator = 0;
  const SCROLL_THRESHOLD = 80;

  window.addEventListener("wheel", (e) => {
    if (isAnimating) return;
    scrollAccumulator += e.deltaY;

    if (scrollAccumulator > SCROLL_THRESHOLD && !isInSoilView) {
      enterSoilView();
      scrollAccumulator = 0;
    } else if (scrollAccumulator < -SCROLL_THRESHOLD && isInSoilView) {
      exitSoilView();
      scrollAccumulator = 0;
    }

    // 衰减
    setTimeout(() => { scrollAccumulator *= 0.5; }, 200);
  }, { passive: true });

  /** 触摸滑动支持（移动端） */
  let touchStartY = 0;
  window.addEventListener("touchstart", (e) => {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener("touchend", (e) => {
    const touchEndY = e.changedTouches[0].clientY;
    const delta = touchStartY - touchEndY; // 下滑为正
    if (Math.abs(delta) < 50) return;
    if (delta > 0 && !isInSoilView) {
      enterSoilView();
    } else if (delta < 0 && isInSoilView) {
      exitSoilView();
    }
  });

  /* ===== 提交逻辑 ===== */
  function submitToHole() {
    if (isAnimating) return;
    const text = input.value.trim();
    if (text.length === 0) {
      showToast(pickRandom(emptyWords));
      return;
    }
    runSowingAnimation(text);
  }

  /* ===== 事件绑定 ===== */
  submitBtn.addEventListener("click", submitToHole);

  clearBtn.addEventListener("click", () => {
    if (input.value.trim().length === 0) {
      showToast("这里本来就是空的呀～");
      return;
    }
    input.value = "";
    input.focus();
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submitToHole();
    }
  });

  /* ===== 浅 / 深色模式 ===== */
  const savedTheme = localStorage.getItem("tree-hole-theme");
  if (savedTheme) {
    document.documentElement.setAttribute("data-theme", savedTheme);
    themeBtn.textContent = savedTheme === "dark" ? "☀" : "☾";
  }

  themeBtn.addEventListener("click", function () {
    const current = document.documentElement.getAttribute("data-theme");
    if (current === "dark") {
      document.documentElement.removeAttribute("data-theme");
      themeBtn.textContent = "☾";
      localStorage.setItem("tree-hole-theme", "light");
    } else {
      document.documentElement.setAttribute("data-theme", "dark");
      themeBtn.textContent = "☀";
      localStorage.setItem("tree-hole-theme", "dark");
    }
  });
</script>
</body>
</html>
