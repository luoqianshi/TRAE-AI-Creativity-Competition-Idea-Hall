<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduViz - 题目可视化生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            text-align: center;
            color: white;
            margin-bottom: 24px;
        }
        header h1 { font-size: 2.2em; margin-bottom: 6px; }
        header p { font-size: 1.05em; opacity: 0.9; }
        
        .workspace {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 16px;
            height: calc(100vh - 140px);
        }
        
        /* 输入区 - 左侧 */
        .input-panel {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .input-panel h3 {
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
            font-size: 13px;
        }
        select, textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        select:focus, textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        .upload-area {
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        .upload-area:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .upload-area.has-file {
            border-color: #48bb78;
            background: #f0fff4;
        }
        .upload-icon { font-size: 32px; margin-bottom: 6px; }
        .upload-text { color: #666; font-size: 13px; }
        .upload-preview {
            max-width: 100%;
            max-height: 120px;
            margin-top: 8px;
            border-radius: 6px;
            display: none;
        }
        
        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .example-btn {
            background: #f0f0f0;
            border: none;
            padding: 5px 10px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .example-btn:hover { background: #667eea; color: white; }
        
        .generate-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .generate-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 可视化区 - 右上 */
        .preview-panel {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        .preview-header h3 {
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
        }
        .preview-badge {
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
        }
        .download-btn {
            background: #48bb78;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.3s;
        }
        .download-btn:hover {
            background: #38a169;
            transform: translateY(-1px);
        }
        .download-btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }
        .preview-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .placeholder {
            text-align: center;
            color: #999;
        }
        .placeholder-icon { font-size: 64px; margin-bottom: 12px; }
        .demo-container { width: 100%; height: 100%; display: none; position: relative; }
        .demo-container.active { display: block; }
        
        /* 参数区 - 浮动小面板 */
        .params-panel {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 10px 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            z-index: 50;
            max-width: 260px;
            transition: all 0.3s;
        }
        .params-panel.collapsed {
            padding: 8px 12px;
        }
        .params-panel.collapsed .params-content {
            display: none;
        }
        .params-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            cursor: pointer;
            user-select: none;
        }
        .params-header h3 {
            color: #333;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 0;
        }
        .params-toggle {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }
        .params-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .param-item {
            display: grid;
            grid-template-columns: 45px 1fr 40px;
            gap: 6px;
            align-items: center;
            font-size: 12px;
        }
        .param-item label { font-weight: 600; color: #555; font-size: 11px; }
        .param-item input[type="range"] {
            width: 100%;
            padding: 0;
            cursor: pointer;
            height: 4px;
        }
        .param-item select {
            padding: 4px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
        }
        .param-item .value-display {
            text-align: right;
            font-weight: 600;
            color: #667eea;
            font-size: 11px;
        }
        .params-empty {
            text-align: center;
            color: #999;
            font-size: 12px;
            padding: 8px 0;
        }
        
        /* 物理演示 */
        .physics-demo {
            position: relative;
            width: 100%;
            height: 100%;
            background: #f8f9fa;
            border-radius: 12px;
            overflow: hidden;
        }
        .physics-info {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(255,255,255,0.95);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.7;
            z-index: 10;
        }
        .physics-info span { font-weight: 600; color: #667eea; }
        .physics-controls {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .physics-controls button {
            padding: 8px 18px;
            border: none;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .play-btn { background: #667eea; color: white; }
        .reset-btn { background: rgba(255,255,255,0.9); color: #333; }
        
        /* 数学演示 */
        .math-demo {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
        }
        #mathCanvas { max-width: 100%; max-height: 100%; }
        
        /* 算法演示 */
        .algorithm-demo {
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 16px;
            color: #d4d4d4;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: auto;
        }
        .algo-info {
            text-align: center;
            font-size: 15px;
            min-height: 22px;
        }
        .algo-step-info {
            background: #2d2d2d;
            padding: 10px 14px;
            border-radius: 6px;
            min-height: 50px;
        }
        .algo-step-info .step-title {
            color: #4ecdc4;
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .algo-step-info .step-desc {
            color: #d4d4d4;
            font-size: 12px;
            line-height: 1.5;
        }
        .algo-array {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 6px;
            min-height: 180px;
            flex: 1;
        }
        .algo-bar {
            width: 40px;
            background: linear-gradient(180deg, #4ecdc4 0%, #44a08d 100%);
            border-radius: 6px 6px 0 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 6px;
            font-weight: bold;
            color: white;
            font-size: 12px;
            transition: all 0.3s;
        }
        .algo-bar.comparing {
            background: linear-gradient(180deg, #ff6b6b 0%, #ee5a24 100%);
            transform: translateY(-8px);
        }
        .algo-bar.sorted {
            background: linear-gradient(180deg, #a8e6cf 0%, #56ab91 100%);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .stat-item {
            background: #2d2d2d;
            padding: 6px;
            border-radius: 5px;
            text-align: center;
        }
        .stat-label { color: #888; font-size: 10px; }
        .stat-value { color: #4ecdc4; font-size: 14px; font-weight: bold; }
        .algo-controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .algo-controls button {
            padding: 6px 14px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .algo-play { background: #4ecdc4; color: white; }
        .algo-pause { background: #feca57; color: #333; }
        .algo-reset { background: #333; color: white; border: 1px solid #666; }
        .algo-step { background: #667eea; color: white; }
        
        /* 加载状态 */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }
        .loading-overlay.active { display: flex; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (max-width: 900px) {
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: auto 400px 200px;
                height: auto;
            }
            .input-panel { grid-row: auto; max-height: 400px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>EduViz - 题目可视化生成器</h1>
            <p>输入题目（文字或图片），AI 自动生成可交互的可视化演示</p>
        </header>
        
        <div class="workspace">
            <!-- 左侧：输入区 -->
            <div class="input-panel">
                <h3>📝 输入题目</h3>
                
                <div class="form-group">
                    <label>题目类型</label>
                    <select id="questionType" onchange="updateParamsUI()">
                        <option value="physics">物理模拟</option>
                        <option value="math">数学图表</option>
                        <option value="algorithm">算法演示</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>文字描述</label>
                    <textarea id="questionInput" placeholder="例如：一质量为2kg的小球从10米高度自由下落，模拟其运动过程..."></textarea>
                    <div class="examples">
                        <button class="example-btn" onclick="loadExample('physics')">物理示例</button>
                        <button class="example-btn" onclick="loadExample('math')">数学示例</button>
                        <button class="example-btn" onclick="loadExample('algorithm')">算法示例</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>上传图片（可选）</label>
                    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                        <div class="upload-icon">📷</div>
                        <div class="upload-text">点击或拖拽上传题目图片</div>
                        <img id="uploadPreview" class="upload-preview" />
                    </div>
                    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileUpload(event)">
                </div>
                
                <button class="generate-btn" id="generateBtn" onclick="generateVisualization()">
                    ✨ 生成可视化
                </button>
            </div>
            
            <!-- 右上：可视化区 -->
            <div class="preview-panel">
                <div class="preview-header">
                    <h3>📊 预览 <span class="preview-badge" id="previewType">等待生成</span></h3>
                    <button class="download-btn" id="downloadBtn" onclick="downloadHTML()" disabled>
                        ⬇ 下载独立 HTML
                    </button>
                </div>
                <div class="preview-content" id="previewContent">
                    <div class="placeholder" id="placeholder">
                        <div class="placeholder-icon">🎯</div>
                        <p>输入题目后点击「生成可视化」</p>
                        <p style="font-size: 13px; margin-top: 8px;">支持物理模拟、数学图表、算法演示</p>
                    </div>
                    
                    <div class="loading-overlay" id="loadingOverlay">
                        <div class="spinner"></div>
                        <div>AI 正在分析题目并生成可视化...</div>
                    </div>
                    
                    <!-- 物理演示 -->
                    <div class="demo-container" id="physicsDemo">
                        <div class="physics-demo">
                            <div class="physics-info">
                                <div>质量: <span id="infoMass">2</span> kg</div>
                                <div>高度: <span id="infoHeight">10</span> m</div>
                                <div>速度: <span id="infoVel">0.00</span> m/s</div>
                                <div>时间: <span id="infoTime">0.00</span> s</div>
                            </div>
                            <canvas id="physicsCanvas"></canvas>
                            <div class="physics-controls">
                                <button class="play-btn" onclick="startPhysics()">▶ 播放</button>
                                <button class="reset-btn" onclick="resetPhysics()">↺ 重置</button>
                            </div>
                            <!-- 浮动参数面板 -->
                            <div class="params-panel" id="paramsFloat">
                                <div class="params-header" onclick="toggleParams()">
                                    <h3>🎛️ 参数</h3>
                                    <button class="params-toggle" id="paramsToggle">−</button>
                                </div>
                                <div class="params-content" id="paramsContent"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 数学演示 -->
                    <div class="demo-container" id="mathDemo">
                        <div class="math-demo">
                            <canvas id="mathCanvas" width="800" height="500"></canvas>
                            <div class="params-panel" id="paramsFloat">
                                <div class="params-header" onclick="toggleParams()">
                                    <h3>🎛️ 参数</h3>
                                    <button class="params-toggle" id="paramsToggle">−</button>
                                </div>
                                <div class="params-content" id="paramsContent"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 算法演示 -->
                    <div class="demo-container" id="algorithmDemo">
                        <div class="algorithm-demo">
                            <div class="params-panel" id="paramsFloat" style="position:relative;top:0;right:0;margin-bottom:4px;max-width:none">
                                <div class="params-header" onclick="toggleParams()">
                                    <h3>🎛️ 参数</h3>
                                    <button class="params-toggle" id="paramsToggle">−</button>
                                </div>
                                <div class="params-content" id="paramsContent"></div>
                            </div>
                            <div class="algo-info" id="algoInfo">准备就绪</div>
                            <div class="algo-step-info">
                                <div class="step-title" id="stepTitle">操作说明</div>
                                <div class="step-desc" id="stepDesc">点击「开始」按钮启动排序演示</div>
                            </div>
                            <div class="algo-array" id="algoArray"></div>
                            <div class="stats-grid">
                                <div class="stat-item">
                                    <div class="stat-label">比较次数</div>
                                    <div class="stat-value" id="statCompare">0</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">交换次数</div>
                                    <div class="stat-value" id="statSwap">0</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">当前步骤</div>
                                    <div class="stat-value" id="statStep">0</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">状态</div>
                                    <div class="stat-value" id="statStatus">未开始</div>
                                </div>
                            </div>
                            <div class="algo-controls">
                                <button class="algo-play" onclick="startSort()">▶ 开始</button>
                                <button class="algo-pause" onclick="pauseSort()">⏸ 暂停</button>
                                <button class="algo-step" onclick="stepSort()">⏭ 下一步</button>
                                <button class="algo-reset" onclick="resetAlgorithm()">↺ 重置</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            </div>
        </div>
    </div>
    
    <script>
        // ============ 状态管理 ============
        const state = {
            type: 'physics',
            params: {
                physics: { mass: 2, height: 10, gravity: 9.8 },
                math: { funcType: 'sin', xMin: -6.28, xMax: 6.28, a: 1, b: 1, c: 0, d: 0 },
                algorithm: { algoType: 'bubble', arrSize: 8, speed: 800 }
            },
            currentDemo: null,
            generated: false
        };
        
        const examples = {
            physics: "一质量为2kg的小球从10米高度自由下落，忽略空气阻力，模拟其运动过程并计算落地速度。",
            math: "绘制函数 y = sin(x) 在 [-2π, 2π] 区间内的图像，展示函数的基本特征。",
            algorithm: "用冒泡排序对随机数组进行排序，展示每一步的比较、交换过程。"
        };
        
        function loadExample(type) {
            document.getElementById('questionType').value = type;
            state.type = type;
            document.getElementById('questionInput').value = examples[type];
            updateParamsUI();
        }
        
        // ============ 文件上传 ============
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const preview = document.getElementById('uploadPreview');
                preview.src = e.target.result;
                preview.style.display = 'block';
                document.getElementById('uploadArea').classList.add('has-file');
                document.querySelector('.upload-text').textContent = '✓ ' + file.name;
            };
            reader.readAsDataURL(file);
        }
        
        // 拖拽上传
        const uploadArea = document.getElementById('uploadArea');
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#667eea';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                document.getElementById('fileInput').files = e.dataTransfer.files;
                handleFileUpload({ target: { files: [file] } });
            }
        });
        
        // ============ 参数 UI ============
        function updateParamsUI() {
            state.type = document.getElementById('questionType').value;
            renderParamsGrid();
        }
        
        function renderParamsGrid() {
            const grid = document.getElementById('paramsContent');
            if (!grid) return;
            let html = '';
            
            if (state.type === 'physics') {
                const p = state.params.physics;
                html = `
                    <div class="param-item">
                        <label>质量</label>
                        <input type="range" min="0.5" max="10" step="0.5" value="${p.mass}" oninput="updatePhysicsParam('mass', this.value)">
                        <span class="value-display" id="vMass">${p.mass.toFixed(1)}</span>
                    </div>
                    <div class="param-item">
                        <label>高度</label>
                        <input type="range" min="1" max="30" step="1" value="${p.height}" oninput="updatePhysicsParam('height', this.value)">
                        <span class="value-display" id="vHeight">${p.height.toFixed(1)}</span>
                    </div>
                    <div class="param-item">
                        <label>重力</label>
                        <input type="range" min="1" max="20" step="0.1" value="${p.gravity}" oninput="updatePhysicsParam('gravity', this.value)">
                        <span class="value-display" id="vGravity">${p.gravity.toFixed(1)}</span>
                    </div>
                `;
            } else if (state.type === 'math') {
                const p = state.params.math;
                html = `
                    <div class="param-item">
                        <label>函数</label>
                        <select onchange="updateMathParam('funcType', this.value)">
                            <option value="sin" ${p.funcType==='sin'?'selected':''}>sin(x)</option>

        // ============ 物理模拟 ============
        let physicsBall, physicsTimer;
        
        function initPhysics() {
            const p = state.params.physics;
            document.getElementById('infoMass').textContent = p.mass.toFixed(1);
            document.getElementById('infoHeight').textContent = p.height.toFixed(1);
            
            const canvas = document.getElementById('physicsCanvas');
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            const groundY = canvas.height - 30;
            const ballRadius = 18;
            const maxDisplayHeight = groundY - 80;
            const scale = maxDisplayHeight / Math.max(p.height, 1);
            const startY = groundY - p.height * scale;
            
            physicsBall = {
                x: canvas.width / 2,
                y: startY,
                radius: ballRadius,
                vy: 0,
                canvas: canvas,
                ctx: canvas.getContext('2d'),
                groundY: groundY,
                scale: scale,
                time: 0
            };
            
            drawPhysics();
        }
        
        function drawPhysics() {
            const { ctx, canvas, x, y, radius, groundY, scale, time } = physicsBall;
            const p = state.params.physics;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#4a5568';
            ctx.fillRect(0, groundY, canvas.width, 30);
            ctx.fillStyle = '#2d3748';
            ctx.fillRect(0, groundY, canvas.width, 4);
            
            ctx.strokeStyle = '#cbd5e0';
            ctx.lineWidth = 1;
            ctx.font = '11px Arial';
            ctx.fillStyle = '#4a5568';
            for (let i = 1; i < p.height; i += 2) {
                const markY = groundY - i * scale;
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2 + 30, markY);
                ctx.lineTo(canvas.width / 2 + 40, markY);
                ctx.stroke();
                ctx.fillText(i + 'm', canvas.width / 2 + 45, markY + 4);
            }
            
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            const gradient = ctx.createRadialGradient(x - 5, y - 5, 0, x, y, radius);
            gradient.addColorStop(0, '#ff6b6b');
            gradient.addColorStop(1, '#ee5a24');
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.strokeStyle = '#667eea';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, groundY);
            ctx.stroke();
            ctx.setLineDash([]);
            
            const currentHeight = (groundY - y - radius) / scale;
            document.getElementById('infoVel').textContent = Math.abs(physicsBall.vy).toFixed(2);
            document.getElementById('infoTime').textContent = time.toFixed(2);
            document.getElementById('infoHeight').textContent = currentHeight.toFixed(2);
        }
        
        function startPhysics() {
            if (physicsTimer) return;
            const p = state.params.physics;
            const dt = 0.02;
            physicsTimer = setInterval(() => {
                physicsBall.vy += p.gravity * dt;
                physicsBall.y += physicsBall.vy * dt;
                physicsBall.time += dt;
                
                if (physicsBall.y + physicsBall.radius >= physicsBall.groundY) {
                    physicsBall.y = physicsBall.groundY - physicsBall.radius;
                    clearInterval(physicsTimer);
                    physicsTimer = null;
                }
                drawPhysics();
            }, 30);
        }
        
        function resetPhysics() {
            if (physicsTimer) { clearInterval(physicsTimer); physicsTimer = null; }
            initPhysics();
        }
        
        // ============ 数学图表 ============
        function initMath() {
            const canvas = document.getElementById('mathCanvas');
            const container = canvas.parentElement;
            canvas.width = Math.min(800, container.clientWidth);
            canvas.height = Math.min(500, container.clientHeight);
            
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            ctx.clearRect(0, 0, width, height);
            
            const p = state.params.math;
            const samples = 200;
            const ys = [];
            for (let i = 0; i <= samples; i++) {
                const x = p.xMin + (p.xMax - p.xMin) * i / samples;
                ys.push({ x, y: computeFunc(p.funcType, x, p.a, p.b, p.c, p.d) });
            }
            const validYs = ys.filter(pt => isFinite(pt.y) && Math.abs(pt.y) < 100);
            let yMin = Math.min(...validYs.map(pt => pt.y));
            let yMax = Math.max(...validYs.map(pt => pt.y));
            const yRange = yMax - yMin;
            yMin -= yRange * 0.1;
            yMax += yRange * 0.1;
            
            const xToPx = (x) => 50 + (x - p.xMin) / (p.xMax - p.xMin) * (width - 80);
            const yToPx = (y) => 30 + (yMax - y) / (yMax - yMin) * (height - 60);
            
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                const x = 50 + i * (width - 80) / 10;
                ctx.beginPath();
                ctx.moveTo(x, 30);
                ctx.lineTo(x, height - 30);
                ctx.stroke();
            }
            for (let i = 0; i <= 8; i++) {
                const y = 30 + i * (height - 60) / 8;
                ctx.beginPath();
                ctx.moveTo(50, y);
                ctx.lineTo(width - 30, y);
                ctx.stroke();
            }
            
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            const xAxisY = yToPx(0);
            ctx.moveTo(40, Math.max(30, Math.min(height - 30, xAxisY)));
            ctx.lineTo(width - 30, Math.max(30, Math.min(height - 30, xAxisY)));
            const yAxisX = xToPx(0);
            ctx.moveTo(Math.max(50, Math.min(width - 30, yAxisX)), 20);
            ctx.lineTo(Math.max(50, Math.min(width - 30, yAxisX)), height - 30);
            ctx.stroke();
            
            ctx.font = '11px Arial';
            ctx.fillStyle = '#666';
            ctx.textAlign = 'center';
            for (let x = Math.ceil(p.xMin); x <= Math.floor(p.xMax); x++) {
                if (x === 0) continue;
                const px = xToPx(x);
                ctx.fillText(x, px, xAxisY + 18);
            }
            ctx.textAlign = 'right';
            for (let y = Math.ceil(yMin); y <= Math.floor(yMax); y++) {
                if (y === 0) continue;
                const py = yToPx(y);
                ctx.fillText(y, yAxisX - 5, py + 4);
            }
            
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.beginPath();
            let started = false;
            for (let i = 0; i <= samples; i++) {
                const x = p.xMin + (p.xMax - p.xMin) * i / samples;
                const y = ys[i].y;
                if (!isFinite(y) || Math.abs(y) > 100) { started = false; continue; }
                const px = xToPx(x);
                const py = yToPx(y);
                if (py < 20 || py > height - 20) { started = false; continue; }
                if (!started) { ctx.moveTo(px, py); started = true; }
                else ctx.lineTo(px, py);
            }
            ctx.stroke();
            
            ctx.fillStyle = '#333';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(getFuncLabel(p.funcType, p.a, p.b, p.c, p.d), 60, 30);
        }
        
        function computeFunc(type, x, a, b, c, d) {
            switch(type) {
                case 'sin': return a * Math.sin(b * x + c) + d;
                case 'cos': return a * Math.cos(b * x + c) + d;
                case 'tan': return a * Math.tan(b * x + c) + d;
                case 'quadratic': return a * x * x + b * x + c;
                case 'cubic': return a * x * x * x + b * x * x + c * x + d;
                case 'exponential': return a * Math.exp(b * x);
                case 'logarithm': return x > 0 ? a * Math.log(x) + b : NaN;
                case 'linear': return a * x + b;
                default: return 0;
            }
        }
        
        function getFuncLabel(type, a, b, c, d) {
            const f = v => v.toFixed(1);
            const map = {
                sin: `f(x) = ${f(a)}·sin(${f(b)}x + ${f(c)}) + ${f(d)}`,
                cos: `f(x) = ${f(a)}·cos(${f(b)}x + ${f(c)}) + ${f(d)}`,
                tan: `f(x) = ${f(a)}·tan(${f(b)}x + ${f(c)}) + ${f(d)}`,
                quadratic: `f(x) = ${f(a)}x² + ${f(b)}x + ${f(c)}`,
                cubic: `f(x) = ${f(a)}x³ + ${f(b)}x² + ${f(c)}x + ${f(d)}`,
                exponential: `f(x) = ${f(a)}·e^(${f(b)}x)`,
                logarithm: `f(x) = ${f(a)}·ln(x) + ${f(b)}`,
                linear: `f(x) = ${f(a)}x + ${f(b)}`
            };
            return map[type] || '';
        }
        
        // ============ 算法演示 ============
        let sortArray = [], sortSteps = [], currentStep = 0;
        let sortTimer = null, sortSpeed = 800;
        let isRunning = false, isPaused = false;
        let sortStats = { compare: 0, swap: 0 };
        
        function initAlgorithm() {
            const p = state.params.algorithm;
            sortSpeed = p.speed;
            sortArray = [];
            for (let i = 0; i < p.arrSize; i++) {
                sortArray.push(Math.floor(Math.random() * 90) + 10);
            }
            generateSteps();
            renderArray();
            updateStats();
        }
        
        function resetAlgorithm() {
            if (sortTimer) { clearTimeout(sortTimer); sortTimer = null; }
            currentStep = 0;
            isRunning = false;
            isPaused = false;
            initAlgorithm();
            document.getElementById('algoInfo').textContent = '准备就绪';
            document.getElementById('stepTitle').textContent = '操作说明';
            document.getElementById('stepDesc').textContent = '点击「开始」按钮启动排序演示';
        }
        
        function generateSteps() {
            const algo = state.params.algorithm.algoType;
            sortSteps = [];
            sortStats = { compare: 0, swap: 0 };
            const arr = [...sortArray];
            const fns = { bubble: bubbleSortSteps, selection: selectionSortSteps, 
                         insertion: insertionSortSteps, quick: quickSortSteps };
            if (algo === 'quick') {
                fns.quick(arr, 0, arr.length - 1);
            } else {
                fns[algo](arr);
            }
        }
        
        function addStep(type, arr, highlights, title, desc) {
            sortSteps.push({ type, arr: [...arr], highlights, title, desc,
                compare: sortStats.compare, swap: sortStats.swap });
        }
        
        function bubbleSortSteps(arr) {
            const n = arr.length;
            for (let i = 0; i < n - 1; i++) {
                for (let j = 0; j < n - i - 1; j++) {
                    sortStats.compare++;
                    addStep('compare', arr, [j, j+1], `第 ${i+1} 轮第 ${j+1} 次比较`,
                        `比较 arr[${j}]=${arr[j]} 和 arr[${j+1}]=${arr[j+1]}`);
                    if (arr[j] > arr[j+1]) {
                        [arr[j], arr[j+1]] = [arr[j+1], arr[j]];
                        sortStats.swap++;
                        addStep('swap', arr, [j, j+1], `交换元素`, `交换 ${arr[j+1]} 和 ${arr[j]}`);
                    }
                }
                addStep('sorted', arr, [n - i - 1], `第 ${i+1} 轮结束`, `最大值已就位`);
            }
            addStep('sorted', arr, arr.map((_, i) => i), '排序完成', `共 ${sortStats.compare} 次比较，${sortStats.swap} 次交换`);
        }
        
        function selectionSortSteps(arr) {
            const n = arr.length;
            for (let i = 0; i < n - 1; i++) {
                let minIdx = i;
                for (let j = i + 1; j < n; j++) {
                    sortStats.compare++;
                    addStep('compare', arr, [minIdx, j], `查找最小值`, `arr[${j}]=${arr[j]} 与当前最小值比较`);
                    if (arr[j] < arr[minIdx]) minIdx = j;
                }
                if (minIdx !== i) {
                    [arr[i], arr[minIdx]] = [arr[minIdx], arr[i]];
                    sortStats.swap++;
                    addStep('swap', arr, [i, minIdx], `交换`, `将最小值放到位置 ${i}`);
                }
                addStep('sorted', arr, [i], `位置 ${i} 已确定`, `本轮最小值已就位`);
            }
            addStep('sorted', arr, arr.map((_, i) => i), '排序完成', `共 ${sortStats.compare} 次比较，${sortStats.swap} 次交换`);
        }
        
        function insertionSortSteps(arr) {
            const n = arr.length;
            for (let i = 1; i < n; i++) {
                let key = arr[i], j = i - 1;
                addStep('compare', arr, [i], `取出待插入`, `将 ${key} 插入已排序部分`);
                while (j >= 0 && arr[j] > key) {
                    sortStats.compare++;
                    arr[j+1] = arr[j];
                    sortStats.swap++;
                    addStep('swap', arr, [j, j+1], `元素后移`, `arr[${j}] > ${key}`);
                    j--;
                }
                arr[j+1] = key;
                if (j >= 0) sortStats.compare++;
                addStep('sorted', arr, Array.from({length: i+1}, (_, k) => k), `插入完成`, `${key} 已就位`);
            }
            addStep('sorted', arr, arr.map((_, i) => i), '排序完成', `共 ${sortStats.compare} 次比较，${sortStats.swap} 次交换`);
        }
        
        function quickSortSteps(arr, low, high) {
            if (low < high) {
                const pi = partition(arr, low, high);
                quickSortSteps(arr, low, pi - 1);
                quickSortSteps(arr, pi + 1, high);
            } else if (low === high) {
                addStep('sorted', arr, [low], '单元素有序', `位置 ${low} 已有序`);
            }
        }
        
        function partition(arr, low, high) {
            const pivot = arr[high];
            let i = low - 1;
            for (let j = low; j < high; j++) {
                sortStats.compare++;
                addStep('compare', arr, [j, high], `分区中`, `比较 arr[${j}]=${arr[j]} 与基准 ${pivot}`);
                if (arr[j] < pivot) {
                    i++;
                    if (i !== j) {
                        [arr[i], arr[j]] = [arr[j], arr[i]];
                        sortStats.swap++;
                        addStep('swap', arr, [i, j], `交换`, `小于基准的元素移到左侧`);
                    }
                }
            }
            [arr[i+1], arr[high]] = [arr[high], arr[i+1]];
            sortStats.swap++;
            addStep('sorted', arr, [i+1], `分区完成`, `基准 ${pivot} 已就位`);
            return i + 1;
        }
        
        function renderArray(highlights = [], sorted = []) {
            const container = document.getElementById('algoArray');
            container.innerHTML = '';
            const maxVal = Math.max(...sortArray, 100);
            sortArray.forEach((val, idx) => {
                const bar = document.createElement('div');
                bar.className = 'algo-bar';
                if (highlights.includes(idx)) bar.classList.add('comparing');
                if (sorted.includes(idx)) bar.classList.add('sorted');
                bar.style.height = (val / maxVal * 160) + 'px';
                bar.textContent = val;
                container.appendChild(bar);
            });
        }
        
        function updateStats() {
            document.getElementById('statCompare').textContent = sortStats.compare;
            document.getElementById('statSwap').textContent = sortStats.swap;
            document.getElementById('statStep').textContent = currentStep;
            document.getElementById('statStatus').textContent = 
                currentStep === 0 ? '未开始' :
                currentStep >= sortSteps.length ? '已完成' : '进行中';
        }
        
        function applyStep(idx) {
            if (idx < 0 || idx >= sortSteps.length) return;
            const s = sortSteps[idx];
            sortArray = [...s.arr];
            renderArray(s.highlights);
            document.getElementById('algoInfo').textContent = s.title;
            document.getElementById('stepTitle').textContent = s.title;
            document.getElementById('stepDesc').textContent = s.desc;
            updateStats();
        }
        
        function startSort() {
            if (isRunning) return;
            if (currentStep >= sortSteps.length) resetAlgorithm();
            isRunning = true; isPaused = false;
            const next = () => {
                if (!isRunning || isPaused) return;
                if (currentStep >= sortSteps.length) { isRunning = false; return; }
                applyStep(currentStep); currentStep++;
                sortTimer = setTimeout(next, sortSpeed);
            };
            next();
        }
        
        function pauseSort() {
            isPaused = true; isRunning = false;
            if (sortTimer) { clearTimeout(sortTimer); sortTimer = null; }
        }
        
        function stepSort() {
            pauseSort();
            if (currentStep < sortSteps.length) { applyStep(currentStep); currentStep++; }
        }
        
        // ============ 下载独立 HTML ============
        function downloadHTML() {
            if (!state.generated) return;
            
            const type = state.type;
            const params = JSON.stringify(state.params[type]);
            
            // 提取对应类型的演示代码和参数
            let demoHTML = '';
            let demoJS = '';
            let demoCSS = '';
            
            if (type === 'physics') {
