<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0">
<title>智拣 — 穿戴式拣货终端</title>
<style>
:root {
  --bg:#0a0a0f; --bg2:#14141f; --ink:#e8e8f0; --muted:#7c7c8a;
  --accent:#6366f1; --accent2:#10b981; --danger:#ef4444; --warning:#f59e0b;
  --rule:#1e1e2e; --radius:12px; --radius-sm:8px;
  --glow:0 0 20px rgba(99,102,241,0.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;
  min-height:100vh;display:flex;flex-direction:column;
  -webkit-user-select:none;user-select:none;
  max-width:480px;margin:0 auto;border-left:1px solid var(--rule);border-right:1px solid var(--rule);
}

/* Status Bar */
.status-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px;font-size:0.75rem;color:var(--muted);
  background:var(--bg2);border-bottom:1px solid var(--rule);
}
.status-bar .battery{display:flex;align-items:center;gap:4px}
.status-bar .battery-icon{
  width:20px;height:10px;border:1.5px solid var(--accent2);border-radius:3px;
  position:relative;padding:2px;
}
.status-bar .battery-icon::after{
  content:'';position:absolute;right:-4px;top:2px;width:3px;height:6px;
  background:var(--accent2);border-radius:0 2px 2px 0;
}
.status-bar .battery-fill{height:100%;background:var(--accent2);border-radius:1px;width:80%}

/* Header */
.terminal-header{
  padding:16px;text-align:center;border-bottom:1px solid var(--rule);
  background:linear-gradient(180deg,var(--bg2),var(--bg));
}
.terminal-header .device-name{font-size:0.8rem;color:var(--accent);font-weight:600;letter-spacing:0.05em;text-transform:uppercase}
.terminal-header .title{font-size:1.2rem;font-weight:700;margin:4px 0}

/* Main Content */
.terminal-body{flex:1;overflow-y:auto;padding:16px}

/* Screen: Welcome */
.screen{display:none}
.screen.active{display:flex;flex-direction:column;gap:16px}

/* Welcome */
.welcome-card{
  background:var(--bg2);border-radius:var(--radius);padding:24px;text-align:center;
  border:1px solid var(--rule);
}
.welcome-card .avatar{
  width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#818cf8);
  margin:0 auto 16px;display:flex;align-items:center;justify-content:center;
  font-size:2rem;box-shadow:var(--glow);
}
.welcome-card .picker-name{font-size:1.1rem;font-weight:700}
.welcome-card .picker-id{font-size:0.82rem;color:var(--muted);margin-top:4px}

/* Task Card */
.task-card{
  background:var(--bg2);border-radius:var(--radius);padding:20px;border:1px solid var(--rule);
  border-left:4px solid var(--accent);
}
.task-card .task-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.task-card .task-no{font-size:0.8rem;color:var(--accent);font-weight:600}
.task-card .task-customer{font-size:1.05rem;font-weight:700}
.task-card .task-meta{display:flex;gap:16px;font-size:0.8rem;color:var(--muted);margin-top:8px}

/* Progress */
.progress-bar{background:var(--rule);border-radius:4px;height:6px;margin:8px 0;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width 0.3s}

/* Current Item */
.current-item{
  background:var(--bg2);border:2px solid var(--accent);border-radius:var(--radius);
  padding:24px;text-align:center;box-shadow:var(--glow);animation:borderPulse 2s infinite;
}
@keyframes borderPulse{0%,100%{border-color:var(--accent)}50%{border-color:rgba(99,102,241,0.3)}}
.current-item .item-location{
  font-size:2.5rem;font-weight:800;color:var(--accent);letter-spacing:0.05em;
  margin-bottom:8px;text-shadow:0 0 20px rgba(99,102,241,0.5);
}
.current-item .item-name{font-size:1.1rem;font-weight:600}
.current-item .item-qty{font-size:0.9rem;color:var(--muted);margin-top:4px}
.current-item .item-barcode{font-size:0.8rem;color:var(--muted);margin-top:8px;font-family:monospace}
.current-item .pick-light{
  width:100%;height:6px;background:var(--accent);margin-top:12px;
  border-radius:3px;animation:glow 1s infinite alternate;
}
@keyframes glow{from{box-shadow:0 0 10px var(--accent)}to{box-shadow:0 0 30px var(--accent),0 0 60px var(--accent)}}

/* Navigation Arrow */
.nav-arrow{
  font-size:3rem;text-align:center;color:var(--accent);animation:bounce 1s infinite;
}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* Barcode Scanner */
.scanner-area{
  background:var(--bg2);border:2px dashed var(--rule);border-radius:var(--radius);
  padding:32px 20px;text-align:center;cursor:pointer;transition:all 0.2s;
}
.scanner-area:hover,.scanner-area.scanning{border-color:var(--accent);box-shadow:var(--glow)}
.scanner-area .scanner-icon{font-size:3rem;margin-bottom:12px}
.scanner-area .scanner-text{font-size:0.85rem;color:var(--muted)}
.scanner-area .scanner-input{display:none}
.scanner-area .manual-input{
  background:transparent;border:none;border-bottom:2px solid var(--accent);
  color:var(--ink);font-size:1.2rem;text-align:center;padding:8px;width:200px;
  font-family:monospace;outline:none;margin-top:12px;
}
.scanner-area .manual-input::placeholder{color:var(--muted);font-size:0.9rem}

/* Pick Confirm */
.pick-qty-input{
  display:flex;align-items:center;gap:12px;justify-content:center;margin:16px 0;
}
.pick-qty-input button{
  width:44px;height:44px;border-radius:50%;border:2px solid var(--rule);
  background:var(--bg2);color:var(--ink);font-size:1.3rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.pick-qty-input button:active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pick-qty-input .qty-display{font-size:2rem;font-weight:700;min-width:60px;text-align:center}

/* Big Buttons */
.btn-block{
  display:block;width:100%;padding:16px;border:none;border-radius:var(--radius);
  font-size:1.05rem;font-weight:700;cursor:pointer;text-align:center;
  transition:all 0.2s;font-family:inherit;color:#fff;
}
.btn-block:active{transform:scale(0.97)}
.btn-primary{background:var(--accent);box-shadow:0 4px 16px rgba(99,102,241,0.3)}
.btn-primary:hover{background:#4f46e5}
.btn-success{background:var(--accent2);box-shadow:0 4px 16px rgba(16,185,129,0.3)}
.btn-success:hover{background:#059669}
.btn-danger{background:var(--danger)}
.btn-outline{background:transparent;border:2px solid var(--rule);color:var(--ink)}
.btn-outline:hover{border-color:var(--accent)}

/* Voice Status */
.voice-status{
  display:flex;align-items:center;gap:8px;justify-content:center;
  padding:12px;background:var(--bg2);border-radius:var(--radius-sm);
  font-size:0.82rem;color:var(--muted);
}
.voice-status .voice-dot{width:8px;height:8px;border-radius:50%;background:var(--danger)}
.voice-status .voice-dot.active{background:var(--accent2);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.voice-status .voice-text{font-size:0.85rem}

/* Toast */
.terminal-toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:var(--bg2);color:var(--ink);padding:20px 32px;border-radius:var(--radius);
  font-size:1.1rem;font-weight:700;text-align:center;z-index:100;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);border:1px solid var(--rule);
  display:none;animation:toastIn 0.3s ease;
}
.terminal-toast.show{display:block}
.terminal-toast.success{border-color:var(--accent2);color:var(--accent2)}
.terminal-toast.error{border-color:var(--danger);color:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-50%) scale(0.8)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* Wave indicator */
.wave-indicator{
  display:flex;gap:3px;align-items:flex-end;justify-content:center;height:30px;
}
.wave-indicator .bar{
  width:4px;background:var(--accent);border-radius:2px;animation:wave 0.8s infinite alternate;
}
.wave-indicator .bar:nth-child(2){animation-delay:0.1s;height:60%}
.wave-indicator .bar:nth-child(3){animation-delay:0.2s;height:80%}
.wave-indicator .bar:nth-child(4){animation-delay:0.3s;height:50%}
.wave-indicator .bar:nth-child(5){animation-delay:0.4s;height:70%}
.wave-indicator .bar:nth-child(6){animation-delay:0.5s;height:40%}
.wave-indicator .bar:nth-child(7){animation-delay:0.6s;height:60%}
@keyframes wave{from{height:20%}to{height:100%}}

/* Complete */
.complete-icon{font-size:4rem;text-align:center;animation:popIn 0.5s ease}
@keyframes popIn{0%{transform:scale(0)}80%{transform:scale(1.1)}100%{transform:scale(1)}}

/* Vibration feedback */
.vibrate-indicator{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(16,185,129,0.1);z-index:50;pointer-events:none;
  display:none;animation:flash 0.3s ease;
}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>

<!-- Status Bar -->
<div class="status-bar">
  <span>智拣 OS 2.0</span>
  <span style="display:flex;align-items:center;gap:8px">
    <span id="connectionStatus" style="color:var(--accent2)">● 已连接</span>
    <span class="battery">
      <span class="battery-icon"><span class="battery-fill"></span></span>
      85%
    </span>
    <span id="clock">--:--</span>
  </span>
</div>

<!-- Header -->
<div class="terminal-header">
  <div class="device-name">穿戴式拣货终端 · 拾取者</div>
  <div class="title" id="screenTitle">任务就绪</div>
</div>

<!-- Body -->
<div class="terminal-body">

  <!-- Screen: Welcome -->
  <div class="screen active" id="screen-welcome">
    <div class="welcome-card">
      <div class="avatar">👷</div>
      <div class="picker-name">拣货员：张三</div>
      <div class="picker-id">工号：PK-001</div>
    </div>

    <div style="text-align:center;color:var(--muted);font-size:0.85rem;margin:8px 0">
      <p>待拣货任务：<strong style="color:var(--ink)" id="pendingTaskCount">--</strong></p>
      <p>今日已完成：<strong style="color:var(--accent2)" id="todayCompleted">--</strong></p>
    </div>

    <div class="voice-status" id="voiceStatus">
      <span class="voice-dot" id="voiceDot"></span>
      <span class="voice-text" id="voiceText">语音就绪 · 说"开始拣货"启动</span>
    </div>

    <div class="wave-indicator" id="waveIndicator" style="display:none">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;margin-top:8px">
      <button class="btn-block btn-primary" onclick="startPicking()">
        🎤 语音启动 · 说"开始拣货"
      </button>
      <button class="btn-block btn-outline" onclick="startPicking()">
        📋 手动选择任务开始
      </button>
    </div>
  </div>

  <!-- Screen: Task Select -->
  <div class="screen" id="screen-task-select">
    <div style="color:var(--muted);font-size:0.85rem;margin-bottom:8px">请选择要执行的拣货任务：</div>
    <div id="taskList" style="display:flex;flex-direction:column;gap:10px"></div>
    <button class="btn-block btn-outline" onclick="showScreen('welcome')" style="margin-top:12px">← 返回</button>
  </div>

  <!-- Screen: Picking -->
  <div class="screen" id="screen-picking">
    <div class="task-card" id="activeTaskCard"></div>
    <div class="progress-bar"><div class="progress-fill" id="pickProgress" style="width:0%"></div></div>
    <div style="text-align:center;font-size:0.82rem;color:var(--muted)">
      进度：<span id="pickProgressText">0/0</span>
    </div>

    <div class="current-item" id="currentItemCard">
      <div class="nav-arrow" id="navArrow">⬆</div>
      <div class="item-location" id="itemLocation">--</div>
      <div class="pick-light"></div>
      <div class="item-name" id="itemName">--</div>
      <div class="item-qty" id="itemQty">--</div>
      <div class="item-barcode" id="itemBarcode">--</div>
    </div>

    <!-- Scanner -->
    <div class="scanner-area" id="scannerArea" onclick="focusScanner()">
      <div class="scanner-icon">📷</div>
      <div class="scanner-text">点击扫描条码 / 输入条码确认</div>
      <input type="text" class="manual-input" id="manualBarcode" placeholder="输入条码..." onkeydown="if(event.key==='Enter')verifyBarcode()">
    </div>

    <div class="pick-qty-input">
      <button onclick="changeQty(-1)">−</button>
      <div class="qty-display" id="qtyDisplay">1</div>
      <button onclick="changeQty(1)">+</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="btn-block btn-success" id="btnConfirmPick" onclick="confirmPick()">
        ✅ 确认拣货 · 放入周转箱
      </button>
      <button class="btn-block btn-outline" onclick="skipItem()" style="font-size:0.9rem">
        ⏭ 跳过此货品
      </button>
    </div>
  </div>

  <!-- Screen: Complete -->
  <div class="screen" id="screen-complete">
    <div class="welcome-card">
      <div class="complete-icon">✅</div>
      <div style="font-size:1.3rem;font-weight:700;margin:12px 0">拣货任务完成！</div>
      <div style="color:var(--muted);font-size:0.9rem" id="completeStats"></div>
    </div>
    <button class="btn-block btn-primary" onclick="resetPicking()">🔄 开始新任务</button>
    <button class="btn-block btn-outline" onclick="showScreen('welcome')">← 返回首页</button>
  </div>

</div>

<!-- Toast -->
<div class="terminal-toast" id="terminalToast"></div>

<!-- Vibration feedback -->
<div class="vibrate-indicator" id="vibrateOverlay"></div>

<script src="assets/data.js"></script>
<script src="assets/picking.js"></script>
</body>
</html>
