    }

    .chart-row {

    .chart-card {

    /* === Modal === */
    .modal-overlay {

      inset: 0;

      padding: 1rem;
    }
    .modal-overlay.show { display: flex; }
    .modal {

      overflow-y: auto;

    }
    .modal-header {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 {

      margin: 0;

    .modal-close {
      width: 32px; height: 32px;

    .toast-container {

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }

    /* === Empty state === */
    .empty-state {
      text-align: center;

<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">&#128218;</div>
        <div>
          <div class="logo-text">AI错题本</div>
          <div class="logo-sub">拍照自动整理孩子错题</div>
        </div>
      </div>
      <nav class="nav-tabs">
        <button class="nav-tab active" data-tab="upload">&#128247; 拍照录入</button>
        <button class="nav-tab" data-tab="archive">&#128203; 错题本</button>
        <button class="nav-tab" data-tab="stats">&#128202; 统计分析</button>
      </nav>
    </div>
  </header>

  <main class="app-main">

    <!-- ===== Tab 1: Upload ===== -->
    <section id="tab-upload" class="page-section active">
      <div class="upload-hero">
        <h2>拍照录入错题</h2>
        <p>拍摄或上传试卷/作业照片，AI 自动识别题目内容并智能分类</p>
        <div class="upload-zone" id="uploadZone">
          <span class="upload-zone-icon">&#128247;</span>
          <div class="upload-zone-title">点击拍照或拖拽图片到这里</div>
          <div class="upload-zone-hint">支持 JPG、PNG 格式，单张不超过 10MB</div>
          <input type="file" id="fileInput" accept="image/*" capture="environment">
        </div>
      </div>

      <!-- OCR Panel -->
      <div class="ocr-panel" id="ocrPanel">
        <div class="ocr-header">
          <span>&#129302;</span> AI 识别结果
        </div>
        <div class="ocr-body">
          <div class="ocr-left">
            <div class="ocr-label">原始图片</div>
            <img id="ocrPreview" class="ocr-img-preview" src="" alt="预览">
          </div>
          <div class="ocr-right">
            <div class="ocr-label">识别出的题目内容</div>
            <div class="ocr-result-text" id="ocrText"></div>
            <div class="ocr-form">
              <div class="form-row">
                <div class="form-group">
                  <label>学科</label>
                  <select id="ocrSubject">
                    <option value="数学">数学</option>
                    <option value="语文">语文</option>
                    <option value="英语">英语</option>
                    <option value="物理">物理</option>
                    <option value="化学">化学</option>
                    <option value="生物">生物</option>
                    <option value="历史">历史</option>
                    <option value="地理">地理</option>
                    <option value="政治">政治</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>章节/知识点</label>
                  <input type="text" id="ocrChapter" placeholder="如：二次函数">
                </div>
              </div>
              <div class="form-group">
                <label>错误类型（可多选）</label>
                <div class="error-tags" id="errorTags">
                  <span class="error-tag" data-type="计算错误">计算错误</span>
                  <span class="error-tag" data-type="概念混淆">概念混淆</span>
                  <span class="error-tag" data-type="审题不清">审题不清</span>
                  <span class="error-tag" data-type="公式记错">公式记错</span>
                  <span class="error-tag" data-type="步骤遗漏">步骤遗漏</span>
                  <span class="error-tag" data-type="书写错误">书写错误</span>
                  <span class="error-tag" data-type="逻辑错误">逻辑错误</span>
                  <span class="error-tag" data-type="粗心大意">粗心大意</span>
                </div>
              </div>
              <div class="ocr-actions">
                <button class="btn btn-success btn-block" id="btnSave">&#128190; 保存到错题本</button>
                <button class="btn btn-outline" id="btnReset">&#128260; 重新拍照</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== Tab 2: Archive ===== -->
    <section id="tab-archive" class="page-section">
      <div class="archive-toolbar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜索题目内容、知识点...">
        </div>
        <select class="filter-select" id="filterSubject">
          <option value="">全部学科</option>
          <option value="数学">数学</option>
          <option value="语文">语文</option>
          <option value="英语">英语</option>
          <option value="物理">物理</option>
          <option value="化学">化学</option>
        </select>
        <select class="filter-select" id="filterError">
          <option value="">全部错误类型</option>
          <option value="计算错误">计算错误</option>
          <option value="概念混淆">概念混淆</option>
          <option value="审题不清">审题不清</option>
          <option value="公式记错">公式记错</option>
          <option value="步骤遗漏">步骤遗漏</option>
        </select>
        <button class="btn btn-primary btn-sm" id="btnPrint">&#128424; 打印错题本</button>
      </div>
      <div class="archive-stats" id="archiveStats"></div>
      <div class="question-grid" id="questionGrid"></div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <span class="empty-state-icon">&#128214;</span>
        <p>还没有错题记录，去拍照录入第一道错题吧！</p>
      </div>
    </section>

    <!-- ===== Tab 3: Statistics ===== -->
    <section id="tab-stats" class="page-section">
      <div class="stats-grid" id="statsCards"></div>
      <div class="chart-row">
        <div class="chart-card">
          <h3>&#128202; 各学科错题数量分布</h3>
