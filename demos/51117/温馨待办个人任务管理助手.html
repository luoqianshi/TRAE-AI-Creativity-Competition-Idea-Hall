<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温馨待办 - 个人任务管理助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #FF9A8B;
            --primary-light: #FFB4A2;
            --primary-dark: #E07A6E;
            --secondary-color: #FEC8D8;
            --accent-color: #FFDFD3;
            --bg-color: #FFF5F3;
            --card-bg: #FFFFFF;
            --text-primary: #5A4A4A;
            --text-secondary: #8B7B7B;
            --border-color: #FFE5E0;
            --shadow: 0 4px 20px rgba(255, 154, 139, 0.15);
            --shadow-hover: 0 8px 30px rgba(255, 154, 139, 0.25);
            --priority-high: #FF6B6B;
            --priority-medium: #FFB347;
            --priority-low: #77DD77;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-color) 0%, var(--accent-color) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: var(--primary-dark);
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .header-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .lang-switch {
            display: flex;
            background: var(--card-bg);
            border-radius: 25px;
            padding: 4px;
            box-shadow: var(--shadow);
        }

        .lang-btn {
            padding: 8px 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 20px;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            text-align: center;
            min-width: 100px;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--primary-dark);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Task Input Section */
        .input-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .task-input {
            flex: 1;
            min-width: 250px;
            padding: 15px 20px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            transition: var(--transition);
            background: var(--bg-color);
        }

        .task-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(255, 154, 139, 0.1);
        }

        .priority-select {
            padding: 15px 20px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            background: var(--bg-color);
            cursor: pointer;
            min-width: 120px;
        }

        .priority-select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .reminder-section {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            padding: 15px;
            background: var(--bg-color);
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .reminder-label {
            font-weight: 500;
            color: var(--text-primary);
        }

        .reminder-type {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .reminder-option {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 15px;
            background: var(--card-bg);
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
        }

        .reminder-option:hover {
            border-color: var(--primary-light);
        }

        .reminder-option input[type="checkbox"] {
            cursor: pointer;
        }

        .datetime-input {
            padding: 10px 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .add-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(255, 154, 139, 0.3);
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        /* Filter Section */
        .filter-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid var(--border-color);
            background: var(--bg-color);
            border-radius: 25px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
            border-color: transparent;
        }

        .search-input {
            padding: 10px 20px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            font-size: 0.9rem;
            min-width: 200px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .batch-actions {
            display: flex;
            gap: 10px;
        }

        .batch-btn {
            padding: 10px 20px;
            border: none;
            background: var(--secondary-color);
            color: var(--text-primary);
            border-radius: 25px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .batch-btn:hover {
            background: var(--primary-light);
            color: white;
        }

        .batch-btn.delete {
            background: #FFE5E5;
            color: #FF6B6B;
        }

        .batch-btn.delete:hover {
            background: #FF6B6B;
            color: white;
        }

        /* Task List */
        .task-list {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            min-height: 300px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
            margin-bottom: 15px;
            background: var(--bg-color);
            border-radius: 15px;
            transition: var(--transition);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-item:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow);
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-content {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            border: 3px solid var(--primary-light);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .task-checkbox:hover {
            border-color: var(--primary-color);
        }

        .task-checkbox.checked {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            border-color: var(--primary-color);
        }

        .task-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .task-content-wrapper {
            flex: 1;
            min-width: 0;
        }

        .task-content {
            font-size: 1rem;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .task-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .priority-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .priority-high {
            background: rgba(255, 107, 107, 0.15);
            color: var(--priority-high);
        }

        .priority-medium {
            background: rgba(255, 179, 71, 0.15);
            color: var(--priority-medium);
        }

        .priority-low {
            background: rgba(119, 221, 119, 0.15);
            color: var(--priority-low);
        }

        .reminder-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: rgba(255, 154, 139, 0.1);
            border-radius: 10px;
        }

        .task-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: var(--card-bg);
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .action-btn:hover {
            background: var(--primary-light);
            color: white;
            transform: scale(1.1);
        }

        .action-btn.delete:hover {
            background: #FF6B6B;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            transform: scale(0.9);
            transition: var(--transition);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 1.4rem;
            color: var(--text-primary);
        }

        .modal-body {
            margin-bottom: 25px;
        }

        .modal-input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
        }

        .modal-btn.cancel {
            background: var(--bg-color);
            color: var(--text-secondary);
        }

        .modal-btn.confirm {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
        }

        /* Toast Notification */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
        }

        .toast {
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: var(--shadow-hover);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastIn 0.3s ease-out;
            min-width: 250px;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .toast.success {
            border-left: 4px solid var(--priority-low);
        }

        .toast.error {
            border-left: 4px solid var(--priority-high);
        }

        .toast.info {
            border-left: 4px solid var(--primary-color);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .input-group {
                flex-direction: column;
            }

            .task-input {
                min-width: 100%;
            }

            .filter-section {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                justify-content: center;
            }

            .task-item {
                flex-wrap: wrap;
            }

            .task-actions {
                width: 100%;
                justify-content: flex-end;
                margin-top: 10px;
            }
        }

        /* Checkbox for batch selection */
        .batch-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--primary-light);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .batch-checkbox:hover {
            border-color: var(--primary-color);
        }

        .batch-checkbox.checked {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        .batch-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 data-i18n="appTitle">温馨待办</h1>
            <p data-i18n="appSubtitle">让每一天都井井有条</p>
            <div class="header-controls">
                <div class="lang-switch">
                    <button class="lang-btn active" data-lang="zh">中文</button>
                    <button class="lang-btn" data-lang="en">English</button>
                </div>
            </div>
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-number" id="totalTasks">0</div>
                    <div class="stat-label" data-i18n="totalTasks">全部任务</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="pendingTasks">0</div>
                    <div class="stat-label" data-i18n="pendingTasks">待完成</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="completedTasks">0</div>
                    <div class="stat-label" data-i18n="completedTasks">已完成</div>
                </div>
            </div>
        </header>

        <!-- Task Input Section -->
        <section class="input-section">
            <div class="input-group">
                <input type="text" class="task-input" id="taskInput" data-i18n-placeholder="taskPlaceholder" placeholder="输入新任务...">
                <select class="priority-select" id="prioritySelect">
                    <option value="high" data-i18n="priorityHigh">高优先级</option>
                    <option value="medium" data-i18n="priorityMedium" selected>中优先级</option>
                    <option value="low" data-i18n="priorityLow">低优先级</option>
                </select>
            </div>
            <div class="reminder-section">
                <span class="reminder-label" data-i18n="reminderLabel">提醒方式：</span>
                <div class="reminder-type">
                    <label class="reminder-option">
                        <input type="checkbox" id="smsReminder" value="sms">
                        <span data-i18n="sms">短信</span>
                    </label>
                    <label class="reminder-option">
                        <input type="checkbox" id="dingtalkReminder" value="dingtalk">
                        <span data-i18n="dingtalk">钉钉</span>
                    </label>
                    <label class="reminder-option">
                        <input type="checkbox" id="feishuReminder" value="feishu">
                        <span data-i18n="feishu">飞书</span>
                    </label>
                </div>
                <input type="datetime-local" class="datetime-input" id="reminderTime">
            </div>
            <button class="add-btn" id="addTaskBtn" data-i18n="addTask">添加任务</button>
        </section>

        <!-- Filter Section -->
        <section class="filter-section">
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all" data-i18n="filterAll">全部</button>
                <button class="filter-btn" data-filter="pending" data-i18n="filterPending">待完成</button>
                <button class="filter-btn" data-filter="completed" data-i18n="filterCompleted">已完成</button>
                <button class="filter-btn" data-filter="high" data-i18n="filterHigh">高优先级</button>
            </div>
            <input type="text" class="search-input" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="搜索任务...">
            <div class="batch-actions">
                <button class="batch-btn" id="selectAllBtn" data-i18n="selectAll">全选</button>
                <button class="batch-btn delete" id="batchDeleteBtn" data-i18n="batchDelete">批量删除</button>
            </div>
        </section>

        <!-- Task List -->
        <section class="task-list" id="taskList">
            <div class="empty-state">
                <div class="empty-state-icon">📝</div>
                <h3 data-i18n="emptyTitle">还没有任务</h3>
                <p data-i18n="emptyDesc">添加你的第一个任务，开始高效的一天！</p>
            </div>
        </section>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h3 data-i18n="editTask">编辑任务</h3>
            </div>
            <div class="modal-body">
                <input type="text" class="modal-input" id="editTaskInput">
                <select class="modal-input" id="editPrioritySelect">
                    <option value="high" data-i18n="priorityHigh">高优先级</option>
                    <option value="medium" data-i18n="priorityMedium">中优先级</option>
                    <option value="low" data-i18n="priorityLow">低优先级</option>
                </select>
                <input type="datetime-local" class="modal-input" id="editReminderTime">
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel" id="cancelEdit" data-i18n="cancel">取消</button>
                <button class="modal-btn confirm" id="confirmEdit" data-i18n="save">保存</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // Internationalization
        const i18n = {
            zh: {
                appTitle: '温馨待办',
                appSubtitle: '让每一天都井井有条',
                totalTasks: '全部任务',
                pendingTasks: '待完成',
                completedTasks: '已完成',
                taskPlaceholder: '输入新任务...',
                priorityHigh: '高优先级',
                priorityMedium: '中优先级',
                priorityLow: '低优先级',
                reminderLabel: '提醒方式：',
                sms: '短信',
                dingtalk: '钉钉',
                feishu: '飞书',
                addTask: '添加任务',
                filterAll: '全部',
                filterPending: '待完成',
                filterCompleted: '已完成',
                filterHigh: '高优先级',
                searchPlaceholder: '搜索任务...',
                selectAll: '全选',
                batchDelete: '批量删除',
                emptyTitle: '还没有任务',
                emptyDesc: '添加你的第一个任务，开始高效的一天！',
                editTask: '编辑任务',
                cancel: '取消',
                save: '保存',
                taskAdded: '任务添加成功！',
                taskUpdated: '任务更新成功！',
                taskDeleted: '任务删除成功！',
                tasksDeleted: '个任务已删除',
                confirmDelete: '确定要删除这个任务吗？',
                pleaseEnterTask: '请输入任务内容',
                noTaskSelected: '请先选择任务',
                priorityLabels: { high: '高', medium: '中', low: '低' }
            },
            en: {
                appTitle: 'Warm Todo',
                appSubtitle: 'Make every day organized',
                totalTasks: 'Total Tasks',
                pendingTasks: 'Pending',
                completedTasks: 'Completed',
                taskPlaceholder: 'Enter a new task...',
                priorityHigh: 'High Priority',
                priorityMedium: 'Medium Priority',
                priorityLow: 'Low Priority',
                reminderLabel: 'Reminder:',
                sms: 'SMS',
                dingtalk: 'DingTalk',
                feishu: 'Feishu',
                addTask: 'Add Task',
                filterAll: 'All',
                filterPending: 'Pending',
                filterCompleted: 'Completed',
                filterHigh: 'High Priority',
                searchPlaceholder: 'Search tasks...',
                selectAll: 'Select All',
                batchDelete: 'Batch Delete',
                emptyTitle: 'No tasks yet',
                emptyDesc: 'Add your first task and start a productive day!',
                editTask: 'Edit Task',
                cancel: 'Cancel',
                save: 'Save',
                taskAdded: 'Task added successfully!',
                taskUpdated: 'Task updated successfully!',
                taskDeleted: 'Task deleted successfully!',
                tasksDeleted: 'tasks deleted',
                confirmDelete: 'Are you sure you want to delete this task?',
                pleaseEnterTask: 'Please enter task content',
                noTaskSelected: 'Please select tasks first',
                priorityLabels: { high: 'High', medium: 'Med', low: 'Low' }
            }
        };

        let currentLang = 'zh';
        let tasks = [];
        let currentFilter = 'all';
        let editingTaskId = null;
        let selectedTasks = new Set();

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadTasks();
            loadLanguage();
            renderTasks();
            updateStats();
            setupEventListeners();
        });

        // Language functions
        function loadLanguage() {
            const savedLang = localStorage.getItem('todo-lang');
            if (savedLang) {
                currentLang = savedLang;
            }
            updateLanguage();
        }

        function updateLanguage() {
            const texts = i18n[currentLang];
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (texts[key]) {
                    el.textContent = texts[key];
                }
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (texts[key]) {
                    el.placeholder = texts[key];
                }
            });

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
            });

            renderTasks();
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('todo-lang', lang);
            updateLanguage();
        }

        // Task management
        function loadTasks() {
            const saved = localStorage.getItem('todo-tasks');
            if (saved) {
                tasks = JSON.parse(saved);
            }
        }

        function saveTasks() {
            localStorage.setItem('todo-tasks', JSON.stringify(tasks));
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const priority = document.getElementById('prioritySelect').value;
            const reminderTime = document.getElementById('reminderTime').value;
            
            const reminders = [];
            if (document.getElementById('smsReminder').checked) reminders.push('sms');
            if (document.getElementById('dingtalkReminder').checked) reminders.push('dingtalk');
            if (document.getElementById('feishuReminder').checked) reminders.push('feishu');

            const content = input.value.trim();
            if (!content) {
                showToast(i18n[currentLang].pleaseEnterTask, 'error');
                return;
            }

            const task = {
                id: Date.now(),
                content,
                priority,
                completed: false,
                createdAt: new Date().toISOString(),
                reminders,
                reminderTime
            };

            tasks.unshift(task);
            saveTasks();
            renderTasks();
            updateStats();
            
            input.value = '';
            document.getElementById('reminderTime').value = '';
            document.getElementById('smsReminder').checked = false;
            document.getElementById('dingtalkReminder').checked = false;
            document.getElementById('feishuReminder').checked = false;
            
            showToast(i18n[currentLang].taskAdded, 'success');
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
                updateStats();
            }
        }

        function deleteTask(id) {
            if (confirm(i18n[currentLang].confirmDelete)) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderTasks();
                updateStats();
                showToast(i18n[currentLang].taskDeleted, 'success');
            }
        }

        function openEditModal(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            editingTaskId = id;
            document.getElementById('editTaskInput').value = task.content;
            document.getElementById('editPrioritySelect').value = task.priority;
            document.getElementById('editReminderTime').value = task.reminderTime || '';
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editingTaskId = null;
        }

        function saveEdit() {
            if (!editingTaskId) return;

            const task = tasks.find(t => t.id === editingTaskId);
            if (task) {
                task.content = document.getElementById('editTaskInput').value.trim();
                task.priority = document.getElementById('editPrioritySelect').value;
                task.reminderTime = document.getElementById('editReminderTime').value;
                
                saveTasks();
                renderTasks();
                closeEditModal();
                showToast(i18n[currentLang].taskUpdated, 'success');
            }
        }

        function toggleSelectTask(id) {
            if (selectedTasks.has(id)) {
                selectedTasks.delete(id);
            } else {
                selectedTasks.add(id);
            }
            renderTasks();
        }

        function selectAll() {
            const visibleTasks = getFilteredTasks();
            if (selectedTasks.size === visibleTasks.length) {
                selectedTasks.clear();
            } else {
                selectedTasks = new Set(visibleTasks.map(t => t.id));
            }
            renderTasks();
        }

        function batchDelete() {
            if (selectedTasks.size === 0) {
                showToast(i18n[currentLang].noTaskSelected, 'error');
                return;
            }

            if (confirm(i18n[currentLang].confirmDelete)) {
                tasks = tasks.filter(t => !selectedTasks.has(t.id));
                selectedTasks.clear();
                saveTasks();
                renderTasks();
                updateStats();
                showToast(selectedTasks.size + ' ' + i18n[currentLang].tasksDeleted, 'success');
            }
        }

        function getFilteredTasks() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            return tasks.filter(task => {
                // Filter by status/priority
                if (currentFilter === 'pending' && task.completed) return false;
                if (currentFilter === 'completed' && !task.completed) return false;
                if (currentFilter === 'high' && task.priority !== 'high') return false;
                
                // Filter by search term
                if (searchTerm && !task.content.toLowerCase().includes(searchTerm)) return false;
                
                return true;
            });
        }

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            const filteredTasks = getFilteredTasks();

            if (filteredTasks.length === 0) {
                taskList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <h3 data-i18n="emptyTitle">${i18n[currentLang].emptyTitle}</h3>
                        <p data-i18n="emptyDesc">${i18n[currentLang].emptyDesc}</p>
                    </div>
                `;
                return;
            }

            taskList.innerHTML = filteredTasks.map(task => `
                <div class="task-item ${task.completed ? 'completed' : ''}">
                    <div class="batch-checkbox ${selectedTasks.has(task.id) ? 'checked' : ''}" 
                         onclick="toggleSelectTask(${task.id})"></div>
                    <div class="task-checkbox ${task.completed ? 'checked' : ''}" 
                         onclick="toggleTask(${task.id})"></div>
                    <div class="task-content-wrapper">
                        <div class="task-content">${escapeHtml(task.content)}</div>
                        <div class="task-meta">
                            <span class="priority-badge priority-${task.priority}">
                                ${i18n[currentLang].priorityLabels[task.priority]}
                            </span>
                            ${task.reminders.length > 0 ? `
                                <span class="reminder-badge">
                                    ⏰ ${task.reminders.map(r => {
                                        const labels = { sms: i18n[currentLang].sms, dingtalk: i18n[currentLang].dingtalk, feishu: i18n[currentLang].feishu };
                                        return labels[r];
                                    }).join(', ')}
                                    ${task.reminderTime ? ' - ' + formatDateTime(task.reminderTime) : ''}
                                </span>
                            ` : ''}
                        </div>
                    </div>
                    <div class="task-actions">
                        <button class="action-btn" onclick="openEditModal(${task.id})" title="编辑">✏️</button>
                        <button class="action-btn delete" onclick="deleteTask(${task.id})" title="删除">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('totalTasks').textContent = tasks.length;
            document.getElementById('pendingTasks').textContent = tasks.filter(t => !t.completed).length;
            document.getElementById('completedTasks').textContent = tasks.filter(t => t.completed).length;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDateTime(dateTimeStr) {
            if (!dateTimeStr) return '';
            const date = new Date(dateTimeStr);
            return date.toLocaleString(currentLang === 'zh' ? 'zh-CN' : 'en-US', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icons = { success: '✓', error: '✗', info: 'ℹ' };
            toast.innerHTML = `<span>${icons[type]}</span><span>${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function setupEventListeners() {
            // Language switch
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
            });

            // Add task
            document.getElementById('addTaskBtn').addEventListener('click', addTask);
            document.getElementById('taskInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTask();
            });

            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderTasks();
                });
            });

            // Search
            document.getElementById('searchInput').addEventListener('input', renderTasks);

            // Batch actions
            document.getElementById('selectAllBtn').addEventListener('click', selectAll);
            document.getElementById('batchDeleteBtn').addEventListener('click', batchDelete);

            // Modal
            document.getElementById('cancelEdit').addEventListener('click', closeEditModal);
            document.getElementById('confirmEdit').addEventListener('click', saveEdit);
            document.getElementById('editModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('editModal')) closeEditModal();
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeEditModal();
            });
        }
    </script>
</body>
</html>
