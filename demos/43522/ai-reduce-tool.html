<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI文档一键精简助手 - 学习工作专用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background-color: #f0f7ff;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 122, 255, 0.1);
        }

        .title {
            text-align: center;
            color: #0066cc;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .mode-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .mode-btn {
            padding: 10px 24px;
            border: 1px solid #0066cc;
            border-radius: 30px;
            background: #fff;
            color: #0066cc;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .mode-btn.active {
            background: #0066cc;
            color: #fff;
        }

        .mode-btn:hover {
            background: #e6f2ff;
        }

        .input-box, .output-box {
            width: 100%;
            height: 220px;
            border: 1px solid #dce8f5;
            border-radius: 12px;
            padding: 15px;
            font-size: 15px;
            line-height: 1.6;
            resize: none;
            margin-bottom: 20px;
            outline: none;
            transition: border 0.3s ease;
        }

        .input-box:focus, .output-box:focus {
            border-color: #0066cc;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .operate-btn {
            padding: 12px 36px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .primary-btn {
            background: #0066cc;
            color: #fff;
        }

        .primary-btn:hover {
            background: #0052a3;
        }

        .default-btn {
            background: #f5f7fa;
            color: #333;
            border: 1px solid #ddd;
        }

        .default-btn:hover {
            background: #e8ebf0;
        }

        .tip-text {
            text-align: center;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">AI文档一键精简助手</h1>

        <div class="mode-box">
            <button class="mode-btn active" data-mode="light">轻度提炼</button>
            <button class="mode-btn" data-mode="core">核心摘要</button>
            <button class="mode-btn" data-mode="outline">极简大纲</button>
        </div>

        <textarea class="input-box" placeholder="请粘贴需要精简的文档、报告、文献、会议纪要等文本内容..."></textarea>

        <div class="btn-group">
            <button class="operate-btn primary-btn" id="reduceBtn">一键精简</button>
            <button class="operate-btn default-btn" id="copyBtn">一键复制结果</button>
            <button class="operate-btn default-btn" id="clearBtn">清空内容</button>
        </div>

        <textarea class="output-box" placeholder="精简后的核心内容将展示在这里..." readonly></textarea>

        <p class="tip-text">适配学习、办公全场景 | 轻量化无广告 | 免费高效文档精简工具</p>
    </div>

    <script>
        // 模式切换
        const modeBtns = document.querySelectorAll('.mode-btn');
        let currentMode = 'light';

        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
            });
        });

        // 模拟AI精简逻辑
        const reduceBtn = document.getElementById('reduceBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const inputBox = document.querySelector('.input-box');
        const outputBox = document.querySelector('.output-box');

        reduceBtn.addEventListener('click', () => {
            const inputText = inputBox.value.trim();
            if (!inputText) {
                alert('请输入需要精简的文本内容！');
                return;
            }

            // 根据不同模式精简文本
            let result = '';
            if (currentMode === 'light') {
                result = `【轻度提炼结果】\n${inputText.substring(0, Math.floor(inputText.length / 2))}...\n已过滤冗余话术，保留完整基础信息`;
            } else if (currentMode === 'core') {
                result = `【核心摘要结果】\n本次文本核心内容：聚焦核心观点，剔除无效修饰内容，提炼关键信息，适配办公汇报、学习总结场景。`;
            } else {
                result = `【极简大纲结果】\n1. 文本核心主题\n2. 关键信息要点\n3. 核心结论总结\n适配快速浏览、复盘梳理需求`;
            }
            outputBox.value = result;
        });

        // 复制结果
        copyBtn.addEventListener('click', () => {
            if (!outputBox.value.trim()) {
                alert('暂无可复制的精简结果！');
                return;
            }
            navigator.clipboard.writeText(outputBox.value).then(() => {
                alert('结果复制成功！');
            });
        });

        // 清空内容
        clearBtn.addEventListener('click', () => {
            inputBox.value = '';
            outputBox.value = '';
        });
    </script>
</body>
</html>
