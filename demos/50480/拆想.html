<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拆想 — 拆解问题，想清楚再动手</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #6366f1;
  --primary-light: #818cf8;
  --primary-bg: #eef2ff;
  --accent: #f59e0b;
  --danger: #ef4444;
  --success: #10b981;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-300: #d1d5db;
  --gray-400: #9ca3af;
  --gray-500: #6b7280;
  --gray-600: #4b5563;
  --gray-700: #374151;
  --gray-800: #1f2937;
  --gray-900: #111827;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05);
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gray-50); color: var(--gray-800); line-height: 1.6; min-height: 100vh; }

/* Layout */
.app { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 260px; background: var(--gray-900); color: white; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,.1); }
.sidebar-header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sidebar-header h1 .icon { font-size: 24px; }
.sidebar-header p { font-size: 12px; color: var(--gray-400); margin-top: 4px; }
.sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; cursor: pointer; font-size: 14px; color: var(--gray-300); transition: all .2s; border-left: 3px solid transparent; }
.nav-item:hover { background: rgba(255,255,255,.05); color: white; }
.nav-item.active { background: rgba(99,102,241,.2); color: var(--primary-light); border-left-color: var(--primary); }
.nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; }
.nav-section { padding: 16px 20px 8px; font-size: 11px; color: var(--gray-500); text-transform: uppercase; letter-spacing: 1px; }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,.1); }
.sidebar-footer .template-btn { width: 100%; padding: 8px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .2s; }
.sidebar-footer .template-btn:hover { background: var(--primary-light); }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: white; border-bottom: 1px solid var(--gray-200); }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-left .breadcrumb { font-size: 14px; color: var(--gray-500); }
.topbar-left .breadcrumb span { color: var(--gray-800); font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.topbar-btn { padding: 6px 14px; border: 1px solid var(--gray-200); border-radius: 8px; background: white; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all .2s; }
.topbar-btn:hover { border-color: var(--primary); color: var(--primary); }
.topbar-btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
.topbar-btn.primary:hover { background: var(--primary-light); }

.content { flex: 1; overflow-y: auto; padding: 24px; }

/* Pages */
.page { display: none; }
.page.active { display: block; }

/* Welcome / Input Page */
.welcome { max-width: 720px; margin: 0 auto; text-align: center; padding-top: 80px; }
.welcome h2 { font-size: 32px; font-weight: 800; margin-bottom: 8px; background: linear-gradient(135deg, var(--primary), #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.welcome p { font-size: 16px; color: var(--gray-500); margin-bottom: 40px; }
.input-box { position: relative; }
.input-box textarea { width: 100%; padding: 16px 20px; border: 2px solid var(--gray-200); border-radius: var(--radius); font-size: 16px; resize: none; height: 80px; outline: none; transition: all .3s; font-family: inherit; }
.input-box textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
.input-box .submit-btn { position: absolute; right: 12px; bottom: 12px; padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all .2s; }
.input-box .submit-btn:hover { background: var(--primary-light); }
.input-box .submit-btn:disabled { opacity: .5; cursor: not-allowed; }
.quick-starts { margin-top: 32px; }
.quick-starts h3 { font-size: 13px; color: var(--gray-400); margin-bottom: 12px; }
.quick-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.quick-tag { padding: 6px 14px; background: var(--primary-bg); color: var(--primary); border-radius: 20px; font-size: 13px; cursor: pointer; transition: all .2s; border: 1px solid transparent; }
.quick-tag:hover { border-color: var(--primary); background: white; }

/* Loading Animation */
.loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,.85); z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
.loading-overlay.active { display: flex; }
.loading-spinner { width: 48px; height: 48px; border: 3px solid var(--gray-200); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { margin-top: 16px; font-size: 15px; color: var(--gray-500); }
.loading-steps { margin-top: 12px; font-size: 13px; color: var(--gray-400); }
.loading-steps .done { color: var(--success); }

/* Scaffold Workspace */
.workspace { max-width: 900px; margin: 0 auto; }
.workspace-header { margin-bottom: 24px; }
.workspace-header .question { font-size: 22px; font-weight: 700; color: var(--gray-900); }
.workspace-header .meta { font-size: 13px; color: var(--gray-400); margin-top: 4px; display: flex; align-items: center; gap: 12px; }
.progress-bar { margin-top: 12px; height: 6px; background: var(--gray-200); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #a855f7); border-radius: 3px; transition: width .5s ease; }
.progress-label { font-size: 12px; color: var(--gray-400); margin-top: 4px; }

/* Dimension Cards */
.dim-card { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; transition: all .3s; animation: cardIn .4s ease backwards; }
.dim-card:nth-child(1) { animation-delay: .1s; }
.dim-card:nth-child(2) { animation-delay: .2s; }
.dim-card:nth-child(3) { animation-delay: .3s; }
.dim-card:nth-child(4) { animation-delay: .4s; }
.dim-card:nth-child(5) { animation-delay: .5s; }
.dim-card:nth-child(6) { animation-delay: .6s; }
@keyframes cardIn { from { opacity: 0; transform: translateY(16px); } }
.dim-card:hover { box-shadow: var(--shadow-lg); }
.dim-card.has-conflict { border-color: var(--danger); }
.dim-card-header { display: flex; align-items: center; padding: 14px 16px; cursor: pointer; user-select: none; }
.dim-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-right: 12px; flex-shrink: 0; }
.dim-title { flex: 1; font-size: 15px; font-weight: 600; }
.dim-guide { font-size: 12px; color: var(--gray-400); margin-left: 8px; font-weight: 400; }
.dim-toggle { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; color: var(--gray-400); transition: transform .3s; }
.dim-card.open .dim-toggle { transform: rotate(180deg); }
.dim-progress { margin-left: 12px; font-size: 11px; color: var(--gray-400); display: flex; align-items: center; gap: 4px; }
.dim-progress .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gray-300); }
.dim-progress .dot.filled { background: var(--success); }
.dim-card-body { padding: 0 16px; max-height: 0; overflow: hidden; transition: all .3s ease; }
.dim-card.open .dim-card-body { padding: 0 16px 16px; max-height: 600px; }
.dim-textarea { width: 100%; min-height: 80px; padding: 12px; border: 1px solid var(--gray-200); border-radius: 8px; font-size: 14px; resize: vertical; outline: none; font-family: inherit; transition: border-color .2s; line-height: 1.7; }
.dim-textarea:focus { border-color: var(--primary); }
.dim-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.dim-action-btn { padding: 4px 10px; border: 1px solid var(--gray-200); border-radius: 6px; background: white; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all .2s; color: var(--gray-600); }
.dim-action-btn:hover { border-color: var(--primary); color: var(--primary); }
.dim-action-btn.delete { color: var(--danger); }
.dim-action-btn.delete:hover { border-color: var(--danger); }

/* Question Bubble */
.question-bubble { background: var(--primary-bg); border: 1px solid rgba(99,102,241,.2); border-radius: 10px; padding: 10px 14px; margin-top: 8px; font-size: 13px; color: var(--primary); display: flex; align-items: flex-start; gap: 8px; animation: bubbleIn .3s ease; }
@keyframes bubbleIn { from { opacity: 0; transform: scale(.9); } }
.question-bubble .qb-icon { flex-shrink: 0; margin-top: 1px; }
.question-bubble .qb-text { flex: 1; }
.question-bubble .qb-close { cursor: pointer; opacity: .5; flex-shrink: 0; }
.question-bubble .qb-close:hover { opacity: 1; }

/* Conflict Line */
.conflict-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: rgba(239,68,68,.1); color: var(--danger); border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 8px; }
.conflict-tip { background: rgba(239,68,68,.05); border: 1px solid rgba(239,68,68,.2); border-radius: 8px; padding: 10px 14px; margin-top: 8px; font-size: 13px; color: var(--danger); display: flex; align-items: flex-start; gap: 8px; }

/* Convergence Panel */
.convergence-panel { background: white; border: 2px solid var(--primary); border-radius: var(--radius); padding: 24px; margin-top: 24px; animation: cardIn .4s ease; }
.convergence-panel h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.convergence-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--gray-200); padding-bottom: 0; }
.convergence-tab { padding: 8px 16px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--gray-500); transition: all .2s; }
.convergence-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.convergence-content { min-height: 100px; }
.summary-block { font-size: 14px; line-height: 1.8; color: var(--gray-700); }
.summary-block p { margin-bottom: 8px; }
.decision-matrix { width: 100%; border-collapse: collapse; font-size: 13px; }
.decision-matrix th, .decision-matrix td { padding: 8px 12px; border: 1px solid var(--gray-200); text-align: left; }
.decision-matrix th { background: var(--gray-50); font-weight: 600; }
.decision-matrix td { background: white; }
.action-items { list-style: none; }
.action-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--gray-100); font-size: 14px; }
.action-item .check { width: 18px; height: 18px; border: 2px solid var(--gray-300); border-radius: 4px; cursor: pointer; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all .2s; }
.action-item .check.checked { background: var(--success); border-color: var(--success); color: white; }
.action-item.done { text-decoration: line-through; color: var(--gray-400); }

/* Community Page */
.community { max-width: 900px; margin: 0 auto; }
.community h2 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.community .subtitle { font-size: 14px; color: var(--gray-400); margin-bottom: 24px; }
.template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.template-card { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 20px; cursor: pointer; transition: all .2s; }
.template-card:hover { box-shadow: var(--shadow-lg); border-color: var(--primary); }
.template-card .tc-icon { font-size: 28px; margin-bottom: 8px; }
.template-card h4 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.template-card p { font-size: 12px; color: var(--gray-400); line-height: 1.5; }
.template-card .tc-meta { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 11px; color: var(--gray-400); }
.template-card .tc-meta .uses { color: var(--primary); font-weight: 600; }

/* History Page */
.history { max-width: 900px; margin: 0 auto; }
.history h2 { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
.history-item { display: flex; align-items: center; gap: 16px; padding: 16px; background: white; border: 1px solid var(--gray-200); border-radius: var(--radius); margin-bottom: 8px; cursor: pointer; transition: all .2s; }
.history-item:hover { box-shadow: var(--shadow); border-color: var(--primary); }
.history-item .hi-date { font-size: 12px; color: var(--gray-400); width: 60px; flex-shrink: 0; }
.history-item .hi-question { font-size: 14px; font-weight: 500; flex: 1; }
.history-item .hi-progress { font-size: 12px; color: var(--gray-400); }
.history-item .hi-dims { font-size: 11px; color: var(--primary); background: var(--primary-bg); padding: 2px 8px; border-radius: 4px; }

/* Empty State */
.empty-state { text-align: center; padding: 60px 20px; color: var(--gray-400); }
.empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-state h3 { font-size: 16px; color: var(--gray-600); margin-bottom: 4px; }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { width: 60px; }
  .sidebar-header h1 span, .sidebar-header p, .nav-item span, .nav-section, .sidebar-footer .template-btn span { display: none; }
  .nav-item { justify-content: center; padding: 12px; }
  .sidebar-footer .template-btn { padding: 8px; }
}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1><span class="icon">🧩</span> <span>拆想</span></h1>
      <p>拆解问题，想清楚再动手</p>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">工作台</div>
      <div class="nav-item active" data-page="workspace" onclick="switchPage('workspace')">
        <span class="nav-icon">🧩</span> <span>当前问题</span>
      </div>
      <div class="nav-item" data-page="history" onclick="switchPage('history')">
        <span class="nav-icon">📚</span> <span>思考记录</span>
      </div>
      <div class="nav-section">发现</div>
      <div class="nav-item" data-page="community" onclick="switchPage('community')">
        <span class="nav-icon">🌐</span> <span>脚手架社区</span>
      </div>
    </div>
    <div class="sidebar-footer">
      <button class="template-btn" onclick="switchPage('workspace')">
        <span>✨</span> <span>开始新思考</span>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="breadcrumb">拆想 / <span id="breadcrumb-current">当前问题</span></div>
      </div>
      <div class="topbar-right" id="topbar-actions" style="display:none;">
        <button class="topbar-btn" onclick="checkConflicts()">🔍 检测矛盾</button>
        <button class="topbar-btn" onclick="generateConvergence()">✨ 收敛思考</button>
        <button class="topbar-btn primary" onclick="exportResult()">📥 导出</button>
      </div>
    </div>

    <div class="content">
      <!-- Workspace Page -->
      <div class="page active" id="page-workspace">
        <div class="welcome" id="welcome-section">
          <h2>先拆开，再想清楚</h2>
          <p>输入你的问题，拆想帮你展开思考维度，你来做判断。</p>
          <div class="input-box">
            <textarea id="question-input" placeholder="描述你在思考的问题，比如：要不要做会员体系？如何选择技术栈？这次项目复盘该从哪些角度入手？"></textarea>
            <button class="submit-btn" id="submit-btn" onclick="generateScaffold()" disabled>
              拆开想 🧩
            </button>
          </div>
          <div class="quick-starts">
            <h3>试试这些问题</h3>
            <div class="quick-tags">
              <div class="quick-tag" onclick="fillQuestion('要不要给产品加会员体系？')">会员体系决策</div>
              <div class="quick-tag" onclick="fillQuestion('新项目选React还是Vue？')">技术选型</div>
              <div class="quick-tag" onclick="fillQuestion('这次项目复盘从哪些角度入手？')">项目复盘</div>
              <div class="quick-tag" onclick="fillQuestion('要不要跳槽换工作？')">职业决策</div>
              <div class="quick-tag" onclick="fillQuestion('如何设计用户增长方案？')">增长方案</div>
            </div>
          </div>
        </div>

        <div class="workspace" id="workspace-section" style="display:none;">
          <div class="workspace-header">
            <div class="question" id="ws-question"></div>
            <div class="meta">
              <span id="ws-dim-count"></span>
              <span id="ws-time"></span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="ws-progress" style="width:0%"></div></div>
            <div class="progress-label" id="ws-progress-label">思考进度 0%</div>
          </div>
          <div id="dimensions-container"></div>
          <div id="convergence-container"></div>
        </div>
      </div>

      <!-- History Page -->
      <div class="page" id="page-history">
        <div class="history">
          <h2>思考记录</h2>
          <div id="history-list">
            <div class="empty-state">
              <div class="empty-icon">📝</div>
              <h3>还没有思考记录</h3>
              <p>开始一次思考，记录会出现在这里</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Community Page -->
      <div class="page" id="page-community">
        <div class="community">
          <h2>脚手架社区</h2>
          <p class="subtitle">复用他人验证过的思考框架，站在别人的肩膀上思考</p>
          <div class="template-grid" id="template-grid"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">正在搭建脚手架...</div>
  <div class="loading-steps" id="loading-steps"></div>
</div>

<script>
// ===== Data =====
const DIM_ICONS = ['🎯','👥','📊','⚖️','🏁','⚠️','💡','🔧','🔍','📈'];
const DIM_COLORS = ['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#06b6d4','#84cc16'];

const scaffoldTemplates = {
  decision: {
    name: '决策分析',
    dims: [
      { title: '核心目标', guide: '这个决策最根本要达成什么？', icon: '🎯' },
      { title: '选项列举', guide: '有哪些可选方案？各自的核心主张是什么？', icon: '📋' },
      { title: '优劣势对比', guide: '每个方案的优势和风险分别是什么？', icon: '⚖️' },
      { title: '成本评估', guide: '时间/金钱/人力成本如何？短期vs长期？', icon: '💰' },
      { title: '关键假设', guide: '每个方案依赖什么前提？这些假设成立吗？', icon: '🔍' },
      { title: '可逆性判断', guide: '选错了能回退吗？最坏情况能承受吗？', icon: '⚠️' }
    ]
  },
  review: {
    name: '项目复盘',
    dims: [
      { title: '目标达成度', guide: '原定目标是什么？实际达成了多少？', icon: '🎯' },
      { title: '关键转折点', guide: '过程中有哪些重要转折？什么导致了转折？', icon: '🔄' },
      { title: '意外因素', guide: '哪些事是没预料到的？对结果影响多大？', icon: '⚡' },
      { title: '可复用经验', guide: '哪些做法值得保留和推广？', icon: '💡' },
      { title: '待改进点', guide: '下次遇到类似情况，哪些地方可以做得不同？', icon: '🔧' }
    ]
  },
  growth: {
    name: '增长方案',
    dims: [
      { title: '增长目标', guide: '要增长什么指标？当前基线和目标值是多少？', icon: '📈' },
      { title: '用户漏斗', guide: '用户从接触到转化的关键步骤是什么？哪一步流失最多？', icon: '🔻' },
      { title: '渠道策略', guide: '有哪些可用渠道？各自特征和预期ROI？', icon: '📢' },
      { title: '资源约束', guide: '可用资源（人/钱/时间）有多少？优先投哪里？', icon: '💰' },
      { title: '风险与对冲', guide: '增长可能带来什么副作用？如何预防？', icon: '⚠️' },
      { title: '衡量指标', guide: '用什么指标判断效果？看短期还是长期？', icon: '📊' }
    ]
  },
  tech: {
    name: '技术选型',
    dims: [
      { title: '项目特征', guide: '项目类型、规模、性能要求、团队构成？', icon: '🏗️' },
      { title: '候选方案', guide: '有哪些备选技术？各自核心优势？', icon: '📋' },
      { title: '性能与扩展', guide: '各方案的性能天花板？未来扩展性如何？', icon: '🚀' },
      { title: '生态与社区', guide: '社区活跃度、文档质量、第三方库丰富度？', icon: '🌐' },
      { title: '团队适配', guide: '团队现有技术栈？学习曲线？招聘难度？', icon: '👥' },
      { title: '迁移成本', guide: '切换成本有多高？有锁定风险吗？', icon: '⚠️' }
    ]
  },
  career: {
    name: '职业决策',
    dims: [
      { title: '核心诉求', guide: '现阶段最看重什么？收入/成长/平衡/意义？', icon: '🎯' },
      { title: '机会对比', guide: '各选项的核心吸引力是什么？', icon: '⚖️' },
      { title: '成长空间', guide: '哪个选择3年后的可能性更大？', icon: '📈' },
      { title: '风险考量', guide: '最坏情况是什么？能承受吗？', icon: '⚠️' },
      { title: '生活影响', guide: '对日常生活的改变有哪些？通勤/作息/社交？', icon: '🏠' },
      { title: '可逆性', guide: '选错了能调整吗？有没有不可逆的代价？', icon: '🔄' }
    ]
  }
};

const communityTemplates = [
  { icon: '🎯', name: '产品决策框架', desc: '适用于"要不要做X"类决策问题，6个维度覆盖目标、选项、成本、风险', uses: 342, templateKey: 'decision' },
  { icon: '🔄', name: '项目复盘框架', desc: '5维度复盘：目标达成、转折点、意外、经验、改进', uses: 256, templateKey: 'review' },
  { icon: '📈', name: '增长方案框架', desc: '从目标、漏斗、渠道、资源、风险到衡量指标的完整框架', uses: 198, templateKey: 'growth' },
  { icon: '🚀', name: '技术选型框架', desc: '覆盖项目特征、性能、生态、团队、迁移6大维度', uses: 175, templateKey: 'tech' },
  { icon: '💼', name: '职业决策框架', desc: '诉求、机会、成长、风险、生活、可逆性6维分析', uses: 143, templateKey: 'career' },
  { icon: '🎨', name: '设计方案评审', desc: '从用户场景、交互合理性、视觉一致性、技术可行性评审设计方案', uses: 89, templateKey: null },
  { icon: '📊', name: '数据驱动决策', desc: '假设→数据→验证→结论的经典数据分析框架', uses: 67, templateKey: null },
  { icon: '🤝', name: '合作方评估', desc: '能力匹配、文化契合、风险控制、利益分配4维评估合作方', uses: 52, templateKey: null }
];

// ===== State =====
let currentScaffold = null;
let historyItems = [];

// ===== Question Input =====
const questionInput = document.getElementById('question-input');
const submitBtn = document.getElementById('submit-btn');

questionInput.addEventListener('input', () => {
  submitBtn.disabled = !questionInput.value.trim();
});
questionInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && questionInput.value.trim()) {
    e.preventDefault();
    generateScaffold();
  }
});

function fillQuestion(text) {
  questionInput.value = text;
  submitBtn.disabled = false;
  questionInput.focus();
}

// ===== Generate Scaffold =====
async function generateScaffold() {
  const question = questionInput.value.trim();
  if (!question) return;

  // Show loading
  const overlay = document.getElementById('loading-overlay');
  const loadingText = document.getElementById('loading-text');
  const loadingSteps = document.getElementById('loading-steps');
  overlay.classList.add('active');

  const steps = ['识别问题类型...', '匹配思考维度...', '生成引导框架...', '搭建完成！'];
  for (let i = 0; i < steps.length; i++) {
    loadingSteps.innerHTML = steps.slice(0, i + 1).map((s, j) =>
      `<div class="${j < i ? 'done' : ''}">${j < i ? '✓' : '⏳'} ${s}</div>`
    ).join('');
    loadingText.textContent = steps[i];
    await sleep(600);
  }
  await sleep(300);
  overlay.classList.remove('active');

  // Determine scaffold type
  const template = matchTemplate(question);
  currentScaffold = {
    question,
    template,
    dimensions: template.dims.map((d, i) => ({
      ...d,
      id: 'dim-' + i,
      content: '',
      open: i === 0,
      color: DIM_COLORS[i % DIM_COLORS.length],
      questions: [],
      conflicts: []
    })),
    createdAt: new Date(),
    convergence: null
  };

  renderWorkspace();
}

function matchTemplate(question) {
  const q = question.toLowerCase();
  if (q.includes('复盘') || q.includes('总结') || q.includes('回顾')) return scaffoldTemplates.review;
  if (q.includes('增长') || q.includes('拉新') || q.includes('获客') || q.includes('推广')) return scaffoldTemplates.growth;
  if (q.includes('选型') || q.includes('react') || q.includes('vue') || q.includes('技术') || q.includes('框架') || q.includes('栈')) return scaffoldTemplates.tech;
  if (q.includes('跳槽') || q.includes('工作') || q.includes('职业') || q.includes('离职') || q.includes('offer')) return scaffoldTemplates.career;
  if (q.includes('要不要') || q.includes('是否') || q.includes('决策') || q.includes('选择') || q.includes('会员')) return scaffoldTemplates.decision;
  return scaffoldTemplates.decision;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ===== Render Workspace =====
function renderWorkspace() {
  document.getElementById('welcome-section').style.display = 'none';
  document.getElementById('workspace-section').style.display = 'block';
  document.getElementById('topbar-actions').style.display = 'flex';
  document.getElementById('breadcrumb-current').textContent = '当前问题';

  document.getElementById('ws-question').textContent = currentScaffold.question;
  document.getElementById('ws-dim-count').textContent = `${currentScaffold.dimensions.length} 个思考维度`;
  document.getElementById('ws-time').textContent = formatTime(currentScaffold.createdAt);

  renderDimensions();
  updateProgress();
}

function renderDimensions() {
  const container = document.getElementById('dimensions-container');
  container.innerHTML = currentScaffold.dimensions.map((dim, i) => `
    <div class="dim-card ${dim.open ? 'open' : ''} ${dim.conflicts.length ? 'has-conflict' : ''}" id="${dim.id}" data-index="${i}">
      <div class="dim-card-header" onclick="toggleDim(${i})">
        <div class="dim-icon" style="background:${dim.color}20;color:${dim.color}">${dim.icon || DIM_ICONS[i % DIM_ICONS.length]}</div>
        <div class="dim-title">${dim.title}</div>
        <div class="dim-guide">${dim.guide}</div>
        ${dim.conflicts.length ? `<span class="conflict-badge">⚠ 矛盾</span>` : ''}
        <div class="dim-progress">${renderDimDots(dim)}</div>
        <div class="dim-toggle">▼</div>
      </div>
      <div class="dim-card-body">
        <textarea class="dim-textarea" placeholder="在这里写下你关于「${dim.title}」的思考..." 
          oninput="updateDimContent(${i}, this.value)" 
          onblur="checkDimForQuestion(${i})">${dim.content}</textarea>
        <div class="dim-actions">
          <button class="dim-action-btn" onclick="askQuestion(${i})">💬 追问</button>
          <button class="dim-action-btn" onclick="addSubDim(${i})">➕ 子维度</button>
          <button class="dim-action-btn delete" onclick="removeDim(${i})">🗑 移除</button>
        </div>
        <div id="dim-questions-${i}">
          ${dim.questions.map((q, qi) => renderQuestion(i, qi, q)).join('')}
        </div>
        ${dim.conflicts.map(c => `
          <div class="conflict-tip">
            <span>⚠️</span>
            <span>与「${c.with}」存在矛盾：${c.reason}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function renderDimDots(dim) {
  const filled = dim.content.trim().length > 10 ? 1 : 0;
  return `<span class="dot ${filled ? 'filled' : ''}"></span>`;
}

function renderQuestion(dimIdx, qIdx, q) {
  return `<div class="question-bubble" id="q-${dimIdx}-${qIdx}">
    <span class="qb-icon">💭</span>
    <span class="qb-text">${q.text}</span>
    <span class="qb-close" onclick="dismissQuestion(${dimIdx}, ${qIdx})">✕</span>
  </div>`;
}

// ===== Dimension Interactions =====
function toggleDim(index) {
  currentScaffold.dimensions[index].open = !currentScaffold.dimensions[index].open;
  const card = document.getElementById(currentScaffold.dimensions[index].id);
  card.classList.toggle('open');
}

function updateDimContent(index, value) {
  currentScaffold.dimensions[index].content = value;
  updateProgress();
}

function updateProgress() {
  const total = currentScaffold.dimensions.length;
  const filled = currentScaffold.dimensions.filter(d => d.content.trim().length > 10).length;
  const pct = Math.round((filled / total) * 100);
  document.getElementById('ws-progress').style.width = pct + '%';
  document.getElementById('ws-progress-label').textContent = `思考进度 ${pct}%（${filled}/${total} 维度已填写）`;
}

function checkDimForQuestion(index) {
  const dim = currentScaffold.dimensions[index];
  if (dim.content.trim().length > 5 && dim.content.trim().length < 30 && dim.questions.length === 0) {
    const questions = [
      '还有其他角度吗？',
      '能再具体一点吗？',
      '这个判断的依据是什么？',
      '有没有相反的可能性？'
    ];
    const q = questions[Math.floor(Math.random() * questions.length)];
    dim.questions.push({ text: q });
    renderDimensions();
  }
}

function askQuestion(index) {
  const dim = currentScaffold.dimensions[index];
  const depthQuestions = [
    `关于「${dim.title}」，你考虑过反面情况吗？`,
    `如果这个维度出了问题，影响有多大？`,
    `这个判断有数据支撑吗，还是直觉？`,
    `有没有你忽略的子维度？`,
    `和其他维度是否一致？会不会有矛盾？`
  ];
  const q = depthQuestions[Math.floor(Math.random() * depthQuestions.length)];
  dim.questions.push({ text: q });
  renderDimensions();
}

function dismissQuestion(dimIdx, qIdx) {
  currentScaffold.dimensions[dimIdx].questions.splice(qIdx, 1);
  renderDimensions();
}

function addSubDim(index) {
  const parent = currentScaffold.dimensions[index];
  const newDim = {
    id: 'dim-sub-' + Date.now(),
    title: parent.title + '（子维度）',
    guide: '细化这个维度的某个方面',
    icon: '📌',
    content: '',
    open: true,
    color: parent.color,
    questions: [],
    conflicts: []
  };
  currentScaffold.dimensions.splice(index + 1, 0, newDim);
  renderDimensions();
  updateProgress();
}

function removeDim(index) {
  if (currentScaffold.dimensions.length <= 2) return;
  currentScaffold.dimensions.splice(index, 1);
  renderDimensions();
  updateProgress();
}

// ===== Conflict Detection =====
function checkConflicts() {
  const conflictPairs = [
    { a: '核心目标', b: '成本评估', reason: '目标很高但成本评估不足，可能存在资源错配' },
    { a: '核心目标', b: '关键假设', reason: '目标依赖的假设是否都已验证？' },
    { a: '优劣势对比', b: '可逆性判断', reason: '劣势中的不可逆项需要特别关注' },
    { a: '核心诉求', b: '风险考量', reason: '核心诉求和风险容忍度是否匹配？' },
    { a: '增长目标', b: '资源约束', reason: '目标增速与可用资源是否匹配？' },
    { a: '候选方案', b: '团队适配', reason: '技术优势但如果团队不适配，实际收益可能打折' }
  ];

  let found = 0;
  currentScaffold.dimensions.forEach(d => d.conflicts = []);

  conflictPairs.forEach(pair => {
    const dimA = currentScaffold.dimensions.find(d => d.title.includes(pair.a) || pair.a.includes(d.title));
    const dimB = currentScaffold.dimensions.find(d => d.title.includes(pair.b) || pair.b.includes(d.title));
    if (dimA && dimB && dimA.content.trim().length > 10 && dimB.content.trim().length > 10) {
      dimA.conflicts.push({ with: dimB.title, reason: pair.reason });
      found++;
    }
  });

  renderDimensions();

  if (found === 0) {
    alert('✅ 未发现明显矛盾，各维度思考看起来比较一致！');
  }
}

// ===== Convergence =====
function generateConvergence() {
  const filled = currentScaffold.dimensions.filter(d => d.content.trim().length > 5);
  if (filled.length < 2) {
    alert('请至少填写2个维度的思考内容后再收敛');
    return;
  }

  const summary = filled.map(d => `【${d.title}】${d.content.trim()}`).join('\n');
  const actionItems = currentScaffold.dimensions
    .filter(d => d.content.trim().length <= 5)
    .map(d => `补充「${d.title}」维度的思考`);

  currentScaffold.convergence = { summary, actionItems };
  renderConvergence();
}

function renderConvergence() {
  const container = document.getElementById('convergence-container');
  const c = currentScaffold.convergence;
  if (!c) { container.innerHTML = ''; return; }

  container.innerHTML = `
    <div class="convergence-panel">
      <h3>🎯 思考收敛</h3>
      <div class="convergence-tabs">
        <div class="convergence-tab active" onclick="switchConvergenceTab('summary', this)">摘要整理</div>
        <div class="convergence-tab" onclick="switchConvergenceTab('matrix', this)">决策矩阵</div>
        <div class="convergence-tab" onclick="switchConvergenceTab('actions', this)">待决清单</div>
      </div>
      <div class="convergence-content" id="convergence-content">
        ${renderSummaryTab()}
      </div>
    </div>
  `;
}

function renderSummaryTab() {
  const filled = currentScaffold.dimensions.filter(d => d.content.trim().length > 5);
  return `<div class="summary-block">${filled.map(d => `<p><strong>${d.icon || '📌'} ${d.title}：</strong>${d.content.trim()}</p>`).join('')}</div>`;
}

function renderMatrixTab() {
  const filled = currentScaffold.dimensions.filter(d => d.content.trim().length > 5);
  return `<table class="decision-matrix">
    <tr><th>维度</th><th>你的思考</th><th>置信度</th></tr>
    ${filled.map(d => `<tr><td><strong>${d.icon || '📌'} ${d.title}</strong></td><td>${d.content.trim().substring(0, 60)}${d.content.length > 60 ? '...' : ''}</td><td style="text-align:center">${d.content.length > 30 ? '🟢 高' : '🟡 中'}</td></tr>`).join('')}
  </table>`;
}

function renderActionsTab() {
  const unfilled = currentScaffold.dimensions.filter(d => d.content.trim().length <= 5);
  const conflicts = currentScaffold.dimensions.filter(d => d.conflicts.length > 0);
  const items = [
    ...unfilled.map(d => `📝 补充「${d.title}」维度的思考`),
    ...conflicts.map(d => `⚠️ 解决「${d.title}」中的矛盾`)
  ];
  if (items.length === 0) items.push('✅ 所有维度已填写，无待决项');

  return `<ul class="action-items">${items.map((item, i) => `
    <li class="action-item" id="action-${i}">
      <div class="check" onclick="toggleAction(${i}, this)"></div>
      <span>${item}</span>
    </li>
  `).join('')}</ul>`;
}

function switchConvergenceTab(tab, el) {
  document.querySelectorAll('.convergence-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const content = document.getElementById('convergence-content');
  if (tab === 'summary') content.innerHTML = renderSummaryTab();
  else if (tab === 'matrix') content.innerHTML = renderMatrixTab();
  else if (tab === 'actions') content.innerHTML = renderActionsTab();
}

function toggleAction(index, el) {
  el.classList.toggle('checked');
  el.parentElement.classList.toggle('done');
  if (el.classList.contains('checked')) el.innerHTML = '✓';
  else el.innerHTML = '';
}

// ===== Export =====
function exportResult() {
  if (!currentScaffold) return;
  const filled = currentScaffold.dimensions.filter(d => d.content.trim().length > 5);
  const text = `# ${currentScaffold.question}\n\n${filled.map(d => `## ${d.icon || '📌'} ${d.title}\n${d.content.trim()}\n`).join('\n')}`;
  const blob = new Blob([text], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '拆想-' + currentScaffold.question.substring(0, 10) + '.md';
  a.click();

  // Save to history
  historyItems.unshift({
    question: currentScaffold.question,
    dimCount: currentScaffold.dimensions.length,
    filledCount: filled.length,
    date: new Date()
  });
}

// ===== Community =====
function renderCommunity() {
  const grid = document.getElementById('template-grid');
  grid.innerHTML = communityTemplates.map(t => `
    <div class="template-card" onclick="${t.templateKey ? `useTemplate('${t.templateKey}')` : `alert('该模板即将上线')`}">
      <div class="tc-icon">${t.icon}</div>
      <h4>${t.name}</h4>
      <p>${t.desc}</p>
      <div class="tc-meta">
        <span class="uses">${t.uses} 次复用</span>
      </div>
    </div>
  `).join('');
}

function useTemplate(key) {
  const template = scaffoldTemplates[key];
  if (!template) return;

  currentScaffold = {
    question: '使用「' + template.name + '」框架思考',
    template,
    dimensions: template.dims.map((d, i) => ({
      ...d,
      id: 'dim-' + i,
      content: '',
      open: i === 0,
      color: DIM_COLORS[i % DIM_COLORS.length],
      questions: [],
      conflicts: []
    })),
    createdAt: new Date(),
    convergence: null
  };

  switchPage('workspace');
  renderWorkspace();
}

// ===== History =====
function renderHistory() {
  const list = document.getElementById('history-list');
  if (historyItems.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📝</div><h3>还没有思考记录</h3><p>开始一次思考，导出后记录会出现在这里</p></div>`;
    return;
  }
  list.innerHTML = historyItems.map(h => `
    <div class="history-item">
      <div class="hi-date">${formatDate(h.date)}</div>
      <div class="hi-question">${h.question}</div>
      <div class="hi-progress">${h.filledCount}/${h.dimCount} 已填</div>
      <div class="hi-dims">${h.dimCount} 维</div>
    </div>
  `).join('');
}

// ===== Page Switching =====
function switchPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');

  const names = { workspace: '当前问题', history: '思考记录', community: '脚手架社区' };
  document.getElementById('breadcrumb-current').textContent = names[page] || '';

  if (page === 'workspace' && !currentScaffold) {
    document.getElementById('welcome-section').style.display = 'block';
    document.getElementById('workspace-section').style.display = 'none';
    document.getElementById('topbar-actions').style.display = 'none';
  }

  if (page === 'community') renderCommunity();
  if (page === 'history') renderHistory();
}

// ===== Utils =====
function formatTime(date) {
  return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}
function formatDate(date) {
  return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
}

// ===== Init =====
renderCommunity();
</script>
