<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowForge 心流工坊 · 沉浸式学习与工作专注空间</title>
<style>
  :root{
    --bg-0:#0a0a1a;
    --bg-1:#11112a;
    --glass:rgba(255,255,255,0.06);
    --glass-strong:rgba(255,255,255,0.10);
    --border:rgba(255,255,255,0.12);
    --text:#eef0ff;
    --muted:#9aa0c8;
    --accent:#7c5cff;
    --accent-2:#22d3ee;
    --accent-3:#ff6ab0;
    --success:#34d399;
    --warn:#fbbf24;
    --danger:#fb7185;
    --radius:18px;
    --shadow:0 20px 60px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text);
    background:var(--bg-0);
    overflow-x:hidden;
    min-height:100vh;
    position:relative;
  }
  /* animated background */
  .bg-mesh{
    position:fixed;inset:0;z-index:-2;overflow:hidden;
    background:radial-gradient(1200px 800px at 10% 10%,#1a1a3e 0%,transparent 60%),
               radial-gradient(900px 700px at 90% 20%,#2a1840 0%,transparent 55%),
               radial-gradient(1000px 900px at 50% 100%,#0d2540 0%,transparent 60%),
               var(--bg-0);
  }
  .blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.5;z-index:-1;animation:float 18s ease-in-out infinite}
  .blob.b1{width:480px;height:480px;background:#7c5cff;top:-100px;left:-100px}
  .blob.b2{width:520px;height:520px;background:#22d3ee;bottom:-150px;right:-120px;animation-delay:-6s}
  .blob.b3{width:360px;height:360px;background:#ff6ab0;top:40%;left:55%;animation-delay:-12s;opacity:.35}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1)}
    33%{transform:translate(40px,-30px) scale(1.05)}
    66%{transform:translate(-30px,40px) scale(.95)}
  }

  /* layout */
  .app{max-width:1320px;margin:0 auto;padding:28px 24px 80px}
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px;border-radius:var(--radius);
    background:var(--glass);backdrop-filter:blur(18px);
    border:1px solid var(--border);margin-bottom:24px;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:42px;height:42px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-3));
    display:grid;place-items:center;font-weight:800;font-size:20px;
    box-shadow:0 8px 24px rgba(124,92,255,.5);
  }
  .brand h1{font-size:18px;font-weight:700;letter-spacing:.3px}
  .brand .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .topbar-right{display:flex;align-items:center;gap:18px}
  .stat-chip{
    display:flex;align-items:center;gap:8px;
    padding:8px 14px;border-radius:999px;
    background:var(--glass-strong);border:1px solid var(--border);
    font-size:13px;
  }
  .stat-chip .num{font-weight:700;color:var(--accent-2)}
  .stat-chip .lbl{color:var(--muted)}

  .grid{
    display:grid;
    grid-template-columns:1.15fr 1fr 1fr;
    grid-template-rows:auto auto;
    gap:20px;
  }
  .card{
    background:var(--glass);
    backdrop-filter:blur(18px);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(255,255,255,.04),transparent 50%);
    pointer-events:none;
  }
  .card h2{
    font-size:14px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:1.2px;
    display:flex;align-items:center;gap:8px;margin-bottom:18px;
  }
  .card h2 .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

  /* timer card */
  .timer-card{grid-column:1;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:center}
  .mode-tabs{display:flex;gap:6px;background:rgba(0,0,0,.25);padding:5px;border-radius:12px;margin-bottom:24px}
  .mode-tabs button{
    border:none;background:transparent;color:var(--muted);
    padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;
    transition:all .25s;
  }
  .mode-tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent-3));color:#fff;box-shadow:0 4px 14px rgba(124,92,255,.4)}
  .timer-ring{
    position:relative;width:280px;height:280px;margin:10px 0 26px;
  }
  .timer-ring svg{transform:rotate(-90deg)}
  .ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:10}
  .ring-fg{fill:none;stroke:url(#grad);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
  .time-display{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .time-display .time{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .time-display .phase{font-size:13px;color:var(--muted);margin-top:6px;letter-spacing:1px}
  .timer-controls{display:flex;gap:12px;margin-bottom:18px}
  .btn{
    border:none;cursor:pointer;border-radius:12px;font-weight:600;
    transition:transform .15s, box-shadow .25s, background .25s;
    display:inline-flex;align-items:center;gap:8px;
  }
  .btn:active{transform:scale(.96)}
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-3));
    color:#fff;padding:13px 32px;font-size:15px;
    box-shadow:0 10px 30px rgba(124,92,255,.45);
  }
  .btn-primary:hover{box-shadow:0 14px 36px rgba(124,92,255,.6)}
  .btn-ghost{
    background:var(--glass-strong);color:var(--text);
    padding:13px 22px;font-size:14px;border:1px solid var(--border);
  }
  .btn-ghost:hover{background:rgba(255,255,255,.16)}
  .session-dots{display:flex;gap:8px;margin-top:6px}
  .session-dots .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.15);transition:all .3s}
  .session-dots .dot.done{background:var(--success);box-shadow:0 0 12px rgba(52,211,153,.6)}
  .session-dots .dot.current{background:var(--accent);box-shadow:0 0 12px rgba(124,92,255,.7);animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

  /* tasks card */
  .tasks-card{grid-column:2;grid-row:1}
  .task-input-row{display:flex;gap:8px;margin-bottom:14px}
  .task-input-row input{
    flex:1;background:rgba(0,0,0,.25);border:1px solid var(--border);
    color:var(--text);padding:11px 14px;border-radius:10px;font-size:14px;outline:none;
    transition:border .2s;
  }
  .task-input-row input:focus{border-color:var(--accent)}
  .task-input-row select{
    background:rgba(0,0,0,.25);border:1px solid var(--border);color:var(--text);
    padding:11px 10px;border-radius:10px;font-size:13px;outline:none;cursor:pointer;
  }
  .task-input-row select option{background:#1a1a3e}
  .task-list{list-style:none;max-height:260px;overflow-y:auto;padding-right:4px}
  .task-list::-webkit-scrollbar{width:6px}
  .task-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
  .task-item{
    display:flex;align-items:center;gap:10px;padding:11px 12px;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
    border-radius:10px;margin-bottom:8px;transition:all .25s;
  }
  .task-item:hover{background:rgba(255,255,255,.07);transform:translateX(2px)}
  .task-item.done{opacity:.5}
  .task-item.done .task-text{text-decoration:line-through;color:var(--muted)}
  .check{
    width:22px;height:22px;border-radius:7px;border:2px solid var(--border);
    cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:all .2s;
  }
  .check.done{background:var(--success);border-color:var(--success)}
  .check.done::after{content:"✓";color:#06281a;font-weight:800;font-size:14px}
  .task-text{flex:1;font-size:14px}
  .pomos{font-size:11px;color:var(--accent-2);background:rgba(34,211,238,.12);padding:3px 8px;border-radius:6px;flex-shrink:0}
  .del-btn{
    background:transparent;border:none;color:var(--muted);cursor:pointer;
    padding:4px 8px;border-radius:6px;font-size:16px;transition:all .2s;
  }
  .del-btn:hover{color:var(--danger);background:rgba(251,113,133,.1)}
  .empty-hint{color:var(--muted);font-size:13px;text-align:center;padding:30px 0;opacity:.6}

  /* ambient sounds card */
  .ambient-card{grid-column:3;grid-row:1}
  .sound-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sound-btn{
    background:rgba(255,255,255,.04);border:1px solid var(--border);
    border-radius:12px;padding:14px 10px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:all .25s;position:relative;overflow:hidden;
  }
  .sound-btn:hover{background:rgba(255,255,255,.09);transform:translateY(-2px)}
  .sound-btn.active{
    background:linear-gradient(135deg,rgba(124,92,255,.25),rgba(255,106,176,.18));
    border-color:var(--accent);
    box-shadow:0 6px 20px rgba(124,92,255,.3);
  }
  .sound-btn .icon{font-size:24px}
  .sound-btn .name{font-size:12px;color:var(--text)}
  .sound-btn .bars{display:flex;gap:2px;height:14px;align-items:flex-end}
  .sound-btn .bars span{width:3px;background:var(--accent-2);border-radius:2px;height:30%;opacity:0;transition:opacity .3s}
  .sound-btn.active .bars span{
    opacity:1;animation:bar 1s ease-in-out infinite;
  }
  .sound-btn.active .bars span:nth-child(2){animation-delay:.15s}
  .sound-btn.active .bars span:nth-child(3){animation-delay:.3s}
  .sound-btn.active .bars span:nth-child(4){animation-delay:.45s}
  @keyframes bar{0%,100%{height:30%}50%{height:100%}}
  .master-vol{margin-top:14px;display:flex;align-items:center;gap:10px}
  .master-vol label{font-size:12px;color:var(--muted);min-width:36px}
  .master-vol input[type=range]{flex:1;accent-color:var(--accent);height:4px}

  /* notes card */
  .notes-card{grid-column:2 / span 2;grid-row:2}
  .notes-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .notes-toolbar .count{font-size:12px;color:var(--muted)}
  .note-area{
    width:100%;min-height:160px;resize:vertical;
    background:rgba(0,0,0,.25);border:1px solid var(--border);
    color:var(--text);padding:14px;border-radius:12px;font-size:14px;
    font-family:inherit;line-height:1.7;outline:none;transition:border .2s;
  }
  .note-area:focus{border-color:var(--accent)}
  .note-area::placeholder{color:var(--muted)}
  .quick-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .quick-tags button{
    background:rgba(255,255,255,.05);border:1px solid var(--border);
    color:var(--muted);padding:5px 10px;border-radius:8px;font-size:12px;
    cursor:pointer;transition:all .2s;
  }
  .quick-tags button:hover{color:var(--text);border-color:var(--accent);background:rgba(124,92,255,.15)}

  /* stats card */
  .stats-card{grid-column:1;grid-row:3;grid-column:1 / span 3;display:flex;gap:14px}
  .stat-block{
    flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
    border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px;
    position:relative;overflow:hidden;
  }
  .stat-block::after{
    content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;
    border-radius:50%;background:radial-gradient(circle,var(--accent) 0%,transparent 70%);opacity:.18;
  }
  .stat-block .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .stat-block .value{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat-block .delta{font-size:11px;color:var(--success)}
  .stat-block .delta.warn{color:var(--warn)}

  /* toast */
  .toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);
    background:rgba(20,20,40,.95);backdrop-filter:blur(20px);
    border:1px solid var(--border);color:var(--text);
    padding:13px 22px;border-radius:12px;font-size:14px;
    box-shadow:var(--shadow);z-index:1000;opacity:0;
    transition:transform .35s cubic-bezier(.4,1.4,.6,1), opacity .35s;
    display:flex;align-items:center;gap:10px;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast .ic{font-size:18px}

  /* responsive */
  @media (max-width:1024px){
    .grid{grid-template-columns:1fr 1fr}
    .timer-card{grid-column:1 / span 2;grid-row:1}
    .tasks-card{grid-column:1;grid-row:2}
    .ambient-card{grid-column:2;grid-row:2}
    .notes-card{grid-column:1 / span 2;grid-row:3}
    .stats-card{grid-column:1 / span 2;grid-row:4}
  }
  @media (max-width:680px){
    .grid{grid-template-columns:1fr}
    .timer-card,.tasks-card,.ambient-card,.notes-card,.stats-card{grid-column:1}
    .timer-card{grid-row:1}.tasks-card{grid-row:2}.ambient-card{grid-row:3}.notes-card{grid-row:4}.stats-card{grid-row:5}
    .stats-card{flex-direction:column}
    .timer-ring{width:230px;height:230px}
    .time-display .time{font-size:50px}
    .topbar-right{flex-wrap:wrap;gap:8px}
  }
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">F</div>
      <div>
        <h1>FlowForge · 心流工坊</h1>
        <div class="sub">沉浸式学习与工作专注空间</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="stat-chip"><span class="lbl">今日专注</span><span class="num" id="todayFocus">0</span><span class="lbl">min</span></div>
      <div class="stat-chip"><span class="lbl">完成番茄</span><span class="num" id="todayPomos">0</span></div>
      <div class="stat-chip"><span class="lbl">连续天数</span><span class="num" id="streak">1</span></div>
    </div>
  </header>

  <div class="grid">

    <!-- Timer -->
    <section class="card timer-card">
      <h2><span class="dot"></span>专注计时器</h2>
      <div class="mode-tabs">
        <button class="active" data-mode="focus">专注 25:00</button>
        <button data-mode="short">短休 5:00</button>
        <button data-mode="long">长休 15:00</button>
      </div>
      <div class="timer-ring">
        <svg width="280" height="280" viewBox="0 0 280 280">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7c5cff"/>
              <stop offset="50%" stop-color="#22d3ee"/>
              <stop offset="100%" stop-color="#ff6ab0"/>
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="140" cy="140" r="130"/>
          <circle class="ring-fg" id="ringFg" cx="140" cy="140" r="130"
                  stroke-dasharray="816.8" stroke-dashoffset="0"/>
        </svg>
        <div class="time-display">
          <div class="time" id="timeText">25:00</div>
          <div class="phase" id="phaseText">准备开始专注</div>
        </div>
      </div>
      <div class="timer-controls">
        <button class="btn btn-primary" id="startBtn">▶ 开始专注</button>
        <button class="btn btn-ghost" id="resetBtn">↻ 重置</button>
      </div>
      <div class="session-dots" id="sessionDots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </section>

    <!-- Tasks -->
    <section class="card tasks-card">
      <h2><span class="dot"></span>今日任务</h2>
      <div class="task-input-row">
        <input type="text" id="taskInput" placeholder="添加一个任务…" maxlength="80">
        <select id="pomoSelect" title="预估番茄数">
          <option value="1">1🍅</option>
          <option value="2" selected>2🍅</option>
          <option value="3">3🍅</option>
          <option value="4">4🍅</option>
          <option value="5">5🍅</option>
        </select>
        <button class="btn btn-primary" id="addTaskBtn" style="padding:11px 16px">+</button>
      </div>
      <ul class="task-list" id="taskList">
        <li class="empty-hint">还没有任务，先添加一个吧 ✨</li>
      </ul>
    </section>

    <!-- Ambient Sounds -->
    <section class="card ambient-card">
      <h2><span class="dot"></span>环境白噪音</h2>
      <div class="sound-grid" id="soundGrid">
        <button class="sound-btn" data-sound="off"><span class="icon">🔇</span><span class="name">静音</span><span class="bars"><span></span><span></span><span></span><span></span></span></button>
        <button class="sound-btn" data-sound="white"><span class="icon">📡</span><span class="name">白噪音</span><span class="bars"><span></span><span></span><span></span><span></span></span></button>
        <button class="sound-btn" data-sound="rain"><span class="icon">🌧️</span><span class="name">雨声</span><span class="bars"><span></span><span></span><span></span><span></span></span></button>
        <button class="sound-btn" data-sound="ocean"><span class="icon">🌊</span><span class="name">海浪</span><span class="bars"><span></span><span></span><span></span><span></span></span></button>
        <button class="sound-btn" data-sound="forest"><span class="icon">🌳</span><span class="name">森林</span><span class="bars"><span></span><span></span><span></span><span></span></span></button>
        <button class="sound-btn" data-sound="cafe"><span class="icon">☕</span><span class="name">咖啡馆</span><span class="bars"><span></span><span></span><span></span><span></span></span></button>
      </div>
      <div class="master-vol">
        <label>音量</label>
        <input type="range" id="volSlider" min="0" max="100" value="40">
      </div>
    </section>

    <!-- Notes -->
    <section class="card notes-card">
      <h2><span class="dot"></span>灵感速记 <span class="count" id="noteCount" style="margin-left:auto">0 字</span></h2>
      <textarea class="note-area" id="noteArea" placeholder="专注过程中闪过的灵感、待查的资料、明天的计划…随手记在这里，不打断心流。"></textarea>
      <div class="quick-tags">
        <button data-tag="#灵感">💡 灵感</button>
        <button data-tag="#待查">🔍 待查</button>
        <button data-tag="#明日计划">📅 明日</button>
        <button data-tag="#疑问">❓ 疑问</button>
        <button data-tag="#复盘">📝 复盘</button>
        <button id="clearNote" style="margin-left:auto;color:var(--danger)">清空</button>
      </div>
    </section>

    <!-- Stats -->
    <section class="card stats-card">
      <div class="stat-block">
        <div class="label">本周专注时长</div>
        <div class="value" id="weekFocus">0</div>
        <div class="delta">持续累积中</div>
      </div>
      <div class="stat-block">
        <div class="label">完成任务数</div>
        <div class="value" id="doneTasks">0</div>
        <div class="delta">今日产出</div>
      </div>
      <div class="stat-block">
        <div class="label">最长单次专注</div>
        <div class="value" id="longestFocus">0</div>
        <div class="delta warn">min</div>
      </div>
      <div class="stat-block">
        <div class="label">专注效率分</div>
        <div class="value" id="effScore">--</div>
        <div class="delta">基于完成率与连续度</div>
      </div>
    </section>

  </div>
</div>

<div class="toast" id="toast"><span class="ic">🍅</span><span id="toastMsg">已完成一个番茄！</span></div>

<script>
/* ========== State ========== */
const MODES = { focus:{dur:25*60,label:'专注中'}, short:{dur:5*60,label:'短休中'}, long:{dur:15*60,label:'长休中'} };
const state = {
  mode:'focus',
  remaining:25*60,
  total:25*60,
  running:false,
  intervalId:null,
  sessionCount:0,         // 当前周期完成的番茄数 (0-4)
  todayPomos:0,
  todayFocusMin:0,
  weekFocusMin:0,
  longestFocusMin:0,
  streak:1,
  tasks:[],
  notes:'',
  currentSound:'off',
};

/* ========== Persistence ========== */
function save(){
  const data = {
    todayPomos:state.todayPomos, todayFocusMin:state.todayFocusMin,
    weekFocusMin:state.weekFocusMin, longestFocusMin:state.longestFocusMin,
    streak:state.streak, tasks:state.tasks, notes:state.notes,
    date:new Date().toDateString()
  };
  try{ localStorage.setItem('flowforge', JSON.stringify(data)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem('flowforge');
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d.date !== new Date().toDateString()){
      // 跨天：今日数据归零，连续天数逻辑
      state.streak = d.streak + 1;
    } else {
      state.todayPomos = d.todayPomos||0;
      state.todayFocusMin = d.todayFocusMin||0;
      state.streak = d.streak||1;
    }
    state.weekFocusMin = d.weekFocusMin||state.todayFocusMin;
    state.longestFocusMin = d.longestFocusMin||0;
    state.tasks = d.tasks||[];
    state.notes = d.notes||'';
  }catch(e){}
}

/* ========== Timer ========== */
const timeText = document.getElementById('timeText');
const phaseText = document.getElementById('phaseText');
const ringFg = document.getElementById('ringFg');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const RING_LEN = 2*Math.PI*130;
ringFg.setAttribute('stroke-dasharray', RING_LEN);

function fmt(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return m+':'+s;
}
function renderTimer(){
  timeText.textContent = fmt(state.remaining);
  const progress = 1 - state.remaining/state.total;
  ringFg.setAttribute('stroke-dashoffset', RING_LEN*progress);
  document.title = (state.running?'▶ ':'') + fmt(state.remaining) + ' · 心流工坊';
}
function setMode(mode){
  state.mode = mode;
  state.total = MODES[mode].dur;
  state.remaining = state.total;
  state.running = false;
  clearInterval(state.intervalId);
  phaseText.textContent = state.running ? MODES[mode].label : (mode==='focus'?'准备开始专注':(mode==='short'?'准备短休':'准备长休'));
  startBtn.textContent = '▶ ' + (mode==='focus'?'开始专注':(mode==='short'?'开始短休':'开始长休'));
  document.querySelectorAll('.mode-tabs button').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
  renderTimer();
}
function tick(){
  if(state.remaining<=0){ finishSession(); return; }
  state.remaining--;
  renderTimer();
}
function finishSession(){
  clearInterval(state.intervalId);
  state.running = false;
  if(state.mode==='focus'){
    state.todayPomos++;
    state.todayFocusMin += 25;
    state.weekFocusMin += 25;
    state.longestFocusMin = Math.max(state.longestFocusMin, 25);
    state.sessionCount = (state.sessionCount+1)%4;
    renderSessionDots();
    showToast('🍅 完成一个番茄！建议休息一下','🍅');
    // 4个番茄后自动长休
    const nextMode = state.sessionCount===0 ? 'long' : 'short';
    setTimeout(()=>setMode(nextMode), 600);
  } else {
    showToast('休息结束，继续专注吧！','✨');
    setTimeout(()=>setMode('focus'), 600);
  }
  updateStats();
  save();
  startBtn.textContent = '▶ 开始专注';
}
function toggleTimer(){
  if(state.running){
    clearInterval(state.intervalId);
    state.running=false;
    startBtn.textContent='▶ 继续';
    phaseText.textContent='已暂停';
  } else {
    state.running=true;
    state.intervalId=setInterval(tick,1000);
    startBtn.textContent='⏸ 暂停';
    phaseText.textContent=MODES[state.mode].label;
  }
}
startBtn.addEventListener('click', toggleTimer);
resetBtn.addEventListener('click', ()=>setMode(state.mode));
document.querySelectorAll('.mode-tabs button').forEach(b=>{
  b.addEventListener('click', ()=>setMode(b.dataset.mode));
});

/* ========== Session dots ========== */
function renderSessionDots(){
  const dots = document.querySelectorAll('#sessionDots .dot');
  dots.forEach((d,i)=>{
    d.classList.remove('done','current');
    if(i < state.sessionCount) d.classList.add('done');
    else if(i === state.sessionCount) d.classList.add('current');
  });
}

/* ========== Tasks ========== */
const taskInput = document.getElementById('taskInput');
const pomoSelect = document.getElementById('pomoSelect');
const addTaskBtn = document.getElementById('addTaskBtn');
const taskList = document.getElementById('taskList');

function renderTasks(){
  if(state.tasks.length===0){
    taskList.innerHTML = '<li class="empty-hint">还没有任务，先添加一个吧 ✨</li>';
  } else {
    taskList.innerHTML = state.tasks.map(t=>`
      <li class="task-item ${t.done?'done':''}" data-id="${t.id}">
        <div class="check ${t.done?'done':''}" data-act="toggle"></div>
        <span class="task-text">${escapeHtml(t.text)}</span>
        <span class="pomos">🍅${t.pomos}</span>
        <button class="del-btn" data-act="del" title="删除">✕</button>
      </li>
    `).join('');
  }
  document.getElementById('doneTasks').textContent = state.tasks.filter(t=>t.done).length;
  save();
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function addTask(){
  const text = taskInput.value.trim();
  if(!text) return;
  state.tasks.push({id:Date.now(), text, pomos:parseInt(pomoSelect.value), done:false});
  taskInput.value='';
  renderTasks();
}
addTaskBtn.addEventListener('click', addTask);
taskInput.addEventListener('keypress', e=>{ if(e.key==='Enter') addTask(); });
taskList.addEventListener('click', e=>{
  const item = e.target.closest('.task-item');
  if(!item) return;
  const id = parseInt(item.dataset.id);
  const act = e.target.dataset.act;
  if(act==='toggle'){
    const t = state.tasks.find(x=>x.id===id);
    if(t){ t.done=!t.done; renderTasks(); if(t.done) showToast('任务完成！','✅'); }
  } else if(act==='del'){
    state.tasks = state.tasks.filter(x=>x.id!==id);
    renderTasks();
  }
});

/* ========== Notes ========== */
const noteArea = document.getElementById('noteArea');
const noteCount = document.getElementById('noteCount');
noteArea.value = state.notes;
noteCount.textContent = (state.notes.length) + ' 字';
noteArea.addEventListener('input', ()=>{
  state.notes = noteArea.value;
  noteCount.textContent = state.notes.length + ' 字';
  save();
});
document.querySelectorAll('.quick-tags button[data-tag]').forEach(b=>{
  b.addEventListener('click', ()=>{
    const tag = b.dataset.tag;
    const pos = noteArea.selectionStart;
    const before = noteArea.value.slice(0,pos);
    const after = noteArea.value.slice(pos);
    noteArea.value = before + tag + ' ' + after;
    state.notes = noteArea.value;
    noteCount.textContent = state.notes.length + ' 字';
    noteArea.focus();
    noteArea.selectionEnd = pos + tag.length + 1;
    save();
  });
});
document.getElementById('clearNote').addEventListener('click', ()=>{
  if(noteArea.value && confirm('确定清空所有笔记？')){
    noteArea.value='';
    state.notes='';
    noteCount.textContent='0 字';
    save();
  }
});

/* ========== Ambient Sounds (Web Audio API) ========== */
let audioCtx = null;
let currentNodes = [];
let masterGain = null;
let modInterval = null;

function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.4;
    masterGain.connect(audioCtx.destination);
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function stopAllSound(){
  currentNodes.forEach(n=>{ try{n.stop();}catch(e){} try{n.disconnect();}catch(e){} });
  currentNodes = [];
  if(modInterval){ clearInterval(modInterval); modInterval=null; }
}
function makeNoiseBuffer(type){
  const len = audioCtx.sampleRate*2;
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  if(type==='white'){
    for(let i=0;i<len;i++) data[i] = Math.random()*2-1;
  } else if(type==='brown'){
    let last=0;
    for(let i=0;i<len;i++){
      const w = Math.random()*2-1;
      last = (last + 0.02*w)/1.02;
      data[i] = last*3.5;
    }
  } else if(type==='pink'){
    let b0=0,b1=0,b2=0;
    for(let i=0;i<len;i++){
      const w = Math.random()*2-1;
      b0 = 0.99*b0 + 0.0555*w;
      b1 = 0.96*b1 + 0.35*w;
      b2 = 0.57*b2 + 0.85*w;
      data[i] = (b0+b1+b2)*0.2;
    }
  }
  return buf;
}
function playSound(type){
  ensureAudio();
  stopAllSound();
  if(type==='off') return;

  if(type==='white'||type==='rain'){
    // rain = white noise + lowpass + slight high boost
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoiseBuffer('white');
    src.loop = true;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = type==='rain' ? 6000 : 8000;
    const hp = audioCtx.createBiquadFilter();
    hp.type='highpass'; hp.frequency.value = type==='rain'?400:200;
    src.connect(hp); hp.connect(lp); lp.connect(masterGain);
    src.start();
    currentNodes.push(src,hp,lp);
    if(type==='rain'){
      // 雨滴随机点缀
      modInterval = setInterval(()=>{
        if(Math.random()<0.3){
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.frequency.value = 2000 + Math.random()*4000;
          g.gain.value = 0;
          osc.connect(g); g.connect(masterGain);
          osc.start();
          g.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime+0.005);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.05);
          osc.stop(audioCtx.currentTime+0.06);
          currentNodes.push(osc,g);
          setTimeout(()=>{ try{osc.disconnect();g.disconnect();}catch(e){} }, 100);
        }
      }, 120);
    }
  } else if(type==='ocean'){
    // brown noise + 慢速振幅调制模拟海浪
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoiseBuffer('brown');
    src.loop = true;
    const lp = audioCtx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=800;
    const g = audioCtx.createGain();
    g.gain.value = 0.3;
    src.connect(lp); lp.connect(g); g.connect(masterGain);
    src.start();
    currentNodes.push(src,lp,g);
    let t=0;
    modInterval = setInterval(()=>{
      t += 0.05;
      const v = 0.15 + 0.25*(0.5+0.5*Math.sin(t*0.5));
      g.gain.linearRampToValueAtTime(v, audioCtx.currentTime+0.1);
    }, 100);
  } else if(type==='forest'){
    // brown noise 底色 + 偶发鸟鸣
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoiseBuffer('brown');
    src.loop = true;
    const lp = audioCtx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=1500;
    const g = audioCtx.createGain();
    g.gain.value=0.15;
    src.connect(lp); lp.connect(g); g.connect(masterGain);
    src.start();
    currentNodes.push(src,lp,g);
    modInterval = setInterval(()=>{
      if(Math.random()<0.25){
        const osc = audioCtx.createOscillator();
        const og = audioCtx.createGain();
        osc.type='sine';
        const baseFreq = 1500 + Math.random()*2500;
        osc.frequency.value = baseFreq;
        og.gain.value = 0;
        osc.connect(og); og.connect(masterGain);
        osc.start();
        // 鸟鸣频率滑动
        osc.frequency.linearRampToValueAtTime(baseFreq+500, audioCtx.currentTime+0.08);
        osc.frequency.linearRampToValueAtTime(baseFreq-200, audioCtx.currentTime+0.15);
        og.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime+0.02);
        og.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.18);
        osc.stop(audioCtx.currentTime+0.2);
        currentNodes.push(osc,og);
        setTimeout(()=>{ try{osc.disconnect();og.disconnect();}catch(e){} }, 250);
      }
    }, 400);
  } else if(type==='cafe'){
    // brown noise + 偶发杯具碰撞
    const src = audioCtx.createBufferSource();
    src.buffer = makeNoiseBuffer('brown');
    src.loop = true;
    const lp = audioCtx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=2500;
    const g = audioCtx.createGain();
    g.gain.value=0.25;
    src.connect(lp); lp.connect(g); g.connect(masterGain);
    src.start();
    currentNodes.push(src,lp,g);
    modInterval = setInterval(()=>{
      if(Math.random()<0.15){
        const osc = audioCtx.createOscillator();
        const og = audioCtx.createGain();
        osc.type='triangle';
        osc.frequency.value = 300 + Math.random()*800;
        og.gain.value = 0;
        osc.connect(og); og.connect(masterGain);
        osc.start();
        og.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime+0.003);
        og.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.08);
        osc.stop(audioCtx.currentTime+0.1);
        currentNodes.push(osc,og);
        setTimeout(()=>{ try{osc.disconnect();og.disconnect();}catch(e){} }, 150);
      }
    }, 600);
  }
}
document.querySelectorAll('.sound-btn').forEach(b=>{
  b.addEventListener('click', ()=>{
    const sound = b.dataset.sound;
    document.querySelectorAll('.sound-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    state.currentSound = sound;
    playSound(sound);
  });
});
document.getElementById('volSlider').addEventListener('input', e=>{
  if(masterGain) masterGain.gain.value = (e.target.value/100)*0.8;
});

/* ========== Stats ========== */
function updateStats(){
  document.getElementById('todayFocus').textContent = state.todayFocusMin;
  document.getElementById('todayPomos').textContent = state.todayPomos;
  document.getElementById('streak').textContent = state.streak;
  document.getElementById('weekFocus').textContent = state.weekFocusMin;
  document.getElementById('longestFocus').textContent = state.longestFocusMin;
  // 效率分：今日番茄*10 + 完成任务*5，封顶100
  const doneCount = state.tasks.filter(t=>t.done).length;
  const score = Math.min(100, state.todayPomos*10 + doneCount*5);
  document.getElementById('effScore').textContent = score>0?score:'--';
}

/* ========== Toast ========== */
let toastTimer = null;
function showToast(msg, icon='🍅'){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.querySelector('.ic').textContent = icon;
  t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2800);
}

/* ========== Init ========== */
load();
setMode('focus');
renderTasks();
renderSessionDots();
updateStats();
renderTimer();
</script>
