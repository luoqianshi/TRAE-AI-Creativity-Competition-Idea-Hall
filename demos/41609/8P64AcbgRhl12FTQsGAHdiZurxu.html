<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能监造系统 - 原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- 顶部导航栏 -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="logo-text">中国移动</span>
        <button class="menu-toggle" id="menuToggle">☰</button>
      </div>
      <div class="topbar-right">
        <button class="icon-btn">⛶</button>
        <div class="user-info">
          <span class="avatar">Y</span>
          <span class="username">yangjun</span>
        </div>
      </div>
    </header>

    <div class="main">
      <!-- 左侧导航 -->
      <aside class="sidebar" id="sidebar">
        <nav class="nav-menu">
          <a href="#" class="nav-item active" data-page="dashboard">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">首页</span>
          </a>
          
          <div class="nav-group">
            <a href="#" class="nav-item nav-group-title" data-toggle="product">
              <span class="nav-icon">📦</span>
              <span class="nav-text">产品监造</span>
              <span class="arrow">▼</span>
            </a>
            <div class="nav-sub" id="nav-product">
              <a href="#" class="nav-sub-item" data-page="sales-order">销售订单</a>
              <a href="#" class="nav-sub-item" data-page="production-order">生产订单</a>
              <a href="#" class="nav-sub-item" data-page="test-inspection">试验检测</a>
              <a href="#" class="nav-sub-item" data-page="visual-detection">视觉检测</a>
              <a href="#" class="nav-sub-item" data-page="abnormal-bill">异常单据</a>
              <a href="#" class="nav-sub-item" data-page="shipping-data">发货数据</a>
            </div>
          </div>
          
          <div class="nav-group">
            <a href="#" class="nav-item nav-group-title" data-toggle="ai">
              <span class="nav-icon">🤖</span>
              <span class="nav-text">AI应用</span>
              <span class="arrow">▼</span>
            </a>
            <div class="nav-sub" id="nav-ai">
              <a href="#" class="nav-sub-item" data-page="ai-chat">智能问答</a>
              <a href="#" class="nav-sub-item" data-page="ai-query">智能问数</a>
              <a href="#" class="nav-sub-item" data-page="ai-report">智能运营报告</a>
              <a href="#" class="nav-sub-item" data-page="knowledge-base">知识库管理</a>
            </div>
          </div>
          
          <div class="nav-group">
            <a href="#" class="nav-item nav-group-title" data-toggle="supplier">
              <span class="nav-icon">🏭</span>
              <span class="nav-text">供应商管理</span>
              <span class="arrow">▼</span>
            </a>
            <div class="nav-sub" id="nav-supplier">
              <a href="#" class="nav-sub-item" data-page="supplier-list">供应商档案</a>
              <a href="#" class="nav-sub-item" data-page="supplier-score">供应商评分</a>
            </div>
          </div>
          
          <a href="#" class="nav-item" data-page="qc-plan">
            <span class="nav-icon">📋</span>
            <span class="nav-text">质检方案配置</span>
          </a>
          
          <a href="#" class="nav-item" data-page="big-screen">
            <span class="nav-icon">📊</span>
            <span class="nav-text">可视化大屏</span>
          </a>
        </nav>
      </aside>

      <!-- 内容区域 -->
      <main class="content" id="content"></main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
