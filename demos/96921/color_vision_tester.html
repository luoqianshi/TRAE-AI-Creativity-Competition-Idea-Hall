<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双眼视力色彩调节器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        header p {
            color: #aaa;
            font-size: 1.1rem;
        }

        .test-area {
            display: flex;
            height: 500px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .eye-section {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .eye-section.left {
            background: linear-gradient(180deg, #2d3436, #636e72);
            border-right: 2px solid rgba(255, 255, 255, 0.1);
        }

        .eye-section.right {
            background: linear-gradient(180deg, #636e72, #2d3436);
        }

        .eye-label {
            position: absolute;
            top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .left .eye-label {
            color: #00d4ff;
        }

        .right .eye-label {
            color: #ff6b6b;
        }

        .vision-chart {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 20px;
        }

        .chart-item {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .chart-item:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-panel h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .left-panel h2 {
            color: #00d4ff;
        }

        .right-panel h2 {
            color: #ff6b6b;
        }

        .slider-group {
            margin-bottom: 20px;
        }

        .slider-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #ccc;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00d4ff;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .right-panel input[type="range"]::-webkit-slider-thumb {
            background: #ff6b6b;
        }

        .value-display {
            width: 50px;
            text-align: center;
            font-weight: bold;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px;
            border-radius: 5px;
        }

        .color-preview {
            width: 100%;
            height: 50px;
            border-radius: 10px;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .presets {
            margin-top: 20px;
        }

        .presets h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #aaa;
        }

        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .preset-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .preset-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .preset-btn.active {
            background: #00d4ff;
        }

        .right-panel .preset-btn.active {
            background: #ff6b6b;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .action-btn {
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btn.reset {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .action-btn.reset:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .action-btn.compare {
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            color: #fff;
        }

        .action-btn.compare:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .result-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            backdrop-filter: blur(10px);
        }

        .result-area h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #00d4ff;
        }

        .result-content {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .result-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
        }

        .result-item h3 {
            font-size: 1rem;
            color: #aaa;
            margin-bottom: 10px;
        }

        .result-item p {
            font-size: 1.1rem;
            color: #fff;
        }

        @media (max-width: 768px) {
            .test-area {
                flex-direction: column;
                height: auto;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .result-content {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8rem;
            }

            .chart-item {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>双眼视力色彩调节器</h1>
            <p>用于测试和区分左右眼视力差异的专业色彩调节工具</p>
        </header>

        <div class="test-area">
            <div class="eye-section left" id="leftEye">
                <span class="eye-label">左眼 LEFT</span>
                <div class="vision-chart" id="leftChart">
                    <div class="chart-item">E</div>
                    <div class="chart-item">C</div>
                    <div class="chart-item">F</div>
                    <div class="chart-item">P</div>
                    <div class="chart-item">T</div>
                    <div class="chart-item">O</div>
                    <div class="chart-item">E</div>
                    <div class="chart-item">D</div>
                    <div class="chart-item">C</div>
                    <div class="chart-item">Z</div>
                    <div class="chart-item">F</div>
                    <div class="chart-item">P</div>
                    <div class="chart-item">E</div>
                    <div class="chart-item">T</div>
                    <div class="chart-item">O</div>
                </div>
            </div>
            <div class="eye-section right" id="rightEye">
                <span class="eye-label">右眼 RIGHT</span>
                <div class="vision-chart" id="rightChart">
                    <div class="chart-item">E</div>
                    <div class="chart-item">C</div>
                    <div class="chart-item">F</div>
                    <div class="chart-item">P</div>
                    <div class="chart-item">T</div>
                    <div class="chart-item">O</div>
                    <div class="chart-item">E</div>
                    <div class="chart-item">D</div>
                    <div class="chart-item">C</div>
                    <div class="chart-item">Z</div>
                    <div class="chart-item">F</div>
                    <div class="chart-item">P</div>
                    <div class="chart-item">E</div>
                    <div class="chart-item">T</div>
                    <div class="chart-item">O</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="control-panel left-panel">
                <h2>👁️ 左眼调节控制</h2>
                
                <div class="slider-group">
                    <label>亮度 (Brightness)</label>
                    <div class="slider-container">
                        <input type="range" id="leftBrightness" min="0" max="200" value="100">
                        <span class="value-display" id="leftBrightnessVal">100%</span>
                    </div>
                </div>

                <div class="slider-group">
                    <label>对比度 (Contrast)</label>
                    <div class="slider-container">
                        <input type="range" id="leftContrast" min="0" max="200" value="100">
                        <span class="value-display" id="leftContrastVal">100%</span>
                    </div>
                </div>

                <div class="slider-group">
                    <label>饱和度 (Saturation)</label>
                    <div class="slider-container">
                        <input type="range" id="leftSaturation" min="0" max="200" value="100">
                        <span class="value-display" id="leftSaturationVal">100%</span>
                    </div>
                </div>

                <div class="slider-group">
                    <label>色相 (Hue)</label>
                    <div class="slider-container">
                        <input type="range" id="leftHue" min="0" max="360" value="0">
                        <span class="value-display" id="leftHueVal">0°</span>
                    </div>
                </div>

                <div class="color-preview" id="leftPreview"></div>

                <div class="presets">
                    <h3>快捷预设</h3>
                    <div class="preset-buttons">
                        <button class="preset-btn" onclick="applyPreset('left', 'normal')">正常</button>
                        <button class="preset-btn" onclick="applyPreset('left', 'warm')">暖色</button>
                        <button class="preset-btn" onclick="applyPreset('left', 'cool')">冷色</button>
                        <button class="preset-btn" onclick="applyPreset('left', 'low')">低对比度</button>
                        <button class="preset-btn" onclick="applyPreset('left', 'high')">高对比度</button>
                    </div>
                </div>
            </div>

            <div class="control-panel right-panel">
                <h2>👁️ 右眼调节控制</h2>
                
                <div class="slider-group">
                    <label>亮度 (Brightness)</label>
                    <div class="slider-container">
                        <input type="range" id="rightBrightness" min="0" max="200" value="100">
                        <span class="value-display" id="rightBrightnessVal">100%</span>
                    </div>
                </div>

                <div class="slider-group">
                    <label>对比度 (Contrast)</label>
                    <div class="slider-container">
                        <input type="range" id="rightContrast" min="0" max="200" value="100">
                        <span class="value-display" id="rightContrastVal">100%</span>
                    </div>
                </div>

                <div class="slider-group">
                    <label>饱和度 (Saturation)</label>
                    <div class="slider-container">
                        <input type="range" id="rightSaturation" min="0" max="200" value="100">
                        <span class="value-display" id="rightSaturationVal">100%</span>
                    </div>
                </div>

                <div class="slider-group">
                    <label>色相 (Hue)</label>
                    <div class="slider-container">
                        <input type="range" id="rightHue" min="0" max="360" value="0">
                        <span class="value-display" id="rightHueVal">0°</span>
                    </div>
                </div>

                <div class="color-preview" id="rightPreview"></div>

                <div class="presets">
                    <h3>快捷预设</h3>
                    <div class="preset-buttons">
                        <button class="preset-btn" onclick="applyPreset('right', 'normal')">正常</button>
                        <button class="preset-btn" onclick="applyPreset('right', 'warm')">暖色</button>
                        <button class="preset-btn" onclick="applyPreset('right', 'cool')">冷色</button>
                        <button class="preset-btn" onclick="applyPreset('right', 'low')">低对比度</button>
                        <button class="preset-btn" onclick="applyPreset('right', 'high')">高对比度</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn reset" onclick="resetAll()">🔄 重置所有</button>
            <button class="action-btn compare" onclick="generateReport()">📊 生成分析报告</button>
        </div>

        <div class="result-area" id="resultArea" style="display: none;">
            <h2>📋 视力测试分析报告</h2>
            <div class="result-content">
                <div class="result-item">
                    <h3>左眼参数</h3>
                    <p id="leftParams"></p>
                </div>
                <div class="result-item">
                    <h3>右眼参数</h3>
                    <p id="rightParams"></p>
                </div>
                <div class="result-item">
                    <h3>差异分析</h3>
                    <p id="diffAnalysis"></p>
                </div>
                <div class="result-item">
                    <h3>建议</h3>
                    <p id="suggestion"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const leftEye = document.getElementById('leftEye');
        const rightEye = document.getElementById('rightEye');
        const leftChart = document.getElementById('leftChart');
        const rightChart = document.getElementById('rightChart');

        const leftSliders = {
            brightness: document.getElementById('leftBrightness'),
            contrast: document.getElementById('leftContrast'),
            saturation: document.getElementById('leftSaturation'),
            hue: document.getElementById('leftHue')
        };

        const rightSliders = {
            brightness: document.getElementById('rightBrightness'),
            contrast: document.getElementById('rightContrast'),
            saturation: document.getElementById('rightSaturation'),
            hue: document.getElementById('rightHue')
        };

        function updateEyeDisplay(side, brightness, contrast, saturation, hue) {
            const eye = side === 'left' ? leftEye : rightEye;
            const chart = side === 'left' ? leftChart : rightChart;
            const preview = document.getElementById(`${side}Preview`);

            const filter = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%) hue-rotate(${hue}deg)`;
            
            eye.style.filter = filter;
            chart.style.filter = filter;
            
            preview.style.background = `linear-gradient(90deg, 
                hsl(${hue}, ${saturation}%, ${brightness * 0.4}%), 
                hsl(${hue + 180}, ${saturation}%, ${brightness * 0.6}%)
            )`;
            preview.style.filter = `contrast(${contrast}%)`;

            document.getElementById(`${side}BrightnessVal`).textContent = brightness + '%';
            document.getElementById(`${side}ContrastVal`).textContent = contrast + '%';
            document.getElementById(`${side}SaturationVal`).textContent = saturation + '%';
            document.getElementById(`${side}HueVal`).textContent = hue + '°';
        }

        function handleSliderChange(side) {
            const sliders = side === 'left' ? leftSliders : rightSliders;
            updateEyeDisplay(
                side,
                sliders.brightness.value,
                sliders.contrast.value,
                sliders.saturation.value,
                sliders.hue.value
            );
        }

        leftSliders.brightness.addEventListener('input', () => handleSliderChange('left'));
        leftSliders.contrast.addEventListener('input', () => handleSliderChange('left'));
        leftSliders.saturation.addEventListener('input', () => handleSliderChange('left'));
        leftSliders.hue.addEventListener('input', () => handleSliderChange('left'));

        rightSliders.brightness.addEventListener('input', () => handleSliderChange('right'));
        rightSliders.contrast.addEventListener('input', () => handleSliderChange('right'));
        rightSliders.saturation.addEventListener('input', () => handleSliderChange('right'));
        rightSliders.hue.addEventListener('input', () => handleSliderChange('right'));

        function applyPreset(side, preset) {
            const sliders = side === 'left' ? leftSliders : rightSliders;
            
            switch(preset) {
                case 'normal':
                    sliders.brightness.value = 100;
                    sliders.contrast.value = 100;
                    sliders.saturation.value = 100;
                    sliders.hue.value = 0;
                    break;
                case 'warm':
                    sliders.brightness.value = 100;
                    sliders.contrast.value = 110;
                    sliders.saturation.value = 120;
                    sliders.hue.value = -15;
                    break;
                case 'cool':
                    sliders.brightness.value = 100;
                    sliders.contrast.value = 110;
                    sliders.saturation.value = 120;
                    sliders.hue.value = 180;
                    break;
                case 'low':
                    sliders.brightness.value = 100;
                    sliders.contrast.value = 50;
                    sliders.saturation.value = 50;
                    sliders.hue.value = 0;
                    break;
                case 'high':
                    sliders.brightness.value = 100;
                    sliders.contrast.value = 150;
                    sliders.saturation.value = 150;
                    sliders.hue.value = 0;
                    break;
            }
            
            handleSliderChange(side);
        }

        function resetAll() {
            applyPreset('left', 'normal');
            applyPreset('right', 'normal');
            document.getElementById('resultArea').style.display = 'none';
        }

        function generateReport() {
            const leftParams = {
                brightness: leftSliders.brightness.value,
                contrast: leftSliders.contrast.value,
                saturation: leftSliders.saturation.value,
                hue: leftSliders.hue.value
            };

            const rightParams = {
                brightness: rightSliders.brightness.value,
                contrast: rightSliders.contrast.value,
                saturation: rightSliders.saturation.value,
                hue: rightSliders.hue.value
            };

            const diff = {
                brightness: Math.abs(leftParams.brightness - rightParams.brightness),
                contrast: Math.abs(leftParams.contrast - rightParams.contrast),
                saturation: Math.abs(leftParams.saturation - rightParams.saturation),
                hue: Math.abs(leftParams.hue - rightParams.hue)
            };

            const totalDiff = diff.brightness + diff.contrast + diff.saturation + diff.hue;

            let suggestion = '';
            if (totalDiff === 0) {
                suggestion = '双眼视力参数一致，建议定期进行视力检查，保持良好用眼习惯。';
            } else if (totalDiff < 50) {
                suggestion = '双眼存在轻微视力差异，建议注意用眼卫生，避免长时间单眼疲劳。';
            } else if (totalDiff < 150) {
                suggestion = '双眼存在明显视力差异，建议及时到眼科进行专业检查，可能需要佩戴矫正眼镜。';
            } else {
                suggestion = '双眼视力差异较大，强烈建议立即前往眼科医院进行全面检查，制定个性化矫正方案。';
            }

            document.getElementById('leftParams').textContent = 
                `亮度: ${leftParams.brightness}% | 对比度: ${leftParams.contrast}% | 饱和度: ${leftParams.saturation}% | 色相: ${leftParams.hue}°`;
            document.getElementById('rightParams').textContent = 
                `亮度: ${rightParams.brightness}% | 对比度: ${rightParams.contrast}% | 饱和度: ${rightParams.saturation}% | 色相: ${rightParams.hue}°`;
            document.getElementById('diffAnalysis').textContent = 
                `亮度差异: ${diff.brightness}% | 对比度差异: ${diff.contrast}% | 饱和度差异: ${diff.saturation}% | 色相差异: ${diff.hue}° | 综合差异指数: ${totalDiff}`;
            document.getElementById('suggestion').textContent = suggestion;

            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
        }

        updateEyeDisplay('left', 100, 100, 100, 0);
        updateEyeDisplay('right', 100, 100, 100, 0);
    </script>
</body>
</html>
