<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>银龄随行 - 首页</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
    <style>
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .quick-action-btn {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .quick-action-btn:active {
            transform: scale(0.96);
        }

        .quick-action-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .quick-action-icon.red {
            background-color: rgba(230, 57, 70, 0.15);
            color: var(--primary-color);
        }

        .quick-action-icon.blue {
            background-color: rgba(52, 152, 219, 0.15);
            color: #3498DB;
        }

        .quick-action-icon.green {
            background-color: rgba(46, 204, 113, 0.15);
            color: #2ECC71;
        }

        .quick-action-icon.orange {
            background-color: rgba(243, 156, 18, 0.15);
            color: #F39C12;
        }

        .quick-action-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .service-item {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .service-item:active {
            transform: scale(0.96);
        }

        .service-icon {
            font-size: 32px;
        }

        .service-text {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-title">
                <i class="fas fa-heart"></i>
                <span>银龄随行</span>
            </div>
        </header>

        <main class="main-content">
            <div class="location-bar">
                <i class="fas fa-map-marker-alt"></i>
                <span>当前位置：人民广场附近</span>
            </div>

            <div class="sos-section">
                <div class="sos-title">紧急求助</div>
                <div class="sos-subtitle">遇到紧急情况，请点击下方按钮</div>
                <button class="sos-btn" onclick="handleSosClick()">
                    <i class="fas fa-phone"></i>
                </button>
            </div>

            <div class="section-title">
                <i class="fas fa-search-location"></i>
                <span>附近厕所</span>
            </div>

            <div id="toiletList">
            </div>

            <div class="section-title">
                <i class="fas fa-concierge-bell"></i>
                <span>银龄服务圈</span>
            </div>

            <div class="service-grid" id="serviceGrid">
            </div>
        </main>

        <nav class="footer-nav">
            <div class="nav-item active" data-page="home">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </div>
            <div class="nav-item" data-page="toilets" onclick="window.location.href='toilets.html'">
                <i class="fas fa-search-location"></i>
                <span>找厕所</span>
            </div>
            <div class="nav-item" data-page="sos" onclick="window.location.href='sos.html'">
                <i class="fas fa-bell"></i>
                <span>求助</span>
            </div>
            <div class="nav-item" data-page="profile" onclick="window.location.href='profile.html'">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </div>
        </nav>

        <button class="voice-btn" id="voiceBtn">
            <i class="fas fa-microphone"></i>
        </button>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <h2 class="modal-title" id="modalTitle">提示</h2>
                <div class="modal-content" id="modalContent">内容</div>
                <div class="modal-actions" id="modalActions"></div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script>
        function renderHome() {
            const nearbyToilets = mockData.toilets.slice(0, 3);
            const toiletList = document.getElementById('toiletList');
            toiletList.innerHTML = nearbyToilets.map(toilet => createToiletCard(toilet)).join('');

            const serviceGrid = document.getElementById('serviceGrid');
            serviceGrid.innerHTML = Object.entries(serviceTypeMap).map(([type, info]) => `
                <div class="service-item" onclick="window.location.href='services.html?type=${type}'">
                    <span class="service-icon">${info.icon}</span>
                    <span class="service-text">${info.label}</span>
                </div>
            `).join('');
        }

        initNav('home');
        initVoiceBtn();
        renderHome();
    </script>
</body>
</html>
