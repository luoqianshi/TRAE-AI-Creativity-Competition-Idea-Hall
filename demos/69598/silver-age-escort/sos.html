<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>银龄随行 - 紧急求助</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
    <style>
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .quick-action-btn {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .quick-action-btn:active {
            transform: scale(0.96);
        }

        .quick-action-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .quick-action-icon.red {
            background-color: rgba(230, 57, 70, 0.15);
            color: var(--primary-color);
        }

        .quick-action-icon.blue {
            background-color: rgba(52, 152, 219, 0.15);
            color: #3498DB;
        }

        .quick-action-icon.green {
            background-color: rgba(46, 204, 113, 0.15);
            color: #2ECC71;
        }

        .quick-action-icon.orange {
            background-color: rgba(243, 156, 18, 0.15);
            color: #F39C12;
        }

        .quick-action-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-title">
                <i class="fas fa-heart"></i>
                <span>银龄随行</span>
            </div>
        </header>

        <main class="main-content">
            <div class="sos-section" style="margin-top: 20px;">
                <div class="sos-title">紧急求助</div>
                <div class="sos-subtitle">遇到紧急情况，请点击下方按钮</div>
                <button class="sos-btn" onclick="handleSosClick()">
                    <i class="fas fa-phone"></i>
                </button>
            </div>

            <div class="card">
                <h3 style="font-size: 20px; font-weight: 600; margin-bottom: 16px;">当前位置</h3>
                <div class="location-bar" style="margin: 0; background: var(--bg-color);">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>人民广场站 · 3号口附近</span>
                </div>
            </div>

            <div class="emergency-contact" id="emergencyContact">
                <h4><i class="fas fa-user-friends"></i> 紧急联系人</h4>
            </div>

            <div class="card">
                <h3 style="font-size: 20px; font-weight: 600; margin-bottom: 16px;">求助方式</h3>
                <div class="quick-actions">
                    <div class="quick-action-btn" onclick="showModal('呼叫地铁客服', '正在为您呼叫地铁客服...', [
                        { text: '取消', class: 'secondary' },
                        { text: '确认呼叫', class: 'primary', action: 'callMetro' }
                    ])">
                        <div class="quick-action-icon blue">
                            <i class="fas fa-headset"></i>
                        </div>
                        <div class="quick-action-text">地铁客服</div>
                    </div>
                    <div class="quick-action-btn" onclick="showModal('呼叫120', '正在为您呼叫急救中心...', [
                        { text: '取消', class: 'secondary' },
                        { text: '确认呼叫', class: 'primary', action: 'call120' }
                    ])">
                        <div class="quick-action-icon red">
                            <i class="fas fa-ambulance"></i>
                        </div>
                        <div class="quick-action-text">120急救</div>
                    </div>
                    <div class="quick-action-btn" onclick="showModal('通知紧急联系人', `正在向${mockData.user.emergency_contact.name}发送求助信息...`, [
                        { text: '取消', class: 'secondary' },
                        { text: '确认发送', class: 'primary', action: 'notifyContact' }
                    ])">
                        <div class="quick-action-icon green">
                            <i class="fas fa-user-friends"></i>
                        </div>
                        <div class="quick-action-text">通知家人</div>
                    </div>
                    <div class="quick-action-btn" onclick="showModal('广播求助', '正在通过地铁站广播系统求助...', [
                        { text: '取消', class: 'secondary' },
                        { text: '确认广播', class: 'primary', action: 'broadcastHelp' }
                    ])">
                        <div class="quick-action-icon orange">
                            <i class="fas fa-bullhorn"></i>
                        </div>
                        <div class="quick-action-text">站内广播</div>
                    </div>
                </div>
            </div>
        </main>

        <nav class="footer-nav">
            <div class="nav-item" data-page="home" onclick="window.location.href='index.html'">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </div>
            <div class="nav-item" data-page="toilets" onclick="window.location.href='toilets.html'">
                <i class="fas fa-search-location"></i>
                <span>找厕所</span>
            </div>
            <div class="nav-item active" data-page="sos">
                <i class="fas fa-bell"></i>
                <span>求助</span>
            </div>
            <div class="nav-item" data-page="profile" onclick="window.location.href='profile.html'">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </div>
        </nav>

        <button class="voice-btn" id="voiceBtn">
            <i class="fas fa-microphone"></i>
        </button>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <h2 class="modal-title" id="modalTitle">提示</h2>
                <div class="modal-content" id="modalContent">内容</div>
                <div class="modal-actions" id="modalActions"></div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script>
        function renderEmergencyContact() {
            const contact = mockData.user.emergency_contact;
            const container = document.getElementById('emergencyContact');
            container.innerHTML = `
                <h4><i class="fas fa-user-friends"></i> 紧急联系人</h4>
                <p>姓名：${contact.name}</p>
                <p>关系：${contact.relation}</p>
                <p>电话：${contact.phone}</p>
            `;
        }

        initNav('sos');
        initVoiceBtn();
        renderEmergencyContact();
    </script>
</body>
</html>
