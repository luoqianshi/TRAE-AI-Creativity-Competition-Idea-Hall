<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>银龄随行 - 银龄服务圈</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-title">
                <i class="fas fa-heart"></i>
                <span>银龄随行</span>
            </div>
        </header>

        <main class="main-content">
            <button class="back-btn" onclick="window.location.href='index.html'">
                <i class="fas fa-arrow-left"></i>
                返回
            </button>

            <div id="servicesContent">
            </div>
        </main>

        <nav class="footer-nav">
            <div class="nav-item active" data-page="home">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </div>
            <div class="nav-item" data-page="toilets" onclick="window.location.href='toilets.html'">
                <i class="fas fa-search-location"></i>
                <span>找厕所</span>
            </div>
            <div class="nav-item" data-page="sos" onclick="window.location.href='sos.html'">
                <i class="fas fa-bell"></i>
                <span>求助</span>
            </div>
            <div class="nav-item" data-page="profile" onclick="window.location.href='profile.html'">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </div>
        </nav>

        <button class="voice-btn" id="voiceBtn">
            <i class="fas fa-microphone"></i>
        </button>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <h2 class="modal-title" id="modalTitle">提示</h2>
                <div class="modal-content" id="modalContent">内容</div>
                <div class="modal-actions" id="modalActions"></div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script>
        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function renderServices() {
            const type = getUrlParam('type') || 'medical';
            const filteredServices = mockData.services.filter(s => s.type === type);
            const typeInfo = serviceTypeMap[type];

            document.getElementById('servicesContent').innerHTML = `
                <div class="section-title">
                    <span>${typeInfo.icon}</span>
                    <span>${typeInfo.label}</span>
                </div>

                ${filteredServices.length > 0
                    ? filteredServices.map(service => createServiceCard(service)).join('')
                    : `<div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>未找到相关服务</h3>
                        <p>附近暂无此类设施</p>
                       </div>`
                }
            `;
        }

        initNav('home');
        initVoiceBtn();
        renderServices();
    </script>
</body>
</html>
