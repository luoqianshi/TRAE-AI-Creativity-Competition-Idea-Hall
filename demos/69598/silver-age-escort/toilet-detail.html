<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>银龄随行 - 厕所详情</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
    <style>
        .detail-section {
            margin-bottom: 20px;
        }

        .detail-label {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-title">
                <i class="fas fa-heart"></i>
                <span>银龄随行</span>
            </div>
        </header>

        <main class="main-content">
            <button class="back-btn" onclick="window.location.href='toilets.html'">
                <i class="fas fa-arrow-left"></i>
                返回
            </button>

            <div id="toiletDetail">
            </div>
        </main>

        <nav class="footer-nav">
            <div class="nav-item" data-page="home" onclick="window.location.href='index.html'">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </div>
            <div class="nav-item active" data-page="toilets">
                <i class="fas fa-search-location"></i>
                <span>找厕所</span>
            </div>
            <div class="nav-item" data-page="sos" onclick="window.location.href='sos.html'">
                <i class="fas fa-bell"></i>
                <span>求助</span>
            </div>
            <div class="nav-item" data-page="profile" onclick="window.location.href='profile.html'">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </div>
        </nav>

        <button class="voice-btn" id="voiceBtn">
            <i class="fas fa-microphone"></i>
        </button>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <h2 class="modal-title" id="modalTitle">提示</h2>
                <div class="modal-content" id="modalContent">内容</div>
                <div class="modal-actions" id="modalActions"></div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script>
        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function renderToiletDetail() {
            const id = getUrlParam('id') || 't1';
            const toilet = mockData.toilets.find(t => t.id === id);
            if (!toilet) {
                document.getElementById('toiletDetail').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>未找到该厕所信息</h3>
                    </div>
                `;
                return;
            }

            document.getElementById('toiletDetail').innerHTML = `
                <div class="card">
                    <h2 class="card-title">${toilet.name}</h2>
                    <div class="card-info">${toilet.station} · ${toilet.line}</div>
                </div>

                <div class="card">
                    <div class="detail-section">
                        <div class="detail-label">位置信息</div>
                        <div class="detail-value">${toilet.location}</div>
                    </div>
                    <div class="detail-section">
                        <div class="detail-label">距离</div>
                        <div class="detail-value">${toilet.distance}</div>
                    </div>
                    <div class="detail-section">
                        <div class="detail-label">楼层</div>
                        <div class="detail-value">${toilet.floor}</div>
                    </div>
                    <div class="detail-section">
                        <div class="detail-label">服务电话</div>
                        <div class="detail-value">${toilet.phone}</div>
                    </div>
                </div>

                <div class="card">
                    <h3 style="font-size: 20px; font-weight: 600; margin-bottom: 16px;">设施配备</h3>
                    <div class="facility-tags">
                        ${Object.entries(toilet.accessibility).map(([key, value]) => {
                            const facility = facilityLabels[key];
                            return `
                                <span class="facility-tag ${value ? 'available' : 'unavailable'}">
                                    ${facility.icon} ${facility.label}
                                </span>
                            `;
                        }).join('')}
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="action-btn secondary" onclick="handleNavigation('${toilet.name}')">
                        <i class="fas fa-map"></i>
                        导航前往
                    </button>
                    <button class="action-btn primary" onclick="handleSosClick()">
                        <i class="fas fa-phone"></i>
                        紧急求助
                    </button>
                </div>
            `;
        }

        function handleNavigation(name) {
            showModal('导航开始', `正在为您导航至${name}`, [{ text: '好的', class: 'primary' }]);
            speak(`正在为您导航至${name}`);
        }

        initNav('toilets');
        initVoiceBtn();
        renderToiletDetail();
    </script>
</body>
</html>
