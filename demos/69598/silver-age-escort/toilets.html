<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>银龄随行 - 找厕所</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
    <style>
        .filter-section {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .filter-tag {
            padding: 10px 20px;
            border-radius: 20px;
            background-color: var(--card-bg);
            color: var(--text-secondary);
            font-size: 16px;
            white-space: nowrap;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .filter-tag.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-title">
                <i class="fas fa-heart"></i>
                <span>银龄随行</span>
            </div>
        </header>

        <main class="main-content">
            <div class="location-bar">
                <i class="fas fa-map-marker-alt"></i>
                <span>当前位置：人民广场附近</span>
            </div>

            <div class="filter-section">
                <div class="filter-tag active" id="filter-all" onclick="renderToilets('all')">全部</div>
                <div class="filter-tag" id="filter-barrier_free" onclick="renderToilets('barrier_free')">无障碍</div>
                <div class="filter-tag" id="filter-maintenance" onclick="renderToilets('maintenance')">可使用</div>
            </div>

            <div class="section-title">
                <i class="fas fa-search-location"></i>
                <span>附近厕所</span>
            </div>

            <div id="toiletList">
            </div>
        </main>

        <nav class="footer-nav">
            <div class="nav-item" data-page="home" onclick="window.location.href='index.html'">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </div>
            <div class="nav-item active" data-page="toilets">
                <i class="fas fa-search-location"></i>
                <span>找厕所</span>
            </div>
            <div class="nav-item" data-page="sos" onclick="window.location.href='sos.html'">
                <i class="fas fa-bell"></i>
                <span>求助</span>
            </div>
            <div class="nav-item" data-page="profile" onclick="window.location.href='profile.html'">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </div>
        </nav>

        <button class="voice-btn" id="voiceBtn">
            <i class="fas fa-microphone"></i>
        </button>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <h2 class="modal-title" id="modalTitle">提示</h2>
                <div class="modal-content" id="modalContent">内容</div>
                <div class="modal-actions" id="modalActions"></div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script>
        function renderToilets(filter = 'all') {
            document.querySelectorAll('.filter-tag').forEach(tag => tag.classList.remove('active'));
            document.getElementById(`filter-${filter}`).classList.add('active');

            let filteredToilets = mockData.toilets;
            if (filter === 'barrier_free') {
                filteredToilets = mockData.toilets.filter(t => t.accessibility.has_barrier_free);
            } else if (filter === 'maintenance') {
                filteredToilets = mockData.toilets.filter(t => t.status !== 'maintenance');
            }

            const toiletList = document.getElementById('toiletList');
            toiletList.innerHTML = filteredToilets.length > 0 
                ? filteredToilets.map(toilet => createToiletCard(toilet)).join('')
                : `<div class="empty-state">
                    <i class="fas fa-search"></i>
                    <h3>未找到符合条件的厕所</h3>
                    <p>请尝试调整筛选条件</p>
                   </div>`;
        }

        initNav('toilets');
        initVoiceBtn();
        renderToilets('all');
    </script>
</body>
</html>
