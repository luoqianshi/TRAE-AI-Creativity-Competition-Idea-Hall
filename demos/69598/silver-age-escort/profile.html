<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>银龄随行 - 个人中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
    <style>
        .user-info {
            background-color: var(--primary-color);
            color: white;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }

        .user-details h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .user-details p {
            font-size: 16px;
            opacity: 0.9;
        }

        .setting-item {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .setting-item:active {
            background-color: #F5F5F5;
        }

        .setting-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .setting-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .setting-icon.blue {
            background-color: rgba(52, 152, 219, 0.15);
            color: #3498DB;
        }

        .setting-icon.green {
            background-color: rgba(46, 204, 113, 0.15);
            color: #2ECC71;
        }

        .setting-icon.orange {
            background-color: rgba(243, 156, 18, 0.15);
            color: #F39C12;
        }

        .setting-icon.purple {
            background-color: rgba(155, 89, 182, 0.15);
            color: #9B59B6;
        }

        .setting-text {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .setting-arrow {
            color: #CCCCCC;
            font-size: 20px;
        }

        .font-size-controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
        }

        .font-size-btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            border: 2px solid #E5E5E5;
            background-color: var(--card-bg);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .font-size-btn.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: rgba(230, 57, 70, 0.1);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-title">
                <i class="fas fa-heart"></i>
                <span>银龄随行</span>
            </div>
        </header>

        <main class="main-content">
            <div class="user-info" id="userInfo">
            </div>

            <div class="emergency-contact" id="emergencyContact">
            </div>

            <div class="setting-item" onclick="showFontSizeModal()">
                <div class="setting-item-left">
                    <div class="setting-icon blue">
                        <i class="fas fa-type"></i>
                    </div>
                    <span class="setting-text">字体大小</span>
                </div>
                <span class="setting-arrow" id="fontSizeLabel">${getFontSizeLabel(mockData.user.preferences.font_size)} <i class="fas fa-chevron-right"></i></span>
            </div>

            <div class="setting-item" onclick="toggleVoice()">
                <div class="setting-item-left">
                    <div class="setting-icon green">
                        <i class="fas fa-volume-up"></i>
                    </div>
                    <span class="setting-text">语音播报</span>
                </div>
                <span id="voiceStatus">${mockData.user.preferences.voice_enabled ? '开启' : '关闭'} <i class="fas fa-chevron-right"></i></span>
            </div>

            <div class="setting-item" onclick="showDialectModal()">
                <div class="setting-item-left">
                    <div class="setting-icon orange">
                        <i class="fas fa-comments"></i>
                    </div>
                    <span class="setting-text">语音方言</span>
                </div>
                <span class="setting-arrow" id="dialectLabel">${getDialectLabel(mockData.user.preferences.dialect)} <i class="fas fa-chevron-right"></i></span>
            </div>

            <div class="setting-item" onclick="showModal('关于我们', '银龄随行 - 地铁无障碍智慧如厕与出行关怀系统\n\n致力于为银发群体提供便捷、安全、有温度的地铁出行服务。', [
                { text: '知道了', class: 'primary' }
            ])">
                <div class="setting-item-left">
                    <div class="setting-icon purple">
                        <i class="fas fa-info-circle"></i>
                    </div>
                    <span class="setting-text">关于我们</span>
                </div>
                <span class="setting-arrow"><i class="fas fa-chevron-right"></i></span>
            </div>
        </main>

        <nav class="footer-nav">
            <div class="nav-item" data-page="home" onclick="window.location.href='index.html'">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </div>
            <div class="nav-item" data-page="toilets" onclick="window.location.href='toilets.html'">
                <i class="fas fa-search-location"></i>
                <span>找厕所</span>
            </div>
            <div class="nav-item" data-page="sos" onclick="window.location.href='sos.html'">
                <i class="fas fa-bell"></i>
                <span>求助</span>
            </div>
            <div class="nav-item active" data-page="profile">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </div>
        </nav>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <h2 class="modal-title" id="modalTitle">提示</h2>
                <div class="modal-content" id="modalContent">内容</div>
                <div class="modal-actions" id="modalActions"></div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script>
        function getFontSizeLabel(size) {
            const labels = { small: '小', medium: '中', large: '大', extra_large: '特大' };
            return labels[size] || '中';
        }

        function getDialectLabel(dialect) {
            const labels = { mandarin: '普通话', shanghai: '上海话', cantonese: '粤语' };
            return labels[dialect] || '普通话';
        }

        function renderProfile() {
            const user = mockData.user;
            const contact = user.emergency_contact;
            
            document.getElementById('userInfo').innerHTML = `
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-details">
                    <h3>${user.name}</h3>
                    <p>${user.age}岁 · ${user.phone}</p>
                </div>
            `;
            
            document.getElementById('emergencyContact').innerHTML = `
                <h4><i class="fas fa-user-friends"></i> 紧急联系人</h4>
                <p>姓名：${contact.name}</p>
                <p>关系：${contact.relation}</p>
                <p>电话：${contact.phone}</p>
            `;
            
            document.getElementById('fontSizeLabel').innerHTML = `${getFontSizeLabel(user.preferences.font_size)} <i class="fas fa-chevron-right"></i>`;
            document.getElementById('voiceStatus').innerHTML = `${user.preferences.voice_enabled ? '开启' : '关闭'} <i class="fas fa-chevron-right"></i>`;
            document.getElementById('dialectLabel').innerHTML = `${getDialectLabel(user.preferences.dialect)} <i class="fas fa-chevron-right"></i>`;
        }

        function showFontSizeModal() {
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            const modalActions = document.getElementById('modalActions');
            
            modalTitle.textContent = '字体大小';
            modalContent.innerHTML = `
                <div class="font-size-controls">
                    <button class="font-size-btn ${mockData.user.preferences.font_size === 'small' ? 'active' : ''}" onclick="setFontSize('small')">小</button>
                    <button class="font-size-btn ${mockData.user.preferences.font_size === 'medium' ? 'active' : ''}" onclick="setFontSize('medium')">中</button>
                    <button class="font-size-btn ${mockData.user.preferences.font_size === 'large' ? 'active' : ''}" onclick="setFontSize('large')">大</button>
                    <button class="font-size-btn ${mockData.user.preferences.font_size === 'extra_large' ? 'active' : ''}" onclick="setFontSize('extra_large')">特大</button>
                </div>
            `;
            modalActions.innerHTML = `<button class="modal-btn primary" onclick="closeModal()">确定</button>`;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function setFontSize(size) {
            mockData.user.preferences.font_size = size;
            const sizes = { small: '14px', medium: '16px', large: '18px', extra_large: '22px' };
            document.body.style.fontSize = sizes[size];
            document.querySelectorAll('.font-size-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('fontSizeLabel').innerHTML = `${getFontSizeLabel(size)} <i class="fas fa-chevron-right"></i>`;
        }

        function toggleVoice() {
            mockData.user.preferences.voice_enabled = !mockData.user.preferences.voice_enabled;
            document.getElementById('voiceStatus').innerHTML = `${mockData.user.preferences.voice_enabled ? '开启' : '关闭'} <i class="fas fa-chevron-right"></i>`;
            if (mockData.user.preferences.voice_enabled) {
                speak('语音播报已开启');
            }
        }

        function showDialectModal() {
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            const modalActions = document.getElementById('modalActions');
            
            modalTitle.textContent = '选择方言';
            modalContent.innerHTML = `
                <div class="font-size-controls">
                    <button class="font-size-btn ${mockData.user.preferences.dialect === 'mandarin' ? 'active' : ''}" onclick="setDialect('mandarin')">普通话</button>
                    <button class="font-size-btn ${mockData.user.preferences.dialect === 'shanghai' ? 'active' : ''}" onclick="setDialect('shanghai')">上海话</button>
                    <button class="font-size-btn ${mockData.user.preferences.dialect === 'cantonese' ? 'active' : ''}" onclick="setDialect('cantonese')">粤语</button>
                </div>
            `;
            modalActions.innerHTML = `<button class="modal-btn primary" onclick="closeModal()">确定</button>`;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function setDialect(dialect) {
            mockData.user.preferences.dialect = dialect;
            document.querySelectorAll('.font-size-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('dialectLabel').innerHTML = `${getDialectLabel(dialect)} <i class="fas fa-chevron-right"></i>`;
        }

        initNav('profile');
        renderProfile();
    </script>
</body>
</html>
