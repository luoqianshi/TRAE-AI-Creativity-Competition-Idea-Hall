<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>心情日记</title>
  <style>
    :root{
      --bg: #faf7f4;
      --card: rgba(255,255,255,.72);
      --text: #1d1b19;
      --muted: rgba(29,27,25,.62);
      --line: rgba(29,27,25,.10);
      --accent: #7aa7a2;
      --shadow: 0 12px 30px rgba(20, 18, 16, .08);
      --radius: 18px;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0f1213;
        --card: rgba(255,255,255,.06);
        --text: rgba(255,255,255,.90);
        --muted: rgba(255,255,255,.60);
        --line: rgba(255,255,255,.12);
        --accent: #79bdb4;
        --shadow: 0 18px 40px rgba(0,0,0,.35);
      }
    }
    *{ box-sizing: border-box; }
    html,body{ height: 100%; }
    body{
      margin:0;
      font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(122,167,162,.18), transparent 55%),
        radial-gradient(1000px 700px at 80% 0%, rgba(122,167,162,.14), transparent 60%),
        radial-gradient(900px 700px at 60% 100%, rgba(122,167,162,.12), transparent 60%),
        var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 22px 16px;
    }
    .wrap{ width: min(860px, 100%); }
    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 14px;
      margin-bottom: 14px;
    }
    h1{
      margin:0;
      font-size: 22px;
      letter-spacing: .06em;
      font-weight: 650;
    }
    .sub{
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .card{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 18px;
    }
    .row{
      display:flex;
      flex-wrap:wrap;
      gap: 10px 12px;
      align-items:center;
      justify-content:space-between;
      margin-bottom: 12px;
    }
    label{ color: var(--muted); font-size: 13px; }
    input[type="date"]{
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      outline: none;
      min-height: 40px;
    }
    input[type="date"]:focus{ border-color: rgba(122,167,162,.55); box-shadow: 0 0 0 4px rgba(122,167,162,.18); }
    .moods{
      display:flex;
      flex-wrap:wrap;
      gap: 8px;
      align-items:center;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: transparent;
      cursor: pointer;
      user-select:none;
      transition: transform .06s ease, border-color .15s ease, background-color .15s ease;
    }
    .pill:active{ transform: scale(.98); }
    .pill input{ accent-color: var(--accent); }
    .pill span{ font-size: 14px; color: var(--text); }
    .pill[data-checked="true"]{
      border-color: rgba(122,167,162,.55);
      background: rgba(122,167,162,.10);
    }
    textarea{
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 12px;
      min-height: 260px;
      resize: vertical;
      background: transparent;
      color: var(--text);
      font: inherit;
      outline: none;
    }
    textarea:focus{ border-color: rgba(122,167,162,.55); box-shadow: 0 0 0 4px rgba(122,167,162,.18); }
    .footer{
      display:flex;
      flex-wrap:wrap;
      gap: 10px 12px;
      align-items:center;
      justify-content:space-between;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12.5px;
    }
    .status{
      display:flex;
      align-items:center;
      gap: 8px;
    }
    .dot{
      width: 8px; height: 8px; border-radius: 999px;
      background: rgba(122,167,162,.55);
      box-shadow: 0 0 0 3px rgba(122,167,162,.18);
    }
    .hint{ color: var(--muted); }
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      border: 1px solid var(--line);
      border-bottom-color: rgba(29,27,25,.18);
      border-radius: 10px;
      padding: 2px 7px;
      color: var(--muted);
      background: rgba(255,255,255,.08);
    }
    @media (max-width: 520px){
      .card{ padding: 14px; }
      header{ align-items:flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>心情日记</h1>
        <p class="sub">每日一小段，安静地记下此刻。</p>
      </div>
      <div class="hint">本地自动保存 · 离线可用</div>
    </header>

    <main class="card" aria-label="心情日记编辑区">
      <div class="row">
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <div>
            <label for="date">日期</label><br />
            <input id="date" type="date" />
          </div>
          <div>
            <label>心情</label><br />
            <div class="moods" id="moods" role="radiogroup" aria-label="心情选择">
              <label class="pill" data-value="平静"><input type="radio" name="mood" value="平静" /><span>平静</span></label>
              <label class="pill" data-value="开心"><input type="radio" name="mood" value="开心" /><span>开心</span></label>
              <label class="pill" data-value="疲惫"><input type="radio" name="mood" value="疲惫" /><span>疲惫</span></label>
              <label class="pill" data-value="难过"><input type="radio" name="mood" value="难过" /><span>难过</span></label>
              <label class="pill" data-value="焦虑"><input type="radio" name="mood" value="焦虑" /><span>焦虑</span></label>
            </div>
          </div>
        </div>
        <div class="hint">快速键：<span class="kbd">Ctrl</span> + <span class="kbd">S</span> 也可手动保存</div>
      </div>

      <label for="note">随笔</label>
      <textarea id="note" placeholder="写下今天的心情、一些小事，或只是几句话……"></textarea>

      <div class="footer">
        <div class="status" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <span id="statusText">未保存</span>
        </div>
        <div id="metaText" class="hint"></div>
      </div>
    </main>
  </div>

  <script>
    (function(){
      const $ = (sel) => document.querySelector(sel);
      const dateEl = $("#date");
      const noteEl = $("#note");
      const statusTextEl = $("#statusText");
      const metaTextEl = $("#metaText");
      const moodPills = Array.from(document.querySelectorAll(".pill"));
      const moodRadios = Array.from(document.querySelectorAll("input[name='mood']"));

      const STORAGE_PREFIX = "moodDiary:v1:";
      const LAST_DATE_KEY = STORAGE_PREFIX + "_lastDate";
      let saveTimer = null;
      let dirty = false;

      function todayISO(){
        const d = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
      }

      function nowHM(){
        const d = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        return pad(d.getHours()) + ":" + pad(d.getMinutes());
      }

      function keyFor(dateStr){ return STORAGE_PREFIX + dateStr; }

      function setStatus(text){ statusTextEl.textContent = text; }

      function updatePills(){
        const val = getMood();
        moodPills.forEach(p => p.dataset.checked = (p.dataset.value === val) ? "true" : "false");
      }

      function getMood(){
        const checked = moodRadios.find(r => r.checked);
        return checked ? checked.value : "";
      }

      function setMood(val){
        moodRadios.forEach(r => r.checked = (r.value === val));
        updatePills();
      }

      function load(dateStr){
        const raw = localStorage.getItem(keyFor(dateStr));
        if(!raw){
          noteEl.value = "";
          setMood("平静");
          metaTextEl.textContent = "这一天还没有记录。";
          dirty = false;
          setStatus("未保存");
          return;
        }
        try{
          const data = JSON.parse(raw);
          noteEl.value = data.note || "";
          setMood(data.mood || "平静");
          metaTextEl.textContent = (data.updatedAt ? ("上次保存：" + data.updatedAt) : "已加载");
          dirty = false;
          setStatus("已加载");
        }catch(e){
          noteEl.value = raw;
          setMood("平静");
          metaTextEl.textContent = "已加载（旧格式）";
          dirty = false;
          setStatus("已加载");
        }
      }

      function saveNow(){
        const dateStr = dateEl.value;
        if(!dateStr) return;
        const payload = {
          date: dateStr,
          mood: getMood(),
          note: noteEl.value || "",
          updatedAt: nowHM()
        };
        localStorage.setItem(keyFor(dateStr), JSON.stringify(payload));
        localStorage.setItem(LAST_DATE_KEY, dateStr);
        dirty = false;
        metaTextEl.textContent = "上次保存：" + payload.updatedAt;
        setStatus("已自动保存");
      }

      function scheduleSave(){
        dirty = true;
        setStatus("正在编辑…");
        if(saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(saveNow, 350);
      }

      // Init date
      const initialDate = localStorage.getItem(LAST_DATE_KEY) || todayISO();
      dateEl.value = initialDate;
      load(initialDate);

      // Date switch
      dateEl.addEventListener("change", () => {
        if(dirty){
          // best-effort: flush pending save before switching
          if(saveTimer) clearTimeout(saveTimer);
          saveNow();
        }
        load(dateEl.value);
      });

      // Mood interaction
      moodPills.forEach(pill => {
        pill.addEventListener("click", () => {
          setMood(pill.dataset.value);
          scheduleSave();
        });
      });
      moodRadios.forEach(r => r.addEventListener("change", () => {
        updatePills();
        scheduleSave();
      }));

      // Note input
      noteEl.addEventListener("input", scheduleSave);

      // Ctrl/Cmd+S manual save
      window.addEventListener("keydown", (e) => {
        const isSave = (e.key === "s" || e.key === "S") && (e.ctrlKey || e.metaKey);
        if(!isSave) return;
        e.preventDefault();
        if(saveTimer) clearTimeout(saveTimer);
        saveNow();
        setStatus("已保存");
      });

      // Gentle first paint
      updatePills();
    })();
  </script>
</body>
</html>
