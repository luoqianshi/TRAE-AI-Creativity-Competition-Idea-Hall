<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毕业论文智能排版 · 多页增强版</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --panel-bg: #ffffff;
            --text: #2c3e50;
            --text-secondary: #5a6c7d;
            --border: #e0e5ea;
            --primary: #4a6cf7;
            --primary-hover: #3651d5;
            --primary-light: #eef1fe;
            --accent: #f0a04b;
            --success: #27ae60;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.12);
            --radius: 8px;
            --transition: 0.2s ease;
            --paper-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .navbar {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 12px;
            flex-wrap: wrap;
        }
        .navbar .logo {
            font-weight: 700;
            font-size: 17px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .navbar .actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 7px 14px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            background: #fff;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .btn:hover {
            background: #f8f9fb;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
        }
        .btn-accent {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-accent:hover {
            background: #e08d35;
        }
        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }
        select,
        input[type="number"],
        input[type="text"] {
            padding: 6px 10px;
            border-radius: 5px;
            border: 1px solid var(--border);
            font-size: 12px;
            transition: var(--transition);
        }

        .main-container {
            display: flex;
            height: calc(100vh - 56px);
            overflow: hidden;
        }
        .left-panel {
            width: 380px;
            min-width: 380px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px;
            gap: 12px;
        }
        .left-panel.collapsed {
            width: 0;
            min-width: 0;
            padding: 0;
            overflow: hidden;
        }
        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 300px;
            border-right: 1px solid var(--border);
            background: #fdfdfd;
        }
        .center-toolbar {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: #fafbfc;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .editor-area {
            flex: 1;
            padding: 10px;
            display: flex;
        }
        .editor-area textarea {
            flex: 1;
            width: 100%;
            border: 2px dashed #dde;
            border-radius: var(--radius);
            padding: 14px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            resize: none;
            background: #fafbfc;
        }
        .preview-panel {
            flex: 1.5;
            min-width: 500px;
            background: #e8ecf1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .preview-header {
            padding: 10px 16px;
            background: #fafbfc;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 13px;
        }
        .preview-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .paper-a4 {
            background: #fff;
            box-shadow: var(--shadow-lg);
            padding: 25mm 30mm 25mm 30mm;
            width: 210mm;
            min-height: 297mm;
            font-family: 'SimSun', '宋体', 'Songti SC', serif;
            font-size: 12pt;
            line-height: 1.8;
            color: #1a1a1a;
            position: relative;
            box-sizing: border-box;
            break-after: page;
            page-break-after: always;
        }
        .paper-a4 .page-header {
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
            margin-bottom: 15px;
            font-size: 9pt;
            color: #555;
        }
        .paper-a4 .page-footer {
            text-align: center;
            border-top: 1px solid #ccc;
            padding-top: 4px;
            margin-top: 20px;
            font-size: 9pt;
            color: #888;
        }
        .paper-a4:last-child {
            break-after: auto;
            page-break-after: auto;
        }

        .table-caption,
        .figure-caption {
            text-align: center;
            font-weight: bold;
            margin: 8px 0 4px;
        }
        .table-content {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0;
            font-size: 10.5pt;
        }
        .table-content th {
            border-top: 1.5pt solid #000;
            border-bottom: 0.75pt solid #000;
            padding: 6px;
            background: #f9f9f9;
        }
        .table-content td {
            padding: 6px;
            border-bottom: 0.5pt solid #333;
        }
        .figure-placeholder {
            border: 2px dashed #aaa;
            background: #f5f5f5;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            margin: 10px 0;
            font-size: 14px;
        }
        .ref-item {
            text-indent: -2em;
            padding-left: 2em;
            margin-bottom: 2px;
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            background: #333;
            color: #fff;
            padding: 10px 18px;
            border-radius: var(--radius);
            font-size: 13px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                transform: translateX(100px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @media print {
            body {
                background: #fff;
            }
            .navbar,
            .left-panel,
            .center-panel,
            .preview-header,
            .btn,
            .preview-scale-control {
                display: none !important;
            }
            .main-container {
                display: block !important;
                height: auto !important;
            }
            .preview-panel {
                background: #fff !important;
                overflow: visible !important;
            }
            .preview-scroll {
                overflow: visible !important;
                padding: 0 !important;
                background: #fff !important;
                gap: 0 !important;
            }
            .paper-a4 {
                box-shadow: none !important;
                page-break-after: always;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">📄 论文智能排版 Pro</div>
        <div class="actions">
            <button class="btn" onclick="toggleLeftPanel()">⚙️ 面板</button>
            <button class="btn btn-primary" onclick="applyFormatting()">🔄 应用排版</button>
            <button class="btn btn-accent" onclick="exportWord()">📥 导出Word</button>
            <button class="btn" onclick="printPaper()">🖨️ 打印PDF</button>
        </div>
    </nav>

    <div class="main-container">
        <aside class="left-panel" id="leftPanel">
            <details open><summary>📏 页面设置</summary>
                <label>纸张: <select id="paperSize"><option value="A4">A4</option></select></label>
                <label>上边距(mm): <input id="marginTop" type="number" value="25" step="1"></label>
                <label>下边距(mm): <input id="marginBottom" type="number" value="25" step="1"></label>
                <label>左边距(mm): <input id="marginLeft" type="number" value="30" step="1"></label>
                <label>右边距(mm): <input id="marginRight" type="number" value="25" step="1"></label>
                <label>页眉: <input id="headerText" type="text" value="XX大学本科毕业论文"></label>
                <label><input type="checkbox" id="showPageNumber" checked> 显示页码</label>
            </details>
            <details open><summary>🔤 正文格式</summary>
                <label>字体: <select id="bodyFontFamily"><option value="SimSun, 宋体, serif">宋体</option></select></label>
                <label>字号: <select id="bodyFontSize"><option value="12pt">小四</option></select></label>
                <label>行距: <select id="bodyLineHeight"><option value="1.5">1.5倍</option></select></label>
                <label>首行缩进: <input id="textIndent" type="number" value="2" step="0.5">em</label>
            </details>
            <details open><summary>📋 标题 & 编号</summary>
                <label><input type="checkbox" id="autoNumbering"> 自动多级编号 (如1, 1.1, 1.1.1)</label>
                <label>一级字号: <select id="h1FontSize"><option value="16pt">三号</option></select></label>
                <label>二级字号: <select id="h2FontSize"><option value="14pt">四号</option></select></label>
                <label>三级字号: <select id="h3FontSize"><option value="12pt">小四</option></select></label>
            </details>
            <details open><summary>📊 图表 & 参考文献</summary>
                <label>参考文献制式:
                    <select id="refStyle">
                        <option value="numeric">顺序编码制 [1]</option>
                        <option value="author-year">著者-出版年 (作者, 年份)</option>
                    </select>
                </label>
                <label><input type="checkbox" id="refHanging" checked> 悬挂缩进</label>
            </details>
            <details><summary>💾 配置管理</summary>
                <button class="btn btn-sm" onclick="saveConfig()">💾 保存当前配置</button>
                <button class="btn btn-sm" onclick="loadConfig()">📂 加载配置文件</button>
                <button class="btn btn-sm" onclick="exportStructureJSON()">📤 导出结构JSON</button>
                <button class="btn btn-sm" onclick="importStructureJSON()">📥 导入结构JSON</button>
                <p style="font-size:11px;color:#666;">可配合Python预处理：导出/导入结构化JSON</p>
            </details>
        </aside>

        <div class="center-panel">
            <div class="center-toolbar">
                <span style="font-weight:600;">✏️ 论文内容</span>
                <button class="btn btn-sm" onclick="loadDemo()">📥 示例论文</button>
                <button class="btn btn-sm" onclick="clearEditor()">🗑️ 清空</button>
            </div>
            <div class="editor-area">
                <textarea id="paperInput" placeholder="在此粘贴论文纯文本..."></textarea>
            </div>
        </div>

        <div class="preview-panel">
            <div class="preview-header">
                👁️ 分页预览 (A4纸)
                <span style="margin-left:auto;font-size:12px;">缩放:
                    <button class="btn btn-sm" onclick="changeScale(-0.1)">-</button>
                    <span id="scaleDisplay">100%</span>
                    <button class="btn btn-sm" onclick="changeScale(0.1)">+</button>
                </span>
            </div>
            <div class="preview-scroll" id="previewScroll">
                <div id="paperContainer" style="display:flex;flex-direction:column;align-items:center;gap:24px;"></div>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        let currentScale = 1.0;
        let leftPanelVisible = true;
        const $ = id => document.getElementById(id);
        const paperInput = $('paperInput');
        const paperContainer = $('paperContainer');
        const previewScroll = $('previewScroll');

        function showToast(msg, type = 'info') {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            $('toastContainer').appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        function toggleLeftPanel() {
            leftPanelVisible = !leftPanelVisible;
            $('leftPanel').classList.toggle('collapsed', !leftPanelVisible);
        }

        function changeScale(delta) {
            currentScale = Math.max(0.4, Math.min(2.0, +(currentScale + delta).toFixed(1)));
            $('scaleDisplay').textContent = Math.round(currentScale * 100) + '%';
            document.querySelectorAll('.paper-a4').forEach(p => p.style.transform = `scale(${currentScale})`);
        }

        function getSettings() {
            return {
                paperSize: $('paperSize').value,
                marginTop: +$('marginTop').value,
                marginBottom: +$('marginBottom').value,
                marginLeft: +$('marginLeft').value,
                marginRight: +$('marginRight').value,
                headerText: $('headerText').value,
                showPageNumber: $('showPageNumber').checked,
                bodyFontFamily: $('bodyFontFamily').value,
                bodyFontSize: $('bodyFontSize').value,
                bodyLineHeight: +$('bodyLineHeight').value,
                textIndent: +$('textIndent').value,
                autoNumbering: $('autoNumbering').checked,
                h1FontSize: $('h1FontSize').value,
                h2FontSize: $('h2FontSize').value,
                h3FontSize: $('h3FontSize').value,
                refStyle: $('refStyle').value,
                refHanging: $('refHanging').checked,
            };
        }

        function setFormValues(settings) {
            for (let [key, value] of Object.entries(settings)) {
                const el = document.getElementById(key);
                if (!el) continue;
                if (el.type === 'checkbox') el.checked = value;
                else el.value = value;
            }
        }

        // 智能解析 + 图表识别
        function parseBlocks(text, settings) {
            if (!text.trim()) return [];
            const lines = text.split(/\n/);
            const rawBlocks = [];
            let cur = [];
            for (let line of lines) {
                if (line.trim() === '') {
                    if (cur.length) { rawBlocks.push(cur); cur = []; }
                } else cur.push(line);
            }
            if (cur.length) rawBlocks.push(cur);

            const blocks = [];
            let headingCounters = [0, 0, 0];
            let inRef = false;

            for (let group of rawBlocks) {
                const first = group[0].trim();
                const full = group.join('\n').trim();
                let type = 'para';
                let content = full;

                // 参考文献标题
                if (/^参考文献\s*$/i.test(first) || /^References\s*$/i.test(first)) {
                    type = 'ref-title';
                    inRef = true;
                }
                // 参考文献条目
                else if (inRef && /^\[\d+\]/.test(first)) {
                    type = 'ref-item';
                    content = full;
                }
                // 图表标题：表1 或 图1
                else if (/^(表|图)\s*\d+/i.test(first)) {
                    type = first.startsWith('表') ? 'table' : 'figure';
                    content = full;
                }
                // 标题识别
                else if (/^第[一二三四五六七八九十\d]+章/.test(first)) {
                    type = 'h1';
                    headingCounters[0]++; headingCounters[1] = 0;
                    headingCounters[2] = 0;
                    content = full;
                } else if (/^[一二三四五六七八九十]+[、，]/.test(first) && first.length < 30) {
                    type = 'h2';
                    headingCounters[1]++; headingCounters[2] = 0;
                    content = full;
                } else if (/^[（(][一二三四五六七八九十]+[）)]/.test(first) || /^\d+[\.\)、]\s/.test(first)) {
                    type = 'h3';
                    headingCounters[2]++;
                    content = full;
                } else if (/^摘要\s*$/i.test(first) || /^Abstract\s*$/i.test(first)) {
                    type = 'abstract-title';
                } else if (/^关键词[\s：:]/i.test(first) || /^Keywords[\s：:]/i.test(first)) {
                    type = 'keywords';
                }

                // 自动编号处理
                let numberPrefix = '';
                if (settings.autoNumbering && (type === 'h1' || type === 'h2' || type === 'h3')) {
                    if (type === 'h1') numberPrefix = headingCounters[0] + ' ';
                    else if (type === 'h2') numberPrefix = headingCounters[0] + '.' + headingCounters[1] + ' ';
                    else if (type === 'h3') numberPrefix = headingCounters[0] + '.' + headingCounters[1] + '.' + headingCounters[
                        2] + ' ';
                    // 移除原有编号文本（如“第一章”、“一、”等）
                    content = content.replace(/^第[一二三四五六七八九十\d]+章\s*/, '').replace(/^[一二三四五六七八九十]+[、，]\s*/, '')
                        .replace(/^[（(][一二三四五六七八九十]+[）)]\s*/, '').replace(/^\d+[\.\)、]\s*/, '').trim();
                    content = numberPrefix + content;
                }

                blocks.push({ type, content, raw: full });
                if (type === 'ref-title') inRef = true;
                if (inRef && type !== 'ref-item' && type !== 'ref-title') inRef = false;
            }
            return blocks;
        }

        function renderBlockHTML(block, settings) {
            const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            switch (block.type) {
                case 'abstract-title':
                    return `<h3 style="text-align:center;font-weight:bold;font-size:14pt;">${esc(block.content)}</h3>`;
                case 'keywords':
                    return `<p style="font-weight:bold;">${esc(block.content)}</p>`;
                case 'h1':
                    return `<h2 style="font-size:${settings.h1FontSize};font-weight:bold;text-align:center;margin:20px 0 10px;">${esc(block.content)}</h2>`;
                case 'h2':
                    return `<h3 style="font-size:${settings.h2FontSize};font-weight:bold;margin:16px 0 8px;">${esc(block.content)}</h3>`;
                case 'h3':
                    return `<h4 style="font-size:${settings.h3FontSize};font-weight:bold;margin:12px 0 6px;">${esc(block.content)}</h4>`;
                case 'ref-title':
                    return `<h3 style="font-weight:bold;text-align:center;margin:24px 0 12px;">${esc(block.content)}</h3>`;
                case 'ref-item':
                    let refText = esc(block.content);
                    if (settings.refStyle === 'author-year') {
                        refText = refText.replace(/^\[\d+\]\s*/, '');
                        const authorMatch = refText.match(/^([^,]+)/);
                        if (authorMatch) refText = `<strong>${authorMatch[1]}</strong>` + refText.substring(authorMatch[1]
                            .length);
                    }
                    return `<p class="ref-item" style="font-size:10.5pt;${settings.refHanging?'text-indent:-2em;padding-left:2em;':''}">${refText}</p>`;
                case 'table':
                    const tableTitle = esc(block.content);
                    return `<div class="table-caption">${tableTitle}</div>
                <table class="table-content"><tr><th>列1</th><th>列2</th></tr><tr><td>数据</td><td>数据</td></tr></table>`;
                case 'figure':
                    return `<div class="figure-caption">${esc(block.content)}</div>
                <div class="figure-placeholder">📷 图片占位符</div>`;
                default:
                    return `<p style="font-family:${settings.bodyFontFamily};font-size:${settings.bodyFontSize};line-height:${settings.bodyLineHeight};text-indent:${settings.textIndent}em;">${esc(block.content)}</p>`;
            }
        }

        function paginate(blocks, settings) {
            const contentWidthMM = 210 - settings.marginLeft - settings.marginRight;
            const contentHeightMM = 297 - settings.marginTop - settings.marginBottom;
            const pxPerMM = 3.78;
            const pageWidthPx = contentWidthMM * pxPerMM;
            const pageHeightPx = contentHeightMM * pxPerMM;

            const tempDiv = document.createElement('div');
            tempDiv.style.cssText = `position:absolute;visibility:hidden;width:${pageWidthPx}px;font-family:SimSun,宋体,serif;font-size:12pt;line-height:1.8;padding:0;box-sizing:border-box;`;
            document.body.appendChild(tempDiv);

            const pages = [];
            let currentPageBlocks = [];
            let currentHeight = 0;
            const headerFooterHeight = 50;

            for (let block of blocks) {
                const html = renderBlockHTML(block, settings);
                tempDiv.innerHTML = html;
                const blockHeight = tempDiv.scrollHeight;
                if (currentHeight + blockHeight > pageHeightPx - headerFooterHeight && currentPageBlocks.length > 0) {
                    pages.push(currentPageBlocks);
                    currentPageBlocks = [];
                    currentHeight = 0;
                }
                currentPageBlocks.push(block);
                currentHeight += blockHeight;
            }
            if (currentPageBlocks.length) pages.push(currentPageBlocks);
            document.body.removeChild(tempDiv);
            return pages;
        }

        function renderPages(pageBlocksArray, settings) {
            paperContainer.innerHTML = '';
            let pageNum = 1;
            for (let blocks of pageBlocksArray) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'paper-a4';
                pageDiv.style.padding = `${settings.marginTop}mm ${settings.marginRight}mm ${settings.marginBottom}mm ${settings.marginLeft}mm`;
                let html = `<div class="page-header">${settings.headerText || ' '}</div><div class="paper-content">`;
                for (let b of blocks) html += renderBlockHTML(b, settings);
                html += `</div><div class="page-footer">${settings.showPageNumber ? '- ' + pageNum + ' -' : ' '}</div>`;
                pageDiv.innerHTML = html;
                pageDiv.style.transform = `scale(${currentScale})`;
                paperContainer.appendChild(pageDiv);
                pageNum++;
            }
        }

        function applyFormatting() {
            const settings = getSettings();
            const blocks = parseBlocks(paperInput.value, settings);
            const pages = paginate(blocks, settings);
            if (pages.length === 0) {
                paperContainer.innerHTML = '<div class="paper-a4"><p style="text-align:center;padding-top:100px;">无内容</p></div>';
                return;
            }
            renderPages(pages, settings);
            showToast(`已生成 ${pages.length} 页`);
        }

        function exportWord() {
            applyFormatting();
            const pagesHTML = Array.from(document.querySelectorAll('.paper-a4')).map(p => p.outerHTML).join(
                '<br style="page-break-after: always;">');
            const fullHTML = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset="UTF-8"><style>@page{size:A4;margin:2cm;}body{font-family:SimSun;}</style></head><body>${pagesHTML}</body></html>`;
            const blob = new Blob([fullHTML], { type: 'application/msword' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '论文排版.doc';
            a.click();
            showToast('Word文件已下载');
        }

        function printPaper() {
            applyFormatting();
            setTimeout(() => window.print(), 300);
        }

        function saveConfig() {
            const blob = new Blob([JSON.stringify(getSettings(), null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '论文格式配置.json';
            a.click();
        }

        function loadConfig() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const cfg = JSON.parse(ev.target.result);
                        setFormValues(cfg);
                        showToast('配置已加载');
                    } catch { showToast('无效的配置文件'); }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function exportStructureJSON() {
            const settings = getSettings();
            const blocks = parseBlocks(paperInput.value, settings);
            const blob = new Blob([JSON.stringify(blocks, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '论文结构.json';
            a.click();
        }

        function importStructureJSON() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const blocks = JSON.parse(ev.target.result);
                        const settings = getSettings();
                        const pages = paginate(blocks, settings);
                        renderPages(pages, settings);
                        showToast('结构JSON已导入并渲染');
                    } catch { showToast('无效的结构文件'); }
                };
                reader.readAsText(file);
            };
            input.click();
        }

参考文献

        }

        function clearEditor() {
            paperInput.value = '';
            paperContainer.innerHTML = '';
        }

        window.addEventListener('load', () => {
            loadDemo();
            changeScale(0);
        });
    </script>
