<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打字学英语 RPG</title>
<style>
/* === RESET & BASE - Linear Design === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0d0d; --bg2: #161616; --bg3: #1e1e1e; --bg4: #262626;
  --fg: #e6e6e6; --fg2: #999; --fg3: #666;
  --accent: #5b6af0; --accent2: #7b8af8; --green: #34d399; --red: #f87171;
  --yellow: #fbbf24; --orange: #f59e0b; --purple: #a78bfa;
  --radius: 8px; --radius2: 12px; --font: 'Segoe UI', system-ui, sans-serif;
  --canvas-w: 360px; --canvas-h: 640px; --type-w: 540px;
}
body {
  font-family: var(--font); background: var(--bg); color: var(--fg);
  display: flex; justify-content: center; align-items: center; min-height: 100vh;
  overflow: hidden; user-select: none; -webkit-user-select: none;
}
#app {
  width: 900px; height: 640px; position: relative; background: var(--bg2);
  border-radius: var(--radius2); overflow: hidden;
  box-shadow: 0 0 60px rgba(91,106,240,0.08), 0 4px 24px rgba(0,0,0,0.5);
}
/* === SCREENS === */
.screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
.screen.active { display: flex; }

/* === MAIN MENU === */
#main-menu {
  flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  background: linear-gradient(180deg, #0d0d0d 0%, #1a1a2e 100%);
}
#main-menu .logo { font-size: 38px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
#main-menu .logo span { color: var(--accent); }
#main-menu .subtitle { font-size: 13px; color: var(--fg3); margin-bottom: 24px; }
.menu-btn {
  width: 240px; height: 44px; border: 1px solid var(--bg4); border-radius: var(--radius);
  background: var(--bg3); color: var(--fg); font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: all 0.15s; letter-spacing: 0.3px;
}
.menu-btn:hover { background: var(--bg4); border-color: var(--accent); color: #fff; }
.menu-btn .icon { font-size: 18px; opacity: 0.7; }

/* === LEVEL SELECT === */
#level-select { flex-direction: column; padding: 32px; overflow-y: auto; }
#level-select h2 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
#level-select .theme-label { font-size: 12px; color: var(--fg3); margin-bottom: 20px; letter-spacing: 0.5px; text-transform: uppercase; }
.level-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-bottom: 20px; }
.level-btn {
  width: 100%; aspect-ratio: 1; border: 1px solid var(--bg4); border-radius: var(--radius);
  background: var(--bg3); color: var(--fg); font-size: 13px; font-weight: 500;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.12s; min-width: 40px;
}
.level-btn:hover:not(.locked) { background: var(--bg4); border-color: var(--accent); }
.level-btn.locked { background: transparent; border-color: var(--bg4); color: var(--fg3); cursor: not-allowed; font-size: 11px; }
.level-btn.boss { border-color: var(--purple); color: var(--purple); font-weight: 700; }
.level-btn.done { background: #1a2e1a; border-color: var(--green); color: var(--green); }
.level-btn.current { background: #1a1a3e; border-color: var(--accent); color: var(--accent2); animation: pulse-border 2s infinite; }
@keyframes pulse-border { 0%,100% { border-color: var(--accent); } 50% { border-color: var(--accent2); } }
.back-btn {
  padding: 8px 24px; border: 1px solid var(--bg4); border-radius: var(--radius);
  background: transparent; color: var(--fg2); font-size: 14px; cursor: pointer;
  align-self: flex-start; transition: all 0.12s;
}
.back-btn:hover { background: var(--bg4); color: #fff; }

/* === GAME SCREEN === */
#game-screen { flex-direction: row; }
#game-canvas-wrap { width: var(--canvas-w); height: 100%; position: relative; background: #000; }
#game-canvas-wrap canvas { display: block; }
.game-hud {
  position: absolute; top: 8px; left: 8px; right: 8px; display: flex;
  justify-content: space-between; font-size: 12px; font-weight: 600; pointer-events: none;
  z-index: 2;
}
.game-hud .hp-bar-bg { width: 80px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
.game-hud .hp-bar { height: 100%; background: var(--green); transition: width 0.3s; border-radius: 3px; }
.game-hud .energy-dots { display: flex; gap: 3px; align-items: center; }
.game-hud .energy-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.15); }
.game-hud .energy-dot.filled { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

#typing-area {
  width: var(--type-w); height: 100%; background: var(--bg2); display: flex;
  flex-direction: column; align-items: center; padding: 24px 32px; gap: 12px;
}
.typing-word-display {
  font-size: 32px; font-weight: 700; letter-spacing: 1px; min-height: 48px;
  display: flex; align-items: center; color: var(--fg);
}
.typing-word-display .correct { color: var(--green); }
.typing-word-display .current { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
.typing-word-display .pending { color: var(--fg3); }
.typing-hint { font-size: 13px; color: var(--fg3); min-height: 20px; }
.typing-input {
  width: 100%; height: 42px; border: 1px solid var(--bg4); border-radius: var(--radius);
  background: var(--bg3); color: var(--fg); font-size: 18px; padding: 0 14px;
  outline: none; text-align: center; font-family: 'Consolas', 'Courier New', monospace;
  letter-spacing: 2px;
}
.typing-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(91,106,240,0.15); }
.typing-input.error { border-color: var(--red); animation: shake 0.3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
.combo-display { font-size: 22px; font-weight: 700; color: var(--yellow); min-height: 30px; }
.virtual-keyboard { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 100%; }
.vk-row { display: flex; justify-content: center; gap: 3px; }
.vk-key {
  width: 34px; height: 34px; border: 1px solid var(--bg4); border-radius: 4px;
  background: var(--bg3); color: var(--fg2); font-size: 12px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}
.vk-key.space { width: 200px; }
.vk-key.highlight { border-color: var(--accent); background: rgba(91,106,240,0.2); color: var(--accent2); }
.skill-hint { font-size: 12px; color: var(--fg3); margin-top: 4px; }
.pause-btn {
  position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px; background: rgba(0,0,0,0.4); color: var(--fg2); font-size: 16px;
  cursor: pointer; z-index: 3; display: flex; align-items: center; justify-content: center;
}

/* === SHOP === */
#shop-screen { flex-direction: column; padding: 32px; overflow-y: auto; }
#shop-screen h2 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
#shop-screen .gold-display { font-size: 18px; color: var(--yellow); margin-bottom: 20px; }
.shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.shop-item {
  border: 1px solid var(--bg4); border-radius: var(--radius); background: var(--bg3);
  padding: 16px; text-align: center; cursor: pointer; transition: all 0.12s;
}
.shop-item:hover { border-color: var(--accent); }
.shop-item.owned { border-color: var(--green); opacity: 0.6; cursor: default; }
.shop-item .item-icon { font-size: 36px; margin-bottom: 8px; }
.shop-item .item-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.shop-item .item-desc { font-size: 11px; color: var(--fg3); margin-bottom: 6px; }
.shop-item .item-price { font-size: 14px; color: var(--yellow); font-weight: 600; }
.shop-item.owned .item-price { color: var(--green); }

/* === CHARACTER === */
#character-screen { flex-direction: column; padding: 32px; overflow-y: auto; }
#character-screen h2 { font-size: 22px; font-weight: 600; margin-bottom: 16px; }
.char-grid { display: grid; grid-template-columns: 240px 1fr; gap: 24px; }
.char-avatar { width: 200px; height: 200px; border: 2px solid var(--bg4); border-radius: var(--radius2); background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 80px; }
.char-info { display: flex; flex-direction: column; gap: 12px; }
.char-info .title { font-size: 18px; color: var(--accent); font-weight: 600; }
.char-info .stat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--bg4); font-size: 14px; }
.char-info .stat label { color: var(--fg3); }
.equip-slots { display: flex; gap: 12px; margin-top: 8px; }
.equip-slot {
  width: 56px; height: 56px; border: 1px dashed var(--bg4); border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center; font-size: 22px;
  background: var(--bg3); color: var(--fg3);
}
.equip-slot.filled { border-style: solid; border-color: var(--accent); color: var(--accent); }

/* === MONSTER ENCYCLOPEDIA === */
#monster-screen { flex-direction: column; padding: 32px; overflow-y: auto; }
#monster-screen h2 { font-size: 22px; font-weight: 600; margin-bottom: 16px; }
.monster-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.monster-card {
  border: 1px solid var(--bg4); border-radius: var(--radius); background: var(--bg3);
  padding: 16px; text-align: center;
}
.monster-card.unknown { opacity: 0.3; }
.monster-card .monster-img { font-size: 48px; margin-bottom: 8px; }
.monster-card .monster-name { font-size: 14px; font-weight: 600; }
.monster-card .monster-stat { font-size: 11px; color: var(--fg3); margin-top: 4px; }

/* === DICTIONARY === */
#dictionary-screen { flex-direction: column; padding: 32px; overflow-y: auto; }
#dictionary-screen h2 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
#dictionary-screen .dict-subtitle { font-size: 12px; color: var(--fg3); margin-bottom: 16px; }
.dict-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.dict-tab {
  padding: 6px 16px; border: 1px solid var(--bg4); border-radius: var(--radius);
  background: transparent; color: var(--fg2); font-size: 13px; cursor: pointer;
}
.dict-tab.active { background: var(--bg4); border-color: var(--accent); color: #fff; }
.dict-list { display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }
.dict-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-radius: 4px; background: var(--bg3);
}
.dict-item .word { font-weight: 600; font-size: 15px; }
.dict-item .meaning { font-size: 13px; color: var(--fg2); }
.dict-item .play-btn {
  width: 28px; height: 28px; border: 1px solid var(--bg4); border-radius: 50%;
  background: transparent; color: var(--fg2); cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.dict-item .play-btn:hover { border-color: var(--accent); color: var(--accent); }

/* === ACHIEVEMENTS === */
#achievements-screen { flex-direction: column; padding: 32px; overflow-y: auto; }
#achievements-screen h2 { font-size: 22px; font-weight: 600; margin-bottom: 16px; }
.ach-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.ach-card {
  border: 1px solid var(--bg4); border-radius: var(--radius); background: var(--bg3);
  padding: 16px; display: flex; gap: 12px; align-items: center;
}
.ach-card.locked { opacity: 0.35; }
.ach-card .ach-icon { font-size: 36px; min-width: 44px; text-align: center; }
.ach-card .ach-name { font-size: 15px; font-weight: 600; }
.ach-card .ach-desc { font-size: 12px; color: var(--fg3); margin-top: 2px; }

/* === GAME OVER === */
#game-over-screen {
  flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  background: rgba(0,0,0,0.9); z-index: 10;
}
#game-over-screen .result-title { font-size: 32px; font-weight: 700; }
#game-over-screen .result-detail { font-size: 15px; color: var(--fg2); }
#game-over-screen .result-gold { font-size: 20px; color: var(--yellow); }

/* === SCROLLBAR === */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }
</style>
</head>
<body>
<div id="app">

<!-- MAIN MENU -->
<div id="main-menu" class="screen active">
  <div class="logo"><span>Type</span>Quest</div>
  <div class="subtitle">打字学英语 RPG 射击游戏</div>
  <button class="menu-btn" onclick="showLevelSelect()"><span class="icon">&#9876;</span> 开始游戏</button>
  <button class="menu-btn" onclick="showShop()"><span class="icon">&#128722;</span> 商店</button>
  <button class="menu-btn" onclick="showCharacter()"><span class="icon">&#128100;</span> 人物装备</button>
  <button class="menu-btn" onclick="showMonsterEncyclopedia()"><span class="icon">&#128214;</span> 怪物图鉴</button>
  <button class="menu-btn" onclick="showDictionary()"><span class="icon">&#128218;</span> 词典</button>
  <button class="menu-btn" onclick="showAchievements()"><span class="icon">&#127942;</span> 成就</button>
</div>

<!-- LEVEL SELECT -->
<div id="level-select" class="screen">
  <h2>选择关卡</h2>
  <div class="theme-label" id="theme-label">草原 1-10</div>
  <div class="level-grid" id="level-grid"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button class="back-btn" onclick="showMainMenu()">&#8592; 返回</button>
    <button class="back-btn" id="theme-prev" onclick="changeTheme(-1)">&#8592; 上一主题</button>
    <button class="back-btn" id="theme-next" onclick="changeTheme(1)">下一主题 &#8594;</button>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="game-screen" class="screen">
  <div id="game-canvas-wrap">
    <canvas id="game-canvas" width="360" height="640"></canvas>
    <div class="game-hud">
      <div>
        <div style="margin-bottom:2px;color:#fff;">Lv.<span id="hud-level">1</span></div>
        <div class="hp-bar-bg"><div class="hp-bar" id="hud-hp" style="width:100%"></div></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="energy-dots" id="hud-energy"></div>
        <span id="hud-combo" style="color:var(--yellow);min-width:40px;text-align:right;"></span>
        <span id="hud-gold" style="color:var(--yellow);">0</span>
      </div>
    </div>
    <button class="pause-btn" onclick="pauseGame()">||</button>
  </div>
  <div id="typing-area">
    <div class="typing-word-display" id="word-display"></div>
    <div class="typing-hint" id="typing-hint"></div>
    <input type="text" class="typing-input" id="typing-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="输入英文单词...">
    <div class="combo-display" id="combo-display"></div>
    <div class="virtual-keyboard" id="virtual-keyboard"></div>
    <div class="skill-hint">技能: 按 <b>1</b> 消耗1能量 火球术 | 按 <b>2</b> 消耗2能量 雷霆一击</div>
  </div>
</div>

<!-- SHOP -->
<div id="shop-screen" class="screen">
  <h2>商店</h2>
  <div class="gold-display">&#128176; 金币: <span id="shop-gold">0</span></div>
  <div class="shop-grid" id="shop-grid"></div>
  <button class="back-btn" style="margin-top:16px;" onclick="showMainMenu()">&#8592; 返回</button>
</div>

<!-- CHARACTER -->
<div id="character-screen" class="screen">
  <h2>人物装备</h2>
  <div class="char-grid">
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
      <div class="char-avatar" id="char-avatar">&#129497;</div>
      <div class="title" id="char-title">打字新兵</div>
    </div>
    <div class="char-info">
      <div class="stat"><label>攻击力</label><span id="char-atk">10</span></div>
      <div class="stat"><label>生命值</label><span id="char-hp">100</span></div>
      <div class="stat"><label>金币</label><span id="char-gold" style="color:var(--yellow);">0</span></div>
      <div class="stat"><label>通关数</label><span id="char-cleared">0</span></div>
      <div style="font-size:12px;color:var(--fg3);margin-top:4px;">装备栏</div>
      <div class="equip-slots">
        <div class="equip-slot" id="equip-weapon" title="武器">&#9876;</div>
        <div class="equip-slot" id="equip-skill1" title="技能1">&#128293;</div>
        <div class="equip-slot" id="equip-skill2" title="技能2">&#9889;</div>
        <div class="equip-slot" id="equip-armor" title="护甲">&#128737;</div>
      </div>
    </div>
  </div>
  <button class="back-btn" style="margin-top:16px;" onclick="showMainMenu()">&#8592; 返回</button>
</div>

<!-- MONSTER ENCYCLOPEDIA -->
<div id="monster-screen" class="screen">
  <h2>怪物图鉴</h2>
  <div class="monster-grid" id="monster-grid"></div>
  <button class="back-btn" style="margin-top:16px;" onclick="showMainMenu()">&#8592; 返回</button>
</div>

<!-- DICTIONARY -->
<div id="dictionary-screen" class="screen">
  <h2>词典</h2>
  <div class="dict-subtitle">收录所有出现过的单词</div>
  <div class="dict-tabs">
    <button class="dict-tab active" onclick="switchDictTab('all')">全部单词</button>
    <button class="dict-tab" onclick="switchDictTab('wrong')">错词本</button>
  </div>
  <div class="dict-list" id="dict-list"></div>
  <button class="back-btn" style="margin-top:12px;" onclick="showMainMenu()">&#8592; 返回</button>
</div>

<!-- ACHIEVEMENTS -->
<div id="achievements-screen" class="screen">
  <h2>成就</h2>
  <div class="ach-grid" id="ach-grid"></div>
  <button class="back-btn" style="margin-top:16px;" onclick="showMainMenu()">&#8592; 返回</button>
</div>

<!-- GAME OVER OVERLAY -->
<div id="game-over-screen" class="screen">
  <div class="result-title" id="result-title"></div>
  <div class="result-detail" id="result-detail"></div>
  <div class="result-gold" id="result-gold"></div>
  <button class="menu-btn" onclick="nextAfterGameOver()" id="game-over-next-btn">继续</button>
  <button class="menu-btn" style="border-color:var(--bg4);" onclick="retryLevel()">重试</button>
</div>

</div>

<script>
// ============ GAME DATA ============
const THEMES = [
  { name:'草原', range:[1,10], bgColors:['#2d5a1e','#4a8c2a'], monsterTypes:['slime','rabbit','wolf'], bossType:'golem_grass' },
  { name:'森林', range:[11,20], bgColors:['#1a3a1a','#2d5a2d'], monsterTypes:['mushroom','spider','bear'], bossType:'treant' },
  { name:'雪原', range:[21,30], bgColors:['#1a2a3a','#2a3a4a'], monsterTypes:['penguin','yeti_cub','wolf_ice'], bossType:'yeti_king' },
  { name:'火山', range:[31,40], bgColors:['#3a1a1a','#5a2a1a'], monsterTypes:['lava_slug','fire_imp','drake'], bossType:'fire_dragon' },
  { name:'城堡', range:[41,50], bgColors:['#2a1a3a','#3a2a4a'], monsterTypes:['skeleton','dark_knight','shadow'], bossType:'lich_king' }
];

const MONSTER_DATA = {
  slime:{ name:'史莱姆', emoji:'🟢', hp:2, speed:0.4, gold:8, color:'#4ade80' },
  rabbit:{ name:'狂野兔', emoji:'🐰', hp:2, speed:0.7, gold:10, color:'#fbbf24' },
  wolf:{ name:'草原狼', emoji:'🐺', hp:3, speed:0.55, gold:14, color:'#94a3b8' },
  mushroom:{ name:'毒蘑菇', emoji:'🍄', hp:2, speed:0.45, gold:9, color:'#ef4444' },
  spider:{ name:'巨蜘蛛', emoji:'🕷️', hp:3, speed:0.6, gold:13, color:'#8b5cf6' },
  bear:{ name:'森林熊', emoji:'🐻', hp:4, speed:0.5, gold:18, color:'#92400e' },
  penguin:{ name:'冰企鹅', emoji:'🐧', hp:2, speed:0.5, gold:10, color:'#67e8f9' },
  yeti_cub:{ name:'小雪怪', emoji:'👹', hp:3, speed:0.55, gold:14, color:'#e2e8f0' },
  wolf_ice:{ name:'冰原狼', emoji:'🐺', hp:4, speed:0.6, gold:16, color:'#bae6fd' },
  lava_slug:{ name:'熔岩蛞蝓', emoji:'🪱', hp:3, speed:0.35, gold:12, color:'#f97316' },
  fire_imp:{ name:'火小鬼', emoji:'👿', hp:4, speed:0.65, gold:16, color:'#ef4444' },
  drake:{ name:'幼龙', emoji:'🐲', hp:5, speed:0.5, gold:20, color:'#f59e0b' },
  skeleton:{ name:'骷髅兵', emoji:'💀', hp:4, speed:0.55, gold:16, color:'#d4d4d8' },

function getThemeForLevel(lv) {
  for(let t of THEMES) if(lv>=t.range[0]&&lv<=t.range[1]) return t;
  return THEMES[4];
}

function isBossLevel(lv) { return lv%10===0; }

function getMonsterForLevel(lv) {
  let theme = getThemeForLevel(lv);
  if(isBossLevel(lv)) return MONSTER_DATA[theme.bossType];
  let pool = theme.monsterTypes;
  return MONSTER_DATA[pool[Math.floor(Math.random()*pool.length)]];
}

function getMonsterHP(lv) {
  if(lv <= 10) return 1; // Letter levels: all monsters have 1 HP
  if(isBossLevel(lv)) return (3+Math.floor(lv/5))*8;
  return 2+Math.floor(lv/5);
}

function getGoldReward(lv) {
  let base = 60 + Math.floor((lv-1)/50*440); // 60 -> 500
  if(isBossLevel(lv)) return base + (80+lv*4);
  return base;
}

function getWordsForLevel(lv) {
  // Levels 1-10: single letters (alphabet), gradually increasing pool
  if(lv <= 10) {
    let letters = 'abcdefghijklmnopqrstuvwxyz'.split('');
    // Expand letter pool as levels progress
    let poolSize = 5 + (lv-1)*2; // Level 1: 5 letters, Level 10: 23 letters
    let pool = letters.slice(0, Math.min(26, poolSize));
    let count = 15 + lv*2; // Level 1: 17 letters to type, Level 10: 35
    let result = [];
    for(let i=0;i<count;i++) {
      result.push([pool[Math.floor(Math.random()*pool.length)],'']);
    }
    return result;
  }
  // Levels 11+: words from themed pools
  let theme = getThemeForLevel(lv);
  let themeKey = 'grassland';
  if(lv>=11&&lv<=20) themeKey='forest';
  else if(lv>=21&&lv<=30) themeKey='snowfield';
  else if(lv>=31&&lv<=40) themeKey='volcano';
  else if(lv>=41) themeKey='castle';
  let pool = WORD_POOLS[themeKey];
  let count = 8 + Math.floor(Math.random()*5);
  let shuffled = [...pool].sort(()=>Math.random()-0.5);
  return shuffled.slice(0, count);
}

let audioCtx = null;
function getAudioCtx() {
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
let bestVoice = null;
function getBestVoice(lang) {
  if(!window.speechSynthesis) return null;
  let voices = speechSynthesis.getVoices();
  // Try to find a high-quality native voice
  for(let v of voices) {
    if(v.lang.startsWith(lang) && v.localService && (v.name.includes('Google')||v.name.includes('Natural')||v.name.includes('Premium')||v.name.includes('Samantha')||v.name.includes('Daniel')||v.name.includes('Karen'))) {
      return v;
    }
  }
  // Fallback to any native voice
  for(let v of voices) {
    if(v.lang.startsWith(lang) && v.localService) return v;
  }
  // Final fallback
  return voices.find(v=>v.lang.startsWith(lang)) || null;
}
function speak(text, lang='en-US') {
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = lang==='en-US'?0.85:0.8; u.pitch = 1;
  let v = getBestVoice(lang);
  if(v) u.voice = v;
  window.speechSynthesis.speak(u);
}
function speakChinese(text) { speak(text, 'zh-CN'); }

    o.connect(g); g.connect(ctx.destination);
    o.type='square'; o.frequency.setValueAtTime(800,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(200,ctx.currentTime+0.08);

// ============ CANVAS RENDERING ============
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const CW = 360, CH = 640;

function drawBackground() {
  let lv = G.currentLevel;
  let theme = getThemeForLevel(lv);
  let grad = ctx.createLinearGradient(0,0,0,CH);
  grad.addColorStop(0, theme.bgColors[0]);
  grad.addColorStop(1, theme.bgColors[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, CW, CH);

  // Theme-specific decorations
  if(lv<=10) {
    // Grassland - hills and grass
    ctx.fillStyle = '#3a7a28';
    for(let i=0;i<5;i++) {
      let x = i*80-20, y = CH-60+Math.sin(i*1.5)*20;
      ctx.beginPath(); ctx.ellipse(x, y, 70, 40, 0, Math.PI, 0); ctx.fill();
    }
    ctx.fillStyle = '#4a8c2a';
    for(let i=0;i<8;i++) {
      let x = i*50-10, y = CH-55+Math.sin(i)*25;
      ctx.beginPath(); ctx.ellipse(x, y, 50, 30, 0, Math.PI, 0); ctx.fill();
    }
  } else if(lv<=20) {
    // Forest - trees
    for(let i=0;i<6;i++) {
      let tx = i*65+15, ty = CH-100;
      ctx.fillStyle = '#3d2b1f'; ctx.fillRect(tx-4, ty, 8, 90);
      ctx.fillStyle = '#1a5c2a'; ctx.beginPath(); ctx.ellipse(tx, ty-10, 22, 35, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#2d7a3a'; ctx.beginPath(); ctx.ellipse(tx, ty-25, 18, 28, 0, 0, Math.PI*2); ctx.fill();
    }
  } else if(lv<=30) {
    // Snowfield - snow mounds and flakes
    ctx.fillStyle = '#c8dce8';
    for(let i=0;i<6;i++) {
      let x = i*70, y = CH-40+Math.sin(i)*20;
      ctx.beginPath(); ctx.ellipse(x, y, 55, 25, 0, Math.PI, 0); ctx.fill();
    }
    for(let i=0;i<20;i++) {
      let sx = Math.random()*CW, sy = Math.random()*CH;
      ctx.fillStyle = 'rgba(255,255,255,'+(0.4+Math.random()*0.4)+')';
      ctx.beginPath(); ctx.arc(sx, sy, 1+Math.random()*2, 0, Math.PI*2); ctx.fill();
    }
  } else if(lv<=40) {
    // Volcano - lava rivers and rocks
    ctx.fillStyle = '#4a2818';
    for(let i=0;i<4;i++) {
      ctx.beginPath(); ctx.arc(60+i*80, CH-30, 45, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = '#f97316';
    ctx.beginPath(); ctx.moveTo(100, CH); ctx.quadraticCurveTo(160, CH-80, 200, CH); ctx.fill();
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath(); ctx.moveTo(110, CH); ctx.quadraticCurveTo(165, CH-60, 190, CH); ctx.fill();
  } else {
    // Castle - stone walls and towers
    ctx.fillStyle = '#3d3548';
    for(let i=0;i<5;i++) {
      ctx.fillRect(i*75+5, CH-80, 25, 80);
      ctx.fillRect(i*75+5, CH-85, 25, 12);
    }
    ctx.fillStyle = '#4a3d5a'; ctx.fillRect(0, CH-15, CW, 15);
  }
}

function drawPlayer() {
  let px = CW/2, py = CH-55;
  // Robe
  ctx.fillStyle = '#3b5998';
  ctx.beginPath();
  ctx.moveTo(px-12, py+20); ctx.lineTo(px-18, py+45); ctx.lineTo(px+18, py+45);
  ctx.lineTo(px+12, py+20); ctx.closePath(); ctx.fill();
  // Head
  ctx.fillStyle = '#f5d0a9';
  ctx.beginPath(); ctx.arc(px, py-2, 11, 0, Math.PI*2); ctx.fill();
  // Hat
  ctx.fillStyle = '#3b5998';
  ctx.beginPath();
  ctx.moveTo(px-10, py-8); ctx.lineTo(px, py-30); ctx.lineTo(px+10, py-8);
  ctx.closePath(); ctx.fill();
  // Staff
  ctx.strokeStyle = '#8B6914'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(px+12, py+5); ctx.lineTo(px+22, py-30); ctx.stroke();
  // Staff gem
  ctx.fillStyle = '#5b6af0';
  ctx.beginPath(); ctx.arc(px+22, py-33, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(91,106,240,0.4)';
  ctx.beginPath(); ctx.arc(px+22, py-33, 8, 0, Math.PI*2); ctx.fill();
  // Shield glow when energy available
  if(G.energy>0) {
    ctx.strokeStyle = 'rgba(91,106,240,'+(0.2+G.energy*0.1)+')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px, py+5, 24, 0, Math.PI*2); ctx.stroke();
  }
}

function getMonsterDrawInfo(typeKey) {

function drawMonster(m) {
  let info = getMonsterDrawInfo(m.type);
  if(m.boss) {
    // Boss - larger, more elaborate
    ctx.save();
    // Glow
    ctx.shadowColor = info.color; ctx.shadowBlur = 15;
    ctx.fillStyle = info.color; ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r+5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    // Body
    ctx.fillStyle = info.color;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2); ctx.fill();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(m.x-8, m.y-8, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(m.x+8, m.y-8, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(m.x-6, m.y-6, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(m.x+10, m.y-6, 3, 0, Math.PI*2); ctx.fill();
    // Crown/teeth
    ctx.fillStyle = '#fff';
    for(let i=0;i<3;i++) {
      ctx.beginPath(); ctx.arc(m.x-8+i*8, m.y-18, 4, 0, Math.PI); ctx.fill();
    }
    // HP text
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(m.hp+'/'+m.maxHp, m.x, m.y-m.r-18);
    ctx.restore();
  } else {
    // Normal monster
    ctx.fillStyle = info.color;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2); ctx.fill();
    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(m.x-4, m.y-4, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(m.x-2, m.y-2, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(m.x+6, m.y-2, 2.5, 0, Math.PI*2); ctx.fill();
    // HP bar
    let barW = m.r*2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(m.x-barW/2, m.y-m.r-10, barW, 3);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(m.x-barW/2, m.y-m.r-10, barW*(m.hp/m.maxHp), 3);
  }
}

function drawProjectile(p) {
  ctx.fillStyle = p.skill ? '#fbbf24' : '#5b6af0';
  ctx.shadowColor = p.skill ? '#fbbf24' : '#5b6af0';
  ctx.shadowBlur = p.skill ? 8 : 4;
  ctx.beginPath();
  if(p.skill==='fireball') {
    // Large fireball
    ctx.arc(p.x, p.y, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
  } else if(p.skill==='thunder') {
    // Lightning bolt shape
    ctx.moveTo(p.x, p.y-10); ctx.lineTo(p.x-4, p.y); ctx.lineTo(p.x+2, p.y);
    ctx.lineTo(p.x-2, p.y+10); ctx.lineTo(p.x+6, p.y); ctx.lineTo(p.x-2, p.y); ctx.closePath();
    ctx.fill();
  } else {
    // Normal bolt
    ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function drawParticles() {
  for(let p of G.particles) {
    ctx.globalAlpha = p.life/p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawComboText() {
  if(G.combo>=3 && G.frameCount%30 < 20) {
    ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(G.combo+' COMBO!', CW/2, 80);
  }
}

// ============ GAME LOGIC ============
function resetLevelState() {
  G.monsters = []; G.projectiles = []; G.particles = [];
  G.combo = 0; G.maxCombo = 0; G.energy = 0;
  G.gameOver = false; G.victory = false; G.levelHits = 0;
  G.levelNoDamage = true; G.monsterSpawnTimer = 0;
  G.bossDefeated = false; G.hp = getBaseMaxHP();
  G.maxHp = getBaseMaxHP(); G.atk = getBaseAtk();
  G.typed = ''; G.currentWordIdx = 0;
  G.skillBonus = G.unlockedSkills.includes('skill_fireball') ? 0.5 : 0;
  G.skillBonus2 = G.unlockedSkills.includes('skill_thunder') ? 1 : 0;
  G.regenBonus = G.unlockedPassives.includes('regen') ? 1 : 0;
  G.goldBonus = G.unlockedPassives.includes('lucky') ? 0.3 : 0;
  // Pick words for this level
  G.words = getWordsForLevel(G.currentLevel);
  // Start typing on first word
  G.currentWordIdx = 0;
  spawnMonster();
  updateWordDisplay();
  startAudioLoop();
}

function spawnMonster() {
  let lv = G.currentLevel;
  let boss = isBossLevel(lv);
  let monsterData = getMonsterForLevel(lv);
  let hp = getMonsterHP(lv);
  // Spawn from random x position at top, move straight down
  let x = 40+Math.random()*(CW-80);
  let y = 20;
  let r = boss ? 28 : 16+Math.random()*6;
  // Speed: letter levels are much slower, increases gradually
  let speed = lv<=10 ? (0.25+lv*0.02) : lv<=20 ? monsterData.speed*0.6 : monsterData.speed;
  if(boss) speed *= 0.5;
  G.currentMonster = monsterData;
  G.currentMonsterHP = hp;
  G.currentMonsterMaxHP = hp;
  G.monsters.push({
    x, y, r, type: monsterData===MONSTER_DATA[getThemeForLevel(lv).bossType]?getThemeForLevel(lv).bossType:
      getThemeForLevel(lv).monsterTypes.find(t=>MONSTER_DATA[t]===monsterData)||getThemeForLevel(lv).monsterTypes[0],
    hp, maxHp:hp, speed: speed*(0.9+Math.random()*0.2),
    boss, vy:1+(lv<=10?0.15:0)*lv, vx:0
  });
}

function updateWordDisplay() {
  let w = G.words[G.currentWordIdx];
  if(!w) return;
  let word = w[0];
  let display = document.getElementById('word-display');
  let typed = G.typed.toLowerCase();
  let html = '';
  for(let i=0;i<word.length;i++) {
    let ch = word[i];
    if(i<typed.length) {
      if(typed[i]===ch.toLowerCase()) {
        html += '<span class="correct">'+ch+'</span>';
      } else {
        html += '<span style="color:var(--red);">'+ch+'</span>';
      }
    } else if(i===typed.length) {
      html += '<span class="current">'+ch+'</span>';
    } else {
      html += '<span class="pending">'+ch+'</span>';
    }
  }
  display.innerHTML = html;
  document.getElementById('typing-hint').textContent = w[1];
  // Update virtual keyboard
  updateVirtualKeyboard(word, typed.length);
}

function updateVirtualKeyboard(word, pos) {
  let vk = document.getElementById('virtual-keyboard');
  if(G.currentLevel>=20) { vk.innerHTML = ''; return; }
  let html = '';
  let nextKey = pos<word.length ? word[pos].toLowerCase() : '';
  for(let row of VK_ROWS) {
    html += '<div class="vk-row">';
    for(let key of row) {
      let cls = 'vk-key';
      if(key===nextKey) cls += ' highlight';
      html += '<div class="'+cls+'">'+key.toUpperCase()+'</div>';
    }
    html += '</div>';
  }
  // Space bar row (only show for word/sentence levels 11+)
  if(G.currentLevel>10) {
    html += '<div class="vk-row">';
    let spCls = 'vk-key space';
    if(nextKey===' ') spCls += ' highlight';
    html += '<div class="'+spCls+'">空格</div>';
    html += '</div>';
  }
  vk.innerHTML = html;
}

function startAudioLoop() {
  stopAudioLoop();
  G.audioTimer = 0;
  G.audioInterval = setInterval(()=>{
    if(!G.gameRunning||G.paused||G.gameOver||G.victory) return;
    let w = G.words[G.currentWordIdx];
    if(!w) return;
    if(G.audioTimer%5===0) {
      speak(w[0], 'en-US');
      setTimeout(()=>speakChinese(w[1]), 800);
    }
    G.audioTimer++;
  }, 1000);
}

function stopAudioLoop() {
  if(G.audioInterval) { clearInterval(G.audioInterval); G.audioInterval = null; }
  if(window.speechSynthesis) window.speechSynthesis.cancel();
}

function spawnProjectile(targetMonster, skillType) {
  let startX = CW/2+22, startY = CH-90;
  let tx = targetMonster.x, ty = targetMonster.y;
  let dx = tx-startX, dy = ty-startY;
  let dist = Math.sqrt(dx*dx+dy*dy);
  let speed = 8;
  G.projectiles.push({
    x:startX, y:startY, target:targetMonster,
    vx:dx/dist*speed, vy:dy/dist*speed, skill:skillType||null
  });
}

function doDamage(monster, dmg) {
  monster.hp -= dmg;
  if(monster.hp<=0) {
    monster.hp = 0;
    killMonster(monster);
  }
  // Spawn hit particles
  for(let i=0;i<8;i++) {
    let angle = Math.random()*Math.PI*2;
    G.particles.push({
      x:monster.x, y:monster.y,
      vx:Math.cos(angle)*3, vy:Math.sin(angle)*3,
      r:2+Math.random()*3, life:15+Math.random()*10, maxLife:25,
      color:monster.boss?'#fbbf24':'#fff'
    });
  }
}

function killMonster(monster) {
  let info = MONSTER_DATA[monster.type];
  G.totalKills++;
  G.levelHits++;
  // Add to dictionary and defeated monsters
  if(G.words[G.currentWordIdx]) {
    let w = G.words[G.currentWordIdx];
    G.dictionary[w[0]] = w[1];
  }
  G.defeatedMonsters[monster.type] = true;
  // Gold reward
  let gold = (monster.boss?info.gold:info.gold) * getGoldMultiplier();
  G.gold += Math.floor(gold);
  G.totalGold += Math.floor(gold);
  if(monster.boss) G.bossDefeated = true;

  // Check achievements
  checkAchievements();

  // Spawn death particles
  for(let i=0;i<15;i++) {
    let angle = Math.random()*Math.PI*2;
    G.particles.push({
      x:monster.x, y:monster.y,
      vx:Math.cos(angle)*4, vy:Math.sin(angle)*4,
      r:2+Math.random()*4, life:20+Math.random()*15, maxLife:35,
      color:info.color
    });
  }

  // Remove monster
  G.monsters = G.monsters.filter(m=>m!==monster);

  // Next word or victory
  G.currentWordIdx++;
  if(G.currentWordIdx>=G.words.length) {
    // Level complete (all words done)
    victoryLevel();
  } else {
    spawnMonster();
    updateWordDisplay();
    G.typed = '';
    document.getElementById('typing-input').value = '';
    G.audioTimer = 0;
  }
}

function victoryLevel() {
  G.victory = true;
  G.gameRunning = false;
  stopAudioLoop();
  let gold = getGoldReward(G.currentLevel) * getGoldMultiplier();
  G.gold += Math.floor(gold);
  G.totalGold += Math.floor(gold);
  // Mark level cleared
  if(!G.clearedLevels.includes(G.currentLevel)) G.clearedLevels.push(G.currentLevel);
  // Check achievements
  checkAchievements();
  saveGame();
  // Show game over screen
  document.getElementById('result-title').textContent = '关卡通过!';
  document.getElementById('result-detail').textContent = '第'+G.currentLevel+'关 '+getThemeForLevel(G.currentLevel).name;
  document.getElementById('result-gold').textContent = '获得 '+Math.floor(gold)+' 金币';
  document.getElementById('game-over-next-btn').textContent = G.currentLevel<50?'下一关':'返回菜单';
  document.getElementById('game-over-screen').classList.add('active');
}

function gameOverLose() {
  G.gameOver = true;
  G.gameRunning = false;
  stopAudioLoop();
  // Still get some gold for progress
  let gold = Math.floor(G.levelHits*5*getGoldMultiplier());
  G.gold += gold;
  G.totalGold += gold;
  saveGame();
  document.getElementById('result-title').textContent = '战斗失败';
  document.getElementById('result-detail').textContent = '击败了 '+G.levelHits+' 个怪物';
  document.getElementById('result-gold').textContent = '获得 '+gold+' 金币';
  document.getElementById('game-over-next-btn').textContent = '返回菜单';
  document.getElementById('game-over-screen').classList.add('active');
}

function nextAfterGameOver() {
  document.getElementById('game-over-screen').classList.remove('active');
  if(G.victory) {
    G.currentLevel = Math.min(50, G.currentLevel+1);
  }
  showLevelSelect();
}

function retryLevel() {
  document.getElementById('game-over-screen').classList.remove('active');
  startLevel(G.currentLevel);
}

function checkAchievements() {
  let changed = false;
  if(!G.achievements.includes('first_kill') && G.totalKills>=1) { G.achievements.push('first_kill'); changed=true; }
  if(!G.achievements.includes('combo_10') && G.maxCombo>=10) { G.achievements.push('combo_10'); changed=true; }
  if(!G.achievements.includes('no_damage') && G.levelNoDamage) { G.achievements.push('no_damage'); changed=true; }
  if(!G.achievements.includes('word_master') && Object.keys(G.dictionary).length>=50) { G.achievements.push('word_master'); changed=true; }
  if(!G.achievements.includes('boss_slayer') && G.bossDefeated) { G.achievements.push('boss_slayer'); changed=true; }
  if(!G.achievements.includes('rich') && G.totalGold>=1000) { G.achievements.push('rich'); changed=true; }
  if(!G.achievements.includes('level_10') && G.clearedLevels.includes(10)) { G.achievements.push('level_10'); changed=true; }
  if(!G.achievements.includes('level_50') && G.clearedLevels.includes(50)) { G.achievements.push('level_50'); changed=true; }
  if(changed) saveGame();
}

function getTitle() {
  let cleared = G.clearedLevels.length;
  let title = TITLES[0];
  for(let t of TITLES) { if(cleared>=t.req) title=t; }
  return title.name;
}

// ============ TYPING INPUT ============
const typingInput = document.getElementById('typing-input');
typingInput.addEventListener('input', (e) => {
  if(!G.gameRunning||G.paused||G.gameOver||G.victory) return;
  let val = e.target.value;
  let word = G.words[G.currentWordIdx];
  if(!word) return;
  let target = word[0].toLowerCase();
  // Case insensitive, auto-fill punctuation
  let typed = val.toLowerCase();
  // Check if typed so far matches
  for(let i=0;i<typed.length;i++) {
    if(i>=target.length || typed[i]!==target[i]) {
      // Mismatch - error feedback but don't clear
      typingInput.classList.add('error');
      playErrorSound();
      // Track wrong word
      G.wrongWords[word[0]] = (G.wrongWords[word[0]]||0)+1;
      setTimeout(()=>typingInput.classList.remove('error'), 300);
      // Clear the incorrect character
      typingInput.value = typed.slice(0, i);
      G.typed = typed.slice(0, i);
      updateWordDisplay();
      return;
    }
  }
  G.typed = typed;
  updateWordDisplay();
  // Check completion
  if(typed===target) {
    // Word complete! Attack!
    typingInput.value = '';
    G.typed = '';
    G.combo++;
    if(G.combo>G.maxCombo) G.maxCombo = G.combo;
    // Energy gain: every 3 combos = +1 energy, max 5
    if(G.combo%3===0 && G.energy<5) G.energy++;
    // Attack monster
    let monsters = G.monsters.filter(m=>!m.boss||G.monsters.length===1);
    let targetMonster = monsters.length>0 ? monsters[0] : G.monsters[0];
    if(targetMonster) {
      // Damage is delivered when the bullet projectile hits the monster
      spawnProjectile(targetMonster);
      playShootSound();
    }
    updateComboDisplay();
  }
});

document.addEventListener('keydown', (e) => {
  if(!G.gameRunning||G.paused||G.gameOver||G.victory) return;
  if(e.key==='1' && G.energy>=1) {
    // Fireball skill
    G.energy -= 1;
    let dmg = Math.floor(G.atk*2*(1+G.skillBonus));
    let target = G.monsters[0];
    if(target) {
      doDamage(target, dmg);
      spawnProjectile(target, 'fireball');
      // AoE to nearby monsters
      for(let i=1;i<G.monsters.length;i++) {
        let m = G.monsters[i];
        let dist = Math.hypot(m.x-target.x, m.y-target.y);
        if(dist<120) doDamage(m, Math.floor(dmg*0.5));
      }
      playSkillSound();
    }
    e.preventDefault();
  }
  if(e.key==='2' && G.energy>=2) {
    // Thunder skill
    G.energy -= 2;
    let dmg = Math.floor(G.atk*3.5*(1+G.skillBonus2));
    let target = G.monsters[0];
    if(target) {
      doDamage(target, dmg);
      spawnProjectile(target, 'thunder');
      // Massive AoE
      for(let i=1;i<G.monsters.length;i++) {
        let m = G.monsters[i];
        let dist = Math.hypot(m.x-target.x, m.y-target.y);
        if(dist<180) doDamage(m, Math.floor(dmg*0.6));
      }
      playSkillSound();
    }
    e.preventDefault();
  }
  if(e.key==='Escape') pauseGame();
});

function updateComboDisplay() {
  document.getElementById('combo-display').textContent = G.combo>0 ? '连击 x'+G.combo : '';
}

// ============ GAME LOOP ============
let animFrameId = null;

function gameLoop() {
  if(!G.gameRunning||G.paused) { animFrameId = requestAnimationFrame(gameLoop); return; }
  G.frameCount++;

  // Regen
  if(G.regenBonus>0 && G.frameCount%60===0 && G.hp<G.maxHp) {
    G.hp = Math.min(G.maxHp, G.hp+G.regenBonus);
  }

  // Update monsters - move straight down
  for(let m of G.monsters) {
    // Speed: level 1-10 very slow, 11-20 moderately slow, 21+ gradually increases
    let lv = G.currentLevel;
    let speedMul;
    if(lv<=10) speedMul = 0.3 + lv*0.07;       // 0.37 ~ 1.0
    else if(lv<=20) speedMul = 0.6 + (lv-10)*0.03; // 0.63 ~ 0.9
    else speedMul = 0.85 + (lv-20)*0.02;         // 0.87 ~ 1.45
    let spd = m.speed * speedMul;
    m.y += spd;
    // If monster reaches bottom, damage player and kick it back up
    if(m.y>CH-100) {
      G.hp -= m.boss?15:5;
      G.levelNoDamage = false;
      m.y = -30;
      m.x = 40+Math.random()*(CW-80);
      G.combo = 0; G.energy = 0;
      // Switch to next word
      G.typed = '';
      G.currentWordIdx = (G.currentWordIdx+1) % G.words.length;
      spawnMonster();
      updateWordDisplay();
      G.currentMonsterWordTyped = '';
      if(G.hp<=0) { G.hp=0; gameOverLose(); return; }
    }
  }

  // Update projectiles
  for(let p of G.projectiles) {
    p.x += p.vx; p.y += p.vy;
  }

  // Check projectile hits - damage applied ON COLLISION
  let toRemoveP = [];
  for(let p of G.projectiles) {
    if(p.target && G.monsters.includes(p.target)) {
      let dx = p.x-p.target.x, dy = p.y-p.target.y;
      if(Math.sqrt(dx*dx+dy*dy)<p.target.r+6) {
        toRemoveP.push(p);
        // Apply damage when bullet hits
        let dmg = p.skill ? (p.skill==='fireball' ? Math.floor(G.atk*2*(1+G.skillBonus)) : Math.floor(G.atk*3.5*(1+G.skillBonus2))) : G.atk + Math.floor(G.combo/5);
        doDamage(p.target, dmg);
        playHitSound();
      }
    }
    // Out of bounds
    if(p.x<0||p.x>CW||p.y<0||p.y>CH) toRemoveP.push(p);
  }
  G.projectiles = G.projectiles.filter(p=>!toRemoveP.includes(p));

  // Update particles
  for(let p of G.particles) {
    p.x += p.vx; p.y += p.vy; p.life--;
  }
  G.particles = G.particles.filter(p=>p.life>0);

  // Render
  ctx.clearRect(0, 0, CW, CH);
  drawBackground();
  for(let m of G.monsters) drawMonster(m);
  for(let p of G.projectiles) drawProjectile(p);
  drawParticles();
  drawPlayer();
  drawComboText();

  // Update HUD
  document.getElementById('hud-level').textContent = G.currentLevel;
  document.getElementById('hud-hp').style.width = (G.hp/G.maxHp*100)+'%';
  document.getElementById('hud-hp').style.background = G.hp/G.maxHp<0.3?'var(--red)':'var(--green)';
  let energyHtml = '';
  for(let i=0;i<5;i++) energyHtml += '<div class="energy-dot'+(i<G.energy?' filled':'')+'"></div>';
  document.getElementById('hud-energy').innerHTML = energyHtml;
  document.getElementById('hud-combo').textContent = G.combo>0?'x'+G.combo:'';
  document.getElementById('hud-gold').textContent = 'G:'+G.gold;

  animFrameId = requestAnimationFrame(gameLoop);
}

function startLevel(lv) {
  G.currentLevel = lv;
  G.gameRunning = true;
  G.paused = false;
  resetLevelState();
  showScreen('game-screen');
  let inp = document.getElementById('typing-input');
  inp.value = ''; inp.focus();
  if(animFrameId) cancelAnimationFrame(animFrameId);
  animFrameId = requestAnimationFrame(gameLoop);
}

function pauseGame() {
  if(!G.gameRunning||G.gameOver||G.victory) return;
  G.paused = !G.paused;
  if(!G.paused) document.getElementById('typing-input').focus();
}

// ============ SCREEN MANAGEMENT ============
function hideAllScreens() {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
}

function showScreen(id) {
  hideAllScreens();
  let el = document.getElementById(id);
  if(el) el.classList.add('active');
}

function showMainMenu() {
  stopAudioLoop();
  G.gameRunning = false;
  hideAllScreens();
  document.getElementById('main-menu').classList.add('active');
}

function showLevelSelect() {
  stopAudioLoop();
  G.gameRunning = false;
  showScreen('level-select');
  renderAllLevels();
}

function renderAllLevels() {
  document.getElementById('theme-label').textContent = '全部关卡 1-50（点击任意关直接测试）';
  document.getElementById('theme-prev').style.visibility = 'hidden';
  document.getElementById('theme-next').style.visibility = 'hidden';
  let grid = document.getElementById('level-grid');
  let html = '';
  for(let lv=1;lv<=50;lv++) {
    let theme = getThemeForLevel(lv);
    let cls = 'level-btn';
    let label = lv;
    if(isBossLevel(lv)) { cls += ' boss'; label='👹'+lv; }
    if(G.clearedLevels.includes(lv)) cls += ' done';
    if(lv===G.currentLevel) cls += ' current';
    // All levels always clickable for testing
    html += '<button class="'+cls+'" onclick="startLevel('+lv+')" style="border-left:3px solid '+theme.bgColors[1]+'">'+label+'</button>';
  }
  grid.innerHTML = html;
}

// ============ SHOP ============
function showShop() {
  showScreen('shop-screen');
  document.getElementById('shop-gold').textContent = G.gold;
  let grid = document.getElementById('shop-grid');
  let html = '';
  for(let item of SHOP_ITEMS) {
    let owned = false;
    if(item.type==='weapon') owned = G.unlockedWeapons.includes(item.id);
    if(item.type==='armor') owned = G.unlockedArmor.includes(item.id);
    if(item.type==='skill') owned = G.unlockedSkills.includes(item.id);
    if(item.type==='passive') owned = G.unlockedPassives.includes(item.id);
    let cls = 'shop-item'+(owned?' owned':'');
    let btn = owned ? '已拥有' : '购买';
    html += '<div class="'+cls+'" onclick="'+(!owned?'buyItem(\''+item.id+'\')':'')+'">';
    html += '<div class="item-icon">'+item.icon+'</div>';
    html += '<div class="item-name">'+item.name+'</div>';
    html += '<div class="item-desc">'+item.desc+'</div>';
    html += '<div class="item-price">'+(owned?'已拥有':'价格: '+item.price+' G')+'</div>';
    html += '</div>';
  }
  grid.innerHTML = html;
}

function buyItem(itemId) {
  let item = SHOP_ITEMS.find(i=>i.id===itemId);
  if(!item) return;
  let owned = false;
  if(item.type==='weapon') owned = G.unlockedWeapons.includes(itemId);
  if(item.type==='armor') owned = G.unlockedArmor.includes(itemId);
  if(item.type==='skill') owned = G.unlockedSkills.includes(itemId);
  if(item.type==='passive') owned = G.unlockedPassives.includes(itemId);
  if(owned) return;
  if(G.gold<item.price) { alert('金币不足!'); return; }
  G.gold -= item.price;
  if(item.type==='weapon') G.unlockedWeapons.push(itemId);
  if(item.type==='armor') G.unlockedArmor.push(itemId);
  if(item.type==='skill') G.unlockedSkills.push(itemId);
  if(item.type==='passive') G.unlockedPassives.push(itemId);
  saveGame();
  showShop();
}

// ============ CHARACTER ============
function showCharacter() {
  showScreen('character-screen');
  document.getElementById('char-atk').textContent = getBaseAtk();
  document.getElementById('char-hp').textContent = getBaseMaxHP();
  document.getElementById('char-gold').textContent = G.gold;
  document.getElementById('char-cleared').textContent = G.clearedLevels.length;
  document.getElementById('char-title').textContent = getTitle();
  // Equipment slots
  let wep = document.getElementById('equip-weapon');
  wep.classList.toggle('filled', !!G.equippedWeapon);
  wep.textContent = G.equippedWeapon ? SHOP_ITEMS.find(i=>i.id===G.equippedWeapon).icon : '\u2694';
  wep.onclick = ()=>cycleEquip('weapon');

  let arm = document.getElementById('equip-armor');
  arm.classList.toggle('filled', !!G.equippedArmor);
  arm.textContent = G.equippedArmor ? SHOP_ITEMS.find(i=>i.id===G.equippedArmor).icon : '\uD83D\uDEE1';
  arm.onclick = ()=>cycleEquip('armor');

  document.getElementById('equip-skill1').classList.toggle('filled', G.unlockedSkills.includes('skill_fireball'));
  document.getElementById('equip-skill2').classList.toggle('filled', G.unlockedSkills.includes('skill_thunder'));
}

function cycleEquip(type) {
  if(type==='weapon') {
    let pool = G.unlockedWeapons;
    if(pool.length===0) { G.equippedWeapon = null; }
    else {
      let idx = pool.indexOf(G.equippedWeapon);
      idx = (idx+1)%pool.length;
      G.equippedWeapon = pool[idx];
    }
  }
  if(type==='armor') {
    let pool = G.unlockedArmor;
    if(pool.length===0) { G.equippedArmor = null; }
    else {
      let idx = pool.indexOf(G.equippedArmor);
      idx = (idx+1)%pool.length;
      G.equippedArmor = pool[idx];
    }
  }
  saveGame();
  showCharacter();
}

// ============ MONSTER ENCYCLOPEDIA ============
function showMonsterEncyclopedia() {
  showScreen('monster-screen');
  let grid = document.getElementById('monster-grid');
  let allTypes = Object.keys(MONSTER_DATA);
  let html = '';
  for(let t of allTypes) {
    let info = MONSTER_DATA[t];
    let known = G.defeatedMonsters[t];
    html += '<div class="monster-card'+(known?'':' unknown')+'">';
    html += '<div class="monster-img">'+(known?info.emoji:'?')+'</div>';
    html += '<div class="monster-name">'+(known?info.name:'???')+'</div>';
    html += '<div class="monster-stat">HP:'+(known?info.hp:'?')+' | 速度:'+(known?info.speed:'?')+'</div>';
    html += '</div>';
  }
  grid.innerHTML = html;
}

// ============ DICTIONARY ============
let dictTab = 'all';
function showDictionary() { dictTab='all'; showScreen('dictionary-screen'); renderDictionary(); }
function switchDictTab(tab) {
  dictTab = tab;
  document.querySelectorAll('.dict-tab').forEach((t,i)=>{
    t.classList.toggle('active', (i===0&&tab==='all')||(i===1&&tab==='wrong'));
  });
  renderDictionary();
}
function renderDictionary() {
  let list = document.getElementById('dict-list');
  let entries = dictTab==='all' ? Object.entries(G.dictionary) : Object.entries(G.wrongWords);
  if(entries.length===0) { list.innerHTML = '<div style="color:var(--fg3);text-align:center;padding:20px;">暂无数据</div>'; return; }
  let html = '';
  for(let [word, meaning] of entries) {
    html += '<div class="dict-item">';
    html += '<div><span class="word">'+word+'</span> <span class="meaning">'+meaning+'</span>';
    if(dictTab==='wrong') html += ' <span style="color:var(--red);font-size:11px;">(错'+G.wrongWords[word]+'次)</span>';
    html += '</div>';
    html += '<button class="play-btn" onclick="event.stopPropagation();speak(\''+word+'\');setTimeout(()=>speakChinese(\''+meaning+'\'),800);">&#9654;</button>';
    html += '</div>';
  }
  list.innerHTML = html;
}

// ============ ACHIEVEMENTS ============
function showAchievements() {
  showScreen('achievements-screen');
  let grid = document.getElementById('ach-grid');
  let html = '';
  for(let a of ACHIEVEMENTS) {
    let unlocked = G.achievements.includes(a.id);
    html += '<div class="ach-card'+(unlocked?'':' locked')+'">';
    html += '<div class="ach-icon">'+a.icon+'</div>';
    html += '<div><div class="ach-name">'+a.name+'</div><div class="ach-desc">'+a.desc+'</div></div>';
    html += '</div>';
  }
  grid.innerHTML = html;
}

// ============ INITIALIZATION ============
function init() {
  loadGame();
  // Build virtual keyboard initially
  updateVirtualKeyboard('', 0);
  // Render level select initially
  currentThemeIdx = 0;
  renderLevelGrid(0);
  // Auto-start to menu
  showMainMenu();
}

init();
</script>
