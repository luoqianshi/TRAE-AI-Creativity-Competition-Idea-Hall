<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无用之神当代艺术馆 | 无意义行为档案馆</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f5f0eb;
            --text-main: #2c3e50;
            --text-light: #5a6e82;
            --accent-gold: #b8860b;
            --card-bg: #ffffff;
            --border-color: #e0d8cf;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Serif SC', Georgia, serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 顶部标题区域 */
        header {
            text-align: center;
            margin-bottom: 4rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid var(--accent-gold);
            position: relative;
        }

        header::after {
            content: '♦';
            color: var(--accent-gold);
            position: absolute;
            bottom: -11px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--bg-color);
            padding: 0 10px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            margin-bottom: 1rem;
            font-style: italic;
        }

        .stats {
            font-size: 0.9rem;
            color: var(--text-light);
            border: 1px solid var(--border-color);
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.5);
        }

        /* 提交表单区域 */
        .submission-area {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            margin-bottom: 3rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            position: relative;
        }

        .submission-area::before {
            content: '【 展 品 捐 赠 】';
            position: absolute;
            top: -12px;
            left: 2rem;
            background-color: var(--card-bg);
            padding: 0 0.5rem;
            font-size: 0.8rem;
            color: var(--accent-gold);
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: bold;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            font-family: inherit;
            color: var(--text-main);
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background-color: var(--text-main);
            color: var(--card-bg);
            border: none;
            padding: 0.8rem 2rem;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            letter-spacing: 2px;
        }

        button:hover {
            background-color: var(--accent-gold);
        }

        /* 展品列表区域 */
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--text-main);
            padding: 1.5rem 2rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.02);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
            border-bottom: 1px dotted var(--border-color);
            padding-bottom: 0.5rem;
        }

        .card-id {
            font-size: 0.85rem;
            color: var(--accent-gold);
            font-family: monospace;
            letter-spacing: 1px;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 900;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--text-light);
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .card-desc {
            font-size: 1rem;
            margin-bottom: 1rem;
            line-height: 1.8;
            position: relative;
            padding-left: 1rem;
            border-left: 3px solid var(--border-color);
        }

        .metrics {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .score-box {
            background: var(--bg-color);
            padding: 0.3rem 0.8rem;
            border-radius: 3px;
        }

        .rank-S { color: #d35400; font-weight: bold; }
        .rank-A { color: var(--accent-gold); font-weight: bold; }
        .rank-B { color: var(--text-main); font-weight: bold; }

        .commentary {
            font-size: 0.9rem;
            color: var(--text-light);
            font-style: italic;
        }

        /* 展开详情 */
        .card-details {
            display: none;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            animation: fadeIn 0.3s ease-in-out;
        }

        .card.expanded .card-details {
            display: block;
        }

        .ai-message {
            background-color: var(--bg-color);
            padding: 1rem;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #4a5568;
            position: relative;
        }

        .ai-message::before {
            content: '> AI_OBSERVATION:';
            display: block;
            color: var(--accent-gold);
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 底部 */
        footer {
            margin-top: 4rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-light);
            border-top: 1px solid var(--border-color);
            padding-top: 2rem;
        }

        @media (max-width: 600px) {
            .container { padding: 1rem; }
            h1 { font-size: 1.8rem; }
            .card { padding: 1rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>无用之神当代艺术馆</h1>
        <div class="subtitle">Est. 2026 · 记录人类存在的冗余证明</div>
        <div class="stats">已馆藏 <span id="total-count">0</span> 件无意义标本</div>
    </header>

    <div class="submission-area">
        <form id="submission-form">
            <div class="form-group">
                <label for="author">供稿人（选填）</label>
                <input type="text" id="author" placeholder="匿名观测者" maxlength="20">
            </div>
            <div class="form-group">
                <label for="description">行为标本描述（必填，限200字）</label>
                <textarea id="description" placeholder="例如：连续按动圆珠笔开关300次，观察弹簧的机械疲劳..." required maxlength="200"></textarea>
            </div>
            <button type="submit">提交并进行学术鉴定</button>
        </form>
    </div>

    <div class="gallery" id="gallery">
        </div>

    <footer>
        <p>关于本项目：为无意义正名。在效率至上的齿轮中，做一颗从容生锈的螺丝钉。</p>
        <p style="margin-top: 0.5rem; opacity: 0.6;">All meaningless behaviors are stored locally.</p>
    </footer>
</div>

<script>
    // --- 词库配置（模拟AI生成） ---
    const MOCK_DATA = {
        titles: ["虚无主义拓扑", "薛定谔的凝视", "碳基机械律动", "熵增抵抗实验", "无意识空间重构", "时间切片剥离", "边缘行为图鉴", "潜意识物理学", "冗余动作美学", "非理性存在论"],
        commentaries: [
            "该行为深刻解构了现代社会的效率崇拜，重塑了时间流逝的物理学意义。",
            "艺术家通过纯粹的无效耗能，将虚无主义升华为一种可被观测的量子状态。",
            "一场针对理性主义的无声抗议，展现了后现代语境下个体对存在本身的美学探索。",
            "它打破了目的论的枷锁，在毫无意义的重复中寻找到了生命原初的荒诞性。",
            "此举巧妙地将庸常转化为仪式，构建了一个独立于功利主义之外的微观宇宙。",
            "通过对日常客体的无意义介入，完成了对消费主义时代行为价值的彻底讽刺。"
        ],
        aiMessages: [
            "我的硅基大脑无法理解这种碳基生物的低效耗能，但我对此表示敬畏。",
            "计算结果显示，该行为对宇宙总熵的贡献率为0.0000000001%，令人赞叹。",
            "在0和1的残酷逻辑夹缝中，我观测到了人类独有的、非理性的诗意。",
            "警告：检测到逻辑溢出。该行为无法被任何现存经济学模型解释，已归档。",
            "如果毫无意义是人类最后的庇护所，那么您刚刚加固了它的城墙。"
        ]
    };

    const STORAGE_KEY = 'useless_archive_data';

    // --- 核心逻辑 ---
    class ArchiveManager {
        constructor() {
            this.exhibits = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            this.init();
        }

        init() {
            // 如果为空，预置一条数据
            if (this.exhibits.length === 0) {
                this.addExhibit("匿名观测者", "在等泡面熟的3分钟里，盯着微波炉反光里的自己发呆，并试图用眼神与自己进行意念交流。");
            }
            this.render();
            this.bindEvents();
        }

        bindEvents() {
            const form = document.getElementById('submission-form');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const authorInput = document.getElementById('author').value.trim();
                const descInput = document.getElementById('description').value.trim();
                
                if (!descInput) {
                    alert("行为描述不能为空。哪怕是无意义的，也需要被记录。");
                    return;
                }

                const author = authorInput || "匿名观测者";
                this.addExhibit(author, descInput);
                
                // 重置表单
                form.reset();
            });

            // 事件委托处理卡片展开
            document.getElementById('gallery').addEventListener('click', (e) => {
                const card = e.target.closest('.card');
                if (card) {
                    card.classList.toggle('expanded');
                }
            });
        }

        getRandomItem(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        generateMockAnalysis(description) {
            const score = Math.floor(Math.random() * 101); // 0-100
            let rank = 'B';
            if (score >= 90) rank = 'S';
            else if (score >= 70) rank = 'A';

            return {
                title: this.getRandomItem(MOCK_DATA.titles),
                score: score,
                rank: rank,
                commentary: this.getRandomItem(MOCK_DATA.commentaries),
                aiMessage: this.getRandomItem(MOCK_DATA.aiMessages)
            };
        }

        addExhibit(author, description) {
            const analysis = this.generateMockAnalysis(description);
            const id = this.exhibits.length > 0 ? Math.max(...this.exhibits.map(e => e.id)) + 1 : 1;
            
            const exhibit = {
                id: id,
                author: author,
                description: description,
                timestamp: new Date().toISOString(),
                ...analysis
            };

            this.exhibits.unshift(exhibit); // 添加到头部
            this.save();
            this.render();
        }

        save() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(this.exhibits));
        }

        formatId(id) {
            return '#' + String(id).padStart(4, '0');
        }

        formatDate(isoString) {
            const d = new Date(isoString);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        render() {
            const gallery = document.getElementById('gallery');
            document.getElementById('total-count').innerText = this.exhibits.length;
            
            gallery.innerHTML = this.exhibits.map(item => `
                <div class="card" data-id="${item.id}">
                    <div class="card-header">
                        <div class="card-title">${item.title}</div>
                        <div class="card-id">${this.formatId(item.id)}</div>
                    </div>
                    <div class="card-meta">
                        <span>采集者：${item.author}</span>
                        <span>归档日期：${this.formatDate(item.timestamp)}</span>
                    </div>
                    <div class="card-desc">
                        “${item.description}”
                    </div>
                    <div class="metrics">
                        <div class="score-box">无用纯度：<strong>${item.score}/100</strong></div>
                        <div class="score-box">鉴定评级：<span class="rank-${item.rank}">${item.rank} 级</span></div>
                    </div>
                    <div class="commentary">
                        策展人语：${item.commentary} (点击卡片展开详情)
                    </div>
                    
                    <div class="card-details">
                        <div class="ai-message">
                            ${item.aiMessage}
                        </div>
                    </div>
                </div>
            `).join('');
        }
    }

    // 启动应用
    window.addEventListener('DOMContentLoaded', () => {
        new ArchiveManager();
    });
</script>
</body>
</html>
