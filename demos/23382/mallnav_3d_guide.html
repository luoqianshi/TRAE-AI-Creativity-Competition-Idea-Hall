<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MallNav 3D 商场智能导览器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      background: #eef3f8;
      color: #152033;
    }
    #canvas-wrap { position: fixed; inset: 0; }
    canvas { display: block; }
    .panel {
      position: fixed;
      left: 18px;
      top: 18px;
      width: 360px;
      max-width: calc(100vw - 36px);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(20, 60, 100, 0.08);
      border-radius: 22px;
      box-shadow: 0 18px 48px rgba(45, 72, 108, 0.18);
      padding: 18px;
      z-index: 10;
    }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom: 12px; }
    .logo {
      width: 42px; height: 42px; border-radius: 14px;
      background: linear-gradient(135deg,#32d583,#2e90fa);
      display:flex; align-items:center; justify-content:center;
      font-weight: 900; color:white; letter-spacing: -1px;
    }
    h1 { font-size: 20px; margin: 0; line-height: 1.2; }
    .sub { margin: 3px 0 0; color:#607089; font-size: 13px; }
    .search-row { display:flex; gap: 8px; margin-top: 14px; }
    input, select, button {
      border: none; outline: none; font-family: inherit;
      border-radius: 14px; font-size: 14px;
    }
    input {
      flex: 1; padding: 13px 14px; background:#f0f5fb; color:#152033;
      border: 1px solid transparent;
    }
    input:focus { border-color:#2e90fa; background:#fff; }
    button {
      cursor: pointer; padding: 12px 14px; font-weight: 700;
      background:#152033; color:#fff;
      box-shadow: 0 8px 18px rgba(21,32,51,.18);
    }
    button.secondary { background:#eaf1f8; color:#24364f; box-shadow:none; }
    .chips { display:flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip {
      border: 1px solid #dfe8f3; background:#fff; color:#41516a;
      padding: 8px 10px; border-radius: 999px; cursor:pointer; font-size: 12px;
      transition: .15s ease;
    }
    .chip:hover, .chip.active { background:#e8f5ff; color:#1570ef; border-color:#9bd3ff; }
    .section { margin-top: 14px; padding-top: 14px; border-top: 1px solid #edf1f6; }
    .floor-row { display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .floor-btn {
      background:#f1f6fb; color:#40516a; box-shadow:none; padding:10px 0;
    }
    .floor-btn.active { background:#2e90fa; color:#fff; }
    .info-card {
      margin-top: 12px; background: linear-gradient(135deg,#f8fbff,#eef7ff);
      border-radius: 16px; padding: 12px; border: 1px solid #e4eef9;
      min-height: 96px;
    }
    .info-title { font-weight: 800; margin-bottom: 6px; }
    .info-line { color:#5b6b83; font-size: 13px; line-height: 1.55; }
    .route-box {
      display:none; margin-top: 10px; padding: 10px; border-radius: 14px;
      background:#ecfdf3; border: 1px solid #b7efc5; color:#16703a; font-size: 13px;
      line-height: 1.55;
    }
    .legend {
      position: fixed; right: 18px; bottom: 18px; z-index: 10;
      background: rgba(255,255,255,.9); backdrop-filter: blur(12px);
      border-radius: 18px; padding: 12px 14px; box-shadow: 0 12px 32px rgba(45,72,108,.16);
      font-size: 12px; color:#53627a; line-height:1.8;
    }
    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
    .hint {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10;
      background: rgba(21,32,51,.82); color:#fff; border-radius: 999px; padding: 10px 16px;
      font-size: 13px; backdrop-filter: blur(8px);
    }
    .toast {
      position: fixed; left: 50%; top: 22px; transform: translateX(-50%);
      background:#152033; color:#fff; padding: 10px 16px; border-radius: 999px;
      font-size: 13px; display:none; z-index: 20;
    }
    @media (max-width: 720px) {
      .panel { width: calc(100vw - 24px); left: 12px; top: 12px; padding: 14px; border-radius: 18px; }
      h1 { font-size: 17px; }
      .legend { display: none; }
      .hint { width: calc(100vw - 24px); text-align:center; bottom: 10px; }
    }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div class="toast" id="toast"></div>

  <aside class="panel">
    <div class="brand">
      <div class="logo">3D</div>
      <div>
        <h1>MallNav 3D 商场智能导览器</h1>
        <p class="sub">Web 端三维地图 · 门店搜索 · 自动路线规划</p>
      </div>
    </div>

    <div class="search-row">
      <input id="searchInput" placeholder="搜索门店/设施：星巴克、影院、卫生间..." />
      <button id="searchBtn">导航</button>
    </div>

    <div class="chips" id="chips"></div>

    <div class="section">
      <div class="floor-row">
        <button class="floor-btn active" data-floor="1">1F</button>
        <button class="floor-btn" data-floor="2">2F</button>
        <button class="floor-btn" data-floor="3">3F</button>
        <button class="floor-btn" data-floor="all">全楼</button>
      </div>
    </div>

    <div class="info-card">
      <div class="info-title" id="infoTitle">当前位置：1F 北门入口</div>
      <div class="info-line" id="infoLine">请选择或搜索目标门店，系统会在 3D 商场模型中高亮店铺并绘制推荐路线。</div>
      <div class="route-box" id="routeBox"></div>
    </div>
  </aside>

  <div class="legend">
    <div><span class="dot" style="background:#2e90fa"></span>当前位置</div>
    <div><span class="dot" style="background:#f97316"></span>目标门店</div>
    <div><span class="dot" style="background:#12b76a"></span>推荐路线</div>
    <div><span class="dot" style="background:#98a2b3"></span>商场楼层/店铺</div>
  </div>
  <div class="hint">拖拽旋转视角，滚轮缩放；点击店铺可查看信息并导航</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('canvas-wrap');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeef3f8);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(18, 18, 22);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 3.5, 0);
    controls.maxPolarAngle = Math.PI / 2.05;

    const ambient = new THREE.AmbientLight(0xffffff, 0.72);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(12, 24, 10);
    sun.castShadow = true;
    scene.add(sun);

    const floorHeight = 3.2;
    const mallGroup = new THREE.Group();
    scene.add(mallGroup);

    const shops = [
      { name: '星巴克', floor: 1, type: '饮品', x: -5.8, z: -3.6, w: 2.6, d: 2.0, color: 0x59c98f },
      { name: '优衣库', floor: 1, type: '服饰', x: -1.9, z: -3.8, w: 3.5, d: 2.2, color: 0x72b7f2 },
      { name: 'Apple 授权店', floor: 1, type: '数码', x: 2.5, z: -3.6, w: 3.4, d: 2.0, color: 0xa8b2c1 },
      { name: '北门入口', floor: 1, type: '入口', x: -6.5, z: 4.6, w: 2.0, d: 1.2, color: 0x2e90fa, isStart: true },
      { name: '服务台', floor: 1, type: '服务', x: 0.2, z: 3.5, w: 2.1, d: 1.5, color: 0xfacc15 },
      { name: '喜茶', floor: 2, type: '饮品', x: -5.5, z: -3.6, w: 2.8, d: 2.0, color: 0x5eead4 },
      { name: '海底捞', floor: 2, type: '餐饮', x: -1.4, z: -3.6, w: 3.8, d: 2.1, color: 0xff8a7a },
      { name: '西西弗书店', floor: 2, type: '书店', x: 3.3, z: -3.5, w: 3.1, d: 2.1, color: 0xc4a484 },
      { name: '卫生间', floor: 2, type: '设施', x: 6.1, z: 2.7, w: 1.7, d: 1.6, color: 0x8cc3ff },
      { name: '电影院', floor: 3, type: '娱乐', x: -3.8, z: -3.4, w: 5.0, d: 2.4, color: 0xb692f6 },
      { name: '电玩城', floor: 3, type: '娱乐', x: 2.2, z: -3.3, w: 3.4, d: 2.2, color: 0xfb7185 },
      { name: '儿童乐园', floor: 3, type: '亲子', x: 5.5, z: 2.5, w: 2.2, d: 2.0, color: 0xfdb022 },
      { name: '电梯', floor: 1, type: '设施', x: 6.2, z: 0.2, w: 1.4, d: 1.4, color: 0x667085, isLift: true },
      { name: '电梯', floor: 2, type: '设施', x: 6.2, z: 0.2, w: 1.4, d: 1.4, color: 0x667085, isLift: true },
      { name: '电梯', floor: 3, type: '设施', x: 6.2, z: 0.2, w: 1.4, d: 1.4, color: 0x667085, isLift: true },
    ];

    const shopMeshes = [];
    const labelSprites = [];
    let currentFloor = 1;
    let selectedShop = null;
    let routeLine = null;
    let routeMarkers = [];
    let targetPulse = null;

    function makeTextSprite(text, color = '#152033', size = 92) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512; canvas.height = 160;
      ctx.clearRect(0,0,512,160);
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      roundRect(ctx, 18, 24, 476, 88, 22); ctx.fill();
      ctx.strokeStyle = 'rgba(30,50,80,.08)'; ctx.stroke();
      ctx.font = `800 ${size}px Microsoft YaHei, Arial`;
      ctx.fillStyle = color;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 256, 68);
      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(2.4, 0.75, 1);
      return sprite;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function createMall() {
      for (let f = 1; f <= 3; f++) {
        const y = (f - 1) * floorHeight;
        const floorGeo = new THREE.BoxGeometry(15, 0.22, 10);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.78, metalness: 0.05 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.set(0, y, 0);
        floor.receiveShadow = true;
        floor.userData.floor = f;
        mallGroup.add(floor);

        const edge = new THREE.EdgesGeometry(floorGeo);
        const line = new THREE.LineSegments(edge, new THREE.LineBasicMaterial({ color: 0xd0d9e6 }));
        line.position.copy(floor.position);
        mallGroup.add(line);

        const atriumGeo = new THREE.RingGeometry(1.2, 1.7, 48);
        const atriumMat = new THREE.MeshBasicMaterial({ color: 0xdde9f5, side: THREE.DoubleSide, transparent: true, opacity: 0.55 });
        const atrium = new THREE.Mesh(atriumGeo, atriumMat);
        atrium.rotation.x = -Math.PI / 2;
        atrium.position.set(0, y + 0.13, 0);
        mallGroup.add(atrium);

        const floorLabel = makeTextSprite(`${f}F`, '#2e90fa', 84);
        floorLabel.position.set(-8.4, y + 0.7, 4.6);
        floorLabel.scale.set(1.2, .42, 1);
        floorLabel.userData.floor = f;
        mallGroup.add(floorLabel);
        labelSprites.push(floorLabel);
      }

      shops.forEach((s) => {
        const y = (s.floor - 1) * floorHeight + 0.42;
        const geo = new THREE.BoxGeometry(s.w, 0.72, s.d);
        const mat = new THREE.MeshStandardMaterial({ color: s.color, roughness: 0.62, metalness: 0.08, transparent: true, opacity: 0.92 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(s.x, y, s.z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData.shop = s;
        mallGroup.add(mesh);
        shopMeshes.push(mesh);

        const label = makeTextSprite(s.name.length > 5 ? s.name.slice(0,5) : s.name, '#1d2939', 58);
        label.position.set(s.x, y + 0.78, s.z);
        label.scale.set(1.65, .52, 1);
        label.userData.floor = s.floor;
        mallGroup.add(label);
        labelSprites.push(label);
      });

      // Escalator / vertical lift shaft
      const liftGeo = new THREE.CylinderGeometry(0.45, 0.45, floorHeight * 2.35, 32);
      const liftMat = new THREE.MeshStandardMaterial({ color: 0x98a2b3, transparent: true, opacity: 0.38, roughness: 0.4 });
      const lift = new THREE.Mesh(liftGeo, liftMat);
      lift.position.set(6.2, floorHeight, 0.2);
      mallGroup.add(lift);
    }

    function buildChips() {
      const targets = ['星巴克', '海底捞', '电影院', '卫生间', 'Apple 授权店', '儿童乐园'];
      const chips = document.getElementById('chips');
      chips.innerHTML = targets.map(t => `<span class="chip" data-name="${t}">${t}</span>`).join('');
      chips.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.getElementById('searchInput').value = chip.dataset.name;
          navigateTo(chip.dataset.name);
        });
      });
    }

    function updateFloorVisibility() {
      shopMeshes.forEach(mesh => {
        const f = mesh.userData.shop.floor;
        mesh.visible = currentFloor === 'all' || f === currentFloor;
        if (selectedShop && mesh.userData.shop === selectedShop) mesh.visible = true;
      });
      labelSprites.forEach(label => {
        const f = label.userData.floor;
        label.visible = currentFloor === 'all' || f === currentFloor;
        if (selectedShop && f === selectedShop.floor) label.visible = true;
      });
      document.querySelectorAll('.floor-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.floor == currentFloor);
      });
    }

    function findShop(keyword) {
      const k = keyword.trim().toLowerCase();
      if (!k) return null;
      return shops.find(s => s.name.toLowerCase().includes(k) || s.type.toLowerCase().includes(k));
    }

    function clearRoute() {
      if (routeLine) { scene.remove(routeLine); routeLine.geometry.dispose(); routeLine.material.dispose(); routeLine = null; }
      routeMarkers.forEach(m => { scene.remove(m); m.geometry.dispose(); m.material.dispose(); });
      routeMarkers = [];
      if (targetPulse) { scene.remove(targetPulse); targetPulse.geometry.dispose(); targetPulse.material.dispose(); targetPulse = null; }
    }

    function createRoute(shop) {
      clearRoute();
      const start = new THREE.Vector3(-6.5, 0.42, 4.6);
      const lift1 = new THREE.Vector3(6.2, 0.42, 0.2);
      const liftTarget = new THREE.Vector3(6.2, (shop.floor - 1) * floorHeight + 0.42, 0.2);
      const target = new THREE.Vector3(shop.x, (shop.floor - 1) * floorHeight + 0.92, shop.z);
      const points = shop.floor === 1
        ? [start, new THREE.Vector3(shop.x, 0.42, 4.6), target]
        : [start, lift1, liftTarget, new THREE.Vector3(shop.x, liftTarget.y, 0.2), target];

      const curve = new THREE.CatmullRomCurve3(points);
      const routePoints = curve.getPoints(80);
      const geo = new THREE.BufferGeometry().setFromPoints(routePoints);
      const mat = new THREE.LineBasicMaterial({ color: 0x12b76a, linewidth: 5 });
      routeLine = new THREE.Line(geo, mat);
      scene.add(routeLine);

      routePoints.filter((_, i) => i % 13 === 0).forEach((p) => {
        const marker = new THREE.Mesh(
          new THREE.SphereGeometry(0.11, 16, 16),
          new THREE.MeshStandardMaterial({ color: 0x12b76a, emissive: 0x0b7d44, emissiveIntensity: 0.15 })
        );
        marker.position.copy(p);
        scene.add(marker);
        routeMarkers.push(marker);
      });

      targetPulse = new THREE.Mesh(
        new THREE.TorusGeometry(Math.max(shop.w, shop.d) * 0.45, 0.045, 12, 80),
        new THREE.MeshBasicMaterial({ color: 0xf97316 })
      );
      targetPulse.rotation.x = Math.PI / 2;
      targetPulse.position.set(shop.x, (shop.floor - 1) * floorHeight + 0.92, shop.z);
      scene.add(targetPulse);
    }

    function resetShopColors() {
      shopMeshes.forEach(mesh => {
        mesh.material.emissive = new THREE.Color(0x000000);
        mesh.material.emissiveIntensity = 0;
        mesh.scale.set(1,1,1);
      });
    }

    function navigateTo(keyword) {
      const shop = findShop(keyword);
      if (!shop) {
        showToast('未找到该门店，可试试：星巴克、海底捞、电影院、卫生间');
        return;
      }
      selectedShop = shop;
      resetShopColors();
      const mesh = shopMeshes.find(m => m.userData.shop === shop);
      if (mesh) {
        mesh.material.emissive = new THREE.Color(0xf97316);
        mesh.material.emissiveIntensity = 0.35;
        mesh.scale.set(1.08, 1.18, 1.08);
      }
      currentFloor = shop.floor;
      updateFloorVisibility();
      createRoute(shop);

      document.getElementById('infoTitle').textContent = `目标：${shop.name}（${shop.floor}F · ${shop.type}）`;
      const crossFloor = shop.floor === 1 ? '无需跨楼层，沿 1F 主通道前进。' : `先前往 1F 东侧电梯，上至 ${shop.floor}F 后沿主通道前进。`;
      document.getElementById('infoLine').textContent = `系统已在 3D 模型中高亮目标门店，并从“北门入口”生成推荐路线。`;
      const routeBox = document.getElementById('routeBox');
      routeBox.style.display = 'block';
      routeBox.innerHTML = `推荐路线：北门入口 → ${crossFloor} → ${shop.name}<br>预计步行时间：${shop.floor === 1 ? '2–3' : '4–6'} 分钟`;

      controls.target.set(shop.x, (shop.floor - 1) * floorHeight + 0.8, shop.z);
      camera.position.set(shop.x + 9, (shop.floor - 1) * floorHeight + 7, shop.z + 9);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 2200);
    }

    document.getElementById('searchBtn').addEventListener('click', () => {
      navigateTo(document.getElementById('searchInput').value);
    });
    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') navigateTo(e.target.value);
    });
    document.querySelectorAll('.floor-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFloor = btn.dataset.floor === 'all' ? 'all' : Number(btn.dataset.floor);
        updateFloorVisibility();
      });
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    renderer.domElement.addEventListener('click', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(shopMeshes.filter(m => m.visible));
      if (hits.length) {
        const shop = hits[0].object.userData.shop;
        document.getElementById('searchInput').value = shop.name;
        navigateTo(shop.name);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      if (targetPulse) {
        const t = performance.now() * 0.002;
        const s = 1 + Math.sin(t) * 0.08;
        targetPulse.scale.set(s, s, s);
      }
      renderer.render(scene, camera);
    }

    createMall();
    buildChips();
    updateFloorVisibility();
    animate();
  </script>
</body>
</html>
