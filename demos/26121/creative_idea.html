<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剥洋葱教练 —— 反脆弱的个人战略管理</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --primary-color: #343a40;
            --accent-color: #e03131;
            --border-color: #dee2e6;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 40px;
            margin: 20px;
            border-top: 6px solid var(--primary-color);
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        .subtitle {
            color: #868e96;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0 0 30px 0;
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #fff;
            transition: all 0.2s ease;
        }

        .task-item.migrated {
            border-left: 4px solid var(--accent-color);
            background-color: #fff5f5;
        }

        .task-checkbox {
            margin-top: 5px;
            margin-right: 15px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .task-content {
            flex-grow: 1;
        }

        .task-title {
            font-weight: 500;
            margin: 0 0 5px 0;
        }

        .task-meta {
            font-size: 12px;
            color: #868e96;
            display: flex;
            gap: 10px;
        }

        .tag-migrated {
            color: var(--accent-color);
            font-weight: 600;
            background: #ffe3e3;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .interrogation-panel {
            background-color: var(--primary-color);
            color: white;
            padding: 25px;
            border-radius: 8px;
            display: none;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .interrogation-title {
            font-size: 18px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 15px;
            color: #ffc9c9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .interrogation-text {
            font-size: 15px;
            margin-bottom: 20px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background-color: white;
            color: var(--primary-color);
        }

        .btn-danger {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-outline {
            background-color: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .status-bar {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
            font-size: 12px;
            color: #adb5bd;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>剥洋葱教练</h1>
    <div class="subtitle">个人战略 OS · 拒绝战术勤奋</div>

    <ul class="task-list">
        <li class="task-item">
            <input type="checkbox" class="task-checkbox">
            <div class="task-content">
                <p class="task-title">完成 AI 创造力大赛报名</p>
                <div class="task-meta">
                    <span>今天</span>
                    <span>优先级: 高</span>
                </div>
            </div>
        </li>

        <li class="task-item migrated" id="target-task">
            <input type="checkbox" class="task-checkbox" disabled>
            <div class="task-content">
                <p class="task-title" style="color: var(--accent-color);">整理第一季度复盘报告</p>
                <div class="task-meta">
                    <span class="tag-migrated">已连续迁移 3 次</span>
                    <span>原定: 3天前</span>
                </div>
            </div>
        </li>
    </ul>

    <div class="interrogation-panel" id="interrogation-panel">
        <h3 class="interrogation-title">
            ⚠️ 触发灵魂拷问机制 (Hard Truth)
        </h3>
        <p class="interrogation-text">
            系统检测到你已连续 3 次将「整理第一季度复盘报告」迁移至明日。不要再骗自己了，面对现实吧：<br><br>
            <strong>是因为这个任务颗粒度太大让你无从下手，还是你内心深处根本认为它不重要？</strong>
        </p>
        <div class="action-buttons">
            <button class="btn btn-primary" onclick="alert('进入剥洋葱模式：AI 将辅助你把该任务拆解为 3 个可在 15 分钟内完成的微型动作。')">🔪 颗粒度太大，帮我拆解</button>
            <button class="btn btn-danger" onclick="alert('已将该任务移入【战略放弃】清单。承认做不到，也是一种强大的自我管理。')">🗑️ 我不想做，战略放弃</button>
            <button class="btn btn-outline" onclick="alert('这是最后一次。已设定强力死线提醒。')">⏳ 再给我最后一次机会</button>
        </div>
    </div>

    <div class="status-bar">
        AI 引擎已连接 | 当前状态：监控日常任务流...
    </div>
</div>

<script>
    // 模拟应用逻辑，展示交互效果
    setTimeout(() => {
        document.getElementById('interrogation-panel').style.display = 'block';
    }, 800);
</script>

</body>
</html>
