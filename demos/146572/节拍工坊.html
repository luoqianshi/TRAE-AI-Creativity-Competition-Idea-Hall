<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节拍工坊 · Beat Workshop</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0a0a0a;--neon-g:#39ff14;--neon-p:#ff00ff;--neon-c:#00ffff;--neon-y:#ffff00;--neon-o:#ff6600;--grid:#1a1a1a}
  body{font-family:'Consolas','Courier New',monospace;background:var(--bg);color:var(--neon-c);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(circle at 30% 20%,rgba(57,255,20,.05),transparent 40%),radial-gradient(circle at 70% 80%,rgba(255,0,255,.05),transparent 40%)}
  .grid-bg{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.3;
    background-image:linear-gradient(rgba(0,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,255,.03) 1px,transparent 1px);background-size:30px 30px}
  .studio{max-width:1000px;margin:0 auto;padding:24px 16px;position:relative;z-index:1}
  header{text-align:center;margin-bottom:24px}
  header .led{display:inline-flex;gap:6px;margin-bottom:10px}
  header .led span{width:8px;height:8px;border-radius:50%;animation:ledBlink 1s infinite}
  header .led .l1{background:var(--neon-g);box-shadow:0 0 8px var(--neon-g)}
  header .led .l2{background:var(--neon-y);box-shadow:0 0 8px var(--neon-y);animation-delay:.2s}
  header .led .l3{background:var(--neon-p);box-shadow:0 0 8px var(--neon-p);animation-delay:.4s}
  @keyframes ledBlink{50%{opacity:.3}}
  header h1{font-size:clamp(24px,4.5vw,36px);font-weight:900;letter-spacing:4px;
    background:linear-gradient(90deg,var(--neon-g),var(--neon-c),var(--neon-p));-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{font-size:12px;color:#555;letter-spacing:3px;margin-top:6px}

  .controls-bar{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .ctrl-group{display:flex;align-items:center;gap:10px;padding:10px 18px;background:#111;border:1px solid #222;border-radius:8px}
  .ctrl-group label{font-size:11px;color:#666;letter-spacing:1px;text-transform:uppercase}
  .play-btn{width:48px;height:48px;border-radius:50%;border:2px solid var(--neon-g);background:transparent;color:var(--neon-g);font-size:18px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
  .play-btn:hover{background:var(--neon-g);color:var(--bg);box-shadow:0 0 20px var(--neon-g)}
  .play-btn.playing{background:var(--neon-g);color:var(--bg);box-shadow:0 0 20px var(--neon-g);animation:pulsePlay .5s infinite}
  @keyframes pulsePlay{50%{box-shadow:0 0 30px var(--neon-g)}}
  .bpm-display{font-size:24px;font-weight:900;color:var(--neon-y);text-shadow:0 0 10px var(--neon-y);font-family:'Consolas',monospace;min-width:60px;text-align:center}
  .bpm-slider{width:100px;accent-color:var(--neon-c)}
  .vol-slider{width:80px;accent-color:var(--neon-p)}

  .visualizer{height:80px;background:#0f0f0f;border:1px solid #222;border-radius:8px;margin-bottom:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:3px;padding:0 10px}
  .vbar{width:4px;background:var(--neon-c);border-radius:2px;transition:height .05s;min-height:4px;box-shadow:0 0 6px var(--neon-c)}

  .sequencer{background:#111;border:1px solid #222;border-radius:12px;padding:16px;margin-bottom:20px;overflow-x:auto}
  .seq-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:11px;color:#666;letter-spacing:2px}
  .seq-row{display:grid;grid-template-columns:80px repeat(16,1fr);gap:3px;margin-bottom:3px;min-width:600px}
  .seq-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:0 8px;border-radius:4px}
  .seq-cell{aspect-ratio:1;border-radius:3px;background:#1a1a1a;cursor:pointer;transition:all .15s;border:1px solid #222}
  .seq-cell:hover{border-color:#444}
  .seq-cell.active{box-shadow:0 0 8px currentColor}
  .seq-cell.beat-marker{outline:1px solid #333}
  .seq-cell.playing{transform:scale(1.15);box-shadow:0 0 15px currentColor}
  .row-kick .seq-cell.active{background:var(--neon-o);color:var(--neon-o)}
  .row-snare .seq-cell.active{background:var(--neon-p);color:var(--neon-p)}
  .row-hat .seq-cell.active{background:var(--neon-y);color:var(--neon-y)}
  .row-clap .seq-cell.active{background:var(--neon-c);color:var(--neon-c)}
  .row-bass .seq-cell.active{background:var(--neon-g);color:var(--neon-g)}

  .pad-section{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  .drum-pads{background:#111;border:1px solid #222;border-radius:12px;padding:16px}
  .drum-pads h3{font-size:12px;color:#666;letter-spacing:2px;margin-bottom:12px}
  .pads-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .pad{aspect-ratio:1;border-radius:10px;border:2px solid #222;background:#1a1a1a;cursor:pointer;transition:all .1s;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#666;user-select:none}
  .pad:hover{border-color:#444}
  .pad:active,.pad.hit{transform:scale(.92);box-shadow:0 0 20px currentColor}
  .pad .p-icon{font-size:24px;margin-bottom:4px}
  .pad[data-sound="kick"]{color:var(--neon-o)}.pad[data-sound="kick"].hit{background:var(--neon-o);color:var(--bg)}
  .pad[data-sound="snare"]{color:var(--neon-p)}.pad[data-sound="snare"].hit{background:var(--neon-p);color:var(--bg)}
  .pad[data-sound="hat"]{color:var(--neon-y)}.pad[data-sound="hat"].hit{background:var(--neon-y);color:var(--bg)}
  .pad[data-sound="clap"]{color:var(--neon-c)}.pad[data-sound="clap"].hit{background:var(--neon-c);color:var(--bg)}

  .presets-box{background:#111;border:1px solid #222;border-radius:12px;padding:16px}
  .presets-box h3{font-size:12px;color:#666;letter-spacing:2px;margin-bottom:12px}
  .preset-list{display:flex;flex-direction:column;gap:8px}
  .preset-item{padding:10px 14px;background:#1a1a1a;border:1px solid #222;border-radius:8px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:space-between}
  .preset-item:hover{border-color:var(--neon-c);background:#222}
  .preset-item.active{border-color:var(--neon-g);background:rgba(57,255,20,.05)}
  .preset-item .p-name{font-size:13px;font-weight:700}
  .preset-item .p-genre{font-size:10px;color:#666}

  .pattern-info{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
  .info-card{background:#111;border:1px solid #222;border-radius:8px;padding:14px;text-align:center}
  .info-card .ic-label{font-size:10px;color:#666;letter-spacing:2px;text-transform:uppercase}
  .info-card .ic-val{font-size:20px;font-weight:900;color:var(--neon-c);margin-top:4px;font-family:'Consolas',monospace}

  footer{text-align:center;padding:24px 0;color:#444;font-size:11px;letter-spacing:2px}
  footer .led-strip{display:flex;gap:4px;justify-content:center;margin-bottom:8px}
  footer .led-strip span{width:6px;height:6px;border-radius:50%;background:#222}
  @media(max-width:600px){.pad-section{grid-template-columns:1fr}.pattern-info{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="studio">
  <header>
    <div class="led"><span class="l1"></span><span class="l2"></span><span class="l3"></span></div>
    <h1>BEAT WORKSHOP</h1>
    <p>// 节拍工坊 · MAKE YOUR OWN GROOVE</p>
  </header>

  <div class="controls-bar">
    <div class="ctrl-group">
      <button class="play-btn" id="playBtn">▶</button>
      <button class="play-btn" id="stopBtn" style="border-color:var(--neon-p);color:var(--neon-p)">⏹</button>
    </div>
    <div class="ctrl-group">
      <label>BPM</label>
      <input type="range" class="bpm-slider" id="bpmSlider" min="60" max="180" value="120">
      <span class="bpm-display" id="bpmVal">120</span>
    </div>
    <div class="ctrl-group">
      <label>VOL</label>
      <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="60">
    </div>
  </div>

  <div class="visualizer" id="visualizer"></div>

  <div class="pattern-info">
    <div class="info-card"><div class="ic-label">当前节拍</div><div class="ic-val" id="curStep">01</div></div>
    <div class="info-card"><div class="ic-label">激活步数</div><div class="ic-val" id="activeSteps">0</div></div>
    <div class="info-card"><div class="ic-label">循环次数</div><div class="ic-val" id="loopCount">0</div></div>
  </div>

  <div class="sequencer">
    <div class="seq-header">// STEP SEQUENCER · 16 STEPS · 点击格子激活/取消</div>
    <div id="seqRows"></div>
  </div>

  <div class="pad-section">
    <div class="drum-pads">
      <h3>// DRUM PADS · 点击或按键盘 QWER ASDF</h3>
      <div class="pads-grid" id="padsGrid"></div>
    </div>
    <div class="presets-box">
      <h3>// PATTERN PRESETS</h3>
      <div class="preset-list" id="presetList"></div>
    </div>
  </div>

  <footer>
    <div class="led-strip" id="ledStrip"></div>
    // SYNTH WITH YOUR FINGERS · BEAT WORKSHOP © 2026 //
  </footer>
</div>
<script>
const AC=window.AudioContext||window.webkitAudioContext;
let audioCtx=null,masterGain=null;
function initAudio(){if(!audioCtx){audioCtx=new AC();masterGain=audioCtx.createGain();masterGain.connect(audioCtx.destination);masterGain.gain.value=0.6;}if(audioCtx.state==='suspended')audioCtx.resume();}

function playKick(t){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(0.01,t+0.3);g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(0.01,t+0.3);o.connect(g);g.connect(masterGain);o.start(t);o.stop(t+0.3);}
function playSnare(t){const n=audioCtx.createBufferSource(),b=audioCtx.createBuffer(1,4410,44100),d=b.getChannelData(0);for(let i=0;i<4410;i++)d[i]=Math.random()*2-1;n.buffer=b;const g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();f.type='highpass';f.frequency.value=1000;g.gain.setValueAtTime(0.7,t);g.gain.exponentialRampToValueAtTime(0.01,t+0.15);n.connect(f);f.connect(g);g.connect(masterGain);n.start(t);n.stop(t+0.15);}
function playHat(t){const n=audioCtx.createBufferSource(),b=audioCtx.createBuffer(1,2205,44100),d=b.getChannelData(0);for(let i=0;i<2205;i++)d[i]=Math.random()*2-1;n.buffer=b;const g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.01,t+0.05);n.connect(f);f.connect(g);g.connect(masterGain);n.start(t);n.stop(t+0.05);}
function playClap(t){for(let i=0;i<3;i++){const n=audioCtx.createBufferSource(),b=audioCtx.createBuffer(1,1102,44100),d=b.getChannelData(0);for(let j=0;j<1102;j++)d[j]=Math.random()*2-1;n.buffer=b;const g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();f.type='bandpass';f.frequency.value=1500;g.gain.setValueAtTime(0.5,t+i*0.01);g.gain.exponentialRampToValueAtTime(0.01,t+i*0.01+0.1);n.connect(f);f.connect(g);g.connect(masterGain);n.start(t+i*0.01);n.stop(t+i*0.01+0.1);}}
function playBass(t){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(80,t);g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.01,t+0.2);o.connect(g);g.connect(masterGain);o.start(t);o.stop(t+0.2);}

const sounds={kick:playKick,snare:playSnare,hat:playHat,clap:playClap,bass:playBass};
const rows=[{id:'kick',label:'🥁 KICK',cls:'row-kick'},{id:'snare',label:'👏 SNARE',cls:'row-snare'},{id:'hat',label:'🎩 HAT',cls:'row-hat'},{id:'clap',label:'👏 CLAP',cls:'row-clap'},{id:'bass',label:'🎸 BASS',cls:'row-bass'}];
const pattern={kick:[],snare:[],hat:[],clap:[],bass:[]};

const seqRows=document.getElementById('seqRows');
rows.forEach(r=>{
  const row=document.createElement('div');row.className='seq-row '+r.cls;
  let cells='<div class="seq-label">'+r.label+'</div>';
  for(let i=0;i<16;i++){
    const marker=i%4===0?' beat-marker':'';
    cells+=`<div class="seq-cell${marker}" data-row="${r.id}" data-step="${i}"></div>`;
  }
  row.innerHTML=cells;seqRows.appendChild(row);
});

document.querySelectorAll('.seq-cell').forEach(c=>{
  c.onclick=()=>{
    initAudio();
    c.classList.toggle('active');
    const r=c.dataset.row,s=parseInt(c.dataset.step);
    if(c.classList.contains('active')){if(!pattern[r].includes(s))pattern[r].push(s);}
    else{pattern[r]=pattern[r].filter(x=>x!==s);}
    updateInfo();
  };
});

// 鼓垫
const pads=[{s:'kick',i:'🥁',n:'KICK',k:'q'},{s:'snare',i:'👏',n:'SNARE',k:'w'},{s:'hat',i:'🎩',n:'HAT',k:'e'},{s:'clap',i:'👏',n:'CLAP',k:'r'},
  {s:'kick',i:'🥁',n:'KICK2',k:'a'},{s:'snare',i:'👏',n:'SNARE2',k:'s'},{s:'hat',i:'🎩',n:'HAT2',k:'d'},{s:'bass',i:'🎸',n:'BASS',k:'f'}];
const pg=document.getElementById('padsGrid');
pads.forEach(p=>{
  const pad=document.createElement('div');pad.className='pad';pad.dataset.sound=p.s;
  pad.innerHTML=`<span class="p-icon">${p.i}</span><span>${p.n}</span><span style="font-size:9px;opacity:.5">[${p.k.toUpperCase()}]</span>`;
  pad.onclick=()=>{initAudio();hitPad(pad);};
  pg.appendChild(pad);
});
function hitPad(pad){pad.classList.add('hit');setTimeout(()=>pad.classList.remove('hit'),150);if(audioCtx&&sounds[pad.dataset.sound])sounds[pad.dataset.sound](audioCtx.currentTime);}

document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();const p=pads.find(x=>x.k===k);
  if(p){const pad=document.querySelector(`.pad[data-sound="${p.s}"]`);if(pad)hitPad(pad);}
});

// 预设
const presets=[
  {n:'HOUSE',g:'house',p:{kick:[0,4,8,12],snare:[4,12],hat:[0,2,4,6,8,10,12,14],clap:[],bass:[0,8]}},
  {n:'HIP-HOP',g:'hiphop',p:{kick:[0,6,10],snare:[4,12],hat:[0,2,4,6,8,10,12,14],clap:[4,12],bass:[0,6,10]}},
  {n:'TRAP',g:'trap',p:{kick:[0,6,7,10],snare:[4,12],hat:[0,2,3,4,6,8,10,11,12,14],clap:[],bass:[0,6,10]}},
  {n:'TECHNO',g:'techno',p:{kick:[0,4,8,12],snare:[],hat:[2,6,10,14],clap:[],bass:[0,2,4,6,8,10,12,14]}},
  {n:'DNB',g:'drum&bass',p:{kick:[0,10],snare:[4,12],hat:[0,2,4,6,8,10,12,14],clap:[],bass:[0,5,10]}}
];
const pl=document.getElementById('presetList');
presets.forEach(pr=>{
  const item=document.createElement('div');item.className='preset-item';
  item.innerHTML=`<span class="p-name">${pr.n}</span><span class="p-genre">${pr.g}</span>`;
  item.onclick=()=>{loadPreset(pr);document.querySelectorAll('.preset-item').forEach(x=>x.classList.remove('active'));item.classList.add('active');};
  pl.appendChild(item);
});
function loadPreset(pr){
  Object.keys(pattern).forEach(k=>pattern[k]=[]);
  document.querySelectorAll('.seq-cell').forEach(c=>c.classList.remove('active'));
  Object.keys(pr.p).forEach(r=>{
    pr.p[r].forEach(s=>{pattern[r].push(s);document.querySelector(`.seq-cell[data-row="${r}"][data-step="${s}"]`).classList.add('active');});
  });
  updateInfo();
}

// 可视化
const vz=document.getElementById('visualizer');
for(let i=0;i<64;i++){const b=document.createElement('div');b.className='vbar';b.style.height='4px';vz.appendChild(b);}
const vbars=vz.querySelectorAll('.vbar');

// LED strip
const ls=document.getElementById('ledStrip');
for(let i=0;i<16;i++){const s=document.createElement('span');ls.appendChild(s);}

function updateInfo(){
  const total=Object.values(pattern).reduce((a,b)=>a+b.length,0);
  document.getElementById('activeSteps').textContent=String(total).padStart(2,'0');
}

let playing=false,step=0,loopN=0,timer=null;
let bpm=120;
document.getElementById('bpmSlider').oninput=function(){bpm=parseInt(this.value);document.getElementById('bpmVal').textContent=bpm;};
document.getElementById('volSlider').oninput=function(){if(masterGain)masterGain.gain.value=this.value/100;};

function tick(){
  document.querySelectorAll('.seq-cell.playing').forEach(c=>c.classList.remove('playing'));
  document.querySelectorAll('#ledStrip span').forEach(s=>s.style.background='#222');
  rows.forEach(r=>{
    if(pattern[r.id].includes(step)){
      sounds[r.id](audioCtx.currentTime);
      const cell=document.querySelector(`.seq-cell[data-row="${r.id}"][data-step="${step}"]`);
      if(cell)cell.classList.add('playing');
    }
  });
  document.getElementById('curStep').textContent=String(step+1).padStart(2,'0');
  ls.children[step].style.background='var(--neon-g)';ls.children[step].style.boxShadow='0 0 6px var(--neon-g)';
  vbars.forEach((b,i)=>{b.style.height=(4+Math.random()*60)+'px';});
  step=(step+1)%16;
  if(step===0){loopN++;document.getElementById('loopCount').textContent=loopN;}
}
document.getElementById('playBtn').onclick=()=>{
  initAudio();
  if(!playing){playing=true;document.getElementById('playBtn').textContent='⏸';document.getElementById('playBtn').classList.add('playing');
    timer=setInterval(tick,60000/bpm/4);}
  else{playing=false;document.getElementById('playBtn').textContent='▶';document.getElementById('playBtn').classList.remove('playing');clearInterval(timer);}
};
document.getElementById('stopBtn').onclick=()=>{
  playing=false;document.getElementById('playBtn').textContent='▶';document.getElementById('playBtn').classList.remove('playing');
  clearInterval(timer);step=0;loopN=0;document.getElementById('curStep').textContent='01';document.getElementById('loopCount').textContent='0';
  document.querySelectorAll('.seq-cell.playing').forEach(c=>c.classList.remove('playing'));
};
loadPreset(presets[0]);document.querySelector('.preset-item').classList.add('active');
</script>
</body>
</html>
