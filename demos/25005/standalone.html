<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>

<title>「世界」人格测试 | 独立版</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"></script>
<style>
:root {
    --bg-image-url: url('https://pan.chaer.xyz/f/dKHV/Background_School_SEKAI_%2528Night%2529.webp');
    --bg-fallback: #eaeaf0;
    --card: rgba(255, 255, 255, 0.65);
    --accent: #2ab1a8;
    --accent-light: rgba(42, 177, 168, 0.12);
    --ios-ease: cubic-bezier(0.25, 1, 0.22, 1);
    --text-main: #1d1d1f;
    --text-sub: #515154;
    --text-muted: #8E8E93;
    --secondary: #2E3440;
    --border-light: rgba(255, 255, 255, 0.6);
    --border-subtle: rgba(0, 0, 0, 0.06);
    --radius-card: 28px;
    --radius-pill: 999px;
    --shadow-elevated: 0 24px 64px rgba(0,0,0,0.15), inset 0 1px 1px rgba(255,255,255,0.8);
    --font-stack: -apple-system, "SF Pro Display", "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { min-height: 100vh; width: 100%; max-width: 100vw; background: transparent !important; overflow-x: hidden; }
body{ font-family: var(--font-stack); color: var(--text-main); display: flex; align-items: center; justify-content: center; padding: 24px 16px; position: relative; }
body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-fallback); background-image: var(--bg-image-url); background-size: cover; background-position: center; background-repeat: no-repeat; filter: brightness(0.85); z-index: -2; pointer-events: none; }
.app-container{ width: 100%; max-width: 380px; background: var(--card); backdrop-filter: blur(20px) saturate(190%); -webkit-backdrop-filter: blur(20px) saturate(190%); border-radius: 28px; border: 1px solid var(--border-light); box-shadow: 0 16px 48px rgba(0,0,0,0.12), inset 0 1px 1px rgba(255,255,255,0.8); overflow: hidden; display: flex; flex-direction: column; will-change: transform, opacity; z-index: 1; }
.content-wrapper{ padding: 28px 24px; width: 100%; display: flex; flex-direction: column; will-change: transform, opacity, filter; }
.result-display { display: flex; flex-direction: column; align-items: center; width: 100%; }
.portrait-container { position: relative; width: 100%; height: 190px; display: flex; justify-content: center; align-items: flex-end; margin-bottom: 18px; margin-top: 4px; }
.char-portrait { max-height: 100%; max-width: 90%; z-index: 2; object-fit: contain; filter: drop-shadow(0 12px 24px rgba(0,0,0,0.16)); }
.char-glow { position: absolute; width: 150px; height: 150px; background: var(--accent); filter: blur(35px); opacity: 0.35; border-radius: 50%; bottom: -5px; z-index: 1; }
.unit-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.5); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.4); margin-bottom: 12px; }
.unit-logo { width: 15px; height: 15px; object-fit: contain; }
.unit-name { font-size: 11px; font-weight: 800; color: var(--accent-text); letter-spacing: 0.6px; }
.res-name{ font-size: 28px; font-weight: 900; color: var(--accent-text); margin-bottom: 12px; letter-spacing: -0.5px; }
.result-desc { font-size: 13.5px; line-height: 1.6; text-align: center; color: var(--text-main); opacity: 0.85; margin-bottom: 24px; padding: 0 4px; }
.match-list { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
.match-item { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; border-radius: 14px; background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.3); }
.match-item.top-match { background: var(--accent-light); border-color: rgba(124,58,237,0.25); }
.match-name { font-weight: 800; font-size: 13px; }
.match-percent { font-weight: 900; color: var(--accent-text); font-size: 15px; }
.header-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; width: 100%; }
.tag-time { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 800; color: var(--accent-text); background: var(--accent-light); padding: 4px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.25); white-space: nowrap; }
.progress-track { flex: 1; height: 6px; background: rgba(0,0,0,0.05); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); width: 0%; }
.question-box { width: 100%; margin-bottom: 24px; }
.question-box h2{ font-size: 17px; font-weight: 800; line-height: 1.5; margin-bottom: 32px; text-align: center; }
.slider-container { width: 100%; padding: 0 8px; margin: 20px 0; display: flex; flex-direction: column; align-items: center; position: relative; }
.slider-track-wrap { position: relative; width: 100%; padding-top: 44px; margin-bottom: 4px; touch-action: none; }
.slider-value-bubble { position: absolute; top: 0; left: 50%; transform: translateX(-50%) translateY(0) scale(1); background: var(--accent); color: var(--accent-contrast); padding: 6px 14px; border-radius: 14px; font-size: 13px; font-weight: 700; text-align: center; min-width: 90px; box-shadow: 0 4px 12px rgba(42, 177, 168, 0.25); pointer-events: none; z-index: 3; white-space: nowrap; }
.ios-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 4px; outline: none; margin: 12px 0; cursor: pointer; display: block; background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--slider-pct, 50%), rgba(0, 0, 0, 0.06) var(--slider-pct, 50%), rgba(0, 0, 0, 0.06) 100%); }
.ios-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 44px; height: 44px; border-radius: 50%; opacity: 0.001; cursor: pointer; }
.ios-slider::-moz-range-thumb { width: 44px; height: 44px; border-radius: 50%; opacity: 0.001; border: none; cursor: pointer; }
.slider-thumb { position: absolute; top: calc(44px + 12px + (8px - 24px) / 2); left: var(--thumb-pct, 50%); width: 24px; height: 24px; border-radius: 50%; background: #ffffff; border: 0.5px solid rgba(0,0,0,0.04); box-shadow: 0 3px 8px rgba(0,0,0,0.15); pointer-events: none; z-index: 2; transform: translateX(-50%) scale(var(--thumb-scale, 1)); }
.slider-labels { display: flex; justify-content: space-between; width: 100%; padding: 0; margin-top: 6px; }
.slider-label-btn { font-size: 11px; font-weight: 700; color: var(--text-sub); background: none; border: none; flex: 1; text-align: center; }
.slider-label-btn.active { color: var(--accent-text); font-weight: 800; }
.nav-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; width: 100%; }
.btn-back { background: rgba(255,255,255,0.45); border: 1px solid rgba(255,255,255,0.45); color: var(--text-main); font-weight: 700; padding: 8px 16px; border-radius: 12px; cursor: pointer; font-size: 12px; }
.btn-back:active { transform: scale(0.96); background: rgba(255,255,255,0.7); }
.page-indicator { font-size: 11px; font-weight: 800; color: var(--accent-text); background: rgba(255,255,255,0.45); padding: 5px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); }
.btn-primary, .btn-secondary { padding: 15px; border-radius: 16px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; transition: all .25s var(--ios-ease); border: none; }
.btn-primary { background: var(--accent); color: var(--accent-contrast); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
.btn-primary:active { transform: scale(0.98); }
.btn-secondary { background: rgba(255,255,255,0.45); color: var(--accent-text); border: 1px solid rgba(255,255,255,0.5); margin-top: 10px; }
.result-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-bottom: 4px; }
.action-row-split { display: flex; gap: 12px; width: 100%; }
.action-row-split button { flex: 1; height: 48px; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 16px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; }
.btn-share { background: rgba(255,255,255,0.45); border: 1px solid rgba(255,255,255,0.45); color: var(--accent-text); }
.btn-ghost { padding: 11px; border-radius: 14px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.3); color: var(--text-sub); width: 100%; }
.stats-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(46, 52, 64, 0.48); backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%); z-index: 999; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; padding: 20px; box-sizing: border-box; }
.stats-modal.show { pointer-events: auto; }
.stats-card { width: clamp(300px, 88vw, 380px); max-width: 380px; height: clamp(420px, 78vh, 85vh); background: rgba(255, 255, 255, 0.62); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--border-light); border-radius: var(--radius-card); padding: 20px 16px 24px; display: flex; flex-direction: column; box-shadow: var(--shadow-elevated); box-sizing: border-box; }
.stats-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 0 4px; }
.stats-title { font-size: 18px; font-weight: 700; color: var(--secondary); letter-spacing: -0.3px; }
.btn-close-stats { background: rgba(120,120,136,0.12); border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 14px; font-weight: 600; color: var(--text-sub); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s ease; touch-action: manipulation; flex-shrink: 0; margin-left: auto; }
.btn-close-stats:hover { background: rgba(120,120,136,0.22); }
.stats-tabs { display: flex; flex-wrap: nowrap; overflow: hidden; gap: 8px; margin-bottom: 12px; padding: 4px 4px 10px; border-bottom: 1px solid var(--border-subtle); position: sticky; top: 0; z-index: 2; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; min-height: 36px; }
.stats-tabs:active { cursor: grabbing; }
.stats-tab { padding: 7px 14px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid transparent; background: rgba(120,120,136,0.08); color: var(--text-main); transition: border-color 0.22s var(--ios-ease), background 0.22s ease, color 0.22s ease, box-shadow 0.22s ease, transform 0.18s ease; white-space: nowrap; flex-shrink: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.stats-tab:hover { background: rgba(120,120,136,0.15); }
.stats-tab:active { transform: scale(0.96); }
.stats-tab.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); font-weight: 700; box-shadow: 0 2px 10px rgba(42, 177, 168, 0.25); }
.stats-scroll-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.stats-scroll-body::-webkit-scrollbar { width: 4px; }
.stats-scroll-body::-webkit-scrollbar-track { background: transparent; }
.stats-scroll-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 2px; }
.stats-leaderboard { display: flex; flex-direction: column; gap: 8px; padding: 0 4px 6px; width: 100%; box-sizing: border-box; }
.lb-row { display: flex; align-items: center; gap: 4px; padding: 10px 10px; border-radius: 14px; background: rgba(120,120,136,0.06); border: 1px solid rgba(120,120,136,0.12); transition: background 0.15s ease; min-height: 44px; touch-action: manipulation; user-select: none; }
.lb-row:hover { background: rgba(120,120,136,0.10); }
.lb-row:active { transform: scale(0.985); }
.lb-row.top1 { background: linear-gradient(135deg, rgba(255, 215, 0, 0.18), rgba(255, 192, 0, 0.12)); border-color: rgba(255, 215, 0, 0.4); box-shadow: 0 2px 8px rgba(255, 215, 0, 0.15); }
.lb-row.top2 { background: linear-gradient(135deg, rgba(160, 170, 190, 0.22), rgba(140, 150, 170, 0.14)); border-color: rgba(160, 170, 190, 0.45); box-shadow: 0 1px 4px rgba(160, 170, 190, 0.12); }
.lb-row.top3 { background: linear-gradient(135deg, rgba(205, 127, 50, 0.14), rgba(178, 110, 44, 0.1)); border-color: rgba(205, 127, 50, 0.28); }
.lb-rank { width: 18px; font-size: 12px; font-weight: 700; color: var(--text-muted); text-align: center; flex-shrink: 0; line-height: 1.2; }
.lb-row.top1 .lb-rank { color: #b8860b; font-size: 14px; }
.lb-row.top2 .lb-rank { color: #6b7a8d; }
.lb-row.top3 .lb-rank { color: #996515; }
.lb-name { font-size: 13px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.lb-unit-tag { display: inline-flex; align-items: center; flex-shrink: 0; }
.lb-unit-tag img { width: 30px; height: 12px; object-fit: contain; display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.08)); }
.lb-bar-track { width: 120px; height: 9px; background: rgba(0,0,0,0.05); border-radius: 7px; overflow: hidden; flex-shrink: 0; margin-left: auto; }
.lb-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), #2daa9f); border-radius: 7px; }
.stats-footer { text-align: center; font-size: 13px; font-weight: 600; color: var(--text-muted); padding: 16px 0 4px; border-top: 1px solid var(--border-subtle); margin-top: 8px; flex-shrink: 0; line-height: 1.6; }
.modal-notice-content { text-align: left; margin: 0 0 16px; }
.modal-notice-content p { font-size: 14px; color: var(--text-sub); line-height: 1.6; margin: 0 0 16px; text-align: left; }
.modal-notice-content p:last-child { margin-bottom: 0; }
.modal-notice-btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; max-width: 260px; margin: 0 auto; display: flex; padding: 13px 24px; border: none; border-radius: 100px; background: #259C95; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 20px rgba(37, 156, 149, 0.3); letter-spacing: 0.2px; font-family: inherit; transition: box-shadow 0.2s ease; }
.modal-notice-btn:hover { box-shadow: 0 8px 28px rgba(37, 156, 149, 0.4); }
.modal-notice-btn:active { transform: scale(0.97); }
.modal-actions { display: flex; flex-direction: row; gap: 12px; margin-top: 12px; }
.modal-btn { display: flex; align-items: center; justify-content: center; flex: 1; padding: 13px 20px; border-radius: 100px; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; border: none; transition: opacity 0.2s ease; letter-spacing: 0.2px; min-width: 0; }
.modal-btn.cancel { background: rgba(120,120,136,0.12); color: var(--text-main); font-weight: 500; }

.modal-btn.confirm:hover { background: #259C95; }

.stats-title { font-size: 16px; }

}

.stats-title { font-size: 19px; }

.lb-name { font-size: 15px; }

}
.copyright-wrapper { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 16px 14px; font-size: 10.5px; color: var(--text-sub); text-align: center; line-height: 1.5; }
.copyright-wrapper .links-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.copyright-wrapper .links-row a { color: var(--accent-text); text-decoration: none; font-weight: 700; font-size: 11px; white-space: nowrap; padding: 2px 4px; border-radius: 6px; transition: background 0.2s ease; }
.copyright-wrapper .links-row a:hover { background: rgba(0,0,0,0.04); }
.copyright-wrapper .info-row { font-size: 10px; opacity: 0.7; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.mode-badge { font-size: 9px; font-weight: 800; color: var(--accent-contrast); background: var(--accent); padding: 1px 5px; border-radius: 4px; margin-left: 3px; display: inline-block; }
@keyframes titleRainbow { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
#homeTitleAnimated { background: linear-gradient(to right, #884499, #4455DD, #88DD44, #EE1166, #FF9900, #884499); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: titleRainbow 12s linear infinite; }
.dynamic-link-btn { width: 100%; margin-top: 8px; position: relative; overflow: hidden; height: 40px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.35); cursor: pointer; background: none !important; }
.dynamic-link-btn .slide-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; letter-spacing: 0.3px; pointer-events: none; }

<body>

<div class="app-container" id="container">
    <div id="main" class="content-wrapper"></div>
</div>

<div id="global-stats-modal" class="stats-modal">
    <div class="stats-card" style="height: 85vh;">
        <div class="stats-header" style="border-bottom: none; padding-bottom: 0; margin-bottom: 0;">
            <div class="stats-title">角色统计信息</div>
            <button class="btn-close-stats" onclick="closeStatsModal()">✕</button>
        </div>
        <div id="stats-tabs" class="stats-tabs"></div>
        <div id="stats-loading-text" style="text-align:center; padding: 20px 0; font-size:13px; color:var(--text-sub);">正在同步数据...</div>
        <div id="stats-render-body" class="stats-scroll-body" style="display:none;"></div>
        <div id="stats-footer" class="stats-footer" style="display:none;">累计已完成 <strong>0</strong> 次测试</div>
    </div>
</div>

<div id="announcement-modal" class="stats-modal">
    <div class="stats-card" style="height: auto; max-width: 400px;">
        <div class="stats-header" style="border-bottom: none; padding-bottom: 0; margin-bottom: 0;">
            <div class="stats-title">关于本测试</div>
            <button class="btn-close-stats" onclick="closeAnnouncement()">✕</button>
        </div>
        <div class="modal-notice-content">

// ============================================================
// 智能抽题引擎
// ============================================================
function getPrimaryDimension(question) {
    let maxW = 0, primary = null;
    for (const dim in question.weights) {
        if (question.weights[dim] > maxW) { maxW = question.weights[dim]; primary = dim; }
    }
    return primary;
}

function groupQuestionsByDimension(bank) {
    const groups = {};
    for (const dim in DIMENSION_CONFIG) groups[dim] = [];
    bank.forEach(q => { const p = getPrimaryDimension(q); if (p && groups[p]) groups[p].push(q); });
    return groups;
}

function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
}

function selectQuestions(totalQuestions, dimensionWeights, bank, minPerDimension) {
    const groups = groupQuestionsByDimension(bank);
    const dims = Object.keys(DIMENSION_CONFIG);
    const minPerDim = typeof minPerDimension === 'number' ? minPerDimension : 2;
    const totalWeight = dims.reduce((sum, d) => sum + (dimensionWeights[d] || 1.0), 0);
    const dimRatios = {};
    dims.forEach(d => { dimRatios[d] = (dimensionWeights[d] || 1.0) / totalWeight; });
    const dimCounts = {};
    let reserved = 0;
    dims.forEach(d => { const available = (groups[d] || []).length; const guaranteed = Math.min(minPerDim, available); dimCounts[d] = guaranteed; reserved += guaranteed; });
    const remaining = totalQuestions - reserved;
    if (remaining > 0) {
        const extraCounts = {}, extraRemainders = {};
        let extraAllocated = 0;
        dims.forEach(d => {
            const available = (groups[d] || []).length;
            const canAdd = available - dimCounts[d];
            const raw = dimRatios[d] * remaining;
            const floor = Math.min(Math.floor(raw), canAdd);
            extraCounts[d] = floor; extraRemainders[d] = raw - floor; extraAllocated += floor;
        });
        const extraRemaining = remaining - extraAllocated;
        const sortedByRemainder = dims.slice().filter(d => (groups[d] || []).length - dimCounts[d] - extraCounts[d] > 0).sort((a, b) => extraRemainders[b] - extraRemainders[a]);
        for (let i = 0; i < extraRemaining && i < sortedByRemainder.length; i++) extraCounts[sortedByRemainder[i]]++;
        dims.forEach(d => { dimCounts[d] += extraCounts[d] || 0; });
    }
    const selected = [];
    dims.forEach(d => { const pool = shuffleArray(groups[d] || []); const count = Math.min(dimCounts[d], pool.length); for (let i = 0; i < count; i++) selected.push(pool[i]); });
    if (selected.length < totalQuestions) {
        const selectedSet = new Set(selected);
        const supplement = shuffleArray(bank.filter(q => !selectedSet.has(q)));
        let idx = 0;
        while (selected.length < totalQuestions && idx < supplement.length) selected.push(supplement[idx++]);
    }
    return shuffleArray(selected);
}

function getAnimDurations() {
    const isReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (isReduced) return { pageOut: 0.01, pageIn: 0.01, modal: 0.01, bar: 0.01, swap: 0.01 };
    const isMobile = window.innerWidth < 480;
    return {
        pageOut: isMobile ? 0.18 : 0.22,
        pageIn: isMobile ? 0.2 : 0.25,
        modal: isMobile ? 0.35 : 0.5,
        bar: isMobile ? 0.5 : 0.75,
        swap: isMobile ? 0.8 : 1.05
    };
}

async function transition(renderFunc) {
    if (locking) return; locking = true;
    const dur = getAnimDurations();
    const tl = gsap.timeline();
    tl.to(container, { scale: 0.97, y: 4, autoAlpha: 0.7, duration: dur.pageOut, ease: "power2.in" }, 0);
    tl.to(main, { autoAlpha: 0, filter: "blur(8px)", y: 16, duration: dur.pageOut, ease: "power2.in" }, 0);
    tl.call(() => renderFunc());
    tl.to(container, { scale: 1, y: 0, autoAlpha: 1, duration: dur.pageIn, ease: "power3.out" });
    tl.to(main, { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: dur.pageIn, ease: "power3.out" }, "<");
    tl.call(() => { locking = false; });
}

function setAccentColor(hex) {
    document.documentElement.style.setProperty('--accent', hex);
    document.documentElement.style.setProperty('--accent-light', hex + '1a');
    const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
    document.documentElement.style.setProperty('--accent-r', r.toString());
    document.documentElement.style.setProperty('--accent-g', g.toString());
    document.documentElement.style.setProperty('--accent-b', b.toString());
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    document.documentElement.style.setProperty('--accent-contrast', lum > 0.55 ? '#1d1d1f' : '#ffffff');
    if (lum > 0.5) {
        const f = Math.min(0.65, 0.35 / (lum + 0.05));
        document.documentElement.style.setProperty('--accent-text', `#${Math.round(r*f).toString(16).padStart(2,'0')}${Math.round(g*f).toString(16).padStart(2,'0')}${Math.round(b*f).toString(16).padStart(2,'0')}`);
    } else {
        document.documentElement.style.setProperty('--accent-text', hex);
    }
}

function triggerSingleTransition() {
    if (singleAnimTween) singleAnimTween.kill();
    const dur = getAnimDurations().swap;
    singleAnimTween = gsap.delayedCall(2, () => {
        const btn = document.getElementById('dynamicSquareBtn');
        if (!btn) return;
        const first = btn.querySelector('.layer-first');
        const second = btn.querySelector('.layer-second');
        if (!first || !second) return;
        const tl = gsap.timeline();
        tl.to(first, { clipPath: "polygon(0 0, 15% 0, -15% 100%, 0 100%)", autoAlpha: 0.2, duration: dur, ease: "power3.inOut" }, 0);
        tl.to(second, { clipPath: "polygon(-20% 0, 120% 0, 120% 100%, -20% 100%)", autoAlpha: 1, duration: dur, ease: "power3.inOut" }, 0);
    });
}

function startTest(mode) {
    if (singleAnimTween) { singleAnimTween.kill(); singleAnimTween = null; }
    currentMode = mode;
    const config = TEST_CONFIG[mode] || TEST_CONFIG['快速'];
    const dimWeights = {};
    for (const d in DIMENSION_CONFIG) dimWeights[d] = DIMENSION_CONFIG[d].weight;
    questions = selectQuestions(config.totalQuestions, dimWeights, questionBank, config.minPerDimension);
    current = 0; history = []; startTime = Date.now(); _resultCache = null;
    clearInterval(timerInterval); timerInterval = setInterval(updateTimer, 1000);
    transition(renderQuestion);
}

    const el = document.getElementById('timer-val'); if (!el) return;

}

let bubbleDisplayPos = 2;
let sliderDragging = false;

function getThumbLeftPct(val) { return (val / 4) * 100; }
function updateTrackFill(val) { document.getElementById('iosSlider').style.setProperty('--slider-pct', getThumbLeftPct(val) + '%'); }

function updateThumbPosition(val, mode) {
    const thumb = document.getElementById('sliderThumb'); if (!thumb) return;
    thumb.style.setProperty('--thumb-pct', getThumbLeftPct(val) + '%');
    const isDrag = mode === 'drag';
    gsap.to(thumb, { scale: 1, duration: isDrag ? 0.12 : 0.18, ease: isDrag ? "back.out(1.2)" : "back.out(1.45)", overwrite: true });
}

function applyBubblePosition(pos, mode) {
    const bubble = document.getElementById('bubble'), slider = document.getElementById('iosSlider'), wrap = document.getElementById('sliderWrap');
    if (!bubble || !slider || !wrap) return;
    const rect = slider.getBoundingClientRect(), wrapRect = wrap.getBoundingClientRect();
    const rawLeft = (rect.left - wrapRect.left) + 12 + (pos / 4) * Math.max(rect.width - 24, 1);
    const clampedLeft = Math.max(bubble.getBoundingClientRect().width/2, Math.min(wrap.getBoundingClientRect().width - bubble.getBoundingClientRect().width/2, rawLeft));
    const isDrag = mode === 'drag';
    gsap.to(bubble, { left: clampedLeft, y: isDrag ? -3 : 0, scale: isDrag ? 1.06 : 1, duration: isDrag ? 0.18 : 0.52, ease: isDrag ? "back.out(1.2)" : "back.out(1.56)", overwrite: true });
}

function updateSliderBubble(val) {
    document.getElementById('bubble').innerText = scoreLabels[val];
    document.querySelectorAll('.slider-label-btn').forEach((btn, i) => btn.classList.toggle('active', i == val));
}

function initSliderUI(val) {
    bubbleDisplayPos = val;
    updateThumbPosition(val, 'snap');
    updateTrackFill(val);
    requestAnimationFrame(() => { applyBubblePosition(val, 'snap'); updateSliderBubble(val); });
}

function onSliderPointerDown() {
    sliderDragging = true;
    const v = parseInt(document.getElementById('iosSlider').value);
    updateThumbPosition(v, 'drag'); applyBubblePosition(v, 'drag');
}
function onSliderPointerUp() {
    sliderDragging = false;
    const v = parseInt(document.getElementById('iosSlider').value);
    updateThumbPosition(v, 'snap'); applyBubblePosition(v, 'snap');
}
function onSliderInput(el) {
    const v = parseInt(el.value); bubbleDisplayPos = v;
    updateThumbPosition(v, 'drag'); updateTrackFill(v);
    applyBubblePosition(v, 'drag'); updateSliderBubble(v);
}

function next() {
    if (locking) return;
    const val = parseInt(document.getElementById('iosSlider').value);
    history[current] = { val: val };
    current++;
    if (current < questions.length) transition(renderQuestion);
    else finish();
}

function handleBack() {
    if (locking) return;
    if (current === 0) { clearInterval(timerInterval); transition(init); }
    else { current--; transition(renderQuestion); }
}

    clearInterval(timerInterval);
    transition(renderResult);

            localStorage.setItem('persona_local_results', JSON.stringify(localResults));
        } catch(e) {}
    }, 100);

                <button class="btn-secondary" style="margin-top:0; margin-bottom:4px; background:var(--accent-light);" onclick="openStatsModal()">查看本地统计</button>
                <div class="action-row-split">
                    <button class="btn-primary" onclick="confirmRestart()">返回主页</button>
                    <button class="btn-share" onclick="share()">分享结果</button>
                </div>
            </div>
            ${getCopyrightHTML()}
        </div>
    `;
    const resultDisplay = main.querySelector('.result-display');
    if (resultDisplay) {
        gsap.from(resultDisplay.children, { y: 10, autoAlpha: 0, stagger: 0.04, duration: 0.35, ease: "power2.out" });
    }
}

function calculate() {
    if (_resultCache) return _resultCache;

    const dims = ["ECHO", "SPARK", "VEIL", "DREAM", "PULSE", "TUNE", "LIGHT", "DEPTH"];
    const CENTER = 5;
    const totalAnswers = history.length;
    const answerVals = history.map(h => h.val);
    const meanAns = answerVals.reduce((a,b)=>a+b, 0) / totalAnswers;
    const varianceAns = answerVals.reduce((sum, v)=> sum + (v - meanAns)*(v - meanAns), 0) / totalAnswers;
    const centerCount = answerVals.filter(v => v === 2).length;
    let confidence = 1.0;
    if (varianceAns === 0) { confidence = 0.15; }
    else { const neutralRatio = centerCount / totalAnswers; if (neutralRatio > 0.5) confidence -= (neutralRatio - 0.5) * 1.2; }
    confidence = Math.max(0.2, confidence);

    let totalDimWeights = { ECHO:0, SPARK:0, VEIL:0, DREAM:0, PULSE:0, TUNE:0, LIGHT:0, DEPTH:0 };
    let rawUserScores = { ECHO:0, SPARK:0, VEIL:0, DREAM:0, PULSE:0, TUNE:0, LIGHT:0, DEPTH:0 };
    history.forEach((h, idx) => {
        const q = questions[idx];
        const choiceWeight = scoreWeights[h.val];
        for (let d in q.weights) {
            const w = q.weights[d];
            rawUserScores[d] += choiceWeight * w;
            totalDimWeights[d] += Math.abs(w);
        }
    });

    const userVec = {};
    dims.forEach(d => {
        const maxPossible = totalDimWeights[d] * 2;
        if (maxPossible > 0) { userVec[d] = CENTER + (rawUserScores[d] / maxPossible) * CENTER; }
        else { userVec[d] = CENTER; }
        userVec[d] = CENTER + (userVec[d] - CENTER) * confidence;
    });

    const uVals = dims.map(d => userVec[d]);
    const uMean = uVals.reduce((a, b) => a + b, 0) / dims.length;
    let uVar = 0; dims.forEach(d => { const v = userVec[d] - uMean; uVar += v * v; });
    const uStd = Math.sqrt(uVar) || 1e-6;

    let rawResults = characters.map(c => {
        const cVals = dims.map(d => c.match[d] ?? CENTER);
        const cMean = cVals.reduce((a, b) => a + b, 0) / dims.length;
        let cVar = 0; cVals.forEach(v => { const x = v - cMean; cVar += x * x; });
        const cStd = Math.sqrt(cVar) || 1e-6;
        let pearson = 0;
        let weightedDistSq = 0;
        let totalFocusWeight = 0;
        dims.forEach(d => {
            const u = userVec[d];
            const t = c.match[d] ?? CENTER;
            pearson += ((u - uMean) / uStd) * ((t - cMean) / cStd);
            const deviation = Math.abs(t - CENTER);
            const focusWeight = 1.0 + Math.pow(deviation / 2.5, 2);
            weightedDistSq += (u - t) * (u - t) * focusWeight;
            totalFocusWeight += focusWeight;
        });
        pearson /= dims.length;
        const shapeSim = (pearson + 1) / 2;
        const avgWeightedDist = Math.sqrt(weightedDistSq / totalFocusWeight);
        const euclideanSim = 1 - (avgWeightedDist / 10);
        const rawSim = 0.55 * euclideanSim + 0.45 * shapeSim;
        return { ...c, rawSim, characterVariance: cVar / dims.length };
    });

    rawResults.forEach(r => { r.compSim = r.rawSim; });

    rawResults.sort((a, b) => b.compSim - a.compSim);
    const topRaw = rawResults[0].compSim;
    const secondRaw = rawResults[1]?.compSim ?? topRaw - 0.01;
    const spread = Math.min(1, (topRaw - secondRaw) / 0.12);
    const baseTopMatch = 85 + spread * 12;
    const topMatch = Math.round(baseTopMatch * (0.3 + confidence * 0.7));
    const curve = 4 + (1 - spread) * 3;
    let finalResults = rawResults.map((r, idx) => {
        if (idx === 0) return { ...r, match: topMatch };
        const ratio = topRaw > 0 ? r.compSim / topRaw : 0;
        const match = Math.round(topMatch * Math.pow(Math.max(ratio, 0), curve));
        return { ...r, match: Math.min(97, Math.max(1, match)) };
    });
    _resultCache = finalResults;
    return finalResults;
}

function confirmRestart() { if (confirm('要返回主页重新选择模式吗？')) { transition(init); } }
function share() {
    const top = calculate()[0];
    const text = `我在世界计划人格测试[${currentMode}模式]中最像「${top.name}」，契合度${top.match}%！快来测测看吧！`;
    navigator.clipboard.writeText(text).then(()=>alert('结果已复制到剪贴板！')).catch(()=>alert(text));
}

/* ── 本地统计弹窗 ── */
function openStatsModal() {
    const modal = document.getElementById('global-stats-modal'), loadingText = document.getElementById('stats-loading-text'), renderBody = document.getElementById('stats-render-body'), tabsEl = document.getElementById('stats-tabs');
    loadingText.style.display = 'block'; renderBody.style.display = 'none'; tabsEl.innerHTML = '';
    document.getElementById('stats-footer').style.display = 'none';
    animateModalOpen(modal);

    /* 从 localStorage 读取本地结果 */
    var localResults = [];
    try { localResults = JSON.parse(localStorage.getItem('persona_local_results') || '[]'); } catch(e) {}
    
    loadingText.style.display = 'none'; renderBody.style.display = 'flex';
    document.getElementById('stats-footer').style.display = 'block';

    const unitList = ['Leo/need', 'MORE MORE JUMP!', 'Vivid BAD SQUAD', 'Wonderlands×Showtime', '25时，Nightcord见。'];
    const unitLogos = {
        "Leo/need": "https://pan.chaer.xyz/f/mpCd/ln.webp",
        "MORE MORE JUMP!": "https://pan.chaer.xyz/f/yDI9/mmj.webp",
        "Vivid BAD SQUAD": "https://pan.chaer.xyz/f/4YfW/vbs.webp",
        "Wonderlands×Showtime": "https://pan.chaer.xyz/f/M1cz/wxs.webp",
        "25时，Nightcord见。": "https://pan.chaer.xyz/f/V9So/n25.webp"
    };

    /* 计算各角色出现次数 */
    const rawData = {};
    characters.forEach(function(c) { rawData[c.name] = 0; });
    localResults.forEach(function(r) { if (rawData[r.name] !== undefined) rawData[r.name]++; });

    const nameToUnit = {};
    characters.forEach(function(c) { nameToUnit[c.name] = c.unit; });

    function buildLeaderboardData(filterUnit) {
        var list = [];
        characters.forEach(function(c) {
            if (filterUnit && c.unit !== filterUnit) return;
            list.push({ name: c.name, unit: c.unit, count: rawData[c.name] || 0 });
        });
        list.sort(function(a, b) { return b.count - a.count; });
        var maxCount = list.length > 0 ? list[0].count : 1;
        if (maxCount < 1) maxCount = 1;
        return { items: list, maxCount: maxCount };
    }

    function renderLeaderboard(filterUnit) {
        var data = buildLeaderboardData(filterUnit);
        var items = data.items, maxCount = data.maxCount;
        var totalCount = 0;
        items.forEach(function(i) { totalCount += i.count; });
        var html = '<div class="stats-leaderboard">';
        for (var i = 0; i < items.length; i++) {
            var item = items[i];
            var rankClass = '';
            if (i === 0) rankClass = ' top1';
            else if (i === 1) rankClass = ' top2';
            else if (i === 2) rankClass = ' top3';
            html += '<div class="lb-row' + rankClass + '">';
            html += '<div class="lb-rank">' + (i + 1) + '</div>';
            html += '<span class="lb-unit-tag"><img src="' + unitLogos[item.unit] + '" alt="' + item.unit + '"></span>';
            html += '<div class="lb-name">' + item.name + '</div>';
            html += '<div class="lb-bar-track"><div class="lb-bar-fill" id="lbf-' + (i + 1) + '" style="width:0%"></div></div>';
            html += '</div>';
        }
        html += '</div>';
        renderBody.innerHTML = html;
        document.getElementById('stats-footer').innerHTML = '累计已完成 <strong>' + totalCount + '</strong> 次测试（本地）';

        _statsAnimSeq++;
        var bars = items.map(function(item, idx) { return document.getElementById('lbf-' + (idx + 1)); }).filter(Boolean);
        var pcts = items.map(function(item) { return Math.max(Math.round((item.count / maxCount) * 100), 2); });
        var barDur = getAnimDurations().bar;
        gsap.to(bars, { width: function(i) { return pcts[i] + "%"; }, duration: barDur, ease: "power4.out", stagger: { each: 0.04, from: "start" } });
    }

    /* Build tabs */
    var allTab = document.createElement('div');
    allTab.className = 'stats-tab active';
    allTab.textContent = '全角色';
    allTab.setAttribute('data-unit', '');
    allTab.addEventListener('click', function() {
        tabsEl.querySelectorAll('.stats-tab').forEach(function(t) { t.classList.remove('active'); });
        allTab.classList.add('active');
        renderLeaderboard('');
    });
    tabsEl.appendChild(allTab);

    unitList.forEach(function(unitName) {
        var tab = document.createElement('div');
        tab.className = 'stats-tab';
        tab.textContent = unitName;
        tab.setAttribute('data-unit', unitName);
        tab.addEventListener('click', function() {
            tabsEl.querySelectorAll('.stats-tab').forEach(function(t) { t.classList.remove('active'); });
            tab.classList.add('active');
            renderLeaderboard(unitName);
        });
        tabsEl.appendChild(tab);
    });

    /* 拖拽初始化 */
    initStatsTabsDrag(tabsEl);

    renderLeaderboard('');
}

function closeStatsModal() {
    _statsAnimSeq++;
    animateModalClose(document.getElementById('global-stats-modal'));
}

/* ── 统计 Tab 水平拖拽引擎 ── */
function initStatsTabsDrag(tabsEl) {
    var state = { startX: -1, startScroll: 0, lastX: 0, lastTime: 0, vel: 0, dragged: false, anim: null };
    function killAnim() { if (state.anim) { state.anim.kill(); state.anim = null; } }
    var maxW = function() { return Math.max(0, tabsEl.scrollWidth - tabsEl.clientWidth); };
    function onDown(e) { state.dragged = false; state.startX = e.clientX; state.lastX = e.clientX; state.startScroll = tabsEl.scrollLeft; state.lastTime = performance.now(); state.vel = 0; killAnim(); }
    function onMove(e) {
        if (state.startX < 0) return;
        var dx = e.clientX - state.startX;
        if (Math.abs(dx) > 5) state.dragged = true;
        if (!state.dragged) return;
        e.preventDefault();
        var now = performance.now(), dt = now - state.lastTime, px = e.clientX - state.lastX;
        if (dt > 0) state.vel = (px / dt) * 16;
        state.lastX = e.clientX; state.lastTime = now;
        tabsEl.scrollLeft = state.startScroll - dx;
    }
    function onUp() {
        if (state.startX < 0) return;
        if (state.dragged && Math.abs(state.vel) > 0.3) {
            var target = tabsEl.scrollLeft - state.vel * 10, mw = maxW();
            state.anim = gsap.to(tabsEl, { scrollLeft: Math.max(0, Math.min(target, mw)), duration: Math.min(Math.abs(state.vel) * 0.06, 0.5), ease: "power4.out", overwrite: true });
        }
        state.startX = -1;
    }
    tabsEl.addEventListener('pointerdown', onDown);
    tabsEl.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', function() { state.startX = -1; state.dragged = false; });
    tabsEl.addEventListener('click', function(e) { if (state.dragged) { e.stopPropagation(); e.preventDefault(); } state.dragged = false; }, true);
    tabsEl.addEventListener('wheel', function(e) {
        if (e.deltaY === 0) return;
        e.preventDefault(); killAnim();
        var target = tabsEl.scrollLeft + e.deltaY * 1.2, mw = maxW();
        state.anim = gsap.to(tabsEl, { scrollLeft: Math.max(0, Math.min(target, mw)), duration: 0.35, ease: "power3.out", overwrite: true });
    }, { passive: false });
}
