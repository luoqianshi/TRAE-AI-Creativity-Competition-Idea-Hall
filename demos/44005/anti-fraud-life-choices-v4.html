function doAct(action){
  let ev=S.curEv;if(!ev||ev.dual)return;
  let ok=false;
  if(ev.ca==="call_bank"||ev.ca==="call_teacher"||ev.ca==="call_boss"||ev.ca==="call_parents"||ev.ca==="call_edu"||ev.ca==="call_shebao"||ev.ca==="check_credit"||ev.ca==="verify_agent"){
    ok=(action==="call_correct");
  }else if(ev.ca==="check_sms"){
    ok=(action==="call_bank"||action==="ignore");
  }else{ok=(action===ev.ca||(ev.ca==="believe"&&action==="believe")||(ev.ca==="ignore"&&action==="ignore"))}
  if(action==="click_link")ok=false;
  processResult(ev,ok,action);

}

    $g("tip-bar").innerHTML='<div class="fbub neut">'+ev.fbW+"</div>";
    showEmo(ev.emoA||"😔",ev.fbW,"orange");
  }}
  $g("tip-bar").innerHTML+='<div class="tm">💡 '+ev.tip+"</div>";
  S.results.push({ev,action:act,correct:ok});
}

function afterEvent(){
  S.evIdx++;S.curEv=null;S.dualDone=false;S.dualActive=false;updHUD();
  // Reset UI
  let ms=$g("main-monitor").querySelector(".main-screen");
  if(ms)ms.style.boxShadow="";
  let ps=$g("phone-scr");if(ps)ps.style.boxShadow="";
  $g("pdot-sms").style.display="none";$g("pdot-wx").style.display="none";
  spTab("contacts");
  $g("ms-chat").innerHTML='<div style="text-align:center;color:#b0b3b8;padding:40px;font-size:.7rem">📭 选择群聊查看消息</div>';
  $g("btm-bar").style.display="none";
  setTimeout(()=>{$g("tip-bar").innerHTML="";if(S.evIdx<R[S.route].ev.length)trigEv();else endG();},1800);
}

/* ==================== TRIGGER EVENT ==================== */
function trigEv(){
  if(S.evIdx>=R[S.route].ev.length){endG();return}
  let ev=R[S.route].ev[S.evIdx];S.curEv=ev;
  $g("lp-badge").style.display="none";
  $g("ph-closed-badge").style.display="none";
  if(ev.dual){rndrDual(ev)}else{ev.platform=ev.g?"computer":"phone";rndrSingle(ev)}
}
function rndrSingle(ev){
  if(ev.platform==="computer"){
    // Switch to correct monitor group
    let tabs=document.querySelectorAll(".ms-tab");
    tabs.forEach((t,i)=>{if(t.textContent===ev.g){swMSGroup(ev.g,i)}});
    handleMonClick();
  }else{
    // Phone event - DON'T auto-open, user clicks to expand
    if(ev.ca&&(ev.ca.includes("sms")||ev.ca.includes("check_sms")||ev.ca.includes("link"))){spTab("sms");}
    else{spTab("wechat");}
    // Show bottom bar action buttons based on event type
    if(ev.ca&&(ev.ca.indexOf("call_")===0||ev.ca==="check_credit"||ev.ca==="verify_agent"||ev.ca==="check_sms")){
      $g("btm-bar").style.display="flex";
      $g("btm-bar").innerHTML='<button class="cbtn pri" onclick="$g(\'phone-device\').classList.add(\'open\');S.phoneOpen=true;spTab(\'contacts\')">📞 打电话确认</button><button class="cbtn war" onclick="doAct(\'ignore\')">🚫 忽略</button>';
    }else if(ev.ca==="believe"||ev.ca==="ignore"||ev.ca==="react"){
      $g("btm-bar").style.display="flex";
      $g("btm-bar").innerHTML='<button class="cbtn pri" onclick="doAct(\'believe\')">✅ 相信/操作</button><button class="cbtn war" onclick="doAct(\'ignore\')">🚫 怀疑/忽略</button>';
    }
  }
  // Update laptop notification
  if(ev.platform==="computer"){
    $g("lp-content").innerHTML='<div style="color:#e8963e;font-size:.55rem;text-align:center;padding:15px">📨 收到新消息！<br>请查看大屏幕</div>';
    $g("lp-badge").style.display="block";
  }else{
    $g("lp-content").innerHTML='<div style="color:#1877f2;font-size:.55rem;text-align:center;padding:15px">📱 手机有消息<br>点击手机查看</div>';
  }
  $g("ph-closed-badge").style.display="block";
  $g("tip-bar").innerHTML='<div style="font-size:.62rem;color:var(--accent)">💡 查看消息并做出判断</div>';
}
function rndrDual(ev){
  let cg=ev.g||"",cg2=ev.g2||"";
  if(cg||cg2){
    let tabs=document.querySelectorAll(".ms-tab");
    tabs.forEach((t,i)=>{if(t.textContent===cg||t.textContent===cg2){swMSGroup(t.textContent,i)}});
  }
  // Phone-only dual: render both sides in WeChat
  if(!cg&&!cg2){spTab("wechat")}
  // Store dual state so renderWX can show both sides
  S.dualActive=true;
  $g("lp-content").innerHTML='<div style="color:#e8738a;font-size:.55rem;text-align:center;padding:15px">⚡ 双线抉择！<br>查看屏幕和手机</div>';
  $g("lp-badge").style.display="block";
  $g("ph-closed-badge").style.display="block";
  $g("tip-bar").innerHTML='<div style="font-size:.62rem;color:var(--love)">⚡ 双线抉择！电脑和手机同时出现消息，只能选一个处理</div>';
  S.dualDone=false;
}

/* ==================== ENDING ==================== */
function endG(){
  $g("btm-bar").style.display="none";$g("tip-bar").innerHTML="";
  $g("lp-content").innerHTML='<div style="text-align:center;padding:20px;color:#999">待机中...</div>';
  $g("lp-badge").style.display="none";
  $g("ph-closed-badge").style.display="none";
  $g("phone-device").classList.remove("open");S.phoneOpen=false;
  let data=R[S.route],c=S.results.filter(x=>x.correct).length;
  let rank,rc;if(c>=5){rank="🏅 反诈大师";rc="color:#e8963e"}else if(c>=4){rank="🛡️ 反诈高手";rc="color:#5b9bd5"}else if(c>=2){rank="🔰 反诈学徒";rc="color:#4caf50"}else{rank="📚 反诈新手";rc="color:#8c7b6b"}
  $g("ests").innerHTML='<div class="es"><div class="esv">¥'+S.bal.toLocaleString()+'</div><div class="esl">余额</div></div><div class="es"><div class="esv">'+S.score+'</div><div class="esl">得分</div></div><div class="es"><div class="esv">'+Math.round(c/R[S.route].ev.length*100)+'%</div><div class="esl">正确率</div></div><div class="es"><div class="esv" style="'+rc+'">'+rank+'</div><div class="esl">称号</div></div>';
  showScr("end");
  let tw=$g("tw-wrap");tw.innerHTML="";let txt=data.end(S,S.results),lines=txt.split("|").filter(l=>l.trim());
  let i=0;function showL(){if(i>=lines.length){spawnStickies();return}
    let d=document.createElement("div");d.className="tw-line";d.textContent=lines[i];d.style.animationDelay=(i*1.1)+"s";tw.appendChild(d);i++;setTimeout(showL,1100)}
  showL();
  function spawnStickies(){
    let wall=$g("swall"),msgs=["守住钱包💰","多陪家人❤️","保持警惕👀","珍惜当下🌟","相信直觉🛡️","爱自己🧘","勇敢说不✋","活出真我🕊️","保护隐私🔒","理性判断🧠","温馨陪伴🏡","光明未来🌈"];
    let cols=["y","p","b","g","o","v"];
    for(let j=0;j<18;j++){setTimeout(()=>{let s=document.createElement("div");s.className="sticky "+cols[Math.floor(Math.random()*6)];s.textContent=msgs[Math.floor(Math.random()*msgs.length)];s.style.left=(3+Math.random()*80)+"%";s.style.top=(2+Math.random()*85)+"%";s.style.transform="rotate("+(-10+Math.random()*20)+"deg)";wall.appendChild(s)},j*180)}
  }
}

function replay(){start(S.route)}
function quitG(){if(confirm("确定退出？进度不保存。")){showScr("start");$g("phone-device").classList.remove("open");S.phoneOpen=false}}
function goStart(){showScr("start");$g("phone-device").classList.remove("open");S.phoneOpen=false}


/* ==================== DRAG TO MOVE (v4 - laptop + phone) ==================== */
(function(){
  var dragEl=null,offX=0,offY=0,origLeft=0,origTop=0,isDragging=false;
  var bound={minX:0,minY:0,maxX:0,maxY:0};

  function updateBounds(el){
    var office=document.querySelector(".office");
    if(office){
      var r=office.getBoundingClientRect();
      var er=el.getBoundingClientRect();
      bound.minX=0;bound.minY=0;
      bound.maxX=r.width-er.width;bound.maxY=r.height-er.height;
    }
  }

  function initDrag(id){
    var el=$g(id);if(!el)return;
    // Read current position and convert to left/top
    var s=getComputedStyle(el);
    var cr=el.getBoundingClientRect();
    var pr=el.parentElement.getBoundingClientRect();
    if(!el.style.left||el.style.left==="auto"){
      el.style.left=(cr.left-pr.left)+"px";el.style.top=(cr.top-pr.top)+"px";
    }
    el.style.right="auto";el.style.bottom="auto";

    el.addEventListener("mousedown",function(e){
      // Don't start drag if clicking on interactive child elements
      if(e.target.closest(".phone-tab")||e.target.closest(".ms-tab")||e.target.closest(".citem")||
         e.target.closest(".sitem")||e.target.closest(".witem")||e.target.closest(".cd-overlay")||
         e.target.closest(".ms-bub")||e.target.closest(".cdbtn")||e.target.closest(".ci-call")||
         e.target.closest("button")||e.target.tagName==="BUTTON"||e.target.closest(".phone-close-btn"))return;
      // For phone: only allow drag when CLOSED (open phone is for touching content)
      if(id==="phone-device"&&el.classList.contains("open"))return;
      // Don't drag when clicking screen internals
      if(e.target.closest(".main-screen")||e.target.closest(".phone-scr")||e.target.closest(".laptop-screen"))return;
      e.preventDefault();
      updateBounds(el);
      var er=el.getBoundingClientRect();
      offX=e.clientX-er.left;offY=e.clientY-er.top;
      origLeft=parseInt(el.style.left);origTop=parseInt(el.style.top);
      if(isNaN(origLeft))origLeft=er.left-parseInt(getComputedStyle(el.parentElement).paddingLeft||0);
      if(isNaN(origTop))origTop=er.top-parseInt(getComputedStyle(el.parentElement).paddingTop||0);
      dragEl=el;isDragging=false;
      el.style.zIndex="20";el.style.transition="none";
      el.style.cursor="grabbing";
    });
  }

  initDrag("laptop");initDrag("phone-device");

  document.addEventListener("mousemove",function(e){
    if(!dragEl)return;
    var dx=e.clientX-offX-origLeft,dy=e.clientY-offY-origTop;
    if(Math.abs(dx)>3||Math.abs(dy)>3)isDragging=true;
    if(!isDragging)return;
    var nx=e.clientX-offX,ny=e.clientY-offY;
    if(nx<bound.minX)nx=bound.minX;if(ny<bound.minY)ny=bound.minY;
    if(nx>bound.maxX)nx=bound.maxX;if(ny>bound.maxY)ny=bound.maxY;
    dragEl.style.left=nx+"px";dragEl.style.top=ny+"px";
  });

  document.addEventListener("mouseup",function(){
    if(!dragEl)return;
    if(isDragging){
      // Block the click event that follows a drag (prevents phone toggle after drag)
      setTimeout(function(){S.dragJustHappened=false},50);
      S.dragJustHappened=true;
    }
    dragEl.style.zIndex=dragEl.id==="laptop"?"6":"6";
    dragEl.style.transition="";dragEl.style.cursor="";
    dragEl=null;isDragging=false;
  });

  // Touch support
  document.addEventListener("touchmove",function(e){
    if(!dragEl||!e.touches[0])return;
    var dx=e.touches[0].clientX-offX-origLeft,dy=e.touches[0].clientY-offY-origTop;
    if(Math.abs(dx)>8||Math.abs(dy)>8)isDragging=true;
    if(!isDragging)return;
    e.preventDefault();
    var nx=e.touches[0].clientX-offX,ny=e.touches[0].clientY-offY;
    if(nx<bound.minX)nx=bound.minX;if(ny<bound.minY)ny=bound.minY;
    if(nx>bound.maxX)nx=bound.maxX;if(ny>bound.maxY)ny=bound.maxY;
    dragEl.style.left=nx+"px";dragEl.style.top=ny+"px";
  },{passive:false});
})();

showScr("start");

</script>
