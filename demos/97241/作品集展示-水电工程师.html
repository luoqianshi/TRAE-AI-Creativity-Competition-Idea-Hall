<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张德海作品集展示</title>
    <link rel="dns-prefetch" href="https://pic1.imgdb.cn">
    <link rel="preconnect" href="https://pic1.imgdb.cn" crossorigin>
    <meta name="theme-color" content="#1a2a6c">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #1fb29c, #1a2a6c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 28px 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3rem;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 30px auto 40px;
            padding: 0 20px;
        }

        .category-btn {
            padding: 12px 28px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(79, 172, 254, 0.5);
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            font-weight: 600;
            color: #e0e0e0;
        }

        .category-btn:hover,
        .category-btn.active {
            background: rgba(79, 172, 254, 0.7);
            color: #fff;
            transform: translateY(-2px);
            border-color: transparent;
        }

        .section-title {
            grid-column: 1 / -1;
            font-size: 1.4rem;
            font-weight: 700;
            color: #4facfe;
            padding: 8px 0 4px;
            border-bottom: 2px solid rgba(79, 172, 254, 0.3);
            margin-top: 10px;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
            gap: 32px;
            padding: 20px;
        }

        .gallery-item {
            display: flex;
            flex-direction: column;
            background: rgba(30, 30, 50, 0.7);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            content-visibility: auto;
        }

        .gallery-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
        }

        .img-wrap {
            position: relative;
            width: 100%;
            line-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 140px;
            cursor: zoom-in;
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.08), rgba(0, 242, 254, 0.08));
        }

        .img-wrap.loading {
            aspect-ratio: 16 / 10;
        }

        .gallery-img {
            width: 100%;
            height: auto;
            max-height: min(58vw, 380px);
            object-fit: contain;
            display: block;
            vertical-align: bottom;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-img.loaded {
            opacity: 1;
        }

        .img-skeleton {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,
                rgba(255,255,255,0.04) 25%,
                rgba(255,255,255,0.1) 50%,
                rgba(255,255,255,0.04) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
        }

        .img-wrap.loaded .img-skeleton {
            display: none;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 底部单行：分类（小字靠左）+ 名称（大字靠右） */
        .item-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(20, 20, 40, 0.85);
            white-space: nowrap;
        }

        .item-category {
            flex-shrink: 0;
            font-size: 0.72rem;
            color: #8ec8ff;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .item-title {
            flex: 1;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        footer {
            text-align: center;
            padding: 30px;
            margin-top: 40px;
            color: #aaa;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
        }

        /* 点击放大查看 */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                     max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            background: rgba(0, 0, 0, 0.92);
            cursor: zoom-out;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.22s ease, visibility 0.22s;
            -webkit-tap-highlight-color: transparent;
        }

        .lightbox.open {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-inner {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: min(96vw, 1400px);
            height: min(92vh, 900px);
            max-height: min(92vh, 900px);
            cursor: default;
        }

        .lightbox-info {
            flex-shrink: 0;
            width: 100%;
            padding-bottom: 4px;
            z-index: 2;
        }

        .lightbox-viewport {
            position: relative;
            flex: 1;
            min-height: 0;
            background: rgba(10, 10, 25, 0.6);
            border-radius: 8px;
            overflow: hidden;
        }

        .lightbox-stage {
            position: absolute;
            inset: 0;
            bottom: 25%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 0;
            padding: 4px 8px;
            overflow: hidden;
        }

        .lightbox-img {
            flex-shrink: 1;
            min-height: 0;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            cursor: default;
        }

        .lightbox-nav-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 25%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25%;
            min-height: 0;
        }

        .lightbox-nav {
            flex-shrink: 0;
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            font-size: 1.75rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, opacity 0.2s, transform 0.2s;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .lightbox-nav:hover:not(:disabled) {
            background: rgba(79, 172, 254, 0.75);
            transform: scale(1.06);
        }

        .lightbox-nav:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .lightbox-hint {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.82rem;
            pointer-events: none;
            white-space: nowrap;
        }

        body.lightbox-open {
            overflow: hidden;
        }

        @media (min-width: 769px) {
            .gallery-img.loaded {
                max-height: min(42vh, 460px);
            }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            body { padding: 12px; }
            .gallery {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 12px;
            }
            .gallery-img.loaded {
                max-height: min(62vw, 320px);
            }
            .item-title { font-size: 1rem; }
            .categories { gap: 8px; margin: 20px auto 28px; }
            .category-btn { padding: 10px 18px; font-size: 0.9rem; }
            .lightbox-inner {
                height: min(88vh, 820px);
                max-height: min(88vh, 820px);
            }
            .lightbox-nav {
                width: 40px;
                height: 40px;
                font-size: 1.5rem;
            }
            .lightbox-info .item-title { font-size: 1rem; }
        }

        @media (min-width: 1200px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            }
            .gallery-img.loaded {
                max-height: min(38vh, 500px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>张德海的作品集</h1>
        </header>

        <div class="categories" id="categories">
            <button class="category-btn active" data-category="all">全部</button>
            <button class="category-btn" data-category="CAD">CAD</button>
            <button class="category-btn" data-category="BIM">BIM</button>
            <button class="category-btn" data-category="SIM">仿真分析</button>
            <button class="category-btn" data-category="GIS">GIS</button>
            <button class="category-btn" data-category="BS">毕业设计</button>
            <button class="category-btn" data-category="PY">Python应用</button>
        </div>

        <div class="gallery" id="gallery"></div>

        <footer>
            <p>© 张德海的作品集展示</p>
        </footer>
    </div>

    <script>
        /* 按指定顺序与分类排列 */
        const CATEGORY_ORDER = ['CAD', 'BIM', 'SIM', 'GIS', 'BS', 'PY'];

        const CATEGORY_LABELS = {
            CAD: 'CAD',
            BIM: 'BIM',
            SIM: '仿真分析',
            GIS: 'GIS',
            BS: '毕业设计',
            PY: 'Python应用'
        };

        const imageData = [
            /* CAD */
            { url: 'https://pic1.imgdb.cn/item/691c50e93203f7be001394e4.jpg', title: '水电站制图', category: 'CAD' },
            { url: 'https://pic1.imgdb.cn/item/6a316f10b67c7e4f4a870b6e.jpg', title: '板平面配筋图', category: 'CAD' },
            { url: 'https://pic1.imgdb.cn/item/6a316f33b67c7e4f4a870b7a.jpg', title: '次梁钢筋表', category: 'CAD' },
            { url: 'https://pic1.imgdb.cn/item/69538dda44dc06e5053c7c1c.jpg', title: '集水区标记', category: 'CAD' },
            /* BIM */
            { url: 'https://pic1.imgdb.cn/item/6851313558cb8da5c8552b0d.jpg', title: '水闸', category: 'BIM' },
            { url: 'https://pic1.imgdb.cn/item/6851313658cb8da5c8552b10.jpg', title: '溢洪道', category: 'BIM' },
            { url: 'https://pic1.imgdb.cn/item/6a316f91b67c7e4f4a870b9a.jpg', title: '倒虹吸', category: 'BIM' },
            { url: 'https://pic1.imgdb.cn/item/6851313658cb8da5c8552b0f.jpg', title: '14届国赛', category: 'BIM' },
            /* 仿真分析 */
            { url: 'https://pic1.imgdb.cn/item/6a316fe0b67c7e4f4a870bb8.png', title: '大坝地震损伤分析', category: 'SIM' },
            { url: 'https://pic1.imgdb.cn/item/6a316fefb67c7e4f4a870bbf.png', title: '边坡稳定分析', category: 'SIM' },
            { url: 'https://pic1.imgdb.cn/item/6a31700ab67c7e4f4a870bcf.png', title: '钢架桥挠度分析', category: 'SIM' },
            /* GIS */
            { url: 'https://pic1.imgdb.cn/item/69d5258bcfae5fcb267b029e.png', title: '符号化制图', category: 'GIS' },
            { url: 'https://pic1.imgdb.cn/item/685139bc58cb8da5c8554cb6.png', title: '地理配准', category: 'GIS' },
            { url: 'https://pic1.imgdb.cn/item/685138ed58cb8da5c8554b84.png', title: '扫描矢量化', category: 'GIS' },
            { url: 'https://pic1.imgdb.cn/item/6851338358cb8da5c8553467.png', title: '明暗等高线', category: 'GIS' },
            { url: 'https://pic1.imgdb.cn/item/685133a658cb8da5c85534c4.png', title: '水文分析', category: 'GIS' },
            /* 毕业设计 */
            { url: 'https://pic1.imgdb.cn/item/6a31719bb67c7e4f4a870d2a.png', title: '整体布局', category: 'BS' },
            { url: 'https://pic1.imgdb.cn/item/6a3171adb67c7e4f4a870d37.png', title: '洪水预报', category: 'BS' },
            { url: 'https://pic1.imgdb.cn/item/6a3171b0b67c7e4f4a870d3c.png', title: '淹没分析', category: 'BS' },
            { url: 'https://pic1.imgdb.cn/item/6a3171b0b67c7e4f4a870d3e.png', title: '调洪演算', category: 'BS' },
            /* Python应用 */
            { url: 'https://pic1.imgdb.cn/item/6a31724ab67c7e4f4a870da9.png', title: 'GitHub开源', category: 'PY' },
            { url: 'https://pic1.imgdb.cn/item/691c5c5f3203f7be0013b101.png', title: '谢尔曼单位线', category: 'PY' },
            { url: 'https://pic1.imgdb.cn/item/691c5c5f3203f7be0013b100.png', title: '瞬时单位线', category: 'PY' },
            { url: 'https://pic1.imgdb.cn/item/691c5c5e3203f7be0013b0fe.png', title: '马斯京根法', category: 'PY' }
        ];

        const EAGER_COUNT = 8;

        const imageCache = new Set();
        let lightboxEl = null;
        let galleryClickBound = false;
        let lightboxItems = [];
        let lightboxIndex = 0;

        function injectPreloadHints() {
            imageData.slice(0, EAGER_COUNT).forEach((item, i) => {
                const link = document.createElement('link');
                link.rel = 'preload';
                link.as = 'image';
                link.href = item.url;
                if (i < 3) link.setAttribute('fetchpriority', 'high');
                document.head.appendChild(link);
            });
        }

        function preloadImage(url) {
            if (imageCache.has(url)) return Promise.resolve();
            return new Promise(resolve => {
                const img = new Image();
                img.onload = img.onerror = () => { imageCache.add(url); resolve(); };
                img.src = url;
            });
        }

        function preloadBatch(urls) {
            return Promise.all(urls.map(preloadImage));
        }

        function preloadRemainingImages() {
            const remaining = imageData.slice(EAGER_COUNT).map(i => i.url).filter(u => !imageCache.has(u));
            if (!remaining.length) return;
            const schedule = window.requestIdleCallback || ((fn) => setTimeout(fn, 50));
            let idx = 0;
            const BATCH = 4;
            function loadNext() {
                const batch = remaining.slice(idx, idx + BATCH);
                if (!batch.length) return;
                preloadBatch(batch);
                idx += BATCH;
                schedule(loadNext);
            }
            schedule(loadNext);
        }

        function preloadLightboxNearby() {
            if (!lightboxItems.length) return;
            const range = 3;
            const urls = [];
            for (let i = Math.max(0, lightboxIndex - range); i <= Math.min(lightboxItems.length - 1, lightboxIndex + range); i++) {
                if (i !== lightboxIndex && !imageCache.has(lightboxItems[i].url)) {
                    urls.push(lightboxItems[i].url);
                }
            }
            if (urls.length) preloadBatch(urls);
        }

        function getVisibleGalleryItems() {
            return [...document.querySelectorAll('#gallery .gallery-item')].map(item => {
                const img = item.querySelector('.gallery-img');
                return {
                    url: img.dataset.fullUrl || img.src,
                    title: item.querySelector('.item-title').textContent,
                    category: item.querySelector('.item-category').textContent
                };
            });
        }

        function getLightbox() {
            if (lightboxEl) return lightboxEl;
            const el = document.createElement('div');
            el.className = 'lightbox';
            el.setAttribute('role', 'dialog');
            el.setAttribute('aria-modal', 'true');
            el.setAttribute('aria-label', '图片放大查看');
            el.innerHTML = `
                <div class="lightbox-inner">
                    <div class="lightbox-viewport">
                        <div class="lightbox-stage">
                            <div class="item-info lightbox-info">
                                <span class="item-category"></span>
                                <span class="item-title"></span>
                            </div>
                            <img class="lightbox-img" alt="">
                        </div>
                        <div class="lightbox-nav-bar">
                            <button type="button" class="lightbox-nav lightbox-prev" aria-label="上一张">&#8249;</button>
                            <button type="button" class="lightbox-nav lightbox-next" aria-label="下一张">&#8250;</button>
                        </div>
                    </div>
                </div>
                <span class="lightbox-hint">点击空白处关闭 · 下方按钮切换</span>
            `;
            el.addEventListener('click', closeLightbox);
            el.querySelector('.lightbox-inner').addEventListener('click', (e) => e.stopPropagation());
            el.querySelector('.lightbox-prev').addEventListener('click', (e) => {
                e.stopPropagation();
                navigateLightbox(-1);
            });
            el.querySelector('.lightbox-next').addEventListener('click', (e) => {
                e.stopPropagation();
                navigateLightbox(1);
            });
            document.body.appendChild(el);
            lightboxEl = el;
            return el;
        }

        function updateLightboxView() {
            const item = lightboxItems[lightboxIndex];
            if (!item) return;
            const lb = getLightbox();
            lb.querySelector('.item-category').textContent = item.category;
            lb.querySelector('.item-title').textContent = item.title;
            const img = lb.querySelector('.lightbox-img');
            img.src = item.url;
            img.alt = item.title;
            lb.querySelector('.lightbox-prev').disabled = lightboxIndex <= 0;
            lb.querySelector('.lightbox-next').disabled = lightboxIndex >= lightboxItems.length - 1;
            preloadLightboxNearby();
        }

        function openLightbox(url) {
            lightboxItems = getVisibleGalleryItems();
            const index = lightboxItems.findIndex(item => item.url === url);
            if (index < 0) return;
            lightboxIndex = index;
            getLightbox().classList.add('open');
            document.body.classList.add('lightbox-open');
            updateLightboxView();
        }

        function navigateLightbox(delta) {
            const next = lightboxIndex + delta;
            if (next < 0 || next >= lightboxItems.length) return;
            lightboxIndex = next;
            updateLightboxView();
        }

        function closeLightbox() {
            if (!lightboxEl || !lightboxEl.classList.contains('open')) return;
            lightboxEl.classList.remove('open');
            document.body.classList.remove('lightbox-open');
            const img = lightboxEl.querySelector('.lightbox-img');
            if (img) {
                img.removeAttribute('src');
                img.alt = '';
            }
            lightboxItems = [];
            lightboxIndex = 0;
        }

        function bindLightboxOnce() {
            if (galleryClickBound) return;
            galleryClickBound = true;

            document.getElementById('gallery').addEventListener('click', (e) => {
                const wrap = e.target.closest('.img-wrap');
                if (!wrap) return;
                const img = wrap.querySelector('.gallery-img');
                if (!img) return;
                const src = img.dataset.fullUrl || img.src || img.dataset.src;
                if (!src) return;
                e.preventDefault();
                openLightbox(src);
            });

            document.addEventListener('keydown', (e) => {
                if (!lightboxEl || !lightboxEl.classList.contains('open')) return;
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') navigateLightbox(-1);
                if (e.key === 'ArrowRight') navigateLightbox(1);
            });

        }

        function createGalleryItem(image, index) {
            const label = CATEGORY_LABELS[image.category];
            const isEager = index < EAGER_COUNT;
            const priorityAttr = index < 3 ? 'fetchpriority="high"' : '';
            const item = document.createElement('article');
            item.className = 'gallery-item';
            item.dataset.category = image.category;

            item.innerHTML = `
                <div class="img-wrap loading">
                    <img
                        class="gallery-img"
                        alt="${image.title}"
                        decoding="async"
                        data-full-url="${image.url}"
                        ${isEager ? `loading="eager" ${priorityAttr}` : 'loading="lazy"'}
                        data-src="${image.url}"
                    >
                    <div class="img-skeleton"></div>
                </div>
                <div class="item-info">
                    <span class="item-category">${label}</span>
                    <span class="item-title">${image.title}</span>
                </div>
            `;
            return item;
        }

        function bindLazyLoad(root) {
            const imgs = root.querySelectorAll('img[data-src]');

            const reveal = (img) => {
                if (!img.dataset.src) return;
                const wrap = img.closest('.img-wrap');
                const onDone = () => {
                    img.classList.add('loaded');
                    if (wrap) {
                        wrap.classList.add('loaded');
                        wrap.classList.remove('loading');
                        wrap.style.aspectRatio = '';
                    }
                };
                if (img.complete && img.naturalWidth) {
                    onDone();
                    return;
                }
                img.addEventListener('load', onDone, { once: true });
                img.addEventListener('error', onDone, { once: true });
                img.src = img.dataset.src;
                img.removeAttribute('data-src');
            };

            if ('IntersectionObserver' in window) {
                const io = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            reveal(entry.target);
                            io.unobserve(entry.target);
                        }
                    });
                }, { rootMargin: '600px 0px' });

                imgs.forEach(img => {
                    if (img.loading === 'eager') {
                        reveal(img);
                    } else {
                        io.observe(img);
                    }
                });
            } else {
                imgs.forEach(reveal);
            }
        }

        function renderGallery(category = 'all') {
            const gallery = document.getElementById('gallery');
            const fragment = document.createDocumentFragment();
            let globalIndex = 0;

            if (category === 'all') {
                CATEGORY_ORDER.forEach(cat => {
                    const items = imageData.filter(img => img.category === cat);
                    if (!items.length) return;

                    const heading = document.createElement('h2');
                    heading.className = 'section-title';
                    heading.textContent = CATEGORY_LABELS[cat];
                    fragment.appendChild(heading);

                    items.forEach(image => {
                        fragment.appendChild(createGalleryItem(image, globalIndex++));
                    });
                });
            } else {
                imageData
                    .filter(img => img.category === category)
                    .forEach(image => {
                        fragment.appendChild(createGalleryItem(image, globalIndex++));
                    });
            }

            gallery.replaceChildren(fragment);
            bindLazyLoad(gallery);
        }

        /* 初始化 */
        injectPreloadHints();
        bindLightboxOnce();
        renderGallery('all');

        preloadBatch(imageData.slice(0, EAGER_COUNT).map(i => i.url));
        preloadRemainingImages();

        document.getElementById('categories').addEventListener('click', (e) => {
            const btn = e.target.closest('.category-btn');
            if (!btn) return;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGallery(btn.dataset.category);
            preloadRemainingImages();
        });
    </script>
</body>
</html>
