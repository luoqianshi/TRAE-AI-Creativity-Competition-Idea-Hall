<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Cosmos Dashboard — 个人宇宙仪表盘</title>
  <style>
    @font-face {
      font-family: 'Outfit';
      src: url('./_shared/fonts/Outfit-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Outfit';
      src: url('./_shared/fonts/Outfit-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Jura';
      src: url('./_shared/fonts/Jura-Light.ttf') format('truetype');
      font-weight: 300;
      font-style: normal;
    }
    @font-face {
      font-family: 'Jura';
      src: url('./_shared/fonts/Jura-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    :root {
      --bg: #06030f;
      --bg2: #110a20;
      --bg3: #1a1130;
      --surface: rgba(26, 17, 48, 0.7);
      --glass: rgba(139, 92, 246, 0.06);
      --ink: #e6e6fa;
      --muted: #9a8fb5;
      --rule: rgba(139, 92, 246, 0.15);
      --accent: #a78bfa;
      --accent-bright: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.4);
      --cyan: #67e8f9;
      --pink: #f472b6;
      --gold: #fbbf24;
      --green: #4ade80;
      --blue: #60a5fa;
      --display: 'Outfit', sans-serif;
      --body: 'Jura', 'Outfit', sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Canvas Background ===== */
    #cosmos-canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* ===== Ambient Background Image ===== */
    .cosmos-bg {
      position: fixed; inset: 0;
      background: url('assets/cosmos_bg_1920x1080.jpg') center / cover no-repeat;
      opacity: 0.25;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== Main Overlay ===== */
    .dashboard {
      position: relative;
      z-index: 10;
      width: 100%; height: 100vh;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }
    .dashboard > * { pointer-events: auto; }

    /* ===== Top Bar ===== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: linear-gradient(180deg, rgba(6,3,15,0.9) 0%, rgba(6,3,15,0) 100%);
      pointer-events: none;
    }
    .top-bar > * { pointer-events: auto; }

    .logo {
      display: flex; align-items: center; gap: 12px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: conic-gradient(from 0deg, var(--accent-bright), var(--cyan), var(--pink), var(--accent-bright));
      border-radius: 50%;
      animation: logoSpin 20s linear infinite;
      box-shadow: 0 0 20px var(--accent-glow);
    }
    @keyframes logoSpin { to { transform: rotate(360deg); } }

    .logo-text {
      font-family: var(--display);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--cyan), var(--accent), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: -2px;
    }

    .top-right {
      display: flex; align-items: center; gap: 20px;
    }
    .clock {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .clock .time {
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      display: block;
      font-family: var(--display);
      letter-spacing: -0.02em;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    /* ===== Center Stage ===== */
    .center-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      position: relative;
    }
    .center-stage > * { pointer-events: auto; }

    .hero-greeting {
      text-align: center;
      animation: fadeSlideUp 1.2s ease-out both;
      pointer-events: none;
      position: relative;
      z-index: 5;
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .greeting-time {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 8px;
    }
    .greeting-main {
      font-family: var(--display);
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--ink) 30%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .greeting-sub {
      font-size: 15px;
      color: var(--muted);
      max-width: 400px;
      margin: 0 auto;
    }

    /* ===== Orbiting Data Nodes ===== */
    .orbit-system {
      position: absolute;
      width: 600px; height: 600px;
      pointer-events: none;
    }
    .orbit-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid var(--rule);
      animation: orbitRotate 60s linear infinite;
    }
    .orbit-ring:nth-child(1) { inset: 80px; animation-duration: 40s; }
    .orbit-ring:nth-child(2) { inset: 150px; animation-duration: 55s; animation-direction: reverse; }
    .orbit-ring:nth-child(3) { inset: 220px; animation-duration: 75s; }
    @keyframes orbitRotate { to { transform: rotate(360deg); } }

    .orbit-node {
      position: absolute;
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      pointer-events: auto;
      animation: orbitCounterRotate 60s linear infinite;
    }
    .orbit-node:hover {
      transform: scale(1.3);
      z-index: 20;
    }
    .orbit-node .node-label {
      position: absolute;
      bottom: -22px;
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      font-family: var(--mono);
      letter-spacing: 0.04em;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .orbit-node:hover .node-label { opacity: 1; }

    .orbit-ring:nth-child(1) .orbit-node { animation: orbitCounterRotate 40s linear infinite; }
    .orbit-ring:nth-child(2) .orbit-node { animation: orbitCounterRotate 55s linear infinite reverse; }
    .orbit-ring:nth-child(3) .orbit-node { animation: orbitCounterRotate 75s linear infinite; }
    @keyframes orbitCounterRotate { to { transform: rotate(-360deg); } }

    .node-github {
      background: radial-gradient(circle, rgba(96,165,250,0.3), rgba(96,165,250,0.05));
      border: 1px solid rgba(96,165,250,0.4);
      box-shadow: 0 0 15px rgba(96,165,250,0.3);
      color: var(--blue);
      top: -22px; left: 50%; margin-left: -22px;
    }
    .node-music {
      background: radial-gradient(circle, rgba(244,114,182,0.3), rgba(244,114,182,0.05));
      border: 1px solid rgba(244,114,182,0.4);
      box-shadow: 0 0 15px rgba(244,114,182,0.3);
      color: var(--pink);
      top: 50%; right: -22px; margin-top: -22px;
    }
    .node-weather {
      background: radial-gradient(circle, rgba(251,191,36,0.3), rgba(251,191,36,0.05));
      border: 1px solid rgba(251,191,36,0.4);
      box-shadow: 0 0 15px rgba(251,191,36,0.3);
      color: var(--gold);
      bottom: -22px; left: 50%; margin-left: -22px;
    }
    .node-habit {
      background: radial-gradient(circle, rgba(74,222,128,0.3), rgba(74,222,128,0.05));
      border: 1px solid rgba(74,222,128,0.4);
      box-shadow: 0 0 15px rgba(74,222,128,0.3);
      color: var(--green);
      top: 50%; left: -22px; margin-top: -22px;
    }
    .node-code {
      background: radial-gradient(circle, rgba(167,139,250,0.3), rgba(167,139,250,0.05));
      border: 1px solid rgba(167,139,250,0.4);
      box-shadow: 0 0 15px rgba(167,139,250,0.3);
      color: var(--accent);
      top: 12%; left: 12%;
    }
    .node-planet {
      background: radial-gradient(circle, rgba(103,232,249,0.3), rgba(103,232,249,0.05));
      border: 1px solid rgba(103,232,249,0.4);
      box-shadow: 0 0 15px rgba(103,232,249,0.3);
      color: var(--cyan);
      bottom: 15%; right: 10%;
    }

    /* ===== Data Tooltip ===== */
    .data-tooltip {
      position: fixed;
      z-index: 100;
      padding: 16px 20px;
      background: rgba(17, 10, 32, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--rule);
      border-radius: 12px;
      min-width: 220px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.25s, transform 0.25s;
    }
    .data-tooltip.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .tooltip-title {
      font-family: var(--display);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .tooltip-title .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .tooltip-row {
      display: flex; justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 12.5px;
    }
    .tooltip-row .label { color: var(--muted); }
    .tooltip-row .value { font-weight: 600; font-family: var(--mono); font-size: 12px; }
    .tooltip-bar {
      margin-top: 10px;
      height: 3px;
      background: var(--bg3);
      border-radius: 2px;
      overflow: hidden;
    }
    .tooltip-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.6s ease-out;
    }

    /* ===== Bottom Panel ===== */
    .bottom-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 15;
      padding: 0 32px 24px;
      background: linear-gradient(0deg, rgba(6,3,15,0.95) 0%, rgba(6,3,15,0.6) 60%, rgba(6,3,15,0) 100%);
      pointer-events: none;
    }
    .bottom-panel > * { pointer-events: auto; }

    .data-strip {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .data-strip::-webkit-scrollbar { display: none; }

    .data-card {
      flex: 0 0 auto;
      min-width: 180px;
      padding: 16px 20px;
      background: var(--surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--rule);
      border-radius: 14px;
      cursor: pointer;
      transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
    }
    .data-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(139, 92, 246, 0.15);
    }
    .data-card.active {
      border-color: var(--accent-bright);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .card-icon {
      font-size: 20px;
      margin-bottom: 8px;
    }
    .card-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-family: var(--mono);
      margin-bottom: 4px;
    }
    .card-value {
      font-family: var(--display);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .card-delta {
      font-size: 11px;
      margin-top: 4px;
      font-family: var(--mono);
    }
    .card-delta.up { color: var(--green); }
    .card-delta.down { color: var(--pink); }
    .card-delta.neutral { color: var(--muted); }

    /* ===== Expanded Detail Panel ===== */
    .detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(6, 3, 15, 0.85);
      backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .detail-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .detail-panel {
      width: 90%;
      max-width: 560px;
      max-height: 80vh;
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 20px;
      padding: 32px;
      transform: scale(0.9) translateY(20px);
      transition: transform 0.4s ease-out;
      overflow-y: auto;
    }
    .detail-overlay.active .detail-panel {
      transform: scale(1) translateY(0);
    }
    .detail-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .detail-header h2 {
      font-family: var(--display);
      font-size: 22px;
      font-weight: 700;
      display: flex; align-items: center; gap: 10px;
    }
    .detail-close {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }
    .detail-close:hover { border-color: var(--ink); color: var(--ink); }

    .detail-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .detail-stat {
      padding: 14px;
      background: var(--glass);
      border-radius: 10px;
      border: 1px solid var(--rule);
    }
    .detail-stat .ds-label {
      font-size: 11px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      font-family: var(--mono);
    }
    .detail-stat .ds-value {
      font-family: var(--display);
      font-size: 22px; font-weight: 700;
      margin-top: 4px;
    }

    .detail-list {
      display: flex; flex-direction: column; gap: 8px;
    }
    .detail-list-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px;
      background: var(--glass);
      border-radius: 8px;
      border: 1px solid var(--rule);
      font-size: 13px;
      transition: border-color 0.2s;
    }
    .detail-list-item:hover { border-color: var(--accent); }
    .detail-list-item .dl-name { color: var(--ink); }
    .detail-list-item .dl-val { font-family: var(--mono); font-size: 12px; color: var(--muted); }

    /* ===== Constellation Lines (SVG) ===== */
    .constellation-svg {
      position: absolute;
      width: 600px; height: 600px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
    }
    .constellation-svg line {
      stroke: var(--rule);
      stroke-width: 1;
      opacity: 0.5;
    }

    /* ===== Search Bar ===== */
    .search-bar {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 200;
      width: 90%;
      max-width: 520px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }
    .search-bar.active {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .search-input {
      width: 100%;
      padding: 18px 24px;
      background: rgba(17, 10, 32, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--rule);
      border-radius: 16px;
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--accent-bright); }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .top-bar { padding: 12px 16px; }
      .logo-text { font-size: 15px; }
      .greeting-main { font-size: 32px; }
      .orbit-system { width: 320px; height: 320px; }
      .orbit-ring:nth-child(1) { inset: 40px; }
      .orbit-ring:nth-child(2) { inset: 80px; }
      .orbit-ring:nth-child(3) { inset: 120px; }
      .orbit-node { width: 32px; height: 32px; font-size: 14px; }
      .bottom-panel { padding: 0 16px 16px; }
      .data-card { min-width: 150px; padding: 12px 16px; }
      .card-value { font-size: 20px; }
      .detail-panel { padding: 24px; width: 95%; }
    }
  </style>
</head>
<body>
  <canvas id="cosmos-canvas"></canvas>
  <div class="cosmos-bg"></div>

  <div class="dashboard">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="logo">
        <div class="logo-icon"></div>
        <div>
          <div class="logo-text">Personal Cosmos</div>
          <div class="logo-sub">个人宇宙仪表盘</div>
        </div>
      </div>
      <div class="top-right">
        <div class="clock">
          <span class="greeting-time" id="greeting-text">晚上好</span>
          <span class="time" id="clock-time">00:00</span>
          <span id="clock-date"></span>
        </div>
        <div class="status-dot" title="宇宙在线"></div>
      </div>
    </header>

    <!-- Center Stage -->
    <main class="center-stage">
      <!-- Orbiting System -->
      <div class="orbit-system">
        <!-- Constellation SVG Lines -->
        <svg class="constellation-svg" viewBox="0 0 600 600">
          <line x1="300" y1="80" x2="530" y2="300" opacity="0.3"/>
          <line x1="300" y1="80" x2="300" y2="520" opacity="0.25"/>
          <line x1="530" y1="300" x2="300" y2="520" opacity="0.2"/>
          <line x1="70" y1="300" x2="168" y2="108" opacity="0.3"/>
          <line x1="70" y1="300" x2="168" y2="492" opacity="0.2"/>
          <line x1="168" y1="108" x2="300" y2="80" opacity="0.15"/>
          <line x1="168" y1="492" x2="300" y2="520" opacity="0.15"/>
          <line x1="300" y1="80" x2="300" y2="300" opacity="0.12"/>
          <line x1="300" y1="300" x2="300" y2="520" opacity="0.12"/>
          <line x1="530" y1="300" x2="168" y2="492" opacity="0.1"/>
        </svg>

        <!-- Orbit Ring 1 -->
        <div class="orbit-ring">
          <div class="orbit-node node-github" data-source="github" onclick="showDetail('github')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
            <span class="node-label">GitHub</span>
          </div>
        </div>

        <!-- Orbit Ring 2 -->
        <div class="orbit-ring">
          <div class="orbit-node node-music" data-source="music" onclick="showDetail('music')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            <span class="node-label">Music</span>
          </div>
        </div>

        <!-- Orbit Ring 3 -->
        <div class="orbit-ring">
          <div class="orbit-node node-weather" data-source="weather" onclick="showDetail('weather')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <span class="node-label">Weather</span>
          </div>
          <div class="orbit-node node-habit" data-source="habit" onclick="showDetail('habit')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            <span class="node-label">Habits</span>
          </div>
        </div>

        <!-- Additional nodes on Ring 1 & 2 -->
        <div class="orbit-ring" style="inset:80px">
          <div class="orbit-node node-code" data-source="code" onclick="showDetail('code')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            <span class="node-label">Code</span>
          </div>
        </div>
        <div class="orbit-ring" style="inset:220px">
          <div class="orbit-node node-planet" data-source="system" onclick="showDetail('system')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(0 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/></svg>
            <span class="node-label">System</span>
          </div>
        </div>

      <div class="hero-greeting">

        <h1 class="greeting-main" id="greeting-heading">你的专属宇宙</h1>
        <p class="greeting-sub">每颗星辰都是你数字生活的一个维度，在此汇聚成独一无二的星图</p>
      </div>
    </main>

    <nav class="bottom-panel">

          </div>
          <div class="card-label">GitHub Commits</div>
          <div class="card-value" style="color:var(--blue)">1,247</div>
          <div class="card-delta up">+23 本周</div>
        </div>

        <div class="data-card" data-source="music" onclick="showDetail('music')">

          </div>
          <div class="card-label">Music Played</div>
          <div class="card-value" style="color:var(--pink)">3,862</div>
          <div class="card-delta up">+156 首本周</div>
        </div>

        <div class="data-card" data-source="weather" onclick="showDetail('weather')">
          <div class="card-icon" style="color:var(--gold)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </div>
          <div class="card-label">Weather</div>
          <div class="card-value" style="color:var(--gold)">28°C</div>
          <div class="card-delta neutral">晴 · 上海</div>
        </div>

        <div class="data-card" data-source="habit" onclick="showDetail('habit')">
          <div class="card-icon" style="color:var(--green)">

          </div>

          <div class="card-value" style="color:var(--green)">42 天</div>

        </div>

        <div class="data-card" data-source="code" onclick="showDetail('code')">

            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>

          <div class="card-value" style="color:var(--accent)">89.4K</div>

        </div>

        <div class="data-card" data-source="system" onclick="showDetail('system')">
          <div class="card-icon" style="color:var(--cyan)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/></svg>

  </div>

  <!-- Detail Overlay -->
