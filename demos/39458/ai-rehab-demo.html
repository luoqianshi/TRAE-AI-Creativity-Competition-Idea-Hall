<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpoRe - AI 运动康复分析 Demo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M16 6v20M9 11c4-3 10-3 14 0M9 21c4 3 10 3 14 0M11 16h10' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --panel: #ffffff;
      --panel-strong: #f0f4f8;
      --ink: #172033;
      --muted: #657187;
      --line: #d9e0ea;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --cyan: #0891b2;
      --green: #059669;
      --amber: #b45309;
      --red: #dc2626;
      --shadow: 0 18px 50px rgba(28, 40, 68, .12);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, #eef3f9 0%, #f8fafc 42%, #edf2f7 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid rgba(148, 163, 184, .32);
      background: rgba(255, 255, 255, .78);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: white;
      box-shadow: 0 10px 24px rgba(37, 99, 235, .24);
    }

    .brand-title {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .brand-title strong {
      font-size: 18px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .brand-title span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      color: #334155;
      background: #fff;
      font-size: 13px;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(5, 150, 105, .12);
    }

    .layout {
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: 22px 24px 28px;
      height: calc(100vh - 68px);
      display: grid;
      grid-template-columns: 300px minmax(360px, 1fr) 420px;
      gap: 18px;
      align-items: stretch;
      overflow: hidden;
    }

    .panel {
      background: rgba(255, 255, 255, .9);
      border: 1px solid rgba(203, 213, 225, .86);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .side-panel,
    .result-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }

    .panel-header {
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--line);
    }

    .panel-header h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.3;
    }

    .panel-header p {
      margin: 7px 0 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 13px;
    }

    .content {
      padding: 16px 18px 18px;
      overflow: auto;
    }

    .model-panel {
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .model-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(248, 250, 252, .86);
    }

    .segmented {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 3px;
      padding: 3px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }

    .segmented button {
      min-width: 72px;
      min-height: 32px;
      border: 0;
      border-radius: 6px;
      color: #475569;
      background: transparent;
    }

    .segmented button.active {
      color: white;
      background: var(--blue);
      box-shadow: 0 7px 16px rgba(37, 99, 235, .22);
    }

    .icon-button {
      width: 36px;
      height: 36px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #334155;
      background: #fff;
    }

    .icon-button:hover {
      border-color: #94a3b8;
      background: #f8fafc;
    }

    .model-stage {
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 22%, rgba(14, 165, 233, .14), transparent 32%),
        linear-gradient(180deg, #f8fafc 0%, #e9eef5 100%);
    }

    .grid-floor {
      position: absolute;
      left: 50%;
      bottom: 54px;
      width: min(78%, 620px);
      height: 120px;
      transform: translateX(-50%) perspective(520px) rotateX(64deg);
      border: 1px solid rgba(100, 116, 139, .24);
      background-image:
        linear-gradient(rgba(100, 116, 139, .22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100, 116, 139, .22) 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: .65;
    }

    .body-scene {
      position: relative;
      width: min(520px, 92%);
      height: 100%;
      min-height: 0;
      perspective: 1100px;
      display: grid;
      place-items: center;
    }

    .body-model {
      position: relative;
      top: -124px;
      width: 285px;
      height: 700px;
      transform-style: preserve-3d;
      transform: scale(var(--model-scale, .52)) rotateY(var(--rotate-y, 0deg)) rotateX(2deg);
      transition: transform .45s ease;
      filter: drop-shadow(0 20px 28px rgba(15, 23, 42, .16));
    }

    .body-shadow {
      position: absolute;
      left: 50%;
      bottom: -10px;
      width: 205px;
      height: 42px;
      transform: translateX(-50%) rotateX(75deg);
      background: radial-gradient(ellipse, rgba(15, 23, 42, .28), transparent 66%);
      filter: blur(2px);
    }

    .part {
      position: absolute;
      border: 1px solid rgba(71, 85, 105, .3);
      background:
        radial-gradient(circle at 35% 22%, rgba(255, 255, 255, .8), transparent 24%),
        linear-gradient(135deg, #d8edf7, #9bc7dc 48%, #6b9fb8);
      box-shadow:
        inset -14px -16px 24px rgba(15, 23, 42, .16),
        inset 10px 10px 22px rgba(255, 255, 255, .54),
        0 10px 26px rgba(51, 65, 85, .12);
      cursor: pointer;
      outline: none;
      transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .part::after {
      content: "";
      position: absolute;
      inset: 10% 18%;
      border-radius: inherit;
      border-left: 1px solid rgba(255, 255, 255, .42);
      opacity: .9;
      pointer-events: none;
    }

    .part:hover,
    .part.focused {
      border-color: rgba(37, 99, 235, .62);
      transform: translateZ(34px) scale(1.035);
      box-shadow:
        inset -14px -16px 24px rgba(15, 23, 42, .12),
        inset 10px 10px 22px rgba(255, 255, 255, .62),
        0 14px 34px rgba(37, 99, 235, .26);
      z-index: 5;
    }

    .part.selected {
      border-color: rgba(220, 38, 38, .8);
      background:
        radial-gradient(circle at 36% 22%, rgba(255, 255, 255, .85), transparent 24%),
        linear-gradient(135deg, #fecaca, #fb7185 48%, #e11d48);
      box-shadow:
        inset -12px -14px 24px rgba(127, 29, 29, .18),
        inset 9px 9px 22px rgba(255, 255, 255, .58),
        0 16px 38px rgba(225, 29, 72, .28);
      z-index: 8;
    }

    .head {
      width: 78px;
      height: 88px;
      left: 103px;
      top: 10px;
      border-radius: 48% 48% 45% 45%;
    }

    .neck {
      width: 42px;
      height: 38px;
      left: 121px;
      top: 88px;
      border-radius: 15px;
    }

    .torso {
      width: 126px;
      height: 178px;
      left: 79px;
      top: 118px;
      border-radius: 45px 45px 30px 30px;
    }

    .core {
      width: 108px;
      height: 104px;
      left: 88px;
      top: 262px;
      border-radius: 24px 24px 36px 36px;
    }

    .shoulder-left,
    .shoulder-right {
      width: 74px;
      height: 52px;
      top: 124px;
      border-radius: 38px 30px 22px 22px;
    }

    .shoulder-left {
      left: 35px;
      transform: rotate(-16deg);
    }

    .shoulder-right {
      right: 35px;
      transform: rotate(16deg);
    }

    .arm-left,
    .arm-right {
      width: 42px;
      height: 162px;
      top: 172px;
      border-radius: 24px;
    }

    .arm-left {
      left: 26px;
      transform: rotate(8deg);
    }

    .arm-right {
      right: 26px;
      transform: rotate(-8deg);
    }

    .elbow-left,
    .elbow-right {
      width: 46px;
      height: 46px;
      top: 298px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 36% 25%, rgba(255, 255, 255, .85), transparent 24%),
        linear-gradient(135deg, #dbeafe, #93c5fd 48%, #3b82f6);
    }

    .elbow-left {
      left: 18px;
    }

    .elbow-right {
      right: 18px;
    }

    .forearm-left,
    .forearm-right {
      width: 38px;
      height: 126px;
      top: 336px;
      border-radius: 22px;
    }

    .forearm-left {
      left: 26px;
      transform: rotate(-6deg);
    }

    .forearm-right {
      right: 26px;
      transform: rotate(6deg);
    }

    .hip-left,
    .hip-right {
      width: 70px;
      height: 72px;
      top: 350px;
      border-radius: 32px 32px 20px 20px;
    }

    .hip-left {
      left: 76px;
      transform: rotate(9deg);
    }

    .hip-right {
      right: 76px;
      transform: rotate(-9deg);
    }

    .thigh-left,
    .thigh-right {
      width: 54px;
      height: 148px;
      top: 412px;
      border-radius: 28px 28px 24px 24px;
    }

    .thigh-left {
      left: 84px;
      transform: rotate(3deg);
    }

    .thigh-right {
      right: 84px;
      transform: rotate(-3deg);
    }

    .knee-left,
    .knee-right {
      width: 56px;
      height: 46px;
      top: 535px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 36% 25%, rgba(255, 255, 255, .85), transparent 24%),
        linear-gradient(135deg, #dbeafe, #93c5fd 48%, #3b82f6);
    }

    .knee-left {
      left: 83px;
    }

    .knee-right {
      right: 83px;
    }

    .calf-left,
    .calf-right {
      width: 42px;
      height: 122px;
      top: 574px;
      border-radius: 24px 24px 18px 18px;
    }

    .calf-left {
      left: 90px;
      transform: rotate(-3deg);
    }

    .calf-right {
      right: 90px;
      transform: rotate(3deg);
    }

    .label-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border: 1px solid rgba(148, 163, 184, .5);
      border-radius: 999px;
      color: #334155;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 8px 18px rgba(15, 23, 42, .1);
      font-size: 12px;
      pointer-events: none;
      white-space: nowrap;
    }

    .body-scene > .label-pin {
      display: none;
    }

    .label-pin b {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue);
    }

    .pin-shoulder {
      left: 25%;
      top: 28%;
    }

    .pin-waist {
      left: 73%;
      top: 51%;
    }

    .pin-knee {
      left: 27%;
      top: 78%;
    }

    .model-footer {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 10px 16px;
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .metric {
      min-height: 50px;
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #f8fafc;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .metric strong {
      display: block;
      margin-top: 6px;
      font-size: 17px;
      line-height: 1.2;
    }

    .section {
      margin-bottom: 18px;
    }

    .section:last-child {
      margin-bottom: 0;
    }

    .section-title {
      margin: 0 0 10px;
      color: #0f172a;
      font-size: 14px;
      line-height: 1.35;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      color: #334155;
      font-size: 13px;
      line-height: 1.4;
    }

    .input,
    .textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: #172033;
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .input {
      min-height: 40px;
      padding: 0 12px;
    }

    .textarea {
      min-height: 128px;
      resize: vertical;
      padding: 11px 12px;
      line-height: 1.55;
    }

    .input:focus,
    .textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, .12);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      min-height: 34px;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      background: #fff;
      color: #334155;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
    }

    .chip.active {
      border-color: rgba(37, 99, 235, .5);
      color: #1e40af;
      background: #eff6ff;
    }

    .chip::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
    }

    .chip.active::before {
      background: var(--blue);
    }

    .body-list {
      display: grid;
      gap: 8px;
    }

    .body-item {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0 11px;
      background: #fff;
      color: #334155;
      text-align: left;
    }

    .body-item:hover,
    .body-item.active {
      border-color: rgba(37, 99, 235, .52);
      background: #eff6ff;
      color: #1d4ed8;
    }

    .body-item span:last-child {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .slider-row {
      display: grid;
      grid-template-columns: 1fr 42px;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
    }

    .value-box {
      min-height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: #0f172a;
      font-weight: 700;
    }

    .primary-button {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      box-shadow: 0 14px 26px rgba(37, 99, 235, .24);
      font-weight: 700;
    }

    .primary-button:hover {
      filter: brightness(.98);
    }

    .secondary-button {
      width: 100%;
      min-height: 40px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #334155;
      background: #fff;
    }

    .result-body {
      flex: 1;
      padding: 16px 18px 18px;
      overflow: auto;
    }

    .empty-state {
      min-height: 260px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      padding: 24px;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 8px;
      color: #334155;
      font-size: 16px;
    }

    .analysis-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .analysis-card h3 {
      margin: 0;
      padding: 12px 14px;
      font-size: 15px;
      line-height: 1.35;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    .analysis-card .card-content {
      padding: 12px 14px 14px;
      color: #334155;
      line-height: 1.7;
      font-size: 14px;
    }

    .analysis-card ul {
      margin: 0;
      padding-left: 18px;
    }

    .analysis-card li {
      margin: 6px 0;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .risk-tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 9px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid #cbd5e1;
      color: #334155;
      background: #fff;
    }

    .risk-tag.warn {
      border-color: #fed7aa;
      color: #9a3412;
      background: #fff7ed;
    }

    .risk-tag.good {
      border-color: #bbf7d0;
      color: #166534;
      background: #f0fdf4;
    }

    .notice {
      margin-top: 12px;
      padding: 11px 12px;
      border-left: 4px solid var(--amber);
      border-radius: 6px;
      background: #fffbeb;
      color: #78350f;
      font-size: 13px;
      line-height: 1.6;
    }

    .progress {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: #e2e8f0;
    }

    .progress span {
      display: block;
      width: var(--value, 50%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--blue));
    }

    .mobile-cta {
      display: none;
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 280px minmax(360px, 1fr);
        height: auto;
        overflow: visible;
      }

      .result-panel {
        grid-column: 1 / -1;
        min-height: auto;
        height: auto;
      }
    }

    @media (max-width: 820px) {
      .topbar {
        height: auto;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 16px;
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
        justify-content: space-between;
      }

      .layout {
        padding: 14px 12px 86px;
        grid-template-columns: 1fr;
        height: auto;
        overflow: visible;
      }

      .side-panel,
      .model-panel,
      .result-panel {
        min-height: auto;
        height: auto;
      }

      .model-panel {
        min-height: 640px;
      }

      .model-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .body-scene {
        min-height: 500px;
        height: 500px;
      }

      .body-model {
        top: -56px;
        transform: scale(.78) rotateY(var(--rotate-y, -10deg)) rotateX(2deg);
      }

      .model-footer {
        grid-template-columns: 1fr;
      }

      .mobile-cta {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        display: block;
        padding: 10px 12px 14px;
        background: rgba(255, 255, 255, .9);
        border-top: 1px solid #cbd5e1;
        backdrop-filter: blur(14px);
      }
    }

    @media (max-width: 520px) {
      .brand-title strong {
        font-size: 16px;
      }

      .status-chip {
        font-size: 12px;
        padding: 0 10px;
      }

      .body-model {
        top: -48px;
        transform: scale(.68) rotateY(var(--rotate-y, -10deg)) rotateX(2deg);
      }

      .segmented {
        width: 100%;
      }

      .segmented button {
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 3v18M5 8c4-3 10-3 14 0M5 16c4 3 10 3 14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-title">
          <strong>SpoRe</strong>
          <span>AI 运动康复与劳损分析助手</span>
        </div>
      </div>
      <div class="top-actions">
        <span class="status-chip"><span class="dot"></span>演示模式</span>
        <span class="status-chip">3D 区域选择 + 文本输入</span>
      </div>
    </header>

    <main class="layout">
      <aside class="panel side-panel">
        <div class="panel-header">
          <h2>症状输入</h2>
          <p>选择不舒服的部位，补充场景、感受和持续时间，生成康复方向分析。</p>
        </div>
        <div class="content">
          <section class="section">
            <h3 class="section-title">常见部位</h3>
            <div class="body-list" id="bodyList"></div>
          </section>

          <section class="section">
            <h3 class="section-title">使用场景</h3>
            <div class="chips" id="sceneChips">
              <button class="chip active" data-value="久坐办公">久坐办公</button>
              <button class="chip" data-value="跑步训练">跑步训练</button>
              <button class="chip" data-value="力量训练">力量训练</button>
              <button class="chip" data-value="久站通勤">久站通勤</button>
              <button class="chip" data-value="球类运动">球类运动</button>
            </div>
          </section>

          <section class="section">
            <label class="field-label" for="durationInput">持续时间</label>
            <input class="input" id="durationInput" value="3 天，运动后加重，休息后缓解">
          </section>

          <section class="section">
            <label class="field-label" for="symptomInput">文字描述</label>
            <textarea class="textarea" id="symptomInput">右肩和颈部紧绷，抬手时肩前侧有牵拉感，最近久坐写代码较多，晚上健身做过推举训练。</textarea>
          </section>

          <section class="section">
            <h3 class="section-title">不适强度</h3>
            <div class="slider-row">
              <input type="range" id="painRange" min="1" max="10" value="5">
              <div class="value-box" id="painValue">5</div>
            </div>
          </section>

          <section class="section">
            <button class="primary-button" id="analyzeBtn">生成 AI 康复分析</button>
          </section>
          <button class="secondary-button" id="resetBtn">重置示例</button>
        </div>
      </aside>

      <section class="panel model-panel">
        <div class="model-toolbar">
          <div>
            <strong>3D 人体交互模型</strong>
            <p style="margin:5px 0 0;color:#657187;font-size:13px;line-height:1.4;">点击人体区域，模拟选择肌肉、筋膜或关节不适点。</p>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <div class="segmented" aria-label="视角切换">
              <button class="active" data-view="0">正面</button>
              <button data-view="26">侧向</button>
              <button data-view="178">背面</button>
            </div>
            <button class="icon-button" id="rotateBtn" title="旋转视角" aria-label="旋转视角">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M4 12a8 8 0 0 1 13.66-5.66M20 12A8 8 0 0 1 6.34 17.66" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M18 2v5h-5M6 22v-5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="model-stage">
          <div class="grid-floor"></div>
          <div class="body-scene" aria-label="可交互人体模型">
            <div class="body-model" id="bodyModel">
              <div class="body-shadow"></div>
              <button class="part head" data-part="颈肩区域" aria-label="颈肩区域"></button>
              <button class="part neck" data-part="颈肩区域" aria-label="颈部"></button>
              <button class="part torso" data-part="胸背区域" aria-label="胸背区域"></button>
              <button class="part core" data-part="腰背核心" aria-label="腰背核心"></button>
              <button class="part shoulder-left" data-part="肩关节" aria-label="左肩关节"></button>
              <button class="part shoulder-right selected" data-part="肩关节" aria-label="右肩关节"></button>
              <button class="part arm-left" data-part="上臂肌群" aria-label="左上臂"></button>
              <button class="part arm-right" data-part="上臂肌群" aria-label="右上臂"></button>
              <button class="part elbow-left" data-part="肘关节" aria-label="左肘关节"></button>
              <button class="part elbow-right" data-part="肘关节" aria-label="右肘关节"></button>
              <button class="part forearm-left" data-part="前臂腕部" aria-label="左前臂腕部"></button>
              <button class="part forearm-right" data-part="前臂腕部" aria-label="右前臂腕部"></button>
              <button class="part hip-left" data-part="髋关节" aria-label="左髋关节"></button>
              <button class="part hip-right" data-part="髋关节" aria-label="右髋关节"></button>
              <button class="part thigh-left" data-part="大腿肌群" aria-label="左大腿"></button>
              <button class="part thigh-right" data-part="大腿肌群" aria-label="右大腿"></button>
              <button class="part knee-left" data-part="膝关节" aria-label="左膝关节"></button>
              <button class="part knee-right" data-part="膝关节" aria-label="右膝关节"></button>
              <button class="part calf-left" data-part="小腿踝足" aria-label="左小腿踝足"></button>
              <button class="part calf-right" data-part="小腿踝足" aria-label="右小腿踝足"></button>
            </div>
            <span class="label-pin pin-shoulder"><b></b>肩颈高发区</span>
            <span class="label-pin pin-waist"><b></b>腰背劳损区</span>
            <span class="label-pin pin-knee"><b></b>膝踝运动区</span>
          </div>
        </div>

        <div class="model-footer">
          <div class="metric">
            <span>已选区域</span>
            <strong id="selectedMetric">肩关节</strong>
          </div>
          <div class="metric">
            <span>风险等级</span>
            <strong id="riskMetric">中等</strong>
          </div>
          <div class="metric">
            <span>建议策略</span>
            <strong id="strategyMetric">放松 + 稳定</strong>
          </div>
        </div>
      </section>

      <aside class="panel result-panel">
        <div class="panel-header">
          <h2>AI 分析结果</h2>
          <p>输出结构包括专业描述、可能原因、缓解方式、风险提示和下一步建议。</p>
        </div>
        <div class="result-body" id="resultBody">
          <div class="empty-state">
            <div>
              <strong>等待生成分析</strong>
              <span>点击左侧按钮后，这里会展示模拟的大模型运动康复分析。</span>
            </div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <div class="mobile-cta">
    <button class="primary-button" id="mobileAnalyzeBtn">生成 AI 康复分析</button>
  </div>

  <script>
    const bodyParts = [
      { name: "颈肩区域", note: "斜方肌 / 肩胛提肌", strategy: "放松 + 姿势调整" },
      { name: "肩关节", note: "肩袖 / 胸小肌 / 三角肌", strategy: "放松 + 稳定" },
      { name: "上臂肌群", note: "肱二头肌 / 肱三头肌", strategy: "减负 + 渐进力量" },
      { name: "肘关节", note: "肱骨外上髁 / 肌腱止点", strategy: "减负 + 离心控制" },
      { name: "胸背区域", note: "胸椎 / 背阔肌 / 菱形肌", strategy: "活动度 + 呼吸" },
      { name: "腰背核心", note: "竖脊肌 / 腰方肌 / 髂腰肌", strategy: "减压 + 核心激活" },
      { name: "髋关节", note: "臀中肌 / 髂胫束 / 梨状肌", strategy: "活动度 + 臀肌激活" },
      { name: "膝关节", note: "股四头肌 / 髌腱 / 半月板", strategy: "负荷管理 + 稳定" },
      { name: "小腿踝足", note: "腓肠肌 / 跟腱 / 足底筋膜", strategy: "拉伸 + 足踝控制" },
      { name: "前臂腕部", note: "腕伸肌 / 腕屈肌 / 肘腕链路", strategy: "减负 + 渐进恢复" }
    ];

    const partKnowledge = {
      "颈肩区域": {
        anatomy: "重点关联斜方肌上束、肩胛提肌、胸锁乳突肌、颈椎小关节与肩胛胸廓节律。",
        causes: ["长时间低头或屏幕高度不合适，导致颈肩肌群持续等长收缩。", "上肢训练后恢复不足，肩胛稳定肌疲劳，出现代偿紧张。", "睡眠姿势或压力状态会放大颈肩肌筋膜敏感。"],
        relief: ["每 45 分钟进行 1 次颈胸伸展和肩胛后缩练习。", "用热敷或泡沫轴轻柔放松斜方肌上束，不做暴力按压。", "训练日减少耸肩类动作负荷，优先恢复肩胛控制。"]
      },
      "肩关节": {
        anatomy: "重点关联肩袖肌群、胸小肌、三角肌前束、肱二头肌长头腱和肩胛稳定系统。",
        causes: ["推举、卧推或投掷动作后，肩前侧组织负荷升高。", "久坐圆肩会让胸小肌紧张，影响肩胛上旋与后倾。", "肩袖外旋力量不足时，抬手容易出现夹挤感或牵拉感。"],
        relief: ["先暂停高负荷过顶推举，保留无痛范围内活动。", "做胸小肌拉伸、肩胛后缩下压、弹力带外旋，每组动作保持可控。", "若疼痛超过 7 分、夜间痛或明显无力，应及时就医评估。"]
      },
      "胸背区域": {
        anatomy: "重点关联胸椎活动度、菱形肌、背阔肌、前锯肌和肋椎关节活动。",
        causes: ["长期含胸坐姿会降低胸椎伸展能力，背部产生紧绷和酸胀。", "划船、引体或硬拉后背部恢复不足，局部筋膜张力升高。", "呼吸浅表可能让胸廓活动变差，进一步影响肩颈。"],
        relief: ["使用泡沫轴进行胸椎伸展，避免直接滚压腰椎。", "练习 90/90 呼吸和肩胛控制，恢复胸廓与肩胛协同。", "训练中降低拉类动作总量，优先修正动作路径。"]
      },
      "上臂肌群": {
        anatomy: "重点关联肱二头肌、肱三头肌、肱肌、肩肘联动和上臂筋膜张力。",
        causes: ["推拉训练、投掷或搬运后，上臂肌群短时间负荷升高。", "肩胛控制不足时，上臂容易替代肩背发力。", "训练容量增加过快会让肌腱和筋膜恢复不足。"],
        relief: ["短期降低推拉动作重量，保留无痛范围的主动活动。", "做轻量肘屈伸、肩胛稳定和上臂温和放松。", "若出现明显瘀青、断裂感或肌力突然下降，应尽快就医。"]
      },
      "肘关节": {
        anatomy: "重点关联肱骨外上髁、肱骨内上髁、前臂伸屈肌腱、肘关节囊和握力链路。",
        causes: ["反复握持、引体、硬拉、网球或鼠标使用会刺激肘部肌腱止点。", "腕部姿势不佳会把压力传导到肘关节。", "短期训练量和工作量叠加时，肘部更容易出现酸胀或刺痛。"],
        relief: ["减少疼痛动作和长时间强握，先恢复腕肘中立位。", "做低强度腕伸肌离心练习，逐步增加负荷。", "如果肘部肿胀、发热或伸屈受限，应进行专业评估。"]
      },
      "腰背核心": {
        anatomy: "重点关联竖脊肌、腰方肌、髂腰肌、臀大肌、腹横肌和腰骶稳定结构。",
        causes: ["久坐会让髂腰肌紧张、臀肌抑制，腰背承担更多代偿负荷。", "硬拉、深蹲或搬重物后核心压力管理不足，腰背肌过度工作。", "睡眠不足或突然增加训练量会降低组织恢复能力。"],
        relief: ["短期减少弯腰负重和久坐，增加站立步行切换。", "做髂腰肌拉伸、臀桥、死虫式，建立核心和臀肌协同。", "出现下肢麻木、放射痛或大小便异常时，需要立即就医。"]
      },
      "髋关节": {
        anatomy: "重点关联臀中肌、梨状肌、髂腰肌、髂胫束、股骨头髋臼关节和骨盆控制。",
        causes: ["跑步、深蹲或久坐后髋屈肌紧张，骨盆控制下降。", "臀中肌力量不足会让膝和腰共同代偿。", "单侧负荷或步态偏差会造成髋外侧酸痛。"],
        relief: ["做髋屈肌拉伸、蚌式开合、侧向弹力带行走。", "跑步先降低配速和距离，观察 48 小时反应。", "避免在明显疼痛下做大重量深蹲和爆发跳跃。"]
      },
      "膝关节": {
        anatomy: "重点关联股四头肌、髌腱、髂胫束、腘绳肌、半月板和髌股关节轨迹。",
        causes: ["跑量或跳跃量增加过快，髌股关节压力升高。", "髋稳定不足、足踝控制差，会让膝盖承担剪切和内扣压力。", "下坡跑、深蹲到底或频繁急停会加重膝前侧负担。"],
        relief: ["短期降低跑跳和深蹲深度，保留无痛范围活动。", "做股四头肌等长收缩、臀中肌激活和踝背屈活动。", "若出现明显肿胀、卡住、打软腿，需要专业检查。"]
      },
      "小腿踝足": {
        anatomy: "重点关联腓肠肌、比目鱼肌、跟腱、胫骨后肌、腓骨肌和足底筋膜。",
        causes: ["跑步、跳绳或久站后小腿后侧和足底组织负荷累计。", "鞋底缓震不足或突然增加坡度训练，容易刺激跟腱和足底筋膜。", "踝背屈受限会让膝、髋和腰产生连锁代偿。"],
        relief: ["用低强度小腿拉伸和足底滚压缓解张力。", "加入离心提踵和足弓控制练习，循序渐进增加次数。", "如果晨起第一步足底刺痛明显，应减少冲击训练并观察。"]
      },
      "前臂腕部": {
        anatomy: "重点关联腕伸肌群、腕屈肌群、肱骨外上髁、腕管区域和握力链路。",
        causes: ["键盘鼠标、握拍、引体或硬拉握力负荷累积，前臂肌腱张力升高。", "手腕长期背伸或尺偏，会增加腕部局部压力。", "训练握力恢复不足时，肘腕疼痛可能互相牵连。"],
        relief: ["调整键盘鼠标高度，让手腕保持中立位。", "做腕伸肌离心练习和轻柔前臂放松，避免强刺激按摩。", "短期减少大重量握拉动作，逐步恢复握力容量。"]
      }
    };

    const state = {
      selectedPart: "肩关节",
      scene: "久坐办公",
      pain: 5
    };

    const bodyList = document.getElementById("bodyList");
    const bodyModel = document.getElementById("bodyModel");
    const painRange = document.getElementById("painRange");
    const painValue = document.getElementById("painValue");
    const selectedMetric = document.getElementById("selectedMetric");
    const riskMetric = document.getElementById("riskMetric");
    const strategyMetric = document.getElementById("strategyMetric");
    const resultBody = document.getElementById("resultBody");
    const symptomInput = document.getElementById("symptomInput");
    const durationInput = document.getElementById("durationInput");

    function renderBodyList() {
      bodyList.innerHTML = bodyParts.map(part => `
        <button class="body-item${part.name === state.selectedPart ? " active" : ""}" data-part="${part.name}">
          <span>${part.name}</span>
          <span>${part.note}</span>
        </button>
      `).join("");
    }

    function getRiskLevel() {
      if (state.pain >= 8) return { label: "偏高", className: "warn", width: "86%" };
      if (state.pain >= 5) return { label: "中等", className: "warn", width: "58%" };
      return { label: "较低", className: "good", width: "32%" };
    }

    function syncSelection(partName) {
      state.selectedPart = partName;
      document.querySelectorAll(".part").forEach(part => {
        part.classList.toggle("selected", part.dataset.part === partName);
      });
      renderBodyList();
      updateMetrics();
    }

    function setModelView(view) {
      bodyModel.style.setProperty("--rotate-y", `${view}deg`);
    }

    function updateMetrics() {
      const selected = bodyParts.find(part => part.name === state.selectedPart) || bodyParts[0];
      const risk = getRiskLevel();
      selectedMetric.textContent = state.selectedPart;
      riskMetric.textContent = risk.label;
      strategyMetric.textContent = selected.strategy;
    }

    function getSelectedScenes() {
      return Array.from(document.querySelectorAll("#sceneChips .chip.active"))
        .map(chip => chip.dataset.value);
    }

    function generateAnalysis() {
      const knowledge = partKnowledge[state.selectedPart] || partKnowledge["肩关节"];
      const scenes = getSelectedScenes();
      const duration = durationInput.value.trim() || "未填写";
      const symptom = symptomInput.value.trim() || "未填写";
      const risk = getRiskLevel();
      const redFlags = [
        "剧烈疼痛、明显肿胀或外伤后无法负重",
        "麻木、放射痛、肌力下降或夜间痛持续加重",
        "休息 3-5 天仍无改善，或同一部位反复发作"
      ];

      resultBody.innerHTML = `
        <div class="analysis-card">
          <h3>输入摘要</h3>
          <div class="card-content">
            <div class="tag-row">
              <span class="risk-tag">区域：${state.selectedPart}</span>
              <span class="risk-tag">场景：${scenes.join(" / ") || "未选择"}</span>
              <span class="risk-tag ${risk.className}">强度：${state.pain}/10</span>
            </div>
            <p style="margin:12px 0 0;">持续时间：${escapeHtml(duration)}</p>
            <p style="margin:6px 0 0;">症状描述：${escapeHtml(symptom)}</p>
          </div>
        </div>

        <div class="analysis-card">
          <h3>专业结构说明</h3>
          <div class="card-content">${knowledge.anatomy}</div>
        </div>

        <div class="analysis-card">
          <h3>可能原因分析</h3>
          <div class="card-content">
            <ul>${knowledge.causes.map(item => `<li>${item}</li>`).join("")}</ul>
          </div>
        </div>

        <div class="analysis-card">
          <h3>缓解与恢复建议</h3>
          <div class="card-content">
            <ul>${knowledge.relief.map(item => `<li>${item}</li>`).join("")}</ul>
          </div>
        </div>

        <div class="analysis-card">
          <h3>风险评估</h3>
          <div class="card-content">
            <div class="progress" aria-label="风险进度"><span style="--value:${risk.width};"></span></div>
            <p style="margin:10px 0 0;">当前模拟风险等级为 <strong>${risk.label}</strong>。建议以 24-48 小时为观察窗口，根据疼痛变化决定是否恢复训练或进一步检查。</p>
            <div class="notice">红旗提示：${redFlags.join("；")}。出现以上情况时，应停止自行训练并寻求医生或康复治疗师评估。</div>
          </div>
        </div>
      `;
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    bodyList.addEventListener("click", event => {
      const item = event.target.closest("[data-part]");
      if (!item) return;
      syncSelection(item.dataset.part);
    });

    document.querySelectorAll(".part").forEach(part => {
      part.addEventListener("click", () => syncSelection(part.dataset.part));
      part.addEventListener("mouseenter", () => {
        document.querySelectorAll(`[data-part="${part.dataset.part}"]`).forEach(el => el.classList.add("focused"));
      });
      part.addEventListener("mouseleave", () => {
        document.querySelectorAll(".focused").forEach(el => el.classList.remove("focused"));
      });
    });

    document.getElementById("sceneChips").addEventListener("click", event => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      chip.classList.toggle("active");
    });

    painRange.addEventListener("input", () => {
      state.pain = Number(painRange.value);
      painValue.textContent = String(state.pain);
      updateMetrics();
    });

    document.querySelectorAll(".segmented button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".segmented button").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        setModelView(button.dataset.view);
      });
    });

    document.getElementById("rotateBtn").addEventListener("click", () => {
      const current = Number.parseFloat(getComputedStyle(bodyModel).getPropertyValue("--rotate-y")) || -10;
      bodyModel.style.setProperty("--rotate-y", `${current + 45}deg`);
    });

    document.getElementById("analyzeBtn").addEventListener("click", generateAnalysis);
    document.getElementById("mobileAnalyzeBtn").addEventListener("click", generateAnalysis);

    document.getElementById("resetBtn").addEventListener("click", () => {
      syncSelection("肩关节");
      state.pain = 5;
      painRange.value = "5";
      painValue.textContent = "5";
      durationInput.value = "3 天，运动后加重，休息后缓解";
      symptomInput.value = "右肩和颈部紧绷，抬手时肩前侧有牵拉感，最近久坐写代码较多，晚上健身做过推举训练。";
      document.querySelectorAll("#sceneChips .chip").forEach(chip => {
        chip.classList.toggle("active", chip.dataset.value === "久坐办公");
      });
      resultBody.innerHTML = `
        <div class="empty-state">
          <div>
            <strong>等待生成分析</strong>
            <span>点击左侧按钮后，这里会展示模拟的大模型运动康复分析。</span>
          </div>
        </div>
      `;
      updateMetrics();
    });

    renderBodyList();
    updateMetrics();
  </script>
</body>
</html>
