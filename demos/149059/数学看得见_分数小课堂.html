<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>数学看得见 - 分数小课堂</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif; }

/* ===== 颜色变量 ===== */
:root {
  --bg: #FFF8F0;
  --primary: #FF8C42;
  --primary-light: #FFB07A;
  --secondary: #4ECDC4;
  --accent: #FF6B6B;
  --purple: #A78BFA;
  --blue: #60A5FA;
  --green: #34D399;
  --yellow: #FBBF24;
  --text: #2D3436;
  --text-light: #636E72;
  --card: #FFFFFF;
  --shadow: 0 8px 32px rgba(0,0,0,0.08);
  --radius: 24px;
  --radius-sm: 16px;
}

/* ===== 页面容器 ===== */
.page { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
.page.active { display: flex; flex-direction: column; }
.page-home { background: linear-gradient(135deg, #FFF8F0 0%, #FFE8D6 100%); }
.page-scene { background: var(--bg); }

/* ===== 首页 ===== */
.home-title { text-align: center; padding: 40px 20px 10px; }
.home-title h1 { font-size: 36px; color: var(--text); }
.home-title h1 span { color: var(--primary); }
.home-title p { font-size: 16px; color: var(--text-light); margin-top: 6px; }
.home-subtitle { text-align: center; font-size: 14px; color: var(--text-light); padding: 0 20px 20px; }
.home-grid { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 0 20px 30px; justify-content: center; max-width: 500px; margin: 0 auto; width: 100%; }
.home-card { background: var(--card); border-radius: var(--radius); padding: 20px 24px; box-shadow: var(--shadow); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; display: flex; align-items: center; gap: 16px; border: 3px solid transparent; touch-action: manipulation; }
.home-card:active { transform: scale(0.97); box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
.home-card .icon { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
.home-card .info h3 { font-size: 18px; color: var(--text); }
.home-card .info p { font-size: 13px; color: var(--text-light); margin-top: 2px; }
.home-card:nth-child(1) .icon { background: #FFE8D6; }
.home-card:nth-child(1) { border-color: #FFE0C0; }
.home-card:nth-child(2) .icon { background: #D4F5F2; }
.home-card:nth-child(2) { border-color: #B8EDE8; }
.home-card:nth-child(3) .icon { background: #E8E0FF; }
.home-card:nth-child(3) { border-color: #D5C8FF; }

/* ===== 场景通用 ===== */
.scene-header { display: flex; align-items: center; padding: 16px 16px 8px; gap: 8px; }
.scene-back { width: 40px; height: 40px; border-radius: 12px; border: none; background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,0.06); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); touch-action: manipulation; }
.scene-back:active { transform: scale(0.9); }
.scene-title { font-size: 18px; font-weight: 600; color: var(--text); flex: 1; }
.scene-body { flex: 1; display: flex; flex-direction: column; padding: 4px 16px 16px; overflow: hidden; }
.scene-instruction { text-align: center; font-size: 15px; color: var(--text-light); padding: 6px 0 10px; min-height: 32px; transition: all 0.3s; }
.scene-canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; position: relative; }
.scene-canvas-wrap canvas { width: 100%; height: 100%; max-width: 340px; max-height: 340px; touch-action: none; border-radius: var(--radius-sm); background: var(--card); box-shadow: var(--shadow); }
.scene-controls { padding: 10px 0 4px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.scene-btn { padding: 10px 20px; border-radius: 12px; border: 2px solid #E8E8E8; background: var(--card); font-size: 15px; font-weight: 500; color: var(--text); cursor: pointer; transition: all 0.2s; touch-action: manipulation; }
.scene-btn:active { transform: scale(0.93); }
.scene-btn.active { border-color: var(--primary); background: #FFF0E6; color: var(--primary); }
.scene-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.scene-btn.primary:active { background: #E07A30; }
.scene-btn.secondary { background: var(--secondary); color: #fff; border-color: var(--secondary); }
.scene-btn.small { padding: 6px 14px; font-size: 13px; }
.scene-result { text-align: center; padding: 8px 0; min-height: 48px; display: flex; align-items: center; justify-content: center; }
.scene-result-text { font-size: 22px; font-weight: 700; color: var(--primary); opacity: 0; transform: scale(0.5); transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
.scene-result-text.show { opacity: 1; transform: scale(1); }
.scene-result-text .sub { font-size: 14px; font-weight: 400; color: var(--text-light); display: block; margin-top: 2px; }

/* ===== 场景2/3 双画布 ===== */
.dual-canvas { display: flex; gap: 8px; flex: 1; min-height: 0; }
.dual-canvas .canvas-col { flex: 1; display: flex; flex-direction: column; align-items: center; }
.dual-canvas .canvas-col canvas { width: 100%; max-width: 160px; max-height: 160px; touch-action: none; border-radius: 12px; background: var(--card); box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
.dual-canvas .canvas-label { font-size: 14px; font-weight: 600; color: var(--text); margin-top: 4px; }
.operator-symbol { font-size: 28px; font-weight: 700; color: var(--primary); display: flex; align-items: center; justify-content: center; padding: 0 4px; }
.result-area { padding: 6px 0 0; text-align: center; }
.result-area .result-text { font-size: 22px; font-weight: 700; color: var(--primary); opacity: 0; transform: scale(0.5); transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
.result-area .result-text.show { opacity: 1; transform: scale(1); }

/* ===== 庆祝动画 ===== */
.confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; overflow: hidden; }
.confetti-piece { position: absolute; width: 10px; height: 10px; border-radius: 2px; animation: confettiFall linear forwards; }
@keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

/* ===== 响应式 ===== */
@media (min-width: 768px) {
  .home-title h1 { font-size: 44px; }
  .home-grid { max-width: 500px; gap: 16px; }
  .scene-canvas-wrap canvas { max-width: 400px; max-height: 400px; }
  .dual-canvas .canvas-col canvas { max-width: 200px; max-height: 200px; }
}
</style>
</head>
<body>

<!-- ========== 首页 ========== -->
<div id="page-home" class="page active page-home">
  <div class="home-title">
    <h1>数学<span>看得见</span></h1>
    <p>用手指划一划，分数就懂了</p>
  </div>
  <div class="home-subtitle">👇 选择一个场景开始学习</div>
  <div class="home-grid">
    <div class="home-card" onclick="goScene('fraction')">
      <div class="icon">🍕</div>
      <div class="info"><h3>认识分数</h3><p>切蛋糕、选一块，看懂分数是什么</p></div>
    </div>
    <div class="home-card" onclick="goScene('add')">
      <div class="icon">➕</div>
      <div class="info"><h3>分数相加</h3><p>同分母分数加在一起，看看等于多少</p></div>
    </div>
    <div class="home-card" onclick="goScene('compare')">
      <div class="icon">⚖️</div>
      <div class="info"><h3>比较大小</h3><p>两个分数比一比，谁大谁小</p></div>
    </div>
  </div>
</div>

<!-- ========== 场景1：认识分数 ========== -->
<div id="page-fraction" class="page page-scene">
  <div class="scene-header">
    <button class="scene-back" onclick="goHome()">‹</button>
    <span class="scene-title">🍕 认识分数</span>
  </div>
  <div class="scene-body">
    <div class="scene-instruction" id="fract-instr">选择要切成几份，然后划线切蛋糕</div>
    <div class="scene-canvas-wrap">
      <canvas id="fract-canvas"></canvas>
    </div>
    <div class="scene-controls" id="fract-controls">
      <button class="scene-btn active" data-parts="2" onclick="setFractParts(2)">2份</button>
      <button class="scene-btn" data-parts="3" onclick="setFractParts(3)">3份</button>
      <button class="scene-btn" data-parts="4" onclick="setFractParts(4)">4份</button>
      <button class="scene-btn" data-parts="6" onclick="setFractParts(6)">6份</button>
      <button class="scene-btn" data-parts="8" onclick="setFractParts(8)">8份</button>
    </div>
    <div class="scene-result" id="fract-result">
      <div class="scene-result-text" id="fract-result-text">✋ 点一下任意一块</div>
    </div>
  </div>
</div>

<!-- ========== 场景2：分数相加 ========== -->
<div id="page-add" class="page page-scene">
  <div class="scene-header">
    <button class="scene-back" onclick="goHome()">‹</button>
    <span class="scene-title">➕ 分数相加</span>
  </div>
  <div class="scene-body">
    <div class="scene-instruction" id="add-instr">选择两个分数，看看它们加起来是多少</div>
    <div class="dual-canvas">
      <div class="canvas-col">
        <canvas id="add-canvas1"></canvas>
        <div class="canvas-label" id="add-label1">1/4</div>
        <div class="scene-controls" style="padding:4px 0;gap:4px;">
          <button class="scene-btn small" onclick="adjustAdd(0,-1)">−</button>
          <span id="add-num1" style="font-size:14px;font-weight:600;min-width:40px;text-align:center;">1</span>
          <button class="scene-btn small" onclick="adjustAdd(0,1)">+</button>
        </div>
      </div>
      <div class="operator-symbol">+</div>
      <div class="canvas-col">
        <canvas id="add-canvas2"></canvas>
        <div class="canvas-label" id="add-label2">1/4</div>
        <div class="scene-controls" style="padding:4px 0;gap:4px;">
          <button class="scene-btn small" onclick="adjustAdd(1,-1)">−</button>
          <span id="add-num2" style="font-size:14px;font-weight:600;min-width:40px;text-align:center;">1</span>
          <button class="scene-btn small" onclick="adjustAdd(1,1)">+</button>
        </div>
      </div>
    </div>
    <div class="scene-controls" style="padding:4px 0;">
      <button class="scene-btn" data-den="4" onclick="setAddDen(4)">分母4</button>
      <button class="scene-btn active" data-den="6" onclick="setAddDen(6)">分母6</button>
      <button class="scene-btn" data-den="8" onclick="setAddDen(8)">分母8</button>
    </div>
    <div class="result-area">
      <div class="result-text" id="add-result-text">👆 调整分数看看结果</div>
    </div>
  </div>
</div>

<!-- ========== 场景3：比较大小 ========== -->
<div id="page-compare" class="page page-scene">
  <div class="scene-header">
    <button class="scene-back" onclick="goHome()">‹</button>
    <span class="scene-title">⚖️ 比较大小</span>
  </div>
  <div class="scene-body">
    <div class="scene-instruction" id="comp-instr">调整两个分数，比一比谁大谁小</div>
    <div class="dual-canvas">
      <div class="canvas-col">
        <canvas id="comp-canvas1"></canvas>
        <div class="canvas-label" id="comp-label1">1/4</div>
        <div class="scene-controls" style="padding:4px 0;gap:4px;">
          <button class="scene-btn small" onclick="adjustComp(0,-1)">−</button>
          <span id="comp-num1" style="font-size:14px;font-weight:600;min-width:40px;text-align:center;">1</span>
          <button class="scene-btn small" onclick="adjustComp(0,1)">+</button>
        </div>
        <div class="scene-controls" style="padding:2px 0;gap:4px;">
          <button class="scene-btn small" data-den="3" onclick="setCompDen(0,3)">3</button>
          <button class="scene-btn small active" data-den="4" onclick="setCompDen(0,4)">4</button>
          <button class="scene-btn small" data-den="6" onclick="setCompDen(0,6)">6</button>
          <button class="scene-btn small" data-den="8" onclick="setCompDen(0,8)">8</button>
        </div>
      </div>
      <div class="operator-symbol" id="comp-operator">?</div>
      <div class="canvas-col">
        <canvas id="comp-canvas2"></canvas>
        <div class="canvas-label" id="comp-label2">1/3</div>
        <div class="scene-controls" style="padding:4px 0;gap:4px;">
          <button class="scene-btn small" onclick="adjustComp(1,-1)">−</button>
          <span id="comp-num2" style="font-size:14px;font-weight:600;min-width:40px;text-align:center;">1</span>
          <button class="scene-btn small" onclick="adjustComp(1,1)">+</button>
        </div>
        <div class="scene-controls" style="padding:2px 0;gap:4px;">
          <button class="scene-btn small active" data-den="3" onclick="setCompDen(1,3)">3</button>
          <button class="scene-btn small" data-den="4" onclick="setCompDen(1,4)">4</button>
          <button class="scene-btn small" data-den="6" onclick="setCompDen(1,6)">6</button>
          <button class="scene-btn small" data-den="8" onclick="setCompDen(1,8)">8</button>
        </div>
      </div>
    </div>
    <div class="result-area">
      <div class="result-text" id="comp-result-text">👆 调整分数比一比</div>
    </div>
  </div>
</div>

<!-- ===== 庆祝容器 ===== -->
<div class="confetti-container" id="confetti-box"></div>

<script>
// ============================================================
//  全局状态
// ============================================================
const State = {
  // 场景1
  fract: { parts: 2, selected: -1, cutLines: [], drawnAngle: null },
  // 场景2
  add: { den: 6, nums: [1, 1] },
  // 场景3
  comp: { dens: [4, 3], nums: [1, 1] }
};

// ============================================================
//  页面切换
// ============================================================
function goHome() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-home').classList.add('active');
}

function goScene(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  // 延迟到页面显示后初始化画布
  setTimeout(() => {
    if (name === 'fraction') initFractCanvas();
    else if (name === 'add') { initAddCanvas(); drawAdd(); }
    else if (name === 'compare') { initCompCanvas(); drawComp(); }
  }, 100);
}

// ============================================================
//  Canvas 工具
// ============================================================
function getCtx(id) {
  const c = document.getElementById(id);
  const rect = c.parentElement.getBoundingClientRect();
  const size = Math.min(rect.width - 8, rect.height - 8, 340);
  c.width = size * devicePixelRatio;
  c.height = size * devicePixelRatio;
  c.style.width = size + 'px';
  c.style.height = size + 'px';
  const ctx = c.getContext('2d');
  ctx.scale(devicePixelRatio, devicePixelRatio);
  return { ctx, c, size };
}

function drawCircle(ctx, cx, cy, r, fillColor, strokeColor) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = fillColor || '#FFF5E6';
  ctx.fill();
  ctx.strokeStyle = strokeColor || '#DDD';
  ctx.lineWidth = 2;
  ctx.stroke();
}

// 绘制扇形（从12点钟方向顺时针）
function drawSector(ctx, cx, cy, r, startAngle, endAngle, color) {
  const s = startAngle - Math.PI / 2;
  const e = endAngle - Math.PI / 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, r, s, e);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawDividingLines(ctx, cx, cy, r, parts) {
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < parts; i++) {
    const angle = (i / parts) * Math.PI * 2 - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
    ctx.stroke();
  }
}

function getSectorAtPoint(px, py, cx, cy, r, parts) {
  const dx = px - cx, dy = py - cy;
  if (dx * dx + dy * dy > r * r) return -1;
  let angle = Math.atan2(dy, dx) + Math.PI / 2;
  if (angle < 0) angle += Math.PI * 2;
  const idx = Math.floor(angle / (Math.PI * 2 / parts));
  return idx >= 0 && idx < parts ? idx : -1;
}

// ============================================================
//  庆祝动画
// ============================================================
function fireConfetti() {
  const box = document.getElementById('confetti-box');
  const colors = ['#FF8C42','#FF6B6B','#4ECDC4','#FBBF24','#A78BFA','#60A5FA','#34D399'];
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + '%';
    el.style.top = '-10px';
    el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = (6 + Math.random() * 8) + 'px';
    el.style.height = (6 + Math.random() * 8) + 'px';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    el.style.animationDelay = (Math.random() * 0.6) + 's';
    box.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

// ============================================================
//  场景1：认识分数（划线切 + 选中）
// ============================================================
let fractCtx = null, fractC = null, fractSize = 0;
let fractDrawState = { isDrawing: false, drawnAngle: null, showSectors: false, hoverIdx: -1, selectedIdx: -1, animPhase: 0 };

function initFractCanvas() {
  const r = getCtx('fract-canvas');
  fractCtx = r.ctx; fractC = r.c; fractSize = r.size;
  fractDrawState = { isDrawing: false, drawnAngle: null, showSectors: false, hoverIdx: -1, selectedIdx: -1, animPhase: 0 };
  fractDrawState.showSectors = true;
  drawFract();
  setupFractTouch();
}

function drawFract() {
  const ctx = fractCtx, s = fractSize, parts = State.fract.parts;
  const cx = s / 2, cy = s / 2, r = s * 0.38;
  ctx.clearRect(0, 0, s, s);

  // 背景圆
  drawCircle(ctx, cx, cy, r, '#FFF5E6', '#E0D0B8');

  if (fractDrawState.showSectors) {
    const colors = ['#FF8C42','#4ECDC4','#FBBF24','#A78BFA','#FF6B6B','#60A5FA','#34D399','#F97316'];
    for (let i = 0; i < parts; i++) {
      const sa = (i / parts) * Math.PI * 2;
      const ea = ((i + 1) / parts) * Math.PI * 2;
      let color = colors[i % colors.length];
      if (i === fractDrawState.selectedIdx) color = '#FF6B6B';
      else if (i === fractDrawState.hoverIdx) color = lightenColor(colors[i % colors.length], 30);
      drawSector(ctx, cx, cy, r, sa, ea, color);
    }
    drawDividingLines(ctx, cx, cy, r, parts);
    // 外圈
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = '#D0B898';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  // 如果选中，显示分数标签
  if (fractDrawState.selectedIdx >= 0) {
    const idx = fractDrawState.selectedIdx;
    const midAngle = ((idx + 0.5) / parts) * Math.PI * 2 - Math.PI / 2;
    const labelR = r * 0.55;
    const lx = cx + labelR * Math.cos(midAngle);
    const ly = cy + labelR * Math.sin(midAngle);
    ctx.save();
    ctx.font = `bold ${Math.round(s * 0.07)}px "PingFang SC", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,0.2)';
    ctx.shadowBlur = 4;
    ctx.fillText('1/' + parts, lx, ly);
    ctx.restore();
  }
}

function lightenColor(hex, percent) {
  const num = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, (num >> 16) + percent);
  const g = Math.min(255, ((num >> 8) & 0xFF) + percent);
  const b = Math.min(255, (num & 0xFF) + percent);
  return `rgb(${r},${g},${b})`;
}

function setupFractTouch() {
  const c = fractC;
  let startX, startY;

  function getPos(e) {
    const rect = c.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top, scale: fractSize / rect.width };
  }

  function onStart(e) {
    e.preventDefault();
    const p = getPos(e);
    startX = p.x * p.scale; startY = p.y * p.scale;
    fractDrawState.isDrawing = true;
    fractDrawState.drawnAngle = null;
    const s = fractSize, cx = s / 2, cy = s / 2, r = s * 0.38;
    const parts = State.fract.parts;
    const idx = getSectorAtPoint(startX, startY, cx, cy, r, parts);
    if (idx >= 0) {
      fractDrawState.hoverIdx = idx;
      drawFract();
    }
  }

  function onMove(e) {
    e.preventDefault();
    const p = getPos(e);
    const px = p.x * p.scale, py = p.y * p.scale;
    const s = fractSize, cx = s / 2, cy = s / 2, r = s * 0.38;
    const parts = State.fract.parts;

    // 划线模式
    if (fractDrawState.isDrawing) {
      const dx = px - startX, dy = py - startY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 20) {
        const angle = Math.atan2(dy, dx);
        fractDrawState.drawnAngle = angle;
        // 划线时显示分割线
        drawFract();
        // 绘制划线
        const ctx = fractCtx;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(px, py);
        ctx.strokeStyle = '#FF6B6B';
        ctx.lineWidth = 3;
        ctx.setLineDash([6,4]);
        ctx.stroke();
        ctx.restore();
        return;
      }
    }

    // 悬停
    const idx = getSectorAtPoint(px, py, cx, cy, r, parts);
    if (idx !== fractDrawState.hoverIdx) {
      fractDrawState.hoverIdx = idx;
      drawFract();
    }
  }

  function onEnd(e) {
    e.preventDefault();
    const s = fractSize, cx = s / 2, cy = s / 2, r = s * 0.38;
    const parts = State.fract.parts;

    if (fractDrawState.drawnAngle !== null) {
      // 划线完成 — 自动选中对应的扇形
      const angle = fractDrawState.drawnAngle + Math.PI / 2;
      let a = angle;
      if (a < 0) a += Math.PI * 2;
      const idx = Math.floor(a / (Math.PI * 2 / parts)) % parts;
      fractDrawState.selectedIdx = idx;
      fractDrawState.showSectors = true;
      fractDrawState.isDrawing = false;
      fractDrawState.drawnAngle = null;
      drawFract();
      showFractResult(idx);
      fireConfetti();
      return;
    }

    if (fractDrawState.hoverIdx >= 0) {
      fractDrawState.selectedIdx = fractDrawState.hoverIdx;
      drawFract();
      showFractResult(fractDrawState.hoverIdx);
      fireConfetti();
    }
    fractDrawState.isDrawing = false;
    fractDrawState.drawnAngle = null;
  }

  c.removeEventListener('touchstart', onStart);
  c.removeEventListener('touchmove', onMove);
  c.removeEventListener('touchend', onEnd);
  c.removeEventListener('mousedown', onStart);
  c.removeEventListener('mousemove', onMove);
  c.removeEventListener('mouseup', onEnd);
  c.removeEventListener('mouseleave', onEnd);
  c.addEventListener('touchstart', onStart, { passive: false });
  c.addEventListener('touchmove', onMove, { passive: false });
  c.addEventListener('touchend', onEnd, { passive: false });
  c.addEventListener('mousedown', onStart);
  c.addEventListener('mousemove', onMove);
  c.addEventListener('mouseup', onEnd);
  c.addEventListener('mouseleave', onEnd);
}

function showFractResult(idx) {
  const parts = State.fract.parts;
  const el = document.getElementById('fract-result-text');
  el.textContent = `你选中了 1/${parts}！`;
  el.className = 'scene-result-text show';
  document.getElementById('fract-instr').textContent = `🎉 太棒了！这就是 1/${parts} 的含义，试试再切一次吧`;
}

function setFractParts(n) {
  State.fract.parts = n;
  fractDrawState.selectedIdx = -1;
  fractDrawState.hoverIdx = -1;
  fractDrawState.showSectors = true;
  // 更新按钮状态
  document.querySelectorAll('#fract-controls .scene-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.parts) === n);
  });
  // 重置结果
  const el = document.getElementById('fract-result-text');
  el.textContent = '✋ 划线切蛋糕，然后点一下任意一块';
  el.className = 'scene-result-text';
  document.getElementById('fract-instr').textContent = '选择要切成几份，然后划线切蛋糕';
  drawFract();
}

// ============================================================
//  场景2：分数相加
// ============================================================
let addCtx1, addCtx2, addSize1, addSize2;

function initAddCanvas() {
  const r1 = getCtx('add-canvas1');
  addCtx1 = r1.ctx; addSize1 = r1.size;
  const r2 = getCtx('add-canvas2');
  addCtx2 = r2.ctx; addSize2 = r2.size;
}

function drawAdd() {
  const parts = State.add.den;
  const num1 = State.add.nums[0], num2 = State.add.nums[1];
  drawFractionCircle(addCtx1, addSize1, num1, parts, '#FF8C42');
  drawFractionCircle(addCtx2, addSize2, num2, parts, '#4ECDC4');
  document.getElementById('add-label1').textContent = `${num1}/${parts}`;
  document.getElementById('add-label2').textContent = `${num2}/${parts}`;
  document.getElementById('add-num1').textContent = num1;
  document.getElementById('add-num2').textContent = num2;
  // 计算结果
  const sumNum = num1 + num2;
  const el = document.getElementById('add-result-text');
  if (sumNum < parts) {
    el.textContent = `${num1}/${parts} + ${num2}/${parts} = ${sumNum}/${parts}`;
  } else if (sumNum === parts) {
    el.textContent = `${num1}/${parts} + ${num2}/${parts} = 1 🎉`;
  } else {
    const whole = Math.floor(sumNum / parts);
    const rem = sumNum % parts;
    el.textContent = rem > 0 ? `${num1}/${parts} + ${num2}/${parts} = ${whole}又${rem}/${parts}` : `${num1}/${parts} + ${num2}/${parts} = ${whole} 🎉`;
  }
  el.className = 'result-text show';
  fireConfetti();
}

function drawFractionCircle(ctx, s, num, parts, color) {
  const cx = s / 2, cy = s / 2, r = s * 0.38;
  ctx.clearRect(0, 0, s, s);
  drawCircle(ctx, cx, cy, r, '#FFF5E6', '#E0D0B8');
  const colors = [color, '#E0E0E0'];
  for (let i = 0; i < parts; i++) {
    const sa = (i / parts) * Math.PI * 2;
    const ea = ((i + 1) / parts) * Math.PI * 2;
    drawSector(ctx, cx, cy, r, sa, ea, i < num ? color : '#F0EDE8');
  }
  drawDividingLines(ctx, cx, cy, r, parts);
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#D0B898';
  ctx.lineWidth = 2.5;
  ctx.stroke();
}

function setAddDen(n) {
  State.add.den = n;
  State.add.nums = [Math.min(State.add.nums[0], n - 1), Math.min(State.add.nums[1], n - 1)];
  document.querySelectorAll('#page-add .scene-controls .scene-btn[data-den]').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.den) === n);
  });
  drawAdd();
}

function adjustAdd(idx, delta) {
  const parts = State.add.den;
  State.add.nums[idx] = Math.max(0, Math.min(parts - 1, State.add.nums[idx] + delta));
  drawAdd();
}

// ============================================================
//  场景3：比较大小
// ============================================================
let compCtx1, compCtx2, compSize1, compSize2;

function initCompCanvas() {
  const r1 = getCtx('comp-canvas1');
  compCtx1 = r1.ctx; compSize1 = r1.size;
  const r2 = getCtx('comp-canvas2');
  compCtx2 = r2.ctx; compSize2 = r2.size;
}

function drawComp() {
  const d1 = State.comp.dens[0], d2 = State.comp.dens[1];
  const n1 = Math.min(State.comp.nums[0], d1 - 1);
  const n2 = Math.min(State.comp.nums[1], d2 - 1);
  State.comp.nums[0] = n1; State.comp.nums[1] = n2;
  drawFractionCircle(compCtx1, compSize1, n1, d1, '#A78BFA');
  drawFractionCircle(compCtx2, compSize2, n2, d2, '#60A5FA');
  document.getElementById('comp-label1').textContent = `${n1}/${d1}`;
  document.getElementById('comp-label2').textContent = `${n2}/${d2}`;
  document.getElementById('comp-num1').textContent = n1;
  document.getElementById('comp-num2').textContent = n2;
  // 比较
  const v1 = n1 / d1, v2 = n2 / d2;
  const opEl = document.getElementById('comp-operator');
  const resultEl = document.getElementById('comp-result-text');
  if (v1 > v2) {
    opEl.textContent = '>';
    resultEl.textContent = `${n1}/${d1}  >  ${n2}/${d2}，左边更大！`;
  } else if (v1 < v2) {
    opEl.textContent = '<';
    resultEl.textContent = `${n1}/${d1}  <  ${n2}/${d2}，右边更大！`;
  } else {
    opEl.textContent = '=';
    resultEl.textContent = `${n1}/${d1}  =  ${n2}/${d2}，一样大！`;
  }
  resultEl.className = 'result-text show';
}

function adjustComp(idx, delta) {
  const d = State.comp.dens[idx];
  State.comp.nums[idx] = Math.max(0, Math.min(d - 1, State.comp.nums[idx] + delta));
  drawComp();
}

function setCompDen(idx, n) {
  State.comp.dens[idx] = n;
  State.comp.nums[idx] = Math.min(State.comp.nums[idx], n - 1);
  // 更新按钮
  document.querySelectorAll(`#page-compare .canvas-col:nth-child(${idx === 0 ? 1 : 3}) .scene-btn[data-den]`).forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.den) === n);
  });
  drawComp();
}

// ============================================================
//  窗口大小变化自适应
// ============================================================
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const active = document.querySelector('.page.active');
    if (!active) return;
    const id = active.id;
    if (id === 'page-fraction') initFractCanvas();
    else if (id === 'page-add') { initAddCanvas(); drawAdd(); }
    else if (id === 'page-compare') { initCompCanvas(); drawComp(); }
  }, 200);
});
</script>
