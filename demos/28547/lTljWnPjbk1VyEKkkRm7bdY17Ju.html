<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭菜单 - 厨房派单</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');

  :root {
    --bg: #FAF6F0;
    --card: #FFFFFF;
    --ink: #2D2A26;
    --ink-soft: #8A8378;
    --tomato: #E8543E;
    --tomato-soft: #FBE6E2;
    --learned: #5B8C5A;
    --learned-bg: #EBF3E8;
    --messed: #D98C3D;
    --messed-bg: #FBF1E2;
    --untried: #B8B0A6;
    --untried-bg: #F2EFE9;
    --line: #ECE6DC;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Noto Sans SC", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
  }

  .phone {
    width: 390px;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  /* ── status bar ── */
  .status-bar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }

  /* ── nav header ── */
  .nav-header {
    padding: 4px 20px 18px;
  }

  .nav-eyebrow {
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .nav-title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .nav-title {
    font-family: "Zhi Mang Xing", cursive;
    font-size: 32px;
    color: var(--ink);
    line-height: 1;
  }

  .family-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 5px 12px 5px 6px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .avatar-stack {
    display: flex;
  }

  .avatar-stack .a {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--bg);
    margin-left: -8px;
    font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 600;
  }
  .avatar-stack .a:first-child { margin-left: 0; }

  /* ── tabs (member filter) ── */
  .member-tabs {
    display: flex;
    gap: 8px;
    padding: 0 20px 16px;
    overflow-x: auto;
  }

  .member-tab {
    flex-shrink: 0;
    padding: 7px 16px;
    border-radius: 18px;
    font-size: 13px;
    font-weight: 500;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }

  .member-tab.active {
    background: var(--tomato);
    border-color: var(--tomato);
    color: #fff;
  }

  /* ── section label ── */
  .section-label {
    padding: 6px 20px 12px;
    font-size: 13px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .section-label .count {
    background: var(--tomato-soft);
    color: var(--tomato);
    font-weight: 700;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 10px;
  }

  /* ── dish cards ── */
  .dish-list {
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .dish-card {
    background: var(--card);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(45,42,38,0.05);
    position: relative;
  }

  .dish-thumb {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
  }

  .dish-info { flex: 1; min-width: 0; }

  .dish-top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }

  .dish-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
  }

  .dish-tag {
    font-size: 10px;
    color: var(--ink-soft);
    background: var(--untried-bg);
    padding: 2px 6px;
    border-radius: 6px;
    flex-shrink: 0;
    margin-left: 6px;
  }

  .dish-meta {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .skill-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .skill-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .skill-badge.learned { background: var(--learned-bg); color: var(--learned); }
  .skill-badge.messed  { background: var(--messed-bg); color: var(--messed); }
  .skill-badge.untried { background: var(--untried-bg); color: var(--ink-soft); }

  .assign-btn {
    margin-left: auto;
    font-size: 12px;
    font-weight: 600;
    color: var(--tomato);
    background: var(--tomato-soft);
    border: none;
    padding: 6px 12px;
    border-radius: 10px;
  }

  /* ── smart warning toast ── */
  .warn-toast {
    margin: 4px 20px 0;
    background: #2D2A26;
    color: #fff;
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    box-shadow: 0 8px 24px rgba(45,42,38,0.25);
  }

  .warn-icon {
    font-size: 18px;
    flex-shrink: 0;
  }

  .warn-text {
    font-size: 13px;
    line-height: 1.55;
  }

  .warn-text b { color: var(--messed); }

  .warn-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .warn-actions button {
    flex: 1;
    border: none;
    border-radius: 8px;
    padding: 8px 0;
    font-size: 12px;
    font-weight: 600;
  }

  .warn-actions .ghost {
    background: rgba(255,255,255,0.12);
    color: #fff;
  }

  .warn-actions .solid {
    background: var(--tomato);
    color: #fff;
  }

  /* ── bottom nav ── */
  .tab-bar {
    position: sticky;
    bottom: 0;
    background: var(--card);
    border-top: 1px solid var(--line);
    display: flex;
    padding: 8px 0 22px;
    margin-top: 24px;
  }

  .tab-bar .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .tab-bar .tab-item.active { color: var(--tomato); font-weight: 600; }
  .tab-bar .tab-icon { font-size: 20px; }

  .fab {
    position: absolute;
    right: 20px;
    bottom: 90px;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--tomato);
    color: #fff;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(232,84,62,0.35);
    border: none;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="status-bar">
    <span>9:41</span>
    <span>● ● ●</span>
  </div>

  <div class="nav-header">
    <div class="nav-eyebrow">今晚吃什么</div>
    <div class="nav-title-row">
      <div class="nav-title">家庭菜单</div>
      <div class="family-pill">
        <div class="avatar-stack">
          <div class="a" style="background:#E8543E">妈</div>
          <div class="a" style="background:#5B8C5A">爸</div>
          <div class="a" style="background:#D98C3D">我</div>
        </div>
        李家小厨
      </div>
    </div>
  </div>

  <div class="member-tabs">
    <div class="member-tab active">全部 6</div>
    <div class="member-tab">妈妈</div>
    <div class="member-tab">爸爸</div>
    <div class="member-tab">我</div>
    <div class="member-tab">弟弟</div>
  </div>

  <!-- Smart assignment warning -->
  <div class="warn-toast">
    <div class="warn-icon">💡</div>
    <div class="warn-text">
      派单提醒：<b>弟弟</b>对「红烧排骨」的熟练度是 <b>没做过</b>，上次类似的「糖醋里脊」他也<b>做砸了</b>。要不要换个人，或者先发一份简化版做法给他？
      <div class="warn-actions">
        <button class="ghost">仍然派给弟弟</button>
        <button class="solid">换妈妈来做</button>
      </div>
    </div>
  </div>

  <div class="section-label">今晚菜单 <span class="count">4 道</span></div>

  <div class="dish-list">

    <div class="dish-card">
      <div class="dish-thumb" style="background:var(--tomato-soft)">🍖</div>
      <div class="dish-info">
        <div class="dish-top-row">
          <span class="dish-name">红烧排骨</span>
          <span class="dish-tag">家常 · 川菜</span>
        </div>
        <div class="dish-meta">妈妈添加 · 上次做于 3 天前</div>
        <div class="skill-row">
          <span class="skill-badge untried">○ 弟弟：没做过</span>
          <button class="assign-btn">指派</button>
        </div>
      </div>
    </div>

    <div class="dish-card">
      <div class="dish-thumb" style="background:var(--learned-bg)">🥬</div>
      <div class="dish-info">
        <div class="dish-top-row">
          <span class="dish-name">蒜香炒油麦菜</span>
          <span class="dish-tag">快手菜</span>
        </div>
        <div class="dish-meta">我添加 · 5 分钟搞定</div>
        <div class="skill-row">
          <span class="skill-badge learned">✓ 我：已学会</span>
          <button class="assign-btn">指派</button>
        </div>
      </div>
    </div>

    <div class="dish-card">
      <div class="dish-thumb" style="background:var(--messed-bg)">🍲</div>
      <div class="dish-info">
        <div class="dish-top-row">
          <span class="dish-name">番茄牛肉汤</span>
          <span class="dish-tag">汤品</span>
        </div>
        <div class="dish-meta">爸爸添加 · 周末常做</div>
        <div class="skill-row">
          <span class="skill-badge messed">✕ 爸爸：做砸过 2 次</span>
          <button class="assign-btn">指派</button>
        </div>
      </div>
    </div>

    <div class="dish-card">
      <div class="dish-thumb" style="background:var(--tomato-soft)">🍚</div>
      <div class="dish-info">
        <div class="dish-top-row">
          <span class="dish-name">蛋炒饭</span>
          <span class="dish-tag">主食</span>
        </div>
        <div class="dish-meta">妈妈添加 · 全家都会</div>
        <div class="skill-row">
          <span class="skill-badge learned">✓ 妈妈：已学会</span>
          <button class="assign-btn">指派</button>
        </div>
      </div>
    </div>

  </div>

  <button class="fab">+</button>

  <div class="tab-bar">
    <div class="tab-item"><span class="tab-icon">📖</span>菜谱</div>
    <div class="tab-item active"><span class="tab-icon">🍽️</span>家庭菜单</div>
    <div class="tab-item"><span class="tab-icon">🌐</span>广场</div>
    <div class="tab-item"><span class="tab-icon">🕐</span>历史</div>
    <div class="tab-item"><span class="tab-icon">👤</span>我的</div>
  </div>

</div>

</body>
</html>
