<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🐷 小小记账本</title>
<style>
  /* ======== 卡通风格全局基础 ======== */
  * { box-sizing: border-box; margin: 0; padding: 0; pointer-events: auto; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background-color: #87CEEB;
    background-image:
      radial-gradient(circle at 20% 20%, #FFFFFF 2px, transparent 3px),
      radial-gradient(circle at 80% 30%, #FFFFFF 3px, transparent 4px),
      radial-gradient(circle at 50% 70%, #FFFFFF 2px, transparent 3px),
      radial-gradient(circle at 15% 80%, #FFFFFF 4px, transparent 5px),
      radial-gradient(circle at 90% 85%, #FFFFFF 3px, transparent 4px);
    background-size: 200px 200px;
    color: #4A4A4A;
    min-height: 100vh;
    padding-bottom: 30px;
    pointer-events: auto;
  }

  .app {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 10px 16px;
    position: relative;
    z-index: 1;
  }

  /* ======== 顶部标题栏 ======== */
  .header {
    text-align: center;
    padding: 20px 0 14px;
    position: relative;
  }

  .header h1 {
    font-size: 32px;
    font-weight: 900;
    color: #FF4500;
    text-shadow: 2px 2px 0px #FFD700;
    letter-spacing: 2px;
    animation: titleBounce 3s ease-in-out infinite;
  }

  @keyframes titleBounce {
    0%,100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-4px) rotate(1deg); }
  }

  .header p {
    font-size: 13px;
    color: #D2691E;
    margin-top: 6px;
    font-weight: 700;
  }

  /* ======== Tab 导航 ======== */
  .tabs {
    display: flex;
    background: #FFE4B5;
    border-radius: 24px;
    padding: 6px;
    box-shadow: 4px 4px 0px #FF8C00;
    border: 3px solid #FF8C00;
    margin: 16px 0;
  }

  .tab-btn {
    flex: 1;
    padding: 12px 4px;
    border: none;
    background: transparent;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 800;
    color: #CD853F;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    font-family: inherit;
  }

  .tab-btn.active {
    background: #FF6B6B;
    color: #FFFFFF;
    box-shadow: 0 4px 0px #CC3333;
    transform: translateY(-2px);
  }

  .tab-btn:not(.active):hover {
    color: #FF6B6B;
    background: #FFEFD5;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1); }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ======== 通用卡片 ======== */
  .card {
    background: #FFF3CD;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 5px 5px 0px #FF8C00;
    border: 3px solid #FF8C00;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 16px;
    font-weight: 900;
    color: #FF4500;
    margin-bottom: 14px;
    display: inline-block;
    background: #FFE4B5;
    padding: 4px 12px;
    border-radius: 20px;
    border: 2px solid #FF8C00;
  }

  /* ======== 首页：金额卡片 ======== */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }

  .stat-card {
    border-radius: 20px;
    padding: 16px 8px;
    text-align: center;
    color: #FFFFFF;
    border: 3px solid rgba(0,0,0,0.08);
    box-shadow: 4px 4px 0px rgba(0,0,0,0.12);
    position: relative;
    overflow: hidden;
  }

  /* 每个卡片左上角的小装饰圆 */
  .stat-card::before {
    content: '';
    position: absolute;
    top: -10px; left: -10px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
  }

  .stat-card .label {
    font-size: 13px;
    font-weight: 800;
    opacity: 0.95;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }

  .stat-card .amount {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.5px;
    word-break: break-all;
    text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
  }

  /* 卡通纯色（非渐变）卡片 */
  .stat-income  { background: #43C6AC; border-color: #2E8B75; box-shadow: 4px 4px 0px #2E8B75; }
  .stat-expense { background: #FF6B9D; border-color: #CC3366; box-shadow: 4px 4px 0px #CC3366; }
  .stat-balance { background: #5DADEC; border-color: #2E7DC0; box-shadow: 4px 4px 0px #2E7DC0; }

  /* ======== 最近记录列表 ======== */
  .record-item {
    display: flex;
    align-items: center;
    padding: 12px 10px;
    border-radius: 16px;
    margin-bottom: 8px;
    background: #FFFAF0;
    border: 2px solid #FFE4B5;
    transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }

  .record-item:hover {
    background: #FFF8DC;
    transform: translateX(4px);
    box-shadow: 3px 3px 0px #FF8C00;
  }

  .record-icon {
    font-size: 28px;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    border-radius: 50%;
    border: 3px solid #FFE4B5;
    margin-right: 12px;
    box-shadow: 2px 2px 0px #FF8C00;
    flex-shrink: 0;
  }

  .record-main { flex: 1; min-width: 0; }
  .record-category { font-size: 15px; font-weight: 800; color: #4A4A4A; }
  .record-sub { font-size: 12px; color: #D2691E; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .record-amount {
    font-size: 17px;
    font-weight: 900;
    margin-left: 8px;
    text-align: right;
    flex-shrink: 0;
  }
  .amount-income  { color: #2E8B75; }
  .amount-expense { color: #CC3333; }

  .empty-tip {
    text-align: center;
    color: #CD853F;
    padding: 36px 10px;
    font-size: 15px;
    font-weight: 700;
  }

  /* ======== 卡通大按钮 ======== */
  .big-btn {
    display: block;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 20px;
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s cubic-bezier(0.34,1.56,0.64,1);
    letter-spacing: 1px;
    text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
    position: relative;
    top: 0;
  }

  .big-btn:active {
    top: 4px;
    box-shadow: 0 0 0px currentColor !important;
  }

  .btn-pink   { background: #FF6B6B; color: #FFF; box-shadow: 0 6px 0px #CC3333; }
  .btn-yellow { background: #FFD166; color: #7A4500; box-shadow: 0 6px 0px #CC9900; }
  .btn-green  { background: #43C6AC; color: #FFF; box-shadow: 0 6px 0px #2E8B75; }
  .btn-gray   { background: #F0F0F0; color: #999; box-shadow: 0 6px 0px #CCCCCC; }

  .big-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .big-btn:active { transform: translateY(4px); }

  /* ======== 表单 ======== */
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 14px; font-weight: 800; color: #D2691E; margin-bottom: 8px; display: block; letter-spacing: 0.5px; }

  .type-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .type-btn {
    padding: 16px;
    border: 3px solid #FFE4B5;
    border-radius: 18px;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
    font-family: inherit;
    background: #FFFAF0;
    color: #CD853F;
    transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }

  .type-btn.active-income {
    background: #43C6AC;
    color: #FFFFFF;
    border-color: #2E8B75;
    box-shadow: 0 4px 0px #2E8B75;
    transform: translateY(-2px);
  }

  .type-btn.active-expense {
    background: #FF6B6B;
    color: #FFFFFF;
    border-color: #CC3333;
    box-shadow: 0 4px 0px #CC3333;
    transform: translateY(-2px);
  }

  .amount-input-wrap {
    display: flex;
    align-items: center;
    background: #FFFFFF;
    border: 3px solid #87CEEB;
    border-radius: 18px;
    padding: 0 16px;
    box-shadow: 3px 3px 0px #87CEEB;
    transition: all 0.2s;
  }

  .amount-input-wrap:focus-within {
    border-color: #4169E1;
    box-shadow: 3px 3px 0px #4169E1;
  }

  .amount-symbol {
    font-size: 28px;
    font-weight: 900;
    color: #FF4500;
    margin-right: 8px;
  }

  .amount-input {
    flex: 1;
    border: none;
    outline: none;
    padding: 16px 0;
    font-size: 30px;
    font-weight: 900;
    color: #4A4A4A;
    font-family: inherit;
    background: transparent;
    width: 100%;
  }

  /* 分类网格 */
  .category-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .category-item {
    padding: 12px 4px;
    border: 3px solid #FFE4B5;
    border-radius: 16px;
    background: #FFFAF0;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
    font-family: inherit;
  }

  .category-item .emoji { font-size: 28px; display: block; }
  .category-item .name { font-size: 12px; color: #CD853F; margin-top: 4px; font-weight: 800; }

  .category-item.selected {
    background: #FFD166;
    border-color: #FF8C00;
    box-shadow: 3px 3px 0px #FF8C00;
    transform: translateY(-2px);
  }

  .category-item.selected .name { color: #7A4500; }
  .category-item:hover:not(.selected) { transform: translateY(-2px); border-color: #FF8C00; }

  /* 文本输入框 */
  .text-input, .date-input {
    width: 100%;
    padding: 14px 16px;
    border: 3px solid #87CEEB;
    border-radius: 18px;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    background: #F0F8FF;
    color: #4A4A4A;
    font-weight: 600;
    box-shadow: 3px 3px 0px #87CEEB;
    transition: all 0.2s;
  }

  .text-input:focus, .date-input:focus {
    border-color: #4169E1;
    background: #FFFFFF;
    box-shadow: 3px 3px 0px #4169E1;
  }

  /* 存钱罐选择 */
  .savings-select {
    background: #FFFDE7;
    padding: 14px;
    border-radius: 18px;
    margin-bottom: 16px;
    border: 3px solid #FFD166;
  }

  .savings-select-title {
    font-size: 14px;
    font-weight: 800;
    color: #CC7700;
    margin-bottom: 8px;
  }

  /* 按钮行 */
  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .btn-row .big-btn { margin-bottom: 0; }

  /* ======== 存钱罐目标卡片 ======== */
  .goal-card {
    background: #FFFDE7;
    border-radius: 22px;
    padding: 18px;
    border: 3px solid #FFD166;
    box-shadow: 5px 5px 0px #FF8C00;
    margin-bottom: 14px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }

  .goal-card:hover { transform: translateY(-3px); box-shadow: 5px 8px 0px #FF8C00; }
  .goal-card:active { transform: translateY(2px); }

  .goal-card.done {
    background: #FFF9C4;
    border-color: #FFD700;
    box-shadow: 5px 5px 0px #FF8C00;
  }

  .goal-header {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
  }

  .goal-emoji {
    font-size: 34px;
    margin-right: 12px;
    width: 54px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    border-radius: 50%;
    border: 3px solid #FFE4B5;
    box-shadow: 3px 3px 0px #FF8C00;
    animation: emojiBounce 2s ease-in-out infinite;
  }

  @keyframes emojiBounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  .goal-name {
    font-size: 18px;
    font-weight: 900;
    color: #4A4A4A;
    flex: 1;
  }

  .goal-days {
    font-size: 12px;
    color: #FF4D6D;
    font-weight: 800;
    white-space: nowrap;
    margin-left: 8px;
    background: #FFF0F5;
    padding: 4px 8px;
    border-radius: 12px;
    border: 2px solid #FFD0DC;
  }

  /* 进度条 */
  .progress-bar-wrap {
    background: #FFF0E0;
    border-radius: 14px;
    height: 22px;
    overflow: hidden;
    margin-bottom: 10px;
    border: 2px solid #FFB366;
    box-shadow: inset 2px 2px 4px rgba(0,0,0,0.08);
  }

  .progress-bar {
    height: 100%;
    background: repeating-linear-gradient(
      45deg,
      #FFD166,
      #FFD166 10px,
      #FFBE3D 10px,
      #FFBE3D 20px
    );
    border-radius: 12px;
    width: 0%;
    transition: width 1.2s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 2px 0 6px rgba(255,200,0,0.4);
  }

  .goal-card.done .progress-bar {
    background: repeating-linear-gradient(
      45deg,
      #43C6AC,
      #43C6AC 10px,
      #2E8B75 10px,
      #2E8B75 20px
    );
  }

  .goal-info {
    font-size: 13px;
    color: #CD853F;
    line-height: 1.7;
    font-weight: 600;
  }

  .goal-info .highlight { color: #FF4500; font-weight: 900; }

  /* ======== 弹窗 ======== */
  .modal-mask {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(135, 206, 235, 0.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-mask.show { display: flex; }

  .modal {
    background: #FFF3CD;
    border-radius: 28px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
    border: 4px solid #FF8C00;
    box-shadow: 8px 8px 0px #FF6B00;
    animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7) rotate(-5deg); }
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .modal-title {
    font-size: 20px;
    font-weight: 900;
    color: #FF4D6D;
    text-align: center;
    margin-bottom: 18px;
    text-shadow: 2px 2px 0px #FFD0DC;
  }

  .emoji-picker {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    margin-top: 10px;
  }

  .emoji-option {
    font-size: 26px;
    padding: 8px 0;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    background: #FFFAF0;
    border: 3px solid transparent;
    transition: all 0.15s;
  }

  .emoji-option.selected {
    background: #FFD166;
    border-color: #FF8C00;
    box-shadow: 2px 2px 0px #FF8C00;
    transform: scale(1.1);
  }

  /* ======== 月度报告 ======== */
  .month-switcher {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #FFF3CD;
    border-radius: 18px;
    padding: 8px 12px;
    margin-bottom: 16px;
    border: 3px solid #FF8C00;
    box-shadow: 3px 3px 0px #FF8C00;
  }

  .month-btn {
    border: none;
    background: #FFE4B5;
    padding: 8px 14px;
    border-radius: 14px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    color: #FF4500;
    font-weight: 800;
    border: 2px solid #FF8C00;
    transition: all 0.15s;
  }

  .month-btn:active {
    background: #FF6B6B;
    color: #FFF;
    transform: scale(0.95);
  }

  .month-label {
    font-size: 17px;
    font-weight: 900;
    color: #FF4500;
  }

  /* 分类条形图 */
  .chart-item { margin-bottom: 12px; }

  .chart-row {
    display: flex;
    align-items: center;
    margin-bottom: 5px;
    font-size: 13px;
  }

  .chart-row .cat-name { flex: 1; color: #CD853F; font-weight: 800; }
  .chart-row .cat-amount { color: #FF4500; font-weight: 900; margin-left: 8px; }

  .chart-bar-wrap {
    background: #FFE4B5;
    height: 16px;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid #FFB366;
  }

  .chart-bar {
    height: 100%;
    background: repeating-linear-gradient(
      45deg,
      #FF6B6B,
      #FF6B6B 8px,
      #FF4500 8px,
      #FF4500 16px
    );
    border-radius: 8px;
    width: 0%;
    transition: width 1.2s cubic-bezier(0.34,1.56,0.64,1);
  }

  /* 建议卡片 */
  .advice-card {
    background: #FFF3CD;
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 16px;
    border: 3px solid #FF8C00;
    box-shadow: 4px 4px 0px #FF6B00;
  }

  .advice-card .advice-title {
    font-size: 15px;
    font-weight: 900;
    color: #FF4500;
    margin-bottom: 6px;
  }

  .advice-card .advice-text {
    font-size: 14px;
    color: #CD853F;
    line-height: 1.7;
    font-weight: 600;
  }

  .achievement-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .achievement-item {
    background: #FFFDE7;
    padding: 16px 12px;
    border-radius: 18px;
    text-align: center;
    border: 3px solid #FFD166;
    box-shadow: 3px 3px 0px #FF8C00;
  }

  .achievement-item .big-num {
    font-size: 24px;
    font-weight: 900;
    color: #FF4500;
    display: block;
    text-shadow: 1px 1px 0px rgba(0,0,0,0.08);
  }

  .achievement-item .ach-label {
    font-size: 12px;
    color: #CD853F;
    margin-top: 4px;
    font-weight: 700;
  }

  /* ======== Toast ======== */
  .toast {
    position: fixed;
    top: 28%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    background: #FF6B6B;
    color: #FFFFFF;
    padding: 18px 28px;
    border-radius: 24px;
    font-size: 18px;
    font-weight: 900;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 5px 5px 0px #CC3333;
    border: 3px solid rgba(255,255,255,0.3);
    letter-spacing: 0.5px;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) rotate(-2deg);
  }

  /* ======== 登录 / 注册 ======== */
  .login-mask {
    position: fixed;
    inset: 0;
    background: #87CEEB;
    background-image:
      radial-gradient(circle at 20% 20%, #FFFFFF 2px, transparent 3px),
      radial-gradient(circle at 80% 30%, #FFFFFF 3px, transparent 4px),
      radial-gradient(circle at 50% 70%, #FFFFFF 2px, transparent 3px),
      radial-gradient(circle at 15% 80%, #FFFFFF 4px, transparent 5px),
      radial-gradient(circle at 90% 85%, #FFFFFF 3px, transparent 4px);
    background-size: 200px 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    padding: 16px;
    pointer-events: auto;
  }

  .login-mask.hidden { display: none; }

  /* ===== emoji 蝴蝶结 ===== */
  .bow-wrap {
    text-align: center;
    margin: 0 auto 6px;
    font-size: 70px;
    line-height: 1;
    animation: bowShake 3s ease-in-out infinite;
    transform-origin: center bottom;
    position: relative;
    z-index: 0;
    pointer-events: none;
  }

  /* 蝴蝶结定期晃动动画 */
  @keyframes bowShake {
    0%, 85%, 100% { transform: rotate(0deg) scale(1); }
    88%            { transform: rotate(10deg) scale(1.08); }
    91%            { transform: rotate(-8deg) scale(1.05); }
    94%            { transform: rotate(6deg) scale(1.03); }
    97%            { transform: rotate(-3deg) scale(1.01); }
  }

  /* ===== 登录卡片 ===== */
  .login-box {
    background: #FFF3CD;
    border-radius: 28px;
    padding: 28px 24px;
    width: 100%;
    max-width: 360px;
    border: 5px solid #FF8C00;
    box-shadow: 8px 8px 0px #FF6B00;
    position: relative;
  }

  .login-box .big-title {
    text-align: center;
    font-size: 28px;
    font-weight: 900;
    color: #FF4500;
    margin-bottom: 4px;
    text-shadow: 2px 2px 0px #FFD700;
    letter-spacing: 2px;
  }

  .login-box .sub-title {
    text-align: center;
    font-size: 13px;
    color: #D2691E;
    margin-bottom: 20px;
    font-weight: 700;
  }

  .auth-form-group {
    margin-bottom: 14px;
  }

  #register-form, #login-form {
    position: relative;
  }

  .tab-switcher {
    display: flex;
    background: #FFE4B5;
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 18px;
    border: 3px solid #FF8C00;
    position: relative;
  }

  .tab-switcher button {
    flex: 1;
    padding: 8px;
    border: none;
    background: transparent;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 900;
    color: #CD853F;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    position: relative;
  }

  .tab-switcher button.active {
    background: #FF6B6B;
    color: #FFFFFF;
    box-shadow: 0 4px 0px #CC3333;
    transform: translateY(-2px);
  }

  .auth-form-group { margin-bottom: 14px; }

  .auth-form-group label {
    display: block;
    font-size: 14px;
    font-weight: 800;
    color: #D2691E;
    margin-bottom: 6px;
  }

  .auth-form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 3px solid #87CEEB;
    border-radius: 14px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    background: #F0F8FF;
    color: #333333;
    font-weight: 700;
    transition: all 0.2s;
  }

  .auth-form-group input:focus {
    border-color: #4169E1;
    background: #FFFFFF;
    box-shadow: 0 0 0 3px rgba(65, 105, 225, 0.2);
  }

  .welcome-user {
    display: inline-block;
    background: #FFD166;
    color: #7A4500;
    padding: 5px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 900;
    margin-top: 8px;
    border: 2px solid #CC9900;
    box-shadow: 2px 2px 0px #CC9900;
  }

  .logout-btn {
    display: inline-block;
    margin: 8px 0 0 12px;
    padding: 6px 16px;
    border: none;
    background: #FFF0F5;
    color: #FF4D6D;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    border: 2px solid #FFD0DC;
    vertical-align: middle;
    transition: all 0.15s;
  }

  .logout-btn:hover { background: #FF4D6D; color: #FFF; }

  /* 底部清空按钮 */
  .clear-bottom {
    margin-top: 20px;
    text-align: center;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .clear-btn, .pet-btn {
    display: inline-block;
    padding: 10px 24px;
    background: #FFFAF0;
    color: #CD853F;
    border: 3px dashed #FF8C00;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }

  .clear-btn:hover, .pet-btn:hover {
    background: #FFE4B5;
    transform: translateY(-2px);
  }

  .pet-btn {
    border-style: solid;
    background: #FFD166;
    color: #7A4500;
    border-color: #FF8C00;
  }

  .pet-btn:hover {
    background: #FFE08A;
  }

  /* ======== 宠物中心弹窗 ======== */
  .pet-center-main {
    text-align: center;
    padding: 10px 0;
  }

  .pet-main-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 10px;
  }

  .pet-main-btn {
    padding: 24px 10px;
    border-radius: 20px;
    border: 4px solid #FF8C00;
    background: #FFD166;
    color: #7A4500;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 5px 0px #CC6600;
  }

  .pet-main-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 0px #CC6600;
  }

  .pet-main-btn:active {
    transform: translateY(2px);
    box-shadow: 0 3px 0px #CC6600;
  }

  .pet-main-btn .big-emoji {
    display: block;
    font-size: 48px;
    margin-bottom: 6px;
  }

  .pet-coins-bar {
    background: #FFFDE7;
    padding: 10px 16px;
    border-radius: 20px;
    display: inline-block;
    font-size: 16px;
    font-weight: 900;
    color: #FF4500;
    margin-bottom: 16px;
    border: 3px solid #FFD166;
  }

  /* 宠物二级页面返回按钮 */
  .pet-back-btn {
    display: inline-block;
    padding: 6px 14px;
    background: #FFE4B5;
    color: #CD853F;
    border: 2px solid #FF8C00;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 12px;
    transition: all 0.15s;
  }

  .pet-back-btn:hover { background: #FFD166; }

  .pet-page-title {
    font-size: 20px;
    font-weight: 900;
    color: #FF4500;
    text-shadow: 1px 1px 0px #FFD700;
    margin-bottom: 14px;
  }

  /* ======== 宠物商城 ======== */
  .pet-shop-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .pet-shop-item {
    background: #FFFAF0;
    border-radius: 18px;
    padding: 14px 10px;
    border: 3px solid #FFE4B5;
    text-align: center;
    transition: all 0.2s;
  }

  .pet-shop-item.owned {
    background: #E8F5E9;
    border-color: #81C784;
  }

  .pet-shop-item .emoji {
    font-size: 48px;
    display: block;
    margin-bottom: 4px;
  }

  .pet-shop-item .pet-name {
    font-size: 15px;
    font-weight: 900;
    color: #7A4500;
    margin-bottom: 4px;
  }

  .pet-shop-item.owned .pet-name { color: #2E7D32; }

  .pet-shop-item .price {
    font-size: 13px;
    font-weight: 800;
    color: #FF4500;
    margin-bottom: 8px;
  }

  .pet-shop-item.owned .price {
    color: #2E7D32;
  }

  .pet-buy-btn {
    padding: 6px 14px;
    background: #FF6B6B;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 3px 0px #CC3333;
    transition: all 0.15s;
  }

  .pet-buy-btn:hover { transform: translateY(-1px); }
  .pet-buy-btn:active { transform: translateY(2px); box-shadow: 0 1px 0px #CC3333; }

  .pet-buy-btn.owned {
    background: #81C784;
    box-shadow: 0 3px 0px #4CAF50;
    cursor: default;
  }

  /* ======== 宠物培养 ======== */
  .pet-train {
    text-align: center;
  }

  .pet-switcher {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .pet-switch-btn {
    padding: 8px 16px;
    border-radius: 18px;
    border: 3px solid #FFE4B5;
    background: #FFFAF0;
    color: #CD853F;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }

  .pet-switch-btn.active {
    background: #FFD166;
    border-color: #FF8C00;
    color: #7A4500;
    box-shadow: 0 3px 0px #CC6600;
    transform: translateY(-1px);
  }

  .pet-switch-btn .emoji { margin-right: 4px; }

  .pet-no-pet {
    padding: 30px 10px;
    color: #CD853F;
    font-size: 14px;
    font-weight: 700;
  }

  .pet-display {
    position: relative;
    width: 180px;
    height: 180px;
    margin: 0 auto 12px;
  }

  .pet-emoji {
    font-size: 100px;
    line-height: 180px;
    animation: petBounce 2s ease-in-out infinite;
  }

  @keyframes petBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(1.05); }
  }

  .pet-emoji.happy {
    animation: petHappy 0.6s ease-in-out;
  }

  @keyframes petHappy {
    0%, 100% { transform: translateY(0) rotate(0) scale(1); }
    25% { transform: translateY(-15px) rotate(-5deg) scale(1.1); }
    75% { transform: translateY(-15px) rotate(5deg) scale(1.1); }
  }

  .pet-name-title {
    font-size: 20px;
    font-weight: 900;
    color: #FF4500;
    margin-bottom: 4px;
    text-shadow: 1px 1px 0px #FFD700;
  }

  .pet-level-tag {
    display: inline-block;
    background: #FF6B6B;
    color: white;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 14px;
    border: 2px solid #CC3333;
  }

  .pet-stats {
    background: #FFFAF0;
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 14px;
    border: 3px solid #FFE4B5;
  }

  .pet-stat {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
  }
  .pet-stat:last-child { margin-bottom: 0; }

  .pet-stat-label {
    width: 55px;
    font-size: 13px;
    font-weight: 800;
    color: #CD853F;
    text-align: left;
  }

  .pet-stat-bar {
    flex: 1;
    height: 16px;
    background: #FFE4B5;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid #FFD166;
    margin: 0 10px;
  }

  .pet-stat-fill {
    height: 100%;
    border-radius: 8px;
    transition: width 0.5s ease;
  }

  .pet-stat-fill.hunger { background: linear-gradient(90deg, #FF6B6B, #FF4500); }
  .pet-stat-fill.happy  { background: linear-gradient(90deg, #FFD166, #FF8C00); }
  .pet-stat-fill.energy { background: linear-gradient(90deg, #87CEEB, #4169E1); }

  .pet-stat-val {
    width: 35px;
    font-size: 12px;
    font-weight: 800;
    color: #CD853F;
    text-align: right;
  }

  .pet-actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }

  .pet-action-btn {
    padding: 10px 4px;
    border-radius: 14px;
    border: 3px solid #FF8C00;
    background: #FFD166;
    color: #7A4500;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }

  .pet-action-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 3px 0px #CC6600;
  }

  .pet-action-btn:active {
    transform: translateY(1px);
    box-shadow: 0 1px 0px #CC6600;
  }

  .pet-action-btn .emoji {
    display: block;
    font-size: 24px;
    margin-bottom: 2px;
  }

  .pet-action-btn .cost {
    display: block;
    font-size: 11px;
    color: #B8860B;
    margin-top: 2px;
    font-weight: 700;
  }

  .pet-tip-msg {
    font-size: 12px;
    color: #CD853F;
    font-weight: 600;
    min-height: 18px;
  }

  /* ======== 响应式 ======== */
  @media (max-width: 480px) {
    .stat-card .amount { font-size: 17px; }
    .stat-card .label { font-size: 12px; }
    .category-grid { grid-template-columns: repeat(3, 1fr); }
    .emoji-picker { grid-template-columns: repeat(6, 1fr); }
    .header h1 { font-size: 28px; }
    .tab-btn { font-size: 12px; }
    .achievement-list { grid-template-columns: 1fr 1fr; }
    .goal-emoji { width: 44px; height: 44px; font-size: 26px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- 顶部标题 -->
  <div class="header">
    <h1>🐷 小小记账本</h1>
    <p>陪你一起管理零花钱～</p>
    <div id="user-info" style="display:none;">
      <span class="welcome-user">👋 你好，<span id="current-user-name"></span></span>
      <button class="logout-btn" onclick="logout()">退出登录</button>
    </div>
  </div>

  <!-- Tab 按钮 -->
  <div class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="home">🏠 首页</button>
    <button class="tab-btn" data-tab="record">✏️ 记一笔</button>
    <button class="tab-btn" data-tab="savings">🐽 存钱罐</button>
    <button class="tab-btn" data-tab="report">📊 报告</button>
  </div>

  <!-- ======== Tab 1：首页 ======== -->
  <div class="tab-content active" id="tab-home">
    <div class="stat-grid">
      <div class="stat-card stat-income">
        <div class="label">本月收入 💵</div>
        <div class="amount" id="home-income">¥0.00</div>
      </div>
      <div class="stat-card stat-expense">
        <div class="label">本月支出 💸</div>
        <div class="amount" id="home-expense">¥0.00</div>
      </div>
      <div class="stat-card stat-balance">
        <div class="label">本月结余 💰</div>
        <div class="amount" id="home-balance">¥0.00</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📝 最近 5 条记录</div>
      <div id="recent-list"></div>
    </div>

    <button class="big-btn btn-pink" onclick="switchTab('record')">＋ 记一笔</button>
  </div>

  <!-- ======== Tab 2：记一笔 ======== -->
  <div class="tab-content" id="tab-record">
    <div class="card">
      <div class="form-group">
        <label class="form-label">选择类型</label>
        <div class="type-switch">
          <button type="button" class="type-btn" id="type-income" onclick="setType('income')">💵 收入</button>
          <button type="button" class="type-btn active-expense" id="type-expense" onclick="setType('expense')">💸 支出</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">金额</label>
        <div class="amount-input-wrap">
          <span class="amount-symbol">¥</span>
          <input type="number" class="amount-input" id="amount-input" placeholder="0.00" step="0.01" min="0" inputmode="decimal" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">分类</label>
        <div class="category-grid" id="category-grid"></div>
      </div>

      <div class="form-group">
        <label class="form-label">日期</label>
        <input type="date" class="date-input" id="date-input" />
      </div>

      <div class="form-group">
        <label class="form-label">备注（可选）</label>
        <input type="text" class="text-input" id="note-input" placeholder="写点什么吧～" maxlength="30" />
      </div>

      <div id="savings-area"></div>

      <div class="btn-row">
        <button class="big-btn btn-green" onclick="saveRecord()">✓ 记好啦</button>
      </div>
      <div class="btn-row">
        <button class="big-btn btn-gray" onclick="resetForm()">取消</button>
      </div>
    </div>
  </div>

  <!-- ======== Tab 3：存钱罐 ======== -->
  <div class="tab-content" id="tab-savings">
    <button class="big-btn btn-yellow" onclick="openGoalModal()">＋ 创建新目标</button>
    <div style="height: 16px;"></div>
    <div id="goal-list"></div>
  </div>

  <!-- ======== Tab 4：月度报告 ======== -->
  <div class="tab-content" id="tab-report">
    <div class="month-switcher">
      <button class="month-btn" onclick="changeMonth(-1)">← 上一月</button>
      <span class="month-label" id="report-month-label">2026-06</span>
      <button class="month-btn" onclick="changeMonth(1)">下一月 →</button>
    </div>

    <div class="stat-grid">
      <div class="stat-card stat-income">
        <div class="label">收入 💵</div>
        <div class="amount" id="report-income">¥0.00</div>
      </div>
      <div class="stat-card stat-expense">
        <div class="label">支出 💸</div>
        <div class="amount" id="report-expense">¥0.00</div>
      </div>
      <div class="stat-card stat-balance">
        <div class="label">结余 💰</div>
        <div class="amount" id="report-balance">¥0.00</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📊 各类别支出</div>
      <div id="category-chart"></div>
    </div>

    <div class="advice-card" id="advice-card">
      <div class="advice-title">💡 小小总结</div>
      <div class="advice-text" id="advice-text">这个月还没有记录哦～</div>
    </div>

    <div class="card">
      <div class="card-title">🏆 这个月的小成就</div>
      <div class="achievement-list">
        <div class="achievement-item">
          <span class="big-num" id="ach-days">0</span>
          <span class="ach-label">天连续记账</span>
        </div>
        <div class="achievement-item">
          <span class="big-num" id="ach-goals">0</span>
          <span class="ach-label">个存钱目标达成</span>
        </div>
        <div class="achievement-item">
          <span class="big-num" id="ach-count">0</span>
          <span class="ach-label">条记录</span>
        </div>
        <div class="achievement-item">
          <span class="big-num" id="ach-save-day">¥0</span>
          <span class="ach-label">最省钱的一天</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部按钮区 -->
  <div class="clear-bottom">
    <button class="pet-btn" onclick="openPetCenter()">🐷 宠物中心</button>
    <button class="clear-btn" onclick="clearAllData()">🗑️ 清空所有记录</button>
  </div>
</div>

<!-- 创建/追加 存钱目标 弹窗 -->
<div class="modal-mask" id="goal-modal">
  <div class="modal">
    <div class="modal-title" id="goal-modal-title">🌟 创建新的存钱目标</div>

    <div class="form-group" id="goal-name-wrap">
      <label class="form-label">目标名称</label>
      <input type="text" class="text-input" id="goal-name" placeholder="比如：买乐高" maxlength="15" />
    </div>

    <div class="form-group" id="goal-amount-wrap">
      <label class="form-label">目标金额</label>
      <div class="amount-input-wrap">
        <span class="amount-symbol">¥</span>
        <input type="number" class="amount-input" id="goal-amount" placeholder="200" step="0.01" min="0" inputmode="decimal" style="font-size:22px;padding:12px 0;" />
      </div>
    </div>

    <div class="form-group" id="goal-deadline-wrap">
      <label class="form-label">截止日期</label>
      <input type="date" class="date-input" id="goal-deadline" />
    </div>

    <div class="form-group" id="goal-emoji-wrap">
      <label class="form-label">选一个小图标</label>
      <div class="emoji-picker" id="emoji-picker"></div>
    </div>

    <div class="btn-row">
      <button class="big-btn btn-green" id="goal-save-btn" onclick="saveGoal()">✓ 保存</button>
    </div>
    <div class="btn-row">
      <button class="big-btn btn-gray" onclick="closeGoalModal()">取消</button>
    </div>
  </div>
</div>

<!-- 追加存钱 / 删除 弹窗 -->
<div class="modal-mask" id="goal-action-modal">
  <div class="modal">
    <div class="modal-title" id="goal-action-title">💰 追加存钱</div>
    <div class="form-group">
      <label class="form-label">这次存多少？</label>
      <div class="amount-input-wrap">
        <span class="amount-symbol">¥</span>
        <input type="number" class="amount-input" id="goal-add-amount" placeholder="0.00" step="0.01" min="0" inputmode="decimal" style="font-size:22px;padding:12px 0;" />
      </div>
    </div>
    <div class="btn-row">
      <button class="big-btn btn-green" onclick="addSavingsToGoal()">✓ 存好啦</button>
    </div>
    <div class="btn-row">
      <button class="big-btn btn-yellow" onclick="confirmDeleteGoal()">🗑️ 删除这个目标</button>
    </div>
    <div class="btn-row">
      <button class="big-btn btn-gray" onclick="closeGoalActionModal()">取消</button>
    </div>
  </div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast">✓ 已记录</div>

<!-- ========== 宠物中心 弹窗 ========== -->
<div class="modal-mask" id="pet-modal">
  <div class="modal">
    <div class="modal-title">🐷 宠物中心</div>

    <!-- 主页面：宠物商城 + 宠物培养 -->
    <div id="pet-page-main" class="pet-center-main">
      <div class="pet-coins-bar">💰 宠物金币：<span id="pet-coins-main">0</span></div>
      <div class="pet-main-buttons">
        <button class="pet-main-btn" onclick="showPetPage('shop')">
          <span class="big-emoji">🛒</span>
          宠物商城
        </button>
        <button class="pet-main-btn" onclick="showPetPage('train')">
          <span class="big-emoji">💝</span>
          宠物培养
        </button>
      </div>
    </div>

    <!-- 宠物商城页面 -->
    <div id="pet-page-shop" style="display:none;">
      <button class="pet-back-btn" onclick="showPetPage('main')">← 返回</button>
      <div class="pet-page-title">🛒 宠物商城</div>

    <!-- 宠物培养页面 -->
    <div id="pet-page-train" style="display:none;">

        <input type="text" id="register-username" placeholder="比如：小明" maxlength="20" style="width:100%;padding:12px 14px;border:3px solid #87CEEB;border-radius:14px;font-size:15px;font-family:inherit;outline:none;background:#F0F8FF;color:#333;font-weight:700;"/>

      <button id="register-btn" onclick="doRegister()" style="width:100%;padding:16px;border:none;background:#FFD166;color:#7A4500;border-radius:20px;font-size:18px;font-weight:900;cursor:pointer;font-family:inherit;letter-spacing:1px;box-shadow:0 6px 0 #CC9900;transition:all 0.15s cubic-bezier(0.34,1.56,0.64,1);">✨ 注册</button>
    </div>

<script>
/* ================================================
 * 小小记账本 - 核心逻辑
 * 数据结构：
 *   record: {id, type('income'|'expense'), amount, category, emoji, date, note, savingsTargetId?, savingsAmount?}
 *   goal:   {id, name, targetAmount, deadline, emoji, savedAmount, createdAt}
 * ================================================ */

// -------- 分类预设（与需求一致的 emoji）--------
const CATEGORIES = {
  expense: [
    { key: 'snack',     name: '零食', emoji: '🍟' },
    { key: 'stationery',name: '文具', emoji: '✏️' },
    { key: 'toy',       name: '玩具', emoji: '🧸' },
    { key: 'game',      name: '游戏', emoji: '🎮' },
    { key: 'transport', name: '交通', emoji: '🚌' },
    { key: 'food',      name: '餐饮', emoji: '🍜' },
    { key: 'gift',      name: '礼物', emoji: '🎁' },
    { key: 'book',      name: '书籍', emoji: '📚' },
    { key: 'other-e',   name: '其他', emoji: '❓' }
  ],
  income: [
    { key: 'pocket',    name: '零花钱', emoji: '💵' },
    { key: 'newyear',   name: '压岁钱', emoji: '🧧' },
    { key: 'help',      name: '帮爸妈', emoji: '💰' },
    { key: 'redenvelope',name: '红包', emoji: '🎊' },
    { key: 'award',     name: '奖金',   emoji: '🏆' },
    { key: 'other-i',   name: '其他',   emoji: '❓' }
  ]
};

const GOAL_EMOJIS = ['🎮','🧸','📚','🍦','🚲','🎨','💻','📱','🎧','🎬','🎫','🏖️','🐶','🐱','🍕','🍔','🎂','🧃','⚽','🎯','🎁','🌟','🌈','🍎'];

// -------- 全局状态 --------
const STORAGE_KEY = 'xiaoxiao-ledger-data';
const USERS_KEY = 'xiaoxiao-ledger-users';    // 用户表（用户名 -> 简易哈希密码）
let currentUsername = null;                    // 当前登录的用户名
let records = [];        // 所有记账记录
let goals = [];          // 所有存钱目标
let pet = null;          // 宠物数据
let currentType = 'expense';
let currentCategory = null;
let currentMonth = new Date();   // 月度报告的月份
let editingGoalId = null;        // 弹窗中正在编辑/操作的目标
let selectedGoalEmoji = '🎯';

// -------- 工具函数 --------
// 生成唯一 id
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

// 格式化金额：保留 2 位小数，带 ¥
function fmtMoney(n) {
  const num = Number(n) || 0;
  return '¥' + num.toFixed(2);
}

// 格式化数字（不带 ¥，2 位小数）
function fmtNum(n) {
  return (Number(n) || 0).toFixed(2);
}

// 获取今天日期 YYYY-MM-DD
function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// 判断一个日期是否属于"本月"（自然月）
function isInThisMonth(dateStr, refDate) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  const ref = refDate || new Date();
  return d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth();
}

// 查找分类（返回带 emoji 的对象）
function findCategory(type, key) {
  return (CATEGORIES[type] || []).find(c => c.key === key) || { name: '其他', emoji: '❓' };
}

// -------- 数据持久化 --------
// 获取当前用户专属的存储 key
function userStorageKey() {
  return STORAGE_KEY + '-' + (currentUsername || 'guest');
}

// 从 localStorage 加载当前用户的数据
function loadData() {
  if (!currentUsername) {
    records = [];
    goals = [];
    pet = null;
    return;
  }
  try {
    const raw = localStorage.getItem(userStorageKey());
    if (raw) {
      const data = JSON.parse(raw);
      records = data.records || [];
      goals = data.goals || [];
      pet = data.pet || null;
      // 旧格式迁移：单宠物 → 多宠物
      if (pet && !pet.pets) {
        const oldPet = pet;
        pet = initPet();
        pet.coins = oldPet.coins || 20;
        if (oldPet.name && oldPet.emoji) {
          pet.pets.pig = {
            id: 'pig',
            name: oldPet.name,
            emoji: oldPet.emoji,
            level: oldPet.level || 1,
            exp: oldPet.exp || 0,
            hunger: oldPet.hunger || 80,
            happy: oldPet.happy || 70,
            energy: oldPet.energy || 90,
            lastUpdate: oldPet.lastUpdate || Date.now()
          };
        }
        saveData();
      }
    } else {
      // 新用户首次登录，数据清零（空记录）
      records = [];
      goals = [];
      pet = initPet();
      saveData();
    }
  } catch (e) {
    console.warn('读取数据失败，使用空数据', e);
    records = [];
    goals = [];
    pet = initPet();
  }
}

// 保存当前用户的数据
function saveData() {
  if (!currentUsername) return;
  try {
    localStorage.setItem(userStorageKey(), JSON.stringify({ records, goals, pet }));
  } catch (e) {
    console.warn('保存失败', e);
  }
}

// -------- 宠物系统 --------
// 可购买的宠物列表
const PET_SHOP = [
  { id: 'pig',   name: '小猪猪', emoji: '🐷', price: 0,   desc: '初始宠物' },
  { id: 'cat',   name: '小猫咪', emoji: '🐱', price: 80,  desc: '软萌可爱' },
  { id: 'dog',   name: '小狗狗', emoji: '🐶', price: 120, desc: '忠诚伙伴' },
  { id: 'rabbit',name: '小兔兔', emoji: '🐰', price: 100, desc: '蹦蹦跳跳' },
  { id: 'hamster',name:'小仓鼠', emoji: '🐹', price: 60,  desc: '圆滚滚的' },
  { id: 'bear',  name: '小熊熊', emoji: '🐻', price: 150, desc: '憨厚可爱' }
];

// 初始化宠物数据
function initPet() {
  return {
    coins: 20,
    currentPetId: 'pig',
    pets: {
      pig: {
        id: 'pig',
        name: '小猪猪',
        emoji: '🐷',
        level: 1,
        exp: 0,
        hunger: 80,
        happy: 70,
        energy: 90,
        lastUpdate: Date.now()
      }
    }
  };
}

// 打开宠物中心
function openPetCenter() {
  if (!pet || !pet.pets) pet = initPet();
  updateAllPetsOverTime();
  showPetPage('main');
  updatePetCoinsAll();
  document.getElementById('pet-modal').classList.add('show');
}

// 关闭宠物中心
function closePetCenter() {
  document.getElementById('pet-modal').classList.remove('show');
}

// 切换宠物中心子页面
function showPetPage(page) {
  document.getElementById('pet-page-main').style.display = page === 'main' ? 'block' : 'none';
  document.getElementById('pet-page-shop').style.display = page === 'shop' ? 'block' : 'none';
  document.getElementById('pet-page-train').style.display = page === 'train' ? 'block' : 'none';

  if (page === 'shop') renderPetShop();
  if (page === 'train') renderPetTrain();
  updatePetCoinsAll();
}

// 更新所有页面的金币显示
function updatePetCoinsAll() {
  if (!pet) return;
  const coins = pet.coins;
  document.getElementById('pet-coins-main').textContent = coins;
  document.getElementById('pet-coins-shop').textContent = coins;
  document.getElementById('pet-coins-train').textContent = coins;
}

// 随时间消耗所有宠物属性
function updateAllPetsOverTime() {
  if (!pet || !pet.pets) return;
  const now = Date.now();
  for (const id in pet.pets) {
    const p = pet.pets[id];
    const hours = (now - p.lastUpdate) / (1000 * 60 * 60);
    if (hours > 0) {
      p.hunger = Math.max(0, p.hunger - Math.floor(hours * 5));
      p.happy = Math.max(0, p.happy - Math.floor(hours * 3));
      p.energy = Math.min(100, p.energy + Math.floor(hours * 4));
      p.lastUpdate = now;
    }
  }
  saveData();
}

// 渲染宠物商城
function renderPetShop() {
  if (!pet) return;
  const grid = document.getElementById('pet-shop-grid');
  grid.innerHTML = '';
  for (const shopPet of PET_SHOP) {
    const owned = pet.pets[shopPet.id] ? true : false;
    const div = document.createElement('div');
    div.className = 'pet-shop-item' + (owned ? ' owned' : '');
    div.innerHTML = `
      <span class="emoji">${shopPet.emoji}</span>
      <div class="pet-name">${shopPet.name}</div>
      <div class="price">${owned ? '✅ 已拥有' : '💰 ' + shopPet.price + ' 金币'}</div>
      <button class="pet-buy-btn ${owned ? 'owned' : ''}"
              onclick="${owned ? '' : `buyPet('${shopPet.id}')`}">
        ${owned ? '已拥有' : '购买'}
      </button>
    `;
    grid.appendChild(div);
  }
}

// 购买宠物
function buyPet(petId) {
  if (!pet) return;
  const shopPet = PET_SHOP.find(p => p.id === petId);
  if (!shopPet) return;
  if (pet.pets[petId]) { showToast('已经拥有啦～'); return; }
  if (pet.coins < shopPet.price) { showToast('金币不够啦，快去记账赚金币～'); return; }

  pet.coins -= shopPet.price;
  pet.pets[petId] = {
    id: petId,
    name: shopPet.name,
    emoji: shopPet.emoji,
    level: 1,
    exp: 0,
    hunger: 80,
    happy: 70,
    energy: 90,
    lastUpdate: Date.now()
  };
  pet.currentPetId = petId;
  saveData();
  renderPetShop();
  updatePetCoinsAll();
  showToast(`🎉 成功领养 ${shopPet.name}！`);
}

// 渲染宠物培养界面
function renderPetTrain() {
  if (!pet) return;
  const content = document.getElementById('pet-train-content');
  const ownedIds = Object.keys(pet.pets);

  if (ownedIds.length === 0) {
    content.innerHTML = `<div class="pet-no-pet">还没有宠物哦，去商城领养一只吧～</div>`;
    return;
  }

  // 确保 currentPetId 有效
  if (!pet.pets[pet.currentPetId]) {
    pet.currentPetId = ownedIds[0];
  }

  const currentPet = pet.pets[pet.currentPetId];

  // 顶部宠物切换按钮
  let switcherHtml = '<div class="pet-switcher">';
  for (const id of ownedIds) {
    const p = pet.pets[id];
    const active = id === pet.currentPetId ? ' active' : '';
    switcherHtml += `
      <button class="pet-switch-btn${active}" onclick="switchPet('${id}')">
        <span class="emoji">${p.emoji}</span>${p.name}
      </button>
    `;
  }
  switcherHtml += '</div>';

  // 当前宠物信息
  let statusEmoji = currentPet.emoji;
  let tipText = '每次记账都能获得宠物金币哦～';
  if (currentPet.hunger < 20) {
    statusEmoji = '😫';
    tipText = '宝宝好饿呀，快喂点东西吧～';
  } else if (currentPet.happy < 20) {
    statusEmoji = '😢';
    tipText = '宝宝不开心，陪它玩一会儿吧～';
  } else if (currentPet.energy < 20) {
    statusEmoji = '😴';
    tipText = '宝宝好累呀，让它睡一会儿吧～';
  }

  content.innerHTML = `
    ${switcherHtml}
    <div class="pet-train">
      <div class="pet-display">
        <div class="pet-emoji" id="train-pet-emoji">${statusEmoji}</div>
      </div>
      <div class="pet-name-title">${currentPet.name}</div>
      <div class="pet-level-tag">Lv.${currentPet.level} ${getLevelTitle(currentPet.level)}</div>

      <div class="pet-stats">
        <div class="pet-stat">
          <span class="pet-stat-label">饱食度</span>
          <div class="pet-stat-bar">
            <div class="pet-stat-fill hunger" style="width: ${currentPet.hunger}%"></div>
          </div>
          <span class="pet-stat-val">${currentPet.hunger}</span>
        </div>
        <div class="pet-stat">
          <span class="pet-stat-label">心情</span>
          <div class="pet-stat-bar">
            <div class="pet-stat-fill happy" style="width: ${currentPet.happy}%"></div>
          </div>
          <span class="pet-stat-val">${currentPet.happy}</span>
        </div>
        <div class="pet-stat">
          <span class="pet-stat-label">体力</span>
          <div class="pet-stat-bar">
            <div class="pet-stat-fill energy" style="width: ${currentPet.energy}%"></div>
          </div>
          <span class="pet-stat-val">${currentPet.energy}</span>
        </div>
      </div>

      <div class="pet-actions">
        <button class="pet-action-btn" onclick="trainAction('feed')">
          <span class="emoji">🍼</span>
          喂食
          <span class="cost">-5 金币</span>
        </button>
        <button class="pet-action-btn" onclick="trainAction('play')">
          <span class="emoji">🎾</span>
          玩耍
          <span class="cost">-5 金币</span>
        </button>
        <button class="pet-action-btn" onclick="trainAction('sleep')">
          <span class="emoji">💤</span>
          睡觉
          <span class="cost">免费</span>
        </button>
      </div>

      <div class="pet-tip-msg" id="train-tip">${tipText}</div>
    </div>
  `;
}

// 切换当前培养的宠物
function switchPet(petId) {
  if (!pet || !pet.pets[petId]) return;
  pet.currentPetId = petId;
  saveData();
  renderPetTrain();
}

// 培养互动
function trainAction(type) {
  if (!pet || !pet.currentPetId) return;
  const currentPet = pet.pets[pet.currentPetId];
  if (!currentPet) return;

  let msg = '';
  const cost = 5;

  switch (type) {
    case 'feed':
      if (pet.coins < cost) { showToast('金币不够啦，快去记账赚金币～'); return; }
      if (currentPet.hunger >= 100) { showToast('宝宝已经吃饱啦～'); return; }
      pet.coins -= cost;
      currentPet.hunger = Math.min(100, currentPet.hunger + 25);
      currentPet.happy = Math.min(100, currentPet.happy + 5);
      msg = '吃得饱饱的！';
      break;
    case 'play':
      if (pet.coins < cost) { showToast('金币不够啦，快去记账赚金币～'); return; }
      if (currentPet.energy < 10) { showToast('宝宝太累了，让它睡会儿吧～'); return; }
      pet.coins -= cost;
      currentPet.happy = Math.min(100, currentPet.happy + 20);
      currentPet.energy = Math.max(0, currentPet.energy - 15);
      currentPet.hunger = Math.max(0, currentPet.hunger - 5);
      msg = '玩得好开心！';
      break;
    case 'sleep':
      if (currentPet.energy >= 100) { showToast('宝宝精力满满，不需要睡觉～'); return; }
      currentPet.energy = Math.min(100, currentPet.energy + 30);
      currentPet.hunger = Math.max(0, currentPet.hunger - 3);
      msg = '睡得香香的～';
      break;
  }

  // 开心动画
  const emojiEl = document.getElementById('train-pet-emoji');
  if (emojiEl) {
    emojiEl.classList.add('happy');
    setTimeout(() => emojiEl.classList.remove('happy'), 600);
  }

  // 加经验升级
  addPetExp(currentPet, 2);

  currentPet.lastUpdate = Date.now();
  saveData();
  renderPetTrain();
  updatePetCoinsAll();
  showToast(msg);
}

// 获取等级称号
function getLevelTitle(level) {
  if (level >= 10) return '大宠物';
  if (level >= 7) return '成长中';
  if (level >= 4) return '小少年';
  return '小宝宝';
}

// 增加宠物经验
function addPetExp(petObj, exp) {
  if (!petObj) return;
  petObj.exp += exp;
  const needExp = petObj.level * 20;
  if (petObj.exp >= needExp) {
    petObj.exp -= needExp;
    petObj.level++;
    setTimeout(() => showToast(`🎉 ${petObj.name} 升级啦！Lv.${petObj.level}`), 700);
  }
}

// 记账时获得宠物金币（所有当前选中的宠物加经验）
function earnPetCoins(amount) {
  if (!pet || !pet.pets) pet = initPet();
  const coins = Math.floor(amount / 10) + 1;
  pet.coins += coins;

  // 当前宠物加经验和心情
  if (pet.currentPetId && pet.pets[pet.currentPetId]) {
    const currentPet = pet.pets[pet.currentPetId];
    currentPet.happy = Math.min(100, currentPet.happy + 3);
    addPetExp(currentPet, 5);
  }

  saveData();
}

// 简易哈希（不是加密级，仅做存储保护，适合本地小应用）
function simpleHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = ((h << 5) - h) + s.charCodeAt(i);
    h |= 0;
  }
  return h.toString(36);
}

function renderHome() {
  // 本月收入、支出、结余
  let totalIncome = 0, totalExpense = 0;
  records.forEach(r => {
    if (isInThisMonth(r.date)) {
      if (r.type === 'income')  totalIncome  += Number(r.amount);
      if (r.type === 'expense') totalExpense += Number(r.amount);
    }
  });
  document.getElementById('home-income').textContent  = fmtMoney(totalIncome);
  document.getElementById('home-expense').textContent = fmtMoney(totalExpense);
  document.getElementById('home-balance').textContent = fmtMoney(totalIncome - totalExpense);

  // 最近 5 条记录（倒序）
  const sorted = [...records].sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
  const recent = sorted.slice(0, 5);
  const listEl = document.getElementById('recent-list');

  if (recent.length === 0) {
    listEl.innerHTML = '<div class="empty-tip">还没有记录哦～点下面按钮记第一笔吧！</div>';
    return;
  }

  listEl.innerHTML = recent.map(r => {
    const cat = findCategory(r.type, r.category);
    const isIn = r.type === 'income';
    const sign = isIn ? '+' : '-';
    const cls  = isIn ? 'amount-income' : 'amount-expense';
    const subText = [r.date, r.note].filter(Boolean).join(' · ');
    return `
      <div class="record-item">
        <div class="record-icon">${cat.emoji}</div>
        <div class="record-main">
          <div class="record-category">${cat.name}</div>
          <div class="record-sub">${subText}</div>
        </div>
        <div class="record-amount ${cls}">${sign}${fmtMoney(r.amount).replace('¥','¥')}</div>
      </div>`;
  }).join('');
}

// 保存一笔记录
function saveRecord() {
  const amount = Number(document.getElementById('amount-input').value);
  const date = document.getElementById('date-input').value;
  const note = document.getElementById('note-input').value.trim();

  if (!amount || amount <= 0) { showToast('请输入正确的金额哦～', '#FF9AA2'); return; }
  if (!date) { showToast('请选一个日期～', '#FF9AA2'); return; }
  if (!currentCategory) { showToast('请选一个分类～', '#FF9AA2'); return; }

  const cat = findCategory(currentType, currentCategory);
  const rec = {
    id: uid(),
    type: currentType,
    amount: amount,
    category: currentCategory,
    emoji: cat.emoji,
    date: date,
    note: note
  };

  // 存钱罐关联（可选）
  const savingsSel = document.getElementById('savings-target-select');
  const savingsAmtInput = document.getElementById('savings-amount-input');
  if (savingsSel && savingsSel.value && savingsAmtInput && savingsAmtInput.value) {
    const savingsAmt = Number(savingsAmtInput.value);
    if (savingsAmt > 0 && savingsAmt <= amount) {
      rec.savingsTargetId = savingsSel.value;
      rec.savingsAmount = savingsAmt;
      // 把金额追加到目标
      const g = goals.find(x => x.id === savingsSel.value);
      if (g) g.savedAmount = Number(g.savedAmount || 0) + savingsAmt;
    } else if (savingsAmt > amount) {
      showToast('存的钱不能比这笔还多哦～', '#FF9AA2');
      return;
    }
  }

  records.push(rec);
  saveData();
  earnPetCoins(amount);
  showToast('✓ 已记录');

  // 稍微延迟切换回首页展示
  setTimeout(() => {
    resetForm();
    switchTab('home');
  }, 500);
}

// ================================================
// 存钱罐
// ================================================
function renderSavings() {
  const listEl = document.getElementById('goal-list');
  if (goals.length === 0) {
    listEl.innerHTML = `
      <div class="card">
        <div class="empty-tip">还没有存钱目标哦～<br/>点上面的大按钮创建你的第一个目标吧！🐽</div>
      </div>`;
    return;
  }

  // 按创建时间倒序
  const sorted = [...goals].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  listEl.innerHTML = sorted.map(g => {
    const saved = Number(g.savedAmount || 0);
    const target = Number(g.targetAmount || 0);
    const percent = target > 0 ? Math.min(100, (saved / target) * 100) : 0;
    const remain = Math.max(0, target - saved);
    const daysLeft = daysBetween(todayStr(), g.deadline);
    const isDone = saved >= target && target > 0;

    const daysText = isDone
      ? '🎉 达成啦！'
      : (daysLeft >= 0 ? `还有 ${daysLeft} 天截止` : `已经超过截止日 ${-daysLeft} 天啦`);

    return `
      <div class="goal-card ${isDone ? 'done' : ''}" onclick="openGoalAction('${g.id}')">
        <div class="goal-header">
          <div class="goal-emoji">${g.emoji}</div>
          <div class="goal-name">${escapeHtml(g.name)}</div>
          <div class="goal-days">${daysText}</div>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar" data-percent="${percent.toFixed(1)}"></div>
        </div>
        <div class="goal-info">
          已存 <span class="highlight">${fmtMoney(saved)}</span>
          / 目标 ${fmtMoney(target)}
          （还差 ${fmtMoney(remain)}）
          <br/>截止日期：${g.deadline || '未设置'}
        </div>
      </div>`;
  }).join('');

  // 进度条填充动画（下一帧触发，确保 transition 生效）
  requestAnimationFrame(() => {
    document.querySelectorAll('.progress-bar').forEach(bar => {
      bar.style.width = (bar.dataset.percent || 0) + '%';
    });
  });
}

// 计算两个日期之间的天数差（b - a）
function daysBetween(aStr, bStr) {
  if (!aStr || !bStr) return 0;
  const a = new Date(aStr);
  const b = new Date(bStr);
  const diff = (b.getTime() - a.getTime()) / (1000 * 60 * 60 * 24);
  return Math.round(diff);
}

// ================================================
// 月度报告
// ================================================
function renderReport() {
  const y = currentMonth.getFullYear();
  const m = currentMonth.getMonth() + 1;
  const monthLabel = `${y}-${String(m).padStart(2, '0')}`;
  document.getElementById('report-month-label').textContent = monthLabel + ' 月';

  // 筛选本月记录
  const ref = new Date(y, m - 1, 1);
  const monthRecords = records.filter(r => isInThisMonth(r.date, ref));

  // 收入、支出、结余
  let ti = 0, te = 0;
  monthRecords.forEach(r => {
    if (r.type === 'income')  ti += Number(r.amount);
    if (r.type === 'expense') te += Number(r.amount);
  });
  document.getElementById('report-income').textContent  = fmtMoney(ti);
  document.getElementById('report-expense').textContent = fmtMoney(te);
  document.getElementById('report-balance').textContent = fmtMoney(ti - te);

  // 汇总各类别支出
  const catMap = {};   // key -> amount
  monthRecords.forEach(r => {
    if (r.type !== 'expense') return;
    catMap[r.category] = (catMap[r.category] || 0) + Number(r.amount);
  });
  const catList = Object.keys(catMap).map(k => {
    const cat = findCategory('expense', k);
    return { key: k, name: cat.name, emoji: cat.emoji, amount: catMap[k] };
  }).sort((a, b) => b.amount - a.amount);

  const maxAmount = catList.length > 0 ? catList[0].amount : 0;
  const chartEl = document.getElementById('category-chart');

  if (catList.length === 0) {
    chartEl.innerHTML = '<div class="empty-tip">这个月还没有支出记录～</div>';
    document.getElementById('advice-text').textContent = '这个月还没有支出记录哦，开始记第一笔吧！';
  } else {
    chartEl.innerHTML = catList.map(c => {
      const percent = maxAmount > 0 ? (c.amount / maxAmount) * 100 : 0;
      const totalPercent = te > 0 ? ((c.amount / te) * 100).toFixed(1) : 0;
      return `
        <div class="chart-item">
          <div class="chart-row">
            <span class="cat-name">${c.emoji} ${c.name}（${totalPercent}%）</span>
            <span class="cat-amount">${fmtMoney(c.amount)}</span>
          </div>
          <div class="chart-bar-wrap">
            <div class="chart-bar" data-percent="${percent.toFixed(1)}"></div>
          </div>
        </div>`;
    }).join('');

    // 进度条动画
    requestAnimationFrame(() => {
      document.querySelectorAll('.chart-bar').forEach(bar => {
        bar.style.width = (bar.dataset.percent || 0) + '%';
      });
    });

    // 总结 + 温柔建议（花最多的类别）
    const adviceEl = document.getElementById('advice-text');
    const titleEl = document.querySelector('#advice-card .advice-title');
    const top = catList[0];

    // 如果没有支出数据，不显示"花得最多"
    if (!top || catList.length === 0) {
      titleEl.textContent = '💡 小小总结';
      adviceEl.textContent = '这个月还没有支出记录哦～';
    } else {
      titleEl.textContent = `💡 你在${top.name} ${top.emoji} 上花得最多`;

    // 根据类别给温柔的建议
    const tips = {
      'snack':     '小零食偶尔吃一次就好啦，要不要试试下周少买一点点？',
      'stationery':'文具是很实用的开销哦！需要的时候再买，不浪费～',
      'toy':       '玩具超开心！可以先想想是不是真的很想要再决定哦～',
      'game':      '游戏很有趣！记得控制时间和金额，留点钱给其他好玩儿的事情～',
      'transport': '交通是必要的开销，继续保持这样合理规划吧！',
      'food':      '吃饱饱才有精神！营养均衡最重要啦～',
      'gift':      '送朋友礼物很有爱！心意比金额更重要哦～',
      'book':      '买书是非常棒的投资！继续加油阅读吧～',
      'savings':   '存钱的习惯真棒！坚持下去，目标会越来越近哦～',
      'other-e':   '其他开销也要留心呢，下次记的时候可以写写备注～',
      'other':     '这个月开销很有自己的节奏呀，继续保持觉察就很好啦！'
    };
    adviceEl.textContent = `你在${top.name} ${top.emoji} 上一共花了 ${fmtMoney(top.amount)}。${tips[top.key] || tips['other']}`;
    }
  }

  // 小成就：连续记账天数
  const daySet = new Set(monthRecords.map(r => r.date));
  const streakDays = calcStreakDays([...daySet]);
  document.getElementById('ach-days').textContent = streakDays;

  // 小成就：这个月达成的目标
  const doneGoals = goals.filter(g => Number(g.savedAmount || 0) >= Number(g.targetAmount || 0) && Number(g.targetAmount) > 0);
  document.getElementById('ach-goals').textContent = doneGoals.length;

  // 小成就：本月记账笔数
  document.getElementById('ach-count').textContent = monthRecords.length;

  // 小成就：最省钱的一天（支出最少的一天的支出金额，若没有则为 0）
  const dailyExpense = {};
  monthRecords.forEach(r => {
    if (r.type === 'expense') {
      dailyExpense[r.date] = (dailyExpense[r.date] || 0) + Number(r.amount);
    }
  });
  const amounts = Object.values(dailyExpense);
  const minDay = amounts.length > 0 ? Math.min(...amounts) : 0;
  document.getElementById('ach-save-day').textContent = '¥' + fmtNum(minDay);
}

// 计算"连续记账天数"（以今天为终点，往前一天一天数）
function calcStreakDays(dates) {
  if (!dates || dates.length === 0) return 0;
  const set = new Set(dates);
  let streak = 0;
  const cursor = new Date();
  for (let i = 0; i < 365; i++) {
    const y = cursor.getFullYear();
    const m = String(cursor.getMonth() + 1).padStart(2, '0');
    const d = String(cursor.getDate()).padStart(2, '0');
    const key = `${y}-${m}-${d}`;
    if (set.has(key)) streak++;
    else if (i > 0) break;   // 允许今天还没记，但不能中断
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

// 切换月份（delta: -1 上一月，1 下一月）
function changeMonth(delta) {
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + delta, 1);
  renderReport();
}

// ================================================
// 通用 UI
// ================================================
function showToast(text, bgColor) {
  const t = document.getElementById('toast');
  t.textContent = text;
  if (bgColor) {
    t.style.background = bgColor;
  } else {
    t.style.background = 'rgba(76, 175, 136, 0.95)';
  }
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1500);
}

// 简单 HTML 转义，防止用户输入的文本作为 html
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

// 点击遮罩关闭弹窗
document.getElementById('goal-modal').addEventListener('click', (e) => {
  if (e.target.id === 'goal-modal') closeGoalModal();
});
document.getElementById('goal-action-modal').addEventListener('click', (e) => {
  if (e.target.id === 'goal-action-modal') closeGoalActionModal();
});

// ================================================
(function init() {
  // 日期默认今天
  document.getElementById('date-input').value = todayStr();
  // 默认分类
  currentCategory = CATEGORIES[currentType][0].key;

  // 登录/注册按钮点击事件
  document.getElementById('auth-tab-login').addEventListener('click', () => switchAuthTab('login'));
  document.getElementById('auth-tab-register').addEventListener('click', () => switchAuthTab('register'));
  document.getElementById('login-btn').addEventListener('click', doLogin);
  document.getElementById('register-btn').addEventListener('click', doRegister);

  // Enter 键快速提交（登录 / 注册）
  ['login-username', 'login-password'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });
  });
  ['register-username', 'register-password', 'register-password2'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doRegister();
    });
  });

  // 先不加载数据（需要先登录），登录/注册成功后会自动加载
})();
</script>
