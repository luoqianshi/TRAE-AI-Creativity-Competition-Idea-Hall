<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>药盒小喇叭</title>
  <style>
    :root {
      --bg-primary: #f8f9fa;
      --bg-card: #ffffff;
      --text-primary: #333333;
      --text-secondary: #6c757d;
      --accent: #6a994e;
      --accent-light: #d9e9d3;
      --border: #e9ecef;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --radius: 12px;
      --spacing-xs: 8px;
      --spacing-sm: 16px;
      --spacing-md: 24px;
      --spacing-lg: 32px;
      --font-size-base: 16px;
      --font-size-title: 24px;
      --font-size-body: 18px;
      --font-size-large: 20px;
      --transition: all 0.3s ease;
    }

    .dark-theme {
      --bg-primary: #1e293b;
      --bg-card: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent: #86efac;
      --accent-light: #166534;
      --border: #475569;
      --shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: var(--spacing-md);
      transition: var(--transition);
      min-height: 100vh;
    }

    @media (max-width: 768px) {
      body {
        padding: var(--spacing-sm);
      }
    }

    .container {
      max-width: 1024px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: var(--spacing-lg);
      padding-bottom: var(--spacing-md);
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: var(--font-size-title);
      font-weight: 600;
      margin-bottom: var(--spacing-xs);
      color: var(--accent);
    }

    .subtitle {
      font-size: var(--font-size-body);
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
    }

    .theme-toggle {
      position: fixed;
      top: var(--spacing-sm);
      right: var(--spacing-sm);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 100;
      font-size: 18px;
      transition: var(--transition);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      background: var(--accent-light);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--spacing-lg);
    }

    @media (min-width: 769px) {
      .main-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: var(--spacing-md);
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card-title {
      font-size: var(--font-size-body);
      font-weight: 600;
      margin-bottom: var(--spacing-sm);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 20px;
      background: var(--accent);
      border-radius: 2px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: var(--font-size-body);
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      width: 100%;
      margin-top: var(--spacing-sm);
    }

    .btn:hover {
      background: var(--accent-light);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-outline {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .btn-outline:hover {
      background: var(--accent-light);
      color: white;
    }

    .input-group {
      margin-bottom: var(--spacing-sm);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: var(--font-size-body);
    }

    select, input[type="range"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: var(--font-size-body);
      outline: none;
      transition: var(--transition);
    }

    select:focus, input[type="range"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(106, 153, 78, 0.2);
    }

    .info-display {
      margin-top: var(--spacing-md);
      padding: var(--spacing-md);
      background: var(--accent-light);
      border-radius: var(--radius);
      font-size: var(--font-size-large);
      line-height: 1.7;
      color: var(--text-primary);
    }

    .highlight {
      font-weight: 700;
      color: #166534;
      background: rgba(134, 239, 172, 0.2);
      padding: 2px 8px;
      border-radius: 4px;
      display: inline;
    }

    .status-bar {
      margin-top: var(--spacing-sm);
      padding: 10px;
      background: #e6f7ee;
      border-left: 4px solid var(--accent);
      border-radius: 0 4px 4px 0;
      font-size: var(--font-size-body);
      color: #166534;
      display: none;
    }

    .status-bar.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .font-control {
      display: flex;
      gap: 8px;
      margin-top: var(--spacing-sm);
    }

    .font-btn {
      flex: 1;
      padding: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      font-size: var(--font-size-body);
      transition: var(--transition);
    }

    .font-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .placeholder-img {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #e0f2fe, #dbeafe);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: var(--font-size-body);
      text-align: center;
      margin-bottom: var(--spacing-sm);
      border: 2px dashed var(--border);
    }

    .placeholder-img i {
      font-size: 48px;
      margin-bottom: 12px;
      color: var(--accent);
    }

    footer {
      text-align: center;
      margin-top: var(--spacing-lg);
      padding-top: var(--spacing-md);
      color: var(--text-secondary);
      font-size: var(--font-size-body);
      border-top: 1px solid var(--border);
    }

    /* 响应式优化 */
    @media (max-width: 480px) {
      h1 { font-size: 20px; }
      .subtitle { font-size: 16px; }
      .btn { padding: 12px; font-size: 16px; }
      .info-display { font-size: 18px; padding: 16px; }
      .font-btn { font-size: 16px; padding: 6px; }
    }

    /* 深色模式下字体增强 */
    .dark-theme .info-display {
      background: #1e40af;
      color: #e0f2fe;
    }

    .dark-theme .highlight {
      background: rgba(134, 239, 172, 0.3);
      color: #86efac;
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色主题">☀️</button>

  <div class="container">
    <header>
      <h1>药盒小喇叭</h1>
      <p class="subtitle">把药品说明书“说”给爸妈听｜拍照→识别→听懂｜三步搞定</p>
    </header>

    <div class="main-grid">
      <div class="card">
        <h2 class="card-title">说明书识别区</h2>
        <div class="placeholder-img">
          <div>📷 拍一拍说明书</div>
          <div>（模拟OCR识别中…）</div>
        </div>
        <button class="btn" id="captureBtn">拍说明书</button>
        <div class="status-bar" id="statusBar"></div>
        
        <div class="info-display" id="infoDisplay">
          <p><span class="highlight">【通用名】</span> 阿司匹林肠溶片</p>
          <p><span class="highlight">【用法用量】</span> 每日1次，每次100mg，饭后温水送服</p>
          <p><span class="highlight">【禁忌】</span> 胃溃疡、哮喘、出血倾向者禁用</p>
          <p><span class="highlight">【注意事项】</span> 服药后2小时内避免饮酒；如出现黑便立即停药就医</p>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">语音播报控制</h2>
        
        <div class="input-group">
          <label for="dialectSelect">选择方言</label>
          <select id="dialectSelect">
            <option value="putonghua">普通话</option>
            <option value="yueyu">粤语</option>
            <option value="chuanhua">四川话</option>
          </select>
        </div>

        <div class="input-group">
          <label for="speedRange">播放语速</label>
          <input type="range" id="speedRange" min="0.8" max="1.4" step="0.1" value="1.0">
          <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--text-secondary);">
            <span>慢</span><span id="speedValue">标准</span><span>快</span>
          </div>
        </div>

        <div class="input-group">
          <label>字体大小</label>
          <div class="font-control">
            <div class="font-btn active" data-size="large">大</div>
            <div class="font-btn" data-size="medium">中</div>
            <div class="font-btn" data-size="small">小</div>
          </div>
        </div>

        <button class="btn" id="playBtn">🔊 听一听</button>
        <button class="btn btn-outline" id="pauseBtn">⏸️ 暂停</button>
      </div>
    </div>

    <footer>
      <p>药盒小喇叭 · 专为爸妈设计的用药助手</p>
    </footer>
  </div>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const htmlEl = document.documentElement;
    
    // 检查系统偏好
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (prefersDark) {
      htmlEl.classList.add('dark-theme');
      themeToggle.textContent = '🌙';
    }

    themeToggle.addEventListener('click', () => {
      if (htmlEl.classList.contains('dark-theme')) {
        htmlEl.classList.remove('dark-theme');
        themeToggle.textContent = '☀️';
        localStorage.setItem('theme', 'light');
      } else {
        htmlEl.classList.add('dark-theme');
        themeToggle.textContent = '🌙';
        localStorage.setItem('theme', 'dark');
      }
    });

    // 加载时恢复主题
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      htmlEl.classList.add('dark-theme');
      themeToggle.textContent = '🌙';
    } else if (savedTheme === 'light') {
      htmlEl.classList.remove('dark-theme');
      themeToggle.textContent = '☀️';
    }

    // 字体大小控制
    const fontBtns = document.querySelectorAll('.font-btn');
    const infoDisplay = document.getElementById('infoDisplay');
    
    fontBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        fontBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const size = btn.getAttribute('data-size');
        if (size === 'large') {
          infoDisplay.style.fontSize = '20px';
        } else if (size === 'medium') {
          infoDisplay.style.fontSize = '18px';
        } else {
          infoDisplay.style.fontSize = '16px';
        }
      });
    });

    // 语速滑块显示值
    const speedRange = document.getElementById('speedRange');
    const speedValue = document.getElementById('speedValue');
    speedRange.addEventListener('input', () => {
      const val = parseFloat(speedRange.value);
      if (val < 0.9) speedValue.textContent = '慢';
      else if (val > 1.2) speedValue.textContent = '快';
      else speedValue.textContent = '标准';
    });

    // 模拟拍照识别
    const captureBtn = document.getElementById('captureBtn');
    const statusBar = document.getElementById('statusBar');
    const infoDisplayEl = document.getElementById('infoDisplay');

    captureBtn.addEventListener('click', () => {
      statusBar.textContent = '正在识别说明书文字…';
      statusBar.classList.add('show');
      
      setTimeout(() => {
        statusBar.textContent = '✅ 已识别完成，关键信息已提取';
        statusBar.classList.add('show');
        
        // 模拟不同药品内容（随机）
        const samples = [
          `<p><span class="highlight">【通用名】</span> 二甲双胍缓释片</p>
           <p><span class="highlight">【用法用量】</span> 每日1次，晚餐时服用，每次500mg</p>
           <p><span class="highlight">【禁忌】</span> 严重肾功能不全、代谢性酸中毒患者禁用</p>
           <p><span class="highlight">【注意事项】</span> 服药期间定期查肾功能；维生素B12缺乏者需补充</p>`,
          `<p><span class="highlight">【通用名】</span> 氨氯地平片</p>
           <p><span class="highlight">【用法用量】</span> 每日1次，清晨空腹服用，每次5mg</p>
           <p><span class="highlight">【禁忌】</span> 严重低血压、主动脉瓣狭窄患者禁用</p>
           <p><span class="highlight">【注意事项】</span> 可能引起脚踝水肿，抬高下肢可缓解；避免与葡萄柚同食</p>`
        ];
        
        infoDisplayEl.innerHTML = samples[Math.floor(Math.random() * samples.length)];
      }, 1200);
    });

    // 播放/暂停模拟
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    let isPlaying = false;
    playBtn.addEventListener('click', () => {
      if (!isPlaying) {
        isPlaying = true;
        playBtn.textContent = '🔊 正在播放…';
        playBtn.disabled = true;
        
        setTimeout(() => {
          playBtn.textContent = '🔊 听一听';
          playBtn.disabled = false;
          isPlaying = false;
        }, 2500);
      }
    });

    pauseBtn.addEventListener('click', () => {
      if (isPlaying) {
        isPlaying = false;
        playBtn.textContent = '🔊 听一听';
        playBtn.disabled = false;
      }
    });

    // 初始化语速显示
    speedValue.textContent = '标准';
  </script>
</body>
</html>
