<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>今日灵感菜单 · 生活小灵感</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #f9f3e8 0%, #fff4e6 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 40px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: transform 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
    }

    /* 头部 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(135deg, #f97316, #fb923c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    .date-badge {
      font-size: 14px;
      color: #78716c;
      background: #f1ede8;
      padding: 6px 14px;
      border-radius: 40px;
      font-weight: 500;
    }

    /* 灵感卡片 */
    .inspiration-box {
      margin: 24px 0 20px;
      background: #fefcf7;
      border-radius: 28px;
      padding: 28px 24px;
      border: 1px solid #f0e8de;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8), 0 8px 20px rgba(0, 0, 0, 0.02);
      transition: all 0.3s ease;
    }
    .inspiration-box .tag {
      display: inline-block;
      background: #f97316;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 40px;
      letter-spacing: 0.3px;
      margin-bottom: 12px;
    }
    .inspiration-box .title {
      font-size: 24px;
      font-weight: 700;
      color: #1c1917;
      line-height: 1.3;
      margin-bottom: 10px;
    }
    .inspiration-box .desc {
      font-size: 16px;
      line-height: 1.6;
      color: #57534e;
      margin-bottom: 16px;
    }
    .inspiration-box .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 14px;
      color: #78716c;
      border-top: 1px dashed #e7e0d8;
      padding-top: 16px;
    }
    .inspiration-box .meta span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .inspiration-box .meta .time-badge {
      background: #e7e0d8;
      padding: 2px 12px;
      border-radius: 40px;
      font-weight: 500;
      color: #44403c;
    }

    /* 时间筛选按钮 */
    .filter-group {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .filter-btn {
      flex: 1;
      min-width: 70px;
      padding: 10px 0;
      border: none;
      border-radius: 60px;
      font-weight: 600;
      font-size: 15px;
      background: #f1ede8;
      color: #57534e;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .filter-btn.active {
      background: #f97316;
      color: #fff;
      box-shadow: 0 8px 18px rgba(249, 115, 22, 0.25);
    }
    .filter-btn:hover:not(.active) {
      background: #e7e0d8;
    }

    /* 操作按钮 */
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 6px;
    }
    .actions button {
      flex: 1;
      padding: 14px 0;
      border: none;
      border-radius: 60px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #1c1917;
      color: #fff;
      box-shadow: 0 4px 12px rgba(28, 25, 23, 0.15);
    }
    .btn-primary:hover {
      background: #292524;
      transform: scale(0.97);
    }
    .btn-secondary {
      background: #f1ede8;
      color: #44403c;
    }
    .btn-secondary:hover {
      background: #e7e0d8;
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #a8a29e;
      letter-spacing: 0.3px;
      border-top: 1px solid #f0e8de;
      padding-top: 20px;
    }
    .footer-note i {
      font-style: normal;
      display: inline-block;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* 收藏小标记 */
    .favorite {
      margin-left: auto;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      transition: 0.2s;
      line-height: 1;
    }
    .favorite:hover {
      transform: scale(1.15);
    }
  </style>
</head>
<body>

<div class="card" id="app">
  <!-- 头部 -->
  <div class="header">
    <h1>🍽️ 灵感菜单</h1>
    <div class="date-badge" id="dateDisplay"></div>
  </div>

  <!-- 灵感卡片 -->
  <div class="inspiration-box" id="inspirationCard">
    <div class="tag" id="categoryTag">✨ 今日推荐</div>
    <div class="title" id="inspirationTitle">重新认识你的城市</div>
    <div class="desc" id="inspirationDesc">
      选一条你从未坐过的公交线路，从起点坐到终点，观察沿途的街景、小店和行人。
    </div>
    <div class="meta">
      <span>⏱️ 所需时间：<span class="time-badge" id="timeLabel">30 分钟</span></span>
      <span>🏷️ 分类：<span id="categoryLabel">探索</span></span>
      <button class="favorite" id="favBtn" title="收藏这个灵感">☆</button>
    </div>
  </div>

  <!-- 时间筛选 -->
  <div class="filter-group">
    <button class="filter-btn" data-time="5">5 分钟</button>
    <button class="filter-btn active" data-time="15">15 分钟</button>
    <button class="filter-btn" data-time="30">30 分钟</button>
  </div>

  <!-- 操作按钮 -->
  <div class="actions">
    <button class="btn-primary" id="nextBtn">🔄 换一个灵感</button>
    <button class="btn-secondary" id="resetFilterBtn">📋 全部</button>
  </div>

  <div class="footer-note">
    <i>✨ 每天一个小行动，生活大不同 · TRAE 生活娱乐</i>
  </div>
</div>

<script>
  // ---------- 灵感数据库 ----------
  const inspirationDB = [
    {
      id: 1,
      title: '重新认识你的城市',
      desc: '选一条你从未坐过的公交线路，从起点坐到终点，观察沿途的街景、小店和行人。',
      category: '探索',
      time: 30
    },
    {
      id: 2,
      title: '给老朋友手写一封信',
      desc: '找出纸笔，给一位很久没联系的好友写一段真心话，不用长，300字就够。',
      category: '社交',
      time: 15
    },
    {
      id: 3,
      title: '整理一个最容易乱的角落',
      desc: '比如玄关鞋柜、书桌抽屉或冰箱第二层，花5分钟分类归位，拍照对比。',
      category: '整理',
      time: 5
    },
    {
      id: 4,
      title: '学一道 3 步快手菜',
      desc: '番茄炒蛋升级版：加一点蚝油和糖，出锅前撒葱花，配米饭超香。',
      category: '美食',
      time: 15
    },
    {
      id: 5,
      title: '做一次「数字断舍离」',
      desc: '删除手机里 20 张以上无用的截图，取消关注 3 个从来不看的公众号。',
      category: '整理',
      time: 5
    },
    {
      id: 6,
      title: '发现家附近 1 家新店',
      desc: '步行 10 分钟范围内，找一家你从没进去过的面包店、花店或小酒馆。',
      category: '探索',
      time: 30
    },
    {
      id: 7,
      title: '写今日「小确幸」日记',
      desc: '记录今天发生的三件让你觉得温暖或开心的小事，哪怕只是阳光很好。',
      category: '创作',
      time: 10
    },
    {
      id: 8,
      title: '给家人做一顿营养早餐',
      desc: '煎蛋、烤吐司、切水果，摆盘漂亮一点，多花 5 分钟就能让一天变好。',
      category: '美食',
      time: 20
    }
  ];

  // ---------- 状态 ----------
  let currentInspiration = null;
  let currentFilter = 15; // 默认显示15分钟
  let favorites = new Set(); // 收藏ID集合

  // DOM 元素
  const titleEl = document.getElementById('inspirationTitle');
  const descEl = document.getElementById('inspirationDesc');
  const categoryTag = document.getElementById('categoryTag');
  const timeLabel = document.getElementById('timeLabel');
  const categoryLabel = document.getElementById('categoryLabel');
  const dateDisplay = document.getElementById('dateDisplay');
  const favBtn = document.getElementById('favBtn');
  const nextBtn = document.getElementById('nextBtn');
  const resetFilterBtn = document.getElementById('resetFilterBtn');
  const filterBtns = document.querySelectorAll('.filter-btn');

  // ---------- 辅助函数 ----------
  function getFilteredPool() {
    if (currentFilter === 0) return inspirationDB; // 全部
    return inspirationDB.filter(item => item.time <= currentFilter);
  }

  function pickRandom(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  function renderInspiration(insp) {
    if (!insp) return;
    currentInspiration = insp;
    titleEl.textContent = insp.title;
    descEl.textContent = insp.desc;
    categoryTag.textContent = '✨ ' + insp.category;
    timeLabel.textContent = insp.time + ' 分钟';
    categoryLabel.textContent = insp.category;
    // 收藏状态
    const isFav = favorites.has(insp.id);
    favBtn.textContent = isFav ? '❤️' : '☆';
  }

  function refreshInspiration() {
    const pool = getFilteredPool();
    if (pool.length === 0) {
      // 如果没有匹配的，提示并重置筛选到全部
      alert('当前筛选没有匹配的灵感，已切换为“全部”');
      currentFilter = 0;
      filterBtns.forEach(btn => btn.classList.remove('active'));
      // 增加一个“全部”按钮激活状态（这里我们通过重置筛选逻辑）
      // 但我们现在没有全部按钮，可以用resetFilterBtn功能类似
      // 我们调用重置函数
      resetFilter();
      return;
    }
    let newInsp = pickRandom(pool);
    // 避免连续相同（除非池子只有一个）
    while (pool.length > 1 && currentInspiration && newInsp.id === currentInspiration.id) {
      newInsp = pickRandom(pool);
    }
    renderInspiration(newInsp);
  }

  function resetFilter() {
    currentFilter = 0;
    filterBtns.forEach(btn => btn.classList.remove('active'));
    // 高亮“全部”（我们没有一个按钮，但可以选一个标记为无，或者我们加一个样式，但这里我们用逻辑）
    // 为了视觉，我们可以让所有按钮取消激活，但用户可能不知道。更合理：我们添加一个“全部”按钮？但设计里没有，而是有一个“全部”文字按钮在下方，我们让它激活一个隐藏状态
    // 我们可以在filterBtns中加一个代表全部的隐藏，但简单起见，我们刷新时基于0，并且将所有按钮取消激活
    refreshInspiration();
  }

  // ---------- 事件绑定 ----------
  // 时间筛选
  filterBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      const time = parseInt(this.dataset.time, 10);
      if (currentFilter === time) return; // 相同不重复
      currentFilter = time;
      filterBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      refreshInspiration();
    });
  });

  // 换一个灵感
  nextBtn.addEventListener('click', refreshInspiration);

  // 重置筛选（全部）
  resetFilterBtn.addEventListener('click', function() {
    currentFilter = 0;
    filterBtns.forEach(btn => btn.classList.remove('active'));
    refreshInspiration();
  });

  // 收藏切换
  favBtn.addEventListener('click', function() {
    if (!currentInspiration) return;
    const id = currentInspiration.id;
    if (favorites.has(id)) {
      favorites.delete(id);
    } else {
      favorites.add(id);
    }
    renderInspiration(currentInspiration); // 刷新显示
    // 可以简单提示
  });

  // ---------- 初始化 ----------
  function init() {
    // 显示当天日期
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    dateDisplay.textContent = y + '/' + m + '/' + d;

    // 初始筛选高亮15分钟
    currentFilter = 15;
    filterBtns.forEach(btn => {
      if (parseInt(btn.dataset.time, 10) === 15) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    // 随机选一个初始灵感
    const pool = getFilteredPool();
    const first = pickRandom(pool);
    renderInspiration(first);
  }

  init();
</script>

</body>
</html>
