<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>劳逸结合提醒助手</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🌿 劳逸结合提醒助手</h1>
            <p class="subtitle">关爱健康，合理休息</p>
        </header>

        <main class="main-content">
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-label">今日屏幕使用</span>
                    <span class="stat-value" id="work-time">00:00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">已提醒</span>
                    <span class="stat-value" id="remind-count">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">完成休息</span>
                    <span class="stat-value" id="rest-count">0</span>
                </div>
            </div>

            <div class="reminder-cards">
                <div class="card water-card" id="water-card">
                    <div class="card-icon">💧</div>
                    <div class="card-content">
                        <h3>喝水提醒</h3>
                        <p class="card-desc">记得补充水分</p>
                        <div class="timer-display">
                            <span class="timer-value" id="water-timer">60:00</span>
                            <span class="timer-label">下次提醒</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="water-progress"></div>
                        </div>
                        <button class="action-btn" onclick="app.resetTimer('water')">立即喝水</button>
                    </div>
                    <div class="card-toggle">
                        <label class="toggle-switch">
                            <input type="checkbox" id="water-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="card exercise-card" id="exercise-card">
                    <div class="card-icon">🏃</div>
                    <div class="card-content">
                        <h3>运动提醒</h3>
                        <p class="card-desc">起身活动一下</p>
                        <div class="timer-display">
                            <span class="timer-value" id="exercise-timer">90:00</span>
                            <span class="timer-label">下次提醒</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="exercise-progress"></div>
                        </div>
                        <button class="action-btn" onclick="app.resetTimer('exercise')">开始运动</button>
                    </div>
                    <div class="card-toggle">
                        <label class="toggle-switch">
                            <input type="checkbox" id="exercise-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="card eye-card" id="eye-card">
                    <div class="card-icon">👀</div>
                    <div class="card-content">
                        <h3>护眼提醒</h3>
                        <p class="card-desc">让眼睛休息一会</p>
                        <div class="timer-display">
                            <span class="timer-value" id="eye-timer">20:00</span>
                            <span class="timer-label">下次提醒</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="eye-progress"></div>
                        </div>
                        <button class="action-btn" onclick="app.resetTimer('eye')">开始护眼</button>
                    </div>
                    <div class="card-toggle">
                        <label class="toggle-switch">
                            <input type="checkbox" id="eye-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="stats-section">
                <button class="stats-btn" onclick="app.toggleStats()">📊 统计图表</button>
                <div class="stats-panel" id="stats-panel">
                    <h3>最近7天数据统计</h3>
                    <div class="chart-container">
                        <canvas id="workTimeChart" width="400" height="250"></canvas>
                        <canvas id="reminderChart" width="400" height="250"></canvas>
                    </div>
                    <div class="stats-summary">
                        <div class="summary-item">
                            <span class="summary-label">本周总工作时长</span>
                            <span class="summary-value" id="weekly-work-time">0小时</span>
                        </div>
                        <div class="summary-item">
                            <span class="summary-label">本周总提醒次数</span>
                            <span class="summary-value" id="weekly-remind-count">0</span>
                        </div>
                        <div class="summary-item">
                            <span class="summary-label">本周完成休息</span>
                            <span class="summary-value" id="weekly-rest-count">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="settings-section" id="settings-section">
                <button class="settings-btn" onclick="app.toggleSettings()">⚙️ 设置</button>
                <div class="settings-panel" id="settings-panel">
                    <h3>提醒间隔设置（分钟）</h3>
                    <div class="setting-item">
                        <label>💧 喝水间隔：</label>
                        <input type="number" id="water-interval" value="60" min="5" max="120">
                    </div>
                    <div class="setting-item">
                        <label>🏃 运动间隔：</label>
                        <input type="number" id="exercise-interval" value="90" min="10" max="180">
                    </div>
                    <div class="setting-item">
                        <label>👀 护眼间隔：</label>
                        <input type="number" id="eye-interval" value="20" min="5" max="60">
                    </div>
                    <div class="setting-item">
                        <label>
                            <input type="checkbox" id="sound-toggle" checked>
                            提醒声音
                        </label>
                    </div>
                    <button class="save-btn" onclick="app.saveSettings()">保存设置</button>
                    <button class="reset-btn" onclick="app.resetSettings()">恢复默认</button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>🌱 关爱健康，从每一次休息开始</p>
        </footer>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <div class="modal-icon" id="modal-icon">💧</div>
            <h2 id="modal-title">该喝水了！</h2>
            <p id="modal-desc">工作辛苦了，记得喝杯水休息一下</p>
            <div class="modal-actions">
                <button class="modal-btn primary-btn" onclick="app.confirmReminder()">我知道了</button>
                <button class="modal-btn secondary-btn" onclick="app.snoozeReminder()">稍后提醒 (5分钟)</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
