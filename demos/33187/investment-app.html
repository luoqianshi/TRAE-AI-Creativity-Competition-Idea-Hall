      font-size: 0.8rem;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .product-prediction {
      text-align: right;
    }
    .prediction-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: var(--font-mono);
    }
    .prediction-badge.bull {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent);
    }
    .prediction-badge.bear {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent2);
    }
    .prediction-range {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .product-reasons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.6rem;
    }
    .reason-tag {
      font-size: 0.78rem;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      background: var(--bg3);
      color: var(--muted);
      border: 1px solid var(--rule);
    }
    .reason-tag.positive { color: var(--accent); border-color: rgba(239, 68, 68, 0.3); }
    .reason-tag.negative { color: var(--accent2); border-color: rgba(16, 185, 129, 0.3); }

    .product-metrics {
      display: flex;
      gap: 1rem;
      margin-top: 0.6rem;
      padding-top: 0.6rem;
      border-top: 1px solid var(--rule);
    }
    .metric {
      display: flex;
      flex-direction: column;
    }
    .metric-label {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .metric-value {
      font-size: 0.9rem;
      font-weight: 600;
      font-family: var(--font-mono);
    }

    /* Data Sources Panel */
    .sources-panel {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 1.25rem;
      margin-top: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .sources-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent3), transparent);
    }
    .sources-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .sources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.75rem;
    }
    .source-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0.8rem;
      background: var(--bg3);
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .source-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .source-status.pending { background: var(--warning); animation: pulse 1.5s infinite; }

    /* Footer */
    .app-footer {
      max-width: var(--max);
      margin: 2rem auto 0;
      padding: 1.5rem;
      border-top: 1px solid var(--rule);
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 1.5rem;
      box-shadow: 0 24px 48px rgba(0,0,0,0.5);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.25rem;
    }
    .modal-close:hover { color: var(--ink); }

    /* Responsive */
    @media (max-width: 768px) {
      .app-header { padding: 0.75rem 1rem; }
      .logo-text { font-size: 1.1rem; }
      .header-meta { font-size: 0.8rem; gap: 0.75rem; }
      .app-main { padding: 1rem; }
      .tab-btn { padding: 0.5rem 1rem; font-size: 0.9rem; }
      .product-card { padding: 0.85rem 1rem; }
      .product-name { font-size: 0.95rem; }
      .sources-grid { grid-template-columns: 1fr; }
    }

    /* Grid Loading */
    .grid-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 3rem 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .grid-loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--rule);
      border-top-color: var(--accent3);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .grid-loading.hidden { display: none; }

    /* Skeleton Card */
    .skeleton-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 1rem 1.15rem;
      margin-bottom: 0.85rem;
      opacity: 0.6;
    }
    .skeleton-line {
      height: 12px;
      background: linear-gradient(90deg, var(--bg3) 25%, var(--rule) 50%, var(--bg3) 75%);
      background-size: 200% 100%;
      border-radius: 4px;
      margin-bottom: 0.5rem;
      animation: shimmer 1.5s infinite;
    }
    .skeleton-line.short { width: 40%; }
    .skeleton-line.medium { width: 60%; }
    .skeleton-line.long { width: 80%; }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--rule); }

    /* Search Info Card */
    .search-info-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 1rem 1.15rem;
      margin-bottom: 0.85rem;
    }
    .search-info-name {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .search-news-section {
      margin-top: 1.5rem;
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 1.25rem;
    }
    .search-news-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--accent3);
    }
    .search-news-group {
      margin-bottom: 1rem;
    }
    .search-news-group:last-child {
      margin-bottom: 0;
    }
    .search-news-product {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--rule);
    }
    .search-news-item {
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(71, 85, 105, 0.3);
    }
    .search-news-item:last-child {
      border-bottom: none;
    }
    .search-news-item-title {
      font-size: 0.85rem;
      color: var(--ink);
      margin-bottom: 0.2rem;
    }
    .search-news-item-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* ====== 分类分组方格子网格 ====== */
    .futures-grid-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0;
      border-radius: 16px;
      background: var(--bg2);
      border: 1px solid var(--rule);
      overflow: hidden;
    }
    /* 分类标签行 */
    .grid-category-tabs {
      display: flex;
      border-bottom: 1px solid var(--rule);
      background: var(--bg);
    }
    .grid-category-tab {
      flex: 1;
      text-align: center;
      padding: 0.7rem 0.3rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      border-right: 1px solid var(--rule);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      position: relative;
    }
    .grid-category-tab:last-child { border-right: none; }
    .grid-category-tab:hover { color: var(--ink); background: var(--bg3); }
    .grid-category-tab.active { color: var(--accent3); background: rgba(96, 165, 250, 0.1); }
    .grid-category-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 20%; right: 20%;
      height: 2px;
      background: var(--accent3);
      border-radius: 1px;
    }
    /* 分类区域 */
    .grid-category-section {
      border-bottom: 1px dashed var(--rule);
      padding: 0.75rem;
    }
    .grid-category-section:last-child { border-bottom: none; }
    .grid-category-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
      padding: 0 0.25rem;
    }
    .grid-category-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent3);
    }
    .grid-category-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .grid-category-count {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--muted);
      background: var(--bg3);
      padding: 0.1rem 0.4rem;
      border-radius: 8px;
    }
    /* 分类内格子 */
    .futures-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
      gap: 5px;
    }
    .futures-grid-item {
      position: relative;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      min-height: 62px;
      padding: 0.4rem;
      text-align: center;
      user-select: none;
    }
    .futures-grid-item::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 50%);
      pointer-events: none;
    }
    .futures-grid-item:hover {
      transform: scale(1.08) translateY(-2px);
      z-index: 10;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .futures-grid-item.bull {
      background: linear-gradient(135deg, rgba(248, 113, 113, 0.22), rgba(248, 113, 113, 0.06));
      border: 1px solid rgba(248, 113, 113, 0.3);
    }
    .futures-grid-item.bull:hover {
      border-color: rgba(248, 113, 113, 0.7);
      box-shadow: 0 8px 24px rgba(248, 113, 113, 0.2);
    }
    .futures-grid-item.bear {
      background: linear-gradient(135deg, rgba(52, 211, 153, 0.22), rgba(52, 211, 153, 0.06));
      border: 1px solid rgba(52, 211, 153, 0.3);
    }
    .futures-grid-item.bear:hover {
      border-color: rgba(52, 211, 153, 0.7);
      box-shadow: 0 8px 24px rgba(52, 211, 153, 0.2);
    }
    .futures-grid-item.neutral {
      background: linear-gradient(135deg, rgba(107, 114, 128, 0.18), rgba(107, 114, 128, 0.04));
      border: 1px solid rgba(107, 114, 128, 0.2);
    }
    /* 更新遮罩 */
    .futures-grid-item.updating::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 10px;
      z-index: 5;
      pointer-events: none;
    }
    .futures-grid-item.updating .grid-item-name {
      z-index: 6;
      position: relative;
    }
    .futures-grid-item.updating .grid-item-score,
    .futures-grid-item.updating .grid-item-change {
      opacity: 0;
    }
    .grid-item-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2;
      z-index: 1;
    }
    .grid-item-score {
      font-size: 0.68rem;
      font-family: var(--font-mono);
      margin-top: 0.15rem;
      z-index: 1;
      opacity: 0.85;
    }
    .grid-item-change {
      font-size: 0.62rem;
      font-family: var(--font-mono);
      margin-top: 0.05rem;
      z-index: 1;
      opacity: 0.7;
    }

    /* 浮动详情框 (Tooltip) */
    .grid-tooltip {
      position: fixed;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 1rem 1.25rem;
      min-width: 220px;
      max-width: 280px;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px) scale(0.95);
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }
    .grid-tooltip.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .grid-tooltip-name {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .grid-tooltip-badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      font-weight: 600;
    }
    .grid-tooltip-badge.bull { background: rgba(248, 113, 113, 0.2); color: var(--accent); }
    .grid-tooltip-badge.bear { background: rgba(52, 211, 153, 0.2); color: var(--accent2); }
    .grid-tooltip-row {
      display: flex;
      justify-content: space-between;
      padding: 0.25rem 0;
      font-size: 0.8rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .grid-tooltip-row:last-child { border-bottom: none; }
    .grid-tooltip-label { color: var(--muted); }
    .grid-tooltip-value { font-family: var(--font-mono); font-weight: 600; }

    /* 滚动信息栏 - 固定内容轻微闪烁 */
    .ticker-bar {
      flex: 1;
      height: 34px;
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      margin-left: 0.5rem;
      display: flex;
      align-items: center;
      padding: 0 0.75rem;
    }
    .ticker-track {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
      overflow: hidden;
      animation: ticker-pulse 3s ease-in-out infinite;
    }
    @keyframes ticker-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.8rem;
      color: var(--ink);
      flex-shrink: 0;
    }
    .ticker-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .ticker-dot.bull { background: var(--accent); }
    .ticker-dot.bear { background: var(--accent2); }
    .ticker-dot.vol { background: var(--warning); }
  </style>
</head>
<body>



  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <img src="./assets/logo.png" alt="智投罗盘" style="width:42px;height:42px;border-radius:10px;object-fit:cover;">
        <div class="logo-text">智投罗盘</div>
      </div>
      <div class="header-meta">
        <div class="search-box">
          <input type="text" class="search-input" id="searchInput" placeholder="搜索名称或代码...">
          <button class="search-btn" id="searchBtn">&#128269;</button>
        </div>
        <div class="refresh-indicator">
          <div class="refresh-dot"></div>
          <span>实时分析中</span>
        </div>
        <button class="force-refresh-btn" id="forceRefreshBtn" title="强制刷新，立即重新获取数据">
          <span class="refresh-icon">&#x21bb;</span> 刷新
        </button>
        <span>下次更新: <span class="countdown" id="countdown">15:00</span></span>
        <span id="lastUpdate">--:--</span>
        <button id="themeToggle" title="切换背景颜色" style="background:var(--bg3);border:1px solid var(--rule);color:var(--ink);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;" onmouseover="this.style.borderColor='var(--accent3)'" onmouseout="this.style.borderColor='var(--rule)'">&#9790;</button>
      </div>
    </div>
  </header>

  <!-- Main Layout with Sidebar -->
  <div class="app-layout">
    <!-- Left Sidebar - Market Analysis Report -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-panel">
        <div class="sidebar-header">
          <div class="sidebar-header-icon">&#128200;</div>
          <div class="sidebar-header-title">市场研报</div>
          <div class="sidebar-header-time" id="reportTime">--:--</div>
        </div>
        <div class="sidebar-body" id="reportBody">
          <div class="report-loading">
            <div class="spinner"></div>
            <div>等待分析数据...</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="app-main">
      <!-- Search Results -->
      <div class="search-results" id="searchResults" style="display:none;">
        <div class="search-results-header">
          <h2 class="search-results-title">&#128269; 搜索结果</h2>
          <button class="search-results-clear" id="searchClear">清除搜索</button>
        </div>
        <div class="dual-grid" id="search-grid"></div>
      </div>

      <!-- Commodity Section - 50只期货列表 -->
      <div class="section-content active" id="section-commodity">
        <div class="section-header">
          <h2 class="section-title">国内大宗商品</h2>
          <p class="section-desc">50只主力期货合约实时分析 | 点击表头可排序</p>
        </div>
        <!-- 方格子网格收纳按钮 + 滚动信息栏 -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;gap:0.5rem;">
          <button id="toggleTableBtn" onclick="toggleFuturesTable()" style="background:var(--bg3);border:1px solid var(--rule);color:var(--muted);padding:0.4rem 0.8rem;border-radius:6px;cursor:pointer;font-family:var(--font);font-size:0.8rem;transition:all 0.2s;display:flex;align-items:center;gap:0.3rem;flex-shrink:0;">
            <span id="toggleIcon" style="transition:transform 0.3s;">&#x25BC;</span>
            <span id="toggleText">收起网格</span>
          </button>
          <div class="ticker-bar" id="tickerBar" onclick="showTickerDetail()">
            <div class="ticker-track" id="tickerTrack">
              <span style="padding:0 1rem;font-size:0.8rem;color:var(--muted);">分析完成后显示板块情报...</span>
            </div>
          </div>
          <span id="tableCount" style="font-size:0.75rem;color:var(--muted);flex-shrink:0;">共50只期货合约</span>
        </div>
        <div id="commodity-table-container" style="transition:max-height 0.4s ease,opacity 0.3s ease;max-height:2000px;opacity:1;overflow-y:auto;max-height:600px;border:1px solid var(--rule);border-radius:10px;">
          <div id="futures-grid" class="futures-grid-wrapper">
            <!-- 分类标签行 -->
            <div class="grid-category-tabs" id="gridCategoryTabs">
              <div class="grid-category-tab active" data-cat="precious" onclick="scrollToCategory('precious')">贵金属</div>
              <div class="grid-category-tab" data-cat="agri" onclick="scrollToCategory('agri')">农产品</div>
              <div class="grid-category-tab" data-cat="chemical" onclick="scrollToCategory('chemical')">化工品</div>
              <div class="grid-category-tab" data-cat="energy" onclick="scrollToCategory('energy')">能源</div>
              <div class="grid-category-tab" data-cat="building" onclick="scrollToCategory('building')">建材耗品</div>
              <div class="grid-category-tab" data-cat="other" onclick="scrollToCategory('other')">其他</div>
            </div>
            <!-- 分类区域容器 -->
            <div id="gridCategoriesContainer">
              <div style="text-align:center;padding:3rem;color:var(--muted);">
                <div class="spinner" style="width:32px;height:32px;margin:0 auto 1rem;"></div>
                正在加载期货数据...
              </div>
            </div>
          </div>
        </div>
        <!-- 推荐区域 -->
        <div id="commodity-recommendations" style="margin-top:2rem;">
          <div class="section-header" style="margin-top:0;">
            <h2 class="section-title">AI推荐</h2>
            <p class="section-desc">基于50只期货综合评分筛选</p>
          </div>
          <div class="dual-grid" id="commodity-rec-grid">
            <div class="grid-loading" id="rec-loading">
              <div class="spinner"></div>
              <span>等待分析完成...</span>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Footer -->
  <footer class="app-footer">
    <p>智投罗盘 - AI驱动的金融投资分析工具 | 数据仅供参考，投资有风险</p>
