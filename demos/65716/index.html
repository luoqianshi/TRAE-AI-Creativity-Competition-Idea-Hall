<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>牛马解压创意方案｜打工人治愈放松工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#fef3f8,#f0f7ff,#f5f3ff);
  font-family:"Microsoft Yahei",sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#333;
}
.box{
  background:#ffffffcc;
  backdrop-filter:blur(10px);
  border-radius:24px;
  padding:40px 30px;
  max-width:520px;
  width:100%;
  box-shadow:0 8px 32px #00000015;
  text-align:center;
}
h1{
  font-size:26px;
  color:#222;
  margin-bottom:16px;
}
.desc{
  font-size:15px;
  color:#555;
  line-height:1.8;
  margin-bottom:30px;
}
.mascot{
  font-size:80px;
  margin:20px 0;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0px);}
  50%{transform:translateY(-12px);}
}
.slogan{
  font-size:16px;
  color:#9c6ade;
  font-weight:bold;
  margin:20px 0;
}
.tip{
  background:#f8f4ff;
  padding:16px;
  border-radius:16px;
  margin-top:20px;
  font-size:14px;
  color:#666;
  line-height:1.7;
}
</style>
</head>
<body>
<div class="box">
  <h1>牛马解压治愈空间</h1>
  <p class="desc">
专为当代打工人打造的轻量化情绪解压工具<br/>
接纳疲惫、允许松弛、治愈内卷内耗
  </p>
  <div class="mascot">🐴</div>
  <p class="slogan">辛苦了！今天的牛马，也超棒✨</p>
  <div class="tip">
【创意说明】<br/>
当代上班族长期内卷高压、情绪压抑，习惯性硬撑、不敢示弱。本作品依托年轻人热门的「牛马治愈自嘲文化」，打造零门槛线上解压页面，用温柔丧萌的氛围，帮助用户快速放松心情、释放工作压力、缓解精神内耗，实现短时情绪自愈。
  </div>
</div>
</body>
</html>
