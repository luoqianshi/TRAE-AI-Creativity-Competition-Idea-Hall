<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苏格拉底数学导师</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #e8f4fc 0%, #f5f7fa 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部标题区 */
        .header {
            background: linear-gradient(135deg, #4a90d9 0%, #5ba3e8 100%);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 10px rgba(74, 144, 217, 0.3);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 16px;
        }

        .topic-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }

        .topic-btn {
            padding: 10px 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .topic-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .topic-btn.active {
            background: white;
            color: #4a90d9;
            border-color: white;
        }

        /* 主内容区 */
        .main-container {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* 左侧输入区 */
        .input-section {
            width: 35%;
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
        }

        .input-section h2 {
            color: #4a90d9;
            font-size: 18px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e8f4fc;
        }

        .problem-input {
            width: 100%;
            height: 200px;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            padding: 16px;
            font-size: 15px;
            line-height: 1.6;
            resize: none;
            transition: border-color 0.3s;
        }

        .problem-input:focus {
            outline: none;
            border-color: #4a90d9;
        }

        .example-btn {
            margin-top: 12px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #6bb3f0 0%, #4a90d9 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .example-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 144, 217, 0.4);
        }

        .hint-text {
            margin-top: 16px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        .problem-selector {
            margin-bottom: 16px;
        }

        .selector-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            display: block;
        }

        .selector-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .selector-btn {
            padding: 8px 16px;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            background: white;
            color: #666;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .selector-btn:hover {
            border-color: #4a90d9;
            color: #4a90d9;
        }

        .selector-btn.active {
            background: linear-gradient(135deg, #4a90d9 0%, #5ba3e8 100%);
            color: white;
            border-color: #4a90d9;
        }

        /* 右侧对话区 */
        .chat-section {
            width: 65%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 24px;
            background: #f8fafc;
            border-bottom: 1px solid #e0e6ed;
        }

        .chat-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .chat-header h2 {
            color: #4a90d9;
            font-size: 18px;
        }

        /* 进度条 */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .progress-text {
            font-size: 14px;
            color: #4a90d9;
            font-weight: bold;
            min-width: 40px;
        }

        .progress-bar {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .progress-segment {
            width: 60px;
            height: 8px;
            background: #e0e6ed;
            border-radius: 4px;
            transition: all 0.5s ease;
            position: relative;
        }

        .progress-segment.completed {
            background: linear-gradient(90deg, #67c23a 0%, #85ce61 100%);
        }

        .progress-segment.active {
            background: linear-gradient(90deg, #4a90d9 0%, #6bb3f0 100%);
            box-shadow: 0 0 8px rgba(74, 144, 217, 0.5);
        }

        .progress-segment.completed::after {
            content: '✓';
            position: absolute;
            right: -18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: #67c23a;
            font-weight: bold;
        }

        .step-indicators {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e0e6ed;
            transition: all 0.3s;
        }

        .step-dot.active {
            background: #4a90d9;
        }

        .step-dot.completed {
            background: #67c23a;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 300px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message.student {
            justify-content: flex-end;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .message.ai .avatar {
            background: linear-gradient(135deg, #4a90d9 0%, #6bb3f0 100%);
        }

        .message.student .avatar {
            background: linear-gradient(135deg, #67c23a 0%, #85ce61 100%);
        }

        .bubble {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .message.ai .bubble {
            background: #f0f7ff;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message.student .bubble {
            background: linear-gradient(135deg, #67c23a 0%, #85ce61 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        /* 选项按钮 */
        .options-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        .option-btn {
            padding: 10px 18px;
            background: white;
            border: 2px solid #4a90d9;
            border-radius: 20px;
            color: #4a90d9;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: #4a90d9;
            color: white;
        }

        .option-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 输入回复区 */
        .reply-input-container {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .reply-input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #e0e6ed;
            border-radius: 20px;
            font-size: 14px;
        }

        .reply-input:focus {
            outline: none;
            border-color: #4a90d9;
        }

        .reply-btn {
            padding: 10px 20px;
            background: #4a90d9;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .reply-btn:hover {
            background: #3a7bc8;
        }

        /* 提示展开按钮 */
        .hint-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: #fff3cd;
            border: 1px solid #ffeeba;
            border-radius: 20px;
            color: #856404;
            cursor: pointer;
            font-size: 13px;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .hint-toggle:hover {
            background: #ffeeba;
        }

        .hint-content {
            margin-top: 10px;
            padding: 12px;
            background: #f8fafc;
            border-left: 4px solid #4a90d9;
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            color: #495057;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 思维导图式总结卡片 */
        .mindmap-card {
            background: linear-gradient(135deg, #fff9e6 0%, #fff3cd 100%);
            border: 2px solid #ffc107;
            border-radius: 16px;
            padding: 24px;
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mindmap-card h3 {
            color: #856404;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
        }

        .mindmap-root {
            background: linear-gradient(135deg, #4a90d9 0%, #6bb3f0 100%);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            position: relative;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(74, 144, 217, 0.3);
        }

        .mindmap-root::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 20px;
            background: #ffc107;
        }

        .mindmap-branches {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .mindmap-branch {
            background: white;
            border: 2px solid #4a90d9;
            border-radius: 12px;
            padding: 16px;
            min-width: 140px;
            max-width: 180px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .mindmap-branch:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(74, 144, 217, 0.2);
        }

        .branch-icon {
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }

        .branch-title {
            color: #4a90d9;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            text-align: center;
            border-bottom: 1px solid #e8f4fc;
            padding-bottom: 8px;
        }

        .branch-content {
            color: #555;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }

        /* 底部操作区 */
        .footer {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e6ed;
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .action-btn {
            padding: 14px 40px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .start-btn {
            background: linear-gradient(135deg, #4a90d9 0%, #6bb3f0 100%);
            color: white;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(74, 144, 217, 0.4);
        }

        .start-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .reset-btn {
            background: #f5f5f5;
            color: #666;
            border: 2px solid #ddd;
        }

        .reset-btn:hover {
            background: #eee;
        }

        /* 最终总结卡片 */
        .final-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(74, 144, 217, 0.15);
            border: 2px solid #e8f4fc;
            padding: 24px;
            margin-top: 20px;
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.5s ease;
        }

        .final-card.animate-in {
            opacity: 1;
            transform: scale(1);
        }

        .final-card-title {
            font-size: 20px;
            font-weight: bold;
            color: #4a90d9;
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e8f4fc;
        }

        .final-card-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .final-card-section {
            display: flex;
            gap: 16px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
            border-left: 4px solid #4a90d9;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .final-card-section:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(74, 144, 217, 0.1);
        }

        .section-icon {
            font-size: 28px;
            flex-shrink: 0;
        }

        .section-info {
            flex: 1;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #4a90d9;
            margin-bottom: 8px;
        }

        .section-text {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }

        .section-text ol {
            margin: 0;
            padding-left: 20px;
        }

        .section-text li {
            margin-bottom: 4px;
        }

        /* 打字机光标 */
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #4a90d9;
            margin-left: 2px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* 空状态提示 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
            }
            .input-section, .chat-section {
                width: 100%;
            }
            .mindmap-branches {
                flex-direction: column;
                align-items: center;
            }
            .mindmap-branch {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部标题 -->
    <header class="header">
        <h1>🧠 苏格拉底数学导师</h1>
        <p>我不替你算，我帮你学会怎么想</p>
        <div class="topic-selector">
            <button class="topic-btn active" data-key="trip_problem_001">🚗 行程问题</button>
            <button class="topic-btn" data-key="project_problem_001">🏗️ 工程问题</button>
            <button class="topic-btn" data-key="fraction_problem_001">📊 分数问题</button>
        </div>
    </header>

    <!-- 主内容区 -->
    <div class="main-container">
        <!-- 左侧输入区 -->
        <div class="input-section">
            <h2>📝 题目输入</h2>
            <div class="problem-selector">
                <span class="selector-label">选择题型：</span>
                <div class="selector-buttons">
                    <button class="selector-btn active" data-key="trip_problem_001">🚗 行程问题</button>
                    <button class="selector-btn" data-key="project_problem_001">🏗️ 工程问题</button>
                    <button class="selector-btn" data-key="fraction_problem_001">📊 分数问题</button>
                </div>
            </div>
            <textarea class="problem-input" id="problemInput" placeholder="请输入你的数学题目...&#10;&#10;例如：一辆汽车每小时行驶60千米，行驶了3小时，一共行驶了多少千米？"></textarea>
            <button class="example-btn" onclick="loadExample()">📚 加载示例题</button>
            <div class="hint-text">
                💡 <strong>提示：</strong>选择题型后点击"加载示例题"，然后点击"开始引导"，AI将通过提问帮助你理解解题思路。
            </div>
        </div>

        <!-- 右侧对话区 -->
        <div class="chat-section">
            <div class="chat-header">
                <div class="chat-header-top">
                    <h2>💬 引导对话</h2>
                    <div class="progress-container">
                        <span class="progress-text" id="progressText">0/4</span>
                        <div class="progress-bar" id="progressBar">
                            <div class="progress-segment" title="理解题意"></div>
                            <div class="progress-segment" title="拟定计划"></div>
                            <div class="progress-segment" title="执行计划"></div>
                            <div class="progress-segment" title="回顾反思"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="empty-state">
                    <div class="icon">🎯</div>
                    <p>输入题目并点击"开始引导"<br>开始你的思维探索之旅</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部操作区 -->
    <footer class="footer">
        <button class="action-btn start-btn" id="startBtn" onclick="startGuiding()">🚀 开始引导</button>
        <button class="action-btn reset-btn" onclick="resetAll()">🔄 重置</button>
    </footer>

    <script>
        let currentStep = 0;
        let isGuiding = false;
        let problemText = '';
        let studentAnswers = [];
        let currentProblemKey = 'trip_problem_001';
        let currentProblem = null;

        const socraticTutor = {
            "trip_problem_001": {
                title: "基础行程问题",
                question: "一辆汽车以每小时60千米的速度行驶了3小时，请问共行驶了多少千米？",
                steps: [
                    {
                        id: 1,
                        phase: "理解题意",
                        aiText: "👋 你好，我是苏格拉底导师。我不会直接告诉你答案，但我会陪你找到它。<br><br>先看题目：这里有'速度'，有'时间'，最后问'路程'。你觉得这属于哪类数学问题？",
                        options: ["行程问题", "工程问题", "分数应用题"],
                        feedback: "没错！这是典型的行程问题。你抓住了题目的核心特征。"
                    },
                    {
                        id: 2,
                        phase: "拟定计划",
                        aiText: "🧠 既然是行程问题，你的脑海里有没有浮现出一个重要的公式？它是把哪三个量联系在一起的？",
                        options: ["路程 = 速度 × 时间", "总价 = 单价 × 数量", "工作总量 = 工效 × 时间"],
                        feedback: "完美！这就是我们要用的'数学钥匙'。现在我们有了速度和时间的数值，可以开锁了。"
                    },
                    {
                        id: 3,
                        phase: "执行计划",
                        aiText: "🔢 现在请把数字填入公式中。60千米/时 乘以 3小时，算式应该怎么列？<br>(提示：注意单位哦)",
                        userInput: true,
                        correctAnswer: "60×3",
                        feedback: "正确！60 × 3 = 180。千万别忘了加上单位——千米。"
                    },
                    {
                        id: 4,
                        phase: "回顾反思",
                        aiText: "🎉 恭喜你！我们再来复盘一下：<br>1. 识别了题型<br>2. 调用了公式<br>3. 准确计算了结果<br><br>如果题目变成：'路程180km，速度60km/h，求时间'，公式该怎么变形呢？",
                        finalCard: true
                    }
                ]
            },
            "project_problem_001": {
                title: "工程问题（合作）",
                question: "一项工程，甲队单独做需要10天完成，乙队单独做需要15天完成。两队合做，几天可以完成？",
                steps: [
                    {
                        id: 1,
                        phase: "理解题意",
                        aiText: "🏗️ 这是一个工程合作问题。<br><br>我们先看已知条件：甲单独10天，乙单独15天。<br><br>这里有个陷阱：题目没告诉我们这项工程一共多长、多少量，对吗？那我们数学上通常用谁来代表这项工程的总量？",
                        options: ["用具体的公里数", "用单位'1'", "用总天数相加"],
                        feedback: "太棒了！用'1'来表示整体，这是工程问题的精髓——把抽象的量具象化。"
                    },
                    {
                        id: 2,
                        phase: "拟定计划",

                        userInput: true,
                        correctAnswer: "9/20",
                        feedback: "通分正确！1/4 + 1/5 = 5/20 + 4/20 = 9/20。<br>最后：120 × 9/20 = 54(页)。"
                    },
                    {
                        id: 4,
                        phase: "回顾反思",
                        aiText: "🎉 复盘成功：<br>1. 锁定单位'1'（120页）<br>2. 统一分率（1/4 和 1/5）<br>3. 求和后再乘总量<br><br>💡 进阶：如果题目变成'第二天比第一天少看10页'，这时'单位1'变了吗？",

        };

        const problemTypes = {
            journey: {
                name: '行程问题',
                icon: '🚗',
                formula: '路程 = 速度 × 时间',
                description: '研究物体运动的路程、速度、时间之间关系的问题'
            },
            engineering: {
                name: '工程问题',
                icon: '🏗️',
                formula: '工作量 = 工作效率 × 工作时间',
                description: '研究完成某项工作所需时间和效率的问题'
            },
            fraction: {
                name: '分数问题',
                icon: '📊',
                formula: '部分量 = 总量 × 对应分率',
                description: '涉及分数、百分数的应用题'
            }
        };

        const teachingGuideChain = {
            journey: [
                {
                    step: 1,
                    phase: '理解题意',
                    question: '先不急着算。我们来当一回侦探，先把题目里的线索都找出来。你看，这道题里既有"速度"，又有"时间"，最后问的是"路程"。这在数学里我们通常叫它——？',
                    type: 'options',
                    options: ['🚗 行程问题', '🏗️ 工程问题', '📊 分数问题', '❓ 不确定']
                },
                {
                    step: 2,
                    phase: '提取条件',
                    question: '很好！那题目里明确告诉我们的数字有哪些？它们分别代表什么？',
                    type: 'options',
                    options: ['60千米/时是速度，3小时是时间', '60小时是时间，3千米是路程', '60千米是路程，3小时是时间', '信息不全']
                },
                {
                    step: 3,
                    phase: '联想公式',
                    question: '既然确定了是行程问题，你的大脑里有没有一个"数学工具"（公式）能把"速度"、"时间"和"路程"这三个家伙联系在一起？',
                    type: 'options',
                    options: ['路程 = 速度 × 时间', '速度 = 路程 ÷ 时间', '时间 = 路程 ÷ 速度', '不知道']
                },
                {
                    step: 4,
                    phase: '逻辑建模',
                    question: '对！就是 路程 = 速度 × 时间 。这个公式就像一把钥匙。现在，我们手里有"速度"这把钥匙齿，也有"时间"这把钥匙齿，能不能打开"路程"这把锁？在列算式之前，我们再确认一下：单位统一吗？（千米和小时）',
                    type: 'options',
                    options: ['✅ 统一，不需要换算', '❌ 不统一，需要换算', '不确定', '不知道']
                },
                {
                    step: 5,
                    phase: '引导列式',
                    question: '那么，把数字填进公式里，这个算式应该怎么写？',
                    type: 'options',
                    options: ['60 × 3 = ?', '3 ÷ 60 = ?', '60 ÷ 3 = ?', '不知道'],
                    hint: '60 × 3 = ?'
                },
                {
                    step: 6,
                    phase: '计算过程',
                    question: '计算这一步的时候，心里是怎么想的？60乘3，其实就是几个几十？',
                    type: 'options',
                    options: ['3个60', '60个3', '6个30', '不知道']
                },
                {
                    step: 7,
                    phase: '验证合理性',
                    question: '180！你算得非常准。但是别忘了——数学是严谨的，180后面跟什么单位？',
                    type: 'options',
                    options: ['千米', '小时', '米', '不需要单位']
                },
                {
                    step: 8,
                    phase: '总结反思',
                    question: '我们来检查一下。如果一辆车每小时跑60千米，跑了3小时，一共跑了180千米，这个数字听起来合理吗？会不会太大或太小？',
                    type: 'options',
                    options: ['✅ 合理', '❌ 太大', '❌ 太小', '不确定']
                }
            ]
        };

        const summaryTemplates = {
            journey: {
                root: '🚗 行程问题',
                branches: [
                    { icon: '📌', title: '题型识别', content: '涉及路程、速度、时间关系' },
                    { icon: '📋', title: '已知条件', content: '速度60千米/时，时间3小时' },
                    { icon: '📐', title: '核心公式', content: '路程 = 速度 × 时间' },
                    { icon: '✏️', title: '解题算式', content: '60 × 3 = 180千米' }
                ],
                reflection: [
                    '太棒了！你刚才经历了一个完整的数学家思考过程：',
                    '1️⃣ 找线索 → 识别题型，提取已知条件',
                    '2️⃣ 选工具 → 联想合适的数学公式',
                    '3️⃣ 算结果 → 列式计算，注意单位',
                    '4️⃣ 验答案 → 检查结果是否合理',
                    '',
                    '� <strong>变式挑战：</strong>如果题目反过来问："路程180千米，速度60千米/时，求时间"，你知道该怎么调整公式吗？'
                ]
            }
        };

        document.querySelectorAll('.selector-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.selector-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentProblemKey = this.dataset.key;
            });
        });

        document.querySelectorAll('.topic-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.selector-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelector(`.selector-btn[data-key="${this.dataset.key}"]`)?.classList.add('active');
                currentProblemKey = this.dataset.key;
                loadExample();
            });
        });

        function loadExample() {
            currentProblem = socraticTutor[currentProblemKey];
            document.getElementById('problemInput').value = currentProblem.question;
        }

        function updateProgress() {
            const totalSteps = currentProblem ? currentProblem.steps.length : 4;
            const progressText = document.getElementById('progressText');
            const progressSegments = document.querySelectorAll('.progress-segment');
            
            progressText.textContent = `${currentStep}/${totalSteps}`;
            
            progressSegments.forEach((segment, index) => {
                segment.classList.remove('completed', 'active');
                if (index < currentStep) {
                    segment.classList.add('completed');
                } else if (index === currentStep) {
                    segment.classList.add('active');
                }
            });
        }

        function addMessage(content, isAI, hasOptions = false, options = [], hasInput = false, hint = null, callback = null) {
            const chatMessages = document.getElementById('chatMessages');
            
            const emptyState = chatMessages.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isAI ? 'ai' : 'student'}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = isAI ? '🤖' : '👤';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            if (isAI) {
                typeWriter(bubble, content, () => {
                    if (hasOptions) {
                        addOptions(bubble, options);
                    }
                    if (hasInput) {
                        addInputField(bubble);
                    }
                    if (hint) {
                        addHintButton(bubble, hint);
                    }
                    if (callback) callback();
                });
            } else {
                bubble.textContent = content;
                if (callback) callback();
            }
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            chatMessages.appendChild(messageDiv);
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function typeWriter(element, text, callback, index = 0) {
            if (index < text.length) {
                element.innerHTML = text.substring(0, index + 1) + '<span class="typing-cursor"></span>';
                setTimeout(() => typeWriter(element, text, callback, index + 1), 30);
            } else {
                element.innerHTML = text;
                if (callback) callback();
            }
        }

        function addOptions(bubble, options) {
            const container = document.createElement('div');
            container.className = 'options-container';
            
            options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => selectOption(index, option);
                container.appendChild(btn);
            });
            
            bubble.appendChild(container);
        }

        function addInputField(bubble) {
            const container = document.createElement('div');
            container.className = 'reply-input-container';
            
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'reply-input';
            input.placeholder = '输入你的答案...';
            input.id = 'studentInput';
            
            const btn = document.createElement('button');
            btn.className = 'reply-btn';
            btn.textContent = '发送';
            btn.onclick = () => submitInput();
            
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') submitInput();
            });
            
            container.appendChild(input);
            container.appendChild(btn);
            bubble.appendChild(container);
            
            setTimeout(() => input.focus(), 100);
        }

        function addHintButton(bubble, hintText) {
            const toggle = document.createElement('button');
            toggle.className = 'hint-toggle';
            toggle.innerHTML = '💡 点击展开提示';
            
            toggle.onclick = () => {
                if (toggle.nextElementSibling && toggle.nextElementSibling.classList.contains('hint-content')) {
                    toggle.nextElementSibling.remove();
                    toggle.innerHTML = '💡 点击展开提示';
                } else {
                    const content = document.createElement('div');
                    content.className = 'hint-content';
                    content.textContent = hintText;
                    bubble.insertBefore(content, toggle.nextSibling);
                    toggle.innerHTML = '💡 收起提示';
                }
            };
            
            bubble.appendChild(toggle);
        }

        function selectOption(index, optionText) {
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
            });
            
            addMessage(optionText, false);
            studentAnswers.push({ type: 'option', value: index, text: optionText });
            
            setTimeout(() => {
                const step = currentProblem.steps[currentStep];
                if (step.feedback) {
                    addMessage(step.feedback, true, false, [], false, null, () => {
                        setTimeout(processNextStep, 800);
                    });
                } else {
                    processNextStep();
                }
            }, 500);
        }

        function submitInput() {
            const input = document.getElementById('studentInput');
            const value = input.value.trim();
            
            if (!value) return;
            
            input.disabled = true;
            input.parentElement.querySelector('.reply-btn').disabled = true;
            
            addMessage(value, false);
            studentAnswers.push({ type: 'input', value: value });
            
            setTimeout(() => {
                const step = currentProblem.steps[currentStep];
                if (step.feedback) {
                    addMessage(step.feedback, true, false, [], false, null, () => {
                        setTimeout(processNextStep, 800);
                    });
                } else {
                    processNextStep();
                }
            }, 500);
        }

        function processNextStep() {
            currentStep++;
            updateProgress();
            
            if (currentStep < currentProblem.steps.length) {
                const step = currentProblem.steps[currentStep];
                if (step.finalCard) {
                    showFinalCard(step);
                } else {
                    addMessage(step.aiText, true, step.options && step.options.length > 0, step.options || [], step.userInput || false);
                }
            } else {
                showSummary();
            }
        }

        function showFinalCard(step) {
            const chatMessages = document.getElementById('chatMessages');
            
            const finalCardDiv = document.createElement('div');
            finalCardDiv.className = 'final-card';
            
            const cardTitle = document.createElement('div');
            cardTitle.className = 'final-card-title';
            cardTitle.innerHTML = '🎉 解题思路总结';
            
            const cardContent = document.createElement('div');
            cardContent.className = 'final-card-content';
            
            const formulaSection = document.createElement('div');
            formulaSection.className = 'final-card-section';
            formulaSection.innerHTML = `
                <div class="section-icon">📌</div>
                <div class="section-info">
                    <div class="section-title">核心公式</div>
                    <div class="section-text">${getFormulaByType()}</div>
                </div>
            `;
            
            const stepsSection = document.createElement('div');
            stepsSection.className = 'final-card-section';
            stepsSection.innerHTML = `
                <div class="section-icon">📝</div>
                <div class="section-info">
                    <div class="section-title">解题步骤</div>
                    <div class="section-text">
                        <ol>
                            ${currentProblem.steps.map((s, i) => `<li>${s.phase}</li>`).join('')}
                        </ol>
                    </div>
                </div>
            `;
            
            const variantSection = document.createElement('div');
            variantSection.className = 'final-card-section';
            variantSection.innerHTML = `
                <div class="section-icon">💡</div>
                <div class="section-info">
                    <div class="section-title">变式思考</div>
                    <div class="section-text">${getVariantQuestion()}</div>
                </div>
            `;
            
            cardContent.appendChild(formulaSection);
            cardContent.appendChild(stepsSection);
            cardContent.appendChild(variantSection);
            
            finalCardDiv.appendChild(cardTitle);
            finalCardDiv.appendChild(cardContent);
            
            chatMessages.appendChild(finalCardDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            setTimeout(() => {
                finalCardDiv.classList.add('animate-in');
            }, 50);
            
            isGuiding = false;
            document.getElementById('startBtn').disabled = false;
        }

        function getFormulaByType() {
            if (currentProblemKey.includes('trip')) return '路程 = 速度 × 时间';
            if (currentProblemKey.includes('project')) return '工作时间 = 工作总量 ÷ 工作效率';
            if (currentProblemKey.includes('fraction')) return '部分量 = 总量 × 对应分率';
            return '核心公式';
        }

        function getVariantQuestion() {
            if (currentProblemKey.includes('trip')) return '如果题目反过来问："路程180km，速度60km/h，求时间"，公式该怎么变形？';
            if (currentProblemKey.includes('project')) return '如果甲队中途休息了2天，这个算式该怎么调整？';
            if (currentProblemKey.includes('fraction')) return '如果题目变成"第二天比第一天少看10页"，这时"单位1"变了吗？';
            return '变式思考题';
        }

        function showSummary() {
            const chatMessages = document.getElementById('chatMessages');
            
            const summaryDiv = document.createElement('div');
            summaryDiv.className = 'message ai';
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = '🤖';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            const template = summaryTemplates[currentType];
            
            let branchesHTML = '';
            template.branches.forEach(branch => {
                branchesHTML += `
                    <div class="mindmap-branch">
                        <div class="branch-icon">${branch.icon}</div>
                        <div class="branch-title">${branch.title}</div>
                        <div class="branch-content">${branch.content}</div>
                    </div>
                `;
            });
            
            let reflectionHTML = '<div style="margin-top: 16px; padding: 16px; background: #e8f4fc; border-radius: 12px;">';
            template.reflection.forEach(line => {
                reflectionHTML += `<p style="margin-bottom: 8px; color: #333;">${line}</p>`;
            });
            reflectionHTML += '</div>';
            
            const summaryHTML = `
                <div class="mindmap-card">
                    <h3>🎉 思维导图画板</h3>
                    <div class="mindmap-root">${template.root}</div>
                    <div class="mindmap-branches">${branchesHTML}</div>
                </div>
                ${reflectionHTML}
            `;
            
            typeWriter(bubble, '恭喜你完成了思维引导！这是你的解题思路总结：', () => {
                bubble.innerHTML += summaryHTML;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
            
            summaryDiv.appendChild(avatar);
            summaryDiv.appendChild(bubble);
            chatMessages.appendChild(summaryDiv);
            
            isGuiding = false;
            document.getElementById('startBtn').disabled = false;
        }

        function startGuiding() {
            const input = document.getElementById('problemInput');
            problemText = input.value.trim();
            
            if (!problemText) {
                alert('请先输入题目！');
                return;
            }
            
            currentProblem = socraticTutor[currentProblemKey];
            
            currentStep = 0;
            studentAnswers = [];
            isGuiding = true;
            document.getElementById('startBtn').disabled = true;
            
            document.getElementById('chatMessages').innerHTML = '';
            updateProgress();
            
            setTimeout(() => {
                const step = currentProblem.steps[currentStep];
                addMessage(step.aiText, true, step.options && step.options.length > 0, step.options || [], step.userInput || false);
            }, 500);
        }

        function resetAll() {
            document.getElementById('problemInput').value = '';
            document.getElementById('chatMessages').innerHTML = `
                <div class="empty-state">
                    <div class="icon">🎯</div>
                    <p>输入题目并点击"开始引导"<br>开始你的思维探索之旅</p>
                </div>
            `;
            document.getElementById('startBtn').disabled = false;
            currentStep = 0;
            isGuiding = false;
            studentAnswers = [];
            problemText = '';
            currentProblem = null;
            updateProgress();
        }

        updateProgress();
    </script>
