<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日新知 - 让世界更近</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 30px 20px;
            color: white;
        }

        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header .subtitle {
            font-size: 1.3rem;
            opacity: 0.95;
        }

        .date-display {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 8px 24px;
            border-radius: 30px;
            margin-top: 15px;
            font-size: 1.1rem;
        }

        /* 搜索区域 */
        .search-area {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 500px;
        }

        .search-input {
            width: 100%;
            padding: 14px 50px 14px 20px;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 30px;
            background: rgba(255,255,255,0.25);
            color: white;
            font-size: 1.15rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s;
        }

        .search-input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .search-input:focus {
            background: white;
            color: #333;
            border-color: white;
        }

        .search-input:focus::placeholder {
            color: #999;
        }

        .search-clear {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.8);
            font-size: 1.3rem;
            cursor: pointer;
            display: none;
        }

        .search-input:focus + .search-clear,
        .search-clear.visible {
            color: #667eea;
            display: block;
        }

        /* 搜索结果区域 */
        .search-results {
            display: none;
            margin-bottom: 25px;
        }

        .search-results.active {
            display: block;
        }

        .search-results-header {
            color: white;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .no-results {
            background: white;
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            color: #718096;
            font-size: 1.2rem;
        }

        /* 今日模式特殊样式 */
        .today-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #744210;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .today-countdown {
            background: rgba(255,255,255,0.15);
            color: white;
            padding: 10px 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.05rem;
        }

        .world-today-panel {
            display: none;
            background: white;
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }

        .world-today-panel.active {
            display: block;
        }

        .world-today-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .world-today-header h2 {
            font-size: 1.9rem;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .world-today-header p {
            color: #718096;
            font-size: 1.08rem;
            line-height: 1.6;
        }

        .world-today-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .world-item {
            border: 2px solid #edf2f7;
            border-radius: 18px;
            padding: 20px;
            background: #f8fafc;
        }

        .world-item-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
        }

        .world-item-tag {
            display: inline-block;
            border-radius: 18px;
            padding: 5px 12px;
            color: white;
            font-size: 0.92rem;
        }

        .world-item-confidence {
            color: #718096;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .world-item h3 {
            font-size: 1.25rem;
            color: #2d3748;
            line-height: 1.45;
            margin-bottom: 10px;
        }

        .world-item p {
            color: #4a5568;
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .world-item a {
            color: #667eea;
            font-weight: bold;
            text-decoration: none;
        }

        .world-item a:hover {
            text-decoration: underline;
        }

        /* 分类标签 */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .category-tab {
            background: rgba(255,255,255,0.25);
            border: 2px solid rgba(255,255,255,0.4);
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .category-tab:hover, .category-tab.active {
            background: white;
            color: #667eea;
            font-weight: bold;
        }

        /* 主卡片 */
        .main-card {
            background: white;
            border-radius: 24px;
            padding: 35px;
            margin-bottom: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }

        .card-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 2.2rem;
            color: #2d3748;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .card-icon {
            font-size: 4rem;
            text-align: center;
            margin: 20px 0;
        }

        .card-content {
            font-size: 1.25rem;
            line-height: 2;
            color: #4a5568;
            margin-bottom: 25px;
        }

        .card-content p {
            margin-bottom: 15px;
        }

        .simple-explain {
            background: #fff5f5;
            border-left: 5px solid #f56565;
            padding: 20px 25px;
            border-radius: 0 12px 12px 0;
            margin: 20px 0;
        }

        .simple-explain h3 {
            color: #c53030;
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .simple-explain p {
            font-size: 1.15rem;
            color: #744210;
            line-height: 1.8;
        }

        .usage-steps {
            background: #f0fff4;
            border-radius: 16px;
            padding: 25px;
            margin: 20px 0;
        }

        .usage-steps h3 {
            color: #276749;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .usage-steps ol {
            padding-left: 25px;
        }

        .usage-steps li {
            font-size: 1.15rem;
            line-height: 2;
            color: #2f855a;
            margin-bottom: 8px;
        }

        .fun-fact {
            background: #ebf8ff;
            border-radius: 16px;
            padding: 20px 25px;
            margin-top: 20px;
        }

        .fun-fact h3 {
            color: #2b6cb0;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .fun-fact p {
            font-size: 1.1rem;
            color: #2c5282;
            line-height: 1.7;
        }

        /* 操作按钮 */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 30px;
            font-size: 1.15rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #edf2f7;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        /* 历史记录 */
        .history-section {
            margin-top: 30px;
        }

        .section-title {
            color: white;
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .history-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .history-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }

        .history-card .h-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .history-card .h-title {
            font-size: 1.3rem;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .history-card .h-desc {
            font-size: 1rem;
            color: #718096;
            line-height: 1.6;
        }

        .history-card .h-date {
            font-size: 0.9rem;
            color: #a0aec0;
            margin-top: 12px;
        }

        /* 操作教程 */
        .tutorial-card {
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            border: 2px solid #fed7aa;
            border-radius: 20px;
            padding: 24px;
            grid-column: 1 / -1;
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.18);
        }

        .tutorial-card h3 {
            color: #9a3412;
            font-size: 1.45rem;
            margin-bottom: 10px;
        }

        .tutorial-card p {
            color: #7c2d12;
            font-size: 1.08rem;
            line-height: 1.7;
            margin-bottom: 14px;
        }

        .tutorial-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #fb923c 0%, #f97316 100%);
            color: white;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.1rem;
            padding: 12px 24px;
            transition: all 0.3s;
        }

        .tutorial-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.35);
        }

        .tutorial-video {
            text-align: center;
        }

        .tutorial-title {
            font-size: 1.85rem;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .tutorial-subtitle {
            font-size: 1.1rem;
            color: #718096;
            margin-bottom: 20px;
        }

        .tutorial-screen {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border-radius: 22px;
            color: white;
            min-height: 280px;
            padding: 26px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 3px rgba(255,255,255,0.08);
        }

        .tutorial-scene {
            font-size: 4.8rem;
            margin-bottom: 18px;
            animation: floatScene 1.6s ease-in-out infinite;
        }

        @keyframes floatScene {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .tutorial-step-title {
            font-size: 1.55rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .tutorial-step-desc {
            font-size: 1.15rem;
            line-height: 1.7;
            max-width: 560px;
            color: #e2e8f0;
        }

        .tutorial-progress {
            height: 10px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
            margin: 18px 0;
        }

        .tutorial-progress-bar {
            height: 100%;
            width: 0;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            transition: width 0.35s;
        }

        .tutorial-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .tutorial-control-btn {
            border: none;
            border-radius: 22px;
            background: #edf2f7;
            color: #2d3748;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.05rem;
            padding: 10px 20px;
        }

        .tutorial-control-btn.primary {
            background: #48bb78;
            color: white;
        }

        /* 模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 35px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 2rem;
            cursor: pointer;
            color: #a0aec0;
            background: none;
            border: none;
        }

        .modal-close:hover {
            color: #4a5568;
        }

        /* 语音按钮 */
        .voice-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #48bb78;
            color: white;
            padding: 10px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1rem;
            border: none;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .voice-btn:hover {
            background: #38a169;
        }

        .voice-btn.playing {
            background: #e53e3e;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 2rem;
            }
            .card-title {
                font-size: 1.7rem;
            }
            .main-card {
                padding: 25px 20px;
            }
            .card-content {
                font-size: 1.1rem;
            }
        }

        /* 字体大小调节 */
        .font-size-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .font-size-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: white;
            color: #667eea;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .font-size-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>📚 每日新知</h1>
            <p class="subtitle">每天了解一个新发明、新潮流，和世界保持同步</p>
            <div class="date-display" id="currentDate"></div>
        </div>

        <!-- 搜索区域 -->
        <div class="search-area">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索新发明、新梗、生活常识..." oninput="handleSearch(this.value)">
                <button class="search-clear" id="searchClear" onclick="clearSearch()">&times;</button>
            </div>
        </div>

        <!-- 搜索结果区域 -->
        <div class="search-results" id="searchResults">
            <div class="search-results-header" id="searchResultsHeader"></div>
            <div class="history-grid" id="searchResultsGrid"></div>
        </div>

        <!-- 分类标签 -->
        <div class="category-tabs" id="categoryTabs">
            <button class="category-tab active" data-category="all">全部</button>
            <button class="category-tab" data-category="today" id="todayTab">📅 今日新知</button>
            <button class="category-tab" data-category="tech">科技发明</button>
            <button class="category-tab" data-category="life">生活常识</button>
            <button class="category-tab" data-category="internet">网络新梗</button>
            <button class="category-tab" data-category="trend">社会潮流</button>
        </div>

        <!-- 今日模式提示 -->
        <div class="today-countdown" id="todayCountdown" style="display: none;">
            🌟 今日模式会优先展示“今天世界上新增/发布/流行了什么”，并标注可信度。
        </div>

        <!-- 今日世界新创造 / 新梗 -->
        <div class="world-today-panel" id="worldTodayPanel">
            <div class="world-today-header">
                <h2 id="worldTodayTitle">🌍 今日世界新创造 / 新梗</h2>
                <p id="worldTodaySummary"></p>
            </div>
            <div class="world-today-grid" id="worldTodayGrid"></div>
        </div>

        <!-- 今日主卡片 -->
        <div class="main-card" id="mainCard">
            <div id="todayBadgeArea"></div>
            <div class="card-badge" id="cardBadge">今日推荐</div>
            <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">
                <span>🔊</span> 朗读内容
            </button>
            <h2 class="card-title" id="cardTitle">加载中...</h2>
            <div class="card-icon" id="cardIcon">⏳</div>
            <div class="card-content" id="cardContent"></div>
            <div class="simple-explain" id="simpleExplain"></div>
            <div class="usage-steps" id="usageSteps"></div>
            <div class="fun-fact" id="funFact"></div>
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="nextCard()">换一个 👉</button>
                <button class="btn btn-secondary" onclick="shareContent()">分享 📤</button>
            </div>
        </div>

        <!-- 历史记录 -->
        <div class="history-section" id="historySection">
            <h2 class="section-title" id="historySectionTitle">📖 往期回顾</h2>
            <div class="history-grid" id="historyGrid"></div>
        </div>
    </div>

    <!-- 模态框 -->
    <div class="modal-overlay" id="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- 字体大小控制 -->
    <div class="font-size-control">
        <button class="font-size-btn" onclick="changeFontSize(-1)" title="缩小字体">A-</button>
        <button class="font-size-btn" onclick="changeFontSize(1)" title="放大字体">A+</button>
    </div>

    <script>
        // ===== 知识库数据 =====
        const knowledgeBase = [
            {
                id: 1,
                category: "life",
                title: "如何乘坐地铁",
                icon: "🚇",
                badge: "生活常识",
                badgeColor: "#48bb78",
                content: `
                    <p>地铁是城市里跑得很快的"地下火车"，不会堵车，是很多人出门的首选。</p>
                    <p>现在的地铁非常智能，买票、进站、出站都可以用手机完成，不用排队。</p>
                `,
                simpleExplain: `
                    <h3>💡 一句话说明</h3>
                    <p>地铁就是在地下跑的公交车，有固定的路线和站点，速度比地面交通快很多。</p>
                `,
                usageSteps: `
                    <h3>📝 乘坐步骤</h3>
                    <ol>
                        <li>找到地铁站入口，有醒目的"M"或地铁标志</li>
                        <li>买票或刷手机进站（可以问工作人员帮忙）</li>
                        <li>看清要去的方向，不要坐反了</li>
                        <li>到站后按指示牌出站</li>
                    </ol>
                `,
                funFact: `
                    <h3>🎯 小知识</h3>
                    <p>中国现在很多城市的地铁可以用手机扫码直接进出，甚至不需要买票！只需要在手机上开通"乘车码"功能即可。</p>
                `,
                date: "2026-06-25"
            },
            {
                id: 2,
                category: "tech",
                title: "二维码是什么",
                icon: "🔲",
                badge: "科技发明",
                badgeColor: "#667eea",
                content: `
                    <p>二维码就是那种黑白相间的小方块图案，现在到处都能看到它。</p>
                    <p>它就像一个"隐形链接"，用手机一扫，就能打开网页、加好友、付钱、看菜单等等。</p>
                `,

                },
                {

                    why: '软件应该显示“未确认”，而不是编一个假的新梗。后续可接入微博、抖音、B站、X/TikTok 热榜来自动抓取。',
                    source: '系统说明',
                    url: '#',
                    videoSteps: [
                        { icon: '😂', title: '新梗是什么', desc: '新梗就是网上突然流行起来的一句话、动作、表情包或玩笑。' },
                        { icon: '📱', title: '它从哪里来', desc: '很多新梗先出现在短视频、直播、评论区或社交平台，不一定有正式新闻报道。' },
                        { icon: '🔎', title: '为什么要核验', desc: '如果没有可靠来源，就不能说它是“今天刚诞生的全球热梗”，否则容易误导老人。' },
                        { icon: '✅', title: '软件应该怎么做', desc: '最好接入多个热榜来源，确认真的在流行后，再用大白话解释给大家。' }
                    ]
                }
            ]
        };

        // ===== 全局状态 =====
        let currentIndex = 0;
        let currentCategory = 'all';
        let fontSizeLevel = 0;
        let isSpeaking = false;
        let speechUtterance = null;
        let isTodayMode = false;
        let searchQuery = '';
        let todayIndex = 0;
        let lastAutoTutorialKey = '';
        let currentTutorial = null;
        let currentTutorialStep = 0;
        let tutorialTimer = null;

        // ===== 初始化 =====
        function init() {
            showDate();
            // 根据日期选择当日内容
            todayIndex = getDayOfYear() % knowledgeBase.length;
            currentIndex = todayIndex;
            renderWorldTodayPanel();
            renderCard(knowledgeBase[currentIndex]);
            renderHistory();
            setupTabs();
        }

        function getDayOfYear() {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 0);
            return Math.floor((now - start) / (1000 * 60 * 60 * 24));
        }

        function showDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', options);
        }

        // ===== 渲染主卡片 =====
        function renderCard(item) {
            // 今日模式徽章
            const badgeArea = document.getElementById('todayBadgeArea');
            if (isTodayMode && currentIndex === todayIndex) {
                badgeArea.innerHTML = '<div class="today-badge">📅 今日新知 · 每日更新</div>';
            } else {
                badgeArea.innerHTML = '';
            }

            document.getElementById('cardBadge').textContent = item.badge;
            document.getElementById('cardBadge').style.background = `linear-gradient(135deg, ${item.badgeColor} 0%, ${adjustColor(item.badgeColor, -20)} 100%)`;
            document.getElementById('cardTitle').textContent = item.title;
            document.getElementById('cardIcon').textContent = item.icon;
            document.getElementById('cardContent').innerHTML = item.content;
            document.getElementById('simpleExplain').innerHTML = item.simpleExplain;
            document.getElementById('usageSteps').innerHTML = item.usageSteps;
            document.getElementById('funFact').innerHTML = item.funFact;

            // 停止朗读
            stopVoice();
        }

        function adjustColor(color, amount) {
            const num = parseInt(color.replace('#', ''), 16);
            const r = Math.min(255, Math.max(0, (num >> 16) + amount));
            const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
            const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
            return `#${(0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1)}`;
        }

        // ===== 切换卡片 =====
        function nextCard() {
            const filtered = getFilteredItems();
            currentIndex = (currentIndex + 1) % filtered.length;
            renderCard(filtered[currentIndex]);
        }

        function getFilteredItems() {
            if (currentCategory === 'all') return knowledgeBase;
            if (currentCategory === 'today') return [knowledgeBase[todayIndex]];
            return knowledgeBase.filter(item => item.category === currentCategory);
        }

        // ===== 分类标签 =====
        function setupTabs() {
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentCategory = tab.dataset.category;
                    isTodayMode = currentCategory === 'today';

                    // 显示/隐藏今日模式提示
                    document.getElementById('todayCountdown').style.display = isTodayMode ? 'block' : 'none';
                    document.getElementById('worldTodayPanel').classList.toggle('active', isTodayMode);

                    // 清除搜索
                    clearSearch();

                    currentIndex = 0;
                    const filtered = getFilteredItems();
                    if (filtered.length > 0) {
                        renderCard(filtered[0]);
                    }
                    renderHistory();
                });
            });
        }

        // ===== 搜索功能 =====
        function handleSearch(query) {
            searchQuery = query.trim();
            const searchClear = document.getElementById('searchClear');
            const searchResults = document.getElementById('searchResults');
            const searchResultsHeader = document.getElementById('searchResultsHeader');
            const searchResultsGrid = document.getElementById('searchResultsGrid');
            const mainCard = document.getElementById('mainCard');
            const historySection = document.getElementById('historySection');
            const categoryTabs = document.getElementById('categoryTabs');

            if (searchQuery) {
                searchClear.classList.add('visible');
                const matchedTutorial = findTutorial(searchQuery);

                // 执行搜索
                const results = knowledgeBase.filter(item => {
                    const text = (item.title + ' ' + stripHtml(item.content) + ' ' + stripHtml(item.simpleExplain) + ' ' + item.badge).toLowerCase();
                    return text.includes(searchQuery.toLowerCase());
                });

                // 隐藏主卡片和历史区域，显示搜索结果
                mainCard.style.display = 'none';
                if (historySection) historySection.style.display = 'none';
                searchResults.classList.add('active');
                document.getElementById('todayCountdown').style.display = 'none';
                document.getElementById('worldTodayPanel').classList.remove('active');

                searchResultsHeader.textContent = `🔍 "${searchQuery}" 的搜索结果 (${results.length} 条)`;

                if (results.length === 0) {
                    searchResultsGrid.innerHTML = `
                        ${matchedTutorial ? renderTutorialCard(matchedTutorial) : ''}
                        <div class="no-results" style="grid-column: 1 / -1;">
                            😕 没有找到相关内容<br><br>
                            试试搜索：地铁、二维码、人工智能、外卖...
                        </div>
                    `;
                } else {
                    searchResultsGrid.innerHTML = `
                        ${matchedTutorial ? renderTutorialCard(matchedTutorial) : ''}
                        ${results.map(item => `
                        <div class="history-card" onclick="showModal(${item.id})">
                            <span class="h-badge" style="background: ${item.badgeColor}20; color: ${item.badgeColor}">${item.badge}</span>
                            <div class="h-title">${item.icon} ${highlightText(item.title, searchQuery)}</div>
                            <div class="h-desc">${highlightText(stripHtml(item.simpleExplain).replace('💡 一句话说明', '').trim(), searchQuery)}</div>
                            <div class="h-date">📅 ${item.date}</div>
                        </div>
                    `).join('')}
                    `;
                }

                // 搜到教程关键词时自动弹出教程，避免每输入一个字都反复弹出
                if (matchedTutorial && searchQuery.length >= 2) {
                    const autoKey = matchedTutorial.id + ':' + searchQuery.toLowerCase();
                    if (lastAutoTutorialKey !== autoKey) {
                        lastAutoTutorialKey = autoKey;
                        setTimeout(() => showTutorial(matchedTutorial.id, true), 250);
                    }
                }
            } else {
                searchClear.classList.remove('visible');
                searchResults.classList.remove('active');
                mainCard.style.display = 'block';
                if (historySection) historySection.style.display = 'block';
                lastAutoTutorialKey = '';
                if (isTodayMode) {
                    document.getElementById('todayCountdown').style.display = 'block';
                    document.getElementById('worldTodayPanel').classList.add('active');
                }
            }
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            handleSearch('');
        }

        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
            return text.replace(regex, '<mark style="background: #fef3c7; padding: 2px 4px; border-radius: 4px;">$1</mark>');
        }

        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function findTutorial(query) {
            const normalized = query.toLowerCase();
            return tutorialLibrary.find(tutorial =>
                tutorial.keywords.some(keyword => normalized.includes(keyword.toLowerCase()))
            );
        }

        function renderTutorialCard(tutorial) {
            return `
                <div class="tutorial-card">
                    <h3>🎬 找到相关操作教程：${tutorial.title}</h3>
                    <p>${tutorial.subtitle}。点击下面按钮，可以像看短视频一样一步一步学习。</p>
                    <button class="tutorial-btn" onclick="showTutorial('${tutorial.id}', false)">▶ 观看操作教程</button>
                </div>
            `;
        }

        function renderWorldTodayPanel() {
            document.getElementById('worldTodayTitle').textContent = `🌍 ${worldTodayFeed.title}`;
            document.getElementById('worldTodaySummary').textContent = worldTodayFeed.summary;
            document.getElementById('worldTodayGrid').innerHTML = worldTodayFeed.items.map((item, index) => `
                <div class="world-item">
                    <div class="world-item-top">
                        <span class="world-item-tag" style="background:${item.color}">${item.tag}</span>
                        <span class="world-item-confidence">可信度：${item.confidence}</span>
                    </div>
                    <h3>${item.title}</h3>
                    <p>${item.simple}</p>
                    <p><strong>给长辈的解释：</strong>${item.why}</p>
                    <div class="action-buttons" style="justify-content: flex-start; margin-top: 14px;">
                        <button class="tutorial-btn" onclick="showWorldVideo(${index})">▶ 看视频解释</button>
                    </div>
                    ${item.url === '#' ? `<span style="color:#718096;">来源：${item.source}</span>` : `<a href="${item.url}" target="_blank" rel="noopener">来源：${item.source}</a>`}
                </div>
            `).join('');
        }

        function showWorldVideo(index) {
            const item = worldTodayFeed.items[index];
            if (!item || !item.videoSteps) return;

            stopVoice();
            stopTutorial();
            currentTutorial = {
                title: item.title,
                subtitle: `用视频方式解释：${item.tag} · 可信度：${item.confidence}`,
                steps: item.videoSteps
            };
            currentTutorialStep = 0;

            document.getElementById('modalBody').innerHTML = `
                <div class="tutorial-video">
                    <div class="card-badge" style="background:${item.color};">今日${item.tag}视频解释</div>
                    <h2 class="tutorial-title">🎬 ${item.title}</h2>
                    <p class="tutorial-subtitle">适合给长辈看的慢速分步讲解</p>
                    <div class="tutorial-screen">
                        <div class="tutorial-scene" id="tutorialScene"></div>
                        <div class="tutorial-step-title" id="tutorialStepTitle"></div>
                        <div class="tutorial-step-desc" id="tutorialStepDesc"></div>
                    </div>
                    <div class="tutorial-progress">
                        <div class="tutorial-progress-bar" id="tutorialProgressBar"></div>
                    </div>
                    <div class="tutorial-controls">
                        <button class="tutorial-control-btn" onclick="previousTutorialStep()">上一步</button>
                        <button class="tutorial-control-btn primary" id="tutorialPlayBtn" onclick="toggleTutorialPlay()">暂停播放</button>
                        <button class="tutorial-control-btn" onclick="nextTutorialStep()">下一步</button>
                    </div>
                    <p class="tutorial-subtitle" style="margin-top: 16px;">说明：这是一段内置动画讲解，不需要打开外部视频网站。</p>
                </div>
            `;

            document.getElementById('modal').classList.add('active');
            renderTutorialStep();
            startTutorial();
        }

        // ===== 历史记录 =====
        function renderHistory() {
            const filtered = getFilteredItems();
            const grid = document.getElementById('historyGrid');
            const title = document.getElementById('historySectionTitle');

            // 今日模式下隐藏历史记录区域（因为只有一个内容）
            if (isTodayMode) {
                document.getElementById('historySection').style.display = 'none';
                return;
            }
            document.getElementById('historySection').style.display = 'block';
            title.textContent = currentCategory === 'all' ? '📖 往期回顾' : '📖 更多相关';

            const historyItems = filtered.filter((_, i) => i !== currentIndex).slice(0, 6);

            grid.innerHTML = historyItems.map(item => `
                <div class="history-card" onclick="showModal(${item.id})">
                    <span class="h-badge" style="background: ${item.badgeColor}20; color: ${item.badgeColor}">${item.badge}</span>
                    <div class="h-title">${item.icon} ${item.title}</div>
                    <div class="h-desc">${stripHtml(item.simpleExplain).replace('💡 一句话说明', '').trim()}</div>
                    <div class="h-date">📅 ${item.date}</div>
                </div>
            `).join('');
        }

        function stripHtml(html) {
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        // ===== 模态框 =====
        function showModal(id) {
            const item = knowledgeBase.find(k => k.id === id);
            if (!item) return;
            stopTutorial();

            document.getElementById('modalBody').innerHTML = `
                <div class="card-badge" style="background: linear-gradient(135deg, ${item.badgeColor} 0%, ${adjustColor(item.badgeColor, -20)} 100%)">${item.badge}</div>
                <h2 class="card-title">${item.icon} ${item.title}</h2>
                <div class="card-content">${item.content}</div>
                <div class="simple-explain">${item.simpleExplain}</div>
                <div class="usage-steps">${item.usageSteps}</div>
                <div class="fun-fact">${item.funFact}</div>
            `;
            document.getElementById('modal').classList.add('active');
        }

        function showTutorial(tutorialId, isAutoOpen) {
            const tutorial = tutorialLibrary.find(item => item.id === tutorialId);
            if (!tutorial) return;

            stopVoice();
            stopTutorial();
            currentTutorial = tutorial;
            currentTutorialStep = 0;

            document.getElementById('modalBody').innerHTML = `
                <div class="tutorial-video">
                    ${isAutoOpen ? `<div class="card-badge" style="background: #f97316;">自动推荐教程</div>` : ''}
                    <h2 class="tutorial-title">🎬 ${tutorial.title}</h2>
                    <p class="tutorial-subtitle">${isAutoOpen ? tutorial.autoTip : tutorial.subtitle}</p>
                    <div class="tutorial-screen">
                        <div class="tutorial-scene" id="tutorialScene"></div>
                        <div class="tutorial-step-title" id="tutorialStepTitle"></div>
                        <div class="tutorial-step-desc" id="tutorialStepDesc"></div>
                    </div>
                    <div class="tutorial-progress">
                        <div class="tutorial-progress-bar" id="tutorialProgressBar"></div>
                    </div>
                    <div class="tutorial-controls">
                        <button class="tutorial-control-btn" onclick="previousTutorialStep()">上一步</button>
                        <button class="tutorial-control-btn primary" id="tutorialPlayBtn" onclick="toggleTutorialPlay()">暂停播放</button>
                        <button class="tutorial-control-btn" onclick="nextTutorialStep()">下一步</button>
                    </div>
                    <p class="tutorial-subtitle" style="margin-top: 16px;">提示：看不懂也没关系，实际乘坐时可以把这个教程打开，对照一步一步操作。</p>
                </div>
            `;

            document.getElementById('modal').classList.add('active');
            renderTutorialStep();
            startTutorial();
        }

        function renderTutorialStep() {
            if (!currentTutorial) return;
            const step = currentTutorial.steps[currentTutorialStep];
            document.getElementById('tutorialScene').textContent = step.icon;
            document.getElementById('tutorialStepTitle').textContent = step.title;
            document.getElementById('tutorialStepDesc').textContent = step.desc;
            document.getElementById('tutorialProgressBar').style.width =
                `${((currentTutorialStep + 1) / currentTutorial.steps.length) * 100}%`;
        }

        function nextTutorialStep() {
            if (!currentTutorial) return;
            currentTutorialStep = (currentTutorialStep + 1) % currentTutorial.steps.length;
            renderTutorialStep();
        }

        function previousTutorialStep() {
            if (!currentTutorial) return;
            currentTutorialStep = (currentTutorialStep - 1 + currentTutorial.steps.length) % currentTutorial.steps.length;
            renderTutorialStep();
        }

        function startTutorial() {
            stopTutorial(false);
            tutorialTimer = setInterval(nextTutorialStep, 3200);
            const playBtn = document.getElementById('tutorialPlayBtn');
            if (playBtn) playBtn.textContent = '暂停播放';
        }

        function stopTutorial(resetState = true) {
            if (tutorialTimer) {
                clearInterval(tutorialTimer);
                tutorialTimer = null;
            }
            if (resetState) {
                currentTutorial = null;
                currentTutorialStep = 0;
            }
        }

        function toggleTutorialPlay() {
            const playBtn = document.getElementById('tutorialPlayBtn');
            if (tutorialTimer) {
                clearInterval(tutorialTimer);
                tutorialTimer = null;
                if (playBtn) playBtn.textContent = '继续播放';
            } else {
                startTutorial();
            }
        }

        function closeModal(event) {
            if (!event || event.target === document.getElementById('modal')) {
                stopTutorial();
                document.getElementById('modal').classList.remove('active');
            }
        }

        // ===== 语音朗读 =====
        function toggleVoice() {
            if (isSpeaking) {
                stopVoice();
            } else {
                startVoice();
            }
        }

        function startVoice() {
            if (!window.speechSynthesis) {
                alert('您的浏览器不支持语音朗读功能');
                return;
            }

            const item = getFilteredItems()[currentIndex];
            const text = `${item.title}。${stripHtml(item.content)} ${stripHtml(item.simpleExplain)} ${stripHtml(item.usageSteps)} ${stripHtml(item.funFact)}`;

            speechUtterance = new SpeechSynthesisUtterance(text);
            speechUtterance.lang = 'zh-CN';
            speechUtterance.rate = 0.9;
            speechUtterance.pitch = 1;

            speechUtterance.onend = () => {
                isSpeaking = false;
                updateVoiceButton();
            };

            window.speechSynthesis.speak(speechUtterance);
            isSpeaking = true;
            updateVoiceButton();
        }

        function stopVoice() {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            isSpeaking = false;
            updateVoiceButton();
        }

        function updateVoiceButton() {
            const btn = document.getElementById('voiceBtn');
            if (isSpeaking) {
                btn.innerHTML = '<span>⏹</span> 停止朗读';
                btn.classList.add('playing');
            } else {
                btn.innerHTML = '<span>🔊</span> 朗读内容';
                btn.classList.remove('playing');
            }
        }

        // ===== 字体大小 =====
        function changeFontSize(delta) {
            fontSizeLevel = Math.max(-2, Math.min(3, fontSizeLevel + delta));
            const baseSize = 100 + fontSizeLevel * 10;
            document.documentElement.style.fontSize = baseSize + '%';
        }

        // ===== 分享 =====
        function shareContent() {
            const item = getFilteredItems()[currentIndex];
            const text = `【每日新知】${item.title}\n\n${stripHtml(item.simpleExplain)}\n\n一起来了解世界的新变化吧！`;

            if (navigator.share) {
                navigator.share({
                    title: '每日新知',
                    text: text
                });
            } else {
                // 复制到剪贴板
                navigator.clipboard.writeText(text).then(() => {
                    alert('内容已复制到剪贴板，可以粘贴分享给朋友啦！');
                }).catch(() => {
                    alert('分享内容：\n\n' + text);
                });
            }
        }

        // ===== 启动 =====
        init();
    </script>
</body>
</html>
