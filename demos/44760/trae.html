<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>芯幕 · 硬件感知交互系统</title>
    <!-- 引入 Google Font 提升科技感 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #08080e;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #e0e6f0;
        }

        /* 主玻璃态卡片容器 */
        .dashboard {
            max-width: 1200px;
            width: 100%;
            background: rgba(18, 22, 36, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 48px;
            padding: 32px 36px;
            border: 1px solid rgba(0, 255, 255, 0.15);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 255, 255, 0.05) inset;
            transition: all 0.3s ease;
        }

        /* ===== 顶栏 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 36px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #00f0ff, #7b2ffc);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .logo-text {
            font-weight: 700;
            font-size: 24px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #f0faff, #a0c0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-sub {
            font-size: 12px;
            font-weight: 400;
            color: rgba(160, 180, 220, 0.6);
            letter-spacing: 2px;
            margin-left: 6px;
            -webkit-text-fill-color: rgba(160, 180, 220, 0.6);
            background: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .mode-switch {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 60px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .mode-btn {
            padding: 8px 18px;
            border: none;
            background: transparent;
            color: #8a9bb5;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 12px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
        }

        .mode-btn:hover {
            color: #d0dcf0;
        }

        .mode-btn.active {
            background: rgba(0, 240, 255, 0.15);
            color: #00f0ff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.1);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 240, 255, 0.06);
            padding: 6px 16px 6px 12px;
            border-radius: 40px;
            border: 1px solid rgba(0, 240, 255, 0.1);
            font-size: 13px;
            font-weight: 500;
            color: #b0ccff;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #00f0ff;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 12px #00f0ff;
            animation: pulse 1.8s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.4; transform: scale(0.9); }
        }

        /* ===== 指标网格 ===== */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }

        .metric-card {
            background: rgba(8, 12, 24, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 28px;
            padding: 24px 20px 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .metric-card:hover {
            border-color: rgba(0, 240, 255, 0.15);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            transform: translateY(-2px);
        }

        /* 环形图容器 */
        .ring-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .ring-svg {
            width: 120px;
            height: 120px;
            transform: rotate(-90deg);
        }

        .ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 8;
        }

        .ring-progress {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s cubic-bezier(0.23, 1, 0.32, 1), stroke 0.4s ease;
        }

        .ring-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .ring-value {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: block;
            line-height: 1.2;
        }

        .ring-unit {
            font-size: 12px;
            font-weight: 500;
            color: #7a8aa5;
            display: block;
            margin-top: 2px;
        }

        .metric-title {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #b0c4e0;
            letter-spacing: 0.5px;
        }

        .metric-sub {
            text-align: center;
            font-size: 12px;
            color: #5a6a85;
            margin-top: 2px;
        }

        /* 进度条卡片 (RAM & 存储) 特殊样式 */
        .bar-metric {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 16px 20px;
        }

        .bar-item {
            margin-bottom: 18px;
        }

        .bar-item:last-child {
            margin-bottom: 0;
        }

        .bar-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #b8ccf0;
        }

        .bar-header span:last-child {
            color: #7a8aa5;
            font-weight: 600;
        }

        .bar-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 20px;
            background: linear-gradient(90deg, #7b2ffc, #00f0ff);
            transition: width 0.9s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
        }

        .bar-fill.orange {
            background: linear-gradient(90deg, #fc7b2f, #ffb347);
        }

        .bar-fill.purple {
            background: linear-gradient(90deg, #a855f7, #7b2ffc);
        }

        /* ===== 底部：交互区 + 视觉化 ===== */
        .footer-area {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 24px;
            margin-top: 8px;
        }

        .interact-panel {
            background: rgba(8, 12, 24, 0.4);
            border-radius: 28px;
            padding: 20px 24px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .interact-title {
            font-size: 14px;
            font-weight: 600;
            color: #b0c4e0;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .interact-title small {
            font-weight: 400;
            color: #5a6a85;
            font-size: 12px;
        }

        .knob-group {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .knob-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 16px 8px 12px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .knob-item:hover {
            background: rgba(0, 240, 255, 0.05);
            border-color: rgba(0, 240, 255, 0.2);
        }

        .knob-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00f0ff;
            transition: 0.2s;
        }

        .knob-dot.off {
            background: #3a4a66;
        }

        .knob-label {
            font-size: 13px;
            font-weight: 500;
            color: #c0d0ec;
        }

        .knob-value {
            font-size: 13px;
            font-weight: 600;
            color: #00f0ff;
            min-width: 32px;
        }

        /* 右侧可视化动画 (生命力脉冲) */
        .visual-panel {
            background: rgba(8, 12, 24, 0.4);
            border-radius: 28px;
            padding: 20px 24px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .wave-container {
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .wave-bar {
            width: 8px;
            height: 20px;
            background: linear-gradient(to top, #7b2ffc, #00f0ff);
            border-radius: 20px;
            transition: height 0.4s ease;
            animation: wave 1.2s infinite alternate ease-in-out;
        }

        .wave-bar:nth-child(1) { animation-delay: 0.0s; height: 30px; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; height: 50px; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; height: 70px; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; height: 60px; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; height: 80px; }
        .wave-bar:nth-child(6) { animation-delay: 0.5s; height: 65px; }
        .wave-bar:nth-child(7) { animation-delay: 0.6s; height: 45px; }
        .wave-bar:nth-child(8) { animation-delay: 0.7s; height: 30px; }
        .wave-bar:nth-child(9) { animation-delay: 0.8s; height: 55px; }
        .wave-bar:nth-child(10) { animation-delay: 0.9s; height: 75px; }
        .wave-bar:nth-child(11) { animation-delay: 1.0s; height: 40px; }
        .wave-bar:nth-child(12) { animation-delay: 1.1s; height: 25px; }

        @keyframes wave {
            0% { height: 20px; opacity: 0.6; transform: scaleY(0.8); }
            100% { height: 80px; opacity: 1; transform: scaleY(1); }
        }

        .visual-status {
            margin-top: 10px;
            font-size: 12px;
            color: #5a7a9a;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1024px) {
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
            .footer-area { grid-template-columns: 1fr; }
        }

        @media (max-width: 600px) {
            .dashboard { padding: 20px; border-radius: 28px; }
            .header { flex-direction: column; align-items: flex-start; gap: 16px; }
            .metrics-grid { grid-template-columns: 1fr; }
            .ring-svg { width: 100px; height: 100px; }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 0; }

        /* 硬件交互反馈 */
        .knob-item.active-knob {
            border-color: #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="dashboard" id="app">
        <!-- 顶栏 -->
        <header class="header">
            <div class="logo-area">
                <div class="logo-icon">◆</div>
                <span class="logo-text">芯幕 <span class="logo-sub">CoreVision</span></span>
            </div>
            <div class="header-actions">
                <div class="mode-switch">
                    <button class="mode-btn" data-mode="eco">节能</button>
                    <button class="mode-btn active" data-mode="balance">平衡</button>
                    <button class="mode-btn" data-mode="performance">极致</button>
                </div>
                <div class="status-badge">
                    <span class="pulse-dot"></span> 系统运行中
                </div>
            </div>
        </header>

        <!-- 核心指标 -->
        <section class="metrics-grid">
            <!-- CPU -->
            <div class="metric-card">
                <div class="ring-wrapper">
                    <svg class="ring-svg" viewBox="0 0 120 120">
                        <circle class="ring-bg" cx="60" cy="60" r="52" />
                        <circle class="ring-progress" id="cpuRing" cx="60" cy="60" r="52"
                            stroke="#00f0ff" stroke-dasharray="326.726" stroke-dashoffset="326.726" />
                    </svg>
                    <div class="ring-label">
                        <span class="ring-value" id="cpuVal">67</span>
                        <span class="ring-unit">%</span>
                    </div>
                </div>
                <div class="metric-title">Intel Core i9-14900K</div>
                <div class="metric-sub">5.2 GHz · 45°C</div>
            </div>

            <!-- GPU -->
            <div class="metric-card">
                <div class="ring-wrapper">
                    <svg class="ring-svg" viewBox="0 0 120 120">
                        <circle class="ring-bg" cx="60" cy="60" r="52" />
                        <circle class="ring-progress" id="gpuRing" cx="60" cy="60" r="52"
                            stroke="#a855f7" stroke-dasharray="326.726" stroke-dashoffset="326.726" />
                    </svg>
                    <div class="ring-label">
                        <span class="ring-value" id="gpuVal">84</span>
                        <span class="ring-unit">%</span>
                    </div>
                </div>
                <div class="metric-title">NVIDIA RTX 4090</div>
                <div class="metric-sub">2.6 GHz · 72°C</div>
            </div>

            <!-- RAM + 存储 使用进度条卡片 -->
            <div class="metric-card bar-metric">
                <div class="bar-item">
                    <div class="bar-header">
                        <span>📈 内存 (RAM)</span>
                        <span id="ramText">24.8 / 32.0 GB</span>
                    </div>
                    <div class="bar-track">
                        <div class="bar-fill" id="ramBar" style="width: 77%;"></div>
                    </div>
                </div>
                <div class="bar-item">
                    <div class="bar-header">
                        <span>💾 存储 (SSD)</span>
                        <span id="storageText">512 / 1024 GB</span>
                    </div>
                    <div class="bar-track">
                        <div class="bar-fill orange" id="storageBar" style="width: 50%;"></div>
                    </div>
                </div>
                <div class="bar-item" style="margin-top: 6px;">
                    <div class="bar-header">
                        <span>🌐 网络</span>
                        <span style="color:#00f0ff;">45.2 Mbps</span>
                    </div>
                    <div class="bar-track">
                        <div class="bar-fill purple" id="netBar" style="width: 35%;"></div>
                    </div>
                </div>
            </div>

            <!-- 额外小卡片：风扇 / 功率 -->
            <div class="metric-card" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
                <div style="display: flex; gap: 24px; width: 100%; justify-content: center;">
                    <div style="text-align: center;">
                        <div style="font-size: 28px; font-weight: 700; color: #00f0ff;">1,850</div>
                        <div style="font-size: 12px; color: #5a6a85;">风扇 RPM</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 28px; font-weight: 700; color: #fbbf24;">320</div>
                        <div style="font-size: 12px; color: #5a6a85;">功率 (W)</div>
                    </div>
                </div>
                <div style="margin-top: 12px; width: 100%; height: 4px; background: rgba(255,255,255,0.05); border-radius: 10px;">
                    <div style="width: 72%; height: 100%; background: linear-gradient(90deg, #7b2ffc, #00f0ff); border-radius: 10px;"></div>
                </div>
                <div style="font-size: 11px; color: #4a5a75; margin-top: 8px;">总负载均衡</div>
            </div>
        </section>

        <!-- 底部：交互 + 可视化 -->
        <footer class="footer-area">
            <!-- 左：硬件交互面板 -->
            <div class="interact-panel">
                <div class="interact-title">
                    ⚡ 硬件交互 <small>· 物理旋钮模拟</small>
                </div>
                <div class="knob-group">
                    <div class="knob-item active-knob" id="knobPerformance">
                        <span class="knob-dot"></span>
                        <span class="knob-label">性能模式</span>
                        <span class="knob-value" id="modeDisplay">平衡</span>
                    </div>
                    <div class="knob-item" id="knobFan">
                        <span class="knob-dot off"></span>
                        <span class="knob-label">风扇策略</span>
                        <span class="knob-value" id="fanDisplay">自动</span>
                    </div>
                    <div class="knob-item" id="knobRGB">
                        <span class="knob-dot"></span>
                        <span class="knob-label">灯效同步</span>
                        <span class="knob-value" id="rgbDisplay">开启</span>
                    </div>
                </div>
                <div style="margin-top: 12px; display: flex; gap: 10px; font-size: 12px; color: #4a5a75;">
                    <span>🔄 点击旋钮切换状态</span>
                </div>
            </div>

            <!-- 右：动态可视化 (生命力脉冲) -->
            <div class="visual-panel">
                <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                    <span style="font-size: 14px; font-weight: 600; color: #b0c4e0;">❤️ 硬件生命力</span>
                    <span style="font-size: 11px; color: #4a6a8a;">动态脉冲</span>
                </div>
                <div class="wave-container">
                    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                </div>
                <div class="visual-status">● 系统感知 · 实时数据流</div>
            </div>
        </footer>
    </div>

    <script>
        (function() {
            'use strict';

            // DOM 元素
            const cpuVal = document.getElementById('cpuVal');
            const gpuVal = document.getElementById('gpuVal');
            const cpuRing = document.getElementById('cpuRing');
            const gpuRing = document.getElementById('gpuRing');
            const ramBar = document.getElementById('ramBar');
            const storageBar = document.getElementById('storageBar');
            const netBar = document.getElementById('netBar');
            const ramText = document.getElementById('ramText');
            const storageText = document.getElementById('storageText');

            const modeBtns = document.querySelectorAll('.mode-btn');
            const modeDisplay = document.getElementById('modeDisplay');
            const fanDisplay = document.getElementById('fanDisplay');
            const rgbDisplay = document.getElementById('rgbDisplay');
            const knobPerformance = document.getElementById('knobPerformance');
            const knobFan = document.getElementById('knobFan');
            const knobRGB = document.getElementById('knobRGB');

            // 状态
            let cpu = 67, gpu = 84;
            let ram = 77, storage = 50, net = 35;
            let mode = 'balance';
            let fanState = 'auto';
            let rgbState = 'on';

            // 环形周长 (2 * PI * 52)
            const circumference = 326.726;

            function updateRing(element, value) {
                const offset = circumference - (value / 100) * circumference;
                element.style.strokeDashoffset = offset;
            }

            // 随机波动但保持在一定范围
            function randomWalk(current, min, max, step) {
                let delta = (Math.random() - 0.5) * step * 2;
                let newVal = current + delta;
                if (newVal > max) newVal = max - (delta * 0.5);
                if (newVal < min) newVal = min + (delta * 0.5);
                return Math.round(newVal);
            }

            // 更新UI
            function updateMetrics() {
                // CPU
                cpu = randomWalk(cpu, 15, 95, 4);
                cpuVal.textContent = cpu;
                updateRing(cpuRing, cpu);

                // GPU
                gpu = randomWalk(gpu, 20, 98, 5);
                gpuVal.textContent = gpu;
                updateRing(gpuRing, gpu);

                // RAM
                ram = randomWalk(ram, 30, 92, 3);
                ramBar.style.width = ram + '%';
                const totalRam = 32.0;
                const usedRam = (ram / 100) * totalRam;
                ramText.textContent = usedRam.toFixed(1) + ' / ' + totalRam.toFixed(1) + ' GB';

                // Storage
                storage = randomWalk(storage, 20, 85, 2);
                storageBar.style.width = storage + '%';
                const totalStorage = 1024;
                const usedStorage = (storage / 100) * totalStorage;
                storageText.textContent = Math.round(usedStorage) + ' / ' + totalStorage + ' GB';

                // Net (波动小一点)
                net = randomWalk(net, 10, 70, 5);
                netBar.style.width = net + '%';
            }

            // 模式切换
            function setMode(m) {
                mode = m;
                const modeMap = { eco: '节能', balance: '平衡', performance: '极致' };
                modeDisplay.textContent = modeMap[m] || '平衡';
                // 更新按钮样式
                modeBtns.forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.mode === m) {
                        btn.classList.add('active');
                    }
                });
                // 模拟性能变化
                if (m === 'performance') {
                    document.querySelector('.dashboard').style.boxShadow = '0 25px 60px rgba(0,0,0,0.8), 0 0 0 2px rgba(0, 240, 255, 0.2) inset';
                } else if (m === 'eco') {
                    document.querySelector('.dashboard').style.boxShadow = '0 25px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(100, 200, 100, 0.1) inset';
                } else {
                    document.querySelector('.dashboard').style.boxShadow = '0 25px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(0, 240, 255, 0.05) inset';
                }
            }

            // 切换旋钮状态
            function toggleKnob(knobElement, displayElement, states, labels) {
                let currentIdx = 0;
                return function() {
                    currentIdx = (currentIdx + 1) % states.length;
                    const state = states[currentIdx];
                    displayElement.textContent = labels[currentIdx];
                    // 更新小圆点
                    const dot = knobElement.querySelector('.knob-dot');
                    if (state === 'off' || state === 'manual' || state === 'off') {
                        dot.classList.add('off');
                    } else {
                        dot.classList.remove('off');
                    }
                    knobElement.classList.toggle('active-knob', state === 'on' || state === 'performance' || state === 'auto');
                    // 特定反馈
                    if (knobElement === knobFan) {
                        fanDisplay.textContent = labels[currentIdx];
                    }
                    if (knobElement === knobRGB) {
                        rgbDisplay.textContent = labels[currentIdx];
                    }
                    if (knobElement === knobPerformance) {
                        // 性能旋钮联动模式
                        const modeMap = { '平衡': 'balance', '极致': 'performance', '节能': 'eco' };
                        const modeKey = modeMap[labels[currentIdx]] || 'balance';
                        setMode(modeKey);
                    }
                };
            }

            // 初始化旋钮
            const perfStates = ['平衡', '极致', '节能'];
            const perfLabels = ['平衡', '极致', '节能'];
            knobPerformance.addEventListener('click', toggleKnob(knobPerformance, modeDisplay, perfStates, perfLabels));

            const fanStates = ['auto', 'manual', 'turbo'];
            const fanLabels = ['自动', '手动', '全速'];
            knobFan.addEventListener('click', toggleKnob(knobFan, fanDisplay, fanStates, fanLabels));

            const rgbStates = ['on', 'off', 'breath'];
            const rgbLabels = ['开启', '关闭', '呼吸'];
            knobRGB.addEventListener('click', toggleKnob(knobRGB, rgbDisplay, rgbStates, rgbLabels));

            // 顶部模式按钮点击
            modeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const m = this.dataset.mode;
                    setMode(m);
                    // 同步性能旋钮显示
                    const modeMap = { eco: '节能', balance: '平衡', performance: '极致' };
                    modeDisplay.textContent = modeMap[m] || '平衡';
                    // 更新旋钮激活样式
                    document.querySelectorAll('.knob-item').forEach(k => k.classList.remove('active-knob'));
                    knobPerformance.classList.add('active-knob');
                });
            });

            // 定时更新 (模拟实时数据)
            setInterval(updateMetrics, 1200);

            // 初始更新
            updateMetrics();
            // 设置初始环
            updateRing(cpuRing, cpu);
            updateRing(gpuRing, gpu);

            // 额外：模拟点击反馈
            document.querySelectorAll('.knob-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    // 微小的触感反馈
                    this.style.transform = 'scale(0.96)';
                    setTimeout(() => { this.style.transform = 'scale(1)'; }, 150);
                });
            });

        })();
    </script>

</body>
</html>
