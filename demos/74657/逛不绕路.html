<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>逛不绕路 · 本地轻路线生成器</title>
  <style>
    :root {
      --bg-primary: #f9f8f5;
      --bg-card: #ffffff;
      --text-primary: #333333;
      --text-secondary: #6a6a6a;
      --accent: #4a7c59;
      --accent-light: #a7c9a0;
      --border: #e0d9d0;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      --radius: 16px;
      --transition: all 0.25s ease;
    }

    .dark-mode {
      --bg-primary: #1e1e1e;
      --bg-card: #2a2a2a;
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --accent: #6abf69;
      --accent-light: #4d9a52;
      --border: #3a3a3a;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 16px;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 560px;
      margin: 0 auto;
    }

    .input-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 32px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-primary);
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg-card);
      color: var(--text-primary);
      transition: var(--transition);
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.15);
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .tag-btn {
      padding: 8px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-secondary);
    }

    .tag-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-generate {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: var(--transition);
    }

    .btn-generate:hover:not(:disabled) {
      background: var(--accent-light);
      transform: translateY(-1px);
    }

    .btn-generate:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .result-section {
      display: none;
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 32px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .result-title {
      font-weight: 700;
      font-size: 1.3rem;
    }

    .copy-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.9rem;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 6px;
      transition: var(--transition);
    }

    .copy-btn:hover:not(:disabled) {
      background: rgba(74, 124, 89, 0.1);
    }

    .route-line {
      position: relative;
      padding-left: 32px;
      margin-bottom: 24px;
    }

    .route-line::before {
      content: '';
      position: absolute;
      left: 8px;
      top: 12px;
      bottom: 12px;
      width: 2px;
      background: var(--accent-light);
    }

    .route-step {
      display: flex;
      margin-bottom: 20px;
      position: relative;
    }

    .step-bullet {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
      margin-right: 12px;
      position: relative;
      z-index: 2;
    }

    .step-content {
      flex: 1;
      padding: 8px 0;
    }

    .step-title {
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .step-desc {
      font-size: 0.925rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .step-meta {
      display: flex;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .icon-open { color: #4caf50; }
    .icon-closed { color: #f44336; }
    .icon-elevator { color: #2196f3; }
    .icon-toilet { color: #9c27b0; }
    .icon-camera { color: #ff9800; }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: var(--transition);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--text-primary);
    }

    .footer-note {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .input-section,
      .result-section {
        padding: 16px;
      }
      .route-line::before {
        left: 6px;
      }
      .step-bullet {
        width: 20px;
        height: 20px;
        font-size: 0.8rem;
      }
      .theme-toggle {
        top: 12px;
        right: 12px;
        width: 36px;
        height: 36px;
      }
    }
  </style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H12a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a.75.75 0 00-1.04-.143l-.813-.957a.75.75 0 00-1.063.13l-.893.957a.75.75 0 00-.29.107l-1.595.797a.75.75 0 00-.117.156l-.105.18A.75.75 0 005.45 12.41l.893.957a.75.75 0 001.06-.13l.813-.957a.75.75 0 00.29-.107l1.595-.797a.75.75 0 00.117-.156l.105-.18a.75.75 0 00.13-.29l.117-.156zM12 20.25a.75.75 0 01.75.75v.008a.75.75 0 01-.75.75H12a.75.75 0 01-.75-.75V21a.75.75 0 01.75-.75z" />
    </svg>
  </div>

  <div class="container">
    <header>
      <h1>逛不绕路</h1>
      <p class="subtitle">输入起点与偏好，5秒生成真实可达、不绕路的一日轻路线</p>
    </header>

    <section class="input-section">
      <div class="input-group">
        <label for="startAddress">起点位置（例如：我家 / XX地铁站）</label>
        <input type="text" id="startAddress" placeholder="输入您的出发地，支持模糊匹配" value="杭州西溪湿地南门">
      </div>

      <div class="input-group">
        <label>您希望这一趟有什么？</label>
        <div class="tags-container">
          <button type="button" class="tag-btn" data-tag="sit">想坐坐</button>
          <button type="button" class="tag-btn" data-tag="photo">适合拍照</button>
          <button type="button" class="tag-btn" data-tag="toilet">有厕所</button>
          <button type="button" class="tag-btn" data-tag="subway">近地铁</button>
        </div>
      </div>

      <button class="btn-generate" id="generateBtn">生成顺路路线 →</button>
    </section>

    <section class="result-section" id="resultSection">
      <div class="result-header">
        <h2 class="result-title">为您规划的轻路线</h2>
        <button class="copy-btn" id="copyBtn">复制路线</button>
      </div>

      <div class="route-line">
        <div class="route-step">
          <div class="step-bullet">1</div>
          <div class="step-content">
            <h3 class="step-title">
              西溪湿地南门入口
              <span class="icon icon-open">●</span>
            </h3>
            <p class="step-desc">步行起点，开放中，无障碍坡道可用</p>
            <div class="step-meta">
              <div class="meta-item"><span class="icon icon-elevator">🛗</span> 有电梯</div>
              <div class="meta-item"><span class="icon icon-toilet">🚻</span> 附近有厕所</div>
            </div>
          </div>
        </div>

        <div class="route-step">
          <div class="step-bullet">2</div>
          <div class="step-content">
            <h3 class="step-title">
              洪园古街茶馆（临时艺术展）
              <span class="icon icon-open">●</span>
            </h3>
            <p class="step-desc">步行约480米（6分钟），展期至8月31日，免费参观</p>
            <div class="step-meta">
              <div class="meta-item"><span class="icon icon-photo">📷</span> 适合拍照</div>
              <div class="meta-item"><span class="icon icon-sit">🪑</span> 室内有座位</div>
            </div>
          </div>
        </div>

        <div class="route-step">
          <div class="step-bullet">3</div>
          <div class="step-content">
            <h3 class="step-title">
              高庄明清建筑群
              <span class="icon icon-open">●</span>
            </h3>
            <p class="step-desc">步行约320米（4分钟），开放中，古建导览免费</p>
            <div class="step-meta">
              <div class="meta-item"><span class="icon icon-photo">📷</span> 适合拍照</div>
              <div class="meta-item"><span class="icon icon-sit">🪑</span> 园内多处休憩长椅</div>
            </div>
          </div>
        </div>
      </div>

      <div class="footer-note">
        ✨ 路线总步行约1.2公里｜全程无障碍友好｜所有营业状态截至今日更新
      </div>
    </section>
  </div>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      body.classList.add('dark-mode');
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      const isDark = body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // 标签选择
    const tagButtons = document.querySelectorAll('.tag-btn');
    const selectedTags = new Set();

    tagButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const tag = btn.dataset.tag;
        if (selectedTags.has(tag)) {
          selectedTags.delete(tag);
          btn.classList.remove('active');
        } else {
          selectedTags.add(tag);
          btn.classList.add('active');
        }
      });
    });

    // 生成按钮
    const generateBtn = document.getElementById('generateBtn');
    const resultSection = document.getElementById('resultSection');

    generateBtn.addEventListener('click', () => {
      // 简单防抖
      generateBtn.disabled = true;
      generateBtn.textContent = '生成中…';

      setTimeout(() => {
        resultSection.style.display = 'block';
        generateBtn.disabled = false;
        generateBtn.textContent = '重新生成路线 →';
        window.scrollTo({ top: resultSection.offsetTop - 80, behavior: 'smooth' });
      }, 600);
    });

    // 复制按钮
    const copyBtn = document.getElementById('copyBtn');
    copyBtn.addEventListener('click', () => {
      const text = `逛不绕路 · 轻路线\n\n❶ 西溪湿地南门入口（开放｜无障碍坡道）\n❷ 洪园古街茶馆（临时艺术展｜步行6分钟｜免费）\n❸ 高庄明清建筑群（开放｜步行4分钟｜免费导览）\n\n✅ 总步行1.2km｜全程无障碍｜状态已核验`;
      
      navigator.clipboard.writeText(text).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = '已复制！';
        setTimeout(() => {
          copyBtn.textContent = originalText;
        }, 2000);
      });
    });
  </script>
</body>
</html>
