<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音调仪 - 自学唱歌助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }
  h1 {
    margin-top: 30px;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 4px;
    color: #a8c0ff;
  }
  .subtitle {
    margin-top: 8px;
    font-size: 14px;
    color: #6a7fa0;
    letter-spacing: 2px;
  }
  .controls {
    margin-top: 24px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .btn {
    padding: 10px 28px;
    border: 1px solid rgba(168, 192, 255, 0.3);
    border-radius: 30px;
    background: rgba(168, 192, 255, 0.08);
    color: #a8c0ff;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 1px;
  }
  .btn:hover { background: rgba(168, 192, 255, 0.18); }
  .btn.active {
    background: rgba(168, 192, 255, 0.25);
    border-color: #a8c0ff;
    color: #fff;
  }
  .btn-start {
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    color: #fff;
    font-weight: 600;
  }
  .btn-start:hover { opacity: 0.9; }
  .btn-start.recording {
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); }
    50% { box-shadow: 0 0 0 12px rgba(231, 76, 60, 0); }
  }
  .viz-container {
    margin-top: 30px;
    width: 90%;
    max-width: 800px;
    height: 320px;
    background: rgba(255,255,255,0.03);
    border-radius: 20px;
    border: 1px solid rgba(168, 192, 255, 0.1);
    position: relative;
    overflow: hidden;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .info-panel {
    margin-top: 24px;
    display: flex;
    gap: 40px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  .info-item { text-align: center; }
  .info-label { font-size: 12px; color: #6a7fa0; letter-spacing: 2px; margin-bottom: 6px; }
  .info-value { font-size: 36px; font-weight: 700; color: #a8c0ff; line-height: 1; }
  .info-value.small { font-size: 22px; }
  .info-unit { font-size: 14px; color: #6a7fa0; margin-left: 4px; font-weight: 400; }
  .score-panel { margin-top: 20px; text-align: center; }
  .score-ring { width: 100px; height: 100px; margin: 0 auto 10px; position: relative; }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring .score-text {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); font-size: 28px; font-weight: 700;
  }
  .score-label { font-size: 13px; color: #6a7fa0; letter-spacing: 1px; }
  .score-feedback { margin-top: 8px; font-size: 16px; font-weight: 600; letter-spacing: 1px; }
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: linear-gradient(135deg, #1a1a3e, #2a2a5e);
    border: 1px solid rgba(168, 192, 255, 0.2);
    border-radius: 20px; padding: 40px; text-align: center; max-width: 420px;
  }
  .modal h2 { font-size: 22px; font-weight: 400; margin-bottom: 12px; color: #a8c0ff; }
  .modal p { font-size: 14px; color: #6a7fa0; margin-bottom: 24px; line-height: 1.6; }
  .modal .btn { padding: 12px 40px; }
  .footer { margin-top: 40px; margin-bottom: 30px; font-size: 12px; color: #4a5a7a; letter-spacing: 1px; }
</style>
</head>
<body>
<h1>音调仪</h1>
<p class="subtitle">自学唱歌助手 · 实时音准检测</p>
<div class="controls">
  <button class="btn btn-start" id="btnStart" onclick="toggleRecording()">开始检测</button>
  <button class="btn active" id="btnSpectrum" onclick="switchViz('spectrum')">频谱柱</button>
  <button class="btn" id="btnGauge" onclick="switchViz('gauge')">仪表盘</button>
</div>
<div class="viz-container"><canvas id="vizCanvas"></canvas></div>
<div class="info-panel">
  <div class="info-item"><div class="info-label">当前音高</div><div class="info-value" id="noteDisplay">--</div></div>
  <div class="info-item"><div class="info-label">频率</div><div class="info-value small" id="freqDisplay">--<span class="info-unit">Hz</span></div></div>
  <div class="info-item"><div class="info-label">偏差</div><div class="info-value small" id="centsDisplay">--<span class="info-unit">cents</span></div></div>
</div>
<div class="score-panel">
  <div class="score-ring">
    <svg width="100" height="100" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(168,192,255,0.1)" stroke-width="6"/>
      <circle id="scoreArc" cx="50" cy="50" r="42" fill="none" stroke="#667eea" stroke-width="6" stroke-dasharray="0 264" stroke-linecap="round"/>
    </svg>
    <div class="score-text" id="scoreText">--</div>
  </div>
  <div class="score-label">音准评分</div>
  <div class="score-feedback" id="scoreFeedback" style="color:#6a7fa0;">等待开始...</div>
</div>
<p class="footer">请允许麦克风权限后开始检测 · 电脑端效果最佳</p>
<div class="modal-overlay hidden" id="micModal">
  <div class="modal">
    <h2>需要麦克风权限</h2>
    <p>音调仪需要访问您的麦克风来检测音高。请在浏览器弹出的授权窗口中点击"允许"。</p>
    <button class="btn btn-start" onclick="requestMicPermission()">授权麦克风</button>
  </div>
</div>
<script>
let audioCtx=null,analyser=null,mediaStream=null,isRecording=false,vizMode='spectrum',animFrameId=null,bufferLength=0,timeData=null,freqData=null;
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let currentNote='--',currentFreq=0,currentCents=0,currentScore=0,smoothFreq=0;
const canvas=document.getElementById('vizCanvas'),ctx=canvas.getContext('2d');
function resizeCanvas(){const r=canvas.parentElement.getBoundingClientRect();canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio)}
resizeCanvas();window.addEventListener('resize',resizeCanvas);
async function requestMicPermission(){try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});document.getElementById('micModal').classList.add('hidden');initAudioContext()}catch(e){alert('无法获取麦克风权限，请检查浏览器设置。')}}
function toggleRecording(){if(!mediaStream){document.getElementById('micModal').classList.remove('hidden');return}if(isRecording)stopRecording();else startRecording()}
function startRecording(){if(!audioCtx)initAudioContext();if(audioCtx.state==='suspended')audioCtx.resume();isRecording=true;const b=document.getElementById('btnStart');b.textContent='停止检测';b.classList.add('recording');draw()}
function stopRecording(){isRecording=false;const b=document.getElementById('btnStart');b.textContent='开始检测';b.classList.remove('recording');if(animFrameId)cancelAnimationFrame(animFrameId);currentNote='--';currentFreq=0;currentCents=0;currentScore=0;smoothFreq=0;updateInfoDisplay();clearCanvas()}
function initAudioContext(){audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=0.8;const s=audioCtx.createMediaStreamSource(mediaStream);s.connect(analyser);bufferLength=analyser.fftSize;timeData=new Float32Array(bufferLength);freqData=new Uint8Array(analyser.frequencyBinCount)}
function autoCorrelate(buf,sr){const S=buf.length;let rms=0;for(let i=0;i<S;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/S);if(rms<0.01)return-1;let r1=0,r2=S-1;const th=0.2;for(let i=0;i<S/2;i++)if(Math.abs(buf[i])<th){r1=i;break}for(let i=1;i<S/2;i++)if(Math.abs(buf[S-i])<th){r2=S-i;break}buf=buf.slice(r1,r2);const N=buf.length;const c=new Float32Array(N);for(let i=0;i<N;i++)for(let j=0;j<N-i;j++)c[i]+=buf[j]*buf[j+i];let d=0;while(c[d]>c[d+1])d++;let mx=-1,mp=-1;for(let i=d;i<N;i++)if(c[i]>mx){mx=c[i];mp=i}let T0=mp;if(T0===0||T0>=N-1)return-1;const x1=c[T0-1],x2=c[T0],x3=c[T0+1];const a=(x1+x3-2*x2)/2,b=(x3-x1)/2;if(a)T0=T0-b/(2*a);return sr/T0}
function freqToNote(f){if(f<=0)return{note:'--',octave:0,cents:0,noteNum:0};const nn=12*(Math.log2(f/440))+69;const rn=Math.round(nn);const cents=Math.round((nn-rn)*100);const oct=Math.floor(rn/12)-1;return{note:NOTE_NAMES[((rn%12)+12)%12]+oct,octave:cents,cents,noteNum:rn}}
function calcScore(c){const a=Math.abs(c);if(a<=5)return 100;if(a<=10)return 95;if(a<=20)return 85;if(a<=30)return 70;if(a<=50)return 50;return 20}
function getScoreColor(s){if(s>=90)return'#4ade80';if(s>=70)return'#a8c0ff';if(s>=50)return'#fbbf24';return'#ef4444'}
function getScoreFeedback(s){if(s>=95)return'完美音准！';if(s>=85)return'非常接近，继续保持';if(s>=70)return'还不错，再调整一下';if(s>=50)return'有点偏差，注意听辨';return'偏差较大，试着调整'}
function updateInfoDisplay(){document.getElementById('noteDisplay').textContent=currentNote;document.getElementById('freqDisplay').innerHTML=(currentFreq>0?currentFreq.toFixed(1):'--')+'<span class="info-unit">Hz</span>';const ce=document.getElementById('centsDisplay');if(currentFreq>0){const sg=currentCents>=0?'+':'';ce.innerHTML=sg+currentCents+'<span class="info-unit">cents</span>';ce.style.color=Math.abs(currentCents)<=10?'#4ade80':Math.abs(currentCents)<=30?'#fbbf24':'#ef4444'}else{ce.innerHTML='--<span class="info-unit">cents</span>';ce.style.color='#a8c0ff'}const se=document.getElementById('scoreText'),ae=document.getElementById('scoreArc'),fe=document.getElementById('scoreFeedback');if(currentFreq>0){se.textContent=currentScore;se.style.color=getScoreColor(currentScore);const ci=2*Math.PI*42;ae.setAttribute('stroke-dasharray',`${(currentScore/100)*ci} ${ci}`);ae.setAttribute('stroke',getScoreColor(currentScore));fe.textContent=getScoreFeedback(currentScore);fe.style.color=getScoreColor(currentScore)}else{se.textContent='--';se.style.color='#a8c0ff';ae.setAttribute('stroke-dasharray','0 264');fe.textContent='等待开始...';fe.style.color='#6a7fa0'}}
function switchViz(m){vizMode=m;document.getElementById('btnSpectrum').classList.toggle('active',m==='spectrum');document.getElementById('btnGauge').classList.toggle('active',m==='gauge')}
function draw(){if(!isRecording)return;animFrameId=requestAnimationFrame(draw);analyser.getFloatTimeDomainData(timeData);analyser.getByteFrequencyData(freqData);const f=autoCorrelate(timeData,audioCtx.sampleRate);if(f>50&&f<2000){smoothFreq=smoothFreq*0.7+f*0.3;currentFreq=smoothFreq;const ni=freqToNote(currentFreq);currentNote=ni.note;currentCents=ni.cents;currentScore=calcScore(ni.cents)}else{currentFreq=0;currentNote='--';currentCents=0;currentScore=0;smoothFreq*=0.9}updateInfoDisplay();const w=canvas.width/devicePixelRatio,h=canvas.height/devicePixelRatio;ctx.clearRect(0,0,w,h);if(vizMode==='spectrum')drawSpectrum(w,h);else drawGauge(w,h)}
function drawSpectrum(w,h){const bc=64,gap=3;const bw=(w-gap*(bc-1))/bc;for(let i=0;i<bc;i++){const fi=Math.floor(Math.pow(i/bc,1.5)*(freqData.length*0.5));const v=freqData[Math.min(fi,freqData.length-1)]/255;const bh=Math.max(2,v*h);const x=i*(bw+gap),y=h-bh;const hu=220+(i/bc)*60;ctx.fillStyle=`hsla(${hu},${60+v*40}%,${40+v*30}%,${0.7+v*0.3})`;const r=Math.min(bw/2,4);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+bw-r,y);ctx.quadraticCurveTo(x+bw,y,x+bw,y+r);ctx.lineTo(x+bw,y+bh);ctx.lineTo(x,y+bh);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.fill();if(v>0.05){ctx.fillStyle=`hsla(${hu},80%,70%,0.9)`;ctx.fillRect(x,y,bw,2)}}ctx.save();ctx.globalAlpha=0.12;ctx.scale(1,-0.25);ctx.translate(0,-h/0.25);for(let i=0;i<bc;i++){const fi=Math.floor(Math.pow(i/bc,1.5)*(freqData.length*0.5));const v=freqData[Math.min(fi,freqData.length-1)]/255;const bh=Math.max(2,v*h);const x=i*(bw+gap),y=h-bh;ctx.fillStyle='rgba(168,192,255,0.5)';ctx.fillRect(x,y,bw,bh)}ctx.restore()}
function drawGauge(w,h){const cx=w/2,cy=h*0.52,radius=Math.min(w*0.46,h*0.44);const sa=Math.PI*0.8,ta=Math.PI*1.4;ctx.beginPath();ctx.arc(cx,cy,radius+22,sa,Math.PI*2+Math.PI*0.2);ctx.strokeStyle='rgba(168,192,255,0.06)';ctx.lineWidth=1;ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,radius,sa,Math.PI*2+Math.PI*0.2);ctx.strokeStyle='rgba(168,192,255,0.1)';ctx.lineWidth=24;ctx.lineCap='round';ctx.stroke();const nr=[];for(let o=3;o<=5;o++)for(let n=0;n<12;n++)nr.push({name:NOTE_NAMES[n]+o,freq:440*Math.pow(2,(n-9+(o-4)*12)/12)});nr.forEach((n,i)=>{const a=sa+(i/(nr.length-1))*ta;const sh=n.name.includes('#');const ir=radius-(sh?20:28),or=radius+(sh?14:20);ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*ir,cy+Math.sin(a)*ir);ctx.lineTo(cx+Math.cos(a)*or,cy+Math.sin(a)*or);ctx.strokeStyle=sh?'rgba(168,192,255,0.15)':'rgba(168,192,255,0.4)';ctx.lineWidth=sh?1:2;ctx.lineCap='round';ctx.stroke();if(!sh){const lr=radius+38;ctx.fillStyle='rgba(168,192,255,0.5)';ctx.font=`${Math.max(11,radius*0.08)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.name,cx+Math.cos(a)*lr,cy+Math.sin(a)*lr)}});if(currentFreq>50){const mf=nr[0].freq,xf=nr[nr.length-1].freq;const lp=(Math.log2(currentFreq)-Math.log2(mf))/(Math.log2(xf)-Math.log2(mf));const cp=Math.max(0,Math.min(1,lp));const na=sa+cp*ta;ctx.save();ctx.shadowColor=getScoreColor(currentScore);ctx.shadowBlur=20;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(na)*(radius-12),cy+Math.sin(na)*(radius-12));ctx.strokeStyle=getScoreColor(currentScore);ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();ctx.restore();ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fillStyle=getScoreColor(currentScore);ctx.fill();ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fillStyle='#1a1a3e';ctx.fill()}const nfs=Math.max(28,radius*0.25),ffs=Math.max(14,radius*0.13),cfs=Math.max(12,radius*0.1);ctx.fillStyle='#a8c0ff';ctx.font=`bold ${nfs}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(currentNote,cx,cy-nfs*1.1);ctx.fillStyle='rgba(168,192,255,0.6)';ctx.font=`${ffs}px sans-serif`;ctx.fillText(currentFreq>0?currentFreq.toFixed(1)+' Hz':'-- Hz',cx,cy+ffs*1.5);if(currentFreq>50){const cc=Math.abs(currentCents)<=10?'#4ade80':Math.abs(currentCents)<=30?'#fbbf24':'#ef4444';ctx.fillStyle=cc;ctx.font=`${cfs}px sans-serif`;const sg=currentCents>=0?'+':'';ctx.fillText(sg+currentCents+' cents',cx,cy+ffs*1.5+cfs*1.8)}}
function clearCanvas(){const w=canvas.width/devicePixelRatio,h=canvas.height/devicePixelRatio;ctx.clearRect(0,0,w,h)}
</script>
</body>
</html>
