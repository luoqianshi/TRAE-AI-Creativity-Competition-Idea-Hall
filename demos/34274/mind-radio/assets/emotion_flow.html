<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情绪流场 - 算法艺术</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --bg2: #1a1d23;
    --ink: #e8e6e3;
    --muted: #8a8580;
    --rule: #2a2e36;
    --accent: #c9a96e;
    --accent2: #7a9eb8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .container {
    display: flex;
    min-height: 100vh;
  }
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--bg2);
    padding: 28px 20px;
    border-right: 1px solid var(--rule);
    overflow-y: auto;
  }
  .sidebar h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .sidebar .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 28px;
  }
  .control-section { margin-bottom: 28px; }
  .control-section h3 {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }
  .control-group { margin-bottom: 16px; }
  .control-group label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .slider-container {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .slider-container input[type="range"] {
    flex: 1;
    height: 3px;
    background: var(--rule);
    border-radius: 2px;
    outline: none;
    -webkit-appearance: none;
  }
  .slider-container input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
  }
  .value-display {
    font-family: monospace;
    font-size: 12px;
    color: var(--accent);
    min-width: 40px;
    text-align: right;
  }
  .seed-input {
    width: 100%;
    background: var(--bg);
    padding: 10px;
    border-radius: 6px;
    font-family: monospace;
    font-size: 13px;
    color: var(--ink);
    border: 1px solid var(--rule);
    text-align: center;
    margin-bottom: 10px;
  }
  .seed-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .seed-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    width: 100%;
  }
  .button:hover { opacity: 0.85; }
  .button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .button.tertiary {
    background: var(--accent2);
    color: var(--bg);
  }
  .button-row { display: flex; gap: 8px; }
  .button-row .button { flex: 1; }

  .canvas-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: var(--bg);
  }
  #canvas-container {
    width: 100%;
    max-width: 900px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    border: 1px solid var(--rule);
  }
  #canvas-container canvas {
    display: block;
    width: 100% !important;
    height: auto !important;
  }

  .emotion-presets {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }
  .emotion-btn {
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--rule);
    background: var(--bg);
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .emotion-btn:hover { border-color: var(--accent); color: var(--ink); }
  .emotion-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(201,169,110,0.1); }

  @media (max-width: 768px) {
    .container { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--rule); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="sidebar">
    <h1>情绪流场</h1>
    <div class="subtitle">Emotional Flow Field</div>

    <div class="control-section">
      <h3>种子</h3>
      <input type="number" id="seed-input" class="seed-input" value="42" onchange="updateSeed()">
      <div class="seed-controls">
        <button class="button secondary" onclick="previousSeed()">← 上一个</button>
        <button class="button secondary" onclick="nextSeed()">下一个 →</button>
      </div>
      <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ 随机</button>
    </div>

    <div class="control-section">
      <h3>情绪预设</h3>
      <div class="emotion-presets">
        <button class="emotion-btn active" onclick="setEmotion('sunny')">晴朗</button>
        <button class="emotion-btn" onclick="setEmotion('calm')">平静</button>
        <button class="emotion-btn" onclick="setEmotion('low')">低落</button>
        <button class="emotion-btn" onclick="setEmotion('anxious')">焦虑</button>
      </div>
    </div>

    <div class="control-section">
      <h3>参数</h3>
      <div class="control-group">
        <label>粒子数量</label>
        <div class="slider-container">
          <input type="range" id="particleCount" min="500" max="5000" step="100" value="2000" oninput="updateParam('particleCount', this.value)">
          <span class="value-display" id="particleCount-value">2000</span>
        </div>
      </div>
      <div class="control-group">
        <label>流动速度</label>
        <div class="slider-container">
          <input type="range" id="flowSpeed" min="0.2" max="3.0" step="0.1" value="1.0" oninput="updateParam('flowSpeed', this.value)">
          <span class="value-display" id="flowSpeed-value">1.0</span>
        </div>
      </div>
      <div class="control-group">
        <label>噪声尺度</label>
        <div class="slider-container">
          <input type="range" id="noiseScale" min="0.001" max="0.015" step="0.001" value="0.004" oninput="updateParam('noiseScale', this.value)">
          <span class="value-display" id="noiseScale-value">0.004</span>
        </div>
      </div>
      <div class="control-group">
        <label>轨迹长度</label>
        <div class="slider-container">
          <input type="range" id="trailLength" min="3" max="20" step="1" value="8" oninput="updateParam('trailLength', this.value)">
          <span class="value-display" id="trailLength-value">8</span>
        </div>
      </div>
    </div>

    <div class="control-section">
      <h3>操作</h3>
      <div class="button-row">
        <button class="button" onclick="resetParameters()">重置</button>
        <button class="button secondary" onclick="downloadArt()">下载</button>
      </div>
    </div>
  </div>

  <div class="canvas-area">
    <div id="canvas-container"></div>
  </div>
</div>

<script>
let params = {
  seed: 42,
  particleCount: 2000,
  flowSpeed: 1.0,
  noiseScale: 0.004,
  trailLength: 8,
  emotion: 'sunny'
};

let defaultParams = JSON.parse(JSON.stringify(params));
let particles = [];
let cols, rows;
let scl = 8;
let zoff = 0;

// Each emotion has unique physics, not just colors
const emotionConfigs = {
  sunny: {
    bg: [15,17,21],
    colors: [[201,169,110],[230,200,140],[255,220,160]],
    noiseScale: 0.003,
    noiseMultiplier: 0.6,
    speed: 0.8,
    maxSpeed: 1.6,
    forceMag: 0.06,
    zSpeed: 0.0002,
    fadeAlpha: 6,
    gravity: -0.015,        // upward drift — particles float like golden dust
    turbulence: 0.3,
    angleRange: 0.5,        // narrow angle range — gentle, mostly upward
    lifeRange: [200, 600],
    alphaRange: [25, 65],
    strokeRange: [0.4, 1.2],
    edgeWrap: true
  },
  calm: {
    bg: [15,17,21],
    colors: [[122,158,184],[160,190,210],[190,210,225]],
    noiseScale: 0.0015,
    noiseMultiplier: 0.3,
    speed: 0.4,
    maxSpeed: 0.8,
    forceMag: 0.03,
    zSpeed: 0.0001,
    fadeAlpha: 4,
    gravity: 0,
    turbulence: 0.1,
    angleRange: 0.2,        // very narrow — almost linear horizontal drift
    lifeRange: [300, 800],
    alphaRange: [20, 50],
    strokeRange: [0.3, 0.9],
    edgeWrap: true
  },
  low: {
    bg: [15,17,21],
    colors: [[139,126,160],[170,155,185],[200,185,210]],
    noiseScale: 0.005,
    noiseMultiplier: 1.2,
    speed: 0.6,
    maxSpeed: 1.2,
    forceMag: 0.08,
    zSpeed: 0.0003,
    fadeAlpha: 5,
    gravity: 0.02,         // downward drift — particles settle like rain
    turbulence: 0.6,
    angleRange: 1.0,
    lifeRange: [150, 450],
    alphaRange: [20, 55],
    strokeRange: [0.3, 1.0],
    edgeWrap: false         // respawn from top when falling off bottom
  },
  anxious: {
    bg: [15,17,21],
    colors: [[160,90,90],[190,110,100],[220,130,120]],
    noiseScale: 0.012,
    noiseMultiplier: 2.5,
    speed: 2.0,
    maxSpeed: 4.0,
    forceMag: 0.2,
    zSpeed: 0.001,
    fadeAlpha: 10,
    gravity: 0,
    turbulence: 1.5,       // high turbulence — chaotic, stormy
    angleRange: 2.0,        // full range — unpredictable direction changes
    lifeRange: [60, 200],
    alphaRange: [30, 90],
    strokeRange: [0.5, 2.0],
    edgeWrap: true
  }
};

function getEmotionConfig() {
  return emotionConfigs[params.emotion];
}

function setup() {
  let canvas = createCanvas(900, 900);
  canvas.parent('canvas-container');
  initializeSystem();
}

function initializeSystem() {
  randomSeed(params.seed);
  noiseSeed(params.seed);
  particles = [];
  cols = floor(width / scl);
  rows = floor(height / scl);

  let cfg = getEmotionConfig();
  for (let i = 0; i < params.particleCount; i++) {
    particles.push(new Particle(cfg));
  }

  background(cfg.bg[0], cfg.bg[1], cfg.bg[2]);
  zoff = 0;
}

function draw() {
  let cfg = getEmotionConfig();

  // Fade trails — faster fade for anxious, slower for calm
  noStroke();
  fill(cfg.bg[0], cfg.bg[1], cfg.bg[2], cfg.fadeAlpha);
  rect(0, 0, width, height);

  for (let p of particles) {
    p.follow(cfg);
    p.update(cfg);
    p.edges(cfg);
    p.show();
  }

  zoff += cfg.zSpeed * params.flowSpeed;
}

class Particle {
  constructor(cfg) {
    this.pos = createVector(random(width), random(height));
    this.vel = createVector(0, 0);
    this.acc = createVector(0, 0);
    this.maxSpeed = cfg.maxSpeed;
    this.prevPos = this.pos.copy();
    this.colorIdx = floor(random(cfg.colors.length));
    this.colors = cfg.colors;
    this.alpha = random(cfg.alphaRange[0], cfg.alphaRange[1]);
    this.strokeWeight = random(cfg.strokeRange[0], cfg.strokeRange[1]);
    this.life = random(cfg.lifeRange[0], cfg.lifeRange[1]);
    this.maxLife = this.life;
  }

  follow(cfg) {
    let x = floor(this.pos.x / scl);
    let y = floor(this.pos.y / scl);

    // Base noise angle
    let ns = cfg.noiseScale * params.noiseScale / 0.004;
    let angle = noise(x * ns * 10, y * ns * 10, zoff) * TWO_PI * cfg.noiseMultiplier;

    // Add turbulence variation per particle
    let turb = noise(this.pos.x * 0.005, this.pos.y * 0.005, zoff * 3) * cfg.turbulence;
    angle += turb;

    let force = p5.Vector.fromAngle(angle);
    force.setMag(cfg.forceMag * params.flowSpeed);
    this.applyForce(force);

    // Emotion-specific gravity / drift
    if (cfg.gravity !== 0) {
      this.applyForce(createVector(0, cfg.gravity * params.flowSpeed));
    }
  }

  applyForce(force) {
    this.acc.add(force);
  }

  update(cfg) {
    this.vel.add(this.acc);
    this.vel.limit(cfg.maxSpeed * params.flowSpeed);
    this.pos.add(this.vel);
    this.acc.mult(0);
    this.life--;

    // Fade out near end of life
    if (this.life <= 0) {
      this.reset(cfg);
    }
  }

  reset(cfg) {
    if (cfg.edgeWrap === false) {
      // For "low" — respawn from top like rain
      this.pos = createVector(random(width), random(-20, 0));
    } else {
      this.pos = createVector(random(width), random(height));
    }
    this.prevPos = this.pos.copy();
    this.vel.mult(0);
    this.life = random(cfg.lifeRange[0], cfg.lifeRange[1]);
    this.maxLife = this.life;
    this.colorIdx = floor(random(this.colors.length));
    this.alpha = random(cfg.alphaRange[0], cfg.alphaRange[1]);
    this.strokeWeight = random(cfg.strokeRange[0], cfg.strokeRange[1]);
  }

  edges(cfg) {
    if (cfg.edgeWrap === false) {
      // For "low" — wrap horizontally, respawn at top when falling off bottom
      if (this.pos.x > width) { this.pos.x = 0; this.prevPos.x = 0; }
      if (this.pos.x < 0) { this.pos.x = width; this.prevPos.x = width; }
      if (this.pos.y > height) { this.reset(cfg); }
      if (this.pos.y < -50) { this.pos.y = -50; this.prevPos.y = -50; }
    } else {
      if (this.pos.x > width) { this.pos.x = 0; this.prevPos.x = 0; }
      if (this.pos.x < 0) { this.pos.x = width; this.prevPos.x = width; }
      if (this.pos.y > height) { this.pos.y = 0; this.prevPos.y = 0; }
      if (this.pos.y < 0) { this.pos.y = height; this.prevPos.y = height; }
    }
  }

  show() {
    let c = this.colors[this.colorIdx];
    // Fade alpha near end of life for smooth disappearance
    let lifeFade = this.life < 30 ? map(this.life, 0, 30, 0, 1) : 1;
    stroke(c[0], c[1], c[2], this.alpha * lifeFade);
    strokeWeight(this.strokeWeight);
    line(this.pos.x, this.pos.y, this.prevPos.x, this.prevPos.y);
    this.prevPos = this.pos.copy();
  }
}

function updateParam(paramName, value) {
  if (paramName === 'particleCount') {
    params.particleCount = parseInt(value);
    document.getElementById(paramName + '-value').textContent = value;
    initializeSystem();
  } else if (paramName === 'flowSpeed') {
    params.flowSpeed = parseFloat(value);
    document.getElementById(paramName + '-value').textContent = value;
  } else if (paramName === 'noiseScale') {
    params.noiseScale = parseFloat(value);
    document.getElementById(paramName + '-value').textContent = value;
  } else if (paramName === 'trailLength') {
    params.trailLength = parseInt(value);
    document.getElementById(paramName + '-value').textContent = value;
  }
}

function setEmotion(emotion) {
  params.emotion = emotion;
  document.querySelectorAll('.emotion-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  initializeSystem();
}

function updateSeed() {
  let input = document.getElementById('seed-input');
  let newSeed = parseInt(input.value);
  if (newSeed && newSeed > 0) {
    params.seed = newSeed;
    initializeSystem();
  }
}

function previousSeed() {
  params.seed = Math.max(1, params.seed - 1);
  document.getElementById('seed-input').value = params.seed;
  initializeSystem();
}

function nextSeed() {
  params.seed = params.seed + 1;
  document.getElementById('seed-input').value = params.seed;
  initializeSystem();
}

function randomSeedAndUpdate() {
  params.seed = Math.floor(Math.random() * 999999) + 1;
  document.getElementById('seed-input').value = params.seed;
  initializeSystem();
}

function resetParameters() {
  params = JSON.parse(JSON.stringify(defaultParams));
  document.getElementById('particleCount').value = params.particleCount;
  document.getElementById('particleCount-value').textContent = params.particleCount;
  document.getElementById('flowSpeed').value = params.flowSpeed;
  document.getElementById('flowSpeed-value').textContent = params.flowSpeed;
  document.getElementById('noiseScale').value = params.noiseScale;
  document.getElementById('noiseScale-value').textContent = params.noiseScale;
  document.getElementById('trailLength').value = params.trailLength;
  document.getElementById('trailLength-value').textContent = params.trailLength;
  document.getElementById('seed-input').value = params.seed;
  document.querySelectorAll('.emotion-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelector('.emotion-btn').classList.add('active');
  initializeSystem();
}

function downloadArt() {
  saveCanvas('emotion_flow_' + params.seed, 'png');
}

window.addEventListener('load', function() {
  document.getElementById('seed-input').value = params.seed;
});
</script>
</body>
</html>
