<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel数据分析与可视化工具</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .upload-section {
            text-align: center;
            margin-bottom: 30px;
            padding: 40px;
            border: 3px dashed #4facfe;
            border-radius: 15px;
            background: #f8f9ff;
            transition: all 0.3s ease;
        }
        
        .upload-section:hover {
            border-color: #00f2fe;
            background: #f0f8ff;
        }
        
        .upload-section h2 {
            color: #4facfe;
            margin-bottom: 20px;
        }
        
        .upload-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .upload-btn:hover {
            transform: scale(1.05);
        }
        
        .file-input {
            display: none;
        }
        
        .sheet-selector {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .sheet-selector label {
            font-weight: bold;
            color: #4facfe;
        }
        
        .sheet-selector select {
            padding: 10px 15px;
            border: 2px solid #4facfe;
            border-radius: 8px;
            font-size: 1em;
            min-width: 200px;
        }
        
        .search-box {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #4facfe;
            border-radius: 8px;
            font-size: 1em;
        }
        
        .search-btn {
            background: #4facfe;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
        }
        
        .data-table-container {
            margin: 30px 0;
            overflow-x: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        
        .data-table th {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 15px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .data-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .data-table tr:hover {
            background: #f8f9ff;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }
        
        .pagination button {
            padding: 10px 15px;
            border: 2px solid #4facfe;
            background: white;
            color: #4facfe;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
        }
        
        .pagination button:hover {
            background: #4facfe;
            color: white;
        }
        
        .pagination button.active {
            background: #4facfe;
            color: white;
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .analysis-section {
            margin: 30px 0;
            padding: 25px;
            background: #f8f9ff;
            border-radius: 15px;
        }
        
        .analysis-section h2 {
            color: #4facfe;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #4facfe;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-card h3 {
            color: #4facfe;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }
        
        .field-analysis {
            margin: 20px 0;
        }
        
        .field-card {
            background: white;
            margin: 15px 0;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .field-card h4 {
            color: #4facfe;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        
        .field-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .field-stat {
            padding: 10px;
            background: #f8f9ff;
            border-radius: 8px;
        }
        
        .field-stat .label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .field-stat .value {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }
        
        .chart-section {
            margin: 30px 0;
            padding: 25px;
            background: #f8f9ff;
            border-radius: 15px;
        }
        
        .chart-section h2 {
            color: #4facfe;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #4facfe;
        }
        
        .chart-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .chart-control {
            flex: 1;
            min-width: 200px;
        }
        
        .chart-control label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #4facfe;
        }
        
        .chart-control select {
            width: 100%;
            padding: 12px;
            border: 2px solid #4facfe;
            border-radius: 8px;
            font-size: 1em;
        }
        
        .generate-chart-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.3s ease;
            align-self: flex-end;
        }
        
        .generate-chart-btn:hover {
            transform: scale(1.05);
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 30px;
        }
        
        .chart-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .chart-title {
            padding: 15px 20px;
            background: #f8f9ff;
            font-weight: bold;
            color: #4facfe;
        }
        
        .chart {
            height: 400px;
            padding: 20px;
        }
        
        .no-data {
            text-align: center;
            padding: 100px 20px;
            color: #666;
            font-size: 1.2em;
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #4facfe;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Excel数据分析与可视化工具</h1>
            <p>上传Excel文件，自动分析数据并生成可视化图表</p>
        </div>
        
        <div class="content">
            <div class="upload-section">
                <h2>上传Excel文件</h2>
                <p style="margin-bottom: 20px; color: #666;">支持 .xlsx 和 .xls 格式</p>
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                    选择文件
                </button>
                <input type="file" id="fileInput" class="file-input" accept=".xlsx,.xls">
                <p id="fileName" style="margin-top: 15px; color: #4facfe; font-weight: bold;"></p>
            </div>
            
            <div id="mainContent" class="hidden">
                <div class="sheet-selector">
                    <label for="sheetSelect">选择工作表：</label>
                    <select id="sheetSelect"></select>
                </div>
                
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="输入搜索关键词...">
                    <button class="search-btn" onclick="searchData()">搜索</button>
                </div>
                
                <div class="data-table-container">
                    <table class="data-table" id="dataTable">
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                
                <div class="pagination" id="pagination"></div>
                
                <div class="analysis-section" id="analysisSection">
                    <h2>数据分析报告</h2>
                    <div class="stats-grid" id="statsGrid"></div>
                    <div class="field-analysis" id="fieldAnalysis"></div>
                </div>
                
                <div class="chart-section" id="chartSection">
                    <h2>数据可视化</h2>
                    
                    <div class="chart-controls">
                        <div class="chart-control">
                            <label for="chartType">图表类型</label>
                            <select id="chartType">
                                <option value="bar">柱状图</option>
                                <option value="line">折线图</option>
                                <option value="pie">饼图</option>
                                <option value="scatter">散点图</option>
                            </select>
                        </div>
                        <div class="chart-control">
                            <label for="xField">X轴字段</label>
                            <select id="xField"></select>
                        </div>
                        <div class="chart-control">
                            <label for="yField">Y轴字段</label>
                            <select id="yField"></select>
                        </div>
                        <button class="generate-chart-btn" onclick="generateCustomChart()">生成图表</button>
                    </div>
                    
                    <div class="charts-grid" id="chartsGrid"></div>
                </div>
            </div>
            
            <div id="noDataMessage" class="no-data">
                请上传Excel文件开始分析
            </div>
        </div>
    </div>

    <script>
        let workbook = null;
        let currentSheetData = [];
        let allSheetData = {};
        let columns = [];
        let currentPage = 1;
        let pageSize = 50;
        let filteredData = [];
        let charts = {};
        
        document.getElementById('fileInput').addEventListener('change', handleFileUpload);
        
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            document.getElementById('fileName').textContent = '已选择：' + file.name;
            document.getElementById('noDataMessage').textContent = '正在加载文件...';
            document.getElementById('noDataMessage').className = 'no-data loading';
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    workbook = XLSX.read(data, { type: 'array', cellDates: true });
                    
                    populateSheetSelector();
                    loadSheet(workbook.SheetNames[0]);
                    
                    document.getElementById('mainContent').classList.remove('hidden');
                    document.getElementById('noDataMessage').classList.add('hidden');
                } catch (error) {
                    alert('文件解析失败：' + error.message);
                    document.getElementById('noDataMessage').textContent = '文件解析失败，请重试';
                    document.getElementById('noDataMessage').className = 'no-data';
                }
            };
            reader.readAsArrayBuffer(file);
        }
        
        function populateSheetSelector() {
            const select = document.getElementById('sheetSelect');
            select.innerHTML = '';
            workbook.SheetNames.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });
            select.addEventListener('change', function() {
                loadSheet(this.value);
            });
        }
        
        function loadSheet(sheetName) {
            const sheet = workbook.Sheets[sheetName];
            const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            
            if (jsonData.length === 0) {
                alert('工作表为空');
                return;
            }
            
            columns = jsonData[0].map((col, idx) => col || `字段${idx + 1}`);
            currentSheetData = jsonData.slice(1).map(row => {
                const obj = {};
                columns.forEach((col, idx) => {
                    obj[col] = row[idx] !== undefined ? row[idx] : '';
                });
                return obj;
            });
            
            allSheetData[sheetName] = {
                columns: columns,
                data: currentSheetData
            };
            
            filteredData = [...currentSheetData];
            currentPage = 1;
            
            renderTable();
            renderPagination();
            analyzeData();
            updateChartFields();
            generateAutoCharts();
        }
        
        function renderTable() {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            
            thead.innerHTML = '<tr>' + columns.map(col => `<th>${col}</th>`).join('') + '</tr>';
            
            const startIdx = (currentPage - 1) * pageSize;
            const endIdx = Math.min(startIdx + pageSize, filteredData.length);
            const pageData = filteredData.slice(startIdx, endIdx);
            
            tbody.innerHTML = pageData.map(row => {
                return '<tr>' + columns.map(col => `<td>${row[col] !== undefined ? row[col] : ''}</td>`).join('') + '</tr>';
            }).join('');
        }
        
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredData.length / pageSize);
            
            if (totalPages <= 1) {
                pagination.innerHTML = `<span>共 ${filteredData.length} 条记录</span>`;
                return;
            }
            
            let html = '';
            html += `<button onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>首页</button>`;
            html += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>`;
            
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);
            
            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="goToPage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
            }
            
            html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>`;
            html += `<button onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>末页</button>`;
            html += `<span style="margin-left: 15px;">共 ${totalPages} 页，${filteredData.length} 条记录</span>`;
            
            pagination.innerHTML = html;
        }
        
        function goToPage(page) {
            const totalPages = Math.ceil(filteredData.length / pageSize);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
            renderPagination();
        }
        
        function searchData() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            
            if (!keyword) {
                filteredData = [...currentSheetData];
            } else {
                filteredData = currentSheetData.filter(row => {
                    return columns.some(col => {
                        const value = String(row[col]).toLowerCase();
                        return value.includes(keyword);
                    });
                });
            }
            
            currentPage = 1;
            renderTable();
            renderPagination();
        }
        
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchData();
        });
        
        function analyzeData() {
            const statsGrid = document.getElementById('statsGrid');
            const fieldAnalysis = document.getElementById('fieldAnalysis');
            
            const totalRows = currentSheetData.length;
            const totalCols = columns.length;
            
            let totalMissing = 0;
            let fieldStats = [];
            
            columns.forEach(col => {
                const values = currentSheetData.map(row => row[col]);
                const nonEmptyValues = values.filter(v => v !== '' && v !== null && v !== undefined);
                const missingCount = totalRows - nonEmptyValues.length;
                totalMissing += missingCount;
                
                const uniqueValues = [...new Set(nonEmptyValues.map(String))];
                const uniqueCount = uniqueValues.length;
                
                let type = '文本';
                let numericStats = null;
                
                const numericValues = nonEmptyValues.filter(v => !isNaN(Number(v))).map(Number);
                if (numericValues.length > nonEmptyValues.length * 0.5 && numericValues.length > 0) {
                    type = '数值';
                    const sum = numericValues.reduce((a, b) => a + b, 0);
                    const avg = sum / numericValues.length;
                    const min = Math.min(...numericValues);
                    const max = Math.max(...numericValues);
                    numericStats = { sum, avg, min, max };
                }
                
                fieldStats.push({
                    name: col,
                    type,
                    missing: missingCount,
                    unique: uniqueCount,
                    numericStats
                });
            });
            
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <h3>总行数</h3>
                    <div class="value">${totalRows}</div>
                </div>
                <div class="stat-card">
                    <h3>总列数</h3>
                    <div class="value">${totalCols}</div>
                </div>
                <div class="stat-card">
                    <h3>缺失值总数</h3>
                    <div class="value">${totalMissing}</div>
                </div>
                <div class="stat-card">
                    <h3>数据完整率</h3>
                    <div class="value">${((1 - totalMissing / (totalRows * totalCols)) * 100).toFixed(1)}%</div>
                </div>
            `;
            
            fieldAnalysis.innerHTML = fieldStats.map(field => {
                let statsHtml = `
                    <div class="field-stat">
                        <div class="label">字段类型</div>
                        <div class="value">${field.type}</div>
                    </div>
                    <div class="field-stat">
                        <div class="label">缺失值</div>
                        <div class="value">${field.missing}</div>
                    </div>
                    <div class="field-stat">
                        <div class="label">唯一值</div>
                        <div class="value">${field.unique}</div>
                    </div>
                `;
                
                if (field.numericStats) {
                    statsHtml += `
                        <div class="field-stat">
                            <div class="label">求和</div>
                            <div class="value">${field.numericStats.sum.toFixed(2)}</div>
                        </div>
                        <div class="field-stat">
                            <div class="label">平均值</div>
                            <div class="value">${field.numericStats.avg.toFixed(2)}</div>
                        </div>
                        <div class="field-stat">
                            <div class="label">最小值</div>
                            <div class="value">${field.numericStats.min.toFixed(2)}</div>
                        </div>
                        <div class="field-stat">
                            <div class="label">最大值</div>
                            <div class="value">${field.numericStats.max.toFixed(2)}</div>
                        </div>
                    `;
                }
                
                return `
                    <div class="field-card">
                        <h4>${field.name}</h4>
                        <div class="field-stats">${statsHtml}</div>
                    </div>
                `;
            }).join('');
        }
        
        function updateChartFields() {
            const xSelect = document.getElementById('xField');
            const ySelect = document.getElementById('yField');
            
            xSelect.innerHTML = columns.map(col => `<option value="${col}">${col}</option>`).join('');
            ySelect.innerHTML = columns.map(col => `<option value="${col}">${col}</option>`).join('');
        }
        
        function generateAutoCharts() {
            const chartsGrid = document.getElementById('chartsGrid');
            chartsGrid.innerHTML = '';
            
            const numericFields = columns.filter(col => {
                const values = currentSheetData.map(row => row[col]);
                const nonEmpty = values.filter(v => v !== '' && v !== null);
                return nonEmpty.some(v => !isNaN(Number(v)));
            });
            
            const textFields = columns.filter(col => {
                const values = currentSheetData.map(row => row[col]);
                const nonEmpty = values.filter(v => v !== '' && v !== null);
                return nonEmpty.length > 0 && !nonEmpty.some(v => !isNaN(Number(v)));
            });
            
            if (numericFields.length > 0) {
                createChart('bar', numericFields[0], null, '柱状图 - ' + numericFields[0]);
                if (numericFields.length > 1) {
                    createChart('line', numericFields[0], numericFields[1], '折线图 - ' + numericFields[0] + ' vs ' + numericFields[1]);
                }
            }
            
            if (textFields.length > 0 && numericFields.length > 0) {
                createChart('pie', textFields[0], numericFields[0], '饼图 - ' + textFields[0]);
            }
            
            if (numericFields.length >= 2) {
                createChart('scatter', numericFields[0], numericFields[1], '散点图 - ' + numericFields[0] + ' vs ' + numericFields[1]);
            }
        }
        
        function generateCustomChart() {
            const type = document.getElementById('chartType').value;
            const xField = document.getElementById('xField').value;
            const yField = document.getElementById('yField').value;
            
            createChart(type, xField, yField, `${type === 'bar' ? '柱状图' : type === 'line' ? '折线图' : type === 'pie' ? '饼图' : '散点图'} - ${xField}${yField ? ' vs ' + yField : ''}`);
        }
        
        function createChart(type, xField, yField, title) {
            const chartsGrid = document.getElementById('chartsGrid');
            const chartId = 'chart_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            
            const container = document.createElement('div');
            container.className = 'chart-container';
            container.innerHTML = `
                <div class="chart-title">${title}</div>
                <div class="chart" id="${chartId}"></div>
            `;
            chartsGrid.appendChild(container);
            
            const chartDom = document.getElementById(chartId);
            const chart = echarts.init(chartDom);
            charts[chartId] = chart;
            
            const xData = currentSheetData.map(row => row[xField]);
            let option;
            
            if (type === 'pie') {
                const aggregated = {};
                xData.forEach((x, idx) => {
                    const y = yField ? Number(currentSheetData[idx][yField]) || 0 : 1;
                    aggregated[x] = (aggregated[x] || 0) + y;
                });
                
                const pieData = Object.entries(aggregated)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 20)
                    .map(([name, value]) => ({ name, value }));
                
                option = {
                    tooltip: { trigger: 'item', formatter: '{a} <br/>{b}: {c} ({d}%)' },
                    legend: { type: 'scroll', orient: 'vertical', right: 10, top: 20, bottom: 20 },
                    series: [{
                        name: title,
                        type: 'pie',
                        radius: ['40%', '70%'],
                        center: ['40%', '50%'],
                        data: pieData,
                        emphasis: {
                            itemStyle: { shadowBlur: 10, shadowOffsetX: 0, shadowColor: 'rgba(0, 0, 0, 0.5)' }
                        }
                    }]
                };
            } else {
                let yData;
                if (yField) {
                    yData = currentSheetData.map(row => Number(row[yField]) || 0);
                } else {
                    const aggregated = {};
                    xData.forEach(x => {
                        aggregated[x] = (aggregated[x] || 0) + 1;
                    });
                    const labels = Object.keys(aggregated);
                    yData = labels.map(l => aggregated[l]);
                    option = {
                        tooltip: { trigger: 'axis' },
                        xAxis: { type: 'category', data: labels, axisLabel: { rotate: 45 } },
                        yAxis: { type: 'value' },
                        series: [{ data: yData, type, smooth: type === 'line', itemStyle: { color: '#4facfe' } }]
                    };
                }
                
                if (!option) {
                    if (type === 'scatter') {
                        const scatterData = xData.map((x, idx) => [Number(x) || 0, Number(yData[idx]) || 0]);
                        option = {
                            tooltip: { trigger: 'item', formatter: params => `${xField}: ${params.data[0]}<br/>${yField}: ${params.data[1]}` },
                            xAxis: { type: 'value', name: xField },
                            yAxis: { type: 'value', name: yField },
                            series: [{ data: scatterData, type: 'scatter', itemStyle: { color: '#4facfe' } }]
                        };
                    } else {
                        option = {
                            tooltip: { trigger: 'axis' },
                            xAxis: { type: 'category', data: xData, axisLabel: { rotate: 45 } },
                            yAxis: { type: 'value' },
                            series: [{ data: yData, type, smooth: type === 'line', itemStyle: { color: '#4facfe' } }]
                        };
                    }
                }
            }
            
            chart.setOption(option);
            window.addEventListener('resize', () => chart.resize());
        }
        
        window.addEventListener('resize', () => {
            Object.values(charts).forEach(chart => chart.resize());
        });
    </script>
</body>
</html>
