function spawnBullet(x, y, z, vx, vy, vz, damage, rangeDamage, explosive, fire) {
  for (let i = 0; i < bulletPool.length; i++) {
    if (!bulletPool[i].userData.alive) {
      const b = bulletPool[i];
      b.position.set(x, y, z);
      b.userData.alive = true;
      b.userData.vx = vx;
      b.userData.vy = vy;
      b.userData.vz = vz;
      b.userData.traveled = 0;
      b.userData.damage = damage;
      b.userData.rangeDamage = rangeDamage;
      b.userData.explosive = explosive;
      b.userData.fire = fire || false;
      b.visible = true;
      if (explosive) b.scale.set(2, 2, 2);
      else b.scale.set(1, 1, 1);
      b.material.color.set(explosive ? 0xff0000 : fire ? 0xff4400 : 0xffcc00);
      return;
    }
  }
}

function bulletHitExplosion(x, y, z, rangeDamage, fire) {
  for (let j = 0; j < policeUnits.length; j++) {
    const p = policeUnits[j];
    if (!p.alive) continue;
    const dx = p.mesh.position.x - x;
    const dz = p.mesh.position.z - z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    if (dist < 8) {
      p.health -= rangeDamage * (1 - dist / 8);
      if (p.health <= 0 && p.alive) killPolice(p);
    }
  }
  for (let j = 0; j < gangUnits.length; j++) {
    const g = gangUnits[j];
    if (!g.alive) continue;
    const dx = g.mesh.position.x - x;
    const dz = g.mesh.position.z - z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    if (dist < 8) {
      g.health -= rangeDamage * (1 - dist / 8);
      if (g.health <= 0 && g.alive) killGang(g);
    }
  }
  const boomColor = fire ? 0xff4400 : 0xff6600;
  for (let k = 0; k < (fire ? 30 : 18); k++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * (fire ? 10 : 8);
    const angV = (Math.random() - 0.5) * Math.PI;
    spawnParticle(x, y + 0.5, z, Math.cos(angle) * spd * Math.cos(angV), 1 + Math.random() * (fire ? 8 : 6), Math.sin(angle) * spd * Math.cos(angV), fire ? 1.5 : 0.4 + Math.random() * 0.6, boomColor, fire);
  }
  playExplosionSound(fire ? 0.8 : 0.6);
}
function killPolice(p) {
  p.alive = false;
  p.mesh.visible = false;
  if (p.vehicleMesh) p.vehicleMesh.visible = false;
  const px = p.mesh.position.x;
  const py = p.mesh.position.y;
  const pz = p.mesh.position.z;
  for (let k = 0; k < 6; k++) {
    spawnParticle(px, py, pz, (Math.random() - 0.5) * 4, 1 + Math.random() * 3, (Math.random() - 0.5) * 4, 0.3 + Math.random() * 0.3, 0xffcc00);
  }
  gameState.kills++;
  gameState.score += 100 + gameState.comboCount * 10;
  gameState.money += 20 + Math.floor(Math.random() * 30);
  gameState.comboCount++;
  gameState.comboTimer = 3;

}

function updateWantedLevel() {
  let newLevel = 0;
  for (let i = 1; i < WANTED_THRESHOLDS.length; i++) {
    if (gameState.kills >= WANTED_THRESHOLDS[i]) newLevel = i;
    else break;
  }
  if (newLevel > gameState.wantedLevel) {
    gameState.wantedLevel = newLevel;
    flashScreen();
    playUpgradeSound();
    updateWeaponUnlocks();
  }
}

function updateWeaponUnlocks() {
  const newlyUnlocked = [];
  const unlockRule = [
    [2, 10], [5, 15], [3, 25], [6, 30], [4, 40], [7, 50], [9, 35]
  ];
  for (const [idx, threshold] of unlockRule) {
    if (gameState.kills >= threshold && !weapons[idx].unlocked) {
      weapons[idx].unlocked = true;
      newlyUnlocked.push(weapons[idx].name);
    }
  }
  for (const name of newlyUnlocked) {
    showUnlockNotify(name);
  }
}

function distance(a, b) {
  const dx = a.x - b.x;
  const dz = a.z - b.z;
  return Math.sqrt(dx * dx + dz * dz);
}
function updatePoliceAI(dt) {
  const config = getActivePoliceConfig();
  const activeCount = policeUnits.filter(p => p.alive).length;
  if (activeCount < config.count && config.count > 0) {
    if (!window._policeSpawnTimer) window._policeSpawnTimer = 0;
    window._policeSpawnTimer += dt;
    if (window._policeSpawnTimer > 0.8) {
      window._policeSpawnTimer = 0;
      spawnPoliceUnit();
    }
  }
  for (let i = 0; i < policeUnits.length; i++) {
    const p = policeUnits[i];
    if (!p.alive) continue;
    const px = p.mesh.position.x;
    const pz = p.mesh.position.z;
    const distToPlayer = Math.sqrt((px - playerX) * (px - playerX) + (pz - playerZ) * (pz - playerZ));
    if (p.typeDef.helicopter) {
      const hx = playerX + Math.cos(p.heliAngle) * 10;
      const hz = playerZ + Math.sin(p.heliAngle) * 10;
      p.heliAngle += dt * 0.8;
      p.mesh.position.x += (hx - p.mesh.position.x) * dt * 3;
      p.mesh.position.z += (hz - p.mesh.position.z) * dt * 3;
      p.mesh.position.y += (16 - p.mesh.position.y) * dt * 2;
      p.mesh.rotation.y = Math.atan2(playerX - p.mesh.position.x, playerZ - p.mesh.position.z);
      if (distToPlayer < 25) {
        p.fireCooldown -= dt;
        if (p.fireCooldown <= 0) {
          p.fireCooldown = p.fireRate * 3;
          const dirX = playerX - p.mesh.position.x;
          const dirZ = playerZ - p.mesh.position.z;
          const len = Math.sqrt(dirX * dirX + dirZ * dirZ) || 1;
          const spread = 0.1;
          const vx = (dirX / len + (Math.random() - 0.5) * spread) * 45;
          const vz = (dirZ / len + (Math.random() - 0.5) * spread) * 45;
          spawnPoliceBullet(p.mesh.position.x, p.mesh.position.y - 1, p.mesh.position.z, vx, -5, vz, p.damage * 0.5);
          playShootSound(0.3);
        }
      }
      continue;
    }
    if (p.inCar && p.vehicleMesh) {
      const dx = playerX - p.vehicleMesh.position.x;
      const dz = playerZ - p.vehicleMesh.position.z;
      const d = Math.sqrt(dx * dx + dz * dz) || 0.001;
      if (d < 4) continue;
      const vx = (dx / d) * p.speed;
      const vz = (dz / d) * p.speed;
      const newX = p.vehicleMesh.position.x + vx * dt;
      const newZ = p.vehicleMesh.position.z + vz * dt;
      const hw = p.typeDef.tank ? 1.5 : 1;
      const hd = p.typeDef.tank ? 2.5 : 2;
      if (!rectCollidesBuilding(newX, newZ, hw, hd)) {
        p.vehicleMesh.position.x = newX;
        p.vehicleMesh.position.z = newZ;
      }
      p.vehicleMesh.rotation.y = Math.atan2(dx, dz);
      p.mesh.position.copy(p.vehicleMesh.position);
      p.mesh.position.y += 1.5;
      if (p.typeDef.tank && distToPlayer < 30) {
        p.fireCooldown -= dt;
        if (p.fireCooldown <= 0) {
          p.fireCooldown = p.fireRate * 2;
          const dirX = playerX - p.mesh.position.x;
          const dirZ = playerZ - p.mesh.position.z;
          const len = Math.sqrt(dirX * dirX + dirZ * dirZ) || 1;
          spawnPoliceBullet(p.mesh.position.x + dirX / len * 2, p.mesh.position.y, p.mesh.position.z + dirZ / len * 2, dirX / len * 30, 0, dirZ / len * 30, p.damage * 2);
          playShootSound(0.6);
          const boomX = playerX + (Math.random() - 0.5) * 4;
          const boomZ = playerZ + (Math.random() - 0.5) * 4;
          for (let k = 0; k < 12; k++) {
            spawnParticle(boomX, 0.5, boomZ, (Math.random() - 0.5) * 6, 2 + Math.random() * 4, (Math.random() - 0.5) * 6, 0.3 + Math.random() * 0.3, 0xff4400);
          }
          if (distToPlayer < 6) {
            damagePlayer(p.damage);
          }
        }
      }
      continue;
    }
    p.fireCooldown -= dt;
    const dx = playerX - px;
    const dz = playerZ - pz;
    const d = Math.sqrt(dx * dx + dz * dz) || 0.001;
    const pdx = dx / d;
    const pdz = dz / d;
    if (distToPlayer > 8) {
      let mx = px + pdx * p.speed * dt;
      let mz = pz + pdz * p.speed * dt;
      const hw = 0.25;
      const hd = 0.25;
      if (rectCollidesBuilding(mx, pz, hw, hd)) {
        mx = px + pdz * p.speed * 0.5 * dt;
        if (rectCollidesBuilding(mx, pz, hw, hd)) mx = px;
      }
      if (rectCollidesBuilding(px, mz, hw, hd)) {
        mz = pz - pdx * p.speed * 0.5 * dt;
        if (rectCollidesBuilding(px, mz, hw, hd)) mz = pz;
      }
      p.mesh.position.x = mx;
      p.mesh.position.z = mz;
      p.mesh.rotation.y = Math.atan2(dx, dz);
    }
    if (distToPlayer < 20) {
      if (p.fireCooldown <= 0) {
        p.fireCooldown = p.fireRate;
        const spread = 0.04;
        const bx = px + pdx * 0.5;
        const by = p.mesh.position.y + 0.3;
        const bz = pz + pdz * 0.5;
        const bvx = (pdx + (Math.random() - 0.5) * spread) * 40;
        const bvz = (pdz + (Math.random() - 0.5) * spread) * 40;
        spawnPoliceBullet(bx, by, bz, bvx, 0, bvz, p.damage);
        playShootSound(0.15);
      }
    }
  }
}
function updateGangAI(dt) {

    let targetX = playerX;

        targetX = p.mesh.position.x;
        targetZ = p.mesh.position.z;
        targetDist = dist;
        isPoliceTarget = true;
      }
    }
    if (g.inCar && g.vehicleMesh) {
      const dx = targetX - g.vehicleMesh.position.x;

      const newX = g.vehicleMesh.position.x + vx * dt;
      const newZ = g.vehicleMesh.position.z + vz * dt;

        g.vehicleMesh.position.x = newX;
        g.vehicleMesh.position.z = newZ;
      }
      g.vehicleMesh.rotation.y = Math.atan2(dx, dz);
      g.mesh.position.copy(g.vehicleMesh.position);
      g.mesh.position.y += 1.5;

    }
    g.fireCooldown -= dt;
    const dx = targetX - gx;
    const dz = targetZ - gz;
    const d = Math.sqrt(dx * dx + dz * dz) || 0.001;
    const gdx = dx / d;
    const gdz = dz / d;
    if (targetDist > 8) {
      let mx = gx + gdx * g.speed * dt;
      let mz = gz + gdz * g.speed * dt;

    if (phaseTime < halfPeriod) return 'yellow';

function updateCivilianCars(dt) {
  for (let i = 0; i < civilianCars.length; i++) {
    const car = civilianCars[i];
    const x = car.mesh.position.x;
    const z = car.mesh.position.z;
    const fwd = car.forward;
    let targetSpeed = car.cruiseSpeed;
    const nextInt = findNextIntersection(x, z, fwd);
    if (nextInt) {
      const lightState = getTrafficLightState(x, z, fwd);
      if (lightState === 'red') {
        if (nextInt.dist < 3) {
          targetSpeed = Math.max(0, (nextInt.dist - 0.5) / 3 * car.cruiseSpeed);
          if (nextInt.dist < 1.5) targetSpeed = 0;
        }
      } else if (lightState === 'yellow') {
        if (nextInt.dist > 5) {
          targetSpeed = Math.max(0, (nextInt.dist - 0.5) / 5 * car.cruiseSpeed);
        }
      }
    }
    for (let j = 0; j < civilianCars.length; j++) {
      if (j === i) continue;
      const other = civilianCars[j];
      if (other.forward !== car.forward) continue;
      let aheadDist;
      if (fwd === 'n') aheadDist = other.mesh.position.z - z;
      else if (fwd === 's') aheadDist = z - other.mesh.position.z;
      else if (fwd === 'e') aheadDist = other.mesh.position.x - x;
      else aheadDist = x - other.mesh.position.x;
      const latDist = fwd === 'n' || fwd === 's'
        ? Math.abs(other.mesh.position.x - x)
        : Math.abs(other.mesh.position.z - z);
      if (aheadDist > 0 && aheadDist < 4 && latDist < 1.5) {
        targetSpeed = Math.min(targetSpeed, Math.max(0, (aheadDist - 2.5) * car.cruiseSpeed / 2));
        if (aheadDist < 2.5) targetSpeed = Math.min(targetSpeed, other.speed);
        break;
      }
    }
    if (fwd === 'n' && z > HALF_CITY - 3) targetSpeed = 0;
    if (fwd === 's' && z < -HALF_CITY + 3) targetSpeed = 0;
    if (fwd === 'e' && x > HALF_CITY - 3) targetSpeed = 0;
    if (fwd === 'w' && x < -HALF_CITY + 3) targetSpeed = 0;
    const borderDist = fwd === 'n' ? HALF_CITY - z : fwd === 's' ? z + HALF_CITY : fwd === 'e' ? HALF_CITY - x : x + HALF_CITY;
    if (borderDist < 0.5) {
      car.speed = 0;
      const oppFwd = fwd === 'n' ? 's' : fwd === 's' ? 'n' : fwd === 'e' ? 'w' : 'e';
      car.forward = oppFwd;
      if (oppFwd === 'n') { car.dirX = 0; car.dirZ = 1; car.mesh.rotation.y = 0; }
      else if (oppFwd === 's') { car.dirX = 0; car.dirZ = -1; car.mesh.rotation.y = Math.PI; }
      else if (oppFwd === 'e') { car.dirX = 1; car.dirZ = 0; car.mesh.rotation.y = Math.PI / 2; }

const TOUCH_ZONES = { JOYSTICK: 'joystick', CAMERA: 'camera', NONE: 'none' };
const activeTouches = new Map();

function getTouchZone(clientX, clientY) {

  if (clientX < w * 0.4 && clientY > h * 0.2) return TOUCH_ZONES.JOYSTICK;
  if (clientX > w * 0.3) return TOUCH_ZONES.CAMERA;

}
function onPointerDown(e) {

  const finger = { id: e.pointerId, startX: e.clientX, startY: e.clientY, currentX: e.clientX, currentY: e.clientY, zone };
  activeTouches.set(e.pointerId, finger);
  if (zone === TOUCH_ZONES.JOYSTICK && joystickFingerId === null) {
    joystickFingerId = e.pointerId;
    joystickStartX = e.clientX;
    joystickStartY = e.clientY;
    joystickCurrentX = e.clientX;
    joystickCurrentY = e.clientY;

function onPointerMove(e) {

  finger.currentX = e.clientX;
  finger.currentY = e.clientY;
  if (e.pointerId === joystickFingerId) {
    joystickCurrentX = e.clientX;
    joystickCurrentY = e.clientY;
    const dx = joystickCurrentX - joystickStartX;
    const dy = joystickCurrentY - joystickStartY;
    const maxR = 70;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const clamped = dist > maxR ? { x: dx / dist * maxR, y: dy / dist * maxR } : { x: dx, y: dy };
    moveDirX = -clamped.x / maxR;
    moveDirY = -clamped.y / maxR;
    const len = Math.sqrt(moveDirX * moveDirX + moveDirY * moveDirY);
    if (len > 1) { moveDirX /= len; moveDirY /= len; }
    drawJoystick(joystickStartX, joystickStartY, clamped.x, clamped.y);
  }
  updateCameraFingers();
  if (isPinching) {
    const fingers = getCameraZoneFingers();
    if (fingers.length >= 2) {
      const d = Math.sqrt((fingers[1].currentX - fingers[0].currentX) ** 2 + (fingers[1].currentY - fingers[0].currentY) ** 2);
      if (pinchStartDist > 0 && d > 0) {
        const scale = d / pinchStartDist;

        targetCameraDistance = Math.max(1, Math.min(50, targetCameraDistance));
      }
    }
  } else if (cameraFingers.length === 1) {
    const f = cameraFingers[0];
    const prev = f.prevX !== undefined ? f.prevX : f.currentX;
    const prevY = f.prevY !== undefined ? f.prevY : f.currentY;
    const deltaX = f.currentX - prev;
    const deltaY = f.currentY - prevY;
    f.prevX = f.currentX;
    f.prevY = f.currentY;

        b.userData.alive = false;
        b.visible = false;
        hit = true;
        break;
      }
    }
    if (hit) continue;
    for (let j = 0; j < policeUnits.length; j++) {
      const pu = policeUnits[j];
      if (pu.vehicleDestroyed || !pu.vehicleMesh) continue;
      const cdx = bx - pu.vehicleMesh.position.x;
      const cdz = bz - pu.vehicleMesh.position.z;
      const cdist = Math.sqrt(cdx * cdx + cdz * cdz);
      if (cdist < 1.8) {
        if (b.userData.explosive) {
          bulletHitExplosion(bx, b.position.y, bz, b.userData.rangeDamage, b.userData.fire);
          pu.vehicleHealth -= b.userData.rangeDamage;
        } else {
          pu.vehicleHealth -= b.userData.damage;
        }
        if (pu.vehicleHealth <= 0) { pu.vehicleDestroyed = true; pu.inCar = false; pu.mesh.visible = true; explodeVehicle(pu.vehicleMesh); }
        for (let k = 0; k < 5; k++) {
          spawnParticle(bx, b.position.y, bz, (Math.random() - 0.5) * 2, 0.5 + Math.random(), (Math.random() - 0.5) * 2, 0.15, 0xffaa44);
        }
        b.userData.alive = false;
        b.visible = false;
        hit = true;
        break;
      }
    }
    if (hit) continue;
    for (let j = 0; j < lampposts.length; j++) {
      const lp = lampposts[j];
      if (!lp.alive) continue;
      const dx = bx - lp.base.position.x;
      const dz = bz - lp.base.position.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist < 0.5) {
        lp.health -= b.userData.damage;
        if (lp.health <= 0) {
          lp.alive = false;
          lp.base.visible = false;
          lp.top.visible = false;
          for (let k = 0; k < 8; k++) {
            spawnParticle(lp.base.position.x, 1.5, lp.base.position.z, (Math.random() - 0.5) * 3, 1 + Math.random() * 2, (Math.random() - 0.5) * 3, 0.3, 0x444444);
          }
        }
        b.userData.alive = false;
        b.visible = false;
        hit = true;
        break;
      }
    }
    if (hit) continue;
    for (let j = 0; j < trees.length; j++) {
      const t = trees[j];
      if (!t.alive) continue;
      const dx = bx - t.x;
      const dz = bz - t.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist < 0.8) {
        t.health -= b.userData.damage;
        if (t.health <= 0) {
          t.alive = false;
          const matrix = new THREE.Matrix4();
          matrix.compose(new THREE.Vector3(t.x, -100, t.z), new THREE.Quaternion(), new THREE.Vector3(1, 1, 1));
          treeInstancedMesh.setMatrixAt(t.index, matrix);
          treeTopInstanced.setMatrixAt(t.index, matrix);
          treeInstancedMesh.instanceMatrix.needsUpdate = true;
          treeTopInstanced.instanceMatrix.needsUpdate = true;
          for (let k = 0; k < 10; k++) {
            spawnParticle(t.x, 2, t.z, (Math.random() - 0.5) * 4, 1 + Math.random() * 3, (Math.random() - 0.5) * 4, 0.4, 0x2d8a4e);
          }
        }
        b.userData.alive = false;
        b.visible = false;
        hit = true;
        break;
      }
    }
  }
  for (let i = 0; i < throwablePool.length; i++) {
    const t = throwablePool[i];
    if (!t.userData.alive) continue;
    t.userData.vy -= 15 * dt;
    t.position.x += t.userData.vx * dt;
    t.position.y += t.userData.vy * dt;
    t.position.z += t.userData.vz * dt;
    t.userData.time += dt;
    if (t.position.y < 0.2) {
      t.position.y = 0.2;
      t.userData.vx *= 0.7;
      t.userData.vz *= 0.7;
      t.userData.vy = -t.userData.vy * 0.3;
    }
    if (t.userData.time >= t.userData.fuseTime) {
      bulletHitExplosion(t.position.x, t.position.y, t.position.z, t.userData.rangeDamage, t.userData.fire);
      t.userData.alive = false;
      t.visible = false;
    }
  }
  for (let i = 0; i < policeBulletPool.length; i++) {
    const b = policeBulletPool[i];
    if (!b.userData.alive) continue;
    b.position.x += b.userData.vx * dt;
    b.position.y += b.userData.vy * dt;
    b.position.z += b.userData.vz * dt;
    b.userData.traveled += Math.sqrt(b.userData.vx ** 2 + b.userData.vz ** 2) * dt;
    if (b.userData.traveled > 40) {
      b.userData.alive = false;
      b.visible = false;
      continue;
    }
    if (rectCollidesBuilding(b.position.x, b.position.z, 0.1, 0.1)) {
      b.userData.alive = false;
      b.visible = false;
      continue;
    }
    let hitVehicle = false;
    for (let j = 0; j < civilianCars.length; j++) {
      const car = civilianCars[j];
      if (car.destroyed) continue;
      const cdx = b.position.x - car.mesh.position.x;
      const cdz = b.position.z - car.mesh.position.z;
      if (Math.sqrt(cdx * cdx + cdz * cdz) < 1.5) {
        car.health -= b.userData.damage;
        if (car.health <= 0 && !car.destroyed) { car.destroyed = true; explodeVehicle(car.mesh); }
        hitVehicle = true;
        break;
      }
    }
    if (!hitVehicle) {
      for (let j = 0; j < policeUnits.length; j++) {
        const pu = policeUnits[j];
        if (!pu.alive || pu.vehicleDestroyed || !pu.vehicleMesh) continue;
        const cdx = b.position.x - pu.vehicleMesh.position.x;
        const cdz = b.position.z - pu.vehicleMesh.position.z;
        if (Math.sqrt(cdx * cdx + cdz * cdz) < 1.5) {
          pu.vehicleHealth -= b.userData.damage;
          if (pu.vehicleHealth <= 0) { pu.vehicleDestroyed = true; pu.inCar = false; pu.mesh.visible = true; explodeVehicle(pu.vehicleMesh); }
          hitVehicle = true;
          break;
        }
      }
    }
    if (!hitVehicle) {
      for (let j = 0; j < gangUnits.length; j++) {
        const gu = gangUnits[j];
        if (!gu.alive || gu.vehicleDestroyed || !gu.vehicleMesh) continue;
        const cdx = b.position.x - gu.vehicleMesh.position.x;
        const cdz = b.position.z - gu.vehicleMesh.position.z;
        if (Math.sqrt(cdx * cdx + cdz * cdz) < 1.5) {
          gu.vehicleHealth -= b.userData.damage;
          if (gu.vehicleHealth <= 0) { gu.vehicleDestroyed = true; gu.inCar = false; gu.mesh.visible = true; explodeVehicle(gu.vehicleMesh); }
          hitVehicle = true;
          break;
        }
      }
    }
    if (hitVehicle) {
      b.userData.alive = false;
      b.visible = false;
      continue;
    }
    if (gameState.inVehicle && gameState.currentVehicle) {
      const cv = gameState.currentVehicle;
      if (!cv.destroyed && cv.health > 0) {
        const cdx = b.position.x - cv.mesh.position.x;
        const cdz = b.position.z - cv.mesh.position.z;
        if (Math.sqrt(cdx * cdx + cdz * cdz) < 2) {
          cv.health -= b.userData.damage;
          for (let k = 0; k < 5; k++) {
            spawnParticle(b.position.x, b.position.y, b.position.z, (Math.random() - 0.5) * 2, 0.5 + Math.random(), (Math.random() - 0.5) * 2, 0.15, 0xffaa44);
          }
          if (cv.health <= 0) {
            cv.destroyed = true;
            explodeVehicle(cv.mesh);
            gameState.inVehicle = false;
            gameState.currentVehicle = null;
            playerMesh.visible = true;
            playerMesh.position.set(playerX, 0.9, playerZ);
            targetCameraDistance = 8;
            baseCameraDistance = 8;
            btnVehicle.textContent = '上车';
            btnVehicle.style.background = 'rgba(0,180,60,0.7)';
          }
          b.userData.alive = false;
          b.visible = false;
          continue;
        }
      }
    }
    const dx = b.position.x - playerX;
    const dz = b.position.z - playerZ;
    const hDist = Math.sqrt(dx * dx + dz * dz);
    if (hDist < 0.6) {
      damagePlayer(b.userData.damage);
      b.userData.alive = false;
      b.visible = false;
    }
  }
  updateParticles(dt);
  updateHUD();
  drawMinimap();
  renderer.render(scene, camera);
}
function updateParticles(dt) {
  for (let i = 0; i < particlePool.length; i++) {
    const p = particlePool[i];
    if (!p.userData.alive) continue;
    p.position.x += p.userData.vx * dt;
    p.position.y += p.userData.vy * dt;
    p.position.z += p.userData.vz * dt;
    if (p.userData.fire) {
      p.userData.vy += 5 * dt;
      p.userData.vx *= 0.98;
      p.userData.vz *= 0.98;
    } else {
      p.userData.vy -= 8 * dt;
    }
    p.userData.life -= dt;
    const t = Math.max(0, p.userData.life / p.userData.maxLife);
    p.scale.setScalar(t);
    if (p.userData.life <= 0) {
      p.userData.alive = false;
      p.visible = false;
    }
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (animFrameId) {
      cancelAnimationFrame(animFrameId);
      animFrameId = null;
    }
  } else {
    lastTime = performance.now();
    if (!animFrameId) {
      animFrameId = requestAnimationFrame(gameLoop);
    }
  }
});
window.addEventListener('beforeunload', () => {
  if (animFrameId) cancelAnimationFrame(animFrameId);
  renderer.dispose();
  if (audioCtx) audioCtx.close();
});
animFrameId = requestAnimationFrame(gameLoop);
</script>

</body>
</html>
