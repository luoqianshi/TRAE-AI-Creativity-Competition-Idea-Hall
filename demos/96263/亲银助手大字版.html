<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>亲银助手 · 大字版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 22px; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: #fff;
    color: #000;
    min-height: 100vh;
    padding: 24px 18px;
  }
  .app-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 4px solid #000;
  }
  .app-bar .logo { font-size: 1.4rem; font-weight: 800; }
  .app-bar .time { font-size: 1.1rem; font-weight: 700; color: #555; }
  .hero {
    background: #000;
    color: #fff;
    border-radius: 24px;
    padding: 28px;
    text-align: center;
    margin-bottom: 24px;
  }
  .hero .greeting { font-size: 1.8rem; font-weight: 700; }
  .hero .date { font-size: 1rem; margin-top: 6px; opacity: 0.8; }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .big-btn {
    border: 4px solid #000;
    border-radius: 24px;
    padding: 28px 12px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .big-btn:hover, .big-btn:active {
    background: #000;
    color: #fff;
    transform: scale(1.02);
  }
  .big-btn .icon { font-size: 2.6rem; }
  .big-btn .label { font-size: 1.1rem; font-weight: 700; }
  .big-btn .sub { font-size: 0.75rem; color: #666; }
  .big-btn:hover .sub { color: #ccc; }
  .big-btn.emergency {
    grid-column: span 2;
    background: #e53935;
    color: #fff;
    border-color: #e53935;
    flex-direction: row;
    justify-content: center;
    gap: 18px;
  }
  .big-btn.emergency:hover { background: #c62828; }
  .big-btn.emergency .sub { color: #ffccbc; }
  .big-btn.medicine { background: #fff3e0; border-color: #f57c00; }
  .big-btn.medicine:hover { background: #f57c00; }
  .big-btn.weather { background: #e3f2fd; border-color: #1976d2; }
  .big-btn.weather:hover { background: #1976d2; }
  .big-btn.phone { background: #e8f5e9; border-color: #388e3c; }
  .big-btn.phone:hover { background: #388e3c; }
  .big-btn.photo { background: #fce4ec; border-color: #c2185b; }
  .big-btn.photo:hover { background: #c2185b; }
  .big-btn.bus { background: #f3e5f5; border-color: #7b1fa2; }
  .big-btn.bus:hover { background: #7b1fa2; }
  .big-btn.video { background: #e0f2f1; border-color: #00796b; }
  .big-btn.video:hover { background: #00796b; }
  .notice {
    margin-top: 24px;
    border: 3px solid #000;
    border-radius: 16px;
    padding: 18px;
    background: #fffde7;
  }
  .notice h3 { font-size: 1.1rem; margin-bottom: 8px; }
  .notice p { font-size: 0.9rem; color: #333; }
  .voice-hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: #000;
    color: #fff;
    padding: 10px 24px;
    border-radius: 30px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div class="app-bar">
  <div class="logo">👴 亲银助手</div>
  <div class="time" id="clock">--:--</div>
</div>

<div class="hero">
  <div class="greeting" id="greeting">下午好</div>
  <div class="date" id="date">--月--日</div>
</div>

<div class="grid">
  <div class="big-btn phone" onclick="openApp('一键电话')">
    <span class="icon">📞</span>
    <span class="label">一键电话</span>
    <span class="sub">打给儿女</span>
  </div>
  <div class="big-btn video" onclick="openApp('视频通话')">
    <span class="icon">🎥</span>
    <span class="label">视频通话</span>
    <span class="sub">看清脸</span>
  </div>
  <div class="big-btn weather" onclick="openApp('今日天气')">
    <span class="icon">🌤️</span>
    <span class="label">今日天气</span>
    <span class="sub">26℃ 多云</span>
  </div>
  <div class="big-btn medicine" onclick="openApp('用药提醒')">
    <span class="icon">💊</span>
    <span class="label">用药提醒</span>
    <span class="sub">14:00 降压药</span>
  </div>
  <div class="big-btn photo" onclick="openApp('家庭相册')">
    <span class="icon">🖼️</span>
    <span class="label">家庭相册</span>
    <span class="sub">看照片</span>
  </div>
  <div class="big-btn bus" onclick="openApp('实时公交')">
    <span class="icon">🚌</span>
    <span class="label">实时公交</span>
    <span class="sub">801路 2站</span>
  </div>
  <div class="big-btn emergency" onclick="help()">
    <span class="icon">🆘</span>
    <span class="label">紧急求助</span>
    <span class="sub">长按发送位置</span>
  </div>
</div>

<div class="notice">
  <h3>📢 社区通知</h3>
  <p>明天上午 9 点社区广场有免费义诊，记得带身份证。</p>
</div>

<div class="voice-hint">🔊 点击图标会语音播报</div>

<script>
  function updateTime() {
    const now = new Date();
    const h = now.getHours();
    const m = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clock').textContent = `${h}:${m}`;
    document.getElementById('date').textContent = `${now.getMonth()+1}月${now.getDate()}日 星期${'日一二三四五六'[now.getDay()]}`;
    let greet = '早上好';
    if (h >= 12) greet = '下午好';
    if (h >= 18) greet = '晚上好';
    document.getElementById('greeting').textContent = greet;
  }
  setInterval(updateTime, 1000);
  updateTime();
  function openApp(name) {
    alert('正在打开「' + name + '」，已启用大字体和语音播报。');
  }
  function help() {
    alert('已向子女发送求助位置，正在拨打 120...');
  }
</script>
</body>
</html>
