  function drawDonut(w) {
    const labels = Object.keys(w.results), data = Object.values(w.results);
    const colorOf = l => l === "确认成功" ? "#ef4444" : l === "需人工复核" ? "#d97706" : l === "转发重复告警" ? "#0f766e" : l === "扫描探测" ? "#7f8d9f" : l === "未见成功证据" ? "#0065fd" : "#059669";
    const colors = labels.map(colorOf);
    if (donutChart) donutChart.destroy();
    donutChart = new Chart(CFW.$("#ovDonut"), {
      type: "doughnut",
      data: { labels, datasets: [{ data, backgroundColor: colors, borderColor: "#ffffff", borderWidth: 3, hoverOffset: 6 }] },
      options: { maintainAspectRatio: false, cutout: "62%", plugins: { legend: { display: false } } }
    });
    CFW.$("#ovLegend").innerHTML = labels.map((l, i) =>
      `<span><i style="background:${colors[i]}"></i>${l} <b class="mono">${fmt(data[i])}</b></span>`).join("");
  }

  function startTicker() {
    const box = CFW.$("#ovTicker");
    if (!box) return;
    if (tickerTimer) clearInterval(tickerTimer);
    const pool = Array.isArray(CFW.DEMO.tickerPool) ? CFW.DEMO.tickerPool : [];
    if (!pool.length) {
      box.innerHTML = `<div class="empty"><div class="big">暂无实时告警流</div><div>有新告警进入后会自动显示。</div></div>`;
      return;
    }
    const timeText = value => {
      const raw = String(value || "");
      const m = raw.match(/\b(\d{2}:\d{2}:\d{2})\b/);
      return m ? m[1] : "--:--:--";
    };
    const make = p => {
      const row = CFW.el("div", "tick-row");
      row.innerHTML = `<span class="ts">${timeText(p.time)}</span>
        <span class="tag tag-${p.level}">${p.level}</span>
        <span>${esc(p.event)} <span class="mut mono" style="font-size:11px">${esc(p.src)}</span></span>
        <span class="res res-${p.res}" style="font-size:11.5px">${p.res}</span>`;
      box.appendChild(row);
    };
    box.innerHTML = "";
    pool.slice(0, 8).forEach(make);
  }

  CFW.stopTicker = () => { if (tickerTimer) clearInterval(tickerTimer); };
})();

</script>
<script data-source="view-pipeline.js">
/* ===== 视图：研判流水线 (实时处理链路) ===== */
(function () {
  const { esc, fmt, ICON, win } = CFW;

  const STAGE_COLORS = {
    primary: "var(--primary)",
    ok: "var(--ok)",
    warn: "var(--warn)",
    danger: "var(--danger)",
    violet: "var(--violet)",
  };

  CFW.renderPipeline = function () {
    const root = CFW.$("#view-pipeline");
    const w = win();
    const h = CFW.DEMO.health || {};
    const ps = CFW.DEMO.pipelineStatus || {};
    const cfg = ps.config || {};
    const last = ps.last_round || {};
    const active = Object.keys(ps.active_round || {}).length ? ps.active_round : last;
    const totals = ps.totals || {};
    const state = ps.state || {};
    const mode = pipelineMode(cfg, last);

    root.innerHTML = `
      <div class="grid g-4 pipe-kpis">
        ${kpi(mode.tone, "clock", "轮询状态", mode.label, mode.detail)}
        ${kpi("primary", "collect", "最近有效新事件", fmt(n(active.new_records)), `${roundTime(active)} · 查询 ${fmt(n(active.query_total))}`)}
        ${kpi("ok", "auto", "自动忽略", fmt(n(active.ignore_event_ids)), `${fmt(n(w.kpi.auto))} / ${fmt(n(w.kpi.total))} 条 · ${pctText(w.kpi.ignoreRate)}`)}
        ${kpi(n(active.manual_pending_push) ? "warn" : "primary", "notify", "人工待推", fmt(n(active.manual_pending_push)), pushText(active))}
      </div>

      <div class="panel pipe-map mt">
        <div class="accent-top"></div>
        <h2>实时处理链路 <span class="hint">最近有效轮次 ${roundTime(active)} · ${active.dry_run ? "演练模式" : "真实执行"}</span></h2>
        <div class="pipe-stage-grid">
          ${stage("collect", "采集", n(last.query_total) || n(active.query_total) || n(w.kpi.total), "告警中心窗口查询", `近 ${n(cfg.lookback_minutes) || 10} 分钟`, "primary")}
          ${stage("filter", "去重", n(active.new_records), "只处理新 EventId", `活跃 ${fmt(n(active.active_before))} · 去重 ${fmt(n(active.dedup_removed))}`, "primary")}
          ${stage("funnel", "研判", n(active.alert_count) || n(w.kpi.total), "规则 / 模型 / Agent", sourceBrief(w.sources), "violet")}
          ${stage("eye", "取证", n(h.evidenceHitCount), "源包或缓存命中", `${pctText(h.evidenceHit)} · ${fmt(n(h.evidenceHitCount))}/${fmt(n(h.total))}`, "warn")}
          ${stage("auto", "处置", n(active.ignore_event_ids) || n(w.kpi.auto), "忽略加白候选", `失败 ${fmt(n(totals.action_failed) + n(h.disposeFailed))}`, "ok")}
          ${stage("notify", "通知", n(active.manual_candidates), "人工研判候选", pushText(active), n(active.manual_candidates) ? "warn" : "ok")}
        </div>
      </div>

      <div class="grid pipe-main mt">
        <div class="panel">
          <h2>最近有效轮次 <span class="hint">${active.mode || "暂无轮询"}</span></h2>
          ${roundSummary(active, cfg, state)}
        </div>

        <div class="panel">
          <h2>研判结果流向 <span class="hint">当前时间窗</span></h2>
          ${resultFlow(w, active)}
        </div>
      </div>

      <div class="grid pipe-main mt">
        <div class="panel">
          <h2>最近轮询记录 <span class="hint">${fmt(n(totals.rounds))} 轮 · 新事件 ${fmt(n(totals.new_records))}</span></h2>
          ${roundTable(ps.recent_rounds || [])}
        </div>

        <div class="panel">
          <h2>策略闸与通知 <span class="hint">处置前保护条件</span></h2>
          ${guardPanel(cfg, CFW.DEMO.agent || {}, ps.latest_wecom || {})}
        </div>
      </div>

      <div class="panel mt">
        <h2>需要人工看的事件 <span class="hint">确认成功 / 需人工 / 高危</span></h2>
        ${attentionTable(CFW.DEMO.attention || [])}
      </div>`;
  };

  function kpi(tone, icon, label, value, foot) {
    return `<div class="kpi tone-${tone}">
      <div class="k-label"><span class="k-icon">${iconHtml(icon)}</span>${esc(label)}</div>
      <div class="k-num pipe-k-num">${esc(value)}</div>
      <div class="k-foot">${esc(foot || "")}</div>
    </div>`;
  }

  function stage(icon, title, value, label, meta, tone) {
    const c = STAGE_COLORS[tone] || STAGE_COLORS.primary;
    return `<div class="pipe-stage" style="--stage:${c}">
      <div class="pipe-stage-icon">${iconHtml(icon)}</div>
      <div class="pipe-stage-body">
        <div class="pipe-stage-top">
          <span>${esc(title)}</span>
          <b class="mono">${fmt(value)}</b>
        </div>
        <div class="pipe-stage-label">${esc(label)}</div>
        <div class="pipe-stage-meta">${esc(meta || "")}</div>
      </div>
    </div>`;
  }

  function roundSummary(round, cfg, state) {
    if (!round || !Object.keys(round).length) {
      return `<div class="empty"><div class="big">暂无实时轮询记录</div><div>启动实时轮询后会展示每轮查询、去重、研判和推送状态。</div></div>`;
    }
    const counts = round.judgement_counts || {};
    return `<div class="pipe-round-grid">
      ${kv("查询窗口", `${short(round.query_start)} ~ ${short(round.query_end)}`)}
      ${kv("轮询间隔", `${n(cfg.interval_seconds) || 60}s`)}
      ${kv("本轮查询", fmt(n(round.query_total)))}
      ${kv("新事件", fmt(n(round.new_records)))}
      ${kv("已研判", fmt(n(round.alert_count)))}
      ${kv("自动忽略", fmt(n(round.ignore_event_ids)))}
      ${kv("人工候选", fmt(n(round.manual_candidates)))}
      ${kv("状态缓存", `${fmt(n(state.processed))} 已处理`)}
      <div class="pipe-wide">
        <div class="pipe-mini-title">结论分布</div>
        <div class="wrap-chips">${resultChips(counts)}</div>
      </div>
      <div class="pipe-wide">
        <div class="pipe-mini-title">执行状态</div>
        <div class="pipe-status-line">
          ${statusChip(round.dry_run ? "演练未落库" : "真实执行", round.dry_run ? "warn" : "ok")}
          ${statusChip(`加白 ${fmt(n(round.white_actions_count))}`, "primary")}
          ${statusChip(`忽略 ${fmt(n(round.omit_actions_count))}`, "ok")}
          ${statusChip(`推送 ${pushText(round)}`, n(round.manual_pending_push) ? "warn" : "primary")}
        </div>
      </div>
    </div>`;
  }

  function resultFlow(w, active) {
    const results = w.results || {};
    const sources = w.sources || {};
    const total = n(w.kpi.total);
    const sourceTotal = Object.values(sources).reduce((a, b) => a + n(b), 0) || total;
    return `<div class="pipe-flow-block">
      ${meter("自动处置率", n(w.kpi.auto), total, "ok", `${pctText(w.kpi.ignoreRate)} · ${fmt(n(w.kpi.auto))}/${fmt(total)}`)}
      ${meter("人工保留", n(w.kpi.manual) + n(w.kpi.success), total, "warn", `${fmt(n(w.kpi.manual))} 复核 · ${fmt(n(w.kpi.success))} 成功`)}
      ${meter("本轮忽略", n(active.ignore_event_ids), Math.max(1, n(active.alert_count)), "ok", `${fmt(n(active.ignore_event_ids))}/${fmt(n(active.alert_count))}`)}
      <div class="pipe-mini-title mt-sm">研判来源</div>
      ${Object.entries(sources).sort((a, b) => n(b[1]) - n(a[1])).map(([name, count]) =>
        meter(name, n(count), sourceTotal, sourceTone(name), `${fmt(n(count))} 条`)
      ).join("") || `<div class="empty"><div class="big">暂无来源分布</div></div>`}
      <div class="pipe-mini-title mt-sm">结论</div>
      <div class="wrap-chips">${resultChips(results)}</div>
    </div>`;
  }

  function roundTable(rows) {
    if (!rows.length) {
      return `<div class="empty"><div class="big">暂无轮询记录</div><div>实时轮询日志写入后这里会自动更新。</div></div>`;
    }
    return `<div class="scroll-y pipe-round-scroll"><table>
      <thead><tr><th>时间</th><th class="r">查询</th><th class="r">新事件</th><th class="r">忽略</th><th class="r">人工</th><th>推送</th></tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td class="mono mut">${esc(short(r.recorded_at || r.query_end))}</td>
        <td class="r mono">${fmt(n(r.query_total))}</td>
        <td class="r mono">${fmt(n(r.new_records))}</td>
        <td class="r mono">${fmt(n(r.ignore_event_ids))}</td>
        <td class="r mono ${n(r.manual_pending_push) ? "net-pub" : "mut"}">${fmt(n(r.manual_pending_push))}</td>
        <td>${statusChip(pushText(r), r.dry_run ? "warn" : ((r.manual_push || {}).sent ? "ok" : "primary"))}</td>
      </tr>`).join("")}</tbody>
    </table></div>`;
  }

  function guardPanel(cfg, agent, wecom) {
    const guard = ((agent.agent || {}).policy_guard) || {};
    return `<div class="pipe-guard">
      ${guardRow("实时轮询", cfg.realtime_enabled, `${n(cfg.interval_seconds) || 60}s / ${n(cfg.lookback_minutes) || 10}min`)}
      ${guardRow("自动处置", cfg.auto_dispose, "仅扫描/失败/未见成功证据")}
      ${guardRow("人工推送", cfg.push_manual && cfg.manual_push_enabled, cfg.manual_notify_cooldown_minutes ? `${cfg.manual_notify_cooldown_minutes}min 冷却` : "")}
      ${guardRow("日报", cfg.daily_report_enabled, `${cfg.daily_report_time || "17:50"} 发送`)}
      ${guardRow("小时报", cfg.hourly_report_enabled, cfg.hourly_report_enabled ? "启用" : "已关闭")}
      ${guardRow("成功不忽略", guard.confirmed_success_never_omit !== false && guard.cloud_success_never_omit !== false, "PolicyGuard")}
      ${guardRow("高危要证据", guard.high_alert_requires_evidence !== false, "证据不足保留")}
      <div class="pipe-wecom">
        <div class="pipe-mini-title">企微最近状态</div>
        <div class="pipe-status-line">
          ${statusChip(wecom.sent ? "已发送" : (wecom.reason || "无人工项"), wecom.sent ? "ok" : "warn")}
          ${wecom.recorded_at ? `<span class="mut mono">${esc(short(wecom.recorded_at))}</span>` : ""}
        </div>
      </div>
    </div>`;
  }

  function attentionTable(rows) {
    if (!rows.length) {
      return `<div class="empty"><div class="big">当前没有需要人工看的事件</div><div>确认成功、需人工复核或高危事件会出现在这里。</div></div>`;
    }
    return `<table><thead><tr><th>时间</th><th>等级</th><th>事件</th><th>来源 → 目标</th><th>研判</th></tr></thead>
      <tbody>${rows.slice(0, 10).map(a => `<tr>
        <td class="mut mono">${esc(short(a.time))}</td>
        <td><span class="tag tag-${a.level}">${esc(a.level)}</span></td>
        <td>${esc(a.event)}</td>
        <td class="${a.pub ? "net-pub" : "net-pri"} mono small">${esc(a.src)} → ${esc(a.dst)}</td>
        <td class="res res-${a.result}">${esc(a.result)}</td>
      </tr>`).join("")}</tbody></table>`;
  }

  function kv(label, value) {
    return `<div class="pipe-kv"><span>${esc(label)}</span><b>${esc(value)}</b></div>`;
  }

  function meter(label, value, total, tone, note) {
    const pct = total ? Math.min(100, Math.round(value / total * 100)) : 0;
    const c = STAGE_COLORS[tone] || STAGE_COLORS.primary;
    return `<div class="pipe-meter">
      <div class="pipe-meter-top"><span>${esc(label)}</span><b class="mono">${esc(note || fmt(value))}</b></div>
      <div class="pipe-meter-track"><span style="width:${pct}%;background:${c}"></span></div>
    </div>`;
  }

  function guardRow(label, enabled, detail) {
    return `<div class="pipe-guard-row">
      <div><b>${esc(label)}</b><span>${esc(detail || "")}</span></div>
      ${statusChip(enabled ? "开启" : "关闭", enabled ? "ok" : "warn")}
    </div>`;
  }

  function statusChip(text, tone) {
    return `<span class="pipe-chip ${tone || "primary"}">${esc(text || "—")}</span>`;
  }

  function resultChips(counts) {
    const entries = Object.entries(counts || {}).filter(([, v]) => n(v) > 0);
    if (!entries.length) return `<span class="chip">无结论</span>`;
    return entries.sort((a, b) => n(b[1]) - n(a[1])).map(([k, v]) =>
      `<span class="chip"><span class="res res-${k}">${esc(k)}</span><span class="x">×${fmt(n(v))}</span></span>`
    ).join("");
  }

  function pipelineMode(cfg, last) {
    if (!cfg.realtime_enabled) return { tone: "warn", label: "未启用", detail: "realtime_triage.enabled=false" };
    if (!last || !last.recorded_at) return { tone: "warn", label: "待轮询", detail: `${n(cfg.interval_seconds) || 60}s 间隔` };
    if (last.dry_run) return { tone: "warn", label: "演练", detail: `演练模式 · 最近 ${roundTime(last)}` };
    return { tone: "ok", label: "运行中", detail: `最近 ${roundTime(last)}` };
  }

  function pushText(round) {
    const push = (round && round.manual_push) || {};
    if (!round || !Object.keys(round).length) return "暂无记录";
    if (round.dry_run) return "演练未发送";
    if (push.sent) return "已推送";
    if (n(round.manual_pending_push)) return push.error || push.reason || "待发送";
    return "无人工项";
  }

  function sourceBrief(sources) {
    const entries = Object.entries(sources || {}).sort((a, b) => n(b[1]) - n(a[1]));
    if (!entries.length) return "暂无来源";
    return entries.slice(0, 2).map(([k, v]) => `${k} ${fmt(n(v))}`).join(" · ");
  }

  function sourceTone(name) {
    if (name === "Agent") return "violet";
    if (name === "源包复核") return "primary";
    if (name === "待模型重试") return "warn";
    return "ok";
  }

  function iconHtml(name) {
    return ICON[name] || ICON.flow || "";
  }

  function n(value) {
    return Number(value) || 0;
  }

  function pctText(value) {
    return `${(Number(value) || 0).toFixed(1)}%`;
  }

  function roundTime(round) {
    return short((round && (round.recorded_at || round.query_end)) || "");
  }

  function short(value) {
    const s = String(value || "");
    return s.length >= 16 ? s.slice(5, 16) : (s || "—");
  }
})();

</script>
<script data-source="view-triage.js">
/* ===== 视图：告警人工研判台 (筛选 + 完整详情) ===== */
(function () {
  const { esc, fmt } = CFW;
  const state = { level: "", result: "", source: "", q: "", manualOnly: false, actionMessage: "" };

  CFW.renderTriage = function () {
    const root = CFW.$("#view-triage");
    root.innerHTML = `
      <div class="panel">
        <div class="accent-top"></div>
        <h2 class="flex between"><span>告警人工研判台</span><span class="hint">点击任意行展开完整告警、证据和处置上下文</span></h2>
        <div class="filters triage-filters">
          ${sel("level", "全部等级", ["高危", "中危", "低危"])}
          ${sel("result", "全部研判", ["确认成功", "需人工复核", "待模型重试", "未见成功证据", "确认未成功", "扫描探测", "业务误报", "转发重复告警"])}
          ${sel("source", "全部来源", ["单轮", "源包复核", "Agent", "白名单规则", "待模型重试", "custom_rule"])}
          <input id="triageSearch" class="triage-search" placeholder="搜索事件 / IP / 规则 / 资产 / 告警ID" value="${esc(state.q)}">
          <label class="triage-check"><input type="checkbox" id="manualOnly" ${state.manualOnly ? "checked" : ""}> 只看需人工</label>
          <span class="filt-count mut" id="filtCount"></span>
        </div>
        <div class="triage-action-msg" id="triageActionMsg" style="${state.actionMessage ? "" : "display:none"}">${esc(state.actionMessage)}</div>
        <div class="triage-table-wrap">
          <table id="triageTable" class="triage-table"></table>
        </div>
      </div>`;
    CFW.$$(".filters select", root).forEach(s => s.addEventListener("change", e => { state[e.target.dataset.k] = e.target.value; renderRows(); }));
    const search = CFW.$("#triageSearch", root);
    if (search) search.addEventListener("input", e => { state.q = e.target.value; renderRows(); });
    const manual = CFW.$("#manualOnly", root);
    if (manual) manual.addEventListener("change", e => { state.manualOnly = e.target.checked; renderRows(); });
    renderRows();
  };

  function sel(k, all, opts) {
    return `<select data-k="${k}"><option value="">${all}</option>${opts.map(o => `<option>${esc(o)}</option>`).join("")}</select>`;
  }

  function isManual(r) {
    return !!r.manualRequired;
  }

  function searchBlob(r) {
    return [
      r.id, r.time, r.level, r.event, r.atkIps, r.dstIps, r.dstAsset, r.direction,
      r.threatType, r.country, r.ruleId, r.strategy, r.desc, r.result, r.source,
      r.evidenceFrom, r.evidenceHit, r.why, r.key, r.next, r.trace,
      r.rootSourceIp, r.observedSourceIp, r.intermediateAsset, r.dispositionTarget, r.traceType,
    ].join(" ").toLowerCase();
  }

  function filteredRows() {
    const q = String(state.q || "").trim().toLowerCase();
    return CFW.DEMO.alerts.filter(r =>
      (!state.level || r.level === state.level) &&
      (!state.result || r.result === state.result) &&
      (!state.source || r.source === state.source || r.sourceRaw === state.source) &&
      (!state.manualOnly || isManual(r)) &&
      (!q || searchBlob(r).includes(q))
    );
  }

  function renderRows() {
    const rows = filteredRows();
    const manualCount = rows.filter(isManual).length;
    CFW.$("#filtCount").textContent = `共 ${rows.length} 条 · 需人工 ${manualCount} 条`;
    const colgroup = `<colgroup>
      <col class="triage-col-time">
      <col class="triage-col-level">
      <col class="triage-col-event">
      <col class="triage-col-source-ip">
      <col class="triage-col-target">
      <col class="triage-col-result">
      <col class="triage-col-source">
      <col class="triage-col-evidence">
      <col class="triage-col-token">
    </colgroup>`;
    const head = `<thead><tr>
      <th>时间</th><th>等级</th><th>事件</th><th>攻击源</th><th>目标</th>
      <th>研判结果</th><th>来源</th><th>证据</th><th class="r">Token</th></tr></thead>`;
    CFW.$("#triageTable").innerHTML = colgroup + head + "<tbody>" + rows.map((r, i) => `
      <tr class="click ${isManual(r) ? "manual-row" : ""} ${r.manualHandled ? "handled-row" : ""}" data-i="${i}">
        <td class="triage-time mut mono">${esc(String(r.time || "").slice(5, 16))}</td>
        <td class="triage-level"><span class="tag tag-${esc(r.level)}">${esc(r.level)}</span></td>
        <td class="triage-event">
          <div>${esc(r.event)}</div>
          <div class="mut mono small">${esc(r.id)}${r.manualHandled ? ` · ${esc(r.manualActionLabel || "已处理")}` : ""}</div>
        </td>
        <td class="triage-ip mono ${isPublicIp(r.atkIp) ? "net-pub" : "net-pri"}">${esc(r.atkIps || r.atkIp)}</td>
        <td class="triage-target dim mono small">${esc(r.dstIps || r.dstIp)}${r.dstAsset ? `<br>${esc(r.dstAsset)}` : ""}</td>
        <td class="triage-result res res-${esc(r.result)}">${esc(r.result)}</td>
        <td class="triage-source"><span class="src-pill src-${esc(r.source)}">${esc(r.source)}</span></td>
        <td class="triage-evidence mut small">${esc(r.evidenceHit || r.evidenceFrom || "无")}</td>
        <td class="triage-token r mono mut">${fmt(r.token)}</td>
      </tr>
      <tr class="detail-row" data-d="${i}" style="display:none"><td colspan="9" style="padding:0;border:0">${detail(r)}</td></tr>
    `).join("") + "</tbody>";

    CFW.$$("#triageTable tr.click").forEach(tr => tr.addEventListener("click", () => {
      const i = +tr.dataset.i;
      const dr = CFW.$(`#triageTable tr[data-d="${i}"]`);
      const show = dr.style.display === "none";
      CFW.$$("#triageTable .detail-row").forEach(x => x.style.display = "none");
      dr.style.display = show ? "" : "none";
    }));
    CFW.$$("[data-triage-action]").forEach(btn => btn.addEventListener("click", ev => {
      ev.preventDefault();
      ev.stopPropagation();
      handleAction(btn, btn.dataset.alertId || "", btn.dataset.triageAction || "");
    }));
  }

  function isPublicIp(ip) {
    const parts = String(ip || "").split(".").map(x => parseInt(x, 10));
    if (parts.length !== 4 || parts.some(x => Number.isNaN(x) || x < 0 || x > 255)) return false;
    if (parts[0] === 10 || parts[0] === 127 || parts[0] === 0) return false;
    if (parts[0] === 192 && parts[1] === 168) return false;
    if (parts[0] === 172 && parts[1] >= 16 && parts[1] <= 31) return false;
    if (parts[0] === 169 && parts[1] === 254) return false;
    if (parts[0] >= 224) return false;
    return true;
  }

  function detail(r) {
    const conf = { "高": "var(--ok)", "中": "var(--warn)", "低": "var(--danger)" }[r.conf] || "var(--text-dim)";
    return `<div class="detail triage-detail">
      <div class="detail-grid">
        ${kv("告警ID", r.id, "mono")}
        ${kv("时间", r.time, "mono")}
        ${kv("方向", r.direction)}
        ${kv("威胁类型", r.threatType)}
        ${kv("规则ID", r.ruleId, "mono")}
        ${kv("策略", r.strategy)}
        ${kv("来源国家", r.country)}
        ${kv("白名单状态", r.whiteState)}
        ${kv("攻击IP", r.atkIps, "mono")}
        ${kv("目标IP", r.dstIps, "mono")}
        ${kv("目标资产", r.dstAsset)}
        ${kv("研判模型", r.model || r.sourceRaw)}
      </div>
      ${traceChain(r)}
      ${actionPanel(r)}
      <div class="detail-section">
        <span class="dl">置信度</span> <b style="color:${conf}">${esc(r.conf || "未知")}</b>
        <span class="dl">研判来源</span> ${esc(r.source)}
        <span class="dl">证据来源</span> ${esc(r.evidenceFrom || "无")}
        <span class="dl">Token</span> 入 ${fmt(r.tokenIn)} / 出 ${fmt(r.tokenOut)} / 推理 ${fmt(r.tokenReason)}
      </div>
      ${block("威胁描述", r.desc)}
      ${block("本地建议", r.localAdvice)}
      ${block("下一步", r.next)}
      ${block("研判理由", r.why)}
      ${block("关键证据", r.key, "ev")}
      ${block("工具轨迹", r.trace)}
      ${block("源包命中", r.evidenceHit)}
      ${sourceEvidenceBlock(r.sourceEvidence)}
    </div>`;
  }

  function actionPanel(r) {
    const blockIp = dispositionPublicIp(r);
    const sourceIp = firstIp(r.rootSourceIp, r.dispositionTarget, r.atkIp);
    const status = r.manualHandled
      ? `<div class="triage-action-status ok">已处理 · ${esc(r.manualActionLabel || "人工处理")} ${r.manualActionTime ? `· ${esc(r.manualActionTime)}` : ""}${r.manualActionTarget ? ` · ${esc(r.manualActionTarget)}` : ""}</div>`
      : r.manualActionStatus
        ? `<div class="triage-action-status warn">${esc(r.manualActionStatusText || "待人工")} · ${esc(r.manualActionLabel || "人工处理")} ${r.manualActionTime ? `· ${esc(r.manualActionTime)}` : ""}${r.manualActionTarget ? ` · ${esc(r.manualActionTarget)}` : ""}</div>`
      : `<div class="triage-action-status warn">待人工处理 · 选择下方动作后会写入处理留痕</div>`;
    const id = encodeURIComponent(r.id || "");
    if (r.manualHandled) {
      return `<div class="triage-actions">
        ${status}
        <div class="triage-action-buttons">
          ${actionButton(id, "reopen", "撤销处理", "btn")}
        </div>
        ${r.manualActionNote ? `<div class="triage-action-note">${esc(r.manualActionNote)}</div>` : ""}
      </div>`;
    }
    return `<div class="triage-actions">
      ${status}
      <div class="triage-action-buttons">
        ${actionButton(id, "block_source", "登记人工封禁", "btn danger", !blockIp, blockIp ? `登记 ${blockIp}，不自动调用腾讯云` : "未解析到公网处置对象")}
        ${actionButton(id, "false_positive", "业务误报加白", "btn")}
        ${actionButton(id, "scanner_whitelist", "扫描源白名单", "btn", !sourceIp, sourceIp ? `加白 ${sourceIp}` : "未解析到来源 IP")}
        ${actionButton(id, "mark_handled", "标记已处理", "btn primary")}
      </div>
      <div class="triage-action-note">处置对象：<b class="mono">${esc(blockIp || sourceIp || r.dispositionTarget || r.rootSourceIp || r.atkIp || "—")}</b></div>
    </div>`;
  }

  function actionButton(alertId, action, label, cls, disabled, title) {
    const icon = action === "block_source" ? CFW.ICON.shield : action === "false_positive" ? CFW.ICON.skip : action === "scanner_whitelist" ? CFW.ICON.target : CFW.ICON.list;
    return `<button class="${cls}" data-alert-id="${alertId}" data-triage-action="${action}" ${disabled ? "disabled" : ""} title="${esc(title || label)}"><span class="btn-ic">${icon || ""}</span>${esc(label)}</button>`;
  }

  function firstIp(...values) {
    for (const value of values) {
      const m = String(value || "").match(/\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b/);
      if (m) return m[0];
    }
    return "";
  }

  function dispositionPublicIp(r) {
    const values = [r.dispositionTarget, r.rootSourceIp, r.atkIp, r.atkIps];
    for (const value of values) {
      const ip = firstIp(value);
      if (ip && isPublicIp(ip)) return ip;
    }
    return "";
  }

  async function handleAction(btn, encodedAlertId, action) {
    const alertId = decodeURIComponent(encodedAlertId || "");
    const row = CFW.DEMO.alerts.find(x => x.id === alertId) || {};
    const labels = {
      block_source: "确认登记该处置对象为待人工封禁？平台不会自动调用腾讯云，人工封禁完成后再点标记已处理。",
      false_positive: "确认将这类告警加入业务误报白名单并标记已处理？",
      scanner_whitelist: "确认将该来源加入扫描源白名单并标记已处理？",
      mark_handled: "确认仅标记该告警已处理？不会下发腾讯云或新增规则。",
      reopen: "确认撤销该告警的已处理状态？",
    };
    if (!confirm(labels[action] || "确认执行该处理动作？")) return;
    btn.disabled = true;
    const oldText = btn.textContent;
    btn.textContent = "处理中...";
    try {
      const res = await fetch(`/api/agent/alerts/${encodedAlertId}/handle`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action,
          target_ip: dispositionPublicIp(row) || firstIp(row.rootSourceIp, row.dispositionTarget, row.atkIp),
          days: 30,
        }),
      });
      const payload = await res.json().catch(() => ({}));
      if (!res.ok || payload.error) {
        throw new Error(payload.error || `HTTP ${res.status}`);
      }
      const doneLabel = payload.action?.status === "handled" ? "处理完成" : "已登记";
      state.actionMessage = `${doneLabel}：${payload.action?.action_label || action} · ${alertId}`;
      if (CFW.loadData) await CFW.loadData(CFW.state.days || 1);
      CFW.renderTriage();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = oldText;
      state.actionMessage = `处理失败：${err.message || err}`;
      const msg = CFW.$("#triageActionMsg");
      if (msg) {
        msg.style.display = "";
        msg.textContent = state.actionMessage;
      }
    }
  }

  function traceChain(r) {
    const hasTrace = r.rootSourceIp || r.observedSourceIp || r.dispositionTarget || r.traceType || r.intermediateAsset;
    if (!hasTrace) return "";
    const root = r.rootSourceIp || "未知";
    const observed = r.observedSourceIp || r.atkIp || "未知";
    const target = r.dstIp || "未知";
    const targetLabel = r.dstAsset ? `${target} · ${r.dstAsset}` : target;
    return `<div class="trace-chain">
      <div class="trace-title">
        <span class="dl">溯源链路</span>
        <b>${esc(r.traceType || "未标注")}</b>
      </div>
      <div class="trace-path">
        ${traceNode("真实攻击源", root, "pub")}
        <span class="trace-arrow">→</span>
        ${traceNode("观测源 / 中间节点", observed, "mid", r.intermediateAsset)}
        <span class="trace-arrow">→</span>
        ${traceNode("目标", targetLabel, "dst")}
      </div>
      <div class="trace-action">
        <span>处置对象</span>
        <b class="mono ${isPublicIp(r.dispositionTarget || root) ? "net-pub" : "net-pri"}">${esc(r.dispositionTarget || root || "—")}</b>
        <em>当前内网观测源只作为链路节点，不作为默认封禁对象。</em>
      </div>
    </div>`;
  }

  function traceNode(label, value, tone, sub) {
    return `<div class="trace-node trace-${tone}">
      <span>${esc(label)}</span>
      <b class="mono">${esc(value || "—")}</b>
      ${sub ? `<small>${esc(sub)}</small>` : ""}
    </div>`;
  }

  function kv(label, value, cls) {
    return `<div class="detail-kv"><span>${esc(label)}</span><b class="${cls || ""}">${esc(value || "—")}</b></div>`;
  }

  function block(label, value, cls) {
    if (!value) return "";
    return `<div class="detail-block"><span class="${cls || "dl"}">${esc(label)}</span> ${esc(value)}</div>`;
  }

  function sourceEvidenceBlock(value) {
    if (!value) return "";
    let pretty = value;
    if (typeof value === "object") {
      pretty = JSON.stringify(value, null, 2);
    } else try {
      pretty = JSON.stringify(JSON.parse(value), null, 2);
    } catch (e) {}
    return `<div class="detail-block"><span class="ev">源包证据</span><pre class="evidence-json">${esc(pretty)}</pre></div>`;
  }
})();

</script>
<script data-source="view-attackers.js">
/* ===== 视图：攻击者画像 ===== */
(function () {
  const { esc, fmt } = CFW;
  const CHAIN = ["探测", "尝试利用", "成功利用", "落地驻留", "控制回连", "横向扩散", "外传/破坏"];
  const STAGE_ALIAS = {
    "": "探测",
    "无": "探测",
    "侦察": "探测",
    "侦察扫描": "探测",
    "扫描探测": "探测",
    "武器化": "尝试利用",
    "投递": "尝试利用",
    "利用": "尝试利用",
    "漏洞利用": "尝试利用",
    "利用尝试": "尝试利用",
    "已利用": "成功利用",
    "利用成功": "成功利用",
    "安装": "落地驻留",
    "落地": "落地驻留",
    "落地执行": "落地驻留",
    "命令控制": "控制回连",
    "控制": "控制回连",
    "横向": "横向扩散",
    "横向移动": "横向扩散",
    "数据窃取": "外传/破坏",
    "影响破坏": "外传/破坏",
    "外传破坏": "外传/破坏",
    "数据/破坏": "外传/破坏",
    "行动": "外传/破坏"
  };
  const bandColor = { "高危": "var(--danger)", "关注": "var(--warn)", "一般": "var(--text-dim)" };

  CFW.renderAttackers = function () {
    const root = CFW.$("#view-attackers");
    const list = CFW.DEMO.profiles;
    const bands = { 高危: 0, 关注: 0, 一般: 0 };
    list.forEach(p => bands[p.band]++);

    root.innerHTML = `
      <div class="grid g-4">
        <div class="kpi tone-primary"><div class="k-label">画像对象</div><div class="k-num">${list.length}</div><div class="k-foot">按处置对象 / 真实攻击源聚合</div></div>
        <div class="kpi tone-danger"><div class="k-label">高危画像</div><div class="k-num">${bands["高危"]}</div><div class="k-foot">存在成功或落地证据</div></div>
        <div class="kpi tone-warn"><div class="k-label">内网对象</div><div class="k-num">${list.filter(p => p.internal).length}</div><div class="k-foot">不等同默认封禁对象</div></div>
        <div class="kpi tone-ok"><div class="k-label">已得手</div><div class="k-num">${list.filter(p => p.success > 0).length}</div><div class="k-foot">存在真实落地证据</div></div>
      </div>

      <div class="atk-wall mt">
        ${list.map(card).join("")}
      </div>`;
  };

  function stageLabel(value) {
    return STAGE_ALIAS[value] || value || "探测";
  }

  function chainTrack(stageMax) {
    const idx = Math.max(0, CHAIN.indexOf(stageLabel(stageMax)));
    return `<div class="chain">${CHAIN.map((s, i) => `
      <div class="chain-node ${i <= idx ? "on" : ""} ${i === idx ? "cur" : ""}">
        <span class="cn-dot"></span><span class="cn-t">${s}</span>
      </div>${i < CHAIN.length - 1 ? `<div class="chain-line ${i < idx ? "on" : ""}"></div>` : ""}`).join("")}</div>`;
  }

  function card(p) {
    const c = bandColor[p.band];
    const stage = stageLabel(p.stage);
    const chainMax = stageLabel(p.killchainMax);
    const evs = Object.entries(p.events).sort((a, b) => b[1] - a[1])
      .map(([k, v]) => `<span class="chip">${esc(k)}<span class="x">×${v}</span></span>`).join("");
    const observed = (p.observedSources || []).slice(0, 3).join(", ");
    const basis = p.actorBasis ? `按${p.actorBasis}聚合` : "";
    const forwarded = p.forwardedCount ? ` · 转发重复 ${p.forwardedCount}` : "";
    return `<div class="atk-card" style="--c:${c}">
      <div class="atk-head">
        <div>
          <div class="atk-ip mono">${p.internal ? "🏠" : "🌐"} ${esc(p.ip)}</div>
          <div class="atk-sub">${p.internal ? "内网对象" : "公网对象 · " + esc(p.country)} · ${esc(p.type)} · ${esc(basis)}${esc(forwarded)} · 意图 ${esc(p.intent)}</div>
        </div>
        <div class="atk-score">
          <div class="as-num mono" style="color:${c}">${p.score}<span>/100</span></div>
          <div class="as-band" style="color:${c};border-color:${c}">${p.band}</div>
        </div>
      </div>

      <div class="atk-narr">${esc(p.narrative)}</div>

      <div class="atk-lab">攻击阶段 · 当前 <b style="color:${c}">${esc(stage)}</b></div>
      ${chainTrack(chainMax)}

      <div class="atk-stats">
        <div><span class="mut">告警</span><b>${p.alertCount}</b></div>
        <div><span class="mut">手法</span><b>${p.techniques}</b></div>
        <div><span class="mut">目标</span><b>${p.targets}</b></div>
        <div><span class="mut">跨度</span><b>${p.span}h</b></div>
        <div><span class="mut">高危</span><b style="color:var(--danger)">${p.high}</b></div>
        <div><span class="mut">得手</span><b style="color:${p.success ? "var(--danger)" : "var(--ok)"}">${p.success}</b></div>
      </div>

      <div class="atk-lab">手法序列</div>
      <div class="wrap-chips">${evs}</div>

      <div class="atk-rec"><b>处置建议</b> ${esc(p.rec)}</div>
      ${observed ? `<div class="atk-foot mut mono">观测节点 ${esc(observed)}</div>` : ""}
      <div class="atk-foot mut mono">活动 ${esc(p.first.slice(5, 16))} ~ ${esc(p.last.slice(5, 16))}</div>
    </div>`;
  }
})();

</script>
<script data-source="view-assistant.js">
/* ===== 视图：Agent 助手 ===== */
(function () {
  const { esc, fmt } = CFW;
  const state = {
    messages: [],
    busy: false,
    draft: "",
  };

  const starterPrompts = [
    "帮我做一次威胁狩猎，找最近值得关注的攻击源和资产",
    "分析最近确认成功和需人工的告警，给处置优先级",
    "围绕 203.0.113.10 自己查告警、画像和关联行为",
    "解释告警ID demo-alert-0001，并判断下一步怎么处置",
    "把这个事件作为正常业务生成加白草案：",
  ];

  CFW.renderAssistant = function () {
    const root = CFW.$("#view-assistant");
    root.innerHTML = `
      <div class="assistant-layout single">
        <section class="assistant-main panel">
          <div class="accent-top"></div>
          <div class="assistant-head">
            <div>
              <h2>Agent 助手</h2>
              <div class="mut small">LLM 自主选择工具、检索证据、总结结论和提出威胁狩猎下一步；处置只生成草案或人工建议。</div>
            </div>
            <span class="assistant-mode">LLM TOOL AGENT</span>
          </div>
          <div class="assistant-chat" id="assistantChat">
            ${state.messages.length ? state.messages.map(renderMessage).join("") : renderWelcome()}
            ${state.busy ? renderBusy() : ""}
          </div>
          <form class="assistant-composer" id="assistantForm">
            <textarea id="assistantInput" placeholder="问一个 SOC 问题，例如：做一次威胁狩猎；或：围绕某个 IP 自己查告警、画像、关联行为并总结">${esc(state.draft)}</textarea>
            <div class="assistant-compose-actions">
              <div class="assistant-hints">
                ${starterPrompts.slice(0, 3).map(p => `<button type="button" class="chip" data-agent-prompt="${esc(p)}">${esc(p)}</button>`).join("")}
              </div>
              <button class="btn primary" type="submit" ${state.busy ? "disabled" : ""}>发送</button>
            </div>
          </form>
        </section>
      </div>
    `;
    bindAssistant(root);
    scrollChat();
  };

  function bindAssistant(root) {
    const form = CFW.$("#assistantForm", root);
    const input = CFW.$("#assistantInput", root);
    if (input) {
      input.addEventListener("input", () => { state.draft = input.value; });
      input.addEventListener("keydown", ev => {
        if (ev.key === "Enter" && !ev.shiftKey) {
          ev.preventDefault();
          form && form.requestSubmit();
        }
      });
    }
    if (form) {
      form.addEventListener("submit", ev => {
        ev.preventDefault();
        sendMessage((input && input.value) || "");
      });
    }
    CFW.$$("[data-agent-prompt]", root).forEach(btn => btn.addEventListener("click", () => {
      state.draft = btn.dataset.agentPrompt || "";
      CFW.renderAssistant();
      const next = CFW.$("#assistantInput");
      if (next) {
        next.focus();
        next.setSelectionRange(next.value.length, next.value.length);
      }
    }));
    CFW.$$("[data-agent-nav]", root).forEach(btn => btn.addEventListener("click", () => {
      const item = CFW.$(`.nav-item[data-view="${btn.dataset.agentNav}"]`);
      if (item) item.click();
    }));
  }

  async function sendMessage(text) {
    const message = String(text || "").trim();
    if (!message || state.busy) return;
    state.messages.push({ role: "user", text: message, at: nowTime() });
    state.draft = "";
    state.busy = true;
    CFW.renderAssistant();
    try {
      const res = await fetch("/api/agent/assistant/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, days: CFW.state.days || 1 }),
      });
      const payload = await res.json().catch(() => ({}));
      if (!res.ok || payload.error) throw new Error(payload.error || `HTTP ${res.status}`);
      state.messages.push({
        role: "assistant",
        answer: payload.answer || "已完成，但没有生成可展示结论。",
        artifacts: payload.artifacts || [],
        suggestions: payload.suggestions || [],
        tools: payload.tool_calls || [],
        safety: payload.safety || null,
        mode: payload.mode || "",
        at: nowTime(),
      });
    } catch (err) {
      state.messages.push({ role: "assistant", answer: `调用失败：${err.message || err}`, artifacts: [], suggestions: [], tools: [], at: nowTime(), error: true });
    } finally {
      state.busy = false;
      CFW.renderAssistant();
    }
  }

  function renderWelcome() {
    return `<div class="assistant-welcome">
      <div class="assistant-orb">${CFW.ICON.cpu || ""}</div>
      <div>
        <h2>把告警、IP、规则需求直接说出来</h2>
        <p>助手会自己决定查哪些告警、画像、关联关系和狩猎聚合，再把证据整理成结论。它不会直接改策略，封禁和规则只输出草案或人工建议。</p>
        <div class="assistant-starters">
          ${starterPrompts.map(p => `<button class="chip" data-agent-prompt="${esc(p)}">${esc(p)}</button>`).join("")}
        </div>
      </div>
    </div>`;
  }

  function renderBusy() {
    return `<div class="msg assistant">
      <div class="msg-avatar">${CFW.ICON.cpu || ""}</div>
      <div class="msg-body">
        <div class="msg-meta">Agent 助手 · 正在调用工具</div>
        <div class="assistant-loading"><span></span><span></span><span></span></div>
      </div>
    </div>`;
  }

  function renderMessage(msg) {
    if (msg.role === "user") {
      return `<div class="msg user">
        <div class="msg-body">
          <div class="msg-meta">你 · ${esc(msg.at || "")}</div>
          <div class="msg-text">${formatText(msg.text)}</div>
        </div>
      </div>`;
    }
    return `<div class="msg assistant ${msg.error ? "is-error" : ""}">
      <div class="msg-avatar">${CFW.ICON.cpu || ""}</div>
      <div class="msg-body">
        <div class="msg-meta">Agent 助手 · ${esc(msg.at || "")}</div>
        <div class="msg-text">${formatText(msg.answer || "")}</div>
        ${msg.tools && msg.tools.length ? `<details class="assistant-trace"><summary>取证轨迹 ${msg.tools.length} 步</summary><div class="inline-tools">${msg.tools.map(renderTool).join("")}</div></details>` : ""}
        ${msg.artifacts && msg.artifacts.length ? `<div class="assistant-artifacts">${msg.artifacts.map(renderArtifact).join("")}</div>` : ""}
        ${msg.suggestions && msg.suggestions.length ? `<div class="assistant-suggestions">${msg.suggestions.map(renderSuggestion).join("")}</div>` : ""}
      </div>
    </div>`;
  }

  function renderTool(tool) {
    const cls = tool.status === "ok" ? "ok" : tool.status === "not_found" ? "warn" : tool.status === "error" ? "danger" : "";
    return `<span class="tool-chip ${cls}">
      <b class="mono">${esc(tool.name || "")}</b>
      <em>${esc(tool.detail || "")}</em>
      <i>${fmt(tool.count || 0)}</i>
    </span>`;
  }

  function renderSuggestion(item) {
    if (item.action === "navigate" && item.view) {
      return `<button type="button" class="chip primary" data-agent-nav="${esc(item.view)}">${esc(item.label || "打开")}</button>`;
    }
    return `<button type="button" class="chip" data-agent-prompt="${esc(item.prompt || item.label || "")}">${esc(item.label || item.prompt || "")}</button>`;
  }

  function renderArtifact(artifact) {
    const type = artifact.type || "";
    if (type === "alert") return alertArtifact(artifact.title, artifact.data || {});
    if (type === "alert_list") return alertListArtifact(artifact.title, artifact.data || []);
    if (type === "ip_profile") return ipArtifact(artifact.title, artifact.data || {});
    if (type === "rule_draft") return ruleArtifact(artifact.title, artifact.data || {});
    if (type === "summary") return summaryArtifact(artifact.title, artifact.data || {});
    if (type === "triage_preview") return jsonArtifact(artifact.title, artifact.data || {});
    if (type === "hunt") return huntArtifact(artifact.title, artifact.data || {});
    return jsonArtifact(artifact.title || "结果", artifact.data || artifact);
  }

  function alertArtifact(title, a) {
    return `<div class="artifact alert-artifact">
      <div class="artifact-title">${esc(title || "告警")}${a.manual_required ? `<span class="tag danger">需人工</span>` : ""}</div>
      <div class="artifact-grid">
        ${kv("告警ID", a.alert_id, "mono")}
        ${kv("时间", a.time, "mono")}
        ${kv("等级", a.level)}
        ${kv("结果", a.result)}
        ${kv("攻击源", a.source_ip, "mono")}
        ${kv("目标", a.target, "mono")}
        ${kv("资产", a.asset)}
        ${kv("来源", a.source)}
      </div>
      ${a.reason ? `<div class="artifact-block"><b>理由</b><span>${esc(a.reason)}</span></div>` : ""}
      ${a.key_evidence ? `<div class="artifact-block"><b>证据</b><span>${esc(a.key_evidence)}</span></div>` : ""}
    </div>`;
  }

  function alertListArtifact(title, rows) {
    if (!rows.length) return `<div class="artifact"><div class="artifact-title">${esc(title || "告警列表")}</div><div class="mut">暂无匹配告警</div></div>`;
    return `<div class="artifact">
      <div class="artifact-title">${esc(title || "告警列表")}<span class="hint">${rows.length} 条</span></div>
      <div class="assistant-alert-list">
        ${rows.slice(0, 8).map(a => `
          <div class="assistant-alert-row">
            <span class="mono">${esc(String(a.time || "").slice(5, 16))}</span>
            <b>${esc(a.level || "")}</b>
            <em>${esc(a.event || "")}</em>
            <i class="mono">${esc(a.source_ip || "")}</i>
            <strong>${esc(a.result || "")}</strong>
          </div>
        `).join("")}
      </div>
    </div>`;
  }

  function ipArtifact(title, data) {
    const profile = data.profile || {};
    const events = data.top_events || [];
    return `<div class="artifact">
      <div class="artifact-title">${esc(title || "IP 画像")}<span class="tag">${data.public ? "公网" : "内网/保留地址"}</span></div>
      <div class="artifact-grid">
        ${kv("IP", data.ip, "mono")}
        ${kv("评分", profile.score || profile.rule_score || "-")}
        ${kv("类型", profile.attacker_type || profile.band || "未分类")}
        ${kv("关联告警", data.related_count || 0)}
      </div>
      ${profile.narrative ? `<div class="artifact-block"><b>画像叙述</b><span>${esc(profile.narrative)}</span></div>` : ""}
      ${events.length ? `<div class="artifact-pills">${events.map(e => `<span>${esc(e.event)} × ${fmt(e.count)}</span>`).join("")}</div>` : ""}
    </div>`;
  }

  function ruleArtifact(title, draft) {
    const target = ruleTarget(draft);
    return `<div class="artifact">
      <div class="artifact-title">${esc(title || "规则草案")}<span class="tag">${esc(draft.status || "draft")}</span></div>
      <div class="artifact-grid">
        ${kv("类型", draft.type || "-")}
        ${kv("动作", draft.action || "-")}
        ${kv("对象", target || "-")}
        ${kv("解析器", draft.parser || draft.llm_provider || "heuristic")}
        ${kv("过期", draft.expires_at || "长期")}
        ${kv("人工确认", draft.requires_human_confirm ? "需要" : "不需要")}
      </div>
      ${Array.isArray(draft.notes) && draft.notes.length ? `<div class="artifact-pills">${draft.notes.map(n => `<span>${esc(n)}</span>`).join("")}</div>` : ""}
      <details class="artifact-json"><summary>查看草案 JSON</summary><pre>${esc(JSON.stringify(draft, null, 2))}</pre></details>
    </div>`;
  }

  function summaryArtifact(title, data) {
    const results = data.results || {};
    const attackers = data.top_attackers || [];
    return `<div class="artifact">
      <div class="artifact-title">${esc(title || "态势汇总")}</div>
      <div class="summary-mini">
        <div><span>总告警</span><b>${fmt(data.total || 0)}</b></div>
        <div><span>自动忽略</span><b>${fmt(data.auto_ignored || 0)}</b></div>
        <div><span>需人工</span><b>${fmt(data.manual_required || 0)}</b></div>
      </div>
      <div class="artifact-pills">${Object.entries(results).slice(0, 6).map(([k, v]) => `<span>${esc(k)} × ${fmt(v)}</span>`).join("")}</div>
      ${attackers.length ? `<div class="assistant-alert-list compact">
        ${attackers.slice(0, 5).map(a => `<div class="assistant-alert-row"><i class="mono">${esc(a.ip || "")}</i><em>${esc(a.country || "")}</em><strong>${fmt(a.count || 0)}</strong></div>`).join("")}
      </div>` : ""}
    </div>`;
  }

  function huntArtifact(title, data) {
    const findings = data.findings || [];
    return `<div class="artifact">
      <div class="artifact-title">${esc(title || "威胁狩猎发现")}<span class="hint">${esc(String(findings.length || 0))} 项</span></div>
      <div class="summary-mini">
        <div><span>扫描告警</span><b>${fmt(data.total_alerts_scanned || 0)}</b></div>
        <div><span>焦点</span><b>${esc(data.focus || "all")}</b></div>
        <div><span>窗口</span><b>${fmt(data.days || 0)} 天</b></div>
      </div>
      ${findings.length ? `<div class="hunt-list">
        ${findings.slice(0, 8).map(f => `
          <div class="hunt-row ${esc(f.severity || "")}">
            <div>
              <b>${esc(f.title || "")}</b>
              <span>${esc(f.why || "")}</span>
            </div>
            <em>${esc(f.severity || "unknown")}</em>
          </div>
        `).join("")}
      </div>` : `<div class="mut mt-sm">未发现明显异常聚合。</div>`}
    </div>`;
  }

  function jsonArtifact(title, data) {
    return `<div class="artifact">
      <div class="artifact-title">${esc(title || "工具结果")}</div>
      <details class="artifact-json" open><summary>结构化结果</summary><pre>${esc(JSON.stringify(data, null, 2))}</pre></details>
    </div>`;
  }

  function kv(label, value, cls) {
    return `<div><span>${esc(label)}</span><b class="${cls || ""}">${esc(value == null || value === "" ? "-" : value)}</b></div>`;
  }

  function ruleTarget(draft) {
    const match = draft.match || {};
    const values = []
      .concat(draft.ips || [])
      .concat(match.src_ips || [])
      .concat(match.src_ip || [])
      .concat(match.dst_ip || [])
      .filter(Boolean);
    return values.join(", ");
  }

  function formatText(text) {
    return esc(text)
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\n/g, "<br>");
  }

  function nowTime() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  }

  function scrollChat() {
    requestAnimationFrame(() => {
      const chat = CFW.$("#assistantChat");
      if (chat) chat.scrollTop = chat.scrollHeight;
    });
  }
})();

</script>
<script data-source="view-lists.js">
/* ===== 视图：规则中心 ===== */
(function () {
  const { esc } = CFW;
  const LOG_KEY = "cfw.rule.actions.v1";
  let activePane = "library";
  let createMode = "manual";
  let currentDraft = null;
  let lastResult = null;
  let manualForm = { type: "block_ip", ips: "", reason: "人工确认", days: "30" };
  let naturalText = "";

  CFW.renderLists = function () {
    const root = CFW.$("#view-lists");
    const rules = Array.isArray(CFW.DEMO.customRules) ? CFW.DEMO.customRules : [];
    const stats = ruleStats(rules);

    root.innerHTML = `
      <div class="panel mt rule-shell">
        <div class="accent-top"></div>
        <div class="rule-shell-head">
          <div>
            <h2>规则中心</h2>
            <div class="rule-title">规则库、创建入口、默认白名单与执行记录分离管理</div>
            <div class="mut small">黑名单只记录人工封禁对象，白名单负责研判抑制；平台不自动调用腾讯云封禁。</div>
          </div>
          <div class="rule-tabs" role="tablist">
            ${tabButton("library", "规则库")}
            ${tabButton("create", "新建规则")}
            ${tabButton("whitelist", "默认白名单")}
            ${tabButton("actions", "执行记录")}
          </div>
        </div>
      </div>

      <div class="rule-kpis mt">
        ${statCard("全部规则", rules.length, "含系统默认规则")}
        ${statCard("生效中", stats.active, "正在参与实时研判")}
        ${statCard("黑名单", stats.block, "仅登记人工封禁对象")}
        ${statCard("白名单", stats.allow + stats.suppress, "扫描源与业务误报")}
      </div>

      ${pane(rules)}
    `;

    bindEvents(root);
  };

  function tabButton(key, label) {
    return `<button class="${activePane === key ? "active" : ""}" data-rule-pane="${key}">${label}</button>`;
  }

  function statCard(label, value, hint) {
    return `<div class="rule-stat"><span>${esc(label)}</span><b>${esc(String(value))}</b><em>${esc(hint)}</em></div>`;
  }

  function pane(rules) {
    if (activePane === "create") return createPane();
    if (activePane === "whitelist") return whitelistPane();
    if (activePane === "actions") return actionsPane();
    return libraryPane(rules);
  }

  function bindEvents(root) {
    CFW.$$("[data-rule-pane]", root).forEach(btn => btn.addEventListener("click", () => {
      activePane = btn.dataset.rulePane || "library";
      CFW.renderLists();
    }));
    CFW.$$("[data-create-mode]", root).forEach(btn => btn.addEventListener("click", () => {
      createMode = btn.dataset.createMode || "manual";
      CFW.renderLists();
    }));
    const manualDraft = CFW.$("#manualDraftBtn", root);
    if (manualDraft) manualDraft.addEventListener("click", draftManualRule);
    const localDraft = CFW.$("#draftRuleBtn", root);
    if (localDraft) localDraft.addEventListener("click", () => draftNaturalRule(false));
    const llmDraft = CFW.$("#draftRuleLlmBtn", root);
    if (llmDraft) llmDraft.addEventListener("click", () => draftNaturalRule(true));
    CFW.$$("[data-save-rule]", root).forEach(btn => btn.addEventListener("click", () => saveRule(btn.dataset.saveRule === "activate")));
    CFW.$$("[data-rule-action]", root).forEach(btn => btn.addEventListener("click", () => updateRule(btn.dataset.ruleId, btn.dataset.ruleAction)));
    const saveWhitelist = CFW.$("#saveWhitelistBtn", root);
    if (saveWhitelist) saveWhitelist.addEventListener("click", saveWhitelistConfig);
    const importCandidates = CFW.$("#importWhitelistCandidatesBtn", root);
    if (importCandidates) importCandidates.addEventListener("click", importWhitelistCandidates);
    const clearLogs = CFW.$("#clearRuleLogsBtn", root);
    if (clearLogs) clearLogs.addEventListener("click", () => {
      localStorage.removeItem(LOG_KEY);
      CFW.renderLists();
    });
  }

  function libraryPane(rules) {
    const rows = rules.map(ruleRow).join("") || `<tr><td colspan="8" class="mut">暂无规则</td></tr>`;
    return `<div class="panel mt">
      <div class="rule-section-head">
        <div>
          <h2>规则库 <span class="hint">${rules.length} 条</span></h2>
          <div class="mut small">只在这里管理规则状态；创建、解析和默认白名单已拆到独立页。</div>
        </div>
        <button class="btn primary" data-rule-pane="create">新建规则</button>
      </div>
      <table class="rule-table">
        <thead><tr><th>状态</th><th>类型</th><th>匹配对象</th><th>处置动作</th><th>外部同步</th><th>过期</th><th>来源</th><th>操作</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }

  function createPane() {
    return `<div class="rule-workbench mt">
      <div class="panel rule-editor-panel">
        <div class="rule-section-head">
          <div>
            <h2>新建规则</h2>
            <div class="mut small">先生成草案，再决定保存草案或确认生效。</div>
          </div>
          <div class="rule-tabs compact">
            ${modeButton("manual", "手动创建")}
            ${modeButton("natural", "自然语言")}
          </div>
        </div>
        ${createMode === "manual" ? manualCreatePane() : naturalCreatePane()}
      </div>
      <div class="panel rule-preview-panel">
        <h2>草案预览</h2>
        ${draftPreview()}
        ${lastResult ? `<h2 class="mt">最近结果</h2><pre class="draft-box result-box">${esc(JSON.stringify(lastResult, null, 2))}</pre>` : ""}
      </div>
    </div>`;
  }

  function modeButton(key, label) {
    return `<button class="${createMode === key ? "active" : ""}" data-create-mode="${key}">${label}</button>`;
  }

  function manualCreatePane() {
    return `<div>
      <div class="classic-rule-grid">
        <label><span>规则类型</span><select id="manualRuleType" class="agent-input">
          <option value="block_ip" ${manualForm.type === "block_ip" ? "selected" : ""}>攻击源黑名单 · 封禁来源 IP</option>
          <option value="scanner_whitelist" ${manualForm.type === "scanner_whitelist" ? "selected" : ""}>受控扫描源白名单</option>
        </select></label>
        <label><span>有效期</span><input id="manualExpireDays" class="agent-input mono" type="number" min="1" max="365" value="${esc(manualForm.days)}"></label>
      </div>
      <label class="rule-label">规则对象</label>
      <textarea id="manualIpText" class="rule-input" placeholder="每行一个 IPv4，支持粘贴 txt 列表和 # 注释">${esc(manualForm.ips)}</textarea>
      <label class="rule-label">原因</label>
      <input id="manualReason" class="agent-input" value="${esc(manualForm.reason)}">
      <div class="rule-toolbar mt-sm">
        <button class="btn primary" id="manualDraftBtn">生成草案</button>
        <span class="hint">黑名单只登记对象，不自动下发腾讯云；封禁需人工执行。</span>
      </div>
    </div>`;
  }

  function naturalCreatePane() {
    return `<div>
      <label class="rule-label">自然语言输入</label>
      <textarea id="ruleText" class="rule-input natural-input" placeholder="例如：事件编号 xxx 是正常业务，以后同源同目标同规则不研判&#10;&#10;例如：45.79.8.221 是公司漏扫扫描源，以后直接加白&#10;&#10;例如：封禁以下IP&#10;1.2.3.4&#10;5.6.7.8">${esc(naturalText)}</textarea>
      <div class="rule-toolbar mt-sm">
        <div class="flex" style="gap:8px;flex-wrap:wrap">
          <button class="btn" id="draftRuleBtn">本地解析</button>
          <button class="btn primary" id="draftRuleLlmBtn">LLM 解析</button>
        </div>
        <span class="hint">LLM 解析失败会回退本地保守解析。</span>
      </div>
    </div>`;
  }

  function draftPreview() {
    if (!currentDraft) {
      return `<div class="rule-empty">
        <b>等待草案</b>
        <span>从左侧手动创建或自然语言解析生成规则草案。</span>
      </div>`;
    }
    const meta = describeRule(currentDraft);
    const notes = Array.isArray(currentDraft.notes) ? currentDraft.notes : [];
    return `<div class="rule-draft-card ${meta.tone}">
      <div class="rule-draft-top">
        <div>
          <div class="rule-draft-kind">${esc(meta.kind)}</div>
          <div class="mut small">${esc(meta.summary)}</div>
        </div>
        <span class="tag">${esc(currentDraft.status || "draft")}</span>
      </div>
      <div class="rule-preview-grid">
        ${previewItem("匹配对象", meta.target)}
        ${previewItem("处置动作", meta.action)}
        ${previewItem("有效期", currentDraft.expires_at || "长期")}
        ${previewItem("来源", currentDraft._ui_source || (currentDraft.parser === "llm" ? "LLM 解析" : "本地解析"))}
      </div>
      ${notes.length ? `<div class="rule-notes">${notes.map(n => `<span>${esc(n)}</span>`).join("")}</div>` : ""}
      <details class="rule-json">
        <summary>调试详情 JSON</summary>
        <pre class="draft-box">${esc(JSON.stringify(currentDraft, null, 2))}</pre>
      </details>
      <div class="rule-toolbar mt-sm">
        <div class="flex" style="gap:8px;flex-wrap:wrap">
          <button class="btn" data-save-rule="draft">保存草案</button>
          <button class="btn primary" data-save-rule="activate">确认生效</button>
        </div>
        <span class="hint">${currentDraft.action === "block_ip" ? "确认生效只登记人工封禁对象，不调用腾讯云。" : "生效后进入实时研判规则链路。"}</span>
      </div>
    </div>`;
  }

  function previewItem(label, value) {
    return `<div><span>${esc(label)}</span><b>${esc(value || "-")}</b></div>`;
  }

  function whitelistPane() {
    const cfg = CFW.DEMO.whitelistConfig || {};
    const counts = cfg.counts || {};
    const tencentIps = Array.isArray(cfg.tencent_scan_ips) ? cfg.tencent_scan_ips : [];
    const companyIps = Array.isArray(cfg.company_scan_ips) ? cfg.company_scan_ips : [];
    const candidates = Array.isArray(cfg.candidates) ? cfg.candidates : [];
    return `<div class="panel mt">
      <div class="rule-section-head">
        <div>
          <h2>默认白名单</h2>
          <div class="mut small">系统级扫描源白名单，保存后直接进入实时研判链路；规则库中只读展示。</div>
        </div>
      </div>
      <div class="classic-rule-grid">
        <div class="rule-stat"><span>腾讯云扫描源</span><b>${counts.tencent_scan_ips || tencentIps.length || 0}</b><em>系统默认</em></div>
        <div class="rule-stat"><span>公司扫描源</span><b>${counts.company_scan_ips || companyIps.length || 0}</b><em>受控来源</em></div>
        <div class="rule-stat"><span>合计去重</span><b>${counts.total || 0}</b><em>实时命中</em></div>
      </div>
      ${candidates.length ? `<div class="whitelist-candidates">
        <div>
          <b>发现历史白名单候选</b>
          <span>${esc(candidates.map(c => `${c.ip} (${c.label || c.target || "candidate"})`).join("、"))}</span>
        </div>
        <button class="btn tiny" id="importWhitelistCandidatesBtn">填入候选</button>
      </div>` : ""}
      <div class="whitelist-config-grid">
        <label>
          <span>腾讯云扫描源 IP</span>
          <textarea id="tencentWhitelistIps" class="rule-input whitelist-input" placeholder="每行一个 IPv4，支持 # 注释">${esc(tencentIps.join("\n"))}</textarea>
        </label>
        <label>
          <span>公司 / 受控扫描源 IP</span>
          <textarea id="companyWhitelistIps" class="rule-input whitelist-input" placeholder="每行一个 IPv4，支持 # 注释">${esc(companyIps.join("\n"))}</textarea>
        </label>
      </div>
      <div class="rule-toolbar mt-sm">
        <button class="btn primary" id="saveWhitelistBtn">保存默认白名单</button>
        <span class="hint">这里不创建普通规则，只更新系统默认白名单配置。</span>
      </div>
      ${lastResult ? `<h2 class="mt">最近结果</h2><pre class="draft-box result-box">${esc(JSON.stringify(lastResult, null, 2))}</pre>` : ""}
    </div>`;
  }

  function actionsPane() {
    const logs = loadActionLogs();
    return `<div class="panel mt">
      <div class="rule-section-head">
        <div>
          <h2>执行记录 <span class="hint">${logs.length} 条</span></h2>
          <div class="mut small">第一版先记录本浏览器上的保存、生效、禁用、白名单保存和下发返回；后续可迁移到后端审计日志。</div>
        </div>
        <button class="btn tiny" id="clearRuleLogsBtn">清空本地记录</button>
      </div>
      <div class="rule-action-feed">
        ${logs.map(actionItem).join("") || `<div class="rule-empty"><b>暂无执行记录</b><span>保存或启停规则后会出现在这里。</span></div>`}
      </div>
    </div>`;
  }

  function actionItem(item) {
    return `<div class="rule-action-item">
      <div>
        <b>${esc(item.title || "规则操作")}</b>
        <span>${esc(item.summary || "")}</span>
      </div>
      <time>${esc(item.time || "")}</time>
    </div>`;
  }

  async function draftManualRule() {
    manualForm = {
      type: CFW.$("#manualRuleType")?.value || "block_ip",
      ips: CFW.$("#manualIpText")?.value || "",
      reason: CFW.$("#manualReason")?.value.trim() || "人工确认",
      days: CFW.$("#manualExpireDays")?.value || "30",
    };
    const ips = extractIps(manualForm.ips);
    if (!ips.length) {
      currentDraft = null;
      lastResult = { error: "未解析到有效 IPv4" };
      CFW.renderLists();
      return;
    }
    const text = manualForm.type === "block_ip"
      ? `封禁以下IP\n${ips.join("\n")}\n原因:${manualForm.reason}`
      : `以下 IP 是公司受控扫描源，以后直接加白\n${ips.join("\n")}\n原因:${manualForm.reason}`;
    await draftRuleFromPayload({ text, use_llm: false, ui_source: "手动创建" });
    applyExpireDaysToDraft(manualForm.days);
  }

  async function draftNaturalRule(useLlm) {
    naturalText = CFW.$("#ruleText")?.value || "";
    await draftRuleFromPayload({
      text: naturalText,
      use_llm: !!useLlm,
      ui_source: useLlm ? "自然语言 LLM 解析" : "自然语言本地解析",
    });
  }

  async function draftRuleFromPayload(payload) {
    lastResult = { status: payload.use_llm ? "LLM 解析中..." : "本地解析中..." };
    CFW.renderLists();
    try {
      const res = await fetch("/api/agent/rules/draft", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      currentDraft = await res.json();
      currentDraft._ui_source = payload.ui_source || (payload.use_llm ? "LLM 解析" : "本地解析");
      lastResult = null;
      pushActionLog("生成草案", describeRule(currentDraft).summary);
    } catch (e) {
      currentDraft = null;
      lastResult = { error: "生成失败: " + e };
    }
    CFW.renderLists();
  }

  function applyExpireDaysToDraft(value) {
    if (!currentDraft) return;
    const days = Math.max(1, Math.min(365, Number(value || 30)));
    const expires = new Date(Date.now() + days * 86400000);
    currentDraft.expires_at = formatDateTime(expires);
    CFW.renderLists();
  }

  async function saveRule(activate) {
    if (!currentDraft) {
      lastResult = { error: "请先生成规则草案" };
      CFW.renderLists();
      return;
    }
    if (activate) {
      const isBlockRule = currentDraft.action === "block_ip";
      const message = isBlockRule
        ? `确认登记黑名单对象 ${blockIps(currentDraft).length} 个 IP？平台不会自动调用腾讯云封禁。`
        : "确认让这条自定义规则生效？生效后命中的告警会进入对应规则处理。";
      if (!confirm(message)) return;
    }
    lastResult = { status: activate ? "正在保存并生效..." : "正在保存草案..." };
    CFW.renderLists();
    try {
      const res = await fetch("/api/agent/rules", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          rule: persistedDraft(currentDraft),
          activate,
        })
      });
      lastResult = await res.json();
      pushActionLog(activate ? "规则生效" : "保存草案", describeRule(lastResult).summary);
      if (CFW.loadData) await CFW.loadData(CFW.state.days);
      activePane = "library";
      CFW.renderLists();
    } catch (e) {
      lastResult = { error: "保存失败: " + e };
      CFW.renderLists();
    }
  }

  async function updateRule(ruleId, action) {
    const decoded = decodeURIComponent(ruleId || "");
    const rules = Array.isArray(CFW.DEMO.customRules) ? CFW.DEMO.customRules : [];
    const rule = rules.find(r => r.rule_id === decoded) || {};
    if (action === "activate") {
      const isBlockRule = rule.action === "block_ip";
      const message = isBlockRule
        ? `确认登记黑名单对象 ${blockIps(rule).length} 个 IP？平台不会自动调用腾讯云封禁。`
        : "确认让这条规则生效？";
      if (!confirm(message)) return;
    }
    if (action === "disable" && !confirm("确认禁用这条规则？")) return;
    try {
      const res = await fetch(`/api/agent/rules/${encodeURIComponent(decoded)}/${action}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({})
      });
      lastResult = await res.json();
      pushActionLog(action === "activate" ? "规则生效" : "规则禁用", describeRule(lastResult).summary);
      if (CFW.loadData) await CFW.loadData(CFW.state.days);
      CFW.renderLists();
    } catch (e) {
      lastResult = { error: "操作失败: " + e };
      CFW.renderLists();
    }
  }

  async function saveWhitelistConfig() {
    const tencentIps = extractIps(CFW.$("#tencentWhitelistIps")?.value || "");
    const companyIps = extractIps(CFW.$("#companyWhitelistIps")?.value || "");
    const total = new Set([...tencentIps, ...companyIps]).size;
    if (!confirm(`确认保存默认白名单配置？合计 ${total} 个去重 IP，后续实时研判会直接使用。`)) return;
    lastResult = { status: "正在保存默认白名单..." };
    CFW.renderLists();
    try {
      const res = await fetch("/api/agent/whitelist", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          tencent_scan_ips: tencentIps,
          company_scan_ips: companyIps,
        })
      });
      lastResult = await res.json();
      pushActionLog("保存默认白名单", `合计 ${total} 个去重 IP`);
      if (CFW.loadData) await CFW.loadData(CFW.state.days);
      activePane = "whitelist";
      CFW.renderLists();
    } catch (e) {
      lastResult = { error: "保存失败: " + e };
      CFW.renderLists();
    }
  }

  function importWhitelistCandidates() {
    const cfg = CFW.DEMO.whitelistConfig || {};
    const candidates = Array.isArray(cfg.candidates) ? cfg.candidates : [];
    const tencentBox = CFW.$("#tencentWhitelistIps");
    const companyBox = CFW.$("#companyWhitelistIps");
    const append = (box, ips) => {
      if (!box || !ips.length) return;
      const current = extractIps(box.value);
      box.value = Array.from(new Set([...current, ...ips])).join("\n");
    };
    append(tencentBox, candidates.filter(c => c.target === "tencent_scan_ips").map(c => c.ip));
    append(companyBox, candidates.filter(c => c.target !== "tencent_scan_ips").map(c => c.ip));
    lastResult = { status: "历史候选已填入，请确认后保存默认白名单。" };
    CFW.renderLists();
  }

  function ruleRow(rule) {
    const meta = describeRule(rule);
    const encoded = encodeURIComponent(rule.rule_id || "");
    return `<tr>
      <td><span class="tag">${esc(rule.status || "draft")}</span></td>
      <td>${esc(meta.kind)}</td>
      <td class="mono small">${esc(meta.target)}</td>
      <td>${esc(meta.action)}</td>
      <td>${esc(syncStatus(rule))}</td>
      <td class="mono mut">${esc(rule.expires_at || "长期")}</td>
      <td>${esc(sourceText(rule))}</td>
      <td>${ruleButtons(rule, encoded)}</td>
    </tr>`;
  }

  function ruleButtons(rule, encoded) {
    if (!rule.rule_id) return "";
    if (rule.system || rule.readonly) return `<span class="tag">系统配置</span>`;
    if (rule.status === "active") {
      return `<button class="btn tiny" data-rule-action="disable" data-rule-id="${encoded}">禁用</button>`;
    }
    return `<button class="btn tiny" data-rule-action="activate" data-rule-id="${encoded}">生效</button>`;
  }

  function describeRule(rule) {
    const action = String(rule?.action || "");
    const type = String(rule?.type || "");
    const target = ruleTarget(rule);
    if (action === "block_ip" || type === "ip_blocklist") {
      return { kind: "攻击源黑名单", tone: "danger", target, action: "人工封禁登记", summary: `登记封禁来源 ${target}` };
    }
    if (action === "allow_scanner_ip" || type === "scanner_whitelist") {
      return { kind: "扫描源白名单", tone: "ok", target, action: "标记扫描源", summary: `受控扫描源 ${target}` };
    }
    if (action === "skip_llm_and_omit") {
      return { kind: "业务误报白名单", tone: "ok", target, action: "跳过研判并忽略", summary: `命中后自动按误报处理 ${target}` };
    }
    if (action === "omit_once") {
      return { kind: "单次忽略", tone: "warn", target, action: "仅忽略本次", summary: `仅处理单条告警 ${target}` };
    }
    return { kind: "自定义规则", tone: "neutral", target, action: action || "-", summary: target || "未指定匹配对象" };
  }

  function ruleTarget(rule) {
    const match = rule?.match || {};
    const ips = blockIps(rule);
    if (ips.length) return ips.join(", ");
    if (match.src_ip) return match.src_ip;
    if (match.source_alert_id) return "事件 " + match.source_alert_id;
    if (match.alert_id) return "告警 " + match.alert_id;
    const compact = Object.entries(match).filter(([, v]) => v).map(([k, v]) => `${k}=${Array.isArray(v) ? v.join("|") : v}`);
    return compact.join(", ") || "未指定";
  }

  function sourceText(rule) {
    const text = String(rule?.source_text || "");
    return text.length > 44 ? text.slice(0, 44) + "..." : text;
  }

  function syncStatus(rule) {
    if (rule?.action !== "block_ip") return "不需要";
    const res = rule?._tencent_block_result || {};
    return res.status || (rule.status === "active" ? "待人工确认" : "未生效");
  }

  function persistedDraft(draft) {
    const out = Object.assign({}, draft || {});
    delete out._ui_source;
    return out;
  }

  function blockIps(rule) {
    const match = rule?.match || {};
    const ips = rule?.ips || match.src_ips || [];
    return Array.isArray(ips) ? ips : [];
  }

  function extractIps(text) {
    const seen = new Set();
    const ips = [];
    String(text || "").replace(/\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b/g, ip => {
      if (!seen.has(ip)) {
        seen.add(ip);
        ips.push(ip);
      }
      return ip;
    });
    return ips;
  }

  function ruleStats(rules) {
    return rules.reduce((acc, rule) => {
      if (rule.status === "active") acc.active++;
      if (rule.action === "block_ip" || rule.type === "ip_blocklist") acc.block++;
      else if (rule.action === "allow_scanner_ip" || rule.type === "scanner_whitelist") acc.allow++;
      else if (rule.action === "skip_llm_and_omit" || rule.action === "omit_once") acc.suppress++;
      if (rule.system || rule.readonly) acc.system++;
      return acc;
    }, { active: 0, block: 0, allow: 0, suppress: 0, system: 0 });
  }

  function formatDateTime(d) {
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function loadActionLogs() {
    try {
      const rows = JSON.parse(localStorage.getItem(LOG_KEY) || "[]");
      return Array.isArray(rows) ? rows : [];
    } catch {
      return [];
    }
  }

  function pushActionLog(title, summary) {
    const rows = loadActionLogs();
    rows.unshift({ title, summary, time: formatDateTime(new Date()) });
    localStorage.setItem(LOG_KEY, JSON.stringify(rows.slice(0, 50)));
  }
})();

</script>
<script data-source="view-agent.js">

(function () {

  let newProviderTemplate = "deepseek_fast";

  let configResult = null;
  let selectedAlertId = "";

  CFW.renderAgent = function () {
    const root = CFW.$("#view-agent");
    const agent = CFW.DEMO.agent || {};
    const settings = agent.llm_settings || {};
    const routing = agent.model_routing || {};
    const routes = settings.routing || routing.routes || {};
    const providers = settings.providers || routing.providers || {};
    const health = agent.provider_health || {};

    root.innerHTML = `
      <div class="grid mt" style="grid-template-columns:1.15fr .85fr">

          <h2>模型路由 <span class="hint">每个阶段可独立选择订阅或 API Provider</span></h2>

        <div class="panel">

    const alertInput = CFW.$("#agentAlertId", root);
    if (alertInput) alertInput.addEventListener("input", () => { selectedAlertId = alertInput.value.trim(); });
    const saveGlobal = CFW.$("#saveLlmGlobalBtn", root);

      selectAlert(decodeURIComponent(b.dataset.alertPreview || ""));
