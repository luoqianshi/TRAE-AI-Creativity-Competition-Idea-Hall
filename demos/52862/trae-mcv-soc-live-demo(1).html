<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCV SOC 基地车 · 脱敏 Demo</title>
<link rel="icon" href="data:,">
<style>
/* ============================================================
   CFW 安全运营中心 - Light audit console skin
   ============================================================ */

:root {
  --background: #ffffff;
  --foreground: #0e1115;
  --card: #ffffff;
  --popover: #f9f9fa;

  --primary: #0065fd;
  --primary-deep: #0057da;
  --primary-soft: #e5e9ff;
  --accent: #d4daff;
  --accent-foreground: #00266b;

  --secondary: #eff1f4;
  --secondary-foreground: #333942;
  --muted: #eff1f4;
  --muted-foreground: #7f8d9f;
  --line: #e7eaef;
  --line-bright: #cdd5e1;
  --input: #e7eaef;
  --ring: #557fff;

  --danger: #ef4444;
  --danger-dim: #fee2e2;
  --warn: #d97706;
  --warn-dim: #fef3c7;
  --ok: #059669;
  --ok-dim: #d1fae5;
  --violet: #7c3aed;
  --violet-dim: #ede9fe;

  --sidebar: #eff1f4;
  --sidebar-foreground: #0e1115;
  --sidebar-accent: #d4daff;
  --sidebar-border: #e7eaef;

  /* Compatibility aliases for older view fragments. */
  --bg: var(--background);
  --surface-1: var(--card);
  --surface-2: #f8fafc;
  --surface-3: var(--muted);
  --text: var(--foreground);
  --text-dim: var(--secondary-foreground);
  --text-faint: var(--muted-foreground);

  --r-sm: 8px;
  --r: 10px;
  --r-lg: 12px;

  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --sans: Inter, "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html,
body {
  height: 100%;
}

body {
  background: var(--background);
  color: var(--foreground);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  letter-spacing: 0;
}

button,
input,
select,
textarea {
  font: inherit;
}

.mono { font-family: var(--mono); }
.tnum { font-variant-numeric: tabular-nums; }

/* ============================================================
   App shell
   ============================================================ */
.app {
  height: 100vh;
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  overflow: hidden;
  background: var(--background);
}

.side {
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--sidebar);
  border-right: 1px solid var(--sidebar-border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 16px 16px 12px;
}

.brand .mark {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  background: var(--primary);
  color: #ffffff;
}

.brand .mark svg {
  width: 18px;
  height: 18px;
}

.brand .name {
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--sidebar-foreground);
  font-size: 14px;
  font-weight: 600;
}

.brand .sub {
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 1px;
  color: var(--muted-foreground);
  font-size: 11px;
}

.nav {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 4px 10px 12px;
  overflow-y: auto;
}

.nav .lbl {
  padding: 13px 11px 5px;
  color: var(--muted-foreground);
  font-size: 11px;
  font-weight: 600;
}

.nav-item {
  min-height: 38px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 11px;
  border: 0;
  border-radius: 10px;
  color: var(--sidebar-foreground);
  background: transparent;
  cursor: pointer;
  user-select: none;
  transition: background 140ms ease, color 140ms ease;
}

.nav-item svg {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
  color: color-mix(in srgb, var(--foreground) 72%, var(--muted-foreground));
}

.nav-item .t {
  min-width: 0;
  flex: 1 1 auto;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 14px;
  line-height: 1.2;
}

.nav-item .badge {
  min-width: 22px;
  margin-left: auto;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--danger);
  color: #ffffff;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  text-align: center;
}

.nav-item:hover {
  background: color-mix(in srgb, var(--sidebar-accent) 38%, transparent);
}

.nav-item.active {
  background: var(--sidebar-accent);
  color: var(--accent-foreground);
  font-weight: 600;
}

.nav-item.active svg {
  color: var(--primary);
}

.side-foot {
  display: grid;
  gap: 7px;
  padding: 10px 12px;
  border-top: 1px solid var(--sidebar-border);
  color: var(--muted-foreground);
  font-size: 11.5px;
}

.side-foot .row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: 0 0 auto;
}

.dot.live {
  background: var(--ok);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 35%, transparent);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 35%, transparent); }
  70% { box-shadow: 0 0 0 7px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}

.main {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--background);
}

.topbar {
  height: 52px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  background: var(--background);
}

.topbar h1 {
  max-width: 360px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--foreground);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;
}

.topbar .crumb {
  max-width: 540px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 1px;
  color: var(--muted-foreground);
  font-size: 12px;
  line-height: 1.3;
}

.spacer { flex: 1 1 auto; }

.demo-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 28px;
  padding: 0 10px;
  border: 1px solid color-mix(in srgb, var(--warn) 26%, var(--line));
  border-radius: 999px;
  background: var(--warn-dim);
  color: var(--warn);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.demo-badge::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.segmented {
  display: inline-flex;
  align-items: center;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--background);
}

.segmented button {
  min-height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted-foreground);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: background 140ms ease, color 140ms ease;
}

.segmented button.active {
  background: var(--primary);
  color: #ffffff;
}

.clock {
  color: var(--primary);
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.25;
}

.updated {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted-foreground);
  font-size: 11px;
}

.content {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 20px;
  background: var(--background);
}

.content::-webkit-scrollbar,
.nav::-webkit-scrollbar,
.scroll-y::-webkit-scrollbar,
.draft-box::-webkit-scrollbar,
.report-alert-list::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

.content::-webkit-scrollbar-thumb,
.nav::-webkit-scrollbar-thumb,
.scroll-y::-webkit-scrollbar-thumb,
.draft-box::-webkit-scrollbar-thumb,
.report-alert-list::-webkit-scrollbar-thumb {
  border-radius: 8px;
  background: #cbd5e1;
}

.view {
  display: none;
  opacity: 0;
}

.view.active {
  display: block;
  opacity: 1;
}

/* ============================================================
   Layout primitives
   ============================================================ */
.grid { display: grid; gap: 16px; }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.span-2 { grid-column: span 2; }
.span-3 { grid-column: span 3; }
.mt { margin-top: 16px; }

.panel {
  position: relative;
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--card);
  box-shadow: none;
}

.panel > h2 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  color: var(--foreground);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
}

.panel > h2 .hint,
.hint {
  margin-left: auto;
  color: var(--muted-foreground);
  font-size: 12px;
  font-weight: 400;
}

.panel .accent-top {
  display: none;
}

/* ============================================================
   KPI cards
   ============================================================ */
.kpi {
  position: relative;
  min-height: 96px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--card);
}

.kpi .k-label {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted-foreground);
  font-size: 11.5px;
}

.kpi .k-icon {
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  color: var(--muted-foreground);
}

.kpi .k-icon svg {
  width: 16px;
  height: 16px;
}

.kpi .k-num {
  color: var(--foreground);
  font-size: 28px;
  font-weight: 650;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

.kpi .k-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: auto;
  color: var(--muted-foreground);
  font-size: 12px;
}

.kpi .spark {
  position: absolute;
  right: 12px;
  bottom: 10px;
  opacity: .65;
}

.tone-primary .k-icon,
.tone-primary .k-num { color: var(--primary); }
.tone-ok .k-icon,
.tone-ok .k-num { color: var(--ok); }
.tone-warn .k-icon,
.tone-warn .k-num { color: var(--warn); }
.tone-danger .k-icon,
.tone-danger .k-num { color: var(--danger); }

.kpi.alarm {
  border-color: color-mix(in srgb, var(--danger) 30%, var(--line));
  background: color-mix(in srgb, var(--danger) 5%, var(--card));
}

.kpi.alarm .k-num {
  animation: blink 1.8s infinite;
}

@keyframes blink { 50% { opacity: .55; } }

.delta {
  padding: 1px 6px;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
}

.delta.up {
  background: var(--danger-dim);
  color: var(--danger);
}

.delta.down {
  background: var(--ok-dim);
  color: var(--ok);
}

.delta.flat {
  background: var(--muted);
  color: var(--muted-foreground);
}

/* ============================================================
   Tables and badges
   ============================================================ */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th,
td {
  padding: 7px 12px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: middle;
}

th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--muted);
  color: var(--muted-foreground);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0;
  white-space: nowrap;
}

tbody tr {
  transition: background 120ms ease;
}

tr.click { cursor: pointer; }

tbody tr:hover,
tr.click:hover {
  background: #f8fafc;
}

td.r,
th.r {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.scroll-y {
  max-height: 320px;
  overflow-y: auto;
}

.tag {
  display: inline-flex;
  align-items: center;
  min-height: 20px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--muted);
  color: var(--muted-foreground);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.2;
  white-space: nowrap;
}

.tag-高危,
.tag-critical {
  background: var(--danger);
  color: #ffffff;
}

.tag-中危,
.tag-mid {
  background: var(--primary-soft);
  color: var(--accent-foreground);
}

.tag-低危,
.tag-low {
  background: var(--muted);
  color: var(--muted-foreground);
}

.res {
  font-weight: 600;
}

.res-确认成功 {
  color: var(--danger);
}

.res-需人工复核 {
  color: var(--warn);
}

.res-扫描探测,
.res-转发重复告警,
.res-未见成功证据,
.res-确认未成功 {
  color: var(--secondary-foreground);
  font-weight: 500;
}

.src-pill {
  display: inline-flex;
  align-items: center;
  min-height: 20px;
  padding: 2px 7px;
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 11px;
  white-space: nowrap;
}

.src-单轮 {
  background: var(--muted);
  color: var(--muted-foreground);
}

.src-源包复核 {
  background: var(--primary-soft);
  color: var(--primary);
}

.src-Agent {
  background: var(--violet-dim);
  color: var(--violet);
}

.src-待模型重试 {
  background: var(--warn-dim);
  color: var(--warn);
}

.src-白名单规则,
.src-custom_rule {
  background: var(--ok-dim);
  color: var(--ok);
}

.net-pub { color: var(--danger); }
.net-pri { color: var(--primary); }
.mut { color: var(--muted-foreground); }
.dim { color: var(--secondary-foreground); }
.flex { display: flex; align-items: center; gap: 8px; }
.between { justify-content: space-between; }
.wrap-chips { display: flex; flex-wrap: wrap; gap: 6px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--card);
  color: var(--secondary-foreground);
  font-size: 12px;
}

.chip .x {
  color: var(--muted-foreground);
  font-family: var(--mono);
  font-size: 11px;
}

.chip.atk {
  color: var(--danger);
  font-family: var(--mono);
}

/* ============================================================
   Live ticker / chart helpers / details
   ============================================================ */
.ticker {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.tick-row {
  display: grid;
  grid-template-columns: 64px 56px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
}

.tick-row .ts {
  color: var(--muted-foreground);
  font-family: var(--mono);
  font-size: 11.5px;
}

.chart-box {
  position: relative;
  height: 220px;
}

.chart-box.sm { height: 180px; }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 10px;
  color: var(--secondary-foreground);
  font-size: 12px;
}

.legend i {
  width: 10px;
  height: 10px;
  display: inline-block;
  margin-right: 6px;
  border-radius: 3px;
  vertical-align: middle;
}

.hrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}

.hrow:last-child { border-bottom: 0; }

.hrow .hl {
  color: var(--secondary-foreground);
  font-size: 12.5px;
}

.hrow .hv {
  color: var(--foreground);
  font-family: var(--mono);
  font-weight: 600;
}

.meter {
  height: 6px;
  margin-top: 6px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--muted);
}

.meter > span {
  display: block;
  height: 100%;
  border-radius: 999px;
}

.empty {
  padding: 34px 10px;
  color: var(--muted-foreground);
  text-align: center;
}

.empty .big {
  margin-bottom: 4px;
  color: var(--ok);
  font-size: 15px;
  font-weight: 600;
}

.detail {
  margin: 0 0 4px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: #f8fafc;
  color: var(--secondary-foreground);
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.detail .dl { color: var(--primary); }
.detail .ev { color: var(--warn); }

/* ============================================================
   Responsive shell
   ============================================================ */
@media (max-width: 900px) {
  .app {
    grid-template-columns: 1fr;
    overflow: auto;
  }

  .side {
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .brand {
    padding: 12px 14px 8px;
  }

  .nav {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
    padding: 8px;
    overflow: visible;
  }

  .nav .lbl {
    grid-column: 1 / -1;
    padding: 8px 8px 2px;
  }

  .nav-item {
    min-width: 0;
  }

  .side-foot {
    display: none;
  }

  .main {
    min-height: 0;
  }

  .topbar {
    height: auto;
    min-height: 64px;
    flex-wrap: wrap;
    align-items: flex-start;
    padding: 12px 14px;
  }

  .topbar h1,
  .topbar .crumb {
    max-width: none;
    white-space: normal;
  }

  .spacer {
    display: none;
  }

  .segmented {
    width: 100%;
    order: 3;
  }

  .segmented button {
    flex: 1 1 0;
  }

  .content {
    overflow: visible;
    padding: 14px 12px 28px;
  }

  .g-4,
  .g-3,
  .g-2 {
    grid-template-columns: 1fr;
  }

  .span-2,
  .span-3 {
    grid-column: auto;
  }

  .panel {
    padding: 14px 12px;
    overflow-x: auto;
  }

  .panel > h2 {
    flex-wrap: wrap;
    align-items: flex-start;
  }

  .panel > h2 .hint,
  .hint {
    width: 100%;
    margin-left: 0;
  }

  .kpi {
    min-height: 88px;
  }

  .kpi .k-num {
    font-size: 26px;
  }

  .tick-row {
    grid-template-columns: 54px 48px minmax(0, 1fr);
  }

  .tick-row > :last-child {
    grid-column: 3;
  }

  table {
    min-width: 620px;
  }
}

/* ============================================================
   View-level components - light audit console skin
   ============================================================ */

/* ---- workflow stepper ---- */
.wf {
  display: flex;
  align-items: stretch;
  gap: 0;
  flex-wrap: wrap;
}

.wf-step {
  flex: 1 1 0;
  min-width: 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--card);
  text-align: center;
}

.wf-ic {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--primary-soft);
  color: var(--primary);
}

.wf-ic svg {
  width: 21px;
  height: 21px;
}

.wf-t {
  color: var(--foreground);
  font-size: 13.5px;
  font-weight: 600;
}

.wf-d {
  color: var(--muted-foreground);
  font-size: 11.5px;
  line-height: 1.45;
}

.wf-arrow {
  position: relative;
  flex: 0 0 30px;
  display: grid;
  place-items: center;
}

.wf-arrow .flow {
  position: relative;
  width: 22px;
  height: 2px;
  border-radius: 2px;
  background: var(--line-bright);
}

.wf-arrow .flow::before {
  content: "";
  position: absolute;
  top: -2.5px;
  left: 0;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--primary);
  animation: flowdot 2.4s linear infinite;
}

@keyframes flowdot {
  0% { left: -4px; opacity: 0; }
  15% { opacity: 1; }
  85% { opacity: 1; }
  100% { left: 20px; opacity: 0; }
}

@media (max-width: 1100px) {
  .wf-arrow {
    flex-basis: 100%;
    height: 14px;
    transform: rotate(90deg);
  }
}

/* ---- intake and funnel ---- */
.intake {
  display: flex;
  align-items: stretch;
  gap: 0;
  margin-bottom: 18px;
}

.intake-cell {
  flex: 1;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--card);
}

.intake-n {
  color: var(--primary);
  font-size: 24px;
  font-weight: 700;
}

.intake-l {
  margin-top: 2px;
  color: var(--foreground);
  font-size: 13px;
  font-weight: 600;
}

.intake-note {
  margin-top: 3px;
  color: var(--muted-foreground);
  font-size: 11px;
  line-height: 1.4;
}

.intake-sep {
  position: relative;
  flex: 0 0 76px;
  display: grid;
  place-items: center;
  color: var(--muted-foreground);
  font-size: 10.5px;
}

.intake-sep::after {
  content: ">";
  position: absolute;
  top: 6px;
  color: var(--line-bright);
  font-size: 16px;
}

.funnel {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.fn-row {
  display: flex;
  align-items: center;
  gap: 16px;
}

.fn-bar {
  flex: 0 0 auto;
  min-width: 64px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 12px;
  border: 1px solid color-mix(in srgb, var(--c) 44%, var(--line));
  border-radius: 8px;
  background: color-mix(in srgb, var(--c) 16%, #ffffff);
  transition: width .8s cubic-bezier(.2, .7, .2, 1);
}

.fn-n {
  color: var(--c);
  font-size: 15px;
  font-weight: 700;
}

.fn-meta {
  flex: 1 1 auto;
}

.fn-label {
  color: var(--foreground);
  font-size: 13.5px;
  font-weight: 600;
}

.fn-note {
  margin-top: 1px;
  color: var(--muted-foreground);
  font-size: 11.5px;
}

.why-big {
  margin-bottom: 14px;
  padding: 6px 0 14px;
  border-bottom: 1px solid var(--line);
  text-align: center;
}

.why-num {
  color: var(--ok);
  font-size: 52px;
  font-weight: 800;
  line-height: 1;
}

.why-num span {
  font-size: 24px;
}

.why-cap {
  margin-top: 8px;
  color: var(--secondary-foreground);
  font-size: 12.5px;
  line-height: 1.6;
}

/* ---- Agent assistant ---- */
.assistant-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}

.assistant-main {
  min-height: calc(100vh - 132px);
  max-width: 1120px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.assistant-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}

.assistant-mode {
  flex: 0 0 auto;
  padding: 5px 9px;
  border: 1px solid color-mix(in srgb, var(--ok) 34%, var(--line));
  border-radius: 999px;
  background: color-mix(in srgb, var(--ok) 9%, #fff);
  color: var(--ok);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0;
}

.assistant-chat {
  flex: 1 1 auto;
  min-height: 460px;
  max-height: calc(100vh - 290px);
  overflow: auto;
  padding: 16px 2px 14px;
}

.assistant-welcome {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr);
  gap: 14px;
  max-width: 760px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--card);
}

.assistant-orb,
.msg-avatar {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--primary-soft);
  color: var(--primary);
}

.assistant-orb {
  width: 48px;
  height: 48px;
}

.assistant-orb svg,
.msg-avatar svg {
  width: 21px;
  height: 21px;
}

.assistant-welcome h2 {
  margin: 0 0 6px;
}

.assistant-welcome p {
  margin: 0;
  color: var(--muted-foreground);
  line-height: 1.65;
}

.assistant-starters,
.assistant-hints,
.assistant-suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.assistant-starters {
  margin-top: 14px;
}

.chip {
  min-height: 28px;
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  color: var(--secondary-foreground);
  font-size: 12px;
  cursor: pointer;
}

.chip:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.chip.primary {
  background: var(--primary-soft);
  border-color: color-mix(in srgb, var(--primary) 34%, var(--line));
  color: var(--primary);
}

.msg {
  display: flex;
  gap: 10px;
  margin: 0 0 14px;
}

.msg.user {
  justify-content: flex-end;
}

.msg.user .msg-body {
  max-width: 760px;
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.msg.assistant .msg-body {
  max-width: 860px;
}

.msg-body {
  min-width: 0;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: #fff;
}

.msg.is-error .msg-body {
  border-color: color-mix(in srgb, var(--danger) 34%, var(--line));
  background: color-mix(in srgb, var(--danger) 6%, #fff);
}

.msg-meta {
  margin-bottom: 6px;
  color: var(--muted-foreground);
  font-size: 11px;
}

.msg.user .msg-meta {
  color: rgba(255, 255, 255, .72);
}

.msg-text {
  font-size: 13.5px;
  line-height: 1.7;
}

.msg-text code {
  padding: 1px 5px;
  border-radius: 5px;
  background: rgba(0, 0, 0, .06);
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
}

.msg.user .msg-text code {
  background: rgba(255, 255, 255, .18);
}

.assistant-loading {
  display: flex;
  gap: 5px;
  align-items: center;
  height: 24px;
}

.assistant-loading span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--primary);
  animation: assistantPulse 1s infinite ease-in-out;
}

.assistant-loading span:nth-child(2) { animation-delay: .14s; }
.assistant-loading span:nth-child(3) { animation-delay: .28s; }

@keyframes assistantPulse {
  0%, 100% { transform: translateY(0); opacity: .35; }
  50% { transform: translateY(-4px); opacity: 1; }
}

.inline-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

.assistant-trace {
  margin-top: 10px;
}

.assistant-trace summary {
  cursor: pointer;
  color: var(--muted-foreground);
  font-size: 12px;
}

.tool-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  padding: 5px 7px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--muted);
  color: var(--secondary-foreground);
  font-size: 11px;
}

.tool-chip b {
  color: var(--foreground);
  font-size: 10.5px;
}

.tool-chip em {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-style: normal;
}

.tool-chip i {
  color: var(--muted-foreground);
  font-style: normal;
}

.tool-chip.ok {
  border-color: color-mix(in srgb, var(--ok) 28%, var(--line));
  background: color-mix(in srgb, var(--ok) 7%, #fff);
}

.tool-chip.warn {
  border-color: color-mix(in srgb, var(--warn) 34%, var(--line));
  background: color-mix(in srgb, var(--warn) 8%, #fff);
}

.tool-chip.danger {
  border-color: color-mix(in srgb, var(--danger) 34%, var(--line));
  background: color-mix(in srgb, var(--danger) 8%, #fff);
}

.assistant-artifacts {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 12px;
}

.artifact {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--card);
}

.artifact-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  color: var(--foreground);
  font-size: 13px;
  font-weight: 700;
}

.artifact-title .hint {
  margin-left: auto;
  font-weight: 400;
}

.artifact-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.artifact-grid div,
.summary-mini div {
  min-width: 0;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fff;
}

.artifact-grid span,
.summary-mini span {
  display: block;
  margin-bottom: 3px;
  color: var(--muted-foreground);
  font-size: 11px;
}

.artifact-grid b,
.summary-mini b {
  display: block;
  min-width: 0;
  overflow-wrap: anywhere;
  color: var(--foreground);
  font-size: 12px;
  font-weight: 700;
}

.artifact-block {
  margin-top: 8px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fff;
}

.artifact-block b {
  display: block;
  margin-bottom: 4px;
  font-size: 11px;
}

.artifact-block span {
  display: block;
  color: var(--secondary-foreground);
  font-size: 12px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.artifact-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 9px;
}

.artifact-pills span {
  padding: 4px 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  color: var(--secondary-foreground);
  font-size: 11px;
}

.assistant-alert-list {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 7px;
  overflow: hidden;
}

.assistant-alert-row {
  display: grid;
  grid-template-columns: 82px 48px minmax(160px, 1fr) 130px 110px;
  gap: 8px;
  align-items: center;
  padding: 8px 9px;
  border-bottom: 1px solid var(--line);
  background: #fff;
  font-size: 12px;
}

.assistant-alert-list.compact .assistant-alert-row {
  grid-template-columns: 140px minmax(80px, 1fr) 70px;
}

.assistant-alert-row:last-child {
  border-bottom: 0;
}

.assistant-alert-row span,
.assistant-alert-row i {
  color: var(--muted-foreground);
  font-style: normal;
}

.assistant-alert-row em {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--foreground);
  font-style: normal;
}

.assistant-alert-row strong {
  color: var(--secondary-foreground);
}

.summary-mini {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.hunt-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 10px;
}

.hunt-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fff;
}

.hunt-row b,
.hunt-row span {
  display: block;
}

.hunt-row b {
  color: var(--foreground);
  font-size: 12.5px;
}

.hunt-row span {
  margin-top: 3px;
  color: var(--muted-foreground);
  font-size: 11.5px;
  line-height: 1.45;
}

.hunt-row em {
  flex: 0 0 auto;
  align-self: flex-start;
  padding: 3px 7px;
  border-radius: 999px;
  background: var(--muted);
  color: var(--secondary-foreground);
  font-style: normal;
  font-size: 11px;
  font-weight: 700;
}

.hunt-row.critical em,
.hunt-row.high em {
  background: var(--danger-dim);
  color: var(--danger);
}

.hunt-row.medium em {
  background: var(--warn-dim);
  color: var(--warn);
}

.artifact-json {
  margin-top: 10px;
}

.artifact-json summary {
  cursor: pointer;
  color: var(--muted-foreground);
  font-size: 12px;
}

.artifact-json pre {
  max-height: 260px;
  overflow: auto;
  margin: 8px 0 0;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fff;
  color: var(--secondary-foreground);
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  line-height: 1.5;
}

.assistant-suggestions {
  margin-top: 12px;
}

.assistant-composer {
  flex: 0 0 auto;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

.assistant-composer textarea {
  width: 100%;
  min-height: 74px;
  max-height: 160px;
  resize: vertical;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: #fff;
  color: var(--foreground);
  font: 13px/1.55 inherit;
  outline: none;
}

.assistant-composer textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}

.assistant-compose-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 10px;
}

.assistant-hints {
  min-width: 0;
}

@media (max-width: 1180px) {
  .assistant-layout {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 820px) {
  .assistant-layout {
    display: block;
  }

  .assistant-chat {
    max-height: none;
  }

  .assistant-compose-actions {
    align-items: stretch;
    flex-direction: column;
  }

  .assistant-compose-actions .btn {
    width: 100%;
  }

  .artifact-grid,
  .summary-mini {
    grid-template-columns: 1fr;
  }

  .assistant-alert-row {
    grid-template-columns: 68px 42px minmax(0, 1fr);
  }

  .assistant-alert-row i,
  .assistant-alert-row strong {
    display: none;
  }
}

.why-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.why-i {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  font-size: 13px;
}

.why-i .dot {
  width: 9px;
  height: 9px;
  margin-top: 5px;
}

.why-i b {
  color: var(--foreground);
  font-size: 13px;
}

.why-i .mut {
  margin-top: 2px;
  font-size: 11.5px;
  line-height: 1.5;
}

.safety h2 {
  color: var(--foreground);
}

.bullets {
  display: flex;
  flex-direction: column;
  gap: 9px;
  list-style: none;
}

.bullets li {
  position: relative;
  padding-left: 16px;
  color: var(--secondary-foreground);
  font-size: 12.5px;
  line-height: 1.5;
}

.bullets li::before {
  content: "";
  position: absolute;
  top: 7px;
  left: 0;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--line-bright);
}

/* ---- realtime pipeline ---- */
.pipe-kpis .kpi {
  min-height: 98px;
}

.pipe-k-num {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 24px;
  line-height: 1.16;
}

.pipe-map {
  overflow: hidden;
}

.pipe-stage-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
}

.pipe-stage {
  min-width: 0;
  min-height: 132px;
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  border-top: 3px solid var(--stage);
  border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--stage) 5%, var(--card));
}

.pipe-stage-icon {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: color-mix(in srgb, var(--stage) 12%, #ffffff);
  color: var(--stage);
}

.pipe-stage-icon svg {
  width: 18px;
  height: 18px;
}

.pipe-stage-body {
  min-width: 0;
}

.pipe-stage-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.pipe-stage-top span {
  color: var(--foreground);
  font-size: 13px;
  font-weight: 600;
}

.pipe-stage-top b {
  color: var(--stage);
  font-size: 20px;
}

.pipe-stage-label {
  margin-top: 7px;
  color: var(--secondary-foreground);
  font-size: 12px;
  line-height: 1.45;
}

.pipe-stage-meta {
  margin-top: 5px;
  overflow-wrap: anywhere;
  color: var(--muted-foreground);
  font-size: 11px;
  line-height: 1.4;
}

.pipe-main {
  grid-template-columns: minmax(0, 1.18fr) minmax(320px, .82fr);
}

.pipe-round-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.pipe-kv {
  min-width: 0;
  padding: 8px 2px 10px;
  border-bottom: 1px solid var(--line);
}

.pipe-kv span,
.pipe-mini-title {
  display: block;
  color: var(--muted-foreground);
  font-size: 11px;
  letter-spacing: 0;
}

.pipe-kv b {
  display: block;
  margin-top: 4px;
  overflow-wrap: anywhere;
  color: var(--foreground);
  font-size: 12.5px;
  font-weight: 600;
}

.pipe-wide {
  grid-column: 1 / -1;
  padding-top: 8px;
}

.pipe-status-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-top: 8px;
}

.pipe-chip {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  max-width: 100%;
  padding: 2px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.35;
  white-space: nowrap;
}

.pipe-chip.primary {
  border-color: color-mix(in srgb, var(--primary) 24%, var(--line));
  background: var(--primary-soft);
  color: var(--primary);
}

.pipe-chip.ok {
  border-color: color-mix(in srgb, var(--ok) 26%, var(--line));
  background: var(--ok-dim);
  color: var(--ok);
}

.pipe-chip.warn {
  border-color: color-mix(in srgb, var(--warn) 26%, var(--line));
  background: var(--warn-dim);
  color: var(--warn);
}

.pipe-chip.danger {
  border-color: color-mix(in srgb, var(--danger) 26%, var(--line));
  background: var(--danger-dim);
  color: var(--danger);
}

.pipe-flow-block {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.pipe-meter-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: var(--secondary-foreground);
  font-size: 12.5px;
}

.pipe-meter-top b {
  color: var(--foreground);
  font-size: 11.5px;
  white-space: nowrap;
}

.pipe-meter-track {
  height: 8px;
  overflow: hidden;
  margin-top: 6px;
  border-radius: 999px;
  background: var(--muted);
}

.pipe-meter-track span {
  display: block;
  height: 100%;
  border-radius: 999px;
}

.pipe-round-scroll {
  max-height: 280px;
}

.pipe-guard {
  display: flex;
  flex-direction: column;
}

.pipe-guard-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}

.pipe-guard-row b {
  display: block;
  color: var(--foreground);
  font-size: 12.5px;
}

.pipe-guard-row span:not(.pipe-chip) {
  display: block;
  margin-top: 2px;
  color: var(--muted-foreground);
  font-size: 11px;
}

.pipe-wecom {
  padding-top: 12px;
}

/* ---- triage filters and details ---- */
.filters,
.triage-filters {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.filters select {
  height: 32px;
  padding: 0 28px 0 10px;
  border: 1px solid var(--input);
  border-radius: 8px;
  background: var(--background);
  color: var(--foreground);
  font-size: 13px;
  cursor: pointer;
}

.route-editor select,
.classic-rule-grid select {
  width: 100%;
  height: 34px;
  padding: 0 28px 0 10px;
  border: 1px solid var(--input);
  border-radius: 8px;
  background: var(--background);
  color: var(--foreground);
  font-size: 13px;
  cursor: pointer;
}

.route-editor select:focus,

}

.triage-col-level { width: 5%; }
.triage-col-event { width: 17%; }

.triage-col-target { width: 22%; }
.triage-col-result { width: 8%; }
.triage-col-source { width: 8%; }
.triage-col-evidence { width: 16%; }
.triage-col-token { width: 6%; }

.triage-table th,
.triage-table td {

.triage-time,
.triage-level,
.triage-result,
.triage-source,
.triage-token {

.triage-event,

.triage-action-msg {

.detail-kv b {

.detail-section,

.triage-actions {

}

.triage-action-status.warn {
  color: var(--warn);
}

.triage-action-buttons {

}

}

}

.btn-ic {
  display: inline-flex;

  height: 14px;
}

.btn-ic svg {

  height: 14px;
}

.triage-action-note {
  margin-top: 7px;
  color: var(--muted-foreground);
  font-size: 12px;
}

.trace-chain {
  margin: 10px 0 12px;
  padding: 10px;

  border-radius: var(--r-sm);
  background: #eff6ff;
}

.trace-title,
.trace-action {
  display: flex;
  align-items: center;
  gap: 10px;

}

.trace-title b {

  font-weight: 650;
}

.trace-path {

}

.trace-node {

.trace-node span,
.trace-action span {

}

.trace-node b {

  color: var(--foreground);
  font-size: 12px;
  font-weight: 650;
}

.trace-node small {
  display: block;
  margin-top: 4px;
  overflow-wrap: anywhere;
  color: var(--muted-foreground);
  font-size: 11px;

.trace-arrow {

  color: var(--primary);

}

.trace-pub {

}

.trace-mid {
  border-color: #fed7aa;
}

.trace-dst {

}

.trace-action {

}

.trace-action b {
  overflow-wrap: anywhere;
}

.trace-action em {
  color: var(--muted-foreground);

  font-size: 11px;
}

.evidence-json {

  color: var(--secondary-foreground);

/* ---- attacker cards ---- */
.atk-wall {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.atk-card {
  padding: 18px 20px;

  border-radius: var(--r);

}

.atk-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
}

.atk-ip {
  color: var(--foreground);
  font-size: 17px;
  font-weight: 700;
}

.atk-sub {
  margin-top: 3px;

  font-size: 12px;
}

.atk-score {
  flex: 0 0 auto;
  text-align: right;
}

.as-num {

}

.as-num span {
  color: var(--muted-foreground);
  font-size: 13px;
  font-weight: 500;
}

.as-band {
  display: inline-block;

}

.atk-narr {
  margin: 14px 0;

}

.atk-lab {
  margin: 14px 0 8px;

}

.chain {

}

.chain-node {

  gap: 5px;
}

.cn-dot {
  width: 13px;

}

.chain-node.on .cn-dot {

}

.chain-node.cur .cn-dot {

}

  color: var(--c);

}

}

}

.atk-stats span {

}

.atk-stats b {

}

.atk-rec {
  margin-top: 14px;
  padding: 10px 13px;

  border-radius: var(--r-sm);
  background: #f8fafc;

  line-height: 1.55;
}

.atk-rec b {
  margin-right: 5px;
  color: var(--foreground);
}

.atk-foot {
  margin-top: 10px;

}

.provider-template {

.mini-card {

  padding: 8px 10px;
  overflow-wrap: anywhere;
  color: var(--muted-foreground);
  font-size: 11px;
}

.provider-actions {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.config-result {
  min-height: 150px;
  max-height: 260px;
}

.block-cloud-panel {
  margin-top: 12px;
  padding: 12px;
  border: 1px solid color-mix(in srgb, var(--danger) 22%, var(--line));
  border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--danger) 5%, #ffffff);
}

.block-cloud-panel b {
  color: var(--danger);
  font-size: 13px;
}

.block-result {
  min-height: 140px;
  max-height: 280px;
}

.preview-summary {
  min-height: 54px;
  margin-top: 12px;
}

.rule-shell-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 16px;
}

.rule-shell h2 {
  margin: 0 0 5px;
}

.rule-title,
.report-title {
  color: var(--foreground);
  font-size: 20px;
  font-weight: 700;
}

.rule-tabs,
.report-switch {
  display: inline-flex;
  align-items: center;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--background);
}

.rule-tabs.compact {
  align-self: flex-start;
  flex: 0 0 auto;
}

.rule-tabs.compact button {
  min-width: 86px;
}

.rule-tabs button,
.report-switch button {
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted-foreground);
  font-family: var(--sans);
  font-size: 12.5px;
  cursor: pointer;
  white-space: nowrap;
}

.rule-tabs button {
  padding: 7px 12px;
}

.report-switch button {
  min-width: 66px;
  padding: 7px 12px;
}

.rule-tabs button.active,
.report-switch button.active {
  background: var(--primary);
  color: #ffffff;
}

.rule-label {
  display: block;
  margin: 10px 0 5px;
  color: var(--muted-foreground);
  font-size: 11px;
}

.natural-input {
  min-height: 170px;
}

.result-box {
  min-height: 190px;
}

.draft-box {
  max-height: 360px;
  min-height: 190px;
  overflow: auto;
  margin-top: 12px;
  padding: 12px;
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.55;
  white-space: pre-wrap;
}

.preview-box {
  min-height: 260px;
}

/* ---- reports ---- */
.report-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 14px;
}

.report-head h2 {
  margin: 0 0 5px;
}

.report-main {
  grid-template-columns: minmax(0, 1.18fr) minmax(320px, .82fr);
}

.report-narrative {
  display: grid;
  gap: 8px;
  margin-bottom: 14px;
}

.report-narrative p {
  margin: 0;
  color: var(--secondary-foreground);
  font-size: 13px;
  line-height: 1.75;
}

.report-section-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.report-mini {
  min-width: 0;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: #f8fafc;
}

.report-mini span {
  display: block;
  color: var(--muted-foreground);
  font-size: 11px;
}

.report-mini b {
  display: block;
  margin-top: 5px;
  overflow-wrap: anywhere;
  color: var(--foreground);
  font-size: 12px;
  font-weight: 600;
}

.report-copy {
  min-height: 160px;
  margin-top: 12px;
  resize: vertical;
  padding: 10px 12px;
  font-size: 11.5px;
  line-height: 1.55;
}

.report-alert-list {
  display: grid;
  gap: 10px;
  max-height: 560px;
  overflow: auto;
}

.report-alert {
  display: grid;
  gap: 5px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--tone);
  border-radius: var(--r-sm);
  background: var(--card);
}

.report-alert.primary { --tone: var(--primary); }
.report-alert.warn { --tone: var(--warn); }
.report-alert.danger { --tone: var(--danger); }

.report-alert b {
  overflow-wrap: anywhere;
  color: var(--foreground);
  font-size: 12.5px;
}

.report-two-cols {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.report-subtitle {
  margin-bottom: 8px;
  color: var(--secondary-foreground);
  font-size: 12px;
  font-weight: 600;
}

.fw-roadmap {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.road-card {
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid color-mix(in srgb, var(--tone) 32%, var(--line));
  border-left: 3px solid var(--tone);
  border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--tone) 6%, var(--card));
}

.road-card.primary { --tone: var(--primary); }
.road-card.warn { --tone: var(--warn); }
.road-card.danger { --tone: var(--danger); }

.road-card b,
.road-card span {
  display: block;
  overflow-wrap: anywhere;
}

.road-card b {
  color: var(--foreground);
  font-size: 12.5px;
}

.road-card span {
  margin-top: 4px;
  color: var(--secondary-foreground);
  font-size: 11.5px;
  line-height: 1.55;
}

/* ---- responsive ---- */
@media (max-width: 1320px) {
  .pipe-stage-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 1240px) {
  .atk-wall {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 1200px) {
  .route-grid,
  .provider-grid,
  .report-main,
  .report-two-cols,
  .rule-workbench {
    grid-template-columns: 1fr;
  }

  .agent-preview-kpis,
  .detail-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .triage-search {
    min-width: 220px;
  }
}

@media (max-width: 1080px) {
  .pipe-main {
    grid-template-columns: 1fr;
  }

  .pipe-round-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 900px) {
  .view > .grid {
    grid-template-columns: 1fr !important;
  }

  .pipe-stage-grid,
  .pipe-round-grid,
  .report-head,
  .rule-shell-head,
  .report-section-grid,
  .fw-roadmap,
  .whitelist-config-grid,
  .classic-rule-grid,
  .route-form-grid,
  .provider-form {
    grid-template-columns: 1fr;
  }

  .rule-tabs,
  .report-switch {
    width: 100%;
  }

  .provider-template {
    max-width: none;
  }

  .quick-provider-grid {
    grid-template-columns: 1fr;
  }

  .tencent-auth-grid {
    grid-template-columns: 1fr;
  }

  .rule-tabs button,
  .report-switch button {
    flex: 1;
  }

  .rule-kpis,
  .agent-preview-kpis,
  .detail-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .trace-path {
    grid-template-columns: 1fr;
  }

  .trace-arrow {
    min-height: 12px;
    transform: rotate(90deg);
  }

  .rule-section-head {
    flex-direction: column;
    align-items: stretch;
  }

  .rule-preview-grid {
    grid-template-columns: 1fr;
  }

  .whitelist-candidates {
    align-items: stretch;
    flex-direction: column;
  }

  .atk-stats {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}


.demo-badge{background:#e8f1ff;color:#1057d6;border:1px solid #bdd3ff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700}.brand .name{letter-spacing:0}.report-copy{min-height:220px}.assistant-mode{white-space:nowrap}

      <div class="nav-item" data-view="attackers"><span data-ic="target"></span><span class="t">攻击者画像</span></div>

      <div class="nav-item" data-view="lists"><span data-ic="filter"></span><span class="t">自定义规则</span></div>

    <div class="side-foot">

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="topTitle">态势总览</h1>

      <div class="spacer"></div>
      <span class="demo-badge">脱敏 Demo</span>
      <div class="segmented" id="daySeg">
        <button class="active" data-d="1">今天</button>
        <button data-d="3">近 3 天</button>
        <button data-d="7">近 7 天</button>
      </div>
      <div style="text-align:right">
        <div class="clock" id="clock"></div>
        <div class="updated" id="updated"></div>
      </div>

    <main class="content">
      <section class="view active" id="view-overview"></section>
      <section class="view" id="view-triage"></section>
      <section class="view" id="view-attackers"></section>
      <section class="view" id="view-pipeline"></section>

      <section class="view" id="view-lists"></section>
      <section class="view" id="view-agent"></section>

    </main>
  </div>

CFW.esc = (s) => String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
CFW.fmt = (n) => (n || 0).toLocaleString("en-US");
CFW.el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

// 数字滚动动画（即时落定，避免截图捕捉到中间帧）
CFW.countUp = (node, target, dur = 900, fmt = CFW.fmt) => {
  const start = performance.now();
  const from = 0;
  node.textContent = fmt(target); // 先落定终值，截图任何时刻都正确
  function step(now) {
    const p = Math.min(1, (now - start) / dur);
    const e = 1 - Math.pow(1 - p, 3); // easeOutCubic
    node.textContent = fmt(Math.round(from + (target - from) * e));
    if (p < 1) requestAnimationFrame(step);
    else node.textContent = fmt(target);
  }
  requestAnimationFrame(step);
};

// 迷你 sparkline (SVG polyline)
CFW.sparkline = (data, w = 78, h = 30, color = "var(--primary)") => {
  const values = (data || []).map(Number).filter(Number.isFinite);
  if (values.length < 2) return "";
  const min = Math.min(...values), max = Math.max(...values), rng = max - min || 1;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - 3 - ((v - min) / rng) * (h - 6);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none">
    <polyline points="${pts}" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  </svg>`;
};

// Chart.js 通用网格配色
CFW.axis = (extra = {}) => Object.assign({
  ticks: { color: "#7f8d9f", font: { family: "JetBrains Mono", size: 10.5 } },
  grid: { color: "#e7eaef", drawBorder: false }
}, extra);
