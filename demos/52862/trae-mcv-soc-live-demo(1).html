  function routeCard(stage, name, provider, health) {
    const ok = health.ok === true;
    return `<div class="mini-card">
      <div class="flex between"><b>${esc(STAGE_LABELS[stage] || stage)}</b><span class="dot ${ok ? "live" : ""}"></span></div>
      <div class="mono route-name">${esc(name || "未配置")}</div>
      <div class="mut small">${esc(provider.type || "")} · ${esc(provider.model || "")}</div>
      <div class="mut small">${esc(provider.base_url || provider.url || provider.api_key_env || "")}</div>
      ${health.error ? `<div class="small" style="color:var(--warn)">${esc(health.error)}</div>` : ""}
    </div>`;
  }

  function routeEditor(stage, current, providerNames) {
    return `<label class="route-editor">
      <span>${esc(STAGE_LABELS[stage] || stage)}</span>
      <select data-route-stage="${esc(stage)}">
        ${providerNames.map(name => `<option value="${esc(name)}" ${name === current ? "selected" : ""}>${esc(name)}</option>`).join("")}
      </select>
    </label>`;
  }

  function tencentAuthPanel(auth) {
    const env = (auth.env || {}).keys || {};
    const profiles = Array.isArray(auth.credential_profiles) ? auth.credential_profiles.join(",") : "akonly,default";
    const sourceLabel = auth.source === "env" ? "AK/SK 环境变量" : (auth.source === "tccli" ? "tccli profile" : "未配置");
    const tccli = Array.isArray(auth.tccli_profiles) ? auth.tccli_profiles : [];
    return `<div class="tencent-auth-box">
      <div class="flex between">
        <div>
          <b>${auth.ready ? "鉴权可用" : "鉴权未就绪"}</b>
          <div class="mut small">当前来源: ${esc(sourceLabel)} · 密钥写入 ${esc((auth.env || {}).file || "服务器环境文件")}</div>
        </div>
        <span class="pill ${auth.ready ? "ok" : "warn"}">${auth.ready ? "READY" : "MISSING"}</span>
      </div>
      <div class="tencent-auth-grid">
        ${plainInput("Region", "tencentRegion", auth.region || "ap-shanghai")}
        ${plainInput("Endpoint", "tencentEndpoint", auth.endpoint || "cfw.tencentcloudapi.com")}
        ${plainInput("CLI Profiles", "tencentProfiles", profiles)}
        ${tencentSecret("SecretId", "TENCENTCLOUD_SECRET_ID", env)}
        ${tencentSecret("SecretKey", "TENCENTCLOUD_SECRET_KEY", env)}
        ${tencentSecret("Token(可选)", "TENCENTCLOUD_TOKEN", env)}
      </div>
      <div class="auth-profile-list">
        ${tccli.map(item => `<span class="profile-chip ${item.ready ? "ready" : ""}">${esc(item.name)} · ${item.ready ? "可用" : (item.exists ? "文件存在但未识别" : "无文件")}</span>`).join("")}
      </div>
      <div class="flex between mt-sm">
        <span class="hint">保存 AK/SK 后,告警拉取和源包取证会走这组凭证；封禁只登记人工对象，不自动调用腾讯云。</span>
        <button class="btn primary" id="saveTencentAuthBtn">保存腾讯云鉴权</button>
      </div>
    </div>`;
  }

  function newProviderPane(providers, envStatus) {
    const tpl = PROVIDER_TEMPLATES[newProviderTemplate] || PROVIDER_TEMPLATES.custom_openai;
    const nameTaken = !!providers[tpl.name];
    const modelOptions = newProviderModelOptions[newProviderTemplate] || [];
    const status = newProviderModelStatus[newProviderTemplate] || "";
    const needsKey = !!tpl.api_key_env;
    const isCustom = newProviderTemplate === "custom_openai";
    return `<div class="new-provider-box">
      <div class="flex between">
        <div>
          <b>新增 AI / API Provider</b>
          <div class="mut small">选择模板,填一条 API Key,获取模型列表后保存；Key 不进入 config.json。</div>
        </div>
        <select id="newProviderTemplate" class="agent-input provider-template">
          ${Object.entries(PROVIDER_TEMPLATES).map(([key, item]) => `<option value="${esc(key)}" ${key === newProviderTemplate ? "selected" : ""}>${esc(item.label)}</option>`).join("")}
        </select>
      </div>
      <div class="quick-provider" data-new-provider>
        ${hiddenField("name", tpl.name)}
        ${hiddenField("type", tpl.type)}
        ${hiddenField("base_url", tpl.base_url || "")}
        ${hiddenField("url", tpl.url || "")}
        ${hiddenField("api_key_env", tpl.api_key_env || "")}
        ${hiddenField("command", Array.isArray(tpl.command) ? tpl.command.join(" ") : (tpl.command || ""))}
        ${hiddenField("reasoning_effort", tpl.reasoning_effort || "")}
        ${hiddenField("timeout_seconds", tpl.timeout_seconds || "")}
        ${hiddenField("max_tokens", tpl.max_tokens || "")}
        <input type="checkbox" data-provider-field="json_mode" ${tpl.json_mode === false ? "" : "checked"} hidden>
        <div class="quick-provider-grid">
          ${needsKey ? secretField(tpl.api_key_env || "", envStatus, "new") : `<div class="quick-provider-note">订阅/本地 CLI 模式无需 API Key</div>`}
          ${isCustom ? field("API Base", "base_url", tpl.base_url || "") : ""}
          <div id="newProviderModelWrap">${modelControlHtml(tpl.model || "", modelOptions)}</div>
          <button class="btn" id="fetchModelsBtn" ${needsKey || isCustom ? "" : "disabled"}>获取模型列表</button>
        </div>
        <div class="model-fetch-status" id="newProviderModelStatus">${esc(status)}</div>
        <details class="provider-advanced">
          <summary>高级配置</summary>
          <div class="provider-form advanced-provider-form">
            ${field("Provider 名称", "name", tpl.name)}
            ${field("类型", "type", tpl.type)}
            ${field("API Base", "base_url", tpl.base_url || "")}
            ${field("API URL", "url", tpl.url || "")}
            ${field("Key 环境变量", "api_key_env", tpl.api_key_env || "")}
            ${field("CLI Command", "command", tpl.command || "")}
            ${field("推理强度", "reasoning_effort", tpl.reasoning_effort || "")}
            ${field("超时秒", "timeout_seconds", tpl.timeout_seconds || "")}
            ${field("Max Tokens", "max_tokens", tpl.max_tokens || "")}
          </div>
        </details>
      </div>
      <div class="flex between mt-sm">
        <span class="hint">${nameTaken ? "同名 Provider 已存在,保存会覆盖配置。" : `保存为 ${esc(tpl.name)},之后可在上方路由编辑里选择。`}</span>
        <button class="btn primary" id="addProviderBtn">保存新增 Provider</button>
      </div>
    </div>`;
  }

  function providerCard(name, provider, health, envStatus) {
    const ok = health.ok === true;
    const command = Array.isArray(provider.command) ? provider.command.join(" ") : (provider.command || "");
    return `<div class="provider-card" data-provider-card="${esc(name)}">
      <div class="flex between">
        <div>
          <b>${esc(name)}</b>
          <div class="mut small">${esc(provider.type || "")} · ${esc(provider.model || "")}</div>
        </div>
        <span class="dot ${ok ? "live" : ""}"></span>
      </div>
      <div class="provider-form">
        ${field("类型", "type", provider.type || "")}
        ${field("模型", "model", provider.model || "")}
        ${field("API Base", "base_url", provider.base_url || "")}
        ${field("API URL", "url", provider.url || "")}
        ${field("Key 环境变量", "api_key_env", provider.api_key_env || "")}
        ${secretField(provider.api_key_env || "", envStatus, name)}
        ${field("CLI Command", "command", command)}
        ${field("推理强度", "reasoning_effort", provider.reasoning_effort || "")}
        ${field("超时秒", "timeout_seconds", provider.timeout_seconds || "")}
        ${field("Max Tokens", "max_tokens", provider.max_tokens || "")}
        ${field("Anthropic版本", "anthropic_version", provider.anthropic_version || "")}
        <label class="inline-check provider-json"><input type="checkbox" data-provider-field="json_mode" ${provider.json_mode === false ? "" : "checked"}> JSON Mode</label>
      </div>
      ${command ? `<div class="provider-command mono">${esc(command)}</div>` : ""}
      ${health.error ? `<div class="small mt-sm" style="color:var(--warn)">${esc(health.error)}</div>` : ""}
      <div class="provider-actions">
        <button class="btn" data-provider-test="${esc(name)}">检查配置</button>
        <button class="btn primary" data-provider-save="${esc(name)}">保存 Provider</button>
      </div>
    </div>`;
  }

  function field(label, key, value) {
    return `<label><span>${esc(label)}</span><input class="agent-input mono" data-provider-field="${esc(key)}" value="${esc(value)}"></label>`;
  }

  function hiddenField(key, value) {
    return `<input type="hidden" data-provider-field="${esc(key)}" value="${esc(value)}">`;
  }

  function modelControlHtml(value, options) {
    const current = String(value || "");
    if (Array.isArray(options) && options.length) {
      const selected = options.includes(current) ? current : options[0];
      return `<label><span>模型</span><select class="agent-input mono" data-provider-field="model">
        ${options.map(model => `<option value="${esc(model)}" ${model === selected ? "selected" : ""}>${esc(model)}</option>`).join("")}
      </select></label>`;
    }
    return `<label><span>模型</span><input class="agent-input mono" data-provider-field="model" value="${esc(current)}" placeholder="先获取模型列表"></label>`;
  }

  function plainInput(label, id, value) {
    return `<label><span>${esc(label)}</span><input id="${esc(id)}" class="agent-input mono" value="${esc(value)}"></label>`;
  }

  function secretField(envName, envStatus, owner) {
    const env = String(envName || "").trim();
    const info = env ? (((envStatus || {}).keys || {})[env] || {}) : {};
    const present = !!info.present;
    const hint = env ? `${env} · ${present ? "已配置" : "未配置"}` : "先填写 Key 环境变量";
    return `<label class="provider-secret">
      <span>API Key</span>
      <input class="agent-input mono" type="password" data-provider-secret="${esc(owner)}" data-provider-secret-env="${esc(env)}" placeholder="${esc(hint)}">
    </label>`;
  }

  function tencentSecret(label, key, env) {
    const info = (env || {})[key] || {};
    const hint = `${key} · ${info.present ? "已配置" : "未配置"}`;
    return `<label class="provider-secret">
      <span>${esc(label)}</span>
      <input class="agent-input mono" type="password" data-tencent-secret="${esc(key)}" placeholder="${esc(hint)}">
    </label>`;
  }

  function alertRow(row) {
    const id = row["告警ID"] || "";
    const encoded = encodeURIComponent(id);
    const active = id && id === selectedAlertId ? " selected" : "";
    return `<tr class="agent-alert-row${active}">
      <td class="mono mut">${esc(String(row["告警时间"] || "").slice(5, 16))}</td>
      <td>${esc(row["告警等级"] || "")}</td>
      <td>${esc(row["事件名称"] || "")}</td>
      <td class="mono small">${esc(row["攻击IP"] || "")}<br><span class="mut">${esc(row["目标IP"] || "")}</span></td>
      <td>${esc(row["模型研判"] || "")}</td>
      <td>
        <button class="btn tiny" data-alert-select="${encoded}">选择</button>
        <button class="btn tiny" data-alert-preview="${encoded}">预览</button>
      </td>
    </tr>`;
  }

  function previewSummary() {
    if (!lastPreview) return `<div class="mut">尚未运行</div>`;
    if (lastPreview.error) return `<div style="color:var(--warn)">${esc(lastPreview.error)}</div>`;
    const verdict = (lastPreview.verdict || {})["模型研判"] || "";
    const allowed = ((lastPreview.policy || {}).allowed_actions || []).length;
    const blocked = ((lastPreview.policy || {}).blocked_actions || []).length;
    const msg = lastPreview.operator_message || "";
    return `<div class="agent-preview-kpis">
      <div><span class="mut">结论</span><b>${esc(verdict)}</b></div>
      <div><span class="mut">允许</span><b style="color:var(--ok)">${allowed}</b></div>
      <div><span class="mut">阻断</span><b style="color:var(--warn)">${blocked}</b></div>
      <div><span class="mut">状态</span><b>${esc(msg)}</b></div>
    </div>`;
  }

  function selectAlert(alertId) {
    selectedAlertId = alertId || "";
    lastPreview = null;
    const input = CFW.$("#agentAlertId");
    if (input) input.value = selectedAlertId;
    CFW.renderAgent();
  }

  function activeAlertId() {
    const input = CFW.$("#agentAlertId");
    return (input ? input.value : selectedAlertId || "").trim();
  }

  async function postConfig(payload) {
    const res = await fetch("/api/agent/llm/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "config_update_failed");
    configResult = data;
    if (CFW.loadData) await CFW.loadData(CFW.state.days);
    CFW.renderAgent();
  }

  async function saveGlobalConfig() {
    try {
      await postConfig({
        enabled: !!CFW.$("#llmEnabled").checked,
        rule_parse: {
          enabled: !!CFW.$("#ruleParseEnabled").checked,
          timeout_seconds: Number(CFW.$("#ruleParseTimeout").value || 90),
        }
      });
    } catch (e) {
      configResult = { error: String(e) };
      CFW.renderAgent();
    }
  }

  async function saveRoutesConfig() {
    const routing = {};
    CFW.$$("[data-route-stage]").forEach(el => { routing[el.dataset.routeStage] = el.value; });
    try {
      await postConfig({ routing });
    } catch (e) {
      configResult = { error: String(e) };
      CFW.renderAgent();
    }
  }

  async function saveTencentAuthConfig() {
    const secrets = {};
    CFW.$$("[data-tencent-secret]").forEach(el => {
      const value = (el.value || "").trim();
      if (value) secrets[el.dataset.tencentSecret] = value;
    });
    const payload = {
      region: (CFW.$("#tencentRegion")?.value || "").trim(),
      endpoint: (CFW.$("#tencentEndpoint")?.value || "").trim(),
      credential_profiles: (CFW.$("#tencentProfiles")?.value || "").trim(),
      secrets,
    };
    try {
      const res = await fetch("/api/tencent/auth/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "tencent_auth_update_failed");
      configResult = data;
      if (CFW.loadData) await CFW.loadData(CFW.state.days);
      CFW.renderAgent();
    } catch (e) {
      configResult = { error: String(e) };
      CFW.renderAgent();
    }
  }

  function collectNewProviderPayload() {
    const box = CFW.$("[data-new-provider]");
    const provider = {};
    const secrets = {};
    if (!box) return { provider, secrets };
    CFW.$$("[data-provider-field]", box).forEach(el => {
      const advanced = el.closest(".provider-advanced");
      if (advanced && !advanced.open) return;
      if (el.type === "checkbox") provider[el.dataset.providerField] = !!el.checked;
      else provider[el.dataset.providerField] = el.value.trim();
    });
    provider.name = (provider.name || "").trim();
    const secretInput = CFW.$("[data-provider-secret]", box);
    const envName = (provider.api_key_env || secretInput?.dataset.providerSecretEnv || "").trim();
    const secretValue = (secretInput?.value || "").trim();
    if (envName && secretValue) secrets[envName] = secretValue;
    return { provider, secrets };
  }

  async function fetchNewProviderModels() {
    const { provider, secrets } = collectNewProviderPayload();
    const status = CFW.$("#newProviderModelStatus");
    if (!provider.base_url && String(provider.type || "").includes("openai")) {
      if (status) status.textContent = "请先填写 API Base";
      return;
    }
    if (status) status.textContent = "正在获取模型列表...";
    try {
      const res = await fetch("/api/agent/providers/models", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ provider, secrets })
      });
      const data = await res.json();
      if (!data.ok || !Array.isArray(data.models) || !data.models.length) {
        const msg = data.error ? `获取失败: ${data.error}` : "未返回模型列表";
        newProviderModelStatus[newProviderTemplate] = msg;
        if (status) status.textContent = msg;
        return;
      }
      newProviderModelOptions[newProviderTemplate] = data.models;
      newProviderModelStatus[newProviderTemplate] = `已获取 ${data.models.length} 个模型`;
      const wrap = CFW.$("#newProviderModelWrap");
      if (wrap) wrap.innerHTML = modelControlHtml(provider.model || data.models[0], data.models);
      if (status) status.textContent = newProviderModelStatus[newProviderTemplate];
    } catch (e) {
      const msg = "获取失败: " + String(e);
      newProviderModelStatus[newProviderTemplate] = msg;
      if (status) status.textContent = msg;
    }
  }

  async function saveProviderConfig(name) {
    const card = CFW.$$("[data-provider-card]").find(el => el.dataset.providerCard === name);
    if (!card) {
      configResult = { provider: name, error: "provider_card_not_found" };
      CFW.renderAgent();
      return;
    }
    const provider = { name };
    const secrets = {};
    CFW.$$("[data-provider-field]", card).forEach(el => {
      if (el.type === "checkbox") provider[el.dataset.providerField] = !!el.checked;
      else provider[el.dataset.providerField] = el.value.trim();
    });
    const secretInput = CFW.$("[data-provider-secret]", card);
    const envName = (provider.api_key_env || secretInput?.dataset.providerSecretEnv || "").trim();
    const secretValue = (secretInput?.value || "").trim();
    if (envName && secretValue) secrets[envName] = secretValue;
    try {
      await postConfig({ provider, secrets });
    } catch (e) {
      configResult = { provider: name, error: String(e) };
      CFW.renderAgent();
    }
  }

  async function saveNewProviderConfig() {
    const { provider, secrets } = collectNewProviderPayload();
    if (!provider.name) {
      configResult = { error: "请填写 Provider 名称" };
      CFW.renderAgent();
      return;
    }
    const apiLike = ["openai_compatible", "openai", "deepseek", "glm", "anthropic", "claude_api"].includes(String(provider.type || "").toLowerCase());
    if (apiLike && !provider.model) {
      configResult = { error: "请先获取并选择模型" };
      CFW.renderAgent();
      return;
    }
    try {
      await postConfig({ provider, secrets });
    } catch (e) {
      configResult = { provider: provider.name, error: String(e) };
      CFW.renderAgent();
    }
  }

  async function testProviderConfig(name) {
    configResult = { provider: name, status: "checking" };
    CFW.renderAgent();
    try {
      const res = await fetch(`/api/agent/providers/${encodeURIComponent(name)}/test`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ live: false, timeout: 10 })
      });
      configResult = await res.json();
    } catch (e) {
      configResult = { provider: name, error: String(e) };
    }
    CFW.renderAgent();
  }

  async function previewTriage(runModel) {
    const id = activeAlertId();
    const box = CFW.$("#triagePreview");
    if (!id) {
      box.textContent = "请先选择或输入告警ID";
      return;
    }
    if (runModel && !confirm("完整 dry-run 会调用当前模型路由和只读取证工具,确认继续？")) return;
    box.textContent = runModel ? "Agent dry-run 中..." : "策略预览中...";
    try {
      const res = await fetch("/api/agent/triage/preview", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ alert_id: id, days: CFW.state.days, live: false, run_model: runModel })
      });
      lastPreview = await res.json();
      box.textContent = JSON.stringify(lastPreview, null, 2);
      CFW.renderAgent();
    } catch (e) {
      box.textContent = "预览失败: " + e;
    }
  }
})();

</script>
<script data-source="view-reports.js">
/* ===== 视图：日报周报 ===== */
(function () {
  const { esc, fmt, countUp } = CFW;
  const PERIODS = {
    daily: { title: "日报", days: 1, range: "近 1 天", file: "cfw-daily-report" },
    weekly: { title: "周报", days: 7, range: "近 7 天", file: "cfw-weekly-report" },
  };
  let mode = "daily";
  const cache = {};
  let copyState = "";

  CFW.renderReports = function () {
    const root = CFW.$("#view-reports");
    const period = PERIODS[mode];
    const report = cache[mode];
    if (!report) {
      root.innerHTML = loadingView(period);
      loadReport(mode);
      return;
    }

    const ov = report.overview || {};
    const health = report.health || {};
    const pipeline = report.pipeline || {};
    const cfg = pipeline.config || {};
    const results = ov.results || {};
    const levels = ov.levels || {};
    const retained = ov.retained || 0;
    const success = results["确认成功"] || 0;
    const manual = results["需人工复核"] || 0;
    const topAttackers = report.attackers || [];
    const topAssets = report.assets || [];
    const keyAlerts = report.key_alerts || [];
    const profiles = report.profiles || [];
    const reportText = buildReportText(report, period);

    root.innerHTML = `
      <div class="report-head panel">
        <div class="accent-top"></div>
        <div>
          <h2>报告视图</h2>
          <div class="report-title">${period.title} · ${period.range}</div>
          <div class="mut small">生成时间 ${esc(report.generated_at || "")} · 数据来自本地 reports/data 聚合</div>
        </div>
        <div class="report-switch" role="tablist">
          ${Object.entries(PERIODS).map(([key, item]) => `<button class="${key === mode ? "active" : ""}" data-report-mode="${key}">${item.title}</button>`).join("")}
        </div>
        <button class="btn primary" id="copyReportBtn">复制报告文本</button>
      </div>

      <div class="grid g-4 mt">
        <div class="kpi tone-primary"><div class="k-label">告警总量</div><div class="k-num" data-count="${ov.total || 0}">0</div><div class="k-foot">${esc(period.range)} 入库研判</div></div>
        <div class="kpi tone-ok"><div class="k-label">自动处置</div><div class="k-num" data-count="${ov.auto_ignored || 0}">0</div><div class="k-foot">处置率 <b style="color:var(--ok)">${ov.ignore_rate || 0}%</b></div></div>
        <div class="kpi tone-warn"><div class="k-label">需人工复核</div><div class="k-num" data-count="${manual}">0</div><div class="k-foot">${retained} 条留存项</div></div>
        <div class="kpi tone-danger${success ? " alarm" : ""}"><div class="k-label">确认成功</div><div class="k-num" data-count="${success}">0</div><div class="k-foot">真实落地优先跟进</div></div>
      </div>

      <div class="grid mt report-main">
        <div class="panel">
          <h2>${period.title}摘要 <span class="hint">${esc(copyState)}</span></h2>
          <div class="report-narrative">${summaryParagraphs(report, period).map(p => `<p>${esc(p)}</p>`).join("")}</div>
          <div class="report-section-grid">
            ${miniMetric("研判结果", resultLine(results))}
            ${miniMetric("等级分布", resultLine(levels))}
            ${miniMetric("源包命中", `${health.evidence_hit_rate || 0}% (${health.evidence_hit || 0}/${health.total || 0})`)}
            ${miniMetric("任务状态", `日报 ${cfg.daily_report_enabled ? "启用" : "关闭"} · 小时报 ${cfg.hourly_report_enabled ? "启用" : "关闭"}`)}
          </div>
          <textarea class="report-copy mono" readonly>${esc(reportText)}</textarea>
        </div>

        <div class="panel">
          <h2>处置重点 <span class="hint">确认成功 / 需人工 / 高危</span></h2>
          <div class="report-alert-list">
            ${keyAlerts.slice(0, 8).map(alertItem).join("") || `<div class="mut">暂无需人工聚焦项</div>`}
          </div>
        </div>
      </div>

      <div class="grid mt report-main">
        <div class="panel">
          <h2>攻击源与资产</h2>
          <div class="report-two-cols">
            <div>
              <div class="report-subtitle">攻击源 TOP</div>
              <table><thead><tr><th>来源 IP</th><th class="r">次数</th><th class="r">手法</th><th class="r">高危</th></tr></thead>
                <tbody>${topAttackers.map(a => `<tr><td class="mono ${a.public ? "net-pub" : "net-pri"}">${esc(a.ip)}</td><td class="r mono">${fmt(a.count || 0)}</td><td class="r">${a.techniques || 0}</td><td class="r ${a.high ? "net-pub" : "mut"}">${a.high || "—"}</td></tr>`).join("") || `<tr><td colspan="4" class="mut">暂无数据</td></tr>`}</tbody></table>
            </div>
            <div>
              <div class="report-subtitle">资产 TOP</div>
              <table><thead><tr><th>目标</th><th class="r">次数</th><th class="r">攻击者</th><th class="r">高危</th></tr></thead>
                <tbody>${topAssets.map(a => `<tr><td>${esc(a.dst || "")}</td><td class="r mono">${fmt(a.count || 0)}</td><td class="r">${a.attackers || 0}</td><td class="r ${a.high ? "net-pub" : "mut"}">${a.high || "—"}</td></tr>`).join("") || `<tr><td colspan="4" class="mut">暂无数据</td></tr>`}</tbody></table>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>防火墙下一步能力</h2>
          <div class="fw-roadmap">
            ${roadmapCards(report, profiles).map(card => `<div class="road-card ${card.tone}">
              <b>${esc(card.title)}</b><span>${esc(card.text)}</span>
            </div>`).join("")}
          </div>
        </div>
      </div>`;

    CFW.$$(".k-num[data-count]", root).forEach(n => countUp(n, +n.dataset.count));
    CFW.$$("[data-report-mode]", root).forEach(btn => btn.addEventListener("click", () => {
      mode = btn.dataset.reportMode || "daily";
      copyState = "";
      CFW.renderReports();
    }));
    const copy = CFW.$("#copyReportBtn", root);
    if (copy) copy.addEventListener("click", () => copyReport(reportText));
  };

  function loadingView(period) {
    return `<div class="panel mt">
      <div class="accent-top"></div>
      <h2>${period.title}</h2>
      <div class="mut">正在汇总 ${period.range} 的告警、画像、处置和通知状态...</div>
    </div>`;
  }

  async function loadReport(key) {
    const period = PERIODS[key] || PERIODS.daily;
    try {
      const res = await fetch(`/api/reports/summary?days=${period.days}`);
      cache[key] = await res.json();
    } catch (e) {
      cache[key] = { error: String(e), overview: {}, health: {}, key_alerts: [] };
    }
    if (mode === key) CFW.renderReports();
  }

  function summaryParagraphs(report, period) {
    const ov = report.overview || {};
    const results = ov.results || {};
    const sources = ov.sources || {};
    const success = results["确认成功"] || 0;
    const manual = results["需人工复核"] || 0;
    const auto = ov.auto_ignored || 0;
    const total = ov.total || 0;
    const sourceLine = resultLine(sources);
    const key = [];
    key.push(`${period.range}共研判 ${fmt(total)} 条云防火墙告警，自动处置 ${fmt(auto)} 条，自动处置率 ${ov.ignore_rate || 0}%。`);
    key.push(`留存人工关注 ${fmt(ov.retained || 0)} 条，其中需人工复核 ${fmt(manual)} 条，确认成功 ${fmt(success)} 条。研判来源分布：${sourceLine || "暂无"}。`);
    if (success > 0) key.push("存在确认成功告警，日报/周报应优先推动资产隔离、溯源取证和规则加固。");
    else if (manual > 0) key.push("当前主要风险是证据不足或高危待确认，建议按处置重点列表逐条补证。");
    else key.push("当前未发现确认成功或需人工复核告警，可继续观察攻击源趋势和规则命中稳定性。");
    return key;
  }

  function resultLine(obj) {
    return Object.entries(obj || {}).filter(([, v]) => v).map(([k, v]) => `${k} ${fmt(v)}`).join(" · ");
  }

  function miniMetric(title, value) {
    return `<div class="report-mini"><span>${esc(title)}</span><b>${esc(value || "暂无")}</b></div>`;
  }

  function alertItem(row) {
    const result = row["模型研判"] || "";
    const tone = result === "确认成功" ? "danger" : (row["告警等级"] === "高危" ? "warn" : "primary");
    return `<div class="report-alert ${tone}">
      <div class="flex between"><b>${esc(row["事件名称"] || "")}</b><span class="tag tag-${esc(row["告警等级"] || "")}">${esc(row["告警等级"] || "")}</span></div>
      <div class="mono small">${esc(row["攻击IP"] || "")} → ${esc(row["目标IP"] || "")}</div>
      <div class="mut small">${esc(String(row["告警时间"] || "").slice(5, 16))} · ${esc(result)} · ${esc(row["研判来源"] || "")}</div>
      <div class="small">${esc(row["研判理由"] || row["关键证据"] || "")}</div>
    </div>`;
  }

  function roadmapCards(report, profiles) {
    const ov = report.overview || {};
    const results = ov.results || {};
    const attackers = report.attackers || [];
    const hasSuccess = (results["确认成功"] || 0) > 0;
    const highAttacker = attackers.find(a => (a.high || 0) > 0 || (a.success || 0) > 0);
    const hasProfiles = (profiles || []).length > 0;
    return [
      {
        tone: hasSuccess ? "danger" : "primary",
        title: "一键处置编排",
        text: hasSuccess ? "对确认成功告警联动封禁、资产隔离、工单和回滚窗口。" : "把封禁、忽略、加白、回滚做成审批化动作链。",
      },
      {
        tone: highAttacker ? "warn" : "primary",
        title: "攻击源信誉库",
        text: highAttacker ? `优先沉淀 ${highAttacker.ip} 等高危来源的跨日信誉。` : "按来源 IP 聚合频率、手法、国家和命中结果，形成可过期信誉。",
      },
      {
        tone: "primary",
        title: "资产暴露面治理",
        text: "把被打资产、端口、业务标签和规则命中关联，形成资产热力图。",
      },
      {
        tone: hasProfiles ? "primary" : "warn",
        title: "攻击路径关联",
        text: hasProfiles ? "画像已可承接攻击阶段聚合，下一步关联同源多目标路径。" : "需要更多画像样本，按攻击阶段串联多条告警。",
      },
      {
        tone: "primary",
        title: "出站与 C2 监测",
        text: "基于防火墙南北向流量识别异常外联、周期心跳和新域名访问。",
      },
      {
        tone: "primary",
        title: "规则老化治理",
        text: "黑白名单增加到期、命中率、误报率和自动回收策略。",
      },
    ];
  }

  function buildReportText(report, period) {
    const ov = report.overview || {};
    const results = ov.results || {};
    const health = report.health || {};
    const alerts = report.key_alerts || [];
    const attackers = report.attackers || [];
    const lines = [
      `【云防火墙${period.title}】${period.range}`,
      `生成时间: ${report.generated_at || ""}`,
      "",
      `1. 总览: 告警 ${ov.total || 0} 条, 自动处置 ${ov.auto_ignored || 0} 条, 自动处置率 ${ov.ignore_rate || 0}%, 留存 ${ov.retained || 0} 条。`,
      `2. 结果: ${resultLine(results) || "暂无"}`,
      `3. 健康: 源包命中率 ${health.evidence_hit_rate || 0}%, 处置失败 ${health.dispose_failed || 0}, 重试队列 ${health.retry_queue || 0}。`,
      `4. 攻击源TOP: ${attackers.slice(0, 5).map(a => `${a.ip}(${a.count})`).join(", ") || "暂无"}`,
      "5. 重点告警:",
      ...(alerts.slice(0, 6).map((a, i) => `${i + 1}) ${a["告警等级"] || ""} ${a["事件名称"] || ""} ${a["攻击IP"] || ""} -> ${a["目标IP"] || ""} ${a["模型研判"] || ""}`)),
    ];
    if (!alerts.length) lines.push("无确认成功、需人工复核或高危留存项。");
    return lines.join("\n");
  }

  async function copyReport(text) {
    try {
      await navigator.clipboard.writeText(text);
      copyState = "已复制";
    } catch (e) {
      try {
        const box = CFW.$(".report-copy");
        if (!box) throw e;
        const readonly = box.readOnly;
        box.readOnly = false;
        box.focus();
        box.select();
        box.setSelectionRange(0, box.value.length);
        copyState = document.execCommand("copy") ? "已复制" : "已选中文本";
        box.readOnly = readonly;
      } catch (fallbackError) {
        copyState = "复制失败";
      }
    }
    const hint = CFW.$("#view-reports h2 .hint");
    if (hint) hint.textContent = copyState;
  }
})();

</script>
<script data-source="demo-mock-api">

(function () {
  const originalFetch = window.fetch ? window.fetch.bind(window) : null;
  const jsonResponse = (data, status = 200) => new Response(JSON.stringify(data), {
    status,
    headers: { "Content-Type": "application/json; charset=utf-8" }
  });
  const clone = obj => JSON.parse(JSON.stringify(obj || {}));
  const nowText = () => {
    const d = new Date();
    const p = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  };
  const firstIp = text => String(text || "").match(/\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b/)?.[0] || "203.0.113.250";
  function buildReport(days) {
    const w = CFW.DEMO.windows[String(days)] || CFW.DEMO.windows[1];
    const keyAlerts = (CFW.DEMO.alerts || []).filter(a => a.result === "确认成功" || a.result === "需人工复核" || a.level === "高危").map(a => ({
      "告警ID": a.id, "告警时间": a.time, "告警等级": a.level, "事件名称": a.event, "攻击IP": a.atkIp, "目标IP": a.dstIp,
      "模型研判": a.result, "研判来源": a.source, "研判理由": a.why, "关键证据": a.key
    }));
    return {
      generated_at: nowText(),
      overview: {
        total: w.kpi.total, auto_ignored: w.kpi.auto, ignore_rate: w.kpi.ignoreRate, retained: w.kpi.manual + w.kpi.success,
        results: w.results, levels: w.levels, sources: w.sources
      },
      health: {
        evidence_hit_rate: CFW.DEMO.health.evidenceHit, evidence_hit: CFW.DEMO.health.evidenceHitCount,
        total: CFW.DEMO.health.total, dispose_failed: CFW.DEMO.health.disposeFailed, retry_queue: CFW.DEMO.health.retryQueue
      },
      pipeline: CFW.DEMO.pipelineStatus,
      attackers: CFW.DEMO.attackerRank,
      assets: CFW.DEMO.assetRank,
      key_alerts: keyAlerts,
      profiles: CFW.DEMO.profiles
    };
  }
  function draftRule(body) {
    const text = String(body.text || "");
    const ip = firstIp(text);
    const isBlock = /封禁|拉黑|黑名单|block/i.test(text);
    const isAllow = /加白|白名单|正常|误报|不研判|跳过/i.test(text);
    if (isBlock) {
      return { rule_id: "draft-block-demo", status: "draft", type: "ip_blocklist", action: "block_ip", ips: [ip], match: { src_ips: [ip] }, parser: body.use_llm ? "llm_demo" : "local_demo", requires_human_confirm: true, notes: ["Demo 中仅登记人工封禁对象，不自动调用云接口"], source_text: text };
    }
    if (isAllow) {
      return { rule_id: "draft-allow-demo", status: "draft", type: "business_false_positive", action: "skip_llm_and_omit", match: { src_ip: ip }, parser: body.use_llm ? "llm_demo" : "local_demo", requires_human_confirm: true, notes: ["命中后跳过模型研判并按业务误报处理"], source_text: text };
    }
    return { rule_id: "draft-scanner-demo", status: "draft", type: "scanner_whitelist", action: "allow_scanner_ip", match: { src_ips: [ip] }, parser: body.use_llm ? "llm_demo" : "local_demo", requires_human_confirm: true, notes: ["识别为受控扫描源白名单草案"], source_text: text };
  }
  function assistantReply(body) {
    const alerts = CFW.DEMO.alerts || [];
    const manual = alerts.filter(a => a.manualRequired);
    const success = alerts.filter(a => a.result === "确认成功");
    return {
      mode: "offline-demo-tool-agent",
      answer: `已用 Demo 工具链完成分析：当前窗口有 ${alerts.length} 条样例告警，其中 ${manual.length} 条需人工、${success.length} 条确认成功。优先处理 demo-alert-0003 的 WebShell 落地证据，其次复核 demo-alert-0001 的未授权写入是否为业务测试。`,
      tool_calls: [
        { name: "search_alerts", detail: "检索当前窗口告警", status: "ok", count: alerts.length },
        { name: "get_related_alerts", detail: "按攻击源和目标聚合", status: "ok", count: 4 },
        { name: "get_attacker_profile", detail: "生成攻击者画像", status: "ok", count: CFW.DEMO.profiles.length },
        { name: "summarize_report", detail: "汇总处置优先级", status: "ok", count: 1 }
      ],
      artifacts: [
        { type: "hunt", title: "威胁狩猎发现", data: { total_alerts_scanned: alerts.length, focus: body.message || "all", days: body.days || 1, findings: [
          { severity: "high", title: "WebShell 落地链路", why: "上传和访问链路均有源包证据，建议立即隔离 demo-portal-01" },
          { severity: "medium", title: "搜索服务未授权写入", why: "返回 201 created，但业务归属未确认，需要人工复核" },
          { severity: "medium", title: "内网周期外联", why: "60 秒等长心跳，建议结合主机侧进程核验" }
        ] } },
        { type: "alert_list", title: "需人工/确认成功告警", data: manual.concat(success).map(a => ({ time: a.time, level: a.level, event: a.event, source_ip: a.atkIp, result: a.result })) }
      ],
      suggestions: [
        { action: "navigate", view: "triage", label: "打开告警研判台" },
        { action: "navigate", view: "attackers", label: "查看攻击者画像" }
      ],
      safety: { write_actions: false, note: "Demo 模式不执行真实封禁或云端写入" }
    };
  }
  window.fetch = async function (input, init = {}) {
    const url = typeof input === "string" ? input : (input && input.url) || "";
    if (!url.includes("/api/")) return originalFetch ? originalFetch(input, init) : jsonResponse({ ok: false, error: "network_disabled_in_demo" }, 404);
    let body = {};
    try { body = init.body ? JSON.parse(init.body) : {}; } catch (_) {}
    if (url.includes("/api/reports/summary")) {
      const days = Number(new URL(url, location.href).searchParams.get("days") || 1);
      return jsonResponse(buildReport(days));
    }
    if (url.includes("/api/agent/assistant/chat")) return jsonResponse(assistantReply(body));
    if (url.includes("/api/agent/rules/draft")) return jsonResponse(draftRule(body));
    if (url === "/api/agent/rules" || url.endsWith("/api/agent/rules")) {
      const rule = Object.assign({}, body.rule || {}, { status: body.activate ? "active" : "draft", rule_id: (body.rule && body.rule.rule_id) || "demo-rule-new" });
      CFW.DEMO.customRules = [rule].concat(CFW.DEMO.customRules || []);
      return jsonResponse(rule);
    }
    if (url.includes("/api/agent/rules/") && /\/(activate|disable)$/.test(url)) {
      const action = url.endsWith("/activate") ? "active" : "disabled";
      return jsonResponse({ ok: true, status: action, rule_id: decodeURIComponent(url.split("/api/agent/rules/")[1].replace(/\/(activate|disable)$/, "")) });
    }
    if (url.includes("/api/agent/whitelist")) {
      CFW.DEMO.whitelistConfig.tencent_scan_ips = body.tencent_scan_ips || [];
      CFW.DEMO.whitelistConfig.company_scan_ips = body.company_scan_ips || [];
      const total = new Set([...(body.tencent_scan_ips || []), ...(body.company_scan_ips || [])]).size;
      CFW.DEMO.whitelistConfig.counts = { tencent_scan_ips: (body.tencent_scan_ips || []).length, company_scan_ips: (body.company_scan_ips || []).length, total };
      return jsonResponse({ ok: true, counts: CFW.DEMO.whitelistConfig.counts });
    }
    if (url.includes("/api/agent/providers/models")) {
      const base = String((body.provider || {}).base_url || "");
      const models = base.includes("bigmodel") ? ["glm-4-flash", "glm-4-plus"] : base.includes("deepseek") ? ["deepseek-chat", "deepseek-reasoner"] : ["demo-chat", "demo-reasoner"];
      return jsonResponse({ ok: true, models });
    }
    if (url.includes("/api/agent/providers/") && url.endsWith("/test")) return jsonResponse({ ok: true, demo: true, message: "Demo 配置检查通过，不调用真实模型" });
    if (url.includes("/api/agent/triage/preview")) {
      const alert = (CFW.DEMO.alerts || []).find(a => a.id === body.alert_id) || CFW.DEMO.alerts[0];
      return jsonResponse({ alert_id: body.alert_id, verdict: { "模型研判": alert.result, "置信度": alert.conf, "研判理由": alert.why }, policy: { allowed_actions: ["mark_handled"], blocked_actions: ["auto_block_cloud"] }, operator_message: "Demo dry-run：只给人工建议，不执行云端写操作" });
    }
    if (url.includes("/api/agent/alerts/") && url.endsWith("/handle")) {
      const id = decodeURIComponent(url.split("/api/agent/alerts/")[1].replace("/handle", ""));
      const alert = (CFW.DEMO.alerts || []).find(a => a.id === id);
      if (alert) { alert.manualHandled = true; alert.manualActionLabel = body.action || "mark_handled"; alert.manualActionTime = nowText(); }
      return jsonResponse({ ok: true, action: { status: "handled", action_label: body.action || "mark_handled", target: body.target_ip || "" } });
    }
    if (url.includes("/api/agent/llm/config")) return jsonResponse({ ok: true, demo: true, saved: true, payload: body });
    if (url.includes("/api/tencent/auth/config")) return jsonResponse({ ok: true, demo: true, saved: true, message: "Demo 模式不保存真实密钥" });
    return jsonResponse({ ok: true, demo: true });
  };
  CFW.loadData = async function (days) {
    CFW.state.days = days || 1;
    const manual = (CFW.DEMO.alerts || []).filter(a => a.manualRequired && !a.manualHandled).length;
    const badge = CFW.$("#triageBadge");
    if (badge) badge.textContent = manual ? String(manual) : "0";
    const model = CFW.$("#runtimeModel");
    if (model) model.innerHTML = '<span data-ic="shield" style="width:14px;color:var(--primary)"></span> Demo · deepseek/glm 路由';
    const status = CFW.$("#runtimeStatus");
    if (status) status.innerHTML = '<span class="dot live"></span> Demo 模式 · 离线脱敏数据';
    document.querySelectorAll("[data-ic]").forEach(s => { if (window.CFW && CFW.ICON) s.innerHTML = CFW.ICON[s.dataset.ic] || s.innerHTML; });
  };
})();

</script>
<script data-source="app.js">
/* ===== 应用外壳：导航 / 时钟 / 时间窗 / 初始化 ===== */
(function () {
  const VIEWS = {
    overview: { title: "态势总览", crumb: "实时安全态势 · KPI 与告警分布", render: () => CFW.renderOverview() },
    pipeline: { title: "研判流水线", crumb: "实时处理链路 · 轮询 / 研判 / 处置 / 通知", render: () => CFW.renderPipeline() },
    triage: { title: "告警研判台", crumb: "告警明细 · 证据链与工具轨迹下钻", render: () => CFW.renderTriage() },
    attackers: { title: "攻击者画像", crumb: "按攻击源聚合 · 攻击阶段与威胁评分", render: () => CFW.renderAttackers() },
    lists: { title: "自定义规则", crumb: "规则库 · 新建规则 · 默认白名单 · 执行记录", render: () => CFW.renderLists() },
    assistant: { title: "Agent 助手", crumb: "自然语言入口 · 调用现有工具 · 只读分析与草案生成", render: () => CFW.renderAssistant() },
    agent: { title: "Agent 配置", crumb: "模型路由 · Provider/API 配置 · 策略闸", render: () => CFW.renderAgent() },
    reports: { title: "日报周报", crumb: "日报 · 周报 · 处置重点与防火墙路线图", render: () => CFW.renderReports() }
  };

  function go(view) {
    CFW.state.view = view;
    CFW.stopTicker && CFW.stopTicker();
    CFW.$$(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.view === view));
    CFW.$$(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + view));
    const meta = VIEWS[view];
    CFW.$("#topTitle").textContent = meta.title;
    CFW.$("#topCrumb").textContent = meta.crumb;
    meta.render();
    window.scrollTo(0, 0);
  }

  async function setDays(d) {
    CFW.state.days = d;
    CFW.$$("#daySeg button").forEach(b => b.classList.toggle("active", +b.dataset.d === d));
    if (CFW.loadData) { try { await CFW.loadData(d); } catch (e) { console.warn("loadData failed", e); } }
    VIEWS[CFW.state.view].render();
    bumpUpdated();
  }

  function clock() {
    const n = new Date();
    const p = x => String(x).padStart(2, "0");
    CFW.$("#clock").textContent = `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())} ${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
  }

  function bumpUpdated() {
    const n = new Date();
    const p = x => String(x).padStart(2, "0");
    CFW.$("#updated").textContent = `更新于 ${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
  }

  CFW.init = async function () {
    CFW.$$(".nav-item").forEach(n => n.addEventListener("click", () => go(n.dataset.view)));
    CFW.$$("#daySeg button").forEach(b => b.addEventListener("click", () => setDays(+b.dataset.d)));
    clock(); setInterval(clock, 1000);
    bumpUpdated(); setInterval(bumpUpdated, 30000);
    if (CFW.loadData) { try { await CFW.loadData(CFW.state.days); } catch (e) { console.warn("loadData failed", e); } }
    const queryView = new URLSearchParams(location.search).get("view") || new URLSearchParams(location.search).get("v");
    const aliases = { "rules-block": "lists", "daily-report": "reports", "weekly-report": "reports", efficiency: "reports" };
    const initialView = VIEWS[queryView] ? queryView : (aliases[queryView] || "overview");
    go(initialView);
    // 每 60s 自动刷新当前时间窗数据并重渲染
    setInterval(async () => {
      if (CFW.loadData) { try { await CFW.loadData(CFW.state.days); VIEWS[CFW.state.view].render(); bumpUpdated(); } catch (e) {} }
    }, 60000);
  };
})();

</script>

<script>
  document.querySelectorAll("[data-ic]").forEach(s => { s.innerHTML = CFW.ICON[s.dataset.ic] || ""; });
  document.getElementById("brandMark").innerHTML = CFW.ICON.shield;
  CFW.init();
</script>
</body>
</html>
