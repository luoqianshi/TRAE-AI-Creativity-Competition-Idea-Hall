  score = 0;
  answers = [];
  document.getElementById('homeScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'flex';
  document.getElementById('totalQ').textContent = questions.length;
  showQuestion();
}

// ===================== 显示题目 =====================
function showQuestion() {
  const q = questions[currentQuestion];
  document.getElementById('questionNum').textContent = `第 ${currentQuestion + 1} 题`;
  document.getElementById('questionText').textContent = q.question;
  document.getElementById('currentQ').textContent = currentQuestion + 1;

  const progress = ((currentQuestion) / questions.length) * 100;
  document.getElementById('progressFill').style.width = progress + '%';

  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];

  q.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `<div class="option-letter">${letters[idx]}</div><div>${opt}</div>`;
    div.onclick = () => selectAnswer(idx);
    optionsDiv.appendChild(div);
  });

  // 重新触发动画
  const card = document.getElementById('questionCard');
  card.classList.remove('fade-in');
  void card.offsetWidth;
  card.classList.add('fade-in');

  startTimer();
}

// ===================== 计时器 =====================
let timerRunning = false;

function startTimer() {
  timeLeft = 20;
  timerRunning = true;
  updateTimerDisplay();
  if (timer) clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timer);
      timerRunning = false;
      handleTimeout();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const timerEl = document.getElementById('timer');
  const timerText = document.getElementById('timerText');
  timerText.textContent = timeLeft + 's';
  if (timeLeft <= 5) {
    timerEl.classList.add('warning');
  } else {
    timerEl.classList.remove('warning');
  }
}

// ===================== 超时处理 =====================
function handleTimeout() {
  const q = questions[currentQuestion];
  const options = document.querySelectorAll('.option');

  options.forEach((opt, i) => {
    opt.classList.add('disabled');
    if (i === q.correct) {
      opt.classList.add('correct');
    }
  });

  // 超时不得分
  answers.push({ question: currentQuestion, correct: false, selected: -1 });

  setTimeout(() => {
    currentQuestion++;
    if (currentQuestion < questions.length) {
      showQuestion();
    } else {
      showResult();
    }
  }, 1500);
}

// ===================== 选择答案 =====================
function selectAnswer(idx) {
  if (!timerRunning) return;
  clearInterval(timer);
  timerRunning = false;

  const q = questions[currentQuestion];
  const options = document.querySelectorAll('.option');

  options.forEach((opt, i) => {
    opt.classList.add('disabled');
    if (i === q.correct) {
      opt.classList.add('correct');
    } else if (i === idx && idx !== q.correct) {
      opt.classList.add('wrong');
    }
  });

  const isCorrect = idx === q.correct;
  if (isCorrect) {
    score += Math.ceil(timeLeft / 20 * 10); // 基础10分，剩余时间加成
  }
  answers.push({ question: currentQuestion, correct: isCorrect, selected: idx });

  setTimeout(() => {
    currentQuestion++;
    if (currentQuestion < questions.length) {
      showQuestion();
    } else {
      showResult();
    }
  }, 1500);
}

// ===================== 显示结果 =====================
function showResult() {
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'flex';

  const correctCount = answers.filter(a => a.correct).length;
  const totalScore = correctCount * 10 + Math.floor(Math.random() * 20); // 模拟分数

  document.getElementById('resultScore').textContent = totalScore + '分';
  document.getElementById('resultDetail').textContent = `答对 ${correctCount}/${questions.length} 题`;

  // 等级判定
  let rank, rankClass, icon;
  const rate = correctCount / questions.length;
  if (rate >= 0.9) {
    rank = '世界杯传奇';
    rankClass = 'rank-gold';
    icon = '👑';
  } else if (rate >= 0.7) {
    rank = '足球达人';
    rankClass = 'rank-silver';
    icon = '🥈';
  } else if (rate >= 0.5) {
    rank = '资深球迷';
    rankClass = 'rank-bronze';
    icon = '🥉';
  } else {
    rank = '世界杯小白';
    rankClass = 'rank-normal';
    icon = '🌱';
  }

  document.getElementById('rankBadge').textContent = rank;
  document.getElementById('rankBadge').className = 'rank-badge ' + rankClass;
  document.getElementById('resultIcon').textContent = icon;

  // 随机冷知识
  const randomFact = questions[Math.floor(Math.random() * questions.length)].fact;
  document.getElementById('funFactText').textContent = randomFact;

  // 保存到排行榜
  const playerName = '玩家' + Math.floor(Math.random() * 9999);
  leaderboard.push({ name: playerName, score: totalScore, date: new Date().toLocaleDateString() });
  leaderboard.sort((a, b) => b.score - a.score);
  leaderboard = leaderboard.slice(0, 10);
  localStorage.setItem('wcQuizLeaderboard', JSON.stringify(leaderboard));

  renderLeaderboard();
}

// ===================== 渲染排行榜 =====================
function renderLeaderboard() {
  const list = document.getElementById('leaderboardList');
  list.innerHTML = '';
  leaderboard.slice(0, 5).forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'leaderboard-item';
    const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '';
    div.innerHTML = `
      <div class="lb-rank">${medal || (idx + 1)}</div>
      <div class="lb-name">${item.name}</div>
      <div class="lb-score">${item.score}分</div>
    `;
    list.appendChild(div);
  });
}

// ===================== 查看排行榜 =====================
function showLeaderboard() {
  alert('请先完成一次挑战，即可查看排行榜！');
}

// ===================== 分享 =====================
function shareResult() {
  const score = document.getElementById('resultScore').textContent;
  const rank = document.getElementById('rankBadge').textContent;
  const text = `我在【美加墨世界杯知识大挑战】中获得了${score}，被评为"${rank}"！快来挑战吧！⚽`;

  if (navigator.share) {
    navigator.share({ title: '世界杯知识挑战', text: text });
  } else {
    // 复制到剪贴板
    const textarea = document.createElement('textarea');
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    alert('成绩已复制到剪贴板，快去分享给朋友吧！');
  }
}

// ===================== 重新开始 =====================
function restartQuiz() {
  document.getElementById('resultScreen').style.display = 'none';
  startQuiz();
}
</script>
