          category: "硬件加速",
          question: "如何把模型和张量放到 GPU 上训练？需要注意什么一致性问题？",
          hint: "模型和数据需要在同一个 device 上"
        },
        back: {
          explanation: "先通过 torch.device 选择设备，再调用 .to(device) 把模型和数据迁移过去。模型和输入张量必须在同一设备上，否则会报错。",
          code: `device = torch.device(
    "cuda" if torch.cuda.is_available() else "cpu"
)

model = model.to(device)
inputs = inputs.to(device)
labels = labels.to(device)

# model 和 inputs 必须在同一 device`
        },
        difficulty: "medium"
      },
      {
        id: "training-loop",
        front: {
          title: "完整的训练循环",
          category: "实战模板",
          question: "写一段标准的 PyTorch 训练循环，需要包含哪些关键步骤？",
          hint: "Epoch → Batch → 前向 → 损失 → 反向 → 更新"
        },
        back: {
          explanation: "训练循环通常按 epoch 遍历数据，每个 batch 执行：前向传播、计算损失、反向传播、更新参数。验证时不需要梯度计算。",
          code: `for epoch in range(epochs):
    model.train()
    for x, y in train_loader:
        x, y = x.to(device), y.to(device)
        optimizer.zero_grad()
        pred = model(x)
        loss = criterion(pred, y)
        loss.backward()
        optimizer.step()

    model.eval()
    with torch.no_grad():
        # 验证逻辑
        pass`
        },
        difficulty: "hard"
      },
      {
        id: "save-load",
        front: {
          title: "模型保存与加载",
          category: "模型管理",
          question: "torch.save() 保存 model.state_dict() 和直接保存整个模型有什么区别？推荐哪种方式？",
          hint: "state_dict 只保存参数，不保存模型结构"
        },
        back: {
          explanation: "推荐保存 state_dict，它只包含模型参数，体积小、跨环境兼容性好。加载时需要先实例化模型结构，再 load_state_dict。",
          code: `# 保存（推荐）
torch.save(model.state_dict(), "model.pth")

# 加载
model = Net()  # 先重建模型结构
model.load_state_dict(torch.load("model.pth"))
model.eval()`
        },
        difficulty: "easy"
      }
    ];

    // ========== State ==========
    const STORAGE_KEY = 'pytorch-flashcards-v1';
    let cards = [];
    let currentIndex = 0;
    let isFlipped = false;

    // ========== DOM Elements ==========
    const container = document.getElementById('card-container');
    const ratingArea = document.getElementById('rating-area');
    const track = document.getElementById('track');
    const progressRing = document.querySelector('.progress-ring-fill');
    const progressText = document.querySelector('.progress-text');
    const masteredCountEl = document.getElementById('mastered-count');
    const totalCountEl = document.getElementById('total-count');
    const modal = document.getElementById('completion-modal');

    // ========== Syntax Highlighting ==========
    function highlightPython(code) {
      const keywords = ['import', 'from', 'def', 'class', 'return', 'for', 'in', 'if', 'else', 'elif', 'while', 'with', 'as', 'pass', 'True', 'False', 'None', 'and', 'or', 'not', 'is'];

      let html = code
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // Protect strings and comments first to avoid cross-interference
      const strings = [];
      html = html.replace(/(".*?"|'.*?')/g, (match) => {
        strings.push(match);
        return `__STR_${strings.length - 1}__`;
      });

      const comments = [];
      html = html.replace(/#.*$/gm, (match) => {
        comments.push(match);
        return `__COMMENT_${comments.length - 1}__`;
      });

      html = html.replace(/\b\d+(\.\d+)?\b/g, '<span data-type="number">$&</span>');
      html = html.replace(/\b(torch)\b/g, '<span data-type="torch">$1</span>');

      keywords.forEach(kw => {
        const regex = new RegExp(`\\b(${kw})\\b`, 'g');
        html = html.replace(regex, '<span data-type="keyword">$1</span>');
      });

      html = html.replace(/(\w+)\(/g, '<span data-type="function">$1</span>(');

      // Restore comments and strings with styling
      html = html.replace(/__COMMENT_(\d+)__/g, (_, i) => `<span data-type="comment">${comments[i]}</span>`);
      html = html.replace(/__STR_(\d+)__/g, (_, i) => `<span data-type="string">${strings[i]}</span>`);

      return html;
    }

    // ========== Initialization ==========
    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          cards = parsed.cards || defaultCards.map(c => ({ ...c, status: 'new' }));
          currentIndex = Math.min(parsed.currentIndex || 0, cards.length - 1);
        } catch (e) {
          resetCards();
        }
      } else {
        resetCards();
      }

      totalCountEl.textContent = cards.length;
      renderCard(currentIndex, 'next', true);
      renderTrack();
      updateProgress();
      initStarfield();
    }

    function resetCards() {
      cards = defaultCards.map(c => ({ ...c, status: 'new' }));
      currentIndex = 0;
      isFlipped = false;
      saveState();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ cards, currentIndex }));
    }

    // ========== Card Rendering ==========
    function renderCard(index, direction = 'next', initial = false) {
      const card = cards[index];

      container.classList.remove('flipped');
      isFlipped = false;
      ratingArea.classList.remove('active');

      if (initial) {
        document.getElementById('front-category').textContent = card.front.category;
        document.getElementById('front-title').textContent = card.front.title;
        document.getElementById('front-question').textContent = card.front.question;
        document.getElementById('front-hint').textContent = '提示：' + card.front.hint;

        document.getElementById('back-category').textContent = card.front.category + ' · 答案';
        document.getElementById('back-explanation').textContent = card.back.explanation;
        document.getElementById('back-code').innerHTML = highlightPython(card.back.code);
        updateTrack();
        return;
      }

      const animClass = direction === 'next' ? 'slide-out-left' : 'slide-out-right';
      container.classList.add(animClass);

      setTimeout(() => {
        document.getElementById('front-category').textContent = card.front.category;
        document.getElementById('front-title').textContent = card.front.title;
        document.getElementById('front-question').textContent = card.front.question;
        document.getElementById('front-hint').textContent = '提示：' + card.front.hint;

        document.getElementById('back-category').textContent = card.front.category + ' · 答案';
        document.getElementById('back-explanation').textContent = card.back.explanation;
        document.getElementById('back-code').innerHTML = highlightPython(card.back.code);

        container.classList.remove(animClass);
        container.classList.add('slide-in');

        setTimeout(() => {
          container.classList.remove('slide-in');
        }, 500);
      }, 300);

      updateTrack();
    }

    function flipCard() {
      isFlipped = !isFlipped;
      container.classList.toggle('flipped', isFlipped);
      ratingArea.classList.toggle('active', isFlipped);
    }

    // ========== Rating Logic ==========
    function handleRating(rating, btn) {
      if (!isFlipped) return;

      createRipple(btn);

      const card = cards[currentIndex];
      const oldStatus = card.status;

      if (rating === 'again') {
        card.status = 'new';
      } else if (rating === 'hard') {
        card.status = card.status === 'mastered' ? 'learning' : 'learning';
      } else if (rating === 'good' || rating === 'easy') {
        if (oldStatus === 'learning' || oldStatus === 'new') {
          card.status = 'mastered';
        } else {
          card.status = 'mastered';
        }
      }

      saveState();
      updateProgress();
      updateTrack();

      setTimeout(() => {
        nextCard();
      }, 300);
    }

    function nextCard() {
      const nextIndex = findNextCardIndex(currentIndex);
      if (nextIndex === -1) {
        showCompletion();
        return;
      }
      currentIndex = nextIndex;
      saveState();
      renderCard(currentIndex, 'next');
    }

    function prevCard() {
      currentIndex = (currentIndex - 1 + cards.length) % cards.length;
      saveState();
      renderCard(currentIndex, 'prev');
    }

    function findNextCardIndex(start) {
      const hasUnmastered = cards.some(c => c.status !== 'mastered');
      if (!hasUnmastered) return -1;

      for (let i = 1; i <= cards.length; i++) {
        const idx = (start + i) % cards.length;
        if (cards[idx].status !== 'mastered') return idx;
      }
      return -1;
    }

    function jumpToCard(index) {
      if (index === currentIndex) return;
      const direction = index > currentIndex ? 'next' : 'prev';
      currentIndex = index;
      saveState();
      renderCard(currentIndex, direction);
    }

    // ========== Progress & Track ==========
    function updateProgress() {
      const mastered = cards.filter(c => c.status === 'mastered').length;
      const total = cards.length;
      const percent = total > 0 ? mastered / total : 0;
      const circumference = 2 * Math.PI * 28;
      const offset = circumference * (1 - percent);

      progressRing.style.strokeDashoffset = offset;
      progressText.textContent = Math.round(percent * 100) + '%';
      masteredCountEl.textContent = mastered;
    }

    function renderTrack() {
      track.innerHTML = '';
      cards.forEach((card, index) => {
        const dot = document.createElement('div');
        dot.className = 'track-dot';
        dot.dataset.index = index;
        dot.title = card.front.title;
        dot.addEventListener('click', () => jumpToCard(index));
        track.appendChild(dot);
      });
      updateTrack();
    }

    function updateTrack() {
      const dots = track.querySelectorAll('.track-dot');
      dots.forEach((dot, index) => {
        dot.classList.remove('active', 'learning', 'mastered');
        if (index === currentIndex) dot.classList.add('active');
        if (cards[index].status === 'learning') dot.classList.add('learning');
        if (cards[index].status === 'mastered') dot.classList.add('mastered');
      });
    }

    // ========== Completion Modal ==========
    function showCompletion() {
      const mastered = cards.filter(c => c.status === 'mastered').length;
      document.getElementById('completion-message').textContent = 
        `你已掌握 ${mastered} / ${cards.length} 张卡片，继续加油！`;
      modal.classList.add('show');
    }

    function hideCompletion() {
      modal.classList.remove('show');
    }

    function resetAll() {
      hideCompletion();
      resetCards();
      renderCard(0, 'next');
      updateProgress();
      updateTrack();
    }

    // ========== Ripple Effect ==========
    function createRipple(btn) {
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (rect.width / 2 - size / 2) + 'px';
      ripple.style.top = (rect.height / 2 - size / 2) + 'px';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }

    // ========== Starfield Background ==========
    function initStarfield() {
      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      let width, height;
      let stars = [];
      let mouseX = 0, mouseY = 0;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initStars();
      }

      function initStars() {
        stars = [];
        const count = Math.floor((width * height) / 12000);
        for (let i = 0; i < Math.min(count, 120); i++) {
          stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 1.5 + 0.5,
            speedX: (Math.random() - 0.5) * 0.3,
            speedY: (Math.random() - 0.5) * 0.3 - 0.1,
            opacity: Math.random() * 0.5 + 0.2,
            twinkle: Math.random() * Math.PI * 2
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);

        stars.forEach(star => {
          const parallaxX = (mouseX - width / 2) * 0.02 * star.size;
          const parallaxY = (mouseY - height / 2) * 0.02 * star.size;
          const twinkle = Math.sin(star.twinkle) * 0.15 + star.opacity;

          ctx.beginPath();
          ctx.arc(star.x + parallaxX, star.y + parallaxY, star.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(224, 242, 254, ${twinkle})`;
          ctx.fill();

          star.x += star.speedX;
          star.y += star.speedY;
          star.twinkle += 0.02;

          if (star.x < 0) star.x = width;
          if (star.x > width) star.x = 0;
          if (star.y < 0) star.y = height;
          if (star.y > height) star.y = 0;
        });

        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      resize();
      draw();
    }

    // ========== Event Listeners ==========
    container.addEventListener('click', flipCard);

    document.querySelectorAll('.rating-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        handleRating(btn.dataset.rating, btn);
      });
    });

    document.getElementById('reset-btn').addEventListener('click', resetAll);

    document.addEventListener('keydown', (e) => {
      if (modal.classList.contains('show')) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          resetAll();
        }
        return;
      }

      if (e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        flipCard();
      } else if (e.key === '1') {
        const btn = document.querySelector('[data-rating="again"]');
        if (isFlipped) handleRating('again', btn);
      } else if (e.key === '2') {
        const btn = document.querySelector('[data-rating="hard"]');
        if (isFlipped) handleRating('hard', btn);
      } else if (e.key === '3') {
        const btn = document.querySelector('[data-rating="good"]');
        if (isFlipped) handleRating('good', btn);
      } else if (e.key === '4') {
        const btn = document.querySelector('[data-rating="easy"]');
        if (isFlipped) handleRating('easy', btn);
      } else if (e.key === 'ArrowLeft') {
        prevCard();
      } else if (e.key === 'ArrowRight') {
        nextCard();
      } else if (e.key === 'r' || e.key === 'R') {
        resetAll();
      }
    });

    // ========== Start ==========
    init();
  </script>
</body>
</html>
