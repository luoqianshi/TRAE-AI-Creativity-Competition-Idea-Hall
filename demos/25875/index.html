<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 旅行规划师</title>
    <style>
        :root {
            --primary-blue: #1e88e5;
            --primary-blue-dark: #1565c0;
            --primary-orange: #ff7043;
            --primary-orange-dark: #f4511e;
            --bg-gradient-start: #e3f2fd;
            --bg-gradient-end: #fff3e0;
            --card-bg: #ffffff;
            --text-dark: #263238;
            --text-gray: #607d8b;
            --border-color: #e0e0e0;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.12);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.15);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-dark);
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px;
        }

        header .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--primary-blue-dark);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-gray);
            font-size: 1.05rem;
        }

        /* Main Card */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 30px;
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 10px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group label .icon {
            font-size: 1rem;
        }

        .form-group input,
        .form-group select {
            padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            color: var(--text-dark);
            background: #fafafa;
            transition: all 0.3s ease;
        }

        .form-group input:hover,
        .form-group select:hover {
            border-color: #bdbdbd;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-blue);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(30, 136, 229, 0.15);
        }

        .form-group input::placeholder {
            color: #b0bec5;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-orange) 100%);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(30, 136, 229, 0.35);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn .icon {
            font-size: 1.3rem;
        }

        /* Result Area */
        .result-area {
            display: none;
            margin-top: 30px;
        }

        .result-area.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .result-header h2 {
            color: var(--primary-blue-dark);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .result-header h2 .icon {
            font-size: 1.5rem;
        }

        /* Result Content */
        .result-content {
            display: grid;
            gap: 20px;
        }

        /* Info Cards */
        .info-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .info-card {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border-radius: var(--radius-md);
            padding: 18px;
            text-align: center;
        }

        .info-card .icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .info-card .label {
            font-size: 0.8rem;
            color: var(--text-gray);
            margin-bottom: 4px;
        }

        .info-card .value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-blue-dark);
        }

        /* Section Title */
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
        }

        .section-title .icon {
            font-size: 1.5rem;
        }

        .section-title h3 {
            font-size: 1.2rem;
            color: var(--text-dark);
        }

        /* Day Cards */
        .day-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            padding: 25px;
            box-shadow: var(--shadow-sm);
            border-left: 5px solid var(--primary-blue);
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .day-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateX(5px);
        }

        .day-card:last-child {
            margin-bottom: 0;
        }

        .day-card .day-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .day-card .day-badge {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-blue-dark) 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .day-card .day-theme {
            color: var(--text-gray);
            font-size: 0.9rem;
        }

        .day-card .activities {
            display: grid;
            gap: 12px;
        }

        .activity-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 15px;
            background: #f8fafc;
            border-radius: var(--radius-sm);
        }

        .activity-item .time-badge {
            background: var(--primary-orange);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            white-space: nowrap;
            font-weight: 500;
        }

        .activity-item .activity-content {
            flex: 1;
        }

        .activity-item .place {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .activity-item .desc {
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        /* Food Section */
        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .food-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            background: linear-gradient(135deg, #fff8f0 0%, #fff3e0 100%);
            border-radius: var(--radius-md);
            border-left: 4px solid var(--primary-orange);
        }

        .food-card .food-icon {
            font-size: 2rem;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 50%;
            box-shadow: var(--shadow-sm);
        }

        .food-card .food-info {
            flex: 1;
        }

        .food-card .food-name {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .food-card .food-dish {
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 4px;
        }

        .food-card .food-meta {
            display: flex;
            gap: 12px;
            font-size: 0.85rem;
        }

        .food-card .meal-type {
            color: var(--primary-orange);
            font-weight: 500;
        }

        .food-card .price {
            color: var(--primary-blue);
            font-weight: 500;
        }

        /* Budget Section */
        .budget-overview {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .budget-overview .total,
        .budget-overview .daily {
            padding: 0 20px;
        }

        .budget-overview .total {
            border-right: 1px solid #a5d6a7;
        }

        .budget-overview .label {
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 5px;
        }

        .budget-overview .amount {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2e7d32;
        }

        .budget-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .budget-table th,
        .budget-table td {
            padding: 14px 18px;
            text-align: left;
        }

        .budget-table th {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-blue-dark) 100%);
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .budget-table tr:not(:last-child) td {
            border-bottom: 1px solid var(--border-color);
        }

        .budget-table tr:hover td {
            background: #f8fafc;
        }

        .budget-table .item-name {
            font-weight: 600;
        }

        .budget-table .item-desc {
            font-size: 0.8rem;
            color: var(--text-gray);
        }

        .budget-table .percent {
            text-align: center;
            font-weight: 600;
            color: var(--primary-blue);
        }

        .budget-table .amount {
            text-align: right;
            font-weight: 600;
            color: #2e7d32;
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-gray);
        }

        .loading-state .spinner {
            font-size: 3rem;
            margin-bottom: 15px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8rem;
            }

            .card {
                padding: 25px;
            }

            .info-cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .day-card .day-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .activity-item {
                flex-direction: column;
                gap: 10px;
            }

            .budget-overview {
                flex-direction: column;
                gap: 15px;
            }

            .budget-overview .total {
                border-right: none;
                border-bottom: 1px solid #a5d6a7;
                padding-bottom: 15px;
            }

            .budget-table th,
            .budget-table td {
                padding: 10px 12px;
                font-size: 0.85rem;
            }

            .budget-table .item-desc {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .info-cards {
                grid-template-columns: 1fr;
            }

            header .icon {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="icon">✈️</div>
            <h1>AI 旅行规划师</h1>
            <p>智能规划专属行程，让每一次出发都充满期待</p>
        </header>

        <div class="card">
            <div class="form-grid">
                <div class="form-group">
                    <label><span class="icon">📍</span> 目的地</label>
                    <input type="text" id="destination" placeholder="例如：成都、云南、日本">
                </div>
                <div class="form-group">
                    <label><span class="icon">📅</span> 出行天数</label>
                    <input type="number" id="days" value="3" min="1" max="15">
                </div>
                <div class="form-group">
                    <label><span class="icon">💰</span> 预算金额（元）</label>
                    <input type="number" id="budget" value="5000" min="100">
                </div>
                <div class="form-group">
                    <label><span class="icon">👥</span> 同行人类型</label>
                    <select id="companion">
                        <option value="alone">独自旅行</option>
                        <option value="couple">情侣出行</option>
                        <option value="family">亲子游</option>
                        <option value="elder">带老人</option>
                        <option value="friends">朋友结伴</option>
                    </select>
                </div>
            </div>
            <button class="btn" onclick="generatePlan()">
                <span class="icon">✨</span>
                生成规划
            </button>

            <div class="result-area" id="resultArea">
                <div class="result-header">
                    <h2 id="resultTitle"><span class="icon">🗺️</span> 您的旅行规划</h2>
                </div>
                <div class="result-content" id="resultContent"></div>
            </div>
        </div>
    </div>

    <script>
        // 请在此处填入您的 API Key（硅基流动免费额度：https://cloud.siliconflow.cn）
        const API_KEY = '';
        const API_URL = 'https://api.siliconflow.cn/v1/chat/completions';

        const companionText = {
            'alone': '独自旅行',
            'couple': '情侣出行',
            'family': '亲子游',
            'elder': '带老人',
            'friends': '朋友结伴'
        };

        async function generatePlan() {
            const destination = document.getElementById('destination').value.trim();
            const days = parseInt(document.getElementById('days').value);
            const budget = parseInt(document.getElementById('budget').value);
            const companion = document.getElementById('companion').value;

            // 验证所有字段
            if (!destination) {
                alert('请输入目的地');
                return;
            }
            if (!days || days < 1 || days > 30) {
                alert('请输入有效的出行天数（1-30天）');
                return;
            }
            if (!budget || budget < 100 || budget > 10000000) {
                alert('请输入有效的预算金额（100-10000000元）');
                return;
            }
            if (!companion) {
                alert('请选择同行人类型');
                return;
            }

            const btn = document.querySelector('.btn');
            const resultArea = document.getElementById('resultArea');
            const resultTitle = document.getElementById('resultTitle');
            const resultContent = document.getElementById('resultContent');

            // 禁用按钮，显示加载状态
            btn.disabled = true;
            btn.innerHTML = '<span class="icon">⏳</span> 生成中...';

            resultTitle.textContent = `${destination} ${days}天${companionText[companion]}旅行规划`;
            resultArea.classList.add('show');
            resultContent.innerHTML = `<div class="loading-state"><div class="spinner">✈️</div><p>正在生成专属旅行规划，请稍候...</p></div>`;

            const prompt = `请为我去${destination}的${days}天旅行做一份规划，预算${budget}元，同行人是${companionText[companion]}。

请严格按照以下JSON格式输出（不要添加任何其他内容，只输出JSON）：
{
  "itinerary": [
    {
      "day": 1,
      "activities": [
        {"time": "09:00-12:00", "place": "景点名称", "desc": "简要说明"}
      ]
    }
  ],
  "foods": [
    {"name": "餐厅名称", "dish": "推荐菜", "price": "人均价格", "type": "早餐/午餐/晚餐"}
  ],
  "budget": {
    "transport": {"percent": 20, "desc": "机票/火车票/当地交通"},
    "hotel": {"percent": 30, "desc": "酒店/民宿"},
    "food": {"percent": 25, "desc": "早中晚餐及小吃"},
    "ticket": {"percent": 15, "desc": "景点门票及活动"},
    "other": {"percent": 10, "desc": "购物/通讯/应急"}
  }
}`;

            try {
                let responseText = '';

                if (API_KEY) {
                    // 调用真实 API
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${API_KEY}`
                        },
                        body: JSON.stringify({
                            model: 'deepseek-ai/DeepSeek-V3',
                            messages: [{ role: 'user', content: prompt }],
                            temperature: 0.7
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`API 请求失败: ${response.status}`);
                    }

                    const data = await response.json();
                    responseText = data.choices?.[0]?.message?.content || '';

                    // 检查响应内容是否为空
                    if (!responseText || responseText.trim() === '') {
                        throw new Error('API 返回内容为空，请稍后重试');
                    }
                } else {
                    // 无 API Key 时使用模拟数据（演示用）
                    responseText = getMockResponse(destination, days, budget, companion);
                }

                // 解析并渲染结果
                const result = parseAIResponse(responseText, days, budget);
                renderResult(result, destination, days, budget, companion);

            } catch (error) {
                console.error('生成失败:', error);
                // 重置标题为错误状态
                resultTitle.innerHTML = '<span class="icon">❌</span> 生成失败';
                resultContent.innerHTML = `<div class="loading-state" style="color:#e74c3c;">
                    <div class="spinner">❌</div>
                    <p>生成失败: ${error.message}</p>
                    <small>请检查网络连接或 API 配置</small>
                </div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span class="icon">✨</span> 生成规划';
            }
        }

        function parseAIResponse(responseText, days, budget) {
            try {
                // 尝试提取 JSON - 使用非贪婪匹配，只匹配第一个完整的 JSON 对象
                let jsonStr = responseText;
                const jsonMatch = responseText.match(/\{[\s\S]*?\}(?=\s*$|\s*[,\]])/);
                if (jsonMatch) {
                    jsonStr = jsonMatch[0];
                }
                return JSON.parse(jsonStr);
            } catch (e) {
                // JSON 解析失败，使用格式化的文本响应
                return parseTextResponse(responseText, days, budget);
            }
        }

        function parseTextResponse(text, days, budget) {
            // 尝试从文本中提取结构化信息
            const result = {
                itinerary: [],
                foods: [],
                budget: {
                    transport: { percent: 20, desc: '机票/火车票/当地交通' },
                    hotel: { percent: 30, desc: '酒店/民宿' },
                    food: { percent: 25, desc: '早中晚餐及小吃' },
                    ticket: { percent: 15, desc: '景点门票及活动' },
                    other: { percent: 10, desc: '购物/通讯/应急' }
                }
            };

            // 解析每日行程
            const dayMatches = text.match(/第[一二三四五六七八九十\d]+天[\s\S]*?(?=第[一二三四五六七八九十\d]+天|$)/gi);
            if (dayMatches) {
                dayMatches.forEach((dayText, idx) => {
                    if (idx >= days) return;
                    const actMatches = dayText.match(/\d{2}:\d{2}[-~]\d{2}:\d{2}[\s\S]*?(?=\d{2}:\d{2}[-~]|第|$)/gi);
                    const activities = (actMatches || []).map(act => {
                        const timeMatch = act.match(/(\d{2}:\d{2}[-~]\d{2}:\d{2})/);
                        const descMatch = act.replace(/\d{2}:\d{2}[-~]\d{2}:\d{2}[,，\s]*/, '').trim();
                        // 按空格、破折号或冒号分割，取第一部分作为景点名称
                        const placeParts = descMatch.split(/[\s\-—:：]/);
                        const place = placeParts[0] || descMatch.substring(0, 30);
                        return {
                            time: timeMatch ? timeMatch[1] : '09:00-12:00',
                            place: place,
                            desc: descMatch
                        };
                    }).slice(0, 3);
                    if (activities.length > 0) {
                        result.itinerary.push({ day: idx + 1, activities });
                    }
                });
            }

            // 如果没有解析到行程，使用默认
            if (result.itinerary.length === 0) {
                for (let i = 1; i <= days; i++) {
                    result.itinerary.push({
                        day: i,
                        activities: [
                            { time: '09:00-12:00', place: '当地著名景点', desc: '游览观光' },
                            { time: '14:00-18:00', place: '特色街区', desc: '逛街购物' },
                            { time: '18:00-21:00', place: '特色餐厅', desc: '品尝美食' }
                        ]
                    });
                }
            }

            // 解析美食 - 只匹配中文的【】，避免匹配 JSON 中的 {}
            const foodMatches = text.match(/【.*?】[^\n]*/g) || [];
            if (foodMatches.length > 0) {
                result.foods = foodMatches.slice(0, 6).map((f, i) => ({
                    name: `推荐餐厅${i + 1}`,
                    dish: f.replace(/【|】/g, ''),
                    price: '¥80-150',
                    type: ['早餐', '午餐', '晚餐', '小吃', '甜点', '夜宵'][i % 6]
                }));
            } else {
                result.foods = [
                    { name: '当地特色餐厅', dish: '招牌菜', price: '¥100-200', type: '午餐' },

        function renderResult(data, destination, days, budget, companion) {
            const resultContent = document.getElementById('resultContent');

            const iconMap = {
                transport: '🚗',
                hotel: '🏨',
                food: '🍽️',
                ticket: '🎫',

            };
            const foodIcons = ['🍜', '🍣', '🍲', '🍖', '🥘', '🍛'];

            // 行程概览 - 信息卡片
            let html = `
                <div class="info-cards">

                        <div class="label">目的地</div>

                    <div class="info-card">

                    </div>
                    <div class="info-card">
                        <div class="icon">👥</div>
                        <div class="label">同行人</div>
                        <div class="value">${companionText[companion]}</div>
                    </div>
                </div>
            `;

            // 每日行程 - 卡片形式
            html += `
                <div class="section-title">
                    <span class="icon">🗓️</span>
                    <h3>每日行程安排</h3>
                </div>
            `;
            const itinerary = data.itinerary || [];

            if (itinerary.length > 0) {
                itinerary.forEach(dayData => {
                    html += `
                        <div class="day-card">
                            <div class="day-header">
                                <span class="day-badge">第 ${dayData.day} 天</span>
                                <span class="day-theme">🏷️ ${destination} 之旅</span>
                            </div>
                            <div class="activities">
                                ${(dayData.activities || []).map((act, idx) => `
                                    <div class="activity-item">
                                        <span class="time-badge">${act.time}</span>
                                        <div class="activity-content">
                                            <div class="place">🏛️ ${act.place}</div>
                                            <div class="desc">${act.desc}</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });
            } else {
                for (let i = 1; i <= days; i++) {
                    html += `
                        <div class="day-card">
                            <div class="day-header">
                                <span class="day-badge">第 ${i} 天</span>
                                <span class="day-theme">🏷️ ${destination} 之旅</span>
                            </div>
                            <div class="activities">
                                <div class="activity-item">

                                    <div class="activity-content">
                                        <div class="place">🏛️ 当地著名景点</div>
                                        <div class="desc">根据您的需求安排特色行程</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }

            // 美食推荐 - 卡片网格
            html += `
                <div class="section-title">
                    <span class="icon">🍴</span>
                    <h3>美食推荐</h3>
                </div>
                <div class="food-grid">
            `;
            const foods = data.foods || [];
            if (foods.length > 0) {
                foods.forEach((food, i) => {
                    html += `
                        <div class="food-card">
                            <div class="food-icon">${foodIcons[i % foodIcons.length]}</div>
                            <div class="food-info">
                                <div class="food-name">${food.name}</div>
                                <div class="food-dish">推荐：${food.dish}</div>
                                <div class="food-meta">
                                    <span class="meal-type">${food.type}</span>
                                    <span class="price">${food.price}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else {
                html += `
                    <div class="food-card">
                        <div class="food-icon">🍽️</div>
                        <div class="food-info">
                            <div class="food-name">当地特色餐厅</div>
                            <div class="food-dish">特色招牌菜</div>
                            <div class="food-meta">
                                <span class="meal-type">午餐</span>
                                <span class="price">¥100-200</span>
                            </div>
                        </div>
                    </div>
                `;
            }
            html += `</div>`;

            // 预算分配
            html += `
                <div class="section-title">
                    <span class="icon">💵</span>
                    <h3>预算分配方案</h3>
                </div>
                <div class="budget-overview">
                    <div class="total">
                        <div class="label">总预算</div>
                        <div class="amount">¥${budget.toLocaleString()}</div>
                    </div>
                    <div class="daily">
                        <div class="label">日均预算</div>
                        <div class="amount">¥${Math.round(budget / days).toLocaleString()}</div>
                    </div>
                </div>
                <table class="budget-table">
                    <thead>
                        <tr>
                            <th>费用项目</th>
                            <th>占比</th>
                            <th>金额</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            const budgetData = data.budget || {};
            const budgetItems = [
                { key: 'transport', name: '交通', icon: '🚗', ...budgetData.transport },
                { key: 'hotel', name: '住宿', icon: '🏨', ...budgetData.hotel },
                { key: 'food', name: '餐饮', icon: '🍽️', ...budgetData.food },
                { key: 'ticket', name: '门票', icon: '🎫', ...budgetData.ticket },
                { key: 'other', name: '其他', icon: '🎁', ...budgetData.other }
            ];

            budgetItems.forEach(item => {
                html += `
                    <tr>
                        <td>
                            <span class="item-name">${item.icon} ${item.name}</span>
                            <br><span class="item-desc">${item.desc || ''}</span>
                        </td>
                        <td class="percent">${item.percent}%</td>
                        <td class="amount">¥${Math.round(budget * item.percent / 100).toLocaleString()}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            resultContent.innerHTML = html;
        }
