<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>一掷千金 - Deal or No Deal</title>
<style>
:root {
  --gold: #d4a853;
  --gold-light: #f0d68a;
  --gold-dark: #a07830;
  --bg-dark: #0a0a12;
  --bg-card: #15152a;
  --bg-panel: #1a1a35;
  --text-primary: #f0e6d0;
  --text-secondary: #887755;
  --danger: #e74c3c;
  --success: #2ecc71;
  --accent-blue: #4a9eff;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

@font-face {
  font-family: 'GameFont';
  src: local('PingFang SC'), local('Microsoft YaHei'), local('Helvetica Neue');
}

body {
  font-family: 'GameFont', sans-serif;
  background: var(--bg-dark);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ===== Background Particles ===== */
#particles-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ===== SCREENS ===== */
.screen {
  display: none;
  position: relative;
  z-index: 1;
  min-height: 100vh;
  padding: 20px;
}
.screen.active { display: flex; flex-direction: column; align-items: center; }

/* ===== WELCOME SCREEN ===== */
#welcome-screen {
  justify-content: center;
  text-align: center;
  gap: 30px;
}

.game-logo {
  width: 280px;
  height: 280px;
  position: relative;
  margin: 0 auto;
}

.logo-box {
  width: 200px; height: 200px;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 80px;
  margin: 0 auto;
  box-shadow: 0 20px 60px rgba(212, 168, 83, 0.3), inset 0 2px 4px rgba(255,255,255,0.3);
  position: relative;
  animation: logoFloat 3s ease-in-out infinite;
}

.logo-box::before {
  content: '💎';
  font-size: 80px;
}

@keyframes logoFloat {
  0%, 100% { transform: translateY(0) rotateX(0deg); }
  50% { transform: translateY(-15px) rotateX(5deg); }
}

.game-title {
  font-size: 42px;
  font-weight: 900;
  background: linear-gradient(180deg, var(--gold-light), var(--gold), var(--gold-dark));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  letter-spacing: 8px;
}

.game-subtitle {
  font-size: 16px;
  color: var(--text-secondary);
  letter-spacing: 4px;
  text-transform: uppercase;
}

/* ===== BUTTONS ===== */
.btn {
  padding: 16px 48px;
  border: none;
  border-radius: 50px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 3px;
  position: relative;
  overflow: hidden;
}

.btn-primary {
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #1a1a2e;
  box-shadow: 0 8px 30px rgba(212, 168, 83, 0.4);
}

.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 40px rgba(212, 168, 83, 0.6);
}

.btn-danger {
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  color: white;
  box-shadow: 0 8px 30px rgba(231, 76, 60, 0.4);
}

.btn-danger:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 40px rgba(231, 76, 60, 0.6);
}

.btn-success {
  background: linear-gradient(135deg, #2ecc71, #27ae60);
  color: white;
  box-shadow: 0 8px 30px rgba(46, 204, 113, 0.4);
}

.btn-success:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 40px rgba(46, 204, 113, 0.6);
}

.btn-outline {
  background: transparent;
  border: 2px solid var(--gold);
  color: var(--gold);
}

.btn-outline:hover {
  background: rgba(212, 168, 83, 0.1);
  transform: translateY(-3px);
}

.btn-small {
  padding: 10px 24px;
  font-size: 14px;
}

/* ===== SETTINGS PANEL ===== */
.settings-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 100;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: var(--bg-panel);
  border: 2px solid var(--gold-dark);
  color: var(--gold);
  font-size: 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}
.settings-toggle:hover {
  background: var(--gold-dark);
  color: white;
}

.settings-panel {
  position: fixed;
  top: 0; right: -400px;
  width: 380px;
  max-width: 90vw;
  height: 100vh;
  background: var(--bg-card);
  border-left: 2px solid var(--gold-dark);
  z-index: 200;
  padding: 30px;
  transition: right 0.4s ease;
  overflow-y: auto;
}
.settings-panel.open { right: 0; }

.settings-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 199;
  display: none;
}
.settings-overlay.open { display: block; }

.settings-panel h2 {
  color: var(--gold);
  margin-bottom: 30px;
  font-size: 24px;
  letter-spacing: 3px;
}

.setting-group {
  margin-bottom: 24px;
}

.setting-group label {
  display: block;
  color: var(--text-secondary);
  font-size: 13px;
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.setting-group select,
.setting-group input[type="number"],
.setting-group input[type="text"] {
  width: 100%;
  padding: 12px 16px;
  background: var(--bg-dark);
  border: 1px solid var(--gold-dark);
  border-radius: 10px;
  color: var(--text-primary);
  font-size: 16px;
  outline: none;
}

.setting-group select:focus,
.setting-group input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 10px rgba(212, 168, 83, 0.2);
}

.toggle-switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.switch {
  width: 52px;
  height: 28px;
  background: var(--bg-dark);
  border-radius: 14px;
  position: relative;
  cursor: pointer;
  border: 2px solid var(--gold-dark);
}

.switch.active {
  background: var(--gold);
  border-color: var(--gold);
}

.switch::after {
  content: '';
  position: absolute;
  width: 22px;
  height: 22px;
  background: white;
  border-radius: 50%;
  top: 1px;
  left: 1px;
  transition: transform 0.3s;
}

.switch.active::after {
  transform: translateX(24px);
}

/* ===== GAME SCREEN ===== */
#game-screen {
  padding-bottom: 40px;
}

.game-header {
  width: 100%;
  max-width: 800px;
  text-align: center;
  padding: 15px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.round-info {
  font-size: 14px;
  color: var(--text-secondary);
  letter-spacing: 2px;
}

.round-info span {
  color: var(--gold);
  font-weight: 700;
  font-size: 18px;
}

.my-case-badge {
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #1a1a2e;
  padding: 8px 20px;
  border-radius: 25px;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 1px;
  box-shadow: 0 4px 15px rgba(212, 168, 83, 0.4);
}

/* ===== CASES GRID ===== */
.cases-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
  width: 100%;
  max-width: 800px;
  margin: 0 auto 20px;
}

.case-item {
  aspect-ratio: 1;
  perspective: 600px;
  cursor: pointer;
}

.case-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s ease;
  border-radius: 12px;
}

.case-item.opened .case-inner {
  transform: rotateY(180deg);
}

.case-item.my-case .case-front {
  border: 2px solid var(--gold);
  box-shadow: 0 0 20px rgba(212, 168, 83, 0.5);
}

.case-item.selected-to-open .case-front {
  animation: caseGlow 0.5s ease-in-out;
}

@keyframes caseGlow {
  0%, 100% { box-shadow: 0 0 10px rgba(212, 168, 83, 0.3); }
  50% { box-shadow: 0 0 30px rgba(212, 168, 83, 0.8); }
}

.case-front, .case-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.case-front {
  background: linear-gradient(145deg, #2a2a50, #1a1a35);
  border: 1px solid rgba(212, 168, 83, 0.3);
  box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.1);
}

.case-front .case-number {
  font-size: 22px;
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 2px 8px rgba(212, 168, 83, 0.3);
}

.case-front .case-icon {
  font-size: 24px;
  margin-top: 4px;
}

.case-item:not(.opened):not(.my-case):hover .case-front {
  border-color: var(--gold);
  box-shadow: 0 8px 25px rgba(212, 168, 83, 0.4);
  transform: scale(1.05);
}

.case-back {
  background: linear-gradient(145deg, var(--gold), var(--gold-dark));
  transform: rotateY(180deg);
  padding: 4px;
}

.case-back .case-amount {
  font-size: 13px;
  font-weight: 900;
  color: #1a1a2e;
  text-align: center;
  word-break: break-all;
  line-height: 1.2;
}

.case-item.opened {
  cursor: default;
  pointer-events: none;
}

.case-item.disabled {
  pointer-events: none;
  opacity: 0.4;
}

/* ===== MONEY BOARD ===== */
.money-board {
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
}

.money-board h3 {
  text-align: center;
  color: var(--text-secondary);
  font-size: 13px;
  letter-spacing: 3px;
  margin-bottom: 10px;
  text-transform: uppercase;
}

.money-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 6px;
}

.money-item {
  padding: 8px 12px;
  background: var(--bg-card);
  border-radius: 8px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  border-left: 3px solid var(--gold-dark);
  transition: all 0.3s;
}

.money-item.eliminated {
  opacity: 0.3;
  border-left-color: var(--danger);
  text-decoration: line-through;
  background: rgba(231, 76, 60, 0.05);
}

.money-item.low { color: #88cc88; }
.money-item.mid { color: var(--gold); }
.money-item.high { color: #ff6b6b; }
.money-item.jackpot { color: #ff4444; font-weight: 900; font-size: 15px; }

/* ===== GAME MESSAGE ===== */
.game-message {
  width: 100%;
  max-width: 800px;
  text-align: center;
  padding: 20px;
  margin: 15px auto;
  font-size: 18px;
  color: var(--text-secondary);
  letter-spacing: 2px;
  min-height: 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.game-message.highlight {
  color: var(--gold);
  font-size: 22px;
  font-weight: 700;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* ===== BANKER MODAL ===== */
.banker-modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.85);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.banker-modal.active {
  display: flex;
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.banker-content {
  background: linear-gradient(180deg, #1a1a35, #0d0d20);
  border: 2px solid var(--gold-dark);
  border-radius: 24px;
  padding: 40px;
  text-align: center;
  max-width: 500px;
  width: 100%;
  box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 40px rgba(212, 168, 83, 0.2);
  animation: slideUp 0.6s ease;
  position: relative;
  overflow: hidden;
}

@keyframes slideUp {
  from { transform: translateY(60px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.banker-content::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: conic-gradient(from 0deg, transparent, rgba(212, 168, 83, 0.05), transparent, rgba(212, 168, 83, 0.05));
  animation: rotateBg 10s linear infinite;
}

@keyframes rotateBg {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.banker-phone {
  font-size: 60px;
  margin-bottom: 15px;
  position: relative;
  z-index: 1;
  animation: phoneRing 0.5s ease-in-out 3;
}

@keyframes phoneRing {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(15deg); }
  75% { transform: rotate(-15deg); }
}

.banker-label {
  font-size: 14px;
  color: var(--text-secondary);
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-bottom: 20px;
  position: relative;
  z-index: 1;
}

.banker-offer-amount {
  font-size: 48px;
  font-weight: 900;
  background: linear-gradient(180deg, var(--gold-light), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 10px;
  position: relative;
  z-index: 1;
  animation: countUp 0.5s ease;
}

.banker-offer-label {
  font-size: 14px;
  color: var(--text-secondary);
  letter-spacing: 2px;
  margin-bottom: 30px;
  position: relative;
  z-index: 1;
}

.banker-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}

.banker-tip {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 20px;
  position: relative;
  z-index: 1;
  opacity: 0.6;
}

/* ===== SWAP MODAL ===== */
.swap-modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.85);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.swap-modal.active { display: flex; }

.swap-content {
  background: linear-gradient(180deg, #1a1a35, #0d0d20);
  border: 2px solid var(--gold-dark);
  border-radius: 24px;
  padding: 40px;
  text-align: center;
  max-width: 500px;
  width: 100%;
  box-shadow: 0 30px 80px rgba(0,0,0,0.8);
}

.swap-cases {
  display: flex;
  gap: 30px;
  justify-content: center;
  margin: 30px 0;
}

.swap-case-display {
  width: 120px;
  height: 120px;
  background: linear-gradient(145deg, #2a2a50, #1a1a35);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--gold-dark);
}

.swap-case-display.current {
  border-color: var(--gold);
  box-shadow: 0 0 25px rgba(212, 168, 83, 0.4);
}

.swap-case-number {
  font-size: 28px;
  font-weight: 900;
  color: var(--gold);
}

.swap-case-label {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 5px;
}

.swap-or {
  font-size: 28px;
  color: var(--gold);
  align-self: center;
  font-weight: 900;
}

/* ===== REVEAL MODAL ===== */
.reveal-modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.9);
  z-index: 600;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.reveal-modal.active { display: flex; }

.reveal-content {
  text-align: center;
  max-width: 500px;
  width: 100%;
}

.reveal-case {
  width: 160px;
  height: 160px;
  background: linear-gradient(145deg, var(--gold), var(--gold-dark));
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 0 auto 30px;
  box-shadow: 0 20px 60px rgba(212, 168, 83, 0.4);
  animation: revealPop 0.8s ease;
}

@keyframes revealPop {
  0% { transform: scale(0.5) rotateY(180deg); opacity: 0; }
  50% { transform: scale(1.1) rotateY(0deg); }
  100% { transform: scale(1) rotateY(0deg); opacity: 1; }
}

.reveal-case .case-number {
  font-size: 36px;
  font-weight: 900;
  color: #1a1a2e;
}

.reveal-amount {
  font-size: 60px;
  font-weight: 900;
  margin-bottom: 10px;
}

.reveal-amount.win {
  background: linear-gradient(180deg, var(--gold-light), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: winGlow 1s ease-in-out infinite alternate;
}

@keyframes winGlow {
  from { filter: drop-shadow(0 0 10px rgba(212, 168, 83, 0.5)); }
  to { filter: drop-shadow(0 0 30px rgba(212, 168, 83, 0.8)); }
}

.reveal-amount.lose {
  color: var(--text-secondary);
}

.reveal-message {
  font-size: 24px;
  margin-bottom: 30px;
  color: var(--text-secondary);
}

/* ===== OPEN AMOUNT POPUP ===== */
.amount-popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: linear-gradient(145deg, var(--gold), var(--gold-dark));
  color: #1a1a2e;
  padding: 30px 50px;
  border-radius: 20px;
  font-size: 32px;
  font-weight: 900;
  z-index: 300;
  box-shadow: 0 20px 60px rgba(212, 168, 83, 0.5);
  pointer-events: none;
}

.amount-popup.show {
  animation: popIn 1.2s ease forwards;
}

@keyframes popIn {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
  30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
  50% { transform: translate(-50%, -50%) scale(1); }
  80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
}

/* ===== RESULT SCREEN ===== */
#result-screen {
  justify-content: center;
  text-align: center;
  gap: 20px;
}

.result-icon {
  font-size: 100px;
  animation: resultBounce 1s ease infinite;
}

@keyframes resultBounce {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.result-amount {
  font-size: 52px;
  font-weight: 900;
  background: linear-gradient(180deg, var(--gold-light), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.result-label {
  font-size: 18px;
  color: var(--text-secondary);
  letter-spacing: 3px;
}

.result-buttons {
  display: flex;
  gap: 15px;
  margin-top: 20px;
  flex-wrap: wrap;
  justify-content: center;
}

/* ===== PICK INSTRUCTION ===== */
.pick-instruction {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(212, 168, 83, 0.1);
  border: 1px solid var(--gold-dark);
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 14px;
  color: var(--gold);
  margin-top: 8px;
}

/* ===== ROUND PROGRESS ===== */
.round-progress {
  width: 100%;
  max-width: 800px;
  margin: 0 auto 15px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 10px;
}

.progress-bar-bg {
  flex: 1;
  height: 6px;
  background: var(--bg-card);
  border-radius: 3px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-dark), var(--gold));
  border-radius: 3px;
  transition: width 0.5s ease;
}

.progress-text {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
}

/* ===== MOBILE RESPONSIVE ===== */
@media (max-width: 600px) {
  .cases-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .case-front .case-number { font-size: 18px; }
  .case-front .case-icon { font-size: 18px; }
  .case-back .case-amount { font-size: 11px; }

  .money-grid {
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 4px;
  }

  .money-item { padding: 6px 8px; font-size: 12px; }

  .game-title { font-size: 28px; letter-spacing: 4px; }
  .game-subtitle { font-size: 12px; }

  .banker-offer-amount { font-size: 36px; }
  .banker-content { padding: 25px; }

  .reveal-amount { font-size: 42px; }
  .result-amount { font-size: 36px; }

<script>
// ======================== AUDIO SYSTEM ========================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

let soundEnabled = true;

function playSound(type) {
  if (!soundEnabled) return;
  try {
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    switch(type) {
      case 'click':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
        break;
      case 'open':
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
        break;
      case 'open-high':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523, now);
        osc.frequency.setValueAtTime(659, now + 0.1);
        osc.frequency.setValueAtTime(784, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
        break;
      case 'banker':
        osc.type = 'square';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(550, now + 0.2);
        osc.frequency.setValueAtTime(440, now + 0.4);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
        break;
      case 'deal':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523, now);
        osc.frequency.setValueAtTime(659, now + 0.15);
        osc.frequency.setValueAtTime(784, now + 0.3);
        osc.frequency.setValueAtTime(1047, now + 0.45);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        osc.start(now); osc.stop(now + 0.7);
        break;
      case 'no-deal':
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.3);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
        break;
      case 'win':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523, now);
        osc.frequency.setValueAtTime(659, now + 0.2);
        osc.frequency.setValueAtTime(784, now + 0.4);
        osc.frequency.setValueAtTime(1047, now + 0.6);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
        osc.start(now); osc.stop(now + 1.0);
        // second layer
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.connect(gain2); gain2.connect(audioCtx.destination);
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(784, now + 0.3);
        osc2.frequency.setValueAtTime(1047, now + 0.5);
        gain2.gain.setValueAtTime(0.15, now + 0.3);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
        osc2.start(now + 0.3); osc2.stop(now + 1.0);
        break;
      case 'lose':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.5);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
        break;
      case 'reveal':
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.5);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
        break;
      case 'phone':
        for (let i = 0; i < 3; i++) {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.type = 'sine';
          o.frequency.setValueAtTime(1200, now + i * 0.3);
          o.frequency.setValueAtTime(800, now + i * 0.3 + 0.15);
          g.gain.setValueAtTime(0.1, now + i * 0.3);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.3 + 0.25);
          o.start(now + i * 0.3); o.stop(now + i * 0.3 + 0.25);
        }
        return;
    }
  } catch(e) {}
}

// ======================== PARTICLES ========================
const particlesCanvas = document.getElementById('particles-canvas');
const pCtx = particlesCanvas.getContext('2d');
let particlesEnabled = true;
let particles = [];
let particleAnimId = null;

function resizeParticles() {
  particlesCanvas.width = window.innerWidth;
  particlesCanvas.height = window.innerHeight;
}

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * particlesCanvas.width;
    this.y = Math.random() * particlesCanvas.height;
    this.size = Math.random() * 2 + 0.5;
    this.speedY = -Math.random() * 0.3 - 0.1;
    this.speedX = (Math.random() - 0.5) * 0.2;
    this.opacity = Math.random() * 0.5 + 0.1;
    this.color = Math.random() > 0.7 ? '212,168,83' : '150,140,120';
  }
  update() {
    this.y += this.speedY;
    this.x += this.speedX;
    this.opacity += (Math.random() - 0.5) * 0.01;
    if (this.opacity <= 0 || this.opacity >= 0.6) this.speedY *= -1;
    if (this.y < -10 || this.y > particlesCanvas.height + 10) this.reset();
  }
  draw() {
    pCtx.beginPath();
    pCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    pCtx.fillStyle = `rgba(${this.color},${this.opacity})`;
    pCtx.fill();
  }
}

function initParticles() {
  resizeParticles();
  particles = [];
  for (let i = 0; i < 60; i++) {
    particles.push(new Particle());
  }
  animateParticles();
}

function animateParticles() {
  if (!particlesEnabled) {
    pCtx.clearRect(0, 0, particlesCanvas.width, particlesCanvas.height);
    particleAnimId = requestAnimationFrame(animateParticles);
    return;
  }
  pCtx.clearRect(0, 0, particlesCanvas.width, particlesCanvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  particleAnimId = requestAnimationFrame(animateParticles);
}

window.addEventListener('resize', resizeParticles);
initParticles();

// ======================== GAME STATE ========================
const DEFAULT_VALUES = [
  0.01, 0.1, 0.5, 1, 2, 5, 10, 20, 50, 100, 200,
  500, 1000, 2000, 5000, 10000, 20000, 50000,
  100000, 200000, 300000, 400000, 500000, 600000, 750000, 1000000
];

const DIFFICULTY_VALUES = {
  easy: [
    100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 2000, 3000,
    5000, 8000, 10000, 20000, 30000, 50000, 80000, 100000, 200000,
    300000, 400000, 500000, 750000, 1000000
  ],
  normal: DEFAULT_VALUES,
  hard: [
    0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50,
    100, 200, 500, 1000, 2000, 5000, 8000, 10000, 20000, 30000,
    50000, 80000, 100000, 200000
  ],
  extreme: [
    0.01, 0.01, 0.01, 0.01, 0.01, 0.1, 0.1, 0.1, 1, 1, 1, 10,
    10, 10, 100, 100, 100, 1000, 1000, 5000, 50000, 100000,
    250000, 500000, 750000, 1000000
  ]
};

const DEFAULT_ROUNDS = [6, 5, 4, 3, 2, 1, 1, 1, 1, 1, 1];

let gameState = {
  phase: 'welcome', // welcome, picking, opening, banker, swap, reveal, result
  cases: [], // [{number, amount, opened}]
  myCaseIndex: -1,
  remainingAmounts: [],
  currentRound: 0,
  openedThisRound: 0,
  roundConfig: [],
  bankerEnabled: true,
  totalOpened: 0,
  values: [...DEFAULT_VALUES],
  gameHistory: []
};

// ======================== SETTINGS ========================
function toggleSettings() {
  const panel = document.getElementById('settings-panel');
  const overlay = document.getElementById('settings-overlay');
  panel.classList.toggle('open');
  overlay.classList.toggle('open');
}

function toggleSwitch(el) {
  el.classList.toggle('active');
}

function onDifficultyChange() {
  const val = document.getElementById('setting-difficulty').value;
  document.getElementById('custom-values-group').style.display = val === 'custom' ? 'block' : 'none';
  // Show/hide amount range based on non-custom difficulty
  const showRange = val !== 'custom';
  document.getElementById('amount-range-group').style.display = showRange ? 'block' : 'none';
  document.getElementById('amount-range-group2').style.display = showRange ? 'block' : 'none';
  updateRangePreview();
}

// Generate evenly distributed values between min and max for N cases
function generateRangeValues(minVal, maxVal, count) {
  if (count < 2) count = 2;
  if (maxVal <= minVal) return [minVal, maxVal];
  const values = [];
  // Use a combination of geometric and linear steps for realistic distribution
  for (let i = 0; i < count; i++) {
    // geometric spacing: closer values at low end, wider at high end
    const ratio = i / (count - 1);
    const logMin = Math.log10(Math.max(minVal, 0.001));
    const logMax = Math.log10(maxVal);
    const val = Math.pow(10, logMin + ratio * (logMax - logMin));
    // Round appropriately
    if (val >= 10000) values.push(Math.round(val / 100) * 100);
    else if (val >= 100) values.push(Math.round(val / 10) * 10);
    else if (val >= 1) values.push(Math.round(val));
    else values.push(Math.round(val * 100) / 100);
  }
  // Ensure no duplicates
  const unique = [...new Set(values)];
  while (unique.length < count) {
    // add intermediate values
    const sorted = unique.slice().sort((a, b) => a - b);
    let maxGap = 0, gapIdx = 0;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i] - sorted[i - 1];
      if (gap > maxGap) { maxGap = gap; gapIdx = i - 1; }
    }
    const mid = (sorted[gapIdx] + sorted[gapIdx + 1]) / 2;
    if (mid >= 10000) unique.push(Math.round(mid / 100) * 100);
    else if (mid >= 100) unique.push(Math.round(mid / 10) * 10);
    else if (mid >= 1) unique.push(Math.round(mid));
    else unique.push(Math.round(mid * 100) / 100);
  }
  return unique.sort((a, b) => a - b).slice(0, count);
}

function updateRangePreview() {
  const val = document.getElementById('setting-difficulty').value;
  const previewEl = document.getElementById('amount-range-preview');
  const contentEl = document.getElementById('range-preview-content');
  if (val === 'custom') {
    previewEl.style.display = 'none';
    return;
  }
  const caseCount = parseInt(document.getElementById('setting-case-count').value) || 26;
  const minVal = parseFloat(document.getElementById('setting-min-amount').value);
  const maxVal = parseFloat(document.getElementById('setting-max-amount').value);
  if (!isNaN(minVal) && !isNaN(maxVal) && maxVal > minVal) {
    const vals = generateRangeValues(minVal, maxVal, caseCount);
    contentEl.textContent = vals.map(v => formatMoney(v)).join('  |  ');
    previewEl.style.display = 'block';
  } else {
    previewEl.style.display = 'none';
  }
}

// Attach input listeners for live preview
document.getElementById('setting-case-count').addEventListener('input', updateRangePreview);
document.getElementById('setting-min-amount').addEventListener('input', updateRangePreview);
document.getElementById('setting-max-amount').addEventListener('input', updateRangePreview);

function applySettings() {
  const difficulty = document.getElementById('setting-difficulty').value;
  const roundsStr = document.getElementById('setting-rounds').value;
  const bankerOn = document.getElementById('setting-banker').classList.contains('active');
  soundEnabled = document.getElementById('setting-sound').classList.contains('active');
  particlesEnabled = document.getElementById('setting-particles').classList.contains('active');

  // Read case count
  let caseCount = parseInt(document.getElementById('setting-case-count').value);
  if (isNaN(caseCount) || caseCount < 2) caseCount = 2;
  if (caseCount > 26) caseCount = 26;
  gameState.caseCount = caseCount;

  // Read amount range
  const minAmount = parseFloat(document.getElementById('setting-min-amount').value);
  const maxAmount = parseFloat(document.getElementById('setting-max-amount').value);

  if (difficulty === 'custom') {
    const raw = document.getElementById('setting-custom-values').value;
    const vals = raw.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
    if (vals.length < 2) {
      alert('请输入至少2个有效金额数值');
      return;
    }
    // Trim or pad to match case count
    if (vals.length > caseCount) {
      gameState.values = vals.slice(0, caseCount);
    } else {
      while (vals.length < caseCount) {
        vals.push(vals[vals.length - 1]);
      }
      gameState.values = vals;
    }
  } else if (!isNaN(minAmount) && !isNaN(maxAmount) && maxAmount > minAmount) {
    // User has custom range - generate values
    gameState.values = generateRangeValues(minAmount, maxAmount, caseCount);
  } else {
    // Use difficulty preset, trimmed/padded to case count
    const preset = [...DIFFICULTY_VALUES[difficulty]];
    if (preset.length > caseCount) {
      gameState.values = preset.slice(0, caseCount);
    } else {
      while (preset.length < caseCount) {
        preset.push(preset[preset.length - 1]);
      }
      gameState.values = preset;
    }
  }

  const rounds = roundsStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n) && n > 0);
  if (rounds.length === 0) {
    alert('请输入有效的轮次配置');
    return;
  }
  gameState.roundConfig = rounds;
  gameState.bankerEnabled = bankerOn;

  toggleSettings();
  showToast(`设置已保存！${gameState.values.length} 个箱子，金额 ${formatMoney(gameState.values[0])} ~ ${formatMoney(gameState.values[gameState.values.length - 1])}`);
}

function resetSettings() {
  document.getElementById('setting-difficulty').value = 'normal';
  document.getElementById('setting-rounds').value = '6,5,4,3,2,1,1,1,1,1,1';
  document.getElementById('setting-custom-values').value = '';
  document.getElementById('setting-case-count').value = '26';
  document.getElementById('setting-min-amount').value = '0.01';
  document.getElementById('setting-max-amount').value = '1000000';
  document.getElementById('setting-banker').classList.add('active');
  document.getElementById('setting-sound').classList.add('active');
  document.getElementById('setting-particles').classList.add('active');
  document.getElementById('custom-values-group').style.display = 'none';
  document.getElementById('amount-range-group').style.display = 'block';
  document.getElementById('amount-range-group2').style.display = 'block';
  document.getElementById('amount-range-preview').style.display = 'none';
  soundEnabled = true;
  particlesEnabled = true;
  gameState.values = [...DEFAULT_VALUES];
  gameState.caseCount = 26;
  showToast('已恢复默认设置');
}

// ======================== TOAST ========================
function showToast(msg) {
  const toast = document.createElement('div');
  toast.style.cssText = `
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(26,26,53,0.95); color: var(--gold); padding: 12px 28px;
    border-radius: 25px; font-size: 14px; z-index: 1000; border: 1px solid var(--gold-dark);
    animation: fadeIn 0.3s ease; letter-spacing: 1px;
  `;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 2000);
}

// ======================== SCREEN MANAGEMENT ========================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ======================== GAME INIT ========================
function startGame() {
  playSound('click');
  const numCases = gameState.caseCount || Math.min(26, gameState.values.length);

  // Ensure we have enough values
  const caseValues = [...gameState.values];
  while (caseValues.length < numCases) {
    caseValues.push(caseValues[caseValues.length - 1]);
  }

  // Shuffle values
  const shuffled = caseValues.sort(() => Math.random() - 0.5);

  gameState.cases = [];
  for (let i = 0; i < numCases; i++) {
    gameState.cases.push({
      number: i + 1,
      amount: shuffled[i],
      opened: false
    });
  }

  gameState.numCases = numCases;
  gameState.myCaseIndex = -1;
  gameState.remainingAmounts = shuffled.slice(); // copy
  gameState.currentRound = 0;
  gameState.openedThisRound = 0;
  gameState.totalOpened = 0;
  gameState.phase = 'picking';
  gameState.gameHistory = [];

  renderCases();
  renderMoneyBoard();
  updateHeader();

  document.getElementById('my-case-badge').style.display = 'none';
  document.getElementById('round-progress').style.display = 'none';
  setGameMessage('请选择一个箱子作为你的专属箱子', 'highlight');

  showScreen('game-screen');
}

function goHome() {
  playSound('click');
  showScreen('welcome-screen');
}

// ======================== RENDERING ========================
function renderCases() {
  const grid = document.getElementById('cases-grid');
  grid.innerHTML = '';

  gameState.cases.forEach((c, idx) => {
    const div = document.createElement('div');
    div.className = 'case-item';
    div.id = `case-${idx}`;
    if (c.opened) div.classList.add('opened');
    if (idx === gameState.myCaseIndex) div.classList.add('my-case');

    div.innerHTML = `
      <div class="case-inner">
        <div class="case-front">
          <div class="case-number">#${c.number}</div>
          <div class="case-icon">📦</div>
        </div>
        <div class="case-back">
          <div class="case-amount">${formatMoney(c.amount)}</div>
        </div>
      </div>
    `;

    if (!c.opened && gameState.phase === 'picking') {
      div.onclick = () => pickMyCase(idx);
    } else if (!c.opened && gameState.phase === 'opening' && idx !== gameState.myCaseIndex) {
      div.onclick = () => openCase(idx);
    }

    grid.appendChild(div);
  });
}

function renderMoneyBoard() {
  const grid = document.getElementById('money-grid');
  grid.innerHTML = '';

  const sorted = [...gameState.values].sort((a, b) => a - b);
  const uniqueSorted = [...new Set(sorted)].sort((a, b) => a - b);

  // If we have more cases than unique values (unlikely but handle)
  const maxVal = Math.max(...gameState.values);
  const minVal = Math.min(...gameState.values);

  uniqueSorted.forEach(val => {
    const eliminated = !gameState.cases.some(c => c.amount === val && !c.opened) && gameState.cases.some(c => c.amount === val && c.opened);

    const div = document.createElement('div');
    let cls = 'money-item';
    if (eliminated) cls += ' eliminated';

    if (maxVal > 0) {
      const ratio = val / maxVal;
      if (ratio > 0.75) cls += ' jackpot';
      else if (ratio > 0.4) cls += ' high';
      else if (ratio > 0.1) cls += ' mid';
      else cls += ' low';
    }

    div.className = cls;
    div.textContent = formatMoney(val);
    div.id = `money-${val}`;
    grid.appendChild(div);
  });
}

function updateMoneyBoard(openedAmount) {
  // Check if all cases with this amount are opened
  const remaining = gameState.cases.filter(c => c.amount === openedAmount && !c.opened);
  if (remaining.length === 0) {
    const el = document.getElementById(`money-${openedAmount}`);
    if (el) el.classList.add('eliminated');
  }
}

function updateHeader() {
  const remaining = gameState.cases.filter(c => !c.opened).length;
  document.getElementById('round-number').textContent = gameState.currentRound + 1;
  document.getElementById('remaining-count').textContent = remaining;
}

function setGameMessage(text, highlight) {
  const el = document.getElementById('game-message');
  el.textContent = text;
  el.className = 'game-message';
  if (highlight) el.classList.add('highlight');
}

function formatMoney(val) {
  if (val >= 10000) {
    return '¥' + val.toLocaleString('zh-CN');
  } else if (val >= 1) {
    return '¥' + val.toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  } else {
    return '¥' + val.toFixed(2);
  }
}

// ======================== GAME LOGIC ========================
function pickMyCase(idx) {
  playSound('open-high');
  gameState.myCaseIndex = idx;
  gameState.phase = 'opening';
  gameState.currentRound = 0;

  const caseNum = gameState.cases[idx].number;
  document.getElementById('my-case-badge').style.display = 'block';
  document.getElementById('my-case-number').textContent = caseNum;

  // Mark my case visually
  const el = document.getElementById(`case-${idx}`);
  el.classList.add('my-case');
  el.onclick = null;

  // Disable all cases initially, then enable non-my cases
  gameState.cases.forEach((c, i) => {
    const caseEl = document.getElementById(`case-${i}`);
    if (i !== idx && !c.opened) {
      caseEl.onclick = () => openCase(i);
    } else {
      caseEl.style.pointerEvents = 'none';
    }
  });

  setGameMessage(`你选择了 #${caseNum} 号箱子！现在请逐个开启其他箱子`, true);

  // Setup round
  setupRound();
}

function setupRound() {
  const roundSize = gameState.roundConfig[gameState.currentRound] || 1;
  gameState.openedThisRound = 0;

  const progressEl = document.getElementById('round-progress');
  progressEl.style.display = 'flex';

  setGameMessage(`第 ${gameState.currentRound + 1} 轮：请开启 ${roundSize} 个箱子`, 'highlight');
  updateRoundProgress();
}

function updateRoundProgress() {
  const roundSize = gameState.roundConfig[gameState.currentRound] || 1;
  const pct = (gameState.openedThisRound / roundSize) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${gameState.openedThisRound} / ${roundSize}`;
}

function openCase(idx) {
  if (gameState.phase !== 'opening') return;
  if (gameState.cases[idx].opened) return;
  if (idx === gameState.myCaseIndex) return;

  gameState.cases[idx].opened = true;
  gameState.totalOpened++;
  gameState.openedThisRound++;

  const amount = gameState.cases[idx].amount;
  const caseNum = gameState.cases[idx].number;

  playSound(amount >= 100000 ? 'open-high' : 'open');

  // Animate the case
  const caseEl = document.getElementById(`case-${idx}`);
  caseEl.classList.add('opened', 'selected-to-open');
  caseEl.onclick = null;
  caseEl.style.pointerEvents = 'none';

  // Show amount popup
  showAmountPopup(amount);

  // Update money board
  updateMoneyBoard(amount);

  // Update header
  updateHeader();
  updateRoundProgress();

  // Game history
  gameState.gameHistory.push({ case: caseNum, amount: amount, round: gameState.currentRound + 1 });

  // Check round completion
  const roundSize = gameState.roundConfig[gameState.currentRound] || 1;

  setTimeout(() => {
    if (gameState.openedThisRound >= roundSize) {
      onRoundComplete();
    } else {
      const remaining = roundSize - gameState.openedThisRound;
      setGameMessage(`还需开启 ${remaining} 个箱子`, 'highlight');
    }
  }, 600);
}

function onRoundComplete() {
  const remainingCases = gameState.cases.filter(c => !c.opened);
  const remainingCount = remainingCases.length;

  // Check if only 2 cases remain (including my case)
  if (remainingCount <= 2) {
    // Trigger final phase
    gameState.phase = 'swap';
    showSwapModal();
    return;
  }

  // Banker offer?
  if (gameState.bankerEnabled) {
    gameState.phase = 'banker';
    const offer = calculateBankerOffer();
    showBankerModal(offer);
  } else {
    // Skip to next round
    nextRound();
  }
}

function nextRound() {
  gameState.currentRound++;
  gameState.phase = 'opening';
  setupRound();
}

// ======================== BANKER AI ========================
function calculateBankerOffer() {
  const unopenedCases = gameState.cases.filter(c => !c.opened);
  const amounts = unopenedCases.map(c => c.amount);

  const mean = amounts.reduce((a, b) => a + b, 0) / amounts.length;

  // Factor in progress (early rounds: lower offer, later rounds: closer to mean)
  const totalCases = gameState.numCases || 26;
  const opened = gameState.totalOpened;
  const progress = opened / totalCases;

  // Risk factor: more high values eliminated = lower offer
  const remainingValues = amounts.slice().sort((a, b) => a - b);
  const maxRemaining = remainingValues[remainingValues.length - 1];
  const maxOriginal = Math.max(...gameState.values);
  const highValueRatio = maxRemaining / maxOriginal;

  // Difficulty multiplier
  const difficultyMultiplier = 1 + (1 - progress) * 0.3;

  let offer = mean * highValueRatio * difficultyMultiplier * 0.85;

  // Banker is slightly greedy
  offer *= (0.7 + Math.random() * 0.2);

  // Round to nice number
  if (offer >= 1000) {
    offer = Math.round(offer / 100) * 100;
  } else if (offer >= 100) {
    offer = Math.round(offer / 10) * 10;
  } else {
    offer = Math.round(offer * 100) / 100;
  }

  return Math.max(offer, 0.01);
}

function showBankerModal(offer) {
  playSound('phone');
  setTimeout(() => {
    playSound('banker');
    document.getElementById('banker-offer-amount').textContent = formatMoney(offer);
    document.getElementById('banker-modal').classList.add('active');
    setGameMessage('银行家正在考虑...', '');
  }, 1200);
}

function acceptDeal() {
  playSound('deal');
  document.getElementById('banker-modal').classList.remove('active');
  const offer = parseBankerOffer();
  showResult(offer, 'deal');
}

function rejectDeal() {
  playSound('no-deal');
  document.getElementById('banker-modal').classList.remove('active');
  setGameMessage('你拒绝了银行家的出价！继续开箱！', 'highlight');
  nextRound();
}

function parseBankerOffer() {
  const text = document.getElementById('banker-offer-amount').textContent;
  return parseFloat(text.replace(/[¥,]/g, ''));
}

// ======================== SWAP ========================
function showSwapModal() {
  const myCase = gameState.cases[gameState.myCaseIndex];
  const otherCase = gameState.cases.find(c => !c.opened && c !== myCase);

  document.getElementById('swap-my-number').textContent = `#${myCase.number}`;
  document.getElementById('swap-other-number').textContent = `#${otherCase.number}`;

  setGameMessage('最后时刻！你可以选择交换箱子', 'highlight');
  document.getElementById('swap-modal').classList.add('active');
  playSound('banker');
}

function swapCase() {
  playSound('open-high');
  document.getElementById('swap-modal').classList.remove('active');

  const myCase = gameState.cases[gameState.myCaseIndex];
  const otherIdx = gameState.cases.findIndex(c => !c.opened && c !== myCase);

  // Swap myCaseIndex
  gameState.myCaseIndex = otherIdx;

  // Update visual
  document.getElementById('my-case-number').textContent = gameState.cases[otherIdx].number;

  showToast('箱子已交换！');
  setGameMessage('你选择了交换！准备揭晓...', '');

  setTimeout(() => {
    finalReveal();
  }, 1500);
}

function keepCase() {
  playSound('click');
  document.getElementById('swap-modal').classList.remove('active');
  setGameMessage('你选择坚持！准备揭晓...', '');
  setTimeout(() => {
    finalReveal();
  }, 1500);
}

// ======================== FINAL REVEAL ========================
function finalReveal() {
  gameState.phase = 'reveal';
  const myCase = gameState.cases[gameState.myCaseIndex];
  const otherCase = gameState.cases.find(c => !c.opened && c !== myCase);

  // First reveal the other case
  document.getElementById('reveal-case-number').textContent = `#${otherCase.number}`;
  document.getElementById('reveal-amount').textContent = formatMoney(otherCase.amount);
  document.getElementById('reveal-amount').className = 'reveal-amount ' + (otherCase.amount >= 100000 ? 'win' : 'lose');
  document.getElementById('reveal-message').textContent = `这是另一个箱子里的金额`;
  document.getElementById('reveal-btn').textContent = '揭晓我的箱子';
  document.getElementById('reveal-btn').onclick = () => {
    document.getElementById('reveal-modal').classList.remove('active');
    setTimeout(() => revealMyCase(), 500);
  };

  playSound('reveal');
  document.getElementById('reveal-modal').classList.add('active');
}

function revealMyCase() {
  const myCase = gameState.cases[gameState.myCaseIndex];

  document.getElementById('reveal-case-number').textContent = `#${myCase.number}`;
  document.getElementById('reveal-amount').textContent = formatMoney(myCase.amount);
  document.getElementById('reveal-amount').className = 'reveal-amount win';
  document.getElementById('reveal-message').textContent = `🎉 这是你箱子里的金额！`;
  document.getElementById('reveal-btn').textContent = '查看结果';
  document.getElementById('reveal-btn').onclick = () => {
    document.getElementById('reveal-modal').classList.remove('active');
    showResult(myCase.amount, 'final');
  };

  playSound('reveal');
  document.getElementById('reveal-modal').classList.add('active');
}

// ======================== RESULT ========================
function showResult(amount, type) {
  gameState.phase = 'result';

  const iconEl = document.getElementById('result-icon');
  const amountEl = document.getElementById('result-amount');
  const labelEl = document.getElementById('result-label');

  if (amount >= 100000) {
    iconEl.textContent = '🏆';
    iconEl.style.display = 'block';
    labelEl.textContent = type === 'deal' ? '成交奖金' : '最终奖金';
    playSound('win');
    launchConfetti();
  } else if (amount >= 1000) {
    iconEl.textContent = '🎉';
    iconEl.style.display = 'block';
    labelEl.textContent = type === 'deal' ? '成交奖金' : '最终奖金';
    playSound('win');
    launchConfetti();
  } else if (amount >= 100) {
    iconEl.textContent = '😊';
    iconEl.style.display = 'block';
    labelEl.textContent = type === 'deal' ? '成交奖金' : '最终奖金';
    playSound('deal');
  } else if (amount >= 1) {
    iconEl.textContent = '😐';
    iconEl.style.display = 'block';
    labelEl.textContent = type === 'deal' ? '成交奖金' : '最终奖金';
    playSound('lose');
  } else {
    iconEl.textContent = '😔';
    iconEl.style.display = 'block';
    labelEl.textContent = type === 'deal' ? '成交奖金' : '最终奖金';
    playSound('lose');
  }

  amountEl.textContent = formatMoney(amount);
  showScreen('result-screen');
}

// ======================== VISUAL EFFECTS ========================
function showAmountPopup(amount) {
  const popup = document.getElementById('amount-popup');
  popup.textContent = formatMoney(amount);
  popup.className = 'amount-popup';
  void popup.offsetWidth; // force reflow
  popup.classList.add('show');

  // Determine color based on value
  const maxVal = Math.max(...gameState.values);
  if (amount / maxVal > 0.5) {
    popup.style.background = 'linear-gradient(145deg, #e74c3c, #c0392b)';
    popup.style.color = 'white';
    popup.style.fontSize = '36px';
  } else {
    popup.style.background = 'linear-gradient(145deg, var(--gold), var(--gold-dark))';
    popup.style.color = '#1a1a2e';
    popup.style.fontSize = '32px';
  }

  setTimeout(() => {
    popup.className = 'amount-popup';
  }, 1300);
}

function launchConfetti() {
  const container = document.getElementById('confetti-container');
  const colors = ['#d4a853', '#f0d68a', '#e74c3c', '#2ecc71', '#4a9eff', '#fff'];

  for (let i = 0; i < 80; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
    piece.style.animationDelay = Math.random() * 1.5 + 's';

    const size = Math.random() * 8 + 5;
    piece.style.width = size + 'px';
    piece.style.height = size + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';

    container.appendChild(piece);
  }

  setTimeout(() => {
    container.innerHTML = '';
  }, 5000);
}

// ======================== INIT ========================
// Ensure settings are loaded
gameState.values = [...DEFAULT_VALUES];
gameState.roundConfig = [...DEFAULT_ROUNDS];
gameState.caseCount = 26;
gameState.numCases = 26;

// Prevent zoom on double tap
document.addEventListener('touchend', function(e) {
  const now = Date.now();
  if (now - (window.lastTouchEnd || 0) < 300) {
    e.preventDefault();
  }
  window.lastTouchEnd = now;
}, false);
</script>
