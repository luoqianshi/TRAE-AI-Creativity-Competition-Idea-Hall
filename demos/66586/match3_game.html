<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢乐消消乐 - 娱乐放松</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            background: #e0e5ec;
            padding: 10px;
            border-radius: 12px;
            aspect-ratio: 1;
            margin-bottom: 20px;
        }

        .cell {
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            user-select: none;
        }

        .cell:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .cell.selected {
            background: #ffd700;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            animation: pulse 0.5s infinite;
        }

        .cell.matching {
            animation: explode 0.4s ease-out forwards;
        }

        .cell.falling {
            animation: fall 0.3s ease-in;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1.1); }
            50% { transform: scale(1.15); }
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        @keyframes fall {
            0% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .message.show {
            opacity: 1;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        .rules {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .rules h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .rules ul {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.8;
            padding-left: 20px;
        }

        @media (max-width: 480px) {
            .cell {
                font-size: 1.2rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .game-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎮 欢乐消消乐</h1>
        <p class="subtitle">轻松娱乐，快乐放松</p>
        
        <div class="game-info">
            <div class="info-item">
                <div class="info-label">分数</div>
                <div class="info-value" id="score">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">关卡</div>
                <div class="info-value" id="level">1</div>
            </div>
            <div class="info-item">
                <div class="info-label">剩余步数</div>
                <div class="info-value" id="moves">30</div>
            </div>
        </div>

        <div class="board" id="board"></div>

        <div class="controls">
            <button class="btn-primary" onclick="resetGame()">新游戏</button>
            <button class="btn-secondary" onclick="shuffleBoard()">打乱</button>
        </div>

        <div class="message" id="message"></div>

        <div class="rules">
            <h3>📖 游戏规则</h3>
            <ul>
                <li>点击两个相邻的方块交换位置</li>
                <li>三个或更多相同颜色的方块连成一线即可消除</li>
                <li>消除方块获得分数，连续消除有额外奖励</li>
                <li>在步数用完前达到目标分数进入下一关</li>
            </ul>
        </div>
    </div>

    <script>
        const EMOJIS = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍑', '🍒', '🥝'];
        const BOARD_SIZE = 8;
        const INITIAL_MOVES = 30;
        const BASE_SCORE = 10;

        let board = [];
        let score = 0;
        let level = 1;
        let moves = INITIAL_MOVES;
        let selectedCell = null;
        let isProcessing = false;
        let targetScore = 100;

        function initBoard() {
            board = [];
            for (let row = 0; row < BOARD_SIZE; row++) {
                board[row] = [];
                for (let col = 0; col < BOARD_SIZE; col++) {
                    let emoji;
                    do {
                        emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
                    } while (wouldCreateMatch(row, col, emoji));
                    board[row][col] = emoji;
                }
            }
            renderBoard();
        }

        function wouldCreateMatch(row, col, emoji) {
            if (col >= 2 && board[row][col-1] === emoji && board[row][col-2] === emoji) {
                return true;
            }
            if (row >= 2 && board[row-1][col] === emoji && board[row-2][col] === emoji) {
                return true;
            }
            return false;
        }

        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.textContent = board[row][col];
                    cell.onclick = () => handleCellClick(row, col);
                    boardElement.appendChild(cell);
                }
            }
        }

        function handleCellClick(row, col) {
            if (isProcessing) return;

            const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);

            if (!selectedCell) {
                selectedCell = { row, col };
                cell.classList.add('selected');
            } else {
                const prevCell = document.querySelector(`.cell[data-row="${selectedCell.row}"][data-col="${selectedCell.col}"]`);
                prevCell.classList.remove('selected');

                if (isAdjacent(selectedCell.row, selectedCell.col, row, col)) {
                    swapCells(selectedCell.row, selectedCell.col, row, col);
                }
                
                selectedCell = null;
            }
        }

        function isAdjacent(row1, col1, row2, col2) {
            return (Math.abs(row1 - row2) === 1 && col1 === col2) ||
                   (Math.abs(col1 - col2) === 1 && row1 === row2);
        }

        async function swapCells(row1, col1, row2, col2) {
            isProcessing = true;

            const temp = board[row1][col1];
            board[row1][col1] = board[row2][col2];
            board[row2][col2] = temp;
            renderBoard();

            await delay(200);

            const matches = findMatches();
            if (matches.length > 0) {
                moves--;
                updateUI();
                await processMatches();
            } else {
                const temp = board[row1][col1];
                board[row1][col1] = board[row2][col2];
                board[row2][col2] = temp;
                renderBoard();
                showMessage('不能交换哦！', 'error');
            }

            isProcessing = false;
            checkGameEnd();
        }

        function findMatches() {
            const matches = new Set();

            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE - 2; col++) {
                    const emoji = board[row][col];
                    if (emoji && board[row][col+1] === emoji && board[row][col+2] === emoji) {
                        matches.add(`${row},${col}`);
                        matches.add(`${row},${col+1}`);
                        matches.add(`${row},${col+2}`);
                        let k = col + 3;
                        while (k < BOARD_SIZE && board[row][k] === emoji) {
                            matches.add(`${row},${k}`);
                            k++;
                        }
                    }
                }
            }

            for (let col = 0; col < BOARD_SIZE; col++) {
                for (let row = 0; row < BOARD_SIZE - 2; row++) {
                    const emoji = board[row][col];
                    if (emoji && board[row+1][col] === emoji && board[row+2][col] === emoji) {
                        matches.add(`${row},${col}`);
                        matches.add(`${row+1},${col}`);
                        matches.add(`${row+2},${col}`);
                        let k = row + 3;
                        while (k < BOARD_SIZE && board[k][col] === emoji) {
                            matches.add(`${k},${col}`);
                            k++;
                        }
                    }
                }
            }

            return Array.from(matches).map(pos => {
                const [r, c] = pos.split(',').map(Number);
                return { row: r, col: c };
            });
        }

        async function processMatches() {
            let matches = findMatches();
            let combo = 0;

            while (matches.length > 0) {
                combo++;
                const matchScore = matches.length * BASE_SCORE * combo;
                score += matchScore;
                updateUI();

                if (combo > 1) {
                    showMessage(`连击 x${combo}! +${matchScore}分`, 'success');
                }

                for (const match of matches) {
                    const cell = document.querySelector(`.cell[data-row="${match.row}"][data-col="${match.col}"]`);
                    cell.classList.add('matching');
                }

                await delay(400);

                for (const match of matches) {
                    board[match.row][match.col] = null;
                }

                await dropCells();
                await fillBoard();
                renderBoard();
                await delay(300);

                matches = findMatches();
            }

            if (score >= targetScore) {
                level++;
                moves = INITIAL_MOVES + level * 5;
                targetScore = 100 * level;
                showMessage(`🎉 恭喜过关！进入第${level}关`, 'success');
                updateUI();
            }
        }

        async function dropCells() {
            for (let col = 0; col < BOARD_SIZE; col++) {
                let emptyRow = BOARD_SIZE - 1;
                for (let row = BOARD_SIZE - 1; row >= 0; row--) {
                    if (board[row][col] !== null) {
                        if (row !== emptyRow) {
                            board[emptyRow][col] = board[row][col];
                            board[row][col] = null;
                        }
                        emptyRow--;
                    }
                }
            }
        }

        async function fillBoard() {
            for (let col = 0; col < BOARD_SIZE; col++) {
                for (let row = BOARD_SIZE - 1; row >= 0; row--) {
                    if (board[row][col] === null) {
                        board[row][col] = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
                    }
                }
            }
        }

        function shuffleBoard() {
            if (isProcessing) return;
            
            let newBoard = [];
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    newBoard.push(board[row][col]);
                }
            }

            for (let i = newBoard.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newBoard[i], newBoard[j]] = [newBoard[j], newBoard[i]];
            }

            let idx = 0;
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    board[row][col] = newBoard[idx++];
                }
            }

            const matches = findMatches();
            if (matches.length > 0) {
                shuffleBoard();
                return;
            }

            renderBoard();
            showMessage('已打乱！', 'success');
        }

        function resetGame() {
            score = 0;
            level = 1;
            moves = INITIAL_MOVES;
            targetScore = 100;
            selectedCell = null;
            isProcessing = false;
            initBoard();
            updateUI();
            showMessage('新游戏开始！', 'success');
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('moves').textContent = moves;
        }

        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = `message show ${type}`;
            setTimeout(() => {
                message.classList.remove('show');
            }, 2000);
        }

        function checkGameEnd() {
            if (moves <= 0) {
                showMessage(`游戏结束！最终得分：${score}`, 'error');
                setTimeout(() => {
                    if (confirm(`游戏结束！得分：${score}。再来一局？`)) {
                        resetGame();
                    }
                }, 500);
            }
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        initBoard();
    </script>
</body>
</html>
