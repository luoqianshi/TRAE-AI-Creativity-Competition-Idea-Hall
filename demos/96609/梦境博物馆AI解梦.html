<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梦境博物馆 · AI解梦与梦境可视化</title>
<style>
  :root{--purple:#7C3AED;--indigo:#6366F1;--star:#FBBF24;--dark:#1E1B4B;--glass:rgba(255,255,255,.08);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(180deg,#0F0A2E 0%,#1E1B4B 40%,#2D1B69 100%);color:#E2E0F0;min-height:100vh;overflow-x:hidden;}
  .stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
  .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--dur) ease-in-out infinite;animation-delay:var(--delay);}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(1);}50%{opacity:1;transform:scale(1.5);}}
  .header{text-align:center;padding:40px 20px 20px;position:relative;z-index:1;}
  .header .moon{font-size:3em;display:block;margin-bottom:8px;}
  .header h1{font-size:2.2em;background:linear-gradient(135deg,#C4B5FD,#A78BFA,#FBBF24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .header p{color:#A5B4FC;font-size:1.05em;}
  .container{max-width:700px;margin:0 auto;padding:16px;position:relative;z-index:1;}
  .card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:24px;margin-bottom:16px;}
  .card h2{font-size:1.2em;color:#C4B5FD;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  textarea{width:100%;height:120px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:16px;color:#E2E0F0;font-size:1em;resize:vertical;font-family:inherit;transition:border .3s;}
  textarea:focus{outline:none;border-color:var(--purple);}
  textarea::placeholder{color:rgba(255,255,255,.3);}
  .tag-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .tag{padding:6px 14px;border-radius:20px;font-size:.85em;cursor:pointer;border:1px solid rgba(255,255,255,.2);background:transparent;color:#A5B4FC;transition:all .3s;}
  .tag:hover,.tag.active{background:var(--purple);border-color:var(--purple);color:#fff;}
  .btn-analyze{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--purple),var(--indigo));color:#fff;font-size:1.1em;cursor:pointer;margin-top:16px;transition:all .3s;font-weight:600;}
  .btn-analyze:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(124,58,237,.4);}
  .btn-analyze:active{transform:translateY(0);}
  .dream-canvas{width:100%;height:200px;border-radius:16px;margin-top:12px;position:relative;overflow:hidden;background:rgba(0,0,0,.3);}
  .dream-particle{position:absolute;border-radius:50%;animation:float var(--dur) ease-in-out infinite;animation-delay:var(--delay);}
  @keyframes float{0%,100%{transform:translateY(0) scale(1);opacity:.6;}50%{transform:translateY(-30px) scale(1.3);opacity:1;}}
  .result-box{background:rgba(124,58,237,.15);border-radius:14px;padding:18px;margin-top:14px;border-left:4px solid var(--purple);}
  .result-box .title{font-weight:700;color:#C4B5FD;margin-bottom:6px;}
  .result-box .desc{color:#D1D5DB;line-height:1.7;}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:12px;}
  .gallery-item{aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:2.2em;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;}
  .gallery-item:hover{transform:scale(1.08);}
  .mood-stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;}
  .mood-bar{flex:1;min-width:60px;text-align:center;}
  .mood-bar .bar{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-top:4px;}
  .mood-bar .fill{height:100%;border-radius:4px;transition:width .8s ease;}
  .footer{text-align:center;padding:24px;color:rgba(255,255,255,.4);position:relative;z-index:1;}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="header">
  <span class="moon">🌙</span>
  <h1>梦境博物馆</h1>
  <p>记录你的梦 · AI为你解梦 · 生成专属梦境画面</p>
</div>

<div class="container">
  <div class="card">
    <h2>📝 描述你的梦境</h2>
    <textarea id="dreamInput" placeholder="写下你昨晚的梦…&#10;&#10;比如：我梦到自己在飞，穿过云层后看到了一座悬浮在空中的城市，那里的人们都在倒着走路…"></textarea>
    <div class="tag-group" id="tagGroup">
      <span class="tag" data-tag="飞行">✈️ 飞行</span>
      <span class="tag" data-tag="坠落">😰 坠落</span>
      <span class="tag" data-tag="水">🌊 水</span>
      <span class="tag" data-tag="追逐">🏃 被追逐</span>
      <span class="tag" data-tag="考试">📝 考试</span>
      <span class="tag" data-tag="重逢">🤝 重逢</span>
      <span class="tag" data-tag="迷路">🗺️ 迷路</span>
      <span class="tag" data-tag="动物">🐾 动物</span>
    </div>
    <button class="btn-analyze" onclick="analyzeDream()">✨ 开始解梦</button>
  </div>

  <div class="card" id="visualCard" style="display:none;">
    <h2>🎨 梦境可视化</h2>
    <div class="dream-canvas" id="dreamCanvas"></div>
    <p style="color:#A5B4FC;font-size:.85em;margin-top:8px;text-align:center;">
      AI 根据你的描述生成的梦境意象
    </p>
  </div>

  <div class="card" id="interpretCard" style="display:none;">
    <h2>🔮 AI 解梦分析</h2>
    <div id="interpretContent"></div>
  </div>

  <div class="card">
    <h2>🖼️ 梦境画廊</h2>
    <div class="gallery">
      <div class="gallery-item" style="background:linear-gradient(135deg,#1a1a3e,#2d1b69);" title="飞行之梦">🪽</div>
      <div class="gallery-item" style="background:linear-gradient(135deg,#0d3b66,#1a659e);" title="海洋之梦">🌊</div>
      <div class="gallery-item" style="background:linear-gradient(135deg,#2d1b69,#c44dff);" title="星空之梦">✨</div>
      <div class="gallery-item" style="background:linear-gradient(135deg,#1b4332,#40916c);" title="森林之梦">🌲</div>
      <div class="gallery-item" style="background:linear-gradient(135deg,#4a0e4e,#c084fc);" title="奇幻之梦">🦄</div>
      <div class="gallery-item" style="background:linear-gradient(135deg,#7f1d1d,#ef4444);" title="冒险之梦">⚔️</div>
    </div>
  </div>

  <div class="card">
    <h2>📊 你的梦境情绪统计</h2>
    <div class="mood-stats">
      <div class="mood-bar"><div>😊 愉悦</div><div class="bar"><div class="fill" style="width:65%;background:linear-gradient(90deg,#FBBF24,#F59E0B);"></div></div><div>65%</div></div>
      <div class="mood-bar"><div>😰 焦虑</div><div class="bar"><div class="fill" style="width:20%;background:linear-gradient(90deg,#EF4444,#DC2626);"></div></div><div>20%</div></div>
      <div class="mood-bar"><div>🤔 困惑</div><div class="bar"><div class="fill" style="width:10%;background:linear-gradient(90deg,#8B5CF6,#7C3AED);"></div></div><div>10%</div></div>
      <div class="mood-bar"><div>😴 平静</div><div class="bar"><div class="fill" style="width:5%;background:linear-gradient(90deg,#06B6D4,#0891B2);"></div></div><div>5%</div></div>
    </div>
  </div>
</div>

<div class="footer">
  <p>🌙 梦境博物馆 · 每一个梦都值得被珍藏</p>
</div>

<script>
// Generate stars
const starsContainer = document.getElementById('stars');
for(let i=0;i<80;i++){
  const star = document.createElement('div');
  star.className = 'star';
  star.style.left = Math.random()*100+'%';
  star.style.top = Math.random()*100+'%';
  star.style.width = star.style.height = (1+Math.random()*2.5)+'px';
  star.style.setProperty('--dur',(2+Math.random()*4)+'s');
  star.style.setProperty('--delay',Math.random()*4+'s');
  starsContainer.appendChild(star);
}

// Tag selection
document.querySelectorAll('.tag').forEach(tag=>{
  tag.addEventListener('click',function(){
    this.classList.toggle('active');
    const input = document.getElementById('dreamInput');
    if(this.classList.contains('active')){
      input.value += (input.value?'，':'')+'我梦到了'+this.dataset.tag;
    }
  });
});

const dreamDB = [
  {keywords:['飞','天空','飘','翅膀'],interpret:{theme:'自由与超越',meaning:'飞行梦通常象征着对自由的渴望，或正在经历人生的上升期。你可能在现实中获得了新的视角，或者希望摆脱某种束缚。这也是创造力迸发的信号。',advice:'把握当下的灵感和机会，勇敢尝试新方向。同时注意不要脱离实际，保持脚踏实地。'}},
  {keywords:['坠落','掉','深渊','跌'],interpret:{theme:'失控与焦虑',meaning:'坠落梦常反映现实中的不安全感或失控感。可能是工作压力、人际关系或重大决定带来的焦虑在潜意识中的投射。',advice:'试着列出让你焦虑的事情，逐项分析可掌控的部分。深呼吸练习和规律作息能帮助稳定情绪。'}},
  {keywords:['水','海','河','雨','游泳'],interpret:{theme:'情感与潜意识',meaning:'水在梦中代表情感和潜意识。平静的水面暗示内心平和，而波涛汹涌则可能表示情绪波动。',advice:'关注自己近期的情绪变化，适当表达和疏导情感。写日记或与信任的人倾诉都是好方法。'}},
  {keywords:['追逐','跑','逃','躲'],interpret:{theme:'逃避与面对',meaning:'被追逐的梦通常意味着你在回避某个问题或责任。追逐者的身份（动物/人物/模糊影子）暗示了压力的具体来源。',advice:'勇敢面对你一直在回避的那个问题。一旦开始行动，你会发现它并没有想象中那么可怕。'}},
  {keywords:['考试','学校','迟到','没准备'],interpret:{theme:'自我评价焦虑',meaning:'即使离开校园多年，考试梦仍会出现。它反映了你对自身能力的怀疑，或对即将到来的"考验"感到不安。',advice:'列出你已经具备的能力和成就，增强自信。对于真正的挑战，准备充分是最好的解药。'}},
  {keywords:['重逢','故人','逝者','回到'],interpret:{theme:'未完成的情感',meaning:'梦见故人或逝者，往往意味着你心中还有未表达的情感，或者需要与过去的某个自己和解。',advice:'如果方便，尝试与相关的人沟通。如果不便，写一封信（不一定寄出）来表达你的感受。'}},
  {keywords:['迷路','找不到','迷宫','陌生'],interpret:{theme:'方向感的迷失',meaning:'迷路梦反映你对人生方向的迷茫。你可能面临重要的选择，但不确定哪条路是对的。',advice:'给自己一些时间和空间去探索。不需要立刻找到"正确答案"，有时候过程本身就是答案。'}},
  {keywords:['动物','蛇','狗','猫'],interpret:{theme:'本能与直觉',meaning:'梦中的动物往往代表你的本能、直觉或被压抑的情绪。不同动物有不同的象征意义。',advice:'尝试回忆梦中动物的状态——它是友善的还是威胁性的？这能帮你理解自己当前的心理状态。'}}
];

function analyzeDream(){
  const input = document.getElementById('dreamInput').value.trim();
  if(!input) {
    const tags = document.querySelectorAll('.tag.active');
    if(tags.length===0){alert('请描述你的梦境或选择标签');return;}
  }
  document.getElementById('visualCard').style.display='block';
  document.getElementById('interpretCard').style.display='block';
  generateVisualization(input);
  generateInterpretation(input||'飞行 天空 自由');
}

function generateVisualization(text){
  const canvas = document.getElementById('dreamCanvas');
  canvas.innerHTML = '';
  const colors = ['#C4B5FD','#FBBF24','#A78BFA','#60A5FA','#F472B6','#34D399','#FB923C','#818CF8'];
  for(let i=0;i<30;i++){
    const p = document.createElement('div');
    p.className = 'dream-particle';
    const size = 4 + Math.random()*16;
    p.style.width = p.style.height = size+'px';
    p.style.left = Math.random()*100+'%';
    p.style.top = Math.random()*100+'%';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.boxShadow = `0 0 ${size*2}px ${p.style.background}`;
    p.style.setProperty('--dur',(3+Math.random()*5)+'s');
    p.style.setProperty('--delay',Math.random()*3+'s');
    canvas.appendChild(p);
  }
  canvas.scrollIntoView({behavior:'smooth'});
}

function generateInterpretation(text){
  let bestMatch = null;
  let maxScore = 0;
  for(const entry of dreamDB){
    let score = 0;
    for(const kw of entry.keywords){
      if(text.includes(kw)) score++;
    }
    if(score>maxScore){maxScore=score;bestMatch=entry;}
  }
  if(!bestMatch) bestMatch = dreamDB[0];

  const {theme,meaning,advice} = bestMatch.interpret;
  document.getElementById('interpretContent').innerHTML = `
    <div class="result-box" style="border-left-color:#FBBF24;">
      <div class="title">🎯 梦境主题：${theme}</div>
      <div class="desc">${meaning}</div>
    </div>
    <div class="result-box" style="margin-top:12px;border-left-color:#34D399;">
      <div class="title">💡 给你的建议</div>
      <div class="desc">${advice}</div>
    </div>
  `;
  document.getElementById('interpretCard').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
