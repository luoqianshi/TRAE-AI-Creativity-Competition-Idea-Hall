<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>赛博纪念 · Cyber Memorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ============ 全局变量 ============ */
  :root {
    --bg-deep: #121214;
    --bone-white: #E5E5E5;
    --fog-grey: #8E9AAF;
    --aurora-purple: #D8B4FE;
    --cyber-cyan: #A7F3D0;
    --ember-yellow: #FDE047;
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
    --latin: "Cinzel", "Chronicle Display", serif;
    --sans: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    color: var(--bone-white);
    font-family: var(--sans);
    cursor: default;
    -webkit-font-smoothing: antialiased;
  }

  body {
    position: relative;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(142,154,175,0.08), transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(216,180,254,0.05), transparent 50%),
      var(--bg-deep);
  }

  /* ============ 通用：场景容器 ============ */
  .scene {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.6s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1;
  }

  .scene.active {
    opacity: 1;
    pointer-events: auto;
    z-index: 2;
  }

  /* 顶部品牌标识 */
  .brand {
    position: absolute;
    top: 36px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--latin);
    font-size: 12px;
    letter-spacing: 0.6em;
    color: rgba(229, 229, 229, 0.45);
    text-transform: uppercase;
    z-index: 10;
    text-shadow: 0 0 14px rgba(216, 180, 254, 0.35);
  }

  .brand::before, .brand::after {
    content: "";
    display: inline-block;
    width: 28px;
    height: 1px;
    background: rgba(229, 229, 229, 0.3);
    vertical-align: middle;
    margin: 0 16px;
  }

  /* 返回按钮 */
  .back-btn {
    position: absolute;
    top: 32px;
    left: 32px;
    background: transparent;
    border: 1px solid rgba(229, 229, 229, 0.18);
    color: rgba(229, 229, 229, 0.7);
    padding: 10px 22px;
    font-family: var(--serif);
    font-size: 13px;
    letter-spacing: 0.3em;
    cursor: pointer;
    transition: all 0.5s ease;
    backdrop-filter: blur(4px);
    z-index: 20;
  }

  .back-btn:hover {
    border-color: rgba(216, 180, 254, 0.6);
    color: var(--aurora-purple);
    box-shadow: 0 0 24px rgba(216, 180, 254, 0.25), inset 0 0 12px rgba(216, 180, 254, 0.08);
    letter-spacing: 0.4em;
  }

  /* ============ 主页面 ============ */
  #scene-main .canvas-wrap {
    position: absolute;
    inset: 0;
  }

  #scene-main canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .memory-stage {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    height: 320px;
    border-radius: 50%;
    overflow: hidden;
    pointer-events: none;
    mix-blend-mode: screen;
    filter: blur(2px) saturate(0.55) contrast(1.05);
  }

  .memory-stage img {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1.1);
    width: 110%;
    height: 110%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.8s ease-in-out, filter 1.8s ease-in-out;
    filter: blur(8px) brightness(1.1);
  }

  .memory-stage img.show {
    opacity: 0.62;
    filter: blur(4px) brightness(1.15);
  }

  .main-title {
    position: absolute;
    top: 18%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 5;
    pointer-events: none;
  }

  .main-title .zh {
    font-family: var(--serif);
    font-weight: 300;
    font-size: 38px;
    letter-spacing: 0.5em;
    color: rgba(229, 229, 229, 0.85);
    text-shadow:
      0 0 18px rgba(216, 180, 254, 0.4),
      0 0 40px rgba(167, 243, 208, 0.15);
    padding-left: 0.5em;
  }

  .main-title .en {
    margin-top: 14px;
    font-family: var(--latin);
    font-size: 11px;
    letter-spacing: 0.7em;
    color: rgba(216, 180, 254, 0.55);
    text-transform: uppercase;
    padding-left: 0.7em;
  }

  .main-nav {
    position: absolute;
    bottom: 12%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 80px;
    z-index: 5;
  }

  .ghost-btn {
    background: transparent;
    border: none;
    color: rgba(229, 229, 229, 0.78);
    font-family: var(--serif);
    font-weight: 300;
    font-size: 18px;
    letter-spacing: 0.5em;
    padding: 18px 36px 18px 40px;
    cursor: pointer;
    position: relative;
    transition: all 0.6s ease;
    text-shadow: 0 0 12px rgba(229, 229, 229, 0.2);
  }

  .ghost-btn::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--aurora-purple), transparent);
    transition: width 0.6s ease;
  }

  .ghost-btn:hover {
    color: var(--bone-white);
    text-shadow:
      0 0 20px rgba(216, 180, 254, 0.8),
      0 0 40px rgba(216, 180, 254, 0.3);
    letter-spacing: 0.6em;
  }

  .ghost-btn:hover::before {
    width: 140%;
  }

  .ghost-btn .en {
    display: block;
    font-family: var(--latin);
    font-size: 9px;
    letter-spacing: 0.4em;
    color: rgba(167, 243, 208, 0.45);
    margin-top: 6px;
    padding-left: 0.4em;
  }

  .main-hint {
    position: absolute;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--serif);
    font-size: 11px;
    letter-spacing: 0.4em;
    color: rgba(229, 229, 229, 0.3);
    z-index: 5;
    animation: hintBreath 4s ease-in-out infinite;
  }

  @keyframes hintBreath {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.6; }
  }

  /* ============ 上香页面 ============ */
  #scene-incense {
    background:
      radial-gradient(ellipse at 50% 70%, rgba(216, 180, 254, 0.08), transparent 50%),
      radial-gradient(ellipse at 50% 90%, rgba(167, 243, 208, 0.05), transparent 60%),
      var(--bg-deep);
  }

  #scene-incense canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .altar-stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 4vh;
  }

  .altar-frame {
    position: relative;
    width: 480px;
    height: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }

  .altar-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 24px rgba(216, 180, 254, 0.25));
  }

  .incense-click {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    z-index: 5;
    transition: all 0.4s ease;
  }

  .incense-click::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(229, 229, 229, 0.2);
    box-shadow: 0 0 8px rgba(229, 229, 229, 0.3);
    transition: all 0.4s ease;
  }

  .incense-click.lit::after {
    background: var(--ember-yellow);
    box-shadow:
      0 0 12px var(--ember-yellow),
      0 0 24px rgba(253, 224, 71, 0.6),
      0 0 48px rgba(253, 224, 71, 0.3);
    animation: emberPulse 2.4s ease-in-out infinite;
  }

  @keyframes emberPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.4); }
  }

  .incense-click:hover::after {
    background: rgba(253, 224, 71, 0.5);
    box-shadow: 0 0 16px rgba(253, 224, 71, 0.4);
  }

  .incense-title {
    margin-bottom: 32px;
    text-align: center;
    z-index: 3;
  }

  .incense-title .zh {
    font-family: var(--serif);
    font-weight: 300;
    font-size: 28px;
    letter-spacing: 0.6em;
    color: rgba(229, 229, 229, 0.9);
    text-shadow: 0 0 24px rgba(216, 180, 254, 0.4);
    padding-left: 0.6em;
  }

  .incense-title .en {
    margin-top: 10px;
    font-family: var(--latin);
    font-size: 10px;
    letter-spacing: 0.7em;
    color: rgba(167, 243, 208, 0.5);
    padding-left: 0.7em;
  }

  .incense-status {
    margin-top: 36px;
    font-family: var(--serif);
    font-size: 13px;
    letter-spacing: 0.4em;
    color: rgba(229, 229, 229, 0.5);
    text-align: center;
    z-index: 3;
    min-height: 20px;
    transition: color 0.6s ease, text-shadow 0.6s ease;
  }

  .incense-status.lit {
    color: var(--ember-yellow);
    text-shadow: 0 0 16px rgba(253, 224, 71, 0.5);
  }

  .incense-count {
    margin-top: 18px;
    font-family: var(--latin);
    font-size: 11px;
    letter-spacing: 0.4em;
    color: rgba(216, 180, 254, 0.5);
    z-index: 3;
  }

  /* ============ 祝福页面 ============ */
  #scene-blessing {
    background:
      radial-gradient(ellipse at 30% 50%, rgba(216, 180, 254, 0.06), transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(167, 243, 208, 0.04), transparent 60%),
      var(--bg-deep);
  }

  #scene-blessing canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
  }

  .blessing-stage {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .blessing-title {
    position: absolute;
    top: 14%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }

  .blessing-title .zh {
    font-family: var(--serif);
    font-weight: 300;
    font-size: 28px;
    letter-spacing: 0.6em;
    color: rgba(229, 229, 229, 0.9);
    text-shadow: 0 0 22px rgba(216, 180, 254, 0.35);
    padding-left: 0.6em;
  }

  .blessing-title .en {
    margin-top: 10px;
    font-family: var(--latin);
    font-size: 10px;
    letter-spacing: 0.7em;
    color: rgba(167, 243, 208, 0.5);
    padding-left: 0.7em;
  }

  .blessing-form {
    position: relative;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: opacity 0.8s ease;
  }

  .blessing-form.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .blessing-input {
    width: 520px;
    max-width: 80vw;
    height: 140px;
    background: rgba(229, 229, 229, 0.025);
    border: 1px solid rgba(216, 180, 254, 0.2);
    border-radius: 2px;
    color: var(--bone-white);
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1.8;
    letter-spacing: 0.15em;
    padding: 22px 28px;
    resize: none;
    outline: none;
    transition: all 0.5s ease;
    text-shadow: 0 0 14px rgba(216, 180, 254, 0.25);
    backdrop-filter: blur(8px);
  }

  .blessing-input:focus {
    border-color: rgba(216, 180, 254, 0.6);
    box-shadow:
      0 0 24px rgba(216, 180, 254, 0.2),
      inset 0 0 24px rgba(216, 180, 254, 0.05);
    text-shadow:
      0 0 18px rgba(216, 180, 254, 0.5),
      0 0 36px rgba(216, 180, 254, 0.2);
  }

  .blessing-input::placeholder {
    color: rgba(229, 229, 229, 0.25);
    font-family: var(--serif);
    letter-spacing: 0.2em;
  }

  .blessing-submit {
    margin-top: 36px;
    background: transparent;
    border: none;
    color: rgba(229, 229, 229, 0.7);
    font-family: var(--serif);
    font-size: 16px;
    letter-spacing: 0.6em;
    padding: 14px 40px 14px 46px;
    cursor: pointer;
    transition: all 0.6s ease;
    text-shadow: 0 0 12px rgba(229, 229, 229, 0.25);
  }

  .blessing-submit:hover {
    color: var(--aurora-purple);
    text-shadow: 0 0 24px rgba(216, 180, 254, 0.7);
    letter-spacing: 0.7em;
  }

  /* 远景墓碑 */
  .tombstone {
    position: absolute;
    right: 8%;
    bottom: 14%;
    width: 140px;
    height: 200px;
    z-index: 2;
    opacity: 0.55;
    filter: drop-shadow(0 0 18px rgba(167, 243, 208, 0.25));
    transition: opacity 1.5s ease;
  }

  .tombstone.glowing {
    opacity: 0.85;
    filter: drop-shadow(0 0 36px rgba(216, 180, 254, 0.55));
  }

  .blessing-hint {
    position: absolute;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--serif);
    font-size: 11px;
    letter-spacing: 0.4em;
    color: rgba(229, 229, 229, 0.28);
    z-index: 4;
    text-align: center;
    transition: opacity 0.6s ease;
  }

  /* 文字粒子化阶段使用的隐藏画布文字层 */
  .particle-text-layer {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 4;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 36px;
    line-height: 1.6;
    letter-spacing: 0.2em;
    color: var(--bone-white);
    text-align: center;
    max-width: 60vw;
    opacity: 0;
    text-shadow:
      0 0 20px rgba(216, 180, 254, 0.8),
      0 0 40px rgba(216, 180, 254, 0.4),
      0 0 80px rgba(167, 243, 208, 0.3);
    transition: opacity 0.4s ease;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .particle-text-layer.visible {
    opacity: 1;
  }

  /* ============ 镜头光晕（点香瞬间） ============ */
  .lens-flare {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 6;
    opacity: 0;
    background:
      radial-gradient(circle at 50% 35%, rgba(253, 224, 71, 0.5) 0%, transparent 6%),
      radial-gradient(circle at 50% 35%, rgba(253, 224, 71, 0.3) 0%, transparent 12%),
      radial-gradient(circle at 50% 35%, rgba(253, 224, 71, 0.15) 0%, transparent 24%);
    mix-blend-mode: screen;
    transition: opacity 0.2s ease;
  }

  .lens-flare.flash {
    animation: lensFlash 1.4s ease-out forwards;
  }

  @keyframes lensFlash {
    0% { opacity: 0; }
    8% { opacity: 1; }
    40% { opacity: 0.7; }
    100% { opacity: 0; }
  }

  /* 响应式 */
  @media (max-width: 768px) {
    .main-title .zh { font-size: 26px; letter-spacing: 0.4em; }
    .main-nav { gap: 36px; flex-direction: column; align-items: center; bottom: 14%; }
    .ghost-btn { font-size: 16px; padding: 14px 28px; }
    .altar-frame { width: 90vw; height: 70vh; }
    .blessing-input { width: 86vw; height: 180px; font-size: 16px; }
    .tombstone { width: 100px; height: 150px; right: 5%; bottom: 18%; }
    .particle-text-layer { font-size: 24px; }
    .brand::before, .brand::after { width: 16px; margin: 0 10px; }
  }
</style>
</head>
<body>

<!-- 顶部品牌标识 -->
<div class="brand">Cyber Memorial</div>

<!-- ============ 主页面 ============ -->
<section id="scene-main" class="scene active">
  <div class="canvas-wrap">
    <canvas id="fog-canvas"></canvas>
  </div>

  <div class="memory-stage" id="memory-stage">
    <img data-seed="memorial-pet-1" alt="" />
    <img data-seed="memorial-pet-2" alt="" />
    <img data-seed="memorial-pet-3" alt="" />
    <img data-seed="memorial-pet-4" alt="" />
  </div>

  <div class="main-title">
    <div class="zh">归处</div>
    <div class="en">A Digital Sanctuary</div>
  </div>

  <nav class="main-nav">
    <button class="ghost-btn" data-target="incense">
      上 香
      <span class="en">Incense</span>
    </button>
    <button class="ghost-btn" data-target="blessing">
      祝 福
      <span class="en">Blessing</span>
    </button>
  </nav>

  <div class="main-hint">于雾气深处 · 听见回响</div>
</section>

<!-- ============ 上香页面 ============ -->
<section id="scene-incense" class="scene">
  <canvas id="smoke-canvas"></canvas>

  <div class="altar-stage">
    <div class="incense-title">
      <div class="zh">赛博祭坛</div>
      <div class="en">Incense Ritual</div>
    </div>

    <div class="altar-frame">
      <svg class="altar-svg" viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="altarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#D8B4FE" stop-opacity="0.15" />
            <stop offset="50%" stop-color="#8E9AAF" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#E5E5E5" stop-opacity="0.7" />
          </linearGradient>
          <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#D8B4FE" stop-opacity="0.35" />
            <stop offset="50%" stop-color="#A7F3D0" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#A7F3D0" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- 顶部光晕 -->
        <ellipse cx="240" cy="60" rx="180" ry="50" fill="url(#haloGrad)" />

        <!-- 香枝 -->
        <line x1="240" y1="60" x2="240" y2="240" stroke="#E5E5E5" stroke-width="1.5" stroke-opacity="0.65" />
        <line x1="225" y1="80" x2="225" y2="245" stroke="#E5E5E5" stroke-width="1" stroke-opacity="0.4" />
        <line x1="255" y1="80" x2="255" y2="245" stroke="#E5E5E5" stroke-width="1" stroke-opacity="0.4" />

        <!-- 香炉主体 -->
        <path d="M 130 250 Q 130 320, 240 320 Q 350 320, 350 250 L 340 250 Q 340 305, 240 305 Q 140 305, 140 250 Z"
              fill="url(#altarGrad)" stroke="#E5E5E5" stroke-width="1" stroke-opacity="0.55" />
        <ellipse cx="240" cy="250" rx="110" ry="14" fill="#121214" stroke="#E5E5E5" stroke-width="1" stroke-opacity="0.6" />
        <ellipse cx="240" cy="248" rx="100" ry="8" fill="#8E9AAF" fill-opacity="0.25" />

        <!-- 香炉底座 -->
        <rect x="180" y="320" width="120" height="10" fill="#8E9AAF" fill-opacity="0.4" />
        <rect x="170" y="330" width="140" height="6" fill="#8E9AAF" fill-opacity="0.3" />

        <!-- 装饰花纹 -->
        <path d="M 160 280 Q 240 295, 320 280" stroke="#D8B4FE" stroke-width="0.8" stroke-opacity="0.4" fill="none" />
        <circle cx="200" cy="285" r="2" fill="#A7F3D0" fill-opacity="0.5" />
        <circle cx="240" cy="290" r="2" fill="#D8B4FE" fill-opacity="0.6" />
        <circle cx="280" cy="285" r="2" fill="#A7F3D0" fill-opacity="0.5" />

        <!-- 铭文 -->
        <text x="240" y="358" text-anchor="middle" font-family="Cinzel, serif" font-size="9" letter-spacing="6"
              fill="#E5E5E5" fill-opacity="0.35">IN MEMORIAM</text>
      </svg>

      <div class="incense-click" id="incense-click" title="点击上香"></div>
      <div class="lens-flare" id="lens-flare"></div>
    </div>

    <div class="incense-status" id="incense-status">点击香头 · 以诚相献</div>
    <div class="incense-count" id="incense-count">已献 · 0 炷</div>
  </div>

  <button class="back-btn" data-target="main">← 返 回</button>
</section>

<!-- ============ 祝福页面 ============ -->
<section id="scene-blessing" class="scene">
  <canvas id="particle-canvas"></canvas>

  <div class="blessing-stage">
    <div class="blessing-title">
      <div class="zh">寄语彼岸</div>
      <div class="en">Blessing Wall</div>
    </div>

    <form class="blessing-form" id="blessing-form">
      <textarea class="blessing-input" id="blessing-input"
                placeholder="在此写下你想说的话……&#10;它会化作粒子，飘向彼岸。"
                maxlength="120"></textarea>
      <button type="submit" class="blessing-submit">献 上 祝 福</button>
    </form>

      <line x1="45" y1="100" x2="95" y2="100" stroke="#E5E5E5" stroke-width="0.6" stroke-opacity="0.4" />
      <line x1="45" y1="115" x2="95" y2="115" stroke="#E5E5E5" stroke-width="0.6" stroke-opacity="0.3" />

            fill="#A7F3D0" fill-opacity="0.5">REST</text>

  </div>

  <button class="back-btn" data-target="main">← 返 回</button>
</section>

<script>
"use strict";

/* ========================================================
 * 工具：简化 Perlin 噪声
 * ====================================================== */
const Noise = (() => {
  const perm = new Uint8Array(512);
  const base = new Uint8Array(256);
  for (let i = 0; i < 256; i++) base[i] = i;
  // shuffle
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = base[i]; base[i] = base[j]; base[j] = t;
  }
  for (let i = 0; i < 512; i++) perm[i] = base[i & 255];

  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function lerp(a, b, t) { return a + t * (b - a); }
  function grad(hash, x, y) {
    const h = hash & 7;
    const u = h < 4 ? x : y;
    const v = h < 4 ? y : x;
    return ((h & 1) ? -u : u) + ((h & 2) ? -2 * v : 2 * v);
  }
  function noise2(x, y) {
    const X = Math.floor(x) & 255;
    const Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const u = fade(x), v = fade(y);
    const A = perm[X] + Y, B = perm[X + 1] + Y;
    return lerp(
      lerp(grad(perm[A], x, y), grad(perm[B], x - 1, y), u),
      lerp(grad(perm[A + 1], x, y - 1), grad(perm[B + 1], x - 1, y - 1), u),
      v
    );
  }
  return { noise2 };
})();

/* ========================================================
 * 场景管理器
 * ====================================================== */
const SceneManager = {
  current: "main",
  scenes: { main: null, incense: null, blessing: null },
  init() {
    this.scenes.main = document.getElementById("scene-main");
    this.scenes.incense = document.getElementById("scene-incense");
    this.scenes.blessing = document.getElementById("scene-blessing");
    document.querySelectorAll("[data-target]").forEach(btn => {
      btn.addEventListener("click", () => this.go(btn.dataset.target));
    });
  },
  go(name) {
    if (this.current === name) return;
    const prev = this.scenes[this.current];
    const next = this.scenes[name];
    if (!next) return;
    prev.classList.remove("active");
    setTimeout(() => {
      this.current = name;
      next.classList.add("active");
      window.dispatchEvent(new CustomEvent("scenechange", { detail: { name } }));
    }, 200);
  }
};

/* ========================================================
 * 雾气引擎 FogEngine
 * ====================================================== */
const FogEngine = (() => {
  const canvas = document.getElementById("fog-canvas");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, cx = 0, cy = 0, baseR = 0;
  let t = 0;
  let raf = null;
  let running = false;

  // 雾气层参数
  const layers = [
    { rScale: 1.0,  speed: 0.00018, alpha: 0.16, hue: [142, 154, 175], blur: 60 },
    { rScale: 0.78, speed: 0.00026, alpha: 0.18, hue: [216, 180, 254], blur: 40 },
    { rScale: 0.55, speed: 0.00034, alpha: 0.20, hue: [167, 243, 208], blur: 30 },
    { rScale: 0.95, speed: 0.00015, alpha: 0.10, hue: [142, 154, 175], blur: 80 },
    { rScale: 0.40, speed: 0.00042, alpha: 0.22, hue: [229, 229, 229], blur: 20 }
  ];

  function resize() {
    W = canvas.width = canvas.clientWidth * window.devicePixelRatio;
    H = canvas.height = canvas.clientHeight * window.devicePixelRatio;
    cx = W / 2;
    cy = H / 2;
    baseR = Math.min(W, H) * 0.22;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // 0.2Hz 呼吸：周期 5s
    const breath = Math.sin(t * 0.0004 * Math.PI * 2 / 0.2 * 0.2) * 0.08 + 1;
    // 实际更柔和的呼吸频率
    const breathSoft = 1 + Math.sin(t * 0.001257) * 0.06; // ~0.2Hz

    // 弥散背景辉光
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * 2.4);
    bg.addColorStop(0, "rgba(216, 180, 254, 0.04)");
    bg.addColorStop(0.5, "rgba(142, 154, 175, 0.02)");
    bg.addColorStop(1, "rgba(18, 18, 20, 0)");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 多层雾气
    ctx.globalCompositeOperation = "screen";
    layers.forEach((L, idx) => {
      const r = Math.max(1, baseR * L.rScale * breathSoft);
      const angle = t * L.speed * 1000;
      const ox = Math.cos(angle + idx) * baseR * 0.12;
      const oy = Math.sin(angle * 1.3 + idx) * baseR * 0.08;
      const noiseR = Noise.noise2(t * 0.0006 + idx * 10, idx) * baseR * 0.15;
      const finalR = Math.max(1, r + noiseR);

      const grad = ctx.createRadialGradient(cx + ox, cy + oy, 0, cx + ox, cy + oy, finalR);
      const [r1, g1, b1] = L.hue;
      grad.addColorStop(0, `rgba(${r1},${g1},${b1},${L.alpha})`);
      grad.addColorStop(0.5, `rgba(${r1},${g1},${b1},${L.alpha * 0.4})`);
      grad.addColorStop(1, `rgba(${r1},${g1},${b1},0)`);

      ctx.fillStyle = grad;
      ctx.beginPath();
      // 用噪声扰动边缘
      const segs = 64;
      for (let i = 0; i <= segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        const n = Noise.noise2(Math.cos(a) * 1.5 + t * 0.0004, Math.sin(a) * 1.5 + t * 0.0004 + idx);
        const rr = Math.max(1, finalR * (1 + n * 0.18));
        const x = cx + ox + Math.cos(a) * rr;
        const y = cy + oy + Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    });

    // 中心高光
    ctx.globalCompositeOperation = "screen";
    const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, baseR * 0.3 * breathSoft));
    core.addColorStop(0, "rgba(229, 229, 229, 0.10)");
    core.addColorStop(0.5, "rgba(216, 180, 254, 0.05)");
    core.addColorStop(1, "rgba(216, 180, 254, 0)");
    ctx.fillStyle = core;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = "source-over";
    t += 16;
    if (running) raf = requestAnimationFrame(draw);
  }

  function start() {
    if (running) return;
    running = true;
    resize();
    raf = requestAnimationFrame(draw);
  }
  function stop() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    ctx.clearRect(0, 0, W, H);
  }
  function onResize() { if (running) resize(); }

  return { start, stop, onResize };
})();

/* ========================================================
 * 走马灯记忆引擎 MemoryCarousel
 * ====================================================== */
const MemoryCarousel = (() => {
  const stage = document.getElementById("memory-stage");
  const imgs = Array.from(stage.querySelectorAll("img"));
  let idx = 0;
  let timer = null;
  let loaded = 0;

  function loadImg(img) {
    return new Promise(resolve => {
      const seed = img.dataset.seed;
      img.onload = () => resolve();
      img.onerror = () => resolve();
      img.src = `https://picsum.photos/seed/${seed}/640/640.jpg`;
    });
  }

  async function preload() {
    await Promise.all(imgs.map(loadImg));
  }

  function show(i) {
    imgs.forEach((im, k) => im.classList.toggle("show", k === i));
  }

  function tick() {
    idx = (idx + 1) % imgs.length;
    show(idx);
  }

  function start() {
    if (timer) return;
    show(idx);
    timer = setInterval(tick, 5000);
  }
  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    imgs.forEach(im => im.classList.remove("show"));
  }
  return { preload, start, stop };
})();

/* ========================================================
 * 烟雾引擎 SmokeEngine（上香页面）
 * ====================================================== */
const SmokeEngine = (() => {
  const canvas = document.getElementById("smoke-canvas");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0;
  let particles = [];
  let raf = null;
  let running = false;
  let emitX = 0, emitY = 0;
  let intensity = 0; // 0~1，控制烟雾浓度

  function resize() {
    W = canvas.width = canvas.clientWidth * window.devicePixelRatio;
    H = canvas.height = canvas.clientHeight * window.devicePixelRatio;
    // 香头位置：与 SVG 中 (240, 60) 对应
    const rect = canvas.getBoundingClientRect();
    const altar = document.querySelector(".altar-frame");
    const ar = altar.getBoundingClientRect();
    const incenseTop = ar.top + ar.height * (60 / 380) - rect.top;
    emitX = (ar.left + ar.width / 2 - rect.left) * window.devicePixelRatio;
    emitY = incenseTop * window.devicePixelRatio;
  }

  function spawn() {
    const count = Math.floor(1 + intensity * 2);
    for (let i = 0; i < count; i++) {
      particles.push({
        x: emitX + (Math.random() - 0.5) * 6 * window.devicePixelRatio,
        y: emitY,
        vx: (Math.random() - 0.5) * 0.3 * window.devicePixelRatio,
        vy: -(0.5 + Math.random() * 0.4) * window.devicePixelRatio,
        life: 0,
        maxLife: 180 + Math.random() * 80,
        size: (4 + Math.random() * 4) * window.devicePixelRatio,
        seed: Math.random() * 1000
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "screen";

    // 祭坛环境光（极光紫青）
    const env = ctx.createRadialGradient(W / 2, H * 0.7, 0, W / 2, H * 0.7, W * 0.5);
    env.addColorStop(0, "rgba(216, 180, 254, 0.04)");
    env.addColorStop(0.5, "rgba(167, 243, 208, 0.02)");
    env.addColorStop(1, "rgba(18, 18, 20, 0)");
    ctx.fillStyle = env;
    ctx.fillRect(0, 0, W, H);

    spawn();

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life++;
      if (p.life > p.maxLife) { particles.splice(i, 1); continue; }

      // 风场扰动
      const wind = Noise.noise2(p.x * 0.005, p.y * 0.005 + p.seed) * 0.6;
      p.vx += wind * 0.04 * window.devicePixelRatio;
      p.vy *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.size *= 1.012;

      const lifeRatio = p.life / p.maxLife;
      const alpha = (1 - lifeRatio) * 0.28 * intensity;
      const r = Math.max(1, p.size);

      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      // 烟雾颜色随生命变化：起始带香头黄，渐变为灰青
      if (lifeRatio < 0.2) {
        g.addColorStop(0, `rgba(253, 224, 71, ${alpha * 0.6})`);
        g.addColorStop(0.4, `rgba(216, 180, 254, ${alpha * 0.4})`);
        g.addColorStop(1, "rgba(142, 154, 175, 0)");
      } else {
        g.addColorStop(0, `rgba(216, 180, 254, ${alpha * 0.5})`);
        g.addColorStop(0.5, `rgba(142, 154, 175, ${alpha * 0.4})`);
        g.addColorStop(1, "rgba(142, 154, 175, 0)");
      }
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = "source-over";
    if (running) raf = requestAnimationFrame(draw);
  }

  function start() {
    if (running) return;
    running = true;
    resize();
    raf = requestAnimationFrame(draw);
  }
  function stop() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    particles = [];
    ctx.clearRect(0, 0, W, H);
  }
  function setIntensity(v) { intensity = Math.max(0, Math.min(1, v)); }
  function onResize() { if (running) resize(); }
  return { start, stop, setIntensity, onResize };
})();

/* ========================================================
 * 上香交互
 * ====================================================== */
const IncenseRitual = (() => {
  const clickArea = document.getElementById("incense-click");
  const status = document.getElementById("incense-status");
  const countEl = document.getElementById("incense-count");
  const lensFlare = document.getElementById("lens-flare");
  let count = 0;
  let lit = false;

  function light() {
    if (lit) {
      // 再次点击：增加一炷
      count++;
      flash();
      updateCount();
      SmokeEngine.setIntensity(Math.min(1, 0.4 + count * 0.15));
      return;
    }
    lit = true;
    clickArea.classList.add("lit");
    status.textContent = "香烟袅袅 · 灵犀相通";
    status.classList.add("lit");
    count++;
    flash();
    updateCount();
    SmokeEngine.setIntensity(0.6);
  }

  function flash() {
    lensFlare.classList.remove("flash");
    void lensFlare.offsetWidth; // reflow
    lensFlare.classList.add("flash");
  }

  function updateCount() {
    countEl.textContent = `已献 · ${count} 炷`;
  }

  function init() {
    clickArea.addEventListener("click", light);
  }
  return { init };
})();

/* ========================================================
 * 文本粒子引擎 ParticleEngine（祝福页面）
 * ====================================================== */
const ParticleEngine = (() => {
  const canvas = document.getElementById("particle-canvas");
  const ctx = canvas.getContext("2d");
  const textLayer = document.getElementById("particle-text-layer");
  const tombstone = document.getElementById("tombstone");
  const hint = document.getElementById("blessing-hint");
  let W = 0, H = 0;
  let particles = [];
  let raf = null;
  let running = false;
  let phase = "idle"; // idle | forming | dispersing | done
  let formStartTime = 0;
  let disperseStartTime = 0;
  let targetX = 0, targetY = 0;

  function resize() {
    W = canvas.width = canvas.clientWidth * window.devicePixelRatio;
    H = canvas.height = canvas.clientHeight * window.devicePixelRatio;
    // 目标：墓碑位置
    const ts = tombstone.getBoundingClientRect();
    const cv = canvas.getBoundingClientRect();
    targetX = (ts.left + ts.width / 2 - cv.left) * window.devicePixelRatio;
    targetY = (ts.top + ts.height * 0.4 - cv.top) * window.devicePixelRatio;
  }

  function sampleText(text) {
    // 使用隐藏 canvas 绘制文字，采样像素
    const off = document.createElement("canvas");
    const octx = off.getContext("2d");
    const fontSize = 36 * window.devicePixelRatio;
    const padding = 40 * window.devicePixelRatio;
    octx.font = `400 ${fontSize}px "Noto Serif SC", serif`;
    const lines = wrapText(octx, text, 560 * window.devicePixelRatio);
    const lineHeight = fontSize * 1.6;
    const w = 560 * window.devicePixelRatio + padding * 2;
    const h = lineHeight * lines.length + padding * 2;
    off.width = w;
    off.height = h;
    octx.font = `400 ${fontSize}px "Noto Serif SC", serif`;
    octx.fillStyle = "#fff";
    octx.textAlign = "center";
    octx.textBaseline = "middle";
    lines.forEach((ln, i) => {
      octx.fillText(ln, w / 2, padding + lineHeight * i + lineHeight / 2);
    });

    const data = octx.getImageData(0, 0, w, h).data;
    const step = Math.max(2, Math.floor(3 * window.devicePixelRatio));
    const pts = [];
    for (let y = 0; y < h; y += step) {
      for (let x = 0; x < w; x += step) {
        const i = (y * w + x) * 4;
        if (data[i + 3] > 128) {
          pts.push({ x: x, y: y });
        }
      }
    }
    return { points: pts, width: w, height: h };
  }

  function wrapText(ctx, text, maxWidth) {
    const lines = [];
    let current = "";
    for (const ch of text) {
      const test = current + ch;
      if (ctx.measureText(test).width > maxWidth && current) {
        lines.push(current);
        current = ch;
      } else {
        current = test;
      }
    }
    if (current) lines.push(current);
    return lines;
  }

  function formParticles(text) {
    const sample = sampleText(text);
    // 居中位置
    const cx = W / 2;
    const cy = H / 2;
    const offX = cx - sample.width / 2;
    const offY = cy - sample.height / 2;

    particles = sample.points.map(p => {
      const tx = p.x + offX;
      const ty = p.y + offY;
      // 初始位置：从四周随机飞入
      const angle = Math.random() * Math.PI * 2;
      const dist = 200 * window.devicePixelRatio + Math.random() * 200 * window.devicePixelRatio;
      return {
        x: tx + Math.cos(angle) * dist,
        y: ty + Math.sin(angle) * dist,
        tx: tx,
        ty: ty,
        // 用于消散阶段
        ox: tx,
        oy: ty,
        size: (1.2 + Math.random() * 0.8) * window.devicePixelRatio,
        hue: Math.random() < 0.5 ? [216, 180, 254] : [167, 243, 208],
        delay: Math.random() * 600,
        dispersed: false,
        dx: 0,
        dy: 0,
        vx: 0,
        vy: 0,
        life: 1
      };
    });
  }

  function easeInOut(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "screen";

    if (phase === "forming") {
      const elapsed = now - formStartTime;
      let allArrived = true;
      for (const p of particles) {
        const localT = Math.max(0, elapsed - p.delay) / 1200;
        if (localT < 1) allArrived = false;
        const t = Math.min(1, localT);
        const e = easeInOut(t);
        p.x = p.x + (p.tx - p.x) * (e * 0.08 + 0.02);
        p.y = p.y + (p.ty - p.y) * (e * 0.08 + 0.02);
        const [r, g, b] = p.hue;
        const alpha = Math.min(1, t) * 0.9;
        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.5, p.size), 0, Math.PI * 2);
        ctx.fill();
      }
      if (allArrived && elapsed > 1800) {
        phase = "holding";
        formStartTime = now;
      }
    } else if (phase === "holding") {
      const elapsed = now - formStartTime;
      // 文字稳定 1.2 秒后开始消散
      for (const p of particles) {
        // 微微抖动
        const jitter = Math.sin(now * 0.003 + p.ty) * 0.5;
        const [r, g, b] = p.hue;
        const alpha = 0.85 + Math.sin(now * 0.002 + p.tx) * 0.1;
        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x + jitter, p.y + jitter, Math.max(0.5, p.size), 0, Math.PI * 2);
        ctx.fill();
      }
      if (elapsed > 1400) {
        phase = "dispersing";
        disperseStartTime = now;
        // 计算每个粒子的消散初速度（向墓碑方向 + 风场）
        for (const p of particles) {
          const dx = targetX - p.x;
          const dy = targetY - p.y;
          const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy));
          p.vx = (dx / dist) * (0.8 + Math.random() * 0.6) * window.devicePixelRatio;
          p.vy = (dy / dist) * (0.8 + Math.random() * 0.6) * window.devicePixelRatio - 0.4 * window.devicePixelRatio;
          // 边缘粒子先消散
          const edgeDist = Math.sqrt(
            (p.ox - W / 2) * (p.ox - W / 2) +
            (p.oy - H / 2) * (p.oy - H / 2)
          );
          p.delay = edgeDist * 1.2 + Math.random() * 200;
        }
        tombstone.classList.add("glowing");
      }
    } else if (phase === "dispersing") {
      const elapsed = now - disperseStartTime;
      let alive = 0;
      for (const p of particles) {
        const localT = (elapsed - p.delay) / 1000;
        if (localT < 0) {
          // 仍稳定
          ctx.fillStyle = `rgba(${p.hue[0]},${p.hue[1]},${p.hue[2]},0.85)`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(0.5, p.size), 0, Math.PI * 2);
          ctx.fill();
          alive++;
          continue;
        }
        if (localT > 2.4) continue;
        alive++;

        // 风场 + 反转重力
        const wind = Noise.noise2(p.x * 0.003, p.y * 0.003 + now * 0.0005) * 0.5;
        p.vx += wind * 0.06 * window.devicePixelRatio;
        p.vy -= 0.015 * window.devicePixelRatio; // 反转重力（向上）
        p.x += p.vx;
        p.y += p.vy;

        // 距离墓碑越近，透明度越低（融入）
        const dx = targetX - p.x;
        const dy = targetY - p.y;
        const distToTarget = Math.sqrt(dx * dx + dy * dy);
        const proximity = Math.max(0, 1 - distToTarget / (200 * window.devicePixelRatio));
        const lifeAlpha = Math.max(0, 1 - localT / 2.4);
        const alpha = lifeAlpha * (1 - proximity * 0.7);
        const [r, g, b] = p.hue;

        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.5, p.size * (1 + localT * 0.3)), 0, Math.PI * 2);
        ctx.fill();
      }
      if (alive === 0 || elapsed > 4500) {
        phase = "done";
        tombstone.classList.remove("glowing");
        // 触发完成事件
        window.dispatchEvent(new CustomEvent("blessingdone"));
      }
    }

    ctx.globalCompositeOperation = "source-over";
    if (running) raf = requestAnimationFrame(draw);
  }

  function startForm(text) {
    resize();
    formParticles(text);
    phase = "forming";
    formStartTime = performance.now();
    if (!running) {
      running = true;
      raf = requestAnimationFrame(draw);
    }
  }

  function start() {
    if (running) return;
    running = true;
    resize();
    raf = requestAnimationFrame(draw);
  }
  function stop() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    particles = [];
    phase = "idle";
    ctx.clearRect(0, 0, W, H);
    tombstone.classList.remove("glowing");
  }
  function onResize() { if (running) resize(); }
  function getPhase() { return phase; }
  return { start, stop, startForm, onResize, getPhase };
})();

/* ========================================================
 * 祝福表单
 * ====================================================== */
const BlessingWall = (() => {
  const form = document.getElementById("blessing-form");
  const input = document.getElementById("blessing-input");
  const textLayer = document.getElementById("particle-text-layer");
  const hint = document.getElementById("blessing-hint");

  function onSubmit(e) {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) {
      input.focus();
      return;
    }
    form.classList.add("hidden");
    hint.style.opacity = "0";

    // 短暂展示发光文字，然后粒子化
    textLayer.textContent = text;
    textLayer.classList.add("visible");

    setTimeout(() => {
      textLayer.classList.remove("visible");
      // 等文字层淡出后开始粒子化
      setTimeout(() => {
        ParticleEngine.startForm(text);
      }, 400);
    }, 1200);
  }

  function reset() {
    form.classList.remove("hidden");
    hint.style.opacity = "";
    input.value = "";
    textLayer.textContent = "";
    textLayer.classList.remove("visible");
  }

  function init() {
    form.addEventListener("submit", onSubmit);
    window.addEventListener("blessingdone", () => {
      setTimeout(() => {
        reset();
      }, 1500);
    });
  }
  return { init, reset };
})();

/* ========================================================
 * 初始化
 * ====================================================== */
function init() {
  SceneManager.init();
  IncenseRitual.init();
  BlessingWall.init();

  // 主页面雾气 + 走马灯
  FogEngine.start();
  MemoryCarousel.preload().then(() => MemoryCarousel.start());

  // 场景切换
  window.addEventListener("scenechange", (e) => {
    const name = e.detail.name;
    if (name === "main") {
      FogEngine.start();
      MemoryCarousel.start();
      SmokeEngine.stop();
      ParticleEngine.stop();
    } else if (name === "incense") {
      FogEngine.stop();
      MemoryCarousel.stop();
      SmokeEngine.start();
      ParticleEngine.stop();
    } else if (name === "blessing") {
      FogEngine.stop();
      MemoryCarousel.stop();
      SmokeEngine.stop();
      ParticleEngine.start();
      BlessingWall.reset();
    }
  });

  // 响应式
  window.addEventListener("resize", () => {
    FogEngine.onResize();
    SmokeEngine.onResize();
    ParticleEngine.onResize();
  });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
