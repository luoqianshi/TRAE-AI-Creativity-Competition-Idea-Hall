<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AI 生图测试页面</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    textarea {
      width: 100%;
      height: 140px;
      padding: 12px;
      font-size: 16px;
      line-height: 1.6;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 8px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #409eff;
    }

    .row {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    select,
    input,
    button {
      padding: 10px 12px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    button {
      background: #1677ff;
      color: white;
      border: none;
      cursor: pointer;
      min-width: 120px;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .result {
      margin-top: 24px;
      padding: 16px;
      border-radius: 10px;
      background: #fafafa;
      min-height: 80px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .result img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 12px;
      display: block;
    }

    .error {
      color: #d93025;
    }

    .success {
      color: #188038;
    }

    .tip {
      margin-top: 12px;
      color: #666;
      font-size: 14px;
    }

    .loading {
      color: #1677ff;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>AI 生图测试页面</h1>

      <textarea id="prompt" placeholder="请输入提示词，例如：一只戴墨镜的柴犬，赛博朋克风格，高清，细节丰富"></textarea>

      <div class="row">
        <label>
          模型：
          <select id="model">
            <option value="gpt-image-2">gpt-image-2</option>
            <option value="codex-gpt-image-2">codex-gpt-image-2</option>
          </select>
        </label>

        <label>
          尺寸：
          <select id="size">
            <option value="512x512">512x512</option>
            <option value="1024x1024">1024x1024</option>
          </select>
        </label>

        <button id="btn" onclick="generateImage()">生成图片</button>
      </div>

      <div class="tip">
        当前调用地址：<code>http://javashen.xyz:3001/v1/images/generations</code>
      </div>

      <div id="result" class="result">
        等待输入提示词...
      </div>
    </div>
  </div>

  <script>
    const API_URL = "http://javashen.xyz:3001/v1/images/generations";
    const API_KEY = "shenlang520";

    async function generateImage() {
      const prompt = document.getElementById("prompt").value.trim();
      const model = document.getElementById("model").value;
      const size = document.getElementById("size").value;
      const btn = document.getElementById("btn");
      const result = document.getElementById("result");

      if (!prompt) {
        alert("请输入提示词");
        return;
      }

      btn.disabled = true;
      btn.innerText = "生成中...";
      result.className = "result loading";
      result.innerText = "正在生成图片，可能需要几十秒到几分钟，请不要重复点击...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + API_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: model,
            prompt: prompt,
            n: 1,
            size: size,
            response_format: "url"
          })
        });

        const data = await response.json();

        if (!response.ok) {
          result.className = "result error";
          result.innerText = "请求失败：\n" + JSON.stringify(data, null, 2);
          return;
        }

        const imageUrl = data && data.data && data.data[0] && data.data[0].url;
        const imageBase64 = data && data.data && data.data[0] && data.data[0].b64_json;

        if (imageUrl) {
          result.className = "result success";
          result.innerHTML = `
            <div>生成成功：</div>
            <img src="${imageUrl}" alt="生成图片" />
            <p><a href="${imageUrl}" target="_blank">打开原图</a></p>
          `;
          return;
        }

        if (imageBase64) {
          const src = "data:image/png;base64," + imageBase64;
          result.className = "result success";
          result.innerHTML = `
            <div>生成成功：</div>
            <img src="${src}" alt="生成图片" />
          `;
          return;
        }

        result.className = "result error";
        result.innerText = "接口返回了数据，但没有找到图片地址：\n" + JSON.stringify(data, null, 2);

      } catch (error) {
        result.className = "result error";
        result.innerText = "请求异常：\n" + error.message + "\n\n如果这里提示 Failed to fetch，大概率是跨域 CORS 或接口地址访问问题。";
      } finally {
        btn.disabled = false;
        btn.innerText = "生成图片";
      }
    }
  </script>
</body>
</html>
