<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史上的今天 - 时空地图</title>
    <style>
        :root {
            --bg: #0a0e1a;
            --bg2: #121829;
            --ink: #e8ecf4;
            --muted: #8892a6;
            --rule: #1e2740;
            --accent: #4fc3f7;
            --accent2: #ff7043;
            --glow: rgba(79, 195, 247, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Outfit';
            src: url('./_shared/fonts/Outfit-Regular.ttf') format('truetype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'Outfit';
            src: url('./_shared/fonts/Outfit-Bold.ttf') format('truetype');
            font-weight: 700;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            overflow: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        header {
            position: relative;
            z-index: 10;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(10, 14, 26, 0.9), transparent);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .date-selector {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            background: var(--bg2);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--rule);
        }

        .date-selector label {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .date-selector select,
        .date-selector input {
            background: var(--bg);
            border: 1px solid var(--rule);
            color: var(--ink);
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
        }

        .date-selector select:focus,
        .date-selector input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .view-toggle {
            display: flex;
            gap: 0.25rem;
            background: var(--bg);
            padding: 0.25rem;
            border-radius: 8px;
        }

        .view-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            font-family: inherit;
        }

        .view-btn.active {
            background: var(--accent);
            color: var(--bg);
            font-weight: 600;
        }

        main {
            position: relative;
            z-index: 5;
            display: grid;
            grid-template-columns: 1fr 380px;
            height: calc(100vh - 100px);
            gap: 1rem;
            padding: 0 2rem 1rem;
        }

        .globe-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .globe-wrapper {
            position: relative;
            width: 500px;
            height: 500px;
        }

        .globe {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 30%, #01579b 60%, #006064 100%);
            box-shadow: 
                inset -80px -30px 100px rgba(0, 0, 0, 0.6),
                inset 20px 20px 50px rgba(79, 195, 247, 0.2),
                0 0 60px var(--glow),
                0 0 120px rgba(79, 195, 247, 0.15);
            overflow: hidden;
            animation: rotate 60s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .globe::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 15%;
            width: 30%;
            height: 20%;
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.3), transparent);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        .continent {
            position: absolute;
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            border-radius: 50% 30% 40% 60%;
            opacity: 0.8;
        }

        .event-marker {
            position: absolute;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            z-index: 20;
            cursor: pointer;
        }

        .marker-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--accent2);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .marker-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--accent2);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--accent2);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        .event-marker:hover .marker-dot {
            transform: translate(-50%, -50%) scale(1.5);
            background: var(--accent);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow: hidden;
        }

        .date-header {
            text-align: center;
            padding: 1rem;
            background: var(--bg2);
            border-radius: 16px;
            border: 1px solid var(--rule);
        }

        .date-display {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .date-subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .events-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .stat-card {
            background: var(--bg2);
            padding: 0.75rem;
            border-radius: 12px;
            border: 1px solid var(--rule);
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.25rem;
        }

        .events-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding-right: 0.5rem;
        }

        .events-list::-webkit-scrollbar {
            width: 4px;
        }

        .events-list::-webkit-scrollbar-track {
            background: var(--bg2);
            border-radius: 2px;
        }

        .events-list::-webkit-scrollbar-thumb {
            background: var(--rule);
            border-radius: 2px;
        }

        .event-card {
            background: var(--bg2);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid var(--rule);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .event-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--accent);
        }

        .event-card:hover {
            border-color: var(--accent);
            transform: translateX(4px);
            box-shadow: 0 4px 20px rgba(79, 195, 247, 0.15);
        }

        .event-card.highlighted {
            border-color: var(--accent2);
            background: linear-gradient(135deg, var(--bg2), rgba(255, 112, 67, 0.1));
        }

        .event-year {
            font-size: 0.8rem;
            color: var(--accent2);
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .event-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .event-location {
            font-size: 0.8rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .event-desc {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 0.5rem;
            line-height: 1.5;
            display: none;
        }

        .event-card.expanded .event-desc {
            display: block;
        }

        .event-tooltip {
            position: fixed;
            background: var(--bg2);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 1rem;
            max-width: 280px;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .event-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .tooltip-year {
            color: var(--accent2);
            font-weight: 600;
            font-size: 0.85rem;
        }

        .tooltip-title {
            font-weight: 600;
            margin: 0.25rem 0;
        }

        .tooltip-desc {
            font-size: 0.8rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 26, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            border-radius: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .loading-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .ai-thinking {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .ai-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--rule);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .ai-text {
            color: var(--accent);
            font-size: 0.9rem;
        }

        .category-filter {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .category-tag {
            background: var(--bg);
            border: 1px solid var(--rule);
            color: var(--muted);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-tag.active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
                height: auto;
            }
            .globe-wrapper {
                width: 350px;
                height: 350px;
            }
            .sidebar {
                max-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <header>
        <div class="logo">🌍 历史上的今天 · 时空地图</div>
        <div class="date-selector">
            <label>选择日期：</label>
            <select id="monthSelect">
                <option value="1">1月</option>
                <option value="2">2月</option>
                <option value="3">3月</option>
                <option value="4">4月</option>
                <option value="5">5月</option>
                <option value="6">6月</option>
                <option value="7" selected>7月</option>
                <option value="8">8月</option>
                <option value="9">9月</option>
                <option value="10">10月</option>
                <option value="11">11月</option>
                <option value="12">12月</option>
            </select>
            <select id="daySelect">
            </select>
            <div class="view-toggle">
                <button class="view-btn active" data-view="day">当天</button>
                <button class="view-btn" data-view="month">当月</button>
            </div>
        </div>
    </header>

    <main>
        <div class="globe-container">
            <div class="globe-wrapper">
                <div class="globe" id="globe">
                    <!-- Continents will be added by JS -->
                </div>
                <!-- Event markers will be added by JS -->
            </div>
            <div class="loading-overlay" id="loadingOverlay">
                <div class="ai-thinking">
                    <div class="ai-spinner"></div>
                    <div class="ai-text">🤖 AI 正在检索历史事件...</div>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="date-header">
                <div class="date-display" id="dateDisplay">7月14日</div>
                <div class="date-subtitle">历史上的今天发生了这些大事</div>
            </div>

            <div class="events-stats">
                <div class="stat-card">
                    <div class="stat-number" id="eventCount">8</div>
                    <div class="stat-label">历史事件</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="countryCount">6</div>
                    <div class="stat-label">涉及地区</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="centuryCount">5</div>
                    <div class="stat-label">跨越世纪</div>
                </div>
            </div>

            <div class="category-filter">
                <span class="category-tag active" data-category="all">全部</span>
                <span class="category-tag" data-category="politics">政治</span>
                <span class="category-tag" data-category="science">科技</span>
                <span class="category-tag" data-category="culture">文化</span>
                <span class="category-tag" data-category="war">战争</span>
            </div>

            <div class="events-list" id="eventsList">
                <!-- Events will be added by JS -->
            </div>
        </div>
    </main>

    <div class="event-tooltip" id="eventTooltip">
        <div class="tooltip-year"></div>
        <div class="tooltip-title"></div>
        <div class="tooltip-desc"></div>
    </div>

    <script src="./assets/app.js"></script>
</body>
</html>
