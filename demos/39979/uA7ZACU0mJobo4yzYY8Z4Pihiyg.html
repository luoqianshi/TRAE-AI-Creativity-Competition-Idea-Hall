<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离线表格清洗工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .instructions {
            background: #e8f4f8;
            border: 1px solid #b8daE4;
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #31708f;
            line-height: 1.6;
        }
        .instructions strong {
            color: #23527c;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .panel {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 16px;
        }
        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #3498db;
        }
        textarea {
            width: 100%;
            height: 200px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            font-family: "Consolas", "Microsoft YaHei", monospace;
            font-size: 13px;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52,152,219,0.2);
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #3498db;
            color: #fff;
        }
        .btn-primary:hover {
            background: #2980b9;
        }
        .btn-success {
            background: #27ae60;
            color: #fff;
        }
        .btn-success:hover {
            background: #229954;
        }
        .btn-danger {
            background: #e74c3c;
            color: #fff;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .btn-secondary {
            background: #95a5a6;
            color: #fff;
        }
        .btn-secondary:hover {
            background: #7f8c8d;
        }
        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
        }
        .keyword-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .keyword-input-group input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }
        .keyword-input-group input:focus {
            outline: none;
            border-color: #3498db;
        }
        .keyword-list {
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .keyword-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }
        .keyword-item:last-child {
            border-bottom: none;
        }
        .keyword-item:hover {
            background: #f9f9f9;
        }
        .keyword-text {
            word-break: break-all;
        }
        .keyword-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        .setting-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .setting-item label {
            font-size: 14px;
            color: #555;
            cursor: pointer;
        }
        .setting-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .mode-select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            min-width: 200px;
        }
        .replace-input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            width: 150px;
        }
        .table-wrapper {
            overflow: auto;
            max-height: 500px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
        }
        table {
            border-collapse: collapse;
            width: max-content;
            min-width: 100%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            white-space: nowrap;
            font-size: 13px;
        }
        th {
            background: #f8f9fa;
            font-weight: bold;
            color: #333;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        td.highlight {
            background: #ffff00;
        }
        .row-even {
            background: #fcfcfc;
        }
        .row-odd {
            background: #fff;
        }
        .export-section {
            text-align: center;
            margin-top: 20px;
        }
        .export-section .btn {
            padding: 12px 40px;
            font-size: 16px;
        }
        .stats {
            font-size: 13px;
            color: #666;
            margin-top: 8px;
        }
        .empty-hint {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 14px;
        }
        .batch-textarea {
            width: 100%;
            height: 80px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 8px;
            font-size: 12px;
            resize: vertical;
            margin-bottom: 8px;
        }
        .batch-textarea:focus {
            outline: none;
            border-color: #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 离线表格清洗工具</h1>

        <div class="instructions">
            <strong>使用说明：</strong>
            ① 从WPS/Excel复制表格数据，粘贴到左侧输入框 → 点击"解析数据"；
            ② 在右侧添加关键词 → 设置清洗模式 → 点击"执行清洗"；
            ③ 预览确认后点击"导出Excel"下载结果。<br>
            <strong>安全说明：</strong>本工具完全离线运行，不上传任何数据，所有处理均在本地完成。
        </div>

        <div class="main-grid">
            <div class="panel">
                <div class="panel-title">📋 粘贴输入区</div>
                <textarea id="pasteInput" placeholder="从WPS/Excel复制表格数据，粘贴至此...
支持Tab分隔的多列数据"></textarea>
                <div style="margin-top: 10px;">
                    <button class="btn btn-primary" onclick="parseData()">解析数据</button>
                    <button class="btn btn-secondary" onclick="clearInput()">清空输入</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">🔑 关键词管理</div>

                <div class="keyword-input-group">
                    <input type="text" id="keywordInput" placeholder="输入关键词后回车添加" onkeypress="if(event.key==='Enter'){addKeyword();event.preventDefault();}">
                    <button class="btn btn-primary btn-sm" onclick="addKeyword()">添加</button>
                </div>

                <div style="margin-bottom: 8px; font-size: 12px; color: #666;">批量导入（每行一个关键词）：</div>
                <textarea id="batchInput" class="batch-textarea" placeholder="粘贴多个关键词，每行一个"></textarea>
                <button class="btn btn-secondary btn-sm" onclick="batchImportKeywords()" style="margin-bottom: 12px;">批量导入关键词</button>

                <div class="keyword-actions">
                    <button class="btn btn-danger btn-sm" onclick="clearAllKeywords()">清空全部</button>
                </div>

                <div id="keywordCount" class="stats">已添加 0 个关键词</div>
                <div class="keyword-list" id="keywordList">
                    <div class="empty-hint">暂无关键词，请添加</div>
                </div>
            </div>
        </div>

        <div class="panel" style="margin-bottom: 20px;">
            <div class="panel-title">⚙️ 清洗设置</div>
            <div class="settings-grid">
                <div class="setting-item">
                    <input type="checkbox" id="caseSensitive">
                    <label for="caseSensitive">区分大小写</label>
                </div>
                <div class="setting-item">
                    <input type="checkbox" id="skipHeader" checked>
                    <label for="skipHeader">跳过第一行（表头）</label>
                </div>
                <div class="setting-item">
                    <select id="cleanMode" class="mode-select" onchange="toggleReplaceInput()">
                        <option value="deleteRow">删除匹配整行</option>
                        <option value="clearCell">清除单元格内关键词文字</option>
                        <option value="highlight">高亮标记匹配单元格</option>
                        <option value="replace">关键词替换为...</option>
                    </select>
                </div>
                <div class="setting-item" id="replaceInputContainer" style="display: none;">
                    <input type="text" id="replaceText" class="replace-input" placeholder="替换文字">
                </div>
            </div>
            <div style="margin-top: 12px;">
                <button class="btn btn-success" onclick="executeClean()">执行清洗</button>
                <button class="btn btn-secondary" onclick="resetTable()">重置表格</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">👁️ 表格预览</div>
            <div id="tableStats" class="stats"></div>
            <div class="table-wrapper" id="tableWrapper">
                <div class="empty-hint">请先粘贴数据并点击"解析数据"</div>
            </div>
        </div>

        <div class="export-section">
            <button class="btn btn-success" onclick="exportExcel()">📥 导出Excel文件</button>
        </div>
    </div>

    <script>
        // ===== 全局变量 =====
        var originalData = [];
        var displayData = [];
        var keywords = [];
        var highlightCells = new Set();

        // ===== 数据解析 =====
        function parseData() {
            var input = document.getElementById('pasteInput').value;
            if (!input.trim()) {
                alert('请先粘贴数据');
                return;
            }

            var rows = input.split('\n');
            originalData = [];
            highlightCells.clear();

            for (var i = 0; i < rows.length; i++) {
                var row = rows[i];
                if (!row.trim()) continue;

                var cells;
                if (row.indexOf('\t') !== -1) {
                    cells = row.split('\t');
                } else if (row.indexOf(',') !== -1) {
                    cells = row.split(',');
                } else {
                    cells = [row];
                }

                for (var j = 0; j < cells.length; j++) {
                    cells[j] = cells[j].replace(/^\uFEFF/, '').trim();
                }
                originalData.push(cells);
            }

            displayData = originalData.map(function(row) {
                return row.slice();
            });

            renderTable();
            updateStats();
        }

        // ===== 表格渲染 =====
        function renderTable() {
            var wrapper = document.getElementById('tableWrapper');

            if (displayData.length === 0) {
                wrapper.innerHTML = '<div class="empty-hint">暂无数据</div>';
                return;
            }

            var maxCols = 0;
            for (var i = 0; i < displayData.length; i++) {
                if (displayData[i].length > maxCols) {
                    maxCols = displayData[i].length;
                }
            }

            var html = '<table>';
            for (var r = 0; r < displayData.length; r++) {
                html += '<tr class="' + (r % 2 === 0 ? 'row-even' : 'row-odd') + '">';
                for (var c = 0; c < maxCols; c++) {
                    var cellId = r + '_' + c;
                    var cellClass = highlightCells.has(cellId) ? ' class="highlight"' : '';
                    var cellValue = displayData[r][c] !== undefined ? displayData[r][c] : '';
                    html += '<td' + cellClass + '>' + escapeHtml(cellValue) + '</td>';
                }
                html += '</tr>';
            }
            html += '</table>';

            wrapper.innerHTML = html;
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateStats() {
            var stats = document.getElementById('tableStats');
            var rows = displayData.length;
            var cols = 0;
            for (var i = 0; i < displayData.length; i++) {
                if (displayData[i].length > cols) cols = displayData[i].length;
            }
            stats.textContent = '数据规模：' + rows + ' 行 × ' + cols + ' 列 | 高亮单元格：' + highlightCells.size + ' 个';
        }

        // ===== 关键词管理 =====
        function addKeyword() {
            var input = document.getElementById('keywordInput');
            var val = input.value.trim();
            if (val && keywords.indexOf(val) === -1) {
                keywords.push(val);
                input.value = '';
                renderKeywords();
            }
        }

        function batchImportKeywords() {
            var input = document.getElementById('batchInput');
            var lines = input.value.split('\n');
            var added = 0;
            for (var i = 0; i < lines.length; i++) {
                var kw = lines[i].trim();
                if (kw && keywords.indexOf(kw) === -1) {
                    keywords.push(kw);
                    added++;
                }
            }
            input.value = '';
            renderKeywords();
            alert('已批量导入 ' + added + ' 个关键词');
        }

        function removeKeyword(index) {
            keywords.splice(index, 1);
            renderKeywords();
        }

        function clearAllKeywords() {
            if (keywords.length === 0) return;
            if (confirm('确定要清空所有关键词吗？')) {
                keywords = [];
                renderKeywords();
            }
        }

        function renderKeywords() {
            var list = document.getElementById('keywordList');
            var count = document.getElementById('keywordCount');
            count.textContent = '已添加 ' + keywords.length + ' 个关键词';

            if (keywords.length === 0) {
                list.innerHTML = '<div class="empty-hint">暂无关键词，请添加</div>';
                return;
            }

            var html = '';
            for (var i = 0; i < keywords.length; i++) {
                html += '<div class="keyword-item">' +
                    '<span class="keyword-text">' + escapeHtml(keywords[i]) + '</span>' +
                    '<button class="btn btn-danger btn-sm" onclick="removeKeyword(' + i + ')">删除</button>' +
                    '</div>';
            }
            list.innerHTML = html;
        }

        // ===== 清洗设置 =====
        function toggleReplaceInput() {
            var mode = document.getElementById('cleanMode').value;
            var container = document.getElementById('replaceInputContainer');
            container.style.display = mode === 'replace' ? 'flex' : 'none';
        }

        // ===== 清洗执行 =====
        function executeClean() {
            if (displayData.length === 0) {
                alert('请先解析数据');
                return;
            }
            if (keywords.length === 0) {
                alert('请添加关键词');
                return;
            }

            var mode = document.getElementById('cleanMode').value;
            var caseSensitive = document.getElementById('caseSensitive').checked;
            var skipHeader = document.getElementById('skipHeader').checked;
            var replaceText = document.getElementById('replaceText').value;

            displayData = originalData.map(function(row) {
                return row.slice();
            });
            highlightCells.clear();

            var rowsToDelete = [];

            for (var r = 0; r < displayData.length; r++) {
                if (skipHeader && r === 0) continue;

                var row = displayData[r];
                var matchFound = false;
                var cellHighlights = [];

                for (var c = 0; c < row.length; c++) {
                    var cell = row[c] || '';
                    var cellMatch = false;

                    for (var k = 0; k < keywords.length; k++) {
                        var kw = keywords[k];
                        var searchIn = caseSensitive ? cell : cell.toLowerCase();
                        var searchFor = caseSensitive ? kw : kw.toLowerCase();

                        if (searchIn.indexOf(searchFor) !== -1) {
                            cellMatch = true;
                            matchFound = true;
                            break;
                        }
                    }

                    if (cellMatch) {
                        cellHighlights.push(c);

                        if (mode === 'clearCell') {
                            var val = row[c] || '';
                            for (var k = 0; k < keywords.length; k++) {
                                var kw = keywords[k];
                                if (caseSensitive) {
                                    val = val.split(kw).join('');
                                } else {
                                    val = val.replace(new RegExp(escapeRegex(kw), 'gi'), '');
                                }
                            }
                            row[c] = val;
                        } else if (mode === 'replace') {
                            var val = row[c] || '';
                            for (var k = 0; k < keywords.length; k++) {
                                var kw = keywords[k];
                                if (caseSensitive) {
                                    val = val.split(kw).join(replaceText);
                                } else {
                                    val = val.replace(new RegExp(escapeRegex(kw), 'gi'), replaceText);
                                }
                            }
                            row[c] = val;
                        }
                    }
                }

                if (mode === 'highlight') {
                    for (var c = 0; c < cellHighlights.length; c++) {
                        highlightCells.add(r + '_' + cellHighlights[c]);
                    }
                }

                if (mode === 'deleteRow' && matchFound) {
                    rowsToDelete.push(r);
                }
            }

            if (mode === 'deleteRow') {
                for (var i = rowsToDelete.length - 1; i >= 0; i--) {
                    displayData.splice(rowsToDelete[i], 1);
                }
            }

            renderTable();
            updateStats();
            alert('清洗完成！');
        }

        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function resetTable() {
            if (originalData.length === 0) return;
            displayData = originalData.map(function(row) {
                return row.slice();
            });
            highlightCells.clear();
            renderTable();
            updateStats();
        }

        function clearInput() {
            document.getElementById('pasteInput').value = '';
            originalData = [];
            displayData = [];
            highlightCells.clear();
            renderTable();
            updateStats();
        }

        // ===== Excel导出 - 使用标准XLSX格式 =====
        function exportExcel() {
            if (displayData.length === 0) {
                alert('没有数据可导出');
                return;
            }

            var maxCols = 0;
            for (var i = 0; i < displayData.length; i++) {
                if (displayData[i].length > maxCols) {
                    maxCols = displayData[i].length;
                }
            }

            var sheetData = [];
            for (var r = 0; r < displayData.length; r++) {
                var row = [];
                for (var c = 0; c < maxCols; c++) {
                    var val = displayData[r][c] !== undefined ? displayData[r][c] : '';
                    val = String(val).replace(/<[^>]*>/g, '');
                    row.push(val);
                }
                sheetData.push(row);
            }

            try {
                var xlsxData = createXLSX(sheetData);
                var blob = new Blob([xlsxData], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});

                var now = new Date();
                var timestamp = now.getFullYear() + '' +
                    String(now.getMonth() + 1).padStart(2, '0') + '' +
                    String(now.getDate()).padStart(2, '0') + '_' +
                    String(now.getHours()).padStart(2, '0') + '' +
                    String(now.getMinutes()).padStart(2, '0');

                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = '清洗结果_' + timestamp + '.xlsx';
                document.body.appendChild(a);
                a.click();
                setTimeout(function() {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
            } catch (e) {
                console.error('导出失败:', e);
                exportCSV(sheetData);
            }
        }

        function exportCSV(data) {
            var csv = '';
            for (var r = 0; r < data.length; r++) {
                var row = [];
                for (var c = 0; c < data[r].length; c++) {
                    var val = String(data[r][c]).replace(/"/g, '""');
                    row.push('"' + val + '"');
                }
                csv += row.join(',') + '\n';
            }

            var blob = new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8'});
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = '清洗结果_' + new Date().getTime() + '.csv';
            document.body.appendChild(a);
            a.click();
            setTimeout(function() {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
            alert('已切换为CSV格式导出（兼容所有表格软件）');
        }

        // 创建标准XLSX文件
        function createXLSX(data) {
            var rowCount = data.length;
            var colCount = rowCount > 0 ? data[0].length : 0;

            function encodeUTF8(str) {
                var utf8 = [];
                for (var i = 0; i < str.length; i++) {
                    var charCode = str.charCodeAt(i);
                    if (charCode < 0x80) {
                        utf8.push(charCode);
                    } else if (charCode < 0x800) {
                        utf8.push(0xC0 | (charCode >> 6));
                        utf8.push(0x80 | (charCode & 0x3F));
                    } else {
                        utf8.push(0xE0 | (charCode >> 12));
                        utf8.push(0x80 | ((charCode >> 6) & 0x3F));
                        utf8.push(0x80 | (charCode & 0x3F));
                    }
                }
                return utf8;
            }

            function crc32(buf) {
                var crc = 0xFFFFFFFF;
                var table = [];
                for (var n = 0; n < 256; n++) {
                    var c = n;
                    for (var k = 0; k < 8; k++) {
                        c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                    }
                    table[n] = c;
                }
                for (var i = 0; i < buf.length; i++) {
                    crc = table[(crc ^ buf[i]) & 0xFF] ^ (crc >>> 8);
                }
                return (crc ^ 0xFFFFFFFF) >>> 0;
            }

            function createZipEntry(name, content) {
                var nameBytes = encodeUTF8(name);
                var contentBytes = encodeUTF8(content);
                var crc = crc32(contentBytes);

                var localHeader = [];
                localHeader.push(0x50, 0x4B, 0x03, 0x04);
                localHeader.push(0x14, 0x00);
                localHeader.push(0x00, 0x00);
                localHeader.push(0x00, 0x00);
                localHeader.push(0x00, 0x00);
                localHeader.push(0x00, 0x00);
                for (var i = 0; i < 4; i++) localHeader.push((crc >> (i * 8)) & 0xFF);
                for (var i = 0; i < 4; i++) localHeader.push((contentBytes.length >> (i * 8)) & 0xFF);
                for (var i = 0; i < 4; i++) localHeader.push((contentBytes.length >> (i * 8)) & 0xFF);
                localHeader.push(nameBytes.length & 0xFF);
                localHeader.push((nameBytes.length >> 8) & 0xFF);
                localHeader.push(0x00, 0x00);
                localHeader.push.apply(localHeader, nameBytes);
                localHeader.push.apply(localHeader, contentBytes);

                var centralHeader = [];
                centralHeader.push(0x50, 0x4B, 0x01, 0x02);
                centralHeader.push(0x14, 0x00);
                centralHeader.push(0x14, 0x00);
                centralHeader.push(0x00, 0x00);
                centralHeader.push(0x00, 0x00);
                centralHeader.push(0x00, 0x00);
                for (var i = 0; i < 4; i++) centralHeader.push((crc >> (i * 8)) & 0xFF);
                for (var i = 0; i < 4; i++) centralHeader.push((contentBytes.length >> (i * 8)) & 0xFF);
                for (var i = 0; i < 4; i++) centralHeader.push((contentBytes.length >> (i * 8)) & 0xFF);
                centralHeader.push(nameBytes.length & 0xFF);
                centralHeader.push((nameBytes.length >> 8) & 0xFF);
                centralHeader.push(0x00, 0x00);
                centralHeader.push(0x00, 0x00);
                centralHeader.push(0x00, 0x00);
                centralHeader.push(0x00, 0x00);
                centralHeader.push(0x00, 0x00);
                for (var i = 0; i < 4; i++) centralHeader.push(0x00);
                for (var i = 0; i < 4; i++) centralHeader.push(0x00);
                centralHeader.push.apply(centralHeader, nameBytes);

                return {
                    local: localHeader,
                    central: centralHeader,
                    localSize: localHeader.length,
                    centralSize: centralHeader.length,
                    name: name
                };
            }

            function colLetter(col) {
                var letter = '';
                col++;
                while (col > 0) {
                    var mod = (col - 1) % 26;
                    letter = String.fromCharCode(65 + mod) + letter;
                    col = Math.floor((col - 1) / 26);
                }
                return letter;
            }

            var strings = [];
            var stringMap = {};
            var stringIndex = 0;

            function addString(str) {
                if (stringMap[str] === undefined) {
                    stringMap[str] = stringIndex++;
                    strings.push(str);
                }
                return stringMap[str];
            }

            var sheetXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
            for (var r = 0; r < rowCount; r++) {
                sheetXml += '<row r="' + (r + 1) + '">';
                for (var c = 0; c < colCount; c++) {
                    var val = data[r][c];
                    var cellRef = colLetter(c) + (r + 1);
                    if (val !== '' && !isNaN(Number(val)) && /^\s*-?\d+(\.\d+)?\s*$/.test(val)) {
                        sheetXml += '<c r="' + cellRef + '" t="n"><v>' + Number(val) + '</v></c>';
                    } else {
                        var idx = addString(val || '');
                        sheetXml += '<c r="' + cellRef + '" t="s"><v>' + idx + '</v></c>';
                    }
                }
                sheetXml += '</row>';
            }
            sheetXml += '</sheetData></worksheet>';

            var sstXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="' + strings.length + '" uniqueCount="' + strings.length + '">';
            for (var i = 0; i < strings.length; i++) {
                var escaped = String(strings[i]).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
                sstXml += '<si><t>' + escaped + '</t></si>';
            }
            sstXml += '</sst>';

            var wbXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Sheet1" sheetId="1" r:id="rId1"/></sheets></workbook>';
            var ctXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/></Types>';
            var relsXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
            var wbRelsXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/></Relationships>';

            var entries = [
                createZipEntry('[Content_Types].xml', ctXml),
                createZipEntry('_rels/.rels', relsXml),
                createZipEntry('xl/workbook.xml', wbXml),
                createZipEntry('xl/_rels/workbook.xml.rels', wbRelsXml),
                createZipEntry('xl/worksheets/sheet1.xml', sheetXml),
                createZipEntry('xl/sharedStrings.xml', sstXml)
            ];

            var localData = [];
            var centralData = [];
            var localOffset = 0;
            var centralOffset = 0;

            for (var i = 0; i < entries.length; i++) {
                localData.push.apply(localData, entries[i].local);
                centralData.push.apply(centralData, entries[i].central);
            }

            centralOffset = localData.length;

            var eocd = [];
            eocd.push(0x50, 0x4B, 0x05, 0x06);
            eocd.push(0x00, 0x00);
            eocd.push(0x00, 0x00);
            eocd.push(entries.length & 0xFF);
            eocd.push((entries.length >> 8) & 0xFF);
            eocd.push(entries.length & 0xFF);
            eocd.push((entries.length >> 8) & 0xFF);
            for (var i = 0; i < 4; i++) eocd.push((centralData.length >> (i * 8)) & 0xFF);
            for (var i = 0; i < 4; i++) eocd.push((centralOffset >> (i * 8)) & 0xFF);
            eocd.push(0x00, 0x00);

            var zipData = localData.concat(centralData).concat(eocd);
            return new Uint8Array(zipData).buffer;
        }

        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', function() {
            renderKeywords();
            updateStats();
        });
    </script>
</body>
</html>
