<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习经验条 - Learning XP</title>
  <style>
    :root {
      --primary: #6366f1;
      --secondary: #8b5cf6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --xp-gold: #fbbf24;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --daily: #22c55e;
      --weekly: #3b82f6;
      --special: #a855f7;
      --main: #f59e0b;
      --side: #6b7280;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--bg-card) 0%, #1a1f35 100%);
      padding: 1.5rem 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      font-size: 2rem;
    }

    .logo h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .level-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex: 1;
      min-width: 250px;
    }

    .level-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(99, 102, 241, 0.2);
      padding: 0.5rem 1rem;
      border-radius: 50px;
      border: 1px solid var(--primary);
    }

    .level-number {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    .level-label {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .xp-bar-container {
      flex: 1;
      max-width: 400px;
    }

    .xp-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 0.25rem;
    }

    .xp-bar {
      height: 12px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .xp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--xp-gold), #fcd34d);
      border-radius: 10px;
      transition: width 0.5s ease-out;
      position: relative;
    }

    .xp-bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .stats {
      display: flex;
      gap: 1.5rem;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--xp-gold);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    /* Navigation Tabs */
    .nav-tabs {
      background: var(--bg-card);
      padding: 0 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .nav-tabs-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding: 1rem 0;
    }

    .nav-tab {
      padding: 0.75rem 1.5rem;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
      white-space: nowrap;
      position: relative;
    }

    .nav-tab:hover {
      background: rgba(255,255,255,0.05);
      color: var(--text-primary);
    }

    .nav-tab.active {
      background: var(--primary);
      color: white;
    }

    .nav-tab .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      font-size: 0.75rem;
      margin-left: 0.5rem;
    }

    .nav-tab.active .count {
      background: rgba(255,255,255,0.3);
    }

    /* Main Content */
    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .add-task-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .add-task-btn:hover {
      background: #5558e3;
      transform: translateY(-1px);
    }

    /* Task Grid */
    .task-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .task-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 1.25rem;
      border: 1px solid rgba(255,255,255,0.05);
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .task-card:hover {
      border-color: rgba(255,255,255,0.1);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .task-card.completed {
      opacity: 0.7;
    }

    .task-card.completed::after {
      content: '✓ 已完成';
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--success);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .task-category {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .task-category.daily { background: rgba(34, 197, 94, 0.2); color: var(--daily); }
    .task-category.weekly { background: rgba(59, 130, 246, 0.2); color: var(--weekly); }
    .task-category.special { background: rgba(168, 85, 247, 0.2); color: var(--special); }
    .task-category.main { background: rgba(245, 158, 11, 0.2); color: var(--main); }
    .task-category.side { background: rgba(107, 114, 128, 0.2); color: var(--side); }

    .task-xp {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      font-weight: 700;
      color: var(--xp-gold);
    }

    .task-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .task-description {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .task-progress {
      margin-bottom: 1rem;
    }

    .progress-bar {
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      border-radius: 3px;
      transition: width 0.3s;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    .task-actions {
      display: flex;
      gap: 0.75rem;
    }

    .verify-btn {
      flex: 1;
      padding: 0.75rem;
      background: linear-gradient(135deg, var(--success), #059669);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .verify-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }

    .verify-btn:disabled {
      background: var(--bg-dark);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* XP Float Animation */
    .xp-float {
      position: fixed;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--xp-gold);
      pointer-events: none;
      z-index: 1000;
      text-shadow: 0 2px 10px rgba(251, 191, 36, 0.5);
    }

    /* Level Up Overlay */
    .level-up-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .level-up-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .level-up-content {
      text-align: center;
      animation: levelUpBounce 0.5s ease-out;
    }

    @keyframes levelUpBounce {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .level-up-title {
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--xp-gold), #fcd34d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }

    .level-up-number {
      font-size: 6rem;
      font-weight: 700;
      color: var(--primary);
      text-shadow: 0 0 50px var(--primary);
    }

    .level-up-subtitle {
      font-size: 1.25rem;
      color: var(--text-secondary);
      margin-top: 1rem;
    }

    .close-level-up {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.9);
      transition: transform 0.2s;
    }

    .modal-overlay.show .modal {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.25rem;
      line-height: 1;
    }

    .modal-close:hover {
      color: var(--text-primary);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-dark);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .modal-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .btn {
      flex: 1;
      padding: 0.875rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
    }

    .btn-primary:hover {
      background: #5558e3;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.05);
      color: var(--text-primary);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .empty-state-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
      font-size: 0.875rem;
      border-top: 1px solid rgba(255,255,255,0.05);
      margin-top: 3rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header-content {
        flex-direction: column;
        align-items: stretch;
        gap: 1rem;
      }

      .level-info {
        flex-direction: column;
        align-items: stretch;
        gap: 0.75rem;
      }

      .xp-bar-container {
        max-width: none;
      }

      .stats {
        justify-content: center;
      }

      .nav-tabs-content {
        padding: 0.75rem 0;
      }

      .main-content {
        padding: 1rem;
      }

      .task-grid {
        grid-template-columns: 1fr;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }

    /* XP Particle */
    .xp-particle {
      position: fixed;
      width: 8px;
      height: 8px;
      background: var(--xp-gold);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1001;
      box-shadow: 0 0 10px var(--xp-gold);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <span class="logo-icon">📚</span>
        <h1>学习经验条</h1>
      </div>
      <div class="level-info">
        <div class="level-badge">
          <span class="level-number" id="levelNumber">1</span>
          <span class="level-label">级</span>
        </div>
        <div class="xp-bar-container">
          <div class="xp-bar-label">
            <span>经验值</span>
            <span><span id="currentXP">0</span> / <span id="maxXP">100</span> XP</span>
          </div>
          <div class="xp-bar">
            <div class="xp-bar-fill" id="xpBarFill" style="width: 0%"></div>
          </div>
        </div>
      </div>
      <div class="stats">
        <div class="stat-item">
          <div class="stat-value" id="totalTasks">0</div>
          <div class="stat-label">总任务</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="completedTasks">0</div>
          <div class="stat-label">已完成</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="totalXPEarned">0</div>
          <div class="stat-label">累计XP</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="nav-tabs">
    <div class="nav-tabs-content">
      <button class="nav-tab active" data-category="all">
        全部<span class="count" id="count-all">0</span>
      </button>
      <button class="nav-tab" data-category="daily">
        每日<span class="count" id="count-daily">0</span>
      </button>
      <button class="nav-tab" data-category="weekly">
        每周<span class="count" id="count-weekly">0</span>
      </button>
      <button class="nav-tab" data-category="special">
        特殊<span class="count" id="count-special">0</span>
      </button>
      <button class="nav-tab" data-category="main">
        主线<span class="count" id="count-main">0</span>
      </button>
      <button class="nav-tab" data-category="side">
        支线<span class="count" id="count-side">0</span>
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="section-header">
      <h2 class="section-title" id="sectionTitle">全部任务</h2>
      <button class="add-task-btn" id="addTaskBtn">
        <span>+</span> 添加任务
      </button>
    </div>

    <div class="task-grid" id="taskGrid">
      <!-- Tasks will be rendered here -->
    </div>

    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-state-icon">📋</div>
      <div class="empty-state-title">暂无任务</div>
      <p>点击上方"添加任务"开始你的学习之旅吧！</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>学习经验条 v1.0 - 让学习变得更有成就感和趣味性</p>
  </footer>

  <!-- Add Task Modal -->
  <div class="modal-overlay" id="addTaskModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">添加新任务</h3>
        <button class="modal-close" id="closeAddModal">&times;</button>
      </div>
      <form id="addTaskForm">
        <div class="form-group">
          <label class="form-label">任务标题</label>
          <input type="text" class="form-input" id="taskTitle" placeholder="输入任务标题" required>
        </div>
        <div class="form-group">
          <label class="form-label">任务描述</label>
          <textarea class="form-textarea" id="taskDescription" placeholder="输入任务描述（可选）"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">任务分类</label>
            <select class="form-select" id="taskCategory" required>
              <option value="daily">每日任务</option>
              <option value="weekly">每周任务</option>
              <option value="special">特殊任务</option>
              <option value="main">主线任务</option>
              <option value="side">支线任务</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">奖励XP</label>
            <input type="number" class="form-input" id="taskXP" placeholder="10" min="1" value="10" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">初始进度 (%)</label>
          <input type="number" class="form-input" id="taskProgress" placeholder="0" min="0" max="100" value="0">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelAddTask">取消</button>
          <button type="submit" class="btn btn-primary">添加任务</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Verify Modal -->
  <div class="modal-overlay" id="verifyModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">验收任务</h3>
        <button class="modal-close" id="closeVerifyModal">&times;</button>
      </div>
      <div id="verifyContent">
        <p style="margin-bottom: 1.5rem; color: var(--text-secondary);">确认完成此任务？</p>
        <div style="background: var(--bg-dark); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem;">
          <div style="font-weight: 600; margin-bottom: 0.5rem;" id="verifyTaskTitle"></div>
          <div style="color: var(--xp-gold); font-weight: 600;" id="verifyTaskXP">+0 XP</div>
        </div>
        <div class="form-group">
          <label class="form-label">最终进度</label>
          <input type="number" class="form-input" id="finalProgress" min="0" max="100" value="100">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancelVerify">取消</button>
        <button type="button" class="btn btn-primary" id="confirmVerify">确认完成</button>
      </div>
    </div>
  </div>

  <!-- Level Up Overlay -->
  <div class="level-up-overlay" id="levelUpOverlay">
    <div class="level-up-content">
      <div class="level-up-title">🎉 等级提升！</div>
      <div class="level-up-number" id="newLevelNumber">2</div>
      <div class="level-up-subtitle">恭喜你达到了新的等级！</div>
      <button class="close-level-up" id="closeLevelUp">继续加油</button>
    </div>
  </div>

  <script>
    // Data Model
    const STORAGE_KEY = 'learning_xp_data';

    let appData = {
      user: {
        level: 1,
        currentXP: 0,
        totalXPEarned: 0
      },
      tasks: [],
      goals: []
    };

    // Category names mapping
    const categoryNames = {
      daily: '每日',
      weekly: '每周',
      special: '特殊',
      main: '主线',
      side: '支线'
    };

    // Initialize app
    function init() {
      loadData();
      renderUI();
      bindEvents();
      checkDailyReset();
    }

    // Load data from localStorage
    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          appData = JSON.parse(saved);
        } catch (e) {
          console.warn('Failed to load data, using defaults');
        }
      } else {
        // Initialize with sample data
        initSampleData();
      }
    }

    // Save data to localStorage
    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    // Initialize sample data
    function initSampleData() {
      appData.tasks = [
        {
          id: generateId(),
          title: '背单词',
          description: '使用Anki背诵50个英语单词',
          category: 'daily',
          xp: 20,
          progress: 0,
          isCompleted: false,
          createdAt: new Date().toISOString()
        },
        {
          id: generateId(),
          title: '阅读技术书籍',
          description: '阅读《代码大全》第30-40页',
          category: 'daily',
          xp: 15,
          progress: 0,
          isCompleted: false,
          createdAt: new Date().toISOString()
        },
        {
          id: generateId(),
          title: '刷算法题',
          description: '完成2道LeetCode中等难度题目',
          category: 'daily',
          xp: 30,
          progress: 0,
          isCompleted: false,
          createdAt: new Date().toISOString()
        },
        {
          id: generateId(),
          title: '完成项目周报',
          description: '整理本周工作内容并提交周报',
          category: 'weekly',
          xp: 50,
          progress: 0,
          isCompleted: false,
          createdAt: new Date().toISOString()
        },
        {
          id: generateId(),
          title: '学习TypeScript',
          description: '完成TypeScript官方教程章节1-3',
          category: 'weekly',
          xp: 80,
          progress: 0,
          isCompleted: false,
          createdAt: new Date().toISOString()
        },
        {
          id: generateId(),
          title: '通过PMP认证考试',
          description: '系统学习PMBOK，完成模拟题练习',
          category: 'main',
          xp: 500,
          progress: 25,
          isCompleted: false,
          createdAt: new Date().toISOString()
        },
        {
          id: generateId(),
          title: '掌握设计模式',
          description: '学习并理解常见设计模式及其应用场景',
          category: 'side',
          xp: 100,
          progress: 0,
          isCompleted: false,
          createdAt: new Date().toISOString()
        },
        {
          id: generateId(),
          title: '参加技术分享会',
          description: '参与公司内部技术分享或线上技术大会',
          category: 'special',
          xp: 40,
          progress: 0,
          isCompleted: false,
          createdAt: new Date().toISOString()
        }
      ];
      saveData();
    }

    // Generate unique ID
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    // Calculate XP needed for level
    function getXPForLevel(level) {
      return 100 * level;
    }

    // Get current level info from total XP
    function getLevelInfo(totalXP) {
      let level = 1;
      let xpNeeded = getXPForLevel(level);
      let currentXP = totalXP;

      while (currentXP >= xpNeeded) {
        currentXP -= xpNeeded;
        level++;
        xpNeeded = getXPForLevel(level);
      }

      return { level, currentXP, xpNeeded };
    }

    // Current filter
    let currentFilter = 'all';

    // Bind events
    function bindEvents() {
      // Tab navigation
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentFilter = tab.dataset.category;
          updateSectionTitle();
          renderTasks();
        });
      });

      // Add task button
      document.getElementById('addTaskBtn').addEventListener('click', () => {
        document.getElementById('addTaskModal').classList.add('show');
      });

      // Close add modal
      document.getElementById('closeAddModal').addEventListener('click', () => {
        document.getElementById('addTaskModal').classList.remove('show');
      });

      document.getElementById('cancelAddTask').addEventListener('click', () => {
        document.getElementById('addTaskModal').classList.remove('show');
      });

      // Add task form
      document.getElementById('addTaskForm').addEventListener('submit', (e) => {
        e.preventDefault();
        addTask();
      });

      // Close verify modal
      document.getElementById('closeVerifyModal').addEventListener('click', () => {
        document.getElementById('verifyModal').classList.remove('show');
      });

      document.getElementById('cancelVerify').addEventListener('click', () => {
        document.getElementById('verifyModal').classList.remove('show');
      });

      // Confirm verify
      document.getElementById('confirmVerify').addEventListener('click', () => {
        confirmTaskCompletion();
      });

      // Close level up overlay
      document.getElementById('closeLevelUp').addEventListener('click', () => {
        document.getElementById('levelUpOverlay').classList.remove('show');
      });

      // Close modals on overlay click
      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            overlay.classList.remove('show');
          }
        });
      });
    }

    // Update section title
    function updateSectionTitle() {
      const title = currentFilter === 'all' ? '全部任务' : categoryNames[currentFilter] + '任务';
      document.getElementById('sectionTitle').textContent = title;
    }

    // Render UI
    function renderUI() {
      updateStats();
      updateCounts();
      updateSectionTitle();
      renderTasks();
    }

    // Update stats display
    function updateStats() {
      const levelInfo = getLevelInfo(appData.user.totalXPEarned);
      appData.user.level = levelInfo.level;
      appData.user.currentXP = levelInfo.currentXP;

      document.getElementById('levelNumber').textContent = levelInfo.level;
      document.getElementById('currentXP').textContent = levelInfo.currentXP;
      document.getElementById('maxXP').textContent = levelInfo.xpNeeded;
      document.getElementById('totalXPEarned').textContent = appData.user.totalXPEarned;

      const xpPercent = (levelInfo.currentXP / levelInfo.xpNeeded) * 100;
      document.getElementById('xpBarFill').style.width = xpPercent + '%';

      const totalTasks = appData.tasks.length;
      const completedTasks = appData.tasks.filter(t => t.isCompleted).length;
      document.getElementById('totalTasks').textContent = totalTasks;
      document.getElementById('completedTasks').textContent = completedTasks;
    }

    // Update tab counts
    function updateCounts() {
      const counts = { all: appData.tasks.length };
      Object.keys(categoryNames).forEach(cat => {
        counts[cat] = appData.tasks.filter(t => t.category === cat).length;
      });

      Object.keys(counts).forEach(cat => {
        const el = document.getElementById('count-' + cat);
        if (el) el.textContent = counts[cat];
      });
    }

    // Render tasks
    function renderTasks() {
      const grid = document.getElementById('taskGrid');
      const emptyState = document.getElementById('emptyState');

      let filteredTasks = appData.tasks;
      if (currentFilter !== 'all') {
        filteredTasks = appData.tasks.filter(t => t.category === currentFilter);
      }

      // Sort: incomplete first, then by creation date
      filteredTasks.sort((a, b) => {
        if (a.isCompleted !== b.isCompleted) return a.isCompleted ? 1 : -1;
        return new Date(b.createdAt) - new Date(a.createdAt);
      });

      if (filteredTasks.length === 0) {
        grid.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      grid.innerHTML = filteredTasks.map(task => `
        <div class="task-card ${task.isCompleted ? 'completed' : ''}" data-id="${task.id}">
          <div class="task-header">
            <span class="task-category ${task.category}">${categoryNames[task.category]}</span>
            <span class="task-xp">+${task.xp} XP</span>
          </div>
          <div class="task-title">${escapeHtml(task.title)}</div>
          ${task.description ? `<div class="task-description">${escapeHtml(task.description)}</div>` : ''}
          <div class="task-progress">
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${task.progress}%"></div>
            </div>
            <div class="progress-text">
              <span>进度</span>
              <span>${task.progress}%</span>
            </div>
          </div>
          <div class="task-actions">
            <button class="verify-btn" onclick="openVerifyModal('${task.id}')" ${task.isCompleted ? 'disabled' : ''}>
              ${task.isCompleted ? '已完成' : '验收完成'}
            </button>
          </div>
        </div>
      `).join('');
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Add task
    function addTask() {
      const title = document.getElementById('taskTitle').value.trim();
      const description = document.getElementById('taskDescription').value.trim();
      const category = document.getElementById('taskCategory').value;
      const xp = parseInt(document.getElementById('taskXP').value) || 10;
      const progress = parseInt(document.getElementById('taskProgress').value) || 0;

      const task = {
        id: generateId(),
        title,
        description,
        category,
        xp,
        progress: Math.min(100, Math.max(0, progress)),
        isCompleted: progress >= 100,
        createdAt: new Date().toISOString()
      };

      appData.tasks.push(task);
      saveData();
      renderUI();

      // Reset form
      document.getElementById('addTaskForm').reset();
      document.getElementById('taskXP').value = '10';
      document.getElementById('taskProgress').value = '0';
      document.getElementById('addTaskModal').classList.remove('show');
    }

    // Current task being verified
    let currentVerifyTaskId = null;

    // Open verify modal
    function openVerifyModal(taskId) {
      const task = appData.tasks.find(t => t.id === taskId);
      if (!task) return;

      currentVerifyTaskId = taskId;
      document.getElementById('verifyTaskTitle').textContent = task.title;
      document.getElementById('verifyTaskXP').textContent = '+' + task.xp + ' XP';
      document.getElementById('finalProgress').value = '100';
      document.getElementById('verifyModal').classList.add('show');
    }

    // Confirm task completion
    function confirmTaskCompletion() {
      const task = appData.tasks.find(t => t.id === currentVerifyTaskId);
      if (!task || task.isCompleted) return;

      const progress = parseInt(document.getElementById('finalProgress').value) || 100;
      task.progress = Math.min(100, progress);
      task.isCompleted = true;

      const oldLevel = appData.user.level;
      appData.user.totalXPEarned += task.xp;

      const levelInfo = getLevelInfo(appData.user.totalXPEarned);
      const newLevel = levelInfo.level;

      saveData();

      // Get task card position for animation
      const taskCard = document.querySelector(`.task-card[data-id="${task.id}"]`);
      const taskRect = taskCard ? taskCard.getBoundingClientRect() : null;

      document.getElementById('verifyModal').classList.remove('show');

      // Animate XP
      if (taskRect) {
        animateXP(task.xp, taskRect, () => {
          updateStats();
          updateCounts();
          renderTasks();

          // Check for level up
          if (newLevel > oldLevel) {
            setTimeout(() => showLevelUp(newLevel), 300);
          }
        });
      } else {
        updateStats();
        updateCounts();
        renderTasks();

        if (newLevel > oldLevel) {
          setTimeout(() => showLevelUp(newLevel), 300);
        }
      }
    }

    // Animate XP flying to bar
    function animateXP(amount, fromRect, callback) {
      const xpFloat = document.createElement('div');
      xpFloat.className = 'xp-float';
      xpFloat.textContent = '+' + amount + ' XP';
      xpFloat.style.left = fromRect.left + fromRect.width / 2 + 'px';
      xpFloat.style.top = fromRect.top + 'px';
      document.body.appendChild(xpFloat);

      const xpBar = document.getElementById('xpBarFill');
      const barRect = xpBar.getBoundingClientRect();
      const targetX = barRect.left + barRect.width / 2;
      const targetY = barRect.top + barRect.height / 2;

      // Create particles
      const particleCount = 5;
      for (let i = 0; i < particleCount; i++) {
        setTimeout(() => {
          createXPParticle(fromRect, targetX, targetY);
        }, i * 50);
      }

      // Animate the XP text
      const startX = fromRect.left + fromRect.width / 2;
      const startY = fromRect.top;
      const duration = 600;
      const startTime = performance.now();

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // Easing
        const easeOut = 1 - Math.pow(1 - progress, 3);

        // Arc motion
        const x = startX + (targetX - startX) * easeOut;
        const y = startY + (targetY - startY) * easeOut - Math.sin(progress * Math.PI) * 100;

        xpFloat.style.left = x + 'px';
        xpFloat.style.top = y + 'px';
        xpFloat.style.opacity = 1 - progress * 0.5;
        xpFloat.style.transform = `scale(${1 + progress * 0.5})`;

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          xpFloat.remove();
          if (callback) callback();
        }
      }

      requestAnimationFrame(animate);
    }

    // Create XP particle
    function createXPParticle(fromRect, targetX, targetY) {
      const particle = document.createElement('div');
      particle.className = 'xp-particle';

      const startX = fromRect.left + Math.random() * fromRect.width;
      const startY = fromRect.top + Math.random() * fromRect.height;

      particle.style.left = startX + 'px';
      particle.style.top = startY + 'px';
      document.body.appendChild(particle);

      const duration = 400 + Math.random() * 200;
      const startTime = performance.now();

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);

        const easeOut = 1 - Math.pow(1 - progress, 2);

        particle.style.left = startX + (targetX - startX) * easeOut + 'px';
        particle.style.top = startY + (targetY - startY) * easeOut + 'px';
        particle.style.opacity = 1 - progress;
        particle.style.transform = `scale(${1 - progress * 0.5})`;

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          particle.remove();
        }
      }

      requestAnimationFrame(animate);
    }

    // Show level up overlay
    function showLevelUp(newLevel) {
      document.getElementById('newLevelNumber').textContent = newLevel;
      document.getElementById('levelUpOverlay').classList.add('show');
    }

    // Check daily reset (reset daily tasks if new day)
    function checkDailyReset() {
      const lastReset = localStorage.getItem('last_reset_date');
      const today = new Date().toDateString();

      if (lastReset !== today) {
        // Reset daily tasks
        appData.tasks.forEach(task => {
          if (task.category === 'daily') {
            task.isCompleted = false;
            task.progress = 0;
          }
        });
        saveData();
        localStorage.setItem('last_reset_date', today);
        renderUI();
      }
    }

    // Initialize on DOM ready
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
