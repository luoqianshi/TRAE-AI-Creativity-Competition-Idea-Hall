<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>菜场雷达</title>
  <style>
    :root {
      --bg: #fff4df;
      --panel: #fffaf0;
      --primary: #f47b20;
      --primary-dark: #d95d00;
      --primary-soft: #ffe0b8;
      --text: #2f2418;
      --muted: #7a6a5b;
      --green: #178a43;
      --red: #d93324;
      --gold: #f0b429;
      --line: #ecd6b8;
      --shadow: 0 10px 24px rgba(128, 72, 15, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #ead8bd;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      font-size: 18px;
      line-height: 1.45;
      color: var(--text);
      background: var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background:
        radial-gradient(circle at 18% 0%, rgba(255, 219, 154, 0.72), transparent 32%),
        linear-gradient(180deg, #fff3dc 0%, #fff9ef 52%, #fff4df 100%);
      box-shadow: 0 0 36px rgba(87, 51, 12, 0.16);
      position: relative;
      overflow-x: hidden;
    }

    .page {
      display: none;
      min-height: 100vh;
      padding: 22px 18px 92px;
    }

    .page.active {
      display: block;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 7px 14px;
      margin-bottom: 6px;
      border-radius: 999px;
      color: #7e3b00;
      background: rgba(255, 226, 181, 0.78);
      font-weight: 800;
      font-size: 18px;
    }

    h1 {
      margin: 8px 0 18px;
      font-size: 32px;
      line-height: 1.18;
      letter-spacing: -0.03em;
      color: #3b260f;
    }

    h2 {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
      color: #3b260f;
    }

    .hint {
      margin: -8px 0 18px;
      color: var(--muted);
      font-size: 17px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .search-box input,
    .report-form input,
    .report-form select {
      width: 100%;
      min-height: 56px;
      padding: 0 16px;
      border: 2px solid var(--line);
      border-radius: 16px;
      outline: none;
      background: #fffdfa;
      color: var(--text);
      font-size: 18px;
    }

    .search-box input:focus,
    .report-form input:focus,
    .report-form select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(244, 123, 32, 0.13);
    }

    .add-btn {
      flex: 0 0 76px;
      min-height: 56px;
      border-radius: 16px;
      color: #fff;
      background: var(--primary);
      font-weight: 800;
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .food-btn {
      min-height: 86px;
      padding: 10px 6px;
      border: 2px solid #f2d5ad;
      border-radius: 18px;
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 6px 14px rgba(132, 83, 20, 0.08);
      font-weight: 800;
      font-size: 20px;
      transition: transform 0.05s ease, background 0.12s ease, border-color 0.12s ease;
    }

    .food-btn:active,
    .primary-btn:active,
    .voice-btn:active,
    .back-btn:active,
    .add-btn:active,
    .edit-btn:active {
      transform: scale(0.98);
    }

    .food-btn.selected {
      color: #fff;
      border-color: var(--primary-dark);
      background: linear-gradient(180deg, #ff9c3a 0%, #f47b20 100%);
      box-shadow: 0 8px 18px rgba(215, 90, 0, 0.25);
    }

    .food-icon {
      display: block;
      margin-bottom: 4px;
      font-size: 30px;
      line-height: 1;
    }

    .bottom-bar {
      position: sticky;
      bottom: 0;
      width: calc(100% + 36px);
      margin: 10px -18px -92px;
      padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(255, 248, 237, 0.2), rgba(255, 248, 237, 0.98) 28%, #fff8ed);
      backdrop-filter: blur(8px);
    }

    .primary-btn {
      width: 100%;
      min-height: 64px;
      border-radius: 18px;
      background: linear-gradient(180deg, #ff922f 0%, #f06b0b 100%);
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 12px 22px rgba(221, 93, 0, 0.28);
    }

    .primary-btn:disabled {
      color: #8b7761;
      background: #ecd8bc;
      box-shadow: none;
      cursor: not-allowed;
    }

    .subtle-link {
      display: block;
      min-height: 48px;
      margin-top: 18px;
      padding: 12px 8px;
      color: #8b7d70;
      text-align: center;
      font-size: 16px;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .back-btn {
      flex: 0 0 54px;
      min-width: 54px;
      min-height: 54px;
      border-radius: 16px;
      color: #6f3500;
      background: var(--primary-soft);
      font-size: 25px;
      font-weight: 900;
    }

    .selected-summary {
      margin: -6px 0 15px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 236, 207, 0.78);
      color: #6b4c2b;
      font-size: 17px;
    }

    /* 贡献统计条 */
    .contrib-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: -6px 0 15px;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(255, 236, 207, 0.78);
      color: #6b4c2b;
      font-size: 17px;
    }

    .contrib-count {
      font-weight: 900;
      color: var(--primary);
      font-size: 20px;
    }

    .place-card {
      position: relative;
      margin: 0 0 14px;
      padding: 18px 14px 16px;
      border: 3px solid transparent;
      border-radius: 22px;
      background: #fffdf8;
      box-shadow: var(--shadow);
    }

    .place-card.cheapest {
      border-color: var(--gold);
      background: linear-gradient(180deg, #fffdf8 0%, #fff7df 100%);
    }

    .save-tag {
      position: absolute;
      top: -12px;
      left: 16px;
      padding: 5px 12px;
      border-radius: 999px;
      color: #5d3500;
      background: linear-gradient(180deg, #ffd966, #f5b51d);
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 5px 12px rgba(147, 91, 0, 0.2);
    }

    .card-head {
      display: grid;
      grid-template-columns: 1fr 58px;
      gap: 12px;
      align-items: start;
      margin-bottom: 12px;
    }

    .place-name {
      margin: 0;
      padding-right: 4px;
      font-size: 20px;
      font-weight: 900;
    }

    .distance {
      margin-top: 4px;
      color: var(--muted);
      font-size: 17px;
    }

    .voice-btn {
      min-width: 54px;
      min-height: 54px;
      border-radius: 17px;
      border: 2px solid #f4c184;
      color: #7a3800;
      background: #fff0d8;
      font-size: 24px;
      font-weight: 900;
    }

    .voice-btn.playing {
      color: #fff;
      border-color: #b64800;
      background: #d95500;
    }

    .price-list {
      display: grid;
      gap: 7px;
      margin: 0 0 14px;
      padding: 0;
      list-style: none;
    }

    .price-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      min-height: 38px;
      font-size: 17px;
    }

    .price-value {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .price-line strong {
      white-space: nowrap;
    }

    .lowest {
      color: var(--green);
      font-weight: 900;
    }

    .highest {
      color: var(--red);
      font-weight: 900;
    }

    /* 价格旁编辑按钮 */
    .edit-btn {
      flex-shrink: 0;
      min-width: 40px;
      min-height: 40px;
      padding: 0 8px;
      border-radius: 12px;
      border: 2px solid #f4c184;
      color: #7a3800;
      background: #fff0d8;
      font-size: 16px;
      font-weight: 900;
      line-height: 1;
    }

    .edit-btn:hover {
      background: #ffe0b8;
    }

    /* 平均价标记 */
    .avg-badge {
      display: inline-flex;
      align-items: center;
      min-width: 20px;
      min-height: 20px;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 900;
    }

    /* 内联编辑弹窗 */
    .edit-popup {
      display: none;
      margin: 6px 0 4px;
      padding: 14px;
      border-radius: 16px;
      background: #fff5e0;
      border: 2px solid var(--primary-soft);
    }

    .edit-popup.show {
      display: block;
    }

    .edit-popup-label {
      font-weight: 900;
      font-size: 17px;
      color: #5d3500;
      margin-bottom: 8px;
    }

    .edit-popup-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .edit-popup input {
      flex: 1;
      min-height: 52px;
      padding: 0 14px;
      border: 2px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: #fffdfa;
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
    }

    .edit-popup input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(244, 123, 32, 0.15);
    }

    .edit-popup-actions {
      display: flex;
      gap: 8px;
    }

    .edit-popup-save {
      flex: 1;
      min-height: 48px;
      border-radius: 14px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 17px;
    }

    .edit-popup-cancel {
      flex: 0 0 auto;
      min-width: 48px;
      min-height: 48px;
      padding: 0 14px;
      border-radius: 14px;
      background: #ecd8bc;
      color: #6b4c2b;
      font-weight: 800;
      font-size: 17px;
    }

    .edit-popup-hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    /* 迷你折线图 */
    .mini-chart {
      margin: 10px 0 8px;
      padding: 10px 0 6px;
      border-top: 1px dashed #efd3aa;
    }

    .mini-chart-label {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 6px;
      text-align: center;
      font-weight: 700;
    }

    .mini-chart svg {
      width: 100%;
      height: 64px;
      display: block;
    }

    .mini-chart .chart-line {
      fill: none;
      stroke: var(--primary);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mini-chart .chart-area {
      fill: rgba(244, 123, 32, 0.12);
    }

    .mini-chart .chart-dot {
      fill: var(--primary);
      stroke: #fff;
      stroke-width: 1.5;
    }

    .mini-chart .chart-label {
      font-size: 10px;
      fill: var(--muted);
      text-anchor: middle;
    }

    .mini-chart .no-data {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 10px 0;
    }

    .total-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding-top: 12px;
      border-top: 2px dashed #efd3aa;
    }

    .total-price {
      color: #c24e00;
      font-size: 30px;
      font-weight: 1000;
      letter-spacing: -0.02em;
    }

    .expand-hint {
      margin-top: 8px;
      color: #8b7b6a;
      font-size: 16px;
      text-align: right;
    }

    .route-detail {
      display: none;
      margin-top: 12px;
      padding: 13px 14px;
      border-radius: 16px;
      background: #fff1d8;
      color: #5f3d18;
      font-size: 17px;
    }

    .place-card.open .route-detail {
      display: block;
    }

    .report-card {
      padding: 18px;
      border-radius: 22px;
      background: #fffdf8;
      box-shadow: var(--shadow);
    }

    .report-form {
      display: grid;
      gap: 14px;
    }

    .field label {
      display: block;
      margin: 0 0 7px;
      font-weight: 900;
      font-size: 18px;
    }

    .notice {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 16px;
      color: #604221;
      background: #fff0d8;
      font-size: 16px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      z-index: 30;
      width: min(360px, calc(100vw - 34px));
      padding: 13px 16px;
      border-radius: 999px;
      color: #fff;
      background: rgba(48, 31, 15, 0.92);
      text-align: center;
      font-size: 17px;
      transform: translateX(-50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease;
    }

    .toast.show {
      opacity: 1;
    }

    /* 我的清单 - 首页快捷入口 */
    .home-shortcuts {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .shortcut-btn {
      flex: 1;
      min-height: 50px;
      border-radius: 16px;
      border: 2px solid #f2d5ad;
      background: var(--panel);
      color: #6b4c2b;
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .shortcut-btn:active {
      transform: scale(0.98);
    }

    .shortcut-btn .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      min-height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
    }

    /* 清单列表 */
    .list-section {
      margin-bottom: 16px;
    }

    .list-section-title {
      font-size: 20px;
      font-weight: 900;
      color: #3b260f;
      margin-bottom: 12px;
    }

    .save-current-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .save-current-bar input {
      flex: 1;
      min-height: 52px;
      padding: 0 14px;
      border: 2px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: #fffdfa;
      color: var(--text);
      font-size: 17px;
      font-weight: 700;
    }

    .save-current-bar input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(244, 123, 32, 0.15);
    }

    .save-current-bar input::placeholder {
      color: #b8a48e;
    }

    .save-list-btn {
      flex: 0 0 auto;
      min-width: 76px;
      min-height: 52px;
      padding: 0 16px;
      border-radius: 14px;
      background: var(--primary);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
    }

    .save-list-btn:disabled {
      background: #ecd8bc;
      color: #8b7761;
      cursor: not-allowed;
    }

    .list-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 18px;
      background: #fffdf8;
      box-shadow: 0 4px 14px rgba(128, 72, 15, 0.08);
      border: 2px solid transparent;
      transition: border-color 0.15s;
    }

    .list-card:active {
      border-color: var(--primary-soft);
    }

    .list-load-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      min-height: 48px;
      padding: 4px 0;
      background: none;
      color: var(--text);
      text-align: left;
    }

    .list-load-btn .list-name {
      font-size: 18px;
      font-weight: 800;
    }

    .list-load-btn .list-items {
      font-size: 15px;
      color: var(--muted);
    }

    .list-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .list-action-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: 12px;
      border: 2px solid #f4c184;
      color: #7a3800;
      background: #fff0d8;
      font-size: 16px;
      font-weight: 900;
      padding: 0 8px;
    }

    .list-action-btn.delete-btn {
      border-color: #f0b0a0;
      background: #fff0ec;
      color: var(--red);
    }

    .list-empty {
      text-align: center;
      padding: 24px 14px;
      color: var(--muted);
      font-size: 17px;
    }

    /* 重命名弹窗 */
    .rename-popup {
      display: none;
      position: fixed;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      background: rgba(48, 31, 15, 0.5);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .rename-popup.show {
      display: flex;
    }

    .rename-card {
      width: 100%;
      max-width: 360px;
      padding: 24px;
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 16px 40px rgba(128, 72, 15, 0.25);
    }

    .rename-card h3 {
      font-size: 20px;
      font-weight: 900;
      margin: 0 0 14px;
    }

    .rename-card input {
      width: 100%;
      min-height: 52px;
      padding: 0 14px;
      border: 2px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: #fffdfa;
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
    }

    .rename-card input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(244, 123, 32, 0.15);
    }

    .rename-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .rename-confirm {
      flex: 1;
      min-height: 50px;
      border-radius: 14px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 17px;
    }

    .rename-cancel-btn {
      flex: 0 0 auto;
      min-width: 60px;
      min-height: 50px;
      border-radius: 14px;
      background: #ecd8bc;
      color: #6b4c2b;
      font-weight: 800;
      font-size: 17px;
    }

    /* 省钱周报 */
    .weekly-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .weekly-card {
      padding: 18px 14px;
      border-radius: 20px;
      background: #fffdf8;
      box-shadow: var(--shadow);
      border: 2px solid transparent;
      text-align: center;
    }

    .weekly-card.accent {
      border-color: var(--gold);
      background: linear-gradient(180deg, #fffdf8 0%, #fff7df 100%);
    }

    .weekly-card.full-width {
      grid-column: 1 / -1;
    }

    .weekly-card .weekly-label {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .weekly-card .weekly-num {
      font-size: 38px;
      font-weight: 1000;
      color: var(--primary);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .weekly-card .weekly-unit {
      font-size: 16px;
      color: var(--primary);
      font-weight: 700;
      margin-top: 4px;
    }

    .weekly-card .weekly-sub {
      font-size: 14px;
      color: var(--muted);
      margin-top: 6px;
    }

    .weekly-best {
      padding: 18px 16px;
      border-radius: 20px;
      background: linear-gradient(180deg, #fffdf8 0%, #fff7df 100%);
      box-shadow: var(--shadow);
      border: 2px solid var(--gold);
      text-align: center;
    }

    .weekly-best .best-tag {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffd966, #f5b51d);
      color: #5d3500;
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .weekly-best .best-amount {
      font-size: 36px;
      font-weight: 1000;
      color: #c24e00;
      line-height: 1;
    }

    .weekly-best .best-detail {
      font-size: 17px;
      color: #5f3d18;
      margin-top: 8px;
      font-weight: 700;
    }

    .weekly-empty {
      text-align: center;
      padding: 40px 18px;
      color: var(--muted);
      font-size: 18px;
    }

    .weekly-empty .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

  <script>
    var presetFoods = [
      { name: "白菜", icon: "🥬", range: [0.8, 2] },
      { name: "土豆", icon: "🥔", range: [1.5, 3] },
      { name: "西红柿", icon: "🍅", range: [2, 5] },
      { name: "黄瓜", icon: "🥒", range: [2, 4] },
      { name: "茄子", icon: "🍆", range: [2, 5] },
      { name: "猪肉", icon: "🥩", range: [12, 20] },
      { name: "鸡蛋", icon: "🥚", range: [4, 7] },
      { name: "苹果", icon: "🍎", range: [5, 10] },
      { name: "香蕉", icon: "🍌", range: [3, 6] },
      { name: "青椒", icon: "🫑", range: [3, 6] },
      { name: "豆腐", icon: "⬜", range: [2, 4] },
      { name: "大米", icon: "🍚", range: [2.5, 4] }
    ];

    var places = [
      { name: "社区菜市场", distanceText: "步行8分钟", meters: 300, factor: 0.94 },
      { name: "永辉超市", distanceText: "骑车5分钟", meters: 800, factor: 1.02 },
      { name: "美团自提点", distanceText: "步行15分钟", meters: 1200, factor: 1.08 }
    ];

    var storageKeys = {
      selected: "caichangRadarSelectedFoods",
      reports: "caichangRadarReports",
      lists: "caichangRadarLists",
      comparisons: "caichangRadarComparisons"
    };

    var state = {
      selectedFoods: new Set(),
      customFoods: [],
      priceData: {},
      currentUtterance: null,
      playingPlace: "",
      lastPageBeforeReport: "home",
      renamingListId: null
    };

    var foodGrid = document.getElementById("foodGrid");
    var customInput = document.getElementById("customInput");
    var addCustomBtn = document.getElementById("addCustomBtn");
    var checkBtn = document.getElementById("checkBtn");
    var homePage = document.getElementById("homePage");
    var resultPage = document.getElementById("resultPage");
    var reportPage = document.getElementById("reportPage");
    var resultList = document.getElementById("resultList");
    var selectedSummary = document.getElementById("selectedSummary");
    var reportPlace = document.getElementById("reportPlace");
    var reportFood = document.getElementById("reportFood");
    var reportPrice = document.getElementById("reportPrice");
    var reportForm = document.getElementById("reportForm");
    var toast = document.getElementById("toast");
    var contribBar = document.getElementById("contribBar");
    var contribCount = document.getElementById("contribCount");
    var listPage = document.getElementById("listPage");
    var listContainer = document.getElementById("listContainer");
    var newListNameInput = document.getElementById("newListNameInput");
    var saveListBtn = document.getElementById("saveListBtn");
    var openListPageBtn = document.getElementById("openListPageBtn");
    var saveCurrentBtn = document.getElementById("saveCurrentBtn");
    var listBadge = document.getElementById("listBadge");
    var renamePopup = document.getElementById("renamePopup");
    var renameInput = document.getElementById("renameInput");
    var renameConfirmBtn = document.getElementById("renameConfirmBtn");
    var renameCancelBtn = document.getElementById("renameCancelBtn");
    var weeklyPage = document.getElementById("weeklyPage");
    var weeklyRange = document.getElementById("weeklyRange");
    var weeklyContent = document.getElementById("weeklyContent");

    function money(value) {
      var rounded = Math.round(value * 10) / 10;
      return Number.isInteger(rounded) ? "" + rounded : rounded.toFixed(1);
    }

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function getFoodMeta(name) {
      return presetFoods.find(function(item) { return item.name === name; }) || { name: name, icon: "🧺", range: [2, 6] };
    }

    function getAllFoodNames() {
      var presetNames = presetFoods.map(function(item) { return item.name; });
      var merged = presetNames.concat(state.customFoods);
      var seen = {};
      return merged.filter(function(n) { if (seen[n]) return false; seen[n] = true; return true; });
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(function() { toast.classList.remove("show"); }, 1800);
    }

    function saveSelection() {
      localStorage.setItem(storageKeys.selected, JSON.stringify(Array.from(state.selectedFoods)));
    }

    function loadSelection() {
      try {
        var saved = JSON.parse(localStorage.getItem(storageKeys.selected) || "[]");
        saved.forEach(function(name) {
          state.selectedFoods.add(name);
          if (!presetFoods.some(function(item) { return item.name === name; })) {
            state.customFoods.push(name);
          }
        });
      } catch (error) {
        state.selectedFoods.clear();
      }
    }

    function loadReports() {
      try {
        return JSON.parse(localStorage.getItem(storageKeys.reports) || "[]");
      } catch (error) {
        return [];
      }
    }

    function saveReport(report) {
      var reports = loadReports();
      reports.unshift(report);
      localStorage.setItem(storageKeys.reports, JSON.stringify(reports.slice(0, 200)));
    }

    /* 把当天的价格快照保存到历史记录 */
    function saveDailyPrices(data) {
      var today = new Date().toISOString().slice(0, 10);
      var history = JSON.parse(localStorage.getItem("caichangRadarHistory") || "{}");
      history[today] = data;
      var dates = Object.keys(history).sort();
      if (dates.length > 30) {
        dates.slice(0, dates.length - 30).forEach(function(d) { delete history[d]; });
      }
      localStorage.setItem("caichangRadarHistory", JSON.stringify(history));
    }

    /* 获取某个地点最近 N 天的历史价格 */
    function getPlaceHistory(placeName, days) {
      var history = JSON.parse(localStorage.getItem("caichangRadarHistory") || "{}");
      var dates = Object.keys(history).sort();
      return dates.slice(-days).map(function(d) {
        var dayData = history[d] && history[d][placeName] ? history[d][placeName] : {};
        return { date: d, prices: dayData };
      });
    }

    /* 绘制迷你 SVG 折线图 */
    function renderMiniChart(placeName, selectedFoods) {
      var days = 7;
      var history = getPlaceHistory(placeName, days);
      var foods = Array.from(selectedFoods);

      var dataPoints = history.map(function(day) {
        var total = 0;
        var count = 0;
        foods.forEach(function(food) {
          if (day.prices[food]) {
            total += day.prices[food];
            count++;
          }
        });
        return {
          date: day.date,
          total: count > 0 ? Math.round(total * 10) / 10 : 0,
          count: count
        };
      });

      var validPoints = dataPoints.filter(function(p) { return p.count > 0; });
      if (validPoints.length < 2) {
        return '<div class="mini-chart"><div class="no-data">多查几次价格，就能看到7天走势</div></div>';
      }

      var values = validPoints.map(function(p) { return p.total; });
      var minVal = Math.min.apply(null, values);
      var maxVal = Math.max.apply(null, values);
      var padding = Math.max(0.5, (maxVal - minVal) * 0.15);
      minVal = Math.max(0, minVal - padding);
      maxVal = maxVal + padding;
      if (minVal === maxVal) { maxVal = minVal + 1; }

      var w = 320;
      var h = 64;
      var padX = 22;
      var padY = 10;
      var chartW = w - padX * 2;
      var chartH = h - padY * 2;

      var points = validPoints.map(function(p, i) {
        var x = padX + (validPoints.length === 1 ? chartW / 2 : (i / (validPoints.length - 1)) * chartW);
        var y = padY + chartH - ((p.total - minVal) / (maxVal - minVal)) * chartH;
        return { x: x, y: y, total: p.total, date: p.date };
      });

      var pathD = points.map(function(p, i) {
        return (i === 0 ? "M" : "L") + p.x + "," + p.y;
      }).join(" ");

      var areaD = pathD + " L" + points[points.length - 1].x + "," + (h - padY) + " L" + points[0].x + "," + (h - padY) + " Z";

      var dots = points.map(function(p) {
        return '<circle class="chart-dot" cx="' + p.x + '" cy="' + p.y + '" r="3.5" />';
      }).join("");

      var labelStep = Math.max(1, Math.floor(points.length / 3));
      var labels = points.map(function(p, i) {
        if (i % labelStep === 0 || i === points.length - 1) {
          var monthDay = p.date.slice(5).replace("-", "/");
          return '<text class="chart-label" x="' + p.x + '" y="' + (h - 2) + '">' + monthDay + '</text>';
        }
        return "";
      }).join("");

      return '<div class="mini-chart">' +
        '<div class="mini-chart-label">近' + validPoints.length + '天总价走势</div>' +
        '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
          '<path class="chart-area" d="' + areaD + '" />' +
          '<path class="chart-line" d="' + pathD + '" />' +
          dots +
          labels +
        '</svg>' +
      '</div>';
    }

    /* 获取某个菜在某地点的所有历史报价，返回数组 */
    function getPriceHistory(placeName, foodName) {
      var reports = loadReports();
      return reports.filter(function(r) {
        return r.place === placeName && r.food === foodName;
      });
    }

    /* 计算某个菜在某地点的平均价格（从历史数据中取均值） */
    function getAveragePrice(placeName, foodName) {
      var history = getPriceHistory(placeName, foodName);
      if (history.length === 0) return null;
      var sum = history.reduce(function(s, r) { return s + Number(r.price); }, 0);
      return Math.round(sum / history.length * 10) / 10;
    }

    /* 获取总贡献次数 */
    function getTotalContributions() {
      return loadReports().length;
    }

    /* 更新贡献次数显示 */
    function updateContribBar() {
      var count = getTotalContributions();
      if (count > 0) {
        contribBar.style.display = "flex";
        contribCount.textContent = count;
      } else {
        contribBar.style.display = "none";
      }
    }

    /* ========== 我的清单 CRUD ========== */

    function loadLists() {
      try {
        return JSON.parse(localStorage.getItem(storageKeys.lists) || "[]");
      } catch (error) {
        return [];
      }
    }

    function saveLists(lists) {
      localStorage.setItem(storageKeys.lists, JSON.stringify(lists.slice(0, 50)));
    }

    function updateListBadge() {
      var lists = loadLists();
      if (lists.length > 0) {
        listBadge.style.display = "inline-flex";
        listBadge.textContent = lists.length;
      } else {
        listBadge.style.display = "none";
      }
    }

    function updateSaveCurrentBtn() {
      saveCurrentBtn.disabled = state.selectedFoods.size === 0;
    }

    function createList(name) {
      if (!name || !name.trim()) {
        showToast("请输入清单名称");
        return false;
      }
      name = name.trim();
      if (state.selectedFoods.size === 0) {
        showToast("请先选择菜品");
        return false;
      }
      var lists = loadLists();
      lists.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        name: name,
        foods: Array.from(state.selectedFoods),
        createdAt: new Date().toISOString()
      });
      saveLists(lists);
      updateListBadge();
      return true;
    }

    function deleteList(id) {
      var lists = loadLists().filter(function(l) { return l.id !== id; });
      saveLists(lists);
      updateListBadge();
    }

    function renameList(id, newName) {
      if (!newName || !newName.trim()) return false;
      var lists = loadLists();
      var item = lists.find(function(l) { return l.id === id; });
      if (item) {
        item.name = newName.trim();
        saveLists(lists);
        return true;
      }
      return false;
    }

    function loadListFoods(id) {
      var lists = loadLists();
      var item = lists.find(function(l) { return l.id === id; });
      if (!item) return null;
      return item.foods;
    }

    function renderListPage() {
      var lists = loadLists();
      listContainer.innerHTML = "";

      if (lists.length === 0) {
        listContainer.innerHTML = '<div class="list-empty">还没有保存的清单。选好菜后，输入名称点"保存"即可。</div>';
        return;
      }

      lists.forEach(function(item) {
        var card = document.createElement("div");
        card.className = "list-card";

        var foodIcons = item.foods.slice(0, 6).map(function(name) {
          var meta = getFoodMeta(name);
          return meta.icon;
        }).join("");
        var extraText = item.foods.length > 6 ? " 等" + item.foods.length + "样" : "";
        var itemsText = foodIcons + extraText + " " + item.foods.join("、");

        card.innerHTML =
          '<button class="list-load-btn" type="button" data-id="' + item.id + '">' +
            '<span class="list-name">' + item.name + '</span>' +
            '<span class="list-items">' + itemsText + '</span>' +
          '</button>' +
          '<div class="list-actions">' +
            '<button class="list-action-btn rename-trigger" type="button" data-id="' + item.id + '" title="重命名">✏️</button>' +
            '<button class="list-action-btn delete-btn" type="button" data-id="' + item.id + '" title="删除">🗑️</button>' +
          '</div>';

        listContainer.appendChild(card);
      });

      /* 绑定载入按钮 */
      listContainer.querySelectorAll(".list-load-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
          var foods = loadListFoods(btn.dataset.id);
          if (!foods) return;
          state.selectedFoods.clear();
          foods.forEach(function(name) {
            state.selectedFoods.add(name);
            if (!getAllFoodNames().includes(name)) {
              state.customFoods.push(name);
            }
          });
          saveSelection();
          renderFoodGrid();
          showPage("home");
          showToast("已载入清单");
        });
      });

      /* 绑定重命名按钮 */
      listContainer.querySelectorAll(".rename-trigger").forEach(function(btn) {
        btn.addEventListener("click", function(event) {
          event.stopPropagation();
          openRenamePopup(btn.dataset.id);
        });
      });

      /* 绑定删除按钮 */
      listContainer.querySelectorAll(".delete-btn").forEach(function(btn) {
        btn.addEventListener("click", function(event) {
          event.stopPropagation();
          deleteList(btn.dataset.id);
          renderListPage();
          showToast("清单已删除");
        });
      });
    }

    function openRenamePopup(listId) {
      var lists = loadLists();
      var item = lists.find(function(l) { return l.id === listId; });
      if (!item) return;
      state.renamingListId = listId;
      renameInput.value = item.name;
      renamePopup.classList.add("show");
      renameInput.focus();
      renameInput.select();
    }

    function closeRenamePopup() {
      renamePopup.classList.remove("show");
      state.renamingListId = null;
    }

    /* ========== 我的清单 CRUD END ========== */

    /* ========== 省钱周报 ========== */

    function saveComparison(results) {
      if (!results || results.length < 2) return;
      var cheapest = results[0];
      var mostExpensive = results[results.length - 1];
      var record = {
        timestamp: new Date().toISOString(),
        selectedFoods: Array.from(state.selectedFoods),
        cheapestPlace: cheapest.name,
        cheapestTotal: cheapest.total,
        mostExpensiveTotal: mostExpensive.total,
        savings: Math.round((mostExpensive.total - cheapest.total) * 10) / 10
      };
      var comps = JSON.parse(localStorage.getItem(storageKeys.comparisons) || "[]");
      comps.unshift(record);
      if (comps.length > 300) comps = comps.slice(0, 300);
      localStorage.setItem(storageKeys.comparisons, JSON.stringify(comps));
    }

    function getWeekRange() {
      var now = new Date();
      var day = now.getDay();
      var diffToMonday = day === 0 ? -6 : 1 - day;
      var monday = new Date(now);
      monday.setDate(now.getDate() + diffToMonday);
      monday.setHours(0, 0, 0, 0);
      var sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      sunday.setHours(23, 59, 59, 999);
      return { monday: monday, sunday: sunday };
    }

    function loadWeeklyComparisons() {
      var range = getWeekRange();
      var comps = JSON.parse(localStorage.getItem(storageKeys.comparisons) || "[]");
      return comps.filter(function(c) {
        var t = new Date(c.timestamp);
        return t >= range.monday && t <= range.sunday;
      });
    }

    function formatDateCN(date) {
      return (date.getMonth() + 1) + "月" + date.getDate() + "日";
    }

    function renderWeeklyPage() {
      var range = getWeekRange();
      var comps = loadWeeklyComparisons();

      weeklyRange.textContent = formatDateCN(range.monday) + " ～ " + formatDateCN(range.sunday);

      if (comps.length === 0) {
        weeklyContent.innerHTML =
          '<div class="weekly-empty">' +
            '<div class="empty-icon">📊</div>' +
            '<div>本周还没有比价记录</div>' +
            '<div style="font-size:15px;margin-top:8px">选好菜后点"查价格"，周报就会自动生成</div>' +
          '</div>';
        return;
      }

      var totalSavings = comps.reduce(function(s, c) { return s + c.savings; }, 0);
      totalSavings = Math.round(totalSavings * 10) / 10;

      var best = comps.reduce(function(prev, curr) {
        return curr.savings > prev.savings ? curr : prev;
      }, comps[0]);

      var html =
        '<div class="weekly-grid">' +
          '<div class="weekly-card">' +
            '<div class="weekly-label">本周比价次数</div>' +
            '<div class="weekly-num">' + comps.length + '</div>' +
            '<div class="weekly-unit">次</div>' +
          '</div>' +
          '<div class="weekly-card accent">' +
            '<div class="weekly-label">本周累计省钱</div>' +
            '<div class="weekly-num">' + money(totalSavings) + '</div>' +
            '<div class="weekly-unit">元</div>' +
          '</div>' +
        '</div>' +
        '<div class="weekly-best">' +
          '<div class="best-tag">🏆 最划算的一次</div>' +
          '<div class="best-amount">省了 ' + money(best.savings) + ' 元</div>' +
          '<div class="best-detail">' + best.cheapestPlace + ' · ' + best.selectedFoods.join('、') + '</div>' +
        '</div>';

      weeklyContent.innerHTML = html;
    }

    /* ========== 省钱周报 END ========== */

    function renderFoodGrid() {
      foodGrid.innerHTML = "";
      getAllFoodNames().forEach(function(name) {
        var meta = getFoodMeta(name);
        var button = document.createElement("button");
        button.type = "button";
        button.className = "food-btn" + (state.selectedFoods.has(name) ? " selected" : "");
        button.setAttribute("aria-pressed", state.selectedFoods.has(name) ? "true" : "false");
        button.dataset.name = name;
        button.innerHTML = '<span class="food-icon" aria-hidden="true">' + meta.icon + '</span>' + name;
        button.addEventListener("click", function() { toggleFood(name); });
        foodGrid.appendChild(button);
      });
      updateCheckButton();
    }

    function toggleFood(name) {
      if (state.selectedFoods.has(name)) {
        state.selectedFoods.delete(name);
      } else {
        state.selectedFoods.add(name);
      }
      saveSelection();
      renderFoodGrid();
    }

    function addCustomFood() {
      var name = customInput.value.trim().replace(/\s+/g, "");
      if (!name) {
        showToast("请先输入菜名");
        customInput.focus();
        return;
      }
      if (!getAllFoodNames().includes(name)) {
        state.customFoods.push(name);
      }
      state.selectedFoods.add(name);
      customInput.value = "";
      saveSelection();
      renderFoodGrid();
      showToast("已添加" + name);
    }

    function updateCheckButton() {
      var count = state.selectedFoods.size;
      checkBtn.disabled = count === 0;
      checkBtn.textContent = count ? "查价格（已选" + count + "样）" : "查价格";
    }

    function generatePriceData() {
      var data = {};
      var reports = loadReports();

      places.forEach(function(place, placeIndex) {
        data[place.name] = {};
        Array.from(state.selectedFoods).forEach(function(foodName) {
          /* 如果有用户贡献的历史数据，取平均值 */
          var avgPrice = getAveragePrice(place.name, foodName);
          if (avgPrice !== null) {
            data[place.name][foodName] = avgPrice;
            return;
          }

          var meta = getFoodMeta(foodName);
          var base = randomBetween(meta.range[0], meta.range[1]);
          var wave = randomBetween(0.85, 1.15);
          var locationNoise = [0.97, 1.03, 1.08][placeIndex] + randomBetween(-0.08, 0.08);
          data[place.name][foodName] = Math.max(0.3, Math.round(base * wave * place.factor * locationNoise * 10) / 10);
        });
      });

      state.priceData = data;
      saveDailyPrices(data);
    }

    function buildResults() {
      var selected = Array.from(state.selectedFoods);
      var results = places.map(function(place) {
        var prices = selected.map(function(food) {
          return { food: food, price: state.priceData[place.name][food] };
        });
        var total = prices.reduce(function(sum, item) { return sum + item.price; }, 0);
        return Object.assign({}, place, { prices: prices, total: Math.round(total * 10) / 10 });
      });

      var totals = results.map(function(item) { return item.total; });
      var minTotal = Math.min.apply(null, totals);
      var cheapestIndex = results.findIndex(function(item) { return item.total === minTotal; });

      if (totals.filter(function(total) { return total === minTotal; }).length > 1 && results.length > 1) {
        results.forEach(function(item, index) {
          if (index !== cheapestIndex && item.total === minTotal) {
            item.total = Math.round((item.total + 0.3 + index * 0.2) * 10) / 10;
          }
        });
      }

      return results.sort(function(a, b) { return a.total - b.total; });
    }

    function getPriceMarks(results) {
      var marks = {};
      Array.from(state.selectedFoods).forEach(function(food) {
        var prices = results.map(function(place) {
          return place.prices.find(function(item) { return item.food === food; }).price;
        });
        marks[food] = {
          min: Math.min.apply(null, prices),
          max: Math.max.apply(null, prices)
        };
      });
      return marks;
    }

    function getRouteAdvice(place, results) {
      var cheapest = results[0];
      var selected = Array.from(state.selectedFoods);
      var bestItems = selected.filter(function(food) {
        var prices = results.map(function(item) {
          return { place: item.name, price: item.prices.find(function(p) { return p.food === food; }).price };
        });
        var minPrice = Math.min.apply(null, prices.map(function(item) { return item.price; }));
        return prices.find(function(item) { return item.place === place.name; }).price === minPrice;
      });

      if (place.name === cheapest.name) {
        var bestText = bestItems.length ? "其中" + bestItems.join("、") + "在这里更划算。" : "路程和价格都比较合适。";
        return "建议直接去" + place.name + "，这次总价最低。" + bestText;
      }

      var buyHere = bestItems.length ? bestItems.join("、") : selected[0];
      var buyAtCheapest = selected.filter(function(item) { return bestItems.indexOf(item) === -1; }).slice(0, 3).join("、");
      return "如果顺路，可以在" + place.name + "买" + buyHere + "，再去" + cheapest.name + (buyAtCheapest ? "买" + buyAtCheapest : "补齐其他菜") + "。不想多跑就直接选总价最低的方案。";
    }

    function renderResults() {
      generatePriceData();
      var results = buildResults();
      var marks = getPriceMarks(results);
      var cheapest = results[0];

      selectedSummary.textContent = "已选：" + Array.from(state.selectedFoods).join("、");
      resultList.innerHTML = "";
      updateContribBar();
      saveComparison(results);

      results.forEach(function(place, index) {
        var card = document.createElement("article");
        card.className = "place-card" + (index === 0 ? " cheapest" : "");
        card.tabIndex = 0;

        var priceLines = place.prices.map(function(item) {
          var mark = marks[item.food];
          var className = "";
          var label = "";
          if (item.price === mark.min) {
            className = "lowest";
            label = " 最低";
          } else if (item.price === mark.max) {
            className = "highest";
            label = " 最高";
          }

          /* 检查是否有历史数据 */
          var history = getPriceHistory(place.name, item.food);
          var avgBadge = history.length > 1 ? '<span class="avg-badge" title="基于' + history.length + '次报价取平均">均' + history.length + '次</span>' : '';

          return '<li class="price-line" data-place="' + place.name + '" data-food="' + item.food + '">' +
            '<span>' + item.food + '</span>' +
            '<span class="price-value">' +
              '<strong class="' + className + '">' + money(item.price) + '元' + label + '</strong>' +
              avgBadge +
              '<button class="edit-btn" type="button" data-place="' + place.name + '" data-food="' + item.food + '" title="编辑价格">✏️</button>' +
            '</span>' +
          '</li>';
        }).join("");

        var secondBest = results[1];
        var saveDiff = secondBest ? Math.max(0, Math.round((secondBest.total - place.total) * 10) / 10) : 0;
        var diff = Math.max(0, Math.round((place.total - cheapest.total) * 10) / 10);
        var voiceText = index === 0
          ? "去" + place.name + "，" + place.distanceText + "，总价" + money(place.total) + "块，比" + (secondBest ? secondBest.name : "其他地方") + "便宜" + money(saveDiff) + "块，是这次最省钱的方案。"
          : "去" + place.name + "，" + place.distanceText + "，总价" + money(place.total) + "块，比" + cheapest.name + "贵" + money(diff) + "块。";

        var miniChartHtml = renderMiniChart(place.name, state.selectedFoods);

        card.innerHTML =
          (index === 0 ? '<div class="save-tag">最省钱</div>' : "") +
          '<div class="card-head">' +
            '<div>' +
              '<p class="place-name">' + place.name + '</p>' +
              '<div class="distance">' + place.distanceText + ' · 约' + place.meters + '米</div>' +
            '</div>' +
            '<button class="voice-btn" type="button" aria-label="语音播报' + place.name + '" data-place="' + place.name + '" data-text="' + voiceText + '">🔊</button>' +
          '</div>' +
          '<ul class="price-list">' + priceLines + '</ul>' +
          '<div class="total-row">' +
            '<span>该地点总价</span>' +
            '<strong class="total-price">' + money(place.total) + '元</strong>' +
          '</div>' +
          miniChartHtml +
          '<div class="expand-hint">点卡片看路线建议</div>' +
          '<div class="route-detail">' + getRouteAdvice(place, results) + '</div>';

        card.addEventListener("click", function(event) {
          if (event.target.closest(".voice-btn") || event.target.closest(".edit-btn") || event.target.closest(".edit-popup")) return;
          card.classList.toggle("open");
        });
        card.addEventListener("keydown", function(event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            card.classList.toggle("open");
          }
        });

        resultList.appendChild(card);
      });

      /* 绑定编辑按钮事件 */
      document.querySelectorAll(".edit-btn").forEach(function(btn) {
        btn.addEventListener("click", function(event) {
          event.stopPropagation();
          openEditPopup(btn.dataset.place, btn.dataset.food, btn.closest(".price-line"));
        });
      });

      /* 绑定语音按钮事件 */
      document.querySelectorAll(".voice-btn").forEach(function(button) {
        button.addEventListener("click", function(event) {
          event.stopPropagation();
          toggleSpeech(button.dataset.text, button.dataset.place);
        });
      });
    }

    /* 在价格行下方展开内联编辑弹窗 */
    function openEditPopup(placeName, foodName, priceLineEl) {
      /* 先关闭所有已打开的弹窗 */
      document.querySelectorAll(".edit-popup.show").forEach(function(p) { p.remove(); });

      var history = getPriceHistory(placeName, foodName);
      var currentPrice = state.priceData[placeName] && state.priceData[placeName][foodName] ? state.priceData[placeName][foodName] : "";

      var popup = document.createElement("div");
      popup.className = "edit-popup show";
      popup.innerHTML =
        '<div class="edit-popup-label">修改「' + foodName + '」在' + placeName + '的价格</div>' +
        '<div class="edit-popup-row">' +
          '<input type="number" inputmode="decimal" min="0.1" step="0.1" placeholder="输入真实价格（元/斤）" value="' + currentPrice + '">' +
        '</div>' +
        '<div class="edit-popup-actions" style="margin-top:10px">' +
          '<button class="edit-popup-save" type="button">保存价格</button>' +
          '<button class="edit-popup-cancel" type="button">取消</button>' +
        '</div>' +
        '<div class="edit-popup-hint">' + (history.length > 0 ? '已有' + history.length + '次记录，保存后会自动取平均值' : '保存后会记录您的报价') + '</div>';

      priceLineEl.parentNode.insertBefore(popup, priceLineEl.nextSibling);

      var input = popup.querySelector("input");
      input.focus();
      input.select();

      popup.querySelector(".edit-popup-save").addEventListener("click", function() {
        var price = Number(input.value);
        if (!price || price <= 0) {
          showToast("请输入有效的价格");
          input.focus();
          return;
        }
        price = Math.round(price * 10) / 10;

        saveReport({
          place: placeName,
          food: foodName,
          price: price,
          time: new Date().toISOString()
        });

        showToast(foodName + "价格已保存（" + placeName + "）");

        /* 关闭弹窗并刷新结果 */
        popup.remove();
        renderResults();
      });

      popup.querySelector(".edit-popup-cancel").addEventListener("click", function() {
        popup.remove();
      });

      input.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          popup.querySelector(".edit-popup-save").click();
        }
        if (e.key === "Escape") {
          popup.remove();
        }
      });

      /* 阻止弹窗内的点击冒泡到卡片 */
      popup.addEventListener("click", function(e) {
        e.stopPropagation();
      });
    }

    function resetVoiceButtons() {
      document.querySelectorAll(".voice-btn").forEach(function(button) {
        button.classList.remove("playing");
        button.textContent = "🔊";
        button.setAttribute("aria-label", "语音播报" + button.dataset.place);
      });
      state.playingPlace = "";
    }

    function toggleSpeech(text, placeName) {
      if (!("speechSynthesis" in window)) {
        showToast("这个浏览器不支持语音播报");
        return;
      }

      if (state.playingPlace === placeName) {
        window.speechSynthesis.cancel();
        resetVoiceButtons();
        return;
      }

      window.speechSynthesis.cancel();
      resetVoiceButtons();

      var utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "zh-CN";
      utterance.rate = 0.9;
      utterance.pitch = 1;
      utterance.onend = resetVoiceButtons;
      utterance.onerror = resetVoiceButtons;
      state.currentUtterance = utterance;
      state.playingPlace = placeName;

      var button = document.querySelector('.voice-btn[data-place="' + placeName + '"]');
      if (button) {
        button.classList.add("playing");
        button.textContent = "■";
        button.setAttribute("aria-label", "停止播报" + placeName);
      }

      window.speechSynthesis.speak(utterance);
    }

    function showPage(name) {
      window.speechSynthesis && window.speechSynthesis.cancel();
      resetVoiceButtons();
      homePage.classList.toggle("active", name === "home");
      resultPage.classList.toggle("active", name === "result");
      reportPage.classList.toggle("active", name === "report");
      listPage.classList.toggle("active", name === "list");
      weeklyPage.classList.toggle("active", name === "weekly");
      if (name === "list") renderListPage();
      if (name === "weekly") renderWeeklyPage();
      if (name === "home") updateSaveCurrentBtn();
      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function goReport(fromPage) {
      state.lastPageBeforeReport = fromPage;
      var firstSelected = Array.from(state.selectedFoods)[0] || "白菜";
      reportFood.value = firstSelected;
      showPage("report");
    }

    function setupReportPage() {
      reportPlace.innerHTML = places.map(function(place) {
        return '<option value="' + place.name + '">' + place.name + '</option>';
      }).join("");
    }

    addCustomBtn.addEventListener("click", addCustomFood);
    customInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        addCustomFood();
      }
    });

    checkBtn.addEventListener("click", function() {
      if (!state.selectedFoods.size) {
        showToast("请先选择想买的菜");
        return;
      }
      saveSelection();
      renderResults();
      showPage("result");
    });

    document.getElementById("backHomeBtn").addEventListener("click", function() { showPage("home"); });
    document.getElementById("backFromReportBtn").addEventListener("click", function() { showPage(state.lastPageBeforeReport); });
    document.getElementById("backFromListBtn").addEventListener("click", function() { showPage("home"); });
    document.getElementById("backFromWeeklyBtn").addEventListener("click", function() { showPage("home"); });

    /* 首页快捷入口 */
    openListPageBtn.addEventListener("click", function() { showPage("list"); });
    document.getElementById("openWeeklyBtn").addEventListener("click", function() { showPage("weekly"); });

    saveCurrentBtn.addEventListener("click", function() {
      if (state.selectedFoods.size === 0) {
        showToast("请先选择菜品");
        return;
      }
      showPage("list");
      newListNameInput.focus();
    });

    /* 清单页保存 */
    saveListBtn.addEventListener("click", function() {
      var name = newListNameInput.value.trim();
      if (createList(name)) {
        newListNameInput.value = "";
        renderListPage();
        showToast("清单已保存");
      }
    });

    newListNameInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        saveListBtn.click();
      }
    });

    /* 重命名弹窗 */
    renameConfirmBtn.addEventListener("click", function() {
      if (state.renamingListId && renameList(state.renamingListId, renameInput.value)) {
        closeRenamePopup();
        renderListPage();
        showToast("已重命名");
      } else {
        showToast("请输入新名称");
        renameInput.focus();
      }
    });

    renameCancelBtn.addEventListener("click", closeRenamePopup);

    renameInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        renameConfirmBtn.click();
      }
      if (e.key === "Escape") {
        closeRenamePopup();
      }
    });

    renamePopup.addEventListener("click", function(e) {
      if (e.target === renamePopup) closeRenamePopup();
    });
    document.getElementById("dataSourceHome").addEventListener("click", function(event) {
      event.preventDefault();
      goReport("home");
    });
    document.getElementById("dataSourceResult").addEventListener("click", function(event) {
      event.preventDefault();
      goReport("result");
    });

    reportForm.addEventListener("submit", function(event) {
      event.preventDefault();
      var food = reportFood.value.trim().replace(/\s+/g, "");
      var price = Number(reportPrice.value);
      if (!food || !price || price <= 0) {
        showToast("请填好菜名和价格");
        return;
      }

      saveReport({
        place: reportPlace.value,
        food: food,
        price: Math.round(price * 10) / 10,
        time: new Date().toISOString()
      });

      if (!getAllFoodNames().includes(food)) {
        state.customFoods.push(food);
      }
      state.selectedFoods.add(food);
      saveSelection();
      renderFoodGrid();
      reportPrice.value = "";
      showToast("价格已保存");
    });

    loadSelection();
    setupReportPage();
    updateListBadge();
    updateSaveCurrentBtn();
    renderFoodGrid();
  </script>
</body>
</html>
