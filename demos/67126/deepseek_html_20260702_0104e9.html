<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>读你心灯 · 光配方定制</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(145deg, #1a1a1a 0%, #2d2d2d 100%);
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .lamp-card {
      max-width: 440px;
      width: 100%;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 48px;
      padding: 28px 24px 32px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.1);
      color: #f0f0f0;
      transition: all 0.2s ease;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lamp-icon {
      font-size: 32px;
      filter: drop-shadow(0 4px 6px rgba(255,215,0,0.6));
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 500;
      letter-spacing: 2px;
      background: linear-gradient(to right, #ffd966, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .status-badge {
      background: rgba(255,215,0,0.18);
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #ffd966;
      border: 1px solid rgba(255,215,0,0.4);
      backdrop-filter: blur(10px);
    }
    .preview-window {
      background: #1e1e1e;
      border-radius: 32px;
      padding: 20px 18px;
      margin-bottom: 24px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .reading-sample {
      background: #2b2b2b;
      border-radius: 24px;
      padding: 18px 16px;
      transition: background 0.3s, color 0.3s, text-shadow 0.2s;
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
      font-size: 1rem;
      line-height: 1.65;
      letter-spacing: 0.3px;
      word-break: break-word;
    }
    .sample-title {
      font-weight: 600;
      margin-bottom: 8px;
      opacity: 0.9;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 500;
      color: #cccccc;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      background: linear-gradient(to right, #ffb347, #ffe5b4);
      border-radius: 10px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 12px #ffaa33;
      border: 2px solid #ffaa33;
    }
    .profile-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 6px 0 8px;
    }
    .chip {
      background: rgba(255,255,255,0.07);
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer;
      transition: all 0.25s;
      backdrop-filter: blur(6px);
      color: #ddd;
    }
    .chip.active {
      background: #ffb347;
      border-color: #ffb347;
      color: #0a0a0a;
      font-weight: 600;
      box-shadow: 0 0 20px #ffaa33;
    }
    .eye-comfort-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(0,0,0,0.5);
      border-radius: 40px;
      padding: 12px 18px;
      margin: 8px 0 4px;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .comfort-meter {
      height: 8px;
      width: 80px;
      background: #444;
      border-radius: 10px;
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      width: 70%;
      background: linear-gradient(90deg, #f9d423, #ff8c00);
      border-radius: 10px;
      transition: width 0.3s;
    }
    .note {
      font-size: 0.75rem;
      color: #aaa;
      margin-top: 12px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="lamp-card">
    <div class="header">
      <div class="logo-area">
        <span class="lamp-icon">💡</span>
        <h1>读你心灯</h1>
      </div>
      <div class="status-badge" id="connectionStatus">⏳ 已连接</div>
    </div>

    <div class="preview-window">
      <div class="reading-sample" id="readingSample">
        <div class="sample-title">📖 实时预览 · 视觉舒适样章</div>
        <p>“老船夫不论晴雨，必守在船头。有人过渡时，他便略弯着腰，两手引了竹缆，把船横过小溪。这渡船一次连人带马，约可以载二十位搭客过河，人多时则反复来去。”</p>
        <p style="margin-top: 10px; font-style: italic; opacity: 0.8;">—— 沈从文《边城》节选</p>
      </div>
    </div>

    <div class="control-panel">
      <div class="profile-chips" id="profileContainer">
        <div class="chip active" data-profile="standard">🌞 标准阅读</div>
        <div class="chip" data-profile="dyslexia">🌀 阅读障碍辅助</div>
        <div class="chip" data-profile="elder">👓 长辈护眼</div>
        <div class="chip" data-profile="focus">🧘 深度专注</div>
      </div>

      <div class="slider-group">
        <div class="label-row">
          <span>🎚️ 光谱舒适度</span>
          <span id="spectrumValue">68%</span>
        </div>
        <input type="range" id="spectrumSlider" min="0" max="100" value="68" step="1">
        <div style="font-size:0.75rem; color:#aaa; margin-top: -2px;">调整蓝光/琥珀光平衡以匹配视觉压力</div>
      </div>

      <div class="slider-group">
        <div class="label-row">
          <span>✨ 对比度增强</span>
          <span id="contrastValue">55%</span>
        </div>
        <input type="range" id="contrastSlider" min="0" max="100" value="55" step="1">
        <div style="font-size:0.75rem; color:#aaa; margin-top: -2px;">文字与背景的区分度，减少“文字涌动”</div>
      </div>

      <div class="eye-comfort-indicator">
        <span>👁️ 视觉压力指数</span>
        <div class="comfort-meter">
          <div class="meter-fill" id="comfortFill" style="width: 68%;"></div>
        </div>
        <span id="comfortLabel" style="color:#ffd966;">适中</span>
      </div>
      
      <div style="display: flex; justify-content: center;">
        <span style="background: rgba(255,215,0,0.1); padding: 6px 18px; border-radius: 20px; font-size:0.8rem;">
          🌟 个性化光配方 · 实时同步至台灯
        </span>
      </div>
    </div>
    <div class="note">
      ReadU Lamp · 让光学会阅读你的大脑<br>连接硬件：TRAE Work 创意原型
    </div>
  </div>

  <script>
    (function() {
      // 模拟TRAE Work生成的交互逻辑：动态调整视觉样式与状态
      const readingSample = document.getElementById('readingSample');
      const spectrumSlider = document.getElementById('spectrumSlider');
      const contrastSlider = document.getElementById('contrastSlider');
      const spectrumValue = document.getElementById('spectrumValue');
      const contrastValue = document.getElementById('contrastValue');
      const comfortFill = document.getElementById('comfortFill');
      const comfortLabel = document.getElementById('comfortLabel');
      const chips = document.querySelectorAll('.chip');
      
      // 当前激活的预设
      let currentProfile = 'standard';

      // 预设定义 (对应不同用户群体的光配方参数)
      const profiles = {
        standard: { spectrum: 68, contrast: 55, bg: '#2b2b2b', text: '#f5f5f5', weight: '400' },
        dyslexia: { spectrum: 35, contrast: 85, bg: '#faf3e0', text: '#2e2e2e', weight: '450', desc: '降低蓝光，暖色背景减少视觉压力' },
        elder: { spectrum: 50, contrast: 92, bg: '#fef9e7', text: '#1e1e1e', weight: '500', desc: '高对比度+琥珀光，适应老化视觉' },
        focus: { spectrum: 75, contrast: 60, bg: '#1f2a32', text: '#e0e8f0', weight: '420', desc: '冷调专注光，保留适度蓝光提升警觉' }
      };

      function updateUIFromProfile(profileKey) {
        const p = profiles[profileKey];
        if (!p) return;
        
        // 更新滑块
        spectrumSlider.value = p.spectrum;
        contrastSlider.value = p.contrast;
        spectrumValue.textContent = p.spectrum + '%';
        contrastValue.textContent = p.contrast + '%';
        
        // 应用样式到阅读样本
        readingSample.style.backgroundColor = p.bg;
        readingSample.style.color = p.text;
        readingSample.style.fontWeight = p.weight;
        
        // 调整文字阴影以模拟光照质感 (避免眩光感)
        if (profileKey === 'dyslexia' || profileKey === 'elder') {
          readingSample.style.textShadow = '0 0 1px rgba(0,0,0,0.1)';
        } else {
          readingSample.style.textShadow = 'none';
        }
        
        // 更新视觉压力指示器
        updateComfortMeter(p.spectrum, p.contrast);
        
        // 高亮对应chip
        chips.forEach(chip => {
          const profile = chip.getAttribute('data-profile');
          if (profile === profileKey) {
            chip.classList.add('active');
          } else {
            chip.classList.remove('active');
          }
        });
        currentProfile = profileKey;
      }

      function updateComfortMeter(spectrum, contrast) {
        // 简单模型：舒适度与光谱和对比度的平衡相关 (阅读障碍倾向需要低蓝光+较高对比)
        let comfortScore = 0;
        if (spectrum < 40) comfortScore += 15; // 低蓝光有益部分人群
        else if (spectrum > 70) comfortScore += 5;
        else comfortScore += 20;
        
        if (contrast > 80) comfortScore += 15;
        else if (contrast > 50) comfortScore += 10;
        else comfortScore += 5;
        
        // 映射到百分比
        let percent = Math.min(100, Math.max(25, comfortScore * 2.2));
        comfortFill.style.width = percent + '%';
        
        if (percent >= 75) {
          comfortLabel.textContent = '极佳';
          comfortLabel.style.color = '#ffd966';
        } else if (percent >= 55) {
          comfortLabel.textContent = '适中';
          comfortLabel.style.color = '#ffb347';
        } else {
          comfortLabel.textContent = '紧张';
          comfortLabel.style.color = '#ff8c5a';
        }
      }

      // 滑块手动调节事件 (也会覆盖预设)
      function handleSliderChange() {
        const specVal = parseInt(spectrumSlider.value, 10);
        const contVal = parseInt(contrastSlider.value, 10);
        spectrumValue.textContent = specVal + '%';
        contrastValue.textContent = contVal + '%';
        
        // 根据滑块动态改变预览样式 (模拟光谱与对比度)
        // 光谱影响背景色温：低数值偏暖(琥珀色)，高数值偏冷
        const warmBase = [250, 235, 210]; // 暖黄
        const coolBase = [220, 230, 245]; // 冷白
        const blendRatio = specVal / 100;
        const r = Math.floor(warmBase[0] * (1 - blendRatio) + coolBase[0] * blendRatio);
        const g = Math.floor(warmBase[1] * (1 - blendRatio) + coolBase[1] * blendRatio);
        const b = Math.floor(warmBase[2] * (1 - blendRatio) + coolBase[2] * blendRatio);
        readingSample.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        
        // 对比度影响文字颜色深度与背景关系
        const textLum = Math.max(15, 95 - contVal * 0.7);
        readingSample.style.color = `rgb(${textLum}, ${textLum}, ${textLum})`;
        
        // 移除芯片激活状态（因为用户手动调节）
        chips.forEach(chip => chip.classList.remove('active'));
        currentProfile = 'custom';
        
        updateComfortMeter(specVal, contVal);
      }

      spectrumSlider.addEventListener('input', handleSliderChange);
      contrastSlider.addEventListener('input', handleSliderChange);

      // 预设芯片点击
      chips.forEach(chip => {
        chip.addEventListener('click', function(e) {
          const profile = this.getAttribute('data-profile');
          if (profile && profiles[profile]) {
            updateUIFromProfile(profile);
          }
        });
      });

      // 模拟连接状态变化 (TRAE Work 产物特色)
      const statusBadge = document.getElementById('connectionStatus');
      setTimeout(() => {
        statusBadge.textContent = '🟢 已同步';
        statusBadge.style.color = '#b9f5b0';
      }, 1200);
      
      // 初始化默认预设
      updateUIFromProfile('standard');
      
      console.log('读你心灯 · TRAE Work 创意原型已启动 — 让光适应大脑');
    })();
  </script>
</body>
</html>
