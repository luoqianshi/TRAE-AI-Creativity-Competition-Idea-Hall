<!DOCTYPE html>
<html lang="zh-CN" data-font-scale="standard">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>易办通 · 首页预览</title>
<style>
  :root {
    --bg: #F2EEE4;
    --surface: #FFFFFF;
    --surface-alt: #FBF8F1;
    --ink: #2B342B;
    --ink-soft: #5E6B5C;
    --line: #E4DECF;
    --primary: #7BA17D;
    --primary-soft: #E6EFE4;
    --primary-strong: #567E5A;
    --on-primary: #FFFFFF;
    --clay: #C4744F;
    --clay-soft: #F5E4D9;
    --gold: #C9922E;
    --shadow: 0 6px 20px -8px rgba(60, 74, 60, 0.28);
    --shadow-lg: 0 18px 42px -18px rgba(60, 74, 60, 0.42);
  }

  html[data-contrast="high"] {
    --bg: #0D130E;
    --surface: #17201A;
    --surface-alt: #1F2B21;
    --ink: #F6F8F2;
    --ink-soft: #CBD6C7;
    --line: #3C4C3E;
    --primary: #A8CDA9;
    --primary-soft: #23311F;
    --primary-strong: #C4E3C3;
    --on-primary: #0E170F;
    --clay: #E7A582;
    --clay-soft: #33241C;
    --gold: #E4B457;
    --shadow: 0 6px 20px -8px rgba(0, 0, 0, 0.6);
    --shadow-lg: 0 18px 42px -16px rgba(0, 0, 0, 0.7);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: 18px; -webkit-text-size-adjust: 100%; }
  html[data-font-scale="large"] { font-size: 21px; }
  html[data-font-scale="xlarge"] { font-size: 25px; }

  body {
    background-color: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
    line-height: 1.7;
    letter-spacing: 0.01em;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    transition: background-color 0.3s ease, color 0.3s ease;
    background-image:
      radial-gradient(circle at 15% 20%, color-mix(in srgb, var(--primary) 10%, transparent) 0, transparent 42%),
      radial-gradient(circle at 88% 8%, color-mix(in srgb, var(--gold) 9%, transparent) 0, transparent 40%);
    background-attachment: fixed;
  }

  .font-brand { font-family: "Songti SC", "Noto Serif SC", "STSong", "SimSun", serif; letter-spacing: 0.03em; }

  :focus-visible { outline: 3px solid var(--primary-strong); outline-offset: 3px; border-radius: 6px; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 64rem; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.7rem 1rem;
  }
  .brand { display: flex; align-items: center; gap: 0.6rem; }
  .brand-mark {
    width: 2.4rem; height: 2.4rem; border-radius: 0.8rem;
    background: linear-gradient(140deg, var(--primary), var(--primary-strong));
    color: var(--on-primary);
    display: grid; place-items: center;
    box-shadow: var(--shadow);
    font-size: 1.3rem;
  }
  .brand-name { font-size: 1.45rem; font-weight: 700; color: var(--ink); }
  .brand-sub { font-size: 0.72rem; color: var(--ink-soft); letter-spacing: 0.2em; }
  .topbar-actions { display: flex; gap: 0.5rem; }
  .icon-btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.55rem 0.85rem; border-radius: 0.75rem;
    border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); font-size: 0.9rem; cursor: pointer;
    transition: all 0.18s ease;
  }
  .icon-btn:hover { background: var(--primary-soft); border-color: var(--primary); }
  .icon-btn svg { width: 1.2rem; height: 1.2rem; }

  /* ---------- 主体 ---------- */
  main { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1rem 6rem; }

  /* 问候栏 */
  .hero {
    position: relative; overflow: hidden;
    border-radius: 1.4rem; padding: 1.6rem 1.5rem;
    background: linear-gradient(135deg, var(--primary-strong), var(--primary));
    color: var(--on-primary);
    box-shadow: var(--shadow-lg);
    display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
  }
  .hero::after {
    content: ""; position: absolute; right: -40px; top: -40px;
    width: 180px; height: 180px; border-radius: 50%;
    background: rgba(255,255,255,0.12);
  }
  .hero-greeting { font-size: 1.9rem; font-weight: 700; }
  .hero-name { opacity: 0.92; }
  .hero-date { margin-top: 0.4rem; font-size: 0.95rem; opacity: 0.85; }
  .hero-weather {
    position: relative; z-index: 1;
    text-align: center; background: rgba(255,255,255,0.16);
    border-radius: 1rem; padding: 0.7rem 1rem; min-width: 6rem;
  }
  .hero-weather .t { font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
  .hero-weather .c { font-size: 0.85rem; opacity: 0.9; }
  .hero-weather .ic { font-size: 1.6rem; }

  /* 区块标题 */
  .section-title {
    display: flex; align-items: center; gap: 0.5rem;
    margin: 2rem 0 1rem; font-size: 1.25rem; font-weight: 700;
  }
  .section-title .bar { width: 0.28rem; height: 1.35rem; border-radius: 99px; background: var(--primary); }

  /* 九宫格 */
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.85rem;
  }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  .tile {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 1.1rem; padding: 1.15rem 1rem;
    display: flex; flex-direction: column; gap: 0.55rem;
    cursor: pointer; text-align: left;
    transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    box-shadow: var(--shadow);
  }
  .tile:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: var(--shadow-lg); }
  .tile-icon {
    width: 3rem; height: 3rem; border-radius: 0.9rem;
    display: grid; place-items: center;
    background: var(--primary-soft); color: var(--primary-strong);
  }
  .tile-icon svg { width: 1.6rem; height: 1.6rem; }
  .tile:nth-child(2) .tile-icon,
  .tile:nth-child(6) .tile-icon { background: var(--clay-soft); color: var(--clay); }
  .tile-title { font-size: 1.2rem; font-weight: 700; }
  .tile-desc { font-size: 0.88rem; color: var(--ink-soft); }

  /* 今日速览 */
  .glance { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.85rem; }
  @media (max-width: 720px) { .glance { grid-template-columns: 1fr; } }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 1.1rem; padding: 1.15rem; box-shadow: var(--shadow);
  }
  .card-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.85rem; }
  .card-head .dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--primary); }
  .card-head h3 { font-size: 1.1rem; font-weight: 700; }
  .med-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.55rem 0; border-bottom: 1px dashed var(--line);
  }
  .med-row:last-child { border-bottom: none; }
  .med-name { font-weight: 600; }
  .med-time {
    background: var(--primary-soft); color: var(--primary-strong);
    padding: 0.15rem 0.6rem; border-radius: 99px; font-size: 0.85rem; font-weight: 600;
  }
  .appt-line { margin: 0.3rem 0; }
  .appt-line .k { color: var(--ink-soft); font-size: 0.9rem; }
  .appt-line .v { font-weight: 600; }
  .pill {
    display: inline-block; padding: 0.12rem 0.6rem; border-radius: 99px;
    font-size: 0.78rem; font-weight: 700;
    background: var(--clay-soft); color: var(--clay);
  }
  .news-cat {
    display: inline-block; margin-bottom: 0.5rem;
    padding: 0.12rem 0.6rem; border-radius: 99px; font-size: 0.78rem; font-weight: 700;
    background: var(--primary-soft); color: var(--primary-strong);
  }
  .news-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 0.35rem; }
  .news-sum { color: var(--ink-soft); font-size: 0.92rem; }

  /* 语音球 */
  .voice-ball {
    position: fixed; right: 1.4rem; bottom: 1.6rem; z-index: 50;
    width: 4.4rem; height: 4.4rem; border-radius: 50%;
    background: linear-gradient(140deg, var(--primary), var(--primary-strong));
    color: var(--on-primary); border: none; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: var(--shadow-lg);
    transition: transform 0.16s ease;
  }
  .voice-ball:hover { transform: scale(1.06); }
  .voice-ball svg { width: 2rem; height: 2rem; position: relative; z-index: 2; }
  .voice-ball .ring { position: absolute; inset: 0; border-radius: 50%; }
  .voice-ball.listening .ring::before,
  .voice-ball.listening .ring::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: var(--primary); animation: ping-ring 1.8s cubic-bezier(0,0,0.2,1) infinite;
  }
  .voice-ball.listening .ring::after { animation-delay: 0.9s; }
  @keyframes ping-ring { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(2.1); opacity: 0; } }
  .voice-hint {
    position: fixed; right: 1.4rem; bottom: 6.6rem; z-index: 50;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 0.9rem; padding: 0.6rem 0.9rem; box-shadow: var(--shadow);
    font-size: 0.9rem; max-width: 15rem; display: none;
  }
  .voice-hint.show { display: block; }

  /* 载入动画 */
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .rise { animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }

  /* toast */
  #toast {
    position: fixed; left: 50%; bottom: 2rem; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg);
    padding: 0.8rem 1.3rem; border-radius: 99px; font-size: 0.95rem; font-weight: 600;
    box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none;
    transition: all 0.25s ease; z-index: 99;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .preview-note {
    max-width: 64rem; margin: 0 auto; padding: 0.6rem 1rem;
    font-size: 0.8rem; color: var(--ink-soft); text-align: center;
  }

  @media (prefers-reduced-motion: reduce) { .rise, .voice-ball .ring::before, .voice-ball .ring::after { animation: none; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark font-brand">易</div>
      <div>
        <div class="brand-name font-brand">易办通</div>
        <div class="brand-sub">适老便民服务</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="fontBtn" onclick="cycleFont()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></svg>
        <span id="fontLabel">标准字</span>
      </button>
      <button class="icon-btn" id="contrastBtn" onclick="toggleContrast()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor"/></svg>
        <span id="contrastLabel">高对比</span>
      </button>
    </div>
  </div>
</header>

<main>
  <!-- 问候栏 -->
  <section class="hero rise">
    <div>
      <div class="hero-greeting" id="greeting">上午好</div>
      <div class="hero-name">张桂芬，祝您今天心情舒畅</div>
      <div class="hero-date" id="dateLine">2026年7月9日 星期四</div>
    </div>
    <div class="hero-weather">
      <div class="ic">⛅</div>
      <div class="t">31°</div>
      <div class="c">苏州 · 多云</div>
    </div>
  </section>

  <!-- 九宫格 -->
  <h2 class="section-title rise" style="animation-delay:.08s"><span class="bar"></span>全部服务</h2>
  <div class="grid" id="grid"></div>

  <!-- 今日速览 -->
  <h2 class="section-title rise" style="animation-delay:.16s"><span class="bar"></span>今日速览</h2>
  <div class="glance">
    <div class="card rise" style="animation-delay:.2s">
      <div class="card-head"><span class="dot"></span><h3>今日用药</h3></div>
      <div id="medList"></div>
    </div>
    <div class="card rise" style="animation-delay:.26s">
      <div class="card-head"><span class="dot"></span><h3>就医提醒</h3></div>
      <div>
        <div class="appt-line"><span class="pill">2 天后</span></div>
        <div class="appt-line"><span class="k">医院：</span><span class="v">市第一人民医院</span></div>
        <div class="appt-line"><span class="k">科室：</span><span class="v">心血管内科</span></div>
        <div class="appt-line"><span class="k">医生：</span><span class="v">王建国 主任医师</span></div>
        <div class="appt-line"><span class="k">时间：</span><span class="v" id="apptDate">上午 09:30</span></div>
      </div>
    </div>
    <div class="card rise" style="animation-delay:.32s">
      <div class="card-head"><span class="dot"></span><h3>今日资讯</h3></div>
      <span class="news-cat">政策</span>
      <div class="news-title">城乡居民基础养老金再上调，7 月起足额发放</div>
      <div class="news-sum">本次调整惠及全市 60 岁以上参保居民，人均月增 35 元，无需申请自动到账。</div>
    </div>
  </div>
</main>

<div class="voice-hint" id="voiceHint">点我说话，例如"我要挂号""查社保余额"，我来帮您办。</div>
<button class="voice-ball" id="voiceBall" onclick="tapVoice()" aria-label="语音助手">
  <span class="ring"></span>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
</button>

<div id="toast"></div>
<div class="preview-note">这是纯静态预览页（HTML）。字体、配色、交互均与真实 Next.js 项目一致，仅用于让您先看效果。</div>

<script>
  // ---- 服务九宫格数据（含内联图标） ----
  const ICONS = {
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>',
    stethoscope: '<path d="M11 2v2"/><path d="M5 2v2"/><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/><path d="M8 15a6 6 0 0 0 6 6 6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/>',
    heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
    compass: '<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    bot: '<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
    phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92Z"/>',
    news: '<path d="M15 18h-5"/><path d="M18 14h-8"/><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M10 6h8v4h-8V6Z"/>',
    settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>'
  };
  const TILES = [
    { title: "社保服务", desc: "余额 · 缴费 · 认证", icon: "shield" },
    { title: "医疗服务", desc: "预约挂号 · 报告查询", icon: "stethoscope" },
    { title: "健康管理", desc: "健康档案 · 用药提醒", icon: "heart" },
    { title: "便民导航", desc: "附近服务 · 天气查询", icon: "compass" },
    { title: "家庭账号", desc: "子女协助 · 亲情绑定", icon: "users" },
    { title: "智能助手", desc: "说句话就能帮您办", icon: "bot" },
    { title: "常用电话", desc: "一键拨打不用记", icon: "phone" },
    { title: "新闻资讯", desc: "政策 · 健康 · 社区", icon: "news" },
    { title: "适老设置", desc: "字体 · 对比度 · 语音", icon: "settings" }
  ];
  const svg = (p) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
  document.getElementById('grid').innerHTML = TILES.map(function(t, i){
    return '<button class="tile rise" style="animation-delay:' + (0.1 + i*0.04) + 's" onclick="toast(\'进入「' + t.title + '」\')">' +
      '<div class="tile-icon">' + svg(ICONS[t.icon]) + '</div>' +
      '<div class="tile-title">' + t.title + '</div>' +
      '<div class="tile-desc">' + t.desc + '</div></button>';
  }).join('');

  // ---- 今日用药 ----
  const MEDS = [
    { name: "氨氯地平片", dosage: "1 片", time: "08:00" },
    { name: "二甲双胍缓释片", dosage: "1 片", time: "08:00 / 18:30" }
  ];
  document.getElementById('medList').innerHTML = MEDS.map(function(m){
    return '<div class="med-row"><div><div class="med-name">' + m.name + '</div>' +
      '<div style="color:var(--ink-soft);font-size:.85rem">每次 ' + m.dosage + '</div></div>' +
      '<span class="med-time">' + m.time + '</span></div>';
  }).join('');

  // ---- 问候语 + 日期 ----
  (function(){
    const now = new Date();
    const h = now.getHours();
    let g = "您好";
    if (h < 6) g = "夜深了"; else if (h < 12) g = "上午好"; else if (h < 14) g = "中午好"; else if (h < 18) g = "下午好"; else g = "晚上好";
    document.getElementById('greeting').textContent = g;
    const wd = ["日","一","二","三","四","五","六"][now.getDay()];
    document.getElementById('dateLine').textContent =
      now.getFullYear() + "年" + (now.getMonth()+1) + "月" + now.getDate() + "日 星期" + wd;
    const appt = new Date(now.getTime() + 2*86400000);
    document.getElementById('apptDate').textContent =
      (appt.getMonth()+1) + "月" + appt.getDate() + "日 上午 09:30";
  })();

  // ---- 字号循环 ----
  const SCALES = ["standard", "large", "xlarge"];
  const SCALE_LABEL = { standard: "标准字", large: "大字", xlarge: "超大字" };
  function cycleFont(){
    const cur = document.documentElement.getAttribute('data-font-scale') || 'standard';
    const next = SCALES[(SCALES.indexOf(cur) + 1) % SCALES.length];
    document.documentElement.setAttribute('data-font-scale', next);
    document.getElementById('fontLabel').textContent = SCALE_LABEL[next];
    toast("字号已切换：" + SCALE_LABEL[next]);
  }

  // ---- 高对比度 ----
  function toggleContrast(){
    const on = document.documentElement.getAttribute('data-contrast') === 'high';
    if (on) { document.documentElement.removeAttribute('data-contrast'); document.getElementById('contrastLabel').textContent = "高对比"; toast("已切换为浅色模式"); }
    else { document.documentElement.setAttribute('data-contrast', 'high'); document.getElementById('contrastLabel').textContent = "浅色"; toast("已切换为高对比度深色"); }
  }

  // ---- 语音球 ----
  let listening = false;
  function tapVoice(){
    const ball = document.getElementById('voiceBall');
    const hint = document.getElementById('voiceHint');
    listening = !listening;
    if (listening) { ball.classList.add('listening'); hint.classList.add('show'); toast("正在聆听…（真实项目接入语音识别）"); }
    else { ball.classList.remove('listening'); hint.classList.remove('show'); }
  }

  // ---- toast ----
  let toastTimer;
  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1800);
  }
</script>
</body>
</html>
