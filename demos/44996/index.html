<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帮爸妈读懂 ElderAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF8C42;
            --primary-dark: #E67A35;
            --bg: #FFF8F0;
            --bg-card: #FFFFFF;
            --text: #4A4A4A;
            --text-light: #7A7A7A;
            --risk-red: #E74C3C;
            --risk-red-bg: #FDEDEB;
            --risk-yellow: #F39C12;
            --risk-yellow-bg: #FEF9E7;
            --risk-green: #27AE60;
            --risk-green-bg: #E8F8F0;
            --border: #E8E0D8;
            --shadow: rgba(255, 140, 66, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 18px;
            line-height: 1.7;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        header {
            text-align: center;
            padding: 32px 0 28px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 18px;
            color: var(--text-light);
        }

        .input-section {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 4px 24px var(--shadow);
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 6px;
            height: 24px;
            background: var(--primary);
            border-radius: 3px;
        }

        .sample-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .sample-btn {
            padding: 10px 18px;
            font-size: 16px;
            font-family: inherit;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 20px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sample-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #FFF;
        }

        .sample-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #FFF;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 20px;
            font-size: 18px;
            font-family: inherit;
            border: 2px solid var(--border);
            border-radius: 16px;
            resize: vertical;
            transition: border-color 0.2s;
            background: var(--bg);
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea::placeholder {
            color: var(--text-light);
        }

        .file-upload {
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-upload label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            font-size: 16px;
            background: var(--bg);
            border: 2px dashed var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-upload label:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .file-name {
            font-size: 14px;
            color: var(--text-light);
        }

        .submit-btn {
            width: 100%;
            padding: 20px 32px;
            font-size: 22px;
            font-weight: 600;
            font-family: inherit;
            background: var(--primary);
            color: #FFF;
            border: none;
            border-radius: 32px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(255, 140, 66, 0.3);
        }

        .submit-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 140, 66, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.show {
            display: block;
        }

        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .loading-dots span {
            width: 14px;
            height: 14px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .loading-text {
            font-size: 18px;
            color: var(--text-light);
        }

        .output-section {
            display: none;
        }

        .output-section.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .output-card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 4px 24px var(--shadow);
        }

        .interpretation-item {
            padding: 20px;
            background: var(--bg);
            border-radius: 16px;
            margin-bottom: 16px;
            border-left: 6px solid var(--border);
        }

        .interpretation-item:last-child {
            margin-bottom: 0;
        }

        .interpretation-item.risk-red {
            border-left-color: var(--risk-red);
            background: var(--risk-red-bg);
        }

        .interpretation-item.risk-yellow {
            border-left-color: var(--risk-yellow);
            background: var(--risk-yellow-bg);
        }

        .interpretation-item.risk-green {
            border-left-color: var(--risk-green);
            background: var(--risk-green-bg);
        }

        .original-text {
            font-size: 16px;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .plain-text {
            font-size: 20px;
            font-weight: 500;
            color: var(--text);
        }

        .risk-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin-top: 12px;
        }

        .risk-badge.red {
            background: var(--risk-red);
            color: #FFF;
        }

        .risk-badge.yellow {
            background: var(--risk-yellow);
            color: #FFF;
        }

        .risk-badge.green {
            background: var(--risk-green);
            color: #FFF;
        }

        .suggestions-list {
            list-style: none;
        }

        .suggestions-list li {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 18px 0;
            border-bottom: 1px solid var(--border);
            font-size: 19px;
        }

        .suggestions-list li:last-child {
            border-bottom: none;
        }

        .suggestion-icon {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            background: var(--primary);
            color: #FFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
        }

        .suggestion-text {
            padding-top: 6px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-light);
            font-size: 14px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 16px 16px 40px;
            }

            .logo {
                font-size: 26px;
            }

            .subtitle {
                font-size: 16px;
            }

            .input-section {
                padding: 20px;
                border-radius: 20px;
            }

            .section-title {
                font-size: 20px;
            }

            textarea {
                min-height: 150px;
                font-size: 16px;
                padding: 16px;
            }

            .submit-btn {
                padding: 18px 24px;
                font-size: 20px;
            }

            .output-card {
                padding: 20px;
                border-radius: 20px;
            }

            .plain-text {
                font-size: 18px;
            }

            .suggestions-list li {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">帮爸妈读懂 ElderAI</h1>
            <p class="subtitle">把专业术语翻译成大白话</p>
        </header>

        <section class="input-section">
            <h2 class="section-title">粘贴或上传专业文本</h2>

            <div class="sample-buttons">
                <button class="sample-btn" data-sample="report">体检报告示例</button>
                <button class="sample-btn" data-sample="insurance">医保短信示例</button>
                <button class="sample-btn" data-sample="medicine">药品说明示例</button>
            </div>

            <textarea
                id="inputText"
                placeholder="请在这里粘贴体检报告、医保短信、政府通知、药品说明书等...
                
或者点击上方按钮查看示例"
            ></textarea>

            <div class="file-upload">
                <label for="fileInput">
                    <span>📄</span> 上传 TXT 文件
                </label>
                <input type="file" id="fileInput" accept=".txt">
                <span class="file-name" id="fileName"></span>
            </div>

            <button class="submit-btn" id="translateBtn">
                翻译成大白话
            </button>
        </section>

        <div class="loading" id="loading">
            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <p class="loading-text">正在翻译，请稍候...</p>
        </div>

        <section class="output-section" id="outputSection">
            <div class="output-card">
                <h2 class="section-title">大白话解读</h2>
                <div id="interpretations"></div>
            </div>

            <div class="output-card">
                <h2 class="section-title">下一步该做什么</h2>
                <ul class="suggestions-list" id="suggestions"></ul>
            </div>
        </section>

        <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">📖</div>
            <p>输入专业文本，我会帮您翻译成通俗易懂的大白话</p>
        </div>
    </div>

    <footer>
        <p>ElderAI · 让科技有温度</p>
    </footer>

    <script>
        const mockData = {
            report: {
                id: '体检报告',
                original: `空腹血糖: 7.2 mmol/L (参考值: 3.9-6.1)
总胆固醇: 5.8 mmol/L (参考值: <5.2)
甘油三酯: 2.1 mmol/L (参考值: <1.7)
血红蛋白: 142 g/L (参考值: 120-160)
尿蛋白: +1 (参考值: -)`,
                interpretations: [
                    { text: '空腹血糖: 7.2 mmol/L (参考值: 3.9-6.1)', plain: '您的血糖有点高了，正常应该在6.1以下，现在已经到7.2了', risk: 'yellow' },
                    { text: '总胆固醇: 5.8 mmol/L (参考值: <5.2)', plain: '胆固醇也有点高，正常应该低于5.2', risk: 'yellow' },
                    { text: '甘油三酯: 2.1 mmol/L (参考值: <1.7)', plain: '这项也偏高，正常应该低于1.7', risk: 'yellow' },
                    { text: '血红蛋白: 142 g/L (参考值: 120-160)', plain: '血红蛋白正常，说明您不贫血', risk: 'green' },
                    { text: '尿蛋白: +1 (参考值: -)', plain: '尿里检测到少量蛋白，需要关注一下肾脏功能', risk: 'yellow' }
                ],
                suggestions: [
                    '建议近期复查空腹血糖，如果持续偏高，可能需要调整饮食或就医',
                    '饮食要清淡一些，少吃肥肉、动物内脏和油炸食品',
                    '每天散散步，适度运动对控制血糖血脂都有帮助',
                    '多喝水，促进身体代谢',
                    '2-3个月后复查血脂四项'
                ]
            },
            insurance: {
                id: '医保短信',
                original: `【医保局】您的医保账户于10月15日转入 ¥236.50，余额 ¥1,892.36。
其中 ¥200.00 为上月返还，¥36.50 为利息。
本月医保缴费基数调整为 ¥6,000.00。
如需查询详情，请访问医保服务平台。`,
                interpretations: [
                    { text: '您的医保账户于10月15日转入 ¥236.50，余额 ¥1,892.36', plain: '您的医保卡里多了236块5毛，现在卡里一共有1892块3毛6', risk: 'green' },
                    { text: '其中 ¥200.00 为上月返还，¥36.50 为利息', plain: '这236块5毛里，200块是上个月返的钱，36块5毛是利息', risk: 'green' },
                    { text: '本月医保缴费基数调整为 ¥6,000.00', plain: '以后每个月交医保的钱会按这个基数来算，跟以前可能不太一样', risk: 'green' },
                    { text: '如需查询详情，请访问医保服务平台', plain: '想看更详细的信息，可以去医保服务平台查询，不过这条短信本身不用太担心', risk: 'green' }
                ],
                suggestions: [
                    '这是正常医保返还，不用担心',
                    '余额可以在药店买药或医院看病时使用',
                    '如果信息有疑问，可以拨打医保服务热线 12333 咨询'
                ]
            },
            medicine: {
                id: '药品说明书',
                original: `【阿司匹林肠溶片说明书摘要】
适应症：用于预防血栓形成、治疗心绞痛。
用法用量：口服，每日一次，每次100mg。
禁忌：对阿司匹林或其他水杨酸类药物过敏者禁用。
注意事项：可能引发出血倾向，服用期间应避免受伤。
不良反应：常见恶心、胃部不适，极少数情况下可能出现消化道出血。`,
                interpretations: [
                    { text: '适应症：用于预防血栓形成、治疗心绞痛', plain: '这个药可以预防血管堵塞，也能缓解心脏病引起的胸闷胸痛', risk: 'green' },
                    { text: '用法用量：口服，每日一次，每次100mg', plain: '每天吃一次就行，一次吃一片，饭前吃效果更好', risk: 'green' },
                    { text: '禁忌：对阿司匹林或其他水杨酸类药物过敏者禁用', plain: '如果您之前吃阿司匹林过敏，就不能吃这个药', risk: 'yellow' },
                    { text: '注意事项：可能引发出血倾向，服用期间应避免受伤', plain: '吃了这个药，伤口可能不容易止血，要小心别磕着碰着', risk: 'yellow' },
                    { text: '不良反应：常见恶心、胃部不适，极少数情况下可能出现消化道出血', plain: '常见的反应是胃不太舒服、有点恶心；极少数情况可能会胃出血', risk: 'yellow' }
                ],
                suggestions: [
                    '如果胃不舒服可以饭后吃，减少刺激',
                    '用药期间注意保护自己，避免剧烈运动或容易受伤的活动',
                    '如果出现黑便、呕血等异常情况，立即停药并就医',
                    '一定要按照医生开的剂量服用，不要自行调整',
                    '定期复查，让医生评估药效'
                ]
            }
        };

        const inputText = document.getElementById('inputText');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const translateBtn = document.getElementById('translateBtn');
        const loading = document.getElementById('loading');
        const outputSection = document.getElementById('outputSection');
        const emptyState = document.getElementById('emptyState');
        const interpretationsEl = document.getElementById('interpretations');
        const suggestionsEl = document.getElementById('suggestions');
        const sampleBtns = document.querySelectorAll('.sample-btn');

        function getRiskLabel(risk) {
            const labels = { red: '高风险', yellow: '需关注', green: '正常' };
            return labels[risk] || '';
        }

        function getRiskIcon(risk) {
            const icons = { red: '⚠️', yellow: '📌', green: '✓' };
            return icons[risk] || '';
        }

        function renderOutput(data) {
            interpretationsEl.innerHTML = data.interpretations.map(item => `
                <div class="interpretation-item risk-${item.risk}">
                    <div class="original-text">${item.text}</div>
                    <div class="plain-text">${item.plain}</div>
                    <span class="risk-badge ${item.risk}">
                        ${getRiskIcon(item.risk)} ${getRiskLabel(item.risk)}
                    </span>
                </div>
            `).join('');

            suggestionsEl.innerHTML = data.suggestions.map((suggestion, i) => `
                <li>
                    <span class="suggestion-icon">${i + 1}</span>
                    <span class="suggestion-text">${suggestion}</span>
                </li>
            `).join('');
        }

        function simpleTranslate(text) {
            const interpretations = [];
            const lines = text.split('\n').filter(line => line.trim());

            const riskKeywords = {
                red: ['高危', '危险', '严重', '紧急', '立即', '致命'],
                yellow: ['偏高', '偏低', '注意', '关注', '异常', '可疑'],
                green: ['正常', '良好', '阴性', '无异常']
            };

            let overallRisk = 'green';

            lines.forEach(line => {
                let risk = 'green';
                if (riskKeywords.red.some(k => line.includes(k))) {
                    risk = 'red';
                    overallRisk = 'red';
                } else if (riskKeywords.yellow.some(k => line.includes(k))) {
                    risk = 'yellow';
                    if (overallRisk !== 'red') overallRisk = 'yellow';
                }

                const plain = `这句话提到了：${line.trim()}`;
                interpretations.push({ text: line, plain, risk });
            });

            const suggestions = [
                '建议保存或截图这份文件',
                '如有疑问可以咨询专业人士'
            ];

            return {
                id: '智能解读',
                original: text,
                interpretations,
                suggestions
            };
        }

        function analyzeText(text) {
            const trimmedText = text.trim();

            for (const key of Object.keys(mockData)) {
                const data = mockData[key];
                if (trimmedText.includes(data.original.substring(0, 20)) ||
                    trimmedText.includes(data.id)) {
                    return data;
                }
            }

            return simpleTranslate(trimmedText);
        }

        sampleBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                sampleBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const sample = btn.dataset.sample;
                if (mockData[sample]) {
                    inputText.value = mockData[sample].original;
                }
            });
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileName.textContent = file.name;
                const reader = new FileReader();
                reader.onload = (e) => {
                    inputText.value = e.target.result;
                };
                reader.readAsText(file);
            }
        });

        translateBtn.addEventListener('click', () => {
            const text = inputText.value.trim();

            if (!text) {
                inputText.focus();
                return;
            }

            emptyState.style.display = 'none';
            outputSection.classList.remove('show');
            loading.classList.add('show');
            translateBtn.disabled = true;

            setTimeout(() => {
                const result = analyzeText(text);
                renderOutput(result);

                loading.classList.remove('show');
                outputSection.classList.add('show');
                translateBtn.disabled = false;

                outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 1200);
        });

        inputText.addEventListener('input', () => {
            sampleBtns.forEach(b => b.classList.remove('active'));
        });
    </script>
</body>
</html>
