<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spine序列帧动画生成器 - 多皮肤版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

}
.container {

header {

}
header h1 {
  color: #fff;

}

  font-size: 12px;

}
.main-content {

}
.section {

.section h3 {

.group-header {

.group-header input {

.setting-item input, .setting-item select {

.download-buttons {

<body>
<div class="container">
  <header>
    <h1>Spine序列帧动画生成器</h1>
    <p>上传多张连续帧图片，自动生成Spine动画文件</p>
    <span class="version">v3.0 多皮肤版</span>
  </header>

  <div class="main-content">
    <div class="section">
      <h3>皮肤设置</h3>
      <div class="skin-tabs" id="skin-tabs"></div>
      <button class="btn-add" onclick="addSkin()">+ 添加皮肤</button>
    </div>

    <div class="section">
      <h3>动画组</h3>
      <div id="animations-container"></div>
      <button class="btn-add" onclick="addAnimation()">+ 添加动画组</button>
    </div>

    <div class="section">
      <h3>上传图片</h3>
      <div id="upload-area-container"></div>
    </div>

    <div class="settings-row">
      <div class="setting-item">
        <label>文件名称:</label>
        <input type="text" id="output-name" value="animation" placeholder="输出文件名">
      </div>
      <div class="setting-item">
        <label>Spine版本:</label>
        <select id="spine-version">
          <option value="3.8.75">3.8.75</option>
          <option value="4.2.43" selected>4.2.43</option>
        </select>
      </div>
    </div>

    <button class="btn-generate" id="generate-btn" onclick="generate()">生成Spine动画</button>

    <div class="progress" id="progress" style="display:none;">加载中...</div>

    <div class="result-section" id="result-section">
      <h3>生成结果</h3>
      <div class="download-buttons">
        <button class="btn-zip" onclick="downloadAll()">下载全部 (ZIP)</button>
        <button class="btn-file" onclick="downloadJSON()">下载 .json</button>
        <button class="btn-file" onclick="downloadAtlas()">下载 .atlas</button>
        <button class="btn-file" onclick="downloadPNG()">下载 .png</button>
      </div>

      <div class="preview-area">
        <div class="preview-controls">
          <select id="preview-skin"></select>
          <select id="preview-animation"></select>
          <button onclick="togglePreview()">播放/暂停</button>
        </div>
        <canvas id="preview-canvas"></canvas>
        <div class="preview-info" id="preview-info"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
let state = {
  skins: [{ id: 1, name: 'default', active: true }],
  animations: [{ id: 1, name: 'action1', fps: 15 }],
  uploads: {},
  generatedFiles: null
};

let nextSkinId = 2;
let nextAnimId = 2;

function renderSkins() {
  const container = document.getElementById('skin-tabs');
  container.innerHTML = state.skins.map((skin, index) => `
    <div class="skin-tab ${skin.active ? 'active' : ''}" onclick="switchSkin(${skin.id})">
      <input type="text" value="${skin.name}" onchange="updateSkinName(${skin.id}, this.value)" onfocus="event.stopPropagation()">
      <span class="remove" onclick="event.stopPropagation(); removeSkin(${skin.id})">×</span>
    </div>
  `).join('');
  renderUploadAreas();
}

function addSkin() {
  state.skins.push({ id: nextSkinId++, name: `skin${nextSkinId - 1}`, active: false });
  renderSkins();
}

function removeSkin(id) {
  state.skins = state.skins.filter(s => s.id !== id);
  if (state.skins.length === 0) {
    state.skins.push({ id: nextSkinId++, name: 'default', active: true });
  } else if (!state.skins.find(s => s.active)) {
    state.skins[0].active = true;
  }
  renderSkins();
}

function updateSkinName(id, name) {
  const skin = state.skins.find(s => s.id === id);
  if (skin) skin.name = name;
}

function switchSkin(id) {
  state.skins.forEach(s => s.active = s.id === id);
  renderSkins();
}

function renderAnimations() {
  const container = document.getElementById('animations-container');
  container.innerHTML = state.animations.map((anim, index) => `
    <div class="group-item">
      <div class="group-header">
        <span style="font-size:14px;color:#999;">动画组 ${index + 1}</span>
        <input type="text" value="${anim.name}" onchange="updateAnimationName(${anim.id}, this.value)" placeholder="动画名称">
        <span style="font-size:13px;color:#666;">帧率:</span>
        <input type="number" value="${anim.fps}" min="1" max="60" onchange="updateAnimationFps(${anim.id}, this.value)" style="width:60px;">
        <button class="btn-remove" onclick="removeAnimation(${anim.id})">×</button>
      </div>
    </div>
  `).join('');
}

function addAnimation() {
  state.animations.push({ id: nextAnimId++, name: `action${nextAnimId - 1}`, fps: 15 });
  renderAnimations();
  renderUploadAreas();
}

function removeAnimation(id) {
  state.animations = state.animations.filter(a => a.id !== id);
  if (state.animations.length === 0) {
    state.animations.push({ id: nextAnimId++, name: 'action1', fps: 15 });
  }
  renderAnimations();
  renderUploadAreas();
}

function updateAnimationName(id, name) {
  const anim = state.animations.find(a => a.id === id);
  if (anim) anim.name = name;
}

function updateAnimationFps(id, fps) {
  const anim = state.animations.find(a => a.id === id);
  if (anim) anim.fps = parseInt(fps) || 15;
}

function renderUploadAreas() {
  const container = document.getElementById('upload-area-container');
  const activeSkin = state.skins.find(s => s.active);
  
  if (!activeSkin || state.animations.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#999;">请先添加动画组</p>';
    return;
  }

  container.innerHTML = state.animations.map(anim => {
    const key = `${activeSkin.id}_${anim.id}`;
    const files = state.uploads[key] || [];
    return `
      <div class="group-item">
        <div class="group-header">
          <span style="font-weight:600;color:#333;">${activeSkin.name} - ${anim.name}</span>
        </div>
        <div class="upload-area ${files.length > 0 ? 'has-files' : ''}" onclick="document.getElementById('upload-${key}').click()">
          <input type="file" id="upload-${key}" accept="image/png,image/jpeg" multiple onchange="handleUpload(${activeSkin.id}, ${anim.id}, this.files)">
          <div class="icon">📷</div>
          <div class="text">${files.length > 0 ? `${files.length} 个文件已选择` : '拖放图片到这里或点击上传'}</div>
        </div>
        ${files.length > 0 ? `
          <div class="file-list">
            ${files.map((f, i) => `
              <div class="file-item">
                <span>${i + 1}. ${f.name}</span>
                <span class="remove" onclick="removeFile(${activeSkin.id}, ${anim.id}, ${i})">×</span>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function naturalSort(a, b) {
  return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
}

function gcd(a, b) {
  return b === 0 ? a : gcd(b, a % b);
}

function lcm(a, b) {
  if (a === 0 || b === 0) return 0;
  return (a * b) / gcd(a, b);
}

function lcmList(arr, maxLimit) {
  maxLimit = maxLimit || 200;
  if (arr.length === 0) return 0;
  let result = arr[0];
  for (let i = 1; i < arr.length; i++) {
    result = lcm(result, arr[i]);
    if (result > maxLimit) return maxLimit;
  }
  return result;
}

function handleUpload(skinId, animId, files) {
  const key = `${skinId}_${animId}`;
  state.uploads[key] = Array.from(files).sort(naturalSort);
  renderUploadAreas();
}

function removeFile(skinId, animId, index) {
  const key = `${skinId}_${animId}`;
  if (state.uploads[key]) {
    state.uploads[key].splice(index, 1);
    if (state.uploads[key].length === 0) {
      delete state.uploads[key];
    }
    renderUploadAreas();
  }
}

function loadImageFromFile(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ img, width: img.width, height: img.height });
    img.onerror = () => resolve({ img: null, width: 0, height: 0 });
    img.src = URL.createObjectURL(file);
  });
}

function packImages(imageList, maxWidth) {
  maxWidth = maxWidth || 4096;
  let x = 0, y = 0, rowHeight = 0;
  let maxRowWidth = 0;
  const positions = {};

  for (const item of imageList) {
    if (x + item.width > maxWidth && x > 0) {
      maxRowWidth = Math.max(maxRowWidth, x);
      x = 0;
      y += rowHeight;
      rowHeight = 0;
    }
    positions[item.regionName] = { x: x, y: y, width: item.width, height: item.height };
    x += item.width;
    rowHeight = Math.max(rowHeight, item.height);
  }

  maxRowWidth = Math.max(maxRowWidth, x);
  const finalWidth = Math.max(2, Math.ceil(maxRowWidth / 2) * 2);
  const finalHeight = Math.max(2, Math.ceil((y + rowHeight) / 2) * 2);

  return { positions, width: finalWidth, height: finalHeight };
}

function generateAtlas(positions, canvasWidth, canvasHeight, outputName, version) {
  const isV4 = version.startsWith('4.');
  let lines = [];
  lines.push(`${outputName}.png`);

  if (isV4) {
    lines.push(`\tsize: ${canvasWidth}, ${canvasHeight}`);
    lines.push('\tfilter: Linear, Linear');
    lines.push('\tpma: true');
  } else {
    lines.push(`size: ${canvasWidth},${canvasHeight}`);
    lines.push('format: RGBA8888');
    lines.push('filter: Linear,Linear');
    lines.push('repeat: none');
  }

  for (const [regionName, pos] of Object.entries(positions)) {
    lines.push(regionName);
    if (isV4) {
      lines.push(`\tbounds: ${pos.x}, ${pos.y}, ${pos.width}, ${pos.height}`);
    } else {
      lines.push('  rotate: false');
      lines.push(`  xy: ${pos.x}, ${pos.y}`);
      lines.push(`  size: ${pos.width}, ${pos.height}`);
      lines.push(`  orig: ${pos.width}, ${pos.height}`);
      lines.push('  offset: 0, 0');
      lines.push('  index: -1');
    }
  }

  return lines.join('\n');
}

function generateJSON(allImageData, positions, version, outputName) {
  let maxWidth = 0, maxHeight = 0;
  for (const pos of Object.values(positions)) {
    maxWidth = Math.max(maxWidth, pos.width);
    maxHeight = Math.max(maxHeight, pos.height);
  }

  const isV4 = version.startsWith('4.');

  const skeleton = {
    hash: '0000',
    spine: version,
    x: 0,
    y: 0,
    width: maxWidth,
    height: maxHeight,
    images: './',
    audio: isV4 ? null : ''
  };

  const bones = [{ name: 'root' }];

  const slots = [{
    name: 'body',
    bone: 'root',
    attachment: `${state.animations[0].name}_0`
  }];

  const animFrameCounts = {};
  for (const anim of state.animations) {
    const frameCounts = [];
    for (const skin of state.skins) {
      const key = `${skin.id}_${anim.id}`;
      const frameCount = (state.uploads[key] || []).length;
      if (frameCount > 0) {
        frameCounts.push(frameCount);
      }
    }
    animFrameCounts[anim.id] = lcmList(frameCounts, 200);
  }

  const skins = [];
  for (const skin of state.skins) {
    const skinData = { name: skin.name, attachments: { body: {} } };

    for (const anim of state.animations) {
      const key = `${skin.id}_${anim.id}`;
      const frames = state.uploads[key] || [];
      const actualFrames = frames.length;
      const totalFrames = animFrameCounts[anim.id] || 0;

      if (actualFrames === 0 || totalFrames === 0) continue;

      for (let i = 0; i < totalFrames; i++) {
        const sourceFrame = i % actualFrames;
        const regionName = `${skin.name}_${anim.name}_${sourceFrame}`;
        const pos = positions[regionName];
        if (pos) {
          skinData.attachments.body[`${anim.name}_${i}`] = {
            name: regionName,
            x: 0,
            y: 0,
            rotation: 0,
            width: pos.width,
            height: pos.height
          };
        }
      }
    }

    skins.push(skinData);
  }

  const animations = {};
  for (const anim of state.animations) {
    const frameCount = animFrameCounts[anim.id] || 0;
    if (frameCount === 0) continue;

    const attachmentKeyframes = [];
    for (let i = 0; i < frameCount; i++) {
      const keyframe = { time: parseFloat((i / anim.fps).toFixed(6)), name: `${anim.name}_${i}` };
      if (i < frameCount - 1) keyframe.curve = 'stepped';
      attachmentKeyframes.push(keyframe);
    }

    animations[anim.name] = {
      slots: {
        body: {
          attachment: attachmentKeyframes
        }
      }
    };
  }

  return JSON.stringify({ skeleton, bones, slots, skins, animations }, null, 2);
}

async function generate() {
  const generateBtn = document.getElementById('generate-btn');
  const progress = document.getElementById('progress');
  const resultSection = document.getElementById('result-section');

  generateBtn.disabled = true;
  progress.style.display = 'block';
  resultSection.classList.remove('show');

  try {
    let hasFiles = false;
    for (const skin of state.skins) {
      for (const anim of state.animations) {
        const key = `${skin.id}_${anim.id}`;
        if (state.uploads[key] && state.uploads[key].length > 0) {
          hasFiles = true;
          break;
        }
      }
      if (hasFiles) break;
    }
    if (!hasFiles) {
      alert('请至少上传一张图片');
      return;
    }

    const allImages = [];
    for (const skin of state.skins) {
      for (const anim of state.animations) {
        const key = `${skin.id}_${anim.id}`;
        const files = state.uploads[key] || [];
        for (let i = 0; i < files.length; i++) {
          const regionName = `${skin.name}_${anim.name}_${i}`;
          const loaded = await loadImageFromFile(files[i]);
          if (loaded.img) {
            allImages.push({
              regionName: regionName,
              img: loaded.img,
              width: loaded.width,
              height: loaded.height
            });
          }
        }
      }
    }

    if (allImages.length === 0) {
      alert('没有加载到任何图片');
      return;
    }

    progress.textContent = '正在打包图集...';
    
    let workingImages = allImages.map(img => ({
      ...img,
      currentWidth: img.width,
      currentHeight: img.height
    }));
    
    let positions, canvasWidth, canvasHeight, canvas, ctx;
    let pngBlob;
    const MAX_SIZE_BYTES = 5 * 1024 * 1024;
    let scale = 1;
    
    while (true) {
      const packInput = workingImages.map(img => ({
        regionName: img.regionName,
        width: Math.max(1, Math.round(img.currentWidth * scale)),
        height: Math.max(1, Math.round(img.currentHeight * scale))
      }));
      
      const packResult = packImages(packInput, 4096);
      positions = packResult.positions;
      canvasWidth = packResult.width;
      canvasHeight = packResult.height;
      
      canvas = document.createElement('canvas');
      canvas.width = canvasWidth;
      canvas.height = canvasHeight;
      ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);
      
      for (const item of workingImages) {
        const pos = positions[item.regionName];
        if (pos) {
          ctx.drawImage(
            item.img,
            0, 0, item.width, item.height,
            pos.x, pos.y, pos.width, pos.height
          );
        }
      }
      
      pngBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      
      if (pngBlob.size <= MAX_SIZE_BYTES || scale <= 0.1) {
        break;
      }
      
      scale *= 0.8;
      progress.textContent = `图片过大，正在缩小 (${Math.round(scale * 100)}%)...`;
    }

    const outputName = document.getElementById('output-name').value || 'animation';
    const version = document.getElementById('spine-version').value;
    const atlasText = generateAtlas(positions, canvasWidth, canvasHeight, outputName, version);
    
    const scaledPositions = {};
    for (const [name, pos] of Object.entries(positions)) {
      scaledPositions[name] = { ...pos };
    }
    const jsonText = generateJSON(allImages, scaledPositions, version, outputName);

    state.generatedFiles = {
      json: jsonText,
      atlas: atlasText,
      pngBlob: pngBlob,
      pngUrl: URL.createObjectURL(pngBlob),
      outputName: outputName,
      version: version,
      width: canvasWidth,
      height: canvasHeight,
      scale: scale
    };

    resultSection.classList.add('show');
    initPreview();
    
    progress.style.display = 'block';
    progress.textContent = `生成成功！图集 ${canvasWidth}×${canvasHeight}，PNG大小 ${(pngBlob.size / 1024 / 1024).toFixed(2)}MB${scale < 1 ? `（已缩放至 ${Math.round(scale * 100)}%）` : ''}`;

  } catch (err) {
    console.error(err);
    alert('生成失败: ' + err.message);
  } finally {
    generateBtn.disabled = false;
    progress.style.display = 'none';
  }
}

function initPreview() {
  if (!state.generatedFiles) return;

  const json = JSON.parse(state.generatedFiles.json);
  const canvas = document.getElementById('preview-canvas');
  const ctx = canvas.getContext('2d');

  const maxWidth = 500;
  const maxHeight = 500;
  const scale = Math.min(maxWidth / json.skeleton.width, maxHeight / json.skeleton.height, 2);
  canvas.width = json.skeleton.width * scale;
  canvas.height = json.skeleton.height * scale;

  const img = new Image();
  img.onload = () => {
    const regions = parseAtlasRegions(state.generatedFiles.atlas);

    const skinAttachments = {};
    for (const skin of json.skins) {
      skinAttachments[skin.name] = {};
      for (const [slotName, attachments] of Object.entries(skin.attachments)) {
        for (const [attName, attData] of Object.entries(attachments)) {
          skinAttachments[skin.name][attName] = {
            name: attData.name,
            x: attData.x || 0,
            y: attData.y || 0,
            width: attData.width,
            height: attData.height
          };
        }
      }
    }

    const skinSelect = document.getElementById('preview-skin');
    skinSelect.innerHTML = state.skins.map(s => 
      `<option value="${s.name}">${s.name}</option>`
    ).join('');

    const animSelect = document.getElementById('preview-animation');
    animSelect.innerHTML = Object.keys(json.animations).map(a => 
      `<option value="${a}">${a}</option>`
    ).join('');

    let currentSkin = state.skins[0].name;
    let currentAnim = Object.keys(json.animations)[0] || '';
    let currentFrame = 0;
    let lastTime = performance.now();
    let isPlaying = true;

    const animInfo = {};
    for (const [animName, animData] of Object.entries(json.animations)) {
      if (animData.slots && animData.slots.body && animData.slots.body.attachment) {
        const fps = state.animations.find(a => a.name === animName)?.fps || 15;
        animInfo[animName] = {
          frames: animData.slots.body.attachment.map(kf => kf.name),
          fps: fps,
          interval: 1000 / fps
        };
      }
    }

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    function drawFrame() {
      if (!isPlaying) return;

      const now = performance.now();
      const anim = animInfo[currentAnim];
      if (anim && now - lastTime >= anim.interval) {
        currentFrame = (currentFrame + 1) % anim.frames.length;
        lastTime = now;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (anim) {
        const attName = anim.frames[currentFrame];
        const att = skinAttachments[currentSkin]?.[attName];
        const region = att ? regions[att.name] : null;
        if (region && img && att) {
          const drawX = centerX + att.x * scale - region.width * scale / 2;
          const drawY = centerY - att.y * scale - region.height * scale / 2;
          ctx.drawImage(
            img,
            region.x, region.y, region.width, region.height,
            drawX, drawY,
            region.width * scale, region.height * scale
          );
        }
      }

      requestAnimationFrame(drawFrame);
    }

    drawFrame();

    skinSelect.onchange = (e) => {
      currentSkin = e.target.value;
      currentFrame = 0;
    };

    animSelect.onchange = (e) => {
      currentAnim = e.target.value;
      currentFrame = 0;
      lastTime = performance.now();
    };

    window.togglePreview = () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        lastTime = performance.now();
        drawFrame();
      }
    };

    document.getElementById('preview-info').textContent = 
      `骨架尺寸: ${json.skeleton.width}×${json.skeleton.height} | 预览缩放: ${Math.round(scale * 100)}%`;
  };
  img.src = state.generatedFiles.pngUrl;
}

function parseAtlasRegions(atlasText) {
  const regions = {};
  const lines = atlasText.split('\n');
  let currentRegion = null;

  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;

    if (trimmed.startsWith('size:') || trimmed.startsWith('filter:') || 
        trimmed.startsWith('format:') || trimmed.startsWith('repeat:') ||
        trimmed.startsWith('pma:') || trimmed.startsWith('scale:')) {
      continue;
    }

    if (trimmed.includes('.')) {
      continue;
    }

    if (trimmed.startsWith('bounds:')) {
      if (currentRegion) {
        const parts = trimmed.split(':')[1].split(',').map(p => parseInt(p.trim()));
        regions[currentRegion] = { x: parts[0], y: parts[1], width: parts[2], height: parts[3] };
      }
      currentRegion = null;
    } else if (trimmed.startsWith('xy:')) {
      if (currentRegion) {
        const xyParts = trimmed.split(':')[1].split(',').map(p => parseInt(p.trim()));
        regions[currentRegion] = { x: xyParts[0], y: xyParts[1] };
      }
    } else if (trimmed.startsWith('size:')) {
      if (currentRegion && regions[currentRegion]) {
        const sizeParts = trimmed.split(':')[1].split(',').map(p => parseInt(p.trim()));
        regions[currentRegion].width = sizeParts[0];
        regions[currentRegion].height = sizeParts[1];
      }
    } else {
      currentRegion = trimmed;
    }
  }

  return regions;
}

function downloadFile(content, filename, mimeType) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function downloadJSON() {
  if (!state.generatedFiles) return;
  downloadFile(state.generatedFiles.json, `${state.generatedFiles.outputName}.json`, 'application/json');
}

function downloadAtlas() {
  if (!state.generatedFiles) return;
  downloadFile(state.generatedFiles.atlas, `${state.generatedFiles.outputName}.atlas`, 'text/plain');
}

function downloadPNG() {
  if (!state.generatedFiles) return;
  downloadFile(state.generatedFiles.pngBlob, `${state.generatedFiles.outputName}.png`, 'image/png');
}

async function downloadAll() {
  if (!state.generatedFiles) return;

  try {
    const zip = new JSZip();
    const name = state.generatedFiles.outputName;
    zip.file(`${name}.json`, state.generatedFiles.json);
    zip.file(`${name}.atlas`, state.generatedFiles.atlas);
    zip.file(`${name}.png`, state.generatedFiles.pngBlob);

    const blob = await zip.generateAsync({ type: 'blob' });
    downloadFile(blob, `${name}.zip`, 'application/zip');
  } catch (err) {
    alert('打包失败: ' + err.message);
  }
}

renderSkins();
renderAnimations();
</script>
