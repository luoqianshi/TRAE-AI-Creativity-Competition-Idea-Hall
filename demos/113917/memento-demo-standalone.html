<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>memento 输入法 - 职场防身术</title>
    <style>
:root {
    color-scheme: light;
    --canvas: #f5f4f0;
    --canvas-ink: #272724;
    --surface: #fbfbfa;
    --surface-soft: #f2f1ed;
    --surface-wash: #f8f7f4;
    --line: #e7e4dd;
    --line-strong: #d8d4ca;
    --muted: #75726b;
    --faint: #a5a097;
    --ink: #252522;
    --ink-soft: #44413b;
    --accent-bg: #fbf3db;
    --accent-ink: #72571d;
    --accent-line: #eee1bd;
    --send-bg: #eeede8;
    --shadow-soft: 0 24px 70px rgba(47, 45, 39, 0.08);
    --shadow-low: 0 2px 8px rgba(47, 45, 39, 0.04);
    --radius: 12px;
    --radius-small: 8px;
    --mono: "Geist Mono", "SF Mono", "JetBrains Mono", ui-monospace, monospace;
    --sans: "SF Pro Display", "Geist Sans", "Helvetica Neue", "Switzer", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    background: var(--canvas);
}

body {
    min-height: 100dvh;
    margin: 0;
    overflow: hidden;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--sans);
    letter-spacing: 0;
}

button,
input,
textarea {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
    outline: 2px solid rgba(37, 37, 34, 0.18);
    outline-offset: 2px;
}

.app-container {
    display: grid;
    min-height: 100dvh;
    place-items: center;
    padding: clamp(16px, 3.4vw, 44px);
}

.feishu-mockup {
    position: relative;
    display: flex;
    width: min(1240px, 100%);
    height: min(820px, calc(100dvh - 48px));
    min-height: 640px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow-soft);
    isolation: isolate;
    animation: app-enter 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
    transition:
        box-shadow 420ms cubic-bezier(0.16, 1, 0.3, 1),
        transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
}

.feishu-mockup.ime-open {
    box-shadow: 0 34px 90px rgba(47, 45, 39, 0.12);
    transform: translateY(-6px) scale(1.006);
}

.feishu-mockup::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    left: 0;
    z-index: 40;
    height: 34px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.82);
}

.feishu-mockup::after {
    content: "memento";
    position: absolute;
    top: 10px;
    left: 50%;
    z-index: 41;
    transform: translateX(-50%);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.app-nav,
.sidebar,
.main-chat {
    padding-top: 34px;
}

.app-nav {
    width: 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    padding-right: 0;
    padding-bottom: 16px;
    padding-left: 0;
    border-right: 1px solid var(--line);
    background: #f0eee9;
}

.nav-top,
.nav-bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

.nav-top {
    padding-top: 18px;
}

.nav-avatar,
.nav-icon {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border: 1px solid transparent;
    border-radius: var(--radius-small);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
}

.nav-avatar {
    border-color: var(--line);
    background: #faf9f6;
}

.nav-avatar::before {
    content: "me";
}

.nav-icon:hover,
.nav-icon.active {
    border-color: var(--line);
    background: #ffffff;
    color: var(--ink);
}

.nav-glyph {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
}

.sidebar {
    width: 298px;
    flex-shrink: 0;
    border-right: 1px solid var(--line);
    background: var(--surface-wash);
}

.sidebar-header {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 66px;
    padding: 0 18px;
}

.search-container {
    display: flex;
    align-items: center;
    flex: 1;
    gap: 8px;
    height: 34px;
    border: 1px solid var(--line);
    border-radius: var(--radius-small);
    background: #ffffff;
    padding: 0 10px;
}

.search-container:focus-within {
    border-color: var(--line-strong);
    box-shadow: 0 0 0 3px rgba(47, 45, 39, 0.04);
}

.search-icon,
.add-btn,
.toolbar button,
.header-actions button {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
}

.search-bar {
    width: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font-size: 13px;
}

.search-bar::placeholder,
.chat-input::placeholder {
    color: var(--faint);
}

.add-btn {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border: 1px solid var(--line);
    border-radius: var(--radius-small);
    background: #ffffff;
}

.add-btn:hover {
    background: var(--surface-soft);
    color: var(--ink);
}

.chat-list {
    display: grid;
    gap: 8px;
    padding: 4px 10px 18px;
}

.chat-item {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr);
    align-items: center;
    gap: 12px;
    min-height: 70px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    padding: 10px 12px;
    transition:
        background 180ms ease,
        border-color 180ms ease,
        opacity 260ms ease,
        transform 180ms ease;
}

.chat-item:hover {
    border-color: var(--line);
    background: rgba(255, 255, 255, 0.58);
}

.chat-item.active {
    border-color: var(--line);
    background: #ffffff;
}

.chat-item:active {
    transform: scale(0.99);
}

.chat-avatar,
.msg-avatar {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border: 1px solid var(--line);
    border-radius: var(--radius-small);
    background: var(--surface-soft);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
}

.chat-avatar.progress::before,
.msg-avatar.progress::before {
    content: "排";
}

.chat-avatar.blame::before,
.msg-avatar.blame::before {
    content: "联";
}

.chat-avatar.overtime::before,
.msg-avatar.overtime::before {
    content: "需";
}

.send .msg-avatar::before {
    content: "我";
}

.chat-info {
    min-width: 0;
}

.chat-name-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
}

.chat-name {
    overflow: hidden;
    color: var(--ink);
    font-size: 14px;
    font-weight: 650;
    letter-spacing: -0.01em;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.chat-time,
.chat-preview,
.msg-name,
.send-shortcut-hint {
    color: var(--muted);
    font-size: 12px;
}

.chat-preview {
    overflow: hidden;
    margin-top: 4px;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.main-chat {
    display: flex;
    min-width: 0;
    flex: 1;
    flex-direction: column;
    background: var(--surface);
}

.chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 66px;
    padding: 0 28px;
    border-bottom: 1px solid var(--line);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.chat-title {
    overflow: hidden;
    margin: 0;
    color: var(--ink);
    font-size: 19px;
    font-weight: 720;
    letter-spacing: -0.03em;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.status-dot {
    width: 6px;
    height: 6px;
    flex-shrink: 0;
    border-radius: 50%;
    background: #b7b2a8;
}

.header-actions,
.toolbar-left,
.toolbar-right {
    display: flex;
    align-items: center;
    gap: 7px;
}

.header-actions button,
.toolbar button {
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    padding: 5px 7px;
}

.header-actions button:hover,
.toolbar button:hover {
    border-color: var(--line);
    background: #ffffff;
    color: var(--ink);
}

.message-stream {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 18px;
    overflow-y: auto;
    padding: 36px 36px 30px;
    background: var(--surface);
    transition:
        opacity 320ms cubic-bezier(0.16, 1, 0.3, 1),
        transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
}

.message {
    display: flex;
    max-width: min(690px, 80%);
    gap: 12px;
    transition:
        opacity 360ms cubic-bezier(0.16, 1, 0.3, 1),
        transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
}

.message.receive {
    align-self: flex-start;
}

.message.send {
    align-self: flex-end;
    flex-direction: row-reverse;
}

.message-enter {
    animation: message-enter 560ms cubic-bezier(0.16, 1, 0.3, 1);
}

.msg-avatar {
    width: 30px;
    height: 30px;
    margin-top: 28px;
    flex-shrink: 0;
    font-size: 10px;
}

.msg-content {
    display: flex;
    min-width: 0;
    flex-direction: column;
    gap: 6px;
}

.send .msg-content {
    align-items: flex-end;
}

.msg-name {
    padding: 0 2px;
}

.msg-bubble {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #ffffff;
    padding: 13px 15px;
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.68;
    word-break: break-word;
}

.send .msg-bubble {
    background: var(--send-bg);
}

.input-area {
    position: relative;
    z-index: 30;
    display: flex;
    min-height: 154px;
    flex-direction: column;
    border-top: 1px solid var(--line);
    background: rgba(251, 251, 250, 0.96);
    padding: 14px 28px 18px;
    transition:
        background 360ms cubic-bezier(0.16, 1, 0.3, 1),
        border-color 360ms cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 420ms cubic-bezier(0.16, 1, 0.3, 1),
        transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
}

.feishu-mockup.ime-open .app-nav,
.feishu-mockup.ime-open .sidebar,
.feishu-mockup.ime-open .chat-header {
    opacity: 0.88;
}

.feishu-mockup.ime-open .message-stream {
    transform: translateY(-5px);
}

.feishu-mockup.ime-open .message.receive {
    opacity: 0.88;
    transform: translateY(-5px) scale(0.995);
}

.feishu-mockup.ime-open .input-area {
    border-top-color: rgba(216, 212, 202, 0.8);
    background: rgba(255, 255, 255, 0.84);
    box-shadow: 0 -12px 38px rgba(47, 45, 39, 0.045);
    transform: translateY(-6px);
}

.toolbar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.input-container {
    position: relative;
    flex: 1;
}

.chat-input {
    width: 100%;
    height: 76px;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: var(--ink);
    font-size: 15px;
    line-height: 1.62;
}

.chat-input:focus-visible {
    outline: none;
}

.send-action {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 8px;
}

.send-btn {
    height: 30px;
    border-radius: 6px;
    background: #20201d;
    color: #ffffff;
    padding: 0 16px;
    font-size: 12px;
    font-weight: 650;
    transition:
        background 160ms ease,
        transform 160ms ease;
}

.send-btn:hover {
    background: #37342f;
}

.send-btn:active,
.apply-btn:active {
    transform: scale(0.98);
}

.pulse-hint {
    position: absolute;
    top: 18px;
    left: 0;
    width: 34px;
    height: 34px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 240ms ease;
}

.pulse-hint.active {
    opacity: 1;
}

.pulse-ring {
    position: absolute;
    inset: 0;
    border: 1px solid rgba(37, 37, 34, 0.24);
    border-radius: 50%;
}

.pulse-ring.delay {
    animation-delay: 900ms;
}

.memento-bubble {
    position: absolute;
    bottom: calc(100% + 12px);
    left: 28px;
    z-index: 50;
    width: min(468px, calc(100% - 56px));
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.58);
    outline: 1px solid rgba(47, 45, 39, 0.08);
    border-radius: var(--radius);
    background: rgba(255, 255, 255, 0.58);
    backdrop-filter: blur(14px) saturate(1.08);
    -webkit-backdrop-filter: blur(14px) saturate(1.08);
    box-shadow:
        0 18px 48px rgba(47, 45, 39, 0.09),
        0 2px 8px rgba(47, 45, 39, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.62);
    opacity: 0;
    padding: 14px 16px 12px;
    pointer-events: none;
    transform: translateY(18px) scale(0.96);
    transform-origin: bottom left;
    transition:
        opacity 360ms cubic-bezier(0.16, 1, 0.3, 1),
        transform 520ms cubic-bezier(0.16, 1, 0.3, 1);
}

.memento-bubble::before {
    content: "";
    position: absolute;
    inset: 0;
    border-bottom: 1px solid rgba(47, 45, 39, 0.035);
    background: rgba(251, 251, 250, 0.18);
    pointer-events: none;
}

.memento-bubble.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(-2px) scale(1);
}

.bubble-shimmer {
    display: none;
}

.memory-trace {
    position: absolute;
    top: 0;
    right: 16px;
    left: 16px;
    display: flex;
    align-items: center;
    gap: 0;
    height: 1px;
    pointer-events: none;
}

.trace-line {
    position: absolute;
    inset: 0;
    background: #d9d3c5;
    opacity: 0;
    transform: scaleX(0);
    transform-origin: left;
}

.trace-node {
    position: relative;
    top: -2px;
    width: 5px;
    height: 5px;
    margin-left: 25%;
    border-radius: 50%;
    background: #252522;
    opacity: 0;
    transform: scale(0.4);
}

.memento-bubble.show .trace-line {
    animation: trace-line-in 620ms cubic-bezier(0.16, 1, 0.3, 1) 90ms both;
}

.memento-bubble.show .trace-node {
    animation: trace-node-in 360ms cubic-bezier(0.16, 1, 0.3, 1) both;
}

.memento-bubble.show .trace-node:nth-of-type(2) {
    animation-delay: 260ms;
}

.memento-bubble.show .trace-node:nth-of-type(3) {
    animation-delay: 380ms;
}

.memento-bubble.show .trace-node:nth-of-type(4) {
    animation-delay: 500ms;
}

.bubble-header,
.bubble-content,
.bubble-footer {
    position: relative;
    z-index: 1;
}

.bubble-header {
    display: flex;
    min-height: 46px;
    flex-direction: column;
    gap: 7px;
    margin-bottom: 6px;
}

.memory-tag {
    display: inline-flex;
    align-items: center;
    max-width: 100%;
    gap: 7px;
    border: 1px solid var(--accent-line);
    border-radius: 999px;
    background: var(--accent-bg);
    color: var(--accent-ink);
    opacity: 0;
    padding: 3px 8px;
    transform: translateY(4px);
    transition:
        opacity 220ms ease,
        transform 220ms ease;
}

.memory-tag.show {
    opacity: 1;
    transform: translateY(0);
}

.memory-stack {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.memory-chip {
    display: inline-flex;
    align-items: center;
    height: 21px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(251, 251, 250, 0.56);
    color: var(--muted);
    padding: 0 8px;
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1;
    opacity: 0;
    transform: translateY(8px);
}

.memory-stack.show .memory-chip {
    animation: chip-rise 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
}

.memory-stack.show .memory-chip:nth-child(2) {
    animation-delay: 80ms;
}

.memory-stack.show .memory-chip:nth-child(3) {
    animation-delay: 160ms;
}

.memory-dot {
    width: 6px;
    height: 6px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--accent-ink);
}

.memory-text {
    overflow: hidden;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.3;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.bubble-content {
    min-height: 68px;
    margin-bottom: 10px;
    color: var(--ink);
}

.typewriter-text {
    font-size: 14px;
    line-height: 1.66;
    letter-spacing: -0.005em;
}

.typewriter-text.done::after {
    opacity: 0;
}

.typewriter-text::after {
    content: "";
    display: inline-block;
    width: 1px;
    height: 1em;
    margin-left: 2px;
    transform: translateY(2px);
    background: var(--ink);
}

.bubble-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--line);
    padding-top: 9px;
    opacity: 0;
    transform: translateY(6px);
}

.memento-bubble.show .bubble-footer {
    animation: footer-rise 420ms cubic-bezier(0.16, 1, 0.3, 1) 220ms both;
}

.action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 32px;
    height: 30px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    transition:
        background 160ms ease,
        border-color 160ms ease,
        color 160ms ease,
        opacity 160ms ease,
        transform 160ms ease;
}

.action-btn:hover {
    border-color: var(--line);
    background: rgba(47, 45, 39, 0.04);
    color: var(--ink);
}

.switch-btn {
    font-family: var(--mono);
}

.reset-mark {
    font-size: 11px;
    font-weight: 700;
}

.switch-btn.spinning .reset-mark {
    animation: reset-pop 520ms cubic-bezier(0.16, 1, 0.3, 1);
}

.apply-btn {
    gap: 7px;
    min-width: 78px;
    border-color: #20201d;
    background: #20201d;
    color: #ffffff;
    font-weight: 650;
    opacity: 0;
    pointer-events: none;
    transform: translateY(4px) scale(0.96);
}

.apply-btn.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0) scale(1);
}

.apply-btn:hover {
    border-color: #37342f;
    background: #37342f;
    color: #ffffff;
}

.apply-kbd {
    border: 1px solid rgba(255, 255, 255, 0.34);
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.16);
    color: inherit;
    padding: 2px 6px;
    font-family: var(--mono);
    font-size: 11px;
}

@keyframes message-enter {
    from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes app-enter {
    from {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes trace-line-in {
    0% {
        opacity: 0;
        transform: scaleX(0);
    }

    24% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform: scaleX(1);
    }
}

@keyframes trace-node-in {
    from {
        opacity: 0;
        transform: scale(0.4);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes chip-rise {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes footer-rise {
    from {
        opacity: 0;
        transform: translateY(6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes reset-pop {
    0% {
        transform: scale(0.92);
    }

    50% {
        transform: scale(1.08);
    }

    100% {
        transform: scale(1);
    }
}

@media (prefers-reduced-motion: no-preference) {
    .pulse-ring {
        animation: pulse 1800ms cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
        0% {
            opacity: 0.72;
            transform: scale(0.48);
        }

        100% {
            opacity: 0;
            transform: scale(1.35);
        }
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
    }
}

@media (max-width: 900px) {
    body {
        overflow: auto;
    }

    .app-container {
        align-items: start;
        padding: 14px;
    }

    .feishu-mockup {
        min-height: 680px;
        height: calc(100dvh - 28px);
    }

    .app-nav {
        display: none;
    }

    .sidebar {
        width: 220px;
    }

    .header-actions {
        display: none;
    }
}

@media (max-width: 700px) {
    .feishu-mockup {
        min-height: 720px;
    }

    .sidebar {
        display: none;
    }

    .chat-header,
    .message-stream,
    .input-area {
        padding-right: 18px;
        padding-left: 18px;
    }

    .message {
        max-width: 92%;
    }

    .memento-bubble {
        left: 18px;
        width: calc(100% - 36px);
        padding: 14px;
    }

    .toolbar-right,
    .send-shortcut-hint {
        display: none;
    }
}

    </style>
</head>
<body>
    <div class="app-container">
        <!-- 飞书主界面模拟 -->
        <div class="feishu-mockup" id="feishu-mockup">
            <!-- 1. 最左侧全局导航栏 (App Nav) -->
            <div class="app-nav">
                <div class="nav-top">
                    <div class="nav-avatar"></div>
                    <div class="nav-icon active"><span class="nav-glyph">M</span></div>
                    <div class="nav-icon"><span class="nav-glyph">C</span></div>
                    <div class="nav-icon"><span class="nav-glyph">D</span></div>
                    <div class="nav-icon"><span class="nav-glyph">V</span></div>
                    <div class="nav-icon"><span class="nav-glyph">··</span></div>
                </div>
                <div class="nav-bottom">
                    <div class="nav-icon"><span class="nav-glyph">S</span></div>
                </div>
            </div>

            <!-- 2. 消息列表侧边栏 -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="search-container">
                        <span class="search-icon">/</span>
                        <input type="text" class="search-bar" placeholder="搜索">
                    </div>
                    <button class="add-btn" type="button">+</button>
                </div>
                <div class="chat-list">
                    <div class="chat-item active" data-scenario="0">
                        <div class="chat-avatar progress"></div>
                        <div class="chat-info">
                            <div class="chat-name-row">
                                <span class="chat-name">产品上线推进群</span>
                                <span class="chat-time">14:23</span>
                            </div>
                            <div class="chat-preview">客户那边问上线排期了...</div>
                        </div>
                    </div>
                    <div class="chat-item" data-scenario="1">
                        <div class="chat-avatar blame"></div>
                        <div class="chat-info">
                            <div class="chat-name-row">
                                <span class="chat-name">联调问题排查群</span>
                                <span class="chat-time">11:05</span>
                            </div>
                            <div class="chat-preview">这块页面白屏了...</div>
                        </div>
                    </div>
                    <div class="chat-item" data-scenario="2">
                        <div class="chat-avatar overtime"></div>
                        <div class="chat-info">
                            <div class="chat-name-row">
                                <span class="chat-name">临时需求沟通群</span>
                                <span class="chat-time">18:27</span>
                            </div>
                            <div class="chat-preview">明天一早客户要看...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. 聊天主区域 -->
            <div class="main-chat">
                <!-- 顶部栏 -->
                <div class="chat-header">
                    <div class="header-left">
                        <h1 class="chat-title" id="chat-header-title">产品经理 - 张总</h1>
                        <span class="status-dot"></span>
                    </div>
                    <div class="header-actions">
                        <button type="button">CALL</button>
                        <button type="button">MEET</button>
                        <button type="button">INFO</button>
                    </div>
                </div>

                <!-- 消息流 -->
                <div class="message-stream" id="message-stream">
                    <!-- 消息内容由 JS 动态渲染 -->
                </div>

                <!-- 底部输入区域 -->
                <div class="input-area">
                    <!-- memento 建议气泡 (透明玻璃质感) -->
                    <div class="memento-bubble" id="memento-bubble">
                        <div class="bubble-shimmer"></div>
                        <div class="memory-trace" aria-hidden="true">
                            <span class="trace-line"></span>
                            <span class="trace-node"></span>
                            <span class="trace-node"></span>
                            <span class="trace-node"></span>
                        </div>

                        <div class="bubble-header">
                            <div class="memory-tag" id="memory-tag">
                                <span class="memory-dot" aria-hidden="true"></span>
                                <span id="memory-text" class="memory-text">基于记忆：张三未确认设计口径</span>
                            </div>
                            <div class="memory-stack" id="memory-stack">
                                <span class="memory-chip">昨天同步</span>
                                <span class="memory-chip">设计待确认</span>
                                <span class="memory-chip">返工风险</span>
                            </div>
                        </div>

                        <div class="bubble-content">
                            <div class="typewriter-text" id="typewriter-text">我先把已经明确的 A 部分推进起来。B 部分现在还缺设计确认，如果今天要一起推进，需要先把口径定下来，不然直接做会有返工风险。</div>
                        </div>

                        <div class="bubble-footer">
                            <button class="action-btn switch-btn" id="switch-btn" title="重写回复" aria-label="重写回复">
                                <span class="reset-mark" aria-hidden="true">换</span>
                            </button>
                            <button class="action-btn apply-btn" id="apply-btn">
                                <kbd class="apply-kbd">Tab</kbd>
                                <span>填入</span>
                            </button>
                        </div>
                    </div>

                    <!-- 工具栏 -->
                    <div class="toolbar">
                        <div class="toolbar-left">
                            <button type="button">表情</button>
                            <button type="button">图片</button>
                            <button type="button">文件</button>
                            <button type="button">@</button>
                            <button type="button">快捷</button>
                        </div>
                        <div class="toolbar-right">
                            <button type="button">语音</button>
                        </div>
                    </div>

                    <!-- 相对定位的容器，用于放置气泡 -->
                    <div class="input-container">
                        <!-- 真实输入框 -->
                        <textarea class="chat-input" id="chat-input" placeholder="发送给 产品经理 - 张总"></textarea>
                        
                        <!-- 脉冲提示动画 -->
                        <div class="pulse-hint" id="pulse-hint">
                            <div class="pulse-ring"></div>
                            <div class="pulse-ring delay"></div>
                        </div>
                    </div>
                    
                    <div class="send-action">
                        <span class="send-shortcut-hint">Enter 发送，Shift + Enter 换行</span>
                        <button class="send-btn" id="send-btn">
                            <span>发送</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
// 场景数据配置
const scenarios = [
    {
        id: 0,
        name: "产品上线推进群",
        avatarClass: "progress",
        messages: [
            { type: 'receive', name: '张总', text: '客户那边问上线排期了，这个今天能不能推进一下？他们说有点急，最好今天能给一个明确进展。' }
        ],
        memory: "昨天承诺同步进展 · 张三未确认设计口径",
        evidence: ["昨天承诺", "设计待确认", "返工风险"],
        replies: [
            "我先把已经明确的 A 部分推进起来。B 部分现在还缺设计确认，如果今天要一起推进，需要先把口径定下来，不然直接做会有返工风险。",
            "今天 18:00 前我会同步当前 A 部分的进展。至于 B 部分，麻烦帮忙催一下张三的设计确认？口径对齐后我这边马上就能动。"
        ]
    },
    {
        id: 1,
        name: "联调问题排查群",
        avatarClass: "blame",
        messages: [
            { type: 'receive', name: '李工', text: '这块页面白屏了，是不是你们前端接口数据处理有问题？赶紧修一下。' }
        ],
        memory: "/api/v1/data 接口报 500 · 昨天联调该接口不稳定",
        evidence: ["接口 500", "联调复现", "后端待查"],
        replies: [
            "我刚看了下日志，是 /api/v1/data 接口报了 500 错误。昨天联调时也有类似情况，可能需要后端兄弟先复核一下服务状态，我这边配合验证。",
            "前端查了没改动，日志显示是 /api/v1/data 后端接口挂了。麻烦拉下后端同学看下服务监控？"
        ]
    },
    {
        id: 2,
        name: "临时需求沟通群",
        avatarClass: "overtime",
        messages: [
            { type: 'receive', name: '王总', text: '这个新需求客户明天一早就要看，你今晚加个班把它搞出来吧？' }
        ],
        memory: "当前 Sprint 已满 · 需求未过评审",
        evidence: ["排期已满", "需求未评审", "质量风险"],
        replies: [
            "这个需求还没过评审，直接做风险比较大。我今晚可以先梳理一版粗略的实现方案，明早我们快速过一下，确认没问题了再正式排期开发，你看行吗？",
            "理解客户着急，但当前 Sprint 排期确实满了，强塞会有质量风险。建议明天一早先拉个会过下需求，确认没问题再看怎么插队排期。"
        ]
    }
];

// DOM 元素引用
const elements = {
    chatItems: document.querySelectorAll('.chat-item[data-scenario]'),
    feishuMockup: document.getElementById('feishu-mockup'),
    chatHeaderTitle: document.getElementById('chat-header-title'),
    messageStream: document.getElementById('message-stream'),
    chatInput: document.getElementById('chat-input'),
    mementoBubble: document.getElementById('memento-bubble'),
    memoryTag: document.getElementById('memory-tag'),
    memoryStack: document.getElementById('memory-stack'),
    memoryText: document.getElementById('memory-text'),
    typewriterText: document.getElementById('typewriter-text'),
    switchBtn: document.getElementById('switch-btn'),
    applyBtn: document.getElementById('apply-btn'),
    sendBtn: document.getElementById('send-btn'),
    pulseHint: document.getElementById('pulse-hint')
};

// 状态管理
let state = {
    currentScenario: 0,
    currentReplyIndex: 0,
    isTyping: false,
    typewriterTimeout: null,
    hasInteracted: false
};

// 初始化
function init() {
    renderScenario(0);
    bindEvents();
    
    // 页面加载完成后显示脉冲提示
    setTimeout(() => {
        if (!state.hasInteracted) {
            elements.pulseHint.classList.add('active');
        }
    }, 1500);
}

// 绑定事件
function bindEvents() {
    // 点击不同群聊切换三种职场场景。
    elements.chatItems.forEach(item => {
        item.addEventListener('click', (e) => {
            const scenarioId = Number(e.currentTarget.dataset.scenario);
            renderScenario(scenarioId);
        });
    });

    // 第一次双击唤起弹窗；弹窗已打开时，双击输入框自动重写回复。
    elements.chatInput.addEventListener('dblclick', handleInputDoubleClick);
    
    // 隐藏脉冲提示
    elements.chatInput.addEventListener('focus', () => {
        state.hasInteracted = true;
        elements.pulseHint.classList.remove('active');
    });

    // 换个语气
    elements.switchBtn.addEventListener('click', () => {
        rewriteReply(false);
    });

    // 采纳填入
    elements.applyBtn.addEventListener('click', applyReply);
    
    // 键盘快捷键 (Tab 采纳, Esc 取消)
    document.addEventListener('keydown', (e) => {
        if (!elements.mementoBubble.classList.contains('show')) return;
        
        if (e.key === 'Tab') {
            e.preventDefault(); // 阻止默认的焦点切换
            if (!state.isTyping) applyReply();
        } else if (e.key === 'Escape') {
            hideMemento();
        }
    });

    // 点击外部关闭气泡
    document.addEventListener('click', (e) => {
        if (elements.mementoBubble.classList.contains('show') && 
            !elements.mementoBubble.contains(e.target) && 
            e.target !== elements.chatInput) {
            hideMemento();
        }
    });

    // 发送消息
    elements.sendBtn.addEventListener('click', sendMessage);
    elements.chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !elements.mementoBubble.classList.contains('show')) {
            e.preventDefault();
            sendMessage();
        }
    });
}

// 渲染场景
function renderScenario(id) {
    const scenario = scenarios[id];
    state.currentScenario = id;
    state.currentReplyIndex = 0;
    
    // 隐藏气泡
    hideMemento();
    
    // 清空输入框
    elements.chatInput.value = '';
    
    // 更新头部
    elements.chatHeaderTitle.textContent = scenario.name;
    
    // 更新群聊列表选中态，三个群聊就是三个演示场景。
    elements.chatItems.forEach(item => {
        item.classList.toggle('active', Number(item.dataset.scenario) === id);
    });
    
    elements.chatInput.placeholder = `发送给 ${scenario.name} · 双击唤起 memento`;
    renderEvidence(scenario);

    // 渲染消息流
    elements.messageStream.innerHTML = '';
    scenario.messages.forEach(msg => {
        appendMessage(msg.type, msg.name, msg.text, scenario.avatarClass, true);
    });
}

// 更新记忆依据标签
function renderEvidence(scenario) {
    elements.memoryStack.innerHTML = scenario.evidence
        .map(item => `<span class="memory-chip">${item}</span>`)
        .join('');
}

// 添加消息到聊天流
function appendMessage(type, name, text, avatarClass = 'dev', animated = false) {
    const msgHtml = `
        <div class="message ${type} ${animated ? 'message-enter' : ''}">
            <div class="msg-avatar ${type === 'receive' ? avatarClass : ''}"></div>
            <div class="msg-content">
                <div class="msg-name">${type === 'receive' ? name : '我'}</div>
                <div class="msg-bubble">${text}</div>
            </div>
        </div>
    `;
    elements.messageStream.insertAdjacentHTML('beforeend', msgHtml);
    elements.messageStream.scrollTop = elements.messageStream.scrollHeight;
}

// 输入框双击：首次打开；已打开时自动微调当前回复。
function handleInputDoubleClick() {
    if (elements.mementoBubble.classList.contains('show')) {
        rewriteReply(true);
        return;
    }

    triggerMemento();
}

// 触发 Memento
function triggerMemento() {
    state.hasInteracted = true;
    elements.pulseHint.classList.remove('active');
    
    const scenario = scenarios[state.currentScenario];
    state.currentReplyIndex = 0;
    
    // 重置状态
    elements.typewriterText.textContent = '';
    elements.typewriterText.classList.remove('done');
    elements.memoryTag.classList.remove('show');
    elements.memoryStack.classList.remove('show');
    elements.applyBtn.classList.remove('show');
    
    // 设置记忆文本
    elements.memoryText.textContent = `基于记忆：${scenario.memory}`;
    
    // 显示气泡
    elements.feishuMockup.classList.add('ime-open');
    elements.mementoBubble.classList.add('show');
    
    // 动效序列
    setTimeout(() => {
        elements.memoryTag.classList.add('show');
        elements.memoryStack.classList.add('show');
        
        setTimeout(() => {
            typewriterEffect(scenario.replies[state.currentReplyIndex]);
        }, 600); // 记忆透出停留 0.6s 后开始打字
        
    }, 300); // 气泡弹起 0.3s 后显示记忆
}

// 隐藏 Memento
function hideMemento() {
    elements.feishuMockup.classList.remove('ime-open');
    elements.mementoBubble.classList.remove('show');
    elements.memoryStack.classList.remove('show');
    clearTimeout(state.typewriterTimeout);
    state.isTyping = false;
}

// 重写回复：按钮触发或弹窗打开后的二次双击触发。
function rewriteReply(isAutoTune) {
    if (state.isTyping) return;

    const scenario = scenarios[state.currentScenario];
    if (scenario.replies.length < 2) return;

    state.currentReplyIndex = (state.currentReplyIndex + 1) % scenario.replies.length;
    elements.memoryText.textContent = `${isAutoTune ? '自动微调' : '重新生成'}：${scenario.memory}`;
    elements.applyBtn.classList.remove('show');
    elements.switchBtn.classList.add('spinning');
    setTimeout(() => elements.switchBtn.classList.remove('spinning'), 600);
    typewriterEffect(scenario.replies[state.currentReplyIndex]);
}

// 打字机动效
function typewriterEffect(text, onComplete) {
    state.isTyping = true;
    elements.typewriterText.textContent = '';
    elements.typewriterText.classList.remove('done');
    elements.applyBtn.classList.remove('show');
    
    let i = 0;
    // 稍微带点随机性的打字速度，显得更真实，但整体较快
    function type() {
        if (i < text.length) {
            elements.typewriterText.textContent += text.charAt(i);
            i++;
            const speed = Math.random() * 15 + 15; // 15-30ms 每个字
            state.typewriterTimeout = setTimeout(type, speed);
        } else {
            state.isTyping = false;
            elements.typewriterText.classList.add('done');
            elements.applyBtn.classList.add('show');
            if (typeof onComplete === 'function') {
                onComplete();
            }
        }
    }
    
    clearTimeout(state.typewriterTimeout);
    type();
}

// 采纳回复
function applyReply() {
    const scenario = scenarios[state.currentScenario];
    const text = scenario.replies[state.currentReplyIndex];
    
    hideMemento();
    
    // 模拟真实的填入过程
    elements.chatInput.value = text;
    elements.chatInput.focus();
    
    // 选中最后，方便直接回车发送
    elements.chatInput.setSelectionRange(text.length, text.length);
}

// 发送消息
function sendMessage() {
    const text = elements.chatInput.value.trim();
    if (!text) return;
    
    appendMessage('send', '我', text, '', true);
    elements.chatInput.value = '';
}

// 启动应用
document.addEventListener('DOMContentLoaded', init);

    </script>
