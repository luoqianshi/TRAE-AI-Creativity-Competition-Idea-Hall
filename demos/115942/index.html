<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>逻辑星河 - 跨学科知识推理卡牌游戏</title>
    <style>
        :root {
            --bg-deep: #0a0a1a;
            --bg-card: rgba(255, 255, 255, 0.08);
            --border-card: rgba(255, 255, 255, 0.18);
            --text-main: #f0f2ff;
            --text-dim: #a0a8c8;
            --accent-blue: #4ecdc4;
            --accent-purple: #a855f7;
            --accent-pink: #f472b6;
            --accent-amber: #fbbf24;
            --correct: #34d399;
            --wrong: #f87171;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.96);
        }

        /* Start Screen */
        .logo {
            font-size: clamp(2.5rem, 10vw, 4.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: clamp(1rem, 4vw, 1.25rem);
            color: var(--text-dim);
            margin-bottom: 32px;
            text-align: center;
            max-width: 480px;
            line-height: 1.6;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 420px;
            width: 100%;
            margin-bottom: 32px;
        }

        .feature-item {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            backdrop-filter: blur(12px);
        }

        .feature-item .icon {
            font-size: 1.75rem;
            margin-bottom: 6px;
        }

        .feature-item .label {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: white;
            border: none;
            border-radius: 50px;
            padding: 16px 48px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(78, 205, 196, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(78, 205, 196, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Game Screen */
        #gameScreen {
            justify-content: flex-start;
            padding-top: 16px;
            padding-bottom: 24px;
        }

        .hud {
            width: 100%;
            max-width: 480px;
            margin-bottom: 12px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .streak-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.35);
            color: var(--accent-amber);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .progress-text {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .attrs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .attr {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 10px 12px;
            backdrop-filter: blur(10px);
        }

        .attr-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 6px;
            color: var(--text-dim);
        }

        .attr-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .attr-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s;
        }

        .attr.logic .attr-fill { background: linear-gradient(90deg, #38bdf8, #4ecdc4); }
        .attr.knowledge .attr-fill { background: linear-gradient(90deg, #a855f7, #c084fc); }
        .attr.focus .attr-fill { background: linear-gradient(90deg, #f472b6, #fb7185); }
        .attr.creativity .attr-fill { background: linear-gradient(90deg, #fbbf24, #f59e0b); }

        .card-area {
            flex: 1;
            width: 100%;
            max-width: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 0;
        }

        .card-stack {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            max-height: 520px;
        }

        .card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(165deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04));
            border: 1px solid var(--border-card);
            border-radius: 24px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s linear;
            touch-action: none;
            user-select: none;
        }

        .card.subject-math { border-top: 4px solid #38bdf8; }
        .card.subject-physics { border-top: 4px solid #a855f7; }
        .card.subject-chemistry { border-top: 4px solid #f472b6; }
        .card.subject-history { border-top: 4px solid #fbbf24; }
        .card.subject-geography { border-top: 4px solid #4ade80; }
        .card.subject-chinese { border-top: 4px solid #f87171; }
        .card.subject-english { border-top: 4px solid #60a5fa; }

        .card-badge {
            display: inline-flex;
            align-self: flex-start;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 16px;
        }

        .card-question {
            font-size: clamp(1.1rem, 4.5vw, 1.35rem);
            line-height: 1.6;
            font-weight: 600;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .card-hints {
            display: flex;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 20px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .card-hints span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .choice-overlay {
            position: absolute;
            top: 24px;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1.1rem;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.15s, transform 0.15s;
            border: 2px solid;
        }

        .choice-overlay.left {
            left: 24px;
            color: var(--wrong);
            border-color: var(--wrong);
            background: rgba(248, 113, 113, 0.12);
        }

        .choice-overlay.right {
            right: 24px;
            color: var(--correct);
            border-color: var(--correct);
            background: rgba(52, 211, 153, 0.12);
        }

        .card.swiping-left .choice-overlay.left,
        .card.swiping-right .choice-overlay.right {
            opacity: 1;
            transform: scale(1);
        }

        .controls-hint {
            margin-top: 16px;
            color: var(--text-dim);
            font-size: 0.85rem;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }

        .controls-hint span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Result Screen */
        .result-title {
            font-size: clamp(2rem, 8vw, 3rem);
            font-weight: 800;
            margin-bottom: 8px;
            text-align: center;
        }

        .result-subtitle {
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-bottom: 28px;
            text-align: center;
            max-width: 420px;
        }

        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            margin-bottom: 28px;
            backdrop-filter: blur(12px);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-label {
            color: var(--text-dim);
        }

        .result-value {
            font-weight: 700;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-card);
            border-radius: 50px;
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        @media (max-height: 700px) {
            .card-stack {
                max-height: 420px;
            }
            .card-question {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>

    <!-- Start Screen -->
    <div id="startScreen" class="screen">
        <h1 class="logo">逻辑星河</h1>
        <p class="subtitle">跨学科知识推理卡牌游戏<br>在星辰间滑动，让思维能力自然生长</p>
        <div class="feature-grid">
            <div class="feature-item">
                <div class="icon">🧩</div>
                <div class="label">七大学科</div>
            </div>
            <div class="feature-item">
                <div class="icon">⚡</div>
                <div class="label">左右滑动决策</div>
            </div>
            <div class="feature-item">
                <div class="icon">🚀</div>
                <div class="label">单文件零安装</div>
            </div>
            <div class="feature-item">
                <div class="icon">📱</div>
                <div class="label">手机电脑通用</div>
            </div>
        </div>
        <button class="btn-primary" onclick="startGame()">启动飞船</button>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen hidden">
        <div class="hud">
            <div class="hud-top">
                <div class="streak-badge">
                    <span>🔥</span>
                    <span id="streakText">0 连胜</span>
                </div>
                <div class="progress-text" id="progressText">第 1 / 20 题</div>
            </div>
            <div class="attrs">
                <div class="attr logic">
                    <div class="attr-header"><span>逻辑力</span><span id="logicValue">50</span></div>
                    <div class="attr-bar"><div class="attr-fill" id="logicBar" style="width: 50%"></div></div>
                </div>
                <div class="attr knowledge">
                    <div class="attr-header"><span>知识库</span><span id="knowledgeValue">50</span></div>
                    <div class="attr-bar"><div class="attr-fill" id="knowledgeBar" style="width: 50%"></div></div>
                </div>
                <div class="attr focus">
                    <div class="attr-header"><span>专注力</span><span id="focusValue">50</span></div>
                    <div class="attr-bar"><div class="attr-fill" id="focusBar" style="width: 50%"></div></div>
                </div>
                <div class="attr creativity">
                    <div class="attr-header"><span>创造力</span><span id="creativityValue">50</span></div>
                    <div class="attr-bar"><div class="attr-fill" id="creativityBar" style="width: 50%"></div></div>
                </div>
            </div>
        </div>
        <div class="card-area">
            <div class="card-stack" id="cardStack"></div>
        </div>
        <div class="controls-hint">
            <span>← 左滑</span>
            <span>|</span>
            <span>右滑 →</span>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="screen hidden">
        <h2 class="result-title" id="resultTitle">航程结束</h2>
        <p class="result-subtitle" id="resultSubtitle">你的星河探索成绩如下</p>
        <div class="result-card">
            <div class="result-row">
                <span class="result-label">探索题目</span>
                <span class="result-value" id="resultQuestions">0</span>
            </div>
            <div class="result-row">
                <span class="result-label">最高连胜</span>
                <span class="result-value" id="resultStreak">0</span>
            </div>
            <div class="result-row">
                <span class="result-label">综合评分</span>
                <span class="result-value" id="resultScore">0</span>
            </div>
            <div class="result-row">
                <span class="result-label">获得称号</span>
                <span class="result-value" id="resultRank">-</span>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-primary" onclick="startGame()">再次启航</button>
            <button class="btn-secondary" onclick="showStart()">返回首页</button>
        </div>
    </div>

    <script>
        // ===== 题库数据 =====
        const SUBJECTS = {
            math: { name: '数学', icon: '🔢', cls: 'subject-math' },
            physics: { name: '物理', icon: '⚛️', cls: 'subject-physics' },
            chemistry: { name: '化学', icon: '⚗️', cls: 'subject-chemistry' },
            history: { name: '历史', icon: '🏛️', cls: 'subject-history' },
            geography: { name: '地理', icon: '🌍', cls: 'subject-geography' },
            chinese: { name: '语文', icon: '📜', cls: 'subject-chinese' },
            english: { name: '英语', icon: '🔤', cls: 'subject-english' }
        };

        const QUESTIONS = [
            {
                subject: 'math',
                grade: '高一',
                text: '一艘飞船以恒定速度飞行，若路程一定，速度与时间成反比。当速度提升 25% 时，所用时间将减少多少？',
                left: '20%',
                right: '25%',
                correct: 'left',
                effects: { left: { logic: 8, focus: 3 }, right: { logic: -6, focus: -2 } }
            },
            {
                subject: 'physics',
                grade: '初二',
                text: '在太空中，宇航员感觉“失重”，是因为其受到的地球引力消失了吗？',
                left: '是的，引力消失',
                right: '不是，引力提供向心力',
                correct: 'right',
                effects: { left: { knowledge: -5, logic: -3 }, right: { knowledge: 7, logic: 5 } }
            },
            {
                subject: 'chemistry',
                grade: '初三',
                text: '火箭燃料液氢与液氧反应的产物，对环境最友好的主要生成物是什么？',
                left: '二氧化碳',
                right: '水',
                correct: 'right',
                effects: { left: { knowledge: -6, creativity: -2 }, right: { knowledge: 6, creativity: 3 } }
            },
            {
                subject: 'history',
                grade: '高一',
                text: '中国古代“四大发明”中，哪一项为远洋航行和地理大发现提供了关键技术支持？',
                left: '造纸术',
                right: '指南针',
                correct: 'right',
                effects: { left: { knowledge: -5, focus: -1 }, right: { knowledge: 7, focus: 2 } }
            },
            {
                subject: 'geography',
                grade: '初一',
                text: '地球自转产生的地理现象是以下哪一项？',
                left: '昼夜更替',
                right: '四季变化',
                correct: 'left',
                effects: { left: { knowledge: 6, logic: 3 }, right: { knowledge: -5, logic: -2 } }
            },
            {
                subject: 'chinese',
                grade: '初二',
                text: '“不畏浮云遮望眼，自缘身在最高层”主要表达了诗人怎样的人生态度？',
                left: '登高望远的闲适',
                right: '高瞻远瞩、不畏艰险',
                correct: 'right',
                effects: { left: { knowledge: -4, creativity: -2 }, right: { knowledge: 5, creativity: 4 } }
            },
            {
                subject: 'english',
                grade: '初三',
                text: '“The early bird catches the worm.” 这句谚语的含义最接近下列哪一项？',
                left: '捷足先登',
                right: '早睡早起身体好',
                correct: 'left',
                effects: { left: { knowledge: 6, focus: 3 }, right: { knowledge: -4, focus: -2 } }
            },
            {
                subject: 'math',
                grade: '初二',
                text: '若 a² + b² = c²，则三角形一定是直角三角形。这个命题的逆命题是否成立？',
                left: '成立',
                right: '不成立',
                correct: 'left',
                effects: { left: { logic: 7, knowledge: 4 }, right: { logic: -5, knowledge: -3 } }
            },
            {
                subject: 'physics',
                grade: '初三',
                text: '光在真空中传播的速度约为 3×10⁸ m/s。当光从空气进入水中时，速度会？',
                left: '变小',
                right: '不变',
                correct: 'left',
                effects: { left: { knowledge: 6, logic: 3 }, right: { knowledge: -5, logic: -2 } }
            },
            {
                subject: 'chemistry',
                grade: '高一',
                text: '元素周期表中，同一周期从左到右，原子半径的变化趋势通常是？',
                left: '逐渐增大',
                right: '逐渐减小',
                correct: 'right',
                effects: { left: { knowledge: -5, focus: -2 }, right: { knowledge: 7, focus: 3 } }
            },
            {
                subject: 'history',
                grade: '高二',
                text: '文艺复兴运动最早兴起于意大利，其兴起的根本原因是？',
                left: '古希腊罗马文化的复兴',
                right: '资本主义萌芽的出现',
                correct: 'right',
                effects: { left: { knowledge: -4, logic: -3 }, right: { knowledge: 6, logic: 5 } }
            },
            {
                subject: 'geography',
                grade: '高二',
                text: '暖流对沿岸气候的主要影响是？',
                left: '增温增湿',
                right: '降温减湿',
                correct: 'left',
                effects: { left: { knowledge: 6, logic: 3 }, right: { knowledge: -5, logic: -3 } }
            },
            {
                subject: 'chinese',
                grade: '高一',
                text: '下列句子中，“之”字用作代词的是哪一项？',
                left: '师道之不传也久矣',
                right: '人非生而知之者',
                correct: 'right',
                effects: { left: { knowledge: -5, focus: -2 }, right: { knowledge: 7, focus: 3 } }
            },
            {
                subject: 'english',
                grade: '高一',
                text: '“If I had known the truth, I would have told you.” 这句话表达的是对什么的虚拟？',
                left: '与过去事实相反',
                right: '与现在事实相反',
                correct: 'left',
                effects: { left: { knowledge: 7, logic: 4 }, right: { knowledge: -5, logic: -3 } }
            },
            {
                subject: 'math',
                grade: '初三',
                text: '二次函数 y = ax² + bx + c 的图像开口方向由什么决定？',
                left: 'a 的符号',
                right: 'c 的符号',
                correct: 'left',
                effects: { left: { logic: 6, knowledge: 4 }, right: { logic: -5, knowledge: -3 } }
            },
            {
                subject: 'physics',
                grade: '高一',
                text: '根据牛顿第三定律，作用力与反作用力的关系是？',
                left: '大小相等、方向相反',
                right: '大小不等、方向相反',
                correct: 'left',
                effects: { left: { knowledge: 6, logic: 4 }, right: { knowledge: -5, logic: -3 } }
            },
            {
                subject: 'chemistry',
                grade: '初二',
                text: '空气中含量最多的气体是？',
                left: '氧气',
                right: '氮气',
                correct: 'right',
                effects: { left: { knowledge: -4, focus: -1 }, right: { knowledge: 5, focus: 2 } }
            },
            {
                subject: 'history',
                grade: '初三',
                text: '标志着中国新民主主义革命开端的历史事件是？',
                left: '辛亥革命',
                right: '五四运动',
                correct: 'right',
                effects: { left: { knowledge: -5, focus: -2 }, right: { knowledge: 7, focus: 3 } }
            },
            {
                subject: 'geography',
                grade: '初三',
                text: '我国水资源空间分布的主要特征是？',
                left: '南多北少，东多西少',
                right: '北多南少，西多东少',
                correct: 'left',
                effects: { left: { knowledge: 6, creativity: 2 }, right: { knowledge: -5, creativity: -2 } }
            },
            {
                subject: 'chinese',
                grade: '高三',
                text: '“文章合为时而著，歌诗合为事而作”是哪位诗人提出的文学主张？',
                left: '白居易',
                right: '韩愈',
                correct: 'left',
                effects: { left: { knowledge: 7, creativity: 3 }, right: { knowledge: -5, creativity: -2 } }
            },
            {
                subject: 'english',
                grade: '高二',
                text: '“It is no use crying over spilt milk.” 最接近的中文意思是？',
                left: '覆水难收',
                right: '牛奶洒了别哭',
                correct: 'left',
                effects: { left: { knowledge: 6, logic: 4 }, right: { knowledge: -3, logic: -2 } }
            },
            {
                subject: 'math',
                grade: '高二',
                text: '若等差数列的前 n 项和为 Sₙ = n² + 2n，则该数列的公差为？',
                left: '2',
                right: '4',
                correct: 'right',
                effects: { left: { logic: -5, focus: -2 }, right: { logic: 7, focus: 3 } }
            },
            {
                subject: 'physics',
                grade: '高二',
                text: '根据楞次定律，感应电流的磁场方向总是？',
                left: '阻碍引起感应电流的磁通量变化',
                right: '与引起感应电流的磁场方向相同',
                correct: 'left',
                effects: { left: { knowledge: 7, logic: 5 }, right: { knowledge: -5, logic: -3 } }
            },
            {
                subject: 'chemistry',
                grade: '高三',
                text: '在可逆反应中，升高温度会使平衡向哪一方向移动？',
                left: '吸热方向',
                right: '放热方向',
                correct: 'left',
                effects: { left: { knowledge: 7, logic: 4 }, right: { knowledge: -5, logic: -3 } }
            }
        ];

        // ===== 游戏状态 =====
        let state = {
            attrs: { logic: 50, knowledge: 50, focus: 50, creativity: 50 },
            streak: 0,
            maxStreak: 0,
            questionIndex: 0,
            deck: [],
            answered: 0,
            correctCount: 0
        };

        // ===== 星空背景 =====
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function initStars() {
            stars = [];
            const count = Math.floor((canvas.width * canvas.height) / 3000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.5 + 0.3,
                    alpha: Math.random(),
                    speed: Math.random() * 0.5 + 0.1
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.alpha += star.speed * 0.02;
                const a = 0.3 + 0.7 * Math.abs(Math.sin(star.alpha));
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
                ctx.fill();
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', () => { resizeCanvas(); initStars(); });
        resizeCanvas();
        initStars();
        drawStars();

        // ===== 工具函数 =====
        function shuffle(array) {
            const a = [...array];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function clamp(val, min, max) {
            return Math.max(min, Math.min(max, val));
        }

        function updateHUD() {
            const attrs = ['logic', 'knowledge', 'focus', 'creativity'];
            attrs.forEach(attr => {
                const val = clamp(state.attrs[attr], 0, 100);
                document.getElementById(`${attr}Value`).textContent = Math.round(val);
                document.getElementById(`${attr}Bar`).style.width = `${val}%`;
            });
            document.getElementById('streakText').textContent = `${state.streak} 连胜`;
            document.getElementById('progressText').textContent = `第 ${Math.min(state.questionIndex + 1, state.deck.length)} / ${state.deck.length} 题`;
        }

        function checkGameOver() {
            const attrs = state.attrs;
            for (const key in attrs) {
                if (attrs[key] <= 0) return { over: true, reason: 'attrZero', attr: key };
                if (attrs[key] >= 100) return { over: true, reason: 'attrMax', attr: key };
            }
            if (state.questionIndex >= state.deck.length) return { over: true, reason: 'complete' };
            return { over: false };
        }

        function getRank(score) {
            if (score >= 95) return '星河领主';
            if (score >= 85) return '星际领航员';
            if (score >= 70) return '知识探险家';
            if (score >= 55) return '见习宇航员';
            return '地面观察员';
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function showStart() {
            showScreen('startScreen');
        }

        // ===== 卡牌渲染与交互 =====
        function createCardElement(question) {
            const el = document.createElement('div');
            el.className = `card ${SUBJECTS[question.subject].cls}`;
            el.innerHTML = `
                <div class="card-badge">
                    <span>${SUBJECTS[question.subject].icon}</span>
                    <span>${SUBJECTS[question.subject].name} · ${question.grade}</span>
                </div>
                <div class="card-question">${question.text}</div>
                <div class="choice-overlay left">${question.left}</div>
                <div class="choice-overlay right">${question.right}</div>
                <div class="card-hints">
                    <span>← ${question.left}</span>
                    <span>${question.right} →</span>
                </div>
            `;
            return el;
        }

        function renderNextCard() {
            const stack = document.getElementById('cardStack');
            stack.innerHTML = '';
            if (state.questionIndex >= state.deck.length) return;

            const card = createCardElement(state.deck[state.questionIndex]);
            stack.appendChild(card);
            enableSwipe(card);
            updateHUD();
        }

        function applyEffects(effects, isCorrect) {
            for (const [attr, delta] of Object.entries(effects)) {
                state.attrs[attr] = clamp(state.attrs[attr] + delta, 0, 100);
            }
            if (isCorrect) {
                state.streak++;
                state.correctCount++;
                if (state.streak > state.maxStreak) state.maxStreak = state.streak;
            } else {
                state.streak = 0;
            }
            state.answered++;
            state.questionIndex++;
        }

        function endGame(overInfo) {
            const avg = (state.attrs.logic + state.attrs.knowledge + state.attrs.focus + state.attrs.creativity) / 4;
            const accuracy = state.answered > 0 ? (state.correctCount / state.answered) : 0;
            const score = Math.round(avg * 0.5 + accuracy * 40 + state.maxStreak * 1.5);
            const finalScore = clamp(score, 0, 100);

            document.getElementById('resultQuestions').textContent = state.answered;
            document.getElementById('resultStreak').textContent = state.maxStreak;
            document.getElementById('resultScore').textContent = finalScore;
            document.getElementById('resultRank').textContent = getRank(finalScore);

            let title, subtitle;
            if (overInfo.reason === 'attrZero') {
                const names = { logic: '逻辑力', knowledge: '知识库', focus: '专注力', creativity: '创造力' };
                title = '能量耗尽';
                subtitle = `${names[overInfo.attr]} 降至 0，飞船需要返航补给。`;
            } else if (overInfo.reason === 'attrMax') {
                title = '能量过载';
                subtitle = '某项属性突破极限，系统进入保护模式。';
            } else {
                title = '航程完成';
                subtitle = '你已完成本次星河探索，表现令人印象深刻。';
            }
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultSubtitle').textContent = subtitle;

            setTimeout(() => showScreen('resultScreen'), 400);
        }

        function enableSwipe(card) {
            let startX = 0;
            let startY = 0;
            let currentX = 0;
            let isDragging = false;

            function onStart(e) {
                isDragging = true;
                startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                card.style.transition = 'none';
            }

            function onMove(e) {
                if (!isDragging) return;
                const x = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const y = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                currentX = x - startX;
                const rotate = currentX * 0.06;
                card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;

                card.classList.remove('swiping-left', 'swiping-right');
                if (currentX < -40) card.classList.add('swiping-left');
                if (currentX > 40) card.classList.add('swiping-right');
            }

            function onEnd() {
                if (!isDragging) return;
                isDragging = false;
                card.style.transition = 'transform 0.3s ease';

                const threshold = 100;
                const question = state.deck[state.questionIndex];

                if (currentX < -threshold) {
                    // 左滑
                    const isCorrect = question.correct === 'left';
                    card.style.transform = 'translateX(-120%) rotate(-20deg)';
                    applyEffects(question.effects.left, isCorrect);
                    setTimeout(() => {
                        const over = checkGameOver();
                        if (over.over) endGame(over);
                        else renderNextCard();
                    }, 300);
                } else if (currentX > threshold) {
                    // 右滑
                    const isCorrect = question.correct === 'right';
                    card.style.transform = 'translateX(120%) rotate(20deg)';
                    applyEffects(question.effects.right, isCorrect);
                    setTimeout(() => {
                        const over = checkGameOver();
                        if (over.over) endGame(over);
                        else renderNextCard();
                    }, 300);
                } else {
                    card.style.transform = 'translateX(0) rotate(0)';
                    card.classList.remove('swiping-left', 'swiping-right');
                }
                currentX = 0;
            }

            card.addEventListener('mousedown', onStart);
            card.addEventListener('touchstart', onStart, { passive: true });
            document.addEventListener('mousemove', onMove);
            document.addEventListener('touchmove', onMove, { passive: true });
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchend', onEnd);

            // 键盘控制
            document.onkeydown = (e) => {
                if (document.getElementById('gameScreen').classList.contains('hidden')) return;
                if (e.key === 'ArrowLeft') {
                    card.style.transition = 'transform 0.3s ease';
                    card.style.transform = 'translateX(-120%) rotate(-20deg)';
                    const isCorrect = question.correct === 'left';
                    applyEffects(question.effects.left, isCorrect);
                    setTimeout(() => {
                        const over = checkGameOver();
                        if (over.over) endGame(over);
                        else renderNextCard();
                    }, 300);
                } else if (e.key === 'ArrowRight') {
                    card.style.transition = 'transform 0.3s ease';
                    card.style.transform = 'translateX(120%) rotate(20deg)';
                    const isCorrect = question.correct === 'right';
                    applyEffects(question.effects.right, isCorrect);
                    setTimeout(() => {
                        const over = checkGameOver();
                        if (over.over) endGame(over);
                        else renderNextCard();
                    }, 300);
                }
            };
        }

        function startGame() {
            state = {
                attrs: { logic: 50, knowledge: 50, focus: 50, creativity: 50 },
                streak: 0,
                maxStreak: 0,
                questionIndex: 0,
                deck: shuffle(QUESTIONS).slice(0, 15),
                answered: 0,
                correctCount: 0
            };
            showScreen('gameScreen');
            renderNextCard();
        }
    </script>
</body>
</html>
