<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>祥源OTA工作台</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --line: #e7eaf0;
      --muted: #687487;
      --text: #172033;
      --soft: #f8fafc;
      --brand: #ff8a00;
      --brand-strong: #e36f00;
      --brand-weak: #fff1dc;
      --brand-tint: #fff8ed;
      --accent: #ffb12d;
      --ok: #1fb86a;
      --warn: #f59f00;
      --danger: #f04438;
      --blue: #2563eb;
      --shadow: 0 12px 28px rgba(31, 41, 55, .08);
      font-family: Inter, "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-size: 14px;
    }

    button, input, select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      border-radius: 7px;
      transition: .15s ease;
      white-space: nowrap;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .48;
    }

    .app {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      background: #fff;
      border-right: 1px solid var(--line);
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 6px 14px;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: block;
      object-fit: contain;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(255, 138, 0, .16);
    }

    .brand strong {
      display: block;
      font-size: 16px;
      color: #1f2937;
    }

    .brand small {
      color: var(--muted);
      font-size: 12px;
    }

    .nav-title {
      margin: 16px 8px 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .nav-btn {
      width: 100%;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #344056;
      background: transparent;
      padding: 0 12px;
      text-align: left;
    }

    .nav-btn:hover { background: var(--soft); }
    .nav-btn.active {
      color: var(--brand);
      background: var(--brand-weak);
      font-weight: 700;
    }

    .nav-icon {
      width: 18px;
      text-align: center;
      font-size: 14px;
    }

    .user-card {
      margin-top: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }

    .user-card small {
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }

    .logout {
      margin-top: 10px;
      width: 100%;
      height: 32px;
      background: var(--soft);
      color: #344056;
    }

    .main {
      min-width: 0;
      padding: 22px 26px 32px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    .topbar p {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 34px;
      padding: 0 13px;
      background: #fff;
      color: #344056;
      border: 1px solid var(--line);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--brand), var(--accent));
      border-color: transparent;
      color: white;
      box-shadow: 0 8px 18px rgba(255, 138, 0, .2);
    }

    .btn.primary:hover {
      background: linear-gradient(135deg, var(--brand-strong), #f59f00);
      box-shadow: 0 10px 22px rgba(255, 138, 0, .24);
    }

    .btn.danger {
      background: #fff3f1;
      border-color: #ffd3cd;
      color: var(--danger);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(6, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-height: 78px;
    }

    .stat-card span {
      color: var(--muted);
      font-size: 12px;
    }

    .stat-card strong {
      display: block;
      margin-top: 8px;
      font-size: 20px;
    }

    .layout-grid {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel.pad { padding: 16px; }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .panel-head small {
      color: var(--muted);
    }

    .filters {
      display: grid;
      gap: 12px;
    }

    .field label {
      display: block;
      color: #3c465c;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .field input, .field select {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 7px;
      padding: 0 10px;
      color: var(--text);
      outline: none;
    }

    .field input:focus, .field select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(255, 138, 0, .16);
    }

    .field textarea {
      width: 100%;
      min-height: 72px;
      resize: vertical;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 7px;
      padding: 9px 10px;
      color: var(--text);
      outline: none;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .notice {
      border: 1px solid #cfe0ff;
      background: #f2f6ff;
      color: #27406f;
      border-radius: 8px;
      padding: 12px;
      line-height: 1.7;
    }

    .muted-text {
      color: var(--muted);
      line-height: 1.7;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      min-height: 30px;
      padding: 0 10px;
      background: var(--soft);
      border: 1px solid var(--line);
      color: #445066;
    }

    .chip.active {
      background: var(--brand-weak);
      color: var(--brand);
      border-color: #cfcaff;
      font-weight: 700;
    }

    .venue-list {
      display: grid;
      gap: 8px;
      margin-top: 4px;
    }

    .venue {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 7px;
      padding: 11px;
      cursor: pointer;
    }

    .venue.active {
      border-color: #cbc7ff;
      background: var(--brand-weak);
    }

    .venue strong {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
    }

    .venue span {
      color: var(--muted);
      font-size: 12px;
      display: block;
      margin-top: 4px;
    }

    .product-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 130px 120px 140px;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }

    .product-list {
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .product-card {
      border: 1px solid var(--line);
      border-left: 4px solid var(--ok);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .product-card.dirty {
      border-left-color: var(--warn);
      box-shadow: 0 0 0 3px rgba(245, 159, 0, .12);
    }

    .product-card.failed { border-left-color: var(--danger); }

    .product-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      padding: 14px 16px;
      background: #fff;
    }

    .product-title {
      margin: 0 0 6px;
      font-size: 15px;
      line-height: 1.35;
    }

    .product-meta {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 700;
    }

    .status.ok { color: #0f8a4b; background: #eaf8f1; }
    .status.pending { color: #956000; background: #fff5d6; }
    .status.failed { color: #ba1a1a; background: #ffe8e5; }
    .status.review { color: #3154c9; background: #e9eeff; }
    .status.offline { color: #667085; background: #eef1f6; }

    .product-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-content: start;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      vertical-align: middle;
      font-size: 13px;
    }

    th {
      color: var(--muted);
      background: #fbfcff;
      font-size: 12px;
      font-weight: 800;
    }

    .price {
      color: var(--danger);
      font-weight: 800;
    }

    .suggest {
      color: #1d4ed8;
      font-weight: 800;
    }

    .stock.low {
      color: var(--warn);
      font-weight: 800;
    }

    .inline-input {
      width: 74px;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
    }

    .bulk-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcff;
      flex-wrap: wrap;
    }

    .bulk-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .bulk-tools input, .bulk-tools select {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 9px;
      max-width: 128px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 16px;
    }

    .mini-list {
      display: grid;
      gap: 10px;
      padding: 16px;
    }

    .mini-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .mini-item small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .table-wrap {
      overflow: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .product-filter-bar {
      display: grid;
      grid-template-columns: minmax(260px, 1.3fr) 180px 150px 170px 150px;
      gap: 10px;
      padding: 14px 16px;
      background: #fff;
      align-items: center;
    }

    .product-result-overview {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 10px;
      padding: 14px 16px;
      background: linear-gradient(180deg, #fffaf2, #fff);
    }

    .result-metric {
      min-height: 58px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcff;
    }

    .result-metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .result-metric strong {
      color: var(--ink);
      font-size: 20px;
      line-height: 1.1;
    }

    .ai-scope-box {
      display: grid;
      gap: 10px;
      background: #fff;
    }

    .product-workflow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
      padding: 16px;
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .section-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .section-card-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcff;
    }

    .section-card-head h3 {
      margin: 0;
      font-size: 15px;
    }

    .section-card-head small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
    }

    .section-card-body {
      padding: 14px 16px;
    }

    .product-list-section {
      margin-top: 12px;
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .ai-scope-row {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto auto;
      gap: 10px;
      align-items: center;
    }

    .ai-scope-input {
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 12px;
      outline: none;
      background: #fbfcff;
    }

    .ai-scope-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(255, 138, 0, .16);
      background: #fff;
    }

    .ai-scope-result {
      display: grid;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid #ffe2b7;
      border-radius: 8px;
      background: var(--brand-tint);
      color: #6f4307;
    }

    .ai-scope-result strong {
      color: #14233f;
    }

    .ai-token-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ai-token {
      display: inline-flex;
      min-height: 24px;
      align-items: center;
      padding: 0 8px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid #ffe0ad;
      color: #70440a;
      font-size: 12px;
      font-weight: 700;
    }

    .ai-scope-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .ai-selection-grid {
      display: grid;
      gap: 8px;
      max-height: 360px;
      overflow: auto;
      padding-right: 4px;
    }

    .ai-selection-item {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      padding: 8px 10px;
      border: 1px solid #d9e2f4;
      border-radius: 7px;
      background: #fff;
    }

    .ai-selection-item input {
      margin-top: 3px;
    }

    .ai-selection-item strong {
      display: block;
      color: #17233d;
      line-height: 1.4;
    }

    .ai-selection-item small {
      display: block;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.45;
    }

    .ai-selection-group {
      display: grid;
      gap: 6px;
    }

    .ai-selection-group h4 {
      margin: 4px 0 0;
      font-size: 13px;
      color: #22304c;
    }

    .ai-match-row {
      background: #fffaf0;
    }

    .ai-match-row td {
      box-shadow: inset 3px 0 0 #f59f00;
    }

    .ai-match-sku {
      background: #fff8e8;
    }

    .product-table {
      border-collapse: separate;
      border-spacing: 0;
      min-width: 1180px;
    }

    .product-table thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f8faff;
      border-top: 0;
      border-bottom: 1px solid var(--line);
      color: #536078;
    }

    .product-table tbody tr {
      transition: background .12s ease;
    }

    .product-table tbody tr:hover {
      background: #fbfdff;
    }

    .product-table td {
      border-top: 0;
      border-bottom: 1px solid #edf0f6;
      padding-top: 9px;
      padding-bottom: 9px;
    }

    .product-name-cell {
      min-width: 320px;
      max-width: 520px;
      line-height: 1.55;
      font-weight: 700;
      color: #1d273b;
    }

    .id-badge {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 6px;
      background: #f1f4fa;
      color: #334155;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .resource-count {
      font-weight: 800;
      color: #1d4ed8;
      font-variant-numeric: tabular-nums;
    }

    .subtle-cell {
      color: #526078;
      max-width: 240px;
      line-height: 1.45;
    }

    .task-detail-row td {
      background: #fffaf2;
      padding: 0;
    }

    .task-detail-panel {
      padding: 12px 14px 16px;
      border-top: 1px solid #ffe0ad;
      display: grid;
      gap: 10px;
    }

    .task-detail-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      color: #445066;
      font-size: 12px;
    }

    .task-detail-table {
      min-width: 980px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .task-detail-table th,
    .task-detail-table td {
      padding: 8px 10px;
      font-size: 12px;
    }

    .task-detail-table td {
      vertical-align: top;
    }

    .sku-summary {
      display: grid;
      gap: 3px;
      font-size: 12px;
      color: var(--muted);
      min-width: 120px;
    }

    .sku-summary strong {
      color: #1d273b;
      font-size: 13px;
    }

    .price-stock-cell {
      display: flex;
      width: 150px;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: #526078;
      line-height: 1.35;
    }

    .price-stock-cell strong {
      color: #14233f;
      font-size: 13px;
      width: 100%;
    }

    .price-stock-cell span {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      background: #f6f8fc;
      color: #526078;
      white-space: nowrap;
    }

    .price-stock-cell .range {
      width: 100%;
      justify-content: flex-start;
      border-radius: 6px;
      background: #fff7ed;
      color: #8a4f07;
    }

    .price-stock-cell .price {
      color: #0f766e;
      background: #ecfdf5;
    }

    .price-stock-cell.muted {
      color: #8a94a8;
    }

    .price-stock-cell.warn strong {
      color: #b42318;
    }

    .list-truncation {
      padding: 14px 16px;
      text-align: center;
      color: var(--muted);
      background: #fffaf2;
      border: 1px dashed #ffd59a;
      border-radius: 8px;
      margin: 10px;
    }

    .sku-detail-row td {
      background: #f8fafc;
      padding: 0;
    }

    .sku-detail {
      padding: 12px 18px 16px 86px;
      border-bottom: 1px solid #e8edf5;
    }

    .sku-mini-table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .sku-mini-table th,
    .sku-mini-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #eef2f7;
      text-align: left;
      font-size: 12px;
      white-space: nowrap;
    }

    .sku-mini-table th {
      color: #64748b;
      background: #f8fafc;
    }

    .sku-mini-table tr:last-child td {
      border-bottom: 0;
    }

    .price-stock-detail {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid #ffe0ad;
      border-radius: 8px;
      background: #fffaf2;
    }

    .price-stock-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: #526078;
      font-size: 12px;
    }

    .price-stock-title strong {
      color: #14233f;
      font-size: 14px;
    }

    .price-stock-resource-grid {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .resource-chip {
      display: grid;
      gap: 3px;
      padding: 8px 10px;
      border: 1px solid #ffe0ad;
      border-radius: 7px;
      background: #fff;
      min-width: 220px;
      text-align: left;
      cursor: pointer;
      color: inherit;
      font: inherit;
    }

    .resource-chip.active {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(255, 138, 0, .12);
    }

    .resource-chip strong,
    .resource-chip span,
    .resource-chip small {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .resource-chip strong {
      color: #14233f;
      font-variant-numeric: tabular-nums;
    }

    .resource-chip span,
    .resource-chip small {
      color: #64748b;
      font-size: 12px;
    }

    .table-scroll {
      max-height: 360px;
      overflow: auto;
      border-radius: 8px;
    }

    .price-stock-table {
      min-width: 980px;
    }

    .price-calendar-shell {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .price-calendar-shell::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 54px;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(255,255,255,0), #fff);
    }

    .price-calendar-track {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px;
      scroll-snap-type: x proximity;
    }

    .price-day-card {
      flex: 0 0 112px;
      min-height: 132px;
      display: grid;
      align-content: start;
      gap: 6px;
      padding: 10px;
      border: 1px solid #dbe7f5;
      border-top: 3px solid #21a67a;
      border-radius: 8px;
      background: #fbfffd;
      scroll-snap-align: start;
    }

    .price-day-card.closed {
      border-top-color: #d92d20;
      background: #fff8f7;
    }

    .price-day-card .date {
      font-weight: 800;
      color: #14233f;
      font-variant-numeric: tabular-nums;
    }

    .price-day-card .weekday {
      color: #64748b;
      font-size: 12px;
    }

    .price-day-card .sale {
      width: fit-content;
      padding: 2px 7px;
      border-radius: 999px;
      background: #e9f8f1;
      color: #087443;
      font-size: 12px;
      font-weight: 800;
    }

    .price-day-card.closed .sale {
      background: #fee4e2;
      color: #b42318;
    }

    .price-day-card small {
      color: #526078;
      line-height: 1.35;
    }

    .price-filter-bar {
      display: grid;
      grid-template-columns: minmax(260px, 1.4fr) 160px 150px 170px auto;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fbfcff, #fff);
      align-items: center;
    }

    .price-workbench {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
      padding: 16px;
      align-items: start;
    }

    .price-table {
      min-width: 980px;
      border-collapse: separate;
      border-spacing: 0;
    }

    .price-table th {
      border-top: 0;
      border-bottom: 1px solid var(--line);
      background: #f8faff;
    }

    .price-table td {
      border-top: 0;
      border-bottom: 1px solid #edf0f6;
    }

    .preview-box {
      margin-top: 10px;
      border: 1px solid #dbe7ff;
      border-radius: 8px;
      background: #f8fbff;
      overflow: hidden;
    }

    .preview-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #e4edff;
      color: #173b5f;
      font-size: 12px;
    }

    .mini-table-wrap {
      max-height: 360px;
      overflow: auto;
      background: #fff;
    }

    .mini-table {
      width: 100%;
      min-width: 840px;
      border-collapse: collapse;
      font-size: 12px;
    }

    .mini-table th,
    .mini-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #edf2f7;
      text-align: left;
      vertical-align: top;
    }

    .mini-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f8fafc;
      color: #64748b;
    }

    .notice.warn {
      margin: 10px 12px;
      border-color: #fed7aa;
      background: #fff7ed;
      color: #9a3412;
    }

    .product-check {
      width: 18px;
      height: 18px;
      accent-color: var(--brand);
    }

    .selection-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcff;
      flex-wrap: wrap;
    }

    .selection-strip strong {
      font-size: 13px;
    }

    .metric-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .metric-pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
    }

    .operation-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .operation-panel header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcff;
    }

    .operation-panel header h3 {
      margin: 0;
      font-size: 15px;
    }

    .operation-panel header small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .op-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 10px;
    }

    .op-section:last-child {
      border-bottom: 0;
    }

    .op-section-title {
      font-size: 12px;
      font-weight: 800;
      color: #3c465c;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .helper-text {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }

    .op-submit {
      width: 100%;
      height: 38px;
    }

    .progress-track {
      width: 150px;
      height: 8px;
      border-radius: 999px;
      background: #edf0f6;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-fill {
      height: 100%;
      width: var(--progress, 0%);
      background: linear-gradient(90deg, var(--brand), var(--accent));
    }

    .empty {
      padding: 42px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty strong {
      display: block;
      color: var(--text);
      font-size: 16px;
      margin-bottom: 8px;
    }

    .empty .btn {
      margin-top: 16px;
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(18, 25, 38, .42);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 20;
    }

    .modal-mask.active {
      display: flex;
    }

    .modal {
      width: min(560px, 100%);
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, .22);
      overflow: hidden;
    }

    .modal.preview-modal {
      width: min(1040px, 96vw);
    }

    .modal h3 {
      margin: 0;
      padding: 16px;
      border-bottom: 1px solid var(--line);
      font-size: 16px;
    }

    .modal-body {
      padding: 16px;
      color: #3c465c;
      line-height: 1.7;
      max-height: 72vh;
      overflow: auto;
    }

    .preview-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .preview-summary .result-metric {
      min-height: 54px;
      background: #fffaf2;
    }

    .preview-delta.up {
      color: #dc2626;
      font-weight: 800;
    }

    .preview-delta.down {
      color: #16a34a;
      font-weight: 800;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid var(--line);
      background: #fbfcff;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #121926;
      color: #fff;
      border-radius: 8px;
      padding: 12px 14px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: .2s ease;
      z-index: 30;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .traffic-account-panel {
      margin-top: 18px;
      box-shadow: none;
      border-color: var(--line);
    }

    .traffic-shell {
      padding: 18px;
      background: linear-gradient(180deg, #fbfdff 0%, #ffffff 100%);
    }

    .traffic-console {
      display: grid;
      gap: 18px;
    }

    .traffic-hero-panel {
      display: grid;
      grid-template-columns: minmax(300px, 0.8fr) minmax(420px, 1.5fr);
      gap: 28px;
      align-items: center;
      padding: 28px 32px;
      border: 1px solid #dbeafe;
      border-radius: 12px;
      background: linear-gradient(135deg, #ffffff 0%, #f4fbff 48%, #fff7e8 100%);
    }

    .traffic-hero-panel h2 {
      font-size: 34px;
      line-height: 1.1;
      margin: 8px 0;
    }

    .traffic-hero-panel p,
    .traffic-mini-title {
      color: var(--muted);
      margin: 0;
    }

    .eyebrow {
      color: var(--brand-strong);
      font-weight: 700;
      font-size: 13px;
    }

    .traffic-hero-chart {
      min-height: 126px;
      display: flex;
      align-items: center;
      padding: 8px 0;
    }

    .traffic-kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 14px;
    }

    .traffic-analysis-grid {
      display: grid;
      grid-template-columns: minmax(360px, 0.95fr) minmax(460px, 1.25fr);
      gap: 18px;
      align-items: start;
    }

    .traffic-analytics-card {
      background: #fff;
      min-height: 260px;
      padding: 18px;
    }

    .traffic-analytics-card.warning-card {
      grid-column: 1 / -1;
      min-height: 0;
    }

    .traffic-business-overview {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) minmax(260px, 1fr);
      gap: 12px;
      align-items: center;
    }

    .traffic-inline-kpis {
      display: grid;
      gap: 8px;
      color: var(--muted);
    }

    .traffic-inline-kpis span {
      display: flex;
      justify-content: space-between;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .traffic-sparkline {
      width: 100%;
      height: 112px;
      display: block;
    }

    .traffic-sparkline path {
      fill: none;
      stroke: var(--brand);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .empty-line {
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .funnel-model {
      display: grid;
      gap: 4px;
      padding: 10px 2px 0;
    }

    .funnel-stage {
      display: grid;
      gap: 2px;
      opacity: 0;
      transform: translateY(12px);
      animation: funnelIn .58s cubic-bezier(.2, .8, .2, 1) forwards;
      animation-delay: var(--delay, 0ms);
    }

    .funnel-stage-main {
      display: grid;
      grid-template-columns: minmax(190px, 1fr) 130px;
      gap: 12px;
      align-items: center;
    }

    .funnel-shape {
      width: var(--funnel-width);
      min-width: 150px;
      justify-self: center;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      color: #fff;
      border-radius: 13px;
      background: linear-gradient(110deg, #ff8a00 0%, #f2b21f 46%, #27b681 100%);
      box-shadow: 0 16px 32px rgba(255, 138, 0, .18);
      position: relative;
      overflow: hidden;
      transition: width .45s ease;
    }

    .funnel-shape::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.26), transparent);
      transform: translateX(-110%);
      animation: funnelSweep 2.8s ease-in-out infinite;
      animation-delay: var(--delay, 0ms);
    }

    .funnel-shape span,
    .funnel-shape strong {
      position: relative;
      z-index: 1;
    }

    .funnel-shape span {
      font-size: 13px;
      font-weight: 800;
    }

    .funnel-shape strong {
      font-size: 22px;
      white-space: nowrap;
    }

    .funnel-stage-meta {
      display: grid;
      gap: 4px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--muted);
    }

    .funnel-stage-meta b {
      color: var(--text);
      font-size: 18px;
    }

    .funnel-stage-meta small {
      line-height: 1.45;
    }

    .funnel-connector {
      width: min(54%, var(--funnel-width));
      height: 18px;
      justify-self: center;
      display: grid;
      place-items: center;
    }

    .funnel-connector i {
      width: 2px;
      height: 100%;
      background: linear-gradient(#ffb12d, #28b783);
      opacity: .55;
    }

    .funnel-summary-line {
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
    }

    .funnel-summary-line strong {
      color: var(--brand-strong);
      font-size: 18px;
    }

    @keyframes funnelIn {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes funnelSweep {
      0%, 35% { transform: translateX(-110%); }
      70%, 100% { transform: translateX(110%); }
    }

    .traffic-top-list {
      display: grid;
      gap: 10px;
    }

    .traffic-top-item {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 92px;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      position: relative;
      overflow: hidden;
    }

    .traffic-toolbar {
      margin: 0 0 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }

    .traffic-toolbar-left,
    .traffic-toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .traffic-period-switch {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #f8fafc;
    }

    .traffic-period-switch button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 700;
    }

    .traffic-period-switch button.active {
      color: var(--brand-strong);
      background: #fff;
      box-shadow: 0 6px 18px rgba(255, 138, 0, 0.14);
    }

    .traffic-sync-note {
      max-width: 520px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .traffic-top-item .rank-badge {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--brand-weak);
      color: var(--brand-strong);
      font-weight: 800;
      position: relative;
      z-index: 1;
    }

    .traffic-top-item.top1 {
      border-color: #ffd38a;
      background: linear-gradient(90deg, #fff9ed, #fff);
    }

    .traffic-top-item.top2,
    .traffic-top-item.top3 {
      background: linear-gradient(90deg, #f8fbff, #fff);
    }

    .traffic-top-item.top1 .rank-badge {
      color: #fff;
      background: linear-gradient(135deg, #ff8a00, #f0b429);
      box-shadow: 0 8px 18px rgba(255, 138, 0, .25);
    }

    .traffic-top-item.top2 .rank-badge {
      color: #fff;
      background: linear-gradient(135deg, #5b8def, #25b885);
    }

    .traffic-top-item.top3 .rank-badge {
      color: #fff;
      background: linear-gradient(135deg, #8b9bb4, #ffb12d);
    }

    .traffic-top-item strong {
      display: block;
      max-width: 520px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .traffic-top-item small {
      display: block;
      color: var(--muted);
      margin-top: 3px;
    }

    .traffic-rank-content {
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .traffic-rank-meter {
      height: 6px;
      margin-top: 8px;
      border-radius: 999px;
      background: #eef2f7;
      overflow: hidden;
    }

    .traffic-rank-meter i {
      display: block;
      height: 100%;
      width: var(--rank-width, 0%);
      border-radius: inherit;
      background: linear-gradient(90deg, var(--brand), #25b885);
    }

    .traffic-rank-value {
      text-align: right;
      position: relative;
      z-index: 1;
    }

    .traffic-rank-value b {
      display: block;
      color: var(--text);
      font-size: 18px;
    }

    .traffic-rank-value small {
      color: var(--muted);
      font-size: 12px;
    }

    .traffic-top-item.warning {
      grid-template-columns: 34px 1fr;
      background: #fff8f1;
      border-color: #ffd8aa;
    }

    .traffic-alert-group {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }

    .traffic-alert-column {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .traffic-alert-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      margin-top: 0;
    }

    .traffic-alert-title i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--brand);
      display: inline-block;
    }

    .traffic-top-item.warning.below-average {
      background: #f7fbff;
      border-color: #cfe4ff;
    }

    .traffic-top-item.warning.below-average .rank-badge {
      background: #e8f3ff;
      color: #1d5fbf;
    }

    .traffic-detail-heading {
      margin: 18px 2px 4px;
    }

    .traffic-detail-heading h3 {
      margin: 0 0 4px;
    }

    .traffic-detail-heading small {
      color: var(--muted);
    }

    .traffic-business-card {
      margin-top: 12px;
      background: #f8fbff;
    }

    .traffic-metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .traffic-stat {
      min-height: 90px;
      background: #fff;
    }

    .traffic-stat small {
      color: var(--muted);
      margin-top: 6px;
      display: block;
    }

    .traffic-rank-table {
      border: 0;
      box-shadow: none;
      border-radius: 8px;
      max-height: 520px;
      overflow: auto;
    }

    @media (max-width: 1180px) {
      .stats { grid-template-columns: repeat(3, minmax(130px, 1fr)); }
      .layout-grid, .dashboard-grid { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; }
      .app { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      .main { padding: 16px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .traffic-shell { padding: 12px; }
      .traffic-hero-panel, .traffic-analysis-grid, .traffic-business-overview { grid-template-columns: 1fr; }
      .traffic-alert-group { grid-template-columns: 1fr; }
      .traffic-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .funnel-stage-main { grid-template-columns: 1fr; }
      .funnel-stage-meta { justify-self: stretch; }
      .traffic-toolbar { align-items: stretch; flex-direction: column; }
      .traffic-toolbar-left, .traffic-toolbar-right { justify-content: flex-start; }
      .traffic-sync-note { max-width: 100%; white-space: normal; }
      .traffic-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .product-toolbar { grid-template-columns: 1fr; }
      .price-filter-bar, .price-workbench, .product-workflow, .two-col { grid-template-columns: 1fr; }
      .operation-panel { position: static; }
      .product-summary { grid-template-columns: 1fr; }
      .product-actions { justify-content: flex-start; }
      th, td { min-width: 100px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="logo" src="https://image.sunrivertrip.com/connector/basic_setting/2485360945672745369609d0854866b2a4cd6917d22a9a60858f3.png" alt="祥源" />
        <div>
          <strong>祥源OTA工作台</strong>
          <small>OTA Console</small>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="user-card">
        <small>系统访问</small>
        <strong>admin</strong>
        <button class="logout">退出登录</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 id="pageTitle">工作台</h1>
          <p id="pageDesc">多账号产品、库存、价格与任务概览</p>
        </div>
        <div class="actions">
          <button class="btn" id="refreshBtn">刷新状态</button>
          <button class="btn primary" data-page="products">进入批量操作</button>
        </div>
      </div>

      <section class="stats" id="stats"></section>

      <section class="page active" id="page-dashboard"></section>
      <section class="page" id="page-accounts"></section>
      <section class="page" id="page-products"></section>
      <section class="page" id="page-traffic"></section>
      <section class="page" id="page-tasks"></section>
      <section class="page" id="page-logs"></section>
      <section class="page" id="page-settings"></section>
    </main>
  </div>

  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <h3 id="modalTitle">确认操作</h3>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions">
        <button class="btn" id="cancelModal">取消</button>
        <button class="btn primary" id="confirmModal">确认</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const state = {
      page: "dashboard",
      region: "苏州",
      venueId: "v-sz-01",
      accountId: "all",
      keyword: "",
      syncFilter: "all",
      selectedSkuIds: new Set(),
      pendingModal: null,
      productSyncedAt: "",
      productTotalHint: 0,
      productChannel: "ctrip",
      productSearch: "",
      productAccountFilter: "all",
      productCategoryFilter: "all",
      productSaleFilter: "all",
      productInfoFilter: "all",
      expandedProductIds: new Set(),
      aiScopeText: "",
      aiScopeResult: null,
      priceSearch: "",
      priceAccountFilter: "all",
      priceCategoryFilter: "all",
      priceSaleFilter: "all",
      priceSelectedProductIds: new Set(),
      priceSkuScope: "all",
      priceSkuText: "",
      priceDateStart: new Date().toISOString().slice(0, 10),
      priceDateEnd: new Date(Date.now() + 6 * 86400000).toISOString().slice(0, 10),
      priceOperationType: "setPrice",
      priceValue: "",
      stockValue: "",
      inventoryAction: "open",
      pricePreviewLoading: false,
      pricePreview: null,
      priceStockResourceByProduct: {},
      expandedTaskIds: new Set(),
      trafficAccountFilter: "all",
      trafficDays: "14",
      expandedTrafficKeys: new Set(),
      trafficLoading: false,
      bootLoading: true,
      accountsLoaded: false,
      productsLoaded: false
    };

    const navGroups = [
      { title: "平台", items: [
        { id: "dashboard", label: "工作台", icon: "◎", desc: "多账号产品、库存、价格与任务概览" },
        { id: "accounts", label: "账号管理", icon: "♙", desc: "携程账号登录、状态与异常管理" }
      ]},
      { title: "产品", items: [
        { id: "products", channel: "ctrip", label: "携程产品", icon: "☷", desc: "携程产品、SKU 与批量操作" },
        { id: "products", channel: "douyin_life", label: "抖音来客产品", icon: "☷", desc: "抖音来客产品、SKU 与批量操作" },
        { id: "products", channel: "meituan", label: "美团产品", icon: "☷", desc: "美团产品、SKU 与批量操作" },
        { id: "products", channel: "fliggy", label: "飞猪产品", icon: "☷", desc: "飞猪产品、SKU 与批量操作" },
        { id: "products", channel: "tongcheng", label: "同程产品", icon: "☷", desc: "同程产品、SKU 与批量操作" }
      ]},
      { title: "数据", items: [
        { id: "traffic", label: "渠道流量", icon: "◒", desc: "携程数据参谋流量概览与产品榜" }
      ]},
      { title: "备忘录", items: [
        { id: "tasks", label: "批量任务", icon: "▣", desc: "改价、改库存、同步、审核任务记录" },
        { id: "logs", label: "操作日志", icon: "☰", desc: "每次价格与库存变化的审计记录" }
      ]},
      { title: "系统设置", items: [
        { id: "settings", label: "AI 配置", icon: "⚙", desc: "同步策略、价格保护与通知配置" }
      ]}
    ];

    const CHANNEL_OPTIONS = [
      { id: "ctrip", label: "携程", loginUrl: "https://vbooking.ctrip.com/ivbk/accountV2/login" },
      { id: "douyin_life", label: "抖音来客", loginUrl: "https://life.douyin.com/" },
      { id: "meituan", label: "美团", loginUrl: "https://mpc.meituan.com/" },
      { id: "fliggy", label: "飞猪", loginUrl: "https://fsc.fliggy.com/#/new/home" },
      { id: "tongcheng", label: "同程", loginUrl: "https://ebk.17u.cn/jingqu/Account/Login" }
    ];
    const CTRIP_LOGIN_URL = CHANNEL_OPTIONS[0].loginUrl;
    const BACKEND_BASE = location.protocol === "http:" || location.protocol === "https:" ? location.origin : "";
    const PRODUCT_RENDER_LIMIT = 420;
    const PRICE_OPERATION_TYPES = ["setPrice", "adjustPrice", "percentPrice"];

    function readSavedAccounts() {
      try {
        return JSON.parse(localStorage.getItem("ctripAccounts") || "[]");
      } catch (error) {
        return [];
      }
    }

    const accounts = readSavedAccounts();
    const venues = [];
    let products = [];
    let tasks = [];
    let trafficDashboards = [];
    let logs = [];

    const pages = {
      dashboard: document.querySelector("#page-dashboard"),
      accounts: document.querySelector("#page-accounts"),
      products: document.querySelector("#page-products"),
      traffic: document.querySelector("#page-traffic"),
      tasks: document.querySelector("#page-tasks"),
      logs: document.querySelector("#page-logs"),
      settings: document.querySelector("#page-settings")
    };

    const statusClass = {
      ok: "ok", pending: "pending", failed: "failed", review: "review", offline: "offline"
    };

    const statusLabel = {
      ok: "已同步", pending: "待同步", failed: "同步失败", review: "审核中", offline: "已下架"
    };

    function accountName(id) {
      return accounts.find(item => item.id === id)?.name || "-";
    }

    function accountChannel(account) {
      return CHANNEL_OPTIONS.find(item => item.id === (account?.channel || "ctrip")) || CHANNEL_OPTIONS[0];
    }

    function ctripAccounts(source = accounts) {
      return source.filter(account => (account.channel || "ctrip") === "ctrip");
    }

    function channelAccounts(channelId = state.productChannel, source = accounts) {
      return source.filter(account => (account.channel || "ctrip") === channelId);
    }

    function productChannelInfo(channelId = state.productChannel) {
      return CHANNEL_OPTIONS.find(item => item.id === channelId) || CHANNEL_OPTIONS[0];
    }

    function productChannelId(product) {
      const account = accounts.find(item => item.id === product.accountId);
      return account?.channel || "ctrip";
    }

    function productsForChannel(channelId = state.productChannel) {
      return products.filter(product => productChannelId(product) === channelId);
    }

    function isCtripProductChannel() {
      return state.productChannel === "ctrip";
    }

    function trafficAccountName(id) {
      return accounts.find(item => item.id === id)?.name
        || trafficDashboards.find(item => item.accountId === id)?.accountName
        || "-";
    }

    function venueName(id) {
      return venues.find(item => item.id === id)?.name || "-";
    }

    function filteredProducts() {
      return products.filter(product => {
        const accountOk = state.accountId === "all" || product.accountId === state.accountId;
        const venueOk = !state.venueId || product.venueId === state.venueId;
        const keyword = state.keyword.trim().toLowerCase();
        const productId = product.id || product.productId || "";
        const skus = product.skus || [];
        const keywordOk = !keyword || product.title.toLowerCase().includes(keyword) || productId.toLowerCase().includes(keyword) || skus.some(sku => sku.id.toLowerCase().includes(keyword) || sku.name.toLowerCase().includes(keyword));
        const syncOk = state.syncFilter === "all" || product.status === state.syncFilter || (state.syncFilter === "low" && skus.some(sku => sku.stock <= 2));
        return accountOk && venueOk && keywordOk && syncOk;
      });
    }

    function renderNav() {
      document.querySelector("#nav").innerHTML = navGroups.map(group => `
        <div>
          <div class="nav-title">${group.title}</div>
          ${group.items.map(item => {
            const active = state.page === item.id && (!item.channel || item.channel === state.productChannel);
            return `<button class="nav-btn ${active ? "active" : ""}" data-page="${item.id}" ${item.channel ? `data-channel="${item.channel}"` : ""}><span class="nav-icon">${item.icon}</span>${item.label}</button>`;
          }).join("")}
        </div>
      `).join("");
    }

    function renderStats() {
      const skuCount = products.reduce((sum, product) => sum + (product.skus?.length || product.onSaleResourceCount || 0) + (product.offSaleResourceCount || 0), 0);
      const pendingCount = products.filter(product => product.status === "pending").length;
      const errorCount = products.filter(product => product.status === "failed").length;
      const authorizedCount = accounts.filter(account => account.login === "已授权").length;
      const statItems = [
        ["已接入账号", accounts.length],
        ["已授权账号", authorizedCount],
        ["场馆数量", venues.length],
        ["产品数量", products.length],
        ["SKU 数量", skuCount],
        ["今日待同步", pendingCount + errorCount]
      ];
      document.querySelector("#stats").innerHTML = statItems.map(([label, value]) => `<div class="stat-card"><span>${label}</span><strong>${value}</strong></div>`).join("");
    }

    function renderDashboard() {
      pages.dashboard.innerHTML = `
        <div class="dashboard-grid">
          <div class="panel">
            <div class="panel-head"><h2>账号接入</h2><small>${accounts.length} 个账号</small></div>
            <div class="mini-list">
              ${accounts.length ? accounts.map(account => `
                <div class="mini-item">
                  <div>
                    <strong>${account.name}</strong>
                    <small>${account.remark || "未填写备注"} · ${account.createdAt}</small>
                  </div>
                  <span class="status ${account.login === "已授权" ? "ok" : account.login === "等待登录" ? "pending" : "offline"}">${account.login}</span>
                </div>
              `).join("") : `<div class="empty"><strong>还没有接入渠道账号</strong>先添加账号，再打开对应商家后台完成登录授权。<br><button class="btn primary" data-action="open-add-account">添加账号</button></div>`}
            </div>
          </div>
          <div class="panel">
            <div class="panel-head"><h2>登录态说明</h2><small>第一阶段</small></div>
            <div class="mini-list">
              <div class="notice">
                当前页面通过本地后端托管各渠道登录态，只展示 Cookie 摘要和授权状态，不在前端明文展示 Cookie。
              </div>
              <div class="mini-item">
                <div>
                  <strong>下一步建议</strong>
                  <small>先完成账号列表、登录入口、授权状态流转，再接产品抓取与库存改价。</small>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderAccounts() {
      pages.accounts.innerHTML = `
        <div class="panel pad" style="margin-bottom:16px">
          <div class="topbar" style="margin-bottom:0">
            <div>
              <h1 style="font-size:18px">渠道账号接入</h1>
              <p>${BACKEND_BASE ? "后端已连接：可用后端打开各渠道登录窗口并检查 Cookie 摘要。" : "当前是 file 页面：只能打开登录页，不能让后端记录 Cookie。"}</p>
            </div>
            <div class="actions">
              <button class="btn primary" data-action="open-add-account">添加账号</button>
            </div>
          </div>
        </div>
        <div class="table-wrap">
          ${accounts.length ? `
            <table>
              <thead><tr><th>账号名称</th><th>渠道</th><th>登录状态</th><th>店铺名称</th><th>手机号</th><th>后端 Cookie</th><th>创建时间</th><th>备注</th><th>操作</th></tr></thead>
              <tbody>
                ${accounts.map(account => `
                  <tr>
                    <td><strong>${account.name}</strong></td>
                    <td><span class="status review">${accountChannel(account).label}</span></td>
                    <td><span class="status ${account.login === "已授权" ? "ok" : account.login === "等待登录" ? "pending" : "offline"}">${account.login}</span></td>
                    <td>${account.shopName || "-"}</td>
                    <td>${account.phone || "-"}</td>
                    <td>
                      ${account.sessionSummary?.recorded ? `
                        <span class="status ok">已记录 ${account.sessionSummary.cookieCount} 个</span>
                        <div class="muted-text">${account.sessionSummary.updatedAt}</div>
                        <div class="muted-text">${(account.sessionSummary.domains || []).join(", ")}</div>
                      ` : `<span class="status pending">未记录</span>`}
                    </td>
                    <td>${account.createdAt}</td>
                    <td>${account.remark || "-"}</td>
                    <td>
                      <button class="btn" data-action="backend-login" data-id="${account.id}" ${BACKEND_BASE ? "" : "disabled"}>后端打开</button>
                      <button class="btn" data-action="capture-cookie" data-id="${account.id}" ${BACKEND_BASE ? "" : "disabled"}>检查 Cookie</button>
                      <button class="btn danger" data-action="remove-account" data-id="${account.id}">删除</button>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          ` : `<div class="empty"><strong>暂无真实账号</strong>点击“添加账号”创建第一条账号记录，然后跳转对应渠道商家后台登录。<br><button class="btn primary" data-action="open-add-account">添加账号</button></div>`}
        </div>
      `;
    }

    function visibleProductRows(productRows) {
      const seen = new Set();
      return productRows.filter(product => {
        const key = productKey(product);
        if (seen.has(key)) return false;
        seen.add(key);
        return seen.size <= PRODUCT_RENDER_LIMIT;
      });
    }

    function renderProductsPage() {
      const channel = productChannelInfo();
      const channelProducts = productsForChannel(channel.id);
      const accountOptions = channelAccounts(channel.id);
      const productRows = filteredProductRows();
      const visibleRows = visibleProductRows(productRows);
      const truncated = productRows.length > visibleRows.length;
      const categories = uniqueValues(channelProducts.map(product => product.category));
      const saleOptions = [
        ["all", "全部售卖状态"],
        ["allOnSale", "全部售卖中"],
        ["partialOnSale", "部分售卖中"],
        ["allOffline", "全部不在售"]
      ];
      const infoStatuses = uniqueValues(channelProducts.map(product => product.infoStatus));
      const backendProductSyncChannels = ["ctrip", "douyin_life", "meituan", "fliggy", "tongcheng"];
      const backendStockSyncChannels = ["ctrip", "douyin_life", "meituan", "fliggy", "tongcheng"];
      const productSyncEnabled = backendProductSyncChannels.includes(state.productChannel) && BACKEND_BASE;
      const stockSyncEnabled = backendStockSyncChannels.includes(state.productChannel) && channelProducts.length && BACKEND_BASE;
      const skuSyncEnabled = isCtripProductChannel() && channelProducts.length && BACKEND_BASE;
      pages.products.innerHTML = `
        <div class="panel">
          <div class="panel-head">
            <div>
              <h2>${channel.label}产品列表</h2>
              <small>已加载 ${channelProducts.length} 个${isCtripProductChannel() && state.productTotalHint ? ` / 后台约 ${state.productTotalHint} 个` : ""} · 命中 ${productRows.length} 个 · 页面渲染 ${visibleRows.length} 个${isCtripProductChannel() && state.productSyncedAt ? ` · ${state.productSyncedAt}` : ""}</small>
            </div>
            <div class="actions">
              <button class="btn" data-action="export-products" ${channelProducts.length ? "" : "disabled"}>导出数据</button>
              <button class="btn" data-action="sync-price-stock" ${stockSyncEnabled ? "" : "disabled"} title="${backendStockSyncChannels.includes(state.productChannel) ? "" : "该渠道产品抓取脚本待接入"}">同步库存</button>
              <button class="btn" data-action="sync-skus" ${skuSyncEnabled ? "" : "disabled"} title="${isCtripProductChannel() ? "" : "抖音商品同步已包含 SKU 明细"}">同步 SKU 明细</button>
              <button class="btn primary" data-action="sync-products" ${productSyncEnabled ? "" : "disabled"} title="${backendProductSyncChannels.includes(state.productChannel) ? "" : "该渠道产品抓取脚本待接入"}">同步全部产品</button>
            </div>
          </div>
      ${state.bootLoading && !state.productsLoaded ? `
        <div class="empty loading-empty"><strong>正在加载本地账号与产品</strong>请稍等，页面会自动刷新数据。</div>
      ` : `
            <div class="product-workflow">
              <div class="section-card">
                <div class="section-card-head">
                  <h3>产品 / SKU 圈选</h3>
                  <small>用一句话识别账号、品类、城市、产品和场次，结果会同步给右侧批量操作。</small>
                </div>
                <div class="section-card-body">
                  <div class="ai-scope-box">
                    <div class="ai-scope-row">
                      <input class="ai-scope-input" id="aiScopeText" value="${state.aiScopeText}" placeholder="例如：猩咖携程一日游苏博上午场，准备关库存" />
                      <button class="btn" data-action="preview-ai-scope" ${channelProducts.length ? "" : "disabled"}>识别范围</button>
                      <button class="btn primary" data-action="apply-ai-scope" ${state.aiScopeResult?.products?.length ? "" : "disabled"}>应用圈选</button>
                    </div>
                    ${aiScopeSummary(state.aiScopeResult)}
                  </div>
                </div>
              </div>
              ${renderBatchOperationPanel()}
            </div>
            <div class="product-list-section">
              <div class="section-card-head">
                <h3>产品列表展示</h3>
                <small>用于查看账号、产品、SKU 同步状态和售卖状态；批量操作范围由上方圈选区域控制。</small>
              </div>
              <div class="product-filter-bar">
                <div class="field"><input id="productSearch" placeholder="搜索产品名称、产品ID、套餐ID、资源ID、场馆" value="${state.productSearch}" /></div>
                <div class="field"><select id="productAccountFilter">
                  <option value="all">全部账号</option>
                  ${accountOptions.map(account => `<option value="${account.id}" ${state.productAccountFilter === account.id ? "selected" : ""}>${account.name}</option>`).join("")}
                </select></div>
                <div class="field"><select id="productCategoryFilter">
                  <option value="all">全部品类</option>
                  ${categories.map(value => `<option value="${value}" ${state.productCategoryFilter === value ? "selected" : ""}>${value}</option>`).join("")}
                </select></div>
                <div class="field"><select id="productSaleFilter">
                  ${saleOptions.map(([value, label]) => `<option value="${value}" ${state.productSaleFilter === value ? "selected" : ""}>${label}</option>`).join("")}
                </select></div>
                <div class="field"><select id="productInfoFilter">
                  <option value="all">全部信息状态</option>
                  ${infoStatuses.map(value => `<option value="${value}" ${state.productInfoFilter === value ? "selected" : ""}>${value}</option>`).join("")}
                </select></div>
              </div>
              ${productResultOverview(productRows)}
              <div class="table-wrap" style="border:0;box-shadow:none;border-radius:0">
                <table class="product-table">
                  <thead><tr><th></th><th>账号名称</th><th>产品 ID</th><th>产品名称</th><th>品类</th><th>场馆/景点</th><th>所在地/出发地</th><th>售卖状态</th><th>SKU / 资源</th><th>库价概览</th><th>审核</th><th>信息状态</th></tr></thead>
                  <tbody>
                    ${visibleRows.map(product => renderProductListRows(product)).join("") || `<tr><td colspan="12"><div class="empty"><strong>没有匹配的产品</strong>调整顶部筛选项后再试。</div></td></tr>`}
                    ${truncated ? `<tr><td colspan="12"><div class="list-truncation">为保证打开速度，当前先展示前 ${visibleRows.length} 个结果；上方统计仍按 ${productRows.length} 个命中结果计算。可继续搜索产品名、产品 ID、套餐 ID 或资源 ID 缩小范围。</div></td></tr>` : ""}
                  </tbody>
                </table>
              </div>
            </div>
            ${!channelProducts.length ? `<div class="empty channel-empty"><strong>${channel.label}暂无产品数据</strong>${productSyncEnabled ? "请确认该渠道账号已授权，然后点击“同步全部产品”。" : "账号登录态已可保存，产品抓取脚本还未接入；接入后会沿用当前产品列表结构、筛选、导出和批量操作入口。"}<br><button class="btn primary" data-action="sync-products" ${productSyncEnabled ? "" : "disabled"}>同步全部产品</button></div>` : ""}
          `}
        </div>
      `;
    }

    function renderProductListRows(product) {
      const id = product.productId || product.id || "-";
      const skus = product.skus || [];
      const resourceTotal = (product.onSaleResourceCount || 0) + (product.offSaleResourceCount || 0);
      const expanded = state.expandedProductIds.has(String(id));
      const aiMatched = state.aiScopeResult ? selectedAiProductIds().includes(String(id)) : false;
      const priceStock = priceStockOverview(product);
      return `
                    <tr class="${aiMatched ? "ai-match-row" : ""}">
                      <td><button class="btn icon-btn" title="${expanded ? "收起 SKU" : "展开 SKU"}" data-action="toggle-product-skus" data-product="${id}">${expanded ? "−" : "+"}</button></td>
                      <td><strong>${accountName(product.accountId)}</strong></td>
                      <td><span class="id-badge">${id}</span></td>
                      <td class="product-name-cell">${product.title || "-"}</td>
                      <td><span class="status review">${product.category || "-"}</span></td>
                      <td class="subtle-cell">${product.venue || "-"}</td>
                      <td class="subtle-cell">${product.location || "-"}</td>
                      <td><span class="status ${productSaleBucket(product) !== "allOffline" ? "ok" : "offline"}">${productSaleBucketLabel(product)}</span></td>
                      <td>
                        <div class="sku-summary">
                          <strong>${skus.length ? `${skus.length} 个 SKU` : `${resourceTotal} 个资源`}</strong>
                          <span>${product.skuSyncStatus || (skus.length ? "已同步明细" : "未同步 SKU")}${product.skuSyncedAt ? ` · ${product.skuSyncedAt}` : ""}</span>
                        </div>
                      </td>
                      <td>${priceStock}</td>
                      <td>${product.auditStatus || "-"}</td>
                      <td>${product.infoStatus || "-"}</td>
                    </tr>
                    ${expanded ? `<tr class="sku-detail-row"><td colspan="12"><div class="sku-detail">${renderSkuDetail(product)}</div></td></tr>` : ""}
      `;
    }

    function renderSkuDetail(product) {
      const skus = product.skus || [];
      if (!skus.length) {
        return `<div class="empty"><strong>暂无 SKU 明细</strong>${product.skuSyncError ? `同步失败：${product.skuSyncError}` : "点击“同步 SKU 明细”后会显示套餐 ID、资源 ID 和场次信息。"}</div>`;
      }
      return `
        ${renderPriceStockDetail(product)}
        <table class="sku-mini-table">
          <thead><tr><th>产品 ID</th><th>套餐 ID</th><th>资源 ID</th><th>套餐 / 资源名称</th><th>来源</th><th>状态</th><th>原始行</th></tr></thead>
          <tbody>
            ${skus.map(sku => {
              const skuMatched = state.aiScopeResult ? selectedAiSkuLines().some(item => item.productId === productKey(product) && (item.resourceId === sku.resourceId || item.packageId === sku.packageId || item.skuId === sku.id || item.skuName === sku.name)) : false;
              return `
              <tr class="${skuMatched ? "ai-match-sku" : ""}">
                <td><span class="id-badge">${productKey(product)}</span></td>
                <td><span class="id-badge">${sku.packageId || "-"}</span></td>
                <td><span class="id-badge">${sku.resourceId || "-"}</span></td>
                <td>${sku.name || sku.packageName || sku.resourceName || "-"}</td>
                <td>${sku.skuSource || "-"}</td>
                <td>${sku.state || "-"}</td>
                <td>${sku.rowText || sku.packageInventoryName || "-"}</td>
              </tr>
            `}).join("")}
          </tbody>
        </table>
      `;
    }

    function priceStockOverview(product) {
      const snapshot = product.priceStock || {};
      const summary = snapshot.summary || {};
      if (snapshot.status === "成功" || summary.rowCount) {
        const priceText = summary.minPrice !== undefined ? `${formatMoney(summary.minPrice)}-${formatMoney(summary.maxPrice)}` : "无价";
        const stockText = summary.minStock !== undefined ? `${formatNumber(summary.minStock)}-${formatNumber(summary.maxStock)}` : "无库存";
        return `
          <div class="price-stock-cell">
            <strong>${summary.resourceCount || 0} 资源 / ${summary.dateCount || 0} 天</strong>
            <span class="range">${formatDay(summary.sampleStart)}-${formatDay(summary.sampleEnd).slice(5)}</span>
            <span>开 ${summary.openCount || 0}</span>
            <span>关 ${summary.closedCount || 0}</span>
            <span class="price">${priceText}</span>
            <span>${stockText}</span>
          </div>
        `;
      }
      if (product.priceStockStatus === "失败") {
        return `<div class="price-stock-cell warn"><strong>库价失败</strong><span>${escapeHtml(product.priceStockError || "-")}</span></div>`;
      }
      if (product.priceStockStatus) {
        return `<div class="price-stock-cell muted"><strong>${escapeHtml(product.priceStockStatus)}</strong><span>${product.priceStockSyncedAt || ""}</span></div>`;
      }
      return `<div class="price-stock-cell muted"><strong>未同步库价</strong><span>点击同步库价后获取</span></div>`;
    }

    function renderPriceStockDetail(product) {
      const snapshot = product.priceStock || {};
      const resources = snapshot.resources || [];
      if (!resources.length) {
        return `
          <div class="price-stock-detail">
            <div class="price-stock-title">
              <strong>库价明细</strong>
              <span>${product.priceStockStatus || "未同步库价"}${product.priceStockSyncedAt ? ` · ${product.priceStockSyncedAt}` : ""}</span>
            </div>
            <div class="empty"><strong>暂无库价明细</strong>点击“同步库价”后，可在这里查看资源维度的日期、价格和库存。</div>
          </div>
        `;
      }
      const currentProductKey = productKey(product);
      const selectedIndex = Math.max(0, Math.min(
        Number(state.priceStockResourceByProduct[currentProductKey] || 0),
        resources.length - 1
      ));
      const selectedResource = resources[selectedIndex] || resources[0];
      const visibleDays = (selectedResource.days || []).slice(0, 366);
      return `
        <div class="price-stock-detail">
          <div class="price-stock-title">
            <strong>库价明细</strong>
            <span>${resources.length} 个资源 · ${snapshot.summary?.dateCount || 0} 天 · ${snapshot.syncedAt || ""}</span>
          </div>
          <div class="price-stock-resource-grid">
            ${resources.map((resource, index) => `
              <button class="resource-chip ${index === selectedIndex ? "active" : ""}" data-action="select-price-stock-resource" data-product="${currentProductKey}" data-resource-index="${index}">
                <strong>${escapeHtml(resource.resourceId || resource.packageId || "-")}</strong>
                <span>${escapeHtml(resource.packageName || resource.resourceName || "-")}</span>
                <small>${resource.summary?.dateCount || 0} 天 · 开 ${resource.summary?.openCount || 0} / 关 ${resource.summary?.closedCount || 0}</small>
              </button>
            `).join("")}
          </div>
          <div class="price-stock-title">
            <strong>${escapeHtml(selectedResource.packageName || selectedResource.resourceName || selectedResource.resourceId || "-")}</strong>
            <span>资源 ID：${escapeHtml(selectedResource.resourceId || "-")} · 套餐 ID：${escapeHtml(selectedResource.packageId || "-")}</span>
          </div>
          <div class="price-calendar-shell">
            <div class="price-calendar-track">
              ${visibleDays.map(day => {
                const closed = day.sale === false || day.stockSale === false;
                return `
                  <div class="price-day-card ${closed ? "closed" : ""}">
                    <div class="date">${formatDayShort(day.day)}</div>
                    <div class="weekday">${weekdayText(day.day)}</div>
                    <div class="sale">${closed ? "关班" : "开售"}</div>
                    <small>售价：${formatMoney(day.salePrice)}</small>
                    <small>底价：${formatMoney(day.costPrice)}</small>
                    <small>库存：${formatNumber(day.unUsed ?? day.total)}</small>
                    <small>已售：${formatNumber(day.used)}</small>
                  </div>
                `;
              }).join("") || `<div class="empty"><strong>暂无日期库价</strong>该资源没有返回日期明细。</div>`}
            </div>
          </div>
          ${(selectedResource.days || []).length > visibleDays.length ? `<div class="muted-text">当前日历展示前 ${visibleDays.length} 天，共 ${(selectedResource.days || []).length} 天。</div>` : ""}
        </div>
      `;
    }

    function formatDayShort(value) {
      const text = String(value || "");
      if (/^\d{8}$/.test(text)) return `${Number(text.slice(4, 6))}/${Number(text.slice(6))}`;
      return text || "-";
    }

    function weekdayText(value) {
      const text = String(value || "");
      if (!/^\d{8}$/.test(text)) return "";
      const date = new Date(`${text.slice(0, 4)}-${text.slice(4, 6)}-${text.slice(6)}T00:00:00`);
      return ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][date.getDay()] || "";
    }

    function formatDay(value) {
      const text = String(value || "");
      if (/^\d{8}$/.test(text)) return `${text.slice(0, 4)}-${text.slice(4, 6)}-${text.slice(6)}`;
      return text || "-";
    }

    function formatMoney(value) {
      if (value === "" || value === null || value === undefined) return "-";
      const number = Number(value);
      if (!Number.isFinite(number)) return String(value);
      return Number.isInteger(number) ? String(number) : number.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
    }

    function formatNumber(value) {
      if (value === "" || value === null || value === undefined) return "-";
      const number = Number(value);
      if (!Number.isFinite(number)) return String(value);
      return Number.isInteger(number) ? String(number) : number.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
    }

    function uniqueValues(values) {
      return Array.from(new Set(values.filter(value => value && value !== "-"))).sort((a, b) => String(a).localeCompare(String(b), "zh-CN"));
    }

    function productSaleBucket(product) {
      const onSale = Number(product.onSaleResourceCount || 0);
      const offSale = Number(product.offSaleResourceCount || 0);
      const total = onSale + offSale;
      const rawStatus = String(product.saleStatus || "");
      if (total > 0) {
        if (onSale > 0 && offSale > 0) return "partialOnSale";
        if (onSale > 0) return "allOnSale";
        return "allOffline";
      }
      if (rawStatus.includes("部分")) return "partialOnSale";
      if (rawStatus.includes("售卖中")) return "allOnSale";
      return "allOffline";
    }

    function productSaleBucketLabel(product) {
      return {
        allOnSale: "全部售卖中",
        partialOnSale: "部分售卖中",
        allOffline: "全部不在售"
      }[productSaleBucket(product)] || "全部不在售";
    }

    function productResultOverview(rows) {
      const skuTotal = rows.reduce((sum, product) => sum + (product.skus?.length || 0), 0);
      const resourceTotalCount = rows.reduce((sum, product) => sum + (product.skus?.length || (product.onSaleResourceCount || 0) + (product.offSaleResourceCount || 0)), 0);
      const accountTotal = uniqueValues(rows.map(product => accountName(product.accountId))).length;
      const allOnSale = rows.filter(product => productSaleBucket(product) === "allOnSale").length;
      const partialOnSale = rows.filter(product => productSaleBucket(product) === "partialOnSale").length;
      const allOffline = rows.filter(product => productSaleBucket(product) === "allOffline").length;
      const priceStockSynced = rows.filter(product => product.priceStock?.summary?.rowCount).length;
      return `
        <div class="product-result-overview">
          <div class="result-metric"><span>结果产品</span><strong>${rows.length}</strong></div>
          <div class="result-metric"><span>SKU / 资源</span><strong>${skuTotal || resourceTotalCount}</strong></div>
          <div class="result-metric"><span>账号数</span><strong>${accountTotal}</strong></div>
          <div class="result-metric"><span>全部售卖中</span><strong>${allOnSale}</strong></div>
          <div class="result-metric"><span>部分售卖中</span><strong>${partialOnSale}</strong></div>
          <div class="result-metric"><span>已同步库价</span><strong>${priceStockSynced}</strong></div>
        </div>
      `;
    }

    function filteredProductRows() {
      const keyword = state.productSearch.trim();
      return productsForChannel(state.productChannel).filter(product => {
        const keywordOk = productMatchesKeyword(product, keyword);
        const accountOk = state.productAccountFilter === "all" || product.accountId === state.productAccountFilter;
        const categoryOk = state.productCategoryFilter === "all" || product.category === state.productCategoryFilter;
        const saleOk = state.productSaleFilter === "all" || productSaleBucket(product) === state.productSaleFilter;
        const infoOk = state.productInfoFilter === "all" || product.infoStatus === state.productInfoFilter;
        return keywordOk && accountOk && categoryOk && saleOk && infoOk;
      });
    }

    function productSearchText(product) {
      return [
        product.productId,
        product.id,
        product.title,
        product.category,
        product.venue,
        product.location,
        product.saleStatus,
        product.auditStatus,
        product.infoStatus,
        accountName(product.accountId)
      ].join(" ").toLowerCase();
    }

    function skuSearchText(sku) {
      return [
        sku.id,
        sku.name,
        sku.packageId,
        sku.packageName,
        sku.packageInventoryName,
        sku.resourceId,
        sku.resourceName,
        sku.skuSource,
        sku.state,
        sku.rowText
      ].join(" ").toLowerCase();
    }

    function splitSearchTokens(value) {
      return uniqueValues(String(value || "").split(/[\s,，;；、]+/).map(item => item.trim()).filter(Boolean));
    }

    function identifierTokens(value) {
      return splitSearchTokens(value).filter(token => /^\d{5,}$/.test(token));
    }

    function productIdentifierValues(product) {
      const values = [product.productId, product.id];
      (product.skus || []).forEach(sku => {
        values.push(sku.id, sku.packageId, sku.resourceId);
      });
      return uniqueValues(values.map(value => String(value || "").trim()).filter(Boolean));
    }

    function productMatchesKeyword(product, keyword) {
      const raw = String(keyword || "").trim();
      if (!raw) return true;
      const ids = identifierTokens(raw);
      if (ids.length) {
        const values = productIdentifierValues(product);
        return ids.some(id => values.includes(id));
      }
      const text = [productSearchText(product), ...(product.skus || []).map(skuSearchText)].join(" ");
      return splitSearchTokens(raw.toLowerCase()).every(token => text.includes(token.toLowerCase()));
    }

    const aiAliasMap = {
      "苏博": ["苏州博物馆", "苏州博物馆本馆"],
      "拙政园": ["拙政园"],
      "陶博": ["陶瓷博物馆", "景德镇中国陶瓷博物馆"],
      "东珠": ["东方明珠"],
      "牛首山": ["牛首山"],
      "大咖": ["文史大咖", "专业大咖"],
      "私家": ["私家团", "包团"],
      "包团": ["包团", "私家团"],
      "拼团": ["拼团", "散拼"]
    };

    function tokenVariants(token) {
      const value = String(token || "").trim();
      return uniqueValues([value, ...(aiAliasMap[value] || [])].filter(Boolean));
    }

    function textHasToken(text, token) {
      const source = String(text || "").toLowerCase();
      return tokenVariants(token).some(value => source.includes(String(value).toLowerCase()));
    }

    function extractHoursFromText(text) {
      const source = String(text || "");
      const hours = [];
      const patterns = [
        /(\d{1,2})\s*[:：]\s*(\d{1,2})/g,
        /(\d{1,2})\s*点\s*(?:半|(\d{1,2})分?)?/g
      ];
      patterns.forEach(pattern => {
        let match;
        while ((match = pattern.exec(source))) {
          const hour = Number(match[1]);
          if (hour >= 0 && hour < 24) hours.push(hour);
        }
      });
      return Array.from(new Set(hours));
    }

    function textMatchesTimeToken(text, token) {
      const value = String(token || "");
      if (value === "全部场次") return true;
      const source = String(text || "");
      const hours = extractHoursFromText(source);
      if (value === "上午") return hours.length ? hours.some(hour => hour >= 0 && hour < 12) : /上午|早上|早场/.test(source);
      if (value === "下午") return hours.length ? hours.some(hour => hour >= 12 && hour < 18) : /下午|午后/.test(source);
      if (value === "晚上" || value === "夜场") return hours.length ? hours.some(hour => hour >= 18 && hour < 24) : /晚上|夜场|晚场/.test(source);
      return textHasToken(source, value);
    }

    function extractQuotedTokens(text) {
      const tokens = [];
      const pattern = /["“”'‘’]([^"“”'‘’]{1,40})["“”'‘’]/g;
      let match;
      while ((match = pattern.exec(text))) tokens.push(match[1].trim());
      return tokens.filter(Boolean);
    }

    function extractPlaceProductTokens(raw) {
      const tokens = [];
