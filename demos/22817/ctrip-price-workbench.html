      const cities = "上海|苏州|南京|杭州|北京|重庆|成都|广州|南昌|景德镇|黄山|无锡|常州|扬州|绍兴|宁波|嘉兴|湖州";
      const endings = "博物馆|科技馆|美术馆|纪念馆|艺术馆|展览馆|公园|景区|古镇|寺|园|山|洞|桥|路|街|湖|江|塔|宫|城";
      const pattern = new RegExp(`(?:${cities})[\\\\u4e00-\\\\u9fa5A-Za-z0-9]{0,12}(?:${endings})`, "g");
      let match;
      while ((match = pattern.exec(raw))) tokens.push(match[0]);
      const genericPattern = new RegExp(`[\\\\u4e00-\\\\u9fa5A-Za-z0-9]{2,16}(?:${endings})`, "g");
      while ((match = genericPattern.exec(raw))) {
        const token = match[0];
        if (!/^(上午|下午|晚上|早上|早场|午后|夜场|晚场)$/.test(token)) tokens.push(token);
      }
      return uniqueValues(tokens);
    }

    function extractCityTokens(raw) {
      const cities = ["上海", "苏州", "南京", "杭州", "北京", "重庆", "成都", "广州", "南昌", "景德镇", "黄山", "无锡", "常州", "扬州", "绍兴", "宁波", "嘉兴", "湖州"];
      return cities.filter(city => raw.includes(city));
    }

    function extractResidualProductTokens(raw) {
      let text = String(raw || "");
      const removeTokens = [
        "上午", "早上", "早场", "下午", "午后", "晚上", "夜场", "晚场", "全天", "全部场次", "所有场次",
        "售卖中", "在售", "在线", "不在售", "停售", "下线", "离线", "开库存", "开启", "开班",
        "关库存", "关闭", "关班", "改价", "调价", "设置价格", "价格", "库存", "sku", "SKU", "资源", "产品", "商品",
        "准备", "圈选", "选择", "筛选", "操作", "批量", "的"
      ];
      removeTokens.forEach(token => {
        text = text.replaceAll(token, " ");
      });
      uniqueValues(products.map(product => product.category).filter(Boolean)).forEach(category => {
        text = text.replaceAll(category, " ");
      });
      accounts.forEach(account => {
        const name = account.name || "";
        const shortName = name.replace(/携程|OTA|账号/g, "");
        if (name) text = text.replaceAll(name, " ");
        if (shortName) text = text.replaceAll(shortName, " ");
      });
      return uniqueValues((text.match(/[\u4e00-\u9fa5A-Za-z0-9]{2,20}/g) || []).filter(token => !/^\d+$/.test(token)));
    }

    function matchedIntentAccounts(raw) {
      const aliases = {
        "猩咖": ["狸咖携程", "狸咖"],
        "狸咖": ["狸咖携程", "狸咖"],
        "祥源": ["祥源携程", "祥源"]
      };
      return accounts.filter(account => {
        const name = account.name || "";
        const shortName = name.replace(/携程|OTA|账号/g, "");
        if (raw.includes(name) || (shortName && raw.includes(shortName))) return true;
        return Object.entries(aliases).some(([token, values]) => raw.includes(token) && values.some(value => name.includes(value) || shortName.includes(value)));
      });
    }

    function parseAiScopeIntent(text) {
      const raw = (text || "").trim();
      const lower = raw.toLowerCase();
      const categories = uniqueValues(products.map(product => product.category));
      const accountsInText = matchedIntentAccounts(raw);
      const categoryTokens = categories.filter(category => category && raw.includes(category));
      const placeTokens = extractPlaceProductTokens(raw);
      const locationTokens = extractCityTokens(raw).filter(city => !placeTokens.some(place => place.includes(city)));
      const idTokens = Array.from(new Set(raw.match(/\d{6,}/g) || []));
      const quotedTokens = extractQuotedTokens(raw);
      const skuTokens = [];
      const productTokens = [];
      const timeTokens = [];
      const actionTokens = [];

      if (/上午|早上|早场|am\b/i.test(raw)) timeTokens.push("上午");
      if (/下午|午后|pm\b/i.test(raw)) timeTokens.push("下午");
      if (/晚上|夜场|晚场|夜游|夜航/.test(raw)) timeTokens.push("夜场");
      if (/全天|全部场次|所有场次/.test(raw)) timeTokens.push("全部场次");
      const clockMatches = raw.match(/\d{1,2}[:：点]\d{0,2}/g) || [];
      clockMatches.forEach(token => timeTokens.push(token.replace("：", ":")));

      if (/售卖中|在售|在线/.test(raw)) actionTokens.push("售卖中");
      if (/不在售|停售|下线|离线/.test(raw)) actionTokens.push("不在售");
      if (/开库存|开启|开班/.test(raw)) actionTokens.push("开库存");
      if (/关库存|关闭|关班/.test(raw)) actionTokens.push("关库存");
      if (/改价|调价|设置价格|价格/.test(raw)) actionTokens.push("改价");
      if (/库存/.test(raw) && !actionTokens.includes("开库存") && !actionTokens.includes("关库存")) actionTokens.push("库存");

      const cleanIntentToken = token => String(token || "")
        .replace(/[，。；、,.;\s]+$/g, "")
        .replace(/的?(?:sku|SKU|资源|产品|商品)$/g, "")
        .trim();

      quotedTokens.map(cleanIntentToken).forEach(token => {
        if (/sku|套餐|场|上午|下午|成人|儿童|老人|婴儿|拼团|包团|私家|资源/i.test(token)) skuTokens.push(token);
        else productTokens.push(token);
      });

      const afterSku = raw.match(/(?:sku|套餐|场次|资源|场)\s*(?:包含|含|是|为|=|:|：)?\s*([\u4e00-\u9fa5A-Za-z0-9:：点【】+\-/]{1,30})/i);
      if (afterSku?.[1]) skuTokens.push(cleanIntentToken(afterSku[1]));

      const afterProduct = raw.match(/(?:产品|商品|标题|名称)\s*(?:包含|含|是|为|=|:|：)?\s*([\u4e00-\u9fa5A-Za-z0-9【】+\-/]{2,30})/i);
      if (afterProduct?.[1]) productTokens.push(cleanIntentToken(afterProduct[1]));

      placeTokens.forEach(token => productTokens.push(token));
      extractResidualProductTokens(raw).forEach(token => productTokens.push(token));
      ["苏博", "拙政园", "牛首山", "东方明珠", "浦江", "陶瓷博物馆", "科技馆", "李子坝", "大足", "卢浮宫", "敦煌"].forEach(token => {
        const hasSpecificPlace = placeTokens.some(place => place.includes(token));
        if (raw.includes(token) && !hasSpecificPlace) productTokens.push(token);
      });
      ["拼团", "包团", "私家", "成人", "儿童", "老人", "婴儿", "含票", "含门票"].forEach(token => {
        if (raw.includes(token)) skuTokens.push(token);
      });
      clockMatches.forEach(token => skuTokens.push(token.replace("：", ":")));

      return {
        raw,
        categoryTokens,
        accountIds: accountsInText.map(account => account.id),
        accountNames: accountsInText.map(account => account.name),
        locationTokens,
        idTokens,
        productTokens: uniqueValues(productTokens.map(cleanIntentToken).filter(Boolean)),
        skuTokens: uniqueValues(skuTokens.map(cleanIntentToken).filter(Boolean)),
        timeTokens: uniqueValues(timeTokens),
        actionTokens: uniqueValues(actionTokens),
        saleIntent: actionTokens.includes("售卖中") ? "onSale" : actionTokens.includes("不在售") ? "offline" : "all",
        lower
      };
    }

    function matchAiScope(intent) {
      if (!intent.raw) return { intent, products: [], skuLines: [], productIds: [], skuText: "", selectedProductIds: new Set(), selectedSkuKeys: new Set() };
      const productMatches = [];
      const skuLines = [];
      productsForChannel(state.productChannel).forEach(product => {
        const productId = productKey(product);
        const productText = productSearchText(product);
        const skus = product.skus || [];
        const idSkuMatches = intent.idTokens.length ? skus.filter(sku => {
          const values = [sku.id, sku.packageId, sku.resourceId].map(value => String(value || ""));
          return intent.idTokens.some(token => values.includes(token));
        }) : [];
        const productIdMatch = intent.idTokens.length ? intent.idTokens.includes(productId) : false;
        const categoryOk = !intent.categoryTokens.length || intent.categoryTokens.some(token => product.category === token);
        const accountOk = !intent.accountIds.length || intent.accountIds.includes(product.accountId);
        const locationText = [product.location, product.venue, product.title].join(" ").toLowerCase();
        const locationOk = !intent.locationTokens.length || intent.locationTokens.some(token => locationText.includes(token.toLowerCase()));
        const idOk = !intent.idTokens.length || productIdMatch || idSkuMatches.length > 0;
        const saleOk =
          intent.saleIntent === "all" ||
          (intent.saleIntent === "onSale" && (product.saleStatus || "").includes("售卖中")) ||
          (intent.saleIntent === "offline" && !(product.saleStatus || "").includes("售卖中"));
        const productTokenOk = !intent.productTokens.length || intent.productTokens.every(token => textHasToken(productText, token));
        let skuMatches = skus.filter(sku => {
          const skuText = skuSearchText(sku);
          const skuTokenOk = !intent.skuTokens.length || intent.skuTokens.some(token => textHasToken(skuText, token));
          const timeOk = !intent.timeTokens.length || intent.timeTokens.includes("全部场次") || intent.timeTokens.some(token => textMatchesTimeToken(skuText, token));
          return skuTokenOk && timeOk;
        });
        if (idSkuMatches.length) {
          const idKeys = new Set(idSkuMatches.map(sku => sku.resourceId || sku.id || sku.packageId || sku.name));
          skuMatches = skuMatches.filter(sku => idKeys.has(sku.resourceId || sku.id || sku.packageId || sku.name));
          if (!skuMatches.length) skuMatches = idSkuMatches;
        }
        if (productIdMatch && !skuMatches.length && !intent.skuTokens.length && !intent.timeTokens.length) skuMatches = skus;
        const skuOk = (!intent.skuTokens.length && !intent.timeTokens.length && !idSkuMatches.length) || skuMatches.length > 0;
        if (categoryOk && accountOk && locationOk && idOk && saleOk && productTokenOk && skuOk) {
          productMatches.push(product);
          skuMatches.forEach(sku => skuLines.push({
          productId,
          skuId: sku.resourceId || sku.id || sku.packageId || sku.name || "",
          skuName: sku.name || sku.packageInventoryName || "",
          packageId: sku.packageId || "",
          resourceId: sku.resourceId || "",
          key: `${productId}::${sku.resourceId || sku.packageId || sku.id || sku.name || sku.packageInventoryName || ""}`
          }));
        }
      });
      const skuText = skuLines.map(item => item.resourceId || item.skuId || item.packageId || item.skuName).filter(Boolean).join("\n");
      const productIds = productMatches.map(productKey);
      return {
        intent,
        products: productMatches,
        skuLines,
        productIds,
        skuText,
        selectedProductIds: new Set(productIds),
        selectedSkuKeys: new Set(skuLines.map(item => item.key))
      };
    }

    function selectedAiProductIds(result = state.aiScopeResult) {
      if (!result) return [];
      const selected = result.selectedProductIds || new Set(result.productIds || []);
      return result.productIds.filter(id => selected.has(id));
    }

    function selectedAiSkuLines(result = state.aiScopeResult) {
      if (!result) return [];
      const selected = result.selectedSkuKeys || new Set((result.skuLines || []).map(item => item.key));
      return (result.skuLines || []).filter(item => selected.has(item.key));
    }

    function copyTextToClipboard(text, successText) {
      const value = String(text || "").trim();
      if (!value) return showToast("当前没有可复制的 ID");
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(value).then(() => showToast(successText)).catch(() => fallbackCopyText(value, successText));
      } else {
        fallbackCopyText(value, successText);
      }
    }

    function fallbackCopyText(text, successText) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
      showToast(successText);
    }

    function copyAiScopeIds(type) {
      const result = state.aiScopeResult;
      if (!result) return showToast("请先识别范围");
      if (type === "products") {
        copyTextToClipboard(selectedAiProductIds(result).join("\n"), "已复制产品 ID");
        return;
      }
      const skuIds = selectedAiSkuLines(result).map(item => item.resourceId || item.skuId || item.packageId || item.skuName).filter(Boolean);
      copyTextToClipboard(skuIds.join("\n"), "已复制资源 ID");
    }

    function aiScopeSummary(result) {

      const tokens = [];
      const intent = result.intent;

      const selectedSkus = selectedAiSkuLines(result);
      if (intent.accountNames?.length) tokens.push(`账号：${intent.accountNames.join("、")}`);
      if (intent.locationTokens?.length) tokens.push(`城市：${intent.locationTokens.join("、")}`);
      if (intent.categoryTokens.length) tokens.push(`品类：${intent.categoryTokens.join("、")}`);
      if (intent.productTokens.length) tokens.push(`产品：${intent.productTokens.join("、")}`);
      if (intent.skuTokens.length) tokens.push(`SKU：${intent.skuTokens.join("、")}`);
      if (intent.timeTokens.length) {
        const timeLabel = intent.timeTokens.map(token => {
          if (token === "上午") return "上午(0-12)";
          if (token === "下午") return "下午(12-18)";
          if (token === "夜场") return "夜场(18-24)";
          return token;
        });
        tokens.push(`场次：${timeLabel.join("、")}`);
      }
      if (intent.actionTokens.length) tokens.push(`动作：${intent.actionTokens.join("、")}`);

      return `

          <div class="ai-token-row">${tokens.length ? tokens.map(token => `<span class="ai-token">${token}</span>`).join("") : `<span class="ai-token">按整句搜索</span>`}</div>
          <div class="ai-scope-actions">
            <button class="btn" data-action="toggle-ai-products" data-checked="1">全选产品</button>
            <button class="btn" data-action="toggle-ai-products" data-checked="0">取消产品</button>
            <button class="btn" data-action="toggle-ai-skus" data-checked="1" ${result.skuLines.length ? "" : "disabled"}>全选 SKU</button>
            <button class="btn" data-action="toggle-ai-skus" data-checked="0" ${result.skuLines.length ? "" : "disabled"}>取消 SKU</button>
            <button class="btn primary" data-action="sync-ai-operation" ${selectedProducts.length || selectedSkus.length ? "" : "disabled"}>同步到待操作</button>
            <button class="btn" data-action="copy-ai-products">复制产品ID</button>
            <button class="btn" data-action="copy-ai-skus" ${selectedSkus.length ? "" : "disabled"}>复制资源ID</button>
          </div>
          <div class="ai-selection-grid">
            <div class="ai-selection-group">
              <h4>产品范围</h4>
              ${result.products.map(product => {
                const id = productKey(product);
                return `
                  <label class="ai-selection-item">
                    <input type="checkbox" data-ai-product="${id}" ${result.selectedProductIds?.has(id) ? "checked" : ""} />
                    <span>
                      <strong>${product.title || "-"}</strong>
                      <small>${accountName(product.accountId)} · ${id} · ${product.category || "-"} · ${product.venue || "-"} · ${product.location || "-"} · ${product.saleStatus || "-"}</small>
                    </span>
                  </label>
                `;
              }).join("") || `<div class="empty"><strong>未命中产品</strong>换一种描述试试。</div>`}
            </div>
            ${result.skuLines.length ? `
              <div class="ai-selection-group">
                <h4>SKU 范围</h4>
                ${result.skuLines.map(item => {
                  const product = products.find(row => productKey(row) === item.productId);
                  return `
                    <label class="ai-selection-item">
                      <input type="checkbox" data-ai-sku="${item.key}" ${result.selectedSkuKeys?.has(item.key) ? "checked" : ""} />
                      <span>
                        <strong>${item.skuName || item.skuId || "-"}</strong>
                        <small>套餐 ${item.packageId || "-"} · 资源 ${item.resourceId || item.skuId || "-"} · ${accountName(product?.accountId)} · ${item.productId} · ${product?.title || "-"}</small>
                      </span>
                    </label>
                  `;
                }).join("")}
              </div>
            ` : ""}
          </div>
        </div>
      `;
    }

    function runAiScopePreview() {
      const intent = parseAiScopeIntent(state.aiScopeText);
      state.aiScopeResult = matchAiScope(intent);
      syncAiScopeToOperation({ silent: true });
      renderAll();
    }

    function syncAiScopeToOperation({ silent = false } = {}) {
      const result = state.aiScopeResult;
      if (!result) return false;
      const productIds = selectedAiProductIds(result);
      const skuLines = selectedAiSkuLines(result);
      state.priceSelectedProductIds = new Set(productIds);
      if (result.intent.accountIds?.length === 1) {
        state.productAccountFilter = result.intent.accountIds[0];
      }
      if (skuLines.length) {
        state.priceSkuScope = "custom";
        state.priceSkuText = uniqueValues(skuLines.map(item => item.resourceId || item.skuId || item.packageId || item.skuName).filter(Boolean)).join("\n");
      } else if (productIds.length && state.priceSkuScope === "custom") {
        state.priceSkuScope = "all";
        state.priceSkuText = "";
      }
      if (!silent) showToast(`已同步到待操作：${productIds.length} 个产品${skuLines.length ? `、${skuLines.length} 个资源` : ""}`);
      return true;
    }

    function applyAiScopeSelection() {
      const result = state.aiScopeResult || matchAiScope(parseAiScopeIntent(state.aiScopeText));
      if (!result.products.length) return showToast("没有匹配到产品或 SKU");
      state.aiScopeResult = result;
      syncAiScopeToOperation();
      renderAll();
    }

    function productKey(product) {
      return String(product.productId || product.id || "");
    }

    function resourceTotal(product) {
      return (product.onSaleResourceCount || 0) + (product.offSaleResourceCount || 0) + (product.skus?.length || 0);
    }

    function filteredPriceProducts() {
      const keyword = state.priceSearch.trim();
      const sourceProducts = state.page === "products" ? productsForChannel(state.productChannel) : products;
      return sourceProducts.filter(product => {
        const keywordOk = productMatchesKeyword(product, keyword);
        const accountOk = state.priceAccountFilter === "all" || product.accountId === state.priceAccountFilter;
        const categoryOk = state.priceCategoryFilter === "all" || product.category === state.priceCategoryFilter;
        const saleOk =
          state.priceSaleFilter === "all" ||
          (state.priceSaleFilter === "onSale" && (product.onSaleResourceCount || 0) > 0) ||
          (state.priceSaleFilter === "offline" && (product.onSaleResourceCount || 0) === 0) ||
          (state.priceSaleFilter === "hasOffline" && (product.offSaleResourceCount || 0) > 0);
        return keywordOk && accountOk && categoryOk && saleOk;
      });
    }

    function selectedPriceProducts() {
      const sourceProducts = state.page === "products" ? productsForChannel(state.productChannel) : products;
      return sourceProducts.filter(product => state.priceSelectedProductIds.has(productKey(product)));
    }

    function activeOperationAccountFilter() {
      return state.page === "products" ? state.productAccountFilter : state.priceAccountFilter;
    }

    function resourceIdsFromText(value) {
      return identifierTokens(value);
    }

    function productsForResourceIds(ids) {
      const idSet = new Set(ids.map(String));
      const sourceProducts = state.page === "products" ? productsForChannel(state.productChannel) : products;
      return sourceProducts.filter(product => (product.skus || []).some(sku => {
        const values = [sku.resourceId, sku.id, sku.packageId].map(value => String(value || ""));
        return values.some(value => idSet.has(value));
      }));
    }

    function syncResourceTextToSelection({ silent = false } = {}) {
      const ids = resourceIdsFromText(state.priceSkuText);
      if (!ids.length) return false;
      const matched = productsForResourceIds(ids);
      if (!matched.length) return false;
      matched.forEach(product => state.priceSelectedProductIds.add(productKey(product)));
      const accountIds = uniqueValues(matched.map(product => product.accountId).filter(Boolean));
      if (accountIds.length === 1) {
        state.productAccountFilter = accountIds[0];
        state.priceAccountFilter = accountIds[0];
      }
      if (!silent) showToast(`已按资源 ID 匹配到 ${matched.length} 个产品`);
      return true;
    }

    function renderPricePreview() {

      return `

            <span class="metric-pill">异常 ${errors.length}</span>
          </div>
          ${errors.length ? `<div class="notice warn">${errors.slice(0, 3).map(item => `${escapeHtml(item.productId || "")}：${escapeHtml(item.message || "")}`).join("<br>")}</div>` : ""}
          ${shownRows.length ? `
            <div class="mini-table-wrap">
              <table class="mini-table">
                <thead><tr><th>产品</th><th>套餐/资源</th><th>日期</th><th>售卖</th><th>卖价</th><th>底价</th><th>库存</th><th>拟操作</th></tr></thead>
                <tbody>
                  ${shownRows.map(row => `
                    <tr>
                      <td><span class="id-badge">${escapeHtml(row.productId)}</span><div>${escapeHtml(row.productTitle || "")}</div></td>
                      <td><strong>${escapeHtml(row.resourceId || row.packageId || "")}</strong><div class="subtle-cell">${escapeHtml(row.resourceName || row.packageName || "")}</div></td>

    function formatDay(value) {

    function previewPlannedText(row) {

                      <option value="all" ${state.priceSkuScope === "all" ? "selected" : ""}>全部 SKU / 资源</option>
                      <option value="onSale" ${state.priceSkuScope === "onSale" ? "selected" : ""}>仅售卖中资源</option>
                      <option value="custom" ${state.priceSkuScope === "custom" ? "selected" : ""}>指定 SKU / 资源 ID</option>
                    </select>
                  </div>
                  ${state.priceSkuScope === "custom" ? `<div class="field"><label>指定 SKU / 资源 ID</label><textarea id="priceSkuText" placeholder="每行一个资源 ID。开关库存会按携程批量开关班的资源维度提交。">${state.priceSkuText}</textarea></div>` : ""}
                  <div class="two-col">
                    <div class="field"><label>开始日期</label><input id="priceDateStart" type="date" value="${state.priceDateStart}" /></div>

                  ${["openInventory", "closeInventory"].includes(state.priceOperationType) ? `<div class="notice">开/关库存会优先使用携程产品列表页的“批量开关班”：全部范围按产品维度提交，指定 SKU / 资源 ID 按资源维度提交；如果批量入口失败，后台再转为逐产品兜底执行。</div>` : ""}

                <div class="op-section">

    function renderProductCard(product) {
      const dirty = product.status === "pending";
      const productId = product.id || product.productId || "";
      const skus = product.skus || [];
      return `
        <article class="product-card ${dirty ? "dirty" : ""} ${product.status === "failed" ? "failed" : ""}" data-product="${productId}">
          <div class="product-summary">
            <div>
              <h3 class="product-title">${product.title}</h3>
              <div class="product-meta">

                <span>${accountName(product.accountId)}</span>
                <span>${venueName(product.venueId)}</span>
                <span>${product.updatedAt || product.syncedAt || "-"}</span>
                <span>${skus.length || ((product.onSaleResourceCount || 0) + (product.offSaleResourceCount || 0))} 资源</span>
              </div>
            </div>
            <div class="product-actions">
              <span class="status ${product.saleStatus?.includes("售卖中") ? "ok" : statusClass[product.status] || "pending"}">${product.saleStatus || statusLabel[product.status] || "已同步产品"}</span>
              <button class="btn" data-action="detail" data-product="${productId}">查看详情</button>
              <button class="btn" data-action="sync-product" data-product="${productId}">同步携程</button>

          ${skus.length ? `

            </thead>
            <tbody>
              ${skus.map(sku => `
                <tr>
                  <td><input type="checkbox" data-sku="${sku.id}" ${state.selectedSkuIds.has(sku.id) ? "checked" : ""} /></td>

                  <td><input class="inline-input" type="number" data-edit="price" data-sku="${sku.id}" value="${sku.price}" /> <span class="price">￥${sku.price}</span></td>
                  <td><span class="suggest">￥${sku.suggest}</span></td>
                  <td><input class="inline-input" type="number" data-edit="stock" data-sku="${sku.id}" value="${sku.stock}" /> <span class="stock ${sku.stock <= 2 ? "low" : ""}">${sku.stock}</span></td>
                  <td>${sku.date}</td>
                  <td>${sku.advance}</td>

          ` : `<div class="empty"><strong>已同步产品基础信息</strong>SKU、日期价格和库存明细会在下一步接入“查看明细”后同步。</div>`}
        </article>
      `;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function taskStatusClass(status) {
      if (["成功", "执行完成", "已生成计划"].includes(status)) return "ok";
      if (["执行中", "排队中", "待人工"].includes(status)) return "pending";
      return "failed";
    }

    function taskItemRows(task) {
      const rows = task.items || [];
      if (!rows.length) return `<div class="empty"><strong>暂无执行明细</strong>任务执行后会在这里显示产品或资源级结果。</div>`;
      return `
        <div class="task-detail-panel">
          <div class="task-detail-head">
            <span>执行明细：${rows.length} 条 · 成功 ${rows.filter(item => item.status === "成功").length} 条 · 失败 ${rows.filter(item => item.status !== "成功").length} 条</span>
            <button class="btn" data-action="export-task" data-id="${task.id}">导出本任务结果</button>
          </div>
          <div class="table-wrap task-detail-table" style="box-shadow:none">
            <table>
              <thead><tr><th>状态</th><th>账号</th><th>产品 ID</th><th>资源/SKU ID</th><th>操作</th><th>日期</th><th>接口</th><th>接口汇总</th><th>结果说明</th><th>完成时间</th></tr></thead>
              <tbody>
                ${rows.map(item => `
                  <tr>
                    <td><span class="status ${item.status === "成功" ? "ok" : item.status === "待人工" ? "pending" : "failed"}">${escapeHtml(item.status || "-")}</span></td>
                    <td>${escapeHtml(item.accountName || accountName(item.accountId) || item.accountId || task.accountName || "-")}</td>
                    <td>${escapeHtml(item.productId || "-")}</td>
                    <td><strong>${escapeHtml(item.skuId || item.resourceId || "-")}</strong></td>
                    <td>${escapeHtml(item.selectedSale || task.operationLabel || "-")}</td>
                    <td>${escapeHtml(item.dateStart || task.dateStart || "-")}<br><span class="muted-text">${escapeHtml(item.dateEnd || task.dateEnd || "-")}</span></td>
                    <td>${escapeHtml(item.api || item.batchMode || "-")}</td>
                    <td class="subtle-cell">${item.apiSuccessQuantity !== undefined || item.apiFailQuantity !== undefined ? `成功 ${escapeHtml(item.apiSuccessQuantity ?? "-")} / 失败 ${escapeHtml(item.apiFailQuantity ?? "-")}` : "-"}</td>
                    <td class="subtle-cell">${escapeHtml(item.message || item.error || "-")}</td>
                    <td>${escapeHtml(item.finishedAt || "-")}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderTaskRows(task) {
      const taskResourceCount = task => task.skuScope === "custom" ? String(task.skuText || "").split(/[\s,，;；]+/).filter(Boolean).length : 0;
      const taskProductCount = task => task.productIds?.length || task.productRefs?.length || 0;
      const syncAccountCount = task.targetAccounts?.length || (task.accountId && task.accountId !== "multiple" ? 1 : 0);
      const expanded = state.expandedTaskIds.has(task.id);
      return `
        <tr>
          <td><strong>${escapeHtml(task.name)}</strong><br><small>${escapeHtml(task.id)}</small></td>
          <td>${escapeHtml(task.operationLabel || "-")}</td>
          <td>${escapeHtml(task.accountName || task.accountId || "-")}</td>
          <td>
            ${task.operationType === "sync" ? `<strong>${syncAccountCount}</strong> 个账号` : (task.skuScope === "custom" ? `<strong>${taskResourceCount(task)}</strong> 个资源` : `<strong>${taskProductCount(task)}</strong> 个产品`)}
            <div class="muted-text">${task.operationType === "sync" ? `同步类型：${escapeHtml(task.syncType || "-")}` : (task.skuScope === "all" ? "全部 SKU / 资源" : task.skuScope === "onSale" ? "仅售卖中资源" : "指定 SKU / 资源")}</div>
          </td>
          <td>${escapeHtml(task.dateStart || "-")}<br><span class="muted-text">${escapeHtml(task.dateEnd || "-")}</span></td>
          <td>
            <strong>${escapeHtml(task.progress || 0)}%</strong>
            <div class="progress-track"><div class="progress-fill" style="--progress:${task.progress || 0}%"></div></div>
            <div class="muted-text">${escapeHtml(task.currentStep || "-")}</div>
          </td>
          <td><span class="status ${taskStatusClass(task.status)}">${escapeHtml(task.status || "-")}</span></td>
          <td>${escapeHtml(task.createdAt || "-")}</td>
          <td class="subtle-cell">
            ${escapeHtml(task.error || task.result || "-")}
            ${task.items?.length ? `<div class="muted-text">${task.items.slice(0, 6).map(item => `${escapeHtml(item.skuId || item.productId || "-")}:${escapeHtml(item.status || "-")}`).join("；")}${task.items.length > 6 ? `；还有 ${task.items.length - 6} 条` : ""}</div>` : ""}
          </td>
          <td>
            <div class="actions">
              <button class="btn" data-action="toggle-task-detail" data-id="${task.id}">${expanded ? "收起" : "明细"}</button>
              <button class="btn" data-action="export-task" data-id="${task.id}" ${task.items?.length ? "" : "disabled"}>导出</button>
              <button class="btn" data-action="execute-task" data-id="${task.id}" ${task.status === "执行中" || task.status === "排队中" ? "disabled" : ""}>执行</button>
            </div>
          </td>
        </tr>
        ${expanded ? `<tr class="task-detail-row"><td colspan="10">${taskItemRows(task)}</td></tr>` : ""}
      `;
    }

    function renderTasks() {
      pages.tasks.innerHTML = `
        <div class="panel">
          <div class="panel-head">
            <div>
              <h2>批量任务</h2>
              <small>库存改价任务的后台进度与执行结果</small>
            </div>
            <div class="actions">
              <button class="btn" data-action="export-all-tasks" ${tasks.some(task => task.items?.length) ? "" : "disabled"}>导出全部结果</button>
              <button class="btn" data-action="refresh-tasks" ${BACKEND_BASE ? "" : "disabled"}>刷新任务</button>
              <button class="btn primary" data-page="products">新建批量任务</button>
            </div>
          </div>
          ${tasks.length ? `<div class="table-wrap" style="border:0;box-shadow:none;border-radius:0"><table class="product-table">
            <thead><tr><th>任务名称</th><th>操作</th><th>账号</th><th>范围</th><th>日期</th><th>进度</th><th>状态</th><th>创建时间</th><th>结果</th><th>操作</th></tr></thead>
            <tbody>
              ${tasks.map(renderTaskRows).join("")}
            </tbody>
          </table></div>` : `<div class="empty"><strong>暂无批量任务</strong>在库存改价页选择产品、SKU 范围和日期后，提交的后台任务会显示在这里。</div>`}
        </div>
      `;
    }

    function formatMetricValue(value, options = {}) {
      if (value === null || value === undefined || value === "") return "-";
      const number = Number(value);
      if (Number.isNaN(number)) return value;
      if (options.percent) return `${(number * 100).toFixed(2)}%`;
      return Math.round(number).toLocaleString("zh-CN");
    }

    function formatMomRate(value) {
      if (value === null || value === undefined || value === "") return "-";
      const number = Number(value);
      if (Number.isNaN(number)) return "-";
      const prefix = number > 0 ? "↑" : number < 0 ? "↓" : "";
      return `${prefix} ${(Math.abs(number) * 100).toFixed(2)}%`;
    }

    function filteredTrafficDashboards() {
      return trafficDashboards.filter(item => state.trafficAccountFilter === "all" || item.accountId === state.trafficAccountFilter);
    }

    function trafficPeriodDays() {
      return state.trafficDays === "yesterday" ? 1 : Number(state.trafficDays || 14);
    }

    function trafficPeriodLabel() {
      return state.trafficDays === "yesterday" ? "昨日" : `近 ${trafficPeriodDays()} 天`;
    }

    function visibleTrafficTrend(block) {
      return (block.trend || []).slice(-trafficPeriodDays());
    }

    function trafficRankPeriodKey() {
      return state.trafficDays === "yesterday" ? "yesterday" : String(trafficPeriodDays());
    }

    function periodProductRows(block) {
      return (block.productRanks?.[trafficRankPeriodKey()] || block.products || []);
    }

    function sumMetric(block, metric) {
      const item = (block.summary || []).find(row => row.metric === metric || row.label === metric);
      return Number(item?.value || 0);
    }

    function businessMetrics(block) {
      const trend = visibleTrafficTrend(block);
      const totals = trend.length ? trend.reduce((acc, row) => {
        acc.detailUv += Number(row.detailUv || 0);
        acc.detailPv += Number(row.detailPv || 0);
        acc.bookingUv += Number(row.bookingUv || 0);
        acc.payUsers += Number(row.payUsers || 0);
        return acc;
      }, { detailUv: 0, detailPv: 0, bookingUv: 0, payUsers: 0 }) : {
        detailUv: Number((block.summary || [])[0]?.value || 0),
        detailPv: Number((block.summary || [])[1]?.value || 0),
        bookingUv: Number((block.summary || [])[2]?.value || 0),
        payUsers: Number((block.summary || [])[3]?.value || 0)
      };
      return {
        ...totals,
        bookingRate: totals.detailUv ? totals.bookingUv / totals.detailUv : 0,
        payRate: totals.detailUv ? totals.payUsers / totals.detailUv : 0
      };
    }

    function trafficContextRows() {
      return filteredTrafficDashboards().flatMap(dashboard => (dashboard.businessLines || []).map(block => ({
        dashboard,
        block,
        metrics: businessMetrics(block)
      })));
    }

    function aggregateTraffic() {
      const rows = trafficContextRows();
      const totals = rows.reduce((acc, row) => {
        acc.detailUv += row.metrics.detailUv;
        acc.detailPv += row.metrics.detailPv;
        acc.bookingUv += row.metrics.bookingUv;
        acc.payUsers += row.metrics.payUsers;
        visibleTrafficTrend(row.block).forEach(day => {
          if (!acc.trend[day.date]) acc.trend[day.date] = { date: day.date, detailUv: 0, bookingUv: 0, payUsers: 0 };
          acc.trend[day.date].detailUv += Number(day.detailUv || 0);
          acc.trend[day.date].bookingUv += Number(day.bookingUv || 0);
          acc.trend[day.date].payUsers += Number(day.payUsers || 0);
        });
        periodProductRows(row.block).forEach(product => {
          const key = product.productId || product.productName;
          if (!acc.products[key]) acc.products[key] = { ...product, accountNames: new Set(), businessLabels: new Set(), detailUv: 0, payUsers: 0 };
          acc.products[key].detailUv += Number(product.detailUv || 0);
          acc.products[key].payUsers += Number(product.payUsers || 0);
          acc.products[key].accountNames.add(trafficAccountName(row.dashboard.accountId));
          acc.products[key].businessLabels.add(row.block.label || row.block.businessLine);
        });
        return acc;
      }, { detailUv: 0, detailPv: 0, bookingUv: 0, payUsers: 0, trend: {}, products: {} });
      const trend = Object.values(totals.trend).sort((a, b) => a.date.localeCompare(b.date));
      const products = Object.values(totals.products)
        .map(item => ({ ...item, accountNames: Array.from(item.accountNames), businessLabels: Array.from(item.businessLabels), payRate: item.detailUv ? item.payUsers / item.detailUv : 0 }))
        .sort((a, b) => b.detailUv - a.detailUv);
      const periodDays = trafficPeriodDays();
      const allDates = {};
      rows.forEach(row => (row.block.trend || []).forEach(day => {
        if (!allDates[day.date]) allDates[day.date] = { date: day.date, detailUv: 0 };
        allDates[day.date].detailUv += Number(day.detailUv || 0);
      }));
      const allTrend = Object.values(allDates).sort((a, b) => a.date.localeCompare(b.date));
      const currentPeriod = allTrend.slice(-periodDays).reduce((sum, row) => sum + Number(row.detailUv || 0), 0);
      const previousPeriod = allTrend.slice(-periodDays * 2, -periodDays).reduce((sum, row) => sum + Number(row.detailUv || 0), 0);
      return {
        ...totals,
        trend,
        products,
        bookingRate: totals.detailUv ? totals.bookingUv / totals.detailUv : 0,
        payRate: totals.detailUv ? totals.payUsers / totals.detailUv : 0,
        periodChange: previousPeriod ? (currentPeriod - previousPeriod) / previousPeriod : null,
        periodCompareLabel: state.trafficDays === "yesterday" ? "较前日" : `较前 ${periodDays} 天`,
        businessCount: rows.length,
        accountCount: new Set(rows.map(row => row.dashboard.accountId)).size
      };
    }

    function sparkline(points, key = "detailUv") {
      const values = points.map(item => Number(item[key] || 0));
      if (!values.length) return `<div class="traffic-sparkline empty-line"></div>`;
      const max = Math.max(...values, 1);
      const width = 260;
      const height = 72;
      const step = values.length > 1 ? width / (values.length - 1) : width;
      const path = values.map((value, index) => {
        const x = index * step;
        const y = height - (value / max) * (height - 10) - 5;
        return `${index ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`;
      }).join(" ");
      return `<svg class="traffic-sparkline" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"><path d="${path}" /></svg>`;
    }

    function renderFunnelModel(aggregate) {
      const stages = [
        { label: "详情页访问", value: aggregate.detailUv, hint: "流量入口" },
        { label: "预订页访问", value: aggregate.bookingUv, hint: "下单意向" },
        { label: "支付人数", value: aggregate.payUsers, hint: "成交结果" }
      ];
      const max = Math.max(stages[0].value || 0, 1);
      return `
        <div class="funnel-model">
          ${stages.map((stage, index) => {
            const previous = index ? stages[index - 1].value : stage.value;
            const stageRate = previous ? stage.value / previous : 0;
            const totalRate = max ? stage.value / max : 0;
            const drop = Math.max(0, previous - stage.value);
            const width = Math.max(index === 0 ? 96 : 22, totalRate * 96);
            return `
              <div class="funnel-stage" style="--funnel-width:${width}%;--delay:${index * 120}ms">
                <div class="funnel-stage-main">
                  <div class="funnel-shape">
                    <span>${stage.label}</span>
                    <strong>${formatMetricValue(stage.value)}</strong>
                  </div>
                  <div class="funnel-stage-meta">
                    <b>${index ? formatMetricValue(stageRate, { percent: true }) : "100.00%"}</b>
                    <small>${stage.hint}${index ? ` · 流失 ${formatMetricValue(drop)}` : ""}</small>
                  </div>
                </div>
                ${index < stages.length - 1 ? `<div class="funnel-connector"><i></i></div>` : ""}
              </div>
            `;
          }).join("")}
          <div class="funnel-summary-line">
            <span>详情页 → 支付总转化</span>
            <strong>${formatMetricValue(aggregate.payRate, { percent: true })}</strong>
          </div>
        </div>
      `;
    }

    function persistAccounts() {
      try {
        localStorage.setItem("ctripAccounts", JSON.stringify(accounts));
      } catch (error) {
        showToast("当前浏览器不允许本地保存，刷新后账号记录可能丢失");

    async function loadBackendAccounts() {
      if (!BACKEND_BASE) return accounts;
      try {
        const data = await backendGet("/api/accounts/list");
        const backendAccounts = data.accounts || [];
        backendAccounts.forEach(account => {
          const existing = accounts.find(item => item.id === account.id);
          if (existing) Object.assign(existing, account, { name: existing.name || account.name });
          else accounts.push(account);
        });
        if (backendAccounts.length) {
          persistAccounts();
          renderAll();
        }
      } catch (error) {
        console.warn("加载后端账号失败", error);
      } finally {
        state.accountsLoaded = true;
      }
      return accounts;
    }

    function nowText() {
      return new Date().toLocaleString("zh-CN", { hour12: false });
    }

    async function backendGet(path, params = {}) {
      if (!BACKEND_BASE) throw new Error("当前页面不是从本地后端打开的");
      const url = new URL(path, BACKEND_BASE);
      Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, value));
      const response = await fetch(url);
      const data = await response.json();
      if (!response.ok || data.ok === false) throw new Error(data.error || "后端请求失败");
      return data;
    }

    async function backendPost(path, payload = {}) {
      if (!BACKEND_BASE) throw new Error("当前页面不是从本地后端打开的");
      const response = await fetch(new URL(path, BACKEND_BASE), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      if (!response.ok || data.ok === false) throw new Error(data.error || "后端请求失败");
      return data;
    }

    async function startBackendLogin(accountId) {
      const account = accounts.find(item => item.id === accountId);
      if (!account) return;
      const channel = accountChannel(account);
      try {
        account.login = "等待登录";
        account.lastLoginAt = nowText();
        persistAccounts();
        renderAll();
        await backendGet("/api/login/start", {
          accountId,
          channel: channel.id,
          name: account.name || "",
          shopName: account.shopName || "",
          phone: account.phone || "",
          remark: account.remark || ""
        });
        showToast(`后端已打开${channel.label}登录窗口`);
      } catch (error) {
        showToast(error.message || "后端打开登录失败");
      }
    }

    async function captureBackendCookie(accountId) {
      const account = accounts.find(item => item.id === accountId);
      if (!account) return;
      const channel = accountChannel(account);
      try {
        showToast("正在检查后端 Cookie");
        const summary = await backendGet("/api/session/capture", {
          accountId,
          channel: channel.id,
          name: account.name || "",
          shopName: account.shopName || "",
          phone: account.phone || "",
          remark: account.remark || ""
        });
        account.sessionSummary = summary;
        account.channel = summary.channel || channel.id;
        account.channelLabel = summary.channelLabel || channel.label;
        account.loginUrl = summary.loginUrl || channel.loginUrl;
        account.sessionRef = summary.recorded ? "后端已记录会话" : "";
        account.login = summary.recorded ? "已授权" : "等待登录";
        account.authorizedAt = summary.recorded ? summary.updatedAt : "";
        logs.unshift({
          time: nowText(),
          user: "admin",
          account: account.name,
          product: "-",
          sku: "-",
          type: "检查 Cookie",
          before: "-",
          after: summary.recorded ? `${summary.cookieCount} 个 Cookie` : "未记录",
          result: summary.recorded ? "成功" : "失败"
        });
        persistAccounts();
        renderAll();
        if (summary.recorded) {
          showToast(`后端已记录 ${summary.cookieCount} 个 Cookie`);
        } else {
          showToast(`还没检查到${channel.label} Cookie，请确认后端打开的窗口已登录`);
        }
      } catch (error) {
        showToast(error.message || "检查 Cookie 失败");
      }
    }

    function currentChannelProductLoadAccounts() {
      const scopedAccounts = channelAccounts(state.productChannel);
      const readyAccounts = scopedAccounts.filter(account => account.login === "已授权" || account.sessionSummary?.recorded || account.sessionRef);
      return readyAccounts.length ? readyAccounts : scopedAccounts;
    }

    function summarizeProductLoads(loads) {
      const loaded = loads.filter(item => item.data);
      const productCount = loaded.reduce((sum, item) => sum + (item.data.products || []).length, 0);
      const totalHint = loaded.reduce((sum, item) => sum + Number(item.data.totalHint || item.data.total || (item.data.products || []).length || 0), 0);
      const synced = loaded
        .filter(item => item.data.syncedAt)
        .map(item => `${item.account.name} ${item.data.syncedAt}`);
      return {
        productCount,
        totalHint,
        syncedAt: synced.length ? synced.join("；") : ""
      };
    }

    async function loadBackendProducts(showMessage = true) {
      const loadAccounts = allProductLoadAccounts();
      if (!loadAccounts.length) {
        if (showMessage) showToast("请先添加并授权账号");
        state.productsLoaded = true;
        renderAll();
        return;
      }
      try {

    function parseCsvLine(line) {
      const cells = [];
      let cell = "";
      let quoted = false;
      for (let index = 0; index < line.length; index += 1) {
        const char = line[index];
        if (char === '"' && quoted && line[index + 1] === '"') {
          cell += '"';
          index += 1;
        } else if (char === '"') {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          cells.push(cell);
          cell = "";
        } else {
          cell += char;
        }
      }
      cells.push(cell);
      return cells.map(value => value.trim());
    }

    function parseTrafficCsv(text) {
      const lines = text.replace(/^\ufeff/, "").split(/\r?\n/).filter(line => line.trim());
      if (lines.length < 2) return [];
      const headers = parseCsvLine(lines[0]).map(item => item.trim());
      return lines.slice(1).map(line => {
        const values = parseCsvLine(line);
        const row = {};
        headers.forEach((header, index) => row[header] = values[index] ?? "");
        return row;
      }).filter(row => row.channel && row.date);
    }

    function applyBulk() {
      const selected = Array.from(state.selectedSkuIds);
      const mode = document.querySelector("#bulkMode")?.value || "setPrice";
      const value = Number(document.querySelector("#bulkValue")?.value || 0);
      if (!selected.length) return showToast("请先选择 SKU");
      if (mode !== "offline" && (!value || value < 0)) return showToast("请输入有效数值");
      confirmAction("确认批量修改", `即将对 <strong>${selected.length}</strong> 个 SKU 执行批量操作。修改后会进入待同步状态，不会立即提交携程。`, () => {
        selected.forEach(skuId => {
          const sku = getSku(skuId);
          const product = getProductBySku(skuId);
          if (!sku || !product) return;
          const before = mode === "setStock" ? sku.stock : sku.price;
          if (mode === "setPrice") sku.price = value;
          if (mode === "increaseAmount") sku.price += value;
          if (mode === "decreaseAmount") sku.price = Math.max(0, sku.price - value);
          if (mode === "increasePercent") sku.price = Math.round(sku.price * (1 + value / 100));
          if (mode === "setStock") sku.stock = value;
          if (mode === "offline") sku.state = "停售";
          product.status = "pending";
          logs.unshift({
            time: new Date().toLocaleString("zh-CN", { hour12: false }),
            user: "admin",
            account: accountName(product.accountId),
            product: product.title.slice(0, 14),
            sku: sku.id,
            type: mode === "setStock" ? "改库存" : mode === "offline" ? "上下架" : "改价",
            before,
            after: mode === "setStock" ? sku.stock : mode === "offline" ? "停售" : sku.price,
            result: "成功"
          });
        });
        state.selectedSkuIds.clear();
        closeModal();
        renderAll();
        showToast("已应用，相关产品进入待同步状态");

    function buildPriceOperationPayload({ requireValue = true } = {}) {

      const operationAccountFilter = activeOperationAccountFilter();
      if (resourceModeSubmit && !selected.length && operationAccountFilter === "all") throw new Error("按资源 ID 操作时请先选择具体账号");
      if (!state.priceDateStart || !state.priceDateEnd || state.priceDateStart > state.priceDateEnd) throw new Error("请选择有效日期范围");
      if (state.priceSkuScope === "custom" && !state.priceSkuText.trim()) throw new Error("请填写指定 SKU / 资源 ID");
      if (requireValue && PRICE_OPERATION_TYPES.includes(state.priceOperationType) && state.priceValue === "") throw new Error("请填写价格数值");
      const operationLabels = {
        setPrice: "设置价格",
        adjustPrice: "定额调价",
        percentPrice: "百分比调价",
        openInventory: "开库存",
        closeInventory: "关库存"
      };
      const accountIds = resourceModeSubmit && !selected.length ? [operationAccountFilter] : uniqueValues(selected.map(product => product.accountId));

      const resourceOnly = resourceModeSubmit && !selected.length;
      const targetCount = resourceOnly ? resourceCount : selected.length;
      return {
        selected,
        resourceModeSubmit,
        accountIds,
        accountLabel,
        targetCount,
        targetUnit: resourceOnly ? "个资源" : "个产品",
        payload: {
          name: `${operationLabels[state.priceOperationType]} · ${targetCount} ${resourceOnly ? "个资源" : "个产品"}`,

          stockValue: state.stockValue,
          inventoryAction: state.priceOperationType === "closeInventory" ? "close" : "open"
        }
      };
    }

    function renderPricePreviewModal(preview, taskData) {
      const rows = preview.rows || [];
      const errors = preview.errors || [];
      const shownRows = rows.slice(0, 160);
      const priceRows = rows.filter(row => row.plannedPrice !== "" && row.plannedPrice !== undefined);
      const oldPrices = priceRows.map(row => Number(row.salePrice)).filter(value => Number.isFinite(value));
      const newPrices = priceRows.map(row => Number(row.plannedPrice)).filter(value => Number.isFinite(value));
      const minOld = oldPrices.length ? Math.min(...oldPrices) : "-";
      const maxOld = oldPrices.length ? Math.max(...oldPrices) : "-";
      const minNew = newPrices.length ? Math.min(...newPrices) : "-";
      const maxNew = newPrices.length ? Math.max(...newPrices) : "-";
      return `
        <div class="preview-summary">
          <div class="result-metric"><span>预览明细</span><strong>${preview.rowCount || rows.length}</strong></div>
          <div class="result-metric"><span>涉及产品</span><strong>${preview.productCount || taskData.targetCount}</strong></div>
          <div class="result-metric"><span>改前价格</span><strong>${minOld}-${maxOld}</strong></div>
          <div class="result-metric"><span>改后价格</span><strong>${minNew}-${maxNew}</strong></div>
        </div>
        <div class="helper-text">请确认改后价格无误。点击确认后才会创建后台任务，取消则不会提交。</div>
        ${shownRows.length ? `
          <div class="mini-table-wrap">
            <table class="mini-table">
              <thead><tr><th>账号/产品</th><th>资源</th><th>日期</th><th>改前售价</th><th>底价</th><th>改后售价</th><th>变化</th><th>库存</th></tr></thead>
              <tbody>
                ${shownRows.map(row => {
                  const before = Number(row.salePrice);
                  const after = Number(row.plannedPrice);
                  const delta = Number.isFinite(before) && Number.isFinite(after) ? after - before : 0;
                  return `
                    <tr>
                      <td><strong>${escapeHtml(row.productId || "")}</strong><div class="subtle-cell">${escapeHtml(row.productTitle || "")}</div></td>
                      <td><span class="id-badge">${escapeHtml(row.resourceId || row.packageId || "")}</span><div class="subtle-cell">${escapeHtml(row.resourceName || row.packageName || "")}</div></td>
                      <td>${formatDay(row.day)}</td>
                      <td>${row.salePrice ?? "-"}</td>
                      <td>${row.costPrice ?? "-"}${row.belowCost ? `<div class="subtle-cell" style="color:#dc2626">低于底价</div>` : ""}</td>
                      <td><strong>${row.plannedPrice ?? "-"}</strong></td>
                      <td><span class="preview-delta ${delta > 0 ? "up" : delta < 0 ? "down" : ""}">${delta ? (delta > 0 ? "+" : "") + formatMoney(delta) : "0"}</span></td>
                      <td>${row.total ?? "-"} / ${row.unUsed ?? "-"}</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
          ${rows.length > shownRows.length ? `<div class="helper-text">已展示前 ${shownRows.length} 条，后台任务会按完整 ${rows.length} 条处理。</div>` : ""}
        ` : `<div class="empty"><strong>没有可改价明细</strong>请检查产品、资源 ID、日期范围和库价是否已同步。</div>`}
        ${errors.length ? `<div class="notice warn">预览中有 ${errors.length} 个错误：${errors.slice(0, 6).map(error => `${escapeHtml(error.productId || "-")} ${escapeHtml(error.message || "")}`).join("；")}${errors.length > 6 ? "；..." : ""}</div>` : ""}
      `;
    }

    async function createBackendTask(payload) {
      await backendPost("/api/tasks/create", payload);
      await loadBackendTasks(false);

      state.pricePreview = null;

    async function previewHolidayPrice() {
      if (!BACKEND_BASE) return showToast("请从本地后端地址打开页面后再预览");
      try {
        const { payload } = buildPriceOperationPayload({ requireValue: false });
        if (payload.accountId === "multiple") return showToast("改价预览请先筛选到单个账号");
        state.pricePreviewLoading = true;
        state.pricePreview = null;
        renderAll();
        showToast("正在读取改价预览");
        const data = await backendPost("/api/price/holiday-preview", payload);
        state.pricePreview = data;
        renderAll();
        showToast(`已预览 ${data.rowCount || 0} 条价格库存`);
      } catch (error) {
        showToast(error.message || "预览失败");
      } finally {
        state.pricePreviewLoading = false;
        renderAll();
      }
    }

    async function submitPriceTask() {
      if (!BACKEND_BASE) return showToast("请从本地后端地址打开页面后再提交任务");
      if (state.page === "products" && !isCtripProductChannel()) return showToast(`${productChannelInfo().label}批量操作脚本还未接入`);
      let taskData;
      try {
        taskData = buildPriceOperationPayload({ requireValue: true });
      } catch (error) {
        return showToast(error.message);
      }
      const { payload, accountLabel, targetCount, targetUnit } = taskData;
      if (PRICE_OPERATION_TYPES.includes(payload.operationType)) {
        if (payload.accountId === "multiple") return showToast("价格类任务请先筛选到单个账号后再预览提交");
        try {
          state.pricePreviewLoading = true;
          state.pricePreview = null;
          renderAll();
          showToast("正在生成改价预览");
          const preview = await backendPost("/api/price/holiday-preview", payload);
          state.pricePreview = preview;
          renderAll();
          confirmAction("确认改价预览", renderPricePreviewModal(preview, taskData), async () => {
            closeModal();
            try {
              await createBackendTask(payload);
            } catch (error) {
              showToast(error.message || "创建任务失败");
            }
          }, { preview: true });
        } catch (error) {
          showToast(error.message || "生成改价预览失败");
        } finally {
          state.pricePreviewLoading = false;
          renderAll();
        }
        return;
      }

      confirmAction("提交后台任务", `
        将为 <strong>${targetCount}</strong> ${targetUnit}创建 <strong>${payload.operationLabel}</strong> 任务。<br>
        账号：${accountLabel}<br>
        日期范围：${state.priceDateStart} 至 ${state.priceDateEnd}<br>
        SKU 范围：${state.priceSkuScope === "all" ? "全部 SKU / 资源" : state.priceSkuScope === "onSale" ? "仅售卖中资源" : "指定 SKU / 资源 ID"}<br><br>
        任务会进入后台队列，并在“批量任务”页反馈进度和结果。
      `, async () => {
        closeModal();
        try {
          await createBackendTask(payload);
        } catch (error) {
          showToast(error.message || "创建任务失败");
        }
      });
    }

    async function executeExistingTask(taskId) {

      if (state.page === "tasks") loadBackendTasks(true);
      else if (state.page === "products" || state.page === "price") loadBackendProducts(true);
      else if (state.page === "traffic") loadBackendTraffic(true);
      else showToast("状态已刷新");
    });

    try {
      renderAll();
      if (BACKEND_BASE) {
        loadBackendAccounts()
          .then(() => loadBackendProducts(false))
          .finally(() => {
            state.bootLoading = false;
            state.accountsLoaded = true;
            state.productsLoaded = true;
            renderAll();
          });
        loadBackendTasks(false);
        loadBackendTraffic(false);
        setInterval(() => {
          if (state.page === "tasks") loadBackendTasks(false);
        }, 3000);
      } else {
        state.bootLoading = false;
        state.accountsLoaded = true;
        state.productsLoaded = true;
      }
    } catch (error) {
      document.querySelector("#page-dashboard").classList.add("active");
      document.querySelector("#page-dashboard").innerHTML = `
        <div class="panel">
          <div class="empty">
            <strong>页面初始化失败</strong>
            ${error.message || error}
          </div>
        </div>
      `;
      console.error(error);
    }
  </script>
</body>
</html>
