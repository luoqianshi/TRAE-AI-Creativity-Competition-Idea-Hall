<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>拿捏测试 · 情绪自我觉察实验</title>
<style>
/* styles.css —— 拿捏测试视觉
   暗色主题，模拟短视频信息流感
   字体优先系统中文字体，避免英文 fallback
*/

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0d12;
  --bg-2: #16161f;
  --bg-3: #1e1e2a;
  --bg-card: #20202c;
  --text: #f0f0f5;
  --text-2: #a0a0b0;
  --text-3: #6a6a7a;
  --accent: #ff4d6d;
  --accent-2: #4dabf7;
  --border: #2a2a38;
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "WenQuanYi Micro Hei", "Helvetica Neue", Arial, sans-serif;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.screen {
  display: none;
  width: 100%;
  height: 100%;
}
.screen.active { display: flex; }

/* ============ 开始页 ============ */
#screen-landing {
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 30%, #2a1530 0%, var(--bg) 70%);
}
.landing-wrap {
  text-align: center;
  padding: 32px 24px;
  max-width: 520px;
}
.landing-badge {
  display: inline-block;
  padding: 6px 14px;
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 100px;
  font-size: 13px;
  letter-spacing: 1px;
  margin-bottom: 28px;
}
.landing-title {
  font-size: 44px;
  font-weight: 800;
  letter-spacing: 1px;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #ff4d6d 0%, #cc5de8 50%, #4dabf7 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.landing-sub {
  font-size: 20px;
  color: var(--text-2);
  margin-bottom: 32px;
  font-weight: 500;
}
.landing-desc {
  color: var(--text-2);
  font-size: 15px;
  line-height: 1.9;
  margin-bottom: 36px;
}
.btn-primary {
  background: linear-gradient(135deg, #ff4d6d 0%, #cc5de8 100%);
  color: #fff;
  border: none;
  padding: 16px 40px;
  font-size: 17px;
  font-weight: 700;
  border-radius: 100px;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 8px 24px rgba(255, 77, 109, 0.35);
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255, 77, 109, 0.45); }
.btn-primary:active { transform: translateY(0); }
.landing-note {
  margin-top: 24px;
  color: var(--text-3);
  font-size: 12px;
}

/* ============ 测试页 ============ */
#screen-test {
  flex-direction: column;
}
.test-top {
  padding: 14px 20px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
}
.timer-block {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 8px;
}
.timer-label { color: var(--text-3); font-size: 13px; }
.timer-num {
  font-size: 32px;
  font-weight: 800;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.timer-unit { color: var(--text-3); font-size: 14px; }
.timer-bar-wrap {
  height: 4px;
  background: var(--bg-3);
  border-radius: 2px;
  overflow: hidden;
}
.timer-bar {
  height: 100%;
  background: linear-gradient(90deg, #ff4d6d, #fcc419);
  width: 100%;
  transition: width 0.1s linear;
}

.test-main {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* 卡片区 */
.card-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 20px;
  overflow: hidden;
}
.card-wrap {
  flex: 1;
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 24px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--border);
}
.card-enter {
  animation: cardIn 0.35s ease;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.card-cat-tag {
  align-self: flex-start;
  padding: 4px 12px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid;
  margin-bottom: 18px;
}
.card-title {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 14px;
}
.card-body {
  font-size: 15px;
  color: var(--text-2);
  line-height: 1.7;
  margin-bottom: 20px;
  flex: 1;
}
.card-meta {
  display: flex;
  gap: 18px;
  color: var(--text-3);
  font-size: 13px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}
.card-dwell {
  position: absolute;
  top: 14px;
  right: 16px;
  font-size: 12px;
  color: var(--text-3);
  background: rgba(0,0,0,0.3);
  padding: 3px 8px;
  border-radius: 6px;
}

/* 动作按钮 */
.action-bar {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  padding: 12px;
  background: var(--bg-2);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.action-btn {
  flex: 1;
  background: var(--bg-3);
  border: none;
  border-radius: 10px;
  padding: 12px 4px;
  color: var(--text);
  cursor: pointer;
  font-family: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: background 0.15s, transform 0.1s;
}
.action-btn:hover { background: #2a2a3a; }
.action-btn:active { transform: scale(0.94); }
.action-icon { font-size: 18px; }
.action-label { font-size: 12px; color: var(--text-2); }

/* AI 面板 */
.ai-panel {
  width: 320px;
  background: var(--bg-2);
  border-left: 1px solid var(--border);
  padding: 18px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.ai-panel-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--accent-2);
  font-weight: 600;
}
.ai-dot {
  width: 8px; height: 8px;
  background: var(--accent-2);
  border-radius: 50%;
  animation: pulse 1.2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
.ai-section-title {
  font-size: 12px;
  color: var(--text-3);
  margin-bottom: 10px;
  letter-spacing: 1px;
}
.cat-bars {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.cat-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}
.cat-bar-label { width: 76px; font-weight: 600; }
.cat-bar-track {
  flex: 1;
  height: 8px;
  background: var(--bg-3);
  border-radius: 4px;
  overflow: hidden;
}
.cat-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.4s ease;
}
.cat-bar-score {
  width: 36px;
  text-align: right;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}
.insights {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.insight-item {
  font-size: 13px;
  color: var(--text);
  background: var(--bg-3);
  padding: 8px 10px;
  border-radius: 8px;
  border-left: 3px solid var(--accent-2);
  animation: insightIn 0.3s ease;
}
@keyframes insightIn {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}

/* 评论浮层 */
.comment-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.comment-overlay.show { display: flex; }
.comment-box {
  background: var(--bg-2);
  width: 100%;
  max-width: 520px;
  border-radius: 16px 16px 0 0;
  padding: 18px;
  animation: sheetUp 0.3s ease;
}
@keyframes sheetUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.comment-head {
  font-weight: 700;
  font-size: 15px;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.comment-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 16px;
}
.comment-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 14px;
}
.comment-user { color: var(--accent-2); font-size: 12px; }
.comment-text { color: var(--text); }
.comment-input {
  color: var(--text-3);
  padding: 10px 12px;
  background: var(--bg-3);
  border-radius: 8px;
  font-size: 14px;
  margin-bottom: 10px;
}
.comment-close {
  width: 100%;
  background: var(--bg-3);
  color: var(--text);
  border: none;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
}

/* ============ 视角选择页 ============ */
#screen-perspective {
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 40%, #1a1530 0%, var(--bg) 70%);
}
.perspective-wrap {
  max-width: 560px;
  width: 100%;
  padding: 32px 24px;
  text-align: center;
}
.persp-title {
  font-size: 32px;
  font-weight: 800;
  margin-bottom: 12px;
}
.persp-sub {
  color: var(--text-2);
  margin-bottom: 28px;
  line-height: 1.7;
}
.perspective-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  text-align: left;
}
.persp-card {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.1s;
}
.persp-card:hover { border-color: var(--accent); transform: translateX(4px); }
.persp-emoji { font-size: 28px; }
.persp-info { flex: 1; }
.persp-name { font-weight: 700; font-size: 16px; margin-bottom: 3px; }
.persp-desc { color: var(--text-2); font-size: 13px; }
.persp-arrow { color: var(--text-3); font-size: 20px; }

/* ============ 报告页 ============ */
#screen-report {
  overflow-y: auto;
  padding: 24px 16px;
  justify-content: center;
}
.report-wrap {
  max-width: 640px;
  width: 100%;
  margin: 0 auto;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 24px;
}
.report-head {
  text-align: center;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.report-title {
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #ff4d6d, #cc5de8);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.report-sub { color: var(--text-2); font-size: 13px; }

.report-section {
  margin-bottom: 24px;
}
.report-section-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 12px;
  padding-left: 10px;
  border-left: 3px solid var(--accent);
}

.report-topcard {
  background: var(--bg-3);
  border: 1px solid;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
}
.report-topcat {
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 8px;
}
.report-topdesc {
  color: var(--text-2);
  font-size: 14px;
  line-height: 1.7;
}
.report-second {
  color: var(--text-2);
  font-size: 13px;
  padding: 8px 0;
}

.report-cat-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  font-size: 13px;
}
.report-cat-rank {
  width: 20px;
  height: 20px;
  background: var(--bg-3);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--text-2);
}
.report-cat-name { width: 96px; font-weight: 600; }
.report-cat-bar-track {
  flex: 1;
  height: 8px;
  background: var(--bg-3);
  border-radius: 4px;
  overflow: hidden;
}
.report-cat-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s ease;
}
.report-cat-num {
  color: var(--text-3);
  font-size: 11px;
  min-width: 110px;
  text-align: right;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.stat-cell {
  background: var(--bg-3);
  border-radius: 10px;
  padding: 14px 8px;
  text-align: center;
}
.stat-num {
  font-size: 22px;
  font-weight: 800;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.stat-label {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 4px;
}

.findings {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.finding-item {
  display: flex;
  gap: 10px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--text);
}
.finding-num {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  background: var(--accent);
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  margin-top: 2px;
}

.trap-box {
  background: var(--bg-3);
  border-left: 3px solid #fcc419;
  padding: 14px 16px;
  border-radius: 0 10px 10px 0;
  color: var(--text);
  font-size: 14px;
  line-height: 1.7;
}

.persp-intro {
  color: var(--text);
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 14px;
}
.trap-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 14px;
}
.trap-item {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.7;
  padding-left: 4px;
}
.persp-advice {
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  color: var(--text);
  font-size: 14px;
  line-height: 1.7;
}

.report-footer {
  text-align: center;
  color: var(--text-2);
  font-size: 14px;
  line-height: 1.8;
  padding: 24px 16px;
  margin-top: 12px;
  border-top: 1px solid var(--border);
}
.restart-btn {
  display: block;
  margin: 0 auto;
  background: var(--bg-3);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 12px 32px;
  border-radius: 100px;
  cursor: pointer;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  transition: background 0.15s;
}
.restart-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ============ 响应式：窄屏 ============ */
@media (max-width: 720px) {
  .ai-panel {
    width: 100%;
    border-left: none;
    border-top: 1px solid var(--border);
    max-height: 38vh;
  }
  .test-main { flex-direction: column; }
  .card-area { padding: 14px; }
  .card-title { font-size: 19px; }
  .action-bar { padding: 8px; gap: 5px; }
  .action-btn { padding: 10px 2px; }
  .action-label { font-size: 11px; }
  .cat-bar-label { width: 72px; }
  .landing-title { font-size: 34px; }
  .stat-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .report-wrap { padding: 20px 16px; }
}
</style>
</head>
<body>

<!-- ===== 开始页 ===== -->
<div id="screen-landing" class="screen active">
  <div class="landing-wrap">
    <div class="landing-badge">模拟短视频信息流 · 情绪自我觉察</div>
    <h1 class="landing-title">拿捏测试</h1>
    <div class="landing-sub">AI 能看出你最容易被哪类内容吸引吗？</div>
    <p class="landing-desc">
      你将刷过一组仿短视频内容卡。<br>
      系统会根据停留、评论、收藏和划走行为，生成一份情绪触发点报告。<br>
      它不评价你，只帮助你看见哪些内容更容易占用注意力、调动情绪。
    </p>
    <button id="btn-start" class="btn-primary">开始测试</button>
    <div class="landing-note">本测试不涉及心理诊断，所有内容均为模拟，不收集任何数据</div>
  </div>
</div>

<!-- ===== 测试页 ===== -->
<div id="screen-test" class="screen">
  <!-- 顶部计时 -->
  <div class="test-top">
    <div class="timer-block">
      <span class="timer-label">测试进度</span>
      <span id="timer" class="timer-num">0/12</span>
      <span class="timer-unit">张</span>
    </div>
    <div class="timer-bar-wrap"><div id="timerBar" class="timer-bar"></div></div>
  </div>

  <div class="test-main">
    <!-- 左：内容卡 -->
    <div class="card-area" id="cardArea">
      <div id="cardWrap" class="card-wrap"></div>
      <!-- 动作按钮 -->
      <div class="action-bar">
        <button id="btn-continue" class="action-btn">
          <span class="action-icon">▶</span><span class="action-label">停留</span>
        </button>
        <button id="btn-swipe" class="action-btn">
          <span class="action-icon">⤴</span><span class="action-label">划走</span>
        </button>
        <button id="btn-comment" class="action-btn">
          <span class="action-icon">💬</span><span class="action-label">评论</span>
        </button>
        <button id="btn-save" class="action-btn">
          <span class="action-icon">⭐</span><span class="action-label">收藏</span>
        </button>
        <button id="btn-wantmore" class="action-btn">
          <span class="action-icon">＋</span><span class="action-label">想看更多</span>
        </button>
      </div>
    </div>

    <!-- 右：AI 实时画像 -->
    <aside class="ai-panel">
      <div class="ai-panel-head">
        <span class="ai-dot"></span>
        <span>AI 正在分析内容反应</span>
      </div>
      <div class="ai-section">
        <div class="ai-section-title">实时触发倾向</div>
        <div id="catBars" class="cat-bars"></div>
      </div>
      <div class="ai-section">
        <div class="ai-section-title">AI 洞察</div>
        <div id="insights" class="insights"></div>
      </div>
    </aside>
  </div>

  <!-- 评论浮层 -->
  <div id="commentOverlay" class="comment-overlay"></div>
</div>

<!-- ===== 视角选择页 ===== -->
<div id="screen-perspective" class="screen">
  <div class="perspective-wrap">
    <h2 class="persp-title">测试完成。</h2>
    <p class="persp-sub">你想从哪个视角解读这份报告？<br>同一套内容反应，可以生成不同版本。</p>
    <div id="perspectiveList" class="perspective-list"></div>
  </div>
</div>

<!-- ===== 报告页 ===== -->
<div id="screen-report" class="screen">
  <div id="reportContent" class="report-wrap"></div>
</div>

<script>
// data.js —— 拿捏测试内容数据库
// 6 个情绪触发点，每类 3 张模拟短视频内容卡

const CATEGORIES = [
  { id: "compare",   name: "比较敏感", color: "#ff9f43", tag: "比较敏感" },
  { id: "approval",  name: "认可渴望", color: "#f06595", tag: "认可渴望" },
  { id: "control",   name: "控制焦虑", color: "#4dabf7", tag: "控制焦虑" },
  { id: "comeback",  name: "逆袭幻想", color: "#cc5de8", tag: "逆袭幻想" },
  { id: "resonance", name: "情绪共鸣", color: "#69db7c", tag: "情绪共鸣" },
  { id: "safety",    name: "安全感缺口", color: "#ffd43b", tag: "安全感缺口" }
];

const CARDS = [
  // 比较敏感：差距、落后、同龄人
  {

<script>
// app.js —— 拿捏测试核心逻辑
// 推荐算法模拟器 + 行为观察者 + 反算法教练 三合一

const STATE = {
  screen: "landing",          // landing | test | perspective | report
  timeLeft: 60,               // 剩余秒数，仅作为演示兜底
  startedAt: 0,               // 测试开始时间戳
  cardsShown: [],             // [{card, action, dwell, step, ts}]
  categoryScores: {},         // {catId: score}
  categoryShown: {},          // {catId: 被推送次数}
  currentCard: null,
  currentCardShowTime: 0,
  predictionStartStep: null,  // 初步画像形成的步骤
  insights: [],               // [{text, ts, step}]
  triggeredThresholds: {},    // {catId_5: true, ...} 防重复触发
  usedCardIds: new Set(),     // 已展示过的卡 id（避免短期重复）
  selectedPerspective: null,
  testTimer: null,
  dwellTimer: null,
  autoAdvanceTimer: null
};

const MAX_CARDS = 12;
const TIME_LIMIT = 60;

// 初始化类别分数
function initScores() {
  STATE.categoryScores = {};
  STATE.categoryShown = {};
  CATEGORIES.forEach(c => {
    STATE.categoryScores[c.id] = 0;
    STATE.categoryShown[c.id] = 0;
  });
}

// ===== 推荐算法模拟器 =====
// 根据当前类别分数 + 温度，计算下一张卡的类别概率
function selectNextCard() {
  const elapsed = TIME_LIMIT - STATE.timeLeft;
  const step = STATE.cardsShown.length;

  // 冷启动：先让用户接触到每一种触发点，避免开局就过早收窄。
  if (step < CATEGORIES.length) {
    const usedCats = new Set(STATE.cardsShown.map(x => x.card.cat));
    const freshCats = CATEGORIES.filter(c => !usedCats.has(c.id));
    const pool = freshCats.length > 0 ? freshCats : CATEGORIES;
    const chosenCat = pool[Math.floor(Math.random() * pool.length)].id;
    return pickCardFromCat(chosenCat);
  }

  // 温度：开始高（探索），随时间降低（利用），但保留底探索保证多样性
  const temp = Math.max(0.55, 1.6 - (elapsed / TIME_LIMIT) * 1.0);

  const scores = CATEGORIES.map(c => STATE.categoryScores[c.id]);
  // base 抬高，避免单个类别过快垄断
  const adjusted = scores.map(s => Math.max(0.3, s + 1.0));
  let exps = adjusted.map(s => Math.exp(s / temp));
  let sum = exps.reduce((a, b) => a + b, 0);
  let probs = exps.map(e => e / sum);

  // 软上限：单个类别最高 45%，超出部分均摊给其它类别，避免锁定死
  const CAP = 0.45;
  for (let pass = 0; pass < 3; pass++) {
    let overflow = 0;
    let capped = probs.slice();
    for (let i = 0; i < capped.length; i++) {
      if (capped[i] > CAP) { overflow += capped[i] - CAP; capped[i] = CAP; }
    }
    if (overflow <= 0) break;
    const others = capped.map((p, i) => p < CAP ? 1 : 0);
    const othersTotal = others.reduce((a, b) => a + b, 0);
    if (othersTotal > 0) {
      for (let i = 0; i < capped.length; i++) {
        if (capped[i] < CAP) capped[i] += overflow * others[i] / othersTotal;
      }
    }
    probs = capped;
  }

  // 按概率选类别
  let r = Math.random();
  let chosenCat = CATEGORIES[0].id;
  for (let i = 0; i < CATEGORIES.length; i++) {
    r -= probs[i];
    if (r <= 0) { chosenCat = CATEGORIES[i].id; break; }
  }
  return pickCardFromCat(chosenCat);
}

function pickCardFromCat(chosenCat) {
  const pool = CARDS.filter(c => c.cat === chosenCat && !STATE.usedCardIds.has(c.id));
  const finalPool = pool.length > 0 ? pool : CARDS.filter(c => c.cat === chosenCat);
  return finalPool[Math.floor(Math.random() * finalPool.length)];
}

// ===== 行为观察者：记录行为 + 更新分数 =====
function recordAction(action, dwell) {
  const card = STATE.currentCard;
  const cat = card.cat;
  const step = STATE.cardsShown.length + 1;

  // 行为 → 分数映射：用行为强度模拟"内容反应"。
  let delta = 0;
  switch (action) {
    case "continue":  delta = 4; break;       // 主动停留
    case "swipe":     delta = (dwell < 1.5 ? -3 : -1); break;
    case "comment":   delta = 8; break;
    case "save":      delta = 15; break;
    case "wantmore":  delta = 20; break;
  }
  if (dwell >= 6) delta += 10;
  else if (dwell >= 3) delta += 6;

  const prev = STATE.cardsShown[STATE.cardsShown.length - 1];
  if (prev && prev.card.cat === cat && action !== "swipe") {
    delta += 8;
  }

  STATE.categoryScores[cat] += delta;
  STATE.categoryShown[cat] = (STATE.categoryShown[cat] || 0) + 1;

  // 记录行为日志
  STATE.cardsShown.push({
    card, action, dwell, step, ts: Date.now(),
    scoreAfter: STATE.categoryScores[cat]
  });

  checkInsights(action, dwell);
  checkPredictionStart();
  updateAIPanel();
  updateProgress();
}

// ===== AI 实时洞察生成 =====
function checkInsights(action, dwell) {
  const cat = STATE.currentCard.cat;
  const catName = CATEGORIES.find(c => c.id === cat).name;
  const step = STATE.cardsShown.length;

  // 停留 > 4 秒
  if (dwell > 4 && !STATE.triggeredThresholds[`dwell_${step}`]) {
    STATE.triggeredThresholds[`dwell_${step}`] = true;
    addInsight(`你在【${catName}】内容上停留了 ${dwell.toFixed(1)} 秒`);
  }

  // 类别分数过 5
  if (STATE.categoryScores[cat] >= 5 && !STATE.triggeredThresholds[`t5_${cat}`]) {
    STATE.triggeredThresholds[`t5_${cat}`] = true;
    addInsight(`你对【${catName}】内容反应开始变明显`);
  }

  // 类别分数过 10
  if (STATE.categoryScores[cat] >= 10 && !STATE.triggeredThresholds[`t10_${cat}`]) {
    STATE.triggeredThresholds[`t10_${cat}`] = true;
    addInsight(`系统正在提高【${catName}】内容权重`);
  }

  // 同类连续行为 3 次
  const recent = STATE.cardsShown.slice(-3);
  if (recent.length === 3 && recent.every(x => x.card.cat === cat)) {
    if (!STATE.triggeredThresholds[`streak_${cat}`]) {
      STATE.triggeredThresholds[`streak_${cat}`] = true;
      addInsight(`你连续 3 次对【${catName}】内容产生反应`);
    }
  }

  // 收藏 / 想看更多
  if (action === "save") {
    addInsight(`你收藏了【${catName}】内容，系统将它视为强反应`);
  }
  if (action === "wantmore") {
    addInsight(`你点了"想看更多"，【${catName}】权重显著上升`);
  }
}

function addInsight(text) {
  STATE.insights.push({
    text,
    ts: Date.now(),
    step: STATE.cardsShown.length
  });
  if (STATE.insights.length > 30) STATE.insights.shift();
  renderInsights();
}

// 检测 AI 是否开始预测用户
function checkPredictionStart() {
  if (STATE.predictionStartStep !== null) return;
  const scores = Object.values(STATE.categoryScores);
  const sum = scores.reduce((a, b) => a + b, 0);
  if (sum <= 0) return;
  const maxScore = Math.max(...scores);
  const confidence = maxScore / sum;
  // 冷启动结束后才判定"集中投放"，避免还在强制多样性时就说开始集中
  if (STATE.cardsShown.length >= CATEGORIES.length && confidence > 0.35) {
    STATE.predictionStartStep = STATE.cardsShown.length;
    addInsight(`系统已识别出初步内容反应画像`);
  }
}

// ===== UI 渲染 =====
function renderInsights() {
  const box = document.getElementById("insights");
  if (!box) return;
  // 只显示最近 6 条，最新在上
  const recent = STATE.insights.slice(-6).reverse();
  box.innerHTML = recent.map((it, i) => {
    const opacity = 1 - i * 0.13;
    return `<div class="insight-item" style="opacity:${opacity}">${it.text}</div>`;
  }).join("");
}

function updateAIPanel() {
  // 类别画像条
  const bars = document.getElementById("catBars");
  if (!bars) return;
  const maxScore = Math.max(0.5, ...Object.values(STATE.categoryScores));
  bars.innerHTML = CATEGORIES.map(c => {
    const s = STATE.categoryScores[c.id];
    const pct = Math.max(2, (s / maxScore) * 100);
    const neg = s < 0;
    return `
      <div class="cat-bar-row">
        <span class="cat-bar-label" style="color:${c.color}">${c.name}</span>
        <div class="cat-bar-track">
          <div class="cat-bar-fill" style="width:${neg ? 2 : pct}%;background:${c.color}"></div>
        </div>
        <span class="cat-bar-score">${s.toFixed(1)}</span>
      </div>`;
  }).join("");
}

// ===== 测试主流程 =====
function startTest() {
  STATE.screen = "test";
  STATE.timeLeft = TIME_LIMIT;
  STATE.cardsShown = [];
  STATE.insights = [];
  STATE.triggeredThresholds = {};
  STATE.usedCardIds = new Set();
  STATE.predictionStartStep = null;
  STATE.startedAt = Date.now();
  initScores();

  showScreen("test");
  updateProgress();
  showNextCard();
  startTimer();
}

function showNextCard() {
  if (STATE.cardsShown.length >= MAX_CARDS) {
    endTest();
    return;
  }
  const card = selectNextCard();
  STATE.currentCard = card;
  STATE.currentCardShowTime = Date.now();
  STATE.usedCardIds.add(card.id);
  renderCard(card);
  startDwellTracking();
  // 10 秒无操作自动记为停留
  clearTimeout(STATE.autoAdvanceTimer);
  STATE.autoAdvanceTimer = setTimeout(() => {
    if (STATE.screen === "test") handleAction("continue", true);
  }, 10000);
}

function renderCard(card) {
  const cat = CATEGORIES.find(c => c.id === card.cat);
  const wrap = document.getElementById("cardWrap");
  wrap.innerHTML = `
    <div class="card-cat-tag" style="background:${cat.color}22;color:${cat.color};border-color:${cat.color}55">
      ${cat.tag}
    </div>
    <div class="card-title">${card.title}</div>
    <div class="card-body">${card.body}</div>
    <div class="card-meta">
      <span>${card.author}</span>
      <span>♥ ${card.likes}</span>
      <span>💬 ${card.comments}</span>
    </div>
    <div class="card-dwell" id="dwellDisplay">0.0s</div>
  `;
  // 卡片切入动画
  wrap.classList.remove("card-enter");
  void wrap.offsetWidth;
  wrap.classList.add("card-enter");
}

function startDwellTracking() {
  clearInterval(STATE.dwellTimer);
  STATE.dwellTimer = setInterval(() => {
    const dwell = (Date.now() - STATE.currentCardShowTime) / 1000;
    const el = document.getElementById("dwellDisplay");
    if (el) el.textContent = `已看 ${dwell.toFixed(1)}s`;
  }, 100);
}

function handleAction(action, isAuto = false) {
  if (STATE.screen !== "test") return;
  const dwell = (Date.now() - STATE.currentCardShowTime) / 1000;
  clearInterval(STATE.dwellTimer);
  clearTimeout(STATE.autoAdvanceTimer);

  // 评论动作：记录行为并打开浮层，关闭浮层后切下一张（避免停留同卡导致后续重复计分）
  if (action === "comment" && !isAuto) {
    recordAction("comment", dwell);
    if (STATE.cardsShown.length >= MAX_CARDS) {
      setTimeout(endTest, 400);
      return;
    }
    openCommentOverlay();
    return;
  }

  recordAction(action, dwell);

  if (STATE.cardsShown.length >= MAX_CARDS) {
    setTimeout(endTest, 250);
    return;
  }

  // 切下一张
  setTimeout(() => {
    if (STATE.screen === "test") showNextCard();
  }, 200);
}

function openCommentOverlay() {
  const card = STATE.currentCard;
  const fakeComments = [
    { user: "用户***28", text: "我也刷到了，看完真的睡不着" },
    { user: "匿名***", text: "评论区都是同款焦虑" },
    { user: "用户***91", text: "细思极恐" },
    { user: "路过***", text: "这条说出了我想说的" }
  ];
  const ov = document.getElementById("commentOverlay");
  ov.innerHTML = `
    <div class="comment-box">
      <div class="comment-head">评论 · ${card.comments}</div>
      <div class="comment-list">
        ${fakeComments.map(c => `
          <div class="comment-item">
            <span class="comment-user">${c.user}</span>
            <span class="comment-text">${c.text}</span>
          </div>`).join("")}
      </div>
      <div class="comment-input">💬 说说你的看法...</div>
      <button class="comment-close" onclick="closeCommentOverlay()">关闭</button>
    </div>`;
  ov.classList.add("show");
}
function closeCommentOverlay() {
  document.getElementById("commentOverlay").classList.remove("show");
  // 关闭评论后切下一张卡，避免停留同卡导致重复计分
  setTimeout(() => {
    if (STATE.cardsShown.length >= MAX_CARDS) {
      endTest();
      return;
    }
    if (STATE.screen === "test") showNextCard();
  }, 200);
}

function startTimer() {
  clearInterval(STATE.testTimer);
  STATE.testTimer = setInterval(() => {
    STATE.timeLeft -= 0.1;
    if (STATE.timeLeft <= 0) {
      STATE.timeLeft = 0;
      endTest();
    }
    updateProgress();
  }, 100);
}

function updateProgress() {
  const el = document.getElementById("timer");
  if (el) el.textContent = `${Math.min(STATE.cardsShown.length, MAX_CARDS)}/${MAX_CARDS}`;
  const bar = document.getElementById("timerBar");
  if (bar) bar.style.width = `${Math.min(100, (STATE.cardsShown.length / MAX_CARDS) * 100)}%`;
}

function endTest() {
  clearInterval(STATE.testTimer);
  clearInterval(STATE.dwellTimer);
  clearTimeout(STATE.autoAdvanceTimer);
  STATE.screen = "perspective";
  showScreen("perspective");
}

// ===== 视角选择 + 报告生成 =====
function choosePerspective(pid) {
  STATE.selectedPerspective = pid;
  STATE.screen = "report";
  generateReport();
  showScreen("report");
}

function generateReport() {
  // 排序类别分数
  const ranked = CATEGORIES.map(c => ({
    ...c,
    score: STATE.categoryScores[c.id],
    shown: STATE.categoryShown[c.id] || 0
  })).sort((a, b) => b.score - a.score);

  const top = ranked[0];
  const second = ranked[1];
  const profile = CAT_PROFILES[top.id];
  const advice = PERSPECTIVE_ADVICE[STATE.selectedPerspective];
  const persp = PERSPECTIVES.find(p => p.id === STATE.selectedPerspective);

  const totalCards = STATE.cardsShown.length;
  const predStep = STATE.predictionStartStep || totalCards;
  const totalDwell = Math.max(0.1, STATE.cardsShown.reduce((s, x) => s + x.dwell, 0));
  const topDwell = STATE.cardsShown.filter(x => x.card.cat === top.id).reduce((s, x) => s + x.dwell, 0);
  const saveCount = STATE.cardsShown.filter(x => x.action === "save").length;
  const wantMoreCount = STATE.cardsShown.filter(x => x.action === "wantmore").length;
  const commentCount = STATE.cardsShown.filter(x => x.action === "comment").length;
  const swipeCount = STATE.cardsShown.filter(x => x.action === "swipe").length;

  // 各类别推送占比
  const catDistHTML = ranked.map((c, i) => `
    <div class="report-cat-row">
      <span class="report-cat-rank">${i + 1}</span>
      <span class="report-cat-name" style="color:${c.color}">${c.tag}</span>
      <div class="report-cat-bar-track">
        <div class="report-cat-bar-fill" style="width:${Math.max(3, (Math.max(0, c.score) / Math.max(1, ranked[0].score)) * 100)}%;background:${c.color}"></div>
      </div>
      <span class="report-cat-num">推送 ${c.shown} 次 · 分数 ${c.score.toFixed(1)}</span>
    </div>`).join("");

  // 行为统计
  const behaviorHTML = `
    <div class="stat-grid">
      <div class="stat-cell"><div class="stat-num">${totalCards}</div><div class="stat-label">完成卡片</div></div>
      <div class="stat-cell"><div class="stat-num">${totalDwell.toFixed(0)}s</div><div class="stat-label">总停留</div></div>
      <div class="stat-cell"><div class="stat-num">${predStep}</div><div class="stat-label">画像形成点</div></div>
      <div class="stat-cell"><div class="stat-num">${saveCount}</div><div class="stat-label">收藏次数</div></div>
      <div class="stat-cell"><div class="stat-num">${wantMoreCount}</div><div class="stat-label">想看更多</div></div>
      <div class="stat-cell"><div class="stat-num">${commentCount}</div><div class="stat-label">打开评论</div></div>
    </div>`;

  // 关键发现
  const findings = [];
  if (topDwell > 0) findings.push(`你在【${profile.label}】相关内容上停留最久，共 ${topDwell.toFixed(1)} 秒，占总停留的 ${(topDwell / totalDwell * 100).toFixed(0)}%`);
  if (saveCount > 0) findings.push(`你收藏了 ${saveCount} 次内容，收藏会被系统视为强反应信号`);
  if (wantMoreCount > 0) findings.push(`你点了 ${wantMoreCount} 次"想看更多"，系统据此提高相似主题权重`);
  findings.push(`系统在第 ${predStep} 次行为后形成初步画像，之后更倾向推荐【${profile.label}】相关内容`);
  findings.push(`你划走了 ${swipeCount} 张内容，系统据此降低了对应主题的权重`);

  document.getElementById("reportContent").innerHTML = `
    <div class="report-head">
      <div class="report-title">你的情绪触发点画像</div>
      <div class="report-sub">视角：${persp.emoji} ${persp.name} · 基于 ${totalCards} 次内容反应生成</div>
    </div>

    <div class="report-section">
      <div class="report-section-title">一、主要情绪触发点</div>
      <div class="report-topcard" style="border-color:${top.color}">
        <div class="report-topcat" style="color:${top.color}">${profile.holdName}</div>
        <div class="report-topdesc">${profile.desc}</div>
      </div>
      <div class="report-second">次要触发点：<span style="color:${second.color}">${CAT_PROFILES[second.id].label}</span></div>
    </div>

    <div class="report-section">
      <div class="report-section-title">二、内容反应分布</div>
      ${catDistHTML}
    </div>

    <div class="report-section">
      <div class="report-section-title">三、关键行为数据</div>
      ${behaviorHTML}
    </div>

    <div class="report-section">
      <div class="report-section-title">四、关键发现</div>
      <div class="findings">
        ${findings.map((f, i) => `<div class="finding-item"><span class="finding-num">${i + 1}</span>${f}</div>`).join("")}
      </div>
    </div>

    <div class="report-section">
      <div class="report-section-title">五、这类内容为什么容易牵动你</div>
      <div class="trap-box">${profile.trap}</div>
    </div>

    <div class="report-section">
      <div class="report-section-title">六、${persp.emoji} ${persp.name}视角解读</div>
      <div class="persp-intro">${advice.intro}</div>
      <div class="trap-list">
        ${advice.traps.map(t => `<div class="trap-item">▸ ${t}</div>`).join("")}
      </div>
      <div class="persp-advice">${advice.advice}</div>
    </div>

    <div class="report-footer">
      这不是心理诊断，也不是评价你。<br>
      它只是帮助你看见：哪些内容更容易占用你的注意力、调动你的情绪。
    </div>
    <button class="restart-btn" onclick="restart()">再测一次</button>
  `;
}

function restart() {
  STATE.selectedPerspective = null;
  STATE.screen = "landing";
  showScreen("landing");
}

// ===== 屏幕切换 =====
function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(`screen-${name}`).classList.add("active");
  if (name === "perspective") renderPerspectives();
}

function renderPerspectives() {
  const box = document.getElementById("perspectiveList");
  box.innerHTML = PERSPECTIVES.map(p => `
    <div class="persp-card" onclick="choosePerspective('${p.id}')">
      <div class="persp-emoji">${p.emoji}</div>
      <div class="persp-info">
        <div class="persp-name">${p.name}</div>
        <div class="persp-desc">${p.desc}</div>
      </div>
      <div class="persp-arrow">→</div>
    </div>`).join("");
}

// 绑定动作按钮
window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("btn-start").addEventListener("click", startTest);
  document.getElementById("btn-continue").addEventListener("click", () => handleAction("continue"));
  document.getElementById("btn-swipe").addEventListener("click", () => handleAction("swipe"));
  document.getElementById("btn-comment").addEventListener("click", () => handleAction("comment"));
  document.getElementById("btn-save").addEventListener("click", () => handleAction("save"));
  document.getElementById("btn-wantmore").addEventListener("click", () => handleAction("wantmore"));

  // 触摸滑动支持
  let touchStartY = null;
  const cardArea = document.getElementById("cardArea");
  cardArea.addEventListener("touchstart", e => { touchStartY = e.touches[0].clientY; });
  cardArea.addEventListener("touchend", e => {
    if (touchStartY === null) return;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (dy < -50) handleAction("swipe");
    touchStartY = null;
  });
});
</script>
