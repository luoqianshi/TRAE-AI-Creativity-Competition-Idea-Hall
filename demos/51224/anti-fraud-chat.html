<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>防诈骗模拟聊天</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ededed;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 顶部导航栏 */
        .header {
            background-color: #1aad19;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: 500;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 5px;
            margin-right: 12px;
            background-color: #2c5aa0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .header-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* 聊天区域 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background-color: #ededed;
        }
        
        .message {
            display: flex;
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-avatar {
            width: 50px;
            height: 50px;
            border-radius: 5px;
            background-color: #2c5aa0;
            flex-shrink: 0;
            overflow: hidden;
        }
        
        .message-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .message-content {
            max-width: 75%;
            margin-left: 12px;
            display: flex;
            flex-direction: column;
        }
        
        .message-sender {
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .message-bubble {
            background-color: white;
            padding: 15px 18px;
            border-radius: 8px;
            font-size: 20px;
            line-height: 1.6;
            color: #333;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .message-bubble::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 15px;
            border-width: 8px;
            border-style: solid;
            border-color: transparent white transparent transparent;
        }
        
        /* 选项区域 */
        .options-container {
            background-color: white;
            padding: 20px 15px;
            border-top: 1px solid #e0e0e0;
        }
        
        .options-title {
            font-size: 18px;
            color: #666;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .option-btn {
            width: 100%;
            padding: 18px 20px;
            margin-bottom: 12px;
            border: 2px solid #1aad19;
            background-color: white;
            color: #1aad19;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }
        
        .option-btn:last-child {
            margin-bottom: 0;
        }
        
        .option-btn:hover {
            background-color: #f0fff0;
        }
        
        .option-btn:active {
            transform: scale(0.98);
        }
        
        /* 弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background-color: white;
            border-radius: 15px;
            padding: 25px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: scaleIn 0.3s ease;
        }
        
        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .modal-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        .modal-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .modal-content {
            font-size: 20px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
        }
        
        .modal-btn {
            padding: 15px 40px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .modal-danger {
            background-color: #ff4d4f;
            color: white;
        }
        
        .modal-success {
            background-color: #52c41a;
            color: white;
        }
        
        .modal-danger:hover {
            background-color: #ff7875;
        }
        
        .modal-success:hover {
            background-color: #73d13d;
        }
        
        /* 用户消息样式 */
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message.user .message-content {
            margin-left: 0;
            margin-right: 12px;
            align-items: flex-end;
        }
        
        .message.user .message-bubble {
            background-color: #95ec69;
        }
        
        .message.user .message-bubble::before {
            left: auto;
            right: -8px;
            border-color: transparent transparent transparent #95ec69;
        }
        
        .message.user .message-avatar {
            background-color: #ccc;
        }
        
        /* 隐藏选项 */
        .options-container.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="header">
        <div class="header-avatar">
            <svg viewBox="0 0 100 100" width="40" height="40">
                <rect width="100" height="100" fill="#1a5f9e"/>
                <ellipse cx="50" cy="35" rx="20" ry="22" fill="#e8c39e"/>
                <ellipse cx="50" cy="80" rx="30" ry="25" fill="#1a4f8e"/>
                <ellipse cx="50" cy="32" rx="18" ry="8" fill="#1a1a1a"/>
                <rect x="35" y="55" width="30" height="8" rx="2" fill="#ffd700"/>
                <rect x="42" y="58" width="16" height="3" fill="#1a1a1a"/>
            </svg>
        </div>
        <span>张警官</span>
    </div>
    
    <!-- 聊天区域 -->
    <div class="chat-container" id="chatContainer">
        <!-- 对方消息 -->
        <div class="message" id="scammerMessage">
            <div class="message-avatar">
                <svg viewBox="0 0 100 100" width="50" height="50">
                    <rect width="100" height="100" fill="#1a5f9e"/>
                    <ellipse cx="50" cy="35" rx="20" ry="22" fill="#e8c39e"/>
                    <ellipse cx="50" cy="80" rx="30" ry="25" fill="#1a4f8e"/>
                    <ellipse cx="50" cy="32" rx="18" ry="8" fill="#1a1a1a"/>
                    <rect x="35" y="55" width="30" height="8" rx="2" fill="#ffd700"/>
                    <rect x="42" y="58" width="16" height="3" fill="#1a1a1a"/>
                </svg>
            </div>
            <div class="message-content">
                <span class="message-sender">张警官</span>
                <div class="message-bubble">
                    您好，我是市公安局张警官，您的银行账户涉嫌洗钱，请配合调查。
                </div>
            </div>
        </div>
    </div>
    
    <!-- 选项区域 -->
    <div class="options-container" id="optionsContainer">
        <div class="options-title">请选择您的回复：</div>
        <button class="option-btn" onclick="selectOption('wrong')">
            A. 啊？我没有啊，需要我怎么配合？
        </button>
        <button class="option-btn" onclick="selectOption('correct')">
            B. 你个骗子，警察办案才不会加微信！
        </button>
        <button class="option-btn" onclick="selectOption('wrong')">
            C. 好的警官，我马上配合，需要转账吗？
        </button>
    </div>
    
    <!-- 错误提示弹窗 -->
    <div class="modal-overlay" id="dangerModal">
        <div class="modal">
            <div class="modal-icon">⚠️</div>
            <div class="modal-title" style="color: #ff4d4f;">防骗警告！</div>
            <div class="modal-content">
                <p><strong>这是典型的冒充公检法诈骗！</strong></p>
                <p style="margin-top: 10px;">公安机关不会通过微信、QQ等社交软件办案，更不会要求转账！</p>
                <p style="margin-top: 10px;">遇到此类情况，请立即：</p>
                <p>1. 挂断电话或拉黑</p>
                <p>2. 拨打110或96110咨询</p>
                <p>3. 不要透露个人信息</p>
                <p>4. 绝不转账！</p>
            </div>
            <button class="modal-btn modal-danger" onclick="closeModal('dangerModal')">我知道了</button>
        </div>
    </div>
    
    <!-- 正确提示弹窗 -->
    <div class="modal-overlay" id="successModal">
        <div class="modal">
            <div class="modal-icon">🎉</div>
            <div class="modal-title" style="color: #52c41a;">太棒了！</div>
            <div class="modal-content">
                <p><strong>您成功识破了骗局！</strong></p>
                <p style="margin-top: 10px;">警察确实不会通过微信办案，您的防骗意识很强！</p>
                <p style="margin-top: 10px;">记住这些防骗要点：</p>
                <p>✓ 公检法不会通过电话/网络办案</p>
                <p>✓ 不会要求转账到"安全账户"</p>
                <p>✓ 不会索要验证码或密码</p>
                <p style="margin-top: 10px;">请将这个案例分享给家人朋友，让更多人远离诈骗！</p>
            </div>
            <button class="modal-btn modal-success" onclick="closeModal('successModal')">好的，我会分享</button>
        </div>
    </div>
    
    <script>
        // 模拟打字效果显示对方消息
        function typeWriter(element, text, speed = 50) {
            let i = 0;
            element.textContent = '';
            
            function type() {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }
        
        // 显示用户选择的消息
        function addUserMessage(text) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.innerHTML = `
                <div class="message-avatar">
                    <svg viewBox="0 0 100 100" width="50" height="50">
                        <rect width="100" height="100" fill="#ccc"/>
                        <ellipse cx="50" cy="40" rx="22" ry="24" fill="#e8c39e"/>
                        <ellipse cx="50" cy="85" rx="25" ry="20" fill="#666"/>
                    </svg>
                </div>
                <div class="message-content">
                    <span class="message-sender">我</span>
                    <div class="message-bubble">${text}</div>
                </div>
            `;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        // 选择选项
        function selectOption(type) {
            const optionsContainer = document.getElementById('optionsContainer');
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            
            // 禁用所有按钮
            buttons.forEach(btn => {
                btn.disabled = true;
                btn.style.opacity = '0.6';
            });
            
            // 显示用户选择
            const selectedBtn = event.target;
            let userText = selectedBtn.textContent.trim();
            // 移除选项字母前缀
            userText = userText.replace(/^[ABC]\.\s*/, '');
            addUserMessage(userText);
            
            // 延迟显示结果弹窗
            setTimeout(() => {
                if (type === 'correct') {
                    document.getElementById('successModal').classList.add('active');
                } else {
                    document.getElementById('dangerModal').classList.add('active');
                }
            }, 500);
        }
        
        // 关闭弹窗
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
        
        // 页面加载后模拟打字效果
        window.onload = function() {
            const bubble = document.querySelector('#scammerMessage .message-bubble');
            const originalText = bubble.textContent.trim();
            typeWriter(bubble, originalText, 80);
        };
    </script>
</body>
</html>
