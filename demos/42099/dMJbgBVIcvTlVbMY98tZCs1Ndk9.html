<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>错题拍 · AI 错题本助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    color: #1a202c;
  }
  .container { max-width: 480px; margin: 0 auto; }
  .header {
    text-align: center;
    color: white;
    padding: 20px 0 30px;
  }
  .header h1 { font-size: 28px; margin-bottom: 8px; font-weight: 700; }
  .header .sub { font-size: 14px; opacity: 0.9; }
  .header .badge {
    display: inline-block;
    background: rgba(255,255,255,0.25);
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    margin-top: 10px;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
  }
  .upload-zone {
    border: 2px dashed #cbd5e0;
    border-radius: 16px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    background: #f7fafc;
  }
  .upload-zone:hover { border-color: #667eea; background: #edf2f7; }
  .upload-icon { font-size: 48px; margin-bottom: 12px; }
  .upload-text { color: #4a5568; font-size: 15px; font-weight: 500; }
  .upload-hint { color: #a0aec0; font-size: 12px; margin-top: 6px; }
  .samples-title {
    font-size: 13px;
    color: #718096;
    margin: 20px 0 10px;
    text-align: center;
  }
  .sample-list { display: flex; flex-direction: column; gap: 8px; }
  .sample-btn {
    background: #edf2f7;
    border: none;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    color: #2d3748;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sample-btn:hover { background: #667eea; color: white; transform: translateX(4px); }
  .sample-btn .icon { font-size: 18px; }
  .section-title {
    font-size: 16px;
    font-weight: 700;
    color: #2d3748;
    margin: 20px 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: "";
    display: inline-block;
    width: 4px;
    height: 18px;
    background: linear-gradient(180deg, #667eea, #764ba2);
    border-radius: 2px;
  }
  .tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
    margin-right: 6px;
  }
  .tag-blue { background: #ebf4ff; color: #2c5282; }
  .tag-green { background: #f0fff4; color: #22543d; }
  .tag-orange { background: #fffaf0; color: #7c2d12; }
  .tag-red { background: #fff5f5; color: #742a2a; }
  .problem-box {
    background: #f7fafc;
    border-left: 4px solid #667eea;
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 15px;
    line-height: 1.7;
  }
  .problem-box .label {
    font-size: 11px;
    color: #718096;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .analysis-list { list-style: none; }
  .analysis-list li {
    padding: 10px 0;
    border-bottom: 1px solid #edf2f7;
    font-size: 14px;
    line-height: 1.6;
  }
  .analysis-list li:last-child { border-bottom: none; }
  .analysis-list li::before {
    content: "→";
    color: #667eea;
    font-weight: bold;
    margin-right: 8px;
  }
  .variation-card {
    background: #fff;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .variation-card:hover { border-color: #667eea; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,0.15); }
  .variation-num {
    display: inline-block;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    width: 24px;
    height: 24px;
    line-height: 24px;
    text-align: center;
    border-radius: 50%;
    font-size: 13px;
    font-weight: bold;
    margin-right: 8px;
  }
  .variation-text { font-size: 14px; color: #2d3748; line-height: 1.6; margin-top: 8px; }
  .variation-diff { font-size: 12px; color: #718096; margin-top: 6px; }
  .reveal-btn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    float: right;
  }
  .answer-box {
    background: #f0fff4;
    border-radius: 8px;
    padding: 12px;
    margin-top: 10px;
    font-size: 13px;
    color: #22543d;
    display: none;
  }
  .answer-box.show { display: block; }
  .stats-bar {
    display: flex;
    justify-content: space-around;
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
  }
  .stat-item { text-align: center; }
  .stat-num { font-size: 22px; font-weight: 700; color: #667eea; }
  .stat-label { font-size: 11px; color: #718096; margin-top: 2px; }
  .footer-card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    color: white;
    text-align: center;
    padding: 16px;
    border-radius: 16px;
    font-size: 13px;
    line-height: 1.6;
    margin-top: 16px;
  }
  .footer-card .emoji { font-size: 20px; }
  .hidden { display: none; }
  .back-btn {
    background: none;
    border: none;
    color: #667eea;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 12px;
    padding: 4px 0;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📚 错题拍</h1>
    <div class="sub">AI 错题本助手 · 拍一拍，举一反三</div>
    <div class="badge">🎁 乡村学生永久免费</div>
  </div>

  <!-- 首页：拍照 + 示例错题 -->
  <div id="home">
    <div class="card">
      <div class="upload-zone" onclick="alert('📷 演示版：真实场景下会调起相机拍摄或从相册选择错题图片')">
        <div class="upload-icon">📷</div>
        <div class="upload-text">点击拍照或上传错题</div>
        <div class="upload-hint">支持数学 / 物理 / 化学 / 语文 / 英语</div>
      </div>

      <div class="samples-title">— 或试试这些示例错题 —</div>
      <div class="sample-list">
        <button class="sample-btn" onclick="showProblem('math')">
          <span class="icon">📐</span>
          <span>数学 · 二次函数求最值</span>
        </button>
        <button class="sample-btn" onclick="showProblem('physics')">
          <span class="icon">⚡</span>
          <span>物理 · 电路功率计算</span>
        </button>
        <button class="sample-btn" onclick="showProblem('english')">
          <span class="icon">🔤</span>
          <span>英语 · 虚拟语气辨析</span>
        </button>
        <button class="sample-btn" onclick="showProblem('chemistry')">
          <span class="icon">🧪</span>
          <span>化学 · 氧化还原配平</span>
        </button>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-num">5min</div>
        <div class="stat-label">整理时间</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">3</div>
        <div class="stat-label">举一反三</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">0</div>
        <div class="stat-label">手抄负担</div>
      </div>
    </div>

    <div class="footer-card">
      <div class="emoji">💝</div>
      <div>承诺：乡村学校学生、城市低收入家庭子女<br><strong>永久免费</strong>，无功能阉割</div>
    </div>
  </div>

  <!-- 详情页：错题分析 + 举一反三 -->
  <div id="detail" class="hidden">
    <button class="back-btn" onclick="goHome()">← 返回</button>

    <div class="card">
      <div class="section-title">错题内容</div>
      <div class="problem-box" id="problemContent"></div>

      <div class="section-title">AI 智能归类</div>
      <div id="tags"></div>
    </div>

    <div class="card">
      <div class="section-title">解题思路与易错点</div>
      <ul class="analysis-list" id="analysis"></ul>
    </div>

    <div class="card">
      <div class="section-title">举一反三 · 同类变式</div>
      <div id="variations"></div>
    </div>
  </div>
</div>

<script>
const data = {
  math: {
    problem: "已知二次函数 y = x² - 4x + 3，求该函数在 x ∈ [0, 5] 上的最小值。",
    tags: [
      { txt: "数学 · 二次函数", cls: "tag-blue" },
      { txt: "高一 · 必修一", cls: "tag-green" },
      { txt: "难度 ★★★", cls: "tag-orange" }
    ],
    analysis: [
      "把函数配方：y = (x-2)² - 1，对称轴为 x = 2",
      "判断对称轴与定义域的位置关系：x=2 ∈ [0, 5]，对称轴在区间内",
      "最值出现在顶点或端点：顶点处 y = -1，端点处 y(0)=3, y(5)=8",
      "易错点：忽略对称轴是否在定义域内，直接代入端点比较"
    ],
    variations: [
      {
        text: "变式 1：求 y = x² - 4x + 3 在 x ∈ [-1, 2] 上的最小值。（对称轴在区间外）",
        diff: "难度 ★★★",
        answer: "对称轴 x=2 在区间右侧，最小值在左端点取得：y(-1) = 1+4+3 = 8"
      },
      {
        text: "变式 2：求 y = -x² + 4x - 3 在 x ∈ [0, 5] 上的最大值。（开口向下）",
        diff: "难度 ★★★",
        answer: "开口向下，对称轴 x=2 在区间内，最大值在顶点：y(2) = -4+8-3 = 1"
      },
      {
        text: "变式 3：已知 y = x² - 4x + k 在 x ∈ [0, 5] 上最小值为 -1，求 k 的值。",
        diff: "难度 ★★★★",
        answer: "由顶点公式得 -4+k = -1，所以 k = 3"
      }
    ]
  },
  physics: {
    problem: "一个标有 \"6V 3W\" 的小灯泡，接到 9V 电源上，需要串联多大阻值的电阻才能使灯泡正常发光？",
    tags: [
      { txt: "物理 · 电功率", cls: "tag-blue" },
      { txt: "初三 · 欧姆定律", cls: "tag-green" },
      { txt: "难度 ★★", cls: "tag-orange" }
    ],
    analysis: [
      "灯泡正常发光时电压 U灯 = 6V，功率 P灯 = 3W",
      "由 P = UI 得灯泡额定电流 I = P/U = 3/6 = 0.5A",
      "串联电阻分压：U阻 = 9V - 6V = 3V",
      "由 R = U/I 得 R = 3/0.5 = 6Ω",
      "易错点：忘记求电流 I，或分压电压算错"
    ],
    variations: [
      {
        text: "变式 1：把两个相同的 \"6V 3W\" 灯泡串联在 12V 电源上，能否都正常发光？",
        diff: "难度 ★★",
        answer: "总电压 12V，每个灯泡分压 6V，恰好在额定电压下，能正常发光"
      },
      {
        text: "变式 2：把 \"6V 3W\" 灯泡直接接在 6V 电源上，1 分钟消耗多少电能？",
        diff: "难度 ★★",
        answer: "W = Pt = 3W × 60s = 180J"
      },
      {
        text: "变式 3：把 \"6V 3W\" 和 \"6V 6W\" 两个灯泡并联在 6V 电源上，哪个更亮？",
        diff: "难度 ★★★",
        answer: "实际功率等于额定功率：6W 的更亮（因为它功率更大）"
      }
    ]
  },
  english: {
    problem: "选择题：If I ______ you, I would take the job.\nA. am  B. was  C. were  D. be",
    tags: [
      { txt: "英语 · 虚拟语气", cls: "tag-blue" },
      { txt: "高二 · 语法专项", cls: "tag-green" },
      { txt: "难度 ★★★", cls: "tag-orange" }
    ],
    analysis: [
      "本句是典型的非真实条件句：与现在事实相反的假设",
      "虚拟语气现在时：从句用一般过去时，be 动词一律用 were",
      "主句用 would / could / should + 动词原形",
      "主从句时态对比：现在虚拟（were + would）/ 过去虚拟（had been + would have）/ 将来虚拟（were to + would）",
      "易错点：把 if I were you 写成 if I was you（口语虽可但书面要 were）"
    ],
    variations: [
      {
        text: "变式 1：If he ______ (be) here last Sunday, he ______ (help) us.",
        diff: "难度 ★★★",
        answer: "were / would have helped（与过去事实相反）"
      },
      {
        text: "变式 2：If it ______ (rain) tomorrow, we would cancel the picnic.",
        diff: "难度 ★★★",
        answer: "rained（与将来事实可能相反，if 从句用一般过去时表将来虚拟）"
      },
      {
        text: "变式 3：______ it not been for your help, I ______ (fail).",
        diff: "难度 ★★★★",
        answer: "Had / would have failed（省略 if 的倒装虚拟）"
      }
    ]
  },
  chemistry: {
    problem: "配平方程式：KMnO₄ + HCl → KCl + MnCl₂ + Cl₂↑ + H₂O\n（求 KMnO₄ 的系数）",
    tags: [
      { txt: "化学 · 氧化还原", cls: "tag-blue" },
      { txt: "高一 · 必修一", cls: "tag-green" },
      { txt: "难度 ★★★★", cls: "tag-red" }
    ],
    analysis: [
      "标变价元素：Mn 从 +7 → +2（降 5 价），Cl 从 -1 → 0（升 1 价）",
      "电子守恒：KMnO₄ 与 Cl₂ 的系数比为 2 : 5（最小公倍数 10）",
      "按 K、Mn 守恒：右边 KCl=2, MnCl₂=2，左边 KMnO₄=2",
      "配 Cl：右边共需 2+4+10=16 个 Cl，左边 HCl=16",
      "配 H：HCl=16, H₂O=8",
      "验证 O：左边 2×4=8 = 右边 8 ✓",
      "易错点：忘记 Cl₂ 系数 5 也要算 Cl 原子数，或漏乘系数"
    ],
    variations: [
      {
        text: "变式 1：配平 Cu + HNO₃(稀) → Cu(NO₃)₂ + NO↑ + H₂O",
        diff: "难度 ★★★",
        answer: "3Cu + 8HNO₃ → 3Cu(NO₃)₂ + 2NO↑ + 4H₂O"
      },
      {
        text: "变式 2：标出 KMnO₄ 中 Mn 的化合价，并判断它是氧化剂还是还原剂。",
        diff: "难度 ★★",
        answer: "+7 价，作氧化剂（化合价降低，被还原）"
      },
      {
        text: "变式 3：工业上用 MnO₂ + 浓 HCl 制 Cl₂，反应中浓 HCl 体现什么性质？",
        diff: "难度 ★★★★",
        answer: "既体现还原性（被氧化为 Cl₂），又体现酸性（生成 MnCl₂）"
      }
    ]
  }
};

function showProblem(type) {
  const d = data[type];
  document.getElementById('home').classList.add('hidden');
  document.getElementById('detail').classList.remove('hidden');

  // 错题
  const problemText = d.problem.replace(/\n/g, '<br>');
  document.getElementById('problemContent').innerHTML =
    `<div class="label">题目</div><div>${problemText}</div>`;

  // 标签
  document.getElementById('tags').innerHTML =
    d.tags.map(t => `<span class="tag ${t.cls}">${t.txt}</span>`).join('');

  // 分析
  document.getElementById('analysis').innerHTML =
    d.analysis.map(a => `<li>${a}</li>`).join('');

  // 变式
  document.getElementById('variations').innerHTML =
    d.variations.map((v, i) => `
      <div class="variation-card">
        <div>
          <span class="variation-num">${i+1}</span>
          <strong>变式 ${i+1}</strong>
          <button class="reveal-btn" onclick="toggleAnswer(this)">查看答案</button>
          <div class="variation-diff">${v.diff}</div>
        </div>
        <div class="variation-text">${v.text}</div>
        <div class="answer-box">💡 <strong>解析：</strong>${v.answer}</div>
      </div>
    `).join('');

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleAnswer(btn) {
  const card = btn.closest('.variation-card');
  card.querySelector('.answer-box').classList.toggle('show');
  btn.textContent = btn.textContent === '查看答案' ? '隐藏答案' : '查看答案';
}

function goHome() {
  document.getElementById('detail').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
