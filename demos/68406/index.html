<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI错题整理工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 16px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .container {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 24px;
            font-size: 22px;
        }
        .module {
            margin-bottom: 28px;
        }
        .module h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid #eee;
        }
        /* 上传区域 */
        .upload-box {
            border: 2px dashed #6366f1;
            border-radius: 8px;
            padding: 32px 16px;
            text-align: center;
            color: #666;
            cursor: pointer;
        }
        .upload-box input {
            display: none;
        }
        .upload-box:hover {
            background-color: #f8f9ff;
        }
        /* 分类区域 */
        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .tag {
            padding: 6px 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }
        .tag.active {
            background-color: #6366f1;
            color: white;
            border-color: #6366f1;
        }
        .input-tag {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            width: 140px;
        }
        /* 错题列表 */
        .error-list {
            margin-top: 12px;
            min-height: 80px;
            border:1px solid #eee;
            border-radius:8px;
            padding:12px;
        }
        .empty-tip {
            color:#999;
            text-align:center;
            padding:20px;
        }
        /* 打印按钮 */
        .btn-print {
            width: 100%;
            padding: 12px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-print:hover {
            background-color: #4f46e5;
        }
        @media print {
            .upload-box, .tag-group, .btn-print {
                display: none;
            }
        }
        @media (max-width: 640px) {
            .container {
                padding:16px;
            }
            h1 {
                font-size:18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI在线错题整理工具</h1>

        <!-- 模块1：图片上传 -->
        <div class="module">
            <h2>1. 错题图片上传</h2>
            <div class="upload-box" id="uploadBox">
                <input type="file" id="imgUpload" accept="image/*" multiple>
                <p>点击上传错题照片 / 拖拽图片到此处</p>
            </div>
        </div>

        <!-- 模块2：错题分类 -->
        <div class="module">
            <h2>2. 错题标签分类</h2>
            <div class="tag-group">
                <div class="tag">数学</div>
                <div class="tag">语文</div>
                <div class="tag">英语</div>
                <div class="tag">物理</div>
                <div class="tag">化学</div>
                <input class="input-tag" placeholder="自定义标签">
            </div>
            <div class="error-list">
                <div class="empty-tip">上传图片后错题将展示在此处</div>
            </div>
        </div>

        <!-- 模块3：导出打印 -->
        <div class="module">
            <h2>3. 导出打印错题本</h2>
            <button class="btn-print" onclick="window.print()">一键打印全部错题</button>
        </div>
    </div>

    <script>
        // 上传区域点击触发文件选择
        const uploadBox = document.getElementById('uploadBox');
        const imgUpload = document.getElementById('imgUpload');
        uploadBox.addEventListener('click', () => imgUpload.click());

        // 标签切换选中
        const tags = document.querySelectorAll('.tag');
        tags.forEach(tag => {
            tag.addEventListener('click', () => {
                tag.classList.toggle('active');
            })
        })

        // 图片上传简单预览逻辑
        imgUpload.addEventListener('change', function(e){
            const files = e.target.files;
            if(files.length === 0) return;
            alert(`已选中${files.length}张错题图片，可完成分类后打印导出`);
        })
    </script>
</body>
</html>
