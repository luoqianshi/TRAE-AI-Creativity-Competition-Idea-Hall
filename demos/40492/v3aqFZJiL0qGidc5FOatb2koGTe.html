<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>键盘驱动 · 小说输出器</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #e9edf1;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== 主窗口 ===== */
        .word-container {
            width: 1100px;
            max-width: 100%;
            height: 95vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 标题栏 ===== */
        .title-bar {
            background: #2b5797;
            color: white;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
            flex-shrink: 0;
        }
        .title-bar .doc-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title-bar .doc-name span {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 12px;
        }
        .title-bar .win-controls {
            display: flex;
            gap: 8px;
        }
        .title-bar .win-controls div {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
        }

        /* ===== 菜单栏 ===== */
        .menu-bar {
            display: flex;
            padding: 4px 12px 0 12px;
            background: #f8f9fa;
            border-bottom: 1px solid #d0d7de;
            flex-shrink: 0;
            gap: 2px;
            flex-wrap: wrap;
        }
        .menu-bar .menu-item {
            padding: 4px 12px;
            font-size: 13px;
            color: #1a1a1a;
            border-radius: 4px 4px 0 0;
            cursor: default;
        }
        .menu-bar .menu-item:hover {
            background: #e5ebf3;
        }

        /* ===== 工具栏 ===== */
        .tool-bar {
            display: flex;
            padding: 6px 12px;
            background: #f8f9fa;
            border-bottom: 1px solid #d0d7de;
            flex-shrink: 0;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
        }
        .tool-bar .group {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 0 6px;
            border-right: 1px solid #d0d7de;
        }
        .tool-bar .group:last-child {
            border-right: none;
        }
        .tool-bar .btn {
            width: 28px;
            height: 28px;
            background: transparent;
            border: none;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #333;
            cursor: default;
        }
        .tool-bar .btn:hover {
            background: #e5ebf3;
        }
        .tool-bar select {
            font-size: 12px;
            padding: 2px 4px;
            border: 1px solid #ccc;
            border-radius: 3px;
            background: white;
        }

        /* ===== 标尺 ===== */
        .ruler {
            height: 22px;
            background: #f8f9fa;
            border-bottom: 1px solid #d0d7de;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 9px;
            color: #888;
            position: relative;
        }

        /* ===== 编辑区 ===== */
        .edit-area-wrap {
            flex: 1;
            overflow: auto;
            background: #e9edf1;
            padding: 20px 30px;
            display: flex;
            justify-content: center;
        }
        .edit-area {
            width: 100%;
            max-width: 800px;
            min-height: 100%;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            padding: 60px 70px;
            font-size: 15px;
            line-height: 1.8;
            font-family: 'Calibri', 'Microsoft YaHei', serif;
            color: #1e1e1e;
            outline: none;
            border: none;
            border-radius: 4px;
        }
        .edit-area:focus {
            box-shadow: 0 0 0 2px #2b5797;
        }
        .edit-area p {
            margin: 0 0 0.5em 0;
        }

        /* ===== 状态栏 ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 4px 16px;
            background: #f8f9fa;
            border-top: 1px solid #d0d7de;
            font-size: 12px;
            color: #555;
            flex-shrink: 0;
        }
        .status-bar .right {
            display: flex;
            gap: 20px;
        }

        /* ===== 浮动控制面板 ===== */
        .control-panel {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(43, 87, 151, 0.95);
            backdrop-filter: blur(8px);
            color: white;
            padding: 16px 22px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 200px;
            z-index: 999;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .control-panel .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .control-panel .row label {
            opacity: 0.85;
            font-size: 12px;
            white-space: nowrap;
        }
        .control-panel .btn-ctrl {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        .control-panel .btn-ctrl:hover {
            background: rgba(255, 255, 255, 0.35);
        }
        .control-panel .btn-ctrl.danger {
            background: rgba(255, 80, 80, 0.3);
        }
        .control-panel .btn-ctrl.danger:hover {
            background: rgba(255, 80, 80, 0.6);
        }
        .control-panel .status-text {
            font-size: 12px;
            opacity: 0.9;
            text-align: center;
        }
        .control-panel .progress {
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }
        .control-panel .progress .bar {
            height: 100%;
            width: 0%;
            background: #7fdbff;
            border-radius: 4px;
            transition: width 0.15s;
        }
        .shortcut-hint {
            font-size: 10px;
            opacity: 0.5;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .control-panel .toggle-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        .control-panel .toggle-row input[type="checkbox"] {
            accent-color: #7fdbff;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* ===== 提示弹窗 ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 28px;
            border-radius: 30px;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .edit-area {
                padding: 30px 25px;
                font-size: 14px;
            }
            .control-panel {
                bottom: 10px;
                right: 10px;
                min-width: 160px;
                padding: 12px 16px;
            }
            .tool-bar .group {
                padding: 0 3px;
            }
        }
    </style>
</head>
<body>

    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>

    <!-- ===== 主窗口 ===== -->
    <div class="word-container">

        <!-- 标题栏 -->
        <div class="title-bar">
            <div class="doc-name">
                📄 文档1 - Word
                <span>兼容模式</span>
            </div>
            <div class="win-controls">
                <div style="background:#ff5f57;"></div>
                <div style="background:#ffbd2e;"></div>
                <div style="background:#28c840;"></div>
            </div>
        </div>

        <!-- 菜单栏 -->
        <div class="menu-bar">
            <span class="menu-item">文件</span>
            <span class="menu-item">编辑</span>
            <span class="menu-item">视图</span>
            <span class="menu-item">插入</span>
            <span class="menu-item">格式</span>
            <span class="menu-item">工具</span>
            <span class="menu-item">表格</span>
            <span class="menu-item">窗口</span>
            <span class="menu-item">帮助</span>
        </div>

        <!-- 工具栏 -->
        <div class="tool-bar">
            <div class="group">
                <select><option>宋体</option><option>黑体</option><option>Calibri</option></select>
                <select><option>12</option><option>14</option><option selected>16</option><option>18</option></select>
            </div>
            <div class="group">
                <span class="btn"><b>B</b></span>
                <span class="btn"><i>I</i></span>
                <span class="btn"><u>U</u></span>
                <span class="btn"><s>abc</s></span>
            </div>
            <div class="group">
                <span class="btn">≡</span>
                <span class="btn">☰</span>
                <span class="btn">•</span>
                <span class="btn">1.</span>
            </div>
            <div class="group">
                <span class="btn">⬅</span>
                <span class="btn">➡</span>
                <span class="btn">⬆</span>
                <span class="btn">⬇</span>
            </div>
            <div class="group">
                <span class="btn">🔍</span>
            </div>
        </div>

        <!-- 标尺 -->
        <div class="ruler">
            <span style="margin-right:10px;">1</span>
            <span style="margin-right:10px;">2</span>
            <span style="margin-right:10px;">3</span>
            <span style="margin-right:10px;">4</span>
            <span>5</span>
        </div>

        <!-- 编辑区 -->
        <div class="edit-area-wrap">
            <div id="editor" class="edit-area" contenteditable="true">
                <p style="text-align:center;color:#aaa;font-size:14px;margin-top:40px;">
                    ⌨️ 任意键盘敲击 → 输出小说文字<br>
                    <span style="font-size:12px;">停止敲击 3 秒后自动暂停 · 再次敲击继续</span>
                </p>
            </div>
        </div>

        <!-- 状态栏 -->
        <div class="status-bar">
            <div>
                <span id="pageInfo">第 1 页</span>
                <span style="margin-left:20px;">字数: <span id="wordCount">0</span></span>
            </div>
            <div class="right">
                <span id="progressLabel">进度: 0%</span>
                <span>中文(中国)</span>
                <span>插入</span>
            </div>
        </div>
    </div>

    <!-- ===== 浮动控制面板 ===== -->
    <div class="control-panel" id="controlPanel">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong style="font-size:14px;">⌨ 键盘驱动</strong>
            <span style="font-size:11px;opacity:0.6;" id="statusBadge">● 等待键盘</span>
        </div>
        <div class="row">
            <label>每次输出</label>
            <div style="display:flex;gap:6px;align-items:center;">
                <button class="btn-ctrl" id="btnCharDec" style="padding:2px 10px;">−</button>
                <span id="charPerKeyLabel" style="min-width:24px;text-align:center;">1</span>
                <button class="btn-ctrl" id="btnCharInc" style="padding:2px 10px;">+</button>
                <span style="font-size:11px;opacity:0.6;">字符</span>
            </div>
        </div>
        <div class="row">
            <label>闲置超时</label>
            <select id="timeoutSelect" style="background:rgba(255,255,255,0.15);color:white;border:none;border-radius:6px;padding:3px 6px;font-size:12px;">
                <option value="2">2秒</option>
                <option value="3" selected>3秒</option>
                <option value="5">5秒</option>
                <option value="10">10秒</option>
                <option value="0">永不暂停</option>
            </select>
        </div>
        <div class="row" style="gap:6px;flex-wrap:wrap;">
            <button class="btn-ctrl danger" id="btnReset">⟳ 重置</button>
            <button class="btn-ctrl" id="btnLoadDemo">📖 加载示例</button>
        </div>
        <div class="progress">
            <div class="bar" id="progressBar"></div>
        </div>
        <div class="status-text" id="statusText">等待键盘输入...</div>
        <div class="shortcut-hint">任意键盘敲击驱动 · 闲置自动暂停</div>
    </div>

    <script>
        // ============================================================
        //  核心逻辑：键盘驱动 + 闲置超时暂停
        // ============================================================

        // ------ 默认小说 ------
        const DEFAULT_NOVEL = `第一章 相遇

        那是一个秋天的傍晚，夕阳把整条巷子染成了琥珀色。他站在书店的门口，手里拿着一本旧版的《百年孤独》，封面已经有些磨损。

        她正好从里面走出来，两个人差点撞上。

        “对不起。”她先开了口，声音很轻，像是怕惊动什么。

        他摇了摇头，目光却落在她手里那本一模一样的书上。两个人对视了一眼，都笑了。

        “你也喜欢马尔克斯？”他问。

        “刚读完第二遍。”她说，“每次都觉得像是第一次读。”

        他们站在书店门口聊了很久，直到路灯亮起来，把两个人的影子拉得很长。

        后来他常常想，如果不是那天恰好路过那家书店，如果不是她恰好晚出来五分钟，他们可能一辈子都不会认识。

        但世界上没有那么多恰好。所有的相遇，都是久别重逢。`;

        // ------ DOM 引用 ------
        const editor = document.getElementById('editor');
        const wordCount = document.getElementById('wordCount');
        const progressLabel = document.getElementById('progressLabel');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const statusBadge = document.getElementById('statusBadge');
        const btnReset = document.getElementById('btnReset');
        const btnLoadDemo = document.getElementById('btnLoadDemo');
        const btnCharDec = document.getElementById('btnCharDec');
        const btnCharInc = document.getElementById('btnCharInc');
        const charPerKeyLabel = document.getElementById('charPerKeyLabel');
        const timeoutSelect = document.getElementById('timeoutSelect');
        const toast = document.getElementById('toast');

        // ------ 状态变量 ------
        let novelText = DEFAULT_NOVEL;
        let charArray = [];
        let currentIndex = 0;              // 已输出字符数
        let isPaused = true;              // 初始为暂停状态（等待键盘唤醒）
        let charPerKey = 1;               // 每次按键输出字符数
        let idleTimeout = 3000;           // 闲置超时（毫秒）
        let idleTimer = null;             // 闲置检测定时器
        let lastKeyTime = Date.now();
        let isFinished = false;           // 是否全部输出完毕

        // ------ 初始化 ------
        function initCharArray() {
            charArray = novelText.split('');
            currentIndex = 0;
            isFinished = false;
            updateStats();
            updateProgress();
            statusText.textContent = `已加载 ${charArray.length} 字符，等待键盘敲击...`;
            statusBadge.textContent = '● 等待键盘';
            statusBadge.style.color = '#7fdbff';
            // 清空编辑器
            editor.innerHTML = '<p style="text-align:center;color:#aaa;font-size:14px;margin-top:40px;">⌨️ 任意键盘敲击 → 输出小说文字<br><span style="font-size:12px;">停止敲击自动暂停 · 再次敲击继续</span></p>';
            // 重置光标到开头
            const range = document.createRange();
            range.selectNodeContents(editor);
            range.collapse(true);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        }

        // ------ 核心：键盘驱动输出 ------
        function handleKeyPress(e) {
            // 忽略功能键组合（Ctrl、Alt、Win等），但保留普通按键
            if (e.ctrlKey || e.altKey || e.metaKey) return;
            // 忽略某些特殊键（如方向键、F1-F12等），但保留字母、数字、标点、空格、退格、回车
            const key = e.key;
            if (key.startsWith('F') || key === 'Shift' || key === 'Control' || key === 'Alt' || 
                key === 'Meta' || key === 'CapsLock' || key === 'Tab' || key === 'Escape' ||
                key === 'Insert' || key === 'Home' || key === 'End' || key === 'PageUp' ||
                key === 'PageDown' || key.startsWith('Arrow')) {
                return;
            }

            // 阻止默认行为（防止页面滚动等）
            e.preventDefault();

            // 如果已经全部输出完毕，不再响应
            if (isFinished) {
                showToast('✅ 已全部输出完毕，请重置');
                return;
            }

            // 重置闲置定时器（每次键盘动作都刷新）
            resetIdleTimer();

            // 如果处于暂停状态，恢复输出
            if (isPaused && !isFinished) {
                isPaused = false;
                statusBadge.textContent = '▶ 输出中';
                statusBadge.style.color = '#7fdbff';
                statusText.textContent = `输出中... ${currentIndex}/${charArray.length}`;
                showToast('▶ 继续输出');
            }

            // 输出字符
            let outputCount = 0;
            for (let i = 0; i < charPerKey; i++) {
                if (currentIndex >= charArray.length) {
                    isFinished = true;
                    isPaused = true;
                    statusBadge.textContent = '✅ 完成';
                    statusBadge.style.color = '#28c840';
                    statusText.textContent = `✅ 全部输出完毕！共 ${charArray.length} 字符`;
                    showToast('🎉 全部输出完毕！');
                    break;
                }
                const ch = charArray[currentIndex];
                insertAtCursor(ch);
                currentIndex++;
                outputCount++;
            }

            // 更新统计
            updateStats();
            updateProgress();
            if (!isFinished) {
                statusText.textContent = `输出中... ${currentIndex}/${charArray.length}`;
            }
        }

        // ------ 在光标处插入文本 ------
        function insertAtCursor(text) {
            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0) {
                const range = document.createRange();
                range.selectNodeContents(editor);
                range.collapse(false);
                sel.removeAllRanges();
                sel.addRange(range);
            }
            const range = sel.getRangeAt(0);
            range.deleteContents();
            const textNode = document.createTextNode(text);
            range.insertNode(textNode);
            range.setStartAfter(textNode);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
            editor.dispatchEvent(new Event('input', { bubbles: true }));
        }

        // ------ 闲置超时检测 ------
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            lastKeyTime = Date.now();
            const timeout = parseInt(timeoutSelect.value) * 1000;
            if (timeout === 0) return; // 永不暂停
            idleTimer = setTimeout(() => {
                if (!isPaused && !isFinished) {
                    isPaused = true;
                    statusBadge.textContent = '⏸ 闲置暂停';
                    statusBadge.style.color = '#ffbd2e';
                    statusText.textContent = `⏸ 已暂停 (${currentIndex}/${charArray.length})`;
                    showToast(`⏸ 闲置 ${timeout/1000} 秒，自动暂停`);
                }
            }, timeout);
        }

        // ------ 更新统计 ------
        function updateStats() {
            const text = editor.innerText || '';
            const count = text.length;
            wordCount.textContent = count;
        }

        function updateProgress() {
            const total = charArray.length || 1;
            const pct = Math.min(100, Math.round((currentIndex / total) * 100));
            progressBar.style.width = pct + '%';
            progressLabel.textContent = `进度: ${pct}%`;
        }

        // ------ 重置 ------
        function resetAll() {
            clearTimeout(idleTimer);
            isPaused = true;
            isFinished = false;
            currentIndex = 0;
            // 清空编辑器
            editor.innerHTML = '<p style="text-align:center;color:#aaa;font-size:14px;margin-top:40px;">⌨️ 任意键盘敲击 → 输出小说文字<br><span style="font-size:12px;">停止敲击自动暂停 · 再次敲击继续</span></p>';
            updateStats();
            updateProgress();
            statusBadge.textContent = '● 等待键盘';
            statusBadge.style.color = '#7fdbff';
            statusText.textContent = `已重置，共 ${charArray.length} 字符，等待键盘敲击...`;
            showToast('⟳ 已重置');
            // 光标移到开头
            const range = document.createRange();
            range.selectNodeContents(editor);
            range.collapse(true);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        }

        // ------ 加载小说 ------
        function loadNovel(text) {
            if (!text || text.trim().length === 0) {
                showToast('⚠️ 文本不能为空');
                return;
            }
            // 重置状态
            clearTimeout(idleTimer);
            isPaused = true;
            isFinished = false;
            novelText = text;
            initCharArray();
            showToast(`✅ 已加载 ${charArray.length} 字符`);
        }

        // ------ Toast ------
        let toastTimer = null;

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 1500);
        }

        // ------ 键盘监听 ------
        document.addEventListener('keydown', handleKeyPress);

        // ------ 编辑器输入事件（更新字数）------
        editor.addEventListener('input', function() {
            updateStats();
        });

        // ------ 按钮事件 ------
        btnReset.addEventListener('click', resetAll);
        btnLoadDemo.addEventListener('click', function() {
            loadNovel(DEFAULT_NOVEL);
        });

        // 每次输出字符数控制
        btnCharDec.addEventListener('click', function() {
            if (charPerKey > 1) {
                charPerKey--;
                charPerKeyLabel.textContent = charPerKey;
                showToast(`每次输出 ${charPerKey} 个字符`);
            }
        });
        btnCharInc.addEventListener('click', function() {
            if (charPerKey < 5) {
                charPerKey++;
                charPerKeyLabel.textContent = charPerKey;
                showToast(`每次输出 ${charPerKey} 个字符`);
            }
        });

        // 超时选择变更时，重置定时器
        timeoutSelect.addEventListener('change', function() {
            if (!isPaused && !isFinished) {
                resetIdleTimer();
            }
        });

        // ------ 初始化 ------
        initCharArray();

        // 暴露全局函数便于调试
        window.loadNovel = loadNovel;
        window.resetAll = resetAll;
        window.DEFAULT_NOVEL = DEFAULT_NOVEL;

        console.log('⌨️ 键盘驱动小说输出器已启动');
        console.log('📖 加载自定义小说: loadNovel("你的小说内容")');
        console.log('💡 任意键盘敲击输出字符，停止敲击自动暂停');
    </script>

</body>
</html>
