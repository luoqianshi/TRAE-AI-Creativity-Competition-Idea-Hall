<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>办公速写 AI 智能助手｜TRAE 大赛作品</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
        }
        body {
            background: #f0f4f8;
            color: #222;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 28px;
            color: #165DFF;
            margin-bottom: 8px;
        }
        .header p {
            color: #666;
        }
        .tab-box {
            display: flex;
            gap: 10px;
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 10px #00000010;
        }
        .tab-item {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
        }
        .tab-item.active {
            background: #165DFF;
            color: #fff;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px #00000010;
        }
        .hide {
            display: none;
        }
        textarea {
            width: 100%;
            min-height: 140px;
            padding: 14px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
            resize: vertical;
            margin: 15px 0;
        }
        .btn {
            background: #165DFF;
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background: #0E42D2;
        }
        .result-box {
            margin-top: 20px;
            padding: 18px;
            background: #f7f8fa;
            border-radius: 8px;
            border-left: 4px solid #165DFF;
            white-space: pre-wrap;
            line-height: 1.8;
        }
        .loading {
            color: #165DFF;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>办公速写 AI 智能助手</h1>
            <p>一键生成周报｜会议纪要｜产品PRD｜轻量化办公AI工具</p>
        </div>

        <!-- 功能标签页 -->
        <div class="tab-box">
            <div class="tab-item active" onclick="switchTab(0)">周报生成</div>
            <div class="tab-item" onclick="switchTab(1)">会议纪要</div>
            <div class="tab-item" onclick="switchTab(2)">PRD需求文档</div>
        </div>

        <div class="card">
            <!-- 周报模块 -->
            <div id="panel0">
                <h3>📝 智能周报生成器</h3>
                <p>输入本周工作内容，AI自动排版、总结、生成标准职场周报</p>
                <textarea id="input0" placeholder="请输入你本周的工作内容、完成事项、待办、问题与计划..."></textarea>
                <button class="btn" onclick="genResult(0)">一键生成周报</button>
                <div id="res0" class="result-box hide"></div>
            </div>

            <!-- 会议纪要模块 -->
            <div id="panel1" class="hide">
                <h3>📋 结构化会议纪要</h3>
                <p>粘贴会议录音文字/聊天记录，AI自动拆分结论、待办、风险、责任人</p>
                <textarea id="input1" placeholder="粘贴会议原始记录、发言内容、讨论过程..."></textarea>
                <button class="btn" onclick="genResult(1)">生成结构化纪要</button>
                <div id="res1" class="result-box hide"></div>
            </div>

            <!-- PRD需求文档模块 -->
            <div id="panel2" class="hide">
                <h3>📄 PRD产品需求文档生成</h3>
                <p>输入功能简单描述，AI输出完整规范PRD框架（背景、目标、功能详情、交互、约束）</p>
                <textarea id="input2" placeholder="简单描述你要做的产品功能，例如：做一个用户登录注册、短信验证码登录功能..."></textarea>
                <button class="btn" onclick="genResult(2)">生成PRD文档</button>
                <div id="res2" class="result-box hide"></div>
            </div>
        </div>

    </div>

    <script>
        // 切换标签页
        function switchTab(idx) {
            const tabs = document.querySelectorAll('.tab-item');
            const panels = document.querySelectorAll('[id^="panel"]');
            tabs.forEach((t,i)=>t.classList.toggle('active',i===idx));
            panels.forEach((p,i)=>p.classList.toggle('hide',i!==idx));
        }

        // AI模拟生成内容
        const mockData = [
            // 0 周报模板
            (text)=>`【本周工作总结】
本次内容由办公速写AI智能助手自动生成

一、本周工作完成
${text}

二、工作收获
1. 稳步推进岗位日常工作，熟悉业务流程，提升执行效率；
2. 针对工作问题进行复盘，积累项目落地经验；
3. 规范工作输出，统一文档格式，提升工作标准化程度。

三、现存问题
1. 部分任务推进节奏偏慢，时间分配有待优化；
2. 细节打磨仍有提升空间。

四、下周工作计划
1. 持续跟进现有任务收尾与落地；
2. 优化工作流程，提升工作效率；
3. 主动复盘总结，规避重复问题。

—— AI办公速写助手`,

            // 1 会议纪要模板
            (text)=>`【结构化会议纪要】
一、会议讨论内容
${text}

二、会议结论
1. 本次会议明确了当前工作推进方向与落地标准；
2. 统一团队执行认知，对齐项目进度要求；
3. 确定后续迭代与优化方案。

三、待办事项
- 跟进本次会议确定的落地任务，按时完成交付；
- 补齐相关资料与文档归档；
- 同步团队进度，及时同步问题。

四、风险与注意事项
- 注意时间节点，避免延期；
- 关键节点及时沟通确认，减少返工。`,

            // 2 PRD模板
            (text)=>`【产品需求文档 PRD】
一、功能概述
需求描述：${text}
功能定位：面向用户提供轻量化、便捷的功能服务，优化用户使用体验，完善产品基础能力。

二、需求背景
当前产品缺少对应功能模块，用户操作流程繁琐，体验不佳，新增本功能用于补齐产品能力、提升用户留存与使用便捷度。

三、目标用户
普通终端用户、运营运维人员、内部使用人员

四、核心功能详情
1. 基础功能逻辑：根据用户输入完成对应操作，流程简洁、容错性高；
2. 页面交互规则：界面简洁清晰，操作路径短，提示友好；
3. 异常处理：对空输入、错误输入、网络异常等做兜底提示。

五、约束与限制
1. 兼容主流设备与浏览器；
2. 保证数据输入输出稳定性；
3. 功能迭代可扩展，便于后续新增能力。

六、预期价值
降低用户操作成本，提升产品实用性与完整性，优化整体使用体验。`
        ];

        // 生成结果逻辑
        function genResult(idx){
            const input = document.getElementById('input'+idx).value.trim();
            const resDom = document.getElementById('res'+idx);
            if(!input){
                alert('请先输入内容再生成！');
                return;
            }
            resDom.classList.remove('hide');
            resDom.innerHTML = '<span class="loading">AI正在智能生成中，请稍候...</span>';
            // 模拟AI加载延迟
            setTimeout(()=>{
                resDom.innerText = mockData[idx](input);
            },1200);
        }
    </script>
</body>
</html>
