<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作搭子 - AI桌面专注伙伴</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', 'Segoe UI', sans-serif;
      background: #0f0e17;
      color: #fffffe;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .app {
      width: 420px;
      background: linear-gradient(145deg, #1a1a2e, #16213e);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
      position: relative;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #fffffe;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 span.logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #ff8906, #f38ba8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .stats {
      display: flex;
      gap: 6px;
    }
    .stat-badge {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      color: #a7a9be;
    }
    .stat-badge.active { background: rgba(255,137,6,0.15); color: #ff8906; }

    /* Pet Area */
    .pet-stage {
      width: 100%;
      height: 200px;
      background: radial-gradient(ellipse at center bottom, rgba(255,137,6,0.08) 0%, transparent 70%);
      border-radius: 16px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      overflow: hidden;
      transition: background 1s ease;
    }
    .pet-stage.focused {
      background: radial-gradient(ellipse at center bottom, rgba(80,200,120,0.12) 0%, transparent 70%);
    }
    .pet-stage.tired {
      background: radial-gradient(ellipse at center bottom, rgba(243,139,168,0.08) 0%, transparent 70%);
    }

    /* Pet body */
    .pet {
      position: relative;
      transition: transform 0.5s ease;
    }
    .pet-body {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff8906, #e53170);
      position: relative;
      transition: all 0.6s ease;
      box-shadow: 0 8px 32px rgba(255,137,6,0.3);
    }
    .pet.focused .pet-body {
      background: linear-gradient(135deg, #2cb67d, #3da5d9);
      box-shadow: 0 8px 32px rgba(44,182,125,0.35);
      transform: scale(1.08);
    }
    .pet.tired .pet-body {
      background: linear-gradient(135deg, #7f5af0, #6246ea);
      box-shadow: 0 8px 32px rgba(127,90,240,0.25);
      transform: scale(0.92);
    }
    .pet.celebrating .pet-body {
      background: linear-gradient(135deg, #ffd803, #ff8906);
      box-shadow: 0 8px 40px rgba(255,216,3,0.4);
    }

    /* Eyes */
    .eyes {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
    }
    .eye {
      width: 10px;
      height: 12px;
      background: #fffffe;
      border-radius: 50%;
      position: relative;
      transition: all 0.4s ease;
    }
    .eye::after {
      content: '';
      width: 5px;
      height: 5px;
      background: #0f0e17;
      border-radius: 50%;
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      transition: all 0.4s ease;
    }
    .pet.focused .eye {
      height: 8px;
      width: 12px;
    }
    .pet.tired .eye {
      height: 3px;
      width: 12px;
      border-radius: 4px;
    }
    .pet.tired .eye::after { display: none; }
    .pet.celebrating .eye {
      height: 4px;
      border-radius: 4px 4px 0 0;
      background: #0f0e17;
    }
    .pet.celebrating .eye::after { display: none; }

    /* Mouth */
    .mouth {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 6px;
      border-bottom: 2.5px solid #fffffe;
      border-radius: 0 0 12px 12px;
      transition: all 0.4s ease;
    }
    .pet.focused .mouth {
      width: 10px;
      height: 4px;
      border-bottom-color: #fffffe;
    }
    .pet.celebrating .mouth {
      width: 18px;
      height: 10px;
      border-bottom: 3px solid #0f0e17;
      border-radius: 0 0 14px 14px;
      background: rgba(0,0,0,0.15);
    }
    .pet.tired .mouth {
      width: 8px;
      height: 8px;
      border: 2px solid #fffffe;
      border-radius: 50%;
      border-bottom: 2px solid #fffffe;
    }

    /* Sparkles for celebrating */
    .sparkles {
      position: absolute;
      width: 160px;
      height: 160px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .pet.celebrating ~ .sparkles { opacity: 1; }
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      animation: sparkleFloat 1.2s ease-in-out infinite;
    }
    .sparkle:nth-child(1) { background: #ffd803; top: 10%; left: 20%; animation-delay: 0s; }
    .sparkle:nth-child(2) { background: #ff8906; top: 5%; right: 25%; animation-delay: 0.2s; }
    .sparkle:nth-child(3) { background: #f38ba8; top: 30%; left: 5%; animation-delay: 0.4s; }
    .sparkle:nth-child(4) { background: #2cb67d; top: 25%; right: 10%; animation-delay: 0.6s; }
    .sparkle:nth-child(5) { background: #7f5af0; bottom: 30%; left: 10%; animation-delay: 0.3s; }
    .sparkle:nth-child(6) { background: #3da5d9; bottom: 25%; right: 15%; animation-delay: 0.5s; }
    @keyframes sparkleFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.7; }
      50% { transform: translateY(-12px) scale(1.4); opacity: 1; }
    }

    /* Zzz for tired */
    .zzz {
      position: absolute;
      top: -10px;
      right: -30px;
      font-size: 18px;
      color: #7f5af0;
      opacity: 0;
      transition: opacity 0.5s ease;
      animation: zzzFloat 2s ease-in-out infinite;
    }
    .pet.tired ~ .zzz { opacity: 0.8; }
    @keyframes zzzFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Pet shadow */
    .pet-shadow {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 50%;
      filter: blur(4px);
      transition: all 0.5s ease;
    }
    .pet.focused ~ .pet-shadow { width: 65px; }
    .pet.tired ~ .pet-shadow { width: 50px; opacity: 0.6; }

    /* Status text */
    .pet-status {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: #a7a9be;
      white-space: nowrap;
      transition: color 0.4s ease;
    }

    /* Pet level */
    .pet-level {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 11px;
      color: #ff8906;
      background: rgba(255,137,6,0.1);
      padding: 3px 10px;
      border-radius: 12px;
    }

    /* Idle animation */
    .pet.idle .pet-body {
      animation: idleBob 3s ease-in-out infinite;
    }
    @keyframes idleBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .pet.focused .pet-body {
      animation: focusPulse 2s ease-in-out infinite;
    }
    @keyframes focusPulse {
      0%, 100% { transform: scale(1.08); }
      50% { transform: scale(1.12); }
    }
    .pet.celebrating .pet-body {
      animation: celebBounce 0.5s ease-in-out infinite;
    }
    @keyframes celebBounce {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.05) translateY(-10px); }
    }

    /* Focus Timer */
    .timer-section {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .timer-display {
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #fffffe;
      letter-spacing: 2px;
      min-width: 100px;
    }
    .timer-bar {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    .timer-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff8906, #f38ba8);
      border-radius: 2px;
      transition: width 1s linear;
    }
    .timer-bar-fill.focused {
      background: linear-gradient(90deg, #2cb67d, #3da5d9);
    }
    .timer-btn {
      padding: 6px 16px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .timer-btn.start {
      background: linear-gradient(135deg, #ff8906, #e53170);
      color: #fffffe;
    }
    .timer-btn.start:hover { transform: scale(1.05); }
    .timer-btn.stop {
      background: rgba(243,139,168,0.15);
      color: #f38ba8;
    }

    /* Task List */
    .tasks-section {
      margin-top: 8px;
    }
    .tasks-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .tasks-header h2 {
      font-size: 14px;
      font-weight: 500;
      color: #a7a9be;
    }
    .task-count {
      font-size: 11px;
      color: #a7a9be;
      background: rgba(255,255,255,0.05);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }
    .task-list::-webkit-scrollbar { width: 4px; }
    .task-list::-webkit-scrollbar-track { background: transparent; }
    .task-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    .task-item:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.05);
    }
    .task-item.done {
      opacity: 0.5;
    }
    .task-item.done .task-text {
      text-decoration: line-through;
    }
    .task-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }
    .task-item.done .task-check {
      background: #2cb67d;
      border-color: #2cb67d;
    }
    .task-item.done .task-check::after {
      content: '✓';
      color: #fffffe;
      font-size: 11px;
      font-weight: bold;
    }
    .task-text {
      font-size: 13px;
      color: #fffffe;
      flex: 1;
    }
    .task-tag {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(127,90,240,0.15);
      color: #7f5af0;
    }
    .task-tag.urgent {
      background: rgba(243,139,168,0.15);
      color: #f38ba8;
    }
    .task-tag.meeting {
      background: rgba(61,165,217,0.15);
      color: #3da5d9;
    }

    /* Add task */
    .add-task {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 8px 14px;
      border: 1px dashed rgba(255,255,255,0.1);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .add-task:hover {
      border-color: rgba(255,137,6,0.3);
      background: rgba(255,137,6,0.03);
    }
    .add-task-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255,137,6,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff8906;
      font-size: 14px;
    }
    .add-task-text {
      font-size: 12px;
      color: #a7a9be;
    }
    .add-task input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fffffe;
      font-size: 13px;
      font-family: inherit;
      display: none;
    }
    .add-task input.visible {
      display: block;
    }
    .add-task input::placeholder { color: rgba(167,169,190,0.5); }

    /* Watermark */
    .watermark {
      text-align: center;
      margin-top: 16px;
      font-size: 11px;
      color: rgba(167,169,190,0.4);
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <h1>
        <span class="logo">🐾</span>
        工作搭子
      </h1>
      <div class="stats">
        <span class="stat-badge active" id="streakBadge">🔥 连续3天</span>
        <span class="stat-badge" id="expBadge">✨ 120 XP</span>
      </div>
    </div>

    <!-- Pet Stage -->
    <div class="pet-stage" id="petStage">
      <span class="pet-level" id="petLevel">Lv.5 小橘</span>
      <div class="pet idle" id="pet">
        <div class="pet-body">
          <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
          </div>
          <div class="mouth"></div>
        </div>
      </div>
      <div class="pet-shadow"></div>
      <div class="sparkles">
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
      </div>
      <div class="zzz">💤</div>
      <div class="pet-status" id="petStatusText">闲置中… 点击下方「开始专注」唤醒我</div>
    </div>

    <!-- Timer -->
    <div class="timer-section">
      <div class="timer-display" id="timerDisplay">25:00</div>
      <div class="timer-bar">
        <div class="timer-bar-fill" id="timerBarFill"></div>
      </div>
      <button class="timer-btn start" id="timerBtn" onclick="toggleTimer()">开始专注</button>
    </div>

    <!-- Tasks -->
    <div class="tasks-section">
      <div class="tasks-header">
        <h2>今日任务</h2>
        <span class="task-count" id="taskCount">1/4 已完成</span>
      </div>
      <div class="task-list" id="taskList">
        <div class="task-item done" onclick="toggleTask(this)">
          <div class="task-check"></div>
          <span class="task-text">晨会同步进度</span>
          <span class="task-tag meeting">会议</span>
        </div>
        <div class="task-item" onclick="toggleTask(this)">
          <div class="task-check"></div>
          <span class="task-text">完成产品需求文档</span>
          <span class="task-tag urgent">紧急</span>
        </div>
        <div class="task-item" onclick="toggleTask(this)">
          <div class="task-check"></div>
          <span class="task-text">Review 前端代码 PR</span>
          <span class="task-tag">开发</span>
        </div>
        <div class="task-item" onclick="toggleTask(this)">
          <div class="task-check"></div>
          <span class="task-text">整理本周学习笔记</span>
          <span class="task-tag">学习</span>
        </div>
      </div>
      <div class="add-task" id="addTaskArea" onclick="showAddInput()">
        <div class="add-task-icon">+</div>
        <span class="add-task-text" id="addTaskHint">添加新任务…</span>
        <input type="text" id="addTaskInput" placeholder="输入任务，回车确认" onkeydown="addNewTask(event)" />
      </div>
    </div>

    <div class="watermark">Trae Work 创意赛 · 工作搭子 Demo</div>
  </div>

  <script>
    // State
    let timerRunning = false;
    let timerSeconds = 25 * 60;
    let timerTotal = 25 * 60;
    let timerInterval = null;
    let exp = 120;

    const pet = document.getElementById('pet');
    const petStage = document.getElementById('petStage');
    const petStatusText = document.getElementById('petStatusText');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerBarFill = document.getElementById('timerBarFill');
    const timerBtn = document.getElementById('timerBtn');
    const expBadge = document.getElementById('expBadge');

    function setPetState(state) {
      pet.className = 'pet ' + state;
      petStage.className = 'pet-stage' + (state === 'focused' ? ' focused' : state === 'tired' ? ' tired' : '');
      const messages = {
        idle: '闲置中… 点击下方「开始专注」唤醒我',
        focused: '专注中！小橘正在为你加油 💪',
        celebrating: '太棒了！任务完成！🎉',
        tired: '你好像有点累了… 要不要休息一下？'
      };
      petStatusText.textContent = messages[state] || messages.idle;
      petStatusText.style.color = state === 'focused' ? '#2cb67d' : state === 'celebrating' ? '#ffd803' : state === 'tired' ? '#7f5af0' : '#a7a9be';
    }

    function toggleTimer() {
      if (!timerRunning) {
        timerRunning = true;
        timerBtn.textContent = '暂停';
        timerBtn.className = 'timer-btn stop';
        timerBarFill.classList.add('focused');
        setPetState('focused');
        timerInterval = setInterval(() => {
          timerSeconds--;
          if (timerSeconds <= 0) {
            clearInterval(timerInterval);
            timerRunning = false;
            timerBtn.textContent = '开始专注';
            timerBtn.className = 'timer-btn start';
            timerBarFill.classList.remove('focused');
            timerBarFill.style.width = '0%';
            timerSeconds = timerTotal;
            updateTimerDisplay();
            celebrate();
            return;
          }
          updateTimerDisplay();
          const progress = ((timerTotal - timerSeconds) / timerTotal) * 100;
          timerBarFill.style.width = progress + '%';
        }, 1000);
      } else {
        clearInterval(timerInterval);
        timerRunning = false;
        timerBtn.textContent = '开始专注';
        timerBtn.className = 'timer-btn start';
        timerBarFill.classList.remove('focused');
        setPetState('tired');
        setTimeout(() => {
          if (!timerRunning) setPetState('idle');
        }, 3000);
      }
    }

    function updateTimerDisplay() {
      const m = Math.floor(timerSeconds / 60);
      const s = timerSeconds % 60;
      timerDisplay.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function celebrate() {
      setPetState('celebrating');
      exp += 25;
      expBadge.textContent = '✨ ' + exp + ' XP';
      setTimeout(() => setPetState('idle'), 4000);
    }

    function toggleTask(el) {
      if (timerRunning) return; // don't toggle during focus
      const wasDone = el.classList.contains('done');
      el.classList.toggle('done');
      updateTaskCount();
      if (!wasDone) {
        exp += 10;
        expBadge.textContent = '✨ ' + exp + ' XP';
        setPetState('celebrating');
        setTimeout(() => {
          if (!timerRunning) setPetState('idle');
        }, 2500);
      }
    }

    function updateTaskCount() {
      const items = document.querySelectorAll('.task-item');
      const done = document.querySelectorAll('.task-item.done');
      document.getElementById('taskCount').textContent = done.length + '/' + items.length + ' 已完成';
    }

    function showAddInput() {
      const input = document.getElementById('addTaskInput');
      const hint = document.getElementById('addTaskHint');
      hint.style.display = 'none';
      input.classList.add('visible');
      input.focus();
    }

    function addNewTask(e) {
      if (e.key === 'Enter' && e.target.value.trim()) {
        const text = e.target.value.trim();
        const taskList = document.getElementById('taskList');
        const div = document.createElement('div');
        div.className = 'task-item';
        div.onclick = function() { toggleTask(this); };
        div.innerHTML = '<div class="task-check"></div><span class="task-text">' + text + '</span><span class="task-tag">新</span>';
        taskList.appendChild(div);
        e.target.value = '';
        e.target.classList.remove('visible');
        document.getElementById('addTaskHint').style.display = '';
        updateTaskCount();
      }
    }

    // Init
    setPetState('idle');
  </script>
</body>
</html>
