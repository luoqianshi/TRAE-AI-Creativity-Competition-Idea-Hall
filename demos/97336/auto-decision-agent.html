<body>
  <header class="header">
    <div class="header-title">基于 LLM 的 Auto-Desicion 系统</div>
    <div class="header-status">
      <span class="status-dot"></span>
      <span>Agent 就绪</span>
    </div>
  </header>

  <div class="app-container">
    <!-- Left Panel: Input -->
    <div class="left-panel">
      <div class="panel-header">业务输入</div>

      <!-- File Upload -->
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">&#11014;</div>
        <div class="upload-text">拖拽文件到此处，或 <strong>点击上传</strong></div>
        <div class="upload-hint">支持 CSV, Excel, JSON, TXT 等格式</div>
      </div>
      <div class="file-list" id="fileList"></div>

      <!-- Chat -->
      <div class="chat-area">
        <div class="chat-messages" id="chatMessages">
          <div class="message message-system">
            <div class="message-label">System</div>
            <div class="message-bubble">
              欢迎使用 Auto-Desicion 智能决策系统。请描述您的业务问题，或上传相关数据文件，我将自动进行意图识别、模型建立与算法求解。
            </div>
          </div>
        </div>
        <div class="input-area">
          <div class="input-wrapper">
            <textarea
              class="input-textarea"
              id="userInput"
              placeholder="请描述您的决策问题...（例如：我需要优化物流路径，有10个配送点和3辆货车）"
              rows="2"
            ></textarea>
            <button class="send-btn" id="sendBtn" onclick="handleSend()">发送</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Panel: Results -->
    <div class="right-panel">
      <div class="panel-header">运行结果</div>

      <!-- Workflow Steps -->
      <div class="workflow-section">
        <div class="workflow-title">决策流程</div>
        <div class="workflow-steps" id="workflowSteps">
          <div class="step" data-step="1">1. 意图识别</div>
          <div class="step" data-step="2">2. 模型描述</div>
          <div class="step" data-step="3">3. 合理性判断</div>
          <div class="step" data-step="4">4. 算法选择</div>
          <div class="step" data-step="5">5. 求解执行</div>
          <div class="step" data-step="6">6. 结果验证</div>
          <div class="step" data-step="7">7. 输出</div>
        </div>
      </div>

      <!-- Results -->
      <div class="results-area" id="resultsArea">
        <div class="empty-state">
          <div class="empty-state-icon">&#9881;</div>
          <div class="empty-state-title">等待输入</div>
          <div class="empty-state-desc">
            在左侧输入业务问题描述或上传数据文件后，Agent 将自动执行决策流程，结果将在此展示。
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // File Upload
    const uploadArea = document.getElementById('uploadArea');
    const fileList = document.getElementById('fileList');
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.multiple = true;
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);

    let uploadedFiles = [];

    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => handleFiles(fileInput.files));

    function handleFiles(files) {
      for (let file of files) {
        uploadedFiles.push(file);
      }
      renderFileList();
    }

    function renderFileList() {
      fileList.innerHTML = uploadedFiles.map((file, i) => `
        <div class="file-item">
          <span class="file-item-name">&#128196; ${file.name}</span>
          <span class="file-item-remove" onclick="removeFile(${i})">&times;</span>
        </div>
      `).join('');
    }

    function removeFile(index) {
      uploadedFiles.splice(index, 1);
      renderFileList();
    }

    // Chat
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    function handleSend() {
      const text = userInput.value.trim();
      if (!text && uploadedFiles.length === 0) return;

      if (text) {
        addMessage('user', text);
        userInput.value = '';
      }

      // Simulate workflow
      simulateWorkflow();
    }

    function addMessage(sender, text) {
      const div = document.createElement('div');
      div.className = `message message-${sender}`;
      div.innerHTML = `
        <div class="message-label">${sender === 'user' ? 'User' : 'Agent'}</div>
        <div class="message-bubble">${escapeHtml(text)}</div>
      `;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Workflow Simulation
    const steps = document.querySelectorAll('.step');
    const resultsArea = document.getElementById('resultsArea');

    function simulateWorkflow() {
      sendBtn.disabled = true;
      resultsArea.innerHTML = '';

      const logs = document.createElement('div');
      logs.className = 'result-block';
      logs.innerHTML = `
        <div class="result-header">
          <span class="result-header-left">
            <span class="result-badge">LOG</span>
            运行日志
          </span>
        </div>
        <div class="result-body">
          <div class="log-console" id="logConsole"></div>
        </div>
      `;
      resultsArea.appendChild(logs);
      const logConsole = document.getElementById('logConsole');

      function log(level, msg) {
        const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${level}">${msg}</span>`;
        logConsole.appendChild(entry);
        logConsole.scrollTop = logConsole.scrollHeight;
      }

      const workflow = [
        { step: 1, delay: 600,  log: ['info', '开始意图识别...'],          result: null },
        { step: 2, delay: 1200, log: ['info', '构建数学模型描述...'],        result: { title: '模型描述', badge: 'MODEL', body: '<p>识别到问题类型：<strong>车辆路径优化（VRP）</strong></p><p>决策变量：$x_{ij} \in \{0,1\}$ 表示是否经过边 $(i,j)$</p><p>目标函数：最小化总行驶距离</p><p>约束条件：容量约束、时间窗约束、车辆数约束</p>' } },
        { step: 3, delay: 800,  log: ['info', '验证模型合理性...'],        result: null },
        { step: 4, delay: 1000, log: ['info', '问题规模：中等，选择启发式算法...'], result: { title: '算法选择', badge: 'ALGO', body: '<div class="algo-choice"><span class="algo-chip">精确算法</span><span class="algo-chip selected">ALNS</span><span class="algo-chip">遗传算法</span><span class="algo-chip">A*</span></div><p style="margin-top:10px">选择 <strong>ALNS（自适应大规模邻域搜索）</strong>，原因：问题规模适中，ALNS 在 VRP 问题上表现优异，收敛速度快。</p>' } },
        { step: 5, delay: 2000, log: ['success', '求解完成，最优值：1,247.3 km'], result: { title: '求解结果', badge: 'SOL', body: '<p><strong>目标函数值：</strong>1,247.3 km</p><p><strong>使用车辆：</strong>3 辆</p><p><strong>求解时间：</strong>4.2s</p><pre>Route 1: Depot -> C3 -> C7 -> C1 -> Depot  [距离: 412.5 km]
Route 2: Depot -> C5 -> C9 -> C2 -> Depot  [距离: 398.1 km]
Route 3: Depot -> C4 -> C8 -> C6 -> C10 -> Depot [距离: 436.7 km]</pre>' } },
        { step: 6, delay: 800,  log: ['info', '验证解的合理性...'],        result: null },
        { step: 7, delay: 600,  log: ['success', '解验证通过，输出最终结果'], result: { title: '附件输出', badge: 'OUT', body: '<div class="attachment-list"><div class="attachment-item"><span class="attachment-icon">&#128196;</span><span class="attachment-name">solution_routes.json</span><span class="attachment-size">12.4 KB</span><span class="attachment-download">下载</span></div><div class="attachment-item"><span class="attachment-icon">&#128196;</span><span class="attachment-name">model_description.lp</span><span class="attachment-size">8.1 KB</span><span class="attachment-download">下载</span></div><div class="attachment-item"><span class="attachment-icon">&#128200;</span><span class="attachment-name">convergence_plot.png</span><span class="attachment-size">45.2 KB</span><span class="attachment-download">下载</span></div></div>' } },
      ];

      let i = 0;
      function runNext() {
        if (i >= workflow.length) {
          sendBtn.disabled = false;
          addMessage('system', '决策流程已完成。最优方案已生成，总行驶距离 1,247.3 km，共使用 3 辆车辆。详细结果及附件请见右侧面板。');
          return;
        }
        const w = workflow[i];
        setTimeout(() => {
          // Update step
          steps.forEach(s => {
            const num = parseInt(s.dataset.step);
            s.classList.remove('active', 'done', 'error');
            if (num < w.step) s.classList.add('done');
            else if (num === w.step) s.classList.add('active');
          });

          // Log
          log(w.log[0], w.log[1]);

          // Result
          if (w.result) {
            const block = document.createElement('div');
            block.className = 'result-block';
            block.innerHTML = `
              <div class="result-header">
                <span class="result-header-left">
                  <span class="result-badge">${w.result.badge}</span>
                  ${w.result.title}
                </span>
              </div>
              <div class="result-body">${w.result.body}</div>
            `;
            resultsArea.insertBefore(block, logs);
          }

          i++;
          runNext();
        }, w.delay);
      }
      runNext();
    }
  </script>
</body>
</html>
