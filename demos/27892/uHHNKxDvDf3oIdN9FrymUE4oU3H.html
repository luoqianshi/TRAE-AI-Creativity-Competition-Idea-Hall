<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人情簿 — 你的人情往来智能管家</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FBF7F0;
  --paper-dark: #F0EADB;
  --ink: #1C1C1C;
  --ink-light: #5C5C5C;
  --ink-lighter: #999;
  --red: #C41E3A;
  --red-glow: #E8475F;
  --gold: #B8860B;
  --gold-light: #D4A843;
  --jade: #5B8C5A;
  --card: #FFFDF8;
  --card-border: #E8E0D0;
  --shadow-sm: 0 1px 3px rgba(28,28,28,0.06);
  --shadow-md: 0 4px 16px rgba(28,28,28,0.08);
  --shadow-lg: 0 8px 32px rgba(28,28,28,0.12);
  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
  --font-display: 'Noto Serif SC', 'SimSun', 'STSong', serif;
  --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { font-size:16px; }
body {
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(196,30,58,0.03) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 90%, rgba(184,134,11,0.04) 0%, transparent 60%);
}
.app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  position: relative;
  padding-bottom: 80px;
  border-left: 1px solid var(--card-border);
  border-right: 1px solid var(--card-border);
  box-shadow: var(--shadow-lg);
  background: var(--paper);
}

/* Header */
.header {
  padding: 20px 24px 16px;
  position: sticky;
  top: 0;
  z-index: 10;
  background: linear-gradient(180deg, var(--paper) 80%, transparent);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.logo {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 900;
  color: var(--ink);
  letter-spacing: 0.05em;
}
.logo span { color: var(--red); }
.header-subtitle {
  font-size: 0.78rem;
  color: var(--ink-lighter);
  font-weight: 300;
  letter-spacing: 0.02em;
}

/* Tab Bar */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: var(--card);
  border-top: 1px solid var(--card-border);
  display: flex;
  padding: 6px 8px;
  padding-bottom: max(6px, env(safe-area-inset-bottom));
  z-index: 10;
}
.tab-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 0;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--ink-lighter);
  font-family: var(--font-body);
  font-size: 0.68rem;
  transition: color 0.2s;
  position: relative;
}
.tab-btn.active { color: var(--red); }
.tab-btn.active::before {
  content: '';
  position: absolute;
  top: -7px;
  width: 24px;
  height: 3px;
  background: var(--red);
  border-radius: 0 0 3px 3px;
}
.tab-icon { font-size: 1.3rem; }

/* Main Content */
.main { padding: 0 20px; }
.section { display: none; animation: fadeSlide 0.35s ease; }
.section.active { display: block; }
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.card-header {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-header .dot {
  width: 8px; height: 8px;
  background: var(--red);
  border-radius: 50%;
}

/* Stats Grid */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 18px 16px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}
.stat-value {
  font-family: var(--font-display);
  font-size: 1.8rem;
  font-weight: 900;
  color: var(--red);
  line-height: 1;
}
.stat-value.gold { color: var(--gold); }
.stat-value.ink { color: var(--ink); }
.stat-label {
  font-size: 0.72rem;
  color: var(--ink-lighter);
  margin-top: 4px;
}

/* Form */
.form-group {
  margin-bottom: 14px;
}
.form-label {
  display: block;
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--ink-light);
  margin-bottom: 6px;
}
.form-input, .form-select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--card-border);
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 0.95rem;
  background: var(--paper);
  color: var(--ink);
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}
.form-input:focus, .form-select:focus {
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(196,30,58,0.08);
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 24px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary {
  background: var(--red);
  color: #fff;
  width: 100%;
}
.btn-primary:hover { background: var(--red-glow); }
.btn-outline {
  background: transparent;
  border: 1px solid var(--card-border);
  color: var(--ink);
}
.btn-outline:hover { border-color: var(--ink); }
.btn-sm {
  padding: 6px 14px;
  font-size: 0.75rem;
}

/* Voice Button */
.voice-btn {
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 2px solid var(--card-border);
  background: var(--card);
  cursor: pointer;
  font-size: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  flex-shrink: 0;
}
.voice-btn.recording {
  border-color: var(--red);
  background: #FFF0F0;
  animation: pulse 1.2s ease infinite;
  box-shadow: 0 0 0 8px rgba(196,30,58,0.1);
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(196,30,58,0.2); }
  50% { box-shadow: 0 0 0 16px rgba(196,30,58,0); }
}
.voice-hint {
  font-size: 0.7rem;
  color: var(--ink-lighter);
  text-align: center;
  margin-top: 8px;
}

/* Recommendation Engine */
.rec-person-select {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.rec-person-chip {
  padding: 8px 16px;
  border: 1px solid var(--card-border);
  border-radius: 20px;
  font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--card);
  font-family: var(--font-body);
}
.rec-person-chip:hover { border-color: var(--gold); }
.rec-person-chip.selected {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}

.rec-result {
  background: linear-gradient(135deg, #FFFDF5 0%, #FFF9EC 100%);
  border: 1px solid var(--gold-light);
  border-radius: var(--radius);
  padding: 20px;
  margin-top: 16px;
  font-family: var(--font-display);
}
.rec-result-header {
  font-size: 0.78rem;
  color: var(--gold);
  font-family: var(--font-body);
  margin-bottom: 8px;
}
.rec-amount {
  font-size: 2.6rem;
  font-weight: 900;
  color: var(--red);
  letter-spacing: 0.02em;
}
.rec-range {
  font-size: 0.85rem;
  color: var(--ink-light);
  margin-top: 4px;
}
.rec-breakdown {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px dashed var(--card-border);
}
.rec-step {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  font-family: var(--font-body);
  font-size: 0.82rem;
}
.rec-step .step-label { color: var(--ink-light); }
.rec-step .step-val { font-weight: 600; }
.rec-step .step-op { color: var(--ink-lighter); font-size: 0.7rem; margin: 0 6px; }
.rec-total-row {
  display: flex;
  justify-content: space-between;
  padding-top: 8px;
  margin-top: 8px;
  border-top: 1px solid var(--card-border);
  font-weight: 700;
}

/* Record List */
.record-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--card-border);
  cursor: pointer;
  transition: background 0.15s;
}
.record-item:last-child { border-bottom: none; }
.record-item:hover { background: rgba(0,0,0,0.01); }
.record-avatar {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--paper-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 1.1rem;
  color: var(--ink-light);
  flex-shrink: 0;
}
.record-info { flex: 1; min-width: 0; }
.record-name { font-weight: 500; font-size: 0.9rem; }
.record-meta { font-size: 0.72rem; color: var(--ink-lighter); margin-top: 2px; }
.record-amount {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1rem;
  text-align: right;
}
.record-amount.in { color: var(--jade); }
.record-amount.out { color: var(--red); }

/* Empty State */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--ink-lighter);
}
.empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }

/* Toast */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: #fff;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 0.82rem;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* Delete */
.delete-btn {
  background: none;
  border: none;
  color: #ccc;
  cursor: pointer;
  font-size: 0.9rem;
  padding: 4px 8px;
  transition: color 0.2s;
}
.delete-btn:hover { color: var(--red); }

/* Filter chips */
.filter-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 8px;
}
.filter-chip {
  padding: 5px 12px;
  border: 1px solid var(--card-border);
  border-radius: 14px;
  font-size: 0.7rem;
  white-space: nowrap;
  cursor: pointer;
  background: var(--card);
  transition: all 0.2s;
}
.filter-chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

/* Relationship tag badges */
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 0.65rem;
  font-weight: 500;
}
.tag-family { background: #FFE0E0; color: #C41E3A; }
.tag-friend { background: #E0ECFF; color: #3B5998; }
.tag-colleague { background: #E0F0E0; color: #3B7A3B; }
.tag-acquaintance { background: #F0E8E0; color: #8B7355; }

/* Input method toggle */
.input-method-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.input-method-btn {
  flex: 1;
  padding: 8px;
  border: 1px solid var(--card-border);
  border-radius: var(--radius-sm);
  background: var(--card);
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.75rem;
  text-align: center;
  transition: all 0.2s;
}
.input-method-btn.active {
  border-color: var(--ink);
  background: var(--ink);
  color: #fff;
}

/* Smart parse preview */
.parse-preview {
  background: var(--paper-dark);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  margin-top: 10px;
  font-family: var(--font-body);
  font-size: 0.82rem;
}
.parse-preview .field { color: var(--red); font-weight: 500; }
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-top">
      <div class="logo">人情<span>簿</span></div>
    </div>
    <div class="header-subtitle">你的人情往来智能管家</div>
  </header>

  <main class="main">
    <!-- Home -->
    <section class="section active" id="sec-home">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-total-out">¥0</div>
          <div class="stat-label">累计随出</div>
        </div>
        <div class="stat-card">
          <div class="stat-value gold" id="stat-total-in">¥0</div>
          <div class="stat-label">累计收入</div>
        </div>
        <div class="stat-card">
          <div class="stat-value ink" id="stat-count">0</div>
          <div class="stat-label">人情记录</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-people" style="color:var(--jade)">0</div>
          <div class="stat-label">往来人数</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><span class="dot"></span>即将需要回礼</div>
        <div id="reminder-list">
          <div class="empty-state" style="padding:20px">
            <div class="empty-icon">🎉</div>
            <div>暂无待回礼记录</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><span class="dot"></span>最近记录</div>
        <div id="recent-records">
          <div class="empty-state" style="padding:20px">
            <div class="empty-icon">📝</div>
            <div>还没有人情记录<br><span style="font-size:0.75rem">快去记一笔吧</span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Add Record -->
    <section class="section" id="sec-add">
      <div class="card">
        <div class="card-header"><span class="dot"></span>记一笔人情账</div>

        <div class="input-method-bar">
          <button class="input-method-btn active" onclick="switchInputMethod('manual')">✍️ 手动填写</button>
          <button class="input-method-btn" onclick="switchInputMethod('voice')">🎤 语音输入</button>
          <button class="input-method-btn" onclick="switchInputMethod('scan')">📷 拍照识别</button>
        </div>

        <!-- Manual Form -->
        <div id="input-manual">
          <div class="form-group">
            <label class="form-label">姓名</label>
            <input class="form-input" id="form-name" placeholder="对方姓名" autocomplete="off">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">金额</label>
              <input class="form-input" id="form-amount" type="number" placeholder="¥">
            </div>
            <div class="form-group">
              <label class="form-label">方向</label>
              <select class="form-select" id="form-direction">
                <option value="out">我随出</option>
                <option value="in">对方给我</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">事由</label>
              <select class="form-select" id="form-event">
                <option value="婚礼">婚礼</option>
                <option value="满月/百天">满月/百天</option>
                <option value="乔迁">乔迁</option>
                <option value="升学宴">升学宴</option>
                <option value="白事">白事</option>
                <option value="生日">生日</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">关系</label>
              <select class="form-select" id="form-relation">
                <option value="好友">好友</option>
                <option value="普通朋友">普通朋友</option>
                <option value="同事">同事</option>
                <option value="近亲">近亲</option>
                <option value="直系亲属">直系亲属</option>
                <option value="远亲/熟人">远亲/熟人</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">日期</label>
            <input class="form-input" id="form-date" type="date">
          </div>
          <div class="form-group">
            <label class="form-label">备注（可选）</label>
            <input class="form-input" id="form-note" placeholder="补充说明">
          </div>
          <button class="btn btn-primary" onclick="addRecord()">记录这笔人情</button>
        </div>

        <!-- Voice Input -->
        <div id="input-voice" style="display:none">
          <div style="display:flex;align-items:center;gap:16px;justify-content:center;padding:20px 0;">
            <button class="voice-btn" id="voice-btn" onclick="toggleVoice()">🎤</button>
            <div style="flex:1">
              <div id="voice-text" style="font-size:0.9rem;color:var(--ink-lighter);min-height:24px">点击麦克风开始说话...</div>
              <div id="voice-parsed" style="margin-top:8px;display:none"></div>
            </div>
          </div>
          <div class="voice-hint">试试说："张三结婚随了五百块"</div>
          <button class="btn btn-primary" id="voice-confirm-btn" style="display:none;margin-top:14px" onclick="confirmVoiceRecord()">✓ 确认录入</button>
        </div>

        <!-- Scan (mock) -->
        <div id="input-scan" style="display:none">
          <div style="text-align:center;padding:30px 20px;">
            <div style="font-size:4rem;margin-bottom:12px">📷</div>
            <div style="color:var(--ink-light);margin-bottom:16px">拍照识别红包封面或人情簿页面</div>
            <label class="btn btn-outline" style="cursor:pointer">
              <input type="file" accept="image/*" style="display:none" onchange="mockScan(this)">
              选择图片（演示）
            </label>
            <div id="scan-result" style="margin-top:12px;display:none"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Recommend -->
    <section class="section" id="sec-recommend">
      <div class="card">
        <div class="card-header"><span class="dot"></span>回礼金额智能推荐</div>
        <p style="font-size:0.78rem;color:var(--ink-lighter);margin-bottom:16px">
          选择要回礼的人、事由和所在城市，算法基于历史记录、关系亲疏、时间通胀、地区行情综合计算。
        </p>

        <div class="form-group">
          <label class="form-label">选择对象</label>
          <div class="rec-person-select" id="rec-person-list">
            <div style="font-size:0.78rem;color:var(--ink-lighter)">请先在"记账"中添加记录</div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">对方事由</label>
            <select class="form-select" id="rec-event" onchange="runRecommendation()">
              <option value="婚礼">婚礼</option>
              <option value="满月/百天">满月/百天</option>
              <option value="乔迁">乔迁</option>
              <option value="升学宴">升学宴</option>
              <option value="白事">白事</option>
              <option value="生日">生日</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">所在城市</label>
            <select class="form-select" id="rec-city" onchange="runRecommendation()">
              <option value="北京">北京</option>
              <option value="上海">上海</option>
              <option value="广州">广州</option>
              <option value="深圳">深圳</option>
              <option value="杭州" selected>杭州</option>
              <option value="成都">成都</option>
              <option value="武汉">武汉</option>
              <option value="南京">南京</option>
              <option value="重庆">重庆</option>
              <option value="苏州">苏州</option>
              <option value="西安">西安</option>
              <option value="长沙">长沙</option>
              <option value="郑州">郑州</option>
              <option value="合肥">合肥</option>
              <option value="福州">福州</option>
              <option value="厦门">厦门</option>
              <option value="济南">济南</option>
              <option value="青岛">青岛</option>
              <option value="沈阳">沈阳</option>
              <option value="大连">大连</option>
              <option value="石家庄">石家庄</option>

function getReminders() {

function initSpeech() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    document.getElementById('voice-text').textContent = '⚠️ 你的浏览器不支持语音识别，请使用 Chrome';
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'zh-CN';
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onresult = function(e) {
    const transcript = Array.from(e.results).map(r=>r[0].transcript).join('');
    document.getElementById('voice-text').textContent = transcript;
    if (e.results[0].isFinal) {
      parseVoiceInput(transcript);
    }
  };
  recognition.onerror = function(e) {
    document.getElementById('voice-text').textContent = '识别失败，请重试';
    stopVoice();
  };
  recognition.onend = function() {
    if (voiceRecognizing) stopVoice();
  };
}

function toggleVoice() {
  if (voiceRecognizing) {
    stopVoice();
  } else {
    if (!recognition) initSpeech();
    if (!recognition) return;
    voiceRecognizing = true;
    document.getElementById('voice-btn').classList.add('recording');
    document.getElementById('voice-btn').textContent = '🔴';
    document.getElementById('voice-text').textContent = '正在聆听...';
    recognition.start();
  }
}

function stopVoice() {
  voiceRecognizing = false;
  const btn = document.getElementById('voice-btn');
  btn.classList.remove('recording');
  btn.textContent = '🎤';
  if (recognition) {
    try { recognition.stop(); } catch(e) {}
  }
}

function parseVoiceInput(text) {
  // Pattern: {name}{event}随了/给了{amount}块/元/百
  const patterns = [
    /(.{1,4})(婚礼|结婚|满月|百天|乔迁|升学|白事|生日)(?:随了|给了|送了|包了)(\d+)\s*(?:块|元|百)?/,
    /(.{1,4})(婚礼|结婚|满月|百天|乔迁|升学|白事|生日)\s*(\d+)\s*(?:块|元)/,
    /(.{1,4})\s*(\d+)\s*(?:块|元)\s*(婚礼|结婚|满月|乔迁|升学|白事|生日)/,
  ];

  let match = null;
  for (const p of patterns) {
    match = text.match(p);
    if (match) break;
  }

  const previewDiv = document.getElementById('voice-parsed');
  const confirmBtn = document.getElementById('voice-confirm-btn');

  if (match) {
    let name = match[1];
    let eventRaw = match[2];
    let amount = parseInt(match[3]);

    // Normalize event name
    const eventMap = { '结婚':'婚礼', '百天':'满月/百天' };
    const event = eventMap[eventRaw] || eventRaw;

    // If amount is small (like 5), it might be "五百" parsed as "5百"
    if (amount < 10 && text.includes('百')) amount *= 100;

    voiceParsedData = { name, event, amount };
    previewDiv.style.display = 'block';
    previewDiv.innerHTML = `
      <div class="parse-preview">
        🎤 识别结果：<span class="field">${name}</span> ·
        <span class="field">${event}</span> ·
        <span class="field">¥${amount}</span>
      </div>`;
    confirmBtn.style.display = 'block';
  } else {
    previewDiv.style.display = 'block';
    previewDiv.innerHTML = `<div class="parse-preview" style="color:var(--ink-lighter)">未能自动解析，请手动填写或重试<br>尝试说："张三结婚随了五百块"</div>`;
    confirmBtn.style.display = 'none';
    voiceParsedData = null;
  }
}

const LUCKY_NUMBERS = [200,300,500,600,666,688,800,888,900,999,1000,1200,1288,1500,1600,1688,1800,1888,2000,2288,2888,3000,5000,6000,6666,8000,8888,10000];

function luckyRound(raw) {
  // Find nearest lucky number
  let best = LUCKY_NUMBERS[0];
  let bestDiff = Math.abs(raw - best);
  for (const n of LUCKY_NUMBERS) {
    const diff = Math.abs(raw - n);
    if (diff < bestDiff) { bestDiff = diff; best = n; }
  }
  // Also find the next one above
  let above = LUCKY_NUMBERS[LUCKY_NUMBERS.length-1];
  for (const n of LUCKY_NUMBERS) {
    if (n >= raw) { above = n; break; }
  }
  // Prefer numbers with 6 or 8
  const candidates = [best, above].filter(n => String(n).includes('6') || String(n).includes('8'));
  const preferred = candidates.length > 0 ? candidates[0] : best;
  return { best: preferred, range: [Math.max(200, Math.floor(raw*0.85/100)*100), Math.ceil(raw*1.15/100)*100] };
}

function calculateRecommendation(personName, eventType, city) {
  // Find the latest record where this person gave us money
  const theirRecords = records.filter(r=>r.name===personName && r.direction==='in');
  const latestIn = theirRecords.sort((a,b)=>b.date.localeCompare(a.date))[0];

  // Get city baseline from regional database
  const cityData = getCityBaseline(city, eventType);

  let baseAmount, sourceNote;

  if (latestIn) {
    baseAmount = latestIn.amount;
    sourceNote = `${personName}在${latestIn.event}时给了 ¥${latestIn.amount}`;
  } else {
    baseAmount = cityData.amount;
    sourceNote = `${city} ${eventType}行情基准（普通朋友）= ¥${baseAmount}`;
  }

  // Get relation from records, default to 普通朋友
  const personRecords = records.filter(r=>r.name===personName);
  const relation = personRecords.length > 0 ? personRecords[0].relation : '普通朋友';

  const relF = RELATION_FACTORS[relation];
  const evtF = EVENT_FACTORS[eventType];

  // Time factor: years since they gave (only meaningful if we have history)
  let yearsElapsed = 0;
  if (latestIn) {
    yearsElapsed = (Date.now() - new Date(latestIn.date)) / (365.25*86400000);
  }
  const timeF = Math.pow(1.025, yearsElapsed);

  // Use midpoints for calculation
  const relMid = (relF[0]+relF[1])/2;
  const evtMid = (evtF[0]+evtF[1])/2;

  // Calculate raw amount (no regional multiplier since baseline already city-specific)
  let rawAmount;
  if (latestIn) {
    // If we have history, use their amount as base, apply regional adjustment relative to my city
    rawAmount = Math.round(baseAmount * relMid * evtMid * timeF);
  } else {
    // No history: use city baseline directly, apply relationship factor
    rawAmount = Math.round(baseAmount * relMid * evtMid);
  }

  // === SALARY CHECK ===
  const salary = getSalary();
  const salaryCap = SALARY_CAPS[eventType] || 0.15;
  const maxAffordable = Math.round(salary * salaryCap);
  const salaryRatio = (rawAmount / salary * 100);
  let capped = false;
  let cappedAmount = rawAmount;

  if (rawAmount > maxAffordable && salary > 0) {
    capped = true;
    cappedAmount = maxAffordable;
  }

  const finalRaw = capped ? cappedAmount : rawAmount;
  const lucky = luckyRound(finalRaw);

  const steps = [
    { label: '基准金额', val: `¥${baseAmount}`, detail: sourceNote },
    { label: `关系系数 (${relation})`, val: `× ${relMid.toFixed(2)}`, detail: `范围 ${relF[0]}–${relF[1]}` },
    { label: `事件系数 (${eventType})`, val: `× ${evtMid.toFixed(2)}`, detail: `范围 ${evtF[0]}–${evtF[1]}` },
  ];
  if (yearsElapsed > 0.3 && latestIn) {
    steps.push({ label: `时间系数 (${yearsElapsed.toFixed(1)}年)`, val: `× ${timeF.toFixed(3)}`, detail: `年均通胀 2.5%` });
  }
  steps.push({ label: `城市基准 (${city}·${cityData.tier})`, val: latestIn ? '已含在基准中' : `¥${cityData.amount}`, detail: latestIn ? '以对方历史金额为基准' : `${city}本地行情` });

  // Salary step
  if (capped) {
    steps.push({ label: `薪资上限 (月薪 ¥${salary.toLocaleString()})`, val: `⚠️ 上限 ¥${maxAffordable.toLocaleString()}`, detail: `${eventType}不超过月薪 ${(salaryCap*100).toFixed(0)}%` });
  }

  return {
    baseAmount, relation, eventType, city, cityTier: cityData.tier, yearsElapsed,
    relMid, evtMid, timeF,
    rawAmount, finalRaw, lucky,
    steps, sourceNote, capped,
    hasHistory: !!latestIn,
    salary, salaryCap, maxAffordable, salaryRatio,
  };
}

function refreshRecommendPersonList() {
  const people = [...new Set(records.map(r=>r.name))];
  const container = document.getElementById('rec-person-list');
  if (people.length === 0) {
    container.innerHTML = '<div style="font-size:0.78rem;color:var(--ink-lighter)">请先在"记账"中添加记录</div>';
  } else {
    container.innerHTML = people.map(p=>`<button class="rec-person-chip" onclick="selectRecPerson('${p}',this)">${p}</button>`).join('');
  }
}

function selectRecPerson(name, btn) {
  document.querySelectorAll('.rec-person-chip').forEach(c=>c.classList.remove('selected'));
  btn.classList.add('selected');
  runRecommendation(name);
}

function runRecommendationFor(name) {
  // Called from reminders
  setTimeout(()=>{
    const chips = document.querySelectorAll('.rec-person-chip');
    chips.forEach(c=>{ if(c.textContent.trim()===name) c.classList.add('selected'); else c.classList.remove('selected'); });
    runRecommendation(name);
    document.getElementById('sec-recommend').scrollIntoView({behavior:'smooth'});
  },100);
}

function runRecommendation(personName) {
  const eventType = document.getElementById('rec-event').value;
  const city = document.getElementById('rec-city').value;
  const outputDiv = document.getElementById('rec-output');

  // Find selected person
  if (!personName) {
    const selected = document.querySelector('.rec-person-chip.selected');
    if (!selected) { outputDiv.innerHTML=''; return; }
    personName = selected.textContent.trim();
  }

  const result = calculateRecommendation(personName, eventType, city);

  const salaryPct = result.salary > 0 ? (result.lucky.best / result.salary * 100).toFixed(1) : '—';
  const cappedWarning = result.capped
    ? `<div style="background:#FFF3CD;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:0.78rem;color:#856404">
         ⚠️ 原始计算金额 ¥${result.rawAmount.toLocaleString()} 超过月薪 ${(result.salaryCap*100).toFixed(0)}%（上限 ¥${result.maxAffordable.toLocaleString()}），已自动调整至合理范围
       </div>`
    : '';

  outputDiv.innerHTML = `
    <div class="rec-result">
      <div class="rec-result-header">${result.hasHistory ? '📊 智能回礼建议' : '📊 首次随礼建议'}</div>
      <div class="rec-amount">¥${result.lucky.best.toLocaleString()}</div>
      <div class="rec-range">
        建议区间：¥${result.lucky.range[0].toLocaleString()} – ¥${result.lucky.range[1].toLocaleString()}
        <span style="margin-left:8px;color:var(--ink-lighter)">| 约占月薪 <b style="color:${salaryPct>15?'var(--red)':'var(--jade)'}">${salaryPct}%</b></span>
      </div>
      ${cappedWarning}
      <div class="rec-breakdown">
        ${result.steps.map(s=>`
          <div class="rec-step">
            <span class="step-label">${s.label}</span>
            <span><span class="step-op">${s.detail}</span><span class="step-val">${s.val}</span></span>
          </div>
        `).join('')}
        <div class="rec-total-row">
          <span>计算金额</span>
          <span>¥${result.finalRaw.toLocaleString()} → 吉利取整 ¥${result.lucky.best.toLocaleString()}</span>
        </div>
      </div>
      <div style="font-size:0.7rem;color:var(--ink-lighter);margin-top:12px;line-height:1.6">
        💡 ${result.lucky.best % 2 === 0 ? '偶数金额，"好事成双" · ' : ''}${String(result.lucky.best).includes('6')?'含"6"，寓意顺利 · ':''}${String(result.lucky.best).includes('8')?'含"8"，寓意发达 · ':''}
        💰 月薪 ¥${result.salary.toLocaleString()}，${eventType}建议不超过月薪 ${(result.salaryCap*100).toFixed(0)}% — 量力而行，情谊在心
      </div>
    </div>
  `;
}

// ============ SALARY PERSISTENCE ============
function getSalary() {
  const v = parseInt(localStorage.getItem('renqing_salary')) || 8000;
  document.getElementById('rec-salary').value = v;
  return v;
}
function saveSalary() {
  const v = parseInt(document.getElementById('rec-salary').value) || 8000;
  localStorage.setItem('renqing_salary', v);
}

// ============ RECORDS ============
function refreshRecords() {
  const div = document.getElementById('all-records');
  let filtered = records;
  if (currentFilter === 'out') filtered = records.filter(r=>r.direction==='out');
  else if (currentFilter === 'in') filtered = records.filter(r=>r.direction==='in');
  else if (currentFilter !== 'all') filtered = records.filter(r=>r.event===currentFilter);

  filtered.sort((a,b)=>b.date.localeCompare(a.date));

  if (filtered.length === 0) {
    div.innerHTML = '<div class="empty-state" style="padding:20px"><div class="empty-icon">📋</div><div>暂无记录</div></div>';
  } else {
    div.innerHTML = filtered.map(r=>recordToHTML(r)).join('');
  }
}

function filterRecords(type, btn) {
  currentFilter = type;
  document.querySelectorAll('#sec-records .filter-chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  refreshRecords();
}

// ============ UTILS ============
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1800);
}

// ============ INIT ============
document.getElementById('form-date').value = new Date().toISOString().split('T')[0];
getSalary(); // Load salary from localStorage
refreshHome();
refreshRecommendPersonList();
refreshRecords();
</script>
