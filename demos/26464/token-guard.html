<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokenGuard - 团队Token用量检测平台</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #8b5cf6;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --dark: #0f172a;
            --darker: #020617;
            --card: #1e293b;
            --border: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            color: var(--text);
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border);
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .logo {
            padding: 0 24px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-menu {
            list-style: none;
            padding: 0 12px;
        }

        .nav-item {
            margin-bottom: 4px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s;
            font-size: 14px;
        }

        .nav-link:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--text);
        }

        .nav-link.active {
            background: rgba(99, 102, 241, 0.2);
            color: var(--text);
            border-left: 3px solid var(--primary);
        }

        .nav-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 24px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .stat-icon.blue { background: rgba(59, 130, 246, 0.15); color: var(--info); }
        .stat-icon.green { background: rgba(34, 197, 94, 0.15); color: var(--success); }
        .stat-icon.orange { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .stat-icon.red { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-change {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-change.up { color: var(--success); }
        .stat-change.down { color: var(--danger); }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 16px;
        }

        .chart-card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .chart-container {
            height: 300px;
        }

        .token-list {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .token-list-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .token-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        .token-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .token-item:last-child {
            border-bottom: none;
        }

        .token-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .token-name-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .token-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-glm { background: #00b4ab; color: white; }
        .badge-kimi { background: #ff4d4f; color: white; }
        .badge-minimax { background: #722ed1; color: white; }
        .badge-mimo { background: #13c2c2; color: white; }
        .badge-qwen { background: #ff6a00; color: white; }

        .token-name {
            font-weight: 600;
            font-size: 15px;
        }

        .token-status {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .status-normal { background: rgba(34, 197, 94, 0.15); color: var(--success); }
        .status-warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .status-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

        .usage-bar {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .usage-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .usage-fill.normal { background: linear-gradient(90deg, var(--success), #4ade80); }
        .usage-fill.warning { background: linear-gradient(90deg, var(--warning), #fbbf24); }
        .usage-fill.danger { background: linear-gradient(90deg, var(--danger), #f87171); }

        .usage-text {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--card);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            border: 1px solid var(--border);
            overflow: hidden;
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }

        .modal-close:hover {
            color: var(--text);
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
        }

        .form-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .alert-banner {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(239, 68, 68, 0.1));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .alert-icon {
            font-size: 20px;
            color: var(--warning);
        }

        .alert-content h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .alert-content p {
            font-size: 13px;
            color: var(--text-muted);
        }

        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                transform: translateX(-100%);
                transition: transform 0.3s;
                z-index: 999;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }

            .top-bar {
                flex-wrap: wrap;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <div class="logo-icon">🔒</div>
                <span class="logo-text">TokenGuard</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link active">
                        <span class="nav-icon">📊</span>
                        <span>仪表盘</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <span class="nav-icon">🔑</span>
                        <span>Token管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <span class="nav-icon">📈</span>
                        <span>用量统计</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <span class="nav-icon">⚙️</span>
                        <span>系统设置</span>
                    </a>
                </li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <h1 class="page-title">Token用量监控仪表盘</h1>
                <div class="user-info">
                    <span class="user-name">管理员</span>
                    <div class="user-avatar">AD</div>
                </div>
            </div>

            <div class="alert-banner">
                <span class="alert-icon">⚠️</span>
                <div class="alert-content">
                    <h4>用量预警提醒</h4>
                    <p>GLM-4 Token用量已达85%，请及时关注并充值</p>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-label">总Token用量</span>
                        <div class="stat-icon blue">🔢</div>
                    </div>
                    <div class="stat-value">12.8M</div>
                    <div class="stat-change up">
                        <span>↑</span>
                        <span>23.5% 较上周</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-label">服务商数量</span>
                        <div class="stat-icon green">🌐</div>
                    </div>
                    <div class="stat-value">5</div>
                    <div class="stat-change up">
                        <span>↑</span>
                        <span>1 新增</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-label">本月消耗</span>
                        <div class="stat-icon orange">💰</div>
                    </div>
                    <div class="stat-value">¥2,847</div>
                    <div class="stat-change up">
                        <span>↑</span>
                        <span>15.2% 较上月</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-label">预警数量</span>
                        <div class="stat-icon red">🚨</div>
                    </div>
                    <div class="stat-value">2</div>
                    <div class="stat-change down">
                        <span>↓</span>
                        <span>1 已处理</span>
                    </div>
                </div>
            </div>

            <div class="content-grid">
                <div class="chart-card">
                    <div class="card-header">
                        <h3 class="card-title">Token用量趋势（近7天）</h3>
                        <div class="card-actions">
                            <button class="btn btn-secondary">📅 本周</button>
                            <button class="btn btn-secondary">📆 本月</button>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="usageChart"></canvas>
                    </div>
                </div>

                <div class="token-list">
                    <div class="token-list-header">
                        <h3 class="card-title">Token服务列表</h3>
                        <button class="btn btn-primary" onclick="openAddModal()">+ 添加服务</button>
                    </div>
                    <div id="tokenList">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">添加Token服务</h3>
                <button class="modal-close" onclick="closeAddModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">服务商名称</label>
                    <select class="form-select" id="serviceProvider">
                        <option value="glm">GLM</option>
                        <option value="kimi">Kimi</option>
                        <option value="minimax">MiniMax</option>
                        <option value="mimo">Mimo</option>
                        <option value="qwen">Qwen</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">服务名称</label>
                    <input type="text" class="form-input" id="serviceName" placeholder="例如：GPT-4 Turbo">
                </div>
                <div class="form-group">
                    <label class="form-label">总量（Tokens）</label>
                    <input type="number" class="form-input" id="totalTokens" placeholder="例如：1000000">
                </div>
                <div class="form-group">
                    <label class="form-label">已用量（Tokens）</label>
                    <input type="number" class="form-input" id="usedTokens" placeholder="例如：500000">
                </div>
                <div class="form-group">
                    <label class="form-label">预警阈值（%）</label>
                    <input type="number" class="form-input" id="alertThreshold" value="80" placeholder="例如：80">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAddModal()">取消</button>
                <button class="btn btn-primary" onclick="addTokenService()">确认添加</button>
            </div>
        </div>
    </div>

    <script>
        const tokenServices = [
            { id: 1, provider: 'glm', name: 'GLM-4', total: 1000000, used: 850000, threshold: 80 },
            { id: 2, provider: 'kimi', name: 'Kimi 3.0', total: 2000000, used: 680000, threshold: 80 },
            { id: 3, provider: 'minimax', name: 'MiniMax Pro', total: 1500000, used: 1125000, threshold: 70 },
            { id: 4, provider: 'mimo', name: 'Mimo Chat', total: 500000, used: 125000, threshold: 80 },
            { id: 5, provider: 'qwen', name: 'Qwen 2.5', total: 800000, used: 400000, threshold: 80 }
        ];

        const providerBadges = {
            glm: 'badge-glm',
            kimi: 'badge-kimi',
            minimax: 'badge-minimax',
            mimo: 'badge-mimo',
            qwen: 'badge-qwen'
        };

        const providerNames = {
            glm: 'GLM',
            kimi: 'Kimi',
            minimax: 'MiniMax',
            mimo: 'Mimo',
            qwen: 'Qwen'
        };

        function getStatus(percentage, threshold) {
            if (percentage >= threshold) return { label: '即将耗尽', class: 'status-danger' };
            if (percentage >= threshold * 0.7) return { label: '用量偏高', class: 'status-warning' };
            return { label: '正常', class: 'status-normal' };
        }

        function getBarClass(percentage, threshold) {
            if (percentage >= threshold) return 'danger';
            if (percentage >= threshold * 0.7) return 'warning';
            return 'normal';
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function renderTokenList() {
            const list = document.getElementById('tokenList');
            list.innerHTML = tokenServices.map(service => {
                const percentage = Math.round((service.used / service.total) * 100);
                const status = getStatus(percentage, service.threshold);
                const barClass = getBarClass(percentage, service.threshold);

                return `
                    <div class="token-item">
                        <div class="token-info">
                            <div class="token-name-row">
                                <span class="token-badge ${providerBadges[service.provider]}">${providerNames[service.provider]}</span>
                                <span class="token-name">${service.name}</span>
                            </div>
                            <span class="token-status ${status.class}">${status.label}</span>
                        </div>
                        <div class="usage-bar">
                            <div class="usage-fill ${barClass}" style="width: ${percentage}%"></div>
                        </div>
                        <div class="usage-text">
                            <span>已用: ${formatNumber(service.used)}</span>
                            <span>总量: ${formatNumber(service.total)}</span>
                            <span>${percentage}%</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function initChart() {
            const ctx = document.getElementById('usageChart').getContext('2d');
            
            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(99, 102, 241, 0.5)');
            gradient.addColorStop(1, 'rgba(99, 102, 241, 0.0)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                    datasets: [{
                        label: 'Token用量 (K)',
                        data: [1200, 1900, 1500, 2100, 1800, 2500, 2200],
                        borderColor: '#6366f1',
                        backgroundColor: gradient,
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#6366f1',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 6,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            titleColor: '#f1f5f9',
                            bodyColor: '#94a3b8',
                            borderColor: '#334155',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return '用量: ' + context.raw + 'K Tokens';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(51, 65, 85, 0.5)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: { size: 12 }
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(51, 65, 85, 0.5)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: { size: 12 },
                                callback: function(value) {
                                    return value + 'K';
                                }
                            }
                        }
                    }
                }
            });
        }

        function openAddModal() {
            document.getElementById('addModal').classList.add('active');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('serviceName').value = '';
            document.getElementById('totalTokens').value = '';
            document.getElementById('usedTokens').value = '';
            document.getElementById('alertThreshold').value = '80';
        }

        function addTokenService() {
            const provider = document.getElementById('serviceProvider').value;
            const name = document.getElementById('serviceName').value;
            const total = parseInt(document.getElementById('totalTokens').value);
            const used = parseInt(document.getElementById('usedTokens').value);
            const threshold = parseInt(document.getElementById('alertThreshold').value);

            if (!name || isNaN(total) || isNaN(used) || isNaN(threshold)) {
                alert('请填写完整信息');
                return;
            }

            tokenServices.push({
                id: Date.now(),
                provider,
                name,
                total,
                used,
                threshold
            });

            renderTokenList();
            closeAddModal();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTokenList();
            initChart();
        });
    </script>
</body>
</html>
