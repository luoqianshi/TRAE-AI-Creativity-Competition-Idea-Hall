<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>六枚成卦 · 易经64卦铜币摇卦</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #120d08;
      --panel: rgba(48, 31, 17, 0.74);
      --panel-2: rgba(89, 53, 24, 0.48);
      --gold: #f5c76a;
      --gold-2: #ad7629;
      --text: #f8ead0;
      --muted: #c8a77b;
      --red: #d75b46;
      --green: #71c284;
      --line: rgba(255, 220, 146, 0.22);
      --shadow: 0 18px 55px rgba(0, 0, 0, 0.42);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(245, 199, 106, 0.18), transparent 30%),
        radial-gradient(circle at 80% 0%, rgba(196, 73, 48, 0.14), transparent 28%),
        linear-gradient(135deg, #100905, #1d120b 45%, #080604);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      background-image:
        linear-gradient(30deg, transparent 48%, #f5c76a 49%, transparent 50%),
        linear-gradient(150deg, transparent 48%, #f5c76a 49%, transparent 50%);
      background-size: 72px 72px;
    }

    .app {
      width: min(1280px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 48px;
    }

    header {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 22px;
      align-items: stretch;
      margin-bottom: 22px;
    }

    .hero, .card {
      background: linear-gradient(145deg, rgba(69, 41, 20, 0.84), rgba(24, 15, 9, 0.78));
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 34px;
    }

    .hero::after {
      content: "乾坤";
      position: absolute;
      right: 24px;
      bottom: -34px;
      font-family: serif;
      font-size: 120px;
      color: rgba(245, 199, 106, 0.07);
      letter-spacing: 0.1em;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(34px, 5vw, 62px);
      letter-spacing: 0.08em;
      line-height: 1.05;
    }

    .subtitle {
      margin: 0;
      max-width: 820px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }

    .guide {
      padding: 26px;
    }

    .guide h2, .card h2 {
      margin: 0 0 14px;
      font-size: 20px;
      letter-spacing: 0.08em;
    }

    .guide p {
      margin: 9px 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(420px, 1fr) minmax(430px, 0.92fr);
      gap: 22px;
      align-items: start;
    }

    .coin-board {
      padding: 22px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    button, .link-btn {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      color: #2a1606;
      background: linear-gradient(135deg, #ffe5a5, #d29332);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
      transition: transform 0.18s ease, filter 0.18s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover, .link-btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
    button.secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
    }

    .rows {
      display: grid;
      gap: 14px;
    }

    .row {
      display: grid;
      grid-template-columns: 74px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.035);
    }

    .row.done {
      background: linear-gradient(90deg, rgba(245, 199, 106, 0.13), rgba(255, 255, 255, 0.035));
    }

    .row-label {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .row-label b {
      display: block;
      color: var(--text);
      font-size: 18px;
    }

    .coins {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .coin {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #4b2406;
      background:
        radial-gradient(circle at 35% 28%, #fff3bd, transparent 26%),
        radial-gradient(circle, #e8b955 0 49%, #8d531b 50% 53%, #d69433 54% 100%);
      box-shadow: inset 0 0 0 4px rgba(92, 48, 14, 0.36), 0 7px 14px rgba(0, 0, 0, 0.28);
      font-weight: 900;
      transition: transform 0.3s ease;
    }

    .coin.back {
      color: #ffe2a3;
      background:
        radial-gradient(circle at 35% 28%, rgba(255, 245, 196, 0.45), transparent 26%),
        radial-gradient(circle, #9b5b22 0 49%, #5f3210 50% 53%, #b77a2b 54% 100%);
    }

    .row.rolling .coin {
      animation: flip 0.42s ease-in-out infinite alternate;
    }

    @keyframes flip {
      from { transform: rotateY(0deg) scale(1); }
      to { transform: rotateY(170deg) scale(1.06); }
    }

    .line-info {
      min-width: 74px;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .line-info strong {
      display: block;
      color: var(--text);
      font-size: 18px;
    }

    .result-panel {
      padding: 22px;
      position: sticky;
      top: 18px;
    }

    .hex-wrap {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 20px;
      align-items: center;
      padding: 16px;
      border-radius: 22px;
      background: rgba(0, 0, 0, 0.15);
      border: 1px solid var(--line);
    }

    .hexagram {
      display: flex;
      flex-direction: column-reverse;
      gap: 11px;
      align-items: center;
      padding: 12px 0;
    }

    .yao {
      width: 122px;
      height: 15px;
      display: flex;
      gap: 18px;
      justify-content: center;
      position: relative;
    }

    .yao::before, .yao::after {
      content: "";
      height: 100%;
      border-radius: 8px;
      background: linear-gradient(90deg, #fbe6a6, #c8862a);
      box-shadow: 0 2px 10px rgba(245, 199, 106, 0.22);
    }

    .yao.yang::before { width: 122px; }
    .yao.yang::after { display: none; }
    .yao.yin::before, .yao.yin::after { width: 52px; }
    .yao.moving::before, .yao.moving::after {
      background: linear-gradient(90deg, #ffd0c7, #d75b46);
    }

    .hex-title {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: 0.08em;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }

    .tag {
      display: inline-flex;
      padding: 5px 10px;
      border-radius: 999px;
      color: #ffdf9a;
      background: rgba(245, 199, 106, 0.11);
      border: 1px solid rgba(245, 199, 106, 0.24);
      font-size: 13px;
    }

    .empty {
      color: var(--muted);
      line-height: 1.8;
      border: 1px dashed var(--line);
      border-radius: 20px;
      padding: 18px;
      margin-top: 16px;
    }

    .interpretation {
      margin-top: 18px;
      display: grid;
      gap: 14px;
    }

    .section {
      padding: 15px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 220, 146, 0.14);
    }

    .section h3 {
      margin: 0 0 8px;
      color: #ffdd96;
      font-size: 16px;
    }

    .section p {
      margin: 0;
      color: #e8cfaa;
      line-height: 1.75;
    }

    .moving-lines {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .moving-line {
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(215, 91, 70, 0.1);
      color: #ffd2c9;
      border: 1px solid rgba(215, 91, 70, 0.28);
      line-height: 1.6;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      padding: 12px 18px;
      border-radius: 999px;
      color: #2a1606;
      background: #ffe3a2;
      box-shadow: var(--shadow);
      pointer-events: none;
      transition: all 0.25s ease;
      font-weight: 700;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 980px) {
      header, .main-grid, .hex-wrap {
        grid-template-columns: 1fr;
      }
      .result-panel { position: static; }
    }

    @media (max-width: 620px) {
      .app { width: min(100% - 18px, 1280px); padding-top: 14px; }
      .hero, .guide, .coin-board, .result-panel { padding: 18px; border-radius: 22px; }
      .row { grid-template-columns: 1fr; }
      .line-info { text-align: left; }
      .coins { justify-content: space-between; }
      .coin { width: 48px; height: 48px; }
      .controls button, .link-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <section class="hero">
        <h1>六枚成卦</h1>
        <p class="subtitle">每一爻由三枚铜币生成，六组从下往上依次排列。本卦显示当前卦象，老阴、老阳为动爻，并据此自动生成变卦。</p>
      </section>
      <aside class="guide card">
        <h2>投币规则</h2>
        <p>正面记 3，反面记 2。三币合计：6 老阴、7 少阳、8 少阴、9 老阳。</p>
        <p>老阴变阳，老阳变阴；少阴、少阳不变。第 1 组为初爻，排在最下方。</p>
      </aside>
    </header>

    <section class="main-grid">
      <div class="coin-board card">
        <div class="controls">
          <button id="shakeAll">一键摇完整卦</button>
          <button class="secondary" id="reset">重新开始</button>
          <a class="link-btn" href="https://m.zhouyi.cc/zhouyi/yijing64/" target="_blank" rel="noreferrer">参考易经64卦</a>
        </div>
        <div class="rows" id="rows"></div>
      </div>

      <aside class="result-panel card">
        <h2>卦象结果</h2>
        <div id="result">
          <div class="empty">请从“初爻”开始逐组点击摇卦，或使用“一键摇完整卦”。完成六爻后会显示本卦、变卦、动爻与注解。</div>
        </div>
      </aside>
    </section>
  </main>
  <div class="toast" id="toast"></div>

      48: ["水风井", "改邑不改井，无丧无得，往来井井", "井养不穷，重在稳定供给。适合完善基础设施与公共价值。"],
      49: ["泽火革", "己日乃孚，元亨利贞，悔亡", "变革须得时得信。先建立共识，再更新制度。"],
      50: ["火风鼎", "元吉，亨", "鼎新成器，适合整合资源、成就新局。重在品质与位置。"],
      51: ["震为雷", "亨，震来虩虩，笑言哑哑", "震动惊醒，转危为机。先稳心神，再应变化。"],
      52: ["艮为山", "艮其背，不获其身", "止于其所，静定为宜。适合暂停、边界、专注。"],
      53: ["风山渐", "女归吉，利贞", "循序渐进，礼序成事。不可急于求成。"],
      54: ["雷泽归妹", "征凶，无攸利", "名分未正，关系易偏。宜慎重承诺，先理顺位置。"],
      55: ["雷火丰", "亨，王假之，勿忧，宜日中", "盛大丰盈，但盛极易变。把握当下，勿贪久盛。"],
      56: ["火山旅", "小亨，旅贞吉", "旅居在外，宜谦逊守礼。小事可成，大事谨慎。"],
      57: ["巽为风", "小亨，利有攸往，利见大人", "柔入而成，循序渗透。适合沟通、执行、细节推进。"],
      58: ["兑为泽", "亨，利贞", "悦而有节，以和为贵。沟通可成，但不可取悦过度。"],
      59: ["风水涣", "亨，王假有庙，利涉大川", "离散须聚，先化解隔阂。适合重建共同目标。"],
      60: ["水泽节", "亨，苦节不可贞", "节制有度，规则能成事。过度约束反伤发展。"],
      61: ["风泽中孚", "豚鱼吉，利涉大川，利贞", "内诚信实，感通万物。以诚意建立合作。"],
      62: ["雷山小过", "亨，利贞，可小事，不可大事", "小有过越，大事不宜。低飞谨行，细节优先。"],
      63: ["水火既济", "亨小，利贞，初吉终乱", "事已成形，防成后生乱。宜维护、复盘、查漏补缺。"],
      64: ["火水未济", "亨，小狐汔济，濡其尾，无攸利", "未完成而将成。最后阶段更要谨慎，避免功亏一篑。"]
    };

    const lineNames = ["初爻", "二爻", "三爻", "四爻", "五爻", "上爻"];
    const states = ["老阴", "少阳", "少阴", "老阳"];
    let lines = Array(6).fill(null);

    const rowsEl = document.querySelector("#rows");
    const resultEl = document.querySelector("#result");
    const toastEl = document.querySelector("#toast");

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toastEl.classList.remove("show"), 1700);
    }

    function coinValue() {
      return Math.random() < 0.5 ? { face: "正", value: 3 } : { face: "反", value: 2 };
    }

    function getLineType(sum) {
      if (sum === 6) return { name: "老阴", bit: 0, changed: 1, moving: true, mark: "×" };
      if (sum === 7) return { name: "少阳", bit: 1, changed: 1, moving: false, mark: "—" };
      if (sum === 8) return { name: "少阴", bit: 0, changed: 0, moving: false, mark: "--" };
      return { name: "老阳", bit: 1, changed: 0, moving: true, mark: "○" };
    }

    function shakeLine(index) {
      const row = document.querySelector(`[data-index="${index}"]`);
      row.classList.add("rolling");
      setTimeout(() => {
        const coins = [coinValue(), coinValue(), coinValue()];
        const sum = coins.reduce((n, c) => n + c.value, 0);
        const type = getLineType(sum);
        lines[index] = { coins, sum, ...type };
        row.classList.remove("rolling");
        renderRows();
        renderResult();
      }, 460);
    }

    function renderRows() {
      rowsEl.innerHTML = lines.map((line, index) => {
        const coinHtml = (line ? line.coins : [{ face: "?", value: 0 }, { face: "?", value: 0 }, { face: "?", value: 0 }]).map(c => {
          const back = c.face === "反" ? " back" : "";
          return `<span class="coin${back}" title="${c.face === "?" ? "未摇" : c.face + "面"}">${c.face}</span>`;
        }).join("");
        return `
          <div class="row ${line ? "done" : ""}" data-index="${index}">
            <div class="row-label"><b>${lineNames[index]}</b>${index === 0 ? "最下方" : index === 5 ? "最上方" : "由下往上"}</div>
            <div class="coins">${coinHtml}</div>
            <div class="line-info">
              ${line ? `<strong>${line.name}${line.moving ? " 动" : ""}</strong>合计 ${line.sum}` : `<button onclick="shakeLine(${index})">摇第 ${index + 1} 组</button>`}
            </div>
          </div>
        `;
      }).join("");
    }

    function bitsToHex(bits) {
      const lower = bits.slice(0, 3).join("");
      const upper = bits.slice(3, 6).join("");
      const no = kingWenTable[upper + "|" + lower];
      return { no, lower, upper, data: hexagrams[no] };
    }

    function yaoText(line, index) {
      const pos = lineNames[index];
      if (!line.moving) return "";
      const direction = line.name === "老阴" ? "阴爻发动，变为阳爻" : "阳爻发动，变为阴爻";
      const advice = [
        "初爻主事情初始，宜审慎起步，先定方向。",
        "二爻主内在位置，宜守中得助，重在关系与基础。",
        "三爻多处进退之间，宜防急躁与越位。",
        "四爻临近外部变化，宜观察形势，顺势调整。",
        "五爻居尊位，宜以正道统筹全局。",
        "上爻主事情末端，宜知止、收束或转换阶段。"
      ][index];
      return `${pos}：${line.name}，${direction}。${advice}`;
    }

    function renderHexagram(bits, moving = []) {
      return `<div class="hexagram">${bits.map((bit, index) => `<div class="yao ${bit ? "yang" : "yin"} ${moving.includes(index) ? "moving" : ""}"></div>`).join("")}</div>`;
    }

    function renderResult() {
      if (lines.some(x => !x)) {
        const done = lines.filter(Boolean).length;
        resultEl.innerHTML = `<div class="empty">已完成 ${done}/6 组。请继续从下往上摇卦，完成后自动生成对应卦象。</div>`;
        return;
      }

      const baseBits = lines.map(l => l.bit);
      const changedBits = lines.map(l => l.changed);
      const movingIndexes = lines.map((l, i) => l.moving ? i : -1).filter(i => i >= 0);
      const base = bitsToHex(baseBits);
      const changed = bitsToHex(changedBits);
      const upper = trigramInfo[base.upper];
      const lower = trigramInfo[base.lower];
      const changedUpper = trigramInfo[changed.upper];
      const changedLower = trigramInfo[changed.lower];
      const baseName = base.data[0];
      const changedName = changed.data[0];
      const movingHtml = movingIndexes.length
        ? `<div class="moving-lines">${movingIndexes.map(i => `<div class="moving-line">${yaoText(lines[i], i)}</div>`).join("")}</div>`
        : `<p>本卦无动爻，通常以本卦卦辞和整体卦意为主；变卦与本卦相同。</p>`;

      resultEl.innerHTML = `
        <div class="hex-wrap">
          ${renderHexagram(baseBits, movingIndexes)}
          <div>
            <h2 class="hex-title">第${base.no}卦 ${baseName}</h2>
            <div class="meta">
              <span class="tag">上卦：${upper.name}为${upper.nature}</span>
              <span class="tag">下卦：${lower.name}为${lower.nature}</span>
              <span class="tag">${movingIndexes.length ? movingIndexes.length + " 个动爻" : "静卦"}</span>
            </div>
            <p class="subtitle">卦辞：${base.data[1]}</p>
          </div>
        </div>
        <div class="interpretation">
          <div class="section">
            <h3>本卦注解</h3>
            <p>${base.data[2]}上卦${upper.name}象${upper.text}下卦${lower.name}象${lower.text}</p>
          </div>
          <div class="section">
            <h3>变卦</h3>
            <p>动爻变化后为第${changed.no}卦「${changedName}」。上卦${changedUpper.name}为${changedUpper.nature}，下卦${changedLower.name}为${changedLower.nature}。${changed.data[2]}</p>
            <div style="margin-top:12px">${renderHexagram(changedBits)}</div>
          </div>
          <div class="section">
            <h3>动爻爻辞参考</h3>
            ${movingHtml}
            <p style="margin-top:10px;color:#c8a77b">完整原文爻辞可点击左侧“参考易经64卦”打开查询；本页内置为占断提示版，便于快速查看。</p>
          </div>
        </div>
      `;
    }

    document.querySelector("#shakeAll").addEventListener("click", () => {
      lines = Array(6).fill(null);
      renderRows();
      [0, 1, 2, 3, 4, 5].forEach((i, order) => setTimeout(() => shakeLine(i), order * 150));
      showToast("正在从初爻到上爻生成卦象");
    });

    document.querySelector("#reset").addEventListener("click", () => {
      lines = Array(6).fill(null);
      renderRows();
      renderResult();
      showToast("已重新开始");
    });

    window.shakeLine = shakeLine;
    renderRows();
  </script>
</body>
</html>
