<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>经典可见 · 学习舱</title>
  <link rel="stylesheet" href="learn.css">
</head>
<body>

<!-- ========== 顶部导航栏 ========== -->
<nav class="top-bar">
  <a href="index.html" class="back-link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    序厅
  </a>
  <div class="top-search-wrap">
    <input type="text" class="top-search" id="top-search" placeholder="搜索原文、白话..." oninput="handleSearch(this.value)" onfocus="showSearchResults()" onblur="hideSearchResultsDelay()">
    <div class="search-results" id="search-results"></div>
  </div>
</nav>

<!-- ========== 每日推荐 Hero + 工具栏 ========== -->
<div class="daily-hero" id="daily-hero">
  <div class="daily-hero-left" id="daily-hero-inner" onclick="showDaily()">
    <!-- JS 填充 -->
  </div>
  <div class="daily-hero-right">
    <button class="hero-tool-btn" onclick="randomCard()" title="随机">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M4 4l17 17" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="hero-tool-btn" onclick="openNote()" title="笔记">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="hero-tool-btn" onclick="openShare()" title="分享">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<!-- ========== 主体框架 ========== -->
<div class="body-frame" id="body-frame">

  <!-- ========== 左侧 - 内容阅读区 ========== -->
  <main class="cabin-main" id="cabin-main">
    <!-- 配图区 -->
    <div class="cabin-image-wrap">
      <img id="card-image" src="" alt="">
      <div class="cabin-image-fade"></div>
    </div>
    <!-- 文字区（可滚动） -->
    <div class="cabin-info">
      <!-- 原文 -->
      <div class="info-section info-primary">
        <div class="cabin-meta">
          <span class="cabin-chapter" id="card-chapter"></span>
          <button class="fav-btn" id="fav-btn" onclick="toggleFav()" title="收藏">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <h1 class="cabin-original" id="card-original"></h1>
        <div class="cabin-segmented" id="card-segmented"></div>
      </div>
      <!-- 解读 -->
      <div class="info-section info-interpretation">
        <div class="fold-tabs">
          <button class="fold-tab active" data-tab="plain" onclick="toggleTab('plain')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></svg>
            白话
          </button>
          <button class="fold-tab" data-tab="mis" onclick="toggleTab('mis')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
            误读
          </button>
          <button class="fold-tab" data-tab="bg" onclick="toggleTab('bg')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            背景
          </button>
          <button class="fold-tab" data-tab="reflect" onclick="toggleTab('reflect')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
            反思
          </button>
        </div>
        <div class="fold-contents">
          <div class="fold-content show" id="content-plain">
            <div class="content-label">一句话白话</div>
            <div class="content-text" id="text-plain"></div>
          </div>
          <div class="fold-content" id="content-mis">
            <div class="content-label">常见误读</div>
            <div class="content-text" id="text-mis"></div>
          </div>
          <div class="fold-content" id="content-bg">
            <div class="content-label">背景提示</div>
            <div class="content-text" id="text-bg"></div>
          </div>
          <div class="fold-content" id="content-reflect">
            <div class="content-label">想一想</div>
            <div class="content-text" id="text-reflect"></div>
          </div>
        </div>
      </div>
      <!-- 工具栏 -->
      <div class="info-section info-tools">
        <div class="tools-left">
          <button class="tool-btn-inline" onclick="openAiChat()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 00-7.07 17.07A10 10 0 1012 2z"/><path d="M9 12h6M12 9v6"/></svg>
            问 AI
          </button>
          <button class="tool-btn-inline" id="voice-btn" onclick="toggleVoice()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
            朗读
          </button>
        </div>
        <div class="tools-right">
          <button class="tool-nav-btn" id="btn-prev-img" onclick="prevCard()" aria-label="上一句">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="page-indicator" id="page-indicator">
            <span class="page-current" id="page-current">01</span>
            <span class="page-divider">/</span>
            <span class="page-total" id="page-total">24</span>
          </div>
          <button class="tool-nav-btn" id="btn-next-img" onclick="nextCard()" aria-label="下一句">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <!-- 顿悟时刻 -->
      <div class="cabin-aha" id="cabin-aha">
        <div class="aha-quote-mark">「</div>
        <div class="aha-text" id="aha-text"></div>
        <div class="aha-label">— 顿悟时刻</div>
      </div>
    </div>
  </main>

  <!-- ========== 右侧面板 - 操作面板 ========== -->
  <aside class="right-panel" id="right-panel">
    <div class="panel-header">
      <h3>学习菜单</h3>
    </div>
    <div class="panel-body">
      <!-- 导航控制 -->
      <div class="panel-section">
        <div class="panel-nav-row">
          <button class="panel-nav-btn" onclick="prevCard()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            上一句
          </button>
          <button class="panel-nav-btn" onclick="randomCard()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M4 4l17 17" stroke-linecap="round" stroke-linejoin="round"/></svg>
            随机
          </button>
          <button class="panel-nav-btn" onclick="nextCard()">
            下一句
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <!-- 课程范围 -->
      <div class="panel-section">
        <div class="panel-section-title">课程范围</div>
        <div class="scope-list" id="scope-list"></div>
      </div>
      <!-- 主题角度 -->
      <div class="panel-section">
        <div class="panel-section-title">主题角度</div>
        <div class="theme-list" id="theme-list"></div>
      </div>
      <!-- 学习进度 -->
      <div class="panel-section">
        <div class="panel-section-title">学习进度</div>
        <div class="progress-wrap" id="progress-wrap">
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar-fill"></div></div>
          <div class="progress-text" id="progress-text">0/24</div>
        </div>
      </div>
      <!-- 我的收藏 -->
      <div class="panel-section">
        <div class="panel-section-title">我的收藏</div>
        <div class="panel-favs" id="panel-favs">暂无收藏</div>
      </div>
      <!-- 复习模式 -->
      <div class="panel-section">
        <button class="review-btn" onclick="openReview()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
          复习模式
        </button>
      </div>
    </div>
  </aside>

</div>

<!-- ========== 笔记弹层 ========== -->
<div class="note-overlay" id="note-overlay">
  <div class="note-modal">
    <div class="note-modal-header">
      <h4>给未来的自己</h4>
      <button onclick="closeNote()">×</button>
    </div>
    <textarea id="note-input" placeholder="记下此刻的感悟，未来的你会回来翻看..."></textarea>
    <div class="saved-notes-mini" id="saved-notes-mini"></div>
    <div class="note-actions">
      <button class="btn-save" onclick="saveNote()">保存感悟</button>
      <button class="btn-cancel" onclick="closeNote()">取消</button>
    </div>
  </div>
</div>

<!-- ========== 分享弹层 ========== -->
<div class="share-overlay" id="share-overlay">
  <div class="share-modal">
    <div class="share-modal-header">
      <h4>生成分享卡片</h4>
      <button onclick="closeShare()">×</button>
    </div>
    <div class="share-preview" id="share-preview">
      <div class="share-brand">经典可见 · 道德经</div>
      <div class="share-original" id="share-original"></div>
      <div class="share-plain" id="share-plain"></div>
      <div class="share-aha" id="share-aha"></div>
    </div>
    <div class="share-actions">
      <button class="btn-download" onclick="downloadShareImage()">保存图片</button>
      <button class="btn-cancel" onclick="closeShare()">关闭</button>
    </div>
  </div>
</div>

<!-- ========== 每日推荐弹层 ========== -->
<div class="daily-overlay" id="daily-overlay">
  <div class="daily-modal">
    <button class="daily-close" onclick="closeDaily()">×</button>
    <div class="daily-badge" id="daily-badge">今日精选</div>
    <div class="daily-original" id="daily-original"></div>
    <div class="daily-plain" id="daily-plain"></div>
    <div class="daily-aha" id="daily-aha"></div>
    <div class="daily-toggle-wrap">
      <label class="daily-toggle-label">
        <input type="checkbox" id="daily-auto-toggle" onchange="toggleDailyAuto()">
        <span class="daily-toggle-slider"></span>
        每日自动显示推荐
      </label>
    </div>
  </div>
</div>

<!-- ========== AI 对话弹窗 ========== -->
<div class="ai-overlay" id="ai-overlay">
  <div class="ai-modal">
    <button class="ai-close" onclick="closeAiChat()">×</button>
    <div class="ai-header">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 00-7.07 17.07A10 10 0 1012 2z"/><path d="M9 12h6M12 9v6"/></svg>
      <span>AI 解读助手</span>
      <span class="ai-mock-tag">演示版</span>
    </div>
    <div class="ai-chat-body" id="ai-chat-body"></div>
    <div class="ai-input-wrap">
      <input type="text" id="ai-input" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')sendAiMessage()">
      <button onclick="sendAiMessage()">发送</button>
    </div>
    <div class="ai-mock-notice">当前为演示环境，使用预设回答。后续将接入真实大模型。</div>
  </div>
</div>

<!-- ========== 复习模式弹窗 ========== -->
<div class="review-overlay" id="review-overlay">
  <div class="review-modal">
    <button class="review-close" onclick="closeReview()">×</button>
    <div class="review-badge">复习模式</div>
    <div class="review-original" id="review-original"></div>
    <div class="review-answer" id="review-answer"></div>
    <div class="review-actions" id="review-actions">
      <button class="btn-reveal" onclick="revealReviewAnswer()">揭示答案</button>
      <button class="btn-next-review" onclick="nextReviewCard()" style="display:none">下一张</button>
    </div>
    <div class="review-progress" id="review-progress"></div>
  </div>
</div>

<!-- ========== 通关动画层 ========== -->
<div class="completion-overlay" id="completion-overlay">
  <div class="completion-content">
    <div class="completion-ink"></div>
    <div class="completion-text" id="completion-text"></div>
  </div>
</div>

<!-- ========== 水墨扩散过渡层 ========== -->
<div class="ink-transition" id="ink-transition"></div>

<!-- ========== 脚本 ========== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="data.js"></script>
<script src="learn.js"></script>
</body>
</html>
