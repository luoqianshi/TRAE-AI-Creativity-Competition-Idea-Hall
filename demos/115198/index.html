<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三体模拟器</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/panel.css" />
    <link rel="stylesheet" href="css/component.css" />
    <link rel="stylesheet" href="css/body-panel.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div class="modal-overlay" id="welcomeModal">
      <div class="modal">
        <h2>三体模拟器</h2>
        <p>这是一个基于牛顿万有引力定律的三体模拟器。</p>
        <p>操作说明：</p>
        <ul>
          <li>初始状态下可拖拽天体调整位置</li>
          <li>初始状态下点击天体或列表可查看和编辑参数</li>
          <li>运行时点击天体或列表可追踪该天体</li>
          <li>拖拽空白处可平移视野</li>
          <li>滚轮可缩放视图</li>
        </ul>
        <button class="primary modal-btn" id="closeModalBtn">开始体验</button>
      </div>
    </div>

    <div class="top-bar">
      <div class="body-panel" id="bodyPanel">
        <div class="panel-header">
          <div class="panel-title">天体控制</div>
          <div class="collapse-btn" id="bodyCollapseBtn">−</div>
        </div>
        <div class="panel-body">
          <div class="body-list" id="bodyList"></div>

          <div id="bodyDetailSection">
            <div class="control-row">
              <div class="control-label">
                <span>名称</span>
                <input
                  type="text"
                  class="text-input"
                  id="bodyNameInput"
                  value="天体1"
                />
              </div>
            </div>

            <div class="control-row">
              <div class="control-label">
                <span>颜色</span>
                <div class="color-picker-inline">
                  <input
                    type="color"
                    id="bodyColor"
                    class="color-picker"
                    value="#ff6b6b"
                  />
                </div>
              </div>
            </div>

            <div class="control-row">
              <div class="control-label">
                <span>质量</span>
                <input
                  type="number"
                  class="num-input"
                  id="bodyMassInput"
                  step="50"
                  value="1000"
                />
              </div>
            </div>

            <div class="control-row">
              <div class="control-label">
                <span>速度大小</span>
                <input
                  type="number"
                  class="num-input"
                  id="bodySpeedInput"
                  step="0.05"
                  value="1"
                />
              </div>
            </div>

            <div class="control-row">
              <div class="control-label">
                <span>速度方向(°)</span>
                <input
                  type="number"
                  class="num-input"
                  id="bodyAngleInput"
                  min="0"
                  max="360"
                  step="1"
                  value="0"
                  style="width: 55px"
                />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="info-panel">
        <div class="panel-header">
          <div class="panel-title">运行信息</div>
          <div class="collapse-btn" id="infoCollapseBtn">−</div>
        </div>
        <div class="panel-body">
          <div class="info-row">
            <span>时间</span><span id="timeDisplay">0.00</span>
          </div>
          <div class="info-row">
            <span>帧率</span><span id="fpsDisplay">60</span>
          </div>
        </div>
      </div>

      <div class="control-panel" id="controlPanel">
        <div class="panel-header">
          <div class="panel-title">控制面板</div>
          <div class="collapse-btn" id="controlCollapseBtn">−</div>
        </div>
        <div class="panel-body">
          <div class="control-row">
            <div class="btn-group">
              <button id="playBtn" class="primary">开始</button>
              <button id="resetBtn">重置</button>
            </div>
          </div>

          <div class="control-row">
            <button id="randomBtn" class="primary" style="width: 100%">
              随机生成
            </button>
          </div>

          <div class="control-row">
            <div class="control-label">
              <span>模拟速度</span>
              <input
                type="number"
                class="num-input"
                id="speedInput"
                min="0.01"
                step="0.1"
                value="1"
                style="width: 55px"
              />
            </div>
          </div>

          <div class="control-row">
            <div class="toggle-row">
              <span style="font-size: 12px; color: rgba(180, 190, 230, 0.7)"
                >天体名字</span
              >
              <div class="toggle" id="bodyNameToggle"></div>
            </div>
          </div>

          <div class="control-row">
            <div class="toggle-row">
              <span style="font-size: 12px; color: rgba(180, 190, 230, 0.7)"
                >速度方向</span
              >
              <div class="toggle" id="velocityToggle"></div>
            </div>
          </div>

          <div class="control-row">
            <div class="toggle-row">
              <div style="display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 12px; color: rgba(180, 190, 230, 0.7)"
                  >显示轨迹</span
                >
                <span style="font-size: 10px; color: rgba(180, 190, 230, 0.4)"
                  >可能导致性能下降</span
                >
              </div>
              <div class="toggle active" id="trailToggle"></div>
            </div>
          </div>

          <div class="control-row" id="trailModeRow">
            <div class="radio-group">
              <label class="radio-label">
                <input type="radio" name="trailMode" value="partial" checked />
                <span class="radio-custom"></span>
                <span>部分</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="trailMode" value="full" />
                <span class="radio-custom"></span>
                <span>全部</span>
              </label>
            </div>
          </div>

          <div class="control-row" id="trailDurationRow">
            <div class="control-label">
              <span>轨迹时长(秒)</span>
              <input
                type="number"
                class="num-input"
                id="trailDurationInput"
                min="1"
                max="100"
                step="1"
                value="10"
                style="width: 55px"
              />
            </div>
          </div>

          <div class="advanced-section">
            <div class="advanced-toggle" id="advancedToggle">
              <span>高级设置</span>
              <span class="advanced-arrow">▸</span>
            </div>
            <div class="advanced-content" id="advancedContent">
              <div class="control-row">
                <div class="control-label">
                  <span>引力常数G</span>
                  <input
                    type="number"
                    class="num-input"
                    id="gravityInput"
                    step="10"
                    value="500"
                    style="width: 55px"
                  />
                </div>
              </div>
              <div class="control-row">
                <div class="control-label">
                  <span>随机质量最小值</span>
                  <input
                    type="number"
                    class="num-input"
                    id="massMinInput"
                    step="50"
                    value="500"
                    style="width: 55px"
                  />
                </div>
              </div>
              <div class="control-row">
                <div class="control-label">
                  <span>随机质量最大值</span>
                  <input
                    type="number"
                    class="num-input"
                    id="massMaxInput"
                    step="50"
                    value="1500"
                    style="width: 55px"
                  />
                </div>
              </div>
              <div class="control-row">
                <div class="control-label">
                  <span>随机速度最小值</span>
                  <input
                    type="number"
                    class="num-input"
                    id="speedMinInput"
                    step="0.1"
                    value="0.5"
                    style="width: 55px"
                  />
                </div>
              </div>
              <div class="control-row">
                <div class="control-label">
                  <span>随机速度最大值</span>
                  <input
                    type="number"
                    class="num-input"
                    id="speedMaxInput"
                    step="0.1"
                    value="1.3"
                    style="width: 55px"
                  />
                </div>
              </div>
              <div class="control-row">
                <div class="control-label">
                  <span>随机位置范围</span>
                  <input
                    type="number"
                    class="num-input"
                    id="posRangeInput"
                    step="10"
                    value="200"
                    style="width: 55px"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/state.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/render.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
