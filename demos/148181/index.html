<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒计时分层管理工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #4F46E5;
            --primary-light: #EEF2FF;
            --danger-color: #EF4444;
            --danger-light: #FEE2E2;
            --warning-color: #F59E0B;
            --warning-light: #FEF3C7;
            --success-color: #10B981;
            --success-light: #D1FAE5;
            --info-color: #3B82F6;
            --info-light: #DBEAFE;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --border-color: #E2E8F0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .import-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-md);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .section-title svg {
            width: 24px;
            height: 24px;
            color: var(--primary-color);
        }

        .import-area {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .text-input {
            flex: 1;
            min-width: 300px;
        }

        .text-input textarea {
            width: 100%;
            height: 150px;
            padding: 16px;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: all 0.3s ease;
            background: #FAFAFA;
        }

        .text-input textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--card-bg);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .text-input textarea::placeholder {
            color: var(--text-secondary);
        }

        .import-hints {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 10px;
            line-height: 1.8;
        }

        .import-hints ul {
            padding-left: 20px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 200px;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: #4338CA;
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--primary-light);
            border-color: var(--primary-color);
        }

        .btn-danger {
            background: var(--danger-light);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }

        .btn-danger:hover {
            background: var(--danger-color);
            color: white;
        }

        .btn-success {
            background: var(--success-light);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        .btn-success:hover {
            background: var(--success-color);
            color: white;
        }

        .btn svg {
            width: 20px;
            height: 20px;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: var(--card-bg);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon.high {
            background: var(--danger-light);
            color: var(--danger-color);
        }

        .stat-icon.medium {
            background: var(--warning-light);
            color: var(--warning-color);
        }

        .stat-icon.low {
            background: var(--info-light);
            color: var(--info-color);
        }

        .stat-icon.future {
            background: var(--success-light);
            color: var(--success-color);
        }

        .stat-icon.total {
            background: var(--primary-light);
            color: var(--primary-color);
        }

        .stat-content {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-tab:hover {
            background: var(--primary-light);
            border-color: var(--primary-color);
        }

        .filter-tab.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .category-filter {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .category-chip {
            padding: 8px 16px;
            border-radius: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        .category-chip:hover {
            background: var(--primary-light);
            border-color: var(--primary-color);
        }

        .category-chip.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .timeline-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .priority-column {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border-top: 4px solid;
        }

        .priority-column.high {
            border-color: var(--danger-color);
        }

        .priority-column.medium {
            border-color: var(--warning-color);
        }

        .priority-column.low {
            border-color: var(--info-color);
        }

        .priority-column.future {
            border-color: var(--success-color);
        }

        .column-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .column-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .column-title svg {
            width: 20px;
            height: 20px;
        }

        .column-count {
            background: var(--bg-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .task-card {
            background: var(--bg-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .task-card:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow-md);
        }

        .task-card.high {
            border-left-color: var(--danger-color);
        }

        .task-card.medium {
            border-left-color: var(--warning-color);
        }

        .task-card.low {
            border-left-color: var(--info-color);
        }

        .task-card.future {
            border-left-color: var(--success-color);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .task-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            flex: 1;
            margin-right: 10px;
            line-height: 1.4;
        }

        .task-category {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .category-customer {
            background: #FCE7F3;
            color: #DB2777;
        }

        .category-activity {
            background: #FEF3C7;
            color: #D97706;
        }

        .category-finance {
            background: #D1FAE5;
            color: #059669;
        }

        .category-visit {
            background: #DBEAFE;
            color: #2563EB;
        }

        .category-other {
            background: #F3F4F6;
            color: #6B7280;
        }

        .task-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .task-date {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .task-date svg {
            width: 16px;
            height: 16px;
        }

        .countdown {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 8px;
        }

        .countdown.urgent {
            background: var(--danger-light);
            color: var(--danger-color);
        }

        .countdown.warning {
            background: var(--warning-light);
            color: var(--warning-color);
        }

        .countdown.normal {
            background: var(--info-light);
            color: var(--info-color);
        }

        .countdown.future {
            background: var(--success-light);
            color: var(--success-color);
        }

        .task-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .action-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            background: var(--card-bg);
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .action-btn:hover {
            background: var(--primary-light);
            color: var(--primary-color);
        }

        .action-btn svg {
            width: 14px;
            height: 14px;
        }

        .export-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-top: 30px;
            box-shadow: var(--shadow-md);
        }

        .export-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--text-secondary);
            padding: 5px;
        }

        .modal-content {
            margin-bottom: 20px;
        }

        .export-preview {
            background: var(--bg-color);
            border-radius: 10px;
            padding: 16px;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 0.875rem;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            z-index: 2000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: var(--success-color);
        }

        .toast.error {
            background: var(--danger-color);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            header h1 {
                font-size: 1.8rem;
            }

            .import-area {
                flex-direction: column;
            }

            .action-buttons {
                flex-direction: row;
                flex-wrap: wrap;
                min-width: auto;
            }

            .action-buttons .btn {
                flex: 1;
                min-width: 140px;
            }

            .timeline-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⏱️ 倒计时分层管理工具</h1>
            <p>批量导入时间节点，AI自动分类分层，一键导出待办清单</p>
        </header>

        <div class="import-section">
            <div class="section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 19V5M5 12l7-7 7 7"/>
                </svg>
                批量导入
            </div>
            <div class="import-area">
                <div class="text-input">
                    <textarea id="importText" placeholder="粘贴Excel内容、备忘录文本或时间事项列表，每行一条。

示例：
客户合同定稿 2024-01-15
社群活动预热 3天后
样品寄回截止 明天下午3点
优惠券下线 2024-01-20 18:00
直播开播 今晚8点
月度对账 1月31日"></textarea>
                    <div class="import-hints">
                        <ul>
                            <li>支持格式："事项内容 日期"、"事项内容 时间"、"事项内容 X天后"</li>
                            <li>日期格式：2024-01-15、1月15日、明天、后天</li>
                            <li>时间格式：下午3点、15:00、今晚8点</li>
                        </ul>
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="parseAndImport()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        一键解析导入
                    </button>
                    <button class="btn btn-secondary" onclick="clearAll()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18"/>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                        </svg>
                        清空全部
                    </button>
                    <button class="btn btn-secondary" onclick="loadSampleData()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <circle cx="12" cy="12" r="4"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        加载示例数据
                    </button>
                </div>
            </div>
        </div>

        <div class="stats-bar" id="statsBar" style="display: none;">
            <div class="stat-item">
                <div class="stat-icon total">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <line x1="9" y1="9" x2="15" y2="9"/>
                        <line x1="9" y1="15" x2="15" y2="15"/>
                    </svg>
                </div>
                <div class="stat-content">
                    <span class="stat-value" id="statTotal">0</span>
                    <span class="stat-label">全部事项</span>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon high">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="stat-content">
                    <span class="stat-value" id="statHigh">0</span>
                    <span class="stat-label">高优先级</span>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon medium">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="stat-content">
                    <span class="stat-value" id="statMedium">0</span>
                    <span class="stat-label">次优先</span>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon low">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="stat-content">
                    <span class="stat-value" id="statLow">0</span>
                    <span class="stat-label">普通</span>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon future">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="stat-content">
                    <span class="stat-value" id="statFuture">0</span>
                    <span class="stat-label">远期规划</span>
                </div>
            </div>
        </div>

        <div class="filter-tabs" id="filterTabs" style="display: none;">
            <button class="filter-tab active" onclick="setPriorityFilter('all')">
                <span>全部</span>
            </button>
            <button class="filter-tab" onclick="setPriorityFilter('high')">
                <span>高优先级</span>
            </button>
            <button class="filter-tab" onclick="setPriorityFilter('medium')">
                <span>次优先</span>
            </button>
            <button class="filter-tab" onclick="setPriorityFilter('low')">
                <span>普通</span>
            </button>
            <button class="filter-tab" onclick="setPriorityFilter('future')">
                <span>远期规划</span>
            </button>
        </div>

        <div class="category-filter" id="categoryFilter" style="display: none;">
            <button class="category-chip active" onclick="setCategoryFilter('all')">全部类型</button>
            <button class="category-chip" onclick="setCategoryFilter('customer')">客户</button>
            <button class="category-chip" onclick="setCategoryFilter('activity')">活动</button>
            <button class="category-chip" onclick="setCategoryFilter('finance')">对账</button>
            <button class="category-chip" onclick="setCategoryFilter('visit')">回访</button>
            <button class="category-chip" onclick="setCategoryFilter('other')">其他</button>
        </div>

        <div class="timeline-container" id="timelineContainer">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <h3>暂无倒计时事项</h3>
                <p>在上方输入框粘贴时间节点文本，点击"一键解析导入"开始使用</p>
            </div>
        </div>

        <div class="export-section" id="exportSection" style="display: none;">
            <div class="section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                一键导出
            </div>
            <div class="export-options">
                <button class="btn btn-success" onclick="exportFeishu()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <line x1="7" y1="7" x2="17" y2="17"/>
                        <line x1="17" y1="7" x2="7" y2="17"/>
                    </svg>
                    飞书待办格式
                </button>
                <button class="btn btn-primary" onclick="exportExcel()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    Excel 清单
                </button>
                <button class="btn btn-secondary" onclick="exportWeChat()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    微信群发文案
                </button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">导出预览</h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-content">
                <div class="export-preview" id="exportPreview"></div>
            </div>
            <button class="btn btn-primary" onclick="copyExportContent()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                复制到剪贴板
            </button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let tasks = [];
        let currentPriorityFilter = 'all';
        let currentCategoryFilter = 'all';
        let exportContent = '';

        const categoryKeywords = {
            customer: ['客户', '合同', '签约', '订单', '退款', '售后', '咨询'],
            activity: ['活动', '直播', '开播', '预热', '促销', '优惠', '新品', '上线'],
            finance: ['对账', '结算', '回款', '发票', '报销', '付款', '收款'],
            visit: ['回访', '跟进', '联系', '沟通', '会议', '面谈', '电话'],
        };

        const urgentKeywords = ['紧急', '立即', '马上', '今天', '今日', '务必', '必须'];
        const warningKeywords = ['明天', '后天', '2天', '3天', '本周', '尽快'];

        function parseDate(input) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            input = input.trim();
            
            const dayMatch = input.match(/(\d+)\s*天(后|内)?/);
            if (dayMatch) {
                const days = parseInt(dayMatch[1]);
                const date = new Date(today);
                date.setDate(date.getDate() + days);
                return date;
            }

            if (input.includes('今天') || input.includes('今日')) {
                return today;
            }
            
            if (input.includes('明天')) {
                const date = new Date(today);
                date.setDate(date.getDate() + 1);
                return date;
            }
            
            if (input.includes('后天')) {
                const date = new Date(today);
                date.setDate(date.getDate() + 2);
                return date;
            }

            if (input.includes('本周')) {
                const date = new Date(today);
                const day = date.getDay();
                const diff = 7 - day;
                date.setDate(date.getDate() + diff);
                return date;
            }

            const dateMatch = input.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
            if (dateMatch) {
                return new Date(dateMatch[1], dateMatch[2] - 1, dateMatch[3]);
            }

            const dateMatch2 = input.match(/(\d{1,2})[-/](\d{1,2})/);
            if (dateMatch2) {
                return new Date(now.getFullYear(), dateMatch2[1] - 1, dateMatch2[2]);
            }

            const dateMatch3 = input.match(/(\d{1,2})月(\d{1,2})日?/);
            if (dateMatch3) {
                return new Date(now.getFullYear(), dateMatch3[1] - 1, dateMatch3[2]);
            }

            return null;
        }

        function parseTime(input) {
            const timeMatch = input.match(/(\d{1,2}):(\d{2})/);
            if (timeMatch) {
                return { hours: parseInt(timeMatch[1]), minutes: parseInt(timeMatch[2]) };
            }

            const hourMatch = input.match(/(\d{1,2})\s*(点|时)/);
            if (hourMatch) {
                let hours = parseInt(hourMatch[1]);
                if (input.includes('下午') && hours < 12) hours += 12;
                if (input.includes('晚上') && hours < 12) hours += 12;
                if (input.includes('深夜') && hours < 12) hours += 12;
                if (input.includes('凌晨') && hours >= 12) hours -= 12;
                return { hours, minutes: 0 };
            }

            return null;
        }

        function classifyCategory(text) {
            for (const [category, keywords] of Object.entries(categoryKeywords)) {
                if (keywords.some(keyword => text.includes(keyword))) {
                    return category;
                }
            }
            return 'other';
        }

        function determinePriority(date, text) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            const threeDaysLater = new Date(today);
            threeDaysLater.setDate(threeDaysLater.getDate() + 3);
            const sevenDaysLater = new Date(today);
            sevenDaysLater.setDate(sevenDaysLater.getDate() + 7);

            if (!date) return 'low';

            for (const keyword of urgentKeywords) {
                if (text.includes(keyword)) return 'high';
            }

            for (const keyword of warningKeywords) {
                if (text.includes(keyword)) return 'medium';
            }

            if (date <= today) return 'high';
            if (date <= tomorrow) return 'high';
            if (date <= threeDaysLater) return 'medium';
            if (date <= sevenDaysLater) return 'low';
            return 'future';
        }

        function parseLine(line) {
            line = line.trim();
            if (!line) return null;

            const date = parseDate(line);
            const time = parseTime(line);
            
            let title = line;
            if (date) {
                title = title.replace(/\d{4}[-/]\d{1,2}[-/]\d{1,2}/g, '');
                title = title.replace(/\d{1,2}[-/]\d{1,2}/g, '');
                title = title.replace(/\d{1,2}月\d{1,2}日?/g, '');
            }
            title = title.replace(/\d+\s*天(后|内)?/g, '');
            title = title.replace(/(\d{1,2}):(\d{2})/g, '');
            title = title.replace(/(\d{1,2})\s*(点|时)/g, '');
            title = title.replace(/上午|下午|晚上|深夜|凌晨/g, '');
            title = title.replace(/今天|今日|明天|后天|本周/g, '');
            title = title.trim();

            if (!title) title = line;

            const category = classifyCategory(title);
            const priority = determinePriority(date, title);

            return {
                id: Date.now() + Math.random(),
                title,
                date,
                time,
                category,
                priority,
                createdAt: new Date()
            };
        }

        function parseAndImport() {
            const text = document.getElementById('importText').value;
            if (!text.trim()) {
                showToast('请输入时间事项内容', 'error');
                return;
            }

            const lines = text.split(/[\n\r]+/);
            const newTasks = [];

            for (const line of lines) {
                const task = parseLine(line);
                if (task) {
                    newTasks.push(task);
                }
            }

            if (newTasks.length === 0) {
                showToast('未能解析到有效时间事项', 'error');
                return;
            }

            tasks = [...tasks, ...newTasks];
            saveToStorage();
            renderTasks();
            document.getElementById('importText').value = '';
            showToast(`成功导入 ${newTasks.length} 条事项`, 'success');
        }

        function loadSampleData() {
            const sampleText = `客户合同定稿 2024-01-15
社群活动预热 3天后
样品寄回截止 明天下午3点
优惠券下线 2024-01-20 18:00
直播开播 今晚8点
月度对账 1月31日
客户回访 后天上午10点
新品发布 2024-01-25
发票开具 2天后
供应商结算 2024-01-18
粉丝福利活动 5天后
售后处理 今天下午
直播复盘会议 明天
会员日活动 2024-02-01
产品拍摄 1月20日
客服培训 1月22日`;
            document.getElementById('importText').value = sampleText;
        }

        function clearAll() {
            if (tasks.length === 0) return;
            if (confirm('确定要清空所有事项吗？')) {
                tasks = [];
                saveToStorage();
                renderTasks();
                showToast('已清空全部事项', 'success');
            }
        }

        function saveToStorage() {
            localStorage.setItem('countdownTasks', JSON.stringify(tasks));
        }

        function loadFromStorage() {
            const stored = localStorage.getItem('countdownTasks');
            if (stored) {
                tasks = JSON.parse(stored);
                tasks.forEach(task => {
                    if (task.date) task.date = new Date(task.date);
                    if (task.createdAt) task.createdAt = new Date(task.createdAt);
                });
            }
        }

        function getCountdownInfo(date, time) {
            if (!date) return { text: '未指定时间', type: 'normal', remaining: Infinity };
            
            const now = new Date();
            let target = new Date(date);
            
            if (time) {
                target.setHours(time.hours, time.minutes, 0, 0);
            }
            
            const diff = target - now;
            
            if (diff <= 0) {
                return { text: '已截止', type: 'urgent', remaining: 0 };
            }
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            
            if (days === 0) {
                if (hours === 0) {
                    return { text: `${minutes}分钟后`, type: 'urgent', remaining: minutes };
                }
                return { text: `${hours}小时后`, type: 'urgent', remaining: hours };
            }
            if (days === 1) {
                return { text: '明天', type: 'warning', remaining: days };
            }
            if (days <= 3) {
                return { text: `${days}天后`, type: 'warning', remaining: days };
            }
            if (days <= 7) {
                return { text: `${days}天后`, type: 'normal', remaining: days };
            }
            return { text: `${days}天后`, type: 'future', remaining: days };
        }

        function formatDate(date, time) {
            if (!date) return '';
            const d = new Date(date);
            const month = d.getMonth() + 1;
            const day = d.getDate();
            const weekDay = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
            let result = `${month}月${day}日 ${weekDay}`;
            if (time) {
                const hours = String(time.hours).padStart(2, '0');
                const minutes = String(time.minutes).padStart(2, '0');
                result += ` ${hours}:${minutes}`;
            }
            return result;
        }

        function getCategoryLabel(category) {
            const labels = {
                customer: '客户',
                activity: '活动',
                finance: '对账',
                visit: '回访',
                other: '其他'
            };
            return labels[category] || '其他';
        }

        function getPriorityLabel(priority) {
            const labels = {
                high: '高优先级',
                medium: '次优先',
                low: '普通',
                future: '远期规划'
            };
            return labels[priority] || '普通';
        }

        function renderTasks() {
            const container = document.getElementById('timelineContainer');
            const statsBar = document.getElementById('statsBar');
            const filterTabs = document.getElementById('filterTabs');
            const categoryFilter = document.getElementById('categoryFilter');
            const exportSection = document.getElementById('exportSection');

            const filteredTasks = tasks.filter(task => {
                if (currentPriorityFilter !== 'all' && task.priority !== currentPriorityFilter) return false;
                if (currentCategoryFilter !== 'all' && task.category !== currentCategoryFilter) return false;
                return true;
            });

            const stats = {
                total: tasks.length,
                high: tasks.filter(t => t.priority === 'high').length,
                medium: tasks.filter(t => t.priority === 'medium').length,
                low: tasks.filter(t => t.priority === 'low').length,
                future: tasks.filter(t => t.priority === 'future').length
            };

            document.getElementById('statTotal').textContent = stats.total;
            document.getElementById('statHigh').textContent = stats.high;
            document.getElementById('statMedium').textContent = stats.medium;
            document.getElementById('statLow').textContent = stats.low;
            document.getElementById('statFuture').textContent = stats.future;

            if (tasks.length === 0) {
                statsBar.style.display = 'none';
                filterTabs.style.display = 'none';
                categoryFilter.style.display = 'none';
                exportSection.style.display = 'none';
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        <h3>暂无倒计时事项</h3>
                        <p>在上方输入框粘贴时间节点文本，点击"一键解析导入"开始使用</p>
                    </div>
                `;
                return;
            }

            statsBar.style.display = 'flex';
            filterTabs.style.display = 'flex';
            categoryFilter.style.display = 'flex';
            exportSection.style.display = 'block';

            const columns = [
                { priority: 'high', title: '高优先级', icon: 'alert-triangle' },
                { priority: 'medium', title: '次优先', icon: 'clock' },
                { priority: 'low', title: '普通', icon: 'circle' },
                { priority: 'future', title: '远期规划', icon: 'calendar' }
            ];

            const sortedTasks = [...filteredTasks].sort((a, b) => {
                const infoA = getCountdownInfo(a.date, a.time);
                const infoB = getCountdownInfo(b.date, b.time);
                return infoA.remaining - infoB.remaining;
            });

            container.innerHTML = columns.map(col => {
                const colTasks = sortedTasks.filter(t => t.priority === col.priority);
                return `
                    <div class="priority-column ${col.priority}">
                        <div class="column-header">
                            <div class="column-title">
                                ${getIcon(col.icon, col.priority)}
                                <span>${col.title}</span>
                            </div>
                            <span class="column-count">${colTasks.length}</span>
                        </div>
                        ${colTasks.map(task => {
                            const countdown = getCountdownInfo(task.date, task.time);
                            return `
                                <div class="task-card ${task.priority}">
                                    <div class="task-header">
                                        <span class="task-title">${task.title}</span>
                                        <span class="task-category category-${task.category}">${getCategoryLabel(task.category)}</span>
                                    </div>
                                    <div class="task-meta">
                                        ${task.date ? `<div class="task-date">${getIcon('calendar', 'grey')} ${formatDate(task.date, task.time)}</div>` : ''}
                                        <div class="countdown ${countdown.type}">${getIcon('timer', 'grey')} ${countdown.text}</div>
                                    </div>
                                    <div class="task-actions">
                                        <button class="action-btn" onclick="deleteTask(${task.id})">${getIcon('trash', 'grey')} 删除</button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                        ${colTasks.length === 0 ? '<div style="text-align: center; padding: 20px; color: var(--text-secondary); font-size: 0.9rem;">暂无事项</div>' : ''}
                    </div>
                `;
            }).join('');
        }

        function getIcon(name, color) {
            const icons = {
                'alert-triangle': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>',
                'clock': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
                'circle': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>',
                'calendar': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
                'timer': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
                'trash': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'
            };
            
            const colorMap = {
                'high': 'var(--danger-color)',
                'medium': 'var(--warning-color)',
                'low': 'var(--info-color)',
                'future': 'var(--success-color)',
                'grey': 'var(--text-secondary)'
            };

            return `<span style="color: ${colorMap[color] || colorMap.grey}">${icons[name] || icons.circle}</span>`;
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveToStorage();
            renderTasks();
            showToast('已删除该事项', 'success');
        }

        function setPriorityFilter(filter) {
            currentPriorityFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.textContent.includes(getPriorityLabel(filter)) || (filter === 'all' && tab.textContent.includes('全部')));
            });
            renderTasks();
        }

        function setCategoryFilter(filter) {
            currentCategoryFilter = filter;
            document.querySelectorAll('.category-chip').forEach(chip => {
                chip.classList.toggle('active', chip.textContent.includes(getCategoryLabel(filter)) || (filter === 'all' && chip.textContent.includes('全部')));
            });
            renderTasks();
        }

        function exportFeishu() {
            const sortedTasks = [...tasks].sort((a, b) => {
                const infoA = getCountdownInfo(a.date, a.time);
                const infoB = getCountdownInfo(b.date, b.time);
                return infoA.remaining - infoB.remaining;
            });

            let content = `【工作待办清单】\n\n`;
            
            const priorities = ['high', 'medium', 'low', 'future'];
            const labels = { high: '高优先级', medium: '次优先', low: '普通', future: '远期规划' };
            
            priorities.forEach(p => {
                const pTasks = sortedTasks.filter(t => t.priority === p);
                if (pTasks.length > 0) {
                    content += `### ${labels[p]}\n`;
                    pTasks.forEach((task, i) => {
                        const countdown = getCountdownInfo(task.date, task.time);
                        content += `${i + 1}. ${task.title} | ${getCategoryLabel(task.category)} | ${countdown.text}\n`;
                    });
                    content += '\n';
                }
            });

            content += `---\n共 ${tasks.length} 条待办事项`;
            showExportModal(content, '飞书待办格式');
        }

        function exportExcel() {
            let content = `优先级\t分类\t事项\t截止时间\t剩余时间\n`;
            
            const sortedTasks = [...tasks].sort((a, b) => {
                const infoA = getCountdownInfo(a.date, a.time);
                const infoB = getCountdownInfo(b.date, b.time);
                return infoA.remaining - infoB.remaining;
            });

            sortedTasks.forEach(task => {
                const countdown = getCountdownInfo(task.date, task.time);
                content += `${getPriorityLabel(task.priority)}\t${getCategoryLabel(task.category)}\t${task.title}\t${formatDate(task.date, task.time)}\t${countdown.text}\n`;
            });

            showExportModal(content, 'Excel 清单');
        }

        function exportWeChat() {
            const sortedTasks = [...tasks].sort((a, b) => {
                const infoA = getCountdownInfo(a.date, a.time);
                const infoB = getCountdownInfo(b.date, b.time);
                return infoA.remaining - infoB.remaining;
            });

            let content = `📅 今日工作倒计时提醒\n\n`;
            
            const urgentTasks = sortedTasks.filter(t => t.priority === 'high');
            const mediumTasks = sortedTasks.filter(t => t.priority === 'medium');
            
            if (urgentTasks.length > 0) {
                content += `⚠️ 【紧急·今日截止】\n`;
                urgentTasks.forEach(task => {
                    content += `• ${task.title} (${formatDate(task.date, task.time)})\n`;
                });
                content += '\n';
            }
            
            if (mediumTasks.length > 0) {
                content += `⏰ 【近期·3天内】\n`;
                mediumTasks.forEach(task => {
                    const countdown = getCountdownInfo(task.date, task.time);
                    content += `• ${task.title} (${countdown.text})\n`;
                });
                content += '\n';
            }
            
            content += `📌 共 ${tasks.length} 条事项，加油！💪`;
            showExportModal(content, '微信群发文案');
        }

        function showExportModal(content, title) {
            exportContent = content;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('exportPreview').textContent = content;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function copyExportContent() {
            navigator.clipboard.writeText(exportContent).then(() => {
                showToast('已复制到剪贴板', 'success');
                closeModal();
            }).catch(() => {
                showToast('复制失败，请手动复制', 'error');
            });
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadFromStorage();
            renderTasks();
            
            document.getElementById('modalOverlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('modalOverlay')) {
                    closeModal();
                }
            });
        });
    </script>
</body>
