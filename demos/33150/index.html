<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Studio</title>
    <style>
        /* ========== 第一份style.css 全部样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            overflow: hidden;
        }
        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .title-bar {
            height: 32px;
            background-color: #252526;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            user-select: none;
            -webkit-app-region: drag;
        }
        .title-bar-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-icon {
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            color: white;
        }
        .app-title {
            font-size: 12px;
            font-weight: 500;
            color: #cccccc;
        }
        .title-bar-center {
            flex: 1;
            display: flex;
            justify-content: center;
        }
        .model-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #858585;
        }
        .model-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #f14c4c;
        }
        .model-status-dot.connected {
            background-color: #4ec9b0;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .title-bar-right {
            display: flex;
            -webkit-app-region: no-drag;
        }
        .window-btn {
            width: 46px;
            height: 32px;
            border: none;
            background: transparent;
            color: #6e6e6e;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        .window-btn:hover {
            background-color: #3c3c3c;
        }
        .window-btn.close-btn:hover {
            background-color: #e81123;
            color: white;
        }
        .main-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 240px;
            background-color: #252526;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #3c3c3c;
        }
        .sidebar-header {
            display: flex;
            flex-direction: column;
            padding: 10px 0;
            border-bottom: 1px solid #3c3c3c;
        }
        .sidebar-btn {
            width: 100%;
            height: 48px;
            border: none;
            background: transparent;
            color: #858585;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s;
        }
        .sidebar-btn:hover {
            background-color: #2a2d2e;
            color: #cccccc;
        }
        .sidebar-btn.active {
            background-color: #37373d;
            color: #ffffff;
        }
        .sidebar-btn.active::before {
            content: '';
            position: absolute;
            left: 0;
            width: 2px;
            height: 24px;
            background-color: #007acc;
        }
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
        }
        .chat-list {
            padding: 4px 0;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .chat-item:hover {
            background-color: #2a2d2e;
        }
        .chat-item.active {
            background-color: #37373d;
        }
        .chat-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #3c3c3c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-name {
            font-size: 13px;
            font-weight: 500;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-preview {
            font-size: 11px;
            color: #858585;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .panel-title {
            font-size: 11px;
            font-weight: 600;
            color: #858585;
            text-transform: uppercase;
            padding: 12px 16px 8px;
            letter-spacing: 0.5px;
        }
        .hidden {
            display: none;
        }
        .tool-list {
            padding: 4px 0;
        }
        .tool-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .tool-item:hover {
            background-color: #2a2d2e;
        }
        .tool-icon {
            font-size: 18px;
        }
        .tool-name {
            font-size: 13px;
            color: #cccccc;
        }
        .config-panel {
            padding: 8px 16px;
        }
        .config-section {
            margin-bottom: 16px;
        }
        .config-label {
            display: block;
            font-size: 12px;
            color: #858585;
            margin-bottom: 6px;
        }
        .config-input {
            width: 100%;
            padding: 8px 10px;
            background-color: #3c3c3c;
            border: 1px solid #5c5c5c;
            border-radius: 4px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        .config-input:focus {
            border-color: #007acc;
        }
        .input-group {
            display: flex;
            gap: 8px;
        }
        .input-group .config-input {
            flex: 1;
            border-radius: 4px 0 0 4px;
        }
        .browse-btn {
            padding: 8px 12px;
            background-color: #007acc;
            border: none;
            border-radius: 0 4px 4px 0;
            color: white;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        .browse-btn:hover {
            background-color: #1a86d9;
        }
        .radio-group {
            display: flex;
            gap: 16px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #cccccc;
        }
        .radio-option input[type="radio"] {
            accent-color: #007acc;
        }
        .config-btn {
            width: 100%;
            padding: 10px;
            background-color: #007acc;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .config-btn:hover {
            background-color: #1a86d9;
        }
        .config-btn.secondary {
            background-color: #3c3c3c;
        }
        .config-btn.secondary:hover {
            background-color: #4c4c4c;
        }
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
        }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: #252526;
            border-bottom: 1px solid #3c3c3c;
        }
        .chat-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-title .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .title-info h2 {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }
        .title-info .subtitle {
            font-size: 11px;
            color: #858585;
        }
        .chat-actions {
            display: flex;
            gap: 8px;
        }
        .action-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: #858585;
            cursor: pointer;
            border-radius: 4px;
        }
        .action-btn:hover {
            background-color: #3c3c3c;
            color: #ffffff;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .welcome-message {
            text-align: center;
            padding: 60px 20px;
        }
        .welcome-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        .welcome-message h3 {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .welcome-message p {
            font-size: 14px;
            color: #858585;
            margin-bottom: 24px;
        }
        .quick-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .quick-btn {
            padding: 10px 20px;
            background-color: #3c3c3c;
            border: 1px solid #5c5c5c;
            border-radius: 6px;
            color: #cccccc;
            font-size: 13px;
            cursor: pointer;
        }
        .quick-btn:hover {
            background-color: #4c4c4c;
            border-color: #007acc;
            color: #ffffff;
        }
        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            flex-direction: row-reverse;
        }
        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .message.user .message-avatar {
            background: linear-gradient(135deg, #007acc 0%, #005a9e 100%);
        }
        .message.bot .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
        }
        .message.user .message-content {
            background-color: #007acc;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.bot .message-content {
            background-color: #3c3c3c;
            color: #d4d4d4;
            border-bottom-left-radius: 2px;
        }
        .message-content code {
            background-color: #2d2d2d;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
        }
        .message-content pre {
            background-color: #2d2d2d;
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .message-content pre code {
            background: none;
            padding: 0;
        }
        .error-box {
            background-color: #1e1e1e;
            border: 1px solid #f14c4c;
            border-radius: 6px;
            overflow: hidden;
            font-family: 'Consolas', 'Monaco', monospace;
        }
        .error-header {
            background-color: #4a2a2a;
            color: #f14c4c;
            padding: 6px 12px;
            font-size: 12px;
            border-bottom: 1px solid #f14c4c;
        }
        .error-detail {
            background-color: #1e1e1e;
            color: #f48771;
            padding: 12px;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .tool-call {
            background-color: #2d2d2d;
            border-left: 3px solid #007acc;
            padding: 10px 12px;
            margin: 8px 0;
            border-radius: 0 4px 4px 0;
            font-size: 13px;
        }
        .tool-call .tool-name {
            color: #4ec9b0;
            font-weight: 600;
        }
        .tool-result {
            background-color: #252526;
            border-left: 3px solid #6a9955;
            padding: 10px 12px;
            margin: 8px 0;
            border-radius: 0 4px 4px 0;
            font-size: 13px;
            color: #858585;
        }
        .thinking {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background-color: #3c3c3c;
            border-radius: 8px;
            border-bottom-left-radius: 2px;
            width: fit-content;
        }
        .thinking-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #007acc;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .thinking-dot:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .input-area {
            background-color: #252526;
            border-top: 1px solid #3c3c3c;
            padding: 12px 20px;
        }
        .input-toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 8px;
        }
        .toolbar-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: #858585;
            cursor: pointer;
            border-radius: 4px;
        }
        .toolbar-btn:hover {
            background-color: #3c3c3c;
            color: #ffffff;
        }
        .divider {
            width: 1px;
            height: 20px;
            background-color: #3c3c3c;
            margin: 0 4px;
        }
        .input-wrapper {
            display: flex;
            gap: 10px;
            background-color: #3c3c3c;
            border-radius: 8px;
            padding: 4px;
            border: 1px solid #5c5c5c;
        }
        .input-wrapper:focus-within {
            border-color: #007acc;
        }
        .message-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            padding: 10px 12px;
            resize: none;
        }
        .message-input::placeholder {
            color: #6e6e6e;
        }
        .send-btn {
            width: 36px;
            height: 36px;
            border: none;
            background-color: #007acc;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
        .send-btn:hover {
            background-color: #1a86d9;
        }
        .send-btn:disabled {
            background-color: #3c3c3c;
            cursor: not-allowed;
        }
        .input-status {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 6px;
            font-size: 11px;
            color: #858585;
        }
        .input-status .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #f14c4c;
        }
        .input-status .status-dot.connected {
            background-color: #4ec9b0;
            animation: pulse 2s infinite;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #4c4c4c;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5c;
        }

        /* ========== 第二份styles.css 全部样式（变量新版UI） ========== */
        :root {
            --gpt-bg: #1a1a1a;
            --gpt-bg-light: #242424;
            --gpt-bg-lighter: #2d2d2d;
            --gpt-border: #3a3a3a;
            --gpt-text: #e5e5e5;
            --gpt-text-muted: #a1a1aa;
            --gpt-accent: #0ea5e9;
            --gpt-accent-hover: #0284c7;
            --gpt-green: #22c55e;
            --gpt-red: #ef4444;
            --gpt-yellow: #eab308;
            --gpt-purple: #a855f7;
            --gpt-user-bg: #3b82f6;
            --gpt-bot-bg: #2d2d2d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--gpt-bg);
            color: var(--gpt-text);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .title-bar {
            height: 38px;
            background: var(--gpt-bg-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            -webkit-app-region: drag;
            border-bottom: 1px solid var(--gpt-border);
        }
        .title-bar-left, .title-bar-center, .title-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
            -webkit-app-region: no-drag;
        }
        .sidebar-toggle {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            color: var(--gpt-text-muted);
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
        }
        .sidebar-toggle:hover {
            background: var(--gpt-bg-lighter);
            color: var(--gpt-text);
        }
        .app-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--gpt-text);
        }
        .model-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--gpt-text-muted);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gpt-red);
        }
        .status-dot.connected {
            background: var(--gpt-green);
            box-shadow: 0 0 6px var(--gpt-green);
        }
        .title-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: var(--gpt-text-muted);
            cursor: pointer;
            border-radius: 4px;
        }
        .title-btn:hover {
            background: var(--gpt-bg-lighter);
        }
        .title-btn.close-btn:hover {
            background: var(--gpt-red);
            color: white;
        }
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .left-sidebar {
            width: 260px;
            background: var(--gpt-bg-light);
            border-right: 1px solid var(--gpt-border);
            display: flex;
            flex-direction: column;
        }
        .left-sidebar.collapsed {
            width: 0;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 12px;
            border-bottom: 1px solid var(--gpt-border);
        }
        .new-chat-btn {
            width: 100%;
            padding: 10px 14px;
            background: var(--gpt-accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .new-chat-btn:hover {
            background: var(--gpt-accent-hover);
        }
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .chat-item:hover {
            background: var(--gpt-bg-lighter);
        }
        .chat-item.active {
            background: var(--gpt-bg);
            border-color: var(--gpt-border);
        }
        .chat-icon {
            font-size: 18px;
        }
        .chat-name {
            flex: 1;
            font-size: 13px;
            color: var(--gpt-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-delete {
            width: 20px;
            height: 20px;
            border: none;
            background: transparent;
            color: var(--gpt-text-muted);
            cursor: pointer;
            opacity: 0;
        }
        .chat-item:hover .chat-delete {
            opacity: 1;
        }
        .chat-delete:hover {
            background: var(--gpt-red);
            color: white;
        }
        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--gpt-border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sidebar-btn {
            width: 100%;
            padding: 10px 14px;
            background: transparent;
            color: var(--gpt-text-muted);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-btn:hover {
            background: var(--gpt-bg-lighter);
            color: var(--gpt-text);
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60%;
            text-align: center;
        }
        .welcome-icon {
            font-size: 80px;
            margin-bottom: 24px;
        }
        .welcome-screen h1 {
            font-size: 28px;
            font-weight: 300;
            margin-bottom: 12px;
            color: var(--gpt-text);
        }
        .welcome-screen p {
            font-size: 16px;
            color: var(--gpt-text-muted);
            margin-bottom: 32px;
            max-width: 500px;
        }
        .quick-prompt {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        .prompt-btn {
            padding: 12px 20px;

    <div class="app-container">

            </div>

                            <button class="prompt-btn" onclick="sendQuickMessage('检查 Unity 连接状态')">🎮 检查 Unity</button>

    <script>
        // 基础快捷发送函数，无第三方依赖
        function sendQuickMessage(text) {
            const input = document.getElementById('chatInput');
            input.value = text;
