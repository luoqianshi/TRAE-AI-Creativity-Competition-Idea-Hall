<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI滑动验证模拟器</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; display: flex; justify-content: center; padding-top: 50px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .slider-box { position: relative; width: 360px; height: 40px; background: #e8e8e8; border-radius: 40px; margin: 20px 0; overflow: hidden; }
        .slider-track { width: 100%; height: 100%; background: linear-gradient(to right, #7ac5f0, #4a9eff); }
        .slider-btn { position: absolute; left: 0; top: 0; width: 40px; height: 40px; background: white; border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.2); cursor: grab; text-align: center; line-height: 40px; font-size: 18px; user-select: none; }
        .slider-btn:active { cursor: grabbing; }
        .gap { position: absolute; left: 260px; top: 5px; width: 10px; height: 30px; background: #ddd; border-radius: 4px; }
        .info { margin-top: 20px; font-size: 14px; color: #555; }
        .status { padding: 8px 16px; background: #4caf50; color: white; border-radius: 20px; display: inline-block; }
    </style>
</head>
<body>
<div class="container">
    <h3>🧩 AI 滑动验证演示</h3>
    <p>拖动滑块完成拼图（模拟 AI 识别缺口位置）</p>
    <div class="slider-box" id="sliderBox">
        <div class="slider-track" id="track"></div>
        <div class="gap" id="gap" style="left: 260px;"></div>
        <div class="slider-btn" id="sliderBtn">▶</div>
    </div>
    <div class="info">
        <span>缺口位置：右侧灰色条</span><br>
        <span id="progressText">进度：0%</span>
    </div>
    <button onclick="autoSlide()" style="margin-top:10px; padding:8px 20px; background:#007bff; color:white; border:none; border-radius:6px; cursor:pointer;">🤖 AI自动滑动</button>
    <div id="result" style="margin-top:10px; font-weight:bold;"></div>
</div>
<script>
    const btn = document.getElementById('sliderBtn');
    const box = document.getElementById('sliderBox');
    const track = document.getElementById('track');
    const gap = document.getElementById('gap');
    const progress = document.getElementById('progressText');
    const result = document.getElementById('result');
    let isDragging = false;

    // 模拟AI识别缺口位置（固定260px）
    const targetX = 260;

    btn.addEventListener('mousedown', (e) => {
        isDragging = true;
        btn.style.cursor = 'grabbing';
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        e.preventDefault();
    });

    function onMove(e) {
        if (!isDragging) return;
        const rect = box.getBoundingClientRect();
        let x = e.clientX - rect.left - 20;
        x = Math.max(0, Math.min(x, box.offsetWidth - 40));
        btn.style.left = x + 'px';
        track.style.width = (x + 20) + 'px';
        progress.innerText = '进度：' + Math.round((x / (box.offsetWidth - 40)) * 100) + '%';

        // 检测是否到达缺口位置（允许±5px误差）
        if (Math.abs(x - targetX) <= 5) {
            result.innerText = '✅ 验证通过！ (模拟成功)';
            result.style.color = 'green';
        } else {
            result.innerText = '⏳ 继续滑动...';
            result.style.color = '#888';
        }
    }

    function onUp() {
        isDragging = false;
        btn.style.cursor = 'grab';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        // 最终判断
        const left = parseFloat(btn.style.left) || 0;
        if (Math.abs(left - targetX) <= 5) {
            result.innerText = '✅ 验证通过！';
            result.style.color = 'green';
        } else {
            result.innerText = '❌ 未对准缺口，请重试';
            result.style.color = 'red';
        }
    }

    // AI自动滑动函数
    function autoSlide() {
        result.innerText = '🤖 AI正在识别并滑动...';
        result.style.color = '#007bff';
        const start = 0;
        const end = targetX;
        const duration = 800;
        const startTime = performance.now();

        function step(time) {
            const t = Math.min((time - startTime) / duration, 1);
            // 使用缓动函数模拟人类滑动（先快后慢）
            const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
            const currentX = start + (end - start) * eased;
            btn.style.left = currentX + 'px';
            track.style.width = (currentX + 20) + 'px';
            progress.innerText = '进度：' + Math.round((currentX / (box.offsetWidth - 40)) * 100) + '%';
            if (t < 1) {
                requestAnimationFrame(step);
            } else {
                // 最终定位
                btn.style.left = end + 'px';
                track.style.width = (end + 20) + 'px';
                progress.innerText = '进度：100%';
                if (Math.abs(end - targetX) <= 5) {
                    result.innerText = '✅ AI验证通过！';
                    result.style.color = 'green';
                } else {
                    result.innerText = '⚠️ AI未对准，可重试';
                    result.style.color = 'orange';
                }
            }
        }
        requestAnimationFrame(step);
    }
</script>
</body>
</html>
