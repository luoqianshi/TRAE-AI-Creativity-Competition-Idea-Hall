<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错题本 - 智能错题管理系统</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>

</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>错题本</h1>
            <div class="header-actions">
                <div id="scoreDisplay" class="score-display">🏆 积分: 0</div>
                <button id="practiceBtn" class="secondary-btn">📝 练习</button>
                <button id="searchBtn" class="icon-btn">🔍</button>
                <button id="addBookBtn" class="primary-btn">+ 新建错题本</button>
            </div>
        </header>

        <div class="search-container" id="searchContainer" style="display: none;">
            <input type="text" id="searchInput" placeholder="搜索题目、批注或错误原因...">
            <button id="closeSearchBtn" class="icon-btn">✕</button>
        </div>

        <main class="main-content">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>错题本列表</h2>
                </div>
                <div id="bookList" class="book-list">
                </div>
            </aside>

            <section class="content-area">
                <div id="welcomeScreen" class="welcome-screen">
                    <div class="welcome-content">
                        <h2>欢迎使用错题本</h2>
                        <p>点击左侧错题本查看详情，或创建新的错题本开始使用</p>
                        <div class="quick-actions">
                            <button id="quickAddBookBtn" class="primary-btn">创建错题本</button>
                        </div>
                    </div>
                </div>

                <div id="bookDetail" class="book-detail" style="display: none;">
                    <div class="book-header">
                        <h2 id="bookTitle">错题本标题</h2>
                        <div class="book-actions">
                            <button id="addQuestionBtn" class="primary-btn">+ 添加题目</button>
                            <button id="exportBtn" class="secondary-btn">📤 导出</button>
                            <button id="editBookBtn" class="secondary-btn">编辑</button>
                            <button id="deleteBookBtn" class="danger-btn">删除</button>
                        </div>
                    </div>
                    <div id="questionList" class="question-list">
                    </div>
                </div>

                <div id="practiceScreen" class="practice-screen" style="display: none;">
                    <div class="practice-header">
                        <h2>📝 错题练习</h2>
                        <button id="backFromPracticeBtn" class="secondary-btn">← 返回</button>
                    </div>
                    <div class="practice-content">
                        <div class="practice-progress">
                            <span>第 <span id="currentQuestionNum">1</span> / <span id="totalQuestionNum">0</span> 题</span>
                        </div>
                        <div class="question-card" id="practiceQuestionCard">
                            <div class="practice-images" id="practiceImages"></div>
                            <div class="question-content">
                                <h3>题目</h3>
                                <p id="practiceQuestionText"></p>
                            </div>
                            <div class="answer-section">
                                <h3>你的答案</h3>
                                <input type="text" id="practiceAnswerInput" placeholder="请输入答案">
                                <button id="submitAnswerBtn" class="primary-btn">提交答案</button>
                            </div>
                            <div class="result-section" id="resultSection" style="display: none;">
                                <div id="resultIcon"></div>
                                <div id="resultMessage"></div>
                                <div id="correctAnswer" style="display: none;">
                                    <h4>正确答案：</h4>
                                    <p id="correctAnswerText"></p>
                                </div>
                                <button id="nextQuestionBtn" class="secondary-btn">下一题</button>
                            </div>
                        </div>
                        <div class="practice-summary" id="practiceSummary" style="display: none;">
                            <h3>🎉 练习完成！</h3>
                            <div class="summary-stats">
                                <div class="stat-item">
                                    <span class="stat-label">总题数</span>
                                    <span class="stat-value" id="summaryTotal"></span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">正确数</span>
                                    <span class="stat-value correct" id="summaryCorrect"></span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">错误数</span>
                                    <span class="stat-value wrong" id="summaryWrong"></span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">获得积分</span>
                                    <span class="stat-value score" id="summaryScore"></span>
                                </div>
                            </div>
                            <button id="restartPracticeBtn" class="primary-btn">再来一次</button>
                            <button id="backFromSummaryBtn" class="secondary-btn">返回首页</button>
                        </div>
                    </div>
                </div>

                <div id="questionDetail" class="question-detail" style="display: none;">
                    <div class="question-header">
                        <button id="backToBookBtn" class="icon-btn">←</button>
                        <h2>题目详情</h2>
                        <div class="question-actions">
                            <button id="editQuestionBtn" class="secondary-btn">编辑</button>
                            <button id="deleteQuestionBtn" class="danger-btn">删除</button>
                        </div>
                    </div>
                    <div class="question-content">
                        <div class="drawing-tools">
                            <button id="drawPenBtn" class="draw-tool-btn active">✏️ 画笔</button>
                            <button id="drawLineBtn" class="draw-tool-btn">📏 直线</button>
                            <button id="drawRectBtn" class="draw-tool-btn">⬜ 矩形</button>
                            <button id="drawCircleBtn" class="draw-tool-btn">⭕ 圆形</button>
                            <button id="drawEraserBtn" class="draw-tool-btn">🧹 橡皮擦</button>
                            <button id="drawClearBtn" class="draw-tool-btn">🗑️ 清空</button>
                            <button id="drawSaveBtn" class="draw-tool-btn">💾 保存批注</button>
                            <input type="color" id="drawColor" value="#FF0000" class="draw-color-picker">
                        </div>
                        <div class="question-images" id="questionImages"></div>
                        <div class="question-text">
                            <h3>题目内容</h3>
                            <p id="questionText"></p>
                        </div>
                        <div class="error-reason">
                            <h3>错误原因</h3>
                            <div id="errorReasonTags"></div>
                        </div>
                        <div class="answer-section">
                            <h3>答案</h3>
                            <div id="answerContent"></div>
                        </div>
                        <div class="annotations">
                            <h3>批注</h3>
                            <div id="annotationsContent"></div>
                        </div>
                        <div class="question-meta">
                            <span id="questionDate"></span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="storage.js?v=35"></script>
    <script src="ocr.js?v=35"></script>
    <script src="export.js?v=35"></script>
    <script src="app.js?v=35"></script>
</body>
</html>
