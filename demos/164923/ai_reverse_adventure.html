<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 反转剧情冒险</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-card: rgba(20, 30, 50, 0.6);
            --bg-glass: rgba(30, 40, 60, 0.4);
            --text-primary: #e8eef7;
            --text-secondary: #8b9bb4;
            --accent-blue: #00d4ff;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --gradient-neon: linear-gradient(135deg, #00d4ff, #8b5cf6, #ec4899);
            --glow-blue: 0 0 20px rgba(0, 212, 255, 0.3);
            --glow-purple: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 212, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, white, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, white, transparent),
                radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 230px 80px, white, transparent),
                radial-gradient(2px 2px at 300px 150px, rgba(255,255,255,0.7), transparent);
            background-repeat: repeat;
            background-size: 350px 200px;
            animation: twinkle 8s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 20px 0;
        }

        .title {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 700;
            background: var(--gradient-neon);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: var(--glow-blue);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .glass-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .scene-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .scene-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent-blue);
            text-shadow: var(--glow-blue);
        }

        .reversal-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(236, 72, 153, 0.2);
            border: 1px solid rgba(236, 72, 153, 0.4);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--accent-pink);
            animation: pulse-reversal 2s ease-in-out infinite;
        }

        @keyframes pulse-reversal {
            0%, 100% { box-shadow: 0 0 5px rgba(236, 72, 153, 0.3); }
            50% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.5); }
        }

        .scene-description {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-primary);
            white-space: pre-line;
            margin-bottom: 20px;
            min-height: 120px;
            position: relative;
        }

        .typing-cursor::after {
            content: '|';
            animation: blink 1s infinite;
            color: var(--accent-blue);
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-btn {
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            min-height: 52px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .choice-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .choice-btn:hover::before {
            left: 100%;
        }

        .choice-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.4);
            transform: translateX(5px);
            box-shadow: var(--glow-blue);
        }

        .choice-btn:active {
            transform: translateX(3px);
        }

        .choice-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .choice-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-purple);
            flex-shrink: 0;
        }

        .generating-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 23, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }

        .generating-overlay.active {
            display: flex;
        }

        .generating-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 212, 255, 0.2);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .generating-text {
            font-size: 1.1rem;
            color: var(--accent-blue);
            text-shadow: var(--glow-blue);
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .step-counter {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .step-number {
            color: var(--accent-green);
            font-size: 1.2rem;
            font-weight: 700;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            color: var(--text-primary);
        }

        .action-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .inventory-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .inventory-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 16px;
            font-size: 0.8rem;
            color: var(--accent-purple);
        }

        .inventory-empty {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .glass-card {
                padding: 20px 16px;
            }

            .choice-btn {
                padding: 14px 16px;
                font-size: 0.95rem;
            }

            .controls-bar {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .action-buttons {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="title">AI 反转冒险</h1>
            <p class="subtitle">每一次选择，都可能颠覆真相</p>
        </div>

        <div class="game-area">
            <div class="glass-card">
                <div class="scene-header">
                    <h2 class="scene-name" id="sceneName">废弃火车站</h2>
                    <span class="reversal-tag" id="reversalTag" style="display: none;">⚡ 反转</span>
                </div>
                
                <div class="scene-description" id="sceneDescription">
                    你在废弃火车站的长椅上醒来，记忆一片模糊。四周弥漫着白雾，铁轨延伸向无尽的黑暗。<br><br>
                    手中紧握着一张泛黄的车票，目的地一栏写着"不归"。不远处的信号灯闪烁着诡异的红光，站台尽头似乎有一道人影在徘徊。<br><br>
                    你的口袋里还有一张皱巴巴的纸条，上面写着："不要相信你看到的一切。"
                </div>

                <div class="choices-container" id="choicesContainer">
                    <button class="choice-btn" onclick="makeChoice(0)">
                        <span class="choice-number">1</span>查看手中的车票，尝试理解目的地
                    </button>
                    <button class="choice-btn" onclick="makeChoice(1)">
                        <span class="choice-number">2</span>走向站台尽头的人影
                    </button>
                    <button class="choice-btn" onclick="makeChoice(2)">
                        <span class="choice-number">3</span>检查那张警告纸条，寻找更多线索
                    </button>
                </div>

                <div class="inventory-bar">
                    <div class="inventory-empty" id="inventoryDisplay">背包为空</div>
                </div>
            </div>

            <div class="controls-bar">
                <div class="step-counter">
                    步数: <span class="step-number" id="stepCount">1</span>
                </div>
                <div class="action-buttons">
                    <button class="action-btn" onclick="undoStep()" id="undoBtn" disabled>
                        ↩ 撤销
                    </button>
                    <button class="action-btn" onclick="restartGame()">
                        🔄 重启
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="generating-overlay" id="generatingOverlay">
        <div class="generating-spinner"></div>
        <div class="generating-text">正在推演剧情...</div>
    </div>

    <script>
        /**
         * 反转剧情库 - 内置20个预设反转情节
         * 支持占位符：{player_name}, {last_choice}, {inventory_item}, {location}
         */
        const reversalLibrary = [
            {
                name: '身份迷局',
                description: '当你{last_choice}时，突然发现口袋里多了一张身份证。照片是你，但名字和出生日期完全陌生。更诡异的是，背面写着："此身份将于{step}步后失效。" 你开始怀疑——你到底是谁？',
                options: ['仔细研究身份证上的信息', '撕掉身份证，拒绝接受', '寻找能证实身份的线索'],
                keywords: ['竟然', '到底', '身份'],
                addToInventory: ['神秘身份证']
            },
            {
                name: '时间循环',
                description: '{last_choice}之后，你感到一阵眩晕。当你睁开眼，发现自己又回到了{location}。所有的一切都和之前一模一样——包括你手中还未做出选择的{inventory_item}。你意识到，你被困在了时间循环中。',
                options: ['重复之前的选择，看看是否有不同', '尝试完全相反的行动', '寻找打破循环的方法'],
                keywords: ['竟然', '循环', '回到'],
                addToInventory: ['时间碎片']
            },
            {
                name: '梦境边缘',
                description: '你{last_choice}的瞬间，周围的一切开始变得模糊。远处传来闹钟的声音，越来越响。你猛地惊醒——发现自己躺在一张陌生的床上，而{location}只是一场过于真实的梦境。但当你低头时，手中仍然握着那张{inventory_item}。',
                options: ['认为这只是巧合，继续生活', '寻找回到"梦境"的方法', '研究手中的物品，寻找真相'],
                keywords: ['原来', '梦境', '惊醒'],
                addToInventory: ['梦境碎片']
            },
            {
                name: '真相揭露',
                description: '就在你{last_choice}的那一刻，一个声音在你脑海中响起："恭喜你，通过了第{step}层考验。" 你突然意识到，{location}中的一切都是精心设计的模拟——包括那些看似随机的遭遇。而你，正在被观察。',
                options: ['质问观察者的目的', '继续配合，寻找漏洞', '尝试破坏模拟系统'],
                keywords: ['真相', '竟然', '考验'],
                addToInventory: ['真相碎片']
            },
            {
                name: '记忆篡改',
                description: '{last_choice}的瞬间，你感到脑海中涌入大量陌生的记忆。你突然"想起"了很多事情——但这些记忆如此陌生，仿佛不属于你。你开始怀疑：你的记忆，到底有多少是真实的？',
                options: ['接受新记忆，认为是恢复', '抗拒记忆，保持怀疑', '寻找证据验证记忆真伪'],
                keywords: ['原来', '记忆', '陌生'],
                addToInventory: ['记忆碎片']
            },
            {
                name: '平行世界',
                description: '当你{last_choice}时，地面突然裂开一道缝隙。从缝隙中，你看到了另一个世界——另一个你做出了完全不同的选择，正用惊恐的眼神看着你。两个世界开始重叠，你必须做出选择。',
                options: ['尝试与另一个自己交流', '选择留在当前世界', '进入另一个世界探索'],
                keywords: ['竟然', '平行', '另一个'],
                addToInventory: ['平行碎片']
            },
            {
                name: '规则崩坏',
                description: '{last_choice}之后，你发现世界的规则开始改变。重力变得不稳定，时间开始倒流，甚至文字都从页面上脱落。一个声音说："你打破了规则。现在，你必须成为新的规则。"',
                options: ['接受新规则，成为规则制定者', '尝试恢复原有规则', '在混乱中寻找新的秩序'],
                keywords: ['竟然', '规则', '崩坏'],
                addToInventory: ['规则碎片']
            },
            {
                name: '操纵者现身',
                description: '你{last_choice}的动作突然停止——因为你看到了操纵杆。原来，你的每一个选择都不是自由的。在某个地方，有人正在操控着你的一切。而{inventory_item}，就是他们给你的道具。',
                options: ['尝试挣脱控制', '与操纵者对话', '接受被操控的命运'],
                keywords: ['原来', '操纵', '控制'],
                addToInventory: ['控制碎片']
            },
            {
                name: '死亡幻觉',
                description: '{last_choice}时，你突然感到一阵剧痛。低头看去，发现自己的身体正在消散。"这是第{step}次死亡体验，"一个声音说，"每次死亡，你都会忘记一些事情。这次，你会忘记什么？"',
                options: ['奋力抵抗消散', '接受死亡，期待重生', '在消散前留下信息'],
                keywords: ['竟然', '死亡', '消散'],
                addToInventory: ['死亡碎片']
            },
            {
                name: '故事叙述者',
                description: '你突然意识到——有人在讲述这个故事。你抬头看去，发现了"第四面墙"——而墙的另一边，是一个正在打字的人。"{player_name}，你好，"他说，"谢谢你参与我的故事。"',
                options: ['与叙述者对话', '尝试改写故事', '无视叙述者，继续行动'],
                keywords: ['竟然', '叙述者', '故事'],
                addToInventory: ['故事碎片']
            },
            {
                name: '镜像反转',
                description: '当你{last_choice}时，面前出现了一面镜子。但镜子里的你做出了完全相反的动作。更可怕的是，你发现自己正在逐渐变成镜子里的那个你。',
                options: ['打破镜子', '模仿镜子里的自己', '寻找逃离镜像的方法'],
                keywords: ['竟然', '镜像', '反转'],
                addToInventory: ['镜像碎片']
            },
            {
                name: '契约代价',
                description: '{last_choice}之后，你突然发现手中多了一份契约。你已经签了字——但你完全不记得什么时候签的。契约上写着："用你的{inventory_item}换取一个愿望。" 你会兑现这份契约吗？',
                options: ['兑现契约，实现愿望', '撕毁契约，拒绝代价', '研究契约的条款'],
                keywords: ['原来', '契约', '代价'],
                addToInventory: ['契约碎片']
            },
            {
                name: '预知未来',
                description: '你{last_choice}的瞬间，眼前闪过无数画面——那是未来。你看到了自己做出不同选择后的结局，每一个都指向毁灭。唯一的生路，似乎是一条你从未考虑过的路。',
                options: ['选择预知中的生路', '无视预知，按原计划行动', '寻找改变未来的方法'],
                keywords: ['竟然', '预知', '未来'],
                addToInventory: ['未来碎片']
            },
            {
                name: '自我分裂',
                description: '{last_choice}之后，你感到自己分裂成了两个。一个继续按照原来的计划行动，另一个则走向了完全相反的方向。你同时存在于两个地方，感受着两种不同的现实。',
                options: ['尝试融合两个自我', '选择其中一个自我', '让两个自我合作'],
                keywords: ['竟然', '分裂', '两个'],
                addToInventory: ['分裂碎片']
            },
            {
                name: '虚假道具',
                description: '你突然发现，{inventory_item}并不是你以为的那样。它看起来是{inventory_item}，但实际上是一个追踪器/监听器/炸弹。有人一直在监视着你的一举一动，而你却毫无察觉。',
                options: ['摧毁道具', '利用道具反追踪', '假装不知道，继续演戏'],
                keywords: ['原来', '虚假', '监视'],
                addToInventory: ['监视碎片']
            },
            {
                name: 'NPC觉醒',
                description: '当你{last_choice}时，{location}中的其他人突然停了下来。他们转过头，直视着你。"我们知道你是谁，"他们说，"你不是这个世界的人。你是玩家。"',
                options: ['承认自己是玩家', '否认，坚持认为是真实的', '询问他们关于这个世界的真相'],
                keywords: ['竟然', '觉醒', '玩家'],
                addToInventory: ['觉醒碎片']
            },
            {
                name: '时间错位',
                description: '{last_choice}之后，你发现自己回到了过去——但不是你自己的过去。你看到了年轻时候的{player_name}，正在做出一个改变一生的决定。你可以影响这个决定，但代价是什么？',

        /**

        const gameState = {

        /**

        const reversalKeywords = ['竟然', '原来', '真相', '反转', '颠覆', '揭露', '发现', '意识到', '打破', '循环', '梦境', '幻觉', '身份', '记忆', '时间', '规则', '操纵', '控制', '程序', '漏洞'];

        /**

        function initGame() {
            renderScene();
            updateInventory();

            // 键盘快捷键
            document.addEventListener('keydown', handleKeyPress);

        /**
         * 渲染当前场景
         */
        function renderScene() {
            const sceneName = document.getElementById('sceneName');
            const sceneDescription = document.getElementById('sceneDescription');
            const choicesContainer = document.getElementById('choicesContainer');
            const reversalTag = document.getElementById('reversalTag');

            sceneName.textContent = gameState.currentScene.name;
            sceneDescription.textContent = gameState.currentScene.description;

            // 检测是否包含反转关键词（非结局场景）
            if (!gameState.gameEnded) {
                const hasReversal = reversalKeywords.some(kw => 
                    gameState.currentScene.description.includes(kw)
                );
                reversalTag.style.display = hasReversal ? 'inline-flex' : 'none';
            } else {
                reversalTag.style.display = 'none';
            }

            // 渲染选项
            choicesContainer.innerHTML = '';
            
            if (gameState.gameEnded) {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = '<span class="choice-number">🔄</span>重新开始游戏';
                btn.onclick = () => restartGame();
                choicesContainer.appendChild(btn);
            } else {
                gameState.currentScene.options.forEach((option, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerHTML = `<span class="choice-number">${index + 1}</span>${option}`;
                    btn.onclick = () => makeChoice(index);
                    choicesContainer.appendChild(btn);
                });
            }
        }

        /**
         * 更新背包显示
         */
        function updateInventory() {
            const inventoryDisplay = document.getElementById('inventoryDisplay');
            
            if (gameState.inventory.length === 0) {
                inventoryDisplay.textContent = '背包为空';
                inventoryDisplay.className = 'inventory-empty';
            } else {
                inventoryDisplay.innerHTML = gameState.inventory.map(item => 
                    `<div class="inventory-item">📦 ${item}</div>`
                ).join('');
                inventoryDisplay.className = 'inventory-bar';
            }
        }

        /**
         * 更新控制按钮状态
         */
        function updateControls() {
            document.getElementById('stepCount').textContent = gameState.step;
            document.getElementById('undoBtn').disabled = gameState.history.length === 0;
        }

        /**
         * 玩家做出选择
         */
        function makeChoice(choiceIndex) {
            if (gameState.isGenerating || gameState.gameEnded) return;

            const choice = gameState.currentScene.options[choiceIndex];
            gameState.lastChoice = choice;

            // 分析选择类型，更新统计
            analyzeChoice(choice);

            // 保存当前状态到历史记录
            const snapshot = JSON.parse(JSON.stringify({
                currentScene: gameState.currentScene,
                step: gameState.step,
                inventory: [...gameState.inventory],
                lastChoice: gameState.lastChoice,
                choiceStats: {...gameState.choiceStats}
            }));
            gameState.history.push(snapshot);

            // 显示"生成中"动画
            showGenerating(true);

            // 模拟思考过程（800-1200ms）
            const thinkingTime = 800 + Math.random() * 400;
            
            setTimeout(() => {
                // 检查是否达到最大步数，触发结局
                if (gameState.step >= gameState.maxSteps) {
                    triggerEnding();
                } else {
                    generateNewScene();
                }
                showGenerating(false);
                gameState.step++;
                updateControls();
            }, thinkingTime);
        }

        /**
         * 分析玩家选择类型
         */
        function analyzeChoice(choice) {
            const cautiousWords = ['仔细', '研究', '观察', '拒绝', '保守', '安全', '谨慎', '小心'];
            const aggressiveWords = ['攻击', '破坏', '摧毁', '强行', '直接', '冲', '闯', '战斗'];
            const curiousWords = ['探索', '寻找', '发现', '了解', '询问', '调查', '揭开', '质疑'];
            const acceptingWords = ['接受', '同意', '配合', '顺从', '相信', '跟随', '放弃'];

            if (cautiousWords.some(w => choice.includes(w))) {
                gameState.choiceStats.cautious++;
            } else if (aggressiveWords.some(w => choice.includes(w))) {
                gameState.choiceStats.aggressive++;
            } else if (curiousWords.some(w => choice.includes(w))) {
                gameState.choiceStats.curious++;
            } else if (acceptingWords.some(w => choice.includes(w))) {
                gameState.choiceStats.accepting++;
            }
        }

        /**
         * 显示/隐藏生成中动画
         */
        function showGenerating(show) {
            gameState.isGenerating = show;
            document.getElementById('generatingOverlay').classList.toggle('active', show);
            
            // 禁用/启用选项按钮
            const buttons = document.querySelectorAll('.choice-btn');
            buttons.forEach(btn => btn.classList.toggle('disabled', show));
        }

        /**
         * 触发结局
         */
        function triggerEnding() {
            const ending = determineEnding();
            gameState.gameEnded = true;
            
            gameState.currentScene = {
                name: ending.title,
                description: ending.description,
                options: []
            };

            renderScene();
            updateInventory();
        }

        /**
         * 根据玩家行为决定结局
         */
        function determineEnding() {
            const stats = gameState.choiceStats;
            const inventory = gameState.inventory;
            
            // 检查真结局条件（收集关键碎片）
            const hasAllKeyItems = endingLibrary.find(e => 
                e.type === 'true' && e.requiredItems.every(item => inventory.includes(item))
            );
            if (hasAllKeyItems) return hasAllKeyItems;

            // 根据选择倾向决定结局
            const maxStat = Math.max(stats.cautious, stats.aggressive, stats.curious, stats.accepting);
            
            if (stats.aggressive >= maxStat && stats.aggressive >= 3) {
                return endingLibrary.find(e => e.id === 'destroyer') || endingLibrary[3];
            }
            
            if (stats.accepting >= maxStat && stats.accepting >= 3) {
                return endingLibrary.find(e => e.id === 'eternal_loop') || endingLibrary[1];
            }
            
            if (stats.curious >= maxStat && stats.curious >= 3) {
                // 检查是否有真相相关碎片
                if (inventory.includes('真相碎片') || inventory.includes('觉醒碎片')) {
                    return endingLibrary.find(e => e.id === 'awakening') || endingLibrary[0];
                }
                return endingLibrary.find(e => e.id === 'observer') || endingLibrary[2];
            }
            
            if (stats.cautious >= maxStat && stats.cautious >= 3) {
                return endingLibrary.find(e => e.id === 'escapee') || endingLibrary[5];
            }

            // 检查是否有叙述者相关碎片
            if (inventory.includes('故事碎片')) {
                return endingLibrary.find(e => e.id === 'storyteller') || endingLibrary[6];
            }

            // 检查是否有死亡相关碎片（bad ending）
            if (inventory.includes('死亡碎片') && inventory.includes('记忆碎片')) {
                return endingLibrary.find(e => e.id === 'memory_lost') || endingLibrary[7];
            }

            // 默认结局：融合者（平衡型）
            return endingLibrary.find(e => e.id === 'merger') || endingLibrary[4];
        }

        /**
         * 生成新场景（核心反转引擎）
         */
        function generateNewScene() {
            // 随机选择一个反转情节
            const reversal = reversalLibrary[Math.floor(Math.random() * reversalLibrary.length)];
            
            // 获取随机场景
            const randomScene = sceneLibrary[Math.floor(Math.random() * sceneLibrary.length)];
            
            // 替换占位符
            let description = reversal.description;
            description = description.replace('{player_name}', gameState.playerName);
            description = description.replace('{last_choice}', gameState.lastChoice);
            description = description.replace('{step}', gameState.step);
            
            // 随机选择一个背包物品（如果有的话）
            const randomItem = gameState.inventory.length > 0 
                ? gameState.inventory[Math.floor(Math.random() * gameState.inventory.length)]
                : '神秘物品';
            description = description.replace('{inventory_item}', randomItem);
            description = description.replace('{location}', randomScene.name);

            // 添加新物品到背包
            if (reversal.addToInventory) {
                reversal.addToInventory.forEach(item => {
                    if (!gameState.inventory.includes(item)) {
                        gameState.inventory.push(item);
                    }
                });
            }

            // 更新当前场景
            gameState.currentScene = {
                name: reversal.name,
                description: description,
                options: reversal.options
            };

            // 重新渲染
            renderScene();
            updateInventory();
        }

        /**
         * 撤销一步
         */
        function undoStep() {
            if (gameState.history.length === 0 || gameState.isGenerating || gameState.gameEnded) return;

            const previousState = gameState.history.pop();
            gameState.currentScene = previousState.currentScene;
            gameState.step = previousState.step;
            gameState.inventory = previousState.inventory;
            gameState.lastChoice = previousState.lastChoice;
            gameState.choiceStats = previousState.choiceStats || { cautious: 0, aggressive: 0, curious: 0, accepting: 0 };

            renderScene();
            updateInventory();
            updateControls();
        }

            gameState.inventory = ['泛黄的车票', '警告纸条'];
            gameState.lastChoice = '';
            gameState.gameEnded = false;
            gameState.choiceStats = {
                cautious: 0,
                aggressive: 0,
                curious: 0,
                accepting: 0
            };

            renderScene();
            updateInventory();
            updateControls();
        }

        /**
         * 键盘事件处理
         */
        function handleKeyPress(e) {
            if (gameState.isGenerating) return;

            const key = e.key.toLowerCase();
            
            // 游戏结束后，只有R键和1键有效
            if (gameState.gameEnded) {
                if (key === 'r' || key === '1') {
                    restartGame();
                }
                return;
            }
            
            // 数字键1-3选择选项
            if (key >= '1' && key <= '3') {
                const index = parseInt(key) - 1;
                const buttons = document.querySelectorAll('.choice-btn');
                if (buttons[index] && !buttons[index].classList.contains('disabled')) {
                    buttons[index].click();
                }
            }
            // R键重置
            else if (key === 'r') {
                restartGame();
            }
            // Z键撤销（Ctrl+Z也支持）
            else if ((key === 'z' && e.ctrlKey) || (key === 'z' && !e.ctrlKey)) {
                undoStep();
            }
        }

        // 启动游戏
        initGame();
    </script>
</body>
</html>
