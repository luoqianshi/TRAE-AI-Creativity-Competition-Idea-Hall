<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>电梯演讲模拟舱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;600;700&display=swap');
body{
  font-family:'Inter','Noto Sans SC','Microsoft YaHei',sans-serif;
  background:#0d1117;color:#c9d1d9;min-height:100vh;overflow-x:hidden;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;
  background:linear-gradient(135deg,#1a2332 0%,#0d1117 50%,#1a2332 100%),
    repeating-linear-gradient(45deg,transparent,transparent 2px,rgba(88,166,255,0.02) 2px,rgba(88,166,255,0.02) 4px);
  z-index:0;
}
body::after{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(88,166,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(88,166,255,0.03) 1px,transparent 1px);
  background-size:60px 60px;z-index:0;pointer-events:none;
}

.header{position:relative;z-index:1;text-align:center;padding:40px 20px 20px}
.header h1{font-size:36px;font-weight:300;color:#f0f6fc;letter-spacing:6px;margin-bottom:8px}
.header h1 strong{font-weight:700;color:#58a6ff}
.header .subtitle{font-size:13px;color:#8b949e;letter-spacing:3px;text-transform:uppercase}
.track-badge{
  display:inline-block;margin-top:15px;padding:4px 16px;
  background:rgba(88,166,255,0.1);border:1px solid rgba(88,166,255,0.3);
  color:#58a6ff;font-size:12px;letter-spacing:2px;border-radius:2px;
}

.main-layout{
  position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;
  gap:30px;max-width:1200px;margin:20px auto;padding:20px;
}

.elevator-panel{
  background:linear-gradient(160deg,#161b22,#0d1117);
  border:1px solid rgba(88,166,255,0.15);border-radius:8px;
  padding:30px;position:relative;min-height:500px;display:flex;flex-direction:column;
}
.panel-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid rgba(88,166,255,0.1);
}
.panel-label{font-size:11px;color:#58a6ff;letter-spacing:2px;text-transform:uppercase}
.panel-label::before{content:'◆ '}

.floor-display{
  background:#0d1117;border:2px solid rgba(88,166,255,0.2);
  border-radius:4px;padding:20px;text-align:center;margin-bottom:20px;position:relative;overflow:hidden;
}
.floor-display::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 0%,rgba(88,166,255,0.05) 50%,transparent 100%);
  animation:screenFlicker 3s infinite;
}
@keyframes screenFlicker{0%,100%{opacity:0.3}50%{opacity:0.6}}
.floor-number{
  font-family:'Inter',monospace;font-size:72px;font-weight:700;color:#58a6ff;
  text-shadow:0 0 20px rgba(88,166,255,0.5);line-height:1;transition:all 0.3s;
}
.floor-label{font-size:12px;color:#8b949e;letter-spacing:3px;margin-top:5px}
.direction-arrow{font-size:20px;color:#58a6ff;margin-top:10px;animation:bounce 1s infinite}
@keyframes bounce{0%{transform:translateY(0)}50%{transform:translateY(5px)}100%{transform:translateY(0)}}

.timer-section{text-align:center;margin-bottom:25px}
.timer-label{font-size:11px;color:#8b949e;letter-spacing:2px;margin-bottom:8px}
.timer-display{font-family:'Inter',monospace;font-size:56px;font-weight:300;color:#f0f6fc;letter-spacing:4px}
.timer-display.urgent{color:#f85149;animation:urgentPulse 0.5s infinite}
@keyframes urgentPulse{0%,100%{opacity:1}50%{opacity:0.5}}
.timer-bar{width:100%;height:3px;background:rgba(255,255,255,0.05);border-radius:2px;margin-top:10px;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#f85149);border-radius:2px;transition:width 1s linear}

.speech-input-section{flex:1;display:flex;flex-direction:column}
.speech-input{
  flex:1;width:100%;min-height:120px;padding:15px;
  background:rgba(13,17,23,0.8);border:1px solid rgba(88,166,255,0.2);
  border-radius:4px;color:#c9d1d9;font-family:inherit;font-size:14px;
  resize:none;outline:none;transition:border-color 0.3s;line-height:1.6;
}
.speech-input:focus{border-color:#58a6ff;box-shadow:0 0 10px rgba(88,166,255,0.1)}
.speech-input::placeholder{color:#484f58}
.speech-controls{display:flex;gap:10px;margin-top:15px}
.start-btn{
  flex:1;padding:12px;background:linear-gradient(135deg,#58a6ff,#1f6feb);
  border:none;color:#fff;font-size:14px;font-weight:600;letter-spacing:2px;
  cursor:pointer;border-radius:4px;transition:all 0.3s;
}
.start-btn:hover{box-shadow:0 4px 20px rgba(88,166,255,0.3);transform:translateY(-1px)}
.start-btn.recording{background:linear-gradient(135deg,#f85149,#da3633);animation:recordPulse 1.5s infinite}
@keyframes recordPulse{0%,100%{box-shadow:0 0 0 0 rgba(248,81,73,0.4)}50%{box-shadow:0 0 0 12px rgba(248,81,73,0)}}
.reset-btn{
  padding:12px 20px;background:transparent;border:1px solid rgba(88,166,255,0.3);
  color:#58a6ff;font-size:14px;cursor:pointer;border-radius:4px;transition:all 0.3s;
}
.reset-btn:hover{background:rgba(88,166,255,0.1)}

.floor-buttons{display:flex;gap:8px;justify-content:center;margin-top:15px}
.floor-btn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(88,166,255,0.1);border:1px solid rgba(88,166,255,0.3);
  color:#58a6ff;font-size:12px;cursor:pointer;transition:all 0.3s;
  display:flex;align-items:center;justify-content:center;
}
.floor-btn:hover{background:rgba(88,166,255,0.2)}
.floor-btn.active{background:#58a6ff;color:#0d1117;box-shadow:0 0 15px rgba(88,166,255,0.5)}

.analysis-panel{
  background:linear-gradient(160deg,#161b22,#0d1117);
  border:1px solid rgba(88,166,255,0.15);border-radius:8px;padding:30px;min-height:500px;
}
.radar-section{text-align:center;margin-bottom:25px}
.radar-svg{width:280px;height:280px;margin:0 auto}
.radar-axis{stroke:rgba(88,166,255,0.15);stroke-width:1;fill:none}
.radar-grid{stroke:rgba(88,166,255,0.08);stroke-width:1;fill:none}
.radar-area{fill:rgba(88,166,255,0.15);stroke:#58a6ff;stroke-width:2;transition:all 0.8s}
.radar-label{font-size:11px;fill:#8b949e;font-family:'Inter',sans-serif}
.radar-value{font-size:12px;fill:#58a6ff;font-weight:bold;font-family:'Inter',monospace}

.score-display{display:flex;justify-content:space-around;margin-bottom:20px}
.score-item{text-align:center}
.score-label{font-size:10px;color:#8b949e;letter-spacing:1px;margin-bottom:5px}
.score-value{font-family:'Inter',monospace;font-size:32px;font-weight:700;color:#58a6ff}
.score-value.high{color:#3fb950}
.score-value.mid{color:#d29922}
.score-value.low{color:#f85149}

.ai-suggestions{background:rgba(13,17,23,0.5);border:1px solid rgba(88,166,255,0.1);border-radius:4px;padding:15px}
.suggestion-title{font-size:12px;color:#58a6ff;letter-spacing:2px;margin-bottom:10px;text-transform:uppercase}
.suggestion-item{
  display:flex;align-items:flex-start;gap:10px;padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,0.03);font-size:12px;color:#c9d1d9;
}
.suggestion-item:last-child{border:none}
.suggestion-icon{
  width:20px;height:20px;border-radius:4px;display:flex;
  align-items:center;justify-content:center;font-size:12px;flex-shrink:0;
}
.suggestion-icon.good{background:rgba(63,185,80,0.15);color:#3fb950}
.suggestion-icon.warn{background:rgba(210,153,34,0.15);color:#d29922}
.suggestion-icon.bad{background:rgba(248,81,73,0.15);color:#f85149}
.suggestion-icon.info{background:rgba(88,166,255,0.15);color:#58a6ff}

.info-section{
  position:relative;z-index:1;max-width:1200px;margin:30px auto;padding:0 20px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
}
.info-card{
  background:linear-gradient(160deg,#161b22,#0d1117);
  border:1px solid rgba(88,166,255,0.15);border-radius:8px;padding:25px;transition:all 0.3s;
}
.info-card:hover{border-color:rgba(88,166,255,0.3);transform:translateY(-3px)}
.info-card h3{font-size:15px;color:#58a6ff;margin-bottom:12px;letter-spacing:1px;font-weight:600}
.info-card h3::before{content:'// '}
.info-card p{font-size:13px;color:#8b949e;line-height:1.8}
.info-card .tag-list{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.info-card .tag{
  padding:3px 10px;background:rgba(88,166,255,0.08);border:1px solid rgba(88,166,255,0.2);
  font-size:11px;color:#58a6ff;border-radius:2px;
}

.footer{position:relative;z-index:1;text-align:center;padding:30px;color:rgba(139,148,158,0.4);font-size:11px;letter-spacing:2px}

@media(max-width:768px){
  .main-layout{grid-template-columns:1fr}
  .info-section{grid-template-columns:1fr}
  .header h1{font-size:24px}
  .timer-display{font-size:40px}
  .floor-number{font-size:48px}
}
</style>
</head>
<body>
<header class="header">
<h1>电梯<strong>演讲</strong>模拟舱</h1>
<p class="subtitle">ELEVATOR PITCH SIMULATOR</p>
</header>
<main class="main-layout">
<section class="elevator-panel">
<div class="panel-header">
<span class="panel-label">电梯面板</span>
<span class="panel-label" style="color:#8b949e">SYSTEM v2.0</span>
</div>
<div class="floor-display">
<div class="floor-number" id="floorNumber">12</div>
<div class="floor-label">FLOOR</div>
<div class="direction-arrow" id="directionArrow">↓</div>
</div>
<div class="floor-buttons" id="floorButtons">
<button class="floor-btn" onclick="setFloor(12)">12</button>
<button class="floor-btn active">12</button>
<button class="floor-btn" onclick="setFloor(8)">8</button>
<button class="floor-btn" onclick="setFloor(5)">5</button>
<button class="floor-btn" onclick="setFloor(1)">1</button>
</div>
<div class="timer-section" style="margin-top:25px">
<div class="timer-label">演讲倒计时</div>
<div class="timer-display" id="timerDisplay">30</div>
<div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
</div>
<div class="speech-input-section">
<div class="panel-label" style="margin-bottom:10px">输入你的演讲内容</div>
<textarea class="speech-input" id="speechInput" placeholder="在30秒内完成你的商业演讲..."></textarea>
<div class="speech-controls">
<button class="start-btn" id="startBtn" onclick="toggleSpeech()">开始演讲</button>
<button class="reset-btn" onclick="resetSpeech()">重置</button>
</div>
</div>
</section>
<section class="analysis-panel">
<div class="panel-header">
<span class="panel-label">AI分析</span>
<span class="panel-label" style="color:#8b949e">REAL-TIME</span>
</div>
<div class="radar-section">
<svg class="radar-svg" viewbox="0 0 280 280">
<polygon class="radar-grid" points="140,30 230,95 195,210 85,210 50,95"></polygon>
<polygon class="radar-grid" points="140,60 200,107 180,180 100,180 80,107"></polygon>
<polygon class="radar-grid" points="140,90 170,120 165,150 115,150 110,120"></polygon>
<line class="radar-axis" x1="140" x2="140" y1="140" y2="30"></line>
<line class="radar-axis" x1="140" x2="230" y1="140" y2="95"></line>
<line class="radar-axis" x1="140" x2="195" y1="140" y2="210"></line>
<line class="radar-axis" x1="140" x2="85" y1="140" y2="210"></line>
<line class="radar-axis" x1="140" x2="50" y1="140" y2="95"></line>
<polygon class="radar-area" id="radarArea" points="140,140 140,140 140,140 140,140 140,140"></polygon>
<text class="radar-label" text-anchor="middle" x="135" y="22">表达清晰</text>
<text class="radar-label" text-anchor="start" x="245" y="95">逻辑结构</text>
<text class="radar-label" text-anchor="middle" x="200" y="230">内容价值</text>
<text class="radar-label" text-anchor="middle" x="80" y="230">感染力</text>
<text class="radar-label" text-anchor="end" x="35" y="95">时间控制</text>
<text class="radar-value" id="v1" text-anchor="middle" x="140" y="55">0</text>
<text class="radar-value" id="v2" text-anchor="middle" x="220" y="100">0</text>
<text class="radar-value" id="v3" text-anchor="middle" x="185" y="200">0</text>
<text class="radar-value" id="v4" text-anchor="middle" x="95" y="200">0</text>
<text class="radar-value" id="v5" text-anchor="middle" x="60" y="100">0</text>
</svg>
</div>
<div class="score-display">
<div class="score-item"><div class="score-label">综合评分</div><div class="score-value" id="totalScore">0</div></div>
<div class="score-item"><div class="score-label">字数</div><div class="score-value" id="wordCount">0</div></div>
<div class="score-item"><div class="score-label">评级</div><div class="score-value" id="grade">-</div></div>
</div>
<div class="ai-suggestions">
<div class="suggestion-title">◆ AI分析建议</div>
<div id="suggestionsList">
<div class="suggestion-item">
<div class="suggestion-icon info">i</div>
<div>点击"开始演讲"按钮，AI将实时分析你的表达</div>
</div>
</div>
</div>
</section>
</main>
<script>
// === 状态变量 ===
var isRecording = false;
var timeLeft = 30;
var timerInterval = null;
var floorInterval = null;
var currentFloor = 12;
var targetFloor = 1;
var scores = {clarity:0, logic:0, value:0, appeal:0, timing:0};

// === 切换演讲状态 ===
function toggleSpeech(){
  if(!isRecording) startSpeech();
  else stopSpeech();
}

// === 开始演讲 ===
function startSpeech(){
  var input = document.getElementById('speechInput').value.trim();
  if(!input){ alert('请先输入你的演讲内容！'); return; }
  isRecording = true;
  timeLeft = 30;
  var btn = document.getElementById('startBtn');
  btn.classList.add('recording');
  btn.textContent = '停止演讲';
  document.getElementById('speechInput').disabled = true;
  timerInterval = setInterval(function(){
    timeLeft--;
    updateTimer();
    if(timeLeft <= 0) stopSpeech();
  }, 1000);
  floorInterval = setInterval(function(){
    if(currentFloor > targetFloor){
      currentFloor--;
      document.getElementById('floorNumber').textContent = currentFloor;
    }
  }, 2500);
  updateTimer();
}

// === 停止演讲 ===
function stopSpeech(){
  isRecording = false;
  clearInterval(timerInterval);
  clearInterval(floorInterval);
  var btn = document.getElementById('startBtn');
  btn.classList.remove('recording');
  btn.textContent = '开始演讲';
  document.getElementById('speechInput').disabled = false;
  analyzeSpeech();
}

// === 更新计时器 ===
function updateTimer(){
  var display = document.getElementById('timerDisplay');
  display.textContent = timeLeft;
  var fill = document.getElementById('timerFill');
  fill.style.width = (timeLeft/30*100) + '%';
  if(timeLeft <= 10) display.classList.add('urgent');
  else display.classList.remove('urgent');
}

// === 设置目标楼层 ===
function setFloor(floor){
  targetFloor = floor;
  document.querySelectorAll('.floor-btn').forEach(function(btn){
    btn.classList.remove('active');
    if(parseInt(btn.textContent) === floor) btn.classList.add('active');
  });
}

// === 分析演讲内容 ===
function analyzeSpeech(){
  var text = document.getElementById('speechInput').value.trim();
  var words = text.length;
  var sentences = text.split(/[。！？.!?]/).filter(function(s){return s.trim().length>0});
  
  // 表达清晰度
  scores.clarity = Math.min(100, Math.floor(words/3 + sentences.length*5));
  if(words < 20) scores.clarity = Math.floor(scores.clarity * 0.5);
  
  // 逻辑结构
  var logicKeywords = ['首先','其次','最后','第一','第二','因为','所以','但是','而且','因此'];
  var logicCount = logicKeywords.filter(function(k){return text.indexOf(k)>=0}).length;
  scores.logic = Math.min(100, 40 + logicCount*15);
  
  // 内容价值
  var valueKeywords = ['解决','提升','降低','增加','效率','成本','收益','用户','市场','创新','优势'];
  var valueCount = valueKeywords.filter(function(k){return text.indexOf(k)>=0}).length;
  scores.value = Math.min(100, 30 + valueCount*10);
  
  // 感染力
  var appealKeywords = ['梦想','改变','未来','相信','一起','创造','更好','独特','唯一'];
  var appealCount = appealKeywords.filter(function(k){return text.indexOf(k)>=0}).length;
  scores.appeal = Math.min(100, 35 + appealCount*12);
  
  // 时间控制
  var usedTime = 30 - timeLeft;
  if(usedTime >= 25 && usedTime <= 30) scores.timing = 100;
  else if(usedTime >= 20 && usedTime < 25) scores.timing = 80;
  else if(usedTime >= 15 && usedTime < 20) scores.timing = 60;
  else scores.timing = 40;
  
  updateRadar();
  
  // 综合评分
  var total = Math.round((scores.clarity + scores.logic + scores.value + scores.appeal + scores.timing) / 5);
  var totalEl = document.getElementById('totalScore');
  totalEl.textContent = total;
  totalEl.className = 'score-value ' + (total>=80?'high':total>=60?'mid':'low');
  document.getElementById('wordCount').textContent = words;
  
  var grade = '-';
  if(total >= 90) grade = 'A+';
  else if(total >= 80) grade = 'A';
  else if(total >= 70) grade = 'B';
  else if(total >= 60) grade = 'C';
  else grade = 'D';
  var gradeEl = document.getElementById('grade');
  gradeEl.textContent = grade;
  gradeEl.className = 'score-value ' + (total>=80?'high':total>=60?'mid':'low');
  
  generateSuggestions();
}

// === 更新雷达图 ===
function updateRadar(){
  var center = {x:140, y:140};
  var maxRadius = 110;
  var dimensions = [
    {value:scores.clarity, angle:-90},
    {value:scores.logic, angle:-18},
    {value:scores.value, angle:54},
    {value:scores.appeal, angle:126},
    {value:scores.timing, angle:198}
  ];
  var points = dimensions.map(function(d){
    var radius = (d.value/100) * maxRadius;
    var rad = d.angle * Math.PI / 180;
    return {x: center.x + radius * Math.cos(rad), y: center.y + radius * Math.sin(rad)};
  });
  var pointStr = points.map(function(p){return p.x + ',' + p.y}).join(' ');
  document.getElementById('radarArea').setAttribute('points', pointStr);
  document.getElementById('v1').textContent = scores.clarity;
  document.getElementById('v2').textContent = scores.logic;
  document.getElementById('v3').textContent = scores.value;
  document.getElementById('v4').textContent = scores.appeal;
  document.getElementById('v5').textContent = scores.timing;
}

// === 生成建议 ===
function generateSuggestions(){
  var suggestions = [];
  var checks = [
    {score:scores.clarity, good:'表达清晰度优秀，字数和句子结构恰到好处', warn:'表达清晰度一般，可以适当增加细节描述', bad:'表达清晰度不足，建议增加内容量，充实演讲内容'},
    {score:scores.logic, good:'逻辑结构清晰，使用了良好的过渡词', warn:'逻辑结构可优化，增加因果和递进关系', bad:'逻辑结构欠缺，建议使用"首先、其次、最后"等过渡词'},
    {score:scores.value, good:'内容价值高，清晰传达了商业价值', warn:'内容价值可提升，突出核心优势和收益', bad:'内容价值不足，需要明确解决的痛点和市场价值'},
    {score:scores.appeal, good:'感染力强，使用了情感化语言打动听众', warn:'感染力一般，可增加情感化表达', bad:'感染力不足，加入"梦想、改变、未来"等情感词汇'},
    {score:scores.timing, good:'时间控制完美，充分利用30秒', warn:'时间控制尚可，可调整节奏', bad:'时间控制不佳，建议用满30秒完整表达'}
  ];
  
  checks.forEach(function(c){
    if(c.score >= 80) suggestions.push({type:'good', text:c.good});
    else if(c.score < 50) suggestions.push({type:'bad', text:c.bad});
    else suggestions.push({type:'warn', text:c.warn});
  });
  
  var list = document.getElementById('suggestionsList');
  list.innerHTML = suggestions.map(function(s){
    return '<div class="suggestion-item"><div class="suggestion-icon ' + s.type + '">' + 
      (s.type==='good'?'✓':s.type==='warn'?'!':'×') + 
      '</div><div>' + s.text + '</div></div>';
  }).join('');
}

// === 重置 ===
function resetSpeech(){
  isRecording = false;
  clearInterval(timerInterval);
  clearInterval(floorInterval);
  timeLeft = 30;
  currentFloor = 12;
  scores = {clarity:0, logic:0, value:0, appeal:0, timing:0};
  document.getElementById('timerDisplay').textContent = '30';
  document.getElementById('timerDisplay').classList.remove('urgent');
  document.getElementById('timerFill').style.width = '100%';
  document.getElementById('floorNumber').textContent = '12';
  document.getElementById('startBtn').classList.remove('recording');
  document.getElementById('startBtn').textContent = '开始演讲';
  document.getElementById('speechInput').disabled = false;
  document.getElementById('speechInput').value = '';
  document.getElementById('totalScore').textContent = '0';
