<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">

    <title>首页 - 本草堂</title>
    <style id="theme-vars">
/* ============================================
   中医辅助诊疗APP - 品牌设计样式
   TCM AI Diagnosis App Brand CSS
   ============================================ */

:root {
  /* === Brand Colors === */
  --color-primary: #2D5016;
  --color-primary-light: #4A7A2E;
  --color-primary-lighter: #6B9E4A;
  --color-primary-lightest: #E8F0E0;
  --color-primary-dark: #1E3A0E;

  /* === Neutral Colors === */
  --color-bg: #FAF8F5;
  --color-bg-secondary: #F5F0EB;
  --color-bg-card: #FFFFFF;
  --color-bg-elevated: #FFFFFF;

  --color-text-primary: #1A1A1A;
  --color-text-secondary: #6B6B6B;
  --color-text-tertiary: #9B9B9B;
  --color-text-inverse: #FFFFFF;

  --color-border: #E8E4DF;
  --color-border-light: #F0ECE7;

  /* === Category Colors === */
  --color-cat-face: #4A7A2E;
  --color-cat-face-bg: #E8F0E0;
  --color-cat-tongue: #8B6B4A;
  --color-cat-tongue-bg: #F0E8DD;
  --color-cat-pulse: #6B8EAE;
  --color-cat-pulse-bg: #E0ECF4;
  --color-cat-ai: #5A6B4A;
  --color-cat-ai-bg: #E8EDE0;

  /* === State Colors === */
  --state-success: #2D5016;
  --state-warning: #C8A96E;
  --state-error: #B44A3E;
  --state-info: #6B8EAE;

  /* === Typography === */
  --font-display: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
  --font-body: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;

  --text-xs: 0.6875rem;
  --text-sm: 0.75rem;
  --text-base: 0.8125rem;
  --text-md: 0.875rem;
  --text-lg: 1rem;
  --text-xl: 1.125rem;
  --text-2xl: 1.25rem;
  --text-3xl: 1.5rem;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;

  /* === Border Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.05);

  /* === Gradients === */
  --gradient-primary: linear-gradient(135deg, #2D5016 0%, #4A7A2E 50%, #6B9E4A 100%);
  --gradient-card: linear-gradient(135deg, #E8F0E0 0%, #F5F0EB 100%);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
