<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>冒险者手札 · 可体验Demo</title>
<style>
:root{
--bg:#faf6ed;--bg2:#efe8d8;--ink:#2c2016;--muted:#7a6b58;--rule:#d4c5a9;
--accent:#c4a041;--accent2:#8b3a3a;--amber:#d4a13a;--amber-soft:#fbf2dd;
--amber-deep:#b8861f;--green:#4c7a3e;--green-soft:#e3f0da;
--surface:#ffffff;--surface-muted:#f5f0e5;--danger:#c0392b;
--star:#e8a834;
--font-title:'Georgia','STSong','serif';--font-body:'Georgia','STSong','serif';
--radius:8px;--radius-lg:14px;--radius-full:999px;
--sp-4:4px;--sp-8:8px;--sp-12:12px;--sp-16:16px;--sp-20:20px;--sp-24:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:var(--font-body);color:var(--ink);background:var(--bg);
line-height:1.6;overflow:hidden;height:100vh;display:flex;justify-content:center;align-items:center;
background:linear-gradient(135deg,#e8dcc8 0%,#faf6ed 30%,#efe8d8 100%);
}
#app{
width:100%;max-width:430px;height:100vh;max-height:900px;
background:var(--surface);display:flex;flex-direction:column;
box-shadow:0 0 60px rgba(44,32,22,.15);position:relative;overflow:hidden;
}
.hdr{
padding:var(--sp-12) var(--sp-16);border-bottom:1px solid var(--rule);
background:var(--surface-muted);display:flex;align-items:center;
justify-content:space-between;min-height:52px;flex-shrink:0;
}
.hdr-title{font-family:var(--font-title);font-weight:700;font-size:16px;color:var(--ink);}
.hdr-sub{font-size:11px;color:var(--muted);}
.hdr-right{display:flex;align-items:center;gap:var(--sp-8);}
.btn-sm{
padding:4px 12px;border-radius:var(--radius-full);font-size:11px;
font-family:inherit;cursor:pointer;border:1px solid var(--rule);
background:transparent;color:var(--ink);font-weight:600;
}
.btn-sm.primary{background:var(--amber-deep);color:#fff;border-color:var(--amber-deep);}
.btn-sm.danger{color:var(--danger);border-color:var(--danger);}
.badge-pill{
display:flex;align-items:center;gap:var(--sp-4);
background:var(--amber-soft);color:var(--amber-deep);
padding:3px var(--sp-8);border-radius:var(--radius-full);
font-size:11px;font-weight:600;
}
.body-scroll{flex:1;overflow-y:auto;padding:var(--sp-12);-webkit-overflow-scrolling:touch;}
.body-scroll::-webkit-scrollbar{width:0;}
.tabbar{
display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);
background:var(--surface-muted);flex-shrink:0;
}
.tab-btn{
border:none;background:transparent;padding:var(--sp-8) 0 var(--sp-12);
font-family:inherit;font-size:10px;color:var(--muted);cursor:pointer;
display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s;
}
.tab-btn .ico{font-size:20px;line-height:1;}
.tab-btn.active{color:var(--amber-deep);}
.tab-btn.active::before{content:'';display:block;width:16px;height:3px;
border-radius:var(--radius-full);background:var(--amber-deep);margin-bottom:2px;}
/* Cards */
.card{
background:var(--surface);border:1px solid var(--rule);
border-radius:var(--radius-lg);padding:var(--sp-12);margin-bottom:var(--sp-8);
display:flex;gap:var(--sp-12);align-items:center;cursor:pointer;transition:border-color .15s;
}
.card:active{border-color:var(--amber);}
.card-avatar{
width:40px;height:40px;border-radius:var(--radius);background:var(--amber-soft);
display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
}
.card-info{flex:1;min-width:0;}
.card-name{font-size:14px;font-weight:700;color:var(--ink);}
.card-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.card-dots{display:flex;margin-top:4px;}
.card-dot{
width:20px;height:20px;border-radius:50%;background:var(--surface-muted);
border:2px solid var(--surface);margin-left:-6px;display:flex;
align-items:center;justify-content:center;font-size:10px;
}
.card-dot:first-child{margin-left:0;}
/* Density */
.density-bar{display:flex;gap:4px;margin-bottom:var(--sp-12);}
.density-btn{
padding:3px 12px;border-radius:var(--radius-full);font-size:10px;
font-weight:600;border:1px solid var(--rule);background:transparent;
color:var(--muted);cursor:pointer;font-family:inherit;
}
.density-btn.active{background:var(--amber-soft);color:var(--amber-deep);border-color:var(--amber);}
.search-input{
width:100%;padding:var(--sp-8) var(--sp-12);border:1px solid var(--rule);
border-radius:var(--radius-full);font-size:12px;font-family:inherit;
background:var(--surface);margin-bottom:var(--sp-12);outline:none;
}
.search-input:focus{border-color:var(--amber);}
.fab{
display:block;width:100%;margin-top:var(--sp-8);padding:var(--sp-12);
border-radius:var(--radius-full);background:var(--amber-deep);color:#fff;
border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
text-align:center;letter-spacing:.04em;
}
/* Filter bar */
.filter-bar{display:flex;gap:6px;margin-bottom:8px;}
.filter-btn{
padding:3px 12px;border-radius:var(--radius-full);font-size:10px;
font-weight:600;border:1px solid var(--rule);background:transparent;
color:var(--muted);cursor:pointer;font-family:inherit;
}
.filter-btn.active{background:var(--amber-soft);color:var(--amber-deep);border-color:var(--amber);}
.filter-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.filter-tag{
padding:2px 10px;border-radius:var(--radius-full);font-size:10px;
background:var(--amber-soft);color:var(--amber-deep);cursor:pointer;font-weight:600;
}
/* Detail */
.detail-avatar{
width:80px;height:80px;border-radius:var(--radius-lg);background:var(--amber-soft);
display:flex;align-items:center;justify-content:center;font-size:48px;margin:0 auto var(--sp-8);
}
.detail-name{text-align:center;font-size:18px;font-weight:700;}
.detail-sub{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 var(--sp-12);}
.field-row{
display:flex;padding:var(--sp-8) 0;border-bottom:1px solid var(--bg2);
font-size:13px;
}
.field-row:last-child{border-bottom:none;}
.field-label{color:var(--muted);min-width:64px;flex-shrink:0;}
.field-value{color:var(--ink);word-break:break-all;}
.field-value .mention{color:var(--amber-deep);font-weight:600;cursor:pointer;text-decoration:underline;}
.field-row.starred{background:linear-gradient(90deg,var(--amber-soft) 0%,transparent 60%);border-radius:0 var(--radius) var(--radius) 0;padding-left:var(--sp-8);margin-left:calc(-1*var(--sp-8));}
.field-row.starred .field-label::before{content:'⭐ ';font-size:10px;}
.child-row{padding-left:var(--sp-16);font-size:12px;color:var(--muted);}
.child-row .field-value{color:var(--muted);}
.bottom-bar{
display:flex;border-top:1px solid var(--rule);background:var(--surface-muted);flex-shrink:0;
}
.bottom-btn{
flex:1;border:none;background:transparent;padding:var(--sp-12);
font-family:inherit;font-size:13px;cursor:pointer;color:var(--ink);font-weight:600;
}
.bottom-btn.primary{color:var(--amber-deep);}
.bottom-btn:first-child{border-right:1px solid var(--rule);}
/* Archive/delete bar (pull-down) */
.archive-bar{
background:var(--danger);color:#fff;text-align:center;padding:10px;
font-size:13px;font-weight:600;cursor:pointer;animation:slideDown .2s;
}
@keyframes slideDown{from{transform:translateY(-100%);}to{transform:translateY(0);}}
/* Edit */
.edit-field{
display:flex;align-items:center;gap:var(--sp-8);padding:var(--sp-8) 0;
}
.edit-field.child{padding-left:var(--sp-24);position:relative;}
.edit-field.child::before{content:'└';position:absolute;left:var(--sp-8);color:var(--rule);font-size:16px;}
.edit-label{font-size:11px;color:var(--muted);min-width:48px;}
.edit-input{
flex:1;padding:6px var(--sp-8);border:1px solid var(--rule);border-radius:var(--radius);
font-size:13px;font-family:inherit;background:var(--surface);min-width:0;
}
.edit-input:focus{border-color:var(--amber);outline:none;}
.edit-del{color:var(--danger);font-size:16px;cursor:pointer;padding:4px;}
.edit-move{color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;font-weight:700;}
.edit-star{color:var(--rule);font-size:16px;cursor:pointer;padding:4px;}
.edit-star.active{color:var(--star);}
.edit-addchild{color:var(--amber-deep);font-size:14px;cursor:pointer;padding:4px;border:1px dashed var(--amber);border-radius:var(--radius);background:var(--amber-soft);}
.edit-mention{color:var(--amber-deep);font-size:14px;cursor:pointer;padding:2px 8px;border:1px solid var(--amber);border-radius:var(--radius-full);font-weight:700;background:var(--amber-soft);}
/* Starred section */
.starred-section{
background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--radius-lg);
padding:var(--sp-8) var(--sp-12);margin-bottom:var(--sp-12);max-height:120px;overflow-y:auto;
}
.starred-section::-webkit-scrollbar{width:0;}
.starred-title{font-size:10px;color:var(--amber-deep);font-weight:700;margin-bottom:4px;}
.starred-item{font-size:12px;padding:3px 0;display:flex;gap:6px;align-items:center;}
.starred-item .sname{color:var(--muted);min-width:48px;}
.starred-item .sval{color:var(--ink);}
/* Modal */
.modal-mask{
position:fixed;inset:0;background:rgba(44,32,22,.5);z-index:100;
display:flex;align-items:flex-end;justify-content:center;
}
.modal-sheet{
width:100%;max-width:430px;max-height:70vh;background:var(--surface);
border-radius:var(--radius-lg) var(--radius-lg) 0 0;overflow-y:auto;
animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-hdr{
padding:var(--sp-12) var(--sp-16);border-bottom:1px solid var(--rule);
display:flex;justify-content:space-between;align-items:center;
font-weight:700;font-size:14px;
}
.modal-body{padding:var(--sp-12);}
.modal-close{font-size:20px;color:var(--muted);cursor:pointer;background:none;border:none;}
/* Move menu */
.move-menu-item{
display:flex;align-items:center;gap:var(--sp-12);padding:var(--sp-12);
cursor:pointer;border-bottom:1px solid var(--bg2);font-size:13px;
}
.move-menu-item:last-child{border-bottom:none;}
.move-menu-item:active{background:var(--bg2);}
.move-menu-item.disabled{opacity:.35;pointer-events:none;}
.move-menu-item .ico{font-size:18px;width:24px;text-align:center;}
/* Shop */
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-8);}
.shop-item{
background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius-lg);
padding:var(--sp-16) var(--sp-8);text-align:center;
}
.shop-emoji{font-size:40px;margin-bottom:6px;}
.shop-name{font-size:12px;font-weight:700;}
.shop-price{font-size:11px;color:var(--amber-deep);margin:4px 0;}
.shop-btn{
padding:5px var(--sp-16);border-radius:var(--radius-full);font-size:11px;
border:1px solid var(--amber-deep);background:transparent;color:var(--amber-deep);
font-family:inherit;font-weight:600;cursor:pointer;
}
.shop-btn.owned{border-color:var(--rule);color:var(--muted);cursor:default;}
.shop-btn.locked{border-color:var(--rule);color:var(--muted);opacity:.5;cursor:not-allowed;}
/* Hero */
.hero-card{
background:linear-gradient(135deg,var(--amber-soft),var(--surface));
border:1px solid var(--rule);border-radius:var(--radius-lg);padding:var(--sp-20);
text-align:center;margin-bottom:var(--sp-16);
}
.hero-num{font-size:36px;font-weight:700;color:var(--amber-deep);}
.hero-label{font-size:12px;color:var(--muted);margin-top:4px;}
.hero-status{font-size:11px;color:var(--green);margin-top:var(--sp-8);cursor:pointer;}
.menu-item{
background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);
padding:var(--sp-12);margin-bottom:var(--sp-4);display:flex;align-items:center;
gap:var(--sp-8);font-size:13px;cursor:pointer;
}
.menu-item .arrow{margin-left:auto;color:var(--muted);font-size:16px;}
.section-label{font-size:10px;color:var(--muted);padding:var(--sp-8) 0;text-transform:uppercase;letter-spacing:.06em;}
/* Sub-items */
.sub-card{
background:var(--surface-muted);border:1px solid var(--rule);border-radius:var(--radius);
padding:var(--sp-12);margin-bottom:var(--sp-8);
}
.sub-desc{font-size:13px;color:var(--ink);}
.sub-desc .mention{color:var(--amber-deep);font-weight:600;cursor:pointer;text-decoration:underline;}
/* Icon Picker */
.icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--sp-8);}
.icon-opt{
aspect-ratio:1;display:flex;align-items:center;justify-content:center;
font-size:28px;border:2px solid var(--rule);border-radius:var(--radius);
cursor:pointer;transition:border-color .15s;
}
.icon-opt.selected{border-color:var(--amber-deep);background:var(--amber-soft);}
/* Toast */
.toast{
position:fixed;top:60px;left:50%;transform:translateX(-50%);
background:rgba(44,32,22,.85);color:#fff;padding:var(--sp-8) var(--sp-20);
border-radius:var(--radius-full);font-size:13px;z-index:200;animation:fadeIn .2s;
pointer-events:none;white-space:nowrap;
}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(-10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
/* Gender selector */
.gender-group{display:flex;gap:var(--sp-8);}
.gender-opt{
padding:4px var(--sp-12);border-radius:var(--radius-full);font-size:12px;
border:1px solid var(--rule);background:transparent;cursor:pointer;font-family:inherit;
}
.gender-opt.active{background:var(--amber-soft);border-color:var(--amber);font-weight:700;}
.empty-state{
text-align:center;padding:var(--sp-24) var(--sp-16);color:var(--muted);
font-size:13px;line-height:1.8;
}
.empty-ico{font-size:48px;margin-bottom:var(--sp-12);opacity:.5;}
.dispatch-row{display:flex;gap:6px;flex-wrap:wrap;margin:var(--sp-8) 0;}
.dispatch-chip{
padding:4px var(--sp-8);border-radius:var(--radius-full);font-size:11px;
background:var(--amber-soft);display:flex;align-items:center;gap:4px;cursor:pointer;
}
.dispatch-chip .r{margin-left:2px;color:var(--muted);cursor:pointer;font-size:14px;}
.confirm-dialog{
background:var(--surface);border-radius:var(--radius-lg);padding:var(--sp-20);
text-align:center;max-width:280px;margin:auto;
}
.confirm-dialog h3{font-size:15px;margin-bottom:var(--sp-8);}
.confirm-dialog p{font-size:13px;color:var(--muted);margin-bottom:var(--sp-16);}
.confirm-btns{display:flex;gap:var(--sp-8);justify-content:center;}
.confirm-btns button{
padding:8px 24px;border-radius:var(--radius-full);font-size:13px;
font-family:inherit;cursor:pointer;font-weight:600;
}
.btn-cancel{background:transparent;border:1px solid var(--rule);color:var(--muted);}
.btn-confirm{background:var(--danger);color:#fff;border:none;}
.modal-center{
position:fixed;inset:0;background:rgba(44,32,22,.5);z-index:100;
display:flex;align-items:center;justify-content:center;
}
.detail-section{margin-bottom:var(--sp-16);}
.detail-section-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-bottom:var(--sp-4);}
.grayed{opacity:.35;pointer-events:none;}
/* Preview card */
.preview-card{
position:fixed;inset:0;background:rgba(44,32,22,.5);z-index:150;
display:flex;align-items:center;justify-content:center;
}
.preview-inner{
background:var(--surface);border-radius:var(--radius-lg);padding:var(--sp-20);
max-width:300px;width:90%;text-align:center;
animation:popIn .2s ease;
}
@keyframes popIn{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
.preview-avatar{font-size:48px;margin-bottom:var(--sp-8);}
.preview-name{font-size:16px;font-weight:700;}
.preview-sub{font-size:12px;color:var(--muted);margin-bottom:var(--sp-12);}
.preview-fields{text-align:left;margin-bottom:var(--sp-12);max-height:150px;overflow-y:auto;}
.preview-fields::-webkit-scrollbar{width:0;}
.preview-field{font-size:12px;padding:3px 0;display:flex;gap:6px;}
.preview-field .pl{color:var(--muted);min-width:48px;}
.preview-actions{display:flex;gap:var(--sp-8);justify-content:center;}
/* Dev bar */
.dev-bar{
position:absolute;top:0;right:0;z-index:300;
display:flex;gap:4px;padding:4px;
}
.dev-btn{
font-size:9px;padding:2px 8px;border-radius:var(--radius-full);
background:rgba(192,57,43,.85);color:#fff;border:none;cursor:pointer;
font-family:inherit;
}
/* Desc box (task) */
.desc-box{font-size:13px;color:var(--ink);text-align:center;margin:8px 0;line-height:1.7;}
.desc-box .mention{color:var(--amber-deep);font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <div class="dev-bar">
    <button class="dev-btn" onclick="UI.resetData()">重置数据</button>
  </div>
</div>

<script>
/* =====  DATA ENGINE ===== */
var STORE = {
  _key:'adventurer_handbook_v3',
  _defaults:{
    chars:[
      {
        id:'c1',name:'张三',avatar:'🔥',gender:'M',age:34,
        fields:[
          {fid:'f1',fn:'组织',fv:'银辰商会',starred:true,children:[
            {cid:'ch1',cv:'商务部'}
          ]},
          {fid:'f2',fn:'住所',fv:'北京',starred:false,children:[]},
          {fid:'f3',fn:'爱好',fv:'登山、品茶',starred:false,children:[]},
          {fid:'f4',fn:'关系',fv:'客户',starred:false,children:[]}
        ],
        archived:false,created:Date.now()-5e8
      },
      {
        id:'c2',name:'老王',avatar:'🛡️',gender:'M',age:41,
        fields:[
          {fid:'f5',fn:'组织',fv:'北境守备团',starred:false,children:[]},
          {fid:'f6',fn:'关系',fv:'战友',starred:true,children:[]}
        ],
        archived:false,created:Date.now()-3e8
      },
      {
        id:'c3',name:'小李',avatar:'🗡️',gender:'F',age:27,
        fields:[
          {fid:'f7',fn:'住所',fv:'上海',starred:false,children:[]}
        ],
        archived:false,created:Date.now()-2e8
      }
    ],
    tasks:[
      {id:'t1',name:'周末野餐',desc:'全家前往湖畔公园野餐',icon:'🍰',date:'2026-07-04',dispatched:['c1','c2'],subs:[
        {sid:'s1',desc:'妈妈准备野餐食物'},
        {sid:'s2',desc:'爸爸开车带全家出发'},
        {sid:'s3',desc:'全家享用午餐'},
        {sid:'s4',desc:'宝宝说下次带小明来'}
      ]},
      {id:'t2',name:'商队护送',desc:'与张三洽谈新季度合作',icon:'🤝',date:'2026-07-02',dispatched:['c1'],subs:[]},
      {id:'t3',name:'密会',desc:'与小李私下会谈',icon:'🕯️',date:'2026-06-28',dispatched:['c3'],subs:[]}
    ],
    user:{badges:42,totalEarned:58,ownedAvatars:['a0','a1','a2'],lastBadgeDate:'',hasEarnedToday:true}
  },
  init:function(){
    var raw=localStorage.getItem(this._key);
    if(raw){try{this.data=JSON.parse(raw);}catch(e){this.data=JSON.parse(JSON.stringify(this._defaults));this.save();}}
    else{this.data=JSON.parse(JSON.stringify(this._defaults));this.save();}
  },
  save:function(){localStorage.setItem(this._key,JSON.stringify(this.data));},
  reset:function(){this.data=JSON.parse(JSON.stringify(this._defaults));this.save();},
  c:function(id){return this.data.chars.find(function(x){return x.id===id;});},
  t:function(id){return this.data.tasks.find(function(x){return x.id===id;});},
  allChars:function(){return this.data.chars.filter(function(x){return !x.archived;});},
  uid:function(){return 'i'+Date.now()+Math.random().toString(36).slice(2,8);},
  gdLabel:function(g){return g==='M'?'♂ 男':g==='F'?'♀ 女':'? 未知';},
  fmtAge:function(age){return age?age+'岁':'?岁';},
  fmtDate:function(dateStr){
    if(!dateStr)return '';
    var d=new Date(dateStr);
    return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
  },
  aEmoji:function(id){var c=this.c(id);return c?c.avatar:'❓';},
  aName:function(id){var c=this.c(id);return c?c.name:'(已归档)';},
  aExists:function(id){return !!this.c(id);},
  today:function(){return new Date().toISOString().slice(0,10);}
};

var AVATARS=[
  {id:'a0',name:'流浪骑士',emoji:'🔥',price:0,category:'free'},
  {id:'a1',name:'森林游侠',emoji:'🌿',price:0,category:'free'},

var TASK_ICONS=['⚔️','🛡️','🧪','📜','🔮','✒️','👑','🗝️','🔥','🧭','🗡️','💍','🍰','🤝','🕯️','🎯','🏆','💊','📦','🌙'];

STORE.init();

/* =====  UI ENGINE ===== */
var UI={
  app:document.getElementById('app'),
  page:'characters',
  density:'small',
  search:'',
  currentCharId:null,
  currentTaskId:null,
  editFields:[],
  iconFilter:'',
  charFilter:'',
  charFilterName:'',
  sortOrder:'desc',
  // Task edit state
  taskEditData:{},
  toastTimer:null,

  toast:function(msg){
    var el=document.createElement('div');el.className='toast';el.textContent=msg;
    document.body.appendChild(el);
    clearTimeout(this.toastTimer);
    this.toastTimer=setTimeout(function(){el.remove();},1800);
  },

  confirm:function(title,msg,cb){
    var mask=document.createElement('div');mask.className='modal-center';
    mask.innerHTML='<div class="confirm-dialog"><h3>'+title+'</h3><p>'+msg+'</p><div class="confirm-btns"><button class="btn-cancel">取消</button><button class="btn-confirm">确认</button></div></div>';
    document.body.appendChild(mask);
    mask.querySelector('.btn-cancel').onclick=function(){mask.remove();};
    mask.querySelector('.btn-confirm').onclick=function(){mask.remove();cb();};
    mask.onclick=function(e){if(e.target===mask)mask.remove();};
  },

  showModal:function(title,bodyHTML){
    var mask=document.createElement('div');mask.className='modal-mask';
    mask.innerHTML='<div class="modal-sheet"><div class="modal-hdr"><span>'+title+'</span><button class="modal-close">&times;</button></div><div class="modal-body">'+bodyHTML+'</div></div>';
    document.body.appendChild(mask);
    mask.querySelector('.modal-close').onclick=function(){mask.remove();};
    mask.onclick=function(e){if(e.target===mask)mask.remove();};
    return mask;
  },

  showPreviewCard:function(cid){
    var c=STORE.c(cid);
    if(!c)return;
    var fieldsHTML='';
    c.fields.forEach(function(f){
      fieldsHTML+='<div class="preview-field"><span class="pl">'+f.fn+'</span><span>'+UI.renderMentions(f.fv)+'</span></div>';
    });
    var mask=document.createElement('div');mask.className='preview-card';
    mask.innerHTML='<div class="preview-inner">'+
      '<div class="preview-avatar'+(c.archived?' grayed':'')+'">'+c.avatar+'</div>'+
      '<div class="preview-name">'+c.name+(c.archived?' (已归档)':'')+'</div>'+
      '<div class="preview-sub">'+STORE.gdLabel(c.gender)+' · '+STORE.fmtAge(c.age)+'</div>'+
      '<div class="preview-fields">'+fieldsHTML+'</div>'+
      '<div class="preview-actions">'+
        '<button class="btn-sm primary" id="pv-detail">查看详情</button>'+
        '<button class="btn-sm" id="pv-close">关闭</button>'+
      '</div></div>';
    document.body.appendChild(mask);
    mask.querySelector('#pv-close').onclick=function(){mask.remove();};
    mask.querySelector('#pv-detail').onclick=function(){mask.remove();UI.goChar(cid);};
    mask.onclick=function(e){if(e.target===mask)mask.remove();};
  },

  renderMentions:function(text){
    if(!text)return '';
    return text.replace(/@(\S+)/g,function(m,name){
      var found=STORE.data.chars.find(function(c){return c.name===name;});
      if(found) return '<span class="mention" onclick="event.stopPropagation();UI.showPreviewCard(\''+found.id+'\')">'+m+'</span>';
      return m;
    });
  },

  resetData:function(){
    this.confirm('重置数据','确定重置所有数据为初始状态？此操作不可撤销。',function(){
      STORE.reset();
      UI.page='characters';UI.search='';UI.render();
      UI.toast('数据已重置');
    });
  },

  render:function(){
    var devBar=this.app.querySelector('.dev-bar');
    this.app.innerHTML='';
    if(devBar)this.app.appendChild(devBar);
    switch(this.page){
      case 'characters':this.renderCharList();break;
      case 'character-detail':this.renderCharDetail();break;
      case 'character-edit':this.renderCharEdit();break;
      case 'tasks':this.renderTaskList();break;
      case 'task-detail':this.renderTaskDetail();break;
      case 'task-edit':this.renderTaskEdit();break;
      case 'backpack':this.renderBackpack();break;
      case 'shop':this.renderShop();break;
      case 'gallery':this.renderGallery();break;
      default:this.renderCharList();
    }
    this.renderTabbar();
  },

  renderTabbar:function(){
    var showTabs=['characters','tasks','backpack'].indexOf(this.page)>-1;
    if(!showTabs)return;
    var tb=document.createElement('div');tb.className='tabbar';
    var tabs=[{id:'characters',ico:'📜',label:'角色'},{id:'tasks',ico:'⚔️',label:'任务'},{id:'backpack',ico:'',label:'行囊'}];
    var self=this;
    tabs.forEach(function(t){
      var btn=document.createElement('button');btn.className='tab-btn';
      if(self.page===t.id)btn.classList.add('active');
      if(t.ico){
        btn.innerHTML='<span class="ico">'+t.ico+'</span>'+t.label;
      }else{
        btn.innerHTML='<svg width="20" height="20" viewBox="0 0 64 64" style="display:block;margin:0 auto;"><path d="M22 22 L42 22 L40 16 L24 16 Z" fill="#b8861f" opacity="0.85"/><path d="M20 24 C20 22 44 22 44 24 L46 46 C46 52 18 52 18 46 Z" fill="#d4a13a"/><circle cx="32" cy="40" r="3.2" fill="#fbf2dd" opacity="0.85"/><text x="32" y="43" text-anchor="middle" font-size="5" fill="#b8861f" font-family="serif">✦</text></svg>'+t.label;
      }
      btn.onclick=function(){self.page=t.id;self.search='';self.render();};
      tb.appendChild(btn);
    });
    this.app.appendChild(tb);
  },

  goChar:function(id){this.currentCharId=id;this.page='character-detail';this.render();},
  goTask:function(id){this.currentTaskId=id;this.page='task-detail';this.render();},
  goBack:function(){
    if(this.page==='character-detail'||this.page==='character-edit'){this.page='characters';this.render();}
    else if(this.page==='task-detail'||this.page==='task-edit'){this.page='tasks';this.render();}
    else if(this.page==='shop'||this.page==='gallery'){this.page='backpack';this.render();}
  },

  getStarred:function(char){
    var result=[];
    char.fields.forEach(function(f){
      if(f.starred&&f.fv)result.push({fn:f.fn,fv:f.fv});
      (f.children||[]).forEach(function(ch){
        if(ch.starred&&ch.cv)result.push({fn:f.fn,fv:ch.cv});
      });
    });
    return result;
  },

  // ═══ CHARACTER LIST ═══
  renderCharList:function(){
    var self=this;
    var chars=STORE.allChars();
    chars.sort(function(a,b){
      var ta=0,tb=0;
      STORE.data.tasks.forEach(function(t){
        if(t.dispatched.indexOf(a.id)>-1&&new Date(t.date).getTime()>ta)ta=new Date(t.date).getTime();
        if(t.dispatched.indexOf(b.id)>-1&&new Date(t.date).getTime()>tb)tb=new Date(t.date).getTime();
      });
      if(ta!==tb)return tb-ta;
      return b.created-a.created;
    });
    if(self.search){
      var q=self.search.toLowerCase();
      chars=chars.filter(function(c){
        if(c.name.toLowerCase().indexOf(q)>-1)return true;
        return c.fields.some(function(f){return (f.fn+f.fv).toLowerCase().indexOf(q)>-1;});
      });
    }
    var hdr=document.createElement('div');hdr.className='hdr';
    hdr.innerHTML='<div><div class="hdr-title">角色</div><div class="hdr-sub">冒险者公会 · 卷宗 ('+chars.length+')</div></div><div class="hdr-right"><span class="badge-pill">✦ '+STORE.data.user.badges+'</span></div>';
    self.app.appendChild(hdr);

    var body=document.createElement('div');body.className='body-scroll';
    var dBar=document.createElement('div');dBar.className='density-bar';
    [{id:'small',label:'紧凑'},{id:'large',label:'标准'},{id:'xlarge',label:'展开'}].forEach(function(d){
      var btn=document.createElement('button');btn.className='density-btn';btn.textContent=d.label;
      if(self.density===d.id)btn.classList.add('active');
      btn.onclick=function(){self.density=d.id;self.render();};
      dBar.appendChild(btn);
    });
    body.appendChild(dBar);
    var inp=document.createElement('input');inp.className='search-input';inp.placeholder='搜索角色（名称/字段）...';inp.value=self.search;
    inp.oninput=function(){self.search=this.value;self.render();};
    body.appendChild(inp);
    if(chars.length===0){
      body.innerHTML+='<div class="empty-state"><div class="empty-ico">📜</div>旅人，你尚未结识任何同伴。<br>点击下方按钮创建第一位冒险者吧。</div>';
    }else{
      chars.forEach(function(c){
        var card=document.createElement('div');card.className='card';
        var dispatchCount=STORE.data.tasks.filter(function(t){return t.dispatched.indexOf(c.id)>-1;}).length;
        var starred=UI.getStarred(c);
        var starredHTML='';
        if(self.density==='xlarge'&&starred.length>0){
          starredHTML='<div style="font-size:10px;color:var(--amber-deep);margin-top:2px;">⭐ '+starred.map(function(s){return s.fn+': '+s.fv;}).join(' · ')+'</div>';
        }
        var extraInfo='';
        if(self.density==='large')extraInfo=' · '+c.avatar;
        if(self.density==='xlarge'){
          var fvs=c.fields.slice(0,3).map(function(f){return f.fv;}).join(' | ');
          extraInfo=(c.avatar?' · '+c.avatar:'')+(fvs?'<br><span style="font-size:10px;color:var(--muted);">'+fvs+'</span>':'');
        }
        card.innerHTML='<div class="card-avatar">'+c.avatar+'</div><div class="card-info"><div class="card-name">'+c.name+extraInfo+'</div><div class="card-meta">'+STORE.gdLabel(c.gender)+' · '+STORE.fmtAge(c.age)+' · '+dispatchCount+'次征途</div>'+starredHTML+'</div>';
        card.onclick=function(){self.goChar(c.id);};
        body.appendChild(card);
      });
    }
    var fab=document.createElement('button');fab.className='fab';fab.textContent='＋ 创建角色卡';
    fab.onclick=function(){self.currentCharId=null;self.page='character-edit';self.render();};
    body.appendChild(fab);
    self.app.appendChild(body);
  },

  // ═══ CHARACTER DETAIL ═══
  renderCharDetail:function(){
    var self=this;
    var c=STORE.c(this.currentCharId);
    if(!c){this.page='characters';this.render();return;}
    var archived=c.archived;
    var dispatchTasks=STORE.data.tasks.filter(function(t){return t.dispatched.indexOf(c.id)>-1;}).sort(function(a,b){return new Date(b.date)-new Date(a.date);});

    var hdr=document.createElement('div');hdr.className='hdr';
    hdr.innerHTML='<span style="cursor:pointer;font-size:18px;color:var(--muted);" onclick="UI.goBack()">← 返回</span><div class="hdr-right"><span class="btn-sm" onclick="UI.page=\'character-edit\';UI.render()">✏️ 编辑</span></div>';
    self.app.appendChild(hdr);

    var body=document.createElement('div');body.className='body-scroll';
    body.innerHTML='<div class="detail-avatar'+(archived?' grayed':'')+'">'+c.avatar+'</div>'+
      '<div class="detail-name'+(archived?' grayed':'')+'">'+c.name+'</div>'+
      '<div class="detail-sub">'+STORE.gdLabel(c.gender)+' · '+STORE.fmtAge(c.age)+(archived?' · <span style="color:var(--accent2);">已归档</span>':'')+'</div>';

    var starred=UI.getStarred(c);
    if(starred.length>0){
      body.innerHTML+='<div class="starred-section"><div class="starred-title">⭐ 特别关心</div>';
      starred.forEach(function(s){
        body.innerHTML+='<div class="starred-item"><span class="sname">'+s.fn+'</span><span class="sval">'+self.renderMentions(s.fv)+'</span></div>';
      });
      body.innerHTML+='</div>';
    }

    body.innerHTML+='<div class="detail-section"><div class="detail-section-title">角色信息</div>';
    body.innerHTML+='<div class="field-row"><span class="field-label">年龄</span><span class="field-value">'+STORE.fmtAge(c.age)+'</span></div>';
    c.fields.forEach(function(f){
      body.innerHTML+='<div class="field-row'+(f.starred?' starred':'')+'"><span class="field-label">'+f.fn+'</span><span class="field-value">'+self.renderMentions(f.fv)+'</span></div>';
      (f.children||[]).forEach(function(ch){
        body.innerHTML+='<div class="field-row child-row"><span class="field-label"></span><span class="field-value">'+self.renderMentions(ch.cv)+'</span></div>';
      });
    });
    body.innerHTML+='</div>';

    body.innerHTML+='<div class="detail-section"><div class="detail-section-title">征途履历 ('+dispatchTasks.length+')</div>';
    if(dispatchTasks.length===0){
      body.innerHTML+='<div class="empty-state" style="padding:12px;font-size:12px;">该冒险者尚未参与任何征途</div>';
    }else{
      dispatchTasks.forEach(function(t){
        body.innerHTML+='<div class="card" style="cursor:pointer;" onclick="UI.goTask(\''+t.id+'\')"><div class="card-avatar" style="background:#fdf3e0;">'+t.icon+'</div><div class="card-info"><div class="card-name">'+t.name+'</div><div class="card-meta">'+STORE.fmtDate(t.date)+'</div></div></div>';
      });
    }
    body.innerHTML+='</div>';
    self.app.appendChild(body);

    var bb=document.createElement('div');bb.className='bottom-bar';
    bb.innerHTML='<button class="bottom-btn" onclick="UI.page=\'character-edit\';UI.render()">✏️ 编辑</button><button class="bottom-btn primary" onclick="UI.goCharTaskHistory(\''+c.id+'\')">🔍 任务履历 ('+dispatchTasks.length+')</button>';
    self.app.appendChild(bb);
  },

  goCharTaskHistory:function(cid){
    var self=this;
    var c=STORE.c(cid);
    var tasks=STORE.data.tasks.filter(function(t){return t.dispatched.indexOf(cid)>-1;}).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
    var h='<div style="max-height:60vh;overflow-y:auto;">';
    if(tasks.length===0)h+='<div class="empty-state">该冒险者尚未参与任何征途</div>';
    else tasks.forEach(function(t){h+='<div class="card" onclick="UI.goTask(\''+t.id+'\');document.querySelector(\'.modal-mask\').remove()"><div class="card-avatar" style="background:#fdf3e0;">'+t.icon+'</div><div class="card-info"><div class="card-name">'+t.name+'</div><div class="card-meta">'+STORE.fmtDate(t.date)+'</div></div></div>';});
    h+='</div>';
    this.showModal(c.name+' · 征途履历',h);
  },

  // ═══ CHARACTER EDIT ═══
  renderCharEdit:function(){
    var self=this;
    var isNew=!this.currentCharId;
    var c;
    if(isNew){
      c={id:'',name:'',avatar:'🔥',gender:'M',age:0,fields:[
        {fid:STORE.uid(),fn:'组织',fv:'',starred:false,children:[]},
        {fid:STORE.uid(),fn:'住所',fv:'',starred:false,children:[]},
        {fid:STORE.uid(),fn:'爱好',fv:'',starred:false,children:[]}
      ],archived:false,created:Date.now()};
    }else{
      c=JSON.parse(JSON.stringify(STORE.c(this.currentCharId)));
    }
    self.editFields=[];
    c.fields.forEach(function(f){
      self.editFields.push({type:'parent',fid:f.fid,fn:f.fn,fv:f.fv,starred:!!f.starred,parentId:f.fid});
      (f.children||[]).forEach(function(ch){
        self.editFields.push({type:'child',fid:ch.cid,fn:'',fv:ch.cv,starred:!!ch.starred,parentId:f.fid});
      });
    });

    var hdr=document.createElement('div');hdr.className='hdr';
    hdr.innerHTML='<span style="cursor:pointer;font-size:18px;color:var(--muted);" onclick="UI.goBack()">← 返回</span><span style="font-weight:700;">'+(isNew?'创建角色':'编辑角色')+'</span><span class="btn-sm primary" id="save-char-btn">💾 保存</span>';
    self.app.appendChild(hdr);

    var body=document.createElement('div');body.className='body-scroll';
    body.innerHTML='<div style="text-align:center;padding:12px;"><div style="font-size:48px;cursor:pointer;" id="edit-avatar">'+c.avatar+'</div><div style="font-size:10px;color:var(--muted);">点击更换立绘</div></div>';
    body.innerHTML+='<div class="edit-field"><span class="edit-label">名称</span><input class="edit-input" id="edit-name" value="'+c.name+'" placeholder="角色名称"></div>';
    body.innerHTML+='<div class="edit-field"><span class="edit-label">性别</span><div class="gender-group">';
    ['M','F','?'].forEach(function(g){
      body.innerHTML+='<span class="gender-opt'+(c.gender===g?' active':'')+'" data-g="'+g+'" onclick="this.parentNode.querySelectorAll(\'.gender-opt\').forEach(function(x){x.classList.remove(\'active\')});this.classList.add(\'active\')">'+STORE.gdLabel(g)+'</span>';
    });
    body.innerHTML+='</div></div>';

    // Age input (replaces birthday)
    body.innerHTML+='<div class="edit-field"><span class="edit-label">年龄</span><input class="edit-input" type="number" id="edit-age" value="'+(c.age||'')+'" placeholder="输入年龄" min="0" max="150"></div>';

    body.innerHTML+='<div style="font-size:10px;color:var(--muted);padding:8px 0;">── 字段列表（⭐特别关心 · ⋮移动 · ＋子行）──</div>';
    body.innerHTML+='<div id="edit-fields-container"></div>';
    body.innerHTML+='<div style="padding:8px 0;"><span class="btn-sm" style="display:block;text-align:center;border-style:dashed;" id="add-field-btn">+ 添加字段</span></div>';
    if(!isNew){
      body.innerHTML+='<div style="padding:16px 0;text-align:center;"><span class="btn-sm danger" id="archive-btn">'+(c.archived?'恢复此角色卡':'归档此角色卡')+'</span></div>';
    }
    self.app.appendChild(body);
    self.renderEditFields();

    document.getElementById('edit-avatar').onclick=function(){
      var owned=STORE.data.user.ownedAvatars;
      var h='<div class="shop-grid">';
      AVATARS.forEach(function(a){
        var isOwned=owned.indexOf(a.id)>-1;
        h+='<div class="shop-item" onclick="document.getElementById(\'edit-avatar\').textContent=\''+a.emoji+'\';document.querySelector(\'.modal-mask\').remove();"><div class="shop-emoji">'+a.emoji+'</div><div class="shop-name">'+a.name+'</div><div style="font-size:10px;color:var(--muted);">'+(isOwned?'已拥有':'需购买')+'</div></div>';
      });
      h+='</div>';
      self.showModal('选择立绘',h);
    };
    document.getElementById('add-field-btn').onclick=function(){self.showFieldPicker();};
    document.getElementById('save-char-btn').onclick=function(){
      var name=document.getElementById('edit-name').value.trim();
      if(!name){self.toast('请输入角色名称');return;}
      c.name=name;
      c.avatar=document.getElementById('edit-avatar').textContent;
      var gEl=body.querySelector('.gender-opt.active');
      if(gEl)c.gender=gEl.getAttribute('data-g');
      c.age=parseInt(document.getElementById('edit-age').value)||0;
      c.fields=self.packEditFields();
      if(isNew){c.id=STORE.uid();STORE.data.chars.push(c);}
      else{var idx=STORE.data.chars.findIndex(function(x){return x.id===c.id;});if(idx>-1)STORE.data.chars[idx]=c;}
      STORE.save();self.checkDailyBadge();self.toast('保存成功');
      self.currentCharId=c.id;self.page='character-detail';self.render();
    };
    if(!isNew){
      document.getElementById('archive-btn').onclick=function(){
        var msg=c.archived?'确定恢复角色卡「'+c.name+'」？':'确定归档角色卡「'+c.name+'」？归档后从列表隐藏。';
        self.confirm(c.archived?'恢复角色':'归档角色',msg,function(){
          var idx=STORE.data.chars.findIndex(function(x){return x.id===c.id;});
          if(idx>-1){STORE.data.chars[idx].archived=!c.archived;STORE.save();}
          UI.toast(c.archived?'已恢复':'已归档');UI.page='characters';UI.render();
        });
      };
    }
  },

  renderEditFields:function(){
    var container=document.getElementById('edit-fields-container');
    if(!container)return;container.innerHTML='';
    var self=this;
    self.editFields.forEach(function(row,i){
      var div=document.createElement('div');div.className='edit-field'+(row.type==='child'?' child':'');
      var starBtn='<span class="edit-star'+(row.starred?' active':'')+'" data-idx="'+i+'">'+(row.starred?'⭐':'☆')+'</span>';
      var moveBtn='<span class="edit-move" data-idx="'+i+'">⋮</span>';
      var addChildBtn=row.type==='parent'?'<span class="edit-addchild" data-idx="'+i+'">＋</span>':'';
      if(row.type==='parent'){
        div.innerHTML=starBtn+'<input class="edit-input" style="max-width:80px;" value="'+row.fn+'" data-idx="'+i+'" data-field="fn" placeholder="字段名"><input class="edit-input" value="'+row.fv+'" data-idx="'+i+'" data-field="fv" placeholder="字段值"><span class="edit-mention" data-idx="'+i+'">@</span>'+addChildBtn+moveBtn+'<span class="edit-del" data-idx="'+i+'">×</span>';
      }else{
        div.innerHTML=starBtn+'<input class="edit-input" value="'+row.fv+'" data-idx="'+i+'" data-field="fv" placeholder="子行内容"><span class="edit-mention" data-idx="'+i+'">@</span>'+moveBtn+'<span class="edit-del" data-idx="'+i+'">×</span>';
      }
      container.appendChild(div);
    });
    container.querySelectorAll('.edit-star').forEach(function(el){el.onclick=function(){var i=parseInt(this.getAttribute('data-idx'));self.editFields[i].starred=!self.editFields[i].starred;self.renderEditFields();};});

    container.querySelectorAll('.edit-addchild').forEach(function(el){el.onclick=function(){var i=parseInt(this.getAttribute('data-idx'));var parentFid=self.editFields[i].fid;self.editFields.splice(i+1,0,{type:'child',fid:STORE.uid(),fn:'',fv:'',starred:false,parentId:parentFid});self.renderEditFields();};});

    container.querySelectorAll('.edit-mention').forEach(function(el){el.onclick=function(e){e.stopPropagation();var i=parseInt(this.getAttribute('data-idx'));self.showCharPicker(function(cid){var inp=container.querySelector('input[data-idx="'+i+'"][data-field="fv"]');if(inp){inp.value+='@'+STORE.aName(cid);self.editFields[i].fv=inp.value;}});};});

  packEditFields:function(){

    this.editFields.forEach(function(row){
      if(row.type==='parent'){fields.push({fid:row.fid,fn:row.fn,fv:row.fv,starred:!!row.starred,children:[]});}
      else{if(!childrenMap[row.parentId])childrenMap[row.parentId]=[];childrenMap[row.parentId].push({cid:row.fid,cv:row.fv,starred:!!row.starred});}
    });
    fields.forEach(function(f){f.children=childrenMap[f.fid]||[];});
    return fields;
  },

  showMoveMenu:function(idx){
    var self=this;var row=this.editFields[idx];if(!row)return;
    var isChild=row.type==='child';var parentId=row.parentId;var rows=this.editFields;
    var disabled={top:false,up:false,down:false,bottom:false};
    if(isChild){
      var gs=-1,ge=-1;
      for(var i=0;i<rows.length;i++){if(rows[i].type==='parent'&&rows[i].fid===parentId){gs=i;ge=i;}else if(rows[i].type==='child'&&rows[i].parentId===parentId){ge=i;}}
      disabled.down=(idx===ge);disabled.bottom=(idx===ge);
    }else{
      var groups=this.getParentGroups(rows);var groupIdx=-1;
      for(var g=0;g<groups.length;g++){if(groups[g].start<=idx&&idx<=groups[g].end){groupIdx=g;break;}}
      disabled.top=(groupIdx===0);disabled.up=(groupIdx===0);disabled.down=(groupIdx===groups.length-1);disabled.bottom=(groupIdx===groups.length-1);
    }
    var h='<div class="move-menu-item'+(disabled.top?' disabled':'')+'" id="mv-top"><span class="ico">⤒</span> 移到顶部</div>';
    h+='<div class="move-menu-item'+(disabled.up?' disabled':'')+'" id="mv-up"><span class="ico">↑</span> 上移一行</div>';
    h+='<div class="move-menu-item'+(disabled.down?' disabled':'')+'" id="mv-down"><span class="ico">↓</span> 下移一行</div>';
    h+='<div class="move-menu-item'+(disabled.bottom?' disabled':'')+'" id="mv-bottom"><span class="ico">⤓</span> 移到底部</div>';
    var mask=this.showModal('移动'+(isChild?'子行':'字段'),h);
    if(!disabled.top)mask.querySelector('#mv-top').onclick=function(){mask.remove();self.moveField(idx,'top');};
    if(!disabled.up)mask.querySelector('#mv-up').onclick=function(){mask.remove();self.moveField(idx,'up');};
    if(!disabled.down)mask.querySelector('#mv-down').onclick=function(){mask.remove();self.moveField(idx,'down');};
    if(!disabled.bottom)mask.querySelector('#mv-bottom').onclick=function(){mask.remove();self.moveField(idx,'bottom');};
  },

  getParentGroups:function(rows){var groups=[];var cur=null;for(var i=0;i<rows.length;i++){if(rows[i].type==='parent'){if(cur)groups.push(cur);cur={start:i,end:i,pid:rows[i].fid};}else{if(cur)cur.end=i;}}if(cur)groups.push(cur);return groups;},

  moveField:function(idx,dir){
    var rows=this.editFields;var row=rows[idx];var isChild=row.type==='child';var parentId=row.parentId;
    if(isChild){
      var gs=-1,ge=-1;
      for(var i=0;i<rows.length;i++){if(rows[i].type==='parent'&&rows[i].fid===parentId){gs=i;ge=i;}else if(rows[i].type==='child'&&rows[i].parentId===parentId){ge=i;}}
      if(dir==='top'){if(idx===gs+1){this.swapParentChild(gs,idx);}else{var d=rows.splice(idx,1)[0];rows.splice(gs+1,0,d);}}
      else if(dir==='up'){var prev=rows[idx-1];if(prev&&prev.type==='parent'&&prev.fid===parentId){this.swapParentChild(idx-1,idx);}else{var tmp=rows[idx];rows[idx]=rows[idx-1];rows[idx-1]=tmp;}}
      else if(dir==='down'){var tmp2=rows[idx];rows[idx]=rows[idx+1];rows[idx+1]=tmp2;}
      else if(dir==='bottom'){if(idx===ge)return;var d2=rows.splice(idx,1)[0];rows.splice(ge,0,d2);}
    }else{
      var groups=this.getParentGroups(rows);var groupIdx=-1;
      for(var g=0;g<groups.length;g++){if(groups[g].start<=idx&&idx<=groups[g].end){groupIdx=g;break;}}
      var grp=groups[groupIdx];var groupLen=grp.end-grp.start+1;
      if(dir==='top'){if(groupIdx<=0)return;var dg=rows.splice(grp.start,groupLen);for(var k=dg.length-1;k>=0;k--)rows.unshift(dg[k]);}
      else if(dir==='up'){if(groupIdx<=0)return;var prevGrp=groups[groupIdx-1];var dg2=rows.splice(grp.start,groupLen);for(var k2=0;k2<dg2.length;k2++)rows.splice(prevGrp.start+k2,0,dg2[k2]);}
      else if(dir==='down'){if(groupIdx>=groups.length-1)return;var nextGrp=groups[groupIdx+1];var nextLen=nextGrp.end-nextGrp.start+1;var ng=rows.splice(nextGrp.start,nextLen);for(var k3=0;k3<ng.length;k3++)rows.splice(grp.start+k3,0,ng[k3]);}
      else if(dir==='bottom'){if(groupIdx>=groups.length-1)return;var dg3=rows.splice(grp.start,groupLen);for(var k4=0;k4<dg3.length;k4++)rows.push(dg3[k4]);}
    }
    this.renderEditFields();
  },

  swapParentChild:function(parentIdx,childIdx){
    var rows=this.editFields;var oldParent=rows[parentIdx];var child=rows[childIdx];
    var oldFn=oldParent.fn;var parentId=oldParent.fid;var newParentId=child.fid;
    oldParent.type='child';oldParent.parentId=newParentId;oldParent.fn='';
    child.type='parent';child.parentId=newParentId;child.fn=oldFn;
    rows.forEach(function(r){if(r.type==='child'&&r.parentId===parentId&&r!==oldParent){r.parentId=newParentId;}});
    rows[parentIdx]=child;rows[childIdx]=oldParent;
  },

  // ═══ TASK LIST ═══
  renderTaskList:function(){
    var self=this;
    var tasks=STORE.data.tasks.slice();
    // Filter by search
    if(self.search){
      var q=self.search.toLowerCase();
      tasks=tasks.filter(function(t){
        if(t.name.toLowerCase().indexOf(q)>-1)return true;
        if(t.desc&&t.desc.toLowerCase().indexOf(q)>-1)return true;
        if(t.subs)return t.subs.some(function(s){return s.desc&&s.desc.toLowerCase().indexOf(q)>-1;});
        return false;
      });
    }
    // Filter by icon
    if(self.iconFilter){tasks=tasks.filter(function(t){return t.icon===self.iconFilter;});}
    // Filter by character
    if(self.charFilter){tasks=tasks.filter(function(t){return t.dispatched.indexOf(self.charFilter)>-1;});}
    // Sort
    tasks.sort(function(a,b){return self.sortOrder==='desc'?new Date(b.date)-new Date(a.date):new Date(a.date)-new Date(b.date);});

    var hdr=document.createElement('div');hdr.className='hdr';
    hdr.innerHTML='<div><div class="hdr-title">任务</div><div class="hdr-sub">征途记录 ('+tasks.length+')</div></div><div class="hdr-right"><span class="badge-pill">✦ '+STORE.data.user.badges+'</span></div>';
    self.app.appendChild(hdr);

    var body=document.createElement('div');body.className='body-scroll';
    // Search (full width)
    var inp=document.createElement('input');inp.className='search-input';inp.placeholder='搜索任务';inp.value=self.search;
    inp.oninput=function(){self.search=this.value;self.render();};
    body.appendChild(inp);
    // Filter bar
    var fbar=document.createElement('div');fbar.className='filter-bar';
    fbar.innerHTML='<span class="filter-btn'+(self.iconFilter?' active':'')+'" id="icon-filter-btn">'+(self.iconFilter||'图标')+'</span>';
    fbar.innerHTML+='<span class="filter-btn'+(self.charFilter?' active':'')+'" id="char-filter-btn">'+(self.charFilterName||'角色')+'</span>';
    fbar.innerHTML+='<span class="filter-btn" id="sort-btn">'+(self.sortOrder==='desc'?'时间↓':'时间↑')+'</span>';
    body.appendChild(fbar);
    // Active filter tags
    if(self.iconFilter||self.charFilter){
      var tags=document.createElement('div');tags.className='filter-tags';
      if(self.iconFilter)tags.innerHTML+='<span class="filter-tag" id="rm-icon-filter">'+self.iconFilter+' ×</span>';
      if(self.charFilter)tags.innerHTML+='<span class="filter-tag" id="rm-char-filter">'+self.charFilterName+' ×</span>';
      body.appendChild(tags);
    }
    // Task cards
    if(tasks.length===0){
      body.innerHTML+='<div class="empty-state"><div class="empty-ico">⚔️</div>暂无征途记录。<br>点击下方按钮创建新任务吧。</div>';
    }else{
      tasks.forEach(function(t){
        var card=document.createElement('div');card.className='card';card.onclick=function(){self.goTask(t.id);};
        card.innerHTML='<div class="card-avatar" style="background:#fdf3e0;">'+t.icon+'</div><div class="card-info"><div class="card-name">'+t.name+'</div><div class="card-meta">'+STORE.fmtDate(t.date)+' · 派遣'+t.dispatched.length+'人</div></div>';
        body.appendChild(card);
      });
    }
    var fab=document.createElement('button');fab.className='fab';fab.textContent='＋ 创建任务';
    fab.onclick=function(){self.currentTaskId=null;self.page='task-edit';self.render();};
    body.appendChild(fab);
    self.app.appendChild(body);

    document.getElementById('icon-filter-btn').onclick=function(){self.showIconPicker();};
    document.getElementById('char-filter-btn').onclick=function(){self.showTaskCharPicker();};
    document.getElementById('sort-btn').onclick=function(){self.sortOrder=self.sortOrder==='desc'?'asc':'desc';self.render();};
    var rmIcon=document.getElementById('rm-icon-filter');if(rmIcon)rmIcon.onclick=function(){self.iconFilter='';self.render();};
    var rmChar=document.getElementById('rm-char-filter');if(rmChar)rmChar.onclick=function(){self.charFilter='';self.charFilterName='';self.render();};

    document.getElementById('add-dispatched-btn').onclick=function(){self.showCharPicker(function(cid){if(t.dispatched.indexOf(cid)===-1){t.dispatched.push(cid);self.renderEditDispatched();}});};
    document.getElementById('mention-desc').onclick=function(){self.showCharPicker(function(cid){var inp=document.getElementById('edit-task-desc');inp.value+='@'+STORE.aName(cid);t.desc=inp.value;});};
    document.getElementById('add-sub-btn').onclick=function(){t.subs.push({sid:STORE.uid(),desc:''});self.renderEditSubs();};
    document.getElementById('cancel-task-btn').onclick=function(){self.goBack();};
    document.getElementById('save-task-btn').onclick=function(){
      var name=document.getElementById('edit-task-name').value.trim();
      if(!name){self.toast('请输入任务名称');return;}
      t.name=name;t.icon=document.getElementById('edit-task-icon').textContent;
      t.date=document.getElementById('edit-task-date').value;
      t.desc=document.getElementById('edit-task-desc').value;
      // Collect sub descriptions from DOM
      var subInputs=body.querySelectorAll('input[data-sfield="desc"]');
      subInputs.forEach(function(inp){var i=parseInt(inp.getAttribute('data-sidx'));if(t.subs[i])t.subs[i].desc=inp.value;});
      t.subs=t.subs.filter(function(s){return s.desc.trim();});
      if(isNew){t.id=STORE.uid();STORE.data.tasks.push(t);}
      else{var idx=STORE.data.tasks.findIndex(function(x){return x.id===t.id;});if(idx>-1)STORE.data.tasks[idx]=t;}
      STORE.save();self.checkDailyBadge();self.toast('保存成功');
      self.currentTaskId=t.id;self.page='task-detail';self.render();
    };
  },

  showTaskIconPicker:function(){
    var self=this;
    var h='<div class="icon-grid">';
    TASK_ICONS.forEach(function(ico){h+='<div class="icon-opt'+(self.taskEditData.icon===ico?' selected':'')+'" data-icon="'+ico+'">'+ico+'</div>';});
    h+='</div>';
    var mask=this.showModal('选择图标',h);
    mask.querySelectorAll('.icon-opt').forEach(function(el){
      el.onclick=function(){var ico=this.getAttribute('data-icon');document.getElementById('edit-task-icon').textContent=ico;self.taskEditData.icon=ico;mask.remove();};
    });
  },

  renderEditDispatched:function(){
    var container=document.getElementById('edit-dispatched');
    if(!container)return;container.innerHTML='';
    var self=this;var t=this.taskEditData;
    t.dispatched.forEach(function(did,i){
      var chip=document.createElement('span');chip.className='dispatch-chip';
      chip.innerHTML=STORE.aEmoji(did)+' '+STORE.aName(did)+'<span class="r" data-idx="'+i+'">×</span>';
      container.appendChild(chip);
    });
    container.querySelectorAll('.r').forEach(function(el){el.onclick=function(){t.dispatched.splice(parseInt(this.getAttribute('data-idx')),1);self.renderEditDispatched();};});
  },

  renderEditSubs:function(){
    var container=document.getElementById('edit-subs-container');
    if(!container)return;container.innerHTML='';
    var self=this;var t=this.taskEditData;
    t.subs.forEach(function(s,i){
      var row=document.createElement('div');row.className='edit-field';
      row.innerHTML='<input class="edit-input" value="'+(s.desc||'')+'" data-sidx="'+i+'" data-sfield="desc" placeholder="细则描述"><span class="edit-mention" data-sidx="'+i+'">@</span><span class="edit-del" data-sidx="'+i+'">×</span><span class="edit-move" data-sidx="'+i+'">⋮</span>';
      container.appendChild(row);
    });
    container.querySelectorAll('.edit-del').forEach(function(el){el.onclick=function(){var i=parseInt(this.getAttribute('data-sidx'));t.subs.splice(i,1);self.renderEditSubs();};});
    container.querySelectorAll('.edit-mention').forEach(function(el){el.onclick=function(){var i=parseInt(this.getAttribute('data-sidx'));self.showCharPicker(function(cid){var inp=container.querySelector('input[data-sidx="'+i+'"]');if(inp){inp.value+='@'+STORE.aName(cid);}});};});
    container.querySelectorAll('.edit-move').forEach(function(el){el.onclick=function(){var i=parseInt(this.getAttribute('data-sidx'));self.showSubMoveMenu(i);};});
  },

  showSubMoveMenu:function(idx){
    var self=this;var subs=this.taskEditData.subs;
    var disabled={top:(idx===0),up:(idx===0),down:(idx===subs.length-1),bottom:(idx===subs.length-1)};
    var h='<div class="move-menu-item'+(disabled.top?' disabled':'')+'" id="sub-mv-top"><span class="ico">⤒</span> 移至顶部</div>';
    h+='<div class="move-menu-item'+(disabled.up?' disabled':'')+'" id="sub-mv-up"><span class="ico">↑</span> 移至上一行</div>';
    h+='<div class="move-menu-item'+(disabled.down?' disabled':'')+'" id="sub-mv-down"><span class="ico">↓</span> 移至下一行</div>';
    h+='<div class="move-menu-item'+(disabled.bottom?' disabled':'')+'" id="sub-mv-bottom"><span class="ico">⤓</span> 移至底部</div>';
    var mask=this.showModal('移动细则',h);
    if(!disabled.top)mask.querySelector('#sub-mv-top').onclick=function(){mask.remove();var d=subs.splice(idx,1)[0];subs.unshift(d);self.renderEditSubs();};
    if(!disabled.up)mask.querySelector('#sub-mv-up').onclick=function(){mask.remove();var tmp=subs[idx];subs[idx]=subs[idx-1];subs[idx-1]=tmp;self.renderEditSubs();};
    if(!disabled.down)mask.querySelector('#sub-mv-down').onclick=function(){mask.remove();var tmp=subs[idx];subs[idx]=subs[idx+1];subs[idx+1]=tmp;self.renderEditSubs();};
    if(!disabled.bottom)mask.querySelector('#sub-mv-bottom').onclick=function(){mask.remove();var d=subs.splice(idx,1)[0];subs.push(d);self.renderEditSubs();};
  },

  // ═══ BACKPACK ═══
  renderBackpack:function(){
    var self=this;var user=STORE.data.user;
    var hdr=document.createElement('div');hdr.className='hdr';
    hdr.innerHTML='<div style="display:flex;align-items:center;gap:6px;"><svg width="16" height="16" viewBox="0 0 64 64"><path d="M22 22 L42 22 L40 16 L24 16 Z" fill="#b8861f" opacity="0.85"/><path d="M20 24 C20 22 44 22 44 24 L46 46 C46 52 18 52 18 46 Z" fill="#d4a13a"/><circle cx="32" cy="40" r="3.2" fill="#fbf2dd" opacity="0.85"/><text x="32" y="43" text-anchor="middle" font-size="5" fill="#b8861f" font-family="serif">✦</text></svg><span class="hdr-title">行囊</span></div>';
    self.app.appendChild(hdr);
    var body=document.createElement('div');body.className='body-scroll';
    body.innerHTML='<div class="hero-card">'+
      '<svg width="48" height="48" viewBox="0 0 64 64" style="display:block;margin:0 auto 8px;"><path d="M22 22 L42 22 L40 16 L24 16 Z" fill="#b8861f" opacity="0.85"/><path d="M20 24 C20 22 44 22 44 24 L46 46 C46 52 18 52 18 46 Z" fill="#d4a13a"/><circle cx="32" cy="40" r="3.2" fill="#fbf2dd" opacity="0.85"/><text x="32" y="43" text-anchor="middle" font-size="5" fill="#b8861f" font-family="serif">✦</text></svg>'+
      '<div class="hero-label">冒险者徽记</div><div class="hero-num">'+user.badges+'</div>'+
      '<div class="hero-status" id="badge-status-text">'+(user.hasEarnedToday?'今日已领取 ✓':'今日未领取 ○ (点击模拟)')+'</div>'+
      '<div style="font-size:10px;color:var(--muted);">累计获得: '+user.totalEarned+' · 持有立绘: '+user.ownedAvatars.length+'款</div></div>';
    body.innerHTML+='<div class="section-label">珍藏与交易</div>';
    body.innerHTML+='<div class="menu-item" onclick="UI.page=\'gallery\';UI.render()"><span>🎨</span> 立绘珍藏馆 <span class="arrow">›</span></div>';
    body.innerHTML+='<div class="menu-item" onclick="UI.page=\'shop\';UI.render()"><span>🛒</span> 商店 <span class="arrow">›</span></div>';
    body.innerHTML+='<div class="menu-item" onclick="UI.toast(\'功能建设中，敬请期待\')"><span>💎</span> 充值 <span style="margin-left:auto;color:var(--muted);font-size:10px;">占位</span></div>';
    body.innerHTML+='<div class="menu-item" onclick="UI.toast(\'功能建设中，敬请期待\')"><span>🏆</span> 成就 <span style="margin-left:auto;color:var(--muted);font-size:10px;">占位</span></div>';
    body.innerHTML+='<div class="section-label">工具</div>';
    body.innerHTML+='<div class="menu-item" onclick="UI.toast(\'功能建设中，敬请期待\')"><span>📋</span> 字段模板管理 <span style="margin-left:auto;color:var(--muted);font-size:10px;">占位</span></div>';
    body.innerHTML+='<div class="menu-item" onclick="UI.showAbout()"><span>ℹ️</span> 关于本作 <span class="arrow">›</span></div>';
    self.app.appendChild(body);
    document.getElementById('badge-status-text').onclick=function(){
      if(user.hasEarnedToday){user.hasEarnedToday=false;user.badges=Math.max(0,user.badges-1);STORE.save();self.render();}
      else{user.hasEarnedToday=true;user.badges+=1;user.totalEarned+=1;user.lastBadgeDate=STORE.today();STORE.save();self.toast('✦ +1 徽记！');self.render();}
    };
  },

  showAbout:function(){
    this.showModal('关于本作','<div style="text-align:center;padding:12px;"><p style="line-height:2;">欢迎来到冒险者公会。你是一位记录官，用羊皮卷宗记录下与你相遇的每一位冒险者，以及你们共同经历的每一场征途。这里的征途并非屠龙夺宝，而是生命中真实的相遇与同行。</p><p style="font-size:11px;color:var(--muted);margin-top:12px;">冒险者手札 v3.0 · 可体验Demo<br>由TRAE AI辅助开发</p></div>');
  },

  // ═══ SHOP ═══
  renderShop:function(){
    var self=this;var user=STORE.data.user;
    var hdr=document.createElement('div');hdr.className='hdr';
    hdr.innerHTML='<span style="cursor:pointer;font-size:18px;color:var(--muted);" onclick="UI.goBack()">← 返回</span><div><span class="hdr-title">商店</span><div class="hdr-sub">我的徽记: '+user.badges+'</div></div>';
    self.app.appendChild(hdr);
    var body=document.createElement('div');body.className='body-scroll';
    body.innerHTML='<div class="shop-grid">';
    AVATARS.filter(function(a){return a.category==='premium';}).forEach(function(a){
      var owned=user.ownedAvatars.indexOf(a.id)>-1;var canBuy=!owned&&user.badges>=a.price;
      body.innerHTML+='<div class="shop-item"><div class="shop-emoji">'+a.emoji+'</div><div class="shop-name">'+a.name+'</div><div class="shop-price">'+a.price+' ✦</div><button class="shop-btn'+(owned?' owned':(!canBuy?' locked':''))+'" data-aid="'+a.id+'">'+(owned?'已拥有':'购买')+'</button></div>';
    });
    body.innerHTML+='</div>';
    self.app.appendChild(body);
    body.querySelectorAll('.shop-btn:not(.owned):not(.locked)').forEach(function(btn){
      btn.onclick=function(){
        var aid=this.getAttribute('data-aid');var a=AVATARS.find(function(x){return x.id===aid;});
        self.confirm('购买立绘','确定花费 '+a.price+' ✦ 购买「'+a.name+'」吗？',function(){
          if(STORE.data.user.badges>=a.price&&STORE.data.user.ownedAvatars.indexOf(aid)===-1){
            STORE.data.user.badges-=a.price;STORE.data.user.ownedAvatars.push(aid);STORE.save();UI.toast('购买成功！');UI.render();
          }
        });
      };
    });
  },

  // ═══ GALLERY ═══
  renderGallery:function(){
    var self=this;var user=STORE.data.user;
    var hdr=document.createElement('div');hdr.className='hdr';
    hdr.innerHTML='<span style="cursor:pointer;font-size:18px;color:var(--muted);" onclick="UI.goBack()">← 返回</span><span class="hdr-title">立绘珍藏馆</span>';
    self.app.appendChild(hdr);
    var body=document.createElement('div');body.className='body-scroll';
    body.innerHTML='<div class="shop-grid">';
    AVATARS.forEach(function(a){
      var owned=user.ownedAvatars.indexOf(a.id)>-1;
      body.innerHTML+='<div class="shop-item'+(owned?'':' grayed')+'"><div class="shop-emoji">'+a.emoji+'</div><div class="shop-name">'+a.name+'</div><div style="font-size:10px;color:var(--muted);">'+(owned?'已拥有':a.category==='free'?'初始赠礼':'需购买')+'</div></div>';
    });
    body.innerHTML+='</div>';
    if(user.ownedAvatars.length<AVATARS.length){body.innerHTML+='<button class="fab" style="margin-top:12px;" onclick="UI.page=\'shop\';UI.render()">🛒 前往商店购买更多立绘</button>';}
    self.app.appendChild(body);
  },

  // ═══ DAILY BADGE ═══
  checkDailyBadge:function(){
    var user=STORE.data.user;var today=STORE.today();
    if(!user.hasEarnedToday||user.lastBadgeDate!==today){
      user.hasEarnedToday=true;user.badges+=1;user.totalEarned+=1;user.lastBadgeDate=today;STORE.save();
      this.toast('✦ +1 徽记！每日行为奖励');
    }
  }
};

UI.render();
</script>
</body>
</html>
