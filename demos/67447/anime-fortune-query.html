<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动漫运势查询</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #ff6b9d;
            --primary-dark: #e8457a;
            --accent: #c084fc;
            --bg-dark: #1a1025;
            --bg-card: #2a1f3d;
            --bg-card-hover: #352850;
            --text: #f0e6ff;
            --text-dim: #9b8ab8;
            --gold: #ffd700;
            --star-fill: #ffcc00;
            --star-empty: #4a3a5e;
            --radius: 16px;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 背景粒子 ===== */
        .bg-particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .bg-particles span {
            position: absolute;
            font-size: 20px;
            animation: floatUp linear infinite;
            opacity: 0.15;
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.15; }
            90% { opacity: 0.15; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* ===== 通用 ===== */
        .page { display: none; position: relative; z-index: 1; min-height: 100vh; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .page-inner { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 12px 28px; border: none; border-radius: 30px; font-size: 16px;
            font-weight: 600; cursor: pointer; transition: all 0.25s ease; color: #fff;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,157,0.4); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: #fff; }
        .btn-sm { padding: 8px 18px; font-size: 13px; }

        /* ===== 首页 ===== */
        .home-header { text-align: center; padding: 60px 0 30px; }
        .home-header .logo { font-size: 64px; margin-bottom: 12px; }
        .home-header h1 {
            font-size: 28px; font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .home-header p { color: var(--text-dim); margin-top: 8px; font-size: 14px; }

        .date-banner {
            text-align: center; background: var(--bg-card); border-radius: var(--radius);
            padding: 14px; margin-bottom: 24px; font-size: 15px; color: var(--text-dim);
        }
        .date-banner strong { color: var(--gold); }

        /* 角色选择 */
        .section-label {
            font-size: 16px; font-weight: 600; margin-bottom: 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .section-label::before {
            content: ''; display: inline-block; width: 4px; height: 18px;
            background: var(--primary); border-radius: 2px;
        }

        .char-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px;
        }
        .char-card {
            background: var(--bg-card); border-radius: 14px; padding: 14px 6px;
            text-align: center; cursor: pointer; transition: all 0.25s ease;
            border: 2px solid transparent;
        }
        .char-card:hover { background: var(--bg-card-hover); transform: translateY(-3px); }
        .char-card.selected { border-color: var(--primary); box-shadow: 0 0 16px rgba(255,107,157,0.3); }
        .char-card .avatar { font-size: 36px; margin-bottom: 6px; }
        .char-card .name { font-size: 12px; color: var(--text-dim); }
        .char-card.selected .name { color: var(--primary); font-weight: 600; }

        .home-actions { text-align: center; padding: 10px 0; }

        /* 历史记录 */
        .history-section { margin-top: 28px; }
        .history-list { display: flex; flex-direction: column; gap: 8px; }
        .history-item {
            display: flex; align-items: center; gap: 12px;
            background: var(--bg-card); border-radius: 12px; padding: 12px 16px;
            cursor: pointer; transition: all 0.2s;
        }
        .history-item:hover { background: var(--bg-card-hover); }
        .history-item .hi-avatar { font-size: 28px; }
        .history-item .hi-info { flex: 1; }
        .history-item .hi-name { font-size: 14px; font-weight: 500; }
        .history-item .hi-date { font-size: 11px; color: var(--text-dim); }
        .history-item .hi-score { font-size: 14px; font-weight: 700; color: var(--gold); }

        .empty-hint { text-align: center; color: var(--text-dim); font-size: 13px; padding: 20px 0; }

        /* ===== 运势结果页 ===== */
        .result-header { text-align: center; padding: 40px 0 20px; }
        .result-avatar { font-size: 72px; margin-bottom: 8px; animation: bounceIn 0.6s ease; }
        @keyframes bounceIn {
            0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); }
        }
        .result-char-name { font-size: 22px; font-weight: 700; }
        .result-date { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

        .fortune-score-ring {
            width: 140px; height: 140px; margin: 20px auto; position: relative;
        }
        .fortune-score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .fortune-score-ring .track { fill: none; stroke: var(--star-empty); stroke-width: 8; }
        .fortune-score-ring .progress {
            fill: none; stroke: url(#scoreGrad); stroke-width: 8;
            stroke-linecap: round; transition: stroke-dashoffset 1.2s ease;
        }
        .fortune-score-ring .score-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 36px; font-weight: 800; color: var(--gold);
        }
        .fortune-score-ring .score-label {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, calc(-50% + 28px));
            font-size: 12px; color: var(--text-dim);
        }

        /* 运势维度 */
        .fortune-dims { display: flex; flex-direction: column; gap: 12px; margin: 24px 0; }
        .dim-row {
            background: var(--bg-card); border-radius: 12px; padding: 14px 16px;
            display: flex; align-items: center; gap: 12px;
        }
        .dim-icon { font-size: 22px; width: 32px; text-align: center; }
        .dim-name { font-size: 14px; width: 56px; flex-shrink: 0; }
        .dim-stars { flex: 1; display: flex; gap: 3px; }
        .dim-star { font-size: 16px; color: var(--star-empty); }
        .dim-star.filled { color: var(--star-fill); }
        .dim-score { font-size: 14px; font-weight: 600; width: 30px; text-align: right; color: var(--gold); }

        /* 幸运元素 */
        .lucky-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 24px 0; }
        .lucky-item {
            background: var(--bg-card); border-radius: 12px; padding: 16px 10px; text-align: center;
        }
        .lucky-item .li-icon { font-size: 24px; margin-bottom: 6px; }
        .lucky-item .li-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
        .lucky-item .li-value { font-size: 14px; font-weight: 600; }

        /* 运势详解 */
        .fortune-detail {
            background: var(--bg-card); border-radius: var(--radius); padding: 20px; margin: 20px 0;
        }
        .fortune-detail h3 { font-size: 15px; margin-bottom: 10px; color: var(--primary); }
        .fortune-detail p { font-size: 14px; line-height: 1.8; color: var(--text-dim); }

        /* 每日一言 */
        .daily-quote {
            text-align: center; padding: 20px; margin: 16px 0;
            border-top: 1px solid rgba(255,255,255,0.06); border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .daily-quote .quote-text { font-size: 15px; font-style: italic; line-height: 1.7; margin-bottom: 8px; }
        .daily-quote .quote-from { font-size: 12px; color: var(--text-dim); }

        .result-actions { display: flex; gap: 12px; justify-content: center; margin-top: 24px; }

        /* ===== 分享弹窗 ===== */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-card); border-radius: var(--radius); padding: 28px;
            max-width: 380px; width: 90%; text-align: center;
            animation: fadeIn 0.3s ease;
        }
        .modal h2 { font-size: 18px; margin-bottom: 16px; }
        .share-preview {
            background: var(--bg-dark); border-radius: 12px; padding: 20px;
            margin-bottom: 20px; text-align: left; font-size: 13px; line-height: 1.8;
        }
        .share-preview .sp-title {
            font-size: 16px; font-weight: 700; margin-bottom: 10px; text-align: center;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }

        /* ===== Toast ===== */
        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); color: #333; padding: 10px 24px;
            border-radius: 20px; font-size: 14px; font-weight: 500; z-index: 200;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }

        /* ===== 响应式 ===== */
        @media (max-width: 400px) {
            .char-grid { grid-template-columns: repeat(3, 1fr); }
            .home-header h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

<!-- 背景粒子 -->
<div class="bg-particles" id="particles"></div>

<!-- ============ 首页 ============ -->
<div class="page active" id="pageHome">
    <div class="page-inner">
        <div class="home-header">
            <div class="logo">🔮</div>
            <h1>动漫运势查询</h1>
            <p>选择你喜欢的动漫角色，解锁今日运势</p>
        </div>

        <div class="date-banner" id="dateBanner"></div>

        <div class="section-label">选择动漫角色</div>
        <div class="char-grid" id="charGrid"></div>

        <div class="home-actions">
            <button class="btn btn-primary" id="btnQuery" disabled>开始测算运势</button>
        </div>

        <div class="history-section">
            <div class="section-label">近期记录</div>
            <div class="history-list" id="historyList">
                <div class="empty-hint">还没有测算记录，快去试试吧~</div>
            </div>
        </div>
    </div>
</div>

<!-- ============ 结果页 ============ -->
<div class="page" id="pageResult">
    <div class="page-inner">
        <div class="result-header">
            <div class="result-avatar" id="resAvatar"></div>
            <div class="result-char-name" id="resName"></div>
            <div class="result-date" id="resDate"></div>
        </div>

        <div class="fortune-score-ring">
            <svg viewBox="0 0 120 120">
                <defs>
                    <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="var(--primary)" />
                        <stop offset="100%" stop-color="var(--accent)" />
                    </linearGradient>
                </defs>
                <circle class="track" cx="60" cy="60" r="52" />
                <circle class="progress" id="scoreCircle" cx="60" cy="60" r="52"
                    stroke-dasharray="326.73" stroke-dashoffset="326.73" />
            </svg>
            <div class="score-text" id="scoreText">0</div>
            <div class="score-label">综合运势</div>
        </div>

        <div class="fortune-dims" id="fortuneDims"></div>

        <div class="lucky-grid" id="luckyGrid"></div>

        <div class="fortune-detail" id="fortuneDetail"></div>

        <div class="daily-quote" id="dailyQuote"></div>

        <div class="result-actions">
            <button class="btn btn-outline btn-sm" id="btnShare">分享运势</button>
            <button class="btn btn-primary btn-sm" id="btnBack">重新测算</button>
        </div>
    </div>
</div>

<!-- 分享弹窗 -->
<div class="modal-overlay" id="shareModal">
    <div class="modal">
        <h2>分享今日运势</h2>
        <div class="share-preview" id="sharePreview"></div>
        <div class="modal-actions">
            <button class="btn btn-primary btn-sm" id="btnCopyShare">复制文案</button>
            <button class="btn btn-outline btn-sm" id="btnCloseModal">关闭</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== 数据 =====
const CHARACTERS = [
    { id: 'naruto',    name: '鸣人',   avatar: '🦊', anime: '火影忍者', tag: '热血' },
    { id: 'luffy',     name: '路飞',   avatar: '🏴‍☠️', anime: '海贼王',   tag: '冒险' },
    { id: 'goku',      name: '悟空',   avatar: '🐲', anime: '龙珠',     tag: '战斗' },
    { id: 'sailor',    name: '月野兔', avatar: '🌙', anime: '美少女战士', tag: '魔法' },
    { id: 'conan',     name: '柯南',   avatar: '🔍', anime: '名侦探柯南', tag: '推理' },
    { id: 'eva',       name: '初号机', avatar: '🤖', anime: 'EVA',       tag: '机甲' },
    { id: 'totoro',    name: '龙猫',   avatar: '🐱', anime: '龙猫',     tag: '治愈' },
    { id: 'gintama',   name: '银时',   avatar: '🍓', anime: '银魂',     tag: '搞笑' },
    { id: 'saber',     name: 'Saber',  avatar: '⚔️', anime: 'Fate',      tag: '骑士' },
    { id: 'saitama',   name: '埼玉',   avatar: '👊', anime: '一拳超人',  tag: '无敌' },
    { id: 'levi',      name: '利威尔', avatar: '🗡️', anime: '进击的巨人', tag: '战斗' },
    { id: 'rem',       name: '蕾姆',   avatar: '💙', anime: 'Re:Zero',   tag: '守护' },
];

const DIMS = [
    { key: 'love',     name: '爱情', icon: '💕' },
    { key: 'career',   name: '事业', icon: '💼' },
    { key: 'wealth',   name: '财运', icon: '💰' },
    { key: 'health',   name: '健康', icon: '🌿' },
    { key: 'social',   name: '社交', icon: '🤝' },
];

const LUCKY_COLORS = ['樱花粉', '星空紫', '海洋蓝', '森林绿', '日落橙', '月光银', '蜜桃红', '薄荷青', '金丝黄', '薰衣草紫'];
const LUCKY_DIRS   = ['东方', '南方', '西方', '北方', '东南', '东北', '西南', '西北'];
const LUCKY_NUMS   = Array.from({length: 99}, (_, i) => i + 1);

const QUOTES = [
    { text: '不管前方有多少困难，我都不会退缩！', from: '——漩涡鸣人' },
    { text: '我是要成为海贼王的男人！', from: '——蒙奇·D·路飞' },
    { text: '真相永远只有一个！', from: '——工藤新一' },
    { text: '只要不放弃，就一定能看到希望。', from: '——Saber' },
    { text: '我是正义的伙伴！', from: '——埼玉' },
    { text: '不管什么时候，都不要放弃希望。', from: '——龙猫' },
    { text: '即使世界与我为敌，我也要保护重要的人。', from: '——蕾姆' },
    { text: '只有变强，才能守护想要守护的东西。', from: '——利威尔' },
    { text: '战斗的理由，就是为了不再战斗。', from: '——初号机' },
    { text: '月棱镜威力，变身！', from: '——月野兔' },
];

const FORTUNE_TEXTS = {
    love: {
        high: ['桃花运旺盛，今天可能会遇到让你心动的人哦！', '感情甜蜜升温，和心仪的人会有意想不到的互动。', '魅力值爆表，走到哪里都是人群中的焦点！'],
        mid:  ['感情平稳发展，适合主动表达心意。', '爱情运势中规中矩，珍惜身边的温暖。', '虽然没有大惊喜，但和伴侣相处很舒服。'],
        low:  ['感情上可能遇到小波折，保持耐心即可。', '今天不太适合表白，先沉淀一下心情吧。', '爱情运势偏低，把重心放在自我提升上。'],
    },
    career: {
        high: ['灵感爆发，工作效率极高，上司都会注意到你！', '事业运极佳，适合推进重要项目或做关键决定。', '今天是展现才华的好时机，大胆出击吧！'],
        mid:  ['工作按部就班，适合处理日常事务。', '事业运势平稳，打好基础最重要。', '虽然没有大突破，但稳定的输出也很重要。'],
        low:  ['工作上可能会遇到阻力，注意沟通方式。', '今天不适合做大决定，先观察再行动。', '事业运势偏低，注意保存精力。'],
    },
    wealth: {
        high: ['财运亨通，可能会有意外之财！', '投资眼光精准，适合做理财决策。', '金钱运势旺盛，买东西可能遇到超值优惠！'],
        mid:  ['财运平稳，量入为出即可。', '正常收支平衡，不适合冒险投资。', '理财需谨慎，小有收获。'],
        low:  ['今天容易冲动消费，注意控制开支。', '财运不佳，避免高风险操作。', '花钱需谨慎，先忍忍再说。'],
    },
    health: {
        high: ['精力充沛，适合运动和户外活动！', '身体状态极佳，活力满满！', '健康运势很好，适合挑战自我。'],
        mid:  ['身体状况不错，注意作息规律。', '健康运势平稳，适当运动有益身心。', '没有大问题，多喝水多休息。'],
        low:  ['今天容易疲惫，注意休息。', '健康运势偏低，别熬夜哦。', '身体可能有点小不适，注意保暖。'],
    },
    social: {
        high: ['人缘超好，朋友聚会的焦点就是你！', '社交运势极佳，可能结识有趣的新朋友。', '今天特别适合团建和聚会！'],
        mid:  ['社交运势平稳，和老朋友聊聊天也不错。', '人际关系和谐，适合深度交流。', '社交不用强求，顺其自然就好。'],
        low:  ['今天可能容易产生误解，注意言辞。', '社交运势偏低，独处也挺好的。', '避免争论，保持微笑就对了。'],
    },
};

// ===== 工具函数 =====
function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

function seededRandom(seed) {
    let s = seed;
    return function() {
        s = (s * 9301 + 49297) % 233280;
        return s / 233280;
    };
}

function makeSeed(charId) {
    const d = new Date();
    const dateSeed = d.getFullYear() * 10000 + (d.getMonth()+1) * 100 + d.getDate();
    let charHash = 0;
    for (let i = 0; i < charId.length; i++) charHash = charHash * 31 + charId.charCodeAt(i);
    return dateSeed + charHash;
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

function saveHistory(charId, score) {
    const ch = CHARACTERS.find(c => c.id === charId);
    let list = JSON.parse(localStorage.getItem('afq_history') || '[]');
    list = list.filter(h => h.charId !== charId);
    list.unshift({ charId, name: ch.name, avatar: ch.avatar, score, date: todayStr() });
    if (list.length > 10) list = list.slice(0, 10);
    localStorage.setItem('afq_history', JSON.stringify(list));
}

function loadHistory() {
    return JSON.parse(localStorage.getItem('afq_history') || '[]');
}

// ===== 生成运势 =====
function generateFortune(charId) {
    const seed = makeSeed(charId);
    const rand = seededRandom(seed);

    const dimScores = {};
    DIMS.forEach(d => {
        dimScores[d.key] = Math.floor(rand() * 5) + 1;
    });

    const total = Object.values(dimScores).reduce((a, b) => a + b, 0);
    const score = Math.round((total / (DIMS.length * 5)) * 100);

    const luckyColor = LUCKY_COLORS[Math.floor(rand() * LUCKY_COLORS.length)];
    const luckyDir   = LUCKY_DIRS[Math.floor(rand() * LUCKY_DIRS.length)];
    const luckyNum   = LUCKY_NUMS[Math.floor(rand() * LUCKY_NUMS.length)];

    const quote = QUOTES[Math.floor(rand() * QUOTES.length)];

    const details = {};
    DIMS.forEach(d => {
        const s = dimScores[d.key];
        const level = s >= 4 ? 'high' : s >= 3 ? 'mid' : 'low';
        const pool = FORTUNE_TEXTS[d.key][level];
        details[d.key] = pool[Math.floor(rand() * pool.length)];
    });

    return { dimScores, score, luckyColor, luckyDir, luckyNum, quote, details };
}

// ===== 渲染 =====
let selectedChar = null;
let currentFortune = null;

function renderCharGrid() {
    const grid = document.getElementById('charGrid');
    grid.innerHTML = CHARACTERS.map(ch => `
        <div class="char-card" data-id="${ch.id}">
            <div class="avatar">${ch.avatar}</div>
            <div class="name">${ch.name}</div>
        </div>
    `).join('');

    grid.addEventListener('click', e => {
        const card = e.target.closest('.char-card');
        if (!card) return;
        grid.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedChar = card.dataset.id;
        document.getElementById('btnQuery').disabled = false;
    });
}

function renderHistory() {
    const list = loadHistory();
    const container = document.getElementById('historyList');
    if (list.length === 0) {
        container.innerHTML = '<div class="empty-hint">还没有测算记录，快去试试吧~</div>';
        return;
    }
    container.innerHTML = list.map(h => `
        <div class="history-item" data-id="${h.charId}">
            <div class="hi-avatar">${h.avatar}</div>
            <div class="hi-info">
                <div class="hi-name">${h.name}</div>
                <div class="hi-date">${h.date}</div>
            </div>
            <div class="hi-score">${h.score}分</div>
        </div>
    `).join('');

    container.addEventListener('click', e => {
        const item = e.target.closest('.history-item');
        if (!item) return;
        selectedChar = item.dataset.id;
        showResult();
    });
}

function showResult() {
    if (!selectedChar) return;
    const ch = CHARACTERS.find(c => c.id === selectedChar);
    const fortune = generateFortune(selectedChar);
    currentFortune = fortune;

    // 基本信息
    document.getElementById('resAvatar').textContent = ch.avatar;
    document.getElementById('resName').textContent = ch.name + ' · ' + ch.anime;
    document.getElementById('resDate').textContent = todayStr() + ' · ' + ch.tag;

    // 综合分环
    const circumference = 2 * Math.PI * 52;
    const offset = circumference * (1 - fortune.score / 100);
    const circle = document.getElementById('scoreCircle');
    circle.style.strokeDasharray = circumference;
    circle.style.strokeDashoffset = circumference;
    requestAnimationFrame(() => {
        circle.style.strokeDashoffset = offset;
    });

    // 分数动画
    const scoreEl = document.getElementById('scoreText');
    let cur = 0;
    const target = fortune.score;
    const step = () => {
        cur += 2;
        if (cur > target) cur = target;
        scoreEl.textContent = cur;
        if (cur < target) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);

    // 维度星星
    document.getElementById('fortuneDims').innerHTML = DIMS.map(d => {
        const s = fortune.dimScores[d.key];
        const stars = Array.from({length: 5}, (_, i) =>
            `<span class="dim-star${i < s ? ' filled' : ''}">★</span>`
        ).join('');
        return `
            <div class="dim-row">
                <div class="dim-icon">${d.icon}</div>
                <div class="dim-name">${d.name}</div>
                <div class="dim-stars">${stars}</div>
                <div class="dim-score">${s * 20}</div>
            </div>
        `;
    }).join('');

    // 幸运元素
    document.getElementById('luckyGrid').innerHTML = `
        <div class="lucky-item">
            <div class="li-icon">🎨</div>
            <div class="li-label">幸运颜色</div>
            <div class="li-value">${fortune.luckyColor}</div>
        </div>
        <div class="lucky-item">
            <div class="li-icon">🧭</div>
            <div class="li-label">幸运方位</div>
            <div class="li-value">${fortune.luckyDir}</div>
        </div>
        <div class="lucky-item">
            <div class="li-icon">🔢</div>
            <div class="li-label">幸运数字</div>
            <div class="li-value">${fortune.luckyNum}</div>
        </div>
    `;

    // 详解
    document.getElementById('fortuneDetail').innerHTML = DIMS.map(d => `
        <h3>${d.icon} ${d.name}运势</h3>
        <p>${fortune.details[d.key]}</p>
    `).join('<hr style="border:none;border-top:1px solid rgba(255,255,255,0.06);margin:12px 0">') ;

    // 每日一言
    document.getElementById('dailyQuote').innerHTML = `
        <div class="quote-text">"${fortune.quote.text}"</div>
        <div class="quote-from">${fortune.quote.from}</div>
    `;

    // 保存 & 切换页面
    saveHistory(selectedChar, fortune.score);
    document.getElementById('pageHome').classList.remove('active');
    document.getElementById('pageResult').classList.add('active');
    window.scrollTo(0, 0);
}

// ===== 分享 =====
function buildShareText() {
    const ch = CHARACTERS.find(c => c.id === selectedChar);
    const f = currentFortune;
    const dimLines = DIMS.map(d => {
        const s = f.dimScores[d.key];
        return `${d.icon}${d.name} ${'★'.repeat(s)}${'☆'.repeat(5-s)}`;
    }).join('\n');
    return `🔮 今日动漫运势 · ${ch.name}\n📅 ${todayStr()}\n\n⭐ 综合运势：${f.score}分\n\n${dimLines}\n\n🎨 幸运颜色：${f.luckyColor}\n🧭 幸运方位：${f.luckyDir}\n🔢 幸运数字：${f.luckyNum}\n\n💬 ${f.quote.text}\n${f.quote.from}`;
}

// ===== 粒子背景 =====
function createParticles() {
    const container = document.getElementById('particles');
    const emojis = ['✨','🌟','💫','⭐','🌸','🎀','💎','🌙','🎵','💜'];
    for (let i = 0; i < 20; i++) {
        const span = document.createElement('span');
        span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        span.style.left = Math.random() * 100 + '%';
        span.style.animationDuration = (8 + Math.random() * 12) + 's';
        span.style.animationDelay = Math.random() * 10 + 's';
        span.style.fontSize = (14 + Math.random() * 16) + 'px';
        container.appendChild(span);
    }
}

// ===== 初始化 =====
function init() {
    createParticles();
    document.getElementById('dateBanner').innerHTML = `📅 <strong>${todayStr()}</strong> · 选择角色查看今日运势`;
    renderCharGrid();
    renderHistory();

    document.getElementById('btnQuery').addEventListener('click', showResult);

    document.getElementById('btnBack').addEventListener('click', () => {
        document.getElementById('pageResult').classList.remove('active');
        document.getElementById('pageHome').classList.add('active');
        selectedChar = null;
        document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
        document.getElementById('btnQuery').disabled = true;
        renderHistory();
        window.scrollTo(0, 0);
    });

    document.getElementById('btnShare').addEventListener('click', () => {
        const preview = document.getElementById('sharePreview');
        preview.innerHTML = `<div class="sp-title">🔮 动漫运势查询</div>` +
            buildShareText().replace(/\n/g, '<br>');
        document.getElementById('shareModal').classList.add('active');
    });

    document.getElementById('btnCloseModal').addEventListener('click', () => {
        document.getElementById('shareModal').classList.remove('active');
    });

    document.getElementById('btnCopyShare').addEventListener('click', () => {
        const text = buildShareText();
        navigator.clipboard.writeText(text).then(() => {
            showToast('已复制到剪贴板！');
            document.getElementById('shareModal').classList.remove('active');
        }).catch(() => {
            // fallback
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('已复制到剪贴板！');
            document.getElementById('shareModal').classList.remove('active');
        });
    });

    document.getElementById('shareModal').addEventListener('click', e => {
        if (e.target === e.currentTarget) {
            e.currentTarget.classList.remove('active');
        }
    });
}

document.addEventListener('DOMContentLoaded', init);
</script>
