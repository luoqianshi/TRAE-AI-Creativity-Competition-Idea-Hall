<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>情绪气象台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --happy: #FFD93D;
    --sad: #74B9FF;
    --angry: #FF7675;
    --calm: #A29BFE;
    --bg1: #E8F0FE;
    --bg2: #F3E8FF;
    --card: rgba(255,255,255,0.85);
    --text: #2D3436;
    --sub: #636E72;
    --radius: 20px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    color: var(--text);
    overflow-x: hidden;
  }

  /* ===== 页面容器 ===== */
  .page { display: none; flex-direction: column; min-height: 100vh; padding-bottom: 90px; }
  .page.active { display: flex; }

  /* ===== 顶部导航 ===== */
  .top-bar {
    text-align: center;
    padding: 20px 16px 10px;
  }
  .top-bar h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, #6C5CE7, #A29BFE);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .top-bar .subtitle {
    font-size: 13px;
    color: var(--sub);
    margin-top: 4px;
  }

  /* ===== 首页 - 天气动画区域 ===== */
  .weather-stage {
    flex: 0 0 auto;
    height: 220px;
    margin: 10px 16px;
    border-radius: var(--radius);
    background: var(--card);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    transition: background 0.6s;
  }
  .weather-stage .placeholder-text {
    font-size: 15px;
    color: #B2BEC3;
    text-align: center;
    line-height: 1.6;
  }
  .weather-stage .placeholder-text span {
    font-size: 40px;
    display: block;
    margin-bottom: 8px;
  }

  /* ===== 天气动画 ===== */
  .weather-anim {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .weather-anim.show { display: flex; }

  /* 开心 - 太阳 */
  .anim-happy { background: linear-gradient(180deg, #FFF9C4, #FFE082); }
  .sun {
    width: 80px; height: 80px;
    font-size: 70px;
    animation: sunPulse 2s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255,217,61,0.6));
  }
  @keyframes sunPulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.15) rotate(15deg); }
  }
  .sun-rays {
    position: absolute;
    width: 160px; height: 160px;
    border-radius: 50%;
    animation: raysSpin 8s linear infinite;
  }
  .sun-rays::before, .sun-rays::after {
    content: '✦';
    position: absolute;
    font-size: 20px;
    color: #FFD93D;
    opacity: 0.7;
  }
  .sun-rays::before { top: -10px; left: 50%; transform: translateX(-50%); }
  .sun-rays::after { bottom: -10px; left: 50%; transform: translateX(-50%); }
  @keyframes raysSpin { to { transform: rotate(360deg); } }

  .sparkle {
    position: absolute;
    font-size: 16px;
    animation: sparkleFloat 3s ease-in-out infinite;
    opacity: 0;
  }
  .sparkle:nth-child(2) { left: 15%; top: 20%; animation-delay: 0.5s; }
  .sparkle:nth-child(3) { left: 75%; top: 15%; animation-delay: 1s; }
  .sparkle:nth-child(4) { left: 25%; top: 70%; animation-delay: 1.5s; }
  .sparkle:nth-child(5) { left: 80%; top: 65%; animation-delay: 2s; }
  @keyframes sparkleFloat {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    50% { opacity: 1; transform: translateY(-15px) scale(1); }
    100% { opacity: 0; transform: translateY(-30px) scale(0.5); }
  }

  /* 低落 - 雨天 */
  .anim-sad { background: linear-gradient(180deg, #B2BEC3, #74B9FF); }
  .cloud {
    font-size: 60px;
    animation: cloudFloat 4s ease-in-out infinite;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
  }
  @keyframes cloudFloat {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(10px); }
  }
  .raindrop {
    position: absolute;
    width: 3px;
    height: 18px;
    background: linear-gradient(180deg, transparent, rgba(116,185,255,0.8));
    border-radius: 0 0 3px 3px;
    animation: rainFall 1s linear infinite;
    opacity: 0.7;
  }
  .raindrop:nth-child(2) { left: 25%; animation-delay: 0.1s; }
  .raindrop:nth-child(3) { left: 40%; animation-delay: 0.3s; }
  .raindrop:nth-child(4) { left: 55%; animation-delay: 0.5s; }
  .raindrop:nth-child(5) { left: 70%; animation-delay: 0.2s; }
  .raindrop:nth-child(6) { left: 35%; animation-delay: 0.7s; }
  .raindrop:nth-child(7) { left: 60%; animation-delay: 0.4s; }
  .raindrop:nth-child(8) { left: 80%; animation-delay: 0.6s; }
  @keyframes rainFall {
    0% { top: 45%; opacity: 0; }
    20% { opacity: 0.7; }
    100% { top: 95%; opacity: 0; }
  }

  /* 烦躁 - 闪电 */
  .anim-angry { background: linear-gradient(180deg, #636E72, #2D3436); }
  .storm-cloud {
    font-size: 55px;
    animation: stormShake 0.3s ease-in-out infinite alternate;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
  }
  @keyframes stormShake {
    0% { transform: translateX(-2px); }
    100% { transform: translateX(2px); }
  }
  .lightning {
    position: absolute;
    font-size: 40px;
    top: 55%;
    left: 50%;
    transform: translateX(-50%);
    animation: flash 2s ease-in-out infinite;
    filter: drop-shadow(0 0 15px rgba(255,200,0,0.8));
  }
  @keyframes flash {
    0%, 45%, 55%, 100% { opacity: 0; }
    48%, 52% { opacity: 1; }
  }
  .angry-particle {
    position: absolute;
    width: 6px; height: 6px;
    background: #FF7675;
    border-radius: 50%;
    animation: angryFloat 2s ease-out infinite;
    opacity: 0;
  }
  .angry-particle:nth-child(3) { left: 20%; animation-delay: 0.3s; }
  .angry-particle:nth-child(4) { left: 80%; animation-delay: 0.8s; }
  .angry-particle:nth-child(5) { left: 15%; animation-delay: 1.2s; }
  .angry-particle:nth-child(6) { left: 75%; animation-delay: 0.5s; }
  @keyframes angryFloat {
    0% { bottom: 40%; opacity: 0; transform: scale(1); }
    30% { opacity: 0.8; }
    100% { bottom: 90%; opacity: 0; transform: scale(0.3); }
  }

  /* 平静 - 月亮星空 */
  .anim-calm { background: linear-gradient(180deg, #2D3436, #0C2461); }
  .moon {
    font-size: 60px;
    animation: moonGlow 4s ease-in-out infinite;
    filter: drop-shadow(0 0 25px rgba(162,155,254,0.5));
  }
  @keyframes moonGlow {
    0%, 100% { filter: drop-shadow(0 0 25px rgba(162,155,254,0.5)); }
    50% { filter: drop-shadow(0 0 40px rgba(162,155,254,0.8)); }
  }
  .star {
    position: absolute;
    font-size: 10px;
    color: #DFE6E9;
    animation: twinkle 2s ease-in-out infinite;
  }
  .star:nth-child(2) { left: 10%; top: 15%; animation-delay: 0.5s; }
  .star:nth-child(3) { left: 85%; top: 10%; animation-delay: 1s; }
  .star:nth-child(4) { left: 20%; top: 75%; animation-delay: 0.3s; }
  .star:nth-child(5) { left: 90%; top: 60%; animation-delay: 1.5s; }
  .star:nth-child(6) { left: 50%; top: 8%; animation-delay: 0.8s; }
  .star:nth-child(7) { left: 70%; top: 80%; animation-delay: 1.2s; }
  .star:nth-child(8) { left: 35%; top: 85%; animation-delay: 0.2s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.4); }
  }

  /* ===== 鼓励文案 ===== */
  .encourage-msg {
    margin: 0 16px;
    padding: 16px 20px;
    border-radius: var(--radius);
    background: var(--card);
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    text-align: center;
    font-size: 15px;
    line-height: 1.7;
    color: var(--sub);
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.5s ease;
  }
  .encourage-msg.show {
    opacity: 1;
    transform: translateY(0);
  }
  .encourage-msg .mood-label {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
    display: block;
  }
  .encourage-msg .mood-label.happy { color: #F39C12; }
  .encourage-msg .mood-label.sad { color: #0984E3; }
  .encourage-msg .mood-label.angry { color: #D63031; }
  .encourage-msg .mood-label.calm { color: #6C5CE7; }

  /* ===== 心情按钮 ===== */
  .mood-section {
    flex: 1;
    padding: 20px 16px;
  }
  .mood-section .section-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text);
  }
  .mood-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .mood-btn {
    border: none;
    border-radius: var(--radius);
    padding: 24px 16px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    position: relative;
    overflow: hidden;
  }
  .mood-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0);
    transition: background 0.3s;
  }
  .mood-btn:active::after { background: rgba(255,255,255,0.2); }
  .mood-btn:active { transform: scale(0.95); }
  .mood-btn .emoji { font-size: 36px; }
  .mood-btn .label { font-size: 15px; font-weight: 600; }

  .mood-btn.happy-btn { background: linear-gradient(135deg, #FFF9C4, #FFE082); color: #F39C12; }
  .mood-btn.sad-btn { background: linear-gradient(135deg, #DFE6E9, #74B9FF); color: #0984E3; }
  .mood-btn.angry-btn { background: linear-gradient(135deg, #FAB1A0, #FF7675); color: #D63031; }
  .mood-btn.calm-btn { background: linear-gradient(135deg, #DCD6F7, #A29BFE); color: #6C5CE7; }

  /* ===== 记录按钮 ===== */
  .record-btn-wrap {
    padding: 0 16px 20px;
  }
  .record-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: var(--radius);
    background: linear-gradient(135deg, #6C5CE7, #A29BFE);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(108,92,231,0.3);
    transition: all 0.3s;
    letter-spacing: 1px;
  }
  .record-btn:active { transform: scale(0.97); }
  .record-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ===== 日历页 ===== */
  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
  }
  .calendar-header .month-nav {
    background: var(--card);
    border: none;
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: all 0.2s;
    color: var(--text);
  }
  .calendar-header .month-nav:active { transform: scale(0.9); }
  .calendar-header .current-month {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
  }

  .calendar-card {
    margin: 0 16px;
    padding: 16px;
    border-radius: var(--radius);
    background: var(--card);
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    margin-bottom: 8px;
  }
  .weekday-row span {
    font-size: 12px;
    font-weight: 600;
    color: var(--sub);
    padding: 6px 0;
  }
  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .day-cell {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-size: 14px;
    position: relative;
    transition: background 0.2s;
    gap: 2px;
  }
  .day-cell .day-num { font-weight: 500; }
  .day-cell .day-emoji { font-size: 14px; }
  .day-cell.empty { pointer-events: none; }
  .day-cell.today {
    background: rgba(108,92,231,0.1);
  }
  .day-cell.today .day-num {
    color: #6C5CE7;
    font-weight: 700;
  }
  .day-cell.has-mood {
    background: rgba(108,92,231,0.05);
  }

  /* 日历统计 */
  .stats-card {
    margin: 16px;
    padding: 20px;
    border-radius: var(--radius);
    background: var(--card);
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .stats-card .stats-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    color: var(--text);
  }
  .stats-row {
    display: flex;
    justify-content: space-around;
  }
  .stat-item {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .stat-item .stat-emoji { font-size: 28px; }
  .stat-item .stat-count { font-size: 20px; font-weight: 700; color: var(--text); }
  .stat-item .stat-label { font-size: 11px; color: var(--sub); }

  /* ===== 底部导航 ===== */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(15px);
    display: flex;
    align-items: center;
    justify-content: space-around;
    box-shadow: 0 -2px 15px rgba(0,0,0,0.06);
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 8px 20px;
    border-radius: 12px;
    transition: all 0.3s;
    border: none;
    background: none;
    color: var(--sub);
  }
  .nav-item.active {
    color: #6C5CE7;
  }
  .nav-item .nav-icon { font-size: 24px; }
  .nav-item .nav-label { font-size: 11px; font-weight: 600; }
  .nav-item.active .nav-label { font-weight: 700; }

  /* ===== Toast 提示 ===== */
  .toast {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(45,52,54,0.9);
    color: #fff;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 14px;
    opacity: 0;
    transition: all 0.4s ease;
    z-index: 200;
    pointer-events: none;
    backdrop-filter: blur(10px);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== 清除按钮 ===== */
  .clear-btn-wrap {
    padding: 0 16px 20px;
    text-align: center;
  }
  .clear-btn {
    background: none;
    border: 1px solid #DFE6E9;
    color: var(--sub);
    padding: 10px 24px;
    border-radius: 30px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .clear-btn:active { background: #DFE6E9; }
</style>
</head>
<body>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ===== 首页 ===== -->
<div class="page active" id="page-home">
  <div class="top-bar">
    <h1>🌤 情绪气象台</h1>
    <div class="subtitle">记录今天的心情天气</div>
  </div>

  <!-- 天气动画舞台 -->
  <div class="weather-stage" id="weatherStage">
    <div class="placeholder-text">
      <span>🌤</span>
      点击下方按钮<br>查看你的心情天气
    </div>

    <!-- 开心动画 -->
    <div class="weather-anim anim-happy" id="anim-happy">
      <div class="sun-rays"></div>
      <span class="sparkle">✨</span>
      <span class="sparkle">✨</span>
      <span class="sparkle">✨</span>
      <span class="sparkle">✨</span>
      <div class="sun">☀️</div>
    </div>

    <!-- 低落动画 -->
    <div class="weather-anim anim-sad" id="anim-sad">
      <div class="cloud">🌧️</div>
      <div class="raindrop"></div>
      <div class="raindrop"></div>
      <div class="raindrop"></div>
      <div class="raindrop"></div>
      <div class="raindrop"></div>
      <div class="raindrop"></div>
      <div class="raindrop"></div>
    </div>

    <!-- 烦躁动画 -->
    <div class="weather-anim anim-angry" id="anim-angry">
      <div class="storm-cloud">⛈️</div>
      <div class="lightning">⚡</div>
      <div class="angry-particle"></div>
      <div class="angry-particle"></div>
      <div class="angry-particle"></div>
      <div class="angry-particle"></div>
    </div>

    <!-- 平静动画 -->
    <div class="weather-anim anim-calm" id="anim-calm">
      <div class="moon">🌙</div>
      <span class="star">⭐</span>
      <span class="star">⭐</span>
      <span class="star">⭐</span>
      <span class="star">⭐</span>
      <span class="star">⭐</span>
      <span class="star">⭐</span>
      <span class="star">⭐</span>
    </div>
  </div>

  <!-- 鼓励文案 -->
  <div class="encourage-msg" id="encourageMsg">
    <span class="mood-label" id="moodLabel"></span>
    <span id="moodText"></span>
  </div>

  <!-- 心情按钮 -->
  <div class="mood-section">
    <div class="section-title">此刻，你的心情是？</div>
    <div class="mood-grid">
      <button class="mood-btn happy-btn" onclick="selectMood(&#39;happy&#39;)">
        <span class="emoji">😄</span>
        <span class="label">开心</span>
      </button>
      <button class="mood-btn sad-btn" onclick="selectMood(&#39;sad&#39;)">
        <span class="emoji">😢</span>
        <span class="label">低落</span>
      </button>
      <button class="mood-btn angry-btn" onclick="selectMood(&#39;angry&#39;)">
        <span class="emoji">😤</span>
        <span class="label">烦躁</span>
      </button>
      <button class="mood-btn calm-btn" onclick="selectMood(&#39;calm&#39;)">
        <span class="emoji">😌</span>
        <span class="label">平静</span>
      </button>
    </div>
  </div>

  <!-- 记录按钮 -->
  <div class="record-btn-wrap">
    <button class="record-btn" id="recordBtn" disabled="" onclick="recordMood()">📝 记录今天的心情</button>
  </div>
</div>

<!-- ===== 日历页 ===== -->
<div class="page" id="page-calendar">
  <div class="top-bar">
    <h1>📅 心情日历</h1>
    <div class="subtitle">回顾你的情绪轨迹</div>
  </div>

  <div class="calendar-header">
    <button class="month-nav" onclick="changeMonth(-1)">◀</button>
    <span class="current-month" id="currentMonth">2026年 6月</span>
    <button class="month-nav" onclick="changeMonth(1)">▶</button>
  </div>

  <div class="calendar-card">
    <div class="weekday-row">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div class="days-grid" id="daysGrid"><div class="day-cell empty"></div><div class="day-cell">
        <span class="day-num">1</span>
        
      </div><div class="day-cell">
        <span class="day-num">2</span>
        
      </div><div class="day-cell">
        <span class="day-num">3</span>
        
      </div><div class="day-cell">
        <span class="day-num">4</span>
        
      </div><div class="day-cell">
        <span class="day-num">5</span>
        
      </div><div class="day-cell">
        <span class="day-num">6</span>
        
      </div><div class="day-cell">
        <span class="day-num">7</span>

    <span class="nav-icon">📅</span>

<script>
  // ===== 数据 =====
  const MOODS = {
    happy: {
      emoji: '😄',
      label: '阳光灿烂',
      animId: 'anim-happy',
      className: 'happy',
      texts: [
        '你的笑容是最好的天气，继续保持这份美好！',
        '开心是一种超能力，你今天充满能量！',
        '把快乐装进口袋，它会在需要时温暖你。',
        '今天的你闪闪发光，像太阳一样耀眼！',
        '快乐会传染，你正在照亮身边的人。'
      ]
    },
    sad: {
      emoji: '😢',
      label: '细雨绵绵',
      animId: 'anim-sad',
      className: 'sad',
      texts: [
        '雨天总会过去，彩虹正在路上。',
        '允许自己难过，这也是一种勇敢。',
        '每一场雨都在为更好的明天做准备。',
        '你不需要一直坚强，偶尔脆弱也没关系。',
        '低落是暂时的，你比想象中更强大。'
      ]
    },
    angry: {
      emoji: '😤',
      label: '雷阵雨',
      animId: 'anim-angry',
      className: 'angry',
      texts: [
        '深呼吸，让风暴慢慢平息。',
        '烦躁是情绪在提醒你：该休息一下了。',
        '暴风雨后总有宁静，给自己一点时间。',
        '你值得平静，先放下手头的事歇歇吧。',
        '允许情绪流动，它终会像云一样散去。'
      ]
    },
    calm: {
      emoji: '😌',
      label: '月朗星稀',
      animId: 'anim-calm',
      className: 'calm',
      texts: [
        '平静是一种力量，你正在积蓄能量。',
        '享受这份宁静，你值得拥有这样的时刻。',
        '内心平静的人，拥有整个宇宙的力量。',
        '像月光一样温柔地对待自己吧。',
        '此刻的安宁，是你送给自己最好的礼物。'
      ]
    }
  };

  let currentMood = null;
  let calendarYear, calendarMonth;

  // ===== 初始化 =====
  function init() {
    const now = new Date();
    calendarYear = now.getFullYear();
    calendarMonth = now.getMonth();
    renderCalendar();
    checkTodayRecord();
  }

  // ===== 选择心情 =====
  function selectMood(mood) {
    currentMood = mood;
    const data = MOODS[mood];

    // 隐藏所有动画
    document.querySelectorAll('.weather-anim').forEach(el => el.classList.remove('show'));
    // 显示对应动画
    document.getElementById(data.animId).classList.add('show');

    // 显示鼓励文案
    const msgEl = document.getElementById('encourageMsg');
    const labelEl = document.getElementById('moodLabel');
    const textEl = document.getElementById('moodText');

    msgEl.classList.remove('show');
    setTimeout(() => {
      labelEl.className = 'mood-label ' + data.className;
      labelEl.textContent = data.emoji + ' ' + data.label;
      textEl.textContent = data.texts[Math.floor(Math.random() * data.texts.length)];
      msgEl.classList.add('show');
    }, 200);

    // 启用记录按钮
    document.getElementById('recordBtn').disabled = false;
  }

  // ===== 记录心情 =====
  function recordMood() {
    if (!currentMood) return;

    const today = new Date();
    const dateKey = formatDateKey(today);
    const records = getRecords();
    records[dateKey] = currentMood;
    localStorage.setItem('mood_records', JSON.stringify(records));

    showToast('✅ 已记录今天的心情：' + MOODS[currentMood].emoji + ' ' + MOODS[currentMood].label);
    document.getElementById('recordBtn').disabled = true;
  }

  // ===== 检查今日是否已记录 =====
  function checkTodayRecord() {
    const dateKey = formatDateKey(new Date());
    const records = getRecords();
    if (records[dateKey]) {
      document.getElementById('recordBtn').disabled = true;
    }
  }

  // ===== 日历相关 =====
  function changeMonth(delta) {
    calendarMonth += delta;
    if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
    if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
    renderCalendar();
  }

  function renderCalendar() {
    const records = getRecords();
    const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    document.getElementById('currentMonth').textContent = calendarYear + '年 ' + monthNames[calendarMonth];

    const grid = document.getElementById('daysGrid');
    grid.innerHTML = '';

    const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
    const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
    const today = new Date();
    const todayStr = formatDateKey(today);

    // 空白填充
    for (let i = 0; i < firstDay; i++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell empty';
      grid.appendChild(cell);
    }

    // 日期
    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement('div');
      const dateKey = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const isToday = dateKey === todayStr;
      const mood = records[dateKey];

      cell.className = 'day-cell' + (isToday ? ' today' : '') + (mood ? ' has-mood' : '');
      cell.innerHTML = `
        <span class="day-num">${d}</span>
        ${mood ? '<span class="day-emoji">' + MOODS[mood].emoji + '</span>' : ''}
      `;
      grid.appendChild(cell);
    }

    // 统计
    renderStats(records);
  }

  function renderStats(records) {
    const stats = { happy: 0, sad: 0, angry: 0, calm: 0 };
    const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();

    for (let d = 1; d <= daysInMonth; d++) {
      const dateKey = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      if (records[dateKey] && stats.hasOwnProperty(records[dateKey])) {
        stats[records[dateKey]]++;
      }
    }

    const statsRow = document.getElementById('statsRow');
    statsRow.innerHTML = `
      <div class="stat-item">
        <span class="stat-emoji">😄</span>
        <span class="stat-count">${stats.happy}</span>
        <span class="stat-label">开心</span>
      </div>
      <div class="stat-item">
        <span class="stat-emoji">😢</span>
        <span class="stat-count">${stats.sad}</span>
        <span class="stat-label">低落</span>
      </div>
      <div class="stat-item">
        <span class="stat-emoji">😤</span>
        <span class="stat-count">${stats.angry}</span>
        <span class="stat-label">烦躁</span>
      </div>
      <div class="stat-item">
        <span class="stat-emoji">😌</span>
        <span class="stat-count">${stats.calm}</span>
        <span class="stat-label">平静</span>
      </div>
    `;
  }

  // ===== 页面切换 =====
  function switchPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');

    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    event.currentTarget.classList.add('active');

    if (page === 'calendar') {
      const now = new Date();
      calendarYear = now.getFullYear();
      calendarMonth = now.getMonth();
      renderCalendar();
    }
  }

  // ===== 工具函数 =====
  function getRecords() {
    try {
      return JSON.parse(localStorage.getItem('mood_records')) || {};
    } catch { return {}; }
  }

  function formatDateKey(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  function clearAllRecords() {
    if (confirm('确定要清除所有心情记录吗？此操作不可恢复。')) {
      localStorage.removeItem('mood_records');
      renderCalendar();
      checkTodayRecord();
      showToast('🗑 已清除所有记录');
    }
  }

  // 启动
  init();
</script>
