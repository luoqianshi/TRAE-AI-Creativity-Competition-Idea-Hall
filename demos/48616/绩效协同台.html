/* ---------- 工具函数 ---------- */
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function money(n){n=Number(n)||0;return n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function pct(n){n=Number(n)||0;return n.toFixed(2)+'%';}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function getPerson(id){return DB.persons.find(function(p){return p.id===id;});}
function getProject(id){return DB.projects.find(function(p){return p.id===id;});}
function curYear(){return DB.params.year;}
function curMonth(){return DB.params.month;}
function periodLabel(){return DB.params.year+'年'+DB.params.month+'月';}

/* 计算可发上限 = 项目总绩效 × 月度进度增量 × 个人贡献占比 × (1-预留比例) */
function calcMaxPayable(totalPerf,monthlyProg,contrib){
  var reserve=DB.params.reserveRatio||0.20;
  return (Number(totalPerf)||0)*(Number(monthlyProg)||0)/100*(Number(contrib)||0)/100*(1-reserve);
}
/* 计算考勤合格率 = (1 - max(0,不合格次数-豁免)/打卡总次数) × 100 */
function calcAttendanceRate(badCount,totalPunch){
  var bad=Math.max(0,(Number(badCount)||0)-(DB.params.exemption||0));
  var total=Number(totalPunch)||1;
  var rate=(1-bad/total)*100;
  return Math.max(0,rate);
}
/* 根据合格率确定档次 */
function getTier(rate){
  var t=DB.params.tiers;
  for(var i=0;i<t.length;i++){
    if(rate>=t[i].min && rate<=(t[i].max===89.99?89.999:t[i].max))return t[i];
  }
  return t[t.length-1];
}
/* 计算日工资 */
function dailyWage(){return DB.params.minWage/DB.params.workDays;}
/* 计算最终应发工资 */
function calcFinalPay(approved,unitWage,attendDeduction,overtimeMeal,mealAllow,personalLeaveDeduction){
  var v=(Number(approved)||0)+(Number(unitWage)||0)-(Number(attendDeduction)||0)+(Number(overtimeMeal)||0)+(Number(mealAllow)||0)-(Number(personalLeaveDeduction)||0);
  return v;
}

/* ---------- 项目绩效自动计算 ---------- */
function calcProjectPerformance(cat,level,contractAmount,months){
  var std=PERF_STANDARDS[cat];
  if(!std)return 0;
  if(std.type==='fixed'){
    if(std.options&&level)return std.options[level]||0;
    return std.base||0;
  }
  if(std.type==='pct'){
    var amt=Number(contractAmount)||0;
    var r=0;
    if(std.base!==undefined){r=std.base;}
    else if(std.tiers){
      for(var i=0;i<std.tiers.length;i++){if(amt<=std.tiers[i].max){r=std.tiers[i].r;break;}}
    }
    var val=amt*10000*r; // 合同金额(万)→元 × 比例
    if(std.min&&val<std.min)val=std.min;
    return Math.round(val);
  }
  if(std.type==='permonth'){
    return (std.rate||0)*(Number(months)||1);
  }
  return 0;
}

function recalcApprove(){
  // 重算核定后上限
  var decs=document.querySelectorAll('[id^="ap_prog_"]');
  var totalMax=0;
  decs.forEach(function(inp){
    var id=inp.id.replace('ap_prog_','');
    var d=DB.declarations.find(function(x){return x.id===id;});
    if(d){
      var newProg=Number(inp.value)||0;
      var mx=calcMaxPayable(d.totalPerformance,d.monthlyProgress,d.contributionRatio);
      // 用核定进度重算：可发上限基于月度增量，进度核定影响总进度展示，上限公式用月度增量
      var mxEl=document.getElementById('ap_mx_'+id);
      if(mxEl)mxEl.textContent=money(mx);
      totalMax+=mx;
    }
  });
  var mb=document.getElementById('approveMaxBox');
  if(mb)mb.innerHTML='<div class="calc-box"><div class="calc-line total"><span>核定后可发上限合计</span><span class="v">¥ '+money(totalMax)+'</span></div></div>';
  // 重算最终应发
  var approved=Number(document.getElementById('ap_approved').value)||0;
  var unitWage=Number(document.getElementById('ap_unitWage').value)||0;
  var bad=Number(document.getElementById('ap_bad').value)||0;
  var total=Number(document.getElementById('ap_total').value)||1;
  var ot=Number(document.getElementById('ap_ot').value)||0;
  var leave=Number(document.getElementById('ap_leave').value)||0;
  var mealdays=Number(document.getElementById('ap_mealdays').value)||0;
  var rate=calcAttendanceRate(bad,total);
  var tier=getTier(rate);
  var tEl=document.getElementById('ap_tier');
  if(tEl)tEl.value=tier.name+'（扣'+tier.deduction+'元）';
  var attendDed=tier.deduction;
  var otMeal=ot*DB.params.overtimeMeal;
  var mealAllow=mealdays*DB.params.mealUnit;
  var leaveDed=leave*dailyWage();
  var raw=calcFinalPay(approved,unitWage,attendDed,otMeal,mealAllow,leaveDed);
  var finalPay=raw,yearEndDed=0,lowFlag=false;
  if(raw<DB.params.minWage){yearEndDed=DB.params.minWage-raw;finalPay=DB.params.minWage;lowFlag=true;}
  var cb=document.getElementById('approveCalcBox');
  if(cb){
    var h='<div class="calc-box">';
    h+='<div class="calc-line"><span>核定应发 + 单位工资</span><span class="v">'+money(approved)+' + '+money(unitWage)+'</span></div>';
    h+='<div class="calc-line"><span>− 考勤扣款（'+tier.name+'，合格率'+pct(rate)+'）</span><span class="v">− '+money(attendDed)+'</span></div>';
    h+='<div class="calc-line"><span>+ 加班餐补（'+ot+'次×'+DB.params.overtimeMeal+'）</span><span class="v">+ '+money(otMeal)+'</span></div>';
    h+='<div class="calc-line"><span>+ 餐补（'+mealdays+'天×'+DB.params.mealUnit+'）</span><span class="v">+ '+money(mealAllow)+'</span></div>';
    h+='<div class="calc-line"><span>− 事假扣款（'+leave+'天×'+money(dailyWage())+'）</span><span class="v">− '+money(leaveDed)+'</span></div>';
    h+='<div class="calc-line total"><span>核算应发</span><span class="v">¥ '+money(raw)+'</span></div>';
    if(lowFlag){
      h+='<div class="alert warn" style="margin-top:8px"><span class="ico">⚠</span><div>核算应发 '+money(raw)+' 元低于最低工资标准 '+DB.params.minWage+' 元，本月按 <b>'+money(DB.params.minWage)+'元</b> 发放，差额 <b>'+money(yearEndDed)+'元</b> 计入年终核算扣款。</div></div>';
    }
    h+='<div class="calc-line total" style="color:'+(lowFlag?'var(--warn)':'var(--ok)')+'"><span>最终应发工资</span><span class="v">¥ '+money(finalPay)+'</span></div>';
    if(yearEndDed>0){h+='<div class="calc-line"><span>年终核算扣款</span><span class="v">¥ '+money(yearEndDed)+'</span></div>';}
    h+='</div>';
    cb.innerHTML=h;
  }
}

function countAnomalies(){
  var y=curYear(),m=curMonth();
  var decs=DB.declarations.filter(function(d){return d.year===y&&d.month===m;});
  var progress=0,ratio=0,over=0;
  // 进度不一致
  var byProj={};
  decs.forEach(function(d){if(!byProj[d.projectId])byProj[d.projectId]=[];byProj[d.projectId].push(d.totalProgress);});
  Object.keys(byProj).forEach(function(k){var vals=byProj[k];var u={};vals.forEach(function(v){u[v]=1;});if(Object.keys(u).length>1)progress++;});
  // 贡献占比≠100%
  var byProjContrib={};
  decs.forEach(function(d){if(!byProjContrib[d.projectId])byProjContrib[d.projectId]=0;byProjContrib[d.projectId]+=Number(d.contributionRatio)||0;});
  Object.keys(byProjContrib).forEach(function(k){if(Math.abs(byProjContrib[k]-100)>0.01)ratio++;});
  // 超限
  decs.forEach(function(d){var mx=calcMaxPayable(d.totalPerformance,d.monthlyProgress,d.contributionRatio);if(Number(d.appliedAmount)>mx)over++;if(Number(d.totalProgress)>100)over++;});
  return{progress:progress,ratio:ratio,over:over,total:progress+ratio+over};
}

      });
    });
    html+='</tbody></table></div>';
  }
  html+='</div></div>';

  html+='<div class="card"><div class="card-h"><h3>② 个人贡献占比合计检查</h3></div><div class="card-b">';
  if(!pkeys.length){html+='<div class="tbl-empty">暂无数据</div>';}
  else{
    html+='<div class="table-wrap"><table><thead><tr><th>项目</th><th>成员</th><th class="num">个人占比</th><th class="num">合计</th><th>状态</th></tr></thead><tbody>';
    pkeys.forEach(function(k){
      var g=byProj[k];var sum=g.decs.reduce(function(s,d){return s+(Number(d.contributionRatio)||0);},0);var bad=Math.abs(sum-100)>0.01;
      g.decs.forEach(function(d,idx){
        html+='<tr class="'+(bad?'row-danger':'')+'"><td>'+(idx===0?g.name:'')+'</td><td>'+d.personName+'</td><td class="num">'+pct(d.contributionRatio)+'</td><td class="num">'+(idx===0?pct(sum):'')+'</td><td>'+(idx===0?(bad?'<span class="tag danger">≠100%</span>':'<span class="tag ok">=100%</span>'):'')+'</td></tr>';
      });
    });
    html+='</tbody></table></div>';

    });
    html+='</tbody></table></div>';
  }
  html+='</div></div>';
  document.getElementById('view-check').innerHTML=html;
}

    });

function onCatChange(){
  var cat=document.getElementById('pr_cat').value;

  var wrap=document.getElementById('pr_level_wrap');
  if(std&&std.options){
    var opts=Object.keys(std.options);
    wrap.innerHTML='<label class="fld">分级/级别</label><select class="in" id="pr_level" onchange="previewStdPerf()">'+opts.map(function(o){return '<option value="'+o+'">'+o+'（'+money(std.options[o])+'元）</option>';}).join('')+'</select>';
  }else{wrap.innerHTML='<label class="fld">分级/级别</label><input class="in" id="pr_level" value="">';}
  previewStdPerf();
}
function previewStdPerf(){
  var cat=document.getElementById('pr_cat').value;
  var lv=document.getElementById('pr_level')?document.getElementById('pr_level').value:'';
  var amt=Number(document.getElementById('pr_amt').value)||0;
  var mon=Number(document.getElementById('pr_months').value)||1;
  var stdPerf=calcProjectPerformance(cat,lv,amt,mon);
  var el=document.getElementById('pr_stdPreview');
  if(el){
    var std=PERF_STANDARDS[cat];
    var desc='';
    if(std){
      if(std.type==='pct'){
        var r=0;
        if(std.base!==undefined)r=std.base;
        else if(std.tiers){for(var i=0;i<std.tiers.length;i++){if(amt<=std.tiers[i].max){r=std.tiers[i].r;break;}}}
        desc='合同'+amt+'万 × '+(r*100).toFixed(1)+'% = '+money(amt*10000*r)+'元';
        if(std.min&&amt*10000*r<std.min)desc+='（低于'+std.min+'元，按'+std.min+'元包干）';
      }else if(std.type==='fixed')desc='固定费用';
      else if(std.type==='permonth')desc=std.rate+'元/人·月 × '+mon+'月';
      else desc='手动填写';
    }
    el.innerHTML='<div class="calc-box"><div class="calc-line"><span>制度绩效参考</span><span class="v">¥ '+money(stdPerf)+'</span></div><div class="calc-line" style="color:var(--muted);font-size:12px"><span>'+desc+'</span></div><div style="margin-top:6px"><button class="btn sm" onclick="document.getElementById(\'pr_totalPerf\').value=\''+stdPerf.toFixed(2)+'\'">填入总绩效</button></div></div>';
  }
}

function renderLedger(){
  var html='<div class="card"><div class="card-b"><div class="form-row cols-2"><div><label class="fld">台账年度</label><input class="in" id="ldYear" type="number" value="'+curYear()+'" onchange="renderLedger()"></div><div></div></div></div></div>';

  html+='<div class="card"><div class="card-h"><h3>'+fy+'年度绩效台账</h3><div><button class="btn sm" onclick="exportLedgerCSV()">导出CSV</button></div></div><div class="card-b">';
  var months=[];
  for(var i=1;i<=12;i++)months.push(i);
  var rows=DB.persons.map(function(p){
    var row={person:p,months:[],yearTotal:0,yearApplied:0,yearAttend:0,yearLeave:0,yearEndDed:0};
    months.forEach(function(mo){
      var apps=DB.approvals.filter(function(a){return a.personId===p.id&&a.year===fy&&a.month===mo;});
      var decs=DB.declarations.filter(function(d){return d.personId===p.id&&d.year===fy&&d.month===mo;});
      var ap=apps[0];
      var applied=decs.reduce(function(s,d){return s+(Number(d.appliedAmount)||0);},0);
      row.months.push({month:mo,final:ap?ap.finalPayable:0,applied:applied,attend:ap?ap.attendanceDeduction:0,leave:ap?ap.personalLeaveDeduction:0,yearEnd:ap?ap.yearEndDeduction:0});
      row.yearTotal+=ap?ap.finalPayable:0;
      row.yearApplied+=applied;
      row.yearAttend+=ap?ap.attendanceDeduction:0;
      row.yearLeave+=ap?ap.personalLeaveDeduction:0;
      row.yearEndDed+=ap?ap.yearEndDeduction:0;
    });
    return row;
  });
  html+='<div class="table-wrap" style="max-height:520px"><table><thead><tr><th>员工</th>';
  months.forEach(function(mo){html+='<th class="num">'+mo+'月</th>';});
  html+='<th class="num">全年应发</th><th class="num">全年申请</th><th class="num">考勤扣款</th><th class="num">事假扣款</th><th class="num">年终扣款</th></tr></thead><tbody>';
  rows.forEach(function(r){
    html+='<tr><td><b>'+r.person.name+'</b></td>';
    r.months.forEach(function(m){html+='<td class="num" style="'+(m.final?'':'color:var(--muted)')+'">'+(m.final?money(m.final):'—')+'</td>';});
    html+='<td class="num"><b>'+money(r.yearTotal)+'</b></td><td class="num">'+money(r.yearApplied)+'</td><td class="num">'+money(r.yearAttend)+'</td><td class="num">'+money(r.yearLeave)+'</td><td class="num">'+money(r.yearEndDed)+'</td></tr>';
  });
  html+='</tbody></table></div>';
  // 年终核算公式
  html+='<div class="fieldset-note" style="margin-top:14px"><b>年终绩效核算公式</b>（依据《部门管理制度细化》）：<br>年终绩效 = 全年项目核算绩效 − 月应发工资总和 − 考勤绩效扣减 − 事假扣款 − 单位承担部分五险二金 + 单位承担的餐补 + 单位负责的工资（证书补贴、技术审查绩效等）+ 加班餐补<br>注：应发工资超过最终核定绩效的，超出部分从下一年度绩效中逐月扣回；连续两年累计超发超过2万元的，年度考核不得评优，下一年度应发上限下调20%。</div>';
  html+='</div></div>';
  document.getElementById('view-ledger').innerHTML=html;
}

/* ---------- 导出函数 ---------- */
function download(filename,content,type){
  type=type||'application/json';
  var blob=new Blob([content],{type:type});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=filename;a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
function exportPersonalPack(pid){
  var p=getPerson(pid||CUR_PERSON);
  if(!p){toast('请选择员工');return;}
  var pack={type:'personal_result',person:{name:p.name,role:p.role},declarations:DB.declarations.filter(function(d){return d.personId===p.id;}),approvals:DB.approvals.filter(function(a){return a.personId===p.id;}),exportedAt:new Date().toISOString()};
  download(p.name+'_个人结果包.json',JSON.stringify(pack,null,2));
  toast('已导出'+p.name+'的个人结果包');
}
function exportDeclarationsJSON(){
  download('员工申报_'+periodLabel()+'.json',JSON.stringify({type:'declarations',period:periodLabel(),data:DB.declarations},null,2));
  toast('已导出申报JSON');
}
function toCSV(rows){
  return rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);if(/[",\n]/.test(c))c='"'+c.replace(/"/g,'""')+'"';return c;}).join(',');}).join('\n');
}
function exportProjectsCSV(){
  var rows=[['项目名称','项目类别','分级','合同金额(万)','制度绩效(元)','总绩效(元)','总进度(%)']];
  DB.projects.forEach(function(p){rows.push([p.name,p.perfCat,p.perfCatLevel||'',p.contractAmount||0,calcProjectPerformance(p.perfCat,p.perfCatLevel,p.contractAmount,p.months||1),p.totalPerformance,p.totalProgress]);});
  download('项目库.csv','\ufeff'+toCSV(rows),'text/csv');
  toast('已导出项目库CSV');
}
function exportSummaryCSV(){
  var y=curYear(),m=curMonth();
  var decs=DB.declarations.filter(function(d){return d.year===y&&d.month===m;});
  var rows=[['员工','项目','总绩效(元)','总进度(%)','月度增量(%)','贡献占比(%)','可发上限(元)','申请应发(元)']];
  decs.forEach(function(d){rows.push([d.personName,d.projectName,d.totalPerformance,d.totalProgress,d.monthlyProgress,d.contributionRatio,calcMaxPayable(d.totalPerformance,d.monthlyProgress,d.contributionRatio).toFixed(2),d.appliedAmount]);});
  download('月度汇总_'+y+'年'+m+'月.csv','\ufeff'+toCSV(rows),'text/csv');
  toast('已导出月度汇总CSV');
}
function exportLedgerCSV(){
  var fy=Number(document.getElementById('ldYear')?document.getElementById('ldYear').value:curYear());
  var rows=[['员工']];
  for(var i=1;i<=12;i++)rows[0].push(i+'月应发');
  rows[0]=rows[0].concat(['全年应发','全年申请','考勤扣款','事假扣款','年终扣款']);
  DB.persons.forEach(function(p){
    var row=[p.name];var yt=0,ya=0,at=0,lv=0,yd=0;
    for(var i=1;i<=12;i++){var ap=DB.approvals.find(function(a){return a.personId===p.id&&a.year===fy&&a.month===i;});var dec=DB.declarations.filter(function(d){return d.personId===p.id&&d.year===fy&&d.month===i;}).reduce(function(s,d){return s+(Number(d.appliedAmount)||0);},0);row.push(ap?ap.finalPayable:'');yt+=ap?ap.finalPayable:0;ya+=dec;at+=ap?ap.attendanceDeduction:0;lv+=ap?ap.personalLeaveDeduction:0;yd+=ap?ap.yearEndDeduction:0;}
    row=row.concat([yt.toFixed(2),ya.toFixed(2),at.toFixed(2),lv.toFixed(2),yd.toFixed(2)]);
    rows.push(row);
  });
  download('年度台账_'+fy+'年.csv','\ufeff'+toCSV(rows),'text/csv');
  toast('已导出年度台账CSV');
}
function exportBackup(){
  download('绩效协同台_全量备份_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(DB,null,2));
  toast('已导出全量备份');
}
function importBackup(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var d=JSON.parse(ev.target.result);
      if(!d.persons||!d.projects){toast('文件格式不正确');return;}
      if(!confirm('导入将覆盖当前全部数据，确认继续？'))return;
      DB=d;save();toast('导入成功');render(CUR_VIEW);
    }catch(err){toast('导入失败：'+err.message);}
  };
  reader.readAsText(file);
  e.target.value='';
}
function resetData(){
  if(!confirm('将清除所有数据并恢复为示例数据，确认？'))return;
  DB=defaultData();save();toast('已重置为示例数据');render(CUR_VIEW);
}

/* ---------- 弹窗 ---------- */
function openModal(title,body,btnText,onOk){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=body;
  var foot=document.getElementById('modalFoot');
  foot.innerHTML='<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="modalOk">'+btnText+'</button>';
  document.getElementById('modalOk').onclick=onOk;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}
document.getElementById('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal();});

/* ---------- 初始化 ---------- */
render('dashboard');
</script>
