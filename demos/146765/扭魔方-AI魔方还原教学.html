<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扭魔方 - AI魔方还原教学</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0e12;
  --bg-2: #0d1117;
  --panel: rgba(22, 27, 34, 0.88);
  --border: rgba(48, 54, 61, 0.8);
  --cyan: #00e5ff;
  --green: #00e676;
  --yellow: #ffd600;
  --red: #ff1744;
  --orange: #ff6d00;
  --text: #c9d1d9;
  --text-dim: #8b949e;
}
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: "Microsoft YaHei", "Consolas", sans-serif;
  background: radial-gradient(ellipse at 50% 30%, #161b22 0%, #0d1117 50%, #06090c 100%);
  position: relative;
  color: var(--text);
}
/* 背景网格 */
.grid-bg {
  position: fixed; inset: 0; opacity: 0.12; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(0,229,255,0.15) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.15) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
}
/* 光晕球 */
.glow-orb {
  position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0;
  animation: orbFloat 8s ease-in-out infinite;
}
.glow-1 { width: 300px; height: 300px; background: rgba(0,229,255,0.15); top: 10%; left: 15%; }
.glow-2 { width: 260px; height: 260px; background: rgba(0,230,118,0.12); bottom: 15%; right: 20%; animation-delay: -3s; }
@keyframes orbFloat { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-20px); } }
/* 扫描线 */
.scan-line {
  position: fixed; left: 0; right: 0; height: 2px; z-index: 1;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  animation: scan 5s linear infinite; opacity: 0.35; pointer-events: none;
  box-shadow: 0 0 10px var(--cyan);
}
@keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

/* 头部 */
.header {
  position: relative; z-index: 10;
  display: flex; align-items: center; justify-content: center; gap: 14px;
  padding: 16px;
}
.header-logo {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--cyan), var(--green));
  border-radius: 10px;
  box-shadow: 0 4px 16px rgba(0,229,255,0.35);
}
.header-logo svg { width: 22px; height: 22px; color: #0a0e12; }
.header-text h1 {
  font-size: 28px; font-weight: 800; letter-spacing: 6px;
  background: linear-gradient(90deg, var(--cyan), var(--green), var(--yellow));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  line-height: 1;
}
.header-text p { font-size: 11px; color: var(--text-dim); margin-top: 4px; letter-spacing: 3px; }

/* 主区域 */
.main {
  position: absolute; top: 78px; bottom: 96px; left: 0; right: 0;
  display: flex; gap: 16px; padding: 0 18px; z-index: 5;
}

/* 魔方舞台 */
.cube-stage {
  flex: 1; display: flex; align-items: center; justify-content: center;
  position: relative; perspective: 1400px;
}
/* HUD 角标 */
.stage-hud {
  position: absolute; inset: 0; pointer-events: none;
}
.hud-corner {
  position: absolute; width: 28px; height: 28px;
  border: 2px solid var(--cyan); opacity: 0.5;
}
.hud-corner.tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
.hud-corner.tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
.hud-corner.bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
.hud-corner.br { bottom: 12px; right: 12px; border-left: none; border-top: none; }
.hud-label {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  font-size: 10px; color: var(--cyan); letter-spacing: 3px; opacity: 0.7;
  background: rgba(0,229,255,0.08); padding: 4px 12px; border-radius: 12px;
  border: 1px solid rgba(0,229,255,0.2);
}
.hud-info {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 16px; font-size: 10px; color: var(--text-dim); letter-spacing: 1px;
}
.hud-info span { color: var(--cyan); }

.cube-container {
  width: 210px; height: 210px;
  transform-style: preserve-3d;
  transform: rotateX(-25deg) rotateY(-35deg);
  transition: transform 0.1s;
  cursor: grab;
  filter: drop-shadow(0 20px 40px rgba(0,229,255,0.15));
}
.cube-container.dragging { cursor: grabbing; transition: none; }
.cube-container.spinning { filter: drop-shadow(0 20px 50px rgba(0,229,255,0.3)); }
.face {
  position: absolute; width: 210px; height: 210px;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  gap: 4px; padding: 4px;
  background: #06090c; border: 2px solid #1a1f24; border-radius: 8px;
  backface-visibility: visible;
}
.sticker {
  border-radius: 6px;
  box-shadow: inset 0 0 10px rgba(0,0,0,0.4), inset 3px 3px 6px rgba(255,255,255,0.2), inset -2px -2px 4px rgba(0,0,0,0.3);
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.sticker::after {
  content: '';
  position: absolute;
  top: 8%; left: 12%;
  width: 35%; height: 35%;
  background: radial-gradient(ellipse, rgba(255,255,255,0.35), transparent 70%);
  border-radius: 50%;
}
.face-U { transform: translateZ(105px); }
.face-D { transform: rotateX(180deg) translateZ(105px); }
.face-F { transform: rotateY(0deg) translateZ(105px); }
.face-B { transform: rotateY(180deg) translateZ(105px); }
.face-L { transform: rotateY(-90deg) translateZ(105px); }
.face-R { transform: rotateY(90deg) translateZ(105px); }

/* 侧边面板 */
.side-panel {
  width: 310px; display: flex; flex-direction: column; gap: 12px;
}
.panel-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  backdrop-filter: blur(10px);
  position: relative;
  overflow: hidden;
}
.panel-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: 0.6;
}
.panel-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--cyan); margin-bottom: 12px; letter-spacing: 2px;
  font-weight: 600; text-transform: uppercase;
  padding-bottom: 8px; border-bottom: 1px solid rgba(0,229,255,0.15);
}
.panel-title svg { width: 16px; height: 16px; }
.panel-title .badge {
  margin-left: auto; font-size: 10px; color: var(--text-dim);
  background: rgba(0,229,255,0.08); padding: 2px 8px; border-radius: 10px;
  letter-spacing: 1px;
}

/* 公式显示 */
.step-desc {
  font-size: 12px; color: var(--text-dim); margin-bottom: 10px; line-height: 1.6;
}
.formula-display {
  background: linear-gradient(135deg, #06090c, #0d1117);
  border: 1px solid var(--border); border-radius: 10px; padding: 14px;
  font-family: "Consolas", "Courier New", monospace; font-size: 18px;
  text-align: center; letter-spacing: 4px; min-height: 28px;
  position: relative; overflow: hidden;
}
.formula-display::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(0,230,118,0.08), transparent);
  animation: formulaShimmer 3s infinite;
}
@keyframes formulaShimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.formula-display .hl {
  color: var(--green); font-weight: bold;
  text-shadow: 0 0 8px rgba(0,230,118,0.5);
  display: inline-block; animation: formulaPop 0.3s;
}
@keyframes formulaPop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }
.formula-legend {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
  font-size: 10px; color: var(--text-dim);
}
.formula-legend span {
  background: rgba(0,229,255,0.06); padding: 2px 7px; border-radius: 8px;
  border: 1px solid rgba(0,229,255,0.12);
}

/* 数据统计 */
.stats-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
}
.stat-card {
  background: rgba(0,0,0,0.3); border-radius: 10px; padding: 10px 6px;
  text-align: center; border: 1px solid var(--border);
  transition: transform 0.2s;
}
.stat-card:hover { transform: translateY(-2px); }
.stat-card .stat-icon { width: 18px; height: 18px; margin: 0 auto 4px; color: var(--cyan); opacity: 0.7; }
.stat-card .num { font-size: 22px; font-weight: 800; color: var(--cyan); line-height: 1; }
.stat-card .lbl { font-size: 9px; color: var(--text-dim); margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; }
.stat-card.active .num { color: var(--green); text-shadow: 0 0 10px rgba(0,230,118,0.4); }

/* 完成度进度条 */
.progress-wrap { margin-top: 12px; }
.progress-label { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim); margin-bottom: 4px; letter-spacing: 1px; }
.progress-bar { height: 8px; background: rgba(0,0,0,0.4); border-radius: 4px; overflow: hidden; position: relative; }
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--cyan), var(--green));
  border-radius: 4px; transition: width 0.5s ease;
  box-shadow: 0 0 10px rgba(0,229,255,0.4); position: relative;
}
.progress-fill::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: progressShimmer 2s infinite;
}
@keyframes progressShimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

/* 操作按钮 */
.action-btns { display: flex; gap: 8px; margin-top: 12px; }
.action-btn {
  flex: 1; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 12px;
  border: 1px solid; letter-spacing: 2px; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-family: inherit; font-weight: 600;
}
.action-btn svg { width: 14px; height: 14px; }
.btn-scramble { background: rgba(255,23,68,0.12); border-color: rgba(255,23,68,0.4); color: var(--red); }
.btn-scramble:hover { background: var(--red); color: #fff; box-shadow: 0 4px 14px rgba(255,23,68,0.4); }
.btn-solve { background: rgba(0,230,118,0.12); border-color: rgba(0,230,118,0.4); color: var(--green); }
.btn-solve:hover { background: var(--green); color: #0a0e12; box-shadow: 0 4px 14px rgba(0,230,118,0.4); }

/* 色块说明 */
.color-legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.legend-item {
  display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim);
  background: rgba(0,0,0,0.2); padding: 6px 8px; border-radius: 8px;
}
.legend-dot {
  width: 16px; height: 16px; border-radius: 4px;
  box-shadow: inset 0 0 6px rgba(0,0,0,0.4), inset 2px 2px 3px rgba(255,255,255,0.2);
}

/* 步骤进度条 */
.steps-bar {
  position: absolute; bottom: 16px; left: 18px; right: 18px; z-index: 10;
  display: flex; gap: 4px; justify-content: center; align-items: center;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 14px; padding: 10px 14px; backdrop-filter: blur(10px);
}
.step-btn {
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px;
  background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--text-dim);
  letter-spacing: 1px; transition: all 0.25s; position: relative;
  font-family: inherit;
}
.step-btn:hover { border-color: var(--cyan); color: var(--cyan); transform: translateY(-2px); }
.step-btn.active {
  background: linear-gradient(135deg, var(--cyan), var(--green));
  color: #0a0e12; border-color: transparent; font-weight: bold;
  box-shadow: 0 4px 16px rgba(0,229,255,0.4);
}
.step-btn.done { border-color: rgba(0,230,118,0.4); color: var(--green); }
.step-btn.done::after {
  content: '✓'; position: absolute; top: -4px; right: -4px;
  width: 14px; height: 14px; background: var(--green); color: #0a0e12;
  border-radius: 50%; font-size: 9px; display: flex; align-items: center; justify-content: center;
  font-weight: bold;
}
.step-connector {
  width: 16px; height: 2px; background: var(--border); border-radius: 1px;
  transition: background 0.3s;
}
.step-connector.active { background: var(--green); box-shadow: 0 0 6px rgba(0,230,118,0.5); }

/* Toast */
.toast {
  position: fixed; top: 90px; left: 50%; transform: translateX(-50%) translateY(-20px);
  background: rgba(13,17,23,0.95); color: var(--cyan);
  padding: 10px 24px; border-radius: 24px; font-size: 13px; letter-spacing: 2px;
  opacity: 0; transition: all 0.3s; z-index: 100;
  border: 1px solid rgba(0,229,255,0.3); box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 1000px) {
  .main { flex-direction: column; top: 72px; bottom: 88px; }
  .side-panel { width: 100%; flex-direction: row; max-height: 220px; }
  .panel-card { flex: 1; }
  .steps-bar { flex-wrap: wrap; }
  .step-connector { display: none; }
  .header-text h1 { font-size: 20px; letter-spacing: 4px; }
}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow-orb glow-1"></div>
<div class="glow-orb glow-2"></div>
<div class="scan-line"></div>

<div class="header">
  <div class="header-logo">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16.5c0 .38-.21.71-.53.88l-7.9 4.44c-.16.12-.36.18-.57.18s-.41-.06-.57-.18l-7.9-4.44A.991.991 0 013 16.5v-9c0-.38.21-.71.53-.88l7.9-4.44c.16-.12.36-.18.57-.18s.41.06.57.18l7.9 4.44c.32.17.53.5.53.88v9zM12 4.15L6.04 7.5 12 10.85l5.96-3.35L12 4.15zM5 15.91l6 3.38v-6.71L5 9.21v6.7zm14 0v-6.7l-6 3.37v6.71l6-3.38z"/></svg>
  </div>
  <div class="header-text">
    <h1>扭 魔 方</h1>
    <p>CUBE SOLVER · STEP BY STEP</p>
  </div>
</div>

<div class="main">
  <div class="cube-stage">
    <div class="stage-hud">
      <div class="hud-corner tl"></div>
      <div class="hud-corner tr"></div>
      <div class="hud-corner bl"></div>
      <div class="hud-corner br"></div>
      <div class="hud-label">3D VIEW · DRAG TO ROTATE</div>
      <div class="hud-info">
        <div>FPS: <span id="fpsVal">60</span></div>
        <div>视角: <span id="angleVal">-25° / -35°</span></div>
      </div>
    </div>
    <div class="cube-container" id="cubeContainer">
      <div class="face face-U" id="faceU"></div>
      <div class="face face-D" id="faceD"></div>
      <div class="face face-F" id="faceF"></div>
      <div class="face face-B" id="faceB"></div>
      <div class="face face-L" id="faceL"></div>
      <div class="face face-R" id="faceR"></div>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-card">
      <div class="panel-title">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        当前步骤
        <span class="badge" id="stepBadge">1 / 6</span>
      </div>
      <div class="step-desc" id="stepDesc">在白色面拼出十字，作为还原的基础</div>
      <div class="formula-display" id="formulaDisplay">请选择步骤</div>
      <div class="formula-legend">
        <span>R 右面顺</span><span>R' 右面逆</span><span>U 上面顺</span><span>U' 上面逆</span><span>F 前面顺</span><span>F' 前面逆</span>
      </div>
    </div>

    <div class="panel-card">
      <div class="panel-title">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
        训练数据
      </div>
      <div class="stats-grid">
        <div class="stat-card" id="statStep">
          <div class="stat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5H1v16c0 1.1.9 2 2 2h16v-2H3V5zm18-4H7c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm-7 12h-2V3h2v10zm4-4h-2V3h2v6zm-8 4H8V7h2v6z"/></svg></div>
          <div class="num" id="stepNum">1</div>
          <div class="lbl">步骤</div>
        </div>
        <div class="stat-card" id="statMove">
          <div class="stat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg></div>
          <div class="num" id="moveNum">0</div>
          <div class="lbl">步数</div>
        </div>
        <div class="stat-card" id="statTimer">
          <div class="stat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg></div>
          <div class="num" id="timer">00:00</div>
          <div class="lbl">用时</div>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-label"><span>还原进度</span><span id="progressText">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
      <div class="action-btns">
        <button class="action-btn btn-scramble" id="scrambleBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.83 13.41l1.42 1.41-1.42 1.42L13.41 14.83l-1.41 1.41-1.41-1.41 1.41-1.42L9.59 12l1.41-1.41-1.41-1.42 1.41-1.41 1.41 1.41 1.42-1.41 1.41 1.41-1.41 1.42L14.83 13.41zM19.07 4.93L17.66 6.34C19.1 7.79 20 9.79 20 12s-.9 4.21-2.34 5.66l1.41 1.41C20.9 17.24 22 14.74 22 12s-1.1-5.24-2.93-7.07z"/></svg>
          打 乱
        </button>
        <button class="action-btn btn-solve" id="solveBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          一键还原
        </button>
      </div>
    </div>

    <div class="panel-card">
      <div class="panel-title">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10 10-4.49 10-10S17.51 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
        色块对照
      </div>
      <div class="color-legend">
        <div class="legend-item"><span class="legend-dot" style="background:#f5f5f5;"></span>U 白</div>
        <div class="legend-item"><span class="legend-dot" style="background:#ffd600;"></span>D 黄</div>
        <div class="legend-item"><span class="legend-dot" style="background:#00e676;"></span>F 绿</div>
        <div class="legend-item"><span class="legend-dot" style="background:#00e5ff;"></span>B 青</div>
        <div class="legend-item"><span class="legend-dot" style="background:#ff6d00;"></span>L 橙</div>
        <div class="legend-item"><span class="legend-dot" style="background:#ff1744;"></span>R 红</div>
      </div>
    </div>
  </div>
</div>

<div class="steps-bar" id="stepsBar"></div>

<div class="toast" id="toast"></div>

<script>
var COLORS = { U: "#f5f5f5", D: "#ffd600", F: "#00e676", B: "#00e5ff", L: "#ff6d00", R: "#ff1744" };
var steps = [
  { name: "白十字", formula: "F R U R' U' F'", desc: "在白色面拼出十字，作为还原的基础" },
  { name: "白面", formula: "R U R' U'", desc: "完成白色面及第一层角块归位" },
  { name: "第二层", formula: "U R U' R' U' F' U F", desc: "还原中间层棱块，完成两层" },
  { name: "黄十字", formula: "F R U R' U' F'", desc: "在黄色面拼出十字图案" },
  { name: "黄面", formula: "R U R' U R U2 R'", desc: "完成黄色面，顶层全部归位" },
  { name: "角块归位", formula: "R' F R' B2 R F' R' B2 R2", desc: "归位顶层角块，魔方完全还原" }
];
var curStep = 0, moveCount = 0, isAnimating = false;
var startTime = null, timerInterval = null;
var completedSteps = new Set();

function buildCube() {
  ["U", "D", "F", "B", "L", "R"].forEach(function(f) {
    var el = document.getElementById("face" + f);
    el.innerHTML = "";
    for (var i = 0; i < 9; i++) {
      var s = document.createElement("div");
      s.className = "sticker";
      s.style.background = COLORS[f];
      el.appendChild(s);
    }
  });
}

function buildStepsBar() {
  var bar = document.getElementById("stepsBar");
  bar.innerHTML = "";
  steps.forEach(function(s, i) {
    var btn = document.createElement("button");
    btn.className = "step-btn" + (i === 0 ? " active" : "");
    btn.dataset.step = i;
    btn.textContent = s.name;
    btn.addEventListener("click", function() { selectStep(i); });
    bar.appendChild(btn);
    if (i < steps.length - 1) {
      var conn = document.createElement("div");
      conn.className = "step-connector";
      bar.appendChild(conn);
    }
  });
}

function selectStep(stepIdx) {
  if (isAnimating) return;
  document.querySelectorAll(".step-btn").forEach(function(b, i) {
    b.classList.remove("active");
    if (completedSteps.has(i)) b.classList.add("done");
  });
  document.querySelector('.step-btn[data-step="' + stepIdx + '"]').classList.add("active");
  curStep = stepIdx;
  document.getElementById("stepNum").textContent = curStep + 1;
  document.getElementById("stepBadge").textContent = (curStep + 1) + " / 6";
  document.getElementById("stepDesc").textContent = steps[curStep].desc;
  highlightFormula(steps[curStep].formula);
  animateStep(curStep);
  updateProgress();
}

function highlightFormula(formula) {
  var display = document.getElementById("formulaDisplay");
  var parts = formula.split(" ");
  display.innerHTML = parts.map(function(p) {
    return '<span class="hl">' + p + '</span>';
  }).join(" ");
}

function animateStep(stepIdx) {
  if (isAnimating) return;
  isAnimating = true;
  var container = document.getElementById("cubeContainer");
  container.classList.add("spinning");
  var baseX = -25, baseY = -35;
  var rotations = [
    { x: baseX - 15, y: baseY + 20 },
    { x: baseX + 10, y: baseY - 10 },
    { x: baseX - 20, y: baseY + 30 },
    { x: baseX + 25, y: baseY + 20 },
    { x: baseX + 30, y: baseY },
    { x: baseX + 20, y: baseY - 30 }
  ];
  var r = rotations[stepIdx];
  var step = 0;
  var totalSteps = 30;
  var startX = rotX, startY = rotY;

  var spinAnim = function() {
    if (step <= totalSteps) {
      var t = step / totalSteps;
      var ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      var extraSpin = ease * 180;
      var cx = startX + (r.x - startX) * ease;
      var cy = startY + (r.y - startY) * ease + extraSpin * 0.5;
      container.style.transform = "rotateX(" + cx + "deg) rotateY(" + cy + "deg)";
      rotX = cx; rotY = cy;
      step++;
      requestAnimationFrame(spinAnim);
    } else {
      container.style.transform = "rotateX(" + r.x + "deg) rotateY(" + r.y + "deg)";
      rotX = r.x; rotY = r.y;
      flashStickers(stepIdx);
      container.classList.remove("spinning");
      isAnimating = false;
      completedSteps.add(stepIdx);
      updateAngleDisplay();
    }
  };
  spinAnim();
  moveCount += steps[stepIdx].formula.split(" ").length;
  document.getElementById("moveNum").textContent = moveCount;
  if (!startTime) { startTime = Date.now(); startTimer(); }
}

function flashStickers(stepIdx) {
  var faceMap = [["U"], ["U"], ["F", "L", "R", "B"], ["D"], ["D"], ["U", "D"]];
  var faces = faceMap[stepIdx] || ["U"];
  faces.forEach(function(f) {
    var el = document.getElementById("face" + f);
    var stickers = el.querySelectorAll(".sticker");
    stickers.forEach(function(s, i) {
      setTimeout(function() {
        s.style.transform = "scale(1.18)";
        s.style.filter = "brightness(1.6)";
        setTimeout(function() {
          s.style.transform = "";
          s.style.filter = "";
        }, 300);
      }, i * 35);
    });
  });
}

function updateProgress() {
  var pct = Math.round(completedSteps.size / 6 * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = pct + "%";
  document.querySelectorAll(".stat-card").forEach(function(c) { c.classList.toggle("active", pct > 0); });
  document.querySelectorAll(".step-connector").forEach(function(c, i) {
    c.classList.toggle("active", completedSteps.has(i));
  });
}

function updateAngleDisplay() {
  document.getElementById("angleVal").textContent = Math.round(rotX) + "° / " + Math.round(rotY) + "°";
}

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function() { t.classList.remove("show"); }, 1800);
}

document.getElementById("scrambleBtn").addEventListener("click", function() {
  if (isAnimating) return;
  var container = document.getElementById("cubeContainer");
  container.classList.add("spinning");
  var stickers = document.querySelectorAll(".sticker");
  stickers.forEach(function(s) {
    var faces = Object.values(COLORS);
    s.style.background = faces[Math.floor(Math.random() * faces.length)];
    s.style.transition = "background 0.15s";
  });
  var rot = 0;
  isAnimating = true;
  var scrambleAnim = function() {
    if (rot < 720) {
      rot += 40;
      var nx = Math.sin(rot * 0.05) * 20;
      var ny = rot;
      container.style.transform = "rotateX(" + nx + "deg) rotateY(" + ny + "deg)";
      rotX = nx; rotY = ny;
      requestAnimationFrame(scrambleAnim);
    } else {
      container.style.transform = "rotateX(-25deg) rotateY(-35deg)";
      rotX = -25; rotY = -35;
      container.classList.remove("spinning");
      isAnimating = false;
      moveCount = 0;
      document.getElementById("moveNum").textContent = "0";
      completedSteps.clear();
      document.querySelectorAll(".step-btn").forEach(function(b) {
        b.classList.remove("active", "done");
      });
      document.querySelector('.step-btn[data-step="0"]').classList.add("active");
      curStep = 0;
      document.getElementById("stepNum").textContent = "1";
      document.getElementById("stepBadge").textContent = "1 / 6";
      document.getElementById("stepDesc").textContent = steps[0].desc;
      document.getElementById("formulaDisplay").innerHTML = '<span class="hl">已打乱 · 请选择步骤</span>';
      startTime = null;
      clearInterval(timerInterval);
      document.getElementById("timer").textContent = "00:00";
      updateProgress();
      updateAngleDisplay();
      showToast("魔方已打乱");
    }
  };
  scrambleAnim();
});

document.getElementById("solveBtn").addEventListener("click", function() {
  if (isAnimating) return;
  buildCube();
  var container = document.getElementById("cubeContainer");
  container.classList.add("spinning");
  var step = 0;
  isAnimating = true;
  var solveAnim = function() {
    if (step <= 60) {
      var t = step / 60;
      var ease = 1 - Math.pow(1 - t, 3);
      var cx = -25 + Math.sin(t * Math.PI * 2) * 15 * (1 - ease);
      var cy = -35 + 360 * ease;
      container.style.transform = "rotateX(" + cx + "deg) rotateY(" + cy + "deg)";
      rotX = cx; rotY = cy;
      step++;
      requestAnimationFrame(solveAnim);
    } else {
      container.style.transform = "rotateX(-25deg) rotateY(-35deg)";
      rotX = -25; rotY = -35;
      container.classList.remove("spinning");
      isAnimating = false;
      completedSteps = new Set([0, 1, 2, 3, 4, 5]);
      document.querySelectorAll(".step-btn").forEach(function(b) {
        b.classList.remove("active");
        b.classList.add("done");
      });
      document.querySelector('.step-btn[data-step="5"]').classList.add("active");
      moveCount = 0;
      document.getElementById("moveNum").textContent = "0";
      document.getElementById("formulaDisplay").innerHTML = '<span class="hl">已还原 ✓</span>';
      document.getElementById("stepDesc").textContent = "恭喜！魔方已完全还原";
      clearInterval(timerInterval);
      startTime = null;
      updateProgress();
      updateAngleDisplay();
      showToast("魔方已还原");
    }
  };
  solveAnim();
});

var isDragging = false, startX = 0, startY = 0, rotX = -25, rotY = -35;
var container = document.getElementById("cubeContainer");
container.addEventListener("mousedown", function(e) {
  if (isAnimating) return;
  isDragging = true;
  startX = e.clientX; startY = e.clientY;
  container.classList.add("dragging");
});
document.addEventListener("mousemove", function(e) {
  if (!isDragging) return;
  var dx = e.clientX - startX;
  var dy = e.clientY - startY;
  rotY += dx * 0.5;
  rotX -= dy * 0.5;
  rotX = Math.max(-80, Math.min(80, rotX));
  container.style.transform = "rotateX(" + rotX + "deg) rotateY(" + rotY + "deg)";
  startX = e.clientX; startY = e.clientY;
  updateAngleDisplay();
});
document.addEventListener("mouseup", function() {
  isDragging = false;
  container.classList.remove("dragging");
});
container.addEventListener("touchstart", function(e) {
  if (isAnimating || e.touches.length === 0) return;
  isDragging = true;
  startX = e.touches[0].clientX; startY = e.touches[0].clientY;
  container.classList.add("dragging");
});
document.addEventListener("touchmove", function(e) {
  if (!isDragging || e.touches.length === 0) return;
  var dx = e.touches[0].clientX - startX;
  var dy = e.touches[0].clientY - startY;
  rotY += dx * 0.5; rotX -= dy * 0.5;
  rotX = Math.max(-80, Math.min(80, rotX));
  container.style.transform = "rotateX(" + rotX + "deg) rotateY(" + rotY + "deg)";
  startX = e.touches[0].clientX; startY = e.touches[0].clientY;
  updateAngleDisplay();
});
document.addEventListener("touchend", function() {
  isDragging = false;
  container.classList.remove("dragging");
});

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(function() {
    var elapsed = Math.floor((Date.now() - startTime) / 1000);
    var m = String(Math.floor(elapsed / 60)).padStart(2, "0");
    var s = String(elapsed % 60).padStart(2, "0");
    document.getElementById("timer").textContent = m + ":" + s;
  }, 1000);
}

// FPS 模拟
var fpsBase = 60;
setInterval(function() {
  var fps = fpsBase + Math.floor(Math.random() * 5 - 2);
  document.getElementById("fpsVal").textContent = fps;
}, 1000);

buildCube();
buildStepsBar();
highlightFormula(steps[0].formula);
updateAngleDisplay();
</script>
</body>
</html>
