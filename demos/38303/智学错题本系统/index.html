<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智学错题本 - AI智能错题整理与复习</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- 顶部导航 -->
    <div class="app-header">
      <div class="header-left">
        <span class="header-title" id="headerTitle">智学错题本</span>
      </div>
      <div class="user-info">
        <span id="userName">小明同学</span>
        <span class="user-avatar" id="userAvatar">📚</span>
      </div>
    </div>

    <!-- 页面内容 -->
    <div class="page-content">
      <!-- ==================== 首页 ==================== -->
      <div id="page-home" class="page active">
        <!-- 打卡卡片 -->
        <div class="checkin-card">
          <div class="checkin-info">
            <h2 id="checkinStreak">连续打卡 5 天</h2>
            <p id="checkinTotal">累计学习 12 天 · 加油！</p>
          </div>
          <button class="checkin-btn" id="checkinBtn" onclick="App.checkIn()">今日打卡</button>
        </div>

        <!-- 统计网格 -->
        <div class="stat-grid">
          <div class="stat-card blue">
            <div class="stat-num" id="statTotal">0</div>
            <div class="stat-label">错题总数</div>
          </div>
          <div class="stat-card green">
            <div class="stat-num" id="statMastered">0</div>
            <div class="stat-label">已掌握</div>
          </div>
          <div class="stat-card orange">
            <div class="stat-num" id="statLearning">0</div>
            <div class="stat-label">学习中</div>
          </div>
          <div class="stat-card purple">
            <div class="stat-num" id="statMastery">0%</div>
            <div class="stat-label">掌握率</div>
          </div>
        </div>

        <!-- 今日复习 -->
        <div class="review-banner" id="reviewBanner">
          <div class="review-info">
            <span class="review-icon">📝</span>
            <div class="review-text">
              <h3 id="reviewTitle">今日待复习</h3>
              <p id="reviewDesc">0 道错题需要复习</p>
            </div>
          </div>
          <button class="btn btn-sm btn-orange" onclick="App.startReview()">开始复习</button>
        </div>

        <!-- 学习曲线 -->
        <div class="card">
          <div class="card-title">
            <span>📊 近7天学习</span>
            <span class="text-sm text-light" id="weekTotal">本周 0 分钟</span>
          </div>
          <div class="chart-container" id="weekChart"></div>
        </div>

        <!-- 最近添加 -->
        <div class="card">
          <div class="card-title">
            <span>🕐 最近添加</span>
            <span class="text-sm text-light" style="cursor:pointer;color:var(--primary);" onclick="App.switchTab('questions')">查看全部</span>
          </div>
          <div id="recentQuestions"></div>
        </div>
      </div>

      <!-- ==================== 错题本 ==================== -->
      <div id="page-questions" class="page">
        <div class="flex-between mb-10">
          <h2>错题本</h2>
          <span class="text-sm text-light" id="questionCount">0 道</span>
        </div>
        <!-- 筛选 -->
        <div class="flex gap-8 mb-10" style="flex-wrap:wrap;">
          <select id="filterSubject" onchange="App.renderQuestions()" style="padding:6px 12px;border:1.5px solid var(--border);border-radius:50px;font-size:13px;background:white;">
            <option value="">全部学科</option>
          </select>
          <select id="filterStatus" onchange="App.renderQuestions()" style="padding:6px 12px;border:1.5px solid var(--border);border-radius:50px;font-size:13px;background:white;">
            <option value="">全部状态</option>
            <option value="learning">学习中</option>
            <option value="mastered">已掌握</option>
          </select>
          <input id="searchInput" oninput="App.renderQuestions()" placeholder="搜索错题..." style="flex:1;min-width:120px;padding:6px 12px;border:1.5px solid var(--border);border-radius:50px;font-size:13px;">
        </div>
        <div id="questionList"></div>
      </div>

      <!-- ==================== 复习模式 ==================== -->
      <div id="page-review" class="page">
        <div id="reviewContainer"></div>
      </div>

      <!-- ==================== 统计分析 ==================== -->
      <div id="page-stats" class="page">
        <h2 class="mb-10">学习统计</h2>
        <!-- 掌握率环形图 -->
        <div class="card text-center">
          <div class="card-title"><span>🎯 总体掌握率</span></div>
          <div class="mastery-ring" id="masteryRing"></div>
          <p class="text-sm text-light" id="masteryDetail"></p>
        </div>
        <!-- 学科分布 -->
        <div class="card">
          <div class="card-title"><span>📚 学科分布</span></div>
          <div id="subjectProgress"></div>
        </div>
        <!-- 错误类型 -->
        <div class="card">
          <div class="card-title"><span>⚠️ 错误类型分析</span></div>
          <ul class="error-type-list" id="errorTypeList"></ul>
        </div>
        <!-- 学习记录 -->
        <div class="card">
          <div class="card-title"><span>📖 学习记录</span></div>
          <div id="studyLogList"></div>
        </div>
      </div>
    </div>

    <!-- 悬浮添加按钮 -->
    <button class="add-fab" onclick="App.showAddModal()">+</button>

    <!-- 底部 Tab -->
    <div class="tab-bar">
      <div class="tab-item active" onclick="App.switchTab('home')">
        <span class="tab-icon">🏠</span>首页
      </div>
      <div class="tab-item" onclick="App.switchTab('questions')">
        <span class="tab-icon">📓</span>错题本
      </div>
      <div class="tab-item" onclick="App.switchTab('review')">
        <span class="tab-icon">🔄</span>复习
      </div>
      <div class="tab-item" onclick="App.switchTab('stats')">
        <span class="tab-icon">📊</span>统计
      </div>
    </div>
  </div>

  <!-- 弹窗区域 -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- JS -->
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/main.js"></script>
  <script>
    Store.init();
    App.init();
  </script>
</body>
</html>
