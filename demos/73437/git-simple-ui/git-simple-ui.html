<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笔记仓库</title>
<style>
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --surface: #1c2333;
    --ink: #e6edf3;
    --muted: #8b949e;
    --rule: #30363d;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --danger: #f85149;
    --warning: #d29922;
    --radius: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .app {
    width: 100%;
    max-width: 600px;
    background: var(--bg2);
    border: 1px solid var(--rule);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  /* 仓库地址 */
  .repo-row {
    padding: 20px 24px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .repo-row label {
    font-size: 14px;
    color: var(--muted);
    font-weight: 500;
    white-space: nowrap;
  }
  .repo-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 10px 14px;
    color: var(--ink);
    font-size: 13px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    outline: none;
    transition: border-color 0.2s;
  }
  .repo-row input:focus {
    border-color: var(--accent);
  }
  .repo-row input::placeholder {
    color: var(--muted);
    opacity: 0.5;
  }

  /* 按钮区 */
  .actions {
    padding: 16px 24px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    border-bottom: 1px solid var(--rule);
  }
  .action-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 10px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    color: var(--ink);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 14px;
    font-weight: 500;
    position: relative;
    overflow: hidden;
  }
  .action-btn:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .action-btn:active {
    transform: translateY(0);
  }
  .action-btn .icon {
    font-size: 18px;
    line-height: 1;
  }
  .action-btn.loading { pointer-events: none; opacity: 0.7; }
  .action-btn.loading::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    animation: loading-bar 1.5s ease-in-out infinite;
  }
  @keyframes loading-bar {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* 控制台 */
  .console {
    padding: 0;
  }
  .console-header {
    padding: 8px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
  }
  .console-header .clear-btn {
    background: none;
    border: 1px solid var(--rule);
    color: var(--muted);
    padding: 3px 10px;
    border-radius: var(--radius);
    font-size: 11px;
    cursor: pointer;
  }
  .console-header .clear-btn:hover {
    border-color: var(--muted);
    color: var(--ink);
  }
  .console-body {
    padding: 14px 24px 18px;
    min-height: 200px;
    max-height: 340px;
    overflow-y: auto;
    background: var(--bg);
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--muted);
  }
  .console-body::-webkit-scrollbar { width: 6px; }
  .console-body::-webkit-scrollbar-track { background: transparent; }
  .console-body::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }
  .console-body .prompt { color: var(--accent); font-weight: 500; }
  .console-body .stdout { color: var(--ink); }
  .console-body .stderr { color: var(--danger); }
  .console-body .success { color: var(--accent2); }
  .console-body .timestamp { color: var(--muted); opacity: 0.5; font-size: 11px; }
  .console-body .hash { color: var(--warning); }
  .console-body .ref { color: var(--accent2); }
  .console-body .conflict-file { color: var(--danger); }

  /* 提示条 */
  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 10px 18px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    z-index: 999;
    animation: slideIn 0.3s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    pointer-events: none;
  }
  .toast.success { background: #1a3a2a; color: var(--accent2); border: 1px solid var(--accent2); }
  .toast.error { background: #3a1a1a; color: var(--danger); border: 1px solid var(--danger); }
  .toast.info { background: #1a2a3a; color: var(--accent); border: 1px solid var(--accent); }
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  @media (max-width: 480px) {
    body { padding: 12px; }
    .repo-row { padding: 14px 16px; flex-wrap: wrap; }
    .repo-row input { width: 100%; }
    .actions { padding: 12px 16px; grid-template-columns: 1fr; gap: 8px; }
    .console-body { padding: 12px 16px 14px; min-height: 160px; max-height: 260px; font-size: 12px; }
    .console-header { padding: 6px 16px; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <!-- 1. 笔记仓库地址 -->
  <div class="repo-row">
    <label for="repoPath">笔记仓库地址</label>
    <input type="text" id="repoPath" placeholder="输入 Git 仓库路径..." spellcheck="false" autocomplete="off">
  </div>

  <!-- 2~4. 三个按钮 -->
  <div class="actions">
    <button class="action-btn" data-op="sync">
      <span class="icon">&#128260;</span>
      <span>同步笔记</span>
    </button>
    <button class="action-btn" data-op="latest">
      <span class="icon">&#128203;</span>
      <span>查看最新提交</span>
    </button>
    <button class="action-btn" data-op="conflict">
      <span class="icon">&#9888;</span>
      <span>冲突展示</span>
    </button>
  </div>

  <!-- 控制台 -->
  <div class="console">
    <div class="console-header">
      <span>输出</span>
      <button class="clear-btn" id="clearBtn">清空</button>
    </div>
    <div class="console-body" id="consoleBody">
      输入笔记仓库地址后，点击上方按钮执行操作。
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var DOM = {
    repoPath: document.getElementById('repoPath'),
    consoleBody: document.getElementById('consoleBody'),
    clearBtn: document.getElementById('clearBtn'),
    actionBtns: document.querySelectorAll('.action-btn')
  };

  function timestamp() {
    return new Date().toLocaleTimeString('zh-CN', { hour12: false });
  }

  function write(html) {
    var line = document.createElement('div');
    line.innerHTML = html;
    DOM.consoleBody.appendChild(line);
    DOM.consoleBody.scrollTop = DOM.consoleBody.scrollHeight;
  }

  function escape(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function toast(msg, type) {
    var old = document.querySelector('.toast');
    if (old) old.remove();
    var el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function() { el.remove(); }, 3000);
  }

  function formatLatest(stdout) {
    if (!stdout.trim()) return '<span style="color:var(--muted)">没有提交记录</span>';
    return stdout.split('\n').map(function(line) {
      if (!line.trim()) return '';
      return '<span class="stdout">' +
        escape(line)
          .replace(/([a-f0-9]{7,40})/g, '<span class="hash">$1</span>')
          .replace(/(\([^)]+\))/g, '<span class="ref">$1</span>') +
        '</span>';
    }).join('<br>');
  }

  function formatConflict(stdout, stderr) {
    var out = '<span class="stdout">' + escape(stdout) + '</span>';
    if (stderr.trim()) out += '<br><span class="stderr">' + escape(stderr) + '</span>';
    if (stdout.indexOf('Unmerged') !== -1 || stdout.indexOf('both modified') !== -1 || stdout.indexOf('CONFLICT') !== -1) {
      out += '<br><br><span class="conflict-file">&#9888; 检测到冲突文件！请手动解决后重新提交。</span>';
    } else if (stdout.indexOf('nothing to commit') !== -1) {
      out += '<br><br><span class="success">&#10004; 无冲突，工作区干净。</span>';
    }
    return out;
  }

  function execute(op) {
    var path = DOM.repoPath.value.trim();
    if (!path) { toast('请先输入笔记仓库地址', 'error'); return; }

    var btn = document.querySelector('.action-btn[data-op="' + op + '"]');
    if (btn) btn.classList.add('loading');

    var cmdMap = { sync: 'git pull && git push', latest: 'git log --oneline --graph -15', conflict: 'git status' };
    write('<span class="timestamp">[' + timestamp() + ']</span> <span class="prompt">$</span> <span class="stdout">' + cmdMap[op] + '</span>');

    fetch('/api/git', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ operation: op, repo_path: path })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) {
        write('<span class="timestamp">[' + timestamp() + ']</span> <span class="stderr">&#10006; ' + escape(data.error) + '</span>');
        toast('执行失败', 'error');
        return;
      }
      if (op === 'latest') {
        write(formatLatest(data.stdout));
      } else if (op === 'conflict') {
        write(formatConflict(data.stdout, data.stderr));
      } else {
        if (data.stdout.trim()) write('<span class="stdout">' + escape(data.stdout) + '</span>');
        if (data.stderr.trim()) write('<span class="stderr">' + escape(data.stderr) + '</span>');
      }
      if (data.returncode === 0) {
        write('<span class="timestamp">[' + timestamp() + ']</span> <span class="success">&#10004; 执行成功</span>');
        toast('执行成功', 'success');
      } else {
        toast('执行失败 (code: ' + data.returncode + ')', 'error');
      }
    })
    .catch(function(err) {
      write('<span class="stderr">&#10006; 请求失败: ' + escape(err.message) + '</span>');
      toast('网络请求失败', 'error');
    })
    .finally(function() {
      if (btn) btn.classList.remove('loading');
    });
  }

  DOM.actionBtns.forEach(function(btn) {
    btn.addEventListener('click', function() { execute(this.dataset.op); });
  });

  DOM.clearBtn.addEventListener('click', function() {
    DOM.consoleBody.innerHTML = '';
  });
})();
</script>

</body>
</html>
