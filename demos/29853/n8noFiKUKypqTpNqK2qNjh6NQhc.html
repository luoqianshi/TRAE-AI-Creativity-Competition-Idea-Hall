<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量报告自动生成系统</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00D4FF;
            --secondary: #6366F1;
            --bg-dark: #0F172A;
            --bg-card: #1E293B;
            --bg-hover: #334155;
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --accent: #22D3EE;
            --success: #10B981;
            --warning: #F59E0B;
            --error: #EF4444;
            --border: #475569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景效果 */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(0, 212, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 头部 */
        header {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-top: 10px;
        }

        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--bg-card);
            border-radius: 30px;
            border: 1px solid var(--border);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--error);
        }

        .status-dot.ready {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        .status-item span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }

        /* 上传区域 */
        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .upload-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .upload-card:hover {
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
        }

        .upload-card h3 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upload-card h3 .icon {
            font-size: 1.5rem;
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 15px;
            padding: 50px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: var(--primary);
            background: rgba(0, 212, 255, 0.05);
        }

        .drop-zone input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .drop-zone .drop-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .drop-zone p {
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .drop-zone .hint {
            font-size: 0.85rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .file-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 10px;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .file-info .filename {
            font-family: 'JetBrains Mono', monospace;
            color: var(--primary);
            word-break: break-all;
        }

        .file-info .details {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* 操作区域 */
        .action-section {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border);
            margin-bottom: 40px;
        }

        .btn-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 35px;
            border: none;
            border-radius: 12px;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        /* 进度条 */
        .progress-section {
            margin-top: 30px;
            display: none;
        }

        .progress-section.show {
            display: block;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 8px;
            background: var(--bg-hover);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }

        /* 日志区域 */
        .log-section {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border);
            margin-bottom: 40px;
        }

        .log-section h3 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .log-container {
            background: #0D1117;
            border-radius: 12px;
            padding: 20px;
            height: 300px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.8;
        }

        .log-container::-webkit-scrollbar {
            width: 8px;
        }

        .log-container::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        .log-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .log-line {
            display: flex;
            gap: 15px;
        }

        .log-time {
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .log-level {
            flex-shrink: 0;
            width: 60px;
        }

        .log-level.INFO { color: var(--primary); }
        .log-level.SUCCESS { color: var(--success); }
        .log-level.ERROR { color: var(--error); }
        .log-level.WARNING { color: var(--warning); }

        .log-message {
            color: var(--text-primary);
            word-break: break-all;
        }

        /* 结果区域 */
        .result-section {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border);
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .result-header h3 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: var(--bg-hover);
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .result-item .filename {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
        }

        .result-item .status-icon {
            color: var(--success);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .upload-section {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8rem;
            }

            .status-bar {
                flex-wrap: wrap;
                gap: 15px;
            }

            .btn-row {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* 动画 */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .processing .btn-primary {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">📊</div>
                <h1>批量报告自动生成系统</h1>
            </div>
            <p class="subtitle">Excel脚本 + Word模板 = 批量精准生成56+报告</p>
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-dot" id="excelStatus"></div>
                    <span id="excelStatusText">Excel未上传</span>
                </div>
                <div class="status-item">
                    <div class="status-dot" id="templateStatus"></div>
                    <span id="templateStatusText">模板未上传</span>
                </div>
            </div>
        </header>

        <section class="upload-section">
            <div class="upload-card">
                <h3><span class="icon">📋</span> Excel脚本文件</h3>
                <div class="drop-zone" id="excelDropZone">
                    <input type="file" id="excelInput" accept=".xlsx,.xls">
                    <div class="drop-icon">📁</div>
                    <p>拖拽文件到此处 或 点击选择</p>
                    <span class="hint">支持 .xlsx, .xls 格式</span>
                </div>
                <div class="file-info" id="excelInfo">
                    <div class="filename" id="excelFileName"></div>
                    <div class="details" id="excelDetails"></div>
                </div>
            </div>

            <div class="upload-card">
                <h3><span class="icon">📄</span> Word模板文件</h3>
                <div class="drop-zone" id="templateDropZone">
                    <input type="file" id="templateInput" accept=".docx">
                    <div class="drop-icon">📁</div>
                    <p>拖拽文件到此处 或 点击选择</p>
                    <span class="hint">支持 .docx 格式，占位符格式: {A1}</span>
                </div>
                <div class="file-info" id="templateInfo">
                    <div class="filename" id="templateFileName"></div>
                    <div class="details" id="templateDetails"></div>
                </div>
            </div>
        </section>

        <section class="action-section">
            <div class="btn-row">
                <button class="btn btn-primary" id="generateBtn" disabled>
                    <span>🚀</span> 开始生成报告
                </button>
                <button class="btn btn-secondary" id="downloadAllBtn" disabled>
                    <span>📦</span> 下载全部 (ZIP)
                </button>
                <button class="btn btn-secondary" id="clearBtn">
                    <span>🗑️</span> 清空
                </button>
            </div>
            <div class="progress-section" id="progressSection">
                <div class="progress-header">
                    <span id="progressText">准备中...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </section>

        <section class="log-section">
            <h3><span>📜</span> 处理日志</h3>
            <div class="log-container" id="logContainer">
                <div class="log-line">
                    <span class="log-time">[--:--:--]</span>
                    <span class="log-level">INFO</span>
                    <span class="log-message">等待上传文件...</span>
                </div>
            </div>
        </section>

        <section class="result-section" id="resultSection">
            <div class="result-header">
                <h3><span>✅</span> 生成结果</h3>
                <button class="btn btn-secondary" id="refreshBtn">
                    <span>🔄</span> 刷新列表
                </button>
            </div>
            <div class="result-list" id="resultList"></div>
        </section>
    </div>

    <script>
        // 状态管理
        let excelUploaded = false;
        let templateUploaded = false;
        let generatedFiles = [];
        let logPolling = null;

        // DOM元素
        const excelDropZone = document.getElementById('excelDropZone');
        const templateDropZone = document.getElementById('templateDropZone');
        const excelInput = document.getElementById('excelInput');
        const templateInput = document.getElementById('templateInput');
        const generateBtn = document.getElementById('generateBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const clearBtn = document.getElementById('clearBtn');
        const progressSection = document.getElementById('progressSection');
        const logContainer = document.getElementById('logContainer');
        const resultSection = document.getElementById('resultSection');
        const resultList = document.getElementById('resultList');

        // Excel上传处理
        excelDropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            excelDropZone.classList.add('dragover');
        });

        excelDropZone.addEventListener('dragleave', () => {
            excelDropZone.classList.remove('dragover');
        });

        excelDropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            excelDropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) uploadExcel(file);
        });

        excelInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) uploadExcel(file);
        });

        async function uploadExcel(file) {
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload/excel', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.success) {
                    excelUploaded = true;
                    document.getElementById('excelStatus').classList.add('ready');
                    document.getElementById('excelStatusText').textContent = `已上传 (${result.row_count}条记录)`;
                    document.getElementById('excelFileName').textContent = result.filename;
                    document.getElementById('excelDetails').textContent = `列标题: ${result.headers.join(', ')}`;
                    document.getElementById('excelInfo').classList.add('show');
                    addLog('INFO', `Excel文件上传成功: ${result.filename}`);
                    addLog('INFO', `检测到 ${result.row_count} 条记录`);
                    updateGenerateButton();
                } else {
                    addLog('ERROR', result.error);
                    alert(result.error);
                }
            } catch (error) {
                addLog('ERROR', '上传失败: ' + error.message);
            }
        }

        // 模板上传处理
        templateDropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            templateDropZone.classList.add('dragover');
        });

        templateDropZone.addEventListener('dragleave', () => {
            templateDropZone.classList.remove('dragover');
        });

        templateDropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            templateDropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) uploadTemplate(file);
        });

        templateInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) uploadTemplate(file);
        });

        async function uploadTemplate(file) {
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload/template', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.success) {
                    templateUploaded = true;
                    document.getElementById('templateStatus').classList.add('ready');
                    document.getElementById('templateStatusText').textContent = '已上传';
                    document.getElementById('templateFileName').textContent = result.filename;
                    document.getElementById('templateDetails').textContent =
                        `占位符: ${result.placeholders.length > 0 ? result.placeholders.join(', ') : '无'}`;
                    document.getElementById('templateInfo').classList.add('show');
                    addLog('INFO', `模板文件上传成功: ${result.filename}`);
                    if (result.placeholders.length > 0) {
                        addLog('INFO', `检测到占位符: ${result.placeholders.join(', ')}`);
                    }
                    updateGenerateButton();
                } else {
                    addLog('ERROR', result.error);
                    alert(result.error);
                }
            } catch (error) {
                addLog('ERROR', '上传失败: ' + error.message);
            }
        }

        // 更新生成按钮状态
        function updateGenerateButton() {
            generateBtn.disabled = !(excelUploaded && templateUploaded);
        }

        // 添加日志
        function addLog(level, message) {
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            const logLine = document.createElement('div');
            logLine.className = 'log-line';
            logLine.innerHTML = `
                <span class="log-time">[${time}]</span>
                <span class="log-level ${level}">${level}</span>
                <span class="log-message">${escapeHtml(message)}</span>
            `;
            logContainer.appendChild(logLine);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 开始生成
        generateBtn.addEventListener('click', async () => {
            generateBtn.disabled = true;
            document.querySelector('.action-section').classList.add('processing');
            progressSection.classList.add('show');
            resultSection.classList.remove('show');
            generatedFiles = [];

            addLog('INFO', '开始批量生成报告...');

            // 启动日志轮询
            logPolling = setInterval(fetchLogs, 500);

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST'
                });
                const result = await response.json();

                clearInterval(logPolling);
                await fetchLogs(); // 获取最终日志

                if (result.success) {
                    generatedFiles = result.files;
                    addLog('SUCCESS', `批量生成完成! 成功生成 ${result.generated_count} 个报告`);
                    document.getElementById('progressText').textContent = '生成完成!';
                    document.getElementById('progressPercent').textContent = '100%';
                    document.getElementById('progressFill').style.width = '100%';
                    downloadAllBtn.disabled = false;
                    showResults(result.files);
                } else {
                    addLog('ERROR', result.error);
                    alert(result.error);
                }
            } catch (error) {
                clearInterval(logPolling);
                addLog('ERROR', '生成失败: ' + error.message);
            }

            generateBtn.disabled = false;
            document.querySelector('.action-section').classList.remove('processing');
        });

        // 获取日志
        async function fetchLogs() {
            try {
                const response = await fetch('/api/logs');
                const result = await response.json();

                if (result.logs && result.logs.length > 0) {
                    logContainer.innerHTML = '';
                    result.logs.forEach(log => {
                        const logLine = document.createElement('div');
                        logLine.className = 'log-line';
                        logLine.innerHTML = `
                            <span class="log-time">[${log.timestamp}]</span>
                            <span class="log-level ${log.level}">${log.level}</span>
                            <span class="log-message">${escapeHtml(log.message)}</span>
                        `;
                        logContainer.appendChild(logLine);
                    });
                    logContainer.scrollTop = logContainer.scrollHeight;

                    // 更新进度
                    const lastLog = result.logs[result.logs.length - 1];
                    if (lastLog.message.includes('/')) {
                        const match = lastLog.message.match(/\[(\d+)\/(\d+)\]/);
                        if (match) {
                            const current = parseInt(match[1]);
                            const total = parseInt(match[2]);
                            const percent = Math.round((current / total) * 100);
                            document.getElementById('progressText').textContent = `正在处理: ${current}/${total}`;
                            document.getElementById('progressPercent').textContent = `${percent}%`;
                            document.getElementById('progressFill').style.width = `${percent}%`;
                        }
                    }
                }
            } catch (error) {
                console.error('获取日志失败:', error);
            }
        }

        // 显示结果
        function showResults(files) {
            resultSection.classList.add('show');
            resultList.innerHTML = '';

            files.forEach(filename => {
                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = `
                    <span class="filename">${escapeHtml(filename)}</span>
                    <span class="status-icon">✅</span>
                `;
                resultList.appendChild(item);
            });
        }

        // 下载全部
        downloadAllBtn.addEventListener('click', () => {
            window.location.href = '/api/download/all';
        });

        // 清空
        clearBtn.addEventListener('click', () => {
            excelUploaded = false;
            templateUploaded = false;
            generatedFiles = [];

            document.getElementById('excelStatus').classList.remove('ready');
            document.getElementById('excelStatusText').textContent = 'Excel未上传';
            document.getElementById('excelInfo').classList.remove('show');

            document.getElementById('templateStatus').classList.remove('ready');
            document.getElementById('templateStatusText').textContent = '模板未上传';
            document.getElementById('templateInfo').classList.remove('show');

            progressSection.classList.remove('show');
            resultSection.classList.remove('show');
            logContainer.innerHTML = `
                <div class="log-line">
                    <span class="log-time">[--:--:--]</span>
                    <span class="log-level">INFO</span>
                    <span class="log-message">等待上传文件...</span>
                </div>
            `;

            updateGenerateButton();
        });

        // 刷新结果列表
        document.getElementById('refreshBtn').addEventListener('click', () => {
            if (generatedFiles.length > 0) {
                showResults(generatedFiles);
            }
        });
    </script>
</body>
</html>
