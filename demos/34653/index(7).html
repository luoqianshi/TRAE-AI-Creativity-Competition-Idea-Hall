<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deep Space Periodic Table</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { position: fixed; inset: 0; font-family: 'Helvetica Neue', 'Arial', 'PingFang SC', 'Microsoft YaHei', sans-serif; }

  #app { position: fixed; inset: 0; transition: filter 0.5s ease, opacity 0.5s ease; }
  #app.dimmed { filter: blur(3px) brightness(0.62); }
  canvas#space { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; }

  canvas#connect-line {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    pointer-events: none; z-index: 50; display: block;
  }

  canvas#effects {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    pointer-events: none; z-index: 1; display: block;
  }

  .info-card {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 340px;
    background: linear-gradient(155deg, rgba(20, 28, 48, 0.88), rgba(8, 12, 24, 0.92));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 14px;
    padding: 20px 22px 18px;
    color: #e8f3ff;
    z-index: 100;
    display: none;
    overflow: visible;
    box-shadow:
      0 0 28px rgba(245, 215, 110, 0.38),
      0 0 70px rgba(170, 110, 255, 0.22),
      0 16px 48px rgba(0, 0, 0, 0.6),
      inset 0 0 30px rgba(170, 220, 255, 0.05);
  }
  .info-card::before {
    content: ''; position: absolute; inset: 0;
    border-radius: 14px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 48 48'><g fill='none' stroke='%23f5d76e' stroke-width='0.5' opacity='0.07'><path d='M0 12h48M0 24h48M0 36h48M12 0v48M24 0v48M36 0v48'/><circle cx='12' cy='12' r='1.2'/><circle cx='36' cy='36' r='1.2'/><path d='M0 0l12 12M48 0l-12 12M0 48l12 -12M48 48l-12 -12'/></g></svg>");
    background-size: 36px 36px;
    pointer-events: none;
  }
  .info-card::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 14px;
    padding: 1.5px;
    background: linear-gradient(135deg, rgba(245, 215, 110, 0.85), rgba(200, 155, 60, 0.4) 35%, rgba(170, 110, 255, 0.55) 70%, rgba(245, 215, 110, 0.7));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .card-close {
    position: absolute;
    top: 8px; right: 10px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(245, 215, 110, 0.10);
    border: 1px solid rgba(245, 215, 110, 0.45);
    color: #f5d76e;
    font-size: 20px;
    line-height: 26px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s;
    z-index: 3;
    font-family: 'Helvetica Neue', sans-serif;
  }
  .card-close:hover {
    background: rgba(245, 215, 110, 0.28);
    box-shadow: 0 0 12px rgba(245, 215, 110, 0.55);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(170, 220, 255, 0.15);
  }
  .card-badge {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff3c4 0%, #f5d76e 45%, #c89b3c 80%, #5a3f10 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #1a1a2e;
    flex-shrink: 0;
    box-shadow: 0 0 16px rgba(245, 215, 110, 0.55), inset 0 0 8px rgba(255, 255, 255, 0.4);
  }
  .card-tagline {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 4px;
    color: #f5d76e;
    text-shadow: 0 0 10px rgba(245, 215, 110, 0.55);
    flex: 1;
  }

  .card-body-canvas-wrap {
    width: 100%;
    height: 200px;
    background: radial-gradient(ellipse at center, rgba(170, 110, 255, 0.10), transparent 70%);
    border-radius: 8px;
    margin-bottom: 14px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  #bohr-canvas { display: block; }

  .card-stats { margin-bottom: 14px; }
  .stat-row {
    display: grid;
    grid-template-columns: 64px 78px 1fr;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .stat-label {
    font-size: 12px;
    color: #a8c4e0;
    letter-spacing: 1px;
  }
  .stat-value {
    font-size: 14px;
    font-weight: 600;
    color: #f0f8ff;
    text-align: right;
    text-shadow: 0 0 6px rgba(170, 220, 255, 0.5);
    font-variant-numeric: tabular-nums;
  }
  .stat-bar {
    height: 5px;
    background: rgba(170, 220, 255, 0.10);
    border-radius: 3px;
    overflow: hidden;
    box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.4);
  }
  .stat-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #6db5ff 0%, #f5d76e 100%);
    box-shadow: 0 0 8px rgba(245, 215, 110, 0.55);
    border-radius: 3px;
    transition: width 0.6s ease;
  }

  .card-actions { display: flex; gap: 10px; }
  .card-btn {
    flex: 1;
    padding: 9px 0;
    background: linear-gradient(135deg, rgba(245, 215, 110, 0.18), rgba(200, 155, 60, 0.08));
    border: 1px solid rgba(245, 215, 110, 0.50);
    border-radius: 6px;
    color: #f5d76e;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    text-shadow: 0 0 6px rgba(245, 215, 110, 0.4);
    letter-spacing: 2px;
  }
  .card-btn:hover {
    background: linear-gradient(135deg, rgba(245, 215, 110, 0.30), rgba(200, 155, 60, 0.18));
    box-shadow: 0 0 12px rgba(245, 215, 110, 0.5);
  }
  .card-btn.active {
    background: linear-gradient(135deg, rgba(255, 220, 130, 0.45), rgba(245, 180, 80, 0.25));
    border-color: rgba(255, 235, 160, 0.95);
    color: #fff5d0;
    box-shadow: 0 0 16px rgba(255, 220, 130, 0.75), inset 0 0 8px rgba(255, 220, 130, 0.4);
    text-shadow: 0 0 10px rgba(255, 235, 160, 0.9);
  }
  .card-btn.fav.active {
    background: linear-gradient(135deg, rgba(255, 215, 110, 0.55), rgba(245, 165, 60, 0.35));
    border-color: rgba(255, 235, 160, 1.0);
    color: #fff5d0;
    box-shadow: 0 0 22px rgba(255, 215, 110, 0.85), inset 0 0 12px rgba(255, 215, 110, 0.55);
    text-shadow: 0 0 12px rgba(255, 235, 160, 1.0);
  }
  .card-btn.fav.active::before {
    content: '★';
    margin-right: 4px;
    color: #fff5d0;
    text-shadow: 0 0 8px rgba(255, 235, 160, 0.95);
  }
  .card-btn:active { transform: translateY(1px); }

  /* 收藏徽章：标签栏右侧立体五角星 */
  .fav-badge {
    position: relative;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    margin-left: 4px;
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 0.35s ease-out, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }
  .fav-badge.visible {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }
  .fav-badge .fav-star {
    position: absolute;
    inset: 0;
    filter: drop-shadow(0 0 6px rgba(255, 215, 110, 0.85));
  }
  .fav-badge .fav-shine-mask {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    pointer-events: none;
  }
  .fav-badge .fav-shine {
    position: absolute;
    inset: -50%;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(255, 245, 200, 0.7) 30deg, transparent 60deg, transparent 360deg);
    animation: fav-shine-rotate 4.5s linear infinite;
  }
  @keyframes fav-shine-rotate {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .fav-badge .fav-halo {
    position: absolute;
    inset: -8px;
    pointer-events: none;
  }
  .fav-badge .fav-halo-dot {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255, 220, 130, 0.95);
    box-shadow: 0 0 6px rgba(255, 220, 130, 0.85);
    top: 50%;
    left: 50%;
    transform-origin: 0 0;
    animation: fav-halo-drift 2.4s ease-in-out infinite;
  }
  .fav-badge .fav-halo-dot:nth-child(1) { animation-delay: 0s; }
  .fav-badge .fav-halo-dot:nth-child(2) { animation-delay: 0.3s; }
  .fav-badge .fav-halo-dot:nth-child(3) { animation-delay: 0.6s; }
  .fav-badge .fav-halo-dot:nth-child(4) { animation-delay: 0.9s; }
  .fav-badge .fav-halo-dot:nth-child(5) { animation-delay: 1.2s; }
  .fav-badge .fav-halo-dot:nth-child(6) { animation-delay: 1.5s; }
  .fav-badge .fav-halo-dot:nth-child(7) { animation-delay: 1.8s; }
  .fav-badge .fav-halo-dot:nth-child(8) { animation-delay: 2.1s; }
  @keyframes fav-halo-drift {
    0%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(var(--dx, 14px), var(--dy, -10px)) scale(1.1); opacity: 0; }
  }

  /* 收藏按钮被点击时迸发的粒子 */
  .fav-burst {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff5d0 0%, #f5d76e 50%, rgba(245, 165, 60, 0) 100%);
    box-shadow: 0 0 8px rgba(255, 220, 130, 0.95);
    pointer-events: none;
    z-index: 9999;
    will-change: transform, opacity;
  }
  .fav-burst.trail {
    width: 4px;
    height: 4px;
    background: radial-gradient(circle, #fff5d0 0%, rgba(245, 215, 110, 0.7) 50%, rgba(245, 165, 60, 0) 100%);
  }

  .card-particle {
    position: absolute;
    width: 3px; height: 3px;
    background: #f5d76e;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 6px #f5d76e;
    z-index: 2;
  }

  /* === 收藏室面板 === */
  .collection-handle {
    position: fixed;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    width: 30px;
    height: 180px;
    background: rgba(20, 25, 40, 0.50);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-left: 1px solid rgba(120, 200, 255, 0.30);
    border-radius: 10px 0 0 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 50;
    box-shadow: -2px 0 14px rgba(120, 200, 255, 0.20), inset 0 0 8px rgba(120, 200, 255, 0.10);
    animation: handle-breathe 2.5s ease-in-out infinite;
    user-select: none;
  }
  .collection-handle.hidden { display: none; }
  @keyframes handle-breathe {
    0%, 100% { box-shadow: -2px 0 8px rgba(120, 200, 255, 0.20), inset 0 0 6px rgba(120, 200, 255, 0.08); border-left-color: rgba(120, 200, 255, 0.25); }
    50%      { box-shadow: -2px 0 18px rgba(150, 220, 255, 0.55), inset 0 0 12px rgba(150, 220, 255, 0.20); border-left-color: rgba(170, 230, 255, 0.70); }
  }
  .collection-handle .handle-text {
    writing-mode: vertical-rl;
    text-orientation: upright;
    color: rgba(170, 220, 255, 0.92);
    font-size: 12px;
    letter-spacing: 4px;
    font-weight: 300;
    text-shadow: 0 0 8px rgba(150, 220, 255, 0.75);
    user-select: none;
  }

  .collection-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 340px;
    height: 100vh;
    background: rgba(18, 22, 38, 0.55);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-left: 1.5px solid rgba(245, 215, 110, 0.55);
    box-shadow: -8px 0 32px rgba(0, 0, 0, 0.55), inset 1px 0 0 rgba(255, 220, 130, 0.20);
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 40;
    display: flex;
    flex-direction: column;
    padding: 18px 16px 18px 18px;
    color: #f0f8ff;
    pointer-events: none;
    background-image:
      linear-gradient(135deg, rgba(245, 215, 110, 0.05) 0%, transparent 30%),
      repeating-linear-gradient(0deg, transparent 0px, transparent 14px, rgba(120, 200, 255, 0.04) 14px, rgba(120, 200, 255, 0.04) 15px),
      repeating-linear-gradient(90deg, transparent 0px, transparent 14px, rgba(120, 200, 255, 0.04) 14px, rgba(120, 200, 255, 0.04) 15px);
  }
  .collection-panel.open {
    transform: translateX(0%);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: auto;
  }
  .collection-panel.closing {
    transform: translateX(100%);
    transition: transform 0.8s cubic-bezier(0.55, 0.05, 0.67, 0.19);
  }

  .collection-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(245, 215, 110, 0.30);
    margin-bottom: 14px;
  }
  .collection-title {
    font-size: 17px;
    font-weight: 500;
    color: #f5d76e;
    letter-spacing: 4px;
    text-shadow: 0 0 12px rgba(245, 215, 110, 0.75);
  }
  .collection-close {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(255, 110, 110, 0.08);
    border: 1px solid rgba(255, 110, 110, 0.45);
    color: #ffb0b0;
    font-size: 16px;
    line-height: 24px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255, 110, 110, 0.30);
    transition: all 0.2s;
    user-select: none;
    font-family: 'Helvetica Neue', sans-serif;
  }
  .collection-close:hover {
    background: rgba(255, 110, 110, 0.22);
    box-shadow: 0 0 16px rgba(255, 130, 130, 0.65);
    color: #fff;
  }

  .collection-grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 60px;
    gap: 6px;
    padding: 4px 2px 12px 2px;
    scrollbar-width: thin;
    scrollbar-color: rgba(245, 215, 110, 0.45) transparent;
  }
  .collection-grid::-webkit-scrollbar { width: 6px; }
  .collection-grid::-webkit-scrollbar-thumb { background: rgba(245, 215, 110, 0.45); border-radius: 3px; }
  .collection-grid::-webkit-scrollbar-track { background: transparent; }

  .grid-cell {
    position: relative;
    border-radius: 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    overflow: hidden;
  }
  .grid-cell.filled {
    background: linear-gradient(135deg, rgba(245, 215, 110, 0.20), rgba(120, 200, 255, 0.12));
    border: 1px solid rgba(245, 215, 110, 0.50);
    box-shadow: 0 0 8px rgba(245, 215, 110, 0.30), inset 0 0 4px rgba(245, 215, 110, 0.20);
    color: #fff5d0;
    text-shadow: 0 0 4px rgba(245, 215, 110, 0.55);
  }
  .grid-cell.filled .grid-sym { font-size: 18px; font-weight: 600; line-height: 1.1; }
  .grid-cell.filled .grid-z   { font-size: 10px; color: #c8e4ff; opacity: 0.85; line-height: 1.1; margin-top: 2px; }
  .grid-cell.empty {
    background: rgba(40, 45, 60, 0.30);
    border: 1px dashed rgba(120, 140, 170, 0.30);
    color: rgba(150, 170, 200, 0.30);
    font-size: 11px;
  }

  .collection-progress {
    padding-top: 12px;
    border-top: 1px solid rgba(120, 200, 255, 0.20);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress-label {
    font-size: 11px;
    color: #a8c4e0;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .progress-bar {
    flex: 1;
    height: 8px;
    background: rgba(170, 220, 255, 0.10);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.5);
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #6db5ff 0%, #f5d76e 70%, #ffe5a0 100%);
    box-shadow: 0 0 10px rgba(245, 215, 110, 0.75);
    width: 0%;
    transition: width 0.5s ease;
    border-radius: 4px;
  }
  .progress-count {
    font-size: 12px;
    color: #f5d76e;
    font-weight: 600;
    white-space: nowrap;
    text-shadow: 0 0 6px rgba(245, 215, 110, 0.55);
    min-width: 50px;
    text-align: right;
  }

  .collection-speed-lines {
    position: absolute;
    top: 0;
    right: 0;
    width: 60px;
    height: 100%;
    pointer-events: none;
    opacity: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent 0px,
      rgba(245, 215, 110, 0.18) 4px,
      transparent 8px,
      rgba(120, 200, 255, 0.12) 14px,
      transparent 20px
    );
    filter: blur(2px);
  }
  .collection-speed-lines.show {
    animation: speed-lines-fade 1.0s ease-out forwards;
  }
  @keyframes speed-lines-fade {
    0%   { opacity: 0.9; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="space" aria-hidden="true"></canvas>
  <canvas id="effects" aria-hidden="true"></canvas>
</div>
<canvas id="connect-line" aria-hidden="true"></canvas>
<div class="info-card" id="info-card">
  <div class="card-close" id="card-close">&times;</div>
  <div class="card-header">
    <div class="card-badge" id="card-badge">&#9883;</div>
    <div class="card-tagline" id="card-tagline">—</div>
    <div class="fav-badge" id="fav-badge"></div>
  </div>
  <div class="card-body-canvas-wrap">
    <canvas id="bohr-canvas" width="296" height="200"></canvas>
  </div>
  <div class="card-stats">
    <div class="stat-row">
      <div class="stat-label">序数 Z</div>
      <div class="stat-value" id="stat-z">—</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="bar-z" style="width: 0%"></div></div>
    </div>
    <div class="stat-row">
      <div class="stat-label">质量 A</div>
      <div class="stat-value" id="stat-mass">—</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="bar-mass" style="width: 0%"></div></div>
    </div>
    <div class="stat-row">
      <div class="stat-label">电负性 &chi;</div>
      <div class="stat-value" id="stat-en">—</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="bar-en" style="width: 0%"></div></div>
    </div>
  </div>
  <div class="card-actions">
    <button class="card-btn" id="btn-locate" type="button">&#128205; 定位</button>
    <button class="card-btn fav" id="btn-fav" type="button">&#11088; 收藏</button>
  </div>
</div>
<div class="collection-handle" id="collection-handle" title="点击打开收藏室">
  <div class="handle-text">我的收藏</div>
</div>
<div class="collection-panel" id="collection-panel">
  <div class="collection-header">
    <div class="collection-title">我的元素收藏室</div>
    <div class="collection-close" id="collection-close" title="关闭">✕</div>
  </div>
  <div class="collection-grid" id="collection-grid"></div>
  <div class="collection-progress">
    <div class="progress-label">已收集</div>
    <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="progress-count" id="progress-count">0/118</div>
  </div>
  <div class="collection-speed-lines" id="collection-speed-lines"></div>
</div>
<script>
(() => {
  const canvas = document.getElementById('space');
  const ctx = canvas.getContext('2d', { alpha: false });
  if (!ctx) return;

  const effectsCanvas = document.getElementById('effects');
  const effectsCtx = effectsCanvas ? effectsCanvas.getContext('2d') : null;

  const connectCanvas = document.getElementById('connect-line');
  const connectCtx = connectCanvas ? connectCanvas.getContext('2d') : null;

  const appEl = document.getElementById('app');
  const cardEl = document.getElementById('info-card');
  const cardCloseEl = document.getElementById('card-close');
  const cardTaglineEl = document.getElementById('card-tagline');
  const cardBadgeEl = document.getElementById('card-badge');
  const statZEl = document.getElementById('stat-z');
  const statMassEl = document.getElementById('stat-mass');
  const statEnEl = document.getElementById('stat-en');
  const barZEl = document.getElementById('bar-z');
  const barMassEl = document.getElementById('bar-mass');
  const barEnEl = document.getElementById('bar-en');
  const btnLocateEl = document.getElementById('btn-locate');
  const btnFavEl = document.getElementById('btn-fav');
  const favBadgeEl = document.getElementById('fav-badge');
  const collectionHandleEl = document.getElementById('collection-handle');
  const collectionPanelEl = document.getElementById('collection-panel');
  const collectionGridEl = document.getElementById('collection-grid');
  const collectionCloseEl = document.getElementById('collection-close');

  function buildStars() {
    stars = [];
    for (let li = 0; li < STAR_LAYERS.length; li++) {
      const L = STAR_LAYERS[li];
      for (let i = 0; i < L.count; i++) {
        stars.push({
          x: Math.random(),
          y: Math.random(),
          r: rand(L.rMin, L.rMax),
          a: rand(L.aMin, L.aMax),
          phase: Math.random() * Math.PI * 2,
          speed: rand(L.twMin, L.twMax),
          hue: rand(200, 230),
          li
        });
      }
    }
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = W / 2;
    CY = H / 2;
    if (connectCanvas) {
      connectCanvas.width = Math.floor(W * dpr);
      connectCanvas.height = Math.floor(H * dpr);
      connectCanvas.style.width = W + 'px';
      connectCanvas.style.height = H + 'px';
      if (connectCtx) {
        connectCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        connectCtx.clearRect(0, 0, W, H);
      }
    }
    if (effectsCanvas) {
      effectsCanvas.width = Math.floor(W * dpr);
      effectsCanvas.height = Math.floor(H * dpr);
      effectsCanvas.style.width = W + 'px';
      effectsCanvas.style.height = H + 'px';
      if (effectsCtx) {
        effectsCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        effectsCtx.clearRect(0, 0, W, H);
      }
    }
  }

  function drawBase() {
    const g = ctx.createRadialGradient(CX, CY * 0.65, 0, CX, CY, Math.max(W, H) * 0.95);
    g.addColorStop(0.00, '#070a1d');
    g.addColorStop(0.35, '#04061a');
    g.addColorStop(0.70, '#02030d');
    g.addColorStop(1.00, '#000003');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawNebula(t) {
    const rot = t * 0.00006;
    const nx = CX;
    const ny = CY * 0.28;
    const baseR = Math.min(W, H) * 0.78;

    ctx.save();
    ctx.translate(nx, ny);
    ctx.rotate(rot);
    ctx.translate(-nx, -ny);

    const arms = 2;
    const perArm = 5;
    for (let a = 0; a < arms; a++) {
      const armBase = (a / arms) * Math.PI * 2;
      for (let i = 0; i < perArm; i++) {
        const u = i / Math.max(1, perArm - 1);
        const r = baseR * (0.10 + u * 0.88);
        const swirl = u * 1.75;
        const ang = armBase + swirl;
        const bx = nx + Math.cos(ang) * r;
        const by = ny + Math.sin(ang) * r * 0.55;

        const isPurple = ((a + i) & 1) === 0;
        const aCore = 0.24 - u * 0.14;
        const cCore = isPurple
          ? `rgba(175, 135, 255, ${aCore})`
          : `rgba(115, 215, 255, ${aCore})`;
        const cMid = isPurple
          ? 'rgba(120, 80, 200, 0.05)'
          : 'rgba(60, 150, 200, 0.05)';
        const blobR = baseR * (0.52 - u * 0.22);

        const g = ctx.createRadialGradient(bx, by, 0, bx, by, blobR);
        g.addColorStop(0, cCore);
        g.addColorStop(0.45, cMid);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }
    }

    ctx.globalCompositeOperation = 'lighter';
    const coreG = ctx.createRadialGradient(nx, ny, 0, nx, ny, baseR * 0.32);
    coreG.addColorStop(0, 'rgba(190, 160, 255, 0.10)');
    coreG.addColorStop(0.5, 'rgba(130, 180, 255, 0.04)');
    coreG.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = coreG;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';

    ctx.restore();
  }

  function drawVolumetric(t) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.00045);
    const minDim = Math.min(W, H);
    const glows = [
      { x: CX * 0.45, y: CY * 0.22, r: minDim * 0.38, c: `rgba(140, 100, 255, ${0.06 + 0.02 * pulse})` },
      { x: CX * 1.55, y: CY * 0.18, r: minDim * 0.32, c: 'rgba(80, 180, 255, 0.05)' },
      { x: CX * 0.20, y: CY * 1.10, r: minDim * 0.34, c: 'rgba(80, 140, 255, 0.04)' },
      { x: CX * 1.80, y: CY * 0.90, r: minDim * 0.30, c: 'rgba(150, 100, 220, 0.04)' }
    ];
    for (let i = 0; i < glows.length; i++) {
      const p = glows[i];
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, p.c);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawStars(t) {
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const tw = 0.5 + 0.5 * Math.sin(t * 0.001 * s.speed + s.phase);
      const a = s.a * (0.55 + 0.45 * tw);
      const x = s.x * W;
      const y = s.y * H;
      const tint = Math.floor(180 + tw * 75);
      ctx.fillStyle = `rgba(${Math.min(255, tint + 25)}, ${Math.min(255, tint + 15)}, 255, ${a})`;
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (s.r > 1.4) {
        const glowR = s.r * 7;
        const g = ctx.createRadialGradient(x, y, 0, x, y, glowR);
        g.addColorStop(0, `rgba(200, 220, 255, ${a * 0.45})`);
        g.addColorStop(0.4, `rgba(200, 220, 255, ${a * 0.12})`);
        g.addColorStop(1, 'rgba(200, 220, 255, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, glowR, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawCenterMask() {
    const rx = W * 0.42;
    const ry = H * 0.40;
    ctx.save();
    ctx.translate(CX, CY);
    ctx.scale(1, ry / rx);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    g.addColorStop(0.00, 'rgba(2, 3, 10, 1)');
    g.addColorStop(0.55, 'rgba(2, 3, 10, 0.97)');
    g.addColorStop(0.82, 'rgba(2, 3, 10, 0.55)');
    g.addColorStop(0.95, 'rgba(2, 3, 10, 0.12)');
    g.addColorStop(1.00, 'rgba(2, 3, 10, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(-W, -H, W * 2, H * 2);
    ctx.restore();
  }

  function buildTable() {
    const c = document.createElement('canvas');
    c.width = canvas.width;
    c.height = canvas.height;
    const t = c.getContext('2d');
    t.setTransform(dpr, 0, 0, dpr, 0, 0);

    const minDim = Math.min(W, H);
    const targetW = Math.min(W * 0.74, 1500);
    const gap = Math.max(2, minDim * 0.006);
    const cW = (targetW - (TABLE_COLS - 1) * gap) / TABLE_COLS;
    const cH = cW * 0.95;
    const eH = cH * 0.72;
    const bigGap = cH * 0.6;

    const mainW = TABLE_COLS * cW + (TABLE_COLS - 1) * gap;
    const mainH = TABLE_ROWS * cH + (TABLE_ROWS - 1) * gap;
    const extraH = 2 * eH + gap;
    const totalH = mainH + bigGap + extraH;
    const x0 = CX - mainW / 2;
    const y0 = CY - totalH / 2;

    const colorAt = (mx, my) => {
      const nx = (mx - x0) / mainW;
      const ny = (my - y0) / totalH;
      const tn = Math.max(0, Math.min(1, (nx + ny) * 0.5));
      const r = Math.round(COLOR_GOLD.r + (COLOR_PURPLE.r - COLOR_GOLD.r) * tn);
      const g = Math.round(COLOR_GOLD.g + (COLOR_PURPLE.g - COLOR_GOLD.g) * tn);
      const b = Math.round(COLOR_GOLD.b + (COLOR_PURPLE.b - COLOR_GOLD.b) * tn);
      return `rgba(${r}, ${g}, ${b}, 0.95)`;
    };

    t.save();
    t.translate(CX, CY);
    t.scale(1, TABLE_TILT);
    t.translate(-CX, -CY);

    t.lineJoin = 'miter';
    t.lineCap = 'butt';

    const drawCell = (x, y, w, h) => {
      const mx = x + w / 2;
      const my = y + h / 2;
      const col = colorAt(mx, my);
      t.shadowColor = col;
      t.shadowBlur = 7;
      t.lineWidth = 1.2;
      t.strokeStyle = col;
      t.strokeRect(x, y, w, h);
    };

    const getCategory = (r, c, isEx, exRow) => {
      if (isEx) return exRow === 0 ? 'lanthanide' : 'actinide';
      if (r === 0 && c === 0) return 'h';
      if (c === 0 || c === 1) return 'alkali';
      if (c >= 2 && c <= 11) {
        if ((r === 5 || r === 6) && c === 2) return 'indicator';
        return 'transition';
      }
      if (c >= 12 && c <= 16) return 'right';
      if (c === 17) return 'noble';
      return 'right';
    };

    const fillCell = (x, y, w, h, r, c, isEx, exRow) => {
      const cat = getCategory(r, c, isEx, exRow);
      t.shadowBlur = 0;
      t.lineWidth = 1;
      if (cat === 'noble') {
        const cx = x + w / 2;
        const cy = y + h / 2;
        const rad = Math.max(w, h) * 0.75;
        const rg = t.createRadialGradient(cx, cy, 0, cx, cy, rad);
        rg.addColorStop(0.00, 'rgba(225, 175, 255, 0.55)');
        rg.addColorStop(0.45, 'rgba(170, 120, 235, 0.38)');
        rg.addColorStop(1.00, 'rgba(125, 85, 195, 0.18)');
        t.fillStyle = rg;
        t.fillRect(x, y, w, h);
        return;
      }
      if (cat === 'lanthanide' || cat === 'indicator' || cat === 'actinide') {
        const baseTop = cat === 'indicator' ? 58 : 70;
        const baseBot = cat === 'indicator' ? 35 : 40;
        const lg = t.createLinearGradient(x, y, x, y + h);
        lg.addColorStop(0, `rgba(${baseTop}, ${baseTop + 10}, ${baseTop + 25}, 0.55)`);
        lg.addColorStop(1, `rgba(${baseBot}, ${baseBot + 10}, ${baseBot + 25}, 0.55)`);
        t.fillStyle = lg;
        t.fillRect(x, y, w, h);
        t.save();
        t.shadowColor = 'rgba(130, 230, 130, 0.85)';
        t.shadowBlur = 4;
        t.lineWidth = 0.9;
        t.strokeStyle = cat === 'indicator'
          ? 'rgba(140, 230, 140, 0.35)'
          : 'rgba(140, 235, 140, 0.45)';
        t.strokeRect(x + 0.6, y + 0.6, w - 1.2, h - 1.2);
        t.restore();
        return;
      }
      const lg = t.createLinearGradient(x, y, x, y + h);
      if (cat === 'h') {
        lg.addColorStop(0.0, 'rgba(255, 235, 170, 0.58)');
        lg.addColorStop(0.5, 'rgba(255, 215, 130, 0.50)');
        lg.addColorStop(1.0, 'rgba(220, 165, 70, 0.40)');
        t.fillStyle = lg;
        t.fillRect(x, y, w, h);
        const sg = t.createLinearGradient(x, y, x, y + h * 0.35);
        sg.addColorStop(0, 'rgba(255, 245, 200, 0.30)');
        sg.addColorStop(1, 'rgba(255, 245, 200, 0)');
        t.fillStyle = sg;
        t.fillRect(x, y, w, h * 0.35);
        return;
      }
      if (cat === 'alkali') {
        lg.addColorStop(0.0, 'rgba(255, 180, 100, 0.50)');
        lg.addColorStop(0.5, 'rgba(245, 120, 70, 0.50)');
        lg.addColorStop(1.0, 'rgba(210, 60, 50, 0.45)');
        t.fillStyle = lg;
        t.fillRect(x, y, w, h);
        const sg = t.createLinearGradient(x, y, x, y + h * 0.35);
        sg.addColorStop(0, 'rgba(255, 240, 200, 0.28)');
        sg.addColorStop(1, 'rgba(255, 240, 200, 0)');
        t.fillStyle = sg;
        t.fillRect(x, y, w, h * 0.35);
        return;
      }
      if (cat === 'transition') {
        lg.addColorStop(0.0, 'rgba(215, 230, 245, 0.40)');
        lg.addColorStop(0.5, 'rgba(165, 185, 210, 0.45)');
        lg.addColorStop(1.0, 'rgba(120, 145, 175, 0.40)');
        t.fillStyle = lg;
        t.fillRect(x, y, w, h);
        t.fillStyle = 'rgba(235, 245, 255, 0.14)';
        t.fillRect(x, y + h * 0.5 - 0.5, w, 1);
        t.fillStyle = 'rgba(80, 100, 130, 0.18)';
        t.fillRect(x, y + h * 0.7, w, 1);
        return;
      }
      if (cat === 'right') {
        const tCol = (c - 12) / 4;
        const r0 = Math.round(110 - tCol * 50);
        const g0 = Math.round(230 - tCol * 75);
        const b0 = Math.round(240 - tCol * 10);
        const r1 = Math.round(160 - tCol * 5);
        const g1 = Math.round(110 - tCol * 45);
        const b1 = Math.round(220 - tCol * 0);
        lg.addColorStop(0.0, `rgba(${r0}, ${g0}, ${b0}, 0.46)`);
        lg.addColorStop(0.5, `rgba(${Math.round((r0 + r1) / 2)}, ${Math.round((g0 + g1) / 2)}, ${Math.round((b0 + b1) / 2)}, 0.46)`);
        lg.addColorStop(1.0, `rgba(${r1}, ${g1}, ${b1}, 0.46)`);
        t.fillStyle = lg;
        t.fillRect(x, y, w, h);
        const sg = t.createLinearGradient(x, y + h * 0.15, x, y + h * 0.55);
        sg.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
        sg.addColorStop(1, 'rgba(255, 255, 255, 0)');
        t.fillStyle = sg;
        t.fillRect(x, y + h * 0.15, w, h * 0.4);
        return;
      }
    };

    const drawCellText = (x, y, w, h, z) => {
      if (z === null || z === undefined) return;
      const e = ELEMENTS[z - 1];
      if (!e) return;

      const fb = Math.min(w, h);
      const pad = Math.max(2, fb * 0.10);
      const fontLatin = "'Helvetica Neue', 'Arial', 'Inter', system-ui, sans-serif";
      const fontCJK = "'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', sans-serif";

      t.save();
      t.shadowBlur = 0;
      t.fillStyle = 'rgba(240, 248, 255, 0.97)';
      t.strokeStyle = 'rgba(170, 220, 255, 0.55)';
      t.lineWidth = 0.5;

      t.shadowColor = 'rgba(170, 220, 255, 0.85)';
      t.shadowBlur = 4;
      t.font = `500 ${Math.max(7, fb * 0.20)}px ${fontLatin}`;
      t.textAlign = 'left';
      t.textBaseline = 'top';
      t.fillText(String(e.z), x + pad, y + pad);

      t.font = `700 ${Math.max(10, fb * 0.48)}px ${fontLatin}`;
      t.textAlign = 'center';
      t.textBaseline = 'middle';
      t.shadowBlur = 6;
      t.fillText(e.sym, x + w / 2, y + h * 0.42);

      t.font = `300 ${Math.max(8, fb * 0.20)}px ${fontCJK}`;
      t.textAlign = 'center';
      t.textBaseline = 'top';
      t.shadowBlur = 4;
      t.fillText(e.cn, x + w / 2, y + h * 0.66);

      t.font = `500 ${Math.max(7, fb * 0.15)}px ${fontLatin}`;
      t.textAlign = 'right';
      t.textBaseline = 'bottom';
      t.shadowBlur = 3;
      t.fillText(e.mass, x + w - pad, y + h - pad);

      t.restore();
    };

    for (let r = 0; r < TABLE_ROWS; r++) {
      for (let ci = 0; ci < FILLED_COLS[r].length; ci++) {
        const cIdx = FILLED_COLS[r][ci];
        const x = cellX(r, cIdx, cW, gap, x0);
        const y = y0 + r * (cH + gap);
        fillCell(x, y, cW, cH, r, cIdx, false, 0);
        drawCell(x, y, cW, cH);
        const z = getAtomicNumber(r, cIdx);
        drawCellText(x, y, cW, cH, z);
      }
    }

    const extraYStart = y0 + mainH + bigGap;
    for (let er = 0; er < 2; er++) {
      for (let ec = 0; ec < TABLE_EX_COLS; ec++) {
        const x = exCellX(ec, cW, gap, x0);
        const y = extraYStart + er * (eH + gap);
        fillCell(x, y, cW, eH, 0, 0, true, er);
        drawCell(x, y, cW, eH);
        const z = getExtraAtomicNumber(er, ec);
        drawCellText(x, y, cW, eH, z);
      }
    }

    const drawCross = (px, py) => {
      const col = colorAt(px, py);
      t.shadowColor = col;
      t.shadowBlur = 11;
      t.lineWidth = 2.0;
      t.strokeStyle = col;
      const s = 2.8;
      t.beginPath();
      t.moveTo(px - s, py); t.lineTo(px + s, py);
      t.moveTo(px, py - s); t.lineTo(px, py + s);
      t.stroke();
      t.shadowBlur = 5;
      t.fillStyle = col;
      t.beginPath();
      t.arc(px, py, 1.4, 0, Math.PI * 2);
      t.fill();
    };

    // 紧致布局下角点：只标记 FILLED 单元格的 4 角（不画在空格上）
    for (let r = 0; r < TABLE_ROWS; r++) {
      for (let ci = 0; ci < FILLED_COLS[r].length; ci++) {
        const c = FILLED_COLS[r][ci];
        const x = x0 + c * (cW + gap);
        const y = y0 + r * (cH + gap);
        drawCross(x, y);                       // 左上
        drawCross(x + cW + gap, y);            // 右上
        drawCross(x, y + cH + gap);            // 左下
        drawCross(x + cW + gap, y + cH + gap); // 右下
      }
    }
    // 镧/锆系行：30 格 cell 各自的 4 角
    for (let er = 0; er < 2; er++) {
      for (let ec = 0; ec < TABLE_EX_COLS; ec++) {
        const x = x0 + (ec + 2) * (cW + gap);
        const y = extraYStart + er * (eH + gap);
        drawCross(x, y);
        drawCross(x + cW + gap, y);
        drawCross(x, y + eH + gap);
        drawCross(x + cW + gap, y + eH + gap);
      }
    }

    t.restore();

    tableCanvas = c;
    tableGeom = { x0, y0, cW, cH, eH, gap, extraYStart, mainH };
    updateAmbientSources();
  }

  const updateAmbientSources = () => {
    if (!tableGeom) return;
    const { x0, y0, cW, cH, eH, gap, extraYStart } = tableGeom;
    const steam = [];
    const noble = [];
    const scan = [];
    for (let r = 0; r < TABLE_ROWS; r++) {
      for (let ci = 0; ci < FILLED_COLS[r].length; ci++) {
        const c = FILLED_COLS[r][ci];
        const z = getAtomicNumber(r, c);
        if (!z) continue;
        const cx = x0 + c * (cW + gap);
        const cy = y0 + r * (cH + gap);
        const isAlkali = (c === 0 && r >= 1);
        const isAlkaline = (c === 1 && r >= 1);
        const isHalogenR1 = (r === 1 && c >= 14 && c <= 16);
        const isHalogenR2 = (r === 2 && c >= 15 && c <= 16);
        if (isAlkali || isAlkaline || isHalogenR1 || isHalogenR2) {
          steam.push({ z, x: cx + cW / 2, y: cy + cH * 0.15 });
        }
        if (c === 17) {
          noble.push({ z, x: cx + cW / 2, y: cy + cH / 2 });
        }
      }
    }
    for (let er = 0; er < 2; er++) {
      for (let ec = 0; ec < TABLE_EX_COLS; ec++) {
        const z = getExtraAtomicNumber(er, ec);
        if (!z) continue;
        const cx = x0 + (ec + 2) * (cW + gap);
        const cy = extraYStart + er * (eH + gap);
        scan.push({ z, x: cx + cW / 2, y: cy, h: eH });
      }
    }
    ambientSources = { steam, noble, scan };
  };

  const spawnSteam = (src) => {
    if (!src) return;
    const p = {
      x: src.x + (Math.random() - 0.5) * (cW() * 0.6),
      y: src.y + Math.random() * 4,
      vx: (Math.random() - 0.5) * 0.18,
      vy: -0.18 - Math.random() * 0.32,
      life: 0,
      maxLife: 1800 + Math.random() * 1400,
      r: 0.8 + Math.random() * 1.4,
      a: 0.45 + Math.random() * 0.45,
      hue: 38 + Math.random() * 22
    };
    steamPool.push(p);
  };

  const cW = () => (tableGeom ? tableGeom.cW : 30);

  const updateSteam = (dt) => {
    for (let i = steamPool.length - 1; i >= 0; i--) {
      const p = steamPool[i];
      p.life += dt;
      p.x += p.vx;
      p.y += p.vy;
      p.vx += (Math.random() - 0.5) * 0.04;
      p.vy *= 0.995;
      if (p.life > p.maxLife || p.y < -20) {
        steamPool.splice(i, 1);
      }
    }
  };

  const drawSteam = () => {
    if (!effectsCtx) return;
    for (const p of steamPool) {
      const t = p.life / p.maxLife;
      const fade = t < 0.15 ? t / 0.15 : (1 - t) / 0.85;
      const a = Math.max(0, Math.min(1, fade)) * p.a;
      effectsCtx.save();
      effectsCtx.shadowColor = `hsla(${p.hue}, 90%, 70%, ${a})`;
      effectsCtx.shadowBlur = 6;
      effectsCtx.fillStyle = `hsla(${p.hue}, 95%, 78%, ${a})`;
      effectsCtx.beginPath();
      effectsCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      effectsCtx.fill();
      effectsCtx.restore();
    }
  };

  const drawNobleGlows = (t) => {
    if (!effectsCtx) return;
    for (const src of ambientSources.noble) {
      const phase = t * 0.0008 + src.z * 0.35;
      const pulse = 0.5 + 0.5 * Math.sin(phase);
      const r = Math.max(20, (tableGeom ? tableGeom.cW : 30) * 0.85);
      const g = effectsCtx.createRadialGradient(src.x, src.y, 0, src.x, src.y, r);
      g.addColorStop(0, `rgba(180, 140, 255, ${0.32 * pulse})`);
      g.addColorStop(0.4, `rgba(150, 120, 230, ${0.12 * pulse})`);
      g.addColorStop(1, 'rgba(120, 90, 200, 0)');
      effectsCtx.fillStyle = g;
      effectsCtx.beginPath();
      effectsCtx.arc(src.x, src.y, r, 0, Math.PI * 2);
      effectsCtx.fill();
    }
  };

  const drawActinideScans = (t) => {
    if (!effectsCtx) return;
    for (const src of ambientSources.scan) {
      const phase = (t * 0.00018) % 1;
      const sy = src.y + phase * src.h;
      const w = (tableGeom ? tableGeom.cW : 30) * 0.9;
      const grad = effectsCtx.createLinearGradient(0, sy - 3, 0, sy + 3);
      grad.addColorStop(0, 'rgba(130, 230, 130, 0)');
      grad.addColorStop(0.5, 'rgba(150, 255, 170, 0.55)');
      grad.addColorStop(1, 'rgba(130, 230, 130, 0)');
      effectsCtx.save();
      effectsCtx.shadowColor = 'rgba(130, 230, 130, 0.5)';
      effectsCtx.shadowBlur = 6;
      effectsCtx.fillStyle = grad;
      effectsCtx.fillRect(src.x - w / 2, sy - 3, w, 6);
      effectsCtx.restore();
    }
  };

  // 定位元素位置查询：返回 { x, y, w, h, isEx } 或 null
  const findElementCell = (z) => {
    if (!tableGeom || !z) return null;
    const { x0, y0, cW, cH, eH, gap, extraYStart } = tableGeom;
    for (let r = 0; r < TABLE_ROWS; r++) {
      for (let ci = 0; ci < FILLED_COLS[r].length; ci++) {
        const c = FILLED_COLS[r][ci];
        if (getAtomicNumber(r, c) === z) {
          return { x: x0 + c * (cW + gap), y: y0 + r * (cH + gap), w: cW, h: cH, isEx: false, r, c };
        }
      }
    }
    for (let er = 0; er < 2; er++) {
      for (let ec = 0; ec < TABLE_EX_COLS; ec++) {
        if (getExtraAtomicNumber(er, ec) === z) {
          return { x: x0 + (ec + 2) * (cW + gap), y: extraYStart + er * (eH + gap), w: cW, h: eH, isEx: true, er, ec };
        }
      }
    }
    return null;
  };

  const drawTableHalo = () => {
    if (!effectsCtx) return;
    // 屏幕固定光晕：椭圆形径向渐变，不随表缩放
    const cx = CX;
    const cy = CY;
    const innerR = Math.min(W, H) * 0.30;
    const outerRX = W * 0.58;
    const outerRY = H * 0.55;
    // 用径向渐变 + 椭圆变换
    const grad = effectsCtx.createRadialGradient(cx, cy, innerR, cx, cy, Math.max(outerRX, outerRY));
    grad.addColorStop(0, 'rgba(100, 180, 255, 0)');
    grad.addColorStop(0.50, 'rgba(100, 180, 255, 0.025)');
    grad.addColorStop(0.75, 'rgba(120, 200, 255, 0.11)');
    grad.addColorStop(0.92, 'rgba(140, 220, 255, 0.05)');
    grad.addColorStop(1, 'rgba(140, 220, 255, 0)');
    effectsCtx.save();
    effectsCtx.translate(cx, cy);
    effectsCtx.scale(outerRX / Math.max(outerRX, outerRY), outerRY / Math.max(outerRX, outerRY));
    effectsCtx.translate(-cx, -cy);
    effectsCtx.fillStyle = grad;
    effectsCtx.fillRect(0, 0, W, H);
    effectsCtx.restore();
  };

  // 定位目标元素双层呼吸光环（表锚定，随表缩放）
  // 内层亮金 / 外层暖白，相位差 π，周期 2 秒
  const drawLocateHalo = (t) => {
    if (!effectsCtx || locateZ === null) return;
    const cell = findElementCell(locateZ);
    if (!cell) return;
    const { x, y, w, h } = cell;
    // 用视觉中心（应用 TILT 修正）作为光环位置
    const cx = x + w / 2;
    const cy = CY + (y + h / 2 - CY) * TABLE_TILT;
    const tNow = (typeof t === 'number') ? t : performance.now();
    const phase = (2 * Math.PI * tNow) / 2000;
    const innerAmp = 0.15;
    const outerAmp = 0.18;
    const innerBase = w * 0.45;
    const outerBase = w * 0.65;
    const innerR = innerBase * (1 + innerAmp * Math.sin(phase));
    const outerR = outerBase * (1 + outerAmp * Math.sin(phase + Math.PI));
    effectsCtx.save();
    // 内层金色光环
    effectsCtx.shadowColor = 'rgba(255, 215, 110, 0.85)';
    effectsCtx.shadowBlur = 18;
    const innerGrad = effectsCtx.createRadialGradient(cx, cy, innerR * 0.4, cx, cy, innerR);
    innerGrad.addColorStop(0, 'rgba(255, 220, 130, 0)');
    innerGrad.addColorStop(0.7, 'rgba(255, 215, 110, 0.35)');
    innerGrad.addColorStop(1, 'rgba(255, 215, 110, 0)');
    effectsCtx.fillStyle = innerGrad;
    effectsCtx.beginPath();
    effectsCtx.arc(cx, cy, innerR, 0, Math.PI * 2);
    effectsCtx.fill();
    // 外层暖白光环
    effectsCtx.shadowColor = 'rgba(255, 240, 220, 0.7)';
    effectsCtx.shadowBlur = 22;
    const outerGrad = effectsCtx.createRadialGradient(cx, cy, outerR * 0.5, cx, cy, outerR);
    outerGrad.addColorStop(0, 'rgba(255, 240, 220, 0)');
    outerGrad.addColorStop(0.75, 'rgba(255, 240, 220, 0.22)');
    outerGrad.addColorStop(1, 'rgba(255, 240, 220, 0)');
    effectsCtx.fillStyle = outerGrad;
    effectsCtx.beginPath();
    effectsCtx.arc(cx, cy, outerR, 0, Math.PI * 2);
    effectsCtx.fill();
    effectsCtx.restore();
  };

  // 定位十字准星高亮：行带 + 列带（主表范围，镧/锆系不参与列高亮）
  const drawLocateCrosshair = () => {
    if (!effectsCtx || !tableGeom || locateZ === null) return;
    const cell = findElementCell(locateZ);
    if (!cell) return;
    const { x0, y0, cW, cH, eH, gap, mainH } = tableGeom;
    const { r, c, isEx, er } = cell;
    effectsCtx.save();
    // 行带：覆盖 [x0, x0 + 18*(cW+gap)] × [rowY, rowY + cH]
    let rowY, rowH, rowLeft, rowRight;
    if (isEx) {
      // 镧/锆系行高度用 eH
      const exY = tableGeom.extraYStart + er * (eH + gap);
      rowY = exY;
      rowH = eH;
    } else {
      rowY = y0 + r * (cH + gap);
      rowH = cH;
    }
    rowLeft = x0;
    rowRight = x0 + 18 * (cW + gap);
    // 列带：仅在主表内，覆盖 [colX, colX + cW] × [y0, y0 + mainH]
    if (!isEx) {
      const colX = x0 + c * (cW + gap);
      const colY = y0;
      const colH = mainH || (7 * cH + 6 * gap);
      // 行带（仅主表行）
      effectsCtx.fillStyle = 'rgba(245, 215, 110, 0.10)';
      effectsCtx.fillRect(rowLeft, rowY, rowRight - rowLeft, rowH);
      // 列带
      effectsCtx.fillStyle = 'rgba(245, 215, 110, 0.10)';
      effectsCtx.fillRect(colX, colY, cW, colH);
    } else {
      // 镧/锆系行高亮：仅该行（不画列带，避免跨过主表空白区）
      const exLeft = x0 + 2 * (cW + gap);
      const exRight = x0 + (2 + 15) * (cW + gap) - gap;
      effectsCtx.fillStyle = 'rgba(245, 215, 110, 0.10)';
      effectsCtx.fillRect(exLeft, rowY, exRight - exLeft, rowH);
    }
    effectsCtx.restore();
  };

  const spawnMeteor = () => {
    const fromTop = Math.random() < 0.7;
    let x, y;
    if (fromTop) {
      x = Math.random() * W * 1.2 - W * 0.1;
      y = -20;
    } else {
      x = W + 20;
      y = Math.random() * H * 0.5;
    }
    const ang = Math.PI * (0.18 + Math.random() * 0.12);
    const speed = 1.2 + Math.random() * 1.6;
    meteors.push({
      x, y,
      vx: -Math.cos(ang) * speed,
      vy: Math.sin(ang) * speed,
      life: 0,
      maxLife: 1400 + Math.random() * 600,
      trail: []
    });
  };

  const updateMeteors = (dt) => {
    if (Math.random() < 0.006 && meteors.length < 4) spawnMeteor();
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.life += dt;
      m.x += m.vx;
      m.y += m.vy;
      m.trail.push({ x: m.x, y: m.y });
      if (m.trail.length > 18) m.trail.shift();
      if (m.life > m.maxLife || m.x < -50 || m.x > W + 50 || m.y > H + 50) {
        meteors.splice(i, 1);
      }
    }
  };

  const drawMeteors = () => {
    if (!effectsCtx) return;
    for (const m of meteors) {
      for (let i = 0; i < m.trail.length - 1; i++) {
        const f = i / m.trail.length;
        const a = f * 0.6;
        effectsCtx.strokeStyle = `rgba(220, 240, 255, ${a})`;
        effectsCtx.lineWidth = 1;
        effectsCtx.beginPath();
        effectsCtx.moveTo(m.trail[i].x, m.trail[i].y);
        effectsCtx.lineTo(m.trail[i + 1].x, m.trail[i + 1].y);
        effectsCtx.stroke();
      }
      effectsCtx.save();
      effectsCtx.shadowColor = 'rgba(255, 255, 255, 0.9)';
      effectsCtx.shadowBlur = 6;
      effectsCtx.fillStyle = 'rgba(255, 255, 255, 1)';
      effectsCtx.beginPath();
      effectsCtx.arc(m.x, m.y, 1.6, 0, Math.PI * 2);
      effectsCtx.fill();
      effectsCtx.restore();
    }
  };

  const drawEffects = (t) => {
    if (!effectsCtx) return;
    effectsCtx.clearRect(0, 0, W, H);
    const dt = lastFrameTime ? (t - lastFrameTime) : 16;
    lastFrameTime = t;
    if (ambientSources.steam.length > 0 && Math.random() < 0.5) {
      const idx = Math.floor(Math.random() * ambientSources.steam.length);
      spawnSteam(ambientSources.steam[idx]);
    }
    updateSteam(dt);
    // 屏幕固定光晕：始终贴屏幕边缘，不随表缩放
    drawTableHalo();
    // 表锚定特效（随表缩放）：稀有气体光晕 / 粒子 / 锕系扫描线 / 定位准星 + 光环
    effectsCtx.save();
    effectsCtx.translate(CX, CY);
    effectsCtx.scale(zoom, zoom);
    effectsCtx.translate(-CX, -CY);
    drawNobleGlows(t);
    drawSteam();
    drawActinideScans(t);
    // 定位特效：准星高亮 + 双层呼吸光环（仅在激活时绘制）
    if (locateZ !== null) {
      drawLocateCrosshair();
      drawLocateHalo(t);
    }
    effectsCtx.restore();
    // 流星走屏幕空间，不随表缩放
    updateMeteors(dt);
    drawMeteors();
  };

  function drawTable() {
    if (!tableCanvas) return;
    ctx.save();
    ctx.translate(CX, CY);
    ctx.scale(zoom, zoom);
    ctx.translate(-CX, -CY);
    // 定位激活：先画降饱和全表，再把目标 cell 局部重画保持原色
    if (locateZ !== null) {
      const target = findElementCell(locateZ);
      ctx.filter = 'saturate(0.4) brightness(0.75)';
      ctx.drawImage(tableCanvas, 0, 0, W, H);
      ctx.filter = 'none';
      if (target) {
        const { x, y, w, h } = target;
        // 视觉上应用 TILT：源区域在 srcCanvas 上保持原坐标（表绘制时未做 TILT），
        // 目标位置按 TILT 修正即可。源区域用原 x,y,w,h。
        ctx.drawImage(tableCanvas, x, y, w, h, x, y, w, h);
      }
    } else {
      ctx.filter = 'none';
      ctx.drawImage(tableCanvas, 0, 0, W, H);
    }
    ctx.restore();
  }

  let activeZ = null;
  let activeOrbitals = null;
  let bohrParticles = null;
  let cardParticles = [];
  let cardParticleTimer = 0;

  const pickElement = (clientX, clientY) => {
    if (!tableGeom) return null;
    const rect = canvas.getBoundingClientRect();
    let x = clientX - rect.left;
    let y = clientY - rect.top;
    // 缩放反变换：把屏幕坐标还原为表内坐标
    x = (x - CX) / zoom + CX;
    y = (y - CY) / zoom + CY;
    const yUn = CY + (y - CY) / TABLE_TILT;
    const { x0, y0, cW, cH, eH, gap, extraYStart } = tableGeom;
    for (let r = 0; r < TABLE_ROWS; r++) {
      for (let ci = 0; ci < FILLED_COLS[r].length; ci++) {
        const c = FILLED_COLS[r][ci];
        const cx = x0 + c * (cW + gap);
        const cy = y0 + r * (cH + gap);
        if (x >= cx && x <= cx + cW && yUn >= cy && yUn <= cy + cH) {
          const z = getAtomicNumber(r, c);
          if (z) return { z, mx: cx + cW / 2, my: cy + cH / 2 };
        }
      }
    }
    for (let er = 0; er < 2; er++) {
      for (let ec = 0; ec < TABLE_EX_COLS; ec++) {
        const cx = x0 + (ec + 2) * (cW + gap);
        const cy = extraYStart + er * (eH + gap);
        if (x >= cx && x <= cx + cW && yUn >= cy && yUn <= cy + eH) {
          const z = getExtraAtomicNumber(er, ec);
          if (z) {
            const visualY = CY + (cy + eH / 2 - CY) * TABLE_TILT;
            return { z, mx: cx + cW / 2, my: visualY };
          }
        }
      }
    }
    return null;
  };

  const badgeFor = (z) => {
    if (!z) return '?';
    if (z === 1) return 'H';
    if (z === 6) return 'C';
    if (z === 7) return 'N';
    if (z === 8) return 'O';
    if (z === 26) return 'Fe';
    if (z === 79) return 'Au';
    if (z === 47) return 'Ag';
    if (z === 29) return 'Cu';
    if (z === 82) return 'Pb';
    if (z === 92) return 'U';
    if (z === 80) return 'Hg';
    const e = ELEMENTS[z - 1];
    return e ? e.sym : '?';
  };

  const barWidth = (val, max) => {
    if (val === null || val === undefined || isNaN(val)) return 0;
    return Math.max(2, Math.min(100, (val / max) * 100));
  };

  const ensureBohrParticles = () => {
    if (!bohrParticles) {
      bohrParticles = [];
      for (let i = 0; i < 14; i++) {
        bohrParticles.push({
          ang: Math.random() * Math.PI * 2,
          rad: rand(0.78, 0.96),
          speed: rand(0.0003, 0.0008) * (Math.random() < 0.5 ? -1 : 1),
          r: rand(0.6, 1.6),
          a: rand(0.35, 0.75),
          tilt: rand(-0.35, 0.35)
        });
      }
    }
  };

  const drawBohrFrame = (t) => {
    if (!bohrCtx || !bohrCanvas || !activeOrbitals) return;
    const w = bohrCanvas.width;
    const h = bohrCanvas.height;
    const cx = w / 2;
    const cy = h / 2;

    bohrCtx.clearRect(0, 0, w, h);

    const orbits = activeOrbitals;
    const n = orbits.length;
    const maxOrbit = Math.max(0.6, (n - 1) * 0.18 + 0.18);

    const coreG = bohrCtx.createRadialGradient(cx, cy, 0, cx, cy, 14);
    coreG.addColorStop(0, 'rgba(255, 255, 240, 1)');
    coreG.addColorStop(0.4, 'rgba(255, 215, 130, 0.9)');
    coreG.addColorStop(1, 'rgba(245, 180, 80, 0)');
    bohrCtx.fillStyle = coreG;
    bohrCtx.beginPath();
    bohrCtx.arc(cx, cy, 16, 0, Math.PI * 2);
    bohrCtx.fill();

    bohrCtx.shadowColor = 'rgba(255, 200, 110, 0.9)';
    bohrCtx.shadowBlur = 14;
    bohrCtx.fillStyle = '#fff3c4';
    bohrCtx.beginPath();
    bohrCtx.arc(cx, cy, 4.5, 0, Math.PI * 2);
    bohrCtx.fill();
    bohrCtx.shadowBlur = 0;

    bohrCtx.lineWidth = 1;
    bohrCtx.strokeStyle = 'rgba(170, 220, 255, 0.35)';
    bohrCtx.shadowColor = 'rgba(170, 220, 255, 0.5)';
    bohrCtx.shadowBlur = 4;
    for (let i = 0; i < n; i++) {
      const rx = 22 + i * (Math.min(w, h) * 0.32) / Math.max(1, n - 1) * 0.7;
      const ry = rx * 0.46;
      bohrCtx.beginPath();
      bohrCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      bohrCtx.stroke();
    }
    bohrCtx.shadowBlur = 0;

    const palette = ['#7fd4ff', '#a6f0ff', '#ffd57f', '#ff8a5b', '#c9a0ff', '#9affc6', '#ff9ed1'];
    for (let i = 0; i < n; i++) {
      const count = orbits[i];
      const rx = 22 + i * (Math.min(w, h) * 0.32) / Math.max(1, n - 1) * 0.7;
      const ry = rx * 0.46;
      const baseSpeed = 0.0006 + (n - i) * 0.00008;
      for (let e = 0; e < count; e++) {
        const phase = (e / count) * Math.PI * 2 + i * 0.4;
        const a = phase + t * baseSpeed * (i % 2 === 0 ? 1 : -1);
        const ex = cx + Math.cos(a) * rx;
        const ey = cy + Math.sin(a) * ry;
        const color = palette[i % palette.length];
        bohrCtx.shadowColor = color;
        bohrCtx.shadowBlur = 6;
        bohrCtx.fillStyle = color;
        bohrCtx.beginPath();
        bohrCtx.arc(ex, ey, 1.6, 0, Math.PI * 2);
        bohrCtx.fill();
      }
    }
    bohrCtx.shadowBlur = 0;

    ensureBohrParticles();
    for (let i = 0; i < bohrParticles.length; i++) {
      const p = bohrParticles[i];
      p.ang += p.speed;
      const orbitRx = 22 + (n - 1) * (Math.min(w, h) * 0.32) / Math.max(1, n - 1) * 0.7;
      const orbitRy = orbitRx * 0.46;
      const px = cx + Math.cos(p.ang) * orbitRx * p.rad;
      const py = cy + Math.sin(p.ang) * orbitRy * p.rad + p.tilt * 6;
      bohrCtx.fillStyle = `rgba(170, 220, 255, ${p.a * 0.7})`;
      bohrCtx.beginPath();
      bohrCtx.arc(px, py, p.r, 0, Math.PI * 2);
      bohrCtx.fill();
    }
  };

  const updateCardParticles = (t) => {
    if (!cardEl) return;
    if (t - cardParticleTimer < 80) return;
    cardParticleTimer = t;
    if (cardParticles.length > 14) {
      for (let i = 0; i < cardParticles.length; i++) {
        const el = cardParticles[i];
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }
      cardParticles = [];
    }
    const rect = cardEl.getBoundingClientRect();
    if (rect.width === 0) return;
    const edge = Math.floor(Math.random() * 4);
    let sx, sy, vx, vy;
    if (edge === 0) { sx = rect.left + Math.random() * rect.width; sy = rect.top; vx = (Math.random() - 0.5) * 0.4; vy = -0.6 - Math.random() * 0.4; }
    else if (edge === 1) { sx = rect.left + Math.random() * rect.width; sy = rect.bottom; vx = (Math.random() - 0.5) * 0.4; vy = 0.6 + Math.random() * 0.4; }
    else if (edge === 2) { sx = rect.left; sy = rect.top + Math.random() * rect.height; vx = -0.6 - Math.random() * 0.4; vy = (Math.random() - 0.5) * 0.4; }
    else { sx = rect.right; sy = rect.top + Math.random() * rect.height; vx = 0.6 + Math.random() * 0.4; vy = (Math.random() - 0.5) * 0.4; }
    const el = document.createElement('div');
    el.className = 'card-particle';
    el.style.left = sx + 'px';
    el.style.top = sy + 'px';
    el.style.opacity = '1';
    document.body.appendChild(el);
    cardParticles.push(el);
    const dur = 1400 + Math.random() * 700;
    const dx = vx * dur * 0.05;
    const dy = vy * dur * 0.05;
    el.animate(
      [
        { transform: 'translate(0, 0) scale(1)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) scale(0.2)`, opacity: 0 }
      ],
      { duration: dur, easing: 'cubic-bezier(0.2, 0.7, 0.3, 1)', fill: 'forwards' }
    );
  };

  const drawConnectionLine = (mx, my, tMs) => {
    if (!connectCtx || !cardEl) return;
    connectCtx.clearRect(0, 0, W, H);
    const rect = cardEl.getBoundingClientRect();
    if (rect.width === 0) return;
    const cardCx = rect.left + rect.width / 2;
    const cardCy = rect.top + rect.height / 2;
    // mx, my 是表内未缩放坐标；缩放后映射到屏幕坐标
    const sx = (mx - CX) * zoom + CX;
    const sy = (my - CY) * zoom + CY;
    const halfW = rect.width / 2;
    const halfH = rect.height / 2;
    const dx = cardCx - sx;
    const dy = cardCy - sy;
    const adx = Math.abs(dx) || 0.0001;
    const ady = Math.abs(dy) || 0.0001;
    const t1 = halfW / adx;
    const t2 = halfH / ady;
    const tk = Math.min(t1, t2);
    const ex = cardCx - dx * tk;
    const ey = cardCy - dy * tk;

    const ang = Math.atan2(ey - sy, ex - sx);
    const len = Math.hypot(ex - sx, ey - sy);
    const locateMode = locateZ !== null && locateZ === activeZ;

    connectCtx.save();
    connectCtx.translate(sx, sy);
    connectCtx.rotate(ang);

    if (locateMode) {
      // 定位模式：金色实线（覆盖虚线）
      connectCtx.shadowColor = 'rgba(255, 220, 130, 0.95)';
      connectCtx.shadowBlur = 12;
      connectCtx.lineWidth = 2.6;
      connectCtx.strokeStyle = 'rgba(255, 220, 130, 0.98)';
      connectCtx.lineCap = 'round';
      connectCtx.beginPath();
      connectCtx.moveTo(0, 0);
      connectCtx.lineTo(len, 0);
      connectCtx.stroke();
      // 端点亮起
      connectCtx.shadowBlur = 16;
      connectCtx.fillStyle = 'rgba(255, 235, 160, 1.0)';
      connectCtx.beginPath();
      connectCtx.arc(0, 0, 3.4, 0, Math.PI * 2);
      connectCtx.fill();
      connectCtx.beginPath();
      connectCtx.arc(len, 0, 3.4, 0, Math.PI * 2);
      connectCtx.fill();
      // 脉冲光点：1Hz 从浮窗端（0）流向元素端（len）
      const tNow = (typeof tMs === 'number') ? tMs : performance.now();
      const phase = (tNow / 1000) % 1;
      const pulseX = phase * len;
      connectCtx.shadowColor = 'rgba(255, 230, 150, 1.0)';
      connectCtx.shadowBlur = 16;
      const grad = connectCtx.createRadialGradient(pulseX, 0, 0, pulseX, 0, 7);
      grad.addColorStop(0, 'rgba(255, 245, 200, 1.0)');
      grad.addColorStop(0.45, 'rgba(255, 220, 130, 0.85)');
      grad.addColorStop(1, 'rgba(255, 200, 90, 0)');
      connectCtx.fillStyle = grad;
      connectCtx.beginPath();
      connectCtx.arc(pulseX, 0, 7, 0, Math.PI * 2);
      connectCtx.fill();
    } else {
      // 默认模式：金色虚线
      const dashLen = 8;
      const gapLen = 6;
      const cycle = dashLen + gapLen;
      const steps = Math.floor(len / cycle);
      connectCtx.shadowColor = 'rgba(245, 215, 110, 0.85)';
      connectCtx.shadowBlur = 8;
      connectCtx.lineWidth = 1.8;
      connectCtx.strokeStyle = 'rgba(245, 215, 110, 0.92)';
      connectCtx.lineCap = 'round';
      connectCtx.beginPath();
      for (let i = 0; i < steps; i++) {
        const a0 = i * cycle;
        const a1 = a0 + dashLen;
        connectCtx.moveTo(a0, 0);
        connectCtx.lineTo(a1, 0);
      }
      connectCtx.stroke();
      connectCtx.shadowBlur = 0;
      connectCtx.fillStyle = 'rgba(245, 215, 110, 0.95)';
      connectCtx.beginPath();
      connectCtx.arc(0, 0, 2.6, 0, Math.PI * 2);
      connectCtx.fill();
      connectCtx.beginPath();
      connectCtx.arc(len, 0, 2.6, 0, Math.PI * 2);
      connectCtx.fill();
    }
    connectCtx.restore();
  };

  const clearConnectionLine = () => {
    if (!connectCtx) return;
    connectCtx.clearRect(0, 0, W, H);
  };

  const showInfoCard = (z, mx, my) => {
    if (!cardEl) return;
    const e = ELEMENTS[z - 1];
    if (!e) return;
    const en = EN_VALUES[z - 1];
    const tagline = TAGLINES[z - 1] || e.cn;
    cardTaglineEl.textContent = tagline;
    cardBadgeEl.textContent = badgeFor(z);
    statZEl.textContent = String(e.z);
    statMassEl.textContent = e.mass;
    statEnEl.textContent = en === null ? '—' : en.toFixed(2);
    barZEl.style.width = barWidth(e.z, 118) + '%';
    const massNum = parseFloat(e.mass);
    barMassEl.style.width = barWidth(massNum, 300) + '%';
    barEnEl.style.width = (en === null ? 0 : barWidth(en, 4.0)) + '%';

    activeZ = z;
    activeOrbitals = getOrbitals(z);
    bohrParticles = null;

    // 同步收藏状态
    activeFavZ = z;
    if (btnFavEl) {
      if (favSet.has(z)) btnFavEl.classList.add('active');
      else btnFavEl.classList.remove('active');
    }
    renderFavBadge(favSet.has(z));

    cardEl.style.display = 'block';
    if (appEl) appEl.classList.add('dimmed');
    requestAnimationFrame(() => {
      drawConnectionLine(mx, my);
    });
  };

  const hideInfoCard = () => {
    if (!cardEl) return;
    cardEl.style.display = 'none';
    if (appEl) appEl.classList.remove('dimmed');
    clearConnectionLine();
    activeZ = null;
    activeOrbitals = null;
    bohrParticles = null;
    locateZ = null;
    if (btnLocateEl) btnLocateEl.classList.remove('active');
    activeFavZ = null;
    if (btnFavEl) btnFavEl.classList.remove('active');
    if (favBadgeEl) favBadgeEl.classList.remove('visible');
    for (let i = 0; i < cardParticles.length; i++) {
      const el = cardParticles[i];
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }
    cardParticles = [];
  };

  // === 收藏徽章：3D 五角星 SVG ===
  // 五角星几何：外接圆半径 10，外点与内点交错（5 外点 + 5 内点）
  const STAR_OUTER = 10;
  const STAR_INNER_RATIO = 0.42;
  const buildStarPath = (cx, cy, r) => {
    const inner = r * STAR_INNER_RATIO;
    let d = '';
    for (let i = 0; i < 10; i++) {
      const ang = -Math.PI / 2 + (i * Math.PI) / 5;
      const rad = (i % 2 === 0) ? r : inner;
      const x = cx + Math.cos(ang) * rad;
      const y = cy + Math.sin(ang) * rad;
      d += (i === 0 ? 'M' : 'L') + x.toFixed(2) + ',' + y.toFixed(2);
    }
    return d + 'Z';
  };
  const buildStarSvg = () => {
    const cx = 11, cy = 11, r = STAR_OUTER;
    const pathMain = buildStarPath(cx, cy, r);
    const pathHi = buildStarPath(cx, cy, r * 0.55);
    return `
<svg class="fav-star" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fav-star-grad" cx="0.35" cy="0.30" r="0.85">
      <stop offset="0%"  stop-color="#fff5d0" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f5d76e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c89b3c" stop-opacity="0.92"/>
    </radialGradient>
    <linearGradient id="fav-star-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fff5d0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a3f10" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="fav-star-hi" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#fff8e0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff8e0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path d="${pathMain}" fill="url(#fav-star-edge)" />
  <path d="${pathMain}" fill="url(#fav-star-grad)" opacity="0.92"/>
  <path d="${pathMain}" fill="none" stroke="#fff5d0" stroke-width="0.6" stroke-opacity="0.55"/>
  <path d="${pathHi}" fill="url(#fav-star-hi)"/>
</svg>
<div class="fav-shine-mask"><div class="fav-shine"></div></div>
<div class="fav-halo">
  <div class="fav-halo-dot" style="--dx: 14px; --dy: -10px;"></div>
  <div class="fav-halo-dot" style="--dx: 12px; --dy: 10px;"></div>
  <div class="fav-halo-dot" style="--dx: -14px; --dy: -8px;"></div>
  <div class="fav-halo-dot" style="--dx: -12px; --dy: 12px;"></div>
  <div class="fav-halo-dot" style="--dx: 16px; --dy: 0px;"></div>
  <div class="fav-halo-dot" style="--dx: -16px; --dy: 0px;"></div>
  <div class="fav-halo-dot" style="--dx: 0px; --dy: -14px;"></div>
  <div class="fav-halo-dot" style="--dx: 0px; --dy: 16px;"></div>
</div>`;
  };

  const renderFavBadge = (visible) => {
    if (!favBadgeEl) return;
    if (!favBadgeEl.querySelector('.fav-star')) {
      favBadgeEl.innerHTML = buildStarSvg();
    }
    if (visible) {
      favBadgeEl.classList.add('visible');
    } else {
      favBadgeEl.classList.remove('visible');
    }
  };

  // === 粒子火花：按钮中心 → 标签栏徽章处 ===
  const spawnFavBurst = (fromRect, toRect) => {
    if (!fromRect || !toRect) return;
    const sx = fromRect.left + fromRect.width / 2;
    const sy = fromRect.top + fromRect.height / 2;
    const dx = (toRect.left + toRect.width / 2) - sx;
    const dy = (toRect.top + toRect.height / 2) - sy;
    const N = 14 + Math.floor(Math.random() * 6); // 14-19
    for (let i = 0; i < N; i++) {
      const el = document.createElement('div');
      el.className = 'fav-burst';
      el.style.left = sx + 'px';
      el.style.top  = sy + 'px';
      document.body.appendChild(el);
      // 抵达目标点附近的随机扰动
      const jitterX = (Math.random() - 0.5) * 18;
      const jitterY = (Math.random() - 0.5) * 18;
      const dur = 800 + Math.random() * 400; // 0.8-1.2s
      el.animate(
        [
          { transform: 'translate(0, 0) scale(1)', opacity: 1 },
          { transform: `translate(${dx + jitterX}px, ${dy + jitterY}px) scale(0.2)`, opacity: 0 }
        ],
        { duration: dur, easing: 'cubic-bezier(0.2, 0.7, 0.3, 1)', fill: 'forwards' }
      );
      setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, dur + 50);
    }
  };

  // === 收藏按钮：切换 + 触发粒子 + 徽章 ===
  const onFavBtnClick = () => {
    if (!btnFavEl || activeZ === null) return;
    const btnRect = btnFavEl.getBoundingClientRect();
    if (favSet.has(activeZ)) {
      // 取消收藏
      favSet.delete(activeZ);
      btnFavEl.classList.remove('active');
      renderFavBadge(false);
    } else {
      // 添加收藏
      favSet.add(activeZ);
      btnFavEl.classList.add('active');
      // 粒子火花：从按钮中心 → 标签栏徽章位置
      const taglineRect = cardTaglineEl ? cardTaglineEl.getBoundingClientRect() : null;
      const badgeRect = favBadgeEl ? favBadgeEl.getBoundingClientRect() : null;
      if (taglineRect) {
        spawnFavBurst(btnRect, badgeRect || taglineRect);
      }
      // 徽章先以不可见态注入 SVG，0.4s 后再触发 visible 实现"凝聚成形"
      renderFavBadge(false);
      setTimeout(() => renderFavBadge(true), 420);
    }
    // 刷新收藏室面板
    renderCollectionGrid();
    updateCollectionProgress();
  };

  // === 收藏室面板：网格与进度 ===
  const CATEGORY_COLORS = {
    alkali:    'rgba(255, 130, 130, 0.95)',
    alkaline:  'rgba(255, 175, 100, 0.95)',
    transition:'rgba(245, 215, 110, 0.95)',
    post:      'rgba(170, 220, 255, 0.95)',
    metalloid: 'rgba(170, 230, 200, 0.95)',
    nonmetal:  'rgba(170, 255, 170, 0.95)',
    halogen:   'rgba(255, 200, 240, 0.95)',
    noble:     'rgba(200, 170, 255, 0.95)',
    lanthanide:'rgba(255, 200, 150, 0.95)',
    actinide:  'rgba(255, 170, 200, 0.95)',
    unknown:   'rgba(180, 180, 180, 0.95)'
  };
  const getCategoryColor = (z) => {
    const e = ELEMENTS[z - 1];
    if (!e) return CATEGORY_COLORS.unknown;
    return CATEGORY_COLORS[e.cat] || CATEGORY_COLORS.unknown;
  };

  const renderCollectionGrid = () => {
    if (!collectionGridEl) return;
    // 简单实现：直接重建 118 个 cell
    const frag = document.createDocumentFragment();
    for (let z = 1; z <= 118; z++) {
      const cell = document.createElement('div');
      cell.className = 'grid-cell';
      if (favSet.has(z)) {
        const e = ELEMENTS[z - 1];
        cell.classList.add('filled');
        const color = getCategoryColor(z);
        cell.style.background = `linear-gradient(135deg, ${color.replace('0.95', '0.18')}, rgba(120, 200, 255, 0.10))`;
        cell.style.borderColor = color;
        cell.style.boxShadow = `0 0 8px ${color.replace('0.95', '0.35')}`;
        const sym = document.createElement('div');
        sym.className = 'grid-sym';
        sym.textContent = e.sym;
        const zn = document.createElement('div');
        zn.className = 'grid-z';
        zn.textContent = String(z);
        cell.appendChild(sym);
        cell.appendChild(zn);
      } else {
        cell.classList.add('empty');
      }
      frag.appendChild(cell);
    }
    collectionGridEl.innerHTML = '';
    collectionGridEl.appendChild(frag);
  };

  const updateCollectionProgress = () => {
    if (!progressFillEl || !progressCountEl) return;
    const n = favSet.size;
    const pct = (n / 118) * 100;
    progressFillEl.style.width = pct + '%';
    progressCountEl.textContent = n + '/118';
  };

  // === 收藏室面板：滑入 / 滑出 ===
  const openCollection = () => {
    if (!collectionPanelEl || !collectionHandleEl) return;
    if (collectionOpen) return;
    collectionOpen = true;
    collectionAnim = 'opening';
    collectionPanelEl.classList.remove('closing');
    collectionPanelEl.classList.add('open');
    collectionHandleEl.classList.add('hidden');
    // 速度线残影
    if (speedLinesEl) {
      speedLinesEl.classList.remove('show');
      // 强制重排后再次添加
      void speedLinesEl.offsetWidth;
      speedLinesEl.classList.add('show');
    }
    renderCollectionGrid();
    updateCollectionProgress();
    setTimeout(() => { collectionAnim = 'idle'; }, 400);
  };

  const closeCollection = () => {
    if (!collectionPanelEl || !collectionHandleEl) return;
    if (!collectionOpen) return;
    collectionOpen = false;
    collectionAnim = 'closing';
    collectionPanelEl.classList.remove('open');
    collectionPanelEl.classList.add('closing');
    // 粒子尾迹：从面板左边缘向右侧屏幕边缘
    const panelRect = collectionPanelEl.getBoundingClientRect();
    if (panelRect.width > 0) {
      const startX = panelRect.left;
      const endX = window.innerWidth;
      const midY = panelRect.top + panelRect.height / 2;
      const N = 16;
      for (let i = 0; i < N; i++) {
        const el = document.createElement('div');
        el.className = 'fav-burst trail';
        el.style.left = startX + 'px';
        el.style.top  = (midY + (Math.random() - 0.5) * panelRect.height * 0.6) + 'px';
        document.body.appendChild(el);
        const dx = endX - startX + 30;
        const dy = (Math.random() - 0.5) * 20;
        const dur = 600 + Math.random() * 200;
        el.animate(
          [
            { transform: 'translate(0, 0) scale(1.1)', opacity: 0.9 },
            { transform: `translate(${dx}px, ${dy}px) scale(0.3)`, opacity: 0 }
          ],
          { duration: dur, easing: 'cubic-bezier(0.55, 0.05, 0.67, 0.19)', fill: 'forwards' }
        );
        setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, dur + 50);
      }
    }
    // 800ms 后抓手重新出现
    setTimeout(() => {
      if (!collectionOpen) collectionHandleEl.classList.remove('hidden');
      collectionAnim = 'idle';
    }, 800);
  };

  const onCanvasClick = (ev) => {
    if (isPinching) return;
    if (activeZ !== null) {
      hideInfoCard();
      return;
    }
    const hit = pickElement(ev.clientX, ev.clientY);
    if (hit) showInfoCard(hit.z, hit.mx, hit.my);
  };

  canvas.addEventListener('click', onCanvasClick);
  if (cardCloseEl) cardCloseEl.addEventListener('click', hideInfoCard);
  if (btnLocateEl) btnLocateEl.addEventListener('click', () => {
    if (locateZ === null) {
      locateZ = activeZ;
      btnLocateEl.classList.add('active');
    } else {
      locateZ = null;
      btnLocateEl.classList.remove('active');
    }
  });
  if (btnFavEl) btnFavEl.addEventListener('click', onFavBtnClick);
  if (collectionHandleEl) collectionHandleEl.addEventListener('click', openCollection);
  if (collectionCloseEl) collectionCloseEl.addEventListener('click', closeCollection);
  window.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && activeZ !== null) hideInfoCard();
  });

  // ---- 缩放交互：双指捏合 / 桌面 Ctrl+滚轮 ----
  const pinchPointers = new Map();
  let pinchStartDist = 0;
  let pinchStartZoom = 1.0;
  let isPinching = false;

  const pinchDist = () => {
    const pts = [...pinchPointers.values()];
    if (pts.length < 2) return 0;
    return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  };

  const onPointerDown = (ev) => {
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    pinchPointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pinchPointers.size === 2) {
      pinchStartDist = pinchDist();
      pinchStartZoom = targetZoom;
      isPinching = true;
    }
  };
  const onPointerMove = (ev) => {
    if (!pinchPointers.has(ev.pointerId)) return;
    pinchPointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pinchPointers.size === 2 && pinchStartDist > 0 && isPinching) {
      const d = pinchDist();
      if (d > 0) {
        targetZoom = clampZoom(pinchStartZoom * (d / pinchStartDist));
      }
    }
  };
  const onPointerEnd = (ev) => {
    pinchPointers.delete(ev.pointerId);
    if (pinchPointers.size < 2) {
      isPinching = false;
      pinchStartDist = 0;
    }
  };
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerEnd);
  canvas.addEventListener('pointercancel', onPointerEnd);
  canvas.addEventListener('pointerleave', onPointerEnd);

  // 点击若双指按下则不触发元素选中
  let lastPointerDownCount = 0;
  canvas.addEventListener('pointerdown', () => { lastPointerDownCount = pinchPointers.size; });
  canvas.addEventListener('click', (ev) => {
    if (isPinching || pinchPointers.size >= 2) {
      ev.stopImmediatePropagation();
      ev.preventDefault();
    }
  }, true);

  // 桌面 Ctrl/Cmd + 滚轮缩放
  const onWheel = (ev) => {
    if (ev.ctrlKey || ev.metaKey) {
      ev.preventDefault();
      const factor = ev.deltaY < 0 ? ZOOM_STEP_WHEEL : (1 / ZOOM_STEP_WHEEL);
      targetZoom = clampZoom(targetZoom * factor);
    }
  };
  canvas.addEventListener('wheel', onWheel, { passive: false });
  document.addEventListener('click', (ev) => {
    if (activeZ === null) return;
    const t = ev.target;
    if (cardEl && cardEl.contains(t)) return;
    if (t === canvas) return;
    hideInfoCard();
  });

  function loop(t) {
    // 平滑缩放插值
    zoom += (targetZoom - zoom) * 0.18;
    if (Math.abs(targetZoom - zoom) < 0.0008) zoom = targetZoom;
    drawBase();
    drawNebula(t);
    drawVolumetric(t);
    drawStars(t);
    drawCenterMask();
    drawTable();
    drawEffects(t);
    if (activeOrbitals) {
      drawBohrFrame(t);
      if (activeZ !== null) {
        updateCardParticles(t);
        if (tableGeom) {
          const e = ELEMENTS[activeZ - 1];
          if (e) {
            const rect = cardEl ? cardEl.getBoundingClientRect() : null;
            if (rect) {
              const cvmx = CX;
              const cvmy = CY;
              let best = null;
              for (let r = 0; r < TABLE_ROWS; r++) {
                for (let ci = 0; ci < FILLED_COLS[r].length; ci++) {
                  const c = FILLED_COLS[r][ci];
                  if (getAtomicNumber(r, c) === activeZ) {
                    const cx = tableGeom.x0 + c * (tableGeom.cW + tableGeom.gap);
                    const cy = tableGeom.y0 + r * (tableGeom.cH + tableGeom.gap);
                    best = { mx: cx + tableGeom.cW / 2, my: cy + tableGeom.cH / 2 };
                    break;
                  }
                }
                if (best) break;
              }
              if (!best) {
                for (let er = 0; er < 2; er++) {
                  for (let ec = 0; ec < TABLE_EX_COLS; ec++) {
                    if (getExtraAtomicNumber(er, ec) === activeZ) {
                      const cx = tableGeom.x0 + (ec + 2) * (tableGeom.cW + tableGeom.gap);
                      const cy = tableGeom.extraYStart + er * (tableGeom.eH + tableGeom.gap);
                      const visualY = CY + (cy + tableGeom.eH / 2 - CY) * TABLE_TILT;
                      best = { mx: cx + tableGeom.cW / 2, my: visualY };
                      break;
                    }
                  }
                  if (best) break;
                }
              }
              if (best) drawConnectionLine(best.mx, best.my, t);
            }
          }
        }
      }
    }
    requestAnimationFrame(loop);
  }

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    if (resizeTimer) cancelAnimationFrame(resizeTimer);
    resizeTimer = requestAnimationFrame(() => {
      resize();
      buildStars();
      buildTable();
    });
  });

  resize();
  buildStars();
  buildTable();
  // 收藏室初始：渲染网格 + 进度
  renderCollectionGrid();
  updateCollectionProgress();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
