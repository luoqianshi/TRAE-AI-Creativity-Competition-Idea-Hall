<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 丢垃圾小游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                   "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #b8e4ff 0%, #e6f7ff 55%, #fff6d5 100%);
    }
    #title {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      font-weight: 800;
      color: #3a6fb0;
      text-shadow: 2px 2px 0 #fff;
      z-index: 10;
      letter-spacing: 2px;
      user-select: none;
    }
    #tip {
      position: absolute;
      top: 62px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: #6c8fb8;
      z-index: 10;
      user-select: none;
    }
    #main-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 200px);
      display: block;
    }
    #shelf-wrap {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 200px;
      background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255, 243, 224, 0.9) 40%, #ffe0b2 100%);
      border-top: 4px solid #ffb74d;
      box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    #shelf {
      display: flex;
      gap: 14px;
      padding: 0 24px;
      overflow-x: auto;
      width: 100%;
      justify-content: center;
    }
    .item {
      width: 150px;
      height: 160px;
      border-radius: 20px;
      background: #ffffff;
      border: 3px solid #ffcc80;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      box-shadow: 0 4px 0 #e0a36e, 0 6px 14px rgba(0,0,0,0.08);
      flex-shrink: 0;
      user-select: none;
    }
    .item:hover {
      transform: translateY(-6px);
      border-color: #ff8a65;
      box-shadow: 0 8px 0 #d17a5c, 0 12px 20px rgba(0,0,0,0.15);
    }
    .item:active { transform: translateY(-2px); }
    .item canvas {
      width: 110px;
      height: 110px;
      display: block;
    }
    .item-label {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 700;
      color: #6d4c41;
    }
    #score {
      position: absolute;
      top: 20px;
      right: 24px;
      background: rgba(255,255,255,0.85);
      border: 3px solid #ffb74d;
      border-radius: 16px;
      padding: 8px 16px;
      font-size: 16px;
      font-weight: 800;
      color: #e65100;
      z-index: 10;
      user-select: none;
    }
    #actions {
      position: absolute;
      top: 65px;
      right: 24px;
      z-index: 10;
    }
    .action-btn {
      background: linear-gradient(135deg, #ff7043, #ff5722);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 7px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 0 #bf360c, 0 6px 14px rgba(0,0,0,0.15);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      user-select: none;
    }
    .action-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 0 #bf360c, 0 10px 20px rgba(0,0,0,0.2);
    }
    .action-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 0 #bf360c;
    }
    /* 对话框 */
    .dialog-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(3px);
    }
    .dialog-overlay.hidden { display: none; }
    .dialog-box {
      background: #fff;
      border-radius: 22px;
      padding: 28px 30px 22px;
      width: 360px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      border: 3px solid #ffcc80;
    }
    .dialog-title {
      font-size: 20px;
      font-weight: 800;
      color: #e65100;
      text-align: center;
      margin-bottom: 18px;
    }
    .dialog-body { margin-bottom: 20px; }
    .dialog-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #5d4037;
      margin-bottom: 8px;
    }
    .dialog-input {
      width: 100%;
      padding: 10px 14px;
      border: 2.5px solid #ffcc80;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      color: #4e342e;
      outline: none;
      transition: border-color 0.15s;
      box-sizing: border-box;
    }
    .dialog-input:focus { border-color: #ff7043; }
    .dialog-hint {
      margin-top: 8px;
      font-size: 12px;
      color: #9e9e9e;
    }
    .dialog-footer {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    .dialog-btn {
      padding: 9px 22px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .dialog-btn:active { transform: scale(0.96); }
    .dialog-btn.cancel {
      background: #f5f5f5;
      color: #757575;
      border: 2px solid #e0e0e0;
    }
    .dialog-btn.confirm {
      background: linear-gradient(135deg, #ff7043, #ff5722);
      color: #fff;
      box-shadow: 0 4px 0 #bf360c;
    }
  </style>
</head>
<body>
  <div id="title">🗑️ 3D 丢垃圾小世界</div>
  <div id="tip">点击下方的垃圾图标，把它们丢进中间的垃圾桶吧！</div>
  <div id="score">已投放：0 件</div>
  <div id="actions">
    <button id="btn-custom" class="action-btn">+ 自定义垃圾</button>
  </div>

  <!-- 自定义垃圾对话框 -->
  <div id="dialog-overlay" class="dialog-overlay hidden">
    <div id="dialog" class="dialog-box">
      <div class="dialog-title">创建自定义垃圾</div>
      <div class="dialog-body">
        <label class="dialog-label" for="custom-name">输入垃圾名称：</label>
        <input id="custom-name" class="dialog-input" type="text"
               placeholder="例如：塑料杯、玻璃瓶、薯片袋…" maxlength="12" />
        <div class="dialog-hint">系统会根据名称关键词生成对应的 3D 模型</div>
      </div>
      <div class="dialog-footer">
        <button id="btn-cancel" class="dialog-btn cancel">取消</button>
        <button id="btn-confirm" class="dialog-btn confirm">确认创建</button>
      </div>
    </div>
  </div>
  <canvas id="main-canvas"></canvas>
  <div id="shelf-wrap">
    <div id="shelf"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
