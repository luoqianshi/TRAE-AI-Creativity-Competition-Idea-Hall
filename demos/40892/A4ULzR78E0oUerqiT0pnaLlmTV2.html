<html lang="zh-CN">

<meta charset="UTF-8">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #e63946;
  --primary-light: #ff6b6b;
  --primary-dark: #c1121f;
  --accent: #f4a261;
  --green: #2a9d8f;
  --blue: #457b9d;
  --purple: #6d597a;
  --bg: #fff8f0;
  --card: #ffffff;
  --text: #1d3557;
  --text-soft: #6c757d;
  --text-faint: #adb5bd;
  --border: #f1e9dd;
  --shadow: 0 4px 20px rgba(230, 57, 70, 0.1);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
  --gradient: linear-gradient(135deg, #e63946 0%, #f4a261 100%);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
}

/* 顶部 */
.topbar {
  background: var(--gradient);
  color: white;
  padding: 16px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 2px 12px rgba(230, 57, 70, 0.25);
}
.topbar-inner {
  max-width: 600px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; }
.logo-icon {
  width: 36px; height: 36px;
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.topbar-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}

/* 容器 */
.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 16px;
}

/* 搜索区 */
.search-card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.search-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
.search-row { display: flex; gap: 10px; }
.search-input {
  flex: 1;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
  background: #fffdf9;
}
.search-input:focus { border-color: var(--primary); }
.search-btn {
  padding: 12px 20px;
  background: var(--gradient);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
}
.search-btn:active { transform: scale(0.97); }

/* 快捷标签 */
.quick-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.quick-tag {
  padding: 6px 14px;
  background: #fff5f5;
  border: 1px solid #ffdcdc;
  border-radius: 16px;
  font-size: 13px;
  color: var(--primary);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}
.quick-tag:hover { background: var(--primary); color: white; }

/* 卡片 */
.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  margin-bottom: 16px;
}
.card-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* 风险评分 */
.risk-score-card {
  background: linear-gradient(135deg, #fff5f5 0%, #fff0e6 100%);
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  margin-bottom: 16px;
  border: 2px solid #ffcccc;
}
.risk-label { font-size: 13px; color: var(--text-soft); margin-bottom: 8px; }
.risk-score {
  font-size: 56px;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 8px;
}
.risk-score.high { color: var(--primary); }
.risk-score.medium { color: var(--accent); }
.risk-score.low { color: var(--green); }
.risk-level {
  display: inline-block;
  padding: 4px 16px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 8px;
}
.risk-level.high { background: #ffcccc; color: var(--primary); }
.risk-level.medium { background: #fff3cd; color: #856404; }
.risk-level.low { background: #d4edda; color: var(--green); }
.risk-desc { font-size: 13px; color: var(--text-soft); }

/* 比价结果 */
.price-list { }
.price-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border-radius: 14px;
  margin-bottom: 8px;
  border: 1px solid var(--border);
  transition: all 0.2s;
  cursor: pointer;
}
.price-item:hover { border-color: var(--primary); box-shadow: var(--shadow-sm); }
.price-item.best { background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); border-color: var(--green); }
.price-platform {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  background: #f5f5fa;
  flex-shrink: 0;
}
.price-info { flex: 1; }
.price-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.price-shop { font-size: 12px; color: var(--text-faint); }
.price-value { text-align: right; }
.price-num { font-size: 18px; font-weight: 700; }
.price-num.best { color: var(--green); }
.price-diff { font-size: 11px; color: var(--text-faint); }
.best-badge {
  display: inline-block;
  background: var(--green);
  color: white;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 8px;
  margin-left: 6px;
}

/* 避坑提示 */
.pitfall-list { }
.pitfall-item {
  display: flex;
  gap: 12px;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 8px;
  border-left: 4px solid;
}
.pitfall-item.danger { background: #fff5f5; border-color: var(--primary); }
.pitfall-item.warn { background: #fff9e6; border-color: var(--accent); }
.pitfall-item.safe { background: #f0fff4; border-color: var(--green); }
.pitfall-icon { font-size: 20px; flex-shrink: 0; }
.pitfall-text { font-size: 13px; line-height: 1.5; }
.pitfall-text b { color: var(--text); }

/* 历史成分 */
.ingredients-section { }
.ingredient-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.ingredient-row:last-child { border-bottom: none; }
.ing-name { flex: 1; font-size: 14px; }
.ing-tag {
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}
.ing-tag.safe { background: #d4edda; color: var(--green); }
.ing-tag.warn { background: #fff3cd; color: #856404; }
.ing-tag.danger { background: #f8d7da; color: var(--primary); }

/* AI 建议 */
.ai-card {
  background: linear-gradient(135deg, #fff8f0 0%, #fff0f5 100%);
  border: 1px solid #ffdcdc;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
}
.ai-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.ai-avatar {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--gradient);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
.ai-name { font-size: 14px; font-weight: 700; }
.ai-status { font-size: 11px; color: var(--green); }
.ai-body { font-size: 14px; line-height: 1.7; }
.ai-body b { color: var(--primary); }
.ai-suggestion {
  background: white;
  border-radius: 12px;
  padding: 14px;
  margin-top: 12px;
  font-size: 13px;
  border-left: 3px solid var(--primary);
}

/* 操作按钮 */
.action-row { display: flex; gap: 10px; flex-wrap: wrap; }
.action-btn {
  flex: 1;
  min-width: 120px;
  padding: 12px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: white;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--text-soft);
  transition: all 0.2s;
}
.action-btn:hover { border-color: var(--primary); color: var(--primary); }
.action-btn.primary { background: var(--gradient); color: white; border-color: var(--primary); }

/* 空状态 */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-faint);
}
.empty .emoji { font-size: 48px; margin-bottom: 12px; }
.empty .title { font-size: 16px; font-weight: 600; color: var(--text-soft); margin-bottom: 4px; }
.empty .desc { font-size: 13px; }

/* Toast */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(29, 53, 87, 0.95);
  color: white;
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 13px;
  z-index: 9999;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  animation: toastIn 0.3s ease;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* 加载 */
.loading-dots { display: inline-flex; gap: 4px; align-items: center; }
.loading-dots span {
  width: 6px; height: 6px;
  background: white;
  border-radius: 50%;
  animation: bounce 1.4s infinite ease-in-out both;
}
.loading-dots span:nth-child(1) { animation-delay: -0.32s; }
.loading-dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }

/* 底部导航 */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: white;
  border-top: 1px solid var(--border);
  display: flex;
  padding: 8px 0;
  z-index: 50;
  max-width: 600px;
  margin: 0 auto;
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px;
  border: none;
  background: none;
  font-family: inherit;
  font-size: 11px;
  color: var(--text-faint);
  cursor: pointer;
}
.nav-btn.active { color: var(--primary); }
.nav-btn .icon { font-size: 20px; }
</style>
</head>

function quickSearch(keyword) {
  document.getElementById('searchInput').value = keyword;
  scanProduct();
}

function scanProduct() {
  const input = document.getElementById('searchInput').value.trim();
  if (!input) { showToast('⚠️ 请先输入商品名称'); return; }

  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span>';

  setTimeout(() => {
    let product = null;
    for (const key in productDB) {
      if (input.includes(key) || key.includes(input) || input.toLowerCase().includes(key.toLowerCase())) {
        product = productDB[key];
        break;
      }
    }
    if (!product) {
      const keys = Object.keys(productDB);
      product = productDB[keys[Math.floor(Math.random() * keys.length)]];
    }
    renderResult(product);
    btn.disabled = false;
    btn.innerHTML = '🛡 扫描';
    showToast('✅ 扫描完成!已生成避坑报告');
  }, 1200);
}

function renderResult(p) {
  const bestPrice = Math.min(...p.prices.map(x => x.price));
  const maxPrice = Math.max(...p.prices.map(x => x.price));
  const priceGap = maxPrice - bestPrice;

  document.getElementById('resultArea').innerHTML = `
    <!-- 风险评分 -->
    <div class="risk-score-card">
      <div class="risk-label">🛡 AI 避坑风险评分</div>
      <div class="risk-score ${p.riskLevel}">${p.riskScore}</div>
      <div class="risk-level ${p.riskLevel}">${p.riskLevel === 'high' ? '🔴 高风险' : (p.riskLevel === 'medium' ? '🟡 中风险' : '🟢 低风险')}</div>
      <div class="risk-desc">${p.riskText} · 最高价差 ¥${priceGap}</div>
    </div>

    <!-- 比价 -->
    <div class="card">
      <div class="card-title">📊 全网比价 <span style="font-size:12px;color:var(--text-faint);font-weight:400;margin-left:auto">${p.emoji} ${p.name}</span></div>
      <div class="price-list">
        ${p.prices.map(item => `
          <div class="price-item ${item.isBest ? 'best' : ''}" onclick="showToast('🔗 正在跳转 ${item.name}...')">
            <div class="price-platform">${item.platform}</div>
            <div class="price-info">
              <div class="price-name">${item.name} · ${item.shop}</div>
              <div class="price-shop">${item.isBest ? '⭐ AI推荐最佳性价比' : '点击查看详情'}</div>
            </div>
            <div class="price-value">
              <div class="price-num ${item.isBest ? 'best' : ''}">¥${item.price}</div>
              <div class="price-diff">${item.price === bestPrice ? '最低价' : '贵 ¥' + (item.price - bestPrice)}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- 避坑提示 -->
    <div class="card">
      <div class="card-title">⚠️ 避坑预警</div>
      <div class="pitfall-list">
        ${p.pitfalls.map(pf => `
          <div class="pitfall-item ${pf.type}">
            <div class="pitfall-icon">${pf.icon}</div>
            <div class="pitfall-text">${pf.text}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- 成分/配置 -->
    <div class="card">
      <div class="card-title">🔬 关键信息查验</div>
      <div class="ingredients-section">
        ${p.ingredients.map(ing => `
          <div class="ingredient-row">
            <div class="ing-name">${ing.name}</div>
            <div class="ing-tag ${ing.tag}">${ing.label}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- AI 建议 -->
    <div class="ai-card">
      <div class="ai-head">
        <div class="ai-avatar">🤖</div>
        <div>
          <div class="ai-name">避坑小助手</div>
          <div class="ai-status">● 分析完成</div>
        </div>
      </div>
      <div class="ai-body">
        ${p.aiAdvice}
      </div>
      <div class="ai-suggestion">
        💡 <b>购买建议:</b> ${p.riskLevel === 'high' ? '建议优先选择官方授权渠道,差价 100-300 元但可确保正品。切勿贪低价。' : '比价后选择信誉最高的平台,到手后注意查验防伪标识。'}
      </div>
    </div>

    <!-- 操作 -->
    <div class="card">
      <div class="card-title">📝 下一步</div>
      <div class="action-row">
        <button class="action-btn primary" onclick="showToast('📋 避坑报告已保存到历史记录')">📋 保存报告</button>
        <button class="action-btn" onclick="showToast('📤 已分享到微信')">📤 分享</button>
        <button class="action-btn" onclick="showToast('🔔 已设置降价提醒')">🔔 降价提醒</button>
        <button class="action-btn" onclick="showToast('💬 已转交 AI 深度问答')">💬 问AI</button>
      </div>
    </div>
  `;
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transition = 'opacity 0.3s';
    setTimeout(() => t.remove(), 300);
  }, 2400);
}

setTimeout(() => showToast('🛡 欢迎使用避坑雷达!输入商品名称开始扫描'), 600);
</script>
