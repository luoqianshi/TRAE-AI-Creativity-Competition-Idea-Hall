<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>短视频创作 SOP 工作台</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0F0F0F;--card:#1A1A1A;--border:#2A2A2A;--accent:#00FFD1;--accent-dim:rgba(0,255,209,0.1);--accent-glow:rgba(0,255,209,0.4);--tp:#E5E5E5;--ts:#8A8A8A}
body{font-family:'Noto Sans SC','Source Han Sans SC',-apple-system,sans-serif;background:var(--bg);color:var(--tp);line-height:1.6;min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#1A1A1A}
::-webkit-scrollbar-thumb{background:#2A2A2A;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#00FFD1}
::selection{background:rgba(0,255,209,0.3);color:#E5E5E5}

/* Layout */
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.sidebar-header .logo{width:32px;height:32px;border-radius:4px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px}
.sidebar-header h1{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px}
.sidebar-header p{font-size:11px;color:var(--ts)}
.sidebar nav{flex:1;padding:16px 12px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:4px;cursor:pointer;transition:all .2s;text-decoration:none;color:var(--ts);font-size:14px;font-weight:500;margin-bottom:4px}
.nav-item:hover{color:var(--tp);background:rgba(255,255,255,0.03)}
.nav-item.active{background:var(--accent-dim);color:var(--accent);border-left:2px solid var(--accent)}
.nav-item .ico{width:20px;height:20px;flex-shrink:0}
.sidebar-footer{padding:16px 24px;border-top:1px solid var(--border);font-size:11px;color:var(--ts)}
.main{flex:1;overflow-y:auto;position:relative}
.main::before{content:'';position:absolute;inset:0;opacity:.03;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.main-inner{max-width:1100px;margin:0 auto;padding:32px;position:relative;z-index:1}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 8px rgba(0,255,209,.3)}50%{box-shadow:0 0 20px rgba(0,255,209,.6)}}
.fade-in{animation:fadeIn .3s ease-out forwards}
.slide-up{animation:slideUp .3s ease-out forwards}

/* Components */
.btn{padding:10px 24px;border-radius:4px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-primary:hover{box-shadow:0 0 12px var(--accent-glow)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent-dim);box-shadow:0 0 12px var(--accent-glow)}
.btn-loading{animation:pulseGlow 2s infinite}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;transition:all .3s}
.card:hover{border-color:rgba(0,255,209,.3)}
.input,.textarea,.select{width:100%;padding:10px 16px;background:var(--bg);border:1px solid var(--border);color:var(--tp);font-size:14px;border-radius:4px;font-family:inherit;outline:none;transition:border-color .2s}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent)}
.textarea{resize:none;line-height:1.6}
.label{display:block;font-size:14px;font-weight:500;margin-bottom:8px;color:var(--tp);display:flex;align-items:center;gap:8px}
.label .ico{width:16px;height:16px;color:var(--accent)}

/* Home */
.hero{text-align:center;padding:48px 0}
.hero h2{font-family:'Barlow Condensed',sans-serif;font-size:48px;font-weight:700;letter-spacing:2px;margin-bottom:16px}
.hero h2 .acc{color:var(--accent)}
.hero p{font-size:16px;color:var(--ts);max-width:560px;margin:0 auto}
.workflow-steps{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:32px;flex-wrap:wrap}
.workflow-steps .step-chip{padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:12px;color:var(--ts)}
.workflow-steps .arrow{color:var(--ts);font-size:14px}
.module-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.module-card{position:relative;padding:24px;border-radius:8px;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .3s;overflow:hidden;text-decoration:none;color:inherit}
.module-card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 0 20px rgba(0,255,209,.1)}
.module-card .m-icon{width:48px;height:48px;border-radius:8px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.module-card .m-icon svg{width:24px;height:24px;color:var(--accent)}
.module-card h3{font-size:20px;font-weight:700;margin-bottom:8px}
.module-card p{font-size:14px;color:var(--ts)}
.module-card .m-go{margin-top:16px;font-size:14px;color:var(--accent);font-weight:500;opacity:0;transition:opacity .3s}
.module-card:hover .m-go{opacity:1}
.tip{margin-top:32px;padding:16px;border-radius:8px;background:var(--accent-dim);border:1px solid rgba(0,255,209,.2);text-align:center;font-size:14px;color:var(--ts)}
.tip .acc{color:var(--accent);font-weight:500}

/* Page header */
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.page-header svg{width:24px;height:24px;color:var(--accent)}
.page-header h2{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700}
.page-desc{font-size:14px;color:var(--ts);margin-bottom:24px}

/* Inspiration */
.insp-grid{display:grid;grid-template-columns:1fr 2fr;gap:24px}
.insp-left{space-y:16px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px}
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row input[type=range]{flex:1;accent-color:var(--accent)}
.slider-row .val{color:var(--accent);font-weight:700;width:32px;text-align:center}
.range-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--ts);margin-top:4px}
.example-badge{padding:16px;border-radius:8px;background:var(--accent-dim);border:1px solid rgba(0,255,209,.2)}
.example-badge .et{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:4px}
.example-badge .ed{font-size:12px;color:var(--ts)}
.insp-results h3{font-size:18px;font-weight:600;margin-bottom:16px}
.topic-count{font-size:12px;color:var(--ts)}
.topic-list{max-height:600px;overflow-y:auto;padding-right:8px}
.topic-item{padding:16px;border-radius:8px;background:var(--card);border:1px solid var(--border);margin-bottom:12px;transition:all .2s;cursor:pointer}
.topic-item:hover{border-color:rgba(0,255,209,.5)}
.topic-item .ti-head{display:flex;align-items:flex-start;gap:12px}
.topic-day{width:32px;height:32px;border-radius:50%;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:700;color:var(--accent)}
.topic-item h4{font-size:14px;font-weight:600;margin-bottom:4px}
.topic-item .angle{font-size:12px;color:var(--ts);margin-bottom:4px}
.topic-item .hook{font-size:12px;color:rgba(0,255,209,.8)}
.topic-item .go-arrow{flex-shrink:0;padding:8px;border-radius:4px;background:var(--bg);border:1px solid var(--border);color:var(--ts);opacity:0;transition:all .2s}
.topic-item:hover .go-arrow{opacity:1;color:var(--accent);border-color:var(--accent)}

/* Script Workshop */
.style-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.style-card{padding:16px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .2s;text-align:left}
.style-card:hover{border-color:rgba(0,255,209,.5)}
.style-card.active{border-color:var(--accent);background:var(--accent-dim);box-shadow:0 0 12px rgba(0,255,209,.2)}
.style-card svg{width:20px;height:20px;margin-bottom:8px;color:var(--ts)}
.style-card.active svg{color:var(--accent)}
.style-card h4{font-size:14px;font-weight:600;margin-bottom:4px}
.style-card p{font-size:12px;color:var(--ts)}
.gen-row{display:flex;gap:12px;margin-bottom:16px}
.script-display{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px}
.script-display .sd-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.script-display .sd-head h3{font-size:14px;font-weight:600;color:var(--accent)}
.script-display .sd-head span{font-size:12px;color:var(--ts)}
.script-content{white-space:pre-wrap;font-size:14px;line-height:1.8;font-family:monospace;background:var(--bg);padding:16px;border-radius:4px;border:1px solid var(--border)}
.iterate-panel{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px}
.iterate-panel h4{font-size:14px;font-weight:600;margin-bottom:12px}
.prompt-history-item{font-size:12px;color:var(--ts);background:var(--bg);padding:8px 12px;border-radius:4px;border:1px solid var(--border);margin-bottom:8px}
.iterate-row{display:flex;gap:12px;margin-top:12px}

/* Storyboard */
.sb-grid{display:grid;grid-template-columns:2fr 3fr;gap:24px}
.sb-stats{padding:16px;border-radius:8px;background:var(--accent-dim);border:1px solid rgba(0,255,209,.2);display:flex;justify-content:space-between;font-size:14px}
.sb-stats .acc{color:var(--accent)}
.shot-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shot-card{padding:16px;border-radius:8px;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .2s;text-align:left}
.shot-card:hover{border-color:rgba(0,255,209,.5)}
.shot-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.shot-num{font-size:12px;font-weight:700;color:var(--ts)}
.shot-type{font-size:12px;padding:2px 8px;border-radius:3px;border:1px solid}
.st-特写{background:rgba(239,68,68,.2);color:#f87171;border-color:rgba(239,68,68,.3)}
.st-近景{background:rgba(249,115,22,.2);color:#fb923c;border-color:rgba(249,115,22,.3)}
.st-中景{background:rgba(0,255,209,.2);color:#00FFD1;border-color:rgba(0,255,209,.3)}
.st-全景{background:rgba(59,130,246,.2);color:#60a5fa;border-color:rgba(59,130,246,.3)}
.st-远景{background:rgba(168,85,247,.2);color:#c084fc;border-color:rgba(168,85,247,.3)}
.shot-dur{font-size:12px;color:var(--ts);margin-left:auto}
.shot-visual{font-size:12px;color:var(--ts);margin-bottom:4px}
.shot-dialogue{font-size:14px;color:var(--tp);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sb-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ts);border:1px dashed var(--border);border-radius:8px;min-height:400px}
.sb-empty svg{width:48px;height:48px;margin-bottom:12px;opacity:.3}
/* Drawer */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50}
.drawer{position:fixed;right:0;top:0;width:384px;height:100%;background:var(--card);border-left:1px solid var(--border);padding:24px;z-index:51;overflow-y:auto;animation:slideUp .3s ease-out}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.drawer-head h3{font-size:18px;font-weight:700}
.drawer-close{background:none;border:none;color:var(--ts);font-size:20px;cursor:pointer}
.drawer-close:hover{color:var(--tp)}
.drawer-field{margin-bottom:16px}
.drawer-field label{font-size:12px;color:var(--ts);display:block;margin-bottom:4px}
.drawer-field .val-box{font-size:14px;color:var(--tp);background:var(--bg);padding:12px;border-radius:4px;border:1px solid var(--border);white-space:pre-wrap}
.drawer-field .val-box.acc{color:var(--accent);font-weight:600}
.drawer-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px;border-radius:4px;background:var(--accent);color:var(--bg);font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;border:none;transition:all .2s}
.drawer-btn:hover{box-shadow:0 0 12px var(--accent-glow)}

/* Editing */
.ed-empty{padding:32px;border-radius:8px;background:var(--card);border:1px solid var(--border);text-align:center}
.ed-empty svg{width:48px;height:48px;margin:0 auto 12px;color:var(--ts);opacity:.3}
.ed-empty p{font-size:14px;color:var(--ts)}
.ed-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px}
.ed-section h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:16px}
.ed-section h3 svg{width:16px;height:16px;color:var(--accent)}
.ed-actions{display:flex;gap:8px}
.ed-copy-btn{font-size:12px;padding:4px 8px;border-radius:3px;background:var(--bg);border:1px solid var(--border);color:var(--ts);cursor:pointer;transition:all .2s}
.ed-copy-btn:hover{color:var(--accent);border-color:var(--accent)}
.srt-preview{font-size:12px;font-family:monospace;color:var(--ts);white-space:pre-wrap}
.timeline-track{position:relative;padding-left:16px;border-left:2px solid var(--border)}
.timeline-item{position:relative;margin-bottom:16px}
.timeline-dot{position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid;background:var(--card)}
.td-video{border-color:var(--accent)}
.td-audio{border-color:#a78bfa}
.td-text{border-color:#fb923c}
.td-effect{border-color:#60a5fa}
.timeline-row{display:flex;align-items:flex-start;gap:12px}
.timeline-time{font-size:12px;color:var(--ts);font-family:monospace;min-width:40px}
.timeline-type{font-size:12px;color:var(--ts);text-transform:capitalize}
.timeline-event{font-size:14px;color:var(--tp);margin-top:2px}
.capcut-params{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.param-box{padding:12px;border-radius:4px;background:var(--bg);border:1px solid var(--border)}
.param-box .pl{font-size:12px;color:var(--ts);margin-bottom:4px}
.param-box .pv{font-size:14px;font-weight:600;color:var(--accent)}
.track-suggestion{padding:12px;border-radius:4px;background:var(--bg);border:1px solid var(--border);margin-bottom:8px}
.track-suggestion .ts-type{font-size:12px;color:var(--accent);font-weight:500;margin-bottom:4px}
.track-suggestion .ts-content{font-size:12px;color:var(--ts)}
.capcut-tip{padding:12px;border-radius:4px;background:var(--accent-dim);border:1px solid rgba(0,255,209,.2);margin-top:12px}
.capcut-tip .ct-title{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:4px}
.capcut-tip .ct-content{font-size:12px;color:var(--ts);line-height:1.8}

/* Spinner */
.spinner{width:16px;height:16px;border:2px solid var(--bg);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){
  #app{flex-direction:column}
  .sidebar{width:100%;height:auto;flex-direction:row;overflow-x:auto}
  .sidebar nav{display:flex;gap:4px;padding:8px}
  .nav-item{white-space:nowrap}
  .sidebar-footer,.sidebar-header p{display:none}
  .main{flex:1}
  .main-inner{padding:16px}
  .module-grid,.insp-grid,.sb-grid,.ed-grid{grid-template-columns:1fr}
  .style-grid{grid-template-columns:1fr 1fr}
  .shot-grid{grid-template-columns:1fr}
  .hero h2{font-size:32px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============ DATA ============
var books = [
  {id:"1",title:"被讨厌的勇气",author:"岸见一郎 / 古贺史健"},
  {id:"2",title:"原子习惯",author:"詹姆斯·克利尔"},
  {id:"3",title:"认知觉醒",author:"周岭"},
  {id:"4",title:"深度工作",author:"卡尔·纽波特"},
  {id:"5",title:"非暴力沟通",author:"马歇尔·卢森堡"}
];

var courageTopics = [
  {day:1,title:"你的不幸，是你自己选择的",angle:"颠覆认知：阿德勒心理学第一枪",hook:"为什么同样出身的人，命运却完全不同？"},
  {day:2,title:"一切烦恼都来自人际关系",angle:"社交焦虑的本质拆解",hook:"如果你 alone，还会有烦恼吗？"},
  {day:3,title:"课题分离：管好自己的事",angle:"边界感实操指南",hook:"父母逼婚、领导 PUA，学会这一招全解决"},
  {day:4,title:"自由，就是被别人讨厌",angle:"反直觉的人生自由公式",hook:"你越讨好，越不自由"},
  {day:5,title:"共同体感觉：存在的价值",angle:"找到自我认同的锚点",hook:"不需要比别人优秀，你本身就值得"},
  {day:6,title:"活在当下的勇气",angle:"目标导向 vs 过程导向",hook:"为什么越努力越焦虑？因为你活在未来"},
  {day:7,title:"从原因论到目的论",angle:"阿德勒最颠覆的思维方式",hook:"你的过去，根本决定不了你的未来"},
  {day:8,title:"自卑感不是坏事",angle:"正确利用自卑感",hook:"自卑的人，反而更容易成功"},
  {day:9,title:"越自负的人越自卑",angle:"自负与自卑的一体两面",hook:"那些爱炫耀的人，内心有多虚？"},
  {day:10,title:"人生不是与他人的比赛",angle:"横向关系 vs 纵向关系",hook:"你根本不需要打败任何人"},
  {day:11,title:"认可欲求：痛苦的根源",angle:"为什么我们总想要被认可",hook:"点赞焦虑的本质，是你在乞讨爱"},
  {day:12,title:"砍断格尔迪奥斯绳结",angle:"简单直接的行动哲学",hook:"复杂的问题，往往只需要简单的行动"},
  {day:13,title:"人生的意义，由你自己决定",angle:"存在主义式的自我赋予",hook:"人生没有标准答案，这就是答案"},
  {day:14,title:"从这一刻开始，你可以改变",angle:"行动指南与总结",hook:"看完这条视频，你的人生从今天开始"}
];

var bookTemplates = {
  "2":["1% 的改变，99% 的人生","习惯叠加的力量","环境设计决定行为","两分钟规则","习惯追踪可视化","别让完美主义害了你","身份认同驱动改变"],
  "3":["大脑的三重构造","焦虑的本质是模糊","元认知：思考的思考","专注力是稀缺资源","学习力：深度学习","行动力：先做起来","情绪力：化解焦虑"],
  "4":["深度工作的价值","四种工作哲学","习惯化 vs 仪式感","远离社交媒体","刻意练习的误区","专注力训练","产出衡量标准"],
  "5":["观察而非评论","感受的根源在自己","需要的具体表达","请求而非命令","倾听的力量","同理心的四个步骤","非暴力沟通实践"]
};

function generateTopics(bookId, days) {
  if (bookId === "1") return courageTopics.slice(0, days);
  var t = bookTemplates[bookId] || bookTemplates["2"];
  var result = [];
  for (var i = 0; i < days; i++) {
    var base = t[i % t.length];
    result.push({day:i+1,title:base,angle:"第"+(i+1)+"天解读角度",hook:"关于"+base+"，90%的人都理解错了"});
  }
  return result;
}

var scriptStyles = [
  {id:"knowledge",name:"知识型",desc:"逻辑清晰、观点密集、信息量大"},
  {id:"story",name:"故事型",desc:"情感共鸣、叙事驱动、场景还原"},

function parseScriptToShots(script) {
  var lines = script.split("\n").map(function(l){return l.trim()}).filter(function(l){return l.length>0 && !l.startsWith("【") && !l.startsWith("[")});
  var shots = [];
  var sn = 1;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (line.length < 5) continue;
    var st = shotTypes[(i + sn) % shotTypes.length];
    var dur = Math.min(Math.max(Math.ceil(line.length / 8), 3), 8);
    shots.push({shotNumber:sn++,shotType:st,visual:visualHints[st]||"博主出镜",dialogue:line,duration:dur,note:shotNotes[st]||""});
    if (shots.length >= 15) break;
  }
  if (shots.length === 0) {
    shots.push({shotNumber:1,shotType:"中景",visual:"博主正面出镜",dialogue:script.slice(0,60),duration:5,note:"建议配合手势强调"});
  }
  return shots;
}

function pad(n){return n.toString().padStart(2,"0")}
function padMs(n){return n.toString().padStart(3,"0")}
function formatTime(ms){
  var h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000),ml=ms%1000;
  return pad(h)+":"+pad(m)+":"+pad(s)+","+padMs(ml);
}

function buildSRT(shots) {
  var srt = "", cur = 0;
  shots.forEach(function(shot, i) {
    var start = cur, end = cur + shot.duration * 1000;
    srt += (i+1) + "\n" + formatTime(start) + " --> " + formatTime(end) + "\n" + shot.dialogue.slice(0,40) + (shot.dialogue.length>40?"...":"") + "\n\n";
    cur = end;
  });
  return srt.trim();
}

function buildTimeline(shots) {
  var tl = [], cur = 0;
  tl.push({time:"00:00",event:"视频开始 / 封面定格 1s",type:"video"});
  shots.forEach(function(shot) {
    var ts = pad(Math.floor(cur/60))+":"+pad(cur%60);
    tl.push({time:ts,event:"镜"+shot.shotNumber+" "+shot.shotType+" | "+shot.dialogue.slice(0,20)+"...",type:"video"});
    if (shot.shotNumber === Math.floor(shots.length/2)) {
      tl.push({time:ts,event:"背景音乐情绪递进",type:"audio"});
    }
    cur += shot.duration;
  });
  tl.push({time:pad(Math.floor(cur/60))+":"+pad(cur%60),event:"结尾引导 / 关注转化",type:"text"});
  return tl;
}

      '<button class="btn btn-primary '+(state.scriptLoading?"btn-loading":"")+'" id="gen-script" '+(state.scriptLoading?"disabled":"")+'>'+
      (state.scriptLoading?'<span class="spinner"></span>生成中...':ic("wand")+'一键生成')+'</button>'+
      (state.scriptContent?'<button class="btn btn-outline" id="reset-script">'+ic("reset")+'</button>':'')+
    '</div></div>'+scriptHtml;
}

function renderStoryboard() {
  var shotsHtml = "";
  if (state.shots.length > 0) {
    shotsHtml = '<div class="shot-grid">'+
      state.shots.map(function(s) {
        return '<div class="shot-card" data-shot="'+(s.shotNumber-1)+'">'+
          '<div class="shot-head"><span class="shot-num">#'+s.shotNumber.toString().padStart(2,"0")+'</span>'+
          '<span class="shot-type st-'+s.shotType+'">'+s.shotType+'</span>'+
          '<span class="shot-dur">'+s.duration+'s</span></div>'+
          '<div class="shot-visual">画面：'+s.visual+'</div>'+
          '<div class="shot-dialogue">'+s.dialogue+'</div></div>';
      }).join("")+'</div>';
  } else {
    shotsHtml = '<div class="sb-empty">'+ic("clap","")+'<p>输入脚本并点击拆解，生成分镜卡片</p></div>';
  }

  var stats = state.shots.length > 0
    ? '<div class="sb-stats"><span>共 '+state.shots.length+' 个镜头</span><span class="acc">总时长 '+state.shots.reduce(function(a,s){return a+s.duration},0)+'s</span></div>'
    : '';

  return '<div class="page-header">'+ic("clap")+'<h2>分镜画板</h2></div>'+
    '<div class="page-desc">将脚本自动拆解为 5-15 个分镜，逐镜头规划拍摄</div>'+
    '<div class="sb-grid">'+
      '<div><div class="panel"><label class="label">脚本内容</label>'+
        '<textarea class="textarea" id="sb-input" rows="12" placeholder="粘贴脚本内容，或从脚本工坊带入..." style="margin-bottom:12px">'+state.sbInput+'</textarea>'+
        '<button class="btn btn-primary '+(state.sbLoading?"btn-loading":"")+'" id="parse-shots" style="width:100%;justify-content:center" '+(state.sbLoading?"disabled":"")+'>'+
        (state.sbLoading?'<span class="spinner"></span>拆解中...':ic("wand")+'自动拆解分镜')+'</button></div>'+stats+'</div>'+
      '<div>'+shotsHtml+'</div>'+
    '</div>';
}

function renderEditing() {
  if (!state.plan) {
    return '<div class="page-header">'+ic("scissors")+'<h2>剪辑方案</h2></div>'+
      '<div class="page-desc">SRT 字幕导出、时间轴脚本、剪映适配方案</div>'+
      '<div class="ed-empty">'+ic("clock")+'<p>请先在「分镜画板」中拆解脚本，生成剪辑方案</p></div>';
  }

  var p = state.plan;
  var typeIcons = {video:"monitor",audio:"music",text:"type",effect:"sparkles"};
  var typeColors = {video:"var(--accent)",audio:"#a78bfa",text:"#fb923c",effect:"#60a5fa"};

  var timelineHtml = p.timeline.map(function(item,i) {
    return '<div class="timeline-item">'+
      '<div class="timeline-dot td-'+item.type+'"></div>'+
      '<div class="timeline-row"><span class="timeline-time">'+item.time+'</span>'+
      '<div><div class="timeline-type">'+item.type+'</div>'+
      '<div class="timeline-event">'+item.event+'</div></div></div></div>';
  }).join("");

  var trackHtml = p.capcutParams.tracks.map(function(t) {
    return '<div class="track-suggestion"><div class="ts-type">'+t.type+'</div><div class="ts-content">'+t.content+'</div></div>';
  }).join("");

  var lastTime = p.timeline[p.timeline.length-1] ? p.timeline[p.timeline.length-1].time : "00:00";

  return '<div class="page-header">'+ic("scissors")+'<h2>剪辑方案</h2></div>'+
    '<div class="page-desc">SRT 字幕导出、时间轴脚本、剪映适配方案</div>'+
    '<div class="ed-grid">'+
      '<div class="ed-section"><div style="display:flex;justify-content:space-between;align-items:center">'+
        '<h3>'+ic("type")+'SRT 字幕</h3>'+
        '<div class="ed-actions"><button class="ed-copy-btn" id="copy-srt">'+(state.copied?"已复制":"复制")+'</button>'+
        '<button class="btn btn-primary" id="download-srt" style="padding:4px 12px;font-size:12px">'+ic("download")+'下载</button></div></div>'+
        '<div class="card" style="height:500px;overflow-y-auto"><pre class="srt-preview">'+p.srt+'</pre></div></div>'+
      '<div class="ed-section"><h3>'+ic("clock")+'时间轴脚本</h3>'+
        '<div class="card" style="height:500px;overflow-y:auto"><div class="timeline-track">'+timelineHtml+'</div></div></div>'+
      '<div class="ed-section"><h3>'+ic("monitor")+'剪映适配方案</h3>'+
        '<div class="card">'+
          '<div class="capcut-params">'+
            '<div class="param-box"><div class="pl">分辨率</div><div class="pv">'+p.capcutParams.resolution+'</div></div>'+
            '<div class="param-box"><div class="pl">帧率</div><div class="pv">'+p.capcutParams.frameRate+'fps</div></div>'+
            '<div class="param-box"><div class="pl">画幅比例</div><div class="pv">'+p.capcutParams.aspectRatio+'</div></div>'+
            '<div class="param-box"><div class="pl">预估时长</div><div class="pv">'+lastTime+'</div></div>'+
          '</div>'+
          '<div style="font-size:12px;color:var(--ts);margin-bottom:8px">轨道建议</div>'+
          trackHtml+
          '<div class="capcut-tip"><div class="ct-title">剪映导入提示</div><div class="ct-content">'+
            '1. 新建项目 → 选择 9:16 竖屏模板<br>2. 导入素材到视频轨<br>3. 导入 SRT 字幕文件到文字轨<br>4. 按时间轴调整转场与特效</div></div>'+
        '</div></div>'+
    '</div>';
}

function renderDrawer() {
  var s = state.selectedShot;
  return '<div class="drawer-overlay" id="drawer-close"></div>'+
    '<div class="drawer"><div class="drawer-head"><h3>镜头 #'+s.shotNumber.toString().padStart(2,"0")+'</h3>'+
    '<button class="drawer-close" id="drawer-x">✕</button></div>'+
    '<div class="drawer-field"><label>景别</label><div class="val-box"><span class="shot-type st-'+s.shotType+'" style="display:inline-block;padding:4px 12px;border-radius:3px;border:1px solid">'+s.shotType+'</span></div></div>'+
    '<div class="drawer-field"><label>画面内容</label><div class="val-box">'+s.visual+'</div></div>'+
    '<div class="drawer-field"><label>台词 / 旁白</label><div class="val-box" style="white-space:pre-wrap">'+s.dialogue+'</div></div>'+
    '<div class="drawer-field"><label>时长</label><div class="val-box acc">'+s.duration+' 秒</div></div>'+
    '<div class="drawer-field"><label>拍摄备注</label><div class="val-box">'+s.note+'</div></div>'+
    '<div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--border)">'+
    '<button class="drawer-btn" id="go-editing">进入剪辑方案 →</button></div></div>';
}

// ============ EVENTS ============
function attachEvents() {
  // Nav
  document.querySelectorAll("[data-nav]").forEach(function(el) {
    el.addEventListener("click", function(e) {
      e.preventDefault();
      state.page = el.getAttribute("data-nav");
      // Auto-fill from previous steps
      if (state.page === "script" && state.selectedTopic) {
        state.scriptTopic = state.selectedTopic.title;
      }
      if (state.page === "storyboard" && state.scriptContent && !state.sbInput) {
        state.sbInput = state.scriptContent;
      }
      if (state.page === "editing" && state.shots.length > 0 && !state.plan) {
        state.plan = {srt:buildSRT(state.shots),timeline:buildTimeline(state.shots),capcutParams:buildCapcutParams()};
      }
      render();
    });
  });

  // Inspiration
  var bookSelect = document.getElementById("book-select");
  if (bookSelect) bookSelect.addEventListener("change", function() {
    state.selectedBook = this.value;
    state.showExample = false;
    render();
  });
  var daysSlider = document.getElementById("days-slider");
  if (daysSlider) daysSlider.addEventListener("input", function() {
    state.days = parseInt(this.value);
    if (state.selectedBook === "1") {
      state.topics = courageTopics.slice(0, state.days);
      state.showExample = (state.days === 14);
    }
    render();
  });
  var genBtn = document.getElementById("gen-topics");
  if (genBtn) genBtn.addEventListener("click", function() {
    state.loading = true;
    state.showExample = false;
    render();
    setTimeout(function() {
      state.topics = generateTopics(state.selectedBook, state.days);
      state.loading = false;
      render();
    }, 800);
  });
  // Topic click -> go to script
  document.querySelectorAll("[data-topic]").forEach(function(el) {
    el.addEventListener("click", function() {
      var idx = parseInt(el.getAttribute("data-topic"));
      state.selectedTopic = state.topics[idx];
      state.scriptTopic = state.topics[idx].title;
      state.page = "script";
      render();
    });
  });

  // Script
  document.querySelectorAll("[data-style]").forEach(function(el) {
    el.addEventListener("click", function() {
      state.activeStyle = el.getAttribute("data-style");
      render();
    });
  });
  var genScript = document.getElementById("gen-script");
  if (genScript) genScript.addEventListener("click", function() {
    var input = document.getElementById("topic-input");
    if (input) state.scriptTopic = input.value;
    if (!state.scriptTopic.trim()) return;
    state.scriptLoading = true;
    render();
    setTimeout(function() {
      state.scriptContent = scriptTemplates[state.activeStyle](state.scriptTopic);
      state.scriptLoading = false;
      state.promptHistory = [];
      render();
    }, 600);
  });
  var resetScript = document.getElementById("reset-script");
  if (resetScript) resetScript.addEventListener("click", function() {
    state.scriptContent = "";
    state.promptHistory = [];
    state.promptInput = "";
    render();
  });
  var iterateBtn = document.getElementById("iterate-btn");
  if (iterateBtn) iterateBtn.addEventListener("click", handleIterate);
  var promptInput = document.getElementById("prompt-input");
  if (promptInput) {
    promptInput.addEventListener("input", function() { state.promptInput = this.value; });
    promptInput.addEventListener("keydown", function(e) { if (e.key === "Enter") handleIterate(); });
  }

  // Storyboard
  var parseShots = document.getElementById("parse-shots");
  if (parseShots) parseShots.addEventListener("click", function() {
    var input = document.getElementById("sb-input");
    if (input) state.sbInput = input.value;
    if (!state.sbInput.trim()) return;
    state.sbLoading = true;
    render();
    setTimeout(function() {
      state.shots = parseScriptToShots(state.sbInput);
      state.sbLoading = false;
      render();
    }, 600);
  });
  document.querySelectorAll("[data-shot]").forEach(function(el) {
    el.addEventListener("click", function() {
      var idx = parseInt(el.getAttribute("data-shot"));
      state.selectedShot = state.shots[idx];
      render();
    });
  });
  var drawerClose = document.getElementById("drawer-close");
  if (drawerClose) drawerClose.addEventListener("click", function() { state.selectedShot = null; render(); });
  var drawerX = document.getElementById("drawer-x");
  if (drawerX) drawerX.addEventListener("click", function() { state.selectedShot = null; render(); });
  var goEditing = document.getElementById("go-editing");
  if (goEditing) goEditing.addEventListener("click", function() {
    state.selectedShot = null;
    state.page = "editing";
    if (state.shots.length > 0) {
      state.plan = {srt:buildSRT(state.shots),timeline:buildTimeline(state.shots),capcutParams:buildCapcutParams()};
    }
    render();
  });

  // Editing
  var copySrt = document.getElementById("copy-srt");
  if (copySrt) copySrt.addEventListener("click", function() {
    navigator.clipboard.writeText(state.plan.srt);
    state.copied = true;
    render();
    setTimeout(function() { state.copied = false; render(); }, 2000);
  });
  var downloadSrt = document.getElementById("download-srt");
  if (downloadSrt) downloadSrt.addEventListener("click", function() {
    var blob = new Blob([state.plan.srt], {type:"text/plain;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "subtitle.srt"; a.click();
    URL.revokeObjectURL(url);
  });
}

function handleIterate() {
  var input = document.getElementById("prompt-input");
  if (input) state.promptInput = input.value;
  if (!state.promptInput.trim() || !state.scriptContent) return;
  state.scriptLoading = true;
  var prompt = state.promptInput;
  state.promptHistory.push(prompt);
  render();
  setTimeout(function() {
    state.scriptContent += "\n\n[根据优化意见调整：" + prompt + "]\n\n—— 已优化版本 ——\n" + state.scriptContent.slice(0, 200) + "...（内容已按 \"" + prompt + "\" 调整）";
    state.scriptLoading = false;
    state.promptInput = "";
    render();
  }, 600);
}

// Init
render();
</script>
</body>
</html>
