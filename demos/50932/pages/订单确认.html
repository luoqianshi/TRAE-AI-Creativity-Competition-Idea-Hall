<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>确认订单 - 技能当铺</title>
    <style id="theme-vars">
/* 闪薪 - Brand CSS */
/* Tech-trust blue-purple gradient palette, clean minimal UI */

:root {
  /* === Color System === */
  --color-brand-primary: #6366F1;
  --color-brand-primary-hover: #4F46E5;
  --color-brand-primary-light: #EEF2FF;
  --color-brand-primary-subtle: #F5F3FF;
  --color-brand-gradient-start: #6366F1;
  --color-brand-gradient-end: #8B5CF6;

  --color-bg-page: #F8FAFC;
  --color-bg-surface: #FFFFFF;
  --color-bg-elevated: #FFFFFF;
  --color-bg-chat: #F1F5F9;

  --color-text-primary: #0F172A;
  --color-text-secondary: #64748B;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;

  --color-border-default: #E2E8F0;
  --color-border-light: #F1F5F9;

  --color-ai-bubble: linear-gradient(135deg, #6366F1, #8B5CF6);
  --color-user-bubble: #FFFFFF;
  --color-ai-bubble-text: #FFFFFF;
  --color-user-bubble-text: #0F172A;

  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Radius Scale === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 9999px;

  /* === Shadow System (static <= 0.05 alpha, floating only for modals) === */
  --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-elevated: 0 4px 12px rgba(15, 23, 42, 0.05);
  --shadow-floating: 0 8px 24px rgba(15, 23, 42, 0.08);
  --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);

  /* === Typography === */
  --font-display: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;

  --text-display-lg: 28px;
  --text-display-md: 24px;
  --text-display-sm: 20px;

  --text-title-lg: 18px;
  --text-title-md: 16px;
  --text-title-sm: 14px;

  --text-body-lg: 16px;
  --text-body-md: 14px;
  --text-body-sm: 12px;

  --text-caption: 11px;

  --leading-display: 1.3;
  --leading-title: 1.4;
  --leading-body: 1.6;
  --leading-tight: 1.2;

  --weight-bold: 700;
  --weight-semibold: 600;
  --weight-medium: 500;
  --weight-regular: 400;

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;
  --space-4xl: 40px;
}

/* Mini program viewport simulation */
html {
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  color: var(--color-text-primary);
  background: var(--color-bg-page);
  line-height: var(--leading-body);
  margin: 0;
  padding: 0;
  max-width: 375px;
  margin: 0 auto;
  min-height: 100vh;
}

.page-container {
  padding-bottom: calc(60px + env(safe-area-inset-bottom));
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-brand-primary);
    --color-foreground: var(--color-text-primary);
    --color-background: var(--color-bg-page);
    --color-card: var(--color-bg-surface);
    --color-muted: var(--color-bg-page);
    --color-border: var(--color-border-default);
  }
  @layer base {
    body { background: var(--color-bg-page); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="page-container">

      <!-- Status bar spacer -->
      <div class="h-11 bg-transparent"></div>

      <!-- WeChat Navigation Bar -->
      <header class="sticky top-0 z-30 border-b border-[var(--color-border-light)] bg-[var(--color-bg-surface)]/95 backdrop-blur">
        <div class="flex h-11 items-center px-4">
          <div class="flex w-[88px] items-center justify-start">
            <button data-dom-id="back-detail" class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-[var(--color-border-default)] bg-[var(--color-bg-surface)]" aria-label="返回">
              <i data-lucide="chevron-left" class="h-4 w-4" style="color: var(--color-text-primary);"></i>
            </button>
          </div>
          <div class="min-w-0 flex-1 text-center text-[16px] font-semibold tracking-[-0.02em]" style="color: var(--color-text-primary);">确认订单</div>
          <div class="flex h-8 w-[88px] items-center justify-center rounded-full border border-[var(--color-border-default)] bg-[var(--color-bg-surface)]/90 text-[var(--color-text-primary)]" aria-label="小程序菜单">
            <button class="flex h-full flex-1 items-center justify-center" aria-label="更多">
              <i data-lucide="more-horizontal" class="h-4 w-4"></i>
            </button>
            <span class="h-4 w-px bg-[var(--color-border-default)]" aria-hidden="true"></span>
            <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Page content area -->
      <div class="px-4 pt-4 pb-28 space-y-3">

        <!-- Escrow Notice Banner -->
        <section class="rounded-xl p-4" style="background: linear-gradient(135deg, var(--color-brand-gradient-start) 0%, var(--color-brand-gradient-end) 100%);">
          <div class="flex items-start gap-3">
            <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full" style="background: rgba(255, 255, 255, 0.2);">
              <i data-lucide="shield-check" class="h-5 w-5" style="color: var(--color-text-inverse);"></i>
            </div>
            <div class="min-w-0 flex-1">
              <h2 class="text-[15px] font-semibold" style="color: var(--color-text-inverse);">资金托管保障</h2>
              <p class="mt-1 text-[13px] leading-relaxed" style="color: rgba(255, 255, 255, 0.9);">下单后资金由平台托管，确认满意后才会打给卖家</p>
            </div>
          </div>
        </section>

        <!-- Order Summary Card -->
        <section class="rounded-xl p-4" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <div class="flex items-start gap-3">
            <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-lg" style="background: var(--color-brand-primary-light);">
              <i data-lucide="file-text" class="h-7 w-7" style="color: var(--color-brand-primary);"></i>
            </div>
            <div class="min-w-0 flex-1">
              <h3 class="text-[15px] font-semibold truncate" style="color: var(--color-text-primary);">PPT美化 — 标准版</h3>
              <div class="mt-1.5 flex items-center gap-1.5">
                <span class="text-[13px] font-medium truncate" style="color: var(--color-text-secondary);">小林Design</span>
                <span class="inline-flex items-center gap-0.5 rounded px-1.5 py-0.5 text-[11px] font-medium whitespace-nowrap" style="background: var(--color-brand-primary-light); color: var(--color-brand-primary);">
                  <i data-lucide="star" class="h-3 w-3"></i>
                  信用96
                </span>
              </div>
              <p class="mt-1.5 text-[12px] line-clamp-2" style="color: var(--color-text-tertiary);">10-15页, 72小时交付, 含2次修改</p>
            </div>
          </div>
          <div class="mt-4 pt-3 flex items-baseline justify-end" style="border-top: 1px solid var(--color-border-light);">
            <span class="text-[12px]" style="color: var(--color-text-tertiary);">服务价格</span>
            <span class="ml-2 text-[24px] font-bold" style="color: var(--color-brand-primary);">¥128</span>
          </div>
        </section>

        <!-- Requirement Input Card -->
        <section class="rounded-xl p-4" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <h3 class="text-[14px] font-semibold" style="color: var(--color-text-primary);">补充需求</h3>
          <textarea class="mt-3 w-full rounded-lg p-3 text-[13px] leading-relaxed resize-none focus:outline-none" rows="4" placeholder="告诉卖家你的具体需求..." style="background: var(--color-bg-page); color: var(--color-text-primary); border: 1px solid var(--color-border-default);"></textarea>
          <div class="mt-2.5 flex items-center gap-1.5 text-[12px]" style="color: var(--color-text-tertiary);">
            <i data-lucide="paperclip" class="h-3.5 w-3.5"></i>
            <span>可上传参考图片（最多3张）</span>
          </div>
        </section>

        <!-- Payment Info Card -->
        <section class="rounded-xl p-4" style="background: var(--color-bg-surface); box-shadow: var(--shadow-card);">
          <h3 class="text-[14px] font-semibold" style="color: var(--color-text-primary);">费用明细</h3>
          <div class="mt-3.5 space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-[13px]" style="color: var(--color-text-secondary);">服务费用</span>
              <span class="text-[14px] font-medium whitespace-nowrap" style="color: var(--color-text-primary);">¥128.00</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-[13px]" style="color: var(--color-text-secondary);">平台服务费</span>
              <div class="flex items-center gap-1.5">
                <span class="text-[11px] whitespace-nowrap" style="color: var(--color-text-tertiary);">5%</span>
                <span class="text-[14px] font-medium whitespace-nowrap" style="color: var(--color-text-primary);">¥6.40</span>
              </div>
            </div>
          </div>
          <div class="mt-4 pt-3.5" style="border-top: 1px solid var(--color-border-light);">
            <div class="flex items-baseline justify-between">
              <span class="text-[14px] font-semibold" style="color: var(--color-text-primary);">合计</span>
              <span class="text-[22px] font-bold" style="color: var(--color-brand-primary);">¥134.40</span>
            </div>
          </div>
        </section>

      </div>

      <!-- Bottom Action Bar -->
      <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[375px] z-30" style="background: var(--color-bg-surface); box-shadow: 0 -1px 8px rgba(15, 23, 42, 0.06);">
        <div class="px-4 pt-3 pb-3">
          <button data-dom-id="btn-pay" class="w-full h-12 rounded-lg text-[15px] font-semibold whitespace-nowrap" style="background: linear-gradient(135deg, var(--color-brand-gradient-start) 0%, var(--color-brand-gradient-end) 100%); color: var(--color-text-inverse); box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);">
            确认支付 ¥134.40
          </button>
          <p class="mt-2 text-center text-[11px]" style="color: var(--color-text-tertiary);">支付即表示同意《资金托管协议》</p>
        </div>
        <div class="h-[env(safe-area-inset-bottom,0px)]" style="background: var(--color-bg-surface);"></div>
      </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
