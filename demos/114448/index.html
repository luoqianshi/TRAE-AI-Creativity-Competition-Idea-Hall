<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的世界中英文测试</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --minecraft-green: #7CFC00;
      --minecraft-brown: #8B4513;
      --minecraft-dark: #1a1a2e;
      --minecraft-gray: #16213e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--minecraft-dark) 0%, var(--minecraft-gray) 50%, var(--minecraft-dark) 100%);
      font-family: 'Press Start 2P', cursive, sans-serif;
      color: white;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      color: var(--minecraft-green);
      font-size: 36px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      margin-bottom: 15px;
    }

    .header h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .header p {
      color: #666;
      font-size: 12px;
    }

    .mode-switch {
      text-align: center;
      margin-bottom: 20px;
    }

    .mode-btn {
      background: rgba(22, 33, 62, 0.6);
      color: #666;
      border: 2px solid rgba(124, 252, 0, 0.3);
      border-radius: 8px;
      padding: 15px 25px;
      font-family: 'Press Start 2P', cursive;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      margin: 0 8px;
    }

    .mode-btn.active {
      background: var(--minecraft-green);
      color: black;
      font-weight: bold;
      border-color: var(--minecraft-green);
    }

    .mode-btn:hover {
      transform: scale(1.05);
    }

    .score-board {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .score-item {
      background: rgba(22, 33, 62, 0.5);
      border-radius: 8px;
      padding: 15px 20px;
      border: 2px solid rgba(124, 252, 0, 0.3);
      text-align: center;
    }

    .score-item label {
      color: var(--minecraft-green);
      font-size: 12px;
      display: block;
      margin-bottom: 8px;
    }

    .score-item .value {
      font-size: 32px;
      font-weight: bold;
    }

    .btn {
      background: var(--minecraft-brown);
      color: white;
      border: 2px solid rgba(124, 252, 0, 0.3);
      border-radius: 8px;
      padding: 18px 25px;
      font-family: 'Press Start 2P', cursive;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
      background: #a0522d;
    }

    .btn:disabled {
      background: #444;
      color: #666;
      cursor: not-allowed;
      transform: none;
    }

    .item-card {
      background: rgba(22, 33, 62, 0.4);
      border-radius: 12px;
      padding: 40px 30px;
      border: 4px solid rgba(124, 252, 0, 0.5);
      box-shadow: 0 0 20px rgba(124, 252, 0, 0.1);
      text-align: center;
    }

    .item-name {
      font-size: 48px;
      margin-bottom: 20px;
      color: var(--minecraft-green);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .item-hint {
      color: #666;
      font-size: 14px;
    }

    .answer-form {
      margin-top: 20px;
      display: flex;
      gap: 15px;
    }

    .answer-input {
      flex: 1;
      background: rgba(22, 33, 62, 0.6);
      border: 2px solid rgba(124, 252, 0, 0.5);
      border-radius: 8px;
      padding: 25px;
      font-family: 'Press Start 2P', cursive;
      font-size: 18px;
      color: white;
      outline: none;
    }

    .answer-input:focus {
      border-color: var(--minecraft-green);
    }

    .answer-input::placeholder {
      color: #555;
    }

    .btn-submit {
      background: var(--minecraft-green);
      color: black;
      font-weight: bold;
      border-color: var(--minecraft-green);
    }

    .btn-submit:hover {
      background: #90ee90;
    }

    .feedback {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      border: 4px solid;
      animation: bounceIn 0.3s ease-out;
    }

    .feedback.correct {
      background: rgba(0, 255, 0, 0.2);
      border-color: #0f0;
      color: #0f0;
    }

    .feedback.incorrect {
      background: rgba(255, 0, 0, 0.2);
      border-color: #f00;
      color: #f00;
    }

    .feedback h3 {
      font-size: 24px;
      margin-bottom: 15px;
    }

    .feedback .correct-answer {
      color: white;
      font-size: 18px;
    }

    .feedback .correct-answer span {
      color: var(--minecraft-green);
      font-weight: bold;
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      color: #555;
      font-size: 12px;
    }

    @keyframes bounceIn {
      0% { transform: scale(0.9); opacity: 0; }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 18px;
      }
      
      .score-board {
        justify-content: center;
      }
      
      .score-item {
        padding: 10px 15px;
      }
      
      .score-item .value {
        font-size: 18px;
      }
      
      .item-card {
        padding: 20px;
      }
      
      .item-image-container {
        width: 140px;
        height: 140px;
      }
      
      .item-image {
        width: 110px;
        height: 110px;
      }
      
      .item-name {
        font-size: 18px;
      }
      
      .answer-form {
        flex-direction: column;
      }
      
      .btn {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>我的世界</h1>
      <h2>中英文测试</h2>
      <p>随机展示物品，测试你的中英文名称知识！</p>
    </div>

    <div class="mode-switch">
      <button class="mode-btn active" onclick="setMode('en')">英文模式</button>
      <button class="mode-btn" onclick="setMode('zh')">中文模式</button>
    </div>

    <div class="score-board">
      <div class="score-item">
        <label>得分</label>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-item">
        <label>题目</label>
        <div class="value" id="total">0</div>
      </div>
      <div class="score-item">
        <label>正确率</label>
        <div class="value" id="accuracy">0%</div>
      </div>
      <button class="btn" onclick="resetGame()">重新开始</button>
    </div>

    <div class="item-card">
      <div class="item-name" id="item-name">加载中...</div>
      <div class="item-hint">请输入它的英文名称</div>
    </div>

    <form class="answer-form" onsubmit="handleSubmit(event)">
      <input 
        type="text" 
        id="answer-input" 
        class="answer-input" 
        placeholder="输入英文名称..." 
        autocomplete="off"
      />
      <button type="submit" class="btn btn-submit" id="submit-btn">提交</button>
    </form>

    <div id="feedback" class="feedback" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h3 id="feedback-title"></h3>
          <div class="correct-answer" id="correct-answer" style="display: none;"></div>
        </div>
        <button class="btn" onclick="nextQuestion()">下一题</button>
      </div>
    </div>

    <div class="footer">
      <p>提示：英文模式区分大小写不敏感，空格需正确</p>
    </div>
  </div>

  <script>
    const minecraftItems = [
      { id: 'stone', name_zh: '石头', name_en: 'Stone' },
      { id: 'grass_block', name_zh: '草方块', name_en: 'Grass Block' },
      { id: 'dirt', name_zh: '泥土', name_en: 'Dirt' },
      { id: 'cobblestone', name_zh: '圆石', name_en: 'Cobblestone' },
      { id: 'wood_planks', name_zh: '木板', name_en: 'Wood Planks' },
      { id: 'wood', name_zh: '原木', name_en: 'Log' },
      { id: 'leaves', name_zh: '树叶', name_en: 'Leaves' },
      { id: 'sand', name_zh: '沙子', name_en: 'Sand' },
      { id: 'gravel', name_zh: '沙砾', name_en: 'Gravel' },
      { id: 'gold_ore', name_zh: '金矿石', name_en: 'Gold Ore' },
      { id: 'iron_ore', name_zh: '铁矿石', name_en: 'Iron Ore' },
      { id: 'coal_ore', name_zh: '煤矿石', name_en: 'Coal Ore' },
      { id: 'diamond_ore', name_zh: '钻石矿石', name_en: 'Diamond Ore' },
      { id: 'redstone_ore', name_zh: '红石矿石', name_en: 'Redstone Ore' },
      { id: 'lapis_ore', name_zh: '青金石矿石', name_en: 'Lapis Lazuli Ore' },
      { id: 'emerald_ore', name_zh: '绿宝石矿石', name_en: 'Emerald Ore' },
      { id: 'obsidian', name_zh: '黑曜石', name_en: 'Obsidian' },
      { id: 'bedrock', name_zh: '基岩', name_en: 'Bedrock' },
      { id: 'water', name_zh: '水', name_en: 'Water' },
      { id: 'lava', name_zh: '岩浆', name_en: 'Lava' },
      { id: 'ice', name_zh: '冰', name_en: 'Ice' },
      { id: 'snow', name_zh: '雪', name_en: 'Snow' },
      { id: 'glass', name_zh: '玻璃', name_en: 'Glass' },
      { id: 'brick', name_zh: '砖块', name_en: 'Brick' },
      { id: 'stone_brick', name_zh: '石砖', name_en: 'Stone Brick' },
      { id: 'bookshelf', name_zh: '书架', name_en: 'Bookshelf' },
      { id: 'fence', name_zh: '栅栏', name_en: 'Fence' },
      { id: 'door', name_zh: '门', name_en: 'Door' },
      { id: 'ladder', name_zh: '梯子', name_en: 'Ladder' },
      { id: 'torch', name_zh: '火把', name_en: 'Torch' },
      { id: 'crafting_table', name_zh: '工作台', name_en: 'Crafting Table' },
      { id: 'furnace', name_zh: '熔炉', name_en: 'Furnace' },
      { id: 'chest', name_zh: '箱子', name_en: 'Chest' },
      { id: 'diamond', name_zh: '钻石', name_en: 'Diamond' },
      { id: 'iron_ingot', name_zh: '铁锭', name_en: 'Iron Ingot' },
      { id: 'gold_ingot', name_zh: '金锭', name_en: 'Gold Ingot' },
      { id: 'coal', name_zh: '煤炭', name_en: 'Coal' },
      { id: 'redstone', name_zh: '红石', name_en: 'Redstone' },
      { id: 'lapis_lazuli', name_zh: '青金石', name_en: 'Lapis Lazuli' },
      { id: 'emerald', name_zh: '绿宝石', name_en: 'Emerald' },
      { id: 'stick', name_zh: '木棍', name_en: 'Stick' },
      { id: 'bow', name_zh: '弓', name_en: 'Bow' },
      { id: 'arrow', name_zh: '箭', name_en: 'Arrow' },
      { id: 'sword', name_zh: '剑', name_en: 'Sword' },
      { id: 'pickaxe', name_zh: '镐', name_en: 'Pickaxe' },
      { id: 'axe', name_zh: '斧头', name_en: 'Axe' },
      { id: 'shovel', name_zh: '铲子', name_en: 'Shovel' },
      { id: 'hoe', name_zh: '锄头', name_en: 'Hoe' },
      { id: 'apple', name_zh: '苹果', name_en: 'Apple' },
      { id: 'bread', name_zh: '面包', name_en: 'Bread' },
      { id: 'steak', name_zh: '牛排', name_en: 'Steak' },
      { id: 'porkchop', name_zh: '猪排', name_en: 'Porkchop' },
      { id: 'fish', name_zh: '鱼', name_en: 'Fish' },
      { id: 'egg', name_zh: '鸡蛋', name_en: 'Egg' },
      { id: 'carrot', name_zh: '胡萝卜', name_en: 'Carrot' },
      { id: 'potato', name_zh: '土豆', name_en: 'Potato' },
      { id: 'wheat', name_zh: '小麦', name_en: 'Wheat' },
      { id: 'seeds', name_zh: '种子', name_en: 'Seeds' },
      { id: 'dye', name_zh: '染料', name_en: 'Dye' },
      { id: 'feather', name_zh: '羽毛', name_en: 'Feather' },
      { id: 'bone', name_zh: '骨头', name_en: 'Bone' },
      { id: 'string', name_zh: '线', name_en: 'String' },
      { id: 'leather', name_zh: '皮革', name_en: 'Leather' },
      { id: 'wool', name_zh: '羊毛', name_en: 'Wool' },
      { id: 'cactus', name_zh: '仙人掌', name_en: 'Cactus' },
      { id: 'sugar_cane', name_zh: '甘蔗', name_en: 'Sugar Cane' },
      { id: 'melon', name_zh: '西瓜', name_en: 'Melon' },
      { id: 'pumpkin', name_zh: '南瓜', name_en: 'Pumpkin' },
      { id: 'mushroom', name_zh: '蘑菇', name_en: 'Mushroom' },
      { id: 'flower', name_zh: '花', name_en: 'Flower' },
      { id: 'sapling', name_zh: '树苗', name_en: 'Sapling' },
      { id: 'bed', name_zh: '床', name_en: 'Bed' },
      { id: 'clock', name_zh: '时钟', name_en: 'Clock' },
      { id: 'compass', name_zh: '指南针', name_en: 'Compass' },
      { id: 'map', name_zh: '地图', name_en: 'Map' },
      { id: 'bucket', name_zh: '桶', name_en: 'Bucket' },
      { id: 'boat', name_zh: '船', name_en: 'Boat' },
      { id: 'minecart', name_zh: '矿车', name_en: 'Minecart' },
      { id: 'tnt', name_zh: 'TNT', name_en: 'TNT' },
      { id: 'ender_pearl', name_zh: '末影珍珠', name_en: 'Ender Pearl' },
      { id: 'eye_of_ender', name_zh: '末影之眼', name_en: 'Eye of Ender' },
      { id: 'netherrack', name_zh: '地狱岩', name_en: 'Netherrack' },
      { id: 'soul_sand', name_zh: '灵魂沙', name_en: 'Soul Sand' },
      { id: 'glowstone', name_zh: '萤石', name_en: 'Glowstone' },
      { id: 'quartz', name_zh: '石英', name_en: 'Quartz' },
      { id: 'nether_wart', name_zh: '地狱疣', name_en: 'Nether Wart' },
    ];

    let currentItem = null;
    let score = 0;
    let totalQuestions = 0;
    let usedItems = [];
    let showFeedback = false;
    let currentMode = 'en'; // 'en' = English mode (show Chinese, enter English), 'zh' = Chinese mode (show English, enter Chinese)

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      resetGame();
    }

    function getRandomItem() {
      const availableItems = minecraftItems.filter(item => !usedItems.includes(item.id));
      if (availableItems.length === 0) {
        usedItems = [];
        return minecraftItems[Math.floor(Math.random() * minecraftItems.length)];
      }
      return availableItems[Math.floor(Math.random() * availableItems.length)];
    }

    function updateScore() {
      const accuracy = totalQuestions > 0 ? Math.round((score / totalQuestions) * 100) : 0;
      document.getElementById('score').textContent = score;
      document.getElementById('total').textContent = totalQuestions;
      document.getElementById('accuracy').textContent = accuracy + '%';
    }

    function loadItem() {
      currentItem = getRandomItem();

      const itemNameEl = document.getElementById('item-name');
      const itemHintEl = document.querySelector('.item-hint');
      const answerInput = document.getElementById('answer-input');

      if (currentMode === 'en') {
        itemNameEl.textContent = currentItem.name_zh;
        itemHintEl.textContent = '请输入它的英文名称';
        answerInput.placeholder = '输入英文名称...';
      } else {
        itemNameEl.textContent = currentItem.name_en;
        itemHintEl.textContent = '请输入它的中文名称';
        answerInput.placeholder = '输入中文名称...';
      }

      answerInput.value = '';
      answerInput.disabled = false;
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('feedback').style.display = 'none';
      showFeedback = false;
      
      setTimeout(() => {
        answerInput.focus();
      }, 100);
    }

    function handleSubmit(event) {
      event.preventDefault();
      
      if (showFeedback || !currentItem) return;
      
      const userAnswer = document.getElementById('answer-input').value.trim();
      if (!userAnswer) return;

      let isCorrect;
      let correctAnswerText;

      if (currentMode === 'en') {
        const normalizedAnswer = userAnswer.toLowerCase();
        const normalizedCorrect = currentItem.name_en.toLowerCase();
        isCorrect = normalizedAnswer === normalizedCorrect;
        correctAnswerText = currentItem.name_en;
      } else {
        isCorrect = userAnswer === currentItem.name_zh;
        correctAnswerText = currentItem.name_zh;
      }

      score += isCorrect ? 1 : 0;
      totalQuestions += 1;
      usedItems.push(currentItem.id);
      showFeedback = true;

      updateScore();

      const feedback = document.getElementById('feedback');
      const feedbackTitle = document.getElementById('feedback-title');
      const correctAnswer = document.getElementById('correct-answer');

      feedback.style.display = 'block';
      
      if (isCorrect) {
        feedback.className = 'feedback correct';
        feedbackTitle.textContent = '🎉 正确！';
        correctAnswer.style.display = 'none';
      } else {
        feedback.className = 'feedback incorrect';
        feedbackTitle.textContent = '❌ 错误！';
        correctAnswer.style.display = 'block';
        correctAnswer.innerHTML = '正确答案: <span>' + correctAnswerText + '</span>';
      }

      document.getElementById('answer-input').disabled = true;
      document.getElementById('submit-btn').disabled = true;
    }

    function nextQuestion() {
      loadItem();
    }

    function resetGame() {
      score = 0;
      totalQuestions = 0;
      usedItems = [];
      showFeedback = false;
      updateScore();
      loadItem();
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadItem();
    });
  </script>
</body>
</html>
