<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小学生钟表学习神器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#10B981',
                        accent: '#F59E0B',
                        danger: '#EF4444',
                        light: '#F0F9FF',
                    },
                    fontFamily: {
                        comic: ['Comic Sans MS', 'cursive', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .clock-face {
                background: radial-gradient(circle, #ffffff 0%, #f0f9ff 100%);
            }
            .hand {
                position: absolute;
                top: 50%;
                left: 50%;
                border-radius: 4px;
                transform-origin: center bottom;
            }
            .hour-hand {
                width: 6px;
                height: 60px;
                margin-left: -3px;
                margin-top: -60px;
                background: linear-gradient(to top, #1e40af, #3b82f6);
            }
            .minute-hand {
                width: 4px;
                height: 85px;
                margin-left: -2px;
                margin-top: -85px;
                background: linear-gradient(to top, #047857, #10b981);
            }
            .center-dot {
                width: 16px;
                height: 16px;
                background: #f59e0b;
                border-radius: 50%;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 10;
                box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            }
            .tick-mark {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 2px;
                height: 8px;
                background: #94a3b8;
                transform-origin: center center;
            }
            .tick-major {
                width: 3px;
                height: 15px;
                background: #334155;
            }
            .clock-number {
                position: absolute;
                font-size: 24px;
                font-weight: bold;
                color: #1e293b;
                transform: translate(-50%, -50%);
            }
            .btn-bounce:active {
                transform: scale(0.95);
            }
            .correct-animation {
                animation: correctPulse 0.5s ease;
            }
            .wrong-animation {
                animation: wrongShake 0.5s ease;
            }
            @keyframes correctPulse {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.1); }
            }
            @keyframes wrongShake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
            .star {
                animation: starTwinkle 1s ease-in-out infinite;
            }
            @keyframes starTwinkle {
                0%, 100% { opacity: 1; transform: scale(1); }
                50% { opacity: 0.7; transform: scale(1.2); }
            }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-cyan-50 to-green-50 p-4 md:p-8 font-comic">
    <div class="max-w-5xl mx-auto">
        <!-- 标题 -->
        <div class="text-center mb-6">
            <h1 class="text-3xl md:text-4xl font-bold text-primary mb-2">
                <i class="fa fa-clock-o text-accent mr-2"></i>
                小学生钟表学习神器
            </h1>
            <p class="text-gray-600 text-lg">让小朋友轻松学会看时间！</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- 左侧：钟表展示区 -->
            <div class="bg-white rounded-3xl shadow-xl p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-700">
                        <i class="fa fa-eye text-primary mr-2"></i>学习时钟
                    </h2>
                    <label class="flex items-center gap-2 cursor-pointer bg-blue-50 px-4 py-2 rounded-xl">
                        <input type="checkbox" id="hideNumbers" class="w-5 h-5 accent-primary">
                        <span class="text-gray-700 font-medium">隐藏数字（进阶模式）</span>
                    </label>
                </div>

                <!-- 钟表 -->
                <div class="flex justify-center">
                    <div id="clock" class="clock-face w-64 h-64 md:w-80 md:h-80 rounded-full relative shadow-lg border-8 border-primary">
                        <!-- 刻度和数字由JS生成 -->
                        <div class="hand hour-hand" id="hourHand"></div>
                        <div class="hand minute-hand" id="minuteHand"></div>
                        <div class="center-dot"></div>
                    </div>
                </div>

                <!-- 数字时间显示 -->
                <div class="text-center mt-6">
                    <div id="digitalTime" class="text-5xl font-bold text-gray-800 tracking-wider">
                        12:00
                    </div>
                    <p class="text-gray-500 mt-2">当前时间</p>
                </div>

                <!-- 控制按钮 -->
                <div class="flex flex-wrap justify-center gap-3 mt-6">
                    <button id="prevTime" class="btn-bounce bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded-xl font-bold transition-all">
                        <i class="fa fa-backward mr-2"></i>后退5分钟
                    </button>
                    <button id="autoPlay" class="btn-bounce bg-accent hover:bg-yellow-500 text-white px-6 py-3 rounded-xl font-bold transition-all">
                        <i class="fa fa-play mr-2"></i>自动走时
                    </button>
                    <button id="nextTime" class="btn-bounce bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded-xl font-bold transition-all">
                        <i class="fa fa-forward mr-2"></i>前进5分钟
                    </button>
                </div>
            </div>

            <!-- 右侧：答题练习区 -->
            <div class="bg-white rounded-3xl shadow-xl p-6">
                <h2 class="text-xl font-bold text-gray-700 mb-4">
                    <i class="fa fa-graduation-cap text-secondary mr-2"></i>答题练习
                    <span id="scoreDisplay" class="float-right text-secondary">
                        <i class="fa fa-star text-accent"></i> 得分: <span id="score">0</span>
                    </span>
                </h2>

                <!-- 题目钟表 -->
                <div class="flex justify-center mb-4">
                    <div id="quizClock" class="clock-face w-48 h-48 rounded-full relative shadow-md border-4 border-secondary">
                        <div class="hand" id="quizHourHand" style="width: 5px; height: 36px; margin-left: -2.5px; margin-top: -36px; background: linear-gradient(to top, #1e40af, #3b82f6);"></div>
                        <div class="hand" id="quizMinuteHand" style="width: 3px; height: 52px; margin-left: -1.5px; margin-top: -52px; background: linear-gradient(to top, #047857, #10b981);"></div>
                        <div class="center-dot" style="width: 12px; height: 12px;"></div>
                    </div>
                </div>

                <!-- 题目 -->
                <div class="bg-light rounded-xl p-4 mb-4 text-center">
                    <p class="text-lg text-gray-700 font-bold">
                        🤔 请问上面的钟表显示的是几点几分？
                    </p>
                    <p class="text-sm text-gray-500 mt-1">提示：都是5分钟的整数倍哦！</p>
                </div>

                <!-- 答题选项 -->
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="flex items-center gap-2">
                        <select id="answerHour" class="flex-1 p-3 border-2 border-gray-200 rounded-xl text-lg font-bold focus:border-primary focus:outline-none">
                            <option value="1">1 点</option>
                            <option value="2">2 点</option>
                            <option value="3">3 点</option>
                            <option value="4">4 点</option>
                            <option value="5">5 点</option>
                            <option value="6">6 点</option>
                            <option value="7">7 点</option>
                            <option value="8">8 点</option>
                            <option value="9">9 点</option>
                            <option value="10">10 点</option>
                            <option value="11">11 点</option>
                            <option value="12">12 点</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <select id="answerMinute" class="flex-1 p-3 border-2 border-gray-200 rounded-xl text-lg font-bold focus:border-primary focus:outline-none">
                            <option value="0">00 分</option>
                            <option value="5">05 分</option>
                            <option value="10">10 分</option>
                            <option value="15">15 分</option>
                            <option value="20">20 分</option>
                            <option value="25">25 分</option>
                            <option value="30">30 分</option>
                            <option value="35">35 分</option>
                            <option value="40">40 分</option>
                            <option value="45">45 分</option>
                            <option value="50">50 分</option>
                            <option value="55">55 分</option>
                        </select>
                    </div>
                </div>

                <!-- 提交按钮 -->
                <button id="submitAnswer" class="btn-bounce w-full bg-secondary hover:bg-green-600 text-white py-4 rounded-xl font-bold text-xl transition-all mb-4">
                    <i class="fa fa-check-circle mr-2"></i>提交答案
                </button>

                <!-- 结果反馈 -->
                <div id="resultMessage" class="text-center py-4 rounded-xl hidden">
                    <span id="resultText" class="text-xl font-bold"></span>
                </div>

                <!-- 下一题 -->
                <button id="nextQuestion" class="btn-bounce w-full bg-primary hover:bg-indigo-600 text-white py-4 rounded-xl font-bold text-xl transition-all">
                    <i class="fa fa-refresh mr-2"></i>下一题
                </button>

                <!-- 统计 -->
                <div class="mt-4 flex justify-around text-center bg-gray-50 rounded-xl p-3">
                    <div>
                        <div class="text-2xl font-bold text-secondary" id="correctCount">0</div>
                        <div class="text-sm text-gray-500">答对</div>
                    </div>
                    <div>
                        <div class="text-2xl font-bold text-danger" id="wrongCount">0</div>
                        <div class="text-sm text-gray-500">答错</div>
                    </div>
                    <div>
                        <div class="text-2xl font-bold text-accent" id="accuracy">0%</div>
                        <div class="text-sm text-gray-500">正确率</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 使用说明 -->
        <div class="bg-white rounded-3xl shadow-xl p-6 mt-6">
            <h3 class="text-xl font-bold text-gray-700 mb-4">
                <i class="fa fa-lightbulb-o text-accent mr-2"></i>使用说明
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-blue-50 rounded-xl p-4">
                    <div class="text-3xl mb-2">📚</div>
                    <h4 class="font-bold text-primary mb-1">入门阶段</h4>
                    <p class="text-gray-600 text-sm">显示完整数字，观察时针分针转动，建立时间概念</p>
                </div>
                <div class="bg-green-50 rounded-xl p-4">
                    <div class="text-3xl mb-2">✏️</div>
                    <h4 class="font-bold text-secondary mb-1">练习阶段</h4>
                    <p class="text-gray-600 text-sm">做答题练习，都是5分钟整数倍，降低学习难度</p>
                </div>
                <div class="bg-yellow-50 rounded-xl p-4">
                    <div class="text-3xl mb-2">🚀</div>
                    <h4 class="font-bold text-accent mb-1">进阶阶段</h4>
                    <p class="text-gray-600 text-sm">勾选"隐藏数字"，只看刻度读时间，真正掌握看表技能</p>
                </div>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="text-center mt-6 text-gray-500">
            <p>🎓 专为小学二年级设计 | 让学习看钟表变得有趣又简单</p>
        </div>
    </div>

    <script>
        // 全局状态
        let currentHour = 3;
        let currentMinute = 0;
        let quizHour = 0;
        let quizMinute = 0;
        let score = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let isPlaying = false;
        let playInterval = null;

        // DOM 元素
        const hourHand = document.getElementById('hourHand');
        const minuteHand = document.getElementById('minuteHand');
        const digitalTime = document.getElementById('digitalTime');
        const quizHourHand = document.getElementById('quizHourHand');
        const quizMinuteHand = document.getElementById('quizMinuteHand');
        const hideNumbersCheckbox = document.getElementById('hideNumbers');
        const clock = document.getElementById('clock');
        const quizClock = document.getElementById('quizClock');

        // 初始化钟表刻度和数字
        function initClock(clockElement, size = 240) {
            const center = size / 2;
            
            // 创建刻度（从中心向外）
            for (let i = 0; i < 60; i++) {
                const tick = document.createElement('div');
                tick.className = 'tick-mark';
                const isMajor = i % 5 === 0;
                if (isMajor) {
                    tick.classList.add('tick-major');
                }
                
                const angle = i * 6 - 90; // 从12点位置开始
                const tickLength = isMajor ? 15 : 8;
                const distanceFromEdge = 10;
                
                // 刻度外端在表盘边缘向内distanceFromEdge处
                const outerRadius = center - distanceFromEdge;
                const innerRadius = outerRadius - tickLength;
                
                const rad = angle * Math.PI / 180;
                const midRadius = (innerRadius + outerRadius) / 2;
                
                tick.style.left = `${center + midRadius * Math.cos(rad)}px`;
                tick.style.top = `${center + midRadius * Math.sin(rad)}px`;
                tick.style.transform = `translate(-50%, -50%) rotate(${angle + 90}deg)`;
                
                clockElement.appendChild(tick);
            }
            
            // 创建数字
            for (let i = 1; i <= 12; i++) {
                const num = document.createElement('div');
                num.className = 'clock-number clock-num';
                num.textContent = i;
                
                const angle = (i * 30 - 90) * Math.PI / 180;
                const numRadius = center - 32;
                const x = center + numRadius * Math.cos(angle);
                const y = center + numRadius * Math.sin(angle);
                
                num.style.left = `${x}px`;
                num.style.top = `${y}px`;
                clockElement.appendChild(num);
            }
        }

        // 更新钟表指针
        function updateClock() {
            const hourAngle = (currentHour % 12) * 30 + currentMinute * 0.5;
            const minuteAngle = currentMinute * 6;
            
            hourHand.style.transform = `rotate(${hourAngle}deg)`;
            minuteHand.style.transform = `rotate(${minuteAngle}deg)`;
            
            const displayHour = currentHour === 0 ? 12 : currentHour;
            digitalTime.textContent = `${displayHour.toString().padStart(2, '0')}:${currentMinute.toString().padStart(2, '0')}`;
        }

        // 更新题目钟表
        function updateQuizClock() {
            const hourAngle = (quizHour % 12) * 30 + quizMinute * 0.5;
            const minuteAngle = quizMinute * 6;
            
            quizHourHand.style.transform = `rotate(${hourAngle}deg)`;
            quizMinuteHand.style.transform = `rotate(${minuteAngle}deg)`;
        }

        // 生成新题目
        function newQuestion() {
            // 随机时间（5分钟整数倍）
            quizHour = Math.floor(Math.random() * 12) + 1;
            quizMinute = Math.floor(Math.random() * 12) * 5;
            updateQuizClock();
            document.getElementById('resultMessage').classList.add('hidden');
        }

        // 检查答案
        function checkAnswer() {
            const userHour = parseInt(document.getElementById('answerHour').value);
            const userMinute = parseInt(document.getElementById('answerMinute').value);
            
            const resultMessage = document.getElementById('resultMessage');
            const resultText = document.getElementById('resultText');
            
            const correctHour = quizHour === 12 ? 12 : quizHour;
            const isCorrect = (userHour === correctHour || (userHour === 12 && quizHour === 12)) && userMinute === quizMinute;
            
            resultMessage.classList.remove('hidden', 'bg-green-100', 'bg-red-100');
            
            if (isCorrect) {
                resultMessage.classList.add('bg-green-100');
                resultText.innerHTML = '🎉 太棒了！答对了！<span class="star">⭐</span>';
                resultMessage.classList.add('correct-animation');
                score += 10;
                correctCount++;
            } else {
                resultMessage.classList.add('bg-red-100');
                resultText.innerHTML = `❌ 答错了，正确答案是：${quizHour}点${quizMinute.toString().padStart(2, '0')}分`;
                resultMessage.classList.add('wrong-animation');
                wrongCount++;
            }
            
            setTimeout(() => {
                resultMessage.classList.remove('correct-animation', 'wrong-animation');
            }, 500);
            
            // 更新统计
            document.getElementById('score').textContent = score;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;
            const total = correctCount + wrongCount;
            document.getElementById('accuracy').textContent = total > 0 ? Math.round(correctCount / total * 100) + '%' : '0%';
        }

        // 切换数字显示
        function toggleNumbers() {
            const numbers = document.querySelectorAll('.clock-num');
            numbers.forEach(num => {
                num.style.display = hideNumbersCheckbox.checked ? 'none' : 'block';
            });
        }

        // 自动走时
        function toggleAutoPlay() {
            const btn = document.getElementById('autoPlay');
            if (isPlaying) {
                clearInterval(playInterval);
                btn.innerHTML = '<i class="fa fa-play mr-2"></i>自动走时';
                btn.classList.remove('bg-danger');
                btn.classList.add('bg-accent');
            } else {
                playInterval = setInterval(() => {
                    currentMinute += 5;
                    if (currentMinute >= 60) {
                        currentMinute = 0;
                        currentHour++;
                        if (currentHour > 12) currentHour = 1;
                    }
                    updateClock();
                }, 800);
                btn.innerHTML = '<i class="fa fa-pause mr-2"></i>暂停';
                btn.classList.remove('bg-accent');
                btn.classList.add('bg-danger');
            }
            isPlaying = !isPlaying;
        }

        // 事件绑定
        document.getElementById('prevTime').addEventListener('click', () => {
            currentMinute -= 5;
            if (currentMinute < 0) {
                currentMinute = 55;
                currentHour--;
                if (currentHour < 1) currentHour = 12;
            }
            updateClock();
        });

        document.getElementById('nextTime').addEventListener('click', () => {
            currentMinute += 5;
            if (currentMinute >= 60) {
                currentMinute = 0;
                currentHour++;
                if (currentHour > 12) currentHour = 1;
            }
            updateClock();
        });

        document.getElementById('autoPlay').addEventListener('click', toggleAutoPlay);
        document.getElementById('submitAnswer').addEventListener('click', checkAnswer);
        document.getElementById('nextQuestion').addEventListener('click', newQuestion);
        hideNumbersCheckbox.addEventListener('change', toggleNumbers);

        // 初始化
        initClock(clock, 320);
        initClock(quizClock, 192);
        updateClock();
        newQuestion();
    </script>
</body>
</html>
