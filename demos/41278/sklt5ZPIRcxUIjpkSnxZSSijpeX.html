<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360度健康管家</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 顶部标题栏 */
        .header {
            background: linear-gradient(135deg, #2ECC71 0%, #27AE60 100%);
            color: white;
            padding: 25px 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.3);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-date {
            font-size: 16px;
            opacity: 0.95;
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
        }

        /* 三大菜单卡片 */
        .menu-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .menu-card.active {
            border: 2px solid #2ECC71;
        }

        .menu-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .menu-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .diet .menu-icon { background: linear-gradient(135deg, #FF6B6B, #FF8E8E); }
        .exercise .menu-icon { background: linear-gradient(135deg, #4ECDC4, #6EE7DE); }
        .sleep .menu-icon { background: linear-gradient(135deg, #9B59B6, #BB8FCE); }

        .menu-title {
            font-size: 20px;
            font-weight: 600;
            color: #2c3e50;
        }

        .submenu {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            display: none;
        }

        .submenu.show {
            display: block;
        }

        .submenu-item {
            padding: 12px 15px;
            margin: 5px 0;
            background: #f8f9fa;
            border-radius: 10px;
            color: #555;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .submenu-item:hover {
            background: #e8f5e9;
            color: #2ECC71;
        }

        .submenu-item::before {
            content: '›';
            font-size: 18px;
            color: #2ECC71;
        }

        /* 仪表盘区域 */
        .dashboard-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .dashboard-title {
            text-align: center;
            font-size: 22px;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .gauge-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .gauge {
            position: relative;
            width: 300px;
            height: 300px;
        }

        .gauge-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #e0e0e0 0deg 270deg,
                transparent 270deg 360deg
            );
        }

        .gauge-fill {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #2ECC71 0deg 202.5deg,
                transparent 202.5deg 360deg
            );
        }

        .gauge-inner {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .gauge-value {
            font-size: 56px;
            font-weight: 700;
            color: #2ECC71;
        }

        .gauge-unit {
            font-size: 18px;
            color: #888;
            margin-top: 5px;
        }

        .gauge-target {
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
            padding: 5px 15px;
            background: #f0f0f0;
            border-radius: 15px;
        }

        /* 底部快捷入口 */
        .quick-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .quick-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: #f8f9fa;
            border-radius: 25px;
            color: #666;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .quick-link:hover {
            background: #e8f5e9;
            color: #2ECC71;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .menu-cards {
                grid-template-columns: 1fr;
            }
            .gauge {
                width: 250px;
                height: 250px;
            }
            .gauge-inner {
                width: 200px;
                height: 200px;
                top: 25px;
                left: 25px;
            }
            .gauge-value {
                font-size: 42px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部标题栏 -->
        <header class="header">
            <h1>🏠 360度健康管家</h1>
            <div class="header-date" id="currentDate"></div>
        </header>

        <!-- 三大功能菜单 -->
        <div class="menu-cards">
            <!-- 饮食菜单 -->
            <div class="menu-card diet" onclick="toggleMenu(this)">
                <div class="menu-card-header">
                    <div class="menu-icon">🍽</div>
                    <div class="menu-title">饮食</div>
                </div>
                <div class="submenu">
                    <div class="submenu-item">拍照识卡</div>
                    <div class="submenu-item">健康菜单</div>
                    <div class="submenu-item">饮食报告</div>
                </div>
            </div>

            <!-- 运动菜单 -->
            <div class="menu-card exercise" onclick="toggleMenu(this)">
                <div class="menu-card-header">
                    <div class="menu-icon">🏃</div>
                    <div class="menu-title">运动</div>
                </div>
                <div class="submenu">
                    <div class="submenu-item">运动目标</div>
                    <div class="submenu-item">运动指导</div>
                    <div class="submenu-item">卡路里消耗</div>
                </div>
            </div>

            <!-- 睡眠菜单 -->
            <div class="menu-card sleep" onclick="toggleMenu(this)">
                <div class="menu-card-header">
                    <div class="menu-icon">😴</div>
                    <div class="menu-title">睡眠</div>
                </div>
                <div class="submenu">
                    <div class="submenu-item">睡眠报告</div>
                    <div class="submenu-item">睡眠建议</div>
                </div>
            </div>
        </div>

        <!-- 中央仪表盘 -->
        <div class="dashboard-section">
            <h2 class="dashboard-title">今日卡路里摄入</h2>
            <div class="gauge-container">
                <div class="gauge">
                    <div class="gauge-bg"></div>
                    <div class="gauge-fill"></div>
                    <div class="gauge-inner">
                        <div class="gauge-value">1500</div>
                        <div class="gauge-unit">卡路里</div>
                        <div class="gauge-target">目标 2000 卡</div>
                    </div>
                </div>
            </div>
            <div class="quick-links">
                <div class="quick-link">📊 详细分析</div>
                <div class="quick-link">📅 历史记录</div>
                <div class="quick-link">⚙️ 设置目标</div>
            </div>
        </div>
    </div>

    <script>
        // 显示当前日期
        const dateEl = document.getElementById('currentDate');
        const today = new Date();
        dateEl.textContent = `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;

        // 点击菜单展开/收起子菜单
        function toggleMenu(card) {
            const submenu = card.querySelector('.submenu');
            submenu.classList.toggle('show');
            card.classList.toggle('active');
        }
    </script>
</body>
</html>
