<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>干饭地图 - 公司附近吃饭推荐</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--accent:#FF6B35;--accent2:#f7931e;--green:#27ae60;--red:#e74c3c;--bg:#f4f5f7;--bg2:#fff;--ink:#1a1a1a;--muted:#7c8290;--rule:#e4e6eb;--radius:10px;--shadow:0 2px 8px rgba(0,0,0,.06);--shadow2:0 4px 20px rgba(0,0,0,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:14px}
a{text-decoration:none;color:inherit}
.navbar{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);height:56px;display:flex;align-items:center;padding:0 20px;gap:16px}
.nav-logo{font-size:1.2rem;font-weight:800;color:var(--accent);white-space:nowrap;cursor:pointer}
.nav-logo span{color:var(--ink)}
.nav-select{padding:6px 12px;border:1px solid var(--rule);border-radius:8px;font-size:.88rem;background:var(--bg2);cursor:pointer;outline:none;font-family:inherit}
.nav-select:focus{border-color:var(--accent)}
.nav-search{flex:1;max-width:260px;position:relative}
.nav-search input{width:100%;padding:7px 12px 7px 32px;border:1px solid var(--rule);border-radius:18px;font-size:.85rem;outline:none;background:var(--bg);font-family:inherit}
.nav-search input:focus{border-color:var(--accent)}
.nav-search::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:.82rem}

.app{display:flex;padding-top:56px;height:100vh}
.map-wrap{flex:1;position:relative}
#map{width:100%;height:100%}

/* Sidebar */
.sidebar{width:380px;background:var(--bg2);border-left:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden;transition:transform .3s}
.sidebar-header{padding:16px;border-bottom:1px solid var(--rule)}
.sidebar-header h2{font-size:1.1rem;font-weight:700;margin-bottom:10px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap}
.filter-tag{padding:5px 12px;border-radius:14px;cursor:pointer;font-size:.8rem;background:var(--bg);border:1px solid var(--rule);transition:all .2s;color:var(--muted);white-space:nowrap}
.filter-tag:hover{border-color:var(--accent);color:var(--accent)}
.filter-tag.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sort-bar{display:flex;gap:6px;margin-top:10px;align-items:center}
.sort-bar .label{font-size:.78rem;color:var(--muted)}
.sort-btn{padding:3px 10px;border-radius:6px;cursor:pointer;font-size:.78rem;background:var(--bg);border:1px solid var(--rule);transition:all .2s;color:var(--muted)}
.sort-btn:hover{border-color:var(--accent)}
.sort-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.restaurant-list{flex:1;overflow-y:auto;padding:12px}
.r-card{background:var(--bg);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;transition:all .2s;border:1px solid transparent}
.r-card:hover{border-color:var(--accent);box-shadow:var(--shadow2);transform:translateX(-2px)}
.r-card .r-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.r-card .r-name{font-size:1rem;font-weight:700;flex:1}
.r-card .r-price{font-size:.85rem;color:var(--accent);font-weight:600;white-space:nowrap;margin-left:8px}
.r-card .r-meta{display:flex;gap:10px;font-size:.78rem;color:var(--muted);margin-bottom:6px}
.r-card .r-tags{display:flex;gap:4px;flex-wrap:wrap}
.r-card .r-tag{font-size:.7rem;padding:2px 8px;border-radius:10px;background:var(--bg2);color:var(--muted);border:1px solid var(--rule)}
.r-card .r-tag.highlight{background:#fff3e0;color:var(--accent);border-color:var(--accent)}
.r-card .r-desc{font-size:.8rem;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

/* Stats bar */
.stats-bar{display:flex;gap:12px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--rule);font-size:.82rem}
.stats-bar .stat{display:flex;align-items:center;gap:4px}
.stats-bar .stat-val{font-weight:700;color:var(--accent)}

/* Detail panel */
.detail-panel{position:fixed;bottom:0;left:0;right:380px;background:var(--bg2);border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.12);z-index:900;padding:20px 24px;transform:translateY(100%);transition:transform .3s;max-height:50vh;overflow-y:auto}
.detail-panel.show{transform:translateY(0)}
.detail-panel .dp-close{position:absolute;top:12px;right:16px;cursor:pointer;font-size:1.2rem;color:var(--muted);width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg)}
.detail-panel .dp-close:hover{background:var(--rule)}
.detail-panel h3{font-size:1.2rem;font-weight:700;margin-bottom:4px}
.detail-panel .dp-cuisine{font-size:.85rem;color:var(--accent);margin-bottom:8px}
.detail-panel .dp-info{display:flex;gap:16px;font-size:.85rem;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.detail-panel .dp-desc{font-size:.9rem;line-height:1.7;margin-bottom:10px}
.detail-panel .dp-tags{display:flex;gap:6px;flex-wrap:wrap}
.detail-panel .dp-tag{padding:4px 12px;border-radius:12px;background:var(--bg);font-size:.8rem;color:var(--ink)}
.detail-panel .dp-tag.good{background:#e8f5e9;color:#2e7d32}
.detail-panel .dp-tag.cheap{background:#fff3e0;color:#e65100}

/* Stars */
.stars{display:inline-flex;gap:1px}.stars .s{color:#ddd;font-size:.85rem}.stars .s.f{color:#f1c40f}

/* Company markers */
.company-marker{background:var(--accent);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.3);border:2px solid #fff}
.restaurant-marker{background:var(--green);color:#fff;width:10px;height:10px;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.3);border:2px solid #fff}
.leaflet-popup-content-wrapper{border-radius:10px!important;box-shadow:0 2px 12px rgba(0,0,0,.15)!important}
.leaflet-popup-content{margin:10px 14px!important;font-family:inherit!important;font-size:.88rem!important;line-height:1.5!important}
.popup-title{font-weight:700;font-size:1rem;margin-bottom:4px}
.popup-meta{color:var(--muted);font-size:.82rem;margin-bottom:6px}

/* Empty */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .e-icon{font-size:2.5rem;margin-bottom:8px}

/* Mobile */
@media(max-width:768px){
  .sidebar{position:fixed;right:0;top:56px;bottom:0;width:100%;transform:translateX(100%);z-index:800;border-left:none}
  .sidebar.open{transform:translateX(0)}
  .detail-panel{right:0;left:0}
  .mobile-toggle{display:flex!important}
  .map-toggle{position:fixed;bottom:20px;right:20px;z-index:850;background:var(--accent);color:#fff;width:48px;height:48px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer;border:none}
}
.map-toggle{display:none}
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-logo" onclick="resetView()">干饭<span>地图</span></div>
  <select class="nav-select" id="companySelect" onchange="selectCompany(this.value)">
    <option value="">选择你的公司</option>
  </select>
  <div class="nav-search">
    <input type="text" id="searchInput" placeholder="搜索餐厅..." oninput="handleSearch(this.value)">
  </div>
</nav>

<div class="app">
  <div class="map-wrap">
    <div id="map"></div>
    <div class="detail-panel" id="detailPanel">
      <div class="dp-close" onclick="closeDetail()">✕</div>
      <div id="detailContent"></div>
    </div>
  </div>
  <div class="sidebar" id="sidebar">
    <div class="stats-bar" id="statsBar"></div>
    <div class="sidebar-header">
      <h2>🍜 附近餐厅</h2>
      <div class="filter-row" id="cuisineFilters"></div>
      <div class="sort-bar">
        <span class="label">排序</span>
        <span class="sort-btn active" onclick="changeSort('distance',this)">距离近</span>
        <span class="sort-btn" onclick="changeSort('price_asc',this)">价格低</span>
        <span class="sort-btn" onclick="changeSort('rating',this)">评分高</span>
        <span class="sort-btn" onclick="changeSort('popular',this)">人气高</span>
      </div>
    </div>
    <div class="restaurant-list" id="restaurantList"></div>
  </div>
</div>

<button class="map-toggle" id="mapToggle" onclick="toggleSidebar()">📋</button>

<script>
// ===== 数据 =====
var CENTER = [39.9087, 116.4605];

var COMPANIES = [
  {id:'co1',name:'星河大厦',lat:39.9102,lng:116.4615,icon:'🏢'},
  {id:'co2',name:'鼎盛中心',lat:39.9082,lng:116.4578,icon:'🏙️'},
  {id:'co3',name:'云图科技大厦',lat:39.9125,lng:116.4652,icon:'💻'},
  {id:'co4',name:'蓝海国际',lat:39.9068,lng:116.4548,icon:'🌐'},
  {id:'co5',name:'启智广场',lat:39.9112,lng:116.4568,icon:'📚'},
  {id:'co6',name:'绿能大厦',lat:39.9095,lng:116.4530,icon:'🌱'}
];

var CUISINES = ['全部','面馆','快餐','川菜','火锅','烤肉','奶茶','小吃','湘菜','麻辣烫','西餐'];

var RESTAURANTS = [
  {id:'r1',name:'老王拉面',lat:39.9098,lng:116.4628,cuisine:'面馆',price:15,rating:4.2,likes:89,tags:['好吃','实惠','出餐快'],desc:'开了10年的老店，牛肉面是招牌，汤头浓郁，面条劲道。中午排队但很快。'},
  {id:'r2',name:'川味小馆',lat:39.9108,lng:116.4602,cuisine:'川菜',price:28,rating:4.5,likes:156,tags:['好吃','微辣可选','分量足'],desc:'正宗川菜馆，水煮鱼和麻婆豆腐必点。可以选微辣中辣特辣，老板很热情。'},
  {id:'r3',name:'沙县小吃',lat:39.9088,lng:116.4635,cuisine:'小吃',price:12,rating:3.8,likes:45,tags:['实惠','出餐快','老字号'],desc:'蒸饺和拌面是经典搭配，便宜管饱。环境一般但胜在方便快捷。'},
  {id:'r4',name:'黄焖鸡米饭',lat:39.9118,lng:116.4598,cuisine:'快餐',price:20,rating:4.0,likes:67,tags:['实惠','出餐快'],desc:'黄焖鸡米饭，鸡肉嫩滑入味，配菜可以自己加。上菜速度快，10分钟内必出。'},
  {id:'r5',name:'兰州拉面',lat:39.9078,lng:116.4602,cuisine:'面馆',price:14,rating:3.9,likes:52,tags:['实惠','清真'],desc:'兰州师傅手拉，牛肉汤清亮。加一份牛肉才12块，性价比很高。'},
  {id:'r6',name:'汉堡王',lat:39.9102,lng:116.4558,cuisine:'西餐',price:32,rating:4.1,likes:78,tags:['出餐快','有座'],desc:'火烤汉堡是特色，比某M家好吃。工作日午餐套餐22元很划算。'},
  {id:'r7',name:'海底捞',lat:39.9128,lng:116.4622,cuisine:'火锅',price:120,rating:4.7,likes:312,tags:['好吃','服务好','适合团建'],desc:'服务没得说，锅底选择多。适合部门聚餐，有学生证打折。午餐人少不用排队。'},
  {id:'r8',name:'便利蜂',lat:39.9092,lng:116.4642,cuisine:'快餐',price:18,rating:3.5,likes:34,tags:['实惠','出餐快','24小时'],desc:'便当和热狗是主打，微波炉加热。最快选择，适合赶时间。24小时营业。'},
  {id:'r9',name:'湘妹子',lat:39.9082,lng:116.4572,cuisine:'湘菜',price:30,rating:4.3,likes:98,tags:['好吃','微辣可选','分量足'],desc:'辣椒炒肉和剁椒鱼头是招牌，味道正宗。老板娘湖南人，很会做生意。'},
  {id:'r10',name:'望京小腰',lat:39.9112,lng:116.4638,cuisine:'烤肉',price:88,rating:4.6,likes:201,tags:['好吃','适合团建','氛围好'],desc:'烤串一绝，羊肉串和腰子必点。晚上有驻唱，适合下班聚餐。'},
  {id:'r11',name:'真功夫',lat:39.9072,lng:116.4618,cuisine:'快餐',price:24,rating:3.7,likes:41,tags:['出餐快','营养'],desc:'蒸品快餐，相对健康。排骨饭和香菇鸡饭是经典款。不上火。'},
  {id:'r12',name:'喜茶',lat:39.9108,lng:116.4658,cuisine:'奶茶',price:20,rating:4.4,likes:189,tags:['人气高','出餐快'],desc:'多肉葡萄和芝芝莓莓是招牌。下午茶首选，小程序点单不用排队。'},
  {id:'r13',name:'肯德基',lat:39.9118,lng:116.4578,cuisine:'西餐',price:28,rating:4.0,likes:72,tags:['出餐快','有座','老字号'],desc:'疯狂星期四和周末套餐值得蹲。环境稳定不会踩雷，外卖也很快。'},
  {id:'r14',name:'重庆小面',lat:39.9088,lng:116.4592,cuisine:'面馆',price:16,rating:4.1,likes:63,tags:['好吃','实惠','微辣可选'],desc:'豌杂面和小面都很正宗。加个煎蛋5块钱，吃得饱饱的。'},
  {id:'r15',name:'鱼你在一起',lat:39.9098,lng:116.4568,cuisine:'快餐',price:26,rating:4.2,likes:87,tags:['好吃','出餐快'],desc:'番茄鱼和麻辣鱼两种口味。鱼肉嫩滑，米饭免费续。一个人吃刚好。'},
  {id:'r16',name:'杨国福麻辣烫',lat:39.9122,lng:116.4608,cuisine:'麻辣烫',price:22,rating:4.0,likes:55,tags:['好吃','实惠','自选'],desc:'食材自选，按斤称重。汤底可以选骨汤和麻辣，冬天吃一碗很舒服。'},
  {id:'r17',name:'袁记云饺',lat:39.9075,lng:116.4630,cuisine:'小吃',price:18,rating:4.3,likes:76,tags:['好吃','实惠'],desc:'鲜虾饺和云吞面是招牌，皮薄馅大。现场包制看得见，干净卫生。'},
  {id:'r18',name:'大米先生',lat:39.9115,lng:116.4545,cuisine:'快餐',price:22,rating:3.6,likes:38,tags:['实惠','出餐快','营养'],desc:'中式营养快餐，每天换菜单。两荤一素套餐18元，性价比不错。'},
  {id:'r19',name:'蜜雪冰城',lat:39.9065,lng:116.4595,cuisine:'奶茶',price:8,rating:4.0,likes:143,tags:['实惠','人气高','出餐快'],desc:'2块钱的冰淇淋和4块的柠檬水，打工人之光。永远不踩雷的选择。'},
  {id:'r20',name:'张亮麻辣烫',lat:39.9130,lng:116.4585,cuisine:'麻辣烫',price:20,rating:3.9,likes:48,tags:['实惠','自选'],desc:'和杨国福各有千秋，底料味道偏麻。晚上9点后半价，夜宵好选择。'}
];

// ===== 状态 =====
var selectedCompanyId = '';
var currentCuisine = '全部';
var currentSort = 'distance';
var searchKeyword = '';
var map, companyMarkers = [], restaurantMarkers = [], selectedMarker = null;

// ===== 工具函数 =====
function calcDistance(lat1,lng1,lat2,lng2){
  var R=6371000;var dLat=(lat2-lat1)*Math.PI/180;var dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function fmtDist(m){return m<1000?Math.round(m)+'m':(m/1000).toFixed(1)+'km'}
function fmtPrice(p){return '¥'+p+'/人'}
function starsHTML(r){var h='<span class="stars">';for(var i=1;i<=5;i++)h+='<span class="s'+(i<=Math.round(r)?' f':'')+'">★</span>';h+='</span>';return h}
function getDist(r){
  if(!selectedCompanyId)return 9999;
  var c=COMPANIES.find(function(x){return x.id===selectedCompanyId});
  return c?calcDistance(c.lat,c.lng,r.lat,r.lng):9999;
}

// ===== 初始化地图 =====
function initMap(){
  map=L.map('map',{zoomControl:false}).setView(CENTER,16);
  L.control.zoom({position:'topright'}).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; OpenStreetMap',maxZoom:19
  }).addTo(map);
  renderCompanyMarkers();
  renderRestaurantMarkers();
  populateCompanySelect();
  renderCuisineFilters();
  renderAll();
}

function renderCompanyMarkers(){
  companyMarkers.forEach(function(m){map.removeLayer(m)});
  companyMarkers=[];
  COMPANIES.forEach(function(c){
    var icon=L.divIcon({className:'',html:'<div class="company-marker">'+c.icon+'</div>',iconSize:[28,28],iconAnchor:[14,14]});
    var m=L.marker([c.lat,c.lng],{icon:icon}).addTo(map);
    m.bindPopup('<div class="popup-title">'+c.name+'</div><div class="popup-meta">📍 公司位置 · 点击选择</div>');
    m.on('click',function(){document.getElementById('companySelect').value=c.id;selectCompany(c.id)});
    companyMarkers.push(m);
  });
}

function renderRestaurantMarkers(list){
  restaurantMarkers.forEach(function(m){map.removeLayer(m)});
  restaurantMarkers=[];
  var data=list||getFilteredList();
  data.forEach(function(r){
    var dist=getDist(r);
    var color=dist<300?'#27ae60':(dist<600?'#f39c12':'#95a5a6');
    var icon=L.divIcon({className:'',html:'<div class="restaurant-marker" style="background:'+color+'"></div>',iconSize:[10,10],iconAnchor:[5,5]});
    var m=L.marker([r.lat,r.lng],{icon:icon}).addTo(map);
    m.bindPopup('<div class="popup-title">🍜 '+r.name+'</div><div class="popup-meta">'+r.cuisine+' · '+fmtPrice(r.price)+' · '+starsHTML(r.rating)+' '+r.rating.toFixed(1)+'</div>');
    m.on('click',function(){showDetail(r)});
    restaurantMarkers.push(m);
  });
}

function populateCompanySelect(){
  var sel=document.getElementById('companySelect');
  COMPANIES.forEach(function(c){
    var opt=document.createElement('option');opt.value=c.id;opt.textContent=c.icon+' '+c.name;
    sel.appendChild(opt);
  });
}

function renderCuisineFilters(){
  var el=document.getElementById('cuisineFilters');
  el.innerHTML=CUISINES.map(function(c){return '<span class="filter-tag'+(c===currentCuisine?' active':'')+'" onclick="filterCuisine(\''+c+'\')">'+c+'</span>'}).join('');
}

// ===== 筛选与排序 =====
function getFilteredList(){
  var list=RESTAURANTS.slice();
  if(currentCuisine!=='全部')list=list.filter(function(r){return r.cuisine===currentCuisine});
  if(searchKeyword){var kw=searchKeyword.toLowerCase();list=list.filter(function(r){return r.name.toLowerCase().includes(kw)||r.cuisine.toLowerCase().includes(kw)||r.tags.some(function(t){return t.toLowerCase().includes(kw)})})}
  list.forEach(function(r){r._dist=getDist(r)});
  if(currentSort==='distance')list.sort(function(a,b){return a._dist-b._dist});
  else if(currentSort==='price_asc')list.sort(function(a,b){return a.price-b.price});
  else if(currentSort==='rating')list.sort(function(a,b){return b.rating-a.rating});
  else if(currentSort==='popular')list.sort(function(a,b){return b.likes-a.likes});
  return list;
}

// ===== 渲染列表 =====
function renderAll(){
  var list=getFilteredList();
  renderRestaurantMarkers(list);
  renderList(list);
  renderStats(list);
}

function renderList(list){
  var el=document.getElementById('restaurantList');
  if(list.length===0){el.innerHTML='<div class="empty"><div class="e-icon">🔍</div><div>暂无匹配餐厅</div></div>';return}
  el.innerHTML=list.map(function(r){
    var dist=getDist(r);
    var distLabel=selectedCompanyId?fmtDist(dist):'--';
    var goodTags=r.tags.filter(function(t){return t==='好吃'||t==='实惠'||t==='出餐快'||t==='人气高'});
    return '<div class="r-card" onclick="focusRestaurant(\''+r.id+'\')"><div class="r-top"><span class="r-name">'+r.name+'</span><span class="r-price">'+fmtPrice(r.price)+'</span></div><div class="r-meta"><span>'+r.cuisine+'</span><span>'+starsHTML(r.rating)+' '+r.rating.toFixed(1)+'</span><span>📍 '+distLabel+'</span><span>👍 '+r.likes+'</span></div><div class="r-tags">'+goodTags.map(function(t){return '<span class="r-tag highlight">'+t+'</span>'}).join('')+'<span class="r-tag">'+r.tags.filter(function(t){return t!=='好吃'&&t!=='实惠'&&t!=='出餐快'&&t!=='人气高'}).join('</span><span class="r-tag">','</span>')+'</div>'+(r.desc?'<div class="r-desc">'+r.desc+'</div>':'')+'</div>';
  }).join('');
}

function renderStats(list){
  var el=document.getElementById('statsBar');
  var total=list.length;
  var cheap=list.filter(function(r){return r.price<=20}).length;
  var fast=list.filter(function(r){return r.tags.indexOf('出餐快')>-1}).length;
  var near=selectedCompanyId?list.filter(function(r){return getDist(r)<500}).length:'--';
  el.innerHTML='<div class="stat"><span class="stat-val">'+total+'</span> 家餐厅</div><div class="stat"><span class="stat-val" style="color:var(--green)">¥20内 '+cheap+'</span></div><div class="stat"><span class="stat-val">⚡'+fast+'</span> 家快</div><div class="stat"><span class="stat-val">🚶500m内 '+near+'</span></div>';
}

// ===== 交互 =====
function selectCompany(id){
  selectedCompanyId=id;
  var c=COMPANIES.find(function(x){return x.id===id});
  if(c)map.flyTo([c.lat,c.lng],16,{duration:0.8});
  renderAll();
}

function resetView(){
  selectedCompanyId='';searchKeyword='';
  document.getElementById('companySelect').value='';
  document.getElementById('searchInput').value='';
  currentCuisine='全部';currentSort='distance';
  renderCuisineFilters();
  document.querySelectorAll('.sort-btn').forEach(function(b,i){b.classList.toggle('active',i===0)});
  map.flyTo(CENTER,15,{duration:0.8});
  renderAll();
}

function filterCuisine(c){
  currentCuisine=c;
  renderCuisineFilters();
  renderAll();
}

function changeSort(s,el){
  currentSort=s;
  document.querySelectorAll('.sort-btn').forEach(function(b){b.classList.remove('active')});
  el.classList.add('active');
  renderAll();
}

function handleSearch(val){
  searchKeyword=val.trim();
  renderAll();
}

function focusRestaurant(id){
  var r=RESTAURANTS.find(function(x){return x.id===id});
  if(r){map.flyTo([r.lat,r.lng],18,{duration:0.5});showDetail(r)}
}

function showDetail(r){
  var dist=getDist(r);
  var walkMin=Math.round(dist/80);
  var html='<h3>🍜 '+r.name+'</h3><div class="dp-cuisine">'+r.cuisine+'</div><div class="dp-info"><span>'+starsHTML(r.rating)+' '+r.rating.toFixed(1)+'</span><span>'+fmtPrice(r.price)+'</span><span>📍 '+(selectedCompanyId?fmtDist(dist):'请先选公司')+'</span>'+(selectedCompanyId?'<span>🚶 约'+walkMin+'分钟</span>':'')+'<span>👍 '+r.likes+'</span></div>'+(r.desc?'<div class="dp-desc">'+r.desc+'</div>':'')+'<div class="dp-tags">'+r.tags.map(function(t){var cls='';if(t==='好吃')cls='good';if(t==='实惠')cls='cheap';return '<span class="dp-tag '+cls+'">'+t+'</span>'}).join('')+'</div>';
  document.getElementById('detailContent').innerHTML=html;
  document.getElementById('detailPanel').classList.add('show');
}

function closeDetail(){document.getElementById('detailPanel').classList.remove('show')}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}

// ===== 启动 =====
initMap();
</script>
</body>
</html>
