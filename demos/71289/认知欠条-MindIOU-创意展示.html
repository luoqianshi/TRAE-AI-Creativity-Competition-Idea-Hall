创意名称：认知欠条 MindIOU

AI 能帮我们快速完成方案、代码、文章和项目，但“完成工作”不等于“真正理解”。很多人在使用 ChatGPT、Claude、Cursor 或 Codex 后得到了结果，却跳过了技术原理、关键判断、风险识别和成果验收等认知过程。

我在使用 AI 开发智能眼镜项目时发现，项目进展得很快，但自己并没有同步获得足够的技术判断能力：AI 选择的技术路线是否合理、修复是否完整、哪些假设没有验证，我常常无法独立判断。因此我想做一个不继续替用户完成工作，而是帮助用户发现并清偿“AI 认知债务”的产品。

认知欠条 MindIOU 是一个 AI 认知债务清算系统。用户输入一段 AI 对话、AI 生成的方案、黑客松记录、会议纪要或 AI 辅助文章，系统生成一份认知债务清算报告，指出 AI 替用户完成了什么、用户真正贡献了什么，以及哪些关键理解和判断被跳过。

2. 目标用户及痛点

核心用户是频繁使用生成式 AI 的学生、开发者、产品经理、创业者和知识工作者。他们会在使用 AI 完成代码开发、项目方案、会议总结、产品分析或内容创作后使用 MindIOU。

当前最大的问题是：AI 可以迅速提高产出速度，却容易掩盖用户没有真正理解的部分。用户可能拥有一个可以运行的项目，却不知道故障为什么发生；拥有一份完整方案，却无法判断其中哪些假设没有验证；拥有一篇成熟文章，却分不清哪些观点真正来自自己。

MindIOU 会将材料整理为：AI 替你完成了什么、你真正提供了什么、最危险的五个理解缺口、事实/假设/问题/决定/取舍、3–5 张费曼补偿卡，以及下一步需要查证、写进笔记、转成任务或询问老师与专家的事项。

3. 价值与意义

MindIOU 的价值不是让 AI 再替用户完成一次总结，而是把 AI 辅助工作的隐藏成本显性化。在效率层面，它将长对话重新整理成可执行的认知结构，帮助用户快速发现尚未验证的风险；在学习层面，它要求用户亲自解释关键概念，并通过 AI 追问、验证和修正逐步清偿认知债务。

我们希望用户第一次看到报告时产生一个明确认识：原来我刚才让 AI 跳过了这么多理解过程。
