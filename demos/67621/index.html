<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一帧故事 —— AI微短剧创作工作台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0a0e17;
            --secondary-dark: #111827;
            --card-dark: #1a2332;
            --border-color: #2d3748;
            --gold: #d4a574;
            --gold-light: #e6c9a8;
            --amber: #f59e0b;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--primary-dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .film-strip-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(
                    90deg,
                    transparent 0px,
                    transparent 19px,
                    rgba(212, 165, 116, 0.03) 20px
                ),
                repeating-linear-gradient(
                    0deg,
                    transparent 0px,
                    transparent 19px,
                    rgba(212, 165, 116, 0.03) 20px
                );
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        header {
            padding: 60px 0 40px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
        }

        .film-border {
            display: inline-block;
            padding: 30px 40px;
            border: 2px solid var(--border-color);
            position: relative;
            background: linear-gradient(135deg, var(--secondary-dark) 0%, var(--primary-dark) 100%);
        }

        .film-border::before,
        .film-border::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--gold);
            background: var(--primary-dark);
        }

        .film-border::before {
            top: -12px;
            left: -12px;
        }

        .film-border::after {
            bottom: -12px;
            right: -12px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--amber) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header h2 {
            font-size: 1.2rem;
            font-weight: 300;
            color: var(--text-secondary);
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        header p {
            font-size: 1rem;
            color: var(--text-muted);
            font-style: italic;
            max-width: 600px;
            margin: 0 auto;
        }

        .story-input-section {
            margin-bottom: 60px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--gold);
            border-radius: 2px;
        }

        .input-group {
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 165, 116, 0.1);
        }

        textarea {
            width: 100%;
            min-height: 120px;
            background: var(--secondary-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            color: var(--text-primary);
            font-size: 1rem;
            resize: vertical;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 165, 116, 0.2);
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .btn-generate {
            margin-top: 20px;
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--gold) 0%, var(--amber) 100%);
            color: var(--primary-dark);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 165, 116, 0.3);
        }

        .btn-generate:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--primary-dark);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .storyboard-section {
            display: none;
            margin-bottom: 60px;
        }

        .storyboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 24px;
        }

        @media (max-width: 900px) {
            .storyboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .storyboard-card {
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .storyboard-card:hover {
            border-color: var(--gold);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--secondary-dark);
        }

        .shot-number {
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--gold);
        }

        .shot-type {
            padding: 4px 12px;
            background: rgba(212, 165, 116, 0.1);
            border: 1px solid var(--gold);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--gold-light);
        }

        .card-body {
            padding: 20px;
        }

        .shot-description {
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 16px;
            line-height: 1.7;
        }

        .prompt-box {
            background: var(--secondary-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .prompt-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }

        .prompt-text {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
            word-break: break-all;
        }

        .card-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--secondary-dark);
        }

        .duration, .movement {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .duration-icon, .movement-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(212, 165, 116, 0.1);
            border-radius: 4px;
        }

        .style-panel-section {
            margin-bottom: 60px;
        }

        .style-panel {
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .style-item {
            margin-bottom: 20px;
        }

        .style-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: block;
        }

        .style-value {
            font-size: 1rem;
            color: var(--text-primary);
            background: var(--secondary-dark);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .style-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .style-tag {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
            background: var(--secondary-dark);
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .style-tag.active {
            background: rgba(212, 165, 116, 0.2);
            border-color: var(--gold);
            color: var(--gold-light);
        }

        .efficiency-section {
            margin-bottom: 60px;
        }

        .efficiency-compare {
            display: flex;
            gap: 30px;
            align-items: center;
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .efficiency-compare {
                flex-direction: column;
            }
        }

        .process-column {
            flex: 1;
            min-width: 250px;
        }

        .process-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }

        .process-title.traditional {
            color: var(--text-muted);
        }

        .process-title.oneframe {
            color: var(--gold);
        }

        .process-steps {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .process-step {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: var(--secondary-dark);
            border-radius: 8px;
            border-left: 3px solid var(--border-color);
        }

        .process-column.oneframe .process-step {
            border-left-color: var(--gold);
        }

        .step-text {
            flex: 1;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .step-time {
            font-family: 'Courier New', monospace;
            color: var(--text-secondary);
        }

        .efficiency-arrow {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 20px;
        }

        .arrow-icon {
            font-size: 2.5rem;
            color: var(--gold);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .efficiency-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold);
            text-align: center;
        }

        .total-time {
            margin-top: 16px;
            padding: 12px;
            background: var(--secondary-dark);
            border-radius: 8px;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
        }

        .total-time.traditional {
            color: var(--text-muted);
        }

        .total-time.oneframe {
            color: var(--gold);
            border: 1px solid var(--gold);
        }

        footer {
            padding: 40px 0;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }

        footer p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-style: italic;
            max-width: 600px;
            margin: 0 auto;
        }

        .film-strip-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 50px,
                rgba(0, 0, 0, 0.5) 50px,
                rgba(0, 0, 0, 0.5) 52px
            );
            pointer-events: none;
            z-index: 10;
            opacity: 0.1;
        }

        .scroll-indicator {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 40px;
            height: 60px;
            border: 2px solid var(--gold);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            padding-top: 10px;
            animation: bounce 2s infinite;
            z-index: 20;
        }

        .scroll-indicator::after {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--gold);
            border-radius: 50%;
            animation: scroll 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes scroll {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(30px); opacity: 0; }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-in {
            animation: slideIn 0.6s ease forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }

        .copy-btn {
            padding: 4px 8px;
            font-size: 0.75rem;
            background: rgba(212, 165, 116, 0.1);
            border: 1px solid var(--gold);
            border-radius: 4px;
            color: var(--gold);
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: 8px;
        }

        .copy-btn:hover {
            background: var(--gold);
            color: var(--primary-dark);
        }

        .copy-btn.copied {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }
    </style>
</head>
<body>
    <div class="film-strip-bg"></div>
    <div class="film-strip-overlay"></div>

    <div class="container">
        <header>
            <div class="film-border">
                <h1>一帧故事</h1>
                <h2>AI微短剧创作工作台</h2>
                <p>从脑子里的想法，到可以开拍的分镜，中间只差一次对话</p>
            </div>
        </header>

        <section class="story-input-section">
            <h3 class="section-title">故事大纲</h3>
            <div class="input-group">
                <textarea id="storyInput" placeholder="请输入您的故事大纲...">第七天。雨夜。林晚在一条陌生的街道上醒来，手机没有信号，口袋里有半张电影票根。她不记得自己是谁。</textarea>
                <button id="generateBtn" class="btn-generate">
                    <span>生成分镜</span>
                    <div class="loading-spinner" style="display: none;"></div>
                </button>
            </div>
        </section>

        <section class="storyboard-section" id="storyboardSection">
            <h3 class="section-title">分镜结果</h3>
            <div class="storyboard-grid" id="storyboardGrid"></div>
        </section>

        <section class="style-panel-section">
            <h3 class="section-title">风格一致性</h3>
            <div class="style-panel">
                <div class="panel-grid">
                    <div>
                        <div class="style-item">
                            <span class="style-label">角色设定</span>
                            <div class="style-value">林晚 - 25岁女性，黑色短发，米色风衣</div>
                        </div>
                    </div>
                    <div>
                        <div class="style-item">
                            <span class="style-label">画面风格</span>
                            <div class="style-tags">
                                <span class="style-tag active">电影质感</span>
                                <span class="style-tag">赛博朋克</span>
                                <span class="style-tag">日系清新</span>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="style-item">
                            <span class="style-label">色调</span>
                            <div class="style-tags">
                                <span class="style-tag active">冷色调</span>
                                <span class="style-tag">暖色调</span>
                                <span class="style-tag active">高对比</span>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="style-item">
                            <span class="style-label">镜头语言</span>
                            <div class="style-value">浅景深为主，手持感</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="efficiency-section">
            <h3 class="section-title">效率对比</h3>
            <div class="efficiency-compare">
                <div class="process-column">
                    <div class="process-title traditional">传统流程</div>
                    <div class="process-steps">
                        <div class="process-step">
                            <span class="step-text">写剧本</span>
                            <span class="step-time">2h</span>
                        </div>
                        <div class="process-step">
                            <span class="step-text">拆分镜</span>
                            <span class="step-time">3h</span>
                        </div>
                        <div class="process-step">
                            <span class="step-text">写提示词</span>
                            <span class="step-time">4h</span>
                        </div>
                        <div class="process-step">
                            <span class="step-text">调试优化</span>
                            <span class="step-time">2h</span>
                        </div>
                    </div>
                    <div class="total-time traditional">总计：11小时</div>
                </div>

                <div class="efficiency-arrow">
                    <span class="arrow-icon">→</span>
                    <span class="efficiency-label">效率提升 5-10x</span>
                </div>

                <div class="process-column oneframe">
                    <div class="process-title oneframe">一帧故事</div>
                    <div class="process-steps">
                        <div class="process-step">
                            <span class="step-text">输入大纲</span>
                            <span class="step-time">5min</span>
                        </div>
                        <div class="process-step">
                            <span class="step-text">AI自动拆解</span>
                            <span class="step-time">30s</span>
                        </div>
                        <div class="process-step">
                            <span class="step-text">一键生成提示词</span>
                            <span class="step-time">1min</span>
                        </div>
                        <div class="process-step">
                            <span class="step-text">可视化调整</span>
                            <span class="step-time">40min</span>
                        </div>
                    </div>
                    <div class="total-time oneframe">总计：1.5小时</div>
                </div>
            </div>
        </section>

        <footer>
            <p>"让每个有故事可讲的人，都能把自己的故事看见"</p>
        </footer>
    </div>

    <div class="scroll-indicator"></div>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const storyInput = document.getElementById('storyInput');
        const storyboardSection = document.getElementById('storyboardSection');
        const storyboardGrid = document.getElementById('storyboardGrid');
        const spinner = generateBtn.querySelector('.loading-spinner');
        const btnText = generateBtn.querySelector('span');

        const storyboardData = [
            {
                shotNumber: 'Shot 01',
                shotType: '特写',
                description: '雨夜街头，一个年轻女人坐在地上，霓虹灯倒映在积水中。她缓缓睁开眼睛，眼神迷茫。',
                prompt: 'Extreme close-up of a young woman\'s face, eyes slowly opening with confusion, rain drops on skin, neon lights reflecting in her eyes, cinematic lighting, shallow depth of field, moody atmosphere, film grain, 24fps',
                duration: '3s',
                movement: '缓慢推镜'
            },
            {
                shotNumber: 'Shot 02',
                shotType: '中景',
                description: '林晚撑起身体，环顾四周。陌生的街道，湿漉漉的路面，远处有模糊的霓虹招牌。',
                prompt: 'Medium shot of a woman sitting up on a wet street, looking around confused, neon signs in background, rain falling, puddles reflecting city lights, cinematic composition, low angle, film noir style, shallow depth of field, 24fps',
                duration: '4s',
                movement: '固定'
            },
            {
                shotNumber: 'Shot 03',
                shotType: '特写',
                description: '她的手伸进风衣口袋，掏出半张电影票根。票根上的字迹模糊，但能看到日期：第七天。',
                prompt: 'Close-up of a woman\'s hand pulling a torn movie ticket stub from coat pocket, ticket stub in focus, rain drops on paper, cinematic macro shot, shallow depth of field, warm amber glow on ticket, film grain, 24fps',
                duration: '3s',
                movement: '缓慢推镜'
            },
            {
                shotNumber: 'Shot 04',
                shotType: '远景',
                description: '林晚站起身，望着空无一人的街道。手机屏幕亮起，显示"无信号"。远处传来模糊的警笛声。',
                prompt: 'Wide shot of a lone woman standing on an empty wet street at night, holding a phone showing no signal, distant police siren lights flashing, cinematic wide angle, moody atmosphere, city skyline in background, film grain, 24fps',
                duration: '5s',
                movement: '摇镜'
            },
            {
                shotNumber: 'Shot 05',
                shotType: '俯拍',
                description: '从上方俯瞰，林晚站在街道中央，像迷失在巨大棋盘上的棋子。雨水打湿了她的风衣。',
                prompt: 'Top down aerial shot of a woman standing alone in the middle of a wet street, surrounded by reflections, like a lost piece on a giant chessboard, rain creating patterns on pavement, cinematic bird\'s eye view, dramatic lighting, film grain, 24fps',
                duration: '4s',
                movement: '缓慢拉远'
            }
        ];

        function createStoryboardCard(data, index) {
            const card = document.createElement('div');
            card.className = 'storyboard-card fade-in';
            card.style.animationDelay = `${index * 0.1}s`;
            
            card.innerHTML = `
                <div class="card-header">
                    <span class="shot-number">${data.shotNumber}</span>
                    <span class="shot-type">${data.shotType}</span>
                </div>
                <div class="card-body">
                    <p class="shot-description">${data.description}</p>
                    <div class="prompt-box">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span class="prompt-label">AI视频提示词</span>
                            <button class="copy-btn" onclick="copyPrompt(this)">复制</button>
                        </div>
                        <p class="prompt-text">${data.prompt}</p>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="duration">
                        <span class="duration-icon">⏱</span>
                        <span>${data.duration}</span>
                    </div>
                    <div class="movement">
                        <span class="movement-icon">🎥</span>
                        <span>${data.movement}</span>
                    </div>
                </div>
            `;
            
            return card;
        }

        function copyPrompt(btn) {
            const promptText = btn.parentElement.nextElementSibling.textContent;
            navigator.clipboard.writeText(promptText).then(() => {
                btn.textContent = '已复制';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '复制';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        window.copyPrompt = copyPrompt;

        generateBtn.addEventListener('click', () => {
            if (generateBtn.disabled) return;

            generateBtn.disabled = true;
            btnText.textContent = '正在生成';
            spinner.style.display = 'block';

            setTimeout(() => {
                storyboardGrid.innerHTML = '';
                
                storyboardData.forEach((data, index) => {
                    const card = createStoryboardCard(data, index);
                    storyboardGrid.appendChild(card);
                });

                storyboardSection.style.display = 'block';
                
                generateBtn.disabled = false;
                btnText.textContent = '重新生成';
                spinner.style.display = 'none';

                storyboardSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 1500);
        });

        document.addEventListener('DOMContentLoaded', () => {
            const scrollIndicator = document.querySelector('.scroll-indicator');
            
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    scrollIndicator.style.opacity = '0';
                } else {
                    scrollIndicator.style.opacity = '1';
                }
            });
        });
    </script>
</body>
</html>
