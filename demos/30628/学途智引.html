<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>学途智引 · AI学习路径规划器 | 产品Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #F5F3FF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* 手机模拟框 */
        .phone-frame {
            width: 100%;
            max-width: 400px;
            height: 780px;
            background: #FFFFFF;
            border-radius: 44px;
            box-shadow: 0 30px 60px rgba(79, 70, 229, 0.25), 0 10px 24px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid rgba(139, 92, 246, 0.15);
        }

        /* 状态栏模拟 */
        .status-bar {
            background: #FFFFFF;
            padding: 14px 24px 8px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            color: #1E1B4B;
            flex-shrink: 0;
        }

        /* 主内容区域 */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: #FFFFFF;
            scroll-behavior: smooth;
        }

        /* 头部 */
        .app-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .app-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #4F46E5, #8B5CF6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        .app-title {
            font-size: 1.2rem;
            font-weight: 750;
            color: #1E1B4B;
            letter-spacing: -0.3px;
        }

        /* 目标输入卡片 */
        .input-card {
            background: #F8F7FC;
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #E8E5FF;
        }
        .input-label {
            font-size: 0.9rem;
            font-weight: 650;
            color: #3730A3;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .goal-input {
            width: 100%;
            border: 1.5px solid #DDD6FE;
            border-radius: 16px;
            padding: 14px 16px;
            font-size: 0.95rem;
            background: white;
            resize: vertical;
            font-family: inherit;
            color: #1E1B4B;
            transition: 0.2s;
            outline: none;
        }
        .goal-input:focus {
            border-color: #8B5CF6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }
        .goal-input::placeholder {
            color: #9CA3AF;
        }
        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #4F46E5, #8B5CF6);
            border: none;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            padding: 14px;
            border-radius: 16px;
            margin-top: 12px;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.4px;
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.3);
        }
        .generate-btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }
        .generate-btn:disabled {
            opacity: 0.6;
            transform: none;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        /* 快捷标签 */
        .quick-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .quick-tag {
            background: white;
            border: 1px solid #DDD6FE;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #4F46E5;
            cursor: pointer;
            transition: 0.2s;
        }
        .quick-tag:active {
            background: #EEF2FF;
            border-color: #8B5CF6;
        }

        /* 个性化设置区域 */
        .personalization-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed #DDD6FE;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .setting-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #3730A3;
            flex-shrink: 0;
        }
        .setting-select {
            flex: 1;
            margin-left: 12px;
            padding: 8px 12px;
            border: 1.5px solid #DDD6FE;
            border-radius: 12px;
            font-size: 0.85rem;
            background: white;
            color: #1E1B4B;
            outline: none;
            transition: 0.2s;
        }
        .setting-select:focus {
            border-color: #8B5CF6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        /* 加载动画 */
        .loading-box {
            background: #F8F7FC;
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            border: 1px solid #E8E5FF;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #DDD6FE;
            border-top: 3px solid #8B5CF6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 计划结果卡片 */
        .plan-card {
            background: #FFFFFF;
            border: 1px solid #E8E5FF;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.04);
        }
        .plan-title {
            font-weight: 750;
            font-size: 1.1rem;
            color: #1E1B4B;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .plan-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .plan-meta-item {
            background: #EEF2FF;
            color: #4F46E5;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
        }
        .phase-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .phase-item {
            background: #F8F7FC;
            border-radius: 16px;
            padding: 14px;
            border-left: 4px solid #8B5CF6;
            transition: 0.2s;
        }
        .phase-header {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            color: #3730A3;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }
        .phase-desc {
            font-size: 0.85rem;
            color: #4C4A6E;
            line-height: 1.5;
        }
        .task-list {
            margin-top: 8px;
            padding-left: 16px;
        }
        .task-item {
            font-size: 0.8rem;
            color: #6B7280;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .task-checkbox {
            width: 16px;
            height: 16px;
            border: 2px solid #DDD6FE;
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .task-checkbox.checked {
            background: #8B5CF6;
            border-color: #8B5CF6;
        }
        .task-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #9CA3AF;
        }
        .resource-badge {
            display: inline-block;
            background: #EEF2FF;
            color: #4F46E5;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            margin-top: 6px;
        }
        .progress-bar {
            height: 6px;
            background: #E8E5FF;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4F46E5, #8B5CF6);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .progress-text {
            font-size: 0.75rem;
            color: #6B7280;
            margin-top: 4px;
            text-align: right;
        }

        .empty-state {
            text-align: center;
            color: #9CA3AF;
            padding: 30px 10px;
            font-size: 0.9rem;
        }

        /* 底部导航模拟 */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 10px 16px 16px;
            border-top: 1px solid #F3F4F6;
            background: #FFFFFF;
            flex-shrink: 0;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            color: #9CA3AF;
            gap: 4px;
            cursor: pointer;
        }
        .nav-item.active {
            color: #4F46E5;
            font-weight: 600;
        }
        .nav-icon {
            font-size: 1.3rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>9:41</span>
            <span>📶 🔋 91%</span>
        </div>

        <!-- 主界面 -->
        <div class="app-content" id="appContent">
            <div class="app-header">
                <div class="app-logo">🧭</div>
                <span class="app-title">学途智引</span>
            </div>

            <!-- 输入区域 -->
            <div class="input-card">
                <div class="input-label">
                    <span>🎯 学习目标</span>
                </div>
                <textarea id="goalInput" class="goal-input" rows="2" placeholder="例如：三个月内达到Python初级数据分析师水平"></textarea>
                <div class="quick-tags" id="quickTags">
                    <span class="quick-tag">📊 数据分析</span>
                    <span class="quick-tag">💻 Python入门</span>
                    <span class="quick-tag">🌍 英语口语</span>
                    <span class="quick-tag">🎨 UI设计</span>
                </div>

                <!-- 个性化设置 -->
                <div class="personalization-section">
                    <div class="input-label" style="margin-top: 16px;">
                        <span>⚙️ 个性化设置</span>
                    </div>
                    <div class="setting-row">
                        <label class="setting-label">学习时长</label>
                        <select id="durationSelect" class="setting-select">
                            <option value="1">1个月</option>
                            <option value="3" selected>3个月</option>
                            <option value="6">6个月</option>
                            <option value="12">1年</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label class="setting-label">基础水平</label>
                        <select id="levelSelect" class="setting-select">
                            <option value="beginner">零基础入门</option>
                            <option value="intermediate" selected>有一定基础</option>
                            <option value="advanced">已有相关经验</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label class="setting-label">每周可用时间</label>
                        <select id="timeSelect" class="setting-select">
                            <option value="3">3-5小时</option>
                            <option value="7" selected>7-10小时</option>
                            <option value="15">15-20小时</option>
                            <option value="25">20+小时</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label class="setting-label">学习风格</label>
                        <select id="styleSelect" class="setting-select">
                            <option value="theory" selected>理论+实践并重</option>
                            <option value="practice">项目驱动学习</option>
                            <option value="video">视频教程为主</option>
                            <option value="reading">文档阅读为主</option>
                        </select>
                    </div>
                </div>

                <button id="generateBtn" class="generate-btn">✨ 生成专属学习计划</button>
            </div>

            <!-- 加载状态（默认隐藏） -->
            <div id="loadingBox" class="loading-box hidden">
                <div class="spinner"></div>
                <span style="color:#4C4A6E; font-weight:500;">AI正在分析你的目标，规划最优路径…</span>
            </div>

            <!-- 计划展示区域 -->
            <div id="planContainer">
                <div class="empty-state">
                    👆 输入学习目标，让AI为你规划专属路径
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span>首页</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">📋</span>
                <span>计划</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">📚</span>
                <span>资源</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">👤</span>
                <span>我的</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // DOM 元素
            const goalInput = document.getElementById('goalInput');
            const generateBtn = document.getElementById('generateBtn');
            const quickTags = document.getElementById('quickTags');
            const loadingBox = document.getElementById('loadingBox');
            const planContainer = document.getElementById('planContainer');
            const durationSelect = document.getElementById('durationSelect');
            const levelSelect = document.getElementById('levelSelect');
            const timeSelect = document.getElementById('timeSelect');
            const styleSelect = document.getElementById('styleSelect');

            // 当前计划数据
            let currentPlan = null;

            // 模拟学习计划数据（基于不同关键词和个性化设置）
            function generatePlan(goal, settings) {
                const goalLower = goal.toLowerCase();
                const { duration, level, time, style } = settings;

                // 根据学习时长调整阶段数量
                let phaseCount = Math.floor(duration * 4); // 每月约4个阶段
                if (phaseCount < 2) phaseCount = 2;
                if (phaseCount > 12) phaseCount = 12;

                // 根据每周可用时间调整学习强度
                let intensity = 'normal';
                if (time <= 5) intensity = 'light';
                else if (time >= 20) intensity = 'intensive';

                // 根据学习风格调整推荐资源类型
                let resourceType = 'balanced';
                if (style === 'video') resourceType = 'video';
                else if (style === 'reading') resourceType = 'reading';
                else if (style === 'practice') resourceType = 'practice';

                let planData = {
                    title: '📋 专属学习路径',
                    duration: duration + '个月',
                    intensity: intensity,
                    phases: []
                };

                // 根据目标关键词匹配不同计划
                if (goalLower.includes('数据') || goalLower.includes('分析') || goalLower.includes('python')) {
                    planData.title = '📊 Python数据分析师 · ' + duration + '个月路径';
                    planData.phases = generateDataAnalysisPhases(phaseCount, level, intensity, resourceType);
                } else if (goalLower.includes('英语') || goalLower.includes('口语') || goalLower.includes('语言')) {
                    planData.title = '🌍 英语口语流利说 · ' + duration + '个月路径';
                    planData.phases = generateEnglishPhases(phaseCount, level, intensity, resourceType);
                } else if (goalLower.includes('设计') || goalLower.includes('ui') || goalLower.includes('ux')) {
                    planData.title = '🎨 UI设计入门到求职 · ' + duration + '个月路径';
                    planData.phases = generateUIDesignPhases(phaseCount, level, intensity, resourceType);
                } else {
                    // 默认通用计划
                    planData.title = '🗺️ 个性化学习路径 · ' + duration + '个月';
                    planData.phases = generateGeneralPhases(phaseCount, level, intensity, resourceType);
                }

                return planData;
            }

            // 数据分析学习计划生成器
            function generateDataAnalysisPhases(phaseCount, level, intensity, resourceType) {
                const phases = [];
                const basePhases = [
                    {
                        title: 'Python基础与环境搭建',
                        desc: '安装Anaconda，学习Python基础语法、变量、数据类型、控制流。',
                        tasks: ['完成Python官方教程', '编写10个基础练习题', '搭建Jupyter Notebook环境']
                    },
                    {
                        title: '数据处理核心技能',
                        desc: '掌握NumPy数组操作、Pandas数据框处理、数据清洗技巧。',
                        tasks: ['完成3个数据清洗项目', '学习Pandas官方文档', '练习Kaggle Titanic数据集']
                    },
                    {
                        title: '数据可视化与统计',
                        desc: '学习Matplotlib/Seaborn绘图，掌握描述统计与基础推断统计。',
                        tasks: ['制作5种不同类型图表', '学习统计学基础概念', '完成统计练习题']
                    },
                    {
                        title: '实战项目与数据分析',
                        desc: '完整分析真实数据集，从数据获取到报告输出的全流程。',
                        tasks: ['完成电商数据分析项目', '学习SQL基础查询', '撰写数据分析报告']
                    },
                    {
                        title: '机器学习入门',
                        desc: '了解监督学习、非监督学习基础，掌握常用算法原理。',
                        tasks: ['学习Scikit-learn库', '实现3个基础ML算法', '完成ML项目实战']
                    },
                    {
                        title: '进阶与求职准备',
                        desc: '学习高级数据分析技巧，准备面试，整理作品集。',
                        tasks: ['刷LeetCode数据库题', '准备项目作品集', '模拟数据分析师面试']
                    }
                ];

                // 根据水平调整起始阶段
                let startIndex = 0;
                if (level === 'intermediate') startIndex = 1;
                if (level === 'advanced') startIndex = 2;

                // 根据强度调整任务数量
                const taskMultiplier = intensity === 'light' ? 0.7 : intensity === 'intensive' ? 1.5 : 1;

                // 生成对应数量的阶段
                for (let i = 0; i < phaseCount; i++) {
                    const phaseIndex = Math.min(startIndex + i, basePhases.length - 1);
                    const basePhase = basePhases[phaseIndex];

                    phases.push({
                        week: `第${i + 1}阶段`,
                        title: basePhase.title,
                        desc: basePhase.desc,
                        tasks: basePhase.tasks.slice(0, Math.ceil(basePhase.tasks.length * taskMultiplier)),
                        resource: getResourceRecommendation('data', i, resourceType),
                        progress: 0
                    });
                }

                return phases;
            }

            // 英语口语学习计划生成器
            function generateEnglishPhases(phaseCount, level, intensity, resourceType) {
                const phases = [];
                const basePhases = [
                    {
                        title: '发音与听力基础',
                        desc: '纠正发音，学习音标，提升听力理解能力。',
                        tasks: ['每天跟读VOA慢速英语', '学习48个国际音标', '完成听力练习30篇']
                    },
                    {
                        title: '日常对话突破',
                        desc: '掌握日常场景对话，提升口语流利度。',
                        tasks: ['模拟餐厅、购物等场景对话', '学习常用口语表达', '每天自言自语练习5分钟']
                    },
                    {
                        title: '表达深度扩展',
                        desc: '学习连接词、地道表达，能够描述复杂观点。',
                        tasks: ['学习高级连接词', '用英语描述个人经历', '观看英语演讲视频']
                    },
                    {
                        title: '流利度与自信训练',
                        desc: '通过影子跟读、实战对话提升口语自信。',
                        tasks: ['进行影子跟读训练', '找语伴每周对话3次', '录制自己说话并复盘']
                    },
                    {
                        title: '专业话题与演讲',
                        desc: '能够讨论专业话题，进行正式演讲。',
                        tasks: ['准备5分钟专业演讲', '学习行业英语词汇', '参加英语角或线上会议']
                    },
                    {
                        title: '持续进阶与文化交流',
                        desc: '达到接近母语者的表达水平，理解文化差异。',
                        tasks: ['阅读英文原版书籍', '观看无字幕英语电影', '与外国人深度交流']
                    }
                ];

                let startIndex = level === 'beginner' ? 0 : level === 'intermediate' ? 2 : 4;
                const taskMultiplier = intensity === 'light' ? 0.7 : intensity === 'intensive' ? 1.5 : 1;

                for (let i = 0; i < phaseCount; i++) {
                    const phaseIndex = Math.min(startIndex + i, basePhases.length - 1);
                    const basePhase = basePhases[phaseIndex];

                    phases.push({
                        week: `第${i + 1}阶段`,
                        title: basePhase.title,
                        desc: basePhase.desc,
                        tasks: basePhase.tasks.slice(0, Math.ceil(basePhase.tasks.length * taskMultiplier)),
                        resource: getResourceRecommendation('english', i, resourceType),
                        progress: 0
                    });
                }

                return phases;
            }

            // UI设计学习计划生成器
            function generateUIDesignPhases(phaseCount, level, intensity, resourceType) {
                const phases = [];
                const basePhases = [
                    {
                        title: '设计基础与工具入门',
                        desc: '学习设计原理、色彩理论，掌握Figma基础操作。',
                        tasks: ['学习设计四大原则', '完成Figma官方教程', '练习色彩搭配']
                    },
                    {

            // 渲染计划到界面
            function renderPlan(planData) {
                let html = `
                    <div class="plan-card">
                        <div class="plan-title">🧭 ${planData.title}</div>
                        <div class="plan-meta">
                            <span class="plan-meta-item">⏱️ ${planData.duration}</span>
                            <span class="plan-meta-item">📊 ${planData.intensity === 'light' ? '轻松模式' : planData.intensity === 'intensive' ? '强化模式' : '标准模式'}</span>
                        </div>
                        <div class="phase-list">
                `;

                planData.phases.forEach((phase, phaseIndex) => {
                    const completedTasks = phase.tasks.filter(task => task.completed).length;
                    const totalTasks = phase.tasks.length;
                    const progress = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

                    html += `
                        <div class="phase-item">
                            <div class="phase-header">
                                <span>📅 ${phase.week}</span>
                                <span>${phase.title}</span>
                            </div>
                            <div class="phase-desc">${phase.desc}</div>
                            <div class="task-list">
                    `;

                    phase.tasks.forEach((task, taskIndex) => {
                        const isCompleted = task.completed || false;
                        html += `
                            <div class="task-item ${isCompleted ? 'completed' : ''}" data-phase="${phaseIndex}" data-task="${taskIndex}">
                                <div class="task-checkbox ${isCompleted ? 'checked' : ''}" onclick="toggleTask(${phaseIndex}, ${taskIndex})"></div>
                                <span class="task-text">${typeof task === 'string' ? task : task.text}</span>
                            </div>
                        `;
                    });

                    html += `
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                            <div class="progress-text">${progress}% 完成</div>
                            <span class="resource-badge">📎 ${phase.resource}</span>
                        </div>
                    `;
                });

                html += `</div></div>`;
                planContainer.innerHTML = html;
            }

            // 切换任务完成状态
            window.toggleTask = function(phaseIndex, taskIndex) {
                if (currentPlan && currentPlan.phases[phaseIndex]) {
                    const task = currentPlan.phases[phaseIndex].tasks[taskIndex];
                    if (typeof task === 'string') {
                        currentPlan.phases[phaseIndex].tasks[taskIndex] = {
                            text: task,
                            completed: !currentPlan.phases[phaseIndex].tasks[taskIndex].completed
                        };
                    } else {
                        task.completed = !task.completed;
                    }
                    renderPlan(currentPlan);
                    savePlanToLocalStorage();
                }
            };

            // 保存计划到本地存储
            function savePlanToLocalStorage() {
                if (currentPlan) {
                    localStorage.setItem('studyPlan', JSON.stringify(currentPlan));
                }
            }

            // 从本地存储加载计划
            function loadPlanFromLocalStorage() {
                const savedPlan = localStorage.getItem('studyPlan');
                if (savedPlan) {
                    try {
                        currentPlan = JSON.parse(savedPlan);
                        renderPlan(currentPlan);
                        return true;
                    } catch (e) {
                        console.error('Failed to load saved plan:', e);
                        return false;
                    }
                }
                return false;
            }

            // 处理生成计划
            function handleGenerate() {
                const goal = goalInput.value.trim();
                if (!goal) {
                    alert('请先输入你的学习目标～');
                    return;
                }

                const settings = {
                    duration: parseInt(durationSelect.value),
                    level: levelSelect.value,
                    time: parseInt(timeSelect.value),
                    style: styleSelect.value
                };

                // 显示加载动画
                loadingBox.classList.remove('hidden');
                planContainer.innerHTML = ''; // 清空旧内容
                generateBtn.disabled = true;

                // 模拟AI生成延迟（1.5秒）
                setTimeout(() => {
                    currentPlan = generatePlan(goal, settings);
                    renderPlan(currentPlan);
                    savePlanToLocalStorage();
                    loadingBox.classList.add('hidden');
                    generateBtn.disabled = false;
                }, 1500);
            }

            // 事件绑定
            generateBtn.addEventListener('click', handleGenerate);

            // 回车键也可触发生成（Ctrl+Enter）
            goalInput.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    handleGenerate();
                }
            });

            // 快捷标签点击
            quickTags.addEventListener('click', function(e) {
                if (e.target.classList.contains('quick-tag')) {
                    const tagText = e.target.textContent;
                    goalInput.value = tagText;
                    goalInput.focus();
                }
            });

            // 页面加载时尝试恢复之前的计划
            window.addEventListener('load', function() {
                loadPlanFromLocalStorage();
            });
