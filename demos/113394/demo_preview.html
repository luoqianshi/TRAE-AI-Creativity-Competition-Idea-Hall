<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商产销协同管理系统 - 交互演示</title>
<style>
  :root {
    --primary: #409EFF;
    --success: #67C23A;
    --warning: #E6A23C;
    --danger: #F56C6C;
    --info: #909399;
    --bg: #f0f2f5;
    --card-bg: #fff;
    --text: #303133;
    --text-secondary: #606266;
    --text-muted: #909399;
    --border: #e4e7ed;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ===== 顶部导航 ===== */
  .top-nav {
    background: #fff; height: 56px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08); position: sticky; top: 0; z-index: 100;
  }
  .top-nav .logo { font-size: 18px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  .top-nav .logo-icon { width: 32px; height: 32px; background: var(--primary); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
  .top-nav .user-area { display: flex; align-items: center; gap: 16px; }
  .role-switcher { display: flex; gap: 4px; background: var(--bg); border-radius: 6px; padding: 3px; }
  .role-btn {
    padding: 6px 14px; border: none; border-radius: 4px; font-size: 13px; cursor: pointer;
    background: transparent; color: var(--text-secondary); transition: all .2s; white-space: nowrap;
  }
  .role-btn:hover { background: #fff; }
  .role-btn.active { background: #fff; color: var(--primary); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }

  /* ===== 主布局 ===== */
  .main-layout { display: flex; min-height: calc(100vh - 56px); }
  .sidebar {
    width: 220px; background: #fff; padding: 12px 0; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto;
  }
  .sidebar-item {
    padding: 12px 24px; cursor: pointer; font-size: 14px; color: var(--text-secondary);
    display: flex; align-items: center; gap: 10px; transition: all .2s; border-left: 3px solid transparent;
  }
  .sidebar-item:hover { background: #f5f7fa; color: var(--primary); }
  .sidebar-item.active { background: #ecf5ff; color: var(--primary); border-left-color: var(--primary); font-weight: 600; }
  .sidebar-icon { width: 20px; text-align: center; font-size: 16px; }
  .content-area { flex: 1; padding: 24px; overflow-y: auto; }

  /* ===== 卡片 ===== */
  .card { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .card-title { font-size: 16px; font-weight: 600; }
  .card-title::before { content: ''; display: inline-block; width: 4px; height: 16px; background: var(--primary); border-radius: 2px; margin-right: 10px; vertical-align: -2px; }

  /* ===== 按钮 ===== */
  .btn {
    padding: 8px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer;
    transition: all .2s; display: inline-flex; align-items: center; gap: 6px; font-family: inherit;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: #66b1ff; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { background: #85ce61; }
  .btn-text { background: none; color: var(--primary); padding: 4px 8px; }
  .btn-text:hover { background: #ecf5ff; }
  .btn-danger-text { background: none; color: var(--danger); padding: 4px 8px; }
  .btn-danger-text:hover { background: #fef0f0; }

  /* ===== 表单 ===== */
  .filter-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .form-select, .form-input {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
    background: #fff; color: var(--text); font-family: inherit; outline: none; transition: border-color .2s;
  }
  .form-select:focus, .form-input:focus { border-color: var(--primary); }
  .form-select { min-width: 140px; appearance: auto; cursor: pointer; }
  .form-input { min-width: 200px; }

  /* ===== 表格 ===== */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { background: #fafafa; padding: 12px 16px; text-align: left; font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
  tr:hover td { background: #fafafa; }

  /* ===== 标签 ===== */
  .tag {
    display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 12px; font-weight: 500;
  }
  .tag-warning { background: #fdf6ec; color: #e6a23c; border: 1px solid #faecd8; }
  .tag-success { background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; }
  .tag-info { background: #f4f4f5; color: #909399; border: 1px solid #e9e9eb; }

  /* ===== 分页 ===== */
  .pagination { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 16px; font-size: 14px; color: var(--text-secondary); }
  .page-btn {
    width: 32px; height: 32px; border: 1px solid var(--border); background: #fff; border-radius: 4px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; font-family: inherit;
  }
  .page-btn:hover { color: var(--primary); border-color: var(--primary); }
  .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* ===== 弹窗 ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200;
    display: flex; align-items: center; justify-content: center; animation: fadeIn .2s;
  }
  .dialog {
    background: #fff; border-radius: 12px; width: 900px; max-height: 85vh; overflow-y: auto;
    box-shadow: 0 12px 48px rgba(0,0,0,.15); animation: slideUp .25s;
  }
  .dialog-header {
    display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 0;
    position: sticky; top: 0; background: #fff; z-index: 1;
  }
  .dialog-header h3 { font-size: 18px; }
  .dialog-body { padding: 24px; }
  .close-btn { width: 32px; height: 32px; border: none; background: none; font-size: 20px; cursor: pointer; color: var(--text-muted); border-radius: 4px; display: flex; align-items: center; justify-content: center; }
  .close-btn:hover { background: #f5f5f5; color: var(--text); }

  /* ===== 统计卡片 ===== */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
  .stat-card { background: #fff; border-radius: 8px; padding: 20px 24px; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
  .stat-card .stat-label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
  .stat-card .stat-value { font-size: 28px; font-weight: 700; }
  .stat-card .stat-value.blue { color: var(--primary); }
  .stat-card .stat-value.green { color: var(--success); }
  .stat-card .stat-value.orange { color: var(--warning); }
  .stat-card .stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* ===== 订单详情 ===== */
  .detail-grid { display: flex; gap: 24px; margin-bottom: 20px; }
  .detail-left { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .detail-row { display: flex; margin-bottom: 14px; line-height: 1.7; }
  .detail-row:last-child { margin-bottom: 0; }
  .detail-label { width: 90px; color: var(--text-muted); font-weight: 500; flex-shrink: 0; }
  .detail-value { color: var(--text); word-break: break-all; font-weight: 500; }
  .detail-right { width: 180px; flex-shrink: 0; }
  .qr-card { border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; }
  .qr-placeholder { width: 130px; height: 130px; margin: 0 auto 10px; background: repeating-conic-gradient(#409EFF 0% 25%, #fff 0% 50%) 50% / 20px 20px; border-radius: 4px; }
  .image-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 16px; background: #fafafa; border-radius: 8px 8px 0 0; }
  .image-tab {
    padding: 12px 24px; font-size: 14px; cursor: pointer; border: none; background: none;
    color: var(--text-secondary); font-family: inherit; transition: all .2s;
  }
  .image-tab:hover { color: var(--primary); }
  .image-tab.active { color: var(--primary); font-weight: 600; border-bottom: 2px solid var(--primary); }
  .image-preview { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px; border: 1px solid var(--border); border-radius: 0 0 8px 8px; min-height: 140px; align-items: center; }
  .img-thumb { width: 120px; height: 120px; border-radius: 4px; border: 1px solid #eee; object-fit: cover; }
  .img-placeholder { width: 120px; height: 120px; border-radius: 4px; border: 1px dashed #ddd; display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 32px; }

  /* ===== 图表区域 ===== */
  .chart-placeholder {
    width: 100%; height: 200px; background: linear-gradient(135deg, #667eea22 0%, #764ba222 100%);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: var(--text-muted); flex-direction: column; gap: 8px;
  }
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .bar-label { width: 80px; text-align: right; font-size: 13px; color: var(--text-secondary); flex-shrink: 0; }
  .bar-track { flex: 1; height: 24px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width .6s ease; }
  .bar-value { width: 80px; font-size: 13px; color: var(--text-secondary); font-weight: 600; }

  /* ===== 通知提示 ===== */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px;
    border-radius: 8px; font-size: 14px; z-index: 999; animation: fadeIn .3s;
    box-shadow: 0 4px 16px rgba(0,0,0,.15); pointer-events: none;
  }
  .toast.success { background: #f0f9eb; color: #67c23a; }
  .toast.error { background: #fef0f0; color: #f56c6c; }

  /* ===== 动画 ===== */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== 响应式 ===== */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .detail-grid { flex-direction: column; }
    .detail-right { width: 100%; }
    .dialog { width: 95%; }
    .role-switcher { flex-wrap: wrap; }
  }

  .print-btn { margin-left: auto; }
  .header-actions { display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<nav class="top-nav" id="topNav">
  <div class="logo">
    <div class="logo-icon">📦</div>
    电商产销协同管理系统
  </div>
  <div class="role-switcher" id="roleSwitcher">
    <button class="role-btn active" data-role="boss" onclick="switchRole('boss')">👑 老板端</button>
    <button class="role-btn" data-role="sales" onclick="switchRole('sales')">💼 销售端</button>
    <button class="role-btn" data-role="factory" onclick="switchRole('factory')">🏭 工厂端</button>
    <button class="role-btn" data-role="shipping" onclick="switchRole('shipping')">🚚 发货端</button>
  </div>
  <div class="user-area">
    <div class="avatar" id="roleAvatar">👑</div>
    <span id="roleName" style="font-size:14px;font-weight:500;">系统管理员</span>
  </div>
</nav>

<!-- ===== 主布局 ===== -->
<div class="main-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-item active" data-page="orders" onclick="switchPage('orders')">
      <span class="sidebar-icon">📋</span> 订单管理
    </div>
    <div class="sidebar-item" data-page="dashboard" onclick="switchPage('dashboard')">
      <span class="sidebar-icon">📊</span> 智慧大屏
    </div>
    <div class="sidebar-item" data-page="finance" onclick="switchPage('finance')">
      <span class="sidebar-icon">💰</span> 财务结算
    </div>
    <div class="sidebar-item" data-page="shops" onclick="switchPage('shops')">
      <span class="sidebar-icon">🏪</span> 网店管理
    </div>
    <div class="sidebar-item" data-page="products" onclick="switchPage('products')">
      <span class="sidebar-icon">📦</span> 商品管理
    </div>
  </aside>

  <main class="content-area" id="contentArea">
    <!-- 动态渲染 -->
  </main>
</div>

<!-- ===== Toast 通知 ===== -->
<div id="toastContainer"></div>

<script>
// ==================== 数据层 ====================
const ALL_ORDERS = [
  { order_id: 'zhangsan20260709淘宝XX旗舰店894201', platform_order_no: 'TB20260709001', shop_id: '淘宝XX旗舰店', product_name: '夏季新款连衣裙', sales_amount: '199.00', commission_amount: '9.95', shipping_status: 'pending', logistics_company: '', logistics_no: '', receiver_address: '张三 13800138000 北京市朝阳区望京街道XX小区1号楼', remark: '优先发货，易碎品', creator_real_name: '张三', created_at: '2026-07-09', order_days: 2 },
  { order_id: 'zhangsan20260708京东自营店334178', platform_order_no: 'JD20260708015', shop_id: '京东自营店', product_name: '男士商务衬衫', sales_amount: '259.00', commission_amount: '12.95', shipping_status: 'shipped', logistics_company: '顺丰速运', logistics_no: 'SF1234567890', receiver_address: '张三 13800138000 上海市浦东新区陆家嘴环路1000号', remark: '', creator_real_name: '张三', created_at: '2026-07-08', order_days: 3 },
  { order_id: 'zhangsan20260705拼多多店527631', platform_order_no: 'PDD20260705003', shop_id: '拼多多店', product_name: '纯棉T恤', sales_amount: '49.90', commission_amount: '2.50', shipping_status: 'virtual', logistics_company: '', logistics_no: '', receiver_address: '张三 13800138000 广州市天河区体育西路123号', remark: '虚拟发货', creator_real_name: '张三', created_at: '2026-07-05', order_days: 6 },
  { order_id: 'lisi20260710抖音店682594', platform_order_no: 'DY20260710008', shop_id: '抖音店', product_name: '运动跑鞋', sales_amount: '399.00', commission_amount: '19.95', shipping_status: 'pending', logistics_company: '', logistics_no: '', receiver_address: '李四 13900139000 深圳市南山区科技园路88号', remark: '尽快发货', creator_real_name: '李四', created_at: '2026-07-10', order_days: 1 },
  { order_id: 'lisi20260706淘宝XX旗舰店145983', platform_order_no: 'TB20260706022', shop_id: '淘宝XX旗舰店', product_name: '防晒帽', sales_amount: '79.00', commission_amount: '3.95', shipping_status: 'shipped', logistics_company: '中通快递', logistics_no: 'ZTO9876543210', receiver_address: '李四 13900139000 成都市武侯区天府大道666号', remark: '', creator_real_name: '李四', created_at: '2026-07-06', order_days: 5 },
  { order_id: 'wangwu20260711快手店730149', platform_order_no: 'KS20260711005', shop_id: '快手店', product_name: '蓝牙耳机', sales_amount: '129.00', commission_amount: '6.45', shipping_status: 'pending', logistics_company: '', logistics_no: '', receiver_address: '王五 13700137000 杭州市西湖区文三路258号', remark: '发顺丰', creator_real_name: '王五', created_at: '2026-07-11', order_days: 0 },
  { order_id: 'wangwu20260703京东自营店482176', platform_order_no: 'JD20260703009', shop_id: '京东自营店', product_name: '智能手表', sales_amount: '599.00', commission_amount: '29.95', shipping_status: 'shipped', logistics_company: '京东物流', logistics_no: 'JDWL0011223344', receiver_address: '王五 13700137000 南京市玄武区中山路100号', remark: '', creator_real_name: '王五', created_at: '2026-07-03', order_days: 8 },
];

const SHOPS = ['淘宝XX旗舰店', '京东自营店', '拼多多店', '抖音店', '快手店'];
const LOGISTICS = ['顺丰速运', '中通快递', '圆通速递', '京东物流', '韵达快递'];

let currentRole = 'boss';
let currentPage = 'orders';
let selectedOrder = null;
let viewOrderData = null;
let imageTab = 'sales';

// ==================== 角色切换 ====================
function switchRole(role) {
  currentRole = role;
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-role="${role}"]`).classList.add('active');

  const roleMap = { boss: { icon: '👑', name: '系统管理员' }, sales: { icon: '💼', name: '张三' }, factory: { icon: '🏭', name: '工厂管理员' }, shipping: { icon: '🚚', name: '发货员' } };
  document.getElementById('roleAvatar').textContent = roleMap[role].icon;
  document.getElementById('roleName').textContent = roleMap[role].name;

  showToast('已切换为 ' + roleMap[role].name + ' 视角', 'success');
  render();
}

// ==================== 页面切换 ====================
function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
  document.querySelector(`[data-page="${page}"]`).classList.add('active');
  render();
}

// ==================== Toast ====================
function showToast(msg, type) {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

// ==================== 获取过滤后的订单 ====================
function getFilteredOrders() {
  let orders = [...ALL_ORDERS];
  if (currentRole === 'sales') orders = orders.filter(o => o.creator_real_name === '张三');
  if (currentRole === 'shipping') orders = orders.filter(o => o.shipping_status !== 'pending' || o.creator_real_name === '张三');
  return orders;
}

// ==================== 渲染主函数 ====================
function render() {
  const area = document.getElementById('contentArea');
  switch (currentPage) {
    case 'orders': area.innerHTML = renderOrders(); break;
    case 'dashboard': area.innerHTML = renderDashboard(); break;
    case 'finance': area.innerHTML = renderFinance(); break;
    case 'shops': area.innerHTML = renderShops(); break;
    case 'products': area.innerHTML = renderProducts(); break;
  }
  bindEvents();
}

// ==================== 订单列表页 ====================
function renderOrders() {
  const orders = getFilteredOrders();
  const hideAmount = currentRole === 'factory' || currentRole === 'shipping';

  function getStatusTag(s) {
    const map = { pending: ['待发货', 'tag-warning'], shipped: ['已发货', 'tag-success'], virtual: ['虚拟发货', 'tag-info'] };
    const [text, cls] = map[s] || ['未知', ''];
    return `<span class="tag ${cls}">${text}</span>`;
  }

  const headCols = ['追溯码', '平台订单号', '网店', '商品名称'];
  if (!hideAmount) { headCols.push('销售金额', '提成金额'); }
  headCols.push('状态', '下单时间', '已下单', '创建人');

  let ths = headCols.map(h => `<th>${h}</th>`).join('');
  if (currentRole !== 'factory' || currentRole === 'boss') ths += '<th style="width:180px">操作</th>';

  let rows = orders.map(o => {
    let tds = `<td style="font-family:monospace;font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${o.order_id}">${o.order_id}</td>
      <td><b>${o.platform_order_no}</b></td>
      <td>${o.shop_id}</td>
      <td>${o.product_name}</td>`;
    if (!hideAmount) tds += `<td>¥${o.sales_amount}</td><td style="color:var(--warning);font-weight:600;">¥${o.commission_amount}</td>`;
    tds += `<td>${getStatusTag(o.shipping_status)}</td>
      <td>${o.created_at}</td>
      <td style="font-weight:600;color:${o.order_days >= 14 ? 'var(--danger)' : o.order_days >= 7 ? 'var(--warning)' : 'var(--text)'}">${o.order_days}天</td>
      <td>${o.creator_real_name}</td>`;

    const actions = [];
    actions.push(`<button class="btn btn-text" onclick="openDetail('${o.order_id}')">查看</button>`);
    if (currentRole === 'boss' || currentRole === 'sales') {
      actions.push(`<button class="btn btn-text" onclick="showToast('编辑功能演示', 'success')">编辑</button>`);
    }
    if (currentRole === 'factory') {
      actions.push(`<button class="btn btn-text" onclick="showToast('二维码打印演示', 'success')">打印</button>`);
    }
    if (currentRole === 'sales') {
      actions.push(`<button class="btn btn-danger-text" onclick="showToast('删除需密码验证', 'error')">删除</button>`);
    }
    if (actions.length) tds += `<td>${actions.join('')}</td>`;
    return `<tr>${tds}</tr>`;
  }).join('');

  const newBtn = (currentRole === 'boss' || currentRole === 'sales') ? '<button class="btn btn-primary" onclick="showToast(\'新建订单\', \'success\')">+ 新建订单</button>' : '';

  return `
    <div class="card">
      <div class="card-header">

// ==================== 订单详情弹窗 ====================
function openDetail(orderId) {
  viewOrderData = ALL_ORDERS.find(o => o.order_id === orderId);
  if (!viewOrderData) return;
  imageTab = 'sales';

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'detailOverlay';
  overlay.innerHTML = renderDetail();
  overlay.addEventListener('click', function(e) { if (e.target === this) closeDetail(); });
  document.body.appendChild(overlay);
  window.detailOverlay = overlay;
}

function closeDetail() {
  const el = document.getElementById('detailOverlay');
  if (el) el.remove();
  viewOrderData = null;
}

function switchImageTab(tab) {
  imageTab = tab;
  const overlay = document.getElementById('detailOverlay');
  if (overlay) {
    overlay.querySelector('.image-tabs').outerHTML = renderImageTabs();
    overlay.querySelector('.image-preview').outerHTML = renderImagePreview();
    bindImageTabEvents(overlay);
  }
}

function renderImageTabs() {
  const tabs = ['sales', 'factory', 'shipping'];
  const labels = ['销售图片', '工厂端图片', '发货端图片'];
  return `<div class="image-tabs">${tabs.map((t, i) =>
    `<button class="image-tab ${imageTab === t ? 'active' : ''}" data-tab="${t}">${labels[i]}</button>`
  ).join('')}</div>`;
}

function renderImagePreview() {
  const images = {
    sales: ['https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=clothing+product+photo+on+white+background+studio+lighting&image_size=square', 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=fashion+product+photo+flat+lay+style&image_size=square'],
    factory: ['https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=factory+production+line+quality+control&image_size=square'],
    shipping: ['https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=package+shipping+label+box+delivery&image_size=square'],
  };
  const urls = images[imageTab] || [];
  if (urls.length === 0) return '<div class="image-preview"><span style="color:var(--text-muted);padding:40px;">暂无图片</span></div>';
  return `<div class="image-preview">${urls.map(u => `<img src="${u}" class="img-thumb" alt="商品图片" loading="lazy">`).join('')}
    ${urls.length > 3 ? `<div class="img-placeholder" style="cursor:pointer">+${urls.length - 3}</div>` : ''}
  </div>`;
}

function renderDetail() {
  const o = viewOrderData;
  if (!o) return '';
  const getStatusTag = (s) => {
    const map = { pending: ['待发货', 'tag-warning'], shipped: ['已发货', 'tag-success'], virtual: ['虚拟发货', 'tag-info'] };
    const [text, cls] = map[s] || ['未知', ''];
    return `<span class="tag ${cls}">${text}</span>`;
  };

  return `
    <div class="dialog" onclick="event.stopPropagation()">
      <div class="dialog-header">
        <button class="close-btn" onclick="closeDetail()">&larr; 返回</button>
        <h3>订单详情</h3>
        <div class="header-actions">
          <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();handlePrint()" style="padding:6px 14px;font-size:13px;">打印</button>
        </div>
      </div>
      <div class="dialog-body">
        <div class="detail-grid">
          <div class="detail-left">
            <div class="detail-row"><span class="detail-label">平台订单号：</span><span class="detail-value">${o.platform_order_no}</span></div>
            <div class="detail-row"><span class="detail-label">网店：</span><span class="detail-value">${o.shop_id}</span></div>
            <div class="detail-row"><span class="detail-label">商品名称：</span><span class="detail-value">${o.product_name}</span></div>
            <div class="detail-row"><span class="detail-label">销售金额：</span><span class="detail-value">¥${o.sales_amount}</span></div>
            <div class="detail-row"><span class="detail-label">下单时间：</span><span class="detail-value">${o.created_at}</span></div>
            <div class="detail-row"><span class="detail-label">创建人：</span><span class="detail-value">${o.creator_real_name}</span></div>
            <div class="detail-row"><span class="detail-label">收货地址：</span><span class="detail-value">${o.receiver_address}</span></div>
            <div class="detail-row"><span class="detail-label">物流公司：</span><span class="detail-value">${o.logistics_company || '——'}</span></div>
            <div class="detail-row"><span class="detail-label">物流单号：</span><span class="detail-value">${o.logistics_no || '——'}</span></div>
            <div class="detail-row"><span class="detail-label">备注：</span><span class="detail-value">${o.remark || '——'}</span></div>
          </div>
          <div class="detail-right">
            <div class="qr-card">
              <div class="qr-placeholder" title="订单二维码"></div>
              <div style="padding-top:10px;border-top:1px dashed #eee;">
                <span style="font-size:12px;color:var(--text-muted);">发货状态：</span>
                ${getStatusTag(o.shipping_status)}
              </div>
            </div>
          </div>
        </div>
        ${renderImageTabs()}
        ${renderImagePreview()}
      </div>
    </div>`;
}

function bindImageTabEvents(el) {
  el.querySelectorAll('.image-tab').forEach(btn => {
    btn.addEventListener('click', function() { switchImageTab(this.dataset.tab); });
  });
}

function handlePrint() {
  const o = viewOrderData;
  if (!o) return;
  const printContent = `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>商品单据打印</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-size:14px;font-family:"SimSun","Microsoft Yahei",sans-serif;background:#eee;padding:20px;}
  .btn-print{padding:8px 20px;font-size:16px;margin-bottom:15px;cursor:pointer;}
  .a4-sheet{width:210mm;min-height:297mm;background:#fff;padding:12mm;margin:0 auto;position:relative;}
  .header-wrap{display:flex;justify-content:space-between;margin-bottom:15mm;}
  .info-left p{line-height:24px;}
  .qrcode-box{width:45mm;height:45mm;border:1px solid #333;display:flex;align-items:center;justify-content:center;}
  .goods-img-box{width:100%;height:200mm;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:22px;}
  @media print{
    @page{size:A4 portrait;margin:12mm;}
    html,body{background:#fff;}
    .btn-print{display:none!important;}
    .a4-sheet{width:100%;height:100%;padding:0;margin:0;}
    .a4-sheet,.header-wrap,.goods-img-box{page-break-inside:avoid;}
  }
</style></head><body>
<button class="btn-print" onclick="window.print()">点击打印单据</button>
<div class="a4-sheet">
  <div class="header-wrap">
    <div class="info-left">
      <p>商品名称：${o.product_name}</p>
      <p>平台：${o.shop_id}</p>
      <p>订单号：${o.platform_order_no}</p>
      <p>下单时间：${o.created_at}</p>
      <p>创建人：${o.creator_real_name}</p>
      <p>收货地址：${o.receiver_address}</p>
      <p style="margin-top:12px;">备注：${o.remark || '____________________'}</p>
    </div>
    <div class="qrcode-box">二维码</div>
  </div>
  <div class="goods-img-box">商品图片（上传第一张商品图）</div>
</div>
</body></html>`;
  const pw = window.open('', '_blank', 'width=900,height=700');
  if (!pw) { showToast('打印窗口被拦截，请允许弹出窗口', 'error'); return; }
  pw.document.write(printContent);
  pw.document.close();
}
