<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#efeee9">
  <meta name="description" content="白日梦：从有依据的人物生活细节中，辨认自己的选择。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>白日梦 Daydream｜从细节里辨认自己</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script defer src="assets/data.js"></script>
  <script defer src="assets/app.js"></script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header id="siteHeader"></header>
  <main id="main" class="page-main">
    <section class="reveal-hero" id="revealHero" aria-label="人物艺术图像揭示体验">
      <div class="reveal-art" id="revealArt"></div>
      <div class="reveal-cover" id="revealCover"></div>
      <div class="cursor-hint" id="cursorHint">移动以显现局部</div>
      <div class="container reveal-content">
        <div class="hero-line">
          <h1 class="hero-title">从一个人的<br><span>细节开始</span></h1>
          <div>
            <p class="hero-copy" id="homePersonalLine">文献记录衣着、饮食、器物、工作与选择。你不必先回答自己是谁，只需要进入、感受、收藏或拒绝。</p>
            <div class="hero-actions">
              <a class="button button-primary" id="heroPersonLink" href="explore.html">进入人物档案 →</a>
              <a class="button" href="preferences.html">设置观看偏好</a>
            </div>
          </div>
        </div>
        <div class="hero-bottom">
          <div class="hero-index" id="heroIndex"></div>
          <div class="hero-art-credit" id="heroCredit"></div>
          <div class="hero-person-switcher" id="homePeople" aria-label="切换人物"></div>
        </div>
      </div>
    </section>
    <section class="manifesto">
      <div class="container manifesto-grid">
        <div><p class="kicker">DAYDREAM / 文献驱动体验</p><span class="display-number">01</span></div>
        <div>
          <p class="manifesto-quote">不先总结一个人的精神。让衣食、器物、习惯与真实选择自己说话。</p>
          <p class="section-copy" style="margin-top:24px">人物自述、历史记载、时代材料、后世传颂和体验组织分别标记。材料不足的部分保留空白。</p>
        </div>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="section-head"><h2 class="section-title">一次体验如何留下身份证据</h2><p class="section-copy">定位不是一次测验结果，而是你在不同人物生活中反复留下的选择。</p></div>
        <div class="flow-line">
          <div class="flow-step"><b>01</b><span>读取文献记录</span></div>
          <div class="flow-step"><b>02</b><span>拆解人物细节</span></div>
          <div class="flow-step"><b>03</b><span>进入互动体验</span></div>
          <div class="flow-step"><b>04</b><span>收藏、存疑或拒绝</span></div>
          <div class="flow-step"><b>05</b><span>写入扮演档案</span></div>
          <div class="flow-step"><b>06</b><span>形成可回溯定位</span></div>
        </div>
      </div>
    </section>
  </main>
  <footer id="siteFooter"></footer>
</body>
</html>
