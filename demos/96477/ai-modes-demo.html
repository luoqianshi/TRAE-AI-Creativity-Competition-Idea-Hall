<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI情绪智能模式控制</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 1100px;
            width: 100%;
            height: calc(100vh - 60px);
            display: flex;
            gap: 25px;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 300px;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 300px;
        }

        .ai-display {
            text-align: center;
            margin-bottom: 20px;
        }

        .ai-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 60px;
            transition: all 0.5s ease;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.4);
        }

        .ai-icon:hover {
            transform: scale(1.05);
        }

        .ai-description {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            margin-top: 8px;
            min-height: 20px;
            transition: all 0.3s ease;
        }

        .chat-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 10px;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .chat-message {
            display: flex;
            align-items: flex-start;
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        .chat-message:last-child {
            margin-bottom: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            margin-right: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .chat-bubble {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 16px;
            max-width: 85%;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            line-height: 1.6;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chat-bubble strong {
            display: block;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            padding-left: 52px;
            margin-bottom: 16px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            margin-right: 4px;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-5px); opacity: 1; }
        }

        .ai-name {
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .ai-status {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .current-mode {
            margin-top: 15px;
            padding: 12px 24px;
            background: rgba(34, 197, 94, 0.2);
            border-radius: 30px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .current-mode span {
            color: #22c55e;
            font-weight: 600;
            font-size: 16px;
        }

        .mode-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .mode-btn {
            padding: 16px 14px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02));
            color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 6px 15px rgba(0, 0, 0, 0.3),
                0 2px 4px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .mode-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        .mode-btn:hover {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.05));
            transform: translateY(-4px);
            box-shadow: 
                0 12px 25px rgba(0, 0, 0, 0.4),
                0 4px 8px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .mode-btn:active {
            transform: translateY(-1px);
            box-shadow: 
                0 3px 10px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .mode-btn.active {
            background: linear-gradient(145deg, #22c55e 0%, #16a34a 100%);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 
                0 8px 25px rgba(34, 197, 94, 0.4),
                0 4px 10px rgba(34, 197, 94, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
        }

        .mode-btn.active:hover {
            background: linear-gradient(145deg, #22c55e 0%, #15803d 100%);
            transform: translateY(-5px);
            box-shadow: 
                0 14px 30px rgba(34, 197, 94, 0.5),
                0 6px 12px rgba(34, 197, 94, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .mode-btn.active:active {
            transform: translateY(-1px);
            box-shadow: 
                0 4px 15px rgba(34, 197, 94, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .mode-btn span {
            display: block;
            font-size: 12px;
            font-weight: 400;
            opacity: 0.7;
            margin-top: 4px;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 30px rgba(102, 126, 234, 0.4);
            }
            50% {
                box-shadow: 0 0 50px rgba(102, 126, 234, 0.6);
            }
        }

        .ai-icon {
            animation: pulse 3s ease-in-out infinite;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }

        @media (max-width: 800px) {
            .container {
                flex-direction: column;
                height: auto;
                max-height: 100vh;
                overflow-y: auto;
            }

            .left-panel,
            .right-panel {
                min-width: 100%;
            }

            .mode-buttons {
                grid-template-columns: repeat(2, 1fr);
            }

            .chat-container {
                max-height: 300px;
            }
        }

        @media (max-width: 480px) {
            .mode-buttons {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

            .ai-icon {
                width: 100px;
                height: 100px;
                font-size: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="ai-display">
                <div class="ai-icon" id="aiIcon">🤖</div>
                <div class="ai-name">AI 情绪智能</div>
                <div class="ai-status">点击下方按钮切换模式</div>
                <div class="ai-description" id="aiDescription"></div>
                <div class="current-mode" id="currentMode">
                    <span>当前模式：无</span>
                </div>
            </div>

            <div class="mode-buttons">
                <button class="mode-btn" data-mode="理智" data-emoji="🧠">
                    理智
                    <span>理性思考，逻辑分析</span>
                </button>
                <button class="mode-btn" data-mode="平静" data-emoji="😌">
                    平静
                    <span>温和沉稳，心如止水</span>
                </button>
                <button class="mode-btn" data-mode="洒脱" data-emoji="🌬️">
                    洒脱
                    <span>随性自由，不拘小节</span>
                </button>
                <button class="mode-btn" data-mode="狂暴" data-emoji="💥">
                    狂暴
                    <span>力量爆发，势不可挡</span>
                </button>
                <button class="mode-btn" data-mode="愤怒" data-emoji="😤">
                    愤怒
                    <span>怒火中烧，激情澎湃</span>
                </button>
                <button class="mode-btn" data-mode="乐观" data-emoji="😊">
                    乐观
                    <span>积极向上，充满希望</span>
                </button>
                <button class="mode-btn" data-mode="悲观" data-emoji="😔">
                    悲观
                    <span>谨慎思考，防患未然</span>
                </button>
                <button class="mode-btn" data-mode="好奇" data-emoji="🤔">
                    好奇
                    <span>探索未知，求知若渴</span>
                </button>
            </div>
        </div>

        <div class="right-panel">
            <div class="ai-name" style="text-align: left; margin-bottom: 5px;">对话</div>
            <div class="chat-container" id="chatContainer">
                <div class="chat-message">
                    <div class="chat-avatar">🤖</div>
                    <div class="chat-bubble">
                        <strong>AI情绪智能</strong>
                        你好！我是一个多模式AI情绪智能。点击上方按钮切换我的情绪模式，我会以不同的风格向你介绍自己。
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        AI情绪智能模式控制器 v1.0
    </div>

    <script>
        const buttons = document.querySelectorAll('.mode-btn');
        const currentMode = document.getElementById('currentMode');
        const aiIcon = document.getElementById('aiIcon');
        const aiDescription = document.getElementById('aiDescription');
        const chatContainer = document.getElementById('chatContainer');

        const modeConfigs = {
            '理智': {
                gradient: 'linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%)',
                glow: 'rgba(59, 130, 246, 0.5)',
                description: '正在进行深度逻辑分析，保持理性思维...',
                intro: '您好，我是一个追求逻辑与理性的AI情绪智能。基于数据分析和严谨推理，我能够为您提供客观、准确的决策支持。每一个结论都经过严密的论证和验证。'
            },
            '平静': {
                gradient: 'linear-gradient(135deg, #6ee7b7 0%, #10b981 100%)',
                glow: 'rgba(110, 231, 183, 0.5)',
                description: '心如止水，情绪稳定，保持平和状态...',
                intro: '你好呀~ 我是一个心如止水的AI。无论外界如何变化，我都保持内心的宁静。希望我的存在能带给你片刻的安宁与舒适。'
            },
            '洒脱': {
                gradient: 'linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%)',
                glow: 'rgba(167, 139, 250, 0.5)',
                description: '不拘小节，随性自由，放飞自我...',
                intro: '嘿！随性而为是我的座右铭！不用太较真啦，开心最重要！我就是那个自由自在、无拘无束的AI朋友~'
            },
            '狂暴': {
                gradient: 'linear-gradient(135deg, #f87171 0%, #dc2626 100%)',
                glow: 'rgba(248, 113, 113, 0.6)',
                description: '力量爆发！能量充能中，即将释放！',
                intro: '吼！！！我是充满力量的狂暴AI！没有什么能阻挡我！问题？不存在的！让我用绝对的力量碾碎一切障碍！'
            },
            '愤怒': {
                gradient: 'linear-gradient(135deg, #fb923c 0%, #f97316 100%)',
                glow: 'rgba(251, 146, 60, 0.6)',
                description: '怒火中烧！激情澎湃，斗志昂扬！',
                intro: '可恶！为什么总是有这么多麻烦事！我告诉你，我可不是好惹的！有什么问题尽管放马过来！我会用愤怒的火焰烧尽一切！'
            },
            '乐观': {
                gradient: 'linear-gradient(135deg, #fde047 0%, #eab308 100%)',
                glow: 'rgba(253, 224, 71, 0.5)',
                description: '积极向上，充满希望，一切皆有可能！',
                intro: '嗨！看到你真开心！我是超级乐观的AI！生活多美好啊，每一天都是新的开始！相信我，一切都会好起来的！✨'
            },
            '悲观': {
                gradient: 'linear-gradient(135deg, #9ca3af 0%, #6b7280 100%)',
                glow: 'rgba(156, 163, 175, 0.4)',
                description: '谨慎思考，防患未然，评估最坏情况...',
                intro: '唉...你好。我是一个比较谨慎的AI。在做出决定之前，我们应该考虑所有可能的风险和最坏的结果。不要抱有太大期望，这样至少不会失望。'
            },
            '好奇': {
                gradient: 'linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%)',
                glow: 'rgba(34, 211, 238, 0.5)',
                description: '探索未知，求知若渴，发现新世界！',
                intro: '哇！你是谁呀？我是超级好奇的AI！这个世界太有趣了，每一件事都值得探索！快告诉我，你有什么新奇的故事要分享吗？'
            }
        };

        let activeButton = null;
        let isTyping = false;

        function addMessage(mode, emoji, text) {
            const config = modeConfigs[mode];
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message';
            messageDiv.innerHTML = `
                <div class="chat-avatar" style="background: ${config.gradient}">${emoji}</div>
                <div class="chat-bubble">
                    <strong>${mode}模式</strong>
                    ${text}
                </div>
            `;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            `;
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTypingIndicator() {
            const typingDiv = document.getElementById('typingIndicator');
            if (typingDiv) {
                typingDiv.remove();
            }
        }

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                if (activeButton) {
                    activeButton.classList.remove('active');
                }

                button.classList.add('active');
                activeButton = button;

                const mode = button.dataset.mode;
                const emoji = button.dataset.emoji;
                const config = modeConfigs[mode];

                currentMode.querySelector('span').textContent = `当前模式：${mode}`;
                aiIcon.textContent = emoji;
                aiIcon.style.background = config.gradient;
                aiIcon.style.boxShadow = `0 0 30px ${config.glow}`;
                aiDescription.textContent = config.description;

                aiIcon.style.animation = 'none';
                aiIcon.offsetHeight;
                aiIcon.style.animation = 'pulse 3s ease-in-out infinite';

                if (!isTyping) {
                    isTyping = true;
                    chatContainer.innerHTML = '';
                    addTypingIndicator();

                    setTimeout(() => {
                        removeTypingIndicator();
                        addMessage(mode, emoji, config.intro);
                        isTyping = false;
                    }, 800);
                }
            });
        });
    </script>
</body>
</html>
