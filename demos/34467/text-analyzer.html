<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本分析工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      min-height: 100vh; 
      padding: 2rem; 
    }
    .container { 
      max-width: 900px; 
      margin: 0 auto; 
      background: #fff; 
      border-radius: 20px; 
      padding: 2rem; 
      box-shadow: 0 20px 60px rgba(0,0,0,0.15); 
    }
    .header { 
      text-align: center; 
      margin-bottom: 2rem; 
    }
    .header h1 { 
      font-size: 1.8rem; 
      color: #2c3e50; 
      margin-bottom: 0.5rem; 
    }
    .subtitle { 
      color: #7f8c8d; 
      font-size: 0.95rem; 
    }
    .input-section { 
      margin-bottom: 1.5rem; 
    }
    .input-controls { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 1rem; 
      flex-wrap: wrap; 
      gap: 0.75rem; 
    }
    .btn { 
      padding: 0.5rem 1.25rem; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-size: 0.875rem; 
      font-weight: 500; 
      transition: all 0.25s; 
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
    }
    .btn-secondary { 
      background: #f5f5f5; 
      color: #4a5568; 
    }
    .btn-secondary:hover {
      background: #e8e8e8;
    }
    .btn-accent { 
      background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%); 
      color: white; 
    }
    .btn-accent:hover {
      transform: translateY(-1px);
    }
    textarea { 
      width: 100%; 
      min-height: 180px; 
      padding: 1rem 1.25rem; 
      border: 1px solid #e8e8e8; 
      border-radius: 12px; 
      font-size: 1rem; 
      resize: vertical; 
      font-family: inherit;
      line-height: 1.6;
    }
    textarea:focus { 
      outline: none; 
      border-color: #3498db; 
      background: #fff; 
      box-shadow: 0 0 0 3px rgba(52,152,219,0.1); 
    }
    .results { 
      display: none; 
      flex-direction: column;
      gap: 1.25rem; 
      margin-top: 1.5rem; 
    }
    .card { 
      background: #fff; 
      border-radius: 16px; 
      padding: 1.5rem; 
      box-shadow: 0 4px 16px rgba(0,0,0,0.05); 
    }
    .card h3 { 
      color: #2c3e50; 
      margin-bottom: 1.25rem; 
      font-size: 1.15rem; 
    }
    .stats-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
      gap: 0.875rem; 
    }
    .stat-item { 
      text-align: center; 
      padding: 1rem; 
      background: #f8f9fa; 
      border-radius: 12px; 
    }
    .stat-value { 
      display: block; 
      font-size: 1.8rem; 
      font-weight: 700; 
      color: #3498db; 
      margin-bottom: 0.35rem; 
    }
    .stat-label { 
      color: #7f8c8d; 
      font-size: 0.85rem; 
    }
    .freq-list { 
      display: flex; 
      flex-direction: column; 
      gap: 0.5rem; 
    }
    .freq-item { 
      display: flex; 
      align-items: center; 
      gap: 1rem; 
      padding: 0.6rem 0.8rem; 
      background: #f8f9fa; 
      border-radius: 10px; 
    }
    .word-bar { 
      flex: 2; 
      height: 6px; 
      background: #e8e8e8; 
      border-radius: 3px; 
      overflow: hidden; 
    }
    .bar-fill { 
      height: 100%; 
      background: linear-gradient(90deg, #3498db 0%, #2ecc71 100%); 
      transition: width 0.5s ease;
    }
    .keywords { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 0.6rem; 
      padding: 1rem; 
      background: #f8f9fa; 
      border-radius: 12px; 
    }
    .keyword-tag { 
      padding: 0.4rem 0.9rem; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      color: white; 
      border-radius: 20px; 
      font-size: 0.875rem; 
      transition: all 0.25s;
    }
    .keyword-tag:hover {
      transform: translateY(-2px);
    }
    .sentiment-bar { 
      display: flex; 
      height: 8px; 
      border-radius: 4px; 
      overflow: hidden; 
      margin: 1rem 0; 
      background: #e5e7eb; 
    }
    .bar-negative { 
      background: #ef4444; 
    }
    .bar-positive { 
      background: #22c55e; 
    }
    .sentiment-details { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 0.875rem; 
    }
    .sent-item { 
      text-align: center; 
      padding: 0.875rem; 
      background: #f8f9fa; 
      border-radius: 10px; 
    }
    .sent-label {
      display: block;
      color: #7f8c8d;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
    }
    .sent-value { 
      font-size: 1.4rem; 
      font-weight: 700; 
    }
    .positive { color: #2e7d32; }
    .negative { color: #c62828; }
    .neutral { color: #6b7280; }
    .empty-state { 
      text-align: center; 
      padding: 4rem 2rem; 
      background: #fff; 
      border-radius: 16px; 
      box-shadow: 0 4px 16px rgba(0,0,0,0.05); 
    }
    .empty-icon { 
      font-size: 3.5rem; 
      margin-bottom: 1rem; 
      opacity: 0.6; 
    }
    .empty-text {
      color: #7f8c8d;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📚 文本分析工具</h1>
      <p class="subtitle">输入文本开始分析</p>
    </div>
    
    <div class="input-section">
      <div class="input-controls">
        <label>输入文本：</label>
        <div>
          <button onclick="triggerOCR()" class="btn btn-primary">📷 OCR识别</button>
          <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleOCR(event)">
          <button onclick="loadSample()" class="btn btn-secondary">加载示例</button>
          <button onclick="loadClassical()" class="btn btn-accent">文言文示例</button>
          <button onclick="clearText()" class="btn btn-secondary">清空</button>
        </div>
      </div>
      <textarea id="input" placeholder="在此输入要分析的文本，或使用OCR功能识别图片中的文字..." oninput="analyze()"></textarea>
      <div id="ocrStatus" style="margin-top: 0.5rem; display: none;"></div>
    </div>
    
    <div class="results" id="results">
      <div class="card">
        <h3>📊 基础统计</h3>
        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-value" id="char">0</span>
            <span class="stat-label">字符数</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="word">0</span>
            <span class="stat-label">词数</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="sent">0</span>
            <span class="stat-label">句子数</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="para">0</span>
            <span class="stat-label">段落数</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="avgw">0</span>
            <span class="stat-label">平均词长</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="avgs">0</span>
            <span class="stat-label">平均句长</span>
          </div>
        </div>
      </div>
      
      <div class="card">
        <h3>📈 词频分析</h3>
        <div class="freq-list" id="freq"></div>
      </div>
      
      <div class="card">
        <h3>🔑 关键词提取</h3>
        <div class="keywords" id="keys"></div>
      </div>
      
      <div class="card">
        <h3>😊 情感分析</h3>
        <div style="margin-bottom: 0.5rem;">
          情感倾向：<span id="sentiment" class="neutral" style="font-weight: 600;">中性</span>
        </div>
        <div class="sentiment-bar">
          <div class="bar-negative" id="sneg"></div>
          <div style="background: #9ca3af; width: 10px;"></div>
          <div class="bar-positive" id="spos"></div>
        </div>
        <div class="sentiment-details">
          <div class="sent-item">
            <span class="sent-label">正面词汇</span>
            <span class="sent-value positive" id="pos">0</span>
          </div>
          <div class="sent-item">
            <span class="sent-label">负面词汇</span>
            <span class="sent-value negative" id="neg">0</span>
          </div>
          <div class="sent-item">
            <span class="sent-label">中性词汇</span>
            <span class="sent-value neutral" id="neu">0</span>
          </div>
        </div>
      </div>
    </div>
    
    <div class="empty-state" id="empty">
      <div class="empty-icon">📝</div>
      <p class="empty-text">请输入文本开始分析</p>
    </div>
  </div>

  <script>
    function analyze() {
      const text = document.getElementById('input').value.trim();
      const results = document.getElementById('results');
      const empty = document.getElementById('empty');
      
      if (!text) {
        results.style.display = 'none';
        empty.style.display = 'block';
        return;
      }
      
      results.style.display = 'flex';
      empty.style.display = 'none';
      
      calcStats(text);
      calcFreq(text);
      extractKeys(text);
      analyzeSent(text);
    }
    
    function calcStats(text) {
      const chars = text.length;
      const noSpaceText = text.replace(/\s/g, '');
      const noSpaceChars = noSpaceText.length;
      
      // 判断是否主要是中文文本
      const chineseChars = noSpaceText.match(/[\u4e00-\u9fa5]/g) || [];
      const isChinese = chineseChars.length / noSpaceChars > 0.3;
      
      let words, sents, paras;
      
      if (isChinese) {
        // 中文文本：按字符计算
        words = chineseChars.length;
        sents = text.split(/[。！？!?；\n]+/).filter(s => s.trim().length > 0).length;
        paras = text.split(/\n+/).filter(p => p.trim().length > 0).length;
      } else {
        // 英文文本：按单词计算
        words = text.split(/\s+/).filter(w => w.length > 0).length;
        sents = text.split(/[.!?]+/).filter(s => s.trim().length > 0).length;
        paras = text.split(/\n\n+/).filter(p => p.trim().length > 0).length;
      }
      
      const avgw = words > 0 ? (noSpaceChars / words).toFixed(1) : 0;
      const avgs = sents > 0 ? (words / sents).toFixed(1) : 0;
      
      document.getElementById('char').textContent = chars;
      document.getElementById('word').textContent = words;
      document.getElementById('sent').textContent = sents;
      document.getElementById('para').textContent = paras;
      document.getElementById('avgw').textContent = avgw;
      document.getElementById('avgs').textContent = avgs;
    }
    
    function calcFreq(text) {
      const noSpaceText = text.replace(/\s/g, '');
      const chineseChars = noSpaceText.match(/[\u4e00-\u9fa5]/g) || [];
      const isChinese = chineseChars.length / noSpaceText.length > 0.3;
      
      let words;
      
      if (isChinese) {
        // 中文文本：提取2-4字的词组
        const result = [];
        for (let i = 0; i < noSpaceText.length - 1; i++) {
          // 2字词
          if (i < noSpaceText.length - 1) {
            const word2 = noSpaceText.substr(i, 2);
            if (/^[\u4e00-\u9fa5]+$/.test(word2)) {
              result.push(word2);
            }
          }
          // 3字词
          if (i < noSpaceText.length - 2) {
            const word3 = noSpaceText.substr(i, 3);
            if (/^[\u4e00-\u9fa5]+$/.test(word3)) {
              result.push(word3);
            }
          }
        }
        words = result;
      } else {
        // 英文文本：按单词分割
        words = text.toLowerCase()
          .replace(/[^\w\s]/g, ' ')
          .split(/\s+/)
          .filter(w => w.length > 1);
      }
      
      const freq = new Map();
      words.forEach(w => freq.set(w, (freq.get(w) || 0) + 1));
      
      const sorted = Array.from(freq.entries())
        .map(([word, count]) => ({ word, count }))
        .sort((a, b) => b.count - a.count)
        .slice(0, 10);
      
      const freqList = document.getElementById('freq');
      if (sorted.length === 0) {
        freqList.innerHTML = '<p style="color: #7f8c8d; text-align: center; padding: 1rem;">暂无数据</p>';
        return;
      }
      
      const maxCount = sorted[0].count;
      freqList.innerHTML = sorted.map((item, idx) => {
        const width = (item.count / maxCount * 100) + '%';
        return '<div class="freq-item">' +
          '<span style="font-weight: 600; color: #3498db; min-width: 28px;">' + (idx + 1) + '</span>' +
          '<span style="flex: 1; font-weight: 500;">' + item.word + '</span>' +
          '<div class="word-bar"><div class="bar-fill" style="width: ' + width + '"></div></div>' +
          '<span style="min-width: 36px; text-align: right; color: #7f8c8d;">' + item.count + '</span>' +
          '</div>';
      }).join('');
    }
    
    function extractKeys(text) {
      const noSpaceText = text.replace(/\s/g, '');
      const chineseChars = noSpaceText.match(/[\u4e00-\u9fa5]/g) || [];
      const isChinese = chineseChars.length / noSpaceText.length > 0.3;
      
      let words;
      
      if (isChinese) {
        // 中文文本：提取2-4字的关键词
        const result = [];
        for (let i = 0; i < noSpaceText.length - 1; i++) {
          if (i < noSpaceText.length - 1) {
            const word2 = noSpaceText.substr(i, 2);
            if (/^[\u4e00-\u9fa5]+$/.test(word2)) {
              result.push(word2);
            }
          }
          if (i < noSpaceText.length - 2) {
            const word3 = noSpaceText.substr(i, 3);
            if (/^[\u4e00-\u9fa5]+$/.test(word3)) {
              result.push(word3);
            }
          }
          if (i < noSpaceText.length - 3) {
            const word4 = noSpaceText.substr(i, 4);
            if (/^[\u4e00-\u9fa5]+$/.test(word4)) {
              result.push(word4);
            }
          }
        }
        words = result;
      } else {
        // 英文文本：按单词分割
        words = text.toLowerCase()
          .replace(/[^\w\s]/g, ' ')
          .split(/\s+/)
          .filter(w => w.length > 2);
      }
      
      const freq = new Map();
      words.forEach(w => freq.set(w, (freq.get(w) || 0) + 1));
      
      const scored = Array.from(freq.entries())
        .map(([word, count]) => ({ word, score: count / words.length }))
        .sort((a, b) => b.score - a.score)
        .slice(0, 15);
      
      const keysDiv = document.getElementById('keys');
      if (scored.length === 0) {
        keysDiv.innerHTML = '<p style="color: #7f8c8d; text-align: center; padding: 1rem;">暂无数据</p>';
        return;
      }
      
      keysDiv.innerHTML = scored.map(k => {
        const fontSize = Math.max(12, Math.min(24, 12 + k.score * 50)) + 'px';
        return '<span class="keyword-tag" style="font-size: ' + fontSize + '">' + k.word + '</span>';
      }).join('');
    }
    
    function analyzeSent(text) {
      const posWords = ['好', '优秀', '成功', '快乐', '幸福', '美丽', '希望', '爱', '喜欢', '美', '善', '真', '乐', '喜', '欢', 'good', 'great', 'happy', 'love', 'beautiful', 'wonderful', 'excellent'];
      const negWords = ['坏', '失败', '悲伤', '痛苦', '丑陋', '糟糕', '绝望', '恨', '讨厌', '恶', '苦', '悲', '哀', '怒', 'bad', 'fail', 'sad', 'pain', 'terrible', 'awful', 'horrible'];
      
      const words = text.toLowerCase().split('');
      let pos = 0, neg = 0;
      
      words.forEach(w => {
        if (posWords.some(pw => w.includes(pw))) pos++;
        if (negWords.some(nw => w.includes(nw))) neg++;
      });
      
      const total = pos + neg;
      const neu = Math.max(0, words.length - total);
      let score = 0.5;
      if (total > 0) score = pos / total;
      
      const sentEl = document.getElementById('sentiment');
      if (score > 0.6) {
        sentEl.textContent = '积极';
        sentEl.className = 'positive';
      } else if (score < 0.4) {
        sentEl.textContent = '消极';
        sentEl.className = 'negative';
      } else {
        sentEl.textContent = '中性';
        sentEl.className = 'neutral';
      }
      
      document.getElementById('pos').textContent = pos;
      document.getElementById('neg').textContent = neg;
      document.getElementById('neu').textContent = neu;
      document.getElementById('sneg').style.width = (1 - score) * 50 + '%';
      document.getElementById('spos').style.width = score * 50 + '%';
    }
    
    function loadSample() {
      document.getElementById('input').value = '春夜喜雨\n\n好雨知时节，当春乃发生。\n随风潜入夜，润物细无声。\n野径云俱黑，江船火独明。\n晓看红湿处，花重锦官城。';
      analyze();
    }
    
    function loadClassical() {
      document.getElementById('input').value = '关关雎鸠，在河之洲。\n窈窕淑女，君子好逑。\n参差荇菜，左右流之。\n窈窕淑女，寤寐求之。\n\n学而时习之，不亦说乎？\n有朋自远方来，不亦乐乎？\n人不知而不愠，不亦君子乎？';
      analyze();
    }
    
    function clearText() {
      document.getElementById('input').value = '';
      document.getElementById('results').style.display = 'none';
      document.getElementById('empty').style.display = 'block';
    }
  </script>
  
  <!-- Tesseract.js OCR Library -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  
  <script>
    // OCR功能
    function triggerOCR() {
      document.getElementById('fileInput').click();
    }
    
    async function handleOCR(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      if (!file.type.startsWith('image/')) {
        showOCRStatus('error', '请上传图片文件');
        return;
      }
      
      showOCRStatus('processing', '正在识别文字，请稍候...');
      
      try {
        // 使用Tesseract.js进行OCR识别
        const result = await Tesseract.recognize(file, 'chi_sim+eng', {
          logger: m => {
            if (m.status === 'recognizing text') {
              const progress = Math.round(m.progress * 100);
              showOCRStatus('processing', `识别进度: ${progress}%`);
            }
          }
        });
        
        const text = result.data.text.trim();
        if (text) {
          document.getElementById('input').value = text;
          showOCRStatus('success', '文字识别成功！');
          analyze();
        } else {
          showOCRStatus('error', '未能识别到文字，请尝试其他图片');
        }
      } catch (error) {
        console.error('OCR识别失败:', error);
        showOCRStatus('error', 'OCR识别失败，请重试');
      }
      
      event.target.value = '';
    }
    
    function showOCRStatus(type, message) {
      const statusEl = document.getElementById('ocrStatus');
      statusEl.style.display = 'block';
      
      let bgColor, textColor;
      switch(type) {
        case 'processing':
          bgColor = '#fff8e1';
          textColor = '#856404';
          break;
        case 'success':
          bgColor = '#e8f5e9';
          textColor = '#2e7d32';
          break;
        case 'error':
          bgColor = '#ffebee';
          textColor = '#c62828';
          break;
        default:
          bgColor = '#f5f5f5';
          textColor = '#4a5568';
      }
      
      statusEl.innerHTML = `<span style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: 6px; background: ${bgColor}; color: ${textColor}; font-size: 0.875rem; font-weight: 500;">${message}</span>`;
      
      if (type === 'success' || type === 'error') {
        setTimeout(() => {
          statusEl.style.display = 'none';
        }, 3000);
      }
    }
  </script>
</body>
</html>
