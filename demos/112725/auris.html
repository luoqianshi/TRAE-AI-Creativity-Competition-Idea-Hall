<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURIS - 找到你的完美耳机</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1C1C1E;
            --text-primary: #F5F5F7;
            --text-secondary: #86868B;
            --accent-blue: #0A84FF;
            --glass-bg: rgba(28, 28, 30, 0.72);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            overflow-x: hidden;
            /* 模拟深空氛围光 */
            background-image: radial-gradient(circle at 10% 20%, rgba(10, 132, 255, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(175, 82, 222, 0.08) 0%, transparent 40%);
        }

        /* 导航栏 - 毛玻璃效果 */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
            box-sizing: border-box;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        .nav-item {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--accent-blue);
            color: white;
            padding: 6px 16px;
            border-radius: 999px;
        }

        /* Hero 区域 */
        .hero {
            text-align: center;
            padding: 160px 20px 80px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 56px;
            font-weight: 700;
            margin: 0 0 16px 0;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 0%, #a5a5a5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero h1 span {
            background: linear-gradient(135deg, #0A84FF 0%, #AF52DE 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 18px;
            margin-bottom: 40px;
        }

        /* 搜索框 */
        .search-container {
            max-width: 600px;
            margin: 0 auto 60px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 16px 24px;
            border-radius: 16px;
            background: #1C1C1E;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            background: #2C2C2E;
        }

        /* 产品网格 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            padding: 0 40px 80px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), background 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: scale(1.02);
            background: #2C2C2E;
        }

        .card-img-placeholder {
            width: 100%;
            height: 200px;
            background: #FFFFFF;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
            font-size: 24px;
            position: relative;
            overflow: hidden;
        }
        
        /* 模拟耳机图 */
        .card-img-placeholder::after {
            content: '🎧';
            font-size: 64px;
            opacity: 0.8;
        }

        .card-brand {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }

        .card-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 16px;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tag {
            background: rgba(10, 132, 255, 0.15);
            color: var(--accent-blue);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .price {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* AI 助手悬浮球 */
        .ai-assistant {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #0A84FF, #AF52DE);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(10, 132, 255, 0.4);
            cursor: pointer;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .ai-assistant:hover {
            transform: scale(1.1);
        }

        .ai-assistant::after {
            content: 'Auri';
            color: white;
            font-weight: 700;
            font-size: 14px;
        }

    </style>
</head>
<body>

    <nav>
        <div class="logo">AURIS</div>
        <div class="nav-links">
            <a class="nav-item active">产品</a>
            <a class="nav-item">对比</a>
            <a class="nav-item">AI 推荐</a>
            <a class="nav-item">评测</a>
        </div>
    </nav>

    <div class="hero">
        <h1>找到你的<span>完美耳机</span></h1>
        <p>专业评测、参数对比、AI 智能推荐 — 一站式耳机选购平台</p>
        
        <div class="search-container">
            <input type="text" class="search-input" placeholder="搜索耳机或描述你的需求（如：适合听女声的入耳式）...">
        </div>
    </div>

    <div class="grid-container">
        <!-- 卡片 1 -->
        <div class="card">
            <div class="card-img-placeholder" style="background: #f0f0f0;"></div>
            <div class="card-brand">SONY</div>
            <h3 class="card-title">WH-1000XM5</h3>
            <p class="card-desc">行业领先的降噪技术，轻盈佩戴，30小时续航。</p>
            <div class="tags">
                <span class="tag">降噪</span>
                <span class="tag">无线</span>
            </div>
            <div class="price">¥2,499</div>
        </div>

        <!-- 卡片 2 -->
        <div class="card">
            <div class="card-img-placeholder" style="background: #fff;"></div>
            <div class="card-brand">APPLE</div>
            <h3 class="card-title">AirPods Pro 2</h3>
            <p class="card-desc">自适应音频，个性化空间音频，USB-C 充电。</p>
            <div class="tags">
                <span class="tag">空间音频</span>
                <span class="tag">Apple生态</span>
            </div>
            <div class="price">¥1,899</div>
        </div>

        <!-- 卡片 3 -->
        <div class="card">
            <div class="card-img-placeholder" style="background: #e0e0e0;"></div>
            <div class="card-brand">SENNHEISER</div>
            <h3 class="card-title">Momentum 4</h3>
            <p class="card-desc">卓越音质，60小时超长续航，自适应降噪。</p>
            <div class="tags">
                <span class="tag">Hi-Fi音质</span>
                <span class="tag">长续航</span>
            </div>
            <div class="price">¥2,999</div>
        </div>

        <!-- 卡片 4 -->
        <div class="card">
            <div class="card-img-placeholder" style="background: #f5f5f5;"></div>
            <div class="card-brand">FiiO</div>
            <h3 class="card-title">JT7</h3>
            <p class="card-desc">开放式头戴平板耳机，声场开阔，解析力极高。</p>
            <div class="tags">
                <span class="tag">平板单元</span>
                <span class="tag">发烧级</span>
            </div>
            <div class="price">¥699</div>
        </div>
    </div>

    <div class="ai-assistant" title="Ask Auri"></div>

</body>
</html>
