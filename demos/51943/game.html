<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消消乐</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes bounce-in {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scale-in {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .animate-bounce-in { animation: bounce-in 0.3s ease-out forwards; }
    .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
    .animate-scale-in { animation: scale-in 0.3s ease-out forwards; }
    .animate-shake { animation: shake 0.3s ease-out; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-pink-100 via-blue-50 to-green-100 p-4">
  <div class="max-w-4xl mx-auto">
    <header class="text-center mb-6">
      <h1 class="text-4xl font-bold bg-gradient-to-r from-pink-500 via-purple-500 to-blue-500 bg-clip-text text-transparent mb-2">
        🎮 消消乐 🎮
      </h1>
      <p class="text-gray-500">点击相同图案的方块，三个相同即可消除！</p>
    </header>

    <div id="score-panel" class="bg-white/70 backdrop-blur-sm rounded-xl px-6 py-3 shadow-md border border-white/80">
      <div class="flex items-center justify-between gap-6">
        <div class="text-center">
          <div class="text-xs text-gray-500 font-medium">分数</div>
          <div id="score" class="text-2xl font-bold text-pink-500">0</div>
        </div>
        <div class="text-center">
          <div class="text-xs text-gray-500 font-medium">剩余方块</div>
          <div id="remaining-blocks" class="text-xl font-bold text-blue-500">0</div>
        </div>
        <div class="flex-1">
          <div class="text-xs text-gray-500 font-medium mb-1">进度</div>
          <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
            <div id="progress-bar" class="h-full bg-gradient-to-r from-pink-400 to-blue-400 rounded-full transition-all duration-500" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-6 flex justify-center">
      <button onclick="restartGame()" class="px-6 py-2 bg-white/80 text-gray-600 font-medium rounded-xl shadow-md hover:shadow-lg hover:scale-105 transition-all duration-200 border border-white/60">
        🔄 重新开始
      </button>
    </div>

    <div id="game-board" class="bg-white/50 backdrop-blur-sm rounded-2xl p-4 shadow-lg border-2 border-white/60 overflow-auto mt-6" style="max-height: 500px">
      <div id="board-container" class="relative mx-auto"></div>
    </div>

    <div class="mt-6">
      <div class="text-center text-sm text-gray-400 mb-3">选中槽</div>
      <div id="slot" class="bg-white/60 backdrop-blur-sm rounded-2xl p-4 shadow-lg border-2 border-white/80">
        <div id="slot-container" class="flex gap-2 justify-center"></div>
      </div>
    </div>

    <footer class="text-center mt-6 text-gray-400 text-sm">
      <p>提示：只能点击没有被遮挡的方块哦~</p>
    </footer>
  </div>

  <div id="game-over-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 animate-fade-in">
    <div class="bg-white rounded-3xl p-8 shadow-2xl max-w-sm w-full mx-4 text-center animate-scale-in">
      <div id="result-emoji" class="text-6xl mb-4"></div>
      <h2 id="result-title" class="text-3xl font-bold mb-2"></h2>
      <p id="result-message" class="text-gray-400 mb-6"></p>
      <div class="bg-gradient-to-r from-pink-100 to-blue-100 rounded-xl p-4 mb-6">
        <div class="text-gray-500 text-sm">最终得分</div>
        <div id="final-score" class="text-4xl font-bold text-purple-500">0</div>
      </div>
      <button onclick="restartGame()" class="w-full py-3 px-6 bg-gradient-to-r from-pink-400 to-blue-400 text-white font-bold rounded-xl shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-200">
        再玩一次
      </button>
    </div>
  </div>

  <script>
    const ANIMAL_EMOJIS = ['🐑', '🐱', '🐶', '🐰', '🐻', '🦊', '🐼'];
    const BLOCK_COLORS = [
      'bg-pink-200',
      'bg-blue-200',
      'bg-green-200',
      'bg-yellow-200',
      'bg-orange-200',
      'bg-purple-200',
      'bg-red-200',
    ];
    const BLOCK_SIZE = 60;
    const LAYER_OFFSET = 4;
    const MAX_SLOT_SIZE = 7;
    const POINTS_PER_MATCH = 100;

    const LAYER_CONFIGS = [
      { rows: 5, cols: 7, offsetX: 0, offsetY: 0 },
      { rows: 4, cols: 6, offsetX: 0.5, offsetY: 0.5 },
      { rows: 4, cols: 6, offsetX: 1, offsetY: 1 },
      { rows: 3, cols: 5, offsetX: 1.5, offsetY: 1.5 },
      { rows: 2, cols: 4, offsetX: 2, offsetY: 2 },
    ];

    let gameState = {
      blocks: [],
      selectedBlocks: [],
      score: 0,
      isGameOver: false,
      isWin: false,
      totalBlocks: 0,
    };

    function generateBlocks() {
      const blocks = [];
      let idCounter = 0;
      
      const totalPositions = LAYER_CONFIGS.reduce((sum, config) => sum + config.rows * config.cols, 0);
      const blocksPerType = Math.floor(totalPositions / ANIMAL_EMOJIS.length);
      const finalBlocksPerType = Math.floor(blocksPerType / 3) * 3;
      const totalBlocks = finalBlocksPerType * ANIMAL_EMOJIS.length;
      
      const typePool = [];
      for (let type = 0; type < ANIMAL_EMOJIS.length; type++) {
        for (let i = 0; i < finalBlocksPerType; i++) {
          typePool.push(type);
        }
      }
      
      for (let i = typePool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [typePool[i], typePool[j]] = [typePool[j], typePool[i]];
      }
      
      let typeIndex = 0;

      LAYER_CONFIGS.forEach((config, layerIndex) => {
        const { rows, cols, offsetX, offsetY } = config;
        
        for (let row = 0; row < rows && typeIndex < totalBlocks; row++) {
          for (let col = 0; col < cols && typeIndex < totalBlocks; col++) {
            const type = typePool[typeIndex++];
            
            blocks.push({
              id: `block-${idCounter++}`,
              type,
              layer: layerIndex,
              x: (col + offsetX) * BLOCK_SIZE,
              y: (row + offsetY) * BLOCK_SIZE,
              isSelected: false,
              isBlocked: false,
            });
          }
        }
      });

      return blocks;
    }

    function checkBlocked(blocks, targetBlock) {
      const targetLeft = targetBlock.x;
      const targetRight = targetBlock.x + BLOCK_SIZE;
      const targetTop = targetBlock.y;
      const targetBottom = targetBlock.y + BLOCK_SIZE;

      const blockingBlocks = blocks.filter(block => {
        if (block.id === targetBlock.id) return false;
        if (block.layer <= targetBlock.layer) return false;

        const blockLeft = block.x - LAYER_OFFSET * block.layer;
        const blockRight = block.x + BLOCK_SIZE - LAYER_OFFSET * block.layer;
        const blockTop = block.y - LAYER_OFFSET * block.layer;
        const blockBottom = block.y + BLOCK_SIZE - LAYER_OFFSET * block.layer;

        const overlapX = Math.max(0, Math.min(targetRight, blockRight) - Math.max(targetLeft, blockLeft));
        const overlapY = Math.max(0, Math.min(targetBottom, blockBottom) - Math.max(targetTop, blockTop));

        return overlapX > 10 && overlapY > 10;
      });

      return blockingBlocks.length > 0;
    }

    function updateBlockedStatus(blocks) {
      return blocks.map(block => ({
        ...block,
        isBlocked: checkBlocked(blocks, block),
      }));
    }

    function findMatches(blocks) {
      const typeCounts = {};
      
      blocks.forEach(block => {
        typeCounts[block.type] = (typeCounts[block.type] || 0) + 1;
      });

      const matchingTypes = [];
      
      Object.entries(typeCounts).forEach(([type, count]) => {
        if (count >= 3) {
          matchingTypes.push(parseInt(type));
        }
      });

      return matchingTypes;
    }

    function removeMatches(blocks, matchingType) {
      let removeCount = 0;
      return blocks.filter(block => {
        if (block.type === matchingType && removeCount < 3) {
          removeCount++;
          return false;
        }
        return true;
      });
    }

    function renderBlocks() {
      const container = document.getElementById('board-container');
      if (!container) return;

      container.innerHTML = '';

      if (gameState.blocks.length === 0) {
        container.style.width = '520px';
        container.style.height = '400px';
        return;
      }

      const maxX = Math.max(...gameState.blocks.map(b => b.x));
      const maxY = Math.max(...gameState.blocks.map(b => b.y));
      
      container.style.width = `${maxX + 80}px`;
      container.style.height = `${maxY + 80}px`;

      gameState.blocks.forEach(block => {
        const colorClass = BLOCK_COLORS[block.type % BLOCK_COLORS.length];
        const el = document.createElement('div');
        el.className = `
          absolute w-14 h-14 rounded-lg flex items-center justify-center
          text-2xl cursor-pointer transition-all duration-200
          ${colorClass}
          ${block.isBlocked 
            ? 'opacity-50 cursor-not-allowed grayscale' 
            : 'hover:scale-110 hover:shadow-lg hover:-translate-y-1'
          }
          border-2 border-white/50 shadow-md
          select-none
        `;
        el.style.left = `${block.x}px`;
        el.style.top = `${block.y}px`;
        el.style.zIndex = block.layer * 10;
        el.style.transform = `translate(${block.layer * -4}px, ${block.layer * -4}px)`;
        el.style.boxShadow = block.isBlocked 
          ? '2px 2px 4px rgba(0,0,0,0.1)' 
          : `${block.layer * 2 + 4}px ${block.layer * 2 + 4}px ${block.layer * 4 + 8}px rgba(0,0,0,0.2)`;
        el.innerHTML = `<span class="drop-shadow-sm">${ANIMAL_EMOJIS[block.type]}</span>`;
        
        if (!block.isBlocked) {
          el.onclick = () => selectBlock(block.id);
        }
        
        container.appendChild(el);
      });
    }

    function renderSlot() {
      const container = document.getElementById('slot-container');
      if (!container) return;

      container.innerHTML = '';

      for (let i = 0; i < MAX_SLOT_SIZE; i++) {
        const block = gameState.selectedBlocks[i];
        const isLastSlot = i === MAX_SLOT_SIZE - 1;
        const isFull = gameState.selectedBlocks.length === MAX_SLOT_SIZE;
        
        const el = document.createElement('div');
        el.className = `
          w-14 h-14 rounded-lg flex items-center justify-center
          border-2 border-dashed transition-all duration-200
          ${block 
            ? `${BLOCK_COLORS[block.type % BLOCK_COLORS.length]} border-white/50 shadow-md animate-bounce-in` 
            : 'border-gray-300/50 bg-gray-100/30'
          }
          ${isLastSlot && isFull ? 'ring-2 ring-red-400 animate-pulse' : ''}
        `;
        
        if (block) {
          el.innerHTML = `<span class="text-2xl drop-shadow-sm">${ANIMAL_EMOJIS[block.type]}</span>`;
        }
        
        container.appendChild(el);
      }
    }

    function renderScorePanel() {
      document.getElementById('score').textContent = gameState.score;
      document.getElementById('remaining-blocks').textContent = gameState.blocks.length;
      
      const progress = gameState.totalBlocks > 0 
        ? ((gameState.totalBlocks - gameState.blocks.length) / gameState.totalBlocks) * 100 
        : 0;
      document.getElementById('progress-bar').style.width = `${progress}%`;
    }

    function renderGameOverModal() {
      const modal = document.getElementById('game-over-modal');
      if (!modal) return;

      if (gameState.isGameOver || gameState.isWin) {
        modal.classList.remove('hidden');
        document.getElementById('result-emoji').textContent = gameState.isWin ? '🎉' : '😢';
        document.getElementById('result-title').textContent = gameState.isWin ? '恭喜通关！' : '游戏结束';
        document.getElementById('result-title').className = `text-3xl font-bold mb-2 ${gameState.isWin ? 'text-pink-500' : 'text-gray-500'}`;
        document.getElementById('result-message').textContent = gameState.isWin 
          ? '你太厉害了！所有方块都消除了！' 
          : '选中槽已满，请再试一次';
        document.getElementById('final-score').textContent = gameState.score;
      } else {
        modal.classList.add('hidden');
      }
    }

    function selectBlock(blockId) {
      if (gameState.isGameOver || gameState.isWin) return;

      const block = gameState.blocks.find(b => b.id === blockId);
      if (!block || block.isBlocked) return;

      const newSelectedBlocks = [...gameState.selectedBlocks, block];
      
      if (newSelectedBlocks.length > MAX_SLOT_SIZE) {
        gameState.isGameOver = true;
        gameState.isWin = false;
        renderAll();
        return;
      }

      const matchingTypes = findMatches(newSelectedBlocks);
      let updatedSelectedBlocks = newSelectedBlocks;
      let updatedScore = gameState.score;

      matchingTypes.forEach(type => {
        updatedSelectedBlocks = removeMatches(updatedSelectedBlocks, type);
        updatedScore += POINTS_PER_MATCH;
      });

      const updatedBlocks = gameState.blocks.filter(b => b.id !== blockId);
      const checkedBlocks = updateBlockedStatus(updatedBlocks);

      const isWin = checkedBlocks.length === 0;

      gameState = {
        blocks: checkedBlocks,
        selectedBlocks: updatedSelectedBlocks,
        score: updatedScore,
        isGameOver: updatedSelectedBlocks.length > MAX_SLOT_SIZE,
        isWin,
        totalBlocks: gameState.totalBlocks,
      };

      renderAll();
    }

    function restartGame() {
      const blocks = generateBlocks();
      const updatedBlocks = updateBlockedStatus(blocks);
      
      gameState = {
        blocks: updatedBlocks,
        selectedBlocks: [],
        score: 0,
        isGameOver: false,
        isWin: false,
        totalBlocks: updatedBlocks.length,
      };

      renderAll();
    }

    function renderAll() {
      renderBlocks();
      renderSlot();
      renderScorePanel();
      renderGameOverModal();
    }

    restartGame();
  </script>
</body>
</html>
