<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美梦成真 - 梦境转换</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .input-section {
            margin-bottom: 25px;
        }

        .input-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .input-section textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        .input-section textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .voice-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
        }

        .voice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }

        .voice-btn.recording {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(238, 90, 90, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(238, 90, 90, 0); }
            100% { box-shadow: 0 0 0 0 rgba(238, 90, 90, 0); }
        }

        .voice-btn svg {
            width: 24px;
            height: 24px;
        }

        .type-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .type-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .type-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .type-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .type-btn svg {
            width: 32px;
            height: 32px;
        }

        .type-btn.active svg {
            filter: brightness(0) invert(1);
        }

        .generate-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-section {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .result-section.show {
            display: block;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        .result-image {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .result-video {
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: #45a049;
        }

        .history-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .history-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .history-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .history-item:hover {
            transform: translateY(-5px);
        }

        .history-item img, .history-item video {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .history-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            padding: 15px;
            color: white;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item .type-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .type-badge.image {
            background: #4CAF50;
            color: white;
        }

        .type-badge.video {
            background: #2196F3;
            color: white;
        }

        .empty-history {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-history svg {
            width: 64px;
            height: 64px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .enhanced-prompt {
            background: #f8f9ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 15px;
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            color: #555;
            display: none;
        }

        .enhanced-prompt.show {
            display: block;
        }

        .enhanced-label {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
            display: block;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .main-card, .history-section {
                padding: 20px;
            }
            
            .type-selector {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌙 美梦成真</h1>
            <p>将你的梦境描述或古诗转换为美丽的图片或视频，永久珍藏</p>
        </div>

        <div class="main-card">
            <div class="input-section">
                <label for="dream-input">🎨 描述你的梦境或古诗</label>
                <textarea id="dream-input" placeholder="例如：我梦见自己站在云端之上，脚下是连绵起伏的云海，远处的太阳正缓缓升起，金色的光芒洒在每一朵云上，如同仙境一般...&#10;&#10;或者输入古诗：床前明月光，疑是地上霜。举头望明月，低头思故乡。"></textarea>
            </div>

            <button class="voice-btn" id="voice-btn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                </svg>
                <span id="voice-text">语音输入</span>
            </button>

            <div class="type-selector">
                <button class="type-btn active" data-type="image">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <span>生成图片</span>
                </button>
                <button class="type-btn" data-type="video">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="23 7 16 12 23 17 23 7"/>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                    </svg>
                    <span>生成视频</span>
                </button>
            </div>

            <button class="generate-btn" id="generate-btn">
                <span>✨ 开始生成</span>
            </button>

            <div class="enhanced-prompt" id="enhanced-prompt">
                <div class="enhanced-label">🎭 AI优化后的提示词：</div>
                <div id="enhanced-text"></div>
            </div>

            <div class="result-section" id="result-section">
                <div class="result-title" id="result-title">生成结果</div>
                <div id="result-content"></div>
                <button class="download-btn" id="download-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span>下载作品</span>
                </button>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📚 我的珍藏</div>
            <div class="history-grid" id="history-grid">
                <div class="empty-history">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <p>还没有生成过作品<br>快来描述你的第一个梦境吧！</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000';
        
        const dreamInput = document.getElementById('dream-input');
        const voiceBtn = document.getElementById('voice-btn');
        const voiceText = document.getElementById('voice-text');
        const typeBtns = document.querySelectorAll('.type-btn');
        const generateBtn = document.getElementById('generate-btn');
        const resultSection = document.getElementById('result-section');
        const resultContent = document.getElementById('result-content');
        const downloadBtn = document.getElementById('download-btn');
        const historyGrid = document.getElementById('history-grid');
        const enhancedPrompt = document.getElementById('enhanced-prompt');
        const enhancedText = document.getElementById('enhanced-text');

        let currentType = 'image';
        let isRecording = false;
        let mediaRecorder;
        let audioChunks = [];
        let currentResultUrl = '';

        typeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                typeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.dataset.type;
            });
        });

        voiceBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => {
                        audioChunks.push(e.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        const formData = new FormData();
                        formData.append('audio', audioBlob, 'recording.wav');

                        try {
                            const response = await fetch(`${API_BASE}/api/transcribe`, {
                                method: 'POST',
                                body: formData
                            });
                            const data = await response.json();
                            if (data.success) {
                                dreamInput.value = data.text;
                            } else {
                                alert('语音识别失败：' + data.error);
                            }
                        } catch (error) {
                            alert('语音识别出错：' + error.message);
                        }
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    voiceBtn.classList.add('recording');
                    voiceText.textContent = '停止录音';
                } catch (error) {
                    alert('无法访问麦克风：' + error.message);
                }
            } else {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                isRecording = false;
                voiceBtn.classList.remove('recording');
                voiceText.textContent = '语音输入';
            }
        });

        generateBtn.addEventListener('click', async () => {
            const prompt = dreamInput.value.trim();
            if (!prompt) {
                alert('请先描述你的梦境或输入古诗');
                return;
            }

            generateBtn.disabled = true;
            generateBtn.innerHTML = '<div class="loading"><div class="spinner"></div><span>正在生成中...</span></div>';

            try {
                const enhanceResponse = await fetch(`${API_BASE}/api/generate-prompt`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: prompt })
                });
                const enhanceData = await enhanceResponse.json();
                
                if (enhanceData.success) {
                    enhancedPrompt.classList.add('show');
                    enhancedText.textContent = enhanceData.enhanced_prompt;

                    const generateUrl = currentType === 'image' 
                        ? `${API_BASE}/api/generate-image` 
                        : `${API_BASE}/api/generate-video`;
                    
                    const generateResponse = await fetch(generateUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: enhanceData.enhanced_prompt })
                    });
                    const generateData = await generateResponse.json();

                    if (generateData.success) {
                        currentResultUrl = `${API_BASE}${currentType === 'image' ? generateData.image_url : generateData.video_url}`;
                        showResult(currentResultUrl, currentType);
                        loadHistory();
                    } else {
                        alert('生成失败：' + generateData.error);
                    }
                } else {
                    alert('提示词优化失败：' + enhanceData.error);
                }
            } catch (error) {
                alert('生成出错：' + error.message);
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = '<span>✨ 开始生成</span>';
            }
        });

        function showResult(url, type) {
            resultSection.classList.add('show');
            if (type === 'image') {
                resultContent.innerHTML = `<img src="${url}" class="result-image" alt="生成的梦境图片">`;
            } else {
                resultContent.innerHTML = `<video src="${url}" class="result-video" controls></video>`;
            }
        }

        downloadBtn.addEventListener('click', () => {
            if (currentResultUrl) {
                const link = document.createElement('a');
                link.href = currentResultUrl;
                link.download = currentResultUrl.split('/').pop();
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        });

        async function loadHistory() {
            try {
                const response = await fetch(`${API_BASE}/api/history`);
                const data = await response.json();

                if (data.success && data.items.length > 0) {
                    historyGrid.innerHTML = data.items.map(item => `
                        <div class="history-item" onclick="window.open('${API_BASE}${item.url}', '_blank')">
                            ${item.type === 'image' 
                                ? `<img src="${API_BASE}${item.url}" alt="${item.filename}">` 
                                : `<video src="${API_BASE}${item.url}" muted loop playsinline></video>`
                            }
                            <div class="type-badge ${item.type}">${item.type === 'image' ? '图片' : '视频'}</div>
                            <div class="overlay">${item.filename}</div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('加载历史记录失败：', error);
            }
        }

        window.addEventListener('load', loadHistory);
    </script>
</body>
</html>
