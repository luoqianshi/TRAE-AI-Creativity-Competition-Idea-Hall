<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>万能格式转换站 - 完整 Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
            padding: 30px 20px;
            color: #f1f5f9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .tagline {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: #38bdf8;
        }

        .upload-zone {
            border: 3px dashed #38bdf8;
            border-radius: 16px;
            padding: 50px 30px;
            text-align: center;
            background: rgba(56, 189, 248, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: #818cf8;
            background: rgba(129, 140, 248, 0.1);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .upload-hint {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .file-info {
            background: rgba(51, 65, 85, 0.5);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            display: none;
        }

        .file-info.active {
            display: block;
        }

        .file-name {
            font-weight: 700;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .file-meta {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .format-selector {
            margin-bottom: 25px;
        }

        .format-label {
            display: block;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .format-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .format-btn {
            padding: 12px 16px;
            background: rgba(51, 65, 85, 0.7);
            border: 2px solid transparent;
            border-radius: 10px;
            color: #f1f5f9;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .format-btn:hover {
            background: rgba(56, 189, 248, 0.2);
        }

        .format-btn.active {
            background: rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
        }

        .convert-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .convert-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.3);
        }

        .convert-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(51, 65, 85, 0.7);
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
            display: none;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .result-zone {
            text-align: center;
        }

        .preview-container {
            background: rgba(51, 65, 85, 0.5);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .preview-placeholder {
            color: #64748b;
        }

        .download-btn {
            padding: 14px 40px;
            background: linear-gradient(135deg, #10b981, #34d399);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .download-btn.active {
            display: inline-block;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }

        .history-section {
            margin-top: 30px;
        }

        .history-list {
            display: grid;
            gap: 12px;
        }

        .history-item {
            background: rgba(51, 65, 85, 0.4);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-info {
            flex: 1;
        }

        .history-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .history-time {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .category-tab {
            padding: 10px 20px;
            background: rgba(51, 65, 85, 0.5);
            border: none;
            border-radius: 10px;
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-tab:hover {
            color: #f1f5f9;
        }

        .category-tab.active {
            background: rgba(56, 189, 248, 0.25);
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔄 万能格式转换站</h1>
            <p class="tagline">一站式文件格式转换解决方案 - 完整 Demo</p>
        </header>

        <div class="category-tabs">
            <button class="category-tab active" data-category="image">🖼️ 图片转换</button>
            <button class="category-tab" data-category="document">📄 文档转换</button>
            <button class="category-tab" data-category="audio">🎵 音频转换</button>
            <button class="category-tab" data-category="other">🗂️ 其他工具</button>
        </div>

        <div class="main-content">
            <div class="card">
                <div class="card-title">📤 上传文件</div>
                <input type="file" id="fileInput" style="display: none;" accept="image/*,.pdf,.txt,.md,.csv,.json,.xml,.mp3,.wav,.flac,.aac,.ogg,.m4a">
                <div class="upload-zone" id="uploadZone">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">点击或拖拽文件到这里</div>
                    <div class="upload-hint">支持 JPG, PNG, WebP, PDF, TXT, MD, CSV, JSON, MP3, WAV 等格式</div>
                </div>

                <div class="file-info" id="fileInfo">
                    <div class="file-name" id="fileName">-</div>
                    <div class="file-meta" id="fileMeta">-</div>
                </div>

                <div class="format-selector" id="formatSelector" style="display: none;">
                    <div class="format-label">选择目标格式：</div>
                    <div class="format-grid" id="formatGrid"></div>
                </div>

                <button class="convert-btn" id="convertBtn" disabled>🔄 开始转换</button>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">📥 转换结果</div>
                <div class="result-zone">
                    <div class="preview-container" id="previewContainer">
                        <div class="preview-placeholder">转换后的文件将在这里预览</div>
                    </div>
                    <button class="download-btn" id="downloadBtn">📥 下载文件</button>
                </div>
            </div>
        </div>

        <div class="card history-section">
            <div class="card-title">📜 转换历史</div>
            <div class="history-list" id="historyList">
                <div style="text-align: center; color: #64748b; padding: 30px;">暂无转换记录</div>
            </div>
        </div>
    </div>

    <script>
        let currentFile = null;
        let currentFormat = null;
        let convertedBlob = null;
        let history = [];

        const formatConfigs = {
            image: {
                formats: ['PNG', 'JPG', 'WebP', 'GIF', 'BMP'],
                accept: 'image/*'
            },
            document: {
                formats: ['PDF', 'TXT', 'MD', 'HTML', 'CSV', 'JSON'],
                accept: '.pdf,.txt,.md,.html,.csv,.json,.xml'
            },
            audio: {
                formats: ['MP3', 'WAV', 'OGG', 'M4A'],
                accept: '.mp3,.wav,.flac,.aac,.ogg,.m4a'
            },
            other: {
                formats: ['Base64', 'Hex', 'QR Code'],
                accept: '*'
            }
        };

        let currentCategory = 'image';

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileMeta = document.getElementById('fileMeta');
        const formatSelector = document.getElementById('formatSelector');
        const formatGrid = document.getElementById('formatGrid');
        const convertBtn = document.getElementById('convertBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const previewContainer = document.getElementById('previewContainer');
        const downloadBtn = document.getElementById('downloadBtn');
        const historyList = document.getElementById('historyList');

        document.querySelectorAll('.category-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.category;
                fileInput.accept = formatConfigs[currentCategory].accept;
                resetState();
            });
        });

        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            currentFile = file;
            fileName.textContent = file.name;
            fileMeta.textContent = `${(file.size / 1024).toFixed(2)} KB · ${file.type || '未知类型'}`;
            fileInfo.classList.add('active');
            renderFormatOptions();
            formatSelector.style.display = 'block';
            convertBtn.disabled = true;
        }

        function renderFormatOptions() {
            const formats = formatConfigs[currentCategory].formats;
            formatGrid.innerHTML = formats.map(f => 
                `<button class="format-btn" data-format="${f}">${f}</button>`
            ).join('');

            document.querySelectorAll('.format-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFormat = this.dataset.format;
                    convertBtn.disabled = false;
                });
            });
        }

        convertBtn.addEventListener('click', async () => {
            if (!currentFile || !currentFormat) return;

            progressBar.classList.add('active');
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 20;
                if (progress > 90) progress = 90;
                progressFill.style.width = progress + '%';
            }, 200);

            try {
                await convertFile();
                clearInterval(interval);
                progressFill.style.width = '100%';
                setTimeout(() => {
                    progressBar.classList.remove('active');
                    progressFill.style.width = '0%';
                }, 500);
                addToHistory();
            } catch (error) {
                clearInterval(interval);
                alert('转换失败: ' + error.message);
                progressBar.classList.remove('active');
                progressFill.style.width = '0%';
            }
        });

        async function convertFile() {
            return new Promise((resolve) => {
                setTimeout(() => {
                    if (currentFile.type.startsWith('image/')) {
                        convertImage(resolve);
                    } else {
                        convertOther(resolve);
                    }
                }, 800);
            });
        }

        function convertImage(callback) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    let mimeType = 'image/png';
                    let extension = 'png';
                    if (currentFormat === 'JPG') {
                        mimeType = 'image/jpeg';
                        extension = 'jpg';
                    } else if (currentFormat === 'WebP') {
                        mimeType = 'image/webp';
                        extension = 'webp';
                    } else if (currentFormat === 'GIF') {
                        mimeType = 'image/gif';
                        extension = 'gif';
                    } else if (currentFormat === 'BMP') {
                        mimeType = 'image/bmp';
                        extension = 'bmp';
                    }

                    canvas.toBlob((blob) => {
                        convertedBlob = blob;
                        showPreview(blob, mimeType);
                        setupDownload(blob, currentFile.name.replace(/\.[^/.]+$/, '') + '.' + extension);
                        callback();
                    }, mimeType, 0.95);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(currentFile);
        }

        function convertOther(callback) {
            const reader = new FileReader();
            reader.onload = (e) => {
                let resultContent = e.target.result;
                let mimeType = 'text/plain';
                let extension = 'txt';

                if (currentFormat === 'JSON' && currentFile.name.endsWith('.csv')) {
                    resultContent = csvToJson(resultContent);
                    mimeType = 'application/json';
                    extension = 'json';
                } else if (currentFormat === 'Base64') {
                    resultContent = btoa(unescape(encodeURIComponent(resultContent)));
                    extension = 'txt';
                } else if (currentFormat === 'HTML') {
                    resultContent = `<html><head><title>转换结果</title></head><body><pre>${resultContent}</pre></body></html>`;
                    mimeType = 'text/html';
                    extension = 'html';
                } else if (currentFormat === 'MD') {
                    extension = 'md';
                }

                convertedBlob = new Blob([resultContent], { type: mimeType });
                showTextPreview(resultContent);
                setupDownload(convertedBlob, currentFile.name.replace(/\.[^/.]+$/, '') + '.' + extension);
                callback();
            };
            reader.readAsText(currentFile);
        }

        function csvToJson(csv) {
            const lines = csv.trim().split('\n');
            if (lines.length === 0) return '[]';
            const headers = lines[0].split(',').map(h => h.trim());
            const result = lines.slice(1).map(line => {
                const values = line.split(',').map(v => v.trim());
                const obj = {};
                headers.forEach((h, i) => obj[h] = values[i] || '');
                return obj;
            });
            return JSON.stringify(result, null, 2);
        }

        function showPreview(blob, mimeType) {
            if (mimeType.startsWith('image/')) {
                const url = URL.createObjectURL(blob);
                previewContainer.innerHTML = `<img src="${url}" class="preview-img" alt="预览">`;
            }
        }

        function showTextPreview(text) {
            const preview = text.length > 500 ? text.substring(0, 500) + '...' : text;
            previewContainer.innerHTML = `<pre style="color: #94a3b8; text-align: left; white-space: pre-wrap; max-width: 100%; overflow: auto;">${preview}</pre>`;
        }

        function setupDownload(blob, filename) {
            downloadBtn.onclick = () => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            };
            downloadBtn.classList.add('active');
        }

        function addToHistory() {
            const item = {
                name: currentFile.name,
                format: currentFormat,
                time: new Date().toLocaleString('zh-CN')
            };
            history.unshift(item);
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div style="text-align: center; color: #64748b; padding: 30px;">暂无转换记录</div>';
                return;
            }
            historyList.innerHTML = history.map(item => `
                <div class="history-item">
                    <div class="history-info">
                        <div class="history-name">${item.name} → ${item.format}</div>
                        <div class="history-time">${item.time}</div>
                    </div>
                    <div style="color: #10b981; font-weight: 600;">✓ 成功</div>
                </div>
            `).join('');
        }

        function resetState() {
            currentFile = null;
            currentFormat = null;
            convertedBlob = null;
            fileInfo.classList.remove('active');
            formatSelector.style.display = 'none';
            convertBtn.disabled = true;
            downloadBtn.classList.remove('active');
            previewContainer.innerHTML = '<div class="preview-placeholder">转换后的文件将在这里预览</div>';
            fileInput.value = '';
        }
    </script>
</body>
</html>
