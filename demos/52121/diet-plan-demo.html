<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食疗计划 - 健康管理</title>
<style>
:root {
  --bg: #f7f5f0;
  --card-bg: #fffef9;
  --primary: #5b8c5a;
  --primary-light: #e8f4e8;
  --accent: #e07a3d;
  --accent-light: #fef3eb;
  --text: #2d2d2d;
  --text-secondary: #6b6b6b;
  --text-muted: #9a9a9a;
  --border: #e8e4db;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
  --radius-sm: 8px;
  --breakfast: #f5a623;
  --breakfast-light: #fef5e7;
  --lunch: #5b8c5a;
  --lunch-light: #e8f4e8;
  --dinner: #8e6bb5;
  --dinner-light: #f3edf9;
  --snack: #4a9eb5;
  --snack-light: #e5f3f7;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
.tab-bar {
  display: flex;
  gap: 0;
  background: white;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 0 16px;
}
.tab-bar button {
  flex: 0 0 auto;
  padding: 14px 20px;
  border: none;
  background: none;
  font-size: 15px;
  color: var(--text-secondary);
  cursor: pointer;
  font-family: var(--font);
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.tab-bar button.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 600;
}
.tab-bar button:hover { color: var(--primary); }
.page {
  display: none;
  max-width: 520px;
  margin: 0 auto;
  padding: 16px;
}
.page.active { display: block; }
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.card-title {
  font-size: 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.symptoms-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
}
.tag-symptom { background: var(--primary-light); color: var(--primary); }
.tag-remove {
  cursor: pointer;
  font-size: 14px;
  opacity: 0.5;
  margin-left: 2px;
}
.tag-remove:hover { opacity: 1; }
.week-preview {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 8px 0;
  margin-bottom: 12px;
  scrollbar-width: thin;
  -webkit-overflow-scrolling: touch;
}
.week-preview::-webkit-scrollbar { height: 3px; }
.week-preview::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.day-dot {
  flex: 0 0 auto;
  min-width: 64px;
  text-align: center;
  padding: 10px 6px;
  background: var(--primary-light);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: transform 0.15s;
}
.day-dot:hover { transform: translateY(-2px); }
.day-dot .day-emoji { font-size: 20px; }
.day-dot .day-label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.day-dot .day-theme { font-size: 11px; color: var(--text); font-weight: 500; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 54px; }
.day-dot.today { background: var(--primary); color: white; }
.day-dot.today .day-label,
.day-dot.today .day-theme { color: rgba(255,255,255,0.9); }
.review-snippet {
  font-size: 13px;
  color: var(--text-secondary);
  font-style: italic;
  padding: 10px;
  background: #fafaf7;
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--primary);
  margin-bottom: 12px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 18px;
  border-radius: 20px;
  border: none;
  font-size: 14px;
  cursor: pointer;
  font-family: var(--font);
  transition: all 0.2s;
  font-weight: 500;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { opacity: 0.9; }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-outline { background: none; border: 1.5px solid var(--primary); color: var(--primary); }
.btn-outline:hover { background: var(--primary-light); }
.btn-sm { padding: 4px 12px; font-size: 12px; }
.btn-accent { background: var(--accent); color: white; }
.btn-accent:hover { opacity: 0.9; }
.btn-text { background: none; border: none; color: var(--primary); padding: 4px 8px; font-size: 13px; }
.btn-text:hover { text-decoration: underline; }
.direction-card {
  background: linear-gradient(135deg, #f0f7ee, #faf8f0);
  border: 1.5px solid var(--primary);
  border-radius: var(--radius-sm);
  padding: 14px;
}
.direction-name {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
}
.direction-principles {
  display: flex;
  gap: 16px;
  margin-top: 10px;
}
.principle-col {
  flex: 1;
  font-size: 13px;
}
.principle-col .label {
  font-weight: 600;
  margin-bottom: 4px;
  font-size: 12px;
  letter-spacing: 0.5px;
}
.principle-col.good .label { color: var(--primary); }
.principle-col.bad .label { color: var(--accent); }

/* ===== Day Card ===== */
.day-card {
  border-left: 4px solid var(--primary);
  transition: border-color 0.3s;
  overflow: hidden;
}
.day-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
}
.day-date { font-size: 15px; font-weight: 600; }
.day-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.day-emoji { font-size: 28px; }
.day-summary {
  font-size: 13px;
  color: var(--text-secondary);
  padding: 10px 14px;
  background: #fafaf7;
  border-radius: var(--radius-sm);
  margin: 10px 0;
  border-left: 3px solid var(--primary);
  line-height: 1.7;
}
.meal-section {
  margin: 10px 0;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border);
}
.meal-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 600;
}
.meal-header .meal-icon { font-size: 16px; }
.meal-breakfast .meal-header { background: var(--breakfast-light); color: var(--breakfast); }
.meal-lunch .meal-header { background: var(--lunch-light); color: var(--lunch); }
.meal-dinner .meal-header { background: var(--dinner-light); color: var(--dinner); }
.meal-snack .meal-header { background: var(--snack-light); color: var(--snack); }
.meal-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  flex: 1;
}
.meal-swap {
  font-size: 11px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(0,0,0,0.04);
  border: none;
  font-family: var(--font);
  transition: background 0.15s;
}
.meal-swap:hover { background: rgba(0,0,0,0.08); color: var(--text-secondary); }
.meal-body { padding: 10px 12px; font-size: 13px; line-height: 1.7; }
.meal-ingredients {
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.meal-ingredients strong { color: var(--text); font-weight: 500; }
.meal-benefit {
  font-size: 12px;
  color: var(--text-muted);
  font-style: italic;
  padding-top: 6px;
  border-top: 1px dashed var(--border);
}
.tea-recommendation {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: #fafaf7;
  border-radius: var(--radius-sm);
  margin: 8px 0;
  font-size: 12px;
  color: var(--text-secondary);
}
.tea-recommendation .tea-icon { font-size: 16px; }

.card-body {
  overflow: hidden;
  transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease, margin 0.35s ease;
}
.card-body.collapsed {
  max-height: 0 !important;
  opacity: 0;
  margin: 0 !important;
  padding-top: 0 !important;
  padding-bottom: 0 !important;
}
.expand-icon {
  font-size: 11px;
  color: var(--text-muted);
  transition: transform 0.3s;
  margin-left: 8px;
}
.expand-icon.rotated { transform: rotate(180deg); }
.diet-form { margin-top: 14px; }
.diet-form label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 4px;
  margin-top: 10px;
}
.diet-form textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px;
  font-size: 13px;
  font-family: var(--font);
  resize: vertical;
  min-height: 50px;
  background: white;
}
.diet-form textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-light);
}
.ai-clinic-input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px;
  font-size: 13px;
  font-family: var(--font);
  margin-top: 10px;
  resize: vertical;
  min-height: 60px;
  background: white;
}
.ai-clinic-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-light);
}
.saved-indicator {
  font-size: 12px;
  color: var(--primary);
  opacity: 0;
  transition: opacity 0.3s;
}
.saved-indicator.show { opacity: 1; }
.review-list {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 2;
  margin-bottom: 12px;
}
.review-item { padding: 2px 0; }
.summary-box {
  background: #fafaf7;
  border-radius: var(--radius-sm);
  padding: 14px;
  font-size: 14px;
  line-height: 1.8;
  margin-top: 12px;
  border: 1px solid var(--border);
}
.tip-box {
  background: var(--accent-light);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 12px;
  color: var(--accent);
  margin: 10px 0;
  line-height: 1.6;
}
.tip-box strong { color: var(--accent); }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  transition: background 0.3s ease, opacity 0.3s ease;
  pointer-events: none;
  opacity: 0;
}
.modal-overlay.show {
  background: rgba(0,0,0,0.4);
  pointer-events: auto;
  opacity: 1;
}
.modal-overlay.center { align-items: center; }
.modal {
  background: white;
  border-radius: 16px 16px 0 0;
  padding: 10px 20px 30px;
  width: 100%;
  max-width: 500px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.modal-overlay.center .modal {
  border-radius: 16px;
  margin: 20px;
  transform: scale(0.95) translateY(10px);
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
}
.modal-overlay.show .modal { transform: translateY(0); }
.modal-overlay.center.show .modal { transform: scale(1) translateY(0); }
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
  position: sticky;
  top: 0;
  background: white;
  z-index: 1;
}
.modal-title { font-size: 17px; font-weight: 600; }
.modal-close {
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--text-muted);
  padding: 4px;
  line-height: 1;
}
.symptom-checklist label {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s;
  font-size: 14px;
}
.symptom-checklist label:hover { background: #f7f7f4; }
.symptom-checklist input[type="checkbox"] {
  width: 20px;
  height: 20px;
  accent-color: var(--primary);
  flex-shrink: 0;
}
.add-symptom-row {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}
.add-symptom-row input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 14px;
  font-family: var(--font);
}
.add-symptom-row input:focus { outline: none; border-color: var(--primary); }
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #333;
  color: white;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 300;
  opacity: 0;
  transition: all 0.3s ease;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
}
.analyzing-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.heatmap { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px; }
.heatmap-cell {
  width: 18px;
  height: 18px;
  border-radius: 3px;
  transition: transform 0.15s;
  cursor: pointer;
}
.heatmap-cell:hover { transform: scale(1.3); }
.heatmap-0 { background: #ebedf0; }
.heatmap-1 { background: #f9c4c4; }
.heatmap-2 { background: #f7e08c; }
.heatmap-3 { background: #7bc96f; }
.week-nutrition {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.nutrient-tag {
  text-align: center;
  padding: 8px 4px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  background: #fafaf7;
  border: 1px solid var(--border);
}
.nutrient-tag .num { font-size: 16px; font-weight: 700; color: var(--primary); }
.nutrient-tag .label { color: var(--text-muted); margin-top: 2px; }

/* Today highlight */
.day-card.today-card {
  border-left: 4px solid var(--accent);
  background: linear-gradient(to right, var(--accent-light), var(--card-bg) 30%);
  box-shadow: 0 4px 16px rgba(224,122,61,0.12);
}
.day-card.today-card .day-header { position: relative; }
.today-badge {
  display: inline-block;
  background: var(--accent);
  color: white;
  font-size: 10px;
  padding: 1px 8px;
  border-radius: 10px;
  margin-left: 8px;
  font-weight: 600;
  vertical-align: middle;
}

/* Meal nutrition tags */
.meal-tags {
  display: flex;
  gap: 4px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.meal-tag {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 4px;
  font-weight: 500;
}
.meal-tag.staple { background: #fef3e0; color: #d4880f; }
.meal-tag.protein { background: #fce8e8; color: #c45c5c; }
.meal-tag.veg { background: #e6f4e6; color: #4a8c4a; }
.meal-tag.soup { background: #e8f0fa; color: #4a7ab5; }
.meal-tag.fruit { background: #f3e8fa; color: #8e6bb5; }

/* Weekly overview */
.week-overview {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 12px 0;
}
.overview-item {
  text-align: center;
  padding: 10px 4px;
  background: #fafaf7;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
.overview-item .ov-num { font-size: 20px; font-weight: 700; color: var(--primary); }
.overview-item .ov-label { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

/* Season indicator */
.season-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 500;
}

/* Progress bar */
.progress-bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 8px;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: 3px;
  transition: width 0.5s ease;
}
.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* AI clinic result */
.clinic-result {
  background: var(--primary-light);
  border-radius: var(--radius-sm);
  padding: 12px;
  margin-top: 12px;
  font-size: 13px;
  line-height: 1.7;
  display: none;
}
.clinic-result.show { display: block; }
.clinic-result .cr-title { font-weight: 600; color: var(--primary); margin-bottom: 6px; }

/* Direction mix indicator */
.dir-mix {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.dir-chip {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: white;
  border: 1px solid var(--border);
  color: var(--text-secondary);
}
.dir-chip.primary { background: var(--primary); color: white; border-color: var(--primary); }

/* Meal body enhancement */
.meal-section { margin: 8px 0; }
.meal-body { padding: 10px 12px 12px; }

/* Tea rotation */
.tea-recommendation {
  background: linear-gradient(135deg, #f0f7ee, #faf8f0);
  border: 1px dashed var(--primary);
}

/* ===== Today Hero Card ===== */
.today-hero {
  background: linear-gradient(135deg, var(--primary) 0%, #6ba06a 50%, var(--accent) 100%);
  color: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.today-hero::before {
  content: '';
  position: absolute;
  top: -30px; right: -30px;
  width: 120px; height: 120px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
}
.today-hero::after {
  content: '';
  position: absolute;
  bottom: -40px; left: -20px;
  width: 100px; height: 100px;
  background: rgba(255,255,255,0.05);
  border-radius: 50%;
}
.today-greeting {
  font-size: 13px;
  opacity: 0.85;
  margin-bottom: 4px;
}
.today-date-line {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 12px;
}
.today-dir-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(4px);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  margin-bottom: 14px;
}
.today-meals-compact {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(4px);
  border-radius: 12px;
  padding: 12px;
}
.today-meal-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
}
.today-meal-row + .today-meal-row {
  border-top: 1px solid rgba(255,255,255,0.15);
}
.tm-label {
  font-size: 11px;
  width: 28px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.2);
  border-radius: 6px;
  flex-shrink: 0;
  font-weight: 600;
}
.tm-name {
  flex: 1;
  font-size: 14px;
  font-weight: 500;
}
.tm-swap {
  font-size: 11px;
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  padding: 3px 10px;
  border-radius: 10px;
  cursor: pointer;
  font-family: var(--font);
  transition: background 0.2s;
}
.tm-swap:hover { background: rgba(255,255,255,0.35); }
.today-tea-line {
  margin-top: 10px;
  padding-top: 10px;

  // ========== 工具函数 ==========
  function formatDate(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function formatDateShort(dateStr) {
    var p = dateStr.split('-');
    return parseInt(p[1]) + '/' + parseInt(p[2]);
  }
  function getCurrentWeek() {
    var now = new Date();
    var dow = now.getDay();
    var mondayOffset = dow === 0 ? -6 : 1 - dow;
    var monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + mondayOffset);
    var days = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(monday);
      d.setDate(monday.getDate() + i);
      days.push({date:formatDate(d), dayLabel:WEEKDAY_LABELS[i], dayIndex:i, isToday:formatDate(d)===formatDate(now)});
    }
    return days;
  }
  function daysBetween(start) {
    return Math.ceil((new Date() - new Date(start)) / 86400000);
  }
  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(function(){toast.classList.remove('show');}, 2500);
  }
  function escapeHTML(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
  function pickRandom(arr, exclude) {
    var pool = arr.filter(function(_, i){return !exclude || exclude.indexOf(i) === -1;});
    if (pool.length === 0) return arr[Math.floor(Math.random()*arr.length)];
    return pool[Math.floor(Math.random()*pool.length)];
  }
  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length-1; i>0; i--) {
      var j = Math.floor(Math.random()*(i+1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ========== 智能辅助函数 ==========
  function getSeason() {
    var m = new Date().getMonth() + 1;
    if (m >= 3 && m <= 5) return {name:'春', emoji:'🌸', favor:['春笋','菠菜','韭菜','香菜']};
    if (m >= 6 && m <= 8) return {name:'夏', emoji:'☀️', favor:['冬瓜','苦瓜','绿豆','西瓜','番茄']};
    if (m >= 9 && m <= 11) return {name:'秋', emoji:'🍂', favor:['山药','百合','梨','银耳','莲藕']};
    return {name:'冬', emoji:'❄️', favor:['羊肉','栗子','核桃','红枣','萝卜']};
  }

  // 自动推断食谱营养类型标签
  function inferMealTags(meal) {
    var tags = [];
    var name = meal.name || '';
    var ingText = (meal.ingredients || []).join(' ');
    var all = name + ingText;
    if (/粥|饭|面|燕麦|糙米|杂粮|小米|大米|馒头|红薯|紫薯|南瓜饼/.test(all)) tags.push({key:'staple', label:'主食'});
    if (/排骨|鸡|肉|鱼|虾|蛋|牛肉|乌骨鸡|瘦肉|猪腰|豆腐|豆浆|虾仁/.test(all)) tags.push({key:'protein', label:'蛋白'});
    if (/菠菜|芹菜|白菜|青菜|黄瓜|冬瓜|苦瓜|西兰花|胡萝卜|白萝卜|番茄|木耳|百合|西芹|豆芽|韭菜|藕|生菜|菜/.test(all)) tags.push({key:'veg', label:'蔬菜'});
    if (/汤|羹/.test(name)) tags.push({key:'soup', label:'汤品'});
    if (/苹果|香蕉|梨|火龙果|猕猴桃|桑葚|蓝莓|西瓜|水果|橙|橘/.test(all)) tags.push({key:'fruit', label:'水果'});
    if (tags.length === 0) tags.push({key:'staple', label:'主食'});
    return tags;
  }

  // 提取主要食材关键词（用于去重）
  function extractKeyIngredients(meal) {
    var keys = ['山药','小米','南瓜','莲子','茯苓','薏米','红枣','陈皮','枸杞','排骨','鸡','鱼','虾','核桃',
      '黑芝麻','黑豆','栗子','百合','银耳','红薯','燕麦','绿豆','苦瓜','冬瓜','萝卜','桂圆','酸枣仁',
      '菠菜','芹菜','豆腐','牛肉','羊肉','韭菜','桑葚','菊花','玫瑰花','黄芪','党参','赤小豆','玉米须',
      '香蕉','蜂蜜','黑芝麻','火龙果','猕猴桃','梨','莲藕','西兰花','番茄','鸡蛋','牛奶','酸奶','木耳'];
    var found = [];
    var all = meal.name + (meal.ingredients||[]).join('');
    keys.forEach(function(k){ if (all.indexOf(k) !== -1) found.push(k); });
    return found;
  }

  // 从用户反馈中学习偏好
  function learnPreferences(cards) {
    var liked = [];
    var disliked = [];
    // 负面词必须先匹配（"不舒服"含"舒服"，但应判为负面）
    var badWords = ['不舒服','不适','难受','拉肚子','过敏','不好','上火','腻','不消化','腹胀','恶心','不好吃','胀','拉肚子','胃痛','反酸','烧心','困倦','犯困','失眠','长痘','口干','口苦','便秘加重','腹泻'];
    var goodWords = ['舒服了','好多了','很舒服','挺好','清爽','温暖','舒服','好','不错','喜欢','适合','好吃','精神','睡得好','通便','消化好','轻松','好转'];
    cards.forEach(function(c) {
      if (!c.reviewText) return;
      var text = c.reviewText;
      // 先查负面
      var isBad = badWords.some(function(w){return text.indexOf(w)!==-1;});
      // 如果有负面，不再判正面；只有无负面时才判正面
      var isGood = !isBad && goodWords.some(function(w){return text.indexOf(w)!==-1;});
      // 结合打卡感受
      if (c.checkin && c.checkin.feeling) {
        if (c.checkin.feeling === 'bad' || c.checkin.feeling === 'meh') isBad = true;
        if (c.checkin.feeling === 'good' && !isBad) isGood = true;
      }
      var allMeals = [c.meals.breakfast, c.meals.lunch, c.meals.dinner, c.meals.snack];
      allMeals.forEach(function(m) {
        if (!m) return;
        var ings = extractKeyIngredients(m);
        if (isGood && !isBad) ings.forEach(function(i){ if (liked.indexOf(i)===-1) liked.push(i); });
        if (isBad) ings.forEach(function(i){ if (disliked.indexOf(i)===-1) disliked.push(i); });
      });
    });
    // 加入用户手动标记的忌口
    (store.dislikedFoods||[]).forEach(function(f){ if(disliked.indexOf(f)===-1) disliked.push(f); });
    return {liked: liked, disliked: disliked};
  }

  // 选择当天调理方向（混合主方向+平和+变化）
  function selectDayDirection(primaryKey, dayIndex, prefs) {
    // 每周约4天主方向，2天混合/平和，1天根据反馈微调
    var pattern = [primaryKey, primaryKey, 'balanced', primaryKey, primaryKey, 'balanced', primaryKey];
    var dir = pattern[dayIndex] || primaryKey;
    // 如果有明确喜欢的方向食材，增加该方向的出现
    if (prefs.liked.length > 0 && Math.random() < 0.25) {
      dir = 'balanced'; // 用平和日尝试多样食材
    }
    return dir;
  }

  // 从食谱库按条件选菜
  function pickMeal(recipes, category, options) {
    options = options || {};
    var list = recipes[category] || [];
    if (!list.length) return null;
    var recentIngs = options.recentIngredients || [];
    var disliked = options.disliked || [];
    var usedIdxs = options.usedIndices || [];
    var liked = options.liked || [];
    var season = options.season || getSeason();

    // 打分排序
    var scored = list.map(function(meal, idx) {
      var score = Math.random() * 10;
      // 已用过的减分
      if (usedIdxs.indexOf(idx) !== -1) score -= 20;
      var ings = extractKeyIngredients(meal);
      var all = meal.name + (meal.ingredients||[]).join('');
      // 近2天用过的食材减分
      var recentOverlap = ings.filter(function(i){return recentIngs.indexOf(i)!==-1;}).length;
      score -= recentOverlap * 4;
      // 不喜欢的食材大幅减分（硬排除的话-100）
      var badOverlap = ings.filter(function(i){return disliked.indexOf(i)!==-1;}).length;
      score -= badOverlap * 20;
      // 喜欢的食材加分
      var goodOverlap = ings.filter(function(i){return liked.indexOf(i)!==-1;}).length;
      score += goodOverlap * 3;
      // 季节加分：当季食材推荐
      var seasonMatch = season.favor.filter(function(f){return all.indexOf(f)!==-1;}).length;
      score += seasonMatch * 2;
      // 反季节减分（夏季避免过于温热、冬季避免过于寒凉）
      if (season.name === '夏' && /姜|桂圆|羊肉|红糖|核桃|当归|黄芪|红枣/.test(all) && category !== 'tea') score -= 1;
      if (season.name === '冬' && /绿豆|苦瓜|冬瓜|西瓜|梨/.test(all) && category === 'breakfast') score -= 1;
      return {meal: meal, idx: idx, score: score, ings: ings};
    });
    scored.sort(function(a,b){return b.score - a.score;});
    var top = scored.slice(0, 3); // 从前3个中随机选
    var chosen = top[Math.floor(Math.random()*top.length)];
    var mealWithIdx = Object.assign({}, chosen.meal, {_idx: chosen.idx, _tags: inferMealTags(chosen.meal), _ings: chosen.ings});
    return {meal: mealWithIdx, ings: chosen.ings};
  }

  // ========== 食谱生成 ==========
  function generateDayMeals(dirKey, context) {
    context = context || {};
    var recipes = RECIPES[dirKey] || RECIPES.balanced;
    var usedIndices = context.usedIndices || {breakfast:[], lunch:[], dinner:[], snack:[]};
    var recentIngs = context.recentIngredients || [];
    var prefs = context.prefs || {liked:[], disliked:[]};
    var season = getSeason();

    function pick(category) {
      var res = pickMeal(recipes, category, {
        usedIndices: usedIndices[category] || [],
        recentIngredients: recentIngs,
        disliked: prefs.disliked,
        liked: prefs.liked
      });
      if (!res) return null;
      (usedIndices[category] = usedIndices[category] || []).push(res.meal._idx);
      res.ings.forEach(function(i){ if (recentIngs.indexOf(i)===-1) recentIngs.push(i); });
      return res.meal;
    }

    var breakfast = pick('breakfast');
    var lunch = pick('lunch');
    var dinner = pick('dinner');
    var snack = null;
    if (Math.random() > 0.35 && recipes.snack && recipes.snack.length) {
      snack = pick('snack');
    }
    // 茶品从数组中随机选择
    var teaList = recipes.tea || RECIPES.balanced.tea;
    var tea = Array.isArray(teaList) ? teaList[Math.floor(Math.random()*teaList.length)] : teaList;

    // 确保标签存在
    [breakfast, lunch, dinner, snack].forEach(function(m){ if(m && !m._tags) m._tags = inferMealTags(m); });

    return {
      dirKey: dirKey,
      breakfast: breakfast,
      lunch: lunch,
      dinner: dinner,
      snack: snack,
      tea: tea,
      themeShort: (breakfast.name||'').substring(0,4),
      tip: generateTip(dirKey),
      season: season
    };
  }

  function generateWeekCards(primaryDirKey, week) {
    var usedIndices = {breakfast:[], lunch:[], dinner:[], snack:[]};
    var recentIngredients = [];
    var prefs = store ? learnPreferences(store.plan && store.plan.cards ? store.plan.cards : []) : {liked:[], disliked:[]};

    return week.map(function(day, i) {
      var dayDir = selectDayDirection(primaryDirKey, i, prefs);
      var meals = generateDayMeals(dayDir, {
        usedIndices: usedIndices,
        recentIngredients: recentIngredients,
        prefs: prefs
      });
      // 保留最近3天食材记忆（滑动窗口）
      if (recentIngredients.length > 20) recentIngredients.splice(0, recentIngredients.length - 12);
      return {
        id: i+1,
        date: day.date,
        dayIndex: day.dayIndex,
        dayLabel: day.dayLabel,
        isToday: day.isToday,
        dirKey: dayDir,
        meals: meals,
        actualFood: '',
        reviewText: '',
        checkin: {breakfast:null, lunch:null, dinner:null, feeling:null},
        collapsed: day.isToday ? false : (i > 0 ? true : false)
      };
    });
  }

  function swapMeal(dayIndex, mealType) {
    var card = store.plan.cards.find(function(c){return c.dayIndex===dayIndex;});
    if (!card) return;
    var dirKey = card.dirKey || store.direction.key;
    var recipes = RECIPES[dirKey] || RECIPES.balanced;
    var list = recipes[mealType];
    if (!list) return;

    // 收集近2天的食材用于去重
    var recentIngs = [];
    var cardIdx = store.plan.cards.indexOf(card);
    for (var ii = Math.max(0, cardIdx-2); ii <= Math.min(store.plan.cards.length-1, cardIdx+1); ii++) {
      if (ii === cardIdx) continue;
      var c = store.plan.cards[ii];
      ['breakfast','lunch','dinner','snack'].forEach(function(mt){
        if (c.meals[mt] && c.meals[mt]._ings) c.meals[mt]._ings.forEach(function(i){
          if (recentIngs.indexOf(i)===-1) recentIngs.push(i);
        });
      });
    }

    // 当前餐的食材加入排除
    if (card.meals[mealType] && card.meals[mealType]._ings) {
      card.meals[mealType]._ings.forEach(function(i){ if(recentIngs.indexOf(i)===-1) recentIngs.push(i); });
    }

    var prefs = learnPreferences(store.plan.cards);
    var currentIdx = card.meals[mealType]._idx;
    var res = pickMeal(recipes, mealType, {
      usedIndices: [currentIdx],
      recentIngredients: recentIngs,
      disliked: prefs.disliked,
      liked: prefs.liked
    });
    if (res) {
      card.meals[mealType] = res.meal;
      card.meals.themeShort = (card.meals.breakfast.name||'').substring(0,4);
      saveStore();
      renderDayCards();
      renderHealthPanel();
      showToast('已更换' + (mealType==='breakfast'?'早餐':mealType==='lunch'?'午餐':mealType==='dinner'?'晚餐':'加餐'));
    }
  }

  function computeDirection(symptomNames) {
    if (!symptomNames || symptomNames.length===0) {
      var d = DIRECTION_MAP._default;
      return {key:d.key,name:d.name,emoji:d.emoji,explanation:d.explanation,good:d.good.slice(0,5),bad:d.bad.slice(0,4)};
    }
    var dirCounts = {};
    symptomNames.forEach(function(name) {
      var dir = DIRECTION_MAP[name] || DIRECTION_MAP._default;
      dirCounts[dir.key] = (dirCounts[dir.key]||0)+1;
    });
    var bestKey=null, bestCount=0;
    Object.keys(dirCounts).forEach(function(k){if(dirCounts[k]>bestCount){bestCount=dirCounts[k];bestKey=k;}});
    var bestDir = DIRECTION_MAP._default;
    Object.keys(DIRECTION_MAP).forEach(function(k){if(DIRECTION_MAP[k].key===bestKey)bestDir=DIRECTION_MAP[k];});
    var names = symptomNames.join('、');
    return {key:bestDir.key,name:bestDir.name,emoji:bestDir.emoji,
      explanation:'根据你「'+names+'」的症状，调理方向为'+bestDir.name+'。'+bestDir.explanation,
      good:bestDir.good.slice(0,5),bad:bestDir.bad.slice(0,4)};
  }

  // ========== 存储 ==========
  function saveStore() { try{localStorage.setItem(STORAGE_KEY, JSON.stringify(store));}catch(e){} }
  function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveStore, DEBOUNCE_MS); }
  function loadStore() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      // Try migration from v4
      if (!saved) saved = localStorage.getItem('dietPlanStore_v4');
      // Try migration from v3
      if (!saved) saved = localStorage.getItem('dietPlanStore_v3');
      if (saved) {
        var parsed = JSON.parse(saved);
        var week = getCurrentWeek();
        store = getDefaultStore();
        store.symptoms = (parsed.symptoms || store.symptoms).map(function(s){
          return Object.assign({}, s, {
            severity: s.severity || 3,
            severityHistory: s.severityHistory || {}
          });
        });
        store.nextId = parsed.nextId || store.nextId;
        store.heatmapData = parsed.heatmapData || {};
        store.dislikedFoods = parsed.dislikedFoods || [];
        store.isFirstRun = false;
        store.direction = parsed.direction || computeDirection(store.symptoms.map(function(s){return s.name;}));
        if (parsed.plan && parsed.plan.weekStart === week[0].date && parsed.plan.cards && parsed.plan.cards[0] && parsed.plan.cards[0].meals) {
          store.plan.cards = parsed.plan.cards.map(function(c, i) {
            var day = week[i];
            var migrated = Object.assign({}, c, {date:day.date, dayLabel:day.dayLabel, dayIndex:day.dayIndex, isToday:day.isToday, dirKey:c.dirKey||store.direction.key, collapsed:day.isToday?false:(i>0)});
            // 迁移：为旧数据添加 _tags 和 _ings
            ['breakfast','lunch','dinner','snack'].forEach(function(mt){
              if (migrated.meals[mt]) {
                if (!migrated.meals[mt]._tags) migrated.meals[mt]._tags = inferMealTags(migrated.meals[mt]);
                if (!migrated.meals[mt]._ings) migrated.meals[mt]._ings = extractKeyIngredients(migrated.meals[mt]);
              }
            });
            // 迁移旧的 snacks 数组到 snack
            if (migrated.meals.snacks && migrated.meals.snacks.length && !migrated.meals.snack) {
              migrated.meals.snack = migrated.meals.snacks[0];
            }
            delete migrated.meals.snacks;
            // 迁移打卡数据
            migrated.checkin = migrated.checkin || {breakfast:null, lunch:null, dinner:null, feeling:null};
            return migrated;
          });
          store.plan.weekStart = week[0].date;
          store.plan.summary = parsed.plan.summary || null;
        } else {
          store.plan = {id:(parsed.plan?.id||0)+1, weekStart:week[0].date, cards:generateWeekCards(store.direction.key, week), summary:null};
          showToast('新的一周，已为你生成新的食谱计划');
        }
        return true;
      }
    } catch(e) { console.warn('加载失败', e); }
    return false;
  }

  function calcWeekStats(cards) {
    var totalMeals = 0, hasProtein = 0, hasVeg = 0, uniqueIngs = {};
    cards.forEach(function(c){
      [c.meals.breakfast, c.meals.lunch, c.meals.dinner].forEach(function(m){
        if (!m) return;
        totalMeals++;
        (m._tags||[]).forEach(function(t){
          if (t.key==='protein') hasProtein++;
          if (t.key==='veg') hasVeg++;
        });
        (m._ings||[]).forEach(function(i){ uniqueIngs[i] = true; });
      });
    });
    var uniqueCount = Object.keys(uniqueIngs).length;
    var reviewedDays = cards.filter(function(c){return c.reviewText;}).length;
    return {
      totalMeals: totalMeals,
      proteinRate: totalMeals ? Math.round(hasProtein/totalMeals*100) : 0,
      vegRate: totalMeals ? Math.round(hasVeg/totalMeals*100) : 0,
      uniqueIngs: uniqueCount,
      reviewedDays: reviewedDays,
      totalDays: cards.length
    };
  }

  // ========== 症状追踪渲染 ==========
  function calcSymptomTrend(sym) {
    var hist = sym.severityHistory || {};
    var dates = Object.keys(hist).sort();
    if (dates.length < 2) return {trend:'flat', text:'—'};
    var recent = dates.slice(-3).map(function(d){return hist[d];});
    var older = dates.slice(0, Math.max(2, dates.length-3)).map(function(d){return hist[d];});
    var avg = function(arr){return arr.reduce(function(a,b){return a+b;},0)/arr.length;};
    var diff = avg(recent) - avg(older);
    if (diff < -0.3) return {trend:'down', text:'↓ 好转'};
    if (diff > 0.3) return {trend:'up', text:'↑ 加重'};
    return {trend:'flat', text:'→ 稳定'};
  }

      }

        + '<span class="sym-name">'+escapeHTML(s.name)+'</span>'
        + '<div class="severity-dots">'+dots+'</div>'
        + '<span class="sym-trend '+trend.trend+'">'+trend.text+'</span>'
        + '<button class="sym-remove-s" onclick="triggerArchive('+s.id+')" title="移除">×</button>'
        + '</div>';
    }).join('');
  }

  function setSeverity(symId, level) {
    var s = store.symptoms.find(function(x){return x.id===symId;});
    if (!s) return;
    s.severity = level;
    s.severityHistory = s.severityHistory || {};

  function renderHeatmap() {
    var container = document.getElementById('heatmap');
    if (!container) return;
    var cells = [];
    var today = new Date();
    for (var i = 27; i >= 0; i--) {
      var d = new Date(today);
      d.setDate(today.getDate() - i);
      var dStr = formatDate(d);
      var level = 0;
      var review = '';
      store.plan.cards.forEach(function(c) {
        if (c.date === dStr) {
          var ci = c.checkin || {};
          if (ci.feeling === 'good' || (c.reviewText && isPositiveReview(c.reviewText))) level = 3;
          else if (ci.feeling === 'bad' || (c.reviewText && isNegativeReview(c.reviewText))) level = 1;
          else if (ci.feeling || c.reviewText) level = 2;
          if (c.reviewText) review = c.reviewText;
        }
      });
      if (store.heatmapData[dStr] !== undefined) level = store.heatmapData[dStr];
      cells.push('<span class="heatmap-cell heatmap-'+level+'" title="'+escapeHTML(dStr+(review?' '+review:''))+'"></span>');
    }
    container.innerHTML = cells.join('');
  }

  function isPositiveReview(text) {
    var goodWords = ['舒服了','好多了','很舒服','挺好','清爽','温暖','舒服','不错','喜欢','适合','好吃','精神','睡得好','通便','消化好','轻松','好转'];
    var badWords = ['不舒服','不适','难受','拉肚子','过敏','不好','上火','腻','不消化','腹胀','恶心'];
    if (badWords.some(function(w){return text.indexOf(w)!==-1;})) return false;
    return goodWords.some(function(w){return text.indexOf(w)!==-1;});
  }
  function isNegativeReview(text) {
    var badWords = ['不舒服','不适','难受','拉肚子','过敏','不好','上火','腻','不消化','腹胀','恶心','胃痛','反酸','拉肚子'];
    return badWords.some(function(w){return text.indexOf(w)!==-1;});
  }

  function swapDay(dayIndex) {
    var card = store.plan.cards.find(function(c){return c.dayIndex===dayIndex;});
    if (!card) return;
    var dirKey = card.dirKey || store.direction.key;
    var used = {breakfast:[], lunch:[], dinner:[], snack:[]};
    var recentIngs = [];
    var cardIdx = store.plan.cards.indexOf(card);
    store.plan.cards.forEach(function(c, ci) {
      ['breakfast','lunch','dinner','snack'].forEach(function(mt) {
        if (c.dayIndex !== dayIndex && c.meals[mt] && c.meals[mt]._idx !== undefined) {
          if (!used[mt]) used[mt] = [];
          used[mt].push(c.meals[mt]._idx);
        }
        if (c.dayIndex !== dayIndex && c.meals[mt] && c.meals[mt]._ings) {
          if (Math.abs(ci - cardIdx) <= 2) {
            c.meals[mt]._ings.forEach(function(i){ if(recentIngs.indexOf(i)===-1) recentIngs.push(i); });
          }
        }
      });
    });
    var prefs = learnPreferences(store.plan.cards);
    card.meals = generateDayMeals(dirKey, {usedIndices: used, recentIngredients: recentIngs, prefs: prefs});
    card.dirKey = dirKey;
    saveStore();
    renderDayCards();
    renderHealthPanel();
    showToast('已为你换一天全新食谱');
  }

  function addSymptom() {
    var input = document.getElementById('newSymptomInput');
    var name = input.value.trim();
    if (!name) return;
    if (store.symptoms.find(function(s){return s.name===name;})) {showToast('症状已存在');return;}
    // 检查是否在知识库中，不在的话尝试模糊匹配
    if (!DIRECTION_MAP[name]) {
      var fuzzyMap = {'胀':'胃胀气','胀气':'胃胀气','胃不舒服':'胃胀气','睡不好':'睡眠浅','睡不着':'失眠','做梦多':'多梦','耳朵响':'耳鸣','腰酸':'腰痛','口疮':'口腔溃疡','上火':'口腔溃疡','疲惫':'乏力','没力气':'乏力','没精神':'乏力','手脚凉':'怕冷','拉不出':'便秘','拉肚子':'腹泻','湿气':'湿气重','浮肿':'水肿','眼睛干':'眼干','头疼':'头晕','脾气大':'易怒','爱生气':'易怒','烦躁':'易怒','口苦':'口干','痘痘':'长痘','心慌':'心悸'};
      var matched = null;
      Object.keys(fuzzyMap).forEach(function(kw){if(name.indexOf(kw)!==-1||kw.indexOf(name)!==-1)matched=fuzzyMap[kw];});
      if (matched) {
        showToast('识别为「'+matched+'」，已自动归类');
        name = matched;
      } else {
        showToast('未识别该症状，将采用平和调理方案');
      }
    }
    if (store.symptoms.find(function(s){return s.name===name;})) {showToast('症状已存在');return;}
    store.symptoms.push({id:store.nextId++, name:name, severity:3, createdAt:formatDate(new Date()), severityHistory:{}});
    var newDir = computeDirection(store.symptoms.map(function(s){return s.name;}));
    var changed = !store.direction || store.direction.key !== newDir.key;
    store.direction = newDir;
    if (changed) {
      store.plan.cards = generateWeekCards(newDir.key, getCurrentWeek());
      store.plan.summary = null;
    }
    closeAddSymptom();
    saveStore();
    renderAll();
    showToast('症状已添加');
    if (changed) setTimeout(function(){showDirectionModal();}, 400);
  }

      {name:'眼干', checked:false}
    ];
    document.getElementById('initChecklist').innerHTML = commonSymptoms.map(function(c){
      return '<label><input type="checkbox" '+(c.checked?'checked':'')+' data-name="'+escapeHTML(c.name)+'"><span>'+escapeHTML(c.name)+'</span></label>';
    }).join('');
    document.getElementById('initNewSymptom').value = '';
    openModal('initModal');
  }
  function closeInitModal() {
    closeModal('initModal');
    store.isFirstRun = false;
    saveStore();
    renderAll();
  }
  function addInitSymptom() {
    var input = document.getElementById('initNewSymptom');
    var name = input.value.trim();
    if (!name) return;
    // 检查是否已存在
    var exists = false;
    document.querySelectorAll('#initChecklist input').forEach(function(inp){
      if (inp.dataset.name === name) exists = true;
    });
    if (exists) { showToast('该症状已在列表中'); input.value=''; return; }
    var label = document.createElement('label');
    label.innerHTML = '<input type="checkbox" checked data-name="'+escapeHTML(name)+'"><span>'+escapeHTML(name)+'</span>';
    document.getElementById('initChecklist').appendChild(label);
    input.value = '';
  }
  function confirmInitSymptoms() {
    var checks = document.querySelectorAll('#initChecklist input:checked');
    var names = Array.from(checks).map(function(c){return c.dataset.name;});
    if (names.length === 0) {closeInitModal();return;}
    store.symptoms = names.map(function(n,i){return {id:i+1, name:n, createdAt:formatDate(new Date())};});
    store.nextId = names.length+1;
    store.direction = computeDirection(names);
    store.plan.cards = generateWeekCards(store.direction.key, getCurrentWeek());
    store.plan.summary = null;
    store.isFirstRun = false;
    closeInitModal();
    saveStore();
    renderAll();
    showToast('已确认'+names.length+'个症状，本周食谱已生成');
  }

  function extractSymptoms(text) {
    var found = [];
    Object.keys(DIRECTION_MAP).filter(function(k){return k!=='_default';}).forEach(function(s){
      if (text.indexOf(s) !== -1) found.push(s);
    });
    var fuzzyMap = {
      '胀':'胃胀气','胀气':'胃胀气','胃不舒服':'胃胀气','胃不好':'胃胀气',
      '睡不好':'睡眠浅','睡不着':'失眠','入睡困难':'失眠','做梦多':'多梦',
      '耳朵响':'耳鸣','腰酸':'腰痛','腰不舒服':'腰痛',
      '口疮':'口腔溃疡','嘴巴破':'口腔溃疡','上火':'口腔溃疡',
      '疲惫':'乏力','没力气':'乏力','没精神':'乏力','累':'乏力',
      '手脚凉':'怕冷','手脚冰凉':'怕冷',
      '拉不出':'便秘','大便干':'便秘',
      '拉肚子':'腹泻','拉稀':'腹泻',
      '湿气':'湿气重','浮肿':'水肿',
      '眼睛干':'眼干','眼睛涩':'眼干',
      '头疼':'头晕','头痛':'头晕',
      '脾气大':'易怒','爱生气':'易怒','烦躁':'易怒',
      '口苦':'口干','痘痘':'长痘','心慌':'心悸'
    };
    Object.keys(fuzzyMap).forEach(function(kw){
      if (text.indexOf(kw) !== -1) {
        var m = fuzzyMap[kw];
        if (found.indexOf(m) === -1) found.push(m);
      }
    });
    return found;
  }

  function startAnalysis() {
    var input = document.getElementById('clinicInput');
    var text = input.value.trim();
    if (!text) {showToast('请先描述你的身体状况');input.focus();return;}
    var btn = document.getElementById('btnAnalyze');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 分析中...';
    document.getElementById('analyzingText').textContent = '正在识别症状...';
    openModal('analyzingModal');
    setTimeout(function(){document.getElementById('analyzingText').textContent='匹配调理方向...';}, 600);
    setTimeout(function(){document.getElementById('analyzingText').textContent='搭配今日食谱...';}, 1200);
    setTimeout(function(){
      closeModal('analyzingModal');
      btn.disabled = false;
      btn.innerHTML = '开始分析';
      var extracted = extractSymptoms(text);
      if (extracted.length === 0) {
        showToast('未能识别出明确症状，请手动添加');
        setTimeout(function(){openAddSymptom();}, 400);
        return;
      }
      var newOnes = [];
      extracted.forEach(function(name){
        if (!store.symptoms.find(function(s){return s.name===name;})) {
          store.symptoms.push({id:store.nextId++, name:name, createdAt:formatDate(new Date())});
          newOnes.push(name);
        }
      });
      store.direction = computeDirection(store.symptoms.map(function(s){return s.name;}));
      store.plan.cards = generateWeekCards(store.direction.key, getCurrentWeek());
      store.plan.summary = null;
      input.value = '';
      saveStore();
      closeAllModals();
      renderAll();
      // 显示今日推荐结果
      var resultEl = document.getElementById('clinicResult');
      if (resultEl) {
        var todayCard = store.plan.cards.find(function(c){return c.isToday;});
        var season = getSeason();
        resultEl.innerHTML = '<div class="cr-title">🎯 今日调理建议（'+season.emoji+season.name+'季）</div>'
          + '<div>识别症状：' + newOnes.map(escapeHTML).join('、') + '</div>'
          + '<div>调理方向：<strong>' + escapeHTML(store.direction.emoji + ' ' + store.direction.name) + '</strong></div>'
          + (todayCard ? '<div style="margin-top:6px;">今日推荐：<strong>' + escapeHTML(todayCard.meals.breakfast.name) + '</strong> + <strong>' + escapeHTML(todayCard.meals.lunch.name) + '</strong> + <strong>' + escapeHTML(todayCard.meals.dinner.name) + '</strong></div>'
          + '<div style="margin-top:4px;color:var(--text-secondary);font-size:12px;">代茶饮：' + escapeHTML(todayCard.meals.tea.text) + '</div>' : '')
          + '<div style="margin-top:6px;font-size:12px;color:var(--text-muted);">💡 周计划采用主方向+平和日混合搭配，避免食材重复，根据你的反馈持续优化</div>';
        resultEl.classList.add('show');
      }
      showToast(newOnes.length ? '识别到：'+newOnes.join('、')+'，食谱已更新' : '分析完成，食谱已更新');
      setTimeout(function(){showDirectionModal();}, 500);
    }, 2000);
  }

  function generateSummary() {
    var btn = document.getElementById('btnSummarize');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> AI 正在生成汇总...';
    setTimeout(function(){
      var reviewed = store.plan.cards.filter(function(c){return c.reviewText;});
      var symptomNames = store.symptoms.map(function(s){return s.name;}).join('、');
      var goodDays = reviewed.filter(function(c){var t=c.reviewText;return t.indexOf('舒服')>-1||t.indexOf('不错')>-1||t.indexOf('好')>-1;});
      var badDays = reviewed.filter(function(c){var t=c.reviewText;return t.indexOf('烧')>-1||t.indexOf('不适')>-1||t.indexOf('难受')>-1||t.indexOf('胀')>-1;});
      var dir = store.direction;
      var summary = '本周针对「'+symptomNames+'」以'+dir.name+'为方向，为你搭配了三餐食疗方案。';
      if (reviewed.length === 0) {
        summary += '建议每天记录实际饮食和身体感受，这样下周可以根据反馈更精准地调整食谱。';
      } else {
        if (goodDays.length) summary += '你记录了'+goodDays.length+'天感觉良好，说明'+dir.good.slice(0,2).join('、')+'等食材方向适合你。';
        if (badDays.length) summary += '有'+badDays.length+'天出现不适，注意避开'+dir.bad.slice(0,2).join('、')+'等食物。';
      }
      summary += '下周建议继续以'+dir.good.slice(0,2).join('、')+'为主，搭配时令食材，规律饮食，保持良好作息。';
      store.plan.summary = summary;
      btn.disabled = false;
      btn.innerHTML = '生成本周汇总';
      renderReviewArea();
      renderHealthPanel();
      saveStore();
      showToast('本周汇总已生成');
    }, 1800);
  }

  // 事件委托
  document.querySelector('.tab-bar').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-page]');
    if (btn) switchPage(btn.dataset.page);
  });
  document.addEventListener('keydown', function(e){if(e.key==='Escape')closeAllModals();});
  document.addEventListener('click', function(e){if(e.target.classList.contains('modal-overlay'))closeAllModals();});

  // 全局暴露
  window.switchPage = switchPage;
  window.toggleCard = toggleCard;
  window.scrollToCard = scrollToCard;
  window.autoSaveCard = autoSaveCard;
  window.openAddSymptom = openAddSymptom;
  window.closeAddSymptom = closeAddSymptom;
  window.addSymptom = addSymptom;
  window.triggerArchive = triggerArchive;
  window.closeArchiveModal = closeArchiveModal;
  window.confirmArchive = confirmArchive;
  window.showDirectionModal = showDirectionModal;
  window.closeDirectionModal = closeDirectionModal;
  window.confirmDirection = confirmDirection;
  window.closeInitModal = closeInitModal;
  window.addInitSymptom = addInitSymptom;
  window.confirmInitSymptoms = confirmInitSymptoms;
  window.startAnalysis = startAnalysis;
  window.quickAnalyze = quickAnalyze;
  window.swapMeal = swapMeal;
  window.swapDay = swapDay;
  window.generateSummary = generateSummary;
  window.setCheckin = setCheckin;
  window.setFeeling = setFeeling;
  window.setSeverity = setSeverity;
  window.doUndo = doUndo;
  window.scrollToTodayFromHealth = scrollToTodayFromHealth;

  // 初始化
  if (!loadStore()) store = getDefaultStore();
  if (!store.direction) store.direction = computeDirection(store.symptoms.map(function(s){return s.name;}));
  // 兼容旧数据迁移（如果 cards 没有 meals 字段）
  if (store.plan.cards[0] && !store.plan.cards[0].meals) {
    store.plan.cards = generateWeekCards(store.direction.key, getCurrentWeek());
    store.plan.summary = null;
  }
  renderAll();
  if (store.isFirstRun) {
    setTimeout(function(){showInitModal();}, 500);
  }
})();
</script>
</body>
