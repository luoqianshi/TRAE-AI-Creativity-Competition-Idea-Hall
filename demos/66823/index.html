<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Fighter - 局域网联机PK</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        #menu {
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #888;
            margin-bottom: 40px;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }

        button {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #btn-create, #btn-join {
            background: #4a90d9;
            color: white;
        }

        #btn-create:hover, #btn-join:hover {
            background: #357abd;
            transform: scale(1.05);
        }

        #btn-local {
            background: #ff6b6b;
            color: white;
        }

        #btn-local:hover {
            background: #ee5a5a;
            transform: scale(1.05);
        }

        #join-form {
            margin-top: 20px;
        }

        .hidden {
            display: none !important;
        }

        #join-form input {
            padding: 10px 20px;
            font-size: 20px;
            border: 2px solid #4a90d9;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            text-align: center;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        #join-form input::placeholder {
            color: #666;
            letter-spacing: 1px;
            text-transform: none;
        }

        #btn-connect {
            margin-left: 10px;
            background: #4a90d9;
            color: white;
        }

        #room-info {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }

        #display-code {
            font-size: 32px;
            font-weight: bold;
            color: #ffd93d;
            letter-spacing: 8px;
        }

        .controls-info {
            margin-top: 40px;
            color: #666;
        }

        .controls-info h3 {
            color: #888;
            margin-bottom: 10px;
        }

        .controls-info p {
            margin: 5px 0;
        }

        /* Game Screen */
        #game {
            position: relative;
            width: 1200px;
            height: 600px;
            overflow: hidden;
            margin: 0 auto;
            border: 2px solid #333;
        }

        #canvas {
            display: block;
            width: 1200px;
            height: 600px;
            background: #87CEEB;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .player-ui {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-name {
            font-size: 18px;
            font-weight: bold;
        }

        .hp-bar {
            width: 200px;
            height: 24px;
            background: #333;
            border-radius: 12px;
            overflow: hidden;
        }

        .hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d);
            transition: width 0.3s;
        }

        #p2-ui .hp-fill {
            background: linear-gradient(90deg, #ffd93d, #ff6b6b);
        }

        .hp-text {
            font-size: 18px;
            font-weight: bold;
            min-width: 40px;
        }

        #vs {
            font-size: 32px;
            font-weight: bold;
            color: #ffd93d;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0,0,0,0.9);
            padding: 40px 60px;
            border-radius: 16px;
        }

        #game-over h2 {
            font-size: 36px;
            margin-bottom: 30px;
        }

        #game-over button {
            margin: 0 10px;
        }

        #btn-restart {
            background: #4a90d9;
            color: white;
        }

        #btn-back {
            background: #666;
            color: white;
        }
    </style>
</head>
<body>
    <div id="menu">
        <h1>Vibe Fighter</h1>
        <p class="subtitle">局域网联机PK游戏</p>
        
        <div class="menu-buttons">
            <button id="btn-create">创建房间</button>
            <button id="btn-join">加入房间</button>
            <button id="btn-local">本地双人对战</button>
        </div>
        
        <div id="join-form" class="hidden">
            <input type="text" id="room-code" placeholder="输入房间码" maxlength="6">
            <button id="btn-connect">连接</button>
        </div>
        
        <div id="room-info" class="hidden">
            <p>房间码：<span id="display-code"></span></p>
            <p>等待玩家加入...</p>
        </div>
        
        <div class="controls-info">
            <h3>操作说明</h3>
            <p><strong>玩家1：</strong> A/D 移动，W 跳跃，J 攻击</p>
            <p><strong>玩家2：</strong> ←/→ 移动，↑ 跳跃，K 攻击</p>
        </div>
    </div>
    
    <div id="game" class="hidden">
        <canvas id="canvas"></canvas>
        <div id="ui">
            <div class="player-ui" id="p1-ui">
                <span class="player-name">玩家 1</span>
                <div class="hp-bar">
                    <div class="hp-fill" id="p1-hp"></div>
                </div>
                <span class="hp-text" id="p1-hp-text">100</span>
            </div>
            <div id="vs">VS</div>
            <div class="player-ui" id="p2-ui">
                <span class="player-name">玩家 2</span>
                <div class="hp-bar">
                    <div class="hp-fill" id="p2-hp"></div>
                </div>
                <span class="hp-text" id="p2-hp-text">100</span>
            </div>
        </div>
        <div id="game-over" class="hidden">
            <h2 id="winner-text">玩家 1 胜利！</h2>
            <button id="btn-restart">再来一局</button>
            <button id="btn-back">返回主页</button>
        </div>
    </div>
    
    <script>
        // ============================================
        // Vibe Fighter - 游戏主逻辑
        // ============================================

        // 游戏配置
        const CONFIG = {
            WIDTH: 1200,
            HEIGHT: 600,
            GROUND_Y: 500,
            GRAVITY: 0.8,
            PLAYER_SPEED: 6,
            JUMP_FORCE: -16,
            ATTACK_RANGE: 80,
            ATTACK_DAMAGE: 10,
            ATTACK_COOLDOWN: 30,
            MAX_HP: 100,
            SYNC_INTERVAL: 50,
            COLORS: {
                P1: '#4a90d9',
                P2: '#ff6b6b',
                GROUND: '#4a7c4e',
                SKY: '#87CEEB'
            }
        };

        // 游戏状态
        let gameState = 'menu';
        let players = [];
        let canvas, ctx;
        let keys = {};
        let ws = null;
        let myPlayerNum = 0;
        let isOnline = false;
        let syncTimer = null;

        // ============================================
        // 玩家类
        // ============================================
        class Player {
            constructor(id, x, color) {
                this.id = id;
                this.x = x;
                this.y = CONFIG.GROUND_Y;
                this.width = 60;
                this.height = 80;
                this.color = color;
                this.vx = 0;
                this.vy = 0;
                this.hp = CONFIG.MAX_HP;
                this.facingRight = id === 1;
                this.isAttacking = false;
                this.attackFrame = 0;
                this.attackCooldown = 0;
                this.isOnGround = true;
            }
            
            update() {
                this.vy += CONFIG.GRAVITY;
                this.y += this.vy;
                
                if (this.y >= CONFIG.GROUND_Y) {
                    this.y = CONFIG.GROUND_Y;
                    this.vy = 0;
                    this.isOnGround = true;
                } else {
                    this.isOnGround = false;
                }
                
                this.x += this.vx;
                
                if (this.x < 30) this.x = 30;
                if (this.x > CONFIG.WIDTH - 30) this.x = CONFIG.WIDTH - 30;
                
                if (this.attackCooldown > 0) this.attackCooldown--;
                if (this.attackFrame > 0) this.attackFrame--;
                
                if (this.attackFrame === 15) this.isAttacking = false;
            }
            
            moveLeft() {
                this.vx = -CONFIG.PLAYER_SPEED;
                this.facingRight = false;
            }
            
            moveRight() {
                this.vx = CONFIG.PLAYER_SPEED;
                this.facingRight = true;
            }
            
            stopMove() {
                this.vx = 0;
            }
            
            jump() {
                if (this.isOnGround) {
                    this.vy = CONFIG.JUMP_FORCE;
                    this.isOnGround = false;
                }
            }
            
            attack(target) {
                if (this.attackCooldown > 0) return;
                
                this.isAttacking = true;
                this.attackFrame = 20;
                this.attackCooldown = CONFIG.ATTACK_COOLDOWN;
                
                const attackX = this.facingRight ? this.x + 40 : this.x - 40;
                const dist = Math.abs(attackX - target.x);
                
                if (dist < CONFIG.ATTACK_RANGE) {
                    target.hp -= CONFIG.ATTACK_DAMAGE + Math.floor(Math.random() * 10);
                    if (target.hp < 0) target.hp = 0;
                }
            }
            
            syncFromServer(state) {
                this.x = state.x;
                this.y = state.y;
                this.vx = state.vx;
                this.vy = state.vy;
                this.hp = state.hp;
                this.facingRight = state.facingRight;
                this.isAttacking = state.isAttacking;
            }
            
            draw(ctx) {
                ctx.save();
                
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - 25, this.y - 60, 50, 60);
                
                ctx.fillStyle = '#ffcc99';
                ctx.beginPath();
                ctx.arc(this.x, this.y - 70, 20, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#333';
                const eyeOffset = this.facingRight ? 5 : -5;
                ctx.beginPath();
                ctx.arc(this.x + eyeOffset - 6, this.y - 73, 4, 0, Math.PI * 2);
                ctx.arc(this.x + eyeOffset + 6, this.y - 73, 4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#333';
                ctx.fillRect(this.x - 20, this.y - 5, 15, 8);
                ctx.fillRect(this.x + 5, this.y - 5, 15, 8);
                
                if (this.isAttacking && this.attackFrame > 10) {
                    ctx.strokeStyle = '#ffd93d';
                    ctx.lineWidth = 4;
                    const attackX = this.facingRight ? this.x + 40 : this.x - 40;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y - 40);
                    ctx.lineTo(attackX, this.y - 40);
                    ctx.stroke();
                    
                    ctx.fillStyle = '#ffcc99';
                    ctx.beginPath();
                    ctx.arc(attackX, this.y - 40, 10, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.restore();
            }
        }

        // ============================================
        // 游戏初始化
        // ============================================
        function init() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            canvas.width = CONFIG.WIDTH;
            canvas.height = CONFIG.HEIGHT;
            
            document.getElementById('btn-create').onclick = createRoom;
            document.getElementById('btn-join').onclick = showJoinForm;
            document.getElementById('btn-connect').onclick = joinRoom;
            document.getElementById('btn-local').onclick = startLocalGame;
            document.getElementById('btn-restart').onclick = restartGame;
            document.getElementById('btn-back').onclick = backToMenu;
            
            document.addEventListener('keydown', (e) => {
                keys[e.code] = true;
            });
            document.addEventListener('keyup', (e) => {
                keys[e.code] = false;
            });
        }

        function showJoinForm() {
            document.getElementById('join-form').classList.remove('hidden');
        }

        function startLocalGame() {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('game').classList.remove('hidden');
            
            isOnline = false;
            
            players = [
                new Player(1, 200, CONFIG.COLORS.P1),
                new Player(2, 1000, CONFIG.COLORS.P2)
            ];
            
            document.querySelectorAll('.player-name')[0].textContent = '玩家 1';
            document.querySelectorAll('.player-name')[1].textContent = '玩家 2';
            
            gameState = 'playing';
            gameLoop();
        }

        function restartGame() {
            if (isOnline && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'restart' }));
            }
            
            players[0].hp = CONFIG.MAX_HP;
            players[1].hp = CONFIG.MAX_HP;
            players[0].x = 200;
            players[1].x = 1000;
            players[0].y = CONFIG.GROUND_Y;
            players[1].y = CONFIG.GROUND_Y;
            players[0].vy = 0;
            players[1].vy = 0;
            players[0].vx = 0;
            players[1].vx = 0;
            players[0].attackCooldown = 0;
            players[1].attackCooldown = 0;
            players[0].isAttacking = false;
            players[1].isAttacking = false;
            
            document.getElementById('game-over').classList.add('hidden');
            gameState = 'playing';
            
            if (!isOnline) {
                gameLoop();
            }
        }

        function backToMenu() {
            document.getElementById('game').classList.add('hidden');
            document.getElementById('menu').classList.remove('hidden');
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('join-form').classList.add('hidden');
            document.getElementById('btn-create').textContent = '创建房间';
            document.getElementById('btn-create').disabled = false;
            document.getElementById('room-info').classList.add('hidden');
            gameState = 'menu';
            myPlayerNum = 0;
            isOnline = false;
            if (syncTimer) {
                clearInterval(syncTimer);
                syncTimer = null;
            }
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        // ============================================
        // 网络功能
        // ============================================
        function getWebSocketURL() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.hostname;
            const port = window.location.port;
            
            // file://协议直接打开时，默认连接localhost:8081
            if (!host) {
                return 'ws://localhost:8081';
            }
            // 有端口的情况
            if (port) {
                return `${protocol}//${host}:${port}`;
            }
            // 默认端口（80或443）
            return `${protocol}//${host}`;
        }

        function createRoom() {
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            document.getElementById('display-code').textContent = code;
            document.getElementById('room-info').classList.remove('hidden');
            document.getElementById('btn-create').textContent = '房间已创建';
            document.getElementById('btn-create').disabled = true;
            
            connectToServer(getWebSocketURL(), code, 1);
        }

        function joinRoom() {
            const code = document.getElementById('room-code').value.toUpperCase();
            if (code.length !== 6) {
                alert('请输入6位房间码');
                return;
            }
            connectToServer(getWebSocketURL(), code, 2);
        }

        function connectToServer(url, code, playerNum) {
            try {
                ws = new WebSocket(url);
                
                ws.onopen = () => {
                    ws.send(JSON.stringify({ type: 'join', code: code, player: playerNum }));
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    handleServerMessage(data);
                };
                
                ws.onerror = () => {
                    alert('无法连接到服务器，请确保服务器已启动');
                };
                
                ws.onclose = () => {
                    console.log('服务器连接关闭');
                };
                
            } catch (e) {
                alert('无法连接到服务器，请确保服务器已启动');
            }
        }

        function handleServerMessage(data) {
            switch(data.type) {
                case 'waiting':
                    console.log('等待对手加入...');
                    break;
                    
                case 'start':
                    document.getElementById('menu').classList.add('hidden');
                    document.getElementById('game').classList.remove('hidden');
                    document.getElementById('room-info').classList.add('hidden');
                    
                    myPlayerNum = data.player;
                    isOnline = true;
                    
                    players = [
                        new Player(1, 200, CONFIG.COLORS.P1),
                        new Player(2, 1000, CONFIG.COLORS.P2)
                    ];
                    
                    document.querySelectorAll('.player-name')[0].textContent = '玩家 1';
                    document.querySelectorAll('.player-name')[1].textContent = '玩家 2';
                    
                    gameState = 'playing';
                    
                    startSyncLoop();
                    gameLoop();
                    break;
                    
                case 'game_state':
                    if (gameState === 'playing') {
                        const opponentNum = myPlayerNum === 1 ? 2 : 1;
                        const opponentState = opponentNum === 1 ? data.p1 : data.p2;
                        
                        const opponent = players[opponentNum - 1];
                        opponent.targetX = opponentState.x;
                        opponent.targetY = opponentState.y;
                        opponent.targetVx = opponentState.vx;
                        opponent.targetVy = opponentState.vy;
                        opponent.facingRight = opponentState.facingRight;
                        opponent.isAttacking = opponentState.isAttacking;
                        opponent.attackFrame = opponentState.attackFrame || 0;
                    }
                    break;
                    
                case 'attack_result':
                    if (data.hit) {
                        const opponentNum = myPlayerNum === 1 ? 2 : 1;
                        players[opponentNum - 1].hp = data.targetHp;
                    }
                    break;
                    
                case 'attacked':
                    {
                        const myPlayer = players[myPlayerNum - 1];
                        myPlayer.hp = data.hp;
                    }
                    break;
                    
                case 'opponent_left':
                    alert('对手离开了游戏');
                    backToMenu();
                    break;
                    
                case 'restart':
                    document.getElementById('game-over').classList.add('hidden');
                    
                    players[0].hp = CONFIG.MAX_HP;
                    players[1].hp = CONFIG.MAX_HP;
                    players[0].x = 200;
                    players[1].x = 1000;
                    players[0].y = CONFIG.GROUND_Y;
                    players[1].y = CONFIG.GROUND_Y;
                    players[0].vy = 0;
                    players[1].vy = 0;
                    players[0].vx = 0;
                    players[1].vx = 0;
                    players[0].attackCooldown = 0;
                    players[1].attackCooldown = 0;
                    players[0].isAttacking = false;
                    players[1].isAttacking = false;
                    
                    gameState = 'playing';
                    
                    if (isOnline) {
                        startSyncLoop();
                    }
                    gameLoop();
                    break;
            }
        }

        function startSyncLoop() {
            if (syncTimer) clearInterval(syncTimer);
            
            syncTimer = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN && gameState === 'playing') {
                    const myIndex = myPlayerNum - 1;
                    const myPlayer = players[myIndex];
                    
                    ws.send(JSON.stringify({
                        type: 'update',
                        state: {
                            x: myPlayer.x,
                            y: myPlayer.y,
                            vx: myPlayer.vx,
                            vy: myPlayer.vy,
                            hp: myPlayer.hp,
                            facingRight: myPlayer.facingRight,
                            isAttacking: myPlayer.isAttacking,
                            attackFrame: myPlayer.attackFrame
                        }
                    }));
                }
            }, CONFIG.SYNC_INTERVAL);
        }

        function applyLocalInput() {
            const myIndex = myPlayerNum - 1;
            const myPlayer = players[myIndex];
            
            if (myPlayerNum === 1) {
                if (keys['KeyA']) myPlayer.moveLeft();
                else if (keys['KeyD']) myPlayer.moveRight();
                else myPlayer.stopMove();
                
                if (keys['KeyW']) myPlayer.jump();
                
                if (keys['KeyJ'] && myPlayer.attackCooldown === 0) {
                    myPlayer.isAttacking = true;
                    myPlayer.attackFrame = 20;
                    myPlayer.attackCooldown = CONFIG.ATTACK_COOLDOWN;
                    
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'attack',
                            attackerX: myPlayer.x,
                            attackerY: myPlayer.y,
                            attackerFacingRight: myPlayer.facingRight
                        }));
                    }
                }
            } else {
                if (keys['ArrowLeft']) myPlayer.moveLeft();
                else if (keys['ArrowRight']) myPlayer.moveRight();
                else myPlayer.stopMove();
                
                if (keys['ArrowUp']) myPlayer.jump();
                
                if (keys['KeyK'] && myPlayer.attackCooldown === 0) {
                    myPlayer.isAttacking = true;
                    myPlayer.attackFrame = 20;
                    myPlayer.attackCooldown = CONFIG.ATTACK_COOLDOWN;
                    
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'attack',
                            attackerX: myPlayer.x,
                            attackerY: myPlayer.y,
                            attackerFacingRight: myPlayer.facingRight
                        }));
                    }
                }
            }
            
            myPlayer.update();
        }

        // ============================================
        // 游戏循环
        // ============================================
        function gameLoop() {
            if (gameState !== 'playing') return;
            
            if (isOnline) {
                applyLocalInput();
                
                const opponentNum = myPlayerNum === 1 ? 2 : 1;
                const opponent = players[opponentNum - 1];
                if (opponent.targetX !== undefined) {
                    opponent.x += (opponent.targetX - opponent.x) * 0.3;
                    opponent.y += (opponent.targetY - opponent.y) * 0.3;
                }
                if (opponent.attackFrame > 0) {
                    opponent.attackFrame--;
                }
                if (opponent.attackFrame <= 15) {
                    opponent.isAttacking = false;
                }
            } else {
                updateLocal();
            }
            
            if (!isOnline) {
                players[0].update();
                players[1].update();
            }
            
            draw();
            updateUI();
            
            if (players[0].hp <= 0 || players[1].hp <= 0) {
                gameOver(players[0].hp <= 0 ? 2 : 1);
                return;
            }
            
            requestAnimationFrame(gameLoop);
        }

        function updateLocal() {
            const p1 = players[0];
            if (keys['KeyA']) p1.moveLeft();
            else if (keys['KeyD']) p1.moveRight();
            else p1.stopMove();
            
            if (keys['KeyW']) p1.jump();
            if (keys['KeyJ']) p1.attack(players[1]);
            
            const p2 = players[1];
            if (keys['ArrowLeft']) p2.moveLeft();
            else if (keys['ArrowRight']) p2.moveRight();
            else p2.stopMove();
            
            if (keys['ArrowUp']) p2.jump();
            if (keys['KeyK']) p2.attack(players[0]);
            
            p1.update();
            p2.update();
        }

        function draw() {
            ctx.fillStyle = CONFIG.COLORS.SKY;
            ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
            
            ctx.fillStyle = CONFIG.COLORS.GROUND;
            ctx.fillRect(0, CONFIG.GROUND_Y + 5, CONFIG.WIDTH, CONFIG.HEIGHT - CONFIG.GROUND_Y);
            
            players.forEach(p => p.draw(ctx));
        }

        function updateUI() {
            const p1HpPercent = (players[0].hp / CONFIG.MAX_HP) * 100;
            const p2HpPercent = (players[1].hp / CONFIG.MAX_HP) * 100;
            
            document.getElementById('p1-hp').style.width = p1HpPercent + '%';
            document.getElementById('p2-hp').style.width = p2HpPercent + '%';
            document.getElementById('p1-hp-text').textContent = Math.max(0, players[0].hp);
            document.getElementById('p2-hp-text').textContent = Math.max(0, players[1].hp);
        }

        function gameOver(winner) {
            gameState = 'gameover';
            if (syncTimer) {
                clearInterval(syncTimer);
                syncTimer = null;
            }
            document.getElementById('winner-text').textContent = `玩家 ${winner} 胜利！`;
            document.getElementById('game-over').classList.remove('hidden');
        }

        // 启动
        window.onload = init;
    </script>
</body>
</html>
