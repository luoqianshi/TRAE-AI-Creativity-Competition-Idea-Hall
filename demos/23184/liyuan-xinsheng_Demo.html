<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>梨园新声 - AI戏曲创作与欣赏</title>
<style>
/* ========== 基础样式 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { --primary: #DC2626; --primary-dark: #B91C1C; --secondary: #F59E0B; --bg: #0F172A; --surface: #1E293B; --surface-light: #334155; --text: #F8FAFC; --text-secondary: #94A3B8; --text-muted: #64748B; --border: #334155; --success: #22C55E; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; overflow: hidden; }
#app { height: 100vh; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; background: var(--bg); position: relative; }
.page { display: none; flex: 1; overflow-y: auto; padding: 1rem 1rem 5rem; -webkit-overflow-scrolling: touch; }
.page.active { display: block; }

/* 首页 */
.home-header { text-align: center; padding: 1.5rem 0 1rem; }
.home-header h1 { font-size: 1.8rem; font-weight: 700; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.home-subtitle { color: var(--text-secondary); font-size: 0.95rem; margin-top: 0.3rem; }
.voice-search-container { display: flex; flex-direction: column; align-items: center; padding: 1.5rem 0; }
.voice-btn { width: 90px; height: 90px; border-radius: 50%; border: none; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 20px rgba(220,38,38,0.4); transition: transform 0.2s, box-shadow 0.2s; }
.voice-btn:active { transform: scale(0.95); }
.voice-btn.listening { animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); box-shadow: 0 4px 20px rgba(220,38,38,0.4); } 50% { transform: scale(1.1); box-shadow: 0 4px 30px rgba(220,38,38,0.6); } }
.mic-icon { width: 40px; height: 40px; }
.voice-status { color: var(--text-secondary); font-size: 0.9rem; margin-top: 1rem; }
.voice-result { color: var(--secondary); font-size: 1rem; margin-top: 0.5rem; min-height: 1.5rem; }
.section-title { font-size: 1rem; font-weight: 600; color: var(--text); margin: 1.5rem 0 0.75rem; padding-left: 0.75rem; border-left: 3px solid var(--primary); }
.opera-list { display: flex; flex-direction: column; gap: 0.75rem; }
.opera-card { background: var(--surface); border-radius: 12px; padding: 1rem; display: flex; align-items: center; gap: 0.875rem; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
.opera-card:active { background: var(--surface-light); }
.opera-icon { width: 52px; height: 52px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
.opera-info { flex: 1; min-width: 0; }
.opera-name { font-size: 1rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opera-meta { font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.2rem; }
.opera-arrow { color: var(--text-muted); font-size: 1.2rem; }

/* 播放页 */
.player-header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 0; margin-bottom: 1rem; }
.back-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.back-btn svg { width: 24px; height: 24px; }
.player-title { font-size: 1rem; font-weight: 600; }
.player-content { display: flex; flex-direction: column; align-items: center; padding: 0 0.5rem; }
.album-art { width: 200px; height: 200px; margin-bottom: 1.5rem; }
.album-placeholder { width: 100%; height: 100%; border-radius: 16px; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; font-size: 4rem; }
.track-info { text-align: center; margin-bottom: 1.5rem; }
.track-info h2 { font-size: 1.3rem; font-weight: 700; }
.track-info p { color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.3rem; }
.lyrics-container { width: 100%; max-height: 150px; overflow-y: auto; background: var(--surface); border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; text-align: center; }
.lyrics-text { font-size: 1.1rem; line-height: 2; color: var(--text-secondary); }
.lyrics-text .active { color: var(--secondary); font-weight: 600; font-size: 1.2rem; }
.progress-container { width: 100%; display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; }
.progress-container span { font-size: 0.75rem; color: var(--text-secondary); font-family: monospace; min-width: 36px; }
.progress-bar { flex: 1; height: 4px; background: var(--surface-light); border-radius: 2px; cursor: pointer; position: relative; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 2px; width: 0%; transition: width 0.1s; }
.player-controls { display: flex; align-items: center; gap: 2rem; margin-bottom: 1.5rem; }
.control-btn { width: 48px; height: 48px; border-radius: 50%; border: none; background: var(--surface); color: var(--text); font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.play-btn { width: 64px; height: 64px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); font-size: 1.5rem; }
.player-actions { display: flex; gap: 1rem; }
.action-btn { padding: 0.6rem 1.2rem; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); font-size: 0.85rem; cursor: pointer; }

/* AI创作 */
.page-header { text-align: center; padding: 1rem 0; }
.page-header h2 { font-size: 1.4rem; font-weight: 700; }
.page-subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.3rem; }
.genre-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1.5rem; }
.genre-card { background: var(--surface); border-radius: 12px; padding: 1rem 0.5rem; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
.genre-card.active { border-color: var(--primary); background: rgba(220,38,38,0.1); }
.genre-icon { font-size: 1.8rem; margin-bottom: 0.3rem; }
.genre-name { font-size: 0.85rem; color: var(--text-secondary); }
.genre-card.active .genre-name { color: var(--text); font-weight: 600; }
.input-container { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
.theme-input { width: 100%; padding: 1rem; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 1rem; outline: none; }
.theme-input::placeholder { color: var(--text-muted); }
.theme-input:focus { border-color: var(--primary); }
.generate-btn { width: 100%; padding: 1rem; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
.generate-btn:active { opacity: 0.9; }
.result-card { background: var(--surface); border-radius: 12px; padding: 1.5rem; border: 1px solid var(--border); }
.result-genre { display: inline-block; background: rgba(220,38,38,0.2); color: var(--primary); padding: 0.3rem 0.8rem; border-radius: 16px; font-size: 0.8rem; margin-bottom: 1rem; }
.result-text { font-size: 1.1rem; line-height: 2; color: var(--text); margin-bottom: 1.5rem; white-space: pre-line; }
.result-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.result-btn { padding: 0.6rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text-secondary); font-size: 0.85rem; cursor: pointer; flex: 1; min-width: 80px; }
.result-btn.primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; }
.loading-container { display: flex; flex-direction: column; align-items: center; padding: 3rem 0; }
.loading-spinner { width: 48px; height: 48px; border: 3px solid var(--surface-light); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 社区 */
.filter-bar { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 1rem; -webkit-overflow-scrolling: touch; }
.filter-btn { padding: 0.4rem 1rem; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); font-size: 0.85rem; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.filter-btn.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; }
.community-list { display: flex; flex-direction: column; gap: 0.75rem; }
.community-card { background: var(--surface); border-radius: 12px; padding: 1rem; border: 1px solid var(--border); }
.community-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
.community-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--secondary), #D97706); display: flex; align-items: center; justify-content: center; font-size: 1rem; }
.community-author { font-size: 0.85rem; color: var(--text); font-weight: 600; }
.community-genre { font-size: 0.75rem; color: var(--secondary); margin-left: auto; }
.community-text { font-size: 1rem; line-height: 1.8; color: var(--text); margin-bottom: 0.75rem; white-space: pre-line; }
.community-actions { display: flex; gap: 1rem; }
.community-action { font-size: 0.8rem; color: var(--text-secondary); cursor: pointer; }
.community-action.active { color: var(--primary); }

/* 我的 */
.profile-header { text-align: center; padding: 1.5rem 0; }
.avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 0.75rem; }
.profile-header h2 { font-size: 1.2rem; }
.profile-menu { display: flex; flex-direction: column; gap: 0.5rem; }
.menu-item { background: var(--surface); border-radius: 12px; padding: 1rem; display: flex; align-items: center; gap: 0.75rem; cursor: pointer; }
.menu-icon { font-size: 1.3rem; width: 32px; text-align: center; }
.menu-text { flex: 1; font-size: 1rem; }
.menu-arrow { color: var(--text-muted); font-size: 1.2rem; }

/* 底部导航 */
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; display: flex; justify-content: space-around; background: rgba(15,23,42,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding: 0.5rem 0; z-index: 100; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; padding: 0.3rem 1rem; border: none; background: none; color: var(--text-muted); cursor: pointer; transition: color 0.2s; }
.nav-item.active { color: var(--primary); }
.nav-icon { font-size: 1.3rem; }
.nav-text { font-size: 0.7rem; }

/* 滚动条 */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-light); border-radius: 2px; }

/* 响应式 */
@media (min-width: 481px) { #app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); } }
</style>
</head>
<body>

<div id="app">

  <!-- 首页 -->
  <div id="page-home" class="page active">
    <div class="home-header">
      <h1>梨园新声</h1>
      <p class="home-subtitle">按住说话，想听什么戏</p>
    </div>
    <div class="voice-search-container">
      <button id="voice-btn" class="voice-btn">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="white"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </button>
      <p id="voice-status" class="voice-status">点击或按住麦克风按钮说话</p>
      <p id="voice-result" class="voice-result"></p>
    </div>
    <div class="section-title">热门推荐</div>
    <div class="opera-list" id="hot-opera-list"></div>
  </div>

  <!-- 播放页 -->
  <div id="page-player" class="page">
    <div class="player-header">
      <button class="back-btn" onclick="showPage('home')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <span class="player-title">正在播放</span>
      <div style="width:40px"></div>
    </div>
    <div class="player-content">
      <div class="album-art"><div class="album-placeholder" id="player-album-art">🎭</div></div>
      <div class="track-info">
        <h2 id="player-track-name">--</h2>
        <p id="player-artist">--</p>
      </div>
      <div class="lyrics-container" id="lyrics-container"><div class="lyrics-text" id="lyrics-text">暂无唱词</div></div>
      <div class="progress-container">
        <span id="current-time">0:00</span>
        <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <span id="total-time">0:00</span>
      </div>
      <div class="player-controls">
        <button class="control-btn" id="btn-prev">⏮</button>
        <button class="control-btn play-btn" id="btn-play">▶</button>
        <button class="control-btn" id="btn-next">⏭</button>
      </div>
      <div class="player-actions">
        <button class="action-btn" id="btn-like">♡ 收藏</button>
        <button class="action-btn" id="btn-share">↗ 分享</button>
      </div>
    </div>
    <audio id="audio-player"></audio>
  </div>

  <!-- AI创作 -->
  <div id="page-create" class="page">
    <div class="page-header">
      <h2>AI 戏曲创作</h2>
      <p class="page-subtitle">让 AI 为你写唱词</p>
    </div>
    <div class="section-title">选择剧种</div>
    <div class="genre-grid" id="genre-grid">
      <div class="genre-card active" data-genre="京剧"><div class="genre-icon">🎭</div><div class="genre-name">京剧</div></div>
      <div class="genre-card" data-genre="昆曲"><div class="genre-icon">🎵</div><div class="genre-name">昆曲</div></div>
      <div class="genre-card" data-genre="越剧"><div class="genre-icon">🎶</div><div class="genre-name">越剧</div></div>
      <div class="genre-card" data-genre="黄梅戏"><div class="genre-icon">🎼</div><div class="genre-name">黄梅戏</div></div>
      <div class="genre-card" data-genre="评弹"><div class="genre-icon">🎹</div><div class="genre-name">评弹</div></div>
      <div class="genre-card" data-genre="川剧"><div class="genre-icon">🎸</div><div class="genre-name">川剧</div></div>
    </div>
    <div class="section-title">创作主题</div>
    <div class="input-container">
      <input type="text" id="theme-input" class="theme-input" placeholder="输入主题，如：春天的故事" maxlength="50">
      <button id="generate-btn" class="generate-btn">✨ 开始创作</button>
    </div>
    <div class="result-container" id="result-container" style="display:none;">
      <div class="section-title">AI 生成结果</div>
      <div class="result-card">
        <div class="result-genre" id="result-genre">京剧</div>
        <div class="result-text" id="result-text"></div>
        <div class="result-actions">
          <button class="result-btn" id="btn-read">🔊 朗读</button>
          <button class="result-btn" id="btn-regenerate">🔄 重新生成</button>
          <button class="result-btn primary" id="btn-share-community">📤 分享到社区</button>
        </div>
      </div>
    </div>
    <div class="loading-container" id="loading-container" style="display:none;">
      <div class="loading-spinner"></div><p>AI 正在创作中...</p>
    </div>
  </div>

  <!-- 社区 -->
  <div id="page-community" class="page">
    <div class="page-header">
      <h2>戏迷社区</h2>
      <p class="page-subtitle">发现精彩的 AI 创作</p>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="京剧">京剧</button>
      <button class="filter-btn" data-filter="昆曲">昆曲</button>
      <button class="filter-btn" data-filter="越剧">越剧</button>
      <button class="filter-btn" data-filter="黄梅戏">黄梅戏</button>
    </div>
    <div class="community-list" id="community-list"></div>
  </div>

  <!-- 我的 -->
  <div id="page-profile" class="page">
    <div class="profile-header"><div class="avatar">👤</div><h2>我的</h2></div>
    <div class="profile-menu">
      <div class="menu-item" onclick="showFavorites()"><span class="menu-icon">♥</span><span class="menu-text">我的收藏</span><span class="menu-arrow">›</span></div>
      <div class="menu-item" onclick="showCreations()"><span class="menu-icon">✨</span><span class="menu-text">创作历史</span><span class="menu-arrow">›</span></div>
      <div class="menu-item" onclick="showHistory()"><span class="menu-icon">🕐</span><span class="menu-text">播放记录</span><span class="menu-arrow">›</span></div>
      <div class="menu-item" onclick="showSettings()"><span class="menu-icon">⚙</span><span class="menu-text">设置</span><span class="menu-arrow">›</span></div>
    </div>
  </div>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home"><span class="nav-icon">🏠</span><span class="nav-text">首页</span></button>
    <button class="nav-item" data-page="create"><span class="nav-icon">✨</span><span class="nav-text">创作</span></button>
    <button class="nav-item" data-page="community"><span class="nav-icon">👥</span><span class="nav-text">社区</span></button>
    <button class="nav-item" data-page="profile"><span class="nav-icon">👤</span><span class="nav-text">我的</span></button>
  </nav>

</div>

<script>
// 数据
const operaData=[{id:1,name:'贵妃醉酒',artist:'梅兰芳',genre:'京剧',icon:'🎭',lyrics:'海岛冰轮初转腾，\n见玉兔，玉兔又早东升。\n那冰轮离海岛，\n乾坤分外明。\n皓月当空，\n恰便似啊嫦娥离月宫，\n奴似嫦娥离月宫。'},{id:2,name:'牡丹亭·游园',artist:'昆曲经典',genre:'昆曲',icon:'🎵',lyrics:'原来姹紫嫣红开遍，\n似这般都付与断井颓垣。\n良辰美景奈何天，\n赏心乐事谁家院。\n朝飞暮卷，云霞翠轩，\n雨丝风片，烟波画船。'},{id:3,name:'天仙配',artist:'黄梅戏',genre:'黄梅戏',icon:'🎼',lyrics:'树上的鸟儿成双对，\n绿水青山带笑颜。\n随手摘下花一朵，\n我与娘子戴发间。\n从今不再受那奴役苦，\n夫妻双双把家还。'},{id:4,name:'梁山伯与祝英台',artist:'越剧经典',genre:'越剧',icon:'🎶',lyrics:'我家有个小九妹，\n聪明伶俐人钦佩。\n描龙绣凤称能手，\n琴棋书画件件会。\n此番杭州求名师，\n九妹一心想同来。'},{id:5,name:'霸王别姬',artist:'梅兰芳',genre:'京剧',icon:'🎭',lyrics:'看大王在帐中和衣睡稳，\n我这里出帐外且散愁心。\n轻移步走向前荒郊站定，\n猛抬头见碧落月色清明。'},{id:6,name:'评弹·杜十娘',artist:'评弹经典',genre:'评弹',icon:'🎹',lyrics:'窈窕风流杜十娘，\n自怜身落在平康。\n她是落花无主随风舞，\n飞絮飘零泪数行。'}];
const communityData=[{id:1,author:'戏曲爱好者小王',genre:'京剧',text:'春风拂面柳丝长，\n桃李争妍满院香。\n燕子归来寻旧垒，\n人间处处好风光。',likes:128,comments:23},{id:2,author:'老戏迷张大爷',genre:'昆曲',text:'月色朦胧照小楼，\n相思无尽水东流。\n琵琶声断人何处，\n独倚阑干数度秋。',likes:89,comments:15},{id:3,author:'AI创作者小李',genre:'越剧',text:'江南水乡烟雨蒙，\n小桥流水人家东。\n杏花春雨江南梦，\n一曲越韵醉春风。',likes:256,comments:45},{id:4,author:'传统文化推广者',genre:'黄梅戏',text:'青山绿水映斜阳，\n牧童归去笛声扬。\n田园风光无限好，\n一曲黄梅唱故乡。',likes:167,comments:31}];
const aiGeneratedLyrics={'京剧':['春风拂面柳丝长，\n桃李争妍满院香。\n燕子归来寻旧垒，\n人间处处好风光。','金戈铁马战沙场，\n英雄豪气贯长虹。\n忠肝义胆昭日月，\n千古流芳万世崇。','红楼一梦醉千秋，\n金玉良缘水东流。\n黛玉葬花人独立，\n潇湘竹影月如钩。'],'昆曲':['月色朦胧照小楼，\n相思无尽水东流。\n琵琶声断人何处，\n独倚阑干数度秋。','园林深处锁春光，\n蝶舞莺啼花满廊。\n一曲昆腔惊梦醒，\n牡丹亭外柳丝扬。','烟雨江南水墨长，\n小桥流水映斜阳。\n画船听雨眠何处，\n一曲清歌入梦乡。'],'越剧':['江南水乡烟雨蒙，\n小桥流水人家东。\n杏花春雨江南梦，\n一曲越韵醉春风。','西湖美景三月天，\n春雨如酒柳如烟。\n有缘千里来相会，\n无缘对面手难牵。','梁祝化蝶双飞舞，\n千古爱情传世间。\n十八相送情难舍，\n一曲越剧动人心。'],'黄梅戏':['青山绿水映斜阳，\n牧童归去笛声扬。\n田园风光无限好，\n一曲黄梅唱故乡。','夫妻双双把家还，\n绿水青山带笑颜。\n你耕田来我织布，\n寒窑虽破能避寒。','树上的鸟儿成双对，\n绿水青山带笑颜。\n从今再不受那奴役苦，\n夫妻双双把家还。'],'评弹':['吴侬软语唱苏州，\n评弹一曲醉心头。\n三弦琵琶声声慢，\n江南水乡画中游。','姑苏城外寒山寺，\n夜半钟声到客船。\n评弹声声诉离愁，\n吴侬软语话江南。','小桥流水人家近，\n评弹声中岁月深。\n一曲琵琶一杯酒，\n江南烟雨醉人心。'],'川剧':['变脸绝技惊四方，\n川剧高腔震天响。\n麻辣人生戏一台，\n巴蜀风情韵悠长。','蜀道难，难于上青天，\n川剧一声唱千年。\n火锅沸腾人情暖，\n巴山夜雨话缠绵。']};

// 状态
let currentPage='home',selectedGenre='京剧',currentTrack=null,isPlaying=false;
let favorites=JSON.parse(localStorage.getItem('favorites')||'[]');
let creations=JSON.parse(localStorage.getItem('creations')||'[]');
let playHistory=JSON.parse(localStorage.getItem('playHistory')||'[]');

// 页面切换
function showPage(page){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+page).classList.add('active');document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');currentPage=page;if(page==='home')renderOperaList();if(page==='community')renderCommunityList('all');}

// 渲染列表
function renderOperaList(){const list=document.getElementById('hot-opera-list');list.innerHTML=operaData.map(opera=>`<div class="opera-card" onclick="playOpera(${opera.id})"><div class="opera-icon">${opera.icon}</div><div class="opera-info"><div class="opera-name">${opera.name}</div><div class="opera-meta">${opera.artist} · ${opera.genre}</div></div><div class="opera-arrow">›</div></div>`).join('');}

// 播放
function playOpera(id){const opera=operaData.find(o=>o.id===id);if(!opera)return;currentTrack=opera;document.getElementById('player-track-name').textContent=opera.name;document.getElementById('player-artist').textContent=opera.artist+' · '+opera.genre;document.getElementById('player-album-art').textContent=opera.icon;document.getElementById('lyrics-text').textContent=opera.lyrics;isPlaying=false;updatePlayButton();addToHistory(opera);showPage('player');}
function togglePlay(){isPlaying=!isPlaying;updatePlayButton();if(isPlaying)startProgressSimulation();else stopProgressSimulation();}
function updatePlayButton(){document.getElementById('btn-play').textContent=isPlaying?'⏸':'▶';}
let progressInterval=null;
function startProgressSimulation(){let progress=0;progressInterval=setInterval(()=>{progress+=0.5;if(progress>100)progress=0;document.getElementById('progress-fill').style.width=progress+'%';updateLyricsHighlight(progress);},100);}
function stopProgressSimulation(){if(progressInterval){clearInterval(progressInterval);progressInterval=null;}}
function updateLyricsHighlight(progress){const lyricsText=document.getElementById('lyrics-text');if(!lyricsText||!currentTrack)return;const lines=currentTrack.lyrics.split('\n');const activeIndex=Math.floor((progress/100)*lines.length);lyricsText.innerHTML=lines.map((line,i)=>i===activeIndex?`<span class="active">${line}</span>`:line).join('<br>');}

// 语音搜索
let recognition=null;
function initSpeechRecognition(){if(!('webkitSpeechRecognition'in window)&&!('SpeechRecognition'in window)){document.getElementById('voice-status').textContent='您的浏览器不支持语音识别';return;}const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SpeechRecognition();recognition.lang='zh-CN';recognition.continuous=false;recognition.interimResults=true;recognition.onstart=()=>{document.getElementById('voice-btn').classList.add('listening');document.getElementById('voice-status').textContent='正在听...';document.getElementById('voice-result').textContent='';};recognition.onresult=(event)=>{const result=event.results[event.results.length-1];const text=result[0].transcript;document.getElementById('voice-result').textContent=text;if(result.isFinal)handleVoiceSearch(text);};recognition.onend=()=>{document.getElementById('voice-btn').classList.remove('listening');document.getElementById('voice-status').textContent='点击或按住麦克风按钮说话';};recognition.onerror=()=>{document.getElementById('voice-btn').classList.remove('listening');document.getElementById('voice-status').textContent='语音识别出错，请重试';};}
function handleVoiceSearch(text){const matched=operaData.filter(o=>o.name.includes(text)||o.artist.includes(text)||o.genre.includes(text));if(matched.length>0){const list=document.getElementById('hot-opera-list');list.innerHTML=matched.map(opera=>`<div class="opera-card" onclick="playOpera(${opera.id})"><div class="opera-icon">${opera.icon}</div><div class="opera-info"><div class="opera-name">${opera.name}</div><div class="opera-meta">${opera.artist} · ${opera.genre}</div></div><div class="opera-arrow">›</div></div>`).join('');document.getElementById('voice-status').textContent=`找到 ${matched.length} 个结果`;}else{document.getElementById('voice-status').textContent='未找到相关内容，试试说"京剧""昆曲"等';}}

// AI创作
function initGenreSelection(){document.querySelectorAll('.genre-card').forEach(card=>{card.addEventListener('click',()=>{document.querySelectorAll('.genre-card').forEach(c=>c.classList.remove('active'));card.classList.add('active');selectedGenre=card.dataset.genre;});});}
function generateOpera(){const theme=document.getElementById('theme-input').value.trim();if(!theme){alert('请输入创作主题');return;}document.getElementById('loading-container').style.display='flex';document.getElementById('result-container').style.display='none';setTimeout(()=>{const lyrics=generateLyrics(selectedGenre,theme);document.getElementById('loading-container').style.display='none';document.getElementById('result-container').style.display='block';document.getElementById('result-genre').textContent=selectedGenre;document.getElementById('result-text').textContent=lyrics;const creation={id:Date.now(),genre:selectedGenre,theme:theme,text:lyrics,time:new Date().toLocaleString()};creations.unshift(creation);localStorage.setItem('creations',JSON.stringify(creations));},2000);}
function generateLyrics(genre,theme){const genreLyrics=aiGeneratedLyrics[genre]||aiGeneratedLyrics['京剧'];const randomIndex=Math.floor(Math.random()*genreLyrics.length);return genreLyrics[randomIndex];}
function readLyrics(){const text=document.getElementById('result-text').textContent;if(!text)return;if('speechSynthesis'in window){const utterance=new SpeechSynthesisUtterance(text);utterance.lang='zh-CN';utterance.rate=0.8;speechSynthesis.speak(utterance);}else{alert('您的浏览器不支持语音朗读');}}
function shareToCommunity(){const text=document.getElementById('result-text').textContent;const genre=document.getElementById('result-genre').textContent;if(!text)return;const newPost={id:Date.now(),author:'我',genre:genre,text:text,likes:0,comments:0};communityData.unshift(newPost);alert('已分享到社区！');showPage('community');}

// 社区
function renderCommunityList(filter){const list=document.getElementById('community-list');const filtered=filter==='all'?communityData:communityData.filter(c=>c.genre===filter);list.innerHTML=filtered.map(post=>`<div class="community-card"><div class="community-header"><div class="community-avatar">👤</div><span class="community-author">${post.author}</span><span class="community-genre">${post.genre}</span></div><div class="community-text">${post.text}</div><div class="community-actions"><span class="community-action" onclick="likePost(${post.id})">♡ ${post.likes}</span><span class="community-action">💬 ${post.comments}</span><span class="community-action">↗ 分享</span></div></div>`).join('');}
function likePost(id){const post=communityData.find(p=>p.id===id);if(post){post.likes++;renderCommunityList(document.querySelector('.filter-btn.active')?.dataset.filter||'all');}}

// 个人中心
function addToHistory(opera){playHistory.unshift({...opera,time:new Date().toLocaleString()});if(playHistory.length>50)playHistory.pop();localStorage.setItem('playHistory',JSON.stringify(playHistory));}
function showFavorites(){alert('我的收藏：\n'+(favorites.length>0?favorites.map(f=>f.name).join('\n'):'暂无收藏'));}
function showCreations(){alert('创作历史：\n'+(creations.length>0?creations.map(c=>`[${c.genre}] ${c.theme}`).join('\n'):'暂无创作'));}
function showHistory(){alert('播放记录：\n'+(playHistory.length>0?playHistory.slice(0,5).map(h=>h.name).join('\n'):'暂无记录'));}
function showSettings(){alert('设置功能开发中...');}
function toggleFavorite(){if(!currentTrack)return;const index=favorites.findIndex(f=>f.id===currentTrack.id);if(index===-1){favorites.push(currentTrack);document.getElementById('btn-like').textContent='♥ 已收藏';}else{favorites.splice(index,1);document.getElementById('btn-like').textContent='♡ 收藏';}localStorage.setItem('favorites',JSON.stringify(favorites));}

// 初始化
document.addEventListener('DOMContentLoaded',()=>{initSpeechRecognition();initGenreSelection();renderOperaList();document.querySelectorAll('.nav-item').forEach(item=>{item.addEventListener('click',()=>showPage(item.dataset.page));});const voiceBtn=document.getElementById('voice-btn');if(voiceBtn&&recognition){voiceBtn.addEventListener('click',()=>recognition.start());}document.getElementById('generate-btn')?.addEventListener('click',generateOpera);document.getElementById('btn-read')?.addEventListener('click',readLyrics);document.getElementById('btn-regenerate')?.addEventListener('click',generateOpera);document.getElementById('btn-share-community')?.addEventListener('click',shareToCommunity);document.getElementById('btn-play')?.addEventListener('click',togglePlay);document.getElementById('btn-like')?.addEventListener('click',toggleFavorite);document.getElementById('btn-prev')?.addEventListener('click',()=>{if(!currentTrack)return;const currentIndex=operaData.findIndex(o=>o.id===currentTrack.id);const prevIndex=currentIndex>0?currentIndex-1:operaData.length-1;playOpera(operaData[prevIndex].id);});document.getElementById('btn-next')?.addEventListener('click',()=>{if(!currentTrack)return;const currentIndex=operaData.findIndex(o=>o.id===currentTrack.id);const nextIndex=currentIndex<operaData.length-1?currentIndex+1:0;playOpera(operaData[nextIndex].id);});document.querySelectorAll('.filter-btn').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderCommunityList(btn.dataset.filter);});});});
</script>

</body>
