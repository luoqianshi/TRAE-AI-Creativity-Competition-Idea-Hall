<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI表情包工坊 - 创意提案</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 50px;
            color: #fff;
        }
        .header h1 {
            font-size: 2.8em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }
        .header .subtitle {
            font-size: 1.3em;
            opacity: 0.9;
        }
        .header .badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 6px 20px;
            border-radius: 20px;
            margin-top: 15px;
            font-size: 0.95em;
            backdrop-filter: blur(10px);
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-3px);
        }
        .card h2 {
            font-size: 1.6em;
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card h2 .icon {
            font-size: 1.2em;
        }
        .card h3 {
            font-size: 1.15em;
            color: #555;
            margin: 20px 0 10px;
            padding-left: 15px;
            border-left: 4px solid #764ba2;
        }
        .card p {
            line-height: 1.8;
            color: #666;
            margin-bottom: 12px;
            font-size: 1.02em;
        }
    </style>
</head>
<body><div><h1>AI表情包工坊</h1></div></body></html>
