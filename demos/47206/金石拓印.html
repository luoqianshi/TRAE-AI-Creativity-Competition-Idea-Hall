<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金石拓印</title>
<style>
  :root {
    --ink: #1a1a1a;
    --ink-light: #3a3a3a;
    --paper: #f5f1e8;
    --paper-dark: #e8e0d0;
    --paper-light: #faf8f3;
    --vermilion: #c8553d;
    --vermilion-dark: #a8442f;
    --bronze: #6b5842;
    --bronze-light: #8b7355;
    --bronze-gold: #c9a86c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .font-title {
    font-family: "KaiTi", "STKaiti", "楷体", "Songti SC", serif;
    font-weight: 700;
  }

  /* 宣纸纹理背景 */
  .paper-texture {
    background-image:
      radial-gradient(ellipse at 20% 30%, rgba(139, 119, 91, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(139, 119, 91, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, transparent 0%, rgba(107, 88, 66, 0.03) 100%);
    background-color: var(--paper);
  }

  /* 容器 */
  .container {
    max-width: 420px;
    margin: 0 auto;
    padding: 0 16px 32px;
  }

  /* 顶部标题 */
  .header {
    text-align: center;
    padding: 32px 16px 24px;
    animation: fadeInUp 0.6s ease-out;
  }
  .header-title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 8px;
  }
  .header-line {
    width: 48px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--bronze), transparent);
    opacity: 0.6;
  }
  .header-title {
    font-size: 36px;
    color: var(--ink);
    letter-spacing: 6px;
  }
  .header-sub {
    font-size: 13px;
    color: var(--ink-light);
    letter-spacing: 4px;
    opacity: 0.8;
  }

  /* 区块通用 */
  .section {
    margin-bottom: 24px;
    animation: fadeInUp 0.6s ease-out both;
  }
  .section:nth-child(1) { animation-delay: 0.1s; }
  .section:nth-child(2) { animation-delay: 0.2s; }
  .section:nth-child(3) { animation-delay: 0.3s; }
  .section:nth-child(4) { animation-delay: 0.4s; }
  .section:nth-child(5) { animation-delay: 0.5s; }
  .section:nth-child(6) { animation-delay: 0.6s; }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-title {
    font-size: 20px;
    color: var(--ink);
    position: relative;
    padding-bottom: 4px;
  }
  .section-title::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--ink), transparent);
    opacity: 0.5;
  }
  .section-meta {
    font-size: 12px;
    color: var(--ink-light);
    opacity: 0.6;
  }

  /* 素材选择器 */
  .material-list {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 4px 0 8px;
    scrollbar-width: thin;
  }
  .material-list::-webkit-scrollbar { height: 4px; }
  .material-list::-webkit-scrollbar-thumb { background: var(--paper-dark); border-radius: 2px; }
  .material-card {
    flex-shrink: 0;
    width: 88px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--paper-dark);
    border: 2px solid transparent;
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .material-card:hover {
    transform: translateY(-4px);
    border-color: var(--vermilion);
    box-shadow: 0 8px 20px rgba(200, 85, 61, 0.25);
  }
  .material-card.active {
    border-color: var(--vermilion);
    box-shadow: 0 0 0 3px rgba(200, 85, 61, 0.2);
  }
  .material-img {
    aspect-ratio: 3/4;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .material-img-1 { background: linear-gradient(180deg, #d6d3d1, #a8a29e); }
  .material-img-2 { background: linear-gradient(180deg, #a8a29e, #78716c); }
  .material-img-3 { background: linear-gradient(180deg, #d6d3d1, #a8a29e); }
  .material-img-4 { background: linear-gradient(180deg, #b45309, #78350f); }
  .material-img-5 { background: linear-gradient(180deg, #a8a29e, #57534e); }
  .material-img-6 { background: linear-gradient(180deg, #d6d3d1, #a8a29e); }
  .material-img-text {
    font-family: "KaiTi", "STKaiti", "楷体", serif;
    color: rgba(26, 26, 26, 0.4);
    font-size: 24px;
    font-weight: 700;
  }
  .material-img-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 4px solid rgba(180, 83, 9, 0.4);
  }
  .material-name {
    padding: 6px 4px;
    text-align: center;
    background: var(--paper-light);
    font-size: 12px;
    color: var(--ink);
    font-weight: 500;
  }

  /* 画布区 */
  .canvas-wrapper {
    position: relative;
    padding: 16px;
  }
  .corner-deco {
    position: absolute;
    width: 36px;
    height: 36px;
    border: 3px solid var(--bronze);
    opacity: 0.5;
  }
  .corner-tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
  .corner-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
  .corner-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
  .corner-br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

  .canvas-frame {
    aspect-ratio: 3/4;
    background: var(--paper-light);
    border: 10px solid;
    border-image: linear-gradient(135deg, var(--bronze-light), var(--bronze-gold), var(--bronze-light), var(--bronze-gold)) 1;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.25);
  }

  .canvas-paper {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(ellipse at 30% 40%, rgba(139, 119, 91, 0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 60%, rgba(139, 119, 91, 0.05) 0%, transparent 60%);
  }

  .canvas-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }
  .canvas-text {
    font-family: "KaiTi", "STKaiti", "楷体", serif;
    color: var(--ink);
    text-align: center;
    line-height: 2.4;
    font-size: 18px;
    font-weight: 500;
  }
  .canvas-symbol {
    margin-top: 24px;
    font-size: 32px;
    opacity: 0.15;
    color: var(--ink);
  }

  /* 墨色遮罩层 */
  .canvas-mask {
    position: absolute;
    inset: 0;
    background: rgba(26, 26, 26, 0.88);
    mix-blend-mode: multiply;
  }
  .canvas-mask::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.3;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* 已拓印露出区域 */
  .canvas-revealed {
    position: absolute;
    top: 22%;
    left: 18%;
    width: 64%;
    height: 38%;
  }
  .canvas-revealed::before {
    content: '';
    position: absolute;
    inset: -20px;
    background: radial-gradient(ellipse at center, var(--paper-light) 30%, transparent 70%);
    border-radius: 50%;
    opacity: 0.95;
  }
  .canvas-revealed-text {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
    color: var(--ink);
    text-align: center;
    line-height: 2;
    font-size: 17px;
    font-weight: 500;
  }

  /* 涂抹提示 */
  .canvas-hint {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    animation: float 3s ease-in-out infinite;
    pointer-events: none;
  }
  .canvas-hint-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(245, 241, 232, 0.15);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
  }
  .canvas-hint-icon {
    width: 28px;
    height: 28px;
    fill: var(--paper);
  }
  .canvas-hint-text {
    margin-top: 6px;
    font-size: 11px;
    color: var(--paper);
    white-space: nowrap;
    font-weight: 500;
    opacity: 0.9;
  }

  /* 进度环 */
  .progress-ring {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 44px;
    height: 44px;
  }
  .progress-ring svg {
    transform: rotate(-90deg);
  }
  .progress-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--paper);
  }

  /* 工具栏 */
  .toolbar {
    background: rgba(245, 241, 232, 0.85);
    backdrop-filter: blur(8px);
    border-radius: 16px;
    padding: 14px;
    border: 1px solid rgba(107, 88, 66, 0.15);
    display: flex;
    justify-content: space-around;
  }
  .tool-item {
    text-align: center;
    cursor: pointer;
  }
  .tool-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper-dark);
    margin: 0 auto 4px;
    transition: all 0.2s ease;
  }
  .tool-icon svg {
    width: 20px;
    height: 20px;
    stroke: var(--ink);
  }
  .tool-item:hover .tool-icon {
    background: var(--ink);
    transform: scale(1.08);
  }
  .tool-item:hover .tool-icon svg {
    stroke: var(--paper);
  }
  .tool-icon.active {
    background: var(--vermilion);
  }
  .tool-icon.active svg {
    stroke: #fff;
  }
  .tool-label {
    font-size: 11px;
    color: var(--ink-light);
  }

  /* 印章区 */
  .seal-section {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(245, 241, 232, 0.6);
    border-radius: 12px;
    padding: 14px;
    border: 1px solid rgba(107, 88, 66, 0.15);
  }
  .seal-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .seal-stamp {
    width: 44px;
    height: 44px;
    border-radius: 4px;
    background: var(--vermilion);
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(3deg);
    box-shadow: 0 2px 6px rgba(200, 85, 61, 0.4);
  }
  .seal-stamp span {
    font-family: "KaiTi", "STKaiti", "楷体", serif;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
  }
  .seal-info-title {
    font-size: 14px;
    color: var(--ink);
    font-weight: 500;
  }
  .seal-info-sub {
    font-size: 12px;
    color: var(--ink-light);
    opacity: 0.7;
    margin-top: 2px;
  }
  .seal-btn {
    background: var(--vermilion);
    color: #fff;
    border: 2px solid var(--vermilion);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .seal-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(200, 85, 61, 0.4);
  }
  .seal-btn:active {
    transform: scale(0.95);
  }

  /* 知识卡片 */
  .knowledge-card {
    background: var(--paper);
    border-left: 6px solid var(--bronze);
    border-right: 6px solid var(--bronze);
    border-radius: 8px;
    padding: 18px;
    box-shadow: inset 0 0 20px rgba(139, 119, 91, 0.1), 0 4px 12px rgba(0, 0, 0, 0.08);
  }
  .knowledge-title {
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .knowledge-title::before {
    content: '';
    width: 4px;
    height: 18px;
    background: var(--vermilion);
    border-radius: 2px;
  }
  .knowledge-text {
    font-size: 13px;
    color: var(--ink-light);
    line-height: 1.8;
    margin-bottom: 10px;
  }
  .knowledge-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .knowledge-tag {
    font-size: 11px;
    background: rgba(107, 88, 66, 0.12);
    color: var(--bronze);
    padding: 3px 8px;
    border-radius: 4px;
  }

  /* 底部 */
  .footer {
    text-align: center;
    padding: 24px 0;
    font-size: 12px;
    color: var(--ink-light);
    opacity: 0.5;
  }

  /* 动画 */
  @keyframes float {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-8px); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body class="paper-texture">

  <!-- 顶部标题 -->
  <header class="header">
    <div class="header-title-row">
      <div class="header-line"></div>
      <h1 class="font-title header-title">金石拓印</h1>
      <div class="header-line"></div>
    </div>
    <p class="header-sub">指尖流淌的千年文明</p>
  </header>

  <div class="container">

    <!-- 素材选择 -->
    <section class="section">
      <div class="section-header">
        <h2 class="font-title section-title">选一块碑</h2>
        <span class="section-meta">共 6 款</span>
      </div>
      <div class="material-list">
        <div class="material-card active">
          <div class="material-img material-img-1"><span class="material-img-text">兰亭</span></div>
          <div class="material-name">兰亭序</div>
        </div>
        <div class="material-card">
          <div class="material-img material-img-2"><span class="material-img-text">鼎</span></div>
          <div class="material-name">毛公鼎</div>
        </div>
        <div class="material-card">
          <div class="material-img material-img-3"><span class="material-img-text">曹全碑</span></div>
          <div class="material-name">曹全碑</div>
        </div>
        <div class="material-card">
          <div class="material-img material-img-4"><div class="material-img-circle"></div></div>
          <div class="material-name">铜镜纹</div>
        </div>
        <div class="material-card">
          <div class="material-img material-img-5"><span class="material-img-text">石鼓</span></div>
          <div class="material-name">石鼓文</div>
        </div>
        <div class="material-card">
          <div class="material-img material-img-6"><span class="material-img-text">魏碑</span></div>
          <div class="material-name">张猛龙</div>
        </div>
      </div>
    </section>

    <!-- 拓印画布 -->
    <section class="section">
      <div class="canvas-wrapper">
        <div class="corner-deco corner-tl"></div>
        <div class="corner-deco corner-tr"></div>
        <div class="corner-deco corner-bl"></div>
        <div class="corner-deco corner-br"></div>

        <div class="canvas-frame">
          <div class="canvas-paper"></div>

          <!-- 底层文字 -->
          <div class="canvas-content">
            <div class="canvas-text">
              <p>永和九年</p>
              <p>岁在癸丑</p>
              <p>暮春之初</p>
              <p>会于会稽</p>
              <p>山阴之兰亭</p>
            </div>
            <div class="canvas-symbol">☰</div>
          </div>

          <!-- 墨色遮罩 -->
          <div class="canvas-mask"></div>

          <!-- 已拓印区域 -->
          <div class="canvas-revealed">
            <div class="canvas-revealed-text">
              <p>永和九年</p>
              <p>岁在癸丑</p>
            </div>
          </div>

          <!-- 进度环 -->
          <div class="progress-ring">
            <svg width="44" height="44" viewBox="0 0 44 44">
              <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(245, 241, 232, 0.2)" stroke-width="3"/>
              <circle cx="22" cy="22" r="18" fill="none" stroke="#f5f1e8" stroke-width="3"
                stroke-dasharray="39.6 113.1" stroke-linecap="round"/>
            </svg>
            <div class="progress-text">35%</div>
          </div>

          <!-- 涂抹提示 -->
          <div class="canvas-hint">
            <div class="canvas-hint-circle">
              <svg class="canvas-hint-icon" viewBox="0 0 24 24">
                <path d="M9 11V6a2 2 0 014 0v5h2V8a2 2 0 114 0v5h1a2 2 0 012 2v3a7 7 0 01-7 7h-2a7 7 0 01-7-7v-3a2 2 0 012-2h1z"/>
              </svg>
            </div>
            <div class="canvas-hint-text">← 滑动涂抹 →</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 工具栏 -->
    <section class="section">
      <div class="toolbar">
        <div class="tool-item">
          <div class="tool-icon active">
            <svg fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
            </svg>
          </div>
          <p class="tool-label">拓印</p>
        </div>
        <div class="tool-item">
          <div class="tool-icon">
            <svg fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
          </div>
          <p class="tool-label">重拓</p>
        </div>
        <div class="tool-item">
          <div class="tool-icon">
            <svg fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
          </div>
          <p class="tool-label">保存</p>
        </div>
        <div class="tool-item">
          <div class="tool-icon">
            <svg fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
            </svg>
          </div>
          <p class="tool-label">分享</p>
        </div>
        <div class="tool-item">
          <div class="tool-icon">
            <svg fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
          <p class="tool-label">介绍</p>
        </div>
      </div>
    </section>

    <!-- 印章落款 -->
    <section class="section">
      <div class="seal-section">
        <div class="seal-left">
          <div class="seal-stamp"><span>拓印</span></div>
          <div>
            <p class="seal-info-title">添加印章</p>
            <p class="seal-info-sub">自定义你的落款</p>
          </div>
        </div>
        <button class="seal-btn">去设置</button>
      </div>
    </section>

    <!-- 知识卡片 -->
    <section class="section">
      <div class="knowledge-card">
        <h3 class="font-title knowledge-title">拓印小知识</h3>
        <p class="knowledge-text">
          拓印是中国古代重要的文献复制技艺，相传始于东汉。将湿润的宣纸敷在碑刻或青铜器上，用墨包轻轻拍打，文字和花纹便清晰地复制下来。
        </p>
        <div class="knowledge-tags">
