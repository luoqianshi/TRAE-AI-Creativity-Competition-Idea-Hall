<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拉花实验室 · 咖啡拉花设计师</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Helvetica Neue","PingFang SC",sans-serif;}
  html,body{width:100%;height:100%;overflow:hidden;
    background:linear-gradient(160deg,#3e2723 0%,#5d4037 60%,#4e342e 100%);color:#f5e6d3;}
  body::before{content:"";position:fixed;inset:0;
    background:radial-gradient(circle at 50% 20%,rgba(245,230,211,0.08),transparent 60%);pointer-events:none;}

  header{display:flex;justify-content:space-between;align-items:center;padding:18px 40px;
    border-bottom:1px solid rgba(245,230,211,0.15);}
  .logo{font-size:26px;font-weight:300;letter-spacing:6px;}
  .logo b{font-weight:700;color:#d7a86e;}
  .info{font-size:12px;opacity:0.6;letter-spacing:2px;}

  .layout{display:grid;grid-template-rows:auto 1fr auto;height:calc(100% - 65px);padding:18px 30px;gap:14px;}

  /* 图案选择栏 */
  .pattern-bar{display:flex;gap:12px;justify-content:center;align-items:center;}
  .pattern-bar .label{font-size:12px;opacity:0.6;letter-spacing:2px;margin-right:8px;}
  .pat-chip{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
    padding:8px 12px;border-radius:14px;border:1px solid rgba(245,230,211,0.2);
    background:rgba(245,230,211,0.05);transition:all .3s;min-width:74px;}
  .pat-chip:hover{background:rgba(245,230,211,0.12);transform:translateY(-3px);}
  .pat-chip.active{background:rgba(215,168,110,0.25);border-color:#d7a86e;box-shadow:0 4px 15px rgba(215,168,110,0.3);}
  .pat-chip svg{width:38px;height:38px;stroke:#f5e6d3;fill:none;stroke-width:2;}
  .pat-chip.active svg{stroke:#d7a86e;}
  .pat-chip span{font-size:10px;letter-spacing:1px;opacity:0.8;}

  /* 中央咖啡杯 */
  .cup-stage{display:flex;align-items:center;justify-content:center;position:relative;}
  .cup-wrap{position:relative;width:440px;height:440px;}
  .ripple{position:absolute;inset:0;border-radius:50%;pointer-events:none;}
  .ripple span{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(245,230,211,0.15);
    animation:rippleAnim 3s ease-out infinite;}
  .ripple span:nth-child(2){animation-delay:1s;}
  .ripple span:nth-child(3){animation-delay:2s;}
  @keyframes rippleAnim{0%{transform:scale(0.5);opacity:0.6;}100%{transform:scale(1);opacity:0;}}

  .cup-svg{width:100%;height:100%;filter:drop-shadow(0 20px 40px rgba(0,0,0,0.5));}
  .cup-svg .saucer{fill:#3e2723;stroke:#d7a86e;stroke-width:1;}
  .cup-svg .cup-rim{fill:#5d4037;stroke:#d7a86e;stroke-width:2;}
  .cup-svg .coffee-surface{fill:#4a2c20;cursor:crosshair;}
  .cup-svg .surface-glow{fill:url(#surfaceGrad);pointer-events:none;}
  .foam-path{stroke:#f5e6d3;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 0 2px rgba(245,230,211,0.6));}

  .pour-cursor{position:absolute;width:20px;height:30px;pointer-events:none;z-index:20;display:none;}
  .pour-cursor .stream{position:absolute;top:0;left:50%;width:3px;height:30px;
    background:linear-gradient(180deg,rgba(245,230,211,0.9),rgba(245,230,211,0.3));
    border-radius:2px;animation:pourStream .3s linear infinite;}
  @keyframes pourStream{0%{transform:translateY(-10px);opacity:0;}50%{opacity:1;}100%{transform:translateY(5px);opacity:0;}}

  .canvas-hint{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);
    font-size:12px;letter-spacing:2px;opacity:0.5;white-space:nowrap;}

  /* 粒子层 */
  .particles{position:absolute;inset:0;pointer-events:none;z-index:15;}

  /* 底部工具栏 */
  .toolbar{display:flex;gap:24px;align-items:center;justify-content:center;
    background:rgba(245,230,211,0.06);border:1px solid rgba(245,230,211,0.15);
    border-radius:20px;padding:14px 28px;backdrop-filter:blur(8px);}
  .tool{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:130px;}
  .tool label{font-size:11px;letter-spacing:2px;opacity:0.7;}
  .tool input[type=range]{width:100%;accent-color:#d7a86e;cursor:pointer;}
  .tool .val{font-size:10px;opacity:0.5;}
  .tool-btn{background:transparent;border:1px solid rgba(245,230,211,0.3);color:#f5e6d3;
    padding:10px 22px;border-radius:20px;cursor:pointer;letter-spacing:2px;font-size:12px;transition:all .3s;}
  .tool-btn:hover{background:#d7a86e;color:#3e2723;border-color:#d7a86e;}
  .tool-btn.primary{background:#d7a86e;color:#3e2723;border-color:#d7a86e;font-weight:bold;}

  .steam{position:absolute;top:-60px;left:50%;transform:translateX(-50%);
    display:flex;gap:20px;pointer-events:none;}
  .steam span{width:6px;height:50px;background:linear-gradient(180deg,rgba(245,230,211,0.5),transparent);
    border-radius:50%;animation:steamRise 3s ease-in-out infinite;}
  .steam span:nth-child(2){animation-delay:1s;height:40px;}
  .steam span:nth-child(3){animation-delay:2s;height:55px;}
  @keyframes steamRise{0%{transform:translateY(20px) scale(1);opacity:0;}50%{opacity:0.6;}100%{transform:translateY(-30px) scale(1.5);opacity:0;}}

  .toast{position:fixed;top:90px;left:50%;transform:translateX(-50%) translateY(-30px);
    background:rgba(215,168,110,0.95);color:#3e2723;padding:10px 24px;border-radius:20px;
    font-size:13px;letter-spacing:2px;opacity:0;transition:all .4s;z-index:100;font-weight:600;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .drop{position:absolute;width:8px;height:12px;background:radial-gradient(circle,#6b4423,#3e2723);
    border-radius:50% 50% 50% 50%/60% 60% 40% 40%;pointer-events:none;z-index:18;}
</style>
</head>
<body>

<header>
  <div class="logo">拉花<b>实验室</b></div>
  <div class="info">拖动奶缸在咖啡表面绘制</div>
</header>

<div class="layout">
  <div class="pattern-bar">
    <span class="label">图 案</span>
    <div class="pat-chip active" data-pat="heart" onclick="selectPattern(this)">
      <svg viewBox="0 0 40 40"><path d="M20,32 C8,22 8,12 14,12 C18,12 20,16 20,16 C20,16 22,12 26,12 C32,12 32,22 20,32 Z"/></svg>
      <span>心形</span>
    </div>
    <div class="pat-chip" data-pat="tulip" onclick="selectPattern(this)">
      <svg viewBox="0 0 40 40"><path d="M20,8 Q12,18 20,22 Q28,18 20,8 M20,22 Q14,28 20,30 Q26,28 20,22"/></svg>
      <span>郁金香</span>
    </div>
    <div class="pat-chip" data-pat="swan" onclick="selectPattern(this)">
      <svg viewBox="0 0 40 40"><path d="M10,28 Q20,10 30,22 Q35,28 28,30 M28,30 Q32,18 36,16"/></svg>
      <span>天鹅</span>
    </div>
    <div class="pat-chip" data-pat="leaf" onclick="selectPattern(this)">
      <svg viewBox="0 0 40 40"><path d="M20,6 Q6,20 20,34 Q34,20 20,6 M20,6 L20,34 M14,16 L20,12 M26,16 L20,12 M14,24 L20,28 M26,24 L20,28"/></svg>
      <span>树叶</span>
    </div>
    <div class="pat-chip" data-pat="rosetta" onclick="selectPattern(this)">
      <svg viewBox="0 0 40 40"><path d="M20,8 Q12,14 16,20 Q12,26 20,32 Q28,26 24,20 Q28,14 20,8 M10,20 L30,20"/></svg>
      <span>罗塞塔</span>
    </div>
  </div>

  <div class="cup-stage">
    <div class="cup-wrap" id="cupWrap">
      <div class="steam"><span></span><span></span><span></span></div>
      <div class="ripple"><span></span><span></span><span></span></div>
      <svg class="cup-svg" viewBox="0 0 440 440">
        <defs>
          <radialGradient id="surfaceGrad" cx="50%" cy="45%" r="55%">
            <stop offset="0%" stop-color="#6b4423" stop-opacity="0.6"/>
            <stop offset="70%" stop-color="#4a2c20" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#3e2723" stop-opacity="0.8"/>
          </radialGradient>
        </defs>
        <ellipse class="saucer" cx="220" cy="400" rx="180" ry="22"/>
        <ellipse class="cup-rim" cx="220" cy="220" rx="170" ry="165"/>
        <ellipse class="coffee-surface" id="surface" cx="220" cy="220" rx="158" ry="153"/>
        <ellipse class="surface-glow" cx="220" cy="210" rx="150" ry="145"/>
        <g id="foamLayer"></g>
      </svg>
      <div class="pour-cursor" id="pourCursor"><div class="stream"></div></div>
      <canvas class="particles" id="particles" width="440" height="440"></canvas>
      <div class="canvas-hint" id="hint">按住鼠标在咖啡液面上绘制拉花</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="tool">
      <label>奶缸倾角</label>
      <input type="range" min="20" max="80" value="45" id="angle" oninput="updateAngle(this.value)">
      <span class="val" id="angleVal">45°</span>
    </div>
    <div class="tool">
      <label>注入速度</label>
      <input type="range" min="1" max="10" value="5" id="speed" oninput="updateSpeed(this.value)">
      <span class="val" id="speedVal">5</span>
    </div>
    <div class="tool">
      <label>奶沫粗细</label>
      <input type="range" min="1" max="8" value="3" id="thickness" oninput="updateThickness(this.value)">
      <span class="val" id="thicknessVal">3</span>
    </div>
    <button class="tool-btn" onclick="resetCup()">重 置</button>
    <button class="tool-btn primary" onclick="saveLatte()">保 存 预 览</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentPattern='heart', drawing=false, lastX=0, lastY=0;
let angle=45, speed=5, thickness=3;
const surface=document.getElementById('surface');
const foamLayer=document.getElementById('foamLayer');
const cupWrap=document.getElementById('cupWrap');
const pourCursor=document.getElementById('pourCursor');
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
let particles=[];

function selectPattern(el){
  document.querySelectorAll('.pat-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  currentPattern=el.dataset.pat;
  showToast('已选择：'+el.querySelector('span').textContent);
  if(!drawing) drawGuidePattern();
}

function getSVGPos(e){
  const rect=surface.getBoundingClientRect();
  const cupRect=cupWrap.getBoundingClientRect();
  const x=((e.clientX-cupRect.left)/cupRect.width)*440;
  const y=((e.clientY-cupRect.top)/cupRect.height)*440;
  return{x,y};
}
function inCup(x,y){
  const dx=x-220,dy=y-220;
  return (dx*dx)/(158*158)+(dy*dy)/(153*153)<=1;
}

surface.addEventListener('mousedown',e=>{
  drawing=true;
  pourCursor.style.display='block';
  const{x,y}=getSVGPos(e);
  lastX=x;lastY=y;
  document.getElementById('hint').style.opacity='0';
  startPour(x,y);
});
surface.addEventListener('mousemove',e=>{
  if(!drawing)return;
  const{x,y}=getSVGPos(e);
  if(inCup(x,y)){
    drawFoamSegment(lastX,lastY,x,y);
    spawnParticles(x,y);
    lastX=x;lastY=y;
  }
});
window.addEventListener('mouseup',()=>{
  if(drawing){drawing=false;pourCursor.style.display='none';}
});
surface.addEventListener('mousemove',e=>{
  if(drawing){
    const cupRect=cupWrap.getBoundingClientRect();
    pourCursor.style.left=(e.clientX-cupRect.left-10)+'px';
    pourCursor.style.top=(e.clientY-cupRect.top-30)+'px';
  }
});

function drawFoamSegment(x1,y1,x2,y2){
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  const w=thickness+(angle-45)/15;
  path.setAttribute('d',`M${x1},${y1} L${x2},${y2}`);
  path.setAttribute('class','foam-path');
  path.setAttribute('stroke-width',Math.max(1,w));
  path.style.opacity='0';
  path.style.transition='opacity .3s';
  foamLayer.appendChild(path);
  requestAnimationFrame(()=>path.style.opacity='0.9');
}

function startPour(x,y){
  for(let i=0;i<3;i++){
    setTimeout(()=>spawnParticles(x,y),i*100);
  }
}

function spawnParticles(x,y){
  for(let i=0;i<2;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*speed*0.4,
      vy:(Math.random()-0.5)*speed*0.4-0.3,
      life:1,
      size:Math.random()*thickness+1
    });
  }
}

function animateParticles(){
  ctx.clearRect(0,0,440,440);
  particles=particles.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.life-=0.02;
    if(p.life<=0)return false;
    ctx.fillStyle=`rgba(245,230,211,${p.life*0.7})`;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
    return true;
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

function drawGuidePattern(){
  foamLayer.innerHTML='';
  const guides={
    heart:'M220,300 C150,240 150,180 185,180 C210,180 220,200 220,200 C220,200 230,180 255,180 C290,180 290,240 220,300 Z',
    tulip:'M220,150 Q180,190 220,210 Q260,190 220,150 M220,210 Q190,240 220,255 Q250,240 220,210',
    swan:'M150,280 Q220,160 290,240 Q310,280 270,290 M270,290 Q300,220 330,200',
    leaf:'M220,140 Q150,220 220,320 Q290,220 220,140 M220,140 L220,320',
    rosetta:'M220,140 Q170,190 200,220 Q170,250 220,310 Q270,250 240,220 Q270,190 220,140 M150,220 L290,220'
  };
  if(guides[currentPattern]){
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',guides[currentPattern]);
    p.setAttribute('class','foam-path');
    p.setAttribute('stroke-width','2');
    p.style.opacity='0.15';
    p.style.strokeDasharray='4 4';
    foamLayer.appendChild(p);
  }
}

function updateAngle(v){angle=+v;document.getElementById('angleVal').textContent=v+'°';}
function updateSpeed(v){speed=+v;document.getElementById('speedVal').textContent=v;}
function updateThickness(v){thickness=+v;document.getElementById('thicknessVal').textContent=v;}

function resetCup(){
  foamLayer.innerHTML='';
  particles=[];
  ctx.clearRect(0,0,440,440);
  document.getElementById('hint').style.opacity='0.5';
  showToast('已重置');
}
function saveLatte(){
  showToast('拉花预览已保存');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),1800);
}

// 咖啡液滴
setInterval(()=>{
  if(Math.random()>0.7){
    const drop=document.createElement('div');
    drop.className='drop';
    const x=Math.random()*300+70;
    drop.style.left=x+'px';
    drop.style.top='0px';
    drop.style.transition='all 1.5s ease-in';
    cupWrap.appendChild(drop);
    requestAnimationFrame(()=>{drop.style.top='180px';drop.style.opacity='0';});
    setTimeout(()=>drop.remove(),1600);
  }
},2500);
</script>
</body>
</html>
