<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>叙世者·寰球志 - GeoNarrator</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0a0e27; overflow: hidden; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: relative; }
        
        .header { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 100; pointer-events: none; }
        .title { font-size: 36px; font-weight: bold; color: #fff; letter-spacing: 8px; text-shadow: 0 0 20px rgba(231,76,60,0.6); margin-bottom: 8px; }
        .title::after { content: ''; display: block; width: 60px; height: 3px; background: linear-gradient(90deg,transparent,#e74c3c,transparent); margin: 10px auto 0; }
        .slogan { font-size: 14px; color: rgba(255,255,255,0.6); letter-spacing: 4px; }
        
        .footer { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 100; pointer-events: none; }
        .footer-text { font-size: 12px; color: rgba(255,255,255,0.4); letter-spacing: 2px; }
        
        .info-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0); width: 320px; max-width: 90vw; background: rgba(20,25,50,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 24px; z-index: 200; opacity: 0; transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1); box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(231,76,60,0.2) inset; }
        .info-panel.active { transform: translate(-50%,-50%) scale(1); opacity: 1; }
        
        .panel-header { display: flex; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .country-emoji { font-size: 48px; margin-right: 16px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);} }
        .country-name { font-size: 24px; font-weight: bold; color: #fff; }
        .country-name-en { font-size: 12px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 2px; }
        
        .section-title { font-size: 13px; color: #e74c3c; font-weight: bold; margin-bottom: 8px; letter-spacing: 1px; }
        .culture-text { font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1.6; margin-bottom: 16px; }
        
        .events-list { list-style: none; }
        .event-item { display: flex; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .event-item:last-child { border-bottom: none; }
        .event-year { font-size: 12px; color: #e74c3c; font-weight: bold; min-width: 80px; margin-right: 12px; }
        .event-desc { font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.5; }
        
        .close-btn { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border: none; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .close-btn:hover { background: rgba(231,76,60,0.3); color: #fff; }
        
        .hint { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 100; pointer-events: none; }
        .hint-text { font-size: 12px; color: rgba(255,255,255,0.3); letter-spacing: 1px; }
        
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; z-index: 300; }
        .loading-circle { width: 40px; height: 40px; border: 2px solid rgba(231,76,60,0.3); border-top-color: #e74c3c; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 14px; color: rgba(255,255,255,0.6); letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="loading" id="loading"><div class="loading-circle"></div><div class="loading-text">正在探索世界...</div></div>
    <div id="canvas-container"></div>
    
    <div class="header"><div class="title">叙世者·寰球志</div><div class="slogan">让地球成为一本可以走进的故事书</div></div>
    <div class="hint"><div class="hint-text">🖱️ 拖拽旋转 • 滚轮缩放 • 点击标记查看详情</div></div>
    <div class="footer"><div class="footer-text">TRAE大赛参赛作品</div></div>
    
    <div class="info-panel" id="infoPanel">
        <button class="close-btn" onclick="closeInfoPanel()">×</button>
        <div class="panel-header"><div class="country-emoji" id="panelEmoji">🇨🇳</div><div><div class="country-name" id="panelName">中国</div><div class="country-name-en" id="panelNameEn">China</div></div></div>
        <div><div class="section-title">风土人情</div><div class="culture-text" id="panelCulture">五千年的文明古国，茶文化、京剧、春节</div></div>
        <div><div class="section-title">历史大事件</div><ul class="events-list" id="panelEvents"></ul></div>
    </div>

    <script>
    (function () {
        const _changeEvent = { type: 'change' };
        const _startEvent = { type: 'start' };
        const _endEvent = { type: 'end' };
        const _ray = new THREE.Ray();
        const _plane = new THREE.Plane();
        const TILT_LIMIT = Math.cos( 70 * THREE.MathUtils.DEG2RAD );

        class OrbitControls extends THREE.EventDispatcher {
            constructor( object, domElement ) {
                super();
                this.object = object;
                this.domElement = domElement;
                this.domElement.style.touchAction = 'none';

                this.enabled = true;
                this.target = new THREE.Vector3();
                this.cursor = new THREE.Vector3();
                this.minDistance = 0;
                this.maxDistance = Infinity;
                this.minZoom = 0;
                this.maxZoom = Infinity;
                this.minTargetRadius = 0;
                this.maxTargetRadius = Infinity;
                this.minPolarAngle = 0;
                this.maxPolarAngle = Math.PI;
                this.minAzimuthAngle = - Infinity;
                this.maxAzimuthAngle = Infinity;
                this.enableDamping = false;
                this.dampingFactor = 0.05;
                this.enableZoom = true;
                this.zoomSpeed = 1.0;
                this.enableRotate = true;
                this.rotateSpeed = 1.0;
                this.enablePan = true;
                this.panSpeed = 1.0;
                this.screenSpacePanning = true;
                this.keyPanSpeed = 7.0;
                this.zoomToCursor = false;
                this.autoRotate = false;
                this.autoRotateSpeed = 2.0;
                this.keys = { LEFT: 'ArrowLeft', UP: 'ArrowUp', RIGHT: 'ArrowRight', BOTTOM: 'ArrowDown' };
                this.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
                this.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

                this.target0 = this.target.clone();
                this.position0 = this.object.position.clone();
                this.zoom0 = this.object.zoom;
                this._domElementKeyEvents = null;

                this.getPolarAngle = function () { return spherical.phi; };
                this.getAzimuthalAngle = function () { return spherical.theta; };
                this.getDistance = function () { return this.object.position.distanceTo( this.target ); };

                this.listenToKeyEvents = function ( domElement ) {
                    domElement.addEventListener( 'keydown', onKeyDown );
                    this._domElementKeyEvents = domElement;
                };

                this.stopListenToKeyEvents = function () {
                    this._domElementKeyEvents.removeEventListener( 'keydown', onKeyDown );
                    this._domElementKeyEvents = null;
                };

                this.saveState = function () {
                    scope.target0.copy( scope.target );
                    scope.position0.copy( scope.object.position );
                    scope.zoom0 = scope.object.zoom;
                };

                this.reset = function () {
                    scope.target.copy( scope.target0 );
                    scope.object.position.copy( scope.position0 );
                    scope.object.zoom = scope.zoom0;
                    scope.object.updateProjectionMatrix();
                    scope.dispatchEvent( _changeEvent );
                    scope.update();
                    state = STATE.NONE;
                };

                this.update = function () {
                    const offset = new THREE.Vector3();
                    const quat = new THREE.Quaternion().setFromUnitVectors( object.up, new THREE.Vector3( 0, 1, 0 ) );
                    const quatInverse = quat.clone().invert();
                    const lastPosition = new THREE.Vector3();
                    const lastQuaternion = new THREE.Quaternion();
                    const lastTargetPosition = new THREE.Vector3();
                    const twoPI = 2 * Math.PI;

                    return function update( deltaTime = null ) {
                        const position = scope.object.position;
                        offset.copy( position ).sub( scope.target );
                        offset.applyQuaternion( quat );
                        spherical.setFromVector3( offset );

                        if ( scope.autoRotate && state === STATE.NONE ) {
                            rotateLeft( getAutoRotationAngle( deltaTime ) );
                        }

                        if ( scope.enableDamping ) {
                            spherical.theta += sphericalDelta.theta * scope.dampingFactor;
                            spherical.phi += sphericalDelta.phi * scope.dampingFactor;
                        } else {
                            spherical.theta += sphericalDelta.theta;
                            spherical.phi += sphericalDelta.phi;
                        }

                        let min = scope.minAzimuthAngle;
                        let max = scope.maxAzimuthAngle;
                        if ( isFinite( min ) && isFinite( max ) ) {
                            if ( min < - Math.PI ) min += twoPI; else if ( min > Math.PI ) min -= twoPI;
                            if ( max < - Math.PI ) max += twoPI; else if ( max > Math.PI ) max -= twoPI;
                            if ( min <= max ) {
                                spherical.theta = Math.max( min, Math.min( max, spherical.theta ) );
                            } else {
                                spherical.theta = ( spherical.theta > ( min + max ) / 2 ) ?
                                    Math.max( min, spherical.theta ) :
                                    Math.min( max, spherical.theta );
                            }
                        }

                        spherical.phi = Math.max( scope.minPolarAngle, Math.min( scope.maxPolarAngle, spherical.phi ) );
                        spherical.makeSafe();

                        if ( scope.enableDamping === true ) {
                            scope.target.addScaledVector( panOffset, scope.dampingFactor );
                        } else {
                            scope.target.add( panOffset );
                        }

                        scope.target.sub( scope.cursor );
                        scope.target.clampLength( scope.minTargetRadius, scope.maxTargetRadius );
                        scope.target.add( scope.cursor );

                        if ( scope.zoomToCursor && performCursorZoom || scope.object.isOrthographicCamera ) {
                            spherical.radius = clampDistance( spherical.radius );
                        } else {
                            spherical.radius = clampDistance( spherical.radius * scale );
                        }

                        offset.setFromSpherical( spherical );
                        offset.applyQuaternion( quatInverse );
                        position.copy( scope.target ).add( offset );
                        scope.object.lookAt( scope.target );

                        if ( scope.enableDamping === true ) {
                            sphericalDelta.theta *= ( 1 - scope.dampingFactor );
                            sphericalDelta.phi *= ( 1 - scope.dampingFactor );
                            panOffset.multiplyScalar( 1 - scope.dampingFactor );
                        } else {
                            sphericalDelta.set( 0, 0, 0 );
                            panOffset.set( 0, 0, 0 );
                        }

                        let zoomChanged = false;
                        if ( scope.zoomToCursor && performCursorZoom ) {
                            let newRadius = null;
                            if ( scope.object.isPerspectiveCamera ) {
                                const prevRadius = offset.length();
                                newRadius = clampDistance( prevRadius * scale );
                                const radiusDelta = prevRadius - newRadius;
                                scope.object.position.addScaledVector( dollyDirection, radiusDelta );
                                scope.object.updateMatrixWorld();
                            } else if ( scope.object.isOrthographicCamera ) {
                                const mouseBefore = new THREE.Vector3( mouse.x, mouse.y, 0 );
                                mouseBefore.unproject( scope.object );
                                scope.object.zoom = Math.max( scope.minZoom, Math.min( scope.maxZoom, scope.object.zoom / scale ) );
                                scope.object.updateProjectionMatrix();
                                zoomChanged = true;
                                const mouseAfter = new THREE.Vector3( mouse.x, mouse.y, 0 );
                                mouseAfter.unproject( scope.object );
                                scope.object.position.sub( mouseAfter ).add( mouseBefore );
                                scope.object.updateMatrixWorld();
                                newRadius = offset.length();
                            } else {
                                console.warn( 'WARNING: OrbitControls.js encountered an unknown camera type - zoom to cursor disabled.' );

                                        .transformDirection( scope.object.matrix )
                                        .multiplyScalar( newRadius )
                                        .add( scope.object.position );
                                } else {
                                    _ray.origin.copy( scope.object.position );
                                    _ray.direction.set( 0, 0, - 1 ).transformDirection( scope.object.matrix );

                                        object.lookAt( scope.target );
                                    } else {
                                        _plane.setFromNormalAndCoplanarPoint( scope.object.up, scope.target );
                                        _ray.intersectPlane( _plane, scope.target );
                                    }
                                }
                            }
                        } else if ( scope.object.isOrthographicCamera ) {
                            scope.object.zoom = Math.max( scope.minZoom, Math.min( scope.maxZoom, scope.object.zoom / scale ) );
                            scope.object.updateProjectionMatrix();
                            zoomChanged = true;
                        }

                        scale = 1;
                        performCursorZoom = false;

                        if ( zoomChanged ||
                            lastPosition.distanceToSquared( scope.object.position ) > EPS ||
                            8 * ( 1 - lastQuaternion.dot( scope.object.quaternion ) ) > EPS ||
                            lastTargetPosition.distanceToSquared( scope.target ) > 0 ) {
                            scope.dispatchEvent( _changeEvent );
                            lastPosition.copy( scope.object.position );
                            lastQuaternion.copy( scope.object.quaternion );
                            lastTargetPosition.copy( scope.target );
                            return true;
                        }
                        return false;
                    };
                }();

                this.dispose = function () {
                    scope.domElement.removeEventListener( 'contextmenu', onContextMenu );
                    scope.domElement.removeEventListener( 'pointerdown', onPointerDown );
                    scope.domElement.removeEventListener( 'pointercancel', onPointerUp );
                    scope.domElement.removeEventListener( 'wheel', onMouseWheel );
                    scope.domElement.removeEventListener( 'pointermove', onPointerMove );
                    scope.domElement.removeEventListener( 'pointerup', onPointerUp );
                    if ( scope._domElementKeyEvents !== null ) {
                        scope._domElementKeyEvents.removeEventListener( 'keydown', onKeyDown );
                        scope._domElementKeyEvents = null;
                    }
                };

                const scope = this;
                const STATE = {
                    NONE: - 1, ROTATE: 0, DOLLY: 1, PAN: 2,
                    TOUCH_ROTATE: 3, TOUCH_PAN: 4, TOUCH_DOLLY_PAN: 5, TOUCH_DOLLY_ROTATE: 6
                };
                let state = STATE.NONE;
                const EPS = 0.000001;
                const spherical = new THREE.Spherical();
                const sphericalDelta = new THREE.Spherical();
                let scale = 1;
                const panOffset = new THREE.Vector3();
                const rotateStart = new THREE.Vector2();
                const rotateEnd = new THREE.Vector2();
                const rotateDelta = new THREE.Vector2();
                const panStart = new THREE.Vector2();
                const panEnd = new THREE.Vector2();
                const panDelta = new THREE.Vector2();
                const dollyStart = new THREE.Vector2();
                const dollyEnd = new THREE.Vector2();
                const dollyDelta = new THREE.Vector2();
                const dollyDirection = new THREE.Vector3();
                const mouse = new THREE.Vector2();
                let performCursorZoom = false;
                const pointers = [];
                const pointerPositions = {};

                function getAutoRotationAngle( deltaTime ) {
                    if ( deltaTime !== null ) {
                        return ( 2 * Math.PI / 60 * scope.autoRotateSpeed ) * deltaTime;
                    } else {
                        return 2 * Math.PI / 60 / 60 * scope.autoRotateSpeed;
                    }
                }

                function getZoomScale( delta ) {
                    const normalized_delta = Math.abs( delta ) / ( 100 * ( window.devicePixelRatio | 0 ) );
                    return Math.pow( 0.95, scope.zoomSpeed * normalized_delta );
                }

                function rotateLeft( angle ) { sphericalDelta.theta -= angle; }
                function rotateUp( angle ) { sphericalDelta.phi -= angle; }

                const panLeft = function () {
                    const v = new THREE.Vector3();
                    return function panLeft( distance, objectMatrix ) {
                        v.setFromMatrixColumn( objectMatrix, 0 );
                        v.multiplyScalar( - distance );
                        panOffset.add( v );
                    };
                }();

                const panUp = function () {
                    const v = new THREE.Vector3();
                    return function panUp( distance, objectMatrix ) {
                        if ( scope.screenSpacePanning === true ) {
                            v.setFromMatrixColumn( objectMatrix, 1 );
                        } else {
                            v.setFromMatrixColumn( objectMatrix, 0 );
                            v.crossVectors( scope.object.up, v );
                        }
                        v.multiplyScalar( distance );
                        panOffset.add( v );
                    };
                }();

                const pan = function () {
                    const offset = new THREE.Vector3();
                    return function pan( deltaX, deltaY ) {
                        const element = scope.domElement;
                        if ( scope.object.isPerspectiveCamera ) {
                            const position = scope.object.position;
                            offset.copy( position ).sub( scope.target );
                            let targetDistance = offset.length();
                            targetDistance *= Math.tan( ( scope.object.fov / 2 ) * Math.PI / 180.0 );
                            panLeft( 2 * deltaX * targetDistance / element.clientHeight, scope.object.matrix );
                            panUp( 2 * deltaY * targetDistance / element.clientHeight, scope.object.matrix );
                        } else if ( scope.object.isOrthographicCamera ) {
                            panLeft( deltaX * ( scope.object.right - scope.object.left ) / scope.object.zoom / element.clientWidth, scope.object.matrix );
                            panUp( deltaY * ( scope.object.top - scope.object.bottom ) / scope.object.zoom / element.clientHeight, scope.object.matrix );
                        } else {
                            console.warn( 'WARNING: OrbitControls.js encountered an unknown camera type - pan disabled.' );
                            scope.enablePan = false;
                        }
                    };
                }();

                function dollyOut( dollyScale ) {
                    if ( scope.object.isPerspectiveCamera || scope.object.isOrthographicCamera ) {
                        scale /= dollyScale;
                    } else {
                        console.warn( 'WARNING: OrbitControls.js encountered an unknown camera type - dolly/zoom disabled.' );
                        scope.enableZoom = false;
                    }
                }

                function dollyIn( dollyScale ) {
                    if ( scope.object.isPerspectiveCamera || scope.object.isOrthographicCamera ) {
                        scale *= dollyScale;
                    } else {
                        console.warn( 'WARNING: OrbitControls.js encountered an unknown camera type - dolly/zoom disabled.' );
                        scope.enableZoom = false;
                    }

                    return Math.max( scope.minDistance, Math.min( scope.maxDistance, dist ) );

                        case 0: mouseAction = scope.mouseButtons.LEFT; break;

                        case THREE.MOUSE.PAN:
                            if ( scope.enablePan === false ) return;
                            panStart.set( event.clientX, event.clientY );
                            state = STATE.PAN;
                            break;

                        scope.dispatchEvent( _startEvent );
                    }

                function onMouseMove( event ) {
                    if ( scope.enabled === false ) return;

                            rotateUp( 2 * Math.PI * rotateDelta.y / scope.domElement.clientHeight );

                            break;

                            break;

                        dollyIn( getZoomScale( event.deltaY ) );

                    } else if ( pointers.length === 2 ) {
                        const position = getSecondPointerPosition( touch );
                        const dx = touch.clientX - position.x;
                        const dy = touch.clientY - position.y;
                        const distance = Math.sqrt( dx * dx + dy * dy );
                        dollyStart.set( 0, distance );
                        panStart.set( ( touch.clientX + position.x ) / 2, ( touch.clientY + position.y ) / 2 );
                        const touchAction = scope.touches.TWO;
                        if ( touchAction === THREE.TOUCH.DOLLY_PAN ) {
                            state = STATE.TOUCH_DOLLY_PAN;
                        } else if ( touchAction === THREE.TOUCH.DOLLY_ROTATE ) {
                            state = STATE.TOUCH_DOLLY_ROTATE;
                        }
                    }
                    if ( state !== STATE.NONE ) {
                        scope.dispatchEvent( _startEvent );
                    }
                }

                function onTouchMove( event ) {
                    const touch = event;
                    pointerPositions[ touch.pointerId ] = { x: touch.clientX, y: touch.clientY };
                    if ( pointers.length === 1 ) {
                        if ( scope.enableRotate === false ) return;
                        rotateEnd.set( touch.clientX, touch.clientY );
                        rotateDelta.subVectors( rotateEnd, rotateStart ).multiplyScalar( scope.rotateSpeed );
                        rotateLeft( 2 * Math.PI * rotateDelta.x / scope.domElement.clientWidth );
                        rotateUp( 2 * Math.PI * rotateDelta.y / scope.domElement.clientHeight );
                        rotateStart.copy( rotateEnd );
                        scope.update();
                    } else if ( pointers.length === 2 ) {
                        const position = getSecondPointerPosition( touch );
                        const dx = touch.clientX - position.x;
                        const dy = touch.clientY - position.y;
                        const distance = Math.sqrt( dx * dx + dy * dy );
                        if ( state === STATE.TOUCH_DOLLY_PAN || state === STATE.TOUCH_DOLLY_ROTATE ) {
                            dollyEnd.set( 0, distance );
                            dollyDelta.set( 0, Math.pow( dollyEnd.y / dollyStart.y, scope.zoomSpeed ) );
                            if ( scope.zoomToCursor ) {
                                const rect = scope.domElement.getBoundingClientRect();
                                const x = ( ( panStart.x - rect.left ) / rect.width ) * 2 - 1;
                                const y = - ( ( panStart.y - rect.top ) / rect.height ) * 2 + 1;
                                mouse.set( x, y );
                                performCursorZoom = true;
                                dollyDirection.set( x, y, 0 ).unproject( scope.object ).sub( scope.object.position ).normalize();
                            }
                            dollyOut( dollyDelta.y );
                            dollyStart.copy( dollyEnd );
                        }
                        if ( state === STATE.TOUCH_DOLLY_PAN ) {
                            if ( scope.enablePan === false ) return;
                            panEnd.set( ( touch.clientX + position.x ) / 2, ( touch.clientY + position.y ) / 2 );
                            panDelta.subVectors( panEnd, panStart ).multiplyScalar( scope.panSpeed );
                            pan( panDelta.x, panDelta.y );
                            panStart.copy( panEnd );
                        } else if ( state === STATE.TOUCH_DOLLY_ROTATE ) {
                            if ( scope.enableRotate === false ) return;
                            const angleDelta = Math.atan2( dy, dx ) - Math.atan2( dollyStart.y, 1 );
                            rotateLeft( angleDelta * scope.rotateSpeed );
                        }
                        scope.update();
                    }
                }

                function onTouchEnd( event ) {
                    delete pointerPositions[ event.pointerId ];
                    if ( pointers.length < 2 ) {
                        scope.dispatchEvent( _endEvent );
                        state = STATE.NONE;
                    }
                }

                function getSecondPointerPosition( event ) {
                    const pointerId = pointers[ 0 ] === event.pointerId ? pointers[ 1 ] : pointers[ 0 ];
                    return pointerPositions[ pointerId ];
                }

                function onContextMenu( event ) {
                    event.preventDefault();
                }

                scope.domElement.addEventListener( 'contextmenu', onContextMenu );
                scope.domElement.addEventListener( 'pointerdown', onPointerDown );
                scope.domElement.addEventListener( 'pointercancel', onPointerUp );
                scope.domElement.addEventListener( 'wheel', onMouseWheel, { passive: false } );
            }
        }

        THREE.OrbitControls = OrbitControls;
    })();
    </script>

    <script>
        const countries = [
            { id:'china', name:'中国', nameEn:'China', longitude:104, latitude:35, emoji:'🇨🇳', culture:'五千年的文明古国，茶文化、京剧、春节', events:[{year:'公元前221年',event:'秦始皇统一六国'},{year:'1949年',event:'新中国成立'}]},
            { id:'usa', name:'美国', nameEn:'United States', longitude:-95, latitude:38, emoji:'🇺🇸', culture:'多元文化的熔炉，NBA、好莱坞、感恩节', events:[{year:'1776年',event:'独立宣言发表'},{year:'1969年',event:'登月成功'}]},
            { id:'uk', name:'英国', nameEn:'United Kingdom', longitude:-2, latitude:53, emoji:'🇬🇧', culture:'绅士文化、下午茶、大本钟、莎士比亚', events:[{year:'1215年',event:'大宪章签署'},{year:'18世纪',event:'工业革命兴起'}]},
            { id:'egypt', name:'埃及', nameEn:'Egypt', longitude:30, latitude:27, emoji:'🇪🇬', culture:'金字塔、尼罗河、法老传说、肚皮舞', events:[{year:'公元前2686年',event:'古王国建立'},{year:'1869年',event:'苏伊士运河通航'}]},
            { id:'japan', name:'日本', nameEn:'Japan', longitude:138, latitude:36, emoji:'🇯🇵', culture:'樱花、茶道、和服、动漫文化', events:[{year:'1868年',event:'明治维新'},{year:'1950-1970年代',event:'战后经济高速增长'}]}
        ];

        let scene, camera, renderer, controls;
        let earth, markerGroup;
        let raycaster, mouse;
        const markers = [];

        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e27);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 3.5;

            renderer = new THREE.WebGLRenderer({antialias:true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 2;
            controls.maxDistance = 6;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            addLights();
            createStars();
            createEarth();
            createMarkers();

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('click', onMouseClick);

            setTimeout(() => { document.getElementById('loading').style.opacity='0'; setTimeout(()=>{document.getElementById('loading').style.display='none';},500); }, 1000);
            animate();
        }

        function addLights() {
            scene.add(new THREE.AmbientLight(0x404040, 0.5));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(5,3,5);
            scene.add(dirLight);
            const fillLight = new THREE.DirectionalLight(0x4a9eff, 0.3);
            fillLight.position.set(-5,-3,-5);
            scene.add(fillLight);
        }

        function createStars() {
            const starsGeo = new THREE.BufferGeometry();
            const starsCount = 10000;
            const positions = new Float32Array(starsCount * 3);
            for(let i=0;i<starsCount;i++){
                const i3=i*3;
                positions[i3]=(Math.random()-0.5)*200;
                positions[i3+1]=(Math.random()-0.5)*200;
                positions[i3+2]=(Math.random()-0.5)*200;
            }
            starsGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
            const starsMat = new THREE.PointsMaterial({color:0xffffff, size:0.15, sizeAttenuation:true, transparent:true, opacity:0.8});
            scene.add(new THREE.Points(starsGeo, starsMat));
        }

        function createEarth() {
            const geometry = new THREE.SphereGeometry(1, 64, 64);
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            // 海洋背景
            const oceanGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            oceanGradient.addColorStop(0, '#0d2847');
            oceanGradient.addColorStop(0.3, '#1a3a5c');
            oceanGradient.addColorStop(0.7, '#1a3a5c');
            oceanGradient.addColorStop(1, '#0d2847');
            ctx.fillStyle = oceanGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 添加海洋波纹效果
            ctx.fillStyle = 'rgba(255,255,255,0.02)';
            for(let i=0; i<800; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                ctx.beginPath();
                ctx.arc(x, y, Math.random() * 40 + 10, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 绘制经纬线
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 1;
            
            // 经线
            for(let lon = -180; lon <= 180; lon += 30) {
                const x = ((lon + 180) / 360) * canvas.width;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            // 纬线
            for(let lat = -80; lat <= 80; lat += 20) {
                const y = ((90 - lat) / 180) * canvas.height;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // 定义绘制大洲的函数
            function drawContinent(pathData, color) {
                ctx.fillStyle = color;
                ctx.beginPath();
                pathData.forEach((point, i) => {
                    if(i === 0) ctx.moveTo(point[0], point[1]);
                    else if(point.length === 2) ctx.lineTo(point[0], point[1]);
                    else ctx.bezierCurveTo(point[0], point[1], point[2], point[3], point[4], point[5]);
                });
                ctx.closePath();
                ctx.fill();
                
                // 添加阴影效果
                ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            // 北美洲（包括格陵兰岛）
            const northAmerica = [
                [200, 100], [280, 80], [340, 110], [380, 180], [420, 220],
                [450, 280], [430, 320], [380, 350], [320, 380], [270, 420],
                [230, 400], [200, 350], [180, 280], [190, 200], [200, 140], [200, 100]
            ];
            drawContinent(northAmerica, '#4a7c59');
            
            // 格陵兰岛
            const greenland = [
                [420, 60], [520, 50], [560, 100], [540, 160], [480, 180], [440, 160], [420, 120], [420, 60]
            ];
            drawContinent(greenland, '#5a8f6a');
            
            // 中美洲
            const centralAmerica = [
                [320, 380], [350, 400], [380, 420], [400, 480], [380, 520],
                [340, 500], [320, 450], [300, 420], [320, 380]
            ];
            drawContinent(centralAmerica, '#4a7c59');
            
            // 南美洲
            const southAmerica = [
                [340, 520], [400, 510], [440, 580], [450, 680], [430, 780],
                [380, 850], [330, 880], [290, 820], [270, 720], [280, 620],
                [300, 560], [320, 530], [340, 520]
            ];
            drawContinent(southAmerica, '#3d6b4e');
            
            // 欧洲
            const europe = [
                [850, 160], [950, 140], [1020, 160], [1060, 200], [1080, 260],
                [1020, 300], [940, 320], [880, 300], [840, 250], [840, 180], [850, 160]
            ];
            drawContinent(europe, '#6b8e6b');
            
            // 冰岛
            const iceland = [
                [780, 140], [810, 130], [820, 150], [800, 170], [780, 140]
            ];
            drawContinent(iceland, '#7a9e7a');
            
            // 非洲
            const africa = [
                [880, 340], [980, 320], [1060, 360], [1120, 450], [1140, 560],
                [1120, 680], [1050, 760], [950, 780], [880, 740], [830, 660],
                [810, 560], [810, 440], [840, 380], [880, 340]
            ];
            drawContinent(africa, '#5d8a5d');
            
            // 马达加斯加
            const madagascar = [
                [1200, 620], [1240, 610], [1260, 680], [1240, 740], [1200, 720], [1200, 620]
            ];
            drawContinent(madagascar, '#6b9a6b');
            
            // 亚洲
            const asia = [
                [1060, 150], [1200, 100], [1400, 80], [1600, 120], [1700, 200],
                [1720, 300], [1700, 420], [1620, 520], [1500, 560], [1300, 540],
                [1150, 480], [1080, 400], [1060, 300], [1040, 220], [1060, 150]
            ];
            drawContinent(asia, '#4a7c59');
            
            // 印度次大陆
            const india = [
                [1220, 420], [1300, 400], [1360, 440], [1380, 520], [1320, 560],
                [1260, 540], [1220, 480], [1200, 440], [1220, 420]
            ];
            drawContinent(india, '#5a8f6a');
            
            // 东南亚群岛
            const southeastAsia = [
                [1480, 480], [1520, 460], [1560, 480], [1580, 540], [1540, 580],
                [1480, 560], [1460, 520], [1480, 480]
            ];
            drawContinent(southeastAsia, '#5a8f6a');
            
            // 澳大利亚
            const australia = [
                [1400, 680], [1550, 640], [1680, 680], [1720, 760], [1650, 840],
                [1520, 880], [1400, 840], [1350, 760], [1380, 680], [1400, 680]
            ];
            drawContinent(australia, '#6b8e6b');
            
            // 新西兰
            const newZealand = [
                [1750, 840], [1800, 830], [1820, 870], [1780, 890], [1750, 860], [1750, 840]
            ];
            drawContinent(newZealand, '#7a9e7a');
            
            // 添加山脉纹理
            ctx.fillStyle = 'rgba(0,0,0,0.08)';
            const mountainRanges = [
                [[600, 200], [700, 220], [800, 200]],
                [[1100, 250], [1200, 280], [1300, 260]],
                [[1400, 400], [1500, 420], [1600, 400]],
                [[300, 250], [350, 280], [400, 260]],
                [[350, 650], [400, 680], [450, 660]]
            ];
            mountainRanges.forEach(range => {
                ctx.beginPath();
                ctx.moveTo(range[0][0], range[0][1]);
                range.forEach((peak, i) => {
                    if(i > 0) {
                        const prev = range[i-1];
                        const midX = (prev[0] + peak[0]) / 2;
                        const midY = (prev[1] + peak[1]) / 2 - 30;
                        ctx.quadraticCurveTo(prev[0], prev[1], midX, midY);
                        ctx.quadraticCurveTo(peak[0], peak[1], peak[0], peak[1]);
                    }
                });
                ctx.fill();
            });
            
            // 添加沙漠区域
            ctx.fillStyle = 'rgba(255,223,150,0.15)';
            const deserts = [
                [[950, 450], [1050, 430], [1080, 500], [1020, 560], [950, 520]],
                [[1500, 350], [1600, 330], [1620, 400], [1560, 460], [1480, 420]]
            ];
            deserts.forEach(desert => {
                ctx.beginPath();
                desert.forEach((point, i) => {
                    if(i === 0) ctx.moveTo(point[0], point[1]);
                    else ctx.lineTo(point[0], point[1]);
                });
                ctx.closePath();
                ctx.fill();
            });
            
            // 极地冰盖
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            // 北极
            ctx.beginPath();
            ctx.ellipse(1024, 0, 300, 50, 0, 0, Math.PI * 2);
            ctx.fill();
            // 南极
            ctx.beginPath();
            ctx.ellipse(1024, canvas.height, 400, 80, 0, 0, Math.PI * 2);
            ctx.fill();

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.ClampToEdgeWrapping;
            
            const material = new THREE.MeshPhongMaterial({
                map: texture,
                shininess: 20,
                specular: new THREE.Color(0x333333),
                bumpScale: 0.02
            });
            earth = new THREE.Mesh(geometry, material);
            scene.add(earth);

            const atmosGeo = new THREE.SphereGeometry(1.02, 64, 64);
            const atmosMat = new THREE.ShaderMaterial({
                vertexShader: 'varying vec3 vNormal; void main(){vNormal=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
                fragmentShader: 'varying vec3 vNormal; void main(){float intensity=pow(0.7-dot(vNormal,vec3(0.0,0.0,1.0)),2.0);gl_FragColor=vec4(0.6,0.8,1.0,1.0)*intensity*0.5;}',
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                transparent: true
            });
            scene.add(new THREE.Mesh(atmosGeo, atmosMat));
        }

        function createMarkers() {
            markerGroup = new THREE.Group();
            scene.add(markerGroup);

            countries.forEach((country,index) => {
                const phi = (90 - country.latitude) * Math.PI/180;
                const theta = (country.longitude + 180) * Math.PI/180;
                const x = -1 * Math.sin(phi) * Math.cos(theta);
                const y = Math.cos(phi);
                const z = Math.sin(phi) * Math.sin(theta);

                const marker = new THREE.Group();
                marker.userData = {country:country};
                marker.position.set(x,y,z);

                const pulse = new THREE.Mesh(new THREE.RingGeometry(0.03,0.05,32), new THREE.MeshBasicMaterial({color:0xe74c3c, transparent:true, opacity:0.6, side:THREE.DoubleSide}));
                pulse.rotation.x = -Math.PI/2;
                marker.add(pulse);

                const inner = new THREE.Mesh(new THREE.RingGeometry(0.015,0.03,32), new THREE.MeshBasicMaterial({color:0xe74c3c, transparent:true, opacity:0.9, side:THREE.DoubleSide}));
                inner.rotation.x = -Math.PI/2;
                marker.add(inner);

                const center = new THREE.Mesh(new THREE.CircleGeometry(0.01,32), new THREE.MeshBasicMaterial({color:0xffffff}));
                center.rotation.x = -Math.PI/2;
                marker.add(center);

                markerGroup.add(marker);
                markers.push({marker, pulse});
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if(controls.autoRotate) {
                earth.rotation.y += 0.001;
                markerGroup.rotation.y += 0.001;
            }

            const time = Date.now() * 0.003;
            markers.forEach((item,index) => {
                const scale = 1 + Math.sin(time + index) * 0.3;
                item.pulse.scale.set(scale,scale,scale);
                item.pulse.material.opacity = 0.6 - Math.sin(time + index) * 0.2;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseClick(event) {
            mouse.x = (event.clientX/window.innerWidth)*2 - 1;
            mouse.y = -(event.clientY/window.innerHeight)*2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(markerGroup.children, true);
            if(intersects.length>0) {
                let parent = intersects[0].object.parent;
                while(parent && !parent.userData.country) parent = parent.parent;
                if(parent && parent.userData.country) {
                    showInfoPanel(parent.userData.country);
                    controls.autoRotate = false;
                }
            } else {
                closeInfoPanel();
                controls.autoRotate = true;
            }
        }

        function showInfoPanel(country) {
            const panel = document.getElementById('infoPanel');
            document.getElementById('panelEmoji').textContent = country.emoji;
            document.getElementById('panelName').textContent = country.name;
            document.getElementById('panelNameEn').textContent = country.nameEn;
            document.getElementById('panelCulture').textContent = country.culture;

            const eventsList = document.getElementById('panelEvents');
            eventsList.innerHTML = '';
            country.events.forEach(event => {
                const li = document.createElement('li');
                li.className = 'event-item';
                li.innerHTML = `<span class="event-year">${event.year}</span><span class="event-desc">${event.event}</span>`;
                eventsList.appendChild(li);
            });
            panel.classList.add('active');
        }

        function closeInfoPanel() {
            document.getElementById('infoPanel').classList.remove('active');
            controls.autoRotate = true;
        }

        window.addEventListener('load', init);
    </script>
