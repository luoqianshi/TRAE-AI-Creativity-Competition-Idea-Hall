<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>自律学习锁屏</title>
<style>
/* ============================================================
   CSS 变量 & 全局重置
   ============================================================ */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-primary: #0a0a12;
  --bg-card: #141420;
  --bg-card-hover: #1a1a2a;
  --bg-input: #1e1e30;
  --border: #2a2a3e;
  --text-primary: #e0e0e0;
  --text-secondary: #8888a0;
  --text-muted: #5a5a70;
  --accent: #d4a574;
  --accent-glow: rgba(212, 165, 116, 0.3);
  --danger: #e63946;
  --danger-bg: rgba(230, 57, 70, 0.15);
  --success: #4ade80;
  --blade-light: #e8e8f0;
  --blade-dark: #808090;
  --blade-edge: #ffffff;
  --overlay-bg: rgba(5, 5, 15, 0.92);
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 0.25s ease;
}

html, body {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  user-select: none;
}

/* ============================================================
   主容器 - 手机竖屏适配
   ============================================================ */
.app-container {
  max-width: 480px;
  margin: 0 auto;
  padding: 16px 16px 120px;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  z-index: 1;
}

/* ============================================================
   顶部区域：当前时间 + 今日课程概览
   ============================================================ */
.header-section {
  text-align: center;
  padding: 24px 0 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}

.current-time-display {
  font-size: 48px;
  font-weight: 200;
  letter-spacing: 2px;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
  font-family: "SF Mono", "JetBrains Mono", "Menlo", monospace;
}

.current-date-display {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 4px;
  letter-spacing: 1px;
}

.lock-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  transition: var(--transition);
}

.lock-status.locked {
  background: var(--danger-bg);
  color: var(--danger);
}

.lock-status.unlocked {
  background: rgba(74, 222, 128, 0.12);
  color: var(--success);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: inline-block;
}

.locked .status-dot { background: var(--danger); }
.unlocked .status-dot { background: var(--success); }

/* ============================================================
   今日课程概览卡片
   ============================================================ */
.today-overview {
  margin-top: 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  text-align: left;
}

.today-overview-title {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 8px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.today-course-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.today-course-item:last-child { border-bottom: none; }

.today-course-time {
  color: var(--accent);
  font-family: "SF Mono", "JetBrains Mono", monospace;
  font-size: 13px;
  min-width: 100px;
}

.today-course-name {
  color: var(--text-primary);
  flex: 1;
  margin-left: 10px;
}

.today-course-status {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 500;
}

.today-course-status.ongoing {
  background: var(--danger-bg);
  color: var(--danger);
}

.today-course-status.upcoming {
  background: rgba(212, 165, 116, 0.15);
  color: var(--accent);
}

.today-course-status.past {
  background: rgba(255,255,255,0.05);
  color: var(--text-muted);
}

.no-courses-hint {
  color: var(--text-muted);
  font-size: 13px;
  text-align: center;
  padding: 8px 0;
}

/* ============================================================
   课程添加表单
   ============================================================ */
.section-title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title::before {
  content: '';
  width: 3px;
  height: 16px;
  background: var(--accent);
  border-radius: 2px;
}

.course-form {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 20px;
}

.form-row {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.form-row:last-child { margin-bottom: 0; }

.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  min-width: 80px;
}

.form-group label {
  font-size: 12px;
  color: var(--text-secondary);
  letter-spacing: 0.5px;
}

.form-group input {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  color: var(--text-primary);
  font-size: 14px;
  outline: none;
  transition: var(--transition);
  font-family: inherit;
}

.form-group input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow);
}

.form-group input[type="time"] {
  color-scheme: dark;
  font-family: "SF Mono", "JetBrains Mono", monospace;
}

.form-group input[type="time"]::-webkit-calendar-picker-indicator {
  filter: invert(0.8);
}

.btn {
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.btn-primary {
  background: var(--accent);
  color: #1a1a12;
}

.btn-primary:active {
  background: #c49560;
  transform: scale(0.97);
}

.btn-danger {
  background: transparent;
  color: var(--danger);
  border: 1px solid var(--danger);
  font-size: 12px;
  padding: 5px 12px;
}

.btn-danger:active {
  background: var(--danger-bg);
}

.btn-outline {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  font-size: 12px;
  padding: 5px 12px;
}

.btn-outline:active {
  background: var(--bg-card-hover);
}

.btn-lock-preview {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  background: var(--accent);
  color: #1a1a12;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 600;
  letter-spacing: 1px;
  transition: var(--transition);
  margin-top: 8px;
}

.btn-lock-preview:active {
  transform: scale(0.97);
  background: #c49560;
}

/* ============================================================
   课程列表
   ============================================================ */
.course-list-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 20px;
}

.course-list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  gap: 8px;
}

.course-list-item:last-child { border-bottom: none; }

.course-list-time {
  font-family: "SF Mono", "JetBrains Mono", monospace;
  font-size: 13px;
  color: var(--accent);
  min-width: 100px;
  flex-shrink: 0;
}

.course-list-name {
  flex: 1;
  font-size: 14px;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.empty-list {
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
  padding: 16px 0;
}

/* ============================================================
   设置面板
   ============================================================ */
.settings-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 20px;
}

.settings-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.settings-row .form-group {
  flex: 2;
  min-width: 120px;
}

.settings-row .btn {
  align-self: flex-end;
  margin-bottom: 1px;
}

.password-hint {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ============================================================
   锁屏预览区
   ============================================================ */
.lock-preview-section {
  text-align: center;
  margin-bottom: 20px;
}

.lock-preview-hint {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 6px;
}

/* ============================================================
   全屏锁屏遮罩
   ============================================================ */
.lock-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: background 0.8s ease, opacity 0.5s ease;
}

/* 锁屏激活状态 */
.lock-overlay.active {
  pointer-events: all;
  opacity: 1;
}

.lock-overlay.bg-visible {
  background: var(--overlay-bg);
}

/* ============================================================
   武士刀 CSS 图形
   ============================================================ */
.sword-wrapper {
  position: relative;
  width: 40px;
  height: 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
  /* 初始位置在屏幕下方 */
  transform: translateY(100vh);
  opacity: 0;
  filter: drop-shadow(0 0 20px rgba(200, 180, 220, 0.4));
}

/* 刀身（刃） */
.blade {
  position: relative;
  width: 10px;
  height: 220px;
  background: linear-gradient(
    90deg,
    var(--blade-dark) 0%,
    #a0a0b8 15%,
    #d0d0e0 30%,
    #f0f0f8 45%,
    var(--blade-edge) 50%,
    #f0f0f8 55%,
    #c8c8d8 70%,
    #9090a8 85%,
    var(--blade-dark) 100%
  );
  clip-path: polygon(
    50% 0%,
    85% 4%,
    100% 8%,
    100% 100%,
    0% 100%,
    0% 8%,
    15% 4%
  );
  border-radius: 0 0 1px 1px;
}

/* 刃纹（Hamon）- 波浪纹理 */
.blade::after {
  content: '';
  position: absolute;
  left: 2px;
  right: 2px;
  top: 15%;
  bottom: 5%;
  background: linear-gradient(
    180deg,
    transparent 0%,
    rgba(255,255,255,0.15) 20%,
    transparent 40%,
    rgba(255,255,255,0.1) 60%,
    transparent 80%,
    rgba(255,255,255,0.08) 100%
  );
  border-radius: 50%;
  opacity: 0.6;
}

/* 刀镡（Tsuba / 护手） */
.tsuba {
  width: 36px;
  height: 8px;
  background: linear-gradient(180deg, #3a3a3a, #1a1a1a, #3a3a3a);
  border-radius: 50%;
  margin-top: -1px;
  position: relative;
  z-index: 2;
  box-shadow: 0 0 6px rgba(0,0,0,0.5);
}

/* 刀柄（Tsuka） */
.tsuka {
  width: 16px;
  height: 80px;
  background: 
    repeating-linear-gradient(
      45deg,
      #1a1a1a 0px,
      #1a1a1a 6px,
      #2a2a2a 6px,
      #2a2a2a 8px
    ),
    repeating-linear-gradient(
      -45deg,
      #1a1a1a 0px,
      #1a1a1a 6px,
      #2a2a2a 6px,
      #2a2a2a 8px
    );
  background-color: #1a1a1a;
  border-radius: 4px;
  position: relative;
  margin-top: 0px;
  box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
}

/* 柄头（Kashira） */
.tsuka::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: -2px;
  right: -2px;
  height: 6px;
  background: linear-gradient(180deg, #2a2a2a, #111);
  border-radius: 0 0 3px 3px;
}

/* 刀鞘（Saya）提示线 */
.scabbard-line {
  position: absolute;
  bottom: -40px;
  left: 50%;
  transform: translateX(-50%);
  width: 2px;
  height: 40px;
  background: linear-gradient(180deg, rgba(212,165,116,0.6), transparent);
  opacity: 0;
  transition: opacity 0.5s;
}

.sword-wrapper.drawn .scabbard-line {
  opacity: 1;
}

/* ============================================================
   拔刀 / 收刀 CSS 关键帧动画
   正向 = 拔刀展开（上锁）；反向播放 = 收刀闭合（解锁）
   ============================================================ */
@keyframes swordDraw {
  0% {
    transform: translateY(100vh) scale(0.8);
    opacity: 0;
    filter: drop-shadow(0 0 0px rgba(200, 180, 220, 0));
  }
  15% {
    opacity: 0.6;
    filter: drop-shadow(0 0 10px rgba(200, 180, 220, 0.2));
  }
  40% {
    transform: translateY(20vh) scale(0.9);
    opacity: 0.9;
    filter: drop-shadow(0 0 30px rgba(200, 180, 220, 0.5));
  }
  70% {
    transform: translateY(5vh) scale(0.95);
    opacity: 1;
    filter: drop-shadow(0 0 40px rgba(200, 180, 220, 0.6));
  }
  100% {
    transform: translateY(0) scale(1);
    opacity: 1;
    filter: drop-shadow(0 0 50px rgba(200, 180, 220, 0.7));
  }
}

/* 正向播放：拔刀上锁 */
.sword-wrapper.animate-forward {
  animation: swordDraw 3s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
}

/* 反向播放：收刀解锁 */
.sword-wrapper.animate-reverse {
  animation: swordDraw 3s cubic-bezier(0.22, 0.61, 0.36, 1) reverse forwards;
}

/* 已拔刀静态状态 */
.sword-wrapper.static-drawn {
  transform: translateY(0) scale(1);
  opacity: 1;
  filter: drop-shadow(0 0 50px rgba(200, 180, 220, 0.7));
}

/* 已收刀静态状态 */
.sword-wrapper.static-sheathed {
  transform: translateY(100vh) scale(0.8);
  opacity: 0;
  filter: drop-shadow(0 0 0px rgba(200, 180, 220, 0));
}

/* ============================================================
   锁屏遮罩渐显/渐隐关键帧
   ============================================================ */
@keyframes overlayFadeIn {
  0% { background: transparent; }
  100% { background: var(--overlay-bg); }
}

.lock-overlay.animate-bg-in {
  animation: overlayFadeIn 3s ease forwards;
}

/* ============================================================
   密码弹窗
   ============================================================ */
.password-modal {
  position: absolute;
  bottom: 15vh;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  opacity: 0;
  transition: opacity 0.5s ease 1.5s;
  width: 80%;
  max-width: 300px;
}

/* 弹窗在锁屏激活后延迟显示 */
.lock-overlay.active .password-modal {
  opacity: 1;
}

.password-modal-label {
  font-size: 13px;
  color: var(--text-secondary);
  letter-spacing: 1px;
}

.password-input-row {
  display: flex;
  gap: 8px;
  width: 100%;
}

.password-input-row input {
  flex: 1;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  color: var(--text-primary);
  font-size: 15px;
  outline: none;
  text-align: center;
  letter-spacing: 4px;
  font-family: "SF Mono", "JetBrains Mono", monospace;
  transition: var(--transition);
}

.password-input-row input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow);
}

.password-input-row .btn {
  padding: 12px 20px;
  font-size: 14px;
  flex-shrink: 0;
}

.password-error {
  font-size: 12px;
  color: var(--danger);
  min-height: 18px;
  transition: opacity 0.3s;
}

/* 动画提示文字 */
.lock-hint {
  position: absolute;
  top: 20vh;
  left: 50%;
  transform: translateX(-50%);
  font-size: 18px;
  font-weight: 300;
  letter-spacing: 4px;
  color: var(--text-primary);
  opacity: 0;
  transition: opacity 0.5s ease 1s;
  white-space: nowrap;
}

.lock-overlay.active .lock-hint {
  opacity: 0.8;
}

/* ============================================================
   消息提示 Toast
   ============================================================ */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 20px;
  font-size: 13px;
  color: var(--text-primary);
  z-index: 10000;
  transition: transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
  pointer-events: none;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
}

.toast.error {
  border-color: var(--danger);
  color: var(--danger);
}

.toast.success {
  border-color: var(--success);
  color: var(--success);
}

/* ============================================================
   响应式微调
   ============================================================ */
@media (max-width: 360px) {
  .current-time-display { font-size: 38px; }
  .form-row { flex-direction: column; gap: 8px; }
  .course-list-time { min-width: 85px; font-size: 12px; }
}
</style>
</head>
<body>

<!-- ============================================================
     主应用容器
     ============================================================ -->
<div class="app-container" id="appContainer">

  <!-- ========== 顶部：当前时间 + 今日课程概览 ========== -->
  <header class="header-section">
    <div class="current-time-display" id="currentTime">--:--</div>
    <div class="current-date-display" id="currentDate">----年--月--日</div>
    <div class="lock-status unlocked" id="lockStatus">
      <span class="status-dot"></span>
      <span id="lockStatusText">未锁定</span>
    </div>
    <div class="today-overview" id="todayOverview">
      <div class="today-overview-title">今日课程</div>
      <div class="no-courses-hint" id="todayCoursesHint">暂无课程安排</div>
      <div id="todayCoursesList"></div>
    </div>
  </header>

  <!-- ========== 中部：课程添加表单 ========== -->
  <section class="course-form">
    <div class="section-title">添加课程</div>
    <div class="form-row">
      <div class="form-group">
        <label>开始时间</label>
        <input type="time" id="inputStartTime" value="08:00">
      </div>
      <div class="form-group">
        <label>结束时间</label>
        <input type="time" id="inputEndTime" value="09:30">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:3">
        <label>课程名称</label>
        <input type="text" id="inputCourseName" placeholder="例：高等数学" maxlength="30">
      </div>
      <div class="form-group" style="flex:1;justify-content:flex-end">
        <button class="btn btn-primary" id="btnAddCourse" style="width:100%">添加</button>
      </div>
    </div>
  </section>

  <!-- ========== 中部：课程列表 ========== -->
  <section class="course-list-section">
    <div class="section-title">全部课程</div>
    <div class="empty-list" id="courseListEmpty">还没有添加课程</div>
    <div id="courseListContainer"></div>
  </section>

  <!-- ========== 设置面板：修改备用密码 ========== -->
  <section class="settings-section">
    <div class="section-title">安全设置</div>
    <div class="settings-row">
      <div class="form-group">
        <label>修改应急备用密码</label>
        <input type="text" id="inputNewPassword" placeholder="输入新密码" maxlength="20">
      </div>
      <button class="btn btn-primary" id="btnSavePassword">保存</button>
    </div>
    <div class="password-hint">默认密码：study2024 | 修改后自动本地存储</div>
  </section>

  <!-- ========== 底部：锁屏预览按钮 ========== -->
  <section class="lock-preview-section">
    <button class="btn-lock-preview" id="btnLockPreview">🔒 手动锁屏</button>
    <div class="lock-preview-hint">点击后触发拔刀动画，进入全屏锁定状态</div>
  </section>
</div>

<!-- ============================================================
     全屏锁屏遮罩层
     ============================================================ -->
<div class="lock-overlay" id="lockOverlay">
  <!-- 锁定提示文字 -->
  <div class="lock-hint" id="lockHint">📖 专注学习</div>

  <!-- 武士刀容器 -->
  <div class="sword-wrapper static-sheathed" id="swordWrapper">
    <div class="blade"></div>
    <div class="tsuba"></div>
    <div class="tsuka"></div>
    <div class="scabbard-line"></div>
  </div>

  <!-- 密码弹窗 -->
  <div class="password-modal" id="passwordModal">
    <div class="password-modal-label">输入备用密码解锁</div>
    <div class="password-input-row">
      <input type="password" id="inputPassword" placeholder="密码" maxlength="20">
      <button class="btn btn-primary" id="btnUnlock">确认</button>
    </div>
    <div class="password-error" id="passwordError"></div>
  </div>
</div>

<!-- Toast 消息 -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   JavaScript 全局逻辑
   职责：时间判断、localStorage、动画控制、密码校验
   ============================================================ */

// ---------- DOM 元素引用 ----------
const $time        = document.getElementById('currentTime');
const $date        = document.getElementById('currentDate');
const $lockStatus  = document.getElementById('lockStatus');
const $lockStatusT = document.getElementById('lockStatusText');
const $todayHint   = document.getElementById('todayCoursesHint');
const $todayList   = document.getElementById('todayCoursesList');
const $courseEmpty = document.getElementById('courseListEmpty');
const $courseList  = document.getElementById('courseListContainer');
const $lockOverlay = document.getElementById('lockOverlay');
const $swordWrapper = document.getElementById('swordWrapper');
const $passwordModal = document.getElementById('passwordModal');
const $inputPassword = document.getElementById('inputPassword');
const $passwordError = document.getElementById('passwordError');
const $toast        = document.getElementById('toast');
const $appContainer = document.getElementById('appContainer');

// ---------- 状态变量 ----------
let courses      = [];        // 课程数组 [{startTime, endTime, name, id}]
let isLocked     = false;     // 当前是否锁定
let animating    = false;     // 动画是否正在播放
let toastTimer   = null;      // Toast 定时器
const ANIM_DURATION = 3000;   // 动画总时长 3 秒
const DEFAULT_PASSWORD = 'study2024'; // 默认备用密码

// ---------- localStorage 键名 ----------
const STORAGE_KEY_COURSES   = 'study_lock_courses';
const STORAGE_KEY_PASSWORD  = 'study_lock_password';

// ============================================================
//  Toast 消息提示
// ============================================================
function showToast(msg, type = '') {
  if (toastTimer) clearTimeout(toastTimer);
  $toast.textContent = msg;
  $toast.className = 'toast ' + type + ' show';
  toastTimer = setTimeout(() => {
    $toast.className = 'toast';
  }, 2000);
}

// ============================================================
//  localStorage 读写
// ============================================================
function loadCourses() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_COURSES);
    courses = raw ? JSON.parse(raw) : [];
  } catch (e) {
    courses = [];
  }
}

function saveCourses() {
  localStorage.setItem(STORAGE_KEY_COURSES, JSON.stringify(courses));
}

function loadPassword() {
  try {
    return localStorage.getItem(STORAGE_KEY_PASSWORD) || DEFAULT_PASSWORD;
  } catch (e) {
    return DEFAULT_PASSWORD;
  }
}

function savePassword(pwd) {
  localStorage.setItem(STORAGE_KEY_PASSWORD, pwd);
}

// ============================================================
//  生成唯一 ID
// ============================================================
function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

// ============================================================
//  时间格式化
// ============================================================
function formatTime(date) {
  const h = String(date.getHours()).padStart(2, '0');
  const m = String(date.getMinutes()).padStart(2, '0');
  return h + ':' + m;
}

function getWeekDay(date) {
  const days = ['日', '一', '二', '三', '四', '五', '六'];
  return '周' + days[date.getDay()];
}

// ============================================================
//  时钟更新（每秒）
// ============================================================
function updateClock() {
  const now = new Date();
  $time.textContent = formatTime(now);
  $date.textContent = now.getFullYear() + '年' +
    String(now.getMonth() + 1).padStart(2, '0') + '月' +
    String(now.getDate()).padStart(2, '0') + '日 ' +
    getWeekDay(now);
}

// ============================================================
//  判断当前时间是否在课程区间内
//  支持跨天课程（结束时间 < 开始时间）
// ============================================================
function getCurrentMinutes(now) {
  return now.getHours() * 60 + now.getMinutes();
}

function isInCoursePeriod(now) {
  const currentMin = getCurrentMinutes(now);

  return courses.some(course => {
    const [sh, sm] = course.startTime.split(':').map(Number);
    const [eh, em] = course.endTime.split(':').map(Number);
    const startMin = sh * 60 + sm;
    const endMin   = eh * 60 + em;

    if (endMin > startMin) {
      // 正常时段：同一天内
      return currentMin >= startMin && currentMin < endMin;
    } else if (endMin < startMin) {
      // 跨天时段：如 23:00 - 01:00
      return currentMin >= startMin || currentMin < endMin;
    } else {
      // 开始 == 结束，无效课程
      return false;
    }
  });
}

// ============================================================
//  获取当前正在进行的课程
// ============================================================
function getCurrentCourse(now) {
  const currentMin = getCurrentMinutes(now);
  return courses.find(course => {
    const [sh, sm] = course.startTime.split(':').map(Number);
    const [eh, em] = course.endTime.split(':').map(Number);
    const startMin = sh * 60 + sm;
    const endMin   = eh * 60 + em;
    if (endMin > startMin) {
      return currentMin >= startMin && currentMin < endMin;
    } else if (endMin < startMin) {
      return currentMin >= startMin || currentMin < endMin;
    }
    return false;
  }) || null;
}

// ============================================================
//  拔刀动画（上锁）
//  正向播放 CSS 关键帧，3 秒后完成
// ============================================================
function playDrawAnimation() {
  return new Promise(resolve => {
    if (animating) { resolve(); return; }
    animating = true;

    // 显示遮罩层
    $lockOverlay.classList.add('active');
    // 触发背景渐显
    $lockOverlay.classList.add('animate-bg-in');

    // 清除旧动画类，强制重排以重新触发动画
    $swordWrapper.classList.remove('animate-forward', 'animate-reverse', 'static-drawn', 'static-sheathed');
    void $swordWrapper.offsetWidth; // 强制回流

    // 播放正向拔刀动画
    $swordWrapper.classList.add('animate-forward');

    // 动画结束后保持最终状态
    setTimeout(() => {
      $swordWrapper.classList.remove('animate-forward');
      $swordWrapper.classList.add('static-drawn');
      $lockOverlay.classList.add('bg-visible');
      $lockOverlay.classList.remove('animate-bg-in');
      animating = false;
      resolve();
    }, ANIM_DURATION);
  });
}

// ============================================================
//  收刀动画（解锁）
//  反向播放 CSS 关键帧，3 秒后完成
// ============================================================
function playSheathAnimation() {
  return new Promise(resolve => {
    if (animating) { resolve(); return; }
    animating = true;

    // 清除旧动画类
    $swordWrapper.classList.remove('animate-forward', 'animate-reverse', 'static-drawn', 'static-sheathed');
    void $swordWrapper.offsetWidth;

    // 播放反向收刀动画
    $swordWrapper.classList.add('animate-reverse');

    // 背景渐隐 - 使用 transition
    $lockOverlay.classList.remove('bg-visible');

    // 动画结束后隐藏遮罩
    setTimeout(() => {
      $swordWrapper.classList.remove('animate-reverse');
      $swordWrapper.classList.add('static-sheathed');
      $lockOverlay.classList.remove('active');
      $lockOverlay.classList.remove('animate-bg-in');
      $passwordError.textContent = '';
      $inputPassword.value = '';
      animating = false;
      resolve();
    }, ANIM_DURATION);
  });
}

// ============================================================
//  锁定操作
// ============================================================
async function lock(reason = 'manual') {
  if (isLocked || animating) return;
  isLocked = true;
  updateLockStatusUI();

  await playDrawAnimation();

  // 锁定后聚焦密码输入框
  setTimeout(() => {
    if (isLocked && $inputPassword) {
      $inputPassword.focus();
    }
  }, 500);
}

// ============================================================
//  解锁操作
// ============================================================
async function unlock() {
  if (!isLocked || animating) return;
  isLocked = false;
  updateLockStatusUI();
  await playSheathAnimation();
}

// ============================================================
//  更新锁状态 UI
// ============================================================
function updateLockStatusUI() {
  if (isLocked) {
    $lockStatus.className = 'lock-status locked';
    $lockStatusT.textContent = '已锁定';
  } else {
    $lockStatus.className = 'lock-status unlocked';
    $lockStatusT.textContent = '未锁定';
  }
}

// ============================================================
//  密码验证解锁
// ============================================================
function handlePasswordUnlock() {
  const input = $inputPassword.value.trim();
  const storedPassword = loadPassword();

  if (!input) {
    $passwordError.textContent = '请输入密码';
    return;
  }

  if (input === storedPassword) {
    $passwordError.textContent = '';
    unlock();
  } else {
    $passwordError.textContent = '密码错误，请重试';
    $inputPassword.value = '';
    $inputPassword.focus();
    // 错误抖动效果
    $passwordError.style.animation = 'none';
    void $passwordError.offsetWidth;
    $passwordError.style.animation = 'shake 0.4s ease';
  }
}

// 密码错误抖动关键帧
const shakeStyle = document.createElement('style');
shakeStyle.textContent = `
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-4px); }
  }
`;
document.head.appendChild(shakeStyle);

// ============================================================
//  自动锁屏定时检查（每秒）
// ============================================================
function autoCheckLock() {
  // 动画播放中不检查，避免打断动画
  if (animating) return;

  const now = new Date();
  const inClass = isInCoursePeriod(now);

  if (inClass && !isLocked) {
    // 进入上课时间，自动上锁
    lock('auto');
  } else if (!inClass && isLocked) {
    // 进入课间，自动解锁
    unlock();
  }
}

// ============================================================
//  渲染课程列表
// ============================================================
function renderCourseList() {
  if (courses.length === 0) {
    $courseEmpty.style.display = 'block';
    $courseList.innerHTML = '';
    return;
  }

  $courseEmpty.style.display = 'none';
  // 按开始时间排序
  const sorted = [...courses].sort((a, b) => a.startTime.localeCompare(b.startTime));

  $courseList.innerHTML = sorted.map(course => `
    <div class="course-list-item">
      <span class="course-list-time">${course.startTime} - ${course.endTime}</span>
      <span class="course-list-name">${escapeHtml(course.name)}</span>
      <button class="btn btn-danger" data-id="${course.id}" onclick="deleteCourse('${course.id}')">删除</button>
    </div>
  `).join('');
}

// ============================================================
//  渲染今日课程概览
// ============================================================
function renderTodayOverview() {
  const now = new Date();
  const currentMin = getCurrentMinutes(now);

  // 筛选今天有课的课程（按开始时间排序）
  const sorted = [...courses].sort((a, b) => a.startTime.localeCompare(b.startTime));

  if (sorted.length === 0) {
    $todayHint.style.display = 'block';
    $todayList.innerHTML = '';
    return;
  }

  $todayHint.style.display = 'none';

  $todayList.innerHTML = sorted.map(course => {
    const [sh, sm] = course.startTime.split(':').map(Number);
    const [eh, em] = course.endTime.split(':').map(Number);
    const startMin = sh * 60 + sm;
    const endMin   = eh * 60 + em;

    let statusClass = '';
    let statusText  = '';

    if (endMin > startMin) {
      if (currentMin >= startMin && currentMin < endMin) {
        statusClass = 'ongoing';
        statusText  = '进行中';
      } else if (currentMin < startMin) {
        statusClass = 'upcoming';
        statusText  = '待上课';
      } else {
        statusClass = 'past';
        statusText  = '已结束';
      }
    } else if (endMin < startMin) {
      // 跨天课程
      if (currentMin >= startMin || currentMin < endMin) {
        statusClass = 'ongoing';
        statusText  = '进行中';
      } else {
        statusClass = 'upcoming';
        statusText  = '待上课';
      }
    }

    return `
      <div class="today-course-item">
        <span class="today-course-time">${course.startTime} - ${course.endTime}</span>
        <span class="today-course-name">${escapeHtml(course.name)}</span>
        <span class="today-course-status ${statusClass}">${statusText}</span>
      </div>
    `;
  }).join('');
}

// ============================================================
//  HTML 转义（防 XSS）
// ============================================================
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
//  添加课程
// ============================================================
function addCourse() {
  const startTime = document.getElementById('inputStartTime').value.trim();
  const endTime   = document.getElementById('inputEndTime').value.trim();
  const name      = document.getElementById('inputCourseName').value.trim();

  // 表单验证
  if (!startTime || !endTime) {
    showToast('请选择开始和结束时间', 'error');
    return;
  }
  if (!name) {
    showToast('请输入课程名称', 'error');
    return;
  }
  if (startTime === endTime) {
    showToast('开始时间和结束时间不能相同', 'error');
    return;
  }

  // 新增课程
  courses.push({
    id: generateId(),
    startTime,
    endTime,
    name
  });

  saveCourses();
  renderAll();
  showToast('课程「' + name + '」已添加', 'success');

  // 清空课程名称输入
  document.getElementById('inputCourseName').value = '';
}

// ============================================================
//  删除课程
// ============================================================
function deleteCourse(id) {
  const idx = courses.findIndex(c => c.id === id);
  if (idx === -1) return;

  const name = courses[idx].name;
  courses.splice(idx, 1);
  saveCourses();
  renderAll();
  showToast('课程「' + name + '」已删除', 'success');
}

// ============================================================
//  修改密码
// ============================================================
function changePassword() {
  const newPwd = document.getElementById('inputNewPassword').value.trim();
  if (!newPwd) {
    showToast('请输入新密码', 'error');
    return;
  }
  if (newPwd.length < 4) {
    showToast('密码至少需要 4 位', 'error');
    return;
  }

  savePassword(newPwd);
  document.getElementById('inputNewPassword').value = '';
  showToast('密码已更新', 'success');
}

// ============================================================
//  渲染全部 UI
// ============================================================
function renderAll() {
  renderCourseList();
  renderTodayOverview();
}

// ============================================================
//  事件绑定
// ============================================================

// 添加课程按钮
document.getElementById('btnAddCourse').addEventListener('click', addCourse);

// 回车键添加课程
document.getElementById('inputCourseName').addEventListener('keydown', e => {
  if (e.key === 'Enter') addCourse();
});

// 手动锁屏按钮
document.getElementById('btnLockPreview').addEventListener('click', () => {
  lock('manual');
});

// 密码解锁按钮
document.getElementById('btnUnlock').addEventListener('click', handlePasswordUnlock);

// 密码输入框回车解锁
$inputPassword.addEventListener('keydown', e => {
  if (e.key === 'Enter') handlePasswordUnlock();
});

// 保存密码按钮
document.getElementById('btnSavePassword').addEventListener('click', changePassword);

// 密码输入框回车保存
document.getElementById('inputNewPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') changePassword();
});

// 阻止锁屏遮罩上的点击事件穿透
$lockOverlay.addEventListener('click', function(e) {
  // 允许在密码输入区域内交互
  if (isLocked && !e.target.closest('.password-modal')) {
    e.stopPropagation();
  }
});

// 阻止锁屏时滚动穿透
$lockOverlay.addEventListener('touchmove', function(e) {
  if (isLocked) {
    e.preventDefault();
  }
}, { passive: false });

// ============================================================
//  初始化
// ============================================================
function init() {
  loadCourses();
  updateClock();
  renderAll();

  // 初始化状态：检查当前是否在课程时间内
  const now = new Date();
  if (isInCoursePeriod(now)) {
    // 页面加载时若正在上课时间，延迟 500ms 触发锁屏（等页面渲染完）
    setTimeout(() => lock('auto'), 500);
  } else {
    isLocked = false;
    updateLockStatusUI();
  }
}

// ============================================================
//  定时器
// ============================================================

// 时钟每秒更新
setInterval(() => {
  updateClock();
  renderTodayOverview(); // 同时更新课程状态
}, 1000);

// 自动锁屏检查每秒执行
setInterval(autoCheckLock, 1000);

// ============================================================
//  启动应用
// ============================================================
init();

// 将 deleteCourse 暴露到全局作用域（供 onclick 调用）
window.deleteCourse = deleteCourse;
</script>
</body>
</html>
