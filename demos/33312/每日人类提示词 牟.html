  body {

    padding: 40px 20px;
    position: relative;
  }
  
  .header {
    text-align: center; margin-bottom: 30px;
    position: relative;
    z-index: 10;
  }
  
  .title {
    font-size: 42px; font-weight: bold; margin-bottom: 10px;
    text-shadow: 3px 3px 6px rgba(0,0,0,0.1);
    color: #2C3E50;
    letter-spacing: 2px;
  }
  
  .subtitle {
    font-size: 18px; color: #34495E; margin-bottom: 25px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
  }
  
  /* 牛背景容器 */
  .cow-container {
    position: fixed;
    width: 500px;
    height: 500px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer; 
    z-index: 1;
    opacity: 0.15;
    transition: all 0.3s;
    pointer-events: auto;
  }
  
  .cow-container:hover {
    transform: translate(-50%, -50%) scale(1.08) rotate(-2deg);
    opacity: 0.25;
  }
  
  .cow {
    width: 100%; 
    height: 100%;
    position: relative; 
    border-radius: 50%;
    animation: float 8s ease-in-out infinite;
    object-fit: cover;
  }
  
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
  
  .guardian-text {
    font-size: 16px; color: #5D6D7E; margin-top: 15px;
    text-align: center; line-height: 1.6;
    background: rgba(255,255,255,0.7);
    padding: 10px 20px;
    border-radius: 20px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    position: relative;
    z-index: 10;
  }
  
  .calendar-section {
    background: rgba(255,255,255,0.9); border-radius: 25px;
    padding: 25px; width: 100%; max-width: 420px; margin-top: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    border: 3px solid #E8F4FD;
    position: relative;
    z-index: 10;
  }
  
  .calendar-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }
  
  .calendar-title {
    font-size: 22px; font-weight: bold; color: #2C3E50;
  }
  
  .calendar-nav {
    font-size: 24px; cursor: pointer; color: #3498DB;
    user-select: none; transition: transform 0.2s;
  }
  
  .calendar-nav:hover {
    transform: scale(1.2);
  }
  
  .calendar-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 8px; text-align: center;
  }
  
  .calendar-week {
    font-size: 14px;
    color: #7f8c8d;
    font-weight: bold;
    padding: 5px 0;
  }
  
  .calendar-day {
    font-size: 15px; padding: 8px 4px; border-radius: 12px;
    cursor: pointer; transition: all 0.2s;
    background: #F8F9FA; border: 2px solid #E8F4FD;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  
  .calendar-day:hover {
    background: #3498DB; color: white; transform: scale(1.05);
    border-color: #3498DB;
  }
  
  .calendar-day.other { color: #bdc3c7; background: transparent; border-color: transparent; }
  .calendar-day.today { background: #E74C3C; color: white; font-weight: bold; border-color: #C0392B; }
  .calendar-day.selected { background: #3498DB; color: white; font-weight: bold; border-color: #2980B9; }
  .calendar-day.holiday { background: rgba(231, 76, 60, 0.1); border-color: #f39c12; color: #e67e22; }
  .calendar-day.holiday:hover { background: #e67e22; color: white; }
  
  .holiday-tag {
    font-size: 10px;
    line-height: 1;
    font-weight: normal;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  
  .prompt-section {
    background: rgba(255,255,255,0.9); border-radius: 25px;
    padding: 25px; width: 100%; max-width: 420px; margin-top: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    border: 3px solid #E8F4FD;
    display: none;
    position: relative;
    z-index: 10;
  }
  
  .holiday-banner {
    text-align: center;
    background: linear-gradient(90deg, #f39c12, #e74c3c);
    color: white;
    padding: 8px 15px;
    border-radius: 15px;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 15px;
  }

  .beast-speech {
    text-align: center;
    background: rgba(255, 255, 255, 0.8);
    padding: 8px 15px;
    border-radius: 15px;
    margin-bottom: 15px;
    font-size: 14px;
    color: #5d6d7e;
    font-style: italic;
    border: 1px dashed #b0c4de;
  }
  
  .prompt-title {
    font-size: 18px; font-weight: bold; margin-bottom: 20px;
    color: #2C3E50; text-align: center;
    line-height: 1.5;
  }
  
  .yi-ji {
    display: flex; gap: 20px; margin-bottom: 20px;
  }
  
  .yi, .ji {
    flex: 1; padding: 15px; border-radius: 15px;
    line-height: 1.6;
    font-size: 14px;
  }
  
  .yi {

  }
  
  .ji {
    background: rgba(231,76,60,0.2); border: 2px solid #E74C3C;
  }
  
  .yi h3, .ji h3 {
    font-size: 16px; margin-bottom: 10px;
  }
  
  .yi h3 { color: #27AE60; }
  .ji h3 { color: #C0392B; }
  
  .deep-section {
    margin-top: 20px;
  }
  
  .deep-toggle {
    background: none; border: none; color: #3498DB;
    cursor: pointer; font-size: 16px; margin-bottom: 15px;
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
    width: 100%;
  }
  
  .deep-toggle:hover {
    transform: scale(1.02);
  }
  
  .deep-content {
    font-size: 14px; line-height: 1.8; color: #34495E;
    background: rgba(232,243,253,0.8); padding: 15px; border-radius: 12px;
    display: none;
    border: 2px dashed #3498DB;
    text-indent: 2em;
  }

  .lucky-info {
    margin-top: 15px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  
  .lucky-number, .lucky-color {
    font-size: 15px;
    color: #5D6D7E;
    text-align: center;
    background: rgba(255,255,255,0.7);
    padding: 8px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .color-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 3px rgba(0,0,0,0.2);
  }
  
  .copy-btn {
    margin-top: 20px; padding: 12px 30px; background: #3498DB;
    border: none; color: white; border-radius: 20px;
    cursor: pointer; font-size: 16px; transition: all 0.3s;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    width: 100%;
  }
  
  .copy-btn:hover {
    background: #2980B9; transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.3);
  }
  
  .toast {
    position: fixed; bottom: 40px; left: 50%;
    transform: translateX(-50%); background: #2C3E50;
    color: #ECF0F1; padding: 15px 30px; border-radius: 25px;
    font-size: 16px; opacity: 0; transition: opacity 0.3s;
    z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  }
  
  .toast.show {
    opacity: 1;
  }
  
  /* 装饰性元素 */
  .decoration {
    position: absolute; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
  }
  
  .bubble {
    position: absolute; background: rgba(255,255,255,0.3);
    border-radius: 50%; animation: float 6s infinite ease-in-out;
  }
  
  .bubble:nth-child(1) { width: 30px; height: 30px; top: 10%; left: 10%; animation-delay: 0s; }
  .bubble:nth-child(2) { width: 20px; height: 20px; top: 20%; right: 15%; animation-delay: 1s; }
  .bubble:nth-child(3) { width: 25px; height: 25px; bottom: 15%; left: 20%; animation-delay: 2s; }
  .bubble:nth-child(4) { width: 15px; height: 15px; bottom: 25%; right: 10%; animation-delay: 3s; }
  
  @media (max-width: 480px) {
    .title { font-size: 32px; }

    .calendar-day { font-size: 14px; padding: 6px 2px; }
    .holiday-tag { font-size: 9px; }
    .yi-ji { flex-direction: column; gap: 12px; }
  }
</style>
</head>

  // ===================== 核心逻辑 =====================
  let currentYear = new Date().getFullYear();
  let currentMonth = new Date().getMonth();
  let selectedDate = null;

  // 渲染日历
  function renderCalendar() {
    const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
    document.getElementById('calendarTitle').textContent = `${currentYear}年 ${monthNames[currentMonth]}`;

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    // 转换为周一开头 (0=周一, 6=周日)
    const offset = firstDay === 0 ? 6 : firstDay - 1;
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const prevMonthDays = new Date(currentYear, currentMonth, 0).getDate();
    const today = new Date();
    const isCurrentMonth = today.getFullYear() === currentYear && today.getMonth() === currentMonth;

    let html = '';
    // 填充上月日期
    for (let i = offset; i > 0; i--) {
      html += `<div class="calendar-day other">${prevMonthDays - i + 1}</div>`;
    }
    // 填充当月日期
    for (let d = 1; d <= daysInMonth; d++) {
      let cls = 'calendar-day';
      if (isCurrentMonth && d === today.getDate()) cls += ' today';
      if (selectedDate === d) cls += ' selected';
      
      // 判断是否为节日
      const holidayKey = `${currentMonth + 1}-${d}`;
      const holidayName = holidays[holidayKey];
      if (holidayName) cls += ' holiday';

      html += `<div class="${cls}" onclick="selectDate(${d})">
        <span>${d}</span>
        ${holidayName ? `<span class="holiday-tag">${holidayName}</span>` : ''}
      </div>`;
    }
    // 填充下月日期
    const totalCells = offset + daysInMonth;
    const remaining = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= remaining; i++) {
      html += `<div class="calendar-day other">${i}</div>`;
    }

    document.getElementById('calendarGrid').innerHTML = html;
  }

  // 切换月份
  function changeMonth(dir) {
    currentMonth += dir;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    selectedDate = null;
    document.getElementById('promptSection').style.display = 'none';
    renderCalendar();
  }

  // 选中日期
  function selectDate(day) {
    selectedDate = day;
    renderCalendar();
    showPrompt(day);
  }

  // 获取卦象索引（根据年月日计算，确保同一天同一卦）
  function getGuaIndex(day) {
    // 用年月日计算哈希，映射到64卦
    const seed = currentYear * 10000 + (currentMonth + 1) * 100 + day;
    return seed % guaData.length;
  }

  // 显示卦象详情
  function showPrompt(day) {
    const idx = getGuaIndex(day);
    const gua = guaData[idx];
    const dateStr = `${currentYear}年${currentMonth + 1}月${day}日`;
    
    // 节日显示
    const holidayKey = `${currentMonth + 1}-${day}`;
    const holidayName = holidays[holidayKey];
    const holidayBanner = document.getElementById('holidayBanner');
    if (holidayName) {
      holidayBanner.textContent = `🎉 ${holidayName}`;
      holidayBanner.style.display = 'block';
    } else {
      holidayBanner.style.display = 'none';
    }

    // 神兽寄语
    document.getElementById('beastSpeech').textContent = `🐮 神兽寄语：${gua.pandaSpeech}`;
    // 卦名和卦辞
    document.getElementById('promptTitle').textContent = `${gua.name} · ${gua.desc}`;
    // 宜忌
    document.getElementById('yiContent').textContent = gua.do;
    document.getElementById('jiContent').textContent = gua.dont;
    // 卦象解读
    document.getElementById('deepContent').textContent = gua.philosophy;
    // 幸运色
    document.getElementById('colorDot').style.backgroundColor = gua.luckyColorHex;
    document.getElementById('colorName').textContent = gua.luckyColor;
    // 幸运数字
    document.getElementById('luckyNumber').textContent = `🔢 幸运数字：${gua.luckyNumber}`;

    // 展开详情区
    document.getElementById('promptSection').style.display = 'block';
    document.getElementById('promptSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // 点击牛跳转到今日
  function getTodayPrompt() {
    const today = new Date();
    currentYear = today.getFullYear();
    currentMonth = today.getMonth();
    selectedDate = today.getDate();
    renderCalendar();
    showPrompt(today.getDate());
  }

  // 切换深度解读
  function toggleDeep() {
    const el = document.getElementById('deepContent');
    const btn = document.querySelector('.deep-toggle');
    if (el.style.display === 'block') {
      el.style.display = 'none';
      btn.innerHTML = '🔮 卦象解读 ▼';
    } else {
      el.style.display = 'block';
      btn.innerHTML = '🔮 收起解读 ▲';
    }
  }

  // 复制功能
  function copyPrompt() {
    const idx = selectedDate ? getGuaIndex(selectedDate) : 0;
    const gua = guaData[idx];
    const dateStr = `${currentYear}年${currentMonth + 1}月${selectedDate}日`;
    
    const holidayKey = `${currentMonth + 1}-${selectedDate}`;
    const holidayName = holidays[holidayKey];
    const holidayText = holidayName ? `🎉 今日节日：${holidayName}\n` : '';
    
    const text = `🐮 牛黄历 · ${dateStr}\n${holidayText}\n【${gua.name}】\n${gua.desc}\n\n✅ 宜：${gua.do}\n❌ 忌：${gua.dont}\n\n🔮 卦象解读：\n${gua.philosophy}\n\n🎨 幸运色：${gua.luckyColor}\n🔢 幸运数字：${gua.luckyNumber}\n\n🐮 神兽寄语：${gua.pandaSpeech}`;

    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(showToast);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); showToast();
    }
  }

  // 提示弹窗
  function showToast() {
    const t = document.getElementById('toast');
    t.textContent = '✅ 已复制到剪贴板';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // 初始化
  renderCalendar();
  getTodayPrompt();
</script>
