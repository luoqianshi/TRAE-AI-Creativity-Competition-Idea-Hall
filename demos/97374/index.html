<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 学习计划看板</title>
    <link rel="stylesheet" href="styles.css?v=20260702e" />
  </head>
  <body>
    <div class="app-shell">
      <!-- ====== 侧栏导航 ====== -->
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <svg class="brand-mascot" viewBox="0 0 56 56" fill="none">
            <ellipse cx="28" cy="30" rx="20" ry="19" fill="#F5E6D3"/>
            <ellipse cx="28" cy="30" rx="20" ry="19" stroke="#C9A87C" stroke-width="1.5"/>
            <circle cx="21" cy="24" r="6" fill="#fff"/>
            <circle cx="35" cy="24" r="6" fill="#fff"/>
            <circle cx="22" cy="24" r="3.5" fill="#2C3E50"/>
            <circle cx="36" cy="24" r="3.5" fill="#2C3E50"/>
            <circle cx="23" cy="22.5" r="1.2" fill="#fff"/>
            <circle cx="37" cy="22.5" r="1.2" fill="#fff"/>
            <path d="M26 34 L28 31 L30 34Z" fill="#F4A460"/>
            <path d="M14 28 Q12 22 18 19" stroke="#C9A87C" stroke-width="1.5" fill="none"/>
            <path d="M42 28 Q44 22 38 19" stroke="#C9A87C" stroke-width="1.5" fill="none"/>
            <rect x="16" y="9" width="10" height="2.5" rx="1.2" fill="#C9A87C"/>
            <rect x="30" y="9" width="10" height="2.5" rx="1.2" fill="#C9A87C"/>
          </svg>
          <div>
            <h1>学习计划</h1>
            <p>猫头鹰陪你温和学习</p>
          </div>
          <span class="api-status offline" id="apiStatus" title="点击设置 AI API" style="cursor:pointer">⚙ 设置</span>
        </div>

        <nav class="sidebar-nav">
          <button class="nav-item active" data-view="dashboard" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/>
              <rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
            <span>仪表盘</span>
          </button>
          <button class="nav-item" data-view="gantt" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3v18h18"/>
              <rect x="6" y="7" width="8" height="4" rx="1"/>
              <rect x="12" y="13" width="6" height="4" rx="1"/>
              <rect x="8" y="18" width="10" height="3" rx="1"/>
            </svg>
            <span>甘特图</span>
          </button>
          <button class="nav-item" data-view="library" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
              <line x1="8" y1="7" x2="16" y2="7"/>
              <line x1="8" y1="11" x2="13" y2="11"/>
            </svg>
            <span>学习库</span>
          </button>
          <button class="nav-item nav-item-settings" id="navSettings" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <span>AI 设置</span>
          </button>
        </nav>

        <section class="panel">
          <div class="panel-head">
            <h2>目标</h2>
            <button class="icon-button" id="addGoalButton" type="button" title="新增目标">+</button>
          </div>
          <div class="goal-list" id="goalList"></div>
        </section>

        <section class="panel">
          <h2>今日状态</h2>
          <div class="score-group" id="scoreGroup"></div>
          <div class="status-score">
            <span>综合状态</span>
            <strong id="dailyScore">7.0</strong>
          </div>
          <button class="primary-button" id="adjustPlanButton" type="button">生成今日建议</button>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>学习资料</h2>
            <button class="icon-button" id="uploadButton" type="button" title="上传资料">+</button>
          </div>
          <div class="library-list" id="libraryList"></div>
        </section>

        <section class="panel sidebar-today">
          <h2>今日概览</h2>
          <div class="today-stats" id="todayStats">
            <div class="today-stat">
              <span class="today-stat-value" id="todayTaskCount">0</span>
              <span class="today-stat-label">今日任务</span>
            </div>
            <div class="today-stat">
              <span class="today-stat-value" id="todayDoneCount">0</span>
              <span class="today-stat-label">已完成</span>
            </div>
          </div>
        </section>
      </aside>

      <!-- ====== 主内容区 ====== -->
      <main class="workspace">
        <!-- 顶部信息栏 -->
        <header class="topbar">
          <div>
            <p class="eyebrow">当前目标</p>
            <h2 id="activeGoalTitle">三个月掌握 Python 基础</h2>
          </div>
          <div class="metrics">
            <div class="metric">
              <span>截止时间</span>
              <strong id="deadlineText">2026-09-01</strong>
            </div>
            <div class="metric">
              <span>剩余天数</span>
              <strong id="daysLeftText">85</strong>
            </div>
            <div class="metric">
              <span>完成进度</span>
              <strong id="progressText">25%</strong>
            </div>
          </div>
        </header>

        <!-- 周阶段 -->
        <section class="weekly-stage">
          <div>
            <p class="eyebrow">本周阶段</p>
            <h3 id="weeklyStageTitle">基础语法与练习节奏建立</h3>
          </div>
          <button class="ghost-button" id="generatePlanButton" type="button">生成初始计划</button>
        </section>

        <!-- 看板视图 -->
        <section class="view-container" id="dashboardView">
          <section class="board" id="board" aria-label="任务看板"></section>
        </section>

        <!-- 甘特图视图 -->
        <section class="view-container" id="ganttView" style="display:none">
          <div class="gantt-chart" id="ganttChart"></div>
        </section>

        <!-- 学习库视图 -->
        <section class="view-container" id="libraryView" style="display:none">
          <div class="library-full">
            <div class="panel-head">
              <h2>学习资料库</h2>
              <div>
                <button class="ghost-button" id="uploadButton2" type="button">上传资料</button>
              </div>
            </div>
            <input class="sr-only" id="fileInput" type="file" multiple accept=".pdf,.doc,.docx,.txt,.md" />
            <div class="library-grid" id="libraryGrid"></div>
          </div>
        </section>
      </main>

      <!-- ====== 右侧详情面板 ====== -->
      <aside class="detail-pane" aria-label="任务详情和资料问答">
        <section class="panel detail-panel">
          <div class="panel-head">
            <h2>任务详情</h2>
            <button class="icon-button" id="addTaskButton" type="button" title="新增任务">+</button>
          </div>
          <form id="taskForm" class="task-form">
            <label>
              标题
              <input id="taskTitle" type="text" />
            </label>
            <label>
              说明
              <textarea id="taskDescription" rows="4"></textarea>
            </label>
            <div class="form-row">
              <label>
                预计分钟
                <input id="taskMinutes" type="number" min="10" step="5" />
              </label>
              <label>
                难度
                <select id="taskDifficulty">
                  <option>轻松</option>
                  <option>适中</option>
                  <option>较难</option>
                </select>
              </label>
            </div>
            <label>
              截止日期
              <input id="taskDueDate" type="date" />
            </label>
            <div class="form-actions">
              <button class="ghost-button" id="deleteTaskButton" type="button">删除</button>
              <button class="primary-button" type="submit">保存</button>
            </div>
          </form>
        </section>

        <section class="panel ai-panel">
          <div class="ai-head">
            <svg class="ai-robot" viewBox="0 0 40 40" fill="none">
              <rect x="6" y="8" width="28" height="26" rx="6" fill="#E8F4FD" stroke="#6BB7DF" stroke-width="1.5"/>
              <circle cx="17" cy="20" r="3.5" fill="#6BB7DF"/>
              <circle cx="25.5" cy="20" r="3.5" fill="#6BB7DF"/>
              <circle cx="17" cy="20" r="1.5" fill="#fff"/>
              <circle cx="25.5" cy="20" r="1.5" fill="#fff"/>
              <rect x="16" y="26" width="10" height="3" rx="1.5" fill="#6BB7DF"/>
              <rect x="8" y="8" width="6" height="3" rx="1.5" fill="#6BB7DF"/>
              <rect x="26" y="8" width="6" height="3" rx="1.5" fill="#6BB7DF"/>
              <circle cx="12" cy="36" r="2" fill="#6BB7DF" opacity="0.5"/>
              <circle cx="28" cy="36" r="2" fill="#6BB7DF" opacity="0.5"/>
            </svg>
            <h2>AI 建议</h2>
          </div>
          <p id="aiSuggestion">
            今天适合保持稳定节奏，先完成一个核心任务，再安排一段轻量复习。
          </p>
        </section>

        <section class="panel qa-panel">
          <h2>资料问答</h2>
          <div class="qa-log" id="qaLog">
            <div class="qa-message assistant">可以基于已上传资料回答问题。</div>
          </div>
          <form class="qa-form" id="qaForm">
            <input id="qaInput" type="text" placeholder="输入你的问题" />
            <button class="primary-button" type="submit">提问</button>
          </form>
        </section>
      </aside>
    </div>

    <!-- 新增目标对话框 -->
    <dialog id="goalDialog">
      <form method="dialog" class="dialog-form" id="goalForm">
        <h2>新增学习目标</h2>
        <label>
          目标名称
          <input id="goalTitle" type="text" required />
        </label>
        <label>
          截止时间
          <input id="goalDeadline" type="date" required />
        </label>
        <label>
          每日学习时间
          <input id="goalDailyTime" type="text" placeholder="例如 90 分钟" />
        </label>
        <label>
          当前基础
          <select id="goalLevel">
            <option>零基础</option>
            <option>有一点基础</option>
            <option>中等基础</option>
          </select>
        </label>
        <label>
          备注
          <textarea id="goalNote" rows="3"></textarea>
        </label>
        <div class="form-actions">
          <button class="ghost-button" value="cancel" type="button" id="cancelGoalButton">取消</button>
          <button class="primary-button" value="default" type="submit">创建</button>
        </div>
      </form>
    </dialog>

    <!-- AI API 设置对话框 -->
    <dialog id="apiDialog">
      <div class="dialog-form">
        <h2>⚙ AI API 设置</h2>
        <p class="dialog-desc">配置 OpenAI 兼容接口后，AI 计划生成、每日建议和资料问答将自动启用。</p>

        <label>
          API Key
          <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
        </label>
        <label>
          API 地址
          <input id="apiBaseUrl" type="text" placeholder="https://api.openai.com/v1" />
        </label>
        <label>
          模型名称
          <input id="apiModel" type="text" placeholder="gpt-4o-mini" />
        </label>

        <div class="api-presets">
          <span class="preset-label">快速填入：</span>
          <button class="preset-btn" data-provider="openai" type="button">OpenAI</button>
          <button class="preset-btn" data-provider="deepseek" type="button">DeepSeek</button>
          <button class="preset-btn" data-provider="qwen" type="button">通义千问</button>
          <button class="preset-btn" data-provider="zhipu" type="button">智谱</button>
        </div>

        <div id="apiTestResult" class="api-test-result"></div>

        <div class="form-actions">
          <button class="ghost-button" value="cancel" type="button" id="cancelApiButton">取消</button>
          <button class="ghost-button" id="testApiButton" type="button">测试连接</button>
          <button class="primary-button" id="saveApiButton" type="button">保存</button>
        </div>
      </div>
    </dialog>

    <!-- 编辑阶段对话框 -->
    <dialog id="phaseDialog">
      <div class="dialog-form">
        <h2>编辑阶段</h2>
        <label>
          阶段名称
          <input id="phaseTitle" type="text" required />
        </label>
        <div class="form-row">
          <label>
            开始日期
            <input id="phaseStartDate" type="date" />
          </label>
          <label>
            结束日期
            <input id="phaseEndDate" type="date" />
          </label>
        </div>
        <label>
          颜色
          <input id="phaseColor" type="color" />
        </label>
        <div class="form-actions">
          <button class="ghost-button" value="cancel" type="button" id="cancelPhaseButton">取消</button>
          <button class="primary-button" id="savePhaseButton" type="button">保存</button>
        </div>
      </div>
    </dialog>

    <!-- PDF 解析（本地文件，无需外网） -->
    <script src="pdf.min.js"></script>
    <!-- DOCX 解析（本地文件，无需外网） -->
    <script src="mammoth.browser.min.js"></script>
    <script src="app.js?v=20260702e"></script>
  </body>
</html>
