<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知画学堂 - 小学知识点趣味动画学习</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #FFF9F0;
            --bg-mint: #E8F5E9;
            --bg-lavender: #F3E5F5;
            --bg-peach: #FFF3E0;
            --bg-sky: #E3F2FD;
            --text-primary: #4A4A4A;
            --text-secondary: #7A7A7A;
            --accent-coral: #FFAB91;
            --accent-sage: #A5D6A7;
            --accent-lavender: #CE93D8;
            --accent-sky: #90CAF9;
            --accent-peach: #FFCC80;
            --card-bg: rgba(255, 255, 255, 0.85);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.1);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-cream);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 249, 240, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            padding: 0 24px;
        }

        .navbar-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-coral), var(--accent-peach));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(255, 171, 145, 0.3);
        }

        .logo-text {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 28px;
            color: var(--text-primary);
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 8px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 100px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: var(--accent-sage);
            color: #2E7D32;
        }

        .nav-mobile-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-primary);
        }

        /* ===== Hero Slogan区 ===== */
        .hero {
            padding: 140px 24px 80px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--accent-sage) 0%, transparent 70%);
            opacity: 0.4;
            animation: float 8s ease-in-out infinite;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--accent-lavender) 0%, transparent 70%);
            opacity: 0.3;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(165, 214, 167, 0.3);
            color: #2E7D32;
            padding: 8px 20px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        .hero h1 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 52px;
            color: var(--text-primary);
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .hero h1 span {
            background: linear-gradient(135deg, var(--accent-coral), var(--accent-peach));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--accent-coral), #FF8A65);
            color: white;
            padding: 14px 36px;
            border-radius: 100px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(255, 138, 101, 0.35);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .hero-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(255, 138, 101, 0.45);
        }

        /* ===== 学段选择区 ===== */
        .grade-section {
            padding: 40px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-header h2 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 32px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .section-header p {
            color: var(--text-secondary);
            font-size: 15px;
        }

        .grade-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .grade-tab {
            padding: 12px 28px;
            border-radius: 100px;
            border: 2px solid transparent;
            background: var(--card-bg);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-secondary);
            box-shadow: var(--shadow-soft);
        }

        .grade-tab:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .grade-tab.active {
            border-color: var(--accent-sage);
            background: rgba(165, 214, 167, 0.15);
            color: #2E7D32;
            font-weight: 700;
        }

        /* 学科筛选 */
        .subject-filter {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .subject-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 100px;
            background: var(--card-bg);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow-soft);
        }

        .subject-chip:hover {
            transform: translateY(-2px);
        }

        .subject-chip.active {
            border-color: currentColor;
            background: rgba(255, 255, 255, 0.95);
        }

        .subject-chip .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .subject-chip.chinese { color: #E57373; }
        .subject-chip.chinese .dot { background: #E57373; }
        .subject-chip.chinese.active { background: rgba(229, 115, 115, 0.1); }

        .subject-chip.math { color: #64B5F6; }
        .subject-chip.math .dot { background: #64B5F6; }
        .subject-chip.math.active { background: rgba(100, 181, 246, 0.1); }

        .subject-chip.english { color: #FFB74D; }
        .subject-chip.english .dot { background: #FFB74D; }
        .subject-chip.english.active { background: rgba(255, 183, 77, 0.1); }

        .subject-chip.science { color: #81C784; }
        .subject-chip.science .dot { background: #81C784; }
        .subject-chip.science.active { background: rgba(129, 199, 132, 0.1); }

        /* ===== 知识点卡片列表 ===== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px 60px;
        }

        .knowledge-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .knowledge-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }

        .card-preview {
            position: relative;
            height: 180px;
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-mint), var(--bg-sky));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-preview.chinese-bg { background: linear-gradient(135deg, #FFEBEE, #FFF3E0); }
        .card-preview.math-bg { background: linear-gradient(135deg, #E3F2FD, #E8F5E9); }
        .card-preview.english-bg { background: linear-gradient(135deg, #FFF8E1, #F3E5F5); }
        .card-preview.science-bg { background: linear-gradient(135deg, #E8F5E9, #E0F7FA); }

        .preview-animation {
            width: 100px;
            height: 100px;
            position: relative;
        }

        /* 动画占位图形 */
        .anim-shape {
            position: absolute;
            border-radius: 50%;
            animation: bounce 2s ease-in-out infinite;
        }

        .anim-shape:nth-child(1) {
            width: 50px;
            height: 50px;
            background: rgba(255, 171, 145, 0.8);
            top: 10px;
            left: 10px;
            animation-delay: 0s;
        }

        .anim-shape:nth-child(2) {
            width: 35px;
            height: 35px;
            background: rgba(165, 214, 167, 0.8);
            top: 40px;
            right: 15px;
            animation-delay: 0.3s;
        }

        .anim-shape:nth-child(3) {
            width: 28px;
            height: 28px;
            background: rgba(144, 202, 249, 0.8);
            bottom: 15px;
            left: 30px;
            animation-delay: 0.6s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.1); }
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .knowledge-card:hover .play-overlay {
            opacity: 1;
        }

        .play-btn {
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }

        .knowledge-card:hover .play-btn {
            transform: scale(1.1);
        }

        .card-body {
            padding: 20px;
        }

        .card-meta {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .card-tag {
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 500;
        }

        .tag-grade {
            background: rgba(165, 214, 167, 0.25);
            color: #2E7D32;
        }

        .tag-subject {
            background: rgba(255, 171, 145, 0.2);
            color: #D84315;
        }

        .card-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .card-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }

        .card-duration {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .card-difficulty {
            display: flex;
            gap: 4px;
        }

        .difficulty-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #E0E0E0;
        }

        .difficulty-dot.active {
            background: var(--accent-peach);
        }

        /* ===== 动画预览弹窗 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            border-radius: var(--radius-lg);
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.2);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.05);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(0, 0, 0, 0.1);
            transform: rotate(90deg);
        }

        .modal-video {
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .video-placeholder {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
        }

        .video-placeholder .big-play {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .video-placeholder .big-play:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        .modal-info {
            padding: 24px;
        }

        .modal-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .modal-desc {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .btn-primary {
            flex: 1;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-coral), #FF8A65);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 138, 101, 0.35);
        }

        .btn-secondary {
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-primary);
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-secondary:hover {
            background: rgba(0, 0, 0, 0.08);
        }

        /* ===== 页脚 ===== */
        .footer {
            text-align: center;
            padding: 40px 24px;
            color: var(--text-secondary);
            font-size: 13px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }

        .footer-brand {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 20px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        /* ===== 装饰元素 ===== */
        .deco-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: var(--accent-sage);
            top: 10%;
            right: -100px;
        }

        .blob-2 {
            width: 300px;
            height: 300px;
            background: var(--accent-lavender);
            bottom: 10%;
            left: -80px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .navbar-inner {
                height: 64px;
            }

            .logo-text {
                font-size: 22px;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 64px;
                left: 0;
                right: 0;
                background: rgba(255, 249, 240, 0.98);
                flex-direction: column;
                padding: 16px;
                gap: 4px;
                border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            }

            .nav-links.active {
                display: flex;
            }

            .nav-mobile-toggle {
                display: block;
            }

            .hero {
                padding: 120px 20px 60px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .hero p {
                font-size: 16px;
            }

            .cards-grid {
                grid-template-columns: 1fr;
                padding: 0 16px 40px;
            }

            .grade-tabs {
                gap: 8px;
            }

            .grade-tab {
                padding: 10px 20px;
                font-size: 14px;
            }

            .modal-content {
                margin: 16px;
            }
        }

        /* 加载动画 */
        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }
        .stagger-6 { animation-delay: 0.6s; }
    </style>
</head>
<body>
    <!-- 装饰背景 -->
    <div class="deco-blob blob-1"></div>
    <div class="deco-blob blob-2"></div>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="#" class="logo">
                <div class="logo-icon">🎨</div>
                <span class="logo-text">知画学堂</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="#hero" class="active">首页</a></li>
                <li><a href="#grades">学段</a></li>
                <li><a href="#cards">知识点</a></li>
                <li><a href="#about">关于</a></li>
            </ul>
            <button class="nav-mobile-toggle" id="navToggle">☰</button>
        </div>
    </nav>

    <!-- Hero Slogan区 -->
    <section class="hero" id="hero">
        <div class="hero-content">
            <div class="hero-badge">
                <span>✨</span>
                <span>部编版教材同步</span>
            </div>
            <h1>让知识<span>动起来</span><br>学习更有趣</h1>
            <p>覆盖小学1-6年级语数英科学，趣味动画讲解课内知识点<br>让孩子在快乐中掌握核心内容</p>
            <a href="#grades" class="hero-cta">
                <span>🚀</span>
                <span>开始探索</span>
            </a>
        </div>
    </section>

    <!-- 学段选择区 -->
    <section class="grade-section" id="grades">
        <div class="section-header">
            <h2>选择你的学段</h2>
            <p>同步部编版小学教材，1-6年级全覆盖</p>
        </div>

        <div class="grade-tabs">
            <button class="grade-tab active" data-grade="all">全部</button>
            <button class="grade-tab" data-grade="1">一年级</button>
            <button class="grade-tab" data-grade="2">二年级</button>
            <button class="grade-tab" data-grade="3">三年级</button>
            <button class="grade-tab" data-grade="4">四年级</button>
            <button class="grade-tab" data-grade="5">五年级</button>
            <button class="grade-tab" data-grade="6">六年级</button>
        </div>

        <div class="subject-filter">
            <button class="subject-chip chinese active" data-subject="chinese">
                <span class="dot"></span>
                <span>语文</span>
            </button>
            <button class="subject-chip math active" data-subject="math">
                <span class="dot"></span>
                <span>数学</span>
            </button>
            <button class="subject-chip english active" data-subject="english">
                <span class="dot"></span>
                <span>英语</span>
            </button>
            <button class="subject-chip science active" data-subject="science">
                <span class="dot"></span>
                <span>科学</span>
            </button>
        </div>
    </section>

    <!-- 知识点卡片列表 -->
    <section class="cards-section" id="cards">
        <div class="cards-grid" id="cardsGrid">
            <!-- 卡片由JS动态生成 -->
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer" id="about">
        <div class="footer-brand">🎨 知画学堂</div>
        <p>小学课内知识点趣味动画学习平台 | 让每个孩子爱上学习</p>
        <p style="margin-top: 8px; opacity: 0.6;">© 2026 知画学堂 · 部编版教材同步</p>
    </footer>

    <!-- 动画预览弹窗 -->
    <div class="modal-overlay" id="previewModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">知识点动画</span>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-video">
                <div class="video-placeholder">
                    <div class="big-play">▶</div>
                    <p>点击播放动画讲解</p>
                </div>
            </div>
            <div class="modal-info">
                <div class="modal-meta" id="modalMeta">
                    <!-- 动态插入 -->
                </div>
                <p class="modal-desc" id="modalDesc">动画讲解描述内容...</p>
                <div class="modal-actions">
                    <button class="btn-primary">🎯 开始学习</button>
                    <button class="btn-secondary" id="modalCloseBtn">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== 知识点数据 =====
        const knowledgeData = [
            { id: 1, grade: 1, subject: 'chinese', title: '拼音王国历险记', desc: '通过趣味动画认识声母、韵母，跟着小动物们一起拼读音节，轻松掌握拼音基础。', duration: '8:30', difficulty: 1, bg: 'chinese-bg' },
            { id: 2, grade: 1, subject: 'math', title: '数字宝宝的聚会', desc: '认识1-20的数字，学习数数和比较大小，在动画故事中理解数字的概念。', duration: '6:45', difficulty: 1, bg: 'math-bg' },
            { id: 3, grade: 1, subject: 'english', title: 'Hello, Friends!', desc: '学习基础问候语和自我介绍，跟着卡通人物一起说英语，培养语感。', duration: '7:20', difficulty: 1, bg: 'english-bg' },
            { id: 4, grade: 2, subject: 'chinese', title: '成语小故事', desc: '通过生动动画讲解常用成语的出处和含义，如"守株待兔"、"画蛇添足"等。', duration: '10:15', difficulty: 2, bg: 'chinese-bg' },
            { id: 5, grade: 2, subject: 'math', title: '乘法口诀歌', desc: '将乘法表编成朗朗上口的歌曲，配合动画节奏，让背诵变得轻松有趣。', duration: '9:00', difficulty: 2, bg: 'math-bg' },
            { id: 6, grade: 2, subject: 'science', title: '植物的生长秘密', desc: '观察种子发芽、生长的全过程，了解植物需要阳光、水和空气的科学原理。', duration: '8:45', difficulty: 1, bg: 'science-bg' },
            { id: 7, grade: 3, subject: 'chinese', title: '古诗词意境画', desc: '将古诗《静夜思》《春晓》等转化为唯美动画，帮助理解诗意和情感。', duration: '12:00', difficulty: 2, bg: 'chinese-bg' },
            { id: 8, grade: 3, subject: 'math', title: '分数的奇妙世界', desc: '通过分蛋糕、切披萨等生活场景，直观理解分数的概念和简单运算。', duration: '11:30', difficulty: 3, bg: 'math-bg' },
            { id: 9, grade: 3, subject: 'english', title: 'My School Life', desc: '学习学校相关词汇和句型，描述日常校园生活，提升口语表达能力。', duration: '10:00', difficulty: 2, bg: 'english-bg' },
            { id: 10, grade: 3, subject: 'science', title: '水的三态变化', desc: '动画演示水在固态、液态、气态之间的转化，理解熔化、凝固、蒸发原理。', duration: '9:30', difficulty: 2, bg: 'science-bg' },
            { id: 11, grade: 4, subject: 'chinese', title: '修辞手法大观园', desc: '通过趣味动画讲解比喻、拟人、排比等修辞手法，让作文更生动。', duration: '13:20', difficulty: 3, bg: 'chinese-bg' },
            { id: 12, grade: 4, subject: 'math', title: '几何图形探险', desc: '认识三角形、四边形、圆等平面图形，探索它们的性质和特征。', duration: '12:45', difficulty: 3, bg: 'math-bg' },
            { id: 13, grade: 4, subject: 'english', title: 'Around the World', desc: '了解不同国家的文化和风俗，学习相关英语表达，拓展国际视野。', duration: '11:00', difficulty: 3, bg: 'english-bg' },
            { id: 14, grade: 5, subject: 'chinese', title: '四大名著入门', desc: '以动画形式介绍《西游记》《三国演义》等经典故事，激发阅读兴趣。', duration: '15:00', difficulty: 3, bg: 'chinese-bg' },
            { id: 15, grade: 5, subject: 'math', title: '小数与百分数', desc: '理解小数和百分数的意义，掌握它们之间的转化和实际应用。', duration: '13:30', difficulty: 3, bg: 'math-bg' },
            { id: 16, grade: 5, subject: 'science', title: '地球与太阳系', desc: '探索地球在太阳系中的位置，了解行星运行规律和天文知识。', duration: '14:00', difficulty: 3, bg: 'science-bg' },
            { id: 17, grade: 6, subject: 'chinese', title: '文言文启蒙', desc: '通过动画讲解《论语》《孟子》中的经典名句，降低文言文学习门槛。', duration: '16:00', difficulty: 4, bg: 'chinese-bg' },
            { id: 18, grade: 6, subject: 'math', title: '比例与方程', desc: '理解比例关系和一元一次方程，学会用数学方法解决实际问题。', duration: '15:30', difficulty: 4, bg: 'math-bg' },
            { id: 19, grade: 6, subject: 'english', title: 'Future Dreams', desc: '学习用英语表达未来计划和梦想，练习一般将来时的用法。', duration: '12:00', difficulty: 3, bg: 'english-bg' },
            { id: 20, grade: 6, subject: 'science', title: '奇妙的化学反应', desc: '观察酸碱中和、氧化等常见化学反应，了解物质变化的奥秘。', duration: '14:30', difficulty: 4, bg: 'science-bg' }
        ];

        const subjectNames = {
            chinese: '语文',
            math: '数学',
            english: '英语',
            science: '科学'
        };

        // ===== 状态 =====
        let currentGrade = 'all';
        let activeSubjects = new Set(['chinese', 'math', 'english', 'science']);

        // ===== DOM 元素 =====
        const cardsGrid = document.getElementById('cardsGrid');
        const gradeTabs = document.querySelectorAll('.grade-tab');
        const subjectChips = document.querySelectorAll('.subject-chip');
        const modal = document.getElementById('previewModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMeta = document.getElementById('modalMeta');
        const modalDesc = document.getElementById('modalDesc');
        const modalClose = document.getElementById('modalClose');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');

        // ===== 渲染卡片 =====
        function renderCards() {
            const filtered = knowledgeData.filter(item => {
                const gradeMatch = currentGrade === 'all' || item.grade === parseInt(currentGrade);
                const subjectMatch = activeSubjects.has(item.subject);
                return gradeMatch && subjectMatch;
            });

            cardsGrid.innerHTML = filtered.map((item, index) => `
                <div class="knowledge-card fade-in stagger-${(index % 6) + 1}" data-id="${item.id}">
                    <div class="card-preview ${item.bg}">
                        <div class="preview-animation">
                            <div class="anim-shape"></div>
                            <div class="anim-shape"></div>
                            <div class="anim-shape"></div>
                        </div>
                        <div class="play-overlay">
                            <div class="play-btn">▶</div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="card-meta">
                            <span class="card-tag tag-grade">${item.grade}年级</span>
                            <span class="card-tag tag-subject">${subjectNames[item.subject]}</span>
                        </div>
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-desc">${item.desc}</p>
                        <div class="card-footer">
                            <span class="card-duration">⏱ ${item.duration}</span>
                            <div class="card-difficulty">
                                ${[1,2,3,4].map(i => `<span class="difficulty-dot ${i <= item.difficulty ? 'active' : ''}"></span>`).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            // 绑定卡片点击事件
            document.querySelectorAll('.knowledge-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = parseInt(card.dataset.id);
                    openModal(id);
                });
            });
        }

        // ===== 弹窗 =====
        function openModal(id) {
            const item = knowledgeData.find(d => d.id === id);
            if (!item) return;

            modalTitle.textContent = item.title;
            modalMeta.innerHTML = `
                <span class="card-tag tag-grade">${item.grade}年级</span>
                <span class="card-tag tag-subject">${subjectNames[item.subject]}</span>
                <span class="card-tag" style="background: rgba(0,0,0,0.05); color: #666;">⏱ ${item.duration}</span>
            `;
            modalDesc.textContent = item.desc;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // ===== 事件监听 =====
        gradeTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                gradeTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentGrade = tab.dataset.grade;
                renderCards();
            });
        });

        subjectChips.forEach(chip => {
            chip.addEventListener('click', () => {
                const subject = chip.dataset.subject;
                if (activeSubjects.has(subject)) {
                    if (activeSubjects.size > 1) {
                        activeSubjects.delete(subject);
                        chip.classList.remove('active');
                    }
                } else {
                    activeSubjects.add(subject);
                    chip.classList.add('active');
                }
                renderCards();
            });
        });

        modalClose.addEventListener('click', closeModal);
        modalCloseBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        navToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        // 导航链接点击关闭移动端菜单
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
                document.querySelectorAll('.nav-links a').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            });
        });

        // ESC关闭弹窗
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ===== 初始化 =====
        renderCards();
    </script>
</body>
</html>
