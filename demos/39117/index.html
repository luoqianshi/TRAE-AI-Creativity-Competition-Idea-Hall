<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间刺客 - 打工人武器库</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap');

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a25;
            --accent-green: #00ff88;
            --accent-green-dark: #00cc6a;
            --accent-red: #ff3366;
            --accent-yellow: #ffcc00;
            --text-primary: #ffffff;
            --text-secondary: #9999aa;
            --border-color: #2a2a3a;
            --glow-green: 0 0 20px rgba(0, 255, 136, 0.3);
            --glow-red: 0 0 20px rgba(255, 51, 102, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glow-bg {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(0, 255, 136, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(255, 51, 102, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, var(--accent-green) 0%, var(--text-primary) 50%, var(--accent-red) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        header p {
            color: var(--text-secondary);
            margin-top: 10px;
            font-size: 1.1rem;
        }

        @keyframes pulse-glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 40px;
            text-align: center;
            min-width: 180px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--accent-green);
            box-shadow: var(--glow-green);
            transform: translateY(-2px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-green), transparent);
        }

        .stat-card.red::before {
            background: linear-gradient(90deg, transparent, var(--accent-red), transparent);
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .stat-card.red .stat-value {
            color: var(--accent-red);
        }

        .stat-label {
            color: var(--text-secondary);
            margin-top: 5px;
            font-size: 0.9rem;
        }

        .main-action {
            text-align: center;
            margin-bottom: 40px;
        }

        .steal-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 25px 60px;
            background: linear-gradient(135deg, var(--accent-red) 0%, #cc0044 100%);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--glow-red);
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .steal-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 51, 102, 0.5);
        }

        .steal-btn:active {
            transform: scale(0.95);
        }

        .steal-btn::after {
            content: '⚡';
            margin-left: 10px;
            animation: zap 0.5s ease-in-out infinite;
        }

        @keyframes zap {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            padding-left: 10px;
            border-left: 3px solid var(--accent-green);
        }

        .schedule-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .time-blocks {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        @media (max-width: 768px) {
            .time-blocks {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .time-blocks {
                grid-template-columns: 1fr;
            }
        }

        .time-block {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
        }

        .time-block:hover {
            border-color: var(--accent-green);
            background: rgba(0, 255, 136, 0.05);
        }

        .time-block.low-efficiency {
            border-color: var(--accent-yellow);
            background: rgba(255, 204, 0, 0.05);
        }

        .time-block.low-efficiency::after {
            content: '⏰';
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .time-block.reclaimed {
            border-color: var(--accent-green);
            background: rgba(0, 255, 136, 0.1);
            animation: reclaim-glow 1s ease-in-out infinite;
        }

        @keyframes reclaim-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(0, 255, 136, 0.3); }
            50% { box-shadow: 0 0 15px rgba(0, 255, 136, 0.5); }
        }

        .time-block.reclaimed::after {
            content: '✅';
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .time-block .time {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--accent-green);
            margin-bottom: 5px;
        }

        .time-block .activity {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .time-block .reclaim-tag {
            display: inline-block;
            background: var(--accent-green);
            color: var(--bg-primary);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 8px;
            font-weight: 700;
        }

        .records-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            max-height: 300px;
            overflow-y: auto;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: var(--bg-secondary);
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid var(--accent-red);
            transition: all 0.3s ease;
        }

        .record-item:hover {
            transform: translateX(5px);
        }

        .record-item.reclaimed {
            border-left-color: var(--accent-green);
        }

        .record-info {
            flex: 1;
        }

        .record-title {
            font-weight: 500;
            margin-bottom: 5px;
        }

        .record-time {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .record-duration {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--accent-red);
            padding: 5px 15px;
            background: rgba(255, 51, 102, 0.1);
            border-radius: 20px;
        }

        .record-item.reclaimed .record-duration {
            color: var(--accent-green);
            background: rgba(0, 255, 136, 0.1);
        }

        .report-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .report-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            padding: 15px 40px;
            background: linear-gradient(135deg, var(--accent-green) 0%, #00cc6a 100%);
            border: none;
            border-radius: 30px;
            color: var(--bg-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--glow-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .report-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }

        .report-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .report-content {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            min-height: 150px;
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text-primary);
        }

        .report-content.loading {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            transform: scale(0.8);
            transition: all 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--accent-red);
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group textarea {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: var(--glow-green);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-primary,
        .btn-secondary {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-green) 0%, #00cc6a 100%);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-green);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        .achievement-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }

        .achievement-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .achievement-card {
            background: linear-gradient(135deg, #1a1a25 0%, #0a0a0f 100%);
            border: 2px solid var(--accent-yellow);
            border-radius: 24px;
            padding: 50px;
            text-align: center;
            max-width: 400px;
            transform: scale(0.5) rotate(-10deg);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .achievement-overlay.active .achievement-card {
            transform: scale(1) rotate(0deg);
        }

        .achievement-emoji {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: bounce 0.6s ease-out;
        }

        @keyframes bounce {
            0% { transform: translateY(-50px); opacity: 0; }
            60% { transform: translateY(10px); }
            100% { transform: translateY(0); opacity: 1; }
        }

        .achievement-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--accent-yellow);
            margin-bottom: 10px;
        }

        .achievement-desc {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .close-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 3px;
        }

        .scrollbar::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .scrollbar::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    
    <div class="container">
        <header>
            <h1>时间刺客</h1>
            <p>⚔️ 打工人武器库 | 夺回属于你的时间</p>
        </header>

        <div class="stats-bar">
            <div class="stat-card red">
                <div class="stat-value" id="steal-count">0</div>
                <div class="stat-label">今日被偷次数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="reclaim-count">0</div>
                <div class="stat-label">已抢回分钟</div>
            </div>
        </div>

        <div class="main-action">
            <button class="steal-btn" id="steal-btn">又被偷了</button>
        </div>

        <div class="schedule-section">
            <div class="section-title">📅 今日日程</div>
            <div class="time-blocks" id="schedule-container"></div>
        </div>

        <div class="records-section scrollbar">
            <div class="section-title">📝 被偷记录</div>
            <div id="records-container"></div>
        </div>

        <div class="report-section">
            <div class="section-title">📊 时间刺客报告</div>
            <button class="report-btn" id="generate-report-btn">生成周报</button>
            <div class="report-content" id="report-content">
                <div class="empty-state">
                    <div class="icon">📈</div>
                    <p>点击上方按钮生成你的专属时间刺客报告</p>
                </div>
            </div>
        </div>

        <footer>
            <p>时间刺客 - 让每一分钟都有价值</p>
        </footer>
    </div>

    <div class="modal-overlay" id="steal-modal">
        <div class="modal">
            <h3>⚡ 记录被偷时间</h3>
            <form class="modal-form" id="steal-form">
                <div class="form-group">
                    <label for="steal-title">什么事打断了你？</label>
                    <input type="text" id="steal-title" placeholder="例如：同事问问题、会议、消息通知..." required>
                </div>
                <div class="form-group">
                    <label for="steal-duration">被偷走了多久？（分钟）</label>
                    <input type="number" id="steal-duration" min="1" max="480" placeholder="30" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="cancel-steal">取消</button>
                    <button type="submit" class="btn-primary">确认被偷</button>
                </div>
            </form>
        </div>
    </div>

    <div class="achievement-overlay" id="achievement-modal">
        <div class="achievement-card">
            <div class="achievement-emoji" id="achievement-emoji">🏆</div>
            <div class="achievement-title" id="achievement-title">解锁称号</div>
            <div class="achievement-desc" id="achievement-desc">恭喜你获得新成就！</div>
            <button class="close-btn" id="close-achievement">×</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY_RECORDS = 'time_assassin_records';
        const STORAGE_KEY_SCHEDULE = 'time_assassin_schedule';
        const STORAGE_KEY_ACHIEVEMENTS = 'time_assassin_achievements';
        const STORAGE_KEY_RECLAIMED_TOTAL = 'time_assassin_reclaimed_total';

        const ACHIEVEMENTS = [
            { threshold: 60, title: '时间管理大师', emoji: '🏆', desc: '累计抢回1小时，初露锋芒！' },
            { threshold: 180, title: '刺客终结者', emoji: '💀', desc: '累计抢回3小时，刺客闻风丧胆！' },
            { threshold: 300, title: '摸鱼守护神', emoji: '🐟', desc: '累计抢回5小时，摸鱼时间稳了！' },
            { threshold: 480, title: '准时下班人', emoji: '🚪', desc: '累计抢回8小时，准时下班不是梦！' },
            { threshold: 720, title: '抢时间冠军', emoji: '🥇', desc: '累计抢回12小时，时间刺客的克星！' }
        ];

        const INITIAL_SCHEDULE = [
            { id: 1, time: '09:00-10:00', activity: '晨会', efficiency: 'normal' },
            { id: 2, time: '10:00-12:00', activity: '专注工作', efficiency: 'normal' },
            { id: 3, time: '12:00-13:30', activity: '午休', efficiency: 'low' },
            { id: 4, time: '13:30-15:30', activity: '下午工作', efficiency: 'low' },
            { id: 5, time: '15:30-16:00', activity: '下午茶', efficiency: 'low' },
            { id: 6, time: '16:00-18:00', activity: '收尾工作', efficiency: 'normal' }
        ];

        function loadRecords() {
            try {
                const data = localStorage.getItem(STORAGE_KEY_RECORDS);
                return data ? JSON.parse(data) : [];
            } catch {
                return [];
            }
        }

        function saveRecords(records) {
            localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records));
        }

        function loadSchedule() {
            try {
                const data = localStorage.getItem(STORAGE_KEY_SCHEDULE);
                return data ? JSON.parse(data) : INITIAL_SCHEDULE;
            } catch {
                return INITIAL_SCHEDULE;
            }
        }

        function saveSchedule(schedule) {
            localStorage.setItem(STORAGE_KEY_SCHEDULE, JSON.stringify(schedule));
        }

        function loadAchievements() {
            try {
                const data = localStorage.getItem(STORAGE_KEY_ACHIEVEMENTS);
                return data ? JSON.parse(data) : [];
            } catch {
                return [];
            }
        }

        function saveAchievements(achievements) {
            localStorage.setItem(STORAGE_KEY_ACHIEVEMENTS, JSON.stringify(achievements));
        }

        function getReclaimedTotal() {
            try {
                const data = localStorage.getItem(STORAGE_KEY_RECLAIMED_TOTAL);
                return data ? parseInt(data) : 0;
            } catch {
                return 0;
            }
        }

        function setReclaimedTotal(total) {
            localStorage.setItem(STORAGE_KEY_RECLAIMED_TOTAL, total.toString());
        }

        function updateStats() {
            const records = loadRecords();
            const today = new Date().toDateString();
            const todayRecords = records.filter(r => new Date(r.timestamp).toDateString() === today);
            
            const stealCount = todayRecords.length;
            const reclaimedCount = todayRecords.filter(r => r.reclaimed).reduce((sum, r) => sum + r.duration, 0);

            document.getElementById('steal-count').textContent = stealCount;
            document.getElementById('reclaim-count').textContent = reclaimedCount;
        }

        function renderSchedule() {
            const schedule = loadSchedule();
            const container = document.getElementById('schedule-container');
            
            container.innerHTML = schedule.map(block => `
                <div class="time-block ${block.efficiency === 'low' ? 'low-efficiency' : ''} ${block.reclaimed ? 'reclaimed' : ''}" data-id="${block.id}">
                    <div class="time">${block.time}</div>
                    <div class="activity">${block.activity}</div>
                    ${block.efficiency === 'low' ? '<div style="font-size:0.7rem;color:#ffcc00;margin-top:5px">可压缩时段</div>' : ''}
                    ${block.reclaimed ? `<div class="reclaim-tag">抢回 ${block.reclaimed} 分钟</div>` : ''}
                </div>
            `).join('');

            document.querySelectorAll('.time-block').forEach(block => {
                block.addEventListener('click', () => {
                    const id = parseInt(block.dataset.id);
                    toggleEfficiency(id);
                });
            });
        }

        function toggleEfficiency(id) {
            const schedule = loadSchedule();
            const block = schedule.find(b => b.id === id);
            if (block) {
                block.efficiency = block.efficiency === 'low' ? 'normal' : 'low';
                saveSchedule(schedule);
                renderSchedule();
            }
        }

        function renderRecords() {
            const records = loadRecords();
            const container = document.getElementById('records-container');
            
            if (records.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🕐</div>
                        <p>暂无被偷记录，今天是幸运的一天！</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = records.slice().reverse().map(record => `
                <div class="record-item ${record.reclaimed ? 'reclaimed' : ''}">
                    <div class="record-info">
                        <div class="record-title">${record.title}</div>
                        <div class="record-time">${new Date(record.timestamp).toLocaleString('zh-CN')}</div>
                    </div>
                    <div class="record-duration">-${record.duration}分钟</div>
                </div>
            `).join('');
        }

        function addStealRecord(title, duration) {
            const records = loadRecords();
            const newRecord = {
                id: Date.now(),
                title,
                duration: parseInt(duration),
                timestamp: Date.now(),
                reclaimed: false
            };
            
            records.push(newRecord);
            saveRecords(records);
            
            reclaimTime(duration);
            
            updateStats();
            renderRecords();
            renderSchedule();
        }

        function reclaimTime(duration) {
            const schedule = loadSchedule();
            const records = loadRecords();
            const record = records[records.length - 1];
            
            let remaining = duration;
            const lowEfficiencyBlocks = schedule.filter(b => b.efficiency === 'low' && !b.reclaimed);
            
            lowEfficiencyBlocks.forEach(block => {
                if (remaining <= 0) return;
                
                const timeParts = block.time.split('-');
                const start = timeParts[0];
                const end = timeParts[1];
                const [startHour, startMin] = start.split(':').map(Number);
                const [endHour, endMin] = end.split(':').map(Number);
                const totalMinutes = (endHour - startHour) * 60 + (endMin - startMin);
                
                const reclaimAmount = Math.min(remaining, Math.floor(totalMinutes * 0.3));
                
                if (reclaimAmount > 0) {
                    block.reclaimed = (block.reclaimed || 0) + reclaimAmount;
                    remaining -= reclaimAmount;
                }
            });
            
            record.reclaimed = duration - remaining;
            saveSchedule(schedule);
            saveRecords(records);
            
            const currentTotal = getReclaimedTotal();
            const newTotal = currentTotal + (duration - remaining);
            setReclaimedTotal(newTotal);
            
            checkAchievements(newTotal);
        }

        function checkAchievements(total) {
            const unlocked = loadAchievements();
            
            ACHIEVEMENTS.forEach(achievement => {
                if (total >= achievement.threshold && !unlocked.includes(achievement.title)) {
                    unlocked.push(achievement.title);
                    saveAchievements(unlocked);
                    showAchievement(achievement);
                }
            });
        }

        function showAchievement(achievement) {
            document.getElementById('achievement-emoji').textContent = achievement.emoji;
            document.getElementById('achievement-title').textContent = achievement.title;
            document.getElementById('achievement-desc').textContent = achievement.desc;
            document.getElementById('achievement-modal').classList.add('active');
        }

        async function generateReport() {
            const records = loadRecords();
            const btn = document.getElementById('generate-report-btn');
            const content = document.getElementById('report-content');
            
            btn.disabled = true;
            content.innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';
            
            const now = new Date();
            const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            const weekRecords = records.filter(r => r.timestamp >= weekAgo.getTime());
            
            const totalSteals = weekRecords.length;
            const totalLost = weekRecords.reduce((sum, r) => sum + r.duration, 0);
            const totalReclaimed = weekRecords.filter(r => r.reclaimed).reduce((sum, r) => sum + r.reclaimed, 0);
            
            const keywordCounts = {};
            weekRecords.forEach(r => {
                const words = r.title.split(/[\s,，。、]/);
                words.forEach(word => {
                    if (word.length >= 2) {
                        keywordCounts[word] = (keywordCounts[word] || 0) + 1;
                    }
                });
            });
            
            const maxKeyword = Object.entries(keywordCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || '未知';
            
            const context = {
                totalSteals,
                totalLost,
                totalReclaimed,
                maxKeyword,
                records: weekRecords.slice(-10)
            };
            
            let reportText = '';
            
            try {
                const response = await fetch('https://trae-api-cn.mchost.guru/api/ide/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'qwen3-8b',
                        messages: [{
                            role: 'user',
                            content: `请作为时间管理专家，根据以下数据生成一份《时间刺客报告》：

数据：
- 本周被打断次数：${context.totalSteals}次
- 累计损失时间：${context.totalLost}分钟（约${Math.round(context.totalLost / 60)}小时）
- AI帮你抢回时间：${context.totalReclaimed}分钟（约${Math.round(context.totalReclaimed / 60)}小时）
- 最大刺客（出现最多的关键词）：${context.maxKeyword}

报告格式要求：
1. 使用中文，语气幽默风趣，像一个贴心的打工人盟友
2. 包含以下要素：
   - 开场问候
   - 本周数据总结
   - 最大刺客分析
   - 具体改进建议（针对最大刺客）
   - 原本下班时间与AI帮你提早的时间计算（假设每天工作8小时，原本应18:00下班）
   - 结尾鼓励
3. 使用适当的emoji增加趣味性
4. 字数控制在300字左右`
                        }]
                    })
                });
                
                const data = await response.json();
                reportText = data.choices?.[0]?.message?.content || generateFallbackReport(context);
            } catch {
                reportText = generateFallbackReport(context);
            }
            
            content.innerHTML = `<p>${reportText.replace(/\n/g, '<br>')}</p>`;
            btn.disabled = false;
        }

        function generateFallbackReport(context) {
            const earlyMinutes = Math.min(context.totalReclaimed, 180);
            const earlyHours = Math.floor(earlyMinutes / 60);
            const remainingMinutes = earlyMinutes % 60;
            
            return `
⚔️ **时间刺客报告** ⚔️

嗨，打工人！这是你的专属时间刺客战报：

📊 **本周数据**
- 被打断 ${context.totalSteals} 次
- 累计损失 ${Math.round(context.totalLost / 60)} 小时 ${context.totalLost % 60} 分钟
- AI帮你抢回 ${Math.round(context.totalReclaimed / 60)} 小时 ${context.totalReclaimed % 60} 分钟

👾 **最大刺客**
「${context.maxKeyword}」—— 这个家伙本周频繁出没，让你防不胜防！

💡 **建议**
针对「${context.maxKeyword}」，建议你设定固定的处理时间，比如每天下午3点统一处理，避免随时被打断。

⏰ **下班时间预测**
原本你应该18:00下班，但是AI帮你抢回了宝贵时间，理论上可以提前 ${earlyHours > 0 ? earlyHours + '小时' : ''}${remainingMinutes > 0 ? remainingMinutes + '分钟' : ''} 下班！

继续加油，让时间刺客无处遁形！💪
            `.trim();
        }

        document.getElementById('steal-btn').addEventListener('click', () => {
            document.getElementById('steal-modal').classList.add('active');
            document.getElementById('steal-title').focus();
        });

        document.getElementById('cancel-steal').addEventListener('click', () => {
            document.getElementById('steal-modal').classList.remove('active');
            document.getElementById('steal-form').reset();
        });

        document.getElementById('steal-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('steal-title').value;
            const duration = document.getElementById('steal-duration').value;
            
            if (title && duration) {
                addStealRecord(title, duration);
                document.getElementById('steal-modal').classList.remove('active');
                document.getElementById('steal-form').reset();
            }
        });

        document.getElementById('close-achievement').addEventListener('click', () => {
            document.getElementById('achievement-modal').classList.remove('active');
        });

        document.getElementById('generate-report-btn').addEventListener('click', generateReport);

        document.addEventListener('DOMContentLoaded', () => {
            updateStats();
            renderSchedule();
            renderRecords();
        });
    </script>
</body>
</html>
