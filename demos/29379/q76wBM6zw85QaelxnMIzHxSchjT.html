<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 知识图谱笔记 - 创意产物展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+SC:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .node {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .node:hover {
            filter: brightness(1.2);
            stroke-width: 3px;
        }

        .link {
            stroke: #475569;
            stroke-opacity: 0.4;
            stroke-width: 1.5px;
        }

        .label {
            font-size: 12px;
            fill: #94a3b8;
            pointer-events: none;
            user-select: none;
        }

        .gradient-text {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        #graph-container svg {
            width: 100%;
            height: 100%;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .analyzing {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body class="h-screen flex">

    <!-- Sidebar -->
    <aside class="w-96 glass-panel h-full flex flex-col z-10 shadow-2xl">
        <div class="p-6 border-b border-slate-700">
            <h1 class="text-2xl font-bold gradient-text">AI 知识图谱笔记</h1>
            <p class="text-slate-400 text-sm mt-1">让碎片化知识自动长出关联脉络</p>
        </div>

        <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">输入新笔记</label>
                <textarea id="note-input" rows="4" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                    placeholder="在此输入您的学习心得、概念定义或阅读摘要..."></textarea>
                <button id="analyze-btn" 
                    class="w-full mt-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                    </svg>
                    AI 语义分析并关联
                </button>
            </div>

            <div class="space-y-4">
                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">最近提取的知识点</h3>
                <div id="entities-list" class="space-y-2">
                    <!-- Entities will be populated here -->
                    <div class="bg-slate-800/50 p-3 rounded-md border border-slate-700/50 text-xs text-slate-400 text-center italic">
                        暂无提取内容，请先输入笔记
                    </div>
                </div>
            </div>
        </div>

        <div class="p-4 bg-slate-800/30 text-[10px] text-slate-500 border-t border-slate-700">
            <p>© 2026 TRAE AI 创造力大赛 - 参赛作品创意产物</p>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 relative flex flex-col">
        <!-- Top Toolbar -->
        <div class="absolute top-6 right-6 z-10 flex gap-3">
            <div class="glass-panel px-4 py-2 rounded-full text-xs flex items-center gap-4">
                <div class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                    <span>概念节点</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
                    <span>方法论</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                    <span>实例</span>
                </div>
            </div>
            <button id="reset-view" class="glass-panel p-2 rounded-full hover:bg-slate-700 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>

        <!-- Graph Area -->
        <div id="graph-container" class="flex-1"></div>

        <!-- Detail Overlay (Hidden by default) -->
        <div id="detail-card" class="absolute bottom-10 right-10 w-80 glass-panel rounded-xl p-5 translate-y-20 opacity-0 pointer-events-none transition-all duration-300 shadow-2xl">
            <h4 id="detail-title" class="text-lg font-bold text-blue-400 mb-2">知识点详情</h4>
            <p id="detail-desc" class="text-sm text-slate-300 leading-relaxed mb-4">关联描述加载中...</p>
            <div class="flex flex-wrap gap-2" id="detail-tags"></div>
        </div>

        <!-- Floating Intro -->
        <div id="intro-toast" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 glass-panel px-8 py-6 rounded-2xl text-center pointer-events-none transition-all duration-700">
            <h2 class="text-xl font-bold mb-2">欢迎使用 AI 知识图谱笔记</h2>
            <p class="text-slate-400">尝试在左侧输入一段笔记，观察 AI 如何自动编织您的知识网</p>
        </div>
    </main>

    <script>
        // --- Data & State ---
        let nodes = [
            { id: "知识体系", group: 1, val: 20 },
            { id: "深度学习", group: 1, val: 15 },
            { id: "语义网络", group: 2, val: 12 },
            { id: "关联记忆", group: 2, val: 12 },
            { id: "费曼技巧", group: 3, val: 10 },
            { id: "间隔复习", group: 3, val: 10 }
        ];

        let links = [
            { source: "知识体系", target: "深度学习" },
            { source: "知识体系", target: "语义网络" },
            { source: "深度学习", target: "关联记忆" },
            { source: "语义网络", target: "关联记忆" },
            { source: "知识体系", target: "费曼技巧" },
            { source: "费曼技巧", target: "深度学习" }
        ];

        const colors = {
            1: "#38bdf8", // Blue
            2: "#818cf8", // Indigo
            3: "#34d399"  // Emerald
        };

        // --- D3 Graph Setup ---
        const container = document.getElementById('graph-container');
        const width = container.clientWidth;
        const height = container.clientHeight;

        const svg = d3.select("#graph-container")
            .append("svg")
            .attr("viewBox", [0, 0, width, height]);

        const g = svg.append("g");

        // Zoom functionality
        const zoom = d3.zoom()
            .scaleExtent([0.2, 4])
            .on("zoom", (event) => g.attr("transform", event.transform));
        
        svg.call(zoom);

        let simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(100))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(40));

        let link = g.append("g").attr("class", "links").selectAll("line");
        let node = g.append("g").attr("class", "nodes").selectAll("g");

        function updateGraph() {
            link = link.data(links, d => `${d.source.id}-${d.target.id}`);
            link.exit().remove();
            link = link.enter().append("line")
                .attr("class", "link")
                .merge(link);

            node = node.data(nodes, d => d.id);
            node.exit().remove();
            
            const nodeEnter = node.enter().append("g")
                .attr("class", "node")
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended));

            nodeEnter.append("circle")
                .attr("r", d => d.val || 10)
                .attr("fill", d => colors[d.group] || "#94a3b8")
                .attr("stroke", "#1e293b")
                .attr("stroke-width", 2);

            nodeEnter.append("text")
                .attr("class", "label")
                .attr("dy", d => (d.val || 10) + 15)
                .attr("text-anchor", "middle")
                .text(d => d.id);

            nodeEnter.on("click", (event, d) => showDetail(d));

            node = nodeEnter.merge(node);

            simulation.nodes(nodes);
            simulation.force("link").links(links);
            simulation.alpha(1).restart();
        }

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });

        // --- Interaction Logic ---
        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }

        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }

        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }

        function showDetail(d) {
            const card = document.getElementById('detail-card');
            document.getElementById('detail-title').innerText = d.id;
            document.getElementById('detail-desc').innerText = `这是关于 "${d.id}" 的核心概念。在您的知识图谱中，它与 ${links.filter(l => l.source.id === d.id || l.target.id === d.id).length} 个知识点存在关联。`;
            
            const tags = document.getElementById('detail-tags');
            tags.innerHTML = '';
            ['核心概念', 'AI提取', '高频词'].forEach(tag => {
                const span = document.createElement('span');
                span.className = 'px-2 py-1 bg-slate-800 rounded text-[10px] text-slate-400 border border-slate-700';
                span.innerText = tag;
                tags.appendChild(span);
            });

            card.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
        }

        // --- Simulation of AI Analysis ---
        const input = document.getElementById('note-input');
        const btn = document.getElementById('analyze-btn');
        const list = document.getElementById('entities-list');
        const intro = document.getElementById('intro-toast');

        btn.addEventListener('click', () => {
            const text = input.value.trim();
            if (!text) return;

            btn.disabled = true;
            btn.innerHTML = '<span class="analyzing">AI 正在深度分析中...</span>';
            intro.style.opacity = '0';

            // Simulate network delay
            setTimeout(() => {
                // Dummy extraction logic
                const newKeywords = text.split(/[，。？！\s]/).filter(s => s.length >= 2).slice(0, 3);
                
                newKeywords.forEach((word, index) => {
                    if (!nodes.find(n => n.id === word)) {
                        const group = Math.floor(Math.random() * 3) + 1;
                        nodes.push({ id: word, group: group, val: 12 });
                        
                        // Create random links to existing nodes
                        const target = nodes[Math.floor(Math.random() * (nodes.length - 1))];
                        links.push({ source: word, target: target.id });
                    }
                });

                updateEntitiesList(newKeywords);
                updateGraph();

                btn.disabled = false;
                btn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                    </svg>
                    继续分析并关联
                `;
                input.value = '';
            }, 1500);
        });

        function updateEntitiesList(keywords) {
            if (list.querySelector('div.italic')) list.innerHTML = '';
            keywords.forEach(kw => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between bg-slate-800/80 p-3 rounded-lg border border-blue-500/30 slide-in';
                div.innerHTML = `
                    <span class="text-sm font-medium text-slate-200">${kw}</span>
                    <span class="text-[10px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full border border-blue-500/20">已入库</span>
                `;
                list.prepend(div);
            });
        }

        document.getElementById('reset-view').addEventListener('click', () => {
            svg.transition().duration(750).call(
                zoom.transform,
                d3.zoomIdentity.translate(0, 0).scale(1)
            );
        });

        // Initialize
        updateGraph();

        // Initial message hide
        setTimeout(() => {
            if (nodes.length <= 6) intro.classList.add('opacity-100');
        }, 500);

    </script>
</body>
</html>
