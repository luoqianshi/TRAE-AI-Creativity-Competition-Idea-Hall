        /* ===== Reset &amp; Base ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; font-size: 16px; }

        /* ===== CSS Variables ===== */
        :root {
            --primary: #E87A2E;
            --primary-light: #FFF0E5;
            --primary-dark: #C4611A;
            --accent: #F5A623;
            --accent-soft: #FFD580;
            --warm-bg: #FFF9F5;
            --card-bg: #FFFFFF;
            --text-primary: #3D2E1E;
            --text-secondary: #7A6B5D;
            --text-light: #A89A8C;
            --border: #F0E6DC;
            --shadow-sm: 0 2px 8px rgba(232,122,46,0.08);
            --shadow-md: 0 8px 30px rgba(232,122,46,0.12);
            --shadow-lg: 0 20px 60px rgba(232,122,46,0.15);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 32px;
        }

        /* ===== Navigation ===== */
        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(255,249,245,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 40px;
            transition: all 0.3s;
        }
        .nav-inner {
            max-width: 1200px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
            height: 64px;
        }
        .nav-logo {
            font-size: 20px; font-weight: 700; color: var(--primary);
            display: flex; align-items: center; gap: 8px;
        }
        .nav-logo svg { width: 28px; height: 28px; }
        .nav-links { display: flex; gap: 32px; list-style: none; }
        .nav-links a {
            font-size: 14px; font-weight: 500; color: var(--text-secondary);
            transition: color 0.2s;
        }
        .nav-links a:hover { color: var(--primary); }

        /* ===== Hero Section ===== */
        .hero {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 100px 40px 60px;
            background: linear-gradient(135deg, #FFF9F5 0%, #FFF0E5 40%, #FFECD2 100%);
            position: relative; overflow: hidden;
        }
        .hero::before {
            content: ''; position: absolute; top: -200px; right: -200px;
            width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle, rgba(245,166,35,0.15) 0%, transparent 70%);
        }
        .hero::after {
            content: ''; position: absolute; bottom: -150px; left: -150px;
            width: 500px; height: 500px; border-radius: 50%;
            background: radial-gradient(circle, rgba(232,122,46,0.1) 0%, transparent 70%);
        }
        .hero-content {
            max-width: 1200px; margin: 0 auto;
            display: grid; grid-template-columns: 1fr 1fr; gap: 60px;
            align-items: center; position: relative; z-index: 1;
        }
        .hero-text { max-width: 560px; }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--card-bg); border: 1px solid var(--border);
            padding: 8px 20px; border-radius: 100px;
            font-size: 13px; font-weight: 600; color: var(--primary);
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }
        .hero-badge::before {
            content: ''; width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent); animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }
        .hero h1 {
            font-size: 56px; font-weight: 800; line-height: 1.2;
            color: var(--text-primary); margin-bottom: 20px;
            letter-spacing: -1px;
        }
        .hero h1 span { color: var(--primary); }
        .hero-desc {
            font-size: 18px; color: var(--text-secondary);
            line-height: 1.8; margin-bottom: 36px;
        }
        .hero-actions { display: flex; gap: 16px; align-items: center; }
        .btn-primary {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 16px 36px; border-radius: 100px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; font-size: 16px; font-weight: 600;
            border: none; cursor: pointer;
            box-shadow: 0 8px 24px rgba(232,122,46,0.3);
            transition: all 0.3s;

        .btn-secondary {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 16px 36px; border-radius: 100px;
            background: var(--card-bg); border: 2px solid var(--border);
            color: var(--text-primary); font-size: 16px; font-weight: 600;

        }
        .problem-card {
            background: var(--card-bg); border-radius: var(--radius-md);
            padding: 36px 28px; border: 1px solid var(--border);
            transition: all 0.3s; position: relative; overflow: hidden;
        }
        .problem-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
        .problem-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 4px; background: linear-gradient(90deg, var(--primary), var(--accent));
        }
        .problem-icon {
            width: 56px; height: 56px; border-radius: 16px;
            background: var(--primary-light); display: flex;
            align-items: center; justify-content: center;
            font-size: 28px; margin-bottom: 20px;
        }
        .problem-card h3 {
            font-size: 18px; font-weight: 700; color: var(--text-primary);
            margin-bottom: 10px;
        }
        .problem-card p { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }

        /* ===== Solution Section ===== */
        .solution { background: var(--card-bg); }
        .solution-layout {
            max-width: 1100px; margin: 0 auto;
            display: grid; grid-template-columns: 1fr 1fr; gap: 80px;
            align-items: center;
        }
        .solution-visual { display: flex; justify-content: center; }
        .solution-image {
            width: 280px; border-radius: 24px;
            box-shadow: var(--shadow-lg); border: 8px solid #F8F0EA;
        }
        .solution-text h2 {
            font-size: 36px; font-weight: 800; color: var(--text-primary);
            line-height: 1.3; margin-bottom: 20px;
        }
        .solution-text h2 span { color: var(--primary); }
        .solution-text &gt; p {
            font-size: 16px; color: var(--text-secondary); margin-bottom: 32px; line-height: 1.8;
        }
        .solution-list { list-style: none; display: flex; flex-direction: column; gap: 16px; }
        .solution-list li {
            display: flex; align-items: flex-start; gap: 14px;
            font-size: 15px; color: var(--text-primary); line-height: 1.6;
        }
        .solution-list .check {
            flex-shrink: 0; width: 24px; height: 24px; border-radius: 8px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 14px; margin-top: 2px;
        }

        /* ===== Features Section ===== */
        .features { background: linear-gradient(180deg, var(--warm-bg), var(--card-bg)); }
        .features-grid {
            max-width: 1100px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px;
        }
        .feature-card {
            background: var(--card-bg); border-radius: var(--radius-md);
            padding: 36px 32px; border: 1px solid var(--border);
            display: flex; gap: 24px; align-items: flex-start;
            transition: all 0.3s;
        }
        .feature-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
        .feature-num {
            flex-shrink: 0; width: 48px; height: 48px; border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; font-size: 20px; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
        }
        .feature-card h3 {
            font-size: 18px; font-weight: 700; color: var(--text-primary);
            margin-bottom: 8px;
        }
        .feature-card p { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }

        /* ===== Scenarios Section ===== */
        .scenarios { background: var(--card-bg); }
        .scenarios-grid {
            max-width: 1100px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
        }
        .scenario-card {
            border-radius: var(--radius-md); overflow: hidden;
            background: var(--warm-bg); border: 1px solid var(--border);
            transition: all 0.3s;
        }
        .scenario-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
        .scenario-header {
            padding: 24px 24px 0;
        }
        .scenario-emoji {
            font-size: 40px; margin-bottom: 12px; display: block;
        }
        .scenario-card h3 {
            font-size: 18px; font-weight: 700; color: var(--text-primary);
            margin-bottom: 8px;
        }
        .scenario-body { padding: 0 24px 24px; }
        .scenario-card p { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }
        .scenario-tag {
            display: inline-block; margin-top: 12px;
            font-size: 12px; font-weight: 600;
            color: var(--primary); background: var(--primary-light);
            padding: 4px 12px; border-radius: 100px;
        }

        /* ===== Tech Stack ===== */
        .tech { background: linear-gradient(135deg, #3D2E1E, #5A4530); color: white; }
        .tech .section-header h2 { color: white; }
        .tech .section-header p { color: rgba(255,255,255,0.7); }
        .tech-grid {
            max-width: 900px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
        }
        .tech-item {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
            border-radius: var(--radius-sm); padding: 28px 20px;
            text-align: center; backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .tech-item:hover { background: rgba(255,255,255,0.12); transform: translateY(-2px); }
        .tech-item .icon { font-size: 32px; margin-bottom: 12px; }
        .tech-item h4 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
        .tech-item p { font-size: 12px; color: rgba(255,255,255,0.5); }

        /* ===== Roadmap ===== */
        .roadmap { background: var(--warm-bg); }
        .roadmap-timeline {
            max-width: 800px; margin: 0 auto;
            position: relative;
        }
        .roadmap-timeline::before {
            content: ''; position: absolute; left: 28px; top: 0; bottom: 0;
            width: 3px; background: linear-gradient(180deg, var(--primary), var(--accent-soft));
            border-radius: 3px;
        }
        .roadmap-item {
            display: flex; gap: 24px; align-items: flex-start;
            padding-bottom: 40px; position: relative;
        }
        .roadmap-item:last-child { padding-bottom: 0; }
        .roadmap-dot {
            flex-shrink: 0; width: 58px; height: 58px; border-radius: 50%;
            background: var(--card-bg); border: 3px solid var(--primary);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; position: relative; z-index: 1;
            box-shadow: 0 0 0 8px var(--primary-light);
        }
        .roadmap-item h4 {
            font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px;
        }
        .roadmap-item .phase { font-size: 12px; color: var(--primary); font-weight: 600; margin-bottom: 6px; }
        .roadmap-item p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }

        /* ===== Impact Section ===== */
        .impact {
            background: linear-gradient(135deg, var(--primary-light), #FFF0E5);
        }
        .impact-grid {
            max-width: 1000px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px;
        }
        .impact-card {
            background: var(--card-bg); border-radius: var(--radius-md);
            padding: 36px 32px; border: 1px solid var(--border);
            text-align: center; transition: all 0.3s;
        }
        .impact-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
        .impact-card .icon { font-size: 40px; margin-bottom: 16px; }
        .impact-card h3 {
            font-size: 32px; font-weight: 800; color: var(--primary); margin-bottom: 8px;
        }
        .impact-card p { font-size: 14px; color: var(--text-secondary); }

        /* ===== CTA Section ===== */
        .cta {
            padding: 120px 40px; text-align: center;
            background: linear-gradient(135deg, var(--primary), #D4691E);
            color: white; position: relative; overflow: hidden;
        }
        .cta::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at 30% 50%, rgba(255,255,255,0.1) 0%, transparent 50%);
        }
        .cta h2 { font-size: 44px; font-weight: 800; margin-bottom: 16px; position: relative; }
        .cta p { font-size: 18px; opacity: 0.9; margin-bottom: 36px; position: relative; }
        .cta .btn-white {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 18px 48px; border-radius: 100px;
            background: white; color: var(--primary); font-size: 17px; font-weight: 700;
            border: none; cursor: pointer; position: relative;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            transition: all 0.3s;
        }
        .cta .btn-white:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.2); }

        /* ===== Footer ===== */
        .footer {
            background: #3D2E1E; color: rgba(255,255,255,0.5);
            padding: 40px; text-align: center;
            font-size: 14px;
        }
        .footer strong { color: var(--accent); }

        /* ===== Responsive ===== */
        @media (max-width: 900px) {
            .hero-content { grid-template-columns: 1fr; text-align: center; }
            .hero-text { max-width: 100%; }
            .hero-actions { justify-content: center; }
            .hero-visual { margin-top: 40px; }
            .hero-float-card { display: none; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .problem-cards { grid-template-columns: 1fr; }
            .solution-layout { grid-template-columns: 1fr; }
            .solution-visual { order: -1; }
            .features-grid { grid-template-columns: 1fr; }
            .scenarios-grid { grid-template-columns: 1fr; }
            .tech-grid { grid-template-columns: 1fr; }
            .impact-grid { grid-template-columns: 1fr; }
            .section-header h2, .hero h1 { font-size: 32px; }
            .nav-links { display: none; }
        }
        @media (max-width: 600px) {
            .section { padding: 60px 20px; }
            .hero { padding: 80px 20px 40px; }
            .hero h1 { font-size: 28px; }
            .stat-number { font-size: 28px; }
        }

        /* ===== Animations ===== */
        .fade-up {
            opacity: 0; transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .fade-up.visible { opacity: 1; transform: translateY(0); }

    &lt;section class="section problem" id="problem"&gt;
        &lt;div class="section-header fade-up"&gt;
            &lt;div class="section-tag"&gt;痛点洞察&lt;/div&gt;
            &lt;h2&gt;为什么父母和孩子&lt;br&gt;越来越难以沟通？&lt;/h2&gt;
            &lt;p&gt;义务教育阶段是亲子关系的转折点。学业压力、青春期变化、数字化成长环境，让越来越多的家庭陷入"想说却说不好"的困境。&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class="problem-cards"&gt;
            &lt;div class="problem-card fade-up"&gt;
                &lt;div class="problem-icon"&gt;😤&lt;/div&gt;
                &lt;h3&gt;叛逆期沟通障碍&lt;/h3&gt;
                &lt;p&gt;孩子进入青春期后自我意识增强，经常用沉默、对抗、摔门代替表达。家长焦虑却无从下手，甚至适得其反。&lt;/p&gt;
            &lt;/div&gt;
            &lt;div class="problem-card fade-up"&gt;
                &lt;div class="problem-icon"&gt;📖&lt;/div&gt;
                &lt;h3&gt;缺乏科学沟通方法&lt;/h3&gt;
                &lt;p&gt;多数家长凭本能或上一代经验与孩子沟通，不了解积极倾听、共情回应、非暴力沟通等现代育儿方法。&lt;/p&gt;
            &lt;/div&gt;
            &lt;div class="problem-card fade-up"&gt;
                &lt;div class="problem-icon"&gt;📊&lt;/div&gt;
                &lt;h3&gt;亲子关系缺乏追踪&lt;/h3&gt;
                &lt;p&gt;家长不知道关系是在改善还是恶化，没有量化的参考依据，往往等到冲突爆发才意识到问题的严重性。&lt;/p&gt;
            &lt;/div&gt;
            &lt;div class="problem-card fade-up"&gt;
                &lt;div class="problem-icon"&gt;📱&lt;/div&gt;
                &lt;h3&gt;手机争夺战&lt;/h3&gt;
                &lt;p&gt;数字化时代，手机成为亲子冲突的新导火索。家长管不住，孩子离不开，双方都找不到平衡点。&lt;/p&gt;
            &lt;/div&gt;
            &lt;div class="problem-card fade-up"&gt;
                &lt;div class="problem-icon"&gt;⏰&lt;/div&gt;
                &lt;h3&gt;时间碎片化&lt;/h3&gt;
                &lt;p&gt;工作繁忙的家长往往只有碎片时间与孩子互动，缺乏高质量的陪伴和有深度的交流。&lt;/p&gt;
            &lt;/div&gt;
            &lt;div class="problem-card fade-up"&gt;
                &lt;div class="problem-icon"&gt;🤷&lt;/div&gt;
                &lt;h3&gt;求助渠道匮乏&lt;/h3&gt;
                &lt;p&gt;意识到问题后，家长缺少便捷、私密的求助渠道。心理咨询门槛高，网上的碎片信息良莠不齐。&lt;/p&gt;
            &lt;/div&gt;
        &lt;/div&gt;

    &lt;!-- Features Section --&gt;

        &lt;div class="features-grid"&gt;
            &lt;div class="feature-card fade-up"&gt;
                &lt;div class="feature-num"&gt;1&lt;/div&gt;
                &lt;div&gt;
                    &lt;h3&gt;每日沟通任务&lt;/h3&gt;
                    &lt;p&gt;AI 根据孩子年龄段和关系现状，每天推送一个具体可执行的沟通小任务。比如"今天试着用提问代替命令"，降低改善门槛。&lt;/p&gt;

            &lt;/div&gt;
            &lt;div class="feature-card fade-up"&gt;
                &lt;div class="feature-num"&gt;3&lt;/div&gt;
                &lt;div&gt;
                    &lt;h3&gt;AI 话术教练&lt;/h3&gt;
                    &lt;p&gt;遇到不知如何开口的尴尬场景？输入情况描述，AI 生成多套沟通话术方案，并解释每种话术背后的心理学原理。&lt;/p&gt;
                &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class="feature-card fade-up"&gt;
                &lt;div class="feature-num"&gt;4&lt;/div&gt;
                &lt;div&gt;
                    &lt;h3&gt;亲子时光规划&lt;/h3&gt;
                    &lt;p&gt;推荐适合不同年龄段的亲子活动，自动生成家庭日程中的"亲密时光"提醒，让陪伴不只是嘴上说说。&lt;/p&gt;
                &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class="feature-card fade-up"&gt;
                &lt;div class="feature-num"&gt;5&lt;/div&gt;
                &lt;div&gt;
                    &lt;h3&gt;成长记忆本&lt;/h3&gt;
                    &lt;p&gt;记录与孩子的珍贵对话和温馨瞬间。文字、照片、语音都可以保存。孩子长大后，这是一份无价的情感档案。&lt;/p&gt;
                &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class="feature-card fade-up"&gt;
                &lt;div class="feature-num"&gt;6&lt;/div&gt;
                &lt;div&gt;
                    &lt;h3&gt;匿名家长社区&lt;/h3&gt;
                    &lt;p&gt;遇到棘手问题可以匿名求助，获得同龄家长和专家的经验分享。在安全的社区中找到共鸣和支持。&lt;/p&gt;
                &lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Scenarios Section --&gt;
    &lt;section class="section scenarios" id="scenarios"&gt;
        &lt;div class="section-header fade-up"&gt;
            &lt;div class="section-tag"&gt;使用场景&lt;/div&gt;
            &lt;h2&gt;三个真实场景&lt;br&gt;看见改变的可能&lt;/h2&gt;
            &lt;p&gt;从日常小事到关键时刻，「父子情」始终陪伴在家长身边。&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class="scenarios-grid"&gt;
            &lt;div class="scenario-card fade-up"&gt;
                &lt;div class="scenario-header"&gt;
                    &lt;span class="scenario-emoji"&gt;🏠&lt;/span&gt;
                    &lt;h3&gt;放学后的冲突&lt;/h3&gt;
                &lt;/div&gt;
                &lt;div class="scenario-body"&gt;
                    &lt;p&gt;孩子回家就关门写作业不说话。家长打开「父子情」，AI 教练建议："不要问成绩，试着说'今天辛苦了，晚餐做了你爱吃的'。" 门，慢慢打开了。&lt;/p&gt;
                    &lt;span class="scenario-tag"&gt;化解日常冷战&lt;/span&gt;
                &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class="scenario-card fade-up"&gt;
                &lt;div class="scenario-header"&gt;
                    &lt;span class="scenario-emoji"&gt;📱&lt;/span&gt;
                    &lt;h3&gt;手机争夺大战&lt;/h3&gt;
                &lt;/div&gt;
                &lt;div class="scenario-body"&gt;
                    &lt;p&gt;因为玩手机又吵起来了。家长在情绪温度计记录"冲突"，系统推送"手机使用协议"模板，建议和孩子一起协商屏幕时间规则，变对抗为合作。&lt;/p&gt;
                    &lt;span class="scenario-tag"&gt;转化冲突为协作&lt;/span&gt;
                &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class="scenario-card fade-up"&gt;
                &lt;div class="scenario-header"&gt;
                    &lt;span class="scenario-emoji"&gt;🎓&lt;/span&gt;
                    &lt;h3&gt;成绩下滑的焦虑&lt;/h3&gt;
                &lt;/div&gt;
                &lt;div class="scenario-body"&gt;
                    &lt;p&gt;孩子期中考试退步了，家长很焦虑。话术教练生成沟通方案："先认可努力，再一起分析原因"而非"你怎么又考成这样"。亲子对话从指责变成了理解。&lt;/p&gt;
                    &lt;span class="scenario-tag"&gt;从指责到理解&lt;/span&gt;
                &lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- Tech Section --&gt;

        &lt;div class="section-header fade-up"&gt;

            &lt;p&gt;采用轻量级技术栈，优先开发小程序版本，降低使用门槛，快速触达目标用户。&lt;/p&gt;

            &lt;/div&gt;
            &lt;div class="tech-item fade-up"&gt;

            &lt;div class="tech-item fade-up"&gt;

            &lt;div class="tech-item fade-up"&gt;

            &lt;div class="tech-item fade-up"&gt;

    &lt;!-- Roadmap Section --&gt;
    &lt;section class="section roadmap" id="roadmap"&gt;
        &lt;div class="section-header fade-up"&gt;
            &lt;div class="section-tag"&gt;发展路线&lt;/div&gt;

            &lt;p&gt;分阶段推进，快速验证核心假设，逐步完善功能矩阵。&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class="roadmap-timeline"&gt;

            &lt;/div&gt;

            &lt;/div&gt;

                    &lt;h4&gt;专业资源引入&lt;/h4&gt;
                    &lt;p&gt;合作心理咨询师和家庭教育专家，提供专业付费课程和一对一咨询服务。上线亲子时光规划器。&lt;/p&gt;
                &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class="roadmap-item fade-up"&gt;
                &lt;div class="roadmap-dot"&gt;🌍&lt;/div&gt;

                    &lt;h4&gt;APP 独立版 + 学校合作&lt;/h4&gt;
                    &lt;p&gt;推出独立 APP 版本，拓展学校合作渠道，为学校提供家校沟通工具。目标用户 10 万+。&lt;/p&gt;
