<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵眸心镜 - 沉浸式场景 MBTI 人格探索</title>
    <!-- 引入 Tailwind CSS 提升视觉高级感 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 FontAwesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-800">

    <div id="app" class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-6 md:p-8 overflow-hidden min-h-[550px] flex flex-col justify-between">
        
        <!-- 1. 欢迎启动页 -->
        <div id="start-page" class="fade-in flex flex-col items-center justify-center text-center my-auto space-y-6">
            <div class="w-20 h-20 bg-indigo-100 rounded-2xl flex items-center justify-center shadow-inner text-indigo-600 text-4xl animate-bounce">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-gray-900 tracking-wide">灵眸心镜</h1>
                <p class="text-sm text-gray-500 mt-2">基于沉浸式场景的智能人格探索</p>
            </div>
            <p class="text-gray-600 text-sm bg-gray-50 p-4 rounded-xl leading-relaxed">
                这不是一份刻板的试卷。接下来，你将进入 4 个精心设计的日常场景，请凭借你的第一直觉做出选择，镜子的另一面，将映照出最真实的你。
            </p>
            <button onclick="startQuiz()" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-medium py-3.5 px-6 rounded-xl shadow-lg shadow-indigo-200 hover:opacity-95 transition-all active:scale-[0.98]">
                开启探索之旅
            </button>
        </div>

        <!-- 2. 答题核心页 (默认隐藏) -->
        <div id="quiz-page" class="hidden fade-in flex-col h-full justify-between flex-1">
            <!-- 顶部进度 -->
            <div>
                <div class="flex justify-between items-center text-xs text-gray-400 mb-2">
                    <span id="progress-text">第 1 / 4 题</span>
                    <span class="font-medium text-indigo-500" id="progress-percent">25%</span>
                </div>
                <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full transition-all duration-300" style="w-full max-w-mdidth: 25%"></div>
                </div>
            </div>

            <!-- 题目情景描写 -->
            <div class="my-8 space-y-4">
                <span class="inline-block text-xs font-semibold bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-md" id="question-tag">社交场景</span>
                <h2 class="text-lg font-medium text-gray-900 leading-relaxed" id="question-text">
                    周五晚上，一个关系不错的朋友突然组了一个多人的热闹聚会并邀请你，你刚加完班精疲力竭，此时你会：
                </h2>
            </div>

            <!-- 选项列表 -->
            <div id="options-container" class="space-y-3.5 mb-4">
                <!-- 动态渲染选项 -->
            </div>
        </div>

        <!-- 3. 结果结算页 (默认隐藏) -->
        <div id="result-page" class="hidden fade-in flex-col items-center text-center space-y-6">
            <div class="w-full">
                <span class="text-xs uppercase tracking-widest text-indigo-500 font-bold">你的镜中人格</span>
                <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mt-1" id="mbti-type">ISFJ</h1>
                <p class="text-lg font-medium text-gray-700 mt-1" id="mbti-title">守护者 / 坚实的后盾</p>
            </div>

            <!-- 核心描述 -->
            <p class="text-sm text-gray-600 bg-purple-50/50 p-4 rounded-xl leading-relaxed text-left" id="mbti-desc">
                你是个沉稳、贴心且极其可靠的人。你习惯于在幕后默默关怀他人，对细节有着惊人的感知力。你热爱秩序与和谐，是朋友和团队中最令人安心的锚。
            </p>

            <!-- 维度条形图 -->
            <div class="w-full space-y-3 text-xs bg-gray-50 p-4 rounded-xl" id="dimension-bars">
                <!-- 动态渲染维度比例 -->
            </div>

            <!-- 底部按钮 -->
            <div class="w-full pt-2 flex space-x-3">
                <button onclick="resetQuiz()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 font-medium py-3 rounded-xl transition-all">
                    重新测试
                </button>
                <button onclick="alert('截图即可分享给好友，展现真实的你！')" class="flex-1 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-medium py-3 rounded-xl shadow-md hover:opacity-95 transition-all">
                    分享结果
                </button>
            </div>
        </div>

    </div>

    <script>
        // 精简场景化题库 (覆盖 E/I, S/N, T/F, J/P 四个维度)
        const questions = [
            {
                tag: "能量来源 (E vs I)",
                text: "漫长而疲惫的工作周终于结束了，面对周末的两天假期，你通常更倾向于：",
                options: [
                    { text: "约上三五好友聚餐、逛街或去livehouse，在热闹中释放压力", dimension: "E" },
                    { text: "待在家里看书、刷剧、打游戏，享受不受打扰的独处时光来充电", dimension: "I" }
                ]
            },
            {
                tag: "认知方式 (S vs N)",
                text: "当你准备动手组装一件刚买回来的复杂小家具或模型时，你会：",
                options: [
                    { text: "严格按照说明书的步骤 A->B->C 严谨操作，确保万无一失", dimension: "S" },
                    { text: "先大致看一眼成品图，全凭感觉和逻辑自己摸索组装", dimension: "N" }
                ]
            },
            {
                tag: "决策倾向 (T vs F)",
                text: "好友向你哭诉遭遇了不公正的待遇，明显是她自己也有点冲动，这时你会：",
                options: [
                    { text: "帮她客观分析对错，指出核心问题并理性地帮她想解决办法", dimension: "T" },
                    { text: "坚决站在她这边，先安抚她的情绪，陪她一起吐槽对方", dimension: "F" }
                ]
            },
            {
                tag: "生活态度 (J vs P)",
                text: "下个月你计划去一个向往已久的城市旅游，在出发前你通常会：",
                options: [
                    { text: "做一份详细的攻略，甚至把每天的路线、车次、餐厅都定好", dimension: "J" },
                    { text: "只买好往返机票和第一晚酒店，剩下的到了地方随心所欲看心情安排", dimension: "P" }
                ]
            }
        ];

        // MBTI 人格数据库（示例包含 ISFJ 和 ENFP，其余可由 Trae 补齐）
        const mbtiDatabase = {
            "ISFJ": { title: "守护者", desc: "你沉稳、贴心且极其可靠。习惯于默默关怀他人，对细节有着惊人的感知力。你热爱秩序与和谐，是朋友和团队中最令人安心的锚。" },
            "ENFP": { title: "竞选者", desc: "你热情洋溢、充满活力与想象力。你热爱自由，擅长在生活中发现无数的可能性，你的阳光和创意总能轻易感染身边的每一个人。" },
            "DEFAULT": { title: "探索旅人", desc: "你拥有独特而丰富的心灵世界。在不同的环境下，你总能展现出极强的适应力，在感性与理性之间保持着属于你自己的精妙平衡。" }
        };

        let currentQuestionIndex = 0;
        let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };

        function startQuiz() {
            document.getElementById('start-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            
            // 更新进度
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            document.getElementById('progress-text').innerText = `第 ${currentQuestionIndex + 1} / ${questions.length} 题`;
            document.getElementById('progress-percent').innerText = `${Math.round(progress)}%`;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            
            // 更新题目内容
            document.getElementById('question-tag').innerText = q.tag;
            document.getElementById('question-text').innerText = q.text;
            
            // 渲染选项
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-gray-50 hover:bg-indigo-50/50 border border-gray-100 hover:border-indigo-200 p-4 rounded-xl text-sm leading-relaxed transition-all active:scale-[0.99] flex items-center justify-between group";
                btn.innerHTML = `
                    <span class="text-gray-700 group-hover:text-indigo-900">${opt.text}</span>
                    <i class="fa-solid fa-chevron-right text-gray-300 group-hover:text-indigo-400 text-xs ml-2"></i>
                `;
                btn.onclick = () => selectOption(opt.dimension);
                container.appendChild(btn);
            });
        }

        function selectOption(dimension) {
            scores[dimension]++;
            
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-page').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');

            // 计算出最终的 4 位 MBTI 代码
            const type = [
                scores.E >= scores.I ? "E" : "I",
                scores.S >= scores.N ? "S" : "N",
                scores.T >= scores.F ? "T" : "F",
                scores.J >= scores.P ? "J" : "P"
            ].join("");

            // 匹配数据库内容
            const resultData = mbtiDatabase[type] || mbtiDatabase["DEFAULT"];
            
            document.getElementById('mbti-type').innerText = type;
            document.getElementById('mbti-title').innerText = `${resultData.title} / 专属标签`;
            document.getElementById('mbti-desc').innerText = resultData.desc;

            // 渲染可视化条形图
            const barContainer = document.getElementById('dimension-bars');
            barContainer.innerHTML = '';
            
            const pairs = [
                { left: 'E', right: 'I', labelLeft: '外向', labelRight: '内向' },
                { left: 'S', right: 'N', labelLeft: '实感', labelRight: '直觉' },
                { left: 'T', right: 'F', labelLeft: '理性', labelRight: '感性' },
                { left: 'J', right: 'P', labelLeft: '独立', labelRight: '随性' }
            ];

            pairs.forEach(p => {
                // 因精简测试只有1题判断一个维度，这里做个好看的趣味伪比例，如果正式做多题可按实际比例计算
                const leftSelected = scores[p.left] > scores[p.right];
                const percent = leftSelected ? "68%" : "32%";
                const rightPercent = leftSelected ? "32%" : "68%";

                const row = document.createElement('div');
                row.className = "space-y-1";
                row.innerHTML = `
                    <div class="flex justify-between text-[11px] text-gray-400">
                        <span>${p.labelLeft} (${percent})</span>
                        <span>${p.labelRight} (${rightPercent})</span>
                    </div>
                    <div class="w-full bg-gray-200 h-2 rounded-full flex overflow-hidden">
                        <div class="bg-indigo-500 h-full" style="width: ${percent}"></div>
                        <div class="bg-purple-400 h-full flex-1"></div>
                    </div>
                `;
                barContainer.appendChild(row);
            });
        }

        function resetQuiz() {
            currentQuestionIndex = 0;
            scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            document.getElementById('result-page').classList.add('hidden');
            document.getElementById('start-page').classList.remove('hidden');
        }
    </script>
</body>
</html>
