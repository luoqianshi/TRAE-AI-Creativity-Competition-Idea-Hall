<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="退货宝——一个零点击、不零同意的 AI 退货代理创意提案与交互 Demo。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23E43D30'/%3E%3Cpath d='M43 20H27.5C20.6 20 15 25.6 15 32.5S20.6 45 27.5 45H43M34 12l9 8-9 8' fill='none' stroke='white' stroke-width='6'/%3E%3C/svg%3E" type="image/svg+xml" />
  <title>退货宝｜创意提案与交互 Demo</title>

  <!--
    我的假设：
    - 这份 HTML 同时服务于大赛报名评审和初赛现场体验。
    - 核心受众是经常网购、常错过退货期限，又讨厌重复售后操作的人。
    - “全程无需操作”解释为：一次授权规则后，日常低风险退货无需逐单点击。
    - 页面以中文为主，采用黑白网格 + 单一退货红，不使用装饰性图库或虚构用户评价。

    原型边界：
    - 所有订单、金额和 AI 判断均为明确标注的演示数据。
    - 真实产品需要合规接入电商、支付和物流服务；高风险商品必须暂停自动化。
  -->

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    :root {
      --brand-ink: #0a0a0a;
      --brand-paper: #f4f1ea;
      --brand-surface: #ffffff;
      --brand-red: #e43d30;
      --brand-muted: #6d6962;
      --brand-rule: #c9c4ba;
      --display: "Songti SC", STSong, "Noto Serif CJK SC", SimSun, serif;
      --body: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      --mono: "IBM Plex Mono", Menlo, Consolas, monospace;
      --page: min(1400px, calc(100vw - 48px));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; background: var(--brand-paper); }
    body {
      min-width: 320px;
      background: var(--brand-paper);
      color: var(--brand-ink);
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    button, a { font: inherit; }
    button { color: inherit; }
    img { display: block; max-width: 100%; }
    h1, h2, h3 { text-wrap: balance; }
    p { text-wrap: pretty; }
    a { color: inherit; }
    ::selection { color: white; background: var(--brand-red); }

    .site-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 76px;
      border-bottom: 1px solid var(--brand-ink);
      background: color-mix(in srgb, var(--brand-paper) 94%, transparent);
      backdrop-filter: blur(16px);
    }
    .nav-inner {
      width: var(--page);
      height: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
    }
    .nav-logo { width: 156px; }
    .nav-links { display: flex; height: 100%; }
    .nav-link {
      min-width: 92px;
      height: 100%;
      border: 0;
      border-left: 1px solid var(--brand-ink);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
    }
    .nav-link:hover, .nav-link:focus-visible { color: white; background: var(--brand-ink); outline: none; }

    .page-shell { width: var(--page); margin: 0 auto; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 28px; height: 4px; background: var(--brand-red); }
    .hero {
      min-height: calc(100vh - 76px);
      display: grid;
      grid-template-columns: minmax(0, 7fr) minmax(420px, 5fr);
      border-left: 1px solid var(--brand-ink);
      border-right: 1px solid var(--brand-ink);
    }
    .hero-copy {
      min-width: 0;
      padding: clamp(48px, 7vw, 104px) clamp(32px, 5vw, 80px) 48px;
      display: grid;
      align-content: space-between;
      gap: 48px;
    }
    .hero-title {
      margin-top: 28px;
      font-family: var(--display);
      font-size: clamp(112px, 15vw, 232px);
      font-weight: 900;
      line-height: .74;
      letter-spacing: -.09em;
      writing-mode: horizontal-tb;
    }
    .hero-title .red { color: var(--brand-red); }
    .hero-statement {
      max-width: 620px;
      padding-top: 26px;
      border-top: 1px solid var(--brand-ink);
    }
    .hero-statement h2 {
      font-family: var(--display);
      font-size: clamp(34px, 4vw, 64px);
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -.04em;
    }
    .hero-statement p { max-width: 540px; margin-top: 18px; font-size: 18px; color: var(--brand-muted); }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .primary-button, .secondary-button {
      min-height: 52px;
      padding: 0 24px;
      border: 1px solid var(--brand-ink);
      border-radius: 0;
      font-weight: 800;
      cursor: pointer;
    }
    .primary-button { color: white; background: var(--brand-red); border-color: var(--brand-red); }
    .primary-button:hover, .primary-button:focus-visible { background: var(--brand-ink); border-color: var(--brand-ink); outline: none; }
    .secondary-button { background: transparent; }
    .secondary-button:hover, .secondary-button:focus-visible { color: white; background: var(--brand-ink); outline: none; }
    .hero-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--brand-rule);
    }
    .hero-meta div { padding: 16px 16px 0 0; }
    .hero-meta span { display: block; font-family: var(--mono); font-size: 11px; color: var(--brand-muted); letter-spacing: .08em; }
    .hero-meta strong { display: block; margin-top: 4px; font-size: 14px; }

    .hero-demo {
      position: relative;
      min-height: 820px;
      overflow: hidden;
      border-left: 1px solid var(--brand-ink);
      background: var(--brand-red);
      display: grid;
      place-items: center;
      padding: 64px 24px 34px;
    }
    .hero-demo::before {
      content: "DEMO 01";
      position: absolute;
      top: 20px;
      left: 22px;
      color: white;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: .14em;
    }
    .hero-demo::after {
      content: "交互式原型 · 演示数据";
      position: absolute;
      right: 18px;
      bottom: 18px;
      color: white;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      writing-mode: vertical-rl;
    }
    .phone-stage { position: relative; z-index: 2; transform: scale(.84); transform-origin: center; }

    .section { border-top: 1px solid var(--brand-ink); }
    .section-grid {
      display: grid;
      grid-template-columns: 3fr 9fr;
      border-left: 1px solid var(--brand-ink);
      border-right: 1px solid var(--brand-ink);
    }
    .section-number {
      padding: 32px;
      border-right: 1px solid var(--brand-ink);
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: .1em;
    }
    .section-content { padding: clamp(56px, 8vw, 120px) clamp(32px, 7vw, 112px); }
    .section-title {
      max-width: 1000px;
      font-family: var(--display);
      font-size: clamp(54px, 8vw, 116px);
      font-weight: 800;
      line-height: .98;
      letter-spacing: -.055em;
    }
    .section-lede { max-width: 760px; margin-top: 32px; font-size: clamp(18px, 2vw, 25px); line-height: 1.65; }

    .problem { color: white; background: var(--brand-ink); }
    .problem .section-grid { border-color: #3d3d3d; }
    .problem .section-number { border-color: #3d3d3d; color: #aaa; }
    .problem .section-title .red { color: var(--brand-red); }
    .friction-list { margin-top: 68px; border-top: 1px solid #555; }
    .friction-row {
      display: grid;
      grid-template-columns: 86px 1fr auto;
      gap: 24px;
      align-items: baseline;
      padding: 24px 0;
      border-bottom: 1px solid #555;
    }
    .friction-row .index { font-family: var(--mono); color: var(--brand-red); }
    .friction-row strong { font-size: 24px; }
    .friction-row span:last-child { color: #aaa; font-size: 14px; }

    .concept-grid { margin-top: 72px; border-top: 1px solid var(--brand-ink); }
    .concept-row {
      display: grid;
      grid-template-columns: 90px minmax(220px, 1fr) 2fr;
      gap: 24px;
      padding: 28px 0;
      border-bottom: 1px solid var(--brand-ink);
      align-items: start;
    }
    .concept-index { color: var(--brand-red); font-family: var(--mono); font-weight: 700; }
    .concept-row h3 { font-size: 26px; line-height: 1.25; }
    .concept-row p { color: var(--brand-muted); }

    .flow-board { margin-top: 72px; display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--brand-ink); }
    .flow-step { min-height: 310px; padding: 24px; border-right: 1px solid var(--brand-ink); display: flex; flex-direction: column; justify-content: space-between; }
    .flow-step:last-child { border-right: 0; }
    .flow-step .flow-no { font-family: var(--mono); font-size: 12px; color: var(--brand-red); }
    .flow-step h3 { margin-top: 60px; font-family: var(--display); font-size: 38px; line-height: 1.1; }
    .flow-step p { margin-top: 20px; color: var(--brand-muted); font-size: 14px; }
    .flow-line { height: 6px; margin-top: 30px; background: var(--brand-ink); }
    .flow-step:last-child .flow-line { background: var(--brand-red); }

    .proof-strip { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--brand-ink); }
    .proof-cell { min-height: 260px; padding: 36px; border-right: 1px solid var(--brand-ink); }
    .proof-cell:last-child { border-right: 0; }
    .proof-cell span { font-family: var(--mono); color: var(--brand-red); font-size: 12px; }
    .proof-cell h3 { margin-top: 38px; font-family: var(--display); font-size: 34px; line-height: 1.16; }
    .proof-cell p { margin-top: 20px; color: var(--brand-muted); font-size: 15px; }

    .trust { background: var(--brand-red); color: white; }
    .trust .section-grid { border-color: rgba(255,255,255,.7); }
    .trust .section-number { border-color: rgba(255,255,255,.7); }
    .trust .section-title { max-width: 1100px; }
    .rule-list { margin-top: 64px; border-top: 1px solid white; }
    .rule-row {
      display: grid;
      grid-template-columns: 64px minmax(220px, 1fr) 2fr;
      gap: 24px;
      padding: 24px 0;
      border-bottom: 1px solid white;
    }
    .rule-row b { font-family: var(--mono); }
    .rule-row strong { font-size: 22px; }
    .rule-row p { color: rgba(255,255,255,.78); }

    .finale { color: white; background: var(--brand-ink); }
    .finale-inner {
      width: var(--page);
      min-height: 76vh;
      margin: 0 auto;
      padding: clamp(64px, 10vw, 150px) 0 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .finale h2 { max-width: 1150px; font-family: var(--display); font-size: clamp(64px, 11vw, 170px); line-height: .92; letter-spacing: -.06em; }
    .finale h2 .red { color: var(--brand-red); }
    .finale-footer { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 24px; padding-top: 32px; border-top: 1px solid #555; }
    .finale-footer p { color: #aaa; font-size: 13px; }
    .finale-footer strong { display: block; color: white; margin-bottom: 8px; }

    .app-shell { height: 100%; background: #f7f5ef; color: #111; font-family: var(--body); }
    .app-screen { min-height: 100%; padding: 18px 20px 92px; }
    .app-topline { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
    .app-brand { width: 120px; }
    .demo-label { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .08em; color: #777; }
    .app-kicker { margin-top: 18px; font-family: var(--mono); font-size: 10px; color: #777; letter-spacing: .08em; }
    .app-title { margin-top: 6px; font-family: var(--display); font-size: 39px; line-height: 1.05; letter-spacing: -.04em; }
    .app-subtitle { margin-top: 12px; color: #666; font-size: 13px; line-height: 1.6; }
    .app-rule { height: 1px; margin: 20px 0; background: #111; }
    .status-line { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 15px 0; border-bottom: 1px solid #c8c3b9; }
    .status-line:first-of-type { border-top: 1px solid #c8c3b9; }
    .status-main strong { display: block; font-size: 15px; line-height: 1.35; }
    .status-main span { display: block; margin-top: 4px; color: #777; font-size: 11px; }
    .status-badge { padding: 4px 7px; border: 1px solid #111; font-family: var(--mono); font-size: 9px; font-weight: 700; }
    .status-badge.red { color: white; background: var(--brand-red); border-color: var(--brand-red); }
    .app-button { width: 100%; min-height: 48px; margin-top: 18px; border: 1px solid #111; border-radius: 0; background: #111; color: white; font-weight: 800; cursor: pointer; }
    .app-button:hover, .app-button:focus-visible { background: var(--brand-red); border-color: var(--brand-red); outline: none; }
    .app-button.secondary { color: #111; background: transparent; }
    .app-button.secondary:hover, .app-button.secondary:focus-visible { color: white; background: #111; border-color: #111; }
    .tiny-note { margin-top: 12px; color: #777; font-size: 10px; line-height: 1.5; }
    .order-hero { margin: 14px 0 18px; padding: 16px; color: white; background: #111; }
    .order-hero span { font-family: var(--mono); font-size: 9px; color: #aaa; }
    .order-hero h3 { margin-top: 28px; font-family: var(--display); font-size: 27px; line-height: 1.15; }
    .order-hero b { display: block; margin-top: 12px; font-size: 18px; color: #ff6d62; }
    .signal-table { border-top: 1px solid #111; }
    .signal-row { display: grid; grid-template-columns: 82px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid #c8c3b9; font-size: 11px; }
    .signal-row span:first-child { font-family: var(--mono); color: #777; }
    .safety-box { margin-top: 16px; padding: 12px; border: 1px solid #111; font-size: 11px; line-height: 1.55; }
    .automation-head { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
    .automation-head strong { font-family: var(--display); font-size: 26px; }
    .automation-percent { color: var(--brand-red); font-family: var(--mono); font-weight: 800; }
    .automation-track { height: 6px; margin: 12px 0 22px; background: #d3cec4; }
    .automation-progress { height: 100%; background: var(--brand-red); transition: width .4s ease; }
    .auto-step { display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 13px 0; border-bottom: 1px solid #c8c3b9; opacity: .42; }
    .auto-step.active { opacity: 1; }
    .auto-step.done .step-dot { color: white; background: #111; }
    .step-dot { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid #111; font-family: var(--mono); font-size: 9px; }
    .auto-step strong { display: block; font-size: 13px; }
    .auto-step span { display: block; margin-top: 2px; color: #777; font-size: 10px; line-height: 1.45; }
    .done-panel { margin-top: 18px; padding: 18px; color: white; background: var(--brand-red); }
    .done-panel .done-mark { font-family: var(--mono); font-size: 10px; }
    .done-panel h3 { margin-top: 28px; font-family: var(--display); font-size: 29px; line-height: 1.1; }
    .done-panel p { margin-top: 12px; font-size: 11px; line-height: 1.55; }
    .record-row { padding: 16px 0; border-bottom: 1px solid #c8c3b9; }
    .record-row:first-of-type { border-top: 1px solid #111; }
    .record-top { display: flex; justify-content: space-between; gap: 12px; }
    .record-top strong { font-size: 14px; }
    .record-top b { color: var(--brand-red); font-family: var(--mono); font-size: 12px; }
    .record-row p { margin-top: 5px; color: #777; font-size: 10px; }
    .rule-toggle { display: grid; grid-template-columns: 1fr auto; gap: 14px; padding: 15px 0; border-bottom: 1px solid #c8c3b9; }
    .rule-toggle:first-of-type { border-top: 1px solid #111; }
    .rule-toggle strong { display: block; font-size: 13px; }
    .rule-toggle span { display: block; margin-top: 4px; color: #777; font-size: 10px; }
    .toggle { width: 42px; height: 22px; padding: 3px; border: 1px solid #111; background: #111; }
    .toggle::after { content: ""; display: block; width: 14px; height: 14px; margin-left: 18px; background: white; }
    .toggle.off { background: transparent; }
    .toggle.off::after { margin-left: 0; background: #111; }
    .app-tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 68px; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid #111; background: #f7f5ef; z-index: 5; }
    .tab-button { min-height: 48px; border: 0; background: transparent; cursor: pointer; font-size: 11px; font-weight: 700; }
    .tab-button.active { color: white; background: #111; }
    .tab-button:hover, .tab-button:focus-visible { color: white; background: var(--brand-red); outline: none; }
    .back-button { min-width: 48px; min-height: 44px; border: 0; background: transparent; text-align: left; font-weight: 800; cursor: pointer; }
    .back-button:hover, .back-button:focus-visible { color: var(--brand-red); outline: none; }

    @media (max-width: 1050px) {
      :root { --page: calc(100vw - 28px); }
      .hero { grid-template-columns: 1fr; }
      .hero-demo { min-height: 780px; border-top: 1px solid var(--brand-ink); border-left: 0; }
      .hero-title { font-size: clamp(118px, 25vw, 210px); }
      .flow-board { grid-template-columns: repeat(2, 1fr); }
      .flow-step:nth-child(2) { border-right: 0; }
      .flow-step:nth-child(-n+2) { border-bottom: 1px solid var(--brand-ink); }
      .proof-strip { grid-template-columns: 1fr; }
      .proof-cell { min-height: auto; border-right: 0; border-bottom: 1px solid var(--brand-ink); }
      .proof-cell:last-child { border-bottom: 0; }
    }

    @media (max-width: 720px) {
      :root { --page: 100vw; }
      .site-nav { height: 64px; }
      .nav-inner { padding-left: 16px; }
      .nav-logo { width: 124px; }
      .nav-link { min-width: 68px; font-size: 11px; }
      .nav-link:nth-child(2) { display: none; }
      .hero { border-left: 0; border-right: 0; }
      .hero-copy { padding: 44px 20px 36px; }
      .hero-title { font-size: clamp(104px, 35vw, 164px); }
      .hero-statement h2 { font-size: 39px; }
      .hero-statement p { font-size: 16px; }
      .hero-meta { grid-template-columns: 1fr; }
      .hero-meta div { padding-top: 12px; }
      .hero-demo { min-height: 680px; padding: 42px 0 0; }
      .phone-stage { transform: scale(.72); }
      .section-grid { grid-template-columns: 1fr; border-left: 0; border-right: 0; }
      .section-number { padding: 18px 20px; border-right: 0; border-bottom: 1px solid currentColor; }
      .section-content { padding: 64px 20px; }
      .section-title { font-size: 55px; }
      .friction-row { grid-template-columns: 48px 1fr; gap: 12px; }
      .friction-row span:last-child { grid-column: 2; }
      .concept-row, .rule-row { grid-template-columns: 48px 1fr; gap: 12px; }
      .concept-row p, .rule-row p { grid-column: 2; }
      .flow-board { grid-template-columns: 1fr; }
      .flow-step { min-height: 250px; border-right: 0; border-bottom: 1px solid var(--brand-ink); }
      .flow-step:nth-child(2) { border-right: 0; }
      .flow-step:last-child { border-bottom: 0; }
      .finale-inner { padding: 80px 20px 32px; }
      .finale h2 { font-size: 68px; }
      .finale-footer { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useState } = React;
    const returnBaoLogoSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="260" height="64" viewBox="0 0 260 64"><rect width="64" height="64" fill="#E43D30"/><path d="M43 20H27.5C20.6 20 15 25.6 15 32.5S20.6 45 27.5 45H43" fill="none" stroke="#fff" stroke-width="6"/><path d="M34 12L43 20L34 28" fill="none" stroke="#fff" stroke-width="6"/><text x="82" y="43" fill="#0A0A0A" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="800" letter-spacing="2">退货宝</text></svg>`;

      batteryIcon: { width: 26, height: 12, border: '1.5px solid currentColor', borderRadius: 3, padding: 1, position: 'relative', opacity: .8 },
      batteryCap: { position: 'absolute', top: 3, right: -3, width: 2, height: 6, background: 'currentColor', borderRadius: '0 1px 1px 0' },

                <div style={iosFrameStyles.statusIcons}>
                  <div style={iosFrameStyles.signalIcon}>

                  </div>
                  <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color: textColor }} aria-hidden="true">
                    <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
                    <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
                    <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
                  </svg>
                  <div style={iosFrameStyles.batteryIcon}>
                    <div style={{ width: `${battery}%`, height: '100%', background: 'currentColor', borderRadius: 1, opacity: .9 }} />
                    <div style={iosFrameStyles.batteryCap} />
                  </div>
                </div>
              </div>
            )}
            {showDynamicIsland && <div style={iosFrameStyles.dynamicIsland} />}
            <div style={iosFrameStyles.content}>{children}</div>
            {showHomeIndicator && <div style={{ ...iosFrameStyles.homeIndicator, ...(darkMode ? iosFrameStyles.homeIndicatorDark : {}) }} />}
          </div>
        </div>
      );
    }

    function AppTopline({ showBack = false, onBack }) {
      return (
        <div className="app-topline">
          {showBack ? <button className="back-button" onClick={onBack} aria-label="返回">← 返回</button> : <img className="app-brand" src={returnBaoLogoDataUri} alt="退货宝" />}

        </div>

          <AppTopline />
          <p className="app-kicker">07月14日 · 自动代办中</p>
          <h2 className="app-title">今天，替你<br />退掉 2 件。</h2>
          <p className="app-subtitle">已按你的规则完成判断。普通商品自动处理，高风险商品继续替你守住。</p>
          <div className="app-rule" />
          <div className="status-line">
            <div className="status-main"><strong>米白色短外套</strong><span>退货期剩 3 天 · 未使用</span></div>
            <span className="status-badge red">执行中</span>
          </div>
          <div className="status-line">
            <div className="status-main"><strong>条纹玻璃杯 × 2</strong><span>重复购买 · 包装完整</span></div>
            <span className="status-badge">已预约</span>

          <div className="order-hero">
            <span>候选 01 / 低风险</span>
            <h3>米白色短外套</h3>
            <b>预计退回 ¥459.00</b>
          </div>
          <p className="app-kicker">AI 为什么决定退</p>
          <div className="signal-table">
            <div className="signal-row"><span>使用信号</span><strong>收货 4 天，未产生穿着记录</strong></div>
            <div className="signal-row"><span>行为模式</span><strong>同类尺码近 3 次均选择退回</strong></div>
            <div className="signal-row"><span>商品状态</span><strong>包装、吊牌与赠品完整</strong></div>

          <button className="app-button secondary" onClick={onBack}>返回今日</button>
        </div>
      );
    }

    const automationSteps = [
      ['核验政策', '确认退货期限、商品状态与平台规则'],
      ['提交售后', '自动选择原因并生成退货申请'],
      ['生成标签', '创建数字标签与取件校验码'],
      ['预约取件', '取件员带退货袋，18:00—20:00 上门'],
    ];

    function AutomationScreen({ onBack }) {
      const [step, setStep] = useState(0);
      useEffect(() => {
        if (step === 0 || step >= automationSteps.length) return undefined;
        const timer = window.setTimeout(() => setStep((current) => Math.min(current + 1, automationSteps.length)), 650);
        return () => window.clearTimeout(timer);
      }, [step]);
      const progress = step === 0 ? 0 : Math.round((step / automationSteps.length) * 100);
      return (
        <div className="app-screen">
          <AppTopline showBack onBack={onBack} />
          <p className="app-kicker">任务 RMA-0714-02</p>
          <div className="automation-head"><strong>自动代办</strong><span className="automation-percent">{progress}%</span></div>
          <div className="automation-track"><div className="automation-progress" style={{ width: `${progress}%` }} /></div>
          {automationSteps.map(([title, description], index) => {
            const position = index + 1;
            const isDone = step >= position;
            const isActive = step === position || isDone;
            return (
              <div className={`auto-step ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}`} key={title}>
                <div className="step-dot">{isDone ? '✓' : `0${position}`}</div>
                <div><strong>{title}</strong><span>{description}</span></div>
              </div>
            );
          })}
          {step === 0 && <button className="app-button" data-testid="execute-automation" onClick={() => setStep(1)}>开始模拟执行</button>}
          {step === automationSteps.length && (
            <div className="done-panel" data-testid="automation-done">
              <span className="done-mark">DONE / 可撤回 2 小时</span>
              <h3>现在，等人来取。</h3>
              <p>取件员将携带退货袋并现场贴码。退款到账后，退货宝会自动完成对账。</p>
            </div>
          )}
          {step === automationSteps.length && <button className="app-button secondary" onClick={onBack}>返回今日</button>}
        </div>
      );
    }

    function HistoryScreen() {
      const records = [
        ['条纹玻璃杯 × 2', '+¥128.00', '已预约取件 · 今天 18:00—20:00'],
        ['亚麻床单四件套', '+¥699.00', '退款到账 · 07月09日'],
        ['复古跑鞋', '+¥529.00', '退款到账 · 07月02日'],

        <div className="app-screen">

          <div className="app-rule" />
          {records.map(([name, amount, status]) => (
            <div className="record-row" key={name}><div className="record-top"><strong>{name}</strong><b>{amount}</b></div><p>{status}</p></div>
          ))}
        </div>

    }

    function RulesScreen() {
      const rules = [
        ['普通商品自动代办', '金额低于 ¥500，包装完整且支持无理由退货', true],
        ['到期前主动处理', '退货期只剩 3 天且判断置信度高于 90%', true],
        ['高价商品自动退回', '金额超过 ¥500 的商品始终需要确认', false],

          <div className="app-rule" />
          {rules.map(([title, description, enabled]) => (
            <div className="rule-toggle" key={title}><div><strong>{title}</strong><span>{description}</span></div><div className={`toggle ${enabled ? '' : 'off'}`} aria-label={enabled ? '已开启' : '已关闭'} /></div>
          ))}
        </div>
      );
    }

    function AppPhone({ demoRequest }) {
      const [screen, setScreen] = useState('home');
      useEffect(() => {
        if (demoRequest > 0) setScreen('order');

      const content = screen === 'order'
        ? <OrderScreen onBack={() => setScreen('home')} onRun={() => setScreen('automation')} />
        : screen === 'automation'
          ? <AutomationScreen onBack={() => setScreen('home')} />
          : screen === 'history'
            ? <HistoryScreen />
            : screen === 'rules'
              ? <RulesScreen />
              : <HomeScreen onOpenOrder={() => setScreen('order')} />;
      const showTabs = ['home', 'history', 'rules'].includes(screen);
      return (
        <IosFrame>
          <div className="app-shell" data-screen={screen}>
            {content}
            {showTabs && (
              <nav className="app-tabbar" aria-label="应用导航">
                <button className={`tab-button ${screen === 'home' ? 'active' : ''}`} data-testid="tab-home" onClick={() => setScreen('home')}>今日</button>
                <button className={`tab-button ${screen === 'history' ? 'active' : ''}`} data-testid="tab-history" onClick={() => setScreen('history')}>记录</button>
                <button className={`tab-button ${screen === 'rules' ? 'active' : ''}`} data-testid="tab-rules" onClick={() => setScreen('rules')}>规则</button>
              </nav>

    function App() {

          <main>

                </div>
              </div>
            </section>

            <section className="section" id="solution">

                    <div className="concept-row"><span className="concept-index">02</span><h3>守住边界</h3><p>金额、礼品属性、拆封状态、平台规则与置信度共同决定是否自动处理。</p></div>

              </div>

                <article className="proof-cell"><span>VALUE</span><h3>把碎片化售后变成可撤回的自动任务</h3><p>减少重复操作、避免过期损失，并让退款状态始终可追踪。</p></article>
                <article className="proof-cell"><span>FORM</span><h3>一款连接电商、物流与支付对账的 AI 生活代理</h3><p>本 Demo 聚焦用户可见的判断、执行和安全边界。</p></article>
              </div>
            </section>

            <section className="section trust" id="trust">
              <div className="page-shell section-grid">
                <div className="section-number">04 / TRUST</div>
                <div className="section-content">
                  <h2 className="section-title">自动化最大的能力，<br />是知道什么时候停。</h2>
                  <div className="rule-list">
                    <div className="rule-row"><b>01</b><strong>一次授权</strong><p>用户预先设置金额、品类、商品状态和置信度阈值，不逐单重复操作。</p></div>
                    <div className="rule-row"><b>02</b><strong>两小时撤回</strong><p>低风险任务执行后保留可撤回窗口，避免误判直接变成不可逆结果。</p></div>

          </main>

          <footer className="finale">

  </script>
