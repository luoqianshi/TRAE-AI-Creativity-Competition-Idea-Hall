<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>字塔 - 参赛版</title>
    <style>
      :root {
        --green: #00ff00;
        --green-soft: rgba(0, 255, 0, 0.12);
        --green-line: rgba(0, 255, 0, 0.24);
        --panel: rgba(0, 0, 0, 0.72);
        --red-alert: rgba(239, 68, 68, 0.82);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #000;
        color: var(--green);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }

      button,
      input {
        font: inherit;
      }

      .app {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
      }

      .app.alert {
        box-shadow: inset 0 0 0 3px var(--red-alert);
      }

      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at top, rgba(0, 255, 0, 0.08), transparent 55%);
        pointer-events: none;
      }

      .shell {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
      }

      .top-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 24px 0;
      }

      .link-btn,
      .action-btn {
        border: 1px solid var(--green);
        border-radius: 8px;
        background: transparent;
        color: var(--green);
        padding: 10px 14px;
        cursor: pointer;
        text-decoration: none;
        font-size: 12px;
        font-weight: 700;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .link-btn:hover,
      .action-btn:hover {
        background: var(--green);
        color: #000;
      }

      .banner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--green-line);
      }

      .banner-spacer {
        min-width: 140px;
      }

      .banner-title {
        text-align: center;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.24em;
      }

      .main {
        display: grid;
        grid-template-columns: 1.8fr 1fr;
        gap: 16px;
        padding: 16px 24px;
      }

      .panel {
        border: 1px solid var(--green-line);
        border-radius: 16px;
        background: var(--panel);
      }

      .grid-panel {
        min-height: 520px;
        padding: 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(20, minmax(0, 1fr));
        gap: 0;
        user-select: none;
        text-align: center;
        font-size: 28px;
        line-height: 1;
      }

      .cell {
        width: 100%;
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid transparent;
        overflow: hidden;
      }

      .cell.hint {
        background: var(--green-soft);
        border-radius: 6px;
      }

      .player {
        color: #fff;
        font-weight: 900;
        animation: pulse 1.2s infinite ease-in-out;
      }

      .road {
        opacity: 0;
      }

      .wall {
        color: #52525b;
      }

      .grass {
        color: #22c55e;
        display: inline-block;
        transform: rotate(-12deg);
      }

      .sky {
        color: #60a5fa;
        font-size: 1.25em;
      }

      .star {
        color: #fde047;
        font-size: 0.65em;
        animation: pulse 1.1s infinite ease-in-out;
      }

      .river {
        color: #1d4ed8;
      }

      .panic {
        color: #ef4444;
      }

      .chaos {
        color: #7f1d1d;
        animation: shake 0.35s infinite;
      }

      .lock {
        color: #d97706;
      }

      .bad {
        color: #e879f9;
      }

      .terminal {
        color: #22d3ee;
      }

      .gate {
        color: #fde047;
      }

      .blocker {
        color: #fdba74;
      }

      .master {
        color: #ddd6fe;
      }

      .power {
        color: #a3e635;
      }

      .guard {
        color: #7dd3fc;
      }

      .wisdom {
        color: #34d399;
      }

      .status {
        padding: 16px;
      }

      .status h2,
      .status h3,
      .terminal-panel h2,
      .command-panel h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.2em;
      }

      .stats-grid {
        margin-top: 16px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        font-size: 14px;
      }

      .stat-card,
      .status-card,
      .skill-card,
      .tip-card,
      .terminal-panel,
      .command-panel {
        border: 1px solid var(--green-line);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .status-card,
      .tip-card {
        margin-top: 14px;
        font-size: 13px;
        line-height: 1.7;
      }

      .skill-card {
        margin-top: 16px;
        background: rgba(0, 255, 0, 0.05);
        font-size: 13px;
        line-height: 1.7;
      }

      .skill-name {
        font-weight: 900;
      }

      .command-shell {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 16px;
        border-top: 1px solid var(--green-line);
        padding: 16px 24px 20px;
      }

      .command-panel input {
        width: 100%;
        margin-top: 12px;
        border: 1px solid rgba(0, 255, 0, 0.3);
        border-radius: 8px;
        background: #000;
        color: var(--green);
        padding: 12px 14px;
        outline: none;
      }

      .command-panel input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(0, 255, 0, 0.08);
      }

      .prompt {
        margin-top: 10px;
        font-size: 12px;
        color: rgba(0, 255, 0, 0.62);
      }

      .log-list,
      .terminal-list {
        margin-top: 12px;
        height: 170px;
        overflow-y: auto;
        font-size: 13px;
        line-height: 1.7;
        padding-right: 4px;
      }

      .log-warning {
        color: #f87171;
      }

      .log-battle {
        color: #fcd34d;
      }

      .log-system {
        color: #67e8f9;
      }

      .terminal-panel {
        height: 100%;
        padding: 16px;
      }

      .terminal-window {
        margin-top: 16px;
        height: 440px;
        overflow-y: auto;
        border: 1px solid var(--green-line);
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.92);
        padding: 14px;
        font-size: 14px;
        line-height: 1.8;
      }

      .dialogue,
      .overlay {
        position: absolute;
        z-index: 20;
      }

      .dialogue {
        left: 24px;
        right: 24px;
        bottom: 210px;
        display: none;
      }

      .dialogue.show {
        display: block;
      }

      .dialogue-card {
        max-width: 980px;
        margin: 0 auto;
        border: 1px solid rgba(0, 255, 0, 0.35);
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.92);
        box-shadow: 0 0 30px rgba(0, 255, 0, 0.12);
        padding: 18px 20px;
      }

      .dialogue-label {
        font-size: 12px;
        letter-spacing: 0.24em;
        color: rgba(0, 255, 0, 0.72);
      }

      .dialogue-speaker {
        margin-top: 10px;
        color: #fff;
        font-weight: 900;
      }

      .dialogue-text {
        margin-top: 12px;
        font-size: 14px;
        line-height: 1.9;
      }

      .dialogue-foot {
        margin-top: 10px;
        font-size: 12px;
        color: rgba(0, 255, 0, 0.62);
      }

      .overlay {
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.86);
        padding: 16px;
      }

      .overlay.show {
        display: flex;
      }

      .overlay-card {
        width: min(560px, 100%);
        border: 1px solid rgba(0, 255, 0, 0.4);
        border-radius: 16px;
        background: #000;
        padding: 28px;
        text-align: center;
      }

      .overlay-title {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 0.2em;
      }

      .overlay-text {
        margin-top: 16px;
        font-size: 14px;
        line-height: 1.9;
        color: rgba(0, 255, 0, 0.84);
      }

      .overlay-actions {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.85;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-1px);
        }
        75% {
          transform: translateX(1px);
        }
      }

      @media (max-width: 980px) {
        .main,
        .command-shell {
          grid-template-columns: 1fr;
        }

        .banner {
          flex-wrap: wrap;
        }

        .banner-spacer {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <div class="glow"></div>
      <div class="shell">
        <div>
          <div class="top-actions">
            <a class="link-btn" href="./happytyping.html">回到打字圣殿</a>
          </div>
          <div class="banner">
            <div class="banner-spacer"></div>
            <div class="banner-title" id="title">第一层：大梦初醒</div>
            <button class="action-btn" id="practice-btn">调试：模拟练习打字 (SP +20)</button>
          </div>
        </div>

        <div class="main">
          <div class="panel grid-panel" id="left-panel"></div>
          <div class="panel status" id="status-panel"></div>
        </div>

        <div class="command-shell">
          <div class="panel command-panel">
            <h2>指令输入</h2>
            <input id="command-input" autocomplete="off" spellcheck="false" />
            <div class="prompt" id="prompt"></div>
          </div>
          <div class="panel command-panel">
            <h2>动态日志</h2>
            <div class="log-list" id="log-list"></div>
          </div>
        </div>
      </div>

      <div class="dialogue" id="dialogue">
        <div class="dialogue-card">
          <div class="dialogue-label">DIALOGUE</div>
          <div class="dialogue-speaker" id="dialogue-speaker">师</div>
          <div class="dialogue-text" id="dialogue-text"></div>
          <div class="dialogue-foot">按空格继续</div>
        </div>
      </div>

      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <div class="overlay-title" id="overlay-title">VICTORY</div>
          <div class="overlay-text" id="overlay-text"></div>
          <div class="overlay-actions">
            <button class="action-btn" id="restart-btn">重新挑战</button>
            <a class="link-btn" href="./happytyping.html">返回打字网站</a>
          </div>
        </div>
      </div>
    </div>

        "力": "ITEM_POWER",
        "防": "ITEM_GUARD",
        "智": "ITEM_WISDOM",
      };

      const state = {
        level: "LEVEL_ONE",
        mode: "EXPLORE",
        player: { x: 9, y: 18 },
        facing: "UP",
        stats: { ...BASE_STATS },
        sp: 50,
        tiles: [],
        flags: {},
        dialogue: null,
        typingTarget: null,
        inputValue: "",
        blockerSecondsLeft: null,
        logs: [],
        terminalEntries: [],
        terminalProgress: { hasKun: false, hasPeng: false, solved: false },
      };

      const app = document.getElementById("app");
      const titleNode = document.getElementById("title");
      const leftPanel = document.getElementById("left-panel");
      const statusPanel = document.getElementById("status-panel");
      const commandInput = document.getElementById("command-input");
      const promptNode = document.getElementById("prompt");
      const logList = document.getElementById("log-list");
      const practiceBtn = document.getElementById("practice-btn");
      const dialogueNode = document.getElementById("dialogue");
      const dialogueSpeaker = document.getElementById("dialogue-speaker");
      const dialogueText = document.getElementById("dialogue-text");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayText = document.getElementById("overlay-text");
      const restartBtn = document.getElementById("restart-btn");

      let blockerTimer = null;

      function coordEq(a, b) {
        return a.x === b.x && a.y === b.y;
      }

      function cloneMap(tiles) {
        return tiles.map((row) => [...row]);
      }

      function findCoord(map, glyph) {
        for (let y = 0; y < map.length; y += 1) {
          for (let x = 0; x < map[y].length; x += 1) {
            if (map[y][x] === glyph) return { x, y };
          }
        }
        throw new Error("missing glyph " + glyph);
      }

      const LEVEL_ONE_START = findCoord(LEVEL_ONE_MAP, "我");
      const LEVEL_ONE_GATE = findCoord(LEVEL_ONE_MAP, "門");
      const LEVEL_ONE_MASTER = findCoord(LEVEL_ONE_MAP, "师");
      const LEVEL_ONE_REWARD_POWER = { ...LEVEL_ONE_MASTER };
      const LEVEL_ONE_REWARD_WISDOM = { x: LEVEL_ONE_MASTER.x + 1, y: LEVEL_ONE_MASTER.y };
      const LEVEL_ONE_DIALOGUE = [
        "“你终于醒了……超级 AI 用『名相乱码』封锁了人类的文明核心。”",
        "“看到最上方的『門』了吗？那是通往下一层内核的出口。握紧你胸中的文字火种，去重构世界吧！”",
      ];
      const LEVEL_ONE_GATE_POSTS = [
        { ...LEVEL_ONE_GATE },
        { x: LEVEL_ONE_GATE.x + 1, y: LEVEL_ONE_GATE.y },
      ];
      const LEVEL_ONE_EXIT = { x: LEVEL_ONE_GATE.x + 1, y: LEVEL_ONE_GATE.y };

      const LEVEL_TWO_START = { x: 9, y: 18 };
      const LEVEL_TWO_BAD_GATE = findCoord(LEVEL_TWO_MAP, "坏");
      const LEVEL_TWO_BAD_ENEMY = findCoord(LEVEL_TWO_MAP, "慌");
      const LEVEL_TWO_PRISON = findCoord(LEVEL_TWO_MAP, "牢");
      const LEVEL_TWO_DEFENSE = findCoord(LEVEL_TWO_MAP, "防");
      const LEVEL_TWO_BLOCKER = findCoord(LEVEL_TWO_MAP, "阻");
      const LEVEL_TWO_HIDDEN_GATE = { x: 16, y: 12 };
      const LEVEL_TWO_GATE_POSTS = [
        { ...LEVEL_TWO_HIDDEN_GATE },
        { x: LEVEL_TWO_HIDDEN_GATE.x + 1, y: LEVEL_TWO_HIDDEN_GATE.y },
      ];
      const LEVEL_TWO_EXIT = { x: LEVEL_TWO_HIDDEN_GATE.x + 1, y: LEVEL_TWO_HIDDEN_GATE.y };
      const LEVEL_TWO_BAD_OPEN = [{ ...LEVEL_TWO_BAD_GATE }];
      const LEVEL_TWO_PRISON_OPEN = [
        { ...LEVEL_TWO_PRISON },
        { x: LEVEL_TWO_PRISON.x + 1, y: LEVEL_TWO_PRISON.y },
        { x: LEVEL_TWO_PRISON.x + 2, y: LEVEL_TWO_PRISON.y },
      ];

      const INITIAL_FLAGS = () => ({
        masterDialogueDone: false,
        firstPowerCollected: false,
        firstWisdomCollected: false,
        badGateOpened: false,
        badEnemyDefeated: false,
        secondPowerCollected: false,
        prisonOpened: false,
        secondDefenseCollected: false,
        secondWisdomCollected: false,
        terminalSolved: false,
        blockerCleared: false,
        gateOpened: false,
      });

      function createBeep() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "square";
          osc.frequency.value = 880;
          gain.gain.value = 0.03;
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.08);
          osc.onended = () => ctx.close();
        } catch (_) {}
      }

      function createMap(level) {
        const raw = level === "LEVEL_ONE" ? LEVEL_ONE_MAP : LEVEL_TWO_MAP;
        return raw.map((row) =>
          row.map((glyph) => {
            if (glyph === "我") return "ROAD";
            return GLYPH_TO_TILE[glyph];
          }),
        );
      }

      function pushLog(text, type = "normal") {
        state.logs.push({ text, type });
        if (state.logs.length > 120) state.logs.shift();
      }

      function pushTerminal(prefix, text) {
        state.terminalEntries.push({ prefix, text });
        if (state.terminalEntries.length > 120) state.terminalEntries.shift();
      }

      function getTile(coord) {
        if (!coord || coord.x < 0 || coord.y < 0 || coord.x >= GRID_SIZE || coord.y >= GRID_SIZE) return null;
        return state.tiles[coord.y][coord.x];
      }

      function setTile(coord, tile) {
        state.tiles[coord.y][coord.x] = tile;
      }

      function setTilesToRoad(coords) {
        coords.forEach((coord) => {
          state.tiles[coord.y][coord.x] = "ROAD";
        });
      }

      function currentGatePosts() {
        return state.level === "LEVEL_ONE" ? LEVEL_ONE_GATE_POSTS : LEVEL_TWO_GATE_POSTS;
      }

      function currentExit() {
        return state.level === "LEVEL_ONE" ? LEVEL_ONE_EXIT : LEVEL_TWO_EXIT;
      }

      function frontCoord() {
        const delta = {
          UP: { x: 0, y: -1 },
          DOWN: { x: 0, y: 1 },
          LEFT: { x: -1, y: 0 },
          RIGHT: { x: 1, y: 0 },
        }[state.facing];
        return { x: state.player.x + delta.x, y: state.player.y + delta.y };
      }

      function interactionHint() {
        const front = frontCoord();
        const tile = getTile(front);
        if (["LOCK_BAD", "LOCK_WALL", "TERMINAL_NODE", "BLOCKER", "GATE", "ENEMY_CHAOS"].includes(tile)) {
          return { coord: front, kind: tile };
        }
        return null;
      }

      function resetGame() {
        clearBlockerTimer();
        state.level = "LEVEL_ONE";
        state.mode = "EXPLORE";
        state.player = { ...LEVEL_ONE_START };
        state.facing = "UP";
        state.stats = { ...BASE_STATS };
        state.sp = Math.max(state.sp, 50);
        state.tiles = createMap("LEVEL_ONE");
        state.flags = INITIAL_FLAGS();
        state.dialogue = null;
        state.typingTarget = null;
        state.inputValue = "";
        state.blockerSecondsLeft = null;
        state.logs = [];
        state.terminalEntries = [];
        state.terminalProgress = { hasKun: false, hasPeng: false, solved: false };
        pushLog("你在《字塔》最底层醒来。沿空白路径向上，先去撞见那位“师”。", "system");
        render();
      }

      function startLevelTwo() {
        clearBlockerTimer();
        state.level = "LEVEL_TWO";
        state.mode = "EXPLORE";
        state.player = { ...LEVEL_TWO_START };
        state.facing = "UP";
        state.tiles = createMap("LEVEL_TWO");
        state.typingTarget = null;
        state.dialogue = null;
        state.inputValue = "";
        state.blockerSecondsLeft = null;
        state.terminalEntries = [];
        state.terminalProgress = { hasKun: false, hasPeng: false, solved: false };
        state.flags.badGateOpened = false;
        state.flags.badEnemyDefeated = false;
        state.flags.secondPowerCollected = false;
        state.flags.prisonOpened = false;
        state.flags.secondDefenseCollected = false;
        state.flags.secondWisdomCollected = false;
        state.flags.terminalSolved = false;
        state.flags.blockerCleared = false;
        state.flags.gateOpened = false;
        pushLog("你穿过分裂的「門」，落入第二层「四象乾坤」。", "system");
        render();
      }

      function openGate() {
        currentGatePosts().forEach((coord, index) => {
          setTile(coord, index === 0 ? "GATE_LEFT" : "GATE_RIGHT");
        });
        state.flags.gateOpened = true;
        createBeep();
        pushLog("清脆的回车声划破黑幕，「門」字当场解构为 ｜ ｜。", "system");
      }

      function startDialogue() {
        state.mode = "DIALOGUE";
        state.dialogue = {
          speaker: "师",
          pages: LEVEL_ONE_DIALOGUE,
          index: 0,
        };
        pushLog("你撞上了沉静的「师」，方向键声全部被压成寂静。", "system");
        render();
      }

      function advanceDialogue() {
        if (!state.dialogue) return;
        if (state.dialogue.index < state.dialogue.pages.length - 1) {
          state.dialogue.index += 1;
        } else {
          state.mode = "EXPLORE";
          state.dialogue = null;
          state.flags.masterDialogueDone = true;
          setTile(LEVEL_ONE_REWARD_POWER, "ITEM_POWER");
          setTile(LEVEL_ONE_REWARD_WISDOM, "ITEM_WISDOM");
          pushLog("「师」的身影散成字种，原地留下「力」与「智」。", "system");
        }
        render();
      }

      function resolvePanicEncounter() {
        const crit = Math.random() < state.stats.cri;
        const damage = state.stats.atk + (crit ? 10 : 0);
        const taken = Math.max(1, 8 - state.stats.def);
        pushLog("乱码怪「慌」在封室里扑来，字符碎屑像火星一样乱溅。", "battle");
        pushLog(`你挥出字锋，${crit ? "触发 5% 暴击" : "稳定命中"}，对「慌」造成 ${damage} 点伤害。`, "battle");
        pushLog(`「慌」残余反噬，你损失 ${taken} 点 HP。`, "battle");
        pushLog("红字崩裂，封室重新归于安静。", "battle");
        state.stats.hp = Math.max(0, state.stats.hp - taken);
        state.flags.badEnemyDefeated = true;
        setTile(LEVEL_TWO_BAD_ENEMY, "ROAD");
        if (state.stats.hp <= 0) {
          state.mode = "GAMEOVER";
          pushLog("你的心神在封室内崩散，四象乾坤重新锁死。", "warning");
        }
      }

      function collectTile(tile, coord) {
        if (tile === "ITEM_POWER") {
          state.stats.atk += 3;
          if (state.level === "LEVEL_ONE") state.flags.firstPowerCollected = true;
          if (state.level === "LEVEL_TWO") state.flags.secondPowerCollected = true;
          pushLog("你踩中了「力」，ATK +3。", "system");
        }
        if (tile === "ITEM_GUARD") {
          state.stats.def += 2;
          state.flags.secondDefenseCollected = true;
          pushLog("你拾起了「防」，DEF +2。", "system");
        }
        if (tile === "ITEM_WISDOM") {
          state.sp += 30;
          if (state.level === "LEVEL_ONE") state.flags.firstWisdomCollected = true;
          if (state.level === "LEVEL_TWO") state.flags.secondWisdomCollected = true;
          pushLog("你触碰到「智」，SP +30。", "system");
        }
        setTile(coord, "ROAD");
      }

      function movePlayer(direction) {
        if (state.mode !== "EXPLORE") return;
        state.facing = direction;
        const delta = {
          UP: { x: 0, y: -1 },
          DOWN: { x: 0, y: 1 },
          LEFT: { x: -1, y: 0 },
          RIGHT: { x: 1, y: 0 },
        }[direction];
        const next = { x: state.player.x + delta.x, y: state.player.y + delta.y };
        if (next.x < 0 || next.y < 0 || next.x >= GRID_SIZE || next.y >= GRID_SIZE) {
          render();
          return;
        }
        const tile = getTile(next);

        if (["ROAD", "GATE_LEFT", "GATE_RIGHT"].includes(tile)) {
          state.player = next;
          const exit = currentExit();
          if (state.flags.gateOpened && coordEq(next, exit)) {
            if (state.level === "LEVEL_ONE") {
              startLevelTwo();
              return;
            }
            state.mode = "VICTORY";
            pushLog("你从两道竖线之间穿出，《字塔》双关卡展示厅已经完全贯通。", "system");
          }
          render();
          return;
        }

        if (tile === "NPC_MASTER") {
          startDialogue();
          return;
        }

        if (["ITEM_POWER", "ITEM_GUARD", "ITEM_WISDOM"].includes(tile)) {
          state.player = next;
          collectTile(tile, next);
          render();
          return;
        }

        if (tile === "ENEMY_PANIC") {
          state.player = next;
          resolvePanicEncounter();
          render();
          return;
        }

        if (tile === "ENEMY_CHAOS") {
          pushLog("巨字「乱」如山压落，你无法正面撼动它。", "warning");
        }

        render();
      }

      function enterTerminal() {
        state.mode = "TERMINAL";
        state.inputValue = "";
        state.terminalEntries = [];
        pushTerminal("system", ">>> 接入古籍终端：请依次输入“鲲”和“鹏”，复原第二层密钥。");
        pushTerminal("system", ">>> 输入 exit 可退出终端。");
        pushLog("你把意识接入了青色终端节点「脑」。", "system");
        focusInput();
      }

      function startBlockerChallenge() {
        clearBlockerTimer();
        state.blockerSecondsLeft = BLOCKER_SECONDS;
        blockerTimer = window.setInterval(() => {
          if (state.mode !== "TYPING" || state.typingTarget !== "BLOCKER") {
            clearBlockerTimer();
            return;
          }
          state.blockerSecondsLeft -= 1;
          if (state.blockerSecondsLeft <= 0) {
            clearBlockerTimer();
            state.blockerSecondsLeft = null;
            state.typingTarget = null;
            state.mode = "GAMEOVER";
            pushLog("15 秒警报归零，终关防火墙重启，整座字塔瞬间回卷成黑暗。", "warning");
          }
          render();
        }, 1000);
      }

      function clearBlockerTimer() {
        if (blockerTimer) {
          clearInterval(blockerTimer);
          blockerTimer = null;
        }
      }

      function interactAhead() {
        const hint = interactionHint();
        if (!hint || state.mode !== "EXPLORE") return;

        if (hint.kind === "LOCK_BAD") {
          state.mode = "TYPING";
          state.typingTarget = "BAD_GATE";
          state.inputValue = "";
          pushLog("你锁定了封字「坏」，请输入它的反义词“好”。", "system");
          focusInput();
          render();
          return;
        }

        if (hint.kind === "LOCK_WALL") {
          state.mode = "TYPING";
          state.typingTarget = "PRISON";
          state.inputValue = "";
          pushLog("你锁定了木色字墙「牢」，请输入“穴”以释牛破墙。", "system");
          focusInput();
          render();
          return;
        }

        if (hint.kind === "TERMINAL_NODE") {
          enterTerminal();
          render();
          return;
        }

        if (hint.kind === "BLOCKER") {
          if (!state.flags.terminalSolved) {
            pushLog("阻字在前，但你的脑海里还没有完整密钥。", "warning");
            render();
            return;
          }
          state.mode = "TYPING";
          state.typingTarget = "BLOCKER";
          state.inputValue = "";
          pushLog("红色警报拉响：15 秒内默写“北冥有鱼其名为鲲”。", "warning");
          startBlockerChallenge();
          focusInput();
          render();
          return;
        }

        if (hint.kind === "GATE") {
          if (state.level === "LEVEL_ONE" && !state.flags.masterDialogueDone) {
            pushLog("顶层之門尚未回应。先去听完“师”的话。", "warning");
            render();
            return;
          }
          if (state.level === "LEVEL_TWO" && !state.flags.blockerCleared) {
            pushLog("终层大门仍被“阻”字遮蔽，无法开启。", "warning");
            render();
            return;
          }
          if (!state.flags.gateOpened) {
            openGate();
          }
          render();
          return;
        }

        if (hint.kind === "ENEMY_CHAOS") {
          pushLog("「乱」不可战胜，只能寻找字形漏洞。", "warning");
          render();
        }
      }

      function submitTyping() {
        const normalized = state.inputValue.trim();
        if (!state.typingTarget) return;

        if (state.typingTarget === "BAD_GATE") {
          if (normalized !== BAD_GATE_PASSWORD) {
            pushLog("字义没有反转，“坏”门依旧紧闭。", "warning");
            render();
            return;
          }
          if (state.sp < BAD_GATE_COST) {
            pushLog("SP 不足，无法用反义重写坏门。", "warning");
            render();
            return;
          }
          state.sp -= BAD_GATE_COST;
          setTilesToRoad(LEVEL_TWO_BAD_OPEN);
          state.flags.badGateOpened = true;
          state.mode = "EXPLORE";
          state.typingTarget = null;
          state.player = { ...LEVEL_TWO_BAD_GATE };
          state.inputValue = "";
          pushLog("你写下“好”，“坏”门的逆义锁瞬间崩开。", "system");
          render();
          return;
        }

        if (state.typingTarget === "PRISON") {
          if (normalized !== PRISON_PASSWORD) {
            pushLog("字根不合，牢纹没有松动。", "warning");
            render();
            return;
          }
          if (state.sp < PRISON_COST) {
            pushLog("SP 不足，无法发动「仓颉·字形拆解」。", "warning");
            render();
            return;
          }
          state.sp -= PRISON_COST;
          setTilesToRoad(LEVEL_TWO_PRISON_OPEN);
          state.flags.prisonOpened = true;
          state.mode = "EXPLORE";
          state.typingTarget = null;
          state.player = { ...LEVEL_TWO_PRISON };
          state.inputValue = "";
          pushLog("你写下“穴”，“牢”字裂解，右侧三格墙体一起退成空路。", "system");
          render();
          return;
        }

        if (state.typingTarget === "BLOCKER") {
          if (normalized !== BLOCKER_PASSWORD) {
            pushLog("默写失准，防火墙「阻」仍在高频闪烁。", "warning");
            render();
            return;
          }
          clearBlockerTimer();
          state.blockerSecondsLeft = null;
          state.mode = "EXPLORE";
          state.typingTarget = null;
          state.inputValue = "";
          state.flags.blockerCleared = true;
          setTile(LEVEL_TWO_BLOCKER, "ROAD");
          setTile(LEVEL_TWO_HIDDEN_GATE, "GATE");
          pushLog("密钥完整回响，红色「阻」字熄灭，后方黄色「門」显露出来。", "system");
          render();
        }
      }

      function submitTerminal() {
        const normalized = state.inputValue.trim();
        if (!normalized) return;
        pushTerminal("user", "> " + normalized);

        if (normalized === "exit") {
          pushTerminal("system", ">>> 已退出古籍终端。");
          state.mode = "EXPLORE";
          state.inputValue = "";
          pushLog("你从终端中抽离，密钥仍在脑海里持续回响。", "system");
          render();
          return;
        }

        if (normalized === TERMINAL_COMMANDS[0] && !state.terminalProgress.hasKun) {
          state.terminalProgress.hasKun = true;
          pushTerminal("system", ">>> 北冥残卷已亮起，请继续输入“鹏”。");
          state.inputValue = "";
          render();
          return;
        }

        if (normalized === TERMINAL_COMMANDS[1] && state.terminalProgress.hasKun && !state.terminalProgress.hasPeng) {
          state.terminalProgress.hasPeng = true;
          state.terminalProgress.solved = true;
          state.flags.terminalSolved = true;
          pushTerminal("system", ">>> 古籍复原成功：北冥有鱼其名为鲲");
          pushTerminal("system", ">>> 终关密钥已写入，输入 exit 返回主界面。");
          pushLog("终端成功还原古籍：北冥有鱼其名为鲲。", "system");
          state.inputValue = "";
          render();
          return;
        }

        pushTerminal("system", ">>> 未识别指令，请依次输入“鲲”“鹏”，或使用 exit。");
        state.inputValue = "";
        render();
      }

      function currentPrompt() {
        if (state.mode === "DIALOGUE") return "对话模式中按空格翻页";
        if (state.mode === "TERMINAL") return "输入 鲲 / 鹏 / exit，并按回车";
        if (state.typingTarget === "BAD_GATE") return "输入“好”并按回车";
        if (state.typingTarget === "PRISON") return "输入“穴”并按回车";
        if (state.typingTarget === "BLOCKER") return "15 秒内默写“北冥有鱼其名为鲲”并按回车";
        return "探索模式中输入框只读，使用 WASD / 方向键移动，空格交互";
      }

      function modeLabel() {
        return {
          EXPLORE: "探索",
          DIALOGUE: "对话",
          TYPING: "打字激活",
          TERMINAL: "控制台",
          GAMEOVER: "失败",
          VICTORY: "胜利",
        }[state.mode];
      }

      function tipText() {
        const hint = interactionHint();
        if (state.mode === "DIALOGUE") return "当前只能按空格翻页，方向键已被拦截。";
        if (hint?.kind === "LOCK_BAD") return "面向「坏」按空格后，在底部输入“好”并回车，消耗 30 SP。";
        if (hint?.kind === "LOCK_WALL") return "面向「牢」按空格后，在底部输入“穴”并回车，消耗 50 SP。";
        if (hint?.kind === "BLOCKER") return "面向「阻」按空格后，会启动 15 秒默写挑战。";
        if (hint?.kind === "TERMINAL_NODE") return "面向「脑」按空格切入伪终端。";
        if (hint?.kind === "GATE") return "面向「門」按空格，触发文字解构开门。";
        return "第一关先撞上「师」，第二关沿十字通路依次破解四象机关。";
      }

      function renderGrid() {
        const hint = interactionHint();
        const grid = document.createElement("div");
        grid.className = "grid";
        state.tiles.forEach((row, y) => {
          row.forEach((tile, x) => {
            const cell = document.createElement("div");
            cell.className = "cell";
            if (hint && hint.coord.x === x && hint.coord.y === y) {
              cell.classList.add("hint");
            }

            if (state.player.x === x && state.player.y === y) {
              const span = document.createElement("span");
              span.className = "player";
              span.textContent = "我";
              cell.appendChild(span);
            } else {
              const meta = TILE_META[tile];
              const span = document.createElement("span");
              span.className = meta.className;
              span.textContent = meta.char;
              cell.appendChild(span);
            }
            grid.appendChild(cell);
          });
        });
        leftPanel.innerHTML = "";
        leftPanel.appendChild(grid);
      }

      function renderTerminal() {
        leftPanel.innerHTML = `
          <div class="terminal-panel">
            <h2>TERMINAL</h2>
            <div class="terminal-window" id="terminal-window"></div>
          </div>
        `;
        const terminalWindow = document.getElementById("terminal-window");
        terminalWindow.innerHTML = state.terminalEntries
          .map((entry) => `<div>${escapeHtml(entry.text)}</div>`)
          .join("");
        terminalWindow.scrollTop = terminalWindow.scrollHeight;
      }

      function renderStatus() {
        const hint = interactionHint();
        statusPanel.innerHTML = `
          <h2>角色面板</h2>
          <div class="stats-grid">
            <div class="stat-card">HP: ${state.stats.hp}</div>
            <div class="stat-card">ATK: ${state.stats.atk}</div>
            <div class="stat-card">DEF: ${state.stats.def}</div>
            <div class="stat-card">CRI: ${Math.round(state.stats.cri * 100)}%</div>
            <div class="stat-card" style="grid-column: 1 / -1;">SP: ${state.sp}</div>
          </div>
          <div class="status-card">
            <div>模式：${modeLabel()}</div>
            <div>朝向：${state.facing}</div>
            <div>面前目标：${hint ? hint.kind : "无"}</div>
            <div>倒计时：${state.blockerSecondsLeft ?? "--"}</div>
          </div>
          <h3 style="margin-top: 18px;">技能卡</h3>
          <div class="skill-card">
            <div class="skill-name">[1] 仓颉·字形拆解</div>
            <div>消耗 50 SP - 释牛破牢</div>
            <div>${state.sp >= 50 ? "墨意充盈，可直接拆开「牢」字。" : "墨意值不足，先点击顶部按钮补充 SP。"}</div>
          </div>
          <div class="tip-card">提示：${tipText()}</div>
        `;
      }

      function renderLogs() {
        logList.innerHTML = state.logs
          .map((entry) => `<div class="log-${entry.type}">${escapeHtml(entry.text)}</div>`)
          .join("");
        logList.scrollTop = logList.scrollHeight;
      }

      function renderDialogue() {
        if (state.mode === "DIALOGUE" && state.dialogue) {
          dialogueNode.classList.add("show");
          dialogueSpeaker.textContent = state.dialogue.speaker;
          dialogueText.textContent = state.dialogue.pages[state.dialogue.index];
        } else {
          dialogueNode.classList.remove("show");
        }
      }

      function renderOverlay() {
        if (state.mode === "GAMEOVER" || state.mode === "VICTORY") {
          overlay.classList.add("show");
          overlayTitle.textContent = state.mode === "VICTORY" ? "VICTORY" : "GAME OVER";
          overlayText.textContent =
            state.mode === "VICTORY"
              ? "你穿过「門」解构出的两道竖线，双关卡展示厅已被完整重构。"
              : "字塔暂时将你吞没，但文字系统仍允许你再次尝试。";
        } else {
          overlay.classList.remove("show");
        }
      }

      function focusInput() {
        window.setTimeout(() => {
          commandInput.focus();
        }, 0);
      }

      function escapeHtml(text) {
        return String(text)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function render() {
        titleNode.textContent = LEVEL_TITLES[state.level];
        app.classList.toggle("alert", state.mode === "TYPING" && state.typingTarget === "BLOCKER" && state.blockerSecondsLeft !== null);
        if (state.mode === "TERMINAL") {
          renderTerminal();
        } else {
          renderGrid();
        }
        renderStatus();
        renderLogs();
        renderDialogue();
        renderOverlay();
        commandInput.value = state.inputValue;
        commandInput.readOnly = ["EXPLORE", "DIALOGUE", "GAMEOVER", "VICTORY"].includes(state.mode);
        promptNode.textContent = currentPrompt();
      }

      commandInput.addEventListener("input", (event) => {
        state.inputValue = event.target.value;
      });

      commandInput.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        if (state.mode === "TYPING") {
          submitTyping();
          return;
        }
        if (state.mode === "TERMINAL") {
          submitTerminal();
        }
      });

      practiceBtn.addEventListener("click", () => {
        state.sp += 20;
        pushLog("你模拟完成了一轮站外练字，SP +20。", "system");
        render();
      });

      restartBtn.addEventListener("click", () => {
        resetGame();
      });

      window.addEventListener("keydown", (event) => {
        if (event.metaKey || event.ctrlKey || event.altKey) return;

        if (state.mode === "DIALOGUE") {
          if (event.key === " ") {
            event.preventDefault();
            advanceDialogue();
          }
          return;
        }

        if (state.mode !== "EXPLORE") return;

        const key = event.key.toLowerCase();
        if (key === "w" || event.key === "ArrowUp") {
          event.preventDefault();
          movePlayer("UP");
        } else if (key === "s" || event.key === "ArrowDown") {
          event.preventDefault();
          movePlayer("DOWN");
        } else if (key === "a" || event.key === "ArrowLeft") {
          event.preventDefault();
          movePlayer("LEFT");
        } else if (key === "d" || event.key === "ArrowRight") {
          event.preventDefault();
          movePlayer("RIGHT");
        } else if (event.key === " ") {
          event.preventDefault();
          interactAhead();
        }
      });

      resetGame();
    </script>
  </body>
</html>
