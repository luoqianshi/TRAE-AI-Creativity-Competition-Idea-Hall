<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>回声相片 · 与图片对话</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    color: #f3eee6; background: #0a0a12;
    user-select: none;
  }
  body {
    background:
      radial-gradient(1200px 800px at 20% 10%, rgba(180, 130, 90, 0.18), transparent 60%),
      radial-gradient(1000px 700px at 80% 90%, rgba(110, 120, 180, 0.18), transparent 60%),
      linear-gradient(180deg, #0b0a14 0%, #07060d 100%);
  }
  #app { position: relative; width: 100vw; height: 100vh; }

  /* ====== Top bar ====== */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 12px;
    z-index: 50;
    background: linear-gradient(180deg, rgba(10,10,18,0.7), rgba(10,10,18,0));
    backdrop-filter: blur(8px);
  }
  .title {
    font-size: 16px; letter-spacing: 1px; font-weight: 500;
    color: #efe6d6; opacity: 0.95;
  }
  .title small { display:block; font-size: 11px; opacity: 0.55; letter-spacing: 2px; margin-top: 2px;}

  /* Center demo notice — pinned to the topbar center.
     Subtle pill so it doesn't compete with title or actions. */
  .demo-notice {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 11px;
    line-height: 1;
    color: rgba(239,230,214,0.78);
    background: rgba(255,210,140,0.08);
    border: 1px solid rgba(255,210,140,0.18);
    backdrop-filter: blur(8px);
    letter-spacing: 0.3px;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
  }
  .demo-notice .ico {
    width: 12px; height: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    color: rgba(255,210,140,0.95);
    flex: 0 0 12px;
  }
  .demo-notice .ico svg { width: 12px; height: 12px; }
  .demo-notice strong {
    color: rgba(255,210,140,0.95);
    font-weight: 600;
    margin-right: 2px;
  }
  .demo-notice .dot {
    width: 3px; height: 3px; border-radius: 50%;
    background: rgba(255,210,140,0.5);
    display: inline-block;
  }
  /* On narrow screens, keep only the badge + icon so the layout
     still breathes — the full sentence is moved into the title attr. */
  @media (max-width: 520px) {
    .demo-notice { padding: 4px 9px; font-size: 10px; gap: 4px; }
    .demo-notice .full { display: none; }
    .demo-notice .dot { display: none; }
  }
  .actions { display: flex; gap: 10px; }
  .btn {
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06);
    color: #efe6d6;
    padding: 8px 14px; border-radius: 999px; font-size: 12px; cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(6px);
  }
  .btn:hover { background: rgba(255,255,255,0.14); transform: translateY(-1px); }
  .btn.primary { background: linear-gradient(135deg, #d6a47a, #b67a55); border-color: transparent; color: #1a1208; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ====== Stage (3D canvas) ====== */
  #stage {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1;
  }
  .stage-empty {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 5; pointer-events: none;
  }
  .stage-empty .hint {
    text-align: center; opacity: 0.6; font-size: 13px; line-height: 1.8;
    margin-bottom: 18px; max-width: 280px;
  }
  .upload-btn {
    pointer-events: auto;
    padding: 12px 22px; border-radius: 999px;
    background: linear-gradient(135deg, #d6a47a, #b67a55);
    color: #1a1208; font-size: 14px; font-weight: 600; cursor: pointer;
    border: none; box-shadow: 0 8px 24px rgba(182,122,85,0.35);
  }
  .upload-btn:hover { filter: brightness(1.1); }
  .upload-input { display: none; }

  /* Stage vignette overlay (visual soft mask) */
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at center, transparent 75%, rgba(0,0,0,0.18) 100%);
    mix-blend-mode: multiply;
  }

  /* Stage controls hint */
  .stage-hint {
    position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%);
    font-size: 11px; opacity: 0.5; z-index: 10; letter-spacing: 1px;
    text-align: center;
  }

  /* ====== Chat panel (bottom) ====== */
  .chat {
    position: absolute; left: 0; right: 0; bottom: 0;
    z-index: 20;
    padding: 14px 14px 26px;
    background: linear-gradient(180deg, rgba(10,10,18,0) 0%, rgba(10,10,18,0.65) 40%, rgba(10,10,18,0.85) 100%);
  }
  .messages {
    display: flex; flex-direction: column; gap: 10px;
    max-height: 200px; overflow-y: auto;
    margin-bottom: 10px; padding: 0 6px;
    scrollbar-width: thin;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

  .msg {
    max-width: 78%; padding: 10px 14px; border-radius: 18px;
    font-size: 14px; line-height: 1.55;
    word-break: break-word;
    animation: fadeIn 0.3s ease;
    backdrop-filter: blur(6px);
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #d6a47a, #b67a55);
    color: #1a1208;
    border-bottom-right-radius: 6px;
  }
  .msg.bot {
    align-self: flex-start;
    background: rgba(255,255,255,0.08);
    color: #f3eee6;
    border: 1px solid rgba(255,255,255,0.08);
    border-bottom-left-radius: 6px;
  }
  .msg .meta { display: block; font-size: 10px; opacity: 0.6; margin-top: 4px; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(6px);} to {opacity:1; transform:none;} }

  /* ====== Input row (voice-first design) ======
     Default mode: large "hold to talk" pill (primary).
     Text input is hidden behind a small keyboard icon — deliberately
     de-emphasized so the default action is always voice. */
  .input-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 6px 6px 6px;
    position: relative;
  }

  /* Primary "hold to talk" button — the visual hero of the bottom bar */
  .hold-to-talk {
    flex: 1;
    height: 52px;
    border: none; cursor: pointer;
    border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    background: linear-gradient(135deg, #e6b890 0%, #c08560 100%);
    color: #1a1208;
    font-size: 15px; font-weight: 600;
    letter-spacing: 2px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    position: relative;
    box-shadow:
      0 8px 24px rgba(214,164,122,0.45),
      0 0 0 4px rgba(214,164,122,0.10),
      inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform 0.12s, box-shadow 0.2s, filter 0.2s;
    /* Subtle ambient pulse to draw the eye */
    animation: hovGlow 3.2s ease-in-out infinite;
  }
  @keyframes hovGlow {
    0%,100% { box-shadow: 0 8px 24px rgba(214,164,122,0.45), 0 0 0 4px rgba(214,164,122,0.10), inset 0 1px 0 rgba(255,255,255,0.25); }
    50%     { box-shadow: 0 8px 28px rgba(214,164,122,0.65), 0 0 0 8px rgba(214,164,122,0.06), inset 0 1px 0 rgba(255,255,255,0.25); }
  }
  .hold-to-talk:active { transform: scale(0.985); filter: brightness(0.96); }
  .hold-to-talk.recording { animation: hovPress 1.0s ease-in-out infinite; }
  @keyframes hovPress {
    0%,100% { box-shadow: 0 4px 14px rgba(214,164,122,0.6), 0 0 0 6px rgba(214,164,122,0.18), inset 0 1px 0 rgba(255,255,255,0.25); transform: scale(0.99); }
    50%     { box-shadow: 0 4px 20px rgba(214,164,122,0.95), 0 0 0 14px rgba(214,164,122,0.04), inset 0 1px 0 rgba(255,255,255,0.25); transform: scale(0.99); }
  }
  .hold-to-talk svg { width: 18px; height: 18px; }
  .hold-to-talk .ht-label { font-size: 15px; }

  /* Small mode toggle in the corner — low visual weight on purpose */
  .mode-toggle {
    width: 44px; height: 44px; flex: 0 0 44px;
    border: none; cursor: pointer;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    color: rgba(243,238,230,0.45);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, color 0.2s, transform 0.12s;
  }
  .mode-toggle:hover { background: rgba(255,255,255,0.10); color: rgba(243,238,230,0.75); }
  .mode-toggle:active { transform: scale(0.92); }
  .mode-toggle svg { width: 18px; height: 18px; }

  /* Text-mode input row — only shown when user explicitly switches to typing */
  .text-mode {
    flex: 1;
    display: none;
    align-items: center; gap: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 999px;
    padding: 4px 6px 4px 16px;
    height: 44px;
    min-width: 0;
  }
  .input-row.text-mode-on .hold-to-talk { display: none; }
  .input-row.text-mode-on .text-mode { display: flex; }
  .input-row.text-mode-on .mode-toggle { color: #d6a47a; background: rgba(214,164,122,0.10); }

  .text-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #f3eee6; font-size: 14px; padding: 6px 4px;
    min-width: 0;
  }
  .text-input::placeholder { color: rgba(243,238,230,0.35); }

  .send-btn {
    border: none; cursor: pointer; width: 32px; height: 32px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #d6a47a, #b67a55); color: #1a1208;
    transition: transform 0.15s, filter 0.2s;
  }
  .send-btn:hover { filter: brightness(1.08); }
  .send-btn:active { transform: scale(0.92); }

  /* ====== Recording overlay (WeChat-like) ====== */
  .recording-mask {
    position: fixed; inset: 0; z-index: 100;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.4);
  }
  .recording-mask.show { display: flex; }
  .recording-card {
    width: 200px; height: 200px; border-radius: 24px;
    background: rgba(20,20,28,0.85);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
  }
  .recording-card .icon {
    width: 80px; height: 80px; border-radius: 50%;
    background: linear-gradient(135deg, #d6a47a, #b67a55);
    display: flex; align-items: center; justify-content: center;
    color: #1a1208; margin-bottom: 14px;
    position: relative;
  }
  .recording-card .icon::before, .recording-card .icon::after {
    content: ''; position: absolute; inset: -8px;
    border-radius: 50%; border: 2px solid rgba(214,164,122,0.5);
    animation: ring 1.2s infinite;
  }
  .recording-card .icon::after { animation-delay: 0.6s; }
  @keyframes ring {
    0% { transform: scale(0.8); opacity: 0.8; }
    100% { transform: scale(1.4); opacity: 0; }
  }
  .recording-card .label { font-size: 14px; color: #f3eee6; }
  .recording-card .timer { font-size: 22px; font-weight: 600; margin-top: 4px; color: #d6a47a; font-variant-numeric: tabular-nums;}
  .recording-mask.cancel .recording-card { background: rgba(120, 40, 40, 0.85); }
  .recording-mask.cancel .recording-card .icon { background: #aa3333; color: #fff; }
  .recording-mask.cancel .recording-card .label::after {
    content: '松开取消发送'; display: block; font-size: 12px; margin-top: 4px; color: #f3eee6;
  }
  .recording-mask.cancel .recording-card .label { font-size: 0; }
  .recording-mask.cancel .recording-card .timer { display: none; }

  .toast-hint {
    position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: rgba(243,238,230,0.55); z-index: 10;
    letter-spacing: 1px; text-align: center;
    pointer-events: none;
  }

  /* ====== Diary modal ====== */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 200; display: none; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
  }
  .modal-mask.show { display: flex; }
  .modal {
    width: 92%; max-width: 480px; max-height: 80vh;
    background: linear-gradient(180deg, #1a1620, #100c14);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px; padding: 24px 22px;
    overflow-y: auto;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  .modal h2 {
    margin: 0 0 4px; font-size: 20px; color: #efe6d6; font-weight: 600;
    letter-spacing: 1px;
  }
  .modal .date { font-size: 12px; color: #b67a55; margin-bottom: 18px; letter-spacing: 1px;}
  .modal .diary-body {
    font-size: 15px; line-height: 1.9; color: #d8d0c2;
    white-space: pre-wrap;
  }
  .modal .close-btn {
    margin-top: 22px; width: 100%;
  }
  .typing { display: inline-block; }
  .typing::after { content: '...'; animation: dots 1s infinite; }
  @keyframes dots { 0%,20%{content:'.';} 40%{content:'..';} 60%,100%{content:'...';} }
</style>
</head>
<body>
<div id="app">
  <!-- top bar -->
  <div class="topbar">
    <div class="title">粒子日记<small>CHAT · WITH · YOUR · PHOTO</small></div>
    <div class="demo-notice" title="当前为演示版本，语音转写与 AI 回复均为模拟数据">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <line x1="12" y1="8" x2="12" y2="13"/>
          <line x1="12" y1="16.5" x2="12" y2="16.5"/>
        </svg>
      </span>
      <strong>Demo</strong>
      <span class="dot"></span>
      <span class="full">语音 / 对话均为模拟数据</span>
    </div>
    <div class="actions">
      <button class="btn" id="reuploadBtn" style="display:none">换张图</button>
      <button class="btn primary" id="genDiaryBtn" disabled>生成日记</button>
    </div>
  </div>

  <!-- 3D stage -->
  <div id="stage"></div>
  <div class="vignette"></div>

  <!-- empty state -->
  <div class="stage-empty" id="emptyState">
    <div class="hint">上传一张照片<br/>我把它变成温柔的光点，听你说说今天的故事</div>
    <button class="upload-btn" id="uploadTrigger">选择图片</button>
    <input type="file" accept="image/*" class="upload-input" id="fileInput" />
  </div>

  <div class="stage-hint" id="stageHint" style="display:none">拖动旋转 · 滚轮缩放</div>

  <!-- Chat -->
  <div class="chat">
    <div class="messages" id="messages"></div>
    <div class="toast-hint">长按录音 · 上滑取消 · 右侧切换文字</div>
    <div class="input-row" id="inputRow">
      <!-- Primary: hold to talk (default) -->
      <button class="hold-to-talk" id="micBtn" title="长按录音">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
        <span class="ht-label">按住 说话</span>
      </button>

      <!-- Secondary: explicit switch to text input -->
      <button class="mode-toggle" id="modeToggle" title="切换到文字输入" aria-label="切换输入方式">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2.5"/>
          <line x1="7" y1="9" x2="17" y2="9"/>
          <line x1="7" y1="13" x2="13" y2="13"/>
        </svg>
      </button>

      <!-- Text mode (hidden by default, shown only after explicit toggle) -->
      <div class="text-mode">
        <input class="text-input" id="textInput" placeholder="说点什么吧…" />
        <button class="send-btn" id="sendBtn" title="发送">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Recording overlay -->
  <div class="recording-mask" id="recMask">
    <div class="recording-card">
      <div class="icon">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </div>
      <div class="label">正在录音…</div>
      <div class="timer" id="recTimer">00:00</div>
    </div>
  </div>

  <!-- Diary modal -->
  <div class="modal-mask" id="diaryModal">
    <div class="modal">
      <h2 id="diaryTitle">今日小记</h2>
      <div class="date" id="diaryDate"></div>
      <div class="diary-body" id="diaryBody"></div>
      <button class="btn primary close-btn" id="closeDiary">收下啦</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   3D particle stage
   ========================================================= */
const stage = document.getElementById('stage');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 50);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
stage.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 12;
controls.maxDistance = 120;
controls.enablePan = false;
controls.autoRotate = false; // we animate the group itself, not the camera

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let particles = null;
let particleGroup = null;
let basePositions = null;   // for subtle animation
let randoms = null;
let clock = new THREE.Clock();

function disposeParticles() {
  if (particleGroup) {
    scene.remove(particleGroup);
    particleGroup.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) obj.material.dispose();
    });
  }
  particles = null;
  particleGroup = null;
  basePositions = null;
  randoms = null;
}

function buildParticlesFromImage(img) {
  disposeParticles();

  // Render image to canvas to sample pixel data
  const maxSide = 260; // particle count control
  const ratio = img.width / img.height;
  let cw, ch;
  if (ratio >= 1) { cw = maxSide; ch = Math.round(maxSide / ratio); }
  else            { ch = maxSide; cw = Math.round(maxSide * ratio); }

  const cvs = document.createElement('canvas');
  cvs.width = cw; cvs.height = ch;
  const ctx = cvs.getContext('2d');
  ctx.drawImage(img, 0, 0, cw, ch);
  const data = ctx.getImageData(0, 0, cw, ch).data;

  // World plane size (the photo "card" extent)
  const planeW = 24;
  const planeH = planeW * (ch / cw);

  const positions = [];
  const colors = [];
  const sizes = [];
  const alphas = [];

  // Rounded rect mask + vignette helpers
  // Normalized coord in [-1, 1] for the photo plane
  const radiusNorm = 0.12;            // corner roundness (relative to min side)
  const vignetteStrength = 0.55;      // very gentle vignette
  const vignetteSoftness = 0.5;       // higher = softer falloff

  function roundedMask(nx, ny) {
    // distance to nearest corner, then signed distance to rounded rect edge
    const ax = Math.abs(nx), ay = Math.abs(ny);
    const r = radiusNorm;
    const dx = Math.max(ax - (1 - r), 0);
    const dy = Math.max(ay - (1 - r), 0);
    const distToCorner = Math.sqrt(dx*dx + dy*dy);
    const edgeDist = distToCorner - r; // <0 inside, >0 outside
    // smooth alpha
    return 1 - Math.min(1, Math.max(0, edgeDist / 0.02));
  }

  function vignette(nx, ny) {
    const r = Math.sqrt(nx*nx + ny*ny);
    return 1 - Math.min(1, Math.pow(r * vignetteStrength, vignetteSoftness * 4));
  }

  // Pre-compute smoothed brightness for emboss depth map.
  // A small box-blur gives the relief a softer, more sculptural feel
  // (raw pixel brightness looks noisy when used as height).
  const depthField = new Float32Array(cw * ch);
  const blurR = 2;
  for (let y = 0; y < ch; y++) {
    for (let x = 0; x < cw; x++) {
      let sum = 0, count = 0;
      const y0 = Math.max(0, y - blurR), y1 = Math.min(ch - 1, y + blurR);
      const x0 = Math.max(0, x - blurR), x1 = Math.min(cw - 1, x + blurR);
      for (let ny = y0; ny <= y1; ny++) {
        for (let nx2 = x0; nx2 <= x1; nx2++) {
          const i2 = (ny * cw + nx2) * 4;
          sum += (data[i2] + data[i2+1] + data[i2+2]) / 3;
          count++;
        }
      }
      depthField[y * cw + x] = sum / count;
    }
  }
  const DEPTH_AMOUNT = 2.2; // total Z relief range (±) in world units

  const step = 1; // sample every pixel
  for (let y = 0; y < ch; y += step) {
    for (let x = 0; x < cw; x += step) {
      const i = (y * cw + x) * 4;
      const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
      // Skip only near-transparent / pitch-black pixels
      const brightness = (r + g + b) / 3;
      if (brightness < 6 && a < 20) continue;

      const nx = (x / (cw - 1)) * 2 - 1;  // -1..1
      const ny = -((y / (ch - 1)) * 2 - 1); // -1..1 (flip Y)

      const mask = roundedMask(nx, ny);
      if (mask <= 0.01) continue;

      const vig = vignette(nx, ny);
      // Moderate alpha — additive blending naturally brightens on overlap,
      // and we keep the original color ratios intact.
      const finalA = mask * (0.55 + 0.30 * vig);

      const px = nx * planeW / 2;
      const py = ny * planeH / 2;

      // Emboss depth: bright areas of the photo pop out toward the viewer,
      // dark areas recede. We sample the smoothed brightness field and
      // remap to a signed value, then apply a soft gamma curve for a
      // gentle, sculptural feel rather than a harsh step.
      const tDepth = depthField[y * cw + x] / 255;       // 0..1
      const signed = (tDepth - 0.5) * 2;                  // -1..1
      const curved = Math.sign(signed) * Math.pow(Math.abs(signed), 0.7);
      const pz = curved * DEPTH_AMOUNT;

      positions.push(px, py, pz);
      // Keep original color faithfully — DO NOT boost, that crushes hue
      // into white when additive blending stacks overlapping particles.
      colors.push(r / 255, g / 255, b / 255);
      // Make each particle larger so it reads as a luminous point
      // rather than a dim speck.
      const sizeBase = 0.18 + (brightness / 255) * 0.42;
      sizes.push(sizeBase);
      alphas.push(finalA);
    }
  }

  const count = positions.length / 3;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setAttribute('aSize',  new THREE.Float32BufferAttribute(sizes, 1));
  geo.setAttribute('aAlpha', new THREE.Float32BufferAttribute(alphas, 1));

  // Per-particle random phase for very subtle individual drift.
  // Amplitude is small so the image doesn't look like a swarm of
  // buzzing insects, but particles do "breathe" individually, which
  // gives the whole field a natural, fluid, living feel.
  const rand = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    rand[i*3+0] = Math.random();
    rand[i*3+1] = Math.random();
    rand[i*3+2] = Math.random();
  }
  geo.setAttribute('aRand', new THREE.Float32BufferAttribute(rand, 3));

  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      attribute float aSize;
      attribute float aAlpha;
      attribute vec3 aRand;
      varying vec3 vColor;
      varying float vAlpha;
      uniform float uTime;
      uniform float uPxRatio;
      void main() {
        vColor = color;
        vAlpha = aAlpha;
        // Very gentle per-particle drift — small amplitude + slow frequency.
        // Layered on top of the whole-group motion in tick(), this gives
        // the particle field an organic, breathing feel without looking
        // dense and noisy.
        vec3 pos = position;
        float t = uTime * 0.35;
        pos.x += sin(t + aRand.x * 6.2831) * 0.022;
        pos.y += cos(t * 0.9 + aRand.y * 6.2831) * 0.022;
        pos.z += sin(t * 0.7 + aRand.z * 6.2831) * 0.014;
        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = aSize * 320.0 * uPxRatio / -mvPosition.z;
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        vec2 c = gl_PointCoord - vec2(0.5);
        float d = length(c);
        if (d > 0.5) discard;
        // Soft circular falloff — original color preserved,
        // brightness comes from additive overlap, not color clamping.
        float core = smoothstep(0.5, 0.0, d);
        gl_FragColor = vec4(vColor, core * vAlpha);
      }
    `,
    vertexColors: true,
    uniforms: {
      uTime: { value: 0 },
      uPxRatio: { value: renderer.getPixelRatio() }
    }
  });

  particles = new THREE.Points(geo, mat);
  particleGroup = particles;
  basePositions = geo.getAttribute('position').array.slice();
  scene.add(particleGroup);

  // Reset camera angle slightly to a nice 3/4 view
  camera.position.set(0, 4, 48);
  controls.target.set(0, 0, 0);
  controls.update();
}

function tick() {
  const t = clock.getElapsedTime();
  if (particles) {
    particles.material.uniforms.uTime.value = t;
  }
  if (particleGroup) {
    // Whole-image motion: gentle Y rotation, slow Y float, slight Z tilt, subtle breathing scale.
    particleGroup.rotation.y = Math.sin(t * 0.15) * 0.45;
    particleGroup.rotation.z = Math.sin(t * 0.12 + 0.5) * 0.08;
    particleGroup.position.y = Math.sin(t * 0.4) * 0.6;
    const breathe = 1 + Math.sin(t * 0.5) * 0.025;
    particleGroup.scale.set(breathe, breathe, breathe);
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

/* =========================================================
   Image upload
   ========================================================= */
const fileInput = document.getElementById('fileInput');
const uploadTrigger = document.getElementById('uploadTrigger');
const emptyState = document.getElementById('emptyState');
const reuploadBtn = document.getElementById('reuploadBtn');
const stageHint = document.getElementById('stageHint');
const genDiaryBtn = document.getElementById('genDiaryBtn');

uploadTrigger.addEventListener('click', () => fileInput.click());
reuploadBtn.addEventListener('click', () => fileInput.click());

let imageUploaded = false;
fileInput.addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      buildParticlesFromImage(img);
      emptyState.style.display = 'none';
      reuploadBtn.style.display = 'inline-block';
      stageHint.style.display = 'block';
      imageUploaded = true;
      // greet the user once an image is loaded
      if (!state.hasGreeted) {
        state.hasGreeted = true;
        addBotMessage('看到你上传的照片了，氛围好棒。跟我说说今天的心情吧？');
      }
      checkDiaryEnabled();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(f);
});

/* =========================================================
   Chat state
   ========================================================= */
const messagesEl = document.getElementById('messages');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const modeToggle = document.getElementById('modeToggle');
const inputRow = document.getElementById('inputRow');

const state = {
  userMessages: [],   // strings user has sent
  botMessages: [],
  hasGreeted: false,
};

function addMessage(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + (who === 'user' ? 'user' : 'bot');
  div.innerHTML = text + `<span class="meta">${who === 'user' ? '我' : 'TA'} · ${formatTime()}</span>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  if (who === 'user') state.userMessages.push(text);
  else state.botMessages.push(text);
  checkDiaryEnabled();
}

function addBotMessage(text) {
  addMessage(text, 'bot');
}

function formatTime() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function checkDiaryEnabled() {
  // Need an image + at least 1 user message
  if (imageUploaded && state.userMessages.length >= 1) {
    genDiaryBtn.disabled = false;
  } else {
    genDiaryBtn.disabled = true;
  }
}

/* =========================================================
   Mock LLM (friend persona)
   ========================================================= */
const mockReplies = [
  '嗯嗯，听你说这些，我也跟着放松下来了呢。',
  '这种时刻很珍贵呀，能感受到你心情在慢慢变好。',
  '我也好想去那种地方待一下午！',
  '能从照片里感觉到那会儿的光线，温柔得不像话。',
  '能这样安安静静地待着，本身就已经很好了。',
  '你有没有想过，等以后老了回头看，会记得今天的哪一帧？',
  '我懂你这种感觉，嘴上说没事，心里其实有点小委屈吧。',
  '你拍下的这一张，是想留给以后的自己看吗？',
  '听起来你今天照顾了自己一下，我替你开心。',
  '那我们就一起，把这短短几秒的好心情收进口袋里吧。'
];

function mockLLMReply(userText) {
  // Pick deterministically-ish based on user text length & content
  if (!userText) return mockReplies[0];
  const idx = Math.abs(hashStr(userText)) % mockReplies.length;
  return mockReplies[idx];
}
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = (h << 5) - h + s.charCodeAt(i);
    h |= 0;
  }
  return h;
}

function sendUserMessage(text) {
  if (!text || !text.trim()) return;
  if (!imageUploaded) {
    addBotMessage('先上传一张照片吧，我才能陪你一起聊聊呀～');
    return;
  }
  addMessage(text.trim(), 'user');
  textInput.value = '';
  // typing indicator
  const typing = document.createElement('div');
  typing.className = 'msg bot typing';
  typing.textContent = '正在输入';
  messagesEl.appendChild(typing);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  setTimeout(() => {
    typing.remove();
    addBotMessage(mockLLMReply(text));
  }, 700 + Math.random() * 600);
}

sendBtn.addEventListener('click', () => {
  if (textInput.value && textInput.value.trim()) {
    sendUserMessage(textInput.value);
    setTimeout(() => setInputMode('voice'), 250);
  }
});
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && textInput.value && textInput.value.trim()) {
    sendUserMessage(textInput.value);
    setTimeout(() => setInputMode('voice'), 250);
  }
});

/* Mode toggle: voice <-> text
   Default is voice (hold-to-talk). User has to tap the small keyboard
   icon to switch to text. This deliberately biases the default path
   toward voice, which fits the "chat with a photo" use case better. */
function setInputMode(mode) {
  if (mode === 'text') {
    inputRow.classList.add('text-mode-on');
    modeToggle.title = '切换到语音输入';
    // Update toggle icon to a mic shape (so user can switch back)
    modeToggle.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10a7 7 0 0 0 14 0"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
      </svg>`;
    setTimeout(() => textInput.focus(), 50);
  } else {
    inputRow.classList.remove('text-mode-on');
    modeToggle.title = '切换到文字输入';
    // Restore keyboard icon
    modeToggle.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2.5"/>
        <line x1="7" y1="9" x2="17" y2="9"/>
        <line x1="7" y1="13" x2="13" y2="13"/>
      </svg>`;
  }
}
modeToggle.addEventListener('click', () => {
  setInputMode(inputRow.classList.contains('text-mode-on') ? 'voice' : 'text');
});

/* =========================================================
   Voice recording (long press, slide up to cancel) — MOCK
   ========================================================= */
const recMask = document.getElementById('recMask');
const recTimer = document.getElementById('recTimer');
let recStartTime = 0;
let recTimerInterval = null;
let isRecording = false;
let isCanceled = false;
let recStartY = 0;
let recStartX = 0;
const CANCEL_THRESHOLD = 80; // px

const mockVoiceTexts = [
  '今天拍到这张照片的时候心情意外地平静。',
  '我有点想你了，这张是路过老地方时拍的。',
  '今天天气很好，但是有点累。',
  '今天的我好像比昨天温柔了一点点。',
  '我刚把阳台的花浇了水，拍了张照给你。',
  '没什么特别的事，就是想跟你说一句晚安。',
  '我终于完成了拖了好久的那件事，开心。',
  '今天有点想家了，看到这张照片鼻子酸酸的。'
];

function formatTimer(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function startRecording(e) {
  if (isRecording) return;
  e.preventDefault();
  isRecording = true;
  isCanceled = false;
  recStartTime = Date.now();
  recMask.classList.remove('cancel');
  recMask.classList.add('show');
  micBtn.classList.add('recording');
  recTimer.textContent = '00:00';
  recTimerInterval = setInterval(() => {
    const sec = Math.floor((Date.now() - recStartTime) / 1000);
    recTimer.textContent = formatTimer(sec);
  }, 200);
  if (e.touches) {
    recStartX = e.touches[0].clientX;
    recStartY = e.touches[0].clientY;
  } else {
    recStartX = e.clientX;
    recStartY = e.clientY;
  }
}
function moveRecording(e) {
  if (!isRecording) return;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const dy = recStartY - y;
  if (dy > CANCEL_THRESHOLD || Math.abs(recStartX - x) > 120) {
    if (!isCanceled) {
      isCanceled = true;
      recMask.classList.add('cancel');
    }
  } else {
    if (isCanceled) {
      isCanceled = false;
      recMask.classList.remove('cancel');
    }
  }
}
function endRecording() {
  if (!isRecording) return;
  isRecording = false;
  micBtn.classList.remove('recording');
  clearInterval(recTimerInterval);
  recMask.classList.remove('show');
  recMask.classList.remove('cancel');
  if (isCanceled) return;
  // Mock: pick a random preset voice->text content
  const idx = Math.floor(Math.random() * mockVoiceTexts.length);
  const text = mockVoiceTexts[idx];
  sendUserMessage(text);
}

micBtn.addEventListener('mousedown', startRecording);
micBtn.addEventListener('touchstart', startRecording, { passive: false });
window.addEventListener('mousemove', moveRecording);
window.addEventListener('touchmove', moveRecording, { passive: true });
window.addEventListener('mouseup', endRecording);
window.addEventListener('touchend', endRecording);
window.addEventListener('mouseleave', endRecording);

/* =========================================================
   Diary generation
   ========================================================= */
const diaryModal = document.getElementById('diaryModal');
const diaryBody = document.getElementById('diaryBody');
const diaryDate = document.getElementById('diaryDate');
const closeDiary = document.getElementById('closeDiary');

genDiaryBtn.addEventListener('click', () => {
  if (!imageUploaded) return;
  if (state.userMessages.length < 1) return;
  const text = composeDiary();
  diaryBody.textContent = '';
  diaryBody.classList.add('typing');
  const d = new Date();
  diaryDate.textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · ${weekday(d)}`;
  diaryModal.classList.add('show');
  // type out effect
  setTimeout(() => {
    diaryBody.classList.remove('typing');
    let i = 0;
    const id = setInterval(() => {
      diaryBody.textContent = text.slice(0, i);
      i += 2;
      if (i >= text.length) {
        clearInterval(id);
        diaryBody.textContent = text;
      }
    }, 12);
  }, 600);
});
closeDiary.addEventListener('click', () => diaryModal.classList.remove('show'));
diaryModal.addEventListener('click', (e) => {
  if (e.target === diaryModal) diaryModal.classList.remove('show');
});

function weekday(d) {
  return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
}

function composeDiary() {
  const msgs = state.userMessages.join(' / ');
  const d = new Date();
  const dateStr = `${d.getMonth()+1}月${d.getDate()}日`;
  // pick a mood/seed based on message hash
  const seed = Math.abs(hashStr(msgs));
  const openings = [
    `${dateStr}，阳光从窗帘缝里溜进来，我才慢慢睁开眼。`,
    `${dateStr}的傍晚，我一个人坐了一会儿。`,
    `今天是个普通的${dateStr}，但回头看的时候却不这么想。`,
    `${dateStr}，风里带了点秋天的味道。`
  ];
  const middles = [
    `随手拍下了眼前这一张照片，光落下来的时候我才意识到自己已经很久没有这样看着一个地方发呆了。`,
    `我跟自己说，就五分钟吧，结果一坐就是半小时。`,
    `脑子里那堆乱七八糟的事情，好像也被这一刻的温度给融化了。`,
    `耳机里放着很老的歌，才发现原来我已经记不清上一次这么安静是什么时候了。`
  ];
  const reflections = [
    `我跟自己说：今天做得挺好的，不用再责怪自己了。`,
    `原来“还行”也是一种很珍贵的回答。`,
    `有些事急不来，能允许自己慢一点，本身就是进步。`,
    `我希望以后的我看到这张照片，能记起今天这个温柔的心跳。`
  ];
  const closings = [
    `今晚的月亮应该也不错吧。晚安。`,
    `明天的我，请继续善待今天的我。`,
    `合上日记本，关灯，听见自己的呼吸，很轻很轻。`,
    `写到这里，嘴角好像自己翘起来了一下。`
  ];
  const open = openings[seed % openings.length];
  const mid1 = middles[seed % middles.length];
  const mid2 = middles[(seed >> 1) % middles.length];
  const refl = reflections[(seed >> 2) % reflections.length];
  const close = closings[(seed >> 3) % closings.length];

  // Include a hint of what the user talked about
  const userLine = state.userMessages[0].length > 0
    ? `我跟自己念叨过：“${state.userMessages[0]}”，念完好像就没那么沉了。`
    : '';

  return [
    open,
    mid1,
    userLine,
    mid2,
    refl,
    close
  ].filter(Boolean).join('\n\n');
}
</script>
