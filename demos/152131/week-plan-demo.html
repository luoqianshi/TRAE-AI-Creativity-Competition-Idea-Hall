<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周计划 - Demo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        inquiry: { DEFAULT: '#378ADD', bg: '#E6F1FB' },
        insurance: { DEFAULT: '#1D9E75', bg: '#E1F5EE' },
        finance: { DEFAULT: '#D85A30', bg: '#FAECE7' },
        claim: { DEFAULT: '#7F77DD', bg: '#EEEDFE' },
        expansion: { DEFAULT: '#BA7517', bg: '#FAEEDA' },
        bidding: { DEFAULT: '#D4537E', bg: '#FBEAF0' },
        other: { DEFAULT: '#5F5E5A', bg: '#F1EFE8' },
      }
    }
  }
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

  /* 录音脉冲动效 */
  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.75; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  .pulse-ring { animation: pulse-ring 1.5s ease-out infinite; }

  /* 任务卡片过渡 */
  .task-card { transition: all 0.15s ease; }
  .task-card:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

  /* 遮罩动画 */
  .modal-overlay { animation: fadeIn 0.15s ease; }
  .modal-content { animation: slideUp 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* 临时任务脉冲 */
  @keyframes adhoc-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .adhoc-dot { animation: adhoc-pulse 1.5s ease-in-out infinite; }
</style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<!-- ============ 顶部周导航 ============ -->
<div class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between sticky top-0 z-30">
  <button onclick="changeWeek(-1)" class="p-1.5 rounded-lg hover:bg-gray-100 transition-colors">
    <svg class="w-5 h-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
  </button>
  <div class="text-center">
    <div class="text-base font-semibold text-gray-800">第 <span id="weekNum">28</span> 周</div>
    <div class="text-xs text-gray-400 mt-0.5" id="weekRange">7月14日 周一 - 7月18日 周五</div>
  </div>
  <button onclick="openVoicePanel()" class="p-1.5 rounded-lg hover:bg-blue-50 transition-colors" title="语音输入">
    <svg class="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
  </button>
  <button onclick="changeWeek(1)" class="p-1.5 rounded-lg hover:bg-gray-100 transition-colors">
    <svg class="w-5 h-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
  </button>
</div>

<!-- ============ 矩阵表 ============ -->
<div class="flex-1 overflow-auto">
  <div class="min-w-[780px]">
    <!-- 表头 -->
    <div class="grid grid-cols-[140px_repeat(5,1fr)] sticky top-[52px] z-20 bg-gray-50">
      <div class="bg-gray-50 border-b border-r border-gray-200 px-3 py-2.5 text-xs font-medium text-gray-500 sticky left-0 z-30">
        类别 / 日期
      </div>
      <div class="bg-gray-50 border-b border-r border-gray-200 px-3 py-2.5 text-center">
        <div class="text-sm font-medium text-gray-700">周一</div>
        <div class="text-xs text-gray-400 mt-0.5">7月14日</div>
      </div>
      <div class="bg-gray-50 border-b border-r border-gray-200 px-3 py-2.5 text-center">
        <div class="text-sm font-medium text-gray-700">周二</div>
        <div class="text-xs text-gray-400 mt-0.5">7月15日</div>
      </div>
      <div class="bg-gray-50 border-b border-r border-gray-200 px-3 py-2.5 text-center">
        <div class="text-sm font-medium text-gray-700">周三</div>
        <div class="text-xs text-gray-400 mt-0.5">7月16日</div>
      </div>
      <div class="bg-gray-50 border-b border-r border-gray-200 px-3 py-2.5 text-center">
        <div class="text-sm font-medium text-gray-700">周四</div>
        <div class="text-xs text-gray-400 mt-0.5">7月17日</div>
      </div>
      <div class="bg-gray-50 border-b border-gray-200 px-3 py-2.5 text-center">
        <div class="text-sm font-medium text-gray-700">周五</div>
        <div class="text-xs text-gray-400 mt-0.5">7月18日</div>
      </div>
    </div>

    <!-- 矩阵表内容由 JS 渲染 -->
    <div id="matrixBody"></div>
  </div>
</div>

<!-- ============ 底部导航 ============ -->
<div class="bg-white border-t border-gray-200 px-4 py-3 flex items-center justify-around sticky bottom-0 z-30">
  <button onclick="alert('周回顾功能 P2 阶段开发')" class="flex flex-col items-center gap-1 text-gray-500 hover:text-blue-500 transition-colors">
    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
    <span class="text-xs">周回顾</span>
  </button>
  <button onclick="showDayView()" class="flex flex-col items-center gap-1 text-gray-500 hover:text-blue-500 transition-colors">
    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
    <span class="text-xs">今日视图</span>
  </button>
  <button onclick="openVoicePanel()" class="flex flex-col items-center gap-1 text-gray-500 hover:text-blue-500 transition-colors">
    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
    <span class="text-xs">语音</span>
  </button>
</div>

<!-- ============ 任务编辑弹窗 ============ -->
<div id="taskFormModal" class="fixed inset-0 z-50 hidden">
  <div class="modal-overlay absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeTaskForm()"></div>
  <div class="modal-content absolute bottom-0 sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 bg-white w-full sm:w-[480px] sm:rounded-xl rounded-t-xl shadow-xl max-h-[85vh] overflow-y-auto">
    <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-gray-800" id="formTitle">新建任务</h2>
      <button onclick="closeTaskForm()" class="p-1.5 rounded-full hover:bg-gray-100 transition-colors">
        <svg class="w-5 h-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="px-5 py-4 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">任务标题</label>
        <input id="formTaskTitle" type="text" placeholder="请输入任务标题" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">类别</label>
        <select id="formCategory" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="inquiry">询价</option>
          <option value="insurance">投保批改</option>
          <option value="finance">财务文案</option>
          <option value="claim">理赔</option>
          <option value="expansion">拓展</option>
          <option value="bidding">投标</option>
          <option value="other">其他</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">日期</label>
        <select id="formDate" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="2026-07-14">7月14日 周一</option>
          <option value="2026-07-15">7月15日 周二</option>
          <option value="2026-07-16">7月16日 周三</option>
          <option value="2026-07-17">7月17日 周四</option>
          <option value="2026-07-18">7月18日 周五</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">进度要求</label>
        <input id="formProgress" type="text" placeholder="例如：完成初稿、确认需求..." class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
        <div class="flex gap-2" id="statusButtons">
          <button data-status="pending" onclick="selectStatus('pending')" class="px-3 py-1.5 rounded-lg text-xs font-medium border-2 border-blue-500 bg-blue-500 text-white transition-colors">待办</button>
          <button data-status="in_progress" onclick="selectStatus('in_progress')" class="px-3 py-1.5 rounded-lg text-xs font-medium border-2 border-gray-200 bg-white text-gray-600 hover:border-blue-300 transition-colors">进行中</button>
          <button data-status="done" onclick="selectStatus('done')" class="px-3 py-1.5 rounded-lg text-xs font-medium border-2 border-gray-200 bg-white text-gray-600 hover:border-blue-300 transition-colors">已完成</button>
          <button data-status="postponed" onclick="selectStatus('postponed')" class="px-3 py-1.5 rounded-lg text-xs font-medium border-2 border-gray-200 bg-white text-gray-600 hover:border-blue-300 transition-colors">推迟</button>
        </div>
      </div>
      <div class="flex gap-3 pt-2">
        <button onclick="saveTask()" class="flex-1 py-2.5 rounded-lg text-sm font-medium bg-blue-500 text-white hover:bg-blue-600 transition-colors">保存</button>
        <button onclick="closeTaskForm()" class="flex-1 py-2.5 rounded-lg text-sm font-medium bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors">取消</button>
        <button id="deleteBtn" onclick="deleteTask()" class="py-2.5 px-4 rounded-lg text-sm font-medium bg-red-50 text-red-500 hover:bg-red-100 transition-colors hidden">删除</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 语音输入面板 ============ -->
<div id="voiceModal" class="fixed inset-0 z-50 hidden">
  <div class="modal-overlay absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeVoicePanel()"></div>
  <div class="modal-content absolute bottom-0 sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 bg-white w-full sm:w-[520px] sm:rounded-xl rounded-t-xl shadow-xl max-h-[90vh] overflow-y-auto">
    <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-gray-800">语音输入</h2>
      <button onclick="closeVoicePanel()" class="p-1.5 rounded-full hover:bg-gray-100 transition-colors">
        <svg class="w-5 h-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="px-5 py-4 space-y-5">
      <!-- 文字输入降级方案 -->
      <div>
        <div class="text-sm text-gray-500 mb-2">输入任务描述（支持一次输入多条，用逗号或换行分隔）：</div>
        <textarea id="voiceTextInput" rows="3" placeholder="例如：周一询价A客户报价，周二做C客户投保批改，周三理赔D客户资料整理" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"></textarea>
      </div>
      <button onclick="simulateVoiceParse()" class="w-full py-2.5 rounded-lg text-sm font-medium bg-blue-500 text-white hover:bg-blue-600 transition-colors">AI 智能解析</button>

      <!-- 解析结果 -->
      <div id="parsedResults" class="space-y-2 hidden">
        <div class="text-sm font-medium text-gray-700">识别到 <span id="parsedCount">0</span> 条任务</div>
        <div id="parsedList" class="space-y-2 max-h-[240px] overflow-y-auto"></div>
      </div>

      <div class="flex gap-3 pt-2">
        <button id="voiceConfirmBtn" onclick="confirmVoiceTasks()" class="flex-1 py-2.5 rounded-lg text-sm font-medium bg-blue-500 text-white hover:bg-blue-600 transition-colors disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed" disabled>确认写入 (0)</button>
        <button onclick="closeVoicePanel()" class="flex-1 py-2.5 rounded-lg text-sm font-medium bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors">取消</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 每日视图 ============ -->
<div id="dayViewModal" class="fixed inset-0 z-50 hidden">
  <div class="modal-overlay absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeDayView()"></div>
  <div class="modal-content absolute inset-x-0 top-0 bottom-0 sm:inset-auto sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 bg-white w-full sm:w-[480px] sm:rounded-xl sm:max-h-[85vh] overflow-y-auto">
    <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between sticky top-0 bg-white z-10">
      <div class="flex items-center gap-3">
        <button onclick="closeDayView()" class="p-1 rounded-lg hover:bg-gray-100">
          <svg class="w-5 h-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div>
          <div class="text-base font-semibold text-gray-800">7月15日 周二</div>
          <div class="text-xs text-gray-400">完成 <span id="dayDoneCount">0</span> / <span id="dayTotalCount">0</span></div>
        </div>
      </div>
      <button onclick="openTaskForm('inquiry', '2026-07-15')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-blue-500 text-white hover:bg-blue-600 transition-colors">+ 新建</button>
    </div>
    <div id="dayViewContent" class="px-5 py-4 space-y-4"></div>
    <div class="px-5 pb-4">
      <div class="text-sm font-medium text-gray-700 mb-2">当天备注</div>
      <textarea rows="3" placeholder="记录今天的执行情况、遇到的问题..." class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"></textarea>
      <button class="mt-2 px-4 py-1.5 rounded-lg text-xs font-medium bg-blue-500 text-white hover:bg-blue-600 transition-colors">保存备注</button>
    </div>
  </div>
</div>

<script>
// ==================== 数据 ====================

const CATEGORIES = [
  { key: 'inquiry', name: '询价', color: '#378ADD', bgColor: '#E6F1FB' },
  { key: 'insurance', name: '投保批改', color: '#1D9E75', bgColor: '#E1F5EE' },
  { key: 'finance', name: '财务文案', color: '#D85A30', bgColor: '#FAECE7' },
  { key: 'claim', name: '理赔', color: '#7F77DD', bgColor: '#EEEDFE' },
  { key: 'expansion', name: '拓展', color: '#BA7517', bgColor: '#FAEEDA' },
  { key: 'bidding', name: '投标', color: '#D4537E', bgColor: '#FBEAF0' },
  { key: 'other', name: '其他', color: '#5F5E5A', bgColor: '#F1EFE8' },
];

const DATES = ['2026-07-14', '2026-07-15', '2026-07-16', '2026-07-17', '2026-07-18'];
const DATE_LABELS = ['7月14日', '7月15日', '7月16日', '7月17日', '7月18日'];
const WEEKDAYS = ['周一', '周二', '周三', '周四', '周五'];

let tasks = [
  { id: 't1', categoryKey: 'inquiry', title: 'A客户财产险报价方案', scheduledDate: '2026-07-14', status: 'done', progressNote: '完成初稿', isAdhoc: false },
  { id: 't2', categoryKey: 'inquiry', title: 'B客户续保询价跟进', scheduledDate: '2026-07-14', status: 'in_progress', progressNote: '电话确认需求', isAdhoc: false },
  { id: 't3', categoryKey: 'inquiry', title: 'E公司团险初步询价', scheduledDate: '2026-07-15', status: 'pending', progressNote: '', isAdhoc: true },
  { id: 't4', categoryKey: 'insurance', title: 'C客户批单提交审核', scheduledDate: '2026-07-14', status: 'in_progress', progressNote: '准备材料', isAdhoc: false },
  { id: 't5', categoryKey: 'insurance', title: 'D客户新保出单', scheduledDate: '2026-07-16', status: 'pending', progressNote: '收集投保资料', isAdhoc: false },
  { id: 't6', categoryKey: 'insurance', title: 'F公司增员批改', scheduledDate: '2026-07-16', status: 'pending', progressNote: '', isAdhoc: true },
  { id: 't7', categoryKey: 'finance', title: '月度财务报表整理', scheduledDate: '2026-07-14', status: 'done', progressNote: '汇总6月数据', isAdhoc: false },
  { id: 't8', categoryKey: 'finance', title: '理赔款对账', scheduledDate: '2026-07-17', status: 'pending', progressNote: '核对银行流水', isAdhoc: false },
  { id: 't9', categoryKey: 'claim', title: 'G客户车险理赔资料', scheduledDate: '2026-07-15', status: 'pending', progressNote: '拍照整理', isAdhoc: false },
  { id: 't10', categoryKey: 'claim', title: 'H客户工伤理赔跟进', scheduledDate: '2026-07-17', status: 'pending', progressNote: '', isAdhoc: false },
  { id: 't11', categoryKey: 'expansion', title: '拜访I公司人事部', scheduledDate: '2026-07-15', status: 'pending', progressNote: '带产品手册', isAdhoc: false },
  { id: 't12', categoryKey: 'bidding', title: 'J项目投标文件准备', scheduledDate: '2026-07-16', status: 'pending', progressNote: '截止周五', isAdhoc: false },
  { id: 't13', categoryKey: 'bidding', title: 'K项目招标公告分析', scheduledDate: '2026-07-14', status: 'done', progressNote: '整理要点', isAdhoc: false },
  { id: 't14', categoryKey: 'other', title: '整理本周工作总结', scheduledDate: '2026-07-18', status: 'pending', progressNote: '', isAdhoc: false },
  { id: 't15', categoryKey: 'inquiry', title: 'L客户货运险询价', scheduledDate: '2026-07-17', status: 'pending', progressNote: '了解货品类型', isAdhoc: true },
];

let nextId = 20;
let editingTaskId = null;
let currentFormStatus = 'pending';
let parsedVoiceTasks = [];

// ==================== 渲染 ====================

function renderMatrix() {
  const body = document.getElementById('matrixBody');
  body.innerHTML = '';

  CATEGORIES.forEach(cat => {
    const row = document.createElement('div');
    row.className = 'grid grid-cols-[140px_repeat(5,1fr)]';

    // 类别列
    const catCell = document.createElement('div');
    catCell.className = 'sticky left-0 z-10 flex items-center px-3 py-3 border-b border-r border-gray-200';
    catCell.style.backgroundColor = cat.bgColor;
    catCell.innerHTML = `
      <div class="w-3 h-3 rounded-full mr-2 shrink-0" style="background-color:${cat.color}"></div>
      <span class="text-sm font-medium truncate" style="color:${cat.color}">${cat.name}</span>
    `;
    row.appendChild(catCell);

    // 日期列
    DATES.forEach((date, di) => {
      const cellTasks = tasks.filter(t => t.categoryKey === cat.key && t.scheduledDate === date);
      const cell = document.createElement('div');
      cell.className = 'min-h-[80px] p-2 border-b border-r border-gray-100 hover:bg-gray-50/50 transition-colors';

      let html = '<div class="flex flex-col gap-1.5">';
      cellTasks.forEach(task => {
        html += renderTaskCard(task, cat);
      });
      html += `<button onclick="event.stopPropagation(); openTaskForm('${cat.key}', '${date}')" class="flex items-center justify-center h-6 w-full rounded text-gray-300 hover:text-gray-400 hover:bg-gray-100 transition-colors text-lg leading-none">+</button>`;
      html += '</div>';
      cell.innerHTML = html;
      row.appendChild(cell);
    });

    body.appendChild(row);
  });
}

function renderTaskCard(task, cat) {
  const statusStyles = {
    pending: `bg-white border border-gray-200 text-gray-700`,
    in_progress: `border-l-[3px] text-gray-800`,
    done: `bg-gray-50 text-gray-400 line-through`,
    postponed: `bg-yellow-50 border border-yellow-200 text-yellow-700`,
  };

  const baseStyle = task.status === 'in_progress'
    ? `border-l-[3px] bg-white`
    : statusStyles[task.status];

  const leftBorder = task.status === 'in_progress' ? `border-left: 3px solid ${cat.color};` : '';

  const adhocDot = task.isAdhoc
    ? `<span class="adhoc-dot inline-block w-1.5 h-1.5 rounded-full bg-orange-400 ml-1"></span>`
    : '';

  const statusBadge = task.status === 'done'
    ? `<span class="ml-auto text-green-500 text-xs">✓</span>`
    : task.status === 'in_progress'
    ? `<span class="ml-auto text-xs" style="color:${cat.color}">●</span>`
    : '';

  return `
    <div class="task-card rounded-lg px-2.5 py-1.5 cursor-pointer text-sm ${baseStyle}" style="${leftBorder}" onclick="event.stopPropagation(); openTaskForm('${cat.key}', '${task.scheduledDate}', '${task.id}')">
      <div class="flex items-center">
        <span class="truncate text-xs">${task.title}</span>
        ${adhocDot}
        ${statusBadge}
      </div>
      ${task.progressNote ? `<div class="text-[10px] text-gray-400 mt-0.5 truncate">${task.progressNote}</div>` : ''}
    </div>
  `;
}

// ==================== 任务表单 ====================

function openTaskForm(categoryKey, date, taskId) {
  editingTaskId = taskId || null;
  const modal = document.getElementById('taskFormModal');
  const titleEl = document.getElementById('formTitle');
  const deleteBtn = document.getElementById('deleteBtn');

  document.getElementById('formCategory').value = categoryKey;
  document.getElementById('formDate').value = date;

  if (taskId) {
    const task = tasks.find(t => t.id === taskId);
    if (task) {
      document.getElementById('formTaskTitle').value = task.title;
      document.getElementById('formProgress').value = task.progressNote || '';
      selectStatus(task.status);
      titleEl.textContent = '编辑任务';
      deleteBtn.classList.remove('hidden');
    }
  } else {
    document.getElementById('formTaskTitle').value = '';
    document.getElementById('formProgress').value = '';
    selectStatus('pending');
    titleEl.textContent = '新建任务';
    deleteBtn.classList.add('hidden');
  }

  modal.classList.remove('hidden');
  setTimeout(() => document.getElementById('formTaskTitle').focus(), 100);
}

function closeTaskForm() {
  document.getElementById('taskFormModal').classList.add('hidden');
  editingTaskId = null;
}

function selectStatus(status) {
  currentFormStatus = status;
  document.querySelectorAll('#statusButtons button').forEach(btn => {
    if (btn.dataset.status === status) {
      btn.className = 'px-3 py-1.5 rounded-lg text-xs font-medium border-2 border-blue-500 bg-blue-500 text-white transition-colors';
    } else {
      btn.className = 'px-3 py-1.5 rounded-lg text-xs font-medium border-2 border-gray-200 bg-white text-gray-600 hover:border-blue-300 transition-colors';
    }
  });
}

function saveTask() {
  const title = document.getElementById('formTaskTitle').value.trim();
  if (!title) { alert('请输入任务标题'); return; }

  const categoryKey = document.getElementById('formCategory').value;
  const scheduledDate = document.getElementById('formDate').value;
  const progressNote = document.getElementById('formProgress').value.trim();

  if (editingTaskId) {
    const task = tasks.find(t => t.id === editingTaskId);
    if (task) {
      task.title = title;
      task.categoryKey = categoryKey;
      task.scheduledDate = scheduledDate;
      task.progressNote = progressNote;
      task.status = currentFormStatus;
    }
  } else {
    tasks.push({
      id: 't' + (nextId++),
      categoryKey,
      title,
      scheduledDate,
      status: currentFormStatus,
      progressNote,
      isAdhoc: false,
    });
  }

  closeTaskForm();
  renderMatrix();
}

function deleteTask() {
  if (!editingTaskId) return;
  if (!confirm('确定删除这条任务吗？')) return;
  tasks = tasks.filter(t => t.id !== editingTaskId);
  closeTaskForm();
  renderMatrix();
}

// ==================== 语音输入 ====================

function openVoicePanel() {
  document.getElementById('voiceModal').classList.remove('hidden');
  document.getElementById('voiceTextInput').value = '';
  document.getElementById('parsedResults').classList.add('hidden');
  parsedVoiceTasks = [];
  updateVoiceConfirmBtn();
}

function closeVoicePanel() {
  document.getElementById('voiceModal').classList.add('hidden');
}

function simulateVoiceParse() {
  const text = document.getElementById('voiceTextInput').value.trim();
  if (!text) { alert('请输入任务描述'); return; }

  // 模拟 AI 解析
  const items = text.split(/[,，、\n]+/).filter(s => s.trim());
  parsedVoiceTasks = items.map((item, i) => {
    const catIndex = i % CATEGORIES.length;
    const dateIndex = i % 5;
    return {
      categoryKey: CATEGORIES[catIndex].key,
      categoryName: CATEGORIES[catIndex].name,
      title: item.trim(),
      scheduledDate: DATES[dateIndex],
      progressNote: '',
      confidence: 0.85 + Math.random() * 0.1,
    };
  });

  // 渲染解析结果
  const resultsDiv = document.getElementById('parsedResults');
  const listDiv = document.getElementById('parsedList');
  document.getElementById('parsedCount').textContent = parsedVoiceTasks.length;

  listDiv.innerHTML = parsedVoiceTasks.map((t, i) => {
    const cat = CATEGORIES.find(c => c.key === t.categoryKey);
    const dateIdx = DATES.indexOf(t.scheduledDate);
    return `
      <div class="rounded-lg border border-gray-200 px-3 py-2.5 text-sm">
        <div class="flex items-start justify-between gap-2">
          <div class="flex-1 min-w-0">
            <div class="font-medium text-gray-800 truncate">${t.title}</div>
            <div class="flex items-center gap-2 mt-1 text-xs text-gray-500">
              <span class="px-1.5 py-0.5 rounded" style="background-color:${cat.bgColor};color:${cat.color}">${t.categoryName}</span>
              <span>${DATE_LABELS[dateIdx]} ${WEEKDAYS[dateIdx]}</span>
            </div>
          </div>
          <button onclick="removeParsedTask(${i})" class="p-1 rounded hover:bg-red-50 text-gray-400 hover:text-red-500 shrink-0">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
    `;
  }).join('');

  resultsDiv.classList.remove('hidden');
  updateVoiceConfirmBtn();
}

function removeParsedTask(index) {
  parsedVoiceTasks.splice(index, 1);
  document.getElementById('parsedCount').textContent = parsedVoiceTasks.length;
  simulateVoiceParse_renderOnly();
  updateVoiceConfirmBtn();
}

function simulateVoiceParse_renderOnly() {
  const listDiv = document.getElementById('parsedList');
  if (parsedVoiceTasks.length === 0) {
    document.getElementById('parsedResults').classList.add('hidden');
    return;
  }
  listDiv.innerHTML = parsedVoiceTasks.map((t, i) => {
    const cat = CATEGORIES.find(c => c.key === t.categoryKey);
    const dateIdx = DATES.indexOf(t.scheduledDate);
    return `
      <div class="rounded-lg border border-gray-200 px-3 py-2.5 text-sm">
        <div class="flex items-start justify-between gap-2">
          <div class="flex-1 min-w-0">
            <div class="font-medium text-gray-800 truncate">${t.title}</div>
            <div class="flex items-center gap-2 mt-1 text-xs text-gray-500">
              <span class="px-1.5 py-0.5 rounded" style="background-color:${cat.bgColor};color:${cat.color}">${t.categoryName}</span>
              <span>${DATE_LABELS[dateIdx]} ${WEEKDAYS[dateIdx]}</span>
            </div>
          </div>
          <button onclick="removeParsedTask(${i})" class="p-1 rounded hover:bg-red-50 text-gray-400 hover:text-red-500 shrink-0">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
    `;
  }).join('');
}

function updateVoiceConfirmBtn() {
  const btn = document.getElementById('voiceConfirmBtn');
  btn.textContent = `确认写入 (${parsedVoiceTasks.length})`;
  btn.disabled = parsedVoiceTasks.length === 0;
}

function confirmVoiceTasks() {
  parsedVoiceTasks.forEach(pt => {
    tasks.push({
      id: 't' + (nextId++),
      categoryKey: pt.categoryKey,
      title: pt.title,
      scheduledDate: pt.scheduledDate,
      status: 'pending',
      progressNote: pt.progressNote,
      isAdhoc: true,
    });
  });
  closeVoicePanel();
  renderMatrix();
}

// ==================== 每日视图 ====================

function showDayView() {
  const modal = document.getElementById('dayViewModal');
  const content = document.getElementById('dayViewContent');
  const targetDate = '2026-07-15';

  let doneCount = 0;
  let totalCount = 0;

  let html = '';
  CATEGORIES.forEach(cat => {
    const catTasks = tasks.filter(t => t.categoryKey === cat.key && t.scheduledDate === targetDate);
    totalCount += catTasks.length;
    doneCount += catTasks.filter(t => t.status === 'done').length;

    html += `
      <div>
        <div class="flex items-center gap-2 mb-2">
          <div class="w-3 h-3 rounded-full" style="background-color:${cat.color}"></div>
          <span class="text-sm font-medium" style="color:${cat.color}">${cat.name}</span>
          <span class="text-xs text-gray-400">${catTasks.length}</span>
          <button onclick="openTaskForm('${cat.key}', '${targetDate}')" class="ml-auto text-gray-300 hover:text-gray-500 text-lg leading-none">+</button>
        </div>
        <div class="space-y-1.5 ml-5">
    `;

    if (catTasks.length === 0) {
      html += `<button onclick="openTaskForm('${cat.key}', '${targetDate}')" class="text-sm text-gray-400 hover:text-blue-500 transition-colors">点击 + 添加任务</button>`;
    } else {
      catTasks.forEach(task => {
        html += `
          <div class="task-card rounded-lg px-3 py-2 cursor-pointer text-sm ${task.status === 'done' ? 'bg-gray-50 text-gray-400 line-through' : task.status === 'in_progress' ? 'border-l-[3px] bg-white' : 'bg-white border border-gray-200'}" style="${task.status === 'in_progress' ? 'border-left:3px solid ' + cat.color : ''}" onclick="openTaskForm('${cat.key}', '${task.scheduledDate}', '${task.id}')">
            <span class="${task.status === 'done' ? 'line-through' : ''}">${task.title}</span>
            ${task.progressNote ? `<div class="text-[10px] text-gray-400 mt-0.5">${task.progressNote}</div>` : ''}
          </div>
        `;
      });
    }

    html += '</div></div>';
  });

  content.innerHTML = html;
  document.getElementById('dayDoneCount').textContent = doneCount;
  document.getElementById('dayTotalCount').textContent = totalCount;
  modal.classList.remove('hidden');
}

function closeDayView() {
  document.getElementById('dayViewModal').classList.add('hidden');
}

// ==================== 周切换 ====================

let currentWeekOffset = 0;

function changeWeek(direction) {
  currentWeekOffset += direction;
  const baseMonday = new Date(2026, 6, 14); // 2026-07-14
  const monday = new Date(baseMonday);
  monday.setDate(monday.getDate() + currentWeekOffset * 7);
  const friday = new Date(monday);
  friday.setDate(friday.getDate() + 4);

  // 计算周号
  const d = new Date(Date.UTC(monday.getFullYear(), monday.getMonth(), monday.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNum = Math.ceil(((d.getTime() - yearStart.getTime()) / 86400000 + 1) / 7);

  document.getElementById('weekNum').textContent = weekNum;
  document.getElementById('weekRange').textContent = `${monday.getMonth()+1}月${monday.getDate()}日 周一 - ${friday.getMonth()+1}月${friday.getDate()}日 周五`;
}

// ==================== 初始化 ====================

renderMatrix();
</script>
