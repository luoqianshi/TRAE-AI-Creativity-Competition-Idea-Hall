<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>六爻决策辅助系统</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --bg-primary: #0F1123;
  --bg-surface: #191B35;
  --bg-input: #14162B;
  --text-primary: #E8E4F0;
  --text-secondary: #8B8DA8;
  --text-muted: #5B5D78;
  --accent: #7CFF6B;
  --accent-dim: rgba(124, 255, 107, 0.3);
  --accent-faint: rgba(124, 255, 107, 0.12);
  --accent-warm: #C56BE0;
  --accent-warm-dim: rgba(197, 107, 224, 0.2);
  --font-heading: 'Noto Serif SC', 'STSong', 'Songti SC', serif;
  --font-body: 'Noto Sans SC', 'PingFang SC', 'Heiti SC', sans-serif;
  --screen-w: 375px;
  --screen-h: 812px;
  --status-h: 62px;
  --tab-h: 82px;
  --content-h: 668px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-full: 26px;
  --radius-pill: 36px;
  --font-size-xs: 10px;
  --font-size-sm: 12px;
  --font-size-md: 13px;
  --font-size-base: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 17px;
  --font-size-2xl: 20px;
  --font-size-3xl: 24px;
  --font-size-4xl: 28px;
}

/* ===== Reset ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #060812;
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
body {
  display: flex; align-items: center; justify-content: center;
}

/* ===== Phone Frame ===== */
.phone-container {
  position: relative;
  width: var(--screen-w); height: var(--screen-h);
  background: var(--bg-primary);
  overflow: hidden;
  border-radius: 24px;
  box-shadow: 0 0 0 2px #2A2D4A, 0 0 40px rgba(124, 255, 107, 0.06), 0 20px 60px rgba(0,0,0,0.5);
}

/* ===== Status Bar ===== */
.status-bar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--status-h);
  background: var(--bg-primary);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
}
.status-time { color: var(--text-primary); font-size: 15px; font-weight: 700; font-family: 'Inter', sans-serif; }
.status-icons { display: flex; align-items: center; gap: 6px; }
.status-battery {
  width: 27px; height: 12px;
  border: 1.5px solid var(--text-primary);
  border-radius: 3px; padding: 2px;
  opacity: 0.7;
}
.status-battery-fill { width: 100%; height: 100%; background: var(--text-primary); border-radius: 1px; }

/* ===== Screen Views ===== */
.view {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: none; flex-direction: column;
}
.view.active { display: flex; }

.content-scroll {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
  height: var(--content-h);
  display: flex; flex-direction: column; gap: 24px;
}
.content-scroll::-webkit-scrollbar { width: 0; }

/* ===== Typography ===== */
.page-title { font-family: var(--font-heading); font-size: var(--font-size-4xl); font-weight: 700; color: var(--text-primary); }
.page-subtitle { font-family: var(--font-body); font-size: var(--font-size-base); color: var(--text-secondary); line-height: 1.4; }
.section-label {
  font-family: var(--font-body); font-size: var(--font-size-sm); font-weight: 500;
  color: var(--accent); letter-spacing: 1px; text-transform: uppercase;
}

/* ===== Cards ===== */
.card {
  background: var(--bg-surface);
  border-radius: var(--radius-md);
  padding: 16px;
}
.card-header { margin-bottom: 12px; }

/* ===== Dividers ===== */
.ornate-divider {
  height: 1px; width: 100%;
  background: linear-gradient(to right, transparent, var(--accent-dim), transparent);
}

/* ===== Input ===== */
.input-wrapper { display: flex; flex-direction: column; gap: 8px; }
.input-field {
  display: flex; align-items: center; padding: 0 14px;
  height: 48px; background: var(--bg-input);
  border-radius: var(--radius-sm);
  border: 1.5px solid transparent;
  transition: border-color 0.2s;
}
.input-field:focus-within { border-color: var(--accent-dim); box-shadow: 0 0 8px var(--accent-faint); }
.input-field input {
  flex: 1; width: 100%;
  background: transparent; border: none; outline: none;
  font-size: var(--font-size-base); font-family: var(--font-body);
  color: var(--text-primary);
}
.input-field input::placeholder { color: var(--text-muted); }

/* ===== Coin Area ===== */
.coin-area {
  display: flex; align-items: center; justify-content: center;
  gap: 20px; padding: 28px 24px;
  min-height: 180px;
}
.coin {
  width: 72px; height: 72px; border-radius: 50%;
  background: linear-gradient(135deg, #2A2048, #1E1A3A, #141230);
  box-shadow: 0 0 12px rgba(124, 255, 107, 0.2), 0 0 2px rgba(124, 255, 107, 0.15), inset 0 1px 0 rgba(255,255,255,0.08);
  position: relative; cursor: pointer;
  transition: transform 0.1s, box-shadow 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.coin:hover { box-shadow: 0 0 20px rgba(124, 255, 107, 0.35), 0 0 4px rgba(124, 255, 107, 0.25), inset 0 1px 0 rgba(255,255,255,0.08); }
.coin:active { transform: scale(0.95); }
.coin-hole {
  width: 22px; height: 22px;
  background: var(--bg-surface);
  border-radius: 4px;
  box-shadow: inset 0 0 8px rgba(197, 107, 224, 0.2);
}
.coin-label {
  position: absolute; font-size: var(--font-size-xs); font-weight: 700;
  color: #9A8BC0; opacity: 0.9;
  letter-spacing: 0.5px;
}
.coin-label.top { top: 14px; }
.coin-label.bottom { bottom: 14px; }
.coin.shaking { animation: coin-shake 0.6s ease-out; }
.coin.result-yang { background: linear-gradient(135deg, #3A4060, #2A3050, #1A2040); box-shadow: 0 0 18px rgba(124, 255, 107, 0.4), 0 0 6px rgba(124, 255, 107, 0.2); }
.coin.result-yin { background: linear-gradient(135deg, #1E1630, #150E26, #0E0820); box-shadow: 0 0 10px rgba(197, 107, 224, 0.25); }

@keyframes coin-shake {
  0% { transform: translateY(0) rotate(0); }
  20% { transform: translateY(-30px) rotate(180deg); }
  40% { transform: translateY(-50px) rotate(360deg); }
  60% { transform: translateY(-30px) rotate(540deg); }
  80% { transform: translateY(-10px) rotate(680deg); }
  100% { transform: translateY(0) rotate(720deg); }
}

/* ===== Round Tracker ===== */
.round-list { display: flex; flex-direction: column; gap: 10px; }
.round-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; background: var(--bg-input);
  border-radius: var(--radius-sm);
  transition: all 0.3s;
}
.round-row.completed {
  border-left: 3px solid var(--accent);
}
.round-row.current {
  border: 1.5px solid var(--accent);
}
.round-label {
  width: 36px; text-align: center;
  font-family: var(--font-heading); font-size: var(--font-size-md); font-weight: 700;
  color: var(--text-secondary);
}
.round-result {
  flex: 1; font-size: var(--font-size-md); color: var(--text-muted);
  transition: color 0.3s;
}
.round-row.completed .round-result { color: var(--text-primary); }
.round-indicator {
  font-size: var(--font-size-base); font-weight: 700;
}

/* ===== CTA Button ===== */
.cta-btn {
  display: flex; align-items: center; justify-content: center;
  height: 52px; background: var(--accent);
  border-radius: var(--radius-full); border: none; cursor: pointer;
  font-family: var(--font-heading); font-size: var(--font-size-xl); font-weight: 700;
  color: var(--bg-primary); letter-spacing: 1px;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.cta-btn:active { transform: scale(0.97); opacity: 0.9; }
.cta-btn:disabled { opacity: 0.4; pointer-events: none; }
.cta-btn.secondary { background: transparent; border: 1.5px solid var(--accent-dim); color: var(--accent); }

/* ===== Tab Bar ===== */
.tab-bar {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 100;
  height: var(--tab-h); background: var(--bg-primary);
  display: flex; align-items: center; justify-content: center;
  padding: 12px 12px 21px;
}
.tab-pill {
  display: flex; width: 100%; height: 62px;
  background: var(--bg-surface); border-radius: var(--radius-pill);
  padding: 4px; gap: 4px;
}
.tab-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  border-radius: var(--radius-full);
  cursor: pointer; transition: all 0.3s;
  -webkit-tap-highlight-color: transparent;
}
.tab-item.active { background: var(--accent); }
.tab-icon {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: all 0.3s;
}
.tab-item.active .tab-icon { background: var(--bg-primary); }
.tab-label {
  font-family: var(--font-body); font-size: var(--font-size-xs);
  font-weight: 400; color: var(--text-muted);
  letter-spacing: 0.5px; text-transform: uppercase;
  transition: all 0.3s;
}
.tab-item.active .tab-label { color: var(--bg-primary); font-weight: 700; }

/* ===== Screen 2: Hexagram ===== */
.back-btn {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; min-width: 36px;
  background: var(--bg-surface); border-radius: 50%;
  cursor: pointer; border: none;
  font-size: 22px; color: var(--accent);
  -webkit-tap-highlight-color: transparent;
}
.back-btn:active { opacity: 0.7; }

.header-row { display: flex; align-items: center; gap: 12px; }

.hex-diagram {
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  padding: 16px 20px; background: var(--bg-input);
  border-radius: var(--radius-sm);
}
.yao-line {
  height: 8px; border-radius: 4px;
  transition: all 0.5s;
}
.yao-line.yang { width: 180px; background: var(--text-primary); }
.yao-line.yin { display: flex; gap: 10px; justify-content: center; }
.yao-line.yin span { display: block; width: 80px; height: 8px; background: var(--text-primary); border-radius: 4px; }
.yao-line.empty { width: 180px; background: var(--text-muted); opacity: 0.3; }

.hex-title { font-family: var(--font-heading); font-size: var(--font-size-2xl); font-weight: 700; color: var(--text-primary); }
.hex-desc { font-size: var(--font-size-md); color: var(--text-secondary); line-height: 1.7; }
.changed-title { font-family: var(--font-heading); font-size: var(--font-size-lg); font-weight: 700; color: var(--accent); }
.changed-desc { font-size: var(--font-size-md); color: var(--text-secondary); line-height: 1.7; }

.yao-interp-card { display: flex; flex-direction: column; gap: 12px; }
.yao-interp-title { font-family: var(--font-heading); font-size: var(--font-size-base); font-weight: 700; color: var(--accent); letter-spacing: 1px; }
.yao-interp-text { font-family: var(--font-heading); font-size: var(--font-size-base); color: var(--text-primary); line-height: 1.8; white-space: pre-line; }

/* ===== Simple Interpretation Badge ===== */
.simple-badge {
  margin-top: 8px; padding: 10px 12px;
  background: var(--accent-faint);
  border-left: 3px solid var(--accent-dim);
  border-radius: 4px;
}
.simple-badge-label {
  font-family: var(--font-body); font-size: var(--font-size-xs); font-weight: 600;
  color: var(--accent); letter-spacing: 1px;
  display: block; margin-bottom: 4px;
}
.simple-badge-text {
  font-family: var(--font-body); font-size: var(--font-size-md);
  color: var(--text-primary); line-height: 1.7;
  opacity: 0.92;
}

/* ===== Screen 3: History ===== */
.history-list { display: flex; flex-direction: column; gap: 12px; }
.history-item {
  background: var(--bg-surface); border-radius: var(--radius-md);
  padding: 16px; cursor: pointer;
  transition: all 0.2s;
}
.history-item:active { opacity: 0.8; }
.history-item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.history-hex-name { font-family: var(--font-heading); font-size: var(--font-size-lg); font-weight: 700; color: var(--text-primary); }
.history-date { font-size: var(--font-size-sm); color: var(--text-muted); }
.history-question { font-size: var(--font-size-md); color: var(--text-secondary); margin-bottom: 4px; }
.history-result-tag {
  display: inline-block; font-size: var(--font-size-xs); padding: 2px 8px;
  border-radius: 4px; background: var(--accent-faint); color: var(--accent);
  font-weight: 500;
}

/* ===== Screen 4: Profile ===== */
.profile-section { display: flex; flex-direction: column; gap: 8px; }
.menu-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px; background: var(--bg-surface); border-radius: var(--radius-md);
  cursor: pointer; transition: all 0.2s;
}
.menu-item:active { opacity: 0.7; }
.menu-item-label { font-size: var(--font-size-base); color: var(--text-primary); }
.menu-item-arrow { font-size: var(--font-size-lg); color: var(--text-muted); }
.menu-item-value { font-size: var(--font-size-md); color: var(--text-secondary); }

.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: var(--text-muted); gap: 12px;
}
.empty-icon { font-size: 48px; opacity: 0.3; }
.empty-text { font-size: var(--font-size-base); }

/* ===== Responsive Scaling ===== */
@media (min-width: 376px) and (max-height: 813px) {
  body { align-items: center; }
}
@media (max-width: 375px) {
  .phone-container {
    width: 100vw; height: 100vh; border-radius: 0;
    box-shadow: none;
  }
  .phone-container { width: 100vw; height: 100vh; }
  .status-bar, .tab-bar { position: fixed; left: 0; right: 0; }
  .status-bar { top: 0; }
  .tab-bar { bottom: 0; }
  .content-scroll { height: calc(100vh - var(--status-h) - var(--tab-h)); }
}

/* ===== Animations ===== */
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.4s ease-out; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.pulse { animation: pulse 2s infinite; }
</style>
</head>
<body>

<div class="phone-container" id="app">

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time" id="statusTime">9:41</span>
    <div class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="#E8E4F0"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="#E8E4F0"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="#E8E4F0"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#E8E4F0"/></svg>
      <div class="status-battery"><div class="status-battery-fill"></div></div>
    </div>
  </div>

  <!-- ========== View 1: 起卦 ========== -->
  <div class="view active" id="view-divination">
    <div class="content-scroll">
      <div class="fade-in">
        <h1 class="page-title">起卦</h1>
        <p class="page-subtitle">诚心默念所问之事，心诚则灵</p>
      </div>
      <div class="ornate-divider"></div>

      <!-- Question Input -->
      <div class="card fade-in">
        <div class="card-header"><span class="section-label">所问何事</span></div>
        <div class="input-field">
          <input type="text" id="questionInput" placeholder="例如：这次投资是否可行？" maxlength="100">
        </div>
      </div>

      <!-- Coin Area -->
      <div class="card fade-in" style="text-align:center;">
        <div class="card-header"><span class="section-label" style="display:block;text-align:left;">摇卦 · 三枚铜钱</span></div>
        <div class="coin-area" id="coinArea">
          <div class="coin" onclick="shakeCoins()"><div class="coin-hole"></div><span class="coin-label top">乾</span><span class="coin-label bottom">隆</span></div>
          <div class="coin" onclick="shakeCoins()"><div class="coin-hole"></div><span class="coin-label top">乾</span><span class="coin-label bottom">隆</span></div>
          <div class="coin" onclick="shakeCoins()"><div class="coin-hole"></div><span class="coin-label top">乾</span><span class="coin-label bottom">隆</span></div>
        </div>
        <p style="font-size:var(--font-size-sm);color:var(--text-muted);margin-top:8px;">点击铜钱或下方按钮开始摇卦</p>
      </div>

      <!-- Round Tracker -->
      <div class="card fade-in">
        <div class="card-header"><span class="section-label">六爻记录</span></div>
        <div class="round-list" id="roundList">
          <div class="round-row" data-round="6"><span class="round-label">上爻</span><span class="round-result">——— 未摇</span></div>
          <div class="round-row" data-round="5"><span class="round-label">五爻</span><span class="round-result">——— 未摇</span></div>
          <div class="round-row" data-round="4"><span class="round-label">四爻</span><span class="round-result">——— 未摇</span></div>
          <div class="round-row" data-round="3"><span class="round-label">三爻</span><span class="round-result">——— 未摇</span></div>
          <div class="round-row" data-round="2"><span class="round-label">二爻</span><span class="round-result">——— 未摇</span></div>
          <div class="round-row" data-round="1"><span class="round-label">初爻</span><span class="round-result">——— 未摇</span></div>
        </div>
      </div>

      <!-- CTA -->
      <button class="cta-btn" id="shakeBtn" onclick="shakeCoins()">开始摇卦</button>
      <button class="cta-btn secondary" id="viewResultBtn" onclick="viewResult()" disabled>查看卦象 →</button>
      <div style="height:20px;"></div>
    </div>
  </div>

  <!-- ========== View 2: 卦象 ========== -->
  <div class="view" id="view-hexagram">
    <div class="content-scroll">
      <div class="header-row fade-in">
        <button class="back-btn" onclick="switchTab(0)">‹</button>
        <h1 class="page-title" style="font-size:var(--font-size-3xl);">卦象解读</h1>
      </div>

      <div class="card fade-in">
        <div class="card-header"><span class="section-label">占问</span></div>
        <p class="page-subtitle" id="hexQuestion" style="font-size:var(--font-size-lg);color:var(--text-primary);">--</p>
      </div>

      <div class="card fade-in" id="hexCard" style="display:none;">
        <h2 class="hex-title" id="hexName">--</h2>
        <div class="hex-diagram" id="hexDiagram"></div>
        <p class="hex-desc" id="hexDesc">--</p>
        <div class="simple-badge" id="hexSimpleBadge" style="display:none;">
          <span class="simple-badge-label">白话解读</span>
          <p class="simple-badge-text" id="hexSimpleDesc">--</p>
        </div>
        <div class="ornate-divider" style="margin:8px 0;"></div>
        <h3 class="changed-title" id="changedName">--</h3>
        <p class="changed-desc" id="changedDesc">--</p>
        <div class="simple-badge" id="chgSimpleBadge" style="display:none;">
          <span class="simple-badge-label">白话解读</span>
          <p class="simple-badge-text" id="chgSimpleDesc">--</p>
        </div>
      </div>

      <div class="card fade-in yao-interp-card" id="yaoCard" style="display:none;">
        <span class="yao-interp-title" id="yaoTitle">变爻解读</span>
        <p class="yao-interp-text" id="yaoText">--</p>
        <div class="simple-badge" id="yaoSimpleBadge" style="display:none;">
          <span class="simple-badge-label">白话解读</span>
          <p class="simple-badge-text" id="yaoSimpleText">--</p>
        </div>
      </div>
      <div style="height:20px;"></div>
    </div>
  </div>

  <!-- ========== View 3: 历史 ========== -->
  <div class="view" id="view-history">
    <div class="content-scroll">
      <h1 class="page-title fade-in">占卜历史</h1>
      <div class="ornate-divider"></div>
      <div class="history-list" id="historyList">
        <div class="empty-state" id="historyEmpty">
          <span class="empty-icon">☯</span>
          <span class="empty-text">尚未有占卜记录</span>
        </div>
      </div>
      <div style="height:20px;"></div>
    </div>
  </div>

  <!-- ========== View 4: 我的 ========== -->
  <div class="view" id="view-profile">
    <div class="content-scroll">
      <h1 class="page-title fade-in">我的</h1>
      <div class="ornate-divider"></div>
      <div class="profile-section fade-in">
        <div class="menu-item"><span class="menu-item-label">六十四卦速查</span><span class="menu-item-arrow">›</span></div>
        <div class="menu-item"><span class="menu-item-label">起卦方式</span><span class="menu-item-value">三枚铜钱</span></div>
        <div class="menu-item"><span class="menu-item-label">应用版本</span><span class="menu-item-value">1.0.0</span></div>
        <div class="menu-item"><span class="menu-item-label">关于六爻</span><span class="menu-item-arrow">›</span></div>
      </div>
      <div style="height:20px;"></div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <div class="tab-pill">
      <div class="tab-item active" data-tab="0" onclick="switchTab(0)">
        <div class="tab-icon" style="border-radius:50%;"></div>
        <span class="tab-label">起卦</span>
      </div>
      <div class="tab-item" data-tab="1" onclick="switchTab(1)">
        <div class="tab-icon" style="border-radius:4px;"></div>
        <span class="tab-label">卦象</span>
      </div>
      <div class="tab-item" data-tab="2" onclick="switchTab(2)">
        <div class="tab-icon" style="border-radius:4px;"></div>
        <span class="tab-label">历史</span>
      </div>
      <div class="tab-item" data-tab="3" onclick="switchTab(3)">
        <div class="tab-icon" style="border-radius:4px;"></div>
        <span class="tab-label">我的</span>
      </div>
    </div>
  </div>
</div>

<script src="hexagrams-data.js"></script>
<script>
// ===== State =====
let currentTab = 0;
let currentRound = 0;
let roundResults = []; // [{yang: 0-3, type: 'yang'|'yin'|'old-yang'|'old-yin'}]
let isShaking = false;
let history = JSON.parse(localStorage.getItem('liuyao_history') || '[]');

// ===== Init =====
function init() {
  updateStatusTime();
  setInterval(updateStatusTime, 60000);
}
init();

function updateStatusTime() {
  const now = new Date();
  document.getElementById('statusTime').textContent =
    now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
}

// ===== Tab Switching =====
function switchTab(tabIdx) {
  currentTab = tabIdx;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(['view-divination','view-hexagram','view-history','view-profile'][tabIdx]).classList.add('active');
  document.querySelectorAll('.tab-item').forEach((t,i) => t.classList.toggle('active', i === tabIdx));
  if (tabIdx === 2) renderHistory();
}

// ===== Coin Shaking =====
function shakeCoins() {
  if (isShaking) return;
  if (currentRound >= 6) {
    // Reset
    currentRound = 0;
    roundResults = [];
    document.querySelectorAll('.round-row').forEach(r => { r.classList.remove('completed','current'); r.querySelector('.round-result').textContent = '——— 未摇'; });
    document.getElementById('viewResultBtn').disabled = true;
    document.getElementById('shakeBtn').textContent = '开始摇卦';
    const coins = document.querySelectorAll('#coinArea .coin');
    coins.forEach(c => {
      c.classList.remove('result-yang','result-yin');
      c.querySelector('.coin-label.top').textContent = '乾';
      c.querySelector('.coin-label.bottom').textContent = '隆';
    });
    return;
  }

  isShaking = true;
  document.getElementById('shakeBtn').disabled = true;

  // Animate coins
  const coins = document.querySelectorAll('#coinArea .coin');
  coins.forEach(c => c.classList.add('shaking'));

  setTimeout(() => {
    coins.forEach(c => c.classList.remove('shaking'));

    // Generate random result (3 coins, each heads=3 tails=2, sum: 6=old-yin, 7=yang, 8=yin, 9=old-yang)
    const coinVals = [];
    let sum = 0;
    for (let i = 0; i < 3; i++) {
      const isHead = Math.random() > 0.5;
      coinVals.push(isHead ? 3 : 2);
      sum += isHead ? 3 : 2;
      if (isHead) {
        coins[i].classList.add('result-yang');
        coins[i].classList.remove('result-yin');
        coins[i].querySelector('.coin-label.top').textContent = '⚊';
        coins[i].querySelector('.coin-label.bottom').textContent = '正';
      } else {
        coins[i].classList.add('result-yin');
        coins[i].classList.remove('result-yang');
        coins[i].querySelector('.coin-label.top').textContent = '⚋';
        coins[i].querySelector('.coin-label.bottom').textContent = '反';
      }
    }

    let type, display;
    switch(sum) {
      case 6: type = 'old-yin'; display = '⚋ ⚋  老阴 ×'; break;
      case 7: type = 'yang'; display = '⚊———  少阳'; break;
      case 8: type = 'yin'; display = '⚋ ⚋  少阴'; break;
      case 9: type = 'old-yang'; display = '⚊⚊⚊  老阳 ○'; break;
    }

    roundResults.push({ sum, type, display });

    // Update round row (from bottom up: round 0 = 初爻 = index 1 in UI)
    const roundIdx = currentRound;
    const rows = document.querySelectorAll('.round-row');
    const targetRow = rows[5 - roundIdx]; // bottom row first
    targetRow.classList.add('completed');
    targetRow.classList.remove('current');
    targetRow.querySelector('.round-result').textContent = display;

    currentRound++;

    // Mark next row as current
    if (currentRound < 6) {
      rows[5 - currentRound].classList.add('current');
      document.getElementById('shakeBtn').textContent = `摇第 ${currentRound + 1} 次 · ${['上爻','五爻','四爻','三爻','二爻','初爻'][currentRound]}`;
    } else {
      document.getElementById('shakeBtn').textContent = '重新起卦';
      document.getElementById('viewResultBtn').disabled = false;
      // Auto-save to history
      saveToHistory();
    }

    document.getElementById('shakeBtn').disabled = false;
    isShaking = false;
  }, 700);

  // Mark first row as current
  if (currentRound === 0) {
    document.querySelectorAll('.round-row')[5].classList.add('current');
  }
}

// ===== View Result =====
function viewResult() {
  if (roundResults.length < 6) return;
  renderHexagram();
  switchTab(1);
}

function saveToHistory() {
  const question = document.getElementById('questionInput').value || '未记录问题';
  const hexKey = roundResults.map(r => (r.sum === 7 || r.sum === 9) ? '1' : '0').join('');
  const changedKey = roundResults.map(r => {
    if (r.type === 'old-yang') return '0';
    if (r.type === 'old-yin') return '1';
    return (r.sum === 7 || r.sum === 9) ? '1' : '0';
  }).join('');

  const HEX = window.HEXAGRAMS || {};
  const hexData = HEX[hexKey] || { name: '未收录卦象', desc: '此卦象暂时未能识别。', yaos: [] };
  const record = {
    date: new Date().toLocaleString('zh-CN'),
    question,
    hexKey,
    changedKey,
    hexName: hexData.name,
    results: [...roundResults],
    timestamp: Date.now()
  };

  history.unshift(record);
  if (history.length > 50) history = history.slice(0, 50);
  localStorage.setItem('liuyao_history', JSON.stringify(history));
}

function renderHexagram() {
  const question = document.getElementById('questionInput').value || '未记录问题';
  document.getElementById('hexQuestion').textContent = question;

  const hexKey = roundResults.map(r => (r.sum === 7 || r.sum === 9) ? '1' : '0').join('');
  const changedKey = roundResults.map(r => {
    if (r.type === 'old-yang') return '0';
    if (r.type === 'old-yin') return '1';
    return (r.sum === 7 || r.sum === 9) ? '1' : '0';
  }).join('');

  const HEX = window.HEXAGRAMS || {};
  const mainHex = HEX[hexKey] || { name: '未收录卦象', desc: '此卦象暂时未能识别，请重试。', yaos: [], simpleYaos: [] };
  const chgHex = HEX[changedKey];

  document.getElementById('hexCard').style.display = '';
  document.getElementById('hexName').textContent = '本卦 · ' + mainHex.name;
  document.getElementById('hexDesc').textContent = mainHex.desc;

  // Main hex simple desc
  if (mainHex.simpleDesc) {
    document.getElementById('hexSimpleBadge').style.display = '';
    document.getElementById('hexSimpleDesc').textContent = mainHex.simpleDesc;
  } else {
    document.getElementById('hexSimpleBadge').style.display = 'none';
  }

  // Render hexagram diagram
  const diagram = document.getElementById('hexDiagram');
  diagram.innerHTML = '';
  for (let i = 5; i >= 0; i--) {
    const isYang = hexKey[i] === '1';
    const isChanging = roundResults[i].type === 'old-yang' || roundResults[i].type === 'old-yin';
    const changeColor = roundResults[i].type === 'old-yang' ? 'var(--accent)' : 'var(--accent-warm)';
    const div = document.createElement('div');
    if (isYang) {
      div.className = 'yao-line yang';
      if (isChanging) div.style.background = changeColor;
    } else {
      div.className = 'yao-line yin';
      div.innerHTML = '<span></span><span></span>';
      if (isChanging) {
        div.querySelectorAll('span').forEach(s => s.style.background = changeColor);
      }
    }
    diagram.appendChild(div);
  }

  if (chgHex && changedKey !== hexKey) {
    document.getElementById('changedName').textContent = '变卦 · ' + chgHex.name;
    document.getElementById('changedDesc').textContent = chgHex.desc;
    if (chgHex.simpleDesc) {
      document.getElementById('chgSimpleBadge').style.display = '';
      document.getElementById('chgSimpleDesc').textContent = chgHex.simpleDesc;
    } else {
      document.getElementById('chgSimpleBadge').style.display = 'none';
    }
  } else {
    document.getElementById('changedName').textContent = '变卦 · 不变';
    document.getElementById('changedDesc').textContent = '六爻皆静，没有变爻。此事当下宜守不宜变，顺应本卦之势即可。';
    document.getElementById('chgSimpleBadge').style.display = 'none';
  }

  // Find changing yaos
  const changingYaos = [];
  roundResults.forEach((r, i) => {
    if (r.type === 'old-yang' || r.type === 'old-yin') {
      changingYaos.push({ index: i, type: r.type, label: ['初爻','二爻','三爻','四爻','五爻','上爻'][i] });
    }
  });

  const yaoCard = document.getElementById('yaoCard');
  if (changingYaos.length > 0) {
    yaoCard.style.display = '';
    const cy = changingYaos[0];
    document.getElementById('yaoTitle').textContent = '变爻解读 · ' + cy.label;
    document.getElementById('yaoText').textContent = (mainHex.yaos && mainHex.yaos[cy.index]) ?
      (cy.label + '：' + mainHex.yaos[cy.index]) :
      '此爻变动提示决策中的关键转折点，需结合整体卦象参详。';

    // Simple yao interpretation
    if (mainHex.simpleYaos && mainHex.simpleYaos[cy.index]) {
      document.getElementById('yaoSimpleBadge').style.display = '';
      document.getElementById('yaoSimpleText').textContent = mainHex.simpleYaos[cy.index];
    } else {
      document.getElementById('yaoSimpleBadge').style.display = 'none';
    }
  } else {
    document.getElementById('yaoTitle').textContent = '卦象总论';
    document.getElementById('yaoText').textContent = mainHex.desc;
    document.getElementById('yaoSimpleBadge').style.display = 'none';
    yaoCard.style.display = '';
  }
}

// ===== History =====
function renderHistory() {
  const list = document.getElementById('historyList');
  if (history.length === 0) {
    list.innerHTML = '<div class="empty-state"><span class="empty-icon">☯</span><span class="empty-text">尚未有占卜记录</span></div>';
    return;
  }
  list.innerHTML = history.map((h, i) => `
    <div class="history-item fade-in" onclick="loadHistoryItem(${i})" style="animation-delay:${i*0.05}s;">
      <div class="history-item-header">
        <span class="history-hex-name">${h.hexName}</span>
        <span class="history-date">${h.date}</span>
      </div>
      <p class="history-question">${h.question}</p>
      <span class="history-result-tag">${h.results.filter(r => r.type === 'old-yang' || r.type === 'old-yin').length > 0 ? '有变爻' : '静卦'}</span>
    </div>
  `).join('');
}

function loadHistoryItem(idx) {
  const h = history[idx];
  roundResults = h.results;
  currentRound = 6;
  document.getElementById('questionInput').value = h.question;
  // Update round rows
  const rows = document.querySelectorAll('.round-row');
  for (let i = 0; i < 6; i++) {
    rows[5 - i].classList.add('completed');
    rows[5 - i].querySelector('.round-result').textContent = h.results[i].display;
  }
  document.getElementById('shakeBtn').textContent = '重新起卦';
  document.getElementById('viewResultBtn').disabled = false;
  renderHexagram();
  switchTab(1);
}
</script>

</body>
</html>
