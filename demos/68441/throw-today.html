      今天的烦恼已经烟消云散，<br>
      明天又是崭新的自己。"
    </p>
    <div class="done-stats">
      <div class="stat-item">
        <div class="stat-num" id="statWorry">0</div>
        <div class="stat-label">个烦恼</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statWeight">0</div>
        <div class="stat-label">斤压力</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statMood">+99</div>
        <div class="stat-label">好心情</div>
      </div>
    </div>
    <button class="btn-primary" onclick="goTo('splash')">再来一次</button>
  </div>
</div>

<script>
/* ==================== AUDIO ENGINE ==================== */
const AudioEngine = {
  ctx: null,
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
  },
  playTone(freq, type, duration, volume = 0.3) {
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + duration);
  },
  playCrush() {
    this.init();
    // Impact sound
    this.playTone(150, 'sawtooth', 0.15, 0.4);
    setTimeout(() => this.playTone(80, 'square', 0.2, 0.3), 50);
    // Glass shatter effect
    for (let i = 0; i < 8; i++) {
      setTimeout(() => {
        this.playTone(800 + Math.random() * 2000, 'sine', 0.1, 0.15);
      }, i * 30);
    }
  },
  playSuck() {
    this.init();
    // Descending whoosh
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 1.5);
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1.5);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 1.5);
  },
  playBurn() {
    this.init();
    // Fire crackle simulation
    for (let i = 0; i < 15; i++) {
      setTimeout(() => {
        this.playTone(200 + Math.random() * 600, 'sawtooth', 0.08, 0.2);
      }, i * 60);
    }
    // Rising flame
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(200, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(600, this.ctx.currentTime + 1);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1.2);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 1.2);
  },
  playSuccess() {
    this.init();
    // Ascending chime
    [523, 659, 784, 1047].forEach((freq, i) => {
      setTimeout(() => this.playTone(freq, 'sine', 0.4, 0.25), i * 150);
    });
  }
};

/* ==================== VIBRATION ==================== */
function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

/* ==================== NAVIGATION ==================== */
const pages = ['splash', 'input', 'generate', 'choose', 'crush', 'blackhole', 'burn', 'done'];
let currentPage = 'splash';
let worryText = '';
let destroyCount = parseInt(localStorage.getItem('throwToday_count') || '0');

function goTo(pageName) {
  if (!pages.includes(pageName)) return;

  // Update progress bar
  const idx = pages.indexOf(pageName);
  const progress = (idx / (pages.length - 1)) * 100;
  document.getElementById('progressFill').style.width = progress + '%';

  // Hide all pages
  document.querySelectorAll('.page').forEach(p => {
    p.classList.remove('active');
  });

  // Show target page
  const target = document.getElementById('page-' + pageName);
  if (target) {
    target.classList.add('active');
    currentPage = pageName;
  }

  // Page-specific logic
  if (pageName === 'generate') startGenerateAnimation();
  if (pageName === 'crush') startCrushAnimation();
  if (pageName === 'blackhole') startBlackholeAnimation();
  if (pageName === 'burn') startBurnAnimation();
  if (pageName === 'done') startDoneAnimation();
  if (pageName === 'splash') resetApp();
}

function resetApp() {
  document.getElementById('worryInput').value = '';
  document.getElementById('micText').textContent = '点击麦克风，对着手机吐槽';
  document.getElementById('micBtn').classList.remove('recording');
  worryText = '';
}

/* ==================== INPUT PAGE ==================== */
let recording = false;
function toggleRecording() {
  const btn = document.getElementById('micBtn');
  const text = document.getElementById('micText');

  if (!recording) {
    recording = true;
    btn.classList.add('recording');
    text.textContent = '正在聆听...（点击停止）';
    AudioEngine.playTone(600, 'sine', 0.2);
    vibrate(50);

    // Simulate recording for demo
    setTimeout(() => {
      if (recording) {
        document.getElementById('worryInput').value = '今天又被老板无理要求加班，明明已经做完了所有工作，还要我坐在办公室装作很忙的样子，真的好烦啊！';
        toggleRecording();
      }
    }, 3000);
  } else {
    recording = false;
    btn.classList.remove('recording');
    text.textContent = '点击麦克风，对着手机吐槽';
    AudioEngine.playTone(400, 'sine', 0.15);
    vibrate([30, 50, 30]);
  }
}

function submitWorry() {
  worryText = document.getElementById('worryInput').value.trim();
  if (!worryText) {
    document.getElementById('worryInput').placeholder = '请先输入或说出你的烦恼~';
    vibrate(100);
    return;
  }
  AudioEngine.playTone(500, 'sine', 0.2);
  goTo('generate');
}

/* ==================== GENERATE PAGE ==================== */
function startGenerateAnimation() {
  const texts = [
    '正在凝聚你的烦恼...',
    '感受到了...压力在聚集...',
    '一颗烦恼小黑球诞生了'
  ];
  const textEl = document.getElementById('generateText');
  const ball = document.getElementById('worryBall');

  // Create orbiting particles
  const particlesContainer = document.getElementById('particles');
  particlesContainer.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.animationDelay = (i * 0.5) + 's';
    p.style.width = (4 + Math.random() * 6) + 'px';
    p.style.height = p.style.width;
    particlesContainer.appendChild(p);
  }

  // Update face based on worry length
  const faces = ['😤', '😠', '😣', '😫', '🤯'];
  const faceIndex = Math.min(Math.floor(worryText.length / 20), faces.length - 1);
  ball.querySelector('.ball-face').textContent = faces[faceIndex];

  // Text sequence
  texts.forEach((t, i) => {
    setTimeout(() => {
      textEl.textContent = t;
      AudioEngine.playTone(300 + i * 100, 'sine', 0.15, 0.2);
    }, i * 1500);
  });

  // Go to choose page
  setTimeout(() => {
    goTo('choose');
  }, 5000);
}

/* ==================== CHOOSE PAGE ==================== */
function chooseDestroy(method) {
  AudioEngine.playTone(600, 'sine', 0.15);
  vibrate(50);
  goTo(method);
}

/* ==================== CRUSH ANIMATION ==================== */
function startCrushAnimation() {
  const ball = document.getElementById('crushBall');
  const hand = document.getElementById('crushHand');
  const cracks = document.getElementById('crackLines');
  const shards = document.getElementById('shards');

  // Reset
  ball.style.animation = 'none';
  ball.offsetHeight; // trigger reflow
  ball.style.animation = '';
  hand.style.animation = 'none';
  hand.offsetHeight;
  hand.style.animation = '';

  // Create crack lines
  cracks.innerHTML = '';
  for (let i = 0; i < 8; i++) {
    const line = document.createElement('div');
    line.className = 'crack-line';
    line.style.transform = `rotate(${i * 45}deg) translateY(-30px)`;
    line.style.height = (40 + Math.random() * 30) + 'px';
    cracks.appendChild(line);
  }

  // Create shards
  shards.innerHTML = '';
  for (let i = 0; i < 12; i++) {
    const shard = document.createElement('div');
    shard.className = 'shard';
    const angle = (i / 12) * Math.PI * 2;
    const dist = 60 + Math.random() * 80;
    shard.style.left = Math.cos(angle) * dist + 'px';
    shard.style.top = Math.sin(angle) * dist + 'px';
    shard.style.transform = `rotate(${Math.random() * 360}deg)`;
    shard.style.animation = `shardFly 0.5s ease forwards`;
    shard.style.animationDelay = (1.2 + Math.random() * 0.2) + 's';
    shards.appendChild(shard);
  }

  // Add shard fly animation dynamically
  const style = document.createElement('style');
  style.textContent = `
    @keyframes shardFly {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0) translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px); }
    }
  `;
  document.head.appendChild(style);

  // Play sound
  setTimeout(() => {
    AudioEngine.playCrush();
    vibrate([50, 30, 80, 40, 60]);
    fireConfetti();
  }, 1000);

  // Go to done
  setTimeout(() => {
    goTo('done');
  }, 3000);
}

/* ==================== BLACKHOLE ANIMATION ==================== */
function startBlackholeAnimation() {
  const ball = document.getElementById('suckBall');

  // Reset
  ball.style.animation = 'none';
  ball.offsetHeight;
  ball.style.animation = '';

  setTimeout(() => {
    AudioEngine.playSuck();
    vibrate([30, 50, 40, 60, 30, 40, 20]);
  }, 300);

  setTimeout(() => {
    goTo('done');
  }, 3000);
}

/* ==================== BURN ANIMATION ==================== */
function startBurnAnimation() {
  const ball = document.getElementById('burnBall');

  // Reset
  ball.style.animation = 'none';
  ball.offsetHeight;
  ball.style.animation = '';

  setTimeout(() => {
    AudioEngine.playBurn();
    vibrate([40, 60, 50, 70, 40, 50, 30, 40]);
    fireConfetti();
  }, 300);

  setTimeout(() => {
    goTo('done');
  }, 3000);
}

/* ==================== DONE PAGE ==================== */
const quotes = [
  '"每一个结束都是新的开始。<br>今天的烦恼已经烟消云散，<br>明天又是崭新的自己。"',
  '"你已经很棒了。<br>职场的风雨终会过去，<br>而你的坚强一直都在。"',
  '"把烦恼留在今天，<br>把轻松带回家。<br>你爱的人正在等你微笑。"',
  '"深呼吸...<br>感受身体的放松。<br>那些不愉快，已经与你无关了。"',
  '"今天的你，又勇敢地<br>跨过了一个坎。<br>请为自己骄傲。"'
];

function startDoneAnimation() {
  destroyCount++;
  localStorage.setItem('throwToday_count', destroyCount);

  // Random quote
  const quote = quotes[Math.floor(Math.random() * quotes.length)];
  document.getElementById('doneQuote').innerHTML = quote;

  // Stats
  const weight = Math.floor(worryText.length / 5) + 1;
  animateNumber('statWorry', destroyCount, 1000);
  animateNumber('statWeight', weight, 1000);
  animateNumber('statMood', 99, 1000);

  AudioEngine.playSuccess();
  vibrate([50, 100, 50]);

  // Background particles
  for (let i = 0; i < 20; i++) {
    setTimeout(() => createFloatingParticle(), i * 100);
  }
}

function animateNumber(id, target, duration) {
  const el = document.getElementById(id);
  const start = parseInt(el.textContent) || 0;
  const startTime = performance.now();

  function update(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.floor(start + (target - start) * eased);
    if (progress < 1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

/* ==================== PARTICLE SYSTEM ==================== */
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
let particlesArr = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type;
    this.size = Math.random() * 4 + 2;
    this.speedX = (Math.random() - 0.5) * 8;
    this.speedY = (Math.random() - 0.5) * 8;
    this.life = 1;
    this.decay = 0.01 + Math.random() * 0.02;
    this.color = type === 'crush'
      ? `hsl(${Math.random() * 60 + 200}, 70%, 70%)`
      : type === 'burn'
        ? `hsl(${Math.random() * 40 + 10}, 90%, 60%)`
        : `hsl(${Math.random() * 60 + 240}, 80%, 70%)`;
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    this.speedY += 0.1;
    this.life -= this.decay;
    this.size *= 0.98;
  }
  draw() {
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function fireConfetti() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  for (let i = 0; i < 40; i++) {
    particlesArr.push(new Particle(cx, cy, 'crush'));
  }
}

function createFloatingParticle() {
  const p = new Particle(
    Math.random() * canvas.width,
    canvas.height + 10,
    'float'
  );
  p.speedY = -Math.random() * 3 - 1;
  p.speedX = (Math.random() - 0.5) * 2;
  p.decay = 0.005;
  p.color = `hsl(${Math.random() * 60 + 160}, 70%, 75%)`;
  particlesArr.push(p);
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particlesArr = particlesArr.filter(p => p.life > 0);
  particlesArr.forEach(p => {
    p.update();
    p.draw();
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

/* ==================== INIT ==================== */
// Initial progress
updateProgress();
function updateProgress() {
  const idx = pages.indexOf(currentPage);
  document.getElementById('progressFill').style.width = (idx / (pages.length - 1) * 100) + '%';
}
</script>
