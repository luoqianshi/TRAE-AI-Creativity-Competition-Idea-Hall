<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>工业检测赛道 · 人脸检测演示</title>
    <!-- 使用 TensorFlow.js 和 face-detection 模型 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0/dist/tf-core.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.22.0/dist/tf-converter.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.22.0/dist/tf-backend-webgl.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-detection@1.0.2/dist/face-detection.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b1a2f;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #142b44;
            border-radius: 32px;
            padding: 28px 24px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 255, 200, 0.15);
            transition: all 0.2s;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #e3f0ff;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .badge {
            background: #2a4b6e;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #b6d9ff;
            border: 1px solid #3e6a94;
            letter-spacing: 0.3px;
        }
        .subhead {
            color: #9bc0e6;
            font-size: 1rem;
            margin-bottom: 20px;
            border-left: 3px solid #3ccfcf;
            padding-left: 16px;
            background: rgba(60, 207, 207, 0.06);
            border-radius: 0 12px 12px 0;
            line-height: 1.5;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #0a1829;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.6), 0 8px 24px rgba(0, 30, 60, 0.5);
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scaleX(-1); /* 镜像，更自然的自拍视角 */
        }
        #overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: scaleX(-1); /* 与视频镜像一致 */
        }
        .status-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 16px;
            background: #0d233b;
            padding: 14px 20px;
            border-radius: 40px;
            margin: 8px 0 16px;
            border: 1px solid #295073;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #d2e6ff;
            font-size: 0.95rem;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #3ccfcf;
            box-shadow: 0 0 12px #3ccfcf88;
            transition: 0.2s;
        }
        .status-dot.inactive {
            background: #6b7f96;
            box-shadow: none;
        }
        .status-dot.detecting {
            background: #f5b342;
            box-shadow: 0 0 16px #f5b342aa;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 12px 0 10px;
        }
        .btn {
            background: #1f405f;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #e3f0ff;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #34668b;
            flex: 1 0 auto;
            justify-content: center;
            letter-spacing: 0.4px;
        }
        .btn-primary {
            background: #1f7b7b;
            border-color: #3ccfcf;
            color: white;
            box-shadow: 0 2px 8px rgba(60, 207, 207, 0.3);
        }
        .btn-primary:hover {
            background: #269999;
            transform: scale(1.01);
            box-shadow: 0 4px 14px rgba(60, 207, 207, 0.4);
        }
        .btn-secondary {
            background: #2c3f55;
            border-color: #4d6d8a;
        }
        .btn-secondary:hover {
            background: #3a5672;
        }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.4);
        }
        .footnote {
            margin-top: 24px;
            font-size: 0.85rem;
            color: #7d9fc7;
            text-align: center;
            border-top: 1px solid #1f3e5a;
            padding-top: 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px 28px;
        }
        .footnote span {
            background: #102f47;
            padding: 4px 16px;
            border-radius: 30px;
            border: 1px solid #28537a;
        }
        #face-count {
            font-weight: 700;
            color: #b6e6ff;
            min-width: 28px;
            display: inline-block;
        }
        .loader-text {
            color: #8ab3da;
            font-size: 0.9rem;
        }
        @media (max-width: 500px) {
            .container { padding: 16px; }
            h1 { font-size: 1.5rem; }
            .status-panel { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            ⚙️ 工业检测赛道
            <span class="badge">人脸检测 · 原型</span>
        </h1>
        <div class="subhead">
            👁️ 实时人脸定位 · 轻量化 AI 视觉检测 · 适用于产线/安防/质检
        </div>

        <!-- 视频 + 叠加 Canvas -->
        <div class="video-wrapper">
            <video id="video" autoplay playsinline></video>
            <canvas id="overlay-canvas"></canvas>
        </div>

        <!-- 状态信息 -->
        <div class="status-panel">
            <div class="status-item">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusLabel">等待启动</span>
            </div>
            <div class="status-item">
                <span>👤 检测到</span>
                <span id="face-count">0</span>
                <span>张人脸</span>
            </div>
            <div class="status-item">
                <span>📐 模型</span>
                <span style="font-weight:300;">MediaPipe</span>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="btn-group">
            <button class="btn btn-primary" id="startBtn">▶ 启动检测</button>
            <button class="btn btn-secondary" id="stopBtn" disabled>⏹ 停止</button>
        </div>

        <div class="footnote">
            <span>🏭 工业检测 · 概念验证</span>
            <span>📡 实时推理 (TRAE Work 生成)</span>
            <span>🧩 附加赛题 · 社会公益</span>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ----- DOM 元素 -----
            const video = document.getElementById('video');
            const canvas = document.getElementById('overlay-canvas');
            const ctx = canvas.getContext('2d');

            const statusDot = document.getElementById('statusDot');
            const statusLabel = document.getElementById('statusLabel');
            const faceCountSpan = document.getElementById('face-count');

            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');

            // ----- 状态变量 -----
            let detectionRunning = false;
            let animationFrame = null;
            let detector = null;              // 检测器实例
            let stream = null;               // 摄像头流

            // ----- 初始化 Canvas 尺寸 (匹配视频) -----
            function resizeCanvas() {
                const rect = video.getBoundingClientRect();
                // 实际渲染尺寸与 CSS 一致，但 canvas 需要像素精确
                const w = video.videoWidth || rect.width || 640;
                const h = video.videoHeight || rect.height || 480;
                canvas.width = w;
                canvas.height = h;
                // 确保显示比例不变
                canvas.style.width = '100%';
                canvas.style.height = '100%';
            }

            // ----- 更新状态显示 -----
            function setStatus(text, isActive = false, isDetecting = false) {
                statusLabel.textContent = text;
                if (isDetecting) {
                    statusDot.className = 'status-dot detecting';
                } else if (isActive) {
                    statusDot.className = 'status-dot';
                } else {
                    statusDot.className = 'status-dot inactive';
                }
            }

            // ----- 绘制检测结果 (人脸框 + 关键点) -----
            function drawDetections(faces) {
                const w = canvas.width;
                const h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                if (!faces || faces.length === 0) {
                    faceCountSpan.textContent = '0';
                    return;
                }

                faceCountSpan.textContent = faces.length;

                // 遍历每个人脸
                for (const face of faces) {
                    // 获取边界框 (MediaPipe 返回 normalized 坐标)
                    const box = face.box;
                    if (!box) continue;

                    // 归一化坐标 -> 像素
                    const x = box.xMin * w;
                    const y = box.yMin * h;
                    const width = (box.xMax - box.xMin) * w;
                    const height = (box.yMax - box.yMin) * h;

                    // ----- 绘制半透明背景 + 边框 (工业风格) -----
                    ctx.save();
                    // 外发光效果
                    ctx.shadowColor = '#3ccfcf';
                    ctx.shadowBlur = 14;

                    // 边框线 (亮青色)
                    ctx.strokeStyle = '#3ccfcf';
                    ctx.lineWidth = Math.max(2.5, Math.min(5, w / 200));
                    ctx.shadowBlur = 18;
                    ctx.strokeRect(x, y, width, height);

                    // 内层细线 (增加科技感)
                    ctx.shadowBlur = 6;
                    ctx.strokeStyle = '#a0e8e8';
                    ctx.lineWidth = 1.2;
                    ctx.strokeRect(x + 3, y + 3, width - 6, height - 6);

                    // 角落标记 (工业检测风格)
                    const cornerLen = Math.min(16, width * 0.15, height * 0.15);
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#9efff0';
                    ctx.shadowBlur = 12;
                    // 左上
                    ctx.beginPath();
                    ctx.moveTo(x, y + cornerLen);
                    ctx.lineTo(x, y);
                    ctx.lineTo(x + cornerLen, y);
                    ctx.stroke();
                    // 右上
                    ctx.beginPath();
                    ctx.moveTo(x + width - cornerLen, y);
                    ctx.lineTo(x + width, y);
                    ctx.lineTo(x + width, y + cornerLen);
                    ctx.stroke();
                    // 左下
                    ctx.beginPath();
                    ctx.moveTo(x, y + height - cornerLen);
                    ctx.lineTo(x, y + height);
                    ctx.lineTo(x + cornerLen, y + height);
                    ctx.stroke();
                    // 右下
                    ctx.beginPath();
                    ctx.moveTo(x + width - cornerLen, y + height);
                    ctx.lineTo(x + width, y + height);
                    ctx.lineTo(x + width, y + height - cornerLen);
                    ctx.stroke();

                    ctx.restore();

                    // ----- 关键点 (眼睛, 鼻子, 嘴巴等) -----
                    if (face.keypoints && face.keypoints.length > 0) {
                        ctx.save();
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#3ccfcf';
                        for (const kp of face.keypoints) {
                            const kx = kp.x * w;
                            const ky = kp.y * h;
                            ctx.beginPath();
                            ctx.arc(kx, ky, 3.5, 0, 2 * Math.PI);
                            ctx.fillStyle = '#ffd966';
                            ctx.shadowColor = '#f5b342';
                            ctx.fill();
                            ctx.shadowBlur = 0;
                            ctx.strokeStyle = '#1f3a4b';
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                        ctx.restore();
                    }

                    // 显示置信度 (如果有)
                    if (face.probability !== undefined) {
                        ctx.save();
                        ctx.font = `${Math.max(12, w/36)}px "Segoe UI", monospace`;
                        ctx.fillStyle = '#d4f0ff';
                        ctx.shadowColor = '#0a1f2e';
                        ctx.shadowBlur = 8;
                        const conf = (face.probability * 100).toFixed(1);
                        ctx.fillText(`置信 ${conf}%`, x + 6, y - 8);
                        ctx.restore();
                    }
                }
            }

            // ----- 核心检测循环 (不断从视频帧推理) -----
            async function detectLoop() {
                if (!detectionRunning) return;

                try {
                    // 检查视频是否就绪
                    if (video.readyState < 2) {
                        // 视频未就绪，等待下一帧
                        animationFrame = requestAnimationFrame(detectLoop);
                        return;
                    }

                    // 确保 canvas 尺寸匹配
                    if (canvas.width === 0 || canvas.height === 0) {
                        resizeCanvas();
                    }

                    // 执行检测 (MediaPipe 需要视频元素)
                    if (detector) {
                        // 使用 estimateFaces 并传入视频
                        const faces = await detector.estimateFaces(video, {
                            flipHorizontal: true,   // 因为视频镜像，所以检测也镜像
                        });

                        // 更新界面
                        drawDetections(faces);

                        // 状态更新
                        if (faces.length > 0) {
                            setStatus('检测中 (人脸)', true, true);
                        } else {
                            setStatus('检测中 (无人脸)', true, false);
                        }
                    } else {
                        // 探测器未初始化
                        setStatus('模型加载中...', false);
                    }

                } catch (err) {
                    console.warn('检测循环错误:', err);
                    setStatus('检测异常', false);
                }

                // 继续下一帧
                if (detectionRunning) {
                    animationFrame = requestAnimationFrame(detectLoop);
                }
            }

            // ----- 启动摄像头 + 初始化检测器 -----
            async function startDetection() {
                if (detectionRunning) return;

                try {
                    setStatus('请求摄像头...', false);
                    startBtn.disabled = true;

                    // 1. 获取摄像头流
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'user',
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        },
                        audio: false,
                    });
                    video.srcObject = stream;
                    await video.play();

                    // 2. 等待视频元数据加载
                    await new Promise((resolve) => {
                        if (video.videoWidth > 0 && video.videoHeight > 0) {
                            resolve();
                        } else {
                            video.onloadedmetadata = () => resolve();
                        }
                    });

                    resizeCanvas();

                    // 3. 加载人脸检测模型 (MediaPipe)
                    setStatus('加载 AI 模型...', false);
                    const model = faceDetection.SupportedModels.MediaPipeFaceDetector;
                    detector = await faceDetection.createDetector(model, {
                        runtime: 'tfjs',
                        modelType: 'full',   // 更准确
                        maxFaces: 10,
                    });

                    // 4. 启动检测循环
                    detectionRunning = true;
                    stopBtn.disabled = false;
                    startBtn.disabled = true;

                    setStatus('检测运行中', true, false);
                    detectLoop();

                } catch (error) {
                    console.error('启动失败:', error);
                    setStatus('启动失败: ' + (error.message || '未知错误'), false);
                    // 恢复按钮
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    // 释放流
                    if (stream) {
                        stream.getTracks().forEach(t => t.stop());
                        stream = null;
                    }
                    video.srcObject = null;
                }
            }

            // ----- 停止检测 -----
            function stopDetection() {
                if (!detectionRunning) return;

                detectionRunning = false;
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }

                // 清除画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                faceCountSpan.textContent = '0';
                setStatus('已停止', false);

                // 停止摄像头
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                    stream = null;
                }
                video.srcObject = null;
                video.pause();

                // 释放检测器
                if (detector) {
                    detector.dispose && detector.dispose();
                    detector = null;
                }

                // 更新按钮
                startBtn.disabled = false;
                stopBtn.disabled = true;
                statusDot.className = 'status-dot inactive';
            }

            // ----- 页面卸载时清理 -----
            function cleanup() {
                stopDetection();
            }

            // ----- 绑定事件 -----
            startBtn.addEventListener('click', startDetection);
            stopBtn.addEventListener('click', stopDetection);
            window.addEventListener('beforeunload', cleanup);

            // 初次状态
            setStatus('就绪，点击启动', false);
            faceCountSpan.textContent = '0';

            // 额外：窗口尺寸变化调整 canvas
            window.addEventListener('resize', () => {
                if (detectionRunning && video.videoWidth) {
                    resizeCanvas();
                }
            });

            console.log('工业检测 · 人脸检测原型 (TRAE Work) 已加载');
        })();
    </script>
</body>
</html>
