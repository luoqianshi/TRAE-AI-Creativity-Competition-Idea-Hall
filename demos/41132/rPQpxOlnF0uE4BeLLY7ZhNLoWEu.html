<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多功能工具箱</title>
<style>
*{
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
}
:root{
--page-bg: #f7f8fc;
--card-bg: rgba(255, 255, 255, 0.72);
--边框浅: rgba(180, 186, 205, 0.28);
--主文字: #1d2133;
--次文字: #646b8c;
--主题色: #5668e3;
--主题浅: #7987f0;
--柔和阴影: 0 6px 28px rgba(86, 104, 227, 0.08);
--悬浮阴影: 0 10px 36px rgba(86, 104, 227, 0.12);
--模糊度: 16px;
--过渡统一: all 0.26s cubic-bezier(0.22, 0, 0.2, 1);
}
body{
background-color: var(--page-bg);
background-image:
radial-gradient(circle at 5% 10%, rgba(86, 104, 227, 0.06) 0, transparent 35%),
radial-gradient(circle at 95% 90%, rgba(86, 104, 227, 0.04) 0, transparent 40%);
min-height: 100vh;
padding: 64px 24px;
color: var(--主文字);
}
.容器{
max-width: 1120px;
margin: 0 auto;
}
.头部区域{
text-align: center;
margin-bottom: 52px;
}
.头部区域 h1{
font-size: 38px;
font-weight: 350;
letter-spacing: 0.08em;
margin-bottom: 10px;
}
.头部区域 p{
font-size: 15px;
color: var(--次文字);
letter-spacing: 0.03em;
}
.标签导航{
display: flex;
gap: 10px;
justify-content: center;
flex-wrap: wrap;
margin-bottom: 38px;
}
.标签按钮{
border: 1px solid var(--边框浅);
background: transparent;
color: var(--次文字);
padding: 13px 28px;
border-radius: 999px;
font-size: 14px;
cursor: pointer;
backdrop-filter: blur(var(--模糊度));
-webkit-backdrop-filter: blur(var(--模糊度));
transition: var(--过渡统一);
}
.标签按钮:hover{
border-color: rgba(86, 104, 227, 0.3);
color: var(--主文字);
}
.标签按钮.激活{
background: linear-gradient(90deg, var(--主题色), var(--主题浅));
border: none;
color: #ffffff;
box-shadow: var(--柔和阴影);
}
.主面板{
background: var(--card-bg);
border: 1px solid var(--边框浅);
border-radius: 22px;
padding: 44px;
backdrop-filter: blur(var(--模糊度));
-webkit-backdrop-filter: blur(var(--模糊度));
box-shadow: var(--柔和阴影);
min-height: 480px;
}
.功能面板{
display: none;
}
.功能面板.激活{
display: block;
animation: 面板淡入 0.34s ease forwards;
}
@keyframes 面板淡入{
0%{opacity: 0; transform: translateY(12px);}
100%{opacity: 1; transform: translateY(0);}
}
.模块标题{
font-size: 22px;
font-weight: 400;
margin-bottom: 30px;
letter-spacing: 0.02em;
}
.输入框, textarea, select{
width: 100%;
background: rgba(255, 255, 255, 0.85);
border: 1px solid var(--边框浅);
border-radius: 12px;
padding: 16px 20px;
font-size: 15px;
color: var(--主文字);
margin-bottom: 18px;
outline: none;
transition: var(--过渡统一);
}
.输入框:focus, textarea:focus, select:focus{
border-color: rgba(86, 104, 227, 0.38);
box-shadow: 0 0 0 3px rgba(86, 104, 227, 0.08);
}
textarea{
min-height: 145px;
resize: vertical;
line-height: 1.65;
}
.操作按钮组{
display: flex;
gap: 10px;
flex-wrap: wrap;
margin-bottom: 26px;
}
.普通按钮{
padding: 12px 24px;
border: 1px solid var(--边框浅);
background: transparent;
border-radius: 10px;
font-size: 14px;
color: var(--次文字);
cursor: pointer;
transition: var(--过渡统一);
}
.普通按钮:hover{
border-color: rgba(86, 104, 227, 0.26);
color: var(--主文字);
background: rgba(86, 104, 227, 0.05);
}
.主要按钮{
background: linear-gradient(90deg, var(--主题色), var(--主题浅));
border: none;
color: #fff;
}
.主要按钮:hover{
opacity: 0.93;
box-shadow: var(--悬浮阴影);
}
.结果展示框{
width: 100%;
min-height: 95px;
padding: 20px;
background: rgba(255, 255, 255, 0.6);
border: 1px solid var(--边框浅);
border-radius: 12px;
color: var(--次文字);
word-break: break-all;
line-height: 1.7;
}
.色彩预览块{
width: 100%;
height: 115px;
border-radius: 12px;
border: 1px solid var(--边框浅);
margin: 18px 0 26px;
}
.二维码容器{
display: flex;
justify-content: center;
margin-top: 22px;
}
@media(max-width:768px){
body{padding: 36px 16px;}
.头部区域 h1{font-size: 28px;}
.主面板{padding: 28px;}
.操作按钮组{gap: 8px;}
.普通按钮{padding: 10px 16px;}
}
</style>
</head>
<body>
<div class="容器">
<div class="头部区域">
<h1>多功能工具箱</h1>
<p>离线前端综合工具集合</p>
</div>

<div class="标签导航">
<button class="标签按钮 激活" data-id="文本">文本处理</button>
<button class="标签按钮" data-id="二维码">二维码生成</button>
<button class="标签按钮" data-id="色彩">色彩转换</button>
<button class="标签按钮" data-id="加密">哈希加密</button>
<button class="标签按钮" data-id="时间戳">时间戳转换</button>
</div>

<div class="主面板">
<!-- 文本处理 -->
<div class="功能面板 激活" id="文本">
<h2 class="模块标题">文本处理模块</h2>
<textarea id="文本输入框" placeholder="在此输入需要处理的原始内容"></textarea>
<div class="操作按钮组">
<button class="普通按钮" onclick="处理文本('大写')">全部大写</button>
<button class="普通按钮" onclick="处理文本('小写')">全部小写</button>
<button class="普通按钮" onclick="处理文本('去空格')">清除全部空格</button>
<button class="普通按钮" onclick="处理文本('反转')">文字反转</button>
<button class="普通按钮 主要按钮" onclick="复制内容('文本结果')">复制输出内容</button>
</div>
<div class="结果展示框" id="文本结果">处理完成后的内容将显示在此处</div>
</div>

<!-- 二维码 -->
<div class="功能面板" id="二维码">
<h2 class="模块标题">二维码生成工具</h2>
<input class="输入框" id="二维码输入" placeholder="输入网址、文字或任意文本">
<div class="操作按钮组">
<button class="普通按钮 主要按钮" onclick="生成二维码()">生成二维码</button>
</div>
<div class="二维码容器" id="二维码画布"></div>
</div>

<!-- 色彩转换 -->
<div class="功能面板" id="色彩">
<h2 class="模块标题">色彩格式转换</h2>
<input class="输入框" type="color" id="取色器" oninput="刷新色彩信息()">
<div class="色彩预览块" id="色彩预览"></div>
<input class="输入框" readonly id="十六进制颜色">
<input class="输入框" readonly id="rgb颜色">
<div class="操作按钮组">
<button class="普通按钮 主要按钮" onclick="复制色彩值()">复制色彩代码</button>
</div>
</div>

<!-- 哈希加密 -->
<div class="功能面板" id="加密">
<h2 class="模块标题">哈希加密计算</h2>
<input class="输入框" id="加密输入" placeholder="输入需要加密的明文">
<select class="输入框" id="加密类型">
<option value="md5">MD5</option>
<option value="sha1">SHA1</option>
<option value="sha256">SHA256</option>
</select>
<div class="操作按钮组">
<button class="普通按钮 主要按钮" onclick="计算哈希()">生成加密字符串</button>
</div>
<div class="结果展示框" id="加密结果">加密后的哈希值</div>
</div>

<!-- 时间戳 -->
<div class="功能面板" id="时间戳">
<h2 class="模块标题">时间戳与日期互转</h2>
<input class="输入框" id="时间戳输入" placeholder="输入13位毫秒级时间戳">
<div class="操作按钮组">
<button class="普通按钮" onclick="时间戳转日期()">时间戳转北京时间</button>
<button class="普通按钮 主要按钮" onclick="获取当前时间戳()">获取当前时间戳</button>
</div>
<div class="结果展示框" id="时间戳结果">转换后的日期时间</div>
</div>
</div>
</div>

<script>
// 标签切换逻辑
const 全部标签 = document.querySelectorAll('.标签按钮');
const 全部面板 = document.querySelectorAll('.功能面板');
全部标签.forEach(按钮 => {
按钮.addEventListener('click', () => {
const 目标id = 按钮.dataset.id;
全部标签.forEach(b => b.classList.remove('激活'));
全部面板.forEach(p => p.classList.remove('激活'));
按钮.classList.add('激活');
document.getElementById(目标id).classList.add('激活');
})
})

// 文本处理函数
function 处理文本(类型){
const 原文 = document.getElementById('文本输入框').value;
let 输出内容 = '';
switch(类型){
case '大写': 输出内容 = 原文.toUpperCase(); break;
case '小写': 输出内容 = 原文.toLowerCase(); break;
case '去空格': 输出内容 = 原文.replace(/\s+/g, ''); break;
case '反转': 输出内容 = 原文.split('').reverse().join(''); break;
}
document.getElementById('文本结果').innerText = 输出内容;
}

// 通用复制
async function 复制内容(元素id){
const 文字 = document.getElementById(元素id).innerText;
await navigator.clipboard.writeText(文字);
alert('复制完成');
}

// 色彩模块
function 刷新色彩信息(){
const 色值 = document.getElementById('取色器').value;
document.getElementById('色彩预览').style.background = 色值;
document.getElementById('十六进制颜色').value = 'HEX：' + 色值;
const r = parseInt(色值.slice(1,3),16);
const g = parseInt(色值.slice(3,5),16);
const b = parseInt(色值.slice(5,7),16);
document.getElementById('rgb颜色').value = `RGB：${r}，${g}，${b}`;
}
async function 复制色彩值(){
const 颜色文本 = document.getElementById('十六进制颜色').value;
await navigator.clipboard.writeText(颜色文本);
alert('色彩代码已复制');
}

// 时间戳转换
function 时间戳转日期(){
const 戳 = document.getElementById('时间戳输入').value.trim();
if(!戳) return alert('请填写时间戳');
const 日期对象 = new Date(Number(戳));
const 本地时间 = 日期对象.toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'});
document.getElementById('时间戳结果').innerText = '北京时间：' + 本地时间;
}
function 获取当前时间戳(){
const 现在戳 = Date.now();
document.getElementById('时间戳结果').innerText = '当前时间戳：' + 现在戳;
document.getElementById('时间戳输入').value = 现在戳;
}

// 动态加载工具库
const qr脚本 = document.createElement('script');
qr脚本.src = 'https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js';
document.head.appendChild(qr脚本);

const 加密脚本 = document.createElement('script');
加密脚本.src = 'https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js';
document.head.appendChild(加密脚本);

// 生成二维码
function 生成二维码(){
const 内容 = document.getElementById('二维码输入').value.trim();
if(!内容) return alert('请输入二维码内容');
const 盒子 = document.getElementById('二维码画布');
盒子.innerHTML = '';
QRCode.toCanvas(盒子, 内容, {
width: 220,
margin: 2,
color: {dark:'#5668e3', light:'#ffffff'}
}, err => {if(err) console.error(err)});
}

// 哈希加密计算
function 计算哈希(){
const 明文 = document.getElementById('加密输入').value;
const 模式 = document.getElementById('加密类型').value;
if(!明文) return alert('请输入加密文本');
let 结果;
switch(模式){
case 'md5': 结果 = CryptoJS.MD5(明文).toString(); break;
case 'sha1': 结果 = CryptoJS.SHA1(明文).toString(); break;
case 'sha256': 结果 = CryptoJS.SHA256(明文).toString(); break;
}
document.getElementById('加密结果').innerText = 模式.toUpperCase() + ' 加密结果：' + 结果;
}

// 页面初始化
window.onload = () => 刷新色彩信息();
</script>
</body>
</html>
