<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShooBoomBoom v1.2 - 休闲射击游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:"Georgia","Times New Roman","KaiTi","楷体",serif;background:#c8b89a;}
canvas{display:block;cursor:none;}
#ui-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;font-family:inherit;}
#ui-layer>*{pointer-events:auto;}
.btn{display:inline-block;padding:14px 36px;font-size:20px;font-weight:bold;font-family:inherit;border:2px solid rgba(0,0,0,.25);border-radius:14px;cursor:pointer;transition:all .1s;box-shadow:0 4px 0 rgba(0,0,0,.15),0 6px 10px rgba(0,0,0,.2);margin:6px;color:#444;position:relative;top:0;background:rgba(255,255,255,.75);}
.btn:hover{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15),0 4px 6px rgba(0,0,0,.2);}
.btn:active{transform:translateY(4px);box-shadow:0 0px 0 rgba(0,0,0,.15),0 2px 4px rgba(0,0,0,.2);}
.btn-newbie{background:rgba(200,180,160,.8);}
.btn-mission{background:rgba(190,170,150,.8);}
.btn-crazy{background:rgba(180,140,130,.8);}
.btn-replay{background:rgba(180,190,200,.8);}
.btn-menu{background:rgba(190,170,200,.8);}
.btn-exit{background:rgba(210,190,170,.8);padding:8px 18px;font-size:14px;border-radius:10px;box-shadow:0 3px 0 rgba(0,0,0,.15);}
.menu-container{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:auto;}
.game-title{font-size:56px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.3),0 0 40px rgba(0,0,0,.1);margin-bottom:6px;letter-spacing:3px;font-family:"Georgia","Times New Roman",serif;}
.game-subtitle{font-size:18px;color:#5a4a3a;margin-bottom:25px;text-shadow:1px 1px 0 rgba(255,255,255,.5);font-style:italic;}
.instructions{background:rgba(255,255,255,.75);border:2px solid rgba(0,0,0,.15);border-radius:12px;padding:16px 26px;margin:16px auto;max-width:400px;font-size:15px;color:#5a4a3a;line-height:1.8;text-align:left;}
.instructions b{color:#8b4513;}
.score-panel{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.75);border:2px solid rgba(0,0,0,.15);border-radius:12px;padding:8px 18px;font-size:22px;font-weight:bold;color:#5a4a3a;box-shadow:0 2px 0 rgba(0,0,0,.1);}
.score-panel .label{font-size:11px;color:#8a7a6a;}
.score-panel .value{font-size:30px;color:#8b4513;}
.level-panel{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.75);border:2px solid rgba(0,0,0,.15);border-radius:12px;padding:8px 18px;font-size:15px;color:#5a4a3a;box-shadow:0 2px 0 rgba(0,0,0,.1);text-align:center;}
.timer-bar-container{position:absolute;top:90px;left:16px;width:200px;height:14px;background:rgba(255,255,255,.5);border:2px solid rgba(0,0,0,.15);border-radius:7px;overflow:hidden;}
.timer-bar{height:100%;background:linear-gradient(90deg,#8B7355,#A08060,#B8956A,#C4A070,#8B7355);border-radius:5px;transition:width .3s linear;}
.ammo-panel{position:absolute;top:115px;left:16px;background:rgba(255,255,255,.75);border:2px solid rgba(0,0,0,.15);border-radius:12px;padding:6px 16px;font-size:18px;font-weight:bold;color:#5a4a3a;box-shadow:0 2px 0 rgba(0,0,0,.1);text-align:center;}
.ammo-panel .ammo-label{font-size:11px;color:#8a7a6a;}
.ammo-panel .ammo-value{font-size:26px;color:#8b4513;}
.ammo-empty{color:#c0392b!important;animation:ammoFlash .5s infinite;}
.target-panel{position:absolute;top:115px;left:16px;background:rgba(255,255,255,.75);border:2px solid rgba(0,0,0,.15);border-radius:12px;padding:6px 16px;font-size:18px;font-weight:bold;color:#5a4a3a;box-shadow:0 2px 0 rgba(0,0,0,.1);text-align:center;}
.target-panel .target-label{font-size:11px;color:#8a7a6a;}
.target-panel .target-value{font-size:26px;color:#5a7a4a;}
@keyframes ammoFlash{50%{opacity:.4;}}
.gameover-modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.92);border:2px solid rgba(0,0,0,.2);border-radius:16px;padding:32px 50px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.1),0 8px 20px rgba(0,0,0,.25);pointer-events:auto;max-height:85vh;overflow-y:auto;}
.gameover-modal h2{font-size:38px;color:#8b4513;margin-bottom:14px;}
.gameover-modal .final-score{font-size:26px;color:#5a4a3a;margin-bottom:6px;}
.gameover-modal .high-score{font-size:17px;color:#a08060;margin-bottom:8px;}
.gameover-modal .bonus{font-size:18px;color:#6b8b5a;margin-bottom:6px;}
.ranking-table{width:100%;margin:10px 0;border-collapse:collapse;font-size:14px;}
.ranking-table th{background:#c4a070;color:#fff;padding:6px 10px;border:1px solid rgba(0,0,0,.15);}
.ranking-table td{padding:5px 10px;border:1px solid rgba(0,0,0,.1);text-align:center;color:#5a4a3a;}
.ranking-table tr:nth-child(even){background:rgba(0,0,0,.03);}
.ranking-table .rank-1{color:#c4a070;font-weight:bold;}
.ranking-table .rank-2{color:#a0a0a0;font-weight:bold;}
.ranking-table .rank-3{color:#b08060;font-weight:bold;}
.hidden{display:none!important;}
.score-popup{position:absolute;font-size:26px;font-weight:bold;color:#FFD700;text-shadow:0 2px 4px rgba(0,0,0,.3);pointer-events:none;animation:popup .8s ease-out forwards;}
@keyframes popup{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-60px) scale(1.5);}}
.muzzle-flash{position:absolute;width:60px;height:60px;background:radial-gradient(circle,#fff 0%,#FFD700 30%,#FF6B00 60%,transparent 70%);border-radius:50%;pointer-events:none;animation:flash .15s ease-out forwards;}
@keyframes flash{0%{opacity:1;transform:scale(.5);}100%{opacity:0;transform:scale(1.5);}}
.combo-display{position:absolute;top:110px;left:16px;font-size:18px;font-weight:bold;color:#8b6914;text-shadow:1px 1px 0 rgba(255,255,255,.5);}
.version-tag{position:absolute;bottom:8px;right:12px;font-size:12px;color:rgba(0,0,0,.25);font-family:monospace;pointer-events:none;}
.env-tag{position:absolute;bottom:8px;left:12px;font-size:12px;color:rgba(0,0,0,.25);pointer-events:none;}
.exit-btn-wrap{position:absolute;top:100px;right:16px;}
.level-complete-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;pointer-events:auto;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui-layer">
    <div id="menuScreen" class="menu-container">
        <div class="game-title">ShooBoomBoom</div>
        <div class="game-subtitle">休闲射击游戏</div>
        <div class="instructions">
            🖱️ <b>移动鼠标</b> 瞄准目标<br>
            🔫 <b>点击鼠标</b> 开枪射击<br>
            ⭐ 速度越快 · 分数越高<br>
            ⚡ 疯狂模式有闪现高分目标<br>
            🎯 关卡特色：时间挑战 / 弹药限制 / 目标数量
        </div>
        <div>
            <button class="btn btn-newbie" onclick="startGame('newbie')">🌱 新手模式</button>
            <button class="btn btn-mission" onclick="startGame('mission')">🏆 任务模式 (10关)</button>
            <button class="btn btn-crazy" onclick="startGame('crazy')">🔥 疯狂模式</button>
        </div>
    </div>

    <div id="gameUI" class="hidden">
        <div class="score-panel"><div class="label">得分</div><div class="value" id="scoreValue">0</div></div>
        <div class="level-panel" id="levelPanel"><div class="label" id="modeLabel">模式</div><div id="levelText">新手</div></div>
        <div class="timer-bar-container hidden" id="timerBarContainer"><div class="timer-bar" id="timerBar" style="width:100%"></div></div>
        <div class="ammo-panel hidden" id="ammoPanel"><div class="ammo-label">弹药</div><div class="ammo-value" id="ammoValue">∞</div></div>
        <div class="target-panel hidden" id="targetPanel"><div class="target-label">剩余目标</div><div class="target-value" id="targetValue">0</div></div>
        <div class="combo-display" id="comboDisplay"></div>
        <div class="exit-btn-wrap"><button class="btn btn-exit" onclick="backToMenu()">🚪 退出</button></div>
    </div>

    <div id="gameOverScreen" class="hidden">
        <div class="gameover-modal" id="gameoverContent"></div>
    </div>
    <div id="levelCompleteScreen" class="hidden">
        <div class="level-complete-overlay"><div class="gameover-modal" id="levelCompleteContent"></div></div>
    </div>

    <div class="version-tag">v1.2</div>
    <div class="env-tag" id="envTag"></div>
</div>

<script>
const VERSION='1.2';
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
let W=window.innerWidth,H=window.innerHeight;
function resize(){W=window.innerWidth;H=window.innerHeight;canvas.width=W;canvas.height=H;}
resize();window.addEventListener('resize',resize);

const GameState={MENU:'menu',PLAYING:'playing',LEVEL_COMPLETE:'levelComplete',GAME_OVER:'gameOver'};
let gameState=GameState.MENU,score=0,totalScore=0,highScore=parseInt(localStorage.getItem('shb_v12_high')||'0');
let currentMode='newbie',currentLevel=1,gameTimer=0,combo=0,comboTimer=0;
let lastTime=0,spawnTimer=0,targets=[],particles=[],mouseX=W/2,mouseY=H/2;
let clouds=[],trees=[],bushes=[],grassBlades=[],timeOfDay=0,obstacles=[];
let ammo=0,ammoMax=0,currentEnv=0,levelHits=0,levelMisses=0,rankingData=[];
let targetsSpawned=0,targetLimit=0;
let noiseCanvas=null,noiseCtx=null;
// Cached level config – set once at game start, never re-randomized per frame
let cachedConfig={};
// Cached background elements – prevent per-frame re-randomization (flashing)
let cachedStars=[],cachedLakeLilies=[],cachedForestMushrooms=[],cachedGrasslandFlowers=[],cachedBeachShells=[],cachedSnowflakes=[],cachedCityBldgs=[];

try{rankingData=JSON.parse(localStorage.getItem('shb_v12_rank')||'[]');}catch(e){rankingData=[];}

const AudioCtx=window.AudioContext||window.webkitAudioContext;let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new AudioCtx();if(audioCtx.state==='suspended')audioCtx.resume();}

// ==================== NOISE TEXTURE ====================
function initNoise(){
    noiseCanvas=document.createElement('canvas');noiseCanvas.width=W;noiseCanvas.height=H;
    noiseCtx=noiseCanvas.getContext('2d');
    const img=noiseCtx.createImageData(W,H);
    for(let i=0;i<img.data.length;i+=4){const v=Math.random()*12;img.data[i]=v;img.data[i+1]=v;img.data[i+2]=v;img.data[i+3]=255;}
    noiseCtx.putImageData(img,0,0);
}
function applyNoise(alpha){
    if(!noiseCanvas||noiseCanvas.width!==W||noiseCanvas.height!==H)initNoise();
    ctx.globalAlpha=alpha;ctx.drawImage(noiseCanvas,0,0);ctx.globalAlpha=1;
}

// ==================== ENVIRONMENTS ====================
const Environments=[
    {name:'湖泊',desc:'宁静的湖畔',sky:['#c8d8e0','#d8e4e8'],sun:'#f0e0c0',ground:'#b0b898',ground2:'#c0c8a8',mtn:['#b8c0c8','#a8b8c0'],river:'#98b8c8',riverS:'#78a0b8',tree:'#90a888',trunk:'#a09080',bush:['#a0b090','#b0c0a0','#90a080'],cloud:'#f0efe8',extra:'lake'},
    {name:'森林',desc:'幽深的密林',sky:['#b8c8a8','#c8d8b8'],sun:'#f0e8c8',ground:'#889868',ground2:'#98a878',mtn:['#a0b898','#90a888'],river:'#90c0d0',riverS:'#68a0b8',tree:'#78a068',trunk:'#a09080',bush:['#88a878','#98b888','#78a068'],cloud:'#e8f0e0',extra:'forest'},
    {name:'草原',desc:'辽阔的草原',sky:['#c0d8e8','#d0e4f0'],sun:'#f0e0b8',ground:'#b8c898',ground2:'#c8d8a8',mtn:['#a8b0b8','#b8c0c8'],river:'#a0d0e0',riverS:'#80b0c8',tree:'#d0b878',trunk:'#b0a090',bush:['#b0c8a0','#c0d8b0','#a0b890'],cloud:'#f8f8f0',extra:'grassland'},
    {name:'沙漠',desc:'炎热的沙漠',sky:['#e8d8c0','#f0e4d0'],sun:'#e8c080',ground:'#e8d0a0',ground2:'#f0dcb0',mtn:['#e0c0a0','#e8d0b0'],river:'',riverS:'',tree:'#c8a870',trunk:'#b8a090',bush:['#d8c090','#e0c898','#d0b888'],cloud:'#f8f0e0',extra:'desert'},
    {name:'城市',desc:'繁华的都市',sky:['#c0c0c8','#d0d0d8'],sun:'#f0e0c0',ground:'#a8a8b0',ground2:'#b8b8c0',mtn:['#a0a0a8','#b0b0b8'],river:'',riverS:'',tree:'#90b890',trunk:'#a89888',bush:['#a0c0a0','#b0d0b0','#90b090'],cloud:'#e8e8f0',extra:'city'},
    {name:'室内',desc:'温馨的房间',sky:['#e8d8c0','#f0e4d0'],sun:'',ground:'#c8b8a8',ground2:'#d8c8b8',mtn:[],river:'',riverS:'',tree:'',trunk:'',bush:[],cloud:'',extra:'indoor'},
    {name:'山间',desc:'云雾缭绕的高山',sky:['#c0d8d8','#d0e4e4'],sun:'#f0e8d0',ground:'#a8c0b8',ground2:'#b8d0c8',mtn:['#a0a8a8','#b0a098','#b8b0a8'],river:'#a0d8e0',riverS:'#70a8b8',tree:'#78a060',trunk:'#a09080',bush:['#90b898','#a0c8a8','#80a888'],cloud:'#f8f8f8',extra:'mountain'},
    {name:'海滩',desc:'阳光沙滩',sky:['#c0e0f0','#d0e8f8'],sun:'#f0d8b0',ground:'#f0e0c0',ground2:'#f8ecd0',mtn:[],river:'#a8d8f0',riverS:'#80b8d8',tree:'#e0b898',trunk:'#b8a090',bush:['#e0c0a8','#e8c8b0','#d8b8a0'],cloud:'#f8f8f8',extra:'beach'},
    {name:'雪地',desc:'银装素裹的世界',sky:['#e0e8f0','#e8f0f8'],sun:'#f8f0e0',ground:'#f0f0f0',ground2:'#f5f5f5',mtn:['#e8e8e8','#d8d8e0','#c8c8d0'],river:'#c8d8e8',riverS:'#a0b8d0',tree:'#98b898',trunk:'#b0a898',bush:['#e0e0e0','#e8e8e8','#d0d0d0'],cloud:'#f8f8f8',extra:'snow'},
    {name:'夜空',desc:'璀璨的星空',sky:['#182038','#283050','#384060'],sun:'',ground:'#284028',ground2:'#385038',mtn:['#283030','#384040'],river:'#284868',riverS:'#183850',tree:'#284028',trunk:'#483830',bush:['#385038','#486048','#284028'],cloud:'#384868',extra:'night'}
];

// ==================== AUDIO ====================
function playSound(type){
    if(!audioCtx)return;const now=audioCtx.currentTime;const m=audioCtx.createGain();m.connect(audioCtx.destination);
    switch(type){
        case'shoot':
            m.gain.setValueAtTime(0.3,now);m.gain.exponentialRampToValueAtTime(0.001,now+0.15);
            const ns=audioCtx.createBufferSource();const bf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.15,audioCtx.sampleRate);
            const d0=bf.getChannelData(0);for(let i=0;i<d0.length;i++)d0[i]=(Math.random()*2-1)*Math.pow(1-i/d0.length,2);
            ns.buffer=bf;const ft=audioCtx.createBiquadFilter();ft.type='lowpass';ft.frequency.value=1200;ns.connect(ft);ft.connect(m);ns.start(now);ns.stop(now+0.15);
            const o=audioCtx.createOscillator();o.type='sine';o.frequency.setValueAtTime(120,now);o.frequency.exponentialRampToValueAtTime(40,now+0.1);
            const og=audioCtx.createGain();og.gain.setValueAtTime(0.4,now);og.gain.exponentialRampToValueAtTime(0.001,now+0.1);
            o.connect(og);og.connect(m);o.start(now);o.stop(now+0.1);break;
        case'bird':
            m.gain.setValueAtTime(0.25,now);m.gain.exponentialRampToValueAtTime(0.001,now+0.4);
            const bo=audioCtx.createOscillator();bo.type='sine';bo.frequency.setValueAtTime(1800,now);bo.frequency.exponentialRampToValueAtTime(600,now+0.15);
            bo.frequency.exponentialRampToValueAtTime(1200,now+0.25);bo.frequency.exponentialRampToValueAtTime(400,now+0.4);
            const bg=audioCtx.createGain();bg.gain.setValueAtTime(0.3,now);bg.gain.exponentialRampToValueAtTime(0.001,now+0.4);
            const vb=audioCtx.createOscillator();vb.type='sine';vb.frequency.value=18;const vg=audioCtx.createGain();vg.gain.value=80;
            vb.connect(vg);vg.connect(bo.frequency);vb.start(now);vb.stop(now+0.4);bo.connect(bg);bg.connect(m);bo.start(now);bo.stop(now+0.4);break;
        case'chicken':
            m.gain.setValueAtTime(0.3,now);m.gain.exponentialRampToValueAtTime(0.001,now+0.5);
            const co=audioCtx.createOscillator();co.type='sawtooth';co.frequency.setValueAtTime(350,now);co.frequency.linearRampToValueAtTime(800,now+0.08);
            co.frequency.linearRampToValueAtTime(250,now+0.2);co.frequency.linearRampToValueAtTime(900,now+0.3);co.frequency.exponentialRampToValueAtTime(200,now+0.5);
            const cg=audioCtx.createGain();cg.gain.setValueAtTime(0.25,now);cg.gain.exponentialRampToValueAtTime(0.001,now+0.5);
            const cn=audioCtx.createBufferSource();const cb=audioCtx.createBuffer(1,audioCtx.sampleRate*0.5,audioCtx.sampleRate);
            const cd=cb.getChannelData(0);for(let i=0;i<cd.length;i++)cd[i]=(Math.random()*2-1)*0.3*Math.pow(1-i/cd.length,1.5);cn.buffer=cb;
            const cf=audioCtx.createBiquadFilter();cf.type='bandpass';cf.frequency.value=2000;cf.Q.value=2;const cng=audioCtx.createGain();cng.gain.value=0.15;
            cn.connect(cf);cf.connect(cng);cng.connect(m);cn.start(now);cn.stop(now+0.5);co.connect(cg);cg.connect(m);co.start(now);co.stop(now+0.5);break;
        case'glass':
            m.gain.setValueAtTime(0.4,now);m.gain.exponentialRampToValueAtTime(0.001,now+0.8);
            const gn=audioCtx.createBufferSource();const gb=audioCtx.createBuffer(1,audioCtx.sampleRate*0.3,audioCtx.sampleRate);
            const gd=gb.getChannelData(0);for(let i=0;i<gd.length;i++)gd[i]=(Math.random()*2-1)*Math.pow(1-i/gd.length,3);gn.buffer=gb;
            const gf=audioCtx.createBiquadFilter();gf.type='highpass';gf.frequency.value=3000;gn.connect(gf);gf.connect(m);gn.start(now);gn.stop(now+0.3);
            [2637,3136,3520,3951,4435,5274].forEach((freq,i)=>{const go=audioCtx.createOscillator();go.type='sine';go.frequency.value=freq;
                const gg=audioCtx.createGain();gg.gain.setValueAtTime(0.15,now+i*0.03);gg.gain.exponentialRampToValueAtTime(0.001,now+i*0.03+0.4);
                go.connect(gg);gg.connect(m);go.start(now+i*0.02);go.stop(now+i*0.03+0.5);});break;
        case'chameleon':
            m.gain.setValueAtTime(0.3,now);m.gain.exponentialRampToValueAtTime(0.001,now+0.6);
            const l1=audioCtx.createOscillator();l1.type='triangle';l1.frequency.setValueAtTime(200,now);l1.frequency.exponentialRampToValueAtTime(80,now+0.3);
            const lg1=audioCtx.createGain();lg1.gain.setValueAtTime(0.3,now);lg1.gain.exponentialRampToValueAtTime(0.001,now+0.4);
            l1.connect(lg1);lg1.connect(m);l1.start(now);l1.stop(now+0.4);
            const dl=audioCtx.createDelay(0.3);dl.delayTime.value=0.15;const dg=audioCtx.createGain();dg.gain.value=0.2;
            const l2=audioCtx.createOscillator();l2.type='sine';l2.frequency.value=300;const lg2=audioCtx.createGain();
            lg2.gain.setValueAtTime(0.15,now+0.15);lg2.gain.exponentialRampToValueAtTime(0.001,now+0.5);
            l2.connect(lg2);lg2.connect(dl);dl.connect(dg);dg.connect(m);l2.start(now+0.15);l2.stop(now+0.5);break;
        case'flash':
            m.gain.setValueAtTime(0.3,now);m.gain.exponentialRampToValueAtTime(0.001,now+0.5);
            [523,659,784,1047].forEach((freq,i)=>{const fo=audioCtx.createOscillator();fo.type='sine';fo.frequency.value=freq;
                const fg=audioCtx.createGain();fg.gain.setValueAtTime(0,now+i*0.08);fg.gain.linearRampToValueAtTime(0.2,now+i*0.08+0.02);
                fg.gain.exponentialRampToValueAtTime(0.001,now+i*0.08+0.3);fo.connect(fg);fg.connect(m);fo.start(now+i*0.08);fo.stop(now+i*0.08+0.4);});break;
        case'frog':
            m.gain.setValueAtTime(0.25,now);m.gain.exponentialRampToValueAtTime(0.001,now+0.3);
            const fr=audioCtx.createOscillator();fr.type='sawtooth';fr.frequency.setValueAtTime(200,now);fr.frequency.exponentialRampToValueAtTime(100,now+0.2);
            const fg2=audioCtx.createGain();fg2.gain.setValueAtTime(0.2,now);fg2.gain.exponentialRampToValueAtTime(0.001,now+0.25);
            fr.connect(fg2);fg2.connect(m);fr.start(now);fr.stop(now+0.3);break;
        case'butterfly':
            m.gain.setValueAtTime(0.15,now);m.gain.exponentialRampToValueAtTime(0.001,now+0.3);
            const bto=audioCtx.createOscillator();bto.type='sine';bto.frequency.setValueAtTime(800,now);bto.frequency.linearRampToValueAtTime(1200,now+0.1);
            bto.frequency.linearRampToValueAtTime(600,now+0.2);const btg=audioCtx.createGain();btg.gain.setValueAtTime(0.2,now);btg.gain.exponentialRampToValueAtTime(0.001,now+0.3);
            bto.connect(btg);btg.connect(m);bto.start(now);bto.stop(now+0.3);break;
        case'miss':
            m.gain.setValueAtTime(0.1,now);m.gain.exponentialRampToValueAtTime(0.001,now+0.1);
            const mo=audioCtx.createOscillator();mo.type='sine';mo.frequency.value=150;mo.connect(m);mo.start(now);mo.stop(now+0.1);break;
    }
}

// ==================== DRAWING ====================
function sf(c){ctx.fillStyle=c;}
function drawSky(){
    const e=Environments[currentEnv];const grad=ctx.createLinearGradient(0,0,0,H*0.75);
    if(e.extra==='night'){
        cachedStars.forEach(s=>{sf('#fff');ctx.globalAlpha=s.a;ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
        sf('#f0e8c8');ctx.beginPath();ctx.arc(W*0.75,H*0.12,38,0,Math.PI*2);ctx.fill();
        ctx.shadowColor='#f0e8c8';ctx.shadowBlur=20;ctx.fill();ctx.shadowBlur=0;
    }
    grad.addColorStop(0,e.sky[0]);grad.addColorStop(0.6,e.sky[1]);grad.addColorStop(1,e.sky[1]||e.sky[0]);
    sf(grad);ctx.fillRect(0,0,W,H);
    if(e.sun&&e.extra!=='night'){
        const sx=e.extra==='desert'?W*0.5:W*0.15,sy=e.extra==='desert'?H*0.08:H*0.12;
        sf(e.sun);ctx.shadowColor=e.sun;ctx.shadowBlur=25;ctx.beginPath();ctx.arc(sx,sy,42,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    }
}
function drawCloud(cx,cy,s){
    const e=Environments[currentEnv];if(e.extra==='night')return;
    ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);sf(e.cloud);
    ctx.shadowColor='rgba(0,0,0,0.08)';ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(-30,0,22,0,Math.PI*2);ctx.arc(0,-10,28,0,Math.PI*2);ctx.arc(30,0,22,0,Math.PI*2);ctx.arc(10,10,20,0,Math.PI*2);ctx.arc(-15,8,18,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.restore();
}
function drawMountains(){
    const e=Environments[currentEnv];if(!e.mtn||e.mtn.length===0)return;
    const layers=[{color:e.mtn[0],y:H*0.5,height:H*0.25},{color:e.mtn[1]||e.mtn[0],y:H*0.55,height:H*0.22}];
    if(e.mtn[2])layers.push({color:e.mtn[2],y:H*0.6,height:H*0.2});
    layers.forEach((layer,idx)=>{
        sf(layer.color);ctx.shadowColor='rgba(0,0,0,0.06)';ctx.shadowBlur=4;
        ctx.beginPath();ctx.moveTo(-20,layer.y+layer.height);
        const peaks=6+idx*2;const segW=(W+40)/peaks;
        for(let i=0;i<=peaks;i++){const px=-20+i*segW;const py=layer.y-(idx===0?0:10)+Math.sin(i*1.7+idx)*(30+idx*10)-(i%2===0?20:40)*(1-idx*0.2);if(i===0)ctx.lineTo(px,py);else ctx.quadraticCurveTo(px-segW/2,layer.y-layer.height*0.8+Math.sin(i*2.3)*20,px,py);}
        ctx.lineTo(W+20,layer.y+layer.height);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
    });
}

    }else if(e.extra==='snow'){

        sf('#f8f8f8');ctx.shadowColor='rgba(0,0,0,0.05)';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(0,-50,25,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;

function drawGrass(){

function drawRiver(){

function drawLeaves(){

        for(let i=0;i<8;i++){const angle=(i/8)*Math.PI*2;const lx=Math.cos(angle)*35;const ly=Math.sin(angle)*25-40;ctx.beginPath();ctx.ellipse(lx,ly,12,6,angle,0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore();});

function drawEnvExtras(){

    }else if(e.extra==='forest'){

        sf('#e0b8a0');ctx.beginPath();ctx.arc(W*0.5,H*0.55,30,0,Math.PI*2);ctx.fill();

function drawObstacles(){

        switch(o.type){
            case'bigTree':
                sf(e.trunk);ctx.beginPath();ctx.rect(-20,0,40,140);ctx.fill();
                sf(e.tree);ctx.shadowColor='rgba(0,0,0,0.08)';ctx.shadowBlur=5;ctx.beginPath();ctx.arc(0,-60,60,0,Math.PI*2);ctx.arc(-35,-40,45,0,Math.PI*2);ctx.arc(35,-40,45,0,Math.PI*2);ctx.arc(0,-90,50,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;break;
            case'house':
                sf('#e8d8c0');ctx.beginPath();ctx.rect(-50,0,100,80);ctx.fill();
                sf('#b08060');ctx.beginPath();ctx.moveTo(-60,0);ctx.lineTo(0,-50);ctx.lineTo(60,0);ctx.closePath();ctx.fill();
                sf('#a8c8e0');ctx.beginPath();ctx.rect(-30,20,25,25);ctx.fill();ctx.beginPath();ctx.rect(10,20,25,25);ctx.fill();
                sf('#a08068');ctx.beginPath();ctx.rect(-8,40,16,40);ctx.fill();break;
            case'building':
                sf(o.color);ctx.fillRect(-40,-200,80,200);
                for(let j=0;j<6;j++){sf('#f8f0c8');ctx.fillRect(-25,-190+j*35,18,15);ctx.fillRect(7,-190+j*35,18,15);}break;
            case'window':
                sf('#f8f0c8');ctx.fillRect(-70,-60,140,90);sf('#c8e0f0');ctx.fillRect(-70,-60,140,40);break;
            case'cactus':
                sf(e.tree);ctx.beginPath();ctx.roundRect(-10,-80,20,80,10);ctx.fill();
                ctx.beginPath();ctx.moveTo(-10,-40);ctx.lineTo(-30,-40);ctx.lineTo(-30,-70);ctx.lineTo(-18,-70);ctx.fill();
                ctx.beginPath();ctx.moveTo(10,-50);ctx.lineTo(28,-50);ctx.lineTo(28,-65);ctx.lineTo(18,-65);ctx.fill();break;
            case'igloo':
                sf('#f0f0f0');ctx.shadowColor='rgba(0,0,0,0.08)';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(0,0,45,Math.PI,0);ctx.fill();ctx.shadowBlur=0;
                ctx.beginPath();ctx.arc(0,0,20,Math.PI,0);ctx.fill();sf('#383838');ctx.beginPath();ctx.arc(0,-10,8,0,Math.PI*2);ctx.fill();break;
        }
        ctx.restore();
    });
}

// ==================== TARGETS ====================
class Target{
    constructor(type,x,y,speedMult){this.type=type;this.x=x;this.y=y;this.alive=true;this.hitAnim=0;this.wingPhase=Math.random()*Math.PI*2;this.bouncePhase=Math.random()*Math.PI*2;this.age=0;this.lifetime=5;this.hiding=false;this.hideTimer=0;this.flashTimer=0;this.dir=Math.random()>0.5?1:-1;this.occluded=false;this.speedVar=1;this.speedVarTimer=0;this.setParams(speedMult);}
    setParams(speedMult){const baseSpeed=120*speedMult;
        switch(this.type){
            case'bird':this.points=100;this.radius=22;this.vx=(1.5+Math.random())*baseSpeed*(this.dir>0?1:-1);this.vy=Math.sin(Math.random()*Math.PI*2)*30;this.color=['#c8a080','#b89068','#d0b090'][Math.floor(Math.random()*3)];this.lifetime=8;break;
            case'chicken':this.points=80;this.radius=26;this.vx=(1+Math.random()*0.5)*baseSpeed*(this.dir>0?1:-1);this.vy=0;this.bounceSpeed=4+Math.random()*2;this.bounceHeight=60;this.baseY=this.y;this.color='#e0c080';this.lifetime=10;break;
            case'bottle':this.points=150;this.radius=18;this.vx=0;this.vy=0;this.lifetime=2.5;break;
            case'chameleon':this.points=200;this.radius=24;this.vx=0;this.vy=0;this.lifetime=8;this.hiding=true;this.hideTimer=2+Math.random()*2;this.color='#80a868';break;
            case'flash':this.points=500;this.radius=20;this.vx=0;this.vy=0;this.lifetime=0.8;this.flashTimer=0;this.color='#e06890';break;
            case'frog':this.points=120;this.radius=20;this.vx=(1+Math.random()*0.8)*baseSpeed*(this.dir>0?1:-1);this.baseY=H*0.78;this.y=this.baseY;this.bounceSpeed=5+Math.random()*3;this.bounceHeight=30;this.lifetime=8;this.color='#80a868';break;
            case'butterfly':this.points=90;this.radius=18;this.vx=(0.5+Math.random()*0.5)*baseSpeed*(this.dir>0?1:-1);this.vy=Math.sin(Math.random()*Math.PI*2)*40;this.lifetime=6;this.bfPhase=Math.random()*Math.PI*2;this.color=['#e098a0','#b898d0','#98c0e0','#e0c898'][Math.floor(Math.random()*4)];break;
            case'dragonfly':this.points=130;this.radius=16;this.vx=(2+Math.random())*baseSpeed*(this.dir>0?1:-1);this.vy=(Math.random()-0.5)*60;this.lifetime=5;this.color='#68b8c8';break;
            case'balloon':this.points=110;this.radius=30;this.vx=(Math.random()-0.5)*30;this.vy=-40-Math.random()*30;this.lifetime=6;this.color=['#e06868','#6888e0','#e0c868','#68c898'][Math.floor(Math.random()*4)];break;
        }
        if(currentMode==='crazy'){this.speedVar=0.5+Math.random()*1.5;this.speedVarTimer=Math.random()*3;}
    }
    update(dt){this.age+=dt;this.wingPhase+=dt*12;this.bouncePhase+=dt*4;if(this.hitAnim>0)this.hitAnim-=dt;
        if(currentMode==='crazy'){this.speedVarTimer-=dt;if(this.speedVarTimer<=0){this.speedVar=0.3+Math.random()*2.0;this.speedVarTimer=1+Math.random()*3;}}
        const sv=currentMode==='crazy'?this.speedVar:1;
        switch(this.type){
            case'bird':this.x+=this.vx*dt*sv;this.y+=this.vy*dt+Math.sin(this.age*3)*20*dt;break;
            case'chicken':this.x+=this.vx*dt*sv;this.y=this.baseY-Math.abs(Math.sin(this.bouncePhase*this.bounceSpeed))*this.bounceHeight;break;
            case'bottle':break;
            case'chameleon':this.hideTimer-=dt;if(this.hideTimer<=0){this.hiding=!this.hiding;this.hideTimer=this.hiding?2+Math.random()*2:1+Math.random();}if(!this.hiding)this.x+=Math.sin(this.age*2)*20*dt;break;
            case'flash':this.flashTimer+=dt;break;
            case'frog':this.x+=this.vx*dt*sv;this.y=this.baseY-Math.abs(Math.sin(this.bouncePhase*this.bounceSpeed))*this.bounceHeight;break;
            case'butterfly':this.bfPhase+=dt*8;this.x+=this.vx*dt*sv+Math.sin(this.bfPhase)*30*dt;this.y+=this.vy*dt+Math.cos(this.bfPhase*1.7)*25*dt;break;
            case'dragonfly':this.x+=this.vx*dt*sv;this.y+=this.vy*dt+Math.sin(this.age*6)*15*dt;if(Math.random()<0.02*dt*60){this.vy+=(Math.random()-0.5)*80;}break;
            case'balloon':this.x+=this.vx*dt+Math.sin(this.age*2)*10*dt;this.y+=this.vy*dt;break;
        }
        this.occluded=isTargetOccluded(this);if(this.age>this.lifetime)this.alive=false;if(this.x<-100||this.x>W+100||this.y<-100||this.y>H+100)this.alive=false;
    }
    hit(){this.alive=false;this.hitAnim=0.2;for(let i=0;i<12;i++){const angle=Math.random()*Math.PI*2;const speed=100+Math.random()*200;particles.push({x:this.x,y:this.y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-50,life:0.6+Math.random()*0.4,maxLife:1,color:this.getParticleColor(),size:3+Math.random()*5});}}
    getParticleColor(){switch(this.type){case'bird':return this.color;case'chicken':return'#e0c080';case'bottle':return'#98c8e0';case'chameleon':return'#80a868';case'flash':return'#e06890';case'frog':return'#80a868';case'butterfly':return this.color;case'dragonfly':return'#68b8c8';case'balloon':return this.color;default:return'#fff';}}
    draw(ctx){
        ctx.save();ctx.translate(this.x,this.y);
        if(this.occluded){ctx.globalAlpha=0.08;ctx.shadowBlur=0;}
        else{ctx.shadowColor='rgba(0,0,0,0.12)';ctx.shadowBlur=4;}
        if(this.hitAnim>0){ctx.globalAlpha=this.hitAnim*5;ctx.scale(1+this.hitAnim*2,1+this.hitAnim*2);}
        switch(this.type){case'bird':this.drawBird(ctx);break;case'chicken':this.drawChicken(ctx);break;case'bottle':this.drawBottle(ctx);break;case'chameleon':this.drawChameleon(ctx);break;case'flash':this.drawFlash(ctx);break;case'frog':this.drawFrog(ctx);break;case'butterfly':this.drawButterfly(ctx);break;case'dragonfly':this.drawDragonfly(ctx);break;case'balloon':this.drawBalloon(ctx);break;}
        ctx.shadowBlur=0;ctx.restore();
    }
    drawBird(ctx){const flip=this.vx<0?-1:1;ctx.scale(flip,1);const wf=Math.sin(this.wingPhase)*0.4;
        sf(this.color);ctx.beginPath();ctx.ellipse(0,0,20,14,0,0,Math.PI*2);ctx.fill();
        sf(this.color);ctx.beginPath();ctx.ellipse(16,-3,12,10,0.2,0,Math.PI*2);ctx.fill();
        sf('#e0a060');ctx.beginPath();ctx.moveTo(26,-3);ctx.lineTo(34,-1);ctx.lineTo(26,2);ctx.closePath();ctx.fill();
        sf('#fff');ctx.beginPath();ctx.arc(20,-6,4,0,Math.PI*2);ctx.fill();sf('#383838');ctx.beginPath();ctx.arc(21,-6,2,0,Math.PI*2);ctx.fill();
        sf(this.color);ctx.save();ctx.translate(-5,-3);ctx.rotate(wf);ctx.beginPath();ctx.ellipse(0,0,16,8,-0.3,0,Math.PI*2);ctx.fill();ctx.restore();
        sf(this.color);ctx.beginPath();ctx.moveTo(-5,8);ctx.lineTo(-20,18);ctx.lineTo(-3,12);ctx.closePath();ctx.fill();
    }
    drawChicken(ctx){const sq=1+Math.sin(this.bouncePhase*this.bounceSpeed)*0.15;const st=1/sq;ctx.scale(1,st);
        sf('#e0c080');ctx.beginPath();ctx.ellipse(0,5,18,22*sq,0,0,Math.PI*2);ctx.fill();
        sf('#e0c080');ctx.beginPath();ctx.arc(0,-15,14,0,Math.PI*2);ctx.fill();
        sf('#e06850');ctx.beginPath();ctx.ellipse(0,-28,6,4,0,0,Math.PI*2);ctx.fill();
        sf('#e0a060');ctx.beginPath();ctx.moveTo(8,-14);ctx.lineTo(16,-12);ctx.lineTo(8,-10);ctx.closePath();ctx.fill();
        sf('#fff');ctx.beginPath();ctx.arc(-5,-17,4,0,Math.PI*2);ctx.arc(5,-17,4,0,Math.PI*2);ctx.fill();
        sf('#383838');ctx.beginPath();ctx.arc(-4,-17,2,0,Math.PI*2);ctx.arc(6,-17,2,0,Math.PI*2);ctx.fill();
        sf('#e0a060');ctx.beginPath();ctx.moveTo(-10,25);ctx.lineTo(-14,32);ctx.lineTo(-6,32);ctx.closePath();ctx.fill();
        ctx.beginPath();ctx.moveTo(10,25);ctx.lineTo(6,32);ctx.lineTo(14,32);ctx.closePath();ctx.fill();
        sf('#e0c080');ctx.beginPath();ctx.ellipse(-14,0,8,5,-0.3,0,Math.PI*2);ctx.fill();
    }
    drawBottle(ctx){const gl=Math.sin(this.age*8)*0.2+0.8;ctx.globalAlpha*=gl;
        sf('rgba(152,200,224,0.5)');ctx.shadowColor='rgba(80,160,200,0.3)';ctx.shadowBlur=6;
        ctx.beginPath();ctx.moveTo(-6,-28);ctx.lineTo(-6,-18);ctx.quadraticCurveTo(-14,-10,-14,5);ctx.lineTo(-14,20);ctx.quadraticCurveTo(-14,28,0,28);ctx.quadraticCurveTo(14,28,14,20);ctx.lineTo(14,5);ctx.quadraticCurveTo(14,-10,6,-18);ctx.lineTo(6,-28);ctx.closePath();ctx.fill();

        if(!this.hiding){sf('#e07050');ctx.beginPath();ctx.moveTo(38,0);ctx.quadraticCurveTo(45,-5,48,2);ctx.fill();}

    drawFlash(ctx){const pl=Math.sin(this.flashTimer*20)*0.3+0.7;ctx.globalAlpha*=pl;
        const gd=ctx.createRadialGradient(0,0,5,0,0,30);gd.addColorStop(0,'#f0d860');gd.addColorStop(0.5,'#e06890');gd.addColorStop(1,'rgba(224,104,144,0)');sf(gd);ctx.beginPath();ctx.arc(0,0,30,0,Math.PI*2);ctx.fill();
        sf('#f0d860');ctx.beginPath();for(let i=0;i<5;i++){const a=(i/5)*Math.PI*2-Math.PI/2;const ox=Math.cos(a)*18,oy=Math.sin(a)*18,ix=Math.cos(a+Math.PI/5)*8,iy=Math.sin(a+Math.PI/5)*8;if(i===0)ctx.moveTo(ox,oy);else ctx.lineTo(ox,oy);ctx.lineTo(ix,iy);}ctx.closePath();ctx.fill();
        sf('#fff');ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('500',0,5);
    }
    drawFrog(ctx){const sq=1+Math.abs(Math.sin(this.bouncePhase*this.bounceSpeed))*0.2;ctx.scale(1,1/sq);
        sf('#80a868');ctx.beginPath();ctx.ellipse(0,5,18,14*sq,0,0,Math.PI*2);ctx.fill();
        sf('#80a868');ctx.beginPath();ctx.arc(0,-10,12,0,Math.PI*2);ctx.fill();
        sf('#fff');ctx.beginPath();ctx.arc(-5,-14,5,0,Math.PI*2);ctx.arc(5,-14,5,0,Math.PI*2);ctx.fill();
        sf('#383838');ctx.beginPath();ctx.arc(-4,-14,2.5,0,Math.PI*2);ctx.arc(6,-14,2.5,0,Math.PI*2);ctx.fill();

    }
    drawButterfly(ctx){const wf=Math.sin(this.bfPhase)*0.7;
        sf(this.color);ctx.save();ctx.rotate(wf*0.5);ctx.beginPath();ctx.ellipse(-8,0,16,10,0.3,0,Math.PI*2);ctx.fill();ctx.restore();
        ctx.save();ctx.rotate(-wf*0.5);ctx.beginPath();ctx.ellipse(8,0,16,10,-0.3,0,Math.PI*2);ctx.fill();ctx.restore();
        sf('#383838');ctx.beginPath();ctx.ellipse(0,0,3,10,0,0,Math.PI*2);ctx.fill();sf('#fff');ctx.beginPath();ctx.arc(0,-8,3,0,Math.PI*2);ctx.fill();

    drawDragonfly(ctx){const flip=this.vx<0?-1:1;ctx.scale(flip,1);
        sf('#68b8c8');ctx.beginPath();ctx.ellipse(0,0,20,5,0,0,Math.PI*2);ctx.fill();
        sf('#68b8c8');ctx.beginPath();ctx.arc(20,0,8,0,Math.PI*2);ctx.fill();
        sf('#fff');ctx.beginPath();ctx.arc(23,-3,4,0,Math.PI*2);ctx.fill();sf('#383838');ctx.beginPath();ctx.arc(24,-3,1.5,0,Math.PI*2);ctx.fill();
        sf('rgba(255,255,255,0.5)');ctx.beginPath();ctx.ellipse(-5,0,12,8,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(-8,0,10,6,0,0,Math.PI*2);ctx.fill();

// ==================== LEVEL CONFIG (called ONCE per level start) ====================
function buildConfig(mode,level){
    if(mode==='newbie')return{targetTypes:['bird'],speedMult:0.5,spawnRate:1800,limitType:'time',limitValue:90};
    if(mode==='crazy'){
        const r=Math.random();const sp=0.5+Math.random()*0.5;
        const types=['time','ammo','targets'];
        const lt=types[Math.floor(Math.random()*3)];
        let lv=0;
        if(lt==='time')lv=30+Math.floor(Math.random()*40);
        else if(lt==='ammo')lv=60+Math.floor(Math.random()*50);
        else lv=40+Math.floor(Math.random()*60);
        return{targetTypes:['bird','chicken','bottle','chameleon','flash','frog','butterfly','dragonfly','balloon'],speedMult:2.2*sp,spawnRate:400+Math.random()*300,limitType:lt,limitValue:lv};
    }
    const levels=[
        {targetTypes:['bird','frog'],speedMult:0.6,spawnRate:1600,limitType:'targets',limitValue:50,env:0,name:'湖畔初探'},
        {targetTypes:['bird','butterfly'],speedMult:0.7,spawnRate:1500,limitType:'ammo',limitValue:60,env:1,name:'密林穿行'},
        {targetTypes:['bird','chicken','butterfly'],speedMult:0.8,spawnRate:1400,limitType:'time',limitValue:50,env:2,name:'草原追逐'},
        {targetTypes:['bird','bottle','chameleon'],speedMult:0.9,spawnRate:1300,limitType:'ammo',limitValue:50,env:3,name:'沙漠寻踪'},
        {targetTypes:['bird','chicken','dragonfly'],speedMult:1.0,spawnRate:1200,limitType:'time',limitValue:40,env:4,name:'都市快闪'},
        {targetTypes:['bird','bottle','balloon'],speedMult:1.1,spawnRate:1100,limitType:'targets',limitValue:40,env:5,name:'室内射击'},
        {targetTypes:['bird','dragonfly','frog'],speedMult:1.2,spawnRate:1000,limitType:'time',limitValue:45,env:6,name:'山间翱翔'},
        {targetTypes:['bird','chicken','balloon','butterfly'],speedMult:1.3,spawnRate:900,limitType:'ammo',limitValue:55,env:7,name:'海滩浪花'},
        {targetTypes:['bird','dragonfly','balloon','flash'],speedMult:1.4,spawnRate:800,limitType:'time',limitValue:40,env:8,name:'雪原穿越'},
        {targetTypes:['bird','chicken','bottle','chameleon','flash','dragonfly','butterfly','balloon','frog'],speedMult:1.6,spawnRate:700,limitType:'targets',limitValue:80,env:9,name:'星空决战'}
    ];
    return levels[level-1];
}
function spawnTarget(){
    const cfg=cachedConfig;let type;const rand=Math.random();
    if(cfg.targetTypes.includes('flash')&&rand<0.1)type='flash';else if(cfg.targetTypes.includes('chameleon')&&rand<0.06)type='chameleon';else if(cfg.targetTypes.includes('bottle')&&rand<0.18)type='bottle';else if(cfg.targetTypes.includes('dragonfly')&&rand<0.22)type='dragonfly';else if(cfg.targetTypes.includes('balloon')&&rand<0.28)type='balloon';else if(cfg.targetTypes.includes('butterfly')&&rand<0.35)type='butterfly';else if(cfg.targetTypes.includes('frog')&&rand<0.45)type='frog';else if(cfg.targetTypes.includes('chicken')&&rand<0.6)type='chicken';else type=cfg.targetTypes[0];
    let x,y;const sm=cfg.speedMult;
    switch(type){
        case'bird':x=Math.random()>0.5?-40:W+40;y=H*0.1+Math.random()*H*0.45;break;case'chicken':x=Math.random()>0.5?-40:W+40;y=H*0.82;break;
        case'bottle':x=80+Math.random()*(W-160);y=H*0.3+Math.random()*H*0.4;break;
        case'chameleon':if(trees.length>0){const tp=trees[Math.floor(Math.random()*trees.length)];x=tp.x+(Math.random()-0.5)*40;y=tp.y-50+(Math.random()-0.5)*20;}else{x=W*0.3+Math.random()*W*0.4;y=H*0.4+Math.random()*H*0.2;}break;
        case'flash':x=100+Math.random()*(W-200);y=100+Math.random()*(H-300);break;case'frog':x=Math.random()>0.5?-40:W+40;y=H*0.8;break;
        case'butterfly':x=Math.random()>0.5?-40:W+40;y=H*0.15+Math.random()*H*0.5;break;case'dragonfly':x=Math.random()>0.5?-40:W+40;y=H*0.1+Math.random()*H*0.5;break;
        case'balloon':x=80+Math.random()*(W-160);y=H+40;break;
    }
    targetsSpawned++;targets.push(new Target(type,x,y,sm));
}

// ==================== CROSSHAIR ====================
function drawCrosshair(x,y){
    ctx.save();ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle='rgba(0,0,0,0.7)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-30,y);ctx.lineTo(x-12,y);ctx.moveTo(x+12,y);ctx.lineTo(x+30,y);ctx.moveTo(x,y-30);ctx.lineTo(x,y-12);ctx.moveTo(x,y+12);ctx.lineTo(x,y+30);ctx.stroke();
    ctx.fillStyle='#c04040';ctx.shadowColor='#c04040';ctx.shadowBlur=4;ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=0.5;for(let i=-2;i<=2;i++){if(i===0)continue;ctx.beginPath();ctx.moveTo(x-22+i*8,y-3);ctx.lineTo(x-22+i*8,y+3);ctx.moveTo(x-3,y-22+i*8);ctx.lineTo(x+3,y-22+i*8);ctx.stroke();}
    ctx.restore();
}

function drawMenuBackground(){
    drawSky();clouds.forEach(c=>{c.x+=c.speed*0.016;if(c.x>W+100)c.x=-100;drawCloud(c.x,c.y,c.scale);});drawMountains();drawEnvExtras();drawRiver();
    trees.forEach(t=>drawTree(t.x,t.y,t.scale,t.type));bushes.forEach(b=>drawBush(b.x,b.y,b.scale,b.color));drawGrass();drawObstacles();
    applyNoise(0.03);

function renderMenu(){ctx.clearRect(0,0,W,H);drawMenuBackground();}
function renderGame(){
    ctx.clearRect(0,0,W,H);
    drawSky();clouds.forEach(c=>{c.x+=c.speed;if(c.x>W+100)c.x=-100;drawCloud(c.x,c.y,c.scale);});drawMountains();drawEnvExtras();drawRiver();
    trees.forEach(t=>drawTree(t.x,t.y,t.scale,t.type));bushes.forEach(b=>drawBush(b.x,b.y,b.scale,b.color));drawGrass();
    targets.forEach(t=>t.draw(ctx));drawLeaves();
    particles.forEach(p=>{ctx.globalAlpha=p.life/p.maxLife;sf(p.color);ctx.shadowColor=p.color;ctx.shadowBlur=3;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/p.maxLife),0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;ctx.shadowBlur=0;
    drawObstacles();applyNoise(0.025);drawCrosshair(mouseX,mouseY);
}

// ==================== UPDATE - uses cachedConfig ====================
function updateGame(dt){
    timeOfDay+=dt;const cfg=cachedConfig;gameTimer+=dt;
    if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)combo=0;}
    const lt=cfg.limitType;
    // Time limit
    if(lt==='time'){
        const tl=cfg.limitValue;const timeLeft=Math.max(0,tl-gameTimer);
        document.getElementById('timerBar').style.width=Math.max(0,(timeLeft/tl)*100)+'%';
        if(gameTimer>=tl){if(currentMode==='mission'&&currentLevel<10)showLevelComplete();else endGame();return;}
    }
    // Ammo limit
    if(lt==='ammo'&&ammo<=0){if(currentMode==='mission'&&currentLevel<10)showLevelComplete();else endGame();return;}
    // Target count limit – game ends when all spawned targets are gone
    if(lt==='targets'&&targetsSpawned>=cfg.limitValue&&targets.length===0){if(currentMode==='mission'&&currentLevel<10)showLevelComplete();else endGame();return;}

    // UI visibility
    document.getElementById('timerBarContainer').classList.toggle('hidden',lt!=='time');
    document.getElementById('ammoPanel').classList.toggle('hidden',lt!=='ammo');
    document.getElementById('targetPanel').classList.toggle('hidden',lt!=='targets');
    if(lt==='ammo'){const av=document.getElementById('ammoValue');av.textContent=ammo;av.classList.toggle('ammo-empty',ammo<=5);}
    if(lt==='targets'){document.getElementById('targetValue').textContent=Math.max(0,cfg.limitValue-targetsSpawned);}

    spawnTimer+=dt*1000;
    const canSpawn=lt!=='targets'||targetsSpawned<cfg.limitValue;
    if(canSpawn&&spawnTimer>=cfg.spawnRate){spawnTimer=0;spawnTarget();if(currentMode==='crazy'&&Math.random()<0.3)spawnTarget();}
    targets.forEach(t=>t.update(dt));targets=targets.filter(t=>t.alive);
    particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt;});particles=particles.filter(p=>p.life>0);
    document.getElementById('scoreValue').textContent=score;
    if(combo>1)document.getElementById('comboDisplay').textContent='连击 x'+combo+'!';else document.getElementById('comboDisplay').textContent='';
    if(currentMode==='mission')document.getElementById('levelText').textContent='第 '+currentLevel+' 关';
    document.getElementById('envTag').textContent=Environments[currentEnv].name+' · '+Environments[currentEnv].desc;
}

function limitTypeLabel(lt){return lt==='time'?'⏱ 时间':(lt==='ammo'?'🔫 弹药':'🎯 目标');}
function showLevelComplete(){
    gameState=GameState.LEVEL_COMPLETE;const cfg=cachedConfig;
    const accuracy=levelHits+levelMisses>0?Math.round(levelHits/(levelHits+levelMisses)*100):0;
    const bonus=accuracy>=80?500:(accuracy>=60?300:(accuracy>=40?100:0));
    score+=bonus;totalScore+=score;
    const html=`
        <h2>第 ${currentLevel} 关 完成！</h2>
        <div style="font-size:22px;color:#5a4a3a;margin-bottom:6px;">${Environments[currentEnv].name} · ${cfg.name||''}</div>
        <div style="font-size:16px;color:#8a7a6a;margin-bottom:8px;">限制：${limitTypeLabel(cfg.limitType)} ${cfg.limitValue}${cfg.limitType==='time'?'秒':(cfg.limitType==='ammo'?'发':'只')}</div>
        <div class="final-score">本关得分：${score}</div>
        <div class="bonus">命中率：${accuracy}% （命中${levelHits} 未命中${levelMisses}）</div>
        <div class="bonus">精准奖励：+${bonus}分</div>
        <div class="final-score" style="font-size:22px;color:#8b6914;">累计总分：${totalScore}</div>
        <div style="margin-top:10px;font-size:14px;color:#8a7a6a;">${currentLevel<10?'第 '+(currentLevel+1)+' 关：'+getLevelName(currentLevel+1):'即将通关！'}</div>
        <button class="btn btn-replay" onclick="nextLevel()">▶ 下一关</button>
        <button class="btn btn-menu" onclick="backToMenu()">🏠 返回菜单</button>
    `;
    document.getElementById('levelCompleteContent').innerHTML=html;
    document.getElementById('levelCompleteScreen').classList.remove('hidden');
    document.getElementById('gameUI').classList.add('hidden');
}
function getLevelName(lv){const names=['湖畔初探','密林穿行','草原追逐','沙漠寻踪','都市快闪','室内射击','山间翱翔','海滩浪花','雪原穿越','星空决战'];return names[lv-1]||'';}
function nextLevel(){
    currentLevel++;cachedConfig=buildConfig(currentMode,currentLevel);const lv=cachedConfig;
    currentEnv=lv.env||0;ammoMax=lv.limitType==='ammo'?lv.limitValue:0;ammo=ammoMax;
    targetLimit=lv.limitType==='targets'?lv.limitValue:0;targetsSpawned=0;
    gameTimer=0;spawnTimer=0;score=0;combo=0;targets=[];particles=[];levelHits=0;levelMisses=0;
    gameState=GameState.PLAYING;document.getElementById('levelCompleteScreen').classList.add('hidden');document.getElementById('gameUI').classList.remove('hidden');
    const e=Environments[currentEnv];document.getElementById('levelText').textContent='第 '+currentLevel+' 关';
    document.getElementById('modeLabel').textContent='🏆 任务模式';document.getElementById('envTag').textContent=e.name+' · '+e.desc;
    initBackground();
}

function shoot(mx,my){
    initAudio();playSound('shoot');const cfg=cachedConfig;
    if(cfg.limitType==='ammo'&&ammo<=0)return;
    if(cfg.limitType==='ammo'){ammo--;document.getElementById('ammoValue').textContent=ammo;}
    const flash=document.createElement('div');flash.className='muzzle-flash';flash.style.left=(mx-30)+'px';flash.style.top=(my-30)+'px';document.getElementById('ui-layer').appendChild(flash);setTimeout(()=>flash.remove(),150);
    let hit=false;
    for(let i=targets.length-1;i>=0;i--){const t=targets[i];if(t.type==='chameleon'&&t.hiding)continue;if(t.occluded)continue;const dx=mx-t.x,dy=my-t.y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<t.radius+5){hit=true;combo++;comboTimer=1.5;const comboMult=Math.min(combo,5);const earnedPoints=t.points*comboMult;score+=earnedPoints;levelHits++;playSound(t.type);t.hit();
            const popup=document.createElement('div');popup.className='score-popup';popup.style.left=(t.x-30)+'px';popup.style.top=(t.y-40)+'px';popup.textContent='+'+earnedPoints+(comboMult>1?' x'+comboMult:'');document.getElementById('ui-layer').appendChild(popup);setTimeout(()=>popup.remove(),800);break;}}
    if(!hit){combo=0;levelMisses++;playSound('miss');}
}

function gameLoop(timestamp){
    if(!lastTime)lastTime=timestamp;const dt=Math.min((timestamp-lastTime)/1000,0.05);lastTime=timestamp;
    if(gameState===GameState.MENU){renderMenu();timeOfDay+=dt;}else if(gameState===GameState.PLAYING){updateGame(dt);renderGame();}else if(gameState===GameState.LEVEL_COMPLETE||gameState===GameState.GAME_OVER){renderGame();}
    requestAnimationFrame(gameLoop);
}
function startGame(mode){
    initAudio();currentMode=mode;currentLevel=1;score=0;totalScore=0;combo=0;gameTimer=0;spawnTimer=0;targets=[];particles=[];levelHits=0;levelMisses=0;targetsSpawned=0;
    // Build config ONCE and cache it
    cachedConfig=buildConfig(mode,1);
    if(currentMode==='crazy'){currentEnv=Math.floor(Math.random()*10);}else{currentEnv=cachedConfig.env||0;}
    ammoMax=cachedConfig.limitType==='ammo'?cachedConfig.limitValue:0;ammo=ammoMax;
    targetLimit=cachedConfig.limitType==='targets'?cachedConfig.limitValue:0;targetsSpawned=0;
    const e=Environments[currentEnv];
    document.getElementById('menuScreen').classList.add('hidden');document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('levelCompleteScreen').classList.add('hidden');document.getElementById('gameUI').classList.remove('hidden');
    const labels={newbie:'🌱 新手模式',mission:'🏆 任务模式',crazy:'🔥 疯狂模式'};
    document.getElementById('modeLabel').textContent=labels[mode];
    document.getElementById('levelText').textContent=mode==='mission'?'第 1 关':(mode==='newbie'?'练习中':'疯狂!');
    document.getElementById('envTag').textContent=e.name+' · '+e.desc;
    gameState=GameState.PLAYING;initBackground();
}
function endGame(){
    gameState=GameState.GAME_OVER;const isMissionComplete=currentMode==='mission'&&currentLevel>=10;
    if(isMissionComplete)totalScore+=score;else totalScore=score;
    if(totalScore>highScore){highScore=totalScore;localStorage.setItem('shb_v12_high',highScore.toString());}
    rankingData.push({score:totalScore,mode:currentMode,date:new Date().toLocaleDateString(),level:currentLevel});
    rankingData.sort((a,b)=>b.score-a.score);rankingData=rankingData.slice(0,20);
    localStorage.setItem('shb_v12_rank',JSON.stringify(rankingData));
    let rankingHTML='';
    if(rankingData.length>0){rankingHTML='<div style="margin-top:8px;font-size:16px;font-weight:bold;color:#5a4a3a;">🏅 排行榜</div><table class="ranking-table"><tr><th>排名</th><th>分数</th><th>模式</th><th>日期</th></tr>';
        rankingData.slice(0,10).forEach((r,i)=>{const rc=i===0?'rank-1':(i===1?'rank-2':(i===2?'rank-3':''));const mn={newbie:'新手',mission:'任务',crazy:'疯狂'}[r.mode]||r.mode;rankingHTML+=`<tr><td class="${rc}">${i+1}</td><td>${r.score}</td><td>${mn}</td><td>${r.date}</td></tr>`;});rankingHTML+='</table>';}
    const html=`<h2>${isMissionComplete?'🎉 恭喜通关！':'游戏结束！'}</h2><div class="final-score">本局得分：${totalScore}</div><div class="high-score">最高纪录：${highScore}</div><div style="font-size:18px;color:#6b8b5a;margin-bottom:10px;">${isMissionComplete?'全部10关通关！太棒了！':''}</div>${rankingHTML}<button class="btn btn-replay" style="margin-top:10px;" onclick="replayGame()">🔄 再来一局</button><button class="btn btn-menu" onclick="backToMenu()">🏠 返回菜单</button>`;
    document.getElementById('gameoverContent').innerHTML=html;document.getElementById('gameOverScreen').classList.remove('hidden');document.getElementById('gameUI').classList.add('hidden');
}
function replayGame(){startGame(currentMode);}
function backToMenu(){gameState=GameState.MENU;document.getElementById('gameOverScreen').classList.add('hidden');document.getElementById('levelCompleteScreen').classList.add('hidden');document.getElementById('gameUI').classList.add('hidden');document.getElementById('menuScreen').classList.remove('hidden');currentEnv=0;initBackground();}

canvas.addEventListener('mousemove',(e)=>{mouseX=e.clientX;mouseY=e.clientY;});
canvas.addEventListener('mousedown',(e)=>{if(gameState===GameState.PLAYING)shoot(e.clientX,e.clientY);});
document.addEventListener('click',()=>{initAudio();},{once:true});

currentEnv=0;initBackground();requestAnimationFrame(gameLoop);
</script>
</body>
</html>
