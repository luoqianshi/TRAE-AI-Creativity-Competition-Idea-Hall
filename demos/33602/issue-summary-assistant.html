<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息问题总结助手</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #e0e7ff;
            --success: #22c55e;
            --success-light: #dcfce7;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }
        .app-container { display: flex; height: 100vh; }
        .left-panel {
            width: 380px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
        }
        .right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.15) 0%, transparent 100%);
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, #818cf8, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .header p { font-size: 13px; color: var(--text-secondary); }
        .upload-section { padding: 20px; border-bottom: 1px solid var(--border-color); }
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius);
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(51, 65, 85, 0.3);
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
        }
        .upload-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
        }
        .upload-area h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .upload-area p { font-size: 13px; color: var(--text-secondary); }
        .upload-area input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
            top: 0;
            left: 0;
        }
        .file-info {
            margin-top: 16px;
            padding: 12px;
            background: var(--bg-card);
            border-radius: 8px;
            display: none;
        }
        .file-info.show { display: block; }
        .file-info .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .file-info .row:last-child { margin-bottom: 0; }
        .file-info .label { color: var(--text-secondary); }
        .file-info .value { color: var(--text-primary); font-weight: 500; }
        .history-section { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        .history-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .history-header h3 { font-size: 14px; font-weight: 600; }
        .history-header .count {
            background: var(--primary);
            color: white;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }
        .history-list { flex: 1; overflow-y: auto; padding: 8px; }
        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        .history-item {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--bg-card);
            border: 2px solid transparent;
            position: relative;
        }
        .history-item:hover { background: var(--bg-hover); }
        .history-item.selected { border-color: var(--primary); background: rgba(99, 102, 241, 0.1); }
        .history-item .checkbox {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .history-item .checkbox:hover { border-color: var(--primary); }
        .history-item .checkbox.checked { background: var(--primary); border-color: var(--primary); }
        .history-item .checkbox.checked::after { content: "\u2713"; color: white; font-size: 12px; font-weight: bold; }
        .history-item .file-name { font-size: 14px; font-weight: 500; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .history-item .meta { font-size: 12px; color: var(--text-secondary); display: flex; gap: 12px; }
        .actions-section { padding: 16px 20px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--bg-hover); }
        .btn-success { background: linear-gradient(135deg, var(--success), #16a34a); color: white; }
        .btn-success:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #8b5cf6); color: white; }
        .top-bar {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(30, 41, 59, 0.5);
        }
        .top-bar .title { font-size: 16px; font-weight: 600; }
        .top-bar .stats { display: flex; gap: 20px; }
        .stat-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .stat-item .num { font-weight: 700; color: var(--primary); }
        .stat-item .label { color: var(--text-secondary); }
        .filter-bar {
            padding: 12px 24px;
            display: flex;
            gap: 12px;
            background: rgba(30, 41, 59, 0.3);
            border-bottom: 1px solid var(--border-color);
        }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-group label { font-size: 13px; color: var(--text-secondary); }
        .filter-group select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            cursor: pointer;
            min-width: 120px;
        }
        .filter-group select:focus { border-color: var(--primary); }
        .table-container { flex: 1; overflow: auto; padding: 16px 24px; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th {
            background: rgba(99, 102, 241, 0.15);
            padding: 12px 16px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td {
            padding: 12px 16px;
            font-size: 13px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
        }
        tr:hover td { background: rgba(99, 102, 241, 0.05); }
        .status-tag { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .status-pending { background: var(--warning-light); color: var(--warning); }
        .status-processing { background: var(--primary-light); color: var(--primary); }
        .status-done { background: var(--success-light); color: var(--success); }
        .type-tag { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; background: rgba(99, 102, 241, 0.2); color: #a5b4fc; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 20px; }
        .page-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
        }
        .page-btn:hover { background: var(--bg-hover); }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }
        .empty-icon {
            width: 80px;
            height: 80px;
            background: rgba(51, 65, 85, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 24px;
        }
        .empty-state h3 { font-size: 18px; font-weight: 500; margin-bottom: 8px; color: var(--text-primary); }
        .empty-state p { font-size: 14px; }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            width: 90%;
            max-width: 600px;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }
        .modal-overlay.show .modal { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 18px; font-weight: 600; }
        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--bg-hover);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .report-section { margin-bottom: 20px; }
        .report-section h4 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-secondary); }
        .report-content {
            background: rgba(51, 65, 85, 0.5);
            border-radius: 8px;
            padding: 16px;
            max-height: 300px;
            overflow-y: auto;
            font-family: "Courier New", monospace;
            font-size: 13px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .modal-footer { display: flex; justify-content: flex-end; gap: 12px; }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            z-index: 2000;
            transform: translateX(120%);
            transition: transform 0.3s ease;
        }
        .toast.show { transform: translateX(0); }
        .toast-success { background: var(--success); color: white; }
        .toast-error { background: var(--danger); color: white; }
        .toast-info { background: var(--primary); color: white; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="left-panel">
            <div class="header">
                <h1>消息问题总结助手</h1>
                <p>📊 智能解析群消息，高效管理问题</p>
            </div>
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <h3>上传或拖拽文件</h3>
                    <p>支持 JSON、TXT、Word 文件，自动解析问题记录</p>
                    <input type="file" id="fileInput" accept=".json,.txt,.doc,.docx">
                </div>
                <div class="file-info" id="fileInfo">
                    <div class="row"><span class="label">文件名:</span><span class="value" id="fileName"></span></div>
                    <div class="row"><span class="label">问题数量:</span><span class="value" id="issueCount"></span></div>
                    <div class="row"><span class="label">上传时间:</span><span class="value" id="uploadTime"></span></div>
                </div>
            </div>
            <div class="history-section">
                <div class="history-header">
                    <h3>历史记录</h3>
                    <span class="count" id="historyCount">0</span>
                </div>
                <div class="history-list" id="historyList">
                    <div class="empty-state" style="padding: 40px 20px;">
                        <div class="empty-icon" style="width: 48px; height: 48px; font-size: 24px;">📋</div>
                        <p style="font-size: 13px;">暂无历史记录</p>
                    </div>
                </div>
            </div>
            <div class="actions-section">
                <button class="btn btn-secondary" id="btnExport">📥 导出 Excel</button>
                <button class="btn btn-success" id="btnGenerateReport">📝 生成周报</button>
            </div>
        </div>
        <div class="right-panel">
            <div class="top-bar">
                <div class="title">问题记录预览</div>
                <div class="stats">
                    <div class="stat-item"><span class="num" id="totalCount">0</span><span class="label">总问题</span></div>
                    <div class="stat-item"><span class="num" id="pendingCount">0</span><span class="label">待处理</span></div>
                    <div class="stat-item"><span class="num" id="processingCount">0</span><span class="label">处理中</span></div>
                    <div class="stat-item"><span class="num" id="doneCount">0</span><span class="label">已处理</span></div>
                </div>
            </div>
            <div class="filter-bar">
                <div class="filter-group"><label>处理进度:</label><select id="filterStatus"><option value="all">全部</option><option value="待处理">待处理</option><option value="处理中">处理中</option><option value="已处理">已处理</option></select></div>
                <div class="filter-group"><label>问题模块:</label><select id="filterModule"><option value="all">全部</option></select></div>
                <div class="filter-group"><label>问题类型:</label><select id="filterType"><option value="all">全部</option></select></div>
            </div>
            <div class="table-container" id="tableContainer">
                <div class="empty-state"><div class="empty-icon">📊</div><h3>暂无数据</h3><p>请上传 JSON、TXT 或 Word 文件，或从历史记录中选择</p></div>
            </div>
            <div class="pagination" id="pagination" style="display: none;">
                <button class="page-btn" id="prevPage" disabled>上一页</button>
                <span id="pageInfo">第 1 页 / 共 1 页</span>
                <button class="page-btn" id="nextPage" disabled>下一页</button>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="reportModal">
        <div class="modal">
            <div class="modal-header"><h3>📝 周报生成</h3><button class="modal-close" id="closeModal">×</button></div>
            <div class="modal-body">
                <div class="report-section"><h4>周报内容</h4><div class="report-content" id="reportContent"></div></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;" id="btnCopyReport">复制内容</button>
                <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" id="btnExportReport">导出 TXT</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const SCHEMA = {
            headers: ["问题描述","处理进度","反馈人","处理人","问题模块","问题类型","问题原因","反馈时间","产品接收时间","产品转研发时间","研发反馈修复时间","创建时间"],
            enums: {
                "处理进度": ["待处理","已处理","处理中"],
                "问题模块": ["卡券积分","小程序/公众号","web系统管理","个人风控","供应商管理系统","线下核销","售后","支付","h5商城管理","商品","短信/语音验证码","登录","订单","企业集配","门店","结算/发票","商户号","域名","电影"],
                "问题类型": ["异常bug","常规bug","逻辑确认","转优化需求","业务支持","第三方bug","其他原因","工单"]
            }
        };
        let currentData = [];
        let historyData = [];
        let selectedHistoryIds = new Set();
        let currentPage = 1;
        const pageSize = 10;
        let filteredData = [];

        function loadHistory() {
            try {
                const saved = localStorage.getItem("issueChatHistory");
                if (saved) historyData = JSON.parse(saved);
            } catch (e) { console.error("加载历史失败", e); }
            renderHistory();
        }

        function saveHistory(item) {
            historyData.unshift(item);
            if (historyData.length > 20) historyData = historyData.slice(0, 20);
            localStorage.setItem("issueChatHistory", JSON.stringify(historyData));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById("historyList");
            const count = document.getElementById("historyCount");
            count.textContent = historyData.length;
            if (historyData.length === 0) {
                list.innerHTML = '<div class="empty-state" style="padding:40px 20px;"><div class="empty-icon" style="width:48px;height:48px;font-size:24px;">📋</div><p style="font-size:13px;">暂无历史记录</p></div>';
                return;
            }
            list.innerHTML = historyData.map(function(item) {
                var checked = selectedHistoryIds.has(item.id) ? "checked" : "";
                return '<div class="history-item" data-id="' + item.id + '" onclick="selectHistory(\'' + item.id + '\')"><div class="checkbox ' + checked + '" onclick="toggleHistorySelection(event,\'' + item.id + '\')"></div><div class="file-name">' + item.fileName + '</div><div class="meta"><span>📊 ' + item.count + ' 条</span><span>📅 ' + item.time + '</span></div></div>';
            }).join("");
        }

        function toggleHistorySelection(event, id) {
            event.stopPropagation();
            selectedHistoryIds.has(id) ? selectedHistoryIds.delete(id) : selectedHistoryIds.add(id);
            renderHistory();
        }

        function selectHistory(id) {
            var item = historyData.find(function(h) { return h.id === id; });
            if (item) {
                currentData = JSON.parse(item.data);
                renderTable();
                updateStats();
                updateFilters();
                showFileInfo(item.fileName, item.count, item.time);
            }
        }

        function showFileInfo(name, count, time) {
            const info = document.getElementById("fileInfo");
            document.getElementById("fileName").textContent = name;
            document.getElementById("issueCount").textContent = count + " 条";
            document.getElementById("uploadTime").textContent = time;
            info.classList.add("show");
        }

        function handleFileUpload(file) {
            var fileName = file.name.toLowerCase();
            var isJson = fileName.endsWith(".json");
            var isTxt = fileName.endsWith(".txt");
            var isWord = fileName.endsWith(".doc") || fileName.endsWith(".docx");
            
            if (!isJson && !isTxt && !isWord) {
                showToast("请上传 JSON、TXT 或 Word 格式文件", "error");
                return;
            }

            if (isJson) {
                handleJsonFile(file);
            } else if (isTxt) {
                handleTxtFile(file);
            } else if (isWord) {
                handleWordFile(file);
            }
        }

        function handleJsonFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var content = e.target.result;
                    if (content.startsWith("```")) {
                        content = content.split("```")[1];
                        if (content.trim().startsWith("json")) content = content.trim().slice(4);
                    }
                    const data = JSON.parse(content);
                    if (!Array.isArray(data)) throw new Error("JSON 根节点必须是数组");
                    if (data.length === 0) { showToast("文件内容为空", "error"); return; }
                    processParsedData(data, file.name);
                } catch (err) { showToast("JSON 文件解析失败: " + err.message, "error"); }
            };
            reader.readAsText(file);
        }

        function handleTxtFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var content = e.target.result;
                    var data = parseTextContent(content);
                    if (data.length === 0) { showToast("未能从文件中解析出问题记录", "error"); return; }
                    processParsedData(data, file.name);
                } catch (err) { showToast("TXT 文件解析失败: " + err.message, "error"); }
            };
            reader.readAsText(file);
        }

        function handleWordFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                mammoth.extractRawText({ arrayBuffer: e.target.result }).then(function(result) {
                    var content = result.value;
                    var data = parseTextContent(content);
                    if (data.length === 0) { showToast("未能从文件中解析出问题记录", "error"); return; }
                    processParsedData(data, file.name);
                }).catch(function(err) {
                    showToast("Word 文件解析失败: " + err.message, "error");
                });
            };
            reader.readAsArrayBuffer(file);
        }

        function parseTextContent(content) {
            var data = [];
            
            // 尝试解析JSON格式（如果txt内容是JSON）
            try {
                var jsonContent = content.trim();
                if (jsonContent.startsWith("[") || jsonContent.startsWith("{")) {
                    var jsonData = JSON.parse(jsonContent);
                    if (Array.isArray(jsonData)) {
                        return jsonData;
                    }
                }
            } catch (e) {
                // 不是JSON格式，继续用文本解析
            }

            // 按行分割文本
            var lines = content.split(/\r?\n/).filter(function(line) { return line.trim().length > 0; });
            
            // 智能解析：识别消息模式
            // 模式1：带时间戳的消息（如：2026-06-13 14:20:32 张家伟: 问题内容）
            // 模式2：带@的消息（如：@某人 问题内容）
            // 模式3：纯问题描述
            
            var currentDate = new Date().toISOString().slice(0, 10);
            
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (line.length === 0) continue;
                
                var item = {
                    "问题描述": line,
                    "处理进度": "待处理",
                    "反馈人": "",
                    "处理人": "",
                    "问题模块": "",
                    "问题类型": "",
                    "问题原因": "",
                    "反馈时间": "",
                    "产品接收时间": null,
                    "产品转研发时间": null,
                    "研发反馈修复时间": null,
                    "创建时间": currentDate
                };

                // 尝试提取时间戳
                var timeMatch = line.match(/(\d{4}[-\/]\d{1,2}[-\/]\d{1,2}\s*\d{1,2}:\d{1,2}:\d{1,2})/);
                if (timeMatch) {
                    item["反馈时间"] = timeMatch[1];
                }

                // 尝试提取@某人作为反馈人
                var atMatch = line.match(/@([^\s@]+)/);
                if (atMatch) {
                    item["反馈人"] = atMatch[1];
                }

                // 尝试提取发送人（格式：姓名: 内容 或 姓名：内容）
                var senderMatch = line.match(/^([^\s:：]+)[:：]\s*/);
                if (senderMatch && senderMatch[1].length < 10) {
                    item["反馈人"] = senderMatch[1];
                    item["问题描述"] = line.replace(senderMatch[0], "");
                }

                // 智能识别问题模块（关键词匹配）
                var moduleKeywords = {
                    "卡券积分": ["卡", "券", "积分", "绑定", "解绑"],
                    "支付": ["支付", "付款", "退款", "余额"],
                    "订单": ["订单", "下单", "发货", "物流"],
                    "售后": ["售后", "退货", "换货", "客服"],
                    "登录": ["登录", "注册", "账号", "密码"],
                    "门店": ["门店", "店铺", "核销"],
                    "商品": ["商品", "库存", "上架"]
                };

                for (var module in moduleKeywords) {
                    var keywords = moduleKeywords[module];
                    for (var k = 0; k < keywords.length; k++) {
                        if (line.indexOf(keywords[k]) !== -1) {
                            item["问题模块"] = module;
                            break;
                        }
                    }
                    if (item["问题模块"]) break;
                }

                // 智能识别问题类型
                if (line.indexOf("bug") !== -1 || line.indexOf("异常") !== -1 || line.indexOf("报错") !== -1 || line.indexOf("失败") !== -1) {
                    item["问题类型"] = "异常bug";
                } else if (line.indexOf("优化") !== -1 || line.indexOf("建议") !== -1) {
                    item["问题类型"] = "转优化需求";
                } else if (line.indexOf("确认") !== -1 || line.indexOf("为什么") !== -1 || line.indexOf("怎么") !== -1) {
                    item["问题类型"] = "逻辑确认";
                } else if (line.indexOf("帮忙") !== -1 || line.indexOf("麻烦") !== -1 || line.indexOf("看下") !== -1) {
                    item["问题类型"] = "业务支持";
                }

                data.push(item);
            }

            return data;
        }

        function processParsedData(data, fileName) {
            currentData = data;
            saveHistory({
                id: Date.now().toString(),
                fileName: fileName,
                count: data.length,
                time: new Date().toLocaleString("zh-CN"),
                data: JSON.stringify(data)
            });
            renderTable();
            updateStats();
            updateFilters();
            showFileInfo(fileName, data.length, new Date().toLocaleString("zh-CN"));
            showToast("成功解析 " + data.length + " 条问题记录", "success");
        }

        document.getElementById("fileInput").addEventListener("change", function(e) {
            if (e.target.files.length > 0) handleFileUpload(e.target.files[0]);
        });

        const uploadArea = document.getElementById("uploadArea");
        uploadArea.addEventListener("dragover", function(e) { e.preventDefault(); uploadArea.classList.add("dragover"); });
        uploadArea.addEventListener("dragleave", function(e) { e.preventDefault(); uploadArea.classList.remove("dragover"); });
        uploadArea.addEventListener("drop", function(e) { e.preventDefault(); uploadArea.classList.remove("dragover"); if (e.dataTransfer.files.length > 0) handleFileUpload(e.dataTransfer.files[0]); });

        function updateStats() {
            const total = currentData.length;
            const pending = currentData.filter(function(item) { return item["处理进度"] === "待处理"; }).length;
            const processing = currentData.filter(function(item) { return item["处理进度"] === "处理中"; }).length;
            const done = currentData.filter(function(item) { return item["处理进度"] === "已处理"; }).length;
            document.getElementById("totalCount").textContent = total;
            document.getElementById("pendingCount").textContent = pending;
            document.getElementById("processingCount").textContent = processing;
            document.getElementById("doneCount").textContent = done;
        }

        function updateFilters() {
            const modules = [...new Set(currentData.map(function(item) { return item["问题模块"] || "未分类"; }))];
            const types = [...new Set(currentData.map(function(item) { return item["问题类型"] || "未分类"; }))];
            const moduleSelect = document.getElementById("filterModule");
            moduleSelect.innerHTML = '<option value="all">全部</option>' + modules.map(function(m) { return '<option value="' + m + '">' + m + '</option>'; }).join("");
            const typeSelect = document.getElementById("filterType");
            typeSelect.innerHTML = '<option value="all">全部</option>' + types.map(function(t) { return '<option value="' + t + '">' + t + '</option>'; }).join("");
        }

        function applyFilters() {
            const status = document.getElementById("filterStatus").value;
            const module = document.getElementById("filterModule").value;
            const type = document.getElementById("filterType").value;
            filteredData = currentData.filter(function(item) {
                if (status !== "all" && item["处理进度"] !== status) return false;
                if (module !== "all" && item["问题模块"] !== module) return false;
                if (type !== "all" && item["问题类型"] !== type) return false;
                return true;
            });
            currentPage = 1;
            renderTable();
        }

        document.getElementById("filterStatus").addEventListener("change", applyFilters);
        document.getElementById("filterModule").addEventListener("change", applyFilters);
        document.getElementById("filterType").addEventListener("change", applyFilters);

        function renderTable() {
            const container = document.getElementById("tableContainer");
            const pagination = document.getElementById("pagination");
            if (currentData.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div><h3>暂无数据</h3><p>请上传 JSON、TXT 或 Word 文件，或从历史记录中选择</p></div>';
                pagination.style.display = "none";
                return;
            }
            filteredData = filteredData.length > 0 ? filteredData : currentData;
            const totalPages = Math.ceil(filteredData.length / pageSize);
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = filteredData.slice(start, end);
            document.getElementById("pageInfo").textContent = "第 " + currentPage + " 页 / 共 " + totalPages + " 页";
            document.getElementById("prevPage").disabled = currentPage === 1;
            document.getElementById("nextPage").disabled = currentPage === totalPages;
            pagination.style.display = totalPages > 1 ? "flex" : "none";
            var tableRows = pageData.map(function(item) {
                var cells = SCHEMA.headers.map(function(h) {
                    var value = item[h] || "";
                    if (h === "处理进度") {
                        var statusClass = value === "待处理" ? "status-pending" : value === "处理中" ? "status-processing" : "status-done";
                        return '<td><span class="status-tag ' + statusClass + '">' + value + '</span></td>';
                    }
                    if (h === "问题类型") return '<td><span class="type-tag">' + value + '</span></td>';
                    return '<td>' + value + '</td>';
                });
                return '<tr>' + cells.join("") + '</tr>';
            });
            var table = '<table><thead><tr>' + SCHEMA.headers.map(function(h) { return '<th>' + h + '</th>'; }).join("") + '</tr></thead><tbody>' + tableRows.join("") + '</tbody></table>';
            container.innerHTML = table;
        }

        document.getElementById("prevPage").addEventListener("click", function() { if (currentPage > 1) { currentPage--; renderTable(); } });
        document.getElementById("nextPage").addEventListener("click", function() { var totalPages = Math.ceil(filteredData.length / pageSize); if (currentPage < totalPages) { currentPage++; renderTable(); } });

        document.getElementById("btnExport").addEventListener("click", function() {
            if (currentData.length === 0) { showToast("暂无数据可导出", "error"); return; }
            var data = selectedHistoryIds.size > 0 ? historyData.filter(function(h) { return selectedHistoryIds.has(h.id); }).flatMap(function(h) { return JSON.parse(h.data); }) : currentData;
            if (data.length === 0) { showToast("暂无数据可导出", "error"); return; }
            const ws = XLSX.utils.json_to_sheet(data, { header: SCHEMA.headers });
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "问题记录表");
            SCHEMA.headers.forEach(function(header, index) {
                const col = XLSX.utils.encode_col(index);
                ws[col + "1"].s = { font: { bold: true }, fill: { fgColor: { rgb: "E0E7FF" } }, border: { top: { style: "thin" }, bottom: { style: "thin" }, left: { style: "thin" }, right: { style: "thin" } } };
            });
            const date = new Date().toISOString().slice(0, 10);
            var fileName = selectedHistoryIds.size > 0 ? "问题记录表_合并_" + date + ".xlsx" : "问题记录表_" + date + ".xlsx";
            XLSX.writeFile(wb, fileName);
            showToast("Excel 导出成功", "success");
        });

        function generateWeeklyReport(data) {
            const bugTypes = ["常规bug","异常bug","第三方bug"];
            const bugData = data.filter(function(item) { return bugTypes.includes(item["问题类型"]); });
            const otherTypes = data.filter(function(item) { return !bugTypes.includes(item["问题类型"]); });
            const typeCounts = {};
            otherTypes.forEach(function(item) { var type = item["问题类型"]; typeCounts[type] = (typeCounts[type] || 0) + 1; });
            const moduleCounts = {};
            bugData.forEach(function(item) { var module = item["问题模块"]; moduleCounts[module] = (moduleCounts[module] || 0) + 1; });
            const pendingBugs = data.filter(function(item) { return ["待处理","处理中"].includes(item["处理进度"]) && bugTypes.includes(item["问题类型"]); }).length;
            const pendingIssues = data.filter(function(item) { return ["待处理","处理中"].includes(item["处理进度"]); }).map(function(item, index) { return (index + 1) + "、" + item["问题描述"]; });
            const typeDetails = Object.entries(typeCounts).map(function(e) { return e[0] + e[1] + "个"; }).sort(function(a,b) { return parseInt(b.match(/\d+/)?.[0]||0) - parseInt(a.match(/\d+/)?.[0]||0); });
            if (bugData.length > 0) typeDetails.push("系统Bug问题" + bugData.length + "个（包括第三方Bug）");
            const moduleDetails = Object.entries(moduleCounts).map(function(e) { return e[0] + e[1] + "个"; }).sort(function(a,b) { return parseInt(b.match(/\d+/)?.[0]||0) - parseInt(a.match(/\d+/)?.[0]||0); });
            let report = "📅 统计范围：" + new Date().toLocaleDateString("zh-CN") + "\n\n";
            report += "本周接收问题 " + data.length + "个，其中包括：" + typeDetails.join("、") + "\n\n";
            report += "系统Bug模块分布（包括第三方Bug）：" + (moduleDetails.length > 0 ? moduleDetails.join("、") : "无") + "\n\n";
            report += "本周待解决Bug：" + pendingBugs + "个\n\n";
            report += "本周待解决问题：\n" + (pendingIssues.length > 0 ? pendingIssues.join("\n") : "暂无") + "\n";
            return report;
        }

        document.getElementById("btnGenerateReport").addEventListener("click", function() {
            var data = [];
            if (selectedHistoryIds.size > 0) data = historyData.filter(function(h) { return selectedHistoryIds.has(h.id); }).flatMap(function(h) { return JSON.parse(h.data); });
            else if (currentData.length > 0) data = currentData;
            if (data.length === 0) { showToast("暂无数据生成周报", "error"); return; }
            const report = generateWeeklyReport(data);
            document.getElementById("reportContent").textContent = report;
            document.getElementById("reportModal").classList.add("show");
        });

        document.getElementById("closeModal").addEventListener("click", function() { document.getElementById("reportModal").classList.remove("show"); });

        document.getElementById("btnCopyReport").addEventListener("click", function() {
            const content = document.getElementById("reportContent").textContent;
            navigator.clipboard.writeText(content).then(function() { showToast("周报内容已复制", "success"); }).catch(function() { showToast("复制失败", "error"); });
        });

        document.getElementById("btnExportReport").addEventListener("click", function() {
            const content = document.getElementById("reportContent").textContent;
            const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "周报_" + new Date().toISOString().slice(0, 10) + ".txt";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("周报导出成功", "success");
        });

        function showToast(message, type) {
            if (type === undefined) type = "info";
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = "toast toast-" + type + " show";
            setTimeout(function() { toast.classList.remove("show"); }, 3000);
        }

        loadHistory();
    </script>
</body>
