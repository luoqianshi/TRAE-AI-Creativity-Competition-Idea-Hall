<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>赶考测评考核 - TRAE Work 实战</title>
<!-- Tailwind CSS (本地) -->
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<!-- Iconify 图标 -->
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
        body {
            background-color: #e5e7eb;
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 模拟视频进度条动画效果 */
        .video-progress-fill {
            width: 26%;
            transition: width 0.3s ease;
        }

        /* 紫色渐变按钮 */
        .btn-purple-gradient {
            background: linear-gradient(to right, #7C3AED, #9333EA);
        }
    </style>
</head>
<body>
<!-- 手机外壳容器 -->
<div class="relative w-[375px] h-[812px] bg-[#F5F7FA] rounded-[40px] shadow-2xl overflow-hidden border-[8px] border-gray-800 flex flex-col">
<!-- 顶部状态栏模拟 -->
<div class="h-6 w-full bg-transparent flex justify-between items-center px-6 pt-2 z-20">
<span class="text-xs font-semibold text-white">10:20</span>
<div class="flex gap-1">
<iconify-icon class="text-white text-xs" icon="mdi:signal"></iconify-icon>
<iconify-icon class="text-white text-xs" icon="mdi:wifi"></iconify-icon>
<iconify-icon class="text-white text-xs" icon="mdi:battery"></iconify-icon>
</div>
</div>
<!-- 顶部导航栏 -->
<div class="relative flex-none h-16 bg-gradient-to-r from-[#7C3AED] to-[#3B82F6] flex items-center justify-center px-4">
<!-- 返回按钮 -->
<button class="absolute left-4 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white/30 backdrop-blur-md px-3 py-1 rounded-full flex items-center gap-1 text-black text-sm transition-all">
<iconify-icon class="text-lg" icon="mdi:chevron-left"></iconify-icon>
<span>返回</span>
</button>
<!-- 标题 -->
<h1 class="text-white font-bold text-lg">赶考测评考核</h1>
<!-- 右侧更多 -->
<button class="absolute right-4 text-white">
<iconify-icon class="text-2xl" icon="mdi:dots-horizontal"></iconify-icon>
</button>
</div>
<!-- 主体内容滚动区 -->
<div class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4 pb-24">
<!-- 模块一：课前准备 -->
<div class="bg-white rounded-2xl shadow-sm overflow-hidden flex flex-col">
<div class="relative">
<!-- 标签 -->
<div class="absolute top-3 left-3 z-10 bg-gray-700/80 text-white text-xs px-2 py-1 rounded">
                        课前准备
                    </div>
<!-- 视频区域 -->
<div class="relative aspect-video bg-black flex flex-col group">
<!-- 视频预览图 -->
<div class="absolute inset-0 flex items-center justify-center">
<img alt="TRAE App login and identity selection screen" class="w-full h-full object-cover opacity-60" src="https://modao.cc/agent-py/media/generated_images/2026-06-20/c1c8e255c54846ceb6950f651496db62.jpg"/>
<!-- 悬浮内容 -->
<div class="absolute top-4 right-4 bg-[#7C3AED] text-white text-[10px] px-2 py-1 rounded-sm">
                                注册，个人blog
                            </div>
<div class="absolute bottom-16 px-4 text-center">
<p class="text-white text-xs font-medium drop-shadow-md">选择身份和上岗方式 点击已通过考核直接上岗</p>
</div>
</div>
<!-- 播放按钮 -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center">
<iconify-icon class="text-white text-3xl ml-1" icon="mdi:play"></iconify-icon>
</div>
</div>
<!-- 播放控件 -->
<div class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black/80 to-transparent">
<div class="flex items-center gap-2 text-white text-[10px] mb-1">
<iconify-icon class="text-sm" icon="mdi:pause"></iconify-icon>
<span>0:19 / 1:11</span>
<div class="flex-1 h-1 bg-gray-600 rounded-full overflow-hidden">
<div class="video-progress-fill h-full bg-[#3B82F6]"></div>
</div>
<iconify-icon class="text-sm" icon="mdi:volume-high"></iconify-icon>
<iconify-icon class="text-sm" icon="mdi:fullscreen"></iconify-icon>
<iconify-icon class="text-sm" icon="mdi:dots-vertical"></iconify-icon>
</div>
</div>
</div>
</div>
<!-- 分值与操作区 -->
<div class="p-3">
<div class="flex items-center gap-2 mb-3">
<div class="bg-gray-100 text-gray-500 text-[10px] px-2 py-1 rounded flex items-center gap-1">
<iconify-icon icon="mdi:clock-outline"></iconify-icon>
                            1分
                        </div>
<div class="bg-[#FFC107] text-white text-[10px] px-2 py-1 rounded flex items-center gap-1 font-bold">
<iconify-icon icon="mdi:star"></iconify-icon>
                            10分
                        </div>
</div>
<div class="flex gap-2">
<button class="flex-1 btn-purple-gradient text-white py-2 rounded-lg flex items-center justify-center gap-2 text-sm shadow-md active:scale-95 transition-transform" onclick="showTip()">
<iconify-icon class="text-lg" icon="mdi:file-document-edit-outline"></iconify-icon>
                            答题
                        </button>
<button class="w-24 border border-gray-200 text-gray-600 py-2 rounded-lg flex items-center justify-center gap-1 text-sm">
<iconify-icon icon="mdi:file-document-outline"></iconify-icon>
                            文档
                        </button>
</div>
</div>
</div>
<!-- 模块二：基础入门 -->
<div class="bg-white rounded-2xl shadow-sm overflow-hidden flex flex-col">
<div class="relative">
<div class="absolute top-3 left-3 z-10 bg-gray-700/80 text-white text-xs px-2 py-1 rounded">
                        基础入门
                    </div>
<div class="relative aspect-video bg-black flex flex-col">
<img alt="TRAE Work Builder mode interface" class="w-full h-full object-cover opacity-50" src="https://modao.cc/agent-py/media/generated_images/2026-06-20/c117472f36724a18ad5efc1f474d5297.jpg"/>
<div class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center">
<iconify-icon class="text-white/50 text-5xl mb-2" icon="mdi:play-circle-outline"></iconify-icon>
<p class="text-white/80 text-xs">Builder 模式开启、项目创建与界面导航实操</p>
</div>
<div class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black/80 to-transparent">
<div class="flex items-center gap-2 text-white text-[10px]">
<iconify-icon class="text-sm" icon="mdi:play"></iconify-icon>
<span>0:00 / 2:35</span>
<div class="flex-1 h-1 bg-gray-600 rounded-full"></div>
</div>
</div>
</div>
</div>
<div class="p-3">
<div class="flex items-center gap-2 mb-3">
<div class="bg-gray-100 text-gray-500 text-[10px] px-2 py-1 rounded flex items-center gap-1">
<iconify-icon icon="mdi:clock-outline"></iconify-icon>
                            2分
                        </div>
<div class="bg-[#FFC107] text-white text-[10px] px-2 py-1 rounded flex items-center gap-1 font-bold">
<iconify-icon icon="mdi:star"></iconify-icon>
                            15分
                        </div>
</div>
<div class="flex gap-2">
<button class="flex-1 btn-purple-gradient text-white py-2 rounded-lg flex items-center justify-center gap-2 text-sm shadow-md" onclick="showTip()">
<iconify-icon class="text-lg" icon="mdi:file-document-edit-outline"></iconify-icon>
                            答题
                        </button>
<button class="w-24 border border-gray-200 text-gray-600 py-2 rounded-lg flex items-center justify-center gap-1 text-sm">
<iconify-icon icon="mdi:information-outline"></iconify-icon>
                            详情
                        </button>
</div>
</div>
</div>
<!-- 模块三：初阶实操 -->
<div class="bg-white rounded-2xl shadow-sm overflow-hidden flex flex-col">
<div class="relative">
<div class="absolute top-3 left-3 z-10 bg-gray-700/80 text-white text-xs px-2 py-1 rounded">
                        初阶实操
                    </div>
<div class="relative aspect-video bg-black flex flex-col">
<img alt="TRAE Work Chat mode interaction and terminal error analysis" class="w-full h-full object-cover opacity-50" src="https://modao.cc/agent-py/media/generated_images/2026-06-20/8778c0c9e26245679fc84fd910e76acd.jpg"/>
<div class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center">
<iconify-icon class="text-white/50 text-5xl mb-2" icon="mdi:play-circle-outline"></iconify-icon>
<p class="text-white/80 text-xs">Chat 模式对话、代码理解与终端报错联动分析</p>
</div>
<div class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black/80 to-transparent">
<div class="flex items-center gap-2 text-white text-[10px]">
<iconify-icon class="text-sm" icon="mdi:play"></iconify-icon>
<span>0:00 / 3:42</span>
<div class="flex-1 h-1 bg-gray-600 rounded-full"></div>
</div>
</div>
</div>
</div>
<div class="p-3">
<div class="flex items-center gap-2 mb-3">
<div class="bg-gray-100 text-gray-500 text-[10px] px-2 py-1 rounded flex items-center gap-1">
<iconify-icon icon="mdi:clock-outline"></iconify-icon>
                            3分
                        </div>
<div class="bg-[#FFC107] text-white text-[10px] px-2 py-1 rounded flex items-center gap-1 font-bold">
<iconify-icon icon="mdi:star"></iconify-icon>
                            20分
                        </div>
</div>
<div class="flex gap-2">
<button class="flex-1 btn-purple-gradient text-white py-2 rounded-lg flex items-center justify-center gap-2 text-sm shadow-md" onclick="showTip()">
<iconify-icon class="text-lg" icon="mdi:file-document-edit-outline"></iconify-icon>
                            答题
                        </button>
<button class="w-24 border border-gray-200 text-gray-600 py-2 rounded-lg flex items-center justify-center gap-1 text-sm">
<iconify-icon icon="mdi:information-outline"></iconify-icon>
                            详情
                        </button>
</div>
</div>
</div>
</div>
<!-- 底部学习进度条 -->
<div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-100 p-4 pb-8 flex items-center gap-4">
<div class="flex-1">
<div class="flex justify-between items-end mb-1">
<span class="text-gray-500 text-xs">学习进度</span>
<span class="text-[#7C3AED] font-bold text-sm">25%</span>
</div>
<div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-[#7C3AED] to-[#3B82F6] rounded-full" style="width: 25%"></div>
</div>
</div>
<div class="flex-none">
<div class="w-10 h-10 rounded-full border-2 border-[#7C3AED] flex items-center justify-center">
<span class="text-[#7C3AED] text-[10px] font-bold">1/4</span>
</div>
</div>
</div>
<!-- iOS Home Indicator 模拟 -->
<div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-gray-300 rounded-full"></div>
<!-- 弹窗提示 -->
<div class="fixed inset-0 flex items-center justify-center z-50 pointer-events-none opacity-0 transition-opacity duration-300" id="toast">
<div class="bg-black/70 text-white px-6 py-3 rounded-xl backdrop-blur-md shadow-lg">
                答题功能即将上线
            </div>
</div>
</div>
<script>
        function showTip() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2000);
        }
    </script>
</body>
</html>
