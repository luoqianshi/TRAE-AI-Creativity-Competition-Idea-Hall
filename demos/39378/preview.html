<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拾光碎片 - 情绪记录治愈工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { text-align: center; padding: 60px 20px; color: white; }
    header h1 { font-size: 3rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    header p { font-size: 1.2rem; opacity: 0.9; }
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin: 40px 0;
    }
    .feature-card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .feature-card:hover { transform: translateY(-10px); box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
    .feature-icon {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }
    .feature-icon.blue { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .feature-icon.green { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
    .feature-icon.purple { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
    .feature-icon.orange { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    .feature-card h3 { font-size: 1.4rem; margin-bottom: 15px; color: #2d3748; }
    .feature-card p { color: #718096; line-height: 1.6; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin: 60px 0;
    }
    .stat-card {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      color: white;
    }
    .stat-card .number { font-size: 2.5rem; font-weight: bold; }
    .stat-card .label { font-size: 0.9rem; opacity: 0.9; margin-top: 5px; }
    .cta-section { text-align: center; padding: 60px 20px; }
    .cta-button {
      display: inline-block;
      background: white;
      color: #667eea;
      padding: 15px 40px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .cta-button:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
    footer { text-align: center; padding: 30px; color: white; opacity: 0.8; font-size: 0.9rem; }
    @media (max-width: 768px) { header h1 { font-size: 2rem; } .features { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>✨ 拾光碎片</h1>
      <p>记录每一个情绪瞬间，让治愈成为日常</p>
    </header>
    <div class="features">
      <div class="feature-card">
        <div class="feature-icon blue">📝</div>
        <h3>情绪日记</h3>
        <p>随时随地记录你的心情变化，用文字捕捉生活中的每一个珍贵瞬间。</p>
      </div>
      <div class="feature-card">
        <div class="feature-icon green">📊</div>
        <h3>数据洞察</h3>
        <p>智能分析你的情绪波动趋势，帮你更好地了解自己的内心世界。</p>
      </div>
      <div class="feature-card">
        <div class="feature-icon purple">💚</div>
        <h3>治愈时刻</h3>
        <p>精选治愈内容，在你需要的时候给予温暖和力量。</p>
      </div>
      <div class="feature-card">
        <div class="feature-icon orange">🔒</div>
        <h3>隐私保护</h3>
        <p>本地存储，数据安全，你的秘密只属于你自己。</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat-card"><div class="number">50K+</div><div class="label">活跃用户</div></div>
      <div class="stat-card"><div class="number">1M+</div><div class="label">情绪记录</div></div>
      <div class="stat-card"><div class="number">98%</div><div class="label">用户好评</div></div>
      <div class="stat-card"><div class="number">24/7</div><div class="label">随时陪伴</div></div>
    </div>
    <div class="cta-section">
      <a href="#" class="cta-button">立即开始记录</a>
    </div>
    <footer>
      <p>&copy; 2024 拾光碎片 - 让每一天都值得被记住</p>
    </footer>
  </div>
</body>
</html>
