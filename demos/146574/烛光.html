<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>烛光管家</title>
  <style>
    :root {
      --bg-primary: #fdf7f0;
      --bg-card: #fff;
      --text-primary: #4a3a2d;
      --text-secondary: #7a6555;
      --accent: #e67e22;
      --accent-light: #f9d6a0;
      --border: #f0e4d6;
      --shadow: rgba(0, 0, 0, 0.04);
    }

    .dark-mode {
      --bg-primary: #2c251d;
      --bg-card: #3a2e22;
      --text-primary: #f5f0e6;
      --text-secondary: #c9b8a5;
      --accent: #d99e5b;
      --accent-light: #5a442c;
      --border: #4a3a2d;
      --shadow: rgba(0, 0, 0, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background-color 0.3s, color 0.3s;
      padding-bottom: 2rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 1.5rem 1.2rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.8rem;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      background: linear-gradient(90deg, var(--accent), #d35400);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0;
    }

    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 6px var(--shadow);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--text-primary);
    }

    .subtitle {
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    .type-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 2rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scrollbar-width: none;
    }

    .type-selector::-webkit-scrollbar {
      display: none;
    }

    .type-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      box-shadow: 0 2px 4px var(--shadow);
    }

    .type-btn:hover:not(.active) {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .type-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 4px 8px rgba(230, 126, 34, 0.2);
    }

    .guide-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 1.6rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 12px var(--shadow);
      border: 1px solid var(--border);
    }

    .guide-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .guide-title svg {
      width: 22px;
      height: 22px;
      fill: var(--accent);
    }

    .guide-item {
      margin-bottom: 1.1rem;
      padding-bottom: 1.1rem;
      border-bottom: 1px dashed var(--border);
    }

    .guide-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .guide-label {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.4rem;
      display: block;
    }

    .guide-value {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
    }

    .tips-section {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 1.6rem;
      box-shadow: 0 4px 12px var(--shadow);
      border: 1px solid var(--border);
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
    }

    .slider-container {
      margin: 1.2rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .slider-track {
      height: 6px;
      background: #f0e4d6;
      border-radius: 3px;
      position: relative;
      margin: 0.5rem 0;
    }

    .slider-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      width: 30%;
      transition: width 0.3s;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: transparent;
      outline: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .candle-tip {
      background: var(--accent-light);
      border-left: 4px solid var(--accent);
      padding: 0.8rem 1rem;
      border-radius: 0 8px 8px 0;
      margin-top: 1rem;
      font-size: 0.95rem;
      color: #5a3a1d;
    }

    .tip-icon {
      display: inline-block;
      margin-right: 0.5rem;
      vertical-align: middle;
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 1.2rem 1rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      .type-selector {
        gap: 0.6rem;
      }
      .type-btn {
        padding: 0.6rem 1rem;
        font-size: 0.85rem;
      }
      .guide-card,
      .tips-section {
        padding: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>烛光管家</h1>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <svg viewBox="0 0 24 24">
          <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a4.5 4.5 0 01-4.437-4.246 1.06 1.06 0 00-2.138 0 4.5 4.5 0 01-4.436 4.246 1.06 1.06 0 00-1.162 1.137 4.5 4.5 0 01-4.242 4.438 1.06 1.06 0 000 2.138 4.5 4.5 0 014.242 4.438 1.06 1.06 0 001.162 1.137 4.5 4.5 0 014.436 4.246 1.06 1.06 0 002.137 0 4.5 4.5 0 014.438-4.246 1.06 1.06 0 001.137-1.162 4.5 4.5 0 014.246-4.436 1.06 1.06 0 000-2.138 4.5 4.5 0 01-4.246-4.438 1.06 1.06 0 00-1.137-1.162z"/>
        </svg>
      </button>
    </header>

    <p class="subtitle">拆开新蜡烛前，请先选您的蜡烛类型 → 获取专属燃烛指引</p>

    <div class="type-selector">
      <button class="type-btn active" data-type="soy">大豆蜡</button>
      <button class="type-btn" data-type="coconut">椰子蜡</button>
      <button class="type-btn" data-type="beeswax">蜂蜡</button>
      <button class="type-btn" data-type="paraffin">石蜡</button>
      <button class="type-btn" data-type="rapeseed">菜籽蜡</button>
      <button class="type-btn" data-type="blended">混合蜡</button>
    </div>

    <div class="guide-card">
      <h2 class="guide-title">
        <svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a4.5 4.5 0 01-4.437-4.246 1.06 1.06 0 00-2.138 0 4.5 4.5 0 01-4.436 4.246 1.06 1.06 0 00-1.162 1.137 4.5 4.5 0 01-4.242 4.438 1.06 1.06 0 000 2.138 4.5 4.5 0 014.242 4.438 1.06 1.06 0 001.162 1.137 4.5 4.5 0 014.436 4.246 1.06 1.06 0 002.137 0 4.5 4.5 0 014.438-4.246 1.06 1.06 0 001.137-1.162 4.5 4.5 0 014.246-4.436 1.06 1.06 0 000-2.138 4.5 4.5 0 01-4.246-4.438 1.06 1.06 0 00-1.137-1.162z"/></svg>
        您的燃烛指引
      </h2>
      <div class="guide-item">
        <span class="guide-label">首次燃烧时长</span>
        <span class="guide-value" id="first-burn">2–3 小时</span>
      </div>
      <div class="guide-item">
        <span class="guide-label">烛芯长度建议</span>
        <span class="guide-value" id="wick-length">约 4 mm</span>
      </div>
      <div class="guide-item">
        <span class="guide-label">熄灭方式</span>
        <span class="guide-value" id="extinguish">用盖子闷熄</span>
      </div>
    </div>

    <div class="tips-section">
      <h2 class="section-title">
        <svg viewBox="0 0 24 24"><path d="M11.25 11.25a.75.75 0 01.75-1.5h.75a.75.75 0 01.75 1.5v.75a.75.75 0 01-1.5 0v-.75zM11.25 15a.75.75 0 01.75-1.5h.75a.75.75 0 01.75 1.5v.75a.75.75 0 01-1.5 0v-.75zM11.25 18.75a.75.75 0 01.75-1.5h.75a.75.75 0 01.75 1.5v.75a.75.75 0 01-1.5 0v-.75zM15 11.25a.75.75 0 01.75-1.5h.75a.75.75 0 01.75 1.5v.75a.75.75 0 01-1.5 0v-.75zM15 15a.75.75 0 01.75-1.5h.75a.75.75 0 01.75 1.5v.75a.75.75 0 01-1.5 0v-.75zM15 18.75a.75.75 0 01.75-1.5h.75a.75.75 0 01.75 1.5v.75a.75.75 0 01-1.5 0v-.75zM18.75 11.25a.75.75 0 01.75-1.5h.75a.75.75 0 01.75 1.5v.75a.75.75 0 01-1.5 0v-.75zM18.75 15a.75.75 0 01.75-1.5h.75a.75.75 0 01.75 1.5v.75a.75.75 0 01-1.5 0v-.75zM18.75 18.75a.75.75 0 01.75-1.5h.75a.75.75 0 01.75 1.5v.75a.75.75 0 01-1.5 0v-.75z"/></svg>
        实操小贴士
      </h2>

      <div class="slider-container">
        <div class="slider-labels">
          <span>太短（易熄）</span>
          <span>推荐：4 mm</span>
          <span>太长（冒黑烟）</span>
        </div>
        <div class="slider-track">
          <div class="slider-fill" id="sliderFill"></div>
        </div>
        <input type="range" min="2" max="8" value="4" id="wickSlider">
      </div>

      <div class="candle-tip">
        <span class="tip-icon">💡</span>
        <strong>小知识：</strong>烛芯过长会燃烧不充分产生黑烟；过短则火焰微弱易熄。每次点燃前用剪刀/专用剪修剪至 4 mm 最佳。
      </div>
    </div>

    <footer>
      <p>烛光管家 · 温馨提示：首次燃烧请确保蜡池完全融化至边缘，避免“隧道效应”</p>
    </footer>
  </div>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark-mode');
    }
    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      localStorage.setItem('theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
    });

    // 蜡烛类型数据
    const guides = {
      soy: {
        firstBurn: '2–3 小时',
        wickLength: '约 4 mm',
        extinguish: '用盖子闷熄'
      },
      coconut: {
        firstBurn: '1.5–2.5 小时',
        wickLength: '约 3 mm',
        extinguish: '用盖子闷熄'
      },
      beeswax: {
        firstBurn: '1–2 小时',
        wickLength: '约 5 mm',
        extinguish: '用盖子闷熄'
      },
      paraffin: {
        firstBurn: '2–4 小时',
        wickLength: '约 6 mm',
        extinguish: '用盖子闷熄'
      },
      rapeseed: {
        firstBurn: '2–3 小时',
        wickLength: '约 4 mm',
        extinguish: '用盖子闷熄'
      },
      blended: {
        firstBurn: '2 小时左右',
        wickLength: '约 4 mm',
        extinguish: '用盖子闷熄'
      }
    };

    // 类型按钮切换
    const typeButtons = document.querySelectorAll('.type-btn');
    const firstBurnEl = document.getElementById('first-burn');
    const wickLengthEl = document.getElementById('wick-length');
    const extinguishEl = document.getElementById('extinguish');

    typeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        typeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const type = btn.dataset.type;
        const guide = guides[type];
        firstBurnEl.textContent = guide.firstBurn;
        wickLengthEl.textContent = guide.wickLength;
        extinguishEl.textContent = guide.extinguish;
      });
    });

    // 烛芯滑块
    const wickSlider = document.getElementById('wickSlider');
    const sliderFill = document.getElementById('sliderFill');
    wickSlider.addEventListener('input', () => {
      const value = parseInt(wickSlider.value);
      const percent = ((value - 2) / 6) * 100;
      sliderFill.style.width = `${percent}%`;
    });
    // 初始化
    wickSlider.dispatchEvent(new Event('input'));
  </script>
</body>
</html>
