        title: "采桑子·塞上咏雪花",
        author: "纳兰性德",
        lines: ["非关癖爱轻模样，冷处偏佳。","别有根芽，不是人间富贵花。","谢娘别后谁能惜，飘泊天涯。","寒月悲笳，万里西风瀚海沙。"],
        appreciation: "咏雪亦自喻。\"不是人间富贵花\"道出高洁孤傲之志。雪花漂泊天涯，正如词人身不由己，寄寓身世之感。",
        mood: ["雪花", "寒月", "悲笳", "瀚海", "西风"],
        defaultPrompt: "万里瀚海黄沙，西风卷着雪花漫天飞舞，一弯寒月悬空，胡笳声悲，天地一片苍茫"
      },
      {
        id: 10,
        title: "浣溪沙·残雪凝辉冷画屏",
        author: "纳兰性德",
        lines: ["残雪凝辉冷画屏，落梅横笛已三更，","更无人处月胧明。","我是人间惆怅客，知君何事泪纵横，","断肠声里忆平生。"],
        appreciation: "全词情景交融，意境幽冷。\"我是人间惆怅客\"将身世之叹化为对自我的深刻剖析，情感真挚动人，读来令人感同身受。",
        mood: ["残雪", "落梅", "横笛", "胧月", "惆怅"],
        defaultPrompt: "残雪映辉，画屏清冷，三更笛声悠扬，落梅点点，胧月无人处独照断肠人"
      }
    ];

    // ==================== 状态 ====================
    let currentPoem = null;
    let currentSeed = 0;

    // ==================== DOM ====================
    const poemList = document.getElementById('poemList');
    const poemTitle = document.getElementById('poemTitle');
    const poemAuthor = document.getElementById('poemAuthor');
    const poemLines = document.getElementById('poemLines');
    const appreciationBox = document.getElementById('appreciationBox');
    const appreciationText = document.getElementById('appreciationText');
    const promptBox = document.getElementById('promptBox');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const canvasPlaceholder = document.getElementById('canvasPlaceholder');
    const inkCanvas = document.getElementById('inkCanvas');
    const canvasTools = document.getElementById('canvasTools');
    const shareModal = document.getElementById('shareModal');
    const sharePreview = document.getElementById('sharePreview');
    const sidebar = document.getElementById('sidebar');

    // ==================== 初始化列表 ====================
    function renderList() {
      poemList.innerHTML = '';
      poems.forEach((poem, idx) => {
        const item = document.createElement('div');
        item.className = 'poem-item' + (currentPoem && currentPoem.id === poem.id ? ' active' : '');
        item.innerHTML = `<div class="title">${poem.title}</div><div class="excerpt">${poem.lines[0]}</div>`;
        item.onclick = () => selectPoem(idx);
        poemList.appendChild(item);
      });
    }

    // ==================== 选择诗词 ====================
    function selectPoem(idx) {
      currentPoem = poems[idx];
      currentSeed = Math.floor(Math.random() * 10000);
      renderList();
      poemTitle.textContent = currentPoem.title;
      poemAuthor.textContent = currentPoem.author;
      poemLines.innerHTML = currentPoem.lines.map(l => `<span class="line">${l}</span>`).join('');
      appreciationText.textContent = currentPoem.appreciation;
      appreciationBox.style.display = 'block';
      promptBox.value = currentPoem.defaultPrompt;
      document.getElementById('poemPanel').scrollTop = 0;
      // 隐藏之前的画布
      canvasPlaceholder.style.display = 'flex';
      inkCanvas.style.display = 'none';
      canvasTools.style.display = 'none';
    }

    // ==================== 自动理解 ====================
    document.getElementById('autoPromptBtn').onclick = () => {
      if (!currentPoem) { alert('请先选择一首词'); return; }
      const moods = currentPoem.mood;
      const templates = [
        `${moods[0]}漫天，${moods[1]}依稀，一人独坐${moods[2]}之下，${moods[3]}萧瑟，满地${moods[4]}`,
        `远山如黛，${moods[0]}当空，${moods[1]}深处有人家，${moods[2]}吹拂，${moods[3]}点点`,
        `暮色四合，${moods[0]}渐起，${moods[1]}独立寒秋，${moods[2]}如水，${moods[3]}无声`
      ];
      promptBox.value = templates[Math.floor(Math.random() * templates.length)];
    };

    // ==================== 标签提示 ====================
    document.querySelectorAll('.tag-hint').forEach(tag => {
      tag.onclick = () => {
        const val = tag.dataset.tag;
        promptBox.value = promptBox.value ? promptBox.value + '，' + val : val;
      };
    });

    // ==================== 水墨画生成器 ====================
    function generateInkPainting() {
      if (!currentPoem) { alert('请先选择一首词'); return; }
      const prompt = promptBox.value || currentPoem.defaultPrompt;
      canvasWrapper.classList.add('generating');
      canvasPlaceholder.style.display = 'none';
      inkCanvas.style.display = 'block';
      canvasTools.style.display = 'flex';

      setTimeout(() => {
        drawInkPainting(prompt, currentPoem.mood);
        canvasWrapper.classList.remove('generating');
      }, 400);
    }

    function drawInkPainting(prompt, moods) {
      const ctx = inkCanvas.getContext('2d');
      const W = 800, H = 600;
      inkCanvas.width = W;
      inkCanvas.height = H;

      // 种子随机
      let seed = currentSeed;
      function rand() {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
      }

      // 宣纸背景
      ctx.fillStyle = '#f7f5f0';
      ctx.fillRect(0, 0, W, H);

      // 纹理噪点
      for (let i = 0; i < 3000; i++) {
        ctx.fillStyle = `rgba(0,0,0,${rand() * 0.03})`;
        ctx.fillRect(rand() * W, rand() * H, 2, 2);
      }

      // 解析提示词
      const p = prompt;
      const has = (kw) => p.includes(kw) || moods.some(m => m.includes(kw));
      const hasSnow = has('雪') || has('冬');
      const hasMoon = has('月') || has('夜');
      const hasRain = has('雨') || has('泪');
      const hasMountain = has('山') || has('峰') || has('岭');
      const hasTree = has('树') || has('木') || has('梧桐') || has('柳');
      const hasWater = has('水') || has('江') || has('河') || has('海');
      const hasFlower = has('花') || has('梨') || has('梅');
      const hasBird = has('雁') || has('鸟') || has('燕');
      const hasWind = has('风') || has('吹');
      const hasLamp = has('灯') || has('火') || has('烛');

      // 绘制远山（多层）
      function drawMountainLayer(yBase, color, heightScale, count) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, H);
        for (let i = 0; i <= count; i++) {
          const x = (W / count) * i;
          const peak = yBase - rand() * heightScale - heightScale * 0.3;
          const cp1x = x + (W / count) * 0.3;
          const cp1y = peak - rand() * 30;
          const cp2x = x + (W / count) * 0.7;
          const cp2y = peak + rand() * 20;
          const nextX = (W / count) * (i + 1);
          ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, nextX, yBase + rand() * 20);
        }
        ctx.lineTo(W, H);
        ctx.lineTo(0, H);
        ctx.fill();
      }

      if (hasMountain) {
        drawMountainLayer(H * 0.55, 'rgba(80,80,80,0.15)', 80, 5);
        drawMountainLayer(H * 0.65, 'rgba(60,60,60,0.25)', 60, 4);
        drawMountainLayer(H * 0.75, 'rgba(40,40,40,0.4)', 50, 6);
      } else {
        drawMountainLayer(H * 0.6, 'rgba(80,80,80,0.12)', 70, 5);
        drawMountainLayer(H * 0.7, 'rgba(60,60,60,0.22)', 55, 4);
      }

      // 水面
      if (hasWater) {
        ctx.strokeStyle = 'rgba(100,100,100,0.15)';
        ctx.lineWidth = 1;
        for (let y = H * 0.78; y < H * 0.95; y += 8) {
          ctx.beginPath();
          for (let x = 0; x < W; x += 20) {
            ctx.moveTo(x, y + Math.sin(x * 0.02) * 3);
            ctx.lineTo(x + 15, y + Math.sin((x + 15) * 0.02) * 3);
          }
          ctx.stroke();
        }
      }

      // 月亮
      if (hasMoon) {
        const mx = W * 0.75, my = H * 0.2, mr = 35;
        // 月晕
        const grad = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 2.5);
        grad.addColorStop(0, 'rgba(200,200,200,0.15)');
        grad.addColorStop(1, 'rgba(200,200,200,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(mx, my, mr * 2.5, 0, Math.PI * 2);
        ctx.fill();
        // 月体
        ctx.fillStyle = 'rgba(220,220,220,0.85)';
        ctx.beginPath();
        ctx.arc(mx, my, mr, 0, Math.PI * 2);
        ctx.fill();
        // 月纹
        ctx.fillStyle = 'rgba(180,180,180,0.3)';
        ctx.beginPath();
        ctx.arc(mx - 8, my - 5, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(mx + 10, my + 8, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // 树
      function drawTree(x, y, scale) {
        ctx.strokeStyle = `rgba(30,30,30,${0.5 + rand() * 0.3})`;
        ctx.lineWidth = 2 * scale;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y - 40 * scale);
        ctx.stroke();
        // 分支
        function branch(bx, by, angle, len, depth) {
          if (depth <= 0) return;
          const ex = bx + Math.cos(angle) * len;
          const ey = by + Math.sin(angle) * len;
          ctx.lineWidth = depth * 0.8 * scale;
          ctx.strokeStyle = `rgba(30,30,30,${0.3 + depth * 0.08})`;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(ex, ey);
          ctx.stroke();
          branch(ex, ey, angle - 0.3 - rand() * 0.3, len * 0.7, depth - 1);
          branch(ex, ey, angle + 0.3 + rand() * 0.3, len * 0.7, depth - 1);
        }
        branch(x, y - 40 * scale, -Math.PI / 2, 30 * scale, 4);
      }

      if (hasTree) {
        drawTree(W * 0.15, H * 0.78, 1.2);
        drawTree(W * 0.25, H * 0.76, 0.9);
        if (rand() > 0.5) drawTree(W * 0.82, H * 0.77, 1.0);
      }

      // 雪花
      if (hasSnow) {
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        for (let i = 0; i < 150; i++) {
          const sx = rand() * W;
          const sy = rand() * H * 0.7;
          const ss = 1 + rand() * 3;
          ctx.beginPath();
          ctx.arc(sx, sy, ss, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 雨丝
      if (hasRain) {
        ctx.strokeStyle = 'rgba(140,140,140,0.25)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 80; i++) {
          const rx = rand() * W;
          const ry = rand() * H * 0.6;
          const rl = 15 + rand() * 25;
          ctx.beginPath();
          ctx.moveTo(rx, ry);
          ctx.lineTo(rx - 3, ry + rl);
          ctx.stroke();
        }
      }

      // 落花
      if (hasFlower) {
        for (let i = 0; i < 40; i++) {
          const fx = rand() * W;
          const fy = rand() * H;
          ctx.fillStyle = `rgba(200,180,180,${0.3 + rand() * 0.3})`;
          ctx.beginPath();
          ctx.ellipse(fx, fy, 3 + rand() * 2, 1.5 + rand(), rand() * Math.PI, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 飞鸟
      if (hasBird) {
        ctx.strokeStyle = 'rgba(40,40,40,0.6)';
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 5; i++) {
          const bx = W * 0.2 + rand() * W * 0.5;
          const by = H * 0.15 + rand() * H * 0.2;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.quadraticCurveTo(bx + 8, by - 6, bx + 16, by);
          ctx.moveTo(bx + 10, by - 1);
          ctx.quadraticCurveTo(bx + 18, by - 7, bx + 26, by - 1);
          ctx.stroke();
        }
      }

      // 风动草
      if (hasWind) {
        ctx.strokeStyle = 'rgba(60,60,60,0.2)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 30; i++) {
          const wx = rand() * W;
          const wy = H * 0.75 + rand() * H * 0.2;
          ctx.beginPath();
          ctx.moveTo(wx, wy);
          ctx.quadraticCurveTo(wx + 5 + rand() * 10, wy - 5 - rand() * 8, wx + 15 + rand() * 10, wy - 2);
          ctx.stroke();
        }
      }

      // 灯火/帐篷灯
      if (hasLamp) {
        for (let i = 0; i < 8; i++) {
          const lx = W * 0.3 + rand() * W * 0.4;
          const ly = H * 0.6 + rand() * H * 0.15;
          const lg = ctx.createRadialGradient(lx, ly, 2, lx, ly, 15);
          lg.addColorStop(0, 'rgba(255,200,100,0.6)');
          lg.addColorStop(1, 'rgba(255,200,100,0)');
          ctx.fillStyle = lg;
          ctx.beginPath();
          ctx.arc(lx, ly, 15, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(255,220,150,0.9)';
          ctx.beginPath();
          ctx.arc(lx, ly, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 云雾
      function drawCloud(cx, cy, cw, ch) {
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, cw);
        g.addColorStop(0, 'rgba(200,200,200,0.2)');
        g.addColorStop(1, 'rgba(200,200,200,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(cx, cy, cw, ch, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      drawCloud(W * 0.3, H * 0.35, 120, 40);
      drawCloud(W * 0.6, H * 0.28, 100, 35);

      // 印章
      ctx.fillStyle = 'rgba(180,50,50,0.7)';
      ctx.fillRect(W - 80, H - 80, 50, 50);
      ctx.strokeStyle = 'rgba(180,50,50,0.5)';
      ctx.lineWidth = 1;
      ctx.strokeRect(W - 78, H - 78, 46, 46);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('纳兰', W - 55, H - 50);
      ctx.fillText('词境', W - 55, H - 32);

      // 题字
      ctx.fillStyle = 'rgba(60,60,60,0.7)';
      ctx.font = 'italic 16px KaiTi, serif';
      ctx.textAlign = 'left';
      ctx.fillText(currentPoem.title.split('·')[0], 30, H - 30);
    }

    document.getElementById('generateBtn').onclick = generateInkPainting;
    document.getElementById('regenerateBtn').onclick = () => {
      currentSeed = Math.floor(Math.random() * 10000);
      generateInkPainting();
    };

    // ==================== 保存 ====================
    document.getElementById('saveBtn').onclick = () => {
      if (inkCanvas.style.display === 'none') return;
      const link = document.createElement('a');
      link.download = `纳兰词境_${currentPoem.title}_${Date.now()}.png`;
      link.href = inkCanvas.toDataURL('image/png');
      link.click();
    };

    // ==================== 分享 ====================
    document.getElementById('shareBtn').onclick = () => {
      if (inkCanvas.style.display === 'none') return;
      sharePreview.src = inkCanvas.toDataURL('image/png');
      shareModal.classList.add('active');
    };
    document.getElementById('closeModalBtn').onclick = () => shareModal.classList.remove('active');
    document.getElementById('downloadBtn').onclick = () => {
      const link = document.createElement('a');
      link.download = `纳兰词境_${currentPoem.title}_${Date.now()}.png`;
      link.href = inkCanvas.toDataURL('image/png');
      link.click();
    };
    document.getElementById('copyLinkBtn').onclick = () => {
      // 复制提示信息
      const text = `我在「纳兰词境」中为《${currentPoem.title}》创作了一幅水墨画，prompt：${promptBox.value}`;
      navigator.clipboard.writeText(text).then(() => {
        alert('分享文案已复制到剪贴板');
      }).catch(() => {
        alert('复制失败，请手动复制');
      });
    };

    // ==================== 随机 ====================
    document.getElementById('randomPoemBtn').onclick = () => {
      selectPoem(Math.floor(Math.random() * poems.length));
    };

    // ==================== 移动端菜单 ====================
    document.getElementById('menuToggle').onclick = () => {
      sidebar.classList.toggle('open');
    };
    // 点击主内容关闭菜单
    document.querySelector('.main-content').addEventListener('click', (e) => {
      if (sidebar.classList.contains('open') && !e.target.closest('.menu-toggle')) {
        sidebar.classList.remove('open');
      }
    });

    // ==================== 初始化 ====================
    renderList();
    selectPoem(0);
  </script>
</body>
</html>
