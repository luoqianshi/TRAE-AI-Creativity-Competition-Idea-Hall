<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>花仙子换装花园</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --dress-main: #ffb7d5;
      --dress-sub: #ff8fb3;
      --dress-accent: #ff4d8d;
      --wing: rgba(255, 255, 255, 0.7);
      --skin: #ffe8d6;
      --hair: #ffd66b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Noto Sans SC', sans-serif;
    }

    body {
      background: linear-gradient(180deg, #b8e1ff 0%, #d4f1f9 50%, #a8e6cf 100%);
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
    }

    #garden {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      filter: blur(1px);
      animation: floatCloud linear infinite;
    }

    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 999px;
    }

    .cloud1 {
      width: 120px;
      height: 48px;
      top: 10%;
      left: -150px;
      animation-duration: 35s;
    }

    .cloud1::before {
      width: 60px;
      height: 60px;
      top: -28px;
      left: 18px;
    }

    .cloud1::after {
      width: 72px;
      height: 48px;
      top: -16px;
      right: 14px;
    }

    .cloud2 {
      width: 90px;
      height: 36px;
      top: 22%;
      left: -120px;
      animation-duration: 45s;
      animation-delay: -15s;
    }

    .cloud2::before {
      width: 48px;
      height: 48px;
      top: -22px;
      left: 14px;
    }

    .cloud2::after {
      width: 54px;
      height: 36px;
      top: -12px;
      right: 10px;
    }

    @keyframes floatCloud {
      from { transform: translateX(0); }
      to { transform: translateX(calc(100vw + 200px)); }
    }

    .grass {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 22vh;
      background: linear-gradient(180deg, #a8e6cf 0%, #7fdcb3 100%);
      border-radius: 50% 50% 0 0 / 30px 30px 0 0;
      transform: scaleX(1.2);
    }

    .grass-blade {
      position: absolute;
      bottom: 0;
      width: 8px;
      height: 24px;
      background: #6bcfa3;
      border-radius: 50% 50% 0 0;
      transform-origin: bottom center;
      animation: sway 3s ease-in-out infinite;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(6deg); }
    }

    #particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30;
    }

    #falling-petals {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .info-bar {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.92);
      padding: 16px 32px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      text-align: center;
      z-index: 15;
      min-width: 280px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 3px solid rgba(255, 182, 193, 0.5);
    }

    .info-bar.sparkle {
      animation: infoPop 0.5s ease;
    }

    @keyframes infoPop {
      0% { transform: translateX(-50%) scale(1); }
      40% { transform: translateX(-50%) scale(1.08); }
      100% { transform: translateX(-50%) scale(1); }
    }

    .costume-name {
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 26px;
      color: var(--dress-accent);
      margin-bottom: 4px;
      transition: color 0.4s ease;
    }

    .flower-language {
      font-size: 15px;
      color: #666;
      font-weight: 500;
    }

    .hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.85);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      color: #555;
      z-index: 15;
      pointer-events: none;
    }

    #fairy-container {
      position: absolute;
      left: 50%;
      bottom: 18vh;
      transform: translateX(-50%);
      width: 340px;
      height: 460px;
      z-index: 20;
    }

    #fairy {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.15));
      transition: filter 0.3s ease;
    }

    #fairy.transforming {
      animation: fairyBounce 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes fairyBounce {
      0% { transform: scale(1) translateY(0); }
      30% { transform: scale(1.05) translateY(-25px); }
      50% { transform: scale(0.95) translateY(5px); }
      70% { transform: scale(1.02) translateY(-10px); }
      100% { transform: scale(1) translateY(0); }
    }

    .fairy-part {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dress-main { fill: var(--dress-main); transition: fill 0.5s ease; }
    .dress-sub { fill: var(--dress-sub); transition: fill 0.5s ease; }
    .dress-accent { fill: var(--dress-accent); transition: fill 0.5s ease; }
    .wing { fill: var(--wing); transition: fill 0.5s ease; }
    .skin { fill: var(--skin); }
    .hair { fill: var(--hair); }

    .flower {
      position: absolute;
      z-index: 25;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.12));
    }

    .flower:hover, .flower.active {
      transform: scale(1.25);
      filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.8)) drop-shadow(0 8px 16px rgba(0, 0, 0, 0.15));
      z-index: 26;
    }

    .flower svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .glow-ring {
      position: absolute;
      border-radius: 50%;
      border: 3px dashed rgba(255, 255, 255, 0.7);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .flower.active .glow-ring {
      opacity: 1;
      animation: spinRing 4s linear infinite;
    }

    @keyframes spinRing {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    #key-group {
      transform-origin: 180px 262px;
      transition: transform 0.08s linear;
    }

    .brooch-glow {
      animation: broochSparkle 0.8s ease;
    }

    .brooch-breathe {
      animation: breatheGlow 2.6s ease-in-out infinite;
      transform-origin: 180px 262px;
      pointer-events: none;
    }

    @keyframes breatheGlow {
      0%, 100% { opacity: 0.35; transform: scale(0.92); }
      50% { opacity: 0.8; transform: scale(1.18); }
    }

    @keyframes broochSparkle {
      0% { filter: drop-shadow(0 0 0px rgba(255, 215, 0, 0)); transform: scale(1); }
      25% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.9)); transform: scale(1.15); }
      50% { filter: drop-shadow(0 0 35px rgba(255, 215, 0, 1)); transform: scale(1.25); }
      75% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8)); transform: scale(1.1); }
      100% { filter: drop-shadow(0 0 0px rgba(255, 215, 0, 0)); transform: scale(1); }
    }

    .sparkle-star {
      position: absolute;
      pointer-events: none;
      color: #ffd700;
      font-size: 20px;
      z-index: 35;
      animation: starPop 0.8s ease forwards;
    }

    @keyframes starPop {
      0% { transform: scale(0) rotate(0deg); opacity: 1; }
      100% { transform: scale(1.5) rotate(180deg); opacity: 0; }
    }

    .magic-flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.6) 0%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      z-index: 28;
    }

    .magic-flash.active {
      animation: flash 0.5s ease;
    }

    @keyframes flash {
      0% { opacity: 0; }
      30% { opacity: 1; }
      100% { opacity: 0; }
    }

    .dress-pattern {
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .dress-pattern.visible {
      opacity: 1;
    }

    .costume-layer {
      transition: opacity 0.4s ease;
    }

    .costume-detail {
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      opacity: 1;
      transform: scale(1);
    }

    .costume-detail.fading {
      opacity: 0;
      transform: scale(0.92);
    }
  </style>
</head>
<body>
  <div id="garden">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <canvas id="falling-petals"></canvas>
    <div class="grass" id="grass"></div>
    <div class="magic-flash" id="magicFlash"></div>
    <canvas id="particles"></canvas>

    <div class="info-bar" id="infoBar">
      <div class="costume-name" id="costumeName">晨曦花裙</div>
      <div class="flower-language" id="flowerLanguage">让每一朵花都绽放微笑</div>
    </div>

    <div id="fairy-container">
      <svg id="fairy" viewBox="0 0 360 480" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#ffe082;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ffca28;stop-opacity:1" />
          </linearGradient>
          <radialGradient id="blushGrad">
            <stop offset="0%" style="stop-color:#ff8a80;stop-opacity:0.5" />
            <stop offset="100%" style="stop-color:#ff8a80;stop-opacity:0" />
          </radialGradient>
          <radialGradient id="broochGlowGrad">
            <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.55" />
            <stop offset="70%" style="stop-color:#ffd700;stop-opacity:0.15" />
            <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0" />
          </radialGradient>
        </defs>

        <!-- 动态头发（后部） -->
        <g class="fairy-part costume-detail" id="hair-back"></g>

        <!-- 后翅膀 -->
        <g class="fairy-part" id="back-wings">
          <ellipse cx="120" cy="210" rx="55" ry="75" class="wing" transform="rotate(-25 120 210)" opacity="0.6"/>
          <ellipse cx="240" cy="210" rx="55" ry="75" class="wing" transform="rotate(25 240 210)" opacity="0.6"/>
        </g>

        <!-- 前翅膀 -->
        <g class="fairy-part" id="front-wings">
          <ellipse cx="130" cy="200" rx="45" ry="65" class="wing" transform="rotate(-20 130 200)"/>
          <ellipse cx="230" cy="200" rx="45" ry="65" class="wing" transform="rotate(20 230 200)"/>
        </g>

        <!-- 身体 -->
        <g class="fairy-part" id="body">
          <!-- 脖子 -->
          <path d="M170 212 Q180 238 190 212 L190 235 Q180 245 170 235 Z" class="skin"/>
          <!-- 腿部 -->
          <path d="M168 335 L168 385" stroke="var(--skin)" stroke-width="12" stroke-linecap="round"/>
          <path d="M192 335 L192 385" stroke="var(--skin)" stroke-width="12" stroke-linecap="round"/>
          <!-- 鞋子 -->
          <ellipse cx="168" cy="388" rx="11" ry="7" class="dress-accent"/>
          <ellipse cx="192" cy="388" rx="11" ry="7" class="dress-accent"/>
          <!-- 躯干/胸衣 -->
          <path d="M150 245 Q145 280 150 315 Q180 325 210 315 Q215 280 210 245 Q195 232 180 232 Q165 232 150 245" class="dress-main"/>
          <!-- 领口 -->
          <path d="M160 238 Q180 258 200 238" stroke="var(--skin)" stroke-width="4" fill="none"/>
        </g>

        <!-- 裙子 -->
        <g class="fairy-part" id="skirt">
          <path d="M150 315 Q105 398 70 408 Q120 423 180 426 Q240 423 290 408 Q255 398 210 315 Z" class="dress-sub"/>
          <path d="M150 315 Q118 372 95 382 Q140 394 180 397 Q220 394 265 382 Q242 372 210 315 Z" class="dress-main"/>
          <g id="skirt-decor" class="dress-pattern visible"></g>
        </g>

        <!-- 服装华丽层（披风、袖子、装饰） -->
        <g class="fairy-part costume-layer costume-detail" id="dress-overlay"></g>

        <!-- 花钥匙胸针 -->
        <g id="key-group">
          <circle cx="180" cy="262" r="32" fill="url(#broochGlowGrad)" class="brooch-breathe"/>
          <circle cx="180" cy="262" r="22" fill="#fff8e1" stroke="#ffd700" stroke-width="4"/>
          <circle cx="180" cy="262" r="16" fill="none" stroke="#ffd700" stroke-width="2" stroke-dasharray="3 2"/>
          <line x1="180" y1="262" x2="245" y2="262" stroke="#ffd700" stroke-width="7" stroke-linecap="round"/>
          <circle cx="252" cy="262" r="15" fill="none" stroke="#ffd700" stroke-width="6"/>
          <circle cx="252" cy="262" r="6" fill="#ff8fb3"/>
          <path d="M240 262 L243 254 L243 270 Z" fill="#ffd700"/>
          <circle cx="180" cy="262" r="9" fill="#ff8fb3" stroke="#ffd700" stroke-width="2"/>
          <circle cx="168" cy="250" r="3" fill="#ffeb3b"/>
          <circle cx="192" cy="250" r="3" fill="#ffeb3b"/>
          <circle cx="168" cy="274" r="3" fill="#ffeb3b"/>
          <circle cx="192" cy="274" r="3" fill="#ffeb3b"/>
        </g>

        <!-- 头部 -->
        <g class="fairy-part" id="head">
          <!-- 脸型 -->
          <ellipse cx="180" cy="162" rx="48" ry="50" class="skin"/>
          <!-- 腮红 -->
          <ellipse cx="152" cy="172" rx="11" ry="7" fill="url(#blushGrad)"/>
          <ellipse cx="208" cy="172" rx="11" ry="7" fill="url(#blushGrad)"/>
          <!-- 眼睛 -->
          <g id="eyes">
            <ellipse cx="160" cy="156" rx="12" ry="16" fill="#333"/>
            <circle cx="164" cy="152" r="5" fill="white"/>
            <ellipse cx="200" cy="156" rx="12" ry="16" fill="#333"/>
            <circle cx="204" cy="152" r="5" fill="white"/>
          </g>
          <!-- 嘴巴 -->
          <path d="M172 188 Q180 196 188 188" stroke="#e57373" stroke-width="3" stroke-linecap="round" fill="none"/>
        </g>

        <!-- 动态头发（前部/刘海） -->
        <g class="fairy-part costume-detail" id="hair-front"></g>

        <!-- 动态头饰 -->
        <g class="fairy-part costume-detail" id="head-accessory"></g>
      </svg>
    </div>

    <div class="hint">移动鼠标控制花钥匙胸针，指向花朵后点击即可变身！</div>
  </div>

    let currentCostume = defaultCostume;
    let audioCtx;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playMagicSound() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.08);
        gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.08);
        gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + i * 0.08 + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.08 + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * 0.08);
        osc.stop(audioCtx.currentTime + i * 0.08 + 0.4);
      });

      const sparkle = audioCtx.createOscillator();
      const sparkleGain = audioCtx.createGain();
      sparkle.type = 'triangle';
      sparkle.frequency.setValueAtTime(2000, audioCtx.currentTime);
      sparkle.frequency.exponentialRampToValueAtTime(4000, audioCtx.currentTime + 0.3);
      sparkleGain.gain.setValueAtTime(0, audioCtx.currentTime);
      sparkleGain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.05);
      sparkleGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
      sparkle.connect(sparkleGain);
      sparkleGain.connect(audioCtx.destination);
      sparkle.start();
      sparkle.stop(audioCtx.currentTime + 0.5);
    }

    function createFlowers() {
      const garden = document.getElementById('garden');
      flowers.forEach(flower => {
        const el = document.createElement('div');
        el.className = 'flower';
        el.id = `flower-${flower.id}`;
        el.style.width = `${flower.size}px`;
        el.style.height = `${flower.size}px`;
        if (flower.position.left) el.style.left = flower.position.left;
        if (flower.position.right) el.style.right = flower.position.right;
        el.style.top = flower.position.top;
        el.dataset.id = flower.id;

        const ring = document.createElement('div');
        ring.className = 'glow-ring';
        ring.style.width = `${flower.size + 30}px`;
        ring.style.height = `${flower.size + 30}px`;
        ring.style.left = '50%';
        ring.style.top = '50%';

        el.innerHTML = `<svg viewBox="0 0 90 130">${flower.icon(flower.colors.accent)}</svg>`;
        el.appendChild(ring);
        garden.appendChild(el);

        el.addEventListener('click', () => transformTo(flower));
      });
    }

    function createGrass() {
      const grass = document.getElementById('grass');
      for (let i = 0; i < 40; i++) {
        const blade = document.createElement('div');
        blade.className = 'grass-blade';
        blade.style.left = `${Math.random() * 100}%`;
        blade.style.height = `${16 + Math.random() * 20}px`;
        blade.style.animationDelay = `${Math.random() * 3}s`;
        blade.style.animationDuration = `${2.5 + Math.random() * 1.5}s`;
        grass.appendChild(blade);
      }
    }

    function updateKeyAngle(e) {
      const fairy = document.getElementById('fairy-container');
      const rect = fairy.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height * 0.57;
      const dx = e.clientX - centerX;
      const dy = e.clientY - centerY;
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;
      document.getElementById('key-group').style.transform = `rotate(${angle}deg)`;

      checkFlowerHighlight(angle, centerX, centerY, e.clientX, e.clientY);
    }

    function checkFlowerHighlight(keyAngle, centerX, centerY, mouseX, mouseY) {
      let closest = null;
      let minDiff = Infinity;

      flowers.forEach(flower => {
        const el = document.getElementById(`flower-${flower.id}`);
        const rect = el.getBoundingClientRect();
        const fx = rect.left + rect.width / 2;
        const fy = rect.top + rect.height / 2;
        const dx = fx - centerX;
        const dy = fy - centerY;
        let flowerAngle = Math.atan2(dy, dx) * 180 / Math.PI;
        let diff = Math.abs(flowerAngle - keyAngle);
        if (diff > 180) diff = 360 - diff;

        const dist = Math.hypot(mouseX - fx, mouseY - fy);
        if (diff < 35 && dist < minDiff) {
          minDiff = dist;
          closest = flower;
        }
      });

      document.querySelectorAll('.flower').forEach(el => el.classList.remove('active'));
      if (closest) {
        document.getElementById(`flower-${closest.id}`).classList.add('active');
      }
    }

    function transformTo(flower) {
      currentCostume = flower;
      const root = document.documentElement;
      root.style.setProperty('--dress-main', flower.colors.main);
      root.style.setProperty('--dress-sub', flower.colors.sub);
      root.style.setProperty('--dress-accent', flower.colors.accent);
      root.style.setProperty('--hair', flower.colors.hair);

      document.getElementById('costumeName').textContent = flower.name;
      document.getElementById('flowerLanguage').textContent = flower.language;
      document.getElementById('infoBar').classList.add('sparkle');
      setTimeout(() => document.getElementById('infoBar').classList.remove('sparkle'), 500);

      const fairy = document.getElementById('fairy');
      fairy.classList.remove('transforming');
      void fairy.offsetWidth;
      fairy.classList.add('transforming');

      updateSkirtPattern(flower.pattern);
      updateCostumeDetails(flower);

      document.getElementById('magicFlash').classList.add('active');
      setTimeout(() => document.getElementById('magicFlash').classList.remove('active'), 500);

      const brooch = document.getElementById('key-group');
      brooch.classList.remove('brooch-glow');
      void brooch.offsetWidth;
      brooch.classList.add('brooch-glow');
      setTimeout(() => brooch.classList.remove('brooch-glow'), 800);

      createBurst();
      playMagicSound();
      createSparkleStars();
    }

    function updateCostumeDetails(flower, animate = true) {
      const contentGroups = ['hair-back', 'hair-front', 'head-accessory', 'dress-overlay'];
      const fadeGroups = [...contentGroups];
      const applyContent = () => {
        const hairColor = flower.colors.hair;
        document.getElementById('hair-back').innerHTML = flower.hairBack(hairColor);
        document.getElementById('hair-front').innerHTML = flower.hairFront(hairColor);
        document.getElementById('head-accessory').innerHTML = flower.headAccessory(flower.colors.accent);
        document.getElementById('dress-overlay').innerHTML = flower.dressOverlay(flower.colors.accent);
      };

      if (!animate) {
        applyContent();
        return;
      }

      fadeGroups.forEach(id => document.getElementById(id).classList.add('fading'));

      setTimeout(() => {
        applyContent();
        requestAnimationFrame(() => {
          fadeGroups.forEach(id => document.getElementById(id).classList.remove('fading'));
        });
      }, 320);
    }

    function updateSkirtPattern(pattern) {
      const decor = document.getElementById('skirt-decor');
      decor.classList.remove('visible');
      
      setTimeout(() => {
        let shapes = '';
        const positions = [
          {cx: 110, cy: 397}, {cx: 147, cy: 405}, {cx: 180, cy: 408},
          {cx: 213, cy: 405}, {cx: 250, cy: 397}
        ];
        const accent = currentCostume.colors.accent;

        switch(pattern) {
          case 'hearts':
            shapes = positions.map(p => `<path d="M${p.cx} ${p.cy+5} Q${p.cx-8} ${p.cy-4} ${p.cx} ${p.cy-8} Q${p.cx+8} ${p.cy-4} ${p.cx} ${p.cy+5}" fill="${accent}"/>`).join('');
            break;
          case 'sunrays':
            shapes = positions.map(p => `<g transform="translate(${p.cx},${p.cy})"><circle r="6" fill="${accent}"/><path d="M0 -10 L2 -4 L8 -4 L3 0 L5 6 L0 2 L-5 6 L-3 0 L-8 -4 L-2 -4 Z" fill="#fff"/></g>`).join('');
            break;
          case 'dots':
            shapes = positions.map(p => `<circle cx="${p.cx}" cy="${p.cy}" r="7" fill="${accent}"/><circle cx="${p.cx-3}" cy="${p.cy-3}" r="2" fill="#fff" opacity="0.6"/>`).join('');
            break;
          case 'petals':
            shapes = positions.map(p => `<g transform="translate(${p.cx},${p.cy})">${[0,90,180,270].map(a => `<ellipse cx="0" cy="-7" rx="4" ry="8" fill="${accent}" transform="rotate(${a})"/>`).join('')}<circle r="3" fill="#fff"/></g>`).join('');
            break;
          case 'stripes':
            shapes = positions.map(p => `<rect x="${p.cx-7}" y="${p.cy-7}" width="14" height="14" rx="3" fill="${accent}"/><line x1="${p.cx-4}" y1="${p.cy-7}" x2="${p.cx-4}" y2="${p.cy+7}" stroke="#fff" stroke-width="2" opacity="0.5"/><line x1="${p.cx+3}" y1="${p.cy-7}" x2="${p.cx+3}" y2="${p.cy+7}" stroke="#fff" stroke-width="2" opacity="0.5"/></g>`).join('');
            break;
          case 'teardrops':
            shapes = positions.map(p => `<path d="M${p.cx} ${p.cy-8} Q${p.cx+6} ${p.cy} ${p.cx} ${p.cy+8} Q${p.cx-6} ${p.cy} ${p.cx} ${p.cy-8}" fill="${accent}"/>`).join('');
            break;
          case 'daisies':
            shapes = positions.map(p => `<g transform="translate(${p.cx},${p.cy})">${[0,60,120,180,240,300].map(a => `<ellipse cx="0" cy="-8" rx="3" ry="8" fill="#fff" stroke="${accent}" stroke-width="1" transform="rotate(${a})"/>`).join('')}<circle r="3" fill="${accent}"/></g>`).join('');
            break;
          case 'clusters':
            shapes = positions.map(p => `<g transform="translate(${p.cx},${p.cy})">${[[-4,-4],[4,-4],[-4,4],[4,4],[0,0]].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="4" fill="${accent}" opacity="0.85"/>`).join('')}<circle cx="0" cy="0" r="2" fill="#fff"/></g>`).join('');
            break;
          default:
            shapes = positions.map(p => `<circle cx="${p.cx}" cy="${p.cy}" r="8" fill="${accent}"/>`).join('');
        }
        decor.innerHTML = shapes;
        decor.classList.add('visible');
      }, 200);
    }

    function createSparkleStars() {
      const fairy = document.getElementById('fairy-container');
      const rect = fairy.getBoundingClientRect();
      for (let i = 0; i < 10; i++) {
        const star = document.createElement('div');
        star.className = 'sparkle-star';
        star.textContent = '✦';
        star.style.left = `${rect.left + rect.width / 2 + (Math.random() - 0.5) * 200}px`;
        star.style.top = `${rect.top + rect.height / 2 + (Math.random() - 0.5) * 240}px`;
        star.style.animationDelay = `${Math.random() * 0.2}s`;
        document.body.appendChild(star);
        setTimeout(() => star.remove(), 1000);
      }
    }

    // Particle system
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 12;
        this.vy = (Math.random() - 0.5) * 12 - 3;
        this.life = 1;
        this.decay = 0.015 + Math.random() * 0.015;
        this.color = color;
        this.size = 4 + Math.random() * 8;
        this.shape = Math.random() > 0.5 ? 'circle' : 'star';
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.2;
        this.vx *= 0.96;
        this.life -= this.decay;
        this.size *= 0.97;
      }

      draw() {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        if (this.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        } else {
          drawStar(ctx, this.x, this.y, 5, this.size, this.size / 2);
        }
        ctx.globalAlpha = 1;
      }
    }

    function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      let step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;
        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fill();
    }

    function createBurst() {
      const fairy = document.getElementById('fairy-container');
      const rect = fairy.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height * 0.55;
      const colors = [currentCostume.colors.main, currentCostume.colors.sub, currentCostume.colors.accent, '#ffd700', '#ffffff'];
      for (let i = 0; i < 60; i++) {
        particles.push(new Particle(centerX, centerY, colors[Math.floor(Math.random() * colors.length)]));
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }

    // Falling petals
    const petalCanvas = document.getElementById('falling-petals');
    const petalCtx = petalCanvas.getContext('2d');
    let petals = [];

    function resizePetalCanvas() {
      petalCanvas.width = window.innerWidth;
      petalCanvas.height = window.innerHeight;
    }

    class Petal {
      constructor() {
        this.reset();
        this.y = Math.random() * petalCanvas.height;
      }

      reset() {
        this.x = Math.random() * petalCanvas.width;
        this.y = -20;
        this.size = 6 + Math.random() * 8;
        this.speed = 0.5 + Math.random() * 1;
        this.sway = Math.random() * 2;
        this.swaySpeed = 0.01 + Math.random() * 0.02;
        this.angle = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.03;
        const colors = ['#f8bbd0', '#e1bee7', '#ffcdd2', '#fff9c4', '#ffffff'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }

      update() {
        this.y += this.speed;
        this.x += Math.sin(this.y * this.swaySpeed) * this.sway;
        this.angle += this.rotationSpeed;
        if (this.y > petalCanvas.height + 20) this.reset();
      }

      draw() {
        petalCtx.save();
        petalCtx.translate(this.x, this.y);
        petalCtx.rotate(this.angle);
        petalCtx.fillStyle = this.color;
        petalCtx.globalAlpha = 0.7;
        petalCtx.beginPath();
        petalCtx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
        petalCtx.fill();
        petalCtx.restore();
      }
    }

    function initPetals() {
      for (let i = 0; i < 30; i++) {
        petals.push(new Petal());
      }
    }

    function animatePetals() {
      petalCtx.clearRect(0, 0, petalCanvas.width, petalCanvas.height);
      petals.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animatePetals);
    }

    // Initialization
    window.addEventListener('resize', () => {
      resizeCanvas();
      resizePetalCanvas();
    });

    document.addEventListener('mousemove', updateKeyAngle);
    document.addEventListener('click', initAudio);

    createFlowers();
    createGrass();
    resizeCanvas();
    resizePetalCanvas();
    initPetals();
    animateParticles();
    animatePetals();

    // Apply default costume details
    updateCostumeDetails(defaultCostume, false);
    updateSkirtPattern(defaultCostume.pattern);
  </script>
</body>
</html>
