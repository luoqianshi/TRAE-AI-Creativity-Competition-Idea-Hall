<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全能修图参数助手 | Pro Photo Editor</title>
    <style>
        /* ========== LOOP 2：深色科技感 UI 样式 ========== */
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1a1a1a;
            --bg-panel: #1e1e1e;
            --bg-input: #252525;
            --accent: #00d4ff;
            --accent-grad-end: #7c3aed;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --border: #333333;
            --danger: #ff4757;
            --success: #2ed573;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, var(--accent), var(--accent-grad-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo::before {
            content: "◈";
            font-size: 24px;
            -webkit-text-fill-color: var(--accent);
        }

        .header-info {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Main layout */
        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Preview area */
        .preview-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 20% 20%, rgba(0, 212, 255, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(124, 58, 237, 0.04) 0%, transparent 40%),
                var(--bg-primary);
            position: relative;
            padding: 24px;
            overflow: auto;
        }

        .preview-area::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .preview-area::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .preview-area::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        #previewCanvas {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border-radius: 6px;
            display: none;
        }

        #previewCanvas.visible {
            display: block;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
            border: 2px dashed var(--border);
            border-radius: 12px;
            max-width: 360px;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .empty-state p {
            font-size: 14px;
            line-height: 1.6;
        }

        /* Controls panel */
        .controls {
            width: 360px;
            min-width: 320px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .controls-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sliders-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .sliders-container::-webkit-scrollbar {
            width: 6px;
        }

        .sliders-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .sliders-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* Control group */
        .control-group {
            margin-bottom: 20px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .control-name {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-name::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        .control-value {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            color: var(--text-primary);
            background: var(--bg-input);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            min-width: 44px;
            text-align: center;
        }

        /* Custom range slider */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--bg-input);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-grad-end));
            background-size: var(--progress, 0%) 100%;
            background-repeat: no-repeat;
            background-color: var(--bg-input);
        }

        input[type="range"]::-moz-range-track {
            height: 6px;
            border-radius: 3px;
            background: var(--bg-input);
        }

        input[type="range"]::-moz-range-progress {
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-grad-end));
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--accent);
            margin-top: -6px;
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.5);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.8);
        }

        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.25);
            box-shadow: 0 0 20px rgba(0, 212, 255, 1);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--accent);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.5);
        }

        /* Actions */
        .actions {
            padding: 18px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--bg-secondary);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        #uploadBtn {
            background: linear-gradient(90deg, var(--accent), var(--accent-grad-end));
            color: #fff;
            box-shadow: 0 4px 16px rgba(0, 212, 255, 0.25);
        }

        #uploadBtn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.35);
        }

        #exportBtn {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        #exportBtn:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        #exportBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .reset-row {
            display: flex;
            gap: 10px;
        }

        .reset-row button {
            flex: 1;
            padding: 10px;
            font-size: 12px;
            background: var(--bg-input);
            color: var(--text-secondary);
        }

        .reset-row button:hover {
            color: var(--text-primary);
            background: var(--border);
        }

        /* Status / loading */
        .status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(18, 18, 18, 0.9);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .status.visible {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 900px) {
            main {
                flex-direction: column;
            }

            .controls {
                width: 100%;
                min-width: auto;
                max-height: 45vh;
                border-left: none;
                border-top: 1px solid var(--border);
            }

            .preview-area {
                min-height: 55vh;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 12px 16px;
            }

            .logo {
                font-size: 16px;
            }

            .header-info {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- ========== LOOP 1：HTML 骨架与文件上传 ========== -->
    <div class="app">
        <header>
            <div class="logo">全能修图参数助手</div>
            <div class="header-info">Canvas 实时渲染 · 高清导出</div>
        </header>

        <main>
            <section class="preview-area" id="dropZone">
                <canvas id="previewCanvas"></canvas>
                <div class="empty-state" id="emptyState">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <h3>暂无图片</h3>
                    <p>点击右下角“选择图片”上传，或将图片拖入此区域开始修图。</p>
                </div>
                <div class="status" id="status">处理中…</div>
            </section>

            <aside class="controls">
                <div class="controls-header">参数调节面板</div>
                <div class="sliders-container" id="slidersContainer"></div>
                <div class="actions">
                    <button id="uploadBtn">选择图片</button>
                    <div class="reset-row">
                        <button id="resetBtn">重置所有参数</button>
                        <button id="autoBtn">自动优化</button>
                    </div>
                    <button id="exportBtn" disabled>导出/保存高清图</button>
                </div>
            </aside>
        </main>
    </div>

    <input type="file" id="fileInput" accept="image/*" hidden>

    <script>
        // ========== LOOP 3 & 4：图像处理核心与导出 ==========

        // 配置
        const MAX_PREVIEW_SIZE = 1200;       // 预览图最大边长，控制实时性能
        const EXPORT_QUALITY = 0.95;          // JPEG 导出质量
        const SLIDER_CONFIG = [
            { key: 'exposure',   label: '曝光度 Exposure',     min: -100, max: 100, step: 1,   unit: '%', default: 0 },
            { key: 'contrast',   label: '对比度 Contrast',     min: -100, max: 100, step: 1,   unit: '%', default: 0 },
            { key: 'highlights', label: '高光 Highlights',     min: -100, max: 100, step: 1,   unit: '%', default: 0 },
            { key: 'shadows',    label: '阴影 Shadows',        min: -100, max: 100, step: 1,   unit: '%', default: 0 },
            { key: 'whites',     label: '白色色阶 Whites',     min: -100, max: 100, step: 1,   unit: '%', default: 0 },
            { key: 'blacks',     label: '黑色色阶 Blacks',     min: -100, max: 100, step: 1,   unit: '%', default: 0 },
            { key: 'temp',       label: '色温 Color Temp',     min: -100, max: 100, step: 1,   unit: '%', default: 0 },
            { key: 'tint',       label: '色调 Tint',           min: -100, max: 100, step: 1,   unit: '%', default: 0 },
            { key: 'saturation', label: '饱和度 Saturation',   min: -100, max: 100, step: 1,   unit: '%', default: 0 },
            { key: 'sharpness',  label: '锐化 Sharpness',      min: 0,    max: 100, step: 1,   unit: '%', default: 0 }
        ];

        // 状态
        const state = {
            originalImage: null,      // 原始 Image 对象
            fullWidth: 0,             // 原始宽度
            fullHeight: 0,            // 原始高度
            previewWidth: 0,          // 预览宽度
            previewHeight: 0,         // 预览高度
            previewOriginalData: null,// 预览尺寸原始 ImageData
            params: {},
            needsUpdate: false,
            isExporting: false
        };

        SLIDER_CONFIG.forEach(cfg => state.params[cfg.key] = cfg.default);

        // DOM 引用
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const exportBtn = document.getElementById('exportBtn');
        const resetBtn = document.getElementById('resetBtn');
        const autoBtn = document.getElementById('autoBtn');
        const previewCanvas = document.getElementById('previewCanvas');
        const emptyState = document.getElementById('emptyState');
        const slidersContainer = document.getElementById('slidersContainer');
        const dropZone = document.getElementById('dropZone');
        const statusEl = document.getElementById('status');

        const previewCtx = previewCanvas.getContext('2d', { willReadFrequently: true });

        // 初始化滑块 UI
        function initSliders() {
            slidersContainer.innerHTML = '';
            SLIDER_CONFIG.forEach(cfg => {
                const group = document.createElement('div');
                group.className = 'control-group';

                const label = document.createElement('div');
                label.className = 'control-label';
                label.innerHTML = `
                    <span class="control-name">${cfg.label}</span>
                    <span class="control-value" id="val-${cfg.key}">${formatValue(cfg.default, cfg.unit)}</span>
                `;

                const input = document.createElement('input');
                input.type = 'range';
                input.min = cfg.min;
                input.max = cfg.max;
                input.step = cfg.step;
                input.value = cfg.default;
                input.dataset.key = cfg.key;
                input.id = `slider-${cfg.key}`;
                updateSliderProgress(input);

                input.addEventListener('input', () => {
                    const key = input.dataset.key;
                    state.params[key] = parseFloat(input.value);
                    document.getElementById(`val-${key}`).textContent = formatValue(state.params[key], cfg.unit);
                    updateSliderProgress(input);
                    requestPreviewUpdate();
                });

                group.appendChild(label);
                group.appendChild(input);
                slidersContainer.appendChild(group);
            });
        }

        function formatValue(value, unit) {
            return (value > 0 ? '+' : '') + value + unit;
        }

        function updateSliderProgress(input) {
            const min = parseFloat(input.min);
            const max = parseFloat(input.max);
            const val = parseFloat(input.value);
            const percent = ((val - min) / (max - min)) * 100;
            input.style.setProperty('--progress', `${percent}%`);
        }

        // 文件上传
        uploadBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadFile(file);
        });

        // 拖拽上传
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.background = 'rgba(0, 212, 255, 0.04)';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.background = '';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.background = '';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) loadFile(file);
        });

        function loadFile(file) {
            showStatus('正在读取图片…');
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(url);
                state.originalImage = img;
                state.fullWidth = img.naturalWidth;
                state.fullHeight = img.naturalHeight;
                preparePreview();
                emptyState.style.display = 'none';
                previewCanvas.classList.add('visible');
                exportBtn.disabled = false;
                requestPreviewUpdate();
                showStatus(`已加载 ${state.fullWidth}×${state.fullHeight}`);
                setTimeout(hideStatus, 2000);
            };
            img.onerror = () => {
                alert('图片加载失败，请尝试其他格式。');
                hideStatus();
            };
            img.src = url;
        }

        // 准备预览尺寸
        function preparePreview() {
            const scale = Math.min(1, MAX_PREVIEW_SIZE / Math.max(state.fullWidth, state.fullHeight));
            state.previewWidth = Math.round(state.fullWidth * scale);
            state.previewHeight = Math.round(state.fullHeight * scale);

            previewCanvas.width = state.previewWidth;
            previewCanvas.height = state.previewHeight;

            // 绘制预览尺寸原图并缓存像素
            previewCtx.drawImage(state.originalImage, 0, 0, state.previewWidth, state.previewHeight);
            state.previewOriginalData = previewCtx.getImageData(0, 0, state.previewWidth, state.previewHeight);
        }

        // 请求更新预览（节流，每帧最多一次）
        function requestPreviewUpdate() {
            if (!state.originalImage) return;
            state.needsUpdate = true;
            if (!state.renderScheduled) {
                state.renderScheduled = true;
                requestAnimationFrame(() => {
                    state.renderScheduled = false;
                    if (state.needsUpdate) {
                        renderPreview();
                        state.needsUpdate = false;
                    }
                });
            }
        }

        // 渲染预览
        function renderPreview() {
            const { previewWidth, previewHeight, previewOriginalData, params } = state;
            if (!previewOriginalData) return;

            // 第一步：色调 / 白平衡 / 饱和度
            const processed = applyToneAndColor(previewOriginalData, params);

            // 第二步：真实卷积锐化（Canvas 像素级）
            if (params.sharpness > 0) {
                applyConvolutionSharpen(processed, previewWidth, previewHeight, params.sharpness);
            }

            previewCtx.putImageData(processed, 0, 0);
        }

        // 色调曲线 + 白平衡 + 饱和度（单通道 LUT 优化）
        function applyToneAndColor(srcData, params) {
            const width = srcData.width;
            const height = srcData.height;
            const src = srcData.data;
            const dst = new Uint8ClampedArray(src.length);

            // 预计算色调曲线：原亮度 -> 目标亮度倍率
            const toneMultiplier = buildToneMultiplier(params);

            // 白平衡系数
            const rMul = 1 + params.temp * 0.0040 - params.tint * 0.0020;
            const gMul = 1 - params.temp * 0.0015 - params.tint * 0.0040;
            const bMul = 1 - params.temp * 0.0040 + params.tint * 0.0020;

            const satScale = 1 + params.saturation / 100;

            for (let i = 0, len = src.length; i < len; i += 4) {
                let r = src[i];
                let g = src[i + 1];
                let b = src[i + 2];
                const a = src[i + 3];

                // Rec.601 亮度
                const y = (r * 0.299 + g * 0.587 + b * 0.114) | 0;
                const m = toneMultiplier[y];

                r *= m * rMul;
                g *= m * gMul;
                b *= m * bMul;

                // 饱和度：基于处理后的亮度进行线性插值
                const newY = r * 0.299 + g * 0.587 + b * 0.114;
                r = newY + (r - newY) * satScale;
                g = newY + (g - newY) * satScale;
                b = newY + (b - newY) * satScale;

                dst[i] = clampToByte(r);
                dst[i + 1] = clampToByte(g);
                dst[i + 2] = clampToByte(b);
                dst[i + 3] = a;
            }

            return new ImageData(dst, width, height);
        }

        // 构建色调查找表：输入亮度（0-255）-> 输出/输入的倍率
        function buildToneMultiplier(params) {
            const table = new Float32Array(256);
            for (let i = 0; i < 256; i++) {
                let x = i / 255;

                // 曝光度：整体亮度缩放
                x *= Math.pow(2, params.exposure / 100);

                // 对比度：以中灰为基准的 S 曲线
                const contrast = params.contrast / 100;
                x = (x - 0.5) * (1 + contrast) + 0.5;

                // 阴影：调整暗部
                const shadows = params.shadows / 100;
                x += shadows * Math.max(0, 0.5 - x) * 0.5;

                // 高光：调整亮部
                const highlights = params.highlights / 100;
                x += highlights * Math.max(0, x - 0.5) * 0.5;

                // 白色色阶：扩展/压缩高光端
                const whites = params.whites / 100;
                x *= (1 + whites * 0.25);

                // 黑色色阶：提升/压暗暗部端
                const blacks = params.blacks / 100;
                x += blacks * 0.1;

                // 限制在有效范围内
                const target = Math.max(0.0001, Math.min(1, x));
                table[i] = target / (i / 255 || 0.0001);
            }
            return table;
        }

        // 真实 3x3 卷积锐化
        function applyConvolutionSharpen(imgData, width, height, sharpness) {
            const src = imgData.data;
            const dst = new Uint8ClampedArray(src.length);
            const amount = sharpness / 100;

            // 拉普拉斯锐化核：中心 1+4k，四邻域 -k
            const k = amount;
            const kCenter = 1 + 4 * k;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;

                    // 边界直接复制
                    if (x === 0 || x === width - 1 || y === 0 || y === height - 1) {
                        dst[idx] = src[idx];
                        dst[idx + 1] = src[idx + 1];
                        dst[idx + 2] = src[idx + 2];
                        dst[idx + 3] = src[idx + 3];
                        continue;
                    }

                    let r = 0, g = 0, b = 0;

                    // 上下中 + 左右（拉普拉斯四邻域）
                    const up = idx - width * 4;
                    const down = idx + width * 4;
                    const left = idx - 4;
                    const right = idx + 4;

                    r = src[idx] * kCenter - src[up] * k - src[down] * k - src[left] * k - src[right] * k;
                    g = src[idx + 1] * kCenter - src[up + 1] * k - src[down + 1] * k - src[left + 1] * k - src[right + 1] * k;
                    b = src[idx + 2] * kCenter - src[up + 2] * k - src[down + 2] * k - src[left + 2] * k - src[right + 2] * k;

                    dst[idx] = clampToByte(r);
                    dst[idx + 1] = clampToByte(g);
                    dst[idx + 2] = clampToByte(b);
                    dst[idx + 3] = src[idx + 3];
                }
            }

            imgData.data.set(dst);
        }

        function clampToByte(v) {
            return v < 0 ? 0 : (v > 255 ? 255 : Math.round(v));
        }

        // 导出高清图
        exportBtn.addEventListener('click', exportHighRes);

        function exportHighRes() {
            if (!state.originalImage || state.isExporting) return;
            state.isExporting = true;
            showStatus('正在渲染高清图…');

            // 使用 setTimeout 让状态提示先渲染
            setTimeout(() => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = state.fullWidth;
                    canvas.height = state.fullHeight;
                    const ctx = canvas.getContext('2d');

                    // 绘制原图并获取像素
                    ctx.drawImage(state.originalImage, 0, 0);
                    const srcData = ctx.getImageData(0, 0, state.fullWidth, state.fullHeight);

                    // 应用相同的处理流程
                    const processed = applyToneAndColor(srcData, state.params);
                    if (state.params.sharpness > 0) {
                        applyConvolutionSharpen(processed, state.fullWidth, state.fullHeight, state.params.sharpness);
                    }

                    ctx.putImageData(processed, 0, 0);

                    // 下载
                    const link = document.createElement('a');
                    const ext = 'jpg';
                    link.download = `edited_${Date.now()}.${ext}`;
                    link.href = canvas.toDataURL('image/jpeg', EXPORT_QUALITY);
                    link.click();

                    showStatus('导出成功');
                    setTimeout(hideStatus, 2000);
                } catch (err) {
                    console.error(err);
                    alert('导出失败：' + err.message);
                    hideStatus();
                } finally {
                    state.isExporting = false;
                }
            }, 50);
        }

        // 重置参数
        resetBtn.addEventListener('click', () => {
            SLIDER_CONFIG.forEach(cfg => {
                state.params[cfg.key] = cfg.default;
                const input = document.getElementById(`slider-${cfg.key}`);
                input.value = cfg.default;
                updateSliderProgress(input);
                document.getElementById(`val-${cfg.key}`).textContent = formatValue(cfg.default, cfg.unit);
            });
            requestPreviewUpdate();
        });

        // 自动优化（示例性一键调色）
        autoBtn.addEventListener('click', () => {
            if (!state.originalImage) return;
            const auto = {
                exposure: 8,
                contrast: 12,
                highlights: -18,
                shadows: 22,
                whites: 8,
                blacks: -6,
                temp: 4,
                tint: 0,
                saturation: 10,
                sharpness: 15
            };
            Object.assign(state.params, auto);
            SLIDER_CONFIG.forEach(cfg => {
                const input = document.getElementById(`slider-${cfg.key}`);
                input.value = state.params[cfg.key];
                updateSliderProgress(input);
                document.getElementById(`val-${cfg.key}`).textContent = formatValue(state.params[cfg.key], cfg.unit);
            });
            requestPreviewUpdate();
        });

        // 状态提示
        function showStatus(text) {
            statusEl.textContent = text;
            statusEl.classList.add('visible');
        }

        function hideStatus() {
            statusEl.classList.remove('visible');
        }

        // 初始化
        initSliders();
    </script>
</body>
</html>
