<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAE AI 悬浮编程搭档 - 创意原型</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        /* 模拟桌面背景 */
        .desktop-bg {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, #2d3561 0%, #0f0f1a 90%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 伪IDE窗口 */
        .mock-ide {
            width: 700px;
            height: 450px;
            background: #1e1e2e;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            border: 1px solid #313146;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .mock-titlebar {
            height: 40px;
            background: #16162a;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 10px;
            border-bottom: 1px solid #2a2a40;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27ca40; }

        .mock-content {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 15px;
        }

        .code-line {
            background: #2a2a40;
            height: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .short { width: 60%; }
        .medium { width: 80%; }
        .long { width: 95%; }

        .code-block {
            flex: 1;
        }

        /* 悬浮助手窗口 */
        .floating-assistant {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 320px;
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), 0 0 0 1px rgba(100, 180, 255, 0.2);
            padding: 18px;
            color: #e0e0ff;
            animation: floatIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            transition: all 0.3s ease;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .assistant-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .ai-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #4a7cf7, #6c5ce7);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(74,124,247,0.4);
        }

        .ai-title {
            font-weight: 600;
            font-size: 14px;
            color: #fff;
        }
        .ai-sub {
            font-size: 11px;
            color: #8e8eb0;
        }

        .status-badge {
            margin-left: auto;
            background: rgba(255, 189, 46, 0.2);
            color: #ffbd2e;
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .notification-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .notif-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .notif-desc {
            font-size: 11px;
            color: #a0a0c0;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 8px 12px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .btn-primary {
            background: #4a7cf7;
            color: white;
            box-shadow: 0 4px 12px rgba(74,124,247,0.3);
        }
        .btn-primary:hover {
            background: #5a8cff;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .chat-input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 8px 14px;
            color: white;
            font-size: 12px;
            outline: none;
            transition: all 0.2s;
        }
        .chat-input:focus {
            border-color: #4a7cf7;
            background: rgba(255,255,255,0.08);
        }
        .chat-input::placeholder {
            color: #6a6a8a;
            font-size: 11px;
        }

        .send-btn {
            background: #4a7cf7;
            border: none;
            border-radius: 14px;
            width: 36px;
            height: 36px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .send-btn:hover {
            background: #5a8cff;
        }

        .feature-tip {
            font-size: 10px;
            color: #6e6e90;
            text-align: center;
            margin-top: 10px;
            letter-spacing: 0.3px;
        }

        .hover-hint {
            position: absolute;
            bottom: -40px;
            right: 0;
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="desktop-bg">
        <!-- 模拟IDE编辑器 -->
        <div class="mock-ide">
            <div class="mock-titlebar">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <span style="color:#aaa; font-size:12px; margin-left:10px;">TRAE IDE — main.py</span>
            </div>
            <div class="mock-content">
                <div class="code-block">
                    <div class="code-line long"></div>
                    <div class="code-line medium"></div>
                    <div class="code-line short"></div>
                    <div class="code-line long"></div>
                    <div class="code-line medium"></div>
                    <div style="background: #3a4a7a; height:12px; border-radius:6px; width:70%; margin-bottom:12px;"></div>
                    <div class="code-line short"></div>
                    <div class="code-line medium"></div>
                    <div class="code-line long"></div>
                </div>
            </div>
        </div>

        <!-- TRAE AI 悬浮编程搭档 -->
        <div class="floating-assistant" id="assistant">
            <div class="assistant-header">
                <div class="ai-avatar">🤖</div>
                <div>
                    <div class="ai-title">TRAE 悬浮搭档</div>
                    <div class="ai-sub">Agent 运行中</div>
                </div>
                <div class="status-badge" id="statusBadge">需确认</div>
            </div>

            <div class="notification-card" id="notificationCard">
                <div class="notif-title">
                    <span>⚠️ 任务暂停</span>
                </div>
                <div class="notif-desc" id="notifDesc">
                    AI 已完成 <strong>user_auth.py</strong> 模块重构，但发现 <strong>数据库迁移脚本</strong> 存在冲突。是否接受更改并继续执行测试？
                </div>
                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="handleAction('accept')">接受并继续</button>
                    <button class="btn btn-secondary" onclick="handleAction('reject')">查看差异</button>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" class="chat-input" placeholder="回复 AI 指令或提问..." id="chatInput" onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
            <div class="feature-tip">
                💡 悬浮于任何窗口之上 · 无需切换IDE
            </div>
        </div>
        <div class="hover-hint">
            ⬆️ 模拟：IDE在后台，悬浮窗直接交互
        </div>
    </div>

    <script>
        // 模拟交互逻辑，展示悬浮窗的核心价值
        function handleAction(action) {
            const badge = document.getElementById('statusBadge');
            const notifDesc = document.getElementById('notifDesc');
            const notificationCard = document.getElementById('notificationCard');
            
            if (action === 'accept') {
                badge.textContent = '执行中';
                badge.style.background = 'rgba(39, 202, 64, 0.2)';
                badge.style.color = '#27ca40';
                badge.style.animation = 'none';
                
                notifDesc.innerHTML = '✅ 已接受更改。AI 正在运行集成测试... <span style="color:#27ca40;">预计 45秒 完成</span>。您可以继续浏览其他窗口，我会在完成时通知您。';
                
                // 模拟任务完成后更新
                setTimeout(() => {
                    badge.textContent = '已完成';
                    notifDesc.innerHTML = '🎉 <strong>测试全部通过！</strong> 代码已合并到主分支。悬浮助手已保存本次上下文。';
                    
                    // 恢复脉冲动画
                    badge.style.animation = 'pulse 2s infinite';
                }, 4000);
            } else if (action === 'reject') {
                badge.textContent = '审核中';
                badge.style.background = 'rgba(74,124,247,0.2)';
                badge.style.color = '#4a7cf7';
                notifDesc.innerHTML = '📋 已在悬浮窗中展开差异对比视图。您可以直接在此窗口审查代码，无需返回IDE。';
            }
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            const notifDesc = document.getElementById('notifDesc');
            const badge = document.getElementById('statusBadge');
            
            // 显示用户消息效果
            notifDesc.innerHTML = `💬 <em>"${message}"</em> <br><span style="color:#8e8eb0; font-size:10px;">指令已通过悬浮窗发送给TRAE Agent，无需切换窗口。</span>`;
            badge.textContent = '处理中';
            badge.style.background = 'rgba(74,124,247,0.2)';
            badge.style.color = '#4a7cf7';
            
            input.value = '';
            
            // 模拟AI响应
            setTimeout(() => {
                notifDesc.innerHTML = '🤖 AI 已收到指令，正在后台调整代码。您可以自由切换窗口，我会在需要时提醒您。';
                badge.textContent = '运行中';
                badge.style.background = 'rgba(39, 202, 64, 0.2)';
                badge.style.color = '#27ca40';
            }, 2000);
        }

        // 拖拽效果提示 (视觉上表明悬浮窗可移动)
        const assistant = document.getElementById('assistant');
        assistant.style.cursor = 'grab';
        assistant.title = '可拖拽的桌面悬浮助手 (原型展示)';
        
        console.log('TRAE AI 悬浮编程搭档 - 创意原型已启动');
        console.log('核心功能：跨窗口通知 / 悬浮窗内直接回复 / 不中断工作流');
    </script>
</body>
</html>
