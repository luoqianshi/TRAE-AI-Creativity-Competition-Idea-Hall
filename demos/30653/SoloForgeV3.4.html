﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoloForge</title>
<style>
:root{--sf-font-size:18px;--sf-title-font-size:23px;--sf-font-brightness:1;--bg-deepest:#0a0e1a;--bg-primary:#0f1525;--bg-secondary:#161d30;--bg-tertiary:#1e2740;--bg-hover:#253050;--accent-primary:#00d4aa;--accent-warning:#e8a838;--accent-danger:#e85d5d;--accent-info:#4a9eff;--text-primary:#e0e4ef;--text-secondary:#8892a8;--text-muted:#4a5268;--border-primary:#1e2740;--border-light:#161d30;--glow-primary:rgba(0,212,170,.3);--radius-sm:4px;--radius-md:6px;--radius-lg:8px;--mod-width:260px}
*{margin:0;padding:0;box-sizing:border-box}html{overflow:hidden}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg-deepest);color:var(--text-primary);overflow:hidden;height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg-primary)}::-webkit-scrollbar-thumb{background:var(--bg-tertiary);border-radius:3px}
input,textarea,select,button{font-family:inherit;font-size:inherit;color:inherit}
#toolbar{position:fixed;top:0;left:0;right:0;height:40px;background:var(--bg-primary);border-bottom:1px solid var(--border-primary);display:flex;align-items:center;padding:0 12px;flex-shrink:0;z-index:100;gap:2px;font-size:17px}
.tb-logo{display:flex;align-items:center;margin-right:6px;cursor:pointer}
.tb-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-secondary);transition:all .2s ease}
.tb-btn:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.tb-btn:disabled{opacity:.3;cursor:not-allowed}
.tb-btn svg{pointer-events:none}
.tb-sep{width:1px;height:20px;background:var(--border-primary);margin:0 6px}
.tb-title-input{background:transparent;border:1px solid transparent;border-radius:var(--radius-sm);color:var(--text-primary);font-size:14px;font-weight:500;text-align:center;padding:4px 12px;width:260px;transition:all .2s ease}
.tb-title-input:hover{border-color:var(--border-primary)}.tb-title-input:focus{outline:none;border-color:var(--accent-primary);background:var(--bg-secondary)}
.tb-spacer{flex:1}
#canvasArea{flex:1;position:relative;overflow:hidden;background:var(--bg-deepest);cursor:default;user-select:none}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0}
#connSvg{position:absolute;top:0;left:0;width:1px;height:1px;overflow:visible}
.conn-path{fill:none;stroke:var(--accent-primary);stroke-width:2;opacity:.6;pointer-events:none;transition:stroke .2s,stroke-width .2s}
.conn-hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.conn-path.sel{opacity:1;stroke-width:2.5}
.conn-path.dim{opacity:.15}
.conn-arrow.dim{opacity:.1}
.conn-endpoint{pointer-events:none;animation:connPulse 1.2s ease-in-out infinite}
@keyframes connPulse{0%,100%{opacity:1}50%{opacity:.4}}
.conn-temp{fill:none;stroke:var(--accent-info);stroke-width:2;stroke-dasharray:6 4;opacity:.7;pointer-events:none}
.conn-arrow{fill:var(--accent-primary);opacity:.6;pointer-events:none}
#modsContainer{position:absolute;top:0;left:0}
#groupsContainer{position:absolute;top:0;left:0;pointer-events:none}
#groupsContainer .sf-group{pointer-events:none}
.sf-group-header,.sf-group-port,.sf-group-btn,.sf-group-resize,.sf-link-mark{pointer-events:auto}
.sf-mod{position:absolute;width:var(--mod-width);background:var(--bg-secondary);border:1px solid var(--border-primary);border-radius:var(--radius-lg);box-shadow:0 4px 16px rgba(0,0,0,.3);cursor:grab;user-select:none;display:flex;flex-direction:column}
.sf-mod:hover{box-shadow:0 4px 20px rgba(0,0,0,.4)}
.sf-mod.selected{border-color:var(--accent-primary);box-shadow:0 0 0 1px var(--accent-primary),0 0 16px var(--glow-primary)}
.sf-mod-port{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--bg-primary);border:2px solid var(--accent-primary);cursor:crosshair;z-index:5}
.sf-mod-port:hover{background:var(--accent-primary)}
.sf-mod-port-in{left:-6px;top:calc(50% - 6px)}.sf-mod-port-in:hover{transform:scale(1.3)}
.sf-mod-port-out{right:-6px;top:calc(50% - 6px)}.sf-mod-port-out:hover{transform:scale(1.3)}
.sf-group-port{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--bg-primary);border:2px solid var(--accent-primary);cursor:crosshair;z-index:2}
.sf-group-port:hover{background:var(--accent-primary)}
.sf-group-port-in:hover,.sf-group-port-out:hover{transform:scale(1.3)}

.sf-mod-header{display:flex;align-items:center;min-height:28px;padding:0 8px;gap:9px;flex-shrink:0;position:relative}
.sf-mod-title{flex:1;font-size:var(--sf-title-font-size);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;line-height:1.3;filter:brightness(var(--sf-font-brightness))}
.sf-mod-title-input{flex:1;font-size:var(--sf-title-font-size);font-weight:600;background:var(--bg-primary);border:1px solid var(--accent-primary);border-radius:var(--radius-sm);color:var(--text-primary);padding:0 4px;outline:none;min-width:0;min-height:20px;line-height:1.3}
.sf-mod-wt-badge{display:inline-flex;align-items:center;cursor:pointer;padding:0 2px;flex-shrink:0;line-height:1;height:18px}
.sf-mod-wt-badge:hover{opacity:.8}
.sf-wt-dropdown{position:absolute;top:100%;right:0;z-index:9999;background:var(--bg-secondary);border:1px solid var(--border-primary);border-radius:var(--radius-md);padding:3px;display:inline-flex;flex-direction:column;gap:1px;box-shadow:0 4px 16px rgba(0,0,0,.4);width:140px}
.sf-wt-dropdown .sf-wt-opt{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border:1px solid transparent;border-radius:var(--radius-sm);cursor:pointer;font-size:18px;white-space:nowrap}
.sf-wt-dropdown .sf-wt-opt:hover{background:rgba(255,255,255,.06)}
.sf-wt-dropdown .sf-wt-opt.active{border-color:var(--accent-primary);background:rgba(0,212,170,.1)}
@keyframes eggIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes eggBreathe{0%,100%{text-shadow:0 0 40px rgba(0,212,170,.6),0 0 80px rgba(0,212,170,.3)}50%{text-shadow:0 0 60px rgba(0,212,170,.9),0 0 120px rgba(0,212,170,.5),0 0 200px rgba(0,212,170,.2)}}
.sf-toast{position:fixed;top:52px;left:50%;transform:translateX(-50%);background:rgba(0,212,170,.15);color:#fff;border:1px solid var(--accent-primary);border-radius:var(--radius-md);padding:12px 28px;font-size:20px;z-index:10000;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,212,170,.3);font-weight:600;backdrop-filter:blur(8px)}
.sf-toast.show{opacity:1}
.sf-mod-cpy{width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:var(--text-muted);border-radius:var(--radius-sm);transition:all .2s ease;flex-shrink:0;opacity:0;font-size:14px}
.sf-mod:hover .sf-mod-cpy{opacity:1}
.sf-mod-cpy:hover{color:var(--accent-primary);background:rgba(0,212,170,.1)}
.sf-mod-cpy svg{width:14px;height:14px}
.sf-mod-toggle{width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:var(--text-muted);border-radius:var(--radius-sm);transition:all .2s ease;flex-shrink:0;font-size:14px}
.sf-mod-toggle.exp{transform:rotate(180deg)}
.sf-mod-toggle:hover{color:var(--accent-primary);background:rgba(0,212,170,.1)}
.sf-mod-toggle svg{width:14px;height:14px}
.sf-mod-del{width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;color:var(--text-muted);border-radius:var(--radius-sm);transition:all .2s ease;flex-shrink:0;opacity:0;font-size:14px}
.sf-mod:hover .sf-mod-del{opacity:1}
.sf-mod-del:hover{color:var(--accent-danger);background:rgba(232,93,93,.1)}
.sf-subset-badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent-primary);color:#000;font-size:10px;font-weight:700;cursor:pointer;margin-left:4px;vertical-align:middle;line-height:1}
.sf-subset-badge:hover{background:#33e8be}
#subsetBreadcrumb .bc-item{cursor:pointer;color:var(--text-muted);white-space:nowrap}
#subsetBreadcrumb .bc-item:hover{color:var(--accent-primary)}
#subsetBreadcrumb .bc-sep{color:var(--text-muted);opacity:.4;margin:0 2px}
#subsetBreadcrumb .bc-current{color:var(--accent-primary);font-weight:600}
.sf-mod-del svg{width:14px;height:14px}
.sf-mod-body{padding:6px 8px 8px;display:none;flex-direction:column;gap:4px}
.sf-mod.exp .sf-mod-body{display:flex}
.sf-mod-toggle{opacity:0;transition:opacity .15s}
.sf-mod:hover .sf-mod-toggle{opacity:1}
.sf-field{border:1px solid var(--border-light);border-radius:var(--radius-sm);overflow:hidden}
.sf-field-header{display:flex;align-items:center;min-height:24px;padding:0 6px;gap:4px;background:var(--bg-deepest);user-select:none;font-size:var(--sf-title-font-size)}
.sf-field-header:hover{background:rgba(255,255,255,.04)}
.sf-field-toggle{color:var(--text-muted);font-size:9px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;background:transparent;border:none;border-radius:var(--radius-sm);transition:all .15s}
.sf-field-toggle:hover{color:var(--accent-primary);background:rgba(0,212,170,.1)}
.sf-field-title{flex:1;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default;line-height:1.3;filter:brightness(var(--sf-font-brightness))}
.sf-field-title:hover{color:var(--text-primary)}
.sf-field-title-input{flex:1;min-width:0;background:var(--bg-primary);border:1px solid var(--accent-primary);border-radius:var(--radius-sm);color:var(--text-primary);font-size:var(--sf-title-font-size);outline:none;padding:0 4px;font-family:inherit;min-height:18px;line-height:1.3}
.sf-field-wt{font-size:9px;cursor:pointer;padding:0 4px;border-radius:var(--radius-sm);border:1px solid var(--border-light);color:var(--text-muted);flex-shrink:0;height:18px;display:inline-flex;align-items:center;filter:brightness(var(--sf-font-brightness))}
.sf-field-wt:hover{border-color:var(--accent-primary);color:var(--accent-primary)}
.sf-field-wt.wt-inherit{opacity:.5}
.sf-field-del{font-size:14px;color:var(--text-muted);cursor:pointer;width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0;transition:opacity .15s;background:transparent;border:none;border-radius:var(--radius-sm)}
.sf-field:hover .sf-field-del{opacity:1}
.sf-field-del:hover{color:var(--accent-danger)}
.sf-field-body{padding:4px 0 0}
.sf-field.exp .sf-field-body{display:block}
.sf-field:not(.exp) .sf-field-body{display:none}
.sf-field-content{width:100%;background:var(--bg-deepest);border:1px solid var(--border-light);color:var(--text-primary);font-size:var(--sf-font-size);line-height:1.5;resize:none;outline:none;font-family:inherit;padding:4px;min-height:24px;max-height:360px;overflow-y:auto;border-radius:var(--radius-sm);word-wrap:break-word;overflow-wrap:break-word;white-space:pre-wrap;filter:brightness(var(--sf-font-brightness))}
.sf-field-content:focus{border-color:var(--accent-primary)}
.sf-field-content::placeholder{color:var(--text-muted)}
.sf-tts-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:14px;padding:0;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0;transition:opacity .2s;border-radius:var(--radius-sm)}
.sf-tts-btn svg{width:12px;height:12px}
.sf-field:hover .sf-tts-btn{opacity:1}
.sf-tts-btn:hover{color:var(--accent-primary)}
.sf-tts-btn.playing{opacity:1;color:var(--accent-primary)}
#ttsRecInd{position:fixed;top:12px;right:12px;background:var(--bg-deepest);border:1px solid var(--border-light);border-radius:8px;padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-primary);z-index:99999;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.tts-rec-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#e53e3e;animation:ttsRecBlink 1s infinite}
@keyframes ttsRecBlink{0%,100%{opacity:1}50%{opacity:.3}}
.tts-rec-stop{margin-left:6px;padding:2px 10px;border-radius:4px;background:var(--accent-primary);color:#fff;cursor:pointer;font-size:12px;transition:opacity .15s}
.tts-rec-stop:hover{opacity:.8}
.tts-ctx-item{padding:8px 16px;font-size:13px;color:var(--text-primary);cursor:pointer;transition:background .1s}
.tts-ctx-item:hover{background:var(--accent-primary);color:#fff}
.sf-mod-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:3px 8px;flex-shrink:0;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.sf-mod-toolbar button{background:transparent;border:none;color:var(--text-muted);cursor:pointer;transition:all .15s;padding:2px;filter:brightness(var(--sf-font-brightness))}
.sf-mod-toolbar button:hover{color:var(--accent-primary)}
.sf-mod-toolbar .sf-subset-enter{color:var(--accent-primary);font-size:14px;font-weight:700;margin-right:auto;opacity:.8}
.sf-mod-toolbar .sf-subset-enter:hover{opacity:1}
.sf-mod-title-row{display:flex;align-items:center;min-height:24px;padding:0 8px 4px;flex-shrink:0}
.sf-mod-title-row .sf-mod-title{flex:1;min-width:0}
.sf-mod-actions{display:flex;align-items:center;justify-content:center;gap:4px;padding:3px 8px;border-top:1px solid var(--border-light);flex-shrink:0;opacity:0;transition:opacity .15s;margin-top:-10px}
.sf-mod:hover .sf-mod-actions{opacity:1}
.sf-mod-actions button{background:transparent;border:1px solid var(--border-light);color:var(--text-muted);font-size:13px;padding:2px 6px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;filter:brightness(var(--sf-font-brightness))}
.sf-mod-actions button:hover{border-color:var(--accent-primary);color:var(--accent-primary)}

.conn-path.filtered{stroke-dasharray:4 3;opacity:.3}
.conn-arrow.filtered{opacity:.2}
.sf-media-container{margin-top:4px;display:flex;flex-wrap:wrap;gap:3px;max-width:100%}
.sf-media-item{position:relative;display:inline-block}
.sf-media-item img{width:44px;height:44px;object-fit:cover;border-radius:var(--radius-sm);cursor:pointer;display:block}
.sf-media-audio{display:block;width:100%}
.sf-audio-wrap{filter:invert(1) hue-rotate(180deg) brightness(0.8);display:block;width:100%;border-radius:var(--radius-sm);overflow:hidden}
.sf-audio-wrap audio{height:36px;width:100%;display:block}
.sf-audio-import{filter:invert(1) hue-rotate(150deg) brightness(0.7) saturate(1.3)}
.sf-media-item video{max-width:100%;max-height:80px;border-radius:var(--radius-sm);display:block}
.sf-media-del{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--accent-danger);color:#fff;border:none;cursor:pointer;font-size:10px;line-height:16px;text-align:center;display:none;z-index:2}
.sf-media-item:hover .sf-media-del{display:block}
.sf-media-lost{opacity:.6}
.sf-media-lost-inner{display:flex;align-items:center;gap:4px;padding:4px 8px;border:1px dashed var(--accent-danger);border-radius:var(--radius-sm);background:rgba(229,62,62,.08);font-size:12px;color:var(--accent-danger)}
.sf-media-lost-icon{font-size:14px}
.sf-media-lost-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
#sfLightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:999999;display:flex;align-items:center;justify-content:center;cursor:pointer}
#sfLightbox img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:4px}
.sf-lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.sf-lb-nav:hover{background:rgba(255,255,255,.3)}
.sf-lb-prev{left:16px}
.sf-lb-next{right:16px}
.sf-lb-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.sf-lb-close:hover{background:rgba(255,255,255,.3)}
.sf-lb-counter{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:13px}
.sf-group.drag-over{border-color:#00d4aa;box-shadow:0 0 16px rgba(0,212,170,.5)}
.sf-group.drag-out{border-color:#ff4444;box-shadow:0 0 16px rgba(255,68,68,.45)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.hidden{display:none}
.modal{background:var(--bg-secondary);border:1px solid var(--border-primary);border-radius:var(--radius-lg);width:680px;max-width:90vw;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.modal-header{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border-primary);gap:8px}
.modal-header span{flex:1;font-size:22px;font-weight:600}
.modal-close{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-secondary);font-size:26px}
.modal-close:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.modal-body{padding:14px}
.modal-body label{display:block;font-size:18px;color:var(--text-secondary);margin-bottom:4px;margin-top:8px}
.modal-body label:first-child{margin-top:0}
.modal-body input,.modal-body select,.modal-body textarea{width:100%;background:var(--bg-primary);border:1px solid var(--border-primary);border-radius:var(--radius-sm);color:var(--text-primary);font-size:18px;padding:8px 12px}
.modal-body textarea{min-height:70px;resize:vertical;line-height:1.5}
.modal-body input:focus,.modal-body select:focus,.modal-body textarea:focus{outline:none;border-color:var(--accent-primary)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--border-primary)}
.modal-btn{padding:8px 20px;border-radius:var(--radius-sm);font-size:18px;cursor:pointer;border:1px solid var(--border-primary);transition:all .2s ease}
.modal-cancel{background:var(--bg-tertiary);color:var(--text-secondary)}.modal-cancel:hover{background:var(--bg-hover);color:var(--text-primary)}
.modal-confirm{background:var(--accent-primary);color:var(--bg-deepest);border-color:var(--accent-primary);font-weight:600}.modal-confirm:hover{opacity:.9}
#fullTextPanel{position:fixed;top:44px;right:40px;width:380px;max-height:calc(100vh - 52px);background:var(--bg-primary);border:1px solid var(--border-primary);border-radius:var(--radius-lg);z-index:50;display:none;flex-direction:column;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#fullTextPanel.visible{display:flex}
.ft-header{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border-primary);gap:8px;flex-shrink:0}
.ft-header span{flex:1;font-size:var(--sf-title-font-size);font-weight:600}
.ft-close{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-secondary);font-size:16px}
.ft-close:hover{color:var(--text-primary);background:var(--bg-tertiary)}
.ft-nav-bar{flex-shrink:0;padding:4px 10px;font-size:var(--sf-font-size);font-weight:600;color:var(--accent-primary);cursor:pointer;background:var(--bg-secondary);border-top:1px solid var(--border-light);border-bottom:1px solid var(--border-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.ft-nav-bar:hover{background:var(--bg-tertiary)}
.ft-nav-bar .ft-nav-arrow{font-size:calc(var(--sf-font-size) - 1px);opacity:.6}
.ft-body{flex:1;overflow-y:auto;padding:12px 16px}
.ft-filter-bar{flex-shrink:0;padding:8px 16px 0;overflow-x:auto;white-space:nowrap}
.ft-section{margin-bottom:14px}
.ft-section-title{font-size:var(--sf-title-font-size);font-weight:600;color:var(--accent-primary);cursor:pointer;padding:4px 0;border-bottom:1px solid var(--border-light);margin-bottom:6px}
.ft-section-title:hover{color:var(--accent-info)}
.ft-section-content{font-size:var(--sf-font-size);color:var(--text-secondary);line-height:1.7;white-space:pre-wrap}
.ft-section.highlight{background:rgba(0,212,170,.06);border-radius:var(--radius-sm);padding:4px 8px;margin:-4px -8px}
.ft-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:18px}
.supplement-mark{display:none}

.sb-add:hover{border-color:var(--accent-primary);color:var(--accent-primary)}.sb-qty{width:36px;height:26px;font-size:15px;text-align:center;border:none;border-radius:0;background:var(--bg-secondary);color:var(--text-secondary);padding:0;outline:none;flex-shrink:0}.sb-qty::-webkit-inner-spin-button,.sb-qty::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0}.sb-qty{-moz-appearance:textfield;appearance:textfield}.sb-qty-wrap{display:flex;align-items:center;margin-left:auto;flex-shrink:0}.sb-qty-btn{width:26px;height:26px;font-size:15px;line-height:26px;text-align:center;cursor:pointer;background:var(--bg-tertiary);color:var(--text-muted);border:1px solid var(--border-primary);user-select:none;flex-shrink:0}.sb-qty-btn:hover{background:var(--accent-primary);color:#fff}.sb-qty-btn:first-child{border-radius:3px 0 0 3px}.sb-qty-btn:last-child{border-radius:0 3px 3px 0}.sb-item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

;document.getElementById('setAutoSave').checked=false;document.getElementById('setAutoSaveInterval').value='30';document.getElementById('setTtsRate').value='1';document.getElementById('setTtsVoice').value='';apply()});document.getElementById('setClearCache').addEventListener('click',function(){asyncConfirm('确定清理所有缓存？',function(){var _cp=project.customPresets?project.customPresets.slice():[];localStorage.removeItem('sf_v30');try{indexedDB.deleteDatabase('SoloForgeDB')}catch(e){}localStorage.setItem('sf_customPresets',JSON.stringify(_cp));location.reload()})});document.getElementById('verLabel').addEventListener('dblclick',function(){var rm=document.getElementById('readmePop');if(rm){rm.remove();return}var readmeContent='# SoloForge\n\n**可视化结构化创作工具** — 用节点图谱组织思维，用权重链路驱动叙事\n\n## 核心特点\n\n- 🧩 模块化创作：每个创作单元是一个模块，包含标题、多个描述字段、媒体附件\n- 🔗 权重连线系统：5级权重体系（决定性/高/中/低/不参与），权重决定信息在链路中的影响力\n- 📐 组管理：多个模块可打组，形成逻辑单元\n- 🔗 链路视图：五线谱式权重线，展示上下游完整链路\n- 📖 全文预览：模块↔全文双向同步\n- 🖼️ 媒体管理：拖拽图片自动生成缩略图，原图保存到项目文件夹\n- 🤖 AI 协作：内置AI提示词模板，支持自定义预设\n- 💾 本地优先：基于File System Access API，数据本地化\n- 🎨 可定制界面：连线/组/字体样式可调\n\n## 快捷键\n\nCtrl+S 保存 | Ctrl+Z 撤销 | Delete 删除 | Ctrl+G 打组 | Shift/Ctrl 多选 | Ctrl+A 全选\n\n## 更新日志\n\n### v06530.3.4\n- 新增：子集系统——模块可创建子集，点击▶进入子集视图，支持无限嵌套，左上角层级标签快速跳转\n- 新增：Esc键全局返回上一层/关闭弹窗，回车键确认弹窗\n- 新增：删除模块时显示模块标题确认\n- 新增：大声朗读——点击字段右侧🔊按钮朗读该字段内容，右键🔊按钮可录制朗读音频并保存为媒体附件（每次录音需在浏览器弹窗中选择SoloForge窗口并勾选共享系统音频），设置面板可调语速和语音角色\n- 修复：导入JSON统一为合并模式（按标题匹配合并），不再替换整个项目\n- 修复：清除缓存按钮在Edge浏览器失效\n- 调整：模块布局重构——功能按钮置顶右对齐，标题独立行，操作按钮置底\n- 调整：整个模块卡片可拖动（排除文本框等交互元素）\n\n### v06530.3.3\n- 修复：拖入音频文件被渲染为video标签\n- 修复：删除组弹窗自动关闭\n- 修复：全部复制按钮点击后无反馈提示\n- 新增：媒体按类型分组显示\n- 新增：批量拖入媒体文件支持\n- 新增：保存时自动修复目录中缺失的媒体文件\n- 调整：预览图尺寸48px→44px，字段级和模块级按钮统一18px高度\n\n### v06530.3.2\n- 修复：画布缩放时连线端点位置偏移的BUG（offsetHeight未除以缩放比）\n- 修复：双击字段标题编辑时收展按钮被挤压消失\n- 修复：组端点圆圈与连线呼吸灯圆圈不同心\n- 修复：左键保存反复弹出覆盖确认\n- 新增：自动保存功能（设置面板启用+自定义间隔）\n- 新增：Logo悬停自动弹出侧边栏\n- 新增：文本框智能阈值滚动（超360px出现滚动条）\n- 新增：文本框内滚轮滚动内容\n- 调整：菜单栏字号17px，模块按钮间距+5px，SVG图标统一14px\n\n### v06530.3.1\n- 修复：导入单个模块数据时提示"无效的项目结构"的问题。现已支持导入单个模块和模块数组，按标题合并覆盖到现有模块。\n\n## 开源协议\n\nGPL v3';var rp=document.createElement('div');rp.id='readmePop';rp.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:560px;max-height:50vh;background:var(--bg-secondary);border:1px solid var(--border-primary);border-radius:var(--radius-lg);box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:10001;padding:20px;display:flex;flex-direction:column';rp.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-shrink:0"><span style="font-size:18px;font-weight:600;color:var(--accent-primary)">SoloForge</span><button onclick="document.getElementById(\'readmePop\').remove()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:20px">&times;</button></div><div style="overflow-y:auto;flex:1;min-height:0"><pre style="white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.6;color:var(--text-secondary);margin:0;font-family:inherit">'+eh(readmeContent)+'</pre></div>';document.body.appendChild(rp)})}
