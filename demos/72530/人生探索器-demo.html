<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生探索器 · AI 人生模拟 Demo</title>
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --ink:#1a1a2e; --muted:#6b6b7b; --line:#e5e4e0;
  --purple:#534AB7; --purple-l:#EEEDFE; --purple-d:#3C3489;
  --teal:#0F6E56; --teal-l:#E1F5EE; --teal-d:#085041;
  --coral:#D85A30; --coral-l:#FAECE7; --coral-d:#712B13;
  --amber:#BA7517; --amber-l:#FAEEDA; --amber-d:#633806;
  --blue:#185FA5; --blue-l:#E6F1FB; --blue-d:#0C447C;
  --pink:#D4537E; --pink-l:#FBEAF0; --pink-d:#72243E;
  --green:#639922; --green-l:#EAF3DE;
  --r:12px; --r-lg:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:15px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.app{max-width:1100px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ====== 通用 ====== */
.hidden{display:none!important}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tap{transition:all .15s}
.tap:hover{transform:translateY(-1px)}
.tap:active{transform:translateY(0)}

/* ====== 启动页 ====== */
.start-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.start-logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--purple),#7F77DD);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:24px;box-shadow:0 8px 24px rgba(83,74,183,.25)}
.start-title{font-size:32px;font-weight:800;letter-spacing:-1px;margin-bottom:8px}
.start-sub{font-size:16px;color:var(--muted);max-width:480px;margin-bottom:32px;line-height:1.8}
.start-features{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:36px}
.start-features span{padding:6px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.btn-big{padding:14px 40px;border-radius:12px;background:var(--purple);color:#fff;font-size:16px;font-weight:600;box-shadow:0 4px 14px rgba(83,74,183,.3)}
.btn-big:hover{background:#5b53c4}
.start-foot{margin-top:24px;font-size:12px;color:var(--muted)}

/* ====== 角色创建 ====== */
.create-wrap{flex:1;padding:32px 24px;max-width:680px;margin:0 auto;width:100%}
.create-wrap h2{font-size:24px;font-weight:700;margin-bottom:6px;text-align:center}
.create-wrap .hint{text-align:center;color:var(--muted);font-size:14px;margin-bottom:28px}
.create-step{margin-bottom:28px}
.create-step label{display:block;font-weight:600;font-size:14px;margin-bottom:10px}
.create-step label .req{color:var(--coral)}
.text-input{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--surface);font-family:inherit}
.text-input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-l)}
.bg-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bg-opt{padding:16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;transition:all .15s}
.bg-opt:hover{border-color:var(--purple)}
.bg-opt.selected{border-color:var(--purple);background:var(--purple-l)}
.bg-opt .bg-name{font-weight:600;font-size:14px;margin-bottom:4px}
.bg-opt .bg-desc{font-size:12px;color:var(--muted);margin-bottom:8px}
.bg-opt .bg-attrs{display:flex;gap:6px;flex-wrap:wrap}
.bg-opt .bg-attrs span{font-size:11px;padding:2px 7px;border-radius:5px;background:#f0f0f0}
.points-display{text-align:right;font-size:13px;font-weight:600;margin-bottom:8px}
.points-display.warn{color:var(--coral)}
.attr-alloc{display:flex;flex-direction:column;gap:10px}
.alloc-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.alloc-row .al-name{flex:1;font-size:13px;font-weight:500}
.alloc-row .al-name small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.alloc-row .al-val{width:36px;text-align:center;font-weight:700;font-size:16px;color:var(--purple)}
.alloc-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:all .1s}
.alloc-btn:hover{border-color:var(--purple);color:var(--purple)}
.alloc-btn:disabled{opacity:.3;cursor:not-allowed}
.create-nav{display:flex;gap:12px;margin-top:32px}
.btn-secondary{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.btn-primary{flex:1;padding:12px;border-radius:10px;background:var(--purple);color:#fff;font-size:14px;font-weight:600;transition:opacity .15s}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.alloc-btn:disabled{cursor:not-allowed}

/* ====== 游戏主界面 ====== */
.game-wrap{flex:1;display:flex;flex-direction:column}
.game-top{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.game-top .gt-left{display:flex;align-items:center;gap:10px}
.game-top .logo-sm{width:28px;height:28px;border-radius:8px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.game-top .gt-title{font-size:14px;font-weight:600}
.stage-progress{display:flex;gap:4px}
.stage-progress .sp-dot{width:24px;height:4px;border-radius:2px;background:var(--line)}
.stage-progress .sp-dot.active{background:var(--purple)}
.stage-progress .sp-dot.done{background:var(--teal)}

.game-body{flex:1;display:grid;grid-template-columns:260px 1fr;gap:0;min-height:0}
.side-panel{background:#fafaf8;border-right:1px solid var(--line);padding:20px 18px;overflow-y:auto}
.side-panel .avatar-block{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.side-panel .avatar{width:48px;height:48px;border-radius:50%;background:var(--purple-l);display:flex;align-items:center;justify-content:center;font-size:22px}
.side-panel .char-name{font-size:15px;font-weight:600}
.side-panel .char-meta{font-size:12px;color:var(--muted)}
.side-panel .section-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;font-weight:600}
.attr-bar{margin-bottom:12px}
.attr-bar .ab-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:4px}
.attr-bar .ab-top b{font-weight:600}
.attr-bar .ab-top .ab-val{font-weight:700;font-size:13px}
.attr-bar .ab-top .ab-delta{font-size:11px;font-weight:600;margin-left:4px}
.attr-bar .ab-track{height:6px;border-radius:3px;background:#e8e7e3;overflow:hidden;position:relative}
.attr-bar .ab-fill{height:100%;border-radius:3px;transition:width .5s ease}
.delta-up{color:var(--teal)}.delta-down{color:var(--coral)}
.side-panel .divider{height:1px;background:var(--line);margin:18px 0}
.riasec-mini{display:flex;gap:4px;flex-wrap:wrap}
.riasec-mini span{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.decision-log{font-size:12px;color:var(--muted);max-height:120px;overflow-y:auto}
.decision-log div{padding:4px 0;border-bottom:1px solid #eee}
.decision-log div:last-child{border:none}

.main-panel{padding:24px 28px;overflow-y:auto;display:flex;flex-direction:column}
.scene-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:12px;align-self:flex-start}
.scene-badge .dot{width:6px;height:6px;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.scene-age{font-size:13px;color:var(--muted);margin-bottom:6px}
.scene-title{font-size:20px;font-weight:700;margin-bottom:16px;line-height:1.4}
.scene-narrative{font-size:15px;color:#3a3a4a;line-height:1.85;margin-bottom:24px;flex:1}
.scene-narrative p{margin-bottom:12px}
.scene-narrative .em{color:var(--purple);font-weight:500}
.scene-narrative .quote{padding:12px 16px;border-left:3px solid var(--purple);background:var(--purple-l);border-radius:0 8px 8px 0;font-style:italic;color:var(--purple-d);margin:12px 0}
.choices{display:flex;flex-direction:column;gap:10px}
.choice-card{text-align:left;padding:16px 18px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);transition:all .15s;position:relative}
.choice-card:hover{border-color:var(--purple);background:var(--purple-l);transform:translateY(-1px)}
.choice-card .ch-label{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600}
.choice-card .ch-text{font-size:15px;font-weight:500;margin-bottom:8px;line-height:1.5}
.choice-card .ch-effects{display:flex;gap:6px;flex-wrap:wrap}
.choice-card .ch-eff{padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600}
.eff-up{background:var(--teal-l);color:var(--teal-d)}
.eff-down{background:var(--coral-l);color:var(--coral-d)}
.eff-neutral{background:#f0f0f0;color:#666}

/* AI思考动画 */
.ai-thinking{display:flex;align-items:center;gap:10px;padding:16px 0;color:var(--muted);font-size:14px}
.ai-thinking .dots{display:flex;gap:4px}
.ai-thinking .dots span{width:7px;height:7px;border-radius:50%;background:var(--purple);animation:bounce 1.2s infinite}
.ai-thinking .dots span:nth-child(2){animation-delay:.2s}
.ai-thinking .dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}

/* 选择后的反馈 */
.choice-result{padding:20px;border-radius:12px;background:var(--purple-l);border:1.5px solid var(--purple);margin-bottom:16px;animation:fadeIn .4s}
.choice-result .cr-label{font-size:12px;color:var(--purple);font-weight:600;margin-bottom:6px}
.choice-result .cr-text{font-size:15px;color:var(--purple-d);margin-bottom:12px;font-weight:500}
.choice-result .cr-feedback{font-size:14px;color:#3a3a4a;line-height:1.8}
.choice-result .cr-style{margin-top:12px;padding-top:12px;border-top:1px solid rgba(83,74,183,.2);font-size:12px;color:var(--purple)}

/* 底部 */
.game-bottom{display:flex;justify-content:space-between;align-items:center;padding:12px 28px;border-top:1px solid var(--line);background:var(--surface)}
.game-bottom .gb-info{font-size:13px;color:var(--muted)}

/* ====== 阶段总结 ====== */
.stage-summary{flex:1;padding:40px 24px;max-width:680px;margin:0 auto;width:100%}
.stage-summary h2{font-size:24px;font-weight:700;text-align:center;margin-bottom:6px}
.stage-summary .ss-hint{text-align:center;color:var(--muted);font-size:14px;margin-bottom:28px}
.summary-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;margin-bottom:16px}
.summary-card h3{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.attr-compare{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
.attr-compare .ac-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:4px 0}
.attr-compare .ac-name{color:var(--muted)}
.attr-compare .ac-vals{display:flex;align-items:center;gap:6px}
.attr-compare .ac-old{color:var(--muted);font-size:12px}
.attr-compare .ac-arrow{color:var(--muted);font-size:11px}
.attr-compare .ac-new{font-weight:700}
.attr-compare .ac-delta{font-size:11px;font-weight:600}

/* ====== 最终报告 ====== */
.report-wrap{flex:1;overflow-y:auto}
.report-hero{background:linear-gradient(135deg,var(--purple) 0%,#7F77DD 100%);color:#fff;padding:48px 24px;text-align:center}
.report-hero h1{font-size:28px;font-weight:800;margin-bottom:8px}
.report-hero p{font-size:15px;opacity:.9;max-width:500px;margin:0 auto}
.report-content{max-width:760px;margin:0 auto;padding:32px 24px 60px}
.report-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;margin-bottom:20px}
.report-sec h3{font-size:17px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.radar-container{display:flex;gap:32px;align-items:center;flex-wrap:wrap;justify-content:center}
.radar-svg{width:280px;height:280px;flex-shrink:0}
.radar-legend{flex:1;min-width:200px}
.radar-legend .rl-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
.radar-legend .rl-row:last-child{border:none}
.radar-legend .rl-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.radar-legend .rl-name{flex:1;font-weight:500}
.radar-legend .rl-vals{font-size:12px;color:var(--muted)}
.radar-legend .rl-vals b{color:var(--ink);font-weight:700}
.style-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.style-item{padding:14px;border:1px solid var(--line);border-radius:10px}
.style-item .si-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.style-item .si-value{font-size:15px;font-weight:700;margin-bottom:6px}
.style-item .si-desc{font-size:12px;color:#555;line-height:1.5}
.reflect-3i{display:flex;flex-direction:column;gap:16px}
.reflect-3i .i-block{display:flex;gap:14px}
.reflect-3i .i-tag{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;flex-shrink:0;height:fit-content}
.reflect-3i .i-body{font-size:14px;color:#3a3a4a;line-height:1.8}
.reflect-3i .i-body b{color:var(--ink)}
.narrative-box{font-size:15px;color:#3a3a4a;line-height:2}
.narrative-box p{margin-bottom:14px}
.narrative-box p:last-child{margin-bottom:0}
.narrative-box .highlight{color:var(--purple);font-weight:600}
.parallel-compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.parallel-card{border:2px solid var(--line);border-radius:12px;padding:20px}
.parallel-card.current{border-color:var(--purple)}
.parallel-card h4{font-size:15px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.parallel-card .pc-meta{font-size:12px;color:var(--muted);margin-bottom:14px}
.parallel-card .pc-list{font-size:13px}
.parallel-card .pc-list div{padding:6px 0;border-bottom:1px solid var(--line)}
.parallel-card .pc-list div:last-child{border:none}
.parallel-card .pc-end{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:13px;font-weight:500}
.report-actions{display:flex;gap:12px;justify-content:center;margin-top:28px}

/* 响应式 */
@media(max-width:760px){
  .game-body{grid-template-columns:1fr}
  .side-panel{border-right:none;border-bottom:1px solid var(--line);max-height:200px}
  .bg-options{grid-template-columns:1fr}
  .parallel-compare{grid-template-columns:1fr}
  .start-title{font-size:24px}
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============================================================
   人生探索器 — 数据层
   ============================================================ */

const ATTRS = [
  {key:'cognition', name:'认知资本', color:'#534AB7', desc:'学业表现、学习速度、问题解决'},
  {key:'resilience', name:'情绪韧性', color:'#0F6E56', desc:'抗挫力、压力下的决策质量'},
  {key:'social', name:'社交资本', color:'#185FA5', desc:'人际关系质量、支持获取能力'},
  {key:'economic', name:'经济资本', color:'#BA7517', desc:'物质资源、试错容错空间'},
  {key:'cultural', name:'文化资本', color:'#D4537E', desc:'视野见识、审美与信息获取'},
  {key:'efficacy', name:'自我效能', color:'#D85A30', desc:'决策信心、行动意愿'},
  {key:'health', name:'健康资本', color:'#639922', desc:'精力上限、长期承载力'},
  {key:'wellbeing', name:'心理幸福', color:'#7F77DD', desc:'综合人生满意度'},
];

const BACKGROUNDS = [
  {
    id:'small_city',
    name:'小城普通家庭',
    desc:'父母是普通职工，生活安稳，资源有限但温暖',
    attrs:{cognition:55,resilience:58,social:50,economic:35,cultural:40,efficacy:50,health:65,wellbeing:55},
    riasec:['I','S']
  },
  {
    id:'big_city',
    name:'大城市中产家庭',
    desc:'父母受过高等教育，重视教育，视野较宽',
    attrs:{cognition:62,resilience:50,social:58,economic:60,cultural:62,efficacy:55,health:60,wellbeing:52},
    riasec:['I','E']
  },
  {
    id:'rural',
    name:'农村家庭',
    desc:'勤劳朴素，教育资源匮乏，但韧性强',
    attrs:{cognition:50,resilience:68,social:52,economic:25,cultural:32,efficacy:55,health:62,wellbeing:50},
    riasec:['R','I']
  },
  {
    id:'intellectual',
    name:'知识分子家庭',
    desc:'父母是教师/医生，书香门第，期望高',
    attrs:{cognition:68,resilience:48,social:52,economic:52,cultural:70,efficacy:52,health:58,wellbeing:48},
    riasec:['I','A']
  },
];

/* 决策风格标签 */
const STYLE_TAGS = {
  value_driven: {name:'价值驱动型', desc:'优先考虑内在意义感'},
  pragmatic: {name:'务实稳妥型', desc:'优先考虑稳定与收益'},
  risk_seeking: {name:'冒险探索型', desc:'愿意为高回报承担风险'},
  social_oriented: {name:'关系导向型', desc:'决策受他人影响较大'},
  independent: {name:'独立自主型', desc:'较少受他人意见左右'},
  avoidant: {name:'回避从众型', desc:'倾向避免冲突、随大流'},
};

/* ============================================================
   事件库 — 高中阶段 (16-18岁)
   ============================================================ */
const EVENTS_HIGH = [
  {
    id:'h1',
    age:16,
    title:'文理分科的抉择',
    narrative:(s)=>`高一结束，学校发了文理分科表。<br><br>班主任说："按你的成绩，理科更有前途。"爸爸在饭桌上说："学文科以后能干嘛？"但你最近读了一本心理学的科普书，第一次觉得"原来人可以这样被理解"。<br><br>你看着分科表，笔悬在半空。身边的好友小李毫不犹豫地勾了理科，说"跟我爸一样"。你的表姐去年文科毕业，至今没找到满意的工作。<br><br><div class="quote">"选理科吧，至少不会错。"——这是所有人的声音。但这是你的吗？</div>`,
    choices:[
      {
        text:'选择理科，顺应大家的建议',
        label:'稳妥从众',
        effects:{cognition:3,economic:2,efficacy:-2,wellbeing:-3},
        style:'avoidant',
        feedback:(s)=>`你勾了理科。说不上开心，但至少不用跟所有人解释。<br><br>接下来的一年，物理和化学的公式填满了你的笔记本。成绩不错，但每次路过书店的心理学专区，你都会多看两眼。`
      },
      {
        text:'选择文科，坚持自己的兴趣',
        label:'价值驱动',
        effects:{cognition:2,economic:-1,efficacy:5,wellbeing:3,cultural:3},
        style:'value_driven',
        feedback:(s)=>`你在表格上坚定地写了"文科"。<br><br>爸爸沉默了一晚上，妈妈帮你跟老师做了沟通。高二开学第一天，你走进文科班，窗外的阳光打在课桌上。你翻开历史课本，心里某个角落亮了一下——这才是你想学的。`
      },
      {
        text:'选理科，但悄悄自学心理学',
        label:'折中独立',

/* ============================================================
   游戏状态
   ============================================================ */
let state = {
  screen:'start', // start, create, game, summary, report
  charName:'',
  background:null,
  attrs:{},
  riasec:[],
  initialAttrs:{},
  stageIdx:0,
  eventIdx:0,
  decisions:[],
  styleCounts:{},
  awaitingChoice:false,
  lastChoiceIdx:-1,
};

/* ============================================================
   渲染函数
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.screen==='start') renderStart(app);
  else if(state.screen==='create') renderCreate(app);
  else if(state.screen==='game') renderGame(app);
  else if(state.screen==='summary') renderSummary(app);
  else if(state.screen==='report') renderReport(app);
}

/* ---- 启动页 ---- */
function renderStart(app){
  const div = document.createElement('div');
  div.className = 'start-wrap fade-in';
  div.innerHTML = `
    <div class="start-logo">🧭</div>
    <div class="start-title">人生探索器</div>
    <div class="start-sub">AI 驱动的人生模拟与反思游戏<br>在真实人生发生之前，低成本体验不同选择可能带来的长期影响</div>
    <div class="start-features">
      <span>8 维人生资本</span>
      <span>16 个关键决策</span>
      <span>3 个人生阶段</span>
      <span>动态剧情生成</span>
      <span>成长报告与反思</span>
      <span>平行人生推演</span>
    </div>
    <button class="btn-big tap" onclick="goCreate()">开始探索你的人生</button>
    <div class="start-foot">单局约 15—20 分钟 · 每一次选择都会改变你的轨迹</div>
  `;
  app.appendChild(div);
}

/* ---- 角色创建 ---- */
let createState = {name:'', bgIdx:-1, points:10, alloc:{}};
function goCreate(){
  state.screen='create';
  createState = {name:'', bgIdx:-1, points:10, alloc:{}};
  ATTRS.forEach(a=> createState.alloc[a.key]=0);
  render();
}

function renderCreate(app){
  const div = document.createElement('div');
  div.className='create-wrap fade-in';
  div.innerHTML=`
    <h2>创建你的人生角色</h2>
    <div class="hint">你的出身和初始天赋将影响人生起点，但不会决定终点</div>
    <div class="create-step">
      <label>角色姓名 <span class="req">*</span></label>
      <input class="text-input" id="charName" placeholder="给自己起个名字" value="${createState.name}" oninput="createState.name=this.value"/>
    </div>
    <div class="create-step">
      <label>家庭背景 <span class="req">*</span></label>
      <div class="bg-options">
        ${BACKGROUNDS.map((b,i)=>`
          <div class="bg-opt tap ${createState.bgIdx===i?'selected':''}" onclick="selectBg(${i})">
            <div class="bg-name">${b.name}</div>
            <div class="bg-desc">${b.desc}</div>
            <div class="bg-attrs">
              ${Object.entries(b.attrs).map(([k,v])=>{
                const attr=ATTRS.find(a=>a.key===k);
                return `<span style="color:${attr.color}">${attr.name} ${v}</span>`;
              }).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="create-step">
      <label>天赋点分配 <span style="font-weight:400;color:var(--muted);font-size:12px">（不分配也行，剩余点数会自动忽略）</span></label>
      <div class="points-display ${createState.points>0?'warn':''}" id="pointsDisplay">剩余 ${createState.points} 点</div>
      <div class="attr-alloc">
        ${ATTRS.map(a=>`
          <div class="alloc-row">
            <div class="al-name">${a.name}<small>${a.desc}</small></div>
            <button class="alloc-btn tap" onclick="adjustAttr('${a.key}',-1)" ${createState.alloc[a.key]<=0?'disabled':''}>−</button>
            <div class="al-val" id="alloc_${a.key}">${createState.alloc[a.key]}</div>
            <button class="alloc-btn tap" onclick="adjustAttr('${a.key}',1)" ${createState.points<=0?'disabled':''}>+</button>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="create-nav">
      <button class="btn-secondary tap" onclick="state.screen='start';render()">返回</button>
      <button class="btn-primary tap" onclick="startGame()" ${!createState.name||createState.bgIdx<0?'disabled':''}>开始人生</button>
    </div>
  `;
  app.appendChild(div);
}

function selectBg(i){ createState.bgIdx=i; render(); }
function adjustAttr(key,delta){
  if(delta>0 && createState.points<=0) return;
  if(delta<0 && createState.alloc[key]<=0) return;
  createState.alloc[key]+=delta;
  createState.points-=delta;
  render();
}

function startGame(){
  const bg = BACKGROUNDS[createState.bgIdx];
  state.charName = createState.name;
  state.background = bg;
  state.attrs = {...bg.attrs};
  ATTRS.forEach(a=> state.attrs[a.key] += createState.alloc[a.key]);
  state.initialAttrs = {...state.attrs};
  state.riasec = [...bg.riasec];
  state.stageIdx=0; state.eventIdx=0;
  state.decisions=[]; state.styleCounts={};
  state.screen='game';
  state.awaitingChoice=true;
  render();
}

/* ---- 游戏主界面 ---- */
function renderGame(app){
  const stage = STAGES[state.stageIdx];
  const event = stage.events[state.eventIdx];
  const totalEvents = STAGES.reduce((s,st)=>s+st.events.length,0);
  const currentIdx = STAGES.slice(0,state.stageIdx).reduce((s,st)=>s+st.events.length,0) + state.eventIdx + 1;

  const div = document.createElement('div');
  div.className='game-wrap fade-in';
  div.innerHTML=`
    <div class="game-top">
      <div class="gt-left">
        <div class="logo-sm">🧭</div>
        <div class="gt-title">人生探索器</div>
      </div>
      <div class="stage-progress">
        ${STAGES.map((s,i)=>{
          const cls = i<state.stageIdx?'done':i===state.stageIdx?'active':'';
          return `<div class="sp-dot ${cls}"></div>`;
        }).join('')}
      </div>
      <div style="font-size:12px;color:var(--muted)">${currentIdx}/${totalEvents}</div>
    </div>
    <div class="game-body">
      <div class="side-panel">
        <div class="avatar-block">
          <div class="avatar">${state.charName.slice(0,1)||'我'}</div>
          <div>
            <div class="char-name">${state.charName||'匿名'}</div>
            <div class="char-meta">${event.age}岁 · ${stage.name}</div>
          </div>
        </div>
        <div class="section-label">人生资本</div>
        ${renderAttrBars()}
        <div class="divider"></div>
        <div class="section-label">职业兴趣 RIASEC</div>
        <div class="riasec-mini">
          ${state.riasec.map(r=>`<span style="background:${r==='I'?'var(--blue-l)':r==='S'?'var(--teal-l)':r==='A'?'var(--pink-l)':r==='E'?'var(--amber-l)':r==='R'?'var(--coral-l)':'var(--green-l)'};color:${r==='I'?'var(--blue-d)':r==='S'?'var(--teal-d)':r==='A'?'var(--pink-d)':r==='E'?'var(--amber-d)':r==='R'?'var(--coral-d)':'#27500A'}">${r}</span>`).join('')}
        </div>
        ${state.decisions.length>0?`
          <div class="divider"></div>
          <div class="section-label">决策记录</div>
          <div class="decision-log">
            ${state.decisions.slice(-5).map(d=>`<div>${d.age}岁 · ${d.styleName}</div>`).join('')}
          </div>
        `:''}
      </div>
      <div class="main-panel" id="mainPanel">
        ${renderScene(event, stage)}
      </div>
    </div>
    <div class="game-bottom">
      <div class="gb-info">${stage.name} · 核心发展任务：${stage.crisis}</div>
      <div class="gb-info" id="gbStage">${stage.name} · ${state.eventIdx+1}/${stage.events.length}</div>
    </div>
  `;
  app.appendChild(div);
}

function renderAttrBars(){
  return ATTRS.map(a=>{
    const val = state.attrs[a.key];
    return `<div class="attr-bar">
      <div class="ab-top">
        <b>${a.name}</b>
        <span><span class="ab-val" style="color:${a.color}">${Math.round(val)}</span></span>
      </div>
      <div class="ab-track"><div class="ab-fill" style="width:${Math.min(100,val)}%;background:${a.color}"></div></div>
    </div>`;
  }).join('');
}

function renderScene(event, stage){
  const stageColors = {purple:'var(--purple)',teal:'var(--teal)',coral:'var(--coral)'};
  const stageL = {purple:'var(--purple-l)',teal:'var(--teal-l)',coral:'var(--coral-l)'};
  const sc = stageColors[stage.color];
  const scl = stageL[stage.color];

  // 如果刚选完，显示反馈
  if(!state.awaitingChoice && state.lastChoiceIdx>=0){
    const choice = event.choices[state.lastChoiceIdx];
    const styleName = STYLE_TAGS[choice.style].name;
    return `
      <div class="scene-badge" style="background:${scl};color:${sc}"><span class="dot" style="background:${sc}"></span>${stage.name} · ${event.age}岁</div>
      <div class="scene-title">${event.title}</div>
      <div class="choice-result">
        <div class="cr-label">你选择了</div>
        <div class="cr-text">${choice.text}</div>
        <div class="cr-feedback">${choice.feedback(state.attrs)}</div>
        <div class="cr-style">决策风格记录：${styleName} · ${STYLE_TAGS[choice.style].desc}</div>
      </div>
      <div class="ai-thinking">
        <div class="dots"><span></span><span></span><span></span></div>
        <span id="aiStatus">AI 正在推演你的人生轨迹……</span>
      </div>
    `;
  }

  // 正常场景
  return `
    <div class="scene-badge" style="background:${scl};color:${sc}"><span class="dot" style="background:${sc}"></span>${stage.name} · ${event.age}岁</div>
    <div class="scene-age">${event.age}岁</div>
    <div class="scene-title">${event.title}</div>
    <div class="scene-narrative">${event.narrative(state.attrs)}</div>
    <div class="choices">
      ${event.choices.map((c,i)=>`
        <button class="choice-card tap" onclick="makeChoice(${i})">
          <div class="ch-label">${c.label}</div>
          <div class="ch-text">${c.text}</div>
          <div class="ch-effects">
            ${Object.entries(c.effects).map(([k,v])=>{
              const attr = ATTRS.find(a=>a.key===k);
              const cls = v>0?'eff-up':v<0?'eff-down':'eff-neutral';
              const sign = v>0?'+':'';
              return `<span class="ch-eff ${cls}">${attr.name} ${sign}${v}</span>`;
            }).join('')}
          </div>
        </button>
      `).join('')}
    </div>
  `;
}

function makeChoice(idx){
  const stage = STAGES[state.stageIdx];
  const event = stage.events[state.eventIdx];
  const choice = event.choices[idx];

  // 应用属性变化
  Object.entries(choice.effects).forEach(([k,v])=>{
    state.attrs[k] = Math.max(0, Math.min(100, state.attrs[k]+v));
  });

  // 记录决策
  state.decisions.push({
    stageId:stage.id,
    eventId:event.id,
    eventTitle:event.title,
    age:event.age,
    choiceIdx:idx,
    choiceText:choice.text,
    style:choice.style,
    styleName:STYLE_TAGS[choice.style].name,
  });
  state.styleCounts[choice.style] = (state.styleCounts[choice.style]||0)+1;

  state.awaitingChoice=false;
  state.lastChoiceIdx=idx;
  render();

  // 模拟AI思考后推进
  setTimeout(()=>{
    document.getElementById('aiStatus').textContent = '剧情已更新，继续你的人生…';
  },1200);
  setTimeout(()=>{
    nextEvent();
  },2400);
}

function nextEvent(){
  state.awaitingChoice=true;
  state.lastChoiceIdx=-1;
  const stage = STAGES[state.stageIdx];
  state.eventIdx++;
  if(state.eventIdx >= stage.events.length){
    // 阶段结束
    state.eventIdx=0;
    state.stageIdx++;
    if(state.stageIdx >= STAGES.length){
      // 游戏结束，生成报告
      state.screen='report';
    } else {
      // 阶段总结
      state.screen='summary';
    }
  }
  render();
}

/* ---- 阶段总结 ---- */
function renderSummary(app){
  const prevStage = STAGES[state.stageIdx-1];
  const div = document.createElement('div');
  div.className='stage-summary fade-in';
  div.innerHTML=`
    <h2>${prevStage.name} 结束</h2>
    <div class="ss-hint">${prevStage.age} · 核心任务：${prevStage.crisis}</div>
    <div class="summary-card">
      <h3>📊 人生资本变化</h3>
      <div class="attr-compare">
        ${ATTRS.map(a=>{
          const old = getStageStartAttr(a.key, state.stageIdx-1);
          const now = state.attrs[a.key];
          const delta = Math.round(now-old);
          return `<div class="ac-row">
            <span class="ac-name">${a.name}</span>
            <span class="ac-vals">
              <span class="ac-old">${Math.round(old)}</span>
              <span class="ac-arrow">→</span>
              <span class="ac-new" style="color:${a.color}">${Math.round(now)}</span>
              <span class="ac-delta ${delta>0?'delta-up':delta<0?'delta-down':''}">${delta>0?'+':''}${delta}</span>
            </span>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="summary-card">
      <h3>🎯 本阶段决策回顾</h3>
      <div style="font-size:14px;color:#3a3a4a">
        ${state.decisions.filter(d=>d.stageId===prevStage.id).map(d=>`
          <div style="padding:8px 0;border-bottom:1px solid var(--line)">
            <b>${d.age}岁</b> · ${d.eventTitle}<br>
            <span style="color:var(--muted);font-size:13px">选择：${d.choiceText}</span><br>
            <span style="font-size:12px;color:var(--purple)">${d.styleName}</span>
          </div>
        `).join('')}
      </div>
    </div>
    <div style="text-align:center;margin-top:24px">
      <button class="btn-big tap" onclick="continueGame()">进入 ${STAGES[state.stageIdx].name} →</button>
    </div>
  `;
  app.appendChild(div);
}

function getStageStartAttr(key, stageIdx){
  // 简化：用initialAttrs + 之前阶段的决策推算
  // 实际我们记录的是当前值，所以需要反推
  // 简化方案：每个阶段开始时记录快照
  if(!state.stageSnapshots) state.stageSnapshots = {};
  if(stageIdx===0) return state.initialAttrs[key];
  if(state.stageSnapshots[stageIdx]) return state.stageSnapshots[stageIdx][key];
  return state.initialAttrs[key];
}

function continueGame(){
  // 记录当前阶段开始的快照
  if(!state.stageSnapshots) state.stageSnapshots={};
  state.stageSnapshots[state.stageIdx] = {...state.attrs};
  state.screen='game';
  render();
}

function renderRadarSVG(){
  const cx=140, cy=140, R=100;
  const n=ATTRS.length;
  const angle = (i)=> -Math.PI/2 + i*2*Math.PI/n;
  const point = (i,r)=> [cx+Math.cos(angle(i))*r, cy+Math.sin(angle(i))*r];

  let grid='';
  for(let r=25;r<=100;r+=25){
    const pts=[];
    for(let i=0;i<n;i++) pts.push(point(i,r).join(','));
    grid+=`<polygon points="${pts.join(' ')}" fill="none" stroke="#e5e4e0" stroke-width="1"/>`;
  }
  let axes='';
  for(let i=0;i<n;i++){
    const [x,y]=point(i,R);
    axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e5e4e0" stroke-width="1"/>`;
    const [lx,ly]=point(i,R+18);
    axes+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#6b6b7b">${ATTRS[i].name.slice(0,4)}</text>`;
  }
  // 初始值
  let initPts=[];
  for(let i=0;i<n;i++){
    const r = state.initialAttrs[ATTRS[i].key]/100*R;
    initPts.push(point(i,r).join(','));
  }
  // 当前值
  let nowPts=[];
  for(let i=0;i<n;i++){
    const r = state.attrs[ATTRS[i].key]/100*R;
    nowPts.push(point(i,r).join(','));
  }
  return `<svg class="radar-svg" viewBox="0 0 280 280">
    ${grid}${axes}
    <polygon points="${initPts.join(' ')}" fill="rgba(180,178,169,0.15)" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polygon points="${nowPts.join(' ')}" fill="rgba(83,74,183,0.2)" stroke="#534AB7" stroke-width="2"/>
    ${ATTRS.map((a,i)=>{
      const r=state.attrs[a.key]/100*R;
      const [x,y]=point(i,r);
      return `<circle cx="${x}" cy="${y}" r="3.5" fill="${a.color}"/>`;
    }).join('')}
  </svg>`;
}

function generateReflection(type){
  const valueCount = state.styleCounts.value_driven||0;
  const riskCount = state.styleCounts.risk_seeking||0;
  const pragmaticCount = state.styleCounts.pragmatic||0;
  const avoidCount = state.styleCounts.avoidant||0;
  const indepCount = state.styleCounts.independent||0;

  if(type==='am'){
    if(valueCount>=2) return `你在多个关键时刻选择了<b>追随内心的意义感</b>，这说明你有一个清晰的价值内核——你知道什么对自己重要。这种品质在心理学上叫做"价值清晰度"，是心理健康的重要预测因素。${riskCount>=1?'同时，你愿意为这些价值承担风险，这需要勇气。':''}`;
    if(pragmaticCount>=2) return `你倾向于在不确定中<b>选择稳妥和可控</b>，这反映了你内在的谨慎和责任感。这本身是一种力量——它让你避开了很多不必要的风险。但也要注意：${avoidCount>=1?'有时候"不犯错"的代价，是错过了真正想要的东西。':'长期的安全感如果缺乏意义感的支撑，可能会变成一种温和的窒息。'}`;
    if(indepCount>=2) return `你展现出很强的<b>独立判断能力</b>——你习惯自己做决定，较少被他人左右。这背后的品质是自主性（autonomy），是自我实现的核心条件。但独立不等于孤立，在需要支持时懂得求助，也是一种成熟。`;
    return `你的决策风格比较<b>多元</b>，没有单一的模式主导。这说明你在不同情境下能灵活调整——这是心理弹性（flexibility）的体现。你可以进一步觉察：在不同选择背后，是什么在驱动你？`;
  }
  if(type==='have'){
    const upAttrs = ATTRS.filter(a=>state.attrs[a.key]>state.initialAttrs[a.key]+3);
    const downAttrs = ATTRS.filter(a=>state.attrs[a.key]<state.initialAttrs[a.key]-3);
    let s = `回顾这段人生，你的<b>${upAttrs.map(a=>a.name).join('、')||'整体资本'}</b>有了明显增长——这是你在决策中积累的资源。`;
    if(downAttrs.length>0) s+=` 同时你也注意到，<b>${downAttrs.map(a=>a.name).join('、')}</b>有所下降。这提示你：${downAttrs.some(a=>a.key==='social')?'关系的维系需要主动投入，':'资源的分配总是有取舍，'}下一步可以有意识地去补充。`;
    return s;
  }
  if(type==='can'){
    return `基于你的决策轨迹，你可以在下一阶段尝试：<br>① <b>主动建立跨领域的人际网络</b>——你的独立性很强，但社会资本需要刻意经营；<br>② <b>给自己留出"无目的探索"的时间</b>——务实型决策过多时，容易忽略直觉和可能性；<br>③ <b>练习"下行反事实思维"</b>——在感到遗憾时，也想想"如果当时更糟"，这能帮助你获得释然感。`;
  }
}

function generateNarrative(topStyle){
  const first = state.decisions[0];
  const last = state.decisions[state.decisions.length-1];
  const highDecisions = state.decisions.filter(d=>d.stageId==='high');
  const collegeDecisions = state.decisions.filter(d=>d.stageId==='college');

  let s = `<p>${first.age}岁那年，你站在人生的第一个十字路口。${highDecisions.length>0?`那时的你，${highDecisions[0].choiceText}。`:''}</p>`;

  if(topStyle.includes('价值')){
    s+=`<p>回望这些年，你的主线很清晰：<span class="highlight">你一直在试着为自己做选择，而不是为别人的期待而活。</span>这个过程并不容易——有些决定让你和家人产生了分歧，有些让你承担了经济上的代价。但你很少后悔，因为每一步都是你自己走的。</p>`;
  } else if(topStyle.includes('务实')){
    s+=`<p>回望这些年，你的主线是<span class="highlight">在不确定中寻找确定性</span>。你做了很多"不会出错"的选择，也确实避开了不少风险。但偶尔在深夜，你会想起那些没有走过的路——<span class="highlight">稳定是你的盔甲，但别让它变成牢笼。</span></p>`;
  } else {
    s+=`<p>回望这些年，你的主线是<span class="highlight">在探索中认识自己</span>。你尝试了很多可能性，有些成功了，有些没有。但每一次尝试都让你更清楚自己是谁、想要什么。这不是弯路，这是你的必修课。</p>`;
  }

  s+=`<p>${last.age}岁的你，已经不是${first.age}岁的那个你了。${topStyle.includes('价值')?'你更坚定了，也更温柔了——你学会了在坚持自我的同时，理解他人的立场。':topStyle.includes('务实')?'你更沉稳了，但也许可以试着偶尔放手一搏——人生不只有"应该"，还有"想要"。':'你更从容了，也更知道自己要什么了——探索的意义，不在于找到标准答案，而在于你终于有底气说"我知道我选的是对的"。'}</p>`;

  s+=`<p><span class="highlight">人生探索器的意义，不是给你一个"正确答案"，而是让你看见：每一个选择都塑造了你，而你始终有选择的权力。</span>这段模拟结束了，但你真实的人生，才刚刚开始。</p>`;
  return s;
}

function renderParallelLife(){
  // 基于第一个关键决策的反事实推演
  const firstBig = state.decisions.find(d=>d.style==='value_driven') || state.decisions[0];
  const altText = firstBig.choiceText;
  const altStage = STAGES.find(s=>s.id===firstBig.stageId);
  const altEvent = altStage.events.find(e=>e.id===firstBig.eventId);
  const altChoice = altEvent.choices[(firstBig.choiceIdx+1)%altEvent.choices.length];

  return `
    <div class="parallel-card current">
      <h4>● 你的人生</h4>
      <div class="pc-meta">基于你 ${firstBig.age} 岁的选择：${altText.slice(0,18)}…</div>
      <div class="pc-list">
        ${state.decisions.map(d=>`<div><b>${d.age}岁</b> · ${d.choiceText.slice(0,24)}${d.choiceText.length>24?'…':''}</div>`).join('')}
      </div>
      <div class="pc-end" style="background:var(--purple-l);color:var(--purple-d)">
        ${generateEnding()}
      </div>
    </div>
    <div class="parallel-card">
      <h4>○ 平行人生</h4>
      <div class="pc-meta">如果当时你选了：${altChoice.text.slice(0,18)}…</div>
      <div class="pc-list">
        ${generateParallelPath(firstBig, altChoice)}
      </div>
      <div class="pc-end" style="background:var(--amber-l);color:var(--amber-d)">
        ${generateAltEnding(altChoice)}
      </div>
    </div>
  `;
}

function generateEnding(){
  const wb = state.attrs.wellbeing;
  const eff = state.attrs.efficacy;
  const eco = state.attrs.economic;
  if(wb>65 && eff>60) return `幸福感 ${Math.round(wb)} · 自我效能 ${Math.round(eff)} · 你活成了自己定义的"值得"`;
  if(eco>65 && wb<50) return `经济资本 ${Math.round(eco)} · 幸福感 ${Math.round(wb)} · 物质丰盈，但内心仍有空洞`;
  if(wb<45) return `幸福感 ${Math.round(wb)} · 这条路走得辛苦，但你学到了最重要的东西：什么不值得`;
  return `幸福感 ${Math.round(wb)} · 自我效能 ${Math.round(eff)} · 平衡而真实的人生`;
}

function generateAltEnding(altChoice){
  if(altChoice.style==='avoidant'||altChoice.style==='pragmatic'){
    return `更稳定，但自我效能感可能停滞 · 30岁前后可能出现"意义感危机"`;
  }
  if(altChoice.style==='risk_seeking'){
    return `波动更大，高风险高回报 · 可能更精彩，也可能更狼狈`;
  }
  return `另一条平衡之路 · 没有对错，只有不同的风景`;
}

function generateParallelPath(firstBig, altChoice){
  const paths = {
    h1: ['19岁 · 顺应了家人安排，成绩平稳但内心微有遗憾','21岁 · 选了"安全"的专业方向','23岁 · 按部就班毕业，履历不错','25岁 · 开始隐约感到"这真的是我要的吗"'],
    h5: ['19岁 · 学了别人眼中的"好专业"，成绩不错','21岁 · 但深夜会偷偷看心理学的书','23岁 · 考研/工作按部就班','25岁 · 出现"如果当初"的念头'],
    c1: ['19岁 · 错过了一些人脉，但成绩更专注','21岁 · 社交圈较小，关系更精','23岁 · 进入职场时需要重新学习社交','25岁 · 逐渐找到了自己的节奏'],
    c4: ['22岁 · 简历好看，但少了真实的热情','24岁 · 工作稳定但倦怠感来得更早','25岁 · 开始思考"我到底要什么"','26岁 · 转型的冲动比当前路径更强烈'],
    w1: ['24岁 · 稳定但天花板可见','25岁 · 开始用业余时间探索兴趣','26岁 · 两条路的分野更加明显','27岁 · 要么安于现状，要么彻底转型'],
  };
  const p = paths[firstBig.eventId] || ['路径有所不同','但每条路都有风景','也有遗憾','这就是人生'];
  return p.map(x=>`<div>${x}</div>`).join('');
}

render();
