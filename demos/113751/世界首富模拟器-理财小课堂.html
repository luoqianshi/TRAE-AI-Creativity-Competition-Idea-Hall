<style>
/* ===== 全局基础 ===== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:#020617;color:#e2e8f0;min-height:100vh;overflow-x:hidden;line-height:1.6}

/* ===== 赛博朋克背景特效 ===== */
body::before{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(34,211,238,0.03) 2px,rgba(34,211,238,0.03) 4px),
    repeating-linear-gradient(90deg,transparent,transparent 2px,rgba(34,211,238,0.02) 2px,rgba(34,211,238,0.02) 4px);
}
body::after{
  content:'';position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 20% 50%,rgba(74,222,128,0.04) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 20%,rgba(245,158,11,0.03) 0%,transparent 50%);
}

/* ===== 扫描线动画 ===== */
@keyframes scanline{0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}
.scanline{
  position:fixed;top:0;left:0;width:100%;height:4px;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(34,211,238,0.08),transparent);
  animation:scanline 8s linear infinite;
}

/* ===== 流光进度条 ===== */
@keyframes flowGlow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
.flow-bar{
  background:linear-gradient(90deg,#f59e0b,#ef4444,#f59e0b,#4ade80,#f59e0b);
  background-size:300% 100%;
  animation:flowGlow 3s ease infinite;
}

/* ===== 数字闪烁 ===== */
@keyframes numFlash{0%,100%{opacity:1}50%{opacity:0.6}}
.num-flash{animation:numFlash 0.3s ease}

/* ===== 霓虹边框光晕 ===== */
.neon-card{
  border:1px solid rgba(74,222,128,0.2);
  box-shadow:0 0 8px rgba(74,222,128,0.1),inset 0 0 8px rgba(74,222,128,0.05);
  transition:all 0.3s ease;
}
.neon-card:hover{
  border-color:rgba(74,222,128,0.5);
  box-shadow:0 0 20px rgba(74,222,128,0.2),inset 0 0 12px rgba(74,222,128,0.08);
}

/* ===== 按钮发光效果 ===== */
.glow-btn{
  transition:all 0.25s ease;position:relative;overflow:hidden;
}
.glow-btn::after{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle,rgba(74,222,128,0.15) 0%,transparent 70%);
  opacity:0;transition:opacity 0.3s ease;pointer-events:none;
}
.glow-btn:hover::after{opacity:1}
.glow-btn:hover{transform:translateY(-2px);box-shadow:0 0 25px rgba(74,222,128,0.3)}

/* ===== 隐藏工具类 ===== */
.hidden{display:none!important}

/* ===== 滚动条美化 ===== */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0f172a}
::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#475569}

/* ===== 淡入动画 ===== */
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.anim-fade{animation:fadeInUp 0.4s ease}

/* ===== 选择卡片高亮 ===== */
.sel-card-active{
  border-color:#4ade80 !important;
  box-shadow:0 0 20px rgba(74,222,128,0.3) !important;
  background:rgba(74,222,128,0.08) !important;
}

/* ===== 日志面板 ===== */
.log-panel{max-height:150px;overflow-y:auto}
.log-item{border-bottom:1px solid rgba(51,65,85,0.5)}
</style>

function determineTierEnding(endCheck) {
  var total = getTotalWealth();
  var target = getEraTargetNPC();
  var targetW = target.peakWealth * 100000000;
  var ratio = total / targetW;

  if (endCheck.win && ratio >= 1) {
    return TIER_ENDINGS.star_designer;
  }
  if (endCheck.win) {
    return TIER_ENDINGS.industry_leader;
  }
  if (total < 0) {
    return TIER_ENDINGS.bankrupt;
  }
  // 根据时代调整阶梯标准
  var era = G.era;
  var thresholds;
  if (era === '1850s') {
    thresholds = [100, 10000, 500000, 50000000];
  } else if (era === '1950s') {
    thresholds = [500, 50000, 5000000, 500000000];
  } else {
    thresholds = [5000, 500000, 50000000, 50000000000];
  }

  if (total < thresholds[0]) return TIER_ENDINGS.poor;
  if (total < thresholds[1]) return TIER_ENDINGS.comfortable;
  if (total < thresholds[2]) return TIER_ENDINGS.village_rich;
  if (total < thresholds[3]) return TIER_ENDINGS.industry_leader;
  return TIER_ENDINGS.star_designer;
}

// 核心函数
function getTotalWealth() { return G.cash + G.assets; }
function getEraTargetNPC() { return NPCS[G.eraData.npcTargets[0]]; }

function fmtMoney(n) {
  var abs = Math.abs(n), sign = n < 0 ? '-' : '';
  if (abs >= 1e12) return sign + (abs/1e12).toFixed(2) + '万亿';
  if (abs >= 1e8) return sign + (abs/1e8).toFixed(2) + '亿';
  if (abs >= 1e4) return sign + (abs/1e4).toFixed(1) + '万';
  return sign + Math.round(abs);
}

// 被动收入
function applyPassiveGrowth(years) {
  var growth = 0;
  var assetIncome = G.assets * 0.05 * years;
  var locBuff = G.locData.buff;
  if (locBuff.growthBonus) assetIncome *= locBuff.growthBonus;
  if (locBuff.investBonus) assetIncome *= locBuff.investBonus;
  growth += assetIncome;
  var baseRate = 0.05;
  var accelFactor = 1 + Math.log10(Math.max(1, getTotalWealth() / 10000)) * 0.08;
  if (getTotalWealth() >= 1e9) accelFactor += 0.5;
  if (getTotalWealth() >= 10e9) accelFactor += 0.8;
  growth += G.cash * Math.min(baseRate * accelFactor, 0.3) * years;
  G.cash += growth;
  return growth;
}

// 时间推进
function advanceTime(years) {
  years = years || 2;
  var growth = applyPassiveGrowth(years);
  G.currentYear += years;
  G.age += years;
  /* Buff 计时 */
  if (G.buffTurns > 0) { G.buffTurns--; if (G.buffTurns <= 0) G.buff = null; }
  /* 更新最大财富 */
  if (getTotalWealth() > G.maxNetWorth) {
    G.maxNetWorth = getTotalWealth();
    G.peakAge = G.age;
  }
  return growth;
}

// 胜负检查
function checkGameEnd() {
  var total = getTotalWealth();
  var targetNPC = getEraTargetNPC();
  if (total >= targetNPC.peakWealth * 100000000)
    return {over:true, win:true, reason:'你超越了历史上的首富！'};
  if (G.cash <= 0 && G.assets <= 0)
    return {over:true, win:false, reason:'你破产了。'};
  if (G.age >= 85)
    return {over:true, win:false, reason:'你走完了这一生的路。'};
  if (G.reputation <= 0)
    return {over:true, win:false, reason:'你的名誉彻底崩塌，所有人都离你而去。'};
  return {over:false};
}

// 获取概率加成
function getStatBonus(stat) {
  var val = G[stat] || 50;
  return (val - 50) / 500;
}

function getRollBonus(roll) {
  var bonus = 0;
  if (roll.bonusStat) bonus += getStatBonus(roll.bonusStat) * (roll.bonusMult || 1);
  /* Buff 加成 */
  if (G.buff === 'buffett_insight' && roll.bonusStat === 'intellect') bonus += 0.15;
  /* NPC 导师加成 */
  var npcMentorBonus = false;
  Object.keys(G.npcRelations).forEach(function(npcId) {
    if (G.npcRelations[npcId] >= 50) npcMentorBonus = true;
  });
  if (npcMentorBonus) bonus += 0.05;
  /* 名誉加成 */
  if (G.reputation >= 80) bonus += 0.05;
  return bonus;
}

// 选择事件（含年份区间筛选）
function selectEvent() {
  var pool = [];
  EVENTS.forEach(function(ev) {
    /* 筛选年代 */
    if (ev.era !== 'any' && ev.era !== G.era) return;
    /* 年份区间筛选 */
    if (ev.startYear && ev.endYear) {
      if (G.currentYear < ev.startYear || G.currentYear > ev.endYear) return;
    }
    /* 筛选地域 */
    if (ev.regions && ev.regions.indexOf(G.loc) === -1) return;
    /* NPC 要求 */
    if (ev.requiresNpc) {
      var rel = G.npcRelations[ev.requiresNpc.id] || 0;
      if (rel < ev.requiresNpc.minRelation) return;
    }
    /* 名誉要求 */
    if (ev.minReputation !== undefined && G.reputation > ev.minReputation) return;
    /* 已看过 */
    if (G.eventsSeen[ev.id]) return;
    pool.push(ev);
  });
  /* 按权重随机选择 */
  if (pool.length === 0) {
    G.eventsSeen = {};
    return selectEvent();
  }
  /* 优先选择 NPC 事件和时代事件 */
  var npcPool = pool.filter(function(e){return e.requiresNpc});
  var eraPool = pool.filter(function(e){return e.era === G.era && !e.requiresNpc});
  var genPool = pool.filter(function(e){return e.era === 'any' && !e.requiresNpc});

  var finalPool;
  var r = Math.random();
  if (npcPool.length > 0 && r < 0.2) finalPool = npcPool;
  else if (eraPool.length > 0 && r < 0.75) finalPool = eraPool;
  else if (genPool.length > 0) finalPool = genPool;
  else if (eraPool.length > 0) finalPool = eraPool;
  else finalPool = pool;

  return finalPool[Math.floor(Math.random() * finalPool.length)];
}

// 显示下一个事件（v5修改：增加快照、通胀、国债复利）
function showNextEvent() {
  G.turnCount++;

  // v5：保存快照（用于时间倒流）
  if (G.snapshots.length > 10) G.snapshots.shift(); // 最多保留10个
  G.snapshots.push({
    age: G.age, year: G.currentYear,
    cash: G.cash, assets: G.assets,
    reputation: G.reputation,
    intellect: G.intellect, charisma: G.charisma, courage: G.courage,
    turnCount: G.turnCount, history: G.history.slice()
  });

  /* 第一回合不推进时间 */
  if (G.turnCount === 1) {
    showEventCard();
    return;
  }
  /* 推进时间 */
  var years = 2 + Math.floor(Math.random() * 3);

  if (years > 0) {
    var growth = advanceTime(years);

    // v5：国债复利（每回合计算）
    if (G.bondInvested > 0) {
      G.bondRounds++;
      var bondRate = 0.03 + (G.bondRounds > 20 ? 0.02 : 0) + (G.bondRounds > 40 ? 0.03 : 0); // 持有越久收益率越高
      var bondInterest = Math.round(G.bondInvested * bondRate);
      G.cash += bondInterest;
      G.bondInvested += bondInterest; // 利滚利
      if (G.bondRounds % 5 === 0) {
        addLog('fa-chart-line','#4ade80','国债复利第'+G.bondRounds+'期：利息 +'+fmtMoney(bondInterest)+'，累计 '+fmtMoney(G.bondInvested));
      }
    }

    // v5：通胀检测：如果现金远大于资产，触发通胀贬值
    if (G.cash > G.assets * 3 && G.cash > 1000) {
      var inflateRate = 0.03 + Math.random() * 0.07; // 3%-10%贬值
      G.cash = Math.round(G.cash * (1 - inflateRate));
      addLog('fa-fire-flame-curved','#ef4444','通胀警报！现金购买力贬值 '+(inflateRate*100).toFixed(1)+'%');
    }

    /* 章节过渡叙事 */
    var phase = getPhase();
    if (phase !== G.lastPhase) {
      G.lastPhase = phase;
      var transText = CHAPTER_TRANSITIONS[phase];
      if (transText) {
        showNarrative(G.currentYear + '年，' + G.age + '岁。' + transText);
        G.history.push({year:G.currentYear, age:G.age, text:'时光流逝'});
        addLog('fa-hourglass-half','var(--cyber-cyan, #22d3ee)',''+G.age+'岁，'+(phase==='early'?'青春':'中年')+'阶段');
        updateUI();
        setTimeout(function(){ showEventCard(); }, 2000);
        return;
      }
    }
    /* 显示时间推进信息 */
    var growthText = growth > 0 ? '（被动收入：+' + fmtMoney(growth) + '）' : '';
    showNarrative(G.currentYear + '年。' + playerName + '已经' + G.age + '岁了。' + growthText);
    G.history.push({year:G.currentYear, age:G.age, text:'时光流逝，财富积累'});
    addLog('fa-clock','#94a3b8',G.age+'岁，财富增长');
    updateUI();
    setTimeout(function(){ showEventCard(); }, 1500);
  } else {
    showEventCard();
  }
}

function getPhase() {
  if (G.age < 30) return 'early';
  if (G.age < 55) return 'mid';
  return 'late';
}

// 显示事件卡
function showEventCard() {
  /* 检查游戏结束 */
  var endCheck = checkGameEnd();
  if (endCheck.over) { showEndScreen(endCheck); return; }

  var ev = selectEvent();
  if (!ev) { showEndScreen({over:true, win:false, reason:'你走完了这一生的路。'}); return; }
  G.eventsSeen[ev.id] = true;

  var html = '<div class="anim-fade neon-card rounded-xl p-5 bg-cyber-card/80 backdrop-blur mb-4">';

  /* 标签 */
  if (ev.tags) {
    html += '<div class="flex flex-wrap gap-2 mb-3">';
    ev.tags.forEach(function(t){
      var tagColor = t.c==='crisis' ? 'bg-red-500/20 text-red-400' :
                    t.c==='era' ? 'bg-amber-500/20 text-amber-400' :
                    t.c==='loc' ? 'bg-green-500/20 text-green-400' :
                    'bg-cyan-500/20 text-cyan-400';
      html += '<span class="text-xs px-2 py-0.5 rounded-full '+tagColor+'">'+t.t+'</span>';
    });
    html += '</div>';
  }

  /* NPC 关联 */
  if (ev.npc) {
    var npc = NPCS[ev.npc];
    var npcColor = NPC_COLORS[ev.npc] || '#f59e0b';
    var npcIcon = NPC_ICONS[ev.npc] || 'fa-user';
    html += '<div class="flex items-center gap-2 mb-3 text-xs">' +
      '<i class="fas '+npcIcon+'" style="color:'+npcColor+'"></i>' +
      '<span class="text-amber-400 font-bold">'+npc.name+'</span>' +
      '<span class="text-cyber-muted">· '+npc.title+'</span></div>';
  }

  /* 标题和描述 */
  html += '<div class="text-lg font-bold text-cyber-text mb-2">'+ev.title+'</div>';
  html += '<div class="text-sm text-cyber-muted leading-relaxed mb-4">'+ev.desc+'</div>';

  /* 选项按钮（2x2网格或列表） */
  var choiceCount = ev.choices.length;
  var gridClass = choiceCount >= 4 ? 'grid grid-cols-2 gap-3' : 'flex flex-col gap-3';
  html += '<div class="'+gridClass+'">';
  ev.choices.forEach(function(ch, i) {
    var riskText = '';
    var riskColor = 'text-cyber-cyan';
    if (ch.roll) {
      var winRate = Math.round((ch.roll.win + getRollBonus(ch.roll)) * 100);
      winRate = Math.max(5, Math.min(95, winRate));
      riskText = '<div class="text-xs mt-1 '+riskColor+'"><i class="fas fa-dice mr-1"></i>成功率：'+winRate+'%</div>';
    }
    html += '<button class="glow-btn text-left p-4 rounded-xl bg-slate-800/60 border border-cyber-border hover:border-cyber-green transition-all group" onclick="makeChoice(\''+ev.id+'\','+i+')">' +
      '<div class="text-sm font-bold text-cyber-text group-hover:text-cyber-green transition-colors">'+ch.text+'</div>' +
      '<div class="text-xs text-cyber-muted mt-1">'+ch.desc+'</div>' +
      riskText + '</button>';
  });
  html += '</div></div>';

  document.getElementById('event-area').innerHTML = html;
  updateUI();
  /* 日志：事件出现 */
  addLog('fa-bell','#f59e0b',ev.title);
}

// 做出选择
function makeChoice(evId, choiceIdx) {
  var ev = null;
  for (var i = 0; i < EVENTS.length; i++) {
    if (EVENTS[i].id === evId) { ev = EVENTS[i]; break; }
  }
  if (!ev) return;
  var ch = ev.choices[choiceIdx];

  var isRoll = !!ch.roll;
  var isWin = true;
  var resultEffects = {};

  if (isRoll) {
    var winRate = ch.roll.win + getRollBonus(ch.roll);
    /* 地域危机风险调整 */
    if (ev.tags && ev.tags.some(function(t){return t.c==='crisis'})) {
      var crisisRisk = G.locData.buff.crisisRisk || 1;
      winRate /= crisisRisk;
    }
    winRate = Math.max(0.05, Math.min(0.95, winRate));
    isWin = Math.random() < winRate;
    resultEffects = isWin ? (ch.successE || {}) : (ch.failE || {});
  } else {
    resultEffects = ch.effects || {};
  }

  /* 保存旧值（用于计算实际变动金额） */
  var oldCash = G.cash, oldAssets = G.assets, oldRep = G.reputation;

  /* 应用效果 */
  applyEffects(resultEffects);
  /* NPC 关系变化 */
  if (ch.npcEffect) {
    var npcId = ch.npcEffect.npc;
    var relChange = ch.npcEffect.relation || 0;
    G.npcRelations[npcId] = (G.npcRelations[npcId] || 0) + relChange;
  }
  if (ev.npcEffect) {
    var npcId2 = ev.npcEffect.npc;
    var relChange2 = ev.npcEffect.relation || 0;
    G.npcRelations[npcId2] = (G.npcRelations[npcId2] || 0) + relChange2;
  }
  /* 属性成长 */
  if (ch.statGains) {
    Object.keys(ch.statGains).forEach(function(stat) {
      if (stat === 'reputation') {
        G.reputation = Math.max(0, Math.min(100, G.reputation + ch.statGains[stat]));
      } else if (stat === 'connections') {
        G.charisma = Math.min(100, G.charisma + ch.statGains[stat]);
      } else {
        G[stat] = Math.min(100, (G[stat] || 50) + ch.statGains[stat]);
      }
    });
  }
  /* Buff 设置 */
  if (ch.setBuff) {
    G.buff = ch.setBuff;
    G.buffTurns = 3;
  }

  /* 统计 */
  if (isRoll) { if (isWin) G.majorWins++; else G.majorLosses++; }

  /* 记录履历 */
  var outcomeText = isWin ? (ch.successT || ch.outcome || '事件处理成功。') :
                             (ch.failT || ch.outcome || '事件处理失败。');
  G.history.push({year:G.currentYear, age:G.age, text:ev.title + ' — ' + outcomeText});

  /* 显示结果 */
  showResult(ev, ch, isWin, resultEffects, oldCash, oldAssets, oldRep);

  /* 日志 */
  var logIcon = isWin ? 'fa-check-circle' : 'fa-times-circle';
  var logColor = isWin ? '#4ade80' : '#ef4444';
  addLog(logIcon, logColor, ev.title + ' — ' + (isWin?'成功':'失败'));
}

// 应用数值效果（v5修改：增加国债处理+VIP减伤）
function applyEffects(eff) {
  if (!eff) return;
  var total = getTotalWealth();

  // v5：VIP免死金牌：负面效果减半
  if (G.vipActive) {
    if (eff.cashPct && eff.cashPct < 0) eff.cashPct *= 0.5;
    if (eff.assetsPct && eff.assetsPct < 0) eff.assetsPct *= 0.5;
    if (eff.reputation && eff.reputation < 0) eff.reputation *= 0.5;
  }

  // 百分比计算
  if (eff.cashPct) {
    G.cash = Math.round(G.cash * (1 + eff.cashPct));
  }
  if (eff.assetsPct) {
    G.assets = Math.round(G.assets * (1 + eff.assetsPct));
  }

  // 少量固定数值
  if (eff.cashAdd) G.cash += eff.cashAdd;
  if (eff.assetsAdd) G.assets += eff.assetsAdd;

  // 负资产防御：如果现金/资产为负，触发特殊处理
  if (G.cash < 0) {
    // 小概率"翻盘"事件：如果courage > 70，负资产减半
    if (G.courage > 70 && Math.random() < 0.3) {
      G.cash = Math.round(G.cash / 2); // 负债减半
      addLog('fa-dice','#22d3ee','绝境翻盘！胆识过人，负债减半');
    }
  }

  // 声誉
  if (eff.reputation) G.reputation = Math.max(0, Math.min(100, G.reputation + eff.reputation));
  // 属性
  if (eff.intellect) G.intellect = Math.min(100, G.intellect + eff.intellect);
  if (eff.charisma) G.charisma = Math.min(100, G.charisma + eff.charisma);
  if (eff.courage) G.courage = Math.min(100, G.courage + eff.courage);
  if (eff.connections) G.charisma = Math.min(100, G.charisma + eff.connections);

  // 负资产保护：如果总资产严重为负，触发破产
  if (getTotalWealth() < -5000) {
    G.cash = 0; G.assets = 0;
    addLog('fa-skull','#ef4444','资产归零，触发破产保护');
  }

  // v5：国债处理
  if (eff.setBond) {
    var investAmount = Math.abs(Math.round(getTotalWealth() * (eff.bondPct || 0)));
    G.bondInvested += investAmount;
    G.bondRounds = 0;
    addLog('fa-landmark','#4ade80','国债购入，新增本金 '+fmtMoney(investAmount));
  }
}

// 显示结果（v5修改：增加VIP保护提示）
function showResult(ev, ch, isWin, eff, oldCash, oldAssets, oldRep) {
  var html = '<div class="anim-fade neon-card rounded-xl p-5 bg-cyber-card/80 backdrop-blur mb-4">';

  var borderColor = isWin ? 'border-green-400/50' : 'border-red-400/50';
  var iconHtml = isWin ?
    '<div class="flex items-center gap-2 mb-3"><i class="fas fa-check-circle text-green-400 text-xl"></i><span class="text-green-400 font-bold text-lg">成功！</span></div>' :
    '<div class="flex items-center gap-2 mb-3"><i class="fas fa-times-circle text-red-400 text-xl"></i><span class="text-red-400 font-bold text-lg">失败！</span></div>';

  html += iconHtml;

  var outcomeText = isWin ? (ch.successT || ch.outcome || '') : (ch.failT || ch.outcome || '');
  html += '<div class="text-sm text-cyber-muted leading-relaxed mb-4">'+outcomeText+'</div>';

  // v5：VIP保护提示
  if (G.vipActive && !isWin) {
    html += '<div class="mt-2 text-xs text-amber-500"><i class="fas fa-shield-halved mr-1"></i>VIP免死金牌生效：损失减半！</div>';
  }

  /* 数值变化 — 用实际金额显示 */
  var gains = [];
  var cashDiff = G.cash - (oldCash || G.cash);
  var assetDiff = G.assets - (oldAssets || G.assets);
  var repDiff = G.reputation - (oldRep || G.reputation);
  if (cashDiff !== 0) gains.push({t:'现金 ' + (cashDiff>=0?'+':'') + fmtMoney(cashDiff), p:cashDiff>=0});
  if (assetDiff !== 0) gains.push({t:'资产 ' + (assetDiff>=0?'+':'') + fmtMoney(assetDiff), p:assetDiff>=0});
  if (repDiff !== 0) gains.push({t:'名誉 ' + (repDiff>=0?'+':'') + repDiff, p:repDiff>=0});
  if (ch.statGains) {
    var statNames = {intellect:'智慧',charisma:'魅力',courage:'胆识',reputation:'名誉',connections:'人脉'};
    Object.keys(ch.statGains).forEach(function(s){
      gains.push({t:(statNames[s]||s)+' +'+ch.statGains[s], p:true});
    });
  }

  if (gains.length > 0) {
    html += '<div class="flex flex-wrap gap-2">';
    gains.forEach(function(g) {
      var cls = g.p ? 'bg-green-500/15 text-green-400 border-green-500/30' : 'bg-red-500/15 text-red-400 border-red-500/30';
      html += '<span class="text-xs px-2 py-1 rounded-lg border '+cls+'">'+g.t+'</span>';
    });
    html += '</div>';
  }

  /* 继续按钮 */
  html += '<div class="mt-5 text-center">' +
    '<button onclick="showNextEvent()" class="glow-btn px-8 py-3 rounded-xl font-bold bg-gradient-to-r from-amber-500 to-green-400 text-gray-900 text-sm">' +
    '<i class="fas fa-arrow-right mr-2"></i>继续前行</button></div>';
  html += '</div>';

  document.getElementById('event-area').innerHTML = html;
  updateUI();
}

// 时间倒流：回到3年前
function useTimeRewind() {
  if (G.rewindUsed >= 3) {
    addLog('fa-ban','#ef4444','时间倒流次数已用完（最多3次）');
    return;
  }
  if (G.snapshots.length < 3) {
    addLog('fa-ban','#ef4444','还无法倒流——游戏记录不足');
    return;
  }
  G.rewindUsed++;
  var snap = G.snapshots.pop(); // 取最近的快照
  G.age = snap.age;
  G.currentYear = snap.year;
  G.cash = snap.cash;
  G.assets = snap.assets;
  G.reputation = snap.reputation;
  G.intellect = snap.intellect;
  G.charisma = snap.charisma;
  G.courage = snap.courage;
  G.turnCount = snap.turnCount;
  G.history = snap.history;
  addLog('fa-clock-rotate-left','#22d3ee','时间倒流！回到了'+G.currentYear+'年（'+G.age+'岁）');
  addLog('fa-info-circle','#94a3b8','潜台词：现实中理财没有回头路。犯错就是犯错，代价必须承受。');
  updateUI();
  showCyberModal('fa-clock-rotate-left',
    '时间倒流成功',
    '你回到了 '+G.currentYear+'年（'+G.age+'岁）。<br>现金恢复为 <span class="text-green-400">'+fmtMoney(G.cash)+'</span>，资产恢复为 <span class="text-green-400">'+fmtMoney(G.assets)+'</span>。<br><br><span class="text-xs text-cyber-muted italic">但记住——现实中，没有人能买到后悔药。</span>');
}

  document.getElementById('game-screen').classList.add('hidden');
  var endScreen = document.getElementById('end-screen');
  endScreen.classList.remove('hidden');

  var totalW = getTotalWealth();
  var target = getEraTargetNPC();
  var targetW = target.peakWealth * 100000000;
  var ratio = totalW / targetW;
  var bio = generateBiography(endCheck);
  var ending = determineTierEnding(endCheck);

  var maxW = Math.max(totalW, targetW);
  var youPct = Math.min(100, (totalW / maxW * 100)).toFixed(1);
  var npcPct = Math.min(100, (targetW / maxW * 100)).toFixed(1);

  var html = '';

  /* 结局卡片 */
  html += '<div class="anim-fade neon-card rounded-xl p-6 bg-cyber-card/80 mb-6 text-center" style="border-color:'+ending.color+'44;box-shadow:0 0 20px '+ending.color+'22">' +
    '<div class="text-3xl font-black mb-2" style="color:'+ending.color+';text-shadow:0 0 20px '+ending.color+'44">'+ending.title+'</div>' +
    '<div class="text-sm font-bold mb-4" style="color:'+ending.color+'">'+ending.subtitle+'</div>' +
    '<div class="text-sm text-cyber-muted leading-relaxed">'+ending.text+'</div>' +
    '<div class="mt-4 p-3 rounded-lg bg-slate-800/50 text-sm font-bold" style="color:'+ending.color+'">'+ending.lesson+'</div></div>';

  /* 统计 */
  html += '<div class="neon-card rounded-xl p-5 bg-cyber-card/80 mb-4">';
  var stats = [
    ['玩家', playerName, 'text-cyber-text'],
    ['出生年代', G.eraData.name, 'text-cyber-text'],
    ['起始城市', G.subLoc, 'text-cyber-text'],
    ['终年', G.currentYear+'年（'+G.age+'岁）', 'text-cyber-cyan'],
    ['最终总财富', fmtMoney(totalW), 'text-amber-400 font-bold'],
    ['峰值财富', fmtMoney(G.maxNetWorth)+'（'+G.peakAge+'岁）', 'text-amber-400'],
    ['现金', fmtMoney(G.cash), G.cash>=0?'text-green-400':'text-red-400'],
    ['固定资产', fmtMoney(G.assets), 'text-cyber-text'],
    ['国债资产', fmtMoney(G.bondInvested)+'（'+G.bondRounds+'期）', G.bondInvested>0?'text-green-400':'text-cyber-muted'],
    ['名誉值', G.reputation+'/100', G.reputation>=60?'text-green-400':'text-red-400'],
    ['回合数', G.turnCount, 'text-cyber-text'],
    ['成功/失败', G.majorWins+' / '+G.majorLosses, 'text-cyber-text']
  ];
  stats.forEach(function(s){
    html += '<div class="flex justify-between py-2 border-b border-slate-700/50 text-sm">' +
      '<span class="text-cyber-muted">'+s[0]+'</span>' +
      '<span class="'+s[2]+'">'+s[1]+'</span></div>';
  });
  html += '</div>';

  /* NPC对比 */
  html += '<div class="neon-card rounded-xl p-5 bg-cyber-card/80 border-amber-500/30 mb-4 text-center">' +
    '<div class="text-amber-400 font-bold mb-3"><i class="fas fa-exchange-alt mr-2"></i>VS '+target.name+'（'+target.title+'）</div>' +
    '<div class="text-xs text-cyber-muted mb-2">你达到了对手峰值的 '+(ratio*100).toFixed(2)+'%</div>' +
    '<div class="text-xs mb-1">'+playerName+'：'+fmtMoney(totalW)+'</div>' +
    '<div class="h-6 bg-slate-800 rounded-full overflow-hidden mb-3">' +
      '<div class="h-full rounded-full transition-all duration-1000" style="width:'+youPct+'%;background:linear-gradient(90deg,#f59e0b,#4ade80)"></div></div>' +
    '<div class="text-xs mb-1">'+target.name+'：'+fmtMoney(targetW)+'</div>' +
    '<div class="h-6 bg-slate-800 rounded-full overflow-hidden mb-4">' +
      '<div class="h-full rounded-full transition-all duration-1000" style="width:'+npcPct+'%;background:linear-gradient(90deg,#6366f1,#a78bfa)"></div></div>';

  /* NPC关系总结 */
  html += '<div class="text-left">';
  G.eraData.npcTargets.forEach(function(npcId) {
    var npc = NPCS[npcId];
    var rel = G.npcRelations[npcId] || 0;
    var relLabel = rel >= 50 ? '导师' : (rel >= 20 ? '好友' : (rel >= 0 ? '认识' : (rel >= -20 ? '对手' : '宿敌')));
    var relCol = rel > 0 ? '#4ade80' : (rel < 0 ? '#ef4444' : '#94a3b8');
    var npcIcon = NPC_ICONS[npcId] || 'fa-user';
    html += '<div class="flex justify-between py-2 border-b border-slate-700/50 text-sm">' +
      '<span><i class="fas '+npcIcon+' mr-2" style="color:'+(NPC_COLORS[npcId]||'#f59e0b')+'"></i>'+npc.name+'</span>' +
      '<span style="color:'+relCol+'">'+relLabel+'（'+(rel>0?'+':'')+rel+'）</span></div>';
  });
  html += '</div></div>';

  /* 传记 */
  html += '<div class="neon-card rounded-xl p-5 bg-cyber-card/80 mb-6">' +
    '<div class="text-amber-400 font-bold mb-3"><i class="fas fa-book mr-2"></i>'+playerName+'的一生</div>' +
    '<div class="text-sm text-cyber-muted leading-relaxed">'+bio+'</div></div>';

  /* 重新开始 */
  html += '<button onclick="restartGame()" class="glow-btn w-full py-4 rounded-xl text-lg font-bold bg-gradient-to-r from-amber-500 to-green-400 text-gray-900">' +
    '<i class="fas fa-redo mr-2"></i>再来一次</button>';

  endScreen.innerHTML = html;
}

// 生成传记
function generateBiography(endCheck) {
  var lines = [];
  lines.push(playerName+'出生于'+G.eraData.startYear+'年的'+G.locData.name+G.subLoc+'。');
  lines.push('那是一个'+G.eraData.subtitle+'，'+G.eraData.desc.replace('。','')+'。');

  if (G.history.length > 0) {
    lines.push('在'+G.peakAge+'岁时，'+playerName+'的财富达到了巅峰——'+fmtMoney(G.maxNetWorth)+'。');
  }

  /* NPC 关系故事 */
  var relStory = [];
  G.eraData.npcTargets.forEach(function(npcId) {
    var npc = NPCS[npcId];
    var rel = G.npcRelations[npcId] || 0;
    if (rel >= 50) {
      relStory.push(npc.name+'成为了'+playerName+'的导师和盟友，"'+npc.quote+'"——这句话深刻影响了'+playerName+'的投资哲学。');
    } else if (rel >= 20) {
      relStory.push(playerName+'与'+npc.name+'建立了良好的合作关系。'+npc.name+'曾评价说："' + npc.quote + '"');
    } else if (rel <= -20) {
      relStory.push(npc.name+'与'+playerName+'成为了宿敌。两人之间的较量贯穿了整个时代。');
    }
  });
  if (relStory.length > 0) lines.push(relStory[Math.floor(Math.random() * relStory.length)]);

  /* 结局描述 */
  if (endCheck.win) {
    lines.push('最终，'+playerName+'超越了'+getEraTargetNPC().name+'，成为了人类历史上最富有的人。');
    lines.push('这是一个关于勇气、智慧和坚持的故事。'+playerName+'证明了——在这个充满机遇和挑战的世界里，任何人都有可能改写命运。');
  } else {
    if (getTotalWealth() <= 0) {
      lines.push('在商业的浪潮中，'+playerName+'最终失去了所有财富。但也许，这段旅程本身就是一种财富。');
    } else if (G.reputation <= 0) {
      lines.push(playerName+'积累了不少财富，但名誉的崩塌让一切化为乌有。商场上没有永远的朋友，只有永远的利益。');
    } else {
      lines.push(playerName+'最终拥有了'+fmtMoney(getTotalWealth())+'的财富。虽然没有超越'+getEraTargetNPC().name+'，但这一生的冒险，本身就是一段传奇。');
    }
  }

  return lines.join('<br><br>');
}

// 重新开始
function restartGame() {
  G = null;
  selLoc = null; selEra = null; selSub = null;
  document.getElementById('end-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('start-screen').classList.remove('hidden');
  document.getElementById('player-name').value = '无名氏';
  document.getElementById('fate-preview').classList.add('hidden');
  document.querySelectorAll('.sel-card-active').forEach(function(c){c.classList.remove('sel-card-active')});
  initStartScreen();
}

// 初始化
initStartScreen();
</script>
