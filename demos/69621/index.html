<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吃什么 · 今天我们来决定</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --c-bg:#1a1411;
            --c-bg2:#261b15;
            --c-cream:#fff4d8;
            --c-gold:#ffb84d;
            --c-gold-soft:#ffd58a;
            --c-tomato:#ff6b4a;
            --c-tomato-soft:#ff9c7a;
            --c-sage:#7fbf7b;
            --c-sage-soft:#bfe0bb;
            --c-basil:#5ec27f;
            --c-ink:#3a2b24;
            --c-paper:#ffeecb;
            --c-paper-dark:#f3dba8;
            --c-chili:#e84a5f;
            --c-noodle:#ffd18c;
            --c-steam:radial-gradient(circle at 30% 20%,rgba(255,255,255,.18),transparent 60%),
                        radial-gradient(circle at 70% 80%,rgba(255,184,77,.25),transparent 55%),
                        radial-gradient(circle at 50% 50%,rgba(232,74,95,.15),transparent 60%),
                        linear-gradient(180deg,#1a1411 0%,#261b15 60%,#332116 100%);
            --shadow:0 16px 40px rgba(0,0,0,.45),0 2px 0 rgba(0,0,0,.2) inset;
            --radius:20px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%}
        body{
            font-family:'Noto Sans SC',system-ui,-apple-system,sans-serif;
            color:var(--c-cream);
            background:var(--c-bg);
            overflow-x:hidden;
            -webkit-font-smoothing:antialiased;
        }
        .bg-layer{
            position:fixed;inset:0;z-index:0;
            background:var(--c-steam);
        }
        .bg-layer::before{
            content:'';position:absolute;inset:0;
            background:
                radial-gradient(circle at 12% 20%,rgba(255,184,77,.10),transparent 40%),
                radial-gradient(circle at 82% 70%,rgba(232,74,95,.10),transparent 45%),
                radial-gradient(circle at 50% 100%,rgba(94,194,127,.08),transparent 50%);
        }
        .steam-particle{
            position:absolute;left:var(--x);top:var(--y);
            width:6px;height:6px;border-radius:50%;
            background:rgba(255,255,255,.25);
            filter:blur(2px);
            animation:steam var(--d) linear infinite;
            animation-duration:var(--dur);
            animation-delay:var(--delay);
        }
        @keyframes steam{
            0%{transform:translateY(0) scale(1);opacity:0}
            15%{opacity:.6}
            100%{transform:translateY(-260px) scale(3.2);opacity:0}
        }

        .app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

        header.topbar{
            display:flex;align-items:center;justify-content:space-between;
            padding:22px 32px 14px;max-width:1200px;margin:0 auto;width:100%;
        }
        .logo{
            display:flex;align-items:center;gap:14px;
            font-family:'ZCOOL KuaiLe','Noto Sans SC';
            font-size:30px;letter-spacing:3px;
            background:linear-gradient(135deg,var(--c-gold),var(--c-tomato));
            -webkit-background-clip:text;background-clip:text;color:transparent;
            text-shadow:none;
        }
        .logo .bowl{
            font-size:40px;line-height:1;
            filter:drop-shadow(0 4px 8px rgba(255,184,77,.4));
            animation:wiggle 3.6s ease-in-out infinite;
        }
        @keyframes wiggle{
            0%,100%{transform:rotate(-4deg)}
            50%{transform:rotate(4deg)}
        }
        .header-actions{display:flex;gap:10px;align-items:center}
        .chip{
            padding:7px 14px;border-radius:999px;border:1px solid rgba(255,244,216,.15);
            background:rgba(255,255,255,.04);font-size:12px;color:rgba(255,244,216,.75);
            font-weight:500;letter-spacing:1px;
            display:inline-flex;align-items:center;gap:6px;
        }
        .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c-sage);box-shadow:0 0 10px var(--c-sage)}

        .hero{
            padding:18px 32px 28px;max-width:1200px;margin:0 auto;width:100%;
            display:grid;grid-template-columns:1.2fr 1fr;gap:28px;
            align-items:center;
        }
        .hero-title{font-family:'ZCOOL KuaiLe','Noto Sans SC';font-size:clamp(34px,6vw,68px);line-height:1.05;letter-spacing:1px}
        .hero-title .line1{display:block;background:linear-gradient(135deg,var(--c-gold) 0%,var(--c-tomato) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
        .hero-title .line2{display:block;font-size:.5em;color:rgba(255,244,216,.7);font-weight:300;letter-spacing:5px}
        .hero-sub{margin-top:18px;color:rgba(255,244,216,.72);font-size:15px;line-height:1.8;max-width:520px}
        .hero-sub strong{color:var(--c-gold-soft)}

        .hero-wheel{
            position:relative;aspect-ratio:1;width:100%;max-width:380px;margin:0 auto;
        }
        .plate{
            position:absolute;inset:0;border-radius:50%;
            background:
                radial-gradient(circle at 50% 50%,#f6e1b6 0%,#d7b075 55%,#a16b33 100%);
            box-shadow:0 30px 60px rgba(0,0,0,.6),inset 0 -14px 30px rgba(120,60,20,.55),inset 0 8px 20px rgba(255,255,255,.35);
            border:8px solid #915e2b;
        }
        .plate::before{
            content:'';position:absolute;inset:12px;border-radius:50%;
            background:conic-gradient(from 0deg,var(--c-tomato),var(--c-gold),var(--c-sage),var(--c-gold),var(--c-tomato));
            opacity:.08;mix-blend-mode:screen;
        }
        .dish-icons{
            position:absolute;inset:0;
            animation:spin 28s linear infinite;
        }
        @keyframes spin{to{transform:rotate(360deg)}}
        .dish-icon{
            position:absolute;left:50%;top:50%;
            width:46px;height:46px;border-radius:50%;
            transform:translate(-50%,-50%) rotate(var(--r)) translateY(-130px) rotate(calc(-1 * var(--r)));
            display:flex;align-items:center;justify-content:center;font-size:22px;
            background:var(--c-paper);box-shadow:0 6px 14px rgba(0,0,0,.35);
            border:2px solid var(--c-paper-dark);
            transition:transform .4s cubic-bezier(.2,.8,.3,1.4);
        }
        .dish-icon:hover{transform:translate(-50%,-50%) rotate(var(--r)) translateY(-130px) rotate(calc(-1 * var(--r))) scale(1.25) }
        .center-press{
            position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
            width:140px;height:140px;border-radius:50%;
            background:
                radial-gradient(circle at 50% 30%,#fff 0%,var(--c-gold-soft) 40%,var(--c-gold) 80%,#e5881f 100%);
            display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
            cursor:pointer;user-select:none;
            box-shadow:0 20px 40px rgba(0,0,0,.5),inset 0 -8px 18px rgba(200,100,20,.5),inset 0 6px 14px rgba(255,255,255,.5);
            color:#7a3a00;
            font-family:'ZCOOL KuaiLe','Noto Sans SC';
            font-size:22px;letter-spacing:2px;
            transition:transform .25s cubic-bezier(.2,.8,.3,1.4),box-shadow .25s;
            overflow:hidden;
        }
        .center-press span{font-size:42px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));}
        .center-press:hover{transform:translate(-50%,-50%) scale(1.08);box-shadow:0 26px 60px rgba(0,0,0,.6)}
        .center-press:active{transform:translate(-50%,-50%) scale(.95)}
        .center-press.shaking{animation:shake .55s cubic-bezier(.36,.07,.5,.9) 2}
        @keyframes shake{
            0%,100%{transform:translate(-50%,-50%) rotate(0) scale(1.05)}
            25%{transform:translate(-52%,-50%) rotate(-10deg) scale(1.08)}
            75%{transform:translate(-48%,-50%) rotate(10deg) scale(1.08)}
        }

        .main{
            padding:10px 32px 60px;max-width:1200px;margin:0 auto;width:100%;
            display:flex;flex-direction:column;gap:28px;
        }

        .controls{
            background:rgba(255,244,216,.04);
            border:1px solid rgba(255,244,216,.08);
            border-radius:var(--radius);
            padding:20px 24px;
            display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between;
        }
        .ctrl-group{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
        .ctrl-label{font-size:12px;color:rgba(255,244,216,.55);letter-spacing:2px;font-weight:500;margin-right:4px}
        .pill{
            padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:1px;
            border:1.5px solid rgba(255,244,216,.12);background:rgba(255,255,255,.03);
            color:rgba(255,244,216,.78);cursor:pointer;transition:all .2s ease;
            font-family:inherit;
        }
        .pill:hover{border-color:rgba(255,244,216,.3);transform:translateY(-1px)}
        .pill.on{
            background:linear-gradient(135deg,var(--c-gold),var(--c-tomato));
            color:#3a1a00;border-color:transparent;font-weight:700;box-shadow:0 6px 18px rgba(255,184,77,.4)
        }
        .pill.emoji{padding-left:12px}
        .price-range{display:flex;align-items:center;gap:10px;color:rgba(255,244,216,.7)}
        .price-range input[type=range]{accent-color:var(--c-gold);width:140px}
        .btn-primary{
            padding:11px 24px;border-radius:999px;border:none;cursor:pointer;font-weight:700;font-size:14px;letter-spacing:2px;
            background:linear-gradient(135deg,var(--c-tomato),var(--c-chili));
            color:#fff;box-shadow:0 8px 22px rgba(232,74,95,.5);font-family:inherit;transition:transform .2s;
        }
        .btn-primary:hover{transform:translateY(-2px) scale(1.02)}
        .btn-primary:active{transform:scale(.97)}
        .btn-ghost{
            padding:10px 20px;border-radius:999px;border:1.5px solid rgba(255,244,216,.18);background:transparent;
            color:rgba(255,244,216,.8);font-size:13px;font-weight:500;letter-spacing:1px;cursor:pointer;font-family:inherit;transition:all .2s;
        }
        .btn-ghost:hover{background:rgba(255,255,255,.05);border-color:rgba(255,244,216,.4)}

        .recommend-card{
            position:relative;overflow:hidden;
            background:
                linear-gradient(160deg,#2a1d14 0%,#3a2a1c 60%,#4d3622 100%);
            border-radius:28px;
            border:1px solid rgba(255,244,216,.08);
            padding:30px 34px;
            box-shadow:var(--shadow);
            display:grid;grid-template-columns:1fr 1.2fr;gap:30px;align-items:start;
            animation:reveal .7s cubic-bezier(.2,.8,.2,1);
        }
        @keyframes reveal{
            from{opacity:0;transform:translateY(24px) scale(.98)}
            to{opacity:1;transform:translateY(0) scale(1)}
        }
        .recommend-card.hidden{display:none}
        .dish-cover{
            position:relative;aspect-ratio:1;border-radius:22px;overflow:hidden;
            background:linear-gradient(145deg,#6b3a1a,#c26a2f);
            display:flex;align-items:center;justify-content:center;font-size:88px;
            box-shadow:inset 0 -20px 40px rgba(0,0,0,.5),inset 0 10px 20px rgba(255,255,255,.18);
            border:2px solid rgba(255,244,216,.1);
        }
        .dish-cover::before,.dish-cover::after{
            content:'';position:absolute;left:50%;background:rgba(255,255,255,.22);border-radius:50%;filter:blur(4px);
            animation:drift 4s ease-in-out infinite;
        }
        .dish-cover::before{top:10%;width:40px;height:20px;transform:translateX(-50%)}
        .dish-cover::after{bottom:15%;width:50px;height:22px;transform:translateX(-50%);animation-delay:.8s}
        @keyframes drift{0%,100%{opacity:.3;transform:translateX(-50%) translateY(0)}50%{opacity:.7;transform:translateX(-50%) translateY(-10px)}}

        .dish-meta{display:flex;flex-direction:column;gap:12px}
        .dish-header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
        .dish-title{font-family:'ZCOOL KuaiLe','Noto Sans SC';font-size:clamp(26px,4vw,40px);letter-spacing:2px}
        .dish-title small{display:block;font-family:'Noto Sans SC';font-size:12px;color:rgba(255,244,216,.5);letter-spacing:3px;font-weight:300;margin-top:4px}
        .tag-row{display:flex;gap:8px;flex-wrap:wrap}
        .tag{padding:5px 12px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:2px}
        .tag.price{background:rgba(255,184,77,.18);color:var(--c-gold-soft);border:1px solid rgba(255,184,77,.3)}
        .tag.calories{background:rgba(94,194,127,.15);color:var(--c-sage-soft);border:1px solid rgba(94,194,127,.3)}
        .tag.time{background:rgba(255,107,74,.15);color:var(--c-tomato-soft);border:1px solid rgba(255,107,74,.3)}
        .tag.diff{background:rgba(232,74,95,.12);color:#ff9cb0;border:1px solid rgba(232,74,95,.3)}
        .tag.mode{background:rgba(180,160,220,.15);color:#cfb8e6;border:1px solid rgba(180,160,220,.3)}

        .tab-bar{display:flex;gap:6px;margin-top:6px;padding:6px;background:rgba(0,0,0,.25);border-radius:14px;align-items:center}
        .tab{padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;letter-spacing:1px;cursor:pointer;
              color:rgba(255,244,216,.65);border:1px solid transparent;transition:all .2s;font-family:inherit;background:transparent}
        .tab:hover{color:rgba(255,244,216,.9)}
        .tab.active{background:rgba(255,244,216,.08);color:var(--c-gold-soft);border-color:rgba(255,184,77,.25);box-shadow:inset 0 0 0 1px rgba(255,244,216,.05)}

        .panel{animation:fadeUp .45s ease;min-height:240px}
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

        .recipe-table{width:100%;border-collapse:separate;border-spacing:0}
        .recipe-table th,.recipe-table td{padding:10px 14px;font-size:13px;text-align:left;vertical-align:middle;border-bottom:1px solid rgba(255,244,216,.06)}
        .recipe-table th{color:rgba(255,244,216,.5);font-weight:500;letter-spacing:2px;font-size:11px;text-transform:uppercase}
        .recipe-table td.num{color:var(--c-gold-soft);font-weight:600;min-width:90px}
        .recipe-table td.name{color:rgba(255,244,216,.95)}
        .recipe-table tr:last-child td{border-bottom:none}

        .step-list{list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:step}
        .step-list li{
            position:relative;padding:14px 16px 14px 56px;font-size:14px;line-height:1.7;
            background:rgba(0,0,0,.25);border-radius:12px;
            border-left:3px solid var(--c-tomato);
        }
        .step-list li::before{
            counter-increment:step;content:counter(step);
            position:absolute;left:14px;top:14px;width:28px;height:28px;border-radius:50%;
            background:linear-gradient(135deg,var(--c-tomato),var(--c-chili));
            color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;font-family:'ZCOOL KuaiLe','Noto Sans SC';
        }
        .step-list li strong{color:var(--c-gold-soft)}

        .heat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
        .heat-cell{padding:12px 14px;background:rgba(0,0,0,.25);border-radius:12px;border:1px solid rgba(255,244,216,.05)}
        .heat-cell h4{font-size:11px;color:rgba(255,244,216,.5);letter-spacing:2px;font-weight:500;margin-bottom:4px;text-transform:uppercase}
        .heat-cell .v{font-size:18px;font-weight:900;font-family:'ZCOOL KuaiLe','Noto Sans SC'}
        .heat-cell.low .v{color:#7ab8ff}
        .heat-cell.medium .v{color:var(--c-gold-soft)}
        .heat-cell.high .v{color:var(--c-tomato-soft)}

        .tips-box{
            padding:14px 18px;background:linear-gradient(135deg,rgba(127,191,123,.12),rgba(255,184,77,.08));
            border:1px solid rgba(127,191,123,.25);border-radius:14px;font-size:13px;line-height:1.8;color:rgba(255,244,216,.85);
        }
        .tips-box h4{font-size:12px;color:var(--c-sage-soft);letter-spacing:2px;font-weight:700;margin-bottom:6px;text-transform:uppercase}
        .tips-box ul{padding-left:18px}
        .tips-box li{margin:2px 0}

        .takeout{display:flex;flex-direction:column;gap:12px}
        .takeout-store{
            padding:16px 18px;background:rgba(255,244,216,.05);border-radius:14px;border:1px solid rgba(255,244,216,.08);
            display:flex;justify-content:space-between;gap:10px;align-items:center;
        }
        .takeout-store .sname{font-weight:700;color:rgba(255,244,216,.95);font-size:15px}
        .takeout-store .smeta{font-size:12px;color:rgba(255,244,216,.6);margin-top:2px;letter-spacing:1px}
        .takeout-store .btn-ghost{padding:7px 14px;font-size:12px}

        .cards-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
        .mini-card{
            background:rgba(255,244,216,.04);border:1px solid rgba(255,244,216,.08);border-radius:16px;padding:16px;
            cursor:pointer;transition:all .25s;position:relative;overflow:hidden;
        }
        .mini-card::before{content:'✨';position:absolute;right:-8px;top:-10px;font-size:42px;opacity:.08;transform:rotate(20deg)}
        .mini-card:hover{transform:translateY(-4px);border-color:rgba(255,184,77,.4);box-shadow:0 18px 40px rgba(0,0,0,.5)}
        .mini-card .e{font-size:42px;line-height:1}
        .mini-card .n{font-weight:700;font-size:16px;margin-top:6px;color:rgba(255,244,216,.95);letter-spacing:1px}
        .mini-card .d{font-size:12px;color:rgba(255,244,216,.6);line-height:1.7;margin-top:4px}
        .mini-card .p{font-size:12px;color:var(--c-gold-soft);font-weight:700;margin-top:8px;letter-spacing:1px}

        .empty{
            text-align:center;padding:60px 20px;color:rgba(255,244,216,.5);font-size:16px;letter-spacing:2px;line-height:1.8;
        }
        .empty .big{font-size:56px;display:block;margin-bottom:12px;animation:wiggle 3s ease-in-out infinite}

        .history{display:flex;gap:10px;flex-wrap:wrap}
        .history .pill{font-size:12px;padding:6px 12px}

        .footer{
            padding:26px 32px 40px;text-align:center;color:rgba(255,244,216,.4);font-size:12px;letter-spacing:3px;font-weight:500;line-height:1.8;
        }
        .footer a{color:rgba(255,184,77,.7);text-decoration:none}
        .footer a:hover{color:var(--c-gold-soft)}

        @media (max-width:860px){
            .hero{grid-template-columns:1fr;text-align:center}
            .hero-title{letter-spacing:2px}
            .hero-wheel{max-width:300px;margin:16px auto 0}
            .hero-sub{margin:14px auto 0}
            .recommend-card{grid-template-columns:1fr}
            .controls{flex-direction:column;align-items:flex-start}
            .heat-grid{grid-template-columns:1fr 1fr}
            header.topbar{padding:16px 18px}
            .main{padding:12px 18px 40px}
        }
        @media (max-width:460px){
            .logo{font-size:22px}.logo .bowl{font-size:30px}
            .heat-grid{grid-template-columns:1fr}
            .dish-icons{animation:none}.dish-icon{--r:0 !important;transform:translate(-50%,-50%) translateY(0);position:relative;width:42px;height:42px}
            .dish-icon{top:auto;left:auto;position:relative}
        }

        /* fancy accent line */
        .accent-line{height:3px;width:60px;background:linear-gradient(90deg,var(--c-tomato),var(--c-gold),var(--c-sage));border-radius:3px;margin:14px 0}

        /* scrollbar */
        ::-webkit-scrollbar{width:10px}
        ::-webkit-scrollbar-track{background:#1a1411}
        ::-webkit-scrollbar-thumb{background:#4a3222;border-radius:10px}
        ::-webkit-scrollbar-thumb:hover{background:#6b4529}

        .toast{
            position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(30px);
            background:linear-gradient(135deg,#2a1d14,#3a2a1c);
            color:rgba(255,244,216,.9);padding:12px 24px;border-radius:999px;
            border:1px solid rgba(255,244,216,.1);box-shadow:var(--shadow);
            font-size:13px;letter-spacing:1px;font-weight:500;
            opacity:0;pointer-events:none;
            transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s;
            z-index:200;
        }
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

        /* ===== 食格测试 Modal ===== */
        .modal-overlay{
            position:fixed;inset:0;z-index:300;
            background:rgba(0,0,0,.72);
            display:flex;align-items:center;justify-content:center;
            animation:fadeIn .3s ease;
            backdrop-filter:blur(6px);
        }
        .modal-overlay.hidden{display:none}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .modal-card{
            position:relative;width:min(520px,92vw);max-height:85vh;overflow-y:auto;
            background:linear-gradient(160deg,#2a1d14 0%,#3a2a1c 60%,#4d3622 100%);
            border-radius:24px;border:1px solid rgba(255,244,216,.12);
            box-shadow:0 24px 64px rgba(0,0,0,.6),0 0 0 1px rgba(255,244,216,.06) inset;
            padding:36px 32px 32px;animation:scaleIn .35s cubic-bezier(.2,.8,.2,1);
        }
        @keyframes scaleIn{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .modal-close{
            position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;
            border:1px solid rgba(255,244,216,.12);background:rgba(0,0,0,.3);
            color:rgba(255,244,216,.6);font-size:18px;cursor:pointer;
            display:flex;align-items:center;justify-content:center;transition:all .2s;
        }

let testAnswers=[];
let testStep=0; // 0=welcome, 1-6=questions, 7=result

function openTest(){
    testAnswers=[];
    testStep=0;
    $("testModal").classList.remove("hidden");
    renderTestWelcome();
}

function closeTest(){
    $("testModal").classList.add("hidden");
    testAnswers=[];
    testStep=0;
}

function renderTestWelcome(){
    testStep=0;
    $("testContent").innerHTML=`
        <div class="test-welcome">
            <span class="big-emoji">🧪</span>
            <h2>食格测试</h2>
            <p>6 道选择题，帮你找到内心深处真正想吃的味道。<br>像 MBTI 一样，测出你的 <b style="color:var(--c-gold-soft)">饮食人格</b>！</p>
            <button class="btn-start" onclick="startTest()">✨ 开始测试</button>
        </div>`;
}

function startTest(){
    testAnswers=[];
    testStep=1;
    renderQuestion(0);
}

function renderQuestion(idx){
    if(idx>=TEST_QUESTIONS.length){
        showResult();
        return;
    }
    testStep=idx+1;
    const q=TEST_QUESTIONS[idx];
    const pct=Math.round((idx/TEST_QUESTIONS.length)*100);
    let html=`
        <div class="test-progress-wrap">
            <div class="test-progress-bar"><div class="test-progress-fill" style="width:${pct}%"></div></div>
            <div class="test-progress-num">${idx+1}/${TEST_QUESTIONS.length}</div>
        </div>
        <div class="test-question">${q.q}</div>
        <div class="test-options">`;
    const letters=["A","B","C"];
    q.options.forEach((opt,i)=>{
        html+=`<button class="test-option" onclick="selectAnswer(${idx},${i},this)"><span class="opt-letter">${letters[i]}</span>${opt.text}</button>`;
    });
    html+=`</div>`;
    $("testContent").innerHTML=html;
}

function selectAnswer(qIdx,optIdx,el){
    testAnswers[qIdx]=optIdx;
    el.classList.add("picked");
    setTimeout(()=>{
        if(qIdx+1<TEST_QUESTIONS.length){
            renderQuestion(qIdx+1);
        }else{
            showResult();
        }
    },350);
}

function scoreDish(dish,answers){
    let score=0;
    answers.forEach((optIdx,qi)=>{
        if(optIdx===undefined) return;
        const rules=TEST_QUESTIONS[qi].options[optIdx].scores;
        if(rules.taste && rules.taste.includes(dish.taste)) score+=3;
        if(rules.mode && rules.mode.includes(dish.mode)) score+=3;
        if(rules.price && dish.price>=rules.price[0] && dish.price<=rules.price[1]) score+=2;
        if(rules.time && dish.time>=rules.time[0] && dish.time<=rules.time[1]) score+=2;
        if(rules.calories && dish.calories>=rules.calories[0] && dish.calories<=rules.calories[1]) score+=1;
        if(rules.tags && (dish.tags||[]).some(t=>rules.tags.includes(t))) score+=2;
        if(rules.difficulty && rules.difficulty.includes(dish.difficulty)) score+=1;
    });
    return score;
}

function getPersonality(answers){
    const counts=[0,0,0]; // A, B, C
    answers.forEach(a=>{ if(a!==undefined) counts[a]++; });
    const maxVal=Math.max(...counts);
    const maxIdx=counts.indexOf(maxVal);
    if(maxVal>=4) return TEST_PERSONALITIES[maxIdx];
    return TEST_PERSONALITIES[3]; // 随心派
}

function showResult(){
    testStep=7;
    const persona=getPersonality(testAnswers);
    const scored=DISHES.map(d=>({dish:d,score:scoreDish(d,testAnswers)}));
    scored.sort((a,b)=>b.score-a.score);
    const top3=scored.slice(0,3);
    const badges=["top1","top2","top3"];
    const badgeLabels=["🏆 最佳匹配","🥈 第二推荐","🥉 第三推荐"];
    let html=`
        <div class="test-result">
            <span class="persona-emoji">${persona.emoji}</span>
            <div class="persona-name">${persona.name}</div>
            <div class="persona-desc">${persona.desc}</div>
            <div class="result-dishes">`;
    top3.forEach((item,i)=>{
        const d=item.dish;
        html+=`
            <div class="result-dish" onclick="pickTestDish('${d.name}')">
                <span class="rd-emoji">${d.cover||d.emoji}</span>
                <div class="rd-info">
                    <div class="rd-name">${d.name}<span class="rd-badge ${badges[i]}">${badgeLabels[i]}</span></div>
                    <div class="rd-meta">${d.taste} · ¥${d.price} · ${d.time}分钟 · ${d.mode==="cook"?"自己做":"外卖"}</div>
                </div>
                <div class="rd-score">匹配 ${item.score} 分</div>
            </div>`;
    });
    html+=`</div>
        <button class="test-retry" onclick="startTest()">🔄 再测一次</button>
        <button class="test-retry" onclick="closeTest()" style="margin-left:8px">✕ 关闭</button>
        </div>`;
    $("testContent").innerHTML=html;
}

function pickTestDish(name){
    const dish=DISHES.find(d=>d.name===name);
    if(dish){
        showDish(dish);
        closeTest();
    }
}

function init(){

function buildTasteGroup(){
    const g=$("tasteGroup");g.innerHTML="";

        b.className="pill emoji"+(i===0?" on":"");

function buildDishIcons(){
    const w=$("dishIcons");w.innerHTML="";

function spawnSteam(){
    const bg=document.querySelector(".bg-layer");
    const x=Math.random()*100;
    const dur=4+Math.random()*5;
    const delay=Math.random()*dur;
    const s=document.createElement("div");
    s.className="steam-particle";
    s.style.setProperty("--x",x+"%");
    s.style.setProperty("--y","100%");
    s.style.setProperty("--dur",dur+"s");
    s.style.setProperty("--delay",delay+"s");
    bg.appendChild(s);
    setTimeout(()=>s.remove(),(dur+delay)*1000+200);
}

function updatePriceLabel(){
    const v=parseInt($("priceRange").value);
    state.priceMax=v;
    $("priceLabel").textContent=v>=120?"不限":"¥"+v+"以内";
}

function setMode(mode,el){
    state.mode=mode;
    document.querySelectorAll('#main .ctrl-group .pill[data-mode]').forEach(p=>p.classList.remove("on"));
    if(el) el.classList.add("on");
}

function filtered(){
    return DISHES.filter(d=>{
        if(state.mode==="cook" && d.mode==="takeout") return false;
        if(state.mode==="takeout" && d.mode==="cook") return false;
        if(d.price>state.priceMax) return false;
        if(state.taste!=="all" && d.taste!==state.taste && !(d.tags||[]).includes(state.taste)) return false;
        return true;
    });
}

function pickDish(arr){
    if(arr.length===0) return null;
    if(arr.length===1) return arr[0];
    let idx;
    do{ idx=Math.floor(Math.random()*arr.length); }while(idx===state.lastIdx && arr.length>1);
    state.lastIdx=idx;
    return arr[idx];
}

function randomAll(mode){
    if(mode) state.mode=mode;
    const arr=filtered();
    if(arr.length===0){
        showToast("当前条件下没找到，试试放宽口味或预算 🥲");
        return;
    }
    const press=$("centerPress");
    press.classList.add("shaking");
    setTimeout(()=>press.classList.remove("shaking"),1200);
    setTimeout(()=>{
        const dish=pickDish(arr);
        showDish(dish);
    },350);
}

function randomAgain(){
    const arr=filtered();
    if(arr.length<=1){ showToast("都被你选完啦！"); return; }
    let dish;
    do{ dish=pickDish(arr); }while(dish && dish.name===state.currentDish?.name && arr.length>1);
    if(dish) showDish(dish);
}

function showDish(dish){
    state.currentDish=dish;
    $("recommendCard").classList.remove("hidden");
    $("dishCover").textContent=dish.cover||dish.emoji;
    $("dishName").innerHTML=dish.name+"<small>"+dish.taste+" · "+(dish.mode==="cook"?"自己做":"外卖")+"</small>";

        `<span class="tag calories">🔥 ${dish.calories} kcal</span>`+
        `<span class="tag time">⏱ ${dish.time}分钟</span>`+
        `<span class="tag diff">难度 ${dish.difficulty}</span>`+
        `<span class="tag mode">${dish.mode==="cook"?"👨‍🍳 自己做":"🛵 外卖选"}</span>`;
    if(!state.history.includes(dish.name)){
        state.history.unshift(dish.name);
        state.history=state.history.slice(0,8);
        try{localStorage.setItem("fav_history",JSON.stringify(state.history));}catch(e){}

    state.currentTab="recipe";

function estimatePrice(d){
    const impMap={
        "牛肉":40,"牛肉末":40,"五花肉":32,"鸡肉":20,"鸡腿":14,"鸡翅中":18,"虾仁":45,"鸡蛋":12,
        "番茄":6,"土豆":4,"黄瓜":4,"青椒":6,"青辣椒":6,"白菜":4,"豆腐":5,"嫩豆腐":5,"皮蛋":8,
        "大米":6,"米饭":6,"面条":8,"意大利面":15,"吐司":10,"饺子":12,"螺蛳粉":14,
        "可乐":6,"老抽":5,"生抽":5,"冰糖":4,"糖":3,"盐":1,"油":3,"姜":2,"葱":2,"八角":2,"桂皮":2,
        "黄焖鸡料包":8,"番茄酱":6,"豆豉":4,"豆瓣酱":6,"芝士":10,"牛奶":6,"帕玛森":20,"奶油":12,
        "萝卜":4,"蒜苗":3,"牛骨":15,"花生":5,"腐竹":6,"金针菇":8,"木耳":6,"丸子":15,
        "火腿肠":8,"香菇":6,"洋葱":4,"罗勒":6,"花椒":3,"干辣椒":3
    };
    let total=0;
    d.ingredients.forEach(row=>{
        const name=(row[0]||"").replace(/少量|可选|自带包/g,"").trim();
        let unitPrice=null;
        for(const k in impMap){ if(name.includes(k)||k.includes(name)){ unitPrice=impMap[k]; break; } }
        if(unitPrice===null){ total+=5; }else{ total+=Math.round(unitPrice*0.6); }
    });
    return Math.max(5,Math.round(total*0.9));
}

function buildCards(){
    const r=$("cardsRow");r.innerHTML="";
    const groups=[
        {label:"🌶 麻辣",key:"麻辣"},
        {label:"🥘 家常",key:"家常"},
        {label:"🥣 清淡",key:"清淡"},

        {label:"🍜 面",key:"面",tag:true},
        {label:"🥐 西式",key:"西式"}
    ];
    groups.forEach(g=>{
        const c=document.createElement("div");
        c.className="mini-card";
        const arr=g.tag?DISHES.filter(d=>(d.tags||[]).includes(g.key)):DISHES.filter(d=>d.taste===g.key);
        const sample=arr.slice(0,3).map(d=>d.emoji).join(" ");
        const n=arr.length;
        c.innerHTML=`<div class="e">${sample||"🍽"}</div>
                     <div class="n">${g.label} · ${n} 道</div>
                     <div class="d">${arr.slice(0,2).map(d=>d.name).join(" · ")}</div>

}

function showToast(msg){
    const t=$("toast");t.textContent=msg;t.classList.add("show");
    clearTimeout(showToast._tm);
    showToast._tm=setTimeout(()=>t.classList.remove("show"),2400);
}

function copyText(s){
    if(navigator.clipboard){
        navigator.clipboard.writeText(s).then(()=>showToast("已复制 📋 "+s));
    }else{
        const ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();
    }
}

init();
</script>
</body>
