          <span class="rec-dot"></span>
          <div class="rec-wave">
            <span></span><span></span><span></span><span></span>
          </div>
          <span>实时分析中</span>
        </div>
        <div class="hud-battery">
          <svg width="16" height="10" viewBox="0 0 16 10" fill="none" style="opacity:0.6;">
            <rect x="0.5" y="0.5" width="13" height="9" rx="1" stroke="currentColor" stroke-width="1"/>
            <rect x="2" y="2" width="8" height="6" rx="0.5" fill="currentColor"/>
            <rect x="14" y="3" width="2" height="4" rx="0.5" fill="currentColor"/>
          </svg>
          85%
        </div>
      </div>

      <!-- 中央人物焦点 -->
      <div class="hud-focus">
        <div class="focus-frame">
          <div class="focus-dots"><span></span><span></span><span></span></div>
        </div>
        <div class="person-info">
          <div class="person-name" id="person-name">--</div>
          <div class="person-role" id="person-role">--</div>
          <div class="emotion-tag neutral" id="emotion-tag">分析中...</div>
        </div>
      </div>

      <!-- 字幕 -->
      <div class="caption-area" id="caption-area">
        <div class="caption-bubble">
          <div class="caption-speaker" id="caption-speaker">--</div>
          <div id="caption-text" class="typing-cursor"></div>
        </div>
      </div>

      <!-- AI 建议 -->
      <div class="suggestion-area" id="suggestion-area">
        <div class="ai-thinking" id="ai-thinking">
          <span>AI 分析中</span>
          <span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
        <div class="ai-card" id="ai-card">
          <div class="ai-card-header">
            <div class="ai-icon">AI</div>
            <div class="ai-card-title" id="ai-card-title">沟通建议</div>
          </div>
          <div class="ai-card-body" id="ai-card-body"></div>
        </div>
      </div>

      <!-- 信号面板 -->
      <div class="hud-sidebar">
        <div class="signal-item">
          <div class="signal-ring" id="sig-voice">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M17 5v14M7 5v14M22 10v4M2 10v4"/>
            </svg>
          </div>
          <div class="signal-label">语音</div>
        </div>
        <div class="signal-item">
          <div class="signal-ring" id="sig-face">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/><path d="M8 15c1.5 2 4.5 2 6 0"/>
            </svg>
          </div>
          <div class="signal-label">表情</div>
        </div>
        <div class="signal-item">
          <div class="signal-ring" id="sig-context">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <div class="signal-label">语境</div>
        </div>
        <div class="signal-item">
          <div class="signal-ring" id="sig-pose">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="5" r="3"/><path d="M6 21v-4a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v4"/>
            </svg>
          </div>
          <div class="signal-label">姿态</div>
        </div>
      </div>

      <!-- 底部导航 -->
      <div class="hud-nav">
        <button class="nav-btn active" data-scene="0" onclick="app.switchScene(0)">面试</button>
        <button class="nav-btn" data-scene="1" onclick="app.switchScene(1)">销售</button>
        <button class="nav-btn" data-scene="2" onclick="app.switchScene(2)">职场</button>
        <button class="nav-control" onclick="app.togglePlay()" id="play-btn">⏸</button>
        <button class="nav-control" onclick="app.restartScene()">↺</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  const scenes = [
    {
      id: 'interview',
      title: '面试沟通',
      subtitle: '产品经理岗位 · 第一轮',
      sceneClass: 'scene-interview',
      personName: '面试官 · 王总监',
      personRole: '产品 VP',
      dialogues: [
        {
          type: 'dialogue',
          speaker: '面试官',
          text: '请先简单介绍一下你自己。',
          duration: 1800,
          emotion: { label: '观察中', class: 'neutral' },
          signals: ['voice', 'face'],
          signalText: '对方正在评估你的表达自信度'
        },
        {
          type: 'dialogue',
          speaker: '面试官',
          text: '你最大的缺点是什么？',
          duration: 2000,
          emotion: { label: '试探', class: 'testing' },
          signals: ['voice', 'face', 'context'],
          signalText: '压力测试问题，观察自我认知'
        },
        {
          type: 'ai-tip',
          title: '沟通建议',
          content: '诚实回答，但强调改进行动。避免"完美主义"等套话，展示真实反思能力。',
          style: 'tip',
          signals: ['context']
        },
        {
          type: 'dialogue',
          speaker: '面试官',
          text: '如果入职，你计划如何快速适应团队？',
          duration: 2200,
          emotion: { label: '感兴趣', class: 'positive' },
          signals: ['voice', 'face'],
          signalText: '对你有进一步了解的兴趣'
        },
        {
          type: 'dialogue',
          speaker: '面试官',
          text: '我们会综合评估后再联系你。',
          duration: 2500,
          emotion: { label: '保留', class: 'reserved' },
          signals: ['voice', 'face', 'context', 'pose'],
          signalText: '⚠️ 委婉表达，结果待定'
        },
        {
          type: 'ai-alert',
          title: '信号分析',
          content: '这句话可能是"还在比较其他候选人"的信号。建议主动询问反馈时间和后续流程。',
          style: 'alert',
          signals: ['context']
        }
      ]
    },
    {
      id: 'sales',
      title: '销售沟通',
      subtitle: '企业 SaaS 方案洽谈',
      sceneClass: 'scene-sales',
      personName: '客户 · 李总',
      personRole: 'CTO',
      dialogues: [
        {
          type: 'dialogue',
          speaker: '客户',
          text: '你们的方案我们看了，功能还不错。',
          duration: 2000,
          emotion: { label: '初步认可', class: 'positive' },
          signals: ['voice', 'face'],
          signalText: '开场缓和，但重点在后续'
        },
        {
          type: 'dialogue',
          speaker: '客户',
          text: '但是价格这块，比我们预期高了不少。',
          duration: 2200,
          emotion: { label: '犹豫', class: 'hesitant' },
          signals: ['voice', 'face', 'pose'],
          signalText: '核心异议出现：价格敏感度'
        },
        {
          type: 'ai-tip',
          title: '应对策略',
          content: '不要直接降价。先确认对方预算范围，再强调 ROI 和长期价值。',
          style: 'tip',
          signals: ['context']
        },
        {
          type: 'dialogue',
          speaker: '客户',
          text: '我回去和团队商量一下，下周给你答复。',
          duration: 2200,
          emotion: { label: '回避', class: 'reserved' },
          signals: ['voice', 'face', 'context', 'pose'],
          signalText: '⚠️ 可能是拖延或委婉拒绝'
        },
        {
          type: 'ai-alert',
          title: '关键信号',
          content: '"回去商量"如果没有明确时间节点，60% 概率是委婉拒绝。建议约定具体回复时间。',
          style: 'alert',
          signals: ['context']
        }
      ]
    },
    {
      id: 'workplace',
      title: '职场沟通',
      subtitle: '季度汇报 · 1v1',
      sceneClass: 'scene-workplace',
      personName: '直属领导 · 张经理',
      personRole: '研发总监',
      dialogues: [
        {
          type: 'dialogue',
          speaker: '领导',
          text: '这个季度你的产出不错，几个项目都按时交付了。',
          duration: 2200,
          emotion: { label: '认可', class: 'positive' },
          signals: ['voice', 'face'],
          signalText: '正面反馈，但注意后续转折'
        },
        {
          type: 'dialogue',
          speaker: '领导',
          text: '不过我觉得你在跨部门协作上，还可以更主动一些。',
          duration: 2400,
          emotion: { label: '转折', class: 'testing' },
          signals: ['voice', 'face', 'context'],
          signalText: '"不过"之后是重点：改进期望'
        },
        {
          type: 'ai-tip',
          title: '反馈应对',
          content: '接受并确认具体建议。可以问："您希望我在哪些方面更主动？我会调整。"',
          style: 'tip',
          signals: ['context']
        },
        {
          type: 'dialogue',
          speaker: '领导',
          text: '这个方案我觉得还可以再想想，你先放一放。',
          duration: 2200,
          emotion: { label: '保留', class: 'reserved' },
          signals: ['voice', 'face', 'context', 'pose'],
          signalText: '⚠️ 可能对方不认可或优先级调整'
        },
        {
          type: 'ai-alert',
          title: '潜在含义',
          content: '"先放一放"有多种可能：不认可、优先级低、或需要更充分的数据支持。建议确认真实原因。',
          style: 'alert',
          signals: ['context']
        }
      ]
    }
  ];

  const app = {
    currentScene: 0,
    dialogueIndex: 0,
    isPlaying: false,
    autoPlayTimer: null,
    typingTimer: null,
    elements: {},

    init() {
      this.elements = {
        welcome: document.getElementById('welcome-screen'),
        mainHud: document.getElementById('main-hud'),
        sceneLayer: document.getElementById('scene-layer'),
        time: document.getElementById('hud-time'),
        personName: document.getElementById('person-name'),
        personRole: document.getElementById('person-role'),
        emotionTag: document.getElementById('emotion-tag'),
        captionArea: document.getElementById('caption-area'),
        captionSpeaker: document.getElementById('caption-speaker'),
        captionText: document.getElementById('caption-text'),
        suggestionArea: document.getElementById('suggestion-area'),
        aiThinking: document.getElementById('ai-thinking'),
        aiCard: document.getElementById('ai-card'),
        aiCardTitle: document.getElementById('ai-card-title'),
        aiCardBody: document.getElementById('ai-card-body'),
        playBtn: document.getElementById('play-btn')
      };

      this.renderScenes();
      this.updateTime();
      setInterval(() => this.updateTime(), 1000);
    },

    renderScenes() {
      const layer = this.elements.sceneLayer;
      layer.innerHTML = '';
      scenes.forEach((scene, i) => {
        const div = document.createElement('div');
        div.className = `pov-scene ${scene.sceneClass}`;
        div.id = `scene-${i}`;
        if (i === 0) div.classList.add('active');

        const sceneElements = {
          'scene-interview': `
            <div class="window-glow"></div>
            <div class="person-glow"></div>
            <div class="table-shape"></div>
          `,
          'scene-sales': `
            <div class="person-glow"></div>
            <div class="table-shape"></div>
            <div class="coffee-steam"></div>
          `,
          'scene-workplace': `
            <div class="screen-glow"></div>
            <div class="person-glow"></div>
            <div class="table-shape"></div>
          `
        };

        div.innerHTML = sceneElements[scene.sceneClass] || '';
        layer.appendChild(div);
      });
    },

    start() {
      this.elements.welcome.classList.add('hidden');
      setTimeout(() => {
        this.elements.welcome.style.display = 'none';
        this.elements.mainHud.classList.add('active');
        this.loadScene(0);
      }, 800);
    },

    updateTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      this.elements.time.textContent = `${h}:${m}`;
    },

    loadScene(index) {
      this.stopAutoPlay();
      this.dialogueIndex = 0;

      // 切换场景显示
      document.querySelectorAll('.pov-scene').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });

      // 更新导航按钮
      document.querySelectorAll('.nav-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });

      const scene = scenes[index];
      this.currentScene = index;

      // 更新人物信息
      this.elements.personName.textContent = scene.personName;
      this.elements.personRole.textContent = scene.personRole;
      this.setEmotion('neutral', '分析中...');

      // 清空显示
      this.elements.captionArea.classList.remove('visible');
      this.elements.suggestionArea.classList.remove('visible');
      this.elements.captionText.textContent = '';
      this.resetSignals();

      // 开始播放
      this.isPlaying = true;
      this.updatePlayBtn();
      this.scheduleNext(800);
    },

    switchScene(index) {
      if (index === this.currentScene) return;
      this.loadScene(index);
    },

    restartScene() {
      this.loadScene(this.currentScene);
    },

    scheduleNext(delay) {
      this.clearTimers();
      if (!this.isPlaying) return;
      this.autoPlayTimer = setTimeout(() => this.playNext(), delay);
    },

    playNext() {
      const scene = scenes[this.currentScene];
      if (this.dialogueIndex >= scene.dialogues.length) {
        this.isPlaying = false;
        this.updatePlayBtn();
        return;
      }

      const item = scene.dialogues[this.dialogueIndex];
      this.dialogueIndex++;

      if (item.type === 'dialogue') {
        this.showDialogue(item);
      } else if (item.type === 'ai-tip' || item.type === 'ai-alert') {
        this.showAiCard(item);
      }
    },

    showDialogue(item) {
      // 更新信号
      this.updateSignals(item.signals || []);

      // 更新情绪
      this.setEmotion(item.emotion.class, item.emotion.label);

      // 显示字幕
      this.elements.captionSpeaker.textContent = item.speaker;
      this.elements.captionText.className = 'typing-cursor';
      this.elements.captionText.textContent = '';
      this.elements.captionArea.classList.add('visible');
      this.elements.suggestionArea.classList.remove('visible');

      // 打字效果
      const text = item.text;
      let i = 0;
      const speed = Math.max(30, item.duration / text.length);

      this.typingTimer = setInterval(() => {
        if (i < text.length) {
          this.elements.captionText.textContent += text[i];
          i++;
        } else {
          this.clearTimers();
          this.elements.captionText.classList.remove('typing-cursor');
          this.scheduleNext(1500);
        }
      }, speed);
    },

    showAiCard(item) {
      this.elements.captionArea.classList.remove('visible');
      this.elements.aiCard.className = 'ai-card ' + (item.style === 'alert' ? 'alert' : '');
      this.elements.aiCardTitle.textContent = item.title;
      this.elements.aiCardBody.textContent = '';
      this.elements.aiThinking.style.display = 'flex';
      this.elements.suggestionArea.classList.add('visible');

      this.updateSignals(item.signals || []);

      // 模拟思考延迟
      setTimeout(() => {
        this.elements.aiThinking.style.display = 'none';
        this.elements.aiCardBody.textContent = item.content;
        if (this.isPlaying) {
          this.scheduleNext(3000);
        }
      }, 1200);
    },

    setEmotion(cls, label) {
      const tag = this.elements.emotionTag;
      tag.className = 'emotion-tag ' + cls;
      tag.textContent = label;
    },

    updateSignals(activeSignals) {
      const ids = { voice: 'sig-voice', face: 'sig-face', context: 'sig-context', pose: 'sig-pose' };
      Object.values(ids).forEach(id => {
        const el = document.getElementById(id);
        el.classList.remove('active', 'alert');
      });
      activeSignals.forEach(sig => {
        const el = document.getElementById(ids[sig]);
        if (el) el.classList.add('active');
      });
    },

    resetSignals() {
      ['sig-voice', 'sig-face', 'sig-context', 'sig-pose'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove('active', 'alert');
      });
    },

    togglePlay() {
      this.isPlaying = !this.isPlaying;
      this.updatePlayBtn();
      if (this.isPlaying) {
        if (this.dialogueIndex >= scenes[this.currentScene].dialogues.length) {
          this.dialogueIndex = 0;
        }
        this.scheduleNext(500);
      } else {
        this.clearTimers();
      }
    },

    stopAutoPlay() {
      this.isPlaying = false;
      this.updatePlayBtn();
      this.clearTimers();
    },

    updatePlayBtn() {
      this.elements.playBtn.textContent = this.isPlaying ? '⏸' : '▶';
    },

    clearTimers() {
      if (this.autoPlayTimer) {
        clearTimeout(this.autoPlayTimer);
        this.autoPlayTimer = null;
      }
      if (this.typingTimer) {
        clearInterval(this.typingTimer);
        this.typingTimer = null;
      }
    }
  };

  window.app = app;
  app.init();
})();
</script>

</body>
</html>
