    <script>
        // 全局变量
        let currentQuestionIndex = 0;
        let studentInfo = { className: '', name: '' };
        let answers = {}; // 存储答案 {questionIndex: 'A', ...}
        let examStarted = false;
        let timerInterval;
        let remainingTime = 35 * 60; // 35分钟，单位：秒
        let examSubmitted = false;
        let optionMappings = []; // 存储每个题目的选项内容映射 {questionIndex: {A: '原B选项内容', B: '原A选项内容', ...}, ...}
        let submitCount = 1; // 记录提交次数

        // DOM元素
        const studentInfoScreen = document.getElementById('student-info-screen');
        const examScreen = document.getElementById('exam-screen');
        const studentInfoForm = document.getElementById('student-info-form');
        const studentNameDisplay = document.getElementById('student-name-display');
        const studentClassDisplay = document.getElementById('student-class-display');
        const questionNumbersContainer = document.getElementById('question-numbers');
        const currentQuestionNumber = document.getElementById('current-question-number');
        const questionContent = document.getElementById('question-content');
        const optionsContainer = document.getElementById('options-container');
        const prevQuestionBtn = document.getElementById('prev-question');
        const nextQuestionBtn = document.getElementById('next-question');
        const submitExamBtn = document.getElementById('submit-exam');
        const submitWarning = document.getElementById('submit-warning');
        const countdownTimer = document.getElementById('countdown-timer');
        const timerProgress = document.getElementById('timer-progress');
        const progressBar = document.getElementById('progress-bar');
        const progressPercentage = document.getElementById('progress-percentage');
        const answeredCount = document.getElementById('answered-count');
        const remainingCount = document.getElementById('remaining-count');
        const resultSummary = document.getElementById('result-summary');
        const totalScore = document.getElementById('total-score');
        const correctCount = document.getElementById('correct-count');
        const wrongCount = document.getElementById('wrong-count');
        const accuracyRate = document.getElementById('accuracy-rate');
        const submitCountValue = document.getElementById('submit-count-value');
        const retryExamBtn = document.getElementById('retry-exam');

        // 初始化
        function init() {
            // 检查本地存储中是否有未完成的考试
            checkLocalStorage();
            
            // 绑定事件监听器
            studentInfoForm.addEventListener('submit', startExam);
            prevQuestionBtn.addEventListener('click', goToPrevQuestion);
            nextQuestionBtn.addEventListener('click', goToNextQuestion);
            submitExamBtn.addEventListener('click', confirmSubmit);
            retryExamBtn.addEventListener('click', retryExam);
            
            // 生成题目序号
            generateQuestionNumbers();
        }

        // 检查本地存储
        function checkLocalStorage() {
            const savedExam = localStorage.getItem('studentExam');
            if (savedExam) {
                try {
                    const examData = JSON.parse(savedExam);
                    if (examData.studentInfo && examData.answers && !examData.submitted) {
                        // 显示恢复考试的确认框
                        if (confirm('检测到您有未完成的考试，是否继续？')) {
                            studentInfo = examData.studentInfo;
                            answers = examData.answers;
                            currentQuestionIndex = examData.currentQuestionIndex || 0;
                            remainingTime = examData.remainingTime || 35 * 60;
                            optionMappings = examData.optionMappings || [];
                            submitCount = examData.submitCount || 1;
                            
                            // 如果没有保存选项映射，则重新生成
                            if (!optionMappings || optionMappings.length === 0) {
                                generateOptionMappings();
                            }
                            
                            // 直接进入考试界面
                            showExamScreen();
                            updateExamUI();
                            startTimer();
                        }
                    }
                } catch (e) {
                    console.error('解析本地存储失败:', e);
                }
            }
        }

        // 开始考试
        function startExam(e) {
            e.preventDefault();
            
            const className = document.getElementById('class').value.trim();
            const name = document.getElementById('name').value.trim();
            
            if (!className || !name) {
                alert('请输入班级和姓名');
                return;
            }
            
            // 检查是否已经提交过
            const savedExam = localStorage.getItem('studentExam');
            if (savedExam) {
                try {
                    const examData = JSON.parse(savedExam);
                    if (examData.studentInfo && examData.studentInfo.className === className && 
                        examData.studentInfo.name === name && examData.submitted) {
                        alert('您已经提交过答卷，不能重复参加考试');
                        return;
                    }
                } catch (e) {
                    console.error('解析本地存储失败:', e);
                }
            }
            
            studentInfo = { className, name };
        
            // 生成每个题目的选项内容映射（内容随机，字母顺序保持ABCD）
            generateOptionMappings();
            
            showExamScreen();
            updateExamUI();
            startTimer();
            
            // 保存考试状态到本地存储
            saveExamState();
        }

        // 生成每个题目的选项内容映射（字母顺序保持ABCD，内容随机分配）
        function generateOptionMappings() {
            optionMappings = [];
            
            for (let i = 0; i < examQuestions.length; i++) {
                const question = examQuestions[i];
                // 获取所有选项内容（包括空选项）
                const originalContents = {
                    A: question['选项A'] || '',
                    B: question['选项B'] || '',
                    C: question['选项C'] || '',
                    D: question['选项D'] || ''
                };
                
                // 获取有内容的选项及其内容
                const validOptions = ['A', 'B', 'C', 'D'].filter(opt => originalContents[opt] && originalContents[opt].trim() !== '');
                const validContents = validOptions.map(opt => originalContents[opt]);
                
                // Fisher-Yates 洗牌算法随机打乱内容顺序
                const shuffledContents = [...validContents];
                for (let j = shuffledContents.length - 1; j > 0; j--) {
                    const k = Math.floor(Math.random() * (j + 1));
                    [shuffledContents[j], shuffledContents[k]] = [shuffledContents[k], shuffledContents[j]];
                }
                
                // 创建映射：显示位置 -> 原始选项内容
                const mapping = {};
                const displayOrder = ['A', 'B', 'C', 'D']; // 始终按ABCD顺序显示
                let contentIndex = 0;
                
                for (let pos = 0; pos < displayOrder.length; pos++) {
                    const displayLetter = displayOrder[pos];
                    if (pos < shuffledContents.length) {
                        mapping[displayLetter] = shuffledContents[pos];
                    } else {
                        mapping[displayLetter] = ''; // 空选项
                    }
                }
                
                optionMappings[i] = mapping;
            }
        }

        // 显示考试界面
        function showExamScreen() {
            studentInfoScreen.classList.add('hidden');
            examScreen.classList.remove('hidden');
            
            studentNameDisplay.textContent = studentInfo.name;
            studentClassDisplay.textContent = studentInfo.className;
            
            examStarted = true;
        }

        // 生成题目序号（修改：容器改为圆角矩形，保留数字结构）
        function generateQuestionNumbers() {
            questionNumbersContainer.innerHTML = '';
            
            for (let i = 0; i < examQuestions.length; i++) {
                const questionNumber = document.createElement('div');
                // 修改1：将 rounded-full（圆形）改为 rounded-lg（圆角矩形），调整宽高为适配矩形
                questionNumber.className = 'question-number flex items-center justify-center w-10 h-10 rounded-lg bg-gray-700 text-gray-300 font-medium cursor-pointer transition-all duration-300 hover:scale-110 hover:bg-gray-600';
                // 修改2：内部保留题目序号数字，为后续添加✅/❌预留结构
                questionNumber.innerHTML = `<span class="question-num">${i + 1}</span>`;
                questionNumber.dataset.index = i;
                
                questionNumber.addEventListener('click', () => {
                    goToQuestion(i);
                });
                
                questionNumbersContainer.appendChild(questionNumber);
            }
        }

        // 更新考试UI
        function updateExamUI() {
            updateQuestionDisplay();
            updateQuestionNumbersState();
            updateNavigationButtons();
            updateProgress();
            
            // 更新总题目数显示
            document.getElementById('total-questions').textContent = examQuestions.length;
        }

        // 更新题目显示
        function updateQuestionDisplay() {
            const question = examQuestions[currentQuestionIndex];
            currentQuestionNumber.textContent = currentQuestionIndex + 1;
            
            // 处理题目中的换行和缩进
            let processedQuestion = question.题目
                .replace(/\r\n|\r|\n/g, '<br>')
                .replace(/\t/g, '&nbsp;&nbsp;&nbsp;&nbsp;')
                .replace(/    /g, '&nbsp;&nbsp;&nbsp;&nbsp;')
                .replace(/  /g, '&nbsp;&nbsp;');
            
            // 检测并渲染流程图
            if (processedQuestion.includes('[开始]') && processedQuestion.includes('[结束]')) {
                // 提取流程图部分
                const flowChartMatch = processedQuestion.match(/\[开始\].*?\[结束\]/s);
                if (flowChartMatch) {
                    const flowChartText = flowChartMatch[0];
                    // 转换为Mermaid语法
                    let mermaidSyntax = 'graph TD\n';
                    
                    // 处理开始节点
                    mermaidSyntax += '    Start([开始])\n';
                    
                    // 处理条件和步骤
                    if (flowChartText.includes('[条件成立？]')) {
                        mermaidSyntax += '    Condition{条件成立？}\n';
                        mermaidSyntax += '    Start --> Condition\n';
                        
                        if (flowChartText.includes('是--> [步骤A]')) {
                            mermaidSyntax += '    StepA[步骤A]\n';
                            mermaidSyntax += '    Condition -->|是| StepA\n';
                            mermaidSyntax += '    StepA --> End\n';
                        }
                        
                        if (flowChartText.includes('否--> [结束]')) {
                            mermaidSyntax += '    Condition -->|否| End\n';
                        }
                        
                        if (flowChartText.includes('[步骤A] -> [条件成立？]')) {
                            mermaidSyntax += '    StepA --> Condition\n';
                        }
                    }
                    
                    // 处理结束节点
                    mermaidSyntax += '    End([结束])\n';
                    
                    // 生成流程图HTML
                    const flowChartHtml = `
                        <div class="mermaid-container my-4 flex justify-center">
                            <div class="mermaid">${mermaidSyntax}</div>
                        </div>
                    `;
                    
                    // 替换原始流程图文本为渲染后的流程图
                    processedQuestion = processedQuestion.replace(flowChartText, flowChartHtml);
                }
            }
            
            questionContent.innerHTML = `<span class="text-lg font-bold">${currentQuestionIndex + 1}. </span>${processedQuestion}`;
            
            // 初始化Mermaid
            if (window.mermaid) {
                mermaid.initialize({
                    startOnLoad: true,
                    flowchart: {
                        curve: 'linear' // 设置为直线，可选值：linear（直线）、step（折线）
                    }
                });
            }
            
            // 生成选项（字母顺序保持ABCD，内容从映射中获取）
            optionsContainer.innerHTML = '';
            const options = ['A', 'B', 'C', 'D']; // 始终按ABCD顺序显示
            const mapping = optionMappings[currentQuestionIndex] || {};
            
            options.forEach(option => {
                const optionElement = document.createElement('div');
                // 从映射中获取该位置的内容，如果没有映射则使用原始内容
                const optionText = mapping[option] || question[`选项${option}`] || '';
                
                // 处理选项中的换行和缩进
                let processedOption = optionText
                    .replace(/\r\n|\r|\n/g, '<br>')
                    .replace(/\t/g, '&nbsp;&nbsp;&nbsp;&nbsp;')
                    .replace(/    /g, '&nbsp;&nbsp;&nbsp;&nbsp;')
                    .replace(/  /g, '&nbsp;&nbsp;');
                
                // 检测并渲染选项中的流程图
                if (processedOption.includes('[开始]') && processedOption.includes('[结束]')) {
                    // 提取流程图部分
                    const flowChartMatch = processedOption.match(/\[开始\].*?\[结束\]/s);
                    if (flowChartMatch) {
                        const flowChartText = flowChartMatch[0];
                        // 转换为Mermaid语法
                        let mermaidSyntax = 'graph TD\n';
                        
                        // 处理开始节点
                        mermaidSyntax += '    Start([开始])\n';
                        
                        // 处理条件和步骤
                        if (flowChartText.includes('[条件成立？]')) {
                            mermaidSyntax += '    Condition{条件成立？}\n';
                            mermaidSyntax += '    Start --> Condition\n';
                            
                            if (flowChartText.includes('是--> [步骤A]')) {
                                mermaidSyntax += '    StepA[步骤A]\n';
                                mermaidSyntax += '    Condition -->|是| StepA\n';
                                mermaidSyntax += '    StepA --> End\n';
                            }
                            
                            if (flowChartText.includes('否--> [结束]')) {
                                mermaidSyntax += '    Condition -->|否| End\n';
                            }
                            
                            if (flowChartText.includes('[步骤A] -> [条件成立？]')) {
                                mermaidSyntax += '    StepA --> Condition\n';
                            }
                        }
                        
                        // 处理结束节点
                        mermaidSyntax += '    End([结束])\n';
                        
                        // 生成流程图HTML
                        const flowChartHtml = `
                            <div class="mermaid-container my-4 flex justify-center">
                                <div class="mermaid">${mermaidSyntax}</div>
                            </div>
                        `;
                        
                        // 替换原始流程图文本为渲染后的流程图
                        processedOption = processedOption.replace(flowChartText, flowChartHtml);
                    }
                }
                
                optionElement.className = `option flex items-start p-4 border rounded-lg cursor-pointer transition-all duration-300 ${
                    answers[currentQuestionIndex] === option 
                        ? 'border-blue-500 bg-blue-900 bg-opacity-30 text-blue-300' 
                        : 'border-gray-700 hover:border-blue-400 hover:bg-gray-700 hover:bg-opacity-50'
                }`;
                
                if (examSubmitted) {
                    // 获取原始正确答案的内容
                    const originalCorrectAnswer = question['选项' + question.正确答案];
                    // 获取映射
                    const mapping = optionMappings[currentQuestionIndex] || {};
                    
                    // 找到哪个显示位置包含正确答案的内容
                    let correctPosition = question.正确答案;
                    for (const pos of ['A', 'B', 'C', 'D']) {
                        const content = mapping[pos] || question['选项' + pos] || '';
                        if (content === originalCorrectAnswer) {
                            correctPosition = pos;
                            break;
                        }
                    }
                    
                    const isCorrect = option === correctPosition;
                    const isSelected = answers[currentQuestionIndex] === option;
                    
                    if (isCorrect) {
                        optionElement.className = 'option flex items-start p-4 border border-green-500 bg-green-900 bg-opacity-30 text-green-300 rounded-lg';
                    } else if (isSelected) {
                        optionElement.className = 'option flex items-start p-4 border border-red-500 bg-red-900 bg-opacity-30 text-red-300 rounded-lg';
                    } else {
                        optionElement.className = 'option flex items-start p-4 border border-gray-700 bg-gray-800 rounded-lg';
                    }
                }
                
                optionElement.innerHTML = `
                    <div class="option-letter flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center mr-3 font-bold ${
                        answers[currentQuestionIndex] === option 
                            ? 'bg-blue-500 text-white' 
                            : 'bg-gray-700 text-gray-300'
                    }">
                        ${option}
                    </div>
                    <div class="option-text flex-grow text-gray-300">${processedOption}</div>
                    ${examSubmitted ? (
                        (function() {
                            const originalCorrectAnswer = question['选项' + question.正确答案];
                            const mapping = optionMappings[currentQuestionIndex] || {};
                            let correctPosition = question.正确答案;
                            for (const pos of ['A', 'B', 'C', 'D']) {
                                const content = mapping[pos] || question['选项' + pos] || '';
                                if (content === originalCorrectAnswer) {
                                    correctPosition = pos;
                                    break;
                                }
                            }
                            return option === correctPosition 
                                ? '<i class="fas fa-check text-green-400 ml-3 mt-1"></i>' 
                                : (answers[currentQuestionIndex] === option ? '<i class="fas fa-times text-red-400 ml-3 mt-1"></i>' : '');
                        })()
                    ) : ''}
                `;
                
                if (!examSubmitted) {
                    optionElement.addEventListener('click', () => {
                        selectOption(option);
                    });
                }
                
                optionsContainer.appendChild(optionElement);
            });
            
            // 初始化Mermaid（确保选项中的流程图也能渲染）
            if (window.mermaid) {
                mermaid.initialize({
                    startOnLoad: true,
                    flowchart: {
                        curve: 'linear' // 设置为直线，可选值：linear（直线）、step（折线）
                    }
                });
                // 手动渲染所有mermaid图表
                mermaid.run();
            }
        }

        // 选择选项
        function selectOption(option) {
            answers[currentQuestionIndex] = option;
            saveExamState();
            updateExamUI();
            
            // 自动切换到下一题（最后一题除外）
            if (currentQuestionIndex < examQuestions.length - 1) {
                setTimeout(() => {
                    goToNextQuestion();
                }, 500);
            }
        }

        // 判断答案是否正确（考虑选项内容被打乱的情况）
        function isAnswerCorrect(questionIndex, userAnswer) {
            const question = examQuestions[questionIndex];
            if (!userAnswer) return false;
            
            // 获取原始正确答案的内容
            const originalCorrectAnswer = question['选项' + question.正确答案];
            // 获取映射
            const mapping = optionMappings[questionIndex] || {};
            
            // 找到哪个显示位置包含正确答案的内容
            let correctPosition = question.正确答案;
            for (const pos of ['A', 'B', 'C', 'D']) {
                const content = mapping[pos] || question['选项' + pos] || '';
                if (content === originalCorrectAnswer) {
                    correctPosition = pos;
                    break;
                }
            }
            
            return userAnswer === correctPosition;
        }

        // 更新题目序号状态（核心修改：保留数字，同时显示✅/❌，矩形容器）
        function updateQuestionNumbersState() {
            const questionNumbers = document.querySelectorAll('.question-number');
            
            questionNumbers.forEach((number, index) => {
                const questionNumSpan = number.querySelector('.question-num');
                const questionNum = index + 1;
                
                if (index === currentQuestionIndex) {
                    // 当前题目：蓝色圆角矩形，保留数字
                    number.className = 'question-number flex items-center justify-center w-10 h-10 rounded-lg bg-blue-600 text-white font-medium cursor-pointer transition-all duration-300 hover:scale-110';
                    // 提交后当前题目也显示标记，未提交只显示数字
                    if (examSubmitted) {
                        const isCorrect = isAnswerCorrect(index, answers[index]);
                        number.innerHTML = `<span class="question-num flex items-center gap-1">${questionNum} ${isCorrect ? '✅' : '❌'}</span>`;
                    } else {
                        number.innerHTML = `<span class="question-num">${questionNum}</span>`;
                    }
                } else if (answers[index] !== undefined) {
                    // 已答题目
                    if (examSubmitted) {
                        // 提交后：绿色/红色圆角矩形，显示数字+✅/❌
                        const isCorrect = isAnswerCorrect(index, answers[index]);
                        number.className = `question-number flex items-center justify-center w-10 h-10 rounded-lg ${
                            isCorrect ? 'bg-green-600' : 'bg-red-600'
                        } text-white font-medium cursor-pointer transition-all duration-300 hover:scale-110`;
                        number.innerHTML = `<span class="question-num flex items-center gap-1">${questionNum} ${isCorrect ? '✅' : '❌'}</span>`;
                    } else {
                        // 未提交：灰色圆角矩形，只显示数字
                        number.className = 'question-number flex items-center justify-center w-10 h-10 rounded-lg bg-gray-600 text-white font-medium cursor-pointer transition-all duration-300 hover:scale-110';
                        number.innerHTML = `<span class="question-num">${questionNum}</span>`;
                    }
                } else {
                    // 未答题目：浅红圆角矩形，只显示数字
                    number.className = 'question-number flex items-center justify-center w-10 h-10 rounded-lg bg-gray-700 text-gray-300 font-medium cursor-pointer transition-all duration-300 hover:scale-110 hover:bg-gray-600';
                    number.innerHTML = `<span class="question-num">${questionNum}</span>`;
                }
            });
        }

        // 更新导航按钮
        function updateNavigationButtons() {
            prevQuestionBtn.disabled = currentQuestionIndex === 0;
            nextQuestionBtn.disabled = currentQuestionIndex === examQuestions.length - 1;
            
            // 更新提交按钮状态
            const answeredQuestions = Object.keys(answers).length;
            submitExamBtn.disabled = answeredQuestions === 0;
        }

        // 更新进度
        function updateProgress() {
            const answeredQuestions = Object.keys(answers).length;
            const totalQuestions = examQuestions.length;
            const progress = (answeredQuestions / totalQuestions) * 100;
            
            progressBar.style.width = `${progress}%`;
            progressPercentage.textContent = `${progress.toFixed(2)}%`;
            answeredCount.textContent = answeredQuestions;
            remainingCount.textContent = totalQuestions - answeredQuestions;
        }

        // 前往上一题
        function goToPrevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                updateExamUI();
                saveExamState();
            }
        }

        // 前往下一题
        function goToNextQuestion() {
            if (currentQuestionIndex < examQuestions.length - 1) {
                currentQuestionIndex++;
                updateExamUI();
                saveExamState();
            }
        }

        // 前往指定题目
        function goToQuestion(index) {
            if (index >= 0 && index < examQuestions.length) {
                currentQuestionIndex = index;
                updateExamUI();
                saveExamState();
            }
        }

        // 确认提交
        function confirmSubmit() {
            const answeredQuestions = Object.keys(answers).length;
            const totalQuestions = examQuestions.length;
            
            if (answeredQuestions < totalQuestions) {
                submitWarning.classList.remove('hidden');
                setTimeout(() => {
                    if (confirm('您还有未答题目，确定要提交吗？')) {
                        submitExam();
                    }
                }, 100);
            } else {
                submitExam();
            }
        }

        // 提交考试
        function submitExam() {
            if (examSubmitted) return;
            
            // 停止计时器
            clearInterval(timerInterval);
            
            // 标记为已提交
            examSubmitted = true;
            
            // 计算得分（考虑选项内容被打乱的情况）
            let correct = 0;
            let wrong = 0;
            
            for (let i = 0; i < examQuestions.length; i++) {
                const question = examQuestions[i];
                const userAnswer = answers[i];
                
                if (userAnswer === undefined) continue;
                
                // 获取原始正确答案的内容
                const originalCorrectAnswer = question['选项' + question.正确答案];
                // 获取映射
                const mapping = optionMappings[i] || {};
                
                // 找到哪个显示位置包含正确答案的内容
                let correctPosition = question.正确答案; // 默认使用原始位置
                for (const pos of ['A', 'B', 'C', 'D']) {
                    const content = mapping[pos] || question['选项' + pos] || '';
                    if (content === originalCorrectAnswer) {
                        correctPosition = pos;
                        break;
                    }
                }
                
                if (userAnswer === correctPosition) {
                    correct++;
                } else {
                    wrong++;
                }
            }
            
            const score = correct;
            const accuracy = (correct / examQuestions.length) * 100;
            
            // 更新提交次数显示
            submitCountValue.textContent = submitCount;
            
            // 更新结果显示
            totalScore.textContent = score;
            correctCount.textContent = correct;
            wrongCount.textContent = wrong;
            accuracyRate.textContent = `${accuracy.toFixed(2)}%`;
            
            // 显示结果区域
            resultSummary.classList.remove('hidden');
            
            // 更新题目序号状态（显示正确/错误标记+数字）
            updateQuestionNumbersState();
            
            // 更新当前题目显示（显示正确答案）
            updateQuestionDisplay();
            
            // 禁用导航按钮
            prevQuestionBtn.disabled = true;
            nextQuestionBtn.disabled = true;
            submitExamBtn.disabled = true;
            
            // 根据正确率决定是否显示重新答题按钮
            if (accuracy < 100) {
                retryExamBtn.classList.remove('hidden');
            } else {
                retryExamBtn.classList.add('hidden');
            }
            
            // 保存提交状态
            saveExamState();
            
            // 发送数据到API
            sendExamData(score, correct, wrong, accuracy);
            
            // 滚动到结果区域
            resultSummary.scrollIntoView({ behavior: 'smooth' });
            
            // 生成结果图表
            generateResultChart(correct, wrong, examQuestions.length - correct - wrong);
        }

        // 重新答题
        function retryExam() {
            // 增加提交次数
            submitCount++;
            
            // 重新生成选项顺序（随机打乱）
            generateOptionMappings();
            
            // 清空答案
            answers = {};
            
            // 重置当前题目索引
            currentQuestionIndex = 0;
            
            // 重置考试状态
            examSubmitted = false;
            
            // 重置计时器
            remainingTime = 35 * 60;
            
            // 隐藏结果区域
            resultSummary.classList.add('hidden');
            
            // 隐藏重新答题按钮
            retryExamBtn.classList.add('hidden');
            
            // 启用导航按钮
            prevQuestionBtn.disabled = false;
            nextQuestionBtn.disabled = false;
            submitExamBtn.disabled = false;
            
            // 更新UI
            updateExamUI();
            
            // 重新开始计时器
            startTimer();
            
            // 保存考试状态
            saveExamState();
        }

        // 生成结果图表
        function generateResultChart(correct, wrong, unanswered) {
            const ctx = document.getElementById('result-chart').getContext('2d');
            
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['正确', '错误', '未答'],
                    datasets: [{
                        data: [correct, wrong, unanswered],
                        backgroundColor: [
                            '#10B981', // 绿色 - 正确
                            '#EF4444', // 红色 - 错误
                            '#6B7280'  // 灰色 - 未答
                        ],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                font: {
                                    size: 14
                                }
                            }
                        }
                    },
                    cutout: '60%'
                }
            });
        }

        // 开始计时器
        function startTimer() {
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                remainingTime--;
                updateTimerDisplay();
                saveExamState();
                
                if (remainingTime <= 0) {
                    clearInterval(timerInterval);
                    alert('考试时间已结束，自动提交答卷');
                    submitExam();
                }
            }, 1000);
        }

        // 更新计时器显示
        function updateTimerDisplay() {
            const minutes = Math.floor(remainingTime / 60);
            const seconds = remainingTime % 60;
            
            countdownTimer.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // 更新进度条
            const totalTime = 35 * 60;
            const progress = (remainingTime / totalTime) * 100;
            timerProgress.style.width = `${progress}%`;
            
            // 时间少于5分钟时变红
            if (remainingTime <= 5 * 60) {
                countdownTimer.classList.add('text-red-600');
                timerProgress.classList.add('bg-red-500');
            } else {
                countdownTimer.classList.remove('text-red-600');
                timerProgress.classList.remove('bg-red-500');
            }
        }

        // 保存考试状态到本地存储
        function saveExamState() {
            const examData = {
                studentInfo,
                answers,
                currentQuestionIndex,
                remainingTime,
                submitted: examSubmitted,
                optionMappings,
                submitCount
            };
            
            localStorage.setItem('studentExam', JSON.stringify(examData));
        }

        // 发送考试数据到API
        function sendExamData(score, correct, wrong, accuracy) {
            const url = 'https://quickform.cn/api/e0upp4q9ru';
            
            const answersDetails = [];
            for (let i = 0; i < examQuestions.length; i++) {
                const question = examQuestions[i];
                const userAnswer = answers[i];
                
                // 获取原始正确答案的内容
                const originalCorrectAnswer = question['选项' + question.正确答案];
                // 获取映射
                const mapping = optionMappings[i] || {};
                
                // 找到哪个显示位置包含正确答案的内容
                let correctPosition = question.正确答案;
                for (const pos of ['A', 'B', 'C', 'D']) {
                    const content = mapping[pos] || question['选项' + pos] || '';
                    if (content === originalCorrectAnswer) {
                        correctPosition = pos;
                        break;
                    }
                }
                
                const isCorrect = userAnswer === correctPosition;
                answersDetails.push({
                    questionNumber: i + 1,
                    question: examQuestions[i].题目,
                    options: {
                        A: examQuestions[i].选项A,
                        B: examQuestions[i].选项B,
                        C: examQuestions[i].选项C,
                        D: examQuestions[i].选项D
                    },
                    userAnswer: userAnswer || null,
                    correctAnswer: examQuestions[i].正确答案,
                    isCorrect: isCorrect,
                    score: isCorrect ? 1 : 0
                });
            }
            
            const data = {
                studentInfo: {
                    className: studentInfo.className,
                    name: studentInfo.name
                },
                examResults: {
                    totalQuestions: examQuestions.length,
                    answeredQuestions: Object.keys(answers).length,
                    correctAnswers: correct,
                    wrongAnswers: wrong,
                    score: score,
                    accuracy: accuracy.toFixed(2),
                    timeSpent: (35 * 60 - remainingTime) + '秒',
                    submitTime: new Date().toISOString(),
                    submitCount: submitCount
                },
                answers: answersDetails
            };
            
            const sendResultElement = document.getElementById('send-result');
            sendResultElement.textContent = "正在提交考试数据...";
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(async r => {
                const text = await r.text();
                let json = {};
                try {
                    json = JSON.parse(text);
                } catch(e) {
                    json = {raw: text};
                }
                if (!r.ok) throw new Error(json.error || json.message || `HTTP ${r.status}`);
                return json;
            })
            .then(d => {
                sendResultElement.textContent = "数据提交成功！";
                sendResultElement.className = 'inline-block px-6 py-3 bg-green-600 text-white rounded-lg font-semibold';
                console.log('提交成功:', d);
            })
            .catch(e => {
                sendResultElement.textContent = "提交失败: " + e.message;
                sendResultElement.className = 'inline-block px-6 py-3 bg-red-600 text-white rounded-lg font-semibold';
                console.error('提交失败:', e, 'URL:', url, 'Data:', data);
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);

        // 监听页面关闭事件，保存考试状态
        window.addEventListener('beforeunload', () => {
            if (examStarted && !examSubmitted) {
                saveExamState();
            }
        });
    </script>
</body>
