<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒店评价智能分析评分系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="app-container">
    <!-- 侧边栏 -->
    <div class="sidebar" :class="{ collapsed: collapsed }">
        <div class="logo">
            <span class="logo-icon">🏨</span>
            <span class="logo-text">酒店评价智能打分</span>
        </div>
        <div class="menu">
            <div v-for="item in menus" :key="item.path"
                 class="menu-item"
                 :class="{ active: currentPath === item.path }"
                 @click="navigate(item)"
                 :title="item.title">
                <span class="menu-icon">{{ item.icon }}</span>
                <span class="menu-text">{{ item.title }}</span>
            </div>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-container">
        <div class="navbar">
            <div class="left">
                <span class="collapse-btn" @click="collapsed = !collapsed">☰</span>
                <span class="breadcrumb">{{ currentTitle }}</span>
            </div>
            <div class="right">
                <span><span class="status-dot" :class="{ offline: !proxyOnline }"></span>{{ proxyOnline ? '代理服务在线' : '代理服务未连接' }}</span>
                <span>欢迎您，admin</span>
            </div>
        </div>
        <div class="app-main">
            <iframe :src="currentSrc" frameborder="0" id="mainFrame"></iframe>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
    // 主框架使用原生 Vue（CDN 加载）
    loadLibsSync(CDN_LIBS_ALL, function () {
        // 初始化配置
        initConfig();

        const app = new Vue({
            el: '#app',
            data: {
                collapsed: false,
                proxyOnline: false,
                currentPath: 'analyze-test',
                menus: [
                    { path: 'standard',     title: '评分标准管理', icon: '📋', src: 'pages/standard.html' },
                    { path: 'model-config', title: 'AI 模型配置', icon: '🤖', src: 'pages/model-config.html' },
                    { path: 'prompt-config',title: 'Prompt 模板',  icon: '📝', src: 'pages/prompt-config.html' },
                    { path: 'analyze-test',  title: '评价测试分析', icon: '🧪', src: 'pages/analyze-test.html' },
                    { path: 'review-list',   title: '评价明细列表', icon: '📄', src: 'pages/review-list.html' },
                    { path: 'dashboard',     title: '得分汇总统计', icon: '📊', src: 'pages/dashboard.html' }
                ]
            },
            computed: {
                currentMenu() {
                    return this.menus.find(m => m.path === this.currentPath) || this.menus[0];
                },
                currentTitle() {
                    return this.currentMenu.title;
                },
                currentSrc() {
                    return this.currentMenu.src;
                }
            },
            methods: {
                navigate(item) {
                    this.currentPath = item.path;
                },
                async checkProxy() {
                    try {
                        const resp = await API.loadProxyConfig();
                        this.proxyOnline = resp.success;
                    } catch (e) {
                        this.proxyOnline = false;
                    }
                }
            },
            mounted() {
                this.checkProxy();
                setInterval(() => this.checkProxy(), 10000);
            }
        });

        // 暴露给 iframe 子页面用
        window.app = app;
    });
</script>
</body>
</html>
