<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>评分标准管理</title>
</head>
<body>
<div id="app">
    <div class="page-wrapper">
        <el-tabs v-model="activeTab" type="card">
            <!-- 维度配置 -->
            <el-tab-pane label="评分维度" name="dimension">
                <div class="toolbar">
                    <div class="left">
                        <el-button type="primary" size="small" icon="el-icon-plus" @click="openDimDialog(null)">新增维度</el-button>
                        <el-button size="small" icon="el-icon-refresh" @click="resetDims">恢复默认</el-button>
                    </div>
                    <div class="right">
                        <el-button size="small" icon="el-icon-download" @click="exportDims">导出</el-button>
                        <el-upload :show-file-list="false" :before-upload="importDims" accept=".json">
                            <el-button size="small" icon="el-icon-upload2">导入</el-button>
                        </el-upload>
                    </div>
                </div>
                <div class="app-card">
                    <el-table :data="dimensions" border size="mini" style="width:100%">
                        <el-table-column label="排序" width="60" align="center">
                            <template slot-scope="s">
                                <el-button size="mini" type="text" @click="moveDim(s.$index,-1)" :disabled="s.$index===0">↑</el-button>
                                <el-button size="mini" type="text" @click="moveDim(s.$index,1)" :disabled="s.$index===dimensions.length-1">↓</el-button>
                            </template>
                        </el-table-column>
                        <el-table-column label="维度名称" prop="name" width="100"></el-table-column>
                        <el-table-column label="维度标识" prop="key" width="120"></el-table-column>
                        <el-table-column label="维度描述" prop="description" show-overflow-tooltip></el-table-column>
                        <el-table-column label="关键词提示" prop="keywords" show-overflow-tooltip></el-table-column>
                        <el-table-column label="状态" width="80" align="center">
                            <template slot-scope="s">
                                <el-tag :type="s.row.enabled ? 'success' : 'info'" size="mini">{{ s.row.enabled ? '启用' : '停用' }}</el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column label="操作" width="160" align="center">
                            <template slot-scope="s">
                                <el-button size="mini" type="text" @click="openDimDialog(s.row)">编辑</el-button>
                                <el-button size="mini" type="text" @click="toggleDim(s.row)">{{ s.row.enabled ? '停用' : '启用' }}</el-button>
                                <el-button size="mini" type="text" style="color:#f56c6c" @click="deleteDim(s.$index)">删除</el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>
            </el-tab-pane>

            <!-- 等级配置 -->
            <el-tab-pane label="评分等级" name="rating">
                <div class="toolbar">
                    <div class="left">
                        <el-button type="primary" size="small" icon="el-icon-plus" @click="openRatingDialog(null)">新增等级</el-button>
                        <el-button size="small" icon="el-icon-refresh" @click="resetRatings">恢复默认</el-button>
                    </div>
                    <div class="right">
                        <el-dropdown @command="applyTemplate" trigger="click">
                            <el-button size="small">预设模板<i class="el-icon-arrow-down el-icon--right"></i></el-button>
                            <el-dropdown-menu slot="dropdown">
                                <el-dropdown-item command="5">5级评分体系</el-dropdown-item>
                                <el-dropdown-item command="7">7级评分体系（推荐）</el-dropdown-item>
                                <el-dropdown-item command="9">9级评分体系</el-dropdown-item>
                            </el-dropdown-menu>
                        </el-dropdown>
                    </div>
                </div>
                <div class="app-card">
                    <el-table :data="ratings" border size="mini">
                        <el-table-column label="等级名称" prop="name" width="100"></el-table-column>
                        <el-table-column label="等级标识" prop="key" width="160"></el-table-column>
                        <el-table-column label="分值" width="80" align="center">
                            <template slot-scope="s">
                                <span class="score-badge"
                                      :class="s.row.score>0?'positive':(s.row.score<0?'negative':'zero')">
                                    {{ s.row.score > 0 ? '+' + s.row.score : s.row.score }}
                                </span>
                            </template>
                        </el-table-column>
                        <el-table-column label="颜色" width="120">
                            <template slot-scope="s">
                                <span class="color-swatch" :style="{ background: s.row.color }"></span>
                                {{ s.row.color_name }}
                            </template>
                        </el-table-column>
                        <el-table-column label="判定条件描述" prop="description" show-overflow-tooltip></el-table-column>
                        <el-table-column label="操作" width="160" align="center">
                            <template slot-scope="s">
                                <el-button size="mini" type="text" @click="openRatingDialog(s.row)">编辑</el-button>
                                <el-button size="mini" type="text" style="color:#f56c6c" @click="deleteRating(s.$index)">删除</el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>
            </el-tab-pane>

            <!-- 标准模板 -->
            <el-tab-pane label="标准模板" name="template">
                <div class="toolbar">
                    <div class="left">
                        <el-button type="primary" size="small" icon="el-icon-view" @click="previewTemplate">预览评分标准</el-button>
                        <el-button size="small" icon="el-icon-document-copy" @click="copyTemplate">复制到剪贴板</el-button>
                    </div>
                    <div class="right">
                        <span style="color:#909399; font-size:12px;">系统自动根据维度和等级配置生成</span>
                    </div>
                </div>
                <div class="app-card">
                    <div class="card-header"><span class="title">评分标准模板（将发送给 AI）</span></div>
                    <div class="card-body">
                        <el-input type="textarea" v-model="criteriaText" :rows="20" :readonly="false"></el-input>
                    </div>
                </div>
            </el-tab-pane>

            <!-- 评价来源 -->
            <el-tab-pane label="评价来源" name="source">
                <div class="toolbar">
                    <div class="left">
                        <el-button type="primary" size="small" icon="el-icon-plus" @click="openSourceDialog(null)">新增来源</el-button>
                    </div>
                </div>
                <div class="app-card">
                    <el-table :data="sources" border size="mini">
                        <el-table-column label="序号" type="index" width="60" align="center"></el-table-column>
                        <el-table-column label="来源名称" prop="name"></el-table-column>
                        <el-table-column label="来源标识" prop="key"></el-table-column>
                        <el-table-column label="操作" width="160" align="center">
                            <template slot-scope="s">
                                <el-button size="mini" type="text" @click="openSourceDialog(s.row)">编辑</el-button>
                                <el-button size="mini" type="text" style="color:#f56c6c" @click="deleteSource(s.$index)">删除</el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>
            </el-tab-pane>
        </el-tabs>

        <!-- 维度编辑弹窗 -->
        <el-dialog :title="dimForm.id ? '编辑维度' : '新增维度'" :visible.sync="dimDialog" width="600px" :close-on-click-modal="false">
            <el-form :model="dimForm" label-width="100px" size="small">
                <el-form-item label="维度名称" required>
                    <el-input v-model="dimForm.name" placeholder="如：客房"></el-input>
                </el-form-item>
                <el-form-item label="维度标识" required>
                    <el-input v-model="dimForm.key" placeholder="如：room"></el-input>
                </el-form-item>
                <el-form-item label="维度描述">
                    <el-input type="textarea" v-model="dimForm.description" :rows="3" placeholder="详细说明该维度的判定边界"></el-input>
                </el-form-item>
                <el-form-item label="关键词提示">
                    <el-input type="textarea" v-model="dimForm.keywords" :rows="2" placeholder="逗号分隔的关键词"></el-input>
                </el-form-item>
                <el-form-item label="状态">
                    <el-switch v-model="dimForm.enabled" active-text="启用" inactive-text="停用"></el-switch>
                </el-form-item>
            </el-form>
            <div slot="footer">
                <el-button size="small" @click="dimDialog = false">取消</el-button>
                <el-button size="small" type="primary" @click="saveDim">保存</el-button>
            </div>
        </el-dialog>

        <!-- 等级编辑弹窗 -->
        <el-dialog :title="ratingForm.id ? '编辑等级' : '新增等级'" :visible.sync="ratingDialog" width="600px" :close-on-click-modal="false">
            <el-form :model="ratingForm" label-width="100px" size="small">
                <el-form-item label="等级名称" required>
                    <el-input v-model="ratingForm.name" placeholder="如：好评"></el-input>
                </el-form-item>
                <el-form-item label="等级标识" required>
                    <el-input v-model="ratingForm.key" placeholder="如：positive"></el-input>
                </el-form-item>
                <el-form-item label="分值" required>
                    <el-input-number v-model="ratingForm.score" :min="-100" :max="100" size="small"></el-input-number>
                    <span style="margin-left:8px; color:#909399; font-size:12px;">支持正分/零分/负分</span>
                </el-form-item>
                <el-form-item label="颜色">
                    <el-color-picker v-model="ratingForm.color" size="small"></el-color-picker>
                    <el-input v-model="ratingForm.color_name" size="small" style="width:120px; margin-left:10px;" placeholder="颜色名"></el-input>
                </el-form-item>
                <el-form-item label="排序权重">
                    <el-input-number v-model="ratingForm.order" :min="1" :max="100" size="small"></el-input-number>
                    <span style="margin-left:8px; color:#909399; font-size:12px;">数值越大越靠前</span>
                </el-form-item>
                <el-form-item label="判定条件">
                    <el-input type="textarea" v-model="ratingForm.description" :rows="3" placeholder="详细描述该等级的判定条件"></el-input>
                </el-form-item>
            </el-form>
            <div slot="footer">
                <el-button size="small" @click="ratingDialog = false">取消</el-button>
                <el-button size="small" type="primary" @click="saveRating">保存</el-button>
            </div>
        </el-dialog>

        <!-- 来源编辑弹窗 -->
        <el-dialog :title="sourceForm.id ? '编辑来源' : '新增来源'" :visible.sync="sourceDialog" width="450px" :close-on-click-modal="false">
            <el-form :model="sourceForm" label-width="80px" size="small">
                <el-form-item label="来源名称" required>
                    <el-input v-model="sourceForm.name"></el-input>
                </el-form-item>
                <el-form-item label="来源标识" required>
                    <el-input v-model="sourceForm.key"></el-input>
                </el-form-item>
            </el-form>
            <div slot="footer">
                <el-button size="small" @click="sourceDialog = false">取消</el-button>
                <el-button size="small" type="primary" @click="saveSource">保存</el-button>
            </div>
        </el-dialog>

        <!-- 模板预览弹窗 -->
        <el-dialog title="评分标准模板预览" :visible.sync="previewDialog" width="800px">
            <div class="json-viewer" style="max-height:500px;">{{ criteriaText }}</div>
            <div slot="footer">
                <el-button size="small" @click="previewDialog = false">关闭</el-button>
            </div>
        </el-dialog>
    </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/config.js"></script>
<script src="../js/standard.js"></script>
</body>
</html>
