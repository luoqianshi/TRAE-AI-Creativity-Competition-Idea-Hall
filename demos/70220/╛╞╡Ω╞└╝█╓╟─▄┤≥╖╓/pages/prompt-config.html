<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Prompt 模板配置</title>
</head>
<body>
<div id="app">
    <div class="page-wrapper">
        <div class="toolbar">
            <div class="left">
                <el-button type="primary" size="small" icon="el-icon-plus" @click="openDialog(null)">新增模板</el-button>
                <el-button size="small" icon="el-icon-magic-stick" @click="autoGenerate">从评分标准生成</el-button>
            </div>
            <div class="right">
                <el-select v-model="selectedKey" placeholder="选择模板查看" size="small" @change="selectPrompt" style="width:240px;">
                    <el-option v-for="p in prompts" :key="p.id" :label="p.name" :value="p.id"></el-option>
                </el-select>
            </div>
        </div>

        <div class="app-card" v-if="current">
            <div class="card-header">
                <span class="title">{{ current.name }}
                    <el-tag v-if="current.is_default" type="success" size="mini" style="margin-left:8px;">默认</el-tag>
                </span>
                <div>
                    <el-button size="mini" type="text" @click="previewFull">预览完整 Prompt</el-button>
                    <el-button size="mini" type="text" @click="openDialog(current)">编辑</el-button>
                    <el-button size="mini" type="text" style="color:#f56c6c" @click="deletePrompt(current.id)" v-if="!current.is_default">删除</el-button>
                </div>
            </div>
            <div class="card-body">
                <el-row :gutter="16">
                    <el-col :span="12">
                        <div class="detail-section">
                            <div class="section-title">System Prompt（系统提示词）</div>
                            <div class="review-content-box" style="min-height:140px;">{{ current.system_prompt }}</div>
                        </div>
                    </el-col>
                    <el-col :span="12">
                        <div class="detail-section">
                            <div class="section-title">User Prompt 模板（用户提示词）</div>
                            <div class="review-content-box" style="min-height:140px;">{{ current.user_prompt }}</div>
                        </div>
                    </el-col>
                </el-row>
                <div class="detail-section">
                    <div class="section-title">说明</div>
                    <p style="margin:0; color:#606266;">{{ current.description || '-' }}</p>
                </div>
                <div style="background:#fff7e6; border:1px solid #ffd591; padding:8px 12px; border-radius:4px; font-size:12px; color:#ad6800;">
                    支持占位符：<code v-text="'{{scoring_criteria}}'"></code>（评分标准）、<code v-text="'{{review_content}}'"></code>（评价内容）
                </div>
            </div>
        </div>

        <!-- 模板列表 -->
        <div class="app-card">
            <div class="card-header"><span class="title">所有模板</span></div>
            <div class="card-body no-pad">
                <el-table :data="prompts" border size="mini">
                    <el-table-column label="模板名称" prop="name" width="180"></el-table-column>
                    <el-table-column label="说明" prop="description" show-overflow-tooltip></el-table-column>
                    <el-table-column label="输出格式" prop="output_format" width="100"></el-table-column>
                    <el-table-column label="默认" width="80" align="center">
                        <template slot-scope="s">
                            <el-tag v-if="s.row.is_default" type="success" size="mini">默认</el-tag>
                        </template>
                    </el-table-column>
                    <el-table-column label="操作" width="180" align="center">
                        <template slot-scope="s">
                            <el-button size="mini" type="text" @click="selectPrompt(s.row.id)">查看</el-button>
                            <el-button size="mini" type="text" @click="openDialog(s.row)">编辑</el-button>
                            <el-button size="mini" type="text" v-if="!s.row.is_default" @click="setDefault(s.row.id)">设为默认</el-button>
                        </template>
                    </el-table-column>
                </el-table>
            </div>
        </div>
    </div>

    <!-- 编辑弹窗 -->
    <el-dialog :title="form.id ? '编辑模板' : '新增模板'" :visible.sync="dialog" width="800px" :close-on-click-modal="false">
        <el-form :model="form" label-width="120px" size="small">
            <el-form-item label="模板名称" required>
                <el-input v-model="form.name"></el-input>
            </el-form-item>
            <el-form-item label="说明">
                <el-input v-model="form.description"></el-input>
            </el-form-item>
            <el-form-item label="System Prompt">
                <el-input type="textarea" v-model="form.system_prompt" :rows="5"></el-input>
            </el-form-item>
            <el-form-item label="User Prompt 模板">
                <el-input type="textarea" v-model="form.user_prompt" :rows="12"></el-input>
            </el-form-item>
            <el-form-item label="输出格式">
                <el-input v-model="form.output_format" placeholder="如 JSON"></el-input>
            </el-form-item>
        </el-form>
        <div slot="footer">
            <el-button size="small" @click="dialog = false">取消</el-button>
            <el-button size="small" type="primary" @click="savePrompt">保存</el-button>
        </div>
    </el-dialog>

    <!-- 完整预览弹窗 -->
    <el-dialog title="完整 Prompt 预览" :visible.sync="previewDialog" width="800px">
        <el-tabs v-model="previewTab">
            <el-tab-pane label="System Prompt" name="system">
                <div class="json-viewer">{{ current && current.system_prompt }}</div>
            </el-tab-pane>
            <el-tab-pane label="User Prompt（含示例评价）" name="user">
                <div class="json-viewer">{{ previewUserPrompt }}</div>
            </el-tab-pane>
        </el-tabs>
        <div slot="footer">
            <el-button size="small" @click="previewDialog = false">关闭</el-button>
        </div>
    </el-dialog>
</div>

<script src="../js/common.js"></script>
<script src="../js/config.js"></script>
<script src="../js/prompt.js"></script>
</body>
</html>
