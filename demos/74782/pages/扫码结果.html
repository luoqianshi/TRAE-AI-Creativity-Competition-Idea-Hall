:root {
  /* === Brand Color System === */
  --color-primary: #1A7A4C;

  --color-background: #FFFFFF;

  --color-border: #E5E7EB;
  --color-border-subtle: #F3F4F6;

  /* === Typography === */
  --font-family-display: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-family-body: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-family-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-4xl: 2.25rem;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* === Spacing === */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 4px rgba(0, 0, 0, 0.03);
  --shadow-lg: 0 4px 12px rgba(0, 0, 0, 0.04);
}

.dark {
  --color-background: #0F1117;
  --color-surface: #1A1D27;
  --color-surface-raised: #22252F;
  --color-border: #2D313C;
  --color-border-subtle: #1F222C;
  --color-text-primary: #F9FAFB;
  --color-text-secondary: #9CA3AF;

  --color-primary-light: #122A1D;
  --color-primary-50: #0D1F15;
  --state-success-light: #0D2818;
  --state-error-light: #2D1215;
  --state-warning-light: #2D2210;
  --state-info-light: #0D1F2D;
}

/* ============================================
   扫码结果 - Scan Result Page Styles
   ============================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-family-body);
  background: var(--color-surface);
  color: var(--color-text-primary);
  max-width: 375px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* --- Page Header / Top Bar --- */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--color-surface-raised);
  border-bottom: 1px solid var(--color-border);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.top-bar .back-btn {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  border: none;
  background: var(--color-surface);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--color-text-primary);
  text-decoration: none;
}

.top-bar .share-btn {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  border: none;
  background: var(--color-surface);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--color-text-secondary);
}

.top-bar h1 {
  font-size: var(--text-lg);
  font-weight: var(--font-semibold);
  color: var(--color-text-primary);
  line-height: var(--leading-tight);
}

/* --- Main Scrollable Content --- */
.page-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  padding-bottom: 100px;
}

/* --- Card Base --- */
.card {
  background: var(--color-surface-raised);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: 16px;
  margin-bottom: 12px;
}

/* --- Product Info Card --- */
.product-card {
  text-align: center;
}

.barcode {
  font-family: var(--font-family-mono);
  font-size: var(--text-sm);
  color: var(--color-text-tertiary);
  letter-spacing: 1px;
  margin-bottom: 12px;
}

.brand-name {
  font-size: var(--text-2xl);
  font-weight: var(--font-bold);
  color: var(--color-text-primary);
  line-height: var(--leading-tight);
  margin-bottom: 4px;
}

.product-name {
  font-size: var(--text-sm);
  color: var(--color-text-secondary);
  line-height: var(--leading-relaxed);
  margin-bottom: 12px;
}

.category-badge {
  display: inline-block;
  padding: 4px 12px;
  background: var(--color-primary-light);
  color: var(--color-primary);
  font-size: var(--text-xs);
  font-weight: var(--font-medium);
  border-radius: var(--radius-full);
}

/* --- Trust Score Display --- */
.score-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 20px;
  margin-bottom: 12px;
  background: var(--color-surface-raised);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}

.score-ring-container {
  position: relative;
  width: 120px;
  height: 120px;
  margin-bottom: 12px;
}

.score-ring-bg {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 8px solid var(--color-primary-light);
}

.score-ring-fg {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 8px solid transparent;
  border-top-color: var(--color-primary);
  border-right-color: var(--color-primary);
  border-bottom-color: var(--color-primary);
  border-left-color: var(--color-primary);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 100%, 50% 50%, 0 50%);
  transform: rotate(-36deg);
}

.score-ring-overlay {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 8px solid var(--color-primary);
  clip-path: polygon(
    50% 0%,
    61.8% 0%,
    77.6% 3.8%,
    90.4% 14.2%,
    97.6% 28.4%,
    100% 44.8%,
    100% 50%,
    0% 50%,
    0% 44.8%,
    2.4% 28.4%,
    9.6% 14.2%,
    22.4% 3.8%,
    38.2% 0%,
    50% 0%
  );
  transform: rotate(-90deg);
}

.score-number {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.score-value {
  font-size: 42px;
  font-weight: var(--font-bold);
  color: var(--color-primary);
  line-height: 1;
  letter-spacing: -1px;
}

.score-label {
  font-size: var(--text-xs);
  color: var(--color-text-tertiary);
  margin-top: 2px;
}

.trust-status-badge {
  display: inline-block;
  padding: 6px 16px;
  background: var(--color-primary);
  color: var(--color-text-inverse);
  font-size: var(--text-sm);
  font-weight: var(--font-semibold);
  border-radius: var(--radius-full);
  margin-bottom: 8px;
}

.trust-comment {
  font-size: var(--text-sm);
  color: var(--color-text-secondary);
  text-align: center;
}

/* --- Rating Breakdown --- */
.rating-card {
  padding: 16px;
}

.rating-card .card-title {
  font-size: var(--text-sm);
  font-weight: var(--font-semibold);
  color: var(--color-text-primary);
  margin-bottom: 14px;
}

.rating-item {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
}

.rating-item:last-child {
  margin-bottom: 0;
}

.rating-label {
  width: 68px;
  font-size: var(--text-xs);
  color: var(--color-text-secondary);
  flex-shrink: 0;
}

.rating-bar-track {
  flex: 1;
  height: 6px;
  background: var(--color-surface);
  border-radius: 3px;
  margin: 0 10px;
  overflow: hidden;
}

.rating-bar-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--color-primary);
  transition: width 0.6s ease;
}

.rating-value {
  width: 24px;
  text-align: right;
  font-size: var(--text-xs);
  font-weight: var(--font-semibold);
  color: var(--color-text-primary);
  flex-shrink: 0;
}

/* --- Purchase Recommendation --- */
.recommend-card {
  background: linear-gradient(135deg, #1A7A4C 0%, #22A05E 100%);
  border: none;
  color: var(--color-text-inverse);
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 16px;
}

.recommend-icon {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  border-radius: var(--radius-md);
  background: rgba(255, 255, 255, 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
}

.recommend-body {
  flex: 1;
}

.recommend-title {
  font-size: var(--text-base);
  font-weight: var(--font-bold);
  margin-bottom: 4px;
}

.recommend-text {
  font-size: var(--text-xs);
  line-height: var(--leading-relaxed);
  opacity: 0.9;
}

.recommend-visual {
  margin-top: 12px;
  border-radius: var(--radius-md);
  overflow: hidden;
  max-height: 80px;
}

.recommend-visual img {
  width: 100%;
  height: 80px;
  object-fit: cover;
  display: block;
  border-radius: var(--radius-md);
  opacity: 0.7;
}

/* --- News Evidence Timeline --- */
.timeline-card {
  padding: 16px;
}

.timeline-card .card-title {
  font-size: var(--text-sm);
  font-weight: var(--font-semibold);
  color: var(--color-text-primary);
  margin-bottom: 16px;
}

.timeline {
  position: relative;
  padding-left: 20px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 5px;
  top: 6px;
  bottom: 6px;
  width: 2px;
  background: var(--color-border);
}

.timeline-item {
  position: relative;
  padding-bottom: 16px;
}

.timeline-item:last-child {
  padding-bottom: 0;
}

.timeline-dot {
  position: absolute;
  left: -20px;
  top: 4px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid var(--color-primary);
  background: var(--color-primary-light);
}

.timeline-dot.gray {
  border-color: var(--color-text-tertiary);
  background: var(--color-border-subtle);
}

.timeline-content {
  display: flex;
  flex-direction: column;
}

.timeline-text {
  font-size: var(--text-sm);
  color: var(--color-text-primary);
  line-height: var(--leading-relaxed);
}

.timeline-date {
  font-size: var(--text-xs);
  color: var(--color-text-tertiary);
  margin-top: 2px;
}

/* --- Action Buttons --- */
.action-buttons {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
}

.btn {
  flex: 1;
  height: 44px;
  border-radius: var(--radius-md);
  font-size: var(--text-sm);
  font-weight: var(--font-semibold);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  transition: all 0.2s ease;
  border: none;
}

.btn-outline {
  background: transparent;
  border: 1.5px solid var(--color-primary);
  color: var(--color-primary);
}

.btn-outline:hover {
  background: var(--color-primary-light);
}

.btn-filled {
  background: var(--color-primary);
  color: var(--color-text-inverse);
}

.btn-filled:hover {
  background: var(--color-primary-hover);
}

/* --- Bottom Tab Bar --- */
.bottom-tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 375px;
  background: var(--color-surface-raised);
  border-top: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 8px 0 20px;
  z-index: 30;
}

.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  text-decoration: none;
  color: var(--color-text-tertiary);
