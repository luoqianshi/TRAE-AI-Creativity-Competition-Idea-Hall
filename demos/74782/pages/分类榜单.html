    <style id="theme-vars">
:root {
  /* === Brand Color System === */
  --color-primary: #1A7A4C;
  --color-primary-hover: #15683F;
  --color-primary-light: #E8F5EE;
  --color-primary-50: #F0FAF5;
  --color-primary-100: #D4EDDF;
  --color-primary-200: #A8DBC0;
  --color-primary-300: #6BBF93;
  --color-primary-400: #3DA66B;
  --color-primary-500: #1A7A4C;
  --color-primary-600: #14623D;
  --color-primary-700: #0F4A2E;
  --color-primary-800: #0A321E;
  --color-primary-900: #061A0F;

  /* Red / Black List Status Colors */
  --state-success: #16A34A;
  --state-success-light: #DCFCE7;
  --state-error: #DC2626;
  --state-error-light: #FEE2E2;
  --state-warning: #F59E0B;
  --state-warning-light: #FEF3C7;
  --state-info: #0EA5E9;
  --state-info-light: #E0F2FE;

  /* Surface & Neutral */
  --color-background: #FFFFFF;
  --color-surface: #F8FAFB;
  --color-surface-raised: #FFFFFF;
  --color-border: #E5E7EB;
  --color-border-subtle: #F3F4F6;
  --color-text-primary: #111827;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-inverse: #FFFFFF;

  /* === Typography === */
  --font-family-display: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-family-body: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-family-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-4xl: 2.25rem;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* === Spacing === */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 4px rgba(0, 0, 0, 0.03);
  --shadow-lg: 0 4px 12px rgba(0, 0, 0, 0.04);
}

.dark {
  --color-background: #0F1117;
  --color-surface: #1A1D27;
  --color-surface-raised: #22252F;
  --color-border: #2D313C;
  --color-border-subtle: #1F222C;
  --color-text-primary: #F9FAFB;
  --color-text-secondary: #9CA3AF;
  --color-text-tertiary: #6B7280;
  --color-text-inverse: #111827;
  --color-primary-light: #122A1D;
  --color-primary-50: #0D1F15;
  --state-success-light: #0D2818;
  --state-error-light: #2D1215;
  --state-warning-light: #2D2210;
  --state-info-light: #0D1F2D;
}

    </style>

    <script>
    // Toggle between Red and Black lists
    document.getElementById('toggleRed').addEventListener('click', function() {
      document.body.classList.remove('show-black');
    });
    document.getElementById('toggleBlack').addEventListener('click', function() {
      document.body.classList.add('show-black');
    });

    // Category tab switching
    document.querySelectorAll('.cat-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.cat-tab').forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
      });
    });

    // Bottom tab switching
    document.querySelectorAll('.tab-item').forEach(function(tab) {
      tab.addEventListener('click', function(e) {
        e.preventDefault();
        document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
      });
    });
    </script>

    <style>
/* ============================================
   分类榜单 - Ranking Page Styles
   ============================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-family-body);
  background: var(--color-surface);
  color: var(--color-text-primary);
  max-width: 375px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* --- Page Header --- */
.page-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--color-surface-raised);
  border-bottom: 1px solid var(--color-border);
  padding: 14px 16px 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.page-header h1 {
  font-size: var(--text-lg);
  font-weight: var(--font-semibold);
  color: var(--color-text-primary);
  line-height: var(--leading-tight);
}

.header-filter-btn {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  border: none;
  background: var(--color-surface);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--color-text-secondary);
  transition: background 0.15s;
}

.header-filter-btn:hover {
  background: var(--color-primary-light);
  color: var(--color-primary);
}

.header-filter-btn svg {
  width: 18px;
  height: 18px;
}

/* --- Category Tabs --- */
.category-tabs {
  padding: 12px 0 0;
  display: flex;
  gap: 4px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.category-tabs::-webkit-scrollbar { display: none; }

.cat-tab {
  flex-shrink: 0;
  padding: 6px 14px;
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
  color: var(--color-text-secondary);
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
  line-height: var(--leading-tight);
}

.cat-tab.active {
  color: var(--color-primary);
  border-bottom-color: var(--color-primary);
}

.cat-tab:not(.active):hover {
  color: var(--color-text-primary);
}

/* --- Red/Green Toggle --- */
.list-toggle {
  display: flex;
  gap: 0;
  margin: 12px 16px 0;
  background: var(--color-border-subtle);
  border-radius: var(--radius-full);
  padding: 3px;
}

.toggle-btn {
  flex: 1;
  padding: 8px 0;
  font-size: var(--text-sm);
  font-weight: var(--font-semibold);
  border: none;
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
  line-height: var(--leading-tight);
}

.toggle-btn.red-active {
  background: var(--state-success);
  color: var(--color-text-inverse);
}

.toggle-btn.black-active {
  background: var(--state-error);
  color: var(--color-text-inverse);
}

.toggle-btn.inactive {
  background: transparent;
  color: var(--color-text-secondary);
}

.toggle-btn.inactive:hover {
  color: var(--color-text-primary);
}

/* --- Brand List --- */
.brand-list {
  flex: 1;
  padding: 12px 16px;
  overflow-y: auto;
  padding-bottom: 80px;
}

.brand-card {
  background: var(--color-surface-raised);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: box-shadow 0.15s, transform 0.1s;
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-card:active {
  transform: scale(0.985);
  box-shadow: none;
}

.brand-card-content {
  flex: 1;
  min-width: 0;
}

.brand-card-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.brand-name {
  font-size: var(--text-base);
  font-weight: var(--font-bold);
  color: var(--color-text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand-category-tag {
  flex-shrink: 0;
  font-size: 11px;
  font-weight: var(--font-medium);
  padding: 1px 8px;
  border-radius: var(--radius-full);
  background: var(--color-primary-light);
  color: var(--color-primary);
  white-space: nowrap;
}

.brand-card-middle {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.trust-score {
  font-size: var(--text-lg);
  font-weight: var(--font-bold);
  line-height: 1;
}

.trust-score-label {
  font-size: var(--text-xs);
  font-weight: var(--font-normal);
  color: var(--color-text-tertiary);
  margin-right: 2px;
}

.trust-score.high { color: var(--state-success); }
.trust-score.medium { color: var(--state-warning); }
.trust-score.low { color: var(--state-error); }

.score-bar {
  flex: 1;
  height: 4px;
  background: var(--color-border-subtle);
  border-radius: var(--radius-full);
  overflow: hidden;
}

.score-bar-fill {
  height: 100%;
  border-radius: var(--radius-full);
  transition: width 0.4s ease;
}

.score-bar-fill.high { background: var(--state-success); }
.score-bar-fill.medium { background: var(--state-warning); }
.score-bar-fill.low { background: var(--state-error); }

.brand-card-bottom {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-badge {
  flex-shrink: 0;
  font-size: 11px;
  font-weight: var(--font-semibold);
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  white-space: nowrap;
}

.status-badge.success {
  background: var(--state-success-light);
  color: var(--state-success);
}

.status-badge.error {
  background: var(--state-error-light);
  color: var(--state-error);
}

.status-badge.warning {
  background: var(--state-warning-light);
  color: var(--state-warning);
}

.brand-reason {
  font-size: var(--text-xs);
  color: var(--color-text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand-card-arrow {
  flex-shrink: 0;
  color: var(--color-text-tertiary);
  display: flex;
  align-items: center;
  justify-content: center;
}

.brand-card-arrow svg {
  width: 16px;
  height: 16px;
}

/* --- Bottom Tab Bar --- */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 375px;
  max-width: 100%;
  background: var(--color-surface-raised);
  border-top: 1px solid var(--color-border);
  display: flex;
  align-items: stretch;
  justify-content: center;
  z-index: 30;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 8px 0 10px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--color-text-tertiary);
  transition: color 0.15s;
