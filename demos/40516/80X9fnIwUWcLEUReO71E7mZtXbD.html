<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时光胶囊便签 - 写给未来的自己</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Nunito:wght@300;400;600&display=swap');

        :root {
            --primary: #8B5CF6;
            --secondary: #EC4899;
            --accent: #F59E0B;
            --bg-dark: #0F0F23;
            --bg-card: #1A1A2E;
            --bg-card-light: #252542;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0B0;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Nunito', 'Noto Serif SC', serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.05) 0%, transparent 70%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        header p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.8;
        }

        .capsule-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .capsule-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .capsule-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .capsule-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(139, 92, 246, 0.15);
        }

        .capsule-card:hover::before {
            opacity: 1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input[type="text"],
        .form-group textarea,
        .form-group input[type="datetime-local"] {
            width: 100%;
            padding: 15px;
            background: var(--bg-card-light);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input[type="text"]:focus,
        .form-group textarea:focus,
        .form-group input[type="datetime-local"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
            line-height: 1.6;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
        }

        .btn-secondary {
            background: var(--bg-card-light);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .timeline {
            position: relative;
            padding-left: 30px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--primary), var(--secondary));
        }

        .timeline-item {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .timeline-item:hover {
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 25px;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            border: 3px solid var(--bg-dark);
        }

        .timeline-item.locked::before {
            background: var(--text-secondary);
        }

        .timeline-item.opened::before {
            background: var(--accent);
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .timeline-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .timeline-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: var(--bg-card-light);
            padding: 5px 12px;
            border-radius: 20px;
        }

        .timeline-content {
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .timeline-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .timeline-status {
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 12px;
        }

        .timeline-status.locked {
            background: rgba(139, 92, 246, 0.15);
            color: var(--primary);
        }

        .timeline-status.opened {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent);
        }

        .timeline-status.expired {
            background: rgba(236, 72, 153, 0.15);
            color: var(--secondary);
        }

        .countdown {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            position: relative;
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
            opacity: 1;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .modal-message {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .glow-text {
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .container {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="container">
        <header>
            <h1 class="glow-text">时光胶囊便签</h1>
            <p>写下当下的想法，寄给未来的自己。<br>在时光的长河中，留下属于你的印记。</p>
        </header>

        <div class="capsule-container">
            <div class="capsule-card">
                <h2 style="font-size: 1.3rem; margin-bottom: 25px; color: var(--text-primary);">📝 封存一段记忆</h2>
                <form id="capsuleForm">
                    <div class="form-group">
                        <label for="title">标题</label>
                        <input type="text" id="title" placeholder="给这段记忆起个名字..." required>
                    </div>

                    <div class="form-group">
                        <label for="content">内容</label>
                        <textarea id="content" placeholder="写下你想对未来的自己说的话...&#10;&#10;也许是当下的心情、&#10;也许是未完成的目标、&#10;也许是对未来的期待。" required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="openDate">开启日期</label>
                            <input type="datetime-local" id="openDate" required>
                        </div>
                        <div class="form-group">
                            <label for="password">开启密码（可选）</label>
                            <input type="text" id="password" placeholder="设置后需要密码开启">
                        </div>
                    </div>

                    <div class="btn-group">
                        <button type="button" class="btn btn-secondary" onclick="clearForm()">清空</button>
                        <button type="submit" class="btn btn-primary">🔮 封存时光</button>
                    </div>
                </form>
            </div>

            <div>
                <h2 style="font-size: 1.3rem; margin-bottom: 25px; color: var(--text-primary);">📦 我的时光胶囊</h2>
                <div class="timeline" id="timeline">
                    <div class="empty-state">
                        <div class="icon">🗳️</div>
                        <h3>还没有时光胶囊</h3>
                        <p>写下你的第一条便签，开启一段奇妙的时光之旅吧！</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h3 class="modal-title" id="modalTitle"></h3>
            <div class="modal-message" id="modalMessage"></div>
            <div id="modalPassword" style="display: none;">
                <div class="form-group">
                    <label for="inputPassword">请输入开启密码</label>
                    <input type="text" id="inputPassword" placeholder="输入密码">
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="modalBtn" onclick="handleModalAction()">确认</button>
            </div>
        </div>
    </div>

    <script>
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 100;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.width = (Math.random() * 2 + 1) + 'px';
                star.style.height = star.style.width;
                starsContainer.appendChild(star);
            }
        }

        createStars();

        const capsules = JSON.parse(localStorage.getItem('timeCapsules')) || [];

        function saveCapsule() {
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const openDate = document.getElementById('openDate').value;
            const password = document.getElementById('password').value;

            const capsule = {
                id: Date.now(),
                title,
                content,
                openDate,
                password: password || null,
                createdAt: new Date().toISOString(),
                opened: false
            };

            capsules.push(capsule);
            localStorage.setItem('timeCapsules', JSON.stringify(capsules));
            
            showModal('🎉 时光封存成功！', '你的便签已被封存，将在 ' + formatDate(openDate) + ' 开启。');
            clearForm();
            renderTimeline();
        }

        function clearForm() {
            document.getElementById('title').value = '';
            document.getElementById('content').value = '';
            document.getElementById('openDate').value = '';
            document.getElementById('password').value = '';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getStatus(capsule) {
            const now = new Date();
            const openDate = new Date(capsule.openDate);
            
            if (capsule.opened) return 'opened';
            if (now >= openDate) return 'expired';
            return 'locked';
        }

        function getStatusText(status) {
            const texts = {
                locked: '🔒 未开启',
                expired: '⏰ 可开启',
                opened: '📖 已开启'
            };
            return texts[status];
        }

        function getCountdown(openDate) {
            const now = new Date();
            const target = new Date(openDate);
            const diff = target - now;

            if (diff <= 0) return '时间已到';

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            return `${days}天 ${hours}时 ${minutes}分 ${seconds}秒`;
        }

        function renderTimeline() {
            const timeline = document.getElementById('timeline');
            
            if (capsules.length === 0) {
                timeline.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🗳️</div>
                        <h3>还没有时光胶囊</h3>
                        <p>写下你的第一条便签，开启一段奇妙的时光之旅吧！</p>
                    </div>
                `;
                return;
            }

            const sortedCapsules = [...capsules].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            timeline.innerHTML = sortedCapsules.map(capsule => {
                const status = getStatus(capsule);
                const isLocked = status === 'locked';
                
                return `
                    <div class="timeline-item ${status}" onclick="${isLocked ? 'tryOpenCapsule(' + capsule.id + ')' : ''}">
                        <div class="timeline-header">
                            <h3 class="timeline-title">${capsule.title}</h3>
                            <span class="timeline-date">${formatDate(capsule.createdAt)}</span>
                        </div>
                        <div class="timeline-content">
                            ${capsule.opened ? capsule.content : (isLocked ? '❓ 内容已封存...' : '🔓 点击开启时光胶囊')}
                        </div>
                        <div class="timeline-footer">
                            <span class="timeline-status ${status}">${getStatusText(status)}</span>
                            ${!capsule.opened && !isLocked ? '' : 
                                `<span class="countdown">${capsule.opened ? '开启于 ' + formatDate(capsule.openDate) : '距离开启 ' + getCountdown(capsule.openDate)}</span>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        let currentCapsuleId = null;
        let modalAction = null;

        function showModal(title, message, action = null, capsuleId = null) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('modal').classList.add('active');
            document.getElementById('modalPassword').style.display = 'none';
            document.getElementById('inputPassword').value = '';
            modalAction = action;
            currentCapsuleId = capsuleId;
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            modalAction = null;
            currentCapsuleId = null;
        }

        function handleModalAction() {
            if (modalAction) {
                modalAction();
            }
            closeModal();
        }

        function tryOpenCapsule(id) {
            const capsule = capsules.find(c => c.id === id);
            if (!capsule) return;

            const now = new Date();
            const openDate = new Date(capsule.openDate);

            if (now < openDate) {
                showModal('⏳ 时间未到', '你的时光胶囊将在 ' + formatDate(capsule.openDate) + ' 开启，请耐心等待。');
                return;
            }

            if (capsule.password) {
                document.getElementById('modalTitle').textContent = '🔐 需要密码';
                document.getElementById('modalMessage').textContent = '请输入开启密码';
                document.getElementById('modalPassword').style.display = 'block';
                document.getElementById('modal').classList.add('active');
                modalAction = () => verifyPassword(id);
            } else {
                openCapsule(id);
            }
        }

        function verifyPassword(id) {
            const inputPassword = document.getElementById('inputPassword').value;
            const capsule = capsules.find(c => c.id === id);
            
            if (inputPassword === capsule.password) {
                openCapsule(id);
            } else {
                showModal('❌ 密码错误', '请输入正确的密码');
            }
        }

        function openCapsule(id) {
            const capsule = capsules.find(c => c.id === id);
            if (capsule) {
                capsule.opened = true;
                localStorage.setItem('timeCapsules', JSON.stringify(capsules));
                renderTimeline();
                showModal('✨ 时光开启！', '恭喜你开启了时光胶囊！\n\n"' + capsule.content + '"');
            }
        }

        document.getElementById('capsuleForm').addEventListener('submit', (e) => {
            e.preventDefault();
            saveCapsule();
        });

        renderTimeline();
    </script>
</body>
</html>
