<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>语音智送 - 智能送货待办助手</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans SC',sans-serif}
:root{
  --bg-deep:#060D1B;
  --bg-card:rgba(15,30,55,0.85);
  --bg-glass:rgba(255,255,255,0.04);
  --teal:#0D9488;
  --teal-light:#2DD4BF;
  --amber:#F97316;
  --amber-light:#FDBA74;
  --text-primary:#F1F5F9;
  --text-secondary:#94A3B8;
  --text-muted:#475569;
  --border:rgba(255,255,255,0.06);
  --shadow:0 8px 32px rgba(0,0,0,0.4);
}
html,body{height:100%;background:var(--bg-deep);color:var(--text-primary);overflow:hidden}

/* ========== 全局布局 ========== */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative}
.app::before{content:'';position:fixed;top:-40%;left:-20%;width:140%;height:140%;background:radial-gradient(ellipse at 20% 20%,rgba(13,148,136,0.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(249,115,22,0.05) 0%,transparent 50%);pointer-events:none;z-index:0}

/* ========== 顶部导航 ========== */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(6,13,27,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:100;flex-shrink:0}
.top-bar .logo{display:flex;align-items:center;gap:10px}
.top-bar .logo-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--amber));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff}
.top-bar .logo-text{font-size:17px;font-weight:700;letter-spacing:0.5px}
.top-bar .logo-badge{font-size:10px;padding:2px 8px;border-radius:99px;background:rgba(13,148,136,0.15);color:var(--teal-light);font-weight:500;letter-spacing:0.5px}

/* ========== Tab导航 ========== */
.tab-bar{display:flex;gap:0;background:rgba(6,13,27,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:99;flex-shrink:0;position:relative}
.tab-btn{flex:1;padding:13px 0;text-align:center;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;transition:all 0.2s;border:none;background:none;position:relative;display:flex;align-items:center;justify-content:center;gap:6px}
.tab-btn.active{color:var(--teal-light)}
.tab-btn.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:linear-gradient(90deg,var(--teal),var(--amber));border-radius:2px}
.tab-btn .tab-icon{width:18px;height:18px}

/* ========== 主内容区 ========== */
.main{flex:1;overflow:hidden;position:relative;z-index:1}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0;opacity:0;pointer-events:none;transition:opacity 0.3s,transform 0.3s;transform:translateY(10px)}
.page.active{opacity:1;pointer-events:auto;transform:translateY(0)}
.page-inner{max-width:520px;margin:0 auto;padding:20px 16px 120px}

/* ========== 语音页 ========== */
.voice-hero{text-align:center;padding:30px 0 20px}
.voice-hero-title{font-size:22px;font-weight:700;margin-bottom:6px}
.voice-hero-desc{font-size:13px;color:var(--text-secondary)}

/* 麦克风按钮 */
.mic-area{position:relative;display:flex;justify-content:center;align-items:center;padding:40px 0}
.mic-ring{position:absolute;width:160px;height:160px;border-radius:50%;border:2px solid rgba(13,148,136,0.15);animation:none}
.mic-ring.speaking{animation:ring-pulse 1.5s infinite}
@keyframes ring-pulse{
  0%{transform:scale(1);opacity:0.6}
  50%{transform:scale(1.15);opacity:0}
  100%{transform:scale(1.15);opacity:0}
}
.mic-ring2{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(13,148,136,0.1);animation:none}
.mic-ring2.speaking{animation:ring-pulse 1.5s 0.3s infinite}
.mic-btn{width:90px;height:90px;border-radius:50%;border:none;cursor:pointer;position:relative;z-index:2;background:linear-gradient(145deg,#0f766e,#115e59);box-shadow:0 0 40px rgba(13,148,136,0.3),inset 0 1px 1px rgba(255,255,255,0.1);transition:all 0.3s;display:flex;align-items:center;justify-content:center}
.mic-btn:active{transform:scale(0.95)}
.mic-btn.speaking{background:linear-gradient(145deg,#ea580c,#c2410c);box-shadow:0 0 40px rgba(249,115,22,0.4),inset 0 1px 1px rgba(255,255,255,0.15)}
.mic-btn svg{width:36px;height:36px;fill:#fff}
.mic-status{margin-top:16px;font-size:13px;color:var(--text-secondary)}
.mic-status.active{color:var(--amber-light)}

/* 波形动画 */
.wave-container{display:flex;align-items:center;justify-content:center;gap:3px;height:40px;margin:12px 0}
.wave-bar{width:4px;border-radius:2px;background:var(--teal);animation:none}
.wave-bar.active{animation:wave-anim 0.6s infinite alternate}
@keyframes wave-anim{from{height:8px}to{height:36px}}

/* 对话气泡 */
.chat-area{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.chat-bubble{max-width:85%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.6;animation:fade-up 0.3s ease}
.chat-bubble.ai{background:var(--bg-card);border:1px solid var(--border);border-bottom-left-radius:4px;align-self:flex-start}
.chat-bubble.user{background:linear-gradient(135deg,rgba(13,148,136,0.25),rgba(13,148,136,0.1));border:1px solid rgba(13,148,136,0.15);border-bottom-right-radius:4px;align-self:flex-end}
@keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* 信息提取卡片 */
.info-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:16px;display:none}
.info-card.show{display:block;animation:fade-up 0.3s ease}
.info-card-title{font-size:13px;font-weight:700;color:var(--teal-light);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.info-card-title::before{content:'';width:3px;height:14px;background:linear-gradient(var(--teal),var(--amber));border-radius:2px}
.info-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-label{font-size:12px;color:var(--text-muted);width:70px;flex-shrink:0}
.info-value{font-size:14px;font-weight:500;flex:1}
.info-value .placeholder{color:var(--text-muted);font-weight:400}

/* 确认按钮 */
.confirm-bar{display:flex;gap:10px;margin-top:16px;display:none}
.confirm-bar.show{display:flex}
.btn{padding:12px 0;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(0.97)}
.btn-primary{background:linear-gradient(135deg,var(--teal),#0f766e);color:#fff;box-shadow:0 4px 15px rgba(13,148,136,0.3)}
.btn-secondary{background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border)}
.btn-amber{background:linear-gradient(135deg,var(--amber),#ea580c);color:#fff;box-shadow:0 4px 15px rgba(249,115,22,0.3)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:8px}

/* 快捷指令 */
.quick-cmds{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.quick-cmd{padding:8px 14px;border-radius:20px;background:var(--bg-card);border:1px solid var(--border);font-size:12px;color:var(--text-secondary);cursor:pointer;transition:all 0.2s}
.quick-cmd:hover{border-color:var(--teal);color:var(--teal-light);background:rgba(13,148,136,0.08)}

/* ========== 待办看板 ========== */
.board-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.board-header h2{font-size:18px;font-weight:700}
.board-stats{display:flex;gap:8px;margin-bottom:16px}
.stat-chip{padding:6px 14px;border-radius:20px;background:var(--bg-card);border:1px solid var(--border);font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;cursor:pointer;transition:all 0.2s}
.stat-chip.active{border-color:var(--teal);color:var(--teal-light);background:rgba(13,148,136,0.1)}
.stat-chip .dot{width:8px;height:8px;border-radius:50%}
.stat-chip .dot.pending{background:#F97316}
.stat-chip .dot.in-progress{background:#3B82F6}
.stat-chip .dot.completed{background:#22C55E}

/* 任务卡片 */
.task-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.task-card:hover{border-color:rgba(13,148,136,0.3);transform:translateY(-1px)}
.task-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px}
.task-card.status-pending::before{background:#F97316}
.task-card.status-in_progress::before{background:#3B82F6}
.task-card.status-completed::before{background:#22C55E}
.task-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.task-customer{font-size:15px;font-weight:700}
.task-status{font-size:10px;padding:3px 10px;border-radius:20px;font-weight:600}
.task-status.pending{background:rgba(249,115,22,0.12);color:#F97316}
.task-status.in_progress{background:rgba(59,130,246,0.12);color:#3B82F6}
.task-status.completed{background:rgba(34,197,94,0.12);color:#22C55E}
.task-detail{font-size:12px;color:var(--text-secondary);line-height:1.8}
.task-detail span{margin-right:14px}
.task-detail .icon{margin-right:4px}
.task-actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}

/* 空状态 */
.empty-state{text-align:center;padding:60px 20px}
.empty-state .empty-icon{font-size:48px;margin-bottom:16px;opacity:0.3}
.empty-state .empty-text{font-size:14px;color:var(--text-muted)}

/* ========== 报表页 ========== */
.report-section{margin-bottom:24px}
.report-section-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.report-section-title::before{content:'';width:3px;height:16px;background:linear-gradient(var(--teal),var(--amber));border-radius:2px}
.chart-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.chart-container{position:relative;width:100%;height:220px}

/* 预测卡片 */
.predict-card{background:linear-gradient(135deg,rgba(13,148,136,0.08),rgba(249,115,22,0.05));border:1px solid rgba(13,148,136,0.15);border-radius:14px;padding:14px;margin-bottom:10px}
.predict-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.predict-name{font-size:14px;font-weight:700}
.predict-date{font-size:12px;color:var(--amber-light);font-weight:600}
.predict-info{font-size:12px;color:var(--text-secondary);line-height:1.7}

/* ========== 底部语音栏 ========== */
.voice-fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(145deg,var(--teal),#0f766e);box-shadow:0 4px 20px rgba(13,148,136,0.4);display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.voice-fab:active{transform:translateX(-50%) scale(0.92)}
.voice-fab svg{width:24px;height:24px;fill:#fff}

/* ========== 滚动条 ========== */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:4px}

/* ========== Toast ========== */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:10px 20px;font-size:13px;z-index:999;opacity:0;transition:all 0.3s;pointer-events:none;backdrop-filter:blur(20px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:rgba(34,197,94,0.3);color:#4ade80}
.toast.error{border-color:rgba(239,68,68,0.3);color:#f87171}

/* ========== 响应式 ========== */
@media(max-width:480px){
  .page-inner{padding:16px 14px 120px}
}
</style>
</head>
<body>

<div class="app">
  <!-- 顶部导航 -->
  <div class="top-bar">
    <div class="logo">
      <div class="logo-icon">送</div>
      <div>
        <div class="logo-text">语音智送</div>
      </div>
    </div>
    <span class="logo-badge">AI 助手</span>
  </div>

  <!-- Tab导航 -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchPage('voice')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      语音录入
    </button>
    <button class="tab-btn" onclick="switchPage('board')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      待办看板
    </button>
    <button class="tab-btn" onclick="switchPage('report')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      报表分析
    </button>
  </div>

  <!-- 主内容 -->
  <div class="main">
    <!-- ===== 语音录入页 ===== -->
    <div class="page active" id="page-voice">
      <div class="page-inner">
        <div class="voice-hero">
          <div class="voice-hero-title">说出你的送货需求</div>
          <div class="voice-hero-desc">AI 自动识别并拆解待办事项</div>
        </div>

        <!-- 麦克风区域 -->
        <div class="mic-area">
          <div class="mic-ring" id="micRing1"></div>
          <div class="mic-ring2" id="micRing2"></div>
          <button class="mic-btn" id="micBtn" onclick="toggleVoice()">
            <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2" fill="none" stroke="#fff" stroke-width="1.5"/><line x1="12" y1="19" x2="12" y2="23" stroke="#fff" stroke-width="1.5"/><line x1="8" y1="23" x2="16" y2="23" stroke="#fff" stroke-width="1.5"/></svg>
          </button>
        </div>

        <!-- 波形 -->
        <div class="wave-container" id="waveContainer">
          <div class="wave-bar" style="animation-delay:0s"></div>
          <div class="wave-bar" style="animation-delay:0.1s"></div>
          <div class="wave-bar" style="animation-delay:0.2s"></div>
          <div class="wave-bar" style="animation-delay:0.3s"></div>
          <div class="wave-bar" style="animation-delay:0.15s"></div>
          <div class="wave-bar" style="animation-delay:0.25s"></div>
          <div class="wave-bar" style="animation-delay:0.05s"></div>
          <div class="wave-bar" style="animation-delay:0.35s"></div>
          <div class="wave-bar" style="animation-delay:0.12s"></div>
          <div class="wave-bar" style="animation-delay:0.28s"></div>
        </div>

        <div class="mic-status" id="micStatus">点击麦克风开始语音输入</div>

        <!-- 对话区域 -->
        <div class="chat-area" id="chatArea"></div>

        <!-- 信息提取卡片 -->
        <div class="info-card" id="infoCard">
          <div class="info-card-title">已识别的送货信息</div>
          <div class="info-row"><div class="info-label">货品</div><div class="info-value" id="info-goods"><span class="placeholder">待识别</span></div></div>
          <div class="info-row"><div class="info-label">数量</div><div class="info-value" id="info-qty"><span class="placeholder">待识别</span></div></div>
          <div class="info-row"><div class="info-label">重量</div><div class="info-value" id="info-weight"><span class="placeholder">待识别</span></div></div>
          <div class="info-row"><div class="info-label">客户</div><div class="info-value" id="info-customer"><span class="placeholder">待识别</span></div></div>
          <div class="info-row"><div class="info-label">地点</div><div class="info-value" id="info-dest"><span class="placeholder">待识别</span></div></div>
          <div class="info-row"><div class="info-label">时间</div><div class="info-value" id="info-time"><span class="placeholder">待识别</span></div></div>
        </div>

        <!-- 确认栏 -->
        <div class="confirm-bar" id="confirmBar">
          <button class="btn btn-secondary" onclick="resetVoice()">重新录入</button>
          <button class="btn btn-primary" onclick="confirmTask()">确认生成待办</button>
        </div>

        <!-- 快捷指令 -->
        <div class="quick-cmds" id="quickCmds">
          <div class="quick-cmd" onclick="quickCommand('我要去送货')">我要去送货</div>
          <div class="quick-cmd" onclick="quickCommand('完成送货')">完成送货</div>
          <div class="quick-cmd" onclick="quickCommand('查看今天的任务')">查看今天任务</div>
        </div>
      </div>
    </div>

    <!-- ===== 待办看板页 ===== -->
    <div class="page" id="page-board">
      <div class="page-inner">
        <div class="board-header">
          <h2>待办看板</h2>
        </div>
        <div class="board-stats" id="boardStats">
          <div class="stat-chip active" onclick="filterTasks('all', this)"><div class="dot" style="background:var(--teal-light)"></div>全部 <span id="stat-all">0</span></div>
          <div class="stat-chip" onclick="filterTasks('pending', this)"><div class="dot pending"></div>待送 <span id="stat-pending">0</span></div>
          <div class="stat-chip" onclick="filterTasks('in_progress', this)"><div class="dot in-progress"></div>进行中 <span id="stat-progress">0</span></div>
          <div class="stat-chip" onclick="filterTasks('completed', this)"><div class="dot completed"></div>已完成 <span id="stat-completed">0</span></div>
        </div>
        <div id="taskList"></div>
      </div>
    </div>

    <!-- ===== 报表分析页 ===== -->
    <div class="page" id="page-report">
      <div class="page-inner">
        <div class="report-section">
          <div class="report-section-title">客户送货统计</div>
          <div class="chart-card">
            <div class="chart-container"><canvas id="customerChart"></canvas></div>
          </div>
        </div>

        <div class="report-section">
          <div class="report-section-title">送货时间趋势</div>
          <div class="chart-card">
            <div class="chart-container"><canvas id="trendChart"></canvas></div>
          </div>
        </div>

        <div class="report-section">
          <div class="report-section-title">订货预测提醒</div>
          <div id="predictList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部语音快捷按钮 -->
  <button class="voice-fab" id="voiceFab" onclick="switchPage('voice')">
    <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2" fill="none" stroke="#fff" stroke-width="1.5"/></svg>
  </button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ========== 数据层 ==========
const STORAGE_KEY = 'voice_delivery_tasks';
const CUSTOMER_KEY = 'voice_delivery_customers';

function loadTasks() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}
function saveTasks(tasks) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
}
function loadCustomers() {
  try { return JSON.parse(localStorage.getItem(CUSTOMER_KEY)) || {}; } catch { return {}; }
}
function saveCustomers(c) {
  localStorage.setItem(CUSTOMER_KEY, JSON.stringify(c));
}
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

// ========== 全局状态 ==========
let tasks = loadTasks();
let customers = loadCustomers();
let currentFilter = 'all';
let isListening = false;
let recognition = null;
let dialogState = null; // { step, data }
let chartCustomer = null;
let chartTrend = null;

// ========== 页面切换 ==========
function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.tab-btn')[['voice','board','report'].indexOf(name)].classList.add('active');
  if (name === 'board') renderTasks();
  if (name === 'report') renderReports();
}

// ========== 语音识别 ==========
function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = 'zh-CN';
  r.interimResults = true;
  r.continuous = false;
  r.maxAlternatives = 1;
  r.onresult = (e) => {
    let transcript = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      transcript += e.results[i][0].transcript;
    }
    if (e.results[e.resultIndex].isFinal) {
      handleSpeech(transcript.trim());
    }
  };
  r.onerror = (e) => {
    console.error('Speech error:', e.error);
    if (e.error !== 'no-speech' && e.error !== 'aborted') {
      showToast('语音识别出错: ' + e.error, 'error');
    }
    stopListening();
  };
  r.onend = () => {
    if (isListening) stopListening();
  };
  return r;
}

function toggleVoice() {
  if (isListening) {
    stopListening();
  } else {
    startListening();
  }
}

function startListening() {
  if (!recognition) recognition = initSpeech();
  if (!recognition) {
    showToast('您的浏览器不支持语音识别，请使用 Chrome', 'error');
    return;
  }
  try {
    recognition.start();
    isListening = true;
    document.getElementById('micBtn').classList.add('speaking');
    document.getElementById('micRing1').classList.add('speaking');
    document.getElementById('micRing2').classList.add('speaking');
    document.getElementById('micStatus').classList.add('active');
    document.getElementById('micStatus').textContent = '正在聆听...';
    document.querySelectorAll('.wave-bar').forEach(b => b.classList.add('active'));
  } catch (e) {
    console.error(e);
  }
}

function stopListening() {
  isListening = false;
  if (recognition) try { recognition.stop(); } catch {}
  document.getElementById('micBtn').classList.remove('speaking');
  document.getElementById('micRing1').classList.remove('speaking');
  document.getElementById('micRing2').classList.remove('speaking');
  document.getElementById('micStatus').classList.remove('active');
  document.getElementById('micStatus').textContent = '点击麦克风开始语音输入';
  document.querySelectorAll('.wave-bar').forEach(b => b.classList.remove('active'));
}

// ========== 语音指令处理 ==========
function handleSpeech(text) {
  addChatBubble(text, 'user');

  if (!dialogState) {
    // 初始状态：识别意图
    if (/送货|配送|送.*去|发.*货/.test(text)) {
      startDeliveryDialog();
    } else if (/完成|已送达|送到了/.test(text)) {
      switchPage('board');
      addChatBubble('好的，已切换到待办看板，您可以选择完成任务。', 'ai');
    } else if (/查看.*任务|今天.*任务|任务.*列表/.test(text)) {
      switchPage('board');
      addChatBubble('已为您展示所有待办任务。', 'ai');
    } else {
      addChatBubble('我听到您说了：' + text + '，您可以说“我要去送货”来开始录入。', 'ai');
    }
  } else {
    processDeliveryStep(text);
  }
}

function startDeliveryDialog() {
  dialogState = { step: 'goods', data: { goods: '', qty: '', weight: '', customer: '', dest: '', time: '' } };
  document.getElementById('infoCard').classList.add('show');
  addChatBubble('好的！请问要送什么货物？', 'ai');
}

function processDeliveryStep(text) {
  const step = dialogState.step;
  const data = dialogState.data;

  switch(step) {
    case 'goods':
      data.goods = extractGoods(text);
      updateInfoField('info-goods', data.goods);
      dialogState.step = 'qty';
      addChatBubble('收到，' + data.goods + '。请问数量和重量是多少？比如"50袋，共2吨"', 'ai');
      break;
    case 'qty':
      const parsed = parseQtyWeight(text);
      if (parsed.qty) { data.qty = parsed.qty; updateInfoField('info-qty', data.qty); }
      if (parsed.weight) { data.weight = parsed.weight; updateInfoField('info-weight', data.weight); }
      dialogState.step = 'customer';
      addChatBubble('好的，请问客户是谁？送到哪里？', 'ai');
      break;
    case 'customer':
      const custDest = parseCustomerDest(text);
      if (custDest.customer) { data.customer = custDest.customer; updateInfoField('info-customer', data.customer); }
      if (custDest.dest) { data.dest = custDest.dest; updateInfoField('info-dest', data.dest); }
      dialogState.step = 'time';
      addChatBubble('好的，请问预计什么时间送达？', 'ai');
      break;
    case 'time':
      data.time = text;
      updateInfoField('info-time', data.time);
      dialogState.step = 'confirm';
      addChatBubble('信息已收集完毕！请确认以下送货信息：\n' +
        '货品：' + data.goods + '\n' +
        '数量：' + data.qty + '\n' +
        '重量：' + data.weight + '\n' +
        '客户：' + data.customer + '\n' +
        '地点：' + data.dest + '\n' +
        '时间：' + data.time + '\n\n' +
        '点击下方"确认生成待办"按钮完成录入。', 'ai');
      document.getElementById('confirmBar').classList.add('show');
      break;
  }
}

// ========== 信息提取 ==========
function extractGoods(text) {
  const goodsList = ['水泥','钢筋','木材','砂石','砖块','钢材','石灰','混凝土','管材','涂料','瓷砖','地板','电线','电缆','水管','钢材','不锈钢','铝合金','玻璃','塑钢','化肥','农药','种子','饲料','大米','面粉','食用油','蔬菜','水果','肉类','水产','饮料','矿泉水','可乐','牛奶','啤酒'];
  for (const g of goodsList) {
    if (text.includes(g)) return g;
  }
  return text.replace(/[，。！？、]/g, '').substring(0, 20);
}

function parseQtyWeight(text) {
  let qty = '', weight = '';
  const qtyMatch = text.match(/(\d+)\s*(袋|箱|件|吨|桶|包|个|条|块|台|套|只|瓶|盒|卷)/);
  if (qtyMatch) qty = qtyMatch[1] + qtyMatch[2];
  const wtMatch = text.match(/(\d+\.?\d*)\s*(吨|公斤|千克|kg|斤|斤)/i);
  if (wtMatch) weight = wtMatch[1] + wtMatch[2];
  if (!qty && !weight) {
    const nums = text.match(/\d+/g);
    if (nums) qty = text.replace(/[^\u4e00-\u9fa5\d]/g, '');
  }
  return { qty: qty || text, weight: weight || '待确认' };
}

function parseCustomerDest(text) {
  let customer = '', dest = '';
  const custMatch = text.match(/(.{2,6})(老板|经理|总|先生|女士|公司|工厂|门店|超市|商店|市场)/);
  if (custMatch) customer = custMatch[1] + custMatch[2];
  const destMatch = text.match(/(.*?)(路|街|道|区|城|镇|村|巷|号|栋|楼|层|室|门市|仓库|工地|厂房|园区)/);
  if (destMatch) dest = destMatch[0];
  if (!customer) customer = text.substring(0, Math.min(text.length, 8));
  if (!dest) dest = text;
  return { customer, dest };
}

function updateInfoField(id, value) {
  const el = document.getElementById(id);
  el.innerHTML = value || '<span class="placeholder">待识别</span>';
}

// ========== 对话气泡 ==========
function addChatBubble(text, role) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'chat-bubble ' + role;
  div.textContent = text;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

// ========== 确认/重置 ==========
function confirmTask() {
  if (!dialogState || !dialogState.data.goods) {
    showToast('请先通过语音录入送货信息', 'error');
    return;
  }
  const d = dialogState.data;
  const task = {
    id: genId(),
    goods: d.goods,
    quantity: d.qty,
    weight: d.weight,
    customer: d.customer,
    destination: d.dest,
    deliveryTime: d.time,
    status: 'pending',
    createdAt: new Date().toLocaleString('zh-CN')
  };
  tasks.unshift(task);
  saveTasks(tasks);

  // 更新客户统计
  if (!customers[task.customer]) {
    customers[task.customer] = { name: task.customer, totalOrders: 0, totalWeight: 0, orderHistory: [], avgIntervalDays: 0, predictedNextOrder: '' };
  }
  const c = customers[task.customer];
  c.totalOrders++;
  const wtNum = parseFloat(task.weight) || 0;
  c.totalWeight += wtNum;
  c.orderHistory.push(new Date().toISOString().split('T')[0]);
  if (c.orderHistory.length >= 2) {
    const dates = c.orderHistory.map(d => new Date(d));
    let totalDiff = 0;
    for (let i = 1; i < dates.length; i++) totalDiff += (dates[i] - dates[i-1]) / 86400000;
    c.avgIntervalDays = Math.round(totalDiff / (dates.length - 1));
    const lastDate = new Date(c.orderHistory[c.orderHistory.length - 1]);
    lastDate.setDate(lastDate.getDate() + c.avgIntervalDays);
    c.predictedNextOrder = lastDate.toISOString().split('T')[0];
  }
  saveCustomers(customers);

  showToast('待办任务已创建！', 'success');
  resetVoice();
}

function resetVoice() {
  dialogState = null;
  document.getElementById('chatArea').innerHTML = '';
  document.getElementById('infoCard').classList.remove('show');
  document.getElementById('confirmBar').classList.remove('show');
  ['info-goods','info-qty','info-weight','info-customer','info-dest','info-time'].forEach(id => {
    document.getElementById(id).innerHTML = '<span class="placeholder">待识别</span>';
  });
}

// ========== 快捷指令 ==========
function quickCommand(cmd) {
  handleSpeech(cmd);
}

// ========== 待办看板 ==========
function filterTasks(filter, element) {
  currentFilter = filter;
  document.querySelectorAll('.stat-chip').forEach(c => c.classList.remove('active'));
  if (element) element.classList.add('active');
  renderTasks();
}

function renderTasks() {
  const list = document.getElementById('taskList');
  const filtered = currentFilter === 'all' ? tasks : tasks.filter(t => t.status === currentFilter);

  // 更新统计
  document.getElementById('stat-all').textContent = tasks.length;
  document.getElementById('stat-pending').textContent = tasks.filter(t => t.status === 'pending').length;
  document.getElementById('stat-progress').textContent = tasks.filter(t => t.status === 'in_progress').length;
  document.getElementById('stat-completed').textContent = tasks.filter(t => t.status === 'completed').length;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-text">暂无待办任务<br>点击底部麦克风按钮开始语音录入</div></div>';
    return;
  }

  list.innerHTML = filtered.map(t => {
    const statusLabel = { pending: '待送', in_progress: '进行中', completed: '已完成' }[t.status];
    const nextStatus = t.status === 'pending' ? 'in_progress' : t.status === 'in_progress' ? 'completed' : null;
    const nextLabel = nextStatus === 'in_progress' ? '开始送货' : nextStatus === 'completed' ? '标记完成' : '';
    return `
      <div class="task-card status-${t.status}">
        <div class="task-top">
          <div class="task-customer">${t.customer || '未知客户'}</div>
          <div class="task-status ${t.status}">${statusLabel}</div>
        </div>
        <div class="task-detail">
          <span>📦 ${t.goods}</span>
          <span>📏 ${t.quantity}</span>
          <span>⚖️ ${t.weight}</span><br>
          <span>📍 ${t.destination}</span><br>
          <span>🕐 ${t.deliveryTime}</span>
        </div>
        ${nextStatus ? `<div class="task-actions"><button class="btn btn-sm btn-amber" onclick="updateTaskStatus('${t.id}','${nextStatus}')">${nextLabel}</button></div>` : ''}
        ${t.status === 'completed' ? `<div class="task-actions"><button class="btn btn-sm btn-danger" onclick="deleteTask('${t.id}')">删除</button></div>` : ''}
      </div>
    `;
  }).join('');
}

function updateTaskStatus(id, status) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  task.status = status;
  if (status === 'completed') task.completedAt = new Date().toLocaleString('zh-CN');
  saveTasks(tasks);
  renderTasks();
  showToast('任务状态已更新', 'success');
}

function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  saveTasks(tasks);
  renderTasks();
  showToast('任务已删除');
}

// ========== 报表 ==========
function renderReports() {
  renderCustomerChart();
  renderTrendChart();
  renderPredictions();
}

function renderCustomerChart() {
  const ctx = document.getElementById('customerChart').getContext('2d');
  if (chartCustomer) chartCustomer.destroy();

  const names = Object.keys(customers);
  const orderCounts = names.map(n => customers[n].totalOrders);
  const weights = names.map(n => customers[n].totalWeight);

  chartCustomer = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: names.length ? names : ['暂无数据'],
      datasets: [
        { label: '订单数', data: orderCounts.length ? orderCounts : [0], backgroundColor: 'rgba(13,148,136,0.6)', borderRadius: 6 },
        { label: '总重量(kg)', data: weights.length ? weights : [0], backgroundColor: 'rgba(249,115,22,0.6)', borderRadius: 6 }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#94A3B8', font: { size: 11 } } }
      },
      scales: {
        x: { ticks: { color: '#475569', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.03)' } },
        y: { ticks: { color: '#475569', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.03)' } }
      }
    }
  });
}

function renderTrendChart() {
  const ctx = document.getElementById('trendChart').getContext('2d');
  if (chartTrend) chartTrend.destroy();

  // 按日期聚合
  const dateMap = {};
  tasks.forEach(t => {
    const d = t.createdAt ? t.createdAt.split(' ')[0].replace(/\//g, '-') : '未知';
    dateMap[d] = (dateMap[d] || 0) + 1;
  });
  const dates = Object.keys(dateMap).sort().slice(-7);
  const counts = dates.map(d => dateMap[d]);

  chartTrend = new Chart(ctx, {
    type: 'line',
    data: {
      labels: dates.length ? dates : ['暂无数据'],
      datasets: [{
        label: '送货任务数',
        data: counts.length ? counts : [0],
        borderColor: '#0D9488',
        backgroundColor: 'rgba(13,148,136,0.1)',
        fill: true,
        tension: 0.4,
        pointBackgroundColor: '#2DD4BF',
        pointBorderColor: '#2DD4BF',
        pointRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#94A3B8', font: { size: 11 } } }
      },
      scales: {
        x: { ticks: { color: '#475569', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.03)' } },
        y: { ticks: { color: '#475569', font: { size: 10 }, stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.03)' }, beginAtZero: true }
      }
    }
  });
}

function renderPredictions() {
  const list = document.getElementById('predictList');
  const custArr = Object.values(customers).filter(c => c.predictedNextOrder);

  if (custArr.length === 0) {
    list.innerHTML = '<div class="empty-state" style="padding:30px"><div class="empty-icon">🔮</div><div class="empty-text">暂无预测数据<br>多记录几次送货后即可生成预测</div></div>';
    return;
  }

  list.innerHTML = custArr.map(c => {
    const isOverdue = new Date(c.predictedNextOrder) < new Date();
    return `
      <div class="predict-card">
        <div class="predict-header">
          <div class="predict-name">👤 ${c.name}</div>
          <div class="predict-date">${isOverdue ? '⚠️ 已超期' : '📅'} ${c.predictedNextOrder}</div>
        </div>
        <div class="predict-info">
          累计 ${c.totalOrders} 单 | 总重量 ${c.totalWeight}kg<br>
          平均 ${c.avgIntervalDays} 天订货一次 | 预计下次：${c.predictedNextOrder}
        </div>
      </div>
    `;
  }).join('');
}

// ========== Toast ==========
function showToast(msg, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast ' + type + ' show';
  setTimeout(() => toast.classList.remove('show'), 2500);
}
