
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>RangeRNG - 区间随机数生成器</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type="number"] { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 15px; background-color: #4CAF50; color: white; border: none; cursor: pointer; width: 100%; }
        button:hover { background-color: #45a049; }
        #result { margin-top: 20px; font-size: 18px; text-align: center; min-height: 25px; }
        footer { margin-top: 30px; text-align: center; font-size: 12px; color: #777; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 RangeRNG 随机数生成器</h1>
        <label for="min">最小值:</label>
        <input type="number" id="min" value="1">

        <label for="max">最大值:</label>
        <input type="number" id="max" value="100">

        <button onclick="generateRandomNumber()">生成随机数</button>
        <div id="result"></div>
    </div>

    <script>
        function generateRandomNumber() {
            const min = parseInt(document.getElementById('min').value);
            const max = parseInt(document.getElementById('max').value);
            const randomNumber = Math.floor(Math.random() * (max - min + 1)) + min;
            document.getElementById('result').innerText = `生成的随机数是: ${randomNumber}`;
        }
    </script>

    <footer>
        &copy; 2023 RangeRNG. All rights reserved.
    </footer>
</body>
</html>
