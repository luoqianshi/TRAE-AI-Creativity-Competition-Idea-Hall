<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时光交互的星球 | 生活服务赛道</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    background: #000;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #canvas-container {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 1;
  }
  canvas { display: block; }

  /* 顶部标题区 */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: 28px 40px;
    display: flex;
    align-items: center;
    gap: 16px;
    pointer-events: none;
  }
  .header .track-tag {
    display: inline-block;
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: #00e5ff;
    border: 1px solid rgba(0, 229, 255, 0.5);
    background: rgba(0, 229, 255, 0.08);
    backdrop-filter: blur(10px);
  }
  .header .title {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 2px;
    text-shadow: 0 0 30px rgba(100, 200, 255, 0.5);
  }

  /* 底部信息面板 */
  .info-panel {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .info-card {
    background: rgba(10, 20, 40, 0.75);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(100, 180, 255, 0.25);
    border-radius: 16px;
    padding: 18px 22px;
    min-width: 180px;
    max-width: 260px;
    flex: 1;
    transition: all 0.3s ease;
  }
  .info-card:hover {
    border-color: rgba(0, 229, 255, 0.6);
    background: rgba(10, 25, 50, 0.85);
    box-shadow: 0 0 30px rgba(0, 180, 255, 0.15);
    transform: translateY(-2px);
  }
  .info-card .card-icon {
    font-size: 22px;
    margin-bottom: 8px;
  }
  .info-card .card-title {
    font-size: 13px;
    font-weight: 600;
    color: #00e5ff;
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .info-card .card-text {
    font-size: 12px;
    color: rgba(200, 220, 240, 0.85);
    line-height: 1.7;
  }

  /* 交互提示 */
  .hint {
    position: fixed;
    bottom: 200px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 1px;
    transition: opacity 0.8s ease;
  }

  /* 响应式 */
  @media (max-width: 768px) {
    .header {
      padding: 18px 20px;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .header .title { font-size: 22px; }
    .info-panel {
      bottom: 16px;
      gap: 10px;
      padding: 0 16px;
      flex-direction: column;
      align-items: stretch;
    }
    .info-card {
      min-width: unset;
      max-width: unset;
      padding: 14px 16px;
    }
    .hint { bottom: 320px; }
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="header">
  <span class="track-tag">生活服务赛道</span>
  <span class="title">时光交互的星球</span>
</div>

<div class="hint" id="hint">🖱 拖拽旋转 &nbsp;|&nbsp; 滚轮缩放</div>

<div class="info-panel">
  <div class="info-card">
    <div class="card-icon">&#127758;</div>
    <div class="card-title">核心概念</div>
    <div class="card-text">星球图片展示墙 — 用手势操控星球形状的照片墙，立体交互展示历史、文化与个人生活</div>
  </div>
  <div class="info-card">
    <div class="card-icon">&#127963;</div>
    <div class="card-title">目标用户</div>
    <div class="card-text">博物馆、展览馆、家庭照片墙，比传统电子屏幕更具互动性与沉浸感</div>
  </div>
  <div class="info-card">
    <div class="card-icon">&#128188;</div>
    <div class="card-title">商业价值</div>
    <div class="card-text">与博物馆、展览馆合作开发光影展示项目，拓展沉浸式展陈市场</div>
  </div>
  <div class="info-card">
    <div class="card-icon">&#129309;</div>
    <div class="card-title">社会价值</div>
    <div class="card-text">搭建任意适合场景的互动交流平台，促进文化传播与情感连接</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── 场景初始化 ──
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.5, 100);
camera.position.set(0, 0.6, 5.5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// ── OrbitControls ──
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.8;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.72;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.target.set(0, 0, 0);

// ── 灯光 ──
const ambientLight = new THREE.AmbientLight(0x1a2a40, 1.6);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xffffff, 2.8);
keyLight.position.set(5, 3, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 1024;
keyLight.shadow.mapSize.height = 1024;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 30;
keyLight.shadow.bias = -0.0001;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x4488cc, 1.5);
rimLight.position.set(-3, -1, -4);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0x3366aa, 0.8);
fillLight.position.set(0, 4, 0);
scene.add(fillLight);

// ── 星空背景 ──
const starsGeometry = new THREE.BufferGeometry();
const starsCount = 2000;
const starsPositions = new Float32Array(starsCount * 3);
const starsSizes = new Float32Array(starsCount);
for (let i = 0; i < starsCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 25 + Math.random() * 30;
  starsPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  starsPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
  starsPositions[i * 3 + 2] = r * Math.cos(phi);
  starsSizes[i] = Math.random() * 2.2 + 0.5;
}
starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
starsGeometry.setAttribute('size', new THREE.BufferAttribute(starsSizes, 1));

const starsMaterial = new THREE.PointsMaterial({
  color: 0xccddff,
  size: 0.06,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true,
  opacity: 0.85,
});
const stars = new THREE.Points(starsGeometry, starsMaterial);
scene.add(stars);

// 星云粒子环
const ringGeometry = new THREE.BufferGeometry();
const ringCount = 800;
const ringPositions = new Float32Array(ringCount * 3);
for (let i = 0; i < ringCount; i++) {
  const angle = (i / ringCount) * Math.PI * 2;
  const radius = 5.5 + (Math.random() - 0.5) * 1.2;
  const height = (Math.random() - 0.5) * 0.4;
  ringPositions[i * 3] = Math.cos(angle) * radius;
  ringPositions[i * 3 + 1] = height;
  ringPositions[i * 3 + 2] = Math.sin(angle) * radius;
}
ringGeometry.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
const ringMaterial = new THREE.PointsMaterial({
  color: 0x3366cc,
  size: 0.03,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true,
  opacity: 0.5,
});
const ring = new THREE.Points(ringGeometry, ringMaterial);
ring.rotation.x = Math.PI * 0.35;
scene.add(ring);

// ── 照片纹理生成 ──
function createPhotoTexture(baseColor, label, icon) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  // 渐变背景
  const gradient = ctx.createLinearGradient(0, 0, 256, 256);
  gradient.addColorStop(0, baseColor);
  gradient.addColorStop(1, shadeColor(baseColor, -30));
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 256, 256);

  // 圆角遮罩
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.roundRect(4, 4, 248, 248, 16);
  ctx.clip();

  // 菱形装饰图案
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    const cx = 50 + i * 42;
    const cy = 128;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 30);
    ctx.lineTo(cx + 20, cy);
    ctx.lineTo(cx, cy + 30);
    ctx.lineTo(cx - 20, cy);
    ctx.closePath();
    ctx.stroke();
  }
  for (let i = 0; i < 5; i++) {
    const cx = 50 + i * 42;
    const cy = 80;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 25);
    ctx.lineTo(cx + 16, cy);
    ctx.lineTo(cx, cy + 25);
    ctx.lineTo(cx - 16, cy);
    ctx.closePath();
    ctx.stroke();
  }
  for (let i = 0; i < 5; i++) {
    const cx = 50 + i * 42;
    const cy = 176;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 25);
    ctx.lineTo(cx + 16, cy);
    ctx.lineTo(cx, cy + 25);
    ctx.lineTo(cx - 16, cy);
    ctx.closePath();
    ctx.stroke();
  }

  // 图标
  ctx.font = '48px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.textAlign = 'center';
  ctx.fillText(icon, 128, 118);

  // 标签
  ctx.font = 'bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fillText(label, 128, 210);

  // 照片边框内发光
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.roundRect(6, 6, 244, 244, 14);
  ctx.stroke();

  return new THREE.CanvasTexture(canvas);
}

function shadeColor(color, percent) {
  const num = parseInt(color.replace('#', ''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, Math.min(255, (num >> 16) + amt));
  const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
  const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
  return `#${(0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1)}`;
}

// 照片墙数据
const photoData = [
  { color: '#4a6fa5', label: '历史长廊', icon: '🏛' },
  { color: '#6b8e6b', label: '文化瑰宝', icon: '🎨' },
  { color: '#c47f5a', label: '城市记忆', icon: '🏙' },
  { color: '#8b5e83', label: '艺术之光', icon: '✨' },
  { color: '#5a8a8a', label: '自然之美', icon: '🌿' },
  { color: '#9b6b3d', label: '人文风情', icon: '🎭' },
  { color: '#4a7c8c', label: '科技脉动', icon: '💡' },
  { color: '#7b5e4a', label: '岁月留声', icon: '📷' },
  { color: '#5c6b8a', label: '世界遗产', icon: '🗿' },
  { color: '#6a8a5a', label: '民俗画卷', icon: '🏮' },
  { color: '#8a5a6b', label: '建筑诗篇', icon: '🏰' },
  { color: '#5a8a7b', label: '音乐时空', icon: '🎵' },
  { color: '#7a6a8a', label: '光影故事', icon: '🎬' },
  { color: '#8a7a5a', label: '舌尖记忆', icon: '🍜' },
  { color: '#4a6a8a', label: '匠心传承', icon: '🔧' },
  { color: '#8a4a5a', label: '时代印记', icon: '📰' },
  { color: '#5a8a6a', label: '生态画境', icon: '🦋' },
  { color: '#6a5a8a', label: '宇宙探索', icon: '🚀' },
  { color: '#8a6a4a', label: '节日庆典', icon: '🎆' },
  { color: '#4a8a6a', label: '青春相册', icon: '🌟' },
];

// ── 构建星球 ──
const planetGroup = new THREE.Group();
const planetRadius = 1.6;
const segments = 64;

// 球体基础
const sphereGeom = new THREE.SphereGeometry(planetRadius, segments, segments);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0x0a1a2a,
  roughness: 0.65,
  metalness: 0.15,
});
const sphere = new THREE.Mesh(sphereGeom, sphereMat);
sphere.castShadow = true;
sphere.receiveShadow = true;
planetGroup.add(sphere);

// 照片贴片 - 均匀分布在球面
photoData.forEach((photo, index) => {
  const texture = createPhotoTexture(photo.color, photo.label, photo.icon);
  texture.colorSpace = THREE.SRGBColorSpace;

  // 使用斐波那契球面分布
  const phi = Math.acos(1 - 2 * (index + 0.5) / photoData.length);
  const theta = Math.PI * (1 + Math.sqrt(5)) * index;
  const x = Math.sin(phi) * Math.cos(theta);
  const y = Math.cos(phi);
  const z = Math.sin(phi) * Math.sin(theta);

  const position = new THREE.Vector3(x, y, z).multiplyScalar(planetRadius * 1.01);

  const photoSize = 0.42;
  const photoGeom = new THREE.PlaneGeometry(photoSize, photoSize);
  const photoMat = new THREE.MeshStandardMaterial({
    map: texture,
    roughness: 0.3,
    metalness: 0.1,
    side: THREE.DoubleSide,
  });
  const photoMesh = new THREE.Mesh(photoGeom, photoMat);

  photoMesh.position.copy(position);
  photoMesh.lookAt(new THREE.Vector3(x * 2, y * 2, z * 2));
  photoMesh.castShadow = true;

  planetGroup.add(photoMesh);
});

// 经纬线网格
const wireframeGeom = new THREE.SphereGeometry(planetRadius * 1.015, 64, 32);
const wireframeMat = new THREE.MeshBasicMaterial({
  color: 0x3366aa,
  wireframe: true,
  transparent: true,
  opacity: 0.08,
  depthWrite: false,
});
const wireframe = new THREE.Mesh(wireframeGeom, wireframeMat);
planetGroup.add(wireframe);

// 外层光环
const outerRingGeom = new THREE.TorusGeometry(planetRadius * 1.25, 0.015, 16, 120);
const outerRingMat = new THREE.MeshStandardMaterial({
  color: 0x4488cc,
  roughness: 0.2,
  metalness: 0.8,
  emissive: 0x224466,
  emissiveIntensity: 0.6,
});
const outerRing = new THREE.Mesh(outerRingGeom, outerRingMat);
outerRing.rotation.x = Math.PI * 0.45;
outerRing.rotation.y = Math.PI * 0.15;
planetGroup.add(outerRing);

// 第二道光环
const outerRing2Geom = new THREE.TorusGeometry(planetRadius * 1.38, 0.008, 16, 150);
const outerRing2Mat = new THREE.MeshStandardMaterial({
  color: 0x66aadd,
  roughness: 0.15,
  metalness: 0.9,
  emissive: 0x334466,
  emissiveIntensity: 0.4,
  transparent: true,
  opacity: 0.7,
});
const outerRing2 = new THREE.Mesh(outerRing2Geom, outerRing2Mat);
outerRing2.rotation.x = Math.PI * 0.55;
outerRing2.rotation.y = -Math.PI * 0.1;
planetGroup.add(outerRing2);

scene.add(planetGroup);

// ── 粒子环绕 ──
const orbitParticlesGeom = new THREE.BufferGeometry();
const orbitCount = 300;
const orbitPositionsArr = new Float32Array(orbitCount * 3);
for (let i = 0; i < orbitCount; i++) {
  const angle = (i / orbitCount) * Math.PI * 2;
  const r = planetRadius * 1.5 + Math.sin(i * 13) * 0.15;
  orbitPositionsArr[i * 3] = Math.cos(angle) * r;
  orbitPositionsArr[i * 3 + 1] = Math.sin(i * 7) * 0.18;
  orbitPositionsArr[i * 3 + 2] = Math.sin(angle) * r;
}
orbitParticlesGeom.setAttribute('position', new THREE.BufferAttribute(orbitPositionsArr, 3));
const orbitParticlesMat = new THREE.PointsMaterial({
  color: 0x88ccff,
  size: 0.025,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true,
  opacity: 0.7,
});
const orbitParticles = new THREE.Points(orbitParticlesGeom, orbitParticlesMat);
planetGroup.add(orbitParticles);

// ── 动画循环 ──
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);

  const elapsed = clock.getElapsedTime();

  controls.update();

  // 星空缓慢旋转
  stars.rotation.y += 0.00015;
  stars.rotation.x += 0.00005;
  ring.rotation.z += 0.0003;

  // 光环微动
  outerRing.rotation.z += 0.001;
  outerRing2.rotation.z -= 0.0007;

  // 粒子环绕旋转
  orbitParticles.rotation.y += 0.002;
  orbitParticles.rotation.x = Math.sin(elapsed * 0.3) * 0.15;

  // 星球自转（自动旋转时）
  if (controls.autoRotate) {
    planetGroup.rotation.y += 0.0015;
  }

  renderer.render(scene, camera);
}
animate();

// ── 响应式处理 ──
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// 隐藏提示
setTimeout(() => {
  const hint = document.getElementById('hint');
  if (hint) hint.style.opacity = '0';
}, 8000);

// 交互时显示/隐藏提示
let hintTimer;
renderer.domElement.addEventListener('pointerdown', () => {
  const hint = document.getElementById('hint');
  if (hint) {
    hint.style.opacity = '1';
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => { hint.style.opacity = '0'; }, 3000);
  }
});
</script>
</body>
</html>
