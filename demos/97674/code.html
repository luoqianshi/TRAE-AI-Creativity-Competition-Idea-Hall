<style>
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #fdf6f0 0%, #f3eee5 100%);
    min-height: 100vh;
  }
  
  .glass-card {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.5);

  }
  
  .glass-header {
    background: rgba(255, 255, 255, 0.85);

    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(217, 112, 50, 0.15);
  }
  
  .checklist-item {
    transition: all 0.3s ease;
    position: relative;
  }
  
  .checklist-item.completed .item-text {
    text-decoration: line-through;
    text-decoration-color: #d97032;
    text-decoration-thickness: 2px;
    color: #b89874;
    opacity: 0.6;
  }
  
  .checklist-item.completed .item-checkbox {
    background: linear-gradient(135deg, #d97032, #c25826);
    border-color: #d97032;
  }
  
  .checklist-item.completed .item-checkbox i {
    opacity: 1;
    transform: scale(1);
  }
  
  .item-checkbox i {
    opacity: 0;
    transform: scale(0);
    transition: all 0.2s ease;
  }
  
  .category-card {
    transition: all 0.3s ease;
    cursor: pointer;
  }
  
  .category-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(217, 112, 50, 0.15);
  }
  
  .category-card.active {
    background: linear-gradient(135deg, #d97032, #c25826);
    color: white;
  }
  
  .progress-ring {
    transform: rotate(-90deg);
  }
  
  .progress-ring__circle {
    transition: stroke-dashoffset 0.5s ease;
    stroke-linecap: round;
  }
  
  .fade-in {
    animation: fadeIn 0.4s ease;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .custom-scroll::-webkit-scrollbar {
    width: 6px;
  }
  
  .custom-scroll::-webkit-scrollbar-track {
    background: #f3eee5;
    border-radius: 10px;
  }
  
  .custom-scroll::-webkit-scrollbar-thumb {
    background: #d97032;
    border-radius: 10px;
  }
  
  .toast {
    animation: slideUp 0.3s ease, fadeOut 0.3s ease 2.7s;
  }
  
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  
  @keyframes fadeOut {
    to { opacity: 0; transform: translateY(20px); }
  }
  
  .decoration-pattern {
    background-image: radial-gradient(circle at 20% 50%, rgba(217, 112, 50, 0.05) 0%, transparent 50%),

  }
  
  .input-glow:focus {
    box-shadow: 0 0 0 3px rgba(217, 112, 50, 0.2);
    border-color: #d97032;
  }
  
  .btn-primary {
    background: linear-gradient(135deg, #d97032, #c25826);
    transition: all 0.3s ease;
  }
  
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(217, 112, 50, 0.4);
  }
  
  .tag-badge {
    background: linear-gradient(135deg, rgba(217, 112, 50, 0.1), rgba(217, 112, 50, 0.05));

  .stat-card {
    transition: all 0.3s ease;
  }
  
  .stat-card:hover {
    transform: translateY(-3px);
  }
  
  .floating-action {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    z-index: 40;
  }
  
  @media (max-width: 640px) {

      right: 1rem;

<body class="decoration-pattern min-h-screen">

<!-- 顶部导航栏 -->
<header class="glass-header sticky top-0 z-50 px-4 sm:px-6 lg:px-8 py-4">

    </div>

  </div>
</header>

<!-- Hero区域 -->
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-6">

</section>

<!-- 分类导航 -->
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

<!-- 清单内容区 -->

        <option value="style">装修风格</option>

</section>

<!-- 浮动操作按钮 -->

  </button>
</div>

<!-- Toast 提示 -->
<div id="toast-container" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 space-y-3"></div>

    items: [
      { id: 'm1', text: '瓷砖：检查平整度、色差、尺寸误差，不同批次不混用', completed: false },
      { id: 'm2', text: '地板：确认环保等级（E0级以上），预留伸缩缝', completed: false },
      { id: 'm3', text: '乳胶漆：检查环保认证（十环认证/蓝天使等），开封后无结块', completed: false },
      { id: 'm4', text: '板材：橱柜/衣柜板材环保等级E0级以上，封边严密', completed: false },
      { id: 'm5', text: '防水涂料：确认品牌型号，涂刷厚度不少于1.5mm', completed: false },
      { id: 'm6', text: '电线：国标铜芯线，照明2.5平方，插座4平方，空调6平方', completed: false },
      { id: 'm7', text: '水管：PPR热熔管，冷热水管分开走，间距不少于15cm', completed: false },
      { id: 'm8', text: '开关面板：确认品牌正品，面板平整无缝隙', completed: false },
      { id: 'm9', text: '门窗：密封条完好，开关顺畅，玻璃3C认证', completed: false },
      { id: 'm10', text: '五金件：铰链、滑轨选用品牌产品，开合测试顺滑无声', completed: false },
      { id: 'm11', text: '腻子粉：耐水型腻子，打磨后表面平整无粉尘', completed: false },
      { id: 'm12', text: '美缝剂：确认防霉等级，颜色与瓷砖搭配协调', completed: false }
    ]
  }
};

let currentCategory = 'all';
let customItems = [];

// 初始化
function init() {
  renderCategoryNav();
  renderChecklist();
  updateProgress();
}

// 渲染分类导航
function renderCategoryNav() {
  const nav = document.getElementById('category-nav');
  let html = `
    <div class="category-card ${currentCategory === 'all' ? 'active' : ''} glass-card rounded-2xl p-4 text-center" onclick="switchCategory('all')">
      <i class="fas fa-th-large text-2xl mb-2"></i>
      <p class="text-sm font-medium">全部</p>
      <p class="text-xs opacity-70">${getAllItemsCount()}项</p>
    </div>
  `;
  
  Object.keys(checklistData).forEach(key => {
    const cat = checklistData[key];
    const completedCount = cat.items.filter(i => i.completed).length;
    html += `
      <div class="category-card ${currentCategory === key ? 'active' : ''} glass-card rounded-2xl p-4 text-center" onclick="switchCategory('${key}')">
        <i class="fas ${cat.icon} text-2xl mb-2"></i>
        <p class="text-sm font-medium">${cat.title}</p>
        <p class="text-xs opacity-70">${completedCount}/${cat.items.length}项</p>
      </div>
    `;
  });
  
  nav.innerHTML = html;
}

// 获取所有项目数量
function getAllItemsCount() {
  let count = 0;
  Object.values(checklistData).forEach(cat => {
    count += cat.items.length;
  });
  count += customItems.length;
  return count;
}

// 切换分类
function switchCategory(cat) {
  currentCategory = cat;
  renderCategoryNav();
  renderChecklist();
}

// 渲染清单
function renderChecklist() {
  const container = document.getElementById('checklist-container');
  let html = '';
  
  if (currentCategory === 'all') {
    Object.keys(checklistData).forEach(key => {
      html += renderCategorySection(key, checklistData[key]);
    });
    if (customItems.length > 0) {
      html += renderCustomSection();
    }
  } else {
    html += renderCategorySection(currentCategory, checklistData[currentCategory]);
    const customInCategory = customItems.filter(item => item.category === currentCategory);
    if (customInCategory.length > 0) {
      html += renderCustomItemsList(customInCategory);
    }
  }
  
  container.innerHTML = html;
}

// 渲染分类区块
function renderCategorySection(key, cat) {
  let itemsHtml = cat.items.map(item => renderChecklistItem(item, key)).join('');
  const completedCount = cat.items.filter(i => i.completed).length;
  const progressPercent = Math.round((completedCount / cat.items.length) * 100);
  
  return `
    <div class="glass-card rounded-3xl p-6 fade-in">
      <div class="flex items-center justify-between mb-5">
        <h3 class="font-display text-lg font-semibold text-neutral-700 flex items-center">
          <span class="w-10 h-10 rounded-xl bg-primary-100 flex items-center justify-center mr-3">
            <i class="fas ${cat.icon} text-primary-500"></i>
          </span>
          ${cat.title}
        </h3>
        <div class="flex items-center space-x-3">
          <div class="w-24 h-2 rounded-full bg-neutral-100 overflow-hidden">
            <div class="h-full bg-gradient-to-r from-primary-400 to-primary-600 transition-all duration-500" style="width: ${progressPercent}%"></div>
          </div>
          <span class="text-sm text-neutral-400 whitespace-nowrap">${completedCount}/${cat.items.length}</span>
        </div>
      </div>
      <div class="space-y-2">
        ${itemsHtml}
      </div>
    </div>
  `;
}

// 渲染自定义区块
function renderCustomSection() {
  return `
    <div class="glass-card rounded-3xl p-6 fade-in">
      <div class="flex items-center justify-between mb-5">
        <h3 class="font-display text-lg font-semibold text-neutral-700 flex items-center">
          <span class="w-10 h-10 rounded-xl bg-primary-100 flex items-center justify-center mr-3">
            <i class="fas fa-user-edit text-primary-500"></i>
          </span>
          自定义检查项
        </h3>
        <span class="text-sm text-neutral-400">${customItems.filter(i => i.completed).length}/${customItems.length}</span>
      </div>
      <div class="space-y-2">
        ${customItems.map(item => renderChecklistItem(item, 'custom')).join('')}
      </div>
    </div>
  `;
}

// 渲染自定义项列表
function renderCustomItemsList(items) {
  return `
    <div class="glass-card rounded-3xl p-6 fade-in">
      <div class="flex items-center justify-between mb-5">
        <h3 class="font-display text-lg font-semibold text-neutral-700 flex items-center">
          <span class="w-10 h-10 rounded-xl bg-primary-100 flex items-center justify-center mr-3">
            <i class="fas fa-user-edit text-primary-500"></i>
          </span>
          自定义检查项
        </h3>
      </div>
      <div class="space-y-2">
        ${items.map(item => renderChecklistItem(item, 'custom')).join('')}
      </div>
    </div>
  `;
}

// 渲染单个清单项
function renderChecklistItem(item, category) {
  return `
    <div class="checklist-item ${item.completed ? 'completed' : ''} flex items-start space-x-3 p-3 rounded-xl hover:bg-primary-50 transition-all group" data-id="${item.id}" data-category="${category}">
      <div class="item-checkbox w-6 h-6 rounded-lg border-2 border-neutral-300 flex items-center justify-center cursor-pointer flex-shrink-0 mt-0.5 transition-all" onclick="toggleItem('${item.id}', '${category}')">
        <i class="fas fa-check text-white text-xs"></i>
      </div>
      <p class="item-text flex-1 text-sm text-neutral-700 leading-relaxed">${item.text}</p>
      ${category === 'custom' ? `
        <button onclick="deleteCustomItem('${item.id}')" class="opacity-0 group-hover:opacity-100 transition-opacity text-neutral-400 hover:text-red-500 flex-shrink-0">
          <i class="fas fa-trash text-sm"></i>
        </button>
      ` : ''}
    </div>
  `;
}

// 切换完成状态
function toggleItem(id, category) {
  let item;
  if (category === 'custom') {
    item = customItems.find(i => i.id === id);
  } else {
    item = checklistData[category].items.find(i => i.id === id);
  }
  
  if (item) {
    item.completed = !item.completed;
    renderChecklist();
    renderCategoryNav();
    updateProgress();
    
    if (item.completed) {
      showToast('已完成检查项！', 'success');
    }
  }
}

// 添加自定义项
function addCustomItem() {
  const input = document.getElementById('add-item-input');
  const select = document.getElementById('add-category-select');
  const text = input.value.trim();
  
  if (!text) {
    showToast('请输入检查项内容', 'warning');
    return;
  }
  
  const newItem = {
    id: 'custom_' + Date.now(),
    text: text,
    completed: false,
    category: select.value
  };
  
  customItems.push(newItem);
  input.value = '';
  
  if (currentCategory === 'all' || currentCategory === select.value) {
    renderChecklist();
  }
  renderCategoryNav();
  updateProgress();
  showToast('已添加自定义检查项', 'success');
}

// 删除自定义项
function deleteCustomItem(id) {
  customItems = customItems.filter(i => i.id !== id);
  renderChecklist();
  renderCategoryNav();
  updateProgress();
  showToast('已删除检查项', 'info');
}

// 更新进度
function updateProgress() {
  let total = 0;
  let completed = 0;
  
  Object.values(checklistData).forEach(cat => {
    total += cat.items.length;
    completed += cat.items.filter(i => i.completed).length;
  });
  
  total += customItems.length;
  completed += customItems.filter(i => i.completed).length;
  
  const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
  
  document.getElementById('progress-text').textContent = percent + '%';
  document.getElementById('progress-percent').textContent = percent + '%';
  document.getElementById('completed-count').textContent = completed;
  document.getElementById('pending-count').textContent = total - completed;
  document.getElementById('custom-count').textContent = customItems.length;
  
  // 更新进度环
  const circle = document.getElementById('progress-circle');
  const circumference = 2 * Math.PI * 45;
  const offset = circumference - (percent / 100) * circumference;
  circle.style.strokeDashoffset = offset;
}

// 重置清单
function resetChecklist() {
  Object.values(checklistData).forEach(cat => {
    cat.items.forEach(item => item.completed = false);
  });
  customItems.forEach(item => item.completed = false);
  renderChecklist();
  renderCategoryNav();
  updateProgress();
  showToast('已重置所有检查项', 'info');
}

// 导出清单
function exportChecklist() {
  let content = '装修无忧 - 个人装修自检清单\n';
  content += '生成时间：' + new Date().toLocaleString() + '\n';
  content += '========================================\n\n';
  
  let totalCompleted = 0;
  let totalItems = 0;
  
  Object.keys(checklistData).forEach(key => {
    const cat = checklistData[key];
    const completedCount = cat.items.filter(i => i.completed).length;
    totalCompleted += completedCount;
    totalItems += cat.items.length;
    
    content += '【' + cat.title + '】(' + completedCount + '/' + cat.items.length + ')\n';
    content += '----------------------------------------\n';
    cat.items.forEach((item, index) => {
      content += (item.completed ? '[✓]' : '[ ]') + ' ' + item.text + '\n';
    });
    content += '\n';
  });
  
  if (customItems.length > 0) {
    const customCompleted = customItems.filter(i => i.completed).length;
    totalCompleted += customCompleted;
    totalItems += customItems.length;
    
    content += '【自定义检查项】(' + customCompleted + '/' + customItems.length + ')\n';
    content += '----------------------------------------\n';
    customItems.forEach(item => {
      content += (item.completed ? '[✓]' : '[ ]') + ' ' + item.text + '\n';
    });
  }
  
  content += '\n========================================\n';
  content += '总进度：' + totalCompleted + '/' + totalItems + ' (' + Math.round(totalCompleted/totalItems*100) + '%)\n';
  
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = '装修自检清单_' + new Date().toISOString().slice(0, 10) + '.txt';
  link.click();
  
  showToast('清单已导出', 'success');
}

// 回到顶部
function scrollToTop() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Toast 提示
function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const colors = {
    success: 'bg-green-500',
    warning: 'bg-yellow-500',
    info: 'bg-primary-500',
    error: 'bg-red-500'
  };
  const icons = {
    success: 'fa-check-circle',
    warning: 'fa-exclamation-triangle',
    info: 'fa-info-circle',
    error: 'fa-times-circle'
  };
  
  const toast = document.createElement('div');
  toast.className = `toast ${colors[type]} text-white px-5 py-3 rounded-xl shadow-lg flex items-center space-x-2`;
  toast.innerHTML = `
    <i class="fas ${icons[type]}"></i>
    <span class="text-sm font-medium">${message}</span>
  `;
  
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.remove();
  }, 3000);
}

// 回车键添加
document.getElementById('add-item-input').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    addCustomItem();
  }
});

// 初始化
init();
</script>

</html>
