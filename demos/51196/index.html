<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 美食笔记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #fff5f0 0%, #ffe8d6 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
        }

        header h1 {
            font-size: 2.2em;
            color: #e8590c;
            margin-bottom: 8px;
        }

        header p {
            color: #888;
            font-size: 0.95em;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .nav-tab {
            flex: 1;
            min-width: 80px;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            background: #fff;
            color: #666;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .nav-tab:hover {
            background: #ffe8d6;
        }

        .nav-tab.active {
            background: #e8590c;
            color: #fff;
            box-shadow: 0 4px 12px rgba(232, 89, 12, 0.3);
        }

        .panel {
            display: none;
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
        }

        .panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel h2 {
            font-size: 1.3em;
            margin-bottom: 16px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9em;
            color: #555;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95em;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #e8590c;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-primary {
            background: #e8590c;
            color: #fff;
        }

        .btn-primary:hover {
            background: #d9480f;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(232, 89, 12, 0.3);
        }

        .btn-secondary {
            background: #f1f3f5;
            color: #555;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }

        .tag-option {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #e0e0e0;
            background: #fff;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .tag-option:hover {
            border-color: #e8590c;
            color: #e8590c;
        }

        .tag-option.selected {
            background: #e8590c;
            color: #fff;
            border-color: #e8590c;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 16px;
        }

        .card {
            background: #fff;
            border: 1px solid #f0f0f0;
            border-radius: 14px;
            padding: 18px;
            transition: all 0.3s;
        }

        .card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
        }

        .card-date {
            font-size: 0.8em;
            color: #aaa;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0;
        }

        .card-tag {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.78em;
            background: #fff5f0;
            color: #e8590c;
        }

        .card-note {
            color: #666;
            font-size: 0.9em;
            line-height: 1.5;
            margin-top: 6px;
        }

        .stars {
            color: #ffc078;
            font-size: 1.1em;
        }

        .recipe-result {
            background: #fff8f0;
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            border-left: 4px solid #e8590c;
        }

        .recipe-result h4 {
            color: #e8590c;
            margin-bottom: 10px;
        }

        .recipe-result ul {
            margin-left: 18px;
            line-height: 1.8;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 3em;
            margin-bottom: 12px;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .two-col {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.7em;
            }

            .nav-tabs {
                gap: 6px;
            }

            .nav-tab {
                padding: 10px 12px;
                font-size: 0.85em;
            }
        }

        .delete-btn {
            float: right;
            color: #fa5252;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85em;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background: #fff5f5;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍽️ AI 美食笔记</h1>
            <p>记录美味，发现美食的无限可能</p>
        </header>

        <nav class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('diary')">📓 美食日记</button>
            <button class="nav-tab" onclick="switchTab('recipe')">🥘 AI 菜谱</button>
            <button class="nav-tab" onclick="switchTab('leftover')">🍱 剩菜拯救</button>
            <button class="nav-tab" onclick="switchTab('profile')">👤 口味档案</button>
        </nav>

        <!-- 美食日记 -->
        <div id="diary" class="panel active">
            <h2>记录一次美食体验</h2>
            <div class="form-group">
                <label>餐厅/菜品名称</label>
                <input type="text" id="dName" placeholder="例如：海底捞、妈妈做的红烧肉">
            </div>
            <div class="two-col">
                <div class="form-group">
                    <label>类型</label>
                    <select id="dType">
                        <option>中餐</option>
                        <option>西餐</option>
                        <option>日料</option>
                        <option>韩餐</option>
                        <option>东南亚</option>
                        <option>甜品</option>
                        <option>火锅</option>
                        <option>烧烤</option>
                        <option>其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>人均消费（元）</label>
                    <input type="number" id="dPrice" placeholder="0">
                </div>
            </div>
            <div class="form-group">
                <label>口味标签（可多选）</label>
                <div class="tags" id="dFlavorTags">
                    <span class="tag-option" onclick="toggleTag(this)">酸</span>
                    <span class="tag-option" onclick="toggleTag(this)">甜</span>
                    <span class="tag-option" onclick="toggleTag(this)">苦</span>
                    <span class="tag-option" onclick="toggleTag(this)">辣</span>
                    <span class="tag-option" onclick="toggleTag(this)">咸</span>
                    <span class="tag-option" onclick="toggleTag(this)">鲜</span>
                    <span class="tag-option" onclick="toggleTag(this)">香</span>
                    <span class="tag-option" onclick="toggleTag(this)">麻</span>
                </div>
            </div>
            <div class="form-group">
                <label>推荐指数</label>
                <select id="dRating">
                    <option value="5">⭐⭐⭐⭐⭐ 超赞</option>
                    <option value="4">⭐⭐⭐⭐ 好吃</option>
                    <option value="3">⭐⭐⭐ 一般</option>
                    <option value="2">⭐⭐ 不太行</option>
                    <option value="1">⭐ 踩雷</option>
                </select>
            </div>
            <div class="form-group">
                <label>备注/评价</label>
                <textarea id="dNote" placeholder="记录下你的美食感受..."></textarea>
            </div>
            <button class="btn btn-primary" onclick="addDiary()">➕ 添加记录</button>

            <h2 style="margin-top: 30px;">我的美食记录</h2>
            <div id="diaryList" class="card-list"></div>
        </div>

        <!-- AI 菜谱 -->
        <div id="recipe" class="panel">
            <h2>🧠 AI 智能菜谱推荐</h2>
            <p style="color:#888;margin-bottom:16px;font-size:0.9em;">输入你现有的食材，AI 为你推荐可做的菜品（模拟版）</p>
            <div class="form-group">
                <label>现有食材</label>
                <input type="text" id="rIngredients" placeholder="例如：鸡蛋、番茄、葱、米饭">
            </div>
            <div class="form-group">
                <label>想吃什么口味</label>
                <div class="tags">
                    <span class="tag-option" onclick="toggleTag(this)">清淡</span>
                    <span class="tag-option" onclick="toggleTag(this)">家常</span>
                    <span class="tag-option" onclick="toggleTag(this)">快手</span>
                    <span class="tag-option" onclick="toggleTag(this)">下饭菜</span>
                    <span class="tag-option" onclick="toggleTag(this)">减脂</span>
                    <span class="tag-option" onclick="toggleTag(this)">宴客</span>
                </div>
            </div>
            <button class="btn btn-primary" onclick="generateRecipe()">✨ 生成菜谱</button>
            <div id="recipeResult"></div>
        </div>

        <!-- 剩菜拯救 -->
        <div id="leftover" class="panel">
            <h2>🍱 剩菜拯救计划</h2>
            <p style="color:#888;margin-bottom:16px;font-size:0.9em;">告诉我还剩什么，帮你创意改造</p>
            <div class="form-group">
                <label>剩菜/剩余食材</label>
                <input type="text" id="lFood" placeholder="例如：昨天剩的炸鸡、半块豆腐">
            </div>
            <button class="btn btn-primary" onclick="saveLeftover()">💡 获取改造方案</button>
            <div id="leftoverResult"></div>
        </div>

        <!-- 口味档案 -->
        <div id="profile" class="panel">
            <h2>👤 我的口味档案</h2>
            <div class="form-group">
                <label>你喜欢的口味（可多选）</label>
                <div class="tags" id="pLike">
                    <span class="tag-option" onclick="toggleTag(this)">酸</span>
                    <span class="tag-option" onclick="toggleTag(this)">甜</span>
                    <span class="tag-option" onclick="toggleTag(this)">苦</span>
                    <span class="tag-option" onclick="toggleTag(this)">辣</span>
                    <span class="tag-option" onclick="toggleTag(this)">咸</span>
                    <span class="tag-option" onclick="toggleTag(this)">鲜</span>
                    <span class="tag-option" onclick="toggleTag(this)">香</span>
                    <span class="tag-option" onclick="toggleTag(this)">麻</span>
                </div>
            </div>
            <div class="form-group">
                <label>你不喜欢的食材</label>
                <input type="text" id="pDislike" placeholder="例如：香菜、洋葱、内脏">
            </div>
            <div class="form-group">
                <label>饮食偏好</label>
                <div class="tags">
                    <span class="tag-option" onclick="toggleTag(this)">素食</span>
                    <span class="tag-option" onclick="toggleTag(this)">低糖</span>
                    <span class="tag-option" onclick="toggleTag(this)">低脂</span>
                    <span class="tag-option" onclick="toggleTag(this)">高蛋白</span>
                    <span class="tag-option" onclick="toggleTag(this)">无辣不欢</span>
                </div>
            </div>
            <button class="btn btn-primary" onclick="saveProfile()">💾 保存档案</button>
            <div class="recipe-result" style="margin-top:20px;">
                <h4>📊 档案摘要</h4>
                <p id="profileSummary" style="color:#666;line-height:1.8;">暂无档案信息，请先保存。</p>
            </div>
        </div>
    </div>

    <script>
        // 标签切换
        function switchTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // 标签选择
        function toggleTag(el) {
            el.classList.toggle('selected');
        }

        // 数据存储
        function saveData(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
        }
        function loadData(key) {
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : [];
        }

        // 添加日记
        function addDiary() {
            const name = document.getElementById('dName').value.trim();
            if (!name) {
                alert('请输入餐厅或菜品名称');
                return;
            }

            const flavors = Array.from(document.querySelectorAll('#dFlavorTags .tag-option.selected')).map(t => t.textContent);
            const entry = {
                id: Date.now(),
                name: name,
                type: document.getElementById('dType').value,
                price: document.getElementById('dPrice').value,
                flavors: flavors,
                rating: document.getElementById('dRating').value,
                note: document.getElementById('dNote').value,
                date: new Date().toLocaleString('zh-CN')
            };

            const diaries = loadData('diaries');
            diaries.unshift(entry);
            saveData('diaries', diaries);

            // 清空表单
            document.getElementById('dName').value = '';
            document.getElementById('dPrice').value = '';
            document.getElementById('dNote').value = '';
            document.querySelectorAll('#dFlavorTags .tag-option').forEach(t => t.classList.remove('selected'));

            renderDiaries();
        }

        function renderDiaries() {
            const list = document.getElementById('diaryList');
            const diaries = loadData('diaries');

            if (diaries.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="icon">🍽️</div><p>还没有记录，快去添加你的第一笔美食日记吧！</p></div>';
                return;
            }

            list.innerHTML = diaries.map(d => `
                <div class="card">
                    <div class="card-header">
                        <div>
                            <div class="card-title">${d.name} <span style="font-size:0.8em;color:#888;font-weight:normal;">(${d.type})</span></div>
                            <div class="card-date">${d.date}</div>
                        </div>
                        <div style="text-align:right;">
                            <div class="stars">${'⭐'.repeat(parseInt(d.rating))}</div>
                            ${d.price ? `<div style="font-size:0.85em;color:#888;">¥${d.price}/人</div>` : ''}
                        </div>
                    </div>
                    <div class="card-tags">
                        ${d.flavors.map(f => `<span class="card-tag">${f}</span>`).join('')}
                    </div>
                    ${d.note ? `<div class="card-note">${d.note}</div>` : ''}
                    <button class="delete-btn" onclick="deleteDiary(${d.id})">删除</button>
                </div>
            `).join('');
        }

        function deleteDiary(id) {
            if (!confirm('确定删除这条记录吗？')) return;
            const diaries = loadData('diaries').filter(d => d.id !== id);
            saveData('diaries', diaries);
            renderDiaries();
        }

        // AI 菜谱生成（模拟）
        function generateRecipe() {
            const ingredients = document.getElementById('rIngredients').value.trim();
            if (!ingredients) {
                alert('请输入食材');
                return;
            }

            const ingList = ingredients.split(/[,，、]/).map(s => s.trim()).filter(Boolean);
            const recipeDiv = document.getElementById('recipeResult');

            // 简单的规则匹配模拟 AI 推荐
            const recipes = [];
            
            if (ingList.some(i => i.includes('番茄') || i.includes('西红柿')) && ingList.some(i => i.includes('蛋') || i.includes('鸡蛋'))) {
                recipes.push({
                    name: '番茄炒蛋',
                    steps: ['番茄切块，鸡蛋打散', '热油炒鸡蛋盛出', '炒番茄出汁后倒入鸡蛋', '加盐调味，撒葱花出锅'],
                    tip: '经典国民菜，酸甜开胃！'
                });
            }
            if (ingList.some(i => i.includes('土豆')) && ingList.some(i => i.includes('牛肉'))) {
                recipes.push({
                    name: '土豆炖牛肉',
                    steps: ['牛肉切块焯水', '炒香葱姜蒜和香料', '下牛肉翻炒，加酱油料酒', '加水炖煮40分钟', '下土豆继续炖20分钟至软烂'],
                    tip: '暖心又下饭，土豆吸满肉汁特别香。'
                });
            }
            if (ingList.some(i => i.includes('豆腐'))) {
                recipes.push({
                    name: '家常豆腐',
                    steps: ['豆腐切厚片，煎至两面金黄', '炒香蒜末和豆瓣酱', '下豆腐轻翻，加少量水', '勾薄芡，撒葱花'],
                    tip: '外酥里嫩，配米饭一绝。'
                });
            }
            if (ingList.some(i => i.includes('剩') || i.includes('米饭'))) {
                recipes.push({
                    name: '黄金蛋炒饭',
                    steps: ['剩饭打散，蛋黄拌入米饭', '蛋白炒熟盛出', '热油下米饭炒散炒香', '加入配菜和调料翻炒均匀'],
                    tip: '隔夜饭做炒饭最合适，粒粒分明。'
                });
            }

            if (recipes.length === 0) {
                recipes.push({
                    name: `创意杂烩 (${ingList.join('+')})`,
                    steps: ['将所有食材洗净切好', '热油爆香蒜末', '按易熟程度依次下食材翻炒', '加盐、酱油调味', '加少许水焖煮5分钟', '大火收汁即可'],
                    tip: '发挥创意， sometimes 惊喜就是这样诞生的！'
                });
            }

            recipeDiv.innerHTML = recipes.map(r => `
                <div class="recipe-result">
                    <h4>🍳 ${r.name}</h4>
                    <p style="color:#666;margin-bottom:10px;font-size:0.9em;">${r.tip}</p>
                    <ol style="color:#555;line-height:1.8;">
                        ${r.steps.map(s => `<li>${s}</li>`).join('')}
                    </ol>
                </div>
            `).join('');
        }

        // 剩菜拯救（模拟）
        function saveLeftover() {
            const food = document.getElementById('lFood').value.trim();
            if (!food) {
                alert('请输入剩菜或剩余食材');
                return;
            }

            const ideas = [];
            const f = food.toLowerCase();
            
            if (f.includes('鸡') || f.includes('鸭') || f.includes('肉')) {
                ideas.push('撕成丝，加蔬菜和酱汁拌成凉拌菜');
                ideas.push('切丁做成炒饭/炒面的配料');
                ideas.push('加热后夹进面包/卷饼，变身三明治');
            }
            if (f.includes('鱼')) {
                ideas.push('去刺捣碎，加豆腐做成鱼豆腐羹');
                ideas.push('煎至酥脆，撒椒盐当零食');
            }
            if (f.includes('饭') || f.includes('面')) {
                ideas.push('做成焗饭/焗面，铺芝士烤至金黄');
                ideas.push('捏成饭团，煎一下做成日式烤饭团');
            }
            if (f.includes('蔬菜') || f.includes('菜')) {
                ideas.push('切碎加入鸡蛋液，做成蔬菜蛋饼');
                ideas.push('做成馅料，包饺子或包子');
            }
            if (ideas.length === 0) {
                ideas.push('切块/撕碎，加入鸡蛋和面粉，煎成小饼');
                ideas.push('做成馅料，包进手抓饼或饺子皮');
                ideas.push('加汤底煮成一锅暖胃的杂烩汤');
            }

            document.getElementById('leftoverResult').innerHTML = `
                <div class="recipe-result">
                    <h4>💡 「${food}」改造方案</h4>
                    <ul style="color:#555;line-height:1.9;">
                        ${ideas.map(i => `<li>${i}</li>`).join('')}
                    </ul>
                    <p style="color:#888;font-size:0.85em;margin-top:10px;">小提示：剩菜复热务必彻底加热，确保安全美味。</p>
                </div>
            `;
        }

        // 保存口味档案
        function saveProfile() {
            const likes = Array.from(document.querySelectorAll('#pLike .tag-option.selected')).map(t => t.textContent);
            const dislikes = document.getElementById('pDislike').value;
            const prefs = Array.from(document.querySelectorAll('#profile .tags:nth-of-type(2) .tag-option.selected')).map(t => t.textContent);

            const profile = { likes, dislikes, prefs };
            saveData('profile', profile);

            document.getElementById('profileSummary').innerHTML = `
                <strong>喜欢的口味：</strong>${likes.length ? likes.join('、') : '暂未选择'}<br>
                <strong>不喜欢的食材：</strong>${dislikes || '无'}<br>
                <strong>饮食偏好：</strong>${prefs.length ? prefs.join('、') : '暂未选择'}
            `;

            alert('档案已保存！');
        }

        // 初始化
        renderDiaries();
    </script>
</body>
</html>
