  {icon:"📊",text:"状态",act:"status"},{icon:"🎒",text:"背包",act:"inv"},{icon:"🛒",text:"商店",act:"shop"}
];

function buildMenu(){
  var m=$("ctxMenu");m.innerHTML="";
  for(var i=0;i<menuItems.length;i++){
    var it=menuItems[i];
    if(it.sep){var s=document.createElement("div");s.className="sep";m.appendChild(s);continue}
    var d=document.createElement("div");d.className="item";d.innerHTML='<span>'+it.icon+'</span><span>'+it.text+'</span>';
    d.onclick=(function(a){return function(){menuAct(a)}})(it.act);
    m.appendChild(d);
  }
}
buildMenu();

function menuAct(a){
  $("ctxMenu").style.display="none";
  switch(a){
    case "feed":doFeed();break;case "clean":doClean();break;case "sleep":doSleep();break;
    case "work":doWork();break;case "train":doTrain();break;
    case "adv":togWin("winAdv");renderAdv();break;case "intv":togWin("winIntv");renderIntv();break;case "focus":togWin("winFocus");break;
    case "status":togWin("winStatus");renderStatus();break;case "inv":togWin("winInv");renderInv();break;case "shop":togWin("winShop");renderShop();break;
  }
}

// Right click on pet
$("petWin").oncontextmenu=function(e){e.preventDefault?e.preventDefault():e.returnValue=false;var m=$("ctxMenu");m.style.display="block";m.style.left=Math.min(e.clientX,window.innerWidth-200)+"px";m.style.top=Math.min(e.clientY,window.innerHeight-350)+"px";return false};
$("petBody").oncontextmenu=function(e){e.preventDefault?e.preventDefault():e.returnValue=false;return false};
document.onclick=function(e){if(!e.target.closest(".ctx-menu"))$("ctxMenu").style.display="none"};
$("gearBtn").onclick=function(e){e.stopPropagation();var r=$("petWin").getBoundingClientRect();var m=$("ctxMenu");m.style.display="block";m.style.left=(r.left+20)+"px";m.style.top=(r.top+80)+"px"};

// ==================== ACTIONS ====================
function doFeed(){if(S.gold<10){showT("💰 金币不足！(需10G)");return}S.gold-=10;S.satiety=Math.min(100,S.satiety+25);S.stamina=Math.min(100,S.stamina+3);S.mood=Math.min(100,S.mood+5);S.exp+=3;showT("🍽️ 喂食完成！饱食+25 体力+3");danmu("好吃！再来一份~");updateLvl();}
function doClean(){S.hygiene=Math.min(100,S.hygiene+30);S.mood=Math.min(100,S.mood+5);S.charm+=3;showT("🧼 清洁完成！清洁+30 心情+5");danmu("清爽多了！");updateLvl();}
function doSleep(){S.stamina=Math.min(100,S.stamina+40);S.mood=Math.min(100,S.mood+8);S.resting=0;S.exp+=3;showT("😴 睡眠恢复！体力+40");danmu("zzZ...");updateLvl();}
function doWork(){if(S.stamina<15){showT("⚡ 体力不足！");return}startAct("work",30);}
function doTrain(){if(S.gold<30){showT("💰 金币不足！(需30G)");return}if(S.stamina<20){showT("⚡ 体力不足！");return}if(S.mood<30){showT("😔 心情太差！");return}startAct("train",45);}

function startAct(tp,sec){if(actRun){showT("已有进行中的活动");return}actRun=1;actTp=tp;actEl=0;actDur=sec;$("actBar").style.display="flex";$("actTitle").textContent=tp==="work"?"💼 便利店兼职":"🎤 声乐培训";updateActPos();actTmr=setInterval(function(){actEl++;var pct=Math.min(100,actEl/actDur*100);$("actFl").style.width=pct+"%";var rem=Math.max(0,actDur-actEl);$("actTm").textContent=Math.floor(rem/60)+":"+(rem%60).toString().padStart(2,"0");if(actEl>=actDur){finishAct()}},1000)}
function finishAct(){clearInterval(actTmr);actRun=0;$("actBar").style.display="none";if(actTp==="work"){S.stamina=Math.max(0,S.stamina-20);S.satiety=Math.max(0,S.satiety-8);S.hygiene=Math.max(0,S.hygiene-5);S.mood=Math.max(0,S.mood-3);S.gold+=20;S.exp+=5;showT("💼 打工完成！金币+20");danmu("打工赚钱！");}else{S.gold-=30;S.stamina=Math.max(0,S.stamina-15);S.satiety=Math.max(0,S.satiety-8);S.hygiene=Math.max(0,S.hygiene-5);S.mood=Math.max(0,S.mood-2);S.vocal+=8;S.exp+=10;showT("🎤 培训完成！唱功+8");danmu("练习！练习！");}checkPromo();updateLvl();}
function updateActPos(){var b=$("actBar");b.style.left=(petX+(160-280)/2)+"px";b.style.top=(petY+220+12)+"px"}

function checkPromo(){if(S.stage===1&&S.vocal>=25&&S.dance>=25&&S.charm>=25&&(S.vocal+S.dance+S.charm)>=95){S.stage=2;S.mood=100;S.gold+=100;S.fans+=50;showN("🎉 晋升！","恭喜成为见习练习生！");}else if(S.stage===2&&S.vocal>=80&&S.dance>=80&&S.charm>=60){S.stage=3;S.mood=100;S.gold+=200;S.fans+=200;showN("🎉 晋升！","恭喜成为公开练习生！");}}
function updateLvl(){var st=STAGES[S.stage-1]||STAGES[0];$("petLvl").textContent="Lv."+S.level+" "+st.e+" "+st.n}

// ==================== RENDER ====================
function renderStatus(){
  var st=STAGES[S.stage-1]||STAGES[0];var rt=S.route===1?"公开":S.route===2?"未公开":"未定";
  var h='<div style="font-weight:700;font-size:13px;margin-bottom:4px">练习生状态</div><div style="height:1px;background:#E5E5E5;margin:8px 0"></div>';
  h+='<div class="status-row"><span>身份</span><span class="v">'+st.e+" "+st.n+" ("+rt+")"+'</span></div>';
  h+='<div class="status-row"><span>等级</span><span class="v">Lv.'+S.level+'</span></div>';
  h+='<div class="status-row"><span>金币</span><span class="v">'+S.gold+'G</span></div>';
  h+='<div class="status-row"><span>星星</span><span class="v">'+S.star+'</span></div>';
  h+='<div style="height:1px;background:#E5E5E5;margin:8px 0"></div>';
  h+='<div class="status-row"><span>饱食</span><span class="v">'+Math.floor(S.satiety)+'/100</span></div>';
  h+='<div class="status-row"><span>体力</span><span class="v">'+Math.floor(S.stamina)+'/100</span></div>';
  h+='<div class="status-row"><span>清洁</span><span class="v">'+Math.floor(S.hygiene)+'/100</span></div>';
  h+='<div class="status-row"><span>心情</span><span class="v">'+Math.floor(S.mood)+'/100</span></div>';
  h+='<div class="status-row"><span>疲劳</span><span class="v">'+Math.floor(S.fatigue)+'</span></div>';
  h+='<div style="height:1px;background:#E5E5E5;margin:8px 0"></div>';
  h+='<div class="status-row"><span>唱功</span><span class="v">'+Math.floor(S.vocal)+'</span></div>';
  h+='<div class="status-row"><span>舞蹈</span><span class="v">'+Math.floor(S.dance)+'</span></div>';
  h+='<div class="status-row"><span>演技</span><span class="v">'+Math.floor(S.acting)+'</span></div>';
  h+='<div class="status-row"><span>综艺</span><span class="v">'+Math.floor(S.variety)+'</span></div>';
  h+='<div class="status-row"><span>魅力</span><span class="v">'+Math.floor(S.charm)+'</span></div>';
  h+='<div class="status-row"><span>人气</span><span class="v">'+Math.floor(S.popularity)+'</span></div>';
  h+='<div class="status-row"><span>粉丝</span><span class="v">'+Math.floor(S.fans)+'</span></div>';
  $("statusC").innerHTML=h;
}

function renderShop(){
  var t=$("shopTabs");t.innerHTML="";
  for(var i=0;i<SHOP.length;i++){var b=document.createElement("div");b.className="shop-tab"+(i===shopCat?" on":"");b.textContent=SHOP[i].c;b.onclick=(function(idx){return function(){shopCat=idx;renderShop()}})(i);t.appendChild(b)}
  var g=$("shopGrid");g.innerHTML="";var cat=SHOP[shopCat];
  for(var i=0;i<cat.items.length;i++){var it=cat.items[i];var d=document.createElement("div");d.className="shop-it";d.innerHTML='<div class="n">'+it.n+'</div><div class="e">'+it.e+'</div>'+(it.d?'<div class="d">'+it.d+'</div>':'')+'<div class="b"><span class="p">'+it.p+'G</span><button class="buy" onclick="buyIt('+shopCat+','+i+')">购买</button></div>';g.appendChild(d)}
}
function buyIt(ci,ii){var it=SHOP[ci].items[ii];if(S.gold<it.p){showT("💰 金币不足！");return}S.gold-=it.p;S.inventory[it.n]=(S.inventory[it.n]||0)+1;showT("🛒 已购买 "+it.n);renderInv();updateLvl();}

function renderInv(){
  var g=$("invGrid");g.innerHTML="";var keys=Object.keys(S.inventory);
  if(keys.length===0){g.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#999;padding:20px">背包是空的</div>';return}
  for(var i=0;i<keys.length;i++){var d=document.createElement("div");d.className="inv-it";d.innerHTML='<div class="cnt">'+S.inventory[keys[i]]+'</div><div>'+keys[i]+'</div>';g.appendChild(d)}
}

// ==================== ADVENTURE ====================
function renderAdv(){
  var c=$("advC");
  if(advP===0){
    if(S.charm<28){c.innerHTML='<div style="text-align:center;color:#999;padding:20px">暂无活跃奇遇<br>魅力达到28后可能触发「星探的凝视」</div>';return}
    c.innerHTML='<div style="text-align:center;padding:16px"><div style="font-size:28px;margin-bottom:6px">✨</div><div style="font-weight:700;margin-bottom:4px">奇遇触发</div><div style="color:#666;margin-bottom:12px">「星探的凝视」</div><button class="adv-b" onclick="startAdv()">进入剧情</button></div>';
  }else if(advP===1){
    var st=ADV.stages[advS];
    var h='<div class="adv-tx">'+st.t.replace(/\n/g,"<br>")+'</div><div class="adv-bt">';
    for(var i=0;i<st.ch.length;i++){h+='<button class="adv-b" onclick="chooseAdv('+i+')">'+st.ch[i].tx+'</button>'}
    h+='</div>';c.innerHTML=h;
  }else if(advP===2){
    c.innerHTML='<div style="text-align:center;padding:16px"><div style="font-size:28px;margin-bottom:6px">🎉</div><div style="font-weight:700;margin-bottom:4px">奇遇完成</div><div style="color:#666;margin-bottom:10px">'+ADV.name+'</div><div class="adv-tx">'+ADV.end.replace(/\n/g,"<br>")+'</div></div>';
  }
}
function startAdv(){advP=1;advS=0;renderAdv()}
function chooseAdv(idx){
  var ch=ADV.stages[advS].ch[idx];var ef=ch.ef||{};
  if(ef.charm)S.charm+=ef.charm;if(ef.mood)S.mood=Math.min(100,S.mood+ef.mood);if(ef.stamina)S.stamina=Math.min(100,S.stamina+ef.stamina);
  if(ef.vocal)S.vocal+=ef.vocal;if(ef.dance)S.dance+=ef.dance;if(ef.stage_up){S.stage=ef.stage_up;S.mood=100;S.gold+=100;S.fans+=50}
  if(ch.nx==="end"){advP=2;showT("✨ 奇遇完成！获得特质「星探发掘」");S.traits.push("星探发掘");S.adventure_history.push("starscout");checkPromo();}
  else if(ch.nx==="end_v"){advP=0;showT("💭 你选择了观望...");}
  else{advS++;for(var i=0;i<ADV.stages.length;i++){if(ADV.stages[i].id===ch.nx){advS=i;break}}}
  updateLvl();renderAdv();
}

// ==================== INTERVIEW ====================
var INTV_ST=[
{t:"准备阶段",tx:"你在练习室热身。今天是你去星娱公司面试的日子。你从昨晚就开始紧张，现在手心全是汗。"},
{t:"叫号阶段",tx:"星娱大厦的前台叫了你的号码。你站起来，深吸一口气。走廊很长，你走得比想象中稳。"},
{t:"才艺展示",tx:"你站在评委面前，唱了一首准备了一个月的歌。声音有点抖，但你没有停下。"},
{t:"镜头测试",tx:"摄像师让你对着镜头笑。你挤出一个笑容，想起舞蹈老师说过的话：镜头会吃掉一半的表情，所以要给两倍。"},
{t:"问答环节",tx:"「为什么想做练习生？」「能承受多大的压力？」「如果三年不能出道怎么办？」你如实回答。"},
{t:"等候结果",tx:"你坐在走廊的椅子上，盯着地板。时间过得很慢。有人从你身边走过，你没有抬头。"},
{t:"结果公布",tx:"「恭喜你，通过了。」你抬头，看见姜民赫站在你面前，嘴角有一抹很淡的笑。"}
];
function renderIntv(){
  var c=$("intvC");
  if(intvS>=INTV_ST.length){c.innerHTML='<div style="text-align:center;padding:16px"><div style="font-size:28px;margin-bottom:6px">🎉</div><div style="font-weight:700">面试通过！</div><div style="color:#666;margin-top:6px">你已成为见习练习生</div></div>';S.stage=2;S.mood=100;updateLvl();return}
  var s=INTV_ST[intvS];c.innerHTML='<div class="intv-st">'+(intvS+1)+'/7 '+s.t+'</div><div class="intv-tx">'+s.tx+'</div><div><button class="intv-b" onclick="nextIntv()">继续</button></div>';
}
function nextIntv(){intvS++;renderIntv()}

// ==================== FOCUS ====================
function togFocus(){if(focusRun){cancelFocus();return}focusRun=1;focusEl=0;$("focusGo").textContent="暂停";focusTmr=setInterval(function(){focusEl++;var rem=Math.max(0,focusDur-focusEl);$("focusTm").textContent=Math.floor(rem/60)+":"+(rem%60).toString().padStart(2,"0");$("focusFl").style.width=(focusEl/focusDur*100)+"%";if(focusEl>=focusDur){endFocus()}},1000)}
function cancelFocus(){focusRun=0;clearInterval(focusTmr);$("focusGo").textContent="开始";$("focusTm").textContent="25:00";$("focusFl").style.width="0%";showT("专注模式已取消")}
function endFocus(){cancelFocus();showT("🍅 专注完成！心情+10");S.mood=Math.min(100,S.mood+10);updateLvl()}

// ==================== DANMU ====================
function danmu(text){
  var d=document.createElement("div");d.className="danmaku";d.textContent=text;
  d.style.left=(petX+80+Math.random()*30-15)+"px";d.style.top=(petY-5)+"px";
  $("desktop").appendChild(d);setTimeout(function(){d.remove()},4000);
}

// ==================== DECAY ====================
setInterval(function(){
  S.satiety=Math.max(0,S.satiety-0.4);S.hygiene=Math.max(0,S.hygiene-0.25);S.mood=Math.max(0,S.mood-0.15);S.stamina=Math.max(0,S.stamina-0.1);S.fatigue=Math.max(0,S.fatigue-0.05);
  if(S.stamina<=0&&!S.resting){S.resting=1;danmu("体力耗尽，必须休息！");showT("⚡ 体力耗尽！强制休息")}
  if(S.resting){S.stamina=Math.min(100,S.stamina+5);if(S.stamina>=30){S.resting=0;danmu("体力恢复了！")}}
  if(Math.random()<0.02)danmu(DANMU[Math.floor(Math.random()*DANMU.length)]);
  updateLvl();
},3000);

// Pet click
$("petBody").onclick=function(){danmu(["呀！别戳我~","嘿嘿，好痒！","有什么事吗？","我在呢！","加油加油！"][Math.floor(Math.random()*5)]);S.mood=Math.min(100,S.mood+3);updateLvl()};

// Hide help tip after 5s
setTimeout(function(){$("helpTip").style.display="none"},8000);

// Init
updateLvl();
danmu("你好！我是练习生~");
</script>
</body>
