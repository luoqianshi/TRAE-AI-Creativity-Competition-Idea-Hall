<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>和解剧场 · 把一段聊天救回来</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23130916'/%3E%3Cpath d='M12 16h40v28c0 5-4 9-9 9H21c-5 0-9-4-9-9V16Z' fill='%23ffb45b'/%3E%3Cpath d='M20 24h24M20 33h16M20 42h20' stroke='%23130916' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #110913;
      --ink: #190e18;
      --panel: rgba(35, 22, 29, 0.82);
      --panel-2: rgba(48, 29, 35, 0.76);
      --panel-strong: rgba(63, 35, 39, 0.92);
      --line: rgba(255, 217, 164, 0.18);
      --line-strong: rgba(255, 201, 122, 0.44);
      --text: #fff7ea;
      --muted: #d5bca4;
      --quiet: #9f8274;
      --amber: #ffb45b;
      --gold: #ffd28a;
      --rose: #ff727f;
      --cyan: #5ee5e8;
      --green: #5ee0a2;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.46);
      --radius: 8px;
      --font: Inter, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      color: var(--text);
      font-family: var(--font);
      background:
        linear-gradient(90deg, rgba(75, 19, 30, 0.45) 0 12%, transparent 12% 88%, rgba(75, 19, 30, 0.45) 88% 100%),
        repeating-linear-gradient(90deg, rgba(255, 185, 99, 0.04) 0 1px, transparent 1px 48px),
        linear-gradient(145deg, #130814 0%, #21111a 44%, #0f0912 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(110deg, transparent 0 28%, rgba(255, 190, 91, 0.14) 47%, transparent 64%),
        linear-gradient(250deg, transparent 0 40%, rgba(94, 229, 232, 0.08) 52%, transparent 68%);
      opacity: 0.78;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(100%, 1680px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .brand-mark {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      flex: 0 0 72px;
      border: 1px solid rgba(255, 194, 110, 0.36);
      border-radius: var(--radius);
      color: var(--amber);
      background:
        linear-gradient(180deg, rgba(82, 43, 45, 0.88), rgba(28, 17, 24, 0.92));
      box-shadow: inset 0 0 28px rgba(255, 181, 89, 0.13), 0 18px 42px rgba(0, 0, 0, 0.34);
    }

    .brand-mark svg {
      width: 48px;
      height: 48px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(34px, 4vw, 56px);
      line-height: 1;
      font-weight: 950;
      letter-spacing: 0;
    }

    .brand p {
      margin: 9px 0 0;
      color: var(--gold);
      font-size: clamp(18px, 1.8vw, 26px);
      line-height: 1.2;
      font-weight: 850;
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status,
    .preview-switch {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(29, 17, 24, 0.72);
      box-shadow: inset 0 0 18px rgba(255, 195, 119, 0.06);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      padding: 0 14px;
      color: var(--muted);
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: var(--green);
      box-shadow: 0 0 16px rgba(94, 224, 162, 0.8);
    }

    .preview-switch {
      display: flex;
      gap: 4px;
      padding: 4px;
    }

    .preview-btn {
      min-width: 64px;
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--muted);
      background: transparent;
      font-weight: 850;
    }

    .preview-btn.is-active {
      color: #1d1010;
      background: var(--amber);
      box-shadow: 0 0 18px rgba(255, 180, 91, 0.3);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(420px, 0.95fr) minmax(520px, 1.05fr);
      gap: 20px;
      align-items: start;
      min-width: 0;
    }

    .left-column,
    .right-column {
      display: grid;
      gap: 16px;
      min-width: 0;
    }

    .panel,
    .stage-panel,
    .result-card {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(43, 25, 32, 0.88), rgba(24, 15, 22, 0.92));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel {
      padding: 18px;
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-no {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 34px;
      border-radius: var(--radius);
      color: #201008;
      background: linear-gradient(180deg, #ffd28a, #ff9f3d);
      font-size: 19px;
      font-weight: 950;
    }

    .section-title h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: 0;
      font-weight: 950;
    }

    .section-title p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }

    .sample-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .sample-btn,
    .small-btn {
      border: 1px solid rgba(255, 214, 157, 0.18);
      border-radius: var(--radius);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      min-height: 40px;
      padding: 0 10px;
      font-weight: 800;
    }

    .sample-btn.is-active,
    .small-btn.is-active {
      color: #24100b;
      border-color: transparent;
      background: var(--amber);
    }

    .chat-input {
      width: 100%;
      min-height: 252px;
      resize: vertical;
      display: block;
      border: 1px solid rgba(255, 214, 157, 0.22);
      border-radius: var(--radius);
      padding: 15px;
      color: var(--text);
      background: rgba(15, 10, 14, 0.78);
      line-height: 1.7;
      outline: none;
    }

    .chat-input:focus {
      border-color: rgba(255, 180, 91, 0.72);
      box-shadow: 0 0 0 3px rgba(255, 180, 91, 0.1);
    }

    .input-footer,
    .panel-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      color: var(--quiet);
      font-size: 13px;
    }

    .primary-btn,
    .copy-btn {
      min-height: 48px;
      border: 0;
      border-radius: var(--radius);
      padding: 0 20px;
      color: #221005;
      background: linear-gradient(180deg, #ffd28a, #ff9d2e);
      box-shadow: 0 16px 34px rgba(255, 157, 46, 0.24);
      font-weight: 950;
      white-space: nowrap;
    }

    .copy-btn {
      color: var(--text);
      border: 1px solid rgba(255, 214, 157, 0.24);
      background: rgba(31, 18, 24, 0.8);
      box-shadow: none;
    }

    .heat-list {
      display: grid;
      gap: 10px;
    }

    .heat-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      border: 1px solid rgba(255, 214, 157, 0.16);
      border-radius: var(--radius);
      padding: 12px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.035);
      text-align: left;
    }

    .heat-item.is-active {
      border-color: rgba(255, 114, 127, 0.6);
      background: rgba(255, 114, 127, 0.1);
    }

    .heat-rank {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 99px;
      color: #fff;
      background: var(--rose);
      font-weight: 900;
    }

    .heat-copy {
      min-width: 0;
    }

    .heat-copy strong {
      display: block;
      line-height: 1.35;
      font-weight: 900;
    }

    .heat-copy span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .heat-tag {
      align-self: start;
      border-radius: 999px;
      padding: 5px 9px;
      color: #210b12;
      background: #ffc0c7;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .stage-panel {
      padding: 18px;
    }

    .stage-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .stage-top h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 950;
    }

    .stage-top p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .temperature {
      width: 220px;
      flex: 0 0 220px;
      border: 1px solid rgba(255, 214, 157, 0.18);
      border-radius: var(--radius);
      padding: 12px;
      background: rgba(255, 255, 255, 0.04);
    }

    .temperature span {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .meter {
      height: 9px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    .meter-fill {
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--rose), var(--amber), var(--green));
      transition: width 240ms ease;
    }

    .stage {
      position: relative;
      min-height: 398px;
      border: 1px solid rgba(255, 214, 157, 0.18);
      border-radius: var(--radius);
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(107, 32, 42, 0.58) 0 11%, transparent 11% 89%, rgba(107, 32, 42, 0.58) 89% 100%),
        radial-gradient(ellipse at 50% 12%, rgba(255, 215, 149, 0.24), transparent 46%),
        linear-gradient(180deg, rgba(38, 19, 25, 0.94), rgba(12, 8, 12, 0.96));
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(90deg, rgba(255, 195, 120, 0.07) 0 1px, transparent 1px 36px),
        linear-gradient(180deg, transparent 0 72%, rgba(0, 0, 0, 0.28) 72% 100%);
      pointer-events: none;
    }

    .spotlight {
      position: absolute;
      left: 50%;
      top: 0;
      width: 48%;
      height: 100%;
      transform: translateX(-50%);
      clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
      background: linear-gradient(180deg, rgba(255, 221, 162, 0.23), rgba(255, 180, 91, 0.04) 72%, transparent);
      pointer-events: none;
    }

    .perspective-grid {
      position: relative;
      z-index: 1;
      min-height: 398px;
      padding: 26px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 170px minmax(0, 1fr);
      gap: 18px;
      align-items: end;
    }

    .actor {
      min-width: 0;
      border: 1px solid rgba(255, 214, 157, 0.2);
      border-radius: var(--radius);
      background: rgba(18, 10, 15, 0.76);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
      overflow: hidden;
    }

    .actor-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 14px;
      border-bottom: 1px solid rgba(255, 214, 157, 0.12);
      color: var(--gold);
      font-weight: 950;
    }

    .avatar {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: #211008;
      background: var(--amber);
      flex: 0 0 32px;
    }

    .actor-body {
      padding: 14px;
      min-height: 134px;
    }

    .actor-body p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }

    .shared-need {
      align-self: center;
      border: 1px solid rgba(94, 229, 232, 0.32);
      border-radius: var(--radius);
      padding: 14px;
      background: rgba(22, 66, 69, 0.54);
      text-align: center;
      color: #d8ffff;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
    }

    .shared-need small {
      display: block;
      color: #91d4d8;
      font-weight: 800;
    }

    .shared-need strong {
      display: block;
      margin-top: 8px;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 950;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .suggestion-card {
      min-width: 0;
      min-height: 184px;
      display: grid;
      align-content: space-between;
      gap: 12px;
      border: 1px solid rgba(255, 214, 157, 0.18);
      border-radius: var(--radius);
      padding: 14px;
      background: rgba(255, 255, 255, 0.04);
    }

    .suggestion-card.is-active {
      border-color: rgba(94, 229, 232, 0.6);
      background: rgba(94, 229, 232, 0.08);
    }

    .suggestion-card h3 {
      margin: 0;
      color: var(--gold);
      font-size: 18px;
      line-height: 1.28;
    }

    .suggestion-card p {
      margin: 10px 0 0;
      color: var(--text);
      line-height: 1.65;
      font-size: 14px;
    }

    .rehearsal {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 12px;
    }

    .chat-stage {
      min-height: 226px;
      border: 1px solid rgba(255, 214, 157, 0.16);
      border-radius: var(--radius);
      padding: 14px;
      background: rgba(12, 8, 12, 0.64);
    }

    .bubble {
      width: fit-content;
      max-width: min(80%, 560px);
      margin-bottom: 10px;
      border-radius: var(--radius);
      padding: 10px 12px;
      line-height: 1.55;
      font-size: 14px;
    }

    .bubble.me {
      margin-left: auto;
      color: #201008;
      background: var(--amber);
    }

    .bubble.other {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 214, 157, 0.14);
    }

    .rehearsal-note {
      border: 1px solid rgba(94, 229, 232, 0.22);
      border-radius: var(--radius);
      padding: 14px;
      background: rgba(23, 64, 67, 0.42);
    }

    .rehearsal-note h3 {
      margin: 0;
      color: #d8ffff;
      font-size: 18px;
      line-height: 1.3;
    }

    .rehearsal-note p {
      margin: 10px 0 0;
      color: #a6d6d8;
      line-height: 1.55;
      font-size: 14px;
    }

    .result-card {
      background:
        linear-gradient(180deg, rgba(86, 49, 34, 0.92), rgba(32, 19, 20, 0.96)),
        linear-gradient(90deg, rgba(255, 180, 91, 0.2), transparent);
      border-color: rgba(255, 180, 91, 0.45);
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 214, 157, 0.14);
    }

    .result-head h2 {
      margin: 0;
      font-size: clamp(26px, 3vw, 38px);
      line-height: 1.12;
      font-weight: 950;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 0;
    }

    .final-message,
    .do-not-say {
      padding: 18px 20px;
    }

    .final-message {
      border-right: 1px solid rgba(255, 214, 157, 0.14);
    }

    .final-message h3,
    .do-not-say h3 {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 18px;
    }

    .final-message p,
    .do-not-say p {
      margin: 0;
      line-height: 1.75;
      color: #ffe8c8;
      font-size: 15px;
    }

    .result-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 20px 18px;
      border-top: 1px solid rgba(255, 214, 157, 0.14);
      color: #ffdca7;
      line-height: 1.55;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 30;
      transform: translate(-50%, 16px);
      opacity: 0;
      pointer-events: none;
      border: 1px solid rgba(94, 224, 162, 0.44);
      border-radius: var(--radius);
      color: #e7fff3;
      background: rgba(18, 55, 41, 0.94);
      padding: 12px 16px;
      box-shadow: var(--shadow);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.is-showing {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (prefers-reduced-motion: reduce) {
      .meter-fill,
      .toast {
        transition: none;
      }
    }

    @media (max-width: 1180px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: 360px;
      }
    }

    @media (max-width: 760px) {
      .app {
        padding: 14px;
        gap: 14px;
      }

      .topbar,
      .top-actions,
      .stage-top,
      .input-footer,
      .panel-footer,
      .result-footer {
        display: grid;
        grid-template-columns: 1fr;
        justify-items: stretch;
      }

      .brand {
        gap: 12px;
      }

      .brand-mark {
        width: 62px;
        height: 62px;
        flex-basis: 62px;
      }

      .brand-mark svg {
        width: 42px;
        height: 42px;
      }

      .status,
      .preview-switch,
      .temperature {
        width: 100%;
      }

      .preview-btn {
        flex: 1;
      }

      .sample-row,
      .suggestions,
      .rehearsal,
      .result-grid,
      .perspective-grid {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: auto;
      }

      .perspective-grid {
        min-height: 0;
        padding: 16px;
        align-items: stretch;
      }

      .shared-need {
        order: -1;
      }

      .final-message {
        border-right: 0;
        border-bottom: 1px solid rgba(255, 214, 157, 0.14);
      }
    }

    body.portrait-preview .app {
      width: min(430px, calc(100vw - 28px));
      max-width: 430px;
      padding: 14px 0 18px;
    }

    body.portrait-preview .topbar,
    body.portrait-preview .top-actions,
    body.portrait-preview .workspace,
    body.portrait-preview .stage-top,
    body.portrait-preview .input-footer,
    body.portrait-preview .panel-footer,
    body.portrait-preview .result-footer,
    body.portrait-preview .sample-row,
    body.portrait-preview .suggestions,
    body.portrait-preview .rehearsal,
    body.portrait-preview .result-grid,
    body.portrait-preview .perspective-grid {
      display: grid;
      grid-template-columns: 1fr;
      justify-items: stretch;
    }

    body.portrait-preview .brand {
      gap: 12px;
    }

    body.portrait-preview .brand-mark {
      width: 62px;
      height: 62px;
      flex-basis: 62px;
    }

    body.portrait-preview .brand h1 {
      font-size: 38px;
    }

    body.portrait-preview .brand p {
      font-size: 22px;
    }

    body.portrait-preview .status,
    body.portrait-preview .preview-switch,
    body.portrait-preview .temperature {
      width: 100%;
    }

    body.portrait-preview .chat-input {
      min-height: 230px;
    }

    body.portrait-preview .perspective-grid {
      min-height: 0;
      padding: 16px;
      align-items: stretch;
    }

    body.portrait-preview .shared-need {
      order: -1;
    }

    body.portrait-preview .final-message {
      border-right: 0;
      border-bottom: 1px solid rgba(255, 214, 157, 0.14);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand" aria-label="和解剧场">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <path d="M12 16h40v28c0 5-4 9-9 9H21c-5 0-9-4-9-9V16Z" fill="currentColor" opacity=".95"/>
            <path d="M20 24h24M20 33h16M20 42h20" stroke="#1d1010" stroke-width="4" stroke-linecap="round"/>
            <path d="M16 16 10 8M48 16l6-8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1>和解剧场</h1>
          <p>把一段聊天救回来</p>
        </div>
      </div>

      <div class="top-actions" aria-label="页面工具">
        <div class="status"><span class="status-dot" aria-hidden="true"></span>AI 情绪导演已就绪</div>
        <div class="preview-switch" role="group" aria-label="预览方向">
          <button class="preview-btn is-active" type="button" data-preview="landscape">横屏</button>
          <button class="preview-btn" type="button" data-preview="portrait">竖屏</button>
        </div>
      </div>
    </header>

    <main class="workspace">
      <section class="left-column" aria-label="输入和分析">
        <section class="panel" aria-labelledby="input-title">
          <div class="section-head">
            <span class="section-no">1</span>
            <div class="section-title">
              <h2 id="input-title">贴上聊天，开演</h2>
              <p>不用写小作文。把冲突片段贴进来，AI 先看哪里真的伤人。</p>
            </div>
          </div>

          <div class="sample-row" id="sampleRow"></div>
          <textarea id="chatInput" class="chat-input" spellcheck="false" aria-label="聊天内容"></textarea>

          <div class="input-footer">
            <span id="charCount">0 字</span>
            <button class="primary-btn" type="button" id="startBtn">开演</button>
          </div>
        </section>

        <section class="panel" aria-labelledby="heat-title">
          <div class="section-head">
            <span class="section-no">2</span>
            <div class="section-title">
              <h2 id="heat-title">误会热区</h2>
              <p>点一句台词，舞台会解释它为什么让关系卡住。</p>
            </div>
          </div>
          <div class="heat-list" id="heatList"></div>
        </section>

        <section class="result-card" aria-labelledby="card-title">
          <div class="result-head">
            <h2 id="card-title">和解卡</h2>
            <button class="primary-btn" type="button" id="makeCardBtn">生成和解卡</button>
          </div>
          <div class="result-grid">
            <div class="final-message">
              <h3>可以直接发</h3>
              <p id="finalMessage"></p>
            </div>
            <div class="do-not-say">
              <h3>这句先别说</h3>
              <p id="avoidLine"></p>
            </div>
          </div>
          <div class="result-footer">
            <span id="nextStep"></span>
            <button class="copy-btn" type="button" id="copyCardBtn">复制和解卡</button>
          </div>
        </section>
      </section>

      <section class="right-column" aria-label="剧场和排练">
        <section class="stage-panel" aria-labelledby="stage-title">
          <div class="stage-top">
            <div>
              <h2 id="stage-title">双视角舞台</h2>
              <p id="stageSummary">同一句话，在两个人心里会演成两场戏。</p>
            </div>
            <div class="temperature" aria-label="气氛温度">
              <span><b>气氛温度</b><b id="temperatureText">38 / 100</b></span>
              <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
            </div>
          </div>

          <div class="stage">
            <div class="spotlight" aria-hidden="true"></div>
            <div class="perspective-grid">
              <article class="actor">
                <div class="actor-head"><span class="avatar">我</span>我以为我在说</div>
                <div class="actor-body"><p id="myView"></p></div>
              </article>
              <div class="shared-need">
                <small>共同想要</small>
                <strong id="sharedNeed"></strong>
              </div>
              <article class="actor">
                <div class="actor-head"><span class="avatar">TA</span>对方可能听成</div>
                <div class="actor-body"><p id="theirView"></p></div>
              </article>
            </div>
          </div>
        </section>

        <section class="panel" aria-labelledby="suggest-title">
          <div class="section-head">
            <span class="section-no">3</span>
            <div class="section-title">
              <h2 id="suggest-title">三句可发</h2>
              <p>每一句都不是讨好，而是在降低防御、保留边界。</p>
            </div>
          </div>
          <div class="suggestions" id="suggestions"></div>
        </section>

        <section class="panel" aria-labelledby="rehearse-title">
          <div class="section-head">
            <span class="section-no">4</span>
            <div class="section-title">
              <h2 id="rehearse-title">排练一次</h2>
              <p>先在这里试一句，看看气氛会不会继续往坏处走。</p>
            </div>
          </div>
          <div class="rehearsal">
            <div class="chat-stage" id="rehearsalChat"></div>
            <aside class="rehearsal-note">
              <h3 id="rehearsalTitle"></h3>
              <p id="rehearsalNote"></p>
            </aside>
          </div>
        </section>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">已更新</div>

  <script>
    const scenarios = {
      lover: {
        label: "恋人冷战",
        chat: "我：你今天又这么晚才回消息。\nTA：我不是说了在忙吗？\n我：忙到一句话都没时间？\nTA：你每次都这样，我真的很累。\n我：行，那你忙吧。\nTA：你看，又开始阴阳怪气。",
        heat: [
          ["忙到一句话都没时间？", "表面在问时间，听起来像审问和否定。", "审问感"],
          ["行，那你忙吧。", "这句话像退场，其实会把对方推到更远。", "冷处理"],
          ["你每次都这样", "把一次事件升级成整个人的问题，防御会立刻升高。", "扩大化"]
        ],
        myView: "我想确认自己是不是还重要，也想要一点被放在心上的感觉。",
        theirView: "TA可能听成：你不相信我，也不允许我有自己的压力和节奏。",
        sharedNeed: "被重视，也被理解",
        summary: "这段关系不是缺少爱，而是两个人都在用防御表达需要。",
        suggestions: [
          ["柔软开场", "我刚才不是想审你，我其实是有点失落，想知道你还在不在意我。", 72],
          ["有边界版", "我能理解你忙，但我也希望忙的时候能有一句简单说明，这样我不会乱猜。", 78],
          ["先停火版", "我们先别继续互相刺了。我想好好说，不想把事情说坏。", 68]
        ],
        reply: "TA：这样说我比较能听进去。我今天确实很乱，但不是故意不理你。",
        note: "先承认自己的情绪，再提出一个具体请求。不要用“你总是”开头。",
        final: "我刚才语气有点冲，不是想审你。我其实是有点失落，想知道你还在不在意我。你忙我能理解，但下次能不能简单告诉我一声？这样我不会乱猜。",
        avoid: "“你要是真的在乎我，就不会这样。”这会让对方进入自证模式。",
        next: "下一步：发出后先等 20 分钟，不要连续追问。"
      },
      family: {
        label: "亲子争执",
        chat: "我：妈，你能不能别什么都管？\n妈妈：我还不是为你好。\n我：你每次都说为我好，可我真的很窒息。\n妈妈：你现在翅膀硬了，嫌我烦了。\n我：算了，说了你也不懂。",
        heat: [
          ["别什么都管", "边界需求被说成攻击，对方会先感觉被否定。", "攻击感"],
          ["我还不是为你好", "这句话把控制包装成爱，让孩子更难表达边界。", "爱的压力"],
          ["说了你也不懂", "直接关闭沟通，对方会用更强的情绪追上来。", "关门句"]
        ],
        myView: "我需要被当成一个能自己决定的人，而不是永远被安排。",
        theirView: "妈妈可能听成：你不需要我了，我的关心被嫌弃了。",
        sharedNeed: "少一点控制，多一点放心",
        summary: "这里的核心不是谁对谁错，而是爱和边界混在一起了。",
        suggestions: [
          ["先接住爱", "我知道你是担心我，不是故意让我难受。我想先谢谢你这部分。", 70],
          ["说清边界", "但这件事我想自己决定。如果需要帮忙，我会主动告诉你。", 76],
          ["降低冲突", "我刚才说窒息太重了。我想表达的是，我需要一点自己处理的空间。", 74]
        ],
        reply: "妈妈：我不是非要管你，就是怕你吃亏。你要是能跟我说一声，我会放心点。",
        note: "亲子争执里，先确认对方的关心，再明确边界，比直接反抗更容易被听见。",
        final: "妈，我知道你是担心我，不是故意让我难受。我想先谢谢你。但这件事我想自己决定，如果我需要帮忙会主动告诉你。刚才我话说重了，我想表达的是我需要一点空间。",
        avoid: "“你根本不懂我。”这会让对话从事情变成人身否定。",
        next: "下一步：只谈一个具体边界，不要翻旧账。"
      },
      work: {
        label: "同事误会",
        chat: "我：这个方案你是不是没看完？\n同事：我看了，只是觉得风险比较大。\n我：那你刚才会上怎么不说？\n同事：你语气别这么冲。\n我：我只是想推进事情。\n同事：你推进事情也不用压别人。",
        heat: [
          ["你是不是没看完", "这像在质疑专业度，对方会马上自我保护。", "质疑感"],
          ["怎么不说", "追责感太强，会让对方开始解释而不是协作。", "追责感"],
          ["我只是想推进事情", "动机没错，但没有接住对方的感受。", "忽略感受"]
        ],
        myView: "我想把项目往前推，也担心风险讨论太晚影响进度。",
        theirView: "同事可能听成：你觉得我不专业，还在公开场合给我压力。",
        sharedNeed: "把事情推进，也保住合作感",
        summary: "工作冲突最怕把“问题”说成“人不行”。",
        suggestions: [
          ["协作开场", "我刚才那句听起来像质疑你专业度，不是我的本意。", 72],
          ["回到问题", "我想确认的是风险点和推进节奏，我们能不能把这两件事拆开看？", 80],
          ["留住关系", "你刚才提醒得对，我语气急了。我们先把风险列出来，再决定怎么推进。", 82]
        ],
        reply: "同事：这样可以。我主要担心交付时间和审核口径，不是想拖进度。",
        note: "职场里先修复尊重感，再讨论方案，效率反而更高。",
        final: "我刚才那句听起来像质疑你专业度，不是我的本意。你提醒得对，我语气急了。我想确认的是风险点和推进节奏，我们能不能把这两件事拆开看，先把风险列出来再决定怎么推进？",
        avoid: "“我只是为了项目好。”这会绕开对方刚刚受到的压力。",
        next: "下一步：约 10 分钟只列风险，不急着判对错。"
      },
      friend: {
        label: "朋友失约",
        chat: "我：你又临时不来了。\n朋友：真的对不起，家里突然有事。\n我：每次都是突然有事。\n朋友：我知道你不高兴，但我也没办法。\n我：算了，以后不用约了。\n朋友：你这样说我也很难受。",
        heat: [
          ["每次都是突然有事", "把失望说成指控，对方会先辩解。", "指控感"],
          ["以后不用约了", "这是惩罚式退场，会让关系直接降温。", "切断感"],
          ["我也没办法", "对方在解释现实，但没有接住你的失望。", "没被看见"]
        ],
        myView: "我不是只在意这一次失约，我是在意自己被反复放到后面。",
        theirView: "朋友可能听成：你不相信我，也不给我解释空间。",
        sharedNeed: "被珍惜，也被体谅",
        summary: "这不是一顿饭的问题，是失望累积后需要被认真看见。",
        suggestions: [
          ["说出失望", "我相信你有事，但我还是会失落，因为我很期待这次见面。", 74],
          ["给出边界", "如果以后不确定能不能来，可以早点告诉我，我会比较好安排。", 78],
          ["保留关系", "我刚才说以后不用约了是气话，我不是想结束这段朋友关系。", 82]
        ],
        reply: "朋友：谢谢你这样说。我确实应该早点告诉你，下次我会提前确认。",
        note: "朋友之间最需要的是把失望说清楚，而不是用断联测试对方。",
        final: "我相信你有事，但我还是会失落，因为我很期待这次见面。刚才说以后不用约了是气话，我不是想结束这段朋友关系。只是希望如果以后不确定能不能来，可以早点告诉我。",
        avoid: "“你根本没把我当朋友。”这会让对方从愧疚转向防御。",
        next: "下一步：等对方回应后，再决定是否重新约具体时间。"
      }
    };

    const state = {
      scenario: "lover",
      activeHeat: 0,
      activeSuggestion: 1
    };

    const sampleRow = document.querySelector("#sampleRow");
    const chatInput = document.querySelector("#chatInput");
    const charCount = document.querySelector("#charCount");
    const heatList = document.querySelector("#heatList");
    const stageSummary = document.querySelector("#stageSummary");
    const myView = document.querySelector("#myView");
    const theirView = document.querySelector("#theirView");
    const sharedNeed = document.querySelector("#sharedNeed");
    const suggestions = document.querySelector("#suggestions");
    const rehearsalChat = document.querySelector("#rehearsalChat");
    const rehearsalTitle = document.querySelector("#rehearsalTitle");
    const rehearsalNote = document.querySelector("#rehearsalNote");
    const finalMessage = document.querySelector("#finalMessage");
    const avoidLine = document.querySelector("#avoidLine");
    const nextStep = document.querySelector("#nextStep");
    const temperatureText = document.querySelector("#temperatureText");
    const meterFill = document.querySelector("#meterFill");
    const toast = document.querySelector("#toast");

    function getScenario() {
      return scenarios[state.scenario] || scenarios.lover;
    }

    function detectScenario(text) {
      const lower = text.toLowerCase();
      if (/妈|爸|父母|家里|翅膀|为你好/.test(text)) return "family";
      if (/方案|项目|会议|风险|同事|推进|交付/.test(text)) return "work";
      if (/朋友|约|失约|临时|见面|不来了/.test(text)) return "friend";
      if (/恋|晚安|消息|在乎|冷战|忙/.test(text) || lower.includes("ta")) return "lover";
      return state.scenario;
    }

    function renderSamples() {
      sampleRow.innerHTML = Object.entries(scenarios).map(([id, item]) => `
        <button class="sample-btn ${id === state.scenario ? "is-active" : ""}" type="button" data-sample="${id}">
          ${item.label}
        </button>
      `).join("");
    }

    function updateCharCount() {
      charCount.textContent = `${chatInput.value.length} 字`;
    }

    function renderHeat() {
      const item = getScenario();
      heatList.innerHTML = item.heat.map(([line, reason, tag], index) => `
        <button class="heat-item ${index === state.activeHeat ? "is-active" : ""}" type="button" data-heat="${index}">
          <span class="heat-rank">${index + 1}</span>
          <span class="heat-copy">
            <strong>${line}</strong>
            <span>${reason}</span>
          </span>
          <span class="heat-tag">${tag}</span>
        </button>
      `).join("");
    }

    function renderStage() {
      const item = getScenario();
      const heat = item.heat[state.activeHeat];
      stageSummary.textContent = `${item.summary} 当前聚焦：“${heat[0]}”。`;
      myView.textContent = item.myView;
      theirView.textContent = item.theirView;
      sharedNeed.textContent = item.sharedNeed;
    }

    function renderSuggestions() {
      const item = getScenario();
      suggestions.innerHTML = item.suggestions.map(([title, text, score], index) => `
        <article class="suggestion-card ${index === state.activeSuggestion ? "is-active" : ""}">
          <div>
            <h3>${title}</h3>
            <p>${text}</p>
          </div>
          <button class="small-btn ${index === state.activeSuggestion ? "is-active" : ""}" type="button" data-suggestion="${index}">
            排练这句
          </button>
        </article>
      `).join("");
    }

    function renderRehearsal() {
      const item = getScenario();
      const [title, text, score] = item.suggestions[state.activeSuggestion];
      rehearsalChat.innerHTML = `
        <div class="bubble me">${text}</div>
        <div class="bubble other">${item.reply}</div>
      `;
      rehearsalTitle.textContent = title;
      rehearsalNote.textContent = item.note;
      temperatureText.textContent = `${score} / 100`;
      meterFill.style.width = `${score}%`;
    }

    function renderCard() {
      const item = getScenario();
      finalMessage.textContent = item.final;
      avoidLine.textContent = item.avoid;
      nextStep.textContent = item.next;
    }

    function renderAll() {
      renderSamples();
      updateCharCount();
      renderHeat();
      renderStage();
      renderSuggestions();
      renderRehearsal();
      renderCard();
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("is-showing");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("is-showing"), 1500);
    }

    function revealResult() {
      document.querySelector(".stage-panel").scrollIntoView({ behavior: "auto", block: "start" });
    }

    sampleRow.addEventListener("click", (event) => {
      const button = event.target.closest("[data-sample]");
      if (!button) return;
      state.scenario = button.dataset.sample;
      state.activeHeat = 0;
      state.activeSuggestion = 1;
      chatInput.value = getScenario().chat;
      renderAll();
      showToast("已切换聊天样例");
    });

    chatInput.addEventListener("input", () => {
      updateCharCount();
    });

    document.querySelector("#startBtn").addEventListener("click", () => {
      state.scenario = detectScenario(chatInput.value);
      state.activeHeat = 0;
      state.activeSuggestion = 1;
      renderAll();
      revealResult();
      showToast("剧场已开演");
    });

    heatList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-heat]");
      if (!button) return;
      state.activeHeat = Number(button.dataset.heat);
      renderHeat();
      renderStage();
      showToast("已切换误会热区");
    });

    suggestions.addEventListener("click", (event) => {
      const button = event.target.closest("[data-suggestion]");
      if (!button) return;
      state.activeSuggestion = Number(button.dataset.suggestion);
      renderSuggestions();
      renderRehearsal();
      showToast("已排练这句话");
    });

    document.querySelector("#makeCardBtn").addEventListener("click", () => {
      renderCard();
      document.querySelector(".result-card").scrollIntoView({ behavior: "auto", block: "start" });
      showToast("和解卡已生成");
    });

    document.querySelector("#copyCardBtn").addEventListener("click", async () => {
      const text = `和解卡\n\n可以直接发：${finalMessage.textContent}\n\n这句先别说：${avoidLine.textContent}\n\n${nextStep.textContent}`;
      try {
        await navigator.clipboard.writeText(text);
        showToast("和解卡已复制");
      } catch (error) {
        showToast("和解卡已生成，可手动复制");
      }
    });

    document.querySelectorAll(".preview-btn").forEach((button) => {
      button.addEventListener("click", () => {
        const mode = button.dataset.preview;
        document.body.classList.toggle("portrait-preview", mode === "portrait");
        document.querySelectorAll(".preview-btn").forEach((item) => {
          item.classList.toggle("is-active", item === button);
        });
      });
    });

    const initialPreview = new URLSearchParams(window.location.search).get("preview");
    if (initialPreview === "portrait") {
      document.body.classList.add("portrait-preview");
      document.querySelectorAll(".preview-btn").forEach((item) => {
        item.classList.toggle("is-active", item.dataset.preview === "portrait");
      });
    }

    chatInput.value = scenarios.lover.chat;
    renderAll();
  </script>
</body>
</html>
