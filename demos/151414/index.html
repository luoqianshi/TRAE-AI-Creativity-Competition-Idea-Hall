<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>需求优先级决策 Agent</title>
<style>
  /* ===== Reset & Base ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F5F6FA; --surface: #FFFFFF; --surface-hover: #F8F9FC;
    --border: #E3E6EF; --border-focus: #5B6CF7;
    --primary: #5B6CF7; --primary-light: #EEF0FF; --primary-dark: #4351D4;
    --text: #1E2330; --text-secondary: #6B7280; --text-muted: #9CA3AF;
    --success: #22C55E; --success-bg: #F0FDF4;
    --warning: #F59E0B; --warning-bg: #FFFBEB;
    --danger: #EF4444; --danger-bg: #FEF2F2;
    --info: #3B82F6; --info-bg: #EFF6FF;
    --radius: 10px; --radius-sm: 6px; --radius-lg: 14px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
    --shadow: 0 4px 16px rgba(0,0,0,.08);
    --shadow-lg: 0 8px 30px rgba(0,0,0,.12);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    --transition: .2s ease;
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
  input, select, textarea, button { font-family: inherit; font-size: inherit; }
  
  /* ===== Layout ===== */
  .app-container { max-width: 1280px; margin: 0 auto; padding: 32px 40px; }
  .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
  .app-logo { display: flex; align-items: center; gap: 14px; }
  .app-logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), #818CF8); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; }
  .app-logo-icon svg { width: 22px; height: 22px; color: #fff; }
  .app-title { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
  .app-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .header-actions { display: flex; gap: 10px; }
  
  /* ===== Buttons ===== */
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13.5px; font-weight: 500; cursor: pointer; transition: all var(--transition); white-space: nowrap; }
  .btn:hover { border-color: #C7C9D4; background: var(--surface-hover); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
  .btn-danger { color: var(--danger); border-color: #FECACA; }
  .btn-danger:hover { background: var(--danger-bg); border-color: #FCA5A5; }
  .btn-sm { padding: 6px 12px; font-size: 12.5px; }
  .btn-ghost { border: none; background: transparent; padding: 6px 10px; }
  .btn-ghost:hover { background: var(--surface-hover); }
  .btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  
  /* ===== Tabs ===== */
  .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 28px; }
  .tab { padding: 12px 24px; font-size: 14px; font-weight: 500; color: var(--text-secondary); cursor: pointer; border: none; background: none; position: relative; transition: color var(--transition); }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--primary); font-weight: 600; }
  .tab.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px; background: var(--primary); border-radius: 2px 2px 0 0; }
  .tab-icon { width: 16px; height: 16px; margin-right: 6px; vertical-align: -2px; }
  .tab-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 600; margin-left: 6px; }
  
  /* ===== Panels ===== */
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 24px 28px; margin-bottom: 20px; }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
  .card-title svg { width: 18px; height: 18px; color: var(--primary); }
  
  /* ===== Form Elements ===== */
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
  .form-input, .form-select, .form-textarea {
    width: 100%; padding: 9px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text); font-size: 13.5px; transition: border-color var(--transition);
    outline: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(91,108,247,.1); }
  .form-textarea { resize: vertical; min-height: 70px; }
  .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .form-row-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; }
  
  /* ===== Scoring Config ===== */
  .template-selector { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .template-chip { padding: 7px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 500; cursor: pointer; transition: all var(--transition); }
  .template-chip:hover { border-color: var(--primary); color: var(--primary); }
  .template-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .dimension-list { display: flex; flex-direction: column; gap: 8px; }
  .dimension-item { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); transition: all var(--transition); cursor: grab; }
  .dimension-item:hover { border-color: #C7C9D4; box-shadow: var(--shadow-sm); }
  .dimension-item.dragging { opacity: .5; border-color: var(--primary); background: var(--primary-light); }
  .dimension-item .drag-handle { color: var(--text-muted); cursor: grab; display: flex; }
  .dimension-item .drag-handle svg { width: 16px; height: 16px; }
  .dimension-item .dim-name { flex: 1; font-size: 14px; font-weight: 500; min-width: 0; }
  .dimension-item .dim-desc { font-size: 12px; color: var(--text-muted); flex: 1.5; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dimension-item .weight-control { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .dimension-item .weight-slider { width: 100px; accent-color: var(--primary); cursor: pointer; }
  .dimension-item .weight-value { width: 42px; text-align: center; font-size: 13px; font-weight: 600; color: var(--primary); }
  .weight-total { text-align: right; font-size: 13px; margin-top: 12px; padding: 10px 14px; background: var(--primary-light); border-radius: var(--radius-sm); }
  .weight-total.ok { color: var(--success); }
  .weight-total.bad { color: var(--danger); }
  
  /* ===== Demand List Table ===== */
  .demand-table { width: 100%; border-collapse: collapse; }
  .demand-table th { text-align: left; padding: 11px 14px; font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .5px; border-bottom: 2px solid var(--border); background: var(--bg); position: sticky; top: 0; }
  .demand-table td { padding: 12px 14px; font-size: 13.5px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .demand-table tr:hover td { background: var(--surface-hover); }
  .demand-table .td-name { font-weight: 500; max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .demand-table .td-score { font-weight: 700; font-size: 15px; }
  
  /* ===== Priority Badges ===== */
  .priority-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .priority-badge.p0 { background: #FEE2E2; color: #DC2626; }
  .priority-badge.p1 { background: #FEF3C7; color: #D97706; }
  .priority-badge.p2 { background: #DBEAFE; color: #2563EB; }
  .priority-badge.p3 { background: #F3F4F6; color: #6B7280; }
  .priority-dot { width: 7px; height: 7px; border-radius: 50%; }
  .priority-dot.p0 { background: #DC2626; }
  .priority-dot.p1 { background: #D97706; }
  .priority-dot.p2 { background: #2563EB; }
  .priority-dot.p3 { background: #9CA3AF; }
  
  /* ===== Rank List ===== */
  .rank-list { display: flex; flex-direction: column; gap: 10px; }
  .rank-item { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); transition: all var(--transition); }
  .rank-item:hover { box-shadow: var(--shadow); }
  .rank-item.rank-1 { border-color: #FBBF24; background: linear-gradient(135deg, #FFFBEB, #FEF3C7); }
  .rank-item.rank-2 { border-color: #D1D5DB; background: linear-gradient(135deg, #F9FAFB, #F3F4F6); }
  .rank-item.rank-3 { border-color: #FCD34D; background: linear-gradient(135deg, #FFFBEB, #FEF9C3); }
  .rank-number { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .rank-1 .rank-number { background: #F59E0B; color: #fff; }
  .rank-2 .rank-number { background: #9CA3AF; color: #fff; }
  .rank-3 .rank-number { background: #D97706; color: #fff; }
  .rank-item:not(.rank-1):not(.rank-2):not(.rank-3) .rank-number { background: var(--bg); color: var(--text-secondary); }
  .rank-info { flex: 1; min-width: 0; }
  .rank-name { font-weight: 600; font-size: 14.5px; margin-bottom: 3px; }
  .rank-meta { font-size: 12px; color: var(--text-secondary); display: flex; gap: 14px; flex-wrap: wrap; }
  .rank-score-section { text-align: right; flex-shrink: 0; }
  .rank-score-value { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
  .rank-score-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  
  /* ===== Report ===== */
  .report-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px 32px; }
  .report-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 18px; border-bottom: 1px solid var(--border); margin-bottom: 22px; }
  .report-title { font-size: 17px; font-weight: 700; }
  .report-section { margin-bottom: 20px; }
  .report-section-title { font-size: 14px; font-weight: 600; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .report-section-title svg { width: 16px; height: 16px; }
  .report-text { font-size: 13.5px; color: var(--text-secondary); line-height: 1.8; }
  .report-text strong { color: var(--text); font-weight: 600; }
  .report-score-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .report-score-bar-label { width: 80px; font-size: 13px; color: var(--text-secondary); flex-shrink: 0; }
  .report-score-bar-track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .report-score-bar-fill { height: 100%; border-radius: 4px; transition: width .6s ease; }
  .report-score-bar-value { width: 36px; font-size: 13px; font-weight: 600; text-align: right; flex-shrink: 0; }
  
  /* ===== Empty State ===== */
  .empty-state { text-align: center; padding: 60px 20px; }
  .empty-state svg { width: 64px; height: 64px; color: var(--text-muted); margin-bottom: 16px; }
  .empty-state-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary); }
  .empty-state-desc { font-size: 13px; color: var(--text-muted); max-width: 360px; margin: 0 auto; }
  
  /* ===== Modal ===== */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 600px; max-height: 85vh; overflow-y: auto; transform: translateY(10px); transition: transform .25s; }
  .modal-overlay.show .modal { transform: translateY(0); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border); }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-body { padding: 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
  
  /* ===== Misc ===== */
  .divider { height: 1px; background: var(--border); margin: 20px 0; }
  .text-center { text-align: center; }
  .text-muted { color: var(--text-muted); }
  .mt-16 { margin-top: 16px; }
  .mb-16 { margin-bottom: 16px; }
  .flex-between { display: flex; align-items: center; justify-content: space-between; }
  .inline-flex { display: inline-flex; align-items: center; gap: 6px; }
  .tag { display: inline-flex; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; background: var(--bg); color: var(--text-secondary); }
  .tag.type-certainty { background: #DBEAFE; color: #1D4ED8; }
  .tag.type-explore { background: #F3E8FF; color: #7C3AED; }
  .tag.type-bugfix { background: #FEE2E2; color: #B91C1C; }
  .tag.type-ux { background: #D1FAE5; color: #047857; }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }
  
  /* ===== Score color mapping ===== */
  .score-high { color: var(--success); }
  .score-mid { color: var(--warning); }
  .score-low { color: var(--text-muted); }
  
  /* ===== Batch Actions Bar ===== */
  .batch-bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--primary-light); border-radius: var(--radius); margin-bottom: 16px; }
  .batch-bar-info { font-size: 13px; color: var(--primary-dark); font-weight: 500; }
  .batch-bar-actions { display: flex; gap: 8px; }

  /* ===== Print ===== */
  @media print {
    body { background: #fff; }
    .app-header, .tabs, .header-actions, .btn, .no-print { display: none !important; }
    .card, .report-card { border: none; box-shadow: none; padding: 0; }
  }
</style>
</head>
<body>
<div class="app-container">
  <!-- Header -->
  <div class="app-header">
    <div class="app-logo">
      <div class="app-logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <div>
        <div class="app-title">需求优先级决策 Agent</div>
        <div class="app-subtitle">智能评估 · 科学排序 · 高效决策</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="exportJSON()" title="导出数据">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        导出
      </button>
      <button class="btn" onclick="importJSON()" title="导入数据">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        导入
      </button>
    </div>
  </div>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
  
  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="input" onclick="switchTab('input')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      需求录入
    </button>
    <button class="tab" data-tab="config" onclick="switchTab('config')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      评分配置
    </button>
    <button class="tab" data-tab="ranking" onclick="switchTab('ranking')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      优先级排序
    </button>
    <button class="tab" data-tab="report" onclick="switchTab('report')">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      评估报告
    </button>
  </div>

  <!-- ===== Panel 1: 需求录入 ===== -->
  <div id="panel-input" class="panel active">
    <div class="card">
      <div class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        新增需求
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">需求名称 *</label>
          <input class="form-input" id="reqName" placeholder="输入需求名称" />
        </div>
        <div class="form-group">
          <label class="form-label">需求类型 *</label>
          <select class="form-select" id="reqType">
            <option value="certainty">确定性收益</option>
            <option value="explore">新模式探索</option>
            <option value="bugfix">线上卡点修复</option>
            <option value="ux">用户体验优化</option>
          </select>
        </div>
      </div>
      <div class="form-row-4">
        <div class="form-group">
          <label class="form-label">覆盖用户数量</label>
          <select class="form-select" id="reqUserCount">
            <option value="5">全部用户 (>100万)</option>
            <option value="4">大量用户 (10万~100万)</option>
            <option value="3">中等用户 (1万~10万)</option>
            <option value="2">少量用户 (1000~1万)</option>
            <option value="1">极少量用户 (<1000)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">预估收入影响</label>
          <select class="form-select" id="reqRevenue">
            <option value="5">核心收入增长 (>500万)</option>
            <option value="4">显著收入增长 (100万~500万)</option>
            <option value="3">中等收入影响 (10万~100万)</option>
            <option value="2">轻微收入影响 (<10万)</option>
            <option value="1">无直接收入影响</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">业务影响范围</label>
          <select class="form-select" id="reqBizScope">
            <option value="5">跨多条业务线</option>
            <option value="4">整条业务线</option>
            <option value="3">某个核心模块</option>
            <option value="2">某个子模块</option>
            <option value="1">单点功能</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">紧急程度</label>
          <select class="form-select" id="reqUrgency">
            <option value="5">线上故障，立刻修复</option>
            <option value="4">高层关注，本周内</option>

    <!-- 需求列表 -->

  <!-- ===== Panel 2: 评分配置 ===== -->
  <div id="panel-config" class="panel">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        预设模板

      <div class="form-hint" style="margin-bottom:12px;">选择模板后可在此基础上自定义调整各维度权重，也可自由新增或删除维度。</div>
      <div class="template-selector" id="templateSelector">
        <div class="template-chip active" data-template="balanced" onclick="applyTemplate('balanced')">综合评估</div>

    <div class="card">

        <div class="card-title" style="margin-bottom:0;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          评估维度
        </div>
        <button class="btn btn-sm btn-primary" onclick="showAddDimensionModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

<!-- ===== Modal: 新增维度 ===== -->
<div class="modal-overlay" id="dimModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">新增评估维度</div>
      <button class="btn-ghost" onclick="closeDimModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">维度名称 *</label>
        <input class="form-input" id="newDimName" placeholder="例如：数据安全合规" />
      </div>
      <div class="form-group">
        <label class="form-label">维度描述</label>
        <input class="form-input" id="newDimDesc" placeholder="简述该维度的评估含义" />
      </div>
      <div class="form-group">
        <label class="form-label">初始权重 (%)</label>
        <input class="form-input" id="newDimWeight" type="number" min="1" max="100" value="10" />

</div>

<!-- ===== Modal: 查看单条评估报告 ===== -->
<div class="modal-overlay" id="reportModal">
  <div class="modal" style="width:720px;">
    <div class="modal-header">
      <div class="modal-title">需求评估详情</div>
      <button class="btn-ghost" onclick="closeReportModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="reportModalBody"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeReportModal()">关闭</button>
    </div>
  </div>
</div>

<script>
// ========== State ==========
let demands = [];
let dimensions = [];
let nextDemandId = 1;

// ========== Dimension Templates ==========
const TEMPLATES = {
  balanced: [
    { id:'userCount', name:'覆盖用户数量', desc:'需求影响的用户规模', weight:15 },
    { id:'revenue', name:'预估收入影响', desc:'对业务收入的预期贡献', weight:15 },
    { id:'bizScope', name:'业务影响范围', desc:'影响业务线的广度和深度', weight:15 },
    { id:'urgency', name:'紧急程度', desc:'需求的时间紧迫性', weight:15 },
    { id:'complexity', name:'实现复杂度', desc:'研发成本和工作量', weight:12 },
    { id:'techRisk', name:'技术风险', desc:'实现方案的不确定性', weight:8 },
    { id:'strategy', name:'战略对齐度', desc:'与公司战略目标的匹配度', weight:12 },
    { id:'feedback', name:'用户反馈强度', desc:'用户端反馈的频率和强度', weight:8 },
  ],
  certainty: [
    { id:'revenue', name:'预估收入影响', desc:'对业务收入的预期贡献', weight:30 },
    { id:'userCount', name:'覆盖用户数量', desc:'需求影响的用户规模', weight:20 },
    { id:'bizScope', name:'业务影响范围', desc:'影响业务线的广度和深度', weight:15 },
    { id:'strategy', name:'战略对齐度', desc:'与公司战略目标的匹配度', weight:15 },
    { id:'complexity', name:'实现复杂度', desc:'研发成本和工作量', weight:10 },
    { id:'techRisk', name:'技术风险', desc:'实现方案的不确定性', weight:10 },
  ],
  explore: [
    { id:'strategy', name:'战略对齐度', desc:'与公司战略目标的匹配度', weight:25 },
    { id:'feedback', name:'用户反馈强度', desc:'用户端反馈的频率和强度', weight:20 },
    { id:'userCount', name:'覆盖用户数量', desc:'需求影响的用户规模', weight:15 },
    { id:'complexity', name:'实现复杂度', desc:'研发成本和工作量', weight:15 },
    { id:'techRisk', name:'技术风险', desc:'实现方案的不确定性', weight:15 },
    { id:'bizScope', name:'业务影响范围', desc:'影响业务线的广度和深度', weight:10 },
  ],
  bugfix: [
    { id:'urgency', name:'紧急程度', desc:'需求的时间紧迫性', weight:30 },
    { id:'userCount', name:'覆盖用户数量', desc:'需求影响的用户规模', weight:20 },
    { id:'bizScope', name:'业务影响范围', desc:'影响业务线的广度和深度', weight:20 },
    { id:'complexity', name:'实现复杂度', desc:'研发成本和工作量', weight:15 },
    { id:'techRisk', name:'技术风险', desc:'实现方案的不确定性', weight:15 },
  ],
  ux: [
    { id:'feedback', name:'用户反馈强度', desc:'用户端反馈的频率和强度', weight:25 },
    { id:'userCount', name:'覆盖用户数量', desc:'需求影响的用户规模', weight:25 },
    { id:'complexity', name:'实现复杂度', desc:'研发成本和工作量', weight:15 },
    { id:'bizScope', name:'业务影响范围', desc:'影响业务线的广度和深度', weight:15 },
    { id:'strategy', name:'战略对齐度', desc:'与公司战略目标的匹配度', weight:10 },
    { id:'techRisk', name:'技术风险', desc:'实现方案的不确定性', weight:10 },
  ]
};

// ========== Initialize ==========
function init() {
  applyTemplate('balanced');
  renderDimensionList();
  renderDemandList();
  persistState();
}

// ========== Tab Switch ==========
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  if (tab === 'ranking') renderRanking();
  if (tab === 'report') renderFullReport();
}

// ========== Dimension Management ==========
function applyTemplate(name) {
  dimensions = JSON.parse(JSON.stringify(TEMPLATES[name] || TEMPLATES.balanced));
  document.querySelectorAll('.template-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.template === name);
  });
  renderDimensionList();
  persistState();
}

function renderDimensionList() {
  const list = document.getElementById('dimensionList');
  const total = dimensions.reduce((s, d) => s + d.weight, 0);
  list.innerHTML = dimensions.map((d, i) => `
    <div class="dimension-item" draggable="true" data-index="${i}"
         ondragstart="onDimDragStart(event,${i})" ondragover="onDimDragOver(event)" ondrop="onDimDrop(event,${i})" ondragend="onDimDragEnd(event)">
      <div class="drag-handle">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>
      </div>
      <div class="dim-name">${d.name}</div>
      <div class="dim-desc">${d.desc || ''}</div>
      <div class="weight-control">
        <input type="range" class="weight-slider" min="0" max="50" value="${d.weight}" oninput="updateWeight(${i}, this.value)" />
        <span class="weight-value">${d.weight}%</span>
      </div>
      <button class="btn-ghost" onclick="removeDimension(${i})" title="删除维度">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" style="color:var(--danger)"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      </button>
    </div>
  `).join('');
  const el = document.getElementById('weightTotal');
  el.className = 'weight-total ' + (Math.abs(total - 100) < 0.5 ? 'ok' : 'bad');
  el.textContent = `权重总计: ${total}%` + (Math.abs(total - 100) < 0.5 ? '' : ' (建议调整为 100%)');
}

function updateWeight(i, val) {
  dimensions[i].weight = parseInt(val);
  renderDimensionList();
  persistState();
}

function removeDimension(i) {
  if (dimensions.length <= 2) { alert('至少保留2个评估维度'); return; }
  dimensions.splice(i, 1);
  renderDimensionList();
  persistState();
}

// Drag and drop
let dragIdx = null;
function onDimDragStart(e, i) { dragIdx = i; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
function onDimDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function onDimDrop(e, i) {
  e.preventDefault();
  if (dragIdx === null || dragIdx === i) return;
  const item = dimensions.splice(dragIdx, 1)[0];
  dimensions.splice(i, 0, item);
  dragIdx = null;
  renderDimensionList();
  persistState();
}
function onDimDragEnd(e) { e.currentTarget.classList.remove('dragging'); dragIdx = null; }

// Add dimension modal
function showAddDimensionModal() { document.getElementById('dimModal').classList.add('show'); }
function closeDimModal() { document.getElementById('dimModal').classList.remove('show'); }
function confirmAddDimension() {
  const name = document.getElementById('newDimName').value.trim();
  const desc = document.getElementById('newDimDesc').value.trim();
  const weight = parseInt(document.getElementById('newDimWeight').value) || 10;
  if (!name) { alert('请输入维度名称'); return; }
  dimensions.push({ id: 'custom_' + Date.now(), name, desc, weight });
  closeDimModal();
  document.getElementById('newDimName').value = '';
  document.getElementById('newDimDesc').value = '';
  document.getElementById('newDimWeight').value = '10';
  renderDimensionList();
  persistState();
}

// ========== Demand Management ==========
const TYPE_LABELS = { certainty:'确定性收益', explore:'新模式探索', bugfix:'线上卡点修复', ux:'用户体验优化' };
const TYPE_TAG = { certainty:'type-certainty', explore:'type-explore', bugfix:'type-bugfix', ux:'type-ux' };
const DIM_SCORE_MAP = {
  userCount: 'reqUserCount', revenue: 'reqRevenue', bizScope: 'reqBizScope',
  urgency: 'reqUrgency', complexity: 'reqComplexity', techRisk: 'reqTechRisk',
  strategy: 'reqStrategy', feedback: 'reqFeedback'
};

function addDemand() {
  const name = document.getElementById('reqName').value.trim();
  if (!name) { alert('请输入需求名称'); return; }
  const demand = {
    id: nextDemandId++,
    name,
    type: document.getElementById('reqType').value,
    typeName: TYPE_LABELS[document.getElementById('reqType').value],
    scores: {
      userCount: parseInt(document.getElementById('reqUserCount').value),
      revenue: parseInt(document.getElementById('reqRevenue').value),
      bizScope: parseInt(document.getElementById('reqBizScope').value),
      urgency: parseInt(document.getElementById('reqUrgency').value),
      complexity: parseInt(document.getElementById('reqComplexity').value),
      techRisk: parseInt(document.getElementById('reqTechRisk').value),
      strategy: parseInt(document.getElementById('reqStrategy').value),
      feedback: parseInt(document.getElementById('reqFeedback').value),
    },
    desc: document.getElementById('reqDesc').value.trim(),
    createdAt: new Date().toLocaleString('zh-CN')
  };
  demands.push(demand);
  resetForm();
  renderDemandList();
  persistState();
}

function resetForm() {
  ['reqName','reqDesc'].forEach(id => document.getElementById(id).value = '');
  ['reqType'].forEach(id => document.getElementById(id).selectedIndex = 0);
  ['reqUserCount','reqRevenue','reqBizScope','reqUrgency','reqComplexity','reqTechRisk','reqStrategy','reqFeedback'].forEach(id => document.getElementById(id).selectedIndex = 0);
}

function removeDemand(id) {
  demands = demands.filter(d => d.id !== id);
  renderDemandList();
  persistState();
}

function clearAllDemands() {
  if (demands.length === 0) return;
  if (!confirm('确认清空所有需求？')) return;
  demands = [];
  renderDemandList();
  persistState();
}

function renderDemandList() {
  const c = document.getElementById('demandListContainer');
  document.getElementById('demandCount').textContent = `共 ${demands.length} 条`;
  if (demands.length === 0) {
    c.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <div class="empty-state-title">暂无需求</div>
      <div class="empty-state-desc">在上方表单中录入需求，或点击「加载示例」快速体验完整功能</div>
    </div>`;
    return;
  }
  c.innerHTML = `<table class="demand-table">
    <thead><tr><th style="width:36px">#</th><th>需求名称</th><th>类型</th><th>覆盖用户</th><th>预估收入</th><th>业务影响</th><th>紧急程度</th><th>综合得分</th><th>优先级</th><th style="width:80px">操作</th></tr></thead>
    <tbody>${demands.map((d, i) => {
      const result = calcDemand(d);
      return `<tr>
        <td style="color:var(--text-muted)">${i+1}</td>
        <td class="td-name" title="${d.name}">${d.name}</td>
        <td><span class="tag ${TYPE_TAG[d.type] || ''}">${d.typeName}</span></td>
        <td>${scoreLabel(d.scores.userCount)}</td>
        <td>${scoreLabel(d.scores.revenue)}</td>
        <td>${scoreLabel(d.scores.bizScope)}</td>
        <td>${scoreLabel(d.scores.urgency)}</td>
        <td class="td-score ${scoreColorClass(result.totalScore)}">${result.totalScore.toFixed(1)}</td>
        <td><span class="priority-badge ${result.priorityClass}">${result.priorityLabel}</span></td>
        <td>
          <button class="btn-ghost" onclick="viewDemandReport(${d.id})" title="查看报告"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button class="btn-ghost" onclick="removeDemand(${d.id})" title="删除" style="color:var(--danger)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button>
        </td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

function scoreLabel(v) {
  const map = {5:'★★★★★',4:'★★★★',3:'★★★',2:'★★',1:'★'};
  return `<span style="color:${v>=4?'var(--warning)':v>=3?'var(--text-secondary)':'var(--text-muted)'};font-size:12px">${map[v]||v}</span>`;
}
function scoreColorClass(s) { return s >= 75 ? 'score-high' : s >= 50 ? 'score-mid' : 'score-low'; }

// ========== Score Calculation ==========
function calcDemand(d) {
  let totalWeight = dimensions.reduce((s, dim) => s + dim.weight, 0) || 1;
  let totalScore = 0;
  const details = [];
  dimensions.forEach(dim => {
    const rawScore = (d.scores && d.scores[dim.id]) || 3;
    const weighted = rawScore * (dim.weight / totalWeight) * 20; // normalize to 0-100
    totalScore += weighted;
    details.push({ name: dim.name, weight: dim.weight, rawScore, weighted: weighted / 20 }); // store divided for display
  });
  totalScore = Math.min(100, totalScore);
  let priorityLabel, priorityClass;
  if (totalScore >= 80) { priorityLabel = 'P0 - 最高'; priorityClass = 'p0'; }
  else if (totalScore >= 65) { priorityLabel = 'P1 - 高'; priorityClass = 'p1'; }
  else if (totalScore >= 45) { priorityLabel = 'P2 - 中'; priorityClass = 'p2'; }
  else { priorityLabel = 'P3 - 低'; priorityClass = 'p3'; }
  return { totalScore, priorityLabel, priorityClass, details };
}

function generateAnalysis(d, r) {
  const strengths = r.details.filter(det => det.rawScore >= 4).map(det => det.name);
  const weaknesses = r.details.filter(det => det.rawScore <= 2).map(det => det.name);
  let text = `「${d.name}」综合得分 <strong>${r.totalScore.toFixed(1)}</strong>，优先级评定为 <strong>${r.priorityLabel}</strong>。`;
  if (strengths.length > 0) text += `该需求在${strengths.join('、')}方面表现突出，`;
  if (weaknesses.length > 0) text += `但在${weaknesses.join('、')}方面相对薄弱。`;
  else text += '各维度表现较为均衡。';
  if (r.totalScore >= 80) text += '建议纳入当前迭代最高优先级排期，尽快启动研发。';
  else if (r.totalScore >= 65) text += '建议作为近期迭代重点需求，合理分配研发资源推进。';
  else if (r.totalScore >= 45) text += '建议纳入中短期规划池，视资源情况择机启动。';
  else text += '建议作为储备需求持续观察，暂不投入主要研发资源。';
  return text;
}

function generateSummary(ranked) {
  const p0 = ranked.filter(d => d.result.priorityClass === 'p0').length;
  const p1 = ranked.filter(d => d.result.priorityClass === 'p1').length;
  const p2 = ranked.filter(d => d.result.priorityClass === 'p2').length;
  const p3 = ranked.filter(d => d.result.priorityClass === 'p3').length;
  let text = `本轮评估共 ${ranked.length} 条需求，其中 P0（最高优先级）${p0} 条，P1（高优先级）${p1} 条，P2（中优先级）${p2} 条，P3（低优先级）${p3} 条。`;
  if (p0 > 0) text += `建议优先聚焦 P0 需求「${ranked.filter(d=>d.result.priorityClass==='p0').map(d=>d.name).join('、')}」的研发交付。`;
  if (p0 + p1 > 3) text += '当前高优先级需求较多，建议团队进一步讨论资源分配和交付节奏，确保核心需求得到充分保障。';
  return text;
}

// ========== Export / Import ==========
function exportJSON() {
  const data = { demands, dimensions, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `需求优先级数据_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
}
function importJSON() { document.getElementById('importFile').click(); }
function handleImport(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.demands) { demands = data.demands; nextDemandId = Math.max(...demands.map(d=>d.id), 0) + 1; }
      if (data.dimensions) dimensions = data.dimensions;
      renderDemandList(); renderDimensionList(); persistState();
      alert('数据导入成功！');
    } catch(err) { alert('文件格式错误，请选择有效的 JSON 文件'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ========== LocalStorage Persist ==========
function persistState() {
  try {
    localStorage.setItem('priority_agent_demands', JSON.stringify(demands));
    localStorage.setItem('priority_agent_dimensions', JSON.stringify(dimensions));
    localStorage.setItem('priority_agent_nextId', nextDemandId);
  } catch(e) {}
}
function loadState() {
  try {
    const d = localStorage.getItem('priority_agent_demands');
    const dim = localStorage.getItem('priority_agent_dimensions');
    const nid = localStorage.getItem('priority_agent_nextId');
    if (d) demands = JSON.parse(d);
    if (dim) dimensions = JSON.parse(dim);
    if (nid) nextDemandId = parseInt(nid);
  } catch(e) {}
}
