<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>童喘记 - 儿童哮喘护理助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f0f7ff;
            color: #333;
            padding-bottom: 80px;
        }
        header {
            background: #2488d8;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 14px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px #00000010;
        }
        .card h3 {
            color: #2488d8;
            margin-bottom: 12px;
            font-size: 17px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cce0f5;
            border-radius: 8px;
            margin: 6px 0 12px;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 11px;
            background: #2488d8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:active {
            background: #1c73b8;
        }
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            display: flex;
            border-top: 1px solid #eee;
        }
        .tab-item {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 13px;
            color: #777;
        }
        .tab-item.active {
            color: #2488d8;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .record-item {
            padding: 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .tip-box {
            background: #e6f2ff;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            color: #195b94;
        }
    </style>
</head>
<body>
<header>童喘记 · 儿童哮喘护理助手</header>
<div class="container">
    <!-- 首页面板 -->
    <div class="tab-content active" id="page-home">
        <div class="card">
            <h3>今日护理概览</h3>
            <div class="tip-box">
                今日暂无用药记录，请及时填写用药信息
            </div>
            <br>
            <div class="tip-box">
                今日天气花粉浓度偏高，减少孩子户外剧烈活动
            </div>
        </div>
        <div class="card">
            <h3>快捷功能</h3>
            <button onclick="switchTab('page-record')">📝 记录今日病情</button>
            <br><br>
            <button onclick="switchTab('page-medicine')">💊 添加用药提醒</button>
            <br><br>
            <button onclick="switchTab('page-tip')">📖 哮喘护理科普</button>
        </div>
    </div>

    <!-- 病情记录面板 -->
    <div class="tab-content" id="page-record">
        <div class="card">
            <h3>记录孩子今日症状</h3>
            <label>发作程度</label>
            <select id="sym-level">
                <option>无不适</option>
                <option>轻微咳嗽</option>
                <option>喘息、胸闷</option>
                <option>夜间憋醒</option>
                <option>严重发作</option>
            </select>
            <label>诱发因素</label>
            <select id="cause">
                <option>无明显诱因</option>
                <option>花粉/尘螨</option>
                <option>剧烈运动</option>
                <option>冷空气</option>
                <option>感冒炎症</option>
                <option>宠物毛发</option>
            </select>
            <label>峰流速数值（可选）</label>
            <input type="number" id="flow" placeholder="例如：280">
            <label>备注</label>
            <textarea id="note" rows="3" placeholder="简单记录今日情况"></textarea>
            <button onclick="saveRecord()">保存记录</button>
        </div>
        <div class="card">
            <h3>历史记录</h3>
            <div id="recordList"></div>
        </div>
    </div>

    <!-- 用药提醒面板 -->
    <div class="tab-content" id="page-medicine">
        <div class="card">
            <h3>新建用药提醒</h3>
            <label>药品名称</label>
            <input id="medName" placeholder="例如：布地奈德雾化液">
            <label>用药类型</label>
            <select id="medType">
                <option>日常控制药</option>
                <option>应急缓解药</option>
            </select>
            <label>每日次数</label>
            <select id="medTimes">
                <option>每日1次</option>
                <option>每日2次</option>
                <option>每日3次</option>
            </select>
            <button onclick="saveMedicine()">保存提醒</button>
        </div>
        <div class="card">
            <h3>我的用药清单</h3>
            <div id="medList"></div>
        </div>
    </div>

    <!-- 科普面板 -->
    <div class="tab-content" id="page-tip">
        <div class="card">
            <h3>儿童哮喘基础护理</h3>
            <div class="tip-box">
                1. 按时使用控制类药物，不可自行停药
            </div>
            <div class="tip-box" style="margin-top:8px">
                2. 花粉季减少户外长时间活动，出门佩戴口罩
            </div>
            <div class="tip-box" style="margin-top:8px">
                3. 家中定期除螨，不饲养猫狗等宠物
            </div>
            <div class="tip-box" style="margin-top:8px">
                4. 剧烈运动前可提前使用预防性药物
            </div>
        </div>
        <div class="card">
            <h3>急性发作急救要点</h3>
            <div class="tip-box">
                孩子喘息严重、说话困难时，立即使用急救吸入剂，15分钟无缓解尽快送医。
            </div>
        </div>
    </div>
</div>

<!-- 底部导航 -->
<div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('page-home')">首页</div>
    <div class="tab-item" onclick="switchTab('page-record')">病情记录</div>
    <div class="tab-item" onclick="switchTab('page-medicine')">用药提醒</div>
    <div class="tab-item" onclick="switchTab('page-tip')">护理科普</div>
</div>

<script>
    // 本地存储数据
    let recordData = JSON.parse(localStorage.getItem('asthmaRecord')) || [];
    let medData = JSON.parse(localStorage.getItem('asthmaMed')) || [];

    // 切换页面
    function switchTab(pageId) {
        // 隐藏所有页面
        document.querySelectorAll('.tab-content').forEach(item=>{
            item.classList.remove('active');
        })
        // 显示目标页面
        document.getElementById(pageId).classList.add('active');
        // 切换底部tab激活态
        document.querySelectorAll('.tab-item').forEach(item=>{
            item.classList.remove('active');
        })
        event.target.classList.add('active');

        // 切换后刷新列表
        renderRecord();
        renderMed();
    }

    // 保存病情记录
    function saveRecord(){
        const level = document.getElementById('sym-level').value;
        const cause = document.getElementById('cause').value;
        const flow = document.getElementById('flow').value;
        const note = document.getElementById('note').value;
        const date = new Date().toLocaleDateString();

        const item = { date, level, cause, flow, note };
        recordData.unshift(item);
        localStorage.setItem('asthmaRecord', JSON.stringify(recordData));
        alert("记录保存成功！");
        // 清空输入
        document.getElementById('flow').value = '';
        document.getElementById('note').value = '';
        renderRecord();
    }

    // 渲染记录列表
    function renderRecord(){
        const list = document.getElementById('recordList');
        list.innerHTML = '';
        if(recordData.length === 0){
            list.innerHTML = '<div class="record-item">暂无记录</div>';
            return;
        }
        recordData.forEach(item=>{
            const div = document.createElement('div');
            div.className = 'record-item';
            div.innerHTML = `
                <strong>${item.date}</strong><br>
                症状：${item.level} | 诱因：${item.cause}<br>
                峰流速：${item.flow || '未填写'} | 备注：${item.note || '无'}
            `;
            list.appendChild(div);
        })
    }

    // 保存用药提醒
    function saveMedicine(){
        const name = document.getElementById('medName').value;
        const type = document.getElementById('medType').value;
        const times = document.getElementById('medTimes').value;
        if(!name){
            alert("请输入药品名称");
            return;
        }
        medData.push({ name, type, times });
        localStorage.setItem('asthmaMed', JSON.stringify(medData));
        alert("用药提醒已添加");
        document.getElementById('medName').value = '';
        renderMed();
    }

    // 渲染用药列表
    function renderMed(){
        const list = document.getElementById('medList');
        list.innerHTML = '';
        if(medData.length === 0){
            list.innerHTML = '<div class="record-item">暂无用药提醒</div>';
            return;
        }
        medData.forEach(item=>{
            const div = document.createElement('div');
            div.className = 'record-item';
            div.innerHTML = `
                <strong>${item.name}</strong><br>
                类型：${item.type} | ${item.times}
            `;
            list.appendChild(div);
        })
    }

    // 页面加载渲染数据
    window.onload = function(){
        renderRecord();
        renderMed();
    }
</script>
</body>
</html>
