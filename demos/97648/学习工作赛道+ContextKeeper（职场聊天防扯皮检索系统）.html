<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContextKeeper 职场防扯皮检索系统</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div id="app" class="max-w-6xl mx-auto">
        
        <!-- Header -->
        <header class="border-b border-slate-800 pb-4 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">ContextKeeper 职场防扯皮检索系统</h1>
                <p class="text-xs text-slate-400 mt-1">本地优先(Local-First) · 聊天截图语义索引沙箱</p>
            </div>
            <div class="flex gap-2">
                <span class="px-2 py-0.5 text-[11px] bg-emerald-500/10 text-emerald-400 rounded border border-emerald-500/20">数据纯本地隔离</span>
                <span class="px-2 py-0.5 text-[11px] bg-indigo-500/10 text-indigo-400 rounded border border-indigo-500/20">本地快速检索</span>
            </div>
        </header>

        <!-- 主布局 -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- 左侧：证据快速归档区 (4列) -->
            <div class="lg:col-span-4 bg-slate-800/40 p-4 rounded-xl border border-slate-700/40 flex flex-col justify-between">
                <div>
                    <h2 class="text-sm font-semibold mb-3 flex items-center gap-1.5 text-blue-400">
                        <span>📥</span> 顺手归档 (日常沟通时)
                    </h2>
                    
                    <!-- 模拟截图上传框 -->
                    <div class="border-2 border-dashed border-slate-700 hover:border-blue-500/50 rounded-lg p-4 text-center cursor-pointer transition-colors bg-slate-900/50 mb-4">
                        <span class="text-2xl block mb-1">📸</span>
                        <p class="text-xs text-slate-300 font-medium">点击或将微信/钉钉截图拖到此处</p>
                        <p class="text-[10px] text-slate-500 mt-1">系统将自动运行本地 OCR 识别图中文字</p>
                    </div>

                    <!-- 备注输入 -->
                    <div class="space-y-3">
                        <div>
                            <label class="text-[11px] text-slate-400 block mb-1">补充备注 / 上下文标签</label>
                            <input v-model="newRecord.remark" type="text" placeholder="例如：王总确认登录页改黑色，周五交" class="w-full p-2 bg-slate-900 border border-slate-700 rounded text-xs focus:outline-none focus:border-blue-500 text-slate-200">
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-400 block mb-1">模拟 OCR 提取到的图片文本 (演示用)</label>
                            <textarea v-model="newRecord.ocrText" rows="3" placeholder="模拟自动识别到的聊天记录文字..." class="w-full p-2 bg-slate-900 border border-slate-700 rounded text-xs focus:outline-none focus:border-blue-500 font-mono text-slate-400 text-[11px] resize-none"></textarea>
                        </div>
                    </div>
                </div>

                <button @click="addRecord" class="w-full mt-4 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded font-medium text-xs transition-colors cursor-pointer">
                    保存至本地保命账本
                </button>
            </div>

            <!-- 右侧：智能检索与自证区 (8列) -->
            <div class="lg:col-span-8 bg-slate-800/40 p-4 rounded-xl border border-slate-700/40 flex flex-col">
                
                <!-- 搜索条与本地导出 -->
                <div class="flex gap-3 mb-4 items-center">
                    <div class="flex-1 relative">
                        <span class="absolute left-2.5 top-2 text-slate-500 text-xs">🔍</span>
                        <input v-model="searchQuery" type="text" placeholder="输入关键字一键索骥（支持检索备注或截图内的文字）..." class="w-full pl-8 pr-3 py-1.5 bg-slate-900 border border-slate-700 rounded text-xs focus:outline-none focus:border-indigo-500 text-slate-200">
                    </div>
                    <button @click="exportData" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs font-medium text-slate-200 transition-colors cursor-pointer" title="纯前端本地打包，数据不走服务器">
                        💾 导出全部数据(JSON)
                    </button>
                </div>

                <!-- 证据卡片列表 -->
                <div class="flex-1 overflow-y-auto max-h-[460px] space-y-3 pr-1">
                    <div v-if="filteredRecords.length === 0" class="text-center py-20 text-xs text-slate-500 italic">
                        没有找到匹配的自证证据。试着搜索 “黑色” 或 “猪图标”
                    </div>
                    
                    <div v-for="item in filteredRecords" :key="item.id" class="bg-slate-900 p-3 rounded-lg border border-slate-800 flex gap-4 hover:border-slate-700 transition-colors">
                        <!-- 模拟截图缩略图 -->
                        <div class="w-24 h-24 bg-slate-950 rounded border border-slate-800 flex flex-col items-center justify-center p-1 relative overflow-hidden shrink-0 select-none">
                            <span class="text-lg">💬</span>
                            <span class="text-[9px] text-slate-600 font-mono mt-1">CHAT_IMG</span>
                            <div class="absolute bottom-0 inset-x-0 bg-slate-800/80 text-[8px] text-center text-slate-400 font-mono py-0.5">
                                OCR 已就绪
                            </div>
                        </div>

                        <!-- 卡片详情 -->
                        <div class="flex-1 flex flex-col justify-between min-w-0">
                            <div>
                                <div class="flex justify-between items-start gap-2">
                                    <span class="text-xs font-semibold text-slate-200 truncate">{{ item.remark }}</span>
                                    <span class="text-[10px] text-slate-500 font-mono shrink-0">{{ item.time }}</span>
                                </div>
                                <!-- OCR 识别文本展示 -->
                                <p class="text-[11px] text-slate-400 bg-slate-950 p-2 rounded mt-1.5 font-mono border border-slate-850 break-words">
                                    <span class="text-[9px] text-indigo-400 block font-sans font-bold mb-0.5">[图片内文字识别]</span>
                                    <span v-html="highlightText(item.ocrText)"></span>
                                </p>
                            </div>
                            <div class="flex gap-2 mt-2">
                                <span class="text-[9px] bg-slate-800 px-1.5 py-0.5 rounded text-slate-500 font-mono">ID: {{ item.id }}</span>
                                <span class="text-[9px] bg-blue-950/40 px-1.5 py-0.5 rounded text-blue-400">本地已建立索引</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed } = Vue;

        createApp({
            setup() {
                const searchQuery = ref('');
                const newRecord = ref({ remark: '', ocrText: '' });

                // 预置一些非常真实的职场扯皮场景数据
                const records = ref([
                    {
                        id: 'REC-20260709',
                        time: '2026-07-09 14:24',
                        remark: '项目一期：王总确认登录页改黑色背景',
                        ocrText: '王总: 小张啊，登录页背景还是换回深色的吧。我: 好的王总，纯黑还是深灰？王总: 纯黑就行，你看着调。'
                    },
                    {
                        id: 'REC-20260705',
                        time: '2026-07-05 11:12',
                        remark: '图标微调：对接人提出白色的猪 silhouette 图标换色',
                        ocrText: '对接人-李经理: 让你把我发的图片里面的白色的猪换一个颜色，不是让你生成一张新图。我: 收到，马上改。'
                    },
                    {
                        id: 'REC-20260618',
                        time: '2026-06-18 16:45',
                        remark: '接口变动：确定历史分录null值处理逻辑',
                        ocrText: '后端大刘: 老版本没有分录就是存入的null，这个不用猜嘛，前端直接做兼容。'
                    }
                ]);

                // 计算属性：前端高性能本地过滤（同时匹配备注和图片OCR文本）
                const filteredRecords = computed(() => {
                    const query = searchQuery.value.trim().toLowerCase();
                    if (!query) return records.value;
                    return records.value.filter(r => 
                        r.remark.toLowerCase().includes(query) || 
                        r.ocrText.toLowerCase().includes(query)
                    );
                });

                // 添加新记录
                const addRecord = () => {
                    if (!newRecord.value.remark) {
                        alert('请至少填写一句备注，方便日后检索！');
                        return;
                    }
                    const now = new Date();
                    records.value.unshift({
                        id: `REC-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`,
                        time: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
                        remark: newRecord.value.remark,
                        ocrText: newRecord.value.ocrText || '（未识别到图片文本）'
                    });
                    newRecord.value = { remark: '', ocrText: '' };
                };

                // 搜索关键词高亮逻辑
                const highlightText = (text) => {
                    const query = searchQuery.value.trim();
                    if (!query) return text;
                    const regex = new RegExp(`(${query})`, 'gi');
                    return text.replace(regex, '<mark class="bg-yellow-500/30 text-yellow-200 px-0.5 rounded">$1</mark>');
                };

                // 纯前端异步大数据导出方案（无需服务器）
                const exportData = () => {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records.value, null, 2));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", `ContextKeeper_Backup_${new Date().toISOString().slice(0,10)}.json`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                };

                return {
                    searchQuery, newRecord, filteredRecords,
                    addRecord, highlightText, exportData
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
