<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THEOS — AI原生P2P协作操作系统</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap');

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --black: #000000;
    --white: #ffffff;
    --blue: #0066FF;
    --blue-glow: rgba(0, 102, 255, 0.35);
    --blue-dim: rgba(0, 102, 255, 0.08);
    --gray-900: #0a0a0a;
    --gray-700: #1a1a1a;
    --gray-500: #333333;
    --gray-300: #888888;
    --gray-100: #cccccc;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--black);
    color: var(--white);
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.4;
  }

  .grain {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .page {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 60px;
  }

  .frame {
    position: fixed;
    z-index: 3;
    pointer-events: none;
  }
  .frame--top { top: 24px; left: 24px; right: 24px; height: 1px; background: linear-gradient(90deg, transparent, var(--gray-500) 20%, var(--gray-500) 80%, transparent); }
  .frame--bottom { bottom: 24px; left: 24px; right: 24px; height: 1px; background: linear-gradient(90deg, transparent, var(--gray-500) 20%, var(--gray-500) 80%, transparent); }
  .frame--left { top: 24px; bottom: 24px; left: 24px; width: 1px; background: linear-gradient(180deg, transparent, var(--gray-500) 20%, var(--gray-500) 80%, transparent); }
  .frame--right { top: 24px; bottom: 24px; right: 24px; width: 1px; background: linear-gradient(180deg, transparent, var(--gray-500) 20%, var(--gray-500) 80%, transparent); }

  .corner {
    position: fixed;
    z-index: 4;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gray-500);
  }
  .corner--tl { top: 36px; left: 40px; }
  .corner--tr { top: 36px; right: 40px; color: var(--blue); }
  .corner--bl { bottom: 36px; left: 40px; }
  .corner--br { bottom: 36px; right: 40px; }

  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--blue);
    margin-right: 8px;
    box-shadow: 0 0 8px var(--blue-glow);
    animation: pulse 2s ease-in-out infinite;
    vertical-align: middle;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .content {
    max-width: 900px;
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .brand-mark {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.3s;
  }

  .brand-mark span {
    opacity: 0.5;
    margin: 0 8px;
  }

  .title-block {
    position: relative;
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.6s;
  }

  .title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(72px, 14vw, 160px);
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 0.9;
    color: var(--white);
    text-shadow: 0 0 80px rgba(0, 102, 255, 0.08);
    position: relative;
  }

  .title::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 2px;
    background: var(--blue);
    box-shadow: 0 0 12px var(--blue-glow);
  }

  .subtitle {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(14px, 2vw, 20px);
    font-weight: 300;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gray-300);
    margin-top: 24px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.9s;
  }

  .divider {
    width: 1px;
    height: 60px;
    background: linear-gradient(180deg, var(--blue), transparent);
    margin: 48px 0;
    opacity: 0;
    animation: fadeIn 0.6s ease forwards 1.2s;
  }

  .tagline {
    font-size: clamp(16px, 2.2vw, 22px);
    font-weight: 300;
    line-height: 1.8;
    color: var(--gray-100);
    max-width: 680px;
    margin-bottom: 56px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1.4s;
  }

  .tagline em {
    font-style: normal;
    color: var(--white);
    font-weight: 400;
  }

  .tagline .accent {
    color: var(--blue);
    font-weight: 500;
  }

  .cards {
    display: flex;
    gap: 24px;
    width: 100%;
    max-width: 760px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1.8s;
  }

  .card {
    flex: 1;
    border: 1px solid var(--gray-700);
    padding: 32px 28px;
    background: rgba(10, 10, 10, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    position: relative;
    transition: border-color 0.4s ease, transform 0.4s ease, box-shadow 0.4s ease;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--blue) 50%, transparent);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .card:hover {
    border-color: var(--blue);
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0, 102, 255, 0.08);
  }

  .card:hover::before {
    opacity: 1;
  }

  .card-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-label::before {
    content: '';
    display: inline-block;
    width: 16px;
    height: 1px;
    background: var(--blue);
  }

  .card-value {
    font-size: 15px;
    font-weight: 400;
    line-height: 1.7;
    color: var(--gray-100);
  }

  .card-value strong {
    display: block;
    color: var(--white);
    font-weight: 500;
    font-size: 16px;
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }

  .version-line {
    position: fixed;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--gray-500);
    text-transform: uppercase;
    z-index: 4;
    opacity: 0;
    animation: fadeIn 0.6s ease forwards 2.4s;
  }

  .version-line span {
    color: var(--blue);
  }

  .orbit {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    border: 1px solid rgba(0, 102, 255, 0.06);
    border-radius: 50%;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    animation: fadeIn 1.2s ease forwards 0.5s;
  }

  .orbit-2 {
    width: 800px;
    height: 800px;
    border-color: rgba(0, 102, 255, 0.04);
    animation: fadeIn 1.2s ease forwards 0.7s, rotate 60s linear infinite;
  }

  .orbit-3 {
    width: 1000px;
    height: 1000px;
    border-color: rgba(0, 102, 255, 0.02);
    animation: fadeIn 1.2s ease forwards 0.9s, rotate 90s linear infinite reverse;
  }

  @keyframes rotate {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (max-width: 768px) {
    .page { padding: 24px 24px; }
    .cards { flex-direction: column; gap: 16px; }
    .corner { font-size: 9px; }
    .corner--tl { top: 20px; left: 20px; }
    .corner--tr { top: 20px; right: 20px; }
    .corner--bl { bottom: 20px; left: 20px; }
    .corner--br { bottom: 20px; right: 20px; }
    .frame--top, .frame--bottom { left: 12px; right: 12px; }
    .frame--left, .frame--right { top: 12px; bottom: 12px; }
    .divider { height: 40px; margin: 32px 0; }
    .tagline { margin-bottom: 40px; }
  }
</style>
</head>
<body>

<canvas class="canvas" id="bgCanvas"></canvas>
<div class="grain"></div>

<div class="orbit orbit-1"></div>
<div class="orbit orbit-2"></div>
<div class="orbit orbit-3"></div>

<div class="frame frame--top"></div>
<div class="frame frame--bottom"></div>
<div class="frame frame--left"></div>
<div class="frame frame--right"></div>

<div class="corner corner--tl"><span class="status-dot"></span>SYSTEM ONLINE</div>
<div class="corner corner--tr">THEOS v0.1.0 / CONCEPT</div>
<div class="corner corner--bl">P2P · AI-NATIVE · DECENTRALIZED</div>
<div class="corner corner--br">2026</div>

<div class="page">
  <div class="content">
    <div class="brand-mark">
      <span>—</span> THEOS <span>—</span>
    </div>

    <div class="title-block">
      <h1 class="title">THEOS</h1>
    </div>

    <p class="subtitle">AI原生P2P协作操作系统</p>

    <div class="divider"></div>

    <p class="tagline">
      为AI时代而生的<em>点对点协作操作系统</em>，<br>
      让<em>每个个体</em>与<em class="accent">智能体</em>自由连接、直接协作。
    </p>

    <div class="cards">
      <div class="card">
        <div class="card-label">核心价值</div>
        <div class="card-value">
          <strong>去中心 · 智协同 · 无边界</strong>
          消除中介壁垒，以AI为原生引擎，构建开放、平等、可信的协作网络。
        </div>
      </div>
      <div class="card">
        <div class="card-label">目标用户</div>
        <div class="card-value">
          <strong>分布式团队 · 创作者 · AI原生工作者</strong>
          为所有相信开放协作力量的人，提供下一代协作基础设施。
        </div>
      </div>
    </div>
  </div>
</div>

<div class="version-line">
  <span>◆</span> CONCEPT PREVIEW <span>◆</span>
</div>

<script>
(function() {
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let w, h;
  let nodes = [];
  const NODE_COUNT = 50;
  const CONNECT_DIST = 180;
  const mouse = { x: -9999, y: -9999 };

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function createNodes() {
    nodes = [];
    for (let i = 0; i < NODE_COUNT; i++) {
      nodes.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        r: Math.random() * 1.2 + 0.3,
        a: Math.random() * 0.4 + 0.1
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);

    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      n.x += n.vx;
      n.y += n.vy;

      if (n.x < 0 || n.x > w) n.vx *= -1;
      if (n.y < 0 || n.y > h) n.vy *= -1;

      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 102, 255, ' + n.a + ')';
      ctx.fill();

      for (let j = i + 1; j < nodes.length; j++) {
        const m = nodes[j];
        const dx = n.x - m.x;
        const dy = n.y - m.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < CONNECT_DIST) {
          const alpha = (1 - dist / CONNECT_DIST) * 0.12;
          ctx.beginPath();
          ctx.moveTo(n.x, n.y);
          ctx.lineTo(m.x, m.y);
          ctx.strokeStyle = 'rgba(0, 102, 255, ' + alpha + ')';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }

      const mdx = n.x - mouse.x;
      const mdy = n.y - mouse.y;
      const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
      if (mdist < 220) {
        const alpha = (1 - mdist / 220) * 0.3;
        ctx.beginPath();
        ctx.moveTo(n.x, n.y);
        ctx.lineTo(mouse.x, mouse.y);
        ctx.strokeStyle = 'rgba(0, 102, 255, ' + alpha + ')';
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', function() {
    resize();
    createNodes();
  });

  window.addEventListener('mousemove', function(e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  resize();
  createNodes();
  draw();
})();
</script>

</body>
</html>
