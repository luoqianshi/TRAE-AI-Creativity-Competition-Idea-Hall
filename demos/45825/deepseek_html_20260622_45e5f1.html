    function answerDemon(demonName, optionIdx) {
        const question = player.currentDemonQuestion;
        if (!question) return;
        
        const opt = question.options[optionIdx];
        if (!opt) return;
        
        player.currentDemonQuestion = null;
        
        // 应用效果
        if (opt.daoxin) player.daoXin = Math.max(0, (player.daoXin || 0) + opt.daoxin);
        if (opt.fuyuan) player.fuyuan = (player.fuyuan || 0) + opt.fuyuan;
        if (opt.demonPower) player.demonPower = (player.demonPower || 0) + opt.demonPower;
        if (opt.power) player.base_power = (player.base_power || 10) + opt.power;
        
        let resultType = opt.type;
        let resultMsg = '';
        
        if (opt.type === 'enlightenment') {
            resultMsg = '一语惊醒梦中人!道心大进!';
            player.heartDemons.active = null;
            if (!player.heartDemons.defeated.includes(demonName)) {
                player.heartDemons.defeated.push(demonName);
                player.heartDemonBonus = (player.heartDemonBonus || 0) + 0.05;
            }
            addDaoXinFragment('enlightenment', `降服${demonName}`, question.question, opt.text);
            showResult(true, `${demonName}心魔已降服!道心圆满!`, '', {
                '道心': `+${opt.daoxin}`,
                '福缘': `+${opt.fuyuan}`,
                '永久战力': '+5%'
            });
        } else if (opt.type === 'demon' || opt.type === 'evil') {
            resultMsg = '心魔趁机而入...魔念加深!';
            addDaoXinFragment('demon', `${demonName}拷问失败`, question.question, opt.text);

            addDaoXinFragment('choice', `与${demonName}对话`, question.question, opt.text);

        addEvent(`与${demonName}对质: ${resultMsg}`, resultType === 'enlightenment' ? 'highlight' : resultType === 'demon' ? 'danger' : 'info');

        actionHeartDemon();

        const scenario = FUTURE_VISION_SCENARIOS.find(s => s.id === scenarioId);

        // 消耗寿元

        player.tiandaoGaze = (player.tiandaoGaze || 0) + 1;
        
        // 生成未来片段
        const futures = [];
        scenario.options.forEach(opt => {

    function useMemoryAttack(memIdx) {
        const battle = player.willBattle;
        if (!battle || battle.playerMemories.length <= memIdx) return;
        
        const mem = battle.playerMemories.splice(memIdx, 1)[0];
        
        // 玩家攻击
        const playerDamage = mem.power + Math.random() * 10;
        battle.targetWill -= playerDamage;
        battle.log.push({ type: 'player', text: `你的「${mem.name}」冲击对方意识，造成${Math.floor(playerDamage)}点意志伤害！` });
        
        // 共鸣判定
        const targetMem = pick(battle.targetMemories);
        if (targetMem && Math.random() < 0.3) {
            battle.log.push({ type: 'info', text: `两种记忆产生共鸣...效果加倍！` });
            battle.targetWill -= playerDamage;
        }
        
        // 对方反击
        if (battle.targetWill > 0 && battle.targetMemories.length > 0) {
            const enemyMem = battle.targetMemories.splice(Math.floor(Math.random() * battle.targetMemories.length), 1)[0];
            const enemyDamage = enemyMem.power * 0.8 + Math.random() * 5;
            battle.playerWill -= enemyDamage;
            battle.log.push({ type: 'target', text: `对方的「${enemyMem.name}」反噬，造成${Math.floor(enemyDamage)}点伤害！` });
        }
        
        renderWillBattle();
    }

            battle.log.push({ type: 'target', text: `对方本能反击，造成${Math.floor(enemyDamage)}点伤害！` });
        }
        
        renderWillBattle();
    }

    // 功法畸变系统
    function mutateActiveTechnique() {
        const era = getWorldEra();
        if (era !== WORLD_ERA.DARK && era !== WORLD_ERA.IRON) return;
        if (Math.random() > 0.1) return; // 只有10%概率畸变
        
        if (!player.mutatedTechniques) player.mutatedTechniques = {};
        const activeTech = player.activeTechnique;
        if (!activeTech) return;
        
        if (player.mutatedTechniques[activeTech]) return; // 已畸变
        
        const mutation = pick(TECHNIQUE_MUTATIONS);
        player.mutatedTechniques[activeTech] = mutation;
        
        addEvent(`功法「${activeTech}」发生畸变：${mutation.name}！`, 'purple');
        showToast(`功法畸变：${mutation.name}`, 'purple', 4000);
        
        return mutation;
    }

    // 榨取系统（击杀获取灵气）
    function drainSpiritFromEnemy(enemyPower) {
        const era = getWorldEra();
        if (era !== WORLD_ERA.DARK) return 0;
        
        const drained = Math.floor(enemyPower * 0.3);
        player.xiu += drained;
        consumeWorldSpirit(-drained * 0.1); // 微量恢复世界灵气
        addEvent(`榨取敌人体内灵气，修为+${drained}`, 'danger');
        return drained;
    }

        navigator.clipboard.writeText(encoded).then(() => {

        }).catch(() => {
            addEvent('导出失败,请重试', 'danger');

    function useSkillCombo(comboId) {
        const combo = SKILL_COMBOS.find(c => c.id === comboId);
        if (!combo) return;

        const hasAllSkills = combo.skills.every(s => player.battleSkills?.includes(s));
        if (!hasAllSkills) {
            showToast('未学习组合所需的全部技能', 'warning', 2000);
            return;
        }

        addBattleLog(`🔗 使用技能组合【${combo.name}】!`);

        combo.skills.forEach(skillName => {
            useSkill(skillName);
        });

        if (combo.bonus.damage) {
            const bonusDamage = Math.floor(calcPower(player) * combo.bonus.damage);
            battleState.enemyPower -= bonusDamage;
            addBattleLog(`💥 组合加成！额外造成 ${bonusDamage} 点伤害!`);
        }

        if (combo.bonus.reduce) {
            addBattleLog(`🛡️ 组合加成！额外减少 ${combo.bonus.reduce * 100}% 伤害!`);
        }

        if (combo.bonus.heal) {
            const healAmount = Math.floor(player.hp_max * combo.bonus.heal);
            player.hp = Math.min(player.hp_max, player.hp + healAmount);
            addBattleLog(`💚 组合加成！额外恢复 ${healAmount} 点气血!`);
        }

        updateBattleUI();
        
        if (battleState.enemyPower <= 0) {
            battleVictory();
        }
    }

        }
    }

    function useSkill(skillName) {
        let skill = BATTLE_SKILLS[skillName];
        if (!skill) {
            skill = TECHNIQUE_BATTLE_EFFECT[skillName];
        }
        
        if (!skill) {
            console.log(`[战斗日志][技能释放] 技能/功法不存在: ${skillName}`);
            return;
        }

        const cd = battleState.skillCooldowns[skillName] || 0;
        console.log(`[战斗日志][冷却检查] 技能: ${skillName}, 当前冷却: ${cd}, 冷却时间: ${skill.cooldown}`);
        if (cd > 0) {
            console.log(`[战斗日志][冷却检查] 技能冷却中,无法释放: ${skillName}`);
            return;
        }
        
        if (player.hp <= 0) {
            console.log(`[战斗日志][状态检查] 玩家已阵亡,无法释放技能: ${skillName}`);
            return;
        }

        battleState.turn++;
        const playerPower = calcPower(player);
        console.log(`[战斗日志][技能释放] 回合: ${battleState.turn}, 释放技能: ${skillName}, 玩家战力: ${playerPower}`);
        
        let log = '';

        battleState.skillCooldowns[skillName] = skill.cooldown;
        console.log(`[战斗日志][冷却设置] ${skillName} 冷却设置为: ${skill.cooldown}回合`);

        switch (skill.type) {
            case 'attack':
            case 'special': {
                let damage = Math.floor(playerPower * skill.damage);
                
                // 暴击判定
                let critChance = getCritChance();
                let isCrit = Math.random() < critChance;
                if (isCrit) {
                    damage = Math.floor(damage * 1.5);
                    log = `💥 暴击(${Math.floor(critChance * 100)}%)！使用【${skillName}】造成 ${damage} 点伤害!`;
                } else {
                    log = `${skill.icon} 使用【${skillName}】造成 ${damage} 点伤害!`;
                }
                
                battleState.enemyPower -= damage;
                
                // 连击判定
                if (isCrit && Math.random() < 0.3) {
                    const comboDamage = Math.floor(damage * 0.3);
                    battleState.enemyPower -= comboDamage;
                    log += `\n⚡ 连击(30%)！追加 ${comboDamage} 点伤害！`;
                    battleState.comboCount = (battleState.comboCount || 0) + 1;
                }
                
                break;
            }
            case 'defense': {
                if (skill.reduce) {
                    battleState.buffs.push({ name: skillName, type: 'reduce', value: skill.reduce, duration: 1 });
                    log = `${skill.icon} 使用【${skillName}】,下次受到伤害减少 ${Math.floor(skill.reduce * 100)}%!`;
                }
                break;
            }
            case 'dodge': {
                const dodgeSuccess = Math.random() * 100 < skill.chance;
                if (dodgeSuccess) {
                    battleState.buffs.push({ name: skillName, type: 'dodge', value: 100, duration: 1 });
                    log = `${skill.icon} 使用【${skillName}】(${skill.chance}%概率),闪避成功!`;
                } else {
                    log = `${skill.icon} 使用【${skillName}】(${skill.chance}%概率),闪避失败!`;
                }
                break;
            }
            case 'heal': {
                const healAmount = Math.floor(player.hp_max * skill.heal);
                player.hp = Math.min(player.hp_max, player.hp + healAmount);
                log = `${skill.icon} 使用【${skillName}】,恢复 ${healAmount} 点气血!`;
                break;
            }
            case 'steal': {
                const damage = Math.floor(playerPower * skill.damage);
                battleState.enemyPower -= damage;
                const stealAmount = Math.floor(damage * skill.steal);
                player.xiu = Math.min(player.xiu_max, player.xiu + stealAmount);
                log = `${skill.icon} 使用【${skillName}】造成 ${damage} 点伤害,吸取 ${stealAmount} 修为!`;
                break;
            }
            case 'silence': {
                battleState.debuffs.push({ name: skillName, type: 'silence', duration: skill.duration || 2 });
                log = `${skill.icon} 使用【${skillName}】,沉默敌人 ${skill.duration || 2} 回合!`;
                break;
            }
            case 'slow': {
                battleState.debuffs.push({ name: skillName, type: 'slow', value: skill.slow || 0.3, duration: skill.duration || 2 });
                log = `${skill.icon} 使用【${skillName}】,降低敌人 ${Math.floor((skill.slow || 0.3) * 100)}% 攻击速度 ${skill.duration || 2} 回合!`;
                break;
            }
            case 'armor_break': {
                battleState.debuffs.push({ name: skillName, type: 'armor_break', value: skill.armor_break || 0.2, duration: skill.duration || 3 });
                log = `${skill.icon} 使用【${skillName}】,破甲 ${Math.floor((skill.armor_break || 0.2) * 100)}% ${skill.duration || 3} 回合!`;
                break;
            }
            case 'bleed': {
                battleState.debuffs.push({ name: skillName, type: 'bleed', value: skill.bleed || 0.05, duration: skill.duration || 3 });
                log = `${skill.icon} 使用【${skillName}】,造成流血效果 ${skill.duration || 3} 回合!`;
                break;
            }
            case 'rage': {
                battleState.rage = Math.min(100, battleState.rage + skill.rage || 20);
                log = `${skill.icon} 使用【${skillName}】,怒气值 +${skill.rage || 20}!`;
                break;
            }
            case 'ultimate': {
                if (battleState.rage < 100) {
                    log = `${skill.icon} 怒气不足(${Math.floor(battleState.rage)}%),无法释放【${skillName}】!`;
                    addBattleLog(log);
                    return;
                }
                battleState.rage = 0;
                let damage = Math.floor(playerPower * skill.damage);
                const critChance = getCritChance();
                let isCrit = Math.random() < critChance;
                if (isCrit) damage = Math.floor(damage * 2);
                battleState.enemyPower -= damage;
                log = `${skill.icon} 使用终极技能【${skillName}】造成 ${damage} 点伤害!${isCrit ? ' 💥暴击!' : ''}`;
                break;
            }
            case 'shield': {
                battleState.shield += skill.shield;
                log = `${skill.icon} 使用【${skillName}】,获得 ${skill.shield} 点护盾!`;
                break;
            }
            case 'reflect': {
                battleState.buffs.push({ name: skillName, type: 'reflect', value: skill.reflect, duration: 1 });
                log = `${skill.icon} 使用【${skillName}】,反弹 ${Math.floor(skill.reflect * 100)}% 伤害!`;
                break;
            }
        }

        addBattleLog(log);

        if (checkBattleEnd()) return;

        setTimeout(() => enemyTurn(), 500);
    }

    function enemyTurn() {
        if (battleState.enemyPower <= 0) return;

        const enemyPower = battleState.enemyPower;
        const playerPower = calcPower(player);

        let enemyDamage = Math.floor(enemyPower * (0.5 + Math.random() * 0.4));
        let log = '';

        // 检查减速debuff
        let slowFactor = 1;
        const slowDebuff = battleState.debuffs.find(d => d.type === 'slow');
        if (slowDebuff) slowFactor -= slowDebuff.value;
        enemyDamage = Math.floor(enemyDamage * slowFactor);

        // 检查闪避buff
        let dodged = false;
        const dodgeBuff = battleState.buffs.find(b => b.type === 'dodge');
        if (dodgeBuff && Math.random() * 100 < dodgeBuff.value) {
            dodged = true;
            log = '🏃 闪避了敌方攻击!';
        }

        if (!dodged) {
            // 格挡判定
            let blocked = false;
            const blockChance = getBlockChance();
            if (Math.random() < blockChance) {
                blocked = true;
                enemyDamage = Math.floor(enemyDamage * 0.3);
                log = '🛡️ 格挡成功！仅受到30%伤害!';
                console.log('[战斗日志][格挡] 格挡成功!');
            }
            
            // 检查减伤buff
            let reduce = 1;
            const reduceBuff = battleState.buffs.find(b => b.type === 'reduce');
            if (reduceBuff) reduce -= reduceBuff.value;
            enemyDamage = Math.floor(enemyDamage * reduce);

            // 检查护盾
            if (battleState.shield > 0) {
                if (battleState.shield >= enemyDamage) {
                    battleState.shield -= enemyDamage;
                    log += (log ? '\n' : '') + `🛡️ 护盾吸收了 ${enemyDamage} 点伤害!`;
                    enemyDamage = 0;
                } else {
                    enemyDamage -= battleState.shield;
                    log += (log ? '\n' : '') + `🛡️ 护盾破碎,剩余 ${enemyDamage} 点伤害!`;
                    battleState.shield = 0;
                }
            }

            // 检查破甲debuff
            const armorBreakDebuff = battleState.debuffs.find(d => d.type === 'armor_break');
            if (armorBreakDebuff) {
                enemyDamage = Math.floor(enemyDamage * (1 + armorBreakDebuff.value));
            }

            if (enemyDamage > 0) {
                player.hp = Math.max(0, player.hp - enemyDamage);
                log += (log ? '\n' : '') + `👹 ${battleState.enemyName} 攻击造成 ${enemyDamage} 点伤害!`;
            }

            // 检查反弹
            const reflectBuff = battleState.buffs.find(b => b.type === 'reflect');
            if (reflectBuff) {
                const reflectDamage = Math.floor(enemyDamage * reflectBuff.value);
                battleState.enemyPower -= reflectDamage;
                log += `\n💢 反弹 ${reflectDamage} 点伤害给敌人!`;
            }
        }

        // 处理流血debuff
        battleState.debuffs.forEach(debuff => {
            if (debuff.type === 'bleed') {
                const bleedDamage = Math.floor(enemyPower * debuff.value);
                battleState.enemyPower -= bleedDamage;
                log += (log ? '\n' : '') + `🩸 流血造成 ${bleedDamage} 点伤害!`;
            }
        });

        // 增强敌方AI：根据血量使用策略
        if (battleState.isBoss && !dodged) {
            const hpPercent = battleState.enemyPower / enemyPower;
            if (hpPercent < 0.3) {
                // 低血量时狂暴，攻击力提升50%
                const rageDamage = Math.floor(enemyPower * 0.3);
                player.hp = Math.max(0, player.hp - rageDamage);
                log += (log ? '\n' : '') + `😈 ${battleState.enemyName} 狂暴!造成 ${rageDamage} 点额外伤害!`;
            } else if (hpPercent < 0.5) {
                // 中低血量时可能使用技能
                if (Math.random() < 0.3) {
                    const healAmount = Math.floor(enemyPower * 0.1);
                    battleState.enemyPower = Math.min(enemyPower, battleState.enemyPower + healAmount);
                    log += (log ? '\n' : '') + `💚 ${battleState.enemyName} 使用恢复技能,恢复 ${healAmount} 点气血!`;
                }
            }
        }

        addBattleLog(log);

        // 更新buff持续时间
        battleState.buffs = battleState.buffs.filter(b => {
            b.duration--;
            return b.duration > 0;
        });

        // 更新debuff持续时间
        battleState.debuffs = battleState.debuffs.filter(d => {
            d.duration--;
            return d.duration > 0;
        });

        // 更新技能冷却
        Object.keys(battleState.skillCooldowns).forEach(skill => {
            if (battleState.skillCooldowns[skill] > 0) {
                battleState.skillCooldowns[skill]--;
            }
        });

        // 增加怒气
        battleState.rage = Math.min(100, battleState.rage + 15);

        // 检查战斗结果
        if (checkBattleEnd()) return;

        // 更新界面
        updateBattleUI();
    }

    function checkBattleEnd() {
        const playerPower = calcPower(player);

        if (battleState.enemyPower <= 0) {
            // 胜利
            const drops = {};
            let dropText = '';
            if (Math.random() < 0.5) {
                const herb = pick(Object.keys(HERB_PRICE));
                player.herb[herb] = (player.herb[herb] || 0) + rand(1, (battleState.isBoss ? 5 : 2));
                drops[herb] = true;
                dropText += `${herb} `;
            }
            const lingshiGain = rand(10, battleState.isBoss ? 100 : 30);
            player.lingshi += lingshiGain;
            drops.lingshi = lingshiGain;

            // 剑意经验
            addSwordIntentExp(rand(5, battleState.isBoss ? 30 : 10));

            addBattleLog(`🎉 战胜 ${battleState.enemyName}!`);
            addBattleLog(`获得 ${lingshiGain} 灵石!${dropText ? `\n获得 ${dropText}!` : ''}`);

            // 检查是否有秘境奖励
            if (battleState.realmRewards) {
                const rr = battleState.realmRewards;
                player.lingshi += rr.lingshi;
                player.xiu = Math.min(player.xiu_max, player.xiu + rr.xiu);
                addBattleLog(`🎁 秘境探索奖励: ${rr.lingshi} 灵石, ${rr.xiu} 修为!`);
            }

            // 检查是否有挑战奖励
            if (battleState.challengeRewards) {
                const cr = battleState.challengeRewards;
                if (cr.lingshi) player.lingshi += cr.lingshi;
                if (cr.xiu) player.xiu = Math.min(player.xiu_max, player.xiu + cr.xiu);
                if (cr.sectContribution) {
                    player.sectContribution = (player.sectContribution || 0) + cr.sectContribution;
                }
                addBattleLog(`🎁 挑战奖励已发放!`);
            }

            setTimeout(() => {
                closeModal();
                updateUI();
                addEvent(`战胜 ${battleState.enemyName}!`, 'success');

                // 如果有秘境奖励，显示奖励弹窗
                if (battleState.realmRewards) {
                    showResult(true, `成功探索${battleState.realmName}!`, '', battleState.realmRewards);
                    addEvent(`探索${battleState.realmName}成功,击败${battleState.realmEnemy || battleState.enemyName}`, 'success');
                    // 清理秘境标记
                    battleState.realmRewards = null;
                    battleState.realmName = null;
                    battleState.realmEnemy = null;
                }

                // 如果有挑战奖励，显示奖励弹窗
                if (battleState.challengeRewards) {
                    showResult(true, `击败${battleState.challengeName}!`, '', battleState.challengeRewards);
                    addEvent(`挑战${battleState.challengeName}成功!`, 'success');
                    // 清理挑战标记
                    battleState.challengeRewards = null;
                    battleState.challengeName = null;
                }
            }, 1000);
            return true;
        }

        if (player.hp <= 0) {
            // 失败
            addBattleLog(`💀 你被 ${battleState.enemyName} 击败了...`);

            setTimeout(() => {
                closeModal();

                // 处理挑战失败
                if (battleState.challengeName) {
                    addEvent(`挑战${battleState.challengeName}失败`, 'danger');
                    battleState.challengeRewards = null;
                    battleState.challengeName = null;
                }

                // 清理秘境标记（探索失败）
                if (battleState.realmName) {
                    addEvent(`探索${battleState.realmName}失败`, 'danger');
                    battleState.realmRewards = null;
                    battleState.realmName = null;
                    battleState.realmEnemy = null;
                }

                // 涅槃体复活
                const bodyEffect = getSpecialBodyEffect();
                if (bodyEffect.effect.reborn && !player._rebornUsed) {
                    player._rebornUsed = true;
                    player.hp = Math.floor(player.hp_max * (bodyEffect.effect.reborn_hp || 0.5));
                    addEvent('💫 涅槃重生! 恢复50%气血', 'highlight');
                } else {
                    addEvent('你已身死...', 'danger');
                    gameEnded = true;
                }
                updateUI();
            }, 1000);
            return true;
        }

        return false;
    }

        if (playerHpEl) {
            playerHpEl.textContent = `气血: ${player.hp}/${player.hp_max}`;

        const enemyHpEl = document.getElementById('battleEnemyHp');
        if (enemyHpEl) {
            enemyHpEl.textContent = `气血: ${Math.floor(battleState.enemyPower)}/${Math.floor(battleState.enemyPower + calcPower(player))}`;

        const shieldEl = document.getElementById('battleShield');

            shieldEl.textContent = battleState.shield > 0 ? `护盾: ${battleState.shield}` : '';

        const critRateEl = document.getElementById('battleCritRate');
        if (critRateEl) {
            critRateEl.textContent = `暴击率: ${Math.floor(getCritChance() * 100)}%`;

        if (blockRateEl) {

        }
    }

    function canBeastEvolve(beast) {
        const evolutions = BEAST_EVOLUTIONS[beast.name];
        if (!evolutions) return false;
        
        const currentStage = beast.evolutionStage || 0;
        if (currentStage >= evolutions.length) return false;
        
        const nextEvolution = evolutions[currentStage];
        return (beast.level || 1) >= nextEvolution.minLevel && player.lingshi >= 500 * (currentStage + 1);
    }

    function getEvolutionInfo(beast) {
        const evolutions = BEAST_EVOLUTIONS[beast.name];
        if (!evolutions) return null;
        
        const currentStage = beast.evolutionStage || 0;
        if (currentStage >= evolutions.length) return null;
        
        return evolutions[currentStage];
    }

    function evolveBeast(idx) {
        if (!player.beasts || !player.beasts[idx]) return;
        const beast = player.beasts[idx];
        evolveBeastCore(beast);
        closeModal();

        updateUI();

    function evolveBeastSingle() {
        if (!player.beast) return;

    function evolveBeastCore(beast) {
        const evolutions = BEAST_EVOLUTIONS[beast.name];
        if (!evolutions) {
            showToast('此灵兽无法进化', 'info');
            return;
        }
        
        const currentStage = beast.evolutionStage || 0;
        if (currentStage >= evolutions.length) {
            showToast('此灵兽已达到最高进化阶段', 'info');
            return;
        }
        
        const cost = 500 * (currentStage + 1);
        if (player.lingshi < cost) {
            showToast(`灵石不足！需要${cost}灵石`, 'danger');
            return;
        }
        
        player.lingshi -= cost;
        
        const evolution = evolutions[currentStage];
        beast.name = evolution.name;
        beast.power = Math.floor(beast.power * evolution.powerMult);
        beast.evolutionStage = currentStage + 1;
        
        // 领悟新技能
        if (evolution.skills) {
            beast.skills = evolution.skills;
        }
        
        addEvent(`${beast.name}进化成功！战力大幅提升！`, 'highlight');
        showToast(`${beast.name}进化成功！战力+${Math.floor(beast.power * (evolution.powerMult - 1))}`, 'success', 4000);
        
        // 成就检查
        unlockAchievement('beast_master');
    }

    function quickCultivate() {
        const times = 10;
        let totalGain = 0;
        
        for (let i = 0; i < times; i++) {
            if (player.xiu >= player.xiu_max) break;
            
            let gain = Math.floor(calcPracticeGain(player) * 1.5); // 灵石辅助模式
            if (player.bonusXiuMult) gain = Math.floor(gain * player.bonusXiuMult);
            
            const era = getWorldEra();
            gain = Math.floor(gain * era.xiuMult);
            
            const demonDebuff = getHeartDemonDebuff();
            if (demonDebuff.xiu_mult) gain = Math.floor(gain * demonDebuff.xiu_mult);
            
            player.xiu += gain;
            totalGain += gain;
            player.day++;
            
            consumeWorldSpirit(1);
        }
        
        // 消耗灵石
        const cost = 20 * times;
        if (player.lingshi >= cost) {
            player.lingshi -= cost;
        }
        
        showToast(`一键修炼完成！修为+${totalGain}`, 'success', 3000);
        addEvent(`一键修炼${times}天，修为+${totalGain}`, 'success');
        
        // 每日任务
        updateDailyQuest('cultivate_5');
        
        updateUI();
        actionQuickActions();
    }

    function quickDaily() {
        let completed = 0;
        
        if (player.dailyQuests && player.dailyQuests.quests) {
            player.dailyQuests.quests.forEach(quest => {
                if (quest.completed && !quest.claimed) {
                    quest.claimed = true;
                    if (quest.reward.lingshi) player.lingshi += quest.reward.lingshi;
                    if (quest.reward.xiu) player.xiu = Math.min(player.xiu_max, player.xiu + quest.reward.xiu);
                    completed++;
                }
            });
        }
        
        if (completed > 0) {
            showToast(`领取了${completed}个每日任务奖励！`, 'success', 3000);
            addEvent(`一键领取${completed}个日常任务奖励`, 'success');
        } else {
            showToast('暂无可领取的任务', 'info', 2000);
        }
        
        updateUI();
        actionQuickActions();
    }

    function quickHeal() {
        const hpMissing = player.hp_max - player.hp;
        if (hpMissing <= 0) {
            showToast('气血已满', 'info');
            return;
        }
        
        // 检查是否有疗伤丹
        const pillName = '二阶疗伤丹';
        if (player.items?.[pillName] && player.items[pillName] > 0) {
            player.items[pillName]--;
            const healAmount = Math.floor(player.hp_max * 0.5);
            player.hp = Math.min(player.hp_max, player.hp + healAmount);
            if (player.items[pillName] <= 0) delete player.items[pillName];
            showToast(`使用疗伤丹，恢复${healAmount}气血`, 'success', 3000);
            addEvent(`使用${pillName}，恢复${healAmount}气血`, 'success');
        } else {
            // 用灵石恢复
            const cost = Math.floor(hpMissing * 0.5);
            if (player.lingshi >= cost) {
                player.lingshi -= cost;
                player.hp = player.hp_max;
                showToast(`消耗${cost}灵石，气血完全恢复`, 'success', 3000);
                addEvent(`消耗${cost}灵石恢复气血`, 'success');
            } else {
                showToast('灵石不足以完全恢复', 'danger');
                return;
            }
        }
        
        updateUI();
        actionQuickActions();
    }

    function calculateBreakthroughInfo() {
        let successRate = 0.3;
        
        if (player.xiu >= player.xiu_max * 0.8) successRate += 0.2;
        if (player.xiu >= player.xiu_max) successRate += 0.3;
        
        if (player.daoXin && player.daoXin >= 10) successRate += 0.1;
        if (player.daoXin && player.daoXin >= 30) successRate += 0.1;
        
        if (player.heartDemons && player.heartDemons.demonPower > 50) {
            successRate -= 0.2;
        }
        
        const recommendations = [];
        if (player.xiu < player.xiu_max * 0.8) recommendations.push('建议修炼至修为满');
        if (!player.daoXin || player.daoXin < 10) recommendations.push('建议提升道心');
        if (player.heartDemons && player.heartDemons.demonPower > 50) recommendations.push('建议先清除心魔');
        
        return { successRate: Math.max(0.05, Math.min(1, successRate)), recommendations };
    }

    function secludedMeditation(days) {
        if (player.xiu >= player.xiu_max) {
            showToast('修为已满，请先突破！', 'warning', 2000);
            return;
        }

        let totalGain = 0;
        const method = CULTIVATION_METHODS.find(m => m.id === 'meditation') || CULTIVATION_METHODS[0];
        
        for (let i = 0; i < days; i++) {
            if (player.xiu >= player.xiu_max) break;
            
            let gain = Math.floor(calcPracticeGain(player) * method.xiuMult * 0.8);
            gain = Math.floor(gain * getWorldEra().xiuMult);
            
            const demonDebuff = getHeartDemonDebuff();
            if (demonDebuff.xiu_mult) gain = Math.floor(gain * demonDebuff.xiu_mult);
            
            player.xiu = Math.min(player.xiu_max, player.xiu + gain);
            totalGain += gain;
            player.day++;
            consumeWorldSpirit(1);
            
            if (Math.random() < 0.05) {
                player.daoXin = (player.daoXin || 0) + 1;
            }
        }
        
        showToast(`闭关${days}天完成！修为+${totalGain}`, 'success', 3000);
        addEvent(`🧘 闭关${days}天，修为+${totalGain}`, 'success');
        
        updateUI();
        saveGame();
    }

    function canUseCultivationMethod(method) {
        if (method.lingshiCost > 0 && player.lingshi < method.lingshiCost) return false;
        if (method.requireLover && (!player.lovers || player.lovers.length === 0)) return false;
        if (player.hp <= player.hp_max * (method.hpCost || 0)) return false;
        return true;
    }

    function cultivateByMethod(methodId) {
        const method = CULTIVATION_METHODS.find(m => m.id === methodId);
        if (!method || !canUseCultivationMethod(method)) {
            showToast('无法进行此修炼', 'danger');
            return;
        }
        
        const days = method.daysCost || 1;
        let totalGain = 0;
        let daoxinGained = 0;
        let hpBonus = 0;
        
        for (let i = 0; i < days; i++) {
            let gain = Math.floor(calcPracticeGain(player) * method.xiuMult);
            if (player.bonusXiuMult) gain = Math.floor(gain * player.bonusXiuMult);
            
            const era = getWorldEra();
            gain = Math.floor(gain * era.xiuMult);
            
            const demonDebuff = getHeartDemonDebuff();
            if (demonDebuff.xiu_mult) gain = Math.floor(gain * demonDebuff.xiu_mult);
            
            let mutation = null;
            if (player.mutatedTechniques && player.activeTechnique) {
                mutation = player.mutatedTechniques[player.activeTechnique];
                if (mutation) {
                    gain = Math.floor(gain * mutation.xiuMult);
                }
            }
            
            player.xiu += gain;
            totalGain += gain;
            player.day++;
            
            consumeWorldSpirit(1);
            
            // 功法畸变副作用
            if (mutation) {
                if (mutation.lifeCost) player.day += mutation.lifeCost;
                if (mutation.hpCost) player.hp = Math.max(1, Math.floor(player.hp - player.hp_max * mutation.hpCost));
                if (mutation.demonGain) {
                    player.heartDemons = player.heartDemons || { active: null, demonPower: 0, defeated: [] };
                    player.heartDemons.demonPower = (player.heartDemons.demonPower || 0) + 3 * mutation.demonGain;
                }
                if (mutation.lingshiCost) player.lingshi = Math.max(0, player.lingshi - Math.floor(10 * mutation.lingshiCost));
                if (mutation.injuryChance && Math.random() < mutation.injuryChance) {
                    player.hp = Math.max(1, Math.floor(player.hp - player.hp_max * 0.2));
                    addEvent('功法反噬！经脉受损，气血-20%', 'danger');
                }
                if (mutation.daoxinLossChance && Math.random() < mutation.daoxinLossChance) {
                    player.daoXin = Math.max(0, (player.daoXin || 0) - 3);
                    addEvent('前世残魂扰神，道心-3', 'purple');
                }
            }
            
            // 道心增长
            if (Math.random() < method.daoxinChance) {
                let daoGain = 2 + (method.daoxinBonus || 0);
                if (mutation && mutation.daoxinGain) daoGain = Math.floor(daoGain * mutation.daoxinGain);
                player.daoXin = (player.daoXin || 0) + daoGain;
                daoxinGained += daoGain;
            }
            
            // 炼体气血加成
            if (method.hpBonus) {
                const hpInc = Math.floor(player.hp_max * method.hpBonus);
                player.hp_max += hpInc;
                player.hp = Math.min(player.hp + hpInc, player.hp_max);
                hpBonus += hpInc;
            }
        }
        
        // 消耗灵石
        if (method.lingshiCost > 0) {
            player.lingshi -= method.lingshiCost;
        }
        
        // 消耗气血
        if (method.hpCost > 0) {
            player.hp = Math.max(1, Math.floor(player.hp - player.hp_max * method.hpCost));
        }
        
        // 魔念增长
        if (method.demonGain > 0) {
            player.heartDemons = player.heartDemons || { active: null, demonPower: 0, defeated: [] };
            player.heartDemons.demonPower = (player.heartDemons.demonPower || 0) + method.demonGain;
        }
        
        // 道侣好感度
        if (method.loverAffectionBonus && player.lovers && player.lovers.length > 0) {
            const lover = pick(player.lovers);
            loverGainAffection(lover, method.loverAffectionBonus * days);
        }
        
        // 道侣好感随机增长
        if (player.lovers && player.lovers.length > 0 && Math.random() < 0.1) {
            player.lovers.forEach(l => {
                if (Math.random() < 0.1) loverGainAffection(l, 1);
            });
        }
        
        // 构建结果提示
        let resultMsg = `修炼${days}天，修为+${totalGain}`;
        if (daoxinGained > 0) resultMsg += `，道心+${daoxinGained}`;
        if (hpBonus > 0) resultMsg += `，气血上限+${hpBonus}`;
        
        if (player.xiu >= player.xiu_max) {
            showToast('修为已满,可进行突破!', 'highlight', 3000);
            addEvent('修为已满,可进行突破!', 'highlight');
        } else {
            showToast(resultMsg, 'success', 2000);
            addEvent(`${method.name}，修为+${totalGain}`, 'success');
        }
        
        // 道心碎片
        if (daoxinGained > 0) {
            addDaoXinFragment('enlightenment', `${method.name}悟道`, `${method.name}中有所感悟，道心+${daoxinGained}`, '继续苦修');
        }
        
        // 每日任务
        generateDailyQuests();
        updateDailyQuest('cultivate_5');
        
        // 尝试功法畸变
        mutateActiveTechnique();
        
        // 检查末法
        checkApocalypse();
        
        // 心魔随机苏醒
        checkDemonAwakening();
        
        // 成就检查
        if (player.day >= 100) unlockAchievement('survivor_100');
        if (player.day >= 365) unlockAchievement('survivor_365');
        if (player.lingshi >= 10000) unlockAchievement('rich_player');

        if (player.lovers && player.lovers.length > 0 && Math.random() < 0.02) {
            const lover = pick(player.lovers);
            addEvent(`${lover.name}托梦而来...`, 'pink');
        }

        checkDayEvents();
        updateUI();
        
        // 重新打开修炼界面
        actionXiulian();
    }

    function actionBreak() {
        if (player.xiu < player.xiu_max) {
            showToast('修为未满,无法突破!', 'danger', 3000);
            addEvent('修为未满,无法突破', 'danger');
            return;
        }

        const jingjieData = JINGJIE_DATA[player.jingjie];
        if (!jingjieData.name) {
            showToast('已臻化境,无需突破!', 'highlight', 3000);
            addEvent('已臻化境,无需突破!', 'highlight');
            return;
        }

        // 计算突破成功率
        const breakInfo = calculateBreakthroughInfo();
        let successRate = breakInfo.successRate;

        // 检查突破丹药
        let pillBonus = 0;
        const breakPills = ['筑基丹', '金丹丹', '元婴丹', '化神丹', '破阶丹'];
        breakPills.forEach(pill => {
            if (player.pills?.[pill] && player.pills[pill] > 0) {
                const pillData = PILLS[pill];
                if (pillData.突破加成) {
                    successRate += pillData.突破加成 / 100;
                    pillBonus += pillData.突破加成;
                    player.pills[pill]--;
                }
            }
        });

        // 检查心魔影响
        let demonPenalty = 0;
        if (player.heartDemons && player.heartDemons.demonPower > 30) {
            demonPenalty = Math.floor(player.heartDemons.demonPower * 0.5);
            successRate -= player.heartDemons.demonPower / 200;
        }

        successRate = Math.max(0.05, Math.min(1, successRate));

        showToast(`突破成功率: ${Math.floor(successRate * 100)}%${pillBonus > 0 ? ` (丹药加成+${pillBonus}%)` : ''}${demonPenalty > 0 ? ` (心魔干扰-${demonPenalty}%)` : ''}`, 'info', 3000);

        let dmg = getJingjieIdx(player.jingjie) * 20;
        
        const raceData = getRaceData(player.race);
        
        if (raceData.talent.tianjie_dmg_cut) {
            dmg = Math.floor(dmg * (1 - raceData.talent.tianjie_dmg_cut));
        }

        // 道心减免天劫伤害
        if (player.daoXin) {
            dmg = Math.floor(dmg * (1 - Math.min(player.daoXin * 0.01, 0.5)));
        }
        
        if (raceData.talent.all_mult) {
            player.xiu_max = Math.floor(jingjieData.next * raceData.talent.all_mult);
        } else {
            player.xiu_max = jingjieData.next;
        }
        
        player.hp -= dmg;
        showToast(`天劫降临!气血-${dmg}`, 'danger', 2000);
        addEvent(`天劫降临,气血-${dmg}`, 'danger');

        // 突破成功判定
        if (player.hp > 0 && Math.random() < successRate) {
            player.jingjie = jingjieData.name;
            player.xiu = 0;
            
            player.hp_max = jingjieData.hp + raceData.hp_bonus;
            player.hp = player.hp_max;
            
            showToast(`突破成功!晋升${getJingjieName(player.jingjie)}!`, 'success', 4000);
            showResult(true, `晋升${getJingjieName(player.jingjie)}!`, '', { '境界': getJingjieName(player.jingjie), '气血上限': player.hp_max });
            addEvent(`突破成功!晋升${getJingjieName(player.jingjie)}!`, 'highlight');

            // 突破奖励
            player.lingshi += jingjieData.lingshiReward || 100;
            
            // 成就检查
            if (player.jingjie === '筑基') unlockAchievement('breakthrough_1');
            if (player.jingjie === '金丹') unlockAchievement('breakthrough_2');
            if (player.jingjie === '元婴') unlockAchievement('breakthrough_3');
            if (player.jingjie === '化神') unlockAchievement('legend');
            if (player.jingjie === '渡劫') unlockAchievement('breakthrough_5');
            if (player.jingjie === '大乘') unlockAchievement('breakthrough_6');

            if (player.lovers) {
                player.lovers.forEach(l => {
                    loverGainAffection(l, 10);
                });
            }
        } else if (player.hp > 0) {
            // 突破失败但没死
            showToast('突破失败,修为受损!', 'danger', 4000);
            addEvent('突破失败,修为受损', 'danger');
            player.xiu = Math.floor(player.xiu_max * 0.5);
            player.hp = Math.max(1, Math.floor(player.hp * 0.5));
            
            // 突破失败可能产生心魔
            if (Math.random() < 0.3) {
                player.heartDemons = player.heartDemons || { active: null, demonPower: 0, defeated: [] };
                player.heartDemons.demonPower = (player.heartDemons.demonPower || 0) + 10;
                showToast('心魔滋生!', 'purple', 2000);
            }
        } else {
            showToast('突破失败,身死道消...', 'danger', 4000);
            addEvent('突破失败,身死道消...', 'danger');
            gameEnded = true;
        }

        updateUI();
    }

    function getLingbaoRarityColor(rarity) {

    function getLingbaoUpgradeCost(lb) {
        const baseCost = {
            '普通': 100,
            '精良': 300,
            '稀有': 800,
            '史诗': 2000,
            '传说': 5000,
            '神话': 15000
        };
        const rarityIdx = LINGBAO_RARITY.indexOf(lb.rarity);
        return baseCost[lb.rarity] * (lb.level || 1);
    }

    function upgradeLingbao(idx) {
        const lb = player.lingbao[idx];
        if (!lb) return;

        const cost = getLingbaoUpgradeCost(lb);
        if (player.lingshi < cost) {
            showToast('灵石不足', 'danger', 2000);
            return;
        }

        player.lingshi -= cost;
        lb.level = (lb.level || 1) + 1;
        lb.power = Math.floor(lb.power * 1.15);
        
        // 升级后可能提升稀有度
        if (lb.level % 5 === 0) {
            const rarityIdx = LINGBAO_RARITY.indexOf(lb.rarity);
            if (rarityIdx < LINGBAO_RARITY.length - 1) {
                lb.rarity = LINGBAO_RARITY[rarityIdx + 1];
                showToast(`灵宝【${lb.name}】进化为${lb.rarity}!`, 'highlight', 4000);
            }
        }

        showToast(`灵宝【${lb.name}】升级到Lv.${lb.level}!`, 'success', 2000);
        addEvent(`灵宝【${lb.name}】升级`, 'success');
        actionLingbao();
        updateUI();
    }

    function fuseLingbao(idx1, idx2) {
        const lb1 = player.lingbao[idx1];
        const lb2 = player.lingbao[idx2];
        if (!lb1 || !lb2) return;

        if (lb1.type !== lb2.type) {
            showToast('只能融合同类型法宝', 'warning', 2000);
            return;
        }

        // 融合规则：取较高稀有度，属性融合
        const rarityIdx1 = LINGBAO_RARITY.indexOf(lb1.rarity);
        const rarityIdx2 = LINGBAO_RARITY.indexOf(lb2.rarity);
        
        const newRarity = rarityIdx1 >= rarityIdx2 ? lb1.rarity : lb2.rarity;
        const newPower = Math.floor((lb1.power + lb2.power) * 1.2);
        const newLevel = Math.floor(((lb1.level || 1) + (lb2.level || 1)) / 2);
        
        // 合并加成
        const newBonus = { ...lb1.bonus };
        if (lb2.bonus) {
            Object.entries(lb2.bonus).forEach(([k, v]) => {
                if (newBonus[k]) {
                    newBonus[k] *= v;
                } else {
                    newBonus[k] = v;
                }
            });
        }

        lb1.rarity = newRarity;
        lb1.power = newPower;
        lb1.level = newLevel;
        lb1.bonus = newBonus;
        lb1.name = lb1.name + '·融合';

        player.lingbao.splice(idx2, 1);

        showToast(`法宝融合成功!获得【${lb1.name}】`, 'highlight', 4000);
        addEvent(`法宝融合: ${lb1.name}`, 'highlight');
        actionLingbao();
        updateUI();
    }

    function getLingbaoSetBonus() {
        const bonus = {};
        for (const [setName, setData] of Object.entries(LINGBAO_SETS)) {
            const ownedPieces = setData.pieces.filter(p => 
                player.lingbao.some(lb => lb.name === p || lb.name.startsWith(p))
            );
            
            if (ownedPieces.length === setData.pieces.length) {
                Object.entries(setData.bonus).forEach(([attr, value]) => {
                    if (!bonus[attr]) bonus[attr] = 1;
                    bonus[attr] *= value;
                });
            }
        }
        return bonus;
    }

            'accessory': { cost: 300, materials: { '一阶灵草': 2 }, chance: 0.6 },
            'special': { cost: 1000, materials: { '二阶灵草': 5, '妖兽内丹': 1 }, chance: 0.3 }
        };

        const recipe = recipes[type];
        if (!recipe) return;

        if (player.lingshi < recipe.cost) {
            showToast('灵石不足', 'danger', 2000);
            return;
        }

        for (const [mat, amt] of Object.entries(recipe.materials)) {
            if ((player.herb[mat] || 0) < amt) {
                showToast(`${mat}不足`, 'danger', 2000);
                return;
            }
        }

        player.lingshi -= recipe.cost;
        for (const [mat, amt] of Object.entries(recipe.materials)) {
            player.herb[mat] -= amt;
        }

        if (Math.random() < recipe.chance) {
            const availableLingbao = Object.entries(LINGBAO_DATA).filter(
                ([, data]) => data.type === type
            );
            const [name, data] = availableLingbao[Math.floor(Math.random() * availableLingbao.length)];
            
            player.lingbao.push({
                name: name,
                type: data.type,
                rarity: data.rarity,
                power: data.power,
                bonus: { ...data.bonus },
                level: 1,
                desc: data.desc
            });

            showToast(`炼器成功!获得法宝【${name}】`, 'success', 4000);
            addEvent(`获得法宝【${name}】`, 'highlight');
        } else {
            showToast('炼器失败，材料损毁', 'danger', 2000);
            addEvent('炼器失败', 'danger');
        }

        actionLingbao();
        updateUI();
    }

        for (let i = SECT_RANKS.length - 1; i >= 0; i--) {

                return SECT_RANKS[i];

        return SECT_RANKS[0];

            const randomTechnique = techniqueNames[Math.floor(Math.random() * techniqueNames.length)];

                showToast(`领悟成功!获得功法【${randomTechnique}】`, 'success', 4000);
                addEvent(`领悟功法【${randomTechnique}】`, 'highlight');

    function usePill(pill, count = 1) {
        if ((player.pills[pill] || 0) < count) {
            addEvent('丹药数量不足', 'danger');
            return;
        }
        
        const pillData = PILLS[pill];
        if (!pillData) {
            addEvent('丹药不存在', 'danger');
            return;
        }

        player.pills[pill] -= count;
        
        let messages = [];
        
        const raceData = getRaceData(player.race);
        const pillEffectMult = raceData.talent.pill_effect || 1;

        for (let i = 0; i < count; i++) {
            if (pillData.修) {
                let xiuGain = Math.floor(pillData.修 * pillEffectMult);
                if (pillData.race_bonus && pillData.race_bonus[player.race]) {
                    xiuGain += pillData.race_bonus[player.race].修 || 0;
                }
                player.xiu = Math.min(player.xiu_max, (player.xiu || 0) + xiuGain);
                if (i === 0) messages.push(`修为+${xiuGain * count}`);
            }

            if (pillData.心魔) {
                player.demonPower = (player.demonPower || 0) + pillData.心魔;
                if (i === 0) {
                    const totalDemon = pillData.心魔 * count;
                    if (totalDemon > 0) {
                        messages.push(`心魔+${totalDemon}`);
                    } else {
                        messages.push(`心魔${totalDemon}`);
                    }
                }
            }

            if (pillData.气血上限) {
                const hpBonus = Math.floor(pillData.气血上限 * pillEffectMult);
                player.hp_max += hpBonus;
                player.hp += hpBonus;
                if (i === 0) messages.push(`气血上限+${hpBonus * count}`);
            }

            if (pillData.气血) {
                const hpGain = Math.floor(pillData.气血 * pillEffectMult);
                player.hp = Math.min(player.hp_max, (player.hp || 0) + hpGain);
                if (i === 0) messages.push(`气血+${hpGain * count}`);
            }

            if (pillData.魂力) {
                let soulGain = Math.floor(pillData.魂力 * pillEffectMult);
                if (pillData.race_bonus && pillData.race_bonus[player.race]) {
                    soulGain += pillData.race_bonus[player.race].魂力 || 0;
                }
                player.daoXin = (player.daoXin || 0) + soulGain;
                if (i === 0) messages.push(`道心+${soulGain * count}`);
            }

            if (pillData.灵兽经验 && player.beast) {
                player.beast.exp = (player.beast.exp || 0) + pillData.灵兽经验;
                if (i === 0) messages.push(`灵兽经验+${pillData.灵兽经验 * count}`);
            }

            if (pillData.灵根概率 && Math.random() < pillData.灵根概率) {
                const genOrder = ["凡骨", "杂灵根", "三灵根", "双灵根", "单灵根", "先天道体"];
                const currentIdx = genOrder.indexOf(player.gen);
                if (currentIdx < genOrder.length - 1) {
                    player.gen = genOrder[currentIdx + 1];
                    messages.push(`灵根提升至${player.gen}!`);
                }
            }

            if (pillData.gen_upgrade) {
                const genOrder = ["凡骨", "杂灵根", "三灵根", "双灵根", "单灵根", "先天道体"];
                const currentIdx = genOrder.indexOf(player.gen);
                if (currentIdx < genOrder.length - 1) {
                    player.gen = genOrder[currentIdx + 1];
                    messages.push(`灵根提升至${player.gen}!`);
                }
            }
        }

        addEvent(`服用${pill},${messages.join('、')}`, 'success');

        closeModal();
        updateUI();
    }

    function craftPill(pill) {
        const recipe = ALCHEMY_RECIPES[pill];
        const pillData = PILLS[pill];
        
        if (!recipe) {
            addEvent('没有此丹药配方', 'danger');
            return;
        }
        
        if (!pillData) {
            addEvent('丹药不存在', 'danger');
            return;
        }
        
        const canCraft = Object.entries(recipe.herb).every(([h, n]) => (player.herb[h] || 0) >= n);

        if (!canCraft) {
            addEvent('材料不足', 'danger');
            return;
        }

        for (let [h, n] of Object.entries(recipe.herb)) {
            player.herb[h] -= n;
        }

        let successRate = recipe.success;
        successRate += (player.daoXin || 0) * 0.005;
        successRate += getJingjieIdx(player.jingjie) * 0.05;
        
        if (Math.random() < successRate) {
            const quality = rollPillQuality(recipe.success);
            const qualityNames = { normal: '普通', fine: '良品', excellent: '极品', perfect: '完美' };
            const qualityMultiplier = { normal: 1, fine: 1.2, excellent: 1.5, perfect: 2 };
            
            player.pills[pill] = (player.pills[pill] || 0) + 1;
            player.pillQuality = player.pillQuality || {};
            player.pillQuality[pill] = quality;
            
            const bonus = Math.floor(qualityMultiplier[quality] * 100 - 100);
            addEvent(`炼制成功,获得${qualityNames[quality]}${pill}${bonus > 0 ? `(效果+${bonus}%)` : ''}!`, 'success');
            showToast(`炼制成功！${qualityNames[quality]}${pill}`, 'success', 3000);
            
            if (quality === 'perfect') {
                player.daoXin = (player.daoXin || 0) + 5;
                addEvent('丹道感悟！道心+5', 'purple');
            }
        } else {
            addEvent('炼制失败,材料损毁...', 'danger');
            showToast('炼制失败，材料损毁', 'danger', 2000);
        }

        closeModal();
        updateUI();
    }

    function rollPillQuality(baseSuccess) {
        const r = Math.random();
        if (r < baseSuccess * 0.1) return 'perfect';  // 完美：10%成功率的10%
        if (r < baseSuccess * 0.3) return 'excellent'; // 极品：10%成功率的30%
        if (r < baseSuccess * 0.6) return 'fine';     // 良品：10%成功率的60%
        return 'normal';
    }

    // ==================== 存档系统 ====================
    function saveGame() {
        try {
            const saveData = deepClone(player);
            saveData.allEvents = allEvents.slice(-100);
            
            const jsonStr = JSON.stringify(saveData);
            const compressed = compressSaveData(jsonStr);
            localStorage.setItem(SAVE_KEY, compressed);
            
            createBackup(saveData);
            
            saveData.saveSize = compressed.length;
            saveData.lastSaveTime = new Date().toISOString();
            localStorage.setItem(SAVE_KEY + '_meta', JSON.stringify({
                size: compressed.length,
                time: new Date().toISOString(),
                version: '1.0'
            }));
            
        } catch (e) {
            console.error('存档失败', e);
            showToast('存档失败', 'danger', 2000);
        }
    }

    function compressSaveData(data) {
        try {
            if (typeof LZString !== 'undefined') {
                return LZString.compressToUTF16(data);
            }
        } catch (e) {
            console.warn('LZString not available, using raw JSON');
        }
        return data;
    }

    function decompressSaveData(data) {
        try {
            if (typeof LZString !== 'undefined' && !data.startsWith('{')) {
                return LZString.decompressFromUTF16(data);
            }
        } catch (e) {
            console.warn('LZString decompression failed, trying raw JSON');
        }
        return data;
    }

    function createBackup(data) {
        const backupKey = SAVE_KEY + '_backup_' + new Date().toDateString().replace(/\//g, '-');
        const backups = JSON.parse(localStorage.getItem(SAVE_KEY + '_backups') || '[]');
        
        const backupData = {
            date: new Date().toISOString(),
            key: backupKey,
            size: JSON.stringify(data).length
        };
        
        backups.push(backupData);
        
        if (backups.length > 7) {
            const oldest = backups.shift();
            localStorage.removeItem(oldest.key);
        }
        
        localStorage.setItem(backupKey, JSON.stringify(data));
        localStorage.setItem(SAVE_KEY + '_backups', JSON.stringify(backups));
    }

    function getBackups() {
        try {
            return JSON.parse(localStorage.getItem(SAVE_KEY + '_backups') || '[]');
        } catch (e) {
            return [];
        }
    }

    function loadBackup(backupKey) {
        try {
            const raw = localStorage.getItem(backupKey);
            if (!raw) {
                showToast('备份文件不存在', 'danger', 2000);
                return false;
            }
            
            player = JSON.parse(raw);
            allEvents = player.allEvents || [];
            eventIdx = allEvents.length ? allEvents[allEvents.length - 1].id : 0;
            
            ensurePlayerInitialized(player);
            gameStarted = true;
            updateUI();
            showToast('从备份恢复成功!', 'success', 3000);
            addEvent('从备份恢复存档', 'success');
            return true;
        } catch (e) {
            console.error('恢复备份失败', e);
            showToast('恢复备份失败', 'danger', 2000);
            return false;
        }
    }

    function exportSave() {
        try {
            const raw = localStorage.getItem(SAVE_KEY);
            if (!raw) {
                showToast('没有可导出的存档', 'danger', 2000);
                return;
            }
            
            const meta = JSON.parse(localStorage.getItem(SAVE_KEY + '_meta') || '{}');
            const exportData = {
                version: '1.0',
                date: new Date().toISOString(),
                data: raw,
                meta: meta
            };
            
            const exportStr = JSON.stringify(exportData);
            const blob = new Blob([exportStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'save_' + new Date().toISOString().slice(0, 10) + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('存档导出成功!', 'success', 2000);
        } catch (e) {
            console.error('导出存档失败', e);
            showToast('导出存档失败', 'danger', 2000);
        }
    }

    function importSave(file) {
        try {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importData = JSON.parse(e.target.result);
                    if (!importData.data) {
                        showToast('无效的存档文件', 'danger', 2000);
                        return;
                    }
                    
                    localStorage.setItem(SAVE_KEY, importData.data);
                    if (importData.meta) {
                        localStorage.setItem(SAVE_KEY + '_meta', JSON.stringify(importData.meta));
                    }
                    
                    showToast('存档导入成功!请刷新页面或点击继续游戏', 'success', 3000);
                } catch (e) {
                    showToast('解析存档文件失败', 'danger', 2000);
                }
            };
            reader.readAsText(file);
        } catch (e) {
            console.error('导入存档失败', e);
            showToast('导入存档失败', 'danger', 2000);
        }
    }

        p.bonusCrit = p.bonusCrit || 0;
        p.bonusLifesteal = p.bonusLifesteal || 0;
        p.bonusQiYun = p.bonusQiYun || 0;
        p.base_power = p.base_power || 10;
        p.bonusXiuMult = p.bonusXiuMult || 1;
        p._rebornUsed = p._rebornUsed || false;
        
        if (p.availableLovers.length === 0) {
            for (let i = 0; i < 3; i++) {
                p.availableLovers.push(generateLover());
            }
        }
        
        return p;
    }

    function loadGame() {
        try {
            const raw = localStorage.getItem(SAVE_KEY);
            if (!raw) return false;

            const decompressed = decompressSaveData(raw);
            player = JSON.parse(decompressed);
            allEvents = player.allEvents || [];
            eventIdx = allEvents.length ? allEvents[allEvents.length - 1].id : 0;
            
            ensurePlayerInitialized(player);

            gameStarted = true;
            gameEnded = false;

            if (player.settings?.theme === 'light') {
                document.documentElement.classList.add('light-mode');
            }

            addEvent('继续修行...', 'info');
            initGameUI();
            updateUI();
            
            if (player.skillTree) applySkillTreeEffects();
            generateDailyQuests();
            
            setTimeout(() => {
                const stories = generateOfflineStory();
                if (stories && stories.length > 0) {
                    showOfflineStory(stories);
                }
            }, 500);
            
            return true;
        } catch (e) {
            console.error('读档失败', e);
            return false;
        }
    }

    // ==================== 轮回系统 ====================
    // 多周目传承：飞升或结局后可进入下一世，保留部分传承
    const REINCARNATION_KEY = 'xiuxian_reincarnation';
    
    function getReincarnationData() {
        try {
            const data = localStorage.getItem(REINCARNATION_KEY);
            return data ? JSON.parse(data) : { count: 0, bonuses: [] };
        } catch (e) {
            return { count: 0, bonuses: [] };
        }
    }

    function saveReincarnationData(data) {
        localStorage.setItem(REINCARNATION_KEY, JSON.stringify(data));
    }

    function addReincarnationBonus(type, value, desc) {
        const data = getReincarnationData();
        data.bonuses.push({ type, value, desc });
        saveReincarnationData(data);
    }

    function getReincarnationBonus(type) {
        const data = getReincarnationData();
        let total = 0;
        data.bonuses.forEach(b => {
            if (b.type === type) total += b.value;
        });
        return total;
    }

    function applyReincarnationBonuses() {
        const data = getReincarnationData();
        if (data.count === 0) return;
        
        // 基础加成
        if (getReincarnationBonus('xiu_mult') > 0) {
            player.bonusXiuMult = (player.bonusXiuMult || 1) + getReincarnationBonus('xiu_mult');
        }
        if (getReincarnationBonus('power') > 0) {
            player.base_power = (player.base_power || 0) + getReincarnationBonus('power');
        }
        if (getReincarnationBonus('daoxin') > 0) {
            player.daoXin = (player.daoXin || 0) + getReincarnationBonus('daoxin');
        }
        if (getReincarnationBonus('lingshi') > 0) {
            player.lingshi += getReincarnationBonus('lingshi');
        }
    }

    function startReincarnation() {
        if (!confirm('确定要进入轮回吗？你将开始新的一世，但会保留前世的部分传承...')) return;
        
        const data = getReincarnationData();
        data.count++;
        
        // 根据当前成就生成传承
        const bonuses = [];
        
        // 境界传承
        const jingjieIdx = getJingjieIdx(player.jingjie);
        if (jingjieIdx >= 2) bonuses.push({ type: 'xiu_mult', value: 0.1 * jingjieIdx, desc: `境界传承：修炼速度+${10 * jingjieIdx}%` });
        
        // 道心传承
        if ((player.daoXin || 0) >= 50) bonuses.push({ type: 'daoxin', value: Math.floor(player.daoXin * 0.1), desc: `道心传承：初始道心+${Math.floor(player.daoXin * 0.1)}` });
        
        // 战力传承
        const power = calcPower(player);
        if (power >= 1000) bonuses.push({ type: 'power', value: Math.floor(power * 0.05), desc: `战力传承：初始战力+${Math.floor(power * 0.05)}` });
        
        // 财富传承
        if (player.lingshi >= 1000) bonuses.push({ type: 'lingshi', value: Math.floor(player.lingshi * 0.1), desc: `财富传承：初始灵石+${Math.floor(player.lingshi * 0.1)}` });
        
        // 特殊：飞升者额外加成
        if (player.jingjie === '化神') {
            bonuses.push({ type: 'xiu_mult', value: 0.5, desc: '飞升传承：修炼速度+50%' });
        }
        
        data.bonuses = [...data.bonuses, ...bonuses];
        saveReincarnationData(data);
        
        // 重置游戏
        localStorage.removeItem(SAVE_KEY);
        player = null;
        gameStarted = false;
        gameEnded = false;
        battleState = {
            enemyPower: 0,
            enemyName: '',
            isBoss: false,
            turn: 0,
            skillCooldowns: {},
            shield: 0,
            buffs: [],
            debuffs: []
        };
        
        showCreateScreen();
        addEvent(`第${data.count}世轮回开始！获得${bonuses.length}项传承`, 'highlight');
    }

        'v': { action: 'quick-save', name: '快速存档', desc: '按 V 键快速保存游戏' },
        'b': { action: 'daily-quest', name: '每日任务', desc: '按 B 键查看每日任务' },
        'n': { action: 'sect', name: '宗门', desc: '按 N 键打开宗门' },
        'm': { action: 'skill-tree', name: '技能树', desc: '按 M 键打开技能树' },
        'Escape': { action: 'close-modal', name: '关闭弹窗', desc: '按 ESC 关闭当前弹窗' },
        '?': { action: 'show-shortcuts', name: '快捷键帮助', desc: '按 ? 键显示快捷键列表' }
    };

    let shortcutsVisible = false;

    function showShortcutsHelp() {
        let html = '<h3>⌨️ 键盘快捷键</h3>';
        html += '<div class="section-title">主功能键</div>';
        
        const mainKeys = ['1', '2', '3', '4', '5', '6'];
        mainKeys.forEach(key => {
            const shortcut = KEYBOARD_SHORTCUTS[key];
            html += `<div class="npc-card" style="display:flex;justify-content:space-between;align-items:center;">
                <span>${shortcut.name}</span>
                <span style="font-family:monospace;background:#222;padding:2px 8px;border-radius:4px;color:#ffd700;">${key}</span>
            </div>`;
        });

        html += '<div class="section-title">系统功能键（第一排）</div>';
        
        const sysKeys1 = ['q', 'w', 'e', 'r', 't', 'y'];
        sysKeys1.forEach(key => {
            const shortcut = KEYBOARD_SHORTCUTS[key];
            html += `<div class="npc-card" style="display:flex;justify-content:space-between;align-items:center;">
                <span>${shortcut.name}</span>
                <span style="font-family:monospace;background:#222;padding:2px 8px;border-radius:4px;color:#ffd700;">${key.toUpperCase()}</span>
            </div>`;
        });

        html += '<div class="section-title">系统功能键（第二排）</div>';
        
        const sysKeys2 = ['a', 's', 'd', 'f', 'g', 'h'];
        sysKeys2.forEach(key => {
            const shortcut = KEYBOARD_SHORTCUTS[key];
            html += `<div class="npc-card" style="display:flex;justify-content:space-between;align-items:center;">
                <span>${shortcut.name}</span>
                <span style="font-family:monospace;background:#222;padding:2px 8px;border-radius:4px;color:#ffd700;">${key.toUpperCase()}</span>
            </div>`;
        });

        html += '<div class="section-title">系统功能键（第三排）</div>';
        
        const sysKeys3 = ['z', 'x', 'c', 'v', 'b', 'n', 'm'];
        sysKeys3.forEach(key => {
            const shortcut = KEYBOARD_SHORTCUTS[key];
            html += `<div class="npc-card" style="display:flex;justify-content:space-between;align-items:center;">
                <span>${shortcut.name}</span>
                <span style="font-family:monospace;background:#222;padding:2px 8px;border-radius:4px;color:#ffd700;">${key.toUpperCase()}</span>
            </div>`;
        });

        html += '<div class="section-title">其他</div>';
        html += `<div class="npc-card" style="display:flex;justify-content:space-between;align-items:center;">
            <span>关闭弹窗</span>
            <span style="font-family:monospace;background:#222;padding:2px 8px;border-radius:4px;color:#ffd700;">ESC</span>
        </div>`;
        html += `<div class="npc-card" style="display:flex;justify-content:space-between;align-items:center;">
            <span>显示/隐藏快捷键</span>
            <span style="font-family:monospace;background:#222;padding:2px 8px;border-radius:4px;color:#ffd700;">?</span>
        </div>`;

        html += '<button class="modal-option" data-action="close-modal">关闭</button>';
        showModal(html);
    }

    function handleKeyPress(e) {
        if (gameEnded) return;
        
        const tag = e.target.tagName.toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

        let key = e.key;
        
        if (key === 'Escape') {
            closeModal();
            return;
        }

        if (key === '?') {
            showShortcutsHelp();
            return;
        }

        key = key.toLowerCase();
        
        const shortcut = KEYBOARD_SHORTCUTS[key];
        if (!shortcut) return;

        const action = shortcut.action;
        
        switch (action) {
            case 'xiulian':
                if (player.xiu >= player.xiu_max) {
                    showToast('修为已满，请先突破！', 'warning', 2000);
                    return;
                }
                actionXiulian();
                break;
            case 'break':
                actionBreak();
                break;
            case 'explore':
                actionExploreEnhanced();
                break;
            case 'secret-realm':
                actionSecretRealm();
                break;
            case 'challenge':
                actionChallenge();
                break;
            case 'tribulation':
                actionTribulation();
                break;
            case 'pills':
                actionPills();
                break;
            case 'shop':
                actionShop();
                break;
            case 'alchemy':
                actionAlchemy();
                break;
            case 'equipment':
                actionEquipmentEnhanced();
                break;
            case 'technique':
                actionTechnique();
                break;
            case 'tiandao':
                actionTiandao();
                break;
            case 'lovers':
                actionLovers();
                break;
            case 'friends':
                actionFriends();
                break;
            case 'beast':
                actionBeastEnhanced();
                break;
            case 'cave':
                actionCave();
                break;
            case 'dao-xin':
                actionDaoXin();
                break;
            case 'heart-demon':
                actionHeartDemon();
                break;
            case 'daily-quest':
                actionDailyQuest();
                break;
            case 'sect':
                actionSect();
                break;
            case 'skill-tree':
                actionSkillTree();
                break;
            case 'quick-cultivate':
                if (player.xiu >= player.xiu_max) {
                    showToast('修为已满！', 'warning', 2000);
                    return;
                }
                quickCultivate();
                break;
            case 'quick-heal':
                quickHeal();
                break;
            case 'quick-daily':
                quickDaily();
                break;
            case 'quick-save':
                quickSave();
                showToast('游戏已保存！', 'success', 2000);
                break;
        }
    }

    document.addEventListener('keydown', handleKeyPress);

    // ==================== 初始化 ====================
    if (localStorage.getItem(SAVE_KEY)) {
        if (!loadGame()) {
            showCreateScreen();
        }
    } else {
        showCreateScreen();
    }

})();
</script>
</body>
</html>
