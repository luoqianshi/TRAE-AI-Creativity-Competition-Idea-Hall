        @keyframes damageFlash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; background-color: var(--danger); } }

        .glow-effect { animation: glow 2s infinite; }

        .pulse-effect { animation: pulse 1.5s infinite; }

        .bounce-effect { animation: bounce 0.5s; }

    // ==================== 统一工具函数 ====================
    /**

     * 提供灵石、气血、物品等资源检查和消耗的统一接口
     * 目的：减少重复代码，统一错误处理
     */
    const BONUS_NAMES = {
        power_mult: '攻击',
        hp_mult: '气血',
        xiu_mult: '修炼速度',
        def_mult: '防御',
        atk_mult: '攻击',

        lover_friend_aff: '道侣仙友好感'
    };

    function formatBonus(bonus) {
        return Object.entries(bonus).map(([k, v]) => {
            const name = BONUS_NAMES[k] || k;
            if (k.includes('mult') || k.includes('chance') || k.includes('regen') || 
                k.includes('reduce') || k.includes('cut') || k.includes('penalty') ||
                k.includes('boost') || k.includes('rate') || k.includes('dmg')) {
                if (typeof v === 'number') {
                    const pct = v > 1 ? (v - 1) * 100 : v * 100;
                    return `${name}+${Math.floor(pct)}%`;
                }
            }
            return `${name}+${v}`;
        }).join(', ');
    }

    const REWARD_NAMES = {
        lingshi: '灵石',
        xiu: '修为',
        hp: '气血',
        power: '战力',

        '魂力': '魂力',

        fuyuan: '福缘',
        crit: '暴击率',
        craft_rate: '炼器成功率',
        prestige: '声望',
        sectReputation: '宗门声望'
    };

    function formatRewardName(key) {
        return REWARD_NAMES[key] || key;
    }

    const GameUtils = {
        // 统一灵石检查
        checkLingshi(amount) {
            return player.lingshi >= amount;
        },
        // 统一灵石消耗
        spendLingshi(amount) {
            if (this.checkLingshi(amount)) {
                player.lingshi -= amount;
                return true;
            }
            return false;
        },
        // 统一灵石不足提示
        needLingshi(amount, msg = '灵石不足') {
            addEvent(msg, 'danger');
            return false;
        },
        // 统一灵石消耗（带提示）
        spendLingshiWithMsg(amount, successMsg = null) {
            if (this.spendLingshi(amount)) {
                if (successMsg) addEvent(successMsg, 'success');
                return true;
            }
            this.needLingshi(amount);
            return false;
        },
        // 统一气血检查
        checkHp(amount) {
            return player.hp >= amount;
        },
        // 统一气血消耗
        spendHp(amount) {
            player.hp = Math.max(0, player.hp - amount);
            return true;
        },
        // 统一宗门贡献检查
        checkContrib(amount) {
            return (player.sect_contrib || 0) >= amount;
        },
        // 统一宗门贡献消耗
        spendContrib(amount) {
            if (this.checkContrib(amount)) {
                player.sect_contrib -= amount;
                return true;
            }
            return false;
        },
        // 统一宗门贡献不足提示
        needContrib(amount, msg = '宗门贡献不足') {
            addEvent(msg, 'danger');
            return false;
        },
        // 统一物品检查
        checkItem(itemName, amount = 1) {
            const count = player.items?.[itemName] || 0;
            return count >= amount;
        },
        // 统一物品消耗
        spendItem(itemName, amount = 1) {
            if (this.checkItem(itemName, amount)) {
                player.items[itemName] -= amount;
                if (player.items[itemName] <= 0) delete player.items[itemName];
                return true;
            }
            return false;
        },
        // 统一物品不足提示
        needItem(itemName, amount = 1, msg = null) {
            const actualMsg = msg || `需要${amount}个${itemName}`;
            addEvent(actualMsg, 'danger');
            return false;
        },
        // 统一灵草检查
        checkHerb(grade, amount = 1) {
            const name = `${['一', '二', '三', '四', '五'][grade - 1]}阶灵草`;
            return this.checkItem(name, amount);
        },
        // 统一灵草消耗
        spendHerb(grade, amount = 1) {
            const name = `${['一', '二', '三', '四', '五'][grade - 1]}阶灵草`;
            return this.spendItem(name, amount);
        },
        // 统一灵草不足提示
        needHerb(grade, amount = 1) {
            const name = `${['一', '二', '三', '四', '五'][grade - 1]}阶灵草`;
            return this.needItem(name, amount);
        },
        // 统一成功/失败提示
        showSuccess(msg) {
            showToast(msg, 'success', 2000);
            addEvent(msg, 'success');
        },
        showFail(msg) {
            showToast(msg, 'danger', 2000);
            addEvent(msg, 'danger');
        },
        showInfo(msg) {
            showToast(msg, 'info', 2000);
            addEvent(msg, 'info');
        },
        showHighlight(msg) {
            showToast(msg, 'highlight', 2000);
            addEvent(msg, 'highlight');
        },
        // 统一模态框构建
        buildModal(title, content, footer = '') {
            return `<h3>${title}</h3>${content}${footer}`;
        },
        // 统一卡片构建
        buildCard(title, content, extra = '') {
            return `<div class="npc-card">${title ? `<b>${title}</b>` : ''}${content}${extra}</div>`;
        },
        // 统一按钮构建
        buildButton(text, action, className = '') {
            return `<button class="btn-small ${className}" data-action="${action}">${text}</button>`;
        },
        // 统一禁用按钮
        buildDisabledButton(text) {
            return `<button class="btn-small" disabled>${text}</button>`;

            return canBuy
                ? this.buildButton(text, action, 'success-btn')
                : this.buildDisabledButton(text);
        }

    function triggerRandomGameEvent() {
        if (!player) return;
        
        const lucky = player.luck || 0;
        const adjustedEvents = GAME_EVENTS.map(e => ({
            ...e,
            probability: e.type === 'good' ? e.probability * (1 + lucky * 0.005) :
                         e.type === 'bad' ? e.probability * (1 - lucky * 0.003) :
                         e.probability
        }));

        const roll = Math.random();
        let cumulative = 0;
        for (const event of adjustedEvents) {
            cumulative += event.probability;
            if (roll < cumulative) {
                applyGameEvent(event);
                return;
            }
        }
    }

    function applyGameEvent(event) {
        const effect = event.effect;
        let effectText = [];

        if (effect.hp) {
            player.hp = Math.max(0, player.hp + effect.hp);
            effectText.push(effect.hp > 0 ? `气血+${effect.hp}` : `气血${effect.hp}`);
        }
        if (effect.lingshi) {
            player.lingshi = Math.max(0, player.lingshi + effect.lingshi);
            effectText.push(effect.lingshi > 0 ? `灵石+${effect.lingshi}` : `灵石${effect.lingshi}`);
        }
        if (effect.xiu) {
            player.xiu = Math.min(player.xiu_max, player.xiu + effect.xiu);
            effectText.push(effect.xiu > 0 ? `修为+${effect.xiu}` : `修为${effect.xiu}`);
        }
        if (effect.power) {
            player.base_power = (player.base_power || 10) + effect.power;
            effectText.push(effect.power > 0 ? `战力+${effect.power}` : `战力${effect.power}`);
        }
        if (effect.luck) {
            player.luck = (player.luck || 0) + effect.luck;
            effectText.push(effect.luck > 0 ? `运气+${effect.luck}` : `运气${effect.luck}`);
        }
        if (effect.daoxin) {
            player.daoXin = (player.daoXin || 0) + effect.daoxin;
            effectText.push(effect.daoxin > 0 ? `道心+${effect.daoxin}` : `道心${effect.daoxin}`);
        }
        if (effect.defense) {
            player.bonusDefense = (player.bonusDefense || 0) + effect.defense;
            effectText.push(`防御+${effect.defense}`);
        }
        if (effect.hp_max) {
            player.hp_max += effect.hp_max;
            player.hp += effect.hp_max;
            effectText.push(`气血上限+${effect.hp_max}`);
        }
        if (effect.all) {
            player.bonusPowerMult = (player.bonusPowerMult || 1) + effect.all;
            player.bonusHpMult = (player.bonusHpMult || 1) + effect.all;
            player.bonusXiuMult = (player.bonusXiuMult || 1) + effect.all;
            effectText.push(`全属性+${Math.floor(effect.all * 100)}%`);
        }
        if (effect.xiu_gain) {
            player.bonusXiuMult = (player.bonusXiuMult || 1) + effect.xiu_gain;
            effectText.push(`修炼效率+${Math.floor(effect.xiu_gain * 100)}%`);
        }
        if (effect.herb && effect.amount) {
            player.herb[effect.herb] = (player.herb[effect.herb] || 0) + effect.amount;
            effectText.push(`${effect.herb}+${effect.amount}`);
        }

        const typeColor = event.type === 'good' ? 'success' : event.type === 'bad' ? 'danger' : 'info';
        addEvent(`【${event.name}】${event.desc}`, typeColor);
        if (effectText.length > 0) {
            addEvent(`效果: ${effectText.join(', ')}`, typeColor);
        }
    }

    function deepClone(obj) {
        if (obj === null || typeof obj !== 'object') return obj;
        if (Array.isArray(obj)) return obj.map(deepClone);
        const c = {};
        for (let k in obj) if (obj.hasOwnProperty(k)) c[k] = deepClone(obj[k]);

    function getTalentPoints() {
        return Math.floor(player.day / 50) + (player.jingjie === '筑基' ? 2 : 0) + (player.jingjie === '金丹' ? 3 : 0) + (player.jingjie === '元婴' ? 5 : 0) + (player.jingjie === '化神' ? 8 : 0);
    }

    function getSpentTalentPoints() {
        const talents = player.talents || [];
        let spent = 0;
        talents.forEach(talentId => {
            for (const [, tree] of Object.entries(TALENT_TREE)) {
                const talent = tree.talents.find(t => t.id === talentId);
                if (talent) spent += talent.cost;
            }
        });
        return spent;
    }

    function canUnlockTalent(talentId) {
        for (const [, tree] of Object.entries(TALENT_TREE)) {
            const talent = tree.talents.find(t => t.id === talentId);
            if (talent) {
                const talents = player.talents || [];
                const hasAllReq = talent.req.every(req => talents.includes(req));
                const points = getTalentPoints() - getSpentTalentPoints();
                return hasAllReq && points >= talent.cost;
            }
        }
        return false;
    }

    function unlockTalent(talentId) {
        if (!canUnlockTalent(talentId)) {
            showToast('无法解锁此天赋', 'warning', 2000);
            return;
        }
        
        if (!player.talents) player.talents = [];
        player.talents.push(talentId);
        
        // 检查天赋组合
        checkTalentCombos();
        
        showToast('天赋解锁成功!', 'success', 2000);
        addEvent(`解锁天赋: ${getTalentName(talentId)}`, 'success');
        actionTalent();
        updateUI();
    }

    function getTalentName(talentId) {
        for (const [, tree] of Object.entries(TALENT_TREE)) {
            const talent = tree.talents.find(t => t.id === talentId);
            if (talent) return talent.name;
        }
        return talentId;
    }

    function checkTalentCombos() {
        const talents = player.talents || [];
        let newCombos = [];
        
        TALENT_COMBOS.forEach(combo => {
            const hasAll = combo.combo.every(t => talents.includes(t));
            if (hasAll) {
                if (!player.talentCombos) player.talentCombos = [];
                if (!player.talentCombos.includes(combo.id)) {
                    player.talentCombos.push(combo.id);
                    newCombos.push(combo);
                }
            }
        });
        
        if (newCombos.length > 0) {
            newCombos.forEach(combo => {
                showToast(`天赋组合激活: ${combo.name}!`, 'highlight', 4000);
                addEvent(`天赋组合【${combo.name}】激活!`, 'highlight');
            });
        }
    }

    function getTalentBonus(attr) {
        let bonus = 1;
        const talents = player.talents || [];
        
        for (const [, tree] of Object.entries(TALENT_TREE)) {
            tree.talents.forEach(talent => {
                if (talents.includes(talent.id) && talent.effect[attr]) {
                    if (attr.includes('chance')) {
                        bonus += talent.effect[attr];
                    } else {
                        bonus *= talent.effect[attr];
                    }
                }
            });
        }
        
        // 天赋组合加成
        const combos = player.talentCombos || [];
        combos.forEach(comboId => {
            const combo = TALENT_COMBOS.find(c => c.id === comboId);
            if (combo && combo.bonus[attr]) {
                if (attr.includes('chance')) {
                    bonus += combo.bonus[attr];
                } else {
                    bonus *= combo.bonus[attr];
                }
            }
        });
        
        return bonus;
    }

    function getNextBodyTemperingLevel() {

    function temperBody(methodId) {
        const method = BODY_TEMPERING_METHODS.find(m => m.id === methodId);
        if (!method) {
            showToast('炼体功法不存在', 'danger', 2000);
            return;
        }

        const currentLevel = getBodyTemperingLevel();
        if (method.reqLevel && currentLevel.level < method.reqLevel) {
            showToast(`需要炼体境界达到${BODY_TEMPERING_LEVELS[method.reqLevel].name}`, 'warning', 2000);
            return;
        }

        if (player.lingshi < (method.lingshiCost || 0)) {
            showToast('灵石不足', 'danger', 2000);
            return;
        }

        const hpCost = Math.floor(player.hp_max * (method.hpCost || 0));
        if (player.hp <= hpCost) {
            showToast('气血不足', 'danger', 2000);
            return;
        }

        player.lingshi -= method.lingshiCost || 0;
        player.hp -= hpCost;
        player.bodyTemperingExp = (player.bodyTemperingExp || 0) + method.expGain;

        const newLevel = getBodyTemperingLevel();
        if (newLevel.level > currentLevel.level) {
            showToast(`炼体突破!晋升【${newLevel.name}】`, 'highlight', 4000);
            addEvent(`炼体突破: ${newLevel.name}!`, 'highlight');
            
            player.hp_max = Math.floor(player.hp_max * newLevel.bonus.hp_mult);
            player.hp = Math.min(player.hp + Math.floor(player.hp_max * 0.3), player.hp_max);
        }

        addEvent(`炼体修炼: ${method.name}`, 'info');
        actionBodyTempering();
        updateUI();
    }

    // ==================== 核心计算 ====================
    function getRaceData(raceName) {
        return RACE_LIST.find(r => r.name === raceName) || RACE_LIST[0];
    }

    function calcPower(p) {
        let pw = JINGJIE_DATA[p.jingjie].power;
        pw += p.lingshi * 0.01;

        // 技能树加成
        if (p.bonusPowerMult) pw *= p.bonusPowerMult;
        // 渡劫加成
        if (p.tribulationBonus) pw *= p.tribulationBonus;
        // 基础战力
        if (p.base_power) pw += p.base_power;

        // 剑意加成 (提前获取,供后续使用)
        const swordLevel = getSwordIntentLevel();

        if (p.equipment?.weapon) {
            let weaponPower = p.equipment.weapon.power || 0;
            if (p.equipment.weapon.enhance) weaponPower += ENHANCE_BONUS[p.equipment.weapon.enhance] || 0;
            // 功法加成
            if (getTechniqueBonus('weapon_power')) weaponPower *= getTechniqueBonus('weapon_power');
            // 剑意加成
            if (swordLevel.effect.weapon_power_mult) weaponPower *= swordLevel.effect.weapon_power_mult;
            pw += weaponPower;
        }
        if (p.beast) pw += p.beast.power || 0;
        for (let l of (p.lovers || [])) pw += (l.power || 0);
        // 特殊体质加成
        const bodyEffect = getSpecialBodyEffect();
        if (bodyEffect.effect.power_mult) pw *= bodyEffect.effect.power_mult;
        // 剑意基础加成
        pw += swordLevel.effect.power || 0;
        // 功法加成
        pw += getTechniqueBonus('power');
        return Math.floor(pw);
    }

    // 暴击率计算
    function getCritChance() {
        let chance = 0.05; // 基础5%暴击率
        
        // 剑意加成
        const swordLevel = getSwordIntentLevel();
        if (swordLevel.effect.crit_chance) chance += swordLevel.effect.crit_chance;
        
        // 功法加成
        const techCrit = getTechniqueBonus('crit_chance');
        if (techCrit) chance += techCrit;
        
        // 特殊体质加成
        const bodyEffect = getSpecialBodyEffect();
        if (bodyEffect.effect.crit_chance) chance += bodyEffect.effect.crit_chance;
        
        // 装备加成
        if (player.equipment?.weapon?.crit_chance) chance += player.equipment.weapon.crit_chance;
        
        // 道心加成（破妄以上增加暴击）
        const daoLevel = getDaoXinLevel();
        chance += daoLevel.eyeLevel * 0.01;
        
        return Math.min(0.8, chance); // 最高80%暴击率
    }

    // 格挡率计算
    function getBlockChance() {
        let chance = 0.05; // 基础5%格挡率
        
        // 体修加成
        if (player.dao === '体修') chance += 0.1;
        
        // 功法加成
        const techBlock = getTechniqueBonus('block_chance');
        if (techBlock) chance += techBlock;
        
        // 特殊体质加成
        const bodyEffect = getSpecialBodyEffect();
        if (bodyEffect.effect.block_chance) chance += bodyEffect.effect.block_chance;
        
        // 装备加成
        if (player.equipment?.armor?.block_chance) chance += player.equipment.armor.block_chance;
        
        // 道心加成（守心以上增加格挡）
        const daoLevel = getDaoXinLevel();
        if (daoLevel.level >= 3) chance += 0.05;
        
        return Math.min(0.6, chance); // 最高60%格挡率
    }

    function calcPracticeGain(p) {
        let base = GEN_BASE[p.gen] || 1;
        const raceData = getRaceData(p.race);
        base *= raceData.xiu_mult || 1;
        base *= (1 + getJingjieIdx(p.jingjie) * 0.1);
        for (let l of (p.lovers || [])) base *= (1 + (l.affection || 50) * 0.001);
        // 功法加成
        const techXiuGain = getTechniqueBonus('xiu_gain');
        if (techXiuGain) base *= techXiuGain;
        // 特殊体质加成
        const bodyEffect = getSpecialBodyEffect();
        if (bodyEffect.effect.xiu_mult) base *= bodyEffect.effect.xiu_mult;
        // 洞府加成
        const caveLevel = CAVE_LEVELS[(p.cave?.level || 1) - 1];
        if (caveLevel && caveLevel.level > 2) base *= (1 + caveLevel.level * 0.05);
        return Math.floor(base);
    }

    function unlockAchievement(id) {
        if (!player.achievements) player.achievements = [];
        if (player.achievements.includes(id)) return;
        
        const achievement = ACHIEVEMENTS[id];
        if (!achievement) return;
        
        player.achievements.push(id);
        
        // 应用奖励
        if (achievement.reward.lingshi) player.lingshi += achievement.reward.lingshi;
        if (achievement.reward.power) {
            player.base_power = (player.base_power || 10) + achievement.reward.power;
        }
        if (achievement.reward.daoxin) {
            player.daoXin = (player.daoXin || 0) + achievement.reward.daoxin;
        }
        if (achievement.reward.xiu_mult) {
            player.bonusXiuMult = (player.bonusXiuMult || 1) + achievement.reward.xiu_mult;
        }
        if (achievement.reward.luck) {
            player.luck = (player.luck || 0) + achievement.reward.luck;
        }
        if (achievement.reward.fuyuan) {
            player.fuyuan = (player.fuyuan || 0) + achievement.reward.fuyuan;
        }
        
        // 显示成就解锁动画
        let popup = document.createElement('div');
        popup.className = 'achievement-popup';
        popup.innerHTML = `
            <h2>🏆 成就解锁</h2>
            <div style="font-size:3rem;">${achievement.icon}</div>
            <h3 style="color:var(--gold);">${achievement.name}</h3>
            <p>${achievement.desc}</p>
            <p style="color:var(--success);">奖励: ${formatReward(achievement.reward)}</p>
        `;
        document.body.appendChild(popup);
        
        setTimeout(() => {
            popup.style.opacity = '0';
            popup.style.transition = 'opacity 0.5s';
            setTimeout(() => popup.remove(), 500);
        }, 3000);
        
        addEvent(`解锁成就: ${achievement.name}!`, 'highlight');
        showToast(`🏆 解锁成就: ${achievement.name}`, 'highlight', 4000);
        autoSave();
    }

    function formatReward(reward) {
        const parts = [];
        if (reward.lingshi) parts.push(`${reward.lingshi}灵石`);
        if (reward.power) parts.push(`${reward.power}战力`);
        if (reward.daoxin) parts.push(`${reward.daoxin}道心`);
        if (reward.xiu_mult) parts.push(`${Math.floor(reward.xiu_mult * 100)}%修炼速度`);
        if (reward.luck) parts.push(`${reward.luck}气运`);
        if (reward.fuyuan) parts.push(`${reward.fuyuan}福缘`);
        return parts.join(', ') || '无';
    }

        ];

        const players = [];

    function getPlayerRankData() {
        return {
            name: player.dao || '你',
            power: calcPower(player),
            xiu: Math.floor(player.xiu),
            day: player.day,
            jingjie: player.jingjie,
            lovers: (player.lovers || []).length,
            beasts: (player.beasts || []).length,
            achievements: Object.keys(player.achievements || {}).length,
            lingbao: (player.lingbao || []).length,
            sect: player.sect || '无',
            isPlayer: true
        };
    }

    function getRank(rewards, rankType) {
        const playerData = getPlayerRankData();
        const fakePlayers = generateFakePlayers(49);
        const allPlayers = [playerData, ...fakePlayers];
        
        allPlayers.sort((a, b) => {
            if (rankType === 'xiu') return b.xiu - a.xiu;
            if (rankType === 'days') return b.day - a.day;
            if (rankType === 'lovers') return b.lovers - a.lovers;
            if (rankType === 'beasts') return b.beasts - a.beasts;
            if (rankType === 'achievements') return b.achievements - a.achievements;
            if (rankType === 'lingbao') return b.lingbao - a.lingbao;
            if (rankType === 'sect') return b.power - a.power;
            return b.power - a.power;
        });
        
        const playerRank = allPlayers.findIndex(p => p.isPlayer) + 1;
        return { rank: playerRank, players: allPlayers.slice(0, 10) };
    }

    function claimRankReward(rankType) {
        const { rank } = getRank(null, rankType);
        const reward = RANK_REWARDS[rank];
        
        if (!reward) {
            showToast('未进入前10名，无法领取奖励', 'warning', 2000);
            return;
        }

        const today = new Date().toDateString();
        if (player.lastRankClaim === today) {
            showToast('今日已领取过排名奖励', 'warning', 2000);
            return;
        }

        player.lingshi += reward.lingshi;
        player.xiu = Math.min(player.xiu_max, player.xiu + reward.xiu);
        
        if (reward.title) {
            player.title = reward.title;
            showToast(`获得称号: ${reward.title}!`, 'highlight', 4000);
        }

        player.lastRankClaim = today;
        showToast(`排名奖励领取成功!灵石+${reward.lingshi},修为+${reward.xiu}`, 'success', 3000);
        addEvent(`领取排名奖励`, 'success');
        actionLeaderboard();
        updateUI();
    }

    function getCurrentEvents() {
        const events = [];
        
        // 检查节日活动
        const today = new Date();
        const dateStr = `${today.getMonth() + 1}-${today.getDate()}`;
        for (const [id, event] of Object.entries(HOLIDAY_EVENTS)) {
            if (event.date === dateStr) {
                events.push({ ...event, id, type: 'holiday' });
            }
        }

        // 检查限时活动（随机触发）
        if (!player.activeEvents) player.activeEvents = {};
        for (const event of ACTIVE_EVENTS) {
            const eventKey = `event_${event.id}`;
            const lastActive = player.activeEvents[eventKey];
            const daysSince = lastActive ? player.day - lastActive : 999;
            
            if (daysSince >= 30 && Math.random() < 0.1) {
                player.activeEvents[eventKey] = player.day;
                events.push({ ...event, type: 'limited' });
            }
        }

        return events;
    }

    function getEventBonus(attr) {
        let bonus = 1;
        const events = getCurrentEvents();
        
        events.forEach(event => {
            if (event.bonus && event.bonus[attr]) {
                if (attr.includes('chance')) {
                    bonus += event.bonus[attr];
                } else {
                    bonus *= event.bonus[attr];
                }
            }
        });
        
        return bonus;
    }

    function claimEventReward(eventId) {
        const events = getCurrentEvents();
        const event = events.find(e => e.id === eventId);
        
        if (!event || !event.reward) {
            showToast('该活动没有奖励可领取', 'warning', 2000);
            return;
        }

        const today = new Date().toDateString();
        if (player.lastEventClaim === today) {
            showToast('今日已领取过活动奖励', 'warning', 2000);
            return;
        }

        for (const [attr, value] of Object.entries(event.reward)) {
            if (attr === 'xiu') {
                player.xiu = Math.min(player.xiu_max, player.xiu + value);
            } else if (attr === 'power') {
                player.power += value;
            } else {
                player[attr] = (player[attr] || 0) + value;
            }
        }

        player.lastEventClaim = today;
        showToast(`活动奖励领取成功!`, 'success', 3000);
        addEvent(`领取活动【${event.name}】奖励`, 'success');
        actionEvents();
        updateUI();
    }

        const today = new Date();
        for (const [, event] of Object.entries(HOLIDAY_EVENTS)) {
            const [month, day] = event.date.split('-').map(Number);
            let nextDate = new Date(today.getFullYear(), month - 1, day);

                nextDate = new Date(today.getFullYear() + 1, month - 1, day);

            const daysLeft = Math.floor((nextDate - today) / (1000 * 60 * 60 * 24));
            upcomingHolidays.push({ ...event, daysLeft });

        upcomingHolidays.sort((a, b) => a.daysLeft - b.daysLeft);

    const TRADE_ITEM_TYPES = [
        { id: 'lingshi', name: '灵石', icon: '💎', type: 'currency' },
        { id: 'xiu', name: '修为', icon: '💠', type: 'currency' },

    const AUCTION_DURATION = 24 * 60 * 60 * 1000;

    function initTradeSystem() {
        if (!player.auctions) {
            player.auctions = [];
        }
        if (!player.tradeRequests) {
            player.tradeRequests = [];
        }
        if (!player.tradeHistory) {
            player.tradeHistory = [];
        }
    }

    function createAuction(itemType, itemName, amount, startingPrice, duration = AUCTION_DURATION) {
        initTradeSystem();
        
        if (player.lingshi < startingPrice) {
            showToast('起拍价不能超过你的灵石', 'warning', 2000);
            return;
        }
        
        const auction = {
            id: Date.now() + Math.random(),
            seller: player.dao || '你',
            itemType: itemType,
            itemName: itemName,
            amount: amount,
            startingPrice: startingPrice,
            currentPrice: startingPrice,
            highestBidder: null,
            endTime: Date.now() + duration,
            status: 'active',
            bids: []
        };
        
        player.auctions.push(auction);
        
        showToast('拍卖上架成功', 'success', 2000);
        addEvent(`上架拍卖: ${itemName} x${amount}`, 'success');
        actionTrade();
        saveGame();
    }

    function bidAuction(auctionId, bidPrice) {
        initTradeSystem();
        
        const auction = player.auctions.find(a => a.id === auctionId);
        if (!auction) {
            showToast('拍卖不存在', 'danger', 2000);
            return;
        }
        
        if (auction.status !== 'active') {
            showToast('拍卖已结束', 'warning', 2000);
            return;
        }
        
        if (bidPrice <= auction.currentPrice) {
            showToast('出价必须高于当前价格', 'warning', 2000);
            return;
        }
        
        if (player.lingshi < bidPrice) {
            showToast('灵石不足', 'danger', 2000);
            return;
        }
        
        auction.currentPrice = bidPrice;
        auction.highestBidder = player.dao || '你';
        auction.bids.push({ bidder: auction.highestBidder, price: bidPrice, time: new Date().toLocaleString() });
        
        showToast('出价成功', 'success', 2000);
        addEvent(`出价拍卖: ${auction.itemName}`, 'success');
        actionTrade();
        saveGame();
    }

    function endAuction(auctionId) {
        initTradeSystem();
        
        const auctionIndex = player.auctions.findIndex(a => a.id === auctionId);
        if (auctionIndex === -1) {
            showToast('拍卖不存在', 'danger', 2000);
            return;
        }
        
        const auction = player.auctions[auctionIndex];
        auction.status = 'ended';
        
        if (auction.highestBidder) {
            player.lingshi += auction.currentPrice;
            showToast(`拍卖结束!获得 ${auction.currentPrice} 灵石`, 'success', 3000);
            addEvent(`拍卖成交: ${auction.itemName} 获得 ${auction.currentPrice} 灵石`, 'success');
        } else {
            showToast('拍卖流拍', 'info', 2000);
            addEvent(`拍卖流拍: ${auction.itemName}`, 'info');
        }
        
        player.tradeHistory.unshift({
            type: 'auction',
            item: auction.itemName,
            amount: auction.amount,
            price: auction.currentPrice,
            buyer: auction.highestBidder || '流拍',
            time: new Date().toLocaleString()
        });
        
        actionTrade();
        updateUI();
        saveGame();
    }

    function requestTrade(targetName, offerItems, requestItems) {
        initTradeSystem();
        
        const tradeRequest = {
            id: Date.now() + Math.random(),
            sender: player.dao || '你',
            target: targetName,
            offer: offerItems,
            request: requestItems,
            status: 'pending',
            time: new Date().toLocaleString()
        };
        
        player.tradeRequests.push(tradeRequest);
        
        showToast('交易请求已发送', 'success', 2000);
        addEvent(`发送交易请求给 ${targetName}`, 'success');
        actionTrade();
        saveGame();
    }

    function acceptTrade(requestId) {
        initTradeSystem();
        
        const requestIndex = player.tradeRequests.findIndex(t => t.id === requestId);
        if (requestIndex === -1) {
            showToast('交易请求不存在', 'danger', 2000);
            return;
        }
        
        const request = player.tradeRequests[requestIndex];
        
        for (const item of request.request) {
            if (item.type === 'lingshi' && player.lingshi < item.amount) {
                showToast('你没有足够的灵石', 'danger', 2000);
                return;
            }
        }
        
        for (const item of request.request) {
            if (item.type === 'lingshi') {
                player.lingshi -= item.amount;
            }
        }
        
        for (const item of request.offer) {
            if (item.type === 'lingshi') {

    function initMentorSystem() {
        if (!player.master) {
            player.master = null;
        }
        if (!player.apprentices) {
            player.apprentices = [];
        }
        if (!player.mentorPrestige) {
            player.mentorPrestige = 0;
        }
        if (!player.mentorTasks) {
            player.mentorTasks = {};
        }
        if (!player.apprenticeTasks) {
            player.apprenticeTasks = {};
        }
    }

    function getMasterBonus() {
        initMentorSystem();
        let bonus = 1;
        
        const apprenticeCount = player.apprentices.length;
        for (const [count, mult] of Object.entries(MASTER_BONUS.apprentice_count)) {
            if (apprenticeCount >= parseInt(count)) {
                bonus += mult;
            }
        }
        
        const totalPower = player.apprentices.reduce((sum, a) => sum + (a.power || 0), 0);
        for (const [power, mult] of Object.entries(MASTER_BONUS.total_power)) {
            if (totalPower >= parseInt(power)) {
                bonus += mult;
            }
        }
        
        return bonus;
    }

    function getApprenticeBonus() {
        if (!player.master) return 1;
        return 1 + APPRENTICE_BONUS.cultivate_speed;
    }

    function requestToBeApprentice(masterName) {
        initMentorSystem();
        
        if (player.master) {
            showToast('你已经有师父了', 'warning', 2000);
            return;
        }
        
        if (player.apprentices.length > 0) {
            showToast('你已经收徒了，无法拜师', 'warning', 2000);
            return;
        }
        
        const request = {
            id: Date.now() + Math.random(),
            apprentice: player.dao || '你',
            master: masterName,
            apprenticePower: calcPower(player),
            status: 'pending',
            time: new Date().toLocaleString()
        };
        
        player.apprenticeRequests = player.apprenticeRequests || [];
        player.apprenticeRequests.push(request);
        
        showToast('拜师请求已发送', 'success', 2000);
        addEvent(`向 ${masterName} 发送拜师请求`, 'success');
        actionMentor();
        saveGame();
    }

    function acceptApprentice(requestId) {
        initMentorSystem();
        
        const requestIndex = player.apprenticeRequests.findIndex(r => r.id === requestId);
        if (requestIndex === -1) {
            showToast('请求不存在', 'danger', 2000);
            return;
        }
        
        const request = player.apprenticeRequests[requestIndex];
        
        if (player.apprentices.length >= 5) {
            showToast('最多只能收5个徒弟', 'warning', 2000);
            return;
        }
        
        player.apprentices.push({
            name: request.apprentice,
            power: request.apprenticePower,
            xiu: player.xiu,
            dayJoined: player.day,
            online: true
        });
        
        player.apprenticeRequests.splice(requestIndex, 1);
        
        showToast(`成功收徒: ${request.apprentice}`, 'success', 3000);
        addEvent(`收徒: ${request.apprentice}`, 'success');
        actionMentor();
        updateUI();
        saveGame();
    }

    function completeMentorTask(taskId) {
        initMentorSystem();
        
        const task = MASTER_TASKS.find(t => t.id === taskId);
        if (!task) {
            showToast('任务不存在', 'danger', 2000);
            return;
        }
        
        const today = new Date().toDateString();
        if (player.mentorTasks[taskId] === today) {
            showToast('今日已完成该任务', 'warning', 2000);
            return;
        }
        
        for (const [attr, value] of Object.entries(task.reward)) {
            player[attr] = (player[attr] || 0) + value;
        }
        
        player.mentorTasks[taskId] = today;
        
        showToast(`完成任务: ${task.name}!`, 'success', 2000);
        addEvent(`完成师徒任务: ${task.name}`, 'success');
        actionMentor();
        updateUI();
        saveGame();
    }

    function completeApprenticeTask(taskId) {
        initMentorSystem();
        
        if (!player.master) {
            showToast('你没有师父', 'warning', 2000);
            return;
        }
        
        const task = APPRENTICE_TASKS.find(t => t.id === taskId);
        if (!task) {
            showToast('任务不存在', 'danger', 2000);
            return;
        }
        
        const today = new Date().toDateString();
        if (player.apprenticeTasks[taskId] === today) {
            showToast('今日已完成该任务', 'warning', 2000);
            return;
        }
        
        for (const [attr, value] of Object.entries(task.reward)) {
            if (attr === 'xiu') {
                player.xiu = Math.min(player.xiu_max, player.xiu + value);
            } else {
                player[attr] = (player[attr] || 0) + value;
            }
        }
        
        player.apprenticeTasks[taskId] = today;
        
        showToast(`完成任务: ${task.name}!`, 'success', 2000);
        addEvent(`完成弟子任务: ${task.name}`, 'success');
        actionMentor();
        updateUI();
        saveGame();
    }

        initCrossServerSystem();

        const allPlayers = [];
        
        servers.forEach(server => {
            for (let i = 0; i < 10; i++) {
                const power = Math.floor(calcPower(player) * (0.2 + Math.random() * 2));
                allPlayers.push({
                    name: ['剑神', '魔尊', '仙子', '真君', '道长', '剑客', '圣母', '尊者'][Math.floor(Math.random() * 8)] + Math.floor(Math.random() * 100),
                    server: server,
                    power: power,
                    jingjie: ['练气', '筑基', '金丹', '元婴', '化神', '渡劫', '大乘'][Math.floor(Math.random() * 7)]
                });
            }
        });
        
        allPlayers.push({
            name: player.dao || '你',
            server: getCurrentServer(),
            power: calcPower(player),
            jingjie: player.jingjie,
            isPlayer: true
        });
        
        allPlayers.sort((a, b) => b.power - a.power);
        
        return {
            players: allPlayers.slice(0, 20),
            playerRank: allPlayers.findIndex(p => p.isPlayer) + 1,
            totalPlayers: allPlayers.length
        };

    function initMountSystem() {
        if (!player.mounts) {
            player.mounts = [];
        }
        if (!player.activeMount) {
            player.activeMount = null;
        }
    }

    function getMountBonus() {
        initMountSystem();
        if (!player.activeMount) return {};
        
        const mount = player.mounts.find(m => m.id === player.activeMount);
        if (!mount) return {};
        
        const base = MOUNT_DATA[mount.type];
        const levelBonus = 1 + (mount.level - 1) * 0.05;
        
        const bonus = {};
        for (const [attr, value] of Object.entries(base.bonus)) {
            if (attr.includes('mult')) {
                bonus[attr] = Math.floor((value - 1) * levelBonus * 100) / 100 + 1;
            } else {
                bonus[attr] = Math.floor(value * levelBonus);
            }
        }
        
        return bonus;
    }

    function getMountPower() {
        initMountSystem();
        if (!player.activeMount) return 0;
        
        const mount = player.mounts.find(m => m.id === player.activeMount);
        if (!mount) return 0;
        
        const base = MOUNT_DATA[mount.type];
        return Math.floor(base.power * (1 + (mount.level - 1) * 0.1));
    }

    function summonMount(mountType) {
        initMountSystem();
        
        if (!MOUNT_DATA[mountType]) {
            showToast('坐骑不存在', 'danger', 2000);
            return;
        }
        
        const cost = getMountSummonCost(mountType);
        if (player.lingshi < cost) {
            showToast('灵石不足', 'danger', 2000);
            return;
        }
        
        player.lingshi -= cost;
        
        const mount = {
            id: Date.now() + Math.random(),
            type: mountType,
            level: 1,
            exp: 0,
            hp: 100,
            hp_max: 100,
            skills: [],
            name: MOUNT_DATA[mountType].name
        };
        
        player.mounts.push(mount);
        player.activeMount = mount.id;
        
        showToast(`成功召唤坐骑: ${mount.name}!`, 'success', 3000);
        addEvent(`召唤坐骑: ${mount.name}`, 'success');
        actionMount();
        updateUI();
        saveGame();
    }

    function getMountSummonCost(mountType) {
        const mount = MOUNT_DATA[mountType];
        const rarityCost = { '普通': 500, '稀有': 2000, '史诗': 5000, '传说': 15000, '神话': 50000 };
        return rarityCost[mount.rarity] || 1000;
    }

    function levelUpMount(mountId) {
        initMountSystem();
        
        const mount = player.mounts.find(m => m.id === mountId);
        if (!mount) {
            showToast('坐骑不存在', 'danger', 2000);
            return;
        }
        
        const cost = getMountLevelUpCost(mount);
        if (player.lingshi < cost) {
            showToast('灵石不足', 'danger', 2000);
            return;
        }
        
        player.lingshi -= cost;
        mount.level++;
        mount.hp_max += 20;
        mount.hp = mount.hp_max;
        
        if (mount.level % 5 === 0) {
            const randomSkill = MOUNT_SKILLS[Math.floor(Math.random() * MOUNT_SKILLS.length)];
            if (!mount.skills.find(s => s === randomSkill.id)) {
                mount.skills.push(randomSkill.id);
                showToast(`坐骑领悟技能: ${randomSkill.name}!`, 'highlight', 4000);
            }
        }
        
        showToast(`${mount.name} 升级到 Lv.${mount.level}!`, 'success', 2000);
        addEvent(`坐骑升级: ${mount.name} Lv.${mount.level}`, 'success');
        actionMount();
        updateUI();
        saveGame();
    }

    function getMountLevelUpCost(mount) {
        const base = MOUNT_DATA[mount.type];
        const rarityMult = { '普通': 1, '稀有': 2, '史诗': 3, '传说': 5, '神话': 10 };
        return Math.floor(500 * rarityMult[base.rarity] * mount.level);
    }

    function equipMount(mountId) {
        initMountSystem();
        
        const mount = player.mounts.find(m => m.id === mountId);
        if (!mount) {
            showToast('坐骑不存在', 'danger', 2000);
            return;
        }
        
        player.activeMount = mountId;
        showToast(`已骑乘: ${mount.name}!`, 'success', 2000);
        addEvent(`骑乘坐骑: ${mount.name}`, 'success');
        actionMount();
        updateUI();
        saveGame();
    }

    function feedMount(mountId) {
        initMountSystem();
        
        const mount = player.mounts.find(m => m.id === mountId);
        if (!mount) {
            showToast('坐骑不存在', 'danger', 2000);
            return;
        }
        
        const feedCost = 100;
        if (player.lingshi < feedCost) {
            showToast('灵石不足', 'danger', 2000);
            return;
        }
        
        player.lingshi -= feedCost;
        mount.exp += 50;
        
        if (mount.exp >= mount.level * 100) {
            mount.exp -= mount.level * 100;
            levelUpMount(mountId);
            return;
        }
        
        showToast(`${mount.name} 饱食度+50`, 'success', 2000);
        actionMount();
        saveGame();
    }

    function battleDungeonMonster(dungeonId, monsterName, monsterPower, monsterHp) {
        const playerPower = calcPower(player);
        const playerHp = player.hp;
        
        const playerDamage = Math.floor(playerPower * (0.8 + Math.random() * 0.4));
        const monsterDamage = Math.floor(monsterPower * (0.6 + Math.random() * 0.4));
        
        let playerCurrentHp = playerHp;
        let monsterCurrentHp = monsterHp;
        
        while (playerCurrentHp > 0 && monsterCurrentHp > 0) {
            monsterCurrentHp -= playerDamage;
            if (monsterCurrentHp <= 0) break;
            playerCurrentHp -= monsterDamage;
        }
        
        if (playerCurrentHp > 0) {
            const dungeon = DUNGEON_DATA[dungeonId];
            const monster = dungeon.monsters.find(m => m.name === monsterName);
            
            let drops = '';
            if (monster.drop.lingshi) {
                const lingshi = Math.floor(monster.drop.lingshi[0] + Math.random() * (monster.drop.lingshi[1] - monster.drop.lingshi[0]));

                drops += `灵石+${lingshi}`;

                player.pills = (player.pills || 0) + Math.floor(monster.drop.pills[0] + Math.random() * (monster.drop.pills[1] - monster.drop.pills[0]));
                drops += drops ? ', 丹药+1' : '丹药+1';
            }
            if (monster.drop.materials && Math.random() < 0.2) {
                player.materials = (player.materials || 0) + Math.floor(monster.drop.materials[0] + Math.random() * (monster.drop.materials[1] - monster.drop.materials[0]));
                drops += drops ? ', 材料+1' : '材料+1';

    function battleDungeonBoss(dungeonId, bossName, bossPower, bossHp) {
        const playerPower = calcPower(player);
        const playerHp = player.hp;
        
        let playerCurrentHp = playerHp;
        let bossCurrentHp = bossHp;
        let round = 1;
        
        while (playerCurrentHp > 0 && bossCurrentHp > 0) {
            const playerDamage = Math.floor(playerPower * (0.7 + Math.random() * 0.5));
            const bossDamage = Math.floor(bossPower * (0.5 + Math.random() * 0.5));
            
            bossCurrentHp -= playerDamage;
            if (bossCurrentHp <= 0) break;
            
            playerCurrentHp -= bossDamage;
            round++;
        }
        
        if (playerCurrentHp > 0) {
            const dungeon = DUNGEON_DATA[dungeonId];
            
            let drops = '';
            if (dungeon.boss.drop.lingshi) {
                const lingshi = Math.floor(dungeon.boss.drop.lingshi[0] + Math.random() * (dungeon.boss.drop.lingshi[1] - dungeon.boss.drop.lingshi[0]));
                player.lingshi += lingshi;
                drops += `灵石+${lingshi}`;
            }
            if (dungeon.boss.drop.xiu) {
                player.xiu = Math.min(player.xiu_max, player.xiu + dungeon.boss.drop.xiu);
                drops += drops ? `, 修为+${dungeon.boss.drop.xiu}` : `修为+${dungeon.boss.drop.xiu}`;
            }
            if (dungeon.boss.drop.power) {
                player.power += dungeon.boss.drop.power;
                drops += drops ? `, 战力+${dungeon.boss.drop.power}` : `战力+${dungeon.boss.drop.power}`;
            }
            if (dungeon.boss.drop.materials && Math.random() < 0.5) {
                const mat = Math.floor(dungeon.boss.drop.materials[0] + Math.random() * (dungeon.boss.drop.materials[1] - dungeon.boss.drop.materials[0]));
                player.materials = (player.materials || 0) + mat;
                drops += drops ? `, 材料+${mat}` : `材料+${mat}`;
            }
            if (dungeon.boss.drop.equipment && Math.random() < 0.3) {
                drops += drops ? ', 装备+1' : '装备+1';
            }
            if (dungeon.boss.drop.lingbao && Math.random() < 0.1) {
                drops += drops ? ', 灵宝+1' : '灵宝+1';
            }
            
            player.lingshi += dungeon.reward.lingshi;
            player.xiu = Math.min(player.xiu_max, player.xiu + dungeon.reward.xiu);
            
            drops += `, 通关奖励: 灵石+${dungeon.reward.lingshi}, 修为+${dungeon.reward.xiu}`;
            
            showToast(`🎉 击败${bossName}!通关成功! ${drops}`, 'highlight', 4000);
            addEvent(`通关副本: ${dungeon.name}, 击败BOSS: ${bossName}`, 'success');
            
            player.dungeonRecords[dungeonId] = player.day;
        } else {
            player.hp = Math.floor(player.hp_max * 0.2);
            showToast(`被${bossName}击败!血量恢复20%`, 'danger', 3000);
            addEvent(`被BOSS击败: ${bossName}`, 'danger');
        }
        
        updateUI();
        saveGame();
        closeModal();
    }

    function generateDailyQuests() {
        if (!player.dailyQuests) player.dailyQuests = { date: 0, quests: [] };
        
        const today = new Date().toDateString();
        if (player.dailyQuests.date === today) return;
        
        const shuffled = [...ALL_DAILY_QUESTS].sort(() => Math.random() - 0.5);
        const selected = shuffled.slice(0, 8);
        
        player.dailyQuests = {
            date: today,
            quests: selected.map(q => ({ ...q, current: 0, completed: false, claimed: false }))
        };
    }

    function updateDailyQuest(type, amount = 1) {
        if (!player.dailyQuests) return;
        const quest = player.dailyQuests.quests.find(q => q.id === type && !q.completed);
        if (quest) {
            quest.current += amount;
            if (quest.current >= quest.target) {
                quest.completed = true;
                quest.current = quest.target;
                showToast(`每日任务完成: ${quest.name}!`, 'success', 4000);
                addEvent(`完成任务: ${quest.name}`, 'success');
            }
        }
    }

    function claimDailyQuest(questId) {
        if (!player.dailyQuests) return;
        const quest = player.dailyQuests.quests.find(q => q.id === questId);
        if (!quest || !quest.completed || quest.claimed) return;

        quest.claimed = true;

        let rewards = [];
        if (quest.reward.lingshi) {
            player.lingshi += quest.reward.lingshi;
            rewards.push(`灵石+${quest.reward.lingshi}`);
        }
        if (quest.reward.xiu) {
            player.xiu = Math.min(player.xiu_max, player.xiu + quest.reward.xiu);
            rewards.push(`修为+${quest.reward.xiu}`);
        }

        showToast(`领取奖励: ${rewards.join(', ')}`, 'success', 3000);
        addEvent(`领取任务奖励: ${quest.name} - ${rewards.join(', ')}`, 'success');

        closeModal();
        actionDailyQuest();
        updateUI();
    }

    function unlockSkillNode(id) {
        const skill = SKILL_TREE[id];
        if (!skill) return;
        
        if (!skill.requires.every(r => player.skillTree.includes(r))) {
            showToast('前置技能未解锁!', 'danger');
            return;
        }
        
        const cost = 100 * (player.skillTree.filter(s => s.startsWith(id.split('_')[0])).length + 1);
        if (player.xiu < cost) {
            showToast('修为不足!', 'danger');
            return;
        }
        
        player.xiu -= cost;
        player.skillTree.push(id);
        
        // 应用效果
        applySkillTreeEffects();
        
        showToast(`解锁技能: ${skill.name}!`, 'success', 3000);
        addEvent(`解锁技能树: ${skill.name}`, 'success');
        actionSkillTree();
    }

    function applySkillTreeEffects() {
        if (!player.skillTree) return;
        player.bonusPowerMult = 1;
        player.bonusHpMult = 1;
        player.bonusXiuMult = 1;
        player.bonusCrit = 0;
        player.bonusLifesteal = 0;
        player.bonusQiYun = 0;
        
        player.skillTree.forEach(id => {
            const skill = SKILL_TREE[id];
            if (!skill) return;
            if (skill.effect.power_mult) player.bonusPowerMult *= skill.effect.power_mult;
            if (skill.effect.hp_mult) player.bonusHpMult *= skill.effect.hp_mult;
            if (skill.effect.xiu_mult) player.bonusXiuMult *= skill.effect.xiu_mult;
            if (skill.effect.crit) player.bonusCrit += skill.effect.crit;
            if (skill.effect.lifesteal) player.bonusLifesteal += skill.effect.lifesteal;
            if (skill.effect.qiyun) player.bonusQiYun += skill.effect.qiyun;
        });
    }

            </div>
        </div>`;
        
        document.body.insertAdjacentHTML('beforeend', html);
    }

    function nextTutorial() {
        const overlay = document.querySelector('.tutorial-overlay');
        if (overlay) overlay.remove();
        tutorialStep++;
        if (tutorialStep < TUTORIAL_STEPS.length) {
            showTutorial();
        } else {
            player.tutorialDone = true;
        }
    }

    function skipTutorial() {
        const overlay = document.querySelector('.tutorial-overlay');
        if (overlay) overlay.remove();
        player.tutorialDone = true;
    }

    function sendChat() {
        const input = document.getElementById('chatInput');
        if (!input || !input.value.trim()) return;
        
        if (!player.worldChat) player.worldChat = [];
        player.worldChat.push({ name: player.dao || '你', msg: input.value });
        if (player.worldChat.length > 50) player.worldChat = player.worldChat.slice(-50);
        
        actionSocial();
    }

    function calcPlayerBattlePower() {
        let basePower = calcPower(player);
        if (player.bonusPowerMult) basePower *= player.bonusPowerMult;
        if (player.tribulationBonus) basePower *= player.tribulationBonus;
        return Math.floor(basePower);
    }

    function calcPlayerCritRate() {
        let crit = 0.05; // 基础5%
        if (player.bonusCrit) crit += player.bonusCrit;
        return Math.min(crit, 0.5);
    }

        ).join('');

    function generateLover() {
        const gender = rand(0, 1);
        const names = gender ? LOVER_NAMES_FEMALE : LOVER_NAMES_MALE;
        const titles = gender ? ["仙子", "仙子", "仙子", "夫人", "仙子"] : ["公子", "真君", "仙君", "道兄", "仙长"];
        const personality = pick(LOVER_PERSONALITIES);
        return {
            id: Date.now() + rand(1, 9999),
            name: pick(names),
            title: pick(titles),
            gender: gender ? '女' : '男',
            race: pick(RACE_LIST).name,
            background: pick(LOVER_BACKGROUNDS),
            power: rand(20, 100),
            affection: rand(30, 60),
            loyalty: rand(40, 70),
            cultivation: rand(1, 3),
            level: 1,
            exp: 0,
            quests: [],
            completedQuests: [],
            gifts: [],
            stories: 0,
            lastEventDay: 0,
            personality: personality.id,
            personalityName: personality.name,
            personalityDesc: personality.desc,
            personalityBonus: personality.affectionBonus,
            boldThreshold: personality.boldThreshold
        };
    }

    function getHeartDisplay(affection) {
        const full = Math.min(5, Math.floor(affection / 20));
        const empty = 5 - full;
        return '❤️'.repeat(full) + '🖤'.repeat(empty);
    }

    function getAffectionLevel(affection) {
        if (affection >= 90) return { name: "情深似海", color: "#ff69b4" };
        if (affection >= 70) return { name: "恩爱缠绵", color: "#ff1493" };
        if (affection >= 50) return { name: "情投意合", color: "#ff69b4" };
        if (affection >= 30) return { name: "若即若离", color: "#daa520" };
        if (affection >= 10) return { name: "貌合神离", color: "#cd853f" };
        return { name: "即将分手", color: "#8b0000" };
    }

    function loverGainAffection(lover, amount) {
        lover.affection = clamp(lover.affection + amount, 0, 100);
        if (amount > 0) {
            lover.loyalty = clamp(lover.loyalty + amount * 0.2, 0, 100);
        }
        addEvent(`${lover.name}${lover.title}好感${amount > 0 ? '+' : ''}${amount}`, amount > 0 ? 'pink' : 'danger');
    }

    function loverLoseAffection(lover, amount) {
        loverGainAffection(lover, -amount);
        if (lover.affection <= 0) {
            addEvent(`${lover.name}${lover.title}离你而去...`, 'danger');
            player.lovers = player.lovers.filter(l => l.id !== lover.id);
        }
    }

    function pursueLover(idx) {

    function doLoverQuest(idx, qidx) {
        const lover = player.lovers[idx];
        if (!lover) return;

        const quests = lover.quests.filter(q => !lover.completedQuests.includes(q.id));
        const quest = quests[qidx];
        if (!quest) return;

        let success = true;
        let message = '';

        switch (quest.type) {
            case 'collect':
                if ((player.herb?.[quest.target] || 0) >= 1) {
                    player.herb[quest.target]--;
                    message = `赠送了${quest.target}`;
                } else {
                    success = false;
                    message = '没有找到灵花...';
                }
                break;
            case 'combat':
                const enemy = { power: calcPower(player) * 0.5, name: '妖兽' };
                if (Math.random() < 0.7) {
                    message = '并肩作战,击退敌人!';
                } else {
                    success = false;
                    message = '敌人太强大,未能取胜...';
                }
                break;
            case 'craft':
                if ((player.pills?.[quest.target] || 0) >= 1) {
                    player.pills[quest.target]--;
                    message = `炼制了${quest.target}`;
                } else {
                    success = false;
                    message = '没有聚灵丹...';
                }
                break;
            case 'explore':
                const found = rand(20, 80);
                player.lingshi += found;
                message = `探索秘境,获得${found}灵石`;
                break;
            case 'gift':
                if (player.lingshi >= quest.cost) {
                    player.lingshi -= quest.cost;
                    message = `赠送了${quest.cost}灵石`;
                } else {
                    success = false;
                    message = '灵石不足...';
                }
                break;
            case 'talk':
                message = '倾诉衷肠,情意绵绵';
                break;
        }

        if (success) {
            loverGainAffection(lover, quest.reward);
            lover.completedQuests.push(quest.id);
            addEvent(`${lover.name}: ${message}`, 'pink');
            addEvent(`好感+${quest.reward}`, 'success');
        } else {
            addEvent(`${lover.name}: ${message}`, 'danger');
        }

        closeModal();
        updateUI();
    }

    function loverInteract(idx) {
        const lover = player.lovers[idx];
        if (!lover) return;

        let html = `<h3>💖 与${lover.name}${lover.title}亲密互动</h3>`;
        html += `<div style="font-size:0.8rem;color:#888;margin-bottom:10px;">当前好感度: ${lover.affection}/100 · 性格: ${lover.personalityName || '温柔体贴'}</div>`;
        
        const availableInteractions = LOVER_INTERACTIONS.filter(inter => {
            return lover.affection >= inter.minAffection;
        });

        if (availableInteractions.length === 0) {
            html += '<p style="color:#888;">好感度不足,无法进行亲密互动~</p>';
            html += '<button class="modal-option" data-action="close-modal">关闭</button>';
            showModal(html);
            return;
        }

        availableInteractions.forEach((inter, interIdx) => {
            const personality = LOVER_PERSONALITIES.find(p => p.id === lover.personality) || LOVER_PERSONALITIES[0];
            const adjustedThreshold = personality.boldThreshold || 40;
            let isAvailable = true;
            
            if (inter.boldLevel >= 4 && lover.affection < adjustedThreshold) {
                isAvailable = false;
            }

            let btnClass = 'btn-small';
            if (inter.boldLevel >= 4) btnClass += ' pink-btn';
            if (inter.boldLevel >= 5) btnClass += ' highlight-btn';
            if (!isAvailable) btnClass += ' disabled-btn';

            html += `
                <div class="npc-card" style="margin-bottom:8px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;">

                        </div>
                        <button class="${btnClass}" ${!isAvailable ? 'disabled' : ''} 
                            data-action="do-lover-interact" data-idx="${idx}" data-inter="${inter.id}">
                            进行
                        </button>

                </div>
            `;
        });

        html += '<button class="modal-option" data-action="close-modal">关闭</button>';
        showModal(html);
    }

    function doLoverInteract(idx, interId) {
        const lover = player.lovers[idx];
        if (!lover) return;

        const inter = LOVER_INTERACTIONS.find(i => i.id === interId);
        if (!inter) return;

        if (lover.affection < inter.minAffection) {
            addEvent('好感度不足,无法进行此互动', 'danger');
            return;
        }

        const personality = LOVER_PERSONALITIES.find(p => p.id === lover.personality) || LOVER_PERSONALITIES[0];
        const adjustedThreshold = personality.boldThreshold || 40;

        if (inter.boldLevel >= 4 && lover.affection < adjustedThreshold) {
            addEvent(`${lover.name}${lover.title}似乎还没准备好...`, 'info');
            return;
        }

        if (lover.affection >= inter.affectionCost) {
            lover.affection -= inter.affectionCost;
        }

        let bonusMultiplier = personality.affectionBonus || 1;
        const affectionGain = Math.floor(inter.affectionGain * bonusMultiplier);
        
        loverGainAffection(lover, affectionGain);

        const responses = INTERACTION_RESPONSES[interId]?.[lover.personality] || INTERACTION_RESPONSES[interId]?.['gentle'] || ['互动成功'];
        const response = pick(responses).replace(/\$\{name\}/g, lover.name);

        addEvent(`💖 ${response}`, 'pink');
        addEvent(`好感度+${affectionGain}`, 'success');

        if (inter.boldLevel >= 5) {
            addEvent(`✨ 亲密互动效果极佳,道心+${Math.floor(affectionGain / 2)}`, 'highlight');
            player.daoXin = (player.daoXin || 0) + Math.floor(affectionGain / 2);
        }

        if (inter.id === 'bath-together') {
            player.hp = Math.min(player.hp_max, (player.hp || 0) + 20);
            addEvent('🛁 温泉滋养,气血恢复+20', 'success');
        }

        if (inter.id === 'massage') {
            player.xiu = Math.min(player.xiu_max, (player.xiu || 0) + Math.floor(calcPracticeGain(player) * 0.5));
            addEvent('✋ 放松身心,修为小幅增长', 'success');
        }

        checkLoverEvent(lover);
        updateUI();
    }

    function checkLoverEvent(lover) {
        if (player.day - (lover.lastEventDay || 0) < 10) return;

        if (Math.random() < 0.3) {
            lover.lastEventDay = player.day;
            const event = pick(LOVER_EVENTS);

            if (event.effect.xiu) {
                player.xiu = Math.min(player.xiu_max, (player.xiu || 0) + event.effect.xiu);
            }
            if (event.effect.hp) {
                player.hp = clamp((player.hp || 0) + event.effect.hp, 0, player.hp_max);
            }
            if (event.effect.lingshi) {
                player.lingshi = (player.lingshi || 0) + event.effect.lingshi;
            }
            if (event.effect.power) {
                lover.power += event.effect.power;
            }

            loverGainAffection(lover, event.effect.affection);

            addEvent(`【${lover.name}】${event.text}`, 'pink');
        }
    }

    function recommendTechniques() {
        const recommendations = [];
        const owned = player.techniques?.map(t => t.name) || [];
        
        // 根据流派推荐
        switch (player.dao_path) {
            case '剑修':
                if (!owned.includes('御剑术')) recommendations.push('御剑术');
                if (!owned.includes('万剑归宗')) recommendations.push('万剑归宗');
                if (!owned.includes('万剑诀')) recommendations.push('万剑诀');
                break;
            case '体修':
                if (!owned.includes('九转玄功')) recommendations.push('九转玄功');
                if (!owned.includes('金刚不坏')) recommendations.push('金刚不坏');
                if (!owned.includes('金钟罩')) recommendations.push('金钟罩');
                break;
            case '丹修':
                if (!owned.includes('炼丹真言')) recommendations.push('炼丹真言');
                if (!owned.includes('神农秘典')) recommendations.push('神农秘典');
                if (!owned.includes('清心诀')) recommendations.push('清心诀');
                break;
            case '魔修':
                if (!owned.includes('天魔解体')) recommendations.push('天魔解体');
                if (!owned.includes('吸星大法')) recommendations.push('吸星大法');
                if (!owned.includes('血魔大法')) recommendations.push('血魔大法');
                break;
            case '法修':
                if (!owned.includes('天雷引')) recommendations.push('天雷引');
                if (!owned.includes('化神诀')) recommendations.push('化神诀');
                if (!owned.includes('雷动九天')) recommendations.push('雷动九天');
                break;
            case '鬼修':
                if (!owned.includes('噬魂术')) recommendations.push('噬魂术');
                if (!owned.includes('化血大法')) recommendations.push('化血大法');
                if (!owned.includes('鬼影步')) recommendations.push('鬼影步');
                break;
        }

        // 根据当前弱点推荐
        if (player.hp_max < 100 && !owned.includes('玄冰诀')) recommendations.push('玄冰诀');
        if (calcPower(player) < 50 && !owned.includes('天雷引')) recommendations.push('天雷引');

        return recommendations.slice(0, 5);
    }

    function getServantBonus() {
        const bonuses = {};
        (player.cave?.servants || []).forEach(servant => {
            const bonus = SERVANT_BONUS[servant];
            if (bonus) {
                Object.entries(bonus).forEach(([attr, value]) => {
                    if (!bonuses[attr]) bonuses[attr] = 1;
                    bonuses[attr] *= value;
                });
            }
        });
        return bonuses;
    }

    function exploreCave() {
        const caveLevel = CAVE_LEVELS[(player.cave?.level || 1) - 1];
        if (caveLevel.level < 3) {
            showToast('洞府等级太低，无法探索深处', 'warning', 2000);
            return;
        }

        // 计算事件概率
        let rand = Math.random();
        for (const event of CAVE_EVENTS) {
            if (rand < event.probability) {
                triggerCaveEvent(event);
                return;
            }
            rand -= event.probability;
        }
    }

    function triggerCaveEvent(event) {
        if (event.type === 'bad') {
            // 护院修士减少坏事概率
            const servantBonus = getServantBonus();
            if (servantBonus.cave_event_bad && Math.random() < servantBonus.cave_event_bad) {
                showToast('护院修士成功阻止了坏事发生!', 'success', 3000);
                addEvent('护院修士成功保护了洞府', 'success');
                return;
            }
        }

        if (event.effect) {
            if (event.effect.lingshi) player.lingshi += event.effect.lingshi;
            if (event.effect.xiu) player.xiu = Math.min(player.xiu_max, player.xiu + event.effect.xiu);
            if (event.effect.hp) player.hp = Math.max(1, player.hp + event.effect.hp);
            if (event.effect.herb) {
                Object.entries(event.effect.herb).forEach(([name, amt]) => {
                    player.herb[name] = (player.herb[name] || 0) + amt;
                });
            }
            if (event.effect.xiu_mult && event.effect.duration) {
                player.caveTempBonus = { xiu_mult: event.effect.xiu_mult, duration: event.effect.duration };
            }
        }

        const color = event.type === 'good' ? 'var(--success)' : event.type === 'bad' ? 'var(--danger)' : '#888';
        showToast(`${event.name}: ${event.desc}`, event.type === 'good' ? 'success' : event.type === 'bad' ? 'danger' : 'info', 3000);
        addEvent(`洞府事件: ${event.name}`, event.type === 'good' ? 'success' : event.type === 'bad' ? 'danger' : 'info');
        
        actionCave();
        updateUI();
    }

    function upgradeCave() {
        if (player.cave.level >= CAVE_LEVELS.length) return;
        const nextLevel = CAVE_LEVELS[player.cave.level];
        if (player.lingshi < nextLevel.cost) {
            addEvent('灵石不足', 'danger');
            return;
        }
        player.lingshi -= nextLevel.cost;
        player.cave.level++;
        addEvent(`洞府升级为${nextLevel.name}!`, 'success');
        closeModal();
        actionCave();
        updateUI();
    }

    function hireServant(type) {
        const cost = SERVANT_COST[type];
        if (player.lingshi < cost) {
            addEvent('灵石不足', 'danger');
            return;
        }
        player.lingshi -= cost;
        player.cave.servants = player.cave.servants || [];
        player.cave.servants.push(type);
        addEvent(`雇佣${type}成功`, 'success');
        closeModal();
        actionCave();
    }

    function dismissServant(idx) {
        player.cave.servants.splice(idx, 1);
        addEvent('仆役已解雇', 'info');
        closeModal();
        actionCave();
    }

    function harvestCave() {
        if (player.day - (player.cave.lastHarvest || 0) < 1) {
            addEvent('今日已收取过洞府产出', 'danger');
            return;
        }
        player.cave.lastHarvest = player.day;
        const caveLevel = CAVE_LEVELS[(player.cave?.level || 1) - 1];
        for (let [resource, amt] of Object.entries(caveLevel.resource)) {
            if (resource === '灵石') {
                player.lingshi += amt;
            } else if (resource.includes('灵草')) {
                player.herb[resource] = (player.herb[resource] || 0) + amt;
            } else if (resource === '妖兽内丹') {
                player.herb[resource] = (player.herb[resource] || 0) + amt;
            }
        }
        addEvent('收取洞府产出!', 'success');
        closeModal();
        updateUI();
    }

    function checkSectMission() {
        if (!player.activeMission) return;
        const m = player.activeMission;
        const elapsed = player.day - m.startDay;
        if (elapsed >= m.days) {
            // 任务完成
            player.sect_contrib += m.reward.contrib;
            if (m.reward.lingshi) player.lingshi += m.reward.lingshi;
            if (m.reward.xiu) player.xiu = Math.min(player.xiu_max, player.xiu + m.reward.xiu);

            if (m.combat && Math.random() < 0.3) {
                const dmg = rand(20, 50);
                player.hp = Math.max(1, player.hp - dmg);
                addEvent(`任务中受伤,气血-${dmg}`, 'danger');
            }

            addEvent(`宗门任务完成: ${m.name}!`, 'highlight');
            player.activeMission = null;
        }
    }

    function doTribulationLevel(level) {
        const trib = TRIBULATION_LEVELS.find(t => t.level === level);
        if (!trib) return;
        
        const qiYunBonus = getQiYunEffect().luck * 5;
        const daoXinBonus = Math.floor((player.daoXin || 0) / 10);
        const fuyuanBonus = Math.floor((player.fuyuan || 0) / 5);
        const finalRate = Math.min(95, trib.successRate + qiYunBonus + daoXinBonus + fuyuanBonus);
        
        player.day++;
        
        // 显示渡劫动画
        let html = '<h3>⚡ 渡劫进行中...</h3>';
        html += '<div style="text-align:center;padding:2rem;">';
        html += '<div style="font-size:4rem;animation:shake 0.5s infinite;">⚡</div>';
        html += `<div style="font-size:1.2rem;margin-top:1rem;">${trib.name}降临!</div>`;
        html += `<div style="font-size:0.8rem;color:#aaa;">第${level}重天劫</div>`;
        html += '</div>';
        showModal(html);
        
        setTimeout(() => {
            const success = rand(1, 100) <= finalRate;
            
            if (success) {
                // 渡劫成功
                player.tribulationLevel = level;
                player.tribulationBonus = (player.tribulationBonus || 1) * trib.rewards.power_mult;
                player.daoXin = (player.daoXin || 0) + trib.rewards.daoxin;
                player.luck = (player.luck || 0) + trib.rewards.luck;
                
                // 九劫特殊奖励
                if (level === 9) {
                    player.canAscend = true;
                    addEvent('九重天劫全部渡过！获得飞升资格！', 'highlight');
                    showToast('获得飞升资格！', 'highlight', 5000);
                    unlockAchievement('tribulation_pass');
                }
                
                showResult(true, `${trib.name}渡劫成功!`, '', { '战力倍率': `x${trib.rewards.power_mult}`, '道心': `+${trib.rewards.daoxin}`, '气运': `+${trib.rewards.luck}` });
                addEvent(`${trib.name}渡劫成功!`, 'highlight');
            } else {
                // 渡劫失败
                const damage = Math.floor(player.hp_max * trib.damage / 100);
                player.hp -= damage;
                
                if (player.hp <= 0) {
                    const bodyEffect = getSpecialBodyEffect();
                    if (bodyEffect.name === '涅槃体' && player.nirvanaCount < 3) {
                        player.hp = player.hp_max;
                        player.nirvanaCount = (player.nirvanaCount || 0) + 1;
                        showToast('涅槃体质触发,死而复生!', 'purple', 4000);
                        addEvent('渡劫失败,涅槃重生!', 'purple');
                    } else {
                        gameEnded = true;
                        showResult(false, '', `${trib.name}渡劫失败,身陨道消...`, null);
                        addEvent(`${trib.name}渡劫失败,身陨道消...`, 'danger');
                        setTimeout(() => showGameOver('渡劫失败，身陨道消'), 1000);
                    }
                } else {
                    showResult(false, '', `${trib.name}渡劫失败!损失${damage}气血`, null);
                    addEvent(`${trib.name}渡劫失败,损失${damage}气血`, 'danger');
                }
            }
            
            updateUI();
        }, 2000);

        if (success) {
            player.artifacts = player.artifacts || [];
            player.artifacts.push({

                type: artifact.type,
                powerBonus: artifact.powerBonus || 0,
                hpBonus: artifact.hpBonus || 0,

            showToast('已有心魔侵扰!', 'danger');
            return;

            showToast('所有心魔已降服!', 'success');
            return;
        }
        
        const demon = pick(available);
        player.heartDemons.active = demon.name;
        
        showToast(`${demon.name}开始侵扰!`, 'danger', 4000);
        addEvent(`${demon.name}心魔入侵!`, 'danger');
        
        actionHeartDemon();

    function summonSpecificDemon(name) {
        if (!player.heartDemons) player.heartDemons = { defeated: [], active: null };
        if (player.heartDemons.active) {
            showToast('已有心魔侵扰!', 'danger');
            return;
        }
        
        const demon = HEART_DEMONS.find(d => d.name === name);
        if (!demon) return;
        
        player.heartDemons.active = name;
        showToast(`${name}开始侵扰!`, 'danger', 4000);
        addEvent(`${name}心魔入侵!`, 'danger');
        
        actionHeartDemon();

    function defeatDemon(name) {
        if (!player.heartDemons || !player.heartDemons.active) return;
        
        const demon = HEART_DEMONS.find(d => d.name === name);
        if (!demon) return;
        
        player.day++;
        
        // 计算成功率
        const playerLevel = getJingjieIdx(player.jingjie) + 1;
        const baseRate = 50 + (playerLevel - demon.difficulty) * 15;
        const qiYunBonus = getQiYunEffect().luck * 3;
        const finalRate = Math.min(90, Math.max(10, baseRate + qiYunBonus));
        
        const success = rand(1, 100) <= finalRate;
        
        if (success) {
            player.heartDemons.defeated.push(name);
            player.heartDemons.active = null;
            
            // 永久加成
            player.heartDemonBonus = (player.heartDemonBonus || 0) + 0.05;
            
            showResult(true, `降服${name}心魔!心境圆满!`, '', { 
                '永久战力加成': '+5%',
                '已降服': `${player.heartDemons.defeated.length}/${HEART_DEMONS.length}`
            });
            addEvent(`降服${name}心魔!心境圆满!`, 'highlight');
        } else {
            const damage = Math.floor(player.hp_max * 0.1 * demon.difficulty);
            player.hp -= damage;
            
            showResult(false, '', `降服失败!${name}反噬,损失${damage}气血`, null);
            addEvent(`降服${name}失败,损失${damage}气血`, 'danger');
        }
        
        updateUI();
        actionHeartDemon();
    }

    function getHeartDemonDebuff() {
        if (!player.heartDemons || !player.heartDemons.active) return {};
        const demon = HEART_DEMONS.find(d => d.name === player.heartDemons.active);
        return demon ? demon.debuff : {};
    }

    // 心魔随机苏醒检查
    function checkDemonAwakening() {
        if (!player.heartDemons) {
            player.heartDemons = { active: null, demonPower: 0, defeated: [] };
        }
        
        const power = player.heartDemons.demonPower || 0;
        if (power < 20) return; // 魔念低时不触发
        
        // 概率与魔念值相关
        let chance = 0;
        if (power >= 80) chance = 0.3;
        else if (power >= 50) chance = 0.15;
        else if (power >= 20) chance = 0.05;
        
        if (Math.random() < chance && !player.heartDemons.active) {
            // 随机一个未被击败的心魔

    function learnBattleSkill(skillName) {
        const skill = BATTLE_SKILLS[skillName];
        if (!skill) return;
        
        if (!player.battleSkills) player.battleSkills = [];
        if (player.battleSkills.includes(skillName)) {
            showToast('已学习该技能', 'info');
            return;
        }
        
        const playerLevel = getJingjieIdx(player.jingjie) + 1;
        if (playerLevel < (skill.levelReq || 1)) {
            showToast('境界不足!', 'danger');
            return;
        }
        
        const cost = skill.learnCost || 0;
        if (player.lingshi < cost) {
            showToast('灵石不足!', 'danger');
            return;
        }
        
        player.lingshi -= cost;
        player.battleSkills.push(skillName);
        
        showToast(`学习技能: ${skillName}!`, 'success', 3000);
        addEvent(`学习技能: ${skillName}`, 'success');
        
        // 成就检查
        if (player.battleSkills.length === 1) unlockAchievement('first_skill');
        
        updateUI();
    }

        if (!player.daoXinFragments) player.daoXinFragments = [];
        const fragmentType = DAOXIN_FRAGMENT_TYPES.find(f => f.type === type) || DAOXIN_FRAGMENT_TYPES[0];
        
        player.daoXinFragments.unshift({
            id: Date.now(),
            type: type,
            title: title,
            content: content,
            choice: choice,
            day: player.day,
            icon: fragmentType.icon
        });
        
        if (fragmentType.daoXinGain > 0) {
            player.daoXin = (player.daoXin || 0) + fragmentType.daoXinGain;
            if (type === 'good') player.fuyuan = (player.fuyuan || 0) + fragmentType.daoXinGain;
        } else if (fragmentType.daoXinGain < 0) {
            player.daoXin = Math.max(0, (player.daoXin || 0) + fragmentType.daoXinGain);
            player.demonPower = (player.demonPower || 0) + Math.abs(fragmentType.daoXinGain);
        }
        
        if (player.daoXinFragments.length > 100) {
            player.daoXinFragments = player.daoXinFragments.slice(0, 100);
        }

    function generateOfflineStory() {
        if (!player.lastLoginDay) {
            player.lastLoginDay = player.day;
            return null;
        }
        
        const daysOffline = player.day - player.lastLoginDay;
        if (daysOffline < 1) return null;
        
        const numStories = Math.min(Math.ceil(daysOffline / 3), 3);
        const stories = [];
        
        for (let i = 0; i < numStories; i++) {
            const chapter = pick(STORY_CHAPTERS);
            stories.push(chapter);
            
            if (chapter.rewards.lingshi) player.lingshi += chapter.rewards.lingshi;
            if (chapter.rewards.xiu) player.xiu = Math.min(player.xiu_max, player.xiu + chapter.rewards.xiu);
            if (chapter.rewards.daoxin) {
                player.daoXin = (player.daoXin || 0) + chapter.rewards.daoxin;
            }
        }
        
        player.lastLoginDay = player.day;
        return stories;
    }
