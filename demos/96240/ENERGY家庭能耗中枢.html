<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENERGY · 家庭能耗智能中枢</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Inter", -apple-system, "PingFang SC", sans-serif;
    background: #0b0f19;
    color: #e2e8f0;
    min-height: 100vh;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 20% 30%, rgba(0, 242, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(124, 58, 237, 0.1) 0%, transparent 50%);
    pointer-events: none;
  }
  .topbar {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 32px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.15);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, #00f2ff, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #000;
  }
  .brand .name { font-size: 1.1rem; font-weight: 600; letter-spacing: 1px; }
  .brand .name small { display: block; font-size: 0.7rem; color: #94a3b8; font-weight: normal; letter-spacing: 2px; }
  .live { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #94a3b8; }
  .live .dot { width: 8px; height: 8px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 10px #00ff88; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .main { position: relative; z-index: 1; padding: 24px 32px; }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  .card {
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid rgba(148, 163, 184, 0.12);
    border-radius: 16px;
    padding: 24px;
    backdrop-filter: blur(12px);
  }
  .card h2 { font-size: 0.95rem; color: #94a3b8; font-weight: 500; margin-bottom: 18px; letter-spacing: 1px; }
  .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi {
    background: linear-gradient(135deg, rgba(0, 242, 255, 0.1), rgba(124, 58, 237, 0.1));
    border: 1px solid rgba(0, 242, 255, 0.2);
    border-radius: 12px;
    padding: 18px;
  }
  .kpi .label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
  .kpi .value { font-size: 1.8rem; font-weight: 700; color: #fff; margin-top: 6px; }
  .kpi .value span { font-size: 0.9rem; color: #94a3b8; }
  .kpi .trend { font-size: 0.75rem; color: #00ff88; margin-top: 4px; }
  .kpi.danger { border-color: rgba(239, 68, 68, 0.3); background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(124, 58, 237, 0.1)); }
  .kpi.danger .trend { color: #f87171; }
  .chart-container {
    height: 260px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 20px 0 10px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.12);
  }
  .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar {
    width: 100%;
    border-radius: 6px 6px 0 0;
    background: linear-gradient(to top, #7c3aed, #00f2ff);
    box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
    transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }
  .bar::after {
    content: attr(data-value);
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    color: #00f2ff;
  }
  .bar-label { font-size: 0.75rem; color: #94a3b8; }
  .device-list { display: flex; flex-direction: column; gap: 10px; }
  .device-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: rgba(15, 23, 42, 0.5);
    border-radius: 10px;
    border: 1px solid rgba(148, 163, 184, 0.08);
  }
  .device-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
  .device-info { flex: 1; }
  .device-info .name { font-size: 0.9rem; color: #e2e8f0; }
  .device-info .percent { font-size: 0.75rem; color: #94a3b8; }
  .device-bar { width: 80px; height: 6px; background: rgba(148, 163, 184, 0.15); border-radius: 3px; overflow: hidden; }
  .device-fill { height: 100%; background: linear-gradient(90deg, #00f2ff, #7c3aed); border-radius: 3px; }
  .device-kwh { font-size: 0.85rem; font-weight: 600; color: #fff; }
  .insight {
    background: linear-gradient(135deg, rgba(0, 242, 255, 0.1), rgba(124, 58, 237, 0.1));
    border: 1px solid rgba(0, 242, 255, 0.2);
    border-radius: 12px;
    padding: 16px;
    margin-top: 20px;
  }
  .insight h3 { color: #00f2ff; font-size: 0.85rem; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .insight p { color: #cbd5e1; font-size: 0.85rem; line-height: 1.6; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .kpi-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo">E</div>
    <div class="name">ENERGY <small>HOME SMART GRID</small></div>
  </div>
  <div class="live">
    <span class="dot"></span>
    <span>LIVE DATA · 实时监测中</span>
  </div>
</div>

<div class="main">
  <div class="grid">
    <div>
      <div class="card" style="margin-bottom: 20px;">
        <div class="kpi-row">
          <div class="kpi">
            <div class="label">今日用电</div>
            <div class="value">12.8 <span>kWh</span></div>
            <div class="trend">↑ 较昨日 +5.2%</div>
          </div>
          <div class="kpi danger">
            <div class="label">预计月电费</div>
            <div class="value">¥186 <span>/月</span></div>
            <div class="trend">↑ 比上月 +12%</div>
          </div>
          <div class="kpi">
            <div class="label">碳排放</div>
            <div class="value">5.4 <span>kg</span></div>
            <div class="trend">↓ 低碳达标</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>近 7 天能耗趋势</h2>
        <div class="chart-container" id="chart"></div>
      </div>
    </div>

    <div>
      <div class="card" style="margin-bottom: 20px;">
        <h2>耗电设备排行</h2>
        <div class="device-list">
          <div class="device-item">
            <div class="device-icon" style="background: rgba(59,130,246,0.2);">❄️</div>
            <div class="device-info">
              <div class="name">空调</div>
              <div class="percent">35%</div>
            </div>
            <div class="device-bar"><div class="device-fill" style="width:35%"></div></div>
            <div class="device-kwh">4.5 kWh</div>
          </div>
          <div class="device-item">
            <div class="device-icon" style="background: rgba(239,68,68,0.2);">🚿</div>
            <div class="device-info">
              <div class="name">热水器</div>
              <div class="percent">22%</div>
            </div>
            <div class="device-bar"><div class="device-fill" style="width:22%"></div></div>
            <div class="device-kwh">2.8 kWh</div>
          </div>
          <div class="device-item">
            <div class="device-icon" style="background: rgba(245,158,11,0.2);">📺</div>
            <div class="device-info">
              <div class="name">电视影音</div>
              <div class="percent">9%</div>
            </div>
            <div class="device-bar"><div class="device-fill" style="width:9%"></div></div>
            <div class="device-kwh">1.2 kWh</div>
          </div>
          <div class="device-item">
            <div class="device-icon" style="background: rgba(16,185,129,0.2);">💻</div>
            <div class="device-info">
              <div class="name">电脑办公</div>
              <div class="percent">7%</div>
            </div>
            <div class="device-bar"><div class="device-fill" style="width:7%"></div></div>
            <div class="device-kwh">0.9 kWh</div>
          </div>
          <div class="device-item">
            <div class="device-icon" style="background: rgba(139,92,246,0.2);">💡</div>
            <div class="device-info">
              <div class="name">照明</div>
              <div class="percent">3%</div>
            </div>
            <div class="device-bar"><div class="device-fill" style="width:3%"></div></div>
            <div class="device-kwh">0.4 kWh</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="insight">
          <h3>💡 AI 节能建议</h3>
          <p>空调设定在 26℃ 可节省约 18% 能耗；热水器开启定时加热后，预计每月节省 ¥24。</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const data = [8, 10, 9, 12, 14, 11, 13];
  const labels = ['周一','周二','周三','周四','周五','周六','周日'];
  const max = Math.max(...data);
  const chart = document.getElementById('chart');
  data.forEach((v, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'bar-wrap';
    wrap.innerHTML = `
      <div class="bar" data-value="${v}" style="height:0px"></div>
      <div class="bar-label">${labels[i]}</div>
    `;
    chart.appendChild(wrap);
    setTimeout(() => { wrap.querySelector('.bar').style.height = (v/max*200) + 'px'; }, 100 + i * 100);
  });
</script>
</body>
</html>
