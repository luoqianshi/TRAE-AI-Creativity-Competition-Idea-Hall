<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F5F0E6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>诗笺·打工志</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 五大页面 -->
    <main class="page active" id="page-home"></main>
    <main class="page" id="page-chronicle"></main>
    <main class="page" id="page-salary"></main>
    <main class="page" id="page-craft"></main>
    <main class="page" id="page-me"></main>

    <!-- 浮动落墨按钮 -->
    <button class="fab" id="fab" style="display:none" aria-label="撰笺">落墨</button>

    <!-- 底部导航 -->
    <nav class="tabbar">
      <button class="tab active" data-page="home">
        <span class="tab-icon">今</span>
        <span>今日</span>
      </button>
      <button class="tab" data-page="chronicle">
        <span class="tab-icon">时</span>
        <span>四时</span>
      </button>
      <button class="tab" data-page="salary">
        <span class="tab-icon">薪</span>
        <span>薪火</span>
      </button>
      <button class="tab" data-page="craft">
        <span class="tab-icon">匠</span>
        <span>匠心</span>
      </button>
      <button class="tab" data-page="me">
        <span class="tab-icon">我</span>
        <span>我</span>
      </button>
    </nav>
  </div>

  <!-- 弹层 -->
  <div class="modal-mask" id="modal-mask">
    <div class="modal" id="modal-body"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="js/solar.js"></script>
  <script src="js/poems.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
