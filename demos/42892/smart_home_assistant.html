<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏠 智能家居场景规划助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .examples {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .example-btn {
            flex: 1;
            min-width: 200px;
            padding: 15px 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .example-btn:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.2);
        }

        .example-btn .icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .example-btn .title {
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        .example-btn .desc {
            font-size: 0.8rem;
            color: #666;
            margin-top: 3px;
        }

        .input-area {
            margin-bottom: 25px;
        }

        .input-area textarea {
            width: 100%;
            min-height: 120px;
            padding: 20px;
            border: 2px solid #e4e8ec;
            border-radius: 12px;
            font-size: 1rem;
            resize: vertical;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        .input-area textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-area textarea::placeholder {
            color: #999;
        }

        .generate-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .results {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.5s ease;
        }

        .results.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .scene-title {
            font-size: 1.8rem;
            color: #333;
        }

        .source-tag {
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .section-title {
            font-size: 1.2rem;
            color: #333;
            margin: 25px 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .device-card {
            background: linear-gradient(135deg, #f8f9fc 0%, #e8ecf3 100%);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            border: 1px solid #e4e8ec;
        }

        .device-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }

        .device-card .device-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .device-card .device-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .device-card .device-info {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
        }

        .device-card .device-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: #667eea;
            margin-top: 10px;
        }

        .device-card .gateway-tag {
            display: inline-block;
            padding: 3px 8px;
            background: #ff6b6b;
            color: white;
            border-radius: 10px;
            font-size: 0.7rem;
            margin-top: 8px;
        }

        .actions-list {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 20px;
        }

        .action-item {
            padding: 12px 0;
            border-bottom: 1px solid #e4e8ec;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .action-item:last-child {
            border-bottom: none;
        }

        .action-item .arrow {
            color: #667eea;
            font-weight: bold;
        }

        .total-price {
            text-align: center;
            padding: 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            color: white;
            margin-top: 20px;
        }

        .total-price .label {
            font-size: 1rem;
            opacity: 0.9;
        }

        .total-price .amount {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            color: white;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .examples {
                flex-direction: column;
            }
            
            .example-btn {
                min-width: 100%;
            }
            
            .device-grid {
                grid-template-columns: 1fr;
            }
            
            .results-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏠 智能家居规划助手</h1>
            <p>一句话描述需求，AI 推荐设备并生成自动化方案</p>
        </div>

        <div class="main-card">
            <div class="examples">
                <button class="example-btn" onclick="setInput('我想在客厅打造沉浸式观影氛围')">
                    <div class="icon">🎬</div>
                    <div class="title">客厅观影</div>
                    <div class="desc">沉浸式家庭影院体验</div>
                </button>
                <button class="example-btn" onclick="setInput('起夜时自动亮起柔和小夜灯')">
                    <div class="icon">🌙</div>
                    <div class="title">起夜小夜灯</div>
                    <div class="desc">智能感应自动亮灯</div>
                </button>
                <button class="example-btn" onclick="setInput('出门时一键关闭所有电器和灯光')">
                    <div class="icon">🚪</div>
                    <div class="title">离家模式</div>
                    <div class="desc">一键关闭安全省电</div>
                </button>
            </div>

            <div class="input-area">
                <textarea id="userInput" placeholder="请描述您的智能家居需求，例如：&#10;• 我想在卧室设置早安唤醒场景&#10;• 回家时自动开启空调和灯光&#10;• 厨房有人时自动开启抽油烟机"></textarea>
            </div>

            <button class="generate-btn" onclick="generatePlan()">
                ✨ 生成方案
            </button>

            <div id="results" class="results">
                <div class="results-header">
                    <h2 id="sceneTitle" class="scene-title"></h2>
                    <span id="sourceTag" class="source-tag"></span>
                </div>

                <h3 class="section-title">📦 推荐设备清单</h3>
                <div id="deviceGrid" class="device-grid"></div>

                <h3 class="section-title">🔄 自动化动作</h3>
                <div id="actionsList" class="actions-list"></div>

                <div class="total-price">
                    <div class="label">预估总价</div>
                    <div id="totalPrice" class="amount">¥0</div>
                </div>
            </div>
        </div>

        <div class="footer">
            🔒 所有数据均在本地处理，无需联网，保护你的隐私
        </div>
    </div>

    <script>
        // 设备库
        const deviceLibrary = {
            'ai_speaker': { name: '小米AI音箱', category: '音频设备', icon: '🔊', price: 299, gateway: false },
            'lamp_strip': { name: '米家智能灯带', category: '照明设备', icon: '💡', price: 179, gateway: true },
            'curtain_motor': { name: '米家智能窗帘电机', category: '窗帘设备', icon: '🪟', price: 599, gateway: true },
            'body_sensor': { name: '米家人体传感器', category: '传感器', icon: '📡', price: 49, gateway: true },
            'ceiling_lamp': { name: '米家智能吸顶灯', category: '照明设备', icon: '💡', price: 339, gateway: false },
            'smart_socket': { name: '米家智能插座', category: '电源设备', icon: '🔌', price: 59, gateway: false },
            'robot_vacuum': { name: '米家扫地机器人', category: '清洁设备', icon: '🤖', price: 1699, gateway: false },
            'door_sensor': { name: '米家门窗传感器', category: '传感器', icon: '🚪', price: 49, gateway: true },
            'aircon_partner': { name: '米家空调伴侣', category: '空调设备', icon: '❄️', price: 149, gateway: true },
            'humidifier': { name: '米家智能加湿器', category: '环境设备', icon: '💨', price: 199, gateway: false },
            'camera': { name: '米家智能摄像机', category: '监控设备', icon: '📹', price: 199, gateway: false },
            'air_purifier': { name: '米家空气净化器', category: '环境设备', icon: '🌬️', price: 899, gateway: false }
        };

        // 预定义规则库
        const ruleLibrary = [
            {
                id: 'movie',
                keywords: ['观影', '电影', '客厅', '影院', '沉浸', '投影', '电视'],
                sceneName: '🎬 沉浸式观影模式',
                deviceIds: ['ai_speaker', 'lamp_strip', 'curtain_motor'],
                actions: [
                    { device: '🪟 窗帘', action: '自动关闭，营造沉浸氛围' },
                    { device: '💡 灯光', action: '调至暖色调低亮度' },
                    { device: '🔊 音响', action: '自动开启影院模式' }
                ],
                description: '打造专业级家庭影院体验'
            },
            {
                id: 'night_light',
                keywords: ['起夜', '夜灯', '夜间', '晚上', '小夜灯', '半夜'],
                sceneName: '🌙 智能起夜模式',
                deviceIds: ['body_sensor', 'ceiling_lamp'],
                actions: [
                    { device: '📡 人体传感器', action: '实时检测人体移动' },
                    { device: '💡 吸顶灯', action: '自动开启柔光模式（10%亮度）' },
                    { device: '💡 吸顶灯', action: '人离开后2分钟自动关闭' }
                ],
                description: '夜间活动无需摸黑，安全便捷'
            },
            {
                id: 'leave_home',
                keywords: ['离家', '出门', '上班', '关闭所有', '外出'],
                sceneName: '🚪 离家一键模式',
                deviceIds: ['smart_socket', 'robot_vacuum'],
                actions: [
                    { device: '🔌 智能插座', action: '关闭所有可控电器' },
                    { device: '🤖 扫地机器人', action: '自动开始清扫' },
                    { device: '📹 摄像机', action: '开启安保监控模式' }
                ],
                description: '出门无忧，自动节能与安防'
            },
            {
                id: 'wakeup',
                keywords: ['起床', '唤醒', '早上', '晨起', '闹钟', '早安'],
                sceneName: '🌅 晨间唤醒模式',
                deviceIds: ['ceiling_lamp', 'curtain_motor', 'ai_speaker'],
                actions: [
                    { device: '💡 吸顶灯', action: '模拟日出，渐亮模式' },
                    { device: '🪟 窗帘', action: '自动缓缓拉开' },
                    { device: '🔊 音箱', action: '播放轻柔音乐或新闻' }
                ],
                description: '自然唤醒，开启美好一天'
            },
            {
                id: 'come_home',
                keywords: ['回家', '进门', '到家', '欢迎', '开门'],
                sceneName: '🏠 智能回家模式',
                deviceIds: ['door_sensor', 'ceiling_lamp', 'aircon_partner'],
                actions: [
                    { device: '🚪 门窗传感器', action: '检测开门动作' },
                    { device: '💡 吸顶灯', action: '自动开启温馨灯光' },
                    { device: '❄️ 空调伴侣', action: '夏天提前制冷/冬天预热' }
                ],
                description: '回家的瞬间，舒适环境已就绪'
            }
        ];

        function setInput(text) {
            document.getElementById('userInput').value = text;
        }

        function matchByRules(input) {
            const lowerInput = input.toLowerCase();
            for (const rule of ruleLibrary) {
                for (const keyword of rule.keywords) {
                    if (lowerInput.includes(keyword.toLowerCase())) {
                        return rule;
                    }
                }
            }
            return null;
        }

        function getRandomDevices(count = 3) {
            const deviceIds = Object.keys(deviceLibrary);
            const shuffled = deviceIds.sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function generateAIPlan() {
            const randomDeviceIds = getRandomDevices(Math.floor(Math.random() * 3) + 2);
            const devices = randomDeviceIds.map(id => ({
                id,
                ...deviceLibrary[id]
            }));

            const actions = devices.map(device => {
                const actionMap = {
                    '照明设备': '自动调节到舒适亮度',
                    '传感器': '实时监测环境变化',
                    '空调设备': '自动调节室内温度',
                    '窗帘设备': '根据光线自动开合',
                    '电源设备': '远程控制开关',
                    '音频设备': '播放音乐或语音播报',
                    '环境设备': '自动调节室内湿度/空气质量'
                };
                return {
                    device: `${device.icon} ${device.name}`,
                    action: actionMap[device.category] || '执行智能联动'
                };
            });

            return {
                sceneName: '🤖 AI智能推荐方案',
                devices,
                actions,
                source: 'local_ai',
                description: '根据您的需求，AI智能匹配的最佳设备组合'
            };
        }

        function calculateTotalPrice(devices) {
            return devices.reduce((sum, device) => sum + device.price, 0);
        }

        function generatePlan() {
            const input = document.getElementById('userInput').value.trim();
            
            if (!input) {
                alert('请输入您的智能家居需求');
                return;
            }

            const resultsDiv = document.getElementById('results');
            
            let matchedRule = matchByRules(input);
            let plan;

            if (matchedRule) {
                // 命中规则
                const devices = matchedRule.deviceIds.map(id => ({
                    id,
                    ...deviceLibrary[id]
                }));

                plan = {
                    sceneName: matchedRule.sceneName,
                    devices,
                    actions: matchedRule.actions,
                    source: 'local_rules',
                    description: matchedRule.description
                };
            } else {
                // 未命中，使用AI模拟
                plan = generateAIPlan();
            }

            // 渲染结果
            renderResults(plan);
        }

        function renderResults(plan) {
            // 场景名称
            document.getElementById('sceneTitle').textContent = plan.sceneName;
            
            // 来源标签
            const sourceTag = document.getElementById('sourceTag');
            if (plan.source === 'local_rules') {
                sourceTag.textContent = '⚡ 本地规则引擎';
                sourceTag.style.background = 'linear-gradient(135deg, #4CAF50 0%, #45a049 100%)';
            } else {
                sourceTag.textContent = '🤖 本地AI模拟';
                sourceTag.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
            }

            // 设备卡片
            const deviceGrid = document.getElementById('deviceGrid');
            deviceGrid.innerHTML = plan.devices.map(device => `
                <div class="device-card">
                    <div class="device-icon">${device.icon}</div>
                    <div class="device-name">${device.name}</div>
                    <div class="device-info">📂 ${device.category}</div>
                    <div class="device-price">¥${device.price}</div>
                    ${device.gateway ? '<span class="gateway-tag">⚡ 需网关</span>' : ''}
                </div>
            `).join('');

            // 自动化动作
            const actionsList = document.getElementById('actionsList');
            actionsList.innerHTML = plan.actions.map(action => `
                <div class="action-item">
                    <span>${action.device}</span>
                    <span class="arrow">→</span>
                    <span>${action.action}</span>
                </div>
            `).join('');

            // 总价
            const totalPrice = calculateTotalPrice(plan.devices);
            document.getElementById('totalPrice').textContent = `¥${totalPrice}`;

            // 显示结果
            document.getElementById('results').classList.add('show');

            // 滚动到结果
            document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 页面加载时自动执行一次
        window.onload = function() {
            setTimeout(() => {
                generatePlan();
            }, 500);
        };
    </script>
</body>
</html>
