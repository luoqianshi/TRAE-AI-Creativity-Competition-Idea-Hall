<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>公益课筛子</title>
  <style>
    :root {
      --bg-primary: #fdfaf3;
      --bg-card: #ffffff;
      --text-primary: #333333;
      --text-secondary: #666666;
      --accent: #4a6fa5;
      --accent-light: #e67e22;
      --border: #e0d6c9;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      --radius: 12px;
      --transition: all 0.3s ease;
    }

    .dark-theme {
      --bg-primary: #1e293b;
      --bg-card: #2d3748;
      --text-primary: #f1f5f9;
      --text-secondary: #a1aec7;
      --accent: #60a5fa;
      --accent-light: #f97316;
      --border: #475569;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 24px 0;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
    }

    .input-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 32px;
      border: 1px solid var(--border);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 0.95rem;
    }

    input[type="text"] {
      padding: 14px 16px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-primary);
      transition: var(--transition);
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.1);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover:not(:disabled) {
      background: #3a5a8c;
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .results-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 24px 0 16px;
      color: var(--text-primary);
    }

    .results-grid {
      display: grid;
      gap: 16px;
    }

    .course-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: var(--transition);
    }

    .course-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .course-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.7);
    }

    .course-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0;
      color: var(--text-primary);
      flex: 1;
      word-break: break-word;
    }

    .platform-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f8ff;
      color: #2563eb;
      padding: 4px 10px;
      font-size: 0.75rem;
      border-radius: 20px;
      font-weight: 600;
      margin-left: 8px;
    }

    .platform-tag i {
      font-size: 0.8rem;
      color: #2563eb;
    }

    .course-meta {
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .status-ok {
      background: #ecfdf5;
      color: #047857;
    }

    .status-pending {
      background: #fef9c3;
      color: #92400e;
    }

    .action-row {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.7);
    }

    .btn-link {
      background: none;
      border: none;
      color: var(--accent);
      font-weight: 600;
      padding: 6px 12px;
      font-size: 0.9rem;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-link:hover:not(:disabled) {
      background: rgba(74, 111, 165, 0.1);
      color: #2563eb;
    }

    .btn-favorite {
      background: none;
      border: none;
      color: #ccc;
      font-size: 1.2rem;
      cursor: pointer;
      transition: var(--transition);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .btn-favorite.favorited {
      color: var(--accent-light);
      background: rgba(230, 126, 34, 0.1);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }

    .empty-state p {
      margin-top: 12px;
      font-size: 1rem;
    }

    .theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: var(--transition);
      font-size: 1.2rem;
    }

    .theme-toggle:hover:not(:disabled) {
      transform: scale(1.05);
      background: #3a5a8c;
    }

    footer {
      text-align: center;
      padding: 24px 0;
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-top: 40px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .input-section {
        padding: 18px;
      }
      .course-header,
      .course-meta,
      .action-row {
        padding: 14px 16px;
      }
      .course-title {
        font-size: 1rem;
      }
      .platform-tag {
        font-size: 0.7rem;
        padding: 3px 8px;
      }
      .meta-item {
        font-size: 0.8rem;
      }
      .btn-favorite {
        width: 32px;
        height: 32px;
      }
    }

    /* Animation for theme toggle */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    .theme-toggle.anim {
      animation: fadeIn 0.3s ease-out;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>公益课筛子</h1>
      <p class="subtitle">输入您想学的内容（比如“零基础学Excel做工资表”），3秒筛出全网真实可播的免费课</p>
    </header>

    <section class="input-section">
      <div class="input-group">
        <label for="search-input">您想学什么？</label>
        <input type="text" id="search-input" placeholder="例如：教老人用微信视频通话、学做家常川菜、考会计初级证入门" />
        <button id="search-btn">
          <span>🔍 找课</span>
        </button>
      </div>
    </section>

    <section id="results-section">
      <h2 class="results-title">为您找到的公益课</h2>
      <div class="results-grid" id="results-grid">
        <div class="empty-state">
          <div>📝</div>
          <h3>还没开始找课呢</h3>
          <p>在上方输入您的学习需求，点击“找课”即可获取推荐</p>
        </div>
      </div>
    </section>

    <footer>
      <p>所有课程均来自教育部国家智慧教育平台、各省市开放大学、央视网银龄课堂等已上线公益资源 | 链接实时验证有效</p>
    </footer>
  </div>

  <button class="theme-toggle" id="theme-toggle" aria-label="切换深色/浅色模式">☀️</button>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('theme-toggle');
    const body = document.body;

    function setTheme(isDark) {
      if (isDark) {
        body.classList.add('dark-theme');
        themeToggle.innerHTML = '🌙';
      } else {
        body.classList.remove('dark-theme');
        themeToggle.innerHTML = '☀️';
      }
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // 初始化主题
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      setTheme(true);
    } else {
      setTheme(false);
    }

    themeToggle.addEventListener('click', () => {
      const isDark = body.classList.contains('dark-theme');
      setTheme(!isDark);
    });

    // 模拟课程数据（真实场景由TRAE Work API返回）
    const mockCourses = [
      {
        title: "手把手教老人用微信视频通话",
        platform: "上海开放大学",
        duration: "12分钟",
        subtitle: "✅ 有中文字幕",
        updated: "2024-05",
        status: "ok",
        url: "https://www.shou.edu.cn/course?keyword=%E5%BE%AE%E4%BF%A1%E8%A7%86%E9%A2%91"
      },
      {
        title: "零基础学会做3道家常川菜",
        platform: "四川社区教育网",
        duration: "28分钟",
        subtitle: "✅ 有字幕 & 练习清单",
        updated: "2024-03",
        status: "ok",
        url: "https://scsjy.com/course?k=%E5%B7%9D%E8%8F%9C"
      },
      {
        title: "会计初级考试入门精讲（2024新版）",
        platform: "国家智慧教育平台",
        duration: "45分钟",
        subtitle: "✅ 全字幕 + 配套习题",
        updated: "2024-06",
        status: "ok",
        url: "https://www.zhihuishu.com/course?kw=%E4%BC%9A%E8%AE%A1%E5%88%9D%E7%BA%A7"
      }
    ];

    // 收藏状态管理（sessionStorage）
    function getFavorites() {
      const favs = sessionStorage.getItem('favorites');
      return favs ? JSON.parse(favs) : [];
    }

    function saveFavorites(ids) {
      sessionStorage.setItem('favorites', JSON.stringify(ids));
    }

    // 渲染课程列表
    function renderResults(courses) {
      const grid = document.getElementById('results-grid');
      if (courses.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div>🔍</div>
            <h3>没找到匹配的课程</h3>
            <p>请尝试更口语化的描述，比如“怎么教爸妈用抖音看孙子”</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = courses.map((course, idx) => {
        const isFavorited = getFavorites().includes(idx);
        return `
          <article class="course-card">
            <div class="course-header">
              <h3 class="course-title">${course.title}</h3>
              <span class="platform-tag">${course.platform}</span>
            </div>
            <div class="course-meta">
              <div class="meta-item">⏱️ ${course.duration}</div>
              <div class="meta-item">${course.subtitle}</div>
              <div class="meta-item">🔄 ${course.updated}</div>
              <div class="meta-item">
                <span class="status-badge status-ok">✅ 可播放</span>
              </div>
            </div>
            <div class="action-row">
              <button class="btn-link" onclick="window.open('${course.url}', '_blank')">
                ▶️ 去学习
              </button>
              <button class="btn-favorite ${isFavorited ? 'favorited' : ''}" data-index="${idx}" onclick="toggleFavorite(${idx})">
                ⭐
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    // 搜索逻辑
    const searchBtn = document.getElementById('search-btn');
    const searchInput = document.getElementById('search-input');

    searchBtn.addEventListener('click', () => {
      const query = searchInput.value.trim();
      if (!query) return;

      // 模拟API延迟
      searchBtn.disabled = true;
      searchBtn.innerHTML = '<span>⏳ 筛选中...</span>';

      setTimeout(() => {
        // 简单关键词匹配（演示用）
        const matched = mockCourses.filter(course =>
          course.title.includes(query) ||
          course.platform.includes(query) ||
          query.toLowerCase().includes('微信') && course.title.includes('微信') ||
          query.toLowerCase().includes('会计') && course.title.includes('会计')
        );

        renderResults(matched.length > 0 ? matched : mockCourses.slice(0, 3));
        searchBtn.disabled = false;
        searchBtn.innerHTML = '<span>🔍 找课</span>';
      }, 800);
    });

    // 回车触发搜索
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchBtn.click();
      }
    });

    // 收藏切换
    window.toggleFavorite = function(index) {
      const favorites = getFavorites();
      const btn = document.querySelector(`[data-index="${index}"]`);
      if (favorites.includes(index)) {
        const newFavs = favorites.filter(i => i !== index);
        saveFavorites(newFavs);
        btn.classList.remove('favorited');
      } else {
        favorites.push(index);
        saveFavorites(favorites);
        btn.classList.add('favorited');
      }
    };

    // 初始化空态
    renderResults([]);
  </script>
</body>
</html>
