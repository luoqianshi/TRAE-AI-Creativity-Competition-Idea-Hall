<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生理期记录</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .person-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .person-card h3 { margin-top: 0; color: #333; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; }
        .input-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
        .btn { background: #ff6b6b; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #ee5253; }
        .btn-add { background: #48dbfb; }
        .btn-add:hover { background: #0abde3; }
        .btn-delete { background: #ff9ff3; }
        .btn-delete:hover { background: #f368e0; }
        .period-info { margin-top: 10px; padding: 10px; background: #fff3cd; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>生理期记录</h1>
    <button class="btn btn-add" onclick="addPerson()">+ 添加新档案</button>
    <div id="persons-container"></div>

    <script>
        const STORAGE_KEY = 'period_records';
        
        function loadData() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [
                { id: 1, name: '女朋友', lastPeriod: '', cycle: 28, duration: 5 }
            ];
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function calculateNextPeriod(lastPeriod, cycle) {
            if (!lastPeriod) return '请输入上次生理期日期';
            const date = new Date(lastPeriod);
            date.setDate(date.getDate() + parseInt(cycle));
            return date.toISOString().split('T')[0];
        }

        function render() {
            const data = loadData();
            const container = document.getElementById('persons-container');
            container.innerHTML = data.map(person => `
                <div class="person-card" data-id="${person.id}">
                    <h3>${person.name} <button class="btn btn-delete" onclick="deletePerson(${person.id})">删除</button></h3>
                    <div class="input-group">
                        <label>上次生理期日期：</label>
                        <input type="date" value="${person.lastPeriod}" onchange="updateField(${person.id}, 'lastPeriod', this.value)">
                    </div>
                    <div class="input-group">
                        <label>周期天数（默认28天）：</label>
                        <input type="number" value="${person.cycle}" onchange="updateField(${person.id}, 'cycle', this.value)">
                    </div>
                    <div class="input-group">
                        <label>经期天数（默认5天）：</label>
                        <input type="number" value="${person.duration}" onchange="updateField(${person.id}, 'duration', this.value)">
                    </div>
                    <div class="period-info">
                        <strong>下次生理期预计：</strong>${calculateNextPeriod(person.lastPeriod, person.cycle)}
                    </div>
                </div>
            `).join('');
        }

        function addPerson() {
            const data = loadData();
            const newPerson = {
                id: Date.now(),
                name: `档案${data.length + 1}`,
                lastPeriod: '',
                cycle: 28,
                duration: 5
            };
            data.push(newPerson);
            saveData(data);
            render();
        }

        function deletePerson(id) {
            const data = loadData().filter(p => p.id !== id);
            saveData(data);
            render();
        }

        function updateField(id, field, value) {
            const data = loadData().map(p => p.id === id ? { ...p, [field]: value } : p);
            saveData(data);
            render();
        }

        render();
    </script>
</body>
</html>
