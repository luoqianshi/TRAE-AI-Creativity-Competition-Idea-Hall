
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>漂流租房</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 自定义样式补充 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 隐藏滚动条但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 页面切换动画 */
        .page {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 模拟手机容器 (仅在桌面端显示限制，移动端全屏) */
        @media (min-width: 768px) {
            #app-container {
                max-width: 414px; /* iPhone Max width */
                margin: 0 auto;
                min-height: 100vh;
                box-shadow: 0 0 20px rgba(0,0,0,0.1);
                position: relative;
                background: white;
            }
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }

        .tag-active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

<div id="app-container" class="bg-white min-h-screen flex flex-col relative overflow-hidden">

    <!-- ================= 页面 1: 欢迎页 ================= -->
    <div id="page-welcome" class="page active h-full flex flex-col justify-center items-center p-6 bg-gradient-to-br from-blue-500 to-indigo-600 text-white">
        <div class="mb-12 text-center">
            <i class="fa-solid fa-house-chimney-user text-6xl mb-4 opacity-90"></i>
            <h1 class="text-4xl font-bold tracking-wider mb-2">漂流租房</h1>
            <p class="text-blue-100 text-sm">让每一次停留都成为温暖的归宿</p>
        </div>

        <div class="w-full max-w-xs space-y-4">
            <!-- 城市定位/选择 -->
            <div class="bg-white/20 backdrop-blur-md rounded-xl p-4 border border-white/30">
                <label class="block text-xs text-blue-100 mb-1 uppercase tracking-wide">当前城市</label>
                <div class="flex items-center justify-between">
                    <span id="current-city-display" class="text-xl font-semibold truncate">正在定位...</span>
                    <button onclick="toggleCitySelector()" class="text-white hover:text-blue-200 transition">
                        <i class="fa-solid fa-location-dot"></i> 切换
                    </button>
                </div>
            </div>

            <!-- 城市选择模态框 (简化版，直接嵌入) -->
            <div id="city-selector" class="hidden mt-4 bg-white rounded-lg shadow-xl p-4 text-gray-800 max-h-60 overflow-y-auto">
                <h3 class="font-bold mb-2 text-sm text-gray-500">热门城市</h3>
                <div class="grid grid-cols-3 gap-2 text-sm">
                    <button onclick="selectCity('北京')" class="p-2 hover:bg-blue-50 rounded text-left">北京</button>
                    <button onclick="selectCity('上海')" class="p-2 hover:bg-blue-50 rounded text-left">上海</button>
                    <button onclick="selectCity('广州')" class="p-2 hover:bg-blue-50 rounded text-left">广州</button>
                    <button onclick="selectCity('深圳')" class="p-2 hover:bg-blue-50 rounded text-left">深圳</button>
                    <button onclick="selectCity('杭州')" class="p-2 hover:bg-blue-50 rounded text-left">杭州</button>
                    <button onclick="selectCity('成都')" class="p-2 hover:bg-blue-50 rounded text-left">成都</button>
                </div>
            </div>

            <button id="enter-btn" onclick="goToPage('page-home')" disabled class="w-full bg-white text-blue-600 font-bold py-3 px-6 rounded-full shadow-lg hover:bg-blue-50 transition transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed mt-8">
                进入首页
            </button>
        </div>
        
        <div class="absolute bottom-6 text-xs text-blue-200">
            &copy; 2026 漂流租房
        </div>
    </div>

    <!-- ================= 页面 2: 列表与筛选页 ================= -->
    <div id="page-home" class="page h-full flex flex-col bg-gray-50">
        <!-- 顶部导航 -->
        <header class="bg-white shadow-sm z-10 sticky top-0">
            <div class="flex items-center justify-between px-4 py-3">
                <div class="flex items-center space-x-2" onclick="goToPage('page-welcome')">
                    <i class="fa-solid fa-chevron-left text-gray-500"></i>
                    <span id="header-city" class="font-bold text-lg">北京</span>
                </div>
                <div class="text-sm font-medium text-gray-600">漂流租房</div>
                <button onclick="toggleFilterPanel()" class="text-blue-600">
                    <i class="fa-solid fa-filter"></i> 筛选
                </button>
            </div>
            
            <!-- 筛选面板 (默认隐藏，点击展开) -->
            <div id="filter-panel" class="hidden bg-white border-t border-gray-100 p-4 shadow-inner overflow-y-auto max-h-[40vh] no-scrollbar">
                <!-- 筛选组：区县 -->
                <div class="mb-4">
                    <h4 class="text-xs font-bold text-gray-400 mb-2 uppercase">区县</h4>
                    <div class="flex flex-wrap gap-2" id="filter-district">
                        <!-- JS 生成 -->
                    </div>
                </div>
                <!-- 筛选组：地铁线 -->
                <div class="mb-4">
                    <h4 class="text-xs font-bold text-gray-400 mb-2 uppercase">地铁线</h4>
                    <div class="flex flex-wrap gap-2" id="filter-subway">
                        <!-- JS 生成 -->
                    </div>
                </div>
                <!-- 筛选组：房屋性质 -->
                <div class="mb-4">
                    <h4 class="text-xs font-bold text-gray-400 mb-2 uppercase">房屋性质</h4>
                    <div class="flex flex-wrap gap-2" id="filter-type">
                        <button class="filter-tag px-3 py-1 text-xs border rounded-full" data-key="type" data-val="小区">小区</button>
                        <button class="filter-tag px-3 py-1 text-xs border rounded-full" data-key="type" data-val="公寓">公寓</button>
                        <button class="filter-tag px-3 py-1 text-xs border rounded-full" data-key="type" data-val="楼房">楼房</button>
                        <button class="filter-tag px-3 py-1 text-xs border rounded-full" data-key="type" data-val="别墅">别墅</button>
                        <button class="filter-tag px-3 py-1 text-xs border rounded-full" data-key="type" data-val="青旅">青旅</button>
                    </div>
                </div>
                <!-- 筛选组：楼龄 -->
                <div class="mb-4">
                    <h4 class="text-xs font-bold text-gray-400 mb-2 uppercase">楼龄</h4>
                    <div class="flex flex-wrap gap-2" id="filter-age">
                        <button class="filter-tag px-3 py-1 text-xs border rounded-full" data-key="age" data-val="5年内">5年内</button>
                        <button class="filter-tag px-3 py-1 text-xs border rounded-full" data-key="age" data-val="5-10年">5-10年</button>
                        <button class="filter-tag px-3 py-1 text-xs border rounded-full" data-key="age" data-val="10-20年">10-20年</button>
                        <button class="filter-tag px-3 py-1 text-xs border rounded-full" data-key="age" data-val="20年以上">20年以上</button>
                    </div>
                </div>
                <!-- 筛选组：租房性质 -->
                <div class="mb-2">
                    <h4 class="text-xs font-bold text-gray-400 mb-2 uppercase">租房性质</h4>
                    <div class="flex flex-wrap gap-2" id="filter-rent-type">
                        <button class="filter-tag px-3 py-1 text-xs border rounded-full" data-key="rentType" data-val="整租">整租</button>
                        <button class="filter-tag px-3 py-1 text-xs border rounded-full" data-key="rentType" data-val="合租">合租</button>
                    </div>
                </div>
                
                <div class="mt-4 flex gap-2">
                    <button onclick="resetFilters()" class="flex-1 py-2 text-sm text-gray-500 border rounded-lg">重置</button>
                    <button onclick="applyFilters()" class="flex-1 py-2 text-sm bg-blue-600 text-white rounded-lg shadow-md">确认筛选</button>
                </div>
            </div>
        </header>

        <!-- 房屋列表区域 -->
        <main class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar" id="house-list-container">
            <!-- 列表项由 JS 动态生成 -->
        </main>
        
        <!-- 底部提示 -->
        <div class="py-2 text-center text-xs text-gray-400 bg-gray-50">
            已加载全部房源
        </div>
    </div>

    <!-- ================= 页面 3: 详情页 ================= -->
    <div id="page-detail" class="page h-full flex flex-col bg-white">
        <!-- 顶部返回栏 -->
        <header class="absolute top-0 left-0 right-0 z-20 p-4 flex justify-between items-start bg-gradient-to-b from-black/50 to-transparent">
            <button onclick="goToPage('page-home')" class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center text-white hover:bg-white/30 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="flex space-x-3">
                <button onclick="toggleBlacklist()" id="btn-blacklist" class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center text-white hover:bg-red-500/80 transition">
                    <i class="fa-solid fa-user-slash"></i>
                </button>
                <button onclick="toggleFavorite()" id="btn-favorite" class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center text-white hover:bg-red-500/80 transition">
                    <i class="fa-regular fa-heart"></i>
                </button>
            </div>
        </header>

        <!-- 图片轮播区 (简化为单张大图+指示器) -->
        <div class="relative h-72 bg-gray-200 shrink-0">
            <img id="detail-image" src="" alt="房屋详情主图" class="w-full h-full object-cover">
            <div class="absolute bottom-4 right-4 bg-black/60 text-white text-xs px-2 py-1 rounded">
                1 / 5
            </div>
        </div>

        <!-- 内容滚动区 -->
        <main class="flex-1 overflow-y-auto no-scrollbar pb-20">
            <div class="p-5">
                <!-- 标题与价格 -->
                <div class="flex justify-between items-start mb-2">
                    <h2 id="detail-title" class="text-xl font-bold text-gray-800 leading-tight w-3/4">精致一居室，阳光充足</h2>
                    <div class="text-right">
                        <span id="detail-price" class="text-2xl font-bold text-red-500">4500</span>
                        <span class="text-sm text-gray-500">元/月</span>
                    </div>
                </div>
                
                <!-- 标签 -->
                <div class="flex flex-wrap gap-2 mb-4" id="detail-tags">
                    <!-- JS 填充 -->
                </div>

                <!-- 租户体验描述 -->
                <div class="bg-blue-50 p-4 rounded-xl mb-6 border border-blue-100">
                    <h3 class="text-sm font-bold text-blue-800 mb-2"><i class="fa-solid fa-comment-dots mr-1"></i> 租户体验</h3>
                    <p id="detail-desc" class="text-sm text-gray-600 leading-relaxed">
                        这里非常安静，适合居家办公。房东人很好，响应速度快。楼下就是便利店，生活非常方便。
                    </p>
                </div>

                <!-- 租房事项 -->
                <div class="mb-6">
                    <h3 class="text-base font-bold text-gray-800 mb-3 border-l-4 border-blue-500 pl-2">租房事项</h3>
                    <ul class="space-y-2 text-sm text-gray-600">
                        <li class="flex items-center"><i class="fa-solid fa-check text-green-500 w-6"></i> 押一付三，半年起租</li>
                        <li class="flex items-center"><i class="fa-solid fa-check text-green-500 w-6"></i> 民水民电，燃气自缴</li>
                        <li class="flex items-center"><i class="fa-solid fa-check text-green-500 w-6"></i> 禁止宠物，保持卫生</li>
                        <li class="flex items-center"><i class="fa-solid fa-check text-green-500 w-6"></i> 随时看房，提前预约</li>
                    </ul>
                </div>

                <!-- 更多图片缩略图 -->
                <div class="mb-6">
                    <h3 class="text-base font-bold text-gray-800 mb-3 border-l-4 border-blue-500 pl-2">更多实拍</h3>
                    <div class="grid grid-cols-4 gap-2">
                        <img src="https://picsum.photos/200/200?random=10" alt="房屋细节图1" class="w-full h-16 object-cover rounded-lg">
                        <img src="https://picsum.photos/200/200?random=11" alt="房屋细节图2" class="w-full h-16 object-cover rounded-lg">
                        <img src="https://picsum.photos/200/200?random=12" alt="房屋细节图3" class="w-full h-16 object-cover rounded-lg">
                        <img src="https://picsum.photos/200/200?random=13" alt="房屋细节图4" class="w-full h-16 object-cover rounded-lg">
                    </div>
                </div>
            </div>
        </main>

        <!-- 底部联系栏 -->
        <footer class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-100 p-4 shadow-lg flex items-center justify-between z-20">
            <div class="flex flex-col">
                <span class="text-xs text-gray-500">联系人: <span id="detail-contact-name">张先生</span></span>
                <div class="flex items-center space-x-3 mt-1">
                    <button onclick="copyContact('phone')" class="flex items-center text-sm font-bold text-gray-800 hover:text-blue-600">
                        <i class="fa-solid fa-phone mr-1 text-blue-500"></i> <span id="detail-phone">138****1234</span>
                    </button>
                    <button onclick="copyContact('wechat')" class="flex items-center text-sm font-bold text-gray-800 hover:text-green-600">
                        <i class="fa-brands fa-weixin mr-1 text-green-500"></i> 微信
                    </button>
                </div>
            </div>
            <button onclick="alert('已发起在线聊天请求')" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold shadow-md hover:bg-blue-700 transition">
                在线咨询
            </button>
        </footer>
    </div>

</div>

<script>
    // ================= 数据模拟 =================
    const cities = {
        "北京": {
            districts: ["朝阳区", "海淀区", "东城区", "西城区", "昌平区"],
            subways: ["1号线", "2号线", "5号线", "10号线", "13号线"]
        },
        "上海": {
            districts: ["浦东新区", "黄浦区", "徐汇区", "长宁区", "静安区"],
            subways: ["1号线", "2号线", "7号线", "10号线", "13号线"]
        },
        "深圳": {
            districts: ["南山区", "福田区", "罗湖区", "宝安区", "龙岗区"],
            subways: ["1号线", "2号线", "5号线", "7号线", "11号线"]
        }
    };

    // 生成模拟房源数据
    function generateMockHouses(city) {
        const types = ["小区", "公寓", "楼房", "别墅", "青旅"];
        const ages = ["5年内", "5-10年", "10-20年", "20年以上"];
        const rentTypes = ["整租", "合租"];
        const descs = [
            "房间采光极好，早晨阳光洒满床铺，心情愉悦。",
            "楼下就是地铁站，通勤非常方便，适合上班族。",
            "小区环境安静，绿化率高，适合喜欢散步的人。",
            "装修现代简约，家具齐全，拎包入住无压力。",
            "室友都是年轻人，好相处，公共区域保持整洁。"
        ];
        
        let houses = [];
        const cityData = cities[city] || cities["北京"];
        
        for (let i = 1; i <= 20; i++) {
            houses.push({
                id: i,
                title: `${cityData.districts[i % cityData.districts.length]} ${types[i % types.length]}精装${rentTypes[i % rentTypes.length]}`,
                price: Math.floor(Math.random() * 5000) + 2000,
                district: cityData.districts[i % cityData.districts.length],
                subway: cityData.subways[i % cityData.subways.length],
                type: types[i % types.length],
                age: ages[i % ages.length],
                rentType: rentTypes[i % rentTypes.length],
                image: `https://picsum.photos/400/300?random=${i}`,
                desc: descs[i % descs.length],
                contactName: ["王先生", "李女士", "张经理", "赵阿姨"][i % 4],
                phone: `138${String(Math.floor(Math.random()*100000000)).padStart(8,'0')}`,
                isFavorite: false,
                isBlacklisted: false
            });
        }
        return houses;
    }

    // ================= 状态管理 =================
    let state = {
        currentCity: "北京",
        filters: {
            district: "",
            subway: "",
            type: "",
            age: "",
            rentType: ""
        },
        houses: [],
        currentHouseId: null
    };

    // ================= 初始化 =================
    window.onload = function() {
        initWelcomePage();
    };

    function initWelcomePage() {
        // 模拟自动定位
        setTimeout(() => {
            document.getElementById('current-city-display').innerText = state.currentCity;
            document.getElementById('enter-btn').disabled = false;
        }, 800);
    }

    function selectCity(city) {
        state.currentCity = city;
        document.getElementById('current-city-display').innerText = city;
        document.getElementById('city-selector').classList.add('hidden');
        document.getElementById('enter-btn').disabled = false;
    }

    function toggleCitySelector() {
        const el = document.getElementById('city-selector');
        el.classList.toggle('hidden');
    }

    // ================= 页面导航 =================
    function goToPage(pageId) {
        // 隐藏所有页面
        document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
        // 显示目标页面
        document.getElementById(pageId).classList.add('active');

        if (pageId === 'page-home') {
            document.getElementById('header-city').innerText = state.currentCity;
            // 如果房子列表为空或城市改变，重新加载
            if (state.houses.length === 0) {
                loadHouses();
            }
            renderHouseList();
        }
    }

    // ================= 首页逻辑 (筛选与列表) =================
    function loadHouses() {
        state.houses = generateMockHouses(state.currentCity);
        initFilterOptions();
    }

    function initFilterOptions() {
        const cityData = cities[state.currentCity] || cities["北京"];
        
        // 渲染区县筛选
        const distContainer = document.getElementById('filter-district');
        distContainer.innerHTML = cityData.districts.map(d => 
            `<button class="filter-tag px-3 py-1 text-xs border rounded-full" data-key="district" data-val="${d}">${d}</button>`
        ).join('');

        // 渲染地铁筛选
        const subContainer = document.getElementById('filter-subway');
        subContainer.innerHTML = cityData.subways.map(s => 
            `<button class="filter-tag px-3 py-1 text-xs border rounded-full" data-key="subway" data-val="${s}">${s}</button>`
        ).join('');

        // 绑定所有筛选标签点击事件
        document.querySelectorAll('.filter-tag').forEach(btn => {
            btn.addEventListener('click', function() {
                const key = this.dataset.key;
                const val = this.dataset.val;
                
                // 同组互斥
                const siblings = this.parentElement.querySelectorAll('.filter-tag');
                siblings.forEach(sib => sib.classList.remove('tag-active'));
                
                // 如果点击已选中的，则取消选择
                if (state.filters[key] === val) {
                    state.filters[key] = "";
                } else {
                    this.classList.add('tag-active');
                    state.filters[key] = val;
                }
            });
        });
    }

    function toggleFilterPanel() {
        document.getElementById('filter-panel').classList.toggle('hidden');
    }

    function resetFilters() {
        state.filters = { district: "", subway: "", type: "", age: "", rentType: "" };
        document.querySelectorAll('.filter-tag').forEach(btn => btn.classList.remove('tag-active'));
        applyFilters();
    }

    function applyFilters() {
        document.getElementById('filter-panel').classList.add('hidden');
        renderHouseList();
    }

    function renderHouseList() {
        const container = document.getElementById('house-list-container');
        container.innerHTML = '';

        const filtered = state.houses.filter(h => {
            return (!state.filters.district || h.district === state.filters.district) &&
                   (!state.filters.subway || h.subway === state.filters.subway) &&
                   (!state.filters.type || h.type === state.filters.type) &&
                   (!state.filters.age || h.age === state.filters.age) &&
                   (!state.filters.rentType || h.rentType === state.filters.rentType);
        });

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-10 text-gray-400">
                    <i class="fa-regular fa-folder-open text-4xl mb-2"></i>
                    <p>暂无符合条件的房源</p>
                </div>
            `;
            return;
        }

        filtered.forEach(house => {
            const card = document.createElement('div');
            card.className = "bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex hover:shadow-md transition cursor-pointer";
            card.onclick = () => showDetail(house.id);
            
            card.innerHTML = `
                <div class="w-32 h-32 shrink-0">
                    <img src="${house.image}" alt="${house.title}" class="w-full h-full object-cover">
                </div>
                <div class="p-3 flex flex-col justify-between flex-1">
                    <div>
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-gray-800 text-sm line-clamp-1">${house.title}</h3>
                            <span class="text-red-500 font-bold text-sm">¥${house.price}</span>
                        </div>
                        <div class="flex gap-1 mt-1">
                            <span class="text-[10px] bg-blue-50 text-blue-600 px-1 rounded">${house.rentType}</span>
                            <span class="text-[10px] bg-gray-100 text-gray-500 px-1 rounded">${house.district}</span>
                        </div>
                    </div>
                    <p class="text-xs text-gray-500 line-clamp-2 mt-2 bg-gray-50 p-1 rounded">
                        "${house.desc}"
                    </p>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // ================= 详情页逻辑 =================
    function showDetail(id) {
        const house = state.houses.find(h => h.id === id);
        if (!house) return;

        state.currentHouseId = id;

        // 填充数据
        document.getElementById('detail-image').src = house.image;
        document.getElementById('detail-image').alt = house.title;
        document.getElementById('detail-title').innerText = house.title;
        document.getElementById('detail-price').innerText = house.price;
        document.getElementById('detail-desc').innerText = house.desc;
        document.getElementById('detail-contact-name').innerText = house.contactName;
        document.getElementById('detail-phone').innerText = house.phone;

        // 填充标签
        const tagsContainer = document.getElementById('detail-tags');
        tagsContainer.innerHTML = `
            <span class="px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded">${house.district}</span>
            <span class="px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded">${house.subway}</span>
            <span class="px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded">${house.type}</span>
            <span class="px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded">${house.age}</span>
        `;

        updateActionButtons(house);
        goToPage('page-detail');
    }

    function updateActionButtons(house) {
        const favBtn = document.getElementById('btn-favorite');
        const blackBtn = document.getElementById('btn-blacklist');
        
        if (house.isFavorite) {
            favBtn.innerHTML = '<i class="fa-solid fa-heart"></i>';
            favBtn.classList.add('bg-red-500/80');
        } else {
            favBtn.innerHTML = '<i class="fa-regular fa-heart"></i>';
            favBtn.classList.remove('bg-red-500/80');
        }

        if (house.isBlacklisted) {
            blackBtn.innerHTML = '<i class="fa-solid fa-user-slash"></i>';
            blackBtn.classList.add('bg-gray-800/80');
        } else {
            blackBtn.innerHTML = '<i class="fa-regular fa-user-slash"></i>'; // FontAwesome regular might not exist for this specific icon, using solid for visual consistency or switching class
            blackBtn.classList.remove('bg-gray-800/80');
        }
    }

    function toggleFavorite() {
        const house = state.houses.find(h => h.id === state.currentHouseId);
        if (house) {
            house.isFavorite = !house.isFavorite;
            updateActionButtons(house);
            // 简单提示
            showToast(house.isFavorite ? "已加入收藏" : "已取消收藏");
        }
    }

    function toggleBlacklist() {
        const house = state.houses.find(h => h.id === state.currentHouseId);
        if (house) {
            house.isBlacklisted = !house.isBlacklisted;
            updateActionButtons(house);
            showToast(house.isBlacklisted ? "已加入黑名单" : "已移出黑名单");
        }
    }

    function copyContact(type) {
        const house = state.houses.find(h => h.id === state.currentHouseId);
        if (type === 'phone') {
            navigator.clipboard.writeText(house.phone).then(() => {
                showToast("手机号已复制");
            });
        } else {
            showToast("微信号: drift_rent_2026 (模拟)");
        }
    }

    // ================= 工具函数 =================
    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = "fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white px-4 py-2 rounded-lg text-sm z-50 animate-bounce";
        toast.innerText = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

</script>
</body>
</html>
