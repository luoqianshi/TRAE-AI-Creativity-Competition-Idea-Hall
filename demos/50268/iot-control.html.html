<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32全屋IoT控制平台 | TRAE AI创意作品</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        success: '#10b981',
                        danger: '#ef4444',
                        dark: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; }
        .device-card { transition: all 0.2s ease; }
        .device-card:active { transform: scale(0.97); }
        .switch-btn { width: 60px; height: 32px; border-radius: 999px; position: relative; cursor: pointer; transition: 0.3s; }
        .switch-dot { width: 26px; height: 26px; background: white; border-radius: 50%; position: absolute; top: 3px; left: 3px; transition: 0.3s; }
        .switch-on { background: #10b981; }
        .switch-on .switch-dot { left: 31px; }
        .switch-off { background: #cbd5e1; }
    </style>
</head>
<body class="max-w-md mx-auto p-4 pb-20">
    <!-- 头部标题 -->
    <div class="bg-primary text-white rounded-xl p-4 shadow-lg mb-6">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fa fa-wifi"></i> ESP32智能家居IoT面板
        </h1>
        <p class="text-sm opacity-80 mt-1">TRAE AI创造力大赛 · 硬件交互赛道</p>
        <div class="flex items-center gap-2 mt-2 text-sm" id="netStatus">
            <i class="fa fa-circle text-success text-xs"></i>
            <span>设备在线</span>
        </div>
    </div>

    <!-- 全屋设备分组 -->
    <h2 class="font-bold text-dark text-lg mb-3"><i class="fa fa-home text-primary"></i> 四路继电器设备</h2>
    <div class="grid gap-4" id="deviceBox">
        <!-- 设备1 灯光 -->
        <div class="device-card bg-white rounded-xl p-4 shadow-md flex justify-between items-center">
            <div>
                <h3 class="font-semibold text-dark">客厅主灯</h3>
                <p class="text-xs text-gray-500">通道1 · 220V照明</p>
            </div>
            <div class="switch-btn switch-off" data-id="relay1" onclick="toggleRelay('relay1')">
                <div class="switch-dot"></div>
            </div>
        </div>
        <!-- 设备2 插座 -->
        <div class="device-card bg-white rounded-xl p-4 shadow-md flex justify-between items-center">
            <div>
                <h3 class="font-semibold text-dark">客厅插座</h3>
                <p class="text-xs text-gray-500">通道2 · 电视/饮水机</p>
            </div>
            <div class="switch-btn switch-off" data-id="relay2" onclick="toggleRelay('relay2')">
                <div class="switch-dot"></div>
            </div>
        </div>
        <!-- 设备3 空调 -->
        <div class="device-card bg-white rounded-xl p-4 shadow-md flex justify-between items-center">
            <div>
                <h3 class="font-semibold text-dark">卧室空调</h3>
                <p class="text-xs text-gray-500">通道3 · 大功率电器</p>
            </div>
            <div class="switch-btn switch-off" data-id="relay3" onclick="toggleRelay('relay3')">
                <div class="switch-dot"></div>
            </div>
        </div>
        <!-- 设备4 热水器 -->
        <div class="device-card bg-white rounded-xl p-4 shadow-md flex justify-between items-center">
            <div>
                <h3 class="font-semibold text-dark">电热水器</h3>
                <p class="text-xs text-gray-500">通道4 · 安全断电</p>
            </div>
            <div class="switch-btn switch-off" data-id="relay4" onclick="toggleRelay('relay4')">
                <div class="switch-dot"></div>
            </div>
        </div>
    </div>

    <!-- 快捷场景 -->
    <h2 class="font-bold text-dark text-lg mt-6 mb-3"><i class="fa fa-magic text-primary"></i> 一键场景联动</h2>
    <div class="grid grid-cols-2 gap-3">
        <button onclick="sceneHome()" class="bg-success text-white p-3 rounded-xl shadow font-medium">
            <i class="fa fa-unlock"></i> 回家全开
        </button>
        <button onclick="sceneAway()" class="bg-danger text-white p-3 rounded-xl shadow font-medium">
            <i class="fa fa-sign-out"></i> 离家全关
        </button>
    </div>

    <!-- 定时任务模块 -->
    <div class="bg-white rounded-xl p-4 shadow-md mt-6">
        <h3 class="font-bold text-dark mb-3"><i class="fa fa-clock-o text-primary"></i> 定时自动化</h3>
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="text-sm text-gray-600">开启时间</label>
                <input type="time" id="timeOn" class="w-full border rounded-lg p-2 mt-1">
            </div>
            <div>
                <label class="text-sm text-gray-600">关闭时间</label>
                <input type="time" id="timeOff" class="w-full border rounded-lg p-2 mt-1">
            </div>
        </div>
        <select id="timerTarget" class="w-full border rounded-lg p-2 mt-3">
            <option value="all">全部设备</option>
            <option value="relay1">客厅主灯</option>
            <option value="relay2">客厅插座</option>
            <option value="relay3">卧室空调</option>
            <option value="relay4">电热水器</option>
        </select>
        <button onclick="saveTimer()" class="w-full bg-primary text-white rounded-lg p-2 mt-3">保存定时规则</button>
    </div>

    <!-- 底部项目说明（参赛专用） -->
    <div class="mt-8 p-4 bg-slate-100 rounded-xl text-sm text-gray-700">
        <h4 class="font-bold mb-2">作品信息（TRAE AI创造力大赛）</h4>
        <p>主控硬件：ESP32-WROOM + 4路隔离继电器模块</p>
        <p>通信方案：WiFi+MQTT局域网/外网远程控制</p>
        <p>开发工具：TRAE Work需求梳理 + TRAE IDE生成前端页面</p>
        <p>赛道归属：硬件交互 / 造个新物种</p>
    </div>

    <script>
        // 设备状态存储（模拟ESP32硬件状态，真实环境对接MQTT websocket）
        const deviceState = {
            relay1: false,
            relay2: false,
            relay3: false,
            relay4: false
        };
        const netStatusEl = document.getElementById('netStatus');

        // 切换继电器开关
        function toggleRelay(relayId) {
            // 模拟网络断开判断
            if(Math.random() < 0.08){
                netStatusEl.innerHTML = `<i class="fa fa-circle text-danger text-xs"></i><span>设备离线，指令发送失败</span>`;
                setTimeout(()=>{
                    netStatusEl.innerHTML = `<i class="fa fa-circle text-success text-xs"></i><span>设备在线</span>`;
                },2000);
                return;
            }
            // 翻转状态
            deviceState[relayId] = !deviceState[relayId];
            const btn = document.querySelector(`[data-id="${relayId}"]`);
            if(deviceState[relayId]){
                btn.classList.remove('switch-off');
                btn.classList.add('switch-on');
                sendMqttCmd(relayId, 1);
            }else{
                btn.classList.remove('switch-on');
                btn.classList.add('switch-off');
                sendMqttCmd(relayId, 0);
            }
        }

        // 模拟发送MQTT指令至ESP32（真实项目替换为MQTT over WebSocket）
        function sendMqttCmd(dev, val){
            console.log(`[MQTT发送] 设备${dev} 状态:${val === 1 ? "开启" : "关闭"}`);
        }

        // 场景：回家全开
        function sceneHome(){
            Object.keys(deviceState).forEach(id=>{
                deviceState[id] = true;
                const btn = document.querySelector(`[data-id="${id}"]`);
                btn.classList.remove('switch-off');
                btn.classList.add('switch-on');
                sendMqttCmd(id,1);
            })
        }
        // 场景：离家全关
        function sceneAway(){
            Object.keys(deviceState).forEach(id=>{
                deviceState[id] = false;
                const btn = document.querySelector(`[data-id="${id}"]`);
                btn.classList.remove('switch-on');
                btn.classList.add('switch-off');
                sendMqttCmd(id,0);
            })
        }

        // 保存定时规则
        function saveTimer(){
            const tOn = document.getElementById('timeOn').value;
            const tOff = document.getElementById('timeOff').value;
            const target = document.getElementById('timerTarget').value;
            if(!tOn && !tOff){
                alert("请填写开启或关闭时间");
                return;
            }
            alert(`定时规则保存成功！\n目标设备：${target}\n开启：${tOn || "无"}\n关闭：${tOff || "无"}`);
            // 真实项目：定时数据上传ESP32/云端存储
        }

        // 模拟30秒轮询一次ESP32设备状态（真实对接MQTT订阅）
        setInterval(()=>{
            console.log("轮询ESP32硬件实时状态...");
        },30000);
    </script>
</body>
</html>
