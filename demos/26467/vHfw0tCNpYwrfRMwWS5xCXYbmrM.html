<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助学系统 - 演示</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --primary-glow: rgba(99,102,241,0.15);
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --info: #3b82f6;
            --info-light: #dbeafe;
            --bg: #f1f5f9;
            --bg-card: #ffffff;
            --bg-sidebar: #f8fafc;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 16px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
            --shadow-lg: 0 12px 24px rgba(0,0,0,0.08), 0 4px 8px rgba(0,0,0,0.04);
            --shadow-xl: 0 20px 40px rgba(0,0,0,0.1), 0 8px 16px rgba(0,0,0,0.06);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg: #0c1222;
            --bg-card: #1a2332;
            --bg-sidebar: #151f2e;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #2a3a4e;
            --border-light: #1e2d3d;
            --primary-glow: rgba(99,102,241,0.25);
            --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.2);
            --shadow-lg: 0 12px 24px rgba(0,0,0,0.4), 0 4px 8px rgba(0,0,0,0.2);
            --shadow-xl: 0 20px 40px rgba(0,0,0,0.5), 0 8px 16px rgba(0,0,0,0.3);
            --success-light: #064e3b;
            --danger-light: #7f1d1d;
            --warning-light: #78350f;
            --info-light: #1e3a5f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* === Animated Background === */
        .bg-pattern {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, var(--primary-glow), transparent),
                var(--bg);
        }

        /* === Navigation === */
        #navbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0 28px;
            display: flex;
            align-items: center;
            height: 60px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            background: color-mix(in srgb, var(--bg-card) 85%, transparent);
        }

        .nav-brand {
            font-family: 'Noto Serif SC', serif;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-right: 36px;
            white-space: nowrap;
            letter-spacing: -0.5px;
        }

        .nav-links { display: flex; gap: 4px; flex-wrap: wrap; }
        .nav-link {
            text-decoration: none; color: var(--text-secondary);
            padding: 7px 16px; border-radius: var(--radius-sm); font-size: 14px;
            font-weight: 500; transition: var(--transition); cursor: pointer;
            position: relative;
        }
        .nav-link:hover { background: var(--primary-glow); color: var(--primary); }
        .nav-link.active {
            background: var(--primary); color: #fff;
            box-shadow: 0 2px 8px rgba(99,102,241,0.3);
        }

        .nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
        .nav-theme-toggle {
            cursor: pointer; font-size: 18px; padding: 6px;
            border-radius: 50%; transition: var(--transition);
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
        }
        .nav-theme-toggle:hover { background: var(--primary-glow); }

        /* === Main Content === */
        #main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 28px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* === Page Header === */
        .page-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px;
        }
        .page-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 24px; font-weight: 700; color: var(--text);
            letter-spacing: -0.5px;
        }
        .page-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

        /* === Buttons === */
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 18px; border: none; border-radius: var(--radius-sm);
            font-size: 14px; cursor: pointer; transition: var(--transition);
            font-weight: 500; text-decoration: none; font-family: inherit;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: var(--primary); color: #fff;
            box-shadow: 0 2px 8px rgba(99,102,241,0.25);
        }
        .btn-primary:hover { background: var(--primary-dark); box-shadow: 0 4px 12px rgba(99,102,241,0.35); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { opacity: 0.9; }
        .btn-secondary {
            background: var(--bg); color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: var(--border); color: var(--text); }
        .btn-outline-primary {
            background: transparent; color: var(--primary);
            border: 1.5px solid var(--primary);
        }
        .btn-outline-primary:hover { background: var(--primary); color: #fff; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn-lg { padding: 12px 28px; font-size: 16px; }

        /* === Cards === */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 16px;
            border: 1px solid var(--border-light);
            transition: var(--transition);
        }
        .card:hover { box-shadow: var(--shadow-md); }

        .card-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 18px; padding-bottom: 14px;
            border-bottom: 1px solid var(--border-light);
        }
        .card-header h3 {
            margin: 0; font-size: 16px; font-weight: 600; color: var(--text);
        }

        /* === Stats Grid === */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px; margin-bottom: 28px;
        }
        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border-light);
            text-align: center;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            opacity: 0; transition: var(--transition);
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .stat-card:hover::before { opacity: 1; }
        .stat-card .stat-icon { font-size: 28px; margin-bottom: 8px; }
        .stat-card .stat-value {
            font-size: 28px; font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-card .stat-label {
            font-size: 13px; color: var(--text-secondary); margin-top: 4px;
            font-weight: 500;
        }

        /* === Projects Grid === */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .project-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            border: 1px solid var(--border-light);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.4s ease both;
        }
        .project-card:nth-child(1) { animation-delay: 0.05s; }
        .project-card:nth-child(2) { animation-delay: 0.1s; }
        .project-card:nth-child(3) { animation-delay: 0.15s; }
        .project-card:nth-child(4) { animation-delay: 0.2s; }
        .project-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-light);
        }
        .project-card::after {
            content: '';
            position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            transform: scaleX(0); transition: transform 0.3s ease;
        }
        .project-card:hover::after { transform: scaleX(1); }

        .project-card .project-icon {
            font-size: 32px; margin-bottom: 12px;
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            border-radius: var(--radius);
            background: var(--primary-glow);
        }
        .project-card .project-name {
            font-size: 17px; font-weight: 600; margin-bottom: 6px;
            color: var(--text);
        }
        .project-card .project-desc {
            font-size: 13px; color: var(--text-secondary); margin-bottom: 16px;
            line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .project-card .project-stats {
            display: flex; gap: 16px; font-size: 12px; color: var(--text-muted);
            margin-bottom: 12px;
        }
        .project-card .project-stats span { display: flex; align-items: center; gap: 4px; }

        .progress-bar {
            width: 100%; height: 6px; background: var(--border);
            border-radius: 3px; overflow: hidden;
        }
        .progress-bar .progress-fill {
            height: 100%; border-radius: 3px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
        }
        .progress-bar .progress-fill.success {
            background: linear-gradient(90deg, var(--success), #34d399);
        }

        /* === Video List === */
        .video-list { display: flex; flex-direction: column; gap: 8px; }
        .video-item {
            display: flex; align-items: center; padding: 14px 18px;
            border: 1px solid var(--border-light); border-radius: var(--radius-sm);
            cursor: pointer; transition: var(--transition);
            background: var(--bg-card);
            animation: slideUp 0.3s ease both;
        }
        .video-item:nth-child(1) { animation-delay: 0.03s; }
        .video-item:nth-child(2) { animation-delay: 0.06s; }
        .video-item:nth-child(3) { animation-delay: 0.09s; }
        .video-item:nth-child(4) { animation-delay: 0.12s; }
        .video-item:nth-child(5) { animation-delay: 0.15s; }
        .video-item:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-md);
            transform: translateX(4px);
        }
        .video-item .video-icon {
            font-size: 22px; margin-right: 14px; flex-shrink: 0;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            background: var(--primary-glow); border-radius: var(--radius-sm);
        }
        .video-item .video-info { flex: 1; min-width: 0; }
        .video-item .video-name {
            font-size: 14px; font-weight: 500;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            display: flex; align-items: center; gap: 8px;
        }
        .video-item .video-meta {
            font-size: 12px; color: var(--text-muted); margin-top: 3px;
        }
        .video-item .video-progress {
            width: 120px; flex-shrink: 0; margin-left: 14px;
        }
        .video-item .video-progress .progress-text {
            font-size: 12px; color: var(--text-secondary);
            text-align: right; margin-bottom: 3px; font-weight: 500;
        }
        .video-item .video-actions {
            display: flex; gap: 6px; margin-left: 14px; flex-shrink: 0;
        }

        .summary-tag {
            display: inline-flex; align-items: center; gap: 3px;
            padding: 2px 8px; border-radius: 4px;
            background: var(--info-light); color: var(--info);
            font-size: 11px; font-weight: 600;
            white-space: nowrap; flex-shrink: 0;
        }
        .completed-tag {
            display: inline-flex; align-items: center; gap: 3px;
            padding: 2px 8px; border-radius: 4px;
            background: var(--success-light); color: var(--success);
            font-size: 11px; font-weight: 600;
        }

        /* === Filter Tabs === */
        .filter-tabs {
            display: flex; gap: 6px; margin-bottom: 16px;
        }
        .filter-tab {
            padding: 6px 16px; border-radius: 20px;
            font-size: 13px; font-weight: 500;
            cursor: pointer; transition: var(--transition);
            border: 1px solid var(--border);
            background: transparent; color: var(--text-secondary);
            font-family: inherit;
        }
        .filter-tab:hover { border-color: var(--primary-light); color: var(--primary); }
        .filter-tab.active {
            background: var(--primary); color: #fff;
            border-color: var(--primary);
        }

        /* === Player Layout === */
        .player-container {
            background: #000; border-radius: var(--radius); overflow: hidden;
            box-shadow: var(--shadow-lg); position: relative;
            aspect-ratio: 16/9;
            display: flex; align-items: center; justify-content: center;
        }
        .player-placeholder {
            color: #fff; text-align: center;
        }
        .player-placeholder .play-icon {
            width: 72px; height: 72px; border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px; font-size: 32px;
            backdrop-filter: blur(8px);
            transition: var(--transition);
        }
        .player-placeholder:hover .play-icon {
            background: var(--primary);
            transform: scale(1.1);
        }

        .player-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
            align-items: start;
        }

        /* === AI Summary Panel === */
        .summary-panel {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
            overflow: hidden;
        }
        .summary-tabs {
            display: flex; border-bottom: 1px solid var(--border);
        }
        .summary-tab {
            flex: 1; padding: 12px; text-align: center;
            font-size: 13px; font-weight: 500;
            cursor: pointer; transition: var(--transition);
            color: var(--text-secondary); border: none; background: none;
            font-family: inherit;
            position: relative;
        }
        .summary-tab:hover { color: var(--primary); background: var(--primary-glow); }
        .summary-tab.active {
            color: var(--primary);
        }
        .summary-tab.active::after {
            content: '';
            position: absolute; bottom: 0; left: 20%; right: 20%; height: 2px;
            background: var(--primary); border-radius: 1px;
        }
        .summary-content {
            padding: 20px;
            font-size: 14px; line-height: 1.8;
            color: var(--text);
            max-height: 500px; overflow-y: auto;
        }
        .summary-content h4 {
            font-size: 15px; font-weight: 600; margin-bottom: 10px;
            color: var(--primary); display: flex; align-items: center; gap: 6px;
        }
        .summary-content ul { padding-left: 20px; margin-bottom: 16px; }
        .summary-content li { margin-bottom: 6px; }
        .summary-section {
            margin-bottom: 20px;
            padding: 16px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--primary);
        }
        .summary-section.case { border-left-color: var(--warning); }
        .summary-section.normal { border-left-color: var(--success); }

        /* === Quiz === */
        .quiz-container {
            max-width: 800px; margin: 0 auto;
        }
        .quiz-progress {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 24px;
        }
        .quiz-progress-bar {
            flex: 1; height: 8px; background: var(--border);
            border-radius: 4px; overflow: hidden;
        }
        .quiz-progress-fill {
            height: 100%; border-radius: 4px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            transition: width 0.5s ease;
        }
        .quiz-progress-text {
            font-size: 13px; font-weight: 600; color: var(--text-secondary);
            white-space: nowrap;
        }

        .quiz-question {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 28px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow);
            animation: scaleIn 0.3s ease;
        }
        .quiz-question .q-number {
            font-size: 12px; font-weight: 600; color: var(--primary);
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .quiz-question .q-text {
            font-size: 17px; font-weight: 500; line-height: 1.7;
            margin-bottom: 24px; color: var(--text);
        }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; }
        .quiz-option {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 18px; border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            cursor: pointer; transition: var(--transition);
            font-size: 14px;
        }
        .quiz-option:hover { border-color: var(--primary-light); background: var(--primary-glow); }
        .quiz-option.selected { border-color: var(--primary); background: var(--primary-glow); }
        .quiz-option.correct { border-color: var(--success); background: var(--success-light); }
        .quiz-option.wrong { border-color: var(--danger); background: var(--danger-light); }
        .quiz-option .option-letter {
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--bg); display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 13px; flex-shrink: 0;
            transition: var(--transition);
        }
        .quiz-option.selected .option-letter { background: var(--primary); color: #fff; }
        .quiz-option.correct .option-letter { background: var(--success); color: #fff; }
        .quiz-option.wrong .option-letter { background: var(--danger); color: #fff; }

        .quiz-actions {
            display: flex; justify-content: space-between; margin-top: 24px;
        }

        /* === Wrong Questions === */
        .wrong-q-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border-light);
            margin-bottom: 12px;
            transition: var(--transition);
            animation: slideUp 0.3s ease both;
        }
        .wrong-q-card:hover { box-shadow: var(--shadow-md); }
        .wrong-q-card .wrong-q-source {
            font-size: 12px; color: var(--text-muted); margin-bottom: 8px;
            display: flex; align-items: center; gap: 6px;
        }
        .wrong-q-card .wrong-q-text {
            font-size: 15px; font-weight: 500; margin-bottom: 12px; line-height: 1.6;
        }
        .wrong-q-card .wrong-q-answer {
            padding: 12px 16px; border-radius: var(--radius-sm);
            background: var(--success-light); color: #065f46;
            font-size: 13px; margin-bottom: 8px;
        }
        [data-theme="dark"] .wrong-q-card .wrong-q-answer { color: #6ee7b7; }
        .wrong-q-card .wrong-q-user {
            padding: 12px 16px; border-radius: var(--radius-sm);
            background: var(--danger-light); color: #991b1b;
            font-size: 13px;
        }
        [data-theme="dark"] .wrong-q-card .wrong-q-user { color: #fca5a5; }
        .wrong-q-actions {
            display: flex; gap: 8px; margin-top: 12px;
        }

        /* === Calendar Heatmap === */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .calendar-day {
            aspect-ratio: 1;
            border-radius: 4px;
            background: var(--border-light);
            transition: var(--transition);
            position: relative;
            cursor: pointer;
        }
        .calendar-day:hover { transform: scale(1.2); z-index: 1; }
        .calendar-day.level-1 { background: #c7d2fe; }
        .calendar-day.level-2 { background: #a5b4fc; }
        .calendar-day.level-3 { background: #818cf8; }
        .calendar-day.level-4 { background: #6366f1; }
        [data-theme="dark"] .calendar-day.level-1 { background: #312e81; }
        [data-theme="dark"] .calendar-day.level-2 { background: #3730a3; }
        [data-theme="dark"] .calendar-day.level-3 { background: #4338ca; }
        [data-theme="dark"] .calendar-day.level-4 { background: #4f46e5; }
        .calendar-day .day-label {
            position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
            font-size: 10px; color: var(--text-muted); white-space: nowrap;
            opacity: 0; transition: var(--transition);
        }

            width: 100%; padding: 10px 14px; border: 1px solid var(--border);

        }
        .empty-state .icon { font-size: 56px; margin-bottom: 16px; }
        .empty-state p { font-size: 15px; margin-bottom: 16px; }

        /* === Tooltip === */
        .tooltip {
            position: relative;
        }
        .tooltip::after {
            content: attr(data-tip);
            position: absolute; bottom: calc(100% + 8px); left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: var(--text); color: var(--bg-card);
            padding: 6px 12px; border-radius: 6px;
            font-size: 12px; white-space: nowrap;
            opacity: 0; pointer-events: none;
            transition: all 0.2s ease;
        }
        .tooltip:hover::after { opacity: 1; transform: translateX(-50%) scale(1); }

        /* === Back Button === */
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-secondary); font-size: 14px;
            cursor: pointer; transition: var(--transition);
            margin-bottom: 16px; font-weight: 500;
            background: none; border: none; font-family: inherit;
        }
        .back-btn:hover { color: var(--primary); }

        /* === Responsive === */
        @media (max-width: 768px) {
            #navbar { padding: 0 16px; }
            .nav-brand { margin-right: 16px; font-size: 17px; }
            .nav-links { gap: 2px; }
            .nav-link { padding: 5px 10px; font-size: 13px; }

        .page-enter { animation: fadeIn 0.35s ease both; }

        /* === Notification badge === */

            display: inline-flex; align-items: center; justify-content: center;

        }

        /* === Project Card Specific === */

        }

        }

        }

        .plan-card.plan-overdue {

        }

        /* === ETA Cards === */
        .eta-card {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 14px; border-radius: var(--radius-sm);
            font-size: 13px; line-height: 1.5;
            background: var(--success-light); color: #065f46;
            border: 1px solid #6ee7b7;

        [data-theme="dark"] .eta-card { color: #6ee7b7; }
        .eta-card.eta-warning {

        /* === Stats Grid in Project Card === */
        .project-card .stats-grid {
            margin-bottom: 0;
            grid-template-columns: repeat(4, 1fr);
        }
        .project-card .stats-grid .stat-card {
            padding: 12px;
        }
        .project-card .stats-grid .stat-value {
            font-size: 20px;
        }

        .mt-sm { margin-top: 8px; }
        .mb-sm { margin-bottom: 8px; }
        .mb-md { margin-bottom: 16px; }
        .text-sm { font-size: 13px; }
        .text-muted { color: var(--text-muted); }
        .flex-between { display: flex; align-items: center; justify-content: space-between; }
        .gap-sm { gap: 8px; }
        .flex { display: flex; }

        /* === Speed Control === */
        .speed-control {
            display: flex; gap: 4px; align-items: center;

        .speed-btn {
            padding: 4px 10px; border-radius: 4px;
            font-size: 12px; font-weight: 500;

            color: var(--text-secondary); font-family: inherit;
        }
        .speed-btn:hover { border-color: var(--primary); color: var(--primary); }

        .screenshot-grid {

        .screenshot-item {

            padding: 2px 6px; border-radius: 4px;
            font-size: 11px; font-weight: 500;
        }
    </style>
</head>

            if (h > 0) return m > 0 ? `${h}小时${m}分钟` : `${h}小时`;

        // === Toast ===
        function showToast(msg) {
            const existing = document.querySelector('.toast-msg');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.style.cssText = `
                position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px);
                background: var(--text); color: var(--bg-card);
                padding: 12px 24px; border-radius: var(--radius);
                font-size: 14px; font-weight: 500;
                box-shadow: var(--shadow-lg);
                z-index: 9999;
                opacity: 0; transition: all 0.3s ease;
            `;
            toast.textContent = msg;
            document.body.appendChild(toast);

            requestAnimationFrame(() => {
                toast.style.opacity = '1';
                toast.style.transform = 'translateX(-50%) translateY(0)';
            });

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(20px)';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // === Init ===
        navigate('projects');
    </script>
