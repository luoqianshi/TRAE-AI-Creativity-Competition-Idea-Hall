<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实训作业通 — 职业院校作业管理平台 | Demo</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --pri: #4F6EF7; --pri-lt: #EEF1FE; --pri-dk: #3B57D9;
  --green: #10B981; --red: #EF4444; --amber: #F59E0B;
  --bg: #F1F5F9; --card: #FFFFFF; --txt: #1E293B; --txt2: #64748B;
  --bd: #E2E8F0; --r: 14px; --sh: 0 1px 3px rgba(0,0,0,.06);
  --sh-md: 0 4px 12px rgba(0,0,0,.07);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;min-height:100vh}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
input,select,textarea{font-family:inherit;outline:none}

/* ── Nav ─────────────────────── */
nav{background:var(--card);border-bottom:1px solid var(--bd);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
nav .logo{font-weight:800;font-size:18px;color:var(--pri);display:flex;align-items:center;gap:8px}
nav .logo span{background:var(--pri);color:#fff;padding:2px 8px;border-radius:6px;font-size:11px}
nav .user{display:flex;align-items:center;gap:12px;font-size:14px}
nav .user .role-tag{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600}
.role-teacher{background:#FEF3C7;color:#92400E}
.role-student{background:#DBEAFE;color:#1E40AF}
.btn-sm{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500}
.btn-out{background:#FEE2E2;color:#991B1B}

/* ── Layout ──────────────────── */
.page{max-width:1040px;margin:0 auto;padding:28px 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:24px;box-shadow:var(--sh);margin-bottom:20px}
.card h2{font-size:20px;margin-bottom:6px}
.card .sub{color:var(--txt2);font-size:14px;margin-bottom:20px}

/* ── Auth ────────────────────── */
.auth-wrap{display:flex;justify-content:center;align-items:center;min-height:calc(100vh - 56px);padding:20px}
.auth-box{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:36px 32px;width:100%;max-width:420px;box-shadow:var(--sh-md)}
.auth-box h1{font-size:24px;text-align:center;margin-bottom:4px}
.auth-box .sub{text-align:center;color:var(--txt2);font-size:14px;margin-bottom:24px}
.auth-tabs{display:flex;gap:0;margin-bottom:24px;background:#F1F5F9;border-radius:10px;padding:3px}
.auth-tab{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:.2s}
.auth-tab.active{background:#fff;box-shadow:var(--sh)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--txt2)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;border:1px solid var(--bd);border-radius:10px;font-size:14px;transition:.2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-lt)}
.btn-full{width:100%;padding:11px;background:var(--pri);color:#fff;border-radius:10px;font-size:15px;font-weight:600;transition:.2s}
.btn-full:hover{background:var(--pri-dk)}
.btn-full:disabled{opacity:.5;cursor:not-allowed}

/* ── Dashboard ───────────────── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:20px;text-align:center;box-shadow:var(--sh)}
.stat-card .num{font-size:32px;font-weight:800}
.stat-card .lbl{font-size:13px;color:var(--txt2);margin-top:4px}
.num-blue{color:var(--pri)} .num-green{color:var(--green)} .num-red{color:var(--red)} .num-amber{color:var(--amber)}

table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;font-size:14px}
th{background:#F8FAFC;font-weight:600;font-size:13px;color:var(--txt2);border-bottom:2px solid var(--bd)}
td{border-bottom:1px solid var(--bd)}
tr:hover td{background:#FAFBFC}

.badge{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-green{background:#D1FAE5;color:#065F46}
.badge-red{background:#FEE2E2;color:#991B1B}
.badge-amber{background:#FEF3C7;color:#92400E}
.badge-blue{background:#DBEAFE;color:#1E40AF}

.btn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:500;transition:.2s}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri:hover{background:var(--pri-dk)}
.btn-ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn-ghost:hover{background:var(--pri-lt)}
.btn-danger{background:#FEE2E2;color:#991B1B}
.btn-danger:hover{background:#FECACA}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:var(--r);padding:28px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h3{font-size:18px;margin-bottom:16px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

.chart-wrap{max-width:500px;margin:0 auto}

.empty{text-align:center;padding:40px;color:var(--txt2)}
.empty .icon{font-size:48px;margin-bottom:8px}

.tabs{display:flex;gap:4px;margin-bottom:20px;background:#F1F5F9;border-radius:10px;padding:3px}
.tab{padding:8px 18px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:.2s}
.tab.active{background:#fff;box-shadow:var(--sh)}
.tab.red{color:var(--red)}

.alert{padding:12px 16px;border-radius:10px;font-size:14px;margin-bottom:16px}
.alert-info{background:#DBEAFE;color:#1E40AF;border:1px solid #BFDBFE}
.alert-warn{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A}
.alert-green{background:#D1FAE5;color:#065F46;border:1px solid #A7F3D0}

.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}

.grade-modal-info{margin-bottom:16px;padding:14px;background:#F8FAFC;border-radius:10px;font-size:13px;line-height:1.8}
.grade-modal-info strong{display:inline-block;min-width:60px}

@media(max-width:640px){
  .stats-row{grid-template-columns:1fr 1fr}
  th,td{padding:8px 10px;font-size:12px}
  nav{padding:0 12px}
}
</style>
</head>
<body>

<!-- ═══════ NAV ═══════ -->
<nav>
  <div class="logo">📚 实训作业通 <span>Demo</span></div>
  <div class="user" id="navUser"></div>
</nav>

<!-- ═══════ MAIN ═══════ -->
<div id="app"></div>

<!-- ═══════ GRADE MODAL (reusable) ═══════ -->
<div id="gradeModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3>📝 批改作业</h3>
    <div id="gradeModalContent"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeGradeModal()">取消</button>
      <button class="btn btn-pri" id="gradeSubmitBtn" onclick="submitGrade()">提交批改</button>
    </div>
  </div>
</div>

<script>
// ═══════════ DATA LAYER ═══════════
const LS = {
  get(k,def){ try{const v=localStorage.getItem('zuoye_'+k);return v?JSON.parse(v):def}catch(e){return def} },
  set(k,v){ localStorage.setItem('zuoye_'+k,JSON.stringify(v)) },
};

function initDemoData(){
  if(LS.get('initialized')) return;
  const now = Date.now();
  const d = x => new Date(now + x*86400000).toISOString().split('T')[0];

  const users = [
    {id:'t1',name:'张老师',phone:'13800000001',password:'123456',role:'teacher'},
    {id:'s1',name:'李明',phone:'13800000002',password:'123456',role:'student',studentId:'2024001'},
    {id:'s2',name:'王芳',phone:'13800000003',password:'123456',role:'student',studentId:'2024002'},
    {id:'s3',name:'赵强',phone:'13800000004',password:'123456',role:'student',studentId:'2024003'},
  ];
  const classes = [
    {id:'c1',name:'24级软件技术1班',teacherId:'t1',createdAt:d(-30)},
    {id:'c2',name:'24级计算机网络2班',teacherId:'t1',createdAt:d(-28)},
  ];
  const enrollments = [
    {classId:'c1',studentId:'s1'},{classId:'c1',studentId:'s2'},{classId:'c1',studentId:'s3'},
    {classId:'c2',studentId:'s1'},{classId:'c2',studentId:'s2'},
  ];
  const assignments = [
    {id:'a1',classId:'c1',teacherId:'t1',title:'Python 计算器程序设计',desc:'使用 Python 编写一个命令行计算器，支持加减乘除四则运算，要求有输入验证和错误处理。提交 .py 文件 + 运行截图。',deadline:d(3),createdAt:d(-7)},
    {id:'a2',classId:'c1',teacherId:'t1',title:'HTML 个人简历页面',desc:'使用 HTML+CSS 制作一份个人简历页面，要求包含个人信息、教育背景、技能、项目经验等模块，布局美观。',deadline:d(-2),createdAt:d(-14)},
    {id:'a3',classId:'c2',teacherId:'t1',title:'网络拓扑图设计',desc:'使用 Cisco Packet Tracer 设计一个包含至少3台路由器、2台交换机的企业网络拓扑图，提交 .pkt 文件 + 设计说明。',deadline:d(5),createdAt:d(-3)},
  ];
  const submissions = [
    {id:'sub1',assignmentId:'a2',studentId:'s1',text:'完成了响应式布局，支持手机和电脑查看。使用了 Flexbox 布局和 CSS Grid。',files:'resume_liming.html',submittedAt:d(-3),score:92,comment:'整体布局清晰，CSS 细节处理到位，响应式适配做得很好！建议增加一些交互动效会更好。',gradedAt:d(-1)},
    {id:'sub2',assignmentId:'a2',studentId:'s2',text:'实现了个人信息、教育背景、技能三个模块，使用了渐变背景色。',files:'resume_wangfang.html',submittedAt:d(-4),score:78,comment:'基本功能完成，但缺少项目经验模块，CSS 样式可以再精细化一些。继续加油！',gradedAt:d(-1)},
    {id:'sub3',assignmentId:'a1',studentId:'s1',text:'完成了四则运算功能，增加了除零检查和输入格式验证。',files:'calculator.py,screenshot.png',submittedAt:d(-1),score:null,comment:'',gradedAt:null},
    {id:'sub4',assignmentId:'a1',studentId:'s3',text:'实现了计算器功能，使用了函数封装。',files:'calc.py',submittedAt:d(0),score:null,comment:'',gradedAt:null},
  ];

  LS.set('users',users);
  LS.set('classes',classes);
  LS.set('enrollments',enrollments);
  LS.set('assignments',assignments);
  LS.set('submissions',submissions);
  LS.set('initialized',true);
}

// ═══════════ STATE ═══════════
let currentUser = LS.get('currentUser',null);
let currentView = 'dashboard';

function save(){ if(currentUser) LS.set('currentUser',currentUser) }
function users(){ return LS.get('users',[]) }
function classes(){ return LS.get('classes',[]) }
function enrollments(){ return LS.get('enrollments',[]) }
function assignments(){ return LS.get('assignments',[]) }
function submissions(){ return LS.get('submissions',[]) }

function myClasses(){
  if(currentUser.role==='teacher') return classes().filter(c=>c.teacherId===currentUser.id);
  const myClassIds = enrollments().filter(e=>e.studentId===currentUser.id).map(e=>e.classId);
  return classes().filter(c=>myClassIds.includes(c.id));
}
function classAssignments(classId){ return assignments().filter(a=>a.classId===classId) }
function getSubmission(aid,sid){ return submissions().find(s=>s.assignmentId===aid&&s.studentId===sid) }
function classStudents(classId){
  const sids = enrollments().filter(e=>e.classId===classId).map(e=>e.studentId);
  return users().filter(u=>sids.includes(u.id));
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7) }

// ═══════════ RENDER ═══════════
function render(){
  const app = document.getElementById('app');
  const nav = document.getElementById('navUser');
  if(!currentUser){ app.innerHTML = authPage(); nav.innerHTML=''; return; }

  const roleLabel = currentUser.role==='teacher'?'教师':'学生';
  const roleCls = currentUser.role==='teacher'?'role-teacher':'role-student';
  nav.innerHTML = `<span>👋 ${currentUser.name} <span class="role-tag ${roleCls}">${roleLabel}</span></span>
    <button class="btn-sm btn-out" onclick="logout()">退出登录</button>`;

  if(currentUser.role==='teacher') app.innerHTML = teacherPage();
  else app.innerHTML = studentPage();
}

// ═══════════ AUTH ═══════════
function authPage(){
  return `<div class="auth-wrap"><div class="auth-box">
    <h1>📚 实训作业通</h1><p class="sub">职业院校作业管理平台 · Demo</p>
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchAuthTab('login')">登录</div>
      <div class="auth-tab" onclick="switchAuthTab('register')">注册</div>
    </div>
    <div id="authForm"></div>
  </div></div>`;
}

let authTab = 'login';
function switchAuthTab(t){ authTab=t; document.querySelectorAll('.auth-tab').forEach((el,i)=>{ el.classList.toggle('active',(i===0&&t==='login')||(i===1&&t==='register')) }); renderAuthForm() }
function renderAuthForm(){ document.getElementById('authForm').innerHTML = authTab==='login'?loginForm():registerForm() }

function loginForm(){
  return `<form onsubmit="doLogin(event)">
    <div class="form-group"><label>手机号</label><input type="text" id="loginPhone" placeholder="请输入手机号" required></div>
    <div class="form-group"><label>密码</label><input type="password" id="loginPwd" placeholder="请输入密码" required></div>
    <div class="alert alert-info" style="font-size:12px">💡 演示账号：老师 13800000001 / 学生 13800000002 / 密码均为 123456</div>
    <button class="btn-full" type="submit">登 录</button>
  </form>`;
}
function registerForm(){
  return `<form onsubmit="doRegister(event)">
    <div class="form-group"><label>我是</label><select id="regRole"><option value="student">学生</option><option value="teacher">老师</option></select></div>
    <div class="form-group"><label>姓名</label><input type="text" id="regName" placeholder="请输入姓名" required></div>
    <div class="form-group"><label>手机号</label><input type="text" id="regPhone" placeholder="请输入手机号" required></div>
    <div class="form-group"><label>密码</label><input type="password" id="regPwd" placeholder="请设置密码（至少6位）" required minlength="6"></div>
    <div class="form-group" id="regStudentIdGrp"><label>学号</label><input type="text" id="regStudentId" placeholder="请输入学号"></div>
    <button class="btn-full" type="submit">注 册</button>
  </form>`;
}

function doLogin(e){ e.preventDefault();
  const phone=document.getElementById('loginPhone').value.trim();
  const pwd=document.getElementById('loginPwd').value.trim();
  const u=users().find(u=>u.phone===phone&&u.password===pwd);
  if(!u) return alert('账号或密码错误，请重试');
  currentUser=u; save(); render();
}

function doRegister(e){ e.preventDefault();
  const role=document.getElementById('regRole').value;
  const name=document.getElementById('regName').value.trim();
  const phone=document.getElementById('regPhone').value.trim();
  const pwd=document.getElementById('regPwd').value.trim();
  const sid=document.getElementById('regStudentId')?.value.trim();
  if(users().find(u=>u.phone===phone)) return alert('该手机号已注册');
  if(pwd.length<6) return alert('密码至少6位');
  const u={id:uid(),name,phone,password:pwd,role};
  if(role==='student') u.studentId=sid||'';
  LS.set('users',[...users(),u]);
  currentUser=u; save(); render();
}

function logout(){ currentUser=null; LS.set('currentUser',null); render() }

// ═══════════ TEACHER PAGE ═══════════
function teacherPage(){
  const cls = myClasses();
  const allAs = assignments().filter(a=>a.teacherId===currentUser.id);
  const allSubs = submissions().filter(s=>allAs.some(a=>a.id===s.assignmentId));
  const graded = allSubs.filter(s=>s.score!==null).length;
  const ungraded = allSubs.filter(s=>s.score===null).length;
  const avgScore = graded>0?(allSubs.filter(s=>s.score!==null).reduce((a,b)=>a+b.score,0)/graded).toFixed(1):'-';

  return `<div class="page">
    <div class="flex-between"><h1 style="font-size:24px">👩‍🏫 教师工作台</h1>
      <div style="display:flex;gap:8px"><button class="btn btn-pri" onclick="showCreateClass()">+ 新建班级</button><button class="btn btn-pri" onclick="showCreateAssignment()">+ 发布作业</button></div>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="num num-blue">${cls.length}</div><div class="lbl">我的班级</div></div>
      <div class="stat-card"><div class="num">${allAs.length}</div><div class="lbl">发布作业</div></div>
      <div class="stat-card"><div class="num num-green">${graded}</div><div class="lbl">已批改</div></div>
      <div class="stat-card"><div class="num num-red">${ungraded}</div><div class="lbl">待批改</div></div>
      <div class="stat-card"><div class="num num-amber">${avgScore}</div><div class="lbl">平均分</div></div>
    </div>
    ${teacherTabs(cls)}
  </div>`;
}

let teacherTab = 'classes';
function switchTeacherTab(t){ teacherTab=t; render() }

function teacherTabs(cls){
  const tabs = `<div class="tabs">
    <div class="tab ${teacherTab==='classes'?'active':''}" onclick="switchTeacherTab('classes')">🏫 班级管理</div>
    <div class="tab ${teacherTab==='grading'?'active':''}" onclick="switchTeacherTab('grading')">📝 作业批改</div>
    <div class="tab ${teacherTab==='stats'?'active':''}" onclick="switchTeacherTab('stats')">📊 成绩统计</div>
  </div>`;

  if(teacherTab==='classes') return tabs+teacherClassesView(cls);
  if(teacherTab==='grading') return tabs+teacherGradingView();
  if(teacherTab==='stats') return tabs+teacherStatsView();
}

function teacherClassesView(cls){
  if(!cls.length) return `<div class="card"><div class="empty"><div class="icon">🏫</div><p>还没有班级，点击上方按钮创建</p></div></div>`;
  return cls.map(c=>{
    const as = classAssignments(c.id);
    const stus = classStudents(c.id);
    return `<div class="card">
      <div class="flex-between"><div><h2>${c.name}</h2><p class="sub">${stus.length} 名学生 · ${as.length} 个作业 · 创建于 ${c.createdAt}</p></div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost btn-sm" onclick="showClassDetail('${c.id}')">查看详情</button>
          <button class="btn btn-danger btn-sm" onclick="deleteClass('${c.id}')">删除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function showClassDetail(classId){
  const c = classes().find(c=>c.id===classId);
  if(!c) return;
  const stus = classStudents(classId);
  const as = classAssignments(classId);
  let html = `<div class="page"><h1 style="font-size:22px;margin-bottom:20px">🏫 ${c.name} — 班级详情</h1>
    <div class="card"><h2>👨‍🎓 学生名单 (${stus.length}人)</h2>
      ${stus.length?`<table><thead><tr><th>学号</th><th>姓名</th><th>手机号</th></tr></thead><tbody>
        ${stus.map(s=>`<tr><td>${s.studentId||'-'}</td><td>${s.name}</td><td>${s.phone}</td></tr>`).join('')}
      </tbody></table>`:`<div class="empty"><p>暂无学生加入</p></div>`}
    </div>
    <div class="card"><h2>📋 作业列表 (${as.length}个)</h2>
      ${as.length?`<table><thead><tr><th>作业标题</th><th>截止日期</th><th>提交数</th><th>操作</th></tr></thead><tbody>
        ${as.map(a=>{
          const subCount=submissions().filter(s=>s.assignmentId===a.id).length;
          const deadlinePassed=new Date(a.deadline)<new Date();
          return `<tr>
            <td>${a.title} ${deadlinePassed?'<span class="badge badge-red">已截止</span>':''}</td>
            <td>${a.deadline}</td><td>${subCount}/${stus.length}</td>
            <td><button class="btn btn-ghost btn-sm" onclick="viewAssignmentSubs('${a.id}')">查看提交</button></td>
          </tr>`;
        }).join('')}
      </tbody></table>`:`<div class="empty"><p>暂无作业</p></div>`}
    </div>
    <button class="btn btn-ghost" onclick="render()" style="margin-top:16px">← 返回</button>
  </div>`;
  document.getElementById('app').innerHTML = html;
}

function viewAssignmentSubs(aid){
  const a = assignments().find(a=>a.id===aid);
  if(!a) return;
  const stus = classStudents(a.classId);
  const subs = submissions().filter(s=>s.assignmentId===aid);
  let html = `<div class="page"><div class="flex-between"><h1 style="font-size:22px">📋 ${a.title}</h1><button class="btn btn-ghost" onclick="render()">← 返回</button></div>
    <div class="alert alert-info">📅 截止日期：${a.deadline} | 提交：${subs.length}/${stus.length} | 已批改：${subs.filter(s=>s.score!==null).length}</div>
    <div class="card"><table><thead><tr><th>学生</th><th>学号</th><th>状态</th><th>提交时间</th><th>分数</th><th>操作</th></tr></thead><tbody>`;
  stus.forEach(stu=>{
    const sub = subs.find(s=>s.studentId===stu.id);
    if(sub){
      const graded = sub.score!==null;
      html += `<tr>
        <td>${stu.name}</td><td>${stu.studentId||'-'}</td>
        <td>${graded?`<span class="badge badge-green">已批改</span>`:`<span class="badge badge-amber">待批改</span>`}</td>
        <td>${sub.submittedAt}</td><td>${graded?sub.score:'-'}</td>
        <td><button class="btn ${graded?'btn-ghost':'btn-pri'} btn-sm" onclick="openGradeModal('${sub.id}')">${graded?'查看/修改':'批改'}</button></td>
      </tr>`;
    }else{
      const late = new Date(a.deadline) < new Date();
      html += `<tr><td>${stu.name}</td><td>${stu.studentId||'-'}</td>
        <td><span class="badge ${late?'badge-red':'badge-blue'}">${late?'逾期未交':'未交'}</span></td>
        <td>-</td><td>-</td><td>-</td></tr>`;
    }
  });
  html += `</tbody></table></div></div>`;
  document.getElementById('app').innerHTML = html;
}

function teacherStatsView(){
  const cls = myClasses();
  let html = `<div class="card"><h2>📊 成绩统计</h2><p class="sub">选择一个班级查看成绩分布</p>`;
  if(!cls.length){ html+=`<div class="empty"><p>暂无班级</p></div>`; }
  else{
    html+=`<select id="statsClassSelect" onchange="renderClassStats()" style="margin-bottom:20px;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;font-size:14px">
      <option value="">-- 选择班级 --</option>
      ${cls.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
    </select><div id="statsContent"></div>`;
  }
  html+=`</div>`;
  return html;
}

function renderClassStats(){
  const cid=document.getElementById('statsClassSelect')?.value;
  if(!cid) return;
  const c=classes().find(c=>c.id===cid);
  const stus=classStudents(cid);
  const as=classAssignments(cid);
  const subs=submissions().filter(s=>as.some(a=>a.id===s.assignmentId)&&s.score!==null);
  const scores=subs.map(s=>s.score).filter(s=>s!==null);
  const avg=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'-';
  const max=scores.length?Math.max(...scores):'-';
  const min=scores.length?Math.min(...scores):'-';
  const pass=scores.filter(s=>s>=60).length;
  const passRate=scores.length?(pass/scores.length*100).toFixed(0):'-';

  const dist=[0,0,0,0,0]; // 0-59,60-69,70-79,80-89,90-100
  scores.forEach(s=>{ if(s<60)dist[0]++; else if(s<70)dist[1]++; else if(s<80)dist[2]++; else if(s<90)dist[3]++; else dist[4]++; });

  let content=`<div class="stats-row">
    <div class="stat-card"><div class="num num-blue">${avg}</div><div class="lbl">平均分</div></div>
    <div class="stat-card"><div class="num num-green">${max}</div><div class="lbl">最高分</div></div>
    <div class="stat-card"><div class="num num-red">${min}</div><div class="lbl">最低分</div></div>
    <div class="stat-card"><div class="num num-amber">${passRate}%</div><div class="lbl">及格率</div></div>
  </div>
  <div class="chart-wrap"><canvas id="scoreChart"></canvas></div>
  <h3 style="margin-top:24px;margin-bottom:12px">📋 学生成绩明细</h3>
  <table><thead><tr><th>学生</th><th>学号</th>${as.map(a=>`<th>${a.title}</th>`).join('')}<th>平均分</th></tr></thead><tbody>`;
  stus.forEach(stu=>{
    content+=`<tr><td>${stu.name}</td><td>${stu.studentId||'-'}</td>`;
    let stuTotal=0,stuCount=0;
    as.forEach(a=>{
      const sub=subs.find(s=>s.assignmentId===a.id&&s.studentId===stu.id);
      if(sub&&sub.score!==null){ stuTotal+=sub.score; stuCount++; content+=`<td>${sub.score}</td>`; }
      else content+=`<td>-</td>`;
    });
    content+=`<td><strong>${stuCount?(stuTotal/stuCount).toFixed(1):'-'}</strong></td></tr>`;
  });
  content+=`</tbody></table>`;
  document.getElementById('statsContent').innerHTML=content;

  if(scores.length){
    new Chart(document.getElementById('scoreChart'),{
      type:'bar',data:{labels:['0-59','60-69','70-79','80-89','90-100'],datasets:[{label:'人数',data:dist,backgroundColor:['#EF4444','#F59E0B','#3B82F6','#10B981','#8B5CF6']}]},
      options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}}
    });
  }
}

// ═══════════ STUDENT PAGE ═══════════
function studentPage(){
  const cls = myClasses();
  const mySubs = submissions().filter(s=>s.studentId===currentUser.id);
  const gradedCount = mySubs.filter(s=>s.score!==null).length;
  const pendingCount = mySubs.filter(s=>s.score===null).length;

  return `<div class="page">
    <h1 style="font-size:24px;margin-bottom:20px">🧑‍🎓 学生工作台 — ${currentUser.name} (${currentUser.studentId||'未设置学号'})</h1>
    <div class="stats-row">
      <div class="stat-card"><div class="num num-blue">${cls.length}</div><div class="lbl">我的班级</div></div>
      <div class="stat-card"><div class="num">${mySubs.length}</div><div class="lbl">已提交</div></div>
      <div class="stat-card"><div class="num num-green">${gradedCount}</div><div class="lbl">已批改</div></div>
      <div class="stat-card"><div class="num num-amber">${pendingCount}</div><div class="lbl">待批改</div></div>
    </div>
    ${cls.length?studentClassCards(cls):`<div class="card"><div class="empty"><div class="icon">🏫</div><p>你还没有加入任何班级</p><button class="btn btn-pri" onclick="showJoinClass()">加入班级</button></div></div>`}
    <button class="btn btn-ghost" onclick="showJoinClass()" style="margin-top:8px">+ 加入新班级</button>
  </div>`;
}

function studentClassCards(cls){
  return cls.map(c=>{
    const as = classAssignments(c.id).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));
    return `<div class="card">
      <h2>🏫 ${c.name}</h2><p class="sub">${as.length} 个作业</p>
      ${as.length?`<table><thead><tr><th>作业</th><th>截止日期</th><th>我的状态</th><th>分数</th><th>操作</th></tr></thead><tbody>
        ${as.map(a=>{
          const sub=getSubmission(a.id,currentUser.id);
          const deadlinePassed=new Date(a.deadline)<new Date();
          let statusHtml='',scoreHtml='-',actionHtml='';
          if(sub){
            if(sub.score!==null){ statusHtml=`<span class="badge badge-green">已批改</span>`; scoreHtml=`<strong>${sub.score}</strong>`; actionHtml=`<button class="btn btn-ghost btn-sm" onclick="viewSubmissionDetail('${sub.id}')">查看详情</button>`; }
            else{ statusHtml=`<span class="badge badge-blue">已提交</span>`; actionHtml=`<button class="btn btn-ghost btn-sm" onclick="viewSubmissionDetail('${sub.id}')">查看/修改</button>`; }
          }else{
            if(deadlinePassed){ statusHtml=`<span class="badge badge-red">逾期未交</span>`; actionHtml='-'; }
            else{ statusHtml=`<span class="badge badge-amber">待提交</span>`; actionHtml=`<button class="btn btn-pri btn-sm" onclick="showSubmitAssignment('${a.id}')">提交</button>`; }
          }
          return `<tr><td>${a.title} ${deadlinePassed?'<span class="badge badge-red">已截止</span>':''}</td><td>${a.deadline}</td><td>${statusHtml}</td><td>${scoreHtml}</td><td>${actionHtml}</td></tr>`;
        }).join('')}
      </tbody></table>`:`<div class="empty"><p>暂无作业</p></div>`}
    </div>`;
  }).join('');
}

function viewSubmissionDetail(subId){
  const sub = submissions().find(s=>s.id===subId);
  if(!sub) return;
  const a = assignments().find(a=>a.id===sub.assignmentId);
  const c = classes().find(c=>c.id===a?.classId);
  const canEdit = sub.score===null;
  let html = `<div class="page"><div class="flex-between"><h1 style="font-size:22px">📄 提交详情</h1><button class="btn btn-ghost" onclick="render()">← 返回</button></div>
    <div class="card">
      <h2>${a?.title||'-'}</h2><p class="sub">${c?.name||''} · 截止：${a?.deadline||''}</p>
      <div class="grade-modal-info"><strong>我的提交：</strong>${sub.submittedAt}<br><strong>文字说明：</strong>${sub.text||'无'}<br><strong>附件：</strong>${sub.files||'无'}</div>`;
  if(sub.score!==null){
    html+=`<div class="alert alert-green"><strong>✅ 分数：${sub.score} 分</strong><br>📝 评语：${sub.comment||'无'}<br>🕐 批改时间：${sub.gradedAt}</div>`;
  }else{
    html+=`<div class="alert alert-info">⏳ 老师尚未批改此作业</div>`;
    html+=`<button class="btn btn-pri" onclick="editSubmission('${sub.id}')">修改提交内容</button>`;
  }
  html+=`</div></div>`;
  document.getElementById('app').innerHTML = html;
}

function showSubmitAssignment(aid){
  const a = assignments().find(a=>a.id===aid);
  if(!a) return;
  const existSub = getSubmission(aid,currentUser.id);
  let html = `<div class="page"><div class="flex-between"><h1 style="font-size:22px">📤 提交作业</h1><button class="btn btn-ghost" onclick="render()">← 返回</button></div>
    <div class="card"><h2>${a.title}</h2><p class="sub">${a.desc}</p>
    <div class="alert alert-info">📅 截止日期：${a.deadline} | ${new Date(a.deadline)<new Date()?'⚠️ 已过截止日期':'⏳ 剩余时间充足'}</div>
    <form onsubmit="doSubmit(event,'${aid}')">
      <div class="form-group"><label>文字说明</label><textarea id="subText" rows="4" placeholder="简述你的解题思路、遇到的问题等">${existSub?.text||''}</textarea></div>
      <div class="form-group"><label>附件文件名（模拟）</label><input type="text" id="subFiles" placeholder="多个文件用逗号分隔，如：calculator.py,screenshot.png" value="${existSub?.files||''}"></div>
      <button class="btn btn-pri" type="submit">${existSub?'更新提交':'提交作业'}</button>
    </form></div></div>`;
  document.getElementById('app').innerHTML = html;
}

function doSubmit(e,aid){
  e.preventDefault();
  const text=document.getElementById('subText').value.trim();
  const files=document.getElementById('subFiles').value.trim();
  if(!text&&!files) return alert('请至少填写文字说明或附件文件名');
  const existSub=getSubmission(aid,currentUser.id);
  const now=new Date().toISOString().split('T')[0];
  if(existSub){
    let allSubs=submissions();
    const idx=allSubs.findIndex(s=>s.id===existSub.id);
    allSubs[idx]={...allSubs[idx],text,files,submittedAt:now};
    LS.set('submissions',allSubs);
  }else{
    LS.set('submissions',[...submissions(),{id:uid(),assignmentId:aid,studentId:currentUser.id,text,files,submittedAt:now,score:null,comment:'',gradedAt:null}]);
  }
  alert('✅ 提交成功！');
  render();
}

function editSubmission(subId){
  const sub=submissions().find(s=>s.id===subId);
  if(!sub||sub.score!==null) return;
  showSubmitAssignment(sub.assignmentId);
}

function showJoinClass(){
  const myClassIds = enrollments().filter(e=>e.studentId===currentUser.id).map(e=>e.classId);
  const available = classes().filter(c=>!myClassIds.includes(c.id));
  let html=`<div class="page"><div class="flex-between"><h1 style="font-size:22px">➕ 加入班级</h1><button class="btn btn-ghost" onclick="render()">← 返回</button></div><div class="card">`;
  if(!available.length){ html+=`<div class="empty"><p>没有可加入的班级</p></div>`; }
  else{
    html+=`<table><thead><tr><th>班级</th><th>班主任</th><th>创建时间</th><th>操作</th></tr></thead><tbody>`;
    available.forEach(c=>{
      const t=users().find(u=>u.id===c.teacherId);
      html+=`<tr><td>${c.name}</td><td>${t?.name||'-'}</td><td>${c.createdAt}</td><td><button class="btn btn-pri btn-sm" onclick="joinClass('${c.id}')">加入</button></td></tr>`;
    });
    html+=`</tbody></table>`;
  }
  html+=`</div></div>`;
  document.getElementById('app').innerHTML = html;
}

function joinClass(cid){
  LS.set('enrollments',[...enrollments(),{classId:cid,studentId:currentUser.id}]);
  alert('✅ 加入成功！');

}

function showCreateClass(){

    <div class="card"><form onsubmit="createClass(event)">

  const name=document.getElementById('newClassName').value.trim();

  if(!confirm('确定要删除这个班级吗？相关作业和提交记录也将被删除。')) return;
  LS.set('classes',classes().filter(c=>c.id!==cid));

function showCreateAssignment(){
  const cls=myClasses();
  if(!cls.length) return alert('请先创建班级再发布作业');

    <div class="card"><form onsubmit="createAssignment(event)">

      <button class="btn btn-pri" type="submit">发布作业</button>

function createAssignment(e){
  e.preventDefault();
  const classId=document.getElementById('newAsClass').value;
  const title=document.getElementById('newAsTitle').value.trim();
  const desc=document.getElementById('newAsDesc').value.trim();
  const deadline=document.getElementById('newAsDeadline').value;
  if(!title||!deadline) return alert('请填写标题和截止日期');
  LS.set('assignments',[...assignments(),{id:uid(),classId,teacherId:currentUser.id,title,desc,deadline,createdAt:new Date().toISOString().split('T')[0]}]);
  alert('✅ 作业发布成功！');
  render();
}

// ═══════════ GRADING ═══════════
let currentGradeSubId = null;
function openGradeModal(subId){
  currentGradeSubId = subId;
  const sub = submissions().find(s=>s.id===subId);
  if(!sub) return;
  const a = assignments().find(a=>a.id===sub.assignmentId);
  const stu = users().find(u=>u.id===sub.studentId);
  const content = document.getElementById('gradeModalContent');
  content.innerHTML = `
    <div class="grade-modal-info">
      <strong>学生：</strong>${stu?.name||'-'} (${stu?.studentId||'-'})<br>
      <strong>作业：</strong>${a?.title||'-'}<br>
      <strong>提交时间：</strong>${sub.submittedAt}<br>
      <strong>文字说明：</strong>${sub.text||'无'}<br>
      <strong>附件：</strong>${sub.files||'无'}
    </div>
    <div class="form-group"><label>分数 (0-100)</label><input type="number" id="gradeScore" min="0" max="100" value="${sub.score??''}" required></div>
    <div class="form-group"><label>评语</label><textarea id="gradeComment" rows="3" placeholder="给学生写评语...">${sub.comment||''}</textarea></div>`;
  document.getElementById('gradeModal').style.display = 'flex';
}
function closeGradeModal(){ document.getElementById('gradeModal').style.display='none'; currentGradeSubId=null }
function submitGrade(){
  const score=parseInt(document.getElementById('gradeScore').value);
  const comment=document.getElementById('gradeComment').value.trim();
  if(isNaN(score)||score<0||score>100) return alert('请输入0-100的分数');
  let allSubs=submissions();
  const idx=allSubs.findIndex(s=>s.id===currentGradeSubId);
  if(idx===-1) return;
  allSubs[idx]={...allSubs[idx],score,comment,gradedAt:new Date().toISOString().split('T')[0]};
  LS.set('submissions',allSubs);
  closeGradeModal();
  render();
}
