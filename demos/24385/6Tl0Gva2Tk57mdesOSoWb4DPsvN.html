<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WanderBox - 城市漫游盲盒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --khaki: #E8DCC8;
    --khaki-light: #F2EBE0;
    --khaki-dark: #C4B8A4;
    --sienna: #A0522D;
    --sienna-light: #C4713B;
    --sienna-dark: #7A3B1E;
    --forest: #4A6741;
    --forest-light: #5E7F54;
    --ink: #2C2416;
    --ink-light: #5C4F3D;
    --paper: #F5EFE6;
    --paper-dark: #E6DDD0;
    --warm-white: #FAF6F0;
    --stamp-red: #B5453A;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Grain Overlay ===== */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  /* ===== App Container ===== */
  .app {
    width: 100%; height: 100%;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    overflow: hidden;
  }

  /* ===== Top Bar ===== */
  .top-bar {
    padding: 16px 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  .top-bar .logo {
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: 22px;
    color: var(--sienna-dark);
    letter-spacing: -0.5px;
  }
  .top-bar .logo span {
    color: var(--forest);
  }
  .top-bar .location {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    color: var(--ink-light);
    background: var(--khaki-light);
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--khaki-dark);
    cursor: pointer;
    transition: all 0.3s;
  }
  .top-bar .location:hover { background: var(--khaki); }
  .top-bar .location svg { width: 14px; height: 14px; }

  /* ===== Filter Tags ===== */
  .filter-bar {
    padding: 12px 20px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    z-index: 10;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-tag {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    border: 1.5px solid var(--khaki-dark);
    background: var(--warm-white);
    color: var(--ink-light);
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
  }
  .filter-tag.active {
    background: var(--sienna);
    color: var(--warm-white);
    border-color: var(--sienna-dark);
  }
  .filter-tag:hover:not(.active) {
    border-color: var(--sienna-light);
    color: var(--sienna);
  }

  /* ===== Main Content ===== */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 24px;
    position: relative;
  }

  /* ===== Decorative Background ===== */
  .bg-decor {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-decor .circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.06;
  }
  .bg-decor .circle:nth-child(1) {
    width: 300px; height: 300px;
    background: var(--sienna);
    top: -80px; right: -100px;
  }
  .bg-decor .circle:nth-child(2) {
    width: 200px; height: 200px;
    background: var(--forest);
    bottom: 60px; left: -60px;
  }
  .bg-decor .line {
    position: absolute;
    width: 1px;
    height: 100%;
    background: linear-gradient(to bottom, transparent, var(--khaki-dark), transparent);
    opacity: 0.3;
  }
  .bg-decor .line:nth-child(3) { left: 20%; }
  .bg-decor .line:nth-child(4) { right: 25%; }

  /* ===== Blind Box Illustration ===== */
  .box-container {
    position: relative;
    width: 220px;
    height: 240px;
    margin-bottom: 32px;
    cursor: pointer;
  }
  .box-wrapper {
    width: 100%;
    height: 100%;
    animation: float 4s ease-in-out infinite;
    position: relative;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .box-wrapper.shaking {
    animation: shake 0.6s ease-in-out;
  }
  @keyframes shake {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    10% { transform: translateY(-4px) rotate(-3deg); }
    20% { transform: translateY(2px) rotate(3deg); }
    30% { transform: translateY(-6px) rotate(-2deg); }
    40% { transform: translateY(4px) rotate(2deg); }
    50% { transform: translateY(-8px) rotate(-3deg); }
    60% { transform: translateY(6px) rotate(1deg); }
    70% { transform: translateY(-4px) rotate(-2deg); }
    80% { transform: translateY(2px) rotate(1deg); }
    90% { transform: translateY(-2px) rotate(-1deg); }
  }

  /* SVG Box */
  .box-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 8px 24px rgba(44, 36, 22, 0.15));
  }

  /* Sparkles around box */
  .sparkle {
    position: absolute;
    width: 6px; height: 6px;
    background: var(--sienna-light);
    border-radius: 50%;
    opacity: 0;
    animation: sparkle 3s ease-in-out infinite;
  }
  .sparkle:nth-child(1) { top: 20px; left: 10px; animation-delay: 0s; }
  .sparkle:nth-child(2) { top: 50px; right: 5px; animation-delay: 1s; background: var(--forest-light); }
  .sparkle:nth-child(3) { bottom: 40px; left: 0; animation-delay: 2s; }
  .sparkle:nth-child(4) { top: 10px; right: 30px; animation-delay: 0.5s; background: var(--sienna); }
  .sparkle:nth-child(5) { bottom: 20px; right: 10px; animation-delay: 1.5s; background: var(--forest); }
  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0); }
    50% { opacity: 0.8; transform: scale(1); }
  }

  /* ===== Title Text ===== */
  .hero-text {
    text-align: center;
    margin-bottom: 28px;
    position: relative;
    z-index: 2;
  }
  .hero-text h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
    line-height: 1.3;
  }
  .hero-text h1 em {
    font-style: normal;
    color: var(--sienna);
  }
  .hero-text p {
    font-size: 14px;
    color: var(--ink-light);
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  /* ===== Open Button ===== */
  .open-btn {
    position: relative;
    z-index: 2;
    width: 220px;
    padding: 16px 0;
    background: var(--sienna);
    color: var(--warm-white);
    border: none;
    border-radius: 12px;
    font-family: 'Noto Serif SC', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 16px rgba(160, 82, 45, 0.3);
    /* Paper edge effect */
    background-image:
      url("data:image/svg+xml,%3Csvg width='220' height='4' viewBox='0 0 220 4' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 2 Q5 0 10 2 Q15 4 20 2 Q25 0 30 2 Q35 4 40 2 Q45 0 50 2 Q55 4 60 2 Q65 0 70 2 Q75 4 80 2 Q85 0 90 2 Q95 4 100 2 Q105 0 110 2 Q115 4 120 2 Q125 0 130 2 Q135 4 140 2 Q145 0 150 2 Q155 4 160 2 Q165 0 170 2 Q175 4 180 2 Q185 0 190 2 Q195 4 200 2 Q205 0 210 2 Q215 4 220 2' fill='%23C4713B' opacity='0.5'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: bottom center;
    background-size: 100% 4px;
  }
  .open-btn::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 14px;
    border: 2px dashed var(--sienna-light);
    opacity: 0.3;
    pointer-events: none;
  }
  .open-btn:hover {
    background: var(--sienna-dark);
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(160, 82, 45, 0.4);
  }
  .open-btn:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(160, 82, 45, 0.3);
  }

  /* ===== Fun Fact Card (Pull-down Easter Egg) ===== */
  .fun-fact {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--khaki-light);
    border: 1px solid var(--khaki-dark);
    border-radius: 12px;
    padding: 14px 18px;
    width: calc(100% - 48px);
    max-width: 360px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 20;
  }
  .fun-fact.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }
  .fun-fact .fact-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--sienna);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .fun-fact .fact-text {
    font-size: 13px;
    color: var(--ink-light);
    line-height: 1.6;
  }

  /* ===== Bottom Tab Bar ===== */
  .tab-bar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 10px 0 20px;
    background: var(--warm-white);
    border-top: 1px solid var(--khaki);
    z-index: 10;
  }
  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 4px 12px;
    transition: all 0.3s;
    border: none;
    background: none;
  }
  .tab-item svg {
    width: 24px;
    height: 24px;
    stroke: var(--ink-light);
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: all 0.3s;
  }
  .tab-item span {
    font-size: 10px;
    color: var(--ink-light);
    font-weight: 400;
    transition: all 0.3s;
  }
  .tab-item.active svg { stroke: var(--sienna); }
  .tab-item.active span { color: var(--sienna); font-weight: 600; }
  .tab-item:hover:not(.active) svg { stroke: var(--sienna-light); }

  /* ===== Clue Modal ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(44, 36, 22, 0.6);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .modal-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .clue-card {
    width: calc(100% - 48px);
    max-width: 380px;
    background: var(--paper);
    border-radius: 16px;
    overflow: hidden;
    transform: translateY(30px) scale(0.95);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 20px 60px rgba(44, 36, 22, 0.25);
  }
  .modal-overlay.visible .clue-card {
    transform: translateY(0) scale(1);
  }
  .clue-image {
    width: 100%;
    height: 180px;
    position: relative;
    overflow: hidden;
  }
  .clue-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(3px) saturate(0.7) brightness(0.8);
  }
  .clue-image .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(44,36,22,0.1), rgba(44,36,22,0.5));
  }
  .clue-image .stamp-badge {
    position: absolute;
    top: 14px;
    right: 14px;
    background: var(--stamp-red);
    color: var(--warm-white);
    font-family: 'Noto Serif SC', serif;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 6px;
    transform: rotate(3deg);
    letter-spacing: 1px;
  }
  .clue-body {
    padding: 20px 24px 24px;
  }
  .clue-body .clue-text {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    line-height: 1.8;
    color: var(--ink);
    margin-bottom: 16px;
    min-height: 60px;
  }
  .clue-body .clue-text .cursor {
    display: inline-block;
    width: 2px;
    height: 18px;
    background: var(--sienna);
    margin-left: 2px;
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  .clue-meta {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
  }
  .clue-meta-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-light);
  }
  .clue-meta-item svg {
    width: 16px; height: 16px;
    stroke: var(--sienna-light);
    fill: none;
    stroke-width: 1.5;
  }
  .clue-actions {
    display: flex;
    gap: 12px;
  }
  .clue-btn {
    flex: 1;
    padding: 14px 0;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    border: none;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .clue-btn.primary {
    background: var(--sienna);
    color: var(--warm-white);
    box-shadow: 0 4px 12px rgba(160, 82, 45, 0.25);
  }
  .clue-btn.primary:hover { background: var(--sienna-dark); }
  .clue-btn.secondary {
    background: var(--khaki-light);
    color: var(--ink-light);
    border: 1.5px solid var(--khaki-dark);
  }
  .clue-btn.secondary:hover { background: var(--khaki); }

  .modal-close {
    position: absolute;
    top: 14px;
    left: 14px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(250, 246, 240, 0.8);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    transition: all 0.3s;
  }
  .modal-close:hover { background: var(--warm-white); }
  .modal-close svg {
    width: 16px; height: 16px;
    stroke: var(--ink);
    stroke-width: 2;
    fill: none;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--ink);
    color: var(--warm-white);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.4s;
    z-index: 200;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== Pull hint ===== */
  .pull-hint {
    position: absolute;
    bottom: 88px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--khaki-dark);
    display: flex;
    align-items: center;
    gap: 4px;
    animation: fadeUp 2s ease-in-out infinite;
    z-index: 5;
  }
  @keyframes fadeUp {
    0%, 100% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
    50% { opacity: 0.8; transform: translateX(-50%) translateY(-4px); }
  }
  .pull-hint svg { width: 14px; height: 14px; stroke: var(--khaki-dark); fill: none; stroke-width: 1.5; }

  /* ===== Responsive ===== */
  @media (min-width: 431px) {
    .app {
      border-left: 1px solid var(--khaki);
      border-right: 1px solid var(--khaki);
    }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="logo">Wander<span>Box</span></div>
    <div class="location" id="locationBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span id="cityName">广州</span>
    </div>
  </div>

  <!-- Filter Tags -->
  <div class="filter-bar" id="filterBar">
    <div class="filter-tag active" data-filter="duration">半日游</div>
    <div class="filter-tag" data-filter="budget">50元内</div>
    <div class="filter-tag" data-filter="scene">单人放空</div>
    <div class="filter-tag" data-filter="theme">老巷烟火</div>
    <div class="filter-tag" data-filter="anti">屏蔽网红</div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Background Decoration -->
    <div class="bg-decor">
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>

    <!-- Blind Box Illustration -->
    <div class="box-container" id="boxContainer">
      <div class="sparkle"></div>
      <div class="sparkle"></div>
      <div class="sparkle"></div>
      <div class="sparkle"></div>
      <div class="sparkle"></div>
      <div class="box-wrapper" id="boxWrapper">
        <svg class="box-svg" viewBox="0 0 220 240" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Box body -->
          <rect x="30" y="100" width="160" height="120" rx="8" fill="#E8DCC8" stroke="#C4B8A4" stroke-width="2"/>
          <!-- Box lid -->
          <rect x="22" y="85" width="176" height="28" rx="6" fill="#C4713B" stroke="#A0522D" stroke-width="2"/>
          <!-- Lid ribbon -->
          <rect x="95" y="82" width="30" height="34" rx="4" fill="#4A6741" stroke="#3D5636" stroke-width="1.5"/>
          <!-- Box ribbon vertical -->
          <rect x="100" y="100" width="20" height="120" rx="3" fill="#5E7F54" opacity="0.3"/>
          <!-- Box ribbon horizontal -->
          <rect x="30" y="145" width="160" height="20" rx="3" fill="#5E7F54" opacity="0.3"/>
          <!-- City skyline silhouette on box -->
          <g opacity="0.15" fill="#2C2416">
            <rect x="45" y="72" width="12" height="13" rx="1"/>
            <rect x="60" y="65" width="8" height="20" rx="1"/>
            <rect x="72" y="70" width="14" height="15" rx="1"/>
            <rect x="90" y="60" width="10" height="25" rx="1"/>
            <rect x="104" y="68" width="16" height="17" rx="1"/>
            <rect x="124" y="63" width="8" height="22" rx="1"/>
            <rect x="136" y="72" width="12" height="13" rx="1"/>
            <rect x="152" y="66" width="10" height="19" rx="1"/>
            <rect x="166" y="70" width="14" height="15" rx="1"/>
          </g>
          <!-- Question mark -->
          <text x="110" y="170" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="36" font-weight="700" fill="#A0522D" opacity="0.6">?</text>
          <!-- Shadow -->
          <ellipse cx="110" cy="228" rx="70" ry="8" fill="#C4B8A4" opacity="0.3"/>
        </svg>
      </div>
    </div>

    <!-- Hero Text -->
    <div class="hero-text">
      <h1>开启你的<em>城市盲盒</em></h1>
      <p>一个装着未知目的地的漫游盒子</p>
    </div>

    <!-- Open Button -->
    <button class="open-btn" id="openBtn">开启盲盒</button>

    <!-- Pull Hint -->
    <div class="pull-hint" id="pullHint">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
      下拉发现城市冷知识
    </div>

    <!-- Fun Fact Card -->
    <div class="fun-fact" id="funFact">
      <div class="fact-label">城市冷知识</div>
      <div class="fact-text" id="factText"></div>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <div class="tab-bar">
    <button class="tab-item active" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>首页</span>
    </button>
    <button class="tab-item" data-tab="map">
      <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      <span>地图</span>
    </button>
    <button class="tab-item" data-tab="stamps">
      <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <span>集章</span>
    </button>
    <button class="tab-item" data-tab="me">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>我的</span>
    </button>
  </div>
</div>

<!-- Clue Modal -->
<div class="modal-overlay" id="clueModal">
  <div class="clue-card">
    <div class="clue-image">
      <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=400&h=200&fit=crop" alt="目的地氛围图" crossorigin="anonymous">
      <div class="overlay"></div>
      <div class="stamp-badge">线索卡</div>
      <button class="modal-close" id="modalClose">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="clue-body">
      <div class="clue-text" id="clueText"><span class="cursor"></span></div>
      <div class="clue-meta">
        <div class="clue-meta-item">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>约2-3小时</span>
        </div>
        <div class="clue-meta-item">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span>30-50元</span>
        </div>
        <div class="clue-meta-item">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M13 17h8"/><path d="M9 7H2"/><path d="M13 7l-4 5 4 5"/></svg>
          <span>步行可达</span>
        </div>
      </div>
      <div class="clue-actions">
        <button class="clue-btn secondary" id="rerollBtn">换一个</button>
        <button class="clue-btn primary" id="goBtn">出发前往</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function() {
  // ===== Data =====
  const clues = [
    '藏在90年代老社区里的糖水铺，老板做了三十年双皮奶，门口的木桌椅已经磨得发亮。',
    '一条只有本地人才知道的巷子尽头，有家没有招牌的旧书店，推开吱呀作响的木门，满屋都是泛黄的旧纸香。',
    '菜市场二楼拐角处的小窗，一位阿婆每天下午三点开始卖自己做的萝卜糕，卖完就收摊。',
    '废弃厂房改造的独立画廊，藏在铁锈斑驳的大门后面，每个月换一次展，从不做宣传。',
    '老城区河涌边的石凳上，傍晚总有人拉二胡，旁边的大榕树下，猫在打盹，时光很慢。',
    '社区活动中心后面的天台花园，一位退休老师种满了各种香草，偶尔会请路人喝茶。',
  ];

  const funFacts = [
    '广州的东山口曾是民国时期归国华侨的聚居地，至今保留着大量中西合璧的洋楼建筑。',
    '成都的玉林路其实并不长，但赵雷的一首歌让它成了文艺青年的朝圣地。',
    '北京的胡同名字千奇百怪：帽儿胡同、雨儿胡同、菊儿胡同……据说有上千条。',
    '上海的武康大楼建于1924年，因为独特的三角形外观被称为「熨斗大楼」。',
  ];

  const cities = ['广州', '成都', '北京', '上海', '杭州', '南京', '武汉', '长沙'];

  // ===== DOM =====
  const boxWrapper = document.getElementById('boxWrapper');
  const boxContainer = document.getElementById('boxContainer');
  const openBtn = document.getElementById('openBtn');
  const clueModal = document.getElementById('clueModal');
  const clueText = document.getElementById('clueText');
  const modalClose = document.getElementById('modalClose');
  const rerollBtn = document.getElementById('rerollBtn');
  const goBtn = document.getElementById('goBtn');
  const toast = document.getElementById('toast');
  const funFact = document.getElementById('funFact');
  const factText = document.getElementById('factText');
  const pullHint = document.getElementById('pullHint');
  const cityName = document.getElementById('cityName');
  const filterBar = document.getElementById('filterBar');

  let isAnimating = false;
  let factVisible = false;

  // ===== Filter Tags =====
  filterBar.addEventListener('click', (e) => {
    const tag = e.target.closest('.filter-tag');
    if (!tag) return;
    tag.classList.toggle('active');
  });

  // ===== City Switch =====
  document.getElementById('locationBtn').addEventListener('click', () => {
    const current = cityName.textContent;
    let next;
    do {
      next = cities[Math.floor(Math.random() * cities.length)];
    } while (next === current && cities.length > 1);
    cityName.textContent = next;
    showToast(`已切换到 ${next}`);
  });

  // ===== Open Blind Box =====
  openBtn.addEventListener('click', () => {
    if (isAnimating) return;
    isAnimating = true;

    // Shake animation
    boxWrapper.classList.remove('shaking');
    void boxWrapper.offsetWidth;
    boxWrapper.classList.add('shaking');

    setTimeout(() => {
      boxWrapper.classList.remove('shaking');
      // Show clue card
      showClueCard();
      isAnimating = false;
    }, 700);
  });

  // ===== Clue Card =====
  function showClueCard() {
    const clue = clues[Math.floor(Math.random() * clues.length)];
    clueModal.classList.add('visible');
    clueText.innerHTML = '<span class="cursor"></span>';

    // Typewriter effect
    let i = 0;
    const text = clue;
    const interval = setInterval(() => {
      if (i < text.length) {
        clueText.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
        i++;
      } else {
        clearInterval(interval);
        // Remove cursor after typing
        setTimeout(() => {
          clueText.innerHTML = text;
        }, 1500);
      }
    }, 60);
  }

  function hideClueCard() {
    clueModal.classList.remove('visible');
  }

  modalClose.addEventListener('click', hideClueCard);
  clueModal.addEventListener('click', (e) => {
    if (e.target === clueModal) hideClueCard();
  });

  rerollBtn.addEventListener('click', () => {
    hideClueCard();
    setTimeout(() => {
      showToast('已为你重新抽取一个盲盒');
      setTimeout(() => showClueCard(), 600);
    }, 400);
  });

  goBtn.addEventListener('click', () => {
    hideClueCard();
    showToast('正在规划路线，前往目的地...');
  });

  // ===== Pull-down Easter Egg =====
  let startY = 0;
  let isPulling = false;
  const mainContent = document.querySelector('.main-content');

  mainContent.addEventListener('touchstart', (e) => {
    if (window.scrollY === 0) {
      startY = e.touches[0].clientY;
      isPulling = true;
    }
  });

  mainContent.addEventListener('touchmove', (e) => {
    if (!isPulling) return;
    const diff = e.touches[0].clientY - startY;
    if (diff > 60 && !factVisible) {
      showFunFact();
    }
  });

  mainContent.addEventListener('touchend', () => {
    isPulling = false;
  });

  // Mouse pull simulation
  let mouseStartY = 0;
  let mousePulling = false;
  mainContent.addEventListener('mousedown', (e) => {
    mouseStartY = e.clientY;
    mousePulling = true;
  });
  mainContent.addEventListener('mousemove', (e) => {
    if (!mousePulling) return;
    const diff = e.clientY - mouseStartY;
    if (diff > 60 && !factVisible) {
      showFunFact();
    }
  });
  mainContent.addEventListener('mouseup', () => { mousePulling = false; });

  function showFunFact() {
    factVisible = true;
    pullHint.style.display = 'none';
    factText.textContent = funFacts[Math.floor(Math.random() * funFacts.length)];
    funFact.classList.add('visible');
    setTimeout(() => {
      funFact.classList.remove('visible');
      pullHint.style.display = '';
      factVisible = false;
    }, 4000);
  }

  // ===== Tab Bar =====
  document.querySelectorAll('.tab-item').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const tabName = tab.dataset.tab;
      if (tabName !== 'home') {
        showToast(`${tabName === 'map' ? '地图' : tabName === 'stamps' ? '集章' : '我的'}页面开发中`);
      }
    });
  });

  // ===== Toast =====
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('visible');
    setTimeout(() => toast.classList.remove('visible'), 2500);
  }

  // ===== Box click also triggers shake =====
  boxContainer.addEventListener('click', () => {
    if (isAnimating) return;
    isAnimating = true;
    boxWrapper.classList.remove('shaking');
    void boxWrapper.offsetWidth;
    boxWrapper.classList.add('shaking');
    setTimeout(() => {
      boxWrapper.classList.remove('shaking');
      isAnimating = false;
    }, 600);
  });

})();
</script>
</body>
</html>
