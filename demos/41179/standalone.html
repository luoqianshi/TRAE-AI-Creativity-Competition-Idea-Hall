本政策生效日期：${bh}。

【重要声明】本服务为完全免费的公益性健康管理工具，所有存储服务与AI算力分析均不收取任何费用。我们承诺：所有数据处理行为不涉及任何商业目的，不会将您的信息用于商业广告、精准营销或任何形式的商业变现。数据采集后将进行匿名化处理，仅用于医学科研研究，以推动医疗健康领域的公益发展。

我们依据《中华人民共和国民法典》《中华人民共和国个人信息保护法》《中华人民共和国网络安全法》《中华人民共和国数据安全法》以及《微信小程序平台运营规范》等相关法律法规制定本政策。`},{icon:ll,title:"一、我们收集哪些信息",content:`1.1 您主动提供的信息
- 个人基本资料：姓名、性别、年龄、手机号码
- 健康医疗信息：病历资料、检查检验报告、诊断结果、用药记录、手术记录、过敏史
- 家庭成员信息：您授权管理的家庭成员姓名、与您的关系及其健康信息
- 就诊信息：就诊医院、科室、医生、就诊时间

1.2 您使用服务过程中产生的信息
- 操作日志：拍照上传、手动录入、数据导出等操作记录
- 设备信息：设备型号、操作系统版本（用于兼容性适配）
- 网络日志：IP地址、访问时间、异常错误日志

1.3 通过第三方授权获取的信息
- 微信头像、昵称（用于小程序基本展示）
- 微信步数（仅在您授权同步健康数据时获取）

⚠ 特别说明：您的健康医疗信息属于《个人信息保护法》规定的"敏感个人信息"。我们仅在您主动上传或录入时收集此类信息。`},{icon:tl,title:"二、我们如何使用您的信息",content:`2.1 为实现核心服务功能（全部免费）
- 为您免费提供病历资料的存储、管理和展示服务
- 提供基于AI算力的病历信息智能识别与分析功能（不收费）
- 提供病历搜索、分类整理、时间线查看等管理功能
- 生成健康摘要供您就诊时参考使用

2.2 为提升服务安全与体验
- 验证您的身份，保障账号安全
- 排查和处理系统故障、安全风险

2.3 经匿名化处理后的科研用途
- 在去除所有可识别个人信息后，匿名化数据可能用于医学科研研究
- 科研目的仅限于推动医疗健康领域的公益发展，不涉及任何商业行为
- 匿名化处理确保无法反向识别到任何特定个人
- 您可随时在"我的"页面的"科研数据共享"设置中选择不参与（默认开启）

2.4 我们明确不会将您的信息用于以下用途
- ❌ 不涉及任何商业行为，不用于商业广告推送
- ❌ 不向任何第三方出售您的个人信息
- ❌ 不基于您的健康数据进行商业用户画像分析
- ❌ 不将未匿名化的原始数据用于任何商业变现`},{icon:cy,title:"三、信息存储与安全保护",content:`3.1 存储地点
所有用户数据均存储在中华人民共和国境内的服务器上。

3.2 安全措施
- 传输加密：TLS 1.3协议加密
- 存储加密：AES-256加密算法
- 访问控制：严格的内部人员权限管理
- 应用锁：面容识别、指纹识别验证

3.3 保存期限
- 账号存续期间：数据持续保存
- 账号注销后：30天内彻底清除
- 法律要求：按法律法规规定执行`},{icon:Fr,title:"四、信息共享与披露",content:`4.1 仅在以下情形共享
- 您主动使用"分享给家人"或"分享给医生"功能时
- 为提供免费存储服务委托第三方云服务商处理，签署严格保密协议
- 经匿名化处理后的数据，可能用于非营利性医学科研合作
- 根据法律法规要求，配合司法机关、行政机关依法查询

4.2 以下情形不共享（不涉及任何商业行为）
- 未经您明确同意，不与第三方共享可识别您身份的健康数据
- 不与保险公司、医药企业等商业机构共享任何健康信息
- 不涉及任何商业合作，不会将数据用于商业目的
- 不会将未匿名化的数据作为公开数据集发布`},{icon:Fy,title:"五、您的权利",content:`5.1 查阅与复制：随时查看自己上传的病历资料
5.2 更正与补充：可自行修改或删除后重新上传
5.3 删除：可随时删除单条病历、搜索历史、健康指标数据
5.4 撤回同意：可在微信设置中撤回授权
5.5 注销账号：在"我的"页面选择"账号注销"，7个工作日内处理
5.6 投诉与举报：可向网信部门、市场监管部门投诉`},{icon:Wt,title:"六、敏感个人信息保护",content:`您的健康医疗信息属于"敏感个人信息"。我们采取以下特别保护措施：

- 单独同意：首次涉及敏感信息功能时弹窗获取单独同意
- 最小必要：仅收集服务功能所必需的健康数据
- 加密存储：敏感信息字段采用额外加密措施
- AI算力安全：所有AI分析在加密环境中进行，不保留临时缓存，完全免费
- 匿名化处理：科研用数据在导出前经过多重匿名化脱敏处理，确保无法反向识别
- 访问留痕：对敏感数据的访问操作进行日志记录
- 传输安全：敏感信息传输采用端到端加密

根据《个人信息保护法》，处理敏感个人信息应当具有特定目的和充分必要性。我们处理您健康信息的目的仅限于：（1）提供完全免费的个人病历管理及AI分析服务；（2）经匿名化处理后用于非营利性医学科研。所有处理均不涉及任何商业行为。`},{icon:xh,title:"七、未成年人保护",content:`本服务主要面向成年人用户。

- 不为未满14周岁的未成年人独立提供服务
- 14-18周岁青少年用户建议在监护人陪同下使用
- 如发现未成年人未经同意使用本服务，请联系我们`},{icon:ty,title:"八、Cookie与同类技术",content:`本服务为微信小程序，不使用浏览器Cookie技术。仅在本地存储：

- localStorage：搜索历史（仅在设备上，不上传服务器）
- 小程序本地缓存：提升页面加载速度和离线查看
- 设置偏好：大字模式、隐私锁设置等`},{icon:ol,title:"九、信息安全事件处置",content:`如发生个人信息安全事件，我们将：

- 立即启动应急预案，采取补救措施
- 及时向您告知安全事件的基本情况和影响
- 履行安全事件报告义务
- 配合监管部门开展调查和处理`},{icon:bi,title:"十、政策更新",content:`我们可能根据法律法规变化或服务功能调整适时更新本政策。

- 一般性调整在本页面更新

请您在使用本服务前仔细阅读本协议。如您不同意本协议的任何内容，请不要使用本服务。您点击"同意"或使用本服务即视为您已阅读并同意接受本协议的约束。`},{icon:al,title:"二、服务内容与范围",content:`2.1 我们为您提供的服务（全部免费）包括：
- 个人及家庭成员的病历资料免费存储与管理
- 基于AI算力的病历信息智能识别与分析（不收费）
- 医疗影像、检验报告等文件的上传与查看
- 健康指标（血压、血糖等）的录入与追踪
- 病历分享功能（分享给家人或医生）
- 用药提醒与记录

2.2 AI算力分析服务
- 我们使用AI技术对上传的病历资料进行智能识别和信息提取
- 所有AI算力分析完全免费，不收取任何费用
- AI分析结果仅供参考，不构成医疗诊断

2.3 数据采集与科研用途
- 经您明确授权后，您的数据将可能被用于医学科研研究
- 科研用数据会经过严格的匿名化处理，去除所有可识别个人信息
- 科研目的仅限于推动医疗健康领域的公益发展，不涉及任何商业行为
- 您可随时在"我的"页面的"科研数据共享"设置中选择退出（默认开启）

2.4 服务限制
- 本服务仅作为个人健康管理工具，不构成医疗诊断或治疗建议
- 我们不提供在线问诊、处方开具等医疗服务
- 如遇身体不适，请及时前往正规医疗机构就诊`},{icon:ol,title:"三、用户账号与行为规范",content:`3.1 账号管理
- 您需通过微信授权登录使用本服务
- 您应妥善保管账号信息，对账号下的所有行为负责
- 如发现账号异常，请立即联系我们

3.2 禁止行为
- 不得上传虚假、伪造的病历信息
- 不得将本服务用于商业目的或非法用途
