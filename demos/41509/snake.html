<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake - 霓虹贪吃蛇</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Mono&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Space Mono', monospace;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== 霓虹背景 ===== */
  .wrap {
    position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; width: 100%; padding: 16px; gap: 14px;
  }
  .wrap::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(0,255,136,.03) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(255,0,102,.03) 0%, transparent 50%);
  }
  .scanlines {
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background: repeating-linear-gradient(
      0deg, transparent 0px, transparent 2px,
      rgba(0,0,0,.03) 2px, rgba(0,0,0,.03) 4px
    );
  }

  /* ===== 标题 ===== */
  h1 {
    font-family:'Orbitron',monospace; font-size:1.3rem; font-weight:900;
    letter-spacing:.35em; color:#00ff88;
    text-shadow: 0 0 20px rgba(0,255,136,.4), 0 0 40px rgba(0,255,136,.15);
    position:relative; z-index:10;
  }
  h1 small {
    display:block; font-size:.6rem; letter-spacing:.5em; color:rgba(224,224,224,.25);
    margin-top:4px; text-transform:uppercase; font-weight:400;
  }

  /* ===== 分数面板 ===== */
  .score-panel {
    display:flex; align-items:center; gap:24px; position:relative; z-index:10;
  }
  .score-item { text-align:center; }
  .score-label {
    font-size:10px; letter-spacing:.25em; text-transform:uppercase;
    color:rgba(224,224,224,.35); margin-bottom:2px;
  }
  .score-val {
    font-family:'Orbitron',monospace; font-size:1.8rem; font-weight:900;
    tabular-nums;
  }
  .score-val.cur { color:#00ff88; text-shadow:0 0 20px rgba(0,255,136,.5); }
  .score-val.best { color:#ff0066; text-shadow:0 0 15px rgba(255,0,102,.4); font-size:1.3rem; }
  .score-divider {
    width:1px; height:36px;
    background: linear-gradient(to bottom, transparent, rgba(0,255,136,.3), transparent);
  }

  /* ===== 游戏容器 ===== */
  .game-wrap {
    position:relative; z-index:10;
    width:min(100vw - 32px, 600px);
    aspect-ratio:1/1;
  }
  .neon-border {
    position:absolute; inset:0; border-radius:12px;
    border:2px solid rgba(0,255,136,.3);
    box-shadow: 0 0 20px rgba(0,255,136,.15), inset 0 0 20px rgba(0,255,136,.05);
  }
  .neon-border::after {
    content:''; position:absolute; inset:-1px; border-radius:13px;
    background: linear-gradient(to bottom, rgba(0,255,136,.18), transparent, rgba(0,255,136,.04));
    pointer-events:none;
  }
  canvas {
    display:block; width:100%; height:100%; border-radius:12px;
  }

  /* ===== 覆盖层（空闲/暂停） ===== */
  .overlay {
    position:absolute; inset:0; z-index:20; border-radius:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(10,10,15,.82); backdrop-filter:blur(8px);
    transition:opacity .25s ease;
  }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .overlay-title {
    font-family:'Orbitron',monospace; font-size:1.5rem; font-weight:900;
    color:#00ff88; letter-spacing:.2em; margin-bottom:6px;
  }
  .overlay-sub { font-size:.85rem; color:rgba(224,224,224,.55); margin-bottom:18px; }
  .overlay-keys {
    display:flex; gap:8px; font-size:.75rem; color:rgba(224,224,224,.38);
  }
  .overlay-keys span { padding:3px 8px; border:1px solid rgba(224,224,224,.1); border-radius:4px; }

  /* ===== 结束弹窗 ===== */
  .gameover-overlay {
    position:absolute; inset:0; z-index:30; border-radius:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(10,10,15,.88); backdrop-filter:blur(10px);
    transition:opacity .3s ease;
  }
  .gameover-overlay.hidden { opacity:0; pointer-events:none; }
  .gameover-title {
    font-family:'Orbitron',monospace; font-size:1.6rem; font-weight:900;
    color:#ff0066; letter-spacing:.2em;
    text-shadow:0 0 30px rgba(255,0,102,.5);
  }
  .new-record {
    font-size:.85rem; color:#00ff88; letter-spacing:.15em; animation:pulse 1s infinite;
    margin-bottom:16px;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .final-score-label {
    font-size:11px; letter-spacing:.3em; text-transform:uppercase;
    color:rgba(224,224,224,.32); margin-bottom:4px;
  }
  .final-score {
    font-family:'Orbitron',monospace; font-size:3.5rem; font-weight:900;
    color:#00ff88; tabular-nums;
    text-shadow:0 0 30px rgba(0,255,136,.5), 0 0 60px rgba(0,255,136,.2);
  }
  .gameover-hint { font-size:.72rem; color:rgba(224,224,224,.26); margin-top:14px; margin-bottom:16px; }

  /* ===== 按钮 ===== */
  .btn-row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .btn {
    padding:10px 28px; border-radius:8px;
    font-family:'Space Mono',monospace; font-size:.82rem;
    letter-spacing:.12em; text-transform:uppercase; cursor:pointer;
    transition:all .2s ease; border:1px solid;
    background:transparent;
  }
  .btn-primary {
    color:#00ff88; border-color:rgba(0,255,136,.4);
    background:rgba(0,255,136,.08);
  }
  .btn-primary:hover {
    background:rgba(0,255,136,.18); border-color:rgba(0,255,136,.7);
    box-shadow:0 0 25px rgba(0,255,136,.25);
  }
  .btn-danger {
    color:#ff0066; border-color:rgba(255,0,102,.4);
    background:rgba(255,0,102,.08);
  }
  .btn-danger:hover {
    background:rgba(255,0,102,.18); border-color:rgba(255,0,102,.7);
    box-shadow:0 0 25px rgba(255,0,102,.25);
  }
  .btn-ghost {
    color:rgba(224,224,224,.5); border-color:rgba(224,224,224,.18);
  }
  .btn-ghost:hover { color:rgba(224,224,224,.8); border-color:rgba(224,224,224,.4); }
  .btn:active { transform:scale(.95); }

  /* ===== 底部提示 ===== */
  footer {
    font-size:10px; color:rgba(224,224,224,.22); letter-spacing:.1em;
    position:relative; z-index:10;
  }
  footer kbd { opacity:.55; }

  /* ===== 移动端方向键 ===== */
  .dpad {
    display:none; grid-template-columns:repeat(3,52px); grid-template-rows:repeat(2,52px);
    gap:6px; justify-content:center; position:relative; z-index:10;
  }
  @media (max-width:640px) { .dpad { display:grid; } footer { display:none; } }
  .dpad-btn {
    width:52px; height:52px; display:flex; align-items:center; justify-content:center;
    background:rgba(0,255,136,.05); border:1px solid rgba(0,255,136,.2);
    border-radius:10px; color:#00ff88; font-size:18px; cursor:pointer;
    transition:all .15s;
  }
  .dpad-btn:active { background:rgba(0,255,136,.18); transform:scale(.9); }

  /* ===== 分数动画 ===== */
  @keyframes scorePop { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }
  .score-pop { animation:scorePop .25s ease-out; }
</style>
</head>
<body>

<div class="scanlines"></div>

<div class="wrap">
  <h1>SNAKE<small>Neon Arcade Edition</small></h1>

  <div class="score-panel">
    <div class="score-item">
      <div class="score-label">Score</div>
      <div id="scoreCur" class="score-val cur">0000</div>
    </div>
    <div class="score-divider"></div>
    <div class="score-item">
      <div class="score-label">Best</div>
      <div id="scoreBest" class="score-val best">0000</div>
    </div>
  </div>

  <div class="game-wrap">
    <div class="neon-border"></div>
    <canvas id="canvas"></canvas>

    <!-- 空闲状态 -->
    <div id="overlayIdle" class="overlay">
      <div class="overlay-title">SNAKE</div>
      <div class="overlay-sub">按 空格键 或点击下方按钮开始</div>
      <div class="overlay-keys">
        <span>&#x2191;&#x2193;&#x2190;&#x2192;</span><span>或</span><span>WASD</span><span>移动</span>
      </div>
    </div>

    <!-- 暂停状态 -->
    <div id="overlayPause" class="overlay hidden">
      <div class="overlay-title" style="color:#ff0066;text-shadow:0 0 20px rgba(255,0,102,.4)">PAUSED</div>
      <div class="overlay-sub">按空格键继续</div>
    </div>

    <!-- 结束弹窗 -->
    <div id="overlayGameover" class="gameover-overlay hidden">
      <div class="gameover-title">GAME OVER</div>
      <div id="newRecord" class="new-record" style="display:none">&#9733; 新纪录 &#9733;</div>
      <div class="final-score-label">Final Score</div>
      <div id="finalScore" class="final-score">0</div>
      <div class="gameover-hint">按 空格键 快速重玩</div>
      <div class="btn-row" id="gameoverBtns"></div>
    </div>
  </div>

  <!-- 控制按钮 -->
  <div class="btn-row" id="controls"></div>

  <footer><kbd>SPACE</kbd> 开始/暂停 &nbsp;|&nbsp; <kbd>ESC</kbd> 暂停 &nbsp;|&nbsp; <kbd>&#x2191;&#x2193;&#x2190;&#x2192;</kbd> / <kbd>WASD</kbd> 移动</footer>

  <!-- 移动端方向键 -->
  <div class="dpad">
    <div></div>
    <button class="dpad-btn" data-dir="UP">&#9650;</button>
    <div></div>
    <button class="dpad-btn" data-dir="LEFT">&#9664;</button>
    <button class="dpad-btn" data-dir="DOWN">&#9660;</button>
    <button class="dpad-btn" data-dir="RIGHT">&#9654;</button>
  </div>
</div>

<script>
// ============================================================
//  配置
// ============================================================
const GRID_W = 20, GRID_H = 20;
const BASE_SPEED = 150, MIN_SPEED = 50, SPEED_STEP = 5;

const DIR_OPPOSITE = { UP:'DOWN', DOWN:'UP', LEFT:'RIGHT', RIGHT:'LEFT' };
const DIR_DELTA = { UP:[0,-1], DOWN:[0,1], LEFT:[-1,0], RIGHT:[1,0] };

// ============================================================
//  状态
// ============================================================
let status = 'idle';          // idle | playing | paused | gameover
let score = 0;
let highScore = (() => { try { return +localStorage.getItem('snake-hs')||0 } catch(e){ return 0 } })();
let snakeBody = [];
let direction = 'RIGHT';
let nextDirection = 'RIGHT';
let food = { x:0, y:0 };
let speed = BASE_SPEED;
let frameCount = 0;

// ============================================================
//  DOM
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const $scoreCur   = document.getElementById('scoreCur');
const $scoreBest  = document.getElementById('scoreBest');
const $controls   = document.getElementById('controls');
const $goBtns     = document.getElementById('gameoverBtns');
const $overlayIdle    = document.getElementById('overlayIdle');
const $overlayPause   = document.getElementById('overlayPause');
const $overlayGo      = document.getElementById('overlayGameover');
const $finalScore     = document.getElementById('finalScore');
const $newRecord      = document.getElementById('newRecord');

// ============================================================
//  工具函数
// ============================================================
function randInt(n) { return (Math.random()*n)|0; }

function spawnFood() {
  const occupied = new Set(snakeBody.map(s => s.x+','+s.y));
  const cells = [];
  for(let x=0;x<GRID_W;x++) for(let y=0;y<GRID_H;y++) if(!occupied.has(x+','+y)) cells.push({x,y});
  return cells.length ? cells[randInt(cells.length)] : { x:5, y:5 };
}

function initSnake() {
  const cx = (GRID_W/2)|0, cy = (GRID_H/2)|0;
  snakeBody = [{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  direction = nextDirection = 'RIGHT';
}

function pad4(n) { return String(n).padStart(4,'0'); }

function updateScoreUI() {
  $scoreCur.textContent = pad4(score);
  $scoreBest.textContent = pad4(highScore);
  $scoreCur.classList.remove('score-pop');
  void $scoreCur.offsetWidth; // reflow
  $scoreCur.classList.add('score-pop');
}

// ============================================================
//  状态切换
// ============================================================
function startGame() {
  initSnake();
  score = 0;
  speed = BASE_SPEED;
  frameCount = 0;
  food = spawnFood();
  status = 'playing';
  lastTickTime = 0;
  updateScoreUI();
  renderButtons();
  updateOverlays();
}

function pauseGame() { if(status==='playing'){ status='paused'; renderButtons(); updateOverlays(); } }
function resumeGame(){ if(status==='paused'){ status='playing'; renderButtons(); updateOverlays(); } }
function restartGame(){ startGame(); }

function gameOver() {
  status = 'gameover';
  const isNew = score > 0 && score >= highScore;
  if(score > highScore){ highScore = score; try{ localStorage.setItem('snake-hs',String(highScore)) }catch{} }
  updateScoreUI();
  $finalScore.textContent = score;
  $newRecord.style.display = isNew ? '' : 'none';
  renderButtons();
  updateOverlays();
}

// ============================================================
//  UI 更新
// ============================================================
function updateOverlays() {
  $overlayIdle.classList.toggle('hidden',   status!=='idle');
  $overlayPause.classList.toggle('hidden',  status!=='paused');
  $overlayGo.classList.toggle('hidden',     status!=='gameover');
}

function makeBtn(text, cls, onclick) {
  const b = document.createElement('button');
  b.className = 'btn '+cls; b.textContent = text; b.onclick = onclick;
  return b;
}

function renderButtons() {
  $controls.innerHTML = '';
  $goBtns.innerHTML = '';
  if(status==='idle' || status==='gameover') {
    const b = makeBtn(status==='gameover'?'再来一局':'开始游戏', 'btn-primary',
      status==='gameover'?restartGame:startGame);
    (status==='gameover'?$goBtns:$controls).appendChild(b);
  } else if(status==='paused') {
    $controls.appendChild(makeBtn('继续游戏','btn-primary',resumeGame));
    $controls.appendChild(makeBtn('重新开始','btn-ghost',restartGame));
  } else {
    $controls.appendChild(makeBtn('暂停','btn-danger',pauseGame));
    $controls.appendChild(makeBtn('重开','btn-ghost',restartGame));
  }
}

// ============================================================
//  输入处理
// ============================================================
const KEY_MAP = {
  ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT',
  w:'UP',W:'UP', s:'DOWN',S:'DOWN', a:'LEFT',A:'LEFT', d:'RIGHT',D:'RIGHT'
};

document.addEventListener('keydown', e => {
  if(KEY_MAP[e.key]){ e.preventDefault(); setDirection(KEY_MAP[e.key]); }
  if(e.key===' ' || e.key==='Enter'){
    e.preventDefault();
    if(status==='idle'||status==='gameover') startGame();
    else if(status==='playing') pauseGame();
    else if(status==='paused') resumeGame();
  }
  if(e.key==='Escape' && status==='playing') pauseGame();
});

function setDirection(dir) {
  if(DIR_OPPOSITE[dir] !== direction) nextDirection = dir;
}

// 移动端方向键
document.querySelectorAll('.dpad-btn').forEach(btn => {
  btn.addEventListener('touchstart', e => { e.preventDefault(); setDirection(btn.dataset.dir); });
  btn.addEventListener('mousedown', e => { e.preventDefault(); setDirection(btn.dataset.dir); });
});

// 触摸滑动
let touchStart = null;
canvas.addEventListener('touchstart', e => { touchStart = { x:e.touches[0].clientX, y:e.touches[0].clientY }; }, {passive:true});
canvas.addEventListener('touchend', e => {
  if(!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  touchStart = null;
  if(Math.max(Math.abs(dx),Math.abs(dy)) < 30) return;
  setDirection(Math.abs(dx)>Math.abs(dy) ? (dx>0?'RIGHT':'LEFT') : (dy>0?'DOWN':'UP'));
}, {passive:true});

// ============================================================
//  Canvas 尺寸
// ============================================================
function resizeCanvas() {
  const wrap = canvas.parentElement;
  const size = Math.min(wrap.clientWidth, wrap.clientHeight, 600);
  canvas.width = size; canvas.height = size;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ============================================================
//  渲染
// ============================================================
function draw() {
  const W = canvas.width, H = canvas.height;
  const cellW = W/GRID_W, cellH = H/GRID_H;

  // 清屏
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0,0,W,H);

  // 网格线
  ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth=.5;
  for(let i=0;i<=GRID_W;i++){ ctx.beginPath(); ctx.moveTo(i*cellW,0); ctx.lineTo(i*cellW,H); ctx.stroke(); }
  for(let j=0;j<=GRID_H;j++){ ctx.beginPath(); ctx.moveTo(0,j*cellH); ctx.lineTo(W,j*cellH); ctx.stroke(); }

  // 扫描线
  ctx.fillStyle = 'rgba(255,255,255,.015)';
  for(let y=0;y<H;y+=4) ctx.fillRect(0,y,W,2);

  // 食物
  const pulse = 1 + .15*Math.sin(frameCount*.08);
  const fs = cellW*pulse, fo = (cellW-fs)/2;
  ctx.save();
  ctx.shadowColor = '#ff0066';
  ctx.shadowBlur = 15 + 5*Math.sin(frameCount*.1);
  ctx.fillStyle = '#ff0066';
  ctx.beginPath();
  ctx.roundRect(food.x*cellW+fo, food.y*cellH+fo, fs, fs, fs*.2);
  ctx.fill();
  ctx.restore();

  // 蛇身
  const len = snakeBody.length;
  for(let i=0;i<len;i++){
    const seg = snakeBody[i];
    const ratio = len>1 ? i/(len-1) : 0;
    const g = Math.round(255 - ratio*153);
    const b = Math.round(136 - ratio*69);

    ctx.save();
    ctx.shadowColor = `rgba(0,${g},${b},${.8-ratio*.5})`;
    ctx.shadowBlur = 12 - ratio*8;

    const sp = i===0?1:2;
    const ss = cellW - sp*2;
    const sx = seg.x*cellW + sp, sy = seg.y*cellH + sp;

    ctx.fillStyle = `rgb(0,${g},${b})`;
    ctx.beginPath();
    ctx.roundRect(sx,sy,ss,ss, i===0?ss*.3:ss*.2);
    ctx.fill();

    // 蛇头眼睛
    if(i===0){
      ctx.fillStyle = '#0a0a0f';
      const es = ss*.18, eo = ss*.22;
      let e1x,e1y,e2x,e2y;
      switch(direction){
        case'UP':    e1x=sx+eo; e1y=sy+eo; e2x=sx+ss-eo; e2y=sy+eo; break;
        case'DOWN':  e1x=sx+eo; e1y=sy+ss-eo; e2x=sx+ss-eo; e2y=sy+ss-eo; break;
        case'LEFT':  e1x=sx+eo; e1y=sy+eo; e2x=sx+eo; e2y=sy+ss-eo; break;
        default:     e1x=sx+ss-eo; e1y=sy+eo; e2x=sx+eo; e2y=sy+ss-eo; break;
      }
      ctx.beginPath();
      ctx.arc(e1x,e1y,es,0,Math.PI*2);
      ctx.arc(e2x,e2y,es,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ============================================================
//  游戏循环
// ============================================================
let lastTickTime = 0;
let rafId = 0;

function tick() {
  direction = nextDirection;
  const head = snakeBody[0];
  const d = DIR_DELTA[direction];
  const newHead = { x: head.x+d[0], y: head.y+d[1] };

  // 墙壁 / 自身碰撞
  if(newHead.x<0 || newHead.x>=GRID_W || newHead.y<0 || newHead.y>=GRID_H ||
     snakeBody.some(s=>s.x===newHead.x && s.y===newHead.y)){
    gameOver(); return false;
  }

  snakeBody.unshift(newHead);

  // 吃食物
  if(newHead.x===food.x && newHead.y===food.y){
    score += 10;
    speed = Math.max(MIN_SPEED, speed - SPEED_STEP);
    food = spawnFood();
    updateScoreUI();
  } else {
    snakeBody.pop();
  }
  return true;
}

function loop(ts) {
  frameCount++;
  if(status === 'playing'){
    if(ts - lastTickTime >= speed){
      tick();
      lastTickTime = ts;
    }
  }
  draw();
  rafId = requestAnimationFrame(loop);
}

// ============================================================
//  初始化启动
// ============================================================
$scoreBest.textContent = pad4(highScore);
renderButtons();
updateOverlays();
initSnake();
food = spawnFood();
draw();
rafId = requestAnimationFrame(loop);

</script>
</body>
</html>
