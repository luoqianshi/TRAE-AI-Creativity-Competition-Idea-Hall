<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梦境档案馆 · Dream Archive</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#070a18;--bg2:#0d1230;--card:rgba(20,28,60,.6);
    --accent:#7c5cff;--accent2:#36d6ff;--warm:#ffb86b;--rose:#ff6b9d;
    --text:#e8ecff;--dim:#8a92c8;
    --border:rgba(124,92,255,.25);
  }
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
    overflow-x:hidden;
  }
  #starfield{position:fixed;inset:0;z-index:0;pointer-events:none}

  .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px 20px 80px}

  /* Header */
  .header{display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:16px;margin-bottom:28px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:46px;height:46px;border-radius:14px;
    background:conic-gradient(from 200deg,var(--accent),var(--accent2),var(--rose),var(--accent));
    display:flex;align-items:center;justify-content:center;font-size:22px;
    box-shadow:0 6px 24px rgba(124,92,255,.5);animation:spin 12s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand h1{font-size:22px;font-weight:700;letter-spacing:1px}
  .brand p{font-size:12px;color:var(--dim);letter-spacing:3px}
  .stats{display:flex;gap:18px}
  .stat{text-align:center}
  .stat b{display:block;font-size:22px;color:var(--accent2)}
  .stat span{font-size:11px;color:var(--dim)}

  /* Layout */
  .grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
  @media(max-width:880px){.grid{grid-template-columns:1fr}}

  .card{background:var(--card);border:1px solid var(--border);
    border-radius:18px;padding:20px;backdrop-filter:blur(10px);
    box-shadow:0 8px 32px rgba(0,0,0,.3)}
  .card h2{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);
    box-shadow:0 0 12px var(--accent2)}

  /* Constellation canvas */
  #sky{width:100%;height:340px;border-radius:14px;
    background:radial-gradient(ellipse at center,#131a3d 0%,#070a18 80%);
    cursor:crosshair;display:block}

  /* Form */
  textarea{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--border);
    border-radius:12px;color:var(--text);padding:14px;font-size:14px;
    font-family:inherit;resize:vertical;min-height:120px;outline:none;
    transition:border-color .2s}
  textarea:focus{border-color:var(--accent)}
  .form-row{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
  .form-row input{flex:1;min-width:120px;background:rgba(0,0,0,.25);
    border:1px solid var(--border);border-radius:10px;color:var(--text);
    padding:10px 12px;font-size:13px;outline:none}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;border:none;border-radius:12px;padding:12px 22px;
    font-size:14px;font-weight:600;cursor:pointer;transition:transform .15s;
    font-family:inherit}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(0)}

  /* Mood bars */
  .moods{display:flex;flex-direction:column;gap:12px;margin-top:8px}
  .mood{display:flex;align-items:center;gap:10px}
  .mood .lbl{width:64px;font-size:12px;color:var(--dim)}
  .mood .bar{flex:1;height:8px;background:rgba(255,255,255,.06);
    border-radius:4px;overflow:hidden}
  .mood .fill{height:100%;border-radius:4px;width:0;transition:width 1s ease}
  .mood .val{width:36px;text-align:right;font-size:12px;color:var(--accent2)}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .tag{background:rgba(124,92,255,.15);border:1px solid var(--border);
    color:var(--accent2);padding:4px 10px;border-radius:20px;font-size:12px}

  /* Timeline */
  .tl{max-height:300px;overflow-y:auto;padding-right:6px}
  .tl::-webkit-scrollbar{width:5px}
  .tl::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
  .item{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(124,92,255,.15)}
  .item:last-child{border:none}
  .item .date{font-size:11px;color:var(--dim);white-space:nowrap;width:72px}
  .item .body{flex:1}
  .item .title{font-size:13px;font-weight:600;margin-bottom:4px}
  .item .desc{font-size:12px;color:var(--dim);line-height:1.5}
  .item .dot{width:10px;height:10px;border-radius:50%;margin-top:3px;flex-shrink:0}

  .hint{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="wrap">

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="logo">🌙</div>
      <div>
        <h1>梦境档案馆</h1>
        <p>DREAM&nbsp;&nbsp;ARCHIVE</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="statCount">3</b><span>已归档梦境</span></div>
      <div class="stat"><b id="statLucid">1</b><span>清明梦</span></div>
      <div class="stat"><b>87%</b><span>本周睡眠质量</span></div>
    </div>
  </div>

  <div class="grid">

    <!-- Left: Constellation -->
    <div class="card">
      <h2><span class="dot"></span>梦境星图 · 点击星点查看详情</h2>
      <canvas id="sky"></canvas>
      <p class="hint">每一颗星代表一个梦境。颜色对应情绪，大小代表清晰度。相近主题的梦境会自动连成星座。</p>
    </div>

    <!-- Right: Record -->
    <div class="card">
      <h2><span class="dot"></span>记录新梦境</h2>
      <textarea id="dreamInput" placeholder="描述你的梦境，越详细越好……例如：我梦见自己在一片会发光的森林里奔跑，树上的叶子像萤火虫一样飘落……"></textarea>
      <div class="form-row">
        <input id="dreamTitle" type="text" placeholder="梦境标题（可选）">
        <button class="btn" id="analyzeBtn">✦ AI 归档</button>
      </div>

      <h2 style="margin-top:22px"><span class="dot"></span>AI 情绪与主题分析</h2>
      <div class="moods" id="moods"></div>
      <div class="tags" id="tags"></div>
      <p class="hint" id="aiHint">提交梦境后，AI 将自动提取情绪强度、核心主题与象征意象。</p>
    </div>
  </div>

  <!-- Timeline -->
  <div class="card" style="margin-top:20px">
    <h2><span class="dot"></span>梦境时间线</h2>
    <div class="tl" id="timeline"></div>
  </div>

</div>

<script>
/* ============ Starfield background ============ */
(function(){
  const c=document.getElementById('starfield'),x=c.getContext('2d');
  let w,h,stars=[];
  function resize(){w=c.width=innerWidth;h=c.height=innerHeight;
    stars=Array.from({length:160},()=>({
      x:Math.random()*w,y:Math.random()*h,
      r:Math.random()*1.4+.2,
      a:Math.random(),s:Math.random()*.02+.005
    }));}
  function draw(){
    x.clearRect(0,0,w,h);
    stars.forEach(s=>{
      s.a+=s.s;if(s.a>1||s.a<0)s.s=-s.s;
      x.beginPath();x.arc(s.x,s.y,s.r,0,7);
      x.fillStyle=`rgba(200,210,255,${s.a*.8})`;x.fill();
    });
    requestAnimationFrame(draw);
  }
  resize();draw();addEventListener('resize',resize);
})();

/* ============ Dream data ============ */
const DREAMS=[
  {date:"06-15",title:"发光森林",desc:"在会发光的森林里奔跑，树叶像萤火虫飘落。",
   mood:{欢愉:.72,神秘:.85,平静:.6,紧张:.2},tags:["森林","飞翔","萤火虫"],
   x:.25,y:.4,color:"#36d6ff",lucid:false},
  {date:"06-12",title:":深海城市",desc:"潜入海底发现一座古老城市，鲸鱼从头顶游过。",
   mood:{欢愉:.3,神秘:.9,平静:.5,紧张:.55},tags:["海洋","废墟","鲸鱼"],
   x:.6,y:.3,color:"#7c5cff",lucid:true},
  {date:"06-08",title:"云端独行者",desc:"踩在云上行走，远处有巨大的钟塔。",
   mood:{欢愉:.5,神秘:.6,平静:.8,紧张:.1},tags:["天空","钟塔","孤独"],
   x:.45,y:.7,color:"#ffb86b",lucid:false}
];

/* ============ Render constellation ============ */
const sky=document.getElementById('sky');
const sx=sky.getContext('2d');
let SW,SH,hover=-1;

function sizeSky(){
  const r=sky.getBoundingClientRect();
  SW=sky.width=r.width;SH=sky.height=r.height;
}
function drawSky(){
  sx.clearRect(0,0,SW,SH);
  // connection lines
  sx.strokeStyle='rgba(124,92,255,.2)';sx.lineWidth=1;
  for(let i=0;i<DREAMS.length;i++)for(let j=i+1;j<DREAMS.length;j++){
    const a=DREAMS[i],b=DREAMS[j];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<.5){
      sx.beginPath();
      sx.moveTo(a.x*SW,a.y*SH);sx.lineTo(b.x*SW,b.y*SH);sx.stroke();
    }
  }
  DREAMS.forEach((d,i)=>{
    const px=d.x*SW,py=d.y*SH;
    const r=10+d.mood.神秘*12;
    // glow
    const g=sx.createRadialGradient(px,py,0,px,py,r*2.5);
    g.addColorStop(0,d.color);g.addColorStop(0,hexA(d.color,.4));
    g.addColorStop(1,hexA(d.color,0));
    sx.fillStyle=g;sx.beginPath();sx.arc(px,py,r*2.5,0,7);sx.fill();
    // core
    sx.fillStyle=d.color;sx.beginPath();
    sx.arc(px,py,hover===i?r*1.2:r,0,7);sx.fill();
    if(d.lucid){
      sx.strokeStyle='#fff';sx.lineWidth=2;
      sx.beginPath();sx.arc(px,py,r+4,0,7);sx.stroke();
    }
  });
  // tooltip
  if(hover>=0){
    const d=DREAMS[hover];
    const tx=d.x*SW+16,ty=d.y*SH-10;
    sx.fillStyle='rgba(10,15,40,.95)';
    sx.strokeStyle=d.color;sx.lineWidth=1;
    const txt=`${d.title}  ${d.date}`;
    sx.font='12px PingFang SC';
    const w=sx.measureText(txt).width+16;
    sx.beginPath();sx.roundRect(tx,ty-14,w,26,6);
    sx.fill();sx.stroke();
    sx.fillStyle='#fff';sx.fillText(txt,tx+8,ty+4);
  }
}
function hexA(c,a){
  const n=parseInt(c.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}
// polyfill roundRect
if(!sx.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
  this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);
  this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};

sky.addEventListener('mousemove',e=>{
  const r=sky.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  let found=-1;
  DREAMS.forEach((d,i)=>{
    const px=d.x*SW,py=d.y*SH;
    if(Math.hypot(mx-px,my-py)<18)found=i;
  });
  if(found!==hover){hover=found;drawSky();sky.style.cursor=found>=0?'pointer':'crosshair';}
});
sky.addEventListener('click',()=>{
  if(hover>=0)showMoods(DREAMS[hover]);
});
sizeSky();drawSky();addEventListener('resize',()=>{sizeSky();drawSky();});

/* ============ Mood render ============ */
const MOOD_COLORS={欢愉:"#ffb86b",神秘:"#7c5cff",平静:"#36d6ff",紧张:"#ff6b9d"};
function showMoods(d){
  const mc=document.getElementById('moods');
  mc.innerHTML='';
  Object.entries(d.mood).forEach(([k,v])=>{
    const row=document.createElement('div');row.className='mood';
    row.innerHTML=`<span class="lbl">${k}</span>
      <div class="bar"><div class="fill" style="background:${MOOD_COLORS[k]}"></div></div>
      <span class="val">${Math.round(v*100)}%</span>`;
    mc.appendChild(row);
  });
  requestAnimationFrame(()=>{
    mc.querySelectorAll('.fill').forEach((f,i)=>{
      f.style.width=Math.round(Object.values(d.mood)[i]*100)+'%';
    });
  });
  const tg=document.getElementById('tags');
  tg.innerHTML=d.tags.map(t=>`<span class="tag">#${t}</span>`).join('');
  document.getElementById('aiHint').textContent=
    `AI 识别到 ${d.tags.length} 个核心意象，主导情绪为「${Object.entries(d.mood).sort((a,b)=>b[1]-a[1])[0][0]}」。`;
}
showMoods(DREAMS[1]);

/* ============ Timeline ============ */
function renderTL(){
  const tl=document.getElementById('timeline');
  tl.innerHTML=DREAMS.slice().reverse().map(d=>`
    <div class="item">
      <span class="date">${d.date}</span>
      <span class="dot" style="background:${d.color};box-shadow:0 0 8px ${d.color}"></span>
      <div class="body">
        <div class="title">${d.title}${d.lucid?' <span style="color:#36d6ff;font-size:11px">●清明梦</span>':''}</div>
        <div class="desc">${d.desc}</div>
      </div>
    </div>`).join('');
}
renderTL();

/* ============ Simple NLP-ish analyze ============ */
const THEME={
  "森林":{tag:"自然",mood:"神秘",w:1},"树":{tag:"自然",mood:"平静",w:.6},
  "海":{tag:"海洋",mood:"神秘",w:1},"鲸":{tag:"海洋",mood:"平静",w:.8},
  "飞":{tag:"飞翔",mood:"欢愉",w:1},"云":{tag:"天空",mood:"平静",w:.8},
  "钟":{tag:"时间",mood:"神秘",w:.7},"塔":{tag:"建筑",mood:"神秘",w:.6},
  "跑":{tag:"追逐",mood:"紧张",w:.8},"追":{tag:"追逐",mood:"紧张",w:.8},
  "光":{tag:"光",mood:"欢愉",w:.6},"火":{tag:"火",mood:"紧张",w:.7},
  "水":{tag:"水",mood:"平静",w:.6},"门":{tag:"通道",mood:"神秘",w:.5},
  "路":{tag:"旅程",mood:"平静",w:.5},"城":{tag:"城市",mood:"神秘",w:.7},
  "孤独":{tag:"孤独",mood:"平静",w:.9},"笑":{tag:"情感",mood:"欢愉",w:.8},
  "哭":{tag:"情感",mood:"紧张",w:.7},"黑":{tag:"黑暗",mood:"紧张",w:.6}
};
function analyze(text){
  const mood={欢愉:0,神秘:0,平静:0,紧张:0};
  const tags=[];const seen=new Set();
  for(const k in THEME){
    if(text.includes(k)){
      const t=THEME[k];
      mood[t.mood]+=t.w;
      if(!seen.has(t.tag)){seen.add(t.tag);tags.push(t.tag);}
    }
  }
  // baseline
  Object.keys(mood).forEach(k=>{mood[k]=Math.min(.95,.2+mood[k]*.3)});
  // ensure some variety
  if(Object.values(mood).every(v=>v<.35)){
    mood.神秘=.6;mood.平静=.5;
  }
  if(tags.length===0)tags.push("未知意象","潜意识");
  return {mood,tags:tags.slice(0,5)};
}

document.getElementById('analyzeBtn').addEventListener('click',()=>{
  const text=document.getElementById('dreamInput').value.trim();
  if(!text){alert('请先描述你的梦境 ✦');return;}
  const title=document.getElementById('dreamTitle').value.trim()||text.slice(0,8)+'…';
  const res=analyze(text);
  const palette=["#36d6ff","#7c5cff","#ffb86b","#ff6b9d","#86ffb0"];
  const newDream={
    date:new Date().toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'}).replace(/\//g,'-'),
    title,desc:text.length>50?text.slice(0,50)+'…':text,
    mood:res.mood,tags:res.tags,
    x:.15+Math.random()*.7,y:.15+Math.random()*.7,
    color:palette[Math.floor(Math.random()*palette.length)],
    lucid:Math.random()<.3
  };
  DREAMS.push(newDream);
  document.getElementById('statCount').textContent=DREAMS.length;
  document.getElementById('statLucid').textContent=DREAMS.filter(d=>d.lucid).length;
  showMoods(newDream);
  drawSky();renderTL();
  document.getElementById('dreamInput').value='';
  document.getElementById('dreamTitle').value='';
  // flash effect
  sky.style.transition='filter .3s';
  sky.style.filter='brightness(1.6)';
  setTimeout(()=>sky.style.filter='',300);
});
</script>
</body>
</html>
