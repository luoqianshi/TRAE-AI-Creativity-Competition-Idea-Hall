<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日签到</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #f59e0b;
      --primary-light: #fbbf24;
      --primary-dark: #d97706;
      --success: #10b981;
      --success-light: #34d399;
      --bg: #fafaf9;
      --surface: #ffffff;
      --text: #1f2937;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --border: #e5e7eb;
      --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 4px 20px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
      --radius: 20px;
      --radius-sm: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #fff7ed 0%, var(--bg) 40%, var(--bg) 100%);
      min-height: 100vh;
      color: var(--text);
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* 页面标题 */
    .header {
      text-align: center;
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeInUp 0.7s ease forwards;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .header .date {
      font-size: 15px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* 打卡按钮区 */
    .checkin-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeInUp 0.7s ease 0.1s forwards;
    }

    .checkin-btn-wrapper {
      position: relative;
      width: 170px;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse-ring {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245,158,11,0.15) 0%, transparent 70%);
      animation: pulse 2.5s ease-in-out infinite;
    }

    .pulse-ring:nth-child(2) {
      animation-delay: 0.8s;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 0; }
    }

    .checkin-btn {
      position: relative;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 50%, var(--primary-dark) 100%);
      box-shadow: 0 8px 32px rgba(245,158,11,0.35), inset 0 2px 4px rgba(255,255,255,0.25);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .checkin-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 12px 40px rgba(245,158,11,0.45), inset 0 2px 4px rgba(255,255,255,0.3);
    }

    .checkin-btn:active {
      transform: scale(0.95);
    }

    .checkin-btn.done {
      background: linear-gradient(135deg, var(--success-light) 0%, var(--success) 100%);
      box-shadow: 0 8px 32px rgba(16,185,129,0.35), inset 0 2px 4px rgba(255,255,255,0.25);
      cursor: default;
      pointer-events: none;
    }

    .checkin-btn.done:hover {
      transform: none;
      box-shadow: 0 8px 32px rgba(16,185,129,0.35), inset 0 2px 4px rgba(255,255,255,0.25);
    }

    .checkin-btn .icon {
      font-size: 36px;
      line-height: 1;
    }

    .checkin-btn .label {
      font-size: 16px;
    }

    .checkin-status {
      margin-top: 16px;
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
      min-height: 20px;
    }

    .checkin-status.success {
      color: var(--success);
    }

    /* 统计卡片 */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeInUp 0.7s ease 0.2s forwards;
    }

    .stat-card {
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 18px 8px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,0.03);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .stat-value {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* 卡片通用样式 */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,0.03);
      margin-bottom: 16px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeInUp 0.7s ease forwards;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
    }

    /* 日历 */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .calendar-month {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .calendar-nav {
      display: flex;
      gap: 4px;
    }

    .calendar-nav button {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }

    .calendar-nav button:hover {
      background: var(--bg);
      color: var(--text);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .calendar-weekday {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      padding: 6px 0;
    }

    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      cursor: default;
      transition: transform 0.2s ease;
      position: relative;
    }

    .calendar-day:not(.empty):hover {
      transform: scale(1.12);
    }

    .calendar-day.empty {
      cursor: default;
    }

    .calendar-day.today {
      color: var(--primary);
      font-weight: 800;
    }

    .calendar-day.checked {
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      color: #fff;
      box-shadow: 0 2px 8px rgba(245,158,11,0.3);
    }

    .calendar-day.today.checked {
      box-shadow: 0 2px 12px rgba(245,158,11,0.5);
    }

    /* 历史记录 */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      transition: transform 0.2s ease;
    }

    .history-item:hover {
      transform: translateX(4px);
    }

    .history-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      flex-shrink: 0;
    }

    .history-text {
      flex: 1;
    }

    .history-date {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .history-time {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .history-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      background: rgba(245,158,11,0.1);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* 动画 */
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes countUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Canvas 覆盖层 */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    /* 响应式 */
    @media (max-width: 400px) {
      .checkin-btn-wrapper,
      .pulse-ring {
        width: 150px;
        height: 150px;
      }
      .checkin-btn {
        width: 130px;
        height: 130px;
        font-size: 18px;
      }
      .checkin-btn .icon {
        font-size: 30px;
      }
      .stat-value {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <div class="container">
    <!-- 标题 -->
    <div class="header">
      <h1>每日签到</h1>
      <div class="date" id="current-date">--</div>
    </div>

    <!-- 打卡按钮 -->
    <div class="checkin-section">
      <div class="checkin-btn-wrapper">
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <button class="checkin-btn" id="checkin-btn">
          <span class="icon" id="btn-icon">👆</span>
          <span class="label" id="btn-label">点击打卡</span>
        </button>
      </div>
      <div class="checkin-status" id="checkin-status"></div>
    </div>

    <!-- 统计 -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="stat-streak">0</div>
        <div class="stat-label">连续签到</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-month">0</div>
        <div class="stat-label">本月签到</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">累计签到</div>
      </div>
    </div>

    <!-- 日历 -->
    <div class="card" style="animation-delay: 0.3s;">
      <div class="calendar-header">
        <div class="calendar-month" id="calendar-month">--</div>
        <div class="calendar-nav">
          <button id="prev-month">‹</button>
          <button id="next-month">›</button>
        </div>
      </div>
      <div class="calendar-grid" id="calendar-grid">
        <!-- JS 生成 -->
      </div>
    </div>

    <!-- 历史 -->
    <div class="card" style="animation-delay: 0.4s;">
      <div class="card-title">
        <div class="dot"></div>
        最近签到
      </div>
      <div class="history-list" id="history-list">
        <!-- JS 生成 -->
      </div>
    </div>
  </div>

  <script>
    // ==================== 数据管理 ====================
    const STORAGE_KEY = 'checkin_records';

    function getRecords() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
      } catch {
        return [];
      }
    }

    function saveRecords(records) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseDate(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    // ==================== 状态 ====================
    let records = getRecords();
    let currentMonth = new Date();
    const todayStr = formatDate(new Date());

    // ==================== DOM 元素 ====================
    const currentDateEl = document.getElementById('current-date');
    const checkinBtn = document.getElementById('checkin-btn');
    const btnIcon = document.getElementById('btn-icon');
    const btnLabel = document.getElementById('btn-label');
    const checkinStatus = document.getElementById('checkin-status');
    const statStreak = document.getElementById('stat-streak');
    const statMonth = document.getElementById('stat-month');
    const statTotal = document.getElementById('stat-total');
    const calendarMonth = document.getElementById('calendar-month');
    const calendarGrid = document.getElementById('calendar-grid');
    const historyList = document.getElementById('history-list');
    const prevMonthBtn = document.getElementById('prev-month');
    const nextMonthBtn = document.getElementById('next-month');

    // ==================== 初始化日期显示 ====================
    const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const now = new Date();
    currentDateEl.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${weekdays[now.getDay()]}`;

    // ==================== 统计计算 ====================
    function calculateStreak() {
      if (records.length === 0) return 0;
      const sorted = [...records].sort((a, b) => parseDate(b) - parseDate(a));
      let streak = 0;
      let checkDate = new Date();
      checkDate.setHours(0, 0, 0, 0);

      // 如果今天没打卡，从昨天开始算
      const todayFormatted = formatDate(checkDate);
      if (!sorted.includes(todayFormatted)) {
        checkDate.setDate(checkDate.getDate() - 1);
      }

      for (const dateStr of sorted) {
        const expected = formatDate(checkDate);
        if (dateStr === expected) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else if (parseDate(dateStr) < checkDate) {
          break;
        }
      }
      return streak;
    }

    function calculateMonthCount() {
      const y = now.getFullYear();
      const m = now.getMonth() + 1;
      const prefix = `${y}-${String(m).padStart(2, '0')}`;
      return records.filter(r => r.startsWith(prefix)).length;
    }

    // ==================== 动画数字 ====================
    function animateNumber(el, target, duration = 800) {
      const start = parseInt(el.textContent) || 0;
      if (start === target) return;
      const startTime = performance.now();

      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(start + (target - start) * ease);
        el.textContent = current;
        if (progress < 1) requestAnimationFrame(update);
      }
      requestAnimationFrame(update);
    }

    // ==================== 更新统计 ====================
    function updateStats(animated = false) {
      const streak = calculateStreak();
      const month = calculateMonthCount();
      const total = records.length;

      if (animated) {
        animateNumber(statStreak, streak);
        animateNumber(statMonth, month);
        animateNumber(statTotal, total);
      } else {
        statStreak.textContent = streak;
        statMonth.textContent = month;
        statTotal.textContent = total;
      }
    }

    // ==================== 渲染日历 ====================
    function renderCalendar() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      calendarMonth.textContent = `${year}年${month + 1}月`;

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startWeekday = firstDay.getDay();

      const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
      let html = weekDays.map(w => `<div class="calendar-weekday">${w}</div>`).join('');

      for (let i = 0; i < startWeekday; i++) {
        html += `<div class="calendar-day empty"></div>`;
      }

      const today = new Date();
      const isCurrentMonth = year === today.getFullYear() && month === today.getMonth();

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isToday = isCurrentMonth && d === today.getDate();
        const isChecked = records.includes(dateStr);
        const classes = ['calendar-day'];
        if (isToday) classes.push('today');
        if (isChecked) classes.push('checked');
        html += `<div class="${classes.join(' ')}">${d}</div>`;
      }

      calendarGrid.innerHTML = html;
    }

    prevMonthBtn.addEventListener('click', () => {
      currentMonth.setMonth(currentMonth.getMonth() - 1);
      renderCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
      currentMonth.setMonth(currentMonth.getMonth() + 1);
      renderCalendar();
    });

    // ==================== 渲染历史 ====================
    function renderHistory() {
      const sorted = [...records].sort((a, b) => parseDate(b) - parseDate(a)).slice(0, 7);

      if (sorted.length === 0) {
        historyList.innerHTML = '<div class="empty-state">还没有打卡记录，快去打卡吧！</div>';
        return;
      }

      historyList.innerHTML = sorted.map((dateStr, index) => {
        const date = parseDate(dateStr);
        const isToday = dateStr === todayStr;
        const weekDay = weekdays[date.getDay()];
        return `
          <div class="history-item" style="animation: popIn 0.4s ease ${index * 0.05}s both;">
            <div class="history-icon">✓</div>
            <div class="history-text">
              <div class="history-date">${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 ${weekDay}</div>
              <div class="history-time">坚持打卡</div>
            </div>
            ${isToday ? '<div class="history-badge">今日</div>' : ''}
          </div>
        `;
      }).join('');
    }

    // ==================== 打卡逻辑 ====================
    function isCheckedInToday() {
      return records.includes(todayStr);
    }

    function updateCheckinUI() {
      if (isCheckedInToday()) {
        checkinBtn.classList.add('done');
        btnIcon.textContent = '✓';
        btnLabel.textContent = '已打卡';
        checkinStatus.textContent = '今日已完成打卡，明天再来吧！';
        checkinStatus.classList.add('success');
      } else {
        checkinBtn.classList.remove('done');
        btnIcon.textContent = '👆';
        btnLabel.textContent = '点击打卡';
        checkinStatus.textContent = '';
        checkinStatus.classList.remove('success');
      }
    }

    checkinBtn.addEventListener('click', () => {
      if (isCheckedInToday()) return;

      records.push(todayStr);
      saveRecords(records);

      updateCheckinUI();
      updateStats(true);
      renderCalendar();
      renderHistory();
      fireConfetti();
    });

    // ==================== 庆祝动画 (Canvas Confetti) ====================
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 12 + 4;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 4;
        this.gravity = 0.35;
        this.friction = 0.96;
        this.size = Math.random() * 8 + 4;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 10;
        const colors = ['#f59e0b', '#fbbf24', '#f472b6', '#34d399', '#60a5fa', '#a78bfa', '#f87171'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.life = 1;
        this.decay = Math.random() * 0.015 + 0.008;
      }

      update() {
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.rotationSpeed;
        this.life -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        ctx.restore();
      }
    }

    function fireConfetti() {
      const rect = checkinBtn.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      for (let i = 0; i < 80; i++) {
        particles.push(new Particle(centerX, centerY));
      }

      if (particles.length <= 80) {
        animateConfetti();
      }
    }

    function animateConfetti() {
      if (particles.length === 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(animateConfetti);
    }

    // ==================== 初始化 ====================
    updateCheckinUI();
    updateStats(false);
    renderCalendar();
    renderHistory();
  </script>
</body>
</html>
