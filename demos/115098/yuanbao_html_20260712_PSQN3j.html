<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绘梦工坊 - 每一个涂鸦，都是心里的小宇宙</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background-color: #FFF9F0; /* 暖白背景 */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #5D4037;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #FF8A65; /* 暖橙色 */
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            font-size: 1.2em;
            color: #8D6E63;
            max-width: 600px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            width: 100%;
            max-width: 1200px;
        }
        .panel {
            flex: 1;
            min-width: 300px;
            max-width: 450px;
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 25px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .panel:hover {
            transform: translateY(-5px);
        }
        .panel h2 {
            color: #4DB6AC; /* 青绿色 */
            margin-top: 0;
        }
        .canvas-area {
            width: 100%;
            height: 350px;
            border: 3px dashed #FFCCBC;
            border-radius: 16px;
            background-color: #FFF3E0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .canvas-area img {
            max-width: 90%;
            max-height: 90%;
        }
        .btn {
            background-color: #FF8A65;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s;
            box-shadow: 0 4px 15px rgba(255,138,101,0.4);
        }
        .btn:hover {
            background-color: #FF7043;
        }
        .ai-result {
            border-color: #B2DFDB;
            background-color: #E0F2F1;
        }
        .caption {
            font-style: italic;
            color: #A1887F;
            margin-top: 15px;
            font-size: 0.95em;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            color: #8D6E63;
            font-weight: bold;
            font-size: 1.1em;
            padding: 20px;
            border-top: 1px solid #FFE0B2;
            width: 100%;
            max-width: 800px;
        }
        /* 模拟简笔画样式 */
        .sketch svg {
            stroke: #5D4037;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
        }
        /* 模拟AI生成画样式 */
        .artwork {
            background: linear-gradient(135deg, #FFECB3 0%, #C5E1A5 100%);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎨 绘梦工坊</h1>
        <p>专为乡村儿童打造的无障碍 AI 绘画疗愈空间。无需画笔，指尖轻点，让心中的色彩飞出来。</p>
    </div>

    <div class="container">
        <!-- 左侧：我的画板 -->
        <div class="panel">
            <h2>👧 我的画板</h2>
            <div class="canvas-area sketch">
                <!-- 模拟一只简笔画的小猫 -->
                <svg viewBox="0 0 200 200" width="200" height="200">
                    <!-- 头 -->
                    <circle cx="100" cy="80" r="40"/>
                    <!-- 耳朵 -->
                    <path d="M70 50 L60 20 L85 45"/>
                    <path d="M130 50 L140 20 L115 45"/>
                    <!-- 眼睛 -->
                    <circle cx="85" cy="75" r="4"/>
                    <circle cx="115" cy="75" r="4"/>
                    <!-- 嘴巴 -->
                    <path d="M100 90 Q100 100 90 95"/>
                    <!-- 身体 -->
                    <path d="M100 120 Q80 180 60 200"/>
                    <path d="M100 120 Q120 180 140 200"/>
                    <!-- 尾巴 -->
                    <path d="M140 200 Q160 190 150 170" stroke-dasharray="5,5"/>
                </svg>
            </div>
            <p class="caption">“这是我家的小猫，但是它少了一条腿。”</p>
        </div>

        <!-- 右侧：AI 魔法生成 -->
        <div class="panel ai-result">
            <h2>✨ AI 帮我画</h2>
            <div class="canvas-area artwork">
                <!-- 模拟AI生成的精美画面 -->
                <svg viewBox="0 0 200 200" width="220">
                    <!-- 背景 -->
                    <rect width="200" height="200" fill="#87CEEB"/>
                    <circle cx="180" cy="30" r="15" fill="#FFF9C4"/>
                    <!-- 草地 -->
                    <path d="M0 150 Q50 120 100 140 T200 130 L200 200 L0 200 Z" fill="#81C784"/>
                    <!-- 小猫身体 -->
                    <ellipse cx="100" cy="130" rx="35" ry="25" fill="#FFE0B2"/>
                    <!-- 小猫头 -->
                    <circle cx="100" cy="95" r="28" fill="#FFE0B2"/>
                    <!-- 耳朵 -->
                    <path d="M80 75 L75 55 L90 75" fill="#FFE0B2"/>
                    <path d="M120 75 L125 55 L110 75" fill="#FFE0B2"/>
                    <!-- 眼睛 -->
                    <ellipse cx="92" cy="95" rx="3" ry="5" fill="#4E342E"/>
                    <ellipse cx="108" cy="95" rx="3" ry="5" fill="#4E342E"/>
                    <!-- 鼻子 -->
                    <circle cx="100" cy="103" r="2" fill="#FF8A65"/>
                    <!-- 修复的腿 -->
                    <ellipse cx="75" cy="155" rx="5" ry="10" fill="#FFE0B2"/>
                    <ellipse cx="100" cy="165" rx="5" ry="10" fill="#FFE0B2"/>
                    <ellipse cx="125" cy="155" rx="5" ry="10" fill="#FFE0B2"/>
                    <!-- 尾巴 -->
                    <path d="M135 140 Q160 120 150 90" stroke="#FFE0B2" stroke-width="8" fill="none"/>
                    <!-- 蝴蝶 -->
                    <circle cx="50" cy="60" r="5" fill="#FFCDD2"/>
                    <path d="M50 60 L40 50 M50 60 L60 50 M50 65 L45 75 M50 65 L55 75" stroke="#FF9800" stroke-width="1.5"/>
                </svg>
            </div>
            <button class="btn">🪄 让颜色飞出来</button>
            <p class="caption">AI 读懂了孩子的思念，为小猫补上了腿，并画出了阳光下的草地。</p>
        </div>
    </div>

    <div class="footer">
        “每一个涂鸦，都是孩子心里藏着的小宇宙。” —— 绘梦工坊 · 社会公益赛道
    </div>

</body>
</html>
