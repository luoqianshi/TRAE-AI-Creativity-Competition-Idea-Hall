<body>

<div class="bg-grid"></div>

<div class="app-container">
  <!-- Header -->
  <header class="app-header">
    <div class="logo-area">
      <div class="logo-icon">&#128203;</div>
      <div class="logo-text">
        <h1>ClipVault</h1>
        <p>SMART CLIPBOARD MANAGER</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="exportData()" title="导出数据">
        &#128230; 导出
      </button>
      <button class="btn btn-danger" onclick="clearAll()" title="清空全部">
        &#128465; 清空
      </button>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-icon green">&#128196;</div>
      <div class="stat-info">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">总条目</div>
      </div>
    </div>
    <div class="stat-item">
      <div class="stat-icon yellow">&#128172;</div>
      <div class="stat-info">
        <div class="stat-value" id="statText">0</div>
        <div class="stat-label">文字</div>
      </div>
    </div>
    <div class="stat-item">
      <div class="stat-icon blue">&#128247;</div>
      <div class="stat-info">
        <div class="stat-value" id="statImage">0</div>
        <div class="stat-label">图片</div>
      </div>
    </div>
  </div>

  <!-- Paste Zone -->
  <div class="paste-zone" id="pasteZone"
       tabindex="0"
       ondragover="handleDragOver(event)"
       ondragleave="handleDragLeave(event)"
       ondrop="handleDrop(event)"
       onclick="focusPasteZone()">
    <div class="paste-zone-content">
      <span class="paste-icon">&#128203;</span>
      <h2>在此处粘贴内容</h2>
      <p>
        按 <span class="shortcut">Ctrl</span> + <span class="shortcut">V</span> 粘贴 &nbsp;|&nbsp;
        拖拽图片到此处 &nbsp;|&nbsp;
        点击此区域后粘贴
      </p>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">&#128269;</span>
      <input type="text" id="searchInput" placeholder="搜索剪贴板内容..." oninput="renderItems()">
    </div>
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all" onclick="setFilter('all', this)">全部</button>
      <button class="filter-tab" data-filter="text" onclick="setFilter('text', this)">文字</button>
      <button class="filter-tab" data-filter="image" onclick="setFilter('image', this)">图片</button>
    </div>
  </div>

  <div class="item-count" id="itemCount"></div>

  <!-- Clipboard Grid -->
  <div class="clipboard-grid" id="clipboardGrid"></div>

  <!-- Empty State -->
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon">&#128194;</div>
    <h3>剪贴板是空的</h3>
    <p>复制或粘贴任何文字、图片到这里，它们会被安全保存，随时可以找回</p>
  </div>
</div>

<!-- Hidden textarea for paste -->
<textarea id="hiddenPaste" style="position:fixed;left:-9999px;top:-9999px;opacity:0;" tabindex="-1"></textarea>

<script>
// Global state (outside IIFE so functions are accessible)
let clipboardItems = JSON.parse(localStorage.getItem('clipvault_items') || '[]');
let currentFilter = 'all';

const grid = document.getElementById('clipboardGrid');
const emptyState = document.getElementById('emptyState');
const pasteZone = document.getElementById('pasteZone');
const hiddenPaste = document.getElementById('hiddenPaste');
const searchInput = document.getElementById('searchInput');

// Initialize
renderItems();
updateStats();

// Global paste listener
document.addEventListener('paste', function(e) {
  e.preventDefault();
  const items = e.clipboardData.items;

  for (let i = 0; i < items.length; i++) {
    const item = items[i];

    if (item.type.indexOf('image') !== -1) {
      const blob = item.getAsFile();
      const reader = new FileReader();
      reader.onload = function(ev) {
        addItem({
          type: 'image',
          content: ev.target.result,
          timestamp: Date.now()
        });
      };
      reader.readAsDataURL(blob);
    } else if (item.type.indexOf('text') !== -1) {
      item.getAsString(function(text) {
        if (text && text.trim()) {
          addItem({
            type: 'text',
            content: text,
            timestamp: Date.now()
          });
        }
      });
    }
  }
});

// Drag & Drop
function handleDragOver(e) {
  e.preventDefault();
  e.stopPropagation();
  pasteZone.classList.add('drag-over');
}

function handleDragLeave(e) {
  e.preventDefault();
  e.stopPropagation();
  pasteZone.classList.remove('drag-over');
}

function handleDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  pasteZone.classList.remove('drag-over');

  const files = e.dataTransfer.files;
  for (let i = 0; i < files.length; i++) {
    if (files[i].type.indexOf('image') !== -1) {
      const reader = new FileReader();
      reader.onload = function(ev) {
        addItem({
          type: 'image',
          content: ev.target.result,
          timestamp: Date.now()
        });
      };
      reader.readAsDataURL(files[i]);
    }
  }
}

function focusPasteZone() {
  hiddenPaste.focus();
}

// Add item
function addItem(item) {
  item.id = Date.now() + '_' + Math.random().toString(36).substr(2, 9);
  clipboardItems.unshift(item);
  save();
  renderItems();
  updateStats();
  showToast('已添加到剪贴板');
}

// Save
function save() {
  try {
    localStorage.setItem('clipvault_items', JSON.stringify(clipboardItems));
  } catch(e) {
    // Storage full - remove oldest items
    while (clipboardItems.length > 0) {
      try {
        localStorage.setItem('clipvault_items', JSON.stringify(clipboardItems));
        break;
      } catch(e2) {
        clipboardItems.pop();
      }
    }
  }
}

// Render
function renderItems() {
  const query = searchInput.value.toLowerCase().trim();
  let filtered = clipboardItems;

  if (currentFilter !== 'all') {
    filtered = filtered.filter(function(item) { return item.type === currentFilter; });
  }

  if (query) {
    filtered = filtered.filter(function(item) {
      if (item.type === 'text') {
        return item.content.toLowerCase().indexOf(query) !== -1;
      }
      return true;
    });
  }

  if (filtered.length === 0) {
    grid.innerHTML = '';
    emptyState.style.display = 'block';
    document.getElementById('itemCount').innerHTML = clipboardItems.length > 0
      ? '没有匹配的结果，共 <span>' + clipboardItems.length + '</span> 条记录'
      : '';
    return;
  }

  emptyState.style.display = 'none';
  document.getElementById('itemCount').innerHTML = '共 <span>' + filtered.length + '</span> 条记录';

  grid.innerHTML = filtered.map(function(item) {
    var timeStr = formatTime(item.timestamp);
    var sizeStr = item.type === 'text'
      ? formatTextSize(item.content)
      : formatImageSize(item.content);

    var bodyHTML = '';
    if (item.type === 'text') {
      var escaped = escapeHTML(item.content);
      bodyHTML = '<div class="item-body text-content">' + escaped + '</div>';
    } else {
      bodyHTML = '<div class="item-body image-content"><img src="' + item.content + '" alt="剪贴板图片" loading="lazy"></div>';
    }

    var typeBadge = item.type === 'text'
      ? '<span class="type-badge type-text">&#128172; 文字</span>'
      : '<span class="type-badge type-image">&#128247; 图片</span>';

    return '<div class="clipboard-item" data-id="' + item.id + '">' +
      '<div class="item-header">' +
        '<div class="item-type">' + typeBadge + '</div>' +
        '<div style="display:flex;align-items:center;gap:0.5rem;">' +
          '<span class="item-time">' + timeStr + '</span>' +
          '<div class="item-actions">' +
            '<button class="item-action" onclick="copyItem(\'' + item.id + '\')" title="复制">&#128203;</button>' +
            '<button class="item-action" onclick="viewItem(\'' + item.id + '\')" title="查看">&#128065;</button>' +
            '<button class="item-action delete" onclick="deleteItem(\'' + item.id + '\')" title="删除">&#128465;</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      bodyHTML +
      '<div class="item-footer">' +
        '<span class="item-size">' + sizeStr + '</span>' +
        '<span class="item-tag">#' + (item.type === 'text' ? '文本' : '图片') + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

// Copy item
function copyItem(id) {
  var item = clipboardItems.find(function(i) { return i.id === id; });
  if (!item) return;

  if (item.type === 'text') {
    navigator.clipboard.writeText(item.content).then(function() {
      showToast('已复制到系统剪贴板');
    }).catch(function() {
      // Fallback
      var ta = document.createElement('textarea');
      ta.value = item.content;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('已复制到系统剪贴板');
    });
  } else {
    // Copy image to clipboard
    copyImageToClipboard(item.content);
  }
}

// Copy image to clipboard using Clipboard API
function copyImageToClipboard(dataUrl) {
  // Try modern Clipboard API first
  if (navigator.clipboard && navigator.clipboard.write) {
    fetch(dataUrl)
      .then(function(res) { return res.blob(); })
      .then(function(blob) {
        var type = blob.type || 'image/png';
        var item = new ClipboardItem((_obj = {}, _obj[type] = blob, _obj));
        navigator.clipboard.write([item]).then(function() {
          showToast('图片已复制到剪贴板');
        }).catch(function(err) {
          console.warn('Clipboard write failed:', err);
          fallbackCopyImage(dataUrl);
        });
      })
      .catch(function(err) {
        console.warn('Fetch blob failed:', err);
        fallbackCopyImage(dataUrl);
      });
  } else {
    fallbackCopyImage(dataUrl);
  }
}

// Fallback: open image in new tab for manual copy
function fallbackCopyImage(dataUrl) {
  var win = window.open();
  win.document.write(
    '<html><head><title>图片预览 - 右键复制</title></head>' +
    '<body style="margin:0;display:flex;align-items:center;justify-content:center;' +
    'min-height:100vh;background:#1a1a2e;">' +
    '<div style="text-align:center;">' +
    '<img src="' + dataUrl + '" style="max-width:90vw;max-height:80vh;border-radius:8px;' +
    'box-shadow:0 8px 30px rgba(0,0,0,0.5);"><br><br>' +
    '<p style="color:#94a3b8;font-family:sans-serif;font-size:14px;">' +
    '请右键点击图片，选择"复制图片"</p></div></body></html>'
  );
  showToast('浏览器不支持直接复制图片，已在新标签页打开');
}

// View item
function viewItem(id) {
  var item = clipboardItems.find(function(i) { return i.id === id; });
  if (!item) return;

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = function(e) {
    if (e.target === overlay) overlay.remove();
  };

  var bodyClass = item.type === 'text' ? 'text-content' : 'image-content';
  var bodyContent = item.type === 'text'
    ? escapeHTML(item.content)
    : '<img src="' + item.content + '" alt="图片预览">';

  overlay.innerHTML =
    '<div class="modal">' +
      '<div class="modal-header">' +
        '<h3>' + (item.type === 'text' ? '文字内容' : '图片预览') + '</h3>' +
        '<button class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">&#10005;</button>' +
      '</div>' +
      '<div class="modal-body ' + bodyClass + '">' + bodyContent + '</div>' +
      '<div class="modal-footer">' +
        '<button class="btn" onclick="this.closest(\'.modal-overlay\').remove()">关闭</button>' +
        '<button class="btn btn-primary" onclick="copyItem(\'' + id + '\');this.closest(\'.modal-overlay\').remove()">&#128203; 复制</button>' +
      '</div>' +
    '</div>';

  document.body.appendChild(overlay);
}

// Delete item
function deleteItem(id) {
  clipboardItems = clipboardItems.filter(function(i) { return i.id !== id; });
  save();
  renderItems();
  updateStats();
  showToast('已删除');
}

// Clear all
function clearAll() {
  if (clipboardItems.length === 0) return;
  if (confirm('确定要清空所有剪贴板记录吗？此操作不可撤销。')) {
    clipboardItems = [];
    save();
    renderItems();
    updateStats();
    showToast('已清空所有记录');
  }
}

// Export
function exportData() {
  if (clipboardItems.length === 0) {
    showToast('没有数据可导出');
    return;
  }

  var textItems = clipboardItems.filter(function(i) { return i.type === 'text'; });
  var exportText = textItems.map(function(item, idx) {
    return '--- 条目 ' + (idx + 1) + ' [' + formatTime(item.timestamp) + '] ---\n' + item.content;
  }).join('\n\n');

  var blob = new Blob([exportText], { type: 'text/plain;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'clipvault_export_' + new Date().toISOString().slice(0, 10) + '.txt';
  a.click();
  URL.revokeObjectURL(url);
  showToast('导出成功');
}

// Filter
function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-tab').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');
  renderItems();
}

// Update stats
function updateStats() {
  var total = clipboardItems.length;
  var texts = clipboardItems.filter(function(i) { return i.type === 'text'; }).length;
  var images = clipboardItems.filter(function(i) { return i.type === 'image'; }).length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statText').textContent = texts;
  document.getElementById('statImage').textContent = images;
}

// Toast
function showToast(msg) {
  var existing = document.querySelector('.toast');
  if (existing) existing.remove();

  var toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = '&#9989; ' + msg;
  document.body.appendChild(toast);

  setTimeout(function() {
    toast.classList.add('hiding');
    setTimeout(function() { toast.remove(); }, 300);
  }, 2000);
}

// Helpers
function formatTime(ts) {
  var d = new Date(ts);
  var now = new Date();
  var diff = now - d;

  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';

  var month = (d.getMonth() + 1).toString().padStart(2, '0');
  var day = d.getDate().toString().padStart(2, '0');
  var hour = d.getHours().toString().padStart(2, '0');
  var min = d.getMinutes().toString().padStart(2, '0');
  return month + '-' + day + ' ' + hour + ':' + min;
}

function formatTextSize(text) {
  var bytes = new Blob([text]).size;
  if (bytes < 1024) return bytes + ' B';
  return (bytes / 1024).toFixed(1) + ' KB';
}

function formatImageSize(dataUrl) {
  var base64Len = dataUrl.split(',')[1].length;
  var bytes = Math.ceil(base64Len * 3 / 4);
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function escapeHTML(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
