<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宠语 — AI 宠物情绪识别</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf7f2;
  --card: #ffffff;
  --gold: #e89840;
  --gold-light: #fce8d0;
  --text: #2c2416;
  --text-secondary: #8c7a64;
  --mauve: #a898c8;
  --green: #6abf8a;
  --red: #e87060;
  --blue: #6a9fd8;
  --border: #e8e0d4;
  --shadow: 0 4px 24px rgba(0,0,0,0.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: #f0ebe0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(232, 152, 64, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(168, 152, 200, 0.06) 0%, transparent 50%);
}

.phone-frame {
  width: 390px;
  min-height: 760px;
  background: var(--bg);
  border-radius: 40px;
  box-shadow:
    0 0 0 8px #1a1a1a,
    0 0 0 10px #333,
    0 0 0 12px #1a1a1a,
    0 20px 60px rgba(0,0,0,0.3);
  overflow: hidden;
  position: relative;
}

/* Status Bar */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 28px 8px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
}

.status-bar .time { font-weight: 600; color: var(--text); }

/* Nav */
.app-nav {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 8px 20px 12px;
  position: relative;
}

.app-nav .back {
  position: absolute;
  left: 20px;
  font-size: 20px;
  color: var(--text);
  cursor: pointer;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  transition: background 0.2s;
}
.app-nav .back:hover { background: rgba(0,0,0,0.05); }

.app-nav .title {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.05em;
}
.app-nav .title span { color: var(--gold); }

/* Main Content */
.main-content {
  padding: 0 24px 24px;
  height: 610px;
  overflow-y: auto;
  scroll-behavior: smooth;
}

.main-content::-webkit-scrollbar { width: 0; }

/* Screen */
.screen { display: none; }
.screen.active { display: block; }

/* ====== Screen 1: Home ====== */
.pet-avatar-area {
  text-align: center;
  padding: 12px 0 0;
  position: relative;
}

.pet-img-wrap {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  margin: 0 auto 8px;
  overflow: hidden;
  background: linear-gradient(135deg, var(--gold-light), #f0e4d8);
  box-shadow: 0 8px 32px rgba(232, 152, 64, 0.2);
  position: relative;
}

.pet-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.pet-emoji-badge {
  position: absolute;
  bottom: 8px;
  right: 8px;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 2px 12px rgba(0,0,0,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  animation: badgeBounce 2s ease-in-out infinite;
}

@keyframes badgeBounce {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

.pet-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
}
.pet-breed {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.pet-switch {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 16px 0;
}

.pet-switch-btn {
  padding: 8px 20px;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  background: white;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.3s;
  font-family: inherit;
}
.pet-switch-btn:hover { border-color: var(--gold); color: var(--gold); }
.pet-switch-btn.active {
  background: var(--gold);
  color: white;
  border-color: var(--gold);
}

/* Scenario chips */
.scenario-label {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 8px;
  font-weight: 500;
}

.scenario-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 4px;
}

.scenario-chip {
  padding: 8px 14px;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  background: white;
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.25s;
  font-family: inherit;
  white-space: nowrap;
}
.scenario-chip:hover { border-color: var(--gold); }
.scenario-chip.selected {
  background: var(--gold-light);
  border-color: var(--gold);
  color: var(--gold);
  font-weight: 500;
}

/* Record Button */
.record-area {
  text-align: center;
  margin: 24px 0;
}

.record-btn {
  width: 88px; height: 88px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--gold), #f0a850);
  color: white;
  font-size: 32px;
  cursor: pointer;
  box-shadow: 0 8px 28px rgba(232, 152, 64, 0.35);
  transition: all 0.3s;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.record-btn:hover { transform: scale(1.05); box-shadow: 0 12px 36px rgba(232, 152, 64, 0.45); }
.record-btn:active { transform: scale(0.95); }

.record-btn.recording {
  background: linear-gradient(135deg, var(--red), #f05050);
  box-shadow: 0 0 0 0 rgba(232, 112, 96, 0.5);
  animation: recordPulse 1.2s ease-in-out infinite;
}

@keyframes recordPulse {
  0% { box-shadow: 0 0 0 0 rgba(232, 112, 96, 0.5); }
  70% { box-shadow: 0 0 0 20px rgba(232, 112, 96, 0); }
  100% { box-shadow: 0 0 0 0 rgba(232, 112, 96, 0); }
}

.record-hint {
  margin-top: 10px;
  font-size: 13px;
  color: var(--text-secondary);
  min-height: 20px;
}

/* Waveform Canvas */
.waveform-wrap {
  height: 60px;
  margin: 8px 0 0;
  opacity: 0;
  transition: opacity 0.3s;
}
.waveform-wrap.show { opacity: 1; }

/* History */
.history-section {
  margin-top: 8px;
}

.history-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 10px;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--card);
  border-radius: 14px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.25s;
  border: 1.5px solid transparent;
}
.history-item:hover {
  border-color: var(--gold);
  transform: translateX(4px);
}

.history-emoji {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.history-emoji.happy { background: #fef3c7; }
.history-emoji.alert { background: #fee2e2; }
.history-emoji.anxious { background: #e0e7ff; }
.history-emoji.content { background: #d1fae5; }
.history-emoji.hungry { background: #fef3c7; }
.history-emoji.fear { background: #fce7f3; }

.history-info { flex: 1; min-width: 0; }
.history-info .hi-emotion { font-size: 14px; font-weight: 600; color: var(--text); }
.history-info .hi-time { font-size: 11px; color: var(--text-secondary); }

.history-arrow { color: var(--text-secondary); font-size: 16px; }

/* ====== Screen 2: Analyzing ====== */
.analyzing-screen {
  text-align: center;
  padding-top: 60px;
}

.analyzing-anim {
  width: 100px; height: 100px;
  margin: 0 auto 24px;
  position: relative;
}

.analyzing-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 3px solid transparent;
  border-top-color: var(--gold);
  animation: spin 1s linear infinite;
}
.analyzing-ring:nth-child(2) {
  inset: 8px;
  border-top-color: var(--mauve);
  animation-duration: 1.5s;
  animation-direction: reverse;
}
.analyzing-ring:nth-child(3) {
  inset: 16px;
  border-top-color: var(--gold-light);
  animation-duration: 2s;
}

@keyframes spin { to { transform: rotate(360deg); } }

.analyzing-icon {
  position: absolute;
  inset: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
}

.analyzing-text {
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 8px;
}

.analyzing-sub {
  font-size: 13px;
  color: var(--text-secondary);
}

.analyzing-dots::after {
  content: '';
  animation: dots 1.5s steps(4) infinite;
}
@keyframes dots {
  0% { content: ''; }
  25% { content: '.'; }
  50% { content: '..'; }
  75% { content: '...'; }
  100% { content: ''; }
}

/* ====== Screen 3: Result ====== */
.result-screen {
  text-align: center;
  padding-top: 8px;
}

.result-emotion-icon {
  font-size: 72px;
  margin-bottom: 12px;
  animation: resultBounce 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
}

@keyframes resultBounce {
  0% { transform: scale(0); opacity: 0; }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); opacity: 1; }
}

.result-emotion-label {
  font-family: 'Noto Serif SC', serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}

.result-confidence {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}

.result-confidence strong { color: var(--gold); }

.confidence-bar-wrap {
  width: 200px;
  height: 6px;
  background: #e8e0d4;
  border-radius: 3px;
  margin: 0 auto 24px;
  overflow: hidden;
}

.confidence-bar {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--gold), var(--green));
  transition: width 1s cubic-bezier(0.22, 0.61, 0.36, 1);
}

.result-card {
  background: var(--card);
  border-radius: 18px;
  padding: 20px;
  box-shadow: var(--shadow);
  text-align: left;
  margin-bottom: 12px;
}

.result-card h4 {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.result-card p {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.7;
}

.result-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.result-btn {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: 1.5px solid var(--border);
  background: white;
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  transition: all 0.25s;
  font-family: inherit;
}
.result-btn:hover {
  border-color: var(--gold);
  background: #fffcf5;
}
.result-btn.primary {
  background: var(--gold);
  color: white;
  border-color: var(--gold);
}
.result-btn.primary:hover {
  background: #d88830;
}

/* Bottom Nav */
.bottom-nav {
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  background: rgba(250, 247, 242, 0.95);
  backdrop-filter: blur(10px);
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: color 0.2s;
  border: none;
  background: none;
  font-family: inherit;
  padding: 4px 8px;
}
.nav-item .ni-icon { font-size: 22px; }
.nav-item.active { color: var(--gold); }

/* Responsive */
@media (max-width: 430px) {
  .phone-frame {
    width: 100%;
    min-height: 100vh;
    border-radius: 0;
    box-shadow: none;
  }
  .main-content { height: calc(100vh - 160px); }
}
</style>
</head>
<body>

<div class="phone-frame">
  <div class="status-bar">
    <span class="time">9:41</span>
    <span>📶 🔋</span>
  </div>

  <div class="app-nav">
    <div class="back" id="btnBack" style="display:none;">←</div>
    <div class="title">宠<span>语</span></div>
  </div>

  <!-- ====== HOME SCREEN ====== -->
  <div class="main-content" id="mainContent">
    <div class="screen active" id="screenHome">
      <div class="pet-avatar-area">
        <div class="pet-img-wrap" id="petAvatar">
          <img id="petImg" src="https://aka.doubaocdn.com/s/xwD81whhmF" alt="pet">
          <div class="pet-emoji-badge" id="petBadge">🐶</div>
        </div>
        <div class="pet-name" id="petName">豆豆</div>
        <div class="pet-breed" id="petBreed">金毛 · 2岁</div>
      </div>

      <div class="pet-switch">
        <button class="pet-switch-btn active" data-pet="dog">🐶 狗狗</button>
        <button class="pet-switch-btn" data-pet="cat">🐱 猫咪</button>
      </div>

      <div class="scenario-label">选择场景（可选）</div>
      <div class="scenario-chips" id="scenarioChips"></div>

      <div class="record-area">
        <button class="record-btn" id="recordBtn">🎙️</button>
        <div class="record-hint" id="recordHint">点击开始识别宠物情绪</div>
        <canvas class="waveform-wrap" id="waveform" width="340" height="60"></canvas>
      </div>

      <div class="history-section" id="historySection">
        <div class="history-title">最近记录</div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>

    <!-- ====== ANALYZING SCREEN ====== -->
    <div class="screen" id="screenAnalyzing">
      <div class="analyzing-screen">
        <div class="analyzing-anim">
          <div class="analyzing-ring"></div>
          <div class="analyzing-ring"></div>
          <div class="analyzing-ring"></div>
          <div class="analyzing-icon">🐾</div>
        </div>
        <div class="analyzing-text">AI 正在分析中<span class="analyzing-dots"></span></div>
        <div class="analyzing-sub">正在识别声纹特征与情绪模式</div>
      </div>
    </div>

    <!-- ====== RESULT SCREEN ====== -->
    <div class="screen" id="screenResult">
      <div class="result-screen">
        <div class="result-emotion-icon" id="resultEmoji">😊</div>
        <div class="result-emotion-label" id="resultLabel">开心</div>
        <div class="result-confidence" id="resultConfidence">AI 置信度 <strong>92%</strong></div>
        <div class="confidence-bar-wrap">
          <div class="confidence-bar" id="confidenceBar" style="width:92%"></div>
        </div>
        <div class="result-card">
          <h4>📋 AI 解读</h4>
          <p id="resultInterpretation"></p>
        </div>
        <div class="result-card">
          <h4>💡 建议</h4>
          <p id="resultAdvice"></p>
        </div>
        <div class="result-actions">
          <button class="result-btn" id="btnRetry">再来一次</button>
          <button class="result-btn primary" id="btnSave">保存记录</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <button class="nav-item active" data-tab="home">
      <span class="ni-icon">🏠</span> 首页
    </button>
    <button class="nav-item" data-tab="history">
      <span class="ni-icon">📋</span> 记录
    </button>
    <button class="nav-item" data-tab="profile">
      <span class="ni-icon">🐾</span> 我的
    </button>
  </div>
</div>

<script>
/* ===== Data ===== */
const dogScenarios = [
  { id: 'dog_happy', label: '🐕 兴奋摇尾巴', emotion: '开心', emoji: '😄', confidence: 94,
    interpretation: '你的狗狗正处于高度兴奋状态，尾巴快速摇摆、身体放松、可能伴随短促高音吠叫。这通常意味着它想出去玩、看到了喜欢的玩具、或者你刚回家它太高兴了。',
    advice: '可以带它出去散步或玩 fetch 游戏消耗精力。此时是训练和互动的黄金时机，狗狗学习意愿最强。' },
  { id: 'dog_alert', label: '🏠 对着门口狂叫', emotion: '警戒', emoji: '⚠️', confidence: 88,
    interpretation: '检测到警戒型吠叫模式——声音低沉、节奏规律、伴随身体僵直。你的狗狗感知到了陌生声音或陌生气味，正在履行它的看家本能。',
    advice: '先检查门外情况，确认安全后用平静语气告诉它"没事了"。不要大声呵斥，否则会加重它的紧张。可以分散注意力，给它一个"坐下"指令。' },
  { id: 'dog_anxious', label: '😢 发出呜呜声', emotion: '焦虑', emoji: '😟', confidence: 86,
    interpretation: '识别到典型的分离焦虑声纹——高频呜咽、声音拉长、伴随踱步和舔爪行为。你的狗狗可能感到孤独、想念主人，或对当前环境感到不安。',
    advice: '如果是分离焦虑，建议逐步进行脱敏训练（从短时间离开开始）。留下带有你气味的衣物，可以播放舒缓音乐，严重时需咨询宠物行为训练师。' },
  { id: 'dog_fear', label: '😨 低吼躲藏', emotion: '恐惧', emoji: '😰', confidence: 84,
    interpretation: '低频喉音伴随退缩姿态，这是恐惧/威胁警告的典型信号。你的狗狗可能对某物或某人感到害怕，低吼是在表达"请离我远一点"。',
    advice: '不要强行接近或惩罚它，低吼是它在用最后的方式沟通而不是直接攻击。移除或远离恐惧源，给它安全空间，等它平静后再用零食正向引导。' },
];

const catScenarios = [
  { id: 'cat_content', label: '😌 咕噜咕噜', emotion: '满足', emoji: '😌', confidence: 95,
    interpretation: '经典的猫咪呼噜声——低频持续振动，通常伴随眯眼、踩奶动作、尾巴尖轻摆。你的猫咪此刻非常放松和满足，这是它表达舒适和信任的方式。',
    advice: '此时是撸猫的最佳时机！轻柔抚摸它的下巴和耳后，它会更加享受。呼噜声也有研究表明对主人有减压效果，好好享受这段治愈时光吧。' },
  { id: 'cat_hungry', label: '🍽️ 短促喵叫', emotion: '饿了', emoji: '😾', confidence: 91,
    interpretation: '短促、重复的高频喵叫，伴随在你腿边蹭来蹭去、引导你去食盆方向。这是猫咪经典的"讨食"行为模式——它饿了，并且在明确地告诉你。',
    advice: '检查食盆是否空了，按正常喂食量给予食物。注意不要过度喂食，猫咪的"演戏"能力一流，要按科学定量来。' },
  { id: 'cat_need', label: '🌙 凌晨不停叫', emotion: '求关注', emoji: '🙀', confidence: 83,
    interpretation: '深夜或凌晨时段的持续嚎叫——可能的原因包括：发情期信号、精力过剩需要消耗、习惯性夜间觅食、或者单纯想获得你的关注。如果叫声异常尖锐，需警惕泌尿系统不适。',
    advice: '睡前多陪猫咪玩耍消耗精力；保持每天固定喂食时间；如果是发情期，建议咨询兽医绝育方案。如果叫声持续且伴随频繁进出猫砂盆，需尽快就医排查泌尿问题。' },
  { id: 'cat_fear', label: '😠 嘶嘶哈气', emotion: '恐惧/警戒', emoji: '😡', confidence: 89,
    interpretation: '识别到防御性嘶嘶声——猫咪处于高度警戒状态，拱背、炸毛、耳朵压平。这是它在警告"不要靠近我"，通常发生在遇到陌生动物、被惊吓、或感到领地受威胁时。',
    advice: '立即停止靠近，给它退路和藏身空间。不要试图抱它或安抚，此时任何接触都可能触发攻击。等它自行平静后（可能需要数小时），再用温柔语调和零食重建信任。' },
];

let currentPet = 'dog';
let history = [];
let isRecording = false;
let waveformAnimId = null;

/* ===== DOM ===== */
const screenHome = document.getElementById('screenHome');
const screenAnalyzing = document.getElementById('screenAnalyzing');
const screenResult = document.getElementById('screenResult');
const btnBack = document.getElementById('btnBack');
const recordBtn = document.getElementById('recordBtn');
const recordHint = document.getElementById('recordHint');
const scenarioChips = document.getElementById('scenarioChips');
const historyList = document.getElementById('historyList');
const waveform = document.getElementById('waveform');
const waveformCtx = waveform.getContext('2d');
const petImg = document.getElementById('petImg');
const petName = document.getElementById('petName');
const petBreed = document.getElementById('petBreed');
const petBadge = document.getElementById('petBadge');

/* ===== Navigation ===== */
function showScreen(screen) {
  [screenHome, screenAnalyzing, screenResult].forEach(s => s.classList.remove('active'));
  if (screen) screen.classList.add('active');
  btnBack.style.display = (screen === screenHome) ? 'none' : 'flex';
}

btnBack.addEventListener('click', () => {
  showScreen(screenHome);
  stopWaveform();
});

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    if (this.dataset.tab === 'home') showScreen(screenHome);
  });
});

/* ===== Pet Switch ===== */
const dogData = {
  img: 'https://aka.doubaocdn.com/s/xwD81whhmF',
  name: '豆豆', breed: '金毛 · 2岁', badge: '🐶', scenarios: dogScenarios
};
const catData = {
  img: 'https://aka.doubaocdn.com/s/tnV81whhmL',
  name: '咪咪', breed: '橘猫 · 1岁半', badge: '🐱', scenarios: catScenarios
};

function switchPet(type) {
  currentPet = type;
  const data = type === 'dog' ? dogData : catData;
  petImg.src = data.img;
  petName.textContent = data.name;
  petBreed.textContent = data.breed;
  petBadge.textContent = data.badge;
  document.querySelectorAll('.pet-switch-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.pet === type);
  });
  renderScenarios();
}

document.querySelectorAll('.pet-switch-btn').forEach(btn => {
  btn.addEventListener('click', () => switchPet(btn.dataset.pet));
});

/* ===== Scenarios ===== */
let selectedScenario = null;

function renderScenarios() {
  const scenarios = currentPet === 'dog' ? dogScenarios : catScenarios;
  scenarioChips.innerHTML = scenarios.map(s =>
    `<button class="scenario-chip" data-id="${s.id}">${s.label}</button>`
  ).join('');
  selectedScenario = null;

  scenarioChips.querySelectorAll('.scenario-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      scenarioChips.querySelectorAll('.scenario-chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
      selectedScenario = chip.dataset.id;
    });
  });
}

/* ===== Waveform Animation ===== */
function drawWaveform(amplitude) {
  const w = waveform.width;
  const h = waveform.height;
  waveformCtx.clearRect(0, 0, w, h);

  const t = performance.now() * 0.001;
  const barCount = 40;
  const barW = (w - 40) / barCount;

  for (let i = 0; i < barCount; i++) {
    const x = 20 + i * barW;
    const freq = i * 0.15;
    const amp = amplitude *
      (Math.abs(Math.sin(freq * t * 3 + i * 0.3)) * 0.7 +
       Math.abs(Math.cos(freq * t * 2.1 + i * 0.15)) * 0.4 +
       Math.abs(Math.sin(freq * t * 1.5 + i * 0.08)) * 0.3);
    const barH = Math.max(2, amp * h * 0.8);
    const y = (h - barH) / 2;

    const grad = waveformCtx.createLinearGradient(x, y, x, y + barH);
    grad.addColorStop(0, 'rgba(232, 152, 64, 0.9)');
    grad.addColorStop(0.5, 'rgba(232, 152, 64, 0.4)');
    grad.addColorStop(1, 'rgba(232, 152, 64, 0.05)');
    waveformCtx.fillStyle = grad;
    waveformCtx.fillRect(x + 1, y, barW - 2, barH);
  }
}

function startWaveform() {
  waveform.classList.add('show');
  let amp = 0;
  function animate() {
    amp = Math.min(1, amp + 0.06);
    drawWaveform(amp);
    waveformAnimId = requestAnimationFrame(animate);
  }
  animate();
}

function stopWaveform() {
  if (waveformAnimId) cancelAnimationFrame(waveformAnimId);
  waveform.classList.remove('show');
  waveformCtx.clearRect(0, 0, waveform.width, waveform.height);
}

/* ===== Recording ===== */
recordBtn.addEventListener('click', () => {
  if (isRecording) return;
  isRecording = true;
  recordBtn.classList.add('recording');
  recordBtn.textContent = '⏹️';
  recordHint.textContent = '正在聆听...';
  startWaveform();

  // Simulate recording for 2.5 seconds
  setTimeout(() => {
    isRecording = false;
    recordBtn.classList.remove('recording');
    recordBtn.textContent = '🎙️';
    recordHint.textContent = '点击开始识别宠物情绪';
    stopWaveform();
    startAnalysis();
  }, 2500);
});

/* ===== Analysis ===== */
function startAnalysis() {
  showScreen(screenAnalyzing);

  const duration = 1500 + Math.random() * 1500;
  setTimeout(() => {
    showResult();
  }, duration);
}

/* ===== Result ===== */
function showResult() {
  let scenario;
  if (selectedScenario) {
    const allScenarios = (currentPet === 'dog' ? dogScenarios : catScenarios);
    scenario = allScenarios.find(s => s.id === selectedScenario);
  }
  if (!scenario) {
    const scenarios = currentPet === 'dog' ? dogScenarios : catScenarios;
    scenario = scenarios[Math.floor(Math.random() * scenarios.length)];
  }

  document.getElementById('resultEmoji').textContent = scenario.emoji;
  document.getElementById('resultLabel').textContent = scenario.emotion;
  document.getElementById('resultConfidence').innerHTML = `AI 置信度 <strong>${scenario.confidence}%</strong>`;
  document.getElementById('resultInterpretation').textContent = scenario.interpretation;
  document.getElementById('resultAdvice').textContent = scenario.advice;

  const bar = document.getElementById('confidenceBar');
  bar.style.width = '0%';
  setTimeout(() => { bar.style.width = scenario.confidence + '%'; }, 100);

  showScreen(screenResult);

  // Add to history
  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  history.unshift({
    emotion: scenario.emotion,
    emoji: scenario.emoji,
    confidence: scenario.confidence,
    time: timeStr
  });
  if (history.length > 5) history.length = 5;
  renderHistory();
}

/* ===== History ===== */
function renderHistory() {
  historyList.innerHTML = history.map((h, i) => {
    const cls = {
      '开心': 'happy', '警戒': 'alert', '焦虑': 'anxious',
      '满足': 'content', '饿了': 'hungry', '恐惧': 'fear',
      '恐惧/警戒': 'fear', '求关注': 'anxious'
    }[h.emotion] || 'happy';
    return `<div class="history-item" data-idx="${i}">
      <div class="history-emoji ${cls}">${h.emoji}</div>
      <div class="history-info">
        <div class="hi-emotion">${h.emotion} · 置信度 ${h.confidence}%</div>
        <div class="hi-time">${h.time}</div>
      </div>
      <div class="history-arrow">›</div>
    </div>`;
  }).join('');

  historyList.querySelectorAll('.history-item').forEach(item => {
    item.addEventListener('click', () => {
      const idx = parseInt(item.dataset.idx);
      // Replay from history
      selectedScenario = null;
      const scenarios = currentPet === 'dog' ? dogScenarios : catScenarios;
      const matched = scenarios.find(s =>
        s.emotion === history[idx].emotion && s.confidence === history[idx].confidence
      );
      if (matched) selectedScenario = matched.id;
      showResult();
    });
  });
}

/* ===== Result Actions ===== */
document.getElementById('btnRetry').addEventListener('click', () => {
  showScreen(screenHome);
  selectedScenario = null;
  scenarioChips.querySelectorAll('.scenario-chip').forEach(c => c.classList.remove('selected'));
});

document.getElementById('btnSave').addEventListener('click', () => {
  const btn = document.getElementById('btnSave');
  const original = btn.textContent;
  btn.textContent = '✅ 已保存';
  btn.style.background = '#6abf8a';
  btn.style.borderColor = '#6abf8a';
  setTimeout(() => {
    btn.textContent = original;
    btn.style.background = '';
    btn.style.borderColor = '';
  }, 1500);
});

/* ===== Init ===== */
switchPet('dog');
renderHistory();
</script>
