<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI 辩论教练 | Debate Sparring</title>
<style>
  :root {
    --bg: #0a0e14;
    --surface: #131a24;
    --surface2: #1a2332;
    --border: #243044;
    --gold: #e2b04a;
    --green: #4ade80;
    --red: #f87171;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --cyan: #22d3ee;
    --text: #d1d5db;
    --text2: #9ca3af;
    --text3: #6b7280;
    --user-bubble: #1a3a5c;
    --ai-bubble: #1a2a1a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── 顶部栏 ── */
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; background:rgba(10,14,20,0.95);
    backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:100;
  }
  .topbar .logo { font-size:18px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .topbar .logo .icon { font-size:24px; }
  .topbar .logo span { color:var(--gold); }
  .topbar .rank-badge {
    display:flex; align-items:center; gap:6px; font-size:12px;
    background:var(--surface2); padding:5px 12px; border-radius:20px;
    border:1px solid var(--border);
  }
  .topbar .rank-badge .rank-icon { font-size:16px; }
  .topbar .rank-badge .rank-name { font-weight:700; }
  .topbar .score-chip { font-size:12px; color:var(--gold); font-weight:700; }

  /* ── 主容器 ── */
  .main { max-width:560px; margin:0 auto; padding:0 12px 20px; display:flex; flex-direction:column; height:calc(100vh - 56px); }

  /* ── 设置面板 ── */
  .setup-panel {
    background:var(--surface); border-radius:16px; padding:20px;
    border:1px solid var(--border); margin-top:12px;
    flex-shrink:0;
  }
  .setup-panel .setup-title { font-size:16px; font-weight:700; margin-bottom:16px; }
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-size:12px; color:var(--text2); margin-bottom:6px; text-transform:uppercase; letter-spacing:1px; }
  .form-group input, .form-group select, .form-group textarea {
    width:100%; padding:10px 14px; background:var(--surface2); border:1px solid var(--border);
    border-radius:10px; color:var(--text); font-size:14px; font-family:inherit;
    outline:none; transition:border-color .2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--blue); }
  .form-group textarea { resize:vertical; min-height:60px; }
  .form-group select { cursor:pointer; appearance:none; }
  .personality-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
  }
  .personality-card {
    background:var(--surface2); border:2px solid var(--border); border-radius:12px;
    padding:12px; cursor:pointer; transition:all .2s; text-align:center;
  }
  .personality-card:hover { border-color:var(--text3); }
  .personality-card.selected { border-color:var(--gold); background:#1a1a0f; }
  .personality-card .p-icon { font-size:28px; margin-bottom:4px; }
  .personality-card .p-name { font-size:13px; font-weight:700; }
  .personality-card .p-desc { font-size:11px; color:var(--text3); margin-top:2px; }
  .personality-card.locked { opacity:0.4; pointer-events:none; position:relative; }
  .personality-card.locked::after { content:'🔒'; position:absolute; top:4px; right:8px; font-size:14px; }
  .btn-start {
    width:100%; padding:14px; background:linear-gradient(135deg, var(--gold), #c9952e);
    border:none; border-radius:12px; font-size:16px; font-weight:700; color:#1a1a0f;
    cursor:pointer; transition:transform .1s; margin-top:8px;
  }
  .btn-start:active { transform:scale(0.97); }
  .btn-start:disabled { opacity:0.4; pointer-events:none; }

  /* ── 辩论界面 ── */
  .debate-view { display:none; flex-direction:column; flex:1; overflow:hidden; }
  .debate-view.active { display:flex; }
  .debate-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 0; flex-shrink:0;
  }
  .debate-header .opponent-info { display:flex; align-items:center; gap:10px; }
  .debate-header .opponent-avatar { font-size:32px; }
  .debate-header .opponent-name { font-weight:700; font-size:15px; }
  .debate-header .opponent-persona { font-size:12px; color:var(--text3); }
  .debate-header .round-badge {
    background:var(--surface2); padding:6px 14px; border-radius:20px;
    font-size:12px; color:var(--gold); font-weight:700; border:1px solid var(--border);
  }
  .debate-stats {
    display:flex; gap:16px; padding:8px 0; flex-shrink:0;
    border-bottom:1px solid var(--border);
  }
  .stat-item { font-size:12px; color:var(--text2); display:flex; align-items:center; gap:4px; }
  .stat-item b { color:var(--text); }

  /* ── 聊天区 ── */
  .chat-area {
    flex:1; overflow-y:auto; padding:12px 0;
    display:flex; flex-direction:column; gap:12px;
    scroll-behavior:smooth;
  }
  .chat-area::-webkit-scrollbar { width:4px; }
  .chat-area::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .msg { display:flex; gap:10px; animation:fadeIn .3s; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .msg .avatar { font-size:28px; flex-shrink:0; width:36px; text-align:center; }
  .msg .bubble {
    max-width:85%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.65;
    word-break:break-word;
  }
  .msg.ai .bubble { background:var(--ai-bubble); border-bottom-left-radius:4px; }
  .msg.user .bubble { background:var(--user-bubble); border-bottom-right-radius:4px; margin-left:auto; }
  .msg.user { flex-direction:row-reverse; }
  .msg.system .bubble {
    background:transparent; border:1px dashed var(--border); width:100%; max-width:100%;
    text-align:center; font-size:12px; color:var(--text3); border-radius:10px;
  }
  .msg.system .avatar { display:none; }

  /* 打字指示器 */
  .typing-indicator { display:none; padding:4px 14px; }
  .typing-indicator.show { display:flex; align-items:center; gap:10px; }
  .typing-dots { display:flex; gap:4px; }
  .typing-dots span {
    width:6px; height:6px; border-radius:50%; background:var(--text3);
    animation:typing 1.4s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay:.2s; }
  .typing-dots span:nth-child(3) { animation-delay:.4s; }
  @keyframes typing { 0%,60%,100%{opacity:.2} 30%{opacity:1} }

  /* ── 输入区 ── */
  .input-area {
    flex-shrink:0; display:flex; gap:8px; padding:12px 0;
    border-top:1px solid var(--border);
  }
  .input-area textarea {
    flex:1; padding:10px 14px; background:var(--surface2); border:1px solid var(--border);
    border-radius:12px; color:var(--text); font-size:14px; font-family:inherit;
    resize:none; outline:none; min-height:44px; max-height:80px; line-height:1.5;
  }
  .input-area textarea:focus { border-color:var(--blue); }
  .input-area .btn-send {
    width:44px; height:44px; background:var(--gold); border:none;
    border-radius:12px; font-size:20px; cursor:pointer; flex-shrink:0;
    transition:transform .1s; color:#1a1a0f;
  }
  .input-area .btn-send:active { transform:scale(0.92); }
  .input-area .btn-send:disabled { opacity:0.4; pointer-events:none; }
  .quick-replies { display:flex; gap:6px; flex-wrap:wrap; padding:4px 0; flex-shrink:0; }
  .quick-reply {
    padding:6px 14px; background:var(--surface2); border:1px solid var(--border);
    border-radius:16px; font-size:12px; color:var(--text2); cursor:pointer;
    white-space:nowrap; transition:all .2s;
  }
  .quick-reply:hover { border-color:var(--gold); color:var(--gold); }

  /* ── 报告弹窗 ── */
  .report-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200;
    display:none; align-items:center; justify-content:center;
  }
  .report-overlay.show { display:flex; }
  .report-panel {
    background:var(--surface); border-radius:20px; padding:24px;
    width:90%; max-width:440px; max-height:80vh; overflow-y:auto;
    border:2px solid var(--gold); animation:slideUp .4s cubic-bezier(.4,0,.2,1);
  }
  @keyframes slideUp { from{opacity:0;transform:translateY(40px)} to{opacity:1;transform:translateY(0)} }
  .report-panel .report-title { font-size:20px; font-weight:700; text-align:center; margin-bottom:4px; }
  .report-panel .report-subtitle { font-size:13px; color:var(--text3); text-align:center; margin-bottom:20px; }
  .report-section { margin-bottom:16px; }
  .report-section .section-label {
    font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;
    display:flex; align-items:center; gap:6px;
  }
  .report-section .section-content { font-size:13px; line-height:1.7; }
  .report-score {
    display:flex; justify-content:center; gap:20px; margin:16px 0;
  }
  .score-circle {
    width:70px; height:70px; border-radius:50%; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
    border:3px solid var(--gold);
  }
  .score-circle .score-num { font-size:24px; font-weight:700; }
  .score-circle .score-label { font-size:10px; color:var(--text3); }
  .report-badges { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:16px; }
  .badge {
    padding:4px 10px; border-radius:12px; font-size:11px; font-weight:700;
    border:1px solid;
  }
  .badge.good { background:#0a2a0a; border-color:var(--green); color:var(--green); }
  .badge.warn { background:#2a1a0a; border-color:var(--gold); color:var(--gold); }
  .badge.bad { background:#2a0a0a; border-color:var(--red); color:var(--red); }
  .btn-close-report {
    width:100%; padding:12px; background:var(--gold); border:none;
    border-radius:12px; font-size:15px; font-weight:700; cursor:pointer;
    color:#1a1a0f; margin-top:8px;
  }

  /* ── 辩论结束按钮 ── */
  .debate-actions { display:flex; gap:8px; padding:8px 0; flex-shrink:0; }
  .btn-end {
    flex:1; padding:10px; background:var(--red); border:none; border-radius:10px;
    font-size:13px; font-weight:700; color:#fff; cursor:pointer; opacity:0.8;
  }
  .btn-end:hover { opacity:1; }

  /* ── Toast ── */
  .toast {
    position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:300;
    padding:10px 20px; background:rgba(0,0,0,0.9); color:#fff; border-radius:20px;
    font-size:13px; pointer-events:none; opacity:0; transition:opacity .4s;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<!-- 顶部 -->
<div class="topbar">
  <div class="logo"><span class="icon">⚔️</span>AI辩论<span>教练</span></div>
  <div class="rank-badge" id="rankBadge">
    <span class="rank-icon">🥉</span>
    <span class="rank-name">青铜辩手</span>
  </div>
  <div class="score-chip">🧩 <span id="scoreDisplay">0</span></div>
</div>

<div class="main">

  <!-- ========== 设置面板 ========== -->
  <div class="setup-panel" id="setupPanel">
    <div class="setup-title">🎯 开始一场辩论</div>

    <div class="form-group">
      <label>辩论主题 / 你想验证的知识点</label>
      <textarea id="topicInput" placeholder="例如：『微服务架构优于单体架构』、『Rust 比 C++ 更适合系统编程』&#10;或者粘贴一段你的学习笔记，AI 会自动提取可辩论命题..."></textarea>
    </div>

    <div class="form-group">
      <label>辩论模式</label>
      <select id="modeSelect">
        <option value="socratic">💬 苏格拉底模式 — AI 只提问不陈述</option>
        <option value="debate">⚔️ 正反辩论 — AI 扮演明确的反方立场</option>
        <option value="feynman">👶 费曼检验 — AI 装5岁小孩追问到你讲不清</option>
        <option value="interview">🔥 压力面试 — 限时回答，锻炼临场反应</option>
      </select>
    </div>

    <div class="form-group">
      <label>选择 AI 对手人格</label>
      <div class="personality-grid" id="personalityGrid">
        <div class="personality-card selected" data-persona="mentor">
          <div class="p-icon">🧑‍🏫</div>
          <div class="p-name">温和导师</div>
          <div class="p-desc">鼓励式引导，适合新手</div>
        </div>
        <div class="personality-card locked" data-persona="socrates">
          <div class="p-icon">🏛️</div>
          <div class="p-name">苏格拉底</div>
          <div class="p-desc">纯提问，层层递进</div>
        </div>
        <div class="personality-card locked" data-persona="professor">
          <div class="p-icon">👨‍🔬</div>
          <div class="p-name">毒舌教授</div>
          <div class="p-desc">犀利不留情面</div>
        </div>
        <div class="personality-card locked" data-persona="troll">
          <div class="p-icon">👹</div>
          <div class="p-name">杠精模式</div>
          <div class="p-desc">鸡蛋里挑骨头</div>
        </div>
      </div>
    </div>

    <button class="btn-start" id="btnStart" onclick="startDebate()">⚡ 开始辩论</button>
  </div>

  <!-- ========== 辩论界面 ========== -->
  <div class="debate-view" id="debateView">
    <div class="debate-header">
      <div class="opponent-info">
        <span class="opponent-avatar" id="oppAvatar">🧑‍🏫</span>
        <div>
          <div class="opponent-name" id="oppName">温和导师</div>
          <div class="opponent-persona" id="oppPersona">苏格拉底模式</div>
        </div>
      </div>
      <div class="round-badge">回合 <span id="roundNum">0</span></div>
    </div>
    <div class="debate-stats">
      <div class="stat-item">📊 论证完整度 <b id="statLogic">—</b></div>
      <div class="stat-item">🎯 知识准确度 <b id="statAccuracy">—</b></div>
      <div class="stat-item">💡 思辨活跃度 <b id="statActivity">—</b></div>
    </div>
    <div class="chat-area" id="chatArea"></div>
    <div class="typing-indicator" id="typingIndicator">
      <span style="font-size:28px">🤖</span>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>
    <div class="quick-replies" id="quickReplies"></div>
    <div class="debate-actions">
      <button class="btn-end" onclick="endDebate()">🏁 结束辩论，生成报告</button>
    </div>
    <div class="input-area">
      <textarea id="msgInput" placeholder="输入你的论点..." rows="1" onkeydown="handleKey(event)"></textarea>
      <button class="btn-send" onclick="sendMessage()">➤</button>
    </div>
  </div>

</div>

<!-- 报告弹窗 -->
<div class="report-overlay" id="reportOverlay">
  <div class="report-panel" id="reportPanel"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ==================== 段位系统 ====================
const RANKS = [
  { name:'青铜辩手', icon:'🥉', min:0,   color:'#cd7f32' },
  { name:'白银辩手', icon:'🥈', min:100, color:'#c0c0c0' },
  { name:'黄金辩手', icon:'🥇', min:300, color:'#e2b04a' },
  { name:'铂金辩手', icon:'💎', min:600, color:'#a78bfa' },
  { name:'钻石辩手', icon:'👑', min:1000,color:'#60a5fa' },
  { name:'王者辩手', icon:'🏆', min:1500,color:'#f87171' },
];
const PERSONALITY_UNLOCK = { mentor:0, socrates:150, professor:400, troll:800 };

let userScore = parseInt(localStorage.getItem('debate_score') || '0');
let currentDebate = null;
let topic = '';
let mode = 'socratic';
let persona = 'mentor';
let round = 0;
let debateMessages = [];
let isWaiting = false;

// ==================== UI 辅助 ====================
function updateRankDisplay() {
  let rank = RANKS[0];
  for (const r of RANKS) { if (userScore >= r.min) rank = r; }
  document.getElementById('rankBadge').innerHTML = `<span class="rank-icon">${rank.icon}</span><span class="rank-name">${rank.name}</span>`;
  document.getElementById('scoreDisplay').textContent = userScore;
  // 更新人格卡片锁定状态
  document.querySelectorAll('.personality-card').forEach(card => {
    const p = card.dataset.persona;
    if ((PERSONALITY_UNLOCK[p] || 0) <= userScore) {
      card.classList.remove('locked');
    }
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2200);
}

// ==================== 人格选择 ====================
document.getElementById('personalityGrid').addEventListener('click', e => {
  const card = e.target.closest('.personality-card');
  if (!card || card.classList.contains('locked')) {
    if (card?.classList.contains('locked')) showToast('🔒 积累更多逻辑碎片来解锁这个对手吧！');
    return;
  }
  document.querySelectorAll('.personality-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  persona = card.dataset.persona;
});

// ==================== 开始辩论 ====================
function startDebate() {
  topic = document.getElementById('topicInput').value.trim();
  mode = document.getElementById('modeSelect').value;

  if (!topic) { showToast('请输入辩论主题或学习笔记'); return; }
  const sel = document.querySelector('.personality-card.selected');
  if (!sel || sel.classList.contains('locked')) { showToast('请选择一个已解锁的对手人格'); return; }
  persona = sel.dataset.persona;
  if ((PERSONALITY_UNLOCK[persona] || 0) > userScore) { showToast('🔒 这个对手还未解锁'); return; }

  currentDebate = {
    topic, mode, persona, round:0, messages:[],
    logic:0, accuracy:0, activity:0,
    blindSpots:[], fallacies:[], strengths:[]
  };
  debateMessages = [];
  round = 0;

  document.getElementById('setupPanel').style.display = 'none';
  document.getElementById('debateView').classList.add('active');
  document.getElementById('chatArea').innerHTML = '';
  document.getElementById('msgInput').value = '';
  document.getElementById('msgInput').disabled = false;
  document.getElementById('quickReplies').innerHTML = '';
  updateStats('—','—','—');
  document.getElementById('roundNum').textContent = '0';
  updateOpponentDisplay();
  document.getElementById('msgInput').focus();

  // 开场白
  addSystemMsg(`辩论开始！主题：<b>${topic}</b>`);
  setTimeout(() => aiSpeak(openingStatement()), 600);
}

function updateOpponentDisplay() {
  const avatars = { mentor:'🧑‍🏫', socrates:'🏛️', professor:'👨‍🔬', troll:'👹' };
  const names = { mentor:'温和导师', socrates:'苏格拉底', professor:'毒舌教授', troll:'杠精' };
  const modeNames = { socratic:'苏格拉底模式', debate:'正反辩论', feynman:'费曼检验', interview:'压力面试' };
  document.getElementById('oppAvatar').textContent = avatars[persona] || '🤖';
  document.getElementById('oppName').textContent = names[persona] || 'AI 对手';
  document.getElementById('oppPersona').textContent = modeNames[mode] || mode;
}

function updateStats(l, a, act) {
  document.getElementById('statLogic').textContent = l;
  document.getElementById('statAccuracy').textContent = a;
  document.getElementById('statActivity').textContent = act;
}

// ==================== 消息系统 ====================
function addMsg(role, text) {
  debateMessages.push({ role, text });
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const avatars = { ai:'🤖', user:'🧑‍🎓', system:'' };
  div.innerHTML = `<span class="avatar">${avatars[role]}</span><div class="bubble">${text}</div>`;
  document.getElementById('chatArea').appendChild(div);
  document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg system';
  div.innerHTML = `<div class="bubble">${text}</div>`;
  document.getElementById('chatArea').appendChild(div);
  document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
}

function setQuickReplies(replies) {
  const el = document.getElementById('quickReplies');
  if (!replies || replies.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = replies.map((r,i) =>
    `<span class="quick-reply" onclick="quickReply('${r.replace(/'/g,"\\'")}')">${r}</span>`
  ).join('');
}

function quickReply(text) {
  document.getElementById('msgInput').value = text;
  sendMessage();
}

// ==================== AI 发言 ====================
function aiSpeak(text, delay = 1200) {
  isWaiting = true;
  document.getElementById('msgInput').disabled = true;
  document.getElementById('typingIndicator').classList.add('show');
  document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;

  setTimeout(() => {
    document.getElementById('typingIndicator').classList.remove('show');
    addMsg('ai', text);
    isWaiting = false;
    document.getElementById('msgInput').disabled = false;
    document.getElementById('msgInput').focus();
    document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
  }, delay);
}

// ==================== 开场白 ====================
function openingStatement() {
  const openings = {
    mentor: {
      socratic: `好的，让我们一起来检验你对「${topic}」的理解。我会用提问的方式帮你梳理思路，不用紧张，诚实回答就好。\n\n第一个问题：如果要用一句话向一个完全不懂的人解释你的观点，你会怎么说？`,
      debate: `我理解你的立场——你认为「${topic}」是成立的。但请允许我提出不同看法。\n\n在你展开论证之前，我想先问：你觉得支持你观点的<b>最强证据</b>是什么？`,
      feynman: `嗨！我对「${topic}」完全不了解，你能用最简单的话讲给我听吗？\n\n就像跟一个5岁小孩解释一样——如果我发现有哪里听不懂，我会追着问哦！`,
      interview: `面试开始。你有3分钟时间，请先概述你对「${topic}」的核心观点。\n\n我会根据你的回答进行技术深度的追问，准备好了吗？`,
    },
    socrates: {
      socratic: `你声称你理解了「${topic}」。但"理解"这个词本身意味着什么？\n\n你是否能告诉我——这个观点的<b>前提假设</b>是什么？如果假设不成立，你的论证会怎样？`,
      debate: `你说「${topic}」。但这是否意味着你默认了某些前提？\n\n在你开始辩护之前，让我们先检视你的起点是否稳固。`,
      feynman: `我不太明白「${topic}」是什么意思。你能用不一样的方式再说一遍吗？\n\n如果我还是不懂呢？你准备怎么让我明白？`,
      interview: `我不会告诉你我的立场。我只提问：请你在不引用任何外部资料的情况下，用自己的话论证「${topic}」。计时开始。`,
    },
    professor: {
      socratic: `哼，「${topic}」？又是一个自以为懂了的学生。\n\n听好了——我不会接受任何模糊的回答。如果你的论证中有任何跳跃，我会立刻指出来。现在，开始吧。`,
      debate: `荒谬。让我用三个反例来质疑「${topic}」。\n\n但在抛出反例前，我给你一个机会——你先说你最强的论据，我看看值不值得认真对待。`,
      feynman: `我最讨厌假装理解的人。你说你理解「${topic}」，那就解释给我听。\n\n——等等，你刚说的那个词，你真的确定你知道它的意思吗？`,
      interview: `你的简历说你对「${topic}」很熟悉？那我们来看看是不是真的。\n\n第一个问题——也是最简单的——请定义你的立场，然后我告诉你哪里错了。`,
    },
    troll: {
      socratic: `哦，「${topic}」？听起来很厉害嘛。\n\n但你说这个之前，有没有想过——万一你是错的呢？你怎么证明你不是在自我欺骗？`,
      debate: `我完全不同意「${topic}」。而且我不需要给出理由——因为你先提出的，举证责任在你。\n\n来吧，说服我。但你的每一个论据我都会找到漏洞。`,
      feynman: `你确定你说的这个「${topic}」真的有道理吗？\n\n我现在就是一个什么都不懂的小孩——但小孩也会问：为什么？为什么是这样？为什么不是别的？`,
      interview: `我以为你对「${topic}」很了解？那我们玩个游戏——你说的每一句话，我都要你给出定义。定义里的词，我继续追问。看你能撑几轮。`,
    },
  };
  return (openings[persona]?.[mode] || openings.mentor[mode] || `让我们来讨论「${topic}」。请先阐述你的观点。`);
}

// ==================== 发送消息 ====================
function sendMessage() {
  if (isWaiting) return;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  if (currentDebate.mode === 'interview' && text.length < 10) {
    showToast('⚡ 压力面试模式：请给出更完整的回答');
    return;
  }

  input.value = '';
  setQuickReplies([]);
  round++;
  currentDebate.round = round;
  document.getElementById('roundNum').textContent = round;
  addMsg('user', text);

  // 评分
  scoreResponse(text);
  updateStats(
    formatScore(currentDebate.logic, 100),
    formatScore(currentDebate.accuracy, 100),
    formatScore(currentDebate.activity, 100)
  );

  // 生成 AI 回复
  const reply = generateReply(text, round);
  aiSpeak(reply, 800 + Math.random() * 1500);

  // 达到一定回合自动提示
  if (round >= 8 && round % 3 === 0) {
    setTimeout(() => {
      addSystemMsg('💡 已进行 <b>' + round + '</b> 轮辩论，你可以随时选择「结束辩论」生成认知漏洞报告');
    }, 2000);
  }
}

function scoreResponse(text) {
  const len = text.length;
  // 简单启发式评分
  if (len > 80) { currentDebate.logic += 4; currentDebate.activity += 3; }
  else if (len > 30) { currentDebate.logic += 2; currentDebate.activity += 2; }
  else { currentDebate.logic += 1; currentDebate.activity += 1; }

  // 检测关键词
  const keywords = ['因为','所以','但是','然而','例如','比如','首先','其次','结论','证据','数据','研究','实验'];
  let kwCount = 0;
  keywords.forEach(kw => { if (text.includes(kw)) kwCount++; });
  currentDebate.accuracy += Math.min(kwCount, 5);

  // 检测逻辑词
  const logicWords = ['如果','那么','假设','前提','推论','因果','相关','概率'];
  logicWords.forEach(kw => { if (text.includes(kw)) currentDebate.logic += 1; });
}

function formatScore(val, max) {
  const s = Math.min(Math.round(val / max * 100), 100);
  if (s >= 80) return `<span style="color:var(--green)">${s}</span>`;
  if (s >= 50) return `<span style="color:var(--gold)">${s}</span>`;
  return `<span style="color:var(--red)">${s}</span>`;
}

// ==================== AI 回复生成 ====================
function generateReply(userText, r) {
  const modeTemplates = {
    socratic: [
      `有意思。那你觉得这个观点成立需要哪些<b>前提条件</b>？如果其中一个条件不存在会怎样？`,
      `你说的有道理，但我想追问一层：你为什么认为这个推理是成立的？中间有没有跳过的步骤？`,
      `假设一个完全不了解这个领域的人听到你刚才的话，他可能会问："这跟我的生活有什么关系？"你会怎么回答？`,
      `你能举一个<b>反例</b>吗？就是那种看起来不支持你的观点、但实际上你仍然可以解释的情况？`,
      `你说的这个观点，<b>边界</b>在哪里？在什么情况下它就不适用了？`,
      `如果我们把时间尺度拉长到10年后，你还会坚持这个观点吗？为什么？`,
      `有没有可能你现在的理解其实只是<b>记住了结论</b>，而不是真正理解了推导过程？你怎么区分这两者？`,
      `最后一个问题：如果让你给这个观点打分（1-10），你会打几分？剩下的分数差在哪里？`,
    ],
    debate: [
      `我不同意。你的论证忽略了一个关键问题：<b>成本</b>。任何方案都有代价，你方案的成本是什么？谁来承担？`,
      `你说的这个例子只是特例，不是规律。你能拿出<b>系统性的证据</b>吗？不是一个故事，而是数据或研究？`,
      `就算你的前提成立，你的结论也推不出来。<b>滑坡谬误</b>——你从A跳到了Z，中间省略了太多。`,
      `你这个论证方式如果放到另一个完全相反的立场上，也同样成立。这说明你的论证其实<b>什么都没证明</b>。`,
      `我承认你说的部分是对的。但这就够了吗？<b>量的差异</b>有时候会变成质的差异，你考虑的规模够大吗？`,
      `你一直在说好处，但<b>谁受益、谁受损</b>？如果要把你的方案强加给受损方，你准备怎么说服他们？`,
      `你的论证有一个隐含假设——但你没有意识到。这个假设是：____。你同意这个假设吗？如果它不成立呢？`,
      `好吧。假设你完全正确。那然后呢？这个结论的<b>可操作性</b>是什么？知道这个之后，我应该做什么？`,
    ],
    feynman: [
      `等等，你刚才说的那个词「____」我完全听不懂。能不能换一个更简单的说法？`,
      `为什么是这样的呢？你说"因为A所以B"，但为什么A就会导致B？中间发生了什么？`,
      `你说的好像是一个规则，但这个规则是谁定的？为什么不能反过来？`,
      `我刚才好像听懂了，但你又说了一个新东西把我说糊涂了。能不能回到最开始，再从另一个角度讲一遍？`,
      `如果这件事是错的，会发生什么？你会怎么发现它是错的？`,
      `你说的这些，和我知道的另一件事好像很像。它们是一回事吗？还是不一样的？`,
      `你到底是怎么知道这些的？是自己发现的，还是别人告诉你的？别人又怎么知道的？`,
      `好吧，我再问最后一个笨问题：如果要把你说的画成一幅画，这幅画是什么样子的？`,
    ],
    interview: [
      `不够深入。你刚才的回答和一个刷了三天面经的人差不多。<b>深挖</b>：你提到的这个概念，底层实现原理是什么？`,
      `假设你的方案在一个100万用户的生产环境运行了6个月，<b>最可能出问题的地方</b>在哪里？`,
      `给你30秒：告诉我你刚才的观点中，<b>最大的弱点</b>是什么。你不能说没有弱点。`,
      `你刚才的回答里有一个事实错误。你能自己发现吗？如果发现不了，说明你并不真正理解这个领域。`,
      `很好。但我现在要挑战你：请用一个你<b>反对</b>的立场来论证同样的问题。能做到吗？`,
      `你刚才引用的那个概念，请在不使用任何术语的情况下重新解释一遍。<b>限制：只能用高中知识</b>。`,
      `你的回答太理论了。给我一个<b>具体的场景</b>——具体的数字、具体的条件——然后告诉我你的方案怎么处理。`,
      `最后一个问题：如果我现在给你100万预算让你实现这个方案，<b>你的第一笔钱花在哪里</b>？为什么？`,
    ],
  };

  const templates = modeTemplates[mode] || modeTemplates.socratic;
  const idx = (r - 1) % templates.length;
  return templates[idx];
}

// ==================== 结束辩论 ====================
function endDebate() {
  if (round === 0) { showToast('至少进行一轮辩论才能生成报告'); return; }

  const d = currentDebate;
  const totalScore = d.logic + d.accuracy + d.activity;
  const finalScore = Math.min(Math.round(totalScore * 1.5), 300);
  userScore += finalScore;
  localStorage.setItem('debate_score', userScore.toString());
  updateRankDisplay();

  // 生成盲区
  const blindSpots = [];
  if (d.logic < round * 4) blindSpots.push({ text:'论证链条存在跳跃——你倾向于直接给出结论，缺少中间推导步骤', severity:'warn' });
  if (d.accuracy < round * 3) blindSpots.push({ text:'知识引用不够精确——部分观点缺乏具体例证或数据支撑', severity:'bad' });
  if (d.activity < round * 2) blindSpots.push({ text:'回答过于简短——思辨深度不足，可能停留在表面理解', severity:'bad' });
  if (round < 4) blindSpots.push({ text:'辩论回合数不足——建议至少进行5轮以上才能充分暴露盲区', severity:'warn' });
  if (blindSpots.length === 0) blindSpots.push({ text:'表现优秀！本轮辩论未发现明显盲区，继续保持！', severity:'good' });

  const fallacies = [];
  if (d.logic < round * 3) fallacies.push('可能存在"以偏概全"——用一个例子推导普遍结论');
  if (d.accuracy < round * 2) fallacies.push('可能存在"诉诸权威"——引用观点但未论证其合理性');
  if (fallacies.length === 0) fallacies.push('本轮未检测到明显逻辑谬误');

  const strengths = [];
  if (d.logic > round * 3) strengths.push('论证结构清晰，逻辑链完整');
  if (d.accuracy > round * 3) strengths.push('知识引用准确，有具体例证支撑');
  if (d.activity > round * 3) strengths.push('思辨活跃，愿意深入探讨复杂问题');
  if (strengths.length === 0) strengths.push('迈出了第一步——每一次辩论都是成长');

  // 构建报告HTML
  const scoreColor = finalScore >= 100 ? 'var(--green)' : finalScore >= 50 ? 'var(--gold)' : 'var(--red)';
  const rankName = getRankName(userScore);
  const reportHTML = `
    <div class="report-title">📋 认知漏洞报告</div>
    <div class="report-subtitle">辩题：${topic} · ${round} 回合 · ${modeNames(mode)}</div>

    <div class="report-score">
      <div class="score-circle" style="border-color:${scoreColor}">
        <span class="score-num" style="color:${scoreColor}">+${finalScore}</span>
        <span class="score-label">逻辑碎片</span>
      </div>
      <div class="score-circle">
        <span class="score-num">${rankName}</span>
        <span class="score-label">当前段位</span>
      </div>
    </div>

    <div class="report-section">
      <div class="section-label">🔍 知识盲区</div>
      <div class="section-content">
        ${blindSpots.map(b => `<div style="margin-bottom:6px;color:var(--${b.severity==='good'?'green':b.severity==='warn'?'gold':'red'})">${b.severity==='bad'?'❌':'⚠️'} ${b.text}</div>`).join('')}
      </div>
    </div>

    <div class="report-section">
      <div class="section-label">⚠️ 逻辑谬误风险</div>
      <div class="section-content">
        ${fallacies.map(f => `<div style="margin-bottom:4px">• ${f}</div>`).join('')}
      </div>
    </div>

    <div class="report-section">
      <div class="section-label">✅ 你的优势</div>
      <div class="section-content">
        ${strengths.map(s => `<div style="margin-bottom:4px">✨ ${s}</div>`).join('')}
      </div>
    </div>

    <div class="report-section">
      <div class="section-label">📚 推荐学习资源</div>
      <div class="section-content">
        • 针对本次辩题，建议阅读相关领域的入门教材或综述论文<br>
        • 练习"费曼学习法"：尝试向一个外行人解释你的观点<br>
        • 下次辩论试试不同的 AI 对手人格，暴露不同维度的盲区
      </div>
    </div>

    <button class="btn-close-report" onclick="closeReport()">收下逻辑碎片，继续修行！</button>
  `;

  document.getElementById('reportPanel').innerHTML = reportHTML;
  document.getElementById('reportOverlay').classList.add('show');
  addSystemMsg(`🏁 辩论结束！共 <b>${round}</b> 回合 · 获得 <b style="color:var(--gold)">+${finalScore}</b> 逻辑碎片`);
}

function modeNames(m) {
  return { socratic:'苏格拉底模式', debate:'正反辩论', feynman:'费曼检验', interview:'压力面试' }[m] || m;
}

function getRankName(score) {
  let r = RANKS[0];
  for (const rank of RANKS) { if (score >= rank.min) r = rank; }
  return r.icon + ' ' + r.name;
}

function closeReport() {
  document.getElementById('reportOverlay').classList.remove('show');
  resetDebate();
}

function resetDebate() {
  currentDebate = null;
  debateMessages = [];
  round = 0;
  document.getElementById('debateView').classList.remove('active');
  document.getElementById('setupPanel').style.display = 'block';
  document.getElementById('chatArea').innerHTML = '';
  document.getElementById('topicInput').value = '';
  document.getElementById('msgInput').value = '';
  updateStats('—','—','—');
  document.getElementById('roundNum').textContent = '0';
}

// ==================== 键盘事件 ====================
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ==================== 初始化 ====================
updateRankDisplay();
document.getElementById('msgInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 80) + 'px';
});
</script>
