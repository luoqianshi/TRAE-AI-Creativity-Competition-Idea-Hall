<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI面试模拟官 - TRAE AI创造力大赛</title>
<style>
:root {
  --bg: #0a0a14;
  --surface: #12122a;
  --card: #1a1a38;
  --border: #2a2a50;
  --primary: #7c5cfc;
  --primary-glow: rgba(124,92,252,0.25);
  --accent: #5c9cfc;
  --success: #4ade80;
  --warning: #f59e0b;
  --danger: #f87171;
  --text: #e4e4f0;
  --text2: #9090b0;
  --text3: #606080;
  --radius: 16px;
  --radius-sm: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
body::before {
  content: '';
  position: fixed;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(ellipse at 30% 20%, rgba(124,92,252,0.06) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 80%, rgba(92,156,252,0.05) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}
.container {
  width: 100%;
  max-width: 800px;
  position: relative;
  z-index: 1;
}

/* Landing Screen */
.landing { text-align: center; }
.landing .logo {
  font-size: 48px;
  margin-bottom: 8px;
}
.landing h1 {
  font-size: 32px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
}
.landing .subtitle {
  color: var(--text2);
  font-size: 15px;
  margin-bottom: 40px;
}
.landing .badge-row {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 36px;
  flex-wrap: wrap;
}
.landing .badge {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 12px;
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 6px;
}
.landing .badge .dot { width:8px; height:8px; border-radius:50%; }
.landing .badge .dot.green { background: var(--success); }
.landing .badge .dot.purple { background: var(--primary); }
.landing .badge .dot.blue { background: var(--accent); }

.position-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.position-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 16px;
  cursor: pointer;
  transition: all 0.25s ease;
  text-align: center;
  position: relative;
}
.position-card:hover {
  border-color: var(--primary);
  box-shadow: 0 0 30px var(--primary-glow);
  transform: translateY(-2px);
}
.position-card:active { transform: scale(0.98); }
.position-card .icon { font-size: 36px; margin-bottom: 12px; }
.position-card .name {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 4px;
}
.position-card .hint {
  font-size: 12px;
  color: var(--text2);
}
.position-card .q-count {
  font-size: 11px;
  color: var(--text3);
  margin-top: 8px;
  background: var(--surface);
  display: inline-block;
  padding: 3px 10px;
  border-radius: 10px;
}

/* Interview Screen */
.interview { display: flex; flex-direction: column; height: 80vh; max-height: 700px; }
.interview .header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  background: var(--surface);
  border-radius: var(--radius) var(--radius) 0 0;
  border: 1px solid var(--border);
  border-bottom: none;
}
.interview .header .pos-badge {
  background: var(--primary);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 12px;
}
.interview .header .progress-text {
  font-size: 13px;
  color: var(--text2);
}
.interview .header .end-btn {
  background: transparent;
  border: 1px solid var(--danger);
  color: var(--danger);
  font-size: 12px;
  padding: 5px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.interview .header .end-btn:hover { background: rgba(248,113,113,0.1); }

.interview .chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-top: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.msg {
  display: flex;
  gap: 10px;
  animation: msgIn 0.35s ease;
}
@keyframes msgIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.msg.ai { align-self: flex-start; max-width: 85%; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; max-width: 85%; }
.msg .avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.msg.ai .avatar { background: var(--primary); }
.msg.user .avatar { background: var(--accent); }
.msg .bubble {
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.65;
}
.msg.ai .bubble { background: var(--card); border: 1px solid var(--border); }
.msg.user .bubble { background: var(--primary); color: #fff; }

.msg .feedback-tag {
  font-size: 11px;
  margin-top: 6px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--surface);
  padding: 3px 8px;
  border-radius: 6px;
  color: var(--text2);
}
.msg .feedback-tag.good { color: var(--success); }
.msg .feedback-tag.ok { color: var(--warning); }

.typing-indicator {
  display: none;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
}
.typing-indicator span {
  width: 6px; height: 6px;
  background: var(--text3);
  border-radius: 50%;
  animation: bounce 1.2s infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-6px); } }

.interview .input-area {
  display: flex;
  gap: 10px;
  padding: 14px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
}
.interview .input-area textarea {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14px;
  padding: 10px 14px;
  resize: none;
  font-family: inherit;
  line-height: 1.5;
  min-height: 44px;
  max-height: 100px;
}
.interview .input-area textarea:focus { outline: none; border-color: var(--primary); }
.interview .input-area textarea::placeholder { color: var(--text3); }
.interview .input-area button {
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  padding: 0 20px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.interview .input-area button:hover { opacity: 0.9; }
.interview .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

/* Result Screen */
.result { }
.result .result-header {
  text-align: center;
  margin-bottom: 28px;
}
.result .result-header .big-score {
  font-size: 64px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
}
.result .result-header .verdict {
  font-size: 18px;
  font-weight: 600;
  margin-top: 8px;
}
.result .result-header .verdict.great { color: var(--success); }
.result .result-header .verdict.good { color: var(--accent); }
.result .result-header .verdict.ok { color: var(--warning); }
.result .result-header .position-label {
  font-size: 13px;
  color: var(--text2);
  margin-top: 4px;
}

.result-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-bottom: 24px;
}
@media (max-width: 640px) { .result-grid { grid-template-columns: 1fr; } }

.radar-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.radar-card canvas { max-width: 260px; max-height: 260px; }

.score-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 16px;
}
.score-item .label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 6px;
}
.score-item .label .name { color: var(--text); }
.score-item .label .val { font-weight: 700; color: var(--primary); }
.score-bar {
  height: 6px;
  background: var(--surface);
  border-radius: 3px;
  overflow: hidden;
}
.score-bar .fill {
  height: 100%;
  border-radius: 3px;
  transition: width 1s ease;
}
.fill.logic { background: linear-gradient(90deg, #7c5cfc, #a78bfa); }
.fill.express { background: linear-gradient(90deg, #5c9cfc, #93c5fd); }
.fill.professional { background: linear-gradient(90deg, #4ade80, #86efac); }

.insights {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 20px;
}
.insights h3 {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.insights ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.insights li {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
  padding-left: 18px;
  position: relative;
}
.insights li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 7px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--primary);
}

.actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn {
  padding: 12px 28px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { opacity: 0.9; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }

.trae-footer {
  text-align: center;
  margin-top: 30px;
  font-size: 12px;
  color: var(--text3);
}
.trae-footer span { color: var(--primary); font-weight: 600; }

.hidden { display: none !important; }
</style>
</head>
<body>

<div class="container" id="app">
  <!-- Landing -->
  <div class="landing" id="landing">
    <div class="logo">🤖</div>
    <h1>AI 面试模拟官</h1>
    <p class="subtitle">选择目标岗位，AI模拟真实面试，助你拿下心仪Offer</p>
    <div class="badge-row">
      <span class="badge"><span class="dot green"></span>5轮真实提问</span>
      <span class="badge"><span class="dot purple"></span>AI智能评分</span>
      <span class="badge"><span class="dot blue"></span>雷达图分析</span>
      <span class="badge"><span class="dot green"></span>改进建议</span>
    </div>
    <div class="position-cards">
      <div class="position-card" onclick="startInterview('pm')">
        <div class="icon">📋</div>
        <div class="name">产品经理</div>
        <div class="hint">需求分析 · 数据思维 · 沟通协作</div>
        <div class="q-count">5 轮面试</div>
      </div>
      <div class="position-card" onclick="startInterview('fe')">
        <div class="icon">💻</div>
        <div class="name">前端开发</div>
        <div class="hint">框架理解 · 性能优化 · 工程化</div>
        <div class="q-count">5 轮面试</div>
      </div>
      <div class="position-card" onclick="startInterview('ops')">
        <div class="icon">📊</div>
        <div class="name">运营</div>
        <div class="hint">用户增长 · 数据分析 · 活动策划</div>
        <div class="q-count">5 轮面试</div>
      </div>
      <div class="position-card" onclick="startInterview('design')">
        <div class="icon">🎨</div>
        <div class="name">UI/UX 设计</div>
        <div class="hint">设计思维 · 用户体验 · 视觉审美</div>
        <div class="q-count">5 轮面试</div>
      </div>
    </div>
    <p style="font-size:12px;color:var(--text3);margin-top:10px;">💡 提示：Demo模拟真实面试场景，AI会根据你的回答智能评估</p>
  </div>

  <!-- Interview -->
  <div class="interview hidden" id="interview">
    <div class="header">
      <span class="pos-badge" id="posBadge">产品经理</span>
      <span class="progress-text" id="progress">第 1/5 题</span>
      <button class="end-btn" onclick="endEarly()">结束面试</button>
    </div>
    <div class="chat-area" id="chatArea"></div>
    <div class="input-area">
      <textarea id="userInput" placeholder="输入你的回答..." rows="1" onkeydown="handleKey(event)"></textarea>
      <button id="sendBtn" onclick="submitAnswer()">发送</button>
    </div>
  </div>

  <!-- Result -->
  <div class="result hidden" id="result">
    <div class="result-header">
      <div class="big-score" id="totalScore">--</div>
      <div class="verdict" id="verdict"></div>
      <div class="position-label" id="resultPosition"></div>
    </div>
    <div class="result-grid">
      <div class="radar-card">
        <canvas id="radarChart" width="260" height="260"></canvas>
      </div>
      <div class="score-card" id="scoreCard"></div>
    </div>
    <div class="insights">
      <h3>💡 改进建议</h3>
      <ul id="insightsList"></ul>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="restart()">再来一次</button>
      <button class="btn btn-outline" onclick="restart()">换个岗位</button>
    </div>
  </div>

  <div class="trae-footer">Built with <span>TRAE</span> · AI 创造力大赛 2026</div>
</div>

<script>
const QUESTION_BANK = {
  pm: {
    name: '产品经理',
    questions: [
      '请简单介绍一下你自己，以及为什么想做产品经理？',
      '如果让你从0到1设计一个外卖APP，你会怎么开始？第一步做什么？',
      '假设你负责的产品用户留存率下降了20%，你会怎么分析这个问题？',
      '在日常工作中，你怎么判断一个需求是否值得投入资源去做？',
      '如果研发团队反馈说某个需求"技术上做不了"，你会怎么处理？'
    ],
    feedbackHints: [
      ['结构清晰', '体现热情', '有具体案例'],
      ['用户调研优先', '竞品分析', 'MVP思维'],
      ['数据驱动', '用户分群', 'A/B测试思路'],
      ['ROI评估', '用户价值', '与战略对齐'],
      ['沟通技巧', '需求拆解', '寻找替代方案']
    ]
  },
  fe: {
    name: '前端开发',
    questions: [
      '请介绍一下你做过的技术难度最高的项目？你负责了哪些部分？',
      '你如何理解React/Vue中的虚拟DOM？它解决了什么问题？',
      '如果一个页面的首屏加载时间超过5秒，你会怎么排查和优化？',
      '你觉得一个成熟的前端项目需要哪些工程化配置？为什么？',
      '当你发现设计稿和实际用户体验有冲突时，你会怎么处理？'
    ],
    feedbackHints: [
      ['技术深度', '项目影响力', '个人贡献清晰'],
      ['原理理解', '性能视角', '对比说明'],
      ['性能分析工具', '具体优化策略', '数据量化'],
      ['工程化思维', '自动化', '团队协作'],
      ['用户体验优先', '沟通能力', '方案折中']
    ]
  },
  ops: {
    name: '运营',
    questions: [
      '请谈谈你对"用户运营"和"内容运营"的理解，它们有什么区别？',
      '给你一个全新的社交产品，你会怎么制定冷启动策略？',
      '如何衡量一场线上活动的ROI？请具体说说你的评估维度。',
      '你负责的用户社群活跃度持续下降，你会怎么办？',
      '你认为AI工具会给运营工作带来哪些变化？你怎么看待这个趋势？'
    ],
    feedbackHints: [
      ['概念清晰', '有实操经验', '差异化理解'],
      ['种子用户', '渠道策略', '内容引爆'],
      ['指标体系完整', '成本核算', '归因分析'],
      ['用户洞察', '活动激活', '长期机制'],
      ['前瞻性', '工具应用', '效率提升']
    ]
  },
  design: {
    name: 'UI/UX 设计',
    questions: [
      '请展示或描述一个你最满意的设计作品，说说背后的设计思考。',
      '你是如何理解"设计系统"的？它在团队协作中起什么作用？',
      '在做用户体验设计时，你如何平衡用户需求和商业目标？',
      '你拿到一个模糊的需求（比如"做一个好看的登录页"），你会怎么展开工作？',
      '你如何看待AI在设计领域的应用？它会影响设计师的核心价值吗？'
    ],
    feedbackHints: [
      ['设计逻辑', '用户价值', '视觉呈现'],
      ['组件化思维', '一致性', '效率提升'],
      ['用户研究', '商业理解', '平衡方案'],
      ['需求拆解', '主动沟通', '设计策略'],
      ['开放心态', '工具赋能', '不可替代性']
    ]
  }
};

let state = {
  position: null,
  questions: [],
  currentIdx: 0,
  answers: [],
  scores: [],
};

function startInterview(pos) {
  const data = QUESTION_BANK[pos];
  state.position = pos;
  state.questions = [...data.questions];
  state.currentIdx = 0;
  state.answers = [];
  state.scores = [];
  
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('interview').classList.remove('hidden');
  document.getElementById('posBadge').textContent = data.name;
  document.getElementById('chatArea').innerHTML = '';
  document.getElementById('userInput').value = '';
  document.getElementById('sendBtn').disabled = false;
  updateProgress();
  
  setTimeout(() => addAIMessage(`你好！我是你的AI面试官。今天我们面试的岗位是「${data.name}」，共5个问题。准备好了吗？我们开始吧！`), 300);
  setTimeout(() => addAIMessage(state.questions[0]), 1000);
}

function addAIMessage(text, feedbackHint) {
  const chat = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg ai';
  let bubble = `<div class="avatar">🤖</div><div><div class="bubble">${escapeHtml(text)}</div>`;
  if (feedbackHint) {
    bubble += `<div class="feedback-tag ${feedbackHint.type}">${feedbackHint.icon} ${feedbackHint.text}</div>`;
  }
  bubble += '</div>';
  div.innerHTML = bubble;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addUserMessage(text) {
  const chat = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="avatar">👤</div><div class="bubble">${escapeHtml(text)}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const chat = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg ai typing-msg';
  div.innerHTML = `<div class="avatar">🤖</div><div class="typing-indicator"><span></span><span></span><span></span></div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
  const typing = document.querySelector('.typing-msg');
  if (typing) typing.remove();
}

function updateProgress() {
  document.getElementById('progress').textContent = `第 ${state.currentIdx + 1}/${state.questions.length} 题`;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submitAnswer();
  }
}

function submitAnswer() {
  const input = document.getElementById('userInput');
  const answer = input.value.trim();
  if (!answer) return;
  
  input.value = '';
  document.getElementById('sendBtn').disabled = true;
  
  addUserMessage(answer);
  state.answers.push(answer);
  
  // Score the answer
  const score = scoreAnswer(answer, state.currentIdx, state.position);
  state.scores.push(score);
  
  // Show typing, then feedback
  showTyping();
  
  const hints = QUESTION_BANK[state.position].feedbackHints[state.currentIdx];
  const feedbackType = score.total >= 80 ? 'good' : score.total >= 65 ? 'ok' : '';
  const feedbackIcon = score.total >= 80 ? '👍' : score.total >= 65 ? '💭' : '📌';
  const feedbackMessages = {
    good: ['回答得很好！', '不错的回答！', '思路很清晰！'],
    ok: ['还可以，继续加油！', '有一定道理，再深入一些会更好。', '基本说到点上了。'],
    '': ['可以再想想，还有提升空间。', '稍显不足，面试中可以更展开一些。', '这个角度不错，但可以更具体。']
  };
  const fbArr = feedbackMessages[feedbackType];
  const fbText = fbArr[Math.floor(Math.random() * fbArr.length)];
  
  setTimeout(() => {
    hideTyping();
    addAIMessage(fbText, { type: feedbackType || '', icon: feedbackIcon, text: `关注：${hints.join(' · ')}` });
    
    state.currentIdx++;
    updateProgress();
    
    if (state.currentIdx < state.questions.length) {
      setTimeout(() => {
        showTyping();
        setTimeout(() => {
          hideTyping();
          addAIMessage(state.questions[state.currentIdx]);
          document.getElementById('sendBtn').disabled = false;
          document.getElementById('userInput').focus();
        }, 600 + Math.random() * 800);
      }, 400);
    } else {
      setTimeout(() => {
        showTyping();
        setTimeout(() => {
          hideTyping();
          addAIMessage('面试结束！我已经完成了对你的评估，正在生成面试报告...');
          setTimeout(showResult, 800);
        }, 1000);
      }, 400);
    }
  }, 600 + Math.random() * 600);
}

function scoreAnswer(answer, idx, pos) {
  const len = answer.length;
  let logic = 55 + Math.min(len / 3, 20) + Math.random() * 18;
  let express = 50 + Math.min(len / 4, 20) + Math.random() * 20;
  let professional = 52 + Math.min(len / 3.5, 20) + Math.random() * 18;
  
  // Vary by question type
  const offsets = [[2,0,3],[0,3,1],[3,1,0],[1,2,2],[0,0,5]];
  const off = offsets[idx] || [0,0,0];
  logic += off[0]; express += off[1]; professional += off[2];
  
  // Add some personality-based variation
  logic += (Math.random() - 0.5) * 6;
  express += (Math.random() - 0.5) * 6;
  professional += (Math.random() - 0.5) * 6;
  
  logic = Math.min(98, Math.max(45, Math.round(logic)));
  express = Math.min(98, Math.max(45, Math.round(express)));
  professional = Math.min(98, Math.max(45, Math.round(professional)));
  
  const total = Math.round((logic + express + professional) / 3);
  return { logic, express, professional, total };
}

function showResult() {
  document.getElementById('interview').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  
  const avgLogic = Math.round(state.scores.reduce((a,b) => a + b.logic, 0) / state.scores.length);
  const avgExpress = Math.round(state.scores.reduce((a,b) => a + b.express, 0) / state.scores.length);
  const avgPro = Math.round(state.scores.reduce((a,b) => a + b.professional, 0) / state.scores.length);
  const total = Math.round((avgLogic + avgExpress + avgPro) / 3);
  
  document.getElementById('totalScore').textContent = total;
  document.getElementById('resultPosition').textContent = `面试岗位：${QUESTION_BANK[state.position].name}`;
  
  let verdictEl = document.getElementById('verdict');
  if (total >= 85) {
    verdictEl.textContent = '非常出色！你展现出了优秀的能力';
    verdictEl.className = 'verdict great';
  } else if (total >= 70) {
    verdictEl.textContent = '表现不错！有潜力的候选人';
    verdictEl.className = 'verdict good';
  } else if (total >= 60) {
    verdictEl.textContent = '基本合格，还有提升空间';
    verdictEl.className = 'verdict ok';
  } else {
    verdictEl.textContent = '需要更多准备和练习';
    verdictEl.className = 'verdict ok';
  }
  
  // Score bars
  document.getElementById('scoreCard').innerHTML = `
    <div class="score-item">
      <div class="label"><span class="name">逻辑思维</span><span class="val">${avgLogic}分</span></div>
      <div class="score-bar"><div class="fill logic" style="width:${avgLogic}%"></div></div>
    </div>
    <div class="score-item">
      <div class="label"><span class="name">表达能力</span><span class="val">${avgExpress}分</span></div>
      <div class="score-bar"><div class="fill express" style="width:${avgExpress}%"></div></div>
    </div>
    <div class="score-item">
      <div class="label"><span class="name">专业深度</span><span class="val">${avgPro}分</span></div>
      <div class="score-bar"><div class="fill professional" style="width:${avgPro}%"></div></div>
    </div>
  `;
  
  // Pure Canvas radar chart
  setTimeout(() => drawRadar(avgLogic, avgExpress, avgPro), 100);
  
  // Insights
  const insights = generateInsights(avgLogic, avgExpress, avgPro, state.position);
  document.getElementById('insightsList').innerHTML = insights.map(i => `<li>${i}</li>`).join('');
}

function generateInsights(logic, express, pro, pos) {
  const generic = [];
  const specific = [];
  
  if (logic < 70) generic.push('尝试用「总-分-总」结构回答：先给结论，再展开论据，最后总结。这会让你的回答听起来更有逻辑。');
  if (express < 70) generic.push('多用具体案例和数据支撑观点，避免空泛描述。面试官更喜欢听到"我做过XX，结果是YY"这样的表达。');
  if (pro < 70) generic.push('深入理解岗位所需的核心方法论和行业知识，多阅读相关书籍和文章，建立自己的知识体系。');
  if (logic >= 80) generic.push('逻辑思维是你的强项，继续保持。可以在复杂问题的分析中展现更多层次感。');
  if (express >= 80) generic.push('表达能力出色，表达清晰且有感染力。可以在面试中适当展现一些个人风格。');
  if (pro >= 80) generic.push('专业深度令人印象深刻，这说明你在这个领域有扎实的积累。');
  
  const posTips = {
    pm: ['多用数据说话，产品经理的核心能力之一是数据驱动决策。', '展示你对用户的理解，讲一个你深入洞察用户需求的故事。'],
    fe: ['准备一些性能优化和工程化方面的具体案例，面试官很看重实际经验。', '展现你的技术广度，除了框架，也要了解网络、安全等周边知识。'],
    ops: ['用具体的运营数据展示你的成果，比如"通过XX手段，DAU提升了30%"。', '展现你的复盘能力，说说你从失败中学到了什么。'],
    design: ['准备作品集时，多讲讲设计背后的思考过程，而不仅仅是最终效果图。', '展现你对商业目标的理解，好的设计师不只是画图。']
  };
  
  specific.push(...(posTips[pos] || []));
  
  const all = [...generic.slice(0, 3), ...specific.slice(0, 2)];
  return all.slice(0, 5);
}

function drawRadar(logic, express, pro) {
  const canvas = document.getElementById('radarChart');
  const dpr = window.devicePixelRatio || 1;
  const size = 260;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const cx = size / 2, cy = size / 2;
  const R = 95;
  const angles = [-Math.PI/2, Math.PI/6, Math.PI*5/6]; // top, bottom-right, bottom-left
  const labels = ['逻辑思维', '表达能力', '专业深度'];
  const values = [logic, express, pro];

  // Grid (concentric triangles)
  const gridSteps = 4;
  for (let i = 1; i <= gridSteps; i++) {
    const r = (R * i) / gridSteps;
    ctx.beginPath();
    for (let j = 0; j < 3; j++) {
      const a = angles[j];
      const x = cx + r * Math.cos(a);
      const y = cy + r * Math.sin(a);
      if (j === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(144,144,176,0.12)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Axis lines
  for (let i = 0; i < 3; i++) {
    const a = angles[i];
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a));
    ctx.strokeStyle = 'rgba(144,144,176,0.15)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Data area (filled polygon)
  const pts = values.map((v, i) => {
    const r = ((v - 40) / 60) * R;
    return { x: cx + r * Math.cos(angles[i]), y: cy + r * Math.sin(angles[i]) };
  });
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < 3; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fillStyle = 'rgba(124,92,252,0.18)';
  ctx.fill();
  ctx.strokeStyle = '#7c5cfc';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Data points
  pts.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
    ctx.fillStyle = '#7c5cfc';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  });

  // Labels
  const labelOffsets = [
    { x: 0, y: -16, align: 'center' },
    { x: 16, y: 10, align: 'start' },
    { x: -16, y: 10, align: 'end' }
  ];
  labels.forEach((label, i) => {
    const a = angles[i];
    const lx = cx + (R + 24) * Math.cos(a) + labelOffsets[i].x;
    const ly = cy + (R + 24) * Math.sin(a) + labelOffsets[i].y;
    ctx.fillStyle = '#9090b0';
    ctx.font = '13px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = labelOffsets[i].align;
    ctx.textBaseline = 'middle';
    ctx.fillText(label, lx, ly);

    // Score label below
    const sx = cx + (R + 44) * Math.cos(a) + labelOffsets[i].x;
    const sy = cy + (R + 44) * Math.sin(a) + labelOffsets[i].y;
    ctx.fillStyle = '#7c5cfc';
    ctx.font = 'bold 14px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(values[i] + '分', sx, sy);
  });
}

function endEarly() {
  if (state.answers.length === 0) {
    restart();
    return;
  }
  // Fill remaining scores with defaults
  while (state.scores.length < state.questions.length) {
    state.scores.push({ logic: 55, express: 55, professional: 55, total: 55 });
  }
  showResult();
}

function restart() {
  state = { position: null, questions: [], currentIdx: 0, answers: [], scores: [] };
  document.getElementById('interview').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('landing').classList.remove('hidden');
  document.getElementById('userInput').value = '';
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Auto-resize textarea
document.getElementById('userInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});
</script>
