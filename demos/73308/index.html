<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情绪日记 - 像素风情绪陪伴</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'VT323', monospace; }

    .pixel-bg {
      background: #0a0a1a;
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(100,100,255,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(50,50,150,0.1) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(30,30,80,0.2) 0%, transparent 70%);
    }

    .book-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    .closed-book {
      position: relative;
      width: 320px;
      height: 420px;
      cursor: pointer;
      transition: opacity 0.3s;
      transform-style: preserve-3d;
    }

    .book-spine {
      position: absolute;
      left: 50%;
      top: 0;
      width: 20px;
      height: 100%;
      background: linear-gradient(90deg, #3d2914, #5c3d2e, #3d2914);
      transform: translateX(-50%);
      z-index: 2;
      box-shadow: inset -3px 0 0 #2a1a0a, inset 3px 0 0 #6b4a34;
    }

    .book-cover {
      position: absolute;
      left: 0;
      top: 0;
      width: calc(50% + 10px);
      height: 100%;
      background: linear-gradient(90deg, #6b4423, #8b5a2b, #6b4423);
      transform-origin: right center;
      z-index: 3;
      border: 4px solid #a06030;
      border-right: none;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 5px 5px 15px rgba(0,0,0,0.5);
    }

    .book-back {
      position: absolute;
      right: 0;
      top: 0;
      width: calc(50% + 10px);
      height: 100%;
      background: linear-gradient(90deg, #5a3a1f, #7a5030, #5a3a1f);
      transform-origin: left center;
      z-index: 1;
      border: 4px solid #8a6040;
      border-left: none;
    }

    .cover-title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      color: #f0e0c0;
      text-shadow: 3px 3px 0 #2a1a0a, -1px -1px 0 #c0b090;
      letter-spacing: 4px;
      text-align: center;
    }

    .cover-decoration {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      height: 30px;
      background: repeating-linear-gradient(90deg, #8b5a2b 0px, #8b5a2b 2px, #a06030 2px, #a06030 4px);
    }

    .open-hint {
      position: absolute;
      bottom: 120px;
      font-size: 24px;
      color: #8888aa;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
      animation: pulse 2s ease-in-out infinite;
      transition: opacity 0.3s;
    }

    @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

    .open-book {
      display: none;
      position: relative;
      width: 900px;
      height: 600px;
      transform-style: preserve-3d;
    }

    .book-container.book-open .book-left-page { animation: openLeftPage 0.8s ease-out forwards; }
    .book-container.book-open .book-right-page { animation: openRightPage 0.8s ease-out forwards; }
    .book-container.book-open .book-spine-open { animation: spineAppear 0.8s ease-out forwards; }

    @keyframes openLeftPage { 0% { transform: rotateY(180deg); opacity: 0; } 100% { transform: rotateY(0); opacity: 1; } }
    @keyframes openRightPage { 0% { transform: rotateY(-180deg); opacity: 0; } 100% { transform: rotateY(0); opacity: 1; } }
    @keyframes spineAppear { 0%,50% { opacity: 0; transform: scaleY(0); } 100% { opacity: 1; transform: scaleY(1); } }

    .book-spine-open {
      position: absolute;
      left: 50%;
      top: 0;
      width: 16px;
      height: 100%;
      background: linear-gradient(90deg, #3d2914, #5c3d2e, #3d2914);
      transform: translateX(-50%);
      z-index: 10;
      border: 2px solid #2a1a0a;
      opacity: 0;
    }

    .book-page {
      position: absolute;
      top: 0;
      width: calc(50% - 8px);
      height: 100%;
      transform-style: preserve-3d;
    }

    .book-left-page { left: 0; transform-origin: right center; }
    .book-right-page { right: 0; transform-origin: left center; }

    .page-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #f5f0e0, #e8e0c8, #f0e8d0);
      border: 3px solid #d0c8b0;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.1), 2px 0 10px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #canvas-container {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle at center, #1a1a2e, #0f0f1a);
      border: 4px solid #6b4a34;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.3), inset 0 0 20px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    #canvas { display: block; width: 100%; height: 100%; }

    .date-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(180deg, #e8e0c8, #d8d0b8);
      border-bottom: 3px solid #c0b090;
      flex-shrink: 0;
    }

    .planet-section {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
      background: linear-gradient(180deg, #d8d0b8, #e8e0c8, #f0e8d0);
    }

    .page-btn {
      width: 36px;
      height: 36px;
      background: #4a3020;
      color: #f0e0c0;
      border: 2px solid #6b4a34;
      font-family: 'VT323', monospace;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-btn:hover:not(:disabled) { background: #5a4030; transform: scale(1.05); }
    .page-btn:active:not(:disabled) { transform: scale(0.95); }
    .page-btn:disabled { background: #8a7060; color: #b0a090; border-color: #a09080; cursor: not-allowed; }
    .page-btn-prev { border-radius: 4px 0 0 4px; }
    .page-btn-next { border-radius: 0 4px 4px 0; }

    .date-display {
      flex: 1;
      text-align: center;
      cursor: pointer;
      padding: 6px 12px;
      border: 2px solid #a09070;
      background: #f5f0e0;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .date-display:hover { background: #fff8e8; border-color: #8a7060; }

    #date-text { font-size: 18px; color: #4a3020; font-weight: bold; }
    .date-arrow { font-size: 12px; color: #8a7060; margin-left: 4px; }

    .diary-content {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #f5f0e0;
      min-height: 0;
      border-top: 3px solid #c0b090;
      position: relative;
      background-image: repeating-linear-gradient(0deg, transparent 0px, transparent 24px, #d0c8b0 24px, #d0c8b0 25px);
    }

    .diary-lines .empty-hint {
      font-size: 18px;
      color: #a09070;
      text-align: center;
      padding: 32px;
    }

    .diary-input-area {
      flex-shrink: 0;
      padding: 12px 16px;
      background: linear-gradient(180deg, #e8e0c8, #d8d0b8);
      border-top: 3px solid #c0b090;
      display: flex;
      gap: 8px;
    }

    .diary-input {
      flex: 1;
      padding: 8px 12px;
      font-family: 'VT323', monospace;
      font-size: 18px;
      background: #fff;
      border: 2px solid #c0b090;
      resize: none;
      outline: none;
    }

    .diary-input:focus { border-color: #8a7060; }
    .diary-input::placeholder { color: #a09070; }

    .diary-send-btn {
      padding: 8px 16px;
      font-family: 'VT323', monospace;
      font-size: 18px;
      background: #4a3020;
      color: #f0e0c0;
      border: 2px solid #6b4a34;
      cursor: pointer;
      transition: all 0.15s;
    }

    .diary-send-btn:hover:not(:disabled) { background: #5a4030; }
    .diary-send-btn:active:not(:disabled) { transform: scale(0.95); }
    .diary-send-btn:disabled { background: #8a7060; color: #b0a090; }

    .diary-message { margin-bottom: 24px; position: relative; }
    .diary-message-user { text-align: right; }
    .diary-message-user .message-content {
      display: inline-block;
      text-align: left;
      color: #3d3d3d;
      font-size: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 85%;
    }

    .diary-message-ai { text-align: left; }
    .diary-message-ai .message-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .diary-message-ai .avatar-pixel {
      width: 24px;
      height: 24px;
      background: #8b5cf6;
      color: #fff;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #6b21a8;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    }

    .diary-message-ai .message-content {
      display: inline-block;
      color: #5c3d2e;
      font-size: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 90%;
      padding-left: 32px;
    }

    .diary-message .message-time { font-size: 12px; color: #a09070; margin-top: 4px; }
    .diary-message-user .message-time { text-align: right; }
    .diary-message-ai .message-time { text-align: left; padding-left: 32px; }

    .writing-indicator {
      text-align: left;
      padding-left: 32px;
      font-size: 16px;
      color: #8a7060;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .writing-dots span {
      animation: typing-dot 1.4s infinite;
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #8a7060;
      border-radius: 50%;
    }

    .writing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .writing-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typing-dot { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }

    .emotion-tag {
      display: inline-block;
      padding: 2px 8px;
      font-size: 12px;
      border-radius: 4px;
      margin-top: 4px;
    }

    .emotion-tag.happy { background: #8bc34a; color: #fff; }
    .emotion-tag.sad { background: #42a5f5; color: #fff; }
    .emotion-tag.angry { background: #f44336; color: #fff; }
    .emotion-tag.surprised { background: #ff9800; color: #fff; }
    .emotion-tag.neutral { background: #9e9e9e; color: #fff; }
    .emotion-tag.excited { background: #e91e63; color: #fff; }
    .emotion-tag.calm { background: #00bcd4; color: #fff; }
    .emotion-tag.worried { background: #9c27b0; color: #fff; }
    .emotion-tag.hopeful { background: #ffeb3b; color: #333; }
    .emotion-tag.confused { background: #795548; color: #fff; }

    .emotion-analysis {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .analysis-header {
      flex-shrink: 0;
      padding-bottom: 12px;
      border-bottom: 3px solid #c0b090;
    }

    .analysis-header h3 { font-size: 24px; color: #4a3020; margin: 0; }

    .analysis-content {
      flex: 1;
      overflow-y: auto;
      padding-top: 16px;
    }

    .emotion-display {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: #fffbf0;
      border: 2px solid #d0c8b0;
      border-radius: 4px;
      margin-bottom: 16px;
    }

    .emotion-icon { font-size: 48px; }
    .emotion-info { flex: 1; }
    .emotion-name { font-size: 24px; color: #4a3020; font-weight: bold; }
    .emotion-intensity { font-size: 18px; color: #8a7060; }
    .emotion-intensity span { color: #4a3020; font-weight: bold; }

    .emotion-history h4 { font-size: 18px; color: #4a3020; margin: 0 0 12px 0; }
    .emotion-list { display: flex; flex-direction: column; gap: 8px; }

    .emotion-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: #fffbf0;
      border: 2px solid #d0c8b0;
      border-radius: 4px;
    }

    .emotion-item .emotion-icon { font-size: 24px; }
    .emotion-item .emotion-item-info { flex: 1; }
    .emotion-item .emotion-item-name { font-size: 16px; color: #4a3020; }
    .emotion-item .emotion-item-time { font-size: 12px; color: #a09070; }

    .empty-emotion { font-size: 16px; color: #a09070; text-align: center; padding: 32px; }

    .date-picker-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      animation: fadeIn 0.2s;
    }

    .date-picker-modal.hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .date-picker-content {
      width: 90%;
      max-width: 360px;
      background: #e8e0c8;
      border: 4px solid #a09070;
      box-shadow: 8px 8px 0 rgba(0,0,0,0.3);
      padding: 16px;
      font-family: 'VT323', monospace;
    }

    .date-picker-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .date-picker-nav-btn {
      width: 32px;
      height: 32px;
      background: #4a3020;
      color: #f0e0c0;
      border: 2px solid #6b4a34;
      font-size: 18px;
      cursor: pointer;
    }

    .date-picker-nav-btn:hover { background: #5a4030; }
    .date-picker-title { font-size: 24px; color: #4a3020; font-weight: bold; }

    .date-picker-weekdays { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin-bottom: 8px; }
    .date-picker-weekdays span { text-align: center; font-size: 14px; color: #8a7060; padding: 4px; }
    .date-picker-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin-bottom: 16px; }

    .date-picker-grid button {
      aspect-ratio: 1;
      background: #f5f0e0;
      border: 2px solid #d0c8b0;
      font-family: 'VT323', monospace;
      font-size: 18px;
      color: #4a3020;
      cursor: pointer;
      position: relative;
    }

    .date-picker-grid button:hover { background: #fff8e8; border-color: #8a7060; }
    .date-picker-grid button.other-month { color: #b0a090; background: #e8e0c8; }
    .date-picker-grid button.today { background: #8bc34a; border-color: #689f38; color: #fff; }
    .date-picker-grid button.selected { background: #42a5f5; border-color: #1e88e5; color: #fff; }
    .date-picker-grid button.has-diary::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      background: #f44336;
      border-radius: 50%;
    }

    .date-picker-footer { display: flex; gap: 8px; }
    .date-picker-today-btn, .date-picker-history-btn, .date-picker-close-btn {
      flex: 1;
      padding: 8px;
      font-family: 'VT323', monospace;
      font-size: 16px;
      border: 2px solid #a09070;
      cursor: pointer;
    }

    .date-picker-today-btn { background: #8bc34a; color: #fff; border-color: #689f38; }
    .date-picker-history-btn { background: #42a5f5; color: #fff; border-color: #1e88e5; }
    .date-picker-close-btn { background: #d0c8b0; color: #6b4a34; }

    .date-picker-sound-btn { background: #ff9800; color: #fff; border-color: #f57c00; }

    .history-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .history-modal.hidden { display: none; }

    .modal-content {
      width: 90%;
      max-width: 500px;
      background: #e8e0c8;
      border: 4px solid #a09070;
      box-shadow: 8px 8px 0 rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      animation: modalAppear 0.3s;
    }

    @keyframes modalAppear { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .modal-header {
      padding: 12px 16px;
      background: #4a3020;
      border-bottom: 3px solid #6b4a34;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 { font-size: 28px; color: #f0e0c0; margin: 0; }
    .close-modal {
      padding: 4px 12px;
      background: #6b4a34;
      color: #f0e0c0;
      border: 2px solid #8b6a44;
      font-size: 20px;
      cursor: pointer;
    }

    .close-modal:hover { background: #8b6a44; }

    .modal-stats {
      padding: 16px;
      background: #d8d0b8;
      display: flex;
      justify-content: space-around;
    }

    .stat-item { text-align: center; }
    .stat-value { font-size: 32px; color: #4a3020; font-weight: bold; }
    .stat-label { font-size: 16px; color: #6b4a34; }

    .modal-list {
      flex: 1;
      max-height: 300px;
      overflow-y: auto;
      padding: 12px;
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    @media (max-width: 920px) {
      .open-book { width: 100%; height: calc(100vh - 40px); margin: 20px; }
      .cover-title { font-size: 28px; }
      .closed-book { width: 260px; height: 340px; }
    }
  </style>
</head>
<body class="pixel-bg">
  <div id="book-container" class="book-container">
    <div id="closed-book" class="closed-book" onclick="openBook()">
      <div class="book-spine"></div>
      <div class="book-cover">
        <div class="cover-title">情绪日记</div>
        <div class="cover-decoration"></div>
      </div>
      <div class="book-back"></div>
    </div>
    
    <div id="open-book" class="open-book">
      <div class="book-spine-open"></div>
      
      <div class="book-page book-left-page">
        <div class="page-inner">
          <div id="date-header" class="date-header">
            <button id="prev-page-btn" class="page-btn page-btn-prev">&lt;</button>
            <div id="current-date" class="date-display" onclick="openDatePicker()">
              <span id="date-text">2026年 7月15日 星期三</span>
              <span class="date-arrow">▼</span>
            </div>
            <button id="next-page-btn" class="page-btn page-btn-next">&gt;</button>
          </div>
          
          <div id="planet-section" class="planet-section">
            <div id="canvas-container">
              <canvas id="canvas"></canvas>
            </div>
          </div>
          
          <div id="diary-content" class="diary-content">
            <div id="diary-lines" class="diary-lines">
              <div class="empty-hint">今天还没有记录哦</div>
            </div>
          </div>
          
          <div id="diary-input-area" class="diary-input-area">
            <textarea id="chat-input" class="diary-input" placeholder="写下今天的心情..." rows="2"></textarea>
            <button id="send-btn" class="diary-send-btn">记录</button>
          </div>
        </div>
      </div>
      
      <div class="book-page book-right-page">
        <div class="page-inner">
          <div id="emotion-analysis" class="emotion-analysis">
            <div class="analysis-header">
              <h3>情绪分析</h3>
            </div>
            <div class="analysis-content">
              <div class="emotion-display">
                <div class="emotion-icon" id="current-emotion-icon">😊</div>
                <div class="emotion-info">
                  <div class="emotion-name" id="current-emotion-name">平静</div>
                  <div class="emotion-intensity">强度: <span id="current-emotion-intensity">0%</span></div>
                </div>
              </div>
              <div class="emotion-history">
                <h4>最近记录</h4>
                <div id="emotion-list" class="emotion-list">
                  <div class="empty-emotion">暂无情绪记录</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div id="open-hint" class="open-hint">点击翻开日记</div>
  </div>
  
  <div id="date-picker-modal" class="date-picker-modal hidden">
    <div class="date-picker-content">
      <div class="date-picker-header">
        <button id="date-picker-prev-month" class="date-picker-nav-btn">&lt;</button>
        <div id="date-picker-title" class="date-picker-title">2026年 7月</div>
        <button id="date-picker-next-month" class="date-picker-nav-btn">&gt;</button>
      </div>
      <div class="date-picker-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div id="date-picker-grid" class="date-picker-grid"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, planetGroup, controls;
    let particleSystem = null;
    let transitionState = { isTransitioning: false, progress: 0, oldPlanet: null, newPlanet: null };

    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const historyModal = document.getElementById('history-modal');
    const closeModalBtn = document.getElementById('close-modal');
    const historyList = document.getElementById('history-list');
    const statDays = document.getElementById('stat-days');
    const statPositive = document.getElementById('stat-positive');

    let currentDate = new Date();
    let datePickerDate = new Date();
    const dateText = document.getElementById('date-text');
    const prevPageBtn = document.getElementById('prev-page-btn');
    const nextPageBtn = document.getElementById('next-page-btn');
    const datePickerModal = document.getElementById('date-picker-modal');
    const datePickerTitle = document.getElementById('date-picker-title');
    const datePickerGrid = document.getElementById('date-picker-grid');
    const datePickerPrevMonth = document.getElementById('date-picker-prev-month');
    const datePickerNextMonth = document.getElementById('date-picker-next-month');
    const datePickerToday = document.getElementById('date-picker-today');
    const datePickerHistory = document.getElementById('date-picker-history');
    const closeDatePickerBtn = document.getElementById('close-date-picker');
    const diaryLines = document.getElementById('diary-lines');
    let isTurningPage = false;

    let currentEmotion = { type: 'neutral', intensity: 0 };
    let targetEmotion = { type: 'neutral', intensity: 0 };

    const emotionColors = {
      happy: { main: 0x4CAF50, secondary: 0x8BC34A },
      sad: { main: 0x3F51B5, secondary: 0x5C6BC0 },
      angry: { main: 0xF44336, secondary: 0xE57373 },
      surprised: { main: 0xFF9800, secondary: 0xFFB74D },
      neutral: { main: 0x2196F3, secondary: 0x64B5F6 },
      excited: { main: 0xE91E63, secondary: 0xF48FB1 },
      calm: { main: 0x00BCD4, secondary: 0x4DD0E1 },
      worried: { main: 0xFFC107, secondary: 0xFFD54F },
      hopeful: { main: 0x8BC34A, secondary: 0xAED581 },
      confused: { main: 0x9C27B0, secondary: 0xBA68C8 }
    };

    const voxelColors = {
      happy: { ground: '#7cb342', water: '#42a5f5', mountain: '#8d6e63', vegetation: '#2e7d32', flower: '#ffeb3b', flowerCenter: '#ff9800' },
      sad: { ground: '#607d8b', water: '#2979ff', mountain: '#546e7a', vegetation: '#37474f', flower: '#78909c', flowerCenter: '#546e7a' },
      excited: { ground: '#bf360c', water: '#ff5722', mountain: '#795548', vegetation: '#ff9800', flower: '#ffeb3b', flowerCenter: '#ff5722' },
      calm: { ground: '#81c784', water: '#26c6da', mountain: '#a1887f', vegetation: '#66bb6a', flower: '#b2dfdb', flowerCenter: '#80deea' },
      worried: { ground: '#5c6bc0', water: '#7986cb', mountain: '#455a64', vegetation: '#654321', flower: '#90caf9', flowerCenter: '#64b5f6' },
      hopeful: { ground: '#ffab91', water: '#81d4fa', mountain: '#ffcc80', vegetation: '#aed581', flower: '#ffd54f', flowerCenter: '#ffb300' },
      angry: { ground: '#d32f2f', water: '#ff5252', mountain: '#bf360c', vegetation: '#ff1744', flower: '#ffea00', flowerCenter: '#ff9100' },
      surprised: { ground: '#ce93d8', water: '#b39ddb', mountain: '#9c27b0', vegetation: '#ba68c8', flower: '#e1bee7', flowerCenter: '#ce93d8' },
      confused: { ground: '#78909c', water: '#64b5f6', mountain: '#546e7a', vegetation: '#90a4ae', flower: '#cfd8dc', flowerCenter: '#e8eaf6' },
      neutral: { ground: '#90caf9', water: '#64b5f6', mountain: '#78909c', vegetation: '#81c784', flower: '#e3f2fd', flowerCenter: '#bbdefb' }
    };

    let planetState = { totalDays: 0, positiveRatio: 0.5, brightness: 0.5, vegetation: 0.2, lastUpdate: null };
    const DB_NAME = 'PlanetDiaryDB';
    const DB_VERSION = 1;
    let db = null;
    const positiveEmotions = ['happy', 'excited', 'hopeful', 'calm'];

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => { db = request.result; resolve(db); };
        request.onupgradeneeded = (event) => {
          const database = event.target.result;
          if (!database.objectStoreNames.contains('diaries')) {
            const diaryStore = database.createObjectStore('diaries', { keyPath: 'id', autoIncrement: true });
            diaryStore.createIndex('date', 'date', { unique: false });
          }
          if (!database.objectStoreNames.contains('planet')) database.createObjectStore('planet', { keyPath: 'id' });
        };
      });
    }

    function saveDiary(content, emotion, intensity) {
      return new Promise((resolve, reject) => {
        if (!db) { reject(new Error('数据库未初始化')); return; }
        const transaction = db.transaction(['diaries'], 'readwrite');
        const store = transaction.objectStore('diaries');
        const diary = { date: new Date().toISOString(), content, emotion, intensity };
        const request = store.add(diary);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function getRecentDiaries(days = 7) {
      return new Promise((resolve, reject) => {
        if (!db) { reject(new Error('数据库未初始化')); return; }
        const transaction = db.transaction(['diaries'], 'readonly');
        const store = transaction.objectStore('diaries');
        const index = store.index('date');
        const results = [];
        const sevenDaysAgo = new Date();
        sevenDaysAgo.setDate(sevenDaysAgo.getDate() - days);
        index.openCursor(null, 'prev').onsuccess = (event) => {
          const cursor = event.target.result;
          if (cursor) {
            if (new Date(cursor.value.date) >= sevenDaysAgo) { results.push(cursor.value); cursor.continue(); }
            else resolve(results);
          } else resolve(results);
        };
        transaction.onerror = () => reject(transaction.error);
      });
    }

    function deleteDiary(diaryId) {
      return new Promise((resolve, reject) => {
        if (!db) { reject(new Error('数据库未初始化')); return; }
        const transaction = db.transaction(['diaries'], 'readwrite');
        const diaryStore = transaction.objectStore('diaries');
        const getRequest = diaryStore.get(diaryId);
        getRequest.onsuccess = () => {
          const deletedDiary = getRequest.result;
          if (!deletedDiary) { reject(new Error('日记不存在')); return; }
          const deleteRequest = diaryStore.delete(diaryId);
          deleteRequest.onsuccess = () => {
            transaction.oncomplete = () => { recalculatePlanetGrowth(); resolve(); };
          };
          deleteRequest.onerror = () => reject(deleteRequest.error);
        };
      });
    }

    function savePlanetState() {
      return new Promise((resolve, reject) => {
        if (!db) { reject(new Error('数据库未初始化')); return; }
        const transaction = db.transaction(['planet'], 'readwrite');
        const store = transaction.objectStore('planet');
        planetState.lastUpdate = new Date().toISOString();
        const request = store.put({ id: 1, ...planetState });
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    function loadPlanetState() {
      return new Promise((resolve, reject) => {
        if (!db) { reject(new Error('数据库未初始化')); return; }
        const transaction = db.transaction(['planet'], 'readonly');
        const store = transaction.objectStore('planet');
        const request = store.get(1);
        request.onsuccess = () => {
          if (request.result) planetState = { ...request.result };
          resolve(planetState);
        };
        request.onerror = () => reject(request.error);
      });
    }

    function updatePlanetGrowth(emotion) {
      const today = new Date().toDateString();
      const lastUpdateDate = planetState.lastUpdate ? new Date(planetState.lastUpdate).toDateString() : null;
      if (today !== lastUpdateDate) {
        planetState.totalDays++;
        planetState.brightness = Math.min(1, 0.5 + planetState.totalDays * 0.01);
      }
      updatePositiveRatio(emotion);
      planetState.vegetation = 0.2 + planetState.positiveRatio * 0.6;
      savePlanetState();
      updatePlanetVisuals();
      updateEmotionPanel();
    }

    function updatePositiveRatio(newEmotion) {
      const transaction = db.transaction(['diaries'], 'readonly');
      const store = transaction.objectStore('diaries');
      let totalCount = 0, positiveCount = 0;
      store.openCursor().onsuccess = (event) => {
        const cursor = event.target.result;
        if (cursor) {
          totalCount++;
          if (positiveEmotions.includes(cursor.value.emotion)) positiveCount++;
          cursor.continue();
        } else if (totalCount > 0) planetState.positiveRatio = positiveCount / totalCount;
      };
    }

    function recalculatePlanetGrowth() {
      const transaction = db.transaction(['diaries'], 'readonly');
      const store = transaction.objectStore('diaries');
      let totalCount = 0, positiveCount = 0;
      const uniqueDates = new Set();
      store.openCursor().onsuccess = (event) => {
        const cursor = event.target.result;
        if (cursor) {
          totalCount++;
          if (positiveEmotions.includes(cursor.value.emotion)) positiveCount++;
          uniqueDates.add(new Date(cursor.value.date).toDateString());
          cursor.continue();
        } else {
          planetState.positiveRatio = totalCount > 0 ? positiveCount / totalCount : 0.5;
          planetState.totalDays = uniqueDates.size;
          planetState.brightness = Math.min(1, 0.5 + planetState.totalDays * 0.01);
          planetState.vegetation = 0.2 + planetState.positiveRatio * 0.6;
          savePlanetState().then(() => { updatePlanetVisuals(); renderHistoryList(); });
        }
      };
    }

    function updatePlanetVisuals() {
      const ambientLight = scene.getObjectByName('ambientLight');
      if (ambientLight) ambientLight.intensity = 0.3 + planetState.brightness * 0.5;
      const pointLight = scene.getObjectByName('pointLight');
      if (pointLight) pointLight.intensity = 0.8 + planetState.brightness * 0.4;
    }

    function generateVoxelSphere(emotionType) {
      const colors = voxelColors[emotionType] || voxelColors.neutral;
      const group = new THREE.Group();
      const voxelSize = 0.5;
      const resolution = 12;
      const halfRes = resolution / 2;
      
      for (let x = -halfRes; x <= halfRes; x++) {
        for (let y = -halfRes; y <= halfRes; y++) {
          for (let z = -halfRes; z <= halfRes; z++) {
            const dist = Math.sqrt(x * x + y * y + z * z);
            if (dist > halfRes - 1 && dist < halfRes + 1) {
              let color = colors.ground;
              const noise = (Math.sin(x * 0.5) + Math.cos(y * 0.5) + Math.sin(z * 0.5)) / 3;
              if (noise < -0.3) color = colors.water;
              else if (noise > 0.3) color = colors.mountain;
              
              const geometry = new THREE.BoxGeometry(voxelSize, voxelSize, voxelSize);
              const material = new THREE.MeshStandardMaterial({ color: new THREE.Color(color), metalness: 0, roughness: 1.0 });
              const voxel = new THREE.Mesh(geometry, material);
              voxel.position.set(x * voxelSize, y * voxelSize, z * voxelSize);
              voxel.castShadow = true;
              voxel.receiveShadow = true;
              group.add(voxel);
              
              if (noise >= -0.3 && noise <= 0.3 && Math.random() > 0.6) {
                const grassGeo = new THREE.BoxGeometry(voxelSize * 0.3, voxelSize * 1.5, voxelSize * 0.3);
                const grassMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(colors.vegetation), metalness: 0, roughness: 1 });
                const grass = new THREE.Mesh(grassGeo, grassMat);
                grass.position.set(x * voxelSize, y * voxelSize + voxelSize * 0.75, z * voxelSize);
                group.add(grass);
              }
            }
          }
        }
      }
      return group;
    }

    window.initScene = function() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a2e);
      
      const container = document.getElementById('canvas-container');
      camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(12, 8, 12);
      
      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      ambientLight.name = 'ambientLight';
      scene.add(ambientLight);
      
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(10, 15, 10);
      directionalLight.target.position.set(0, 0, 0);
      directionalLight.castShadow = true;
      directionalLight.shadow.mapSize.width = 2048;
      directionalLight.shadow.mapSize.height = 2048;
      scene.add(directionalLight);
      
      const fillLight = new THREE.DirectionalLight(0x81d4fa, 0.25);
      fillLight.position.set(-5, 5, -5);
      scene.add(fillLight);
      
      const pointLight = new THREE.PointLight(0xffffff, 0.8);
      pointLight.position.set(5, 5, 5);
      pointLight.name = 'pointLight';
      scene.add(pointLight);
      
      planetGroup = generateVoxelSphere(currentEmotion.type);
      scene.add(planetGroup);
      
      initParticles();
      setupControls();
      setTimeout(() => updatePlanetVisuals(), 100);
      animate();
    };

    function setupControls() {
      controls = new OrbitControls(camera, renderer.domElement);
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.3;
      controls.minDistance = 10;
      controls.maxDistance = 30;
      controls.maxPolarAngle = Math.PI * 0.9;
      controls.enablePan = true;
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enableTouchZoom = true;
      controls.enableTouchRotate = true;
      controls.enableTouchPan = true;
    }

    function updateEmotionTransition() {
      if (targetEmotion.type !== currentEmotion.type || targetEmotion.intensity !== currentEmotion.intensity) {
        const intensityDiff = targetEmotion.intensity - currentEmotion.intensity;
        currentEmotion.intensity += intensityDiff * 0.05;
        if (Math.abs(intensityDiff) < 0.01) {
          currentEmotion.type = targetEmotion.type;
          currentEmotion.intensity = targetEmotion.intensity;
        }
        updateSphereColor();
        updateParticleSystem();
      }
    }

    function updateSphereColor() {
      if (!planetGroup) return;
      const needsUpdate = !planetGroup.currentEmotion || planetGroup.currentEmotion !== currentEmotion.type;
      if (needsUpdate && !transitionState.isTransitioning) startTransition();
      if (transitionState.isTransitioning) updateTransition();
    }

    function startTransition() {
      transitionState.isTransitioning = true;
      transitionState.progress = 0;
      transitionState.oldPlanet = planetGroup;
      transitionState.newPlanet = generateVoxelSphere(currentEmotion.type);
      transitionState.newPlanet.currentEmotion = currentEmotion.type;
      transitionState.newPlanet.scale.set(0, 0, 0);
      scene.add(transitionState.newPlanet);
    }

    function updateTransition() {
      if (!transitionState.isTransitioning) return;
      transitionState.progress += 0.025;
      if (transitionState.progress >= 1) {
        transitionState.isTransitioning = false;
        scene.remove(transitionState.oldPlanet);
        transitionState.oldPlanet.traverse((child) => {
          if (child.geometry) child.geometry.dispose();
          if (child.material) {
            if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
            else child.material.dispose();
          }
        });
        planetGroup = transitionState.newPlanet;
        planetGroup.scale.set(1, 1, 1);
        transitionState.oldPlanet = null;
        transitionState.newPlanet = null;
      } else {
        const eased = easeInOutCubic(transitionState.progress);
        const oldScale = 1 - eased;
        transitionState.oldPlanet.scale.set(oldScale, oldScale, oldScale);
        const newScale = eased;
        transitionState.newPlanet.scale.set(newScale, newScale, newScale);
      }
    }

    function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    const particleConfigs = {
      happy: { count: 300, speed: 0.02, lifetime: 3, spread: 2 },
      sad: { count: 400, speed: 0.01, lifetime: 4, spread: 3 },
      worried: { count: 300, speed: 0.03, lifetime: 2, spread: 2 },
      calm: { count: 200, speed: 0.008, lifetime: 5, spread: 2.5 },
      excited: { count: 400, speed: 0.025, lifetime: 2.5, spread: 2 },
      angry: { count: 350, speed: 0.035, lifetime: 1.5, spread: 2 },
      surprised: { count: 300, speed: 0.02, lifetime: 2.5, spread: 2.5 },
      hopeful: { count: 350, speed: 0.015, lifetime: 3.5, spread: 2 },
      confused: { count: 250, speed: 0.012, lifetime: 3, spread: 2.5 },
      neutral: { count: 150, speed: 0.005, lifetime: 4, spread: 2 }
    };

    function createCircleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.5, 'rgba(255,255,255,0.8)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(32, 32, 32, 0, Math.PI * 2);
      ctx.fill();
      return new THREE.CanvasTexture(canvas);
    }

    function initParticles() {
      const config = particleConfigs[currentEmotion.type] || particleConfigs.neutral;
      const count = config.count;
      
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const velocities = new Float32Array(count * 3);
      const lifetimes = new Float32Array(count);
      const sizes = new Float32Array(count);
      
      const emotionColor = emotionColors[currentEmotion.type] || emotionColors.neutral;
      const color = new THREE.Color(emotionColor.main);
      
      for (let i = 0; i < count; i++) initParticle(i, positions, colors, velocities, lifetimes, sizes, color, config);
      
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geometry.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
      geometry.setAttribute('lifetime', new THREE.BufferAttribute(lifetimes, 1));
      geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
      
      const material = new THREE.PointsMaterial({
        size: 0.8,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        map: createCircleTexture(),
        sizeAttenuation: true
      });
      
      particleSystem = new THREE.Points(geometry, material);
      scene.add(particleSystem);
    }

    function initParticle(index, positions, colors, velocities, lifetimes, sizes, color, config) {
      const i3 = index * 3;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const radius = 5.5 + Math.random() * config.spread;
      
      positions[i3] = radius * Math.sin(phi) * Math.cos(theta);
      positions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
      positions[i3 + 2] = radius * Math.cos(phi);
      
      colors[i3] = color.r + (Math.random() - 0.5) * 0.3;
      colors[i3 + 1] = color.g + (Math.random() - 0.5) * 0.3;
      colors[i3 + 2] = color.b + (Math.random() - 0.5) * 0.3;
      
      setParticleVelocity(i3, velocities, config);
      lifetimes[index] = Math.random() * config.lifetime;
      sizes[index] = 0.04 + Math.random() * 0.02;
    }

    function setParticleVelocity(i3, velocities, config) {
      const emotion = currentEmotion.type;
      const speed = config.speed * (1 + currentEmotion.intensity);
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      
      switch (emotion) {
        case 'happy':
          velocities[i3] = Math.sin(phi) * Math.cos(theta) * speed;
          velocities[i3 + 1] = Math.abs(Math.cos(phi)) * speed + speed * 0.3;
          velocities[i3 + 2] = Math.sin(phi) * Math.sin(theta) * speed;
          break;
        case 'sad':
          velocities[i3] = Math.sin(phi) * Math.cos(theta) * speed * 0.5;
          velocities[i3 + 1] = -Math.abs(Math.cos(phi)) * speed - speed * 0.2;
          velocities[i3 + 2] = Math.sin(phi) * Math.sin(theta) * speed * 0.5;
          break;
        case 'worried':
          velocities[i3] = Math.sin(phi) * Math.cos(theta) * speed * 2;
          velocities[i3 + 1] = Math.cos(phi) * speed * 2;
          velocities[i3 + 2] = Math.sin(phi) * Math.sin(theta) * speed * 2;
          break;
        case 'excited':
          velocities[i3] = Math.sin(phi) * Math.cos(theta) * speed * 1.5;
          velocities[i3 + 1] = Math.cos(phi) * speed * 1.5;
          velocities[i3 + 2] = Math.sin(phi) * Math.sin(theta) * speed * 1.5;
          break;
        case 'angry':
          velocities[i3] = Math.sin(phi) * Math.cos(theta) * speed * 3;
          velocities[i3 + 1] = Math.cos(phi) * speed * 3;
          velocities[i3 + 2] = Math.sin(phi) * Math.sin(theta) * speed * 3;
          break;
        default:
          velocities[i3] = Math.sin(phi) * Math.cos(theta) * speed;
          velocities[i3 + 1] = Math.cos(phi) * speed;
          velocities[i3 + 2] = Math.sin(phi) * Math.sin(theta) * speed;
      }
    }

    function updateParticles() {
      if (!particleSystem) { initParticles(); return; }
      const config = particleConfigs[currentEmotion.type] || particleConfigs.neutral;
      const count = config.count;
      
      const positions = particleSystem.geometry.attributes.position.array;
      const velocities = particleSystem.geometry.attributes.velocity.array;
      const lifetimes = particleSystem.geometry.attributes.lifetime.array;
      const colors = particleSystem.geometry.attributes.color.array;
      
      const emotionColor = emotionColors[currentEmotion.type] || emotionColors.neutral;
      const targetColor = new THREE.Color(emotionColor.main);
      const speedMultiplier = 1 + currentEmotion.intensity * 0.5;
      
      for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        positions[i3] += velocities[i3] * speedMultiplier;
        positions[i3 + 1] += velocities[i3 + 1] * speedMultiplier;
        positions[i3 + 2] += velocities[i3 + 2] * speedMultiplier;
        
        lifetimes[i] -= 0.016;
        
        colors[i3] += (targetColor.r - colors[i3]) * 0.02;
        colors[i3 + 1] += (targetColor.g - colors[i3 + 1]) * 0.02;
        colors[i3 + 2] += (targetColor.b - colors[i3 + 2]) * 0.02;
        
        if (lifetimes[i] <= 0) {
          lifetimes[i] = config.lifetime;
          resetParticle(i, positions, velocities, colors, config);
        }
      }
      
      const opacity = particleSystem.material.opacity;
      const targetOpacity = 0.6 + currentEmotion.intensity * 0.4;
      particleSystem.material.opacity += (targetOpacity - opacity) * 0.05;
      
      particleSystem.geometry.attributes.position.needsUpdate = true;
      particleSystem.geometry.attributes.color.needsUpdate = true;
      particleSystem.geometry.attributes.lifetime.needsUpdate = true;
    }

    function resetParticle(index, positions, velocities, colors, config) {
      const i3 = index * 3;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const radius = 1.1 + Math.random() * 0.5;
      
      positions[i3] = radius * Math.sin(phi) * Math.cos(theta);
      positions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
      positions[i3 + 2] = radius * Math.cos(phi);
      setParticleVelocity(i3, velocities, config);
    }

    function updateParticleSystem() {
      if (!particleSystem) return;
      const config = particleConfigs[currentEmotion.type] || particleConfigs.neutral;
      const targetCount = config.count;
      const currentCount = particleSystem.geometry.attributes.position.count;
      
      if (currentCount !== targetCount) {
        scene.remove(particleSystem);
        particleSystem = null;
        initParticles();
      }
    }

    let frameCount = 0, lastTime = performance.now();

    function animate() {
      const currentTime = performance.now();
      lastTime = currentTime;
      
      if (controls && controls.enabled) controls.update();
      
      updateEmotionTransition();
      updateParticles();
      
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    function initChat() {
      sendBtn.addEventListener('click', sendMessage);
      chatInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }
      });
      closeModalBtn.addEventListener('click', closeHistoryModal);
      historyModal.addEventListener('click', (event) => { if (event.target === historyModal) closeHistoryModal(); });
    }

    function openHistoryModal() {
      historyModal.classList.remove('hidden');
      renderHistoryList();
    }

    function closeHistoryModal() { historyModal.classList.add('hidden'); }

    async function renderHistoryList() {
      const diaries = await getRecentDiaries(7);
      statDays.textContent = planetState.totalDays;
      statPositive.textContent = Math.round(planetState.positiveRatio * 100) + '%';
      
      if (diaries.length === 0) {
        historyList.innerHTML = '<div class="text-center text-gray-500 py-8">暂无历史记录</div>';
        return;
      }
      
      const groupedByDate = {};
      diaries.forEach(diary => {
        const date = new Date(diary.date).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', weekday: 'short' });
        if (!groupedByDate[date]) groupedByDate[date] = [];
        groupedByDate[date].push(diary);
      });
      
      let html = '';
      Object.keys(groupedByDate).forEach(date => {
        html += `<div class="mb-4"><div class="text-sm text-gray-400 mb-2">${date}</div>`;
        groupedByDate[date].forEach(diary => {
          html += `<div class="bg-dark-purple rounded-lg p-3 mb-2 relative" id="diary-${diary.id}">
            <div class="flex items-center gap-2 mb-2">
              <span class="px-2 py-1 rounded-full text-xs ${getEmotionClass(diary.emotion)}">${getEmotionText(diary.emotion)}</span>
              <span class="text-xs text-gray-500">${Math.round(diary.intensity * 100)}%</span>
            </div>
            <p class="text-sm text-gray-300 line-clamp-2 mb-2">${diary.content}</p>
            <button onclick="handleDeleteDiary(${diary.id})" class="absolute top-2 right-2 px-2 py-1 bg-red-600/30 hover:bg-red-600 text-red-400 hover:text-white rounded text-xs transition-all">删除</button>
          </div>`;
        });
        html += '</div>';
      });
      
      historyList.innerHTML = html;
    }

    window.handleDeleteDiary = async function(diaryId) {
      if (!confirm('确认删除？删除后无法恢复')) return;
      try {
        await deleteDiary(diaryId);
        renderHistoryList();
      } catch (error) {
        console.error('删除失败:', error);
      }
    };

    function getEmotionClass(emotion) {
      const classes = {
        happy: 'bg-green-500/30 text-green-400',
        sad: 'bg-blue-500/30 text-blue-400',
        angry: 'bg-red-500/30 text-red-400',
        surprised: 'bg-orange-500/30 text-orange-400',
        neutral: 'bg-gray-500/30 text-gray-400',
        excited: 'bg-pink-500/30 text-pink-400',
        calm: 'bg-cyan-500/30 text-cyan-400',
        worried: 'bg-yellow-500/30 text-yellow-400',
        hopeful: 'bg-lime-500/30 text-lime-400',
        confused: 'bg-purple-500/30 text-purple-400'
      };
      return classes[emotion] || classes.neutral;
    }

    function getEmotionText(emotion) {
      const texts = {
        happy: '开心', sad: '难过', angry: '生气', surprised: '惊讶', neutral: '平静',
        excited: '兴奋', calm: '平静', worried: '焦虑', hopeful: '期待', confused: '困惑'
      };
      return texts[emotion] || '未知';
    }

    function extractEmotion(text) {
      let emotion = { type: 'neutral', intensity: 0 };
      const lines = text.trim().split('\n');
      const lastLine = lines[lines.length - 1]?.trim() || '';
      
      try {
        if (lastLine.startsWith('{') && lastLine.endsWith('}')) {
          const parsed = JSON.parse(lastLine);
          if (parsed.emotion && typeof parsed.intensity === 'number') {
            const validEmotions = ['happy', 'sad', 'angry', 'surprised', 'neutral', 'excited', 'calm', 'worried', 'hopeful', 'confused'];
            if (validEmotions.includes(parsed.emotion)) emotion.type = parsed.emotion;
            emotion.intensity = Math.max(0, Math.min(1, parsed.intensity));
            const displayText = lines.slice(0, -1).join('\n').trim() || '已收到你的消息。';
            return { displayText, emotion };
          }
        }
      } catch (e) {}
      
      return { displayText: text, emotion };
    }

    async function sendMessage() {
      const message = chatInput.value.trim();
      if (!message) return;
      
      addMessage(message, 'user');
      chatInput.value = '';
      chatInput.disabled = true;
      sendBtn.disabled = true;
      
      const thinkingId = addThinkingMessage();
      
      try {
        const emotion = { type: 'happy', intensity: 0.7 };
        targetEmotion = emotion;
        
        await saveDiary(message, emotion.type, emotion.intensity);
        updatePlanetGrowth(emotion.type);
        
        removeThinkingMessage(thinkingId);
        addMessage(getEmotionReply(emotion.type), 'ai', emotion);
      } catch (error) {
        removeThinkingMessage(thinkingId);
        addMessage('抱歉，暂时无法连接到AI服务。', 'ai');
      } finally {
        chatInput.disabled = false;
        sendBtn.disabled = false;
        chatInput.focus();
      }
    }

    function getEmotionReply(emotion) {
      const replies = {
        happy: '看到你开心，我也很开心！继续保持这份好心情吧～',
        sad: '难过的时候，记得你不是一个人。明天会更好的。',
        angry: '生气也是一种能量，试着深呼吸，让它平静下来。',
        surprised: '哇，真的很令人惊讶呢！分享给我听听吧～',
        neutral: '平平淡淡的日子也很珍贵，享受当下吧。',
        excited: '好激动啊！期待你接下来的精彩～',
        calm: '平静的心境很美好，保持这份宁静。',
        worried: '别担心，一切都会好起来的。你已经做得很棒了。',
        hopeful: '充满希望的感觉真好！让我们一起期待美好的未来。',
        confused: '迷茫的时候，停下来想一想，答案会慢慢浮现的。'
      };
      return replies[emotion] || '谢谢你的分享～';
    }

    function addMessage(text, sender, emotion = null) {
      const container = document.getElementById('diary-lines');
      if (container.querySelector('.empty-hint')) container.innerHTML = '';
      
      const messageDiv = document.createElement('div');
      messageDiv.className = `diary-message diary-message-${sender}`;
      
      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
      
      if (sender === 'user') {
        messageDiv.innerHTML = `<div class="message-content">${text}</div><div class="message-time">${timeStr}</div>`;
      } else {
        messageDiv.innerHTML = `<div class="message-header"><div class="avatar-pixel">星</div><span style="font-size:14px;color:#8a7060;">星守</span></div>
          <div class="message-content typewriter"></div><div class="message-time">${timeStr}</div>`;
        if (emotion) messageDiv.innerHTML += `<div class="emotion-tag ${emotion.type}">${getEmotionText(emotion.type)} ${Math.round(emotion.intensity * 100)}%</div>`;
        
        const contentElement = messageDiv.querySelector('.message-content');
        typewriterEffect(contentElement, text);
      }
      
      container.appendChild(messageDiv);
      const diaryContent = document.getElementById('diary-content');
      diaryContent.scrollTop = diaryContent.scrollHeight;
    }

    function typewriterEffect(element, text, speed = 30) {
      element.textContent = '';
      let index = 0;
      function type() {
        if (index < text.length) {
          element.textContent += text.charAt(index);
          index++;
          setTimeout(type, speed);
          const diaryContent = document.getElementById('diary-content');
          diaryContent.scrollTop = diaryContent.scrollHeight;
        }
      }
      type();
    }

    let thinkingIdCounter = 0;

    function addThinkingMessage() {
      const thinkingId = `thinking-${++thinkingIdCounter}`;
      const container = document.getElementById('diary-lines');
      if (container.querySelector('.empty-hint')) container.innerHTML = '';
      
      const messageDiv = document.createElement('div');
      messageDiv.id = thinkingId;
      messageDiv.className = 'writing-indicator';
      messageDiv.innerHTML = '<span>星守正在书写...</span><div class="writing-dots"><span></span><span></span><span></span></div>';
      
      container.appendChild(messageDiv);
      const diaryContent = document.getElementById('diary-content');
      diaryContent.scrollTop = diaryContent.scrollHeight;
      return thinkingId;
    }

    function removeThinkingMessage(thinkingId) {
      const element = document.getElementById(thinkingId);
      if (element) element.remove();
    }

    function handleResize() {
      const container = document.getElementById('canvas-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    window.addEventListener('resize', handleResize);

    function initDateSystem() {
      updateDateDisplay();
      loadDiaryForDate(currentDate);
      
      prevPageBtn.addEventListener('click', () => turnPage(-1));
      nextPageBtn.addEventListener('click', () => turnPage(1));
      
      datePickerPrevMonth.addEventListener('click', () => changeDatePickerMonth(-1));
      datePickerNextMonth.addEventListener('click', () => changeDatePickerMonth(1));
      datePickerToday.addEventListener('click', () => selectToday());
      datePickerHistory.addEventListener('click', () => { closeDatePicker(); openHistoryModal(); });
      closeDatePickerBtn.addEventListener('click', closeDatePicker);
      
      datePickerModal.addEventListener('click', (e) => { if (e.target === datePickerModal) closeDatePicker(); });
    }

    function updateDateDisplay() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      const day = currentDate.getDate();
      const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const weekDay = weekDays[currentDate.getDay()];
      
      dateText.textContent = `${year}年 ${month}月 ${day}日 ${weekDay}`;
      updatePageButtons();
    }

    function updatePageButtons() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const currentDateNoTime = new Date(currentDate);
      currentDateNoTime.setHours(0, 0, 0, 0);
      nextPageBtn.disabled = currentDateNoTime >= today;
      prevPageBtn.disabled = false;
    }

    function turnPage(direction) {
      if (isTurningPage) return;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const newDate = new Date(currentDate);
      newDate.setDate(currentDate.getDate() + direction);
      newDate.setHours(0, 0, 0, 0);
      
      if (direction === 1 && newDate > today) return;
      
      isTurningPage = true;
      setTimeout(() => {
        currentDate.setDate(currentDate.getDate() + direction);
        updateDateDisplay();
        loadDiaryForDate(currentDate);
        isTurningPage = false;
      }, 500);
    }

    let isSoundEnabled = false;

    window.toggleSound = function() {
      isSoundEnabled = !isSoundEnabled;
      const soundBtn = document.getElementById('date-picker-sound');
      soundBtn.textContent = isSoundEnabled ? '🔊' : '🔇';
    };

    window.openDatePicker = function() {
      datePickerDate = new Date(currentDate);
      renderDatePicker();
      datePickerModal.classList.remove('hidden');
    };

    function closeDatePicker() { datePickerModal.classList.add('hidden'); }

    async function renderDatePicker() {
      const year = datePickerDate.getFullYear();
      const month = datePickerDate.getMonth();
      datePickerTitle.textContent = `${year}年 ${month + 1}月`;
      
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startDay = firstDay.getDay();
      
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const currentDateNoTime = new Date(currentDate);
      currentDateNoTime.setHours(0, 0, 0, 0);
      
      const datesWithDiary = await getDatesWithDiary();
      
      let html = '';
      for (let i = 0; i < startDay; i++) html += '<button class="other-month"></button>';
      
      for (let day = 1; day <= lastDay.getDate(); day++) {
        const date = new Date(year, month, day);
        date.setHours(0, 0, 0, 0);
        
        let classes = '';
        if (date.getTime() === today.getTime()) classes += ' today';
        if (date.getTime() === currentDateNoTime.getTime()) classes += ' selected';
        if (datesWithDiary.has(date.toISOString().split('T')[0])) classes += ' has-diary';
        if (date > today) classes += ' other-month';
        
        html += `<button class="${classes}" onclick="selectDate(${year}, ${month}, ${day})">${day}</button>`;
      }
      
      datePickerGrid.innerHTML = html;
    }

    function getDatesWithDiary() {
      return new Promise((resolve) => {
        if (!db) { resolve(new Set()); return; }
        const transaction = db.transaction(['diaries'], 'readonly');
        const store = transaction.objectStore('diaries');
        const dates = new Set();
        store.openCursor().onsuccess = (event) => {
          const cursor = event.target.result;
          if (cursor) {
            dates.add(cursor.value.date.split('T')[0]);
            cursor.continue();
          } else resolve(dates);
        };
        transaction.onerror = () => resolve(new Set());
      });
    }

    function changeDatePickerMonth(direction) {
      datePickerDate.setMonth(datePickerDate.getMonth() + direction);
      renderDatePicker();
    }

    window.selectDate = function(year, month, day) {
      const newDate = new Date(year, month, day);
      newDate.setHours(0, 0, 0, 0);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      if (newDate > today) return;
      
      currentDate = new Date(newDate);
      updateDateDisplay();
      loadDiaryForDate(currentDate);
      closeDatePicker();
    };

    function selectToday() {
      currentDate = new Date();
      updateDateDisplay();
      loadDiaryForDate(currentDate);
      closeDatePicker();
    }

    function loadDiaryForDate(date) {
      const dateStr = date.toISOString().split('T')[0];
      if (!db) { showEmptyDiary(); return; }
      
      const transaction = db.transaction(['diaries'], 'readonly');
      const store = transaction.objectStore('diaries');
      const index = store.index('date');
      const results = [];
      
      index.openCursor().onsuccess = (event) => {
        const cursor = event.target.result;
        if (cursor) {
          if (cursor.value.date.split('T')[0] === dateStr) results.push(cursor.value);
          cursor.continue();
        } else {
          if (results.length > 0) renderDiaryEntries(results);
          else showEmptyDiary();
          updateEmotionPanel();
        }
      };
      transaction.onerror = () => showEmptyDiary();
    }

    function renderDiaryEntries(diaries) {
      const container = document.getElementById('diary-lines');
      container.innerHTML = '';
      
      diaries.forEach(diary => {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'diary-message diary-message-user';
        const date = new Date(diary.date);
        const timeStr = `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
        messageDiv.innerHTML = `<div class="message-content">${diary.content}</div><div class="message-time">${timeStr}</div>`;
        container.appendChild(messageDiv);
        
        const aiMessageDiv = document.createElement('div');
        aiMessageDiv.className = 'diary-message diary-message-ai';
        aiMessageDiv.innerHTML = `<div class="message-header"><div class="avatar-pixel">星</div><span style="font-size:14px;color:#8a7060;">星守</span></div>
          <div class="message-content">${getEmotionReply(diary.emotion)}</div><div class="message-time">${timeStr}</div>
          <div class="emotion-tag ${diary.emotion}">${getEmotionText(diary.emotion)} ${Math.round(diary.intensity * 100)}%</div>`;
        container.appendChild(aiMessageDiv);
      });
    }

    function showEmptyDiary() {
      document.getElementById('diary-lines').innerHTML = '<div class="empty-hint">今天还没有记录哦</div>';
    }

    function updateEmotionPanel() {
      const emotionIcon = document.getElementById('current-emotion-icon');
      const emotionName = document.getElementById('current-emotion-name');
      const emotionIntensity = document.getElementById('current-emotion-intensity');
      const emotionList = document.getElementById('emotion-list');
      
      if (!emotionIcon || !emotionName || !emotionIntensity) return;
      
      const emotionIcons = {
        happy: '😊', sad: '😢', angry: '😠', surprised: '😲', neutral: '😐',
        excited: '🤩', calm: '😌', worried: '😟', hopeful: '🌟', confused: '😕'
      };
      
      emotionIcon.textContent = emotionIcons[currentEmotion.type] || '😐';
      emotionName.textContent = getEmotionText(currentEmotion.type);
      emotionIntensity.textContent = Math.round(currentEmotion.intensity * 100) + '%';
      
      loadRecentEmotions();
    }

    function loadRecentEmotions() {
      const emotionList = document.getElementById('emotion-list');
      if (!emotionList || !db) return;
      
      const transaction = db.transaction(['diaries'], 'readonly');
      const store = transaction.objectStore('diaries');
      const index = store.index('date');
      const results = [];
      
      index.openCursor(null, 'prev').onsuccess = (event) => {
        const cursor = event.target.result;
        if (cursor) {
          if (results.length < 5) results.push(cursor.value);
          cursor.continue();
        } else {
          if (results.length > 0) renderEmotionHistory(results);
          else emotionList.innerHTML = '<div class="empty-emotion">暂无情绪记录</div>';
        }
      };
    }

    function renderEmotionHistory(diaries) {
      const emotionList = document.getElementById('emotion-list');
      if (!emotionList) return;
      
      const emotionIcons = {
        happy: '😊', sad: '😢', angry: '😠', surprised: '😲', neutral: '😐',
        excited: '🤩', calm: '😌', worried: '😟', hopeful: '🌟', confused: '😕'
      };
      
      let html = '';
      diaries.forEach(diary => {
        const date = new Date(diary.date);
        const timeStr = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
        html += `<div class="emotion-item"><div class="emotion-icon">${emotionIcons[diary.emotion] || '😐'}</div>
          <div class="emotion-item-info"><div class="emotion-item-name">${getEmotionText(diary.emotion)}</div>
          <div class="emotion-item-time">${timeStr}</div></div></div>`;
      });
      
      emotionList.innerHTML = html;
    }

    async function initApp() {
      try {
        await initDB();
        await loadPlanetState();
      } catch (error) {
        console.error('初始化失败:', error);
      }
    }

    initApp();
    initChat();
    initDateSystem();
  </script>
</body>
</html>
