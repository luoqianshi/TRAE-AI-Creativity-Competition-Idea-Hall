<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校园二手书捐赠平台 · 演示</title>
    <!-- Font Awesome & Google Font -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
        /* ----- Reset & Base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f2f6f3;
            color: #1e293b;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            max-width: 1280px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.12);
            padding: 28px 32px 36px;
            transition: all 0.2s;
        }

        /* ----- Typography ----- */
        h1,
        h2,
        h3,
        h4 {
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .text-muted {
            color: #94a3b8;
            font-size: 0.875rem;
        }

        .text-small {
            font-size: 0.8rem;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: #e6f7ec;
            color: #0b6e4f;
        }
        .badge-warning {
            background: #fef3c7;
            color: #b45309;
        }
        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }
        .badge-danger {
            background: #fee2e2;
            color: #b91c1c;
        }
        .badge-info {
            background: #e0f2fe;
            color: #0369a1;
        }

        /* ----- Header ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-left .icon-circle {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, #0b6e4f, #10b981);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.5rem;
            box-shadow: 0 8px 20px -8px rgba(16, 185, 129, 0.4);
        }

        .header-left h1 {
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(135deg, #064e3b, #047857);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-left .sub {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 400;
            -webkit-text-fill-color: #64748b;
            background: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            border: none;
            padding: 10px 22px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            color: #1e293b;
        }

        .btn-primary {
            background: #0b6e4f;
            color: #fff;
            box-shadow: 0 4px 12px -4px rgba(11, 110, 79, 0.35);
        }
        .btn-primary:hover {
            background: #065f3e;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -6px rgba(11, 110, 79, 0.45);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #d1d9d6;
        }
        .btn-outline:hover {
            background: #f8fafc;
            border-color: #a0b3b0;
        }
        .btn-success {
            background: #10b981;
            color: #fff;
        }
        .btn-success:hover {
            background: #059669;
        }

        /* ----- 统计卡片 ----- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: #f9fcfb;
            border-radius: 18px;
            padding: 16px 18px;
            border: 1px solid #e4ece9;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: #e6f7ec;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0b6e4f;
            font-size: 1.3rem;
        }

        .stat-content h4 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .stat-content p {
            font-size: 0.75rem;
            color: #64748b;
            margin: 0;
        }

        /* ----- 导航标签 ----- */
        .tab-bar {
            display: flex;
            gap: 6px;
            border-bottom: 1.5px solid #e9efec;
            padding-bottom: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 8px 18px;
            border-radius: 100px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #64748b;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn:hover {
            background: #f1f5f4;
            color: #1e293b;
        }
        .tab-btn.active {
            background: #0b6e4f;
            color: #fff;
        }

        /* ----- 书籍网格 ----- */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 24px;
            margin-top: 8px;
        }

        .book-card {
            background: #fafdfc;
            border-radius: 20px;
            padding: 16px 14px 18px;
            border: 1px solid #e4ece9;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }
        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.1);
            border-color: #b8d5cb;
        }

        .book-cover {
            width: 100%;
            aspect-ratio: 3/4;
            background: #e2ece8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #0b6e4f;
            margin-bottom: 12px;
            background-image: linear-gradient(135deg, #d9e8e3, #c0d9d0);
        }

        .book-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .book-author {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 6px;
        }

        .book-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .book-status {
            font-size: 0.7rem;
            font-weight: 500;
        }

        .book-action {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }
        .book-action .btn {
            flex: 1;
            justify-content: center;
            padding: 6px 0;
            font-size: 0.75rem;
        }

        /* ----- 右侧面板（捐赠榜 / 动态） ----- */
        .side-panel {
            background: #f9fcfb;
            border-radius: 20px;
            padding: 18px 20px;
            border: 1px solid #e4ece9;
        }

        .side-panel h3 {
            font-size: 1rem;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .donor-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #e9efec;
        }
        .donor-item:last-child {
            border-bottom: none;
        }

        .donor-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #d1e0da;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #064e3b;
            font-size: 0.8rem;
        }

        .donor-info {
            flex: 1;
            font-size: 0.85rem;
        }
        .donor-info .name {
            font-weight: 500;
        }
        .donor-info .count {
            color: #64748b;
            font-size: 0.7rem;
        }

        .donor-badge {
            background: #e6f7ec;
            color: #0b6e4f;
            border-radius: 100px;
            padding: 2px 10px;
            font-size: 0.65rem;
            font-weight: 600;
        }

        /* ----- 模态框 ----- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            background: #fff;
            border-radius: 28px;
            max-width: 480px;
            width: 90%;
            padding: 32px 30px 30px;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.3);
            animation: modalIn 0.25s ease;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.95) translateY(12px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .modal-box h2 {
            font-size: 1.4rem;
            margin-bottom: 6px;
        }
        .modal-box .sub {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            font-weight: 500;
            font-size: 0.85rem;
            display: block;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 0.9rem;
            font-family: inherit;
            background: #fafcfb;
            transition: 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #0b6e4f;
            box-shadow: 0 0 0 4px rgba(11, 110, 79, 0.08);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 22px;
            justify-content: flex-end;
        }

        /* ----- 响应式 ----- */
        @media (max-width: 860px) {
            .app-container {
                padding: 20px;
            }
            .grid-2col {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .header-left h1 {
                font-size: 1.3rem;
            }
            .header-right .btn span {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .book-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* 辅助布局 */
        .grid-2col {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 28px;
            align-items: start;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #fff;
            padding: 12px 28px;
            border-radius: 100px;
            font-weight: 500;
            font-size: 0.9rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }

        .empty-state {
            color: #94a3b8;
            text-align: center;
            padding: 40px 20px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="header-left">
            <div class="icon-circle"><i class="fas fa-book-open"></i></div>
            <div>
                <h1>书途 · 二手书捐赠</h1>
                <div class="sub">高年级赠书 · 低年级接力</div>
            </div>
        </div>
        <div class="header-right">
            <button class="btn btn-primary" id="openDonateModal"><i class="fas fa-plus-circle"></i> <span>发布捐赠</span></button>
            <button class="btn btn-outline"><i class="fas fa-user"></i> <span>我的</span></button>
        </div>
    </div>

    <!-- ===== STATS ===== -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-book"></i></div>
            <div class="stat-content">
                <h4 id="totalBooks">48</h4>
                <p>可捐赠书籍</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-hand-holding-heart"></i></div>
            <div class="stat-content">
                <h4 id="pendingBooks">12</h4>
                <p>待领取申请</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
            <div class="stat-content">
                <h4 id="donatedBooks">136</h4>
                <p>已捐赠</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-users"></i></div>
            <div class="stat-content">
                <h4>89</h4>
                <p>活跃用户</p>
            </div>
        </div>
    </div>

    <!-- ===== TAB NAV ===== -->
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="all">全部书籍</button>
        <button class="tab-btn" data-tab="available">可领取</button>
        <button class="tab-btn" data-tab="popular">热门推荐</button>
        <button class="tab-btn" data-tab="my">我的捐赠</button>
    </div>

    <!-- ===== MAIN 2-COL ===== -->
    <div class="grid-2col">
        <!-- 左：书籍列表 -->
        <div>
            <div class="book-grid" id="bookGrid">
                <!-- 动态由 js 渲染 -->
            </div>
        </div>

        <!-- 右：捐赠榜 + 动态 -->
        <div class="side-panel">
            <h3><i class="fas fa-trophy" style="color:#0b6e4f;"></i> 捐赠达人榜</h3>
            <div id="donorList">
                <!-- 动态渲染 -->
            </div>
            <hr style="border:0; border-top:1px solid #e4ece9; margin: 18px 0 12px;" />
            <h3><i class="fas fa-clock" style="color:#0b6e4f;"></i> 最新动态</h3>
            <div id="activityFeed" style="font-size:0.85rem; color:#475569;">
                <!-- 动态渲染 -->
            </div>
        </div>
    </div>

    <!-- ===== 底部 ===== -->
    <div style="margin-top: 32px; border-top: 1px solid #e9efec; padding-top: 18px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size:0.8rem; color:#94a3b8;">
        <span>© 2026 书途 · 校园二手书捐赠平台 ｜ 让知识流动起来</span>
        <span><i class="fas fa-recycle"></i> 已减少浪费 1,280 本书</span>
    </div>
</div>

<!-- ===== 模态框：发布捐赠 ===== -->
<div class="modal-overlay" id="donateModal">
    <div class="modal-box">
        <h2><i class="fas fa-gift" style="color:#0b6e4f;"></i> 发布捐赠</h2>
        <div class="sub">填写书籍信息，让学弟学妹受益</div>
        <div class="form-group">
            <label>书名 *</label>
            <input type="text" id="bookTitle" placeholder="例：高等数学（第七版）" />
        </div>
        <div class="form-group">
            <label>作者 *</label>
            <input type="text" id="bookAuthor" placeholder="例：同济大学数学系" />
        </div>
        <div class="form-group">
            <label>类别</label>
            <select id="bookCategory">
                <option>教材教辅</option>
                <option>文学小说</option>
                <option>科技科普</option>
                <option>语言学习</option>
                <option>其他</option>
            </select>
        </div>
        <div class="form-group">
            <label>新旧程度</label>
            <select id="bookCondition">
                <option>全新</option>
                <option>较新（无笔记）</option>
                <option>有少量笔记</option>
                <option>有较多笔记</option>
            </select>
        </div>
        <div class="form-group">
            <label>备注（可选）</label>
            <textarea id="bookNote" placeholder="例如：适合大一新生，内含重点标注"></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" id="closeDonateModal">取消</button>
            <button class="btn btn-primary" id="submitDonate">确认发布</button>
        </div>
    </div>
</div>

<!-- ===== Toast 通知 ===== -->
<div class="toast" id="toast"></div>

<script>
    (function() {
        // ---------- 模拟数据 ----------
        const books = [
            { id: 1, title: '高等数学（第七版）', author: '同济大学数学系', category: '教材教辅', condition: '较新（无笔记）', status: 'available', donor: '张明', cover: '📐' },
            { id: 2, title: 'C++ Primer 中文版', author: 'Lippman', category: '科技科普', condition: '有少量笔记', status: 'available', donor: '李华', cover: '💻' },
            { id: 3, title: '活着', author: '余华', category: '文学小说', condition: '全新', status: 'pending', donor: '王芳', cover: '📖' },
            { id: 4, title: '新概念英语 3', author: 'L.G. Alexander', category: '语言学习', condition: '较新（无笔记）', status: 'donated', donor: '陈静', cover: '📘' },
            { id: 5, title: '数据结构与算法', author: '邓俊辉', category: '教材教辅', condition: '有较多笔记', status: 'available', donor: '赵磊', cover: '🔍' },
            { id: 6, title: '人类简史', author: '尤瓦尔·赫拉利', category: '文学小说', condition: '全新', status: 'available', donor: '刘洋', cover: '🌍' },
            { id: 7, title: 'Python 编程快速上手', author: 'Al Sweigart', category: '科技科普', condition: '较新（无笔记）', status: 'donated', donor: '周欣', cover: '🐍' },
            { id: 8, title: '大学英语六级真题', author: '星火英语', category: '语言学习', condition: '有少量笔记', status: 'available', donor: '吴迪', cover: '📝' },
        ];

        const donors = [
            { name: '张明', count: 14, avatar: '张' },
            { name: '李华', count: 11, avatar: '李' },
            { name: '王芳', count: 9, avatar: '王' },
            { name: '陈静', count: 8, avatar: '陈' },
            { name: '赵磊', count: 7, avatar: '赵' },
        ];

        const activities = [
            '张明 捐赠了《高等数学》',
            '李华 领取了《C++ Primer》',
            '王芳 发布了《活着》',
            '陈静 捐赠了《新概念英语》',
            '赵磊 发布了《数据结构与算法》',
        ];

        let currentTab = 'all';
        let bookIdCounter = 9;

        // DOM refs
        const bookGrid = document.getElementById('bookGrid');
        const donorList = document.getElementById('donorList');
        const activityFeed = document.getElementById('activityFeed');
        const toast = document.getElementById('toast');

        const donateModal = document.getElementById('donateModal');
        const openBtn = document.getElementById('openDonateModal');
        const closeBtn = document.getElementById('closeDonateModal');
        const submitBtn = document.getElementById('submitDonate');

        // ---------- 渲染函数 ----------
        function renderBooks(filter = 'all') {
            let filtered = books;
            if (filter === 'available') {
                filtered = books.filter(b => b.status === 'available');
            } else if (filter === 'popular') {
                // 模拟热门：取前3
                filtered = books.slice(0, 3);
            } else if (filter === 'my') {
                // 模拟我的捐赠：取部分
                filtered = books.filter(b => b.donor === '张明' || b.donor === '李华');
            }

            if (filtered.length === 0) {
                bookGrid.innerHTML = `<div class="empty-state"><i class="fas fa-book" style="font-size:2rem; opacity:0.3; display:block; margin-bottom:12px;"></i>暂无书籍，去发布一本吧</div>`;
                return;
            }

            bookGrid.innerHTML = filtered.map(b => {
                const statusMap = {
                    'available': { label: '可领取', cls: 'badge-success' },
                    'pending': { label: '待审核', cls: 'badge-warning' },
                    'donated': { label: '已捐赠', cls: 'badge-info' },
                };
                const st = statusMap[b.status] || statusMap['available'];
                return `
                    <div class="book-card">
                        <div class="book-cover">${b.cover || '📚'}</div>
                        <div class="book-title">${b.title}</div>
                        <div class="book-author">${b.author}</div>
                        <div class="book-meta">
                            <span class="book-status badge ${st.cls}">${st.label}</span>
                            <span style="font-size:0.7rem; color:#94a3b8;">${b.donor}</span>
                        </div>
                        <div class="book-action">
                            ${b.status === 'available' ? `<button class="btn btn-success" onclick="requestBook(${b.id})"><i class="fas fa-hand-holding-heart"></i> 领取</button>` : 
                            `<button class="btn btn-outline" disabled style="opacity:0.5;"><i class="fas fa-check"></i> 已处理</button>`}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderDonors() {
            donorList.innerHTML = donors.map((d, idx) => `
                <div class="donor-item">
                    <div class="donor-avatar">${d.avatar}</div>
                    <div class="donor-info">
                        <div class="name">${d.name}</div>
                        <div class="count">捐赠 ${d.count} 本书</div>
                    </div>
                    ${idx < 3 ? `<span class="donor-badge"><i class="fas fa-crown"></i> TOP${idx+1}</span>` : ''}
                </div>
            `).join('');
        }

        function renderActivities() {
            activityFeed.innerHTML = activities.map(a => `<div style="padding:5px 0; border-bottom:1px solid #edf3f0;">• ${a}</div>`).join('');
        }

        // ---------- 交互 ----------
        window.requestBook = function(bookId) {
            const book = books.find(b => b.id === bookId);
            if (!book) return;
            if (book.status !== 'available') {
                showToast('这本书已被处理了～');
                return;
            }
            // 模拟领取
            book.status = 'pending';
            renderBooks(currentTab);
            showToast(`✅ 已提交领取申请：《${book.title}》，等待捐赠者确认`);
            // 更新统计（简单）
            document.getElementById('pendingBooks').textContent = parseInt(document.getElementById('pendingBooks').textContent) + 1;
            // 更新活动
            activities.unshift(`你 申请领取了《${book.title}》`);
            renderActivities();
        };

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // 模态框
        openBtn.addEventListener('click', () => donateModal.classList.add('show'));
        closeBtn.addEventListener('click', () => donateModal.classList.remove('show'));
        donateModal.addEventListener('click', (e) => {
            if (e.target === donateModal) donateModal.classList.remove('show');
        });

        submitBtn.addEventListener('click', () => {
            const title = document.getElementById('bookTitle').value.trim();
            const author = document.getElementById('bookAuthor').value.trim();
            if (!title || !author) {
                showToast('请至少填写书名和作者');
                return;
            }
            const category = document.getElementById('bookCategory').value;
            const condition = document.getElementById('bookCondition').value;
            const note = document.getElementById('bookNote').value.trim();

            // 添加新书
            const newBook = {
                id: bookIdCounter++,
                title: title,
                author: author,
                category: category,
                condition: condition,
                status: 'available',
                donor: '我',
                cover: '📕',
                note: note
            };
            books.unshift(newBook);
            renderBooks(currentTab);
            // 更新统计
            document.getElementById('totalBooks').textContent = books.filter(b => b.status === 'available').length;
            // 更新动态
            activities.unshift(`你 发布了《${title}》`);
            renderActivities();
            // 关闭模态
            donateModal.classList.remove('show');
            document.getElementById('bookTitle').value = '';
            document.getElementById('bookAuthor').value = '';
            document.getElementById('bookNote').value = '';
            showToast(`🎉 《${title}》发布成功，等待学弟学妹领取！`);
        });

        // Tab 切换
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentTab = this.dataset.tab;
                renderBooks(currentTab);
            });
        });

        // 初始渲染
        renderBooks('all');
        renderDonors();
        renderActivities();

        // 更新统计数字（模拟）
        document.getElementById('totalBooks').textContent = books.filter(b => b.status === 'available').length;
        document.getElementById('pendingBooks').textContent = books.filter(b => b.status === 'pending').length;
        document.getElementById('donatedBooks').textContent = books.filter(b => b.status === 'donated').length;

        // 暴露给全局（用于按钮onclick）
        window.renderBooks = renderBooks;
    })();
</script>

</body>
</html>
