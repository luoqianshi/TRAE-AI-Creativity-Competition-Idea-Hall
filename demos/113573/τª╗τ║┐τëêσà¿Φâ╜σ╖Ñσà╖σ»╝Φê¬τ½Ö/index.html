<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离线版全能工具导航站</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo" onclick="goHome()">🔧 工具导航</div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" placeholder="搜索工具名称、标签、分类..." id="searchInput">
            </div>
            <div class="header-actions">
                <button class="header-btn" onclick="showFavorites()">⭐ 我的收藏</button>
                <button class="header-btn primary" onclick="openAddModal()">+ 新增工具</button>
            </div>
        </div>
    </header>

    <main class="container main-content">
        <div id="homePage" style="display: block;">
            <h1 class="section-title">工具分类</h1>
            <div class="categories-grid" id="categoriesGrid"></div>

            <h1 class="section-title">热门工具</h1>
            <div class="tools-grid" id="hotToolsGrid"></div>
        </div>

        <div id="categoryPage" style="display: none;">
            <div class="breadcrumb">
                <a href="#" onclick="goHome()">首页</a>
                <span>/</span>
                <span id="currentCategoryName"></span>
            </div>
            <h1 class="section-title" id="categoryTitle"></h1>
            <div class="subcategory-tabs" id="subcategoryTabs"></div>
            <div class="tools-grid" id="categoryToolsGrid"></div>
        </div>

        <div id="searchPage" style="display: none;">
            <div class="search-results-header">
                <h1 class="section-title">搜索结果</h1>
                <span class="search-keyword" id="searchKeyword"></span>
                <button class="header-btn clear-search-btn" onclick="goHome()">清除搜索</button>
            </div>
            <div class="tools-grid" id="searchResultsGrid"></div>
        </div>

        <div id="favoritesPage" style="display: none;">
            <a href="#" class="back-to-home" onclick="goHome()">← 返回首页</a>
            <h1 class="section-title">⭐ 我的收藏</h1>
            <div class="tools-grid" id="favoritesGrid"></div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-text">📦 离线版全能工具导航站 - 纯本地运行，零联网依赖</div>
            <div class="footer-text">💡 使用说明：点击工具卡片访问 | 点击星星收藏 | 点击+新增自定义工具</div>
            <div class="footer-version">版本 v1.0.0</div>
        </div>
    </footer>

    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <button class="modal-close" onclick="closeAddModal()">×</button>
            <h2 class="modal-title" id="modalTitle">新增工具</h2>
            <form id="toolForm">
                <input type="hidden" id="toolId">
                <div class="form-group">
                    <label>工具名称 *</label>
                    <input type="text" id="toolName" required placeholder="请输入工具名称">
                </div>
                <div class="form-group">
                    <label>网址 *</label>
                    <input type="url" id="toolUrl" required placeholder="请输入工具网址（以http://或https://开头）">
                </div>
                <div class="form-group">
                    <label>分类 *</label>
                    <select id="toolCategory" required>
                        <option value="">请选择分类</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>二级分类</label>
                    <select id="toolSubcategory">
                        <option value="">请选择二级分类</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>简介</label>
                    <textarea id="toolDescription" placeholder="请输入工具简介"></textarea>
                </div>
                <div class="form-group">
                    <label>标签</label>
                    <input type="text" id="toolTags" placeholder="多个标签用逗号分隔">
                    <div class="form-hint">例如：设计, 图片, 素材</div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="modal-btn cancel" onclick="closeAddModal()">取消</button>
                    <button type="submit" class="modal-btn confirm">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <h2 class="modal-title">确认删除</h2>
            <p style="margin-bottom: 25px; color: #666;">确定要删除这个工具吗？此操作无法撤销。</p>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeDeleteModal()">取消</button>
                <button class="modal-btn confirm" style="background-color: #ff4d4f;" onclick="confirmDelete()">删除</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
