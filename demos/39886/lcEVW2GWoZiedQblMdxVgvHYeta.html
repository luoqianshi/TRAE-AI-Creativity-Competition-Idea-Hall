<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英烈纪念 · 永垂不朽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
  :root {
    --crimson: #8B1A1A;
    --crimson-deep: #6B0F0F;
    --crimson-soft: #A83232;
    --gold: #C9A961;
    --gold-bright: #D4AF37;
    --gold-deep: #8C7428;
    --ivory: #F5EFE3;
    --paper: #FAF6EC;
    --paper-dark: #EDE4D0;
    --ink: #2C1810;
    --ink-soft: #4A3A2A;
    --muted: #8A7E6B;
    --line: #C9BFA8;
    --shadow: rgba(44, 24, 16, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
    line-height: 1.7;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Paper texture background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(139, 26, 26, 0.04) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(201, 169, 97, 0.05) 0%, transparent 50%),
      repeating-linear-gradient(45deg, transparent 0, transparent 2px, rgba(44, 24, 16, 0.012) 2px, rgba(44, 24, 16, 0.012) 3px);
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='5'/><feColorMatrix values='0 0 0 0 0.17 0 0 0 0 0.09 0 0 0 0 0.06 0 0 0 0.08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* Top decorative border */
  .top-border {
    height: 6px;
    background: linear-gradient(90deg,
      var(--crimson-deep) 0%, var(--crimson) 30%, var(--gold) 50%, var(--crimson) 70%, var(--crimson-deep) 100%);
    position: relative;
  }
  .top-border::before, .top-border::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 50%;
    background-image: repeating-linear-gradient(90deg, transparent 0, transparent 8px, rgba(255,255,255,0.15) 8px, rgba(255,255,255,0.15) 10px);
  }
  .top-border::before { left: 0; }
  .top-border::after { right: 0; }

  /* Header / Hero */
  header.hero {
    padding: 80px 0 60px;
    text-align: center;
    position: relative;
  }

  .ribbon {
    display: inline-block;
    padding: 6px 24px;
    background: var(--crimson);
    color: var(--paper);
    font-size: 12px;
    letter-spacing: 0.6em;
    font-weight: 500;
    margin-bottom: 28px;
    position: relative;
  }
  .ribbon::before, .ribbon::after {
    content: '★';
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    font-size: 10px;
  }
  .ribbon::before { left: 8px; }
  .ribbon::after { right: 8px; }

  h1.title {
    font-family: 'Ma Shan Zheng', 'Noto Serif SC', serif;
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 400;
    color: var(--crimson-deep);
    letter-spacing: 0.15em;
    line-height: 1.1;
    margin-bottom: 12px;
    text-shadow: 2px 2px 0 rgba(201, 169, 97, 0.2);
  }
  .title .accent { color: var(--gold-deep); }

  .subtitle {
    font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
    font-size: clamp(16px, 2vw, 22px);
    color: var(--ink-soft);
    letter-spacing: 0.4em;
    margin-bottom: 24px;
    font-weight: 400;
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 0 auto 32px;
    max-width: 400px;
  }
  .divider .line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .divider .star {
    color: var(--crimson);
    font-size: 14px;
  }

  .epitaph {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 17px;
    color: var(--muted);
    max-width: 640px;
    margin: 0 auto;
    letter-spacing: 0.15em;
    line-height: 2;
  }

  /* Stats strip */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin: 50px auto 0;
    max-width: 720px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.5);
  }
  .stat {
    padding: 24px 12px;
    text-align: center;
    border-right: 1px solid var(--line);
    position: relative;
  }
  .stat:last-child { border-right: none; }
  .stat .num {
    font-family: 'ZCOOL QingKe HuangYou', 'Noto Serif SC', serif;
    font-size: 36px;
    color: var(--crimson);
    font-weight: 400;
    line-height: 1;
    margin-bottom: 6px;
  }
  .stat .lbl {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.3em;
  }

  /* Tabs */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 0;
    margin: 60px auto 0;
    border-bottom: 2px solid var(--crimson);
    max-width: 600px;
  }
  .tab {
    flex: 1;
    padding: 16px 24px;
    text-align: center;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    font-family: inherit;
    letter-spacing: 0.3em;
    transition: all 0.3s ease;
    position: relative;
  }
  .tab:hover { color: var(--crimson-soft); }
  .tab.active {
    color: var(--crimson);
    border-bottom-color: var(--crimson);
    background: linear-gradient(180deg, transparent 0%, rgba(139, 26, 26, 0.04) 100%);
  }
  .tab .icon {
    display: inline-block;
    margin-right: 8px;
    font-size: 18px;
    vertical-align: middle;
  }

  /* Panels */
  .panel { display: none; padding: 50px 0; animation: fadeIn 0.5s ease; }
  .panel.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Section heading */
  .section-heading {
    text-align: center;
    margin-bottom: 40px;
  }
  .section-heading h2 {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 28px;
    color: var(--crimson);
    letter-spacing: 0.4em;
    font-weight: 400;
    margin-bottom: 8px;
  }
  .section-heading p {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.2em;
  }

  /* Search form */
  .search-card {
    background: white;
    border: 1px solid var(--line);
    padding: 40px;
    max-width: 880px;
    margin: 0 auto 50px;
    box-shadow: 0 4px 30px var(--shadow);
    position: relative;
  }
  .search-card::before, .search-card::after {
    content: '';
    position: absolute;
    width: 30px;
    height: 30px;
    border: 2px solid var(--gold);
  }
  .search-card::before {
    top: 12px; left: 12px;
    border-right: none; border-bottom: none;
  }
  .search-card::after {
    bottom: 12px; right: 12px;
    border-left: none; border-top: none;
  }

  .search-grid {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr 1.5fr auto;
    gap: 16px;
    align-items: end;
  }
  .field { display: flex; flex-direction: column; }
  .field label {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 8px;
    letter-spacing: 0.3em;
    font-weight: 500;
  }
  .field label::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 4px;
    background: var(--gold);
    margin-right: 6px;
    vertical-align: middle;
  }
  .field input, .field select, .field textarea {
    background: var(--ivory);
    border: 1px solid var(--line);
    padding: 12px 14px;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    transition: all 0.2s;
    border-radius: 0;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: var(--crimson);
    background: white;
    box-shadow: 0 0 0 3px rgba(139, 26, 26, 0.08);
  }
  .field textarea {
    resize: vertical;
    min-height: 80px;
    line-height: 1.6;
  }

  .btn {
    padding: 12px 28px;
    border: 1px solid var(--crimson);
    background: var(--crimson);
    color: var(--paper);
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 0.3em;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: 500;
    position: relative;
  }
  .btn:hover {
    background: var(--crimson-deep);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(139, 26, 26, 0.3);
  }
  .btn-outline {
    background: transparent;
    color: var(--crimson);
  }
  .btn-outline:hover {
    background: var(--crimson);
    color: var(--paper);
  }
  .btn-gold {
    background: var(--gold);
    border-color: var(--gold-deep);
    color: var(--ink);
  }
  .btn-gold:hover {
    background: var(--gold-bright);
    border-color: var(--gold);
  }
  .btn-sm { padding: 6px 14px; font-size: 12px; }

  /* Results */
  .results-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding: 0 4px;
  }
  .results-info .count {
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.1em;
  }
  .results-info .count b { color: var(--crimson); font-size: 18px; margin: 0 4px; }

  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
  }

  .martyr-card {
    background: white;
    border: 1px solid var(--line);
    padding: 28px 24px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .martyr-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--crimson), var(--gold), var(--crimson));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s;
  }
  .martyr-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px var(--shadow);
    border-color: var(--gold);
  }
  .martyr-card:hover::before { transform: scaleX(1); }

  .mc-head {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 16px;
  }
  .mc-avatar {
    width: 60px;
    height: 70px;
    background: linear-gradient(135deg, var(--ivory) 0%, var(--paper-dark) 100%);
    border: 1px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }
  .mc-avatar::before {
    content: '★';
    color: var(--crimson);
    font-size: 22px;
  }
  .mc-avatar .gender-mark {
    position: absolute;
    top: -6px; right: -6px;
    background: var(--crimson);
    color: white;
    font-size: 10px;
    padding: 2px 6px;
    letter-spacing: 0.1em;
  }
  .mc-name {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 24px;
    color: var(--crimson);
    font-weight: 400;
    margin-bottom: 4px;
    letter-spacing: 0.1em;
  }
  .mc-unit {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .mc-info {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 12px;
    font-size: 13px;
    color: var(--ink-soft);
    padding-top: 16px;
    border-top: 1px dashed var(--line);
  }
  .mc-info .k { color: var(--muted); letter-spacing: 0.15em; }
  .mc-info .v { color: var(--ink); }

  .mc-tag {
    display: inline-block;
    background: var(--ivory);
    color: var(--crimson);
    font-size: 11px;
    padding: 2px 8px;
    margin-top: 12px;
    margin-right: 6px;
    border: 1px solid var(--line);
  }

  /* Empty / no results */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty .icon {
    font-size: 64px;
    color: var(--gold);
    margin-bottom: 16px;
    display: block;
  }
  .empty .title { font-size: 18px; color: var(--ink-soft); margin-bottom: 8px; }
  .empty .desc { font-size: 14px; }

  /* Register form */
  .register-form {
    background: white;
    border: 1px solid var(--line);
    padding: 40px;
    max-width: 880px;
    margin: 0 auto;
    box-shadow: 0 4px 30px var(--shadow);
    position: relative;
  }
  .register-form::before, .register-form::after {
    content: '';
    position: absolute;
    width: 30px;
    height: 30px;
    border: 2px solid var(--gold);
  }
  .register-form::before {
    top: 12px; left: 12px;
    border-right: none; border-bottom: none;
  }
  .register-form::after {
    bottom: 12px; right: 12px;
    border-left: none; border-top: none;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .form-grid .field.full { grid-column: 1 / -1; }
  .form-actions {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(44, 24, 16, 0.6);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.3s;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--paper);
    max-width: 640px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    border: 1px solid var(--gold);
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    position: relative;
    animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-header {
    background: var(--crimson);
    color: var(--paper);
    padding: 30px 40px;
    text-align: center;
    position: relative;
  }
  .modal-header::after {
    content: '';
    position: absolute;
    bottom: -8px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid var(--crimson);
  }
  .modal-header h3 {
    font-family: 'Ma Shan Zheng', serif;
    font-size: 32px;
    font-weight: 400;
    letter-spacing: 0.2em;
    margin-bottom: 4px;
  }
  .modal-header p {
    font-size: 12px;
    letter-spacing: 0.4em;
    opacity: 0.85;
  }
  .modal-body { padding: 40px; }
  .modal-info {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 14px 20px;
    margin-bottom: 24px;
  }
  .modal-info .k {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.2em;
    padding-top: 2px;
  }
  .modal-info .v {
    color: var(--ink);
    font-size: 15px;
    border-bottom: 1px dotted var(--line);
    padding-bottom: 4px;
  }
  .story-box {
    background: var(--ivory);
    border-left: 3px solid var(--crimson);
    padding: 20px 24px;
    margin-top: 20px;
    font-family: 'ZCOOL XiaoWei', serif;
    line-height: 2;
    color: var(--ink-soft);
    font-size: 15px;
    letter-spacing: 0.05em;
  }
  .story-box::before {
    content: '烈士生平';
    display: block;
    font-size: 12px;
    color: var(--crimson);
    letter-spacing: 0.4em;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .modal-footer {
    padding: 0 40px 40px;
    text-align: center;
  }
  .modal-close {
    position: absolute;
    top: 12px; right: 16px;
    background: none;
    border: none;
    color: var(--paper);
    font-size: 28px;
    cursor: pointer;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .modal-close:hover { opacity: 1; }

  .tribute {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--crimson);
    font-size: 14px;
    letter-spacing: 0.2em;
    cursor: pointer;
    padding: 8px 20px;
    border: 1px solid var(--crimson);
    background: transparent;
    transition: all 0.3s;
    font-family: inherit;
  }
  .tribute:hover {
    background: var(--crimson);
    color: var(--paper);
  }
  .tribute .count {
    background: var(--gold);
    color: var(--ink);
    padding: 2px 8px;
    font-size: 12px;
    margin-left: 4px;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: var(--ink);
    color: var(--paper);
    padding: 14px 28px;
    z-index: 200;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    font-size: 14px;
    letter-spacing: 0.2em;
    border-left: 3px solid var(--gold);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-left-color: var(--gold); }
  .toast.error { border-left-color: var(--crimson); }

  /* Footer */
  footer {
    margin-top: 80px;
    padding: 40px 0;
    text-align: center;
    background: var(--ink);
    color: var(--paper-dark);
    position: relative;
  }
  footer::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  footer .quote {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 18px;
    letter-spacing: 0.3em;
    color: var(--gold);
    margin-bottom: 12px;
  }
  footer .copy {
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--muted);
  }

  /* Responsive */
  @media (max-width: 900px) {
    .container { padding: 0 20px; }
    .search-grid { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .results-grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr; }
    .stat { border-right: none; border-bottom: 1px solid var(--line); }
    .stat:last-child { border-bottom: none; }
    .modal-info { grid-template-columns: 1fr; gap: 4px 0; }
    .modal-info .k { margin-top: 12px; }
    .search-card, .register-form { padding: 28px 20px; }
  }

  /* Decorative candle animation */
  @keyframes flicker {
    0%, 100% { opacity: 1; transform: scaleY(1); }
    50% { opacity: 0.85; transform: scaleY(1.1); }
  }
  .flame { animation: flicker 1.5s ease-in-out infinite; }
</style>
</head>
<body>

<div class="top-border"></div>

<header class="hero">
  <div class="container">
    <div class="ribbon">人民英雄纪念</div>
    <h1 class="title">英<span class="accent">烈</span>永垂</h1>
    <h1 class="title">不<span class="accent">朽</span></h1>
    <div class="subtitle">— 浩 气 长 存 · 薪 火 相 传 —</div>
    <div class="divider">
      <span class="line"></span>
      <span class="star">★</span>
      <span class="line"></span>
    </div>
    <p class="epitaph">
      为有牺牲多壮志，敢教日月换新天。<br>
      铭记英雄事迹，传承先烈精神，让英名永耀史册。
    </p>

    <div class="stats">
      <div class="stat">
        <div class="num" id="statTotal">0</div>
        <div class="lbl">登 录 英 烈</div>
      </div>
      <div class="stat">
        <div class="num" id="statMales">0</div>
        <div class="lbl">男 烈 士</div>
      </div>
      <div class="stat">
        <div class="num" id="statFemales">0</div>
        <div class="lbl">女 烈 士</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="search">
        <span class="icon">❀</span>寻 找 英 烈
      </button>
      <button class="tab" data-tab="register">
        <span class="icon">✦</span>登 记 英 烈
      </button>
    </div>
  </div>
</header>

<main class="container">

  <!-- Search Panel -->
  <section class="panel active" id="panel-search">
    <div class="section-heading">
      <h2>烈 士 寻 亲</h2>
      <p>请输入姓名、性别、家庭住址以寻找对应烈士</p>
    </div>

    <div class="search-card">
      <form id="searchForm">
        <div class="search-grid">
          <div class="field">
            <label>姓 名</label>
            <input type="text" id="qName" placeholder="如：林卫国" autocomplete="off">
          </div>
          <div class="field">
            <label>性 别</label>
            <select id="qGender">
              <option value="">不限</option>
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </div>
          <div class="field">
            <label>家 庭 住 址</label>
            <input type="text" id="qAddress" placeholder="如：山东省济南市" autocomplete="off">
          </div>
          <div class="field">
            <button type="submit" class="btn">查 询</button>
          </div>
        </div>
      </form>
    </div>

    <div class="results-info">
      <div class="count" id="resultsCount">共 <b>0</b> 位英烈</div>
      <button class="btn btn-outline btn-sm" id="resetSearch">重 置</button>
    </div>

    <div class="results-grid" id="resultsGrid"></div>
  </section>

  <!-- Register Panel -->
  <section class="panel" id="panel-register">
    <div class="section-heading">
      <h2>英 烈 登 记</h2>
      <p>让我们一起铭记每一位为国捐躯的英雄</p>
    </div>

    <div class="register-form">
      <form id="registerForm">
        <div class="form-grid">
          <div class="field">
            <label>姓 名 <span style="color:var(--crimson)">*</span></label>
            <input type="text" name="name" required placeholder="烈士姓名">
          </div>
          <div class="field">
            <label>性 别 <span style="color:var(--crimson)">*</span></label>
            <select name="gender" required>
              <option value="">请选择</option>
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </div>
          <div class="field">
            <label>出 生 年 月</label>
            <input type="text" name="birth" placeholder="如：1925年3月">
          </div>
          <div class="field">
            <label>牺 牲 时 间</label>
            <input type="text" name="death" placeholder="如：1952年10月">
          </div>
          <div class="field full">
            <label>家 庭 住 址 <span style="color:var(--crimson)">*</span></label>
            <input type="text" name="address" required placeholder="详细家庭住址">
          </div>
          <div class="field full">
            <label>所 属 部 队 / 职 务</label>
            <input type="text" name="unit" placeholder="如：志愿军某部某连 班长">
          </div>
          <div class="field full">
            <label>牺 牲 地 点</label>
            <input type="text" name="place" placeholder="如：朝鲜上甘岭战役">
          </div>
          <div class="field full">
            <label>烈 士 生 平</label>
            <textarea name="story" placeholder="记录烈士的生平事迹、英雄故事..."></textarea>
          </div>
          <div class="field full">
            <label>荣 誉 称 号</label>
            <input type="text" name="honor" placeholder="如：一等功、特等功臣">
          </div>
        </div>
        <div class="form-actions">
          <button type="reset" class="btn btn-outline">清 空</button>
          <button type="submit" class="btn btn-gold">提 交 登 记</button>
        </div>
      </form>
    </div>
  </section>

</main>

<footer>
  <div class="container">
    <p class="quote">" 你们的名字无人知晓，你们的功绩永世长存 "</p>
    <p class="copy">英 烈 纪 念 网 · 二 〇 二 六 · 永 垂 不 朽</p>
  </div>
</footer>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <button class="modal-close" id="modalClose">×</button>
      <h3 id="mName">烈 士 姓 名</h3>
      <p id="mHonor">永 垂 不 朽</p>
    </div>
    <div class="modal-body">
      <div class="modal-info" id="mInfo"></div>
      <div class="story-box" id="mStory"></div>
    </div>
    <div class="modal-footer">
      <button class="tribute" id="tributeBtn">
        <span class="flame">🕯️</span>
        <span>献 花 致 敬</span>
        <span class="count" id="tributeCount">0</span>
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ============ Sample seed data (only loaded if storage is empty) ============
  const SEED = [
    {
      id: 'm001', name: '林卫国', gender: '男',
      birth: '1925年7月', death: '1952年10月',
      address: '山东省济南市历城区王舍人镇',
      unit: '中国人民志愿军第15军45师135团2营5连',
      place: '朝鲜上甘岭战役',
      honor: '特等功臣、一级战斗英雄',
      story: '林卫国，1925年生于山东济南一个贫农家庭。1947年参加中国人民解放军，先后参加了淮海战役、渡江战役。1951年随志愿军入朝作战，1952年10月在上甘岭战役中，为夺回主峰阵地，带领突击排连续爆破敌人17个地堡，最后在冲锋时身负重伤，仍坚持战斗，壮烈牺牲。战后被追记特等功，授予一级战斗英雄称号。'
    },
    {
      id: 'm002', name: '陈红梅', gender: '女',
      birth: '1928年3月', death: '1953年6月',
      address: '江苏省徐州市铜山区',
      unit: '志愿军某部卫生队 护士',
      place: '朝鲜金城前线',
      honor: '三等功',
      story: '陈红梅，徐州铜山人，1950年参加志愿军，担任前线卫生员。在金城战役中，她不顾个人安危，穿过敌人炮火封锁线，连续抢救伤员32名。在抢救最后一名重伤员时，被敌机炸弹弹片击中，光荣牺牲，年仅25岁。'
    },
    {
      id: 'm003', name: '张志远', gender: '男',
      birth: '1920年11月', death: '1948年11月',
      address: '河南省商丘市民权县',
      unit: '中原野战军第3纵队7旅19团',
      place: '淮海战役双堆集',
      honor: '一等功',
      story: '张志远，1920年生于河南民权。1944年参加新四军，作战勇敢，屡建奇功。1948年淮海战役中，他率领突击班攻入双堆集敌军核心阵地，在弹药耗尽的情况下，与敌肉搏，最后拉响手榴弹与敌人同归于尽，年仅28岁。'
    },
    {
      id: 'm004', name: '王秀英', gender: '女',
      birth: '1931年5月', death: '1952年7月',
      address: '辽宁省丹东市宽甸满族自治县',
      unit: '志愿军某部通讯连',
      place: '朝鲜',
      honor: '二等功',
      story: '王秀英，丹东宽甸人，1949年参军。1950年入朝后担任通讯兵，在一次紧急通讯任务中，为抢修被炸断的通讯线路，冒着敌机扫射的危险连续工作6小时，最终完成任务，自己却身负重伤，于1952年7月牺牲。'
    },
    {
      id: 'm005', name: '刘铁柱', gender: '男',
      birth: '1918年2月', death: '1945年8月',
      address: '河北省保定市易县',
      unit: '晋察冀军区某部',
      place: '河北易县狼牙山',
      honor: '狼牙山五壮士之一',
      story: '刘铁柱，1918年生于河北易县，1938年参加八路军。1945年8月在反扫荡战斗中，为掩护主力部队和群众转移，主动请缨坚守狼牙山主峰阵地，子弹打光后，纵身跳下悬崖，英勇牺牲。其英雄事迹被改编为《狼牙山五壮士》，广为传颂。'
    },
    {
      id: 'm006', name: '赵凤兰', gender: '女',
      birth: '1923年9月', death: '1950年3月',
      address: '四川省绵阳市三台县',
      unit: '西南军区某部',
      place: '四川西昌',
      honor: '革命烈士',
      story: '赵凤兰，1923年生于四川三台，1947年参加革命工作，担任游击队联络员。1950年在西昌剿匪战斗中，为保护群众和战友，挺身而出吸引敌人注意，最后被土匪包围，慷慨就义。'
    },
    {
      id: 'm007', name: '孙明刚', gender: '男',
      birth: '1926年4月', death: '1951年9月',
      address: '安徽省宿州市萧县',
      unit: '志愿军第9兵团27军',
      place: '朝鲜长津湖战役',
      honor: '一等功臣',
      story: '孙明刚，1926年生于安徽萧县，1945年参军。1950年随志愿军第9兵团入朝，参加长津湖战役。在零下40度的极寒中，坚守阵地三天三夜，最后因严寒和伤势牺牲，全连仅幸存3人。'
    },
    {
      id: 'm008', name: '周桂花', gender: '女',
      birth: '1929年12月', death: '1952年4月',
      address: '湖南省湘潭市湘潭县',
      unit: '志愿军某部文工团',
      place: '朝鲜战场',
      honor: '二等功',
      story: '周桂花，1929年生于湖南湘潭一个革命家庭，1950年参军并赴朝。在前线担任文工团员，冒着炮火到阵地演出鼓舞士气。1952年4月在一次慰问演出途中遭遇敌机轰炸，为掩护战友壮烈牺牲。'
    }
  ];

  // ============ Storage ============
  const STORAGE_KEY = 'martyrs_db_v1';
  const TRIBUTE_KEY = 'martyrs_tributes_v1';

  function loadMartyrs() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED));
    return SEED.slice();
  }
  function saveMartyrs(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }
  function loadTributes() {
    try {
      const raw = localStorage.getItem(TRIBUTE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {};
  }
  function saveTributes(t) {
    localStorage.setItem(TRIBUTE_KEY, JSON.stringify(t));
  }

  let martyrs = loadMartyrs();
  let tributes = loadTributes();

  // ============ Helpers ============
  function $(s, c) { return (c || document).querySelector(s); }
  function $$(s, c) { return Array.from((c || document).querySelectorAll(s)); }

  function toast(msg, type) {
    const el = $('#toast');
    el.textContent = msg;
    el.className = 'toast show ' + (type || 'success');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { el.classList.remove('show'); }, 2400);
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function highlight(text, q) {
    if (!q) return escapeHtml(text);
    const safe = escapeHtml(text);
    const safeQ = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return safe.replace(new RegExp(safeQ, 'gi'), m => `<mark style="background:var(--gold);color:var(--ink);padding:0 2px">${m}</mark>`);
  }

  // ============ Search ============
  function performSearch() {
    const name = $('#qName').value.trim();
    const gender = $('#qGender').value;
    const address = $('#qAddress').value.trim();

    const results = martyrs.filter(m => {
      if (name && !m.name.includes(name)) return false;
      if (gender && m.gender !== gender) return false;
      if (address && !m.address.includes(address)) return false;
      return true;
    });

    renderResults(results, { name, gender, address });
  }

  function renderResults(list, q) {
    const grid = $('#resultsGrid');
    $('#resultsCount').innerHTML = `共 <b>${list.length}</b> 位英烈`;

    if (list.length === 0) {
      grid.innerHTML = `
        <div class="empty" style="grid-column:1/-1">
          <span class="icon">🕊️</span>
          <div class="title">未找到匹配的英烈记录</div>
          <div class="desc">请调整查询条件，或前往"登记英烈"补充信息</div>
        </div>`;
      return;
    }

    grid.innerHTML = list.map(m => {
      const tribute = tributes[m.id] || 0;
      return `
        <article class="martyr-card" data-id="${m.id}">
          <div class="mc-head">
            <div class="mc-avatar">
              <span class="gender-mark">${escapeHtml(m.gender)}</span>
            </div>
            <div>
              <div class="mc-name">${highlight(m.name, q.name)}</div>
              <div class="mc-unit">${escapeHtml(m.unit || '人民英雄')}</div>
            </div>
          </div>
          <div class="mc-info">
            <span class="k">生 卒</span><span class="v">${escapeHtml(m.birth || '—')} → ${escapeHtml(m.death || '—')}</span>
            <span class="k">籍 贯</span><span class="v">${highlight(m.address, q.address)}</span>
            <span class="k">牺 牲 地</span><span class="v">${escapeHtml(m.place || '—')}</span>
            <span class="k">荣 誉</span><span class="v">${escapeHtml(m.honor || '革命烈士')}</span>
          </div>
          <div>
            <span class="mc-tag">🕯️ 致敬 ${tribute}</span>
            <span class="mc-tag">查看详情 →</span>
          </div>
        </article>`;
    }).join('');

    $$('.martyr-card', grid).forEach(card => {
      card.addEventListener('click', () => openDetail(card.dataset.id));
    });
  }

  // ============ Detail Modal ============
  function openDetail(id) {
    const m = martyrs.find(x => x.id === id);
    if (!m) return;
    $('#mName').textContent = m.name;
    $('#mHonor').textContent = m.honor || '永 垂 不 朽';
    $('#mInfo').innerHTML = `
      <span class="k">性 别</span><span class="v">${escapeHtml(m.gender)}</span>
      <span class="k">生 卒</span><span class="v">${escapeHtml(m.birth || '—')} — ${escapeHtml(m.death || '—')}</span>
      <span class="k">家 庭 住 址</span><span class="v">${escapeHtml(m.address)}</span>
      <span class="k">所 属 部 队</span><span class="v">${escapeHtml(m.unit || '—')}</span>
      <span class="k">牺 牲 地 点</span><span class="v">${escapeHtml(m.place || '—')}</span>
      <span class="k">荣 誉 称 号</span><span class="v">${escapeHtml(m.honor || '革命烈士')}</span>
    `;
    $('#mStory').innerHTML = escapeHtml(m.story || '（生平信息待补充）');
    $('#tributeCount').textContent = tributes[m.id] || 0;
    $('#tributeBtn').dataset.id = m.id;
    $('#modal').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeDetail() {
    $('#modal').classList.remove('show');
    document.body.style.overflow = '';
  }

  $('#modalClose').addEventListener('click', closeDetail);
  $('#modal').addEventListener('click', e => {
    if (e.target.id === 'modal') closeDetail();
  });

  $('#tributeBtn').addEventListener('click', e => {
    const id = e.currentTarget.dataset.id;
    tributes[id] = (tributes[id] || 0) + 1;
    saveTributes(tributes);
    $('#tributeCount').textContent = tributes[id];
    toast('已为英烈献上鲜花，致以崇高敬意', 'success');
  });

  // ============ Register ============
  $('#registerForm').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());
    if (!data.name || !data.gender || !data.address) {
      toast('请填写姓名、性别、家庭住址', 'error');
      return;
    }
    const entry = {
      id: 'm' + Date.now(),
      name: data.name.trim(),
      gender: data.gender,
      birth: data.birth.trim(),
      death: data.death.trim(),
      address: data.address.trim(),
      unit: data.unit.trim(),
      place: data.place.trim(),
      honor: data.honor.trim() || '革命烈士',
      story: data.story.trim()
    };
    martyrs.unshift(entry);
    saveMartyrs(martyrs);
    updateStats();
    toast('英烈信息登记成功，永垂不朽', 'success');
    e.target.reset();
    // switch to search
    setTimeout(() => switchTab('search'), 600);
  });

  // ============ Tabs ============
  function switchTab(name) {
    $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    $$('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
    if (name === 'search') performSearch();
  }
  $$('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

  // ============ Search form ============
  $('#searchForm').addEventListener('submit', e => {
    e.preventDefault();
    performSearch();
  });
  // live search
  ['qName', 'qGender', 'qAddress'].forEach(id => {
    $('#' + id).addEventListener('input', performSearch);
    $('#' + id).addEventListener('change', performSearch);
  });
  $('#resetSearch').addEventListener('click', () => {
    $('#searchForm').reset();
    performSearch();
  });

  // ============ Stats ============
  function updateStats() {
    const total = martyrs.length;
    const males = martyrs.filter(m => m.gender === '男').length;
    const females = martyrs.filter(m => m.gender === '女').length;
    animateNum('#statTotal', total);
    animateNum('#statMales', males);
    animateNum('#statFemales', females);
  }

  function animateNum(sel, target) {
    const el = $(sel);
    const start = parseInt(el.textContent) || 0;
    const dur = 700;
    const t0 = performance.now();
    function tick(t) {
      const p = Math.min(1, (t - t0) / dur);
      const v = Math.round(start + (target - start) * (1 - Math.pow(1 - p, 3)));
      el.textContent = v;
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // ============ Init ============
  updateStats();
  performSearch();

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDetail();
  });
</script>

</body>
</html>
