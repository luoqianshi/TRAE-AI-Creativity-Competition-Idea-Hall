        function initCursorEffect() {
            const cursor = document.getElementById('cursorEffect');
            document.addEventListener('mousemove', (e) => {
                cursor.style.left = `${e.clientX - 12}px`;
                cursor.style.top = `${e.clientY - 12}px`;
                createTrail(e.clientX, e.clientY);
            });

            document.addEventListener('mouseenter', () => {
                cursor.style.opacity = '1';
            });

            document.addEventListener('mouseleave', () => {
                cursor.style.opacity = '0';
            });
        }

        function createTrail(x, y) {
            const trail = document.createElement('div');
            trail.className = 'cursor-trail';
            trail.style.left = `${x - 5}px`;
            trail.style.top = `${y - 5}px`;
            document.body.appendChild(trail);
            setTimeout(() => trail.remove(), 600);
        }

        function switchCity(city) {
            currentCity = city;
            document.querySelectorAll('.city-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelector(`.city-tab[data-city="${city}"]`).classList.add('active');
            
            const title = city === 'moscow' ? '莫斯科景点' : '圣彼得堡景点';
            const count = attractions[city].length;
            document.getElementById('attractionsTitle').textContent = title;
            document.getElementById('attractionCount').textContent = `共 ${count} 个景点`;
            
            renderAttractions();
            renderRecommended();
        }

        function handleSearch() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            renderAttractions(searchTerm);
        }

        function filterByTag(tag) {
            document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
            document.querySelector(`.filter-tag[data-tag="${tag}"]`).classList.add('active');
            renderAttractions(null, tag);
        }

        function renderAttractions(searchTerm = null, filterTag = 'all') {
            const grid = document.getElementById('attractionsGrid');
            grid.innerHTML = '';
            
            let filtered = attractions[currentCity];
            
            if (searchTerm) {
                filtered = filtered.filter(a => 
                    a.name.toLowerCase().includes(searchTerm) || 
                    a.description.toLowerCase().includes(searchTerm)
                );
            }
            
            if (filterTag !== 'all') {
                filtered = filtered.filter(a => a.tags.includes(filterTag));
            }
            
            filtered.forEach(attraction => {
                const card = document.createElement('div');
                card.className = `attraction-card ${isInItinerary(attraction.id) ? 'selected' : ''}`;
                card.onclick = () => showAttractionModal(attraction);
                
                const isFavorite = favorites.includes(attraction.id);
                
                const imageHtml = attraction.image ?
                    `<img src="${attraction.image}" alt="${attraction.name}" style="width:100%;height:100px;object-fit:cover;border-radius:8px;margin-bottom:10px;">` :
                    `<div style="width:100%;height:100px;border-radius:8px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;border:2px dashed #ddd;color:#888;font-size:0.8rem;">
                        <span>${attraction.name}</span>
                    </div>`;
                
                card.innerHTML = `
                    ${imageHtml}
                    <div class="card-header">
                        <h3>${attraction.name}</h3>
                        <button class="favorite-btn ${isFavorite ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorite('${attraction.id}')">❤</button>
                    </div>
                    <div class="tags">
                        ${attraction.tags.map(t => `<span class="tag">${getTagLabel(t)}</span>`).join('')}
                    </div>
                    <button class="add-btn ${isInItinerary(attraction.id) ? 'added' : ''}" onclick="event.stopPropagation(); toggleAttraction('${attraction.id}')">
                        ${isInItinerary(attraction.id) ? '已添加' : '+ 添加'}
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function getTagLabel(tag) {
            const labels = {
                history: '历史', museum: '博物馆', nature: '自然', street: '街区',
                shopping: '购物', sight: '景点', art: '艺术', park: '公园',
                family: '亲子', education: '教育', religion: '宗教', science: '科学', culture: '文化'
            };
            return labels[tag] || tag;
        }

        function isInItinerary(attractionId) {
            return itinerary.some(day => day.attractions.includes(attractionId));
        }

        function toggleAttraction(attractionId) {
            if (isInItinerary(attractionId)) {
                removeAttractionFromAllDays(attractionId);
            } else {
                addToItinerary(attractionId);
            }
        }

        function showAttractionModal(attraction) {
            currentModalAttraction = attraction;
            document.getElementById('modalTitle').textContent = attraction.name;
            document.getElementById('modalDescription').textContent = attraction.description;
            document.getElementById('modalVisitTime').textContent = attraction.visitTime;
            document.getElementById('modalOpeningHours').textContent = attraction.openingHours;
            document.getElementById('modalTicketPrice').textContent = attraction.ticketPrice;
            document.getElementById('modalPurchaseMethod').textContent = attraction.purchaseMethod;
            
            const tagsContainer = document.getElementById('modalTags');
            tagsContainer.innerHTML = attraction.tags.map(t => `<span class="modal-tag">${getTagLabel(t)}</span>`).join('');
            
            const isFavorite = favorites.includes(attraction.id);
            document.getElementById('modalFavoriteBtn').classList.toggle('active', isFavorite);
            document.getElementById('modalFavoriteText').textContent = isFavorite ? '已收藏' : '收藏';
            
            // 更新模态框图片
            const modalImage = document.getElementById('modalImage');
            if (attraction.image) {
                modalImage.innerHTML = `<img src="${attraction.image}" alt="${attraction.name}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML='<span>点击上传景点图片</span><input type=file accept=image/* onchange=handleImageUpload(this)>'">`;
                modalImage.classList.add('has-image');
            } else {
                modalImage.innerHTML = '<span>点击上传景点图片</span><input type="file" accept="image/*" onchange="handleImageUpload(this)">';
                modalImage.classList.remove('has-image');
            }
            
            document.getElementById('modalOverlay').classList.add('show');
        }

        function closeModal(e) {
            if (!e || e.target === document.getElementById('modalOverlay')) {
                document.getElementById('modalOverlay').classList.remove('show');
                currentModalAttraction = null;
            }
        }

        function toggleFavorite(attractionId) {
            const index = favorites.indexOf(attractionId);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(attractionId);
            }
            saveFavorites();
            renderAttractions();
        }

        function toggleFavoriteFromModal() {
            if (currentModalAttraction) {
                toggleFavorite(currentModalAttraction.id);
                const isFavorite = favorites.includes(currentModalAttraction.id);
                document.getElementById('modalFavoriteBtn').classList.toggle('active', isFavorite);
                document.getElementById('modalFavoriteText').textContent = isFavorite ? '已收藏' : '收藏';
            }
        }

        function addToItinerary(attractionId) {
            if (itinerary.length === 0) {
                addDay();
            }
            const lastDay = itinerary[itinerary.length - 1];
            if (!lastDay.attractions.includes(attractionId)) {
                lastDay.attractions.push(attractionId);
                saveItinerary();
                renderAttractions();
                renderDays();
                updateStats();
                showToast(`已添加 "${getAttractionName(attractionId)}"`);
            }
        }

        function addToItineraryFromModal() {
            if (currentModalAttraction) {
                addToItinerary(currentModalAttraction.id);
                closeModal();
            }
        }

        function removeAttractionFromAllDays(attractionId) {
            itinerary.forEach(day => {
                const index = day.attractions.indexOf(attractionId);
                if (index > -1) {
                    day.attractions.splice(index, 1);
                }
            });
            itinerary = itinerary.filter(day => day.attractions.length > 0);
            saveItinerary();
            renderAttractions();
            renderDays();
            updateStats();
        }

        function removeAttractionFromDay(dayId, attractionId) {
            // 统一转换为字符串进行比较
            const targetDayId = String(dayId);
            const day = itinerary.find(d => String(d.id) === targetDayId);
            if (day) {
                day.attractions = day.attractions.filter(id => id !== attractionId);
                if (day.attractions.length === 0) {
                    deleteDay(dayId);
                } else {
                    saveItinerary();
                    renderDays();
                    renderAttractions();
                    updateStats();
                }
            }
        }

        function addDay() {
            const dayId = String(Date.now()); // 使用字符串ID
            const dayNumber = itinerary.length + 1;
            itinerary.push({ id: dayId, number: dayNumber, attractions: [] });
            saveItinerary();
            renderDays();
            updateStats();
        }

        function deleteDay(dayId) {
            const dayNum = getDayNumber(dayId);
            // 使用确认弹窗
            showConfirm('确定要删除第 ' + dayNum + ' 天吗？', () => {
                const targetDayId = String(dayId);
                itinerary = itinerary.filter(d => String(d.id) !== targetDayId);
                itinerary.forEach((d, i) => { d.number = i + 1; });
                saveItinerary();
                renderDays();
                renderAttractions();
                updateStats();
                showToast('已删除当天行程');
            });
        }
        
        function getDayNumber(dayId) {
            const day = itinerary.find(d => String(d.id) === String(dayId));
            return day ? day.number : '';
        }

        // 显示确认弹窗
        let confirmCallback = null;
        function showConfirm(message, callback) {
            document.getElementById('confirmMessage').textContent = message;
            confirmCallback = callback;
            document.getElementById('confirmOverlay').style.display = 'flex';
        }
        
        function closeConfirm() {
            document.getElementById('confirmOverlay').style.display = 'none';
            confirmCallback = null;
        }
        
        function confirmAction() {
            if (confirmCallback) {
                confirmCallback();
            }
            closeConfirm();
        }

        function renderDays() {
            const container = document.getElementById('daysContainer');
            container.innerHTML = '';
            
            if (itinerary.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                        </svg>
                        <p>还没有添加行程</p>
                        <p style="font-size: 0.8rem; margin-top: 5px;">点击景点卡片或添加按钮开始规划</p>
                    </div>
                `;
                return;
            }
            
            itinerary.forEach((day, index) => {
                const card = document.createElement('div');
                card.className = 'day-card';
                card.draggable = true;
                card.dataset.dayId = day.id;
                
                card.ondragstart = (e) => {
                    draggedItem = card;
                    draggedDayId = day.id;
                    card.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                };
                
                card.ondragover = (e) => {
                    e.preventDefault();
                    card.classList.add('drag-over');
                };
                
                card.ondragleave = () => {
                    card.classList.remove('drag-over');
                };
                
                card.ondrop = () => {
                    card.classList.remove('drag-over');
                    if (String(draggedDayId) !== String(day.id)) {
                        const draggedIndex = itinerary.findIndex(d => String(d.id) === String(draggedDayId));
                        const dropIndex = itinerary.findIndex(d => String(d.id) === String(day.id));
                        const [removed] = itinerary.splice(draggedIndex, 1);
                        itinerary.splice(dropIndex, 0, removed);
                        itinerary.forEach((d, i) => { d.number = i + 1; });
                        saveItinerary();
                        renderDays();
                    }
                };
                
                card.ondragend = () => {
                    card.classList.remove('dragging');
                    draggedItem = null;
                };
                
                let attractionsHtml = '';
                day.attractions.forEach((attractionId, idx) => {
                    const attraction = getAttraction(attractionId);
                    if (attraction) {
                        attractionsHtml += `
                            <div class="attraction-item" draggable="true" data-attraction-id="${attractionId}" data-day-id="${day.id}">
                                <span class="order-badge">${idx + 1}</span>
                                <span class="name">${attraction.name}</span>
                                <div class="item-actions">
                                    <button class="remove-btn" onclick="removeAttractionFromDay('${day.id}', '${attractionId}')">×</button>
                                </div>
                            </div>
                            ${idx < day.attractions.length - 1 ? getCommuteHtml(attractionId, day.attractions[idx + 1]) : ''}
                        `;
                    }
                });
                
                card.innerHTML = `
                    <div class="day-header">
                        <h3>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>

                            </svg>
                            第 ${day.number} 天
                        </h3>
                        <div class="day-actions">
                            <button class="move-btn" onclick="moveDay('${day.id}', ${index > 0 ? -1 : 0})">↑</button>

                    <div class="attractions-list">${attractionsHtml || '<p style="color: #999; font-size: 0.85rem;">暂无景点，点击左侧景点添加</p>'}</div>
                `;
                container.appendChild(card);
            });
        }

        function moveDay(dayId, direction) {
            const targetDayId = String(dayId);
            const index = itinerary.findIndex(d => String(d.id) === targetDayId);
            if ((direction === -1 && index > 0) || (direction === 1 && index < itinerary.length - 1)) {
                const temp = itinerary[index];
                itinerary[index] = itinerary[index + direction];
                itinerary[index + direction] = temp;
                itinerary.forEach((d, i) => { d.number = i + 1; });
                saveItinerary();
                renderDays();
            }
        }

        function getAttraction(attractionId) {
            for (const city of Object.values(attractions)) {
                const found = city.find(a => a.id === attractionId);
                if (found) return found;
            }
            return null;
        }

        function getAttractionName(attractionId) {
            const attraction = getAttraction(attractionId);
            return attraction ? attraction.name : attractionId;
        }

        function updateStats() {
            const totalDays = itinerary.length;
            const totalAttractions = itinerary.reduce((sum, day) => sum + day.attractions.length, 0);
            
            let totalHours = 0;
            itinerary.forEach(day => {
                day.attractions.forEach(id => {
                    const attraction = getAttraction(id);
                    if (attraction) {
                        const match = attraction.visitTime.match(/(\d+)-(\d+)小时/);
                        if (match) {
                            totalHours += (parseInt(match[1]) + parseInt(match[2])) / 2;
                        } else {
                            const single = attraction.visitTime.match(/(\d+)小时/);
                            if (single) totalHours += parseInt(single[1]);
                            const minutes = attraction.visitTime.match(/(\d+)分钟/);
                            if (minutes) totalHours += parseInt(minutes[1]) / 60;
                        }
                    }
                });
            });
            
            let totalCost = 0;
            itinerary.forEach(day => {
                day.attractions.forEach(id => {
                    const attraction = getAttraction(id);
                    if (attraction && attraction.ticketPrice !== '免费') {
                        const prices = attraction.ticketPrice.match(/(\d+)卢布/g);
                        if (prices) {
                            prices.forEach(p => {
                                totalCost += parseInt(p);
                            });
                        }
                    }
                });
            });
            
            document.getElementById('totalDays').textContent = totalDays;
            document.getElementById('totalAttractions').textContent = totalAttractions;
            document.getElementById('totalTime').textContent = `${Math.round(totalHours)}h`;
            document.getElementById('totalCost').textContent = `₽${totalCost}`;
        }

            html += `<div style="background:white;border-radius:10px;padding:15px;text-align:center;"><div style="font-size:2rem;font-weight:bold;color:#0039A6;">${itinerary.length}</div><div style="color:#666;font-size:0.9rem;">总天数</div></div>`;
            const totalAttractions = itinerary.reduce((sum, d) => sum + d.attractions.length, 0);
            html += `<div style="background:white;border-radius:10px;padding:15px;text-align:center;"><div style="font-size:2rem;font-weight:bold;color:#D52B1E;">${totalAttractions}</div><div style="color:#666;font-size:0.9rem;">总景点</div></div>`;
            let totalHours = 0;
            itinerary.forEach(day => {
                day.attractions.forEach(attrId => {
                    const attr = getAttraction(attrId);
                    if (attr) {
                        const hours = parseFloat(attr.visitTime) || 2;
                        totalHours += hours;
                    }
                });
            });
            html += `<div style="background:white;border-radius:10px;padding:15px;text-align:center;"><div style="font-size:2rem;font-weight:bold;color:#2ECC71;">${totalHours}h</div><div style="color:#666;font-size:0.9rem;">预估时长</div></div>`;
            let totalCost = 0;
            itinerary.forEach(day => {
                day.attractions.forEach(attrId => {
                    const attr = getAttraction(attrId);
                    if (attr && attr.ticketPrice) {
                        const match = attr.ticketPrice.match(/\d+/);
                        if (match) totalCost += parseInt(match[0]);
                    }
                });
            });
            html += `<div style="background:white;border-radius:10px;padding:15px;text-align:center;"><div style="font-size:2rem;font-weight:bold;color:#F39C12;">₽${totalCost}</div><div style="color:#666;font-size:0.9rem;">预估费用</div></div>`;
            html += '</div></div>';

            itinerary.forEach(day => {
                const cityAttractions = { moscow: [], stpetersburg: [] };
                const cityAttrIds = { moscow: [], stpetersburg: [] };
                day.attractions.forEach(attrId => {
                    const attr = getAttraction(attrId);
                    if (attr) {
                        const city = attr.id.startsWith('sp-') ? 'stpetersburg' : 'moscow';
                        cityAttractions[city].push(attr);
                        cityAttrIds[city].push(attrId);
                    }
                });

                html += `<div style="background:white;border-radius:15px;padding:25px;margin-bottom:20px;border-left:5px solid #0039A6;box-shadow:0 4px 15px rgba(0,0,0,0.08);">`;
                html += `<h3 style="color:#0039A6;margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid #eee;">📅 第 ${day.number} 天</h3>`;

                if (cityAttractions.moscow.length > 0) {
                    html += '<div style="margin-bottom:20px;"><h4 style="color:#0039A6;margin-bottom:10px;">🏛️ 莫斯科</h4>';
                    cityAttractions.moscow.forEach((attr, idx) => {
                        html += `<div style="display:flex;gap:15px;padding:15px;background:#f8f9fa;border-radius:10px;margin-bottom:10px;align-items:flex-start;">`;
                        if (attr.image) {
                            html += `<img src="${attr.image}" style="width:80px;height:60px;object-fit:cover;border-radius:8px;flex-shrink:0;">`;
                        }
                        html += `<div style="flex:1;">`;
                        html += `<div style="font-weight:bold;color:#333;margin-bottom:5px;">${idx + 1}. ${attr.name}</div>`;
                        html += `<div style="font-size:0.85rem;color:#666;">⏰ ${attr.visitTime} | 💰 ${attr.ticketPrice}</div>`;
                        html += `<div style="font-size:0.8rem;color:#888;margin-top:3px;">📍 ${attr.openingHours}</div>`;
                        html += '</div></div>';
                        
                        if (idx < cityAttractions.moscow.length - 1) {
                            html += getCommuteHtml(cityAttrIds.moscow[idx], cityAttrIds.moscow[idx + 1]);
                        }
                    });
                    html += '</div>';
                }

                if (cityAttractions.stpetersburg.length > 0) {
                    html += '<div><h4 style="color:#D52B1E;margin-bottom:10px;">🏛️ 圣彼得堡</h4>';
                    cityAttractions.stpetersburg.forEach((attr, idx) => {
                        html += `<div style="display:flex;gap:15px;padding:15px;background:#f8f9fa;border-radius:10px;margin-bottom:10px;align-items:flex-start;">`;
                        if (attr.image) {
                            html += `<img src="${attr.image}" style="width:80px;height:60px;object-fit:cover;border-radius:8px;flex-shrink:0;">`;
                        }
                        html += `<div style="flex:1;">`;
                        html += `<div style="font-weight:bold;color:#333;margin-bottom:5px;">${idx + 1}. ${attr.name}</div>`;
                        html += `<div style="font-size:0.85rem;color:#666;">⏰ ${attr.visitTime} | 💰 ${attr.ticketPrice}</div>`;
                        html += `<div style="font-size:0.8rem;color:#888;margin-top:3px;">📍 ${attr.openingHours}</div>`;
                        html += '</div></div>';
                        
                        if (idx < cityAttractions.stpetersburg.length - 1) {
                            html += getCommuteHtml(cityAttrIds.stpetersburg[idx], cityAttrIds.stpetersburg[idx + 1]);
                        }
                    });
                    html += '</div>';
                }

                html += '</div>';
            });

            content.innerHTML = html;
            console.log('Content generated, length:', html.length);
            
            // 隐藏主内容区域
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('mainFooter').style.display = 'none';
            // 显示完整行程区域
            document.getElementById('fullItinerarySection').style.display = 'block';
            window.scrollTo(0, 0);
            
            showToast('完整行程已生成');
        }

        // 返回编辑
        function backToEdit() {
            // 隐藏完整行程区域
            document.getElementById('fullItinerarySection').style.display = 'none';
            // 显示主内容区域
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('mainFooter').style.display = 'block';
            window.scrollTo(0, 0);
        }

        // 导出完整行程
        function exportFullItinerary(format) {
            if (itinerary.length === 0) {
                showToast('请先生成完整行程');
                return;
            }

            // 先生成完整行程内容
            generateFullItinerary();

            if (format === 'markdown') {
                exportFullItineraryMarkdown();
            } else if (format === 'word') {
                exportFullItineraryWord();
            } else if (format === 'excel') {
                exportFullItineraryExcel();
            } else if (format === 'jpg') {
                exportFullItineraryJPG();
            }
        }

        // 导出为Markdown
        function exportFullItineraryMarkdown() {
            let md = '# 🗺️ 俄罗斯莫斯科圣彼得堡行程规划\n\n';
            md += '---\n\n';

            const totalAttractions = itinerary.reduce((sum, d) => sum + d.attractions.length, 0);
            md += '## 📊 行程统计\n\n';
            md += `| 总天数 | 总景点 | 预估时长 | 预估费用 |\n`;
            md += `|--------|--------|----------|----------|\n`;

            let totalHours = 0, totalCost = 0;
            itinerary.forEach(day => {
                day.attractions.forEach(attrId => {
                    const attr = getAttraction(attrId);
                    if (attr) {
                        totalHours += parseFloat(attr.visitTime) || 2;
                        const match = attr.ticketPrice.match(/\d+/);
                        if (match) totalCost += parseInt(match[0]);
                    }
                });
            });
            md += `| ${itinerary.length}天 | ${totalAttractions}个 | ${totalHours}h | ₽${totalCost} |\n\n`;

            itinerary.forEach(day => {
                md += `## 📅 第 ${day.number} 天\n\n`;

                const cityAttractions = { moscow: [], stpetersburg: [] };
                day.attractions.forEach(attrId => {
                    const attr = getAttraction(attrId);
                    if (attr) {
                        const city = attr.id.startsWith('sp-') ? 'stpetersburg' : 'moscow';
                        cityAttractions[city].push(attr);
                    }
                });

                if (cityAttractions.moscow.length > 0) {
                    md += '### 🏛️ 莫斯科\n\n';
                    md += '| 序号 | 景点名称 | 游玩时间 | 门票价格 | 开放时间 |\n';
                    md += '|------|----------|----------|----------|----------|\n';
                    cityAttractions.moscow.forEach((attr, idx) => {
                        md += `| ${idx + 1} | ${attr.name} | ${attr.visitTime} | ${attr.ticketPrice} | ${attr.openingHours} |\n`;
                    });
                    md += '\n';
                }

                if (cityAttractions.stpetersburg.length > 0) {
                    md += '### 🏛️ 圣彼得堡\n\n';
                    md += '| 序号 | 景点名称 | 游玩时间 | 门票价格 | 开放时间 |\n';
                    md += '|------|----------|----------|----------|----------|\n';
                    cityAttractions.stpetersburg.forEach((attr, idx) => {
                        md += `| ${idx + 1} | ${attr.name} | ${attr.visitTime} | ${attr.ticketPrice} | ${attr.openingHours} |\n`;
                    });
                    md += '\n';
                }
            });

            md += '---\n\n*由俄罗斯行程规划程序生成*\n';

            const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '俄罗斯行程规划.md';
            a.click();
            URL.revokeObjectURL(url);
            showToast('Markdown文件已导出');
        }

        // 导出为Word
        function exportFullItineraryWord() {
            let html = '<html><head><meta charset="utf-8"><title>俄罗斯行程规划</title>';
            html += '<style>body{font-family:Microsoft YaHei,sans-serif;padding:30px;}';
            html += 'h1{color:#0039A6;text-align:center;}';
            html += 'h2{color:#0039A6;border-bottom:2px solid #0039A6;padding-bottom:10px;}';
            html += 'h3{color:#D52B1E;}';
            html += 'table{width:100%;border-collapse:collapse;margin:15px 0;}';
            html += 'th,td{border:1px solid #ddd;padding:10px;text-align:left;}';
            html += 'th{background:#0039A6;color:white;}';
            html += 'tr:nth-child(even){background:#f8f9fa;}';
            html += '.stats{background:#f0f5ff;padding:20px;border-radius:10px;margin:20px 0;}';
            html += '.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:15px 0;}';
            html += '.stat-item{background:white;padding:15px;border-radius:8px;text-align:center;}';
            html += '.stat-value{font-size:1.8rem;font-weight:bold;color:#0039A6;}';
            html += '</style></head><body>';

            html += '<h1>🇷🇺 俄罗斯莫斯科圣彼得堡行程规划</h1>';

            const totalAttractions = itinerary.reduce((sum, d) => sum + d.attractions.length, 0);
            let totalHours = 0, totalCost = 0;
            itinerary.forEach(day => {
                day.attractions.forEach(attrId => {
                    const attr = getAttraction(attrId);
                    if (attr) {
                        totalHours += parseFloat(attr.visitTime) || 2;
                        const match = attr.ticketPrice.match(/\d+/);
                        if (match) totalCost += parseInt(match[0]);
                    }
                });
            });

            html += '<div class="stats"><h2>📊 行程统计</h2><div class="stat-grid">';
            html += `<div class="stat-item"><div class="stat-value">${itinerary.length}</div><div>总天数</div></div>`;
            html += `<div class="stat-item"><div class="stat-value">${totalAttractions}</div><div>总景点</div></div>`;
            html += `<div class="stat-item"><div class="stat-value">${totalHours}h</div><div>预估时长</div></div>`;
            html += `<div class="stat-item"><div class="stat-value">₽${totalCost}</div><div>预估费用</div></div>`;
            html += '</div></div>';

            itinerary.forEach(day => {
                html += `<h2>📅 第 ${day.number} 天</h2>`;
                html += '<table><tr><th>序号</th><th>景点名称</th><th>游玩时间</th><th>门票价格</th><th>开放时间</th></tr>';

                day.attractions.forEach((attrId, idx) => {
                    const attr = getAttraction(attrId);
                    if (attr) {
                        html += `<tr><td>${idx + 1}</td><td>${attr.name}</td><td>${attr.visitTime}</td><td>${attr.ticketPrice}</td><td>${attr.openingHours}</td></tr>`;
                    }
                });
                html += '</table>';
            });

            html += '<p style="text-align:center;color:#888;margin-top:30px;">*由俄罗斯行程规划程序生成*</p>';
            html += '</body></html>';

            const blob = new Blob([html], { type: 'application/msword;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '俄罗斯行程规划.doc';
            a.click();
            URL.revokeObjectURL(url);
            showToast('Word文档已导出');
        }

        // 导出为Excel
        function exportFullItineraryExcel() {
            let csv = '\uFEFF'; // BOM for UTF-8
            csv += '天数,序号,景点名称,城市,游玩时间,门票价格,开放时间,购票方式\n';

            itinerary.forEach(day => {
                day.attractions.forEach((attrId, idx) => {
                    const attr = getAttraction(attrId);
                    if (attr) {
                        const city = attr.id.startsWith('sp-') ? '圣彼得堡' : '莫斯科';
                        csv += `${day.number},${idx + 1},"${attr.name}",${city},"${attr.visitTime}","${attr.ticketPrice}","${attr.openingHours}","${attr.purchaseMethod}"\n`;
                    }
                });
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '俄罗斯行程规划.csv';
            a.click();
            URL.revokeObjectURL(url);
            showToast('Excel文件已导出');
        }

        // 导出为JPG
        function exportFullItineraryJPG() {
            const content = document.getElementById('fullItineraryContent');
            const container = content.cloneNode(true);
            container.style.position = 'fixed';
            container.style.left = '-9999px';
            container.style.width = '1200px';
            container.style.padding = '40px';
            container.style.background = 'white';
            document.body.appendChild(container);

            html2canvas(container, { scale: 2, useCORS: true, logging: false }).then(canvas => {
                document.body.removeChild(container);
                const link = document.createElement('a');
                link.download = '俄罗斯行程规划.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
                showToast('JPG图片已导出');
            }).catch(err => {
                document.body.removeChild(container);
                showToast('导出失败，请重试');
            });
        }

        window.onload = init;
    </script>
