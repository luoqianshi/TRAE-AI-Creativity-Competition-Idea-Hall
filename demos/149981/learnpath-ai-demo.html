<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学路 AI — 问题驱动的智能学习导航仪</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
:root {
  --bg: #FAFBFC;
  --card: #FFFFFF;
  --primary: #5B8DEF;
  --primary-light: #D6E8FF;
  --primary-dark: #3B6FD6;
  --green: #52C41A;
  --green-light: #D4F4DD;
  --gray: #D9D9D9;
  --gray-light: #F0F0F0;
  --text: #1a1a2e;
  --text-muted: #8c8c8c;
  --border: #E8E8E8;
  --radius: 16px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Noto Sans SC', -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
.hidden { display: none !important; }
.fade-in { animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* 导航栏 */
.navbar { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 32px; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
.navbar .logo { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
.navbar .logo .icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--primary), #8BB4F5); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
.navbar .nav-right { margin-left: auto; font-size: 14px; color: var(--text-muted); }
.progress-bar { height: 4px; background: var(--gray-light); position: fixed; top: 60px; left: 0; right: 0; z-index: 99; }
.progress-bar .fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--green)); border-radius: 0 4px 4px 0; transition: width 0.5s ease; width: 0%; }

/* 欢迎页 */
.page { padding-top: 80px; min-height: 100vh; }
.page-content { max-width: 720px; margin: 0 auto; padding: 60px 24px; text-align: center; }
.welcome-hero h1 { font-size: 42px; font-weight: 900; margin-bottom: 16px; background: linear-gradient(135deg, var(--text), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.welcome-hero p { font-size: 18px; color: var(--text-muted); margin-bottom: 48px; }
.start-card { background: var(--card); border: 2px solid var(--border); border-radius: 20px; padding: 48px 40px; max-width: 480px; margin: 0 auto; transition: all 0.3s; }
.start-card:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.start-card .icon { font-size: 56px; margin-bottom: 20px; }
.start-card h2 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
.start-card p { color: var(--text-muted); font-size: 15px; margin-bottom: 28px; }
.btn { padding: 14px 36px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }
.btn-secondary { background: var(--gray-light); color: var(--text); }
.btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
.btn-outline:hover { background: var(--primary-light); }

/* 加载页 */
.loading-screen { text-align: center; padding: 100px 20px; }
.loading-screen .spinner { width: 56px; height: 56px; border: 4px solid var(--primary-light); border-top-color: var(--primary); border-radius: 50%; margin: 0 auto 24px; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-screen h3 { font-size: 20px; margin-bottom: 8px; }
.loading-screen p { color: var(--text-muted); font-size: 15px; }

/* 主界面布局 */
.main-layout { display: flex; gap: 24px; padding: 80px 24px 24px; max-width: 1200px; margin: 0 auto; min-height: 100vh; }
.graph-panel { flex: 0 0 40%; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; position: sticky; top: 80px; height: calc(100vh - 104px); }
.graph-panel .panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.graph-panel .panel-header h3 { font-size: 15px; font-weight: 600; }
.graph-panel .panel-header .goal-tag { font-size: 12px; color: var(--primary); background: var(--primary-light); padding: 3px 10px; border-radius: 6px; }
.zoom-controls { display: flex; gap: 2px; background: var(--gray-light); border-radius: 8px; padding: 2px; align-items: center; }
.zoom-btn { width: 28px; height: 28px; border: none; background: transparent; color: var(--text-muted); border-radius: 6px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-family: inherit; line-height: 1; }
.zoom-btn:hover { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.zoom-btn:active { transform: scale(0.92); }
.zoom-scale { font-size: 11px; color: var(--text-muted); min-width: 32px; text-align: center; font-variant-numeric: tabular-nums; }
#graph-container { flex: 1; position: relative; overflow: hidden; min-height: 0; }
.graph-legend { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 20px; font-size: 12px; color: var(--text-muted); background: #FAFBFC; align-items: center; }
.legend-item { display: flex; align-items: center; gap: 6px; transition: opacity 0.2s; }
.legend-item:hover { opacity: 0.7; }
.legend-dot { width: 16px; height: 16px; border-radius: 4px; border: 2px solid; }
.content-panel { flex: 1; display: flex; flex-direction: column; gap: 20px; min-width: 0; }

/* 诊断卡片 */
.diagnosis-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow); animation: slideUp 0.4s ease; }
.diagnosis-card .step-badge { display: inline-block; font-size: 12px; color: var(--primary); background: var(--primary-light); padding: 4px 12px; border-radius: 8px; margin-bottom: 16px; font-weight: 600; }
.diagnosis-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.diagnosis-card .subtitle { color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }
.question-block { margin-bottom: 28px; }
.question-block .q-text { font-size: 16px; font-weight: 500; margin-bottom: 16px; line-height: 1.6; }
.options { display: flex; flex-direction: column; gap: 10px; }
.option { padding: 14px 18px; border: 2px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.2s; font-size: 14px; display: flex; align-items: center; gap: 10px; }
.option:hover { border-color: var(--primary); background: var(--primary-light); }
.option.selected { border-color: var(--primary); background: var(--primary-light); }
.option.correct { border-color: var(--green); background: var(--green-light); }
.option.wrong { border-color: #ff4d4f; background: #fff2f0; }
.option .opt-label { width: 28px; height: 28px; border-radius: 50%; background: var(--gray-light); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.option.selected .opt-label { background: var(--primary); color: #fff; }
.option.correct .opt-label { background: var(--green); color: #fff; }
.option.wrong .opt-label { background: #ff4d4f; color: #fff; }
.explanation { margin-top: 12px; padding: 14px 16px; background: #FFFBE6; border-radius: 10px; font-size: 13px; color: #614700; border: 1px solid #FFE58F; }
.diag-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
.diag-progress { font-size: 14px; color: var(--text-muted); }

/* 诊断结果 */
.diag-result { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px; box-shadow: var(--shadow); text-align: center; animation: slideUp 0.4s ease; }
.diag-result h2 { font-size: 24px; margin-bottom: 8px; }
.result-stats { display: flex; justify-content: center; gap: 40px; margin: 32px 0; }
.result-stat { text-align: center; }
.result-stat .num { font-size: 36px; font-weight: 700; }
.result-stat .label { font-size: 13px; color: var(--text-muted); }
.result-stat.mastered .num { color: var(--green); }
.result-stat.need-learn .num { color: var(--primary); }
.result-stat.need-prep .num { color: #FAAD14; }

/* 学习内容 */
.learn-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow); animation: slideUp 0.4s ease; }
.learn-card .topic-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.learn-card .topic-header h2 { font-size: 22px; }
.learn-card .topic-header .status-tag { font-size: 12px; padding: 4px 12px; border-radius: 8px; font-weight: 600; }
.learn-content { font-size: 15px; line-height: 1.8; color: #333; }
.learn-content h3 { font-size: 17px; margin: 20px 0 10px; color: var(--text); }
.learn-content p { margin-bottom: 12px; }
.learn-content code { background: #f5f5f5; padding: 2px 8px; border-radius: 4px; font-size: 13px; font-family: 'SF Mono', Consolas, monospace; }
.learn-content pre { background: #1e1e2e; color: #e4e4f0; padding: 16px 20px; border-radius: 12px; overflow-x: auto; margin: 12px 0 16px; font-size: 13px; line-height: 1.6; }
.learn-content pre code { background: none; padding: 0; color: inherit; }
.learn-content ul, .learn-content ol { padding-left: 24px; margin-bottom: 12px; }
.learn-content li { margin-bottom: 6px; }

/* 测试区 */
.test-section { margin-top: 28px; padding-top: 24px; border-top: 2px dashed var(--border); }
.test-section .test-header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.test-section .test-header .icon { font-size: 20px; }
.test-section .test-header h3 { font-size: 16px; }
.test-feedback { margin-top: 16px; padding: 16px 20px; border-radius: 12px; font-size: 14px; animation: fadeIn 0.3s ease; }
.test-feedback.pass { background: var(--green-light); border: 1px solid var(--green); }
.test-feedback.fail { background: #FFF2F0; border: 1px solid #ff4d4f; }
.test-feedback strong { font-size: 15px; }
.test-feedback .next-actions { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }

/* 问答区 */
.qa-section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.qa-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.qa-header .icon { font-size: 18px; }
.qa-header h3 { font-size: 15px; }
.qa-header .hint { margin-left: auto; font-size: 12px; color: var(--text-muted); }
.qa-messages { padding: 16px 20px; max-height: 260px; overflow-y: auto; }
.qa-msg { margin-bottom: 14px; }
.qa-msg.user { text-align: right; }
.qa-msg.user .bubble { display: inline-block; background: var(--primary); color: #fff; padding: 10px 16px; border-radius: 14px 14px 4px 14px; max-width: 85%; font-size: 14px; text-align: left; }
.qa-msg.ai .bubble { display: inline-block; background: var(--gray-light); color: var(--text); padding: 10px 16px; border-radius: 14px 14px 14px 4px; max-width: 85%; font-size: 14px; text-align: left; line-height: 1.6; }
.qa-input-row { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
.qa-input-row input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; outline: none; }
.qa-input-row input:focus { border-color: var(--primary); }
.qa-input-row button { padding: 8px 18px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; font-family: inherit; }
.qa-input-row button:hover { background: var(--primary-dark); }

/* 空闲提示 */
.idle-prompt { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 48px; text-align: center; box-shadow: var(--shadow); }
.idle-prompt .icon { font-size: 48px; margin-bottom: 16px; }
.idle-prompt h3 { font-size: 18px; margin-bottom: 8px; }
.idle-prompt p { color: var(--text-muted); font-size: 14px; }
.idle-prompt .suggestion { margin-top: 24px; padding: 14px 24px; background: var(--primary-light); border-radius: 12px; font-size: 15px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 10px; }
.idle-prompt .suggestion:hover { background: var(--primary); color: #fff; }
.idle-prompt .suggestion .pulse-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; animation: pulse 1.5s ease infinite; }
.idle-prompt .suggestion:hover .pulse-dot { background: #fff; }

/* 响应式 */
@media (max-width: 900px) {
  .main-layout { flex-direction: column; padding: 80px 16px 16px; }
  .graph-panel { position: relative; top: 0; height: 350px; flex: none; width: 100%; }
  .welcome-hero h1 { font-size: 32px; }
  .start-card { padding: 36px 28px; }
}
</style>
</head>
<body>

<!-- 导航栏 -->
<div class="navbar">
  <div class="logo">
    <div class="icon">🧭</div>
    <span>学路 AI</span>
  </div>
  <div class="nav-right" id="nav-status"></div>
</div>
<div class="progress-bar"><div class="fill" id="progress-fill"></div></div>

<!-- 欢迎页 -->
<div class="page" id="page-welcome">
  <div class="page-content">
    <div class="welcome-hero">
      <h1>学路 AI</h1>
      <p>输入你想解决的问题，AI 自动拆解知识树、诊断知识缺口、生成个性化学习路径，并通过减压式知识图谱追踪进度。</p>
    </div>
    <div class="start-card" onclick="startLearning()">
      <div class="icon">🐍</div>
      <h2>学 Python 编程</h2>
      <p>从零入门，掌握变量、循环、函数等核心概念</p>
      <button class="btn btn-primary">开始学习</button>
    </div>
  </div>
</div>

<!-- 加载页 -->
<div class="page hidden" id="page-loading">
  <div class="page-content">
    <div class="loading-screen">
      <div class="spinner"></div>
      <h3 id="loading-title">正在拆解知识树…</h3>
      <p id="loading-desc">AI 正在分析你的学习目标，生成系统化的知识图谱</p>
    </div>
  </div>
</div>

<!-- 主界面 -->
<div class="main-layout hidden" id="page-main">
  <div class="graph-panel">
    <div class="panel-header">
      <h3>知识图谱</h3>
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="goal-tag" id="goal-tag">学 Python</span>
        <div class="zoom-controls">
          <span class="zoom-scale" id="zoom-scale">100%</span>
          <button class="zoom-btn" onclick="zoomIn()" title="放大">＋</button>
          <button class="zoom-btn" onclick="zoomReset()" title="重置">⟲</button>
          <button class="zoom-btn" onclick="zoomOut()" title="缩小">−</button>
        </div>
      </div>
    </div>
    <div id="graph-container"></div>
    <div class="graph-legend">
      <div class="legend-item"><div class="legend-dot" style="background: #D4EDDA; border-color: #28A745;"></div>已掌握</div>
      <div class="legend-item"><div class="legend-dot" style="background: #CCE5FF; border-color: #007BFF;"></div>学习中</div>
      <div class="legend-item"><div class="legend-dot" style="background: #FFF3CD; border-color: #FFC107;"></div>建议学习</div>
    </div>
  </div>
  <div class="content-panel" id="content-panel"></div>
</div>

<script>
// ===== Python 知识数据 =====
const KNOWLEDGE_DATA = {
  nodes: [
    { id: 'variables', label: '变量', prerequisites: [], status: 'unknown' },
    { id: 'datatypes', label: '数据类型', prerequisites: ['variables'], status: 'unknown' },
    { id: 'operators', label: '运算符', prerequisites: ['variables'], status: 'unknown' },
    { id: 'conditionals', label: '条件判断', prerequisites: ['operators'], status: 'unknown' },
    { id: 'loops', label: '循环', prerequisites: ['conditionals'], status: 'unknown' },
    { id: 'functions', label: '函数', prerequisites: ['conditionals','loops'], status: 'unknown' },
    { id: 'lists', label: '列表', prerequisites: ['datatypes','loops'], status: 'unknown' },
    { id: 'dicts', label: '字典', prerequisites: ['lists'], status: 'unknown' }
  ],
  diagnosis: {
    variables: { question: '以下哪个是合法的 Python 变量名？', options: ['2name', '_score', 'class', 'my-name'], answer: 1, explanation: '变量名不能以数字开头、不能是关键字（如 class）、不能含连字符。_score 是合法的。' },
    datatypes: { question: '表达式 type(3.14) 的返回值是？', options: ['int', 'float', 'str', 'bool'], answer: 1, explanation: '3.14 是小数，属于 float（浮点数）类型。' },
    operators: { question: '10 // 3 的结果是？', options: ['3.33', '3', '4', '1'], answer: 1, explanation: '// 是整除运算符，10 // 3 = 3（向下取整）。' },
    conditionals: { question: '以下代码输出什么？\nif 5 > 3:\n    print("A")\nelse:\n    print("B")', options: ['A', 'B', 'AB', '报错'], answer: 0, explanation: '5 > 3 为 True，执行 if 分支，输出 A。' },
    loops: { question: '以下代码输出什么？\nfor i in range(3):\n    print(i)', options: ['1 2 3', '0 1 2', '0 1 2 3', '1 2'], answer: 1, explanation: 'range(3) 生成 0, 1, 2（不含 3），所以输出 0 1 2。' },
    functions: { question: '以下函数调用返回什么？\ndef add(a, b):\n    return a + b\nadd(3, 5)', options: ['35', '8', '3+5', '报错'], answer: 1, explanation: '函数接收两个参数 3 和 5，返回它们的和 8。' },
    lists: { question: '以下代码输出什么？\nnums = [1, 2, 3]\nnums.append(4)\nprint(len(nums))', options: ['3', '4', '5', '报错'], answer: 1, explanation: '原列表有 3 个元素，append(4) 后变为 [1,2,3,4]，len 为 4。' },
    dicts: { question: '以下代码输出什么？\nd = {"name": "Tom", "age": 20}\nprint(d["age"])', options: ['Tom', '20', 'age', '报错'], answer: 1, explanation: 'd["age"] 通过键 "age" 访问对应的值 20。' }
  },
  lessons: {
    variables: {
      title: '变量',
      content: `<h3>什么是变量？</h3>
<p>变量是用来<strong>存储数据</strong>的容器。你可以把它想象成一个贴了标签的盒子，盒子里装数据，标签就是变量名。</p>
<h3>如何创建变量？</h3>
<p>在 Python 中，用 <code>=</code> 给变量赋值：</p>
<pre><code>name = "小明"
age = 18
height = 1.75</code></pre>
<p>这就创建了三个变量：<code>name</code> 存文字，<code>age</code> 存整数，<code>height</code> 存小数。</p>
<h3>变量命名规则</h3>
<ul>
<li>只能用字母、数字、下划线</li>
<li>不能以数字开头</li>
<li>不能是 Python 关键字（如 if、for、class）</li>
<li>区分大小写（Name 和 name 不同）</li>
</ul>
<h3>使用变量</h3>
<pre><code>score = 95
print("你的成绩是:", score)
# 输出: 你的成绩是: 95</code></pre>`
    },
    datatypes: {
      title: '数据类型',
      content: `<h3>Python 基本数据类型</h3>
<ul>
<li><strong>int</strong> — 整数，如 <code>18</code>、<code>-5</code></li>
<li><strong>float</strong> — 浮点数（小数），如 <code>3.14</code>、<code>-0.5</code></li>
<li><strong>str</strong> — 字符串（文字），如 <code>"你好"</code></li>
<li><strong>bool</strong> — 布尔值，<code>True</code> 或 <code>False</code></li>
</ul>
<h3>查看数据类型</h3>
<pre><code>type(42)       # &lt;class 'int'&gt;
type(3.14)     # &lt;class 'float'&gt;
type("hello")  # &lt;class 'str'&gt;
type(True)     # &lt;class 'bool'&gt;</code></pre>
<h3>类型转换</h3>
<pre><code>str(42)     # "42" — 整数转字符串
int("100")  # 100 — 字符串转整数
float(5)    # 5.0 — 整数转浮点数
bool(0)     # False — 0 转 False</code></pre>`
    },
    operators: {
      title: '运算符',
      content: `<h3>算术运算符</h3>
<pre><code>10 + 3   # 13  加法
10 - 3   # 7   减法
10 * 3   # 30  乘法
10 / 3   # 3.333... 除法
10 // 3  # 3   整除（取整数部分）
10 % 3   # 1   取余数
2 ** 3   # 8   幂运算（2的3次方）</code></pre>
<h3>赋值运算符</h3>
<pre><code>x = 10    # 赋值
x += 5    # 等同于 x = x + 5 → 15
x -= 3    # 等同于 x = x - 3 → 12
x *= 2    # 等同于 x = x * 2 → 24</code></pre>
<h3>逻辑运算符</h3>
<pre><code>True and False  # False（两个都True才True）
True or False   # True（一个True就True）
not True        # False（取反）</code></pre>`
    },

// ===== 状态管理 =====
let state = {
  nodes: [],
  network: null,
  diagIndex: 0,
  diagQuestions: [],
  diagAnswers: {},
  currentLesson: null,
  testIndex: 0,
  testAnswers: []
};

// ===== 页面切换 =====
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  document.getElementById(pageId).classList.remove('hidden');
  if (pageId === 'page-welcome') {
    document.getElementById('page-main').classList.add('hidden');
  }
}

// ===== 开始学习 =====
function startLearning() {
  state.nodes = KNOWLEDGE_DATA.nodes.map(n => ({...n}));
  
  showPage('page-loading');
  document.getElementById('loading-title').textContent = '正在拆解知识树…';
  document.getElementById('loading-desc').textContent = 'AI 正在分析 Python 学习路径，生成系统化的知识图谱';

  setTimeout(() => {
    document.getElementById('loading-title').textContent = '正在生成诊断题目…';
    document.getElementById('loading-desc').textContent = '为每个知识点准备快速诊断问题';
  }, 1000);

  setTimeout(() => {
    document.getElementById('page-loading').classList.add('hidden');
    document.getElementById('page-main').classList.remove('hidden');
    document.getElementById('nav-status').textContent = '目标：学 Python';
    renderGraph();
    startDiagnosis();
  }, 2200);
}

// ===== 知识图谱渲染 =====
function renderGraph() {
  const container = document.getElementById('graph-container');
  
  // 节点配色方案（柔和、减压、高对比）
  const colorScheme = {
    mastered: { bg: '#D4EDDA', border: '#28A745', text: '#155724', icon: '✓', glow: 'rgba(40,167,69,0.25)' },
    learning: { bg: '#CCE5FF', border: '#007BFF', text: '#004085', icon: '📖', glow: 'rgba(0,123,255,0.2)' },
    suggested: { bg: '#FFF3CD', border: '#FFC107', text: '#856404', icon: '🎯', glow: 'rgba(255,193,7,0.35)' },
    needLearn: { bg: '#E9ECEF', border: '#868E96', text: '#343A40', icon: '', glow: 'transparent' },
    unknown: { bg: '#E9ECEF', border: '#ADB5BD', text: '#343A40', icon: '○', glow: 'transparent' }
  };
  
  const visNodes = state.nodes.map(n => {
    const scheme = n.status === 'mastered' ? colorScheme.mastered :
                   n.status === 'learning' ? colorScheme.learning :
                   n.status === 'suggested' ? colorScheme.suggested :
                   n.status === 'need-learn' ? colorScheme.needLearn : colorScheme.unknown;
    
    const isHighlighted = n.status === 'suggested' || n.status === 'learning' || n.status === 'mastered';
    
    return {
      id: n.id,
      label: `${scheme.icon ? scheme.icon + ' ' : ''}${n.label}`,
      title: getNodeTooltip(n),
      color: { background: scheme.bg, border: scheme.border, highlight: { background: scheme.bg, border: scheme.border } },
      font: { 
        size: n.status === 'unknown' ? 15 : (n.status === 'suggested' ? 16 : 14), 
        color: scheme.text, 
        face: 'Noto Sans SC', 
        bold: n.status === 'suggested' || n.status === 'mastered' || n.status === 'unknown',
        vadjust: 0
      },
      shape: 'box',
      borderRadius: 10,
      widthConstraint: { minimum: 100, maximum: 140 },
      heightConstraint: { minimum: 36 },
      borderWidth: n.status === 'suggested' ? 3 : (n.status === 'mastered' ? 2.5 : 2),
      shadow: { 
        enabled: isHighlighted, 
        color: scheme.glow, 
        size: n.status === 'suggested' ? 20 : 12, 
        x: 0, 
        y: 4 
      },
      margin: { top: 12, bottom: 12, left: 14, right: 14 },
      opacity: 1
    };
  });

  // 边样式优化：更清晰的依赖箭头
  const visEdges = [];
  state.nodes.forEach(n => {
    if (n.prerequisites) {
      n.prerequisites.forEach(pre => {
        const preNode = state.nodes.find(p => p.id === pre);
        const isHighlightPath = (n.status === 'suggested' || n.status === 'learning') && 
                                  (preNode && (preNode.status === 'mastered' || preNode.status === 'learning'));
        
        visEdges.push({
          id: `${pre}-${n.id}`,
          from: pre,
          to: n.id,
          arrows: { to: { enabled: true, scaleFactor: 0.7, type: 'arrow' } },
          color: { 
            color: isHighlightPath ? '#90CAF9' : '#E0E0E0', 
            highlight: '#42A5F5', 
            hover: '#BDBDBD',
            opacity: isHighlightPath ? 1 : 0.6
          },
          width: isHighlightPath ? 2.5 : 1.5,
          smooth: { type: 'cubicBezier', roundness: 0.5 },
          dashes: false,
          hoverWidth: 3,
          selectionWidth: 3
        });
      });
    }
  });

  const data = { nodes: visNodes, edges: visEdges };
  
  // 布局优化：更清晰的层级结构
  const options = {
    layout: { hierarchical: { enabled: true, direction: 'UD', sortMethod: 'directed', levelSeparation: 120, nodeSpacing: 140 } },
    physics: { enabled: false },
    interaction: { hover: true, zoomView: true, dragView: true, tooltipDelay: 50 },
    nodes: { borderWidth: 2 },
    edges: { smooth: { type: 'cubicBezier', roundness: 0.5 } }
  };

  state.network = new vis.Network(container, data, options);
  
  // 绑定缩放事件（限幅 + 滚轮阻止页面滚动）
  bindZoomEvents();
  
  // 点击事件
  state.network.on('click', function(params) {
    if (params.nodes.length > 0) {
      onNodeClick(params.nodes[0]);
    }
  });
  
  // 悬停高亮相关节点
  state.network.on('hoverNode', function(params) {
    container.style.cursor = 'pointer';
    const nodeId = params.node;
    highlightConnectedNodes(nodeId, true);
  });
  
  state.network.on('blurNode', function(params) {
    container.style.cursor = 'default';
    if (params.node) {
      highlightConnectedNodes(params.node, false);
    }
  });
  
  // 初始缩放适配（带动画）
  setTimeout(() => {
    state.network.fit({ 
      animation: { 
        duration: 800, 
        easingFunction: 'easeOutQuart' 
      }
    });
    updateGraphLegend();
  }, 100);
}

// 获取节点提示信息
function getNodeTooltip(node) {
  const statusText = {
    mastered: '已掌握',
    learning: '学习中',
    suggested: '建议学习',
    'need-learn': '待学习',
    unknown: '未诊断'
  };
  const prereqText = node.prerequisites && node.prerequisites.length > 0 
    ? `\n前置知识: ${node.prerequisites.map(p => KNOWLEDGE_DATA.nodes.find(n => n.id === p)?.label || p).join('、')}` 
    : '';
  return `${node.label}\n状态: ${statusText[node.status] || '未知'}${prereqText}`;
}

// 高亮相连节点
function highlightConnectedNodes(nodeId, highlight) {
  if (!state.network) return;
  
  const connectedEdges = state.network.getConnectedEdges(nodeId);
  const connectedNodes = state.network.getConnectedNodes(nodeId);
  
  if (highlight) {
    state.network.selectNodes(connectedNodes, false);
  } else {
    state.network.unselectAll();
  }
}

// 更新图例统计
function updateGraphLegend() {
  const stats = {
    mastered: state.nodes.filter(n => n.status === 'mastered').length,
    learning: state.nodes.filter(n => n.status === 'learning').length,
    suggested: state.nodes.filter(n => n.status === 'suggested').length,
    total: state.nodes.length
  };
  
  const legendEl = document.querySelector('.graph-legend');
  if (legendEl) {
    legendEl.innerHTML = `
      <div class="legend-item"><span class="legend-dot" style="background: #28A745;"></span>已掌握 ${stats.mastered}</div>
      <div class="legend-item"><span class="legend-dot" style="background: #007BFF;"></span>学习中 ${stats.learning}</div>
      <div class="legend-item"><span class="legend-dot" style="background: #FFC107;"></span>建议 ${stats.suggested}</div>
      <div class="legend-item" style="margin-left: auto; color: #6C757D;">${stats.mastered}/${stats.total} 完成</div>
    `;
  }
}

// ===== 缩放控制 =====
function zoomIn() {
  if (!state.network) return;
  state.network.moveTo({ scale: state.network.getScale() * 1.35, animation: { duration: 200 } });
}
function zoomOut() {
  if (!state.network) return;
  state.network.moveTo({ scale: state.network.getScale() / 1.35, animation: { duration: 200 } });
}
function zoomReset() {
  if (!state.network) return;
  state.network.fit({ animation: { duration: 300 } });
}
function updateZoomScale() {
  const el = document.getElementById('zoom-scale');
  if (el && state.network) el.textContent = Math.round(state.network.getScale() * 100) + '%';
}

function bindZoomEvents() {
  if (!state.network) return;
  const container = document.getElementById('graph-container');
  state.network.on('zoom', updateZoomScale);
  container.addEventListener('wheel', function(e) { e.preventDefault(); }, { passive: false });
  updateZoomScale();
}

function updateGraphNode(nodeId, status) {
  const node = state.nodes.find(n => n.id === nodeId);
  if (node) {
    node.status = status;
    const visNode = state.network.body.data.nodes.get(nodeId);
    const cs = { mastered: { background: '#D4EDDA', border: '#28A745' }, learning: { background: '#CCE5FF', border: '#007BFF' }, suggested: { background: '#FFF3CD', border: '#FFC107' }, 'need-learn': { background: '#E9ECEF', border: '#868E96' }, unknown: { background: '#E9ECEF', border: '#ADB5BD' } };
    visNode.color = cs[status] || cs.unknown;
    visNode.borderWidth = (status === 'suggested' || status === 'mastered') ? 3 : 2;
    state.network.body.data.nodes.update(visNode);
    updateGraphLegend();
  }
}

function updateProgress() {
  const total = state.nodes.length;
  const mastered = state.nodes.filter(n => n.status === 'mastered').length;
  const pct = Math.round((mastered / total) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('nav-status').textContent = '已掌握 ' + mastered + '/' + total + ' 个知识点';
}

// ===== 诊断流程 =====
function startDiagnosis() {
  state.diagIndex = 0;
  state.diagQuestions = [];
  state.diagAnswers = {};
  
  state.nodes.forEach(node => {
    if (KNOWLEDGE_DATA.diagnosis[node.id]) {
      state.diagQuestions.push(node.id);
    }
  });
  
  renderDiagnosisQuestion();
}

function renderDiagnosisQuestion() {
  const panel = document.getElementById('content-panel');
  
  if (state.diagIndex >= state.diagQuestions.length) {
    showDiagnosisResult();
    return;
  }

  const nodeId = state.diagQuestions[state.diagIndex];
  const node = state.nodes.find(n => n.id === nodeId);
  const diag = KNOWLEDGE_DATA.diagnosis[nodeId];
  
  panel.innerHTML = `
    <div class="diagnosis-card fade-in">
      <span class="step-badge">步骤 3/4 · 知识诊断</span>
      <h2>快速诊断：${node.label}</h2>
      <p class="subtitle">回答以下问题，帮 AI 了解你的知识水平</p>
      <div class="question-block">
        <div class="q-text">${diag.question.replace(/\n/g, '<br>')}</div>
        <div class="options" id="diag-options">
          ${diag.options.map((opt, i) => `
            <div class="option" onclick="selectDiagOption(${i})" data-idx="${i}">
              <div class="opt-label">${String.fromCharCode(65+i)}</div>
              <span>${opt}</span>
            </div>
          `).join('')}
        </div>
        <div class="explanation hidden" id="diag-explanation">
          <strong>💡 解析：</strong>${diag.explanation}
        </div>
      </div>
      <div class="diag-actions">
        <span class="diag-progress">${state.diagIndex + 1} / ${state.diagQuestions.length}</span>
        <button class="btn btn-primary" id="diag-next-btn" onclick="nextDiagQuestion()" disabled>下一题</button>
      </div>
    </div>
  `;
}

function selectDiagOption(idx) {
  const nodeId = state.diagQuestions[state.diagIndex];
  const diag = KNOWLEDGE_DATA.diagnosis[nodeId];
  const options = document.querySelectorAll('#diag-options .option');
  
  options.forEach((opt, i) => {
    opt.style.pointerEvents = 'none';
    if (i === idx) {
      opt.classList.add(idx === diag.answer ? 'correct' : 'wrong');
    }
    if (i === diag.answer && i !== idx) {
      opt.classList.add('correct');
    }
  });
  
  document.getElementById('diag-explanation').classList.remove('hidden');
  document.getElementById('diag-next-btn').disabled = false;
  
  state.diagAnswers[nodeId] = (idx === diag.answer);
}

function nextDiagQuestion() {
  const nodeId = state.diagQuestions[state.diagIndex];
  const isCorrect = state.diagAnswers[nodeId];
  
  updateGraphNode(nodeId, isCorrect ? 'mastered' : 'need-learn');
  state.diagIndex++;
  renderDiagnosisQuestion();
}

function showDiagnosisResult() {
  const panel = document.getElementById('content-panel');
  const mastered = state.nodes.filter(n => n.status === 'mastered').length;
  const needLearn = state.nodes.filter(n => n.status === 'need-learn').length;
  const needPrep = state.nodes.filter(n => n.status === 'unknown').length;
  
  const firstNeedLearn = state.nodes.find(n => n.status === 'need-learn' || n.status === 'unknown');
  if (firstNeedLearn) {
    updateGraphNode(firstNeedLearn.id, 'suggested');
  }
  
  updateProgress();
  
  panel.innerHTML = `
    <div class="diag-result fade-in">
      <span class="step-badge">诊断完成</span>
      <h2>你的知识图谱已就绪</h2>
      <p style="color: var(--text-muted); margin-bottom: 8px;">AI 已根据诊断结果标记了你的知识掌握情况</p>
      <div class="result-stats">
        <div class="result-stat mastered">
          <div class="num">${mastered}</div>
          <div class="label">已掌握</div>
        </div>
        <div class="result-stat need-learn">
          <div class="num">${needLearn}</div>
          <div class="label">需学习</div>
        </div>
        <div class="result-stat need-prep">
          <div class="num">${needPrep}</div>
          <div class="label">待诊断</div>
        </div>
      </div>
      <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 24px;">
        图谱中绿色节点表示已掌握，灰色节点表示待学习。<br>
        闪烁的蓝色节点是 AI 建议你接下来学习的知识点。
      </p>
      <button class="btn btn-primary" onclick="showIdlePrompt()">开始学习</button>
    </div>
  `;
}

// ===== 空闲提示 =====
function showIdlePrompt() {
  const panel = document.getElementById('content-panel');
  const suggested = state.nodes.find(n => n.status === 'suggested');
  
  if (suggested && KNOWLEDGE_DATA.lessons[suggested.id]) {
    panel.innerHTML = `
      <div class="idle-prompt fade-in">
        <div class="icon">👆</div>
        <h3>在左侧知识图谱中选择一个知识点</h3>
        <p>点击任意节点开始学习，AI 会为你生成专属学习内容</p>
        <div class="suggestion" onclick="onNodeClick('${suggested.id}')">
          <div class="pulse-dot"></div>
          <span>AI 建议从「${suggested.label}」开始 →</span>
        </div>
      </div>
    `;
  } else {
    const learnable = state.nodes.find(n => (n.status === 'need-learn' || n.status === 'unknown') && KNOWLEDGE_DATA.lessons[n.id]);
    if (learnable) {
      updateGraphNode(learnable.id, 'suggested');
      showIdlePrompt();
    } else {
      panel.innerHTML = `
        <div class="diag-result fade-in">
          <div style="font-size: 48px; margin-bottom: 16px;">🎓</div>
          <h2>恭喜！你已完成所有学习</h2>
          <p style="color: var(--text-muted);">所有知识点已掌握！</p>
        </div>
      `;
    }
  }
}

// ===== 节点点击 → 学习内容 =====
function onNodeClick(nodeId) {
  const node = state.nodes.find(n => n.id === nodeId);
  if (!node) return;
  
  state.nodes.forEach(n => {
    if (n.status === 'suggested') {
      updateGraphNode(n.id, 'need-learn');
    }
  });
  
  updateGraphNode(nodeId, 'learning');
  
  if (KNOWLEDGE_DATA.lessons[nodeId]) {
    showLesson(nodeId);
  } else {
    showIdlePrompt();
  }
}

function showLesson(nodeId) {
  const lesson = KNOWLEDGE_DATA.lessons[nodeId];
  const tests = KNOWLEDGE_DATA.tests[nodeId] || [];
  state.currentLesson = nodeId;
  state.testIndex = 0;
  state.testAnswers = [];
  
  const panel = document.getElementById('content-panel');
  panel.innerHTML = `
    <div class="learn-card fade-in">
      <div class="topic-header">
        <h2>${lesson.title}</h2>
        <span class="status-tag" style="background: var(--primary-light); color: var(--primary);">学习中</span>
      </div>
      <div class="learn-content">${lesson.content}</div>
      ${tests.length > 0 ? `
        <div class="test-section">
          <div class="test-header">
            <span class="icon">📝</span>
            <h3>学完了吗？来测试一下</h3>
          </div>
          <div id="test-area"></div>
        </div>
      ` : ''}
    </div>
    <div class="qa-section">
      <div class="qa-header">
        <span class="icon">💬</span>
        <h3>有疑问随时问</h3>
        <span class="hint">输入问题，AI 为你解答</span>
      </div>
      <div class="qa-messages" id="qa-messages">
        <div class="qa-msg ai">
          <div class="bubble">正在学习「${lesson.title}」，有什么不懂的可以随时问我！</div>
        </div>
      </div>
      <div class="qa-input-row">
        <input type="text" id="qa-input" placeholder="例如：这个概念能再解释一下吗？" onkeydown="if(event.key==='Enter')sendQA()">
        <button onclick="sendQA()">发送</button>
      </div>
    </div>
  `;
  
  if (tests.length > 0) {
    renderTest(0);
  }
}

function renderTest(testIdx) {
  const tests = KNOWLEDGE_DATA.tests[state.currentLesson];
  if (!tests || testIdx >= tests.length) {
    showTestComplete();
    return;
  }
  
  const test = tests[testIdx];
  const area = document.getElementById('test-area');
  area.innerHTML = `
    <div class="question-block fade-in">
      <div class="q-text">第 ${testIdx + 1} 题：${test.question.replace(/\n/g, '<br>')}</div>
      <div class="options" id="test-options">
        ${test.options.map((opt, i) => `
          <div class="option" onclick="selectTestOption(${i}, ${testIdx})" data-idx="${i}">
            <div class="opt-label">${String.fromCharCode(65+i)}</div>
            <span>${opt}</span>
          </div>
        `).join('')}
      </div>
      <div class="test-feedback hidden" id="test-feedback"></div>
    </div>
  `;
}

function selectTestOption(idx, testIdx) {
  const tests = KNOWLEDGE_DATA.tests[state.currentLesson];
  const test = tests[testIdx];
  const options = document.querySelectorAll('#test-options .option');
  const isCorrect = (idx === test.answer);
  
  options.forEach((opt, i) => {
    opt.style.pointerEvents = 'none';
    if (i === test.answer) opt.classList.add('correct');
    if (i === idx && !isCorrect) opt.classList.add('wrong');
  });
  
  state.testAnswers.push(isCorrect);
  
  const feedback = document.getElementById('test-feedback');
  feedback.classList.remove('hidden');
  
  if (isCorrect) {
    feedback.className = 'test-feedback pass';
    feedback.innerHTML = `
      <strong>✅ 回答正确！</strong>
      <div class="next-actions">
        ${testIdx < tests.length - 1 ? 
          `<button class="btn btn-primary" onclick="renderTest(${testIdx + 1})">下一题</button>` : 
          `<button class="btn btn-primary" onclick="showTestComplete()">查看结果</button>`
        }
      </div>
    `;
  } else {
    feedback.className = 'test-feedback fail';
    feedback.innerHTML = `
      <strong>❌ 答案有误</strong><br>
      正确答案是 <strong>${String.fromCharCode(65 + test.answer)}</strong>。
      <div class="next-actions">
        <button class="btn btn-secondary" onclick="renderTest(${testIdx})">重新作答</button>
        ${testIdx < tests.length - 1 ? 
          `<button class="btn btn-outline" onclick="renderTest(${testIdx + 1})">跳过，看下一题</button>` : 
          `<button class="btn btn-outline" onclick="showTestComplete()">查看结果</button>`
        }
      </div>
    `;
  }
}

function showTestComplete() {
  const tests = KNOWLEDGE_DATA.tests[state.currentLesson];
  const correct = state.testAnswers.filter(a => a).length;
  const total = tests.length;
  const passed = correct >= Math.ceil(total * 0.6);
  
  if (passed) {
    updateGraphNode(state.currentLesson, 'mastered');
  }
  updateProgress();
  
  const area = document.getElementById('test-area');
  area.innerHTML = `
    <div class="test-feedback ${passed ? 'pass' : 'fail'} fade-in" style="display:block;">
      <strong>${passed ? '🎉 测试通过！' : '💪 还需努力'} ${correct}/${total} 道正确</strong><br>
      ${passed ? 
        '该知识点已标记为「已掌握」，图谱节点已变绿。' : 
        '建议复习学习内容后再次尝试。'
      }
      <div class="next-actions">
        ${passed ? `
          <button class="btn btn-primary" onclick="goToNextTopic()">学习下一个知识点</button>
          <button class="btn btn-secondary" onclick="showIdlePrompt()">回到图谱</button>
        ` : `
          <button class="btn btn-primary" onclick="showLesson('${state.currentLesson}')">重新学习</button>
          <button class="btn btn-secondary" onclick="showIdlePrompt()">回到图谱</button>
        `}
      </div>
    </div>
  `;
}

function goToNextTopic() {
  const nextNode = state.nodes.find(n => 
    (n.status === 'need-learn' || n.status === 'unknown') && 
    KNOWLEDGE_DATA.lessons[n.id] &&
    n.prerequisites.every(pre => {
      const preNode = state.nodes.find(nn => nn.id === pre);
      return preNode && preNode.status === 'mastered';
    })
  );
  
  if (nextNode) {
    updateGraphNode(nextNode.id, 'suggested');
  }
  showIdlePrompt();
}

// ===== 问答功能 =====
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function sendQA() {
  const input = document.getElementById('qa-input');
  const question = input.value.trim();
  if (!question) return;
  
  const messages = document.getElementById('qa-messages');
  messages.innerHTML += `<div class="qa-msg user"><div class="bubble">${escapeHtml(question)}</div></div>`;
  input.value = '';
  messages.scrollTop = messages.scrollHeight;
  
  setTimeout(() => {
    const answer = getQAAnswer(question);
    messages.innerHTML += `<div class="qa-msg ai"><div class="bubble">${answer}</div></div>`;
    messages.scrollTop = messages.scrollHeight;
  }, 600);
}

function getQAAnswer(question) {
  const topicQA = KNOWLEDGE_DATA.qa[state.currentLesson] || KNOWLEDGE_DATA.qa['default'] || {};
  
  for (const key in topicQA) {
    if (key !== 'default' && question.includes(key)) {
      return topicQA[key].replace(/\n/g, '<br>');
    }
  }
  return topicQA['default'] || '这是一个很好的问题！在真实产品中，AI 会根据你的问题给出针对性的详细解答。';
}

// ===== 初始化 =====
showPage('page-welcome');
</script>
