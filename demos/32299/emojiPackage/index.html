<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表情包工坊 · 微信表情包AI制作压缩工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            color: #1f2937;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 头部 */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 15px;
        }

        /* 主卡片 */
        .main-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 30px;
        }

        /* 上传区域 */
        .upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8fafc;
            margin-bottom: 24px;
        }

        .upload-area:hover,
        .upload-area.drag-over {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateY(-2px);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .upload-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
        }

        .upload-tip {
            font-size: 13px;
            color: #64748b;
        }

        #fileInput {
            display: none;
        }

        /* 参数设置区 */
        .settings-panel {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .settings-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #334155;
        }

        .preset-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .preset-btn {
            padding: 8px 16px;
            border: 1px solid #e2e8f0;
            background: white;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .preset-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .preset-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .settings-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-item label {
            font-size: 13px;
            color: #64748b;
        }

        .setting-item input[type="range"] {
            width: 100%;
            accent-color: #667eea;
        }

        .setting-value {
            font-size: 12px;
            color: #94a3b8;
            text-align: right;
        }

        /* 预览对比区 */
        .preview-section {
            display: none;
            margin-bottom: 24px;
        }

        .preview-section.show {
            display: block;
        }

        .preview-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #334155;
        }

        .preview-compare {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .preview-box {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .preview-label {
            font-size: 13px;
            color: #64748b;
            font-weight: 500;
        }

        .preview-img-container {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: repeating-conic-gradient(#e2e8f0 0% 25%, white 0% 50%) 50% / 20px 20px;
            border-radius: 8px;
            overflow: hidden;
        }

        .preview-img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .preview-info {
            font-size: 12px;
            color: #64748b;
        }

        .compress-rate {
            color: #10b981;
            font-weight: 600;
        }

        /* 操作按钮区 */
        .action-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 1px solid #667eea;
        }

        .btn-secondary:hover {
            background: #f0f4ff;
        }

        .btn-ai {
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .btn-ai:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4);
        }

        /* AI功能弹窗 */
        .ai-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .ai-modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 480px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .modal-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
        }

        .modal-input:focus {
            border-color: #667eea;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* 批量结果列表 */
        .result-list {
            display: none;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .result-list.show {
            display: block;
        }

        .result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .result-item-name {
            font-size: 13px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 10px;
        }

        .result-item-size {
            font-size: 12px;
            color: #10b981;
            margin-right: 10px;
        }

        /* 底部说明 */
        .footer-tip {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* 移动端适配 */
        @media (max-width: 640px) {
            .settings-row {
                grid-template-columns: 1fr;
            }
            .preview-compare {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 24px;
            }
            .main-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>😆 表情包工坊</h1>
            <p>一键制作微信合规表情包 · AI智能加字 · 本地无损压缩</p>
        </div>

        <div class="main-card">
            <!-- 上传区域 -->
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <div class="upload-title">拖拽图片到这里，或点击选择文件</div>
                <div class="upload-tip">支持 JPG / PNG / GIF 格式，可批量上传，全程本地处理不上传服务器</div>
                <input type="file" id="fileInput" multiple accept="image/jpeg,image/png,image/gif">
            </div>

            <!-- 参数设置 -->
            <div class="settings-panel">
                <div class="settings-title">⚙️ 输出设置</div>
                <div class="preset-group">
                    <button class="preset-btn active" data-preset="wechat">微信表情包 (240px / 500KB)</button>
                    <button class="preset-btn" data-preset="wechat-big">微信大图表情 (360px)</button>
                    <button class="preset-btn" data-preset="custom">自定义</button>
                </div>
                <div class="settings-row">
                    <div class="setting-item">
                        <label>最大尺寸 (px)</label>
                        <input type="range" id="sizeRange" min="100" max="500" value="240">
                        <div class="setting-value" id="sizeValue">240px</div>
                    </div>
                    <div class="setting-item">
                        <label>压缩质量</label>
                        <input type="range" id="qualityRange" min="0.1" max="1" step="0.1" value="0.8">
                        <div class="setting-value" id="qualityValue">80%</div>
                    </div>
                </div>
            </div>

            <!-- 预览对比 -->
            <div class="preview-section" id="previewSection">
                <div class="preview-title">👀 效果预览</div>
                <div class="preview-compare">
                    <div class="preview-box">
                        <div class="preview-label">原图</div>
                        <div class="preview-img-container">
                            <img id="originalImg" alt="原图预览">
                        </div>
                        <div class="preview-info" id="originalInfo">--</div>
                    </div>
                    <div class="preview-box">
                        <div class="preview-label">压缩后</div>
                        <div class="preview-img-container">
                            <img id="compressedImg" alt="压缩后预览">
                        </div>
                        <div class="preview-info" id="compressedInfo">--</div>
                    </div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="action-group">
                <button class="btn btn-primary" id="compressBtn" disabled>开始压缩</button>
                <button class="btn btn-ai" id="aiBtn" disabled>✨ AI智能加字</button>
                <button class="btn btn-secondary" id="downloadBtn" disabled>下载图片</button>
                <button class="btn btn-secondary" id="downloadAllBtn" disabled>批量打包下载</button>
            </div>

            <!-- 批量结果列表 -->
            <div class="result-list" id="resultList"></div>
        </div>

        <div class="footer-tip">
            所有处理均在本地浏览器完成，图片不会上传到任何服务器，隐私安全有保障
        </div>
    </div>

    <!-- AI加字弹窗 -->
    <div class="ai-modal" id="aiModal">
        <div class="modal-content">
            <div class="modal-title">✨ AI 智能加字</div>
            <input type="text" class="modal-input" id="aiTextInput" placeholder="输入表情包文字，比如：这也太离谱了吧">
            <div class="modal-btns">
                <button class="btn btn-secondary" id="cancelAiBtn">取消</button>
                <button class="btn btn-ai" id="confirmAiBtn">生成</button>
            </div>
        </div>
    </div>

    <script>
        // ========== 全局变量 ==========
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const sizeRange = document.getElementById('sizeRange');
        const sizeValue = document.getElementById('sizeValue');
        const qualityRange = document.getElementById('qualityRange');
        const qualityValue = document.getElementById('qualityValue');
        const compressBtn = document.getElementById('compressBtn');
        const aiBtn = document.getElementById('aiBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const previewSection = document.getElementById('previewSection');
        const originalImg = document.getElementById('originalImg');
        const compressedImg = document.getElementById('compressedImg');
        const originalInfo = document.getElementById('originalInfo');
        const compressedInfo = document.getElementById('compressedInfo');
        const resultList = document.getElementById('resultList');
        const aiModal = document.getElementById('aiModal');
        const aiTextInput = document.getElementById('aiTextInput');
        const cancelAiBtn = document.getElementById('cancelAiBtn');
        const confirmAiBtn = document.getElementById('confirmAiBtn');
        const presetBtns = document.querySelectorAll('.preset-btn');

        let originalFiles = [];
        let processedFiles = [];
        let currentImage = null;
        let currentCompressedBlob = null;

        // ========== 预设配置 ==========
        const presets = {
            wechat: { size: 240, quality: 0.8 },
            'wechat-big': { size: 360, quality: 0.85 },
            custom: null
        };

        // ========== 上传处理 ==========
        uploadArea.addEventListener('click', () => fileInput.click());

        // 拖拽事件
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
            handleFiles(files);
        });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            handleFiles(files);
        });

        function handleFiles(files) {
            if (!files.length) return;
            originalFiles = files;
            processedFiles = [];
            
            // 显示第一张预览
            const firstFile = files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                originalImg.src = e.target.result;
                currentImage = new Image();
                currentImage.src = e.target.result;
                currentImage.onload = () => {
                    originalInfo.textContent = `${firstFile.name} · ${formatSize(firstFile.size)} · ${currentImage.width}×${currentImage.height}`;
                    previewSection.classList.add('show');
                    compressBtn.disabled = false;
                    aiBtn.disabled = false;
                };
            };
            reader.readAsDataURL(firstFile);

            // 更新结果列表
            updateResultList();
        }

        // ========== 预设切换 ==========
        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                presetBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const preset = presets[btn.dataset.preset];
                if (preset) {
                    sizeRange.value = preset.size;
                    qualityRange.value = preset.quality;
                    updateSizeValue();
                    updateQualityValue();
                }
            });
        });

        sizeRange.addEventListener('input', updateSizeValue);
        qualityRange.addEventListener('input', updateQualityValue);

        function updateSizeValue() {
            sizeValue.textContent = sizeRange.value + 'px';
            // 切换到自定义
            presetBtns.forEach(b => b.classList.remove('active'));
            document.querySelector('[data-preset="custom"]').classList.add('active');
        }

        function updateQualityValue() {
            qualityValue.textContent = Math.round(qualityRange.value * 100) + '%';
            presetBtns.forEach(b => b.classList.remove('active'));
            document.querySelector('[data-preset="custom"]').classList.add('active');
        }

        // ========== 核心压缩函数 ==========
        function compressImage(file, maxSize, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        // 等比缩放
                        if (width > maxSize || height > maxSize) {
                            if (width > height) {
                                height = Math.round(height * maxSize / width);
                                width = maxSize;
                            } else {
                                width = Math.round(width * maxSize / height);
                                height = maxSize;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // 输出blob
                        const mimeType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
                        canvas.toBlob((blob) => {
                            resolve({
                                blob,
                                width,
                                height,
                                name: file.name.replace(/\.[^/.]+$/, '') + '_compressed' + (file.type === 'image/png' ? '.png' : '.jpg')
                            });
                        }, mimeType, quality);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ========== 压缩按钮事件 ==========
        compressBtn.addEventListener('click', async () => {
            compressBtn.disabled = true;
            compressBtn.textContent = '压缩中...';
            processedFiles = [];

            try {
                for (let i = 0; i < originalFiles.length; i++) {
                    const file = originalFiles[i];
                    const result = await compressImage(
                        file,
                        parseInt(sizeRange.value),
                        parseFloat(qualityRange.value)
                    );
                    processedFiles.push(result);

                    // 第一张更新预览
                    if (i === 0) {
                        compressedImg.src = URL.createObjectURL(result.blob);
                        currentCompressedBlob = result.blob;
                        const rate = ((1 - result.blob.size / file.size) * 100).toFixed(1);
                        compressedInfo.innerHTML = `${result.name} · ${formatSize(result.blob.size)} · ${result.width}×${result.height} · <span class="compress-rate">压缩 ${rate}%</span>`;
                    }
                }

                downloadBtn.disabled = false;
                if (processedFiles.length > 1) {
                    downloadAllBtn.disabled = false;
                }
                updateResultList();
            } catch (err) {
                alert('压缩失败，请检查图片格式');
                console.error(err);
            } finally {
                compressBtn.disabled = false;
                compressBtn.textContent = '开始压缩';
            }
        });

        // ========== 下载功能 ==========
        downloadBtn.addEventListener('click', () => {
            if (!currentCompressedBlob) return;
            downloadBlob(currentCompressedBlob, processedFiles[0].name);
        });

        downloadAllBtn.addEventListener('click', async () => {
            // 批量下载：逐个触发下载（单文件零依赖实现，无需JSZip）
            // 如需打包ZIP，可内嵌JSZip库实现
            processedFiles.forEach((file, index) => {
                setTimeout(() => {
                    downloadBlob(file.blob, file.name);
                }, index * 300);
            });
        });

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ========== AI 加字功能（接入框架）==========
        aiBtn.addEventListener('click', () => {
            aiModal.classList.add('show');
            aiTextInput.focus();
        });

        cancelAiBtn.addEventListener('click', () => {
            aiModal.classList.remove('show');
        });

        confirmAiBtn.addEventListener('click', async () => {
            const text = aiTextInput.value.trim();
            if (!text) {
                alert('请输入表情包文字');
                return;
            }

            confirmAiBtn.disabled = true;
            confirmAiBtn.textContent = '生成中...';

            // ==========================================
            //  真实AI接入位置（替换此段代码即可）
            //  调用 TRAE 图片生成/编辑接口，传入原图和文字
            //  返回带文字的表情包图片
            // ==========================================
            
            // 演示版：Canvas手动加字（正式版替换为AI接口调用）
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = currentImage;
            
            let width = img.width;
            let height = img.height;
            const maxSize = parseInt(sizeRange.value);
            if (width > maxSize || height > maxSize) {
                if (width > height) {
                    height = Math.round(height * maxSize / width);
                    width = maxSize;
                } else {
                    width = Math.round(width * maxSize / height);
                    height = maxSize;
                }
            }
            
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            
            // 加白边黑字表情包文字
            const fontSize = Math.floor(width / 8);
            ctx.font = `bold ${fontSize}px "Microsoft YaHei", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.strokeStyle = 'white';
            ctx.lineWidth = fontSize / 8;
            ctx.fillStyle = 'black';
            ctx.strokeText(text, width / 2, height - 10);
            ctx.fillText(text, width / 2, height - 10);
            
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));
            currentCompressedBlob = blob;
            compressedImg.src = URL.createObjectURL(blob);
            compressedInfo.textContent = `AI加字版 · ${formatSize(blob.size)} · ${width}×${height}`;
            
            // 加入处理结果
            processedFiles.unshift({
                blob,
                width,
                height,
                name: 'AI表情包_' + text + '.jpg'
            });
            downloadBtn.disabled = false;
            updateResultList();
            // ==========================================

            aiModal.classList.remove('show');
            confirmAiBtn.disabled = false;
            confirmAiBtn.textContent = '生成';
            aiTextInput.value = '';
        });

        // ========== 辅助函数 ==========
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + 'B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
            return (bytes / 1024 / 1024).toFixed(2) + 'MB';
        }

        function updateResultList() {
            if (processedFiles.length <= 1) {
                resultList.classList.remove('show');
                return;
            }
            resultList.classList.add('show');
            resultList.innerHTML = '';
            processedFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = `
                    <span class="result-item-name">${file.name}</span>
                    <span class="result-item-size">${formatSize(file.blob.size)}</span>
                `;
                resultList.appendChild(item);
            });
        }

        // 点击弹窗外部关闭
        aiModal.addEventListener('click', (e) => {
            if (e.target === aiModal) {
                aiModal.classList.remove('show');
            }
        });
    </script>
</body>
</html>
