<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>津贴小帮手</title>
  <style>
    :root {
      --bg-primary: #f8f9fa;
      --bg-card: #ffffff;
      --text-primary: #2d3748;
      --text-secondary: #4a5568;
      --accent: #e57326;
      --border: #e2e8f0;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --radius: 12px;
      --transition: all 0.25s ease;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .dark-theme {
      --bg-primary: #1a202c;
      --bg-card: #2d3748;
      --text-primary: #e2e8f0;
      --text-secondary: #a0aec0;
      --border: #4a5568;
      --accent: #f6ad55;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
      padding-top: 12px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 24px;
      transition: var(--transition);
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-primary);
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg-card);
      color: var(--text-primary);
      transition: var(--transition);
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(229, 115, 38, 0.15);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: var(--transition);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    button:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .status-eligible {
      background: #48bb78;
      color: white;
    }

    .status-not-eligible {
      background: #e53e3e;
      color: white;
    }

    .status-pending {
      background: #ed8936;
      color: white;
    }

    .policy-info {
      margin-top: 16px;
      padding: 16px;
      background: rgba(229, 115, 38, 0.08);
      border-radius: 8px;
      border-left: 4px solid var(--accent);
    }

    .policy-info h3 {
      font-size: 1rem;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .policy-info p {
      font-size: 0.95rem;
      margin: 4px 0;
      color: var(--text-secondary);
    }

    .countdown {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      text-align: center;
      margin: 16px 0;
      min-height: 2.2em;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: var(--transition);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--text-primary);
    }

    footer {
      text-align: center;
      margin-top: 32px;
      padding: 20px 0;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      margin-bottom: 16px;
    }

    /* 响应式 */
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .card {
        padding: 20px 16px;
      }
      .subtitle {
        font-size: 0.95rem;
      }
      input, button {
        padding: 12px;
      }
      .countdown {
        font-size: 1.2rem;
      }
    }

    /* 动画支持 */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .pulse {
      animation: pulse 2s infinite;
    }

    /* 打印友好 */
    @media print {
      .theme-toggle, footer {
        display: none;
      }
      body {
        background: white;
      }
    }
  </style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle" title="切换深色/浅色模式">
    <svg viewBox="0 0 24 24">
      <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H15a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM12 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/>
    </svg>
  </div>

  <div class="container">
    <header>
      <h1>津贴小帮手</h1>
      <p class="subtitle">帮老人三步查清：我有没有？怎么领？到没到？</p>
    </header>

    <main>
      <section class="card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zM12 21a9 9 0 100-18 9 9 0 000 18z"/><path d="M12 9a3.75 3.75 0 100 7.5 3.75 3.75 0 000-7.5z"/></svg>
          查 eligibility（资格）
        </h2>
        <div class="input-group">
          <label for="idCard">请输入老人身份证号</label>
          <input type="text" id="idCard" placeholder="例如：110101194305121234" maxlength="18">
        </div>
        <button id="checkBtn">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          开始查询
        </button>

        <div class="result-section" id="resultSection" style="display:none;">
          <div class="status-badge status-eligible" id="statusBadge">✅ 符合申领条件</div>
          <p id="ageInfo">老人今年82岁，已满北京市80周岁发放标准。</p>
          <div class="policy-info">
            <h3>📌 您所在城市政策</h3>
            <p><strong>北京市：</strong>80周岁及以上户籍老人，每月发放100元</p>
            <p><strong>申领方式：</strong>街道政务服务中心现场办理 或 “北京通”APP线上申请</p>
          </div>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zM12 21a9 9 0 100-18 9 9 0 000 18z"/><path d="M12 9a3.75 3.75 0 100 7.5 3.75 3.75 0 000-7.5z"/></svg>
          设认证提醒
        </h2>
        <p>高龄津贴需每年完成一次人脸识别认证（通常365天周期），错过将暂停发放。</p>
        <button id="reminderBtn">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zM12 21a9 9 0 100-18 9 9 0 000 18z"/><path d="M12 9a3.75 3.75 0 100 7.5 3.75 3.75 0 000-7.5z"/></svg>
          开启年度认证提醒
        </button>
        <div class="result-section" id="reminderSection" style="display:none;">
          <p>下次认证截止日：<strong id="dueDate">2025年06月15日</strong></p>
          <div class="countdown" id="countdown">剩余 127 天</div>
        </div>
      </section>
    </main>

    <footer>
      <p>本工具依据公开政策整理，具体以当地民政部门最新规定为准</p>
    </footer>
  </div>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      html.classList.add('dark-theme');
    }

    themeToggle.addEventListener('click', () => {
      html.classList.toggle('dark-theme');
      const isDark = html.classList.contains('dark-theme');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // 政策数据库（模拟10个城市）
    const cityPolicies = {
      '北京': { age: 80, amount: '100元/月', method: '北京通APP或街道现场' },
      '上海': { age: 85, amount: '150元/月', method: '随申办APP或社区受理点' },
      '广州': { age: 80, amount: '100元/月', method: '穗智管APP或街道窗口' },
      '杭州': { age: 80, amount: '150元/月', method: '浙里办APP' },
      '南京': { age: 80, amount: '100元/月', method: '我的南京APP' },
      '济南': { age: 80, amount: '100元/月', method: '爱山东APP' },
      '成都': { age: 80, amount: '100元/月', method: '天府市民云APP' },
      '西安': { age: 80, amount: '50元/月', method: '西安市民APP' },
      '沈阳': { age: 80, amount: '100元/月', method: '辽事通APP' },
      '厦门': { age: 80, amount: '100元/月', method: 'e福州APP' }
    };

    // 随机选一个城市作为“当前城市”（实际中可由IP或手动选择）
    const cities = Object.keys(cityPolicies);
    const currentCity = cities[Math.floor(Math.random() * cities.length)];
    const policy = cityPolicies[currentCity];

    // 查询按钮逻辑
    const idCardInput = document.getElementById('idCard');
    const checkBtn = document.getElementById('checkBtn');
    const resultSection = document.getElementById('resultSection');
    const statusBadge = document.getElementById('statusBadge');
    const ageInfo = document.getElementById('ageInfo');
    const policyInfo = document.querySelector('.policy-info');

    checkBtn.addEventListener('click', () => {
      const id = idCardInput.value.trim();
      if (!id || id.length !== 18) {
        alert('请完整输入18位身份证号');
        return;
      }

      // 提取出生年份（第7-10位）
      const year = parseInt(id.substring(6, 10), 10);
      const now = new Date().getFullYear();
      const age = now - year;

      const isEligible = age >= policy.age;

      statusBadge.textContent = isEligible 
        ? '✅ 符合申领条件' 
        : '⚠️ 暂未达到发放年龄';
      statusBadge.className = 'status-badge ' + (isEligible ? 'status-eligible' : 'status-not-eligible');

      ageInfo.textContent = `老人今年${age}岁，已满${currentCity}${policy.age}周岁发放标准。`;

      policyInfo.innerHTML = `
        <h3>📌 您所在城市政策</h3>
        <p><strong>${currentCity}：</strong>${policy.age}周岁及以上户籍老人，每月发放${policy.amount}</p>
        <p><strong>申领方式：</strong>${policy.method}</p>
      `;

      resultSection.style.display = 'block';
    });

    // 认证提醒按钮逻辑
    const reminderBtn = document.getElementById('reminderBtn');
    const reminderSection = document.getElementById('reminderSection');
    const dueDateEl = document.getElementById('dueDate');
    const countdownEl = document.getElementById('countdown');

    reminderBtn.addEventListener('click', () => {
      // 模拟下次认证日：当前日期 + 365天
      const today = new Date();
      const dueDate = new Date(today);
      dueDate.setDate(dueDate.getDate() + 365);

      const year = dueDate.getFullYear();
      const month = String(dueDate.getMonth() + 1).padStart(2, '0');
      const day = String(dueDate.getDate()).padStart(2, '0');
      dueDateEl.textContent = `${year}年${month}月${day}日`;

      // 计算剩余天数
      const diffTime = dueDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      countdownEl.textContent = `剩余 ${diffDays} 天`;
      countdownEl.className = 'countdown pulse';

      reminderSection.style.display = 'block';

      // 停止脉冲动画 5秒后
      setTimeout(() => {
        countdownEl.classList.remove('pulse');
      }, 5000);
    });
  </script>
</body>
</html>
