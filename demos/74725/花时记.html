<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>花时记</title>
  <style>
    :root {
      /* 浅色主题 */
      --bg-primary: #f9fbfa;
      --bg-card: #ffffff;
      --text-primary: #2d3748;
      --text-secondary: #6a7d92;
      --accent: #4caf50;
      --accent-light: #e8f5e9;
      --border: #e2e8f0;
      --shadow: 0 2px 8px rgba(0,0,0,0.05);
      --radius: 14px;
      --transition: all 0.25s ease;
    }

    .dark-theme {
      --bg-primary: #1a1f25;
      --bg-card: #252c34;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --accent: #4caf50;
      --accent-light: #0d2b14;
      --border: #334152;
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      transition: var(--transition);
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo::before {
      content: "🌱";
      font-size: 1.4rem;
    }

    .theme-toggle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      background: var(--accent-light);
      border-color: var(--accent);
    }

    .theme-toggle::before {
      content: "☀️";
      font-size: 1.2rem;
    }

    .dark-theme .theme-toggle::before {
      content: "🌙";
    }

    /* Section Title */
    .section-title {
      font-size: 1.375rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 20px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* Add Plant Button */
    .add-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 24px;
    }

    .add-btn:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .add-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Form (hidden by default) */
    .add-form {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-row {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    select, input[type="text"], input[type="range"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 1rem;
      transition: var(--transition);
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
    }

    .range-value {
      font-size: 0.875rem;
      color: var(--text-secondary);
      text-align: right;
      margin-top: 4px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .btn-cancel, .btn-submit {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-cancel {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-cancel:hover:not(:disabled) {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .btn-submit {
      background: var(--accent);
      color: white;
    }

    .btn-submit:hover:not(:disabled) {
      opacity: 0.9;
    }

    /* Plants List */
    .plants-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .plant-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
      position: relative;
    }

    .plant-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    .plant-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .plant-name {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .plant-type {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .plant-actions {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .plant-actions:hover {
      background: var(--accent);
    }

    .plant-actions::before {
      content: "📅";
      font-size: 1rem;
    }

    .plant-body {
      padding: 16px;
    }

    .task-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 0.95rem;
    }

    .task-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .task-label {
      color: var(--text-secondary);
    }

    .task-due {
      font-weight: 600;
      color: var(--accent);
    }

    .task-countdown {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-top: 4px;
      display: block;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }

    .empty-state::before {
      content: "🌿";
      font-size: 3rem;
      display: block;
      margin-bottom: 16px;
      line-height: 1;
    }

    .empty-state p {
      margin-top: 8px;
      font-size: 0.95rem;
    }

    /* Footer Nav (mobile-first bottom bar) */
    .footer-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.05);
      z-index: 10;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-secondary);
      font-size: 0.75rem;
      text-decoration: none;
      transition: var(--transition);
      width: 60px;
      padding: 4px 0;
    }

    .nav-item.active, .nav-item:hover {
      color: var(--accent);
    }

    .nav-item::before {
      content: attr(data-icon);
      display: block;
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      header {
        padding: 12px 0;
      }

      .section-title {
        font-size: 1.25rem;
      }

      .plants-grid {
        grid-template-columns: 1fr;
      }

      .footer-nav {
        padding: 10px 0;
      }
    }

    @media (min-width: 601px) {
      .footer-nav {
        display: none;
      }
    }

    /* Print & Accessibility */
    @media print {
      .footer-nav, .theme-toggle {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">花时记</div>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题"></button>
    </header>

    <main>
      <h2 class="section-title">我的植物</h2>

      <button class="add-btn" id="showAddForm">
        <span>➕ 添加一盆</span>
      </button>

      <div class="add-form" id="addForm">
        <div class="form-row">
          <label for="plantSpecies">植物种类</label>
          <select id="plantSpecies">
            <option value="绿萝">绿萝</option>
            <option value="多肉">多肉</option>
            <option value="茉莉">茉莉</option>
            <option value="吊兰">吊兰</option>
            <option value="栀子">栀子</option>
            <option value="薄荷">薄荷</option>
          </select>
        </div>

        <div class="form-row">
          <label for="plantName">给它起个名字</label>
          <input type="text" id="plantName" placeholder="比如：阳台小绿、窗台胖胖" value="我的绿萝" />
        </div>

        <div class="form-row">
          <label for="taskType">首次养护任务</label>
          <select id="taskType">
            <option value="浇水">浇水</option>
            <option value="施肥">施肥</option>
            <option value="修剪">修剪</option>
          </select>
        </div>

        <div class="form-row">
          <label for="cycleDays">下次提醒间隔</label>
          <input type="range" id="cycleDays" min="7" max="30" value="14" />
          <div class="range-value"><span id="cycleValue">14</span> 天</div>
        </div>

        <div class="btn-group">
          <button class="btn-cancel" id="cancelAdd">取消</button>
          <button class="btn-submit" id="submitAdd">确认添加</button>
        </div>
      </div>

      <div class="plants-grid" id="plantsList">
        <!-- Plants will be inserted here -->
      </div>
    </main>
  </div>

  <nav class="footer-nav">
    <a href="#" class="nav-item active" data-icon="🏠">首页</a>
    <a href="#" class="nav-item" data-icon="📅">日历</a>
    <a href="#" class="nav-item" data-icon="📊">统计</a>
    <a href="#" class="nav-item" data-icon="⚙️">我</a>
  </nav>

  <script>
    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    const root = document.documentElement;

    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.body.classList.add('dark-theme');
    }

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-theme');
      localStorage.setItem('theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
    });

    // Load saved theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-theme');
    } else if (savedTheme === 'light') {
      document.body.classList.remove('dark-theme');
    }

    // Add form toggle
    const showAddFormBtn = document.getElementById('showAddForm');
    const addForm = document.getElementById('addForm');
    const cancelAddBtn = document.getElementById('cancelAdd');
    const submitAddBtn = document.getElementById('submitAdd');
    const cycleSlider = document.getElementById('cycleDays');
    const cycleValue = document.getElementById('cycleValue');

    cycleSlider.addEventListener('input', () => {
      cycleValue.textContent = cycleSlider.value;
    });

    showAddFormBtn.addEventListener('click', () => {
      addForm.style.display = 'block';
      document.getElementById('plantName').focus();
    });

    cancelAddBtn.addEventListener('click', () => {
      addForm.style.display = 'none';
    });

    submitAddBtn.addEventListener('click', () => {
      const species = document.getElementById('plantSpecies').value;
      const name = document.getElementById('plantName').value.trim() || species;
      const task = document.getElementById('taskType').value;
      const days = parseInt(document.getElementById('cycleDays').value);

      if (!name) return;

      const now = new Date();
      const nextDate = new Date(now);
      nextDate.setDate(now.getDate() + days);

      const formattedNext = nextDate.toLocaleDateString('zh-CN', {
        month: 'short',
        day: 'numeric'
      });

      const plantCard = `
        <div class="plant-card" data-id="${Date.now()}">
          <div class="plant-header">
            <div>
              <div class="plant-name">${name}</div>
              <div class="plant-type">${species}</div>
            </div>
            <div class="plant-actions" onclick="toggleTaskView(this)"></div>
          </div>
          <div class="plant-body">
            <div class="task-item">
              <span class="task-label">${task}</span>
              <span class="task-due">${formattedNext}</span>
            </div>
            <span class="task-countdown">距下次${task}还剩 ${days} 天</span>
          </div>
        </div>
      `;

      document.getElementById('plantsList').insertAdjacentHTML('afterbegin', plantCard);
      addForm.style.display = 'none';

      // Reset form
      document.getElementById('plantName').value = '';
      document.getElementById('cycleDays').value = '14';
      cycleValue.textContent = '14';
    });

    // Toggle task preview (mock calendar view)
    window.toggleTaskView = function(el) {
      const card = el.closest('.plant-card');
      const body = card.querySelector('.plant-body');
      const taskItem = body.querySelector('.task-item');
      const countdown = body.querySelector('.task-countdown');

      // Show next 3 dates
      const now = new Date();
      const dates = [];
      for (let i = 1; i <= 3; i++) {
        const d = new Date(now);
        d.setDate(now.getDate() + i * 14); // assume 14-day cycle
        dates.push(d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }));
      }

      if (body.dataset.view === 'expanded') {
        body.innerHTML = `
          <div class="task-item">
            <span class="task-label">${taskItem.querySelector('.task-label').textContent}</span>
            <span class="task-due">${taskItem.querySelector('.task-due').textContent}</span>
          </div>
          <span class="task-countdown">${countdown.textContent}</span>
        `;
        body.dataset.view = 'collapsed';
      } else {
        body.innerHTML = `
          <div class="task-item">
            <span class="task-label">下次${taskItem.querySelector('.task-label').textContent}</span>
            <span class="task-due">${dates[0]}</span>
          </div>
          <div class="task-item">
            <span class="task-label">再下次</span>
            <span class="task-due">${dates[1]}</span>
          </div>
          <div class="task-item">
            <span class="task-label">再再下次</span>
            <span class="task-due">${dates[2]}</span>
          </div>
        `;
        body.dataset.view = 'expanded';
      }
    };

    // Initialize with one demo plant
    document.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      const next = new Date(now);
      next.setDate(now.getDate() + 14);
      const formatted = next.toLocaleDateString('zh-CN', {
        month: 'short',
        day: 'numeric'
      });

      document.getElementById('plantsList').innerHTML = `
        <div class="plant-card" data-id="1">
          <div class="plant-header">
            <div>
              <div class="plant-name">阳台小绿</div>
              <div class="plant-type">绿萝</div>
            </div>
            <div class="plant-actions" onclick="toggleTaskView(this)"></div>
          </div>
          <div class="plant-body">
            <div class="task-item">
              <span class="task-label">浇水</span>
              <span class="task-due">${formatted}</span>
            </div>
            <span class="task-countdown">距下次浇水还剩 14 天</span>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
