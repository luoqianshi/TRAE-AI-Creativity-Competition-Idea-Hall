<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI多Agent协作项目管理系统 - 架构图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; overflow-x: auto; }
        .container { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 30px; max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; color: #333; font-size: 28px; margin-bottom: 30px; font-weight: 600; }
        .diagram { display: flex; justify-content: space-between; position: relative; padding: 20px; min-height: 700px; }
        .layer { display: flex; flex-direction: column; gap: 15px; }
        .layer-title { text-align: center; font-weight: 600; font-size: 16px; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .layer-execution .layer-title { background: #dae8fc; color: #6c8ebf; }
        .layer-management .layer-title { background: #fff2cc; color: #d6b656; }
        .layer-pm .layer-title { background: #d5e8d4; color: #82b366; }
        .agent-card { background: #dae8fc; border: 2px solid #6c8ebf; border-radius: 12px; padding: 16px 20px; cursor: pointer; transition: all 0.3s ease; text-align: center; font-weight: 600; color: #333; min-width: 180px; }
        .agent-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(108,142,191,0.4); border-color: #4a6fa5; }
        .agent-card.active { background: #6c8ebf; color: white; box-shadow: 0 8px 20px rgba(108,142,191,0.5); }
        .agent-card.management { background: #fff2cc; border-color: #d6b656; }
        .agent-card.management:hover { border-color: #b8960a; box-shadow: 0 8px 20px rgba(214,182,86,0.4); }
        .agent-card.management.active { background: #d6b656; color: white; }
        .agent-card.pm { background: #d5e8d4; border-color: #82b366; min-width: 150px; font-size: 18px; padding: 20px; }
        .agent-card.pm:hover { border-color: #5a8a48; box-shadow: 0 8px 20px rgba(130,179,102,0.4); }
        .agent-card.pm.active { background: #82b366; color: white; }
        .management-container { background: #fff2cc; border: 2px dashed #d6b656; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 15px; min-height: 400px; justify-content: center; }
        .info-panel { background: #f8f9fa; border-radius: 12px; padding: 20px; margin-top: 30px; display: none; }
        .info-panel.active { display: block; }
        .info-panel h3 { color: #333; margin-bottom: 15px; font-size: 18px; }
        .info-panel p { color: #666; line-height: 1.8; margin-bottom: 10px; }
        .info-panel ul { padding-left: 20px; color: #666; }
        .info-panel li { margin-bottom: 8px; }
        .legend { display: flex; justify-content: center; gap: 30px; margin-top: 20px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .legend-color { width: 20px; height: 20px; border-radius: 4px; }
        .legend-color.execution { background: #dae8fc; border: 2px solid #6c8ebf; }
        .legend-color.management { background: #fff2cc; border: 2px solid #d6b656; }
        .legend-color.pm { background: #d5e8d4; border: 2px solid #82b366; }
        .nav-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .nav-btn { padding: 10px 25px; border: none; border-radius: 25px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; }
        .nav-btn.execution { background: #dae8fc; color: #6c8ebf; }
        .nav-btn.execution:hover { background: #6c8ebf; color: white; }
        .nav-btn.management { background: #fff2cc; color: #d6b656; }
        .nav-btn.management:hover { background: #d6b656; color: white; }
        .nav-btn.pm { background: #d5e8d4; color: #82b366; }
        .nav-btn.pm:hover { background: #82b366; color: white; }
        @media (max-width: 1200px) { .diagram { flex-direction: column; align-items: center; gap: 30px; } .layer { flex-direction: row; flex-wrap: wrap; justify-content: center; } .management-container { width: 100%; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI多Agent协作项目管理系统</h1>
        <div class="legend">
            <div class="legend-item"><div class="legend-color execution"></div><span>执行层 Agent</span></div>
            <div class="legend-item"><div class="legend-color management"></div><span>管理层 Agent</span></div>
            <div class="legend-item"><div class="legend-color pm"></div><span>项目经理</span></div>
        </div>
        <div class="diagram">
            <div class="layer layer-execution">
                <div class="layer-title">执行层</div>
                <div class="agent-card" data-agent="project-stakeholder">项目相关方Agent</div>
                <div class="agent-card" data-agent="customer-demand">客户需求Agent</div>
                <div class="agent-card" data-agent="manufacturer">制造商Agent</div>
                <div class="agent-card" data-agent="manufacturer-business">制造商业务Agent</div>
                <div class="agent-card" data-agent="mechanical-design">机械设计Agent</div>
                <div class="agent-card" data-agent="programming">编程Agent</div>
                <div class="agent-card" data-agent="procurement">采购Agent</div>
                <div class="agent-card" data-agent="warehouse">仓库Agent</div>
                <div class="agent-card" data-agent="production">生产Agent</div>
                <div class="agent-card" data-agent="after-sales">售后Agent</div>
            </div>
            <div class="layer layer-management">
                <div class="layer-title">管理层</div>
                <div class="management-container">
                    <div class="agent-card management" data-agent="project-assistant">项目助手Agent</div>
                    <div class="agent-card management" data-agent="project-change">项目变更Agent</div>
                    <div class="agent-card management" data-agent="project-risk">项目风险Agent</div>
                </div>
            </div>
            <div class="layer layer-pm">
                <div class="layer-title">决策层</div>
                <div class="agent-card pm" data-agent="project-manager">项目经理</div>
            </div>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn execution" data-filter="execution">执行层</button>
            <button class="nav-btn management" data-filter="management">管理层</button>
            <button class="nav-btn pm" data-filter="pm">项目经理</button>
            <button class="nav-btn execution" data-filter="all">全部显示</button>
        </div>
        <div class="info-panel" id="info-panel">
            <h3 id="info-title">Agent信息</h3>
            <div id="info-content"><p>点击左侧Agent卡片查看详细信息</p></div>
        </div>
    </div>
    <script>
        const agentInfo = {
            'project-stakeholder': { name: '项目相关方Agent', role: '信息收集与协调', responsibilities: ['收集项目相关方信息', '维护相关方关系', '协调各方利益', '反馈相关方需求'] },
            'customer-demand': { name: '客户需求Agent', role: '需求管理', responsibilities: ['收集客户需求信息', '理解客户业务场景', '整理需求文档', '需求变更管理'] },
            'manufacturer': { name: '制造商Agent', role: '制造能力评估', responsibilities: ['提供设备制造能力评估', '工艺可行性分析', '制造周期预估', '制造成本核算'] },
            'manufacturer-business': { name: '制造商业务Agent', role: '商务谈判支持', responsibilities: ['商务谈判支持', '合同条款审查', '交付条款确认', '售后服务承诺'] },
            'mechanical-design': { name: '机械设计Agent', role: '机械结构设计', responsibilities: ['机械结构设计', '3D建模与装配', '图纸绘制与审核', '材料选型与强度计算'] },
            'programming': { name: '编程Agent', role: 'PLC程序开发', responsibilities: ['梯形图/ST/SCL代码生成', '程序结构设计', '代码审查与优化', '故障诊断'] },
            'procurement': { name: '采购Agent', role: '物料采购', responsibilities: ['物料采购计划制定', '供应商选择与询价', '采购订单管理', '到货跟踪与验收'] },
            'warehouse': { name: '仓库Agent', role: '库存管理', responsibilities: ['物料入库管理', '库存盘点与管理', '物料出库管理', '库存预警'] },
            'production': { name: '生产Agent', role: '生产执行', responsibilities: ['生产计划执行', '生产进度跟踪', '生产报工管理', '质量检验记录'] },
            'after-sales': { name: '售后Agent', role: '售后服务', responsibilities: ['故障代码查询', '维修指导', '备件推荐', '历史故障分析'] },
            'project-assistant': { name: '项目助手Agent', role: '信息收集与监控', responsibilities: ['微信群信息收集与整理', '异常信息实时监控', '工作计划与进度跟踪', '定时提醒与报告'] },
            'project-change': { name: '项目变更Agent', role: '变更管理', responsibilities: ['变更请求处理', '变更影响评估', '变更审批流程', '变更实施跟踪'] },
            'project-risk': { name: '项目风险Agent', role: '风险管控', responsibilities: ['风险识别与评估', '风险预警监控', '风险应对方案制定', '风险跟踪与控制'] },
            'project-manager': { name: '项目经理', role: '项目总负责人', responsibilities: ['进度跟进与里程碑管理', '资源调度与协调', '成本管控与预算管理', '质量管控与验收', '风险管控与应对', '交付管控与文档管理'] }
        };
        const cards = document.querySelectorAll('.agent-card');
        const infoPanel = document.getElementById('info-panel');
        const infoTitle = document.getElementById('info-title');
        const infoContent = document.getElementById('info-content');
        const navButtons = document.querySelectorAll('.nav-btn');
        cards.forEach(card => {
            card.addEventListener('click', () => {
                cards.forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                const agentId = card.dataset.agent;
                const info = agentInfo[agentId];
                infoTitle.textContent = info.name;
                infoContent.innerHTML = `<p><strong>角色：</strong>${info.role}</p><p><strong>职责：</strong></p><ul>${info.responsibilities.map(r => `<li>${r}</li>`).join('')}</ul>`;
                infoPanel.classList.add('active');
            });
        });
        navButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const filter = btn.dataset.filter;
                cards.forEach(card => {
                    if (filter === 'all') card.style.display = 'block';
                    else if (filter === 'execution' && !card.classList.contains('management') && !card.classList.contains('pm')) card.style.display = 'block';
                    else if (filter === 'management' && card.classList.contains('management')) card.style.display = 'block';
                    else if (filter === 'pm' && card.classList.contains('pm')) card.style.display = 'block';
                    else card.style.display = 'none';
                });
            });
        });
    </script>
</body>
</html>
