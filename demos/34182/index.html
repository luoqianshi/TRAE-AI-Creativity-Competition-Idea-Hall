<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我曾听闻 · 文言文生成器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    
    <style>
        /* ==================== 主题变量 ==================== */
        :root {
            --color-ink: #2C2C2C;
            --color-ink-light: #4A4A4A;
            --color-paper: #F5F0E6;
            --color-paper-dark: #E8E0D0;
            --color-vermilion: #C41E3A;
            --color-vermilion-light: #E63946;
            --color-gold: #B8860B;
            --color-gold-light: #DAA520;
            --color-jade: #2E8B57;
            --color-indigo: #3F51B5;
            --color-cyan: #008B8B;
            --color-annotation: #8B4513;
            --text-primary: var(--color-ink);
            --text-secondary: var(--color-ink-light);
            --text-light: #666666;
            --bg-main: var(--color-paper);
            --bg-card: rgba(255, 255, 255, 0.9);
            --bg-hover: rgba(0, 0, 0, 0.05);
            --border-color: rgba(44, 44, 44, 0.15);
            --border-accent: var(--color-vermilion);
            --shadow-soft: 0 8px 32px rgba(44, 44, 44, 0.1);
            --shadow-paper: 0 4px 16px rgba(44, 44, 44, 0.08);
            --shadow-glow: 0 0 20px rgba(196, 30, 58, 0.2);
            --font-title: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
            --font-body: 'Noto Serif SC', serif;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-xxl: 48px;
            --radius-sm: 2px;
            --radius-md: 4px;
            --radius-lg: 8px;
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
        }

        /* ==================== 全局样式 ==================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.8;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            position: relative;
            min-height: 100vh;
            padding: var(--spacing-xl);
        }

        /* ==================== 背景装饰层 ==================== */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(245, 240, 230, 1) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(232, 224, 208, 1) 0%, transparent 50%),
                linear-gradient(180deg, #F5F0E6 0%, #EDE5D5 50%, #F5F0E6 100%);
        }

        .paper-texture {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            opacity: 0.8;
        }

        .ink-splash {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(44, 44, 44, 0.05) 0%, transparent 70%);
            animation: inkFloat 25s ease-in-out infinite;
        }
        .splash-1 { width: 800px; height: 800px; top: -300px; right: -200px; }
        .splash-2 { width: 600px; height: 600px; bottom: -200px; left: -200px; }
        .splash-3 { width: 500px; height: 500px; top: 40%; left: 55%; }
        .splash-4 { width: 400px; height: 400px; top: 15%; left: -100px; }

        .mountain-silhouette {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 350px;
            background: linear-gradient(to top, rgba(44, 44, 44, 0.04), transparent);
            mask-image: url("data:image/svg+xml,%3Csvg width='1440' height='350' viewBox='0 0 1440 350' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,350 L0,250 Q180,200 360,230 T720,210 T1080,240 T1440,220 L1440,350 Z' fill='black'/%3E%3C/svg%3E");
            mask-size: cover;
        }

        .cloud {
            position: absolute;
            width: 400px; height: 150px;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(30px);
            animation: cloudDrift 35s ease-in-out infinite;
        }
        .cloud-1 { top: 8%; left: -150px; }
        .cloud-2 { top: 20%; right: -200px; animation-delay: -12s; width: 500px; }
        .cloud-3 { top: 55%; left: -250px; animation-delay: -24s; width: 600px; }

        .falling-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .falling-item {
            position: absolute;
            width: 8px; height: 8px;
            background: radial-gradient(circle, rgba(196, 30, 58, 0.25) 0%, rgba(196, 30, 58, 0.08) 100%);
            border-radius: 50%;
            animation: fall 20s linear infinite;
        }
        .falling-item:nth-child(1) { left: 6%; animation-delay: 0s; }
        .falling-item:nth-child(2) { left: 16%; animation-delay: 5s; }
        .falling-item:nth-child(3) { left: 28%; animation-delay: 10s; }
        .falling-item:nth-child(4) { left: 42%; animation-delay: 2s; }
        .falling-item:nth-child(5) { left: 56%; animation-delay: 8s; }
        .falling-item:nth-child(6) { left: 70%; animation-delay: 12s; }
        .falling-item:nth-child(7) { left: 82%; animation-delay: 6s; }
        .falling-item:nth-child(8) { left: 94%; animation-delay: 4s; }

        /* ==================== 主内容区 ==================== */
        .main-content {
            position: relative;
            z-index: 1;
            max-width: 950px;
            margin: 0 auto;
        }

        /* ==================== 标题区 ==================== */
        .header {
            text-align: center;
            margin-bottom: var(--spacing-xxl);
            animation: fadeInDown 1s ease;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            width: 250px; height: 3px;
            background: linear-gradient(90deg, transparent, var(--color-vermilion), transparent);
            opacity: 0.6;
        }

        .seal {
            width: 80px; height: 80px;
            background: linear-gradient(145deg, var(--color-vermilion), #A01830);
            color: white;
            font-family: var(--font-title);
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--spacing-lg);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-soft), inset 0 3px 6px rgba(255, 255, 255, 0.25);
            transform: rotate(-5deg);
            animation: sealStamp 0.8s ease-out;
            position: relative;
        }

        .seal::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--radius-sm);
        }

        .title {
            font-family: var(--font-title);
            font-size: 3.8rem;
            color: var(--color-ink);
            margin-bottom: var(--spacing-md);
            letter-spacing: 16px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.08);
        }

        .title::after {
            content: '';
            display: block;
            width: 120px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--color-gold), transparent);
            margin: var(--spacing-md) auto 0;
        }

        .subtitle {
            font-family: var(--font-body);
            font-size: 1.1rem;
            color: var(--text-light);
            letter-spacing: 8px;
            margin-top: var(--spacing-md);
        }

        /* ==================== 区域通用样式 ==================== */
        section { margin-bottom: var(--spacing-xl); }

        .section-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            position: relative;
        }

        .section-header::after {
            content: '';
            flex: 1; height: 1px;
            background: linear-gradient(90deg, var(--border-color), transparent);
        }

        .section-header h2 {
            font-family: var(--font-title);
            font-size: 1.5rem;
            color: var(--color-vermilion);
            letter-spacing: 6px;
            position: relative;
        }

        .section-header h2::before {
            content: '';
            position: absolute;
            left: -15px; top: 50%;
            transform: translateY(-50%);
            width: 4px; height: 70%;
            background: var(--color-vermilion);
            border-radius: 2px;
        }

        .hint {
            font-size: 0.9rem;
            color: var(--text-light);
            letter-spacing: 1px;
        }

        /* ==================== 输入区 ==================== */
        .input-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-paper);
            animation: fadeInUp 0.8s ease 0.1s backwards;
            position: relative;
            backdrop-filter: blur(15px);
        }

        .input-section::before,
        .input-section::after {
            content: '';
            position: absolute;
            width: 40px; height: 40px;
            border-color: var(--color-vermilion);
            border-style: solid;
            opacity: 0.4;
        }
        .input-section::before { top: 12px; left: 12px; border-width: 3px 0 0 3px; }
        .input-section::after { bottom: 12px; right: 12px; border-width: 0 3px 3px 0; }

        .text-input {
            width: 100%;
            min-height: 150px;
            padding: var(--spacing-xl);
            border: 1px solid rgba(44, 44, 44, 0.1);
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.95);
            font-family: var(--font-body);
            font-size: 1.15rem;
            line-height: 2.2;
            color: var(--color-ink);
            resize: vertical;
            transition: all var(--transition-normal);
        }

        .text-input:focus {
            outline: none;
            border-color: var(--color-vermilion);
            box-shadow: 0 0 0 4px rgba(196, 30, 58, 0.1);
        }

        .text-input::placeholder { color: var(--text-light); letter-spacing: 2px; }

        .input-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: var(--spacing-md);
            gap: var(--spacing-md);
        }

        .char-count {
            font-size: 0.9rem;
            color: var(--text-light);
            padding: var(--spacing-xs) var(--spacing-md);
            background: rgba(0, 0, 0, 0.03);
            border-radius: var(--radius-sm);
        }

        /* ==================== 风格选择 ==================== */
        .style-section { animation: fadeInUp 0.8s ease 0.2s backwards; }

        .style-section h3 {
            font-family: var(--font-title);
            font-size: 1.2rem;
            margin-bottom: var(--spacing-lg);
            color: var(--color-ink);
            letter-spacing: 4px;
        }

        .style-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--spacing-xl);
        }

        .style-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--spacing-xl) var(--spacing-lg);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all var(--transition-normal);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(15px);
        }

        .style-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(196, 30, 58, 0.12), transparent);
            transition: left 0.6s ease;
        }

        .style-btn:hover::before { left: 100%; }

        .style-btn:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: var(--shadow-soft);
            border-color: rgba(196, 30, 58, 0.4);
        }

        .style-btn.active {
            border-color: var(--color-vermilion);
            background: linear-gradient(145deg, rgba(196, 30, 58, 0.1), rgba(196, 30, 58, 0.04));
            box-shadow: var(--shadow-glow);
        }

        .style-icon {
            width: 64px; height: 64px;
            background: linear-gradient(145deg, var(--color-vermilion), #A01830);
            color: white;
            font-family: var(--font-title);
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-md);
            box-shadow: 0 6px 16px rgba(196, 30, 58, 0.35);
            transition: all var(--transition-normal);
        }

        .style-btn:hover .style-icon {
            transform: scale(1.15) rotate(6deg);
        }

        .style-btn.active .style-icon {
            background: linear-gradient(145deg, var(--color-gold), var(--color-gold-light));
        }

        .style-name {
            font-family: var(--font-title);
            font-size: 1.2rem;
            color: var(--color-ink);
            margin-bottom: var(--spacing-xs);
            letter-spacing: 3px;
        }

        .style-desc { font-size: 0.85rem; color: var(--text-light); }

        /* ==================== 生成按钮 ==================== */
        .convert-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-lg);
            width: 100%;
            padding: var(--spacing-xl) var(--spacing-lg);
            background: linear-gradient(145deg, var(--color-vermilion), #A01830);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-family: var(--font-title);
            font-size: 1.5rem;
            letter-spacing: 10px;
            cursor: pointer;
            transition: all var(--transition-normal);
            box-shadow: 0 8px 24px rgba(196, 30, 58, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.2);
            animation: fadeInUp 0.8s ease 0.3s backwards;
            position: relative;
            overflow: hidden;
        }

        .convert-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: left 0.6s ease;
        }

        .convert-btn:hover::before { left: 100%; }
        .convert-btn:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(196, 30, 58, 0.5); }

        .btn-icon { animation: pulse-icon 2s ease-in-out infinite; }

        /* ==================== 输出区 ==================== */
        .output-section {
            display: none;
            background: var(--bg-card);
            border: 2px solid var(--color-vermilion);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-soft);
            animation: fadeInUp 0.6s ease;
            position: relative;
            backdrop-filter: blur(15px);
        }

        .output-section.visible { display: block; }

        .output-text {
            min-height: 120px;
            padding: var(--spacing-xl);
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 1.3rem;
            line-height: 2.6;
            color: var(--color-ink);
            letter-spacing: 4px;
            position: relative;
        }

        .output-text::before {
            content: '';
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-sm);
            pointer-events: none;
        }

        .output-text .placeholder {
            color: var(--text-light);
            font-style: italic;
            text-align: center;
        }

        /* 重点词语高亮 */
        .highlight-word {
            color: var(--color-vermilion);
            font-weight: 600;
            cursor: pointer;
            position: relative;
            border-bottom: 2px dotted var(--color-vermilion);
            transition: all var(--transition-fast);
        }

        .highlight-word:hover {
            background: rgba(196, 30, 58, 0.1);
        }

        /* ==================== 注释区（语文课本风格） ==================== */
        .annotation-section {
            margin-top: var(--spacing-xl);
            padding: var(--spacing-xl);
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            display: none;
        }

        .annotation-section.visible { display: block; }

        .annotation-title {
            font-family: var(--font-title);
            font-size: 1.1rem;
            color: var(--color-annotation);
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-sm);
            border-bottom: 2px solid var(--color-annotation);
            letter-spacing: 3px;
        }

        .annotation-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .annotation-item {
            display: flex;
            align-items: flex-start;
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            background: rgba(255, 255, 255, 0.8);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--color-jade);
            transition: all var(--transition-fast);
        }

        .annotation-item:hover {
            background: white;
            transform: translateX(4px);
        }

        .annotation-word {
            font-family: var(--font-title);
            font-size: 1.1rem;
            color: var(--color-vermilion);
            min-width: 60px;
            font-weight: 600;
        }

        .annotation-content {
            flex: 1;
            font-size: 0.95rem;
            color: var(--color-ink);
            line-height: 1.8;
        }

        .annotation-meaning {
            color: var(--color-ink);
            margin-bottom: var(--spacing-xs);
        }

        .annotation-source {
            font-size: 0.85rem;
            color: var(--text-light);
            font-style: italic;
        }

        .annotation-source::before {
            content: '——';
            margin-right: var(--spacing-xs);
        }

        /* ==================== 出处引用区 ==================== */
        .source-section {
            margin-top: var(--spacing-lg);
            padding: var(--spacing-lg);
            background: linear-gradient(135deg, rgba(184, 134, 11, 0.08), rgba(184, 134, 11, 0.03));
            border: 1px solid rgba(184, 134, 11, 0.3);
            border-radius: var(--radius-md);
            display: none;
        }

        .source-section.visible { display: block; }

        .source-title {
            font-family: var(--font-title);
            font-size: 1rem;
            color: var(--color-gold);
            margin-bottom: var(--spacing-md);
            letter-spacing: 2px;
        }

        .source-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .source-item {
            font-size: 0.9rem;
            color: var(--color-ink-light);
            padding-left: var(--spacing-md);
            position: relative;
        }

        .source-item::before {
            content: '◆';
            position: absolute;
            left: 0;
            color: var(--color-gold);
            font-size: 0.7rem;
        }

        /* ==================== 操作按钮 ==================== */
        .output-actions {
            display: flex;
            gap: var(--spacing-lg);
            margin-top: var(--spacing-xl);
        }

        .action-btn {
            flex: 1;
            padding: var(--spacing-md) var(--spacing-lg);
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--color-ink);
            cursor: pointer;
            transition: all var(--transition-fast);
            position: relative;
            overflow: hidden;
            letter-spacing: 2px;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 3px;
            background: var(--color-vermilion);
            transform: scaleX(0);
            transition: transform var(--transition-fast);
        }

        .action-btn:hover::before { transform: scaleX(1); }
        .action-btn:hover { background: rgba(196, 30, 58, 0.06); border-color: var(--color-vermilion); }

        /* ==================== 示例区 ==================== */
        .examples-section { animation: fadeInUp 0.8s ease 0.4s backwards; }

        .examples-section h3 {
            font-family: var(--font-title);
            font-size: 1.2rem;
            margin-bottom: var(--spacing-lg);
            color: var(--color-ink);
            letter-spacing: 4px;
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }

        .example-btn {
            padding: var(--spacing-sm) var(--spacing-xl);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            font-family: var(--font-body);
            font-size: 0.95rem;
            color: var(--color-ink);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .example-btn:hover {
            background: var(--color-vermilion);
            color: white;
            border-color: var(--color-vermilion);
            transform: translateY(-3px);
        }

        /* ==================== 历史记录 ==================== */
        .history-section { animation: fadeInUp 0.8s ease 0.5s backwards; }

        .history-section h3 {
            font-family: var(--font-title);
            font-size: 1.2rem;
            margin-bottom: var(--spacing-lg);
            color: var(--color-ink);
            letter-spacing: 4px;
        }

        .history-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .empty-hint {
            text-align: center;
            color: var(--text-light);
            font-style: italic;
            padding: var(--spacing-xxl);
        }

        .history-item {
            display: flex;
            flex-direction: column;
            padding: var(--spacing-lg);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            position: relative;
        }

        .history-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: var(--color-vermilion);
            transform: scaleY(0);
            transition: transform var(--transition-fast);
        }

        .history-item:hover { background: white; transform: translateX(6px); }
        .history-item:hover::before { transform: scaleY(1); }

        .history-item .modern-text {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: var(--spacing-sm);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item .wenyan-text {
            font-family: var(--font-body);
            font-size: 1.1rem;
            color: var(--color-ink);
            line-height: 2;
        }

        /* ==================== 角落印章 ==================== */
        .corner-seal {
            position: fixed;
            width: 100px; height: 100px;
            background: linear-gradient(145deg, var(--color-vermilion), #A01830);
            color: white;
            font-family: var(--font-title);
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.65;
            z-index: 10;
            box-shadow: var(--shadow-soft);
        }

        .corner-seal::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .seal-top-right { top: var(--spacing-xl); right: var(--spacing-xl); transform: rotate(15deg); animation: sealFloat 5s ease-in-out infinite; }
        .seal-bottom-left { bottom: var(--spacing-xl); left: var(--spacing-xl); transform: rotate(-10deg); animation: sealFloat 5s ease-in-out infinite reverse; }

        /* ==================== Toast ==================== */
        .toast {
            position: fixed;
            top: 40px; left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--color-ink);
            color: white;
            padding: var(--spacing-md) var(--spacing-xxl);
            border-radius: var(--radius-lg);
            font-family: var(--font-body);
            z-index: 1000;
            opacity: 0;
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-soft);
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* ==================== 动画 ==================== */
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-50px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes pulse-icon { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes inkFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -40px) scale(1.1); }
            50% { transform: translate(-40px, 50px) scale(0.9); }
            75% { transform: translate(30px, 30px) scale(1.05); }
        }
        @keyframes cloudDrift { 0%, 100% { transform: translateX(0); opacity: 0.4; } 50% { transform: translateX(80px); opacity: 0.6; } }
        @keyframes fall { 0% { transform: translateY(-40px) rotate(0deg); opacity: 0; } 10% { opacity: 0.7; } 90% { opacity: 0.7; } 100% { transform: translateY(100vh) rotate(400deg); opacity: 0; } }
        @keyframes sealStamp { 0% { transform: scale(2.5) rotate(-15deg); opacity: 0; } 60% { transform: scale(0.9) rotate(-5deg); opacity: 1; } 100% { transform: scale(1) rotate(-5deg); opacity: 1; } }
        @keyframes sealFloat { 0%, 100% { transform: translateY(0) rotate(var(--rotation, 15deg)); } 50% { transform: translateY(-15px) rotate(var(--rotation, 15deg)); } }

        /* ==================== 桃花飘落效果 ==================== */
        .peach-blossoms {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        .blossom {
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(ellipse at center, 
                rgba(255, 182, 193, 0.6) 0%,    /* 浅粉色 */
                rgba(255, 192, 203, 0.4) 40%,   /* 粉色 */
                rgba(255, 218, 233, 0.2) 70%,   /* 更淡的粉色 */
                transparent 100%
            );
            border-radius: 50% 0 50% 50%;  /* 花瓣形状 */
            animation: blossomFall linear infinite;
            opacity: 0.5;  /* 浅浅的 */
            filter: blur(0.5px);
        }

        .petal-1 { left: 5%; animation-duration: 15s; animation-delay: 0s; transform: scale(0.6); }
        .petal-2 { left: 15%; animation-duration: 18s; animation-delay: 2s; transform: scale(0.8); }
        .petal-3 { left: 25%; animation-duration: 16s; animation-delay: 4s; transform: scale(0.5); }
        .petal-4 { left: 35%; animation-duration: 20s; animation-delay: 1s; transform: scale(0.7); }
        .petal-5 { left: 45%; animation-duration: 14s; animation-delay: 3s; transform: scale(0.6); }
        .petal-6 { left: 55%; animation-duration: 17s; animation-delay: 5s; transform: scale(0.9); }
        .petal-7 { left: 65%; animation-duration: 19s; animation-delay: 2.5s; transform: scale(0.5); }
        .petal-8 { left: 75%; animation-duration: 16s; animation-delay: 1.5s; transform: scale(0.7); }
        .petal-9 { left: 85%; animation-duration: 18s; animation-delay: 3.5s; transform: scale(0.6); }
        .petal-10 { left: 95%; animation-duration: 15s; animation-delay: 0.5s; transform: scale(0.8); }
        .petal-11 { left: 50%; animation-duration: 21s; animation-delay: 4.5s; transform: scale(0.5); }
        .petal-12 { left: 30%; animation-duration: 13s; animation-delay: 2s; transform: scale(0.7); }

        @keyframes blossomFall {
            0% {
                top: -5%;
                opacity: 0;
                transform: translateX(0) rotate(0deg) scale(var(--scale, 0.6));
            }
            5% {
                opacity: 0.4;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                top: 100%;
                opacity: 0;
                transform: translateX(calc(var(--drift, 0) * 100px)) 
                           rotate(calc(var(--rotation, 1) * 720deg)) 
                           scale(var(--scale, 0.6));
            }
        }

        .petal-1 { --drift: -1; --rotation: 1; --scale: 0.6; }
        .petal-2 { --drift: 1; --rotation: -1; --scale: 0.8; }
        .petal-3 { --drift: -0.5; --rotation: 1.2; --scale: 0.5; }
        .petal-4 { --drift: 0.8; --rotation: -0.8; --scale: 0.7; }
        .petal-5 { --drift: -1.2; --rotation: 0.9; --scale: 0.6; }
        .petal-6 { --drift: 0.5; --rotation: -1.1; --scale: 0.9; }
        .petal-7 { --drift: -0.8; --rotation: 1.3; --scale: 0.5; }
        .petal-8 { --drift: 1.1; --rotation: -0.7; --scale: 0.7; }
        .petal-9 { --drift: -0.6; --rotation: 0.85; --scale: 0.6; }
        .petal-10 { --drift: 0.9; --rotation: -1.05; --scale: 0.8; }
        .petal-11 { --drift: -1.1; --rotation: 0.95; --scale: 0.5; }
        .petal-12 { --drift: 0.7; --rotation: -0.9; --scale: 0.7; }

        /* ==================== 响应式 ==================== */
        @media (max-width: 768px) {

        }

        ::-webkit-scrollbar { width: 10px; }

        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-light); }

        const StyleConverters = {
            // 通用词汇转换
            convertBaseWords(text, style) {
                let dict = WenyanDictionary.baseWords;
                if (style === 'shijing') dict = { ...dict, ...WenyanDictionary.shijingWords };
                else if (style === 'shiji') dict = { ...dict, ...WenyanDictionary.shijiWords };
                else if (style === 'lunyu') dict = { ...dict, ...WenyanDictionary.lunyuWords };
                else if (style === 'zhouli') dict = { ...dict, ...WenyanDictionary.zhouliWords };

                const words = Object.keys(dict).sort((a, b) => b.length - a.length);
                const annotations = [];
                const sources = [];

                words.forEach(word => {
                    if (text.includes(word)) {
                        const item = dict[word];
                        text = text.replace(new RegExp(escapeRegex(word), 'g'), item.word);
                        if (!annotations.find(a => a.word === item.word)) {
                            annotations.push({ word: item.word, meaning: item.meaning, source: item.source });
                        }
                        if (!sources.includes(item.source)) sources.push(item.source);
                    }
                });

                return { text, annotations, sources };
            },

            // 将现代文本提取为语义单元（主谓宾结构）
            extractSemanticUnits(text) {
                // 分句
                const sentences = text.replace(/[！？；]/g, '。').split(/[。，]/).filter(s => s.trim());
                const units = [];
                sentences.forEach(sent => {
                    const trimmed = sent.trim();
                    if (trimmed.length >= 2) {
                        units.push(trimmed);
                    }
                });
                return units;
            },

            // 诗经风：严格四言成韵，重章叠句，起兴
            shijing(text) {
                const result = this.convertBaseWords(text, 'shijing');
                const annotations = [...result.annotations];
                const sources = [...result.sources];

                // 严格起兴句（两句，每句四字或七字）

                annotations.push({ word: xing.text, meaning: xing.meaning, source: xing.source });
                if (!sources.includes(xing.source)) sources.push(xing.source);

                // 语义提取：分句后提取核心动词和名词
                const units = this.extractSemanticUnits(result.text);
                if (units.length === 0) {
                    return { text: output.trim(), annotations, sources };
                }

                // 构建语义关键词池（去除虚词后的实词）
                const stopChars = new Set(['之', '乎', '者', '也', '矣', '焉', '哉', '兮', '耶', '与', '而', '于', '以', '其', '所', '不', '无', '有', '我', '彼', '此']);

                    // 提取双字词和单字实词
                    for (let i = 0; i < unit.length; i++) {
                        if (i + 1 < unit.length && !stopChars.has(unit[i]) && !stopChars.has(unit[i + 1])) {
                            keywords.push(unit[i] + unit[i + 1]);
                            i++;
                        } else if (!stopChars.has(unit[i]) && unit[i].match(/[\u4e00-\u9fa5]/)) {
                            keywords.push(unit[i]);
                        }
                    }
                });

                // 智能模板选择：根据关键词长度选择最自然的诗经典型句式
                const pickTemplate = (a, b) => {
                    const al = (a || '').length;
                    const bl = (b || '').length;
                    // 优先恰好四字的组合
                    if (al === 2 && bl === 2) return a + b;                         // 2+2=4
                    if (al === 2 && bl === 1) return a + '兮' + b;                 // 2+1+1=4
                    if (al === 1 && bl === 2) return a + '之' + b;                 // 1+1+2=4
                    if (al === 1 && bl === 1) return a + '兮' + b + '兮';         // 1+1+1+1=4
                    if (al === 3 && bl === 1) return a + b;                        // 3+1=4
                    if (al === 1 && bl === 3) return a + b;                        // 1+3=4
                    // 其他情况直接拼接后截断或填充
                    let s = (a || '') + (b || '');
                    if (s.length > 4) return s.substring(0, 4);
                    if (s.length === 3) return s + '兮';
                    if (s.length === 2) return s[0] + '兮' + s[1] + '兮';
                    if (s.length === 1) return s + '兮' + s + '兮';
                    return '心之忧兮';
                };

                // 生成四言诗句
                const generateLines = () => {
                    const lines = [];
                    let kidx = 0;

                    while (kidx < keywords.length && lines.length < 8) {
                        const a = keywords[kidx] || '心';
                        const b = keywords[kidx + 1] || '思';
                        const finalText = pickTemplate(a, b);
                        lines.push(finalText);
                        kidx += 2;
                    }

                    return lines;
                };

                const fallbackLines = [

                ];

                    const fb = fallbackLines[fourCharLines.length % fallbackLines.length];
                    fourCharLines.push(fb.text);
                    if (!sources.includes(fb.source)) sources.push(fb.source);

                // 重章叠句结构：两章，每章四句
                // 第一章
                const chapter1 = fourCharLines.slice(0, 4);

                output += chapter2[2] + '，' + chapter2[3] + '。\n';

                // 添加诗经典型句式注释
                const shijingNotes = [
                    { word: '兮', meaning: '语气助词，表感叹或停顿', source: '《诗经·周南·关雎》"窈窕淑女，钟鼓乐之"（《诗经》国风中"兮"字多见于《周南》《召南》及变风）' },
                    { word: '矣', meaning: '语气助词，表示已然或肯定', source: '《诗经·小雅·鹿鸣》"我有嘉宾，德音孔昭。视民不恌，君子是则是效"' },

                    { word: '其', meaning: '它的、那', source: '《诗经·邶风·击鼓》"击鼓其镗，踊跃用兵"' }
                ];

                shijingNotes.forEach(note => {
                    if (output.includes(note.word) && !annotations.find(a => a.word === note.word)) {

                    }
                });

                return { text: output.trim(), annotations, sources };
            },

            shiji(text) {

                const annotations = [...result.annotations];

                const firstUnit = units[0] || '';
                const hasExplicitSubject = /吾|予|某|余|吾辈|吾侪/.test(firstUnit.substring(0, 6));

                // 多样化开头选择
                const openings = {

                        { word: '传曰', meaning: '古书上说', source: '《史记·货殖列传》"传曰"论赞体例' },
                        { word: '语曰', meaning: '俗话说', source: '《史记·张释之冯唐列传》"语曰"引证体例' },
                        { word: '天下语曰', meaning: '天下人说', source: '《史记·平津侯主父列传》"天下语曰"引谚体例' }
                    ]
                };

                // 根据内容类型选择开头
                if (hasExplicitSubject && units.length >= 2) {
                    // 列传体
                    const subjectMatch = firstUnit.match(/^(吾|予|某|余)(.+?)(?:之|所|于|以|而|$)/);
                    const subject = subjectMatch ? subjectMatch[2].substring(0, 2) : firstUnit.substring(0, 2);
                    output += subject + '者，世人也。';
                    const bioOpening = openings.biography[0];
                    annotations.push({
                        word: bioOpening.word,
                        meaning: bioOpening.meaning,
                        source: bioOpening.source
                    });
                    if (!sources.includes(bioOpening.source)) sources.push(bioOpening.source);
                } else if (isNarrative) {
                    // 叙事体
                    const opening = openings.narrative[Math.floor(Math.random() * openings.narrative.length)];
                    output += opening.word + '，';
                    annotations.push({
                        word: opening.word,
                        meaning: opening.meaning,
                        source: opening.source
                    });
                    if (!sources.includes(opening.source)) sources.push(opening.source);
                } else {
                    // 议论体
                    const opening = openings.comment[Math.floor(Math.random() * openings.comment.length)];
                    output += opening.word + '：';
                    annotations.push({
                        word: opening.word,
                        meaning: opening.meaning,
                        source: opening.source
                    });
                    if (!sources.includes(opening.source)) sources.push(opening.source);
                }

                // 史记叙事时间词（严格按史记原文出处）
                const shijiTimeWords = [
                    { word: '是日', meaning: '这一天', source: '《史记·项羽本纪》"是日，微樊哙奔入营谯让项羽，沛公事几殆"' },
                    { word: '居无何', meaning: '过了不久', source: '《史记·李将军列传》"居无何，匈奴入杀辽西太守，败韩将军"' },
                    { word: '顷之', meaning: '不久、一会儿', source: '《史记·滑稽列传》"顷之，三老、官属、豪长者、里父老皆会"' },
                    { word: '旦日', meaning: '第二天、明日', source: '《史记·项羽本纪》"沛公旦日从百余骑来见项王，至鸿门，谢曰……"' },
                    { word: '已而', meaning: '不久、后来', source: '《史记·项羽本纪》"已而项羽至，围邯郸"' }
                ];

                // 选择时间词（仅在叙事体且首句未用"初"时使用）
                if (!output.startsWith('初') && units.length > 1) {
                    const timeWord = shijiTimeWords[Math.floor(Math.random() * shijiTimeWords.length)];
                    output += timeWord.word + '，';
                    annotations.push({ word: timeWord.word, meaning: timeWord.meaning, source: timeWord.source });
                    if (!sources.includes(timeWord.source)) sources.push(timeWord.source);
                }

                // 史记叙事连词（严格按史记原文出处）
                const shijiConnectors = [
                    { word: '遂', meaning: '于是、就', source: '《史记·项羽本纪》"项王未有以应。沛公遂去，脱身独骑……"' },
                    { word: '乃', meaning: '于是、才、就', source: '《史记·项羽本纪》"项伯乃夜驰之沛公军，私见张良，具告以事"' },
                    { word: '因', meaning: '趁机、于是', source: '《史记·项羽本纪》"不如因善遇之。项王许诺。"' },
                    { word: '及', meaning: '等到', source: '《史记·项羽本纪》"及楚击秦，诸将皆从壁上观"' },
                    { word: '于是', meaning: '在这时', source: '《史记·项羽本纪》"于是项伯复夜去，至军中，具以沛公言报项王"' }
                ];

                // 叙事主体
                let connIdx = 0;
                units.forEach((unit, idx) => {
                    if (idx === 0 && hasExplicitSubject) {
                        // 列传体首句已用于"某某者，某人也"，此处续写
                        // 取首句剩余部分或次句
                        if (unit.length > 3) {
                            output += unit + '。';
                        }
                    } else {
                        // 每隔一句加一个连词（史记叙事节奏：事件-连词-事件）
                        if (idx > 0 && idx % 2 === 1 && units.length > 2) {
                            const conn = shijiConnectors[connIdx % shijiConnectors.length];
                            output += conn.word;
                            if (!annotations.find(a => a.word === conn.word)) {
                                annotations.push({ word: conn.word, meaning: conn.meaning, source: conn.source });
                            }
                            if (!sources.includes(conn.source)) sources.push(conn.source);
                            connIdx++;
                        }
                        output += unit + '。';
                    }
                });

                // 结尾：太史公曰论赞（严格史记格式）
                const shijiComments = [
                    {
                        word: '太史公曰',
                        comment: '此言足以观世变矣',
                        source: '《史记》各篇"太史公曰"论赞体例'
                    },
                    {
                        word: '太史公曰',
                        comment: '世之人当知所戒',
                        source: '《史记》各篇"太史公曰"论赞体例'
                    },
                    {
                        word: '太史公曰',
                        comment: '观其所为，可以知其人矣',
                        source: '《史记·项羽本纪》"太史公曰：吾闻之周生曰\'舜目盖重瞳子\'，又闻项羽亦重瞳子。羽岂其苗裔邪？何兴之暴也！"'
                    }
                ];
                const comment = shijiComments[Math.floor(Math.random() * shijiComments.length)];

                output += '\n\n' + comment.word + '：' + comment.comment + '。';
                annotations.push({ word: comment.word, meaning: '太史公评论', source: comment.source });
                if (!sources.includes(comment.source)) sources.push(comment.source);

                return { text: output, annotations, sources };
            },

            // 论语风：子曰对话体
            lunyu(text) {
                const result = this.convertBaseWords(text, 'lunyu');
                let output = '';
                const annotations = [...result.annotations];
                const sources = [...result.sources];

                // 子曰开头
                const opening = WenyanDictionary.lunyuOpenings[0];
                output += opening.word + '："';
                annotations.push({ word: opening.word, meaning: opening.meaning, source: opening.source });
                if (!sources.includes(opening.source)) sources.push(opening.source);

                output += result.text + '"';

                // 多样化论语论赞
                const lunyuComments = [
                    { word: '弟子问曰', question: '何谓也？', answer: '此之谓也', source: '《论语》对话体' },
                    { word: '子路不对', question: '何如？', answer: '知之为知之', source: '《论语·为政》' },
                    { word: '或曰', question: '何以如是？', answer: '克己复礼', source: '《论语·颜渊》' }
                ];
                const comment = lunyuComments[Math.floor(Math.random() * lunyuComments.length)];

                output += '\n\n' + comment.word + '："' + comment.question + '"\n';
                annotations.push({ word: comment.word, meaning: '或有人问', source: '《论语》对话体' });

                output += '子曰："' + result.text.split('。')[0] + '，' + comment.answer + '。"';
                annotations.push({ word: comment.answer, meaning: '说的就是这个道理', source: '《论语》论赞' });

                return { text: output, annotations, sources };
            },

            // 周礼风：庄重典雅
            zhouli(text) {
                const result = this.convertBaseWords(text, 'zhouli');
                let output = '';
                const annotations = [...result.annotations];
                const sources = [...result.sources];

                // 随机选择周礼开头
                const opening = WenyanDictionary.zhouliOpenings[Math.floor(Math.random() * WenyanDictionary.zhouliOpenings.length)];
                output += opening.word + '，';
                annotations.push({ word: opening.word, meaning: opening.meaning, source: opening.source });
                if (!sources.includes(opening.source)) sources.push(opening.source);

                // 多样化周礼引语
                const zhouliQuotes = [
                    { word: '辨方正位', quote: '体国经野，设官分职，以为民极', source: '《周礼·天官》' },
                    { word: '以刑统官', quote: '以秩叙事，以会官纪，以平邦国', source: '《周礼·秋官》' },
                    { word: '礼尚往来', quote: '礼尚往来，往而不来，非礼也；来而不往，亦非礼也', source: '《礼记·曲礼》' },
                    { word: '正其衣冠', quote: '尊其瞻视，俨然人望而畏之', source: '《论语·尧曰》' },
                    { word: '兴于诗', quote: '立于礼，成于乐', source: '《论语·泰伯》' }
                ];
                const quote = zhouliQuotes[Math.floor(Math.random() * zhouliQuotes.length)];
                output += quote.quote + '。';
                annotations.push({ word: quote.word, meaning: quote.word, source: quote.source });

                output += '\n\n' + result.text;

                // 多样化周礼论赞
                const zhouliEndings = [
                    { word: '此所谓礼也', meaning: '这就是所谓的礼', source: '《周礼》全书' },
                    { word: '礼之用，和为贵', meaning: '礼的作用，以和谐为贵', source: '《论语·学而》"礼之用，和为贵"' },
                    { word: '克己复礼为仁', meaning: '约束自己使言行符合礼，这就是仁', source: '《论语·颜渊》"克己复礼为仁"' }
                ];
                const ending = zhouliEndings[Math.floor(Math.random() * zhouliEndings.length)];
                output += '\n\n' + ending.word + '。';
                annotations.push({ word: ending.word, meaning: ending.meaning, source: ending.source });

                return { text: output, annotations, sources };
            }
        };

        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        /* ==================== 主转换器 ==================== */
        const WenyanConverter = {
            convert(text, style = 'zhouli') {
                if (!text || text.trim() === '') {
                    return { text: '请输入要转换的文字', annotations: [], sources: [] };
                }

                switch (style) {
                    case 'shijing':
                        return StyleConverters.shijing(text);
                    case 'shiji':
                        return StyleConverters.shiji(text);
                    case 'lunyu':
                        return StyleConverters.lunyu(text);
                    case 'zhouli':
                        return StyleConverters.zhouli(text);
                    default:
                        return StyleConverters.zhouli(text);
                }
            }
        };

        /* ==================== 本地存储 ==================== */
        const WenyanStorage = {
            KEYS: { HISTORY: 'wenyan_history' },
            MAX_HISTORY: 30,

            getHistory() {
                try {
                    const data = localStorage.getItem(this.KEYS.HISTORY);
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    return [];
                }
            },

            saveHistory(history) {
                try {
                    localStorage.setItem(this.KEYS.HISTORY, JSON.stringify(history));
                    return true;
                } catch (e) {
                    return false;
                }
            },

            addHistory(modernText, wenyanText, style, annotations, sources) {
                const history = this.getHistory();
                const newItem = {
                    id: Date.now(),
                    modernText,
                    wenyanText,
                    style,
                    annotations,
                    sources,
                    timestamp: new Date().toISOString()
                };
                history.unshift(newItem);
                if (history.length > this.MAX_HISTORY) history.pop();
                this.saveHistory(history);
                return newItem;
            }
        };

        /* ==================== 应用主入口 ==================== */
        const App = {
            elements: {},
            state: {
                currentStyle: 'zhouli',
                lastResult: null
            },

            init() {
                this.cacheElements();
                this.bindEvents();
                this.loadHistory();
            },

            cacheElements() {
                this.elements = {
                    modernTextInput: document.getElementById('modern-text'),
                    charCount: document.getElementById('char-count'),
                    styleButtons: document.querySelectorAll('.style-btn'),
                    styleHint: document.getElementById('style-hint'),
                    convertBtn: document.getElementById('convert-btn'),
                    outputSection: document.getElementById('output-section'),
                    outputText: document.getElementById('output-text'),
                    annotationSection: document.getElementById('annotation-section'),
                    annotationList: document.getElementById('annotation-list'),
                    sourceSection: document.getElementById('source-section'),
                    sourceList: document.getElementById('source-list'),
                    copyBtn: document.getElementById('copy-btn'),
                    regenerateBtn: document.getElementById('regenerate-btn'),
                    shareBtn: document.getElementById('share-btn'),
                    historyList: document.getElementById('history-list'),
                    historyCount: document.getElementById('history-count'),
                    toast: document.getElementById('toast'),
                    exampleBtns: document.querySelectorAll('.example-btn')
                };
            },

            bindEvents() {
                this.elements.modernTextInput.addEventListener('input', () => this.updateCharCount());
                this.elements.styleButtons.forEach(btn => {
                    btn.addEventListener('click', () => this.selectStyle(btn.dataset.style));
                });
                this.elements.convertBtn.addEventListener('click', () => this.convert());
                this.elements.copyBtn.addEventListener('click', () => this.copyToClipboard());
                this.elements.regenerateBtn.addEventListener('click', () => this.regenerate());
                this.elements.shareBtn.addEventListener('click', () => this.share());
                this.elements.exampleBtns.forEach(btn => {
                    btn.addEventListener('click', () => this.useExample(btn.dataset.text));
                });
            },

            updateCharCount() {
                this.elements.charCount.textContent = this.elements.modernTextInput.value.length;
            },

            selectStyle(style) {
                this.state.currentStyle = style;
                this.elements.styleButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.style === style);
                });
                this.elements.styleHint.textContent = this.getStyleName(style);
            },

            getStyleName(style) {
                const names = { zhouli: '周礼风', shijing: '诗经风', lunyu: '论语风', shiji: '史记风' };
                return names[style] || '周礼风';
            },

            convert() {
                const text = this.elements.modernTextInput.value.trim();
                if (!text) {
                    this.showToast('请输入要转换的文字');
                    return;
                }

                this.elements.outputSection.classList.add('visible');
                this.elements.outputText.innerHTML = '<p class="placeholder">正在转化...</p>';
                this.elements.annotationSection.classList.remove('visible');
                this.elements.sourceSection.classList.remove('visible');

                setTimeout(() => {
                    const result = WenyanConverter.convert(text, this.state.currentStyle);
                    this.state.lastResult = result;
                    this.showOutput(result);
                    WenyanStorage.addHistory(text, result.text, this.state.currentStyle, result.annotations, result.sources);
                    this.loadHistory();
                    this.elements.outputSection.scrollIntoView({ behavior: 'smooth' });
                }, 600);
            },

            showOutput(result) {
                // 显示文言文（保留换行）
                const text = result.text.replace(/\n/g, '<br>');
                this.elements.outputText.innerHTML = '<p>' + text + '</p>';

                // 显示注释
                if (result.annotations.length > 0) {
                    this.elements.annotationSection.classList.add('visible');
                    this.elements.annotationList.innerHTML = result.annotations.map(ann => `
                        <div class="annotation-item">
                            <span class="annotation-word">${ann.word}</span>
                            <div class="annotation-content">
                                <div class="annotation-meaning">${ann.meaning}</div>
                                <div class="annotation-source">${ann.source}</div>
                            </div>
                        </div>
                    `).join('');
                }

                // 显示出处
                if (result.sources.length > 0) {
                    this.elements.sourceSection.classList.add('visible');
                    this.elements.sourceList.innerHTML = result.sources.map(src => 
                        `<div class="source-item">${src}</div>`
                    ).join('');
                }
            },

            copyToClipboard() {
                const text = this.state.lastResult?.text || '';
                navigator.clipboard.writeText(text).then(() => {
                    this.showToast('已复制到剪贴板');
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    this.showToast('已复制到剪贴板');
                });
            },

            regenerate() {
                if (!this.elements.modernTextInput.value.trim()) {
                    this.showToast('请先输入文字');
                    return;
                }
                this.convert();
            },

            share() {
                const text = this.state.lastResult?.text;
                if (!text) {
                    this.showToast('请先生成文言文');
                    return;
                }
                if (navigator.share) {
                    navigator.share({ title: '我曾听闻', text }).catch(() => this.copyToClipboard());
                } else {
                    this.copyToClipboard();
                }
            },

            useExample(text) {
                this.elements.modernTextInput.value = text;
                this.updateCharCount();
                this.convert();
            },

            loadHistory() {
                const history = WenyanStorage.getHistory();
                this.elements.historyCount.textContent = history.length;

                if (history.length === 0) {
                    this.elements.historyList.innerHTML = '<p class="empty-hint">暂无记录</p>';
                    return;
                }

                this.elements.historyList.innerHTML = history.map(item => `
                    <div class="history-item" data-id="${item.id}">
                        <div class="modern-text">${this.escapeHtml(item.modernText)}</div>
                        <div class="wenyan-text">${this.escapeHtml(item.wenyanText)}</div>
                    </div>
                `).join('');

                this.elements.historyList.querySelectorAll('.history-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const id = parseInt(item.dataset.id);
                        const historyItem = history.find(h => h.id === id);
                        if (historyItem) {
                            this.elements.modernTextInput.value = historyItem.modernText;
                            this.updateCharCount();
                            this.showOutput({
                                text: historyItem.wenyanText,
                                annotations: historyItem.annotations || [],
                                sources: historyItem.sources || []
                            });
                            this.elements.outputSection.classList.add('visible');
                        }
                    });
                });
            },

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },

            showToast(message) {
                this.elements.toast.textContent = message;
                this.elements.toast.classList.add('show');
                setTimeout(() => this.elements.toast.classList.remove('show'), 2000);
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
