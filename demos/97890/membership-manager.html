  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="addModal">

      <form id="addForm" onsubmit="saveMembership(event)">
        <div class="form-group">
          <label class="form-label">会员名称 *</label>
          <input type="text" class="form-input" id="mName" placeholder="例如：网易云音乐黑胶会员" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">类别</label>
            <select class="form-select" id="mCategory">
              <option value="video">🎬 视频</option>

              <option value="💳">💳 金融</option>
              <option value="🏥">🏥 健康</option>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">开通日期 *</label>
            <input type="date" class="form-input" id="mStartDate" required>
          </div>
          <div class="form-group">
            <label class="form-label">到期日期 *</label>
            <input type="date" class="form-input" id="mEndDate" required>
          </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">价格（元）</label>
            <input type="number" class="form-input" id="mPrice" placeholder="99" min="0" step="0.01">
          </div>
          <div class="form-group">
            <label class="form-label">付费周期</label>
            <select class="form-select" id="mPeriod">
              <option value="monthly">月付</option>
              <option value="quarterly">季付</option>
              <option value="yearly">年付</option>
              <option value="one-time">一次性</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">订阅模式</label>
          <div style="display:flex;gap:0.8rem;padding:0.3rem 0;">
            <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.9rem;cursor:pointer;">
              <input type="radio" name="mAutoRenew" value="true" id="mAutoRenewYes">
              <span style="font-weight:600;">🔄 自动续费</span>
            </label>
            <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.9rem;cursor:pointer;">
              <input type="radio" name="mAutoRenew" value="false" id="mAutoRenewNo" checked>
              <span>💸 单次付费</span>
            </label>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">包含权益</label>
          <div id="benefitsContainer">
            <div class="benefits-input-group">
              <input type="text" class="form-input benefit-input" placeholder="例如：无损音质">
            </div>
          </div>
          <button type="button" class="btn-add-benefit" onclick="addBenefitInput()">+ 添加权益</button>
        </div>
        <div class="form-group">
          <label class="form-label">备注</label>
          <textarea class="form-textarea" id="mNote" placeholder="其他需要记住的信息..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeAddModal()">取消</button>
          <button type="submit" class="btn-submit">保存</button>
        </div>
      </form>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal" id="detailModalContent">
      <!-- JS renders here -->
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ========== DATA ==========
    const STORAGE_KEY = 'subfree_data';
    let memberships = [];
    let currentFilter = 'all';
    let editingId = null;

    const categoryNames = {
      video: '视频', music: '音乐', shopping: '购物',
      travel: '出行', other: '其他'
    };
    const categoryColors = {
      video: '#E53935', music: '#1E88E5', shopping: '#FB8C00',
      travel: '#00897B', other: '#8E24AA'
    };
    const periodNames = {
      monthly: '月付', quarterly: '季付', yearly: '年付', 'one-time': '一次性'
    };

    // Demo data
    const demoData = [
      {
        id: 'demo-1',
        name: '网易云音乐黑胶VIP',
        category: 'music',
        icon: '🎵',
        startDate: '2025-08-15',
        endDate: '2026-08-15',
        price: 158,
        period: 'yearly',
        autoRenew: false,
        benefits: ['无损音质', 'VIP专属曲库', '免费下载', '个性皮肤', '免广告'],
        note: '学生优惠开通，记得续费前看看有没有活动'
      },
      {
        id: 'demo-2',
        name: '哔哩哔哩大会员',
        category: 'video',
        icon: '🎬',
        startDate: '2025-11-01',
        endDate: '2026-11-01',
        price: 148,
        period: 'yearly',
        autoRenew: true,
        benefits: ['1080P+画质', '番剧抢先看', '漫画阅读券', '挂件头像', '评论表情'],
        note: '双11活动买的，很划算，但开了自动续费记得看完取消'
      },
      {
        id: 'demo-3',
        name: '京东PLUS会员',
        category: 'shopping',
        icon: '🛒',
        startDate: '2025-06-20',
        endDate: '2026-06-20',
        price: 99,
        period: 'yearly',
        autoRenew: true,
        benefits: ['无限免邮', '10倍返京豆', '专属折扣', '免费上门退换', 'PLUS价'],
        note: '和视频网站联名卡一起买的'
      },
      {
        id: 'demo-4',
        name: '百度网盘超级会员',
        category: 'other',
        icon: '☁️',
        startDate: '2025-03-10',
        endDate: '2026-03-10',
        price: 198,
        period: 'yearly',
        autoRenew: false,
        benefits: ['5T超大空间', '极速下载', '在线解压', '视频倍速', 'PDF转Word'],
        note: '快要到期了，记得续费'
      },
      {
        id: 'demo-5',
        name: '腾讯视频VIP',
        category: 'video',
        icon: '🎬',
        startDate: '2025-09-01',
        endDate: '2025-12-01',
        price: 68,
        period: 'quarterly',
        autoRenew: true,
        benefits: ['院线新片', '独家美剧', '免广告', '蓝光画质', '多设备同时看'],
        note: '为了看某部剧开的，看完可能不续了，记得关自动续费'
      },
      {
        id: 'demo-6',
        name: 'Keep会员',
        category: 'other',
        icon: '🏃',
        startDate: '2025-01-05',
        endDate: '2026-01-05',
        price: 218,
        period: 'yearly',
        autoRenew: false,
        benefits: ['专属课程', '饮食计划', '运动数据报告', '会员专属活动', '商城折扣'],
        note: '新年Flag，希望坚持用满一年'
      }
    ];

    // ========== INIT ==========
    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { memberships = JSON.parse(saved); } catch(e) { memberships = []; }
      }
      if (memberships.length === 0) {
        memberships = [...demoData];
        saveToStorage();
      }
      renderList();
      updateStats();
      initChat();
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(memberships));
    }

    // ========== RENDER ==========
    function getStatus(m) {
      const today = new Date();
      today.setHours(0,0,0,0);
      const end = new Date(m.endDate);
      end.setHours(0,0,0,0);
      const diffDays = Math.ceil((end - today) / (1000 * 60 * 60 * 24));
      if (diffDays < 0) return { code: 'expired', text: '已过期', days: diffDays };
      if (diffDays <= 30) return { code: 'expiring', text: `剩${diffDays}天`, days: diffDays };
      return { code: 'active', text: '有效中', days: diffDays };
    }

    function renderList() {
      const container = document.getElementById('membershipList');
      const search = document.getElementById('searchInput').value.toLowerCase();

      let filtered = memberships.filter(m => {
        if (currentFilter !== 'all' && m.category !== currentFilter) return false;
        if (search && !m.name.toLowerCase().includes(search)) return false;
        return true;
      });

      filtered.sort((a, b) => {
        const sa = getStatus(a), sb = getStatus(b);
        if (sa.code !== sb.code) {
          const order = { expiring: 0, active: 1, expired: 2 };
          return order[sa.code] - order[sb.code];
        }
        return new Date(a.endDate) - new Date(b.endDate);
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="emoji">📝</div>
            <p>还没有订阅记录，点击右上角添加吧</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(m => {
        const status = getStatus(m);
        const color = categoryColors[m.category] || categoryColors.other;
        const benefitsHtml = m.benefits?.slice(0, 3).map(b => `<span class="benefit-tag">${b}</span>`).join('') || '';
        const moreBenefits = (m.benefits?.length || 0) > 3 ? `<span class="benefit-tag">+${m.benefits.length - 3}</span>` : '';
        const autoBadge = m.autoRenew
          ? '<span class="auto-renew-badge badge-auto">🔄 自动续费</span>'
          : '<span class="auto-renew-badge badge-once">💸 单次</span>';

        return `
          <div class="membership-card" onclick="openDetail('${m.id}')">
            <div class="card-header">
              <div class="card-icon" style="background:${color}15;color:${color}">${m.icon}</div>
              <span class="card-status status-${status.code}">${status.text}</span>
            </div>
            <div class="card-name">${m.name} ${autoBadge}</div>
            <div class="card-type">${categoryNames[m.category]} · ${periodNames[m.period] || ''}</div>
            <div class="card-meta">
              <div class="card-meta-item">📅 ${formatDate(m.endDate)}到期</div>
              <div class="card-meta-item">💰 ¥${m.price || 0}</div>
            </div>
            <div class="card-benefits-preview">
              ${benefitsHtml}${moreBenefits}
            </div>
          </div>`;
      }).join('');
    }

    function updateStats() {
      const total = memberships.length;
      let active = 0, expiring = 0, expired = 0, autoRenew = 0;
      memberships.forEach(m => {
        const s = getStatus(m);
        if (s.code === 'active') active++;
        else if (s.code === 'expiring') expiring++;
        else expired++;
        if (m.autoRenew) autoRenew++;
      });
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-active').textContent = active;
      document.getElementById('stat-expiring').textContent = expiring;
      document.getElementById('stat-auto').textContent = autoRenew;
      document.getElementById('stat-expired').textContent = expired;
    }

    function formatDate(d) {
      if (!d) return '-';
      const date = new Date(d);
      return `${date.getMonth() + 1}月${date.getDate()}日`;
    }

    // ========== FILTER ==========
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      renderList();
    }

    // ========== ADD MODAL ==========
    function openAddModal() {
      editingId = null;
      document.getElementById('addForm').reset();
      document.getElementById('mAutoRenewNo').checked = true;
      document.getElementById('benefitsContainer').innerHTML = `
        <div class="benefits-input-group">
          <input type="text" class="form-input benefit-input" placeholder="例如：无损音质">
        </div>`;
      document.querySelector('.modal-title').textContent = '添加会员';
      document.getElementById('addModal').classList.add('active');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('active');
    }

    function addBenefitInput() {
      const container = document.getElementById('benefitsContainer');
      const div = document.createElement('div');
      div.className = 'benefits-input-group';
      div.innerHTML = `
        <input type="text" class="form-input benefit-input" placeholder="例如：专属曲库">
        <button type="button" class="btn-remove" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(div);
    }

    function saveMembership(e) {
      e.preventDefault();
      const benefits = [];
      document.querySelectorAll('.benefit-input').forEach(input => {
        if (input.value.trim()) benefits.push(input.value.trim());
      });

      const data = {
        id: editingId || 'm-' + Date.now(),
        name: document.getElementById('mName').value.trim(),
        category: document.getElementById('mCategory').value,
        icon: document.getElementById('mIcon').value,
        startDate: document.getElementById('mStartDate').value,
        endDate: document.getElementById('mEndDate').value,
        price: parseFloat(document.getElementById('mPrice').value) || 0,
        period: document.getElementById('mPeriod').value,
        autoRenew: document.getElementById('mAutoRenewYes').checked,
        benefits: benefits,
        note: document.getElementById('mNote').value.trim()
      };

      if (editingId) {
        const idx = memberships.findIndex(m => m.id === editingId);
        if (idx >= 0) memberships[idx] = data;
      } else {
        memberships.push(data);
      }

      saveToStorage();
      renderList();
      updateStats();
      closeAddModal();
      showToast(editingId ? '已更新' : '添加成功');
    }

    // ========== DETAIL MODAL ==========
    function openDetail(id) {
      const m = memberships.find(x => x.id === id);
      if (!m) return;
      const status = getStatus(m);
      const color = categoryColors[m.category] || categoryColors.other;

      const benefitsHtml = (m.benefits || []).map(b => `
        <div class="benefit-item"><span class="check">✓</span> ${b}</div>
      `).join('') || '<div class="benefit-item" style="color:var(--muted)">暂无权益记录</div>';

      const autoHtml = m.autoRenew
        ? '<span class="auto-renew-badge badge-auto" style="font-size:0.8rem;">🔄 自动续费</span>'
        : '<span class="auto-renew-badge badge-once" style="font-size:0.8rem;">💸 单次付费</span>';

      document.getElementById('detailModalContent').innerHTML = `
        <div class="modal-header">
          <div></div>
          <button class="modal-close" onclick="closeDetailModal()">&times;</button>
        </div>
        <div class="detail-header">
          <div class="detail-icon" style="background:${color}15;color:${color}">${m.icon}</div>
          <div class="detail-title-group">
            <h3>${m.name}</h3>
            <p>${categoryNames[m.category]} · <span class="status-${status.code}" style="padding:2px 8px;border-radius:8px;font-size:0.75rem;font-weight:600;">${status.text}</span></p>
          </div>
        </div>
        <div class="detail-section">
          <h4>基本信息</h4>
          <div class="detail-info-grid">
            <div class="detail-info-item">
              <div class="label">开通日期</div>
              <div class="value">${m.startDate || '-'}</div>
            </div>
            <div class="detail-info-item">
              <div class="label">到期日期</div>
              <div class="value">${m.endDate || '-'}</div>
            </div>
            <div class="detail-info-item">
              <div class="label">价格</div>
              <div class="value">¥${m.price || 0}</div>
            </div>
            <div class="detail-info-item">
              <div class="label">付费周期</div>
              <div class="value">${periodNames[m.period] || '-'}</div>
            </div>
            <div class="detail-info-item">
              <div class="label">订阅模式</div>
              <div class="value">${autoHtml}</div>
            </div>
          </div>
        </div>
        <div class="detail-section">
          <h4>包含权益 (${m.benefits?.length || 0}项)</h4>
          <div class="benefits-list">
            ${benefitsHtml}
          </div>
        </div>
        ${m.note ? `
        <div class="detail-section">
          <h4>备注</h4>
          <div class="detail-info-item">
            <div class="value" style="font-weight:400;font-size:0.88rem;">${m.note}</div>
          </div>
        </div>` : ''}
        <div class="modal-actions">
          <button class="btn-secondary" onclick="closeDetailModal();editMembership('${m.id}')">编辑</button>
          <button class="btn-submit" onclick="closeDetailModal()">知道了</button>
        </div>
        <button class="btn-delete" onclick="deleteMembership('${m.id}')">删除此会员</button>
      `;
      document.getElementById('detailModal').classList.add('active');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.remove('active');
    }

    function editMembership(id) {
      const m = memberships.find(x => x.id === id);
      if (!m) return;
      editingId = id;
      document.getElementById('mName').value = m.name;
      document.getElementById('mCategory').value = m.category;
      document.getElementById('mIcon').value = m.icon;
      document.getElementById('mStartDate').value = m.startDate;
      document.getElementById('mEndDate').value = m.endDate;
      document.getElementById('mPrice').value = m.price || '';
      document.getElementById('mPeriod').value = m.period;
      if (m.autoRenew) {
        document.getElementById('mAutoRenewYes').checked = true;
      } else {
        document.getElementById('mAutoRenewNo').checked = true;
      }
      document.getElementById('mNote').value = m.note || '';

      const container = document.getElementById('benefitsContainer');
      container.innerHTML = '';
      if (m.benefits && m.benefits.length > 0) {
        m.benefits.forEach((b, i) => {
          const div = document.createElement('div');
          div.className = 'benefits-input-group';
          div.innerHTML = `
            <input type="text" class="form-input benefit-input" value="${b}" placeholder="权益内容">
            ${i > 0 ? '<button type="button" class="btn-remove" onclick="this.parentElement.remove()">✕</button>' : ''}
          `;
          container.appendChild(div);
        });
      } else {
        container.innerHTML = `<div class="benefits-input-group"><input type="text" class="form-input benefit-input" placeholder="例如：无损音质"></div>`;
      }

      document.querySelector('.modal-title').textContent = '编辑会员';
      document.getElementById('addModal').classList.add('active');
    }

    function deleteMembership(id) {
      if (!confirm('确定要删除这个会员记录吗？')) return;
      memberships = memberships.filter(m => m.id !== id);
      saveToStorage();
      renderList();
      updateStats();
      closeDetailModal();
      showToast('已删除');
    }

    // ========== TOAST ==========
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // ========== CLOSE ON OVERLAY CLICK ==========
    document.getElementById('addModal').addEventListener('click', e => {
      if (e.target === document.getElementById('addModal')) closeAddModal();
    });
    document.getElementById('detailModal').addEventListener('click', e => {
      if (e.target === document.getElementById('detailModal')) closeDetailModal();
    });

    // ===================================================================
    // ========== CHAT / AI 问答 ==========
    // ===================================================================
    let chatInitialized = false;

    function toggleChat() {
      const panel = document.getElementById('chatPanel');
      panel.classList.toggle('open');
      if (panel.classList.contains('open') && !chatInitialized) {
        initChat();
      }
    }

    function openChat() {
      document.getElementById('chatPanel').classList.add('open');
      if (!chatInitialized) initChat();
    }

    function closeChat() {
      document.getElementById('chatPanel').classList.remove('open');
    }

    function initChat() {
      if (chatInitialized) return;
      chatInitialized = true;
      const msgs = document.getElementById('chatMessages');
      msgs.innerHTML = '';
      addBotMsg('👋 你好！我是不白花助手。你可以问我任何关于你订阅会员的问题，比如：');
      addBotMsg('💡 "我想看剧，有什么会员能用？"\n💡 "最近有什么要过期了？"\n💡 "我有哪些自动续费的会员？"');
      hideBadge();
    }

    function addBotMsg(text) {
      const msgs = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'chat-msg bot';
      div.innerHTML = text.replace(/\n/g, '<br>') + '<span class="msg-time">不白花助手</span>';
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function addUserMsg(text) {
      const msgs = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'chat-msg user';
      const now = new Date();
      div.innerHTML = text + `<span class="msg-time">${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}</span>`;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function hideBadge() {
      document.getElementById('chatBadge').style.display = 'none';
    }

    function quickAsk(text) {
      openChat();
      sendMessage(text);
    }

    function sendChat() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      sendMessage(text);
    }

    function sendMessage(text) {
      addUserMsg(text);
      setTimeout(() => {
        const reply = generateReply(text);
        addBotMsg(reply);
      }, 400 + Math.random() * 300);
    }

    function generateReply(query) {
      const q = query.toLowerCase();
      const now = new Date();
      now.setHours(0,0,0,0);

      // 分析 query 意图
      const wantWatch = /(看剧|追剧|看视频|看电影|看综艺|看动漫|看番)/.test(q);
      const wantMusic = /(听歌|听音乐|听歌|音乐|无损)/.test(q);
      const wantExpiring = /(过期|快到期|即将到期|快过期|即将过期|什么时候到期)/.test(q);
      const wantAutoRenew = /(自动续费|续费|自动扣|扣费)/.test(q);
      const wantSaveMoney = /(省钱|节约|花费|多少钱|花了多少|月供|每月)/.test(q);
      const wantShopping = /(购物|买东西|免邮|优惠|折扣|京东|淘宝|拼多多)/.test(q);
      const wantStorage = /(云盘|网盘|存储|空间|下载)/.test(q);
      const wantAll = /(所有|全部|都有|有哪些|什么会员|总共有)/.test(q);
      const wantHealth = /(运动|健身|keep|健康)/.test(q);
      const wantTravel = /(出行|酒店|机票|火车|打车|滴滴)/.test(q);

      // 收集有效会员
      const active = memberships.filter(m => {
        const end = new Date(m.endDate);
        end.setHours(0,0,0,0);
        return end >= now;
      });
      const expiringSoon = memberships.filter(m => {
        const end = new Date(m.endDate);
        end.setHours(0,0,0,0);
        const diff = Math.ceil((end - now) / (1000*60*60*24));
        return diff >= 0 && diff <= 30;
      });
      const autoRenewOnes = memberships.filter(m => m.autoRenew);
      const expired = memberships.filter(m => {
        const end = new Date(m.endDate);
        end.setHours(0,0,0,0);
        return end < now;
      });

      // 回复生成
      if (wantWatch) {
        const video = active.filter(m => m.category === 'video').concat(active.filter(m => m.benefits?.some(b => /(视频|电影|剧|综艺|番剧)/.test(b))));
        if (video.length === 0) return '😅 目前你有效的会员里没有视频相关的权益。不过这些已过期的会员中有视频类的：' + (expired.filter(m => m.category === 'video').map(m => '~~' + m.name + '~~').join('、') || '无');
        let reply = '🎬 你可以用这些会员看剧：\n';
        video.forEach(m => {
          const status = getStatus(m);
          const benefits = m.benefits?.filter(b => /(视频|电影|剧|综艺|番剧|画质|抢先|新片|美剧|蓝光)/.test(b)).join('、') || '';
          reply += '• <span class="highlight">' + m.name + '</span>（' + status.text + '，' + (m.autoRenew ? '🔄自动续费' : '💸单次') + '）' + (benefits ? '\n  权益：' + benefits : '') + '\n';
        });
        return reply;
      }

      if (wantMusic) {
        const music = active.filter(m => m.category === 'music' || m.benefits?.some(b => /(音乐|音质|曲库|无损)/.test(b)));
        if (music.length === 0) return '😅 目前没有有效的音乐会员。';
        let reply = '🎵 你可以用这些会员听音乐：\n';
        music.forEach(m => {
          const benefits = m.benefits?.filter(b => /(音乐|音质|无损|曲库|下载)/.test(b)).join('、') || '';
          reply += '• <span class="highlight">' + m.name + '</span>' + (benefits ? '\n  权益：' + benefits : '') + '\n';
        });
        return reply;
      }

      if (wantExpiring) {
        if (expiringSoon.length === 0) return '🎉 近30天内没有即将过期的会员，很好！';
        let reply = '⏰ 以下会员即将过期，记得检查是否需要续费：\n';
        expiringSoon.forEach(m => {
          const end = new Date(m.endDate);
          end.setHours(0,0,0,0);
          const diff = Math.ceil((end - now) / (1000*60*60*24));
          reply += '• <span class="highlight">' + m.name + '</span> — ' + diff + '天后到期' + (m.autoRenew ? '（🔄自动续费中）' : '（💸单次购买）') + '\n';
        });
        const autoExpiring = expiringSoon.filter(m => m.autoRenew);
        if (autoExpiring.length > 0) {
          reply += '\n⚠️ 其中有 ' + autoExpiring.length + ' 个开启了自动续费，如果不需要记得关闭！';
        }
        return reply;
      }

      if (wantAutoRenew) {
        if (autoRenewOnes.length === 0) return '✅ 目前没有开启自动续费的会员，不用担心意外扣费。';
        let totalMonthly = 0;
        let reply = '🔄 开启自动续费的会员有 ' + autoRenewOnes.length + ' 个：\n';
        autoRenewOnes.forEach(m => {
          let monthly = m.price;
          if (m.period === 'yearly') monthly = (m.price / 12);
          else if (m.period === 'quarterly') monthly = (m.price / 3);
          else if (m.period === 'one-time') monthly = 0;
          totalMonthly += monthly;
          reply += '• <span class="highlight">' + m.name + '</span> ¥' + m.price + '/' + (periodNames[m.period] || '') + '\n';
        });
        if (totalMonthly > 0) {
          reply += '\n💰 平均每月自动续费支出约 <span class="highlight">¥' + totalMonthly.toFixed(1) + '</span>，一年约 ¥' + (totalMonthly * 12).toFixed(0) + '。';
        }
        return reply;
      }

      if (wantSaveMoney) {
        const total = memberships.reduce((s, m) => s + m.price, 0);
        const activeTotal = active.reduce((s, m) => s + m.price, 0);
        const activeAuto = active.filter(m => m.autoRenew);
        let autoMonthly = 0;
        activeAuto.forEach(m => {
          if (m.period === 'yearly') autoMonthly += m.price / 12;
          else if (m.period === 'quarterly') autoMonthly += m.price / 3;
          else if (m.period === 'monthly') autoMonthly += m.price;
        });
        let reply = '💰 你的订阅消费概览：\n';
        reply += '• 总计订阅支出：<span class="highlight">¥' + total + '</span>\n';
        reply += '• 当前有效会员：' + active.length + ' 个\n';
        reply += '• 已过期会员：' + expired.length + ' 个\n';
        if (autoMonthly > 0) {
          reply += '• 自动续费月均：<span class="highlight">约 ¥' + autoMonthly.toFixed(1) + '/月</span>\n';
        }
        if (expired.length > 0) {
          reply += '\n💡 已过期但你可能还在用的服务：' + expired.map(m => '~~' + m.name + '~~').join('、') + '。确认不需要的话可以取消订阅哦！';
        }
        return reply;
      }

      if (wantShopping) {
        const shop = active.filter(m => m.category === 'shopping' || m.benefits?.some(b => /(免邮|京豆|折扣|返利|plus)/.test(b)));
        if (shop.length === 0) return '😅 目前没有有效的购物类会员。';
        let reply = '🛒 你的购物会员权益：\n';
        shop.forEach(m => {
          const benefits = m.benefits?.join('、') || '';
          reply += '• <span class="highlight">' + m.name + '</span>\n  权益：' + benefits + '\n';
        });
        return reply;
      }

      if (wantStorage) {
        const storage = active.filter(m => m.benefits?.some(b => /(云盘|网盘|存储|空间|下载|云)/.test(b) || m.name.includes('云') || m.name.includes('网盘')));
        if (storage.length === 0) return '😅 目前没有有效的云存储会员。';
        let reply = '☁️ 你的云存储会员：\n';
        storage.forEach(m => {
          const benefits = m.benefits?.join('、') || '';
          reply += '• <span class="highlight">' + m.name + '</span>\n  权益：' + benefits + '\n';
        });
        return reply;
      }

      if (wantHealth) {
        const health = active.filter(m => m.benefits?.some(b => /(运动|健身|健康|课程|饮食|keep)/.test(b) || m.name.includes('Keep') || m.name.includes('健康')));
        if (health.length === 0) return '😅 目前没有有效的运动健康类会员。';
        let reply = '🏃 你的运动健康权益：\n';
        health.forEach(m => {
          const benefits = m.benefits?.join('、') || '';
          reply += '• <span class="highlight">' + m.name + '</span>\n  权益：' + benefits + '\n';
        });
        return reply;
      }

      if (wantTravel) {
        const travel = active.filter(m => m.category === 'travel' || m.benefits?.some(b => /(出行|酒店|机票|打车|滴滴|火车|高铁)/.test(b)));
        if (travel.length === 0) return '😅 目前没有出行类会员。';
        let reply = '✈️ 你的出行权益：\n';
        travel.forEach(m => {
          const benefits = m.benefits?.join('、') || '';
          reply += '• <span class="highlight">' + m.name + '</span>\n  权益：' + benefits + '\n';
        });
        return reply;
      }

      if (wantAll || /(列表|全部|所有|汇总|清单)/.test(q)) {
        if (active.length === 0) return '😅 目前没有任何有效的会员。';
        let reply = '📋 你共有 ' + memberships.length + ' 个会员记录，其中有效 ' + active.length + ' 个：\n';
        const cats = ['video', 'music', 'shopping', 'travel', 'other'];
        cats.forEach(cat => {
          const list = active.filter(m => m.category === cat);
          if (list.length > 0) {
            reply += '\n【' + categoryNames[cat] + '】\n';
            list.forEach(m => {
              const end = new Date(m.endDate);
              end.setHours(0,0,0,0);
              const diff = Math.ceil((end - now) / (1000*60*60*24));
              reply += '• ' + m.icon + ' <span class="highlight">' + m.name + '</span>（剩' + diff + '天）\n';
            });
          }
        });
        const autoCount = active.filter(m => m.autoRenew).length;
        if (autoCount > 0) reply += '\n⚠️ 其中有 ' + autoCount + ' 个开启了自动续费，请注意检查。';
        return reply;
      }

      // 默认回复：尝试关键词匹配
      const matched = [];
      active.forEach(m => {
        const matchName = m.name.toLowerCase().includes(q);
        const matchBenefit = m.benefits?.some(b => b.toLowerCase().includes(q) || q.includes(b));
        const matchCategory = categoryNames[m.category].toLowerCase().includes(q) || q.includes(categoryNames[m.category]);
        if (matchName || matchBenefit || matchCategory) {
          matched.push(m);
        }
      });

      if (matched.length > 0) {
        let reply = '🔍 找到以下相关会员：\n';
        matched.forEach(m => {
          const status = getStatus(m);
          reply += '• <span class="highlight">' + m.name + '</span>（' + status.text + '，' + (m.autoRenew ? '🔄自动续费' : '💸单次') + '）\n';
          if (m.benefits?.length > 0) {
            reply += '  权益：' + m.benefits.join('、') + '\n';
          }
        });
        return reply;
      }

      // 兜底回复
      return '🤔 我不太确定你想问什么。你可以试试：\n\n💡 "我想看剧"\n💡 "有什么快过期了"\n💡 "我有哪些自动续费的"\n💡 "帮我看看省钱建议"\n\n或者直接输入会员名称或权益关键词来搜索！';
    }

    // ========== START ==========
    init();
  </script>
</body>
</html>
