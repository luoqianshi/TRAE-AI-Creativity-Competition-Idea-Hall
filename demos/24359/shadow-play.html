<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幻影皮影戏 - AI Shadow Play</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "STKaiti", "KaiTi", "Ma Shan Zheng", "Noto Serif SC", serif;
            background-color: #f4e8d3;
            color: #8b0000;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .paper-texture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.15;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 100;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-size: 48px;
            font-weight: bold;
            color: #8b0000;
            margin-bottom: 10px;
            letter-spacing: 8px;
            text-shadow: 2px 2px 4px rgba(139, 0, 0, 0.2);
        }

        header h2 {
            font-size: 20px;
            color: #5c0000;
            letter-spacing: 6px;
            font-weight: normal;
        }

        .main-container {
            display: flex;
            height: calc(100vh - 140px);
            padding: 0 40px 40px;
            gap: 30px;
            position: relative;
            z-index: 10;
        }

        .control-area {
            width: 30%;
            background: rgba(255, 250, 240, 0.8);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(139, 0, 0, 0.15);
            border: 1px solid rgba(139, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        .control-area h3 {
            font-size: 24px;
            color: #8b0000;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #8b0000;
            letter-spacing: 4px;
        }

        .control-area input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid rgba(139, 0, 0, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.6);
            color: #5c0000;
            font-family: inherit;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .control-area input:focus {
            outline: none;
            border-color: #8b0000;
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.2);
        }

        .control-area input::placeholder {
            color: #a08080;
        }

        .generate-btn {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            font-family: inherit;
            background: linear-gradient(135deg, #8b0000, #6b0000);
            color: #f4e8d3;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 0, 0, 0.4);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 0, 0, 0.5);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .camera-placeholder {
            flex: 1;
            margin-top: 20px;
            border: 2px dashed rgba(139, 0, 0, 0.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8b0000;
            background: rgba(255, 255, 255, 0.3);
            min-height: 200px;
        }

        .camera-placeholder .camera-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .camera-placeholder p {
            font-size: 16px;
            letter-spacing: 2px;
        }

        .stage-area {
            width: 70%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stage {
            flex: 1;
            width: 100%;
            background: #1a1a1a;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 0 60px rgba(255, 200, 100, 0.3),
                0 10px 40px rgba(0, 0, 0, 0.5);
            border: 8px solid #5c0000;
        }

        .stage-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            background: radial-gradient(ellipse at center, 
                rgba(255, 220, 150, 0.4) 0%, 
                rgba(255, 180, 100, 0.2) 40%, 
                transparent 70%);
            pointer-events: none;
        }

        .stage-border {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 3px solid rgba(255, 200, 100, 0.3);
            border-radius: 8px;
            pointer-events: none;
        }

        .title-display {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            font-size: 28px;
            color: #f4e8d3;
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.8),
                0 0 20px rgba(255, 200, 100, 0.5);
            letter-spacing: 6px;
            white-space: nowrap;
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 20;
        }

        .shadow-puppet {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 200px;
            z-index: 15;
        }

        .shadow-puppet .head {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background: #000;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .shadow-puppet .head::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 20px;
            background: #000;
            border-radius: 50% 50% 0 0;
        }

        .shadow-puppet .body {
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 80px;
            background: #000;
            border-radius: 10px 10px 5px 5px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .shadow-puppet .left-arm,
        .shadow-puppet .right-arm {
            position: absolute;
            top: 55px;
            width: 12px;
            height: 60px;
            background: #000;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        }

        .shadow-puppet .left-arm {
            left: 10px;
            transform: rotate(-30deg);
            transform-origin: top center;
        }

        .shadow-puppet .right-arm {
            right: 10px;
            transform: rotate(30deg);
            transform-origin: top center;
        }

        .shadow-puppet .left-leg,
        .shadow-puppet .right-leg {
            position: absolute;
            top: 120px;
            width: 14px;
            height: 70px;
            background: #000;
            border-radius: 7px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        }

        .shadow-puppet .left-leg {
            left: 20px;
            transform: rotate(10deg);
        }

        .shadow-puppet .right-leg {
            right: 20px;
            transform: rotate(-10deg);
        }

        .stage-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            pointer-events: none;
        }

        .stage-info {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }

        .lantern {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lantern-top {
            width: 40px;
            height: 15px;
            background: #8b0000;
            border-radius: 5px 5px 0 0;
        }

        .lantern-body {
            width: 50px;
            height: 60px;
            background: linear-gradient(135deg, #cc0000, #8b0000);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffd700;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(204, 0, 0, 0.5);
        }

        .lantern-bottom {
            width: 40px;
            height: 15px;
            background: #8b0000;
            border-radius: 0 0 5px 5px;
        }

        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            10% { transform: translate(-50%, -50%) rotate(-15deg); }
            20% { transform: translate(-50%, -50%) rotate(15deg); }
            30% { transform: translate(-50%, -50%) rotate(-10deg); }
            40% { transform: translate(-50%, -50%) rotate(10deg); }
            50% { transform: translate(-50%, -50%) rotate(-5deg); }
            60% { transform: translate(-50%, -50%) rotate(5deg); }
            70%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
        }

        .shadow-puppet.shake {
            animation: shake 1s ease-in-out;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                height: auto;
            }
            
            .control-area,
            .stage-area {
                width: 100%;
            }
            
            .stage {
                height: 400px;
            }
            
            header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="paper-texture"></div>
    
    <header>
        <h1>幻影皮影戏</h1>
        <h2>AI Shadow Play · 用科技重塑非遗</h2>
    </header>

    <div class="main-container">
        <div class="control-area">
            <h3>AI 戏班子</h3>
            <input type="text" id="storyInput" placeholder="请输入你想演的剧情，例如：齐天大圣大闹赛博朋克城">
            <button class="generate-btn" id="generateBtn">一键生成皮影大戏</button>
            
            <div class="camera-placeholder">
                <div class="camera-icon">📷</div>
                <p>手势捕捉区域</p>
            </div>
        </div>

        <div class="stage-area">
            <div class="stage">
                <div class="stage-glow"></div>
                <div class="stage-border"></div>
                
                <div class="title-display" id="titleDisplay"></div>
                
                <div class="shadow-puppet" id="shadowPuppet">
                    <div class="head"></div>
                    <div class="body"></div>
                    <div class="left-arm"></div>
                    <div class="right-arm"></div>
                    <div class="left-leg"></div>
                    <div class="right-leg"></div>
                </div>
                
                <div class="stage-bottom"></div>
            </div>
            
            <div class="stage-info">
                <div class="lantern">
                    <div class="lantern-top"></div>
                    <div class="lantern-body">
                        <span>影</span>
                    </div>
                    <div class="lantern-bottom"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const storyInput = document.getElementById('storyInput');
        const shadowPuppet = document.getElementById('shadowPuppet');
        const titleDisplay = document.getElementById('titleDisplay');

        generateBtn.addEventListener('click', () => {
            const story = storyInput.value.trim() || '齐天大圣大闹赛博朋克城';
            
            shadowPuppet.classList.remove('shake');
            void shadowPuppet.offsetWidth;
            shadowPuppet.classList.add('shake');
            
            titleDisplay.textContent = `大戏开场：${story}`;
            titleDisplay.style.opacity = '1';
            titleDisplay.style.transform = 'translateX(-50%) translateY(0)';
            
            setTimeout(() => {
                shadowPuppet.classList.remove('shake');
            }, 1000);
        });
    </script>
</body>
</html>
