<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraeGeo WebAssembly Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #00d4ff;
            margin: 0;
        }
        .header p {
            color: #888;
            margin: 10px 0 0;
        }
        .demo-section {
            background: #252542;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .demo-section h2 {
            color: #00d4ff;
            margin: 0 0 16px;
            font-size: 1.2em;
        }
        .btn {
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn:hover {
            background: #00b8e6;
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .output {
            background: #1a1a2e;
            border-radius: 6px;
            padding: 12px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #333;
            white-space: pre-wrap;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .stat-card {
            background: #1a1a2e;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .stat-card .label {
            color: #888;
            font-size: 0.8em;
        }
        .stat-card .value {
            color: #00d4ff;
            font-size: 1.4em;
            font-weight: bold;
            margin-top: 4px;
        }
        canvas {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            background: #000;
            margin-top: 16px;
        }
        .loading {
            color: #00d4ff;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>TraeGeo WebAssembly Demo</h1>
            <p>基于 Rust + C++ 自研几何引擎的浏览器演示</p>
        </div>

        <div class="demo-section">
            <h2>1. 加载引擎</h2>
            <button class="btn" id="loadBtn">加载 TraeGeo 引擎</button>
            <div class="output" id="loadOutput">点击按钮加载 WebAssembly 模块...</div>
        </div>

        <div class="demo-section">
            <h2>2. 创建几何体</h2>
            <button class="btn" id="createBtn" disabled>创建立方体</button>
            <button class="btn" id="booleanBtn" disabled>布尔运算 (并集)</button>
            <div class="output" id="geoOutput">创建立方体并进行布尔运算...</div>
            <div class="stats" id="geoStats">
                <div class="stat-card">
                    <div class="label">实体数量</div>
                    <div class="value" id="entityCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">顶点数量</div>
                    <div class="value" id="vertexCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">三角形数量</div>
                    <div class="value" id="triangleCount">0</div>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h2>3. 3D 预览</h2>
            <canvas id="canvas"></canvas>
            <div class="output" id="renderOutput">使用 WebGL 渲染网格...</div>
        </div>
    </div>

    <script>
        const loadBtn = document.getElementById('loadBtn');
        const createBtn = document.getElementById('createBtn');
        const booleanBtn = document.getElementById('booleanBtn');
        const loadOutput = document.getElementById('loadOutput');
        const geoOutput = document.getElementById('geoOutput');
        const renderOutput = document.getElementById('renderOutput');
        const canvas = document.getElementById('canvas');
        
        let traeGeo = null;
        let box1 = null;
        let box2 = null;
        let result = null;
        let meshData = null;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = 400 * window.devicePixelRatio;
        }
        resizeCanvas();

        loadBtn.addEventListener('click', async () => {
            loadBtn.disabled = true;
            loadOutput.textContent = '正在加载 TraeGeo 引擎...';
            
            setTimeout(() => {
                traeGeo = createMockTraeGeo();
                loadOutput.textContent = '✅ 引擎加载成功！\n' +
                    '版本: ' + traeGeo.version() + '\n' +
                    '模式: JavaScript Mock (无需编译)\n' +
                    '支持: 向量运算、Brep 拓扑、布尔运算、网格生成';
                createBtn.disabled = false;
            }, 800);
        });

        createBtn.addEventListener('click', () => {
            if (!traeGeo) return;
            
            geoOutput.textContent = '正在创建立方体...';
            
            const min1 = { x: 0, y: 0, z: 0 };
            const max1 = { x: 1, y: 1, z: 1 };
            box1 = traeGeo.createBox(min1, max1);
            
            const min2 = { x: 0.5, y: 0.5, z: 0.5 };
            const max2 = { x: 1.5, y: 1.5, z: 1.5 };
            box2 = traeGeo.createBox(min2, max2);
            
            geoOutput.textContent = '✅ 创建立方体成功！\n' +
                'Box1: handle=' + box1 + ' (0,0,0)-(1,1,1)\n' +
                'Box2: handle=' + box2 + ' (0.5,0.5,0.5)-(1.5,1.5,1.5)';
            
            document.getElementById('entityCount').textContent = '2';
            booleanBtn.disabled = false;
        });

        booleanBtn.addEventListener('click', () => {
            if (!traeGeo || !box1 || !box2) return;
            
            geoOutput.textContent = '正在执行布尔并集运算...';
            
            setTimeout(() => {
                result = traeGeo.booleanUnion(box1, box2);
                
                if (result === 0) {
                    geoOutput.textContent = '❌ 布尔运算失败！';
                    return;
                }
                
                geoOutput.textContent = '✅ 布尔运算成功！\n' +
                    '结果实体: handle=' + result + '\n' +
                    '合并后范围: (0,0,0)-(1.5,1.5,1.5)';
                
                meshData = traeGeo.generateMesh(result, 0.1, 0.1);
                
                document.getElementById('entityCount').textContent = '3';
                document.getElementById('vertexCount').textContent = meshData.vertices.length / 3;
                document.getElementById('triangleCount').textContent = meshData.triangles.length / 3;
                
                renderMesh(meshData);
                
                traeGeo.deleteEntity(box1);
                traeGeo.deleteEntity(box2);
                traeGeo.freeMeshData(meshData);
            }, 500);
        });

        function createMockTraeGeo() {
            let nextHandle = 1;
            const entities = {};

            function createBoxGeometry(min, max) {
                const vertices = [];
                const v = [
                    [min.x, min.y, min.z], [max.x, min.y, min.z], [max.x, max.y, min.z], [min.x, max.y, min.z],
                    [min.x, min.y, max.z], [max.x, min.y, max.z], [max.x, max.y, max.z], [min.x, max.y, max.z]
                ];
                for (let i = 0; i < 8; i++) {
                    vertices.push(v[i][0], v[i][1], v[i][2]);
                }
                
                const triangles = [
                    0,1,2, 0,2,3, 
                    4,5,6, 4,6,7,
                    0,1,5, 0,5,4,
                    2,3,7, 2,7,6,
                    0,3,7, 0,7,4,
                    1,2,6, 1,6,5
                ];
                
                return { vertices, triangles };
            }

            return {
                version: () => '0.1.0',
                createBox: (min, max) => {
                    const handle = nextHandle++;
                    entities[handle] = { type: 'box', min, max, geometry: createBoxGeometry(min, max) };
                    return handle;
                },
                booleanUnion: (handle1, handle2) => {
                    const box1 = entities[handle1];
                    const box2 = entities[handle2];
                    if (!box1 || !box2) return 0;
                    
                    const min = {
                        x: Math.min(box1.min.x, box2.min.x),
                        y: Math.min(box1.min.y, box2.min.y),
                        z: Math.min(box1.min.z, box2.min.z)
                    };
                    const max = {
                        x: Math.max(box1.max.x, box2.max.x),
                        y: Math.max(box1.max.y, box2.max.y),
                        z: Math.max(box1.max.z, box2.max.z)
                    };
                    
                    const handle = nextHandle++;
                    entities[handle] = { type: 'box', min, max, geometry: createBoxGeometry(min, max) };
                    return handle;
                },
                generateMesh: (handle, chordTol, angleTol) => {
                    const entity = entities[handle];
                    if (!entity) return null;
                    
                    const geom = entity.geometry;
                    const normals = computeNormals(geom.vertices, geom.triangles);
                    
                    return {
                        vertices: new Float32Array(geom.vertices),
                        normals: new Float32Array(normals),
                        triangles: new Uint32Array(geom.triangles),
                        numVertices: geom.vertices.length / 3,
                        numTriangles: geom.triangles.length / 3
                    };
                },
                deleteEntity: (handle) => {
                    delete entities[handle];
                },
                freeMeshData: () => {}
            };
        }

        function computeNormals(vertices, triangles) {
            const normals = new Array(vertices.length).fill(0);
            
            for (let i = 0; i < triangles.length; i += 3) {
                const i0 = triangles[i] * 3;
                const i1 = triangles[i + 1] * 3;
                const i2 = triangles[i + 2] * 3;
                
                const v0 = [vertices[i0], vertices[i0 + 1], vertices[i0 + 2]];
                const v1 = [vertices[i1], vertices[i1 + 1], vertices[i1 + 2]];
                const v2 = [vertices[i2], vertices[i2 + 1], vertices[i2 + 2]];
                
                const e1 = [v1[0] - v0[0], v1[1] - v0[1], v1[2] - v0[2]];
                const e2 = [v2[0] - v0[0], v2[1] - v0[1], v2[2] - v0[2]];
                
                const n = [
                    e1[1] * e2[2] - e1[2] * e2[1],
                    e1[2] * e2[0] - e1[0] * e2[2],
                    e1[0] * e2[1] - e1[1] * e2[0]
                ];
                
                const len = Math.sqrt(n[0] * n[0] + n[1] * n[1] + n[2] * n[2]);
                if (len > 0) {
                    n[0] /= len;
                    n[1] /= len;
                    n[2] /= len;
                }
                
                normals[i0] += n[0];
                normals[i0 + 1] += n[1];
                normals[i0 + 2] += n[2];
                normals[i1] += n[0];
                normals[i1 + 1] += n[1];
                normals[i1 + 2] += n[2];
                normals[i2] += n[0];
                normals[i2 + 1] += n[1];
                normals[i2 + 2] += n[2];
            }
            
            for (let i = 0; i < normals.length; i += 3) {
                const len = Math.sqrt(normals[i] * normals[i] + normals[i + 1] * normals[i + 1] + normals[i + 2] * normals[i + 2]);
                if (len > 0) {
                    normals[i] /= len;
                    normals[i + 1] /= len;
                    normals[i + 2] /= len;
                }
            }
            
            return normals;
        }

        function renderMesh(mesh) {
            if (!mesh) {
                renderOutput.textContent = '❌ 无网格数据';
                return;
            }

            const gl = canvas.getContext('webgl');
            if (!gl) {
                renderOutput.textContent = '❌ WebGL 不可用';
                return;
            }

            gl.clearColor(0.1, 0.1, 0.1, 1);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.enable(gl.DEPTH_TEST);

            const vertexShaderSource = `
                attribute vec3 aPosition;
                attribute vec3 aNormal;
                uniform mat4 uProjection;
                uniform mat4 uModelView;
                varying vec3 vNormal;
                void main() {
                    gl_Position = uProjection * uModelView * vec4(aPosition, 1.0);
                    vNormal = mat3(uModelView) * aNormal;
                }
            `;

            const fragmentShaderSource = `
                precision mediump float;
                varying vec3 vNormal;
                void main() {
                    vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
                    float intensity = max(dot(normalize(vNormal), lightDir), 0.3);
                    gl_FragColor = vec4(0.0, 0.83, 1.0, 1.0) * intensity;
                }
            `;

            const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
            const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
            const program = createProgram(gl, vertexShader, fragmentShader);

            gl.useProgram(program);

            const positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, mesh.vertices, gl.STATIC_DRAW);

            const positionLocation = gl.getAttribLocation(program, 'aPosition');
            gl.enableVertexAttribArray(positionLocation);
            gl.vertexAttribPointer(positionLocation, 3, gl.FLOAT, false, 0, 0);

            const normalBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, mesh.normals, gl.STATIC_DRAW);

            const normalLocation = gl.getAttribLocation(program, 'aNormal');
            gl.enableVertexAttribArray(normalLocation);
            gl.vertexAttribPointer(normalLocation, 3, gl.FLOAT, false, 0, 0);

            const aspect = canvas.width / canvas.height;
            const projectionMatrix = createPerspectiveMatrix(45, aspect, 0.1, 100);
            const modelViewMatrix = createLookAtMatrix([2, 2, 3], [0.75, 0.75, 0.75], [0, 1, 0]);
            
            gl.viewport(0, 0, canvas.width, canvas.height);

            const projectionLocation = gl.getUniformLocation(program, 'uProjection');
            gl.uniformMatrix4fv(projectionLocation, false, projectionMatrix);

            const modelViewLocation = gl.getUniformLocation(program, 'uModelView');
            gl.uniformMatrix4fv(modelViewLocation, false, modelViewMatrix);

            gl.drawArrays(gl.TRIANGLES, 0, mesh.numTriangles * 3);

            renderOutput.textContent = '✅ WebGL 渲染成功！\n' +
                '绘制三角形: ' + mesh.numTriangles + '\n' +
                '顶点数: ' + mesh.numVertices;
        }

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        function createProgram(gl, vertexShader, fragmentShader) {
            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            return program;
        }

        function createPerspectiveMatrix(fov, aspect, near, far) {
            const f = 1.0 / Math.tan(fov * Math.PI / 360);
            const nf = 1 / (near - far);
            return new Float32Array([
                f / aspect, 0, 0, 0,
                0, f, 0, 0,
                0, 0, (far + near) * nf, -1,
                0, 0, 2 * far * near * nf, 0
            ]);
        }

        function createLookAtMatrix(eye, center, up) {
            const ex = eye[0], ey = eye[1], ez = eye[2];
            const cx = center[0], cy = center[1], cz = center[2];
            const ux = up[0], uy = up[1], uz = up[2];

            const fx = cx - ex, fy = cy - ey, fz = cz - ez;
            const len = Math.sqrt(fx * fx + fy * fy + fz * fz);
            const nx = fx / len, ny = fy / len, nz = fz / len;

            const sx = ny * uz - nz * uy, sy = nz * ux - nx * uz, sz = nx * uy - ny * ux;
            const slen = Math.sqrt(sx * sx + sy * sy + sz * sz);
            const ux2 = sx / slen, uy2 = sy / slen, uz2 = sz / slen;

            const vx = ny * uz2 - nz * uy2, vy = nz * ux2 - nx * uz2, vz = nx * uy2 - ny * ux2;

            return new Float32Array([
                nx, vx, -ux2, 0,
                ny, vy, -uy2, 0,
                nz, vz, -uz2, 0,
                -(nx * ex + ny * ey + nz * ez), -(vx * ex + vy * ey + vz * ez), ux2 * ex + uy2 * ey + uz2 * ez, 1
            ]);
        }
    </script>
</body>
</html>
