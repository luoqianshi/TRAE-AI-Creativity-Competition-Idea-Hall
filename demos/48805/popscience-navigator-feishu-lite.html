    :root {
      --page-width: min(1120px, calc(100vw - 48px));
      --shot-width: 4480;
      --shot-height: 7968;
      --radius-shell: 12px;
      --radius-card: 8px;
      --control-height: 38px;
      --hero-shadow: 0 18px 34px rgba(7, 41, 47, 0.14);
      --focus-ring: 0 0 0 2px rgba(168, 227, 232, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--zv-background);
    }

    body {
      color: var(--zv-text);
      line-height: 1.45;
      transition: background-color 180ms ease, color 180ms ease;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
      background: none;
      color: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .topbar {
      background: #040607;
      color: rgba(255, 255, 255, 0.88);
      display: flex;
      justify-content: center;
      padding: 10px 0;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-inner {
      width: min(calc(100% - 32px), 1320px);
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .topbar-nav-left,
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .topbar-nav-left {
      flex: 1 1 auto;
      justify-content: flex-start;
    }

    .topbar-actions {
      flex: 1 1 auto;
      justify-content: flex-end;
    }

    .topbar-link,
    .auth-link {
      min-height: 28px;
      padding: 0 4px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: color 140ms ease, opacity 140ms ease;
    }

    .topbar-link:hover,
    .auth-link:hover,
    .topbar-link.is-active,
    .auth-link.is-active {
      color: #ffffff;
    }

    .auth-button,
    .locale-toggle,
    .theme-toggle {
      min-height: 30px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .auth-button {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .locale-toggle {
      color: rgba(255, 255, 255, 0.9);
    }

    .locale-toggle.is-en {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.38);
    }

    .auth-button:hover,
    .locale-toggle:hover,
    .theme-toggle:hover {
      transform: translateY(-1px);
    }

    .auth-button.is-active {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.42);
    }

    .theme-toggle {
      color: rgba(255, 255, 255, 0.86);
    }

    .theme-toggle {
      width: 38px;
      padding: 0;
      font-size: 18px;
    }

    .hero {
      background: linear-gradient(180deg, #0c7480 0%, #0a6e79 100%);
      color: #fff;
      padding: 42px 0 170px;
      transition: background 180ms ease;
    }

    body[data-theme="night"] .hero {
      background: linear-gradient(180deg, #0d3941 0%, #112027 100%);
    }

    .hero-inner {
      width: var(--page-width);
      margin: 0 auto;
      text-align: center;
    }

    .section-kicker {
      margin: 0 0 14px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .brand {
      margin: 0;
      font-size: clamp(38px, 6vw, 58px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .brand .ring {
      display: inline-block;
      width: 0.9em;
      text-align: center;
      position: relative;
      transform: translateY(-0.02em);
    }

    .brand .ring::after {
      content: "";
      position: absolute;
      inset: 0.12em;
      border: 2px solid rgba(255, 255, 255, 0.96);
      border-radius: 50%;
      transform: rotate(-24deg);
    }

    .hero-summary {
      max-width: 700px;
      margin: 18px auto 28px;
      color: rgba(255, 255, 255, 0.84);
      font-size: 14px;
    }

    .hero-search {
      max-width: 540px;
      margin: 0 auto 26px;
    }

    .hero-search .searchbox {
      width: 100%;
      min-height: 42px;
      background: rgba(255, 255, 255, 0.96);
      color: #153841;
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 10px 24px rgba(7, 41, 47, 0.14);
    }

    .featured-grid,
    .hero-metrics {
      display: grid;
      gap: 24px;
      justify-content: center;
    }

    .featured-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .hero-metrics {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      text-align: left;
    }

    .metric-card {
      min-height: 112px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-card);
      box-shadow: var(--hero-shadow);
      backdrop-filter: blur(4px);
    }

    .metric-card strong {
      display: block;
      margin-bottom: 10px;
      font-size: 20px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .metric-card span {
      color: rgba(255, 255, 255, 0.82);
      font-size: 13px;
    }

    }

    .featured-card {
      width: calc(var(--w) * 1px * var(--scale));
      height: calc(var(--h) * 1px * var(--scale));
      border-radius: 6px;
      box-shadow: var(--hero-shadow);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .featured-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 34px rgba(5, 35, 40, 0.2);
    }

    .content-shell {
      width: var(--page-width);
      margin: -94px auto 0;
      position: relative;
      z-index: 2;
      background: var(--zv-surface);
      border: 1px solid var(--zv-border);
      border-radius: var(--radius-shell);
      box-shadow: var(--zv-shadow);
      overflow: hidden;
      transition: background-color 180ms ease, border-color 180ms ease;
    }

    .content-section {
      padding: 22px 24px 28px;
    }

    .content-section + .content-section {
      border-top: 1px solid var(--zv-border-soft);
    }

    .section-header {
      margin-bottom: 18px;
    }

    .section-header.centered {
      text-align: center;
    }

    .section-header h2 {
      margin: 0;
      color: var(--zv-primary);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .section-header p {
      max-width: 700px;
      margin: 10px 0 0;
      color: var(--zv-text-muted);
      font-size: 12px;
    }

    .section-header.centered p {
      margin-left: auto;
      margin-right: auto;
    }

    .toolbar {
      margin-bottom: 18px;
    }

    .toolbar-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .toolbar-row + .toolbar-row {
      margin-top: 12px;
    }

    .toolbar-controls {
      flex-wrap: wrap;
    }

    .searchbox,
    .faux-select,
    .sort-label {
      min-height: var(--control-height);
      border: 1px solid var(--zv-border);
      border-radius: 999px;
      background: var(--zv-surface-strong);
      color: var(--zv-text);
      display: inline-flex;
      align-items: center;
      transition: border-color 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .searchbox:focus-within,
    .faux-select:focus-within,
    .sort-label:focus-within,
    .field:focus-within {
      border-color: var(--zv-primary-soft);
      box-shadow: var(--focus-ring);
    }

    .searchbox {
      flex: 1 1 280px;
      padding: 0 14px;
    }

    .searchbox input {
      width: 100%;
      border: 0;
      outline: 0;
      color: inherit;
      background: transparent;
    }

    .faux-select,
    .sort-label {
      gap: 10px;
      padding: 0 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .faux-select select,
    .sort-label select {
      border: 0;
      outline: 0;
      color: inherit;
      background: transparent;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .pills-wrap {
      flex-wrap: wrap;
    }

    .pill {
      min-height: 28px;
      padding: 0 11px 0 8px;
      border-radius: 999px;
      border: 1px solid currentColor;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--zv-surface-strong);
      font-size: 10px;
      font-weight: 700;
      color: #4b6770;
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .pill:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(11, 56, 61, 0.08);
    }

    .pill.active {
      color: var(--zv-text-strong);
      background: rgba(15, 123, 134, 0.08);
      border-color: rgba(15, 123, 134, 0.4);
    }

    .pill-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid currentColor;
      position: relative;
      flex: 0 0 auto;
    }

    .pill-dot::after {
      content: "";
      position: absolute;
      top: 2px;
      right: 2px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    .pill.pink { color: #bb78a4; }
    .pill.blue { color: #58a6db; }
    .pill.cloud { color: #84bdc0; }
    .pill.green { color: #81caa4; }
    .pill.orange { color: #d78968; }
    .pill.red { color: #cb6b69; }
    .pill.leaf { color: #68b879; }
    .pill.violet { color: #b471d7; }

    .count-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      color: var(--zv-text-muted);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      flex-wrap: wrap;
    }

    .count-row strong {
      color: var(--zv-text-strong);
    }

    .project-grid,
    .org-grid,
    .info-grid {
      display: grid;
      gap: 18px;
    }

    .project-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .compact-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .org-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .info-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .project-card,
    .org-card,
    .info-card,
    .resource-card,
    .auth-form {
      background: var(--zv-surface-strong);
      border: 1px solid var(--zv-border);
      border-radius: var(--radius-card);
      box-shadow: var(--zv-shadow-soft);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    .project-card:hover,
    .org-card:hover,
    .info-card:hover,
    .resource-card:hover {
      transform: translateY(-3px);
      border-color: rgba(15, 123, 134, 0.32);
      box-shadow: 0 10px 20px rgba(7, 41, 47, 0.1);
    }

    .project-card,
    .org-card {
      padding: 10px 10px 12px;
    }

    .project-thumb,
    .org-logo {
      margin: 0 auto;
      border-radius: 4px;
    }

    .project-thumb {
      width: calc(var(--w) * 1px * var(--scale));
      height: calc(var(--h) * 1px * var(--scale));
    }

    .org-logo {
      width: calc(var(--w) * 1px * var(--scale));
      height: calc(var(--h) * 1px * var(--scale));
    }

    .project-meta {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      color: var(--zv-text-muted);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      flex-wrap: wrap;
    }

    .card-title,
    .org-title {
      margin: 10px 0 0;
      min-height: 28px;
      text-align: center;
      color: var(--zv-text);
      font-size: 9px;
      line-height: 1.5;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .pager {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .page-chip {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--zv-border);
      border-radius: 8px;
      background: var(--zv-surface-strong);
      color: var(--zv-text);
      font-size: 12px;
      font-weight: 700;
    }

    .page-chip.active {
      background: var(--zv-primary-soft);
      color: #fff;
      border-color: transparent;
    }

    .info-card {
      padding: 18px;
    }

    .info-card.mini {
      padding: 16px;
    }

    .info-card strong {
      color: var(--zv-primary);
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .info-card h3,
    .resource-card h3,
    .auth-form h3 {
      margin: 8px 0 10px;
      font-size: 16px;
      color: var(--zv-text-strong);
    }

    .info-card p,
    .resource-card p,
    .auth-copy-panel p {
      margin: 0;
      color: var(--zv-text-muted);
      font-size: 12px;
    }

    .resource-card {
      margin-top: 18px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
    }

    .resource-kicker {
      display: inline-block;
      margin-bottom: 6px;
      color: var(--zv-primary);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .resource-card a,
    .auth-submit {
      min-height: 38px;
      border-radius: 999px;
      background: var(--zv-primary);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .auth-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(340px, 420px);
      gap: 24px;
      align-items: start;
    }

    .auth-copy-panel {
      padding: 6px 0;
    }

    .auth-highlights {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .auth-form {
      padding: 20px;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid var(--zv-border);
      border-radius: 10px;
      background: var(--zv-surface);
    }

    .field span {
      font-size: 10px;
      font-weight: 800;
      color: var(--zv-primary);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .field input,
    .field select {
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
    }

    .checkbox-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 6px 0 4px;
      color: var(--zv-text-muted);
      font-size: 12px;
    }

    .checkbox-row input {
      margin-top: 2px;
    }

    .field-error {
      display: block;
      min-height: 16px;
      color: #d76f76;
      font-size: 11px;
    }

    .form-feedback {

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function getSpriteStyle(x, y, scale, width = 156, height = 143) {
  return `--x:${x};--y:${y};--scale:${scale};--w:${width};--h:${height};`;
}

function getLocalizedText(item, locale, enKey = "title", zhKey = "titleZh") {
  return locale === "zh" && item[zhKey] ? item[zhKey] : item[enKey];
}

export function getDictionary(locale = "zh") {
  return locale === "en" ? DICTIONARY.en : DICTIONARY.zh;
}

export function getViewContent(view, locale = "zh") {
  const dictionary = getDictionary(locale);
  return dictionary.hero[view] || dictionary.hero.projects;
}

export function filterProjects(projects, filters) {
  const searchQuery = (filters.searchQuery || "").trim().toLowerCase();
  const activeDiscipline = filters.activeDiscipline || "all";
  const sortMode = filters.sortMode || "featured";
  const statusFilter = filters.statusFilter || "all";
  const languageFilter = filters.languageFilter || "all";

  const filtered = projects.filter((project) => {
    const searchable = [project.title, project.titleZh].filter(Boolean).join(" ").toLowerCase();
    const matchesQuery = !searchQuery || searchable.includes(searchQuery);
    const matchesDiscipline = activeDiscipline === "all" || project.discipline === activeDiscipline;
    const matchesStatus = statusFilter === "all" || project.status === statusFilter;
    const matchesLanguage = languageFilter === "all" || project.language === languageFilter;

    return matchesQuery && matchesDiscipline && matchesStatus && matchesLanguage;
  });

  if (sortMode === "title-asc") {
    return [...filtered].sort((left, right) => left.title.localeCompare(right.title));
  }

  if (sortMode === "title-desc") {
    return [...filtered].sort((left, right) => right.title.localeCompare(left.title));
  }

  if (sortMode === "discipline") {
    return [...filtered].sort((left, right) => left.discipline.localeCompare(right.discipline));
  }

  return filtered;
}

export function paginateProjects(projects, currentPage = 1, pageSize = PAGE_SIZE) {
  const safePageSize = Math.max(1, pageSize);
  const pageCount = Math.max(1, Math.ceil(projects.length / safePageSize));
  const safePage = Math.min(Math.max(1, currentPage), pageCount);
  const startIndex = (safePage - 1) * safePageSize;
  const endIndex = startIndex + safePageSize;

  return {
    page: safePage,
    pageCount,
    total: projects.length,
    items: projects.slice(startIndex, endIndex)
  };
}

export function validateAuthFields(mode, fields, locale = "zh") {
  const copy = getDictionary(locale).auth.errors;
  const errors = {};
  const email = (fields.email || "").trim();
  const password = fields.password || "";

  if (!email) errors.email = copy.email;
  if (!password) errors.password = copy.password;

  if (mode === "register") {
    const fullName = (fields.fullName || "").trim();
    const confirmPassword = fields.confirmPassword || "";

    if (!fullName) errors.fullName = copy.fullName;
    if (!confirmPassword) {
      errors.confirmPassword = copy.confirmRequired;
    } else if (confirmPassword !== password) {
      errors.confirmPassword = copy.confirmMismatch;
    }

    if (!fields.acceptedTerms) {
      errors.acceptedTerms = copy.acceptedTerms;
    }
  }

  return {
    isValid: Object.keys(errors).length === 0,
    errors
  };
}

function buildCurrentView(state) {
  if (state.activeView === "participate") return buildParticipateView(state);
  if (state.activeView === "about") return buildAboutView(state);
  if (state.activeView === "signin") return buildAuthView("signin", state);
  if (state.activeView === "register") return buildAuthView("register", state);
  return buildProjectsView(state);
}

function renderHero(state) {
  const content = getViewContent(state.activeView, state.locale);
  const kicker = document.querySelector("[data-hero-kicker]");
  const title = document.querySelector("[data-hero-title]");
  const summary = document.querySelector("[data-hero-summary]");
  const panel = document.querySelector("[data-hero-panel]");

  if (!kicker || !title || !summary || !panel) return;

  kicker.textContent = content.kicker;
  title.textContent = content.title;
  summary.textContent = content.summary;
  panel.innerHTML = content.heroMode === "featured" ? buildFeaturedCards(state.locale) : buildMetricCards(state.activeView, state.locale);
}

function renderMain(state) {
  const target = document.querySelector("[data-main-content]");
  const shell = document.querySelector(".content-shell");
  if (!target) return;
  target.innerHTML = buildCurrentView(state);
  if (shell) {
    shell.hidden = state.activeView === "projects";
  }
}

function renderShell(state) {
  const copy = getDictionary(state.locale);
  document.documentElement.lang = state.locale === "zh" ? "zh-CN" : "en";
  document.title = copy.documentTitle;

  document.querySelector('[data-nav-target="projects"]').textContent = copy.shell.nav.projects;
  document.querySelector('[data-nav-target="participate"]').textContent = copy.shell.nav.participate;
  document.querySelector('[data-nav-target="about"]').textContent = copy.shell.nav.about;
  document.querySelector('[data-nav-target="signin"]').textContent = copy.shell.auth.signin;
  document.querySelector('[data-nav-target="register"]').textContent = copy.shell.auth.register;
  const globalSearch = document.querySelector("[data-global-search]");
  const globalSearchLabel = document.querySelector("[data-global-search-label]");
  const globalSearchInput = document.querySelector("[data-global-search-input]");

  const footerBrand = document.querySelector("[data-footer-brand]");
  if (footerBrand) footerBrand.textContent = copy.shell.footerBrand;
  if (globalSearch) globalSearch.hidden = state.activeView !== "projects";
  if (globalSearchLabel) globalSearchLabel.textContent = getDictionary(state.locale).projects.searchLabel;
  if (globalSearchInput) {
    globalSearchInput.placeholder = getDictionary(state.locale).projects.searchPlaceholder;
    globalSearchInput.value = state.searchQuery;
  }
}

function syncControls(state) {
  const copy = getDictionary(state.locale);
  document.body.dataset.theme = state.theme;

  document.querySelectorAll("[data-nav-target]").forEach((button) => {
    const isActive = button.dataset.navTarget === state.activeView;
    button.classList.toggle("is-active", isActive);
    if (button.classList.contains("topbar-link")) {
      button.setAttribute("aria-selected", String(isActive));
    }
  });

  const localeToggle = document.querySelector("[data-locale-toggle]");
  if (localeToggle) {
    localeToggle.setAttribute("aria-label", copy.shell.locale.aria);
    localeToggle.classList.toggle("is-en", state.locale === "en");
    localeToggle.querySelector("[data-locale-primary]").textContent = copy.shell.locale.primary;
    localeToggle.querySelector("[data-locale-secondary]").textContent = copy.shell.locale.secondary;
  }

  const themeToggle = document.querySelector("[data-theme-toggle]");
  if (themeToggle) {
    const isNight = state.theme === "night";
    themeToggle.setAttribute("aria-pressed", String(isNight));
    themeToggle.setAttribute("aria-label", isNight ? copy.shell.theme.nightLabel : copy.shell.theme.dayLabel);
    themeToggle.querySelector("[data-theme-icon]").textContent = isNight ? copy.shell.theme.nightIcon : copy.shell.theme.dayIcon;
  }
}

function renderApp(state) {
  renderShell(state);
  renderHero(state);
  renderMain(state);
  syncControls(state);
}

function setActiveView(state, nextView) {
  state.activeView = nextView;
  if (nextView === "projects") {
    const pageCount = paginateProjects(filterProjects(projectCatalog, state), state.currentPage, PAGE_SIZE).pageCount;
    state.currentPage = Math.min(state.currentPage, pageCount);
  }
  renderApp(state);
}

function setTheme(state, nextTheme) {
  state.theme = nextTheme;
  window.localStorage.setItem(THEME_KEY, nextTheme);
  renderApp(state);
}

function setLocale(state, nextLocale) {
  state.locale = nextLocale === "en" ? "en" : "zh";
  window.localStorage.setItem(LOCALE_KEY, state.locale);
  renderApp(state);
}

function readFormFields(form) {
  const fields = Object.fromEntries(new FormData(form).entries());
  fields.acceptedTerms = form.querySelector('[name="acceptedTerms"]')?.checked || false;
  return fields;
}

function renderFormErrors(form, errors) {
  form.querySelectorAll("[data-error-for]").forEach((node) => {
    const fieldName = node.dataset.errorFor;
    node.textContent = errors[fieldName] || "";
  });
}

function handleFormSubmit(state, form) {
  const mode = form.dataset.formMode;
  const fields = readFormFields(form);
  const authCopy = getDictionary(state.locale).auth;
  const sectionCopy = authCopy[mode];
  const result = validateAuthFields(mode, fields, state.locale);
  renderFormErrors(form, result.errors);

  const feedback = form.querySelector("[data-form-feedback]");
  if (!feedback) return;

  if (result.isValid) {
    feedback.textContent = sectionCopy.success;
    feedback.classList.add("is-success");
  } else {
    feedback.textContent = authCopy.errors.generic;
    feedback.classList.remove("is-success");
  }
}

function attachEvents(state) {
  document.addEventListener("click", (event) => {
    const target = event.target;
    const navButton = target.closest("[data-nav-target]");
    if (navButton) {
      setActiveView(state, navButton.dataset.navTarget);
      return;
    }

    const localeToggle = target.closest("[data-locale-toggle]");
    if (localeToggle) {
      setLocale(state, state.locale === "zh" ? "en" : "zh");
      return;
    }

    const themeToggle = target.closest("[data-theme-toggle]");
    if (themeToggle) {
      setTheme(state, state.theme === "day" ? "night" : "day");
      return;
    }

    const disciplineButton = target.closest("[data-discipline]");
    if (disciplineButton) {
      state.activeDiscipline = disciplineButton.dataset.discipline;
      state.currentPage = 1;
      renderApp(state);
      return;
    }

    const pageButton = target.closest("[data-page]");
    if (pageButton) {
      state.currentPage = Number(pageButton.dataset.page);
      renderApp(state);
    }
  });

  document.addEventListener("input", (event) => {
    const target = event.target;
    if (target.matches("[data-search-input]")) {
      state.searchQuery = target.value;
      state.currentPage = 1;
      renderApp(state);
    }
  });

  document.addEventListener("change", (event) => {
    const target = event.target;

    if (target.matches("[data-status-select]")) {
      state.statusFilter = target.value;
      state.currentPage = 1;
      renderApp(state);
      return;
    }

    if (target.matches("[data-language-select]")) {
      state.languageFilter = target.value;
      state.currentPage = 1;
      renderApp(state);
      return;
    }

    if (target.matches("[data-sort-select]")) {
      state.sortMode = target.value;
      state.currentPage = 1;
      renderApp(state);
      return;
    }

    const form = target.closest("[data-form-mode]");
    if (form) {
      renderFormErrors(form, validateAuthFields(form.dataset.formMode, readFormFields(form), state.locale).errors);
    }
  });

  document.addEventListener("submit", (event) => {
    const form = event.target.closest("[data-form-mode]");
    if (!form) return;
    event.preventDefault();
    handleFormSubmit(state, form);
  });
}

export function initApp() {
  const appRoot = document.querySelector("[data-app-root]");
  if (!appRoot) {
    return createInitialState();
  }

  const state = createInitialState(
    window.localStorage.getItem(THEME_KEY),
    window.localStorage.getItem(LOCALE_KEY)
  );

  attachEvents(state);
  renderApp(state);
  return state;
}

if (typeof document !== "undefined" && document.querySelector("[data-app-root]")) {
  initApp();
}
</script></body></html>
