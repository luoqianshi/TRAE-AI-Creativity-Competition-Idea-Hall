<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart RSS Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flexsearch/0.7.31/flexsearch.bundle.js"></script>
<script src="https://unpkg.com/@mozilla/readability@0.5.0/Readability.js"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        brand: {
          50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
          400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
          800: '#1e40af', 900: '#1e3a8a'
        }
      },
      fontFamily: {
        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
        mono: ['"JetBrains Mono"', 'Consolas', 'Monaco', 'monospace']
      }
    }
  }
}
</script>
<style>
  /* ===== CSS Custom Properties (Theme System) ===== */
  :root, html.dark {
    --bg-body: #0f172a;
    --bg-header: rgba(15,23,42,0.7);
    --bg-sidebar: rgba(15,23,42,0.4);
    --bg-card: rgba(30,41,59,0.6);
    --bg-card-read: rgba(30,41,59,0.4);
    --bg-input: rgba(15,23,42,0.5);
    --bg-modal-overlay: rgba(2,6,23,0.7);
    --bg-reader: #0f172a;
    --bg-hover: rgba(148,163,184,0.08);
    --bg-hover-strong: rgba(148,163,184,0.12);
    --bg-active: rgba(59,130,246,0.15);
    --bg-tag: rgba(59,130,246,0.15);
    --bg-note: rgba(16,185,129,0.1);
    --bg-skel-base: rgba(148,163,184,0.08);
    --bg-skel-shine: rgba(148,163,184,0.18);

    --text-primary: #e2e8f0;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    --text-brand: #60a5fa;
    --text-tag: #93c5fd;
    --text-inverse: #ffffff;

    --border-default: rgba(148,163,184,0.12);
    --border-strong: rgba(148,163,184,0.2);
    --border-tag: rgba(59,130,246,0.25);
    --border-divider: rgba(148,163,184,0.15);

    --btn-secondary-bg: rgba(148,163,184,0.1);
    --btn-secondary-hover: rgba(148,163,184,0.18);
    --btn-secondary-text: #e2e8f0;
    --btn-secondary-border: rgba(148,163,184,0.2);
    --btn-ghost-color: #cbd5e1;
    --btn-ghost-hover-bg: rgba(148,163,184,0.12);

    --scrollbar-thumb: rgba(148,163,184,0.25);
    --scrollbar-thumb-hover: rgba(148,163,184,0.45);

    --reader-link: #60a5fa;
    --reader-code-bg: rgba(15,23,42,0.8);
    --reader-code-text: #e2e8f0;
    --reader-code-inline: rgba(15,23,42,0.6);
    --reader-blockquote-border: #3b82f6;
    --reader-blockquote-bg: rgba(59,130,246,0.05);
    --reader-blockquote-text: #94a3b8;
    --reader-table-border: rgba(148,163,184,0.2);

    --color-success: #10b981;
    --color-error: #ef4444;
    --color-warning: #f59e0b;
    --color-star: #f59e0b;
    --color-info: #8b5cf6;

    --brand-400: #60a5fa;
    --brand-500: #3b82f6;
    --brand-600: #2563eb;

    --progress-track: rgba(148,163,184,0.15);
    --progress-fill: linear-gradient(90deg, #3b82f6, #2563eb);
    --card-shadow: 0 8px 24px -8px rgba(0,0,0,0.35);
  }

  html.light {
    --bg-body: #f8fafc;
    --bg-header: rgba(248,250,252,0.85);
    --bg-sidebar: rgba(248,250,252,0.7);
    --bg-card: #ffffff;
    --bg-card-read: rgba(248,250,252,0.9);
    --bg-input: #ffffff;
    --bg-modal-overlay: rgba(2,6,23,0.5);
    --bg-reader: #ffffff;
    --bg-hover: rgba(15,23,42,0.05);
    --bg-hover-strong: rgba(15,23,42,0.08);
    --bg-active: rgba(37,99,235,0.08);
    --bg-tag: rgba(37,99,235,0.08);
    --bg-note: rgba(16,185,129,0.08);
    --bg-skel-base: rgba(15,23,42,0.05);
    --bg-skel-shine: rgba(15,23,42,0.1);

    --text-primary: #0f172a;
    --text-secondary: #1e293b;
    --text-muted: #475569;
    --text-dim: #94a3b8;
    --text-brand: #2563eb;
    --text-tag: #1d4ed8;

    --border-default: rgba(15,23,42,0.08);
    --border-strong: rgba(15,23,42,0.15);
    --border-tag: rgba(37,99,235,0.2);
    --border-divider: rgba(15,23,42,0.08);

    --btn-secondary-bg: rgba(15,23,42,0.05);
    --btn-secondary-hover: rgba(15,23,42,0.1);
    --btn-secondary-text: #0f172a;
    --btn-secondary-border: rgba(15,23,42,0.15);
    --btn-ghost-color: #334155;
    --btn-ghost-hover-bg: rgba(15,23,42,0.06);

    --scrollbar-thumb: rgba(15,23,42,0.15);
    --scrollbar-thumb-hover: rgba(15,23,42,0.25);

    --reader-link: #2563eb;
    --reader-code-bg: #0f172a;
    --reader-code-text: #e2e8f0;
    --reader-code-inline: #1e293b;
    --reader-blockquote-border: #3b82f6;
    --reader-blockquote-bg: rgba(59,130,246,0.03);
    --reader-blockquote-text: #475569;
    --reader-table-border: rgba(15,23,42,0.12);

    --card-shadow: 0 4px 16px -4px rgba(0,0,0,0.08);
  }

  /* ===== Base ===== */
  html, body { height: 100%; }
  body { background: var(--bg-body); color: var(--text-primary); transition: background .2s, color .2s; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  /* ===== Scrollbar ===== */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

  /* ===== Skeleton shimmer ===== */
  .skeleton {
    background: linear-gradient(90deg, var(--bg-skel-base) 25%, var(--bg-skel-shine) 50%, var(--bg-skel-base) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.6s infinite;
  }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

  /* ===== Reader content ===== */
  .reader-content { line-height: 1.8; font-size: 17px; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .reader-content p { margin: 1em 0; }
  .reader-content h1, .reader-content h2, .reader-content h3 { font-weight: 600; margin: 1.5em 0 .5em; line-height: 1.35; }
  .reader-content h1 { font-size: 1.6em; }
  .reader-content h2 { font-size: 1.35em; }
  .reader-content h3 { font-size: 1.15em; }
  .reader-content img { max-width: 100%; border-radius: .5rem; margin: 1em auto; display: block; }
  .reader-content pre { background: var(--reader-code-bg); color: var(--reader-code-text); padding: 1em; border-radius: .5rem; overflow-x: auto; font-size: .9em; font-family: 'JetBrains Mono', Consolas, Monaco, monospace; }
  .reader-content code { background: var(--reader-code-inline); color: var(--reader-code-text); padding: 2px 6px; border-radius: 4px; font-size: .9em; font-family: 'JetBrains Mono', Consolas, Monaco, monospace; }
  .reader-content pre code { background: transparent; padding: 0; }
  .reader-content blockquote { border-left: 3px solid var(--reader-blockquote-border); padding: .5em 1em; color: var(--reader-blockquote-text); margin: 1em 0; background: var(--reader-blockquote-bg); border-radius: 4px; }
  .reader-content a { color: var(--reader-link); text-decoration: underline; }
  .reader-content ul, .reader-content ol { margin: 1em 0; padding-left: 1.5em; }
  .reader-content li { margin: .3em 0; }
  .reader-content table { border-collapse: collapse; margin: 1em 0; }
  .reader-content th, .reader-content td { border: 1px solid var(--reader-table-border); padding: .5em .75em; }

  /* ===== Card hover ===== */
  .article-card { transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease; }
  .article-card:hover { transform: translateY(-2px); box-shadow: var(--card-shadow); }
  .article-card:active { transform: translateY(0) scale(0.998); }

  /* ===== Toast ===== */
  .toast-wrap { pointer-events: none; }
  .toast { pointer-events: auto; animation: toastIn .25s ease; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== Modal ===== */
  .modal-backdrop { animation: fadeIn .2s ease; }
  .modal-panel { animation: popIn .22s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

  /* ===== Buttons ===== */
  .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .45rem .75rem; border-radius: .5rem; font-size: .875rem; transition: background .15s, color .15s, transform .1s; cursor: pointer; user-select: none; border: 1px solid transparent; }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--brand-600); color: var(--text-inverse); }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary { background: var(--btn-secondary-bg); color: var(--btn-secondary-text); border-color: var(--btn-secondary-border); }
  .btn-secondary:hover { background: var(--btn-secondary-hover); }
  .btn-ghost { background: transparent; color: var(--btn-ghost-color); }
  .btn-ghost:hover { background: var(--btn-ghost-hover-bg); }

  /* ===== Tag pill ===== */
  .tag-pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 9999px; font-size: 11px; background: var(--bg-tag); color: var(--text-tag); border: 1px solid var(--border-tag); }

  /* ===== Sidebar item ===== */
  .side-item { transition: background .15s; }
  .side-item:hover { background: var(--bg-hover); }

  /* ===== Form inputs ===== */
  input[type="text"], input[type="number"], input[type="url"], input[type="email"], textarea, select {
    background: var(--bg-input); border: 1px solid var(--border-strong); border-radius: .5rem;
    padding: .5rem .75rem; color: var(--text-primary); outline: none; transition: border-color .15s, box-shadow .15s;
    font-size: .875rem;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--brand-500); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }

  /* ===== Panels ===== */
  .card-panel { background: var(--bg-card); border: 1px solid var(--border-default); border-radius: .75rem; backdrop-filter: blur(8px); }
  .divider { border-color: var(--border-divider); }

  /* ===== Checkbox ===== */
  .checkbox { appearance: none; width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid rgba(148,163,184,0.4); background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background .15s, border-color .15s; position: relative; flex-shrink: 0; }
  .checkbox:checked { background: var(--brand-600); border-color: var(--brand-600); }
  .checkbox:checked::after { content: ""; width: 8px; height: 4px; border-left: 2px solid white; border-bottom: 2px solid white; transform: rotate(-45deg) translate(1px,-1px); }

  /* ===== Progress bar ===== */
  .progress-bar { height: 6px; background: var(--progress-track); border-radius: 9999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--progress-fill); transition: width .2s; }

  /* ===== Mobile sidebar ===== */
  @media (max-width: 767px) {
    #sidebar { position: fixed; z-index: 50; left: 0; top: 0; bottom: 0; width: 280px; transform: translateX(-100%); transition: transform .25s ease; box-shadow: 4px 0 24px rgba(0,0,0,0.3); }
    #sidebar.open { transform: translateX(0); }
    #sidebar-backdrop { display: none; position: fixed; inset: 0; z-index: 45; background: rgba(0,0,0,0.4); }
    #sidebar-backdrop.open { display: block; }
    .hamburger { display: inline-flex !important; }
    .header-actions-more { position: relative; }
    .header-actions-more .dropdown { display: none; position: absolute; top: 100%; right: 0; z-index: 60; min-width: 180px; padding: .25rem; margin-top: .25rem; }
    .header-actions-more .dropdown.open { display: block; }
  }
  @media (min-width: 768px) {
    .hamburger { display: none !important; }
    #sidebar-backdrop { display: none !important; }
  }

  /* ===== Reader view ===== */
  #reader-view { background: var(--bg-reader); }
  html.light #reader-view pre { background: #0f172a; color: #e2e8f0; }
  html.light #reader-view code { background: #1e293b; color: #e2e8f0; }

  /* ===== Text utilities ===== */
  .c-primary { color: var(--text-primary); }
  .c-secondary { color: var(--text-secondary); }
  .c-muted { color: var(--text-muted); }
  .c-dim { color: var(--text-dim); }
  .c-brand { color: var(--text-brand); }
  .c-star { color: var(--color-star); }

  /* Override Tailwind text-slate-* for light mode */
  html.light .text-slate-100, html.light .text-slate-200, html.light .text-slate-300 { color: var(--text-primary) !important; }
  html.light .text-slate-400, html.light .text-slate-500 { color: var(--text-muted) !important; }
  html.light .text-slate-600, html.light .text-slate-700 { color: var(--text-dim) !important; }
  html.light .border-slate-700, html.light .border-slate-600 { border-color: var(--border-strong) !important; }
  html.light .bg-slate-800 { background: var(--bg-card) !important; }
</style>
</head>

        categories: Object.assign({}, DEFAULT_SETTINGS.categories, parsed.categories || {}),

// ========== CORS Proxy Queue (multi-strategy) ==========
const PROXY = {
  // Strategy 1: rss2json.com — dedicated RSS-to-JSON API, stable CORS
  async fetchViaRss2Json(rawUrl) {
    const apiUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rawUrl);
    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), 10000);
    const res = await fetch(apiUrl, { signal: controller.signal });
    clearTimeout(tid);
    if (!res.ok) throw new Error('rss2json HTTP ' + res.status);
    const json = await res.json();
    if (json.status !== 'ok') throw new Error('rss2json status: ' + json.status);
    // Convert rss2json items back to our article format
    const items = (json.items || []).map(item => {
      let pubDate = Date.parse(item.pubDate) || Date.parse(item.published) || Date.now();
      return {
        url: sanitizeUrl(item.link || item.url || ''),
        title: item.title || '',
        description: item.description || item.content || '',
        content: item.content || item.description || '',
        pubDate,
        fullContentFetched: true // rss2json already gives us content
      };
    });
    return { type: 'rss2json', items, feedTitle: json.title || '', feedDescription: json.description || '' };
  },

  // Strategy 2: CORS proxy — returns raw XML
  async fetchViaProxy(rawUrl, proxyUrl) {
    const encoded = proxyUrl + encodeURIComponent(rawUrl);
    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), 8000);
    const res = await fetch(encoded, { signal: controller.signal });
    clearTimeout(tid);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let text = await res.text();
    // allorigins /get returns JSON wrapper
    if (proxyUrl.includes('allorigins') && proxyUrl.includes('/get')) {
      try { const j = JSON.parse(text); text = j.contents || text; } catch(e) {}
    }
    return { type: 'raw', text };
  },

  // Main fetch: tries rss2json first, then each proxy in order
  async fetch(rawUrl) {
    const proxies = (STATE.settings.proxies || []).slice();
    let lastErr;

    // Try rss2json first (most reliable for RSS)
    try {
      const result = await this.fetchViaRss2Json(rawUrl);
      return { ok: true, result, strategy: 'rss2json' };
    } catch (err) { lastErr = err; }

    // Try each proxy
    for (let i = 0; i < proxies.length; i++) {
      try {
        const result = await this.fetchViaProxy(rawUrl, proxies[i]);
        // Move working proxy to front
        STATE.settings.proxies = [proxies[i], ...proxies.filter((_, j) => j !== i)];
        saveSettings();
        return { ok: true, result, strategy: 'proxy' };
      } catch (err) { lastErr = err; }
    }

    return { ok: false, error: lastErr || new Error('所有策略失败') };
  }
};

// ========== RSS Parser ==========
function parseRSS(xmlText, feedUrl, feedMeta) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, 'text/xml');
  if (!doc || doc.querySelector('parsererror')) return [];
  const items = [];
  // RSS 2.0
  const rssItems = doc.querySelectorAll('rss item, rdf\:RDF item');
  rssItems.forEach(node => items.push(node));
  // Atom
  const atomEntries = doc.querySelectorAll('feed entry');
  atomEntries.forEach(node => items.push(node));
  const articles = [];
  for (const item of items) {
    let title = '';
    const tNode = item.querySelector('title');
    if (tNode) title = (tNode.textContent || '').trim();
    // description / summary / content
    let description = '';
    const dNodes = [item.querySelector('description'), item.querySelector('summary'), item.querySelector('content')].filter(Boolean);
    for (const dn of dNodes) { if (dn.textContent) { description = dn.textContent; break; } }
    // link
    let link = '';
    const linkNode = item.querySelector('link');
    if (linkNode) {
      if (linkNode.getAttribute && linkNode.getAttribute('href')) link = linkNode.getAttribute('href');
      else link = (linkNode.textContent || '').trim();
    }
    // pubDate
    let pubDate = 0;
    const dateCandidates = ['pubDate','published','updated','dc\:date','date'];
    for (const tag of dateCandidates) {
      const n = item.getElementsByTagName(tag)[0];
      if (n && n.textContent) { const t = Date.parse(n.textContent); if (t) { pubDate = t; break; } }
    }
    if (!pubDate) pubDate = Date.now();
    // tags (category)
    const tags = [];
    const catNodes = item.querySelectorAll('category');
    catNodes.forEach(n => { const v = (n.textContent || '').trim(); if (v) tags.push(v); });
    // fallback
    if (!link) continue;
    const cleanUrl = sanitizeUrl(link);
    const urlHash = hashCode(cleanUrl);
    articles.push({
      urlHash,
      url: cleanUrl,
      title: title || '无标题',
      description: description || '',
      content: '',
      pubDate,
      feedUrl,
      feedName: feedMeta.name,
      category: feedMeta.category || '',
      tags,
      isRead: false,
      isStarred: false,
      isLater: false,
      notes: '',
      readTime: 0,
      scrollDepth: 0,
      fullContentFetched: false,
      fetchedAt: Date.now()
    });
  }
  return articles;
}

// ========== Rules Engine ==========
function applyRules(article) {
  const rules = (STATE.settings.rules || []).filter(r => r.enabled);
  if (!rules.length) return article;
  rules.sort((a,b) => (a.priority||0) - (b.priority||0));
  let changed = false;
  for (const rule of rules) {
    try {
      if (ruleMatches(article, rule)) {
        const before = JSON.stringify({ isRead: article.isRead, isStarred: article.isStarred, isLater: article.isLater, category: article.category, tags: article.tags });
        const actions = rule.actions || {};
        if (actions.star) article.isStarred = true;
        if (actions.later) article.isLater = true;
        if (actions.read) article.isRead = true;
        if (actions.category) article.category = actions.category;
        if (actions.addTags && actions.addTags.length) {
          const set = new Set(article.tags || []);
          actions.addTags.forEach(t => set.add(t));
          article.tags = Array.from(set);
        }
        if (JSON.stringify({ isRead: article.isRead, isStarred: article.isStarred, isLater: article.isLater, category: article.category, tags: article.tags }) !== before) changed = true;
        if (!STATE.settings.runAllRules) break;
      }
    } catch (err) { console.warn('rule error', err); }
  }
  return article;
}
function ruleMatches(article, rule) {
  const cond = rule.condition || {};
  const type = cond.type;
  const val = (cond.value || '').toString();
  if (type === 'title_contains') return (article.title || '').toLowerCase().includes(val.toLowerCase());
  if (type === 'title_not_contains') return !((article.title || '').toLowerCase().includes(val.toLowerCase()));
  if (type === 'title_regex') {
    try { const re = new RegExp(val, 'i'); return re.test(article.title || ''); }
    catch (err) { return false; }
  }
  if (type === 'feed_equals') return (article.feedName || '').toLowerCase() === val.toLowerCase();
  if (type === 'words_gt' || type === 'words_lt') {
    const wc = (stripHTML(article.description || '') + ' ' + stripHTML(article.content || '')).trim().split(/\s+/).filter(Boolean).length;
    const n = parseInt(val, 10) || 0;
    return type === 'words_gt' ? wc > n : wc < n;
  }
  if (type === 'within_hours') {
    const h = parseInt(val,10) || 0;
    return (Date.now() - article.pubDate) < h * 3600 * 1000;
  }
  return false;
}

// ========== Search (FlexSearch) ==========
const SearchIdx = {
  _idx: null,
  ready: false,
  init() {
    if (typeof FlexSearch === 'undefined') return;
    try {
      this._idx = new FlexSearch.Document({
        document: { id: 'urlHash', index: ['title','description','content','feedName','notes','tags'] },
        tokenize: 'forward',
        encode: 'balance',
        cache: 100
      });
      this.ready = true;
    } catch(e) { console.warn('search init failed', e); }
  },
  add(article) {
    if (!this.ready || !this._idx) return;
    try {
      this._idx.add({
        id: article.urlHash,
        title: article.title || '',
        description: article.description || '',
        content: article.content || '',
        feedName: article.feedName || '',
        notes: article.notes || '',
        tags: (article.tags || []).join(' ')
      });
    } catch(e){}
  },
  addAll(list) { list.forEach(a => this.add(a)); },
  async search(q) {
    if (!this.ready || !this._idx || !q) return null;
    try {
      const res = await this._idx.search(q, { limit: 10000 });
      const ids = new Set();
      res.forEach(r => (r.result || []).forEach(id => ids.add(id)));
      return ids;
    } catch(e) { return null; }
  },
  remove(id) { if (this.ready && this._idx) try { this._idx.remove(id); } catch(e){} },
  update(article) {
    if (!this.ready || !this._idx) return;
    this.remove(article.urlHash);
    this.add(article);
  }
};

// ========== Refresh / Feeds (incremental) ==========
async function refreshAll(showToastOnFinish) {
  if (refreshAll._running) { if (showToastOnFinish) toast('正在刷新中...'); return; }
  refreshAll._running = true;
  const feeds = (await DB.getAllFeeds()).filter(f => f && f.enabled);
  if (!feeds.length) { toast('未启用任何订阅源', 'error'); refreshAll._running = false; return; }
  // Reset search index once at start
  SearchIdx.init();
  const allExisting = await DB.getAllArticles();
  if (allExisting.length) SearchIdx.addAll(allExisting);
  // Show progress bar
  const container = $('#articles-list');
  container.innerHTML = renderProgressBar(0, feeds.length);
  let okCount = 0, totalInserted = 0, completed = 0;
  const maxConcurrent = 4;
  try {
    for (let batchStart = 0; batchStart < feeds.length; batchStart += maxConcurrent) {
      const batch = feeds.slice(batchStart, batchStart + maxConcurrent);
      const batchResults = await Promise.allSettled(batch.map(async f => {
        try {
          const fetchResult = await PROXY.fetch(f.url);
          let articles = [];
          if (fetchResult.ok) {
            if (fetchResult.strategy === 'rss2json') {
              articles = (fetchResult.result.items || []).map(item => {
                const cleanUrl = sanitizeUrl(item.url);
                return {
                  urlHash: hashCode(cleanUrl), url: cleanUrl,
                  title: item.title || '无标题',
                  description: item.description || '',
                  content: item.content || '',
                  pubDate: item.pubDate,
                  feedUrl: f.url, feedName: f.name, category: f.category || '',
                  tags: [], isRead: false, isStarred: false, isLater: false,
                  notes: '', readTime: 0, scrollDepth: 0,
                  fullContentFetched: true, fetchedAt: Date.now()
                };
              });
            } else {
              articles = parseRSS(fetchResult.result.text, f.url, f);
            }
          }
          if (articles.length) {
            articles.forEach(a => applyRules(a));
            const stats = await DB.bulkSaveArticles(articles);
            articles.forEach(a => SearchIdx.add(a));
            return { feed: f, count: stats.inserted, updated: stats.updated };
          }
          return { feed: f, count: 0 };
        } catch (err) { return { feed: f, error: err, count: 0 }; }
      }));
      completed += batch.length;
      batchResults.forEach(r => {
        if (r.status === 'fulfilled') { okCount++; totalInserted += r.value.count || 0; }
      });
      // Update progress bar
      container.innerHTML = renderProgressBar(completed, feeds.length);
      // Re-render articles incrementally
      await renderArticles(true);
    }
    await renderSidebar();
    if (showToastOnFinish) toast('刷新完成 ' + okCount + '/' + feeds.length + '，新增 ' + totalInserted + ' 篇', 'success');
  } catch (err) {
    console.error(err);
    toast('刷新失败：' + (err.message || err), 'error');
  } finally {
    refreshAll._running = false;
  }
}
function renderProgressBar(done, total) {
  const pct = Math.round(done / Math.max(1, total) * 100);
  return '<div class="card-panel p-6 text-center"><div class="text-sm text-slate-400 mb-3">正在刷新 ' + done + '/' + total + ' 个订阅源</div><div class="progress-bar max-w-md mx-auto"><div class="progress-fill" style="width:' + pct + '%"></div></div><div class="text-xs text-slate-500 mt-2">' + pct + '%</div></div>';
}

    DB.countByIndex('isStarred', 1),

  ]);

  catList.appendChild(allBtn);

  catList.appendChild(starredBtn);
  const laterBtn = renderSidebarItem('稍后读', laterCount, () => setFilter({ status: 'later' }), STATE.activeFilter.status === 'later', '#8b5cf6');
  catList.appendChild(laterBtn);
  const unreadBtn = renderSidebarItem('未读', totalUnread, () => setFilter({ status: 'unread' }), STATE.activeFilter.status === 'unread', '#10b981');
  catList.appendChild(unreadBtn);

  // Category section below
  const feedList = $('#feed-list');
  feedList.innerHTML = '';
  const catListContainer = $('#category-list');
  catListContainer.innerHTML = '';
  // Group by category
  const byCat = {};
  STATE.feeds.forEach(f => {
    const c = f.category || '未分类';
    if (!byCat[c]) byCat[c] = [];
    byCat[c].push(f);
  });
  const catColorMap = STATE.settings.categories || {};
  Object.keys(byCat).sort().forEach(cat => {
    // Category header goes in category-list
    const catRow = el('div', { class: 'flex items-center gap-2 px-2 py-1 rounded-md cursor-pointer side-item text-sm' });
    const colorDot = el('span', { class: 'inline-block w-2 h-2 rounded-full flex-shrink-0', style: 'background:' + (catColorMap[cat] || '#64748b') });
    const label = el('span', { class: 'c-secondary truncate flex-1' }, cat);
    const count = el('span', { class: 'text-xs c-muted flex-shrink-0' }, (unreadByCategory[cat] || 0) + '/' + byCat[cat].length);
    catRow.appendChild(colorDot); catRow.appendChild(label); catRow.appendChild(count);
    const active = STATE.activeFilter.category === cat;
    if (active) catRow.style.background = 'var(--bg-active)';
    catRow.addEventListener('click', () => setFilter({ category: cat, feedUrl: null, tag: null, status: null }));
    catListContainer.appendChild(catRow);
    // Individual feeds go in feed-list with category group label
    const groupHeader = el('div', { class: 'flex items-center gap-2 px-2 py-1 text-xs c-muted mt-2 mb-1' });
    const gDot = el('span', { class: 'inline-block w-1.5 h-1.5 rounded-full', style: 'background:' + (catColorMap[cat] || '#64748b') });
    groupHeader.appendChild(gDot);
    groupHeader.appendChild(document.createTextNode(cat + ' · ' + byCat[cat].length + ' 个源'));
    feedList.appendChild(groupHeader);
    byCat[cat].forEach(f => {
      const row = el('div', { class: 'flex items-center gap-2 pl-5 pr-2 py-1 rounded-md cursor-pointer side-item text-xs' });
      const cb = el('input', { type: 'checkbox', class: 'checkbox' });
      cb.checked = !!f.enabled;
      cb.addEventListener('change', async (e) => {
        e.stopPropagation();
        f.enabled = cb.checked;
        await DB.saveFeed(f);
        renderSidebar();
      });
      row.appendChild(cb);
      const nm = el('span', { class: 'c-muted truncate flex-1' }, f.name);
      row.appendChild(nm);
      const cnt = el('span', { class: 'text-xs c-dim flex-shrink-0' }, (unreadByFeed[f.url] || 0) + '');
      row.appendChild(cnt);
      if (STATE.activeFilter.feedUrl === f.url) row.style.background = 'var(--bg-active)';
      row.addEventListener('click', () => setFilter({ feedUrl: f.url, category: null, tag: null, status: null }));
      // action buttons on hover
      const actions = el('span', { class: 'flex items-center gap-1 flex-shrink-0 opacity-0 group-hover:opacity-100' });
      const editBtn = el('button', { class: 'hover:text-brand-400 text-slate-500', title: '编辑' }, svg('i-edit', 12));
      editBtn.addEventListener('click', (e) => { e.stopPropagation(); openFeedModal(f); });
      const delBtn = el('button', { class: 'hover:text-red-400 text-slate-500', title: '删除' }, svg('i-trash', 12));
      delBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm('删除订阅：' + f.name + '？已下载文章保留。')) return;
        await DB.deleteFeed(f.url);
        renderSidebar();
        renderArticles(true);
        toast('已删除', 'success');
      });
      actions.appendChild(editBtn); actions.appendChild(delBtn);
      row.appendChild(actions);
      row.classList.add('group');
      feedList.appendChild(row);
    });
  });
  // Tag cloud – frequency color gradient + font size
  const tagCloud = $('#tag-cloud');
  tagCloud.innerHTML = '';
  const tagCounts = {};
  all.forEach(a => (a.tags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }));
  const sortedTags = Object.entries(tagCounts).sort((a,b) => b[1]-a[1]).slice(0, 30);
  const maxFreq = Math.max(1, ...Object.values(tagCounts));
  function getTagColor(freq) {
    const ratio = maxFreq > 1 ? (freq - 1) / (maxFreq - 1) : 0;
    const h = 220 - Math.round(ratio * 120); // blue (220) to red (100)
    const s = 60 + Math.round(ratio * 20);
    const l = 45 + Math.round(ratio * 10);
    return `hsl(${h}, ${s}%, ${l}%)`;
  }
  if (!sortedTags.length) {
    tagCloud.appendChild(el('span', { class: 'text-xs c-muted px-1' }, '暂无标签'));
  } else {
    sortedTags.forEach(([t, n]) => {
      const color = getTagColor(n);
      const size = 0.65 + (n / maxFreq) * 0.45; // 0.65rem to 1.1rem
      const opacity = 0.6 + (n / maxFreq) * 0.4;
      const pill = el('button', {
        class: 'side-item hover:brightness-110 cursor-pointer rounded-full px-2 py-0.5 border',
        style: `background:${color}18; color:${color}; border-color:${color}33; font-size:${size.toFixed(2)}rem; opacity:${opacity.toFixed(2)}`
      }, t + ' · ' + n);
      if (STATE.activeFilter.tag === t) {
        pill.style.background = color + '44';
        pill.style.borderColor = color;
      }
      pill.addEventListener('click', () => setFilter({ tag: t, feedUrl: null, category: null, status: null }));
      tagCloud.appendChild(pill);
    });
  }
}
function renderSidebarItem(label, count, onClick, active, color) {
  const row = el('div', { class: 'flex items-center gap-2 px-2 py-1.5 rounded-md cursor-pointer side-item text-sm' });
  const dot = el('span', { class: 'inline-block w-2 h-2 rounded-full flex-shrink-0', style: 'background:' + (color || '#3b82f6') });
  const nm = el('span', { class: 'c-secondary truncate flex-1' }, label);
  const cnt = el('span', { class: 'text-xs c-muted flex-shrink-0' }, count + '');
  row.appendChild(dot); row.appendChild(nm); row.appendChild(cnt);
  if (active) row.style.background = 'var(--bg-active)';
  row.addEventListener('click', onClick);
  return row;
}
function setFilter(f) {
  STATE.activeFilter = Object.assign({}, STATE.activeFilter, f);
  renderSidebar();
  renderArticles(true);
}

// ========== Articles List Rendering ==========
async function renderArticles(resetPagination) {
  const container = $('#articles-list');
  const emptyEl = $('#empty-state');
  const loadMoreWrap = $('#load-more-wrap');
  if (resetPagination) STATE.loadedCount = STATE.pageSize;
  else STATE.loadedCount += STATE.pageSize;
  // search filtering
  let searchIds = null;
  if (STATE.searchQuery) {
    searchIds = await SearchIdx.search(STATE.searchQuery);
    if (!searchIds) {
      // fallback linear search
      const all = await DB.getAllArticles();
      const q = STATE.searchQuery.toLowerCase();
      searchIds = new Set(all.filter(a =>
        (a.title || '').toLowerCase().includes(q) ||
        stripHTML(a.description || '').toLowerCase().includes(q) ||
        stripHTML(a.content || '').toLowerCase().includes(q) ||
        (a.feedName || '').toLowerCase().includes(q) ||
        (a.notes || '').toLowerCase().includes(q) ||
        (a.tags || []).some(t => t.toLowerCase().includes(q))
      ).map(a => a.urlHash));
    }
  }
  // fetch from DB with indexes
  const f = STATE.activeFilter;
  const { articles, total } = await DB.queryArticles({
    category: f.category, feedUrl: f.feedUrl, status: f.status,
    tag: f.tag, sortMode: STATE.sortMode,
    offset: 0, limit: STATE.loadedCount
  });
  STATE.currentArticles = articles;
  // Post-filter by search
  let shown = articles;
  if (searchIds && searchIds.size > 0) shown = shown.filter(a => searchIds.has(a.urlHash));
  else if (searchIds && searchIds.size === 0) shown = [];
  container.innerHTML = '';
  if (!shown.length) {
    emptyEl.classList.remove('hidden');
    loadMoreWrap.classList.add('hidden');
    const h3 = emptyEl.querySelector('h3');
    const p = emptyEl.querySelector('p');
    const btn = $('#btn-empty-refresh');
    if (STATE.searchQuery) {
      h3.textContent = '没有搜索结果';
      p.textContent = '未找到匹配「' + STATE.searchQuery + '」的文章，试试其他关键词。';
      btn.classList.add('hidden');
    } else if (f.category || f.feedUrl || f.tag || f.status) {
      h3.textContent = '没有匹配文章';
      p.textContent = '当前筛选条件下没有文章，尝试调整筛选条件。';
      btn.classList.add('hidden');
    } else {
      h3.textContent = '还没有文章';
      p.textContent = '点击右上角"刷新"开始抓取你的订阅源。';
      btn.classList.remove('hidden');
    }
    renderQuickFilters();
    return;
  } else {
    emptyEl.classList.add('hidden');
  }
  const catColorMap = STATE.settings.categories || {};
  shown.forEach(a => container.appendChild(renderArticleCard(a, catColorMap[a.category] || '#64748b')));
  loadMoreWrap.classList.toggle('hidden', total <= STATE.loadedCount);
  renderQuickFilters();
}
function renderArticleCard(a, color) {
  const card = el('div', { class: 'card-panel article-card p-4 cursor-pointer relative overflow-hidden' });
  const bar = el('div', { class: 'absolute left-0 top-0 bottom-0 w-1', style: 'background:' + color });
  card.appendChild(bar);
  const wrap = el('div', { class: 'pl-2' });
  const topRow = el('div', { class: 'flex items-center justify-between text-xs text-slate-500 mb-2' });
  const meta = el('span', { class: 'truncate' }, (a.feedName || a.category || '') + ' · ' + formatRelativeTime(a.pubDate));
  topRow.appendChild(meta);
  const actions = el('span', { class: 'flex items-center gap-2 flex-shrink-0 ml-2' });
  const starBtn = el('button', { class: 'hover:text-amber-400 text-slate-500', title: '收藏' }, svg(a.isStarred ? 'i-star-filled' : 'i-star', 14));
  if (a.isStarred) starBtn.classList.add('text-amber-400');
  starBtn.addEventListener('click', async (e) => { e.stopPropagation(); a.isStarred = !a.isStarred; await DB.saveArticle(a); renderSidebar(); renderArticles(false); SearchIdx.update(a); });
  const laterBtn = el('button', { class: 'hover:text-brand-400 text-slate-500', title: '稍后读' }, svg(a.isLater ? 'i-bookmark-filled' : 'i-bookmark', 14));
  if (a.isLater) laterBtn.classList.add('text-brand-400');
  laterBtn.addEventListener('click', async (e) => { e.stopPropagation(); a.isLater = !a.isLater; await DB.saveArticle(a); renderSidebar(); renderArticles(false); SearchIdx.update(a); });
  const extBtn = el('button', { class: 'hover:text-brand-400 text-slate-500', title: '原文' }, svg('i-external', 14));
  extBtn.addEventListener('click', (e) => { e.stopPropagation(); window.open(a.url, '_blank'); });
  actions.appendChild(starBtn); actions.appendChild(laterBtn); actions.appendChild(extBtn);
  topRow.appendChild(actions);
  wrap.appendChild(topRow);
  const cleanTitle = stripMarkdown(a.title);
  const title = el('h3', { class: 'text-base c-primary mb-2 leading-snug' }, cleanTitle);
  if (!a.isRead) title.classList.add('font-semibold');
  wrap.appendChild(title);
  const desc = el('p', { class: 'text-sm c-muted line-clamp-2' }, truncate(a.description || a.content, 180));
  wrap.appendChild(desc);
  if (a.tags && a.tags.length) {
    const tagRow = el('div', { class: 'flex items-center flex-wrap gap-1 mt-3' });
    a.tags.slice(0, 4).forEach(t => tagRow.appendChild(el('span', { class: 'tag-pill' }, t)));
    wrap.appendChild(tagRow);
  }
  // status indicators
  if (a.isRead) card.style.opacity = '0.75';
  if (a.notes) {
    const nTag = el('span', { class: 'absolute top-2 right-2 text-[10px] c-primary bg-emerald-500/20 px-1.5 py-0.5 rounded border border-emerald-500/30' }, '笔记');
    card.appendChild(nTag);
  }
  card.addEventListener('click', () => openReader(a.urlHash));
  card.appendChild(wrap);
  return card;
}
function renderQuickFilters() {
  const wrap = $('#quick-filters');
  wrap.innerHTML = '';
  const items = [];
  if (STATE.activeFilter.category) items.push({ label: '分类：' + STATE.activeFilter.category, key: 'category' });
  if (STATE.activeFilter.feedUrl) {
    const f = STATE.feeds.find(ff => ff.url === STATE.activeFilter.feedUrl);
    items.push({ label: '来源：' + (f ? f.name : STATE.activeFilter.feedUrl), key: 'feedUrl' });
  }
  if (STATE.activeFilter.tag) items.push({ label: '标签：' + STATE.activeFilter.tag, key: 'tag' });
  if (STATE.activeFilter.status) items.push({ label: '状态：' + ({starred:'收藏',later:'稍后读',unread:'未读'}[STATE.activeFilter.status] || ''), key: 'status' });
  if (STATE.searchQuery) items.push({ label: '搜索：' + STATE.searchQuery, key: 'search' });
  items.forEach(it => {
    const pill = el('button', { class: 'tag-pill flex items-center gap-1' });
    pill.innerHTML = svg('i-x', 10) + it.label;
    pill.addEventListener('click', () => {
      if (it.key === 'search') { STATE.searchQuery = ''; $('#search-input').value = ''; }
      else STATE.activeFilter[it.key] = null;
      renderSidebar(); renderArticles(true);
    });
    wrap.appendChild(pill);
  });
}

// ========== Reader (Full view) ==========
const Reader = {
  current: null,
  timer: null,
  visible: true,
  startTs: 0,
  startTsAccumulated: 0,
  scrollMax: 0,
  async open(urlHash) {
    const a = await DB.getArticle(urlHash);
    if (!a) { toast('文章未找到', 'error'); return; }
    this.current = a;
    this.scrollMax = 0;
    this.startTs = 0;
    this.startTsAccumulated = a.readTime || 0;
    $('#reader-title').textContent = stripMarkdown(a.title);
    $('#reader-meta').textContent = (a.feedName || a.category || '') + ' · ' + formatRelativeTime(a.pubDate);
    const content = $('#reader-content-wrap');
    content.innerHTML = '<div class="skeleton h-6 w-2/3 rounded mb-3"></div><div class="skeleton h-4 w-full rounded mb-2"></div><div class="skeleton h-4 w-full rounded mb-2"></div><div class="skeleton h-4 w-4/5 rounded"></div>';
    this.updateTopIcons();
    $('#reader-notes').value = a.notes || '';
    $('#reader-tags').value = (a.tags || []).join(', ');
    $('#reader-view').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    // fetch full if not yet
    if (!a.fullContentFetched) {
      try {
        const fetchResult = await PROXY.fetch(a.url);

  async close() {
    // Final time accumulation before stopTimer
    if (this.visible && this.current) {

    }
    this.stopTimer();
    // finalize scrollDepth
    try {
      const sc = $('#reader-scroll');
      const max = sc.scrollHeight - sc.clientHeight;
      if (max > 0) this.scrollMax = Math.max(this.scrollMax, sc.scrollTop / max);
    } catch(e){}
    const a = this.current;
    if (a) {
      a.readTime = (this.startTsAccumulated || 0);
      a.scrollDepth = Math.min(1, Math.max(a.scrollDepth || 0, this.scrollMax || 0));
      a.notes = $('#reader-notes').value;

        if (max > 0) this.scrollMax = Math.max(this.scrollMax || 0, sc.scrollTop / max);

// ========== Clear user data ==========
async function clearUserData() {
  if (!confirm('确定清空所有用户数据？\n\n将清除：阅读状态、笔记、标签、收藏、稍后读、阅读时长和滚动深度。\n保留：文章正文、订阅源列表和设置。')) return;
  if (!confirm('此操作不可撤销，确认继续？')) return;
  try {
    const all = await DB.getAllArticles();
    if (!all.length) { toast('没有文章数据', 'info'); return; }
    await DB.init();
    const DB_INST = DB._db;
    const CHUNK = 200;
    for (let i = 0; i < all.length; i += CHUNK) {
      const chunk = all.slice(i, i + CHUNK);
      await new Promise((resolve, reject) => {
        const tx = DB_INST.transaction(['articles'], 'readwrite');
        const store = tx.objectStore('articles');
        chunk.forEach(a => {
          a.isRead = false;
          a.isStarred = false;
          a.isLater = false;
          a.notes = '';
          a.tags = [];
          a.readTime = 0;
          a.scrollDepth = 0;
          store.put(a);
        });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
    }
    // Rebuild search index
    SearchIdx.init();
    SearchIdx.addAll(all);
    renderSidebar();
    renderArticles(true);
    toast('已清空所有用户数据', 'success');
  } catch(err) {
    toast('清空失败：' + err.message, 'error');
  }
}

  if (!Array.isArray(data.feeds)) return '备份文件中缺少订阅源数据(feeds)';
  for (const a of data.articles) { if (!a.urlHash) return '文章数据缺少 urlHash 字段'; }
  return null;
}
async function startImport() {
  const data = _pendingImportFile;
  if (!data) { toast('请先选择 JSON 文件', 'error'); return; }
  const validationError = validateImportData(data);
  if (validationError) { toast(validationError, 'error'); return; }
  const mode = document.querySelector('input[name="import-mode"]:checked').value;
  const conflictKeep = $('#merge-conflict-wrap').classList.contains('hidden') || $('#merge-reading-conflict').value === 'keep';
  const articles = data.articles || [];
  const feeds = data.feeds || [];
  const abortController = new AbortController();
  _importAbortController = abortController;
  $('#btn-import-start').disabled = true;
  $('#btn-import-cancel').classList.remove('hidden');
  $('#btn-import-cancel').addEventListener('click', () => abortController.abort(), { once: true });
  $('#import-progress-wrap').classList.remove('hidden');
  $('#import-progress-text').textContent = '准备中...';
  $('#import-progress-bar').style.width = '0%';
  $('#import-progress-percent').textContent = '0%';
  try {
    if (mode === 'overwrite') {
      await DB.clearArticles();
      await DB.clearFeeds();
      // reset settings
      if (data.categories) STATE.settings.categories = data.categories;
      if (Array.isArray(data.proxies)) STATE.settings.proxies = data.proxies;
      if (Array.isArray(data.rules)) STATE.settings.rules = data.rules;
      if (data.refreshMinutes !== undefined) STATE.settings.refreshMinutes = data.refreshMinutes;
      if (data.fontSize) STATE.settings.fontSize = data.fontSize;
      if (data.theme) STATE.settings.theme = data.theme;
      if (data.runAllRules !== undefined) STATE.settings.runAllRules = data.runAllRules;
      // insert articles in chunks for progress
      const CHUNK = 200;
      let inserted = 0;
      const signal = abortController.signal;
      for (let i = 0; i < articles.length; i += CHUNK) {
        if (signal.aborted) throw new DOMException('Aborted', 'AbortError');
        const chunk = articles.slice(i, i + CHUNK);
        await DB.bulkSaveArticles(chunk);
        inserted += chunk.length;
        const pct = Math.round(inserted / Math.max(1,articles.length) * 100);
        $('#import-progress-bar').style.width = pct + '%';
        $('#import-progress-percent').textContent = pct + '%';
        $('#import-progress-text').textContent = '导入 ' + inserted + '/' + articles.length;
        await new Promise(r => setTimeout(r, 0));
      }
      // feeds
      for (const f of feeds) { if (signal.aborted) throw new DOMException('Aborted', 'AbortError'); await DB.saveFeed(f); }
      saveSettings();
      toast('覆盖导入完成：' + inserted + ' 篇文章', 'success');
    } else {
      // merge — batch mode
      let inserted = 0, updated = 0;
      const CHUNK = 200;
      for (let i = 0; i < articles.length; i += CHUNK) {
        if (abortController.signal.aborted) throw new DOMException('Aborted', 'AbortError');
        const chunk = articles.slice(i, i + CHUNK);
        const result = await DB.bulkMergeImport(chunk, conflictKeep);
        inserted += result.inserted;
        updated += result.updated;
        const done = Math.min(i + CHUNK, articles.length);
        const pct = Math.round(done / Math.max(1, articles.length) * 100);
        $('#import-progress-bar').style.width = pct + '%';
        $('#import-progress-percent').textContent = pct + '%';
        $('#import-progress-text').textContent = '导入 ' + done + '/' + articles.length;
        await new Promise(r => setTimeout(r, 0));
      }
      for (const f of feeds) {
        if (abortController.signal.aborted) throw new DOMException('Aborted', 'AbortError');
        const existing = await DB.getFeed(f.url);
        const merged = Object.assign({}, existing || {}, f, {
          category: f.category || (existing && existing.category) || '',
          enabled: f.enabled !== undefined ? f.enabled : (existing ? existing.enabled : true)
        });
        await DB.saveFeed(merged);
      }
      // settings & rules merge
      if (data.categories) STATE.settings.categories = Object.assign({}, STATE.settings.categories, data.categories);
      if (Array.isArray(data.proxies) && data.proxies.length) STATE.settings.proxies = data.proxies;
      if (Array.isArray(data.rules)) {
        const map = {};
        (STATE.settings.rules || []).forEach(r => { map[r.id || (r.name + r.priority)] = r; });
        data.rules.forEach(r => { map[r.id || (r.name + r.priority)] = r; });
        STATE.settings.rules = Object.values(map);
      }
      saveSettings();
      toast('合并完成：新增 ' + inserted + ' 篇，更新 ' + updated + ' 篇', 'success');
    }
    // rebuild index
    SearchIdx.init();
    const all = await DB.getAllArticles();
    SearchIdx.addAll(all);
    renderSidebar();
    renderArticles(true);
    applyTheme();
    closeModal('import-modal');
  } catch(err) {
    if (err.name === 'AbortError') { toast('导入已中断', 'info'); }
    else { toast('导入失败：' + err.message, 'error'); }
    console.error(err);
  } finally {
    $('#btn-import-start').disabled = false;
    $('#btn-import-cancel').classList.add('hidden');
    _importAbortController = null;
  }
}

// ========== Event bindings ==========
function bindEvents() {
  $('#btn-refresh').addEventListener('click', () => refreshAll(true));
  $('#btn-stats').addEventListener('click', openStats);
  $('#btn-import').addEventListener('click', openImport);
  $('#btn-export').addEventListener('click', exportData);
  $('#btn-settings').addEventListener('click', openSettings);
  $('#btn-theme').addEventListener('click', () => {
    const cur = STATE.settings.theme;
    const next = cur === 'dark' ? 'light' : cur === 'light' ? 'system' : 'dark';
    STATE.settings.theme = next;
    saveSettings(); applyTheme(); setupSystemThemeListener();
  });
  $('#btn-manage-cats').addEventListener('click', openSettings);
  $('#btn-add-feed').addEventListener('click', () => openFeedModal(null));
  $('#feed-modal-save').addEventListener('click', saveFeedFromModal);
  $$('.modal-close, [data-modal-close]').forEach(btn => btn.addEventListener('click', (e) => {
    const m = e.currentTarget.closest('.modal-backdrop') || e.currentTarget.closest('[id$="-modal"]');
    if (m) m.classList.add('hidden');
  }));
  // modal backdrop click to close
  $$('.modal-backdrop').forEach(m => {
    m.addEventListener('click', (e) => { if (e.target === m) m.classList.add('hidden'); });
  });
  // Mobile sidebar toggle
  $('#btn-menu').addEventListener('click', () => {
    const sidebar = $('#sidebar');
    const backdrop = $('#sidebar-backdrop');
    const isOpen = sidebar.classList.contains('open');
    sidebar.classList.toggle('open', !isOpen);
    backdrop.classList.toggle('open', !isOpen);
    document.body.style.overflow = isOpen ? '' : 'hidden';
  });
  $('#sidebar-backdrop').addEventListener('click', () => {
    $('#sidebar').classList.remove('open');
    $('#sidebar-backdrop').classList.remove('open');
    document.body.style.overflow = '';
  });
  // Mobile more dropdown
  const moreBtn = $('#btn-more');
  const moreDropdown = $('#more-dropdown');
  if (moreBtn && moreDropdown) {
    moreBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      moreDropdown.classList.toggle('open');
      if (moreDropdown.classList.contains('open') && !moreDropdown.children.length) {
        moreDropdown.innerHTML = [
          { id: 'btn-mobile-stats', label: '统计', icon: 'i-chart' },
          { id: 'btn-mobile-import', label: '导入备份', icon: 'i-upload' },
          { id: 'btn-mobile-export', label: '导出备份', icon: 'i-download' },
        ].map(b => '<button class="btn btn-ghost w-full justify-start text-sm" onclick="document.getElementById(\'btn-' + b.id.replace('btn-mobile-','') + '\').click()"><svg width="14" height="14" class="mr-2"><use href="#' + b.icon + '"/></svg>' + b.label + '</button>').join('');
      }
    });
    document.addEventListener('click', () => moreDropdown.classList.remove('open'));
  }
  // settings save
  $('#settings-save').addEventListener('click', async () => {
    STATE.settings.proxies = $('#set-proxies').value.split(/\n|,/).map(s => s.trim()).filter(Boolean);
    STATE.settings.refreshMinutes = parseInt($('#set-refresh').value, 10) || 0;
    STATE.settings.fontSize = $('#set-fontsize').value;
    STATE.settings.theme = $('#set-theme').value;
    STATE.settings.runAllRules = $('#set-run-all-rules').checked;
    // apply priority ordering
    (STATE.settings.rules || []).forEach((r, i) => { r.priority = i; });
    saveSettings();
    applyTheme();
    setupSystemThemeListener();
    setRefreshTimer();
    renderSidebar();
    $('#settings-modal').classList.add('hidden');
    toast('设置已保存', 'success');
  });
  $('#btn-add-rule').addEventListener('click', addEmptyRule);
  $('#btn-add-category').addEventListener('click', addEmptyCategory);
  $('#btn-clear-user-data').addEventListener('click', clearUserData);
  // Reader
  $('#reader-close').addEventListener('click', closeReader);
  $('#reader-star').addEventListener('click', async () => {
    if (!Reader.current) return;
    Reader.current.isStarred = !Reader.current.isStarred;
    await DB.saveArticle(Reader.current);
    Reader.updateTopIcons();
    renderSidebar(); renderArticles(false);
    SearchIdx.update(Reader.current);
  });
  $('#reader-later').addEventListener('click', async () => {
    if (!Reader.current) return;
    Reader.current.isLater = !Reader.current.isLater;
    await DB.saveArticle(Reader.current);
    Reader.updateTopIcons();
    renderSidebar(); renderArticles(false);
    SearchIdx.update(Reader.current);
  });
  $('#reader-external').addEventListener('click', () => { if (Reader.current) window.open(Reader.current.url, '_blank'); });
  $('#reader-copy').addEventListener('click', async () => {
    if (!Reader.current) return;
    const text = (Reader.current.title || '') + '\n\n' + stripHTML(Reader.current.content || Reader.current.description || '') + '\n\n来源：' + (Reader.current.feedName || '') + '\n原文：' + Reader.current.url;
    try {
      await navigator.clipboard.writeText(text);
      toast('已复制全文到剪贴板', 'success');
    } catch(err) {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('已复制全文到剪贴板', 'success'); } catch(e){ toast('复制失败', 'error'); }
      document.body.removeChild(ta);
    }
  });
  const notesSave = debounce(async () => {
    if (!Reader.current) return;
    Reader.current.notes = $('#reader-notes').value;
    await DB.saveArticle(Reader.current);
    SearchIdx.update(Reader.current);
  }, 1000);
  $('#reader-notes').addEventListener('input', notesSave);
  const tagsSave = debounce(async () => {
    if (!Reader.current) return;
    const raw = $('#reader-tags').value || '';
    Reader.current.tags = raw.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    await DB.saveArticle(Reader.current);
    SearchIdx.update(Reader.current);
    renderSidebar();
  }, 1000);
  $('#reader-tags').addEventListener('input', tagsSave);
  // import file
  $('#import-file').addEventListener('change', onImportFileSelected);
  document.querySelectorAll('input[name="import-mode"]').forEach(r => r.addEventListener('change', onImportModeChange));
  $('#btn-import-start').addEventListener('click', startImport);
  $('#btn-empty-refresh').addEventListener('click', () => refreshAll(true));
  // search
  $('#search-input').addEventListener('input', debounce(async (e) => {
    STATE.searchQuery = (e.target.value || '').trim();
    renderArticles(true);
  }, 300));
  $('#sort-select').addEventListener('change', (e) => {
    STATE.sortMode = e.target.value;
    try { localStorage.setItem('smartrss_sort', STATE.sortMode); } catch(e){}
    renderArticles(true);
  });
  $('#btn-load-more').addEventListener('click', () => renderArticles(false));
  // ESC key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      // close reader if open
      if (!$('#reader-view').classList.contains('hidden')) { closeReader(); return; }
      // close any open modal
      const openModal = document.querySelector('.modal-backdrop:not(.hidden)');
      if (openModal) openModal.classList.add('hidden');
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'r') {
      e.preventDefault(); refreshAll(true);
    }
  });
  // Page Visibility
  document.addEventListener('visibilitychange', () => {
    if (Reader.current) {
      if (document.hidden) { Reader.visible = false; }
      else { Reader.visible = true; Reader.startTs = Date.now(); }
    }
  });
  // Reader content links: open all in new tab (defense-in-depth)
  $('#reader-content-wrap').addEventListener('click', (e) => {
    const link = e.target.closest('a');
    if (link && link.href && !link.href.startsWith('#')) {
      e.preventDefault();
      window.open(link.href, '_blank', 'noopener,noreferrer');
    }
  });
}

// ========== Auto refresh timer ==========
function setRefreshTimer() {
  if (STATE._timer) { clearInterval(STATE._timer); STATE._timer = null; }
  const m = STATE.settings.refreshMinutes;
  if (m && m > 0) {
    STATE._timer = setInterval(() => refreshAll(false), m * 60 * 1000);
  }
}

// ========== Boot ==========
async function boot() {
  loadSettings();
  applyTheme();
  setupSystemThemeListener();
  await DB.init();
  SearchIdx.init();
  await addDefaultFeedsIfNeeded();
  const all = await DB.getAllArticles();
  SearchIdx.addAll(all);
  bindEvents();
  await renderSidebar();
  await renderArticles(true);
  setRefreshTimer();
  // beforeunload: flush any pending debounced saves
  window.addEventListener('beforeunload', () => {
    if (Reader.current) {
      if (Reader.visible) Reader.startTsAccumulated = (Reader.startTsAccumulated || 0) + (Date.now() - Reader.startTs) / 1000;
      Reader.stopTimer();
      Reader.current.readTime = Reader.startTsAccumulated || 0;
      Reader.current.notes = $('#reader-notes')?.value || Reader.current.notes;
      DB.saveArticle(Reader.current).catch(()=>{});
    }
  });
}
// expose
window.SmartRSS = { refreshAll, openReader, boot };
document.addEventListener('DOMContentLoaded', boot);
})();
</script>
