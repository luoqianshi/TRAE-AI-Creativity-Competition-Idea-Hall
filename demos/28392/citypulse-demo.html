<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城脉 CityPulse — 城市生活脉动交互地图</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg-deep: #0a0e17;
    --bg-mid: #111827;
    --bg-card: rgba(17, 24, 39, 0.85);
    --accent-cyan: #00f0ff;
    --accent-warm: #ff6b35;
    --accent-pink: #ff2d7b;
    --accent-green: #39ff8e;
    --accent-purple: #a855f7;
    --text-primary: #f0f4f8;
    --text-secondary: #8899aa;
    --text-dim: #4a5568;
    --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.3);
    --glow-warm: 0 0 20px rgba(255, 107, 53, 0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* ===== MAP CANVAS ===== */
  #mapCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  /* ===== GRID OVERLAY ===== */
  .grid-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* ===== TOP BAR ===== */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    background: linear-gradient(180deg, rgba(10,14,23,0.95) 0%, rgba(10,14,23,0) 100%);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 900;
    box-shadow: var(--glow-cyan);
  }

  .logo-text {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent-cyan), #fff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .logo-sub {
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .search-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(0,240,255,0.15);
    border-radius: 12px;
    padding: 10px 20px;
    width: 380px;
    backdrop-filter: blur(20px);
    transition: all 0.3s ease;
  }

  .search-box:focus-within {
    border-color: var(--accent-cyan);
    box-shadow: var(--glow-cyan);
  }

  .search-box svg { width: 18px; height: 18px; color: var(--text-secondary); flex-shrink: 0; }

  .search-box input {
    background: none;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 14px;
    width: 100%;
    font-family: inherit;
  }

  .search-box input::placeholder { color: var(--text-dim); }

  .top-actions {
    display: flex;
    gap: 8px;
  }

  .top-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 8px 16px;
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .top-btn:hover {
    background: rgba(0,240,255,0.1);
    border-color: rgba(0,240,255,0.3);
    color: var(--accent-cyan);
  }

  .top-btn.active {
    background: rgba(0,240,255,0.12);
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }

  /* ===== TIME CONTROLLER ===== */
  .time-controller {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: min(720px, 90vw);
  }

  .time-display {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .time-value {
    font-family: 'Space Mono', monospace;
    font-size: 48px;
    font-weight: 700;
    color: var(--accent-cyan);
    text-shadow: 0 0 30px rgba(0,240,255,0.4);
    letter-spacing: 4px;
  }

  .time-period {
    font-size: 16px;
    color: var(--accent-warm);
    font-weight: 500;
    letter-spacing: 2px;
  }

  .time-slider-wrap {
    width: 100%;
    position: relative;
    padding: 8px 0;
  }

  .time-marks {
    display: flex;
    justify-content: space-between;
    padding: 0 4px;
    margin-bottom: 8px;
  }

  .time-mark {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    cursor: pointer;
    transition: color 0.2s;
    padding: 2px 4px;
    border-radius: 4px;
  }

  .time-mark:hover, .time-mark.active {
    color: var(--accent-cyan);
  }

  .time-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg,
      #1a1a3e 0%,
      #2d1b4e 15%,
      var(--accent-warm) 25%,
      var(--accent-cyan) 40%,
      var(--accent-cyan) 60%,
      var(--accent-warm) 75%,
      #2d1b4e 85%,
      #1a1a3e 100%
    );
    outline: none;
    cursor: pointer;
  }

  .time-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent-cyan);
    box-shadow: 0 0 20px rgba(0,240,255,0.6), inset 0 0 4px rgba(255,255,255,0.4);
    cursor: grab;
    border: 2px solid rgba(255,255,255,0.3);
  }

  .time-slider::-webkit-slider-thumb:active { cursor: grabbing; }

  .time-labels {
    display: flex;
    justify-content: space-between;
    padding: 0 4px;
    margin-top: 6px;
  }

  .time-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .play-btn {
    position: absolute;
    right: -60px;
    top: 50%;
    transform: translateY(-50%);
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(0,240,255,0.15);
    border: 1px solid rgba(0,240,255,0.3);
    color: var(--accent-cyan);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
  }

  .play-btn:hover {
    background: rgba(0,240,255,0.25);
    box-shadow: var(--glow-cyan);
  }

  /* ===== LEFT PANEL ===== */
  .left-panel {
    position: absolute;
    top: 80px;
    left: 20px;
    z-index: 100;
    width: 280px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .pulse-card {
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 18px;
    transition: all 0.3s ease;
  }

  .pulse-card:hover {
    border-color: rgba(0,240,255,0.2);
  }

  .pulse-card-title {
    font-size: 12px;
    color: var(--text-secondary);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pulse-card-title .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent-cyan);
    animation: pulse-dot 2s infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
  }

  .category-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .category-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .category-item:hover {
    background: rgba(255,255,255,0.04);
    color: var(--text-primary);
  }

  .category-item.active {
    background: rgba(0,240,255,0.08);
    color: var(--accent-cyan);
  }

  .cat-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .cat-count {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  /* ===== RIGHT PANEL ===== */
  .right-panel {
    position: absolute;
    top: 80px;
    right: 20px;
    z-index: 100;
    width: 300px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .stat-row {
    display: flex;
    gap: 10px;
  }

  .stat-box {
    flex: 1;
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
  }

  .stat-value {
    font-family: 'Space Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .hotspot-card {
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 18px;
  }

  .hotspot-card-title {
    font-size: 12px;
    color: var(--text-secondary);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .hotspot-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .hotspot-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
    cursor: pointer;
    transition: all 0.25s;
  }

  .hotspot-item:hover {
    background: rgba(0,240,255,0.06);
    border-color: rgba(0,240,255,0.15);
    transform: translateX(-4px);
  }

  .hotspot-rank {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    width: 24px;
    text-align: center;
  }

  .hotspot-rank.top { color: var(--accent-warm); }
  .hotspot-rank.mid { color: var(--accent-cyan); }

  .hotspot-info { flex: 1; }

  .hotspot-name {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 2px;
  }

  .hotspot-desc {
    font-size: 11px;
    color: var(--text-dim);
  }

  .hotspot-pulse {
    width: 8px; height: 8px;
    border-radius: 50%;
    animation: pulse-glow 1.5s infinite;
  }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 4px currentColor; transform: scale(1); }
    50% { box-shadow: 0 0 12px currentColor; transform: scale(1.3); }
  }

  /* ===== TOOLTIP ===== */
  .map-tooltip {
    position: absolute;
    z-index: 200;
    background: rgba(10,14,23,0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(0,240,255,0.2);
    border-radius: 14px;
    padding: 16px;
    min-width: 200px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
  }

  .map-tooltip.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .tooltip-name {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .tooltip-type {
    font-size: 11px;
    color: var(--accent-cyan);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .tooltip-bar-wrap {
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 6px;
  }

  .tooltip-bar {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  .tooltip-meta {
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }

  /* ===== INTRO OVERLAY ===== */
  .intro-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 500;
    background: var(--bg-deep);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease, visibility 0.8s;
  }

  .intro-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .intro-title {
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-warm));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
    animation: intro-glow 3s ease-in-out infinite;
  }

  @keyframes intro-glow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }

  .intro-sub {
    font-size: 18px;
    color: var(--text-secondary);
    letter-spacing: 6px;
    margin-bottom: 40px;
  }

  .intro-desc {
    max-width: 520px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 48px;
  }

  .intro-btn {
    padding: 14px 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
    border: none;
    color: var(--bg-deep);
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 4px;
    transition: all 0.3s;
    box-shadow: 0 0 30px rgba(0,240,255,0.3);
  }

  .intro-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 50px rgba(0,240,255,0.5);
  }

  /* ===== LEGEND ===== */
  .legend {
    position: absolute;
    bottom: 120px;
    right: 20px;
    z-index: 100;
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 14px 18px;
  }

  .legend-title {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .legend-gradient {
    width: 160px;
    height: 8px;
    border-radius: 4px;
    background: linear-gradient(90deg, #1a1a3e, #2d1b4e, var(--accent-warm), var(--accent-cyan));
    margin-bottom: 6px;
  }

  .legend-labels {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--text-dim);
    font-family: 'Space Mono', monospace;
  }

  /* ===== ANIMATIONS ===== */
  @keyframes float-in-left {
    from { opacity: 0; transform: translateX(-30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes float-in-right {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes float-in-up {
    from { opacity: 0; transform: translateX(-50%) translateY(30px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .left-panel { animation: float-in-left 0.6s ease-out 0.3s both; }
  .right-panel { animation: float-in-right 0.6s ease-out 0.4s both; }
  .time-controller { animation: float-in-up 0.6s ease-out 0.5s both; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    .left-panel { display: none; }
    .right-panel { width: 220px; }
    .search-box { width: 240px; }
  }

  @media (max-width: 600px) {
    .right-panel { display: none; }
    .search-box { width: 180px; }
    .legend { display: none; }
    .intro-title { font-size: 36px; letter-spacing: 4px; }
    .intro-sub { font-size: 14px; }
  }
</style>
</head>
<body>

<!-- INTRO OVERLAY -->
<div class="intro-overlay" id="introOverlay">
  <div class="intro-title">城脉</div>
  <div class="intro-sub">CITY PULSE</div>
  <div class="intro-desc">
    每座城市都有自己的呼吸节奏。<br>
    清晨的早餐街、午间的商务区、深夜的宵夜巷——<br>
    拖动时间轴，感受城市 24 小时的脉动。
  </div>
  <button class="intro-btn" onclick="enterApp()">探索城市</button>
</div>

<!-- MAP CANVAS -->
<canvas id="mapCanvas"></canvas>
<div class="grid-overlay"></div>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="logo">
    <div class="logo-icon">脉</div>
    <div>
      <div class="logo-text">城脉 CityPulse</div>
      <div class="logo-sub">城市生活脉动地图</div>
    </div>
  </div>
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" placeholder="搜索地点、商圈、活动..." id="searchInput">
  </div>
  <div class="top-actions">
    <button class="top-btn active" onclick="setView('heat')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
      热力
    </button>
    <button class="top-btn" onclick="setView('flow')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      脉流
    </button>
    <button class="top-btn" onclick="setView('story')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
      故事
    </button>
  </div>
</div>

<!-- LEFT PANEL -->
<div class="left-panel">
  <div class="pulse-card">
    <div class="pulse-card-title"><span class="dot"></span> 生活分类</div>
    <div class="category-list" id="categoryList">
      <div class="category-item active" data-cat="food" onclick="toggleCategory(this)">
        <span class="cat-dot" style="background:var(--accent-warm)"></span>
        餐饮美食
        <span class="cat-count">128</span>
      </div>
      <div class="category-item active" data-cat="night" onclick="toggleCategory(this)">
        <span class="cat-dot" style="background:var(--accent-pink)"></span>
        夜生活
        <span class="cat-count">67</span>
      </div>
      <div class="category-item active" data-cat="work" onclick="toggleCategory(this)">
        <span class="cat-dot" style="background:var(--accent-cyan)"></span>
        办公商务
        <span class="cat-count">93</span>
      </div>
      <div class="category-item" data-cat="sport" onclick="toggleCategory(this)">
        <span class="cat-dot" style="background:var(--accent-green)"></span>
        运动健身
        <span class="cat-count">45</span>
      </div>
      <div class="category-item" data-cat="culture" onclick="toggleCategory(this)">
        <span class="cat-dot" style="background:var(--accent-purple)"></span>
        文化艺术
        <span class="cat-count">38</span>
      </div>
    </div>
  </div>

  <div class="pulse-card">
    <div class="pulse-card-title"><span class="dot" style="background:var(--accent-warm)"></span> 当前时段</div>
    <div style="display:flex; align-items:baseline; gap:8px; margin-bottom:8px;">
      <span id="periodLabel" style="font-size:22px; font-weight:700; color:var(--accent-warm);">深夜食堂</span>
    </div>
    <div id="periodDesc" style="font-size:12px; color:var(--text-dim); line-height:1.6;">
      城市进入深夜模式，宵夜街区和酒吧区域最为活跃，24小时便利店成为城市灯塔。
    </div>
  </div>
</div>

<!-- RIGHT PANEL -->
<div class="right-panel">
  <div class="stat-row">
    <div class="stat-box">
      <div class="stat-value" style="color:var(--accent-cyan)" id="statActive">186</div>
      <div class="stat-label">活跃区域</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" style="color:var(--accent-warm)" id="statHot">23</div>
      <div class="stat-label">热点商圈</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" style="color:var(--accent-green)" id="stat24h">41</div>
      <div class="stat-label">24H服务</div>
    </div>
  </div>

  <div class="hotspot-card">
    <div class="hotspot-card-title">
      <span class="dot" style="background:var(--accent-warm)"></span>
      <span id="hotspotTitle">深夜热门</span>
    </div>
    <div class="hotspot-list" id="hotspotList">
      <!-- Filled by JS -->
    </div>
  </div>
</div>

<!-- LEGEND -->
<div class="legend">
  <div class="legend-title">活力指数</div>
  <div class="legend-gradient"></div>
  <div class="legend-labels">
    <span>低</span>
    <span>中</span>
    <span>高</span>
  </div>
</div>

<!-- TIME CONTROLLER -->
<div class="time-controller">
  <div class="time-display">
    <span class="time-value" id="timeValue">02:00</span>
    <span class="time-period" id="timePeriod">深夜</span>
  </div>
  <div class="time-slider-wrap">
    <div class="time-marks" id="timeMarks"></div>
    <input type="range" class="time-slider" id="timeSlider" min="0" max="1440" value="120" step="5">
    <div class="time-labels">
      <span class="time-label">00:00</span>
      <span class="time-label">06:00</span>
      <span class="time-label">12:00</span>
      <span class="time-label">18:00</span>
      <span class="time-label">24:00</span>
    </div>
    <button class="play-btn" id="playBtn" onclick="togglePlay()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
    </button>
  </div>
</div>

<!-- MAP TOOLTIP -->
<div class="map-tooltip" id="mapTooltip">
  <div class="tooltip-name" id="tooltipName"></div>
  <div class="tooltip-type" id="tooltipType"></div>
  <div class="tooltip-bar-wrap"><div class="tooltip-bar" id="tooltipBar"></div></div>
  <div class="tooltip-meta">
    <span id="tooltipActivity"></span>
    <span id="tooltipPeak"></span>
  </div>
</div>

<script>
// ===== DATA =====
const districts = [
  { name: '簋街夜市', x: 0.35, y: 0.28, cat: 'food', peak: 22, spread: 4, intensity: 0.95, desc: '深夜龙虾烧烤一条街' },
  { name: '三里屯', x: 0.62, y: 0.32, cat: 'night', peak: 23, spread: 5, intensity: 0.92, desc: '京城夜生活地标' },
  { name: '国贸CBD', x: 0.58, y: 0.45, cat: 'work', peak: 11, spread: 3, intensity: 0.88, desc: '核心商务办公区' },
  { name: '望京SOHO', x: 0.72, y: 0.25, cat: 'work', peak: 10, spread: 3, intensity: 0.75, desc: '互联网企业聚集地' },
  { name: '南锣鼓巷', x: 0.45, y: 0.35, cat: 'culture', peak: 14, spread: 4, intensity: 0.82, desc: '胡同文化体验区' },
  { name: '五道口', x: 0.55, y: 0.18, cat: 'food', peak: 12, spread: 3, intensity: 0.70, desc: '高校周边美食圈' },
  { name: '后海酒吧街', x: 0.40, y: 0.38, cat: 'night', peak: 22, spread: 4, intensity: 0.85, desc: '湖畔夜生活聚集地' },
  { name: '中关村', x: 0.48, y: 0.20, cat: 'work', peak: 11, spread: 3, intensity: 0.80, desc: '科技创新中心' },
  { name: '朝阳公园', x: 0.68, y: 0.40, cat: 'sport', peak: 8, spread: 4, intensity: 0.60, desc: '晨跑健身热门地' },
  { name: '798艺术区', x: 0.75, y: 0.35, cat: 'culture', peak: 14, spread: 4, intensity: 0.72, desc: '当代艺术展览区' },
  { name: '牛街', x: 0.32, y: 0.50, cat: 'food', peak: 7, spread: 3, intensity: 0.78, desc: '清真早餐老字号' },
  { name: '西单商圈', x: 0.38, y: 0.45, cat: 'food', peak: 14, spread: 4, intensity: 0.76, desc: '购物餐饮综合体' },
  { name: '亮马河', x: 0.65, y: 0.38, cat: 'night', peak: 21, spread: 3, intensity: 0.68, desc: '滨河夜经济带' },
  { name: '奥森公园', x: 0.50, y: 0.12, cat: 'sport', peak: 7, spread: 3, intensity: 0.65, desc: '晨练跑步圣地' },
  { name: '工体', x: 0.60, y: 0.42, cat: 'night', peak: 22, spread: 4, intensity: 0.90, desc: '演唱会夜店聚集' },
  { name: '大望路', x: 0.55, y: 0.52, cat: 'work', peak: 9, spread: 3, intensity: 0.70, desc: '通勤枢纽商务区' },
  { name: '前门大街', x: 0.42, y: 0.48, cat: 'culture', peak: 15, spread: 4, intensity: 0.74, desc: '老北京文化街区' },
  { name: '合生汇', x: 0.60, y: 0.55, cat: 'food', peak: 19, spread: 3, intensity: 0.80, desc: '深夜食堂聚集地' },
  { name: '地坛公园', x: 0.45, y: 0.28, cat: 'sport', peak: 7, spread: 2, intensity: 0.55, desc: '晨练太极好去处' },
  { name: '世贸天阶', x: 0.63, y: 0.48, cat: 'night', peak: 20, spread: 3, intensity: 0.65, desc: '时尚夜生活商圈' },
];

// Road network (simplified)
const roads = [
  // Horizontal
  { x1: 0.1, y1: 0.3, x2: 0.9, y2: 0.3 },
  { x1: 0.1, y1: 0.45, x2: 0.9, y2: 0.45 },
  { x1: 0.15, y1: 0.2, x2: 0.85, y2: 0.2 },
  { x1: 0.15, y1: 0.55, x2: 0.85, y2: 0.55 },
  { x1: 0.2, y1: 0.38, x2: 0.8, y2: 0.38 },
  { x1: 0.2, y1: 0.50, x2: 0.8, y2: 0.50 },
  // Vertical
  { x1: 0.3, y1: 0.08, x2: 0.3, y2: 0.65 },
  { x1: 0.45, y1: 0.08, x2: 0.45, y2: 0.65 },
  { x1: 0.6, y1: 0.08, x2: 0.6, y2: 0.65 },
  { x1: 0.75, y1: 0.08, x2: 0.75, y2: 0.65 },
  { x1: 0.38, y1: 0.1, x2: 0.38, y2: 0.6 },
  { x1: 0.52, y1: 0.1, x2: 0.52, y2: 0.6 },
  { x1: 0.68, y1: 0.1, x2: 0.68, y2: 0.6 },
  // Ring road
  { x1: 0.25, y1: 0.15, x2: 0.25, y2: 0.58 },
  { x1: 0.80, y1: 0.15, x2: 0.80, y2: 0.58 },
  { x1: 0.25, y1: 0.15, x2: 0.80, y2: 0.15 },
  { x1: 0.25, y1: 0.58, x2: 0.80, y2: 0.58 },
];

const catColors = {
  food: '#ff6b35',
  night: '#ff2d7b',
  work: '#00f0ff',
  sport: '#39ff8e',
  culture: '#a855f7'
};

const catNames = {
  food: '餐饮美食',
  night: '夜生活',
  work: '办公商务',
  sport: '运动健身',
  culture: '文化艺术'
};

const periodData = [
  { start: 0, end: 5, label: '深夜', period: '深夜食堂', desc: '城市进入深夜模式，宵夜街区和酒吧区域最为活跃，24小时便利店成为城市灯塔。' },
  { start: 5, end: 8, label: '清晨', period: '晨光初照', desc: '早餐铺子升起第一缕炊烟，公园里晨练的老人和早起的通勤者构成城市最早的脉搏。' },
  { start: 8, end: 11, label: '上午', period: '通勤高峰', desc: '商务区人流密集，写字楼咖啡店排起长队，城市引擎全速运转。' },
  { start: 11, end: 14, label: '午间', period: '午间觅食', desc: '午餐高峰到来，外卖骑手穿梭大街小巷，商圈餐厅一座难求。' },
  { start: 14, end: 17, label: '下午', period: '休闲时光', desc: '咖啡馆和书店迎来客流，文化展览和艺术空间进入活跃期。' },
  { start: 17, end: 20, label: '傍晚', period: '日落归途', desc: '下班人潮涌入地铁站，晚餐聚餐开始，城市从工作模式切换到生活模式。' },
  { start: 20, end: 24, label: '夜晚', period: '夜幕降临', desc: '夜经济全面启动，酒吧街灯火通明，深夜食堂飘出诱人香气。' },
];

// ===== STATE =====
let currentMinute = 120;
let isPlaying = false;
let playInterval = null;
let activeCategories = new Set(['food', 'night', 'work']);
let currentView = 'heat';
let hoveredDistrict = null;
let mouseX = 0, mouseY = 0;

// ===== CANVAS =====
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ===== HELPERS =====
function getHour() { return currentMinute / 60; }

function getDistrictActivity(d, hour) {
  const diff = Math.abs(hour - d.peak);
  const wrapped = Math.min(diff, 24 - diff);
  const normalized = Math.max(0, 1 - wrapped / d.spread);
  return normalized * normalized * d.intensity;
}

function getPeriodInfo(hour) {
  for (const p of periodData) {
    if (hour >= p.start && hour < p.end) return p;
  }
  return periodData[0];
}

function formatTime(minute) {
  const h = Math.floor(minute / 60) % 24;
  const m = minute % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

// ===== RENDERING =====
function drawRoads() {
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.06)';
  ctx.lineWidth = 1.5;
  for (const r of roads) {
    ctx.beginPath();
    ctx.moveTo(r.x1 * canvas.width, r.y1 * canvas.height);
    ctx.lineTo(r.x2 * canvas.width, r.y2 * canvas.height);
    ctx.stroke();
  }
}

function drawHeatmap(hour) {
  for (const d of districts) {
    if (!activeCategories.has(d.cat)) continue;
    const activity = getDistrictActivity(d, hour);
    if (activity < 0.05) continue;

    const cx = d.x * canvas.width;
    const cy = d.y * canvas.height;
    const baseRadius = 40 + activity * 80;
    const color = catColors[d.cat];

    // Parse color
    const r = parseInt(color.slice(1, 3), 16);
    const g = parseInt(color.slice(3, 5), 16);
    const b = parseInt(color.slice(5, 7), 16);

    // Outer glow
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseRadius);
    grad.addColorStop(0, `rgba(${r},${g},${b},${activity * 0.5})`);
    grad.addColorStop(0.4, `rgba(${r},${g},${b},${activity * 0.2})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
    ctx.fill();

    // Core dot
    const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 8);
    coreGrad.addColorStop(0, `rgba(${r},${g},${b},${0.8 + activity * 0.2})`);
    coreGrad.addColorStop(1, `rgba(${r},${g},${b},0.3)`);
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, Math.PI * 2);
    ctx.fill();

    // Pulsing ring
    const pulsePhase = (Date.now() / 1000 + d.x * 10) % 1;
    const pulseRadius = 8 + pulsePhase * 30 * activity;
    const pulseAlpha = (1 - pulsePhase) * activity * 0.3;
    ctx.strokeStyle = `rgba(${r},${g},${b},${pulseAlpha})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, pulseRadius, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawFlowParticles(hour) {
  if (currentView !== 'flow') return;
  const t = Date.now() / 1000;

  for (const d of districts) {
    if (!activeCategories.has(d.cat)) continue;
    const activity = getDistrictActivity(d, hour);
    if (activity < 0.2) continue;

    const cx = d.x * canvas.width;
    const cy = d.y * canvas.height;
    const color = catColors[d.cat];
    const r = parseInt(color.slice(1, 3), 16);
    const g = parseInt(color.slice(3, 5), 16);
    const b = parseInt(color.slice(5, 7), 16);

    const count = Math.floor(activity * 8);
    for (let i = 0; i < count; i++) {
      const angle = (t * 0.5 + i * Math.PI * 2 / count + d.x * 5) % (Math.PI * 2);
      const dist = 20 + Math.sin(t * 2 + i) * 15 + activity * 30;
      const px = cx + Math.cos(angle) * dist;
      const py = cy + Math.sin(angle) * dist;
      const alpha = activity * 0.6 * (0.5 + 0.5 * Math.sin(t * 3 + i));

      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.beginPath();
      ctx.arc(px, py, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawLabels(hour) {
  ctx.font = '500 11px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'center';

  for (const d of districts) {
    if (!activeCategories.has(d.cat)) continue;
    const activity = getDistrictActivity(d, hour);
    if (activity < 0.15) continue;

    const cx = d.x * canvas.width;
    const cy = d.y * canvas.height;
    const alpha = Math.min(1, activity * 1.5);

    ctx.fillStyle = `rgba(240,244,248,${alpha * 0.8})`;
    ctx.fillText(d.name, cx, cy - 16);
  }
}

function drawMouseGlow() {
  const grad = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 120);
  grad.addColorStop(0, 'rgba(0,240,255,0.04)');
  grad.addColorStop(1, 'rgba(0,240,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(mouseX, mouseY, 120, 0, Math.PI * 2);
  ctx.fill();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background gradient
  const bgGrad = ctx.createRadialGradient(
    canvas.width * 0.5, canvas.height * 0.4, 0,
    canvas.width * 0.5, canvas.height * 0.4, canvas.width * 0.7
  );
  bgGrad.addColorStop(0, '#111827');
  bgGrad.addColorStop(1, '#0a0e17');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawRoads();
  drawHeatmap(getHour());
  drawFlowParticles(getHour());
  drawLabels(getHour());
  drawMouseGlow();

  requestAnimationFrame(render);
}

// ===== UI UPDATES =====
function updateUI() {
  const hour = getHour();
  const period = getPeriodInfo(hour);

  document.getElementById('timeValue').textContent = formatTime(currentMinute);
  document.getElementById('timePeriod').textContent = period.label;
  document.getElementById('periodLabel').textContent = period.period;
  document.getElementById('periodDesc').textContent = period.desc;

  // Stats
  let active = 0, hot = 0, h24 = 0;
  for (const d of districts) {
    if (!activeCategories.has(d.cat)) continue;
    const a = getDistrictActivity(d, hour);
    if (a > 0.1) active++;
    if (a > 0.6) hot++;
    if (a > 0.3) h24++;
  }
  document.getElementById('statActive').textContent = active;
  document.getElementById('statHot').textContent = hot;
  document.getElementById('stat24h').textContent = h24;

  // Hotspots
  const sorted = districts
    .filter(d => activeCategories.has(d.cat))
    .map(d => ({ ...d, activity: getDistrictActivity(d, hour) }))
    .filter(d => d.activity > 0.1)
    .sort((a, b) => b.activity - a.activity)
    .slice(0, 5);

  document.getElementById('hotspotTitle').textContent = `${period.period}热门`;
  const list = document.getElementById('hotspotList');
  list.innerHTML = sorted.map((d, i) => `
    <div class="hotspot-item" onmouseenter="highlightDistrict('${d.name}')" onmouseleave="unhighlightDistrict()">
      <span class="hotspot-rank ${i < 2 ? 'top' : 'mid'}">${i + 1}</span>
      <div class="hotspot-info">
        <div class="hotspot-name">${d.name}</div>
        <div class="hotspot-desc">${d.desc}</div>
      </div>
      <span class="hotspot-pulse" style="color:${catColors[d.cat]}; background:${catColors[d.cat]}"></span>
    </div>
  `).join('');
}

// ===== INTERACTIONS =====
function enterApp() {
  document.getElementById('introOverlay').classList.add('hidden');
}

const slider = document.getElementById('timeSlider');
slider.addEventListener('input', () => {
  currentMinute = parseInt(slider.value);
  updateUI();
});

function togglePlay() {
  isPlaying = !isPlaying;
  const btn = document.getElementById('playBtn');
  if (isPlaying) {
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
    playInterval = setInterval(() => {
      currentMinute = (currentMinute + 10) % 1440;
      slider.value = currentMinute;
      updateUI();
    }, 80);
  } else {
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>';
    clearInterval(playInterval);
  }
}

function toggleCategory(el) {
  const cat = el.dataset.cat;
  el.classList.toggle('active');
  if (activeCategories.has(cat)) {
    activeCategories.delete(cat);
  } else {
    activeCategories.add(cat);
  }
  updateUI();
}

function setView(view) {
  currentView = view;
  document.querySelectorAll('.top-btn').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
}

function highlightDistrict(name) {
  hoveredDistrict = name;
}

function unhighlightDistrict() {
  hoveredDistrict = null;
  document.getElementById('mapTooltip').classList.remove('visible');
}

canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;

  const hour = getHour();
  let found = null;
  for (const d of districts) {
    if (!activeCategories.has(d.cat)) continue;
    const dx = d.x * canvas.width - e.clientX;
    const dy = d.y * canvas.height - e.clientY;
    if (Math.sqrt(dx * dx + dy * dy) < 30) {
      found = d;
      break;
    }
  }

  const tooltip = document.getElementById('mapTooltip');
  if (found) {
    const activity = getDistrictActivity(found, hour);
    tooltip.classList.add('visible');
    tooltip.style.left = (e.clientX + 20) + 'px';
    tooltip.style.top = (e.clientY - 20) + 'px';
    document.getElementById('tooltipName').textContent = found.name;
    document.getElementById('tooltipType').textContent = catNames[found.cat];
    const bar = document.getElementById('tooltipBar');
    bar.style.width = (activity * 100) + '%';
    bar.style.background = catColors[found.cat];
    document.getElementById('tooltipActivity').textContent = `活力 ${Math.round(activity * 100)}%`;
    document.getElementById('tooltipPeak').textContent = `高峰 ${found.peak}:00`;
  } else {
    tooltip.classList.remove('visible');
  }
});

// ===== INIT =====
updateUI();
render();
</script>
